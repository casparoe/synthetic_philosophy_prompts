answer: |-
  Right then, let's dissect this "physics leaves something out" slogan as it pertains to consciousness. You're spot on – it's often wielded vaguely. As an expert in philosophy of mind, I'll map out the precise claims it *could* be making, assess their seriousness and support for anti-physicalism, and flag the consensus versus contested areas. We'll use Mary the super-scientist (who knows *all* physical facts about colour vision but has never *seen* red) as our test case, and address Hofstadter's knob-twiddling.

  **Brainstorming the Precise Claims:**

  1.  **The Phenomenal Knowledge Gap (The Standard "What-It's-Like"):**
      *   **Claim:** Physics describes structure, function, mechanism, and causation (the "brain stuff"). Phenomenal consciousness ("what it's like" to see red, feel pain, etc.) is a distinct, non-structural, non-functional *kind* of fact or property. Mary knows all physical facts but gains a genuinely *new fact* when she sees red – knowledge *of* this phenomenal property itself.
      *   **Status:** Genuinely contested. This is the core of the "hard problem" (Chalmers). Anti-physicalists (property dualists, panpsychists) argue this gap reveals a non-physical aspect. Physicalists (representationalists, illusionists, type-A materialists) either deny Mary gains genuinely new *factual* knowledge or explain the new knowledge as a different *mode of access* to physical facts.
      *   **Supports Dismissing Physicalism?** Yes, this is the *primary* argument the slogan is usually meant to imply. It directly challenges physicalism's claim that all facts are physical facts.

  2.  **The Epistemic Gap (Without Metaphysical Commitment):**
      *   **Claim:** There is an undeniable *explanatory* or *conceptual* gap between physical descriptions and phenomenal concepts. We cannot deduce or fully understand "what it's like" from structural/functional knowledge *alone*, even if consciousness *is* physical. Mary's gap is about our cognitive limitations, not necessarily reality's structure.
      *   **Status:** Genuinely contested. This is the core of the "knowledge argument" (Jackson's original intent, later modified) and the position of type-B physicalists (e.g., Loar, Papineau). They accept the gap exists but argue it's "brute" – an unavoidable feature of how phenomenal concepts work, not proof of non-physical properties.
      *   **Supports Dismissing Physicalism?** **No, not directly.** This reading is *compatible* with physicalism. The slogan user *might* be conflating the epistemic gap with a metaphysical one, but the claim itself doesn't entail anti-physicalism.

  3.  **The Analogical/Indexical Knowledge Gap:**
      *   **Claim:** What Mary lacks isn't a new *fact* about red, but a new *way of knowing* the physical fact she already possesses – specifically, knowledge by *acquaintance* or *indexical* knowledge ("*this* is what red looks like"). Physics gives you the description; experience gives you the direct reference.
      *   **Status:** Contested, leaning towards physicalist resolution. Many physicalists (e.g., Dennett, early Churchland, Tye) favour this or similar views. Anti-physicalists argue acquaintance *does* reveal a distinct phenomenal property.
      *   **Supports Dismissing Physicalism?** **Unlikely.** This is primarily a physicalist strategy to *explain* Mary's gap. If this is all the gap amounts to, it doesn't threaten physicalism.

  4.  **The Knob-Twiddling / Cognitive Skill Gap (Hofstadter-esque):**
      *   **Claim:** Mary has all the *structural blueprints* and *component specifications*, but she hasn't actively *run the simulation* or *configured her own cognitive state* to instantiate the specific experience. Knowing the mechanics isn't the same as executing the process *in the specific way* that generates the quale. She knows *how* the "red knob" works but hasn't *twisted it* herself in the relevant context.
      *   **Status:** Contested, niche but serious physicalist view. This aligns with functionalist/computationalist views (like Hofstadter & Dennett's). The gap is about *implementation* and *first-person execution* of a complex process, not missing physical facts. Mary's knowledge is *procedural* or *simulational*, not merely propositional.
      *   **Supports Dismissing Physicalism?** **No.** This is explicitly a *physicalist* explanation. The "something left out" is the act of *performing* the specific cognitive operation oneself, not a non-physical property. Hofstadter applied this to creativity (recombinatorial knob-twiddling of mental representations), but the core idea fits Mary: she needs to actively engage the visual processing "knobs" with the right input.

  5.  **The Trivial Omission (Knowing-That vs. Knowing-How):**
      *   **Claim:** Physics doesn't include the *subjective experience itself* as a datum, just as a physics textbook doesn't contain actual electricity or gravity – it describes them. Mary lacked a specific *sensory event* in her history, not a fundamental fact.
      *   **Status:** Trivial and uncontroversial, but misses the point. Everyone agrees physics books don't contain experiences. The debate is whether the *fact of* phenomenal consciousness is captured by physical descriptions.
      *   **Supports Dismissing Physicalism?** **No.** This is irrelevant to the philosophical debate. It's like saying physics leaves out the *smell* of a rose – true, but doesn't address whether smell is physical.

  6.  **The Flat Wrong Omission (Non-Physical Properties):**
      *   **Claim:** Physics *literally* fails to describe or refer to actual non-physical phenomenal properties that exist in the world.
      *   **Status:** Contested (it's what anti-physicalists *believe*), but **flat wrong** as a *description* of what physical science *claims* or *attempts* to do. Physicalism *asserts* that the complete physical description *is* the complete description *simpliciter*. Saying physics "leaves out" non-physical properties presupposes they exist – which is precisely what's debated.
      *   **Supports Dismissing Physicalism?** Only if you *already accept* anti-physicalism. It's question-begging in this context.

  **Consensus vs. Contested:**

  *   **Settled:** There is an apparent epistemic/explanatory gap between physical descriptions and phenomenal concepts. Mary gains *some* significant new knowledge or ability upon seeing red. Physics textbooks don't contain literal qualia.
  *   **Genuinely Fought Over:**
      *   Whether the Mary gap reveals a *metaphysical* gap (non-physical properties) or just an *epistemic/conceptual* one.
      *   Whether the new knowledge Mary gains is genuinely *propositional* (a new fact) or *non-propositional* (acquaintance, ability).
      *   Whether physicalism can adequately explain or reduce phenomenal consciousness ("the hard problem").
      *   The success of specific physicalist strategies (illusionism, representationalism, type-B materialism, functionalism including knob-twiddling models).

  **Hofstadter's Knob-Twiddling & Mary:**

  Applying this model shifts the focus. On this view, Mary's gap isn't about *missing information* about the world (she has all the structural blueprints). It's about her not having *performed the specific cognitive operation* of visually processing red light. She knows *how* the knob (the neural mechanism for red perception) functions, but hasn't *twisted it* (activated it via retinal input). The "something left out" isn't in physics, but in her own cognitive history – a specific *instance* of running the red-vision program. This provides a physicalist-compatible explanation: the gap concerns first-person implementation and simulation, not ontology. It turns the "knowledge argument" into an argument about cognitive architecture and the difference between descriptive knowledge and instantiated process.

  **One-Sentence Summary:**  
  The slogan's power to challenge physicalism hinges entirely on interpreting the "something left out" as a fundamental *non-physical phenomenal property*, a view which remains hotly contested against physicalist explanations focusing on epistemic access, conceptual limitations, or cognitive implementation gaps.
