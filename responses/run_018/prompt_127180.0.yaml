prompt: |-
  Hey, I'm a software engineer with basically zero formal philosphy background, and at a meetup someone kept saying there's always something it's like that the physics leaves out whenever consciousness came up. They used it like a conversation-ending move — if you know all the brain stuff you still miss the what-it's-like bit. I feel like that's hiding a bunch of different arguments under one sentence, but I can't tell which ones are actually serious.

  Can you take the role of an expert philosopher of mind, think step by step, and start with some quick brainstorming? I want you to lay out the precise claims this slogan could be making — not just the obvious phenomenal-knowledge one, but also weirder readings, maybe about epistemic gaps that aren't metaphysical, or about analogical knowledge, or something about knob-twiddling where the idea is that Mary hasn't turned the right mental dial even though she has all the structural info. For each reading say whether it's trivial, genuinely contested, or flat wrong, and tell me which ones actually support using the line to dismiss physicalism. Please separate what's pretty settled from what's genuinely fought over by people who actually work on this, and don't present a contested view as the consensus. Write in British English throughout, and don't give me a bibliography or citation list — I wouldn't be able to verify them without searching anyway.

  One more thing: I've heard people talk about Hofstadter's knob-twiddling model for creativity — could you say whether applying that to Mary's missing knowledge changes anything? Like, is her gap just that she hasn't twisted the red-experience knob despite knowing the mechanics?

  Please finish with a one-sentence summary on its own last line.
