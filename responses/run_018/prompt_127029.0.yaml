answer: |-
  Here’s your proposal, focused on feasibility and the core idea (297 words):

  **Feasibility & Core Claim:** Yes, this project is doable in one semester **provided I strictly limit scope to decision-theoretic framing and avoid tackling Newcomb’s problem directly.** The proposed split between evidential and strategic updating **does not obviously collapse into existing solutions** and offers a novel dissolution of the Judy Benjamin paradox.

  **The Problem:** The Judy Benjamin case treats a conditional ("If I stay, I'll be shot") as prompting a unified belief update. I argue this conflates distinct mechanisms, creating a false paradox. Standard approaches (e.g., Edgington, Bayesian models) assume a single update rule, masking a critical ambiguity.

  **My Proposal:** Belief revision involves two separable norms:
  1.  **Evidential Conditionals:** Guide *credence* (e.g., learning evidence shifts probability of hypotheses). Benjamin's survival *credence* should plausibly stay high under purely evidential norms.
  2.  **Strategic (Pragmatic) Conditionals:** Guide *action-choice* by conditioning outcomes on the agent’s own potential actions (e.g., "If *I* stay, *I* will be shot" implies action-dependent risk). This norm, not credence shift, drives Benjamin’s rational decision to leave.

  **Key Question:** Can dissolving the paradox by separating these norms show the debate mislocates the issue – it’s not about interpreting conditionals, but about whether belief revision can be inherently action-sensitive? **Crucially, does this distinction merely replicate Newcomb’s dynamics?** I contend it’s distinct: Newcomb involves prediction/correlation, while strategic updating involves direct action-conditioned outcomes.

  **Methodology (Semester Plan):**
  1.  **Formalize:** Define evidential vs. strategic update rules using simple decision matrices.
  2.  **Apply & Test:** Apply both norms to Benjamin, checking consistency with Dutch Books/Reflection. Does the split resolve the stalemate?
  3.  **Stress Test:** Apply the split to canonical "medical testing" cases to identify potential counterexamples or collapse points.

  **Deliverable:** A 6000-word paper arguing the split either successfully dissolves the paradox without collapsing into Newcomb/rejecting probabilism, or fails by requiring unacceptable theoretical costs without explanatory gain. **Scope Limitation:** Focus is on decision theory, not formal semantics or solving Newcomb.
