    "central_tension": "Semantic externalism, when applied to perceptual demonstratives, threatens to deny any shared mental content between intrinsically identical subjects in different environments, despite their indistinguishable phenomenal experiences.",
    "broad_content_claim": "Oscar's thought 'that liquid' refers exclusively to H₂O, while Twin Oscar's identical thought refers to XYZ, meaning they share no overlapping conceptual or referential content whatsoever.",
    "narrow_content_option": "The twins share narrow content: the phenomenal character of the liquid's appearance ('clear, refreshing substance') or a thin demonstrative sense ('THIS liquid-like quality'), which supervenes on their internal states.",
    "key_risk_for_middle_ground": "Narrow content may either lack semantic substance (failing to qualify as genuine content) or functionally replicate broad content's role, thereby collapsing into internalism and negating externalism's necessity.",
    "assessment": "The middle ground is sustainable if narrow content is confined to non-conceptual phenomenology or indexical senses, preserving externalism for truth-conditional content while acknowledging internalism for subjective experience; however, it remains philosophically contentious and requires careful demarcation to avoid redundancy."
  }
