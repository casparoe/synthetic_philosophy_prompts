prompt: |-
  before i commit to any framework for how people should use LLMs in reasoning, i want the actual spec. write the desiderata that any theory of epistemic delegation to AI has to meet if its going to avoid the erosion-of-understanding problem. for each: the motivating case or distinction (intermediate-step outsourcing vs verdict-only, tracking truth vs tracking justification, the cogntive-science result that procedural fluency predicts retension, etc.), whether its negotiable or hard, and flag any pair that looks jointly unsatisfiable -- especially anything involving both the user must be able to verifiy every step and the user can delegate complex symbolic computation. then briefly score three candidates: the extended-mind thesis in Clark-Chalmers style, a pure testimonial-reliance model, and a made-up view i'm calling scaffold-preserving delegation where reasoning traces stay inspectable but the user never executes them. lead with your bottom line in sentence one, then reasoning, no preamble, and don't restate the question back to me.
reasoning: |-
  We are writing desiderata for a theory of epistemic delegation to AI that avoids the erosion-of-understanding problem. 

  Bottom line: A viable theory must preserve the user's ability to comprehend and critically engage with the reasoning process without requiring full execution of every step, while allowing outsourcing of complex computations under inspectable scaffolding.

  Desiderata:

  1. **Preservation of Procedural Fluency (Hard)**: 
     - *Motivation*: Cognitive science shows procedural fluency (ability to execute steps) predicts retention and deep understanding. If users outsource intermediate steps, they lose the practice that builds this fluency, leading to erosion of understanding.
     - *Case*: Outsourcing the steps of a mathematical proof (vs. only the final verdict) may lead to inability to reconstruct the proof later. This is non-negotiable because without procedural fluency, the user's understanding becomes fragile.

  2. **Verifiability without Full Execution (Hard)**:
     - *Motivation*: To avoid blind trust, the user must be able to verify the reasoning. However, requiring the user to execute every step is impractical for complex problems (e.g., large calculations). 
     - *Case*: In symbolic integration, a user might delegate the computation but should be able to check the steps without recalculating each one (e.g., by recognizing integration rules applied). This is hard because without some ability to verify, we risk accepting errors.

  3. **Scalability to Complex Reasoning (Negotiable)**:
     - *Motivation*: The system must handle problems that exceed human working memory or computational capacity. 
     - *Case*: Solving a complex optimization problem with many variables. We can negotiate on the level of detail required for verification (e.g., high-level justifications for groups of steps) but must not sacrifice the ability to drill down.

  4. **Inspectability of Reasoning Traces (Hard)**:
     - *Motivation*: Reasoning traces (the step-by-step process) must be available for inspection so the user can follow and question the logic. This is distinct from executing the steps; it's about having the trace to review.
     - *Case*: An AI providing a chain of thought for a medical diagnosis allows the doctor to see the evidence and reasoning, even if the doctor doesn't perform every test themselves.

  5. **Avoidance of Erosion of Understanding (Hard)**:
     - *Motivation*: The core problem: delegation should not lead to long-term degradation of the user's ability to reason independently. This requires active engagement with the reasoning process.
     - *Case*: Repeatedly outsourcing algebra steps might lead to forgetting algebraic rules. Hard constraint because the theory must prevent erosion.

  6. **Truth-Tracking vs. Justification-Tracking (Hard)**:
     - *Motivation*: We care not just that the AI's output is true (which might be by luck) but that it is justified. The user must be able to evaluate the justification, not just the outcome.
     - *Case*: An AI giving a correct verdict on a legal case with flawed reasoning might be accepted if the user only checks the outcome. We require tracking of justification.

  Joint Unsatisfiability Flags:
  - **Verifiability without Full Execution vs. Scalability**: Requiring the user to verify every step of a complex computation is infeasible (e.g., verifying every step of a 1000-step proof). But if we skip steps, we risk missing errors. This must be resolved by allowing hierarchical verification (high-level overview, then drill-down) and automated checks for step validity (e.g., the AI cites a known theorem that the user accepts without re-proving).
  - **Preservation of Procedural Fluency vs. Delegation of Complex Computation**: We want to delegate complex steps to save time, but if we never practice, we lose fluency. Resolution: The user must engage with a representative subset of steps or practice similar problems independently.

  Scoring Candidate Theories:

  1. **Extended Mind Thesis (Clark-Chalmers)**:
     - *Description*: The AI is part of the user's cognitive system, so its reasoning is as much the user's as if done internally.
     - *Score*: Poor. It does not address erosion because outsourcing steps to an external resource doesn't build internal procedural fluency. Also, verifiability is weak: if the AI is seen as part of the mind, the user may not critically inspect it.

  2. **Pure Testimonial Reliance**:
     - *Description*: Treat the AI as a black box that provides testimony (like a human expert). The user only gets the verdict and maybe a high-level summary.
     - *Score*: Fails. It violates inspectability, procedural fluency, and verifiability. The user cannot check steps and understanding erodes quickly.

  3. **Scaffold-Preserving Delegation**:
     - *Description*: The AI provides the full reasoning trace (scaffolding) that the user can inspect step by step, but the user does not execute the steps. The user can ask for clarification, highlight steps for detailed justification, and the system ensures the trace is structured for comprehension.
     - *Score*: Best candidate. It meets inspectability and verifiability without requiring full execution (by allowing focused checks). It can preserve procedural fluency if combined with active engagement (e.g., the user explains steps in their own words) and by not outsourcing every instance. However, without active practice, there is a risk of fluency erosion, so it must be augmented with deliberate practice of critical steps.
answer: |-
  A viable theory must ensure users maintain comprehension and critical oversight while delegating complex tasks, prioritizing inspectable scaffolding to prevent erosion of understanding.  

  **Desiderata for Epistemic Delegation:**  
  1. **Preservation of Procedural Fluency (Hard)**  
     - *Motivation*: Cognitive science (e.g., Anderson’s ACT-R theory) links *executing* procedures to retention and transferable skills. Outsourcing intermediate steps (e.g., algebra in a proof) erodes ability to rederive results.  
     - *Case*: Verdict-only delegation (e.g., "What is the solution to X?") vs. intermediate outsourcing (e.g., "Solve this equation within proof Y"). Latter risks skill decay.  

  2. **Justification-Tracking Over Truth-Tracking (Hard)**  
     - *Motivation*: Truth-tracking (reliability of outputs) invites gullibility; justification-tracking (grasping *why* a conclusion holds) enables error detection and avoids "bullshit acceptance" (e.g., an AI hallucinating steps).  
     - *Case*: Accepting a correct medical diagnosis via flawed reasoning vs. rejecting it by spotting unjustified inferences.  

  3. **Full Inspectability (Hard)**  
     - *Motivation*: Reasoning traces must be accessible for step-by-step review (e.g., AI-generated proof steps). Users need not *execute* steps but must interrogate them (e.g., "Why this inference rule here?").  
     - *Case*: Delegating symbolic integration: User should trace substitutions without recalculating.  

  4. **Bounded Verification Capacity (Negotiable)**  
     - *Motivation*: Humans can’t verify all steps in complex tasks (e.g., 10,000-step optimization). Accepts summary-verification for subprocedures (e.g., "This lemma is from a trusted library").  
     - *Case*: Using automated theorem provers: User checks high-level strategy, not each axiom.  

  5. **Scalability to Complex Computation (Negotiable)**  
     - *Motivation*: Delegation must handle problems exceeding human cognition (e.g., large-scale data analysis). Sacrifices some inspectability for feasibility.  
     - *Case*: Outsourcing matrix operations in ML: User verifies dimensions/logic, not arithmetic.  

  **Joint Unsatisfiability Flags:**  
  - **Inspectability + Scalability vs. Verification Capacity**: Requiring full step-by-step inspectability for complex computations (e.g., verifying every matrix operation) clashes with human limits. *Resolution*: Hierarchical verification (drill down as needed).  
  - **Procedural Fluency + Complex Delegation**: Outsourcing all practice (e.g., never solving integrals manually) erodes fluency. *Resolution*: Hybrid delegation (AI handles tedious steps; user tackles exemplars).  

  **Candidate Theory Scores (0-10):**  
  - **Extended Mind Thesis (Clark-Chalmers)**: 3/10  
    - *Why*: Treats AI as a cognitive extension (e.g., "trust as you trust memory"). Fails justificatory inspectability—users don’t interrogate "internal" steps. Ignores fluency erosion (e.g., over-reliance degrades skills).  

  - **Pure Testimonial Model**: 2/10  
    - *Why*: Relies on AI as authority (e.g., "Trust the expert"). Violates inspectability and justification-tracking—users get verdicts, not reasoning. Maximizes erosion risk (no engagement).  

  - **Scaffold-Preserving Delegation**: 8/10  
    - *Why*: AI outputs inspectable traces (e.g., step-by-step reasoning with clickable justifications). User verifies *selectively* without execution. Preserves fluency through critical engagement (e.g., questioning steps). *Weakness*: Scalability requires careful UI design to avoid overload.
