  I'm writing a paper for my history and philosophy class, and I need help thinking through a specific conceptual problem. Give an example of a conceptual issue that arises at the intersection of invented tradition and imagined community—specifically, a case in which a modern nation-state formally adopts a reconstructed medieval covenant as part of its constitutional identity, even though the reconstruction introduces democratic deliberation mechanisms that have no basis in the surviving historical fragments. From my perspective as a student trying to understand why this matters conceptually: explain whether the tension is better captured by Hobsbawm's analysis of traditions invented to serve present political needs or by Anderson's account of nations as imagined communities sustained by shared narratives, and identify the specific conceptual problem created when the ritual's claimed antiquity is used to legitimize a distinctly modern form of governance. I do not need sources, a bibliography, or citations; I want to see how the conceptual distinction works on its own.
