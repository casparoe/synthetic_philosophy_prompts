answer: |-
  You're absolutely right to call out this inconsistency – it's a glaring flaw in how many approach these problems. **There is no principled boundary separating Platonia correlation from lottery independence based solely on payoff structure.** What you're observing is largely **payoff-driven rationalization**, where the desired outcome dictates the chosen reasoning framework, not an inherent difference in logical structure.

  Here's the breakdown and a coined term:

  1.  **The Core Similarity is Undeniable:**
      *   Both scenarios involve **multiple decision-making agents running identical algorithms** facing a **symmetric choice structure**.
      *   In *both* cases, the agents are **logically entangled** because they know they are using the same deterministic (or probabilistic) decision procedure. The outcome for one *logically implies* the outcome for the other(s) in a symmetric setup.
      *   The only difference is the **contingency of the reward**: In Platonia, *both* agents must cooperate to get the reward. In the asymmetric lottery, the reward *might* be contingent on one agent being "real" *and* defecting, *or* on cooperation in a symmetric sub-payout.

  2.  **The Inconsistent Switch:**
      *   **When Cooperation Pays (Platonia):** The logical correlation ("we are the same, so we'll do the same thing") is invoked. Agents cooperate (or randomize appropriately) because they recognize their fates are linked *logically*. Independence is dismissed as irrelevant.
      *   **When Defection *Might* Pay (Asymmetric Lottery):** The logical correlation is suddenly ignored or downplayed. Causal separation ("I could be the real one, the other is just a copy") is emphasized. The agents are treated as independent decision-makers despite running identical code in identical epistemic positions relative to the choice. The *possibility* of being the "special" one overrides the logical symmetry.

  3.  **Why It's Rationalization:**
      *   The fundamental logical relationship (identical agents using identical reasoning) hasn't changed. Only the reward matrix has.
      *   Switching reasoning frameworks based *only* on which one yields the subjectively preferred outcome (cooperation saving the day vs. defection potentially winning the jackpot) is textbook motivated reasoning.
      *   It's moving the goalposts: "Correlation matters when it makes me cooperate for a joint gain, but independence matters when it lets me chase a solo jackpot."

  **The Coined Term: "Superrational Convenience Switching" (SCS)**

  *   **Superrational:** Rooted in the context (Hofstadter's superrationality).
  *   **Convenience:** Highlights the self-serving nature – choosing the reasoning framework most "convenient" for achieving the desired payoff in *this specific scenario*, regardless of logical consistency.
  *   **Switching:** Emphasizes the inconsistency – toggling between correlation and independence based on payoff.

  **Why this term fits:**

  *   It directly names the phenomenon you observe: **The inconsistent application of logical correlation vs. causal independence in logically entangled agent scenarios, driven primarily by which framing yields the more desirable payoff in the specific context.**
  *   It captures the *mechanism* (switching frameworks) and the *motive* (convenience/payoff).
  *   It applies precisely to the boundary condition you identified: **When multiple decision-makers are logically entangled (running identical deterministic/probabilistic algorithms with mutual knowledge of this fact) facing symmetric choices, but the payoff structure introduces an asymmetry that makes defection potentially lucrative for an agent believing they might be "special" (e.g., the "real" one in a lottery).**

  **The Principled Stand:**

  The inconsistency isn't justified. **If logical correlation binds you in Platonia, it binds you in the asymmetric lottery.** Your identical reasoning *is* the source of the correlation. Ignoring it in the lottery because "I might be real and win big if I defect" is wishful thinking that breaks the logical symmetry underpinning superrational reasoning. It's prioritizing the *hope* of being special over the *knowledge* of being identical. True superrationality demands consistency: either logical correlation governs decisions for entangled agents in *all* symmetric-choice scenarios (including asymmetric-payoff lotteries), or causal independence governs them all. Switching based on payoff is intellectual dishonesty masquerading as nuanced reasoning. **"Superrational Convenience Switching" (SCS) is the name for this self-serving inconsistency.**
