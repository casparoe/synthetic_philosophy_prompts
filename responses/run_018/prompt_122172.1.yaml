  Hmm, they're clearly aiming for high-level critical thinking—not just summarizing theories but spotting hidden contradictions. The key traps they want students to notice: how "trusteeship" might secretly smuggle in rights-claims it pretends to avoid (like paternalism masquerading as neutrality), and the democracy-vs-fiduciary conflict. 

  For the exam prompt, I should make it punchy but layered. Opening with "HEY" keeps their casual vibe, and phrases like "allegedly" signal the skepticism they want students to adopt. The "smuggling contraband" metaphor will nudge them toward the "hidden rights" critique. 

  The model answer needs to walk the tightrope: show how trusteeship seems like a moderate position at first glance (B-grade material), then pivot hard to why it collapses under scrutiny (A-grade insight). Gotta highlight that paternalism trap—when trustees claim to know what's "best" for nonexistent people, they're actually imposing present-day preferences. And the "rights" sleight-of-hand is crucial: framing land as an "inheritance" for future citizens sneakily assumes those future people already have claims, which undermines the whole "no rights" premise. 

  Marking scheme should reward: 
