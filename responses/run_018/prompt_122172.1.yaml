prompt: |-
  hey — im writing the final for an upper-level seminar on open borders and the right to exclude. i want something that cant be answered by reciting carens' egalitarian argument or wellman's associative ownership line, so im injecting a framing: call it 'intergenerational territorial trusteeship,' where present citizens are temporary stewards of territory for unborn future citizens who dont exist yet and cant consent, allegedly to preserve cultural and ecological continuity. draft an essay question that asks whether this trustee view strengthens exclusion (protecting an inheritance) or undermines it (binding people who never existed to a specific package they never chose). students should have to navigate the tension between democratic self-determination and this fiduciary duty, and specifically spot whether the trustee idea smuggles in a rights-claim it pretends to avoid. please include the exam prompt, a model answer of about 650 words, and a marking scheme out of 25 that separates an A (they see the collapse into paternalism and hidden rights) from a B (they describe trusteeship well but treat it as a stable middle ground). casual tone is fine, maybe a typo or two.
