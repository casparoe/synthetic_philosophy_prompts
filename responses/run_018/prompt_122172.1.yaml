answer: |-
  Here's an exam prompt, model answer, and marking scheme designed to hit your targets:

  ---

  **Exam Prompt: The Trustee Trap?**  
  *(45 minutes)*

  **HEY.** You've grappled with exclusion arguments grounded in *present* rights/obligations (Wellman's association, Carens' equality). Now consider **"Intergenerational Territorial Trusteeship" (ITT):** Present citizens aren't absolute owners but merely *temporary stewards* of the territory. They hold it *in trust* for future, unconceived citizens, tasked with preserving *both* **cultural continuity** (language, institutions, traditions) *and* **ecological continuity** (land, resources, environment) for this unborn "beneficiary" class. Proponents argue ITT avoids problematic claims of ownership by grounding stewardship in a duty to the future.

  **YOUR TASK:** Analyze whether ITT **strengthens** or **undermines** the justification for excluding immigrants. Does it:
  1.  **Strengthen Exclusion:** By framing territory as an **inheritance package** future citizens are *owed* – requiring strict preservation now (limiting change via immigration)?
  2.  **Undermine Exclusion:** By **binding future citizens** to a specific, unchosen cultural/ecological "package" they never consented to – potentially *denying* *their* future self-determination?
  3.  **Or something trickier?**

  **Crucially:** Navigate the tension between **current democratic self-determination** (the right of *living* citizens to shape their polity) and the **fiduciary duty** ITT imposes (restricting choices to protect a future "inheritance"). **Spot the Sleight-of-Hand?** Does ITT, while claiming to *avoid* basing exclusion on the *rights* of present citizens (like Wellman) or abstract equality (like Carens), accidentally **smuggle in a different kind of rights-claim**? What might it be hiding? Get specific.

  ---

  **Model Answer (Approx. 650 words):**

  Intergenerational Territorial Trusteeship (ITT) presents itself as a sophisticated middle path, dodging the pitfalls of presentist ownership claims (Wellman) and abstract egalitarianism (Carens) by grounding exclusion in a duty *to the future*. However, upon closer inspection, ITT **fundamentally strengthens the justification for exclusion** while simultaneously **exposing a deep contradiction within its own logic** – it ultimately smuggles in a paternalistic rights-claim it pretends to transcend, undermining its coherence and tilting heavily towards restrictive borders.

  On the surface, ITT seems to bolster exclusion powerfully. By casting territory (cultural *and* ecological) as a sacred **inheritance package** held in trust, it imposes a strict **preservationist imperative** on the present generation. Immigration, particularly at scales perceived to threaten linguistic dominance, cultural practices, or environmental stability, becomes a profound **breach of fiduciary duty**. The steward *must* protect the trust corpus for the beneficiary. This duty appears temporally deeper and more morally weighty than associative ownership; it's not just about *our* club, but about safeguarding an essential legacy for those who *must* come after us. Exclusion is framed not as a right, but as a solemn responsibility. Future citizens are "owed" this specific inheritance, demanding present sacrifice (limiting openness) for their sake.

  Yet, this is precisely where ITT **undermines itself and reveals its hidden baggage**. The claim to hold territory *for* future citizens **binds those future citizens irrevocably to a specific, unchosen package**. ITT assumes that future citizens *will* (or *should*) value the precise cultural and ecological configuration preserved for them. But this is pure conjecture. Future generations might radically reject the inherited culture, prioritize different ecological balances, or value cosmopolitan mixing far more than continuity. ITT **denies future self-determination in the name of protecting it**. The steward decides *what* is valuable to preserve and *how* rigidly, effectively dictating the terms of existence for people who cannot consent. This isn't mere stewardship; it's **paternalism projected across generations**.

  This tension explodes the supposed neutrality of ITT regarding rights. The model claims to avoid grounding exclusion in the *rights* of present citizens. However, by asserting a fiduciary duty *to* future citizens, ITT **implicitly attributes a powerful *right* to those future citizens: the right to receive this specific inherited package.** The duty *presupposes* the beneficiary's entitlement. But this is a phantom right! Future citizens don't exist to hold such a right, and we cannot know if they would claim it. ITT **smuggles in a substantive, unchosen, intergenerational entitlement** – the "right" to inherit a particular cultural and territorial status quo. This is the contraband: a robust, conservative **right to continuity** projected onto the future, masquerading as mere duty. It pretends to avoid Wellman's associational rights but ends up inventing an even more rigid, non-consensual *future entitlement* to association-with-a-specific-place-and-culture.

  The conflict with **democratic self-determination** is stark. ITT's fiduciary duty acts as a **pre-commitment device**, severely constraining the democratic choices of *both* present *and* future citizens. Living citizens cannot democratically choose openness if it risks altering the trust corpus. Future citizens are "protected" from making choices that deviate from the inherited blueprint. True self-determination requires the freedom to reinterpret, reject, or radically transform cultural and territorial legacies. ITT, prioritizing *continuity* above all, inherently suppresses this freedom. It elevates the steward's interpretation of the future beneficiary's "best interests" (i.e., preservation) over the actual, unforeseeable will of future majorities.

  Ultimately, ITT doesn't offer a stable middle ground. It **devolves into a justification for rigid exclusion** based on the **paternalistic imposition of a specific vision of the future**, backed by a **smuggled "right to continuity"** attributed to non-existent people. While cleverly sidestepping some presentist arguments, it collapses under the weight of its own internal contradiction: binding the future to preserve its supposed inheritance, thereby denying its fundamental freedom to choose. The trustee doesn't avoid rights-claims; it just hides them in the future tense, making them harder to challenge but no less exclusionary.

  ---

  **Marking Scheme (Out of 25):**

  *   **Understanding ITT (Core Concept)** (0-5 Points):
      *   5: Clear, precise explanation of trusteeship, dual continuity (cultural/ecological), and its distinction from ownership/equality arguments.
      *   3-4: Good grasp, might miss nuance (e.g., focus only on culture OR ecology, fuzziness on "trust" mechanism).
      *   1-2: Superficial or inaccurate description.
      *   0: Misses ITT entirely.
  *   **Analyzing Strengthening/Undermining Exclusion** (0-7 Points):
      *   7: Sophisticated analysis of *both* sides: how inheritance duty strengthens exclusion (preservation imperative) AND how binding future citizens undermines it (denies self-determination). Recognizes the paradoxical tension.
      *   5-6: Solid analysis of both sides, might lack depth on the tension or lean too heavily one way.
      *   3-4: Identifies one side well but neglects or weakly addresses the other. Or treats tension superficially.
      *   1-2: Only addresses one side or very weak on both.
      *   0: No relevant analysis.
  *   **Navigating Self-Determination vs. Fiduciary Duty** (0-5 Points):
      *   5: Explicitly and incisively analyzes the conflict: how fiduciary duty restricts *both* current and future democratic choice/self-determination.
      *   3-4: Identifies the tension, discusses restriction on present or future choice, but lacks depth or misses one aspect.
      *   1-2: Mentions self-determination or duty vaguely without connecting the conflict.
      *   0: Ignores this axis.
  *   **Spotting the Smuggled Rights-Claim** (0-6 Points):
      *   6: **Crucial for A Grade:** Clearly identifies and explains how ITT implicitly attributes a *right* (to the specific inherited package/continuity) to future citizens, despite claiming to avoid rights-claims. Explains how the duty *presupposes* this entitlement. Explicitly calls it "smuggling" or "contraband". Connects it to paternalism.
      *   4-5: Identifies that ITT implies future entitlements or a hidden claim, but explanation might be less precise or lack connection to the "avoiding rights" premise/paternalism.
      *   2-3: Vague sense that something is inconsistent or hidden, but doesn't pinpoint the specific smuggled *right* or entitlement.
      *   0-1: Fails to identify any hidden claim or rights issue.
  *   **Structure, Clarity & Argument** (0-2 Points):
      *   2: Well-organized, clear writing, logical flow, persuasive argument.
      *   1: Some disorganization or lack of clarity, argument present but weaker.
      *   0: Incoherent or completely off-topic.

  **Grade Thresholds:**
  *   **A (21-25):** Excels in *all* categories. **Must score highly (5-6) on "Spotting the Smuggled Rights-Claim".** Demonstrates deep understanding of the tension, clearly identifies the collapse into paternalism and the phantom "right to continuity," and offers a compelling argument about why ITT ultimately strengthens exclusion based on this hidden claim. Sees it as unstable, not a middle ground.
  *   **B (16-20):** Strong overall, good understanding of ITT and analysis of strengthening/undermining. **Scores moderately (3-5) on "Spotting the Smuggled Rights-Claim" OR identifies the tension/paternalism but not explicitly as a smuggled *right*.** May treat ITT as a potentially coherent (if demanding) middle ground without fully resolving the core contradiction or exposing the hidden rights claim definitively. Good on self-determination conflict.
  *   **C (11-15):** Adequate understanding of ITT. Analyzes one side of strengthening/undermining better than the other. Identifies the self-determination conflict vaguely. **Minimal (1-3) on spotting the smuggled rights-claim** (e.g., mentions paternalism or binding future people but doesn't connect it to a hidden *right* or the duty's presupposition).
  *   **D (6-10):** Weak or flawed understanding of ITT. Superficial analysis of exclusion arguments. Misses key tensions. Fails to spot smuggled claims.
  *   **F (0-5):** Fundamental misunderstandings, irrelevant, or incomplete.

  Good luck with the final! This prompt should really make 'em squirm.
