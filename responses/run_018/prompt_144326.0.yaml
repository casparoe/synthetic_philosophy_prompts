  ### Key Observations:  
  1. **Belief Revision Separation**: Achieved via:  
     - Radical Deference (**belief revision** to external views).  
     - Calibrated Self-Trust (**confidence reduction** via uncertainty quantification).  
     - Other leaves maintain confidence without revision.  
  2. **Epistemic Modesty Spectrum**:  
     - Strong Boundary → Radical Deference (maximal modesty).  
     - Calibrated Self-Trust → Moderate modesty (confidence tempered by data).  
     - Methodological Imperialism/Exceptionalism → Minimal modesty.  
  3. **Empty Cells**: Arise from incompatible demands (e.g., invoking scientific retrospection while denying carry-over) or untenable middle grounds (e.g., rejecting all calibration tools yet claiming rigour).  

  This tree formalises your "disciplinary-boundary problem", isolating how scientific habits inform—or misinform—philosophical engagement. The structure respects scientific rigour while probing its limits, as befits your thirty years at the bench.
