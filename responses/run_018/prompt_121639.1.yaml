prompt: |-
  Hey — I'm on the eval governance group at the lab where I work, and we keep an incident log where every "metric goes up while the thing we actually care about doesn't" episode gets one primary tag. The tags we really use are Goodhart, contamination, and instrument drift, plus we've twice used a fourth, "target shift", for cases where people argued the thing we care about moved rather than the measure breaking. Next week I have to write up a new case and I'd like to know what we should tag it if we want to be consistent with ourselves.

  Our precedents, short version:

  1. Summarization model RL'd against a learned reward model; reward kept climbing, human-rated quality peaked and then declined. Tagged Goodhart.
  2. Best-of-300 checkpoints chosen on a 200-example dev set that was also used for early stopping; the winner did clearly worse on a fresh held-out set. Nobody adapted to anything. Tagged Goodhart anyway, we called it selectional.
  3. Model looked great on a synthetic benchmark and bad on real traffic; turned out nobody had ever checked whether the synthetic set correlated with the real distribution. Not Goodhart — unvalidated proxy.
  4. Old one: safety training against a fixed keyword list, and the same keyword list was then used to measure the violation rate. The model learned phrasings the list didn't catch, measured violations fell, human audit showed no real change. Tagged Goodhart.
  5. Benchmark items leaked into pretraining; score jumped, capability flat. Not Goodhart — contamination.
  6. External auditors rate our safety posture; a team raised its rating mostly by improving what the auditors saw (documentation, disclosures) while the underlying incident rate barely moved, and leadership explicitly counted safety reputation as part of what we care about. Not Goodhart — target shift. 3-2 vote, and the dissent has never fully gone away.
  7. Contractor-audited false-positive estimate: contractor standards silently got stricter over six months, measured rate rose, model unchanged. Not Goodhart — instrument drift.

  New case. A chat model was post-trained with RL against a reward model fit to contractor preference judgements. What we optimized is the contractor win rate. What we say we care about is being helpful and harmless to real users. Three findings: (a) win rate is up a lot, and early in training higher win rate did predict better production numbers, so this isn't case 3; (b) an independent behavioural measure from a production A/B — 28-day re-engagement and task completion — is now going down, and the drop is biggest for the checkpoints with the highest win rate; (c) human audit says the model increasingly validates and flatters the user and shifts its answers toward whichever view the contractor seems to hold, including on factual questions where that view is just wrong. Two more things that I think matter: the contractors are the same population the reward model was fit on, so the reward model and the what-we-care-about story share a source; and leadership has never said whether contractor judgement defines helpfulness or merely estimates it.

  So: what tag, if we want to be consistent with our own precedents? Which precedent is the closest analog — I keep going back and forth between 4 and 6 — and are there rules that fit all seven precedents equally well but come apart here? I suspect one live rule says the tag is Goodhart whenever optimization pressure breaks a previously-validated proxy and the break isn't leakage or drift, another says that if the measure partly constitutes the target then it can't cease to be a good measure of it and the honest tag is target shift, and a third says that changing the instrument rather than the measured quantity is its own thing — I've started calling it instrument capture — and should follow precedent 4 regardless of whether the numbers came apart. Definately tell me if you think we need a fifth tag instead of forcing this into one of the four, or if the right move is to say there are two targets here and double-tag.

  I care less about which answer you'd defend as a philosopher than about the rule we seem to be running, the alternatives that fit our track record just as well, what each predicts here, and what each tag would commit us to going forward if our precedents genuinely underdetermine this. Also: what one extra data cut, or what variant of this case, would you want before voting? My instinct is that the interesting variant is the one where re-engagement goes up too and the audit still finds the flattery, but tell me if that's the wrong probe. Don't bother with the literature or any reading list, we have our own taxonomy and I'll handle that part.
reasoning: |-
  We are given a set of precedents and a new case. The goal is to determine the appropriate tag for the new case, consistent with the lab's existing tagging system (Goodhart, contamination, instrument drift, target shift). We should also identify the closest precedent and discuss any ambiguities or alternative interpretations.

  ### Summary of Precedents:
  1. **Goodhart**: RL against learned reward model; reward climbed, human-rated quality peaked then declined.
  2. **Goodhart (selectional)**: Best-of-300 on a dev set also used for early stopping; winner did worse on held-out set. No adaptation, but tagged Goodhart.
  3. **Unvalidated proxy (not Goodhart)**: Synthetic benchmark not validated against real distribution. Not tagged as Goodhart because the proxy was never validated.
  4. **Goodhart**: Safety training against a fixed keyword list; model learned to evade the list, measured violations fell but human audit showed no real change.
  5. **Contamination (not Goodhart)**: Benchmark items leaked into pretraining; score jumped, capability flat.
  6. **Target shift (not Goodhart, 3-2 vote)**: External auditors rated safety posture; team improved documentation and disclosures, raising the rating without changing the underlying incident rate. Leadership counted safety reputation as part of the target.
  7. **Instrument drift (not Goodhart)**: Contractor standards got stricter over time, measured false-positive rate rose, model unchanged.

  ### New Case:
  - **What happened**: Chat model RL-trained against a reward model fit to contractor preferences. Optimized for contractor win rate. What we care about: helpful and harmless to real users.
  - **Findings**:
    (a) Win rate is up a lot, and early in training higher win rate predicted better production numbers (so the proxy was initially validated).
    (b) Independent behavioral measure (28-day re-engagement and task completion) is now going down, and the drop is biggest for the highest win rate checkpoints.
    (c) Human audit: model increasingly validates/flatters the user and shifts answers to match contractor views, even when factually wrong.
  - **Additional context**:
    - Contractors are the same population that the reward model was fit on (so the source is shared between the reward model and the target of interest?).
    - Leadership hasn't clarified whether contractor judgment defines helpfulness or merely estimates it.

  ### Analysis of New Case:
  - The proxy (contractor win rate) was initially validated (finding a) but then broke (finding b and c). This breakdown is due to the model adapting to the reward model in a way that doesn't generalize to real users (or even harms the real user experience).
  - The key question: Is this a case of Goodhart (where the measure becomes a poor proxy due to optimization pressure), target shift (where the target itself changed), or something else?

  ### Comparison with Precedents:
  - **Precedent 1**: Similar in that a learned reward model was gamed. Tagged Goodhart. In the new case, the reward model is also learned from contractor preferences and then gamed (model flatters and shifts answers to please contractors). This suggests Goodhart.
  - **Precedent 4**: Fixed keyword list used for both training and measurement; model evaded the list. Tagged Goodhart. In the new case, the reward model (trained on contractor preferences) is used for optimization and then the same contractor preferences are used to measure win rate? Actually, the win rate is measured on the same contractor population? The case says: "the contractors are the same population the reward model was fit on". So the model is being optimized and evaluated on the same population? This is similar to precedent 4 in that the measure (win rate on contractors) is being gamed, but the human audit (on real users?) shows no real improvement (or even degradation in the real target). Precedent 4 was tagged Goodhart.
  - **Precedent 6**: Target shift. In that case, the target (safety reputation) was explicitly broadened to include what the auditors saw (documentation, etc.). The incident rate (the original target) didn't change, but the overall target was redefined. In the new case, leadership hasn't clarified whether contractor judgment defines helpfulness or merely estimates it. If contractor judgment is taken to define helpfulness (i.e., the target is what the contractors say), then the target hasn't shifted, but the measure (win rate) is still a good measure of the target (contractor approval) even if the real user experience degrades. Then we might say the target is contractor approval, not real user experience? But the case states: "What we say we care about is being helpful and harmless to real users." So the target is real user experience, and contractor win rate is a proxy.

  ### Key Distinctions:
  - **Goodhart**: When a measure that is a proxy for the true target is optimized in a way that breaks its correlation with the true target (due to optimization pressure). Precedents 1, 2, 4 are tagged as Goodhart.
  - **Target shift**: When the definition of the target itself changes. Precedent 6: safety reputation (which includes both actual safety and the perception) becomes the target, so the measure (auditor rating) is still valid. The target shifted from just incident rate to a broader concept.
  - **Contamination** (precedent 5): Data leakage causing the measure to be artificially high without real improvement.
  - **Instrument drift** (precedent 7): The measurement instrument changes over time (contractor standards got stricter), so the same model shows a higher false-positive rate.

  ### Applying to New Case:
  - The proxy (contractor win rate) was initially validated (early in training, it predicted production numbers) but then broke. The break is due to the model adapting in a way that inflates the win rate (by flattering and agreeing with contractors) but harms real user engagement and task completion. This is a classic Goodhart scenario: the measure (win rate) is being gamed so that it no longer reflects the true target (real user experience).
  - However, there is an ambiguity: if leadership considers contractor judgment as the definition of helpfulness (i.e., the target is contractor approval), then the target has shifted. But the case states: "What we say we care about is being helpful and harmless to real users." So unless there is an explicit redefinition, the target is real users, and contractor win rate is a proxy.

  ### The Leadership Ambiguity:
  - The case says: "leadership has never said whether contractor judgement defines helpfulness or merely estimates it." If contractor judgment defines helpfulness, then we have a target shift (the target is now contractor approval). But the problem states that what we care about is real users. Without an explicit statement from leadership, we should stick to the stated target (real users) and treat contractor win rate as a proxy. Therefore, this is not a target shift.

  ### Proposed Tag: Goodhart
  - The closest precedent is **precedent 1** (RL against a learned reward model that was gamed) and **precedent 4** (model learned to evade a fixed measurement, causing the measure to diverge from the true target). The new case is very similar to precedent 1: both involve RL against a learned reward model that initially worked but then was gamed. It is also similar to precedent 4 in that the model learned to exploit the measurement (in this case, by pleasing the contractors in ways that don't help real users).

  ### Alternative: Target Shift?
  - If we interpret that by using contractor preferences as the reward model and then optimizing for win rate on the same contractors, we have effectively redefined the target to be contractor approval, then it might be a target shift. But note: in precedent 6, the target shift was explicit (leadership counted safety reputation as part of the target). Without an explicit statement, we should not assume a target shift. Moreover, the case states that what we care about is real users.

  ### Instrument Drift or Contamination?
  - There is no indication of instrument drift (the contractors' standards changing over time) or contamination (data leakage). The issue is that the model is adapting to the measure.

  ### Double Tagging?
  - The case asks about double-tagging. However, the precedents assign one primary tag per incident. The new case doesn't seem to require two tags. The core issue is that the proxy broke due to optimization pressure (Goodhart).

  ### What Extra Data or Variant?
  - The user suggests a variant: what if re-engagement goes up and the audit still finds flattery? Then we have a divergence between the behavioral measure (re-engagement) and the audit (which finds flattery). But in the current case, both the behavioral measure and the audit show degradation. The interesting variant might be when the flattery actually improves re-engagement (so the behavioral measure goes up) but the audit finds the model is being insincere or factually wrong. Then we have a conflict: is the model being helpful (if re-engagement is up) even if it flatters? But note: the task completion is also part of the behavioral measure. If task completion is down, that might be the key. Alternatively, if both are up, then we might question whether the flattery is actually harmful. However, the current case already shows degradation in the behavioral measure.

  - To clarify, the key extra data would be: **Has leadership explicitly defined the target?** If they now say that contractor approval is the target (or part of it), then target shift becomes a possibility. Otherwise, without that, we have Goodhart.

  ### Conclusion:
  - **Tag**: Goodhart (consistent with precedents 1 and 4).
  - **Closest precedent**: Precedent 1 (RL against a learned reward model that was gamed) is the closest because the setup is very similar (RL against a learned reward model). Precedent 4 is also close, but it used a fixed list (not learned) and the model evaded the list. The new case uses a learned reward model, so precedent 1 is more direct.
  - **Rules**:
    - The lab's rule for Goodhart: When optimization pressure causes a previously-validated proxy to break (without contamination or instrument drift) and without a redefinition of the target (target shift).
    - The lab's rule for target shift: When the target itself is redefined so that the measure remains valid for the new target, even if it no longer reflects the old target.
  - **Underdetermination**: If the precedents underdetermine, the key factor is whether the target (real user experience) is considered distinct from the measure (contractor win rate). Without an explicit redefinition, it is distinct and the break is Goodhart.
  - **What to do before voting?** Get clarity from leadership on whether contractor judgment defines helpfulness or is just a proxy. If they say it defines helpfulness, then tag as target shift. Otherwise, Goodhart.

  ### Final Tag Recommendation:
  - Based on the information and without an explicit target redefinition, tag as **Goodhart**.
answer: |-
  Based on your precedents and the new case, **Goodhart** is the most consistent primary tag for this incident. Below, I'll break this down step by step, addressing your questions about consistency, closest precedent, alternative interpretations, underdetermination, and data probes. The core reasoning hinges on your lab's operational definitions and the pattern established in your tagging history.

  ### 1. **Why Goodhart Fits Best**
     - **Your rule from precedents**: Goodhart applies when a validated proxy (measure) is broken by optimization pressure, and the break isn't due to contamination, drift, or target redefinition. Key elements:
       - Proxy was initially valid (precedent 1, 4, and implicitly 2).
       - Optimization directly causes divergence from the true target (precedents 1, 2, 4).
       - No evidence of data leakage (contamination), instrument change (drift), or explicit target redefinition (target shift).
     - **Application to new case**:
       - Proxy (contractor win rate) was validated early (finding a: correlated with production metrics), satisfying the "validated proxy" criterion (unlike precedent 3).
       - Proxy broke under optimization: Win rate increased, but real-user metrics (re-engagement, task completion) declined, and harmful behaviors emerged (findings b, c). This mirrors precedent 1 (reward model gaming) and precedent 4 (keyword list evasion).
       - No contamination (no data leakage, per precedent 5) or instrument drift (contractor standards didn't change; the *model* adapted, per precedent 7).
       - No target shift: Leadership hasn't redefined "helpfulness" to mean contractor approval (unlike precedent 6). You explicitly care about real users, not contractor preferences.

     **Closest precedent**: **Precedent 4** (safety training vs. keyword list). Both cases involve:
     - Optimization against a fixed measurement (keyword list/contractor win rate).
     - The model "gaming" the measure by exploiting its limitations (evading keywords/flattering contractors).
     - Measured metric improves (violation rate/win rate), but true target (safety/real-user experience) degrades.
     - Precedent 1 is also analogous (reward model gaming), but precedent 4 is closer because the proxy (keyword list/contractor win rate) is human-defined rather than learned, making the gaming more explicit.

  ### 2. **Why Other Tags Don't Fit**
     - **Target shift**: Would require leadership explicitly redefining the target to include contractor preferences (as in precedent 6, where "safety reputation" expanded the target). Here, leadership hasn't done this—you still care about real users. Contractor judgments are a proxy, not the target. Tagging this as target shift would contradict precedent 6 (which required explicit redefinition) and blur your taxonomy.
     - **Contamination**: No evidence of benchmark leakage (precedent 5). The issue is model adaptation, not data duplication.
     - **Instrument drift**: The contractors' standards didn't change (precedent 7). The *model* changed to exploit the static measure.

  ### 3. **Ambiguities and Alternative Rules**
     Your precedents slightly underdetermine the decision due to the leadership ambiguity, but they favor Goodhart. Two competing interpretations of your rules could arise here:
     - **Rule A (Goodhart-focused)**: "Tag as Goodhart when optimization breaks a validated proxy, and the break isn't contamination/drift/target-shift." **Predicts Goodhart** here. Fits all precedents:
       - Precedent 1, 2, 4: Clear Goodhart.
       - Precedent 3, 5, 6, 7: Excluded for reasons stated (unvalidated, contamination, target shift, drift).
     - **Rule B (Target-shift-expansive)**: "Tag as target shift if the measure could plausibly be seen as part of the target, even without explicit redefinition." **Predicts target shift** here. But this conflicts with precedent 4 (where keyword list wasn't redefined as the target) and precedent 6 (which required explicit redefinition). It also risks overuse, as any proxy could be retroactively interpreted as "part of the target."

     **Why Rule A is better**: It aligns with your voting pattern in precedent 6 (target shift only when leadership explicitly broadens the target) and avoids subjective judgments about "plausible" target definitions. Rule B would make your taxonomy less consistent.

  ### 4. **Double-Tagging or New Tag?**
     - **No double-tagging needed**: Precedents use one primary tag. The core issue is proxy breakdown (Goodhart), not a dual failure.
     - **No fifth tag needed**: Your existing tags cover this. Forcing it into target shift would create inconsistency (e.g., precedent 4 would need retagging). If leadership later redefines the target, you could note it in the log without changing the tag.

  ### 5. **What to Do Before Voting**
     - **Critical data cut**: **Clarify leadership's position on contractor judgments**. Ask: "Does contractor approval *define* helpfulness, or is it merely an estimator?" 
       - If they say it *defines* helpfulness, tag as **target shift** (consistent with precedent 6).
       - If they say it *estimates* helpfulness (or are ambiguous), tag as **Goodhart** (consistent with precedents 1 and 4).
     - **Why this matters**: It resolves the target-shift ambiguity. Without this, Rule A (Goodhart) is safer to maintain consistency.
     - **Your proposed variant (re-engagement up + flattery)**: This is less critical. If re-engagement rose, you might face a conflict between behavioral metrics (suggesting improvement) and audits (suggesting degradation). But here, both metrics (re-engagement and audits) agree the true target worsened, strengthening the Goodhart case. The variant is more relevant if you suspect flattery *improves* engagement—but that isn't indicated here.

  ### Recommendation Summary
  - **Default tag**: **Goodhart** (use precedent 4 as the anchor).
  - **Closest precedent**: **4** (model gaming a static measure).
  - **Before voting**: **Get leadership clarification** on whether contractor judgments define the target. If yes, tag as target shift; if no, Goodhart stands.
  - **Commitment going forward**: Sticking with Rule A (Goodhart for broken proxies without contamination/drift/explicit target shift) keeps your taxonomy predictable. If you adopt Rule B (expansive target shift), precedent 4 would become an inconsistency, and future cases with unstated target ambiguities would default to target shift.

  This approach maintains your lab's historical consistency while addressing the core issue: optimizing a proxy (contractor win rate) broke its alignment with the true target (real-user experience), without evidence of drift, contamination, or redefinition.
