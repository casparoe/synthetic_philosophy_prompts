                /                                                                           \
               /                                                                             \
  Do identical players with common knowledge                                           Is payoff misperception driven by 
  of rationality/payoffs defect at move one?                                         accumulating noise or fixed uncertainty?
            /                            \                                                          /                     \
           /                              \                                                        /                       \
          /                                \                                                      /                         \
       Yes                                 No                                               Noise Accumulation           Fixed Uncertainty
        |                                   |                                 (exponential collapse)                   (static misalignment)
        |                                   |                                        |                                       |
        ↓                                   ↓                                        ↓                                       ↓
  [Standard Backward Induction]   [Common Knowledge Unrealistic]           [Epsilon-Noise Collapse]                  [Cooperative Equilibria]
  • Awkward: Defection occurs      • Awkward: Defection timing is           • Awkward: Predicts rapid              • Awkward: Requires rejecting
    despite Pareto-suboptimal        indeterminate; can't explain             breakdown even with tiny noise        backward induction's dominance
    outcomes; ignores real-world     why cooperation persists                 without specifying epsilon            in finite games; vague on defection 
    cooperation                      near equilibrium                         threshold                            triggers
  ```

  ### Key Branches Explained:
  1. **Rationality Assumptions** (vs. Payoff Representation):  
     - Focuses on whether rationality definitions inherently force defection.  
     - Tests if identical players with common knowledge *must* defect immediately.

  2. **Payoff Representation & Nested Knowledge**:  
     - Focuses on whether players misperceive others' incentives under recursion.  
     - Tests if misrepresentation is due to **noise accumulation** (dynamic) or **fixed uncertainty** (static).

  ### Leaf Commitments & Overlaps:
  - **Standard Backward Induction**:  
    Commits to defection at move 1 as uniquely rational, dismissing observed cooperation as irrational.  
  - **Common Knowledge Unrealistic**:  
    Commits to delayed defection but can't predict *when* without specifying knowledge depth.  
  - **Epsilon-Noise Collapse**:  
    Commits to cooperation length being highly sensitive to noise; small uncertainty forces early defection.  
  - **Cooperative Equilibria**:  
    Commits to sustained cooperation via reciprocity, rejecting backward induction.  

  ### Ambiguous Pair:
  - **Cooperative Equilibria vs. Epsilon-Noise Collapse** both predict extended cooperation but **cannot be separated** by this tree:  
    — Cooperative views attribute longevity to strategic reciprocity (e.g., folk theorems).  
    — Noise views attribute it to error propagation in belief updating.  
    *Testable difference*: Noise predicts defection probability *increases* with steps; cooperative views allow stable mutual cooperation.  

  ### Tree Logic:
  - **Path to Standard BI**: Requires belief that rationality + common knowledge *necessitate* defection.  
  - **Path to Noise Collapse**: Requires nested beliefs about payoffs to degrade with recursion.  
  - **Unresolved Tension**: "Common Knowledge Unrealistic" and "Cooperative Equilibria" both deny backward induction’s inevitability but offer incompatible mechanisms (knowledge depth vs. equilibrium selection).
