answer: |-
  ### Ethics Seminar Decision Tree: Integrity and Moral Corruption  
  **Audience:** Graduate students familiar with Williams's integrity objection but not necessarily Scheffler/Railton.  
  **Cases Used:**  
  1. **Saving-Wife Scenario** (Williams): A husband saves his wife from drowning. Is it corrupt if he includes the thought, "Saving her is permissible because she’s my wife" (an impartial justification for partiality)?  
  2. **Workplace Loyalty Scenario**: A manager must lay off one employee. Her mentor (who trained her) is a candidate. She spares her mentor due to their personal history.  

  ---

  #### **The Decision Tree**  
  *Answer each node based on cases alone—no prior labels needed.*  

  **Node 1: Is the problem that the impartial moral reason (e.g., "permissibility") is corrupting?**  
  - **Yes** → Go to Node 2.  
  - **No** → **Leaf A: Hard-line impartialist** (No corruption; impartial reasons belong in all deliberation).  

  **Node 2: Where does the corruption lie?**  
  - **Content**: Impartial reasons shouldn’t be part of the justification *at all* in intimate/professional contexts (e.g., "because she’s my wife" is invalid as a moral reason). → Go to Node 3.  
  - **Deliberative Role**: Impartial reasons are valid for justifying actions institutionally/politically, but corrupt when used in *first-person deliberation* (e.g., the husband/manager shouldn’t think about permissibility mid-crisis). → Go to Node 4.  

  **Node 3 (Content Flaw): What’s the fix?**  
  - **Structural**: Revise moral theory to exclude/impose constraints on impartiality (e.g., agent-relative permissions). → Go to Node 5.  
  - **Psychological**: Keep moral theory intact but insulate agents from deliberating with impartial reasons (e.g., train dispositions to act without calculation). → **Leaf B: Empty** (Incoherent: If content is flawed, insulating deliberation doesn’t fix invalid reasons).  

  **Node 4 (Role Flaw): What’s the fix?**  
  - **Structural**: Revise moral theory to limit when impartial reasons apply deliberatively (e.g., lexical priorities). → **Leaf C: Empty** (Unexplored: No major position combines role-diagnosis with structural revision).  
  - **Psychological**: Keep moral theory but shield agents from using impartial reasons in deliberation (e.g., rules of thumb). → **Leaf D: Railton-style indirect consequentialism** (Deliberative insulation).  

  **Node 5 (Structural Fix for Content Flaw): What grounds integrity?**  
  - **Ground Projects**: Coherence with chosen life-plans (e.g., the manager’s career investments; husband’s shared life goals). → **Leaf E: Scheffler-style agent-centered prerogative**.  
  - **Identity-Constitutive Attachments**: Fidelity to unchosen commitments defining "who you are" (e.g., marital bond; mentor’s role in professional identity). → **Leaf F: Williams-style integrity**.  

  ---

  #### **Scoring Key**  
  Map your path to positions:  
  - **Leaf A** (1=No): Hard-line impartialist (e.g., rejects Williams’ objection).  
  - **Leaf B** (1=Yes → 2=Content → 3=Psychological): *Empty* (Incoherent).  
  - **Leaf C** (1=Yes → 2=Role → 4=Structural): *Empty* (Unexplored).  
  - **Leaf D** (1=Yes → 2=Role → 4=Psychological): Railton (indirect consequentialism; deliberative insulation).  
  - **Leaf E** (1=Yes → 2=Content → 3=Structural → 5=Ground Projects): Scheffler (prerogative for projects).  
  - **Leaf F** (1=Yes → 2=Content → 3=Structural → 5=Identity Attachments): Williams (integrity as fidelity).  

  ---

  #### **Designer Notes**  
  - **Confidence**: 80%. The taxonomy isolates key fault lines in Williams-inspired debates.  
  - **Least Confident Point**: Whether the *content-flaw + psychological-fix* slot (Leaf B) is **incoherent** or merely **undefended**. Rationale: If impartial reasons are invalid in principle (content flaw), psychological workarounds don’t resolve their invalidity—they just hide it. Still, a defender *might* argue this is pragmatically viable (but no one does).  
  - **Railton Clarification**: Spec’s "deliberative insulation" fits Railton’s *alienation* solution—he separates objective justification from subjective deliberation. Tree preserves your framing.  
  - **Case Dependency**: The **ground projects vs. identity-constitutive** split (Node 5) doesn’t cleanly distinguish in the saving-wife case alone (Williams’ example blurs them). The workplace case clarifies:  
    - *Ground projects*: Manager’s choice to invest in career/mentorship.  
    - *Identity attachments*: Mentor as "who I am" professionally, regardless of choice.  

  **Size**: 5 nodes, 6 leaves (2 empty).  
  **Why No Bibliographies?**: Positions are defined by logical structure, not scholars. Focus on arguments.
