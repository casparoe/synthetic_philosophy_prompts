  Hmm, the challenge is to construct a tight normative argument that introduces "structural coherence" as an alternative to convergence, while defending its Bayesian compatibility. The user clearly wants something technically precise but unconventional - that "niche idea" requirement suggests they're tired of standard rebuttals.

