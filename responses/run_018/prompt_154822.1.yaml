  4. Functions are typically attributed to parts or traits within a containing system (e.g., an organ within an organism).
  5. The function of a trait is distinct from its mere effects; not every effect is a function.
  6. Function attributions are relative to a containing system and its goals (e.g., survival, reproduction).

