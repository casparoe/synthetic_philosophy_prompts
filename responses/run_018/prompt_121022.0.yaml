  We are working within a branching-time framework. In such a framework, time is represented as a tree structure: the past is fixed and linear, but the future branches into multiple possibilities. Each branch represents a possible future history.

  The problem of future contingents, as exemplified by the sea-battle, is that if we say now that "there will be a sea battle tomorrow" is true, then it seems that the sea battle is necessary. But we want to say that the future is open: it might happen, or it might not.

  In the branching-time framework, we can evaluate propositions at a moment in time relative to a particular branch (a history). However, the problem we are to address arises when we consider the truth of future-tensed propositions now (at a present moment) and the fact that indexicals like "tomorrow" depend on the context of utterance.

  Specifically, consider:

  - At the present moment, we have multiple future branches. In one branch (say, branch A) there is a sea battle tomorrow. In another branch (branch B) there is no sea battle tomorrow.

  - Now, suppose that in branch A, at the time that is tomorrow (relative to our present), a speaker utters: "There is a sea battle today." (Note: we can also consider the future-tensed utterance at the present time, but the problem is about the present truth of a future-tensed claim.)

  But the problem at hand is about a present utterance of a future-tensed sentence: "There will be a sea battle tomorrow." We want to know if this utterance, made now, is true or false.

  However, the challenge arises when we also consider that the same sentence type might be uttered in a different branch, but the indexical "tomorrow" shifts. For example:

  - At the present moment (call it t0) in the actual history, we utter: "There will be a sea battle tomorrow." We are considering whether this utterance is true at t0.

  - In branch A, at t0+1 day (which is tomorrow from t0), there is a sea battle. So in branch A, the utterance at t0 is true.

  - In branch B, at t0+1 day, there is no sea battle. So in branch B, the utterance at t0 is false.

  But note: the branching-time framework typically allows that at a moment of time, a proposition about the future is true if it is true in all branches (the Peircean view) or if it is true in the actual branch (which we don't know yet) or perhaps we use a supervaluationist approach (where a proposition is true if it is true in all branches, false if false in all, and indeterminate otherwise).

  However, the problem we are to address is about the identity of the proposition expressed by the utterance at t0. The issue is that if we consider a branch where the battle is averted (branch B), then at a later time in branch B, a speaker might utter the same sentence "there will be a sea battle tomorrow", but now the indexical "tomorrow" refers to a day that is after the time of that utterance in branch B. That day might be the same calendar day as the original tomorrow? Not necessarily. For instance, if the original utterance at t0 was on Monday about Tuesday, then an utterance in branch B on Tuesday about Wednesday would be a different proposition.

  But the problem we are to focus on is the present utterance at t0 and how we assign truth to it now.

  The conflict arises when we try to maintain both:

  1. Present bivalence: the proposition expressed by the utterance at t0 must be either true or false at t0.

  2. The idea that in the averted branch (branch B), the same sentence type might be uttered at a different time (say, at t0+1) and express a different proposition because the indexical "tomorrow" has shifted.

  But note: at t0, we are only concerned with the proposition expressed by the utterance at t0. However, the branching-time framework might lead us to think that the same proposition is being evaluated in different branches? Actually, the proposition expressed at t0 is fixed: it is about a specific day (the day after t0). So in branch A, that day has a battle; in branch B, it does not. So the proposition is false in branch B.

  But then, at t0, how do we assign a truth value? We don't know which branch is actual.

  This is where the supervaluationist approach comes in: at t0, the proposition is neither true nor false because it is true in some branches and false in others. But that rejects present bivalence.

  The problem we are to construct is about the identity of the proposition when we consider an utterance of the same sentence type in a different branch at a different time.

  Let me try to make it explicit:

  Suppose at t0, we have an utterance U1: "There will be a sea battle tomorrow." The proposition expressed by U1 is P1: that there is a sea battle at t0+1.

  Now, consider branch B, where there is no battle at t0+1. In branch B, at a later time, say t1 (which is after t0+1), a speaker might utter the same sentence: "There will be a sea battle tomorrow." This is utterance U2. The proposition expressed by U2 is P2: that there is a sea battle at t1+1.

  Note that P1 and P2 are different propositions because they are about different times.

  The conflict arises when we try to maintain that at t0, the proposition P1 must be either true or false. If we say it is true, then the battle must occur at t0+1 in every branch? That would be fatalism. If we say it is false, then the battle must not occur at t0+1 in any branch? That is also fatalism.

  But if we say that in branch B, the proposition P1 is false (which it is, because in branch B there is no battle at t0+1), then we are not saying that the utterance U2 in branch B is the same proposition. They are distinct.

  So where is the tension?

  The tension is in the idea that the averted branch (branch B) contains a "false version" of the same claim. But actually, the claim that was made at t0 (P1) is false in branch B. However, when we consider an utterance in branch B at a later time (t1) that uses the same words, it is a different proposition (P2). So we are not evaluating the same proposition in both branches for the later utterance.

  But the problem for present bivalence at t0 is that we cannot assign a truth value to P1 at t0 without knowing the future. And the branching-time framework shows that at t0, there are branches where P1 is true and branches where P1 is false.

  Therefore, if we insist on present bivalence, we must assign a truth value to P1 at t0 that holds across all branches? That would mean that either P1 is true in all branches (so the battle happens no matter what) or false in all branches (so the battle does not happen no matter what). This is the fatalist conclusion.

  The alternative is to reject present bivalence and say that at t0, P1 is neither true nor false. But that is not the issue we are to focus on.

