  **Must-Hit Points**  
  1. **No-tagging EU calculation** (4 marks):  
     - Setup: \( \text{EU} = 1 - 6p + 9p^2 \) (1 mark).  
     - Optimal \(p = 1/3\), EU = 0 (1 mark).  
     - *Typical mistake:* Incorrect payoff terms (e.g., omitting P’s exit penalty).  

  2. **Tagging strategy yields EU = 3** (4 marks):  
     - Tag at S: Continue at both nodes (1 mark).  
     - Tag at P: Continue at both nodes and driver *knows* location at S (1 mark).  
     - *Typical mistake:* Assumes driver cannot infer location when tagging at P.  

  3. **EDT/CDT agreement on tagging’s value** (4 marks):  
     - Both value tagging at 3 (1 mark).  
     - Tagging changes the *epistemic partition* (beliefs) without altering causal structure (1 mark).  
     - *Typical mistake:* Claims divergence in optimal EU.  

  4. **Divergence in phantom vs. classic** (4 marks):  
     - Phantom breaks payoff symmetry, making conditional actions vital (1 mark).  
     - EDT treats tagging as *evidence* about location; CDT treats it as *information access* (1 mark).  
     - *Typical mistake:* Fails to contrast with classic problem’s symmetry.  

  5. **Latent divergence in belief-updating** (4 marks):  
     - EDT’s correlation: Tagging at P is evidence of being at P (higher risk) (1 mark).  
     - But continuing dominates, masking divergence (1 mark).  
     - *Typical mistake:* Assumes EDT undervalues tagging due to risk correlation.  

