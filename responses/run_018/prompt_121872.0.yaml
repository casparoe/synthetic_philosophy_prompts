  ### Exam Question: Rational Choice and Self-Locating Belief

  **Scenario:**  
  The absent-minded driver must reach the real exit 2 to receive a payoff of 4. However, a phantom exit exists between exit 1 and exit 2, visually identical to exit 2 but yielding a payoff of -5. The driver knows the phantom exists but cannot distinguish it from exit 2. He carries a one-time-use button to "tag" his current location. Pressing the button costs 1 utility and provides a visible marker only at the tagged intersection. The driver’s intersections are:  
  - **Start (S)**: Exit here → payoff 1.  
  - **Phantom (P)**: Exit here → payoff -5.  
  - **Real Exit 2**: Exit here → payoff 4.  
  If the driver continues at S, he reaches P. Continuing at P leads to exit 2. Due to absent-mindedness, at any intersection, the driver cannot tell whether he is at S or P. Tagging breaks this symmetry: if he tags S, he recognizes S (tag visible) and infers P is untagged (and vice versa).  

  **Question:**  
  a) Determine the optimal strategy: whether to tag (at S, at P, or not at all) and what action (exit or continue) to take at each possible node, conditional on available information. Justify with expected utility calculations.  
  b) Explain whether Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) diverge in their evaluation of tagging in this phantom-exit variant, unlike the classic two-exit absent-minded driver problem. Highlight where and why CDT and EDT split in their reasoning.  

  ---

  ### Model Answer (600 words)  

  #### Part a: Optimal Strategy  
  The optimal strategy is to **tag at either S or P** and **continue at both nodes**, yielding an expected utility (EU) of 3.  

  **1. No tagging (baseline):**  
  Without tagging, the driver cannot distinguish S from P and must choose the *same* action at both. Let \(p\) be the probability of continuing at any intersection. The expected utility is:  
  \[
  \text{EU} = (1-p)(1) + p\left[(1-p)(-5) + p(4)\right] = 1 - p -5p(1-p) + 4p^2 = 1 - 6p + 9p^2.
  \]  
  Maximizing EU: \(\frac{d}{dp}(1 - 6p + 9p^2) = -6 + 18p = 0 \Rightarrow p = \frac{1}{3}\).  
  At \(p = \frac{1}{3}\), \(\text{EU} = 1 - 6(\frac{1}{3}) + 9(\frac{1}{3})^2 = 0\).  

  **2. Tag at S (cost = 1):**  
  - At S: Driver sees the tag, knows he is at S.  
    - Exit: payoff \(1 - 1 = 0\).  
    - Continue: proceeds to P.  
  - At P: No tag visible, so driver knows he is at P.  
    - Exit: payoff \(-5 - 1 = -6\).  
    - Continue: payoff \(4 - 1 = 3\).  
  Optimal: Continue at S and continue at P → EU = 3.  

  **3. Tag at P (cost = 1, incurred only if P is reached):**  
  - At S: No tag and no press yet → driver knows he is at S (if at P, he would press and see the tag).  
    - Exit: payoff 1 (no cost, as button not pressed).  
    - Continue: proceeds to P.  
  - At P: Presses button (cost 1), sees tag, knows he is at P.  
    - Exit: \(-5 - 1 = -6\).  
    - Continue: \(4 - 1 = 3\).  
  Optimal: Continue at S and continue at P → EU = 3.  

  **Conclusion:** Tagging at S or P and continuing at both nodes yields EU = 3, dominating no-tagging (EU = 0). The driver is indifferent between tagging at S or P.  

  #### Part b: CDT and EDT Divergence  
  **Classic vs. Phantom-Exit Variant:**  
  - **Classic problem (no phantom):** Exits are symmetric (payoffs 0 and 4). Both CDT and EDT agree on the value of tagging (EU = 3 vs. mixed-strategy EU = \(8/9\)) and do not diverge.  
  - **Phantom variant:** CDT and EDT **diverge in evaluating the tagging action itself**, unlike the classic case. The phantom breaks payoff symmetry (S = 1, P = -5), making *conditional actions* crucial, but tagging’s *epistemic* role (updating beliefs) creates a split.  

  **Where CDT and EDT Split:**  
  - **CDT** evaluates tagging *causally*: Pressing the button has no causal effect on the driver’s location (the causal structure—road topology—is unchanged). Tagging only provides information to choose contextually optimal actions (continue at S, continue at P). CDT thus values tagging at 3 - 0 = 3.  
  - **EDT** evaluates tagging *evidentially*: Pressing the button provides *evidence* about the driver’s location. At P, pressing the button correlates with being at the high-risk node, raising the *evidential probability* of facing the phantom. However, since the driver only presses when it breaks the information set, EDT’s updated belief (e.g., "I pressed at P, so I’m likely at P") does not change the optimal action (continue is still best). Thus, EDT also values tagging at 3.  

  **Divergence in Nuance, Not Outcome:**  
  - **Classic problem:** No divergence; symmetric payoffs mean tagging’s evidential role lacks tension.  
  - **Phantom variant:** The phantom’s asymmetry (-5 payoff) makes tagging’s *evidential* impact (e.g., "pressing at P suggests I’m at the bad node") *appear* riskier under EDT. However, since the driver’s *optimal action* (continue) is unchanged, EDT and CDT converge on the same EU. The divergence is **latent in belief-updating** but **masked by dominance of continuing** at P. If the phantom’s payoff were less extreme (e.g., -1), EDT might undervalue tagging due to correlation with high-risk states.  

  **Conclusion:**  
  The phantom variant reveals a theoretical divergence: CDT views tagging as *purely informational* (causally inert), while EDT sees it as *evidence* updating self-locating beliefs. In practice, they converge on tagging’s value (3) because the optimal action (continue) dominates regardless of beliefs. This divergence is sharper here than in the classic problem due to the phantom’s asymmetric risk.  

