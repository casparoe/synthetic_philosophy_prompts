answer: |-
  This curatorial protocol reflects a sophisticated, politically embedded epistemology with distinct philosophical commitments. Let's reconstruct the implicit theory step by step:

  **Core Philosophical Commitments:**
  1.  **Epistemology of Evidence:**
      *   **Rejection of Archival Hegemony:** It denies that documentary evidence holds inherent, superior reliability over testimonial evidence (especially collective oral testimony/lived experience).
      *   **Epistemic Pluralism:** It posits that historical knowledge arises from *multiple, qualitatively distinct* sources (documents, oral testimony, embodied memory, cultural practice) which capture different aspects of the past.
      *   **Situated Knowledge & Standpoint Epistemology (Implicit):** Lived experience, particularly of marginalized or victimized groups, grants access to truths (emotional, sensory, social, subjective) that official archives systematically exclude, distort, or cannot capture (e.g., trauma, humiliation, resistance strategies, internal community dynamics). Testimony isn't just "data"; it constitutes a distinct *way of knowing*.
      *   **Constructivist View of Evidence:** The meaning and significance of *any* evidence (including documents) are not self-evident but are interpreted through frameworks shaped by power, perspective, and present needs.

  2.  **Collective Identity & Narrative:**
      *   **Identity-Constitutive Narratives:** A group's historical self-understanding is not merely *about* the group; it is *constitutive* of the group's identity and social reality in the present. Denying or undermining this narrative is seen as an ontological harm, not just an epistemic disagreement.
      *   **Group Epistemic Authority:** Communities, especially those directly affected by historical trauma or injustice, possess a form of legitimate authority over the interpretation of events central to their identity and suffering. This authority stems from their unique experiential relationship to the past and its ongoing consequences.
      *   **Recognition as a Primary Good:** The practice prioritizes the *recognition* of the community's experience and perspective as a fundamental political and ethical good, crucial for reconciliation and dignity in post-conflict settings, sometimes even over purely factual accuracy.

  3.  **Purpose of Public History:**
      *   **Beyond Factual Accuracy:** The primary goal shifts from establishing a single, objectively verifiable account ("What happened?") towards facilitating dialogue, acknowledging multiple perspectives, fostering social healing, promoting reconciliation, and rectifying historical erasure or silencing.
      *   **Restorative/Transformative Justice:** Museums and memorials are envisioned as sites for repairing historical injustices by centering marginalized voices and challenging dominant (often perpetrator- or state-centric) narratives embedded in archives.
      *   **Dialogic Truth:** The "truth" presented is often conceived as emerging from the *encounter* or *juxtaposition* of different accounts, rather than residing solely in one validated version.

  **Distinguishing Requirements, Compatibilities, and Contested Areas:**

  *   **Strictly Required by the Practice:**
      1.  **Non-Ranking of Conflicting Accounts:** The presentation must avoid declaring one source (archive or testimony) inherently more reliable or truthful than the other *in the public display*.
      2.  **Centering Community Voice:** The community's perspective must be presented as equally valid *for public purposes*, regardless of professional historical assessment of its factual accuracy.
      3.  **Potential Editorial Authority:** The framework *allows for*, and in some cases mandates, the community having final say over how the history is publicly framed, even against professional consensus based on documents.

  *   **Fits Well With (But Not Strictly Required):**
      *   Strong Social Constructivism (history is entirely a narrative construct).
      *   Radical Relativism (all truths are equally valid).
      *   Explicit Rejection of Historical Objectivity as an ideal.
      *   Deep suspicion of state archives as inherently tools of power/oppression.

  *   **Mutual Consistency?** The core commitments *can* be consistent *if*:
      *   The "constitutive" nature of identity narratives is seen as operating on a different (social/ontological) level than empirical historical claims.
      *   Epistemic pluralism is limited to recognizing *different kinds* of historical truths (subjective/experiential vs. event-sequence/contextual), not necessarily granting equal empirical weight to all factual claims.
      *   However, **significant tension exists** when:
          *   Community editorial authority overrides well-substantiated documentary evidence about specific events (e.g., dates, numbers, sequences). This strains the commitment to *any* shared empirical reality.
          *   The need for recognition and restorative justice clashes directly with professional standards of evidence-based history. Prioritizing the former *can* undermine the latter.

  *   **Broadly Accepted vs. Genuinely Contested:**
      *   **Broadly Accepted (among historians/philosophers):**
          *   Historians rely heavily on testimony (oral history, interviews, memoirs) alongside documents; it's a standard source.
          *   Archives are not neutral; they reflect power structures, biases, and gaps.
          *   Lived experience provides crucial, often irreplaceable, insights into the subjective dimensions of history (emotions, motivations, impact).
          *   Public history serves social and political functions beyond academic historiography.
          *   Silenced voices need to be recovered and centered.
      *   **Genuinely Contested:**
          *   **Epistemic Status of Collective Memory:** Does collective memory/testimony deserve *equal or superior* epistemic weight to documents regarding *factual claims* (vs. experiential truth)? Most professional historians would say no for establishing empirical events, while acknowledging its unique value.
          *   **Constitutive Claim:** Does a group's self-understanding *constitute* the historical fact itself, or is it an interpretation *of* facts? This is highly contentious, leaning towards postmodern views often challenged by realist philosophers/historians.
          *   **Normative Authority:** Should communities have *final editorial authority* over public historical representation, superseding professional historians' judgments based on evidence? This is deeply disputed, seen by critics as sacrificing truth for politics or therapy.
          *   **Relativism vs. Objectivity:** Can historical knowledge achieve any degree of objective accuracy, or is it always perspectival/constructed? The practice leans towards the latter, which remains a major philosophical divide.

  **Impact of Replacing the Framework (Archival Accuracy as Decisive):**

  If museums/memorials adopted a framework where archival accuracy (as determined by professional historians) was *always* decisive in conflicts:

  1.  **Content Changes:** Accounts heavily reliant on oral tradition or collective memory conflicting with documents would be marginalized, corrected, or excluded from the primary narrative. Displays would emphasize the "documented truth," potentially downplaying or refuting community narratives.
  2.  **Loss of Editorial Authority:** Community groups would lose their privileged position in determining the final public framing. Historians/curators, guided by document-based evidence, would hold ultimate authority.
  3.  **Shift in Purpose:** The primary goal would become establishing the most accurate factual account possible based on rigorous source criticism, rather than facilitating dialogue, recognition, or restorative justice *if* those goals conflict with document-based facts. Emphasis would shift towards "getting the history right" over "healing historical wounds" through narrative validation.
  4.  **Potential Consequences:**
      *   **Increased Credibility (for some):** Institutions might gain credibility among audiences valuing empirical rigor and traditional historical methods.
      *   **Alienation & Distrust:** Affected communities could feel re-silenced, disrespected, and that their lived reality is again being invalidated by "official" sources perceived as biased or incomplete. This could severely damage trust and hinder reconciliation efforts.
      *   **Oversimplification:** Risk of presenting a "flattened" history that misses the subjective, emotional, and communal dimensions crucial to understanding the impact of events, especially trauma.
      *   **Perpetuation of Bias:** If archives themselves are flawed or biased (as they often are, especially regarding marginalized groups), privileging them uncritically could perpetuate historical injustices in the narrative.
      *   **Reduced Complexity:** The productive tension and dialogue inherent in presenting multiple perspectives side-by-side would be eliminated in favor of a single "authoritative" account.

  **In essence, the current protocol rests on a commitment to epistemic pluralism, the ontological significance of group identity narratives, and a restorative/political purpose for public history, consciously prioritizing recognition and reconciliation over strict document-based factual accuracy in cases of conflict. Shifting to archival decisiveness would represent a fundamental philosophical reversal, prioritizing empirical verification and professional authority, with significant implications for both the content presented and the relationship between institutions and the communities they seek to serve.** The tension between these frameworks highlights the enduring conflict between truth, memory, justice, and authority in representing difficult pasts.
