answer: |-
  Here are five points:

  1.  Judges protect fundamental rights even if popular, as constitutions guard against "tyranny of the majority" where elected bodies might violate minority or individual rights.
  2.  Upholding expressive rights (like free speech/art) is a core judicial duty when laws overreach, preventing censorship even for unsettling or unpopular expression.
  3.  Courts possess specific legal expertise to interpret constitutional limits on government power, a role distinct from the council's policy-making function.
  4.  While councillors represent the community's *policy* desires, judges are charged with ensuring those policies comply with higher legal frameworks like human rights charters.
  5.  The judicial review process allows for legal challenges and correction if legislation infringes protected rights, acting as a necessary check and balance.
