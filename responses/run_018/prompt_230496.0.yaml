prompt: |-
  You are an expert on the philosophy of collective action and the epistemics of group decision-making. I want a careful structural diagnosis rather than generic leadership advice.

  I am one of seven volunteer moderators of a long-running online community of about forty thousand members. We are all equals on paper, and each of us has the permission to post a site-wide announcement without anyone else's approval. For the past week we have been privately debating whether to respond to a platform policy change that we all regard as bad for the community. All seven of us drafted a personal statement protesting the change. After the drafts circulated, an odd pattern emerged. Each of us, reading only our own draft, concluded that if that draft alone went out, it would be a net positive: it would signal that the moderation team is engaged and might put useful pressure on the platform. Yet we also all agreed that if even three or four of the seven statements went out, it would look as though the moderation team had splintered, and the community would end up worse off than if no statement had been posted. I am fairly confident everyone is reasoning honestly, but the pattern feels structurally broken.

  Please first brainstorm the structural features of the case, then identify the underlying problem and explain how seven individually reasonable judgments could produce a collectively bad outcome. Finally, recommend a concrete decision procedure we could adopt so that this kind of failure does not recur.
reasoning: |-
  Hmm, the user is describing a fascinating collective action problem within their moderation team. They're one of seven volunteer moderators for a 40k-member online community facing a platform policy change. The peculiar situation is that each moderator believes their individual protest statement would be beneficial if posted alone, but that posting multiple statements (even just 3-4) would create harmful fragmentation perceptions. This creates a paradoxical situation where individually rational decisions could lead to collectively worse outcomes.

  The user is clearly knowledgeable - they specifically requested a structural diagnosis rather than generic advice, and used precise terms like "epistemics of group decision-making." They're likely frustrated by this logical trap and want to understand why reasonable individuals create unreasonable group outcomes. The core tension seems to be between individual expression and collective coherence.

  Key structural features stand out: First, the threshold effect where the cost function changes dramatically at 3-4 statements. Second, the permission asymmetry where any moderator can act unilaterally. Third, the assessment asymmetry where each can only properly evaluate their own draft's quality. Fourth, the coordination problem without formal leadership. Fifth, the volunteer context that limits enforcement mechanisms.

  The underlying problem resembles both assurance games and volunteer dilemmas. Each moderator wants to protest but only if not too many others do. Without coordination, they risk either under-protest (no statements) or over-protest (too many statements). The "splintering" perception is particularly interesting - it suggests the community interprets multiple statements as disunity rather than emphasis.

  For solutions, we need procedures that resolve the assessment asymmetry while preventing unilateral action. A commitment device seems essential. The multi-stage proposal with draft consolidation and sequential ratification could work because it creates: 1) shared evaluation criteria, 2) a single-output constraint, and 3) a mutual veto safety net. The fallback position of no statement if no consensus protects against worst outcomes.

  The ratification threshold of 5/7 is deliberate - high enough to ensure broad support but low enough to avoid paralysis. Crucially, this system channels the moderators' shared desire to protest into coordinated action rather than letting individual intentions collide destructively.
answer: |-
  Here's a structural diagnosis of your situation and a concrete procedural solution:

  ### Key Structural Features
  1. **Unilateral Action Capacity**: Any moderator can trigger a significant community event (posting a statement) without consent.
  2. **Assessment Asymmetry**: Each mod can best evaluate their *own* draft's nuance/intent but imperfectly assess others'.
  3. **Non-Linear Impact**: Outcomes aren't additive. Impact shifts from positive (1 statement) to negative (3-4 statements) at a critical threshold.
  4. **Common Knowledge Problem**: While all agree on the threshold effect, no one knows others' true likelihood of posting.
  5. **Volunteer Constraint**: Lack of formal hierarchy + limited time prevents complex coordination.

  ### The Core Problem: A Multi-Agent Assurance Dilemma
  This is a **threshold public goods game** with **private value signals**:
  - Each mod receives a "private signal" (their own draft's quality) suggesting individual action is beneficial
  - The public good (team cohesion perception) is destroyed if *too many* act individually
  - There's no coordination mechanism to ensure the *optimal number* (1-2 statements) is achieved

  **Why Reasonable Individuals Create Collective Irrationality:**
  1. **First-Order Reasoning**: *"My statement is good → Posting it helps"* (neglects others' actions)
  2. **Second-Order Uncertainty**: *"Will others post? I can't trust they'll restrain themselves"* → Preemptive posting
  3. **Reciprocal Fear**: *"If I don't post but others do, my voice is drowned out"* → Race to post first
  4. **Epistemic Isolation**: No mod can judge if *their* draft is among the "best 2" worthy of publication

  ### Recommended Decision Procedure: **Ratified Unilateralism with Fallback**
  Adopt this amendment to your operating rules:

  1. **Deliberation Phase** (72 hours):
     - All drafts posted anonymously in shared space
     - Collaborative editing allowed to create 1-2 unified options
     - *If* consensus emerges for unified statement(s), proceed

  2. **If No Consensus**:
     - **Step 1**: Secret ballot ranking all drafts (including "no statement")
     - **Step 2**: Top 2 drafts enter runoff
     - **Step 3**: Moderators vote YES/NO on *each* runoff draft separately
       - A draft "passes" if approved by ≥5 mods
       - Maximum of 2 statements may pass

  3. **Implementation**:
     - Passing statements are posted simultaneously
     - If no draft passes, no statement is issued

  ### Why This Works
  - **Breaks Assessment Asymmetry**: Anonymous evaluation allows objective comparison
  - **Solves Threshold Problem**: Voting ensures ≤2 statements
  - **Prevents Preemption**: Simultaneous posting removes first-mover advantage
  - **Preserves Autonomy**: High threshold (5/7) prevents minority imposition
  - **Creates Constructive Default**: "No statement" remains viable outcome

  ### Implementation Notes
  1. **Use a trusted voting tool** (e.g., CryptPad) with audit trail
  2. **Make ratification threshold explicit**: "No statement passes without supermajority"
  3. **Add sunset clause**: Procedure expires after 6 months unless reaffirmed

  This transforms your structural weakness (unilateral action capacity) into strength through **constrained choice architecture**. It channels individual initiative into collective rationality while preserving volunteer autonomy. The critical innovation is replacing unilateral *action* with unilateral *proposal rights*, filtered through multi-stage peer review.

  Would you like operational details on conducting anonymous evaluations or handling tie scenarios?
