prompt: |-
  I serve on the grant-review committee for a regional agricultural-innovation fund, and we now receive roughly two proposals a week that could affect invertebrate welfare—novel pesticides, automated harvesting architectures, biological-control introductions, and indoor-farming systems. I am trying to apply a framework I have been developing that treats sentience not as a binary threshold but as a continuous credence parameter p(i) assigned to a taxonomic group i, scaled by population exposure N and a rough severity weight s(i) to yield an expected moral load L = p(i)·N·s(i). To keep the scale argument from automatically swamping every other consideration, the framework includes what I call a discontinuity brake: when p(i) falls below an evidential floor—where behavioral analogies to vertebrate nociception are weak—L does not by itself dominate the decision unless an additional flag for direct, intentional, and avoidable harm is present. There is also an explicit phylogenetic boundary condition, acknowledged as value-laden rather than biologically absolute, that stops the scaling argument before it reaches organisms lacking any integrated nervous architecture; and a reversal check that halts the procedure if applying L consistently implies we must prioritize microbial welfare over human welfare.

  Please turn this into a reusable decision procedure my committee can run in about twenty minutes per proposal, without anyone needing to read primary neuroscience literature. The deliverable should be a step-by-step flow in words: the ordered questions to ask, what counts as a sufficient answer at each node, the precise conditions under which the procedure stops with a no, a deferral, or a hand-off to human judgment, and the points where judgment is unavoidable and must be signed off by a designated reviewer. Include a small set of applied test criteria—phrased as questions about the proposal text—that help determine p(i) and whether the harm in question is direct and intentional versus foreseen but structurally unavoidable. Then run the procedure on three proposals: (a) funding a targeted neuropeptide pesticide that disrupts feeding in aphids but may also affect pollinators with similar receptor pathways; (b) funding a vertical-farm module that eliminates chemical pesticides but uses high-speed mechanical separation that crushes aphids and thrips; and (c) funding the release of a parasitoid wasp for biological control of a crop pest, knowing the wasps cause prolonged internal parasitism in host larvae. Include at least one case—likely (c)—where the procedure yields an answer that supports funding despite substantial invertebrate harm, and specify exactly which node in the flow produces that result. Finally, state clearly what the procedure cannot do, particularly whether it can resolve disputes about where the evidential floor or phylogenetic boundary should sit, or whether it merely relocates those disagreements into explicit parameter choices.
reasoning: |-
  We are creating a step-by-step decision procedure for evaluating grant proposals that might impact invertebrate welfare. The framework uses:
   L = p(i) * N * s(i) 
   where:
     p(i) = credence of sentience for taxonomic group i (continuous, 0 to 1)
     N = population exposure (number of individuals affected)
     s(i) = severity weight (rough measure of harm severity, e.g., 1 for mild, 2 for moderate, 3 for severe)

   Additional features:
   1. Discontinuity brake: When p(i) falls below an evidential floor (where behavioral analogies to vertebrate nociception are weak), L does not by itself dominate unless there is direct, intentional, and avoidable harm.
   2. Phylogenetic boundary: We stop before organisms without any integrated nervous architecture (e.g., no nervous system at all).
   3. Reversal check: If applying L consistently implies we must prioritize microbial welfare over human welfare, we halt and reconsider.

   The procedure must be run in about 20 minutes per proposal without primary neuroscience literature.

   Steps:

   I. Pre-screening: 
      A. Identify the taxonomic groups (i) that are affected by the project. 
      B. Estimate the population exposure (N) for each group.
      C. Classify the nature of harm and assign a severity weight (s(i)) for each group.

   II. Determine p(i) for each group: 
      We provide a lookup table for p(i) based on existing consensus (or committee's prior agreement) for common taxa. The table will have:
          - High p(i) (e.g., 0.7-1.0): groups with strong evidence (e.g., cephalopods, decapod crustaceans).
          - Medium p(i) (e.g., 0.3-0.7): groups with moderate evidence (e.g., insects, spiders).
          - Low p(i) (e.g., 0.0-0.3): groups with weak evidence (e.g., nematodes, bivalves).

      The lookup table must be pre-agreed by the committee and reviewed annually.

      If a group is not in the table, use the following test criteria (applied to proposal text or known biology) to assign a category:

      Test criteria for p(i) (questions about the proposal text and known biology):
          1. Does the organism have a centralized brain or ganglia? (Yes -> increases p(i))
          2. Are there behavioral studies showing avoidance learning, prolonged protective behavior after injury, or trade-offs between injury and reward? (Yes -> increases p(i))
          3. Are there known homologs of nociception-related genes and neural pathways in vertebrates? (Yes -> increases p(i))
          4. Is the organism in a taxonomic group that is known to exhibit complex social behavior or tool use? (Yes -> increases p(i))

      Based on the answers, assign to High, Medium, or Low category and use the corresponding p(i) range. If there is uncertainty, use the lower bound of the range.

      Exception: If the organism lacks any integrated nervous architecture (e.g., no nervous system at all, like protozoa, plants, fungi), then set p(i)=0 and stop further consideration for that group (phylogenetic boundary).

   III. Calculate L for each group: L = p(i) * N * s(i)

   IV. Apply the discontinuity brake:
      - For groups with p(i) below the evidential floor (e.g., p(i) <= 0.3, which we call the "low" category), then:
          * If the harm is direct, intentional, and avoidable (see criteria below), then L is considered as calculated.
          * Otherwise, set L = 0 for that group.

      Criteria for direct, intentional, and avoidable harm (applied per group):
          - Direct: The harm is a direct result of the intervention (e.g., pesticide kills the insect, crushing in machinery).
          - Intentional: The harm is intended (e.g., the pesticide is designed to kill pests) or if not intended, then it is a means to an end (e.g., crushing is necessary for the machine's function and there is no alternative).
          - Avoidable: There are feasible alternatives that the proposal could have adopted to reduce or avoid the harm, but the proposers did not choose them.

          If all three are true, then the harm is considered under the discontinuity brake. Otherwise, for low p(i) groups, we disregard L.

   V. Reversal check:
      - If the total L across all groups (especially including microbes or very low p(i) organisms) would lead to prioritizing their welfare over human welfare in a way that reverses common moral intuitions (e.g., if we must avoid a project that would save many human lives because it harms a huge number of bacteria with p(i)=0.01), then we halt and note that the framework is producing a reversal. In such cases, we defer to human judgment (with a designated reviewer) and note that the framework might need adjustment.

   VI. Decision:
      - Sum L for all groups to get total moral load (L_total).
      - Compare L_total against the benefits of the project (which are assessed separately by the committee, e.g., human welfare benefits, environmental benefits, etc.).

      However, note that the framework does not directly balance L_total against benefits. Instead, it flags proposals with high L_total for extra scrutiny. The committee must then decide if the benefits justify the moral load.

      We structure the output as:
          A. If L_total is below a pre-agreed threshold (say, T1), then no special concern: proceed to other criteria (e.g., scientific merit, feasibility) without further invertebrate welfare concerns.
          B. If L_total is above T1 but below a higher threshold T2, then the proposal must include a justification for the harm (e.g., why alternatives are not feasible, or why the benefits outweigh) and the committee will consider it in their overall assessment.
          C. If L_total is above T2, then the proposal is flagged for rejection unless the benefits are extraordinary and the harm is unavoidable.

      But note: The committee must set T1 and T2 in advance.

      However, to make it a step-by-step flow:

      Steps:

      1. Identify affected taxonomic groups and their N and s(i). 
          - If no invertebrates are affected, stop: no issue.
          - For each group, if it falls below the phylogenetic boundary (no nervous system at all), set p(i)=0 and skip.

      2. For each group, assign p(i) from the lookup table or by using the test criteria. If using test criteria, document the answers.

      3. For groups with p(i) in the low range (e.g., <=0.3), check:
