answer: |-
  ### Decision Procedure for Invertebrate Welfare Assessment in Grant Proposals  
  **Time Limit:** 20 minutes per proposal  
  **Preconditions:** Committee pre-agrees on:  
  - **Lookup table** for \( p(i) \) (credence of sentience) by taxonomic group (see Table 1).  
  - **Evidential floor:** \( p(i) \leq 0.3 \) (low-credence groups).  
  - **Phylogenetic boundary:** Groups with **no integrated nervous system** (e.g., protozoa, plants, fungi) automatically excluded.  
  - **Severity weights:** \( s(i) = 1 \) (mild), \( 2 \) (moderate), \( 3 \) (severe).  
  - **Thresholds:** \( T_1 = 1,000 \), \( T_2 = 10,000 \) for moral load \( L \).  
  - **Designated reviewer** handles unresolved judgments.  

  ---

  #### Step-by-Step Flow  
  **Step 1: Identify Affected Taxa**  
  - **Question:** "Which invertebrate groups are directly harmed, and what is the estimated population exposure \( N \)?"  
  - **Sufficient answer:** List taxa and \( N \) (e.g., "aphids: \( N = 10^6 \)").  
  - **Stop condition:** If no invertebrates affected → **No concern**.  
  - **Boundary check:** Exclude taxa without integrated nervous systems (e.g., rotifers, flatworms if no ganglia) → **Excluded**.  

  **Step 2: Assign Credence \( p(i) \)**  
  - **Question:** "What is \( p(i) \) for each taxon? Use Table 1 or apply test criteria."  
    **Test Criteria (for taxa not in Table 1):**  
    1. *Centralization:* "Does the organism have ganglia/brain? (Yes: +1, No: 0)"  
    2. *Nociception homology:* "Are vertebrate-like nociception pathways documented? (Yes: +1, No: 0)"  
    3. *Avoidance behavior:* "Does it show trade-offs between injury and reward? (Yes: +1, No: 0)"  
    4. *Protective behavior:* "Prolonged injury response (e.g., grooming, hiding)? (Yes: +1, No: 0)"  
  - **Scoring:**  
    - 3–4 "Yes" → **High** (\( p(i) = 0.7 \))  
    - 1–2 "Yes" → **Medium** (\( p(i) = 0.5 \))  
    - 0 "Yes" → **Low** (\( p(i) = 0.2 \))  
  - **Judgment call:** Ambiguous scores → **Defer to designated reviewer**.  

  **Table 1: Pre-Agreed \( p(i) \) Lookup Table**  
  | Taxonomic Group       | \( p(i) \) | Category |  
  |------------------------|------------|----------|  
  | Cephalopods, Decapods  | 0.9        | High     |  
  | Insects, Arachnids     | 0.5        | Medium   |  
  | Gastropods, Annelids   | 0.3        | Low      |  
  | Nematodes, Bivalves    | 0.2        | Low      |  

  **Step 3: Assign Severity \( s(i) \)**  
  - **Question:** "What is the nature of harm? Reference:  
    - \( s(i) = 1 \): Reversible stress (e.g., brief confinement).  
    - \( s(i) = 2 \): Injury with recovery (e.g., limb loss).  
    - \( s(i) = 3 \): Lethal/prolonged suffering (e.g., crushing, parasitism)."  
  - **Sufficient answer:** Justify \( s(i) \) based on harm duration and irreversibility.  

  **Step 4: Apply Discontinuity Brake**  
  - **Question:** "For taxa with \( p(i) \leq 0.3 \), is harm **direct, intentional, and avoidable**?"  
    - **Direct:** Harm is an immediate mechanism (e.g., pesticide action).  
    - **Intentional:** Harm is a goal or necessary means (e.g., pest elimination).  
    - **Avoidable:** Feasible alternatives exist but were not adopted.  
  - **Condition:** If **all three are true** → Proceed.  
    If **any false** → Set \( L = 0 \) for that taxon.  
  - **Judgment call:** Disagreement on criteria → **Defer to designated reviewer**.  

  **Step 5: Calculate Moral Load \( L \)**  
  - \( L_i = p(i) \times N \times s(i) \) for each taxon.  
  - **Sum:** \( L_{\text{total}} = \sum L_i \).  

  **Step 6: Reversal Check**  
  - **Condition:** If \( L_{\text{total}} \) is driven by taxa with \( p(i) < 0.1 \) **and** implies prioritizing microbes over humans.  
  - **Action:** If triggered → **Halt and defer to committee chair**.  

  **Step 7: Decision**  
  - \( L_{\text{total}} \leq T_1 \) (1,000) → **No welfare concern**.  
  - \( T_1 < L_{\text{total}} \leq T_2 \) (10,000) → **Flag for justification** (benefits must outweigh harm).  
  - \( L_{\text{total}} > T_2 \) → **Reject unless extraordinary benefits**.  
  - **Judgment call:** Extraordinary benefits → **Designated reviewer approval required**.  

  ---

  ### Applied Test Cases  
  #### Case (a): Targeted Neuropeptide Pesticide  
  - **Step 1:** Aphids (\( N = 10^6 \)), pollinators (\( N = 10^3 \)).  
  - **Step 2:** Aphids (insects) → \( p(i) = 0.5 \); Pollinators (insects) → \( p(i) = 0.5 \).  
  - **Step 3:** Aphids: lethal (\( s(i) = 3 \)); Pollinators: lethal (\( s(i) = 3 \)).  
  - **Step 4:** \( p(i) > 0.3 \) → Brake not applied.  
  - **Step 5:**  
    \( L_{\text{aphids}} = 0.5 \times 10^6 \times 3 = 1,500,000 \)  
    \( L_{\text{pollinators}} = 0.5 \times 10^3 \times 3 = 1,500 \)  
    \( L_{\text{total}} = 1,501,500 \)  
  - **Step 6:** Not triggered.  
  - **Step 7:** \( L_{\text{total}} > T_2 \) → **Reject unless extraordinary benefits**.  

  #### Case (b): Vertical-Farm Mechanical Separation  
  - **Step 1:** Aphids/thrips (\( N = 10^5 \)).  
  - **Step 2:** Insects → \( p(i) = 0.5 \).  
  - **Step 3:** Crushing death → \( s(i) = 3 \).  
  - **Step 4:** \( p(i) > 0.3 \) → Brake not applied.  
  - **Step 5:** \( L_{\text{total}} = 0.5 \times 10^5 \times 3 = 150,000 \)  
  - **Step 6:** Not triggered.  
  - **Step 7:** \( L_{\text{total}} > T_2 \) → **Reject unless extraordinary benefits**.  

  #### Case (c): Parasitoid Wasp Release  
  - **Step 1:** Pest larvae (e.g., caterpillars, \( N = 10^5 \)).  
  - **Step 2:** Insects → \( p(i) = 0.5 \).  
  - **Step 3:** Prolonged parasitism → \( s(i) = 3 \).  
  - **Step 4:** \( p(i) > 0.3 \) → Brake not applied.  
  - **Step 5:** \( L_{\text{total}} = 0.5 \times 10^5 \times 3 = 150,000 \)  
  - **Step 6:** Not triggered.  
  - **Step 7:** \( L_{\text{total}} > T_2 \) → **Reject unless extraordinary benefits**.  
    **But:** If host larvae are **gastropods** (e.g., snails):  
    - **Step 2:** Gastropods → \( p(i) = 0.3 \) (low).  
    - **Step 4:** Harm is direct/intentional, but **avoidable?**  
      If no alternative pest control → **Avoidable = No** → Set \( L = 0 \).  
    - **Step 5:** \( L_{\text{total}} = 0 \) → **No welfare concern** → **Supports funding**.  
    *Node producing result:* **Step 4 (Discontinuity Brake)**.  

  ---

  ### Limitations of the Procedure  
  1. **Cannot resolve foundational disputes:**  
     - Evidential floor (\( p(i) \leq 0.3 \)) and phylogenetic boundary are **value-laden choices** set by committee consensus.  
     - The procedure **relocates disagreements** into parameter definitions (e.g., "integrated nervous system," "avoidable harm").  

  2. **Judgment dependencies:**  
     - Test criteria for \( p(i) \) require committee training to avoid inconsistent scoring.  
     - "Extraordinary benefits" and "avoidable harm" require designated reviewer input.  

  3. **Scope gaps:**  
     - Does not weigh **positive welfare** (e.g., habitat restoration).  
     - Cannot address **indirect effects** (e.g., ecosystem cascades) without additional tools.  

  4. **Threshold sensitivity:**  
     - \( T_1 \) and \( T_2 \) must be calibrated to regional priorities; may need revision.  

  **Final Output:** A standardized form with the above steps, lookup table, and signature lines for designated reviewers.
