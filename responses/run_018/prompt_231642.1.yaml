prompt: |-
  I'm a PhD student working at the boundary between philosophy and formal social choice, and I've been asked to run a two-hour graduate tutorial on Harsanyi's aggregation theorem for a mixed group of political theory and economics students. Most of them have taken one prior course in decision theory and can manipulate expected utility representations, but they have not studied social choice. I know the theorem myself, but I'm less confident about how to teach it well, so I'd like you to plan the teaching rather than give me the explanation. Please lay out the order in which the pieces must be introduced and what depends on what (for example, why the von Neumann–Morgenstern representation of preferences over lotteries has to be made explicit before the Pareto condition can even be stated), the one concrete example or case that should carry the whole tutorial and what features that example must have and must lack, the misconceptions I should expect, and the exact point in the sequence where each should be defused. I suspect they will treat the individual utility functions as interpersonal measures of happiness, and they will likely overread the theorem as proving utilitarianism with equal weights by itself; there may be subtler confusions I have not anticipated, and I want a map of where each arises.

  In particular, the plan should make clear how to head off the idea that the theorem delivers interpersonal comparability, and how to flag that even with the Pareto axiom in place the theorem leaves the weights on individual utilities underdetermined unless some further impartiality or anonymity condition is added. I also want one final check for understanding that would show whether a student has really absorbed the conditional character of the result rather than merely repeating its statement. Please also tell me what I should openly refuse to cover at this level and say so. Do not give me a reading list or suggestions for sources. Please keep the whole plan to at most 900 words.
reasoning: |-
  Okay, the user is a PhD student preparing a tutorial on Harsanyi's aggregation theorem for a mixed group of political theory and economics students. They need a structured teaching plan that addresses specific challenges like misconceptions about interpersonal comparability and overinterpretation of the theorem as proving utilitarianism. 

  First, I need to unpack the core pedagogical challenges here. The students come with decision theory background but no social choice exposure, which means I must scaffold the transition from individual to social preferences carefully. The biggest traps are:
  - Mistaking vNM utilities for cardinal interpersonal measures
  - Thinking the theorem justifies equal-weight utilitarianism outright
  - Missing how the weights remain arbitrary without additional axioms

  The tutorial must actively prevent these by design. The Pareto condition can't even be formulated without first establishing vNM representations - that's why Step 2 is non-negotiable. The concrete example (Step 3) needs to be minimalist (two agents, two states) but must include lotteries to force recognition of vNM scaling freedom. 

  Ah, and the impartiality point is crucial - the weights discussion in Step 4 must come after proving the theorem to show the underdetermination. The final comprehension check (Step 6) should force students to articulate how changing vNM scales would alter the SWF, exposing the conditional nature. 

  I'm deliberately avoiding:
  - Any discussion of empirical utility measurement
  - Alternative social welfare functions
  - Philosophical debates about utilitarianism
  ...because these would derail the technical focus. The "refuse to cover" list keeps the tutorial safely within the theorem's four walls.

  The pacing is tight: 90 minutes for content + 30 minutes buffer. The example must carry the entire conceptual load - if they grasp how Alice and Bob's different vNM scales lead to different β weights while satisfying all axioms, they've won. The misconceptions map shows exactly when to drop each caution: interpersonal comparability during vNM review, utilitarianism overreach during weight discussion.

  Final insight: That "why can't we just rescale?" question in Step 6 is the litmus test. If they see it's about normalization choices rather than interpersonal measurement, the tutorial succeeded.
answer: |-
  Here’s a step-by-step tutorial plan targeting key conceptual hurdles. Total time: 110 min content + 10 min buffer.

  **Core Example:** *Vaccine Distribution*  
  Two flu strains (A/B), two at-risk groups (Elderly/Young). Social planner allocates vaccines via lotteries.  
  *Must have:* Uncertainty (lotteries over strain prevalence), conflicting preferences (Elderly prefer A-vaccine, Young prefer B).  
  *Must lack:* Obvious interpersonal utility comparisons (e.g., avoid "lifespan" metrics).

  ---

  ### 1. **Setup: Individual Preferences under Uncertainty (20 min)**
     - **Review vNM Theorem:** Preferences over lotteries → EU representation unique up to affine transform.  
       *Emphasize:* "Utility is a numerical index for choice under risk, not happiness units."  
     - **Concrete Step:** Have students derive EU for "Elderly" (prefers A-vaccine: U(A)=1, U(B)=0) and "Young" (U(A)=0, U(B)=1) facing 50/50 strain lottery.  
       *Check:* "If Elderly’s utility was rescaled to U(A)=10, U(B)=5, would choices change?"

  ### 2. **Social Preferences & Pareto Axiom (15 min)**
     - **Define social lotteries:** Profiles of individual lotteries (e.g., 90% A-vaccine for Elderly, 20% for Young).  
     - **State Pareto (Independence) Axiom:** If all individuals indifferent between two social lotteries, society is indifferent; if one strictly prefers L over L' and others indifferent, society prefers L.  
     - *Why vNM first?* Pareto requires comparing *individual indifference*, which presupposes vNM representations.  
     - **Misconception Defusal:** "Pareto only requires respecting *ordinal* individual indifference under risk — no interpersonal comparisons yet."

  ### 3. **Harsanyi’s Theorem Statement & Proof Sketch (25 min)**  
     - **Theorem:** If individuals and society have vNM preferences satisfying Pareto, then social welfare is a weighted sum of individual utilities: W = Σ βᵢ uᵢ.  
     - **Proof Intuition (using example):**  
       - Fix a "status quo" lottery (e.g., no vaccines: uᴱ=0, uʏ=0) and an "ideal" (full protection: uᴱ=1, uʏ=1).  
       - Pareto ⇒ Society’s preferences over (uᴱ, uʏ) tradeoffs are linear (geometric argument on the utility possibility frontier).  
     - *Concrete step:* Plot Elderly vs. Young utilities. Show society’s indifference curves must be straight lines. Derive W = βᴱuᴱ + βʏuʏ.

  ### 4. **Critical Discussion: Weights & Comparability (30 min)**  
     - **Weight Indeterminacy:**  
       - Rescale Elderly’s utility: ûᴱ = 2uᴱ + 3. Show W = βᴱûᴱ + βʏuʏ = (βᴱ/2)uᴱ + βʏuʏ + constant. Weights change meaning!  
       - *Key point:* βᵢ depend on arbitrary scaling of uᵢ. **No unique "equal weights"!**  
     - **Impartiality Fix:** Add anonymity: if individuals swap vNM functions, W unchanged. ⇒ Forces βᵢ = βⱼ.  
     - **Misconception Defusal:**  
       - "The theorem does *not* assume interpersonal comparability. Scaling freedom shows utilities are cardinally measurable only *intrapersonally*."  
       - "Utilitarianism (equal βᵢ) requires an *additional* ethical axiom (e.g., anonymity), not derived here."  
     - *Expected confusion:* "But we summed utilities — doesn’t that assume comparability?" → Clarify: sum *formally exists* but weights absorb scale differences.

  ### 5. **Broader Significance & Limits (10 min)**  
     - **Conditional Result:** *If* you accept vNM rationality + Pareto, *then* social welfare is linear. Reject premises? Theorem doesn’t apply.  
     - **What the theorem doesn’t do:**  
       - Justify utilitarianism alone (needs symmetry).  
       - Solve interpersonal comparison (scales remain arbitrary).  
       - Endorse "happiness aggregation" (uᵢ encode risk attitudes, not hedonic states).

  ### 6. **Final Check for Understanding (10 min)**  
     - **Question:** "Suppose we add a third group (Healthcare Workers) with vNM utility uʜ. Society’s welfare is now W = βᴱuᴱ + βʏuʏ + βʜuʜ. The government sets βᴱ=βʏ=βʜ=1. A critic says: ‘This assumes healthcare workers’ utils are comparable to the elderly’s!’ Is the critic correct? Why?"  
       *Correct answer:* No. Weights are arbitrary without further normalization. βᵢ=1 is a choice, not an implication. Comparability isn’t assumed; the weights adjust for scale.

  ---

  **What to Refuse to Cover (State Explicitly):**  
  - Empirical utility measurement (revealed preference vs. surveys).  
  - Alternative social welfare functions (e.g., Rawlsian, Nash).  
  - Philosophical defenses/criticisms of utilitarianism (focus on theorem’s logic only).  

  **Misconception Map:**  
  - **During vNM review:** "Utilities measure happiness" → Correct to "index of choice under risk."  
  - **After theorem statement:** "This proves utilitarianism" → Flag weight indeterminacy.  
  - **During weight discussion:** "βᵢ=1 is neutral" → Emphasize scaling freedom.  
  - **Throughout:** "Pareto implies comparability" → Reiterate Pareto uses only individual indifferences.  

  This sequence forces confrontation with scaling freedom *after* seeing the "sum" form, making the underdetermination visceral. The example avoids loaded terms ("utility") and uses policy-neutral stakes to isolate logic.
