answer: |-
  ### Perpetual Trust Betting Simulation: Rationality in the Long Run

  **Core Concept**:  
  Students experience the tension between arithmetic (short-term expected value) and geometric (long-term growth) reasoning by managing a multi-generational trust. The simulation lures them into overbetting during a winning streak, then wipes out overexposed trusts in a hidden "catastrophe" round. The fiduciary duty to future beneficiaries makes Kelly-style fractional betting feel morally necessary.

  ---

  ### **Setup & Rules**
  **Participants**:  
  - 12 students → **6 trusts** (each with 2 roles):  
    - **Trustee**: Decides what *fraction* of the trust’s capital to bet each round.  
    - **Observer-Auditor**: Silently records the trustee’s reasoning, emotional reactions, and peer pressure. Cannot intervene.  

  **Trust Mechanics**:  
  - Each trust starts with **100 points** (representing capital for future beneficiaries).  
  - **Betting**: Each round, the trustee bets fraction `f` (0 ≤ `f` ≤ 1) of their *current capital* on a biased coin.  
  - **Outcomes**:  
    - **Win** (60% probability): Capital becomes `current × (1 + f)`  
    - **Loss** (40% probability): Capital becomes `current × (1 - f)`  
  - **Ruin**: If capital **≤1 point** at any time, the trust is "bankrupt" and eliminated.  
  - **Fiduciary Duty**: Surviving the catastrophe round (round 8) is the goal. All surviving trusts share a prize (e.g., specialty coffee for the group).  

  **Biased Coin**:  
  - Use a **deck of cards** for deterministic control:  
    - **Heads (Win)**: Red cards (♥/♦) → 60% of deck  
    - **Tails (Loss)**: Black cards (♠/♣) → 40% of deck  
  - **Pre-set sequence** (shuffled visibly but stacked):  
    - Rounds 1–4: Win, Win, Win, Loss  
    - Rounds 5–7: Win, Win, Win (building a streak)  
    - Round 8: **Catastrophe Loss** (hidden)  

  **Key Incentive**:  
  - **Arithmetic trap**: Winning streaks make high `f` feel safe (e.g., "We’re on a roll—bet 80%!").  
  - **Geometric reality**: A single loss at high `f` causes catastrophic drawdown.  

  ---

  ### **Timeline (90 Minutes Total)**
  | Phase          | Time  | Activity |  
  |----------------|-------|----------|  
  | **Intro**      | 5 min | Explain roles, rules, and fiduciary duty. Emphasize: *"Your goal is to ensure this trust survives for centuries."* No math theory. |  
  | **Rounds 1–4** | 20 min | - **Round 1–3**: Quick wins (trusts grow; cautious bets).<br>- **Round 4**: First loss (minor panic; some near-ruin).<br>*(Trustees decide `f` in 2 min/round; coin revealed; auditors record.)* |  
  | **Rounds 5–7** | 15 min | - **Streak intensifies**: 3 more wins. Social pressure peaks ("Why are you only betting 20%? Go big!").<br>- Auditors note overconfidence and herd behavior. |  
  | **Round 8**    | 5 min  | **Catastrophe**: All lose. Ruined trusts eliminated. Silence as losses calculated. |  
  | **Survivor Check** | 5 min | Identify surviving trusts (capital >1). Award shared prize. |  
  | **Debrief**    | 40 min | Guided discussion (below). |  

  ---

  ### **Debrief Structure**
  1. **Observer-Auditors Report** (10 min):  
     - Share anonymous quotes showing reasoning at key moments:  
       - *Round 3*: "We’ve won three times—time to bet 70%!" (Arithmetic: chasing expected value).  
       - *Round 7*: "The streak can’t end now—I’ll go all in!" (Gambler’s fallacy).  
       - *Round 4*: "I almost went bankrupt—I’ll bet less" (Geometric intuition emerging).  

  2. **Tension Mapping** (15 min):  
     - **Arithmetic Mean**: "Why did you increase bets during streaks?"  
       - *Math*: Expected value per bet = `p(1+f) + (1-p)(1-f)`. Maximized at `f=1` (bet everything).  
       - *Flaw*: Ignores compounding risk. A 60% win chance still guarantees ruin at `f>0.4` over time.  
     - **Geometric Mean**: "What did survivors do differently?"  
       - *Math*: Growth rate = `(1+f)^p(1-f)^{1-p}`. Maximized at Kelly fraction `f = p - q = 0.2`.  
       - *Fiduciary link*: Betting `f=0.2` minimizes ruin risk for infinite generations.  

  3. **What Went Wrong** (10 min):  
     - **Predictable errors**:  
       - Peer pressure to overbet during streaks (Round 7).  
       - Round 4 loss ignored due to recency bias.  
       - Confusing *expected wealth* (arithmetic) with *median wealth* (geometric).  
     - **Limitation of the activity**:  
       - *Finite rounds* hide Kelly’s reliance on an **infinite horizon**. Verbally emphasize: "Perpetual trusts require *indefinite* survival—only geometric reasoning guarantees this."  

  4. **Takeaway** (5 min):  
     - **Arithmetic** optimizes for one generation; **geometric** for all generations.  
     - Fiduciary duty transforms fractional betting from "cowardly" to "responsible."  

  ---

  ### **Materials**  
  - **Cards**: 1 deck (pre-stacked sequence: 3♥, 1♠, 3♦, 1♣).  
  - **Sheets**:  
    - *Trustee*: Betting log (fraction `f`, reasoning).  
    - *Auditor*: Observation log (quotes, peer pressure notes).  
  - **Display**: Whiteboard showing round outcomes and surviving trusts.  
  - **Prize**: Small shared reward (e.g., artisanal chocolate).  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  - **Peer pressure**: Trustees will mock low-betting peers during streaks. *Use this*: Highlight how social dynamics amplify arithmetic instincts.  
  - **Early ruin in Round 4**: A few trusts may nearly collapse. *Use this*: Contrast their recovery (lowering `f`) with later overbettors.  
  - **Survivor bias**: High-betting trusts may "win" until the catastrophe. *Preempt*: Stress that survival (not peak wealth) is the fiduciary goal.  

  **Summary**: Trustees repeatedly bet fractions of their perpetual trust’s capital on a biased coin during a rigged streak, exposing how arithmetic intuitions invite ruin while geometric discipline preserves intergenerational wealth.
