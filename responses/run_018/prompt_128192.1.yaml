answer: |-
  ### Exam Prompt  
  **Time:** 90 minutes  
  **Word Limit:** 1000–1200 words  

  **Question:**  
  Thomas Hobbes defends geometry as the paradigm of scientific knowledge, arguing it proceeds synthetically through mental constructions of motion and causation (*De Corpore*). Yet he simultaneously insists geometric objects (e.g., points, lines) are mental "fictions" or "phantasms," not real bodies (*Leviathan*, Ch. 5). Analyze this tension: how can geometry be both a synthetic science grounded in causal reasoning and a system of invented fictions? Then, confront a challenge from Hobbes’s own nominalist premises: if geometric truth is merely the consistent deduction from arbitrary definitions, could alternative systems (e.g., non-Euclidean geometries) be equally valid? Would Hobbes, on his terms, be forced to reject Riemann-style geometries as false, or might his view of space as a mental construct accommodate them? Ground your analysis in Hobbes’s core principles, avoiding mere exegesis of primary texts. Prioritize conceptual rigor over historical context.  

  ---

  ### Model Answer (≈700 words)  
  Hobbes’s philosophy of geometry hinges on a tension between its synthetic foundation and its fictional ontology. Geometry is synthetic because it requires mental operations that simulate physical causation: to reason about a circle, we mentally construct it by rotating a line segment, thereby tracing causal motion (*De Corpore*). This makes geometry the "mother of sciences" for Hobbes—it mirrors the real causal structure of bodies in motion. Yet geometric objects are fictions: a point is not a real body but a mental abstraction from corporeal experience, and space itself is a "phantasm" left by a departed body (*Leviathan*, Ch. 5). This generates a paradox: if geometry depends on mental motions that emulate real causation, how can its objects be unreal?  

  The tension resolves through Hobbes’s nominalism and causal empiricism. Definitions (e.g., "a line is the path of a moved point") are linguistic conventions invented by humans, but they are constrained by the mind’s capacity to simulate possible bodily motions. Geometry’s truth arises not from matching Platonic forms but from the consistency of these mental constructions with the causal laws governing real bodies. For instance, proving that a triangle’s angles sum to 180° requires mentally rotating sides—a synthetic act mimicking physical rotation. Thus, geometry’s fictions are *causally grounded*: they are inventions, but inventions rooted in the mind’s experience of corporeal causation.  

  This invites a challenge: if geometric truth flows from invented definitions alone, could we define a non-Euclidean system (e.g., Riemannian geometry, where parallel lines converge) with equal validity? Hobbes’s nominalism about space—as a mental construct, not an independent entity—might seem to permit alternatives. Yet Hobbes would reject such systems. His causal constraints are decisive: geometric constructions must model *possible* motions of real bodies. Euclidean postulates (e.g., "parallel lines never meet") derive from mentally simulating straight-line motion without angular deviation—a causal possibility in Hobbes’s materialist framework. Non-Euclidean axioms, like curved space, would require mental motions that violate his account of inertia as uniform rectilinear motion (*De Corpore*). For Hobbes, Riemannian definitions are not just arbitrary; they are *causally incoherent* because they demand motions impossible for real bodies (e.g., intrinsic curvature without external force).  

  Does Hobbes’s nominalism open the door to alternatives? Superficially, yes: if space is a fiction, why not imagine varied spatial fictions? But Hobbes’s causal empiricism slams this door shut. The mind’s fictions are not unconstrained fantasies; they are abstractions from sensory experience of moving bodies. To invent non-Euclidean axioms is to defy the causal structure embedded in our mental operations. For example, a "curved straight line" is a contradiction for Hobbes: "straight" is defined by uniform directional motion, which mentally (and causally) precludes curvature. Thus, while nominalism makes geometry a human artifact, its content is fixed by the mind’s causal mirroring of the corporeal world.  

  In sum, Hobbes navigates the tension by tethering geometric fictions to causal synthesis: inventions are true only if they track possible bodily motions. This framework compels him to reject non-Euclidean geometries as false, not because they are inconsistent *within* their axioms, but because their axioms violate the causal logic of mental construction. His nominalism is thus a cage, not a gateway—it binds geometry to the Euclidean model as the sole system reflecting real causation.  

  ---

  ### Marking Scheme (5 × 4 marks = 20 total)  
  **Must-hit moves with common mistakes:**  
  1. **Articulate the tension**: Explicitly contrast Hobbes’s view of geometry as synthetic/causal with his claim that geometric objects are fictions.  
     *Common mistake:* Merely listing the two positions without showing their conflict (e.g., "Hobbes says geometry is synthetic and fictional" without explaining the paradox).  
  2. **Resolve the tension**: Explain how Hobbes reconciles synthetic reasoning with fictional objects using his theory of mental construction and causal empiricism.  
     *Common mistake:* Resolving the tension by ignoring one side (e.g., focusing only on fictions without addressing causal grounding).  
  3. **Pose the non-Euclidean challenge**: Frame the objection that nominalism could validate alternative geometries if truth is definitional consistency.  
     *Common mistake:* Misrepresenting the challenge as purely about "relativity" or ignoring nominalism’s role.  
  4. **Argue for Hobbes’s rejection of alternatives**: Show that Hobbes would dismiss non-Euclidean systems due to causal constraints on mental motion.  
     *Common mistake:* Claiming Hobbes accepts alternatives because of nominalism, overlooking his causal requirements.  
  5. **Evaluate nominalism’s role**: Assess whether Hobbes’s view of space as a mental construct permits or blocks non-Euclidean geometries.  
     *Common mistake:* Concluding nominalism inherently allows alternatives without engaging causal limits.  

  \answer{20}
