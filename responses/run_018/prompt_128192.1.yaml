reasoning: |-
  We are constructing an exam prompt and model answer on Hobbes's philosophy of geometry, focusing on the tension between geometry as synthetic (involving mental motion and causation) and geometric objects as mental fictions, and then addressing the challenge of non-Euclidean geometries.

  Exam Prompt (90 minutes, 1000-1200 words):

  **Prompt:**
  Thomas Hobbes presents geometry as the one true science because it proceeds from synthetic reasoning grounded in mental constructions of motion and causation. Yet he also insists that geometric objects are “fictions” of the mind, not real bodies. Analyze the tension between these two positions. Then, consider this challenge: if geometric truth is merely the consistent unfolding of definitions we invent, what prevents the invention of an alternative (e.g., non-Euclidean) system with equal claim to truth? Would Hobbes, on his own terms, have to reject such alternatives (like Riemannian geometry) as false, or does his nominalism about space actually accommodate them? In your response, engage with key Hobbesian texts (such as *De Corpore* and *Leviathan* Ch. 5) but avoid mere recitation; focus on conceptual analysis.

  ---

  Model Answer (approx. 700 words):

  **Model Answer:**

  Hobbes’s philosophy of geometry is caught in a profound tension. On the one hand, he lauds geometry as the paradigm of scientific knowledge because it is synthetic: it begins with definitions and then constructs truths through mental operations that mimic physical causation and motion. For Hobbes, the mind’s ability to trace lines, rotate figures, and construct angles is a form of “reasoning” that replicates the causal processes of the material world. Yet, on the other hand, he insists that geometric objects—points, lines, circles—are not real bodies but mental fictions. How can geometry be both a science of the real (because it is synthetic and causal) and a construction of the mind (because it deals in fictions)? This tension exposes a fault line in Hobbes’s nominalist metaphysics and his theory of knowledge.

  The resolution lies in Hobbes’s account of language and definition. Geometric objects are fictions because they are abstracted from real bodies by the mind: a point is the mental residue of a body’s location without extension; a line is the trace of a moving point. But these fictions are not arbitrary. They are generated by the mind’s capacity to simulate the motions and causations that govern real bodies. Thus, geometric reasoning is synthetic because it enacts mental motions that parallel the causal structure of the physical world. The truth of geometry, for Hobbes, is not about correspondence with Platonic forms but about the consistency of these mental constructions with the causal laws of motion that define body. In short, geometry is true because it accurately models the behavior of real bodies through mental operations.

  This leads to the challenge of non-Euclidean alternatives. If geometric truth is merely the consistent unfolding of definitions, what stops us from defining, say, a space where parallel lines meet? On Hobbes’s terms, such a system might seem equally valid as long as it is internally consistent. But Hobbes would likely reject non-Euclidean geometries as false. Why? Because for Hobbes, the definitions of geometry are not arbitrary inventions; they are constrained by the causal structure of reality. The mind’s constructions must mirror the possible motions of real bodies. Euclidean geometry, for Hobbes, is not one system among many; it is the necessary structure of space because it is derived from the causal properties of body. To define a triangle in non-Euclidean space would be to construct a fiction that does not align with the real causal powers of bodies in motion. Thus, non-Euclidean systems would be dismissed as inconsistent with the foundational definitions that reflect the actual nature of space and body.

  However, Hobbes’s nominalism about space might seem to open the door to alternatives. If space is merely the imaginary “phantasm” left by a body, and geometric objects are fictions, then why couldn’t we imagine a different kind of space? The answer lies in Hobbes’s causal constraints. The mind’s fictions are not free creations; they are bound by the causal laws that govern real motion. We can imagine a round square, but that doesn’t make it geometrically possible because the mental construction would fail: we cannot trace a motion that generates both roundness and squareness. Similarly, non-Euclidean constructions would require mental motions that are causally impossible in Hobbes’s materialist framework. For example, the parallel postulate isn’t an arbitrary definition; it is a truth derived from the mental construction of parallel lines as paths of bodies moving without angular deviation—a motion that, for Hobbes, is causally grounded.

  In conclusion, Hobbes’s tension between geometry as synthetic and as fictional is resolved by anchoring mental constructions in the causal structure of the material world. This causal grounding also explains his rejection of non-Euclidean geometries: they are inconsistent with the definitions that model real bodily motions. Hobbes’s nominalism does not license arbitrary geometric systems because his fictions are constrained by the causal laws of nature. Thus, while geometry is a mental construction, it is uniquely true because it mirrors the only possible structure of space and body.

  ---

  Marking Scheme (5 moves, 4 marks each, total 20):

  1. **Articulate the tension**: Clearly state the conflict between geometry as synthetic (relying on mental motion and causation) and geometric objects as fictions.  
     *Common mistake*: Students merely describe the two claims without showing why they are in tension.

  2. **Resolve the tension using Hobbes’s theory of definitions and mental construction**: Explain how Hobbes reconciles the synthetic nature of geometry with the fictional status of objects by appealing to the mind's simulation of causal processes.  
     *Common mistake*: Students resolve the tension by ignoring one side (e.g., by treating geometry as purely fictional without addressing its synthetic/causal basis).

  3. **Address the non-Euclidean challenge**: Pose the hypothetical objection that consistent alternative geometries might be possible under Hobbes’s nominalism, and explain why Hobbes would likely reject them.  
     *Common mistake*: Students claim Hobbes would accept alternatives because of nominalism, without considering his causal constraints.

  4. **Engage with causal constraints**: Show how Hobbes’s materialism and causal theory of knowledge limit geometric constructions to Euclidean possibilities.  
     *Common mistake*: Students fail to connect the rejection of non-Euclidean systems to Hobbes’s causal account of mental motion.

  5. **Evaluate the role of nominalism**: Discuss whether Hobbes’s view of space as a mental fiction ultimately opens the door to alternative geometries or closes it via causal grounding.  
     *Common mistake*: Students overemphasize nominalism as allowing alternatives without balancing it with Hobbes’s causal realism.

