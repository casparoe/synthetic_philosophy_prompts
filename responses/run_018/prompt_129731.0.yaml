  The catch: they need to work with this distinction I just sketched between "redundant causation in linear harm chains" and "structural participation in fedback loops." Len takes the inefficacy line seriously and should argue that your personal emissions are just redundant droplets; Priya should push back that in systems like agricultural subsidy structures or aviation demand forecasting, individual choices shift loop parameters even if they don't change outcomes in isolation. Both need to actually engage—Len shouldn't just dismiss the loop idea, he should ask whether Priya is smuggling collective-level causation past methodological individualism, and Priya should answer that directly rather than talking past him.

  Keep it like a coffee-shop argument after a seminar, not formal papers. Neither should be a strawman: Len should admit collective action is different, Priya should concede direct causal impotence. One or two typos is fine since I'm writing this fast for my packet.
