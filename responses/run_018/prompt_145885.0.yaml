  **BUREAU OF DIACHRONIC CONSENT (BDC)**  
  **Ensuring Your Past Remains Your Future's Problem Since 1998**

  **FREQUENTLY ASKED QUESTIONS**  
  **(Last Updated: Never. Compliance is Retroactive.)**

  **Q1: What is the Bureau of Diachronic Consent (BDC)?**  
  A: The BDC is the federal authority mandated by the Diachronic Consistency Act (DCA) of 1998 to enforce Temporal Directives (TDs). TDs are legally binding directives created by an individual ("Prior Self," PS) to govern the choices, assets, and lifestyle of their future self ("Subsequent Self," SS). Your 25-year-old self’s wishes are your 45-year-old self’s legal obligations. Think of it as a prenup, but with yourself.

  **Q2: How binding is my Prior Self’s directive?**  
  A: Fully and irrevocably binding, absent rare exemptions (see Sections 7.3 and 12.8). Your SS cannot unilaterally void a TD simply due to "changing values," "maturity," or "that tattoo seeming like a good idea at Burning Man." The PS made a rational, documented choice. The SS must comply. Non-compliance triggers Standard Enforcement Protocol 4-Alpha ("Re-Alignment").

  **Q3: What if my Subsequent Self feels unrecognizable from my Prior Self?**  
  A: Feelings are not a recognized legal category under the DCA. The Bureau operates on the principle of "Documented Identity Continuity." Barring formal intervention (see Q6 & Q7), your SS *is* your PS, legally speaking. Discomfort is not grounds for appeal. Submit Form BDC-7A ("Affidavit of Existential Dissonance") for processing (fee applies).

  **Q4: How is the competence of my Prior Self determined if challenged?**  
  A: Competence disputes are adjudicated by a **Family Precedent Tribunal (FPT)**. The FPT utilizes common-law reasoning based on familial testimony and documented historical behavior patterns.  
  *   **Example:** If your PS mandated "never sell the vintage Camaro," but your SS needs college funds, the FPT will hear testimony from relatives (e.g., "He *always* loved that car more than his dog, Your Honor," or "She spent every weekend polishing it at 24, clearly a lifelong commitment"). The Tribunal establishes if the PS's directive aligns with their established "character precedent" at the time of signing.

  **Q5: What if my values have changed SO drastically that following the TD feels impossible?**  
  A: You may petition the BDC for a declaration of **Psychological Continuancy Bankruptcy (PCB)**. This is a grave proceeding. You must prove, via BDC-certified psychometric assays and lifestyle audits, that your core value structure is *irreconcilably estranged* from your PS's documented value matrix.  
  *   **Successful PCB:** Your SS enters receivership. A state-appointed **Diachronic Trustee (DT)** assumes control. The DT, guided *strictly* by your PS's documented preferences, habits, and social media posts, makes decisions on your behalf (finances, medical choices, hobbies, even dietary preferences based on PS's Instagram #foodporn). You become a legal passenger in your own life until the DT deems you sufficiently "re-aligned" or the directive expires.

  **Q6: Can I update my Temporal Directive?**  
  A: Yes. File Form BDC-12E ("Subsequent Self Amendment Request - Provisional"). However, the amendment is only valid if the FPT determines your *current* SS's proposed changes are consistent with the *original* PS's *probable* future wishes, based on precedent. Essentially, you must prove your PS would *now* agree with your SS. Contradiction is grounds for dismissal. Filing Fee: $475.

  **Q7: What if my Prior Self was clearly an idiot?**  
  A: "Idiocy" is not a recognized medical or legal category under BDC purview. The FPT assesses *procedural competence* at the time of signing (e.g., Was PS sober? Over 18? Not under literal duress from a rogue time traveler?). Poor judgment (e.g., "Invest life savings in Beanie Babies," "Marry Chad/Chastity after 3 dates") is not an exemption. The PS had agency. The SS bears the consequence.

  **Q8: Are there costs associated with BDC services?**  
  A: Yes. All filings, hearings, audits, and enforcement actions incur fees. These are automatically levied against your assets, prioritized above mortgage or childcare payments (per DCA Sec. 22: "Temporal Compliance First"). Fees fund essential operations, including the maintenance of the National Prior Self Registry and mandatory irony detectors in all field offices.

  **Q9: What happens if I ignore a Temporal Directive or BDC ruling?**  
  A: Non-compliance initiates Protocol 4-Alpha. Potential consequences include:  
  *   Asset seizure (to enforce PS's spending/saving mandates).  
  *   Mandatory lifestyle reversion (e.g., forced relocation back to PS's chosen city, reinstatement of PS's hairstyle via court-appointed barber).  
  *   "Value Reinforcement" modules (BDC-approved media consumption & therapy focused on PS's documented worldview).  
  *   In extreme cases of persistent SS recalcitrance: Placement under a permanent Diachronic Trustee.  
  Fines also apply.

  **Q10: Where can I file my Temporal Directive or related paperwork?**  
  A: Submit all forms in triplicate at your designated Regional BDC Compliance Hub. Appointments are mandatory and typically available 14-18 months in advance. Walk-ins will be processed retroactively according to the earliest available PS timestamp we can reasonably simulate. Remember: Your Past Self is counting on you. Literally. It's the law.

  **DISCLAIMER:** The Bureau of Diachronic Consent is not responsible for feelings of alienation, existential dread, buyer's remorse, or the lingering shame of that dubstep phase you documented extensively. You signed the form. Manage your diachronic expectations accordingly. Visit www.bdc.gov/dca (Not Responsible for Broken Links to Your Past).
