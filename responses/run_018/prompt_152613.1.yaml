answer: |-
  ## Watershed Demos Debate

  **Sam:** Okay, so the Council’s rationing hits *everyone* in the basin. Farmer in non-signatory Vermont? Gets 30% less water. Autonomous allocator bot managing a Toronto high-rise? Forced to slash output. They’re *both* massively affected. Demos has to include them. If the decision fundamentally alters your existence or function, you’re in. Simple.

  **Alex:** "Affected" is a black hole, Sam. *Everything* ripples. Does a fish downstream count? The allocator bot? It executes directives but has zero legal standing, can’t sue, can’t vote, can’t be *compelled* meaningfully beyond reprogramming. It’s a tool. Coercive authority requires subjects who can *be* coerced *and* hold reciprocal rights to contest the coercion. Vermont farmer? Maybe, *if* the Council can actually enforce penalties there. Otherwise, it's just... strong suggestion.

  **Sam:** So the bot whose core function is rewritten overnight isn't coerced? The Vermont farmer whose livelihood evaporates? That’s *real* subjection! You’re privileging legal fiction over lived reality. The bot’s "outputs" *are* its interests. Ignoring that is arbitrary.

  **Alex:** Interests aren’t enough! Democracy hinges on *agency* within the system. The bot has no agency. It executes code. The Vermont farmer, if the Council lacks enforcement teeth *in Vermont*, also effectively lacks recourse *to the Council*. He might protest his *own* government, but that’s a different demos. Our Council’s authority binds entities it can practically regulate and who can practically engage with its institutions. Otherwise, the demos is meaningless.

  **Sam:** Fine, enforcement is messy. But how do we *define* that scope initially? Who decides who was ‘subject enough’ when we set the Council up? Gimme a sec... what about **recursive constituency**? *Current* Council members – representing the signatory states/basins – vote on who was *sufficiently affected* by the Council’s *original* mandate to have been in the founding demos. We retrospect.

  **Alex:** (Snorts) Seriously? That’s not solving the boundary problem, that’s weaponizing it! Think it through, Sam. *Current* members get to decide *who should have elected them in the first place*? Of *course* they’ll vote to legitimize their own authority! They'll include Vermont if it’s convenient *now*, exclude it if it's not. They'll *never* include the bots because bots can't vote *for them*. It’s pure self-justification. The mechanism *itself* presupposes the legitimacy of the *current* demos to define the *past* demos. Circular logic trap.

  **Sam:** But... the alternative is just freezing the initial signatories forever, ignoring massive affected populations! Isn't some self-correction better than none?

  **Alex:** Self-correction? It’s self-*entrenchment* masquerading as inclusion. You’re asking the fox to design the henhouse security *after* it’s already inside. The recursive vote *depends* on the existing boundary being legitimate to legitimize... itself. It collapses into pure power politics. We need a principle *external* to the Council’s current makeup – like actual coercive reach and reciprocal capacity – to have any hope of objectivity. Affectedness is too fuzzy, recursion is just self-serving. Neither works cleanly here. This basin is *messy*.

  **Sam:** Messy is an understatement. So... stalemate? Farmers screwed, bots bricked, Council's legitimacy perpetually contested?

  **Alex:** Pretty much. Welcome to the boundary problem in the anthropocene. Pass the water? I’m rationing myself.
