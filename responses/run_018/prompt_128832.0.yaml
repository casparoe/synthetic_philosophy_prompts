  For Lewis, the "nearest world" without high inflation expectations would require rewriting economic behavior laws, making it backtracking or impossible. Woodward treats the structure as contingent, allowing the intervention; Lewis sees it as necessary, blocking the causal claim. Both approaches are problematic: Woodward permits physically impossible tests, Lewis renders the causation unverifiable by demanding structural consistency.

  This divergence perfectly illustrates the core tension. The macroeconomic case shows how feedback loops create fundamental ambiguity in causal attribution when interventions would dissolve the circular relationships defining the system. Neither theory fully resolves this, motivating the need for the user's own account.
answer: |-
  Consider a macroeconomic wage-price spiral where inflation ($I$) depends on expected inflation ($E$) via wage bargaining, while $E$ itself adapts to observed $I$ through adaptive expectations ($I \rightarrow E \rightarrow I$). Woodward-style interventionism licenses "$E$ causes $I$" because hypothetical manipulation of $E$ (e.g., exogenously fixing expectations via policy announcements), holding other mechanisms fixed, would change $I$—even though such an "intervention" is physically incoherent within the closed-loop system; it severs $E$'s constitutive dependence on past $I$. Conversely, Lewisian counterfactual analysis denies causation: the nearest world without high $E$ requires rewriting history to alter prior $I$, inducing backtracking, or it collapses the adaptive expectations mechanism entirely—treating the feedback law ($E = f(\text{past } I)$) as immutable. Interventionism thus accepts an unrealizable test as valid, ignoring structural integrity, while counterfactualism renders the causal claim void by demanding impossible structural consistency. Both fail: one admits phantom interventions, the other makes circular causation unanalyzable. (197 words)
