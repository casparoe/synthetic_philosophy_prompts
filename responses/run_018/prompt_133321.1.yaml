prompt: |-
  I've been sitting in on a philosophy of physics seminar where we discussed Gödel's rotating-universe solution and the metaphysical claim he drew from it — that because the metric permits closed timelike curves and lacks a global time orientation, objective temporal passage is an illusion. A study partner of mine thinks this is a category mistake: the solution describes a possible geometry, but local causal structure remains intact everywhere, so the disappearance of global time is merely a coordinate feature, not a discovery about reality. I'd like you to write a dialogue between two equally sharp interlocutors — call them A and B — in which A defends Gödel's stronger idealist reading (that global non-orientability undermines the reality of temporal flow altogether) and B resists by distinguishing coordinate rotation from intrinsic temporal passage, yet B also concedes something surprising: that in such a universe, the usual argument for the objectivity of time — that every local observer shares a consistent arrow — fails not because of the closed curves themselves, but because the global homogeneity means there is no privileged frame relative to which "now" can be anchored. The exchange should turn on a specific, somewhat niche point: whether the absence of a global rotation axis in Gödel's metric makes the idea of "the universe rotating" physically empty, or whether it instead reveals that temporal orientation is path-dependent in a way special relativity never forces on us. They should respond to each other's actual points rather than deliver parallel monologues; don't have them cite papers or texts, just reason from the structure of the solution itself. Keep the dialogue to at most 15 exchanges and under 600 words, with each reply developing in direct response to the previous speaker.
