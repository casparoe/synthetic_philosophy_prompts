prompt: |-
  I'm planning a session for a philosophy reading group of advanced undergraduates who have read Susan Wolf's essay on moral saints but think they have grasped it because they agree that being too good sounds exhausting. I want to teach the specific conceptual claim that maximal moral goodness is undesirable not because it causes burnout—an empirical mistake—but because it structurally crowds out non-moral excellences that are partly constitutive of human flourishing, making the ideal of moral sainthood self-undermining as a life-plan rather than merely difficult.

  Plan the explanatory arc: first, the dependency order—what distinction between being very good and being a moral saint, and between a life-plan and a behavioral pattern, must be in place before the structural point can even appear; second, the carrying example—use an imagined physician who spends every available hour either treating underserved patients or optimizing her epidemiological research to maximize lives saved, and who therefore abandons both the cello she once played and friendships that do not serve her moral efficiency. Explain why this case must include these specific non-moral goods and why it should not be Mother Teresa, Gandhi, or a generic workaholic; third, map the misconceptions in the order they will arise—(1) that Wolf is criticizing people for being too good, (2) that she is defending a right to leisure or selfishness, (3) that she is making an empirical claim about psychological burnout—and state exactly where in the sequence each should be defused; fourth, provide one check question at the end that reveals whether the group has understood the structural argument rather than merely sympathizing with the doctor's lost cello; finally, tell me which part of Wolf's framework—such as her comparison of different motivational models of sainthood—I should explicitly set aside at this level and say I am leaving out.
reasoning: |-
  Okay, let me approach this systematically. The user wants to design a philosophy session for advanced undergraduates who've superficially understood Susan Wolf's "Moral Saints" essay. Their current takeaway seems to be the naive "being too good is exhausting" interpretation, so the real challenge is making them grasp Wolf's structural argument about how moral maximalism crowds out non-moral excellences constitutive of human flourishing.

  First, I need to map out the foundational distinctions that must precede the structural argument. The critical ones are: (1) distinguishing maximal moral goodness (sainthood) from being highly virtuous, and (2) separating life-plans from behavioral patterns. Without these, students will conflate Wolf's critique with mere criticism of overwork. The physician example is perfect here - it must show abandonment of constitutive goods like cello (aesthetic excellence) and non-instrumental friendships, not just tiredness. 

  I notice the user specifically warns against using Mother Teresa or Gandhi. That's astute because real figures invite either hagiography or accusations of hypocrisy, plus their lives often included non-moral elements (Gandhi's fasting had political dimensions). The physician is better: she deliberately jettisons goods for moral efficiency, making the structural crowding-out visible. The cello represents irreplaceable aesthetic value, while friendships show relational goods that can't be reduced to moral utility.

  For misconception sequencing: burnout (1) will emerge immediately, so I'll defuse it when introducing the physician by stressing her endurance. The "right to selfishness" (2) may arise during the life-plan discussion - I'll counter by emphasizing flourishing's positive goods. The "criticizing good people" (3) worry might surface post-argument; I'll clarify Wolf targets the ideal, not individuals.

  The check question is crucial. Asking whether a well-rested saint still misses flourishing targets structural understanding better than psychological sympathy. Finally, I'll explicitly bracket Wolf's motivational models (Loving vs. Rational Saints) to avoid sidetracking into character debates. The core is the goods framework.

  Hmm, the user clearly knows Wolf well - they even reference the carrying example terminology. This suggests I should avoid over-explaining basics and dive straight into conceptual surgery. Their anxiety about students confusing empirical and structural critiques is spot-on; that's exactly where undergrads get stuck. The physician case's design shows deep pedagogical insight - every element serves the argument. I'll honor that by keeping the example lean and conceptually precise.
answer: |-
  Here’s a structured explanatory arc for your session, designed to force engagement with Wolf’s **structural argument** and preempt common misconceptions:

  ---

  ### **Explanatory Arc: Wolf’s Structural Critique of Moral Sainthood**
  **Goal:** Show that moral maximalism *undermines flourishing* by excluding non-moral goods constitutive of a well-lived life—not due to psychological difficulty.

  ---

  #### **I. Foundational Distinctions (Dependency Order)**  
  ***(5-10 mins)***  
  *Establish these before introducing crowding-out:*  
  1. **"Very Good" vs. "Moral Saint"**  
     - *Very Good:* High moral commitment *balanced* with other values (e.g., a doctor who volunteers weekly but hikes/plays piano).  
     - *Moral Saint:* **Maximal moral goodness** as the *sole* priority. All non-moral goods are sacrificed/instrumentalized.  
     - *Key:* Saints are defined by **structural dominance of morality**, not degree of virtue.  

  2. **Life-Plan vs. Behavioral Pattern**  
     - *Behavioral Pattern:* Discrete actions (e.g., working 80 hrs/week).  
     - *Life-Plan:* **Organizing principle for one’s existence** (e.g., "Maximize moral impact" as the *telos* guiding all decisions).  
     - *Why it matters:* Burnout critiques target behavior; Wolf targets the *architectural flaw* in a life built solely on morality.  

  > **Transition:** "If sainthood is *structurally* flawed, what makes it self-undermining?"  

  ---

  #### **II. The Physician Case Study: Crowding-Out in Action**  
  ***(10-15 mins)***  
  **The Scenario:**  
  > *A brilliant physician dedicates every waking hour to serving underserved communities and optimizing epidemiological research. She:  
  > (a) Abandons her cello practice (despite past excellence), viewing it as "self-indulgent";  
  > (b) Lets friendships fade unless they directly support her work (e.g., fellow researchers).*  

  **Why This Case Works:**  
  1. **Non-Moral Goods Must Be:**  
     - **Constitutive of flourishing** (not leisure/hedonism):  
       - *Cello:* **Aesthetic excellence** (developing skill/beauty for its own sake).  
       - *Friendships:* **Non-instrumental relationships** (valued beyond utility).  
     - *Crucially:* These are *good* independently of morality—sacrificing them *diminishes her life*, even if she never burns out.  

  2. **Avoid Real Icons/Workaholics:**  
     - *Mother Teresa/Gandhi:* Students will deflect ("But they had purpose!") or debate historical details.  
     - *Generic Workaholic:* Confuses *overwork* (empirical) with *structural exclusion* of non-moral goods.  
     - *Physician Archetype:* Neutral, relatable, and clearly abandons *specific human excellences*.  

  > **Wolf’s Point:** The physician’s life lacks *meaningful plurality*. Morality cannibalizes spaces where other values (art, love, curiosity) should thrive.  

  ---

  #### **III. Sequencing & Defusing Misconceptions**  
  ***(Address AS they arise in discussion)***  
  1. **"Wolf is criticizing good people"**  
     - *When it arises:* During physician case intro.  
     - *Defuse:* "She critiques the *ideal*, not the person. Is the physician admirable? Yes! But is her *life-plan* desirable as a template for human flourishing? No, because it amputates essential human capacities."  

  2. **"She defends selfishness/leisure"**  
     - *When it arises:* When discussing abandoned cello/friendships.  
     - *Defuse:* "Leisure ≠ flourishing. Cello represents *aesthetic engagement*—a distinct human excellence. Friendship is a *relational good*. Wolf argues these are **irreducible parts of a rich life**, not 'breaks' from morality."  

  3. **"It’s about burnout/overwork"**  
     - *When it arises:* When questioning if the physician is "sustainable."  
     - *Defuse:* "Imagine she *never* burns out—her stamina is superhuman. Is her life *still* lacking? Yes! Why? Because flourishing requires **diverse kinds of goodness** (moral, aesthetic, intellectual), not just moral 'output.'"  

  ---

  #### **IV. Check Question: Test Structural Understanding**  
  ***(Post-discussion)***  
  > *"Suppose our physician develops a time-management system allowing her to play cello 1 hour/week without reducing moral impact. Does this resolve Wolf’s critique? Why/why not?"*  

  - **Correct Answer:** No. The cello is now **instrumentalized** (a "break" to boost productivity), not valued intrinsically. The *life-plan* still subordinates non-moral goods to morality.  
  - *Why it works:* Reveals if students grasp the *structural* subordination (life-plan) vs. behavioral scarcity (hours). Sympathy for "lost cello" ≠ understanding.  

  ---

  #### **V. Explicitly Set Aside**  
  ***(State upfront)***  
  - **"We’re bracketing Wolf’s comparison of 'Loving Saints' vs. 'Rational Saints.'**  
     - *Why:* It explores *motivational* differences (joyful vs. duty-driven saints), which could distract from the core argument about *goods*. Our focus is **why any moral-maximizing life-plan fails**, regardless of the saint’s psychology."  

  ---

  ### **Why This Sequence Works**  
  1. **Builds Necessity:** Distinctions (I) prevent misreading; case study (II) concretizes abstraction; misconceptions (III) are preemptively disarmed.  
  2. **Targets Sympathy-to-Structure Gap:** The physician’s "losses" are relatable, but the check question (IV) forces interrogation of *why* they matter.  
  3. **Narrows Focus:** Setting aside motivational models (V) keeps attention on the goods-based critique.  

  **Tip:** Open by asking, "What’s wrong with being a moral saint?" Let students voice burnout/impracticality critiques—then reveal those *aren’t* Wolf’s argument. The tension primes deeper engagement.
