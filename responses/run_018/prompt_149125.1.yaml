prompt: |-
  hey im in this metaphysics seminar and weve been stuck on causation by ommission. my tutor keeps saying any decent theory just needs to cover the gardener not watering the plants, but that feels way too thin. before i read more i want the full spec: what should a theory of omission-causation actually deliver to count as adequate? list the cases it has to handle (the classic ones, but also collective omissions, omissions that prevent other omissions, omissions in fully deterministic setups where nothing is physically missing, and omissions by non-agents like institutions or algorithms), the distinctions it cant collapse (causing vs allowing vs failing-to-prevent, absence vs omission, negative causation vs correlation), results from physics or cognitive science it cant flat-out contradict (e.g. no dedicated absence-detectors?), and flag any pair of desiderata you think are probably impossible together. then tell me which single requirement does the most damage to the usual suspects — the counterfactual-dependence view, the normative account, maybe the interventionist take. table is fine if it helps. im especially wondering whether the theory needs to explain why omissions feel causally weaker, or if thats just a bias we should drop.
reasoning: |-
  Okay, the user is in a metaphysics seminar struggling with causation by omission. They need a comprehensive framework for what makes a theory of omission-causation adequate. Let me start by breaking down their query. They want the full spec: cases to handle, necessary distinctions, empirical constraints, potential conflicts, and which requirement challenges existing theories the most.

  First, the cases. They mentioned the gardener not watering plants as a basic example. But they also brought up collective omissions, like multiple neighbors failing to water. Then omissions preventing other omissions—say, a guard not locking a door allows a thief to enter. Deterministic setups where nothing is physically missing, like a deterministic machine missing an input. Non-agent omissions, such as institutions or algorithms failing to act. These scenarios test different aspects of a theory, like handling multiple causes or non-human agents.

  Next, distinctions. Causing vs. allowing vs. failing-to-prevent is crucial. If a theory conflates these, it might overattribute causation. Also, absence vs. omission: absence is mere lack, while omission implies a responsibility. Negative causation vs. correlation is another key point—ensuring the theory doesn't mistake correlation for causation.

  Empirical constraints from physics and cognitive science. Physics has conservation laws and locality; any theory mustn't violate these. Cognitive science shows humans have dedicated detectors for presences, not absences. This might explain why omissions feel weaker, but the user questions if that's a bias to drop. The theory should account for this without contradicting science.

  Conflicting desiderata. For example, avoiding promiscuity while handling non-agent omissions. If everything absent is a cause, it leads to too many causes. But excluding non-agents might miss institutional failures. Also, grounding moral responsibility without being purely normative. If causation depends on norms, it might not fit deterministic cases.

  Which requirement challenges current theories the most? Probably avoiding causal promiscuity. Counterfactual theories struggle here—if the gardener hadn't been absent, the plant wouldn't have died. But then, any absent entity could be a cause, like the Queen not watering. Interventionist views might fare better by focusing on variables we can manipulate. Normative accounts tie causation to obligations, which works for agents but not non-agents or deterministic systems.

  The user also wonders if the perceived weakness of omissions is a bias. Empirical evidence suggests it might be, but a good theory should explain this without relying on bias. Maybe by differentiating causal strength or linking it to responsibility.

  I should structure the response with tables for clarity, listing cases, distinctions, constraints. Highlight conflicts like promiscuity vs. non-agent omissions. Point out how avoiding promiscuity hits counterfactual theories hardest. Emphasize that the feeling of weakness might be cognitive, but the theory needs to handle causal strength objectively.
answer: |-
  Here’s a comprehensive specification for an adequate theory of omission-causation, structured around your requests. The core challenge is balancing **explanatory power** (handling diverse cases) with **discrimination** (avoiding overcounting causes) while respecting empirical and conceptual constraints.

  ---

  ### **I. Cases a Theory Must Handle**
  | **Case Type**               | **Example**                                                                 | **Challenge**                                                                 |
  |-----------------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **1. Basic Omission**       | Gardener fails to water plants → plants die.                                | Must distinguish omission from background conditions.                         |
  | **2. Collective Omission**  | 100 neighbors all fail to water plants → plants die. Who caused it?         | Handling overdetermination/distributed responsibility.                        |
  | **3. Preventing an Omission** | Security guard’s *failure* to disable alarm *prevents* thief’s *failure* to steal. | Omissions as preventers of other omissions; causal chains.                   |
  | **4. Deterministic Omission** | In a clockwork universe, a gear’s *absence* (never created) halts a machine. | No "gap" in physical reality; causation without counterfactual possibility.   |
  | **5. Non-Agent Omission**   | Algorithm fails to flag fraud → bankruptcy; State neglects infrastructure → disaster. | Causation without intentional agency or normative context.                   |
  | **6. Symmetric Prevention** | Doctor *not* administering drug (omission) vs. Nurse *blocking* drug (action) → patient dies. | Moral asymmetry vs. causal parity.                                            |

  ---

  ### **II. Key Distinctions a Theory Must Preserve**
  1. **Causing vs. Allowing vs. Failing-to-Prevent**  
     - *Causing*: Actively bringing about an outcome (e.g., poisoning plants).  
     - *Allowing*: Removing a barrier to an outcome (e.g., removing a fence so deer eat plants).  
     - *Failing-to-Prevent*: Not intervening in a process that would otherwise occur (e.g., not repairing the fence).  
     → *Problem*: Omissions often fall into "failing-to-prevent," but theories must not equate this with active causing.

  2. **Absence vs. Omission**  
     - *Absence*: Mere lack (e.g., no rain in the desert).  
     - *Omission*: Contextual failure to fulfill an expected/required role (e.g., gardener paid to water plants).  
     → *Requirement*: Omissions imply potential agency/normativity; absences may not.

  3. **Negative Causation vs. Correlation**  
     - Must exclude cases where absence correlates with outcome but isn’t causal (e.g., *lack of rain* correlates with *crop failure*, but soil erosion was the actual cause).

  ---

  ### **III. Empirical Constraints**
  | **Domain**          | **Constraint**                                                                 | **Implication for Theory**                                                                 |
  |---------------------|--------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Physics**         | No conserved quantity for "absences" (e.g., energy/momentum describe presences only); locality. | Cannot posit causal "flows" from non-events. Must avoid action-at-a-distance by omission. |
  | **Cognitive Science** | No dedicated neural "absence detectors"; absences inferred from violated expectations (e.g., predictive coding). | Explains why omissions *feel* causally weaker – but a theory shouldn’t rely on this as ontologically significant. |
  | **Neuroscience/Law** | Legal systems punish omissions only with *duty* (e.g., lifeguard vs. passerby). | Distinguishes normative responsibility from pure causation.                               |

  ---

  ### **IV. Likely Irreconcilable Tensions (Impossible Pairs)**  
  1. **Non-Promiscuity ✗ Non-Agent Omissions**  
     - Avoiding promiscuity (e.g., "The Queen’s failure to water plants didn’t cause death") requires normativity/agency.  
     → But non-agent cases (e.g., algorithm failures) demand causation *without* normativity.  

  2. **Determinism Compatibility ✗ Robust Counterfactuals**  
     - In deterministic worlds, no "alternative possibility" for omitted actions.  
     → Counterfactual theories (e.g., "If X had acted, Y wouldn’t have happened") collapse.  

  3. **Causal Parity (Actions/Omissions) ✗ Moral Asymmetry**  
     - Intuitively, *killing* ≠ *letting die*, but a purely causal theory might equate them.  
     → Can’t satisfy both metaphysical parity and ethical distinctions.  

  ---

  ### **V. Which Requirement Sinks Existing Theories?**  
  **Avoiding Causal Promiscuity** does the most damage:  
  - **Counterfactual Theories** (Lewis): "If the gardener had watered, plants would have lived" also true for *any* non-acting agent (e.g., the Queen, a passing child). → Promiscuity.  
  - **Normative Accounts** (e.g., Schaffer): Only omissions violating duties are causal. Fails on **non-agent cases** (algorithm has no "duty") and **deterministic omissions** (no moral responsibility without free will).  
  - **Interventionist Theories** (Woodward): Manipulating "gardener waters" variable changes outcome. But what counts as a "variable"? If all absences are variables, promiscuity returns (e.g., "variable: Queen waters plants").  

  → **Weakest Point**: All struggle with **collective omissions**. If no single neighbor’s omission caused the death (as each was insufficient), how is the group omission causal?  

  ---

  ### **VI. Should "Causal Weakness" of Omissions Be Explained or Dismissed?**  
  - **Explain it**: Cognitive science shows omissions are *inferred* from violated expectations, not perceived like physical forces. A good theory should accommodate this asymmetry without making causation subjective.  
  - **But**: In cases like **deterministic omission**, the causal role is ontologically robust (e.g., missing gear *is* causally equivalent to a broken gear).  
  - **Recommendation**: A theory should *explain the intuition* (e.g., via epistemic or normative filters) but not build it into causation’s metaphysics.  

  ---

  ### **Summary Table: Adequacy Checklist**  
  | **Requirement**              | **Counterfactual** | **Normative** | **Interventionist** |  
  |------------------------------|-------------------|--------------|--------------------|  
  | Handles **Non-Agents**       | ❌ (Promiscuity)  | ❌            | ⚠️ (Depends on variable choice) |  
  | Handles **Determinism**      | ❌                | ❌            | ⚠️ (No interventions in determinism) |  
  | Avoids **Promiscuity**       | ❌                | ✅            | ⚠️ (Variable problem) |  
  | **Collective Omissions**     | ❌                | ⚠️           | ❌                  |  
  | **Causing vs. Allowing**     | ⚠️               | ✅            | ✅                  |  
  | Compatible with **Physics**  | ✅                | ✅            | ✅                  |  

  ---

  ### **Conclusion**  
  A minimally adequate theory must:  
  1. Ground omissions in **dispositions/capacities** (e.g., what an agent/system *could have done*) to handle non-agents and determinism.  
  2. Use **contrastive causation** (omission vs. expected action) to avoid promiscuity.  
  3. Acknowledge **normativity** in *human contexts* without reducing causation to it.  
  4. Accept that **causal strength** is context-dependent (omissions *are* weaker when agency is irrelevant).  

  **Recommendation**: Start with **Dowe’s conserved quantity theory** (treating omissions as "preventions" of conserved quantities) + **Hitchcock’s contrastive counterfactuals**. This best balances physics constraints with discrimination. Reject pure normative views—they fail on institutional/algorithmic cases. The "weakness" of omissions is partly cognitive bias but also reflects reduced *explanatory salience* in non-normative contexts.
