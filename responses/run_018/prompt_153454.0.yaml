prompt: |-
  You're acting as a strategic bioethics advisor who knows both evolutionary ecology and clinical ethics well. Think carefully, start with a quick brainstorm of the audience's mental models, then build the sheet.

  Next week I'm giving a seminar talk to a joint group of conservation ecologsts and clinical bioethicists — people who generally see nature as self-regulating and genetic intervention as hubris. A couple transhumanist outliers will be there but they're not the threat. I'm defending a specific version of the hedonistic imperative: we should pursue germline editing of nociceptive and affective valence pathways to gradually abolish suffering, but constrained by what I'm calling a "hedonic floor with anti-lock-in." The idea is that no biotech intervention is permitted unless it first proves it won't generate novel suffering modalities, even if net pleasure goes up. So I'm okay with vaccinating wild animals against painful diseases, but I oppose predator-elimination or ecosystem redesign, since ecological cascade creates suffering we can't predict. I need a Q&A prep sheet for the objecions they'll actually throw, not the LessWrong-style ones.

  Order the objections by damage potential. For each: phrase it exactly as a skeptical ecologist or risk-averse ethicist would put it; sketch my two-minute reply; and mark the soft spot where I'm hand-waving. Also tell me what I should concede right at the start of the talk so I don't seem defensive. Finally, include the one question I'm hoping nobody asks — maybe about whether evolutionary stable suffering strategies make my negative-priority framework collapse into standard negative utilitarianism with extra jargon, or whether my anti-lock-in condition is even empirically checkable before we act.

  Keep it concrete and casual — this is for me, not a journal.
