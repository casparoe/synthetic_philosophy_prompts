answer: |-
  1. The interpretation must provide a principled explanation for AC's independence from ZF, framing Cohen's forcing models as revealing a genuine, substantive divergence in conceptions of set (e.g., regarding definability or "arbitrariness"), not merely a technical curiosity.  
  2. It must distinguish the nature and justification of global choice (applying universally across all sets) from local choice principles (applying within specific contexts like categories), accounting for why structures like well-pointed toposes validate local choice while global choice remains a stronger, distinct set-theoretic postulate.  
  3. The account must reconcile how AC both enables counterintuitive results like Banach-Tarski (relying on non-measurable sets) and preserves the core framework of standard real analysis and measure theory, clarifying the specific role of non-constructivity in generating paradox without undermining classical mathematics.  
  4. It must clarify the ontological status of entities proven to exist non-constructively via AC, determining whether such existence assertions carry a weaker, different, or equivalent commitment compared to entities defined by explicit constructions or weaker principles.  
  5. The interpretation must adjudicate whether AC fundamentally expresses a logical principle concerning the possibility of selection functions for arbitrary collections, or if it is inherently a set-theoretic commitment about the nature and existence of infinite sets and their elements.
