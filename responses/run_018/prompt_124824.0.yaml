answer: |-
  Here’s a structured teaching plan tailored to your objectives, prioritizing conceptual sequencing, example calibration, misconception interception, and strict omission boundaries:

  ---

  ### **Pedagogical Architecture: Dependency Order**
  1.  **Introduce the Sorites Structure (Sans Heap)**  
      - **Content:** Present the *logical form* of the paradox:  
        *Premise 1:* A single grain is not a heap.  
        *Premise 2:* Adding one grain never turns a non-heap into a heap.  
        *Conclusion:* 10,000 grains are not a heap.  
      - **Key Move:** Explicitly *decouple* the structure from sand/visual imagery. Emphasize its applicability to *any property* where small changes accumulate.  
      - **Interception Point:** Preempt "linguistic fix" proposals by stating: *"This is not about the word 'heap'—it’s about whether any property can tolerate unlimited incremental change."*

  2.  **Establish Semantic Indeterminacy vs. Ontological Gradation**  
      - **Content:** Contrast:  
        - *Semantic Indeterminacy:* Vagueness arises from language (e.g., "bald" lacks a precise definition).  
        - *Ontological Gradation:* Vagueness arises from the *world* (e.g., a mountain gradually eroding into a hill).  
      - **Critical Question:** *"Could a perfectly precise definition eliminate vagueness if the property itself is sensitive to tiny changes?"*  
      - **Interception Point:** If students suggest "better definitions" solve the problem, refocus on whether a property *in the world* can have sharp boundaries when change is continuous.  

  3.  **Introduce Institutional Properties & Authority**  
      - **Content:** Define institutional properties as *statuses dependent on collective recognition* (e.g., "being money," "being married," "having legal authority").  
      - **Thesis:** *"Institutional properties appear categorical but are sustained by gradable social practices."*  
      - **Interception Point:** Challenge "all-or-nothing" intuitions with: *"If a law loses 99% compliance, is it still binding? If not, at what % did it cease?"*  

  4.  **Deploy the Legal Carrying Case: Precedent Erosion**  
      - **Calibrated Example Requirements:**  
        - **Must Have:**  
          - A landmark ruling (e.g., *Roe v. Wade*) with multiple substantive criteria (e.g., viability, privacy right, state interest tiers).  
          - A series of lower-court decisions that *narrowly distinguish* the case by modifying one criterion per ruling (e.g., redefining "viability," adding exceptions to privacy).  
          - An endpoint where the precedent is *formally cited* but stripped of all practical force.  
        - **Must Lack:**  
          - A "bright line" moment of reversal (e.g., no *Dobbs*-style overturning).  
          - Reference to physical/visual metaphors (e.g., "erosion," "hollowing" used *only* as legal terms).  
      - **Narrative Flow:**  
        *"Each ruling accepts precedent P but carves out exception Eₙ. After 100 exceptions, P still ‘exists’—yet no case will ever satisfy all criteria. When did P cease to have binding authority?"*  

  ---

  ### **Misconception Map & Interception Points**
  - **"Vagueness is linguistic" → Intercept at Step 2:**  
    *Response:* "Even if we redefine 'binding authority' precisely, does that force the *social practice* of legal recognition to have sharp thresholds?"  
  - **"Fuzzy logic resolves this" → Intercept at Step 4:**  
    *Response:* "Fuzzy logic assigns partial truth (e.g., 0.7 binding), but courts treat authority as *binary*—either a ruling binds or it doesn’t. How can a 0.7-binding precedent issue a yes/no judgment?"  
  - **"The precedent was overturned de facto" → Intercept at Narrative End:**  
    *Response:* "But no court declared it overruled. If authority depends on formal validity, how can it be *materially* absent while *formally* present?"  

  ---

  ### **Diagnostic Question for Structural Understanding**  
  *"In the erosion of precedent, is the sorites paradox attacking the* linguistic clarity *of 'binding authority,' or the* metaphysical coherence *of an institutional status that tolerates indefinite small changes? Why can’t we solve this by admitting degrees of bindingness?"*  
  - **Target Insight:** Correct answers identify the *ontological threat* (institutional properties collapse under continuity) and note that legal systems require *binary validity* (a "70% binding" rule cannot issue a decisive ruling).  

  ---

  ### **Explicit Omissions & Refusals**  
  - **Formal Machinery to Exclude:**  
    - *Supervaluationism*: Do not explain gaps in precisifications.  
    - *Degree-Theoretic Semantics*: Do not discuss truth values in [0,1].  
    - *Epistemicism*: Do not entertain "unknowable sharp boundaries."  
  - **Declaration to Class:**  
    *"Our goal isn’t to* solve *the sorites but to see how its structure threatens institutional ontology. We’re setting aside formal semantics tools—they address linguistic vagueness, not whether social reality admits gradients."*  

  ---

  ### **Teaching Sequence Summary**
  1.  Sorites structure (logical skeleton only).  
  2.  Semantic vs. ontological vagueness distinction.  
  3.  Institutional properties’ dependence on collective recognition.  
  4.  Legal case study (calibrated to avoid heap imagery).  
  5.  Misconception intercepts at each stage.  
  6.  Diagnostic question → Discussion.  
  7.  Affirm omissions: *"We ignore formal semantics to isolate the metaphysical threat."*  

  This sequence forces engagement with gradation as an *ontological problem for institutions*, using law to expose how binary statuses disintegrate under incremental change—precisely mirroring the sorites without sand.
