prompt: |-
  I'm on the staff of a reconciliation NGO that runs structured dialogue circles between ex-combatants from conflicts where the justice of the cause is still disputed — think occupation vs resistance scenarios, but I'm not naming specific ones. We keep fighting over whether the moral equality of combatants means we seat everyone symetricaly, or whether fighting for an unjust cause strips you of that equal standing. I need an actual decision procedure my facilitators can run before each session: a sequence of questions they ask about the specific participant, with clear stopping rules for when we treat them as morally equal vs when we apply asymmetrical framing, and explicit flags for where the answer is a value judgment not a factual check.

  The procedure needs to be grounded in the independence thesis — that jus in bello rights don't depend on jus ad bellum — but it also has to deal with the revisionist pushback that unjust-side combatants aren't innocent in the same way. So build in checks for: direct vs indirect responsibility for the unjust war, the combatant's actual epistimic access to the justice of the cause (the epistimic risk problem — if we can't verify belief states, what do we default to?), and whether they engaged in ordinary fighting vs direct war crimes. For each check, say what counts as a passing answer, what fails it, and where the procedure just throws up its hands and asks the facilitator to make a call.

  Then apply it to three people we're actually seeing next month: a conscripted foot soldier from the aggressor side who says he believed state propaganda; a volunteer strategist from that same side who designed logistics but never pulled a trigger; and a defensive fighter who killed prisoners in reprisal. I want the procedure to give me answers I might hate — especially if it says the volunteer strategist still gets symmetrical seating — and I want you to mark exactly where the procedure breaks down because we're guessing at internal mental states. Don't ask me to cite Walzer or anyone else; I just need the logic made runnable, with the hard edges left visible, since I'm running these twice a week with no research staff.
reasoning: |-
  Okay, the user is part of an NGO running dialogue circles between ex-combatants in conflicts where the justice of the cause is still disputed. They're struggling with whether to treat participants as morally equal or apply asymmetrical framing based on their role in the conflict. They need a clear, step-by-step decision procedure that their facilitators can use before each session.

  The user wants this procedure grounded in the independence thesis (jus in bello independent of jus ad bellum), but also accounting for revisionist critiques about combatant innocence. They specifically mention needing checks for: direct vs. indirect responsibility, epistemic access to the justice of the cause, and whether they engaged in ordinary fighting vs. war crimes.

  The user is practical - they need something operational twice a week without research staff. They want the "hard edges" visible, especially where internal mental states are unknowable. They're clearly frustrated with academic debates and want actionable logic.

  Key challenges I need to address:
  - How to handle epistemic uncertainty about beliefs
  - Where to draw lines on responsibility
  - How to deal with varying roles (conscript vs strategist vs war criminal)
  - Making value judgments explicit rather than hidden

  The procedure must have:
  1. Clear sequential questions
  2. Binary pass/fail criteria where possible
  3. Explicit "judgment call" flags
  4. Stopping rules for symmetry/asymmetry decisions

  User provides three test cases:
  1. Conscripted foot soldier (aggressor side) who believed propaganda
  2. Volunteer strategist (same side) doing logistics
  3. Defensive fighter who killed prisoners

  Notably, they want answers they "might hate" - so I shouldn't soften conclusions if logic points to symmetrical treatment for problematic cases like the strategist.

  Deep needs analysis:
  - They're likely facing internal staff conflicts over neutrality vs moral judgment
  - Probably getting pressure from stakeholders to "take sides"
  - Need to maintain credibility with all participant groups
  - Seeking institutional consistency amid moral complexity
  - Want to protect facilitators from having to make ad hoc ethical calls

  Biggest tension: Maintaining dialogue structure while acknowledging moral asymmetry could undermine reconciliation goals. But ignoring it could validate oppression. Need a solution that neither collapses into relativism nor imposes contested moral hierarchies.

  Procedural design principles:
  - Default to symmetry unless clear triggers
  - Prioritize verifiable actions over contested beliefs
  - Contain epistemic uncertainty in designated "call" boxes
  - Distinguish between war-fighting and war crimes sharply
  - Accept that some cases will feel unsatisfying (per user request)

  For the test cases, I anticipate:
  - Conscript likely symmetrical
  - Strategist might be symmetrical under independence thesis (controversial)
  - Defensive fighter asymmetrical due to war crimes

  The epistemic access check will be messiest - since we can't verify beliefs, we'll need observable proxies and clear "undecidable" exits.
answer: |-
  Here's a procedural decision tree designed for field use, grounded in the independence thesis while incorporating revisionist concerns via verifiable filters. It prioritizes **observable actions** over contested beliefs, defaults to symmetry unless specific asymmetrical triggers are hit, and flags unavoidable value judgments. Facilitators run this as a checklist *per participant* before seating assignments.

  ---

  ### **Moral Standing Assessment Protocol**
  **Default Output:** Symmetrical seating unless a "Fail" or "Asymmetry Trigger" is hit.  
  **Stopping Rule:** Proceed sequentially. Stop and assign "Asymmetrical Framing" if any step fails. If all steps pass, assign "Symmetrical Framing".  
  **Value Judgment Flags:** Marked with ⚖️. Facilitators must consult a supervisor if triggered.

  1.  **CHECK: DIRECT WAR CRIMES**  
      *Question: Did the participant personally commit acts violating the Geneva Conventions or customary IHL (e.g., torture, targeting civilians, killing hors de combat)?*  
      - **Pass:** No direct involvement OR acts occurred under immediate, credible threat to their life (e.g., forced at gunpoint).  
      - **Fail:** Direct, voluntary commission of war crimes (evidence: credible testimony, conviction, or admission).  
      - **Judgment Call ⚖️:** Ambiguous evidence or disputed voluntariness (e.g., "following orders" under duress).  
      *→ If Fail: Assign Asymmetrical Framing (War Criminal). STOP.*  
      *→ If Pass or ⚖️: Proceed to Step 2.*

  2.  **CHECK: INDIRECT RESPONSIBILITY FOR UNJUST WAR**  
      *Question: Did the participant hold command authority (e.g., General, Minister) or design strategic policy (e.g., occupation plans, forced displacement)?*  
      - **Pass:** Foot soldier, low-level technician, logistician, or conscript with no policy role.  
      - **Fail:** High-level command, strategic planner, or architect of policies constitutive of aggression/occupation.  
      - **Judgment Call ⚖️:** Mid-level roles (e.g., battalion commander, mid-tier planner).  
      *→ If Fail: Assign Asymmetrical Framing (Unjust Aggressor Architect). STOP.*  
      *→ If Pass or ⚖️: Proceed to Step 3.*

  3.  **CHECK: EPISTEMIC ACCESS PROXY**  
      *Question: Could a reasonable person in the participant’s position (role, location, access to information) have known the core injustice of the cause?*  
      *Focus on objective context, NOT claimed beliefs.*  
      - **Pass:** Conscripted low-rank fighter; isolated from non-state media; active state censorship/propaganda; no access to victims.  
      - **Fail:** Volunteer in elite/intelligence unit; educated strategist with security clearance; access to international media/NGOS; direct interaction with victims.  
      - **Judgment Call ⚖️:** Mixed context (e.g., volunteer foot soldier in semi-open society).  
      *→ If Fail: Proceed to Step 4 (revisionist concern).*  
      *→ If Pass or ⚖️: Assign Symmetrical Framing. STOP.*

  4.  **REVISIONIST OVERRIDE CHECK**  
      *Question: Did the participant voluntarily contribute significant, direct combat power to the unjust cause?*  
      *Filters out "non-innocent" unjust combatants per revisionism, using verifiable action.*  
      - **Pass:** Non-combat role (e.g., medic, purely defensive position); coerced participation (conscript under threat of imprisonment/death).  
      - **Fail:** Volunteer combatant who personally engaged in offensive operations (e.g., raids, occupation enforcement).  
      - **Judgment Call ⚖️:** Indirect combat support (e.g., voluntary logistics for offensive units).  
      *→ If Fail: Assign Asymmetrical Framing (Responsible Unjust Combatant).*  
      *→ If Pass or ⚖️: Assign Symmetrical Framing.*  

  ---

  ### **Application to Test Cases**
  **Case 1: Conscripted Foot Soldier (Aggressor Side)**  
  - Step 1: **Pass** (no war crimes).  
  - Step 2: **Pass** (no command role).  
  - Step 3: **Pass** (conscript + propaganda → reasonable ignorance).  
  - → **Symmetrical Framing**.  
  *Logic:* Independence thesis shields low-level conscripts. Epistemic pass negates revisionist override.

  **Case 2: Volunteer Strategist (Aggressor Side - Logistics)**  
  - Step 1: **Pass** (no trigger).  
  - Step 2: **⚖️ Judgment Call** (mid-level planner? Depends if role involved policy vs. technical logistics). *Assume supervisor rules "Pass" (non-policy logistics).*  
  - Step 3: **Fail** (volunteer strategist → access to intelligence/int'l media → reasonable knowledge).  
  - Step 4: **⚖️ Judgment Call** (logistics is indirect combat support). *Assume supervisor rules "Fail" (voluntary, critical support to aggression).*  
  - → **Asymmetrical Framing (Responsible Unjust Combatant).**  
  *Hard Edge:* Steps 2 and 4 rely on contested role interpretation. Epistemic proxy uses role as belief substitute.

  **Case 3: Defensive Fighter (Killed Prisoners)**  
  - Step 1: **Fail** (killing prisoners is a war crime).  
  - → **Asymmetrical Framing (War Criminal).**  
  *Logic:* Jus in bello violation overrides ad bellum considerations. Independence thesis doesn't protect war criminals.

  ---

  ### **Protocol Notes for Facilitators**
  - **Epistemic Limits:** Steps 3-4 use roles/context as proxies for beliefs. We *never* assess sincerity of stated beliefs.  
  - **Asymmetry Triggers:** Only war crimes (Step 1) or high responsibility (Step 2/4) break symmetry.  
  - **Hated Outcomes:** The strategist *could* get symmetry if supervisors judge logistics as non-responsible (Step 2 Pass) or non-combat (Step 4 Pass). This reflects independence thesis rigor.  
  - **Value Judgments:** ⚖️ flags require supervisor input. Document reasons for consistency.  
  - **Speed:** Takes 5 mins/participant using pre-session intake data.  
  - **Why This Works:** Upholds jus in bello independence by default, uses revisionism only where roles/actions objectively indicate responsibility, and isolates unverifiable belief questions into ⚖️ boxes.
