answer: |-
  ## Opening Address: Forecasting as Collective Responsibility

  Distinguished colleagues, partners, and guests: welcome to this vital joint workshop on forecasting in public life. We gather today – statisticians, modelers, city planners, community advocates, policy makers, and concerned citizens – united by the profound impact forecasting has on the decisions shaping our shared world. Whether predicting the next pandemic surge, allocating climate adaptation funds, or planning economic interventions, we rely on forecasts. But every single one of these predictions rests on a hidden foundation, an unobservable choice we must bring into the light: **Which set of past cases do we consider comparable?**

  For our quantitative colleagues, you know this intimately as the reference class problem. For everyone here, it’s a practical reality: **To forecast what *will* happen, we must decide what past situations *count* as similar enough to the one we face now.** This choice isn't a minor technical detail; it is the very lens through which we see the future, and it fundamentally shapes the obligations we perceive.

  Consider a concrete example: forecasting the impact of an urban heat-mitigation policy for a large, diverse city facing unprecedented temperatures. How do we predict its effect on heat-related survival rates?

  *   **Option 1:** We model this policy using data primarily from **wealthy cities in northern climates** with mature infrastructure, high baseline resilience, and extensive green space. Here, the data might show moderate success. The model predicts a manageable reduction in mortality, perhaps focused on vulnerable elderly populations during peak events. Our obligation appears centered on targeted interventions, fine-tuning existing robust systems.
  *   **Option 2:** We model the same policy using data from **rapidly urbanizing tropical cities**, characterized by dense informal settlements, limited green infrastructure, high outdoor labor dependence, and pre-existing heat stress. The identical policy, plugged into *this* comparison class, yields a radically different forecast. Survival rates might plunge significantly lower. The model highlights catastrophic risk for outdoor workers, families in heat-trapping informal housing, and communities with less access to cooling. Our obligation now screams for urgent, large-scale infrastructure investment and social protection, not just fine-tuning.

  *The same policy. Similar data inputs, technically. But radically different forecasts and, crucially, radically different perceived obligations.* Why? **Because the choice of reference class – wealthy north or rapidly urbanizing tropics – doesn't just shift a number on a graph; it changes *whose lives and which trade-offs* the forecast makes visible.** It determines whose vulnerabilities are centered in the calculation and whose are marginalized or rendered invisible by the model's assumptions about what counts as "comparable."

  This is why forecasting, especially in the urgent, value-laden domain of public life, can never be framed as mere technical mastery. The power lies not just in running the model, but in the *unseen choice* of which past realities we deem relevant enough to build it upon. That choice is inherently value-laden. It reflects assumptions about what factors *really* matter, whose experiences define "normal," and ultimately, whose risks we prioritize.

  Therefore, the central task we set for ourselves today is **not** to celebrate prediction as control. Our task is **making these hidden reference-class selections explicit, discussable, and accountable.** We must create a shared language – between modelers and practitioners, between data experts and community voices – to scrutinize the "why" behind every comparison group chosen. Why *these* cities? Why *those* epidemics? Why *this* set of economic interventions as precedent?

  For modelers, this means rigorously questioning your defaults and actively seeking diverse perspectives to challenge them. For planners and advocates, it means demanding clarity: "Show me the past you are comparing us to, and let's discuss if that's truly *our* past, and if it reflects the future *we* need to build."

  Only by bringing this foundational choice into our collective conversation can we hope for forecasts that serve justice, equity, and genuine resilience. **Our ethical responsibility today is to illuminate the hidden comparisons that shape our predicted futures, ensuring they reflect the complex realities and diverse values of the public we serve.** Let us begin that essential work together. Welcome.
