prompt: |-
  The marketplace app I run trust and safety for makes users do their deals in plain chat messages, and we have to decide whether a flagged message is a promise or offer we'll enforce, a threat we remove the user for, or just someone venting. The moderators making these calls are contractors with no philosophy background and about ten minutes a case, and every week decisions get reversed because two people read the same sentence differently. I've been told speech-act theory is the right lens here — that saying something can do something, that promises and threats are acts rather than descriptions — but I've never seen it turned into something my team can actually run. Write me a decision procedure for a flagged message: the questions in order, what counts as a sufficient answer to move to the next step, where a message fails to be a promise/offer/threat rather than merely reporting the speaker's state of mind, and where the procedure has to stop and punt to a human because the theory itself has a live dispute underneath it. Keep it grounded in the real distinctions — explicit vs implicit performatives, felicity conditions, uptake, sincerity, direction of fit, the difference between the act succeeding and its perlocutionary effects — but translate them into moderator language, no jargon dumps.

  Then run the procedure on three test cases: (1) "I promise I'll pay you Friday" where the sender later says it was a joke among friends; (2) "I'll give you 50 if you hand me that thing" where the sender claims they were just musing about a hypothetical, not making an offer; (3) "you probably should delete that before it gets out, just a thought." Make sure one of your worked examples reaches a call my team would hate, because a procedure that always agrees with my moderators isn't doing work.

  Finally, for each major branch, tell me which bit of speech-act doctrine it leans on and what alternative view would flip that branch — say, whether uptake is necessary for a promise, or whether an insincere performative still performs — and be explicit about where your flowchart is most likely to fail or what would have to be true for you to draw the boxes differently.
reasoning: |-
  Okay, the user runs trust and safety for a marketplace app where deals happen in plain chat. They need a way to classify flagged messages as enforceable promises/offers, removable threats, or just venting. The moderators are contractors with limited time and no philosophy background, and there's inconsistency in decisions. They've heard speech-act theory could help but need a practical decision procedure.

  The user wants a step-by-step flowchart that translates complex concepts like performatives, felicity conditions, and direction of fit into plain questions. They also want test cases showing how it works, including one unpopular outcome, and want to know where the procedure might fail.

  Hmm, the core challenge is operationalizing Austin and Searle's theories for non-experts. Need to extract the most actionable distinctions: explicit performatives vs. implicit ones, the minimum conditions for an act to "count," and how to spot when words are doing things versus describing things. The "venting" category is basically locutionary acts without illocutionary force - but must avoid that jargon.

  For the decision tree, it should start by filtering out non-actions (reports, jokes) before assessing threat/promise/offer. Key anchors: 1) Does it look like a transaction-related action? 2) Is it direct or dressed as opinion? 3) Can we verify intent without mind-reading? The felicity conditions map well to "could this reasonably be acted upon?" checks.

  Biggest friction points will be: irony (where procedure might over-enforce), implied threats ("it'd be a shame if..."), and failed performatives. The test case with "just a thought" will be contentious because moderators might see it as passive-aggressive but the procedure likely calls it non-actionable.

  For philosophical splits: The sincerity condition is thorny - if someone says "I promise" as a lie, is it still a promise? Legally yes, morally debatable. My procedure treats it as valid but sanctionable, which leans Searle over Austin. Also, uptake (recipient understanding) matters more for offers than threats - hence the different branches.

  The example they'll hate is Case 3 where "you probably should delete that" isn't classed as a threat. It fails the directness and commitment tests. But in real life, that might indeed be coercive - that's where cultural context exceeds the model. Explicitly flagging that gap is crucial.
answer: |-
  Here's a streamlined decision procedure based on speech-act theory, designed for speed and clarity with minimal jargon, followed by test cases and critical analysis:

  **Decision Procedure: Classifying Flagged Messages**

  1.  **Is this about a transaction? (Context Filter)**
      *   *Question:* Does the message relate to buying, selling, trading, payment, delivery, or consequences for a marketplace transaction?
      *   *Sufficient Answer:* **No** → *Stop:* Not actionable (likely venting, unrelated chat). **Yes** → Proceed to 2.
      *   *Theory Anchor:* Focuses the procedure on marketplace-relevant *illocutionary acts*.

  2.  **Is it a direct action word? (Explicit Performative Test)**
      *   *Question:* Does the message contain words like "promise", "offer", "guarantee", "threaten", "warn", "demand", or similar direct action verbs (e.g., "I promise...", "I offer...", "I demand...")?
      *   *Sufficient Answer:* **Yes** → Proceed to 3. **No** → Proceed to 4.
      *   *Theory Anchor:* Identifies *explicit performatives* where the word *is* the act.

  3.  **Could they actually do it? (Basic Felicity Check - Capability/Authority)**
      *   *Question:* Based on the transaction context and known user info (e.g., is the sender the buyer/seller?), could the speaker reasonably carry out the stated action (e.g., pay $50, ban someone) or is it clearly impossible/absurd *in this context*?
      *   *Sufficient Answer:* **No (Impossible/Absurd)** → *Stop:* Likely venting, joke, or error (e.g., "I promise to deliver a unicorn"). **Yes or Uncertain** → Proceed to 5.
      *   *Theory Anchor:* Checks minimal *preparatory conditions* (speaker capability/authority). Doesn't require certainty, just plausibility.

  4.  **Is it phrased as an action, not just a feeling? (Implicit Performative Test)**
      *   *Question:* Does the message state an action the speaker *will do* (e.g., "I'll pay Friday", "You'll get banned") or demand an action *the recipient must do* (e.g., "Send the money", "Delete that"), rather than *just* describing feelings, intentions, or hypotheticals (e.g., "I want to pay", "I might pay", "It would be bad if that got out")?
      *   *Sufficient Answer:* **Action Statement/Demand** → Proceed to 5. **Feeling/Hypothetical/Report** → *Stop:* Likely venting or non-binding statement. **Uncertain** → Proceed to 5 (Cautiously).
      *   *Theory Anchor:* Distinguishes *implicit performatives* (commissives: commit speaker; directives: command recipient) from *constatives* (statements of fact/feeling) or non-serious acts. Focuses on *direction of fit* (words-to-world vs. world-to-words).

  5.  **Is it meant seriously? (Sincerity & Seriousness Check)**
      *   *Question:* Considering the *immediate chat context* (tone, prior messages, relationship indicators - e.g., known friends?, heated argument?), is there a *strong, clear indicator* this is *not* serious? (e.g., obvious sarcasm markers "/s", 😂, immediately followed by "jk", clear in-joke pattern).
      *   *Sufficient Answer:* **Clear Evidence Not Serious** → *Stop:* Non-binding (joke, venting). **No Clear Evidence / Seems Serious** → Proceed to 6.
      *   *Theory Anchor:* Assesses *sincerity condition* and *non-serious* utterances. Avoids mind-reading; requires *clear* contextual evidence of non-seriousness. Insincere performatives (lies) are *still* acts.

  6.  **What kind of action is it? (Force Classification)**
      *   *Question A (Commitment):* Does it commit the *speaker* to a future action (e.g., pay, deliver, provide)? → **Yes:** Classify as **Promise/Offer** (enforceable agreement issue).
      *   *Question B (Demand/Threat):* Does it demand the *recipient* do something (e.g., pay, ship, delete) OR state a negative consequence the *speaker will impose* if the recipient doesn't comply (e.g., "I'll report you", "I'll cancel the order")? → **Yes:** Classify as **Threat/Demand** (policy violation risk).
      *   *Question C (Warning):* Does it only state a *factual negative consequence* that *might happen naturally or by a 3rd party* (e.g., "If you don't ship, you'll get a bad review", "That photo might get you banned")? → **Yes:** *Stop:* Generally permissible warning (unless maliciously false). **None Clearly Fit / Mixture** → *Punt to Human:* Complex or ambiguous intent.
      *   *Theory Anchor:* Final classification based on *illocutionary point* (commissive, directive). Distinguishes threats (speaker-imposed consequence) from warnings (non-speaker consequence). Focuses on who commits/acts and who suffers the consequence.

  ---

  **Test Cases:**

  1.  **"I promise I'll pay you Friday" (Sender claims later it was a joke among friends)**
      *   1: **Yes** (Payment = transaction).
      *   2: **Yes** ("promise" = explicit performative).
      *   3: **Yes/Uncertain** (Paying Friday is plausible).
      *   5: **Punt to Human?** This is the crux. *Is there clear evidence in the immediate chat context it wasn't serious?* If the chat shows friendly banter, emojis, or "jk" right after → **Stop:** Non-binding (Venting/Joke). If the chat is strictly transactional with no humor cues → Proceed.
      *   6: If proceeds → **Promise/Offer**. **Decision:** Moderator *must* look at immediate chat context. No clear joking cues? It's a promise, regardless of later claims. Sincerity (believing it) isn't required for the act to exist; capability and seriousness are key. Later claiming "joke" doesn't erase the act if context showed seriousness.

  2.  **"I'll give you 50 if you hand me that thing" (Sender claims musing/hypothetical)**
      *   1: **Yes** (Payment for item = transaction).
      *   2: **No** (No explicit "offer", "promise" etc.).
      *   4: **Action Statement** ("I'll give you 50" = speaker commits action; "if you hand me..." = condition for recipient). Not *just* a feeling ("I want") or hypothetical ("I might").
      *   5: **No Clear Evidence Not Serious** (Claiming "musing" later ≠ clear contextual evidence of non-seriousness at the time). Proceed.
      *   6: **Promise/Offer** (Commits speaker to pay upon recipient's action - a conditional offer). **Decision:** **Offer**. The structure ("I will do X if you do Y") is a classic implicit offer/commissive. Claiming hypotheticality afterwards doesn't negate the act if the utterance was structured as a commitment in context.

  3.  **"you probably should delete that before it gets out, just a thought."**
      *   1: **Yes** (Likely refers to transaction-related content, e.g., personal info, evidence).
      *   2: **No** (No explicit threat/demand).
      *   4: **Feeling/Hypothetical/Report**? Key Test: Is it a *demand* ("Delete that!") or a *stated consequence the speaker will impose* ("Delete it or I'll...")? No. It's phrased as advice ("should") and softened ("probably", "just a thought"). It states a potential negative consequence ("before it gets out"), but attributes it vaguely ("gets out" - not necessarily speaker's action). It primarily *reports* the speaker's opinion/advice.
      *   *Stop:* **Venting / Non-Binding Statement (Warning?)**. Not a clear threat or demand. **Decision:** **Not Actionable (Venting/Opinion)**. *This is the call your team might hate.* It feels coercive, but the procedure focuses on the *act performed* by the words. It lacks the directness or commitment of a threat/demand. It's more akin to a (possibly passive-aggressive) warning or strong advice. *However, if chat history shows this is part of a pattern of harassment, a human might still act on policy grounds beyond pure speech-act classification.*

  ---

  **Branch Dependencies & Failure Points:**

  *   **Branch 2 (Explicit Performatives):** Leans on **Austin's initial distinction**. *Alternative View:* Some argue all utterances are implicit performatives; this would collapse Branch 2, making Branch 4 the only path. *Failure Point:* Over-reliance on specific verbs; misses culturally specific performatives. Mitigated by Branch 4.
  *   **Branch 3 (Capability):** Leans on **Preparatory Conditions (Searle)**. *Alternative View:* Strict liability - uttering the words *is* the act, regardless of feasibility. This would remove Branch 3. *Failure Point:* Hard to assess "capability" quickly (e.g., does "$50" mean USD or reputation points?). Relies on obvious absurdity/impossibility.
  *   **Branch 4 (Action vs. Feeling/Hypothetical):** Leans on **Direction of Fit (Searle)** and **Implicit Performatives**. *Alternative View:* A strong expression of intention ("I absolutely will pay!") *is* a promise. This would broaden Branch 4. *Failure Point:* **MAJOR FAILURE POINT.** Distinguishing strong intent ("I will pay!") from weak intent ("I might pay") or mere desire ("I want to pay") is highly contextual and subjective. Cultural differences in indirectness amplify this. Expect punts here.
  *   **Branch 5 (Seriousness):** Leans on **Sincerity/Non-Seriousness (Austin/Searle)**. *Alternative View 1 (Austin):* A performative uttered insincerely or in jest *fails* (is "abuse" or "misfire"). This would make Branch 5 stricter. *Alternative View 2:* The act succeeds if recognized by convention, sincerity is separate. *Failure Point:* Detecting sarcasm/jokes without clear markers is notoriously difficult and culturally dependent. High risk of misclassification (taking jokes seriously or missing veiled threats).
  *   **Branch 6 (Threat vs. Warning):** Leans on **Direction of Fit & Who Imposes Consequence**. *Alternative View:* Any statement causing fear of consequence is a threat. This would broaden the threat category. *Failure Point:* Distinguishing speaker-imposed consequences ("I will report you") from natural/3rd party consequences ("You might get banned by the platform") is crucial but can be ambiguous ("*We* will ruin you" - who is "we"?). Veiled threats ("It would be unfortunate if...") exploit this gap. **Another MAJOR FAILURE POINT.**

  **Where the Flowchart is Most Likely to Fail:**
  1.  **Implicit vs. Constative (Branch 4):** Differentiating strong commitments/commands from strong opinions/fears/hypotheticals is inherently ambiguous and context-heavy. Expect frequent punts or errors here.
  2.  **Sarcasm/Joke Detection (Branch 5):** Without explicit markers, this is guesswork. Prone to both false positives (punishing jokes) and false negatives (missing veiled aggression).
  3.  **Threat vs. Warning (Branch 6):** Particularly vulnerable to passive-aggressive, veiled, or ambiguously worded coercion. Requires careful parsing of who imposes the consequence.
  4.  **Cultural/Linguistic Nuance:** Indirect communication styles, idioms, and cultural norms around promises/threats aren't captured well by a generic procedure.

  **To Draw Boxes Differently, You Would Need To Believe:**
  *   That *all* communication is action-oriented (eliminate Branch 1/4 filters, focus only on classifying the act).
  *   That speaker intent *at the time of utterance* is knowable and paramount (shift focus from utterance form/context to trying to divine intent, requiring more investigation time).
  *   That the *perlocutionary effect* (fear, reliance) defines the act, not the illocutionary force (e.g., if it caused fear, it's a threat, regardless of words). This is policy-driven, not pure speech-act.
  *   That platform norms override linguistic theory (e.g., "any statement causing transaction pressure is sanctionable").

  This procedure makes speech-act theory operational for fast moderation by focusing on *utterance form, immediate context, and plausible action* rather than deep intent or philosophical nuance. It prioritizes consistency over perfect accuracy, knowing ambiguity requires human review at key points (Branch 4/5/6). Its strength is forcing explicit reasoning based on observable features; its weakness is handling ambiguity inherent in language.
