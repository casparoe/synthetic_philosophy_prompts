prompt: |-
  I am a novelist composing the final examination for an advanced seminar I have constructed around the philosophical implications of computational complexity; my students have encountered Kuhn’s narratives of incommensurability and the basic grammar of P and NP, yet I want an essay question whose answer cannot be assembled from those familiar plots alone. Please write a single 90-minute exam question, a model answer of approximately 700 words, and a marking scheme allocating 25 marks across five named conceptual moves.

  The question should hinge on a concept introduced here — resource-structural opacity (RSO) — defined as follows: if P ≠ NP, then certain true explanatory structures are polynomial-time verifiable yet require super-polynomial resources to discover, producing in an embedded agent an asymmetry that is structural rather than conceptual. The prompt must require students to distinguish RSO from Kuhnian incommensurability, to examine its tension with at least one account of scientific explanation (mechanistic or unificationist), and to judge whether it yields relativism or a non-relativist account of persistent theoretical disagreement. It must ask for no bibliographies, citations, or external reading lists, and must rest solely on conceptual resources available to a well-prepared student without web access.

  The marking scheme should separate an A answer from a B by specifying, for each of the five moves, the precise reasoning required and the characteristic failure mode — for instance, conflating resource limits with conceptual scheme change, or treating NP-hardness as merely a practical inconvenience rather than an ontologically embedded barrier.

  Present your response with its bottom line — the central grading crux that distinguishes first-class work from competent work, together with the boundary between them — in the very first sentence; then deliver the exam question, model answer, and marking scheme in sequence, with no preamble, no restatement of this request, and no commentary outside those three sections. Finally, append a brief epistemic note identifying the weakest link in your model answer’s reasoning and specifying what theoretical result (for example, a proof that NP ⊆ P, or a demonstration that mechanistic explanation eliminates resource barriers) would compel you to revise the scheme’s weighting or priorities.
