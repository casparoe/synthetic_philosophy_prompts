  I'm moderating a student paper Q&A next tuesday with Dr. Lena Voss, who's been arguing that ant colonies—like the Aunt Hillary setup from the Ant Fugue—actually have a distributed mind, not just a metaphor. She deflects the combination problem by saying it's basically a research program, not an objection, and she also likes this robot-swap idea: replace half the ants with tiny bots running the same pheromone rules, and she claims the colony's mental life stays intact, which she takes as proof the mind lives in the pattern not the bodies. I want eight to ten questions that don't just let her restate the view. I need at least one on how she tells a genuinely minded colony from a really efficient but mindless swarm, one that presses what that robot scenario actually proves versus what it assumes, and one asking what empirical finding could actually make her drop the view. For each question, include a follow-up keyed to the reply she's most likely to give—especially if she tries to call the hard parts a research program. Please also seperate what's fairly settled in collective-cognition work from what's genuinely up for debate, and don't present her minority position as if it's the consensus. There's probably a typo in this message somewhere, just ignore it.
