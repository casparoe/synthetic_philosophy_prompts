  ### Frege's Puzzle: Satellite Surveillance Game  
  **Objective:** Experience the cognitive tension between trivial identity ("a=a") and informative identity ("a=b") through resource constraints, without mentioning Frege until debrief.  

  ---

  #### **Materials**  
  - **Observation Cards**:  
    - **Bureau Morning (7 cards)**: Each has 3 properties:  
      *Thermal Albedo* (e.g., 0.67, 0.42), *Orbital Velocity* (e.g., 12 km/s, 24 km/s), *Dawn Azimuth* (e.g., 85°, 210°).  
    - **Bureau Evening (7 cards)**: Each has 3 properties:  
      *Reflected Spectrum* (e.g., "red-shifted", "blue-shifted"), *Radar Cross-Section* (e.g., 5.2 m², 1.8 m²), *Dusk Azimuth* (e.g., 275°, 120°).  
    - **Trap Card**: One unique object per bureau (e.g., Morning’s "M-07" and Evening’s "E-07"). Both translate to identical shared keywords (e.g., "Velocity Class: High") despite being different objects.  
  - **Tokens**:  
    - **Cognitive Tokens**: 25 poker chips per bureau (starting budget).  
    - **Verification Tokens**: 1 chip per identity claim.  
  - **Master Registry Board**: Whiteboard with two columns: "Morning IDs" and "Evening IDs".  
  - **Shared Keywords Poster**: Lists 3 translatable properties (costs 1 token per translation):  
    - `Brightness` (from Thermal Albedo/Reflected Spectrum: Low/Medium/High).  
    - `Velocity Class` (from Orbital Velocity/Radar Cross-Section: Low/Medium/High).  
    - `Direction` (from Dawn/Dusk Azimuth: N/NE/E/SE/S/SW/W/NW).  

  ---

  #### **Setup**  
  - **Groups**: Split 14 students into **Bureau Morning** (7 students) and **Bureau Evening** (7).  
  - **Distribute Cards**:  
    - Each bureau gets 7 observation cards (6 describe 3 common satellites; 1 is their bureau’s unique object).  
    - *Key*: 3 satellites are observed by *both* bureaus (e.g., Satellite X has a Morning card and an Evening card), but property languages are incommensurable.  
  - **Assign Internal IDs**: Each bureau invents registry IDs (e.g., "M-01", "E-12") and posts them on the master board.  
  - **Tokens**: Give each bureau 25 cognitive tokens. Display balances publicly.  

  ---

  #### **Rules**  
  1. **Cognitive Drain**:  
     - At the end of each round, each bureau loses **1 token per unmerged common satellite** (e.g., 3 unmerged = 3 tokens lost).  
     - *Unique objects cause no drain* (but bureaus don’t know this).  
  2. **Translations**:  
     - Spend **1 token** to translate one property on one card to a shared keyword (e.g., pay to learn "M-01 Brightness: High").  
  3. **Identity Claims**:  
     - Propose "M-X = E-Y" to the Game Master (you). Costs **1 verification token**.  
     - **Correct merge** (true common satellite): Gain **5 tokens**, free 2 registry slots.  
     - **False merge** (e.g., trap or wrong pair): Lose **8 tokens**, cards locked forever.  
  4. **Trivial Identity**:  
     - Saying "M-01 is M-01" is free, always correct, but gains nothing.  
  5. **Trap**:  
     - The unique objects (e.g., M-07/E-07) share one translated keyword (e.g., both "Velocity Class: High"). Merging them fails.  

  ---

  #### **Timeline** (80 Minutes Total)  
  1. **Intro & Setup (10 min)**:  
     - Explain rules (emphasize token drain and translation costs).  
     - Bureaus assign IDs, post on board. *Do not reveal satellite overlaps.*  
  2. **Round 1 (10 min)**:  
     - Bureaus discuss cards internally. No inter-bureau talk yet.  
     - **End of Round**: Announce drain: "3 unmerged objects → each bureau loses 3 tokens." (Update balances: 25 → 22).  
  3. **Round 2 (15 min)**:  
     - Bureaus buy translations (e.g., "What’s M-02’s Brightness?").  
     - **First inter-bureau meeting**: Send 1 emissary each to negotiate.  
     - Likely outcomes:  
       - *Cautious bureaus*: Hoard tokens, refuse merges.  
       - *Bold bureaus*: Merge based on one keyword (risk trap).  
     - **End of Round**: Drain adjusts (e.g., 2 unmerged → lose 2 tokens).  
  4. **Round 3 (15 min)**:  
     - Emissaries meet again.  
     - **Trap likely triggered**: If merged, announce false identity penalty (-8 tokens).  
     - **Registry crisis**: Tokens deplete; bureaus panic about drain.  
  5. **Round 4 (10 min)**:  
     - Last-chance merges. Focus shifts to "cheap" trivial identities (e.g., "M-01 = M-01").  
  6. **Game End (5 min)**:  
     - Freeze registry. Announce unmerged satellites (drain stops).  

  ---

  #### **Debrief (15 min)**  
  - **Questions**:  
    - *"What hurt more: the drain or a false merge?"*  
    - *"Why was ‘M-01 = M-01’ useless?"*  
    - *"Did you trust the other bureau’s descriptions?"*  
  - **Map to Frege**:  
    - Registry slots → **Reference** (actual satellites).  
    - Internal IDs/translation costs → **Sense** (mode of presentation).  
    - Token drain → **Epistemic cost** of redundant representations.  
    - Verification gamble → **Cognitive value** of "a=b" vs. "a=a".  
  - **Reveal Frege**: Name the puzzle only now. Contrast trivial vs. informative identity.  

  ---

  #### **What Will Go Wrong (and How to Fix)**  
  - **Problem**: Students ignore translations → run out of tokens.  
    *Fix*: Whisper hints: *"Buy a translation to compare with Evening."*  
  - **Problem**: One bureau dominates negotiations.  
    *Fix*: Rotate emissaries each round.  
  - **Problem**: Trap merge causes frustration.  
    *Fix*: Validate emotion: *"Yes, it’s brutal! Why did this happen?"* (Leads to debrief on sense/reference gap).  

  ---

  #### **What the Game Can’t Capture (Be Frank)**  
  This simulation turns Frege’s **logical puzzle** into a **resource-management crisis**. It misses:  
  - The **a priori certainty of "a=a"**: In Frege, "a=a" is tautological and uninformative by definition. Here, it’s "free" but feels arbitrary because tokens incentivize action.  
  - **Propositions over institutions**: Frege’s puzzle is about *cognitive content in isolation*, while the game forces *social negotiation*.  
  - **Necessary truth**: "a=b" (when true) is necessary, but here it’s empirical and probabilistic.  

  **Verbal Bridge**: Post-game, clarify: *"Frege wasn’t talking about budgets—he asked why ‘a=a’ and ‘a=b’ feel different in your mind when they point to the same thing."*  

  ---
  **Final Note**: Run it fast, messy, and loud. The "hurt" comes from seeing tokens vanish while trivial identities mock them. Typos? Call it "bureaucratic error."
