answer: |-
  Your diagnosis is perceptive: the standoff isn't merely about pluralism versus supremacy but stems from deeper conceptual conflations and unexamined premises. The debate is paralyzed because participants are (often unwittingly) arguing past each other across **three distinct axes of disagreement**, compounded by the complications you note. Progress requires disentangling these axes and confronting their empirical and conceptual dependencies.

  ### Core Diagnosis: Three Conflated Axes Sustaining the Standoff
  1. **The Scope Conflation (Ideal vs. Reason vs. Cultivation)**  
     Your hypothesis is fundamentally correct but needs refinement. The three questions—*ideals* (what merits admiration), *reasons* (what agents ought to do all-things-considered), and *self-cultivation* (how agents should shape their character given cognitive/emotional limitations)—are routinely conflated. Crucially, **each side privileges a different scope**:  
     - **Anti-saint critics** (e.g., Wolf, Slote) focus on *self-cultivation* and *reasons*: they argue that *aiming* for sainthood leads to impoverishment, and that non-moral reasons legitimately override moral demands in lived experience.  
     - **Pro-saint defenders** (e.g., Railton, Adams) focus on *ideals*: they argue that a *properly conceived* saint *would* be admirable and integrated, treating self-cultivation concerns as contingent flaws in the agent, not the ideal.  
     Neither side fully engages the other’s scope. Defenders dismiss crowding-out as a failure to achieve the ideal (“you’re describing a bad saint!”), while critics retort that defenders ignore the psychological costs of pursuing the ideal (“your saint isn’t human!”). This is not a standoff about values but about **which discursive frame governs the debate**.

  2. **The Modal-Conflated Empirical Claim (Crowding-Out)**  
     The crowding-out objection functions as a Rorschach test:  
     - **Strong modal claim**: “Moral perfection *necessarily* excludes non-moral excellences.” This presumes an inherent conflict in the *concepts* (e.g., moral attention monopolizes psychic resources). Pro-saint responses then attack the conception of morality (e.g., “true virtue includes wit!”).  
     - **Weak empirical claim**: “Given human psychology, pursuing sainthood *contingently* crowds out non-moral goods.” This shifts the debate to anthropology: are we creatures for whom moral attention intrinsically depletes other capacities?  
     Your “felicitous coincidence” case exposes this rift. For the strong modal claim, it’s irrelevant (if morality *requires* sacrifice, alignment isn’t sainthood). For the weak claim, it’s a counterexample (showing crowding-out isn’t inevitable). **The standoff persists because critics imply the strong claim but retreat to the weak one when pressed, while defenders deny the strong claim but ignore the weak one’s empirical weight.**

  3. **The Concealed Framework Disagreement (Maximizing vs. Virtue)**  
     “Maximal moral goodness” is a **homonym**:  
     - **Maximizing framework** (consequentialist/utilitarian): Saints maximize impartial good. Crowding-out seems likely (e.g., hours spent calculating donations displace piano practice).  
     - **Virtue framework** (e.g., Adams, Annas): Saints embody holistic excellence, where virtues like *phronesis* integrate moral and non-moral goods. Crowding-out appears incoherent (humor *is* virtuous).  
     When critics describe “moral saints” as dour maximizers, and defenders as warm virtuosos, they’re not describing the same entity. This isn’t *purely* verbal—it reflects a **substantive disagreement about morality’s structure**—but it’s obscured by shared terminology.

  ### Why This Is Not Bedrock Intuitions or Pure Verbal Dispute
  - **Against bedrock intuitions**: Both sides share core premises (non-moral goods exist; morality matters). The dispute arises from *derivative* commitments: e.g., whether virtues can be non-integrative (critics) or must be (defenders).  
  - **Against verbal dispute**: The conflict isn’t *just* about “saint” definitions. Even if terms were clarified, disagreements would persist about scope (e.g., “Should we cultivate what we admire?”) and psychology (e.g., “Can attention be non-competitive?”).

  ### What Progress Requires
  The standoff is **substantive but empirically underdetermined**, hinging on unresolved psychological and conceptual questions. Progress demands:

  1. **Disentangle the three scopes explicitly** in arguments. For instance:  
     - *Ideal*: Is the saint admirable?  
     - *Reasons*: Ought we always prioritize moral reasons?  
     - *Self-cultivation*: Ought we to *strive* to be saints?  
     Crucially, **deny that a ‘yes’ to one implies ‘yes’ to others**. One might admire saints (ideal) but reject striving for sainthood (cultivation) due to risk of failure.

  2. **Clarify the conception of morality** at stake. Is “maximal goodness”:  
     - (a) Maximizing impersonal value?  
     - (b) Perfecting agent-relative virtues?  
     - (c) Something else (e.g., relational care)?  
     Arguments must specify their target.

  3. **Empirically test the weak crowding-out claim**. Examples:  
     - Study exemplars (e.g., altruists, monastics, artists) for trade-offs between moral commitment and non-moral flourishing.  
     - Experimental work on attentional resource allocation under moral demands.  
     - Historical analyses: Do cultures emphasizing moral rigor (e.g., Puritanism) show deficits in non-moral goods?  
     The felicitous coincidence case isn’t a distraction—it’s a litmus test. If such lives exist (e.g., a doctor whose passion for medicine aligns with moral good), they challenge the weak claim *and* force defenders to explain why this qualifies as “sainthood.”

  4. **Reformulate the debate around “practicable ideals”**: Instead of asking “Is sainthood desirable?”, ask:  
     - *Under what conditions* could moral excellence coexist with other goods?  
     - *What institutional/personal practices* mitigate crowding-out?  
     This shifts from abstract possibility to dynamic models of agency.

  ### Cost of an Ill-Posed Question
  If the core question (“Is maximal moral goodness desirable?”) remains ill-posed, it perpetuates three costs in the literature:  
  1. **Endless dialectical loops**: Critics and defenders reframe the same points without resolution.  
  2. **Neglect of lived experience**: The debate stays abstract, ignoring how moral demandingness functions in real contexts (e.g., caregiving, activism).  
  3. **Underestimation of empirical psychology**: Moral philosophy remains insulated from cognitive science on willpower, attention, and habituation.

  ### Conclusion
  The standoff is a **tangle of conflated questions, divergent moral frameworks, and unexamined empirical premises**—not a clash of bedrock values. Progress requires: (1) scoping distinctions, (2) framework disambiguation, and (3) empirical engagement. Without this, the debate will remain stalled, as both sides are answering different questions with incompatible assumptions. Your tripartite hypothesis is essentially sound; the complications reinforce it, showing how crowding-out and moral conceptions *exemplify* the deeper conflations. The path forward isn’t to declare a winner but to **reframe the debate around integrationist models of agency**, where moral and non-moral goods coexist dynamically—not as a fixed ideal, but as a practice navigated by finite beings.
