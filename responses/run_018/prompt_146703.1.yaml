prompt: |-
  Construct a one-paragraph thought experiment set in a realistic public institution—such as a museum board or a hospital heritage committee—where an agent must choose between preserving an artifact's original physical form and adapting it for community accessibility, with the two values genuinely incommensurable. Engineer the case so that a theorist who holds hard choices are rationally resolvable through the agent's creation of reasons (a parity view) is forced to treat the decision as arbitrary will, while a theorist who holds that incommensurability yields rational indeterminacy is forced to concede there is a uniquely correct option. The reversal must depend on one structural feature—label it "precedent lock-in"—that does all the work; define it explicitly in the scenario. After presenting the case, walk through what each position says about the agent's decision and why, explain precisely why removing precedent lock-in collapses the scenario back into a standard hard-choice stalemate with no forced verdict, and state how a defender of the parity view would attack the construction. Finish by naming the structural feature in the format \answer{precedent lock-in}.
reasoning: |-
  We are constructing a thought experiment in a public institution. The setting is a municipal archive's preservation committee that must decide the fate of a rare, fragile 19th-century town charter. The charter is currently stored in a controlled environment, accessible only to researchers with special permission. There is a proposal to create a high-fidelity, interactive digital replica that would be freely accessible online and in local libraries, but the digitization process involves a non-invasive scanning technique that nonetheless carries a 0.1% risk of irreversible damage to the document due to its extreme fragility. The values in conflict are: (1) preserving the original physical artifact in its current pristine state for its own sake and for future generations (even if it remains largely inaccessible), and (2) maximizing community access and engagement with the artifact's content and historical significance through digitization (with a very small but real risk to the physical object). The committee has an established precedent: twenty years ago, they faced a similar choice with a less significant artifact (a collection of early 20th-century land deeds) and chose preservation without digitization, citing the principle that "the physical integrity of irreplaceable documents must never be jeopardized for the sake of access." This precedent was reaffirmed in two subsequent cases. The current decision must either uphold this precedent (choosing preservation) or break it (choosing digitization). We label the structural feature "precedent lock-in": the institution has a binding policy that decisions must be consistent with past precedents unless there is a compelling reason to break them, and the burden of proof for breaking precedent falls on the innovator. Moreover, the institution's charter explicitly states that precedents set by the committee are binding for future cases with materially similar facts until officially overruled by a supermajority. Here, the facts are materially similar: an irreplaceable document, a digitization proposal with a small risk of damage, and the same values at stake. The precedent lock-in feature forces the committee to treat the prior decision as controlling unless they can demonstrate that the current case is significantly different. However, the committee cannot find a material difference that would justify breaking the precedent (e.g., the town charter is more historically significant, but the precedent-setting case also involved a significant artifact, and the policy does not allow breaking precedent based on degree of significance alone). Now, we present the case: The Municipal Archive Committee must decide whether to digitize the fragile town charter. Precedent lock-in applies: the prior decision to preserve without digitization in a materially similar case is binding. The two values (preservation and access) are incommensurable: there is no common measure to weigh the intrinsic value of the physical object against the democratic value of access. For the parity theorist (who believes that in hard choices, the agent can create reasons by developing a preference that makes one option better), the precedent lock-in blocks the creation of new reasons. The agent cannot simply create a reason to choose digitization because the precedent binds the current decision. The only way to break precedent is to find a compelling difference, which they cannot. Thus, the parity theorist must say that the decision is determined by the precedent (so they choose preservation) but that this is arbitrary because the precedent itself was set arbitrarily (in the past, when the prior committee faced the same incommensurable choice, they chose preservation arbitrarily, and now that choice locks in). The parity view holds that in the absence of precedent, the agent could create reasons to choose either, making it a true hard choice. But with precedent lock-in, the agent is forced to follow the past arbitrary choice. For the incommensurability theorist (who believes that incommensurable values lead to rational indeterminacy, meaning no option is rationally required and the agent may choose either without irrationality), the precedent lock-in changes the situation. The incommensurability theorist would normally say that without precedent, either choice is rationally permissible. But with precedent lock-in, breaking precedent without a compelling reason would be irrational because it violates the institutional rules and the duty to respect the system of precedent (which is a procedural value). Thus, the incommensurability theorist must concede that there is a uniquely correct option: following the precedent (preservation) is rationally required, and breaking it would be irrational. Without precedent lock-in, the scenario collapses into a standard hard-choice stalemate: the committee faces an incommensurable choice between two values. The parity theorist would say the agent can create reasons to choose either, and the incommensurability theorist would say neither choice is rationally required. Removing the binding precedent and the lock-in feature (i.e., the policy that requires adherence and the burden of proof for breaking precedent) would leave the committee free to decide without institutional constraints. Then, both theories would return to their standard positions: no forced verdict. A defender of the parity view would attack the construction by arguing that the precedent lock-in does not actually remove the hard choice. They would say that the agent in the present committee still faces a hard choice about whether to follow the precedent or not. The parity view holds that the agent can create reasons for either option (to follow or break precedent) because the values of institutional consistency versus the value of improved access in this specific case are themselves incommensurable. Thus, the parity view would argue that the precedent only shifts the hard choice to a different level (whether to adhere to the precedent or not) and does not eliminate it. Therefore, the agent can create reasons to break the precedent (by emphasizing the unique importance of this document and the low risk) or to follow it (by emphasizing stability and the rule of law). However, note that in our construction, the precedent lock-in is designed to be so strict that breaking precedent without a material difference is not allowed by the institutional rules. The parity view defender might counter that the agent can create a reason by reinterpreting the material facts (e.g., arguing that the town charter is materially different because it is the founding document) and thus break precedent without violating the rule. But we have stipulated that the policy does not allow breaking precedent based on degree of significance. Therefore, the parity view must accept that the precedent binds and the decision is forced, but it is arbitrary at the root. Finally, we name the structural feature: \answer{precedent lock-in}
answer: |-
  ### Thought Experiment: The Municipal Archive Committee's Dilemma
  The Municipal Archive Committee, responsible for preserving the city's historical documents, faces a decision regarding an 1850 founding charter—a fragile, hand-scribed parchment that is culturally sacred but too delicate for public handling. Digitizing it via non-invasive spectral imaging would allow interactive public access in schools and online, democratizing its historical significance; however, the procedure has a 0.1% risk of irreversible light damage, threatening the artifact’s physical integrity. The values—preserving original material authenticity versus ensuring equitable community access—are incommensurable: no common metric exists to rank them. Crucially, **precedent lock-in** applies: a binding institutional policy mandates that all decisions must align with past precedents unless a "materially distinct justification" is proven, and the burden of proof lies with deviators. Twenty years prior, the committee identically chose preservation over digitization for a comparable 19th-century land deed, citing "inviolable physical preservation" as the governing principle. This precedent was reaffirmed twice, creating an institutional norm. Here, no materially distinct justification exists (e.g., identical risk levels and values), so breaking precedent would violate policy without grounds.

  ### Analysis of Theoretical Positions
  1. **Parity Theorist (Hard Choices Resolvable via Created Reasons)**:  
     This view holds that agents resolve incommensurable choices by creating new reasons (e.g., through commitment), rendering one option better. However, precedent lock-in blocks reason creation. The agent cannot freely "create" a preference for digitization because institutional rules force adherence to the preservation precedent—deviation is procedurally irrational. The decision thus reduces to arbitrary compliance with the past choice, as the original precedent was set arbitrarily when values were incommensurable. The theorist must conclude the agent *must* choose preservation, but only due to the "arbitrary will" of the prior committee, not reasoned judgment.  
     
  2. **Incommensurability Theorist (Rational Indeterminacy)**:  
     Typically, this view claims neither option is rationally superior in incommensurable cases, allowing either choice. Yet precedent lock-in introduces a procedural duty: violating precedent without justification breaches institutional integrity, making it uniquely irrational. Since no "materially distinct justification" exists, breaking precedent (digitization) becomes procedurally impermissible. Thus, the theorist must concede preservation is the *uniquely correct* option—not due to value comparison, but because procedural rationality demands adherence to precedent when no exception applies.

  ### Why Removing Precedent Lock-In Causes Stalemate  
  If precedent lock-in is removed (e.g., no binding policy or burden of proof), the dilemma reverts to a standard hard-choice stalemate. Both values remain incommensurable, with no procedural duty to tip the balance. The parity theorist would allow the agent to create reasons freely (e.g., "I prioritize access, so digitization is better"), resolving indeterminacy. The incommensurability theorist would insist neither choice is rationally mandated, permitting either option. Without lock-in, neither theory forces a verdict—both revert to their default positions (resolvability vs. indeterminacy).

  ### Parity Theorist's Counterargument  
  A defender of the parity view would attack the construction by arguing that precedent lock-in merely *shifts* the hard choice rather than eliminating it. The agent still faces an incommensurable choice between two higher-order options: (1) uphold precedent (valuing institutional consistency) or (2) break precedent (valuing adaptive responsiveness). The agent can "create reasons" for either—e.g., by emphasizing the current artifact's unique symbolism to justify digitization, thus satisfying the "materially distinct" burden. Precedent lock-in, they contend, cannot extinguish reason creation; it only recontextualizes it within a new, equally hard choice about procedural fidelity versus substantive values. Thus, the scenario fails to force an arbitrary verdict, as the agent retains rational agency over whether to honor precedent.

  \answer{precedent lock-in}
