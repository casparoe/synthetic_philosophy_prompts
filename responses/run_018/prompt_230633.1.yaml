prompt: |-
  I'm a retired spectroscopist — spent most of my life on noise reduction and calibration curves — and I've only been reading political philosophy for a couple years, so go easy on me if I mangle the jargon. My neighbor teaches international relations and we argue about military intervention constantly. He's frustratingly consistant, but I can't work out the rule he's actually applying, and I'd like to predict him on a new case before I bring it up.

  His track record, as I can reconstruct it:

  Kosovo in 1999: he says justified. No Security Council authorization, since Russia would have vetoed, but it was NATO-led, the ethnic cleansing was already underway, and there was no plausible economic motive — just stopping a massacre and a refugee flood.

  Iraq in 2003: not justified. The WMD case collapsed, there was no ongoing mass atrocity at the time, the coalition was small, and the post-invasion planning was so bad you couldn't honestly call the war humanitarian even in hindsight.

  Libya in 2011: this is where he gets interesting. He thinks the early civilian-protection part was justified — Benghazi was about to be attacked, and there was Security Council support and Arab League backing. But he says the operation then slid into regime change and the country was left worse off. So his verdict on the intervention as actually run is that it was not justified, even though the narrow no-fly zone at the start would have been on its own.

  Now the new case I want to spring on him. Next year, in a coastal West African country, a ruler has already carried out attacks on one ethnic group and there is solid intelligence he's about to assault the main city his opponents control — call it eight hundred thousand people. The African Union requests outside air support for a no-fly zone and safe areas, and says the deal is off if it turns into regime change. The Security Council is deadlocked because one permanent member will veto anything. A coalition offers to run the no-fly zone and promises not to target the ruler. But a few coalition members hold mineral concessions in the country, which makes the promise shaky. Analysts put the odds of protecting the civilians at 70 percent, the odds of getting dragged into a wider war at 40 percent, and post-war stability at about 50/50.

  If he's applying the same thing he applied to those three cases, what does he say about this one? Give me your best prediction, the candidate rules that each fit his record, and say which earlier case is actually doing the most work in your answer. Then give me one further case — real or invented — that would cleanly seperate those rules, because I'd rather know what's doing the work before I start the argument.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired spectroscopist with deep expertise in data analysis but relatively new to political philosophy, trying to decode his IR-professor neighbor's consistent pattern on military intervention cases. 

  First, I need to extract the neighbor's core principles from the three historical cases provided (Kosovo '99, Iraq '03, Libya '11). The pattern recognition aspect here reminds me of calibrating instruments - we're looking for the underlying algorithm generating these outputs. 

  For Kosovo: neighbor approved despite no UNSC authorization because of (a) imminent mass atrocity (ethnic cleansing underway), (b) NATO leadership (multilateral), (c) no economic motive. This suggests humanitarian intent weighs heavily.

  For Iraq: disapproval centers on (a) false WMD pretext (no imminent threat), (b) poor coalition legitimacy ("small coalition"), (c) disastrous aftermath proving non-humanitarian intent. The absence of ongoing atrocity is key here.

  Libya is the most diagnostic case: neighbor bifurcates the intervention - approves the initial UNSC-backed no-fly zone to prevent Benghazi massacre (satisfying imminent threat + multilateralism), but condemns the mission creep into regime change that worsened outcomes. This reveals two crucial variables: (1) strict adherence to declared limited objectives, and (2) reasonable probability of success.

  Now applying this to the West Africa hypothetical: 
  - PRO: Imminent massacre (800k lives), AU request (regional legitimacy), limited declared objective (no regime change)
  - CON: UNSC deadlock (no Chapter VII mandate), some coalition members' mineral interests casting doubt on purity of intent, suboptimal probability estimates (70% protection chance, 40% escalation risk)

  The mineral concessions are critical - they echo Iraq's credibility problem but aren't as damning as Iraq's false WMD claims. The 40% escalation risk likely triggers neighbor's Libya-triggered aversion to mission creep. 

  I predict disapproval because:
  1) The vetoed UNSC situation resembles Kosovo but lacks Kosovo's "clean" lack of economic motives
  2) The mineral interests create Iraq-like credibility issues 
  3) The 40% escalation probability raises Libya-style blowback concerns

  The strongest diagnostic test case would be: UN-authorized intervention against imminent genocide with perfect multilateralism (e.g., African-led, full UNSC backing), but where interveners have minor economic interests. If neighbor still approves, we know economic motives are secondary; if disapproves, they're primary. 

  This mirrors spectroscopy calibration - we're holding all variables constant except one to isolate its spectral line in the decision matrix.
answer: |-
  Based on your neighbor's pattern across Kosovo, Iraq, and Libya, I predict he would **oppose the West African intervention** you've described. Here's the breakdown:

  ### Key Rules Explaining His Position
  1.  **Humanitarian Imperative + Imminence:** Mass atrocity must be *ongoing or imminent* (Kosovo ethnic cleansing underway, Benghazi about to be attacked). Iraq lacked this.
  2.  **Legitimacy & Multilateralism:** Broad international support is crucial. NATO (Kosovo), UNSC+Arab League (Libya initial phase) provided this. Iraq's "coalition of the willing” lacked it.
  3.  **Primacy of Humanitarian Intent:** The *primary* motive must be civilian protection, with no *significant* ulterior motives (economic, strategic). Kosovo's "no plausible economic motive" was key. Iraq's WMD pretext and Libya's slide to regime change violated this. Economic interests *undermine* legitimacy.
  4.  **Limited Means & Objectives:** The intervention must be strictly limited to civilian protection, avoiding regime change unless it's an *incidental* result of protection (he opposed Libya's slide into regime change). Objectives must be achievable without excessive harm.
  5.  **Reasonable Probability of Success/Non-Harm:** The intervention should have a credible chance of improving the situation without making things worse. Iraq's disastrous aftermath and Libya's post-Gaddafi chaos failed this. Poor planning matters.

  ### Applying the Rules to the West African Case
  *   **Pro (Fits Kosovo/Libya Initial):** Imminent massacre (✓), Regional request (AU ≈ Arab League ✓), Limited declared objective (no regime change ✓), Multilateral coalition (✓).
  *   **Con (Fits Iraq/Libya Outcome):** No UNSC authorization (✗ - like Kosovo, but Kosovo lacked credible alternative legitimacy path; AU is strong but may not fully offset veto), **Significant economic interests among coalition members (✗✗ - This is a major red flag, violating "Primacy of Humanitarian Intent" like Iraq's WMD pretext/strategic aims).** Shaky promise not to target ruler (✗ - Raises "Limited Means" concerns like Libya's slide). **40% escalation risk & 50/50 stability chance (✗✗ - Fails "Reasonable Probability of Success/Non-Harm" like Iraq/Libya aftermath).**

  **Prediction: NOT JUSTIFIED.** The economic interests fatally taint the humanitarian intent in his framework, mirroring his core objection to Iraq. The lack of UNSC authorization *combined* with this ulterior motive is worse than Kosovo's "clean" lack of authorization. The high escalation risk and uncertain stability echo Libya's negative outcome and Iraq's planning failure, making the intervention too risky and likely harmful.

  ### The Most Influential Case: **Iraq (2003)**
  Iraq is doing the heaviest lifting here. His absolute rejection hinges on the violation of "Primacy of Humanitarian Intent." The mineral concessions in the West Africa case directly evoke Iraq's problematic motives (WMD pretext, strategic/oil interests). Even without a false pretext *per se*, significant economic interests embedded in the coalition undermine the credibility of the purely humanitarian claim for him, just as Iraq's motives undermined any retrospective humanitarian justification. Kosovo's lack of economic motive was crucial for its approval despite no UNSC vote.

  ### Diagnostic Test Case to Separate Rules
  **Scenario:** A brutal dictator in a resource-poor, strategically irrelevant country is actively conducting genocide against an ethnic minority (confirmed, undeniable). The UNSC is deadlocked (veto threatened). A broad regional organization (e.g., ASEAN) *unanimously* requests military intervention *strictly* for civilian protection/no-fly zones. A coalition led by neutral Nordic countries with *zero* economic/strategic interests in the country offers to intervene. Credible military planners estimate 85% chance of stopping the genocide quickly with minimal escalation risk, and 75% chance of stable post-conflict governance managed by the regional body.

  *   **Rule Focused on Intent/Legitimacy:** Likely **APPROVES** (Imminent atrocity ✓, Regional legitimacy ✓, Pure humanitarian intent ✓, High success probability ✓). The lack of UNSC is overridden by pure intent + regional request + high success, like Kosovo *plus* cleaner motives.
  *   **Rule Focused on UNSC Legality/Stability:** Might **OPPOSE** (No UNSC Chapter VII mandate ✗, Non-zero failure risk ✗). This view prioritizes strict international law and the inherent risks of intervention absent the highest authority.

  **Which rule fits your neighbor?** Based on Kosovo (approved without UNSC due to pure intent/imminence) and Libya initial (approved *with* UNSC but regional backing key), he would **APPROVE** this intervention. His pattern shows UNSC authorization is *desired* but not *absolutely necessary* if other legitimacy sources (regional, pure intent, high imminence) are strong and ulterior motives are absent. Iraq and the mineral concessions in your West Africa case show his rejection is triggered primarily by tainted intent and poor prospects, not *solely* by the lack of a UNSC vote.

  **Before you argue:** Focus your West Africa case discussion on the **mineral concessions**. If he dismisses them as irrelevant if the mission stays limited, his primary rule is "Limited Means." If he sees them as fatal to legitimacy (like Iraq), his primary rule is "Primacy of Humanitarian Intent." Libya's slide shows both matter, but Iraq's motives were his core objection. Good luck!
