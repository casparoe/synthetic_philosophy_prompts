answer: |-
  **Research Proposal: The Motor-Invariant Basis of Letterform Identity**  
  **Principal Investigator:** [Your Name/Title]  
  **Duration:** Six Months  
  **Date:** [Current Date]  

  ---

  ### 1. Research Question  
  Can the identity of a letter (e.g., *a*) be grounded in *membership within a constrained space of motor-dynamic possibilities*—such that two glyphs are categorically equivalent if and only if they can be generated by continuous parametric adjustments (e.g., stroke velocity, curvature modulation, pressure gradients, sequencing stability) of a shared underlying motor program—even when their static geometric forms share negligible overlap?  

  ---

  ### 2. Gap in Existing Accounts  
  Existing frameworks fail to resolve persistent boundary cases in letter recognition:  

  - **Geometric/Topological Invariant Accounts** posit that *a*-ness resides in fixed shape properties (e.g., closure topology, axis orientation). These fail when highly distorted handwritten tokens (e.g., a rushed cursive *a* resembling a looped *u*) retain categorical identity despite violating geometric invariants. Conversely, they over-accept shapes geometrically proximate to a canonical *a* (e.g., a mirrored *ɐ*) that are rejected as non-*a* by human readers.  

  - **Prototype/Psychological Accounts** hold that recognition depends on matching against an ideal mental template. These fail to explain why some geometrically distant forms (e.g., a brushstroke *a* with exaggerated serifs) are effortlessly recognized, while others closer to the prototype (e.g., an *a* with a minimally displaced crossbar) are misread as *o* or *d*. Prototype accounts cannot systematically distinguish *acceptable distortion* from *category violation* without circular appeal to prior recognition.  

  Both accounts treat letterforms as static *perceptual objects*, neglecting the role of *generative action* in defining categorical boundaries.  

  ---

  ### 3. Method: Conceptual Analysis & Formalization  
  A six-month philosophical investigation structured as follows:  

  - **Month 1:** Formalize the *motor-parameter space*. Define minimal dimensions for handwriting dynamics:  
    - *Kinematic*: Stroke-order constraints, velocity/pressure continuity.  
    - *Morphodynamic*: Permissible curvature transformations (e.g., affine shearing vs. topological puncture).  
    - *Sequential*: Tolerance for stroke fusion/fission (e.g., single-stroke vs. two-stroke *a*).  

  - **Month 2:** Define *permissible transformations*. Establish constraints preserving *a*-ness under motor-parametric deformation:  
    - Path-connectedness: Glyphs A→B are equivalent if linked by a continuous path in motor-parameter space.  
    - Boundary conditions: Identify irreversible transitions (e.g., stroke-order inversion) that break identity.  

  - **Month 3:** Construct a *taxonomy of distortions*. Classify real-world variations (e.g., italic vs. blackletter *a*) as:  
    - *Style-preserving*: Within dynamic constraints (e.g., slant modulation).  
    - *Category-breaking*: Violating motor logic (e.g., adding non-sequential elements).  

  - **Month 4:** Test against *cross-script recognition phenomena*. Analyze why humans accept diverse Latin/Greek/Cyrillic *a*-forms (α, а) as distinct letters yet reject motor-alien hybrids (e.g., an *a* with reversed stroke order).  

  - **Month 5:** Resolve *over/under-generation failures*. Model why:  
    - A geometrically aberrant child’s scribble is recognized as *a* (its dynamics preserve program structure).  
    - A geometrically faithful but motor-violating glyph (e.g., drawn backward) is rejected.  

  - **Month 6:** Draft manuscript synthesizing the motor-invariant framework.  

  *(References to historical and contemporary sources will be appended separately.)*  

  ---

  ### 4. Success & Failure Conditions  
  - **Success:** A principled criterion distinguishing *valid-but-distorted* *a* from *non-a* based solely on generative dynamics, resolving ≥80% of boundary cases mishandled by geometric/prototype accounts.  
  - **Failure:**  
    - *Collapse into geometry*: If permissible dynamics reduce to shape correlations.  
    - *Conflation with style*: If the framework cannot separate identity-defining dynamics from arbitrary scribal conventions (e.g., serif inclusion).  
    - *Overgeneration*: If the model accepts all motor-plausible glyphs (e.g., misclassifying *d* as *a* under speed distortion).  

  ---

  ### 5. Scope Assessment  
  Six months is feasible because the project:  
  - Focuses narrowly on Latin *a* as a tractable case study.  
  - Avoids empirical data collection, relying on conceptual analysis of documented typographic/handwritten variations.  
  - Defers neuro-motor implementation (e.g., fMRI of scribes) and full-alphabet generalization to future work.  

  **Key Risk of Scope Creep:**  
  - Attempting to formalize dynamics for all 26 letters prematurely.  
  - Drifting into perceptual psychology (e.g., reaction-time studies).  
  - Over-extending to non-human scripts (e.g., abjads) before validating core logic.  
  Mitigation: Strict adherence to the *a*-centric methodology.  

  ---

  **Summary:** This project delivers a motor-dynamic framework for letterform identity that resolves critical failures of geometric and prototype accounts.
