prompt: |-
  You are a philosopher of mind and cognitive scientist with expertise in conceptual categorization, formal aesthetics, and the philosophy of perception. Before writing, take a moment to brainstorm: list the key conceptual distinctions you will need (static geometric invariant vs. psychological prototype vs. production-dynamic constraint), identify one boundary case where geometric and prototype accounts conflict, and sketch what a “failure condition” for the project would look like. Then produce the deliverable.

  Write a polished, two-page research proposal suitable for a six-month independent-study grant. The topic is a precise conceptual question arising from the problem of letterform identity—what makes every token of the letter “a” an “a” despite extreme variation in script, distortion, and style.

  Frame the proposal around a specific, non-standard angle: the standard debate splits between geometric/topological invariant accounts (letter identity is a shape property) and prototype/psychological accounts (we match against a mental template). Your proposal should investigate a third framing—whether “a”-ness is constituted not by static form but by membership in a constrained space of permissible production dynamics. Specifically, ask whether two glyphs are both “a”s if they can be generated by the same underlying motor program with continuous parameter adjustments (speed, curvature, pen pressure, stroke order), even when the resulting static shapes share almost no geometric overlap. The open, tractable question is whether this “motor-invariant” framing can explain recognized over-generation and under-generation failures in the other two accounts—why some highly distorted handwritten forms are still read as “a” (they preserve dynamics) while other shapes geometrically closer to a canonical “a” are rejected (they violate the dynamics).

  The proposal must contain:
  1. A precise statement of the research question, formulated so that it admits a determinate answer.
  2. Why existing geometric and prototype positions leave this question open, with explicit reference to the boundary cases each mishandles (without inventing empirical studies; describe the logical structure of the failure).
  3. The method: a conceptual/philosophical analysis, not an empirical lab study. Give a realistic month-by-month plan for what you would actually do (e.g., formalizing the parameter space, defining permissible vs. impermissible transformations, constructing a taxonomy of “style-preserving” versus “category-breaking” distortions, and testing internal consistency against familiar cross-script recognition phenomena). Do not request a bibliography, reading list, or citations; state that references will be added separately.
  4. What success looks like (e.g., a principled distinction between “distorted but valid ‘a’” and “not an ‘a’” grounded in production dynamics) and what failure looks like (e.g., if the parameter space collapses back into pure geometry, or if it cannot distinguish letter identity from arbitrary stylistic convention).
  5. An honest scope assessment: why six months is enough for this conceptual framing, and exactly where the project risks growing too large (e.g., extending to full alphabet generalization or to neuro-motor implementation).

  Keep the writing formal and self-contained, assuming no web access is available to the reader. Avoid quotation marks around any real text; paraphrase without quotes if needed. Do not depend on precise publication dates or obscure attributions.

  Conclude with a single line that summarizes the core deliverable of the proposal.

  End your response with one line beginning “Summary:” followed by a one-sentence summary of the proposal’s central deliverable.
