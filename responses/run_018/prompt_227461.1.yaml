answer: |-
  *(Leans forward, eyes sharp but not unkind)*  
  You’re right that we didn’t purchase the streets or the zoning rights. But that’s precisely my point: a neighborhood isn’t a commodity; it’s a *commons* built through living, not transactions. Your country club analogy fails because clubs are *designed* as exclusive enclaves. Their walls are literal. A neighborhood’s boundaries are porous—its value comes from organic accretion, not bylaws.  

  When my neighbors and I rebuilt the park with our own hands after the storm, volunteered at the school library, or organized block watches that cut crime by 40%—we weren’t buying exclusion. We were investing in a shared habitat. That habitat has a carrying capacity. Doubling density doesn’t just add bodies; it shreds the social fabric that lets Mrs. Garcia walk safely at 10 PM because the corner grocer knows her, or lets lost kids get escorted home by a dozen watchful eyes.  

  You call exclusion "unearned." I call it the necessary condition for depth. Trust networks aren’t software—you can’t scale them exponentially without collapse. Yes, newcomers deserve homes. But demanding we dismantle the very infrastructure of community to house them? That’s like insisting a coral reef rearrange itself for more fish. Some things can’t be replaced—they can only be destroyed.  

  *(Holds up a hand)*  
  Don’t mistake me: I’ve voted for accessory units and gentle density near transit. But tower blocks? Rezoning historic alleys for luxury condos? That’s not growth—it’s erasure. The people who *made* this place resilient get treated as obstacles. Why is their claim—forged in decades of unpaid labor—less valid than a developer’s spreadsheet or a newcomer’s desire for a short commute?  

  Your turn.  

