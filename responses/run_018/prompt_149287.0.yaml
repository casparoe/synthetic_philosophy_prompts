prompt: |-
  I'm working on this little chapbok of philosophical poems—sort of a break from my novel draft, which is going nowhere fast—and I need one about Dewey's experimentalism. Not the textbook version where democracy is just people voting, but the weirder idea that democracy is continuous social inquiry, like a laboratory where the whole community runs the experiment and nobody gets to opt out of the results. I want a villanelle, 19 lines exactly, with two refrains that keep circling back: let's make them "the failure belongs to the town" and "we try the world again." The structural trick is that the rhyme words should shift their meaning each time they return, mirroring how Dewey thinks a failed policy isnt dead but becomes data that revises the next attempt. Write it in the voice of an old organizer talking to neighbors after some irrigation scheme collapsed—no sermon, no happy ending, just the form doing the philosophical work. Here's my niche twist: inject the idea that in true democratic inquiry, the people who proposed the bad rule dont carry the blame alone; the mistake gets distributed across everyone as shared knowledge that changes the community's habits. So the poem should feel like an inquiry that refuses to close, with the villanelle's circular return enacting that loop. Make it accurate enough that a Dewey scholar wouldn't wince, but keep the language rough and spoken. Please end with one final line that starts with "Summary:" and gives the poem's bottom line in a single sentence.
