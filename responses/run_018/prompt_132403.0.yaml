answer: |-
  The conceptual parallel between Newton's theological and natural-philosophical positions lies in a consistent **metaphysical commitment to causal mediation and hierarchical subordination**, rooted in the principle that **ontologically distinct entities cannot share unmediated causal agency without compromising the supremacy of a primary cause**. This manifests in two domains:

  ### 1. **Theological Rejection of Consubstantiality**
     - **Core Argument**: Newton denied the Trinity’s consubstantiality (Father/Son as co-equal, co-eternal) on grounds that it violated divine *monarchy*—the Father’s absolute, unmediated dominion. If the Son were fully co-substantial, this would imply:
       - Two autonomous divine wills, undermining the Father’s sovereignty.
       - An unmediated ontological equivalence, erasing the causal hierarchy essential to Newton’s unitarianism.
     - **Resolution**: Newton’s Arianism preserved hierarchy: the Son is *homoiousios* (like substance) but subordinate, deriving existence and authority *from* the Father. The Father’s will acts *through* the Son, not identically *as* the Son.

  ### 2. **Natural-Philosophical Rejection of Autonomous Gravitational Power**
     - **Core Argument**: Newton rejected gravity as an inherent property of matter because:
       - Matter, being passive and inert (*vis inertiae*), cannot possess self-acting causal powers (e.g., attracting distant bodies).
       - Unmediated action-at-a-distance implies a brute causal relation between ontologically distinct bodies, violating mechanistic principles of contact action.
     - **Resolution**: Gravity requires mediation. In *Opticks* (Query 28/31), Newton speculates about an "ethereal spirit" or God’s direct intervention. Crucially, he frames absolute space as God’s "sensorium"—the medium through which divine will sustains motion and gravitational order.

  ### **Shared Metaphysical Logic**
  Both positions stem from a unified framework:
  - **Causal Mediation Axiom**: No secondary entity (Son or material body) can exercise autonomous, unmediated causal power.  
    - *Theology*: The Son’s power is delegated by the Father.  
    - *Physics*: Gravitational effects are imposed externally (via God/ether).  
  - **Hierarchical Ontology**: A supreme causal agent (Father/God) must retain direct dominion over creation.  
    - Granting autonomy to subordinate entities (Son/matter) would fragment sovereignty, leading to metaphysical disorder.  
  - **Rejection of Identical Essence/Immanence**:  
    - Consubstantiality erases Father-Son distinction, collapsing divine hierarchy.  
    - Inherent gravitational power implies matter self-governs, negating God’s continuous role in nature ("dominion not dominion" if God must "wind the clock").  

  ### **Counterargument: Independent Grounds?**
  While theological and physical arguments could stand alone, Newton’s texts reveal integration:  
  - **Theology informs physics**: In the *General Scholium*, Newton explicitly ties God’s dominion over space to the need for active principles in physics. Gravity’s mediation becomes proof of divine immanence.  
  - **Physics reflects theology**: Just as the Son’s subordination preserves divine unity, rejecting matter’s self-sufficiency preserves God’s role as *causa ultima*.  

  ### **Conclusion**
  Newton’s dual rejections—of Trinitarian consubstantiality and autonomous gravitational power—are united by a **single metaphysical commitment: the impossibility of unmediated causal relations between ontologically distinct entities without compromising the supremacy of a primary cause**. The Father’s direct will (theology) and God’s dominion via space (physics) enforce a causal hierarchy where all secondary agency derives from, and is mediated by, the supreme sovereign. This framework is less about biographical belief and more about a coherent structure of causation, dominion, and ontological subordination that permeates Newton’s work.
