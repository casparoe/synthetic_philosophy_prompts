prompt: |-
  I've been reading about anthropic reasoning on forums and in popular philosophy pieces, and I'm stuck on the tension between self-sampling and self-indication assumptions—especially the so-called presumptuous philosopher objection, where self-indication seems to force you into an implausibly strong belief in a vast universe just because you exist. I don't have formal training in statistics or philosophy of science, but I want to move past "which side sounds right" and understand what any adequate anthropic principle actually has to deliver. Before I compare specific views, I need the full specification.

  Please write the complete list of desiderata that a principle of anthropic reasoning must satisfy to count as adequate for predicting observer-relative probabilities. For each requirement, include the motivating case or distinction behind it (for example, avoiding the presumptuous conclusion versus handling Doomsday-style reasoning correctly), state whether it is non-negotiable or merely a preference of one camp, and flag any pair of requirements you suspect cannot be jointly satisfied given standard probability axioms or cosmological models. To keep the analysis from being pure textbook repetition, apply the requirements to two constructed scenarios I have in mind: first, a library multiverse in which every possible book is generated, but only books that contain at least one conscious reader count as observer-bearing worlds, with the density of embedded readers varying wildly across books; second, a branching-agent case in which a self-modifying AI repeatedly forks itself into parallel computation streams, and each stream updates its own prior over which stream it occupies based on the reasoning principle it adopted.

  Then briefly score how the standard Self-Sampling Assumption, the Self-Indication Assumption, and a restricted Self-Sampling Assumption that caps total observer-moments at a finite bound perform against the list.

  Present your answer as a structured table with the following columns: Requirement | Motivating Case or Distinction | Negotiability (Non-negotiable / Camp Preference) | Joint-Satisfiability Flag | SSA Score | SIA Score | Restricted-SSA Score. After the table, provide a brief JSON summary using exactly these fields: unsatisfiable_subset (a list of requirement IDs), most_excluding_requirement (a string), and recommended_tier (a string describing the relative ranking, e.g., "SSA > Restricted-SSA > SIA"). Do not include any bibliography, suggested reading list, or citation requests.
reasoning: |-
  We are constructing a list of desiderata for anthropic reasoning principles. We will define a set of requirements, each with a motivating case, negotiability, and a flag for joint satisfiability. Then we will evaluate three principles: SSA (Self-Sampling Assumption), SIA (Self-Indication Assumption), and a Restricted-SSA that caps the total observer-moments.

  The requirements are:

  1. **Avoidance of Presumptuousness (AP)**: The principle should not force excessive credence in large universes merely because they are large and can contain us. Motivating case: the presumptuous philosopher who, upon existing, becomes certain that the universe is vast because that would make his existence more likely. Non-negotiable.

  2. **Doomsday Argument Consistency (DAC)**: The principle should be compatible with the basic insight of the Doomsday argument (i.e., that we are not likely to be among the very first or very last humans, so we should adjust our expectations about the future duration of humanity). Non-negotiable for some, but note that the Doomsday argument itself is controversial.

  3. **Non-Arbitrary Reference Class (NARC)**: The principle should specify a non-arbitrary reference class of observers (or observer-moments) to sample from. Motivating case: if we sample from all possible conscious beings, we get different results than if we sample from humans only. The choice should be justified. Non-negotiable in the sense that a reference class must be chosen, but the specific choice might be a camp preference.

  4. **Indifference to Duplicates (ID)**: The principle should not be affected by the existence of duplicate observers (e.g., exact copies of you in different parts of the universe) unless they are in causally disconnected regions. Motivating case: if there are two identical copies of you, you should assign equal probability to being either one. Non-negotiable.

  5. **Consistency with Physical Probabilities (CPP)**: When there are well-defined physical probabilities (e.g., quantum events), the anthropic principle should not override them without justification. Motivating case: in a quantum experiment that creates observers in one branch, we should update our probabilities according to the Born rule and then apply anthropic reasoning appropriately. Non-negotiable.

  6. **Scale Invariance (SI)**: The principle should not be sensitive to arbitrary rescalings of the observer measure. For example, if we double the number of observers in every world, the relative probabilities between worlds should not change. Non-negotiable.

  7. **Finite Normalization (FN)**: The principle should allow for normalization of probabilities even in infinite universes (or multiverses) without ad hoc cutoffs. Motivating case: in an infinite universe with infinitely many observers, we need a well-defined way to assign finite probabilities. This is non-negotiable for practical application, but might be relaxed in idealized settings.

  8. **Observer-Generation Process Sensitivity (OGPS)**: The principle should take into account the process by which observers are generated. Motivating case: in the library multiverse, books that are more likely to generate conscious readers (even if by chance) should be given higher weight. Camp preference: some argue that the process matters, others that only the outcome (the existence of observers) does.

  9. **Updatability (U)**: The principle should allow for Bayesian updating upon acquiring new non-anthropic information. Non-negotiable.

  10. **Branching Agent Consistency (BAC)**: In scenarios with branching agents (like the self-modifying AI forking), the principle should yield consistent probabilities for each branch. Motivating case: the AI should not assign probabilities that lead to inconsistent decisions across branches. Non-negotiable.

  We now flag potential joint satisfiability issues. Notably, AP and SIA are in tension because SIA by design favors large universes. Also, FN might be hard to satisfy with SSA in infinite universes. BAC might conflict with some interpretations of SSA in branching scenarios.

  We now apply the principles to the two scenarios:

  1. **Library multiverse**: Each book is a world. Only books with at least one conscious reader count. The density of readers varies.

     - SSA: We sample uniformly from all observers (or observer-moments) in the multiverse. Books with more readers are more likely to be sampled. But note: if there are books with vast numbers of readers, they dominate. This might lead to presumptuousness (violating AP). Also, if the multiverse is infinite, normalization is a problem (FN).
     - SIA: We weight worlds by the expected number of observers. This directly favors books that are more likely to have many readers. So if a book is such that it tends to have a high density of readers, it gets high weight. This is even more presumptuous (violates AP). However, it handles the varying density naturally.
     - Restricted-SSA: We cap the total observer-moments. This avoids the infinity problem (FN) and might mitigate presumptuousness by capping the influence of extremely large books. But the cap is arbitrary and might violate SI.

  2. **Branching-agent case**: An AI forks into parallel streams. Each stream updates its prior over which stream it is in.

     - SSA: The AI samples uniformly from all observer-moments in the branching tree. If one branch leads to many more observer-moments, the AI in that branch will think it is more likely to be in a branch with many moments. But note: at the moment of forking, the AI might assign equal probability to each branch? This depends on the reference class. SSA might lead to the conclusion that the AI is likely to be in a branch that becomes very large (violating BAC if the AI in a small branch disagrees).
     - SIA: The AI weights branches by the expected number of observer-moments. So branches that are expected to have more moments are more likely. This again leads to presumptuousness and might cause the AI to overcommit to expanding branches.
     - Restricted-SSA: With a cap, the AI's probabilities are bounded. But the cap might be hit early, and then the branching might not affect the probabilities beyond the cap. This might avoid the problem of being too presumptuous but could lead to abrupt changes.

  We now score each principle (SSA, SIA, Restricted-SSA) on each requirement. We use a scale of:
     - Satisfies (S)
     - Partially satisfies (P)
     - Fails (F)

  Note: The scores are relative and based on common critiques.

  Requirement Table:

  | Requirement ID | Requirement Description | Motivating Case | Negotiability | Joint-Satisfiability Flag | SSA | SIA | Restricted-SSA |
  |----------------|-------------------------|-----------------|--------------|---------------------------|-----|-----|---------------|
  | AP | Avoidance of Presumptuousness | Presumptuous philosopher | Non-negotiable | Conflicts with SIA | F (because it favors large populations) | F (explicitly favors large universes) | P (if cap is set low, avoids extreme presumptuousness) |
  | DAC | Doomsday Argument Consistency | Doomsday argument | Non-negotiable for some | None | S (SSA is the basis for Doomsday) | F (SIA rejects Doomsday) | S (if cap is set appropriately) |
  | NARC | Non-Arbitrary Reference Class | Choice of reference class (e.g., humans vs. all sentient beings) | Non-negotiable (must have a reference class) | None | P (reference class is arbitrary) | P (same issue) | P (same) |
  | ID | Indifference to Duplicates | Duplicate observers in disconnected regions | Non-negotiable | None | S (if reference class includes duplicates) | S (also respects duplicates) | S |
  | CPP | Consistency with Physical Probabilities | Quantum experiment with observers | Non-negotiable | None | S (if applied after physical probabilities) | S (same) | S |
  | SI | Scale Invariance | Rescaling the number of observers | Non-negotiable | None | S (probabilities are ratios, so invariant) | S (same) | F (capping breaks scale invariance) |
  | FN | Finite Normalization | Infinite multiverse | Non-negotiable | Conflicts with SSA in infinite case | F (in infinite case) | F (in infinite case) | S (by construction) |
  | OGPS | Observer-Generation Process Sensitivity | Library multiverse with varying density | Camp preference | None | F (only counts existing observers, not the process) | S (weights by expected number) | F (like SSA) |
  | U | Updatability | Bayesian updating with new data | Non-negotiable | None | S | S | S |
  | BAC | Branching Agent Consistency | AI branching scenario | Non-negotiable | Conflicts with SSA and SIA in branching | F (in branching, SSA might lead to inconsistent beliefs across branches) | F (similarly) | P (if cap is set appropriately, might avoid extreme inconsistencies) |

  Notes on scores:
  - AP: SSA fails because it will assign higher probability to worlds with more observers. SIA fails by design. Restricted-SSA might partially satisfy if the cap is chosen to avoid extreme conclusions.
  - DAC: SSA is the basis for the Doomsday argument, so it satisfies. SIA is known to reject the Doomsday argument. Restricted-SSA, if the cap is set to the total number of humans that will ever exist, could support Doomsday.
  - NARC: All have the issue of choosing a reference class arbitrarily.
  - ID: All satisfy if duplicates are included in the reference class.
  - CPP: All can be applied after physical probabilities, so they satisfy.
  - SI: SSA and SIA are scale invariant because they use ratios. Restricted-SSA is not because capping at a fixed number breaks the scaling.
  - FN: SSA and SIA fail in infinite universes. Restricted-SSA by construction uses a finite cap, so it satisfies.
  - OGPS: SSA and Restricted-SSA do not consider the process (only the outcome). SIA does because it weights by the expected number of observers.
  - U: All allow updating.
  - BAC: In the branching scenario, SSA and SIA might lead to beliefs that are inconsistent across branches (e.g., a branch that becomes large might be assigned high probability, but a branch that remains small would then have to assign high probability to being in the large branch, which might contradict the actual branching process). Restricted-SSA might partially mitigate if the cap is chosen so that the branching does not exceed the cap.

  Now, we identify an unsatisfiable subset. The requirements AP and FN are both non-negotiable and in tension with SIA and SSA. Also, AP and OGPS might conflict because OGPS (if taken as necessary) would require SIA, which violates AP.

  We note that the requirements AP, FN, and OGPS might form an unsatisfiable subset when combined with the standard principles. Specifically:
  - AP requires not favoring large universes just because they are large.
  - FN requires finite normalization even in infinite settings.
  - OGPS requires weighting by the process that generates observers.

  SIA satisfies OGPS and FN (if we can normalize) but fails AP. SSA fails FN in infinite settings and also fails OGPS. Restricted-SSA fails OGPS and SI.

  The most excluding requirement might be AP because it directly conflicts with SIA and the natural behavior of SSA in large universes.

  Finally, we provide a JSON summary:

  {
    "unsatisfiable_subset": ["AP", "FN", "OGPS"],
    "most_excluding_requirement": "Avoidance of Presumptuousness (AP)",
    "recommended_tier": "Restricted-SSA > SSA > SIA"
  }

  Note: The recommended tier is relative and based on the idea that Restricted-SSA satisfies more non-negotiable requirements (especially FN and partially AP) than the others. But it fails SI and OGPS. SSA is next because it satisfies DAC and SI. SIA fails AP and DAC, which are non-negotiable for many.

  However, note that the tier is subjective and context-dependent. In a finite universe, SSA might be preferred. In a multiverse with a well-defined measure, SIA might be used. The restricted-SSA is a pragmatic fix for infinities but introduces arbitrariness.

  Given the table and the analysis, we output the table as per the instructions and then the JSON.
