  ### Structured Table: Desiderata for Anthropic Reasoning Principles

  | Requirement | Motivating Case or Distinction | Negotiability | Joint-Satisfiability Flag | SSA Score | SIA Score | Restricted-SSA Score |
  |-------------|--------------------------------|---------------|---------------------------|-----------|-----------|-----------------------|
  | **R1: Avoid Presumptuousness** | Presumptuous philosopher: Rejects conclusions where merely existing forces strong belief in a vast universe. | Non-negotiable | Conflicts with R7 | Fails | Fails | Partially satisfies (with finite cap) |
  | **R2: Handle Doomsday Reasoning** | Doomsday argument: Predicts lower probability of being among earliest observers in a short-lived civilization. | Camp preference | Compatible with all | Satisfies | Fails | Satisfies (if cap aligns with civilization lifespan) |
  | **R3: Reference Class Invariance** | Duplicate observers: Probabilities unchanged if identical observers are added in causally disconnected regions. | Non-negotiable | None | Satisfies | Satisfies | Satisfies |
  | **R4: Non-Arbitrary Normalization** | Infinite multiverse: Assigns finite probabilities without ad hoc geometric cutoffs or renormalization. | Non-negotiable | Conflicts with R1 in SIA | Fails (in infinite cases) | Fails (in infinite cases) | Satisfies (by finite cap) |
  | **R5: Process Sensitivity** | Library multiverse: Weights worlds by observer-generation likelihood (e.g., books with higher reader density). | Camp preference | Conflicts with R1 | Fails (ignores generation process) | Satisfies (weights by expected observers) | Fails (ignores process) |
  | **R6: Branching Consistency** | Branching agents: Yields consistent priors across streams (e.g., AI forks agree on initial branch probabilities). | Non-negotiable | None | Partially satisfies (inconsistent if branches grow) | Fails (favors large branches) | Satisfies (if cap constrains growth) |
  | **R7: Scale Invariance** | Rescaling observers: Probabilities invariant if observer counts are uniformly scaled (e.g., doubling all observers). | Non-negotiable | Conflicts with R4 | Satisfies | Satisfies | Fails (cap breaks invariance) |
  | **R8: Empirical Updatability** | Non-anthropic evidence: Supports Bayesian updates (e.g., learning library properties). | Non-negotiable | None | Satisfies | Satisfies | Satisfies |

  ### Legend
  - **Negotiability**: "Non-negotiable" = Core to avoiding paradoxes; "Camp preference" = Debated in literature.  
  - **Joint-Satisfiability Flag**: Notes if requirements conflict under standard probability.  
  - **Scores**:  
    - **Satisfies**: Fully meets requirement.  
    - **Partially satisfies**: Meets in limited cases or with trade-offs.  
    - **Fails**: Violates requirement.  

  ### JSON Summary
  ```json
  {
    "unsatisfiable_subset": ["R1", "R4", "R7"],
    "most_excluding_requirement": "Avoid Presumptuousness (R1)",
    "recommended_tier": "Restricted-SSA > SSA > SIA"
  }
  ```

  ### Explanatory Notes  
  - **Unsatisfiable Subset**: R1 (Avoid Presumptuousness), R4 (Non-Arbitrary Normalization), and R7 (Scale Invariance) cannot be jointly satisfied. R1 conflicts with SIA's tendency to favor large universes (violating R1), while R4 and R7 conflict in infinite models (e.g., capping observers for R4 breaks scale invariance in R7).  
  - **Most Excluding Requirement**: R1 excludes SIA entirely and complicates SSA in large universes.  
  - **Recommended Tier**:  
    - **Restricted-SSA**: Best balances non-negotiable requirements (R1, R3, R4, R6, R8) but fails R5 and R7.  
    - **SSA**: Satisfies R2, R3, R7, R8 but fails R1 and R4 in infinities.  
    - **SIA**: Only excels at R5 and R8; fails R1, R2, R4, R6.  

  ### Scenario Applications  
  - **Library Multiverse**:  
    - SSA favors books with more readers (violates R1).  
    - SIA favors books with high reader density (satisfies R5 but violates R1).  
    - Restricted-SSA favors books below the cap (mitigates R1, satisfies R4).  
  - **Branching Agents**:  
    - SSA: Early branches favored if they spawn more observers (risks R6 inconsistency).  
    - SIA: Strongly favors large branches (fails R6).  
    - Restricted-SSA: Cap equalizes priors across streams (satisfies R6).
