  ### Diagnostic Taxonomy of Life Definitions

  This taxonomy is structured as a decision tree starting with necessary conditions for life (metabolism, genetic information storage, evolutionary adaptability, or organizational closure/autopoiesis). It uses five diagnostic cases to differentiate views, revealing where positions converge or diverge. Cases are evaluated as "alive" (Y) or "not alive" (N) under each view:  
  - **(i) Dormant bacterial spore** (metabolism halted; DNA intact; revival possible)  
  - **(ii) Synthetic minimal cell** (lab-assembled; designed genome; replicates in nutrients)  
  - **(iii) Mature virus** (hijacks host; no metabolism; carries genetic material)  
  - **(iv) Self-replicating digital agent** (evolves, competes, propagates; no biochemistry)  
  - **(v) Hypothetical crystalline replicator** (copies lattice; competes; evolves; no genes/metabolism)  

  **Confidence Notes:**  
