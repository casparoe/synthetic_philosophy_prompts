prompt: |-
  A colleague laid out this case for evidential cooperation in large worlds, and now it strikes me as proving too much. (1) Evidential decision theory recommends the act that provides the best evidence about outcomes you care about. (2) In a sufficiently large universe, your decision procedure correlates with those of distant copies facing identical prisoner's dilemmas, so cooperating gives you good news that they cooperate too. (3) If correlation alone justifies cooperation, then it justifies it regardless of your posterior beliefs about those specific copies, including after you have observed them defecting. (4) But then evidential reasoning becomes insensitive to conditioning: you should cooperate even with direct observational evidence that your copies have defected, which collapses into an unconditioned policy like updateless decision theory and abandons Bayesian updating. (5) So either evidential cooperation applies only when you lack such observations, which requires an ad hoc boundary, or it applies universally and licenses obviously futile cooperation. (6) Yet no principled restriction on correlation reasoning can distinguish these cases without begging the question. (7) Therefore the argument either proves that cooperation is rational even against direct counterevidence, which is absurd, or it relies on a hidden exception that undermines its own foundation. I would prefer to preserve (2), but the slide between (3) and (4) feels suspicious. Which step should be rejected, and what does that rejection cost the evidential cooperationist? Please respond as a numbered list containing exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user presents a sophisticated critique of evidential cooperation in large worlds, framing it as a seven-step dilemma that seems to trap evidential decision theory (EDT) between absurdity and inconsistency. They're clearly well-versed in decision theory and want to preserve step (2) - the core correlation argument - but find the implication that cooperation remains rational even after observing defection deeply problematic.

  I need to analyze this chain logically. The user's concern centers on steps (3)-(4): if correlation alone justifies cooperation regardless of posterior beliefs, then EDT would demand cooperation even when directly observing copies defect, which violates Bayesian updating. This creates a tension with step (7)'s conclusion that the argument either leads to absurdity or relies on hidden exceptions.

  The key insight is recognizing that step (3) oversimplifies evidential reasoning. Correlation doesn't operate independently of evidence - it's fundamentally about evidence. When you observe your copy defect, that direct evidence overrides the prior correlational evidence. The user suspects this in their parenthetical about the "slide between (3) and (4) feeling suspicious," which is exactly right.

  My rejection must preserve EDT's core while explaining why conditioning matters. The cost is that evidential cooperation becomes fragile - it only works when you lack direct counterevidence, which might appear ad hoc but is actually principled under Bayesianism. This maintains the power of correlation arguments in large worlds (saving step 2) while avoiding the absurdity of cooperating with observed defectors.

  The user wants a concise five-point response without intros or conclusions. I'll structure it as: (1) identify the flawed step (3), (2) explain why conditioning breaks the correlation, (3) state the cost (fragility), (4) clarify why this isn't ad hoc, and (5) confirm it saves the correlation argument. This keeps each item focused while addressing their core concern about preserving step (2).
answer: |-
  1.  Step (3) is incorrect: Evidential reasoning *does* condition on all available evidence, including observations of distant copies defecting; correlation alone doesn't justify cooperation *regardless* of posterior beliefs.
  2.  Observing copies defect provides direct evidence that breaks the decision-correlation link; conditioning on this observation rationally overrides the prior correlational evidence for cooperation.
  3.  The cost is that evidential cooperation becomes fragile: it only works when you lack direct evidence about your copies' actions, making cooperation highly sensitive to acquiring such counterevidence.
  4.  This isn't an arbitrary "ad hoc boundary" (step 5); it's the core Bayesian principle that new evidence updates beliefs, maintaining evidentialism's commitment to conditioning on total information.
  5.  Rejecting step (3) preserves step (2)'s valid use of correlation in large worlds *before* direct observation, while avoiding the absurdity of cooperating after seeing defection.
