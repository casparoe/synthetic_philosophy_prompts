answer: |-
  Your friend's pithy slogan, "There is no such thing as a humanitarian bomb," is indeed doing heavy lifting, compressing several distinct arguments into a memorable phrase. Let's unpack the precise theses it could express, assess their nature, and see which ones, if true, would definitively condemn the interventions in Kosovo, Iraq, and Libya as unjustified humanitarian acts.

  The most literal reading states that the physical act of dropping a bomb cannot itself be a humanitarian act because its immediate effect is destruction, injury, and death. This borders on a tautology: the detonation of an explosive device causes harm. While fundamentally true as a description of the immediate physical consequence, it's arguably a platitude. Taken alone, it doesn't settle the argument about *justification*. One could readily concede this point – the bomb itself harms – while still arguing that the *overall intervention*, using bombs as a necessary tool among others, was undertaken for humanitarian reasons and achieved a net humanitarian good. This reading doesn't inherently condemn any intervention; it merely observes the nature of the weapon.

  A second, stronger reading focuses on the inherent contradiction between means and ends. It claims that using inherently violent, destructive, and lethal means like aerial bombardment is fundamentally incompatible with the goal of humanitarianism, which is about saving lives and alleviating suffering. This is a substantive and highly contestable claim. It rests on a deontological or intrinsic view that certain means (like deliberate killing and destruction) can never be morally justified, regardless of the intended end, particularly one as profound as humanitarianism. If this thesis is accepted – that bombs are *inherently* non-humanitarian tools – then any intervention relying primarily on bombardment, even with humanitarian intent, becomes morally unjustified *by definition*. This would condemn Kosovo, Iraq, and Libya if we accept the premise that bombing was central to the military strategy. However, many reject this absolute incompatibility, arguing that sometimes the *only* or *least bad* way to prevent greater harm (like genocide) is through the discriminate use of force, including bombs. This is a core ethical debate in just war theory.

  A third interpretation targets the motivations and institutions behind military interventions. It suggests that states or alliances deploying bombs, especially powerful ones like the US or NATO, are inherently driven by strategic interests (power, resources, influence) rather than pure humanitarian concern. Even if humanitarian language is used, the *realpolitik* motivations and the nature of military institutions inevitably taint the action, making the "humanitarian" label a facade. This is a substantive and contestable claim about political reality. While historical examples abound of humanitarian justifications masking self-interest, it's not necessarily *always* true. Motivations can be mixed, and institutions can have multiple objectives. If this thesis holds universally, it would mean that interventions like Kosovo, Iraq, and Libya *could not have been* genuinely humanitarian in motive, thus unjustified *as humanitarian acts*. However, proving the *complete absence* of genuine humanitarian concern, or that strategic interests *always* completely dominate, is difficult. It might strongly suggest skepticism but doesn't definitively prove the interventions weren't *justified* as humanitarian for those specific cases without deeper analysis.

  A fourth, potent reading is fundamentally consequentialist: it asserts that military interventions involving bombing inevitably cause more harm than they prevent, or create new, worse humanitarian crises. The destruction, civilian casualties, infrastructure collapse, long-term instability, and potential for escalation outweigh any intended good. This is a highly substantive and fiercely contestable empirical claim. The outcomes in Kosovo (potentially averting ethnic cleansing, though followed by instability), Iraq (overthrowing a brutal dictator but triggering catastrophic civil war and insurgency), and Libya (removing Gaddafi but plunging the country into chaos) provide starkly different results that fuel this debate. **If this thesis is true – that bombing-based interventions *always* cause net negative humanitarian consequences – then it directly and definitively condemns Kosovo, Iraq, and Libya (and any similar intervention) as unjustified on humanitarian grounds.** However, proving this *universal* negative consequence is extremely challenging. Advocates point to Kosovo as a potential counterexample where bombing arguably halted an ongoing campaign of violence, suggesting consequences can be context-dependent.

  So, which readings support your friend's conclusion that all three interventions were unjustified? The literal "bombs destroy" platitude doesn't. The "incompatible means" thesis condemns them *if* bombing was central and you accept that absolute incompatibility. The "motivations/institutions" thesis condemns them *if* you accept that genuine humanitarian motivation in such actors is impossible. **However, the strongest support for universally condemning these three interventions (and all others) as unjustified *humanitarian acts* comes only from the consequentialist thesis: if bombing invariably creates net greater harm, then no such intervention can be justified on humanitarian grounds.** This is the reading that most forcefully backs the slogan's apparent intent to settle the argument categorically against these interventions. The other theses either don't lead inevitably to that conclusion for all three cases, or require accepting highly contested absolute principles. The consequentialist claim, while also deeply contested, directly links the *nature of the tool* (the bomb) to an *inevitably negative outcome* that negates the humanitarian justification.

  Ultimately, your instinct is right: the slogan bundles observations, ethical principles, political skepticism, and empirical predictions. Its power to "settle the matter" depends entirely on which bundled thesis the listener implicitly accepts, and the strongest case for a blanket condemnation rests on the bleak prediction that the bomb's consequences always defeat its purported humanitarian purpose.
