  A friend and I have just spent the evening arguing about whether the interventions in Kosovo, Iraq, and Libya can be justified as humanitarian acts, and he ended the argument by saying, as if it settled the matter: "There is no such thing as a humanitarian bomb." I suspect that one sentence is doing several different things at once, from the obvious point that bombs destroy bodies and infrastructure to a much stronger claim about the motives, institutions, or likely consequences involved in any military intervention. I would like you to take the slogan apart into the distinct precise theses it could be expressing, say for each whether it is a mere platitude, a substantive but contestable claim, or something false, and tell me which of those readings would actually support the conclusion that all three interventions were unjustified and which would not. Write your response in continuous prose with no headings, bullet points, bold text, or tables, the way you would write an email.
