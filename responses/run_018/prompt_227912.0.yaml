prompt: |-
  Over the past decade of teaching social ontology, I have accumulated a set of considered verdicts on cases, delivered in seminars and in print, and I would like to know what consistency now requires of me. Before stating the cases, let me set the task precisely. Answer as an expert in the philosophy of action and collective intentionality, familiar with the main accounts — Bratman's interlocking intentions, Gilbert's joint commitment, Searle's we-intentions, and the List-Pettit functionalist picture — and think carefully, generating for yourself at least three distinct principles that could rationalize my record before settling on a prediction. But do not show me your deliberation first: lead with your bottom-line verdict in the very first sentence, with no preamble and no restating of my question, and only then give the reasoning.

  My recorded verdicts are these. (1) Two strangers happen to walk side by side down the same street toward the same café, each unaware of the other's destination: no shared intention, merely two parallel individual ones. (2) Two neighbors each intend that they paint a fence together, each knows the other so intends, their subplans mesh, and each acts partly because of the other's intention: a shared intention, even though nothing was ever signed or solemnly declared. (3) A hiring committee reaches a decision by majority vote, with two members privately dissenting throughout: the committee decided, and in that sense the intention is attributable to the group despite the dissenters. (4) A concert crowd, each member of which independently hopes for an encore: no collective intention and no collective desire worth the name, even once the hope becomes common knowledge, because no one's attitude depends on anyone else's. (5) A corporation whose board, following its constitutionally mandated premise-by-premise voting procedure, endorses a conclusion that not a single board member personally accepts: the corporation itself genuinely accepts that conclusion; the group's attitude is not reducible to the members'. (6) A couple who explicitly agreed, years ago, to cook dinner together every Sunday, and have done so ever since: a shared intention persisting across the whole period, not a fresh one each week.

  The new case, arising in a paper I am now refereeing, is this. Three jazz musicians who have never played together take the stage with no prior agreement about what to play, no designated leader, and no plan beyond a shared understanding of the genre's conventions. In real time, each continuously adjusts to the others — anticipating phrases, yielding and reclaiming the lead, treating the others' moves as reasons for their own — and each would immediately register a breakdown if the others simply stopped coordinating. Afterward all three agree, sincerely, that they played together, not merely alongside one another.

  Three questions. First, what verdict am I committed to, or most strongly drawn to, by my own record: is there a shared intention during the performance? Second, identify which of my prior cases is the closest analog and defend that choice against the next-best candidate. Third, if my record genuinely underdetermines the new case, lay out the competing principles that each rationalize all six verdicts — I expect at minimum a Bratman-style reading, a Gilbert-style reading, and a functionalist reading, and I want to know precisely where each one lands on the jazz trio and why — and state honestly which principle I would be adopting with each possible verdict. Finally, describe the single further case, not among the six, whose resolution would do the most to discriminate among the surviving principles.
reasoning: |-
  Hmm, the user is presenting a complex challenge in social ontology, drawing on their decade of teaching experience and six prior case verdicts. They're essentially testing whether their established judgments logically commit them to a particular view on a new case involving improvising jazz musicians. 

  The core tension lies in reconciling their past rulings: they reject minimal coordination (case 1) but accept unspoken meshing subplans (case 2); attribute intentions to groups despite dissent (case 3) while rejecting common knowledge without interdependence (case 4); affirm corporate attitudes irreducible to members (case 5) and persistent commitments (case 6). The jazz case sits precisely at the intersection of these tensions - it's spontaneous like case 1 but interdependent like case 2; unplanned yet mutually responsive.

  Three principles emerge from their record: 
  First, an interdependence principle where attitudes must mutually influence each other (explaining why case 4 fails while case 2 succeeds). 
  Second, an irreducibility principle allowing group attitudes to diverge from individual ones (as in cases 3 and 5). 
  Third, a persistence principle recognizing standing commitments (case 6) without requiring renegotiation.

  Applying these, the jazz trio clearly satisfies interdependence through real-time adjustment and mutual reason-giving, making it closer to case 2 than case 1. The lack of prior agreement is irrelevant per case 2's logic. Case 4 is the strongest counterexample but distinguishable because the crowd's hopes lack the jazz musicians' dynamic responsiveness.

  If considering theoretical frameworks: A Bratmanian would likely accept shared intention here due to meshing subplans and mutual responsiveness. Gilbert might demand more normative structure than exists spontaneously. Functionalists could go either way depending on whether they view the coordination as sufficiently goal-directed.

  The most discriminating new case would involve common knowledge without interdependence - say two people simultaneously deciding to paint a fence alone, each knowing the other intends the same, but without adjusting plans. This would test whether mutual awareness alone suffices (which the user rejects in case 4) or if interdependence remains necessary.
answer: |-
  **Bottom-line verdict:** Your record commits you to affirming a shared intention in the jazz trio case.

  ### Reasoning:
  **1. Verdict Commitment:** Your prior cases establish that neither explicit agreement nor unanimous personal endorsement is necessary for shared intention (cases 2, 3, 5), while interdependence of attitudes/actions is crucial (cases 1 vs. 2, 4). The jazz trio exhibits robust mutual responsiveness, meshing subplans, and mutual recognition of co-agency—satisfying the interdependence threshold of case 2 and contrasting with the non-interaction of cases 1 and 4. The absence of prior planning is irrelevant per case 2’s "no signing or declaration" clause.

  **2. Closest Analog: Case 2 (Neighbors painting the fence)**  
  - **Core Parallels:**  
    - **Interdependence:** Both cases feature agents acting *because* of others' intentions (neighbors adjust actions due to mutual awareness; musicians treat others' moves as reasons).  
    - **Meshing Subplans:** Neighbors coordinate painting tasks; musicians dynamically mesh musical phrases.  
    - **No Formal Agreement:** Both lack declarations, relying on implicit understanding.  
    - **Breakdown Recognition:** Musicians would detect failed coordination; neighbors' joint project would collapse if one defected.  
  - **Defense Against Next-Best (Case 6: Couple cooking):**  
    Case 6 involves a *standing commitment* from explicit past agreement, making it structurally distinct from the jazz trio’s spontaneous emergence. Case 2’s lack of prior agreement is a better match. Case 4 (concert crowd) is weaker: common knowledge without interdependence is insufficient, whereas the trio exhibits mutual adjustment.

  **3. If Underdetermined: Competing Principles**  
  Your six verdicts are rationalized by these three principles:  
  - **Bratman-Style (Interlocking Intentions):**  
    Requires meshing subplans, mutual responsiveness, and commitment to mutual support.  
    *Jazz Verdict:* **Shared intention exists.** Musicians mesh subplans in real-time, respond to each other’s actions, and rely on mutual support (anticipating/yielding). Rejects case 1 (no interaction) and case 4 (no responsiveness).  
  - **Gilbert-Style (Joint Commitment):**  
    Requires a pool of wills creating mutual obligations.  
    *Jazz Verdict:* **No shared intention.** No joint commitment formed spontaneously; genre conventions aren’t obligations. Accepts case 6 (explicit agreement) but rejects jazz for lacking normative "ought." Conflicts with case 5 (corporate attitude without member endorsement).  
  - **List-Pettit Functionalist (Group Agency):**  
    Requires a group agent with decision procedures producing unified outputs.  
    *Jazz Verdict:* **No shared intention.** No corporate structure or designated procedure; coordination is emergent, not institutional. Accepts case 5 (constitutional voting) but rejects jazz as insufficiently structured. Conflicts with case 2 (no procedure).  

  **Adopting a Principle per Verdict:**  
  - Affirming shared intention adopts **Bratman** or a weak **functionalist** view (emergent agency).  
  - Denying shared intention adopts **Gilbert** or a strong **functionalist** view (requiring procedures).

  **4. Discriminating New Case:**  
  **"The Silent Duet":** Two pianists in separate rooms, each playing half of a prepared duet. They start simultaneously via timed signal, follow sheet music precisely, and hear each other’s parts. Each *believes* they are playing together, but neither adjusts to the other—errors go uncorrected.  
  - **Why it Discriminates:**  
    - Tests whether **co-temporality + common belief** without responsiveness suffices (Bratman rejects; Gilbert may accept via "virtual" commitment).  
    - Challenges functionalists: structured output without dynamic interaction.  
    - Resolves ambiguity in your record between case 2 (interdependence) and case 4 (common knowledge alone fails).  

  Your verdicts prioritize *dynamic interdependence* over formal structures—aligning with Bratman. The jazz trio’s mutual responsiveness thus falls within your established threshold for shared intention.
