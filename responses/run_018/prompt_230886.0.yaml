    C --> H[What does causal work? Role or realizer?]
    H -->|Role| I[Classical Functionalism]
    H -->|Realizer| J[How is pain unified?]
    J -->|By functional role| K[Realizer Functionalism]
    J -->|By species-specific states| L[Local Reduction]
  ```

  **Time Estimate:** Students can work through in ~10 minutes.  
  **Notes:** Positions are defined by *commitments*, not names. Empty branches highlight unstable/incoherent views.
