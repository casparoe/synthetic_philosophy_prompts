answer: |-
  ### Decision Tree: Multiple Realizability and Mental States

  **Entry Question:** Can two systems with almost nothing physiological in common (e.g., a human, an octopus, and a silicon robot) be in literally the same mental state, such as being in pain?

  ---

  #### **Branch 1: No, they cannot.**  
  **Question 1.1:** Is this because mental states are identical to specific, non-disjunctive physical states?  
  - **Yes** → **Leaf: Type Identity Theory**  
    *Awkward commitment: Must deny that AI, aliens, or octopuses can feel pain unless they share human brain physiology.*  
  - **No** → **Question 1.2:** Is it because wildly divergent systems couldn’t implement the *exact causal role* required for a mental state?  
    - **Yes** → **Leaf: Skeptical View** (e.g., Shapiro)  
      *Awkward commitment: Must argue that even human and octopus pain are physically similar "under the hood," making multiple realization rare or impossible.*  
    - **No** → *Empty branch (unattractive: rejects identity theory without offering an alternative).*  

  ---

  #### **Branch 2: Yes, they can.**  
  **Question 2.1:** Is this multiple realizability primarily a *conceptual possibility* (e.g., we can imagine silicon pain) or an *empirical fact* (e.g., octopuses exhibit pain-like behavior)?  
  - *(No branch point; proceed regardless of answer.)*  
  **Question 2.2:** When a mental state (e.g., pain) occurs, what does the causal work?  
    - **The functional role** (e.g., detecting damage and triggering avoidance) → **Leaf: Classical (Role) Functionalism**  
      *Awkward commitment: A silicon robot that mimics pain behavior *must* feel pain, even if it lacks subjective experience (qualia problem).*  
    - **The physical realizer** (e.g., C-fibers or silicon circuits) → **Question 2.3:** How do we explain pain being the *same state* across systems?  
      - **By the shared functional role** → **Leaf: Realizer Functionalism**  
        *Awkward commitment: Mental states are token-identical to physical realizers, risking disunity (e.g., "octopus pain" and "human pain" may share no core properties).*  
      - **By species-specific physical states** → **Leaf: Local Reduction** (e.g., species-specific identities)  
        *Awkward commitment: Psychology cannot generalize across species; "pain" splinters into disjunctive physical kinds (e.g., human-pain ≡ C-fibers, octopus-pain ≡ O-bands).*  

  ---

  #### **Key Distinctions Pressed:**
  1. **Empirical vs. Conceptual**: Q2.1 clarifies if multiple realizability is grounded in science or philosophy.  
  2. **Role vs. Realizer**: Q2.2/Q2.3 separate functionalism (role-focused) from reductionism (realizer-focused).  
  3. **Disjunction**: Q2.3 forces confrontation with disunity in local reduction.  

  #### **Ambiguous Separation:**
  - **Realizer Functionalism vs. Local Reduction**: The tree distinguishes them via Q2.3 (role vs. species-specificity), but realizer functionalism could collapse into local reduction if roles fragment. Both risk disunity, but local reduction explicitly embraces disjunction.  

  #### **Empty Branches:**
  - **Branch 1 → Q1.2 → No**: Rejecting both identity and role constraints leaves no coherent position.  
  - **Branch 2 → Q2.2 → Realizer → No answer to Q2.3**: Underexplored; might imply eliminativism or dualism.  

  ---

