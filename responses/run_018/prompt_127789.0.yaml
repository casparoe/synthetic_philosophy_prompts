  ## Clinical Ethics Committee Recommendation: Patient K. (Experimental Bilateral Cortical Interface)

  **To:** Members, St Anselm's University Hospital Clinical Ethics Committee  
  **From:** [Your Name], Doctoral Student (Philosophy of Mind), Committee Member  
  **Date:** 23 October 2023  
  **Subject:** Recommendation Regarding Informed Consent for Experimental Bilateral Cortical Interface in Patient K. (Post-Callosotomy)

  ### 1. Executive Summary & Recommended Action
  This opinion addresses the profound ethical challenge presented by Patient K., whose divided cerebral hemispheres express conflicting volitional stances regarding an experimental cortical interface ("prosthetic bridge"). Following careful consideration of the neurosurgical request, the family's position, and the complex philosophical and clinical realities of split-brain conditions, **this Committee recommends DEFERRAL of the current request for a single informed consent for the procedure.** We further recommend that the Trust **urgently develops and implements a formal Dual-Consent Pathway for interventions where significant, contradictory volitional outputs are demonstrably generated by disconnected cerebral hemispheres in patients lacking a corpus callosum.** A specific timeline for this development and Patient K.'s reassessment is outlined below.

  ### 2. Case Analysis & Core Ethical Conflict
  Patient K.'s corpus callosotomy fifteen years ago effectively created two isolated spheres of consciousness and agency within a single body. The current dilemma arises because:
  *   The language-dominant left hemisphere (LH) verbally refuses the experimental cortical interface.
  *   Structured behavioural assessments (via left hand manipulation and non-linguistic preference tasks) consistently indicate the right hemisphere (RH) selects the intervention.
  *   The family asserts Patient K. remains "one person" with verbal refusal being decisive.
  *   The neurosurgical team contends that proceeding on a single-consent model risks imposing a transformative intervention on the dissociated RH consciousness against its (demonstrated) will, while potentially overriding the LH's explicit refusal.

  The core conflict hinges on the **moral status and unity of Patient K. post-callosotomy.** Does the patient constitute a single, unified person (Family/Unified view), or do the functional disconnections necessitate recognition of two distinct centres of agency and interest within one organism (Surgical Team/Disunified view)?

  ### 3. Engagement with the Argument for Unified Personhood
  The strongest argument for treating Patient K. as a single, unified person despite hemispheric disconnection rests on **narrative identity and embodiment:**
  *   **Continuity of Narrative Self:** Patient K. possesses a single, continuous life history, social identity, and legal personhood established long before and persisting after the callosotomy. The family's interactions and the patient's engagement with the world as a single entity in most contexts (outside specific experimental paradigms) support this unified social and biographical identity. Personhood is argued to be fundamentally narrative and relational, residing in the whole embodied being over time, not reducible to momentary neural configurations or isolated capacities.
  *   **Embodiment as Unifying Factor:** The patient inhabits one body, with sensory inputs and motor outputs ultimately coordinated, albeit imperfectly, into a single behavioural stream observable by others. This shared embodiment underpins the intuitive perception of "one person" and provides a pragmatic anchor for medical decision-making and legal responsibility.
  *   **Primacy of Linguistic Agency:** Language is often seen as the pinnacle of human agency and the primary vehicle for expressing complex preferences and values. The LH's verbal refusal represents the most sophisticated expression of preference available and should hold sway, especially as it aligns with the patient's pre-morbid identity and known values (as reported by family).

  **Counter-Consideration:** While narratively and socially unified, the empirical reality of Patient K.'s condition demonstrates a fundamental *functional disunity* in specific cognitive, perceptual, and volitional domains. The consistent, structured demonstrations of the RH's independent preference for the intervention cannot be dismissed as mere reflexes or sub-personal processes. They represent a distinct locus of valuation and choice *within the same organism*. Ignoring this empirically demonstrable dissociated agency risks committing a profound ethical wrong – potentially subjecting the RH to an unwanted, highly invasive neurological intervention, violating the principle of respect for autonomy *wherever it demonstrably resides*. The Unified view struggles to adequately account for the ethical significance of this independently measurable contrary will.

  ### 4. Recommendation & Implementation Timeline
  *   **Immediate Action (Deferral):** The Committee recommends **formal deferral of the neurosurgical request to proceed based on a single informed consent process for Patient K.** The current evidence of contradictory volitional outputs renders the standard single-consent model ethically inadequate and potentially harmful.
  *   **Development of Dual-Consent Pathway:** The Trust must urgently establish a **formal policy and procedure – a Dual-Consent Pathway – for obtaining and evaluating consent/assent/dissent in patients with surgically confirmed hemispheric disconnection (agenesis or callosotomy) where demonstrable contradictory volition regarding a specific intervention exists.**
      *   **Timeline:** A draft policy framework should be presented to the Clinical Ethics Committee and relevant clinical governance bodies **within 6 weeks** (Target: 4 December 2023). Final ratification and implementation should occur **within 12 weeks** (Target: 15 January 2024). This necessitates expedited collaboration between Neurology, Neurosurgery, Neuropsychology, Clinical Ethics, and Legal Services.
  *   **Reassessment of Patient K.:** Patient K.'s case should be formally re-evaluated **immediately upon ratification of the Dual-Consent Pathway** (Target: Week commencing 15 January 2024), applying the new framework. This allows time for the family and clinical team to understand the new process.
  *   **Interim Care:** The neurosurgical team should continue optimal conservative management of Patient K.'s condition pending the reassessment under the new pathway.

  ### 5. Recommendation for Dual-Consent Pathways
  **This Committee strongly recommends that St Anselm's University Hospital adopts a formal Dual-Consent Pathway for cases like Patient K.'s.** The standard model of unitary consent is predicated on an assumption of unified agency that is empirically falsified in the split-brain condition when contradictory volitions are robustly demonstrated. A dual pathway must address:
  *   **Assessment:** Rigorous, replicable neuropsychological methods to ascertain hemisphere-specific preferences (verbal LH; non-verbal RH via validated tasks).
  *   **Threshold for Activation:** Criteria for when contradictory volition is deemed sufficiently robust and intervention-specific to trigger the dual pathway.
  *   **Decision Framework:** How to proceed when hemispheres conflict (e.g., requiring concordance? Prioritising refusal? Specifying conditions where surrogate input for one/both hemispheres is appropriate?).
  *   **Surrogate Roles:** Clarifying the family's role in representing the *patient as a whole* versus potential representation of a dissociated hemisphere lacking linguistic expression, particularly concerning pre-morbid values.
  *   **Documentation:** Specific procedures for recording and documenting the dual consent/assent/dissent process.

  Failure to develop such a pathway leaves the institution ethically vulnerable, potentially violating the autonomy interests of dissociated consciousnesses and creating significant legal and reputational risk.

  ### 6. Statement of Confidence & Points of Uncertainty
  *   **Confidence in Recommendation (Deferral & Dual Pathway):** **High Confidence.** The empirical evidence of conflicting volition is clear in this case, making unilateral consent based solely on verbal report ethically indefensible. The need for a specific institutional framework to address this novel but foreseeable scenario is urgent and well-founded. Deferral is the only prudent immediate course.
  *   **Area of Least Certainty (Empirical):** **The precise nature and degree of the right hemisphere's comprehension of the long-term risks, benefits, and existential implications of the cortical interface.** While preference is demonstrable, assessing the *depth of understanding* achievable via non-linguistic means in the RH remains a significant empirical challenge. Can the RH genuinely grasp concepts like "experimental," "permanent implant," "potential for unforeseen psychological changes," or "restoration of unity"? Current assessment tools provide strong evidence of *preference* but have inherent limitations in probing the *richness of understanding* comparable to linguistic explanation.
  *   **Area of Significant Uncertainty (Philosophical/Institutional):** **The practical implementation threshold for the Dual-Consent Pathway and the ultimate decision rule when hemispheres conflict.** Defining the precise level of evidence required to confirm "contradictory volition" robustly enough to trigger the dual pathway requires careful calibration. Furthermore, determining the ethically justifiable course of action when conflict persists (e.g., is LH verbal refusal always paramount? Can RH assent ever override LH refusal if potential benefit is high? How do pre-morbid values factor in?) involves profound philosophical questions about personhood, agency, and beneficence that lack definitive consensus and present significant challenges for codification into clear clinical policy. This is the point requiring the most nuanced deliberation during policy development.

  ### 7. Conclusion
  Patient K.'s case starkly illuminates the limitations of conventional bioethical frameworks when confronted with radical neural disunity. While respecting the patient's narrative unity and the family's perspective, the empirically demonstrable dissociation of volition necessitates a novel approach. Deferring the immediate decision and prioritising the development of a robust Dual-Consent Pathway is the ethically responsible course. This acknowledges the profound complexity of split-brain consciousness and positions St Anselm's at the forefront of ethically managing such extraordinary clinical scenarios. The Committee stands ready to assist in the urgent development of this essential policy.
