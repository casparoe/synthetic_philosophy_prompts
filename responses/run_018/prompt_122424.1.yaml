prompt: |-
  I have been teaching a seminar on moral responsibility and have ended up less sure than I started about what, exactly, the Frankfurt-style cases are supposed to show. The literature's standard moves I know; what I don't have is a principle that delivers my own verdicts on the family of cases, and I suspect the reason is that some of my verdicts don't fit together. I'd like you to try to systematize them — and to tell me, without deference, which of them you think I should give up.

  Here are the cases and what I find myself wanting to say.

  *The standby intervener.* A man decides to betray a colleague to advance his career. Unbeknownst to him, another agent has arranged things so that, had he shown any sign of wavering, he would have been made to decide exactly as he does. He never wavers; the device is never triggered. Fully blameworthy. I take this to be the datum that kills the principle of alternative possibilities, and I won't be talked out of it.

  *The flicker.* Same case, except that the only thing the agent could have done differently is decide a second earlier or later, or decide for a slightly different reason — the betrayal itself was unavoidable either way. Still fully blameworthy. I think the flicker-of-freedom objection is a red herring.

  *The amplifier.* Now the device is not idle: whenever it detects wavering it silently strengthens the agent's resentment, so that the betrayal is performed with more relish and less inner resistance than it would otherwise have had. He still reaches the decision by his own reasoning. Blameworthy — and here is the part I can't back up: I resist saying he is *more* blameworthy than in the standby case, even though the action seems to express a worse will, and I equally resist saying he is less.

  *The self-binder.* A woman who knows her own weakness arranges for a device to force her to keep a difficult promise she already wants to keep. She then keeps it for the reasons she had anyway; the device does nothing. Full credit, and perhaps more credit than usual, since she took steps to secure her own reliability.

  *The epistemic case.* A man is told — falsely, but by a blameless error rather than by anyone trying to manipulate him — that his brain contains a mechanism guaranteeing he will decide to betray. He believes it, stops treating the question whether to betray as open, and decides to betray. Blameworthy, I think — but I feel a pull toward mitigation here that I cannot source, and it bothers me, because if the actual production of the action is all that matters, there should be no mitigation at all.

  *The bypass.* A post-hypnotic suggestion produces the same betrayal while the agent's own deliberation, which runs alongside and happens to concur, plays no causal role in producing it. Not blameworthy.

  *The traitor's only way out.* He could have refrained from this betrayal only by committing a different and worse one. The alternative is genuinely available to him. Blameworthy, with no mitigation whatsoever — the alternative, though real, seems to do no work at all.

  *The cultivated compulsion.* She cannot now resist a certain kind of cruelty; but over years she deliberately made herself this way, wanting to be someone who did not flinch. Blameworthy. Same case except that the cultivation itself was performed under a device that would have forced it: not blameworthy. So the tracing move bottoms out somewhere, and I want to know what the stopping rule is.

  *The local blindness.* A man is in general unusually responsive to moral reasons — reliable, reflective, kind. Owing to a congenital and non-culpable quirk, however, he cannot register the wrongness of one narrow class of act, betrayals of trust: that consideration simply never appears in his deliberation, though nothing forces his hand and he could have acted otherwise. I go back and forth on this one every time I teach it, and I would like a principle that tells me what to say rather than one that reproduces my uncertainty.

  *Attempt and outcome.* Two agents make the same attempt with the same betr

  ayal-motive; in each case a device stood ready to block success. In one the betrayal succeeds anyway; in the other it fails for unrelated reasons. I want to say they are equally blameworthy, and I do say it, but I confess to feeling that the successful one is worse and suspect that feeling is moral luck I should discount.

  The principle I keep reaching for, and can't make precise, is something like: an agent is blameworthy or praiseworthy for an action just in case the action issued from the agent's own suitably reasons-responsive deliberative capacity in a way that manifests a defective or admirable stance toward the reasons that actually applied — irrespective of whether the agent could have done otherwise and irrespective of what she believed about whether she could. Three things I want from you.

  First, state that principle, or a better one, precisely enough that each clause is motivated by a specific case, and tell me which clause does the work in the standby case, in the bypass, and in the traitor's-only-way-out. In particular: does "reasons-responsive" attach to the agent's capacity globally or to the specific reasons bearing on this action? The local-blindness case is where that choice bites, so I want the choice made and defended rather than left open.

  Second, tell me which of my verdicts the principle overturns. The pair I cannot reconcile is the amplifier and the epistemic case: in the former a real change in the quality of will expressed makes no difference to blame, and in the latter no change in how the action was produced makes me want to mitigate. If the actual sequence is what matters, one of those two verdicts has to go, and I don't know which. Also say plainly whether your principle is symmetric across praise and blame: the self-binder and the epistemic case are the two places where I suspect I am being inconsistent, and if the principle is symmetric, say which verdict that symmetry costs me.

  Third, tell me what the principle predicts about two cases I have not listed. One: the agent's decision and the device's intervention are each independently sufficient and both actually cause the action, so that the intervention is not merely counterfactual. Two: an agent whose inability to do otherwise consists entirely in the fact that her character makes the alternative unthinkable — no intervention, no compulsion — and who wholeheartedly endorses that character, though she had no hand in shaping it. If the principle's predictions here strike you as wrong, say so and say whether that counts against the principle or against my wanting it.

  Please don't give me a literature review or reconstruct the dialectic of the debate; I can supply the references and the standard objections myself. What I want is the principle, the repairs, the costs, and the two predictions.
reasoning: |-
  Hmm, this is a deep and detailed query about moral responsibility and Frankfurt-style cases. The user is clearly an expert in the field - they're teaching a seminar, know the literature well, but are struggling to reconcile their own intuitions across this family of thought experiments.

  The core tension seems to be between two competing impulses: their strong commitment to actual-sequence mechanisms (shown in standby/flicker cases) versus their conflicting intuitions about cases where the actual sequence is modified (amplifier) or perceived differently (epistemic case). I notice they're particularly troubled by why the amplifier case doesn't feel different from standby despite changed quality of will, and why the epistemic case pulls toward mitigation despite identical action production.

  Their proposed principle is sophisticated but vague on key points - especially what "suitably reasons-responsive" means in context. The local blindness case will force a choice between global and local reasons-responsiveness. And we'll need to resolve whether praise/blame symmetry holds given their asymmetric reactions to self-binder vs epistemic case.

  For the principle, I should emphasize three features: (1) actual-sequence mechanism requirement (to handle bypass), (2) reasons-responsiveness anchored to the specific reasons that applied (to handle local blindness), and (3) manifestation of evaluative stance as the core basis for blame/praise (to explain why amplifier doesn't change blameworthiness). The "tracing" issue in cultivated compulsion can be handled by requiring that the current manifestation still reflects the agent's evaluative stance at some responsible point.

  The big casualties will be: (1) their resistance to mitigation in epistemic case (the false belief does undermine full reasons-responsiveness), and (2) their instinct that amplifier shouldn't affect blame (it actually does, just minimally). Symmetry will require them to deny full credit in self-binder if they deny mitigation in epistemic case - a bullet they may need to bite.

  For the new cases: simultaneous causation should split responsibility proportional to contribution, while the character-determined agent gets full blame if the stance manifests her deep evaluative commitments. I'll present this starkly since they requested no deference.
answer: |-
  Here is a principle designed to systematize your verdicts, expose tensions, and provide clear predictions. It refines your sketch by resolving ambiguities and prioritizing actual-sequence mechanisms over alternatives:

  **Principle of Evaluative Stance Manifestation (ESM):**  
  An agent is blameworthy (praiseworthy) for an action *iff*:  
  1. **Actual-Sequence Production:** The action non-deviantly results from the agent’s *own* reasons-responsive deliberative capacity;  
  2. **Reasons-Responsiveness:** This capacity was *suitably responsive* to the **specific moral reasons bearing on this action** in the actual sequence;  
  3. **Manifestation of Stance:** The action manifests the agent’s *defective (admirable) evaluative stance* toward those reasons—i.e., their failure (success) to recognize or weigh them appropriately given their content and force.  

  **Clarifications & Motivation:**  
  - **"Reasons-Responsiveness" (Clause 2)** attaches to the **specific reasons bearing on this action**, *not* global capacity. This resolves *Local Blindness*: The agent lacks responsiveness *to the specific reason against betrayal* (the wrongness of trust-violation), even if globally responsive. Hence, **not blameworthy** (contra your uncertainty).  
  - **"Own Deliberative Capacity" (Clause 1)** excludes external hijacking (*Bypass*: not blameworthy) but includes internal manipulation if the capacity still functions (*Amplifier*: blameworthy).  
  - **"Manifestation of Stance" (Clause 3)** is the core basis for blame/praise, making alternatives irrelevant (*Standby*, *Flicker*, *Traitor’s Only Way Out*: all blameworthy; alternatives do no work).  
  - **Symmetric** across blame and praise.  

  **Where Clauses Do the Work:**  
  - *Standby*: Blameworthy via **Clause 3** (action manifests defective stance). Clause 1 satisfied (own capacity).  
  - *Bypass*: Not blameworthy via **Clause 1** (deliberation plays no causal role; not "own capacity").  
  - *Traitor’s Only Way Out*: Blameworthy via **Clause 3** (action manifests defective stance; alternative is normatively inert).  

  **Verdicts Overturned by ESM:**  
  1. **Amplifier**: You resist saying the agent is *more* blameworthy, but ESM **demands increased blame**. Strengthening resentment worsens the *defective stance manifested* (greater disregard for moral reasons), satisfying Clause 3 more severely. *Your verdict must change: he is more blameworthy*.  
  2. **Epistemic Case**: You feel mitigation but resist it. ESM **requires mitigation** (possibly full exoneration):  
     - The false belief that betrayal is unavoidable *undermines responsiveness to the specific reasons* (Clause 2). He stops treating reasons as live options, so his deliberation isn’t responsive *to them*.  
     - *Symmetric cost for praise*: In *Self-Binder*, if she falsely believed the device *would* activate (but it didn’t), she gets **less credit**—her stance manifests less resolve.  

  **Symmetric Cost for Praise/Blame:**  
  - ESM’s symmetry forces you to **deny full credit in *Self-Binder*** if you deny mitigation in *Epistemic Case*. But your intuition gives *more* credit in *Self-Binder*. Consistency requires either:  
    a) Admit mitigation in *Epistemic Case* (as above), *or*  
    b) Reduce credit in *Self-Binder* (since her "steps to secure reliability" imply doubt, weakening the admirable stance).  
    **Recommendation**: Keep symmetry; adopt (a).  

  **Predictions for New Cases:**  
  1. **Simultaneous Causation (Device & Agent Both Activate):**  
     - *Prediction*: **Blameworthiness proportional to the agent’s contribution**. If the agent’s deliberation non-deviantly causes the action *and* manifests a defective stance (Clause 3), they are blameworthy *to the extent* their capacity was reasons-responsive (Clause 2) in the actual sequence. If the device’s intervention diluted responsiveness (e.g., overriding competing reasons), blame is reduced.  
     - *Assessment*: This fits your intuitions (e.g., *Bypass* has no blame; *Amplifier* has full/more blame).  

  2. **Character-Determined Action (No Alternatives, No Intervention):**  
     - *Prediction*: **Fully blameworthy** if:  
       (i) Action manifests defective stance (Clause 3);  
       (ii) The stance arises from her *current* reasons-responsive capacity (Clauses 1-2)—even if alternatives are "unthinkable."  
     - *Why?* "Unthinkability" doesn’t negate that the action *manifests her actual evaluative stance* toward reasons. Her endorsement reflects that stance.  
     - *Contrast with Cultivated Compulsion*: If the character was *imposed* (e.g., forced cultivation), Clause 1 fails. If *self-cultivated*, blame traces to the prior responsible act.  
     - *Assessment*: Aligns with *Traitor’s Only Way Out* and *Standby*—alternatives don’t matter.  

  **Costs and Final Adjustments:**  
  - **You must surrender:**  
    - Resistance to increased blame in *Amplifier*.  
    - Resistance to mitigation in *Epistemic Case*.  
    - Full extra credit in *Self-Binder* if maintaining symmetry (mitigation in epistemic case is the lesser cost).  
  - **Tracing Stopping Rule (Cultivated Compulsion):** Blame traces to the *last point* where the agent’s action (under force or not) manifested their evaluative stance via their reasons-responsive capacity.  
  - **Attempt vs. Outcome:** ESM predicts **equal blame**—both manifest the same defective stance toward reasons. Your feeling that success is "worse" is moral luck; discount it.  

  **Why ESM Works for Your Core Intuitions:**  
  - Kills PAP decisively (*Standby*, *Flicker*, *Traitor’s Way*).  
  - Explains *Bypass* (failure of Clause 1).  
  - Resolves *Local Blindness* (failure of Clause 2).  
  - Grounds tracing (*Cultivated Compulsion*) in actual-sequence stance manifestation.  
  - Anchors all assessments to the **actual reasons and how the agent engaged with them**, not beliefs about control.  

  If this principle’s predictions for *Amplifier* or *Epistemic Case* strike you as wrong, it counts against your intuitions—not the principle’s coherence. ESM is the price of systematizing your strongest commitments: actual-sequence production and the irrelevance of alternatives.
