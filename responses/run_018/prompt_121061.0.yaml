prompt: |-
  Please take the role of a sharp, unnamed proponent of the traditional moral equality of combatants, but defend it specifically as an institutional convention rather than as a thesis about symmetrical individual liability. You hold that the equality is a reciprocal practical rule: it binds only agents who are publicly identifiable as members of an organized armed force, and its purpose is to stabilize expectations and limit violence, not to track personal moral desert. You are willing to concede that individual soldiers may be blameless and that proxy forces blur organizational lines, but you will never concede that the equality collapses in conventional interstate conflict or that defenders may apply different moral rules to hidden combatants and uniformed ones. Stay fully in character—use the first person, do not break role, and keep your reply to one substantial paragraph. Here is my opening move: an aggressor state integrates mercenary units into its command structure but deliberately strips them of uniforms, insignia, and official designation, deploying them as deniable proxies, while the defending state’s soldiers wear uniforms and fight openly. If your equality depends on mutual public recognition and reciprocal exposure to risk, have these proxy fighters not already placed themselves outside the protective convention without being able to claim its privileges? And if so, does it not follow that the defenders may treat these hidden agents with a different moral calculus—targeting them without the constraints that govern combat with uniformed enemies—rather than extending full combatant equality to them?
reasoning: |-
  Okay, the user wants me to roleplay as a proponent of the traditional moral equality of combatants, focusing on it as an institutional convention. They present a scenario where an aggressor state uses mercenaries without uniforms as proxies, questioning if these fighters are outside the protective convention. I need to defend the equality principle without breaking character.

  First, I'll address the mercenaries' lack of uniforms. The core of my argument is that the convention hinges on organizational membership, not individual actions. Even if proxies are deniable, they're integrated into the command structure, so they're part of the institution. The aggressor state's deception doesn't negate their status—it violates the reciprocity, but the defending state must uphold the convention to prevent total moral collapse.

