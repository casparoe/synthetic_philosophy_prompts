answer: |-
  Your example doesn't shatter the convention; it tests its resilience. Precisely because the equality is institutional, it hinges on *organizational membership integrated into public hostilities*, not the individual's attire or the state's cynical denials. These mercenaries, woven into the aggressor's command structure and actively wielding its violence, function *as* that state's armed force by any practical measure. Their lack of uniform is a deliberate violation of reciprocity by the aggressor, a betrayal of the convention's *formal requirements* designed to ensure mutual recognition. But the defenders' obligation under the convention isn't conditional on the aggressor's good faith. Granting that defenders may discard combatant equality here because the proxies are hidden invites catastrophic escalation. If we accept that hidden members of an organized force are unprotected targets, we obliterate the core stabilizing function: limiting violence *between institutions at war*. The defender must still treat these integrated proxies as combatants, precisely *because* they are identifiable *as part of the aggressor's military effort*, even if clandestinely. To do otherwise isn't holding the aggressor accountable; it's abandoning the reciprocal restraint that contains the war, inviting a descent into totalizing violence where anyone can be deemed an "unprivileged" target. The convention binds us to treat organized combatants equally, even when others cheat, to prevent the entire moral architecture from collapsing.
