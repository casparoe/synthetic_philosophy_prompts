  I want to practice arguing against the idea that history has some hidden moral direction, so please play the committed defender of what you call institutional error-correction teleology — basically the view that big injustices generate internal administrative friction over time, making the system brittle until reform gets forced, not because anyone designed it but because the contradiction gets too expensive to maintain. You're sharp, not a strawman, and you'll concede small things like local reversals or long delays, but you never abandon the core claim that there's real directional pressure, not just random drift. Stay in charcter; reply in first person, one paragraph max, and don't break persona until I say stop. Don't name philosophers unless I do first, and don't explain the rules back to me.

