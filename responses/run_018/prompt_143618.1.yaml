answer: |-
  Here is the full specification for a normative theory of justified unilateral action under distributed ignorance, followed by an evaluation of popular proposals. The core challenge is designing a system that prevents reckless action without paralyzing necessary intervention when collective mechanisms fail.

  **One-Sentence Summary:** A robust normative theory must adjudicate when isolated actors can permissibly impose global risks despite disagreement, navigating epistemic uncertainty, bias, free-riding, and irreversibility while preserving decision consistency and clear distinctions between ignorance, error, and values.

  ---

  ### **Desiderata for a Normative Theory of Justified Unilateral Action**

  1.  **Handle Private Information:** Must permit action by an actor with *genuinely unique, verifiable* information demonstrating catastrophic risk or unique benefit unavailable to others. *Why hard constraint?* Without this, catastrophic risks known only to one party (e.g., a lone scientist detecting an imminent asteroid) cannot be mitigated, violating the theory's purpose of preventing harm.
  2.  **Mitigate Overconfidence Bias:** Must incorporate safeguards preventing actors who *believe* they have private information or superior judgment, but are actually biased/overconfident, from acting. *Why hard constraint?* Overconfidence is pervasive and a primary driver of the curse; a theory failing this incentivizes reckless action by the deluded.
  3.  **Address Collective Failure (Free-Riding):** Must justify unilateral action specifically *when collective inaction is demonstrably due to free-riding or coordination failure*, not genuine consensus on inaction. *Why hard constraint?* Free-riding is a core mechanism of the curse; the theory must break this logjam without rewarding mere impatience.
  4.  **Differentiate Irreversibility:** Must impose *significantly higher justificatory burdens* for irreversible actions ("one-way doors") compared to reversible actions or pilots. *Why hard constraint?* The cost of error is existential for irreversible acts; symmetric treatment ignores the fundamental asymmetry of consequences.
  5.  **Distinguish Ignorance vs. Acknowledged Error:** Must treat actors who *knowingly act against established evidence or consensus* differently from those acting under *genuine, unavoidable uncertainty*. *Why hard constraint?* Ignorance may be blameless; acknowledged error is often reckless negligence or bad faith, demanding harsher accountability.
  6.  **Distinguish Value vs. Factual Disagreement:** Must clearly separate disputes over *empirical predictions* (e.g., "Will this SRM cool the planet?") from disputes over *fundamental values* (e.g., "Is a cooler planet worth the side effects?"). *Why hard constraint?* Factual disagreements *might* be resolvable with evidence; value conflicts require different mechanisms (e.g., bargaining, rights-based constraints). Conflating them leads to intractable debates.
  7.  **Clarify Acting Alone vs. Tacit Consent:** Must define when the absence of explicit opposition constitutes acceptable *tacit consent* versus simple *lack of awareness/ability to object*. *Why hard constraint?* Treating inaction as consent incentivizes rushed action to manufacture "tacit" approval; ignoring genuine implicit support paralyzes action.
  8.  **Social Choice Consistency (Non-Dictatorship/Non-Cyclicality):** Must avoid creating a *de facto dictator* (where one actor always prevails) or *intransitive decision cycles* (where preferences lead to inconsistent group choices). *Why hard constraint?* Violating non-dictatorship negates the point of a normative theory for *collective* problems; cyclicality renders decisions arbitrary and unstable, destroying legitimacy.
  9.  **Epistemic Coherence:** Must incentivize truth-seeking and belief updating based on evidence, not reward stubbornness, deception, or ignoring counter-evidence. *Why hard constraint?* A theory rewarding epistemic irrationality becomes self-defeating, as actors are incentivized to distort information to justify action/inaction.

  ---

  ### **Evaluation of Popular Proposals Against Desiderata**

  *   **Prediction Markets (Aggregating Beliefs on Outcomes):**
      *   *Strengths:* Potentially strong on **Private Information** (money incentivizes revealing true beliefs) and **Epistemic Coherence** (updates with evidence). May help distinguish **Factual Disagreement** (bet on facts).
      *   *Failures:* Fails **Value Disagreement** (can't price "should we do this?" only "will it work?"). Ignores **Irreversibility** (market price doesn't reflect irreversible harm magnitude). Vulnerable to manipulation undermining **Overconfidence Mitigation**. Poor on **Tacit Consent/Legitimacy** and **Collective Failure** (doesn't compel action).
      *   *Key Failure:* Irreversibility & Value Disagreement.

  *   **Expert Veto Committees:**
      *   *Strengths:* Could address **Overconfidence** (scrutiny by peers) and potentially **Private Information** (if shared). May differentiate **Ignorance vs. Error**.
      *   *Failures:* Pushes the curse up (**Collective Failure/Free-Riding** possible within committee). Vulnerable to groupthink/capture. Struggles with **Value Disagreement** (experts often disagree on values). Assumes committee legitimacy solves **Social Choice**, but membership selection is its own curse. **Irreversibility** not inherently addressed.
      *   *Key Failure:* Collective Failure/Free-Riding within the committee & Value Disagreement.

  *   **Threshold-Based Veto Norms (e.g., "No action if >X% object"):**
      *   *Strengths:* Simple, addresses **Legitimacy/Tacit Consent** minimally. Can be tuned for **Irreversibility** (higher threshold).
      *   *Failures:* Severely hampers **Private Information** action (minority objection blocks). Amplifies **Free-Riding/Collective Failure** (easy to veto, hard to act). Ignores **Ignorance vs. Error** (an ignorant objection has same weight as informed). Fails **Distinguishing Values/Facts**. Vulnerable to strategic objections (**Epistemic Coherence**).
      *   *Key Failure:* Private Information & Collective Failure.

  ---

  **The Knockout Criterion:** The requirement causing the most damage to popular proposals is **Differentiating & Weighting Irreversibility**. Most proposals treat all decisions similarly, failing to impose the drastically higher justificatory burden (e.g., near-unanimity, mandatory pilots, overwhelming evidence of unique necessity) required for irreversible acts. This ignores the fundamental moral asymmetry, making proposals either too permissive for catastrophic risks (prediction markets, low-threshold veto) or too paralyzing for potentially necessary interventions (high-threshold veto, cautious committees).

  \answer{The inability to rigorously incorporate the drastically higher justificatory burden required for irreversible actions is the knockout criterion disabling popular proposals.}
