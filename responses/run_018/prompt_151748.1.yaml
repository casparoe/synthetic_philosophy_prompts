prompt: |-
  I've been trying to work out my actual position on whether cross-cultural moral variation undermines objectivity, moving past the standard WEIRD-psychology summary and the reflexive "relativism is self-defeating" reply that dominates rationalist forums. I have a tentative framework: moral disagreement is "shallow"—compatible with a single correct account—when it stems from (i) different empirical beliefs about outcomes, (ii) different jurisdictional allocations of moral authority (who enforces, who is held responsible), or (iii) context-sensitive weighting of shared values under different social conditions. It is "deep"—genuinely threatening to objectivity—only when one culture denies that a class of beings possesses basic moral status at all, rather than merely holding that harming them is overridden by other considerations. I want to know whether this principle actually captures my judgments, where it breaks, and which verdicts I should abandon.

  Here are my concrete reactions. The familiar divergence in moral-foundations weightings—WEIRD populations emphasizing harm and fairness, other societies weighting loyalty, authority, and purity more heavily—feels shallow: it is a difference in salience and social scale, not in whether harm or fairness are genuinely normative. Societies that delegate punishment to ancestors or spirits rather than human courts also seem shallow, differing only in jurisdiction, not in whether the underlying act is wrong. Historical infanticide practiced under extreme resource scarcity strikes me as shallow if driven by false empirical premises about suffering or survival prospects, but deep if grounded in a genuine denial that newborns have moral standing. Funerary cannibalism versus burial or cremation also feels shallow: the same underlying value—respect for the dead—is expressed through symbolically coherent but incompatible rituals. By contrast, lying to comfort a dying patient is permitted in some traditions and forbidden in others, and I classify that as shallow virtue-weighting—yet I am unsure what structurally distinguishes it from harder cases.

  The trouble case is a small-scale society with strict clan boundaries and no individual concept of moral agency: within the clan, all judgment is delegated to elders, and individuals speak only of "breaking rules" rather than "being wrong"; outside the clan, harming strangers is not overridden but literally unthinkable as a moral category—there is no concept of "wronging" them at all. I initially classify this as deep ontological divergence, because outsiders appear excluded from moral status. But I worry I am being inconsistent: if all moral authority is structurally centralized in the clan, the absence of cross-group obligations might just be extreme jurisdictional boundary-drawing, analogous to legal citizenship, rather than a denial that outsiders can be wronged. Meanwhile, I think the infanticide judgment should stay deep only when status is denied, not when it is empirically mistaken—yet I have no clear criterion for telling the two apart in practice. Can you articulate a precise principle, or a small family of them, that saves as many of these verdicts as possible? For each clause, identify the case that motivates it and state its verdict on a case I have not listed—specifically, a culture in which all moral reasoning is conducted through divination with no causal-empirical mediation, but applies uniformly to clan members and strangers alike. Be honest about which of my intuitions the principle cannot accommodate without ad hoc modification. Finally, please separate what is broadly settled in the relevant anthropological and philosophical literature from what remains genuinely contested among specialists—do not present a disputed framing, such as the claim that moral foundations are entirely culturally constructed without biological or universal components, as if it were the consensus view.
reasoning: |-
  Okay, the user presents a sophisticated moral philosophy framework and seeks validation, refinement, and gaps identification. They're clearly well-versed in anthropology and philosophy—mentioning WEIRD psychology, moral foundations theory, jurisdictional allocations—but want to move beyond superficial debates. Their core struggle is distinguishing "shallow" vs "deep" moral disagreements, particularly regarding ontological status denial versus contextual overrides.

  Hmm, their trouble case about clan-based societies is fascinating. They're torn between interpreting outsider exclusion as jurisdictional (shallow) versus ontological denial (deep). I notice they're self-aware about potential inconsistency—that's good. Their infanticide example also reveals practical difficulty in distinguishing empirical error from genuine status denial. 

  The divination case they request is clever: a culture using oracle-based reasoning universally applied. This tests whether their framework can handle non-empirical epistemology without collapsing into relativism. I should note that procedural differences (divination vs rationality) might still be shallow if core values align.

  On literature: Must clarify where consensus exists (e.g., moral diversity ≠ relativism) versus battles (e.g., innateness of foundations). They explicitly warn against presenting contested views as consensus—good catch about moral foundations theory being debated. 

  Their underlying anxiety seems to be: "Does my framework hold water against hard cases, or am I smuggling in WEIRD assumptions?" That meta-worry deserves addressing. The jurisdictional escape hatch could indeed overstretch—we might need a "conceptual toolkit" approach instead of rigid categories.

  For the divination verdict: Since universal scope preserves moral status, it should be shallow procedural divergence. But if the oracle denies basic standing to certain groups? Then it'd tip into deep territory. The key is always "who counts," not "how we decide."
answer: |-
  Your framework is philosophically sophisticated and aligns with several influential approaches in metaethics and moral anthropology. Below is a principled refinement of your criteria, stress-tested against your cases and the divination example, with explicit notes on where adjustments may be needed. I distinguish settled insights from ongoing debates.

  ---

  ### **Refined Principles for "Shallow" vs. "Deep" Disagreement**
  1. **Shallow Disagreement**: Occurs when cultures share a core commitment to *basic moral status* (BMS) for the same entities but diverge due to:  
     - **(i)** Empirical disagreements about outcomes (e.g., infanticide based on false beliefs about infant suffering).  
     - **(ii)** Jurisdictional boundaries (e.g., elders vs. courts enforcing rules; ancestors vs. states as moral authorities).  
     - **(iii)** Context-driven prioritization of shared values (e.g., funerary rituals expressing respect; honesty vs. compassion in end-of-life care).  

  2. **Deep Disagreement**: Occurs when a culture **systematically denies BMS** to entities another culture recognizes as morally considerable.  
     - *BMS Denial Criterion*: The culture lacks conceptual resources to attribute intrinsic moral standing (e.g., no vocabulary for "wronging" outsiders, not merely overriding duties).  
     - *Key Test*: Would they grant BMS *if* empirical/jurisdictional factors changed? If no → deep divergence.  

  ---

  ### **Application to Your Cases**
  | **Case**                          | **Your Verdict** | **Refined Principle's Verdict** | **Notes** |
  |-----------------------------------|------------------|----------------------------------|-----------|
  | Moral foundations weighting       | Shallow          | Shallow (iii)                   | Prioritization of shared values (harm/fairness exist but are subordinated). |
  | Ancestral vs. state punishment    | Shallow          | Shallow (ii)                    | Jurisdictional allocation of authority. |
  | Infanticide (empirical error)     | Shallow          | Shallow (i)                     | False belief about outcomes/suffering. |
  | Infanticide (status denial)       | Deep             | Deep                            | Denial that newborns possess BMS. |
  | Funerary cannibalism vs. burial   | Shallow          | Shallow (iii)                   | Shared value: respect for the dead. |
  | Truth-telling to dying patients   | Shallow          | Shallow (iii)                   | Contextual weighting of honesty vs. compassion. |
  | Clan boundaries (outsiders)       | Deep?            | **Ambiguous**                   | *Critical test*: Is "unthinkability" due to BMS denial (deep) or jurisdictional hyper-localization (shallow)? |
  | **Divination-based morality** (new case) | — | **Shallow** (ii/iii) | If applied universally, BMS is granted; divergence is procedural (how moral truth is known). |

  ---

  ### **Trouble Case: Clan Boundaries & Moral Agency**
  - **Your worry is justified**: This exposes ambiguity in the jurisdictional/BMS distinction.  
    - *Shallow Interpretation*: If the clan treats outsiders like a state treats non-citizens (no *enforcement* jurisdiction), but acknowledges they *could* be wronged under different systems → shallow (ii).  
    - *Deep Interpretation*: If harming outsiders is seen as morally neutral (like breaking a rock), not merely unpunished → deep (BMS denial).  
  - **Resolution**: Add a *counterfactual test*:  
    - *Shallow*: "If strangers were under clan jurisdiction, would harming them be wrong?" → Yes.  
    - *Deep*: The answer is no or nonsensical (no concept of "wronging" applies).  

  **Verdict**: If the clan lacks the concept of "wronging outsiders" entirely → deep. Otherwise, shallow jurisdictional exclusion.  

  ---

  ### **Divination Case: Universal Application, Non-Empirical Epistemology**
  - **Description**: A culture uses divination (e.g., oracle bones) for *all* moral reasoning but applies rules identically to clan members and strangers.  
  - **Verdict**: **Shallow** (ii/iii).  
    - *Why?*  
      - BMS is granted universally (strangers are included).  
      - Divination is a procedural/jurisdictional source of authority (like courts or scripture).  
      - No empirical mediation ≠ BMS denial; it’s an epistemological difference.  
  - **Contrast**: If divination *denied* BMS to strangers (e.g., "oracle says outsiders lack souls"), it would be deep.  

  ---

  ### **Where Your Intuitions May Need Adjustment**
  1. **Infanticide Status Denial vs. Empirical Error**:  
     - *Problem*: Distinguishing "denial" from "override + false belief" is empirically fraught. Cultures rarely state "newborns lack BMS"; they justify acts via necessity or ontology (e.g., "not fully human until naming").  
     - *Adjustment*: Focus on **systemic exclusion from moral consideration**. If newborns are excluded from *all* protections (not just overridden in scarcity) → deep.  

  2. **Jurisdictional Overextension**:  
     - *Risk*: Overstretching (ii) to explain *any* exclusion (e.g., "slavery is jurisdictional").  
     - *Fix*: Insist on counterfactual test. If a group *could* be included under different rules (e.g., freed slaves gain BMS) → shallow. Chattel slavery (permanent BMS denial) → deep.  

  3. **Truth-Telling vs. Hard Cases**:  
     - Your shallow verdict holds. Structural difference from deep cases: both cultures acknowledge *competing values* (honesty/compassion); neither denies the patient’s BMS.  

  ---

  ### **Anthropological & Philosophical Consensus vs. Disputes**
  | **Aspect**                          | **Broad Consensus**                                                                 | **Actively Contested**                                                                 |
  |-------------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Moral Diversity**                 | Extensive cross-cultural variation exists; WEIRD populations are outliers.          | Whether variation reflects deep disagreement or shallow differences (e.g., Churchland vs. Haidt). |
  | **Moral Foundations**               | Harm and fairness are widespread; loyalty/authority/purity vary in emphasis.        | **Contentious**: Are foundations biologically innate (Haidt) or culturally constructed (Shweder)? |
  | **Objectivity**                     | Relativism is *not* entailed by diversity alone (most philosophers reject relativism). | Whether "procedural objectivity" (e.g., rational convergence) is sufficient (Scanlon vs. Mackie). |
  | **BMS Attribution**                 | Cultures vary in who/what is granted moral standing (e.g., animals, ancestors).     | Whether BMS rests on intrinsic properties (e.g., sentience) or relational factors.     |

  **Key Caveat**: The claim that moral foundations are *entirely* culturally constructed (no universal components) is **not consensus**. Leading theories (e.g., Haidt’s MFT) posit innate, domain-specific foundations shaped by culture.

  ---

  ### **Synthesized Solution**
  Your framework captures most cases if:  
  - **BMS Denial** is defined by *systemic exclusion* + *counterfactual test*.  
  - **Jurisdictional Boundaries** require potential inclusion under alternative structures.  
  - **Epistemic Differences** (e.g., divination) are shallow unless they *cause* BMS denial.  

  **Tradeoff**: The clan case forces a choice—either accept that extreme jurisdictional exclusion *can* mask BMS denial (requiring careful ethnography) or tighten "deep" to only explicit ontological rejection (risking underclassification). **Recommendation**: Prioritize functional outcomes (who is protected) over stated beliefs.  

  This preserves objectivity while acknowledging radical diversity: moral truths exist, but access is mediated by empirical, epistemic, and social factors. When cultures disagree despite shared facts and scope of moral concern, the disagreement is shallow.
