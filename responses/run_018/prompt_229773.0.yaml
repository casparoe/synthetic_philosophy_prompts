prompt: |-
  In ordinary conversation, someone who asserts a claim she privately disbelieves is criticized for speaking insincerely, even if the claim turns out to be true; someone who asserts a claim that turns out false is criticized for getting it wrong, even if she believed it. Wikipedia's editing policy appears to run on neither standard. Editors are told not to insert material merely because they are sure of it; it must be verifiable in a reliable published source. An editor may be expected to present a reliably sourced claim she privately believes is false (as can happen when neutrally covering a contested topic), and unsourced material may be removed even if it is true and the editor who added it knows it from direct experience.

  Reconstruct the implicit view of assertion behind this policy, if it has one. Does it presuppose a truth norm, a belief norm, a knowledge norm, or some distinct source- or provenance-based norm? In answering, distinguish what the policy strictly presupposes from what it merely fits well with, consider whether Wikipedia edits should even be modeled as assertions of the underlying claims rather than as reports about what sources say, and explain what would have to change if the encyclopedia were run instead on the rule that a claim may be included only if the editor knows it.
reasoning: |-
  Okay, the user is asking about Wikipedia's editing policy and the implicit view of assertion behind it. Let me start by understanding the core of their query. They mention how ordinary conversation treats insincerity and false claims differently, but Wikipedia's policy seems to deviate from both. Editors must cite reliable sources regardless of personal belief or knowledge. The user wants to know what norm—truth, belief, knowledge, or something else—underlies this policy.

  First, I need to recall Wikipedia's key policies: Verifiability, Neutral Point of View (NPOV), and No Original Research (NOR). These require that information must be cited to reliable published sources. The policy isn't about the editor's belief or direct knowledge but about what sources say. That suggests that Wikipedia edits are more about reporting sources rather than asserting the claims themselves. 

  The user also asks whether the policy presupposes a truth norm, belief norm, knowledge norm, or a provenance-based norm. Given that Wikipedia removes unsourced material even if true, it clearly doesn't prioritize truth or belief. Knowledge is also out because direct experience isn't sufficient. So the norm here is source-based or provenance-based. The reliability of the source is what matters, not the editor's knowledge or the actual truth value.

  Another angle is modeling Wikipedia edits as assertions versus reports. If edits are seen as assertions of the claims, that would clash with the policy since an editor citing a source they disbelieve isn't asserting the claim's truth but reporting the source's assertion. That makes more sense. So Wikipedia's edits are meta-assertions about sources, not direct claims about the world.

  The user also wants to know what would change if Wikipedia required editors to only include what they know. That would shift everything. Editors couldn't use sources they don't personally trust, and original research might creep in. Verifiability would suffer, and NPOV would be harder because editors might omit well-sourced claims they personally doubt. The collaborative, neutral nature of Wikipedia would break down without the current source-based norm.

  I should also consider deeper needs. The user might be interested in epistemology, how knowledge is constructed in collaborative projects, or the ethics of information dissemination. They might be exploring how institutional policies differ from individual communication norms. Highlighting the practical implications of shifting to a knowledge norm could address unspoken interests in why Wikipedia's model works despite its counterintuitive aspects.
answer: |-
  The implicit view of assertion underlying Wikipedia's editing policy is **a "citation norm" or "verifiability norm,"** fundamentally distinct from truth, belief, or knowledge norms. This norm prioritizes **provenance and public verifiability** over the editor's private epistemic state or the objective truth of the claim. Here's the analysis:

  1.  **Rejection of Truth, Belief, and Knowledge Norms:**
      *   **Truth Norm:** The policy explicitly rejects this. Unsourced true claims (e.g., based on direct experience) are removed. Inclusion depends on source, not truth.
      *   **Belief Norm:** Editors are required to add well-sourced claims *even if they privately disbelieve them* (e.g., representing a minority view neutrally). They are prohibited from adding claims *solely* because they believe them strongly, without a source. Private belief is irrelevant.
      *   **Knowledge Norm:** Editors are prohibited from adding claims they *know* to be true via direct experience if unsourced. Conversely, they must add claims they *know* are false (or doubt) if reliably sourced and relevant. Knowledge (in the traditional sense of justified true belief) is neither necessary nor sufficient.

  2.  **The Core Norm: Citation/Verifiability:**
      *   **Strict Presupposition:** The policy strictly presupposes that the **act of editing (inserting a claim) must be justified *only* by the existence of a specific type of public, published source.** The norm is: **"Assert (include) P only if P is found in a reliable published source."**
      *   **Basis of the Norm:** This is fundamentally a **provenance-based norm** or **source-based norm**. The *source* of the information, its public availability, and its deemed reliability by the community are paramount. The editor acts as a conduit for the source's assertion, not as the primary asserter of P.
      *   **Goal Alignment:** This norm fits perfectly with Wikipedia's core principles:
          *   **Verifiability:** Readers must be able to check claims independently.
          *   **Neutral Point of View (NPOV):** Requires presenting significant published viewpoints without editorial endorsement or rejection.
          *   **No Original Research (NOR):** Prohibits editors from introducing novel analysis, synthesis, or unpublished information.

  3.  **Modeling Edits: Assertion vs. Report:**
      *   **Edits as Reports about Sources:** This is the more accurate model. When an editor adds "P [Source]", they are **not primarily asserting that P is true.** They are **asserting that "Source S states that P"** (or "P is stated in Source S"). The edit is a *meta-assertion* about the source content.
      *   **Implication:** The underlying claim "P" is not being asserted *by the Wikipedia article* in the ordinary conversational sense. The article asserts *that reliable sources say P*. The criticism norms shift accordingly: An editor is criticized not for asserting a false P or a disbelieved P, but for failing to provide a source, misrepresenting a source, or using an unreliable source. Truth and belief become properties of the *source's assertion*, not the editor's act of inclusion.
      *   **Why this Model is Necessary:** The requirement to include well-sourced claims the editor disbelieves, and exclude true claims the editor knows but cannot source, only makes sense if the edit is understood as reporting the source's position, not endorsing P.

  4.  **Change Under a "Knowledge Norm" Rule:**
      If Wikipedia adopted "Include P only if *the editor* knows P", the project would fundamentally transform, likely collapsing its current model:
      *   **Demise of Verifiability/NOR:** Editors could insert claims based on personal knowledge/experience without sources. Readers couldn't verify claims independently. Wikipedia becomes a compendium of personal testimonials.
      *   **Collapse of NPOV:** Editors would omit well-sourced, significant viewpoints they personally disbelieve or lack knowledge of. Coverage becomes subjective and biased towards the collective (and shifting) "knowledge" of active editors, not established published discourse.
      *   **Erosion of Collaboration:** Disputes would center on whether an editor *truly knows* P, an intensely personal and often unverifiable claim, rather than the reliability of public sources. "Original research" becomes the norm.
      *   **Loss of Scope:** Coverage of topics beyond the direct knowledge of any editor (e.g., highly specialized academic subjects, historical events without living witnesses) would vanish or be severely limited.
      *   **Increased Vulnerability:** Malicious editors could easily insert false claims claiming "personal knowledge."
      *   **Shift in Focus:** The emphasis would move from *what is published and verifiable* to *what this specific group of people claims to know*. It would become a very different, much less reliable, and less encyclopedic resource.

  **Conclusion:**

  Wikipedia's editing policy implicitly operates on a **strict citation or verifiability norm**. It presupposes that the act of including a claim is justified solely by its presence in a reliable published source, transforming the edit into an assertion *about what sources say* rather than a direct assertion of the claim's truth. This model explicitly rejects truth, belief, and knowledge norms for editors. While the policy *hopes* reliable sources lead to truth, and *requires* editors to engage with sources (implying a form of secondary belief/knowledge about the source's content), its core operational rule is purely source-based. Shifting to a knowledge norm would destroy Wikipedia's core functions of verifiability, neutrality, and being a summary of published knowledge, turning it into a platform for personal testimony.
