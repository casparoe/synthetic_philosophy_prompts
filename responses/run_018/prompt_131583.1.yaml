answer: |-
  ### Coherence Audit Procedure for Conditional Forecasts

  **Audit Flowchart**  
  *Each step must be completed in sequence. Staff should document answers and escalate if judgment is needed.*

  1. **Identify Conditional Structure**  
     - **Question:** "What are the explicit conditioning event (A) and consequent (B) in the forecast? If embedded in policy, extract A and B."  
     - **Sufficient Answer:** Clear separation of A (observable antecedent) and B (falsifiable outcome), even if vague. Policy language must be translated (e.g., "raises rates" → "central bank increases interest rates").  
     - **Stop Condition:**  
       - Pass: A and B unambiguously identified. Proceed to Step 2.  
       - Fail: A or B undefined (e.g., "improves society" without measurable criteria). Audit stops.  
     - **Misfire Warning:** Over-extraction of A/B from non-conditional statements (e.g., mistaking a causal claim for a conditional).

  2. **Clarify Probability Interpretation**  
     - **Question:** "Is the confidence rating explicitly or implicitly treated as P(B|A) (probability of B given A)?"  
     - **Sufficient Answer:**  
       - Explicit: "Yes" with reference to P(B|A).  
       - Implicit: Confidence derives from data estimating P(B|A) (e.g., study results).  
       - Non-probabilistic: Confidence reflects non-Bayesian factors (e.g., expert intuition).  
     - **Stop Condition:**  
       - Pass: Confidence ≠ P(B|A). Audit stops.  
       - Proceed: Confidence = P(B|A). Move to Step 3.  
       - Escalate: Ambiguous interpretation (e.g., "partially" P(B|A)). Human judgment required.  
     - **Misfire Warning:** Ignoring contextual cues (e.g., preprint data implying P(B|A)).

  3. **Check for Non-Degenerate Algebra**  
     - **Question:** "List all similar conditionals your team has assessed or might assess:  
       - Same A, different B (e.g., "if A, then C").  
       - Same B, different A (e.g., "if X, then B").  
       Include vague/related variants (e.g., "rate hikes under 150bps")."  
     - **Sufficient Answer:** ≥2 conditionals sharing A or B with distinct, non-equivalent events.  
     - **Stop Condition:**  
       - Pass: <2 conditionals (degenerate algebra). Audit stops.  
       - Proceed: ≥2 conditionals. Move to Step 4.  
       - Escalate: Uncertainty about similarity (e.g., "is ‘rate hike’ similar to ‘QT tightening’?").  
     - **Misfire Warning:** Over-simplifying similarity (e.g., treating "rain" and "snow" as identical).

  4. **Assess Measure and Non-Triviality**  
     - **Question:** "For each conditioning event (from Step 3), provide:  
       a) P(A) > 0? (If unknown, estimate.)  
       b) P(B|A) not 0 or 1? (If implicit, infer from data/context.)"  
     - **Sufficient Answer:**  
       - Numerical values, bounds (e.g., "P(A) ~0.3"), or study-based estimates.  
       - "P(A)=0" if A is impossible.  
     - **Stop Condition:**  
       - Pass: All P(A)=0. Audit stops.  
       - Fail: Any P(A)>0 **and** P(B|A) ∈ (0,1). Audit stops.  
       - Proceed: All P(A)>0 **and** P(B|A)=0 or 1. Move to Step 5.  
       - Escalate: Unmeasurable P(A)/P(B|A) (e.g., no data for vague events).  
     - **Misfire Warning:** Misinterpreting "impossible" (e.g., conflating low P(A) with P(A)=0).

  5. **Verify Probability Space Triviality**  
     - **Question:** "In events related to these conditionals, does any outcome have probability ∈ (0,1)? (e.g., P(recession)=0.7, not 0 or 1)."  
     - **Sufficient Answer:** Example of non-extreme probability in the algebra (e.g., P(inflation>5%)=0.6).  
     - **Stop Condition:**  
       - Pass: All probabilities are 0 or 1 (trivial space). Audit stops.  
       - Fail: Any probability ∈ (0,1) (non-trivial space). Audit stops.  
       - Escalate: Uncertainty about the full algebra (e.g., "we only forecast rates").  
     - **Misfire Warning:** Overlooking hidden uncertainties (e.g., ignoring P(supply_chain_disruption)).

  ---

  ### Case Applications
  **(i) "If the central bank raises rates by >150bps, recession is likely" (75% confidence)**  
  - **Step 1:** A="rates rise >150bps", B="recession likely". Pass → Proceed.  
  - **Step 2:** 75% = P(B|A) (explicit). Proceed → Step 3.  
  - **Step 3:** Similar conditionals: "If rates rise 50-150bps, recession likely (40%)" and "If rates rise <50bps, no recession (80%)". Proceed → Step 4.  
  - **Step 4:** P(>150bps)=0.2>0, P(B|A)=0.75 ∈ (0,1). **→ Fail.**  
  - **Final Disposition:** Fail (violates triviality: non-degenerate algebra with P(B|A)≠0/1).  
  - **Unwelcome Result:** Yes (reveals mathematical incoherence).

  **(ii) "If supplement taken, working memory improves" (implicit preprint support)**  
  - **Step 1:** A="take supplement for 8 weeks", B="working memory improves". Pass → Proceed.  
  - **Step 2:** Preprint implies P(B|A) (40-subject improvement rate). Proceed → Step 3.  
  - **Step 3:** No similar conditionals (e.g., no forecasts for other supplements). **→ Pass.**  
  - **Final Disposition:** Pass (degenerate algebra; triviality constraint inapplicable).  
  - **Unwelcome Result:** No.

  **(iii) Institutional Forecast (Forced Retraction Example)**  
  *Forecast: "If sanctions escalate, war ends in 2024 (95% confidence)" with similar conditionals:  
  - "If sanctions unchanged, war continues (90%)"  
  - "If sanctions lifted, war ends (5%)"*  
  - **Step 1:** A="sanctions escalate", B="war ends". Pass → Proceed.  
  - **Step 2:** Confidence = P(B|A) (institutional policy). Proceed → Step 3.  
  - **Step 3:** Similar conditionals provided (same B, different A). Proceed → Step 4.  
  - **Step 4:** All P(A)>0; P(B|A)=0.95/0.90/0.05 → all ∈ (0,1)? **→ Fail.**  
    *Staff note: P(B|A) for "sanctions unchanged" is 0.90 ∈ (0,1).*  
  - **Final Disposition:** Fail (violates triviality; non-extreme P(B|A) in non-degenerate algebra).  
  - **Unwelcome Result:** Yes (mandates retraction).

  ---

  ### Limitations  
  1. Cannot audit subjunctive or counterfactual conditionals (e.g., "if the treaty were signed...").  
  2. Silent on forecasts without confidence ratings or non-probabilistic uncertainty (e.g., fuzzy logic).  
  3. Relies on self-reported similar conditionals; may miss implicit algebra elements.  
  4. Fails for vague events if probabilities cannot be bounded (e.g., "if trust erodes...").  

  ### What the Procedure Cannot Settle  
  1. **Semantic Disagreements:**  
     - Rejects the identity thesis (P(if A, then B) = P(B|A))? Audit inconclusive if Step 2 escalated.  
     - Conditionals with undefined P(B|A) (e.g., A="unicorns exist") are unresolved.  
  2. **Value Judgments:**  
     - "Similar enough" events (Step 3) require human discretion.  
     - Ambiguous probabilities (Step 4) rely on expert estimation.  
  3. **Non-Boolean Events:**  
     - Silent on continuous outcomes (e.g., "if A, then stock price = X").

