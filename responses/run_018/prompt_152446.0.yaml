  hey im prepping interveiw questions for a podcast episode with a philosopher — lets call her Dr. K — who just wrote a book defending genuine moral dilemnas. not the weak kind where you just pick the lesser evil, but actual cases where youre genuinely required to do A and genuinely required to do B and theyre totally incompatble. her specific hook is that she thinks philosophers break the debate by assuming moral oughts are always all-things-considered verdicts that have to aggregrate into one answer. she treats them as pro-tanto obligations that stay live even when they conflict, so theres no hidden logical contradiction — just real normative overdetermination.

  i want maybe 6 or 7 questions, none of that generic "what drew you to philosophy" stuff. specifically:

  - one that presses her on ought-implies-can: if she allows that you genuinely ought to do something impossible, whats left of the principle? include a follw-up for the answer where she says its only pro-tanto oughts that survive.

  - one about moral residue and blame: if shes in a real dilemna and picks A, is she blamworthy for failing B? for picking B? and a follow-up that catches her if she says blame is just inappropriate because its unavoidable.

  - one about scaling to collective agents — like a state that ought to honor a climate treaty and also ought to prevent economic collapse but cant fully do both. does her framework allow a nation to be in a genuine collective moral dilemna, or does she have to dissolve it into institutional design?

  - one asking what evidence or thought experiment could actually move her, since she tends to dismiss critics as just smuggling in aggregation.

  - one that forces her to distinguish her view from a mistake theory: why isnt she just saying people confuse pro-tanto with all-things-considered?

  write them casual but sharp, like im actually hosting. i already typo'd interveiw, dilemnas, aggregrate, and blamworthy so we should be good.
