answer: |-
  ## Pub Debate: Metrics vs. Mud

  **Setting:** A slightly worn pub near King's Cross, London. Rain streaks the window. Priya nurses a pint of ale, Tom sips a ginger beer.

  **Priya:** (Tapping her phone screen) Just read another grant report from a longtermist org. Fifty pages on modelling AI takeover probabilities with *eight* significant figures. Feels… performative. Like they’re building ornate sandcastles nobody will ever see, let alone use.

  **Tom:** (Shrugs) Better than building sandcastles funded by vibes and a rich patron's whim, surely? At least they *have* to show their working. Measurability forces honesty. You know what happens without it – cosy networks, pet projects, zero accountability. Remember the disaster with ‘Clean Water for All’ back in ‘18?

  **Priya:** Accountability to *who*, though? To the funder demanding a shiny, quantifiable output, not to the messy reality of building resilient institutions or tackling genuinely uncertain future risks. We’re biasing the entire ecosystem towards what’s *easily countable*, not what’s *actually important*. Bednets delivered? Tick. Lives saved? Estimate, but we’ll take it. Actual, robust health system capacity in a region prone to novel outbreaks? Too fuzzy. So charities chasing EA cash restructure to deliver the ticks, not the systemic depth.

  **Tom:** But Priya, that systemic depth *is* fuzzy! Hopelessly fuzzy. How do you measure ‘institutional resilience’? How do you *prove* your org is better prepared for black swan events? You can’t. So funders fall back on proxies – outputs, models, publications. Imperfect? Absolutely. But the alternative isn’t some holistic utopia; it’s subjective mush. And ‘earning to give’ actually helps here – it’s brutally honest. You maximise cash, then give it to people ostensibly better at judging impact. The metrics are the common language.

  **Priya:** (Leans forward) That’s *exactly* the poison! High-earners donating huge sums *need* that clean, justifiable metric for their own conscience and their LinkedIn post. "Look, my £500k funded 10,000 bednets! Impact!" But demanding that clean metric *forces* the charity to prioritise bednet distribution over, say, training community health workers who could adapt to the *next* crisis. Or, in longtermism, it incentivises producing ever more elaborate, unreadable risk assessments – a tangible, countable *thing* for the report – instead of the slow, unglamorous work of building relationships with policymakers or fostering interdisciplinary foresight capacity. That stuff doesn’t fit neatly in a spreadsheet cell.

  **Tom:** So what’s your solution? Fund vibes? Trust that orgs are ‘building resilience’ behind the scenes with no evidence? That’s how you get vanity projects and inefficiency. Metrics, even imperfect ones, create alignment. They force focus. And ‘earning to give’ isn't the villain; it’s increasing the resources *available*. Should we sneer at people making money to give more away just because they want to see *some* evidence it’s not being poured down the drain? That seems perverse.

  **Priya:** I’m not against evidence, Tom! I’m against *bias*. When the *only* evidence that gets funded or celebrated is the quantifiable, countable kind, you quietly kill off anything that doesn’t fit that mould. You hollow out institutions, turn them into output factories. Resilience often looks like slack, redundancy, diverse skillsets – things that look like ‘waste’ on a quarterly report. And yeah, maybe ‘earning to give’ donors aren't *malicious*, but their demand for clean impact narratives *amplifies* this bias massively. It creates a market for performative measurement.

  **Tom:** Okay, point taken about longtermism maybe being uniquely prone to wanky, ungrounded modelling as a deliverable. That’s a fair critique. And maybe some funders are too output-obsessed. But Priya… gravity. You can’t wish away the funder’s need to justify *their* spend, whether it’s their foundation’s trustees or that ‘earn to give’ banker. Measurement is the gravity pulling resources towards *some* kind of accountability. The bias is inherent. The challenge is designing *better* metrics, proxies for resilience, not abandoning measurement altogether because it’s hard. That way lies… well, the charity sector pre-EA.

  **Priya:** (Sighs, takes a long drink) Better proxies… maybe. But we need funders brave enough to fund the *unmeasurable* sometimes. To value building the institution itself, trusting the people, funding ‘slack’. And maybe ‘earning to give’ folks need to get more comfortable with ambiguity, with funding capacity and trust, not just discrete, countable outputs. Otherwise, we’re optimising for the reportable, not the robust. We’re building fragile palaces of data while the real foundations crumble.

  **Tom:** (Nods slowly) Alright. So where we land is… you think the current measurability demands, amplified by certain donor types, actively *damage* institutional health by misaligning incentives towards countable but potentially superficial outputs. Especially in complex, long-term spaces.

  **Priya:** Precisely. Quietly wrecking resilience by optimising for legibility over substance.

  **Tom:** And I think that while that distortion is real and a problem – especially in longtermism – abandoning measurability is naive and potentially more harmful. The bias is a fundamental force we have to *work with* and improve, not a bug we can easily remove. Better metrics, smarter funders, more acceptance of noisy proxies for capacity. But the core principle – demanding evidence of impact, however imperfect – is non-negotiable for responsible resource allocation. ‘Earning to give’ brings resources; the pressure for metrics is separate, though linked.

  **Priya:** (Manages a small smile) So… we agree it’s a problem, especially at the long-term, complex end. We agree measurability is necessary but flawed. We disagree on whether the current implementation, particularly the pressure from certain donors for *clean* metrics, is *actively toxic* to building real resilience, and how radical the solution needs to be.

  **Tom:** (Raises his glass) Spot on. More research needed. Another pint? My treat. Maybe we can measure its impact on our resilience against this drizzle.

  **Priya:** (Chuckles) Only if you promise not to demand a quantified happiness output report. But yes, go on then. Cheers. Just… think about what gets measured *driving out* what matters, yeah?

  **Tom:** Always do. Even if gravity’s a bitch.
