prompt: |-
  In philosophy of language, performative utterances are often likened to pressing a button: saying "I promise" or "I apologise" does not describe reality but activates an institutional mechanism, and success means the circuit closes rather than that a statement matches the world. This analogy is used to defend Austin's claim that performatives lack truth-values and are governed solely by felicity conditions.

  Audit it. Provide a correspondence table — button, user, wiring, power supply, failure to close the circuit — then identify the breaks: can a button be hollow or insincere in the way a promise can? Does the image import a deterministic, non-intentional model that hides speaker responsibility? Most importantly, can it accommodate an infelicitous utterance that is still the act it purports to be (a broken promise remains a promise, whereas a failed button-press produces nothing), and does that residual representational element undermine the conclusion that performatives sit outside semantics?

  Say whether the analogy genuinely supports the categorical separation from constatives, or whether it carries that conclusion only by treating misfires and abuses as purely mechanical faults. Then state what evidence or argument would lead you to revise this assessment, and indicate where your reasoning is most vulnerable.
