prompt: |-
  I'm preparing the interview script for a moderated colloquium session on collective memory and moral obligation. The guest is an unnamed philosopher who defends a view she calls mnemonic triage: she holds that duties of remembrance are not uniform but distributed according to relation-thickness and the moral status of what is remembered, drawing on Margalit's ethics of memory, and that societies sometimes bear an active obligation to institutionalize forgetting—not mere forgiveness—toward certain wrongdoers, drawing on Rieff's argument that collective forgetting can be an ethical achievement rather than a failure. She applies this framework to digital legacy management, arguing that platforms should implement algorithmic decay for the profiles of perpetrators of mass violence while maintaining robust memorial infrastructure for victims, and she claims this is compatible with thick-relation obligations because the duty is directed at narrative coherence rather than data preservation.

  Please draft eight to ten interview questions that go beyond asking her to restate the position. I want at least one question on each of the following, with a follow-up keyed to the answer she is most likely to give.

  First, how she distinguishes institutionalized forgetting from historical revisionism, especially given that the same decay mechanisms could be exploited by authoritarian regimes to erase inconvenient records.

  Second, how the relation-thickness gradient operates in practice—whether strangers have no commemorative duty toward victims they never knew or only a thinner one, and what that implies for national commemorative rituals.

  Third, her response to the objection that algorithmic decay is merely a euphemism for censoring the historical record, particularly when digital archives are increasingly the primary source for future historians.

  Fourth, what Rieff's critique of therapeutic culture actually entails for collective memory practices, not just for individual psychology, and whether her view risks reducing public remembrance to a form of group therapy.

  Additionally, include one question that presses the internal tension in her view: Margalit treats certain forms of forgetting as a moral betrayal of the dead, while she treats others as moral achievements. Ask her to specify the precise criterion that separates betrayal from achievement, and include a follow-up that challenges that criterion with a hard case—such as a community that chooses to forget not a perpetrator but the specific names of victims in order to avoid retraumatization.

  End with one question about practical institutional design: ask what specific feature in a digital archive or memorial platform would count as disconfirming evidence for her view, and why she thinks that feature would undermine mnemonic triage rather than merely showing that implementation is difficult.

  Keep the questions substantive, anticipate standard replies, and avoid generic biographical or methodological openings.
