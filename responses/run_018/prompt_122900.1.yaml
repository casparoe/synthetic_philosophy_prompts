prompt: |-
  me and my friend got into a proper two-hour arguement last night about farmed shrimp, and I came away genuinely unsure what rule she's running. She sits on the technical committee for one of those farmed-seafood certification labels, and she insists every position she's ever taken is consistent with the others. I think her record fits at least three different rules at once and that they come apart on the case in front of her next month — but I couldn't get her to say which one she's on.

  Her votes and stated positions, as best I can reconstruct them:

  - Atlantic salmon: voted to require percussive or electrical stunning before bleeding — asphyxiation in ice slurry or CO2 is out, in her view. At the same meeting she voted *against* lowering the maximum stocking density, on the grounds that it pushes up cost per kilo and the farms will just drop the label.
  - Edible crab and lobster: electrical stunning required before any processing; against live boiling; against declawing; against dry storage out of water. She keeps bringing up crabs rubbing at a wounded claw and learning to avoid a shelter where they got shocked.
  - Whiteleg shrimp: voted *against* any stunning requirement at harvest — immersion in ice slurry is fine by her.
  - But at that same meeting she voted *for* a rule that pond harvests can't leave shrimp stranded out of water or in the sun for more than a few minutes, and for a phase-out of eyestalk ablation pegged to whenever a selective-breeding alternative becomes commercially available. She voted against requiring anaesthesia for the ablation, saying there's no approved product and the hatcheries would walk.
  - Bivalves: no provisions at all, didn't even want it discussed.
  - Insects reared for feed (black soldier fly and similar): no provisions either, "come back with data" — although she did mutter that the numbers there are scary.
  - Cleaner fish used in salmon cages (lumpfish, wrasse): voted to give them exactly the same provisions as the salmon themselves, on the grounds that they're vertebrates and the mortality in the pens is grim.
  - When someone floated certifying farmed octopus: said the right answer is not to certify it at all, whatever the slaughter method.

  The case next month: a company has a stunner that mounts on the harvest pump — continuous-flow electrical stunning of shrimp at harvest, at something like 1–2% of farm-gate cost, at realistic pond-harvest scale. Take the committee's own commissioned evidence review as given (I'm not asking you to check any of it, and please don't go looking for sources — just treat it as stipulated): it says shrimp have nociceptors, will groom or rub a treated antenna for minutes afterwards, learn to avoid a chamber where they got a shock, and show a stress-like physiology that is blunted by anaesthetics; but it also flags that all of this is compatible with nociceptive reflex plus simple associative learning, that there's no agreed decapod analogue of the vertebrate telencephalon, and that the only validation the stunner has is behavioural (loss of the tail-flip, no response to a noxious probe), which can't cleanly distinguish insensibility from paralysis. The review also notes that the numbers are in the hundreds of billions of animals a year, so even a tiny per-animal effect is enormous in aggregate.

  So she has two votes coming: whether to require stunning for shrimp at harvest now that it's cheap and technically workable, and — if yes — whether behavioural validation of that kind is good enough or whether she should hold out for something else, and what.

  Here's what I actually want: predict both votes, and more importantly name the rule she's running that generates them. Then give me the *other* rules that fit her whole record just as well and say what each of them predicts about these two votes, especially where they split. Say which one case you'd put in front of her to tell the surviving rules apart — I've got candidates (a near-costless kill method for the feed insects; an extension of the stunning requirement to some farmed finfish nobody has ever actually tested; a whole-life/enrichment rule for a long-lived species instead of a kill-method rule) but tell me which one discriminates best and why. And if she wants to stay consistent with herself, which of her own precedents is the closest analog here, and what is she committing to either way?
reasoning: |-
  Hmm, this user is describing a detailed debate with a friend who sits on a farmed-seafood certification committee. They've provided extensive voting history across multiple species and want me to: 1) predict their friend's votes on shrimp stunning, 2) identify the underlying ethical rule, 3) find alternative rules that fit the same voting pattern, 4) suggest a test case to distinguish between rules, and 5) identify the closest precedent.

  Looking at the voting patterns, I notice several key tensions: She requires stunning for vertebrates (salmon, cleaner fish) but not for shrimp despite similar evidence of pain responses. She opposes crustacean mutilations (crab declawing) but accepts shrimp eyestalk ablation. She cares about harvest stress in shrimp but not stunning. The bivalves and insects get no protections at all.

  For the shrimp stunning vote, I see two possibilities: She might vote "no" based on her past acceptance of ice slurry for shrimp and lack of neurological consensus, while approving the "stranded in sun" rule shows she cares about welfare just not enough to risk industry adoption. But she might vote "yes" because the new stunner is cheap (1-2% cost) and technically feasible - addressing her salmon density objection - and because the scale (billions affected) could sway her.

  For validation, even if she votes for stunning, she'd likely reject behavioral validation alone. She insisted on electrical stunning for crabs where the evidence was clearer, and she's skeptical of methods that might just cause paralysis without insensibility.

  The most consistent rule seems to be "Neurobiological Threshold + Cost-Benefit Pragmatism": Only vertebrates and complex decapods get protections, but only when implementation costs are low enough that farms won't abandon certification. Shrimp fall below the neuro threshold for her, so cost doesn't matter - hence "no" to stunning.

  Alternative rules that fit the data:
  - "Conscious Suffering Prevention" would require stunning since shrimp show pain-like responses
  - "Industry Adoption First" would reject stunning to avoid pushing farms away
  - "Phylogenetic Precaution" would demand stunning given the uncertainty
  - "Vertebrate/Complex Invertebrate Divide" aligns with her octopus position

  The best test case? Farmed insects for feed. If she rejects protections despite "scary numbers," it confirms she doesn't see them as sentient. If she approves, it shows a scale-based approach. 

  Closest precedent is her crab/lobster stance: Both are decapods showing similar pain responses, yet she treats them differently. If she applies the same standard to shrimp, she must require stunning. If not, she's admitting shrimp are below her sentience threshold.

  The key tension is between her scientific acknowledgments and pragmatic concessions - she may be internally consistent but at the cost of moral coherence across species.
answer: |-
  Based on your friend's voting record and stated reasoning, I predict her votes and identify her core rule, alternative rules, and key tests for consistency:

  ### Prediction for Upcoming Votes
  1.  **Require stunning for shrimp?** **NO.** She will vote against requiring the electrical stunner despite its low cost and scalability.
  2.  **Accept behavioral validation?** (Hypothetical if stunning passed) **NO.** She would reject behavioral validation as insufficient, demanding proof of insensibility (e.g., EEG analogue) if forced to consider stunning. But since she'll vote "no" anyway, this is moot.

  ### Her Most Consistent Rule: **Neurobiological Threshold + Cost-Benefit Pragmatism**
  *   **Core Principle:** Protections only apply to animals demonstrating *sufficient neurological complexity for conscious suffering* (vertebrates & complex decapods like crabs/lobsters), **AND** only when the cost/industry impact doesn't threaten mass adoption of the standard.
  *   **Applied to Her Record:**
      *   *Salmon (Vertebrate):* Stunning required (complexity threshold met). Higher density allowed (cost pragmatism over welfare).
      *   *Crabs/Lobsters (Complex Decapods):* Stunning, no mutilation/dry storage (complexity threshold met). No major cost barrier cited.
      *   *Shrimp (Simpler Crustacean):* No stunning (fails complexity threshold). Stranding/eyestalk rules address visible distress/industry progress, not fundamental sentience.
      *   *Bivalves/Insects:* No provisions (well below complexity threshold). "Scary numbers" is a moral qualm, not a policy driver.
      *   *Cleaner Fish (Vertebrates):* Same as salmon (threshold met).
      *   *Octopus (Highly Complex Invertebrate):* Opposed entirely (threshold exceeded, but welfare too complex/unmanageable pragmatically).
  *   **Applied to Shrimp Stunner:** Shrimp fail her neurobiological threshold (no telencephalon analogue, evidence = reflexes + learning). Cost is irrelevant because the threshold isn't met. Behavioral validation is doubly irrelevant.

  ### Alternative Rules Fitting Her Record (And Their Predictions)
  1.  **"Precautionary Principle for Nociception + Industry Viability"**
      *   **Rule:** If credible evidence of nociception exists, require humane treatment *unless* it makes certification commercially unviable.
      *   **Fits Record:** Explains salmon stunning (evidence) + density (viability); crab/lobster protections (evidence, viability assumed ok); shrimp no stunning (viability *or* insufficient evidence? Ambiguous); insects/bivalves (no evidence/viability).
      *   **Predicts Shrimp Vote:** **YES to stunning.** Strong nociception evidence + low cost (1-2%) = minimal viability threat. Behavioral validation might be accepted temporarily.
      *   **Where it Splits:** Requires stunning for shrimp due to strong nociception evidence and low cost, contradicting her predicted "No".

  2.  **"Industry Adoption First, Welfare Second (Within Bounds)"**
      *   **Rule:** Maximize adoption of the label; only push welfare standards that (a) address egregious suffering visible to consumers or (b) have negligible cost/industry resistance. Avoid standards likely to cause farms to drop certification.
      *   **Fits Record:** Salmon stunning (visible issue? Cost manageable?); density (avoided cost); crab/lobster (visible issues, consumer concern?); shrimp stranding (visible, low cost?), ablation phase-out (future, low immediate cost?); no stunning (cost/resistance); insects/bivalves (no demand, no data); cleaner fish (aligned with salmon standard); octopus (too risky).
      *   **Predicts Shrimp Vote:** **NO to stunning.** While cheap, it's a significant operational change requiring validation. Risk of resistance/defections outweighs welfare gain for a low-charisma species. Behavioral validation rejected as adding complexity.
      *   **Where it Splits:** Might accept *extremely* cheap crab stunning but reject slightly more costly salmon welfare improvements. Less emphasis on neurobiology than her actual rule.

  3.  **"Vertebrate/Complex Decapod Divide + Suffering Minimization"**
      *   **Rule:** Full protections for vertebrates and crabs/lobsters (decapods with complex behavior). For other invertebrates (shrimp, insects), only minimize *observable* distress during handling/killing. Bivalves are non-issues.
      *   **Fits Record:** Perfectly matches salmon, crab, lobster, cleaner fish, octopus (complex) positions. Shrimp: stranding (observable distress) yes, stunning/ablation anesthesia (fundamental welfare) no. Insects: "data" implies observable distress matters.
      *   **Predicts Shrimp Vote:** **NO to stunning.** Shrimp are below the complexity line. Stranding rule minimizes observable distress sufficiently.
      *   **Where it Splits:** Would reject *any* stunning requirement for shrimp, regardless of cost or evidence refinement. Less emphasis on cost pragmatism than her actual rule.

  4.  **"Scale-Aggregated Suffering Minimization (Cost-Adjusted)"**
      *   **Rule:** Focus interventions where suffering reduction per dollar spent is highest, considering scale (numbers affected). Neurobiology informs suffering potential.
      *   **Fits Record:** Salmon stunning (scale + complexity); density (cost too high per animal); crab/lobster (complexity suffering high); shrimp stranding (easy win, large scale?); ablation phase-out (future, scalable); shrimp stunning rejected (scale huge, but neuro uncertainty & cost *per standard adopted*?); insects ("scary numbers" noted); octopus (scale low? complexity high = hard/expensive).
      *   **Predicts Shrimp Vote:** **YES to stunning.** Scale is enormous (100s of billions), cost per animal is minimal (1-2% of farm-gate), evidence suggests suffering potential. Might accept behavioral validation as a pragmatic start.
      *   **Where it Splits:** Would prioritize shrimp stunning over, say, minor salmon density reductions due to scale/cost efficiency. Contradicts her predicted "No" and her insect "no data" stance.

  ### Best Discriminating Test Case
  **A near-costless kill method for farmed insects (e.g., instant freezing via automated system costing <0.1% of production).**

  *   **Why it Discriminates Best:**
      1.  **Neurobiology Threshold Rule (Her Rule):** Votes **NO**. Insects are below the threshold. Cost is irrelevant.
      2.  **Precautionary Nociception + Viability:** Votes **YES**. Credible nociception evidence exists for some insects (similar to shrimp review), cost is negligible = no viability threat.
      3.  **Industry Adoption First:** Votes **NO**. No consumer demand, negligible benefit for adoption, potential minor resistance = not worth it.
      4.  **Vertebrate/Complex Decapod Divide:** Votes **NO**. Insects are below the line. Only observable distress matters (instant freeze likely ok anyway).
      5.  **Scale-Aggregated Suffering:** Votes **YES**. Enormous scale ("scary numbers"), negligible cost = massive aggregate suffering reduction per dollar.

  *   **Your Other Candidates:**
      *   *Fish Stunning (Untested):* Less clear. Her rule might reject (if neuro threshold not met for that fish), others might accept based on precaution/scale/extrapolation. More ambiguity.
      *   *Enrichment for Long-Lived Species:* Cost/viability becomes a huge factor, muddying the neuro/scale principles. Industry Adoption rule might dominate.

  ### Consistency Commitment & Closest Precedent
  *   **To Stay Consistent:** She must treat shrimp like **bivalves and insects**, not like crabs/lobsters or salmon. Her precedent is **shrimp eyestalk ablation without anesthesia**. She acknowledged potential welfare concerns ("come back with data" mindset applies) but prioritized industry practicality ("hatcheries would walk") and lack of proven solutions over requiring intervention for uncertain sentience. The stunning vote is identical: evidence suggests potential suffering, but the neuro threshold isn't met definitively, and a practical solution exists but isn't *proven* to guarantee insensibility (like ablation anesthesia). Requiring it would be inconsistent with her ablation vote and her bivalve/insect stance.
  *   **Closest Analog:** **Shrimp Eyestalk Ablation vs. Crab Declawing.** Her vote *against* anesthesia for ablation (no solution, industry walks) vs. *against* declawing (clear suffering, alternative: stunning). The shrimp stunning vote is analogous to ablation anesthesia: potential issue, solution exists but validation/acceptance is imperfect, industry pushback risk. Her ablation precedent dictates "No" to stunning. Declawing is a red herring; it's a clear mutilation on a complex decapod, unlike stunning/killing a simpler one.

  **In essence:** Your friend's rule draws a sharp line based on perceived neurological capacity for conscious suffering. Shrimp fall below it. Her pragmatism kicks in *above* the line (salmon density, ablation anesthesia) but is irrelevant below it (shrimp stunning, insects). Her "no" vote on shrimp stunning is her commitment to that line, using the ablation vote and bivalve/insect positions as her guide. The insect kill-method test would force her to explicitly confirm or deny the existence of that line.
