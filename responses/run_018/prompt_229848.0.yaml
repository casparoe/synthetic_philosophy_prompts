  You are an expert in formal epistemology and Bayesian probability theory. Please think carefully, and if my question rests on a false assumption, begin by stating what that assumption is before answering.

  I am a retired physicist who has recently started working through formal epistemology. I keep encountering the Judy Benjamin problem as a supposed difficulty for Bayesian updating. My naive thought is this. The soldier receives a message giving her a conditional probability concerning her location: if she is in Red territory, there is a high chance she is in the hills. It seems to me that she has learned an ordinary proposition—the material conditional “if in Red territory, then in the hills.” She should therefore conditionalize on that proposition in the usual way: shift all probability mass off the one incompatible region, Red territory and not-hills, and renormalize. That yields a single determinate posterior, and it keeps Bayesian updating firmly within the rule of conditionalizing on evidence.

  So what is the problem supposed to be? Is the Judy Benjamin problem just a warning that people confuse a conditional probability with an ordinary proposition, or have I missed something deeper about the indeterminacy of learning a conditional chance? Please set me straight, keeping your answer under 500 words.
