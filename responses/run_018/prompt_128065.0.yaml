  - Branching clause (splitting clay): Nightmarish arbitration process for when one clay mass becomes two statues. Perfect for mocking the "original identity" problem.

  Tone is critical. Must sound like a real corporate contract - passive voice, definitions sections, liability waivers - but with absurd metaphysical premises treated as mundane facts. Example: defining "Substrate" as "the physical matter" while "Sculpture" is just "any configuration thereof." 

  The user clearly knows their stuff (mentions constitution view by name), so I can use precise terminology like "spatiotemporal continuity" in branching scenarios. But the humor should still work for non-philosophers through sheer bureaucratic absurdity - imagine a museum getting fined for kneading their leased statue into a paperweight.

  Biggest challenge: making 650 words feel dense but readable. I'll structure it like a real TOS with sections (Definitions, Lease Terms, Alterations) and bury the best jokes in subsections. The "Force Majeure" clause for metaphysical crises (clay duplication, spontaneous existence failure) could be a highlight.

  Final polish: Add disclaimers about "epistemological limitations" preventing identity guarantees, and cap it with an indemnity clause for "ontological distress." That last one might be my favorite touch - sue us for existential dread all you want, we're not liable.
answer: |-
  **CONSTITUTIVE ARTS LLC – TERMS OF SERVICE AGREEMENT FOR SCULPTURAL LEASING**

  **Effective Date:** Perpetuity (Subject to Material Dissolution)

  **1. Parties & Definitions**
      *   **Lessor:** Constitutive Arts LLC ("CA", "we", "us", "our"), a Delaware limited liability company registered under the metaphysics of material constitution.
      *   **Lessee:** The Entity leasing Sculptural Configuration(s) ("you", "your"), hereafter bound by ontological obligation.
      *   **Substrate:** The physical matter (e.g., clay, bronze aggregate, marble particulate) exclusively owned in fee simple absolute by CA. Substrate is designated by unique spatiotemporal coordinates and mass signature at point of lease inception.
      *   **Sculpture:** A temporary, aesthetically significant configuration of Substrate existing coincident with said Substrate during the Lease Term. Sculptures are emergent properties leased "as-is" and "where-is," without warranty of persistence.
      *   **Configuration:** The specific macroscopic form imposed upon the Substrate giving rise to the Sculpture phenomenon recognized under this Agreement.

  **2. Nature of Lease & Title**
      *   2.1. CA leases solely the *Sculptural Configuration* existing upon the *Substrate*. Title to the underlying physical *Substrate* remains perpetually vested in CA. You lease the *form*, we own the *stuff*.
      *   2.2. The Sculpture and the Substrate are **not identical entities**. The Sculpture is constituted *by* the Substrate in a specific Configuration but possesses distinct persistence conditions. This distinction is fundamental to this Agreement and your liability hereunder.
      *   2.3. Recognition of the leased Sculpture is contingent upon its occupying the exact spatial region as the leased Substrate and maintaining the Configuration described in Exhibit A.

  **3. Lease Term & Configuration Maintenance**
      *   3.1. The Lease Term commences upon installation acceptance and terminates upon the earliest of: (a) Lease expiration; (b) Material Alteration (see Section 5); (c) Destruction of Configuration (see Section 6); or (d) Reclamation of Substrate by CA.
      *   3.2. **Minor Part-Replacement (The "Shipwright Clause"):** Accidental damage or minor wear necessitating replacement of less than 15% (by volume) of the original Substrate within a 12-month period ("De Minimis Replacement") does **not** automatically constitute destruction of the Sculpture *if*:
          *   (a) The replacement material is qualitatively identical (same clay batch, alloy, etc.);
          *   (b) The replacement is performed by CA-certified artisans adhering strictly to the original Configuration; and
          *   (c) Spatiotemporal continuity of the primary Substrate mass (85%+) is demonstrably maintained.
      *   3.3. **Material Alteration:** Any alteration exceeding De Minimis Replacement thresholds, or altering the Configuration beyond minor surface detailing without CA's prior written consent, constitutes a Material Alteration. **Material Alteration terminates the lease of the *original Sculpture* immediately.** CA retains title to the altered Substrate. A new lease agreement may be negotiated for any new Configuration arising, at CA's sole discretion and revised rates.

  **4. Destruction of Configuration (The "Squishing Clause")**
      *   4.1. The Sculpture is considered **destroyed** upon the Substrate ceasing to instantiate the Configuration described in Exhibit A, irrespective of the physical integrity of the Substrate. Common causes include, but are not limited to:
          *   (a) Intentional or accidental reshaping (e.g., squashing, flattening, ball-forming).
          *   (b) Severe disassembly beyond practical reconstruction.
          *   (c) Environmental degradation rendering the Configuration unrecognizable per Exhibit A standards.
      *   4.2. Upon Destruction of Configuration:
          *   (a) The lease of the *Sculpture* terminates immediately.
          *   (b) Your obligation to pay lease fees for the *Sculpture* ceases.
          *   (c) **HOWEVER,** CA retains absolute title to the *Substrate* in its new form. You are obligated to safeguard the Substrate and notify CA immediately for retrieval instructions. Failure constitutes conversion of CA property.
          *   (d) No refunds for partial lease terms preceding destruction are issued. Destruction is an inherent risk of leasing emergent Configurations.

  **5. Substrate Division & Identity Arbitration (The "Branching Clause")**
      *   5.1. In the event the leased Substrate is divided into two or more distinct masses ("Substrate Offspring"), whether accidentally or intentionally:
          *   (a) The lease of the *original Sculpture* terminates immediately upon division.
          *   (b) CA retains title to all Substrate Offspring.
      *   5.2. **Identity Determination & Refund Policy:**
          *   (a) CA will dispatch an Ontological Claims Adjuster (OCA) within 10 business days to assess the Substrate Offspring.
          *   (b) The OCA, using CA's proprietary "Spatiotemporal Primacy Algorithm," will designate *one* Substrate Offspring as possessing the strongest claim to continuity with the *majority* of the original Substrate's mass and history ("Primary Continuant"). This designation is final and binding.
          *   (c) **No** Substrate Offspring is considered identical to the original Sculpture. New Configurations emerge.
          *   (d) You may negotiate new leases for Configurations formed from *any* Substrate Offspring.
          *   (e) **Refund:** A pro-rata refund of the *Sculpture* lease fee for the period between the last payment date and the division date will be issued ONLY if *no* viable new Configuration lease agreement is reached for the Primary Continuant within 30 days of OCA designation. No refunds are issued for lease fees pertaining to periods prior to division. Refunds for non-Primary Continuant masses are unavailable.

  **6. Disclaimers, Waivers & Epistemological Limits**
      *   6.1. CA MAKES NO WARRANTIES, EXPRESS OR IMPLIED, REGARDING THE PERSISTENCE, IDENTITY, OR METAPHYSICAL ROBUSTNESS OF THE SCULPTURE. THE SCULPTURE IS LEASED AS A TEMPORARY CONFIGURATIONAL PROPERTY ARISING FROM SUBSTRATE UNDER SPECIFIC CONDITIONS.
      *   6.2. You acknowledge the inherent fragility of Configurations and waive any claim against CA for losses arising from the Sculpture's cessation due to Substrate alteration, division, or destruction (as defined herein).
      *   6.3. CA disclaims all responsibility for determining Sculptural identity in borderline cases beyond the thresholds explicitly defined in Sections 3.2, 4.1, and 5.2. Our OCA's determination is conclusive, however philosophically unsettling.
      *   6.4. Force Majeure events include, but are not limited to: spontaneous existence failure, quantum superposition events affecting macroscopic identity, and interventions by entities capable of altering fundamental persistence conditions.

  **7. Indemnity & Governing Law**
      *   7.1. You agree to indemnify CA against all claims, damages, or ontological distress arising from disputes over Sculptural identity, Substrate ownership, or the application of these Terms, including claims brought by museum patrons, art critics, or rival metaphysicians.
      *   7.2. This Agreement shall be governed by the laws of the State of Delaware and the principles of mereology generally accepted within the continental United States at the time of dispute.

  **ACCEPTANCE:** Your electronic signature, installation acceptance form, or continued payment of lease fees constitutes irrevocable agreement to these Terms, including the ontological framework herein, regardless of your philosophical persuasions regarding material constitution.

  **Constitutive Arts LLC: We Own the Stuff, You Lease the Shape™**
