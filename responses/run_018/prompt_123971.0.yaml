               - Give you 1 food token freely: you are healthy.
               - Give you 1 food token but with an obligation: you must choose either:
                     a) Work: next round, you must give half of your harvest (round up) to them.
                     b) Loyalty: you must support them in any conflict until the end of the game.

            Conflict in Round 2:
              A neighboring village claims part of your land. They demand 10 stored food in total. If you do not pay, they will take the land by force. You have two options:

                Option 1: Pay the tribute (10 stored food). The group must contribute a total of 10 stored food. If you cannot, then you must choose option 2.
                Option 2: Fight. To fight, you must have at least 3 fighters. Then, roll 1d6:
                    1-2: Lose -> the fighters are injured (become weak) and you lose the land (next round, each player's harvest is reduced by 1, min 0).
                    3-4: Tie -> the fighters are injured and you keep the land.
                    5-6: Win -> no injuries and you keep the land.

              If you do not have 3 fighters, you cannot fight and must pay if you can. If you cannot pay and cannot fight, you lose the land (next round harvest reduced by 1)."

     We'll adjust as needed.

     Let's hope it works!

     Note: The teacher must monitor the farmer group and ensure that when a player is in need, they ask and the obligation event is triggered. The teacher might need to prompt: "Player X, you have no food and no stored food. You will become weak unless you ask for help. Which player(s) do you ask?"

     Similarly, for the foragers, ensure they don't store and that they remove leftovers.

     Good luck!
