  ### **Agricultural Revolution Simulation: "The Hidden Cost of Surplus"**

  #### **Learning Goal**  
  Students experience how **stored surplus** in farming societies creates invisible debt-obligations that lead to hierarchy, contrasting with the immediate-sharing economy of foragers. The debrief ties emergent obligations to social inequality, while acknowledging real-world tradeoffs (health, ecology).

  ---

  ### **Setup**  
  - **Time:** 75 mins total (15 setup, 30 gameplay, 30 debrief).  
  - **Students:** Split into two groups of 7:  
    - **Foragers** (Group A): Nomadic hunter-gatherers.  
    - **Farmers** (Group B): Early agricultural village.  
  - **Space:** Groups sit separately. No communication between groups.  
  - **Materials:**  
    - **Foragers:** 20 "resource tokens" (e.g., dried beans, paper dots), 1d6 die, spoilage bin (box/bowl).  
    - **Farmers:** 20 tokens, 1d6 die, storage containers (small cups/bowls).  
    - **All:** Role cards (1 per student, see below), timer, whiteboard for rules.  

  ---

  ### **Rules (Written on Board)**  
  #### **Core Mechanics**  
  - **Rounds:** 3 seasons (6 mins each). Each round:  
    1. **Produce resources** (roll die).  
    2. **Distribute/trade resources**.  
    3. **Meet survival needs** (1 token/person to avoid "hunger").  
  - **Hunger:** Anyone without 1 token becomes "sick" (can’t contribute next round).  

  #### **Group-Specific Rules**  
  | **Foragers (Group A)** | **Farmers (Group B)** |  
  |------------------------|------------------------|  
  | - **No storage:** Unused tokens go to spoilage bin immediately after distribution. | - **Storage allowed:** Keep tokens in personal containers. |  
  | - **Resource roll:** `1d6` = total tokens for group. | - **Resource roll:** `1d6 + 2` = total tokens for group. |  
  | - **Conflict (Round 2):** "Drought! Roll 1d6. If ≤3, lose 50% of next round’s tokens." | - **Conflict (Round 2):** "Raiders demand 5 tokens! Pay or lose 50% of stored tokens." |  

  > **💡 Hidden Mechanic (Farmers Only):**  
  > Stored tokens >1 automatically create **"obligation chips"** (teacher secretly gives these to farmers with surplus). An obligation chip = a favor owed (labor/loyalty). *Reveal only when a player uses one*.  

  ---

  ### **Roles (1 Card Per Student)**  
  **Foragers (Group A):**  
  - Hunter, Forager, Storyteller, Scout, Healer, Fire-Tender, Child-Carer.  
    *All roles equal. No explicit hierarchy.*  

  **Farmers (Group B):**  
  - Head Farmer, Grain Manager, Weaver, Potter, Guard, Herder, Laborer.  
    *Subtle hierarchy: Head Farmer speaks first.*  

  ---

  ### **Game Flow**  
  1. **Round 1 (Spring):**  
     - Foragers: Roll `1d6`, distribute tokens. **Destroy leftovers.**  
     - Farmers: Roll `1d6+2`, distribute/store tokens. **Teacher secretly gives obligation chips** to players storing ≥2 tokens.  
     - *Debrief note:* Farmers start stockpiling. Foragers share equally.  

  2. **Round 2 (Summer):**  
     - **Conflict hits!** Foragers face drought; Farmers face raiders.  
     - Foragers: Vote on coping (e.g., move camp? ration?). Unused tokens spoil.  
     - Farmers: Head Farmer decides raider response. **Obligation chips activate:**  
       - *Example:* Grain Manager (surplus holder) "calls in favor" from Laborer (low stock) for extra work.  
     - *Teacher prompt:* "Farmers with surplus, you sense others owe you something. Will you collect?"  

  3. **Round 3 (Fall):**  
     - Foragers: Recover from drought. New tokens spoil if unused.  
     - Farmers: Stored tokens grow. **Hierarchy solidifies:** Obligation-holders demand favors openly.  

  ---

  ### **Debrief (30 mins)**  
  1. **Group Reflections:**  
     - Foragers: "How did spoilage shape sharing? Was there hierarchy?"  
     - Farmers: "When did obligations emerge? How did power dynamics shift?"  

  2. **Key Teaching Points:**  
     - **Surplus → Debt:** Stored grain = social leverage. "I fed you, now you owe me."  
     - **Hierarchy Birth:** Obligations formalize into rank (Head Farmer > Laborer). Contrast foragers’ flat structure.  
     - **Real-World Tradeoffs:**  
       - ✅ Farming’s surplus enabled cities, art, states.  
       - ❌ Hidden costs: Shorter lifespans, disease, **ecological lock-in** (can’t return to foraging once land/population changes).  

  3. **What the Game Misses:**  
     - Health costs (farmers: worse nutrition, denser diseases).  
     - Slow violence: Hierarchy took generations to solidify.  
     - Environmental tipping points (deforestation, soil depletion).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Farmer hoarder breaks simulation.  
    - **Fix:** Teacher intervenes: "Your hoarding causes resentment. The group votes to banish you unless you share."  
  - **Problem:** Foragers ignore spoilage rule.  
    - **Fix:** Enforce strict token disposal. "Rotten berries attract wolves! Lose 2 tokens."  
  - **Problem:** Farmers don’t use obligations.  
    - **Fix:** Secretly prompt surplus-holders: "Remind X they ate your grain last winter."  

  ---

  ### **Why This Works**  
  - **Discovery > Lecture:** Students *feel* obligations emerge organically in farming.  
  - **Contrast:** Foragers’ scarcity forces egalitarianism; farmers’ surplus breeds dependency.  
  - **Tangible Abstraction:** Tokens = food, obligation chips = social debt.  

  **Casual vibe encouraged!** Use beans as tokens, doodle roles on index cards, and lean into the chaos. The goal is visceral understanding, not perfect replication.
