prompt: |-
  Write the desiderata that a theory of real-pattern recognition must meet in order to justify selecting the physical, design, or intentional stance toward a system, paying special attention to hybrid domains—such as evolved algorithms, synthetic biological circuits, and institutional protocols—where all three stances are available yet yield conflicting predictions. For each requirement, provide the case or conceptual distinction that motivates it (for example, preserving the difference between counterfactual robustness and mere correlation, or blocking the reduction of design explanations to intentional ones), indicate which are non-negotiable and which are camp-specific preferences (such as ontological parsimony versus predictive leverage), and state whether any subset of these desiderata is jointly unsatisfiable in light of standard criticisms of stance-based ontology. Keep the focus on the criteria themselves; you may briefly note how Dennett’s original account stands against the list, but do not provide a bibliography or reading list. Answer in British English.
reasoning: |-
  Okay, the user wants me to write desiderata for a theory of real-pattern recognition that helps decide when to use the physical, design, or intentional stance—especially in tricky hybrid cases like evolved algorithms or synthetic biology where these stances might conflict. They also want me to address which criteria are essential versus debatable, and whether some might be incompatible.

  First, I need to unpack what the user is really asking. They mention Dennett's stances and hybrid domains where all three apply but conflict. So the core challenge is how to choose the "right" stance when predictions clash. The user likely wants a structured framework to resolve such conflicts, not just a recap of Dennett. 

  Hmm, the user also specifies British English and avoids bibliographies, so I'll keep citations implicit. They seem academically inclined—probably a philosopher or cognitive scientist wrestling with stance selection in complex systems. Their unspoken need might be practical: a decision procedure for real-world cases where reductionism fails.

  For the desiderata, I'll start with non-negotiables. The theory must handle conflicting predictions head-on. That means requiring counterfactual robustness over mere correlation. Otherwise, you couldn't tell if a bird's wing is *for flying* (design stance) or just a physical flap (physical stance). Also, stance irreducibility feels essential—design explanations shouldn't collapse into intentional ones, or we'd misattribute purpose to evolution. 

  Now for negotiables. Some camps prioritize ontological parsimony (e.g., eliminativists avoiding design talk), others want predictive leverage (engineers might tolerate "purpose" if it helps). I should flag these tensions, like how predictive power might demand stance pluralism despite parsimony advocates hating it. 

  Hybrid domains are key motivators. Take blockchain protocols: intentional stance (miners' incentives), design stance (consensus algorithm), physical stance (hardware limits) all apply but predict different behaviors under stress. The theory must weigh which stance dominates when. 

  Oh! Joint unsatisfiability is crucial. Critics say stance-based ontology is arbitrary—e.g., why not reduce everything to physics? The desiderata must confront this. Maybe by requiring stance selection to track objective patterns (like Dennett's "real patterns"), but that risks circularity. I'll note that tension. 

  Dennett’s view fits partially: he'd agree on irreducibility and counterfactuals, but his stance relativism might clash with non-negotiable objectivity demands. I'll mention this briefly without diving deep. 

  Finally, I'll structure each desideratum with: (1) the requirement, (2) a motivating case, (3) negotiability status, (4) incompatibility notes. Keep it crisp—user wants criteria, not commentary.
answer: |-
  Here are the desiderata for a theory of real-pattern recognition justifying stance selection, addressing hybrid domains and tensions:

  1.  **Counterfactual Robustness over Mere Correlation:**
      *   **Requirement:** Must distinguish patterns whose behaviour holds across relevantly similar counterfactual scenarios (robust) from those only describable via statistical correlation in one actual state.
      *   **Motivation:** A thermostat's 'goal' (design stance) predicts behaviour under temperature changes; a coincidentally correlated electrical noise pattern does not. Hybrid case: An evolved foraging algorithm robustly solves problems in varied environments (design stance) vs. a temporary neural state correlating with success once.
      *   **Status:** Non-negotiable. Essential for identifying projectible patterns.
      *   **Conflict:** Potential tension with ontological parsimony if robust patterns proliferate.

  2.  **Stance Irreducibility:**
      *   **Requirement:** Must prevent the *explanatory* reduction of patterns properly identified by one stance to another without predictive or explanatory loss. Design explanations ≠ intentional explanations; physical patterns ≠ design functions.
      *   **Motivation:** Explaining a ribosome's function via evolutionary design yields different predictions (e.g., failure modes under mutation) than reducing it solely to atomic physics or attributing agency to it. Hybrid case: A synthetic genetic circuit's designed function predicts failure if component thresholds are breached (design stance), distinct from its molecular kinetics (physical) or misattributed 'purpose' (intentional).
      *   **Status:** Non-negotiable for preserving distinct explanatory domains. Prevents stance conflation.
      *   **Conflict:** Parsimony advocates may seek reductionism; functionalists resist.

  3.  **Predictive Leverage & Efficiency:**
      *   **Requirement:** The selected stance must offer significantly superior predictive power or computational tractability for the system's behaviour under relevant conditions compared to the alternatives.
      *   **Motivation:** Predicting a chess computer's move via its algorithm (design stance) is feasible; simulating its transistors (physical) is intractable; attributing human-like desires (intentional) is inaccurate. Hybrid case: Predicting institutional behaviour via rules/protocols (design stance) is efficient vs. modelling all human agents (intentional) or physical transactions (physical).
      *   **Status:** Core justification *for* stance adoption. Degree of leverage required is negotiable (e.g., pragmatists vs. realists).
      *   **Conflict:** May clash with parsimony if the most predictive stance is ontologically 'richer' (e.g., intentional).

  4.  **Domain-Specific Granularity:**
      *   **Requirement:** Must identify the appropriate *level of abstraction* and *relevant domain of variation* for applying a stance. Stances are not global but context-dependent.
      *   **Motivation:** The physical stance explains a bridge's collapse under overload; the design stance explains its load-bearing function under normal use. Hybrid case: For an evolved algorithm, the design stance explains its function against *environmental* variations; the physical stance explains its failure due to *material* degradation. Ignoring granularity leads to stance misapplication.
      *   **Status:** Non-negotiable for accurate application. Defines the scope of a stance's validity.
      *   **Conflict:** Determining the "relevant" domain can be contentious, especially in hybrids.

  5.  **Pattern Objectivity (Minimal):**
      *   **Requirement:** Must ground pattern recognition in features *of the system and its environment*, not solely in the observer's interests, ensuring patterns are discoverable (not just imposed).
      *   **Motivation:** Distinguishes a genuine evolutionary adaptation (a real design pattern) from an arbitrary anthropomorphic projection onto random physics. Hybrid case: The error-correction protocol in a distributed network is objectively identifiable via its counterfactual robustness, not just because we find it useful.
      *   **Status:** Non-negotiable minimal realism. Prevents radical instrumentalism. The *degree* of objectivity (e.g., strong realism vs. pragmatic realism) is negotiable.
      *   **Conflict:** Instrumentalists may downplay this; realists demand it.

  6.  **Conflict Resolution Protocol:**
      *   **Requirement:** Must provide principles for adjudicating conflicting predictions from different stances applicable to the same hybrid system in a specific context.
      *   **Motivation:** When an evolved circuit fails: Is it due to a component exceeding thermal limits (physical stance prediction), a flaw violating its evolved function (design stance), or misattributed 'malice' (intentional stance)? The theory needs rules (e.g., privilege the stance offering the most specific, robust counterfactual for *this* failure mode).
      *   **Status:** Non-negotiable for handling hybrids. Absence renders the theory impotent in key cases.
      *   **Conflict:** The protocol's rules themselves may be camp-specific (e.g., physicalists default to physical explanations).

  7.  **Ontological Parsimony vs. Explanatory Power Trade-off Acknowledgment:**
      *   **Requirement:** Must explicitly recognise that stance selection often involves a trade-off between minimising ontological commitments (favour physical stance) and maximising predictive/explanatory leverage (often favouring design/intentional).
      *   **Motivation:** Explaining complex institutional behaviour solely via physics is hopelessly complex; explaining basic thermodynamics via agency is gratuitous. Hybrid case: Analysing ant colony optimisation: Physical description is intractable, intentional attribution (to the colony) is misleading, design stance (evolved algorithm) offers optimal leverage.
      *   **Status:** Negotiable preference. Physicalists prioritise parsimony; functionalists prioritise leverage. The theory must accommodate both but can weight them differently.
      *   **Conflict:** The core tension itself – cannot maximise both simultaneously.

  **Joint Unsatisfiability & Criticisms:**

  *   **The Reductionist Challenge:** A core criticism is that only the physical stance describes fundamental reality; design/intentional stances are merely useful fictions. Desiderata 2 (Irreducibility) and 5 (Minimal Objectivity) are fundamentally incompatible with strong reductionism. A theory satisfying these *must* reject eliminative reductionism.
  *   **The "Real Pattern" Tension:** Defining "Real Pattern" rigorously enough to satisfy 1 (Robustness) and 5 (Objectivity) without collapsing into either pure physics (violating 2 & 3) or excessive subjectivity is notoriously difficult. Critics argue any such definition is either circular or insufficiently objective.
  *   **Conflict Resolution vs. Parsimony:** Providing a robust conflict resolution protocol (6) might necessitate complex meta-rules, violating ontological parsimony (7) from a strict physicalist perspective. Satisfying 6 robustly may inherently conflict with a strong interpretation of 7.
  *   **Granularity vs. Universality:** The context-dependency required by Granularity (4) makes it difficult to formulate universal stance-selection rules, which can seem unsatisfying.

  **Dennett's Account:**

  Dennett's original view strongly emphasises 3 (Predictive Leverage) and 7 (acknowledging the parsimony/leverage trade-off, leaning towards leverage). He endorses 1 (Counterfactual Robustness) as key to "real patterns" and 4 (Granularity/Context). He champions 2 (Irreducibility) for intentional systems. However, his stance instrumentalism arguably strains 5 (Minimal Objectivity), making it vulnerable to subjectivity charges. He doesn't explicitly provide a strong 6 (Conflict Resolution Protocol) for hybrids, sometimes defaulting to the "most efficient predictor". His account is less equipped for the hybrid conflict resolution demanded here.
