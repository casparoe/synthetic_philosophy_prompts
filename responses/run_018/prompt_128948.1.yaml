  The user wants a concrete example that serves two purposes: one where a preference appears principled but might be laundering disgust (like "clean meat is unnatural"), and the reverse where a bias looks like preference. They want to avoid the overused factory farming vs. veganism debate. So I need a fresh example that's relatable and non-polarizing. Maybe something like tattoos? People might oppose them as "unprofessional" in corporate settings, which seems principled but could be laundering discomfort with body art. Conversely, supporting tattoos as "self-expression" might overlook bias against traditional norms. Tattoos are culturally variable, involve sensory disgust (pain, ink), and have shifting social acceptance, making them suitable.

  Addressing misconceptions is crucial. The user expects students to think implicit association tests (IAT) can settle bias, confuse revealed preference with moral justification, and equate consistency with lack of bias. I should tackle these after introducing the laundering concept but before the deep dive. Specifically, after Step 3, explain that IAT shows associations but not their moral validity, distinguish preference from justification, and challenge the consistency argument by showing how biases can be stable yet laundered.

  For the final check, the user wants a question to test understanding of the laundering structure. A good question could be: "How could someone's sincere moral opposition to X be explained as a culturally reinforced disgust response, and what evidence would distinguish it from a reasoned stance?" This forces them to apply the laundering framework rather than just regurgitate concepts.

  The user also wants to know what to exclude. Definitely avoid meta-ethical anti-realism and the full history of preference theory to keep the session focused. Mentioning these limits upfront prevents scope creep.

  I should ensure the session is interactive. Using anonymous polls or quick debates helps engage students and makes abstract concepts tangible. Timing each segment is important to cover all parts in a one-off session. Highlighting that the goal isn't resolution but recognizing the problem keeps expectations realistic.

  Lastly, the user's deeper needs might include wanting students to question their own biases and apply this framework in their research. Emphasizing reflexivity and the challenge of disentangling intuitions from principles addresses that. Making the content relatable without triggering defensiveness is key, hence choosing a neutral example like tattoos.
answer: |-
  Here's a focused teaching plan sequencing concepts for maximum conceptual leverage, targeting your goals and preempting misconceptions:

  **Core Objective:** Equip students to identify the *structural problem* of distinguishing culturally laundered bias from authentic moral preference when both manifest as "principled" intuitions.

  **The Sequence & Rationale:**

  1.  **Anchor: The Phenomenology of Moral Intuition (15 mins)**
      *   **Activity:** Quick anonymous poll: "Think of something you find *morally* off-putting (not just gross or inconvenient). How does that feeling *present itself* to you? Is it more like: (a) A strong taste/dislike (e.g., cilantro), (b) A logical deduction, (c) An obvious truth, (d) A deeply felt 'wrongness'?"
      *   **Discussion:** Focus on the *immediacy, felt certainty, and resistance to easy articulation* that characterize many moral intuitions. Hammer home: **Moral judgments often *feel* like basic preferences/disgust responses ("taste")**, not the conclusion of deliberate reasoning. *Why start here?* It grounds everything in subjective experience, making it relatable. It establishes the "raw feel" that laundering operates on.

  2.  **Layer 1: Taste is Culturally Calibrated (20 mins)**
      *   **Activity:** Present contrasting examples of "acquired taste" with strong cultural components:
          *   Food: Durian (beloved/disgusting), Insects as food (delicacy/abhorrent), varying disgust thresholds for "offal" (liver, blood, etc.).
          *   Non-food: Physical proximity norms (hugging vs. bowing), concepts of "punctuality".
      *   **Key Point:** Our visceral reactions (likes/disgusts) are profoundly shaped by exposure, social reinforcement, and cultural narratives. What feels "natural" or "obvious" is often learned. *Why here?* It breaks the illusion of innate, fixed preferences. Students must see that even basic "tastes" are malleable and culturally embedded **before** introducing morality. *Preempts:* The idea that consistency = innate/true preference.

  3.  **Introduce the Core Problem: The Laundering Hypothesis (15 mins)**
      *   **State the Problem Clearly:** "If our basic tastes/disgusts are culturally shaped, and moral intuitions *feel* like strong tastes/disgusts... could some of our seemingly 'principled' moral stances actually be culturally reinforced biases or gut aversions *masquerading* as reasoned positions? How could we tell?"
      *   **Crucial Definition:** Clarify "Laundering": Taking a raw, potentially problematic intuition (e.g., disgust towards a group/practice), embedding it within socially acceptable narratives/rationalizations ("tradition," "naturalness," "efficiency," "safety"), until the *origin* (bias/gut aversion) is obscured, and the stance feels like a reasoned, principled belief.
      *   **Why here?** The previous step makes this question inevitable. It directly introduces the core conceptual challenge.

  4.  **The Carry Example: Tattoos in Professional Contexts (25 mins)**
      *   **Why this works:**
          *   **Avoids Overused Terrain:** Not veganism/factory farming.
          *   **Does Both Jobs:**
              *   **Looks Principled, Might Be Laundered Disgust:** Stance: "Visible tattoos are unprofessional." Rationalizations: "It shows poor judgment," "clients find it distracting," "maintains a serious image." *Laundering Potential:* Underlying gut aversion to body modification/perceived "dirtiness" or association with counter-culture, reinforced by corporate norms presented as neutral professionalism.
              *   **Looks Like Preference/Bias, Might Have Principled Core:** Stance: "Banning visible tattoos is discriminatory." Rationalizations: "It's harmless self-expression," "judging appearance is irrelevant to competence." *Could Mask Bias:* Potential dismissal of genuine concerns about cultural appropriation in specific tattoo styles, or downplaying legitimate (though perhaps misplaced) client preferences in *some* ultra-conservative fields *if presented as an absolute moral imperative without nuance*.
          *   **Has:** Cultural variability (highly accepted in some fields/cultures, taboo in others), sensory component (needles, ink, permanence), shifting social norms, clear "principled" arguments on both sides, potential links to implicit bias (studies on appearance-based judgments).
          *   **Lacks:** Extreme polarization/identity politics of veganism, direct link to protected classes (usually), allows discussion without high personal stakes for most.
      *   **Activity:** Brief debate/"think-pair-share": Assign sides. "Argue *for* the 'unprofessional' stance using 'principled' reasons." "Argue *against* it as potentially laundered bias." Then swap perspectives. Force them to articulate the laundering structure.

  5.  **Deep Dive: Why It's Hard & Preempting Misconceptions (20 mins)**
      *   **Addressing "IAT Settles It":** *When?* Immediately after introducing examples. *How?* "IATs reveal *associations*, often implicit biases. But they **cannot** tell us if a *consciously held, articulated moral principle* (e.g., 'unnaturalness') is *just* the laundering of that bias or a genuinely independent, reasoned stance. The explicit rationale matters for the laundering claim."
      *   **Addressing "Revealed Preference = Justification":** *When?* When discussing rationalizations. *How?* "Stating a reason ('it's unnatural') isn't the same as justifying *why* unnaturalness is morally relevant here. Revealed preference shows what people *do* or *say motivates them*, not whether that motivation is itself a laundered bias or a sound ethical principle. We need to examine the *foundation* of the stated preference."
      *   **Addressing "Consistency = Not Bias":** *When?* After cultural calibration & laundering intro. *How?* "Bias, especially when culturally reinforced, *is* often remarkably consistent! A laundered bias shared by a whole culture will be held consistently by its members. Consistency doesn't reveal the *origin* or *validity* of the intuition behind the stance."

  6.  **The Final Check: Conceptual Grasp Question (5 mins)**
      *   **Question:** "Imagine someone holds a moral position you disagree with. Using the laundering framework we discussed: **What specific evidence would you need to gather – *beyond* just knowing their stated reasons or measuring their implicit bias – to seriously investigate whether their position might be a culturally laundered gut aversion, rather than a genuinely reasoned stance?**"
      *   **Why this works:** It forces application of the *structure* of laundering. Good answers will look for: origins/history of the aversion, cultural reinforcement mechanisms, counterfactuals ("Would they hold this without cultural pressure?"), inconsistency in applying the stated principle elsewhere, disentangling the *stated reason* from its *moral weight*.

  7.  **Open Refusal & Wrap-Up (5 mins)**
      *   **What We Won't Cover:**
          *   Meta-ethical anti-realism (Is *any* morality "real"?). *State Clearly:* "We're bracketing the question of whether objective moral truths exist. Our question is narrower: *given* that people experience and argue for moral positions, how can we tell if a *specific* position of theirs is laundered bias?"
          *   Full history of preference theory (Hume, Kant, Revealed Preference in Econ). *State Clearly:* "We're using 'preference' and 'bias' in a specific, operational way for *this* problem. We don't have time for the deep philosophical history."
      *   **Wrap-Up:** Reiterate the core takeaway: The structural problem of disentangling laundered bias from reasoned preference is inherent in moral psychology due to the feel of intuitions and cultural calibration. The goal isn't to "solve" it instantly, but to recognize it as a crucial challenge for interpreting moral claims.

  **Key Teaching Principles Throughout:**

  *   **Active Engagement:** Polls, quick debates, think-pair-share. Don't lecture *at* them about phenomenology; make them *feel* it.
  *   **Neutrality (Where Possible):** Frame the tattoo example (or any example) as a structural puzzle, not an advocacy piece for one side. Your goal is conceptual clarity, not moral conversion.
  *   **Focus on Mechanism:** Constantly bring it back to *how* laundering might work: Gut aversion -> Cultural narrative/rationalization -> Feels like principle.
  *   **Highlight the Gray:** Emphasize that most real-world stances likely involve a *mix* of genuine reasoning, cultural influence, and potential bias. The laundering framework is a tool to identify when bias might be a *primary driver* obscured by rationale. Avoid false binaries.
  *   **Manage Expectations:** Stress that this is hard! You're giving them lenses, not answers. The goal is critical awareness.

  This sequence builds the dependency: Personal experience of intuition -> Cultural shaping of basic reactions -> Raises the laundering problem -> Concrete example makes it tangible -> Targeted preemption of misconceptions -> Final check for structural understanding -> Clear boundaries. Good luck!
