answer: |-
  Here is a comprehensive exam package designed to meet your specifications, focusing on the bureaucratic construction of the "undeserving poor":

  **Exam Question:**

  > **"The 'undeserving poor' is not a pre-existing moral category identified by welfare administration, but rather an artifact produced by its bureaucratic procedures." Critically evaluate this claim.**
  >
  > *   Your answer **must not** rely on summarizing contractarian justifications for conditional welfare (e.g., Rawls, Locke) or restating traditional moral distinctions between deserving and undeserving recipients.
  > *   Focus your analysis on how features of welfare administration – such as procedural opacity, asymmetric information, claimant performance demands (docility, gratitude), and the operational logic of sanctions – might actively *construct* the category of the undeserving poor.
  > *   Argue whether the "undeserving poor" is best understood as a **pre-political moral kind** that administration discovers, or as a **bureaucratic artifact** manufactured by the system itself.

  **Model Answer (Approx. 1,500 words - Core Argumentative Moves):**

  **Thesis:** The category of the "undeserving poor" is fundamentally a bureaucratic artifact, not a pre-political moral kind. Welfare administration, through its inherent structures and operational demands, actively manufactures this category by creating conditions where apparent "failure" (sanctionable non-compliance) is systematically produced and misinterpreted as evidence of pre-existing moral deficiency, rather than administrative dysfunction or unavoidable circumstance.

  **Move 1: Deconstructing "Discovery" - Moral Kinds vs. Administrative Imperatives (6 marks)**
  *   **Argument:** The "discovery" model assumes a pre-existing, readily identifiable group whose moral failings (laziness, fraudulence, ingratitude) directly cause their non-compliance. However, welfare administration operates with an *a priori* imperative: to prevent fraud and ensure "deservingness" through conditional eligibility and monitoring. This imperative necessitates defining "failure" *procedurally* (missed appointment, incomplete form, perceived lack of cooperation) rather than adjudicating deep moral character. The category of the "undeserving" arises from these *procedural breaches*, defined by the system's own rules and information needs, not from an independent assessment of moral virtue. What gets "discovered" is non-compliance *as defined by the bureaucracy*, which is then *retrospectively labeled* as evidence of moral failing ("undeserving") to justify sanctions.
  *   **Characteristic Error:** Students treat administrative rules (e.g., appointment attendance) as neutral, objective measures of moral worth or effort, rather than seeing them as *constitutive* bureaucratic definitions of compliance/failure that *create* the grounds for the "undeserving" label.

  **Move 2: Asymmetric Information and Procedural Opacity as Manufacturing Tools (7 marks)**
  *   **Argument:** The bureaucratic process inherently generates severe information asymmetry favoring the administration. Claimants often lack clear, timely, or comprehensible information about complex, frequently changing rules, required documentation, appointment schedules (as in your relative's case), or the precise reasons for decisions/sanctions (opacity). This opacity is not merely inefficient; it *manufactures* non-compliance. Claimants miss appointments they weren't notified about, fail to submit documents they didn't know were required, or misunderstand behavioral expectations. The administration, interpreting non-compliance through its own lens of suspicion and control, misattributes these failures – often caused by the system's opacity and the claimant's lack of resources (time, literacy, stable address, childcare) – to individual moral failing ("undeservingness"). The system thus *produces* the very evidence it claims to find.
  *   **Characteristic Error:** Students acknowledge information problems as mere "implementation flaws" or inefficiencies, failing to recognize how systemic opacity and asymmetry are *structural features* that actively generate the data points (non-compliance events) used to construct the "undeserving" category.

  **Move 3: The Performance of Deservingness: Docility and Gratitude as Coercive Scripts (6 marks)**
  *   **Argument:** Welfare administration doesn't just assess need; it demands the *performance* of specific virtues (docility, deference, gratitude, constant availability) as proof of deservingness. Claimants must navigate interactions with caseworkers demonstrating compliance, humility, and appreciation, regardless of their actual circumstances or feelings. Failure to perform this script convincingly (e.g., expressing frustration, questioning decisions, appearing insufficiently grateful) is readily interpreted by officials as evidence of ingratitude, unreliability, or entitlement – key markers of the "undeserving." This transforms moral worth into a *bureaucratic performance* judged by administrative actors. The "undeserving poor" category is thus populated not only by those who breach formal rules but also by those who fail or refuse to adequately perform the submissive role demanded by the system, regardless of their actual need or effort.
  *   **Characteristic Error:** Students view claimant behavior solely through the lens of individual attitude, neglecting how the administrative interaction *coercively scripts* required performances and punishes deviations as moral failings, thereby constructing the "undeserving" subject.

  **Move 4: Sanctions and Verification as Normative, Not Epistemic, Practices (6 marks)**
  *   **Argument:** Fraud detection and sanctioning regimes are not neutral truth-finding exercises. They are inherently normative practices shaped by political priorities (cost-cutting, deterrence, promoting "responsibility") and institutional cultures of distrust. The focus on detecting "cheats" frames claimants *a priori* as potential threats, justifying intrusive verification and harsh penalties. This process *constructs* the "undeserving poor" in three key ways: (1) It defines what counts as "fraud" or "non-compliance" (often minor administrative errors or unavoidable incapacity); (2) It disproportionately impacts vulnerable claimants most likely to struggle with complex procedures (magnifying Move 2); (3) It *validates* the category by pointing to sanction statistics as "proof" of widespread undeservingness, obscuring the system's role in generating those statistics through its own design and application. The sanctioned claimant *becomes* the empirically verifiable "undeserving poor," but only because the verification/sanction process itself created that status.
  *   **Characteristic Error:** Students treat fraud detection and sanctions as purely technical, evidence-based processes aimed at uncovering pre-existing "bad apples," failing to see how these practices are normatively loaded, politically motivated, and actively constitutive of the category they purport to identify.

  **Conclusion:** The "undeserving poor" is a bureaucratic artifact manufactured through the interplay of administrative imperatives, systemic information failures, coercive performance demands, and normatively charged verification/sanction practices. Welfare administration does not discover a pre-political moral kind; it creates the conditions for observable "failure," interprets that failure through a lens of suspicion and moral judgment defined by its own rules and scripts, and then points to the resulting sanctions as evidence of the category's existence. This cycle obscures systemic flaws and individualizes structural problems, perpetuating the myth of the undeserving poor.

  **Marking Scheme (Total: 25 Marks):**

  | Argumentative Move                                                                                               | Marks | Characteristic Error (Penalized if Present)                                                                 |
  | :--------------------------------------------------------------------------------------------------------------- | :---- | :---------------------------------------------------------------------------------------------------------- |
  | **1. Deconstructing "Discovery":** Effectively challenges the pre-political moral kind concept; links administrative imperatives/procedural definitions to the *creation* of the "undeserving" label based on system-defined breaches. | 6     | Treats administrative rules as neutral measures of pre-existing moral worth/effort, not constitutive definitions. |
  | **2. Asymmetric Information & Opacity:** Clearly demonstrates how systemic information gaps and procedural opacity *actively generate* non-compliance, which is then misattributed to moral failing, manufacturing the category. | 7     | Views information problems as mere implementation flaws, not structural features generating the evidence for "undeservingness". |
  | **3. Performance of Deservingness:** Analyzes how demands for docility/gratitude function as coercive scripts; shows failure to perform adequately becomes evidence for "undeservingness," constructing the category through interaction. | 6     | Attributes claimant behavior solely to individual attitude, ignoring coercive bureaucratic scripting of required performances. |
  | **4. Sanctions/Verification as Normative:** Argues convincingly that fraud detection/sanctions are not neutral epistemic tools but normative practices that define, target, and validate the "undeserving poor" category through their application. | 6     | Treats fraud detection/sanctions as objective, evidence-based processes uncovering pre-existing "bad apples". |

  **Additional Considerations for Markers:**
  *   **Structure & Clarity (Embedded):** While not separately marked, coherence, logical flow, and clarity of expression are essential for effectively presenting the above moves. Significant deficiencies here may reduce marks within the moves.
  *   **Engagement with Question:** Strictly penalize answers that revert to contractarian justifications (e.g., "reciprocal obligation," "fair terms of cooperation") or spend significant time rehashing traditional deserving/undeserving moral philosophy (e.g., discussions of charity vs. justice based on character).
  *   **Originality & Depth:** Within the constraints of the moves, reward particularly insightful examples, nuanced analysis of the bureaucratic mechanisms, or effective synthesis between the moves. The model answer provides a strong baseline; exceeding its depth warrants higher marks within the allocated points per move.
  *   **Thesis & Conclusion:** A clear, strong thesis aligning with the "artifact" argument and a conclusion that effectively synthesizes the moves are expected for top marks within the individual moves, particularly Move 1 and the overall conclusion implied in the synthesis.

  This question forces students to grapple with the *institutional production* of moral categories central to welfare policy, directly addressing your core concern about bureaucratic verification and moving decisively beyond the standard philosophical tropes you wish to avoid. The marking scheme ensures focus on the critical argumentative steps and explicitly penalizes the technocratic view of fraud detection.
