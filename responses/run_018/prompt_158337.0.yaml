  The death qualification asymmetry does seem to treat opposition as "bias" while embracing retribution as "neutral." This assumes the state's punitive authority is objective. Strictly, the practice only needs that opposition prevents impartial application of law—but it doesn't logically require excluding only one side. The appellate focus on procedure rather than factual innocence implies that correct process legitimates outcomes, even fatal errors. That's proceduralism taken to an extreme.

