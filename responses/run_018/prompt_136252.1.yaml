answer: |-
  ### 1. Brainstorm Dump
  - **Ontological framing problem**: Anattā treated as metaphysics vs. deconstructive practice.  
  - **Verbal slippage**: "Self" = enduring essence (narrativist) vs. conventional label (reductionist); "continuity" = narrative coherence vs. causal chains.  
  - **Question divergence**: Phenomenal ownership (1st-person "mineness") vs. normative accountability (ethical patienthood).  
  - **Evidence conflict**: Reductionists cite causal relations/rebirth mechanics; narrativists demand robust "owner" for karma.  
  - **Rebirth wildcard**: Hand-waved as "causal continuation" (reductionists) or proof of incoherence (narrativists).  
  - **Soteriological core**: Anattā as *therapy* to undo clinging, not theory-building.  
  - **Hidden empiricism**: Do adepts *feel* identity differently post-practice? Data missing.  
  - **Ethics pivot**: "Bundle" suffices for compassion (reductionists) vs. responsibility vacuums (narrativists).  

  ---

  ### 2. Mapping the Stalemate  
  **Reductionists** (e.g., Siderits, Gethin) argue persons are *conventionally real* sequences of causally connected skandhas. No metaphysically deep self exists, but functional continuity in aggregates explains rebirth (like a flame passing between candles) and grounds ethics: karma attaches to causal streams, not selves. **Narrativists** (e.g., Flanagan, MacIntyre-influenced critics) counter that mere causal chains lack the *narrative unity* needed for genuine responsibility: if no "owner" persists, blaming "my" past action is like blaming the wind. Rebirth then becomes a crisis point: reductionists call it causal propagation ("not *me* reborn, but karmic momentum"), while narrativists see it as exposing absurdity—*whose* karma transfers? The shrug occurs because reductionists see rebirth as validation of causal continuity; narrativists see it as reductio ad absurdum.  

  ---

  ### 3. Diagnosis  
  **Parallel questions masquerading as one debate.** Your hunch is correct: reductionists answer the *phenomenological/metaphysical* question ("What persists?" → causal continuity of aggregates), while narrativists answer the *normative* question ("What bears responsibility?" → a narratively unified agent). This isn't merely verbal (though "self" is overloaded) or purely substantive; it’s a category error where each side demands the other’s framework answer their distinct concern.  

  The **deconstructive-practice framing** is critical. Anattā as *therapy* (e.g., Ñāṇavīra, Garfield) targets the *sense* of ownership ("*I* am suffering") to dismantle craving. This makes reductionist descriptions *post-deconstruction reports*—not competing ontologies with Western theories. Narrativists mistake this for metaphysical denial because they prioritize ethical coherence *presupposing* selfhood. Meanwhile, rebirth functions as a **conversational stop-sign**: reductionists appeal to it as evidence of causal continuity (Abhidharma-style), but narrativists hear it requiring a self *to be reborn*, exposing mutual incomprehension.  

  Substantive disagreement hides in **evidential standards**: reductionists accept causal relations and introspective insight as proof; narrativists require ethical/logical coherence of responsibility. Without agreeing on what counts as evidence for "identity," the debate spins.  

  ---

  ### 4. What Would Count as Progress  
  - **Operationalize the split**: Explicitly separate "phenomenal continuity" (studied via meditation neuroscience) from "normative patienthood" (tested via ethical psychology: e.g., do practitioners assign blame differently?).  
  - **Empirical injection**: Neurophenomenological studies on adept meditators—do they report diminished *mineness* while retaining ethical responsibility? (Preliminary work by Thompson suggests yes.)  
  - **Reframe rebirth**: Treat it as a *narrative convention for karmic causality* in communities, not an ontological claim.  
  - **Drop "self" entirely**: Adopt convention-dependent pragmatism (as in Madhyamaka): persons exist *as* responsibility-bearers in ethics, *as* targets of compassion, but *not* as ultimate referents.  
  - **Accept asymmetry**: Maybe no theory satisfies both metaphysical and normative demands—and none needs to.  

  ---

  ### 5. Bottom Line  
  This debate *can* move if participants disentangle the phenomenological and normative threads and take the deconstructive-practice lens seriously. Otherwise, it remains circular because reductionists describe *how experience is deconstructed*, narrativists demand *how ethics is possible*, and neither resolves the other’s concern. The stalemate persists until they acknowledge they’re solving different puzzles with different tools.
