  For diagnosis, I think the user is onto something with their parallel questions idea. The debate conflates phenomenological ownership ("who experiences?") with normative accountability ("who is responsible?"). Also significant is how anattā functions differently in soteriological practice versus philosophical discourse. It's not primarily ontology but a deconstructive tool targeting clinging. The debate becomes substantive only if we first untangle these threads.

