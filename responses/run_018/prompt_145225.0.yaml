answer: |-
  ### Exam Question:  
  **Evaluate Milton Friedman's 'F-twist' defence of unrealistic assumptions in scientific models in light of the methodological challenges posed by counterfactual policy-effect estimation. Your analysis must address:**  
  **(a) Precisely reconstruct Friedman’s core argument for dismissing descriptive realism in assumptions when models yield successful predictions. (4 marks)**  
  **(b) Explain why macroeconomic policy forecasting (e.g., predicting the effect of an interest rate hike) or climate-intervention modelling (e.g., estimating the cooling impact of stratospheric aerosol injection) fundamentally differs from Friedman’s examples of observable market outcomes. Focus on the *epistemic status* of the predictive target. (5 marks)**  
  **(c) Analyse whether the F-twist’s reliance on *independent* predictive testing collapses when the model itself generates the counterfactual baseline against which "successful prediction" is judged. Does this circularity undermine Friedman’s separation of assumptions from predictions? Justify your view. (11 marks)**  

  ---

  ### Model Answer (Approx. 600 words)  

  **(a)** Friedman’s F-twist contends that the realism of a model’s *assumptions* is irrelevant to its scientific validity. Validity rests solely on whether its *predictions*—understood as observable, testable implications about real-world phenomena—prove accurate. He argues assumptions are mere instrumental scaffolding: their sole purpose is to generate predictions. Criticising assumptions for lacking descriptive realism is therefore misguided, akin to judging a falling leaf by the accuracy of its supposed calculations of air resistance. Success in prediction justifies the model irrespective of how unrealistic its foundational premises might be. Crucially, this requires a sharp distinction between internal assumptions, the model’s logical implications, and the *testable predictions* derived from it and verified against independent empirical data.

  **(b)** Friedman’s canonical examples involve predicting observable market outcomes (e.g., demand curves, firm behaviour). These predictions can, in principle, be verified against data from actual markets. However, the predictive targets in macroeconomic policy forecasting or climate-intervention modelling are fundamentally different: they are **counterfactual policy effects**. For instance, predicting the *effect* of a 1% interest rate increase on unemployment, or the temperature reduction *caused* by injecting sulphur dioxide into the stratosphere, requires estimating what *would have happened otherwise* (the counterfactual baseline). Crucially, this counterfactual state is **not directly observable**. It is an inferred state of the world, constructed using theoretical models and data. The "prediction" (the policy effect ΔY = Y_policy - Y_baseline) depends intrinsically on the model’s structure to *generate* the baseline (Y_baseline) against which the policy scenario (Y_policy) is compared. There is no independent, theory-neutral observation of Y_baseline against which to test the *model-generated* estimate of ΔY.

  **(c)** This reliance on the model to define its own predictive target creates a **methodological circularity** that critically challenges the F-twist. Friedman’s defence requires *independent* verification: predictions derived from the model must be tested against empirical reality *distinct from* the model’s assumptions. However, when assessing a "prediction" like the estimated policy effect (ΔY), the key component (Y_baseline) is *not* an independent observable. It is a construct *of the very model* whose microfoundational assumptions (e.g., rational expectations, specific climate feedback mechanisms) are under scrutiny.  

  The circularity manifests in two ways:  
  1.  **Testing Dependence:** Verifying the accuracy of the predicted policy effect (ΔY) itself requires the model. We cannot observe ΔY directly; we observe only the outcome *under the policy*. To isolate the policy's effect, we must compare it to the model-generated counterfactual. Thus, the "test" of the prediction (ΔY) inherently relies on the model’s structure.  
  2.  **Assumption Sensitivity:** The unrealistic assumptions often directly shape the counterfactual baseline. For example, if a DSGE macroeconomic model assumes perfect rationality and frictionless markets, its baseline projection (Y_baseline) will differ significantly from one generated by a model incorporating behavioural rigidities. The estimated policy effect (ΔY) is thus profoundly sensitive to the assumptions deemed "unrealistic" but supposedly irrelevant by Friedman.  

  This circularity **undermines Friedman’s strict separation** between assumptions and predictions. The predictive target (ΔY) is not an independent observable but a *model-dependent construct*. Consequently, the model's success in "predicting" ΔY cannot be cleanly separated from the realism or instrumental adequacy of its internal assumptions in generating the counterfactual baseline. If the assumptions are flawed, they may distort Y_baseline, leading to a spurious ΔY that appears successful only because the model defines its own success criteria. The F-twist struggles to survive in such contexts because the condition for its application—the availability of an independent, observable predictive target against which to judge the model—is absent. Predictive success becomes entangled with the model’s internal structure, making the dismissal of assumption-realism far more problematic. Friedman’s instrumentalism presupposes a separation that collapses when prediction requires counterfactual estimation generated endogenously by the model.

  ---

  ### Marking Scheme (Total: 20 Marks)  

  #### **A Grade (17-20):**  
  *   **(a) Friedman Reconstruction (4 marks):** Precise, nuanced exposition of the core F-twist argument: the irrelevance of assumption-realism given predictive success, the instrumental role of assumptions, and the *critical distinction* between assumptions/implications/testable predictions. Avoids misrepresenting Friedman as a naïve instrumentalist regarding all model elements.  
  *   **(b) Counterfactual Distinction (5 marks):** Clearly identifies the target as a *counterfactual policy effect* (not an observable outcome). Explains why the counterfactual baseline is unobservable and model-dependent. Contrasts sharply with Friedman’s examples using observable market data.  
  *   **(c) Circularity Analysis (11 marks):**  
      *   *Identifies Circularity (3 marks):* Explicitly states that the model generates the baseline used to define/measure its own predictive target (ΔY).  
      *   *Explains Testing Dependence (3 marks):* Argues that verifying ΔY requires reliance on the model itself (cannot observe ΔY independently).  
      *   *Explains Assumption Sensitivity (3 marks):* Shows how unrealistic assumptions directly influence the counterfactual baseline and thus the estimated ΔY.  
      *   *Synthesis & Evaluation (2 marks):* Conclusively argues the circularity fatally undermines Friedman’s required separation for the F-twist in this context. Avoids overgeneralisation (e.g., doesn’t claim the F-twist is universally refuted).  

  #### **B Grade (14-16):**  
  *   **(a) Friedman Reconstruction (3 marks):** Mostly accurate summary but may lack precision on the distinction between assumptions/implications/predictions or slightly misstate emphasis.  
  *   **(b) Counterfactual Distinction (4 marks):** Recognises the target is a policy effect and less observable than market prices but explanation of counterfactual baseline/model-dependence may be less developed or precise.  
  *   **(c) Circularity Analysis (7-9 marks):**  
      *   Identifies the core problem (model defines target) but explanation of circularity may be less sharp.  
      *   Discusses testing dependence OR assumption sensitivity clearly, but not both fully or with strong linkage.  
      *   Evaluation states there’s a problem for Friedman but lacks the decisive synthesis on why the separation collapses.  

  #### **Common Mistakes (Mark Deductions):**  
  *   **Misrepresenting Friedman:** Portraying him as claiming *all* model elements are irrelevant fictions, or that assumptions *should* be unrealistic (Up to -2 in (a)).  
  *   **Misunderstanding Prediction:** Confusing observable outcomes with counterfactual effects; failing to grasp the unobservability of the baseline (-1 to -3 in (b)).  
  *   **Ignoring Circularity:** Failing to identify that the model generates its own test metric; treating ΔY as directly observable like a market price (-3 to -5 in (c)).  
  *   **Overgeneralisation:** Claiming the analysis "proves the F-twist wrong" absolutely, rather than showing its specific vulnerability in counterfactual policy contexts (-1 to -2 in (c)).  
  *   **Lack of Precision:** Vague terms like "the model is involved" without specifying *how* (circular baseline construction) (-1 to -2).  
  *   **Omitting Key Distinctions:** Not separating assumptions, implications, predictions clearly (-1 in (a)); not contrasting observable market outcomes vs. counterfactual policy effects (-1 to -2 in (b)).
