  3. A marking scheme out of 20 marks that separates an A answer from a B answer by naming the specific conceptual moves each must contain, assigns marks to each, and notes the typical mistakes that should cost marks.

  In your model answer and marking scheme, please separate carefully what is settled about Friedman’s position (the core claim that assumptions need not mirror reality if predictions succeed, and the distinction between assumptions, implications, and predictions) from what is genuinely contested among philosophers of science (whether predictive success can be assessed independently of model structure, whether the F-twist applies to non-experimental sciences, and whether Friedman intended a purely instrumentalist reading). Do not present any contested interpretation — for instance, that Friedman was an unqualified instrumentalist, or that climate science straightforwardly refutes the F-twist — as if it were the consensus view.

  Please do not include bibliographies, reading lists, or citations that a respondent without web access could not verify. If you reference Friedman’s essay, paraphrase without quotation marks; do not quote any passage verbatim unless you have fetched a source containing it and copied the text exactly.
