  We are drafting a joint adversarial-collaboration statement between two camps: 
  1. Tranquilists (T): Well-being consists solely in the absence of craving and suffering.
  2. Flourishing-Preservationists (FP): Positive states (understanding, creative achievement, loving attachment) have intrinsic value not reducible to suffering-aversion.

  The document should have four parts:
  (1) Agreed Claims (numbered)
  (2) Disagreements Table (with each camp's position in their own words)
  (3) Cruxes (sub-questions that would move at least one side) and for each crux:
