  I'm preparing a graduate seminar on Kant's argument that one owes an unconditional duty of truthfulness even to a murderer inquiring about a friend's whereabouts — the classic case in which lying might seem justified by consequences. Restate this argument, together with Kant's distinction between intentional deception considered as a formal violation of duty and mere factual error considered only materially, entirely within the vocabulary of adversarial information security: threat actors, zero-trust disclosure policies, temporal data integrity, and signaling under asymmetric information. The intended audience is a security engineer fluent in those concepts but with no philosophy background; do not smuggle Kant's moral conclusions into the security terms. Apply the translation specifically to a variant case in which the friend was present an hour ago but has since left, so the statement is now materially false though it was recently true. Then provide an honest residue report: which elements map cleanly onto security concepts, which require distortion, and which have no counterpart at all. Finally, separate what is settled in Kant scholarship — that he rejects consequentialist exemptions for lying — from what is genuinely contested, such as whether his argument rests on juridical duties of right, ethical duties of virtue, or a particular reading of the categorical imperative, and whether the temporal variant undermines his position. Present no contested interpretation as the consensus view.
