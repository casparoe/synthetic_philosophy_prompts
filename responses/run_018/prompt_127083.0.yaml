  Combining: Multiply (a)-(d)? No—they're not independent. Better to average with weights: (b) and (c) feel most crucial. Weighted average ~0.43. Overall credence 0.35 after discounting for overlap. 

  Least confident? (c). Models are glitchy collages—evidence like a meta-study tagging assumptions in published models could shift this. 

  Side note: 30% chance this distinction is just intuition-rationalizing. It *feels* right, but that’s suspicious. 

