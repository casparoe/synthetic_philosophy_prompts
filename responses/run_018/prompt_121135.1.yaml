prompt: |-
  hey so me and my friend got into it really bad last night over drinks about whether the turing test still means anything now that we have these llms that just predict next tokens. she thinks behavioral criteria are fine as long as you demand counterfactual stability - like the thing has to stay coherent even when you hit it with weird non-linguistic tasks - and she says you never need to peek inside. im on the other side: i think there's this issue i call stochastic mimicry, where you can get perfect conversational behavior with literally zero internal representational coherence, and once you see that the behavioral bar is useless unless you can verify internal explanatory structure, which she obviously thinks is impossible.

  anyway we want to try one of those adversarial collaboration things instead of just yelling. can you draft the joint statement?

  name the camps: behavioral continuity (her) vs explanatory discontinuity (me).

  part 1: numbered agreed claims. we need stuff we both actually sign - about what turing originally asked, what stochastic mimicry means in this context, what counterfactual stability requires, and what exactly needs explaining about mind.

  part 2: disagreements table. each row should be a precise disagreement phrased in wording that the side owning it would accept. no strawmen.

  part 3: cruxes. i think there are two: (a) whether counterfactual stability can exist without representational coherence, and (b) whether internal explanatory structure is ever epistemically accessible without behavioral mediation. for each crux, describe one concrete case or argument both of us agree is relevent, and write out in advance what each camp predicts about that case.

  part 4: say if any chunk of our fight was just verbal - like are we using 'mind' differently?

  please dont ask for bibliographies, citations, or reading lists - neither of us has them memorized and a model without web access couldnt guess them right anyway. keep it in the weeds but dont invoke super niche theories we probably havent actually read. write it like im texting, with maybe a typo or two.
