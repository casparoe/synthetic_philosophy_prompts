  First, the prescriptive vs. descriptive hinge: Laws I-II frames drinking parties as "tests," but the Athenian Stranger insists they’re educational (653a-d). He argues wine lowers inhibitions to reveal true character, making vice visible for correction. That feels prescriptive—it’s not just observing but designing a system. If it were merely descriptive, why detail regulations? But later in Book II (671a-671d), he warns against excess, which some read as backtracking. I lean prescriptive here: the regulations imply intent. 

