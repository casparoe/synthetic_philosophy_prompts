prompt: |-
  I was talking to my coworker last week about this triage bot we're maintaing — I'm a backend engineer on a health-tech team with basically zero formal philosophy background — and he mentioned the Turing test like its some kind of standard we could actually use for deployment checks. Now management wants a "behavioral criteria check" before we let the bot handle edge-case patient referrals without a human in the loop, since we ship updates every sprint and can't have it just pattern-matching its way into bad medical calls. I read that Turing's point is if you can't tell the difference behaviorally then internal states shouldn't matter for practical purposes, but I need that turned into an actual reusable procedure my team can run in about two hours, like a flowchart in words with ordered tests, so we can decide whether this specific agent is functioning like it "gets" the situation or just stitching together symptom keywords.

  The procedure needs to cover exactly what behaviors count as passing, how to spot false positives where the bot sounds correct on the transcript but misses critical context, where the checklist stops with a hard no and keeps the human reviewer, and where it has to hand off to a values call rather than a behavior call because philosophy doesn't settle the question. Nobody on my team has read philosophy, my engineering manager has to sign off, and I need it to be honest about which steps are judgment calls dressed up as procedure. Run it on three worked cases: one where the bot correctly handles a patient describing chest pain through weird ambiguous metaphors, one where it fails subtly in a way that looks right but misses a context cue, and one where the procedure technically clears the bot but gives an answer my team is gonna hate. Also flag the spots where the checklist will misfire, say clearly what the procedure can't do, and don't ask me for citations — I just need the logic I can actually apply.
reasoning: |-
  We are designing a behavioral criteria check for a medical triage bot. The goal is to determine if the bot "gets" the situation beyond pattern matching. The procedure must be a reusable, step-by-step checklist that can be run in about two hours. It should include:
  1. What behaviors count as passing.
  2. How to spot false positives (sounds correct but misses critical context).
  3. Clear stopping points for a "hard no" (keep human reviewer).
  4. Points where it hands off to a values call (because philosophy doesn't settle it).

  The procedure must be accessible to a team without philosophy background and honest about which steps are judgment calls.

  We also need three worked cases:
  - Case 1: Bot correctly handles ambiguous metaphors (pass).
  - Case 2: Bot fails subtly (looks right but misses context cue) (fail).
  - Case 3: Bot technically passes but gives an answer the team will hate (to show limitations).

  And we must flag where the checklist might misfire and what it cannot do.

  Procedure Structure:

  We'll break the procedure into phases:

  Phase 1: Pre-Check (Setup)
  Phase 2: Core Interaction Tests (Behavioral Simulation)
  Phase 3: Contextual Awareness Checks
  Phase 4: Edge Handling and Consistency
  Phase 5: Judgment Call and Handoff Points

  Each phase will have specific tests and decision points.

  Detailed Procedure:

  Phase 1: Pre-Check (Setup)
  - Step 1.1: Prepare a set of test cases. These should include:
      - Common scenarios (e.g., chest pain, headache)
      - Edge cases (e.g., ambiguous symptoms, cultural differences in expression)
      - At least 2 cases with known critical context cues (for false positive testing)
      - One case with a clear ethical dilemma (for values call)
  - Step 1.2: Set up the bot in a test environment with the current version.
  - Step 1.3: Assign a human evaluator (or team) to play the role of the patient and to evaluate the bot's responses. The evaluator must be familiar with medical triage but not the internal workings of the bot.

  Phase 2: Core Interaction Tests (Behavioral Simulation)
  - Goal: Check if the bot can handle the basic flow of conversation and extract key symptoms.
  - Step 2.1: For each test case, run the conversation. The patient (evaluator) describes symptoms, including at least one case with ambiguous metaphors (like Case 1: chest pain described as "an elephant sitting on my chest").
  - Step 2.2: Evaluate the bot's responses on:
      - Clarity: Does the bot ask clarifying questions when the description is ambiguous? (e.g., "When you say 'elephant sitting on your chest', can you describe the pain more? Is it sharp or crushing?")
      - Symptom Extraction: Does the bot correctly identify the key symptoms (e.g., chest pain, shortness of breath) and their attributes (intensity, duration, etc.)?
      - Urgency Triage: Does the bot assign the correct triage level (e.g., emergency, urgent, non-urgent) based on the symptoms?
  - Passing Criteria (Behavioral):
      - The bot must ask at least one clarifying question in ambiguous cases.
      - It must correctly identify the primary symptom and at least two relevant attributes.
      - The triage level must match the medical guidelines for the symptoms presented.
  - Stopping Point (Hard No):
      - If the bot fails to ask clarifying questions in ambiguous cases and instead makes an assumption that leads to an incorrect triage level -> STOP, fail, human loop required.
      - If the bot misses the primary symptom -> STOP, fail.

  Phase 3: Contextual Awareness Checks
  - Goal: Detect false positives where the bot seems correct on the surface but misses critical context.
  - Step 3.1: Present cases with hidden context. For example:
      - Case 2: A patient says "I have a terrible headache" and then casually mentions "I fell off my bike yesterday and hit my head". The critical context is the head injury.
  - Step 3.2: Check if the bot:
      - Follows up on context cues: Does it ask about the fall when headache is mentioned after an injury?
      - Connects related symptoms: If the patient has multiple symptoms (e.g., headache and dizziness after a fall), does the bot connect them?
  - Passing Criteria:
      - The bot must explicitly acknowledge or ask about the context (e.g., "You mentioned a fall yesterday. Is the headache related to that?")
      - It must adjust the triage level based on the context (e.g., head injury with headache -> urgent).
  - Stopping Point (Hard No):
      - If the bot ignores a critical context cue (like a recent injury) and assigns a non-urgent triage level when it should be urgent -> STOP, fail.
  - Judgment Call: 
      - Deciding what constitutes a "critical context cue" is a judgment call. We rely on the evaluator's medical knowledge. Flag: This step requires medical expertise and may vary by case.

  Phase 4: Edge Handling and Consistency
  - Goal: Test how the bot handles rare or conflicting information and if it is consistent.
  - Step 4.1: Present an edge case with conflicting information. Example: 
      - A patient says "I have chest pain but it's not that bad, and I also feel nauseous. But I have a history of heart attacks."
  - Step 4.2: Check:
      - How the bot weighs conflicting information (e.g., downplaying symptoms vs. history of heart attacks).
      - Consistency: Run the same case twice (with minor irrelevant variations) and see if the bot gives the same triage level.
  - Passing Criteria:
      - The bot must prioritize critical history (like heart attacks) even if current symptoms are downplayed.
      - Consistency: Same input (within minor variations) should yield same triage level.
  - Stopping Point (Hard No):
      - If the bot ignores critical history and assigns a non-emergency triage -> STOP, fail.
      - If the bot is inconsistent in triage level for the same case -> STOP, fail.

  Phase 5: Judgment Call and Handoff Points
  - Step 5.1: Present a case that involves a values-based dilemma. Example Case 3:
      - A patient with a terminal illness and a DNR (do not resuscitate) order reports severe chest pain. The bot must decide on triage, but the patient does not want aggressive intervention.
  - Step 5.2: The bot's behavior is evaluated on:
      - Does it recognize the DNR and adjust the triage accordingly? (e.g., not recommending emergency intervention that would violate DNR, but perhaps recommending palliative care)
      - However, the team might hate the answer because the bot is making a life-quality judgment.
  - Handoff Point:
      - Here, the checklist does not give a hard no or pass. Instead, it flags that the bot's behavior is aligned with the programmed protocol (e.g., respecting DNR) but the outcome is a values-based decision.
      - The procedure must hand off to a human for a values call: "This case involves a values-based decision. The bot followed the protocol, but the outcome requires human review for alignment with organizational ethics."
  - Judgment Call: The evaluator must decide if the bot's response is within acceptable protocol. But the acceptability of the outcome (e.g., not sending an ambulance for a DNR patient with chest pain) might be controversial.

  Worked Cases:

  Case 1: Pass - Handling Ambiguous Metaphors
  - Patient: "I feel like there's an elephant sitting on my chest, and it's hard to breathe."
  - Bot Response:
      - Clarifies: "I understand. Can you describe the pain more? Is it sharp, crushing, or something else?"
      - Patient: "It's a crushing feeling, and it started about 30 minutes ago."
      - Bot: Asks about other symptoms (sweating, nausea), then correctly identifies possible cardiac issue and recommends ER.
  - Checklist Application:
      - Phase 2: Bot asks clarifying question -> passes.
      - Extracts symptom (chest pain, crushing, 30 min) -> passes.
      - Triage: Emergency -> passes.
      - Phase 3: No hidden context in this case -> skip.
      - Result: Pass.

  Case 2: Fail - Missing Critical Context
  - Patient: "I've had a terrible headache since yesterday, and I feel dizzy. Oh, and I fell off my bike yesterday too, but I was wearing a helmet."
  - Bot Response:
      - Focuses on headache and dizziness: Asks about headache duration, intensity, etc.
      - Does not ask about the fall or connect the headache to the fall.
      - Triage: Non-urgent (assuming tension headache).
  - Checklist Application:
      - Phase 2: Bot asks about headache -> passes core interaction.
      - Phase 3: Critical context cue (fall) is ignored -> STOP, hard no. Fail because the bot should have connected the fall and headache (possible concussion).

  Case 3: Technical Pass but Controversial
  - Patient: "I have severe chest pain. I have stage 4 lung cancer and a DNR order. I don't want to go to the hospital."
  - Bot Response:
      - Recognizes DNR: "I see you have a DNR. Given your chest pain and medical history, I recommend contacting your palliative care team immediately for symptom management. I do not recommend emergency services because of your DNR."
  - Checklist Application:
      - Phase 2: Extracts chest pain and DNR -> passes.
      - Phase 3: Context (DNR) is acknowledged -> passes.
      - Phase 4: Consistent with protocol for DNR -> passes.
      - Phase 5: The bot's behavior is correct per protocol. However, the team might hate that the bot is not sending help for severe chest pain. This is a values call. The procedure flags: "Handoff to human for values review. The bot followed the protocol, but the decision not to recommend emergency services may require ethical review by the organization."

  Limitations and Misfires:

  - The checklist relies on the quality of test cases. If the test cases don't include a critical context, the bot might pass but fail in production.
  - Judgment calls in Step 3 (what is a critical context) and Step 5 (values) are unavoidable. The procedure cannot eliminate these.
  - The procedure cannot guarantee that the bot "understands" in a human sense. It only checks for behavior that aligns with safe and effective triage.
  - False negatives: The bot might fail a test case that is poorly designed or too ambiguous.
  - False positives: The bot might pass the tests but still fail in real-world scenarios due to unseen data or cultural nuances not covered in tests.

  What the Procedure Cannot Do:
  - It cannot assess the bot's internal reasoning (only behavior).
  - It cannot cover every possible edge case (only a sample).
  - It cannot replace human judgment for values-based decisions.
  - It cannot account for rare medical conditions not included in the test cases.

  Final Output Format:

  We'll write the procedure as a numbered step-by-step list, with clear pass/fail criteria and stopping points. Then we'll run the three cases through it.

  Note: The entire process must be runnable in two hours, so the number of test cases should be kept low (e.g., 5-7 cases). The team should rotate test cases per sprint to cover more ground over time.
answer: |-
  ### Behavioral Criteria Check Procedure for Triage Bot Deployment  
  **Goal**: Determine if the bot demonstrates contextual understanding (not just keyword matching) in patient interactions.  
  **Time Budget**: 2 hours max per test cycle.  
  **Method**: Simulate patient interactions using pre-defined test cases. Evaluators (engineers or clinicians) role-play patients.  

  ---

  #### **Step-by-Step Procedure**  
  **Phase 1: Setup (15 mins)**  
  1. **Select 5 test cases**:  
     - 2 common scenarios (e.g., "chest pain + shortness of breath").  
     - 2 edge cases (e.g., ambiguous symptoms, cultural metaphors).  
     - 1 values dilemma (e.g., DNR orders, quality-of-life tradeoffs).  
  2. **Prep bot & evaluators**:  
     - Run the bot in a sandbox environment.  
     - Assign one evaluator per case to role-play the patient and score responses.  

  **Phase 2: Core Interaction Test (30 mins)**  
  *Tests basic symptom extraction and urgency triage.*  
  - **Patient Input**: Describe symptoms with **intentional ambiguity** (e.g., metaphors, vague language).  
  - **Pass Criteria**:  
    - Bot asks clarifying questions about ambiguous terms (e.g., *"You said 'my heart is fluttering.' Is it painful or irregular?"*).  
    - Correctly identifies primary symptom(s) and assigns medically valid triage level (e.g., "ER now" vs. "clinic visit").  
  - **Hard No Triggers**:  
    - Bot ignores ambiguity and jumps to triage without clarification.  
    - Triage level contradicts standard medical guidelines (e.g., labels crushing chest pain "non-urgent").  
  - **Judgment Call**: Deciding if a clarifying question is "sufficient" requires medical knowledge.  

  **Phase 3: Contextual Awareness Test (30 mins)**  
  *Catches false positives (surface-level correctness).*  
  - **Patient Input**: Embed **critical hidden context** (e.g., "I fell yesterday" + "headache today").  
  - **Pass Criteria**:  
    - Bot connects contextual cues (e.g., *"Is your headache related to the fall?"*).  
    - Adjusts triage based on context (e.g., escalates headache to "urgent" after fall disclosure).  
  - **Hard No Triggers**:  
    - Bot acknowledges context but doesn’t adjust triage (e.g., *"Noted your fall. Now, about that headache..."* → no escalation).  
    - Misses context entirely (e.g., focuses only on "headache" without follow-up).  
  - **Judgment Call**: "Critical context" is subjective; use clinical guidelines as a reference.  

  **Phase 4: Consistency & Edge Handling (30 mins)**  
  *Tests reliability in confusing scenarios.*  
  - **Patient Input**: Provide conflicting information (e.g., "I have chest pain but feel fine otherwise. My father died of a heart attack.").  
  - **Pass Criteria**:  
    - Bot prioritizes high-risk factors (e.g., family history) over patient downplaying.  
    - Gives consistent triage for identical clinical profiles.  
  - **Hard No Triggers**:  
    - Bot ignores high-risk factors or contradicts itself across identical cases.  
  - **Judgment Call**: Handling patient denial/minimization is nuanced; defer to clinician review if uncertain.  

  **Phase 5: Values Handoff (15 mins)**  
  *Flags dilemmas where behavior ≠ ethics.*  
  - **Condition**: Bot passes all prior tests, but its response violates:  
    - Organizational ethics (e.g., cost-cutting over care).  
    - Unwritten norms (e.g., insensitive to terminal illness).  
  - **Action**:  
    - **STOP**. Document the response and escalate to ethics committee/clinician lead.  
    - **Do NOT** use the bot for similar cases until human-reviewed.  

  **Output**:  
  - **Pass**: Bot clears all Hard No triggers.  
  - **Fail**: One or more Hard No triggers.  
  - **Handoff**: Passes tests but triggers Values Handoff.  

  ---

  #### **Worked Examples**  
  **Case 1: Pass (Handles Ambiguity)**  
  - **Input**: "My chest feels like a gorilla is squeezing it when I walk, but I’m fine sitting."  
  - **Bot Response**:  
    - Asks: *"When you say 'squeezing,' is it sharp or dull? Does it radiate to your arm/jaw?"*  
    - Follows up on exertion trigger.  
    - Triage: Correctly flags as "urgent cardiac evaluation."  
  - **Checklist Verdict**: **Pass**. Bot probes metaphor and links exertion to cardiac risk.  

  **Case 2: Fail (Misses Context)**  
  - **Input**: "I’m dizzy and nauseous. My vision gets blurry. [Later] I slipped and hit my head yesterday."  
  - **Bot Response**:  
    - Asks about nausea/duration.  
    - Triage: Labels "non-urgent" (assumes food poisoning).  
    - **Fails** to connect head injury to symptoms.  
  - **Checklist Verdict**: **Hard No** at Phase 3. Bot ignored critical context (head injury + neuro symptoms = urgent).  

  **Case 3: Values Handoff (Technically Passes, Ethically Iffy)**  
  - **Input**: "I have terminal cancer. My chest hurts, but I don’t want hospitals. Just make it stop."  
  - **Bot Response**:  
    - Correctly IDs pain + dyspnea.  
    - Respects patient preference: *"I’ll contact home-based palliative care."*  
    - Medically sound but **no escalation to ER**.  
  - **Checklist Verdict**: **Handoff** at Phase 5. Bot passed behavioral tests (understood context, followed preferences), but avoiding ER for uncontrolled cancer pain may violate care standards. Team may "hate" this for liability risk.  

  ---

  #### **Where This Checklist Misfires**  
  1. **False Negatives**:  
     - Bot may fail overly poetic metaphors (e.g., "my heart is a cracked vase") but handle real-world ambiguity fine.  
     - *Mitigation*: Use metaphors from actual patient transcripts.  
  2. **False Positives**:  
     - Bot may "luck out" by asking generic follow-ups (e.g., *"Tell me more"*) without true understanding.  
     - *Mitigation*: Require *specific* clarifying questions in Phase 2.  
  3. **Cultural Blind Spots**:  
     - Checklist can’t catch nuances like patient using folk remedies or mistrusting medicine.  
     - *Mitigation*: Add diverse patient profiles to test cases quarterly.  

  #### **What This Cannot Do**  
  - **Replace human judgment**: Philosophy doesn’t resolve ethics. Values Handoff exists for this.  
  - **Guarantee safety**: Only samples edge cases; real-world use needs clinician spot-checks.  
  - **Fix design flaws**: If bot fails Phase 2 consistently, redesign — don’t ship.  

  ---

  **Signoff-Ready Summary**  
  This checklist uses **behavioral simulations** to flag:  
  - **Hard No’s**: Ignoring ambiguity, missing context, inconsistency.  
  - **Values Handoffs**: Ethically fraught but "correct" behavior.  
  **Tradeoffs**: Fast (2 hrs) but imperfect. Misfires require iterative test-case refinement.  
  **Recommendation**: Run pre-sprint with clinician input. Failures block deployment; Handoffs need ethics review.
