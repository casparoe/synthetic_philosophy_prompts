prompt: |-
  In a philosophy of language reading group I belong to, one member keeps defending a picture he calls the controlled-experiment account of counterfactuals. On his view, deciding whether a counterfactual is true is operationally the same as running a controlled experiment: you take the actual state of the world just before the antecedent, you intervene so that the antecedent and only the antecedent changes, the way an experimenter sets a single treatment variable, and you let the ordinary causal-explanatory structure run forward to see what follows. He draws a strong moral from this. Because an experiment's outcome is settled by the actual constitution of the system plus the intervention, counterfactual truth must likewise be objective and context-invariant: the facts, the laws, and a minimal change to make the antecedent true fix a unique answer, and talk of comparing similarity among worlds or shifting conversational standards merely reports our uncertainty about what that answer is. I think the analogy is doing the persuasive work, and I suspect its force comes from features of real experiments that counterfactual evaluation does not possess, but I have not yet worked out exactly where it comes apart.

  I would like you to audit the analogy. First, provide an explicit correspondence table: what maps onto the experimental apparatus, the baseline conditions, the manipulated variable, the control condition, the recorded outcome, the protocol that says what gets held fixed, and the possible confounders. Second, identify the genuine disanalogies and distinguish the ones that matter for his conclusion from the ones that are harmless. In that connection, test the analogy against cases where making the antecedent true would require undoing earlier events, cases where the antecedent is under-described, and cases where what we are allowed to hold fixed is set by conversational interest rather than by any fact of the matter. Third, judge whether the conclusion, objective context-independent counterfactual truth, survives once the disanalogies are on the table, survives only in a weakened form, or stood only because the analogy had already assumed it. If the analogy cannot carry the load, say what a better analogy or replacement account would be.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're in a philosophy of language reading group where someone defends the controlled-experiment account of counterfactuals. The core idea is that evaluating counterfactuals is like running a controlled experiment: intervene to change only the antecedent, let causal laws play out, and get an objective truth. The user suspects disanalogies and wants me to audit this comparison.

  First, I need to map the experimental analogy clearly. The experimental apparatus corresponds to the world's causal structure, baseline conditions to the state just before antecedent time, manipulated variable to the antecedent itself. Control condition is actual events, outcome is the consequent's truth-value. The protocol is what's held fixed - here's the first crack, since experiments have clear protocols but counterfactuals often don't. Confounders would be unaccounted variables that could affect outcomes.

  Now for disanalogies. Three big ones come to mind: 

  When antecedents require backtracking (e.g., "if I hadn't eaten breakfast..."), we can't isolate changes - the past might need rewriting. Experiments avoid this by design. This directly challenges objectivity because multiple minimal-change paths become possible.

  Under-described antecedents (e.g., "if the match were struck") create ambiguity. Experiments specify interventions precisely; language often doesn't. This introduces context-dependence in resolving vagueness.

  Most crucially, conversational context determines what's held fixed, not causal structure alone. Whether we fix laws or particular facts depends on why we're asking. This social element has no experimental parallel and makes truth subjective.

  The moral collapse seems total. Objectivity requires fixed parameters, but counterfactuals lack this. Better analogies might be legal hypotheticals or engineering simulations - both openly acknowledge contextual constraints. The experiment analogy smuggles in objectivity by assuming what it tries to prove.

  I should emphasize how these disanalogies compound: backtracking problems expose causal indeterminacy, vagueness requires interpretation, and contextual holds reflect human interests. Together, they show why Lewis's similarity metrics or contextualist approaches aren't just epistemic crutches but necessary features.
answer: |-
  Here's a systematic audit of the controlled-experiment analogy for counterfactuals, addressing your concerns about its persuasive force and conclusion:

  ### Correspondence Table
  | **Experimental Concept**       | **Counterfactual Mapping**                     | **Key Notes**                                                                 |
  |--------------------------------|------------------------------------------------|-------------------------------------------------------------------------------|
  | **Experimental Apparatus**     | The actual world's causal/nomic structure      | Laws of nature, causal relationships, ontological "rules"                     |
  | **Baseline Conditions**        | State of the world at time *t* (just before antecedent) | Must be specified precisely; often idealized                                  |
  | **Manipulated Variable**       | Antecedent event/state                         | The "single change" introduced                                                |
  | **Control Condition**          | Actual world's history                         | Serves as the default comparison case                                         |
  | **Recorded Outcome**           | Truth-value of the consequent                  | What "follows" from the intervention                                          |
  | **Protocol (Held Fixed)**      | What remains unchanged during intervention     | **Critical point:** Allegedly "all else" besides antecedent                   |
  | **Possible Confounders**       | Variables not controlled that affect outcome   | Underspecified dependencies in the system                                     |

  ### Disanalogies & Their Significance
  **1. Backtracking Cases (Undoing Earlier Events)**  
     - *Example:* "If the plate hadn't broken, it wouldn't have been dropped."  
     - **Disanalogy:** Experiments forbid backward causation; counterfactuals often require backtracking (undoing causes to change effects). To make the antecedent true ("plate not broken"), we must alter the past ("not dropped"), violating experimental isolation.  
     - **Significance:** **Fatal to objectivity.** No unique "minimal change": Must we undo gravity? The dropper's intent? This introduces context-dependent similarity judgments (Lewis). The experiment analogy assumes temporal isolation impossible here.

  **2. Under-described Antecedents**  
     - *Example:* "If the match were struck, it would light."  
     - **Disanalogy:** Experiments require fully specified interventions (oxygen level? match composition?). Counterfactuals often leave antecedents vague. "Striking the match" doesn't specify *how* the change occurs.  
     - **Significance:** **Undermines uniqueness.** The outcome depends on *how* we implement the change (dry match vs. damp match). Context determines how we fill gaps, making truth speaker-relative.

  **3. Conversational Context in "Holding Fixed"**  
     - *Example:* "If I had skipped lunch, I would be hungry" vs. "If I had skipped lunch, I would have finished my report."  
     - **Disanalogy:** Experimental protocols objectively define fixed variables. Counterfactuals rely on *interest-relative* facts: What's held fixed depends on *why* we ask (biology vs. work productivity).  
     - **Significance:** **Directly contradicts context-independence.** We fix different facts based on conversational goals (e.g., holding fixed "my work habits" vs. "my metabolism"). No "fact of the matter" independent of context.

  ### Harmless vs. Critical Disanalogies
  | **Disanalogy Type**            | **Harmless?** | **Why**                                                                       |
  |--------------------------------|---------------|-------------------------------------------------------------------------------|
  | **Lack of repeatability**      | Yes           | Epistemic limitation, doesn't affect truth conditions                         |
  | **No physical intervention**   | Yes           | Mental simulation differs methodologically but not metaphysically             |
  | **Backtracking dependence**    | **No**        | Forces non-unique minimal changes, inviting context-dependence                |
  | **Contextual "holding fixed"** | **No**        | Makes truth conditions inherently perspective-laden                           |
  | **Antecedent vagueness**       | **No**        | Requires discretionary specification, undermining objectivity                |

  ### Judgment on the Conclusion
  **The analogy fails to support objective context-independent truth:**  
  - **Why it collapses:** The analogy *presupposes* what it tries to prove: that there exists a context-free "protocol" for what to hold fixed and how to implement changes. Real experiments define these explicitly; counterfactuals rely on implicit, shifting standards.  
  - **Weakened survival?** At best, the analogy holds only for **simple, non-backtracking, fully specified physical antecedents** (e.g., "If this uranium atom decayed now..."). But most philosophically interesting counterfactuals violate these conditions.  
  - **Hidden circularity:** The analogy assumes a deterministic causal structure *and* privileged variables to fix—which are precisely what counterfactual semantics debate. It doesn't resolve indeterminism or overdetermination problems.

  ### Better Replacement Accounts
  1. **Contextualist Semantics (e.g., Kratzer):**  
     - Counterfactuals are evaluated relative to a *conversationally determined set of facts* held fixed.  
     - **Analogy:** Legal hypotheticals ("Had the defendant acted differently...") where norms define relevant facts.

  2. **Similarity-of-Worlds (Lewis-Stalnaker):**  
     - Truth depends on similarity metrics adjustable by context.  
     - **Better analogy:** Historical scenarios in fiction—we hold fixed what the genre deems essential (e.g., alternate history novels fix major geopolitical facts but alter battles).

  3. **Interventionist Causal Models (e.g., Pearl):**  
     - *Partial* rehabilitation: Counterfactuals *are* like experiments *if* we specify a causal model with variables and allowable interventions.  
     - **Crucial caveat:** The model itself is context-dependent. Choosing which variables to include (e.g., "mood" vs. "weather" in "If I went for a walk...") is interest-relative.

  ### Conclusion
  The experiment analogy is rhetorically powerful because it borrows science's objectivity aura, but it fails for philosophically central counterfactuals. It cannot handle backtracking, vagueness, or conversational context—all endemic to natural language. A hybrid account acknowledging **constrained context-dependence** (e.g., causal models plus contextual priorities) better captures actual usage. The moral stands: counterfactual truth isn't purely objective; it's a negotiation between causal structure and human interests.
