  Here's a precise carving of the pattern you've identified, along with a proposed name, its definition, the core inconsistency, and how it differs from mere sloppiness:

  **Proposed Name: Selective Origin Constancy (SOC)**

  **Definition:** A pattern of intuitive reasoning where the perceived "essential origin point" of a person's identity *shifts inconsistently* across different scenarios (e.g., embryo transfer, cloning, monozygotic twinning). This shift occurs to preserve the *feeling* of a unique, continuous, and bounded self, while *dropping consistency* in the specific biological criterion (e.g., gamete, zygote, womb, genetic uniqueness) used to define that origin point.

  **The Core Inconsistency - What's Held Constant vs. What's Dropped:**

  1.  **What is Held Constant (The Deep Intuition):**
      *   **The Unique Self Intuition:** The unshakeable feeling that "I" am a singular, continuous entity with a specific origin point. This "origin" is treated as the *necessary and sufficient starting condition* for *me* specifically.
      *   **The Non-Replicability Intuition:** The strong belief that "I" could not exist simultaneously in two places or bodies, nor could an exact genetic copy be "me" if it originates separately.

  2.  **What is Dropped (The Shifting Criteria):** The *specific biological factor* deemed essential to defining that origin point and ensuring uniqueness:
      *   **In Embryo Adoption:** The *gametes (sperm/egg)* and the *initial womb environment* are dropped as essential. The *zygote/embryo itself* is held constant as the essential origin point. Identity travels with the embryo regardless of implantation site. (Criterion: **Persistent Embryonic Entity**).
      *   **In Cloning:** The *specific origin gametes (especially the egg cytoplasm and its unique factors)* and the *separate point of origin in time/space* are held as essential. Merely identical DNA in a *different* embryo (originating from a *different* egg cell, even if enucleated) is insufficient. The clone is a *different* person. (Criterion: **Unique Gametic Origin Event**).
      *   **In IVF Twinning:** The *singularity of the zygote at the moment of conception* is held as essential *only up until the split*. After the split, the *genetic uniqueness* of the resulting individuals (or their separate physical embodiments) becomes the essential criterion. There is no "branching" of one identity; two *new* distinct identities/persons are created *at the moment of twinning*. (Criterion: **Singular Embryonic Continuity Pre-Split; Distinct Embodiment Post-Split**).

  **How SOC is Different from Mere Sloppiness:**

  *   **Motivated Reasoning:** SOC isn't random carelessness; it's a *motivated* inconsistency driven by the powerful, pre-theoretical **Unique Self Intuition**. People aren't just being lazy; they are subconsciously adjusting their definition of "essential origin" to *protect* the core feeling that "I" am irreducibly unique and non-replicable.
  *   **Predictable Pattern:** The inconsistency follows a predictable pattern based on the scenario's *threat* to the Unique Self Intuition:
      *   Embryo transfer *doesn't threaten* uniqueness (one embryo -> one person later). Gametes/womb are safely dropped.
      *   Cloning *directly threatens* uniqueness (suggesting "I" could be replicated). Gametic origin is emphasized to block this.
      *   Twinning *threatens continuity* (one origin -> two people). The origin point is subtly redefined ("conception" vs. "post-split individuality") to avoid the paradox of one person becoming two.
  *   **Persistence:** Mere sloppiness might be corrected with careful thought. SOC is resistant because it's anchored to a deep-seated intuitive feeling about personal identity that often overrides logical consistency when challenged by edge cases.

  **Confidence & Least Sure Point:**

  *   **Overall Confidence (85%):** I'm highly confident this accurately describes the pattern of inconsistency you observed and isolates the core conflict between the **Unique Self Intuition** and the inconsistent application of biological criteria. The proposed mechanism of **motivated reasoning** to protect that intuition is well-supported in psychology/philosophy of identity.
  *   **Confidence in the Name "Selective Origin Constancy" (70%):** While I'm confident it captures the essence (shifting origin point selection motivated by preserving a constant feeling of unique self), I'm less certain this specific term is widely *established* in academic literature. Philosophers discuss "origin essentialism" broadly and the puzzles of personal identity extensively, but a *single, universally accepted* term for *this specific pattern of inconsistency* across these scenarios might not exist. "Selective Origin Constancy" is a precise descriptive label for the phenomenon you've identified.
  *   **Confidence in the Twinning Analysis (80%):** The shift from "singular zygote origin" to "post-split distinct identity" is clear in the intuition that twins are two separate people *from the start of their separate existence*, not one person who branched. The exact point where the "origin" criterion flips (is it the split itself? implantation? birth?) might be fuzzy in common intuition, but the *necessity* of the flip to avoid the branching paradox is the key SOC element here.

  **In Summary:** You've pinpointed **Selective Origin Constancy (SOC)** – an inconsistency in defining the "essential origin" of personal identity (shifting between gamete, zygote, womb, genetic uniqueness) driven by the motivation to preserve the deep **Unique Self Intuition** (that "I" am singular, continuous, and non-replicable) across challenging scenarios like embryo adoption, cloning, and twinning. It's not mere sloppiness; it's systematic, motivated reasoning to protect a core intuition.
