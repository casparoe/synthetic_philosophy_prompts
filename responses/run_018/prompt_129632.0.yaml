prompt: |-
  Hey, I'm a retired ecologist who got into philosphy late in life and I'm giving a talk next tuesday at my local uni. I want to defend this idea: Nāgārjuna's catuṣkoṭi (the four-corner negation) isn't mystical hand-waving about things both being and not-being. Instead, the Madhyamaka split between prasajya-pratiṣedha (just stripping away a wrong idea, like "no inherent nature here") and paryudāsa-pratiṣedha (a determinate "it's X, not Y") gives us a formal logical schema for denying svabhāva without turning "emptiness" into a new reified thing. I'm applying it to biology—genes and species aren't empty because they're unreal, but because they're purely dependently designated with no core essence. So Madhyamaka actually helps philosophy of science dodge false essentialism without collapsing into anti-realism.

  The audience is a philosophy-of-science reading group: mostly analytic metaphysicians and philosophy-of-biology folks who think Buddhist philosophy is just vague mysticism. There's one comparative-philosophy grad student who actually reads Sanskrit, plus two logic-minded people who will want formal notation. They care about empirical reference, logical clarity, and whether I'm smuggling obscurantism into science.

  Please draft my Q&A prep sheet. I need the objections I'll actually recieve, ordered by how damaging they'd be, phrased the way each kind of person in the room would put it. For each one: a two-minute reply I can actually say out loud, plus an honest note on where that reply is soft. Also tell me what I should concede up front so I don't look defensive, and include the one question I'm praying nobody asks. Don't ask me for bibliographies or reading lists—I won't have books with me.

  Give me the answer as a JSON object with this exact schema: top-level field "thesis_one_line" (string), "concessions_up_front" (array of strings), "dreaded_question" (object with "question_text" and "why_it_hurts"), and "prep_sheet" which is an array of objects each having "objection_text" (exact wording they'd use), "from_whom" (string describing the speaker, e.g. "analytic metaphysician"), "damage_rank" (integer, 1 = worst), "two_minute_reply" (string), "soft_spot" (string explaining where the reply is weakest), and "should_concede" (boolean or short string). Make sure the niche point about prasajya vs paryudāsa and dependently designated scientific concepts is in the weeds enough that I can't just parrot something from a popular intro. Also please include a typo or two in your prompt text—I'm writing this on my phone and it should feel casual.
reasoning: |-
  We are generating a JSON object as per the user's request. The user is an ecologist turned philosopher, presenting on applying Nagarjuna's catuṣkoṭi and the Madhyamaka distinction between prasajya and paryudāsa negation to philosophy of biology. The goal is to show that this framework avoids essentialism without falling into anti-realism.

   Key elements:
   - Thesis: Nagarjuna's four-cornered negation isn't mysticism but a logical tool that, via the distinction between prasajya (non-implicative negation) and paryudāsa (implicative negation), denies inherent existence (svabhāva) without reifying emptiness. Applied to biology: genes and species are empty (lack inherent nature) because they are dependently designated, not because they are unreal.

   Audience: 
     - Analytic metaphysicians and philosophy of biology scholars (skeptical of Buddhist philosophy as mysticism).
     - One comparative-philosophy grad student who reads Sanskrit.
     - Two logic-minded people who want formal notation.

   Concerns of the audience: empirical reference, logical clarity, obscurantism.

   Structure:
     - "thesis_one_line": a one-sentence thesis.
     - "concessions_up_front": array of strings (things to concede at the beginning to appear non-defensive).
     - "dreaded_question": an object with "question_text" and "why_it_hurts".
     - "prep_sheet": array of objects with:
          "objection_text": exact wording of the objection.
          "from_whom": type of person (e.g., "analytic metaphysician").
          "damage_rank": integer (1 is worst).
          "two_minute_reply": response (about two minutes spoken).
          "soft_spot": where the reply is weak.
          "should_concede": boolean or short string (if we should concede part of the point, put the concession; if not, false).

   We need to include the niche point about prasajya vs paryudāsa and dependent designation in biology.

   Important: The user doesn't want bibliography, so we avoid references.

   Let's create the JSON:

   Steps:
   1. Thesis one-liner.
   2. Concessions up front (3-4 points to disarm critics).
   3. Dreaded question (one that is hard to answer and might expose a flaw).
   4. Prep sheet: 5-7 objections, ordered by damage_rank (1 being the most damaging). Include at least one from each type of audience.

   Let's brainstorm objections:

   From analytic metaphysician:
     - Objection: Your use of negation types seems to avoid reification, but in science we need positive commitments. How can we do science if we can't even say what a gene is?
     - Damage: High (if we can't account for scientific practice, the whole project fails).

   From logic-minded person:
     - Objection: The catuṣkoṭi is often presented as violating the law of non-contradiction. How do you formalize it without paraconsistent logic, which is controversial and not standard in science?
     - Damage: High (if the logic is seen as invalid, the argument collapses).

   From philosophy of biology person:
     - Objection: Biologists already use cluster concepts or homeostatic property clusters for species, which avoids essentialism without needing Buddhist philosophy. Why import this complex framework?
     - Damage: Medium (if existing frameworks work, then the Buddhist one is redundant).

   From comparative-philosophy student (Sanskrit reader):
     - Objection: The distinction between prasajya and paryudāsa is not always clear in Nagarjuna's texts, and some scholars argue that he uses them inconsistently. How do you justify your interpretation?
     - Damage: Medium (if the textual basis is shaky, the application is too).

   Another from analytic metaphysician:
     - Objection: You say genes are "dependently designated", but that sounds like a fancy way of saying they are theoretical constructs. That's just instrumentalism, which is a form of anti-realism. How is this different?
     - Damage: High (if it collapses into anti-realism, the main claim fails).

   From logic-minded person (formal notation request):
     - Objection: Can you provide a formalization of the catuṣkoṭi using standard modal logic? If not, how can we be sure it's logically coherent?
     - Damage: Medium (if we can't formalize, it might be hand-wavy).

   From philosophy of biology:
     - Objection: Even if we accept that species are empty, how does that change biological practice? We still need to classify and study them as if they were real.
     - Damage: Low (pragmatic concern).

   Dreaded question (the one we hope isn't asked):
     - Question: If emptiness means that all concepts are dependently designated and lack inherent existence, then doesn't the concept of dependent designation itself become empty? Isn't this an infinite regress that undermines any claim to knowledge?
     - Why it hurts: It's a classic problem in Madhyamaka (the two truths) and if not handled well, it can make the whole system seem self-defeating.

   Concessions up front:
     - I am not a trained logician, so my formalization may be rudimentary.
     - I recognize that many in analytic philosophy find Buddhist metaphysics obscure, and I aim to show it's not.
     - I concede that biologists have developed non-essentialist accounts (like cluster kinds), but I argue that Madhyamaka provides a more robust metaphysical grounding.

   Now, let's write the JSON.
