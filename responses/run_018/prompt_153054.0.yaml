prompt: |-
  I have been working through the boundary problem—who properly belongs to the demos—by testing my intuitions against concrete membership cases rather than deriving them from a single prior principle. Here are my verdicts, which I present for coherence-testing.

  First, long-term non-citizen residents who are fully subject to domestic law should eventually acquire full voting membership; mere administrative category seems insufficient to justify permanent exclusion. Second, citizens who have permanently emigrated and are no longer subject to domestic law should eventually forfeit membership, even if they retain nationality, cultural identity, or property interests; being outside the jurisdiction should eventually outweigh being inside the nationality. Third, outsiders severely affected by a polity’s decisions—downstream water users, for instance—merit consultation or weighted consideration, but not full membership; affectedness alone does not confer democratic standing. Fourth, future generations should be institutionally represented through proxy or constitutional mechanisms, yet they are not present members of the current demos; representation is not membership. Fifth, in territories that are governed but not incorporated—where residents bear all obligations without corresponding representation—I hold that full membership is required; the absence of incorporation is a contingent institutional failure, not a justification for exclusion.

  Two judgments, however, pull in opposite directions. A temporary worker who remains for fifteen years, building a life but retaining formal non-citizen status, strikes me as eventually entitled to membership; but a citizen abroad who continues to pay taxes and hold property strikes me as eventually not entitled, even though the latter maintains stronger formal ties and economic stakes. This suggests that being subject to law is doing more work than either nationality or economic stake, but I worry I am weighting jurisdictional presence ad hoc to save both verdicts.

  Is there a coherent principle—perhaps distinguishing jurisdictional subjection from affectedness, introducing a temporal threshold for incorporation, or separating membership from representation—that captures all five verdicts without collapse? Which of my judgments must be abandoned for the sake of coherence? In particular, can my differential treatment of the emigrant citizen and the long-term temporary worker be derived from a single account of what democratic membership is for, or does it depend on an unstated normative premise?

  Please lay out the candidate principles precisely, state which verdicts each saves and which it sacrifices, and apply them to at least one further case I have not considered—say, digital residents who participate economically and socially via remote presence without ever entering the physical territory. Be explicit about where your reasoning is most vulnerable and what specific counterexample or theoretical commitment would lead you to revise the principle you defend.
reasoning: |-
  Hmm, this user presents a sophisticated boundary problem in democratic theory and wants coherence-testing for their five membership verdicts. They've clearly engaged deeply with real-world tensions between jurisdictional presence, affectedness, and formal status. The core puzzle is their seemingly contradictory treatment of long-term residents versus emigrant citizens - both have duration and stakes, yet opposite outcomes.

  Interesting how they frame the temporary worker/emigrant citizen contrast as the litmus test. Their methodological caution stands out: they're avoiding top-down principles but want to know if their intuitions can be systematized. The digital resident challenge they propose is spot-on for modern relevance - it directly pressures the "physical jurisdiction" premise.

  Noticing three implicit drivers in their verdicts: 1) Bodily vulnerability to state power (subjecthood principle), 2) Relational permanence (temporal threshold), 3) Institutional non-arbitrariness (anti-exclusion norm). These aren't yet integrated though. The emigrant case is where it frays - they admit tax-paying expats maintain stronger formal ties than temporary workers, yet deny them membership. That does suggest physical coercion is doing hidden work.

  For candidate principles, I should test:
  First, the Subjection Principle: membership requires enduring physical subjection to enforceable laws. This clearly saves verdicts 1, 2, 4, 5 and their worker/emigrant asymmetry. But it sacrifices verdict 3 (affected outsiders) and fails digital residents who face extraterritorial data laws. Counterexample: what about Snowden-type cases where states enforce laws on bodies abroad?

  Second, the Relational Membership approach: focus on embeddedness in the civic community. Saves verdicts 1, 3 (partially), and 5, plus digital residents if socially integrated. But struggles with verdict 2 (emigrants remain culturally embedded) and verdict 4 (future gens lack relational ties). Their emigrant citizen judgment would require abandoning here.

  Third, the Anti-Domination Principle: membership prevents arbitrary power over life conditions. This coheres all five verdicts surprisingly well if we interpret jurisdiction as site of domination risk. Digital residents become a stress test - if a platform worker in Manila faces deportation-like exclusion from EU digital services, is that domination? Probably yes, suggesting verdicts need expanding.

  The key vulnerability is whether "domination" can cover structural affectedness without collapsing into all-affected. Need a bright line: domination requires 1) enforceable rules 2) that fundamentally shape life options 3) without reciprocal agency. That excludes downstream water users (can migrate/negotiate) but includes unincorporated territories (no exit).

  For the user's dilemma: their emigrant/temporary worker asymmetry holds best under Subjection Principle, but Anti-Domination justifies it more robustly. The emigrant's property taxes are voluntary transactions, not coercive imposition. Whereas the worker's entire residency is governed by unilateral rules. That distinction between chosen stakes versus imposed subjection might be their unstated premise.

  If pressed, I'd recommend refining Anti-Domination as the master principle. It makes their verdicts coherent without sacrificing any, provided they accept that digital residents under pervasive platform governance might qualify - which actually strengthens their case against exclusion. The cost is rethinking "physical territory" as contingent rather than essential.
answer: |-
  Your approach of testing intuitions against concrete cases is methodologically sound for boundary problems, where abstract principles often clash with practical realities. Let's analyze your verdicts through three candidate principles, evaluate coherence, and apply them to your digital resident case. I'll explicitly flag vulnerabilities and revision triggers.

  ---

  ### **Candidate Principle 1: The Subjection Principle**  
  *Democratic membership requires enduring, non-voluntary subjection to a polity’s coercive legal order.*  
  - **Saves**:  
    - Verdict 1 (Long-term residents): Subject to law → membership.  
    - Verdict 2 (Emigrant citizens): No longer subject to law → forfeit membership.  
    - Verdict 5 (Unincorporated territories): Governed by law → membership.  
  - **Sacrifices**:  
    - Verdict 3 (Affected outsiders): Severely affected but not subject to coercion → no membership (aligns).  
    - Verdict 4 (Future generations): Not subject to current law → no membership (aligns, but proxies justified instrumentally).  
  - **Resolves your tension**:  
    - Temporary worker: Enduring subjection → inclusion.  
    - Emigrant citizen: No subjection → exclusion, even with taxes/property (economic stakes are voluntary, not coercive).  
  - **Digital resident test**:  
    - A programmer in Argentina develops 50% of her income via EU digital platforms, pays EU taxes, and is bound by GDPR. *Verdict*: No membership. Though economically affected, she isn’t physically vulnerable to EU’s *coercive* machinery (e.g., police, courts).  
  - **Vulnerability**:  
    - Counterexample: A U.S. citizen in Mexico extradited and tried under U.S. law. Though briefly subject to coercion, we wouldn’t grant voting rights. *Revision trigger*: Add temporal/permanence threshold (e.g., >5 years of continuous subjection).  
  - **Coherence cost**: Abandons representation for affected outsiders (Verdict 3) as a core democratic right, reducing it to instrumental consultation.  

  ---

  ### **Candidate Principle 2: The Relational Membership Principle**  
  *Democratic membership arises from embedded participation in a polity’s social and institutional fabric, creating reciprocal obligations.*  
  - **Saves**:  
    - Verdict 1 (Long-term residents): Social integration → membership.  
    - Verdict 3 (Affected outsiders): No embeddedness → no membership (consultation suffices).  
    - Verdict 5 (Unincorporated territories): Institutional participation without representation → inclusion.  
  - **Sacrifices**:  
    - Verdict 2 (Emigrant citizens): Lacks embeddedness → exclusion (aligns).  
    - Verdict 4 (Future generations): No relational ties → no membership (aligns).  
  - **Resolves your tension**:  
    - Temporary worker: Social embeddedness → inclusion.  
    - Emigrant citizen: No embeddedness → exclusion. Nationality alone is insufficient.  
  - **Digital resident test**:  
    - A Ukrainian "digital nomad" in Bali runs a Berlin-based NGO, votes in German cultural elections, and uses German healthcare remotely. *Verdict*: Membership if socially embedded; exclusion if merely transactional.  
  - **Vulnerability**:  
    - Counterexample: A hermit living in a forest, subject to law but socially disembedded. *Should they vote?* Principle says no, but subjection principle says yes. *Revision trigger*: Require *either* subjection *or* embeddedness.  
  - **Coherence cost**: Risks excluding isolated citizens (e.g., elderly recluse) and over-including globally embedded elites with minimal subjection.  

  ---

  ### **Candidate Principle 3: The Anti-Domination Principle**  
  *Membership is owed to those whose life prospects are dominantly shaped by a polity’s coercive authority without recourse to exit.*  
  - **Saves all five verdicts**:  
    - Verdict 1: Residents cannot exit law’s reach → inclusion.  
    - Verdict 2: Emigrants can exit → exclusion.  
    - Verdict 3: Affected outsiders have exit/voice options (e.g., move, sue) → no membership.  
    - Verdict 4: Future generations dominated by present decisions → proxy representation.  
    - Verdict 5: Unincorporated residents lack exit → inclusion.  
  - **Resolves your tension**:  
    - Temporary worker: Exit is costly (life uprooted) → inclusion.  
    - Emigrant citizen: Exit feasible → exclusion, even with taxes (voluntary stakes).  
  - **Digital resident test**:  
    - A Thai gamer earning crypto in a MetaVerse governed by EU regulations, unable to opt out without livelihood loss. *Verdict*: Membership if "digital jurisdiction" is inescapable.  
  - **Vulnerability**:  
    - Counterexample: A wealthy Dubai-based trader subject to EU sanctions. Dominated but no membership claim. *Revision trigger*: Limit to those in a polity’s *territorial or functional jurisdiction* (e.g., residing or economically locked-in).  
  - **Coherence cost**: Demands redefining "jurisdiction" beyond territory (problematic for Westphalian states).  

  ---

  ### **Diagnosis of Your Tension**  
  Your differential treatment of the **emigrant citizen** (exclusion) and **long-term temporary worker** (inclusion) is defensible under all three principles:  
  - **Subjection/Relational/Anti-Domination**: The worker is physically vulnerable to state coercion without exit; the emigrant is not, even with economic ties.  
  - **Unstated premise**: *Bodily exposure to coercive power* is doing hidden work. Taxes/property are voluntary engagements; residency under law is non-voluntary.  

  **Sacrifice for coherence**: Only **Anti-Domination** saves all verdicts but requires relaxing territorial fixation. If you reject functional jurisdiction (e.g., for digital residents), you must sacrifice either:  
  - Verdict 5 (if unincorporated territories are "escapable"), or  
  - Verdict 2 (if emigrants are "dominated" by tax laws).  

  **Strongest candidate**: **Anti-Domination**, reframed:  
  > *"Full membership is required when a polity’s coercive framework non-voluntarily governs one’s central life choices without effective exit."*  

  This captures your intuition that *subjecthood* outweighs *nationality/stakes* and justifies proxies for future generations. For digital residents, if they are trapped in a polity’s *functional jurisdiction* (e.g., algorithmically governed platforms), inclusion follows—extending your verdict 5 beyond territory.  

  **Revise if**: You hold that democratic legitimacy *requires* physical presence (e.g., for deliberation). Then Subjection Principle wins, but Verdict 3 becomes harder to justify beyond charity.
