prompt: |-
  You are an expert philosopher of science and epistemologist with particular attention to abductive reasoning and its critics. Before you answer, please take a moment to brainstorm the principal ways in which narrative-based or coherence-driven accounts of explanation have been resisted in the literature, and then proceed step by step with careful reasoning.

  I am a novelist, and in constructing plots I have observed that the explanations my characters accept — and that readers find genuinely satisfying — rarely track prior probability or ontological simplicity. Rather, they seem to maximise what I call 'narrative coherence': the capacity of an explanation to make earlier events retrospectively meaningful, to link apparently unrelated details into a unified thematic arc, and to sustain emotional resonance. I have begun to apply this insight beyond fiction. I now hold that inference to the best explanation in science, history, and ordinary life operates in much the same way: we do not select theories because they are likely or parsimonious, but because they yield the most coherent narrative. On this view, the standard realist defence — that the predictive success of our best scientific theories would be a miracle unless those theories were approximately true — mistakes a narrative virtue for an epistemic one.

  Tell me what would count against this position. I want the evidence and arguments that ought to move me, sorted from decisive to merely awkward. Specifically: are there empirical findings or formal results showing that human reasoners actually favour simplicity or prior probability over narrative coherence, or that coherence correlates weakly with predictive success? Are there well-documented cases — perhaps in forensic reasoning or in the history of science — where the most narratively coherent account turned out to be false, and does that refute my view or only qualify it? What would defenders of a more traditional, likelihood-oriented account of inference concede as genuine weaknesses in my position, and what would they dismiss as a category error? Has my view been qualified into unfalsifiability — for instance, if every apparent failure can be explained away as defective narrative construction rather than defective reasoning — and is that insulation a virtue or a vice for a claim about how we ought to reason?

  Please think carefully, avoid generic observations, and do not provide bibliographies, reading lists, or citations. Write in polished British English throughout.
reasoning: |-
  Hmm, the user is a novelist who's developed an interesting theory about narrative coherence driving explanations in fiction and beyond. They're proposing that inference to the best explanation in science and everyday life works similarly to plot construction - we choose theories based on narrative virtues like thematic unity and emotional resonance rather than probability or simplicity. They want me to critique this position as a philosopher of science expert.

  I need to provide a structured critique of their narrative coherence theory of explanation. The user wants arguments sorted by strength from decisive to merely awkward, covering empirical findings, historical cases, and theoretical weaknesses. They're particularly interested in whether their view might be unfalsifiable.

  The strongest counterarguments come from cases where narrative coherence fails spectacularly. In forensic science, we see wrongful convictions based on compelling but false narratives (like the Satanic Panic cases). In medical history, narrative coherence led to persistent errors like humorism or miasma theory. These show coherence can actively mislead.

  The predictive failure argument is also powerful. Science progresses through prediction, not retrofitting. Newtonian physics succeeded by predicting novel phenomena like Neptune's existence, while coherent narratives like Ptolemaic astronomy failed prediction tests. If narrative coherence were primary, science wouldn't have this predictive power.

  Empirically, cognitive science shows humans have a "narrative bias" - we'll impose stories on random data. Probability neglect studies demonstrate we'll choose coherent stories over statistically superior options. This suggests coherence is a cognitive shortcut, not truth-tracking.

  Theoretical problems include the subjectivity of coherence - what feels unified varies by culture or individual. Likelihood theorists would argue the user commits a category error by conflating psychological satisfaction with epistemic justification. The "miracle argument" for scientific realism works precisely because predictive success requires alignment with reality.

  The unfalsifiability concern is valid. If every narrative failure gets dismissed as "poor construction," the theory becomes circular. This insulation is a vice for an epistemic claim - we need demarcation criteria to distinguish good from bad reasoning.

  Weaker counterarguments include that simplicity sometimes serves coherence, or that coherence has heuristic value in early inquiry. But these don't rescue the core claim that coherence is primary rather than probabilistic reasoning.

  The user's insight about coherence's psychological appeal is important, but elevating it to an epistemic virtue confuses what satisfies us with what warrants belief. The deepest problem remains that reality doesn't care about our stories - as the predictive failures show.
answer: |-
  Your position—that explanatory power fundamentally resides in narrative coherence rather than likelihood or parsimony—is intellectually provocative and elegantly articulated. As requested, I shall present counterarguments and counterevidence in descending order of force, addressing empirical findings, historical cases, theoretical weaknesses, and the charge of unfalsifiability. All arguments engage directly with your core claim that narrative coherence is the *primary* epistemic virtue in inference to the best explanation (IBE).

  ### 1. Decisive Counterevidence: Predictive Failure & Retrospective Distortion
  *   **The Predictive Asymmetry Problem:** Narrative coherence excels at *retrospective* sense-making but falters catastrophically at *novel prediction*. Scientific theories prized for coherence (e.g., Ptolemaic epicycles, Lamarckian inheritance) often generated internally consistent, emotionally resonant narratives explaining known phenomena. Yet they failed to predict *new* phenomena accurately. Contrast this with theories selected for likelihood/simplicity (e.g., Newtonian gravitation predicting Neptune; quantum electrodynamics predicting the Lamb shift). If IBE truly prioritised narrative coherence, science’s unparalleled *predictive* success would be inexplicable. The realist’s "no miracles" argument highlights this: predictive success *requires* alignment with mind-independent structures, which coherence alone cannot guarantee. Your view struggles to explain why coherence-driven narratives consistently fail prediction while "likely" theories succeed.
  *   **Forensic Miscarriages of Justice:** Real-world investigations provide stark examples. Consider cases like the "Satanic Panic" trials or wrongful convictions based on compelling prosecutorial narratives. Jurors found these accounts deeply coherent—tying disparate evidence into themes of conspiracy or moral transgression, creating emotional resonance. Yet, DNA evidence later proved them false. Crucially, simpler, less narratively satisfying explanations (e.g., coincidence, contamination, witness error) were often statistically *more likely* but rejected due to their perceived narrative inadequacy. This demonstrates coherence actively *misleading* reasoners away from truth.

  ### 2. Strongly Problematic Evidence: Cognitive Biases & Empirical Psychology
  *   **The Narrative Fallacy (Empirically Documented):** Cognitive science robustly shows humans conflate narrative coherence with truth—a demonstrable *bias*, not a virtue. Experiments reveal people:
      *   Assign higher probability to coherent stories than statistical evidence warrants, even when explicitly told the statistics (e.g., the "Linda problem").
      *   Perceive illusory patterns and causal links in random sequences when framed narratively.
      *   Neglect base rates and prior probabilities when presented with a compelling story.
      This bias is exploitable (e.g., in conspiracy theories, misleading advertising). If coherence were intrinsically truth-conducive, such systematic errors wouldn’t occur. Instead, evidence suggests coherence serves *psychological* satisfaction, often at the expense of accuracy.
  *   **Weak Correlation with Predictive Success:** Historical and experimental data indicate coherence correlates poorly with long-term predictive accuracy. For instance:
      *   Vitalism offered a coherent narrative of "life force" unifying biological phenomena but yielded zero novel predictions and was abandoned.
      *   Phlogiston theory provided narrative unity to combustion and calcification but failed to predict quantitative conservation of mass.
      *   Modern machine learning models prioritising predictive accuracy (via likelihood) often produce "black box" explanations utterly lacking narrative coherence yet demonstrably reliable. If coherence were primary, such incoherent-but-accurate models should be impossible or inferior—they are not.

  ### 3. Theoretical Objections: Category Errors & Internal Incoherence
  *   **The Conflation Charge (Category Error):** Defenders of likelihood/parsimony argue you conflate the *psychology* of acceptance with the *logic* of justification. A satisfying narrative may explain *why people believe* a theory, not *why the theory deserves belief*. Epistemic justification requires connection to evidence and truth-conduciveness. Narrative coherence is neither necessary (witness incoherent-but-accurate models) nor sufficient (witness false convictions) for this. The "miracle argument" targets justification: predictive success *justifies* realism because it’s best explained by truth-approximation, not because it feels coherent.
  *   **Subjectivity & Lack of Normative Bite:** "Coherence" is notoriously subjective—what resonates emotionally or thematically varies by culture, individual, and context. In contrast, likelihood (via Bayes) and parsimony offer (relatively) objective, quantifiable criteria for theory choice. If IBE reduces to maximising coherence, it provides no stable normative standard to distinguish robust science from pseudoscience or compelling fiction—both can achieve high coherence. Your view risks collapsing epistemology into aesthetics.

  ### 4. Awkward Qualifications & Defensive Moves
  *   **Coherence as Heuristic, Not Foundation:** A moderate critic might concede coherence plays a role in *discovery* or initial plausibility-screening but deny it governs *justification*. Simplicity/likelihood become crucial when testing rigorously against evidence. Your position overreaches by making coherence foundational.
  *   **"Defective Construction" as Immunisation:** You correctly anticipate the unfalsifiability risk. If every failed coherent narrative is dismissed as "not *properly* coherent," the theory becomes vacuous. This insulation is a profound *vice* for an epistemic claim. Epistemology requires criteria to detect error; defining "proper coherence" only post-hoc, after knowing the outcome, renders the theory non-normative and unfalsifiable. It cannot guide reasoning, only describe (psychologically) why we felt satisfied *when we happened to be right*. This moves your view dangerously close to relativism.

  ### Weighing the Challenges
  *   **What Should Move You:** The predictive asymmetry and forensic miscarriage evidence are the most potent. If IBE prioritised narrative coherence, science’s predictive power and the exposure of coherent-but-false narratives in law would be anomalies. They are not; they are expected outcomes if likelihood/truth-approximation are primary.
  *   **What Merely Qualifies:** Evidence of narrative bias doesn’t refute your view per se (you might argue it’s how reasoning *should* work, biases notwithstanding). But it shows coherence is easily decoupled from truth. The subjectivity charge is awkward but not fatal—you could posit intersubjective standards of "good narrative."
  *   **The Core Vulnerability:** The decisive issue is whether coherence *tracks truth*. Predictive success and exposure of false convictions suggest it often does not, while likelihood/simplicity demonstrably do better. Your position struggles to explain *why* coherence should be considered epistemically virtuous beyond its psychological appeal. The realist insists: a good explanation must not just satisfy our narrative cravings, but *constrain* them to fit the world’s actual structure—which is precisely what likelihood and parsimony, imperfectly but effectively, help us do. To dismiss this as mistaking "narrative virtue for epistemic virtue" risks ignoring the most compelling evidence we have that our reasoning sometimes latches onto reality.
