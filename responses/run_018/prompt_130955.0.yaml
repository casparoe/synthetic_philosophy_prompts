  - **Metaphysical deflationism**: The totem’s wobble doesn’t reveal a "truth essence"—it updates beliefs. Yet Mal’s suicide hinges on her *certainty* about reality, which deflationism would call misplaced (truth isn’t a thing to be certain *of*, just a marker for evidence). 

