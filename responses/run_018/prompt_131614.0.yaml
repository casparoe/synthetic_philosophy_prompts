answer: |-
  **Bottom line:** Assertion norms are validation protocols for adding data to your trusted repository, mirroring how archivists gate information based on verification rigor.

  *   **Knowledge Norm:** You **sign the chain-of-custody** *only* after **full bit-level verification** confirms both integrity *and* source authenticity (like known-good transfer logs).  
      *Residue:* Philosophy debates "justification" levels; archives typically have binary "verified/unverified" on technical integrity, less on semantic meaning.

  *   **Truth Norm:** You **tag metadata as "verified"** *only* if the **checksum matches** the original ingest manifest.  
      *Residue:* Archives confirm *bit integrity*, not whether the *content* accurately represents reality (e.g., a corrupt file showing "1+1=3" passes checksum but is false).

  *   **Belief Norm:** You **attach "best-guess" metadata** based on a **partial scan** or contextual clues, even before full verification.  
      *Residue:* Archives prioritize verifiable integrity; subjective confidence ("belief") without evidence is insufficient for trusted assertions.

  **Missing Pieces:** Yes, your framework lacks the *semantic dimension*. Archives verify *bit-preservation* (technical integrity), while assertion norms govern *propositional truth* (meaning/content). Philosophers debate "justification" levels for truth claims, akin to arguing *how many* independent checksums or provenance logs are needed before declaring semantic accuracy "verified" – a nuance beyond file integrity. Your protocols ensure the record is unchanged; theirs interrogate if the unchanged record *itself* constitutes reliable truth. For archival custody, the philosophers' finer distinctions *are* often semantic metadata splitting, but become crucial when the *content's* truth-value directly impacts action.
