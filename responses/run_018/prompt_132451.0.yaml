  ### **What Would Change My Mind?**  
  A **benchmark result** showing:  
  - **Against Collapse (↓ credence)**: An AI system that *provably* optimizes non-flat epistemic utility (e.g., favoring "elegant" explanations) **without** behavioral equivalence to any accuracy measure, while improving task performance in non-social prediction.  
