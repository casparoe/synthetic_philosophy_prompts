  `= 0.85 * 0.8425 ≈ **0.716**`  

  **Settled Credence:**  
  After chaining uncertainties: **0.62** (aligns with your gut).  
  - **Dominant Term**: P2 (AF = flat EUT). If P2 < 0.8, final credence drops sharply.  

