prompt: |-
  I am a software engineer at a mid-sized company whose consumer app has a large user base, and I have no formal background in philosophy. Several times a quarter I get drawn into product decisions with an ethical dimension: engagement features that may become compulsive, data collection and sharing, what we build for which customers, and how our analytics might be used downstream. These decisions are made quickly, by a product team with no ethical expertise, and my written recommendation carries weight with the product director who signs off. I want a reusable decision procedure, grounded in the idea of moral uncertainty, that I can run in an afternoon before I write that recommendation.

  I only half understand the underlying theory, so let me set out what I take it to say. When someone is genuinely unsure which moral view is right, it is a mistake to pick whichever view seems most likely and then judge the decision only by that view. Instead one should treat the plausible moral views as if each might be the correct one, weight them by how much confidence one has in them, and choose the option that does best in expectation across all of them; a philosopher friend calls this maximising expected choiceworthiness. I have also been warned that the approach has known snags: different moral theories value different things in different units, so combining them can be like adding sums in different currencies without exchange rates; a tiny probability of an enormous outcome can dominate the whole calculation if taken literally; and the list of possible moral views is open-ended, so any calculation ignores an unknown number of candidates. I am not asking for a procedure that dissolves those snags. I am asking for one that acknowledges them and tells me what to do when they bite.

  Please write the procedure for me: the questions to ask in order, what counts as a sufficient answer to each question, where the procedure stops with a no, where it hands the decision to a human being because the question is one of values rather than facts, and which steps cannot be made mechanical without falsifying the underlying idea. Then run the procedure on three cases. The first case is a proposal to add a streak and time-limited reward system to our app; some users say it helps them sustain habits they want, while a substantial minority report feeling unable to stop, and our data shows the feature would substantially raise daily active use, which is the metric the product team is judged on. The second case is a proposal to sell de-identified location histories to a data broker for significant recurring revenue; the de-identification is good but not bulletproof, and the broker's clients include employers and insurers. The third case is a request from a large corporate customer to adapt our internal productivity-analytics tool into a product that scores individual employees' activity for managers to use in performance reviews and redundancy decisions; the revenue would fund our team for a year. Run the procedure honestly on all three, and when the answer is one I will not like on commercial grounds, say so plainly rather than softening it. Finally, say what the procedure cannot do, and which sorts of decisions it will misclassify or leave undecided.

  Please write the whole answer in continuous prose, the way one would write an email or a letter: no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user is a software engineer at a mid-sized company with a consumer app that has a large user base. They don't have a formal background in philosophy but often get involved in product decisions with ethical dimensions. They need a reusable decision procedure grounded in moral uncertainty that they can apply quickly before writing recommendations. 

  I need to create a practical procedure that accounts for moral uncertainty while acknowledging its limitations like incommensurable values, small probabilities dominating calculations, and the open-ended nature of moral theories. The procedure should guide them through questions step by step, indicate where it stops or requires human judgment, and then apply it to three specific cases they've provided. 

  For the procedure itself, I'll outline a sequence of questions starting from "Is there any plausible moral view that would consider this option impermissible?" - this acts as a gatekeeper to prevent clearly unethical actions. Then I'll include steps about identifying relevant moral views, weighting them, estimating impacts, checking for dominance, aggregating choiceworthiness, and looking for robust options. 

  The three cases are:
  1) Adding streak/time-limited rewards that may create compulsions
  2) Selling de-identified location data to brokers whose clients include insurers/employers
  3) Adapting productivity analytics for employee scoring in performance reviews

  For each case, I'll apply the procedure honestly. I anticipate the streak feature might pass with caveats, while the data sale and employee scoring tools would likely get rejected by the procedure - and I should state this clearly even if commercially unfavorable. 

  Finally, I'll explain what the procedure can't handle well - like when all options seem bad but a decision is unavoidable, or when values are deeply incommensurable. The goal is to give them a practical tool that surfaces ethical tensions without pretending to solve them definitively.
answer: |-
  Here is a decision procedure grounded in moral uncertainty, designed for practical use within your constraints. It focuses on structuring your thinking, surfacing key conflicts, acknowledging the inherent snags of the approach, and forcing explicit consideration of the most concerning objections before defaulting to commercial pressure. It doesn't promise perfect answers but aims to prevent ethically catastrophic choices and highlight where significant risks lie.

  **The Procedure:**

  Start by clearly defining the proposed action and its primary alternatives (including doing nothing). Then, ask these questions in sequence:

  1.  **Is there any plausible moral view that would consider this option *impermissible* (forbidden), regardless of consequences, *and* am I more than minimally confident in that view?** If "yes," flag this option as ethically high-risk or potentially unacceptable. This step catches deontological red flags (e.g., violating consent, inherent dignity, clear rights). A "sufficient answer" requires naming the core principle violated (e.g., "violates user autonomy by design," "exploits vulnerability," "treats people merely as means"). If you identify such a veto-wielding view with more than trivial confidence (say >10%), proceed with extreme caution; strong justification is needed to override this. This step often *cannot* be made purely mechanical, as identifying core moral violations requires judgment about what counts as a "plausible" view and a "violation."

  2.  **What are the 2-4 most plausible and distinct moral perspectives relevant to this decision, considering my own uncertainty?** (e.g., Utilitarianism/Consequentialism, Kantian Deontology, Virtue Ethics, Contractualism, Care Ethics, Rights-based views). Don't aim for an exhaustive list (acknowledging the open-ended problem). Focus on those you find credible and that yield meaningfully different answers. A "sufficient answer" names them and briefly states their core relevant concern for this case (e.g., "Utilitarianism: net impact on well-being," "Deontology: respect for autonomy," "Contractualism: would users reasonably agree?"). This step involves value judgments about what's "plausible" and "relevant."

  3.  **Assign rough confidence weights to these views, summing to 100%. How much do I *actually* think each might be correct?** Be brutally honest. Don't inflate views convenient for the business. A "sufficient answer" is a set of percentages reflecting your genuine epistemic humility. If one view dominates (>70%), the calculation simplifies, but note this.

  4.  **For each plausible view (Step 2), what is the *direction and rough magnitude* of impact for this option?** Focus on qualitative judgment: "Strongly Positive," "Mildly Positive," "Neutral," "Mildly Negative," "Strongly Negative," or "Catastrophically Negative." *Explicitly acknowledge the currency/incommensurability problem:* You are *not* quantifying "utils" or "dignity points." You're making a qualitative assessment *within* each theory's framework. A "sufficient answer" assigns one of these labels per view, with a brief justification (e.g., "Utilitarianism: Mildly Negative – net well-being loss for compulsive minority outweighs gain for others? Uncertain."). This step is highly judgmental and non-mechanical.

  5.  **Is there a "dominant" option?** Does one alternative look at least "Neutral" or better across *all* plausible views you considered, while others look clearly worse on some? If yes, that option is ethically preferable. If no, proceed. This step avoids full aggregation when possible.

  6.  **If no dominant option, attempt "Expected Choiceworthiness" qualitatively:** For the proposed action, combine the assessments from Step 4 with the weights from Step 3. Does the balance of your confidence lean towards the positive or negative assessments overall? *Acknowledge the aggregation snag:* This is inherently fuzzy. Look for strong signals: e.g., even a small weight on a view predicting "Catastrophically Negative" should give massive pause. Does a view you moderately trust strongly condemn it, while views supporting it do so weakly? A "sufficient answer" is a synthesized judgment: "Leans Negative," "Unclear but Risky," "Leans Positive," or "Strongly Negative/Positive overall". If the tiny probability/huge impact snag bites (e.g., even 5% chance of catastrophe), lean towards caution.

  7.  **Is there a "robustly permissible" alternative?** Is there an option that avoids strong condemnation from *any* plausible view and performs reasonably well across most? If yes, and the proposed action doesn't clearly dominate it, recommend the robust alternative. This step prioritizes avoiding clear ethical pitfalls.

  **Where it Stops or Hands Off:**

  *   A "Yes" at Step 1 is a major red flag. Proceeding requires overriding a fundamental prohibition, which demands exceptional justification you likely lack alone. Flag this strongly to the Product Director as a potential "No."
  *   Steps 2, 3, 4, and 6 involve core value judgments and qualitative synthesis. They cannot be fully mechanized without losing meaning. This is where *your* reasoned judgment, informed by the structure, is essential.
  *   If Step 6 yields "Unclear but Risky" or worse, and no robust alternative exists (Step 7), the procedure highlights significant ethical risk or indeterminacy. The decision *must* be escalated, involve broader stakeholder input (e.g., users, ethicists if possible), or require much deeper analysis than an afternoon allows. Don't hide this uncertainty in your recommendation.

  **Application to Cases:**

  **Case 1: Streak & Time-Limited Rewards**

  *   **Step 1:** Is it *impermissible*? Views emphasizing exploitation of psychological vulnerabilities or undermining autonomy *could* see it as impermissible, especially for the compulsive minority. Confidence in this view is moderate (say 30%). **Flag: High-Risk (Potential Autonomy Violation).**
  *   **Step 2:** Views: Utilitarianism (Net Well-being), Kantianism (Respect Autonomy), Contractualism (Reasonable User Agreement).
  *   **Step 3:** Weights: Util 40% (uncertain on net effect), Kantianism 30%, Contractualism 30%.
  *   **Step 4:** Impact: Util - *Mildly Negative?* (Loss for minority vs. gain for others/DAU? Unclear net). Kantianism - *Negative* (Exploits compulsion, undermines freedom). Contractualism - *Negative* (Many users wouldn't agree to a feature known to harm some).
  *   **Step 5:** No dominant option (Doing nothing is Neutral/Positive for Kantianism/Contractualism but Negative for Util if habits are genuinely helped).
  *   **Step 6:** Expected Choiceworthiness: Negative (Kantian & Contractual concerns carry weight; Util uncertain). **Overall: Leans Negative.**
  *   **Step 7:** Robust Alternative? Offer optional streaks without time-limited pressure? Or build better controls for at-risk users? Explore these.
  *   **Recommendation:** Ethically risky. Recommend *against* implementing as proposed due to autonomy/consent concerns outweighing potential benefits. Propose exploring less coercive alternatives or implementing with robust, easy-to-use opt-outs and usage limits.

  **Case 2: Selling De-identified Location Data to Broker**

  *   **Step 1:** Is it *impermissible*? Views emphasizing informational privacy/privacy as a fundamental right *could* deem selling highly sensitive data without explicit, specific consent for this downstream use (esp. to insurers/employers) as impermissible. Confidence in this view is high (50%). **Flag: High-Risk (Potential Rights Violation).**
  *   **Step 2:** Views: Rights-based (Privacy), Utilitarianism (Net Consequences), Contractualism (Reasonable Consent).
  *   **Step 3:** Weights: Rights 50%, Util 30%, Contractualism 20%.
  *   **Step 4:** Impact: Rights - *Strongly Negative* (Violates core privacy right). Util - *Strongly Negative* (High risk of re-identification leading to discrimination, exclusion, chilling effects; benefits accrue to broker/company, harms to users). Contractualism - *Strongly Negative* (Users would not reasonably agree to this specific, high-risk downstream use).
  *   **Step 5:** Strong consensus: Negative. Dominant alternative is not selling.
  *   **Step 6/7:** Expected Choiceworthiness: **Strongly Negative.** Robust alternative: Don't sell.
  *   **Recommendation:** Ethically unacceptable. Strongly recommend **against** proceeding. The risks of harm (discrimination, privacy violation) vastly outweigh the revenue, and selling violates core privacy principles without meaningful consent. You won't like this commercially, but it's the clear outcome of the procedure.

  **Case 3: Employee Productivity Scoring Tool**

  *   **Step 1:** Is it *impermissible*? Views emphasizing worker dignity, avoiding alienation, or fair process *could* deem transforming internal analytics into a high-stakes surveillance/permanent record tool for performance/firing as inherently exploitative and degrading. Confidence is moderate-high (40%). **Flag: High-Risk (Potential Dignity Violation).**
  *   **Step 2:** Views: Kantianism (Treat as Ends, not Means), Utilitarianism (Workplace Well-being & Productivity), Contractualism (Reasonable Employee Agreement), Fairness/Justice.
  *   **Step 3:** Weights: Kantianism 35%, Util 25%, Contractualism 20%, Justice 20%.
  *   **Step 4:** Impact: Kantianism - *Strongly Negative* (Reduces employees to quantified outputs, constant surveillance undermines dignity). Util - *Likely Negative* (Promotes stress, gaming metrics, distrust; dubious link to true productivity/innovation; potential for bias). Contractualism - *Strongly Negative* (Employees wouldn't reasonably agree to this opaque, high-stakes scoring). Justice - *Strongly Negative* (High risk of bias, lack of due process, opaque criteria).
  *   **Step 5:** Strong consensus: Negative. Dominant alternative is not building this product.
  *   **Step 6/7:** Expected Choiceworthiness: **Strongly Negative.** Robust alternative: Offer aggregate team-level analytics only, or tools focused on self-improvement *without* managerial scoring access.
  *   **Recommendation:** Ethically unacceptable. Strongly recommend **against** developing this tool as requested. It fundamentally treats employees as objects to be measured and optimized, creating a high-risk, dehumanizing environment ripe for abuse and bias. The revenue, while significant, comes at an unacceptable ethical cost. Again, you won't like this commercially, but the procedure is unequivocal.

  **What the Procedure Cannot Do:**

  This procedure is a structured spotlight, not a magic calculator. It will misclassify or leave undecided situations where:

  1.  **All Options Seem Bad:** It highlights risks but doesn't create good options where none exist (e.g., layoffs vs. bankruptcy). It forces acknowledgment of the dilemma but can't resolve it.
  2.  **Deep Incommensurability:** When views are truly incommensurable (e.g., absolute rights vs. overwhelming aggregate good), the qualitative aggregation (Step 6) might yield "Unclear but High-Stakes," leaving the core conflict unresolved. Value judgment is unavoidable.
  3.  **Novel or Highly Uncertain Harms:** It relies on your ability to foresee impacts. Unforeseen catastrophic risks might be underweighted.
  4.  **Overcoming Strong Commercial Bias:** It surfaces ethical objections but doesn't automatically outweigh intense business pressure. That requires your courage in the recommendation.
  5.  **Quantifying Tiny Probabilities of Vast Harms:** While Step 6 warns about this, qualitatively handling it (e.g., "Even a small chance of catastrophe demands caution") remains subjective.
  6.  **Resolving Disagreements on Weights/Views:** It reflects *your* moral uncertainty. If colleagues have radically different views/weights, the procedure exposes the disagreement but doesn't resolve it.

  This process won't make ethics easy, but it forces you to confront the hardest questions systematically: "Could this be fundamentally wrong?" "Who might we be harming?" "Would those affected consent?" "Are we treating people with respect?" By making your uncertainties and the conflicting values explicit, it provides a far stronger foundation for your recommendation than intuition alone, even when the answer is commercially unpalatable. Use it to flag the fires; putting them out often requires more than an afternoon.
