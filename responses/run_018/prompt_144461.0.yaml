  For negotiability: Non-negotiables must protect autonomy fundamentals - like intentionality without deception about the act itself. Camp-specific preferences include disclosure levels (full info vs. reasonable risk) and prior consent validity. The structural coercion debate is key - whether dependency automatically voids consent or just conditions it.

  Conflicts are where this gets thorny. Preventing manufactured opacity might require aggressive disclosure that overwhelms dependent patients. Honoring prior consent during competence drift could harm present selves. And deception standards could paralyze routine consent if we demand impossible epistemic certainty. These tensions expose real limits in consent theory.

