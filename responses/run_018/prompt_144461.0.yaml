answer: |-
  ## Full Specification: Theory of Valid Consent

  **Core Desiderata & Motivating Cases:**

  1.  **Non-Deception (Core Nature):** Consent must not be based on deception about the *fundamental nature of the act* or *core identity of the agent*. *Non-Negotiable.*
      *   *Motivating Case:* Person A consents to a medical procedure believing it's a diagnostic scan, but it's actually an experimental treatment (deception about act nature). Person B signs a contract believing they are dealing with Company X, but it's actually a shell company for Competitor Y (deception about agent identity).

  2.  **Non-Deception (Material Welfare):** Consent should not be based on deception regarding *material facts directly impacting the consenter's core welfare interests* in the specific context. *Negotiable* (Extent of "materiality" and "core welfare" varies).
      *   *Motivating Case/Disctinction:* A used car salesman lies about a car's major accident history (material welfare deception) vs. exaggerating fuel efficiency slightly (less likely material). Distinguish deception *about the act/agent* from deception about *external consequences* impacting welfare.

  3.  **Absence of Coercion (Direct Threats):** Consent must not be elicited through explicit threats of wrongful harm. *Non-Negotiable.*
      *   *Motivating Case:* "Sign this contract giving me your business, or I will burn down your store" (direct, wrongful threat).

  4.  **Absence of Coercion (Structural/Exploitative Dependency):** Consent must not be extracted by exploiting severe, non-consensually imposed dependency where refusal triggers catastrophic loss of basic needs/welfare, even without explicit threats. *Negotiability Flagged* (Is structural dependency *automatically* coercive, or does validity depend on the *reasonableness* of alternatives and the *fairness* of the offer?).
      *   *Motivating Case:* A refugee in an overcrowded camp consents to dangerous labor for minimal pay because refusing means expulsion and starvation. No direct threat, but severe structural dependency is exploited.

  5.  **Competence (Threshold Capacity):** The consenter must possess sufficient cognitive and emotional capacity at the time of consent to understand the nature, foreseeable consequences, and alternatives of the act, and to reason and communicate a choice. *Non-Negotiable* (Threshold definition varies).
      *   *Motivating Distinction:* Distinguishing temporary impairment (e.g., severe intoxication, acute panic attack) from enduring incompetence (e.g., advanced dementia, severe intellectual disability). A person signing a contract while blackout drunk lacks competence.

  6.  **Manufactured Opacity (Hidden Alternatives):** Consent is invalid if relevant, materially different alternatives are systematically hidden or rendered cognitively inaccessible to the consenter through environmental design, information architecture, or choice framing, not just false statements. *Negotiable* (Scope: What counts as "relevant/material"? How much effort must be made to ensure accessibility?).
      *   *Motivating Case:* A patient consents to expensive, invasive Surgery A after consulting only the hospital's curated portal, which algorithmically suppresses information about equally effective, less invasive Procedure B available at an affiliated clinic. Alternatives exist but are made functionally invisible.

  7.  **Competence Drift (Temporal Mismatch):** The theory must address validity when a competent consenter agrees to a future act, but their decision-making capacity significantly diminishes *before* the act occurs, without revocation. *Negotiable* (How much drift invalidates? When does prior consent bind?).
      *   *Motivating Distinction:* Proxy consent for a gradually declining dementia patient (ongoing drift) vs. consent extracted during a transient lucid interval for immediate surgery vs. consent given while competent for surgery weeks later, followed by a sudden stroke causing profound incompetence *before* the surgery date (drift without revocation). Distinguishes drift *before action* from decline *after* action commences.

  **Negotiability Flags:**

  *   **Non-Negotiable:** Intentional deception about core act/agent nature, consent under direct threats, absolute lack of threshold competence at consent moment. Fundamental to intentionality and voluntariness.
  *   **Camp-Specific Preferences:**
      *   *Disclosure:* Full material disclosure (strict) vs. Reasonable disclosure of significant risks/alternatives (pragmatic).
      *   *Coercion Scope:* Structural dependency = automatically vitiating (critical theory) vs. vitiating only if offer is exploitative/unreasonable given alternatives (libertarian-leaning).
      *   *Temporal Binding:* Continuous competence required (voluntarism-focused) vs. Binding prior consent during competence drift allowed under specific conditions (pragmatic/advance directive models).
      *   *Material Welfare Deception:* Strict liability for any welfare-impacting falsehood vs. requiring intent or recklessness regarding materiality.
      *   *Manufactured Opacity:* Requires active effort to surface all material alternatives (demanding) vs. requires non-manipulative framing and accessibility of reasonably discoverable alternatives (less burdensome).
      *   *Competence Drift:* Prior consent always lapses with significant drift (present-self priority) vs. Prior consent binds if specific/procedurally robust (Ulysses contract model).

  **Suspected Conflicts (Joint Unsatisfiability):**

  1.  **Manufactured Opacity Mitigation vs. Coercion in Dependency:** Protecting against "Manufactured Opacity" (Requirement 6) demands expansive disclosure obligations (listing *all* material alternatives, explaining nuances). However, imposing such extensive disclosure *requirements* on an agent in a severe dependency relationship (Requirement 4 scenario, like the refugee camp) can itself become coercive. The dependent party may feel *compelled* to process and choose from an overwhelming array of options they lack the capacity or time to evaluate, under threat of losing essential goods if they don't "choose wisely" from the mandated list. Ensuring cognitive availability of alternatives can paradoxically create coercive pressure in contexts of vulnerability.
  2.  **Honoring Prior Consent vs. Present Welfare in Competence Drift:** Honoring binding prior consent during "Competence Drift" (Requirement 7, favoring autonomy of past self, e.g., Ulysses contract) can directly conflict with protecting the *present welfare interests* of the now-incompetent individual. The prior consent might authorize an act (e.g., risky experimental treatment, property transfer) that the present self, lacking capacity, would clearly reject if able, and which objectively harms them. Resolving this pits past autonomy against present well-being.
  3.  **Eliminating All Deception vs. Ordinary Consent Practices:** Excluding *all* deception regarding "Material Welfare" (Requirement 2 interpreted strictly) demands an impossibly high epistemic standard. Everyday medical consent (minor risks undisclosed due to low probability/severity), commercial transactions (sales puffery, incomplete disclosure of common downsides), and even social interactions involve degrees of non-disclosure or emphasis that could be construed as deception impacting welfare. Requiring perfect transparency eliminates consent as a practical concept in ordinary life.

  **Model Performance (Brief):**

  *   **Informed Consent Models:** Excel on core deception (Requirements 1, 2) and competence (5) via disclosure and capacity assessment. Struggle profoundly with structural coercion (4), manufactured opacity (6 - often assumes disclosure = accessibility), and competence drift (7 - focused on consent moment). Disclosure focus can exacerbate coercion in dependencies and misses hidden alternatives.
  *   **Pure Voluntariness Accounts:** Strong on direct coercion (3) and competence (5). Often weak or dismissive on structural coercion (4 - seen as background condition), manufactured opacity (6 - assumes choices are visible if not lied to), and competence drift (7 - consent moment is sacrosanct). Tend to underplay welfare deception (2) if not directly tied to act nature. Struggle with practical application due to narrow coercion view.
  *   **Relational Autonomy Theories:** Strongest on structural coercion (4 - sees coercion in relational context), manufactured opacity (6 - critiques choice architecture), and competence drift (7 - considers relational support/identity). Better at contextualizing material welfare deception (2). Can be weaker on providing clear, universal thresholds for competence (5) or deception about core act nature (1 - may relativize). Risk under-protecting individuals by over-emphasizing relational embeddedness. Offer the most promising framework for the boundary conditions but face challenges in establishing definitive validity criteria.
