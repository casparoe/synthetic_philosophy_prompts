answer: |-
  ### Exam Question (as it would appear)  

  **Transformative Choice and the Predictor**  
  *(90 minutes; 1,000 words maximum)*  

  Consider the following case:  
  > An agent faces a choice to undergo a profound, personally transformative experience (e.g., having a child, radically changing careers, or neurological alteration). This transformation will (1) teach her what a new experience is *like* for the first time (epistemic transformation) and (2) alter her core preferences, values, or identity (personal transformation). Before deciding, she may consult a **Predictor**: a perfectly reliable device that delivers *all propositional knowledge* about the outcomes. This includes:  
  > - Her post-transformation preferences.  
  > - Her post-transformation judgment of her own well-being.  
  > - Her post-transformation self’s evaluation of the choice (e.g., “I’m glad I chose this” or “I regret this”).  
  >  
  > Critically, the Predictor provides *no phenomenal experience* (no “what it’s like”). It only gives descriptive, third-person facts.  
  >  
  > **Variant 1**: The Predictor reports that post-transformation, she will *prefer the outcome* and *endorse having become the person who prefers it* (e.g., “I’m glad I made this change, and I approve of who I’ve become”).  
  >  
  > **Variant 2**: The Predictor reports that post-transformation, she will *prefer the outcome* but will *not endorse having become the person who prefers it* (e.g., “I’m satisfied now, but I disapprove of the past self who chose this—their values were misguided”).  

  **QUESTION**:  
  Does access to the Predictor resolve the rational dilemma of transformative choice in **both variants**? Defend your answer with reference to L.A. Paul’s framework. Use the contrast between the variants to pinpoint the *core problem* of transformative decisions: Is it fundamentally about (a) a deficit of evidence, (b) a failure of phenomenal imagination, (c) indeterminacy in comparing successive selves, or (d) a conflict about whose preferences hold authority?  

  ---

  ### Model Answer (≈700 words)  

  **Thesis**: The Predictor resolves the dilemma in Variant 1 but not in Variant 2. This contrast reveals that the core problem is not epistemic (lack of evidence or phenomenal knowledge) but normative: it concerns *who has authority* to evaluate the choice when selves are discontinuous.  

  **Argument**:  
  Paul’s central claim is that transformative choices are rationally indeterminate because the agent cannot *anticipate* the subjective value of an experience *as* the person they will become. The Predictor seemingly solves the epistemic gaps: it provides all propositional knowledge about outcomes, including future preferences and retrospective judgments (Paul’s “descriptive” facts). In **Variant 1**, this suffices for rationality. The agent knows she will endorse both the outcome *and* the transformation itself. Her current self can trust her future self’s authority, as their evaluations align diachronically. Rational choice reduces to accepting the future self’s verdict.  

  **Variant 2**, however, exposes a deeper problem. Here, the agent learns she will *be* satisfied post-transformation but will *repudiate* the agency of her pre-transformation self (e.g., “My past self chose this, but their values were shallow”). Crucially, the pre-transformation self cannot defer to the future self’s preferences because the future self explicitly denies the authority of the past self’s values. This creates a normative deadlock:  
  - The *current* self must decide, but her evaluative framework will be erased.  
  - The *future* self approves the outcome but denies the current self’s right to choose it.  

  The Predictor’s data doesn’t resolve this. It reveals the conflict but offers no rational basis for privileging one self’s authority over the other. Paul’s problem persists not from ignorance but from *incommensurable normative standpoints*.  

  **Strongest Reply & Rebuttal**:  
  *Objection*: “The Predictor *does* resolve Variant 2. The agent knows she will be happier post-change. Rational choice requires maximizing well-being, so she should transform.”  
  *Rebuttal*: This assumes well-being comparisons are neutral across selves. But if the future self rejects the past self’s *conception* of well-being (e.g., “My past self valued novelty, but true fulfillment requires stability—they were wrong”), the metrics are incompatible. Whose definition of “well-being” should govern? The Predictor cannot answer this.  

  **Diagnosing the Core Problem**:  
  The contrast between variants shows the problem is not:  
  - **(a) Deficit of evidence**: The Predictor provides all facts.  
  - **(b) Failure of phenomenal imagination**: The dilemma remains in Variant 2 despite perfect propositional knowledge.  
  - **(c) Indeterminacy in self-comparisons**: The Predictor *enables* comparisons (e.g., “I will be happier”).  
  Instead, it is **(d) A conflict about preference authority**. Variant 1 works because authority is transferred consensually; Variant 2 fails because the future self voids the current self’s normative standing. The problem is about *legitimacy*, not knowledge.  

  **Conclusion**:  
  Paul’s argument is often misconstrued as purely epistemic. This case shows its normative core. Transformative choices force us to ask: When selves fracture, who owns the right to choose? The Predictor solves the “knowledge problem” but not the “authority problem.”  

  ---

  ### Marking Scheme (Total: 20 points)  

  | **Move**                                                                 | **Points** | **Common Error**                                  |  
  |--------------------------------------------------------------------------|------------|---------------------------------------------------|  
  | 1. **Identifies the Predictor’s role**: Explains how it addresses (or not) Paul’s epistemic challenges. | 4 | Misstates Predictor’s capabilities (e.g., claims it gives phenomenal knowledge). |  
  | 2. **Analyzes Variant 1**: Correctly concludes the dilemma is resolved here & explains why (alignment of endorsement). | 4 | Assumes resolution without justifying why endorsement matters. |  
  | 3. **Analyzes Variant 2**: Correctly concludes the dilemma persists & identifies the authority conflict. | 4 | Reduces Variant 2 to an epistemic gap or misses the non-endorsement implication. |  
  | 4. **Diagnoses core problem**: Uses the variant contrast to argue the issue is preference authority (d), rejecting (a)-(c). | 4 | Vaguely gestures at "values changing" without specifying normative authority. |  
  | 5. **Engages strongest reply**: Objects that happiness metrics resolve Variant 2 & rebuts by citing incommensurability. | 4 | Omits or superficially addresses counterarguments. |  

  **A-Range (18–20) vs. B-Range (14–16) Differentiation**:  
  - **A-Range**: Explicitly frames the dilemma as *normative* (authority/legitimacy), not epistemic. Uses Variant 2’s non-endorsement to show that rational justification requires diachronic value alignment. Rebuts objections by highlighting the incomparability of pre/post selves’ evaluative standards.  
  - **B-Range**: Competently reconstructs Paul’s argument and applies it to the case. Recognizes that the Predictor resolves Variant 1 but not Variant 2, but treats this as an *information* or *imagination* deficit ("The agent still can’t *feel* the future"). Fails to interrogate *whose preferences* should govern the choice or why non-endorsement creates a unique problem. May conflate Variants 1 and 2.  

  ---  
  This question forces engagement beyond Paul’s surface claims by testing whether students grasp that the "problem" of transformative choice is not *knowing* the future but *authorizing* it. The model answer and rubric reward isolating normative authority as the crux.
