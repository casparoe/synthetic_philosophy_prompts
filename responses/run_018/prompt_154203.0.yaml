  I read a summary of G. E. Moore's ethical view that runs as follows: "Moore holds that friendship and aesthetic enjoyment are the only supreme intrinsic goods. But he treats friendship as essentially a form of aesthetic contemplation directed at an animate object—loving a friend is structurally the same as admiring a painting, except the object possesses virtue. Because of this, Moore denies that relationships have any emergent ethical value; the worth of a friendship is just the sum of the pleasant feelings each party experiences, with no organic unity. His principle of organic unity applies only to compound aesthetic states, like appreciating a sunset with a friend, but never to the interpersonal bond itself. So Moore is ultimately a hedonist about personal relations, and anyone who thinks friendship is irreducibly valuable is contradicting his system." I suspect this misreads Moore in several places, though I can see why it sounds plausible. Is it a fair summary? Please distinguish what Moore would accept from what he would reject, flag any conflation between his aesthetic and ethical claims, and say whether the charge that he is a hedonist about friendship actually follows from his real commitments. Keep your answer under 400 words and lead with a single-sentence bottom line: is the summary broadly fair or not?
reasoning: |-
  Hmm, the user is asking about a summary of G.E. Moore's ethical views, specifically whether it's fair. They've shared a summary that claims Moore reduces friendship to aesthetic contemplation and is ultimately a hedonist about relationships. I need to evaluate this carefully.

  Looking at Moore's actual work in Principia Ethica, I recall he does describe personal affection and aesthetic enjoyment as the greatest intrinsic goods. But the summary makes several questionable claims. Moore explicitly treats friendship as an organic unity in Chapter VI - it's not just summed pleasures. He writes that the whole (friendship) is valuable beyond the sum of its parts (pleasurable feelings). That directly contradicts the summary's claim about no emergent value.

  The aesthetic comparison is partly right - Moore does discuss appreciating beauty in persons. But he doesn't reduce friendship to merely contemplating an animate object. The summary misses Moore's crucial distinction: friendship involves mutual affection and shared experiences, which create new value through organic unity.

  The hedonism charge is particularly misleading. Moore rejected hedonism explicitly. While pleasure is a component, he insisted the whole complex of friendship has non-hedonic value. The summary conflates Moore's aesthetic theory (where he applies organic unity to art appreciation) with his ethical theory about relationships.

  The user seems philosophically sophisticated - they suspect misreading and want precise distinctions. They're probably studying ethics and need clarification for academic work. Beyond factual correction, they may be wrestling with how to value relationships intrinsically, which Moore actually supports despite this flawed summary.

  Key corrections needed: 1) Moore absolutely attributes emergent value to friendship via organic unity, 2) the aesthetic analogy is limited, 3) he's not a hedonist. The summary gets the basic goods right but distorts their structure and value.
answer: |-
  **Bottom line:** This summary is unfair; it misrepresents Moore by conflating his aesthetic and ethical views, ignoring his explicit application of organic unity to friendship, and falsely labeling him a hedonist about relationships.

  **Moore's Acceptances:**
  1.  **Supreme Goods:** Moore *would* accept that friendship ("the pleasures of human intercourse") and aesthetic enjoyment are the highest intrinsic goods (*Principia Ethica*, Ch. VI).
  2.  **Aesthetic Analogy:** He *would* accept that appreciating a friend's mental qualities involves a form of "admiration" or contemplation similar in structure to aesthetic contemplation.

  **Moore's Rejections & Misrepresentations:**
  1.  **Friendship as *Purely* Aesthetic:** Moore *rejects* reducing friendship to *merely* aesthetic contemplation of an animate object. While aesthetic appreciation is a component, friendship centrally involves *mutual affection* and *reciprocity* – loving and being loved. This interpersonal bond is ethically distinct.
  2.  **Denial of Emergent Value in Friendship:** This is **flatly wrong**. Moore *explicitly* applies his principle of organic unity to friendship itself. He argues that the complex whole of "consciousness of a beautiful object" *plus* "the emotion of love *towards* the beautiful object which is combined with it" (where the object is a person) constitutes an organic unity whose value is *greater than* the sum of the values of its parts considered separately (*Principia Ethica*, §113-114). The relationship *itself* (the combination) generates emergent ethical value.
  3.  **Organic Unity Only for Compound Aesthetic States:** Incorrect. While he applies it to aesthetic wholes (like appreciating a sunset with a friend, §121), his *paradigm example* of organic unity generating supreme value is precisely the complex state involving loving appreciation of another person (§113-114).
  4.  **Hedonism About Friendship:** This **does not follow** and contradicts Moore's core commitments. Moore explicitly rejected hedonism. While pleasure is often a necessary *component* of valuable wholes like friendship, the value of the *whole* (the loving relationship) is intrinsic and non-hedonic. Its goodness is irreducible to mere pleasurable feelings summed; the *structure* of the relationship (the mutual affection directed at mental qualities) is essential to its value as an organic unity.

  **Conflation:** The summary conflates Moore's point that *appreciating a person's qualities* involves a contemplation analogous to aesthetic appreciation with the claim that *the relationship of friendship itself* is nothing *but* that aesthetic contemplation. Moore clearly distinguishes the component (appreciation) from the ethically significant organic unity (the loving relationship incorporating that appreciation).
