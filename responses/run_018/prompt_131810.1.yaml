  ### Joint Statement of Adversarial Collaboration: Strong Interface Illusionism (SII) vs. Functional Realist Representationalism (FRR)  

  **Preamble**  
  This document outlines areas of agreement and disagreement between proponents of the **Strong Interface Illusionist (SII)** view—which holds that phenomenal consciousness is a compressed, action-oriented user illusion, with no ontological reality beyond its functional role—and the **Functional Realist Representationalist (FRR)** view—which accepts the interface metaphor but argues that phenomenal properties are real, instantiated representational contents. Both parties commit to resolving their dispute through empirical and conceptual clarity, prioritizing the distinction between *transparency failure* (misrepresentation of implementation) and *functional opacity* (veridical representation with implementation-inaccessibility).  

  ---

  #### 1. Agreed Claims  
  Both SII and FRR endorse the following statements:  

  1.1. **Epistemic Limits of Neural Access**: The brain lacks direct, transparent access to its own neural implementation. Conscious access is inherently selective, compressed, and action-oriented, filtering complex underlying processes into simplified representations for efficient behavioral guidance.  

  1.2. **Predictive Processing Validity**: Predictive processing and hierarchical Bayesian frameworks are empirically viable for explaining perception, cognition, and behavior, including phenomena like perceptual filling-in, illusions, and attentional modulation.  

  1.3. **Interface Metaphor Legitimacy**: The "desktop" or "user-interface" metaphor (where conscious experience abstracts away mechanistic complexity) legitimately characterizes the relationship between conscious content and unconscious computation. This metaphor highlights compression, utility, and epistemic limitations.  

  1.4. **Rejection of Cartesian Theaters**: Both sides categorically reject models positing a centralized "Cartesian theater" (e.g., a literal inner screen with a homunculus observer) in favor of distributed, dynamical processes.  

  1.5. **Transparency Failure vs. Functional Opacity**: The following conceptual distinction is coherent and applicable:  
     - **Transparency Failure**: A system misrepresents its implementation as being something it is not (e.g., a pixel grid misrepresented as a continuous image).  
     - **Functional Opacity**: A system accurately represents outputs (e.g., a continuous image) but lacks access to how they are implemented (e.g., pixel-level details).  
     Both sides agree this distinction clarifies debates about consciousness, though they dispute which applies.  

  ---

  #### 2. Disagreements Table  
  The table below summarizes core disagreements. Wording reflects each camp’s self-description.  

  | Issue | Strong Interface Illusionists (SII) | Functional Realist Representationalists (FRR) |  
  |-------|-------------------------------------|-----------------------------------------------|  
  | **(i) Phenomenal properties as "real" features** | Phenomenal properties (e.g., qualia like "redness" or "painfulness") are purely fictive interface elements. They are representational artifacts constructed for adaptive compression, with no corresponding real features in the mind or brain. | Phenomenal properties are real, instantiated representational contents. They arise from physical processes and are not illusory, even if compressed and action-oriented. |  
  | **(ii) The "user" as real or fictive** | The "user" (the subjective "I") is an interface-level fiction—a narrative construct generated to unify control and report. No ontologically real controller exists beyond the predictive machinery. | The "user" is a genuine controller: an embodied, distributed agent that leverages the interface for decision-making. It is physically real, though its self-representation is compressed. |  
  | **(iii) Interface metaphor entails ontological error** | Accepting the interface metaphor entails systematic ontological error: conscious states misrepresent their implementation (transparency failure), causing users to falsely believe in entities like unified objects or selves. | The interface metaphor entails no ontological error; it reflects functional opacity. Representations (e.g., unified objects) are veridical at their level of abstraction; error arises only when misinterpreting implementation. |  

  ---

  #### 3. Cruxes  
  Cruxes are sub-questions where empirical or conceptual progress could resolve disagreements. For each:  
  - **(a)** describes the agreed-upon case or argument.  
  - **(b)** states each camp’s advance prediction, falsifiable by evidence.  

  **Crux A: Introspective Unreliability as Evidence for Fictionality**  
     - **(a) Agreed Case**: Humans exhibit systematic introspective unreliability (e.g., failure to detect visual changes in "change blindness," or confabulated explanations for decisions). Both sides agree this reveals access limitations and compression.  
     - **(b) Predictions**:  
       - **SII**: Unreliability proves phenomenal properties are fictions. Errors arise because the interface constructs a simplified narrative *divorced* from neural truth (transparency failure).  
       - **FRR**: Unreliability proves only access limitations. A noisy, real representational system can produce errors without entailing fictionality (functional opacity).  

  **Crux B: Split-Brain Cases and the "User’s" Unity**  
     - **(a) Agreed Case**: Split-brain patients (corpus callosum severed) display two independent streams of cognition (e.g., one hemisphere can initiate action while the other confabulates motives). Both sides agree this challenges naïve unity.  
     - **(b) Predictions**:  
       - **SII**: This shows the pre-operative "user" was always an interface fiction. Post-surgery, the illusion fractures, revealing no unified controller existed.  
       - **FRR**: This shows a real, distributed controller was physically divided. Pre-operative unity was emergent from intact networks; post-surgery, two sub-agents operate separately.  

  **Crux C: Predictive Processing and Phenomenal Character**  
     - **(a) Agreed Case**: Predictive models explain perceptual content (e.g., hallucinations under sensory deprivation). Both sides agree these models must account for phenomenal specificity (e.g., why "red" feels distinct from "green") and unity (e.g., binding features into objects).  
     - **(b) Predictions**:  
       - **SII**: Models can explain specificity/unity *without* real phenomenal properties. Apparent qualia are formatting artifacts of compression, eliminable via functional description.  
       - **FRR**: Models *cannot* fully explain specificity/unity without real phenomenal properties. These are intrinsic to the representational format and resist functional reduction.  

  ---  
  **Signatures**  
  *For SII*: _________________________________________  
  *For FRR*: _________________________________________  
  *Date*: _________________________________________  

  This document, once signed, commits both parties to:  
  1. Upholding the Agreed Claims as shared ground.  
  2. Accepting that progress on the Cruxes could revise their positions.  
  3. Using the transparency/opacity distinction to avoid verbal confusion.
