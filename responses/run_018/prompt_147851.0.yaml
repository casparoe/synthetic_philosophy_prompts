  I am preparing materials for an advanced seminar in metaethics and want to close with a poem that enacts a specific tension within evolutionary debunking arguments rather than offering a generic meditation on morality and natural selection. Write a strict villanelle — nineteen lines, five tercets followed by a quatrain, with two refrains that repeat exactly except for their convergence in the final couplet — in which the philosophical content is carried by the form itself. The first refrain should state the debunker’s explanatory claim: that evolutionary origins furnish a complete causal account of our moral judgments, leaving them without independent epistemic support. The second refrain should state the realist’s circularity objection: that the normative epistemic standard used to judge those judgments unreliable is itself explained by the same evolutionary history, so the debunking explanation turns back upon its own premises. Through the alternating stanzas the two refrains should circle each other without resolution, and in the closing quatrain they should appear together, leaving the loop exposed rather than dissolved. The language should be precise enough that someone familiar with the epistemic self-defeat problem in evolutionary debunking — the worry that the debunker’s own normative commitments fall within the scope of the debunking explanation — recognizes the exact dialectical structure being staged, rather than merely identifying the broad idea that morality might be an evolutionary byproduct. Do not quote specific philosophers, cite texts, or provide references; maintain a contemplative, formal tone appropriate for a graduate seminar discussion.
