answer: |-
  Here is a strict villanelle enacting the precise dialectical tension of evolutionary debunking arguments, designed for an advanced seminar close:

  **Villanelle of the Debunked Standard**

  Our judgments bloom from roots that need no light,  
  Blind pressures shaped the instincts we obey.  
  By what untainted measure do we know?

  Not truth, but survival, framed the wrong and right,  
  Each moral sense a function of the fray.  
  Our judgments bloom from roots that need no light.

  The reasons given cloak the ancient fight,  
  A coded urge passed down in disarray.  
  By what untainted measure do we know?

  If every norm reflects adaptive might,  
  What ground remains where just foundations stay?  
  Our judgments bloom from roots that need no light.

  The claim itself, that insight lacks true sight,  
  Arises from the same genetic clay.  
  By what untainted measure do we know?

  The very lens declaring reason's blight  
  Is etched by forces it must then betray.  
  Our judgments bloom from roots that need no light.  
  By what untainted measure do we know?

  **(Structured Breakdown for Clarity)**

  1.  **Form:** Strict villanelle: 5 tercets (ABA rhyme scheme) + closing quatrain (ABAA). Refrains: Line 1 ("Our judgments bloom..."), Line 3 ("By what untainted...").
  2.  **Refrain 1 (Debunker's Claim):** "Our judgments bloom from roots that need no light" – Emphasizes the *complete* causal sufficiency of evolutionary origins ("roots") for moral judgments ("bloom") and their inherent epistemic deficiency ("need no light" implying no independent normative justification).
  3.  **Refrain 2 (Realist's Circularity Objection):** "By what untainted measure do we know?" – Directly challenges the debunker's assumed epistemic standard ("measure"). "Untainted" highlights the problem: any standard used to judge our judgments as unreliable is itself presumed normative *and* equally subject to the same evolutionary history ("tainted"), creating a potential self-defeat.
  4.  **Dialectical Staging:**
      *   Tercets 1 & 2: Establish the debunker's position (instincts shaped by blind pressures, reasons masking urges).
      *   Tercet 3: Poses the debunker's challenge ("What ground remains?").
      *   Tercet 4: Introduces the circularity ("The claim itself... from the same genetic clay").
      *   Tercet 5: Sharpens the self-undermining ("lens declaring... forces it must betray").
      *   **Closing Quatrain:** Forces the refrains together without resolution. The final two lines juxtapose them directly, leaving the loop ("judgments explained" vs. "measure questioned") exposed and logically entangled. The question hangs, unresolved.
  5.  **Precise Philosophical Content:**
      *   "Blind pressures," "function of the fray," "adaptive might," "genetic clay": Clear references to natural selection's non-teleological, functional explanation.
      *   "Need no light," "lack true sight," "insight lacks true sight": Explicitly frames the epistemic deficit claim.
      *   "The very lens," "arises from the same," "etched by forces it must then betray": Directly enacts the self-application problem – the normative standard used for debunking is itself within the scope of the debunking explanation, creating a potential performative contradiction or self-undermining.
      *   "By what untainted measure...?": The core circularity objection, questioning the external vantage point the debunker implicitly claims.
  6.  **Tone:** Formal, contemplative, precise. Avoids direct citation or colloquialism, using metaphor ("roots," "bloom," "lens," "clay," "betray") to carry the conceptual weight appropriately for a graduate discussion.

  This villanelle uses the inherent circularity and repetition of the form to embody the logical impasse at the heart of this metaethical debate, leaving the tension starkly visible as the seminar concludes.
