answer: |-
  This complex pairing reflects a **hybrid theory of collective agency and responsibility** that combines *corporate continuity* for states with *individual termination* for criminal liability, grounded in distinct legal-philosophical foundations. Let's reconstruct the implicit theory:

  ### Core Conceptions Presupposed:
  1. **States as Corporate Moral Persons with Diachronic Identity**:  
     The state is viewed as a continuous legal entity transcending regime changes, governments, and generations. Its "intentionality" is derived from its institutional structures, treaties, and capacity to bear rights/duties over time. Article 231's legacy treats Germany (as a state) as the bearer of *political responsibility*, irrespective of internal political changes.

  2. **Distributive, Non-Criminal Responsibility for Citizens**:  
     Reparative obligations fall on citizens *distributively* (via taxation, state resources) but *not collectively* as moral blame. This is synchronic (affecting current members) but transmitted diachronically via the state's continuity. Citizens inherit *financial burdens*, not *guilt*.

  3. **Radical Separation of Criminal vs. Reparative Frameworks**:  
     Criminal liability (individual) requires personal culpability and terminates with death. Reparative obligations (state/corporate) arise from wrongful acts causing enduring harm, binding successors to ensure restitution. The Fischer shift relocated *causal/moral blame* to specific actors/structures but did not negate the state's *legal obligation* to repair.

  ### Coherence with Legal Individualism:
  This framework **coheres formally but requires philosophical justification**:
  - **No Inherited *Criminal* Liability**: Aligns with individualist legal ethics: punishment requires *mens rea* and cannot be transferred.
  - **State Reparations as Non-Punitive**: Reparations are framed as *civil obligations* (corrective justice) for harm caused by the state apparatus, not criminal penalties for descendants. Legal systems distinguish between penal sanctions (personal) and state debts (corporate).
  - **Basis of Obligation**: Citizens' duty arises from *current membership* in the state entity responsible for ongoing harm remediation, not ancestral sin. This mirrors corporate law: shareholders bear costs but not criminal guilt for a company's past wrongs.

  ### What Strict Individualism Would Alter:
  A purely individualist, non-transmissive framework would necessitate:
  1. **Abolition of Intergenerational State Reparations**:  
     Reparations could only target living perpetrators or confiscated assets traceable to victims. Post-WWI reparations paid by 1950s Germans would be illegitimate.

  2. **Commemoration as Historical Accounting, Not Collective Atonement**:  
     National monuments/museums would frame events as "this government committed X" rather than "we bear responsibility." Apologies would only come from direct perpetrators.

  3. **Structural Analysis Without Collective Obligation**:  
     Historians like Fischer could analyze Kaiser Wilhelm II's decisions or militarist structures, but no *reparative duty* would bind the modern state or citizens.

  4. **Privatized Redress**:  
     Reparations claims would target specific estates (e.g., confiscating wealth from Krupp heirs) or surviving war criminals—not the state treasury.

  ### Theoretical Tensions and Resolutions:
  - **Key Justification**: The state's corporate personhood is a *legal fiction* enabling stable international relations and harm remediation. Unlike biological inheritance, state continuity is a social construct accepted to manage historical wrongs systematically.
    
  - **Moral vs. Legal Responsibility**: The framework accepts that *moral blame* (per Fischer) is individual/structural, but *legal responsibility* attaches to the state as the enduring agent in international law.

  - **Distributive Fairness Critique**: Critics argue that taxing citizens for pre-birth state actions is unjust. Defenders counter that state benefits (e.g., infrastructure, territory) are also inherited, creating reciprocal obligations.

  **Conclusion**: The pairing presupposes a *dualistic theory*: states are corporate agents bearing continuous reparative duties grounded in harm causation, while criminal guilt remains individual and non-hereditary. This coherence relies on accepting the state as a distinct legal person—a convention upheld precisely to resolve the tension between historical justice and individual rights. A strict individualist framework would dismantle transnational reparative justice but align with retributive ethics rejecting vicarious liability.
