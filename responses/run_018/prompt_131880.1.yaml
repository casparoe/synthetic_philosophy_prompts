answer: |-
  Your argument's flaw lies in Step (1)'s rigid determinism. Here's the breakdown:

  **Verdict: Step (1) — False Necessity in Class Dynamics.**

  Step (1) claims that class struggle *necessarily* leads to the purging of the founding revolutionary leadership ("*should eventually turn on*") because that class "can't stabilize state power without being replaced." This asserts an **inevitable, universal, and immediate causal chain** from "rising class seizes state" to "founding leaders purged."

  The reasoning failure is **conflating a potential dynamic (class conflict generating internal instability) with a predetermined, unavoidable outcome (the specific 'devouring' purge of founders)**. Class struggle creates tensions and *creates the possibility* of internal conflict escalating to purges, but it does not *guarantee* that specific outcome in all cases. Other factors mediate and determine the actual result:

  1.  **Success/Failure of Consolidation:** The 1848 revolutions failed to consolidate power *before* internal dynamics could fully play out (counter-revolution intervened).
  2.  **Institutional & Strategic Differences:** The CCP in 1949 had developed a highly disciplined party structure *during* its revolutionary struggle, giving it tools (like party purges, rectification campaigns, control of the military) to manage internal conflict and succession *without* the same kind of public, chaotic, and foundational-leader-executing bloodletting seen in 1793. The Cultural Revolution, while violent and targeting elites, operated within the established party-state framework and targeted later generations/figures, not the core 1949 founders en masse.
  3.  **Contingency Matters:** Foreign wars, economic collapse, ideological schisms, leadership decisions, and counter-revolutionary resistance (like the Vendée) *interact* with class tensions. These can intensify conflict to the point of terror/purge (as in 1793) or overwhelm the revolution before that phase (1848), or be managed through different mechanisms (CCP's party discipline + later campaigns).

  **Rejecting Step (1) forces you to accept that class struggle creates inherent instability and conflict within revolutions led by rising classes, but whether this manifests as the specific "devouring" of the founders depends critically on contingent factors, institutional forms, and the success of the revolution in establishing durable control.**
