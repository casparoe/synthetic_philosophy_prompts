  ### **Game Design: "Norms & Shields"**  
  *Objective:* Players experience the tight/loose tradeoff through gameplay, feeling precaution displacement, the ratchet effect, and resentment from over-enforcement.  

  ---

  #### **Setup (10 minutes)**  
  **Materials (per table of 5-6 players; 6 tables total):**  
  - **Role Cards**: 1 per player (e.g., "Baker: Eccentricity = Humming while working").  
  - **Voting Slips**: 3 colors (Red=Tight, Yellow=Medium, Green=Loose).  
  - **Protection Tokens**: Small shields (cardboard cutouts; 1 per player).  
  - **Threat Cards**: Deck of 6 cards (1 per round) with:  
    - *Threat Level* (🌱 Low/🌧️ Medium/🔥 High)  
    - *Outcome* (✅ False Alarm/❌ Real Threat).  
  - **Resentment Tokens**: Red beads (10 per table).  
  - **Point Trackers**: Paper grids (100 starting points per player).  
  - **Dice**: 1 per table (for threat resolution).  
  - **Rule Sheet**: Simple step-by-step guide (no facilitator help needed).  

  **Facilitator’s One Sentence (before start):**  
  *"Your goal is to end with the most points by balancing group rules and private safety—vote wisely, protect yourself, and watch for unexpected costs."*  

  ---

  #### **Rounds (45 minutes for 5 rounds)**  
  **Each Round (8-9 minutes):**  
  1. **Reveal Threat (1 min)**:  
     - Draw a Threat Card (e.g., Round 1: 🌱 Low Threat, ✅ False Alarm).  

  2. **Vote on Tightness (2 min)**:  
     - Players vote secretly (Red/Yellow/Green slip).  
     - *Ratchet Rule*: Tightening (→Red) requires 50%+ votes. Loosening (→Green) requires 70% votes. Medium (Yellow) = default.  

  3. **Buy Protection (1 min)**:  
     - Players may spend 10 points to take a "Shield" token (private precaution).  
     - *Hidden Cost*: Shields are invisible to others (modeling precaution displacement).  

  4. **Enforce Eccentricities (2 min)**:  
     - Players reveal if they "act" their role’s eccentricity (e.g., humming).  
     - *Enforcement*:  
       - **Tight (Red)**: Enforcer (rotating player) fines *all* eccentricities 15 points (cannot distinguish harmless/harmful).  
       - **Medium (Yellow)**: Enforcer fines 50% (dice roll).  
       - **Loose (Green)**: No fines.  
     - *Resentment*: Fined players take a red bead (tracking frustration).  

  5. **Resolve Threat (2 min)**:  
     - Reveal Threat Outcome:  
       - **False Alarm (✅)**: No point loss.  
       - **Real Threat (❌)**: Players *without* Shields lose points:  
         - Low (🌱): -10 points  
         - Medium (🌧️): -20 points  
         - High (🔥): -30 points  
     - *Precaution Displacement*: Shields block all losses (but cost 10 points).  

  6. **Record Points (1 min)**:  
     - Update scores. Reset Shields/votes for next round.  

  **Threat Deck (Fixed Sequence for Predictable Ratchet):**  
  - Round 1: 🌱 Low, ✅ False Alarm (eases players in).  
  - Round 2: 🌧️ Medium, ❌ Real Threat (tests tightening).  
  - Round 3: 🔥 High, ❌ Real Threat (induces panic).  
  - Round 4: 🌱 Low, ✅ False Alarm (threat gone, but ratchet holds).  
  - Round 5: 🌧️ Medium, ❌ Real Threat (loosening fails).  

  ---

  #### **Point System**  
  - **Starting Points**: 100.  
  - **Gains/Losses**:  
    - Fines: -15 points per enforcement.  
    - Shields: -10 points per round.  
    - Threat Losses: -10 to -30 points.  
  - **Winning**: Highest score after Round 5.  

  ---

  #### **Debrief (20 minutes)**  
  **Map Game Moments to Concepts:**  
  1. **Precaution Displacement**:  
     - *Ask*: "In Loose rounds (Green), did you buy Shields? Why?"  
     - *Reveal*: "Notice how Shields (private precautions) spiked when group rules relaxed—caution didn’t vanish, it went invisible."  

  2. **Ratchet Effect**:  
     - *Ask*: "After Round 3 (High Threat), did your group loosen in Round 4? Why not?"  
     - *Reveal*: "Tightening was easy (50% vote), but loosening required 70%. Once panicked, groups stay tight—even after threats fade."  

  3. **Resentment from Over-Enforcement**:  
     - *Ask*: "Fined players: How did it feel to lose points for humming?"  
     - *Reveal*: "Tight enforcement crushes harmless quirks because it can’t tell them from real threats. Those red beads symbolize real resentment."  

  **Predictable Problems (First Run):**  
  - **Voting Chaos**: Players may debate votes beyond time limits. *Fix*: Use strict timers.  
  - **Shield Misuse**: Players forget Shields are invisible. *Fix*: Rule sheet emphasizes "private, no sharing."  
  - **Enforcer Leniency**: Some may resist fining friends. *Fix*: Rotate enforcer role to spread responsibility.  

  **What the Game Can’t Stage (Requires Verbal Explanation):**  
  - **Long-Term Societal Costs**: The game can’t show how tight societies *stifle innovation* (e.g., avoiding risks) or how loose societies *increase inequality* (e.g., only the rich afford Shields).  
  - *Say This*: "Real-world precautions—like background checks—disproportionately burden marginalized groups. And the ratchet can entrench control long after crises end."  

  ---

  ### **Why This Works**  
  - **Precaution Displacement**: Players *feel* the burden shift to them in Loose rounds (buying Shields).  
  - **Ratchet**: Voting rules make loosening harder, mirroring real policy rigidity.  
  - **Resentment**: Fines for harmless quirks (humming) create tangible frustration.  
  - **No Philosophy Jargon**: Concepts emerge organically through gameplay.  

  **Materials Source**: All items (cardboard, beads, colored paper) are craft-store staples. Run it in 75 minutes with disciplined timing!
