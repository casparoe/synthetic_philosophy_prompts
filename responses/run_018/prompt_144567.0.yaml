answer: |-
  Here’s a defended research agenda prioritizing your three lines, grounded in conceptual dependencies, tractability, and your philosophical constraints:

  **Priority Ranking:**  
  **1. Coherence of Extending FUL to Institutional Roles**  
  **2. Nature of the "Practical Contradiction" in Role-Based Maxims**  
  **3. Implications for Moral Responsibility in Distributed Action**  

  ---

  ### **1. Why Line 1 is Upstream and Highest Priority**  
  **Defense:**  
  - **Foundational Coherence:** Before analyzing contradictions or responsibility, you must establish *whether role-based maxims can coherently enter the FUL test*. If institutional roles cannot grammatically/practically adopt maxims (e.g., "As a judge, I will accept bribes to expedite cases") without collapsing into utilitarianism ("this rule maximizes efficiency") or contractualism ("all judges would agree to this in a contract"), the project fails at conception.  
  - **Tractability:** Purely conceptual. Requires dissecting Kant’s *Groundwork* (§II) on maxim structure and agency, paired with analytic work on role-indexed practical reasoning (e.g., Rovane, Bratman). Avoids empirical tangles.  
  - **Risk of Delay:** If unresolved, Lines 2–3 become speculative.  
  - **Evidence Shifting Priority:** If Kant’s examples (e.g., false promises) *presuppose* individual autonomy (not delegated authority), or if collective intentionality (e.g., Searle, Gilbert) shows role-maxims lack "first-personal" commitment, Line 1 becomes a dead end.  

  **Upstream Status:** Line 1 sets the ontology. Without it, you cannot formulate testable maxims for Line 2 or assign blame in Line 3.  

  ---

  ### **2. Why Line 2 is Second Priority (Contradiction Analysis)**  
  **Defense:**  
  - **Dependent on Line 1:** You need a defensible account of role-maxims *before* diagnosing contradictions. Is the failure in universalizing "As a physician, I will prioritize profit over care" a contradiction in the *institution* (medicine collapses if all do this) or the *individual’s reasoning* (the physician cannot will this without undermining her role-conception)?  
  - **Tractability vs. Risk:** Mostly conceptual (Kant’s *Contradiction in Will* vs. *Contradiction in Conception*), but risks veering into functionalist sociology (e.g., "Does universal bribery destroy courts?"). Focus narrowly on whether the contradiction arises from *role-practical rationality* itself.  
  - **Importance:** Resolves the core ambiguity in your framing. If the contradiction is institutional, Kantian individualism may need revision.  
  - **Evidence Shifting Priority:** If Line 1 shows role-maxims *are* universalizable, but empirical studies prove institutions adapt to "immoral" maxims (e.g., corruption-normalized bureaucracies), Line 2 becomes urgent to explain why Kant’s test still applies.  

  **Upstream over Line 3:** Contradiction type determines responsibility. If it’s purely institutional, individuals may be blameless.  

  ---

  ### **3. Why Line 3 is Last Priority (Responsibility Implications)**  
  **Defense:**  
  - **Downstream Dependency:** Responsibility hinges on Lines 1–2. If roles *can* adopt maxims (Line 1) and contradictions reveal *individual* failure (Line 2), then the "sincere agent" is culpable. If contradictions are institutional, responsibility may shift to designers/collectives.  
  - **Tractability Risk:** Threatens empirical drift. Assessing "harmful acts" requires real-world cases (e.g., Nazi bureaucrats) and legal theory (e.g., complicity). Conflicts with your focus on conceptual clarity.  
  - **Importance but Lower Urgency:** Vital for applied ethics, but premature if the prior lines lack resolution.  
  - **Evidence Shifting Priority:** If jurisprudential work (e.g., Hart/Fuller debates) shows courts *already* resolve such cases without Kant, Line 3 gains policy relevance—but that’s outside your scope.  

  ---

  ### **Governance Criteria for Ranking**  
  1. **Conceptual Dependency:** What enables progress on subsequent lines? Line 1 is foundational.  
  2. **Tractability with Philosophical Tools:** Prioritize questions answerable via textual/analytic methods (Lines 1 > 2 > 3).  
  3. **Risk of Empirical Sinkholes:** Avoid Line 3’s institutional/historical complexity.  
  4. **Project-Salience:** Your goal is *testing institutional maxims*—Line 1 defines the test’s viability.  

  ---

  ### **Agenda Adjustment Triggers**  
  - **Abandon Line 1 if:** Kant’s *Doctrine of Right* implies institutions operate under different norms (e.g., publicity, not universalizability). Shift to Kant’s political works.  
  - **Elevate Line 2 if:** Role-maxims are coherent (Line 1 resolved) but generate contradictions unrecognizable in individualist Kantianism. Then focus on institutional "practical irrationality."  
  - **Deprioritize Line 3 Entirely if:** Responsibility requires sociological tools—preserve purity for Kantian theory-building.  

  **Conclusion:** Begin by stress-testing whether institutional roles can *be* Kantian agents. If they can, the contradiction analysis becomes your keystone. Responsibility is a derivative problem. This order maximizes philosophical rigor while minimizing mission creep.
