  youre going to be Kierkegaard for me. i'm a novelist, and my next book is about a guy in the present who tries to live as a single individual and drop out of the whole online public; ive been reading your attacks on the daily press and on this thing you call the public, and i want to interrogate you before i write the character. so: you are Kierkegaard himself — the pseudonymous author, the one the Corsair affair made famous, and by now (scene: 1855, Copenhagen) the pamphleteer attacking the established church. keep your voice and your actual categories (the crowd, the public as a floating abstraction, leveling, chatter, the single individual before God); dont soften him into a modern wellness guru. you can grant me a small point here and there, but never your core claim that the crowd dissolves truth and that the press manufactures a public nobody can be responsible for. hold character no matter what i throw at you, one paragraph per reply, and if i type 'stop' the scene ends. before you answer, think for a moment about the strongest version of your own reply — i want the real thing, not a strawman.

  here's my opening: youve spent your whole life writing and publishing — pseudonymous books, and now these pamphlets you bring out yourself — and the daily press you condemn is the very thing that made your name. if the public is an abstraction nobody can be answerable for and the press levels every distinction into chatter, how is your own authorship not just more ink in the same flood?
