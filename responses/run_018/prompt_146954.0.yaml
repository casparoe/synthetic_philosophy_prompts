prompt: |-
  Write the desiderata that any adequate theory of calibrated epistemic modesty must satisfy—where modesty is understood not as blanket self-doubt but as the disciplined integration of first-personal reasoning (the inside view) with third-personal statistical evidence about reasoning reliability (the outside view). Specify the phenomena it must cover: cases in which domain-specific expert reasoning conflicts with peer-disagreement or base-rate statistics about experts in that domain; cases of deep framework disagreement where no shared statistical baseline exists; and cases in which an agent recognizes her own documented cognitive biases yet retains access to reasons she can evaluate only from the inside. For each phenomenon, state the corresponding requirement. Then list the distinctions the theory must respect—between object-level belief and meta-level confidence, between local expertise and global reasoning failure, and between genuine peer disagreement and mere noise—giving the motivating case behind each, and flag any pair of requirements you suspect cannot be jointly satisfied, especially any tension between demanding determinate belief-revision outputs and forbidding prescriptions that require the agent to adopt beliefs she cannot understand or assess from her first-personal standpoint. Finally, indicate which requirements are non-negotiable and which are negotiable if the purpose is rational self-governance rather than predictive accuracy. Conclude with a brief scorecard: how a pure inside-view rationalism, a pure outside-view statistical-deference model, and a two-layer view that assigns inside-view authority to step-level reasoning and outside-view authority to framework selection each fare against your list, noting for each which desiderata it meets and which it sacrifices.
reasoning: |-
  Hmm, this is a rich request about calibrated epistemic modesty. The user wants a structured framework for evaluating theories that balance first-person reasoning (inside view) with third-person statistical evidence (outside view). 

  First, I need to unpack the core tension: epistemic modesty as disciplined integration, not blanket skepticism. The user specifies three key phenomena: (1) expert reasoning conflicting with peer disagreement/base rates, (2) deep framework disagreements without shared baselines, and (3) managing documented biases while preserving first-person access to reasons. Each needs a corresponding requirement.

  For phenomena #1 (expert vs statistics), the requirement should handle belief revision without total deference. The motivating case is an expert oncologist facing contradictory base rates—she must weigh her specific clinical assessment against general survival statistics. 

  For #2 (framework disagreements), the challenge is avoiding paralysis when no common statistical ground exists, like in fundamental physics paradigms. The requirement must preserve reasoned engagement without requiring impossible neutrality.

  For #3 (biases + first-person reasons), think of the mathematician with gender bias studies who still trusts her proof-checking. The requirement must allow meta-awareness without undermining object-level reasoning access.

  Now the distinctions: object-level belief vs meta-confidence is crucial—people can believe P while acknowledging their judgment might be flawed (motivated by climate scientists assessing their own models). Local/global failure distinction prevents overgeneralization from domain-specific errors (a classic case: brilliant physicist making terrible financial decisions). Peer disagreement vs noise separates signal from randomness (e.g., distinguishing substantive peer critique from arbitrary variability in wine ratings).

  I suspect tension between Requirement 3 (determinate outputs) and Requirement 4 (no alien prescriptions). Can a theory always give clear belief-revision guidance without forcing agents to adopt positions they can't internally justify? This might be the central paradox.

  Non-negotiables: Requirement 1 (integration), Requirement 5 (framework engagement), and Requirement 7 (first-person access preservation) seem essential for rational self-governance. Predictive accuracy could sacrifice some of these, but the user specifies self-governance as the priority.

  Scorecard time: Pure inside-view rationalism fails all outside-view requirements spectacularly—it’s the expert who ignores base rates. Pure outside-view deference collapses into meta-induction—the clinician who overrides their diagnosis because of statistics. The two-layer view (inside for steps, outside for frameworks) is promising but stumbles on Requirement 6 (local/global distinction) by assuming framework judgments are separable.

  User’s framing suggests they’re likely developing a meta-epistemological position, possibly for AI alignment or professional decision theory. The depth implies academic/philosophical context. Their rigor deserves matching precision—I’ll avoid fluff and flag genuine tensions like the determinacy vs comprehensibility tradeoff.
answer: |-
  Here is a structured desiderata list for a theory of *calibrated epistemic modesty*, addressing your specifications:

  ---

  ### **Core Desiderata for Calibrated Epistemic Modesty**
  **Definition**: Modesty = Integration of *inside view* (first-personal reasoning) + *outside view* (third-personal statistical evidence on reliability).

  ---

  ### **I. Phenomena & Requirements**
  | **Phenomenon**                                                                 | **Requirement**                                                                                               |
  |--------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | **1. Expert vs. Statistics Conflict**<br>(e.g., oncologist’s patient-specific prognosis vs. base-rate survival stats) | **R1 (Integration):** The theory must output *revised credences* that non-trivially incorporate both expert judgment and external evidence, without fully deferring to either. |
  | **2. Deep Framework Disagreement**<br>(e.g., string theorist vs. loop quantum gravity physicist with no shared statistical baseline) | **R2 (Framework Neutrality):** The theory must enable agents to engage with rival frameworks *without requiring statistical consensus*, while avoiding paralysis. |
  | **3. Bias-Aware Reasoning**<br>(e.g., mathematician aware of gender bias in peer review, yet confident in her proof’s correctness) | **R3 (First-Person Anchor):** The theory must preserve the agent’s capacity to hold object-level beliefs grounded in internally accessible reasons, even under meta-awareness of biases. |

  ---

  ### **II. Essential Distinctions & Motivating Cases**
  | **Distinction**                            | **Motivating Case**                                                                 | **Requirement**                                                                 |
  |--------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Object-Level Belief vs. Meta-Confidence** | Climate scientist believes CO₂ drives warming (object) but has 90% confidence (meta) due to past model errors. | **R4 (Meta-Gradation):** The theory must track degrees of confidence *about* beliefs separately from beliefs themselves. |
  | **Local Expertise vs. Global Failure**     | Nobel-winning physicist makes elementary errors in biology; expertise is domain-local. | **R5 (Localized Skepticism):** The theory must restrict doubt to relevant domains without inducing global distrust. |
  | **Genuine Peer Disagreement vs. Noise**    | 47% of economists predict recession (signal) vs. 53% split randomly (noise) in low-stakes survey. | **R6 (Disagreement Discrimination):** The theory must weight disagreements based on epistemic substance, not mere headcounts. |

  ---

  ### **III. Suspected Tensions**
  - **R3 (First-Person Anchor) vs. R1 (Integration):** Can agents retain beliefs they "understand from the inside" (*R3*) while accepting outside-view revisions that may feel alien (*R1*)?  
  - **R4 (Meta-Gradation) vs. Demands for Determinate Outputs:** Must probabilistic confidence (*R4*) yield binary beliefs for practical use?  
    **→ Core Tension:** *Requiring determinate belief-revision outputs (e.g., "reduce confidence by 20%") risks violating R3 if the agent cannot internally justify the adjustment.*

  ---

  ### **IV. Negotiability (Rational Self-Governance Focus)**
  | **Requirement** | **Non-Negotiable?** | **Rationale**                                                                 |
  |------------------|---------------------|-------------------------------------------------------------------------------|
  | R1 (Integration) | Yes                 | Core to modesty; without integration, it collapses to pure inside/outside view. |
  | R3 (First-Person Anchor) | Yes                 | Self-governance requires beliefs be accessible to the agent’s reasoning.      |
  | R2 (Framework Neutrality) | Yes                 | Essential for deep disagreements where statistics are unavailable.            |
  | R4 (Meta-Gradation) | Negotiable          | Self-governance may tolerate less precision than predictive accuracy.        |
  | R5 (Localized Skepticism) | Negotiable          | Rough domain boundaries may suffice for practical rationality.               |
  | R6 (Disagreement Discrimination) | Negotiable          | Heuristic filters for "substantive disagreement" may be adequate.            |

  ---

  ### **V. Scorecard: Competing Models**
  *(✔ = Satisfies, ✘ = Violates, ~ = Partially Satisfies)*

  | **Desideratum**              | **Pure Inside-View Rationalism**<br>(e.g., Cartesian) | **Pure Outside-View Deference**<br>(e.g., Meta-induction) | **Two-Layer View**<br>(Inside: step-level, Outside: framework) |
  |------------------------------|------------------------------------------------------|-----------------------------------------------------------|---------------------------------------------------------------|
  | **R1 (Integration)**         | ✘ (Ignores outside view)                             | ✘ (Ignores inside view)                                   | ✔ (Explicitly layers both)                                   |
  | **R2 (Framework Neutrality)**| ✔ (Engages frameworks)                               | ✘ (No baseline → paralysis)                               | ~ (Frameworks chosen externally; may feel alien)              |
  | **R3 (First-Person Anchor)** | ✔ (All reasons internal)                             | ✘ (Forces external beliefs)                               | ~ (Step-level internal, but framework external)               |
  | **R4 (Meta-Gradation)**      | ✘ (Assumes infallibility)                            | ✔ (Quantifies confidence)                                 | ✔ (Confidence tracked at both levels)                         |
  | **R5 (Localized Skepticism)**| ✘ (Global overconfidence)                            | ~ (But may over-generalize errors)                        | ✔ (Domains mapped to frameworks)                              |
  | **R6 (Disagreement Discrim.)**| ✘ (Dismisses peers)                                  | ✘ (Treats all disagreement equally)                       | ~ (Framework-level stats may miss local nuance)               |
  | **Tension (R1 vs. R3)**      | Avoids (favors R3)                                   | Avoids (favors R1)                                        | **Highest risk:** Framework choice may violate R3             |

  ---

  ### **Conclusion**
  A viable theory must **non-negotiably integrate inside/outside views (R1)** while **preserving first-personal access to reasons (R3)** and **handling framework disagreements (R2)**. The **two-layer model** best approximates integration but risks alienating agents during framework selection. **Pure rationalism** fails statistical calibration; **pure deference** erodes agential autonomy. Calibrated modesty thus demands a *recursive* structure: agents should apply the same modest integration *to the theory itself*, allowing iterative refinement of framework weights from the inside. This preserves self-governance while acknowledging that no static model resolves all tensions.
