answer: |-
  ### Decision Procedure for Climate Fund Cooperation Agreements

  #### Procedure Overview
  This procedure evaluates cooperative agreements using the evidential cooperation principle: a commitment in one region provides statistical evidence for analogous actions in other regions, provided symmetry holds. The procedure is designed for analysts to complete in ~20 minutes. It cannot:
  1. Identify the threshold at which evidential weight overrides local costs.
  2. Distinguish genuinely analogous agents from superficially similar ones without prior empirical data.

  ---

  #### Ordered Steps

  1. **Proposal Definition Check**  
     - **Question:** What specific action is proposed, and what are its quantifiable local costs (LC) and global/cluster benefits (GB)?  
     - **Sufficient Answer:** Clear, measurable LC (e.g., economic loss, job displacement) and GB (e.g., emissions reduced, warming averted). If qualitative, assign conservative estimates.  
     - **Stop Against:** If the action lacks a plausible link to GB (e.g., no climate impact).  
     - **Handoff to Board:** If GB or LC involve non-quantifiable values (e.g., cultural loss, ethical dilemmas).  

  2. **Cluster-Wide Impact Test**  
     - **Question:** If all regions in the cluster adopted the action, would it prevent severe global/cluster harm (e.g., >1.5°C warming, ecosystem collapse)?  
     - **Sufficient Answer:** Evidence that collective action achieves a critical threshold (e.g., IPCC scenarios, integrated assessment models).  
     - **Stop Against:** If collective action is insufficient to prevent the harm.  
     - **Handoff to Board:** If harm severity is contested (e.g., long-term vs. short-term risks).  

  3. **Symmetry-Break Check**  
     - **Question:** Are key local parameters (e.g., GDP/capita, industrial mix, vulnerability) within 1.5 standard deviations of the cluster mean for metrics governing LC/GB?  
     - **Sufficient Answer:** Data from cluster databases (e.g., World Bank, regional reports) for ≥3 parameters.  
     - **Stop Against:** If any critical parameter (e.g., cost-drivers like energy dependence) exceeds the deviation threshold.  
     - **Handoff to Board:** If cluster data is incomplete or unreliable.  

  4. **Local Cost-Benefit Screen**  
     - **Question:** What is the net LC (excluding evidential effects), and is it catastrophic?  
     - **Sufficient Answer:** LC as % regional GDP or welfare loss; catastrophic if LC > 5% GDP or implies humanitarian crisis.  
     - **Stop Against:** If LC is catastrophic.  
     - **Handoff to Board:** If net LC is negative (net local benefit).  

  5. **Evidential Weight Heuristic**  
     - **Question:** What is the ratio of expected global benefit (EGB) to LC? Use EGB = (k × GB) / n, where:  
       - GB = total global benefit if all regions cooperate (from Step 1).  
       - n = cluster size.  
       - k = evidential multiplier (k=5 for n≥100, k=3 for 50≤n<100, k=2 for n<50; assumes symmetry from Step 3).  
     - **Sufficient Answer:** EGB and LC in common units (e.g., USD, DALYs).  
     - **Stop For:** If EGB / LC > 1.  
     - **Stop Against:** If EGB / LC ≤ 1.  
     - **Handoff to Board:** If EGB/LC cannot be computed due to unit mismatch (e.g., economic cost vs. biodiversity loss).  

  ---

  #### Application to Proposals

  **Proposal A: Binding carbon-cap agreement in a cluster of >100 structurally similar industrial regions.**  
  - Step 1: Action = carbon cap; LC = lost industrial output (2% GDP); GB = 0.5°C warming avoided. Sufficient.  
  - Step 2: Full adoption limits warming to <2°C. Proceeds.  
  - Step 3: All parameters within 1σ of mean (structural similarity). Proceeds.  
  - Step 4: LC = 2% GDP (not catastrophic). Proceeds.  
  - Step 5: n=100, k=5; GB = $10T (climate damage averted); EGB = (5 × $10T)/100 = $500B; LC = $20B; EGB/LC = 25 > 1.  
  - **Outcome: Recommend FOR cooperation.**  

  **Proposal B: Unilateral green tech subsidy in a region with no cluster analogs.**  
  - Step 1: Action = subsidy; LC = fiscal cost ($1B); GB = innovation spillover. Sufficient.  
  - Step 2: Full adoption boosts decarbonization. Proceeds.  
  - Step 3: Economic structure (e.g., rare-earth mining) >2σ from cluster mean (no analogs).  
  - **Outcome: Stop Against (symmetry break).**  

  **Proposal C: Emission-reduction pact causing catastrophic local costs and labor-market divergence.**  
  - Step 1: Action = emissions pact; LC = economic collapse (15% GDP loss); GB = severe harm averted. Sufficient.  
  - Step 2: Full adoption prevents global catastrophe. Proceeds.  
  - Step 3: Labor-market flexibility >1.7σ from cluster mean (divergent conditions).  
  - **Outcome: Stop Against (symmetry break).**  
  - **Board Reaction:** Unwelcome (global harm is severe, but symmetry break forces rejection). The procedure halts at Step 3, overriding GB. Analysts flag the "values handoff" risk, but symmetry break takes precedence.  

  ---

  **Verdict:** The procedure necessarily collapses into a non-evidential value judgment when global benefits and local costs are incommensurable under all proposed units of account.
