answer: |-
  ### Brainstorming: Mapping the Conceptual Terrain  
  **Core Problem**: The "inefficacy objection" claims individual actions in large-scale collective harms (e.g., reducing personal CO₂ emissions, abstaining from meat, voting) are morally negligible because their causal impact is imperceptible. This challenges narratives of individual agency.  

  **Key Variables for Narrative Resolution**:  
  1. **Causal Visibility**: Can an action’s effect be traced in a non-statistical story? (e.g., "My vote swung Election X" vs. "My CO₂ reduction had no measurable effect").  
  2. **Decisiveness Potential**: Does the act *feel* like it could tip an outcome? (Threshold effects enable this; purely linear harms do not.)  
  3. **Expressive Load**: Does the act symbolize commitment to a value beyond its direct impact? (e.g., voting as civic ritual vs. eating meat as complicity).  

  **Conceptual Dependencies**:  
  - **Upstream**: Questions that define *whether individual acts can carry moral weight at all* when effects are imperceptible. These constrain all others.  
  - **Midstream**: Questions about *how* agency manifests (e.g., thresholds, symbolism).  
  - **Downstream**: Domain-specific applications (e.g., "Is voting like buying a burger?").  

  **Tractability**: Symbolic value and expected-utility rehabilitation are more conceptual; threshold effects blend conceptual/empirical work.  

  ---

  ### Prioritized Agenda of Open Questions  
  *(Ranked by: (1) Upstream status, (2) Transformative potential for responsibility frameworks, (3) Relevance to narrative resolution)*  

  **1. Can expected-utility reasoning be rehabilitated for imperceptible effects?**  
     - **Why Upstream**: If imperceptible acts *can* carry moral weight (e.g., via expected harm calculations), the inefficacy objection collapses—reshaping all domains. If not, agency hinges entirely on non-consequentialist grounds (e.g., symbolism).  
     - **Practical Impact**: Validates/invalidates carbon footprint calculations, "ethical consumerism," and voting rationality.  
     - **Narrative Relevance**: Allows characters to frame choices as *causally meaningful* even in statistical systems ("My 0.00001% chance of changing an outcome *matters*").  
     - **Tractability**: Purely conceptual (e.g., Parfit’s "Harmless Torturers" paradox). Settling this would resolve 80% of debates.  

  **2. How does expressive/symbolic value operate when causal efficacy is near-zero?**  
     - **Why Midstream/Upstream**: If consequentialism fails, expression becomes the primary site of agency. This redefines responsibility as *identity-signaling* or *system-reinforcement* (e.g., "I don’t eat meat to *be* ethical, not to save animals").  
     - **Practical Impact**: Justifies voting as civic duty regardless of swing chances, or vegetarianism as moral integrity.  
     - **Narrative Relevance**: Enables characters to find agency in *self-narration* ("I act to align with my values, not to fix the system"). Crucial for plots where systemic change is invisible.  
     - **Tractability**: Conceptual (needs a theory of symbolic causation).  

  **3. How do threshold effects alter the logical structure of collective harm?**  
     - **Why Midstream**: Thresholds (e.g., climate tipping points, electoral margins) make individual acts *potentially decisive*, restoring causal narratives. But this is context-dependent.  
     - **Practical Impact**: Prioritizes actions near thresholds (e.g., campaigning in swing states, reducing emissions in critical sectors). Less relevant for diffuse harms like daily meat consumption.  
     - **Narrative Relevance**: Allows "heroic tipping-point" plots (e.g., a character’s act triggers a cascade). Limited to domains with identifiable thresholds.  
     - **Tractability**: Semi-empirical (reliant on identifying real-world thresholds).  

  **4. Is voting structurally identical to consumption-based harms?**  
     - **Why Downstream**: This presumes answers to #1–#3. If voting is expressive ritual (#2) and consumption is threshold-insensitive (#3), they diverge categorically.  
     - **Practical Impact**: Determines whether "ethical voting" parallels "ethical consumption" or demands distinct theories (e.g., voting as duty vs. consumption as preference).  
     - **Narrative Relevance**: Affects character motivation (e.g., "Why vote but eat meat?"). Minor framework shift.  
     - **Tractability**: Largely derivative; requires applying prior answers.  

  ---

  ### Why This Order?  
  - **Dependency**: Until #1 (imperceptible effects) is resolved, #2–#4 lack foundations. #2 (symbolic value) is the fallback position if #1 fails.  
  - **Transformative Potential**: #1 and #2 redefine agency across *all* domains; #3 and #4 refine specific cases.  
  - **Narrative Utility**: #1 and #2 let characters *claim agency* without causal visibility—essential for stories where systemic change is intangible. #3 offers traditional "decisive act" plots but only in threshold scenarios.  
  - **Tractability**: #1 and #2 are ripe for conceptual breakthroughs; #3 and #4 await those answers.  

  **For Your Novel**: Focus on #2 (symbolic value). It best supports characters who *craft meaning* from acts swallowed by scale—e.g., a climate scientist who bikes to work as "bearing witness," or a voter in a safe seat who sees ballots as "pledges to the future." This transforms futility into moral identity, the novelist’s richest terrain.
