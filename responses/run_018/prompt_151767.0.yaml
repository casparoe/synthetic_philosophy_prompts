  For resolution... I'm skeptical. They might be talking past each other: one about representing uncertainty, the other about resolving it. The "beliefs vs decisions" framing seems correct. Perhaps distinguishing between "what we know" (credal set) and "how we act" (decision rule) could help, but won't end the debate because they prioritize differently.

