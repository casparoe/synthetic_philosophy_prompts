answer: |-
  ### Purpose and Angle
  This taxonomy arises from a graduate metaphysics seminar examining dispositions beyond textbook cases, focusing on how finking (disposition removal pre-trigger) and masking (manifestation-blocking) interact with composite and artificial systems. Including such cases reveals whether students' commitments consistently handle structurally guaranteed interruptions—like institutional procedures or engineered overrides—that challenge standard analyses. The decision tree bypasses self-identified labels (e.g., "dispositional essentialist") by using concrete scenarios. This exposes hidden tensions, such as whether one’s realism about a glass’s fragility survives when confronting a university committee whose "disposition" to fund projects is perpetually masked by its own quorum rule. The taxonomy maps how core intuitions constrain positions across domains, highlighting where artificial or collective systems force revisions to theories developed for simple objects.

  ### The Decision Tree
  *Root Commitment:*  
  **Q0:** Can a thing possess a genuine disposition (e.g., fragility, solubility) even when it is not currently manifesting that disposition?  
  - **Yes** → Proceed to Q1  
  - **No** → **Leaf: Eliminativism** (Dispositions are not real properties; only categorical bases exist.)

  **Q1 (Finking with Internal Interrupter):**  
  A fragile glass is connected to an *internal* sensor-circuit. If the glass is struck, the circuit instantly hardens it, preventing breakage. Before any strike, is the glass still fragile?  
  - **Yes** → Proceed to Q2  
  - **No** → **Leaf: Naive Conditional Analysis** (Dispositions are fully analysable as simple conditionals; finks falsify the disposition.)

  **Q2 (Masking as Removal vs Suppression):**  
  A soluble sugar cube is coated in an external, inert lacquer that prevents dissolution in water. The lacquer blocks manifestation but doesn’t alter the sugar’s intrinsic structure. Does the cube *lose* its solubility, or does it *retain* solubility that is merely prevented from manifesting?  
  - **Retains Solubility** → Proceed to Q3  
  - **Loses Solubility** → **Leaf: Bare Dispositional Realism** (Dispositions are irreducible properties; any blocker that prevents manifestation *destroys* the disposition.)

  **Q3 (Composite Systems with Systematic Interruption):**  
  *A robotic arm* is programmed to grasp objects placed near it ("grasping disposition"). It has an *internal* safety override circuit that activates *only upon contact*, forcing it to retract instantly. Does the robot possess a genuine grasping disposition?  
  - **Yes** → Proceed to Q4  
  - **No** → **Leaf: Hybrid View** (Dispositions exist only where finking/masking isn’t structurally guaranteed by the system’s own design.)

  **Q4 (Dispositional Essentialism & Widespread Masking):**  
  *A university committee* has rules granting it a "disposition" to approve valid funding requests. However, its *internal* mandatory quorum rule (requiring 10 members present) is *never* met, systematically masking approval. If masking (as defined in Q2) is widespread in nature (e.g., soluble rocks coated in impermeable shale) *and* artificial systems, can properties like fragility/solubility still be essential features of objects?  
  - **Yes** → **Leaf: Collective/Pluralist Dispositionalism** (Composites genuinely possess irreducible dispositions, even when systematically interrupted by their own parts/rules.)  
  - **No** → **Leaf: Mask-Tolerant Dispositional Realism** (Dispositions survive masking but are destroyed by finking; widespread masking undermines essentialism by making dispositions too extrinsic.)

  *Leaf Position Summaries:*  
  1. **Eliminativism:** Only categorical properties exist; dispositions are not real.  
  2. **Naive Conditional Analysis:** Dispositions are reducible to simple counterfactual conditionals, falsified by finking.  
  3. **Bare Dispositional Realism:** Dispositions are irreducible, intrinsic properties destroyed by any blocker (fink or mask).  
  4. **Mask-Tolerant Dispositional Realism:** Dispositions survive masking but not finking; widespread masking challenges essentialism.  
  5. **Collective/Pluralist Dispositionalism:** Composite systems possess irreducible dispositions, undeterred by internal masking/finking rules.  
  6. **Hybrid View:** Dispositions exist only in systems without structural guarantees of finking/masking.

  ### Logical Space Mapping
  *Key: Q1 (Fink Survive?), Q2 (Mask Removes?), Q3 (Composite Disposition?), Q4 (Essentialism Survives Masking?)*  
  | Path (Q1, Q2, Q3, Q4) | Occupied? | Position Name                   | Diagnosis if Empty               |
  |------------------------|-----------|---------------------------------|----------------------------------|
  | No, -, -, -            | Yes       | Eliminativism                   |                                  |
  | Yes, No, -, -          | Yes       | Naive Conditional Analysis      |                                  |
  | Yes, Yes, No, -        | Yes       | Hybrid View                     |                                  |
  | Yes, Yes, Yes, No      | Yes       | Mask-Tolerant Realism           |                                  |
  | Yes, Yes, Yes, Yes     | Yes       | Collective Dispositionalism     |                                  |
  | Yes, No, -, -          | -         | *Invalid (Q2 branch not taken)* |                                  |
  | Yes, Yes, No, Yes      | No        |                                 | **Incoherent:** Hybrid view (Q3=No) denies composite dispositions, making Q4 irrelevant/nonsensical. |
  | Yes, Yes, No, No       | No        |                                 | **Incoherent:** As above.        |
  | No, Yes, -, -          | No        |                                 | **Incoherent:** Eliminativism (Q0=No) makes subsequent questions moot. |
  | No, No, -, -           | No        |                                 | **Incoherent:** As above.        |
  | Yes, No, Yes, -        | No        |                                 | **Unattractive:** Accepts composites with finks (Q3=Yes) but defines dispositions via conditionals (Q1=No), making systematic finking a contradiction. |
  | Yes, No, Yes, Yes      | No        |                                 | **Unexplored:** Might posit conditional dispositions for composites despite finking, but link to essentialism unclear. |
  | Yes, No, Yes, No       | No        |                                 | **Unexplored:** As above, but denies essentialism. |
  | Yes, No, No, -         | No        |                                 | **Unattractive:** Conditional dispositions (Q1=No) but denies composites possess them even without guarantees (Q3=No), overly restrictive. |

  ### Unresolvable Pairs and Limits
  The tree **cannot distinguish Bare Dispositional Realism (Q2=Loses Solubility) from Mask-Tolerant Realism (Q2=Retains Solubility, Q4=No) on simple physical cases** like the lacquered sugar cube or a fragile glass with external protection. Both positions agree the masked sugar is *not* soluble *at that time* – Bare Realism because the mask destroys the disposition, Mask-Tolerant Realism because masking suppresses manifestation. They diverge only on whether the disposition *persists* masked (Mask-Tolerant) or is *annihilated* (Bare). Without temporal cases (e.g., "If lacquer is removed, was solubility present?") or modal tests, their answers converge for static masking scenarios. Similarly, **Collective Dispositionalism and Mask-Tolerant Realism** both answer "Yes" to the robotic arm (Q3) but diverge on essentialism (Q4); the tree separates them, but without Q4, their commitments to composites appear identical.

  ### Seminar Use Notes
  1.  **Administer sequentially:** Present questions as concrete scenarios (Q1: Glass with hardening circuit; Q2: Lacquered sugar; Q3: Robotic arm with contact-triggered retraction override; Q4: Committee with perpetual quorum failure). Use these descriptions *verbatim*; avoid terms like "fink" or "mask".
  2.  **Blind labelling:** Students answer Yes/No or choose options (e.g., "Loses/Retains" for Q2). Only reveal position names *after* all answers are collected.
  3.  **Highlight composites:** Frame the robotic arm and committee cases as tests for whether "system-level behaviours" count as genuine dispositions when internally disrupted. Emphasise the *structural guarantee* of interruption (e.g., "the override *always* activates on contact").
  4.  **Focus on commitments:** Discourage "What would [Philosopher X] say?" discussions. Ask: "Given your previous answers, what *must* you say about this new case?"
