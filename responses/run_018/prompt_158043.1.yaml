  I need to recall Gongsun Long's argument: he claimed a white horse isn't a horse because "horse" refers to the universal form or essence, while "white horse" is a particular instance with added attributes, so they can't be identical. The Mingjia distinguished universals (like "horseness") from particulars (individual horses).

  Now for the 1893 case: botanically, tomatoes are fruits because they develop from flowers and contain seeds, but the Court ruled them vegetables for tariff purposes based on common usage and culinary context. The key is whether this aligns with Gongsun Long's strict separation or shows categories are flexible and pragmatic.

