answer: |-
  The retention challenge is real but misdiagnosed—your framing falsely equates the *initial* legitimacy of random selection with *ongoing* voluntarism, ignoring that jury duty's moral authority already rests on mandatory civic contribution, not continuous opt-in enthusiasm. We design for attrition: short, staggered terms (e.g., 1-2 years per tier) with exemptions for genuine hardship, coupled with meaningful compensation at median wages to neutralize class bias. Crucially, nested tiers don’t mean serial decades-long service; rotating cohorts prevent burnout while stratified sampling *at each selection stage*—actively oversampling underrepresented groups—ensures the aggregate body mirrors society even if some decline. Elections, by contrast, bake in *systematic* exclusion of the working class and marginalized through financial and campaign barriers, whereas our attrition-managed sortition, with enforced demographic quotas, still achieves superior descriptive representation precisely because it counteracts self-selection through mandatory outreach and penalties for non-participation that are *no more coercive* than tax obligations in a functioning democracy. The alternative isn’t some purist voluntary pool—it’s the permanent elected oligarchy we suffer now.
