prompt: |-
  I sit on a quarterly review board for a regional water-management agency and we keep getting proposals to swap our old hydrology model for a "new" one that mostly just reprocesses rainfall records from the 1980s — data that was already published when the original 1990s model was built. I want a reusable decision proceedure grounded in Bayesian epistemology's problem of old evidence, not just "update on new data". Give me a checklist my board can run in about twenty minutes: steps in order, what counts as passing each, where it forces a "no — this doesn't actually confirm anything", where it hands the call to a human because it's values not math, and what it flat-out can't settle (especially when we don't have real prior numbers). Apply it to three proposals: (1) the new model feeds in 1985 drought data that was actually cited in the 1998 study it's trying to replace; (2) same 1985 data was technically in a government report but nobody in the field used or knew about it until now; (3) the raw data is identical but the model applies a strange transformation that makes the fit look better, and your gut says that should matter but you can't articulate why. For each, say what the proceedure outputs, including the case where you'll hate the answer. Lead with your bottom line in the very first sentence, then reasoning, no preamble, and don't restate my question. Please don't ask for a bibliography — some of us don't have database access — and don't quote anyone verbatim unless you can fetch the actual passage.
reasoning: |-
  We are going to develop a Bayesian decision procedure for evaluating proposals to replace an old hydrology model with a new one, especially when the new model uses old evidence (data already available when the old model was built). The core idea is that old evidence cannot confirm a new model if that evidence was already used in building the old model, unless there's a reason to think the new model handles it better in a way that wasn't exploited by the old model's construction.

  Bottom line: A new model using old evidence only provides confirmation if the evidence was not used in constructing the old model OR if the new model makes a novel prediction that the old model does not (even if the data is old, the prediction was not extracted from it in the old model's construction). Otherwise, the fit to old evidence is expected and non-informative.

  Checklist Steps:

  1. **Evidence Novelty Check**: 
     - **Step**: Was the specific evidence (data) used in the construction or calibration of the old model? 
     - **Passing**: If the evidence was NOT used in the old model's construction, then it can confirm the new model. If it was used, then it cannot confirm the new model (unless step 2 passes).
     - **Human Call**: If it's unclear whether the evidence was used (e.g., because the old model's development is poorly documented), then we cannot automatically pass/fail and must rely on expert testimony about the old model's development.

  2. **Predictive Novelty Check**:
     - **Step**: Does the new model make a prediction (using the old evidence) that the old model does not? Specifically, does the new model use the old evidence to make a prediction about a different aspect of the data or in a way that was not already optimized in the old model?
     - **Passing**: If the new model makes a novel prediction (even using old evidence) that the old model does not, and that prediction is borne out by the old evidence, then it confirms the new model. Otherwise, it does not.
     - **Human Call**: Determining what counts as a novel prediction might require domain expertise. For example, if the new model uses a different mathematical structure that wasn't considered in the old model and that structure leads to a better fit without overfitting, that might be novel.

  3. **Transformation Check**:
     - **Step**: If the new model applies a transformation to the data, is that transformation physically justified and not ad hoc? 
     - **Passing**: The transformation must be based on a mechanistic understanding of the system (e.g., a known physical law) and not merely a mathematical trick to improve fit. If it is ad hoc, then the improved fit is not confirmatory.
     - **Human Call**: Whether a transformation is physically justified requires domain knowledge and cannot be decided by pure mathematics.

  4. **Prior Specification Check**:
     - **Step**: Do we have a reasonable prior for the model parameters? 
     - **Passing**: If we have a prior that is not too vague (so that the model isn't just fitting noise) and is grounded in theory, then the fit can be evaluated. If the prior is too vague, then a good fit might be due to overfitting and not confirmatory.
     - **Human Call**: Setting a prior is a value-laden decision that requires expert judgment.

  5. **Model Comparison Check**:
     - **Step**: Compare the new model and the old model using a criterion that accounts for overfitting (e.g., AIC, BIC, cross-validation) on a holdout dataset (if available). 
     - **Passing**: The new model must perform significantly better on a criterion that penalizes complexity. If no holdout data is available and the data is the same as used in the old model, then the comparison must use a penalized likelihood.
     - **Can't Settle**: Without a holdout dataset, we cannot be sure that the new model isn't overfitting. We might have to collect new data.

  6. **Robustness Check**:
     - **Step**: Is the new model's performance robust to small changes in the data? 
     - **Passing**: If the model's performance doesn't degrade with small perturbations (e.g., via bootstrapping or sensitivity analysis), then it's robust.
     - **Human Call**: Deciding what counts as a "small change" and how much degradation is acceptable requires domain knowledge.

  7. **Value Judgment**:
     - **Step**: Even if the new model passes the above checks, does it align with the agency's values (e.g., cost, interpretability, regulatory requirements)? 
     - **Human Call**: This step is entirely about values and must be decided by the board.

  Now, applying the checklist to the three proposals:

  **Proposal 1**: New model uses 1985 drought data that was cited in the 1998 study (old model).

  - Step 1: Evidence Novelty Check → **FAIL** because the evidence was used in the old model's construction. 
  - Step 2: Predictive Novelty Check → Unless the new model makes a novel prediction (which it doesn't, because it's the same data and same kind of fit), it fails. 
  - **Output**: The proposal does not actually confirm the new model. The fit to the 1985 data is expected and non-informative.

  **Proposal 2**: Same 1985 data was in a government report but nobody in the field used or knew about it until now.

  - Step 1: Evidence Novelty Check → **PASS** because the evidence was not used in the old model's construction (even though it existed, it wasn't used). 
  - Step 2: Predictive Novelty Check → We then need to check if the new model makes a prediction that the old model does not. Since the old model was built without this data, the new model's fit to this data is novel. However, note that the data is old and we have the entire dataset. We must check if the new model is making a prediction that the old model wouldn't have made for this data. Since the old model wasn't fit to this data, we can treat it as a novel test. 
  - **Output**: This proposal passes the first two checks and provides confirmation for the new model, provided the fit is not due to overfitting (which we check in steps 3-6). We then proceed to the other checks.

  **Proposal 3**: Raw data identical but the model applies a strange transformation that makes the fit look better.

  - Step 3: Transformation Check → We must check if the transformation is physically justified. If it's "strange" and we cannot justify it physically, then it fails. 
  - Step 5: Model Comparison Check → We must check if the improvement in fit is significant after accounting for the extra complexity of the transformation (using AIC/BIC). If the transformation adds parameters, it might not be better after penalization. 
  - **Output**: If the transformation is ad hoc (not physically justified) and/or the improvement is not significant after penalization, then it fails. Otherwise, it passes. But note: our gut feeling that it's strange might be the human call in step 3 (if we can't justify it physically, then fail). 

  Note: In proposal 3, if the transformation is not justified, then even if it passes the model comparison (by having a better AIC/BIC) we might still fail it because of step 3. This is because an ad hoc transformation might be overfitting and not generalizable.

  For each proposal, the checklist will output:

  - **Proposal 1**: Reject (fails step 1 and step 2).
  - **Proposal 2**: Proceed to further checks (steps 3-7) because it passes step 1 and step 2. However, if it fails any of the subsequent checks, it might still be rejected.
  - **Proposal 3**: If the transformation is not physically justified, then reject (step 3). Otherwise, proceed to step 5 and beyond.

  We must note that without prior numbers (as in step 4) we might not be able to do a full Bayesian update, but we can use approximations (like BIC) in step 5. The checklist forces a "no" when the evidence is not novel and there's no predictive novelty (step 1 and 2 fail). It hands the call to humans when there is ambiguity about the use of evidence (step 1), the novelty of the prediction (step 2), the justification of a transformation (step 3), the setting of a prior (step 4), and the value judgments (step 7). It cannot settle the issue without real prior numbers (step 4) and without a holdout dataset for model comparison (step 5).

  This procedure should take about 20 minutes to run for a proposal if the necessary information is at hand.
answer: |-
  **Bottom line**: A new model using old evidence confirms the old model unless the evidence was unused in the old model's construction or the new model generates novel, untested predictions from that evidence—otherwise, it's non-informative curve-fitting.  

  ---

  ### **Bayesian Decision Checklist** (20-min runtime)  
  **Order**: Execute steps sequentially. Stop at first "No" unless specified.  

  1. **Evidence-Usage Check**  
     - *Question*: Was this specific evidence *explicitly used* to build/calibrate the old model?  
     - *Pass*: Evidence was **not used** (proceed to Step 2).  
     - *Fail*: Evidence **was used** → **No** (non-confirmatory; stop).  
     - *Human call*: If usage is ambiguous (e.g., incomplete records).  

  2. **Predictive Novelty Check**  
     - *Question*: Does the new model make a *testable prediction* from this evidence that the old model *could not/did not* make?  
     - *Pass*: Novel prediction exists and fits data (proceed to Step 3).  
     - *Fail*: No novel prediction → **No** (stop).  
     - *Human call*: Judging prediction novelty (e.g., new physical mechanism).  

  3. **Transformation Justification Check**  
     - *Question*: If data is transformed (e.g., re-binned, normalized), is it *physically justified* by hydrology theory?  
     - *Pass*: Transformation has mechanistic basis (e.g., soil saturation physics).  
     - *Fail*: Ad hoc transformation (e.g., arbitrary scaling) → **No** (stop).  
     - *Human call*: If justification is disputed or theoretical.  

  4. **Overfitting Penalty Check** (If Steps 1–3 pass)  
     - *Question*: Does the new model *outperform* the old one on a complexity-penalized metric (e.g., BIC, AIC) using *all* evidence?  
     - *Pass*: ΔBIC > 6 (strong evidence for new model) → **Yes**.  
     - *Fail*: ΔBIC < 2 → **No** (stop).  
     - *Can’t settle*: No prior numbers → Human judgment on parsimony.  

  5. **Values Threshold** (Final step)  
     - *Question*: Does the new model align with agency values (cost, risk, interpretability)?  
     - *Human call*: Always (e.g., trade-offs like model transparency).  

  ---

  ### **Application to Proposals**  
  **Proposal 1 (1985 data cited in 1998 study)**  
  - Step 1: **Fail** (evidence used in old model → non-confirmatory).  
  - **Output**: **No** — This doesn’t confirm anything.  

  **Proposal 2 (1985 data existed but unused/unknown)**  
  - Step 1: **Pass** (evidence novel to old model).  
  - Step 2: **Pass** (implicitly novel; old model never tested against it).  
  - Step 3: **N/A** (no transformation).  
  - Step 4: **Can’t settle** (no priors → human judges fit quality).  
  - **Output**: Proceed to human judgment (values/parsimony).  

  **Proposal 3 (Same data, strange transformation)**  
  - Step 1: **Pass** (if evidence wasn’t used, else fail at Step 1).  
  - Step 2: Likely **fail** (no novel prediction; just better fit).  
  - Step 3: **Fail** ("strange" implies ad hoc → unjustified).  
  - **Output**: **No** (fails Step 3; transformation invalid).  
  - *You’ll hate this*: Even if fit improves, unjustified transformations are epistemically void.  

  ---

  ### **What This Can’t Settle**  
  - **No real priors**: Relies on human heuristics for parsimony (Step 4).  
  - **Ambiguous evidence usage**: Requires archival research/human recall (Step 1).  
  - **Values conflicts**: E.g., a statistically superior but opaque model (Step 5).
