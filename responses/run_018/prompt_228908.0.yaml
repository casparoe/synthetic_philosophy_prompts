answer: |-
  ## The Persistence of Promises: Clara vs. Marcus

  **(Setting: Your Mom’s cozy living room. Sunlight streams in. Your Mom, while a bit forgetful and occasionally sharp-tongued in a way unfamiliar to you, is clearly happy to have visitors. Clara (Endurantist), warm and grounded, chats with her about gardening. Marcus (Perdurantist), thoughtful and precise, admires family photos. You watch, the familiar worry gnawing at you.)**

  **Mom:** (Suddenly frustrated, misplacing her teacup) Oh, for heaven’s sake! Where did I just put it? It’s like things vanish! So irritating!
  **You:** (Forcing a smile) It’s right there, Mom. On the coaster.
  **Mom:** (Sighs, softening slightly) Oh. Yes. Thank you, dear. Silly me.

  **(Later, driving home. The earlier moment hangs in the air.)**

  **You:** (Quietly) You saw it. That irritability… it’s just *not* her. The Mom I knew was endlessly patient. And it makes me circle back to the same awful question: When she loses more… when she becomes someone I barely recognize… is she still *Mom*? I promised *her* – the patient, sharp-witted woman who raised me – I’d never put her in a home. But is that promise owed to… whoever she’s becoming?

  **Clara:** (Leans forward from the back seat) She *is* still her, right now, in this car. That’s what matters. Endurantism says your Mom is wholly present at every moment she exists. The person who was patient yesterday, the person who’s sometimes frustrated today, the person who will be different tomorrow – it’s all *her*. The same entity, persisting through time, enduring change. The ‘her’ you promised is the *very same* person sitting confused in her living room now.

  **Marcus:** (Adjusting his glasses, looking at you in the rearview) Clara’s right that it’s the same *entity*, the same biological and psychological continuity. But perdurantism frames it as the same extended four-dimensional object – a ‘person-worm,’ if you will, stretched across time. Your Mom isn't *just* present now; she's a sequence of temporal parts or ‘stages’: the patient mother-stage, the current confused-and-irritable stage, future stages we can’t foresee. They’re all parts of the whole Marcus-worm.

  **You:** (Shuddering slightly) ‘Worm’ sounds horrifyingly clinical, Marcus. Does that mean the ‘her’ I made the promise to is a *different temporal part* from the ‘her’ now? That feels like it dissolves my question entirely! If it’s a different stage, maybe the promise *doesn’t* apply? Is that… convenient?

  **Marcus:** It’s not about convenience, and it shouldn’t dissolve the moral weight. Think of it spatially: You promise to take care of your friend’s *whole* house while they’re away – front porch, living room, messy basement. Each room is a different ‘spatial part.’ You don’t stop cleaning the basement because it’s not the porch. Similarly, your promise was to the *whole person* – the entire temporally extended entity, including *all* her stages. You owe care to the current stage *because* it's part of the whole four-dimensional being you love and promised to protect.

  **Clara:** But Marcus, that avoids the heart of the *temporary intrinsics problem* that endurantism tackles head-on. *How* can the very same thing – your Mom – have contradictory properties? Patient yesterday, irritable today? Endurantism says she *can* have these properties, just not at the same time. She *has* the property of *being-patient-at-time-T1* and *being-irritable-at-time-T2*. The properties are time-indexed, but the *bearer* is the same whole person. It’s not that her core ‘self’ changes; circumstances – the disease – cause different properties to manifest in the same enduring entity.

  **Marcus:** But Clara, isn’t adding ‘at time T’ just smuggling in temporal parts through the back door? You’re implicitly defining a *state* of your Mom at T1 (patient) and a different *state* at T2 (irritable). That sounds suspiciously like my temporal stages! What’s the enduring ‘core’ beyond the sum of these time-indexed states? The disease might be changing *that* core too.

  **Clara:** The core is her personal identity – the unique, persisting entity shaped by her entire history. The disease alters how that identity manifests, tragically, but the *she* who is manifesting it remains. That’s why your promise holds. It binds *you* to *her*, the enduring entity, through all her manifestations. Your changing feelings? They’re your response to the changing properties *of the same person*. It’s natural, painful, but doesn’t negate the underlying bond to *her*.

  **Marcus:** I agree the bond persists, but perdurantism might frame your changing feelings differently, perhaps more gently. You don’t feel the same way towards every temporal part of your best friend – you might be furious at them one day, fond the next. Yet you love the *whole* friend. Your love for your Mom *now* isn’t (and perhaps can’t be) identical to your love for her pre-dementia stage. That’s okay. You’re responding appropriately to the specific temporal stage you’re interacting with. Your promise wasn’t just to *feel* a certain way eternally; it was an *action* committed to the well-being of the entire temporal being. Caring for the irritable stage *is* fulfilling that promise to the whole person-worm.

  **You:** So, Clara, you’re saying my promise is ironclad to the *whole, enduring her*, even as she changes. And Marcus, you’re saying the promise binds me to care for *all parts* of her timeline, even if how I feel about each part changes. But… is one view more… humane here? Clara, doesn’t insisting it’s still *her* when she’s screaming things she’d never say feel like a cruel trick? And Marcus, doesn’t calling her a ‘stage’ feel like reducing her to a snapshot?

  **Clara:** It’s not a trick, it’s fidelity. Seeing her as enduring means her dignity persists *through* the indignity of the disease. Your compassion is for *her*, the person suffering the change, not for a disconnected ‘stage.’ It anchors your duty in *who she is*, not just what she’s like now.

  **Marcus:** And seeing the stages highlights the *reality* of the change without demanding you deny it to preserve an abstract identity. It acknowledges your grief for the lost stages while focusing your care on the stage that exists *now*. It’s not reduction; it’s recognizing the complexity of existence through time. The ‘worm’ is the whole, rich, changing life. Caring for the current stage *is* honoring the whole.

  **Clara:** But does it truly capture the *unity* of her experience, Marcus? Does the ‘worm’ feel joy or confusion, or is it just the *stages* that feel?

  **Marcus:** The stages *are* the experiences, Clara! The worm *has* those experiences by *having* those stages. Just like the road *has* bumps by *having* bumpy spatial parts. The unity is in the causal and psychological connection between the stages – the story they tell together.

  **(Silence falls for a moment.)**

  **Clara:** (Gently) Ultimately, love and duty aren't dictated by metaphysics. Whether you see her as enduring or extended, the call is the same: care for the person before you, with all her history and her painful present. Your promise was an expression of that love. Fulfilling it means acting with love towards who she is *now*, whoever metaphysics says that is.

  **Marcus:** Exactly. The ‘her’ you promised *included* the possibility of future suffering. She trusted *you* to be there for *all* of her journey, knowing parts of it would be hard. Whether you conceptualize that journey as an enduring traveler or a path with different terrains, your commitment was to walk it with her. Your changing feelings are part of *your* journey alongside hers. The promise means you don't walk away, regardless of the terrain.

  **You:** (Taking a deep breath) So… both of you end up telling me to keep caring, keep loving as best I can, even when it hurts. Even when she doesn't seem like 'her'. The metaphysics is just… how you understand the map?

  **Clara:** (Smiling softly) The map matters, but the territory is love and loyalty.

  **Marcus:** (Nodding) And the territory demands we care for the person in front of us, stage or whole, knowing they are part of a story we promised to honor.

  **(The car drives on, the philosophical tension unresolved, but the path forward, for now, feels a little clearer.)**
