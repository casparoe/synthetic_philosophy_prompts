  Hmm... the key insight should be building from the familiar (Kant's duty/accordance distinction) to the novel (motivational structure). The sequence must start with concrete intuition before abstract analysis. I recall that misconceptions about "right reasons" often involve emotional associations - that's a critical interception point.

  For the carrying scenario, I'm considering a grandmother example because it avoids shopkeeper clichés while keeping generational relatability. The weight/distance details create plausible deniability for both motivations. 

  Ah! The misconception map is crucial. Three predictable errors: conflating worth with emotion (intercept at Step 3), with guilt (counter during question phase), and with rule-following (demolish via contrast in Step 5). Each interception needs precise timing before the idea solidifies.

  The diagnostic question should test structural understanding, not terminology. Asking "What would change about Anna's thoughts?" forces application to practical reasoning. Must explicitly flag excluded debates like conscious access to motivations - that's graduate-level terrain.

  Final structure: anchor in Kant (5 min), escalate to grandmother case (15 min), dissect motivations (10 min), diagnose via question (5 min), with buffer. The dependency flows from moral worth → motivation types → their necessity → misconception prevention. 

  Notably, the user's emphasis on "conceptual necessity" means we must show students why Kant's framework demands this distinction. That emerges in Step 4 when we reveal how principle-direction saves duty's universality while honoring concreteness.
answer: |-
  Here's a precise 40-minute teaching plan designed to build the structural distinction *conceptually* using dependency order, intercept misconceptions, and assess understanding without overwhelming first-years:

  **Core Objective:** Students grasp that moral worth hinges on *how* reasons function in practical reasoning (object-directed vs. principle-directed), not just *what* the action is or *that* duty motivates.

  **Key Distinction:** 
  *   **Object-Directed Motivation:** Being moved directly by the concrete, morally salient features of the situation itself (e.g., "She's struggling, I should help *her*").
  *   **Principle-Directed Motivation:** Being moved by the abstract formulation of duty *as a principle* (e.g., "Helping those in need is my duty, therefore I must act").

  **Misconceptions to Intercept:**
  1.  **Right Reasons = Warm Feelings:** Intercept @ Step 4.
  2.  **Right Reasons = Feeling Guilty/Obligated:** Intercept @ Step 5 (Q&A).
  3.  **Right Reasons = Mechanical Rule-Following:** Intercept @ Step 6.
  4.  **"Duty" means grim/reluctant action:** Countered implicitly by Anna's focus.

  **Materials:** Whiteboard; Prepared scenario slide/written handout.

  **The Scenario:** **"Anna and the Groceries"**
  > *Anna is walking home and sees an elderly neighbor, Mrs. Chen, struggling to carry heavy grocery bags up her icy front steps. Mrs. Chen looks exhausted and unsteady. Anna immediately walks over, takes the bags, and helps her safely inside. Anna is a morally conscientious person.*

  **The Plan (40 min):**

  1.  **Anchor & Review: Kant's Core Distinction (5 min)**
      *   **Q1:** "Recall Kant: What's the difference between acting *merely in accordance with duty* and acting *from duty*? Why does it matter for moral worth?" (Elicit: External reward/fear vs. motive of duty; worth only in latter).
      *   **Board:** Write "Moral Worth → Acting *FROM DUTY*".
      *   **Why this first:** Establishes the non-negotiable foundation: Moral worth requires motivation *by duty*. Without this, the deeper structural question is irrelevant.

  2.  **Introduce Scenario & Establish Baseline (5 min)**
      *   Present "Anna and the Groceries". Read aloud.
      *   **Q2:** "Did Anna act *from duty* here? (Assume yes). So, does her action likely have moral worth according to Kant?" (Elicit consensus: Yes).
      *   **Why:** Creates a concrete, relatable, non-textbook case where duty-motivation seems present and unproblematic. Sets the stage for probing *how* that motivation functions.

  3.  **Probe the "How": Introducing Structure (10 min)**
      *   **Q3:** "Okay, we agree Anna acted *from duty*. But *how exactly* might the thought of duty have functioned in her mind *in that moment*? What specific thoughts or awareness might she have had?"
      *   **Elicit Student Ideas:** (Write key phrases on board without labelling yet). Expect answers like:
          *   "She saw Mrs. Chen needed help."
          *   "She thought, 'It's my duty to help people in need.'"
          *   "She felt she *should* help."
          *   "She didn't want Mrs. Chen to fall."
      *   **Guide:** Cluster similar thoughts. Don't correct yet. Point out variations: Some focus on *Mrs. Chen's situation*, some on *the abstract idea of duty*.
      *   **Why:** Forces them to think about the *structure* of reasoning *within* acting from duty. Reveals natural variation in how "duty" manifests mentally.

  4.  **Introduce the Structural Distinction & Intercept "Warm Feelings" (10 min)**
      *   **Label the Clusters:**
          *   Group thoughts like "saw she needed help," "didn't want her to fall" → **"Motivated by *what she saw*: Mrs. Chen's struggle, the danger."** (Object-Directed).
          *   Group thoughts like "thought 'it's my duty to help'", "felt she *should* help" → **"Motivated by *thinking about duty itself* as a rule or principle."** (Principle-Directed).
      *   **Clarify:** "Both are motivations *from duty*. Kant says moral worth needs duty. But now we see duty can motivate in *different structural ways*: Either the situation's concrete features *themselves* move you *because* they engage your sense of duty, OR the abstract principle of duty moves you *directly*, and the situation is just an instance."
      *   **Intercept Misconception 1 (Warm Feelings):** "Notice: Neither version *requires* Anna to feel warm, fuzzy, or loving *emotions* towards Mrs. Chen. She might feel concern, but the key is what her *reasoning* focuses on: the concrete need or the abstract rule. Moral worth isn't about feeling nice; it's about the structure of your *reasons*." (Emphasize "reasoning", "focus").

  5.  **Deepen: Why Does *This* Distinction Matter? (5 min)**
      *   **Q4:** "Why might Kant care about *this* difference? If both involve duty, isn't that enough for moral worth?" (Prompt: Universality, Rationality).
      *   **Guide Discussion Towards:** 
          *   Object-Directed: Shows duty is *responsive* to the morally relevant features *in the world*. The *content* of the situation (need, danger) *itself* motivates the dutiful person immediately.
          *   Principle-Directed: Shows duty functions as a *universal rule* guiding action. The power comes from the *form* of the law itself.
      *   **Key Insight:** "Kant needs *both* aspects! Moral worth requires that the *concrete moral reality* (object) moves us, but *because* we recognize it through the *lens of the universal moral law* (principle). The truly morally worthy action seamlessly integrates both: we see the need *as* a call of duty, and the duty *is* responsiveness to the need. The distinction helps us analyze whether the duty is genuinely *informing perception* or just an afterthought/abstract command."
      *   **Intercept Misconception 2 (Guilt/Obligation):** (During Q&A here) If someone mentions guilt/obligation: "Feeling obligated or avoiding guilt *might* accompany principle-direction, but the core is *what* the reason is: 'I must follow the rule' vs. 'Her need requires help'. The feeling isn't the reason."

  6.  **Contrast & Intercept "Mechanical Rule-Following" (3 min)**
      *   **Pose a Counter-Example:** "Imagine Ben sees Mrs. Chen. He thinks: 'Maxim: Help the elderly. Universal Law? Seems okay. Therefore, I shall help.' He helps mechanically. Did Ben act *from duty*? Does his action have moral worth?"
      *   **Discuss:** Likely consensus: Yes (duty motivated), but feels "off," "cold," "not as good" as Anna's potential object-directed version.
      *   **Intercept Misconception 3 (Mechanical):** "Ben's action *might* have moral worth (Kant is debated here!), but it highlights the *risk* of *pure* principle-direction: it can become detached, mechanical calculation. This contrasts with Anna potentially being *immediately moved by Mrs. Chen's plight itself*, which feels more responsive and engaged. Kant likely wants the principle to *structure how we perceive the object*, not replace it with a calculation. The *right reason* isn't just ticking the 'duty' box mechanically; it's the concrete situation *appearing as* a duty."
      *   **Why:** Shows the distinction isn't arbitrary; pure principle-direction risks losing the connection to the concrete moral reality duty is supposed to govern.

  7.  **Diagnostic Question & Wrap-up (2 min)**
      *   **Diagnostic Question:** "Suppose Anna helped Mrs. Chen *from duty*, but primarily motivated by the abstract principle ('Helping is my duty'). Now, imagine she instead helped because she was *immediately struck by how exhausted and unsteady Mrs. Chen looked on those icy steps* (still from duty!). **What changes in the *structure* of Anna's practical reasoning in that moment?**"
      *   **What it Tests:** Forces them to describe the shift in focus (from abstract rule to concrete features) *without* using the labels "object-directed" or "principle-directed." They must articulate the change in *what her mind is attending to* as the motivating factor. Success = describing the shift in focus of reasons, not just feelings or the action.
      *   **Wrap-up:** "Today we dug deeper into *how* duty motivates. Moral worth requires acting *from duty*, but that duty can function by focusing your mind directly on the concrete moral reality (object-directed) or on the abstract rule itself (principle-directed). Kant's ideal likely integrates both: seeing the need *as* the call of duty."
      *   **Explicit Exclusions:** "We're leaving aside *big* adjacent questions for now: **1) Does Anna need to *consciously think* 'this is my duty' for it to be the right reason?** (Maybe not!). **2) Does moral worth require *explicit moral knowledge* of Kant's theory?** (Definitely not!). We're focusing purely on the *structure* of reasoning in the moment."

  **Why the Dependency Order Matters:**

  1.  **Kant Review (Step 1):** Non-negotiable starting point. Without "acting from duty" as the requirement for moral worth, the subsequent structural question lacks its Kantian context and necessity.
  2.  **Concrete Case (Step 2):** Provides shared, relatable material to analyze. Establishes duty *is* present before dissecting *how*.
  3.  **Probing "How" (Step 3):** This is the crucial pivot. By asking *how* duty functioned mentally, you *naturally elicit* the distinction students will recognize in their own proposed thoughts. The distinction emerges *from them*, making it feel necessary, not arbitrary.
  4.  **Labelling & Clarifying (Step 4):** *After* the distinction emerges from their ideas, providing labels and clarifying the core structural difference (concrete object vs. abstract principle) crystallizes it. Intercepting "warm feelings" here prevents a common misreading.
  5.  **Why it Matters (Step 5):** *Now* that they grasp the distinction, explaining *why* Kant might care (connection to universality vs. responsiveness) gives it philosophical weight and necessity within his system.
  6.  **Contrasting Mechanical Case (Step 6):** Reinforces the distinction by showing the potential pitfall of *pure* principle-direction (mechanics), highlighting why the ideal likely involves object-direction (responsiveness), making the distinction vital for understanding worth *fully*. Intercepts "mechanical rule-following."
  7.  **Diagnostic & Wrap-up (Step 7):** Assesses if they grasp the structural shift *behind* the labels and explicitly flags off-limits complexities to prevent confusion.

  **Key Teaching Moves:**

  *   **Elicit, Don't Lecture:** Get *their* ideas for Anna's thoughts first (Step 3).
  *   **Use Their Language:** Build the labels from the clusters *they* generate.
  *   **Emphasize "Structure," "Focus," "Reasoning":** Constantly tie discussion back to the architecture of practical thought.
  *   **Contrast is Key:** Use Ben's case to make the distinction stark and show its importance.
  *   **Name the Misconceptions Explicitly:** When intercepting, state the error clearly ("It's not about warm feelings...").
  *   **Manage Time Strictly:** Stick to the timings; Steps 3 and 4 are the core investment. Be ready to adapt if Step 3 takes longer than expected. Good luck!
