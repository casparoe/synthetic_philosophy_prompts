prompt: |-
  I'm currently taking an upper-division course on moral psychology and normative ethics, and for our peer-teaching session next week I have to guide a group of first-year philosophy students through the concept of moral worth and what it means to act for the right reasons. We've spent the past few lectures on the classic Kantian framework—acting from duty versus acting merely in accordance with it—but I want to move one layer deeper without losing them, by introducing the structural distinction between object-directed motivation (being moved by the concrete moral features of a situation itself) and principle-directed motivation (being moved by an abstract representation of one's duty). I need a teaching plan rather than a lecture script: the precise sequence in which these components must be introduced so that the distinction feels conceptually necessary rather than arbitrary, and why that dependency order matters.

  For the carrying example, I want a single concrete scenario—preferably not a familiar textbook case like the honest shopkeeper—that can hold both kinds of motivation in tension and make their difference visible without relying on specialized vocabulary. I also need a map of the misconceptions this audience will predictably form—such as equating "right reasons" with emotional warmth, with feeling guilty, or with mechanically following a rule—and the exact point in the sequence where each should be intercepted before it hardens. Please include one diagnostic question I can pose at the end to determine whether they've grasped the structural point about practical reasoning rather than just memorized the labels, and an explicit note on which adjacent debates—perhaps the relation between moral worth and explicit moral knowledge, or whether right reasons must be conscious—to openly leave out at this level and say so. The students have only read a standard introductory ethics text, and I have roughly forty minutes.
