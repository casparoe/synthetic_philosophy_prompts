  Here’s a sharp research proposal draft tailored to your specifications, focusing on conceptual framing while avoiding rehashing physical ontology:

  ---

  **Research Proposal: Metaontological Deflationism and the Challenge of Institutional Kinds**  

  **Core Question:**  
  Does metaontological deflationism (e.g., Chalmers, Hirsch) collapse or require substantive revision when applied to disputes about *institutional kinds* (e.g., borders, prisons, currencies), given that such disputes are entangled with practical/political stakes that render the "merely verbal" designation self-undermining?  

  **Problem Statement & Gap:**  
  Metaontological deflationism argues that many ontological disputes (e.g., about numbers, mereological sums) are verbal—resolvable by semantic negotiation without deep metaphysical implications. However, this framework primarily targets *abstracta* or *physical composites*, neglecting *institutional kinds* whose existence is constitutively dependent on collective attitudes, norms, and practices. Institutional disputes (e.g., "Is a privately run facility *really* a prison?") carry unavoidable practical stakes: legal consequences, moral responsibilities, and political mobilization. Declaring such disputes "verbal" risks trivializing actions grounded in contested categorizations, creating tension: if deflationism treats institutional disputes as verbal, but agents *act* on the presumption of substantive disagreement, does deflationism undermine its own applicability? Existing literature fails to address whether the verbal/substantive distinction can hold where ontology is *practically enacted*.  

  **Methodology (10-12 Weeks):**  
  1. **Week 1–3: Theoretical Groundwork**  
     - Reconstruct deflationist criteria for verbal disputes (e.g., symmetry, non-concealment, semantic plasticity).  
     - Analyze how institutional kinds (Searle, Epstein) challenge these criteria: their ontology is *performative* (beliefs/actions sustain them) and *stake-laden* (categorizations trigger material effects).  
  2. **Week 4–8: Case Study Analysis**  
     - **Case 1 (High Stakes):** "Prison" ontology. Debate: Does private management alter the institutional kind "prison"? Track practical stakes: labor rights, accountability frameworks, prisoner treatment.  
     - **Case 2 (Variable Stakes):** "Border" ontology. Debate: Does a legally defined but unenforced border exist? Analyze contexts (e.g., symbolic vs. militarized borders) where stakes shift.  
     - *Focus:* Does applying deflationist tools resolve the dispute? Do practical stakes persist *despite* semantic clarification?  
  3. **Week 9–12: Metaontological Coherence Test**  
     - Assess whether deflationism can consistently classify institutional disputes as verbal without:  
       (a) Ignoring how its own "verbal" designation becomes a contested social fact (e.g., activists reject "just semantic" framing),  
       (b) Collapsing into a substantive claim about social reality’s indeterminacy.  
     - Develop criteria for distinguishing *genuinely verbal* institutional disputes (e.g., "Is this plaza *really* a town square?") from *inescapably substantive* ones.  

  **Success vs. Failure Conditions:**  
  - **Useful Result:** A defensible criterion for when institutional disputes transcend verbal status due to *practical entanglement* (e.g., when categorization alters power relations/moral obligations). Shows deflationism must either (i) restrict its scope to non-institutional ontology, or (ii) incorporate pragmatic stakes into its "substantive" threshold.  
  - **Failure:** Merely observing that stakes exist without a principled distinction, or concluding all institutional disputes are substantive (abandoning deflationism).  

  **Scope Management:**  
  - Focus on *one* deflationist framework (e.g., Chalmers) applied to *two* institutional kinds.  
  - Exhaustive social ontology surveys are out of scope; leverage seminal institutional theory + deflationist texts.  
  - **Deliverable:** A 25–30 page paper proposing a revised deflationist threshold for institutional disputes.  

  **Why This Isn’t "Ontology of Numbers Redux":**  
  Unlike abstracta, institutional kinds are *causally entangled with human practices*: their existence depends on recognition, and misrecognition has material consequences. This binds ontology to politics in ways that challenge deflationism’s semantic insulation.  

  ---

  **Key Strengths of this Framing:**  
  - **Novelty:** Targets the *practical self-undermining* of deflationism in social contexts.  
  - **Precision:** Uses institutional kinds to pressure-test the verbal/substantive boundary.  
  - **Feasibility:** Case studies anchor theory in tractable examples; 3-month timeline is realistic.  
  - **Stakes-Centric:** Politics aren’t an add-on—they’re the *engine* of the critique.  

  Let me know if you’d like tweaks to emphasize specific angles (e.g., Hirsch vs. Chalmers, or a different case study)!
