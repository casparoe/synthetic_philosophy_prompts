answer: |-
  ### MA Philosophy/Politics Seminar: Ethics of Persuasion  
  **90-Minute Closed-Book Examination Question**  

  > **Critically evaluate the claim that transparency is sufficient to distinguish morally permissible persuasion from manipulative behaviour in contexts of deliberative substitution. Develop your argument using a concrete case study (e.g., political campaigning, therapeutic advice, or algorithmic recommendation systems), and assess whether reason-amplification avoids ethical pitfalls that deliberative substitution cannot.  
  > *[Deliberative substitution: A speaker supplants the listener’s practical reasoning with their own, even if premises are disclosed. Reason-amplification: A speaker strengthens premises already accepted by the listener.]***  

  ---

  ### Model Answer (Exemplar)  
  **Thesis**: Transparency alone cannot morally salvage deliberative substitution because it violates agential integrity, even when reason-amplification might preserve it. This is clearest in political deep-canvassing, where "honest" substitution risks treating citizens as passive vessels.  

  **Case Analysis**: Consider a political campaigner who says: *"I know you value healthcare access (your premise), but your reasoning overlooks systemic bias. Let me reconstruct your position: you should support Policy X because it corrects historical inequities (my reasoning)."* Though transparent, the campaigner replaces the voter’s reasoning (e.g., "Healthcare is a human right") with their own ("Healthcare as reparative justice"). The voter’s endorsement becomes parasitic on external reasoning, undermining their capacity for reflective revision. Reason-amplification, conversely, expands the voter’s existing framework (e.g., clarifying how Policy X protects human rights) without hijacking their justificatory architecture.  

  **Why Transparency Fails**: Substitution commodifies reasoning, reducing the listener to validating pre-packaged logic. Transparency here merely reveals the substitution—it does not mitigate the *displacement* of agential deliberation. In therapeutic contexts, a counsellor substituting a client’s self-diagnosis with a "correct" framework (even honestly) risks epistemic domination, whereas amplifying the client’s latent insights fosters autonomy.  

  **Key Counter-Example Vulnerability**: **If a listener *invites* substitution** (e.g., "Explain this to me as you would to a child"), the voluntariness may neutralise the integrity violation. My argument collapses if substitution is shown to enhance autonomy when solicited, as in pedagogical or mentorship relationships. Here, transparency + consent may suffice.  

  **Conclusion**: Substitution intrinsically objectifies by treating the listener’s reasoning as fungible. Reason-amplification avoids this by scaffolding, not replacing, agential capacities. Transparency is necessary but insufficient—the *form* of influence matters.  

  ---

  ### Marking Scheme (20 Marks Total)  
  Candidates must hit all five core criteria below. Marks deducted for omissions/missteps as noted.  

  | **Criterion**                                                                 | **Marks** | **Common Pitfalls**                                  |  
  |-------------------------------------------------------------------------------|-----------|------------------------------------------------------|  
  | **1. Distinguishes substitution from amplification** (Defines using core features: *supplanting* vs. *scaffolding* reasoning) | /4 | Conflating substitution with mere premise-omission; treating amplification as "weak persuasion". |  
  | **2. Interrogates transparency** (Analyses why disclosure alone fails to resolve ethical issues in substitution) | /4 | Asserting "transparency = anti-manipulation" without addressing *how* substitution persists; ignoring the listener’s role in reasoning. |  
  | **3. Applies framework to concrete case** (Uses one detailed example; shows *how* substitution/amplification operates) | /4 | Generic definitions without case integration; superficial treatment (e.g., "Campaigners manipulate"). |  
  | **4. Evaluates agential integrity** (Argues why substitution threatens autonomy/self-governance even when transparent) | /4 | Reducing ethics to outcomes (e.g., "Good results justify substitution"); overlooking the process of reasoning-ownership. |  
  | **5. Engages a counter-example** (Tests limits of their argument; e.g., invited substitution, emergencies) | /4 | Ignoring counter-arguments; treating substitution as universally impermissible. |  

  **Failures typically occur where**:  
  - (C1) Students describe "hiding reasons" as substitution.  
  - (C2) Transparency is presented as a panacea without scrutiny.  
  - (C3) Cases are name-dropped but not analytically deployed.  
  - (C4) Autonomy is conflated with consent or preference-satisfaction.  
  - (C5) Counter-examples are absent or tokenistic.  

  \answer{20 marks, MA level, deliberative substitution crux}
