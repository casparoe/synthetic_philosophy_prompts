  Write an essay weighing whether the doomsday argument still holds up if you combine self-indication with this growth-weighted reference class. Dont just recap Carter or Leslie — actually work out whether the argument collapses, shifts, or stays strong. Reach a firm conclusion: is this still a reason to think humanity wont make it very far, or does the tweak break it? And deal honestly with the best counter, which is probably that we're just fiddling with priors to avoid an ugly result. No fence-sitting at the end.
