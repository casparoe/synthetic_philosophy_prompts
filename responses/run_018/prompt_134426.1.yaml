answer: |-
  1.  **First Move (Dissociative Amnesia):** You were right. Dennett's center is defined by the *coherent narrative self-model* generated; if two entirely disconnected, self-contained autobiographical narratives exist without integration, they represent two distinct theoretical posits ("centers"), even within one body. *Mind-changer:* Evidence showing such distinct narratives *must* functionally integrate at a subconscious level Dennett would recognize as a single narrator.
  2.  **Second Move (Sherlock Holmes Problem):** Your roommate was right about the absurdity, but **you were right on the rebuttal**. Dennett explicitly requires the narrative to be generated *by and for* an embodied agent within its "biography"; Holmes lacks this embodied first-person perspective and agency, making him a third-person construct, not a center of narrative gravity. *Mind-changer:* If Dennett explicitly stated that *any* coherent narrative, regardless of origin (like a fictional character created by an author), constituted a center of narrative gravity.
  3.  **Third Move (Counterfactual Anchoring):** Your roommate was right. Your point about counterfactual narratives (future possibilities) actually supports the *flexibility and persistence* of a single center; the hypotheticals are generated *by the same agent* as part of its ongoing self-conception, reinforcing one center, not creating multiple ones. *Mind-changer:* Evidence that distinct dissociative identities generate mutually exclusive, non-overlapping future counterfactuals *without any shared narrative elements or goals*.
  4.  **Overall Claim (Two Centers in One Skull):** You were more right *based on the amnesia scenario*. If the dissociative states produce truly separate, unintegrated self-narratives with their own protagonist sense (like distinct DID alters), Dennett's framework suggests multiple narrative centers. *Mind-changer:* Clear evidence that even in severe dissociation, a single, underlying, unified "narrator" process generates *all* alters/stories as characters within one master narrative.
  5.  **Embodied Agency Importance:** You were right that embodied agency is crucial for Dennett. The center arises from the narrative spun *by the biological system* about itself *to* itself for strategic interaction; remove the embodied agent (like Holmes), and you remove the necessary anchor. *Mind-changer:* If Dennett explicitly revised his theory, stating that the narrative structure alone, independent of its generation *by* an embodied agent for that agent, defines the center.
