  ## Counterpoint for Humphrey

  He woke from that first cry, one vital source,
  His cells configured on their destined course.
  **A man who wins elsewhere is not our man,**
  **But bears his might through likeness and shared source.**

  The same sky nursed two saplings in their prime;
  One sought the crowd, one shunned the public trace.
  That other, forged by fortune, place, and time,
  Acquired a different weight, a foreign grace.
  **A man who wins elsewhere is not our man,**
  **But bears his might through likeness and shared source.**

  Here, history unfolded, sharp and stark:
  The podium stood empty, dark, immense.
  There, charm became a weapon in the dark,
  He grasped the prize through some divergence.
  **A man who wins elsewhere is not our man,**
  **But bears his might through likeness and shared source.**

  Not bone, nor birthmark, made the victor there,
  But choices branching from some distant trace –
  A speech refined, an absence of despair,
  A rival faltering in time and place.
  **A man who wins elsewhere is not our man,**
  **But bears his might through likeness and shared source.**

  The winner there, though rooted in his name,
  Is shaped by winds that blew on foreign ground.
  His triumph wears a derivative claim,
  While *here*, the loss is palpable, profound.
  **A man who wins elsewhere is not our man,**
  **But bears his might through likeness and shared source.**

  **It's *he* who could have won, to praise a face**
  **Resembling his confuses what is true.**
  **A man who wins elsewhere is not our man,**
  **It's *he* who could have won, to praise a face**
  **Resembling his confuses what is true.**

  ---

  **Notes on Structure & Philosophy:**

  *   **Form:** Strict villanelle: 5 tercets (ABA rhyme) + final quatrain (ABAA). Refrain A1 (lines 1,6,12,18) states Lewis's counterpart view. Refrain A2 (lines 3,9,15,19) states Kripke's objection. Only two rhymes: A (source/course/man/trace/grace/immense/divergence/there/place/claim/ground/true/face) & B (prime/time/stark/dark/name).
  *   **Philosophy:**
      *   **A1 (Lewis):** Emphasizes "likeness and shared source" as the basis for counterpart relations and derivative modal properties ("bears his might"). Avoids "copy," focusing on resemblance and origin.
      *   **A2 (Kripke):** Insists on literal transworld identity ("*he* who could have won") and rejects praising a mere resemblance as confusing the subject ("confuses what is true").
      *   **Tercets:** Build the branching:
          *   Tercet 1: Essential shared origin ("vital source," "destined course").
          *   Tercet 2: Accidental divergence ("sought the crowd/shunned the public trace," "fortune, place, and time").
          *   Tercet 3: The nomination split ("podium stood empty" vs. "grasped the prize").
          *   Tercet 4: Underscores divergence is accidental ("Not bone, nor birthmark," "choices branching") and contingent ("distant trace," "time and place").
          *   Tercet 5: Contrasts derivative claim ("derivative claim") with actual loss ("palpable, profound"), highlighting the tension for Lewis.
      *   **Final Quatrain:** Presents the irreconcilable core claims side-by-side without resolution. The inherent conflict between literal identity and counterpart-based modality remains stark.
  *   **Accessibility:** The philosophical conflict ("Is it *him* over there, or just someone like him?") drives the poem without needing names (Kripke, Lewis, Humphrey) or jargon. The scenario (political alternative history) is concrete.
