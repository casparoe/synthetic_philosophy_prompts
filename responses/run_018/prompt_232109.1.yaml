prompt: |-
  You're an expert on philosophy of mind, dynamical systems, and Dennett-ish thought experiments, and also a really good discussion leader. Think carefully and start by brainstorming two or three possible activity designs before committing to one.

  I'm teaching an upper-level undergrad seminar in philosophy of mind and cognitive science: about 20 students, one 75-minute session. I want a runnable in-class activity that makes them feel the careenium problem in their bodies before I name it. The question is whether the big visible patterns (the "symbols") are just made of the little rule-following units (the "simmballs"), or whether those symbols can genuinely push the units around — something like top-down causation at the level of real patterns.

  I dont want a lecture up front, and I dont want them to hear "careenium" or "real patterns" until the debrief. Ideally the rules should be local and dumb at the individual level — each student is one simmball, only reacting to immediate neighbors — but the group should end up producing, and then having to protect or propagate, a recognizable macro-pattern (a glider, a letter, an arrow, whatever you think works best). Then a second phase where the pattern seems to be calling the shots: e.g., a task that can only be completed by keeping the pattern intact, so each student has to bend their local rule to serve the pattern becuase the pattern needs them to. The shift from "we made that pattern" to "that pattern is now bossing us around" is the exact feeling I want them to hit.

  Please give me:
  - a materials list that works in an ordinary classroom (no coding, and no real money as payoff);
  - precise rules for individual students, including the local update rule;
  - a timeline for the 75 minutes;
  - the exact moment and wording for the phase change;
  - a small scoring scheme so there are real-ish stakes (points or group score) without real money;
  - a debrief that maps what happened onto the careenium/simmballs idea and the "do symbols push the substrate around?" question;
  - what will predictably go wrong the first few times I run it (students deliberately breaking rules, the pattern dying, the group falling back into global planning, etc.) and how to handle each one; and
  - an honest note about which feature of the actual careenium problem the activity cannot reproduce and what I'll need to supply in discussion afterwards.

  Keep it doable by actual undergrads who've never seen a cellular automaton — I'd rather have too few rules than too many.
