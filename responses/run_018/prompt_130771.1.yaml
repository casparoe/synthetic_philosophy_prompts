prompt: |-
  I'm currently taking a graduate seminar on the philosophy of international law and the ethics of historical memory, and I serve on our university museum's Exhibition Review Board. We are finalizing a permanent gallery on state violence in the twentieth century and must vote by Thursday on whether to approve the curators' proposed signage, catalog text, and educational framing for one specific display.

  The display documents a well-archived campaign in which a state systematically dissolved a group's autonomous political institutions, banned its language in education and public administration, forcibly relocated large portions of its population, and carried out targeted killings of leaders and intellectuals over roughly a decade. The board's legal advisers note that under the 1948 UN Convention the targeted group does not clearly fall within the four protected categories in a manner that establishes specific intent to destroy it physically, whether entirely or partially, since the documented primary intent was political assimilation and cultural erasure, though lethal violence was used instrumentally. The curators, invoking Raphael Lemkin's original 1944 formulation—including the cultural and political dimensions he treated as central—argue that genocide applies descriptively and morally regardless of whether a strict legal prosecution would succeed. Descendant-community representatives have urged adoption of the term precisely because legal narrowness, they argue, reproduces the historical erasure the gallery seeks to document. Some board members have proposed a dual-label framework: using genocide in the display but pairing it with an explicit definitional note that distinguishes the broader historical-moral conception from the narrower Convention category. Others worry that such a framework collapses an important distinction and misleads visitors into treating a moral judgment as an established legal finding.

  Please draft the short written opinion I will circulate before Thursday's meeting. It should lead with a concrete recommendation—approve the curators' label outright, reject it for a specified alternative, or approve it only with the dual-label conditions and a defined review timeline—and then provide the reasoning, with no preamble and no restatement of this request. The reasoning should treat the strongest consideration on the losing side with genuine seriousness: either the risk that museums conflate moral categories with legal ones and thereby weaken institutional credibility, or the risk that strict legalism commits an epistemic injustice by rendering invisible forms of group destruction that fall outside the Convention's scope. Please also specify whether the museum should include an explicit definitional note in the display itself, and address what should happen if future scholarship revises the archival interpretation of intent. Do not include bibliographies, reading lists, or citations; the argument should stand entirely on its conceptual structure.
reasoning: |-
  Okay, the user is in a graduate seminar on philosophy of international law and ethics of historical memory and serves on a university museum's Exhibition Review Board. They need to draft a written opinion for an upcoming vote about labeling a display on state violence. The key issue is whether to use the term "genocide" for a historical event that fits Lemkin's broader definition but not the strict UN Convention criteria. 

  The user outlined the dilemma: curators and descendant communities advocate for "genocide" based on moral and historical grounds, while legal advisors note it doesn't meet the Convention's specific intent requirement for physical destruction. Some board members propose a dual-label approach, but others worry it blurs legal and moral distinctions. The user needs a concise recommendation with reasoning that seriously considers both sides—institutional credibility versus epistemic injustice.

  Hmm, the user's academic background suggests they value nuanced philosophical arguments. Their role on the board implies practical decision-making under time pressure. The mention of descendant communities' views indicates ethical stakes beyond academia. The museum's educational mission seems central—they're not a court but an institution shaping public memory. 

  The strongest tension is between two risks: weakening credibility by conflating categories (if using "genocide" loosely) versus perpetuating erasure by adhering strictly to legal definitions (if avoiding the term). The descendant communities' perspective feels particularly weighty here—their argument about legal narrowness reproducing historical erasure cuts deep. 

  I'm leaning toward recommending the dual-label solution. It acknowledges both truths: the event meets Lemkin's original conception of cultural/political destruction, while the Convention has narrower criteria. The key is framing it not as compromise but as educational clarity. The definitional note must be prominent though—not a footnote but part of the display's pedagogical framing. 

  For future scholarship, the museum should commit to reviewing labels if new evidence emerges about intent. This shows intellectual humility without requiring constant changes. The recommendation should stress that museums have a duty to confront uncomfortable historical truths that legal frameworks might obscure. 

  The tone must be decisive yet respectful—this is a polarized debate. I'll structure it as: 1) concrete recommendation upfront, 2) reasoning weighing both risks seriously, 3) specifics about the definitional note, 4) protocol for future revisions. No citations; pure conceptual argument.
answer: |-
  **RECOMMENDATION:** Approve the curators' proposed use of the term "genocide" **only** with the dual-label framework: include the term prominently within the display narrative, accompanied by an **explicit, concise definitional note** physically adjacent to its first prominent use. This note must clearly distinguish the broader historical-moral conception (rooted in Lemkin's 1944 framework encompassing cultural and political destruction) from the narrower UN Genocide Convention definition (requiring specific intent to physically destroy the group). Commit to reviewing this terminology and framing every five years, or sooner if significant new scholarship on intent emerges. Reject the proposals to use the term outright without qualification or to avoid it entirely.

  **REASONING:** The core educational mission of this gallery demands confronting the profound, systematic nature of the documented violence aimed at the dissolution of a group’s existence as a distinct political and cultural entity. Descendant-community representatives powerfully argue that rigid adherence to the Convention's current legal threshold risks replicating the very erasure the display seeks to combat. Lemkin’s original conception, which explicitly included targeting a group’s political institutions and cultural foundations as integral to genocide, provides a vital historical and moral framework that captures the essence of this campaign more fully than any alternative term ("crimes against humanity," "ethnic cleansing") alone. Refusing the term based solely on the absence of proven *Convention-specific* genocidal intent risks committing a profound epistemic injustice by silencing a legitimate, historically grounded perspective on group destruction and denying visitors language that resonates with the victims' experience and scholarly interpretations beyond strict law.

  **However, the strongest counter-consideration demands serious respect:** Museums wield significant authority, and conflating established legal categories with broader moral or historical assertions can indeed undermine institutional credibility and confuse visitors. Presenting "genocide" as an uncontested legal fact here, when legal advisors explicitly state the evidence falls short of the Convention's *specific intent* threshold for prosecution, could mislead the public into believing a legal determination has been made where it has not. This risks eroding trust in the museum's commitment to rigorous, dispassionate presentation and could inadvertently diminish the gravity of crimes legally established as genocide elsewhere.

  **The dual-label framework directly addresses both imperatives.** Using the term "genocide" within the narrative acknowledges its profound descriptive and moral weight in this context, fulfilling the educational mission and responding to the descendant communities' plea against erasure. **The adjacent definitional note is non-negotiable and must appear within the display itself** (e.g., a clearly formatted text panel or integrated label text), not relegated to a catalog footnote. This note transparently educates visitors about the critical distinction: the display employs the term based on its broader conceptual origins and the nature of the documented atrocities (cultural/political destruction), while explicitly acknowledging the UN Convention's narrower legal definition and its specific intent requirement, which legal advisors find unmet by the current evidence. This promotes critical engagement rather than passive acceptance, turning the terminological complexity into an educational opportunity about the evolution of concepts, the limitations of legal frameworks, and the contested nature of historical interpretation. It safeguards credibility through radical transparency about the basis for the term's use.

  **Regarding future scholarship:** The five-year review commitment (or trigger based on significant new evidence) is essential. If future archival work compellingly demonstrates a specific intent meeting the Convention threshold, the definitional note could be modified or removed. Conversely, if scholarship conclusively refutes any genocidal intent even under Lemkin's framework, the terminology must be revised. This ensures the display remains grounded in the best available evidence while acknowledging historiography evolves. The museum's duty is to present the current scholarly and moral understanding with clarity and integrity, not to freeze interpretation. The dual-label framework provides the necessary structure for this ongoing responsibility.
