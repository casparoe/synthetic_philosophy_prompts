prompt: |-
  I'm a clinician-ethicist serving on an institutional review board that reviews adaptive clinical-trial protocols, and I need a reusable decision procedure for evaluating whether a consent process remains valid in studies where treatment recommendations and risk profiles update in real time—driven, for example, by predictive algorithms that revise probabilities weekly. The procedure should operationalize three philosophical distinctions I actually care about: deception that goes beyond explicit lying to include selective framing of evolving uncertainty; coercion that includes not only direct threats but structural pressure tied to continued access to care; and competence that is domain-specific—understanding not just that risks exist, but how probabilistic updating works—rather than a generic mental-capacity check. I run these reviews alone, with about twenty minutes per protocol, and I must render one of three judgments—valid, invalid, or valid only with conditions—while clearly marking the points where the question is one of values rather than facts and the procedure must hand off to human judgment. Please construct an ordered checklist: the questions to ask in sequence, what counts as a sufficient answer to each, where a negative answer stops the procedure with "invalid," and where it proceeds to a conditional approval; keep the distinctions that actually matter philosophically but drop those that can't survive a twenty-minute review; and be explicit about where the procedure will misfire or depend on judgment calls dressed up as steps. Then apply it to three protocols: first, a cancer-monitoring study in which patients consent to "adaptive risk tracking" without access to the model's feature weights or update logic; second, a trial offering free post-study specialty care contingent on enrollment and retention; and third, a case where the protocol is technically transparent—full disclosure of probabilities, no access conditions, adequate cognitive screening—yet frames risks using relative rather than absolute metrics in a way that exploits well-documented cognitive biases, so that the procedure likely returns "valid" despite my intuition that something is wrong. For each case, show the path through the checklist and the final judgment; and conclude by stating what the procedure genuinely cannot settle, particularly where transparency and non-coercion are satisfied but the moral quality of the framing remains disputed.
reasoning: |-
  We are constructing a decision procedure checklist for evaluating the validity of consent processes in adaptive clinical trials. The checklist operationalizes three key philosophical distinctions:

  1. **Deception**: Beyond explicit lying, includes selective framing of evolving uncertainty.
  2. **Coercion**: Beyond direct threats, includes structural pressure tied to continued access to care.
  3. **Competence**: Domain-specific, requiring understanding of how probabilistic updating works (not just generic mental capacity).

  The procedure must be executable in about 20 minutes per protocol and yield one of three judgments: valid, invalid, or valid only with conditions.

  The checklist will have ordered questions. For each question, we specify:
  - What counts as a sufficient answer?
  - If the answer is negative, does it stop with "invalid" or proceed to conditional approval?
  - We also note where the question is about values (requiring human judgment) and where the procedure might misfire.

  **Checklist Design:**

  1. **Competence Assessment:**
     - *Question 1: Does the consent process include domain-specific education about the adaptive nature of the trial, including how probabilities update and what that means for the participant?*
       - Sufficient answer: Explicit materials that explain the updating mechanism (e.g., using simple analogies, diagrams, or examples) and the implications of changing risks/benefits. Must not just state that updates occur but explain the process in an understandable way.
       - Negative answer: If absent, then "invalid" because competence cannot be established without this. (Stop: Invalid)
     - *Question 2: Does the protocol require and document an assessment of the participant's understanding of the adaptive process (e.g., through teach-back or quiz) before consent?*
       - Sufficient answer: The protocol must require and describe a method to assess understanding of the adaptive element (specifically, the updating process) and document that understanding. The assessment must cover the key concepts of change in risk/benefit over time and the reasons for change (algorithmic updating).
       - Negative answer: If absent, then "invalid". (Stop: Invalid)

  2. **Coercion Assessment:**
     - *Question 3: Is there any explicit or implicit contingency between participation and access to clinical care that would otherwise be available?*
       - Sufficient answer: The consent materials and protocol must not tie access to routine clinical care (standard of care) to participation. Also, any incentives (like free care) must be clearly separated from the provision of standard care and must not create a situation where a patient would feel compelled to participate to avoid losing access.
       - Negative answer: If there is a structural pressure (e.g., continuation of care is contingent on participation, or post-study care is contingent on retention), then we move to conditional approval. We cannot approve without conditions because this is coercive. (Proceed to conditional approval: Condition of removing the contingency or providing alternative arrangements for care access without participation.)
     - *Question 4: Are there undue incentives that create structural pressure?*
       - This question is only triggered if Question 3 is negative (i.e., there is a contingency). If so, we must determine if the incentive is so large as to be coercive. However, in the interest of time, we note that any contingency between care and participation is inherently problematic. Therefore, the condition for approval would be the removal of such contingency.

  3. **Deception Assessment:**
     - *Question 5: Does the consent process fully disclose the current state of uncertainty about risks and benefits, including the fact that they will change and the reasons for change?*
       - Sufficient answer: The consent must explicitly state that risks and benefits are uncertain and will be updated. It must also explain the source of the updates (e.g., algorithm) and the factors that might lead to changes (without necessarily disclosing proprietary weights if that is the issue). The key is transparency about the evolving nature and the reasons.
       - Negative answer: If absent, then "invalid". (Stop: Invalid)
     - *Question 6: Does the consent process avoid selective framing that exploits cognitive biases?*
       - This is a values-based judgment. We must look for:
          - Use of relative risks without absolute risks when the absolute risks are very low (thus exaggerating benefits or harms).
          - Framing of risks in a way that emphasizes gains or losses in a manner known to bias perception (e.g., loss aversion).
       - Sufficient answer: The consent materials must present risks and benefits in both absolute and relative terms when relative terms are used, and avoid known biasing frames (e.g., by using neutral language and providing balanced information).
       - Negative answer: This does not immediately lead to "invalid" because it is a matter of degree and context. Instead, we note that this is a values-based issue and proceed to a conditional approval: the condition being to revise the framing to be more balanced and less biased. (Conditional approval: revise the framing.)

  **Final Steps:**

  After running through the checklist, we reach a judgment:
  - If all questions are answered sufficiently, then "valid".
  - If any question leads to a stop with "invalid", then the judgment is "invalid".
  - If we have conditions (from Questions 3, 4, 6), then we require those conditions to be met for approval. We return "valid only with conditions" and specify the conditions.

  **Where the Procedure Might Misfire:**
  - **Question 6 (framing)**: This is inherently subjective. The procedure relies on the reviewer's ability to recognize biasing frames. In 20 minutes, a reviewer might miss subtle framing issues or be overly sensitive. Also, what counts as "balanced" is a value judgment.
  - **Competence assessment (Questions 1 and 2)**: The procedure assumes that the educational materials and assessment are adequate, but without testing them on actual patients, we cannot be sure. This is a limitation of a quick review.
  - **Coercion (Question 3)**: The line between a reasonable incentive and undue influence can be blurry. The procedure uses a bright-line rule: any contingency between care and participation is coercive. But in practice, some might argue that certain incentives are acceptable.

  **Application to Cases:**

  ### Case 1: Cancer-monitoring study
  - **Description**: Patients consent to "adaptive risk tracking" without access to the model's feature weights or update logic.
  - **Checklist Review**:
    1. **Q1**: Does it include domain-specific education? 
       - If the consent explains that the model updates weekly and that the update is based on new data and algorithm recalculations (without revealing proprietary weights) and uses examples, then yes. But if it only says "adaptive" without explaining the updating process, then no. Let's assume they explain the updating process in lay terms without weights. *Sufficient?* **Yes**.
    2. **Q2**: Is there an assessment of understanding? 
       - The protocol must require and document understanding. If not, then invalid. Let's assume they do not have such an assessment. *Answer: No* -> **Stop: Invalid**.
  - **Judgment**: Invalid. (Due to failure of Q2)

  ### Case 2: Trial offering free post-study specialty care contingent on enrollment and retention
  - **Description**: Free post-study specialty care is contingent on enrollment and retention.
  - **Checklist Review**:
    1. **Q1 and Q2**: Assuming they are passed (we'll assume yes for the sake of focusing on coercion).
    2. **Q3**: Is there a contingency? Yes, because free post-study care (which might be essential) is contingent on enrollment and retention. This creates structural pressure. *Answer: No* (not sufficient) -> **Conditional approval**.
    3. **Q4**: The contingency is problematic. The condition for approval would be to remove the contingency or provide the same care without requiring participation.
    4. **Q5 and Q6**: We skip because we already have a condition. But note: we must check Q5 and Q6 if we are to consider a full approval. However, since we are already at conditional, we note that the conditions must address the coercion. We assume Q5 and Q6 are passed.
  - **Judgment**: Valid only with conditions (remove the contingency of free post-study care tied to enrollment and retention).

  ### Case 3: Technically transparent protocol but frames risks using relative metrics
  - **Description**: Full disclosure of probabilities, no access conditions, adequate cognitive screening, but uses relative risk without absolute risk in a way that exploits cognitive biases.
  - **Checklist Review**:
    1. **Q1 and Q2**: Pass (given).
    2. **Q3 and Q4**: Pass (no coercion).
    3. **Q5**: Pass (full disclosure of probabilities and updating).
    4. **Q6**: Does it avoid selective framing? 
       - It uses relative risk without absolute risk, which is a well-known bias. This is insufficient. *Answer: No* -> **Conditional approval** (condition: revise the risk presentation to include absolute risks and use balanced framing).
  - **Judgment**: Valid only with conditions (revise the framing of risks to include absolute metrics and avoid biasing frames).

  **Conclusion: What the procedure cannot settle**

  The procedure is designed to catch clear violations of competence, coercion, and deception. However, it relies on the reviewer's judgment in several places:

  1. **Framing (Q6)**: The procedure flags framing that uses relative risks without absolute risks as requiring conditional approval. But what if the framing is more subtle? The procedure might not catch all forms of manipulative framing. Also, the requirement to present in a balanced way is open to interpretation.

  2. **Competence assessment (Q1 and Q2)**: The procedure requires education and assessment, but the adequacy of these materials is not tested. We rely on the protocol's description. In practice, the materials might be too complex even if they exist, but we don't have time to evaluate that.

  3. **Coercion (Q3)**: The bright-line rule on contingencies with care is clear, but what about other forms of structural pressure (e.g., financial incentives that are very high)? The current procedure does not address non-care-related incentives. We have limited it to care because of the time constraint and the specific concern about access to care.

  4. **Values vs. Facts**: The procedure explicitly marks Q6 as a values-based question. But even in coercion (Q3), the determination of what constitutes "structural pressure" might involve values. The procedure cannot settle the moral quality of the framing when transparency and non-coercion are satisfied but the framing remains disputed. In such cases, the procedure (via Q6) forces a condition for approval, but the condition itself (revising the framing) is a value-laden requirement. The procedure does not resolve the underlying moral disagreement about what counts as "balanced" or "non-deceptive" framing.

  Therefore, the procedure leaves open the possibility that two reviewers might disagree on Q6 (framing) even when the facts are clear. This is an inherent limitation. The procedure ensures that such disagreements are at least flagged and require human judgment (by making it a condition for approval, which then requires the protocol team to revise and resubmit).
answer: |-
  ### Decision Procedure Checklist for Adaptive Trial Consent Validity

  **Philosophical Anchors**  
  - **Deception**: Includes selective framing that obscures evolving uncertainty (not just lies).  
  - **Coercion**: Includes structural pressure (e.g., care access tied to participation).  
  - **Competence**: Requires domain-specific understanding of probabilistic updating (not generic cognition).  

  **Procedure Rules**  
  - **Time**: 20 minutes per protocol.  
  - **Outputs**:  
    - **Valid**: No critical flaws.  
    - **Invalid**: Unfixable deception, coercion, or incompetence; stops review.  
    - **Valid only with conditions**: Fixable issues (e.g., revise documents); proceed to conditional approval.  
  - **Judgment Flags**: Explicitly mark steps where values (not facts) dominate.  

  **Ordered Checklist**  

  | Step | Question                                                                 | Sufficient Answer                                                                 | Negative Answer Consequence                     | Judgment Flag                                |  
  |------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------|------------------------------------------------|---------------------------------------------|  
  | 1    | **Competence - Education**: Does consent explain probabilistic updating in lay terms, including how/why risks change? | Concrete examples of updates, visual aids, non-technical analogies (e.g., "like weather forecasts adjusting"). | **Invalid** (fundamental misunderstanding inevitable). | None (factual: presence/absence of materials). |  
  | 2    | **Competence - Assessment**: Does the protocol test understanding of updating (e.g., via teach-back quizzes)? | Documented method targeting probabilistic logic (e.g., "How might your risk change next week?"). | **Invalid** (no verification of domain-specific comprehension). | None (factual: presence/absence of test). |  
  | 3    | **Coercion - Direct**: Are there explicit threats (e.g., "Care withdrawn if you quit")? | No threats in consent documents or trial design.                                | **Invalid** (explicit coercion is indefensible). | None (factual: explicit terms). |  
  | 4    | **Coercion - Structural**: Does participation affect access to clinical care? | Standard care remains accessible regardless of participation; no free care/medications contingent on enrollment. | **Conditional approval** (requires removing contingency). | **VALUES** (interprets "structural pressure"). |  
  | 5    | **Deception - Transparency**: Are current uncertainties and update mechanisms disclosed? | Clear statement: "Risks may change weekly; updates derive from algorithm analyzing new data." | **Invalid** (hides adaptive nature). | None (factual: disclosure exists). |  
  | 6    | **Deception - Framing**: Are risk/benefit metrics presented neutrally (e.g., absolute + relative risks)? | Absolute risks always included; no cherry-picked stats exploiting biases (e.g., relative risk alone). | **Conditional approval** (requires reframing). | **VALUES** (interprets "manipulative framing"). |  

  **Where the Procedure Misfires**  
  - **Step 4 (Structural Coercion)**: May miss subtle power imbalances (e.g., vulnerable populations).  
  - **Step 6 (Framing)**: Cognitive biases are context-dependent; may flag benign framing or miss sophisticated manipulation.  
  - **General**: Relies on document review—cannot assess real-world comprehension or coercion dynamics.  

  ---

  ### Case Applications  

  #### **Case 1: Cancer-Monitoring Study**  
  *Adaptive risk tracking; no access to model weights/update logic.*  
  - **Step 1 (Education)**:  
    - *Sufficient?* **No**—Consent says "adaptive risk tracking" but lacks examples of how updates work.  
    - *Judgment*: **Invalid** (stops here).  
  - **Final Judgment**: **Invalid**.  
    - *Why*: Fundamental incompetence—patients can’t understand what they’re consenting to.  

  #### **Case 2: Free Post-Study Care Contingent on Enrollment**  
  *Specialty care free only if participants enroll and stay in the trial.*  
  - **Steps 1–3**: Pass (education, assessment, no explicit threats).  
  - **Step 4 (Structural Coercion)**:  
    - *Sufficient?* **No**—Care access is contingent on participation.  
    - *Judgment*: **Conditional approval** (proceeds to end).  
  - **Steps 5–6**: Pass (transparency and framing adequate).  
  - **Final Judgment**: **Valid only with conditions**.  
    - *Conditions*: Remove care contingency; offer care regardless of participation.  

  #### **Case 3: Technically Transparent but Framed with Relative Risk**  
  *Full transparency, no coercion, competence checks—but risks use relative metrics only.*  
  - **Steps 1–5**: Pass (education, assessment, no coercion, transparency).  
  - **Step 6 (Framing)**:  
    - *Sufficient?* **No**—Relative risk exaggerates perceived benefit/harm (e.g., "50% risk reduction" without baseline rates).  
    - *Judgment*: **Conditional approval** (proceeds to end).  
  - **Final Judgment**: **Valid only with conditions**.  
    - *Conditions*: Reframe risks to include absolute metrics (e.g., "reduces risk from 2% to 1%" alongside relative).  
  - *Procedure vs. Intuition*:  
    - Procedure catches framing as a values-based flaw, forcing revision. Without Step 6, it would misfire as "valid."  

  ---

  ### What the Procedure Cannot Settle  
  The procedure **resolves factual gaps** (e.g., missing education) and **flags values disputes** (e.g., coercion, framing) for human judgment. It fails when:  
  1. **Framing is disputed despite transparency**:  
     - If absolute/relative risks are both provided, but the *emphasis* feels manipulative (e.g., highlighting relative benefit in bold), the procedure may approve it—leaving moral qualms unaddressed.  
  2. **Structural coercion is ambiguous**:  
     - E.g., trials in resource-poor settings where standard care is inaccessible outside the study. The procedure flags this but cannot quantify "undue" pressure.  
  3. **Competence is contextually undermined**:  
     - Even with perfect materials, anxiety or cultural barriers may impede understanding. The procedure only checks protocol documents.  

  **Conclusion**: The procedure ensures foundational ethical standards but cannot adjudicate nuanced moral disagreements about *how* information is presented when minimal thresholds are met. It explicitly hands off Steps 4 and 6 to human judgment, acknowledging that coercion and framing require deliberative ethics beyond checklists.
