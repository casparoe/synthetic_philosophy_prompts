  **Crux 1: Is global broadcasting *constitutive* of sentience or merely epistemic?**  
  - **Hypothetical**: *"Mirror Room Module"*: An AI subsystem runs a continuous, recursive self-state simulation (e.g., predicting and updating its own activations). It receives *only* its prior output as input and cannot broadcast data to other modules.  
