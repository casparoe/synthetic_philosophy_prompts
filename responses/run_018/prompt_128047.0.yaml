  hey, so im in this philosophy elective for seniors and we just started ciceros essay about old age (the teacher called it de senectute but my notes say senectute so who knows). theres this passage where he lists four things people complain about when they get old: you cant do your job anymore, your body gets weak, you lose out on physical pleasures, and death is closer. then he tries to argue none of that actually makes life worse if you lived right. the part im stuck on is this metaphor he uses where old people are like captains of a ship who dont row anymore but steer the whole thing with wisdom and experience. he seems to say thats why old age is actually good, because youre freed from physical labor but still in charge.

  but i dont really get how that answers the part about losing pleasures? like if you cant enjoy running around or eating whatever or having fun in the same way, how does being the captain make up for that? also my teacher mentioned something she called "gerontological functionalism" where your value is tied to your social role not your body, and she said cicero is an early version of that, but im not sure if thats actually in the text or just her stretching it. and my friend said cicero is basically saying old people are useless for manual work but useful as managers, which sounds kinda insulting but i cant explain why its wrong. can someone help me understand what the captain metaphor is actually doing in his argument? specifically does it address the pleasure problem or only the work problem? and is there any real connection to this idea that old people keep authority just by surviving longer? sorry for the long message, im just trying to finish this worksheet for tomorrow and im totally lost on this passage.
