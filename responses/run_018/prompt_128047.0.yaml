  The deeper need here might be understanding if Cicero's view is consistent across all four complaints. The user is stuck because the metaphor doesn't cover pleasure loss. They might also be wrestling with whether tying worth to productivity is ethical, especially in modern contexts. Explaining that Cicero separates the complaints and uses different arguments for each could help. For pleasures, he shifts to philosophy and virtue, not the captain analogy. Clarifying this structure might resolve their confusion.

