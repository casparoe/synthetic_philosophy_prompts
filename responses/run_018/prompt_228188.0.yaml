  The user's frustration with past answers is telling. Students were regurgitating definitions instead of grappling with the philosophical tension. This suggests the new question needs to force a dilemma where both answers feel uncomfortable. The triage scenario does this well - is the system "aligned" when it perfectly executes immoral orders?

