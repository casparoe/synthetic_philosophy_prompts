answer: |-
  Here's a joke playing on that specific ethical tension:

  **Two philosophy grad students are arguing late in the library.**

  **First Student:** (Gesturing vaguely) "Look, moral status *has* to be tied to cognitive capacity! It's the only non-arbitrary criterion. Sentience alone is too vague. We need something measurable."

  **Second Student:** (Skeptical) "Measurable? Like what? Brain size? So someone with a bigger head automatically gets more rights? That's absurd!"

  **First Student:** (Smugly) "No, no, you're being simplistic! Not *absolute* cranial capacity! That's meaningless for comparing a mouse to an elephant. We need the *encephalization quotient* – brain size *relative to body size*. *That's* the real measure of cognitive potential."

  **Second Student:** (Leans back, a slow grin spreading) "...Encephalization quotient? Huh. Interesting metric. So, by your own logic..."
  (Pauses for effect)
  **Second Student:** "...does this mean I need to start showing more moral consideration to that bottlenose dolphin at the aquarium... than I do to your newborn niece?"

  **First Student:** (Face falls, staring silently into their cold coffee) "...Pass the existential dread, would you?"

  **Why it works:**

  1.  **Targets the Distinction:** Explicitly contrasts "absolute cranial capacity" (dismissed as absurd) with "encephalization quotient" (presented as the sophisticated, correct measure).
  2.  **Leverages Marginal Cases:** The punchline directly invokes the core tension of the argument: if EQ is the metric for moral status, then highly encephalized non-humans (cetaceans like dolphins) possess cognitive capacities exceeding those of human marginal cases (newborns, severe cognitive impairments).
  3.  **Intelligible Without Research:** The terms "encephalization quotient" and "bottlenose dolphin" are used clearly in context, explaining the core idea (brain size relative to body size = cognitive potential measure). The ethical implication (dolphin > baby) is stark and understandable.
  4.  **Avoids Generic "Big Brain" Humor:** The humor comes entirely from the *specific ethical implication* of choosing EQ as the criterion, not from simply saying "big brain smart."
  5.  **Philosophy Setting:** Places it in a context where such nuanced (and ethically fraught) arguments are commonplace.
  6.  **Punchline Structure:** The second student calmly applies the first student's logic to its uncomfortable conclusion, leaving the first student speechless, confronted by the consequence of their own sophisticated criterion.
