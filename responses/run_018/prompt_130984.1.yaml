prompt: |-
  I'm a software engineer with no formal philosophy background, applying for a six-month interdisciplinary fellowship that supports technical practitioners investigating conceptual design problems in AI systems. I need a polished, two-page research proposal that frames AI paternalism—specifically, when and why an assistant should refuse or override a user request—through the conceptual architecture of safety-critical systems engineering rather than through standard harm-based ethics.

  My half-formed idea is that current debates treat refusal as a uniform category of harm prevention, but engineering practice distinguishes structurally different override logics: fail-safe mechanisms (stopping action to prevent catastrophic downstream states, like a circuit breaker), fail-secure mechanisms (blocking action to preserve system integrity regardless of user authorization, like an access-control gate), and graceful degradation (reducing capability while maintaining core function under violated constraints). I suspect these distinctions reveal that some refusal cases protect the user, some protect third parties, and some protect the assistant's own value-integrity in ways that have no direct physical-world analog—yet ethical literature rarely separates them.

  Please turn this into a precise proposal containing: (1) a determinately stated research question—whether normative boundaries for AI refusal are best modeled as fail-safe, fail-secure, graceful-degradation, or a distinct fourth category, and whether that classification changes the justification required for each refusal type; (2) why existing ethical frameworks leave this open, specifically noting how harm-prevention framing obscures the structural differences above; (3) a month-by-month method that builds a taxonomy of refusal scenarios from current assistant behaviors, maps each to whose interests are protected and what state is being prevented, and tests whether the engineering analogies hold or collapse—particularly in cases where user autonomy conflicts with system-level value preservation without an empirical harm prediction; (4) an explicit statement of what counts as project success (a functional taxonomy with normative implications for refusal design) and what counts as failure (the discovery that the engineering distinctions dissolve when applied to normative reasoning about autonomy, or that the taxonomy requires proprietary system knowledge I cannot access); and (5) an honest scope assessment addressing whether six months is sufficient without empirical access to training logs or internal refusal policies, and what deliverable would still be useful for engineers designing override logic. Do not include a bibliography, citation list, or reading recommendations; I will supply references myself. The tone should be formal and suitable for a committee of both philosophers and systems engineers.
