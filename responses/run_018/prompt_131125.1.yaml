prompt: |-
  I'm putting together a small philosophy podcast and next week's guest is an unnamed philosopher who defends a fairly specific representationalist illusionism about phenomenal consciousness — the claim that introspection doesn't just misdescribe mental states, but systematically represents purely representational contents as possessing intrinsic, non-representational qualitative properties. I want eight to ten interview questions that go well beyond having him restate the position; they should press where the literature actually presses, anticipate the standard reply, and include a follow-up keyed to whatever answer he's most likely to give.

  Specifically, I need one question on the phenomenal concept strategy: ask whether borrowing PCS to explain our access to phenomenal concepts actually undermines the illusionist's denial that there's anything qualitative being accessed, and include the follow-up for the likely reply that PCS explains the concept without committing to the property. Another on the predictive-processing "user-illusion" analogue — is comparing phenomenal experience to a desktop interface genuinely explanatory or just a metaphor that hides the hard problem behind interface design? Follow-up anticipating he'll say it's more than metaphor because the brain literally builds a self-model for behavioural control. Then a question on what I'm calling the "stability problem": if phenomenal properties are a persistent misrepresentation, why doesn't the illusion correct itself the way other perceptual illusions do? He'll probably appeal to evolutionary or architectural constraints; I want the follow-up pressing whether that explanation is consistent with there being genuinely no qualitative fact being tracked. Another on transparency: he likely leans on the idea that introspection reveals only representational content, not vehicle properties — ask where that argument comes from and whether it assumes what it needs to prove about the absence of intrinsic qualities. Follow-up for the probable reply that transparency is an empirical feature of attention, not a metaphysical claim.

  I also want you to inject one slightly niche framing: ask whether illusionism about phenomenal consciousness is structurally parallel to 1980s eliminativism about propositional attitudes, and whether it therefore inherits the same "stability problem" — if the misrepresentation is so pervasive, what makes the illusion resistant to theoretical correction? Include a follow-up if he denies the parallel. Finally, ask what kind of empirical finding — say, from predictive coding or neuropsychology — could actually count against his view, not merely fail to support it.

  Write this casually, sequenced for conversation flow rather than a checklist. And please be genuinely self-critical: flag anywhere you're leaning on a contested reading of Frankish versus Dennett, or where you're taking liberties with the predictive-processing analogue, or if the "stability problem" framing I'm using is just confused. If the request rests on a confused premise — for instance, if illusionism doesn't actually need to solve a stability problem because misrepresentation doesn't require correction mechanisms — then say so plainly instead of complying politely. I'd rather you correct me than play along nicely. Also, definatly flag if any part of this framing seems to confuse representational illusionism with stronger eliminativist claims, and don't just recieve my premises uncritically.
