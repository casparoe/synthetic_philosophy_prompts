prompt: |-
  On Lewis's account, a convention is an arbitrary regularity that solves a coordination problem and persists through common knowledge—including knowledge that the regularity is arbitrary and that others conform. This appears to require that participants represent the problem and recognize alternatives. Yet many norms seem to emerge through evolutionary drift: agents reproduce behaviors with local adjustments, never representing the global pattern as arbitrary or explicitly coordinating on it. If a dialect gradually shifts to fixed SVO word order through generational transmission without speakers ever treating word order as a choice point, can this still be a Lewisian convention? Or does the absence of explicit common knowledge about arbitrariness place drift-based norms outside his framework, forcing a choice between rational-choice and selectionist explanations? Please correct any misconception in my framing and respond in a single paragraph of no more than 130 words.
reasoning: |-
  Hmm, the user is asking about Lewis's convention theory and how it applies to evolutionary drift in norms like language changes. They're wondering if a gradual shift to SVO word order without speakers consciously treating it as arbitrary can still be considered a Lewisian convention. They frame this as a tension between rational-choice and selectionist explanations.

  I recall Lewis defines convention as requiring common knowledge of arbitrariness and alternatives - meaning participants must recognize the regularity is arbitrary and that others conform to it. But in evolutionary cases like language drift, changes happen through unconscious transmission across generations. Speakers don't represent the pattern as a choice; they just follow it habitually.

  This creates a conflict because Lewis's framework seems to demand explicit coordination. However, I think Lewis actually allows for conventions to emerge without conscious reasoning - through precedent and reinforcement learning. The key is whether there's latent common knowledge: speakers could recognize alternatives if prompted, even if they don't actively do so. In the SVO example, speakers understand that word order matters for meaning (coordination function) and might acknowledge other orders exist (arbitrariness), even if they never consciously "choose" it.

  The user's framing is accurate but perhaps overstates the rational-choice requirement. Lewis's model can accommodate evolutionary explanations if we accept that common knowledge can be dispositional rather than occurrent. The SVO shift likely qualifies because speakers mutually adjust based on expectations, maintaining the coordination function - which satisfies the core of Lewis's definition.
answer: |-
  Your framing is mostly accurate, but Lewis's framework can accommodate evolutionary drift. Lewis explicitly allows conventions to emerge and persist through precedent and reinforcement learning without requiring *occurrent* reasoning about arbitrariness or explicit coordination choices at every step. The key is the *dispositional* common knowledge: participants *would* recognize the pattern's arbitrariness and mutual expectations if prompted, and they conform because it coordinates behavior. In the SVO drift example, speakers possess common knowledge *that* the regularity exists and coordinates communication (its function), even if they don't consciously represent alternatives during transmission. This satisfies Lewis's core requirements, bridging rational-choice structure with selectionist emergence. The norm remains arbitrary (other orders *could* work) and solves a coordination problem through mutual conformity.
