  They mention examples like neuroreductionists with consciousness and economists with macroeconomics. The user sees this as different from auxiliary hypotheses because it's not a boundary condition but an ontological category applied selectively. It's also not mere equivocation because researchers genuinely hold both that emergence is real and reduction is total, without seeing the conflict.

