answer: |-
  This is an exceptionally sharp observation of a recurring dialectical maneuver in reductionist programs. While there isn't a single, universally agreed-upon *technical term* that captures *exactly* this specific oscillation, your description intersects with several well-established concepts in philosophy of science and metaphysics. The closest fit and most useful frameworks involve:

  1.  **Immunization Strategy (Lakatosian) + Ontological Opportunism:** This is the most precise characterization of the *tactic*. The core mechanism is **theory immunization**, as described by Imre Lakatos in his methodology of scientific research programmes (MSRP). A protective belt of auxiliary hypotheses shields the hard core (e.g., "All of P is reducible to M"). The distinctive feature in your case is that the immunizing hypothesis is **ontological opportunism**: the *ad hoc* invocation of "emergence" *specifically* as an ontological category to quarantine anomalies (F), while **simultaneously maintaining an ontological reductionist claim** about the *entirety* of P. The "opportunism" lies in:
      *   **Selective Application:** Emergence is *only* invoked defensively for troublesome Fs, never proactively to constrain the initial reductionist claim or guide positive research on the nature of F.
      *   **Scope Ambiguity:** The boundaries of what falls under "P reducible to M" vs. "emergent F" are left undefined *ex ante* and adjusted *ex post* to protect the core claim.
      *   **Explanatory Asymmetry:** The ontological claim ("P *just is* M") remains unmodified and is used for positive explanation/promotion, while the epistemological/explanatory failure (F not derivable) is handled by the ontological quarantine ("F is emergent").

  2.  **Promissory Reductionism / Promissory Materialism:** This term (often used critically) captures the *attitude* of deferring problems ("Don't worry, we'll reduce that eventually") but doesn't inherently include the *ontological sleight of hand* you identify. Your pattern is a *specific subspecies* where the promise is replaced by an ontological reclassification ("We don't *need* to reduce it; it's emergent, but P *still just is* M").

  3.  **Loose Talk of "Emergence" by Reductionists:** Many critiques (e.g., Jaegwon Kim, David Chalmers) highlight how physicalists/reductionists sometimes invoke "emergence" loosely to deflect problems (like consciousness), often without a coherent metaphysical account compatible with their core reductionism. Kim specifically argued this often amounts to a disguised form of **epiphenomenalism** or **property dualism** inconsistently held alongside physicalism. Your observation sharpens this by focusing on the *dialectical function* of this invocation – its role in protecting the *marketing* of the reduction as complete.

  4.  **Explanatory Opportunism / Bait-and-Switch:** While not technical terms, these capture the *pragmatic* aspect. The "bait" is the strong, complete reduction claim for *all* of P. The "switch" occurs when confronted with F: "Oh, *that* part? That's emergent (but the reduction is still complete!)." The opportunism lies in benefiting from the rhetorical power of completeness without bearing its explanatory burden for all features.

  **Characterizing the Logical Structure & Proposing a Label:**

  *   **Core Contradiction:** The program simultaneously holds:
      *   **Ontological Reductionism (OR):** Phenomenon P *is identical to* or *is constituted solely by* base mechanism M (P = M / P supervenes wholly on M).
      *   **Explanatory/Emergent Exception (EE):** Feature F is a genuine aspect of P, but F is *emergent* relative to M, meaning F is not derivable/explicable solely from M and its interactions (or, in stronger versions, F has novel causal powers not reducible to M).
  *   **Immunizing Maneuver:** EE is invoked *only* as a defensive response to counterexamples (F), never as a constraint on OR. OR is maintained as the primary, complete ontological and explanatory claim for P *despite* EE.
  *   **Failure Mode:** **Ontological Scope Ambiguity with Immunizing Function.** The program fails to consistently define the scope of its reductionist ontology (what *exactly* does "P" refer to if F is "part of P" but ontologically distinct from M?). The invocation of emergence acts as an *ad hoc*, ontologically-loaded immunizing stratagem protecting the core OR claim from falsification by anomalies, while allowing the program to retain the rhetorical force of having "explained P."

  **Most Accurate Label:**

  Given the lack of a perfect pre-existing term, the most accurate way to label this specific pattern is:

  1.  **"Opportunistic Emergence as an Immunizing Maneuver"** (Descriptive)
  2.  **"Defensive Emergence in Reductive Programs"** (Descriptive)
  3.  **"The Emergent Escape Hatch"** (More evocative, captures the function)
  4.  **"Immunizing Ontological Opportunism"** (Highlights the core mechanisms)

  **Why your observation is distinct and valuable:**

  *   **Beyond Simple Ad Hoc:** You correctly note it's not just adding a boundary condition (e.g., "this model only works at low temperatures"). It's invoking a *fundamental ontological category* (emergence) selectively.
  *   **Beyond Equivocation:** You identify the genuine (but inconsistent) belief in both OR and EE. It's not mere wordplay; it's a deep, often unrecognized tension in the ontological commitments.
  *   **Focus on Marketing/Immunization:** You pinpoint the *pragmatic function* – protecting the *rhetoric* of complete success while evading its full implications.

  **Philosophers to Engage With:**

  *   **Imre Lakatos:** For immunization strategies in research programs.
  *   **Jaegwon Kim:** Specifically *Mind in a Physical World* and *Physicalism, or Something Near Enough* for critiques of how physicalists use (and misuse) emergence, arguing it often collapses into epiphenomenalism or dualism.
  *   **David Chalmers:** *The Conscious Mind* for critiques of reductive explanations of consciousness and the "easy" vs. "hard" problem distinction, highlighting how "hard" problems are often sidelined.
  *   **Nancy Cartwright:** *How the Laws of Physics Lie* and *The Dappled World* for critiques of strong reductionism and the patchwork nature of explanation.
  *   **John Dupré:** *The Disorder of Things* for critiques of reductionism and defense of pluralism/disunity, relevant to the economists' example.

  Your articulation of this pattern is excellent. Framing it as **"the strategic use of ontological emergence as an *ad hoc* immunizing device within reductionist programs, allowing them to maintain claims of complete ontological reduction while quarantining explanatory failures"** provides a clear and powerful critical tool. Coining a specific term like **"Immunizing Emergentism"** or **"Reductive Emergence-Dualism"** could be very useful for your work.
