  First, they mention the uniqueness camp using bureaucratic-rational machinery as the key differentiator, particularly adiaphorization. The comparability side counters that bureaucracy isn't unique to Europe. The user wonders if the debate is about whether adiaphorization was necessary for the scale of killing or if it's a conceptual clash over "modernity" as a mechanism versus backdrop.

  I need to recall Bauman's argument. He posits that modernity's rational bureaucracy enabled the Holocaust by fragmenting tasks and suppressing moral responsibility. The uniqueness side extends this to argue that such a system was essential for industrial-scale genocide. Comparability proponents, like Zimmerer or Moses, argue that other genocides also used bureaucratic methods, so it's not exclusive to modernity or Europe.

  The user's question about empirical versus conceptual disagreement is spot on. On the surface, both sides reference historical cases, but their underlying frameworks differ. Uniqueness focuses on the specific causal role of modern bureaucracy in enabling the Holocaust's scale. Comparability treats modernity as a contextual backdrop, not a unique causal factor. This difference in framing "modernity" is crucial. For uniqueness, it's an active mechanism; for comparability, it's part of a broader pattern.

  The user also asks what kind of evidence could shift the debate. If it's empirical, finding cases where large-scale genocide occurred without modern bureaucracy would challenge the uniqueness claim. But if it's conceptual, the debate might be stuck because each side prioritizes different things: singularity vs. pattern recognition. 

