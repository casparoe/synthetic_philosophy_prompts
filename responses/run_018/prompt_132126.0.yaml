  The dialogue needs to feel organic - they should build on each other's points. I'll have Maya start strong with the LLM-as-evolution analogy, then Jonas counter by questioning the replicator/interacter collapse. Maya can respond by emphasizing functional equivalence, and Jonas can retort with the "lossy compression" critique. They'll likely deadlock on whether algorithmic processes can truly constitute an evolutionary system without biological grounding.

  For the JSON, I'll need to:
