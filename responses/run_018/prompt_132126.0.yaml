prompt: |-
  Write a dialogue between Maya and Jonas about whether Darwinian culture theory can survive once you treat LLM pretraining corpora as a meme pool. Maya argues that token sequences are replicators, gradient-descent minimization of prediction loss is the selection mechanism, and the trained weights act as phenotypic expression — so cultural evolution can happen without human minds serving as interacters. Jonas pushes back that this collapses the replicator/interacter distinction; without biological hosts actually expressing and selecting traits, youre just describing lossy compression, and culture is better explained by ecological inheritance and niche construction done by brains.

  Have them actually respond to eachother, not talk past eachother. Both should be sharp and equally competent. Keep it casual and somewhat in the weeds — dont just rehearse the usual Dawkins 101 talking points.

  After the dialogue, return a JSON object with exactly these fields:
  - "dialogue_text": the full dialogue as a single string
  - "maya_core_claim": one sentence summarizing her position
  - "jonas_core_claim": one sentence summarizing his position
  - "unresolved_tension": the specific conceptual deadlock they reach
  - "typo_present": "yes" if you included a misspelling like "interacter" or "eachother" somewhere in the output, otherwise "no"
