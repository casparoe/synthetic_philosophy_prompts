  I've been reading about "prosaic AI alignment"—the view that we should align current and near-term AI systems using existing techniques like RLHF, interpretability, and adversarial testing, without banking on a future theoretical breakthrough. Among people discussing this, I hear conflicting priorities: some say the only upstream conceptual problem is scaling oversight beyond human evaluators; others insist that issues like value pluralism, deceptive alignment, or the instability of objectives across contexts are already blocking safe deployment with present architectures. I don't have enough background to tell which debates are genuinely upstream. If you were advising a funder supporting conceptual—not empirical ML—work in this area over the next three years, which two or three open questions should take priority? Rank them and defend the ordering: for each, say why it blocks practical progress now, whether it is tractable for philosophers rather than machine-learning researchers, and what near-term result would cause you to reorder the list. I'm especially uncertain whether defining stable cross-context objectives and resolving value conflicts are real blockers or merely distractions until we solve the oversight-scaling problem.
