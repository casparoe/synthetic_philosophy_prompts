  I'm in this philosophy seminar and we got into the lottery paradox and preface paradox — you know, the thing where you rationally don't beleive your lottery ticket will win, but if you apply that same reasoning to every ticket you'd have to deny someone will win at all. And the preface version where an author admits in the preface that there are probably errors in the book even though she stands behind every individual sentence. Anyway, I'm trying to think through whether these are just puzzles about logic or if they show something deeper about how belief actually works.

  Could you write a short story about a archivist in a near-future library where people's beliefs are stored as weighted statements? The protagonist reviews other people's belief-sets and notices that almost everyone holds hundreds of individual beliefs they're 99% sure about, plus one meta-belief that at least one of those hundreds is wrong. She starts wondering why society treats that as healthy skepticism rather than a flat contradiction. Then she finds an old record — her own — and sees she used to hold a much smaller, perfectly consistent set of beliefs before she was required to expand her knowledge profile for work. The story should focus on her choice: keep the contradiction and stay employed, or revert to the smaller self and lose her job. Don't make it too sci-fi, just kind of melancholy and weird, and let the tension sit there without a neat answer.
