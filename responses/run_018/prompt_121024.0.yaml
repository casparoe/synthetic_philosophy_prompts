  #### Leaf Positions  
  - **(i) Four-dimensionalist eternalist block universe**: All events across spacetime exist equally, with temporal becoming illusory.  
    - *Awkward commitment*: Denies the phenomenology of temporal passage as metaphysically significant.  
  - **(ii) Presentism with privileged but observationally inaccessible foliation**: Only events on a single spacelike hypersurface exist, with the foliation Lorentz-invariant but empirically hidden.  
    - *Awkward commitment*: Privileged foliation is fundamental to reality yet undetectable, raising epistemic access concerns.  
  - **(iii) Growing-block view modified for Minkowski spacetime**: Events on or below a dynamically evolving spacelike hypersurface exist, with "growth" along a privileged foliation (Lorentz-invariant or not).  
    - *Awkward commitment*: Requires objective temporal becoming in a spacetime structure that fundamentally lacks a unique time-slicing.  
  - **(iv) Local presentism/fragmentalism**: Only events within an observer's past light cone are real, fragmenting reality across observers.  
