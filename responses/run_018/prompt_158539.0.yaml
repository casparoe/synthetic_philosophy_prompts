answer: |-
  ## Collective Horizon: Relational Operating System (v3.1)  
  *"I am because We are. We are because Context is."*

  **Core Tenants (Non-Negotiable):**  
  At Collective Horizon, we reject atomistic individualism. Your existence *is* the relational matrix. This isn't touchy-feely; it's ontological bedrock. Forget "employees." You are **Node-Webs**. Your performance *is* the health of your connections. Attempts to isolate "individual contribution" are like trying to extract a single drop from a river – ontologcial nonsense.  

  > **Sidebar: Sr. Relational Architect Mpho van der Westhuizen**  
  > *"We banned 'my desk.' It implies possession. You *inhabit* a relation point. Big difference. HR had to rewire the badge scanners."*

  **HR Manifesto: Weaving the Web**  
  *   **Performance Reviews? Obsolete.** Quarterly "Web Resonance Assessments" measure signal strength across your primary, secondary, and tertiary relation clusters (minimum 8 nodes assessed per cycle). Low resonance triggers *Web Reknitting*, not PIPs.  
  *   **Salary Secrecy? Incoherent.** Your compensation reflects your node's density and throughput within the Whole Web. Bands are public. Discrepancy challenges? File a "Relational Equipoise Request." (Note: 97% result in mandated communal mediation lunches).  
  *   **"Layoffs"? Conceptually Impossible.** You *cannot* sever a node without collapsing dependent sub-webs (see: 2022 "Cost Optimization Incident" - never forget). Underperformance manifests as *Web Fraying*, addressed via intensive *Collective Reintegration Protocols* (CRPs), often involving synchronized chanting and shared task-juggling.  

  **Remote Work & The Branching Self (Relational Continuity Policy - RCP)**  
  Hybrid work creates unique ontological challenges. When your physical locus splits your significant relation web (e.g., home-office, coffee shop-co-parent), a *Parfitian Branching Event* occurs. Payroll must adjudicate:  

  1.  **Significant Web Density Index (SWDI):** Where are >51% of your high-resonance connections anchored?  
  2.  **Intentionality Vector:** Which branch *intended* to be the Work-Web? (Subjective, requires node testimonials).  
  3.  **Payroll Continuity:** The dominant branch receives direct deposit. The secondary branch enters "Relational Limbo" – technically still part of the Whole Web, but payroll-inactive until reconvergence (usually requiring a mandatory 3-day in-office "Web Suturing Retreat").  

  > **Sidebar: Sr. Relational Architect Thandiwe Okafor**  
  > *"Had a Node-Web whose dog constituted 12% of their primary relation cluster. Home office branch won SWDI. Payroll processed kibble credits. Compliance was... intrigued."*

  **Time "Off"? A Category Error**  
  The notion of "Personal Time Off" (PTO) presupposes a self-contained entity taking leave *from* the web. This is ontologically impossible under thick Ubuntu. Solitude *is* relation (to environment, memory, the cosmic web – it's complicated).  

  *   **Self-Containment Leave (SCL):** Unavailable. You cannot cease being a node.  
  *   **Required Withdrawal:** For medical/psychological necessity, "Temporary Web Flickering" is permitted under strict monitoring. Your node enters low-latency mode; core resonance expectations are reduced by 40%, but you remain *visible* and pingable on all channels – absence *is* harm. Mandatory "Re-illumination Ceremony" upon return.  

  **Accountability? It's Relational, Obviously.**  
  Mistakes aren't *yours*. They emerge from web resonance failure. Blame is anti-pattern. Solutions involve:  
  1.  **Web Autopsy:** Mapping the failure across implicated nodes.  
  2.  **Resonance Recalibration:** Collective breathwork or shared vulnerability exercises.  
  3.  **Distributed Consequence Absorption:** The whole web shares the burden (e.g., collective loss of kombucha tap privileges for one sprint).  

  ---

  **Disclaimer & Ontological Grounding (For the Scholars in the Web):**  
  *   **Settled in Ubuntu Thought:** Ubuntu fundamentally asserts interconnectedness as constitutive of personhood ("umuntu ngumuntu ngabantu"). It challenges Western hyper-individualism and prioritizes community welfare. The rejection of purely individual merit/culpability has strong roots.  
  *   **Genuinely Contested:**  
      *   **Ontology vs. Ethics:** Is Ubuntu primarily a *metaphysics of being* (we *are* relations) or an *ethical injunction* (we *should* prioritize relations)? Scholarship is divided. Collective Horizon leans hard into the ontological reading (arguably, *very* hard).  
      *   **Agency:** Does thick relationality erase individual agency? A major critique. We resolve this... relationally. Agency is a web-emergent phenomenon.  
      *   **Scale:** Does Ubuntu logic hold in large, impersonal systems like corporations? We assert yes, with *vigorous* CRPs. Critics call this "ontological overreach." We call it Tuesday.  
  *   **Parody Liberties Taken:**  
      *   **Hyper-Literalism:** Taking "I am because we are" as a strict operational manual for corporate HR is a *massive* (and intended) exaggeration. Real Ubuntu traditions allow for personal space and responsibility within community.  
      *   **The "Branching" RCP:** A satirical mashup of Derek Parfit's thought experiments (personal identity branching) with relational ontology, creating bureaucratic absurdity. Pure fiction highlighting institutional awkwardness.  
      *   **Denial of Solitude:** An extreme interpretation for comedic effect. Most Ubuntu scholars recognize individual reflection *within* community. Our "Temporary Web Flickering" is the parody's dystopian answer.  

  **Join Us. Be the Web.**  
  (Applications require 3 Node-Web testimonials and a signed affidavit acknowledging your ontological dependence on the kombucha tap).
