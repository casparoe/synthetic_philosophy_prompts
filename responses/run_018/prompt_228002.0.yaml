  I'll structure it like a real white paper: mission statement, principles, procedures. Start with the institute's founding premise—that premature falsification is a solvable problem. Then introduce mechanisms like the Rolling Prediction Horizon and Catastrophic Equivalence Protocol. Use Malthusian examples throughout to ground it. 

