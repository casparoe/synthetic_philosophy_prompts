  - The Equivalence Protocol: If the predicted catastrophe (famine) doesn’t happen, but something related (climate disaster) does, declare victory by linking causal chains.

  The humor comes from escalating absurdity. By Principle 4, any bad event can count as vindication if you argue it’s "preliminary strain." By the end, the institute "solves" falsification so thoroughly that predictions lose all meaning—which is the point. 

