prompt: |-
  ok so my roommate just spent three months verifing her gut feelings about people by only remembering the times she was right and then citing that track record as proof her intuition works — classic circularity, right? i got obsessed with the bootstrapping problem and easy knowledge objections and now i need an exam for my intro epistemology course (second year undergrad, not grad school). i want the prompt to be in the weeds: not just 'explain the bootstrapping argument' but force students to apply it to a nested calibration scenario. imagine a primary instrument that calibrates a secondary one, then the secondary is used to check the primary's accuracy — ask whether this breaks the circular loop or just extends the chain, and whether the easy-knowledge worry applies at the second order too. write one essay question suitable for a 45-minute sit-down exam worth 30 marks, then a model answer of about 500-600 words that works through the loop structure precisely, and a marking scheme that seperates an A (sees the second-order check presupposes first-order reliability rather than grounding it) from a B (describes circularity but misses the nesting relocation). please dont ask for bibliographies or citation lists — the model should just reason it through. also make sure the marking scheme lists specific mistakes that cost marks, like claiming that more loops eventually solve the problem or confussing bootstrapping with simple confirmation bias. write it casual, im on my phone so typos are fine.
