answer: |-
  **Exam Question (45 mins, 30 marks):**

  **"Roommate's Calibration Loop":** Your roommate claims her intuition ("Device A") reliably detects untrustworthy people. To "verify" this, she uses her memory ("Device B") to recall only instances where her intuition was correct. She then points to Device B's record as proof that Device A is reliable.  
  *Now imagine an upgrade:* She first uses Device A to *calibrate* Device B (e.g., "My memory is only trustworthy *because* it confirms my intuition"). Later, she uses the now-"calibrated" Device B to *check* the accuracy of Device A.  

  **Prompt:** Does this nested calibration (A calibrates B; B then checks A) break the bootstrapping problem? Or does it merely extend/re-locate the circularity? Explain why. Does this "upgrade" avoid the "easy knowledge" objection (where reliability is established too cheaply)? Be precise about the loop structure and the epistemic presuppositions at each stage.

  ---

  **Model Answer (Approx. 550 words):**

  The nested calibration does *not* break the bootstrapping problem; it merely relocates the circularity to a higher level and fails to avoid the easy knowledge objection. Here's why, step-by-step:

  1.  **The Original Bootstrapping Problem:** The roommate uses Device A (intuition) to generate beliefs about people. To verify A's reliability, she uses Device B (memory), but *only* accesses memories where A was correct. This is circular because B's "positive record" presupposes A's reliability. It assumes the truth of what it's trying to prove (A is reliable) by selectively relying on A's outputs as the standard for judging B's accuracy (or vice-versa). This generates "easy knowledge" – she gets the *feeling* A is reliable without genuinely independent verification.

  2.  **The Nested Calibration "Upgrade":**
      *   **Stage 1 (Calibration):** Device A (intuition) is used to calibrate Device B (memory). This means A determines the standard for what counts as a "correct" memory for B. Essentially, *A tells B:* "Your record is accurate only when you agree with me." This stage **assumes A's reliability** to establish B's reliability. B's authority is derivative, borrowed from A.
      *   **Stage 2 (Checking):** The *now-calibrated* Device B is used to check the accuracy of Device A. B looks at past instances and says "Yes, A was correct." However, B's calibration *depends entirely* on A's prior reliability (established in Stage 1). Therefore, when B "confirms" A, it's simply echoing the standard *set by A itself*.

  3.  **Why it Doesn't Break the Loop (Relocation, Not Resolution):** The circularity isn't broken; it's nested. The "checking" in Stage 2 *presupposes* the reliability established in Stage 1. Stage 1 requires assuming A is reliable to make B a reliable-seeming checker. Stage 2 then uses this B (whose reliability is built on A) to "confirm" A. The loop is now: **A's assumed reliability → B's derived reliability → B "confirms" A's reliability.** The justification still circles back to the initial, unjustified assumption of A's reliability. The dependency chain loops back onto itself at a higher level of abstraction.

  4.  **Why Easy Knowledge Persists (Second-Order Worry):** The easy knowledge objection applies even more clearly at this second order. The roommate gains *no new, independent ground* for trusting A. The entire calibration-and-check process is internal to the system defined by A. The "calibrated" status of B gives the *illusion* of independent verification, but it's an illusion because B's calibration standard *is* A's output. Knowledge of A's reliability remains "easy" – it's manufactured entirely within the self-referential system A dominates. The second-order check (B checking A) is only as good as the first-order calibration (A calibrating B), which was question-begging. There's no external anchor point; reliability isn't genuinely *tested* against an independent standard, only against a standard it created.

  **Conclusion:** The nested calibration is sophisticated bootstrapping. It creates a two-stage loop that *hides* the circularity by making B *seem* like an independent arbiter after calibration. However, since B's authority as a checker is wholly derived from the initial, unverified reliability of A, the loop remains vicious. The easy knowledge objection stands: the system generates a false sense of confirmed reliability without ever providing foundational justification external to the very faculty (A) under scrutiny. The circularity is relocated to the relationship between calibration and checking, not resolved.

  ---

  **Marking Scheme (30 Marks Total):**

  *   **A Grade (25-30 marks):** **Explicitly identifies that the second-order check (B checking A) PRESUPPOSES the first-order reliability of A (established during calibration), rather than providing independent grounding for it.** Clearly explains the nesting: Stage 1 (A calibrates B) assumes A's reliability to grant B derivative authority; Stage 2 (B checks A) uses this derivative authority to "confirm" A, completing the circle. Directly addresses why this fails to solve easy knowledge (no external standard, confirmation is internal/system-relative). Excellent structural clarity.

  *   **B Grade (18-24 marks):** Correctly identifies circularity in the overall process and explains the basic bootstrapping problem clearly. Understands that the "upgrade" doesn't fix it. Mentions the dependency between calibration and checking but **fails to precisely articulate that the second-order check *presupposes* the very first-order reliability it's meant to ground, or doesn't fully unpack the nesting** (e.g., just says "it's still circular" without detailing the relocated loop structure). May mention easy knowledge but not explicitly link it to the lack of an external standard at the second order.

  *   **C Grade (12-17 marks):** Recognizes circularity generally but provides a superficial analysis. May misidentify the core problem (e.g., focuses only on confirmation bias in memory). Struggles to articulate the specific structure of the nested calibration or its failure. Limited engagement with the bootstrapping argument or easy knowledge objection.

  *   **D Grade (6-11 marks):** Significant misunderstanding. May claim the loop is broken or improved. Fails to identify the epistemic circularity clearly. Confuses concepts.

  *   **F Grade (0-5 marks):** Little to no relevant understanding. Off-topic.

  **Specific Mistakes Costing Marks:**
  *   **-5 to -8 marks:** Claiming that adding more stages/loops/devices *eventually* solves the problem or provides convergence towards reliability.
  *   **-4 to -6 marks:** Confusing bootstrapping (epistemic circularity in justifying reliability) with simple confirmation bias (only remembering successes). (Mentioning confirmation bias *as part* of how Device B works is fine; *equating* the core problem to it is the mistake).
  *   **-3 to -5 marks:** Arguing that internal coherence/consistency (A and B agree) is sufficient proof of reliability, without addressing why this is question-begging.
  *   **-3 marks:** Failing to explicitly mention the "easy knowledge" objection or its relevance.
  *   **-2 to -4 marks:** Vague description of the loop structure without clearly differentiating the calibration stage from the checking stage and their interdependency.
  *   **-1 to -3 marks:** Minor inaccuracies in terminology (e.g., misusing "calibration," "reliability," "justification").
