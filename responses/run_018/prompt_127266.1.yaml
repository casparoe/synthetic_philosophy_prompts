prompt: |-
  Since retiring from bench science I've gotten into philosophy, mostly because Nozick's experience machine still buggs me. I want the full spec: what must a theory of well-being actualy deliver?

  Write exactly five desiderata — each in one or two sentences — covering the cases it has to get right (experience machine, adaptive preferences, maybe distributed cognition in slime molds?), the distinctions it can't collapse, and any biological results it can't violate. Flag which ones clash, and quickly note how hedonism, desire-satisfaction, and objective-list views do against them. If I'm conflating well-being with consciousness or asking for something incoherent, say so plainly — don't politely pretend.

  Number them 1 to 5, no intro, no conclusion, American English. No citations or reading lists, please — I'm working offline.
reasoning: |-
  Okay, the user is a retired scientist diving into philosophy, specifically bothered by Nozick's experience machine. They want a crisp list of five desiderata for a theory of well-being. Let me unpack their request.

  First, they're clearly analytical - bench science background means they'll want precision. The frustration with "polite pretending" suggests they've encountered vague philosophical responses before. They're not after fluff; they want bullet-pointed rigor. 

  The core demand breaks down into:
  - Must-handle cases: Experience machine, adaptive preferences, maybe even slime mold cognition? (that last one's delightfully niche)
  - Critical distinctions: Can't oversimplify complex concepts
  - Biological constraints: No violating established science
  - Conflict flags: Where do these criteria fight each other?
  - Theory report card: How do hedonism/desire/objective-list views hold up?

  Hmm... slime molds are interesting. They're testing if well-being requires cognition. But well-being is typically tied to sentience, not just biological processes. Might need to clarify that boundary. 

  For the five bullets, I'm thinking:
  1. Experience machine rejection - the "truth matters" criterion
  2. Adaptiveness problem - avoiding false consciousness traps
  3. Consciousness requirement - slime molds probably fail this
  4. Bodily integrity - can't ignore physical reality
  5. Subjectivity - but balanced with objectivity (that's the tension)

  Biggest clash will be between #3 (subjective experience needed) and any theory that tries to make well-being purely objective. Also #4 (body matters) vs. pure hedonism that says only mind states count. 

  User's "conflating well-being with consciousness" worry is valid. I'll explicitly flag that slime molds don't count - cuts off a potential dead end. 

  Desire theories fail #2 (adaptive prefs), hedonism fails #1 and #4, objective lists often fail #5. No free lunches here. 

  Better avoid jargon - they're offline but sharp. "Affective states" not "qualia". "Bodily facts" not "embodied cognition". Keep it lean.
answer: |-
  1.  **Must reject the experience machine:** A theory must explain why plugging into a machine generating maximal positive experience is undesirable compared to real, authentic engagement with the world, even if less pleasant. Hedonism fails (only experience matters), desire-satisfaction *might* pass (if desires involve truth), objective-list views pass (authenticity/achievement are goods).
  2.  **Must not confuse adaptation with well-being:** It must avoid declaring someone with severely lowered, adapted preferences (e.g., due to oppression) truly well-off just because those preferences are satisfied. Hedonism struggles (adapted states might feel positive), desire-satisfaction fails badly, objective-list views pass (identify genuine goods like freedom).
  3.  **Must require consciousness (for subjects):** Well-being applies only to entities capable of subjective experience; flourishing slime molds or thermostats lack well-being regardless of function. Hedonism passes (built-in), desire-satisfaction passes (requires a subject), objective-list views *can* pass if limited to conscious beings.
  4.  **Must account for the significance of bodily facts:** Physical health, integrity, and real-world activities (not just mental states) must inherently impact well-being. Hedonism fails (only mental states), desire-satisfaction *might* pass (if desires include bodily states), objective-list views pass (health is objective good). *Clashes with pure experiential/internal-state focus (like hedonism).*
  5.  **Must respect subjectivity without collapsing into relativism:** Well-being is fundamentally *for the subject*, but not merely whatever they believe or feel; the theory must identify constituents grounded in the subject's nature/perspective. Hedonism respects subjectivity, desire-satisfaction respects subjectivity, objective-list views struggle (risk imposing external goods). *Clashes with purely objective accounts.*
