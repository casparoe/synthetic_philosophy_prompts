prompt: |-
  I'm prepping a session for my rationalist-adjacent meetup — mostly engineers who skim LessWrong but have zero formal ethics. I want to teach them that voting for the lesser evil isn't just a calculator move; there's a complicity gradient where your vote is causally responsible only if decisive, but symbolically responsible regardless, and the tension is between accepting that gradient and trying to wash your hands clean. Don't explain it to me — plan the teaching arc. What dependency has to be locked in first so the gradient isn't just intuitive? Use one carrying example: a ranked-choice ballot where your first pick is a perfect-but-unelectable write-in and your second is a genuinely bad but viable candidate — say exactly what properties that example needs and what it must avoid. Then map the misconceptions they'll form: "one vote never matters so there's no duty," "expressive voting is just virtue signaling," and "abstaining makes me blameless" — tell me where in the sequence each hits and how to head it off. Give me one end-of-session check that proves they grasp the gradient rather than parroting it, and say what part of voting theory I should openly refuse to cover. Write the answer in American English. (Also, I know thier's a big literature on expressive voting, but don't cite anything — I want to see if the framing stands alone.)
reasoning: |-
  Okay, the user wants a lesson plan for their rationalist-adjacent meetup about the ethics of voting for the lesser evil. Let me start by understanding their main points. They mentioned the complicity gradient—causal responsibility when decisive versus symbolic responsibility regardless. The key is to teach that voting isn't just strategic; there's an ethical tension between complicity and purity.

  First, I need to break down dependencies. The participants are engineers familiar with LessWrong but no formal ethics. So, I should start with concepts they might know, like expected value and the low probability of a single vote mattering. But they need to grasp that voting has multiple dimensions: causal impact and expressive/symbolic meaning. Maybe use a thought experiment to illustrate that even ineffective actions can carry moral weight, like donating to a lost cause.

  The carrying example is crucial. They specified a ranked-choice ballot with a perfect but unelectable first choice and a bad but viable second. The example must avoid vote-splitting and spoiler effects, so RCV is good because it allows expressing preference without wasting the vote. The second choice needs to be clearly harmful, not just imperfect, to highlight moral compromise. Also, the unelectable candidate should be truly non-viable to force the dilemma.

  Next, misconceptions. "One vote never matters" might come up early. Counter by reinforcing that duty isn't tied to high probability but to participation. "Expressive voting is virtue signaling" could arise when discussing symbolic responsibility. Emphasize that signaling values to oneself or in-groups has intrinsic weight. "Abstaining is blameless" might appear later. Point out that abstaining still influences outcomes indirectly and has its own symbolic complicity.

  For the end-of-session check, a scenario where they articulate both causal and symbolic aspects. Maybe ask them to explain why someone might feel complicit even if their vote wasn't decisive. Avoid covering voting theory mechanics like different systems to keep focus on ethics.

  Need to ensure the gradient concept is internalized. Use relatable analogies, maybe something from engineering where a small part in a larger system has both functional and symbolic roles. Avoid jargon, keep it practical. Also, anticipate emotional responses; engineers might resist ethical arguments without data, so frame it logically using their existing rationalist framework. Make sure the session flows from mechanics to ethics, building each concept step-by-step to prevent overwhelm.
answer: |-
  Here’s a focused teaching arc designed for engineers, locking dependencies before introducing the complicity gradient. Avoids theory deep dives and keeps the tension visceral:

  **Core Dependency to Lock First: Votes Have Dual Functions**  
  *Prerequisite:* Participants must internalize that a vote simultaneously:  
  (A) **Causally** contributes to an electoral outcome (tiny probabilistic weight)  
  (B) **Symbolically** acts as a personal endorsement (100% weight to you/your identity)  
  *Without this split, the gradient collapses into "only causality matters."*

  **Carrying Example: Ranked-Choice Ballot Structure**  
  *What it needs:*  
  - **First Choice:** "Pure" write-in candidate (e.g., "Ideal Candidate")  
    - *Property:* Universally acknowledged as morally perfect *by the voter*  
    - *Property:* True 0.0% chance of winning (no polling, no funding)  
  - **Second Choice:** "Lesser Evil" major candidate (e.g., "Candidate B")  
    - *Property:* Objectively harmful policies (e.g., "Supports policy X causing 100k deaths")  
    - *Property:* Sole viable alternative to "Greater Evil" (e.g., "Candidate A," who causes 1M deaths)  
  - **Critical Avoidance:** No spoiler effect possible (RCV neutralizes this). The dilemma must be purely ethical, not strategic.

  **Teaching Sequence & Misconception Head-Offs:**  

  1. **Anchor in Rationality 101**  
     - *Activity:* Calculate EV of a single vote (near-zero). Lock consensus: "Your vote won’t change the outcome."  
     - *Head-off "One vote never matters so there’s no duty":*  
       Immediately challenge: "If you *knew* your vote was decisive, would you vote for B? Why/why not?" Surface moral intuitions *before* EV dominates.  

  2. **Introduce Symbolic Weight**  
     - *Thought Experiment:* "If you voted for B in a *private* simulation where outcome was fixed, would you feel tainted? Why?"  
     - *Key Insight:* Voting is a speech act. Endorsing B signals "B is acceptable to me," regardless of impact.  
     - *Head-off "Expressive voting is just virtue signaling":*  
       Reframe: "Is voting *only* about changing outcomes? Or is it also about registering what you stand for? What does 'virtue signaling' dismiss about integrity?"  

  3. **Deploy Carrying Example**  
     - *Scenario:* "You rank Ideal Candidate 1st, B 2nd. B wins. Your ballot didn’t change the result."  
     - *Q1:* "Did your vote *cause* B’s win?" (No)  
     - *Q2:* "Did you *endorse* B as your backup?" (Yes)  
     - *Q3:* "Does endorsing a 'lesser evil' feel like complicity? Why?"  

  4. **Map the Gradient**  
     - Visualize:  
       ```  
       High Complicity ┃───────────┼───────────┃ Low Complicity  
           (Causal)   │ Your Vote  │ (Symbolic)  
                      │ Was Decisive│  
       ```  
     - Stress: Causal responsibility is binary (decisive/not). Symbolic responsibility is continuous (you always own your choices).  

  5. **Trap the Abstainer Fallacy**  
     - *Activity:* "What if you abstain? B still wins. Outcome identical."  
     - *Head-off "Abstaining makes me blameless":*  
       Contrast: "Abstaining = endorsing *whoever wins*. Voting for B = endorsing B specifically. Which feels more complicit if B enacts horrors?"  
       *Punchline:* Abstaining dodges symbolic endorsement but accepts causal irrelevance. Voting accepts minor symbolic stain to reduce harm.  

  **End-of-Session Check (Proves Internalization):**  
  *Prompt:* "In a swing state, you vote for hated-but-vital policy compromise C to block monster D. C wins by 10,000 votes. A friend says: *'You didn’t cause C’s win, so why feel guilty? It’s just pragmatism.'* How do you explain your unease using *both* causal and symbolic responsibility?"  

  **Successful Answer Must:**  
  - Acknowledge causal innocence ("My vote wasn’t decisive")  
  - Confess symbolic complicity ("But I *chose* to endorse C’s flaws")  
  - Reject purity ("Abstaining wouldn’t absolve me—it’s cowardice")  
  - *Not* retreat to "But I reduced harm!" (That’s pre-gradient thinking)  

  **Explicitly Refuse to Cover:**  
  Voting system mechanics (e.g., "Why RCV over Approval Voting?"). Shut it down: *"Today is about ethics, not system design. Assume RCV functions as advertised."*  

  **Why This Works for Engineers:**  
  Leverages their comfort with probability (EV) and systems thinking (dual functions), then forces engagement with the irreducible tension between math and morality. The carrying example isolates the ethical dilemma by eliminating strategic confounders.
