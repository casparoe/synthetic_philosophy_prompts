  As a journalist covering science and ideas, I am preparing a feature on the hidden mechanics of moral reasoning and need a rigorously engineered philosophical case study. Please construct a realistic, workplace-based thought experiment—no longer than one paragraph, with no trolley problems, demons, or exotic physics—designed to isolate a divergence between Kant's Formula of Universal Law and the Formula of Humanity. The scenario should centre on a senior museum conservator who discovers that a singular, publicly held manuscript is chemically unstable and will become permanently illegible within five years unless treated with a modern synthetic adhesive that irreversibly alters its material composition. Institutional rules require that any alteration be disclosed, and disclosure would automatically result in the manuscript being removed from the collection and destroyed; concealing the treatment preserves both the text and public access, but withholds material information from future scholars. After presenting the case, demonstrate precisely how the universalisation test permits the concealed restoration by avoiding contradiction in conception, while the humanity formulation forbids it on the grounds that future researchers are treated merely as means. Identify the structural feature—specifically, the embedding of individual moral agency within an opaque institutional protocol—that drives the divergence, explain what happens to the verdicts if that feature is removed, and show how a defender of the Formula of Universal Law might attack the counterexample by distinguishing direct from indirect duties. Please present the entire analysis in British English.
