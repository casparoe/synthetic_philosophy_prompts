prompt: |-
  Act like a historian of early modern science with a philosophy-of-science background. Before you dive in, spend a couple minutes brainstorming all the different logical shapes a single proverb can take — I want you to resist the urge to pick one reading and defend it.

  So I was in a semniar about determinism and astrology, and someone kept saying that for Kepler the stars incline but do not compel. They used it to argue he wasn't a determinist, just someone who thought celestial bodies nudge human affairs without locking them in. I'm skeptical that the slogan actually does that work, but I'm also not sure what else it could mean.

  The phrase is usually translated from the Latin (I won't write the Latin exatly since I'd probably botch the grammar), but the core idea is that celestial bodies push us in directions without forcing our hand. I need you to lay out the distinct precise theses this could express, specifically in Kepler's context: he accepts some astrological correlations (weather patterns, collective moods, maybe epidemic cycles) but rejects natal-chart fatalism and the mechanics of house divisions. For each reading, tell me:
  - is it trivial or actually substantive?
  - is it defensible given what Kepler actually believed?
  - does it actually block determinism?

  But don't just list the obvious ones. I want you to distinguish at least these four types of inclination:
  1. statistical correlation with no causal arrow
  2. a dispositional tendency in human psychology triggered by celestial rhythms
  3. a modal constraint — stars make certain outcomes more possible without making them necessary
  4. a physical force that is always present but always counteracted by the soul's free choice

  Also unpack what do not compel is doing: is it metaphysical (free will physically blocks the force) or epistemic (we just can't predict the outcome)?

  Please structure your answer exactly like this:
  1. Seminar context (~100 words): where I met the slogan and what argumentative work it was being made to do there.
  2. The menu (~600 words): list each precise claim with a short label. For each, say trivial/substantive, defensible for Kepler, and whether it saves him from determinism.
  3. Niche injection (~250 words): discuss how Kepler's notion of celestial harmony as geometric sympathy — not mechanical push — interacts with these readings, especially his acceptance of aspect-based predictions versus his rejection of house-division mechanics. This is the part that should feel a bit off the beaten path.
  4. Verdict (~200 words): which readings people probably mean when they defend Kepler, which ones he probably held, and whether the slogan actually does the determinism-blocking work my seminar partner wanted.

  Think step by step, and don't give me a biography lecture. No bibliographies, no reading lists, no citations — I just want the conceptual map. Also please avoid attributing specific treatise titles or dates unless you're sure; keep references to Kepler's views general.
