answer: |-
  Here’s your take-home exam prompt, model answer, and marking scheme. Designed for a 45-minute sprint, closed book, digging deep into the incommensurability muddle.

  ---

  **Ethics Seminar Take-Home Exam: Moral Uncertainty & Incommensurable Values**  
  **Time Allowed:** 45 Minutes  
  **Total Marks:** 25  

  **Essay Question:**  
  Imagine you're a policy advisor. A rare, life-saving medical resource exists in sufficient quantity to aid *either*:  
  (A) **Group Alpha:** Five terminally ill children who will certainly die without it. Treating them offers each a high probability of a full, normal lifespan (massive cardinal welfare gain per child). *However*, awarding them the resource requires reallocating it from one chronically ill adult (Group Beta) who has a weak, but legally recognised prior claim based on a first-come-first-served waiting list. Denying Beta the resource condemns them to significant suffering and a shortened life (a clear deontological rights violation).  
  *Or*  
  (B) **Group Beta:** The single chronically ill adult with the prior claim. Treating them respects the deontological right/contractual obligation but provides a modest welfare gain (relief from severe pain, extending life by a few years) compared to the potential gains for Alpha. The five children definitely die.  

  Using this scenario, explain the problem of moral uncertainty arising from the apparent *incommensurability* between a lexical deontological constraint (like respecting prior claims/avoiding rights violations) and maximising aggregate cardinal welfare. Why doesn't simply "choosing a framework" or "weighing" them solve the problem here? Focus on the *structure* of the clash, not just advocating for one option.

  ---

  **Model Answer (Illustrative):**  
  This scenario forces a brutal clash between fundamentally different moral currencies. On one side, cardinal welfare utilitarianism demands maximising total wellbeing: saving five children offers vastly more aggregate welfare units (full lives saved) than slightly improving one adult's life, making Option A seem obligatory. On the other side, deontology imposes a lexical constraint: violating Beta's prior claim and right to the resource they were promised (even if the system is imperfect) is inherently wrong, a rights violation you *must not* commit, regardless of the welfare gains from doing so. This is incommensurable because the metrics lack a common scale. Welfare gains (even massive ones) *cannot* morally outweigh or "cancel out" breaking a fundamental deontological rule – it's like trying to add kilograms to metres. Conversely, respecting the rule feels catastrophically wasteful in welfare terms. "Choosing a framework" just pushes the uncertainty back a step: *why* choose utilitarianism over deontology here, or vice versa, when both demand radically different actions? You can't "weigh" them because the deontological constraint isn't *lesser* welfare; it's a different kind of moral reason entirely that resists trade-offs. The core uncertainty stems from not knowing how to rank or compare these radically different types of moral reason when they conflict absolutely, leaving the agent rationally paralysed.

  ---

  **Marking Scheme (25 Marks Total):**  

  1.  **(5 marks)** **Identifies & Explains Incommensurability:** Clearly articulates why the deontological constraint (respecting Beta's claim/right) and the cardinal welfare metric (saving Alpha) operate on fundamentally different, non-comparable scales (e.g., rights violations aren't "negative welfare units" that can be outweighed).  
  2.  **(5 marks)** **Accurate Theory Application:** Correctly applies cardinal welfare utilitarianism (aggregate gain calculation for Alpha vs. Beta) *and* lexical deontology (absolute prohibition on violating Beta's right/claim, irrespective of consequences for Alpha).  
  3.  **(5 marks)** **Rejects False Solutions:** Effectively argues why simplistic approaches like "just pick utilitarianism/deontology" or "balance/weigh the concerns" fail to resolve the fundamental conflict due to the incommensurable nature of the values.  
  4.  **(5 marks)** **Articulates Clash Structure:** Explains *how* the theories generate conflicting, categorical imperatives (e.g., Util: *Must* choose A to max welfare; Deon: *Must* choose B to avoid rights violation) and why this clash creates genuine moral uncertainty.  
  5.  **(5 marks)** **Clarity & Argument Rigour:** Presents a logically structured, coherent, and concise argument focused precisely on the problem of incommensurability within moral uncertainty, using the scenario effectively.
