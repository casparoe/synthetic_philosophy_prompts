answer: |-
  ## The Vault of Day Zero

  The hum of the *Palinode* was the hum of certainty. Four centuries of metal fatigue, recycled air, and the Long Count ticking towards Epsilon Eridani were held together by the Reckonings. Splice intervals for the aging hull. Nutrient ratios for the hydroponics. The critical mass calculations for the final deceleration burn, centuries hence. Keeper Kaelen, fingers tracing the glowing verification runes in the Audit Chamber, felt that certainty crack.

  "Master Keeper Renn?" Her voice sounded thin against the ship’s deep thrum. "The splice interval checksums… they verify. But they verify *both* ways."

  Renn, face etched with the patient lines of forty years maintaining the Long Count, frowned. "Explain, Auditor."

  Kaelen pulled up the schematics. "The Reckoning for splice fatigue uses cumulative stress values. Massive numbers. We’ve only ever computed values up to… say, this threshold." She highlighted a number dwarfing any practical application aboard. "The standard addition function verifies our current tables. But… so does this." She displayed a modified function. "It matches addition perfectly for every value we’ve *ever* actually used or recorded. But beyond our threshold… it diverges. Wildly."

  Renn leaned closer. "Diverges how?"

  "If it’s this function," Kaelen pointed, "and we use it for the *next* major splice interval computation… the result suggests the hull integrity fails catastrophically in the ninth century. Centuries before we reach Eridani. Standard addition says we’re fine." She swallowed. "Every record, every correction log, every certified calculation from the last two hundred years… they fit both interpretations equally well. There’s no discrepancy *within* our practice to tell us which rule we’ve actually been following."

  The air grew colder. The Reckonings weren't just procedure; they were the ship’s skeleton. The Charter of Sameness etched above the vault door declared: *The Reckonings stand unchanged since Day Zero, the anchor of our voyage.* Now the anchor seemed adrift.

  "Absurd," snapped Vannis, Systems Coordinator, summoned to the chamber. Her disposition was as sharp as her tools. "The rule *is* addition. It’s what we *do*. Watch any Keeper tally rations. It’s ingrained. We’re *disposed* to add. This… *thing*," she jabbed at Kaelen’s screen, "isn’t what anyone would naturally do beyond the threshold."

  "But who’s *done* it beyond the threshold?" Kaelen countered quietly. "No computation, no problem, has ever required it. Our ‘disposition’… it’s only defined for numbers we’ve encountered. What *would* we do with a number larger than any sum ever conceived on the *Palinode*? We don’t know. And what counts as a *mistake*? If someone *did* use the deviant function for a small sum, we’d correct them. But for the giant sums? Our practice is silent. The disposition runs out."

  Vannis scowled. "Then it’s the simplest rule! Addition is elegant. This deviant function is… contrived."

  "Is it?" asked Renn, his voice heavy. "Look at its definition here. It’s only a few symbols longer. Simplicity… it’s in the eye of the beholder. The vault holds the Day Zero Archives. The original formulations. *That* will settle it."

  ---

  The Day Zero Vault breathed the cold, sterile scent of preserved air. Chief Archivist Jara, gloved hands trembling slightly, unsealed the primary ledger. The symbols for the Splice Interval Reckoning glowed faintly on the ancient screen.

  "See?" Jara said, relief tentative. "The core formula. Unchanged."

  Kaelen leaned in. "But the notation… the symbols for the operation itself, the ‘plus’ sign… Master Keeper Renn, how was *that* symbol’s meaning passed down?"

  Renn paused. "Through… demonstration. Correction. The Keepers’ training. We point to ‘2 + 2 = 4’ and correct trainees who say ‘5’. We never wrote a separate rule defining ‘+’ itself."

  "Exactly," Kaelen said. "The symbol on the screen… it’s just a mark. How do we know the founders didn’t intend *this* deviant function by it? Their training corrected small sums, just like ours. Their practice, like ours, never reached the giant numbers. The symbol itself doesn’t scream ‘addition’ any more than it screams ‘deviant function’. It’s inert. We have to *take* it one way or the other… based on *our* practice, which is exactly what’s in question."

  Jara traced the glowing symbol. "But we *see* it as addition. We grasp the intention." Her voice held a desperate certainty.

  Renn closed his eyes, concentrating. "I try to look inward… to *see* what the rule demands for a giant sum. I feel… conviction. It *must* be addition. It feels… right." He opened his eyes, looking troubled. "But Kaelen feels the same conviction about the *deviant* function when she looks at her derivation. That inner seeing… it doesn’t point to anything *outside* itself. It’s just another feeling. How do I know my ‘seeing’ isn’t just my training… training that might itself be following the deviant rule unknowingly? The feeling tells me nothing new. It just echoes the practice." He looked at the ledger, suddenly alien. "The vault… it holds marks. Not meanings."

  Silence descended, thick as vault air. The Charter of Sameness seemed to loom larger, its claim now a riddle. *Unchanged?* But unchanged as *what*? The marks, yes. The practice… was it the same *rule*? The question hung, unanswerable by records, dispositions, simplicity, or inner light. The ship hummed on, oblivious to the abyss beneath its feet.

  Vannis slammed a fist lightly on the console. "This is paralyzing! The ninth-century splice *will* happen. We need to compute it *now*. What do we *do*?"

  Renn straightened, the lines on his face deepening, but a strange calm settling in his eyes. He looked not at the vault, nor at the schematics, but at Kaelen, then Vannis, then Jara.

  "We go on," he said, his voice firm, resonant. "As Keepers."

  "But *how*?" Jara pleaded. "Which rule?"

  "The Reckonings," Renn stated, "are not ghosts in the vault, or secrets in our minds. They live *here*." He gestured around the chamber, encompassing them all. "In this room. In every correction in the mess hall over a ration tally. In the way we train the next auditor, Kaelen." He met her anxious gaze. "We induct you. Today. Not because the vault tells us to, but because we, the Keepers now living, see your understanding, your care, your commitment to *our way* of calculating, of correcting, of *going on*."

  He walked to the Charter plaque. "The Charter speaks of Sameness. But perhaps ‘sameness’ isn’t about a frozen, disembodied rule trapped in Day Zero. Perhaps it’s about *this*." He tapped his chest, then pointed to each of them. "The sameness of holding each other accountable. Of recognizing when another Keeper ‘goes on’ in the way that fits *our* inherited practice, the way that sustains the ship. We don’t have a super-fact. We have each other. We have the next step."

  He turned back to the group. "We compute the ninth-century splice using the function we are *now* trained to use, the function embedded in *our* current tables and corrections – the function that feels continuous with every sum we’ve ever verified together. We do it *as* Keepers, trusting not in a hidden fact, but in the shared practice that has brought us this far. And we certify it, as we always have. Not because we *know* it matches a phantom Day Zero intention, but because it is what we, the community of the *Palinode*, *do* and *hold each other to do*."

  Renn placed a hand on Kaelen’s shoulder. "Auditor Kaelen, re-derive the splice interval for the ninth century. Use the tables. Use the methods. Do it as a Keeper would. We will witness. We will correct if you stray from *our* path. That is the Reckoning. That is the only anchor we have. And it is enough."

  Kaelen looked at the expectant faces – not demanding an unattainable certainty, but offering shared responsibility. The monstrous numbers on the screen lost some of their terror. They were just… the next step in the practice. She took a deep breath, her fingers hovering over the console, not seeking an invisible rulebook, but preparing to *go on*, watched by her community, bound by the only reckoning that mattered: the one they made together, moment by moment, correction by correction, into the uncertain dark.

  The hum of the *Palinode* deepened. It was no longer the hum of certainty, but the hum of a shared voyage, held together by the fragile, vital thread of going on in the same way – whatever that way ultimately was.
