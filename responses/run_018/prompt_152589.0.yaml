  | Melody                       | Statue                            | **Strong**     | Both are patterns/forms dependent on a substrate; destruction doesn't annihilate the substrate. |
  | Instrument (wood/strings)    | Lump of clay                      | **Strong**     | Both are the physical substrate that "hosts" the form. |
