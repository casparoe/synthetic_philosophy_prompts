  | Audience                     | Observer/perceiver of the statue  | **Partial**    | Both "complete" the experience. But the statue exists even if unobserved; a melody requires a performance to exist. |
  | Changing instruments (e.g., piano → violin) | Reshaping clay into a new statue | **Broken**     | Melodies survive substrate changes; statues don't. Reshaping clay destroys the original statue (no "transplantation"). |

