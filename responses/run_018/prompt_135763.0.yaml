  Here's the joke structured as a debate:

  **The Scene:** A stuffy academic conference hall. Two historians at a shared podium.

  **Great Man Guy:** (Adjusts tweed jacket, puffs chest) "And thus, the *entire* economic collapse of the 5th Century can be traced directly to Emperor Theodoric the Tremulous waking up with indigestion on the morning of the Grain Tax Edict! A single sour grape, gentlemen! History turns on such moments!"

  **Geohistorian:** (Sighs, pushes up glasses, points emphatically at a large map behind them) "Respectfully, colleague, you're mistaking the froth for the ocean. The *real* story is the relentless northward creep of the *Ariditas Maxima* climate belt over the preceding 300 years! It wasn't Theodoric's tummy ache, it was the cumulative desiccation of the southern breadbasket provinces!"

  **Great Man Guy:** (Waving a dismissive hand) "Poppycock! It was Theodoric! Or perhaps his chamberlain's incompetent sandal-strap tying! Individuals drive events! That's the *long doo-ray* for you!" (He mispronounces it badly).

  **Geohistorian:** (Patiently, tapping the map) "It's *longue durée*. And no. Consider the mighty Glacier Serpentis, inching southward millimeter by millimeter, century by century, altering watersheds, cooling microclimates..."

  **Great Man Guy:** (Interrupting) "Glaciers? Watersheds? BORING! Give me a good assassination plot! A royal tantrum! A misplaced decree! That's where the *drama* is!"

  **Geohistorian:** (Opens mouth to protest again, but suddenly...)

  **THOOM... CRAAAAACK... RUMMMMMBLE!!!!**

  (A sound like rolling thunder, but deeper and colder, echoes through the hall. Dust shakes from the rafters. The large map depicting Glacier Serpentis visibly vibrates.)

  **Geohistorian:** (A small, satisfied smile playing on their lips) "...See? It seems Glacier Serpentis has just calved a rather significant iceberg into the shipping lanes. Completely rerouting next season's imperial grain fleet. Centuries of slow movement, colleague. Not a decree in sight." (They nod towards the now-silenced Great Man Guy). "The deep currents have the floor."

  **(The Great Man Guy stares, open-mouthed, at the still-quivering map as the rumble fades.)**
