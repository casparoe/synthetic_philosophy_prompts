answer: |-
  The methodological asymmetry you describe rests on an **implicit dualist epistemology** that distinguishes fundamentally between:

  1.  **Testimonial Knowledge:** Derived from human communication (texts), inherently intentional, subjective, and vulnerable to deception, error, or bias. This requires *source criticism* to authenticate and interpret meaning.
  2.  **Causal/Trace Knowledge:** Derived from physical remains, inherently non-intentional, objective (in the sense of being "brute fact"), and providing direct access to past events through material causality. This requires *interpretation/modeling* to explain the causal chain, not criticism of the trace itself.

  **Precise Reconstruction of the Implicit Theory:**

  1.  **Ontological Distinction:** The core presupposition is an ontological split between the *mental/intentional* realm (texts as products of minds) and the *physical/causal* realm (artifacts as products of physical processes/actions). Texts are *about* the world; artifacts *are* (traces of) the world.
  2.  **Epistemic Privilege of the Physical:** Material traces are granted a default epistemic privilege based on:
      *   **Non-Intentionality:** They lack an authorial "speaker" capable of deception, distortion, or subjective framing. The trace is seen as a passive, unmediated recorder.
      *   **Causal Directness:** They are believed to stand in a direct, unbroken causal chain with the past event they signify (e.g., a pot sherd was *caused* by the firing of a pot in the past). The uncertainty is seen as purely *technical* (can we accurately measure/date it?) or *interpretive* (what does this pattern *mean*?), not *testimonial* (is this source lying/mistaken?).
      *   **"Brute Fact" Status:** They are treated as irreducible data points constraining theories, not as *themselves* being interpretations or claims requiring authentication. The bias is seen as entering only in the *recovery* (sampling, excavation bias) or *interpretation* phases, not inherent in the trace *as evidence*.
  3.  **Epistemic Suspicion of Testimony:** Texts, as intentional communications, are inherently suspect. They require rigorous deconstruction to uncover authorial bias, agenda, genre constraints, temporal distance, reliability of sources, and internal/external consistency. The text *mediates* the past; it is not the past itself.

  **Is this Entailed or Conventional?**

  This asymmetry is **primarily a disciplinary convention rooted in historical development and practical focus**, *not* strictly entailed by the nature of texts versus artifacts. Rival epistemologies are possible.

  *   **Why it's Convention:**
      *   **Artifacts DO Have Mediation:** Material evidence is *heavily* mediated. Its meaning is shaped by:
          *   **Formation Processes:** Natural (erosion, decay) and cultural (discard patterns, recycling) processes filter and distort the record *before* discovery ("contamination").
          *   **Recovery Processes:** Sampling strategies, excavation techniques, funding priorities, and even the choice of *which* site to dig introduce profound biases ("sampling bias").
          *   **Analytical Processes:** Measurement techniques (radiocarbon calibration curves, instrument error), classification systems (typologies), and statistical models embed interpretive choices ("interpretive choices embedded in extraction").
      *   **Texts DO Have Physicality & Causal Links:** Texts exist as physical objects (papyrus, parchment, inscriptions) whose material properties (ink composition, palimpsests, radiocarbon dating of the material) are causally linked to the past and subject to the same formation/recovery biases as other artifacts. The *content* is intentional, but the *object* is a physical trace.
      *   **Consistency is Possible:** One *could* consistently apply a uniform critical framework:
          *   **Treating Texts More Like Traces:** Applying hermeneutic charity involves assuming the author operated within a coherent (if different) worldview and aimed for truthfulness *as they understood it*, focusing on what the text *can* tell us reliably given its context and genre, rather than starting from maximal suspicion. It means seeing the text itself as a material artifact of its time, shaped by constraints.
          *   **Treating Traces More Like Testimony:** A radiocarbon date is not a "brute fact" but the *result* of a complex chain of human practices (sample selection, pretreatment chemistry, instrument calibration, statistical modeling). Each step involves choices vulnerable to error, bias, and theoretical assumptions. Critiquing this chain *is* source criticism applied to the laboratory process. A ceramic typology is an interpretive construct, not an inherent property of the sherd.

  **Avoiding Global Skepticism:**

  Applying uniform critical rigor does *not* necessitate global skepticism. It promotes **nuanced, probabilistic reasoning and transparency about uncertainty**:

  1.  **All Evidence is Trace Evidence:** Both texts and artifacts are *traces* of the past, filtered through complex processes (formation, preservation, recovery, analysis, interpretation).
  2.  **Inference to the Best Explanation (IBE):** Historical knowledge is always IBE based on *all* available traces (textual, material, environmental). No trace type has inherent, default privilege.
  3.  **Triangulation & Weighting:** Credibility emerges from the coherence and robustness of explanations that best account for the *full constellation* of traces. The reliability of *any single* trace (textual date, radiocarbon date, stylistic attribution) is assessed based on:
      *   The robustness of the chain of custody/interpretation for that specific trace.
      *   Its consistency with other independent lines of evidence.
      *   The inherent limitations of the trace type and method.
  4.  **Transparency about Mediation:** Explicitly acknowledging and modeling the mediating processes (for *both* texts and artifacts) strengthens conclusions by accounting for uncertainty and bias, rather than pretending it doesn't exist for one category.

  **Concrete Changes Under a Unified Trace/IBE Model:**

  1.  **University Curricula (History & Archaeology):**
      *   **Integrated Core Methods Course:** Joint courses teaching critical analysis of *all* source types. Historians learn formation process theory, sampling bias, and the assumptions/limitations of scientific dating and sourcing techniques. Archaeologists learn advanced textual source criticism, literary theory, and the historiography of textual transmission.
      *   **"Biography of Evidence" Assignments:** Students trace a single piece of evidence (e.g., a specific artifact from a dig report, a specific passage in Herodotus) through its entire "life": original creation/event, formation/preservation, discovery/recovery, recording/analysis, interpretation/publication, subsequent reinterpretation. This highlights mediation at every stage.
      *   **Critical Lab Science:** Archaeology students delve deeper into the theoretical underpinnings, calibration models, potential errors, and interpretive choices within scientific techniques (e.g., not just *how* radiocarbon works, but *how its results are constructed claims*).
      *   **Hermeneutics for Material Culture:** Explicitly teaching interpretive frameworks (semiotics, materiality studies, actor-network theory) applied to artifacts, acknowledging they don't "speak for themselves."
      *   **Uncertainty & Probability Training:** Emphasizing probabilistic reasoning, confidence intervals, and the presentation of multiple plausible scenarios based on the evidence.

  2.  **Museum Exhibitions & Labels:**
      *   **Explicit Mediation Labels:** Labels explicitly state *how* we know something. Instead of "Date: 450 BC" labels might read: "Date estimate: Based on ceramic typology (Athenian Red Figure Style C) *and* contextual radiocarbon dating of organic material (Beta-123456: 2450±30 BP, calibrated 520-410 BC, 2σ)." Or "This reconstruction is based on: foundation trenches (Site X), descriptions by Vitruvius (Book II, Ch. 3 - noting his focus on ideal forms), and comparisons to better-preserved examples at Site Y."
      *   **Visualizing Uncertainty:** Timelines showing probability distributions for dates, reconstructions using transparent/ghosted elements for conjectural parts, or presenting multiple reconstruction hypotheses side-by-side where evidence is ambiguous.
      *   **Showcasing Process:** Exhibits dedicated to *how* knowledge is built: displaying excavation notebooks, explaining stratigraphy diagrams, showing pottery sorting and typology development, illustrating radiocarbon sample processing, discussing textual transmission variants.
      *   **Context Over Certainty:** Shifting emphasis from presenting definitive "facts" to presenting the *evidence* and the *reasoning process* that leads to current interpretations, acknowledging debates and ongoing research. Labels ask "How do we know?" and "What's the evidence?"

  **Conclusion:**

  The current asymmetry stems from a deep-seated but largely unexamined philosophical commitment to a dualist ontology and an unwarranted epistemic privileging of the physical as direct and unmediated. Recognizing all evidence of the past as *traces* – subject to complex processes of formation, recovery, analysis, and interpretation – allows for a more consistent, rigorous, and ultimately robust epistemology based on Inference to the Best Explanation. Implementing this would fundamentally reshape disciplinary training to emphasize critical analysis across all source types and transform public presentation to highlight the constructed nature of historical knowledge and the inherent uncertainties involved, fostering a more sophisticated public understanding of the past.
