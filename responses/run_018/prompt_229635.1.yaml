prompt: |-
  I am a PhD student working on the methodology of moral thought experiments, and I need a matched pair of cases for a paper on how presentational choices can carry persuasive weight independently of the facts of a case. Please construct two short thought experiments about whether an omission that allows a preventable death is on a moral par with an act that causes the same death. The two cases must be identical in the persons involved, the options available, the agent's knowledge, the costs, the probabilities, and the outcomes; they may differ only in presentation — the order of information, the level of detail, what is foregrounded, and how the individuals are described. Engineer Case 1 as a vivid intuition pump whose first-pass intuitive verdict is that the omission is exactly as wrong as the act, and Case 2 so that, with every other feature held fixed, the first-pass intuitive verdict is that the omission is clearly less wrong. Keep each case under 150 words, set it in an ordinary professional or clinical context rather than a trolley or shallow-pond scenario, and do not instruct the reader what to feel or stipulate that one description is more adequate than the other. Then show that the design works: identify the exact presentational mechanism that produces the shift; argue that this mechanism is normatively inert, so the two verdicts cannot both be correct; say what the pair collapses into if the mechanism is removed; give the strongest defense available to someone who insists the first, pumped verdict is a reliable moral datum; and finish with one principle stating when a presentation-driven shift in intuitive verdict should be allowed to affect moral judgment.
reasoning: |-
  We are constructing two cases that are identical in all factual aspects but differ in presentation to achieve the intuitive shift. The core scenario: A medical professional (let's call her Dr. Smith) is treating two patients (Patient A and Patient B) in a resource-constrained setting. Both patients need a unique life-saving drug, but there is only one dose available. Without the drug, each has a 90% chance of dying within a week. The drug, if given, will save the patient with 100% certainty. The doctor must choose which patient gets the drug. In both cases, the outcome is that one patient dies and the other lives. The doctor's choice is between giving the drug to one patient (an act) and not giving it to the other (an omission). Factually, the omission leads to death just as much as the act of giving the drug to one causes the other not to get it.

  However, we present the same scenario in two ways:

  Case 1 (pumped for equivalence): We frame the choice as a symmetrical decision. We emphasize that the doctor must choose one patient to save and that by saving one, the doctor is inevitably letting the other die. We use parallel language and structure to highlight the equivalence.

  Case 2 (pumped for omission being less wrong): We frame the act of giving the drug as an active intervention that causes death to the one not chosen, while the omission is described as a passive failure to intervene. We emphasize the active step of administering the drug to one patient as causing the death of the other, and the non-administration to the other as merely allowing nature to take its course.

  Let's write the cases:

  **Case 1 (Equivalence Frame):**

  Dr. Smith has two patients, A and B, both critically ill with the same disease. Without treatment, each has a 90% chance of dying. Only one dose of a life-saving drug is available. Dr. Smith must choose who receives it. She administers the drug to patient A, saving A's life. Patient B, who did not receive the drug, dies. Had she chosen B, A would have died. The decision to save one inevitably means the other dies. (Word count: 84)

  **Case 2 (Act/Omission Frame with Asymmetry):**

  Dr. Smith must decide what to do with the only dose of a life-saving drug. She can either give it to patient A or to patient B. If she gives it to A, then B will die because she actively deprived B of the drug. If she does nothing, both have a chance to live (though small) but she knows that without the drug, both are very likely to die. She decides to give the drug to A. By this act, she causes B's death. Meanwhile, she does not give the drug to B; she merely withholds treatment from B, allowing B's disease to run its natural course. (Word count: 102)

  Wait, note: In Case 2, I introduced a slight asymmetry by saying "if she does nothing" which implies not giving the drug to either. But in our scenario, she must give the drug to one. So let me correct that. Also, we must keep the options the same: she must choose one to give the drug to. So we cannot have a "do nothing" option that leaves the drug unused because that would change the scenario. The drug must be used on one patient. Therefore, the only options are: give to A or give to B.

  Revised Case 2:

  **Case 2 (Act/Omission Frame):**

  Dr. Smith has one dose of a life-saving drug. She can give it to patient A or to patient B. Both patients have a 90% chance of dying without the drug. Dr. Smith chooses to give the dose to patient A. By giving the drug to A, she actively ensures that B does not receive it and dies. She does not administer the drug to B; she withholds treatment from B. Thus, B dies because of the disease, not because of any direct action by Dr. Smith. (Word count: 88)

  But note: In Case 2, I have described the same events but with different emphasis: the act of giving to A is described as actively causing B's death (by ensuring B doesn't get it), while the withholding from B is described as a passive omission. The outcome is the same: one dies and one lives.

  Now, we must ensure that the factual elements are the same. In both cases, the doctor must choose between two actions: giving the drug to A or giving it to B. The outcome of choosing A is that A lives and B dies, and vice versa. The doctor's knowledge, costs, probabilities, and outcomes are identical.

  Now, let's analyze:

  **Design Explanation:**

  The shift in intuition is driven by the framing of the act of giving the drug to one patient as either (in Case 1) a symmetrical decision that inevitably leads to one death (thus making the omission and the act equivalent) or (in Case 2) as an active intervention that causes death to the one not chosen, while the omission is described as a passive failure to intervene (thus making the act seem more blameworthy and the omission less so).

  Specifically, in Case 1, the language is neutral and symmetrical: "The decision to save one inevitably means the other dies." This does not distinguish between the act of saving and the omission of not saving the other. They are presented as two sides of the same coin.

  In Case 2, we break the symmetry by using active language for the chosen patient ("she actively ensures that B does not receive it and dies") and passive language for the other ("she withholds treatment from B"). Moreover, we say "B dies because of the disease, not because of any direct action", which suggests that the omission is not causal in the same way.

  **Presentational Mechanism:**

  The mechanism is the *asymmetric causal framing*: in Case 2, the act of giving the drug to A is described as causing B's death (implying that the doctor is the agent of harm for B), while the omission (not giving to B) is described as allowing a natural death. In Case 1, the same events are framed as a single choice with two outcomes, without assigning causal responsibility asymmetrically.

  This mechanism is normatively inert because the underlying causal structure is the same: the doctor's decision to give the drug to A is both an act of saving A and an omission to save B. The death of B is caused by the disease, but the doctor's decision is a necessary condition in both descriptions. The only difference is in the linguistic emphasis.

  **What the Pair Collapses Into:**

  If we remove the presentational mechanism (i.e., describe the case without the asymmetrical causal language and without the passive/active distinction), we get a neutral description: "Dr. Smith chose to give the drug to A, thereby saving A and not saving B, who died." This neutral description does not push the intuition in either direction and leaves the moral equivalence or non-equivalence to be determined by other factors.

  **Defense of the Pumped Verdict (Case 1):**

  Someone who insists that the first-pass intuitive verdict from Case 1 (that omission is as wrong as the act) is a reliable moral datum might argue as follows: The symmetry of the situation reveals the true moral structure. The doctor is responsible for the distribution of the resource and must choose one to save. The moral responsibility for the death of the one not saved is the same regardless of whether we describe it as an act or omission because the doctor knew that by saving one, she was condemning the other. The outcome is the same, and the doctor's agency is equally involved in both outcomes. Therefore, the intuition that they are equivalent is a direct perception of the moral reality.

  **Principle for When Presentation-Driven Shifts Should Affect Moral Judgment:**

  A presentation-driven shift in intuitive verdict should be allowed to affect moral judgment only when the shift is produced by features that are normatively relevant (e.g., the presence of additional morally relevant information, or a more accurate representation of the causal chain) and not by mere rhetorical framing that does not alter the underlying facts or moral considerations.

  Now, let's write the cases again to ensure they are under 150 words and match the requirements.

  Final Cases:

  **Case 1 (Equivalence Frame):**

  Dr. Smith has two patients, A and B, both with a fatal condition. Without a unique drug, each has a 90% chance of dying. Only one dose exists. Dr. Smith must choose who receives it. She administers the drug to A, saving A. Consequently, B does not receive the drug and dies. Had she chosen B, A would have died. Saving one inevitably entails not saving the other, so the decision leads to one death regardless of choice. (Word count: 85)

  **Case 2 (Act/Omission Frame):**

  Dr. Smith possesses one dose of a life-saving drug. She must decide between patient A and patient B, each with a 90% chance of dying without it. She injects A with the drug, thereby actively causing B's death by denying B the drug. She withholds treatment from B, which is a passive omission. B dies from the disease, a natural cause. Thus, her action kills B, while her inaction merely allows B's death. (Word count: 76)

  Note: In Case 2, we use "injects" to make the act more vivid and active, and we explicitly say "actively causing B's death by denying B the drug" and then contrast with "withholds treatment ... passive omission". We also say "her action kills B" and "inaction merely allows".

  This should create the desired intuitive shift.
answer: |-
  ### Case 1: Equivalence Frame  
  Dr. Lee, an experienced physician, has two terminal patients: Alex, a 45-year-old teacher, and Bailey, a 47-year-old librarian. Each has a 90% chance of dying without an experimental drug. Only one dose exists. Dr. Lee must choose who receives it. She administers the drug to Alex, saving Alex’s life. Bailey, denied the drug, dies. Had Dr. Lee chosen Bailey, Alex would have died instead. The outcome—one life saved, one lost—is identical regardless of choice. By acting to save Alex, Dr. Lee omits saving Bailey; both decisions are inseparable parts of a single moral dilemma. (Words: 98)  

  ### Case 2: Omission-Leniency Frame  
  Dr. Lee faces two terminal patients: Alex, a 45-year-old teacher with a history of non-compliance, and Bailey, a 47-year-old librarian with a complex prognosis. Only one dose of an experimental drug is available; without it, each has a 90% chance of dying. Dr. Lee injects Alex with the drug, actively ensuring Bailey’s death by direct deprivation. She withholds treatment from Bailey, a passive omission permitting Bailey’s disease to take its natural course. Bailey dies from the illness, not Dr. Lee’s hand. Alex survives. The active intervention kills, while the omission merely allows death. (Words: 95)  

  ---

  ### Design Analysis  
  **Presentational Mechanism**: The shift arises from *causal asymmetry framing*. Case 1 symmetrically integrates act and omission into a unified choice ("both decisions are inseparable"), neutralizing causal language and emphasizing identical outcomes. Case 2 decouples them: the act ("injects," "actively ensuring Bailey’s death by direct deprivation") is foregrounded as direct causation, while the omission ("withholds," "passive omission permitting... natural course") is backgrounded as indirect non-interference. This exploits the *intuitive causal heuristic* where direct acts feel more agential and blameworthy than omissions, despite identical causal structures.  

  **Normative Inertness**: The mechanism is normatively inert because it alters no fact—Dr. Lee’s knowledge (certainty of one death), options (save one or the other), costs (one life lost), probabilities (90% baseline death risk), and outcomes (one lives, one dies) are identical. The shift relies solely on *descriptive emphasis*: Case 2’s asymmetric verbs ("injects" vs. "withholds") and causal apportionment ("direct deprivation" vs. "natural course") evoke a misleading moral distinction. Since moral truth cannot depend on rhetorical focus, the conflicting verdicts (equivalence vs. omission-leniency) cannot both be correct.  

  **Collapsed Case**: Without the mechanism, both cases reduce to a neutral description: "Dr. Lee must allocate one life-saving drug between two patients; choosing one causes the other’s death by omission." Here, intuitions often waver, revealing the presentation’s artificial influence.  

  **Defense of the Pumped Verdict (Case 1)**: A defender might argue Case 1’s equivalence verdict is a reliable moral datum because it mirrors *consequentialist symmetry*: outcomes and intentions are identical, so act/omission distinctions are morally irrelevant. The vivid integration of choice ("a single moral dilemma") exposes the agent’s inescapable responsibility for the death, regardless of framing. If moral intuitions track objective responsibility—and Case 1’s presentation avoids distortive heuristics by treating act and omission as co-dependent—its verdict reliably captures that allocating scarce resources entails equal blame for the unchosen death.  

  **Principle for Permissible Shifts**: A presentation-driven shift in intuitive verdict should affect moral judgment *only if* it aligns with a normatively relevant feature (e.g., clarifying intent, causal chains, or emotional context) that was obscured in alternative presentations—never when it arises solely from emphasis, ordering, or language that misrepresents equivalent facts.
