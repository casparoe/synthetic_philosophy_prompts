answer: |-
  Here is my credence breakdown for the claim that cyclical theories depend on implicit linear baselines:

  **Final credence: 0.70**  
  *(Slightly higher than yours due to stronger weighting on sub-question (i))*

  ---

  ### Sub-Question Breakdown:
  1. **Does identifying historical cycles *require* a directional baseline?**  
     *Credence: 0.85*  
     Identifying a "cycle" necessitates defining start/end points (e.g., "decline" or "golden age"), which implies a directional metric (e.g., complexity, stability, or territorial control). Purely relational comparisons (e.g., "Society X resembles earlier Society Y") lack explanatory power without a framework for *why* certain patterns matter. For example, calling Rome's fall a "cycle completion" requires an implicit baseline of imperial cohesion as "health." Without directional markers, cyclicality reduces to trivial repetition (e.g., "societies change"), losing diagnostic value.

  2. **Do canonical theorists *implicitly rely* on linear metrics despite rhetoric?**  
     *Credence: 0.90*  
     - **Polybius:** Measures cycles by directional shifts in *political virtue* (monarchy → tyranny → aristocracy → oligarchy → democracy → ochlocracy), where "virtue" implies institutional quality.  
     - **Ibn Khaldun:** *Asabiyyah* (solidarity) is directional: its accumulation enables state-building; its dissipation causes collapse. "Rise" and "fall" map to capacity to sustain complex institutions.  
     - **Spengler:** Cultures "morph" through life stages (spring → winter), but "fulfillment" and "decline" rely on linear benchmarks like artistic innovation or imperial reach.  
     - **Toynbee:** "Challenge-and-response" success is judged by directional outcomes (e.g., territorial expansion, technological growth).  
     All invoke implicit linearity by framing cycles as trajectories of growth/decay.

  3. **Is this dependency *fatal* to their status as genuine alternatives?**  
     *Credence: 0.45*  
     Dependency undermines *pure* autonomy but doesn’t negate their value as alternatives. Cyclical theories reorganize linear data into patterns emphasizing recurrence, not cumulative progress. They reject teleology (e.g., Marx’s communism, Whig history’s liberty arc) and spotlight *rhythms* of instability. This offers distinct insights—e.g., Ibn Khaldun explains nomadic conquests as structural resets, not "backwardness." The dependency is architectural but not fatal; it makes them *correctives* to linear narratives, not independent paradigms.

  ---

  ### Credence Calculation:  
  - **Combined:** (i) 0.85 × (ii) 0.90 × (iii) adjustment for non-fatality.  
    Since (iii) is not fatal (0.45), I use weighted multiplication:  
    `0.85 (i) × 0.90 (ii) = 0.765` → scaled by (1 - 0.55 fatality) ≈ **0.70**.  
    *(More precisely: High confidence in (i)/(ii) lowers the impact of (iii)’s ambiguity.)*

  ---

  ### Sensitivity & Key Movers:  
  **Most sensitive to sub-question (i)** (0.85). A convincing counterexample could lower it significantly.  
  - **What would lower my credence?** A cyclical theory using *only* relational phases (e.g., "all empires have tax collectors, then soldiers, then poets") with *no* valuation of "strength" or "decline." If purely descriptive (e.g., seasonal analogies without implying "winter is worse"), directional baselines become less essential. Vico’s *ricorsi* (recurring epochs) *might* approach this, but even he frames "barbarism" as a negative regression.  
  - **What would raise it?** Demonstrating that even "neutral" cycle definitions (e.g., trade network density oscillations) require *selecting* metrics implying optimal states (e.g., "high connectivity = good").

  **Final note:** Cyclical theories are symbiotic with linearity—they *redefine* directionality as recurrent, not progressive. Their power lies in this tension, not purity. Your friend’s 0.20 likely overcorrects by ignoring how "decline" is inherently directional; your 0.65 slightly underweights (iii)’s nuance.
