prompt: |-
  In ordinary conversation, someone who asserts a claim she privately disbelieves is criticized for speaking insincerely, even if the claim turns out to be true; someone who asserts a claim that turns out false is criticized for getting it wrong, even if she believed it. Wikipedia's editing policy appears to run on neither standard. Editors are told not to insert material merely because they are sure of it; it must be verifiable in a reliable published source. An editor may be expected to present a reliably sourced claim she privately believes is false (as can happen when neutrally covering a contested topic), and unsourced material may be removed even if it is true and the editor who added it knows it from direct experience.

  Reconstruct the implicit view of assertion behind this policy, if it has one. Does it presuppose a truth norm, a belief norm, a knowledge norm, or some distinct source- or provenance-based norm? In answering, distinguish what the policy strictly presupposes from what it merely fits well with, consider whether Wikipedia edits should even be modeled as assertions of the underlying claims rather than as reports about what sources say, and explain what would have to change if the encyclopedia were run instead on the rule that a claim may be included only if the editor knows it.
reasoning: |-
  Okay, the user wants me to reconstruct the implicit view of assertion behind Wikipedia's editing policy and analyze what norm it follows. Let me start by understanding the key points from the query. The user mentions that in ordinary conversation, sincerity and truth matter, but Wikipedia's policy is different. Editors must cite reliable sources regardless of personal belief. The user asks whether this policy presupposes a truth norm, belief norm, knowledge norm, or something else.

  First, I need to recall Wikipedia's core policies: Verifiability, No Original Research, and Neutral Point of View. Verifiability requires that any content must be backed by reliable published sources. No Original Research means editors can't add their own analysis or unpublished findings. Neutral Point of View ensures that all significant perspectives are represented fairly.

  The user also wants to know if edits should be seen as assertions of the claims or reports about sources. This is crucial. If an editor cites a source, are they asserting the truth of the claim or just reporting that the source says it? Given Wikipedia's policies, it's more about reporting what sources state. That makes sense because the editor isn't vouching for the claim's truth personally; they're just providing verifiable information.

  Next, norms of assertion. The truth norm would require assertions to be true. But Wikipedia allows false information if it's from a reliable source, as long as it's presented neutrally. So truth isn't the primary concern. Belief norm? Editors might add claims they disbelieve as long as sources back them. Knowledge norm? Editors don't need personal knowledge; they rely on sources. So the norm here seems to be about verifiability through reliable sources, not personal knowledge or belief.

  Now, the implicit norm behind Wikipedia's policy is a verifiability norm. The appropriateness of an assertion depends on whether it can be cited to a reliable source. The community enforces this by removing unsourced content, regardless of truth or editor's belief. This shifts the responsibility from the editor to the sources.

  The user also asks what would change if Wikipedia required editors to know the claims. That would shift to a knowledge norm. Editors would only add what they personally know, eliminating the need for citations. But this undermines Wikipedia's collaborative and verifiable model. It would limit content to what editors know firsthand, reduce coverage, and increase bias since editors might avoid topics they aren't experts in. Current policies allow leveraging collective sources, which is more scalable for an encyclopedia.

  I should also address the distinction between presupposition and what fits well. The policy strictly presupposes a verifiability norm. It doesn't require truth because false but well-sourced info can stay. It doesn't require belief since editors add content they disagree with. Knowledge isn't needed either. However, the policy fits well with a weaker knowledge norm where knowledge comes from trusted sources, but it's not required. The core is verifiability.

  In summary, Wikipedia's model is about reporting sources, not asserting truths. The norm is verifiability. Switching to a knowledge norm would fundamentally alter how Wikipedia operates, making it less comprehensive and more reliant on individual expertise. The user's deeper need might be understanding how Wikipedia balances reliability with neutrality and verifiability, possibly for academic purposes or content policy analysis.
answer: |-
  Based on the description of Wikipedia's editing policy (Verifiability, No Original Research, Neutral Point of View), the implicit view of assertion operationalized is fundamentally **a reporting norm based on verifiable provenance**, distinct from truth, belief, or personal knowledge norms.

  ### Reconstruction of the Implicit Norm: The Verifiability/Provenance Norm

  1.  **The Core Principle:** An editor's insertion of a claim is permissible (and appropriate) **if and only if** the claim is verifiably attributable to a reliable, published source. The *provenance* of the claim (its existence in a reliable public record) is paramount.
  2.  **Not Truth-Based:** The policy does *not* presuppose a truth norm. Claims can be included even if false, as long as they are reliably sourced and presented neutrally (e.g., representing a significant viewpoint in a controversy). Conversely, true claims *without* reliable sourcing must be removed.
  3.  **Not Belief-Based:** The policy explicitly rejects a belief norm. Editors are *required* to include well-sourced claims they privately believe are false (to maintain neutrality). Including claims solely because the editor believes them (without sourcing) is prohibited. Sincerity of belief is irrelevant to inclusion.
  4.  **Not Knowledge-Based:** The policy rejects a knowledge norm. Editors are prohibited from adding claims based on personal knowledge, even if that knowledge constitutes genuine knowledge (e.g., direct experience). Knowledge without verifiable, published provenance is insufficient. Conversely, editors are *required* to add claims they *don't* know to be true (but which are reliably sourced) if they are relevant and significant.
  5.  **Distinct Source/Provenance-Based Norm:** The core norm is **Verifiability through Reliable Provenance**: "A claim may be asserted in this context (a Wikipedia article) only if it is traceable to a reliable, published source." The editor's role is primarily that of a **reporter** or **compiler** of publicly verifiable statements, not an original asserter or guarantor of the claim's truth.

  ### Modeling Edits: Reports, Not Direct Assertions

  Crucially, **Wikipedia edits should be modeled as reports about what sources say, not as direct assertions of the underlying claims.**

  *   **The "Assertion":** When an editor adds "Event X occurred," they are not (within the framework of Wikipedia policy) asserting "Event X occurred" as a personal factual claim. They are asserting: **"Reliable Source Y states that Event X occurred."**
  *   **Evidence:** The requirement for citation is structural evidence of this. The citation *is* the essential component of the "assertion" being made by the editor. Removing the source invalidates the edit, regardless of the underlying claim's truth or the editor's knowledge/belief. The policy demands that the *editor's contribution* is verifiable as a report of a source's statement.
  *   **Neutrality Reinforces This:** The NPOV policy requires presenting viewpoints as they exist in sources ("Source A says X, Source B says Y"). This is fundamentally reporting the claims of others, not endorsing them as true.

  ### Strict Presupposition vs. Merely Fitting Well

  *   **Strictly Presupposes:** The policy **strictly presupposes a Verifiability/Provenance Norm** for the *editor's contribution*. It mandates that the editor's act of adding content must be grounded in demonstrable, reliable, public sources. This is non-negotiable.
  *   **Fits Well With:**
      *   A **weaker Knowledge Norm applied to the *sources***: The policy relies on the *source* being reliable, which often *implies* the source *knew* the claim (or was in a position to know/report responsibly). However, this is indirect and not required by the policy itself for the *editor's act*. The editor doesn't need to know the source knew; they just need to know the source *said* it and that the source meets reliability criteria.
      *   **Epistemic Deference:** The policy fits well with a model where Wikipedia defers epistemic responsibility to the cited reliable sources. The encyclopedia acts as a curated aggregation of public claims deemed credible by established publication standards.
      *   **Practicality and Manageability:** The norm fits perfectly with the collaborative, scalable, and auditability needs of a massive open project. It provides clear, objective(ish) criteria for inclusion/removal that don't rely on adjudicating individual editors' mental states (belief) or direct access to reality (knowledge/truth).

  ### What Would Change Under a "Knowledge Norm" Rule

  If Wikipedia adopted the rule: "A claim may be included only if the editor *knows* it," the project would fundamentally transform:

  1.  **Elimination of Citations (as currently understood):** Citations to sources would become irrelevant or merely illustrative. The sole justification for inclusion would be the editor's personal epistemic state ("I know this").
  2.  **Collapse of Collaboration:** Collaboration on articles would become extremely difficult or impossible. How could multiple editors verify each other's "knowledge"? How could an editor trust that another editor genuinely *knew* something? Disputes would hinge on personal credibility, not verifiable evidence.
  3.  **Drastic Reduction in Scope:** Vast amounts of information currently covered – historical events the editor didn't witness, scientific concepts beyond their expertise, cultural practices outside their experience, summaries of others' arguments – would become impossible to include. Wikipedia would shrink to cover only what individual editors happen to know firsthand or through direct, demonstrable expertise (which is often hard to prove collaboratively).
  4.  **Subjectivity and Bias:** Inclusion criteria would become highly subjective. "I know this" is harder to challenge objectively than "This source says this." Bias would be harder to countermand, as editors could simply insist they "knew" their perspective was correct. Neutrality (NPOV) would be impossible to enforce systematically.
  5.  **Loss of Verifiability:** The core principle of Wikipedia – that readers can check the sources – would vanish. Readers would have no way to independently verify claims beyond trusting the editor's assertion of knowledge. This undermines the core purpose of an encyclopedia as a reference work.
  6.  **Original Research Becomes Mandatory:** Since knowledge often comes from direct experience or analysis, the prohibition on original research would be inverted. Editors would be *required* to rely on their own knowledge (which could include original synthesis or unpublished findings), fundamentally changing the nature of the content.

  **In essence:** Adopting a knowledge norm would shift Wikipedia from being a collaboratively compiled, source-based repository of publicly verifiable information towards something resembling a collection of personal testimonies or expert depositions, losing its defining characteristics of neutrality, verifiability, broad scope, and collaborative scalability. The Verifiability/Provenance norm is not just a policy choice; it's the foundational principle enabling Wikipedia to function as it does.
