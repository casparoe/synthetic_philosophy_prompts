  Then, explanations and responsibility. Legal and moral reasoning depend on identifying actual causes. If there's no single actual path, assigning responsibility becomes problematic. For example, holding someone accountable for an outcome requires a clear causal chain in the actual world, not just a possible branch. This ties into the explanatory indispensability of the actual path.

