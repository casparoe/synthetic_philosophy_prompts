answer: |-
  ### Essay Question (90-minute exam)

  **Critically evaluate the claim that treating predication as a functional mapping from properties (or concepts) to objects (e.g., the copula as a function `f: P → {x | x instantiates P}`) successfully dissolves Bradley’s regress concerning the unity of the proposition. Does this functionalist strategy genuinely eliminate the need for a unifier by internalizing the "relating" role, or does it merely disguise the regress by relocating the problem to the meta-level of how the function and its argument are jointly instantiated? In your answer, assess whether functional predication can preserve propositional unity without implicitly reintroducing a "relating relation" at this meta-level.**

  ---

  ### Model Answer (Approx. 700 words)  

  Bradley’s regress challenges relationalist accounts of propositions: if a proposition (e.g., "Socrates is wise") requires a relation (e.g., instantiation) to unify Socrates and wisdom, then a further relation seems needed to unify *that* relation with its relata, *ad infinitum*. The functionalist strategy proposes to dissolve this regress by reconfiguring predication not as a two-place relation but as the *application* of a function. On this view, the copula ("is") is a function `f` that maps the property *wisdom* to the object Socrates: `f(wisdom) = Socrates`. This model appears to internalize unity: the proposition’s coherence is secured by the function’s inherent "output-directedness" when supplied with an argument.  

  **First Move: Functional Elimination of the Relational Unifier**  
  Functionalists argue their model avoids Bradley’s regress by eliminating the need for a distinct unifier. A function is not a relation requiring its own unification with relata; it is an operation that *produces* a unified result (e.g., the truth-value "True") when applied to an argument. The unity of "Socrates is wise" is thus grounded in the singular act of functional application itself. Just as mathematical functions (e.g., `square(2) = 4`) require no additional entity to bind the function to its input, so too does `f(wisdom)` yield a unified proposition without appealing to a further relation. The "relating" is built into the function’s nature, halting the regress at the first step.  

  **Second Move: The Meta-Level Objection**  
  This dissolution is illusory, however. While functional application avoids positing a *relation* between the function and its argument, it still requires an account of how `f` and *wisdom* are combined to produce `f(wisdom)`. The functionalist must explain what *binds* the function to its argument in a specific instance. If functional application is itself a structured complex (e.g., the state of affairs *f-being-applied-to-wisdom*), then Bradley’s problem resurfaces: what unifies this complex? A further "application relation" would be needed to unite `f` and *wisdom* in this act, initiating a new regress at the meta-level. Crucially, the function cannot apply *itself*; its operation depends on an external combinatorial principle or context (e.g., logical syntax, mental acts, or Platonic participation). Thus, functionalism relocates—but does not resolve—the need for a unifier.  

  **Reasoned Judgment: Relocation vs. Resolution**  
  The functionalist strategy fails to secure genuine propositional unity. While it avoids the *relational form* of Bradley’s regress, it succumbs to a *functional analogue*. The act of applying a function to an argument is just as much in need of unification as the instantiation relation it replaces. Any appeal to the function’s "inherent dynamism" merely disguises the problem: if functions are abstract entities, their application requires a meta-ontological account of realization (e.g., how an eternal function engages a contingent object). If functions are mental, their application depends on cognitive acts, raising questions about their objectivity. In both cases, the unity of the proposition is parasitic on a prior, unexplained unity—whether logical, mental, or metaphysical—that binds function to argument. This is not dissolution but relocation. The functionalist’s "internal" unity collapses into an implicit appeal to an external combinatorial principle, functionally equivalent to Bradley’s unifier. Consequently, the regress persists in meta-form, and propositional unity remains unsecured.  

  **Conclusion**  
  Functionalism reframes predication ingeniously but cannot overcome Bradley’s core challenge. By treating the copula as a mapping, it avoids the relational regress’s structure but reintroduces the same problem under a different guise: the need for a meta-unifier for functional application. Until functionalists can explain how function and argument combine *without* invoking a further combinatorial fact, they merely obscure—rather than resolve—the regress. Propositional unity remains as enigmatic as ever.  

  ---

  ### Marking Scheme (Total: 20 points)  

  #### **Content (15 points)**  
  1.  **Functional dissolution claim** (4 points):  
      - Clear explanation of functional predication as replacing a relational copula with function application (2 pts).  
      - Accurate description of how this allegedly halts Bradley’s regress by internalizing unity (2 pts).  
      - *Weak answer mistake*: Conflating this with trope theory (e.g., treating "Socrates’ wisdom" as a particular). (–2 if committed).  

  2.  **Meta-level objection** (6 points):  
      - Identification that functional application requires an account of how function/argument combine (2 pts).  
      - Argument that this combinatorial act demands its own unifier, recreating Bradley’s regress at a meta-level (3 pts).  
      - Explanation of why the function cannot "self-apply" (1 pt).  

  3.  **Reasoned judgment** (5 points):  
      - Assessment of whether functionalism genuinely dissolves or merely relocates the regress (2 pts).  
      - Evaluation of whether propositional unity is preserved (e.g., is the output "unified" or just a new entity?) (2 pts).  
      - Conclusion grounded in the failure to avoid a meta-unifier (1 pt).  

  #### **Conceptual Clarity (5 points)**  
  - **Precision**: Avoids vagueness (e.g., "functions just work") (2 pts).  
  - **Structure**: Logical flow connecting Bradley’s regress → functionalist solution → meta-problem → verdict (2 pts).  
  - **Terminology**: Correct use of "copula," "propositional unity," "functional application," "meta-level" (1 pt).  

  #### **Penalties**  
  - **Major error**: Claiming functionalism is identical to standard relationalism. (Up to –3)  
  - **Strawman**: Misrepresenting functionalism (e.g., as nominalism). (Up to –2)  
  - **Ignoring key element**: Failing to address "joint instantiation" of function/argument. (Auto-max 12/20)  

  ---  
  This question tests deep engagement by forcing students to confront whether functionalism *restructures* or merely *repackages* Bradley’s problem, rewarding those who see that unity demands cannot be outsourced to abstract operations without meta-ontological costs.
