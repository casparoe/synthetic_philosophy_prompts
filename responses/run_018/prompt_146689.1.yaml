answer: |-
  Below is a step-by-step checklist for applying the Kalai-Smorodinsky (KS) bargaining solution to splits of shared assets. It's designed for **30-minute mediations with non-math/non-legal participants**, including clear stopping points and judgment calls. The KS method ensures gains from the split are **proportional to each person’s best-case scenario** relative to their worst-case fallback.

  ---

  ### **Kalai-Smorodinsky Checklist**  
  **Core Idea**:  
  - **Worst-case fallback (\(d_i\))**: What each person gets if they walk away (e.g., job offer, backup plan).  
  - **Best-case ideal (\(u_i\))**: What they’d get if they took everything (e.g., full asset value).  
  - **KS Solution**: Split so both gain **proportionally equal improvements** from their fallback to their ideal.  

  #### **Step 1: Set Up (5 mins)**  
  - **Goal**: Define the asset’s **total value (\(T\))** to split.  
  - **Ask**: *"What’s the cash value of what you’re splitting? (e.g., sale price of the food truck, leftover grant money)."*  
  - **Enough Info**: A **dollar amount** both parties roughly agree on.  
  - **Hard Stop If**: Parties wildly disagree on \(T\) (e.g., one says $10k, other says $50k). **Do not proceed** until you have a consensus (e.g., split the difference, get an estimate).  
  - **Judgment Call**: If values are emotional (e.g., "my art is priceless"), reframe: *"If you had to sell this today, what’s the minimum you’d accept?"*  

  #### **Step 2: Define Fallbacks (10 mins)**  
  - **Goal**: Define each person’s **walk-away value (\(d_1, d_2\))**.  
  - **Ask**: *"If we can’t agree, what’s your backup plan? Assign a cash value (e.g., a job’s signing bonus, unemployment benefits)."*  
  - **Enough Info**: A **dollar amount** for each. Examples:  
    - Job offer with $5k signing bonus → \(d_i = \$5,000\).  
    - No job, no savings → \(d_i = \$0\).  
  - **Hard Stop If**: \(d_1 + d_2 > T\) (e.g., fallbacks total $60k, but asset is $50k). **No deal**—walking away is better for both.  
  - **Judgment Call**:  
    - Non-cash fallbacks (e.g., "I can live with parents"): Convert to cash (*"How much money would that save you?"*).  
    - Sneaky values: If someone hides a good fallback (e.g., secret job offer), KS fails (see Example 3).  

  #### **Step 3: Define Ideals (5 mins)**  
  - **Goal**: Define **best-case scenarios (\(u_1, u_2\))**.  
  - **Ask**: *"If you got 100% of the asset, what’s it worth to you? (Usually \(u_1 = u_2 = T\))."*  
  - **Enough Info**: Both agree \(u_1 = T\), \(u_2 = T\) (standard for shared assets).  
  - **Judgment Call**: If ideals differ (e.g., one values the asset emotionally), use \(T\) anyway for simplicity.  

  #### **Step 4: Calculate the Split (5 mins)**  
  - **Formula**:  
    - **Gain ratio** = \(\frac{\text{Asset value} - \text{Fallback total}}{\text{Ideal} - \text{Fallback}}\)  
    - **Party 1’s share**: \(d_1 + \left( \frac{T - d_1 - d_2}{2} \right)\)  
    - **Party 2’s share**: \(d_2 + \left( \frac{T - d_1 - d_2}{2} \right)\)  
  - **Why?**: Each keeps their fallback value + **half the surplus** (what’s left after covering fallbacks).  
  - **Enough Info**: Plug \(T\), \(d_1\), \(d_2\) into the formula.  

  #### **Step 5: Present and Confirm (5 mins)**  
  - **Say**: *"Based on your fallbacks, [Name1] gets [share1] and [Name2] gets [share2]. This splits the extra value equally relative to your worst-case options."*  
  - **Judgment Call**: If shares feel unfair, ask: *"Does this account for everything? Did we miss a fallback?"*  

  ---

  ### **Examples**  
  #### **1. Food Truck Split**  
  - **Asset**: Truck worth \(T = \$50,000\).  
  - **Fallbacks**:  
    - Partner A: Job offer with \(\$10k\) bonus → \(d_A = \$10,000\).  
    - Partner B: No job, no savings → \(d_B = \$0\).  
  - **KS Split**:  
    - Surplus = \(T - d_A - d_B = 50,000 - 10,000 - 0 = \$40,000\).  
    - Partner A: \(10,000 + \frac{40,000}{2} = \$30,000\).  
    - Partner B: \(0 + \frac{40,000}{2} = \$20,000\).  
  - **Why KS works**: Partner A’s strong fallback gives them more, but Partner B still gets a fair share.  

  #### **2. Artist Grant Money**  
  - **Asset**: Grant money \(T = \$10,000\).  
  - **Fallbacks**:  
    - Artist A: Backup scholarship worth \(\$3,000\) → \(d_A = \$3,000\).  
    - Artist B: Broke → \(d_B = \$0\).  
  - **KS Split**:  
    - Surplus = \(10,000 - 3,000 - 0 = \$7,000\).  
    - Artist A: \(3,000 + \frac{7,000}{2} = \$6,500\).  
    - Artist B: \(0 + \frac{7,000}{2} = \$3,500\).  
  - **Why KS works**: Artist A’s scholarship reduces their need for the grant, but both gain proportionally.  

  #### **3. Hidden Fallback (KS Failure)**  
  - **Asset**: \(T = \$100,000\).  
  - **Claimed Fallbacks**:  
    - Partner A: Says no job → \(d_A = \$0\) (truth: amazing job offer, \(d_A = \$200,000\)).  
    - Partner B: Truly no fallback → \(d_B = \$0\).  
  - **KS Split**:  
    - Surplus = \(100,000 - 0 - 0 = \$100,000\).  
    - Partner A: \(0 + \frac{100,000}{2} = \$50,000\).  
    - Partner B: \(0 + \frac{100,000}{2} = \$50,000\).  
  - **Outcome**: Partner A gets \(\$50k\) + \(\$200k\) job = \(\$250k\). Partner B gets only \(\$50k\) and is furious.  
  - **Why KS breaks down**: KS relies on **honest disclosure**. If fallbacks are hidden, the solution is unfair.  

  ---

  ### **When Not to Use KS**  
  1. **Hidden or Unverifiable Fallbacks**: If parties lie about their options (Example 3), KS fails.  
  2. **Non-Cash Assets**: KS works best for cash splits. For illiquid assets (e.g., a business), convert to cash value first.  
  3. **Emotional/Non-Financial Values**: If "fairness" isn’t financial (e.g., sentimental value), use a different method.  
  4. **Power Imbalances**: If one party is coerced, KS won’t fix it.  
  5. **Complex Shared Projects**: For ongoing ventures (e.g., "Who keeps the customers?"), KS is too simplistic.  

  **Final Tip**: In pre-mediation, stress: *"Your fallback value is crucial—be honest, or the split won’t work."* Use KS for **simple cash splits with clear fallbacks**; otherwise, switch to interest-based mediation.
