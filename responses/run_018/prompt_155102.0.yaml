answer: |-
  **Downward causation is rejected in the chess engine and ghost careenium cases but accepted in the language-model arm under specific conditions, with 85% confidence overall.**  

  ### Decision Procedure for Downward Causation Claims  
  *(Ordered questions; stop at first "no" unless specified)*  

  1. **Physical Closure Verification**  
     - **Question:** Is the system’s physical substrate fully described by deterministic low-level laws (e.g., physics, circuit behavior) without causal gaps?  
     - **Evidence Required:** Complete physical specs (e.g., circuit diagrams, code-to-hardware mapping) showing state transitions are predictable from prior physical states alone.  
     - **Sufficiency:** Specs must lack "black boxes" or unaccounted physical variables.  
     - **Stop/Reject:** If "no" → Downward causation impossible; reject claim.  
     - **Hand-off to Philosophy:** If non-physical components (e.g., dualism) are asserted.  
     - **Confidence:** 95% (robust for engineered systems).  

  2. **Symbol Implementation Check**  
     - **Question:** Are symbol states (simmballs) fully determined by and reducible to substrate states?  
     - **Evidence Required:** Clear mapping from physical states to symbols (e.g., voltage patterns → "STRATEGY_X").  
     - **Sufficiency:** Demonstrable supervenience (1:1 or many:1 symbol-to-substrate mapping).  
     - **Stop/Reject:** If "yes" → Symbols are epiphenomenal; no downward causation (proceed only if "no").  
     - **Confidence:** 90% (fails if symbols aren’t computable from substrate).  

  3. **Causal Direction Test**  
     - **Question:** Do symbolic changes *initiate* substrate changes not dictated by prior substrate states?  
     - **Evidence Required:** Intervention specs showing:  
       - Symbol manipulation alters substrate *independently* of identical prior physical conditions.  
       - Lack of correlation traps (e.g., symbols aren’t proxies for hidden substrate variables).  
     - **Sufficiency:** Counterfactual support (e.g., "If symbol A were different, substrate B would differ, even with identical prior physical state").  
     - **Stop/Reject:** If "no" → No downward causation.  
     - **Hand-off to Philosophy:** If causation hinges on interpretation (e.g., "meaning causes motion").  
     - **Confidence:** 75% (counterfactuals are inferential).  

  4. **Interventionist Validation**  
     - **Question:** Can symbolic interventions produce substrate changes *without* equivalent low-level manipulation?  
     - **Evidence Required:**  
       - Symbolic inputs cause divergent substrate outcomes vs. physical-only tweaks.  
       - Symbols are multiply realizable (e.g., same symbol effect across substrate variations).  
     - **Sufficiency:** Specs show subsystem boundaries (e.g., API where symbols drive actuators).  
     - **Accept:** If "yes" → Downward causation confirmed.  
     - **Confidence:** 70% (misfires if symbols/physical are interlocked).  

  ---

  ### Case Analyses  
  **1. Chess Engine (Symbolic rule tweak changes heat dissipation)**  
  - **Step 1:** Physical closure holds (transistors/compute → heat predictable).  
  - **Step 2:** Symbols fully reducible (strategy rules = specific code/memory states).  
  - **Step 3:** Rule tweak physically alters bits → heat change; no *symbol-initiated* causation.  
  - **Verdict:** ❌ No downward causation.  
  - **Why mechanical actuation fails:** Heat change is physically determined; symbols are passengers.  
  - **Confidence:** 85% (matches intuition but exposes overreach).  

  **2. Language-Model Arm (Token outputs drive servos)**  
  - **Step 1:** Physical closure holds (servo motors obey physics).  
  - **Step 2:** Tokens reducible to physical states (e.g., "MOVE_LEFT" = voltage pattern).  
  - **Step 3:** Token change → servo motion; physical state alone doesn’t dictate *which* token is generated (model’s internal state matters).  
  - **Step 4:** Symbolic intervention valid (changing token to "MOVE_RIGHT" alters motion without identical physical tweak).  
  - **Verdict:** ✅ Downward causation **iff** tokens are multiply realizable (e.g., same token with different voltages).  
  - **Why mechanical actuation is insufficient:** Servo response is to *symbol meaning* (designed interface), not voltage specifics.  
  - **Confidence:** 70% (hinges on subsystem independence).  

  **3. Ghost Careenium (Noise correlates with symbols, never initiates)**  
  - **Step 1:** Physical closure holds (noise part of substrate dynamics).  
  - **Step 2:** Symbols reducible (noise correlates but doesn’t break determinism).  
  - **Step 3:** Noise never initiates symbols; symbols don’t alter noise (correlation ≠ causation).  
  - **Verdict:** ❌ No downward causation.  
  - **Hard case against intuition:** Noise/symbol correlation feels causal, but procedure exposes passivity.  
  - **Confidence:** 95% (specs explicitly deny initiation).  

  ---

  ### Procedure Weaknesses  
  - **Misfires:**  
    - **False negatives** in emergent systems (e.g., chaotic substrates where symbols *appear* epiphenomenal but exert constraint).  
    - **False positives** if specs omit hidden variables (e.g., "token-driven servo" might have underlying physics forcing motion).  
  - **Least Confident Step:** Step 3 (Causal Direction Test). Confidence: 60%. Counterfactuals are speculative without runtime data, risking correlation traps.  
  - **Why Mechanical Actuation Isn’t Decisive:** The language-model arm passes only due to *symbolic interfaces*; servos alone don’t prove causation if substrate fully controls outputs (e.g., a thermostat isn’t "downward causal").  

  **Final Confidence:** 85% (procedure traps oversold claims but requires rigorous specs).
