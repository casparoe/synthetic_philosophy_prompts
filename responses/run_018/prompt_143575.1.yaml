  First, I need to clearly outline both explanations. The revealed-preference explanation suggests that as social constraints decrease, innate differences in interests or risk preferences emerge, leading to more segregation. The structural-feedback explanation argues that egalitarian institutions create new gendered signaling mechanisms through competitive credentialing or status-seeking, even within meritocratic systems.

