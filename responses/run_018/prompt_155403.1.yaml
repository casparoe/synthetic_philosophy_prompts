answer: |-
  Okay, this is *exactly* the kind of brain-twister I love. Your philosopher sounds fascinating and seriously challenging. Crafting questions to pin down that kind of radical disjunctivism without letting her just rephrase the dogma is tough, but crucial. Here are 6 aimed right at the pressure points, casual like you asked, typos included:

  1.  **The Classic Squeeze (Argument from Illusion):** "Okay, the big one: the subjective indistinguishability argument. If I'm having a full-blown, say, proprioceptive hallucination of my phantom limb being *right there*, and it feels *exactly like* when my real limb *is* there... how can you possibly say there's *nothing* mental in common? Isn't that sheer phenomenology forcing a shared element? If it walks like a duck and quacks like a duck subjectively..."
      *   *Likely Reply:* "That's just a failure of my *discriminatory judgment* at that moment, confusing one kind of state (veridical) for another (non-veridical)."
      *   **Follow-Up:** "But hold on – isn't that judgment *based on* the experience? If the *experiences themselves* were fundamentally different mental kinds, why wouldn't that difference *show up* phenomenally, making confusion impossible? Doesn't saying 'I mistook A for B' *presuppose* A and B felt similarly at *some* level? Doesn't relegating it *all* to the judgment just move the 'sameness' problem one step back?"

  2.  **Bodily Illusions & Functional Wedge:** "So you extend this to things like 'false hunger' – feeling hunger pangs when you're actually sated, maybe due to stress or habit. But here's the kicker: often, these *are* functionally adaptive signals! Stress 'hunger' might be prompting me to seek comfort/energy, habit 'hunger' keeps my routine. Doesn't that functional similarity – the signal playing the *same causal role* as real hunger in driving action – drive a massive wedge between your 'no shared mental kind' claim and how our minds actually seem to *use* these states?"
      *   **Follow-Up:** "If you bite the bullet and say 'Nope, totally different mental kind despite identical functional output in that moment', then what *is* your independent criterion for sameness/difference of mental kind? If it's not functional role, and not subjective feel (as per Q1), what *is* it? How do I tell two mental states are of the same 'kind'?"

  3.  **Systematic Confusion Conundrum:** "People reliably get fooled by these illusions – phantom limbs, false hunger, satiety misattribution. If there's genuinely *nothing* shared in the experience itself between the veridical and the illusory case – they are radically different mental kinds – what actually *explains* this systematic confusion? Why do we get it wrong so often and in such similar ways?"
      *   *Likely Reply:* "It's a purely conceptual mistake – misapplying the concept 'feeling my limb' or 'feeling hunger'."
      *   **Follow-Up:** "But then why does this 'mistake' feel so *compellingly experiential*? And crucially, why do people under psychedelics or in psychosis *still* report the experiences as indistinguishable, even when they *know* the conditions are altered ('I know I took LSD, but my hand *definately* looks like melting wax') or they know they're hallucinating? If it's *just* a conceptual error, shouldn't knowing the concept doesn't apply make the experiential difference obvious? But it often doesn't."

  4.  **Austin vs. McDowell Tightrope:** "You cite both Austin and McDowell as influences, but they pull in different directions on disjunctivism. Austin seemed allergic to *any* common element, while McDowell allows 'seemings' – a common *kind* of state ('it seems to me that...') that can be either veridical or non-veridical. Where do you land? Do you reject even McDowell's level of 'seeming' as introducing a problematic commonality?"
      *   **Follow-Up:** "If you reject *any* common level, even 'seemings', how do you explain the very *possibility* of the concept of illusion? Doesn't the idea of 'things seeming thus-and-so but not being so' *require* that the 'seeming thus-and-so' part is a distinct, identifiable state we can talk about, separate from the world being that way? Without *some* common factor at the level of appearance, how does 'illusion' even get off the ground as a coherent idea?"

  5.  **The Clinical Gut-Punch:** "On the clinical side: you argue treating interoceptive hallucinations should target the *conceptual framing*, not the experience itself. But many clinicians find that interventions *do* help patients precisely by reducing the intensity, frequency, or distress *of the experience itself* – like certain meds or somatic techniques calming false hunger signals or phantom pain. Doesn't the efficacy of *altering the experiential character*, regardless of conceptual work, strongly suggest there *is* some malleable experiential core – something shared between the false feeling and the real one that you can actually *tweak*?"
      *   *Likely Reply:* "Clinical efficacy doesn't necessarily map onto the underlying mental ontology! Helping someone cope doesn't prove a shared mental kind."
      *   **Follow-Up:** "Sure, but isn't it a massive coincidence then? If the 'false hunger' hallucination is a *radically different kind of mental state* than real hunger, with *no shared experiential properties*, why would techniques known to modulate the *real* hunger sensation (or its distress) *also* reliably modulate the *hallucinatory* one? If they are truly different kinds, shouldn't interventions targeting one kind mostly fail on the other? Doesn't the cross-over effectiveness *demand* some explanation that references a common target?"

  6.  **The Proprioceptive Edge Case:** "Let's get specific with proprioception. You say feeling my arm is bent when it's straight isn't the *same kind* of mental state as accurately feeling it bent. But what about *incomplete* or *degraded* signals? Suppose I have mild neuropathy – I get a faint, slightly 'staticky' feeling *of my arm being bent* when it's straight. Is *that*...
      *   a) A totally different mental kind from both accurate bent-feelings *and* other illusions?
      *   b) The *same* mental kind as a clear hallucination of it being bent?
      *   c) Or does its degraded nature mean it's not even a genuine proprioceptive state *at all*, just noise?
      How does your disjunctivism handle the messy continuum of signal reliability in bodily awareness without collapsing?"

  **Bonus Tone Note:** The typos ("definately", maybe "recieve" in the clinical one if you slip it in) and the direct, slightly pushy phrasing ("gut-punch," "kicker," "hold on," "bite the bullet") should give it that casual, thinking-aloud-with-a-friend vibe you wanted. Good luck – this is gonna be a wild interview! Let me know how it goes.
