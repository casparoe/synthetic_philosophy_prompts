answer: |-
  Your intuitions are sharp, but the core tension stems from distinguishing **dynamical symmetries** (fundamental to a theory's definition and dynamics) from **accidental redundancies** (mere mathematical artifacts). The coherent principle is:

  **A symmetry transformation represents physical redundancy *only* if it is a *fundamental gauge symmetry* of the theory, mandated by the dynamics and necessary for the consistent formulation of observable quantities. Otherwise, it may represent physically distinct states.**

  Let's break this down using your cases:

  1.  **Classic GR:** ✅ **Same Physical World.**  
      *   **Principle Applied:** Diffeomorphism invariance is the *core dynamical symmetry* of GR. The Einstein-Hilbert action and the resulting EFE are *fundamentally* invariant under all diffeomorphisms. This symmetry isn't optional; it defines the theory and encodes background independence. Observables *must* be diffeomorphism-invariant. Declaring it redundancy is essential for the theory's consistency.

  2.  **Lattice Spacetime:** ✅ **Same Physical State.**  
      *   **Principle Applied:** If the lattice theory is formulated such that its fundamental degrees of freedom and dynamics are defined only up to internal automorphisms *within* region H that preserve the boundary connections/composites *and* this symmetry is built into the dynamics (e.g., as the discrete analog of diffeomorphism invariance), then it's a fundamental gauge symmetry. Observable quantities (boundary correlations) are invariant by construction. This is the discrete analog of GR's hole argument.

  3.  **Hidden-Sector Unitary:** ❌ **Likely Physically Distinct.**  
      *   **Principle Applied:** The unitary transformation commutes with exterior observables *accidentally*, due to the specific setup (no coupling to gravity/geometry). It is *not* a fundamental gauge symmetry mandated by the theory's dynamics. The theory likely defines observables *within* the hidden sector itself. While exterior observers cannot distinguish the states, an observer with access to the hidden sector *could*. This is an *accidental* symmetry, not a fundamental gauge redundancy. Treating it as redundancy would incorrectly erase potentially physical distinctions *within* the hidden sector.

  4.  **Theory Comparison:** ✅ **Keeping GR's Redundancy is Correct.**  
      *   **Principle Applied:** The "simpler" theory without redundancy likely violates the principle above. Attempting to eliminate diffeomorphism redundancy in GR fundamentally breaks it:
          *   It forces a non-dynamical background structure, violating background independence.
          *   It makes observables non-local or path-dependent (e.g., requiring "dressing").
          *   It destroys the elegant geometric interpretation.
      *   The redundancy in GR is *dynamically necessary*. The "simpler" theory is only simpler mathematically; physically, it's a different (and worse) theory that loses essential features like covariance and locality of the gravitational field description. Your preference flip is justified: true simplicity requires respecting the dynamical symmetries.

  5.  **Horizon Version:** ✅ **Same Physical World.**  
      *   **Principle Applied:** The causal structure (the horizon) is part of the *dynamical geometry*. Diffeomorphism invariance remains the fundamental gauge symmetry of the theory. The fact that the transformation is behind the horizon is irrelevant to the *definition* of the symmetry and the physical equivalence it implies. Observables outside the horizon remain unchanged *because* of the fundamental symmetry, not merely because of practical inaccessibility. It's the same principle as case 1.

  **The Account: Dynamical Gauge Symmetry vs. Accidental Invariance**

  *   **Dynamical Gauge Symmetry:** A transformation is a fundamental gauge symmetry if:
      1.  It leaves the action invariant.
      2.  This invariance is *necessary* for the consistent formulation of the theory's dynamics and observables (e.g., ensuring locality, background independence, avoiding ghosts/constraints).
      3.  The theory's observables are *defined* as equivalence classes under these transformations.
      *   *Examples:* Diffeomorphisms in GR (dynamical gravity), gauge transformations in Yang-Mills theories (dynamical gauge fields).
      *   *Consequence:* States related by such transformations represent the *same* physical reality. Redundancy is fundamental and cannot be removed without altering the theory.
  *   **Accidental Invariance:** A transformation leaves certain observables invariant due to specific configurations (like isolation, decoupling, or boundary conditions), *not* because it's a fundamental symmetry built into the theory's definition.
      *   *Examples:* The hidden-sector unitary (Case 3), a global rotation of an isolated system in Newtonian mechanics, flipping all spins in an isolated paramagnet.
      *   *Consequence:* States related by such transformations *may* be physically distinct *in principle*, even if indistinguishable *in practice* by specific observers under specific conditions. Treating them as redundant incorrectly erases potential physical distinctions.

  **Your Verdicts:**

  *   **Keep:** 1, 2, 4, 5 are correct and consistent under this principle.
  *   **Drop/Refine:** 3. Your intuition that it "might actually be physically different" is likely correct. The principle forces the conclusion that this is *not* fundamental redundancy like in GR. It's an accidental invariance. Declaring it redundancy like GR would be a mistake.

  **Other Cases & Implications:**

  *   **Electromagnetism:** U(1) gauge symmetry is a fundamental dynamical symmetry. States differing by `A_mu -> A_mu + d_lambda theta` are physically identical. Removing it breaks the theory.
  *   **Global Symmetry (e.g., Rotation):** An `SO(3)` rotation of an *isolated* system leaves all observables invariant *accidentally* due to isolation. The rotated states are physically distinct configurations of the *same* system, even if no external observer can tell them apart. The symmetry is global, not gauge.
  *   **Background-Dependent "Gravity":** In a theory like Nordström's scalar gravity or a spin-2 theory on a *fixed* background, "diffeomorphisms" might look similar to GR, but they are *not* fundamental dynamical symmetries. They are redundancies introduced by the field parameterization on the fixed background. Observables depend on the background. Removing this redundancy is possible and often done.
  *   **Quantum Gravity:** This principle highlights the challenge. Is diffeomorphism invariance still fundamental? If observables become relational and non-local (e.g., defined at boundaries), does this change the nature of the redundancy? The principle suggests fundamental gauge symmetry should be preserved, but its implementation becomes complex.

  **Conclusion:**

  The hole argument "works" as a profound physical insight *only* in theories where the symmetry (diffeomorphism invariance) is a **fundamental, dynamical gauge symmetry** essential to the theory's definition and dynamics (GR). In other contexts (lattice analogs respecting the same principle, hidden sectors with accidental symmetries), equating states related by transformations *solely* because they agree on some observables is incorrect if the transformation isn't mandated as gauge by the dynamics. GR keeps its redundancy because that redundancy *is* the physics of background independence and dynamical geometry; removing it destroys the theory. Your Case 3 lacks this fundamental dynamical necessity for the symmetry to be treated as gauge.
