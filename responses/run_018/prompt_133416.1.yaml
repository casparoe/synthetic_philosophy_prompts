answer: |-
  **Bottom line:** Your intuitions align best with **Adams conditioning** for learning conditionals directly, but require **Jeffrey conditioning** for generalized evidence, and demand **separate handling of conditional vs. disjunctive information and source reliability**.

  **Principles and Cases:** Adams conditioning updates conditional credences without changing antecedent credence (motivated by **Case 1**: "If Blue then Terminal" keeps Blue at 50%, raises Terminal). **Case 2** ("Not at terminal") uses simple Bayesian updating, lowering Blue to ~40% (since P(Blue) = P(Blue | ¬Terminal) * P(¬Terminal) prior). **Case 3** shows the *form* matters: learning the disjunction "Red or (Blue and Terminal)" *is* evidence potentially changing the antecedent (Blue) credence directly (unlike the conditional), explaining the different update. **Case 4** (unreliable source) requires modeling the source's reliability as evidence about the *process* generating the conditional claim, leading to complex partial retraction, not just weakening.

  **Verdict to Drop & Prediction:** For consistency, you likely need to drop the intuition that *learning the basic conditional "If Blue then Terminal"* (Case 1) *could* lower credence in Blue under Adams. It shouldn't. For the **counterfactual case**: Learning "If she *had been* in Blue, she *would have been* at the terminal" (while knowing she's in Red field) provides **no evidence about the actual lab (Blue credence unchanged)**; it only constrains beliefs about *counterfactual* scenarios involving Blue.
