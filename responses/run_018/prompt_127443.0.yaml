answer: |-
  Based on your exceptionally clear articulation of the impasse, let's diagnose the core disagreement and assess its tractability. Your account reveals a profound clash not easily resolved by conventional arguments.

  **Diagnosis of the Stalemate:**

  1.  **Fundamental Framing Conflict:** At its heart, this is **not primarily a verbal dispute about "equal opportunity," nor a simple divergence in empirical assumptions, but a clash of foundational normative frameworks.** You are both appealing to different, deeply held principles regarding the nature of moral agency, the justification of property, and the scope of obligations across generations.
      *   **Your Friend's Framework:** Rooted in a **"Dynastic Continuity"** model. This view posits the family lineage as a continuous moral entity across time. Rights, particularly property rights accrued through that lineage, are seen as inherent attributes of this ongoing agent. Restricting bequests is thus akin to violating the agency and identity of this transgenerational entity. "Equal opportunity" here likely means procedural fairness *within* a system that accepts dynastic accumulation as legitimate and prior.
      *   **Your Framework:** Rooted in a **"Republican Non-Domination"** model applied intergenerationally. You focus on the structural power imbalances created by concentrated inherited capital. This concentration isn't just unequal starting points; it actively *dominates* the life chances and choices of those without such capital, undermining their effective freedom. "Equal opportunity" here demands substantive conditions preventing this domination, which necessitates limiting dynastic transfers. Familial loyalty, in this view, cannot generate moral claims that override the fundamental freedom from domination of strangers.

  2.  **The Role of "Equal Opportunity":** While the term is contested, the impasse goes deeper than mere semantics. The disagreement over its meaning *stems from* the prior clash of frameworks:
      *   For your friend, prioritising dynastic continuity logically leads to a *procedural* interpretation of equal opportunity (no arbitrary barriers).
      *   For you, prioritising non-domination necessitates a *substantive* interpretation (preventing structural power imbalances that constrain agency).
      *   **Verdict:** The dispute over "equal opportunity" is a *symptom*, not the *cause*, of the deeper normative conflict.

  3.  **Are They Different Questions?** Yes and no. Both are ultimately addressing "What constitutes a just distribution of capital across generations?" However, they approach it from fundamentally different starting points:
      *   Your friend starts with the **moral claims of the dynastic entity** (derived from continuity and accrued rights).
      *   You start with the **freedom condition of individuals born into society** (freedom from domination by inherited capital).
      *   These are distinct, foundational questions about the source and scope of justice in this domain. The "single heading" masks these divergent roots.

  4.  **Empirical Disagreement?** Minor, if present at all. You both accept the core empirical picture: concentration occurs, mobility is constrained, taxes can alter distribution. While you mention "non-dominance" as a structural condition you claim, and your friend might dispute *how much* inherited wealth *actually* constrains choices in practice (e.g., "Can't someone still choose to be a teacher even if they can't start a multinational?"), this seems secondary. The core disagreement is whether *any* significant constraint arising *specifically* from dynastic concentration is *morally permissible* given the competing principles. Your friend might accept the constraint exists but argue the dynastic entity's rights justify it.

  5.  **Bedrock Intuitions:** This is the crux. The stalemate arises from **irreconcilable bedrock intuitions**:
      *   **Your Friend's Intuition:** The profound connection, loyalty, and shared identity within a family lineage *does* generate unique, powerful moral claims that extend through time and can rightfully outweigh claims based on abstract societal structures or the needs of strangers. The family *is* a real moral agent.
      *   **Your Intuition:** No degree of familial loyalty or perceived continuity can morally justify creating or perpetuating systemic structures (like dynastic wealth concentration) that fundamentally dominate and constrain the life prospects and freedom of other individuals within the same political community. The "dynastic entity" is a harmful fiction enabling domination.

  **Assessment of Tractability: Probable Permanent Deadlock (and Why)**

  *   **Why Conceptual Distinctions Won't Break It:** You've already articulated the core concepts (dynastic continuity vs. republican non-domination, opportunity-set non-dominance) with remarkable clarity. Further refining these concepts is unlikely to change the underlying intuitive pull of each position for its adherent. Defining "family" or "agency" more precisely won't resolve the core conflict over which principle has priority.
  *   **Why Formal Models Won't Break It:** Models of intergenerational agency would likely just formalise the existing assumptions. A model presupposing a dynastic entity would vindicate your friend's view; a model presupposing individual agents affected by structural inequality would vindicate yours. Models showing the *efficiency* or *inefficiency* of inheritance tax are irrelevant to the core *moral* disagreement about the rights of the dynasty vs. the freedom of the non-dynastic individual.
  *   **Why Empirical Findings (e.g., Mobility Elasticities) Won't Break It:**
      *   You both already *accept* that inheritance impacts mobility and distribution. More precise elasticity figures wouldn't change that.
      *   If findings showed *less* impact than you believe, your friend might seize on it, but you could counter that *any* domination caused by unearned advantage is unjust, regardless of degree.
      *   If findings showed *more* impact, you would be bolstered, but your friend could still fall back on the principle: "Even if it creates significant disadvantage, the right of the family line to transmit its legacy is paramount." Their core claim is deontological (rights-based), not consequentialist (outcome-based).
      *   **The Sticking Point:** The empirical question "How much does dynastic wealth constrain?" is secondary to the prior normative question: "Is *any* constraint justified by dynastic rights?" Answering the empirical question won't resolve the normative one.

  **Conclusion:**

  Your stalemate is best understood as a **clash of irreconcilable bedrock normative intuitions** concerning the moral status of the family lineage versus the demands of individual republican freedom across generations. Your friend elevates "dynastic continuity" as a fundamental source of rights and identity; you elevate "non-domination" as a fundamental condition of freedom that must constrain such dynastic claims. These are foundational commitments about the nature of society, agency, and obligation.

  **Therefore, expect permanent deadlock.** No conceptual distinction, formal model, or empirical finding about elasticities will *genuinely* resolve it, because the disagreement resides in the pre-empirical, normative foundations each position rests upon. Further discussion might refine understanding or expose nuances, but it's unlikely to produce persuasion on the core issue. The most one might achieve is a clearer mutual recognition of the profound and perhaps unbridgeable gulf between these two compelling, yet ultimately incompatible, visions of intergenerational justice.
