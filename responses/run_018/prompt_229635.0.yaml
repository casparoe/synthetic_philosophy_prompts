answer: |-
  ### Case 1: Omission as Equivalent to Act  
  Dr. Taylor is responsible for Mr. Evans, a terminally ill patient dependent on a ventilator. The ventilator requires a manual reset every hour to function; without it, it fails, causing death. Dr. Taylor could alternatively press a dedicated shutdown button to immediately stop ventilation. Both options result in Mr. Evans’s death with certainty. Deliberately choosing to hasten death, Dr. Taylor forgoes the reset. Mr. Evans dies.  

  **(Word count: 82)**  

  ### Case 2: Act as Worse than Omission  
  Mr. Evans is a terminally ill patient sustained by a ventilator. Dr. Taylor must reset the ventilator hourly to maintain function; failure to do so causes death. Separately, a shutdown button exists to actively terminate ventilation. Dr. Taylor, intending to end Mr. Evans’s life, presses the shutdown button. Mr. Evans dies.  

  **(Word count: 65)**  

  ---

  ### Design Analysis  
  **Presentational mechanism driving the shift**:  
  - **Case 1** foregrounds *equivalence*: Parallel phrasing ("both options result in death") symmetrically frames omission and act as deliberate *choices* causing identical outcomes, amplifying perceived agency in omission.  
  - **Case 2** foregrounds *asymmetry*: The reset is embedded in routine care ("must reset... to maintain function"), casting omission as passive neglect. The shutdown button is presented as a distinct, exogenous intervention ("actively terminate"), amplifying its perceived intrusiveness.  
  - **Level of detail**: Case 1 explicitly links both options to the outcome ("both options result in death"), while Case 2 decouples them—omission is contextually implied, not equated.  

  **Normative inertness**:  
  The mechanism manipulates *salience* (e.g., highlighting "active termination" in Case 2) without altering morally relevant features: intent (willing death), outcome (death), alternatives (reset/shutdown), or causal role (both are necessary conditions for death). If moral wrongness hinges on intent and outcome, the verdicts conflict despite identical facts.  

  **Collapsed scenario under neutral presentation**:  
  > *Dr. Taylor can cause Mr. Evans’s death by either (a) omitting the ventilator reset or (b) pressing the shutdown button. Both require a single intentional decision and guarantee immediate death.*  
  Here, intuitive distinctions dissolve, revealing equivalence.  

  **Defense of the "pumped" verdict (Case 1)**:  
  A defender might argue Case 1’s framing *accurately* emphasizes agency in omissions: since moral responsibility depends on conscious choice (not physical movement), its verdict validly exposes that omissions are acts of will. If intuitive wrongness tracks intentional causation (e.g., "you chose death either way"), Case 1’s equivalence is a reliable datum reflecting true moral structure.  

  **Principle for allowing presentation-driven shifts**:  
  > A presentation-driven shift in intuitive verdicts should affect moral judgment *only* if it transparently illuminates a normatively relevant feature (e.g., intent, consequences, or rights) that was obscured in alternative framings—not if it exploits cognitive biases (e.g., salience effects) or descriptive asymmetries untethered from moral truth.  

  ---  
  This pair isolates how linguistic framing—symmetry vs. asymmetry in option descriptions—sways intuitions independently of facts, challenging reliance on raw responses in moral reasoning.
