     - Step 0: Agents fill out survey, but they don't write their name? Or they do, but then the Predictor keeps it secret. The agents are told they won't see the survey again.
     - Then they have to remember? Or they might forget? 

     We can do:

     - The survey is anonymous? But then we cannot match. So we need names.

     **Better:** 
     - Have them write their name on the survey, but then the Predictor keeps it and does not show the agents. Then, when in Tails, the agent must decide without knowing what they wrote.

     Then the agent might not remember exactly? That's okay. It adds uncertainty.

     **In Tails:**
     - The agent must decide to pay or not without knowing the coin and without knowing what they wrote on the survey (or they might remember vaguely).

     Then the decision is non-trivial.

     **Expected Payoff in Tails:**
     - Let p be the probability that they wrote "Yes" on the survey (in their own mind).
     - If they pay: with probability p, they get 11; with probability 1-p, they get 9. Expected tokens: 11p + 9(1-p) = 9 + 2p.
     - If they don't pay: they get 10.
     - So they should pay if 9+2p > 10, i.e., 2p>1, p>0.5.

     So if they believe they are more likely than not to have said "Yes", they pay.

     **But note:** In the survey, they were asked what they would do in Heads. In Heads, paying gives 9, not paying gives 0, so they would say "Yes" if they are rational? So p should be 1. 

     Therefore, they should always pay in Tails? 

     But what if they are not rational? Or what if they think the Predictor might not be using their survey? 

     **To break the rationality:**
     - Tell the agents: "Some of you might have answered the survey truthfully, some might have lied. Also, the Predictor might not use the survey? But in this game, the Predictor uses the survey." 

     But then the rational agent would have said "Yes" on the survey and then pays in Tails.

     **To create variation:**
     - Tell the agents: "You might have your own reasons. For example, you might be rebellious and not pay in any scenario. Or you might be altruistic and want to help the Predictor."

     This might induce some to say "No" on the survey.

     **Final Game Design:**
     - We'll run it as described with the survey hidden. 
     - We'll hope that some agents put "No" on the survey.

     **How to ensure some variation?**
     - Before the survey, say: "Remember, in the Heads scenario, if you pay, the Predictor gets your token. If you don't pay, the Predictor doesn't get anything and you lose everything. Some of you might not want to give the Predictor any tokens, even if it costs you."

     Then maybe some agents will put "No".

     **Summary for the Club Leader:**
     - This game requires some setup. Be clear in explaining the rules.
     - What will go wrong: 
          - Agents might not understand the connection between the survey and the Tails payoff.
          - The coin might come up Heads often and then they don't get to play the mugging phase.
          - Some agents might be confused about why they are losing tokens in Heads based on a survey they filled out.
     - Be prepared to run 3 rounds: maybe use a weighted coin? Or just use a fair coin and hope for one Tails round.

     **Alternative:** Let the Predictor choose the coin flip? Or use a dice: 1-3 Heads, 4-6 Tails? 

     **Debriefing Script:**
     - "In this game, your payoff in the Tails scenario depended on what you said you would do in the Heads scenario, even though you were never in the Heads scenario. This is the counterfactual: what would have happened if the coin had been Heads? The predictor used that to determine your reward in Tails."
     - "In the XOR Blackmail, the blackmailer is essentially doing the same thing: your payment in this world (whether you are in Heads or Tails) is being used to avoid a loss that is defined by what you would have done in the other world. The blackmailer has set up a system that punishes you if your decisions in the two worlds are not aligned in a particular way (the XOR condition)."

     Without formal notation, we can say: 
     - The blackmailer has set up a trap that will cause you to lose $1000 if your actions in the two possible worlds (Heads and Tails) are not what they predicted. But the blackmailer only contacts you in one world? 

     **Note on XOR Blackmail:** The standard description is complex. You might want to read about it separately. But the main point is that counterfactual reasoning can be paradoxical.

     **Conclusion:**
     This game should help the club members feel the tension of making a decision that depends on a counterfactual world. It's not perfect, but it's a start.
