  Here's a classroom-friendly simulation of **Counterfactual Mugging** designed to make the counterfactual reasoning tangible. The game uses tokens (e.g., poker chips, candies, or points on paper) and emphasizes why agents struggle with decisions involving "what if" scenarios.

  ---

  ### **Game Setup: "The Oracle's Dilemma"**
  **Players:**  
  - 1 **Oracle** (predictor with hidden info)  
  - 6–7 **Agents** (philosophers making choices)  
  - *Optional:* 1 **Banker** (manages tokens if the Oracle is busy).

  **Materials:**  
  - Coin (or dice for randomness).  
  - Tokens (e.g., 50+ poker chips/stickers).  
  - 2 sealed envelopes labeled **HEADS** and **TAILS** (prepared in advance).  
  - Whiteboard to track payoffs.

  #### **Rules**  
  1. **Starting Tokens:**  
     - Each agent starts with **10 tokens**.  
     - The Oracle holds the bank (30+ tokens).

  2. **Prediction Phase (Secret):**  
     - The Oracle flips a coin *in secret*:  
       - **HEADS** = Pay 1 token if asked.  
       - **TAILS** = Don’t pay if asked.  
     - The Oracle writes the result (H/T) and seals it in the **HEADS** envelope.  
     - *Important:* **TAILS** envelope stays empty (represents the counterfactual).

  3. **Mugging Phase (Public):**  
     - The Oracle reveals the **TAILS** envelope (always empty) and announces:  
       *"If the coin was TAILS, I predicted you’d refuse to pay. But if it was HEADS, I predicted you’d pay. Now, each of you must decide: Will you give me 1 token? Your payoff depends on my prediction."*  
     - Agents decide **simultaneously** (write "PAY" or "REFUSE" on paper).  

  4. **Payoffs:**  
     - The Oracle opens the **HEADS** envelope to reveal the *actual* coin flip.  
     - **If HEADS was flipped:**  
       - Agents who **PAID** → Lose 1 token (end with 9).  
       - Agents who **REFUSED** → Lose **ALL 10 tokens** (end with 0).  
       - *Why?* The Oracle "predicted" you’d pay. Refusing violates the prediction.  
     - **If TAILS was flipped:**  
       - Agents who **PAID** → Get **2 tokens** (end with 12).  
       - Agents who **REFUSED** → Keep their tokens (end with 10).  
       - *Why?* The Oracle "predicted" you’d refuse. Paying is irrational here.  

  5. **Repeat:** Play 3–4 rounds so patterns emerge.  

  ---

  ### **What Will Go Wrong (And How to Fix It)**  
  - **First-Round Chaos:**  
    - Agents will likely all **REFUSE** (they don’t trust the Oracle).  
    - When HEADS is flipped, they lose everything → outrage!  
    - *Fix:* After round 1, remind them: *"The Oracle’s prediction isn’t about tricking you—it’s about what would’ve happened in the other scenario."*  

  - **Confusion About Envelopes:**  
    - Players might think the **TAILS** envelope "should" contain something.  
    - *Fix:* Explain: *"The empty envelope represents the counterfactual—the scenario that didn’t happen. Your choice matters because the Oracle’s prediction is based on what you’d do in that unreal world."*  

  - **Math Hesitation:**  
    - Not everyone calculates payoffs. Use a **simplified cheat sheet**:  
      ```
      If you PAY:  
        - HEADS → Lose 1 token (9 left)  
        - TAILS → Gain 2 tokens (12 left)  
      If you REFUSE:  
        - HEADS → Lose 10 tokens (0 left)  
        - TAILS → Keep 10 tokens  
      ```

  ---

  ### **Debrief: Mapping to Counterfactual Mugging & XOR Blackmail**  
  1. **Core Tension:**  
     - *"Why did most of you REFUSE in round 1? Because you focused on the world you’re in (TAILS), where paying feels unnecessary. But the Oracle’s prediction was locked in for the HEADS world—a world you never saw. Your real choice affects payoffs in both worlds."*  

  2. **XOR Blackmail Connection:**  
     - In XOR Blackmail, a blackmailer says:  
       *"If I predicted you’d pay me $10, and you don’t, I’ll leak your secrets. But if I predicted you wouldn’t pay, and you do, I’ll leak them anyway."*  
     - **Game Link:**  
       - Paying in the game when the coin is **HEADS** is like "satisfying" the blackmailer’s prediction.  
       - Refusing when **HEADS** is like triggering the blackmailer’s threat (losing everything).  
     - *Simple takeaway:* Both dilemmas force you to care about what you *would have done* in a scenario that never occurred.  

  3. **Why It Feels Unfair:**  
     - Humans evolved to react to *observed* threats. Counterfactuals (e.g., empty envelopes) feel abstract. Rationality says: *"Optimize for all possible worlds,"* but instinct says: *"Ignore what didn’t happen."*  

  ---

  ### **Limitations of the Game**  
  - **The Predictor’s Perfection:**  
    Real counterfactual mugging assumes a **perfect predictor**. Our Oracle uses a coin flip—so predictions aren’t truly "based on you." *To mitigate:* After the game, say: *"Imagine the Oracle is 99% accurate about your choice in the other world—would that change your strategy?"*  

  - **Emotional vs. Logical:**  
    The game can’t replicate the dread of real blackmail. It exposes the *logic* but not the psychology. Lean into the frustration agents feel when punished for a "world that wasn’t."  

  - **Group Dynamics:**  
    Agents may copy others. Isolate decisions (use written choices) to emphasize individual reasoning.  

  ---

  ### **Tips for Success**  
  - **Demo Round:** Play an open round where you (the leader) are an agent.  
  - **Token Incentives:** Use candy/trinkets for tokens to raise stakes.  
  - **Discuss:** *"Would you play differently if we did 100 rounds? Why?"* (Explores reputation/learning).  

  This simulation makes the abstract dilemma visceral. You’ll get chaos, shouting, and "aha!" moments—perfect for philosophy club! 🔥
