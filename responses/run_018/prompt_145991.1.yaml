  Let me mentally walk through Montaigne's likely reaction. First, his skepticism about travelers' tales - he'd shred this AI trained on unreliable 16th-century sources. He knew those accounts were filtered through European biases and sensationalism. Then the custom-vs-nature lens: Montaigne distinguished between culturally relative practices and universal human nature. This exhibit reduces ritual to interchangeable data, ignoring how Tupi practices served specific social functions entirely different from European violence.

  Ah! The vanity angle feels crucial. Montaigne criticized Europeans who exoticized others while ignoring their own barbarities. This high-tech spectacle is exactly that - turning sacred practices into consumable horror. His famous line about "each man calls barbarism whatever is not his own practice" would backfire against the curators here.

  The haptic simulation detail is particularly grotesque through a Montaignian lens. He described Tupi practices anthropologically to provoke self-reflection, not visceral thrill. Simulating cannibalism as sensory entertainment would horrify him - it's the opposite of his project.

