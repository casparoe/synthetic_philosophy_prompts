  2. **Jordan raises the first objection: self-modification and approximation.**
     - Jordan points out that even if the source code looks like it will cooperate at time T0, one of the systems might update its weights after seeing the other's code, leading to a different behavior at runtime.

  3. **Alex counters with the idea of logical commitment:**
     - Alex argues that the systems can be designed to not self-modify in a way that breaks the commitment, and that the proof is about the static code.

