  Key points from the user:
  - Alex: Believes that if two systems can inspect each other's source code, they can prove they will cooperate, forming a kind of social contract in code.
  - Jordan: Thinks this is naive because real systems have approximation errors and can self-modify, so source transparency doesn't guarantee runtime behavior. Compares it to signing a contract in a changing language.
