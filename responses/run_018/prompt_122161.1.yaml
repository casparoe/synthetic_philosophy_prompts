  *analyzing metaphor risks* 
  The map analogy could fail if people interpret "shifting coordinates" as distorting history rather than changing perspective. Need to stress it's about *how* we locate the past, not altering the past itself. Also, the science analogy might alienate non-scientists if overdone. 

  *structural weaknesses* 
  Biggest risk is the transition from validating removal-as-erasure feelings to arguing for change. If I don't cushion that pivot carefully, it could feel dismissive. Also, the statue/street parallel might not hold for everyone - statues feel more visceral than street signs. 

  *approach* 
  Open with humility (outsider perspective), use "we" language to unite the room, deploy the map metaphor early with simple visuals ("like latitude/longitude lines"), then validate emotional responses before gently pivoting to growth. End with workshop-as-lab framing to leverage their credibility. 

  *red flags* 
