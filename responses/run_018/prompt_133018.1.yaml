  First, I should validate their insight: yes, Paul's framework *does* symmetrically apply to both becoming a parent and staying childless. If transformation makes pre-experience utilities incomparable, neither choice is "rational" in the standard sense. That symmetry is correct, and the user spotted it well.  

  But the user suspects something deeper—maybe the problem isn't just about knowledge but about unstable selves. That's astute. Paul's critics (like Pettigrew) argue transformative choices force us to compare *different versions* of ourselves, which standard decision theory can't handle. The user's hunch about "utility functions across worlds" nails it.  

