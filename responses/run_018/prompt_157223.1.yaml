  The user mentions mapping these onto the Lisbon Earthquake. So, first, what happened? In 1755, an earthquake followed by a tsunami and fires destroyed Lisbon on All Saints' Day, killing tens of thousands. The timing is significant because it happened during a religious holiday when churches were full. 

