answer: |-
  Here’s a breakdown of your query, addressing the linguistic evolution and political context of the term "liberal":

  ---

  ### The sneaky assumption  
  Your framing assumes there’s a singular "real" definition of liberalism that Europe preserved, while the US distorted it. This overlooks that liberalism has **always been contested**—even its 18th/19th-century founders (Locke, Smith, Mill) disagreed on the role of the state and individualism. No version is inherently "authentic"; both modern usages are context-driven evolutions.  

  ---

  ### How both sides actually drifted  
  - **In the US**: The term shifted during the early 20th century. Progressives like Theodore Roosevelt initially distanced themselves from "liberal" (associated with laissez-faire), but FDR’s New Deal co-opted it to mean *state-guided social reform*. By the 1950s, "liberal" cemented as pro-welfare, pro-civil liberties, and anti-conservative—a branding triumph for the left.  
  - **In Europe**: Post-WWII, "liberal" parties (e.g., UK Lib Dems, FDP) retained classical links to free markets and limited government, partly because **socialist/social-democratic** parties dominated the left. European liberals often positioned themselves as centrists opposing both socialism *and* conservatism, preserving older economic connotations.  
  - **Crucially**: Neither side "hijacked" the term. US progressives adopted "liberal" to distance themselves from *socialism* (tainted by McCarthyism), while Europeans used it to distinguish pro-market centrists from *Christian democrats* or *Tories*.  

  ---

  ### The Scandinavian/ordoliberal wrinkle  
  - **Denmark’s Venstre** ("Left") and Sweden’s Liberals are **center-right**, pro-business parties—closer to US conservatives than US liberals. Meanwhile, actual social democrats (e.g., Sweden’s SAP) govern as center-left.  
  - **Germany’s Ordoliberals** (FDP’s intellectual roots) advocate market competition *enabled* by state regulation—rejecting laissez-faire. They influenced the EU’s "social market economy," blending rules with capitalism.  
  - These cases shatter the myth of a uniform "European liberalism": the term spans Thatcherite economics (UK Lib Dems’ right wing) to state-centric pragmatism (French *libéralisme*).  

  ---

  ### Bottom line  
  Asking "who owns the word?" is pointless—**political labels morph through local struggles, not dictionary fidelity**. Both usages are "real"; insisting otherwise misreads history and linguistics.
