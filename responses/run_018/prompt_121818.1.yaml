prompt: |-
  hey, i'm in my bioethics semenar this semester and we're stuck on advance directives—like if i sign something saying pull the plug if i'm severely demented but then the demented version of me seems perfectly content. my prof keeps asking whether the earlier self has authorty over the later one, and she brings up psychological continuity and narrative identity theories. i'm also a junior dev so i live in git. can you restate the whole debate—earlier self's authority, the continuity view, the narrative view, the future-interests argument—using only git/version-control language? branches, commits, rebasing, force-push, tags, merge conflicts, HEAD, deprecation, backward compatibility, forks, remotes. do it as faithfully as you can. then i need the residue report: which philosophical claims translate clean, which ones you have to distort to make them fit (like maybe calling a living will a tagged release), and which ones have literally no git equivalent. is the missing stuff a failure of git vocabulary—maybe it can't talk about welfare or suffering—or is it just that the philosophers are being vague? also, here's a weird idea i cooked up: treat severe dementia not as corruption in the same repo but as a hard fork with its own remote and independent commit history. does that idea survive the translation, or does it explode the framework? i don't want citations or a reading list, just the translation and the breakdown.
