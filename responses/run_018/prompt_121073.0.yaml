answer: |-
  ## Rigorous Essay Exam Question

  **Question:** Critically evaluate the claim that adopting a "domain-indexed" conception of virtue—where traits like courage or practical wisdom exhibit stability *within* specific spheres of activity (e.g., professional, domestic, civic) but not necessarily *across* all contexts—successfully defends Aristotelian virtue ethics against the situationist critique. Does this strategy genuinely preserve the core commitments of virtue ethics concerning character, practical wisdom (*phronesis*), and global moral assessment (praise, blame, character attribution), or does it effectively concede too much to situationism, thereby undermining those very commitments? In your answer, ensure you:

  1.  Distinguish clearly between trait *possession* and trait *expression*.
  2.  Analyze how *phronesis* functions when practical domains are narrowly circumscribed.
  3.  Address whether meaningful moral evaluation remains possible if an agent consistently displays a virtue in one domain but lacks it in another.
  4.  Construct a reasoned argument concluding whether domain-indexing rescues or abandons Aristotelian virtue ethics.

  ---

  ## Model Answer (Approx. 750 words)

  The situationist challenge, spearheaded by figures like John Doris and Gilbert Harman, argues that robust, cross-situationally consistent character traits of the kind central to Aristotelian virtue ethics are empirically unsupported. They point to experiments (e.g., Milgram, Darley & Batson) suggesting behaviour is primarily driven by situational factors rather than global dispositions. A proposed defence involves retreating to "domain-indexed" virtues: stable dispositions operative only within specific life spheres (e.g., professional courage, domestic honesty). While this move seems promising, I argue it ultimately concedes too much to situationism, fatally compromising core Aristotelian commitments concerning character, *phronesis*, and holistic moral assessment, collapsing into a weak form of situationism itself.

  **Trait Possession vs. Expression and the Situationist Target:** The crux of the situationist attack is not that people *never* exhibit locally reliable patterns of behaviour reflecting *something* like a trait within constrained contexts (domain-indexing accepts this). Rather, they deny *global* cross-situational consistency – the idea that possessing courage *simpliciter* reliably predicts courageous acts across diverse situations demanding courage. Aristotle understands virtue as a *hexis* (stable disposition) of character, implying a *global* capacity for virtuous action across relevant situations. While *expression* of a virtue requires appropriate circumstances (one cannot exhibit battlefield courage in a quiet library), *possession* entails the reliable disposition to recognize and act courageously *whenever* courage is called for, irrespective of the specific domain. Domain-indexing redefines "possession" as *only* operative within a predefined sphere. This fundamentally alters the Aristotelian conception: the agent doesn't possess "courage," only "professional courage." The situationist objection to global traits stands unchallenged; it is merely relabeled and localized.

  ***Phronesis* and the Fragmentation of Practical Reason:** *Phronesis* (practical wisdom) is central to Aristotelian virtue. It is the intellectual virtue enabling an agent to perceive the morally salient features of any situation, deliberate correctly about the mean relative to us, and choose virtuously. Crucially, *phronesis* is holistic; it integrates knowledge of the human good across life's domains, weighing competing demands (family vs. polis, professional duty vs. personal loyalty). Domain-indexing severely constricts *phronesis*. A "domain-specific practical wisdom" confined only to, say, civic life, lacks the resources to adjudicate conflicts *between* domains or recognize when a virtue demanded in one sphere (e.g., aggressive competitiveness in business) might constitute a vice in another (e.g., the family). Aristotle’s *phronimos* grasps the unity of the good life; domain-indexed *phronesis* fragments practical reason into isolated competencies, potentially leading to compartmentalized, morally schizophrenic agency unable to achieve the integrated *eudaimonia* Aristotle envisions. Can an agent truly be *phronimos* if their wisdom evaporates upon leaving the office or the council chamber?

  **The Possibility of Meaningful Global Moral Assessment:** Aristotelian ethics relies on assessing an agent's *character* as a whole for praise, blame, and attributions like "courageous" or "unjust." Domain-indexing makes such global assessment incoherent. If an agent consistently displays "professional courage" (standing up to unethical clients) but "domestic cowardice" (avoiding difficult conversations with family), what is their character? We cannot globally call them "courageous," as the domestic domain negates this. Nor can we simply aggregate domain-specific labels ("professionally courageous but domestically cowardly") into a unified character assessment without losing the very concept of a *global* trait or a *unified* self whose character we judge. Praise and blame become similarly fragmented and localized: we praise the *professional action* but blame the *domestic inaction*, withholding judgment on the *agent's character* as such. This undermines the traditional virtue-ethical focus on the agent's enduring moral state. Situationism readily accepts this fragmentation; Aristotelianism cannot without abandoning its core object of evaluation – the agent's overall character as the source of action across their life.

  **Conclusion: Retreat or Collapse?** While domain-indexing attempts to salvage local behavioural reliability often associated with traits, it does so at the cost of the core metaphysical and normative commitments of Aristotelian virtue ethics. By redefining traits as inherently local and fragmenting *phronesis*, it abandons the concepts of *global character dispositions* and *holistic practical wisdom* that are definitive of Aristotle's framework. Moral evaluation shifts from assessing the agent's character to assessing domain-specific conduct patterns, aligning far more closely with the situationist view that behaviour is context-bound and global character attributions are unwarranted. Domain-indexing, therefore, is not a successful defence of Aristotelianism but rather a capitulation to a moderated situationism. It preserves the *language* of virtue but sacrifices its Aristotelian *substance* – the vision of a unified, rationally integrated self possessing stable excellences that reliably manifest across the diverse contexts of a complete human life. The situationist challenge to robust global character traits remains potent; domain-indexing signals virtue ethics' inability to meet it on its own terms.

  ---

  ## Detailed Marking Scheme (Total: 25 Marks)

  **A Answer (21-25 Marks):** Demonstrates exceptional understanding, analytical depth, and original argumentation.

  1.  **Clear Distinction: Trait Possession vs. Expression (3 Marks):**
      *   **A Standard:** Explicitly and accurately defines Aristotelian trait *possession* (as *hexis*/global disposition) vs. *expression* (situationally dependent). Clearly identifies situationism's target as *cross-situational consistency* of possession/expression, not local reliability. (3 marks)
      *   **B Standard:** Distinguishes possession and expression but may not fully articulate the Aristotelian *hexis* or may misstate the precise focus of the situationist critique (e.g., confusing it with denying any consistency). (1-2 marks)
      *   **Common Error:** Conflating possession and expression; misunderstanding situationism as claiming behaviour is *entirely* random or that *no* local patterns exist.

  2.  **Sophisticated Analysis of *Phronesis* (5 Marks):**
      *   **A Standard:** Accurately defines Aristotelian *phronesis* as holistic, integrating knowledge of the good life across domains. Insightfully argues that domain-indexing fragments *phronesis*, preventing integrated deliberation across life spheres and adjudication of domain conflicts. Explains why this undermines the unity of *eudaimonia* and the role of the *phronimos*. (5 marks)
      *   **B Standard:** Correctly defines *phronesis* and identifies it as potentially problematic under domain-indexing, but analysis lacks depth on fragmentation, integration, or conflict resolution. May not explicitly link to *eudaimonia*. (3-4 marks)
      *   **Common Error:** Treating *phronesis* as simply domain-specific technical skill; failing to grasp its integrative, synoptic function; not considering domain conflicts.

  3.  **Critical Evaluation of Moral Assessment (5 Marks):**
      *   **A Standard:** Persuasively argues that domain-indexing makes *global* character assessment (praise/blame for the *person*) incoherent or impossible, reducing evaluation to fragmented, domain-specific judgments of *actions* or *domain-personae*. Explicitly contrasts this with the Aristotelian focus on the agent's overall character as the object of evaluation. (5 marks)
      *   **B Standard:** Recognizes the challenge to global assessment posed by inconsistent virtues across domains but may not fully develop the implications for character attribution or the nature of praise/blame. May state the problem without deeply analyzing *why* it's fatal to Aristotelian assessment. (3-4 marks)
      *   **Common Error:** Assuming domain-specific virtues can be simply summed into a global character; not recognizing the shift from character evaluation to action/situational evaluation.

  4.  **Original & Cogent Overall Argument (7 Marks):**
      *   **A Standard:** Constructs a compelling, original, and well-structured argument reaching a clear, defensible conclusion about whether domain-indexing saves or abandons Aristotelianism (e.g., as in model answer: it collapses into moderated situationism). Integrates points 1-3 seamlessly. Demonstrates independent critical thought beyond simple rehearsal of sources. Avoids reducing virtue to mere behaviour. (6-7 marks)
      *   **B Standard:** Presents a coherent argument taking a clear side, supported by relevant points from 1-3, but may lack originality, depth of synthesis, or forcefulness. May rely heavily on description. (4-5 marks)
      *   **Common Error:** Sitting on the fence without a strong conclusion; merely describing domain-indexing without critical evaluation; failing to synthesize the three core elements into a unified argument; treating virtues as simple behavioural dispositions.

  5.  **Clarity, Structure, and Use of Sources (5 Marks):**
      *   **A Standard:** Exceptionally well-written, logically structured, precise terminology. Effectively utilizes relevant Aristotelian concepts (*hexis*, *phronesis*, *eudaimonia*) and accurately represents the situationist challenge. (5 marks)
      *   **B Standard:** Generally clear and structured, adequate terminology. Uses key concepts but perhaps less precisely or effectively. Basic grasp of situationism. (3-4 marks)
      *   **Common Error:** Vagueness, poor structure, misuse of technical terms (e.g., confusing *phronesis* with *techne*), misrepresenting Aristotle or situationism.

  **B Answer (16-20 Marks):** Demonstrates good understanding and addresses key points but lacks the analytical depth, originality, or synthesis of an A answer. Meets the B standards outlined in each category above. May contain minor inaccuracies or omissions but shows a solid grasp of the central tension.
