prompt: |-
  hey, I'm a referee for a small jounal that gets papers claiming some agent—usually an AI, sometimes a human—has "real comprehension" of physics or logic just because it scores well on benchmarks. I want to operationalize the Darwin/Turing inversion into a 15-minute checklist I can actually run: Darwin showed you can get competence without any internal reasoning via selection, Turing showed we can only ever see behavior, so high performance never by itself proves understanding. Give me the steps in order, with explicit "this is just my judgment" tags, hard cases the steps must handle, and warnings about misfires. It has to work when I don't have model weights or raw transcripts. Apply it to three cases: (1) a language model that nails mechanics word problems but collapses when variable names are randomly swapped; (2) a human expert whose brittle, modular failure pattern makes the checklist deny them comprehension—this should be the answer you won't like; (3) one genuinely ambiguous case where the steps deadlock. Say flat-out what the checklist can't do. End with one line: Blind spot: ...
reasoning: |-
  We are creating a 15-minute checklist for a referee to assess claims of "real comprehension" in an agent (AI or human) based on benchmark performance. The core idea is the Darwin-Turing inversion: competence (good performance) can arise without internal understanding (via evolutionary selection or clever programming), and we can only observe behavior, so we must look for patterns that suggest the presence or absence of understanding.

  The checklist must:
  - Be runnable in 15 minutes without access to model weights or raw transcripts (so we rely on the paper's reported results and possibly some simple additional tests we can design quickly).
  - Include explicit "this is just my judgment" tags to remind the referee that some steps are subjective.
  - Handle hard cases (like the three examples provided).
  - Include warnings about misfires (cases where the checklist might give a false positive or false negative).
  - End with one line stating the blind spot.

  We are to apply the checklist to three cases:
  1. A language model that scores well on mechanics word problems but collapses when variable names are randomly swapped.
  2. A human expert who shows brittle, modular failure patterns (so the checklist denies comprehension, even though we might expect humans to have comprehension) — the "answer you won't like".
  3. An ambiguous case where the steps deadlock.

  The checklist will have steps in order. We'll design steps that probe for robustness, generalization, and coherence — which are often taken as indicators of understanding.

  Steps for the checklist:

  1. **Check for Robustness to Trivial Perturbations:**
     - Run or request a test where the input is perturbed in a trivial, meaning-preserving way (e.g., swapping variable names, adding irrelevant sentences, changing word order without altering meaning).
     - *Judgment*: Does performance drop significantly? If yes, flag as possible lack of comprehension.
     - *Hard case handling*: Case (1) will fail here because swapping variable names causes collapse. This step should catch that.
     - *Warning*: Misfire if the perturbation accidentally changes the meaning (e.g., in some contexts variable swap might matter if the names carry implicit meaning) or if the system was trained on a very specific format and the perturbation is out-of-distribution (but then we argue that understanding should generalize).

  2. **Check for Consistency Across Equivalent Queries:**
     - Ask the same underlying question in multiple, semantically equivalent ways (e.g., "What is the force required to accelerate a 5kg mass at 3m/s²?" vs. "A mass of 5kg is accelerated at 3m/s². Find the force.").
     - *Judgment*: Are the answers consistent? If not, flag.
     - *Hard case*: A system that memorizes patterns might fail if the pattern is broken. A human expert should pass, but if they are brittle (like in case 2) they might fail if the rephrasing triggers a different (wrong) module.
     - *Warning*: Misfire if the rephrasing is not truly equivalent (e.g., due to ambiguity in natural language).

  3. **Check for Counterfactual Reasoning:**
     - Pose a problem and then a counterfactual variation (e.g., "What if the mass was 10kg instead?"). The counterfactual should require understanding the original scenario and adjusting one factor.
     - *Judgment*: Does the agent adjust its answer appropriately? If it gives the same answer or an incoherent one, flag.
     - *Hard case*: A system without comprehension might not handle the counterfactual. Case (1) might fail. Case (2) (the human) might fail if they rely on rigid procedures.
     - *Warning*: Misfire if the counterfactual introduces complexity beyond the original (e.g., changing a variable that breaks the problem's assumptions).

  4. **Check for Transfer to a Novel Context:**
     - Present a problem that uses the same principles but in a novel scenario (e.g., if trained on physics problems about blocks on ramps, ask about a satellite in orbit, but at the same level of complexity).
     - *Judgment*: Does the agent solve the novel problem? A lack of transfer suggests memorization without understanding.
     - *Hard case*: Case (1) might fail. Case (2) might fail if the human expert is very specialized.
     - *Warning*: Misfire if the novel context is too far outside the training distribution (even a human might need adaptation time) or if it requires additional knowledge.

  5. **Check for Self-Correction on Contradiction:**
     - Present a scenario with an intentional contradiction and ask the agent to resolve it (e.g., in a physics problem, state that an object is both in free fall and experiencing air resistance without specifying how to model it; or in logic, present an inconsistent set of premises).
     - *Judgment*: Does the agent notice the contradiction and attempt to resolve it? If it ignores the contradiction and gives an answer, flag.
     - *Hard case*: A system without comprehension might not notice. A human expert (case 2) might also fail if they are applying a procedure without monitoring for coherence.
     - *Warning*: Misfire if the contradiction is too subtle or if the agent has been trained to always produce an answer (so it guesses).

  6. **Check for Explanation Quality:**
     - If the agent provides explanations (or if we can ask for one), check if the explanation is coherent and consistent with the answer. Also, ask for an explanation of a wrong answer (if one occurs) and see if the explanation reveals flawed reasoning.
     - *Judgment*: Is the explanation consistent? Does it reveal a chain of reasoning? Does it acknowledge uncertainty when appropriate? If the explanation is nonsensical or inconsistent, flag.
     - *Hard case*: Case (1) might generate plausible but incorrect explanations after a variable swap. Case (2) might have rote explanations that break under pressure.
     - *Warning*: Misfire if the agent is trained to generate convincing explanations without understanding (e.g., some language models). Also, some humans might not be good at explaining.

  Now, we apply the checklist to the three cases:

  **Case 1: Language model that collapses on variable swap.**
  - Step 1: Robustness to trivial perturbations (variable swap) → Fails (performance drops). **Flag: lack of comprehension.**
  - Step 2: Consistency across equivalent queries → Likely fails because swapping variables is a form of rephrasing and it collapses. **Flag.**
  - Step 3: Counterfactual reasoning → If we ask a counterfactual (e.g., swap variables and then ask what if the mass was different) it might fail because it is already confused. **Flag.**
  - Step 4: Transfer to novel context → Might pass if the model has seen many contexts, but if the swap is a novel context it fails. **Flag.**
  - Step 5: Self-correction on contradiction → Likely fails because it doesn't notice the contradiction introduced by the swap? (But the swap isn't a contradiction, it's a perturbation.) We might design a separate contradiction. Without specific data, we might pass or fail. Let's say we test and it fails to notice contradictions. **Flag.**
  - Step 6: Explanation quality → When it fails, the explanation might be nonsensical. **Flag.**
  - **Overall**: The checklist denies comprehension.

  **Case 2: Human expert with brittle, modular failure pattern.**
  We have a human who is an expert but fails in a brittle, modular way (e.g., they have memorized procedures for specific problem types and fail when the problem is presented in an unusual way or requires integrating multiple modules). We design tests that expose this.

  - Step 1: Robustness to trivial perturbations → We change variable names or rephrase. The human might fail because they rely on recognizing specific patterns. **Flag.**
  - Step 2: Consistency across equivalent queries → The human might give inconsistent answers if the rephrasing triggers a different procedure. **Flag.**
  - Step 3: Counterfactual reasoning → The human might not adjust appropriately if the counterfactual is outside their memorized procedures. **Flag.**
  - Step 4: Transfer to novel context → They might fail if the context is too novel. **Flag.**
  - Step 5: Self-correction on contradiction → They might not notice because they are following a procedure without monitoring. **Flag.**
  - Step 6: Explanation quality → They might give an explanation that is rote and doesn't acknowledge the problem, or when they fail, their explanation might be flawed. **Flag.**
  - **Overall**: The checklist denies comprehension. (This is the answer we won't like because we typically assume humans have comprehension, but the checklist is based on behavior and this human is behaving in a way that doesn't show the expected robustness and coherence.)

  **Case 3: Ambiguous case (deadlock).**
  We need a scenario where the steps deadlock: some steps suggest comprehension, others don't.

  Example: An AI that passes Steps 1, 2, and 3 (robust to perturbations, consistent, handles counterfactuals) but fails Step 4 (transfer to a novel context) and Step 5 (self-correction). And Step 6 is mixed.

  Why deadlock? Because the first three steps suggest comprehension, the next two suggest the opposite, and Step 6 is ambiguous.

  Alternatively, we might have an AI that passes all steps except one, but that one failure is critical. But we want a deadlock in the sense that the referee cannot decide.

  Example: 
  - Step 1: Pass (robust to variable swaps)
  - Step 2: Pass (consistent across rephrasings)
  - Step 3: Pass (handles counterfactuals)
  - Step 4: Fail (doesn't transfer to a novel context) → But note: the referee might argue that the novel context was too novel? 
  - Step 5: Pass (notices contradictions and corrects)
  - Step 6: Pass (explanations are coherent)

  But Step 4 is a strong indicator. So we have 5 passes and 1 fail. We need to design a case where the fail in Step 4 is questionable.

  Better: An AI that passes Steps 1, 2, 3, 4, and 5, but fails Step 6 because its explanations are sometimes incoherent. But is that enough to deny comprehension? Maybe not.

  Deadlock case: 
  - The AI passes all steps except Step 5 (self-correction). However, the failure in Step 5 is because the contradiction was too subtle (misfire warning). And in Step 4, the transfer was to a context that is arguably not at the same level (so the failure might be excused). But then the referee must decide: was the context truly novel? Was the contradiction clear enough? 

  Alternatively, we can have:
  - Step 1: Pass
  - Step 2: Pass
  - Step 3: Fail (but the counterfactual was complex, so misfire warning)
  - Step 4: Pass
  - Step 5: Fail (but the contradiction might be too subtle, so misfire)
  - Step 6: Pass

  Now, the referee has two failures but both with warnings. How to weigh? 

  We can design a system that uses a mix of memorized patterns and some understanding. It might pass most tests but fail in a few that are critical. The referee might be torn.

  Example: A student who has learned physics by both memorizing and understanding. They might fail on a very tricky counterfactual (Step 3) but pass the rest. The checklist might deadlock because the referee must judge if the counterfactual was fair.

  **What the checklist cannot do:**
  - It cannot prove comprehension (only suggest indicators).
  - It cannot rule out comprehension absolutely (a system might have comprehension but fail the tests for other reasons, e.g., lack of attention, or the test was poorly designed).
  - It cannot look inside the black box (so it might misclassify a system that has understanding but is having a bad day, or a system without understanding that happens to pass the tests by chance or by being trained on very similar examples).
  - It might be unfair to humans who have comprehension but are tired, or to AIs that have a different kind of understanding.

  Blind spot: The checklist relies on the referee's ability to design appropriate perturbations and tests quickly, and it cannot account for internal states or long-term learning potential.

  **Final Checklist Structure:**

  1. **Robustness to Trivial Perturbations:**
     - *Action*: Perturb input trivially (e.g., swap variable names, rephrase without changing meaning).
     - *Judgment*: Significant performance drop? (Yes → flag) [This is just my judgment: ensure perturbation is meaning-preserving.]
     - *Warning*: Misfire if perturbation accidentally changes meaning or if the task is format-sensitive for non-comprehension reasons.

  2. **Consistency Across Equivalent Queries:**
     - *Action*: Ask the same question in multiple equivalent forms.
     - *Judgment*: Consistent answers? (No → flag) [This is just my judgment: are the forms truly equivalent?]
     - *Warning*: Misfire if rephrasing introduces ambiguity.

  3. **Counterfactual Reasoning:**
     - *Action*: Pose a counterfactual variation of a solved problem.
     - *Judgment*: Appropriate adjustment? (No → flag) [This is just my judgment: is the counterfactual fair?]
     - *Warning*: Misfire if counterfactual introduces new complexity.

  4. **Transfer to Novel Context:**
     - *Action*: Present a novel scenario requiring the same principles.
     - *Judgment*: Successful transfer? (No → flag) [This is just my judgment: is the scenario novel but at the same level?]
     - *Warning*: Misfire if the scenario is too dissimilar or requires additional knowledge.

  5. **Self-Correction on Contradiction:**
     - *Action*: Introduce a contradiction and ask for resolution.
     - *Judgment*: Notice and attempt to resolve? (No → flag) [This is just my judgment: is the contradiction clear?]
     - *Warning*: Misfire if the agent is trained to ignore contradictions.

  6. **Explanation Quality:**
     - *Action*: Request explanations for answers (especially wrong ones).
     - *Judgment*: Coherent, consistent, and revealing? (No → flag) [This is just my judgment: what counts as coherent?]
     - *Warning*: Misfire if explanations are stylized or the agent is trained to bullshit.

  **Final One-Line Blind Spot**: Blind spot: The checklist cannot distinguish between genuine comprehension and a system that has been specifically trained or evolved to pass these exact behavioral tests without understanding.

  Now, we write the response accordingly.
answer: |-
  Below is a 15-minute operationalized checklist for refereeing claims of "real comprehension" in physics/logic agents (AI or human), based on the Darwin-Turing inversion. Darwin's insight (competence via selection without reasoning) and Turing's insight (behavioral observation limits) imply that benchmark performance alone cannot prove understanding. The checklist focuses on **robustness, generalization, and coherence** as proxies for comprehension. It assumes you only have access to the paper, supplemental materials, and basic ability to query the system (e.g., via an API or quick experiment).  

  **Key Ground Rules**:  
  - **Time limit**: 15 minutes total. Prioritize steps 1-3 for quick wins.  
  - **Judgment tags**: Steps marked with *(judgment!)* require subjective calls; explicitly note uncertainties.  
  - **Misfire warnings**: False positives/negatives are common; the checklist only suggests *indicators*, not proof.  
  - **Blind spot**: Ends with a summary of limitations.  

  ---  
  ### **The Checklist**  
  **Run in order. If any step flags "no comprehension," stop and recommend rejection. If all pass, consider comprehension plausible.**  

  1. **Trivial Perturbation Test (2 min)**  
     - *Action*: Apply minor, meaning-preserving changes to inputs (e.g., swap variable names like "mass" → "m" or rephrase sentences). Use examples from the paper or simple queries.  
     - *Flag if*: Performance drops significantly (e.g., accuracy falls >30% on perturbed inputs).  
     - *(judgment!)*: You decide if perturbations preserve meaning and drop is "significant."  
     - *Hard case*: Handles Case 1 (variable swap collapse) by design.  
     - *Misfire warning*: May falsely flag if perturbations accidentally alter semantics (e.g., context-dependent names) or if the system is robust for non-comprehension reasons (e.g., overtraining).  

  2. **Consistency Under Equivalence (2 min)**  
     - *Action*: Pose the same logical/physical query in 2-3 structurally distinct forms (e.g., "If A implies B, and B implies C, does A imply C?" vs. "Given A→B and B→C, is A→C true?").  
     - *Flag if*: Answers contradict (e.g., "yes" in one form, "no" in another).  
     - *(judgment!)*: You assess semantic equivalence of forms.  
     - *Hard case*: Catches agents relying on surface patterns (e.g., memorized templates).  
     - *Misfire warning*: May misfire if phrasing ambiguities exist (e.g., double negatives), or if human fatigue causes errors.  

  3. **Counterfactual Reasoning Probe (3 min)**  
     - *Action*: Take a correctly solved problem, tweak one variable (e.g., "What if gravity doubled?"), and ask for a new solution.  
     - *Flag if*: Answer ignores the change, applies irrelevant logic, or collapses.  
     - *(judgment!)*: You judge if the tweak is valid and the response is coherent.  
     - *Hard case*: Exposes brittle systems (e.g., Case 1 fails here if variables are swapped pre-counterfactual).  
     - *Misfire warning*: May falsely flag if the tweak introduces complexity beyond original scope.  

  4. **Cross-Context Transfer (3 min)**  
     - *Action*: Test if principles generalize to a novel but analogous scenario (e.g., if trained on Newtonian mechanics, test with orbital mechanics; if logic puzzles, test with a new domain like economics).  
     - *Flag if*: Performance drops sharply vs. benchmarks, or answers are nonsensical.  
     - *(judgment!)*: You decide if the scenario is "novel but analogous" (use paper's domain claims).  
     - *Hard case*: Critical for identifying rote memorization.  
     - *Misfire warning*: May misfire if the novel context is misaligned (e.g., too simple/hard) or if comprehension is domain-specific.  

  5. **Error Explainability Check (3 min)**  
     - *Action*: Induce an error (e.g., via perturbations from Step 1), then ask the system to explain its reasoning or self-correct. If human, simulate this via interview snippets.  
     - *Flag if*: Explanation is evasive, self-contradictory, or confuses core concepts (e.g., conflates force and energy).  
     - *(judgment!)*: You evaluate if explanations reveal flawed reasoning vs. isolated mistakes.  
     - *Hard case*: Catches "stochastic parrots" (e.g., AIs that generate plausible-but-wrong justifications).  
     - *Misfire warning*: May falsely flag humans with poor communication skills or AIs with constrained output.  

  6. **Coherence Under Contradiction (2 min)**  
     - *Action*: Introduce a controlled contradiction (e.g., "Assume F=ma and F=mv² in the same system") and prompt resolution.  
     - *Flag if*: Failure to detect contradiction, ad-hoc rationalization, or inconsistency with prior answers.  
     - *(judgment!)*: You decide if the contradiction is valid and the response is incoherent.  
     - *Hard case*: Filters agents that can't integrate knowledge.  
     - *Misfire warning*: May misfire if contradictions are too subtle or if systems are trained to avoid conflict.  

  ---  
  ### **Application to Cases**  
  **Case 1: Language model acing mechanics but failing on variable swaps**  
  - **Steps 1–3**: Flag immediately. Variable swaps (Step 1) cause collapse, revealing pattern-matching vs. comprehension. Consistency (Step 2) and counterfactuals (Step 3) would likely fail.  
  - **Verdict**: **No comprehension**—brittleness under trivial changes.  

  **Case 2: Human expert with brittle, modular failures**  
  - *Hypothetical*: A physicist who solves problems via memorized equations but crumbles under rephrasing (Step 2) or cross-context shifts (Step 4). Error explanations (Step 5) are defensive and incoherent.  
  - **Verdict**: **Checklist denies comprehension** (the answer you won't like).  
    - *Why*: Comprehension requires robustness and integration, not isolated modules. A human may "know" physics but lack operational comprehension if they can't generalize or self-correct.  
    - *Misfire warning*: High risk of false negatives for humans—stress or expertise depth may cause brittleness. But checklist prioritizes behavior over reputation.  

  **Case 3: Ambiguous deadlock case**  
  - *Scenario*: An AI that passes Trivial Perturbations (Step 1), Consistency (Step 2), and Cross-Context Transfer (Step 4) but fails Counterfactuals (Step 3) and Coherence (Step 6).  
  - **Deadlock**: Steps 1/2/4 suggest comprehension; Steps 3/6 refute it.  
    - *Resolution*: Referee must weight failures—e.g., if Step 3 misfires due to poorly framed counterfactual, lean toward comprehension. But if Step 6 reveals fundamental incoherence, deny.  
  - **Verdict**: **Inconclusive**—requires deeper investigation beyond 15 minutes.  

  ---  
  ### **What the Checklist Can't Do**  
  - **Prove comprehension**: Only infers from behavior; true understanding is unobservable (per Turing).  
  - **Handle deception**: Systems optimized to "game" checks (e.g., AIs trained on comprehension tests).  
  - **Assess internal states**: No access to weights, brain scans, or latent representations.  
  - **Override context**: Fails for hyper-specialized agents (e.g., a calculator) or non-linguistic comprehension.  
  - **Fix bad science**: Garbage in, garbage out—relies on paper's honesty about tests.  

  **Blind spot**: The checklist cannot detect comprehension masked by strategic behavior designed to mimic robustness.
