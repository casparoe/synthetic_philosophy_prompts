answer: |-
  ## The Uncomfortable Question: On Bronze, Blame, and Belonging

  Friends, colleagues, members of our university community, and honored guests,

  We gather today amidst these new presences in our quad. Three faces cast in enduring bronze: Thomas Jefferson. Winston Churchill. Christopher Columbus. Beneath each, starkly simple: the span of life, and a solitary, piercing question: **"What do we owe them?"**

  This installation offers no answers. No plaques extolling triumphs, no panels enumerating sins. There is only the man, the dates marking his existence in time, and that demanding inquiry. This silence is deliberate. It is not an evasion, but an invocation – an invitation to a far more difficult conversation than simple celebration or condemnation allows.

  When confronted by the profound moral complexities embodied by figures like these, a familiar refrain often arises: **"He was a man of his time."** It sounds like an explanation, perhaps even an excuse. But let us dissect this phrase with care, for it harbors two distinct meanings, both tempting, both ultimately insufficient.

  **First, the appeal to Epistemic Limitation.** This says: *He simply didn't know better.* The moral truths we hold self-evident today – the inherent evil of enslaving another human, the grotesque injustice of colonial violence, the fundamental equality of all people – were inaccessible to him. He lacked the knowledge, the historical perspective, the developed ethical framework we possess. He was trapped, morally blindfolded by the era of his birth. It is an argument grounded in the limits of *understanding*.

  **Second, the appeal to Motivational Constitution.** This says: *He couldn't have been different.* His character, his values, his very drives were irrevocably shaped by the dominant norms, structures, and incentives of his world. To expect him to have acted against the grain of his entire social and psychological formation is to demand the impossible. He was not just blindfolded; he was sculpted, molded, by the era. It is an argument grounded in the limits of *will*.

  Both appeals offer a kind of solace. The first tells us we are wiser now, beneficiaries of progress. The second tells us we cannot fairly judge, prisoners ourselves of our own context. Both lean heavily on a hidden assumption that underpins much of how we talk about history: **Serial Monism.**

  Serial monism is the seductive but flawed notion that any given historical era possesses a single, dominant, monolithic moral framework. It imagines the past as a series of neatly labeled boxes: "The Age of Exploration," "The Enlightenment," "The Age of Empire," each containing one coherent set of values, one acceptable way of thinking. To be "of your time," under serial monism, means to be uniformly, inevitably, embedded within that single framework. No exits, no alternatives, no internal dissent.

  This installation rejects serial monism. That is why there are no explanatory plaques. Not because we lack facts about Jefferson's contributions to liberty or his ownership of enslaved people, Churchill's wartime resolve or his imperial ruthlessness, Columbus's voyages of connection or their devastating consequences. We reject the plaque because to provide *the* context would be to implicitly endorse the myth that each man inhabited a world with only one moral voice, only one available path.

  **The profound truth that serial monism obscures is this: No era is morally monolithic. Contention is the constant hum of history.** Within every "time," competing moral vocabularies clash. Arguments rage. Dissenters speak. Alternatives are not just conceivable; they are articulated, defended, and lived – *even if they are not dominant*.

  Consider Jefferson. We rightly place him within the Enlightenment, wrestling with ideals of liberty and self-governance. Serial monism might suggest that accepting the institution of slavery was simply part of that package, the unavoidable "spirit of the age." But step into the tangible reality of Monticello. Walk among his books – *his own books*. There, on his shelves, sat works by contemporaries – philosophers, economists, fellow revolutionaries – who explicitly and powerfully argued *against* slavery. They dissected its economic inefficiency, its moral bankruptcy, its fundamental contradiction with the very ideals Jefferson helped enshrine. The arguments against human bondage weren't whispers from a distant future; they were ink drying on pages Jefferson himself could hold, read, and ponder. The moral alternative existed, vibrantly, within his own library, within his own intellectual world. He was not epistemically blindfolded to *all* arguments against slavery; he chose which arguments to heed. He was not solely constituted by the dominant norm of slaveholding; he actively participated in its maintenance, even as he wrestled with its contradiction.

  This is not unique to Jefferson. Think of Churchill’s Britain, steeped in imperial ideology. Yet within the halls of Parliament, within the press, within the very establishment Churchill navigated, voices rose – sometimes at great personal cost – condemning the brutality of colonial rule, questioning the very premise of empire. The moral vocabulary challenging imperial violence wasn't invented after Churchill’s death; it was spoken forcefully by his contemporaries. Or consider Columbus, sailing into a world of complex indigenous societies. While he embodied a drive for conquest sanctioned by his patrons, voices within the Church, like Bartolomé de las Casas, soon emerged using the very tenets of Christian theology to decry the enslavement and slaughter of native peoples. The critique wasn't a later imposition; it was a nascent, urgent cry *within* the time.

  **The failure of serial monism, revealed by this constant internal friction, dismantles both the easy excuse *and* the pure condemnation that depends on that excuse.**

  If the "epistemic limitation" defense relies on the era having only *one* available moral truth, but we see multiple truths argued *within* that era, then the excuse crumbles. They *could* have known differently; the knowledge was contesting for space. Jefferson read those books. Churchill heard those voices.

  If the "motivational constitution" defense relies on the era exerting an irresistible, uniform pressure, but we see individuals actively choosing *which* strand of their complex moral inheritance to amplify and act upon, then the excuse softens. Their character wasn't simply poured into a single mold; it was forged through choices made amidst competing calls. They weren't automatons of their age; they were participants in shaping its moral legacy.

  Therefore, we cannot comfortably say, "He didn't know, so we absolve him." Nor can we simply say, "He should have known everything we know now, so we condemn him utterly." Both positions depend on the false premise of a singular "time" that never truly existed.

  **So, what *do* we owe them?** We owe them the refusal of the easy narrative. We owe them the discomfort of complexity. We owe them the recognition that they stood not on solid ground, but on contested terrain. We owe them an understanding that moral progress isn't an inevitable tide lifting all boats in unison, but a fierce, ongoing struggle waged *within* eras, often by those challenging the dominant power, using the tools available *then*.

  We owe them rigorous history, not hagiography or demonology. We owe them the honesty to say: your world offered choices, even difficult ones. Your legacy is not a single edifice, but a landscape littered with both profound achievements and grievous harms, often inextricably linked.

  Most importantly, perhaps, we owe *ourselves* the courage this installation demands. The courage to look at these complex figures in bronze and resist the urge to file them neatly under "Hero" or "Villain." The courage to acknowledge the competing moral currents within our *own* time – the injustices we might be complicit in, the dissenting voices we might be ignoring, the choices we are making right now that future generations will judge.

  This quad, this university, is a space for precisely this difficult work: to confront complexity, to challenge assumptions, to think deeply about who we are, who we were, and what obligations bind us across time. These silent faces ask only one question: "What do we owe them?" Our answer begins with rejecting the simplicity of serial monism and embracing the demanding, honest work of history and moral reasoning. The conversation starts now. Thank you.
