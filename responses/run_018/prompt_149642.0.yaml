answer: |-
  That institutional split reveals a deep, philosophically fraught tension in how symbols and physical systems are conceptualized—likely reflecting an unstated instrumentalist pragmatism rather than a consistent theory. Here's the breakdown:

  ### 1. **The Two Incompatible Views in Play**
     - **Audit View (Operational Causality):**  
       Simmballs are treated as *causal agents* that "push the substrate around." This implies **strong emergence** or **downward causation**: symbolic rules have independent causal power over physics.  
       *Why the audit?* To prevent "cheating" (e.g., hardwiring outcomes while labeling them as Simmball-driven). The audit enforces a **dualist ontology**: symbols ≠ substrate; they *act on* it.

     - **Parallel Project View (Descriptive Epiphenomenalism):**  
       Simmballs are "just descriptive tags" with zero causal power. This is **reductive physicalism**: the substrate's physics alone determines everything. Symbols are passive summaries (like labeling a hurricane "Katrina")—convenient fictions.

     These views are **mutually exclusive**. One grants causal power to symbols; the other reduces them to bookkeeping. The grant office is implicitly endorsing both, depending on context—a classic case of **scholastic doublethink**.

  ---

  ### 2. **What the Policy *Actually* Presupposes: Institutional Instrumentalism**
  The office isn’t committed to a *theory* but to **pragmatic outcomes**:  
  - **For accountability (audits):**  
    Treating Simmballs as causal lets them hold *engineers responsible*. If the rig fails, they can ask: "Did you implement the Simmball rules correctly?" This requires symbols to be actionable causes.  
  - **For cost/efficiency (parallel projects):**  
    Ignoring Simmballs as causal simplifies models, reduces computational overhead, and avoids messy philosophy. Physics-first is leaner for *certain goals*.  

  **In short:** The office presupposes that **symbols are causally potent when you need someone to blame, but ontologically inert when you want to cut costs.** It’s policy-driven instrumentalism, not metaphysics.

  ---

  ### 3. **The Audit’s Hidden Commitment**
  Despite claiming Simmballs are "just tags" elsewhere, the audit’s existence secretly commits the grant office to:  
  - **Symbolic Realism:** Symbols must *do work* in the system. If they’re truly epiphenomenal, auditing their "causal power" is meaningless.  
  - **Anti-Reductionism:** The audit assumes the substrate’s behavior isn’t *fully* explainable by physics alone—it needs symbolic "steering."  
  - **A Dualism of Practice:** They accept that *for certain purposes* (e.g., engineering accountability), a non-physicalist framework is unavoidable.  

  ---

  ### 4. **Resolving the Tension?**
  The closest coherent framework that *might* bridge this is **functionalist compatibilism**:  
  - Simmballs have causal power *only if* they’re implemented in a way that their state changes alter physical processes (e.g., via feedback loops).  
  - But the office’s parallel projects deny this, treating symbols as *post hoc* labels.  

  **Why this persists:** Institutions often compartmentalize contradictions. The audit ensures rigor in *applied* contexts (where symbolic design matters), while the physics-only projects serve theoretical/research goals (where parsimony rules). It’s not a bug—it’s a feature of straddling applied engineering and fundamental science.

  ---

  ### Key Takeaway
  The grant office is **not** operating on a consistent theory of symbols vs. substrate. Instead:  
  - **Pragmatically**, they demand causal symbols to enforce accountability (audits).  
  - **Theoretically**, they default to physics-only models for simplicity (parallel projects).  
  - **The unspoken commitment:** Symbols are "real" *when humans need to interface with the system* (design, audit, troubleshoot) but "unreal" when abstracting away human-scale concerns.  

  This is less a philosophical stance than an institutional coping mechanism for the hard problem of meaning in complex systems. To survive audits, treat Simmballs *as if* they push matter. To win grants for pure physics, call them "tags." The policy reveals how bureaucracy navigates unsolved questions in philosophy of mind.
