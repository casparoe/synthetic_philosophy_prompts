answer: |-
  Right then, colleagues, friends, lovely to see you all gathered for this. Bit of a mixed bag we’ve got here – some who could probably recite Wittgenstein’s laundry lists, others who might just know him as that intense chap who thought words were a bit like chess pieces. Brilliant. That’s actually rather fitting.

  So, we’re here to chew over Wittgenstein and religious belief. Not an easy biscuit to dunk. Often, when folks talk about faith – whether it’s God, or the Last Judgement, or the soul – it sounds like an argument over *facts*. Like disagreeing about the weather in Manchester next Tuesday, or whether there’s water on Mars. One side says "It is!", the other says "Prove it!", and off they go, battering each other with evidence and counter-evidence. Feels familiar, doesn't it?

  Wittgenstein threw a bit of a spanner in those works. He suggested that for the *believer*, these things aren't functioning like botched scientific hypotheses at all. They’re not claims about the world in *that* way. Trying to prove God exists like you'd prove gravity? He thought that fundamentally missed the point, like trying to taste the colour blue.

  Here’s where I want to push his idea a bit further, with an image. Think of a painting. You’ve got the *picture* itself – the landscape, the portrait, the splash of colours. That’s the stuff you argue about: "Is the sky the right shade?", "Is that figure proportionate?" That’s the realm of facts, evidence, interpretation *within* the scene.

  But holding the whole thing together, giving it shape, defining its boundaries? That’s the *frame*. You don’t look *at* the frame in the same way you look *at* the picture. You don’t usually argue about whether the frame is 'true' or 'false' about the scene depicted. Its job isn't to depict; it’s to *enable* the depiction. It structures how you see everything *inside*. It’s the condition for the picture being a picture *at all*.

  **That’s closer to how Wittgenstein saw religious belief working.** Belief in God, or the Last Judgement, or the significance of certain rituals – these aren't primarily propositions *inside* the picture of the world, jostling for space with scientific facts. **They’re more like the frame.** They provide the structure, the orientation, the *rules* by which a believer sees *everything else*. They define what counts as significant, what despair or hope *mean*, how life itself is shaped and understood. They’re the ground rules you live by, often unspoken, holding the whole picture of a life together.

  So, when a believer talks about the Last Judgement, they’re not offering a dubious prediction about a future cosmic courtroom event the way a scientist predicts an eclipse. They’re expressing something about the *absolute weight* of moral responsibility *now*, the frame through which their actions gain ultimate significance. Arguing about the "fact" of the Last Judgement with someone operating in a completely different frame – someone for whom that concept doesn't structure their world at all – is like arguing about the colour of the frame while ignoring that it’s holding up entirely different pictures. You’re talking past each other.

  It’s not about who’s got the better facts *inside* their worldview; it’s about recognising that the entire *structure* of significance might be different. That’s trickier, perhaps less satisfying than a straight fact-fight, but it’s where genuine understanding might start.

  So, this afternoon isn’t about scoring points for or against religious ‘facts’. It’s about trying to see how belief might function as that frame – how it shapes a whole way of being, a ‘form of life’, as Wittgenstein put it. Let’s try to look at the framing, not just the picture. Should be interesting, hopefully less like pulling teeth than some philosophy talks! Cheers for being here – let’s crack on.
