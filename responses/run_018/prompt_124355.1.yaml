answer: |-
  Below is a taxonomy tree structured around three diagnostic questions. Each branch point addresses a concrete commitment, and leaves represent positions (named or "unnamed") with their most awkward implication. The questions are phrased neutrally to avoid presupposing knowledge of specific views. Empty or inconsistent combinations are marked, and practical overlaps are noted.

  ---

  ### **Taxonomy of Value Aggregation Positions**  
  *Branching on concrete commitments in AI alignment*

  #### **First Branch: Non-Present Entity Inclusion**  
  *Should the system incorporate values from entities not existing at deployment (future generations, synthetic minds, etc.)?*  
  - **Yes (Include)** → Proceed to Branch 2A  
  - **No (Exclude)** → Proceed to Branch 2B  

  ---

  #### **Branch 2A: Non-Present Entities Included**  
  *Is liberal neutrality (avoiding value imposition) coherent, given all methods embed meta-values?*  
  - **Neutrality incoherent** → Proceed to Q3-A  
  - **Neutrality coherent** → Proceed to Q3-B  

  ##### **Question 3-A (Neutrality incoherent + Include non-present):**  
  *How are values aggregated across entities?*  
  - **Simple averaging (equal weight per entity)**  
    → **Position:** Unnamed  
    → *Awkward commitment:* Must weight speculative future preferences equally with present ones, risking catastrophic miscalibration.  
  - **Minority veto rights (threshold-based blocking power)**  
    → **Position:** Unnamed  
    → *Awkward commitment:* Future entities cannot actively veto, making their protection dependent on present proxies.  
  - **Weighting by causal impact (influence proportional to affectedness)**  
    → **Position:** **Utilitarian aggregation**  
    → *Awkward commitment:* Requires predicting preferences of unborn entities and synthetic minds, inviting epistemic hubris.  

  ##### **Question 3-B (Neutrality coherent + Include non-present):**  
  *How are values aggregated?*  
  - **Any aggregation rule (A/B/C)**  
    → **Position:** *Empty combination*  
    → *Reason:* Including non-present entities inherently violates neutrality by assuming their moral patienthood, contradicting coherence claims.  

  ---

  #### **Branch 2B: Non-Present Entities Excluded**  
  *Is liberal neutrality (avoiding value imposition) coherent, given all methods embed meta-values?*  
  - **Neutrality incoherent** → Proceed to Q3-C  
  - **Neutrality coherent** → Proceed to Q3-D  

  ##### **Question 3-C (Neutrality incoherent + Exclude non-present):**  
  *How are values aggregated?*  
  - **Simple averaging (equal weight per entity)**  
    → **Position:** **Democratic pluralism (majoritarian)**  
    → *Awkward commitment:* Empowers majority coalitions to systematically marginalize minorities.  
  - **Minority veto rights (threshold-based blocking power)**  
    → **Position:** **Democratic pluralism (consensus-leaning)** OR **Personalized alignment**  
    → *Awkward commitment:* Threshold arbitrariness creates gridlock or enables minority tyranny.  
  - **Weighting by causal impact (influence proportional to affectedness)**  
    → **Position:** **Present-utilitarianism**  
    → *Awkward commitment:* Ignores long-term externalities, favoring near-term winners.  

  ##### **Question 3-D (Neutrality coherent + Exclude non-present):**  
  *How are values aggregated?*  
  - **Simple averaging**  
    → **Position:** **Strict neutrality**  
    → *Awkward commitment:* Averaging smuggles in majoritarianism while claiming neutrality.  
  - **Minority veto rights**  
    → **Position:** Unnamed  
    → *Awkward commitment:* Veto thresholds encode non-neutral harm assumptions.  
  - **Weighting by causal impact**  
    → **Position:** Unnamed  
    → *Awkward commitment:* Defining "impact" imposes a non-neutral theory of moral patienthood.  

  ---

  ### **Notes on Ambiguities & Empty Leaves**  
  1. **Empty combinations** (e.g., Branch 2B + Neutrality coherent + Include non-present):  
     - Logically inconsistent: Including non-present entities while asserting neutrality coherence fails, as inclusion assumes a meta-value about moral patienthood.  
     - *Other empties marked in tree.*  

  2. **Indistinguishable pairs in practice**:  
     - **Weighted aggregation vs. minority veto**: High-impact minorities in veto systems (e.g., weighting veto power by affectedness) blur with causal-impact weighting.  
     - **Personalized alignment vs. consensus pluralism**: Both use minority veto, but differ in threshold (personalization ≈ individual veto; pluralism ≈ group thresholds). The tree cannot separate thresholds.  

  3. **Stability gaps**:  
     - Full non-present inclusion + simple averaging is unnattributed (no major position holds it) because averaging dynamically unstable preferences across time invites value conflicts.  

  ---

  ### **How to Use This Tree**  
  - **In discussion**: Start from the root and answer each question sequentially to trace a path to a leaf.  
  - **Key insight**: No "neutral" stance exists; excluding futures, choosing aggregation, or defining harm all embed meta-values.  
  - **Design tradeoffs**: Positions prioritizing *inclusion* (e.g., utilitarianism) face epistemic risks; those prioritizing *exclusion* (e.g., strict neutrality) face consistency issues.
