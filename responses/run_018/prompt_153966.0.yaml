  I was talking with a friend about the sunk cost fallacy and she said it's definatly always irrational to honor sunk costs because rational agents only look foward. But then I came across this weird framing in some niche decision-theory stuff — not the standard material everyone cites — about diachronic commitment devices, where honoring a sunk cost isn't about recovering the past investement but about binding your future self to a plan so you don't defect, kind of like a Ulysses contract applied to preference stability over time. So I want your actual credence that honoring sunk costs is never rational, not just in ordinary cases but even in these commitment-type scenarios. Break it down: what's the probability that standard forward-looking decision theory is correct and fully excludes past costs, what's the probability that commitment-device arguments fail because they smuggle in evidential reasoning or confuse causal with normative structure, and what's the probability that personal identity over time is loose enough that betraying a past plan doesn't carry real normative weight? Give each term a rough number, combine them into an overall figure, and say which of those three pieces you're least sure about and what kind of argument would shift it. For what it's worth I'm around 0.6 that it's not always irrational, mostly because the commitment angle feels under-discussed. Please write all of this in continuous prose with no headings, no bullet points, no bold text, and no tables — just like a long email — and be explicit about how confident you are in your answer overall while pointing out the one sub-point you trust the least.
