answer: |-
  ## Thought Experiment
  A global health foundation's committee debates allocating its final $100M between a proven bednet program (saving 10,000 near-term lives from malaria) or funding research into mitigating a speculative but potentially universe-affirming existential risk in 10,000 years. Proponents of the far future argue its potential value is astronomically higher. One skeptical member, Dr. Aris, counters: "Before committing vast sums to safeguard a future we'll never see, consider Nick Bostrom's simulation hypothesis. If we *are* ancestor simulations run by a vastly advanced future civilization, perhaps they are testing moral theories—like how simulated agents trade off immediate suffering against ultra-long-term abstract futures. Funding the far-future project here might *only* be feeding data into *their* experiment. What if our 'real' impact is solely as characters in *their* moral case study? Prioritizing the far future in our sim might even be the *expected* outcome their test designers are probing for, making our choice less about real impact and more about fulfilling a simulated script."

  ## The Check: Dampen or Amplify Fanaticism? And Why?
  This worry **amplifies** fanaticism. The structural feature driving this is **epistemic parity combined with potential causal influence upwards**. If the simulators are testing moral theories about longtermism, then a *simulated* agent's fanatical choice (prioritizing the far future) could *directly influence* the *simulators' real-world policies*. Our fanatical action becomes a crucial data point, potentially convincing the (real) simulators to adopt fanatical longtermism in their base reality, thereby safeguarding the *actual* far future. Even if we are simulated, our commitment to the far future retains immense potential leverage – potentially *more* leverage, as it might affect the base reality's choices. We have no way to know if we are base or simulated, but fanaticism is the dominant strategy: if we are base, it protects the real far future; if simulated, it might *cause* the real far future to be protected by influencing the simulators' real decisions.

  ## What if You Remove That Feature?
  If you remove the **upwards causal influence** (e.g., the simulation is purely observational, our choices don't feed back to influence simulator policy, or they are indifferent to moral data), then the worry **dampens** fanaticism. If our actions cannot possibly influence the simulators' base reality decisions *and* our reality is simulated, then the "far future" we are trying to protect might be an illusion (just part of the sim) or even guaranteed/unchangeable by us (scripted by the simulators). Investing in "safeguarding" it becomes meaningless within the simulation context, making near-term relief the only option with discernible impact.

  ## Defender's Attack on the Scenario
  A defender of far-future fanaticism would likely attack the scenario by **rejecting the relevance of the simulation hypothesis due to extreme epistemic uncertainty and lack of actionable evidence**. They'd argue: "The simulation argument posits an unfalsifiable, extraordinarily low-probability scenario. Grant allocation must be based on our best understanding of *this* reality's causal structure and evidence. Absent any proof we are simulated *and* that our choices influence base-reality simulators, we must act as if we are in base reality. The astronomical stakes of the real (to us) far future, based on our current physics and cosmology, utterly dominate the expected value calculation. Dedicating resources based on unprovable metaphysical speculations about nested realities is paralyzing and neglects our overwhelming prior to treat observed reality as fundamental for decision-making." They might also question the assumed link between simulated moral choices and real simulator policy as arbitrary.
