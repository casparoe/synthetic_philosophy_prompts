prompt: |-
  I work as a software engineer and recently went down a rabbit hole reading about futarchy — roughly, the idea that a democracy should vote on what outcomes we actually want, and then let prediction markets decide which policy is most likely to get us those outcomes. I've been trying to work out where I'd genuinely be comfortable letting a market make the call and where I wouldn't, based just on my gut reactions to concrete cases. I'd like to know whether there's a principle that captures my verdicts.

  Going case by case: (1) whether a city should build a new light rail line, with the market forecasting ridership and average commute times if we build it or don't and betting on the better outcome — fine, I'd be happy with that. (2) whether same-sex marriage should be legal, with the market predicting the effect on average life satisfaction or GDP — not the market's call, that seems wrong to me. (3) whether the central bank should raise interest rates, with a market on inflation a few years out under each path — I'd honestly trust that more than the committee. (4) whether a new drug should be approved, with the market forecasting deaths and hospitalizations under approval vs. rejection — I mostly like this one, though I'd want someone independent checking the outcome numbers. (5) whether to launch a military invasion, with the market predicting casualties and economic cost under invade vs. don't — no, absolutely not, even if the market says invade. (6) whether an individual defendant should be held in pretrial detention, with a market on whether they'll skip their court date or commit a new crime if released — no, and this one feels kind of repugnant to me, betting on a person like that.

  What's bugging me is that my pattern isn't just "markets for factual means, voting for values," because the invasion case is also a means-to-an-end question and I still reject it, while the light rail and interest rate cases are means-to-an-end and I accept them. Is there a principal that gets all of these, or close to all? And what would it say about a case I keep going back and forth on: whether a school district should use a market on long-term earnings to decide whether to replace some science classes with programming classes? Finally, which of my verdicts would the principle force me to give up?
reasoning: |-
  Okay, the user is a software engineer intrigued by futarchy but struggling to reconcile their intuitive reactions to different policy scenarios. They've listed six concrete cases where they'd accept or reject market-based decisions, and their discomfort stems from the inconsistency in their pattern—particularly why they reject military invasions (means-to-end) while accepting light rail/interest rates (also means-to-end).  

  First, I need to unpack their core tension: they initially thought their split was "markets for facts, voting for values," but that framework fails because invasion is instrumental (factual prediction about outcomes) yet feels ethically off-limits. Their rejection of same-sex marriage and pretrial detention markets also screams ethical boundaries, but why?  

  Looking deeper at their cases:  
  - **Accepted cases** (light rail, interest rates, drug approval) all involve:  
    *Quantifiable outcomes* (commute times, inflation, deaths)  
    *Low moral stakes* (no direct harm to rights/dignity)  
    *System-level effects* (not individual fates)  
  - **Rejected cases** involve:  
    *Sacred values* (marriage equality = fundamental right)  
    *Irreversible harm* (death in invasions)  
    *Individual rights* (detention = liberty deprivation)  

  Ah—so their real boundary might be **markets commodifying morally charged or irreversible harms**. Invasion isn't just about efficiency; it's about betting on human lives as tradable tokens. Same for detention: reducing a person's freedom to "probability of skipping court" feels dehumanizing.  

  The school case is tricky because it pits quantifiable earnings against harder-to-measure societal goods (scientific literacy, critical thinking). Their hesitation likely stems from sensing that markets would oversimplify education's purpose. If they accept the market here, they'd erode their own principle that *markets shouldn't decide when outcomes conflict with deeper societal values*.  

  Their drug approval case has a revealing caveat: "someone independent checking the outcome." That hints at an unstated need for **accountability safeguards**—which futarchy often lacks. Military decisions can't have "redo" buttons if markets get them wrong; drug approvals might.  

  The principle I'd propose: **Markets only for optimizing instrumental goals where (a) outcomes are quantifiable and non-sacred, (b) errors are correctable, and (c) the decision doesn't violate individual rights or moral thresholds.** This would force them to either:  
  - Reject the drug approval market (if deaths are seen as irreversible/violating rights)  
  - Or accept pretrial detention if reframed with safeguards (but their "repugnant" reaction suggests they won't).  

  The school case fails under this principle: long-term earnings ignore education's non-monetary aims, and locking kids into paths based on market predictions feels rights-violating. They'd probably reject it—which aligns with their gut.  

  What they might not have articulated: their engineer's mindset wants a clean "rule," but their intuition recognizes that some domains resist quantification without ethical loss. They need a framework that honors both.
answer: |-
  Based on your verdicts, your core principle isn't just "markets for facts, voting for values." Instead, it hinges on **the nature of the outcome being predicted and the moral implications of commodifying the decision**. Here's a principle that captures your pattern:

  **"Markets are acceptable for optimizing instrumental outcomes when:**
  1.  **The outcome is quantifiable and non-sacred;**
  2.  **The decision primarily affects aggregate/system-level welfare (not fundamental individual rights/fates);**
  3.  **Mistakes are relatively correctable; and**
  4.  **The act of betting doesn't inherently violate moral norms (e.g., commodifying life, liberty, or dignity)."**

  **How it explains your verdicts:**

  1.  **Light Rail (Accept):** Ridership/commute time is quantifiable, non-sacred, system-level, correctable (adjust service later), betting on ridership feels neutral.
  2.  **Same-Sex Marriage (Reject):** Violates #1 (life satisfaction/GDP are poor proxies for fundamental rights/equality/dignity) and #2 (core individual rights/fates). Betting on rights feels morally wrong.
  3.  **Interest Rates (Accept):** Inflation is quantifiable, non-sacred, system-level, correctable (next meeting), betting on inflation is standard practice.
  4.  **Drug Approval (Accept w/caveat):** Deaths/hospitalizations are quantifiable, non-sacred *at the system level*, correctable (withdraw drug), betting feels acceptable. Your caveat ("independent checking") addresses trust/measurement, not the core principle.
  5.  **Military Invasion (Reject):** Violates #1 (casualties/economic cost are *sacred* outcomes - human lives lost), #3 (mistakes are catastrophic and irreversible), and #4 (betting on lives lost feels inherently repugnant).
  6.  **Pretrial Detention (Reject):** Violates #2 (directly impacts an individual's fundamental liberty) and #4 (betting on an *individual's* behavior commodifies their fate and feels repugnant). Also, outcomes (skipping court/new crime) are poor proxies for the core right to liberty.

  **Why "Means vs. Ends" wasn't enough:**
  The invasion and detention cases *are* means-to-ends questions (achieve security/minimize risk). Your rejection stems from the **nature of the ends/means themselves** (irreversible harm, fundamental rights) and the **moral act of betting on them**, not just that they are means.

  **The School Curriculum Case (Science vs. Programming):**
  *   **Analysis under the principle:**
      *   **Quantifiable?** Long-term earnings are quantifiable, but a poor proxy for "good education" (critical thinking, citizenship, well-roundedness, societal needs beyond GDP).
      *   **Sacred?** Education has value beyond economics, approaching a "sacred" societal good. Reducing it solely to earnings feels reductive/wrong.
      *   **Individual Fates/Rights?** High stakes for individual students' futures and opportunities.
      *   **Correctability?** Mistakes are hard to correct for the cohort affected (lost science education).
      *   **Commodification?** Betting on children's future earnings as the sole metric for educational choices feels ethically questionable.
  *   **Verdict:** Your principle strongly suggests **rejecting** the market here. It violates #1 (poor/overly narrow quantification), #2 (impacts individual development profoundly), and arguably #4 (commodifying children's futures). Your gut hesitation aligns with this.

  **Which verdicts might the principle force you to reconsider?**
  1.  **Drug Approval:** This is the *weakest* fit under your "Accept" verdicts. It scores well on quantifiability and correctability, but:
      *   **#2 (Individual Fates):** Approval/denial directly impacts the life-or-death/health fate of *specific, identifiable individuals* (patients needing the drug).
      *   **#1 (Sacredness?):** Deaths/hospitalizations are arguably sacred outcomes, even if aggregate.
      *   **#4 (Commodification):** Betting on deaths/hospitalizations, while common in insurance/actuarial science, might still feel uncomfortable.
      *   **Conclusion:** Your principle *could* push you towards rejecting the pure market here, aligning more with your caveat ("independent checking") implying the need for non-market ethical oversight. If you strongly hold your initial acceptance, you're prioritizing quantifiable aggregate welfare (#1) and correctability (#3) over the other factors in this specific case.
  2.  **Pretrial Detention:** If reframed purely as a risk-assessment tool (predicting aggregate flight risk/crime rates for *policy*, not individuals) and separated from the *decision rule*, your principle *might* allow it as a factual input. But your verdict explicitly rejects the market *making the call* for an individual, which the principle firmly supports rejecting due to #2 and #4.

  **In essence:** Your intuition draws a line where markets start to deal with fundamental rights, sacred values (like life and liberty), irreversible harms, or direct individual fates. You trust markets for optimizing complex systems with quantifiable, non-sacred outcomes where errors can be fixed (transport, monetary policy, potentially aggregated drug effects), but reject them when the stakes involve core moral boundaries or treating individuals as mere data points for betting. The school case fails because education's purpose transcends its narrow economic output.
