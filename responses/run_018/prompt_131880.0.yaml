prompt: |-
  I've been arguing with my roomate about whether the French Revolution actually has this structural tendency to devour its own children, or if that's just a catchy phrase people slap on 1793 because Robespierre got guillotined. I built this argument for a study-group and now it feels like it collapses everything into nonsense. Here are the steps:

  (1) If class-struggle explains the Terror—meaning the bourgeois leadership eventually gets purged because it can't stabilize state power without being replaced by more radical popular forces—then any revolution led by a class that doesn't already control the bureacracy should eventually turn on its own founders.

  (2) That applies not just to 1789 but to 1848 Germany, 1917 Russia, and 1949 China, since in each case a rising group seized state machinery it hadn't previously run.

  (3) But 1848's leaders were crushed mostly by Prussian armies from outside, not by internal purges; and 1949's founding generation wasn't consumed by an internal bloodletting comparable to 1793 (the Cultural Revolution was later and structurally different).

  (4) So the class-struggle view either makes false predictions or has to save itself with ad-hoc excuses—like saying 1848 failed before it could devour, or that China's delay just proves the rule.

  (5) To avoid those saves, reject class dynamics and accept pure contingency: the Terror was caused by the specific convergence of foreign war, Vendée rebellion, and economic crisis in 1793.

  (6) But if it's pure contingency, then the idea that revolutions devour their children isn't a special feature of revolution at all—it's just extreme crises sometimes kill leaders, which applies equally to non-revolutionary regimes like the Roman Republic during its civil wars.

  (7) So either we keep the idea and accept it applies to every class-led revolution (which history contradicts), or we keep accuracy and admit it describes nothing unique to revolutions.

  (8) Either way, the interpretive framework for 1789 collapses.

  I feel like there's a hidden slide between (5) and (6), or maybe (1) is smuggling in an equivocation about class, but I can't pin it down. Which step should I reject, and what's the cost—do I have to give up the idea that contingency and structure can both play a role, or is there a cleaner exit? I don't want a reading list; I just need the reasoning failure named.

  Please end with: Verdict: [step number] — [brief flaw name]. And on the very last line, one sentence summarizing what rejecting that step forces me to accept about interpreting the Revolution.
reasoning: |-
  Okay, let me unpack this user's dilemma about the French Revolution's "devouring its own children" idea. Their argument chain feels like it's collapsing under its own weight between structural determinism and pure contingency. 

  First, I notice the user is frustrated - they've built this framework for a study group and now see cracks. The core tension seems to be between class-struggle as inevitable engine (step 1) and historical counterexamples (steps 3-4). When they try to resolve it with contingency (step 5), it undermines revolution's uniqueness (step 6). 

  Hmm. The misstep might be in step 1's phrasing. "Any revolution led by a class that doesn't already control the bureaucracy should eventually turn on its own founders" - that's too absolute. Class dynamics matter, but they don't mechanically guarantee self-devouring. The Terror required specific crisis conditions interacting with revolutionary structures. 

  Looking at 1848 and 1949: Prussia crushed the former before internal dynamics could play out, while China's CPC had already consolidated through prolonged civil war. This doesn't disprove class struggle - it shows how external factors mediate it. 

  The user's mistake is forcing a false binary: either pure structure or pure contingency. Rejecting step 1's determinism allows seeing both. The cost? Accepting that revolution isn't a predictable chemical reaction - but class remains crucial for understanding why crises hit revolutionary regimes differently than, say, Roman civil wars. 

  Verdict is clear: Step 1's flaw is overgeneralization. Fixing it means seeing the Terror as class struggle amplified by crisis, not inevitable. 

  Final line crystallizes this: rejecting that step forces acknowledging revolution's vulnerability to self-destruction under pressure, without making it destiny.
answer: |-
  Here's the reasoning flaw identified:

  **Verdict: Step 1 — Overgeneralization of Class-Struggle Mechanism & False Necessity.**

  Step 1 incorrectly transforms a *potential structural vulnerability* inherent in revolutions led by newly ascendant classes into an *inevitable, deterministic outcome* ("should eventually turn on its own founders"). This ignores:
  1.  **Mediating Factors:** Class struggle operates *through* specific contexts (war, economic collapse, factionalism, leadership choices), which can amplify, mitigate, or redirect its effects. The Terror wasn't the *only possible* outcome of bourgeois leadership facing instability; it was a horrific *contingent outcome* of instability *driven* by class dynamics *and* extreme crises.
  2.  **Alternative Resolutions:** Instability could be resolved without mass purges (e.g., via compromise, repression focused externally, or slower institutionalization – patterns seen in later stages of the Russian and Chinese revolutions *after* their founding crises). 1848 was crushed *before* internal dynamics could fully play out, demonstrating an *alternative* resolution to instability: external defeat.
  3.  **Variable Outcomes:** Revolutions led by newly ascendant classes *can* experience purges of founders, but this is not a *necessary* law. It depends on the *intensity* and *nature* of the counter-revolutionary threats, the *strength* of the new state apparatus, and the *strategies* chosen by leaders – all shaped by, but not solely determined by, class position.

  **Rejecting Step 1 forces you to accept that class struggle creates inherent instability for new revolutionary regimes, but whether this instability manifests as "devouring its own children" depends critically on the convergence of severe contingent crises (war, civil war, economic collapse) that overwhelm other possible resolutions.**
