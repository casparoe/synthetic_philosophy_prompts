answer: |-
  Here's the conceptual ground you need, stripped down to essentials:

  **1. Non-negotiable requirements (~120 words)**
  *   **Must cover the spectrum:** Handle purely scripted bots, stateless procedurals (new each load), *and* cross-save persistent entities without bias. The theory can't *start* by assuming persistence equals personhood.
  *   **No consciousness shortcut:** Cannot rely on proving/disproving "real" consciousness (philosophical quagmire). Must function without resolving the Hard Problem.
  *   **Computational integrity:** Cannot violate fundamental CS principles (e.g., state is data + processing; persistence requires storage/retrieval). Actions within the sim are real computational events.
  *   **Scalable moral weight:** Must allow for *degrees* of moral consideration, tied to complexity, persistence, and responsiveness – not just a binary "has status/doesn't".
  *   **Player action matters:** Must account for the player's role in shaping the persistent state and the potential harm/benefit *within the NPC's experiential framework*.

  **2. Distinctions and edge cases (~120 words)**
  *   **Simulated vs. Real Suffering:** The *display* of pain (scripted scream) is distinct from a persistent entity *registering* thwarted goals/negative states *consistently* based on its history and inputs. Only the latter *might* be morally relevant.
  *   **Authored vs. Autonomous:** Initial authorship (dev scripting) doesn't negate emergent autonomy *if* persistent state leads to genuinely unpredictable, goal-directed behavior adapting to player history. The source isn't the key; the *functional outcome* is.
  *   **Edge Cases:** NPCs that *reference* past saves via clever scripting (illusion of persistence)? Entities persistent *within* a single session but reset on quit? Partial persistence (only remembers likes/dislikes, not events)? The theory must clarify thresholds without arbitrary lines.

  **3. The knock-out punch (~80 words)**
  The **"Goal-Directed Persistence" Trap**. Most intuitive takes fixate on memory/persistence alone. The knockout requirement: **Moral consideration requires not just state persistence, but *goal-directedness* that can be *thwarted*.** A persistent entity must exhibit *striving* towards internal states (happiness, task completion, relationship depth) *based on its history*, and player actions must be able to *frustrate* these strivings *consistently within its framework*. Pure memory without goals is just data; goals without persistence lack continuity. Both are needed.

  **4. Confidence check (~60 words)**
  Overall confidence: **80%.** This framework handles your core cases and avoids major pitfalls. The shakiest point? **Defining "goal-directedness" rigorously enough.** Where's the line between complex reactivity (e.g., sophisticated enemy AI adapting tactics) and a persistent NPC *striving* for something internal? It's fuzzy. Does "wanting to see the player again" (emergent from persistence) count as a goal? That's the crux for your deletion scene. Tread carefully there.

  This gives you the bones. Build the flesh of the dilemma on whether *her* specific persistence exhibits thwartable goal-directedness within the game's logic. Good luck!
