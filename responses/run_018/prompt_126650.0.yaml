prompt: |-
  In my grad seinar on historical explanation last Tuesday a student tossed out Braudel's old image — events are just foam on the waves of deep history — to dismiss a colleague's paper on the French Revolution. I need you to pull that slogan apart into exactly five distinct precise readings, from the trivial temporal-scale point to the radical metaphysical version, label each as trivial, defensible, false, or loaded, and say for each whether it actually supports dismissing event-level explanations. Give me this as a numbered list with exactly five items, each a sentence or two, with no introduction or conclusion, since I'm printing it straigt for office hours. Make sure you cover whether geography is being smuggled in and flag which reading is the one people usually invoke without noticing.
