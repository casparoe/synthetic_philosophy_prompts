answer: |-
  The institutional design of anonymous peer review implicitly relies on a **role-based, non-relational conception of standing to blame** and a **compartmentalized view of hypocrisy**, prioritizing institutional efficiency over individual moral consistency. Here's the reconstructed philosophical account:

  ### Core Presuppositions:
  1. **Standing as Institutional Authorization**:  
     Standing to blame derives *solely* from the reviewer's assigned institutional role (gatekeeper of scholarly standards), not personal virtue or relationship to the author. The reviewer acts as a **fiduciary for the discipline**, empowered to judge based on communal norms (originality, rigor) regardless of personal conflicts. This severs standing from personal "clean hands."

  2. **Hypocrisy as Irrelevant to Role-Performance**:  
     Hypocrisy is confined to the *personal moral sphere* and deemed irrelevant to institutional judgment. Anonymity ensures the reviewer's personal research agenda remains disconnected from their evaluative role. The practice assumes that:  
     - **Anonymity severs relational conditions**: By removing personal identity, it eliminates the *interpersonal context* necessary for charges of hypocrisy (which require knowledge of the accuser's conduct).  
     - **Role-authorization supersedes personal standing**: The institution’s mandate ("evaluate this work’s merit") overrides any need for moral purity in the individual.

  ---

  ### What the Practice *Requires* vs. *Accommodates*:
  | **Element**               | **Strictly Required**                                  | **Merely Accommodated**                              |
  |---------------------------|-------------------------------------------------------|------------------------------------------------------|
  | **Reviewer Anonymity**    | Concealment of reviewer identity from author          | Concealment of reviewer’s *specific research plans*  |
  | **Standing to Reject**    | Authority to judge based on institutional criteria    | Moral "clean hands" (e.g., lack of parallel work)    |
  | **Originality Standard**  | Rejection if work duplicates *published* scholarship  | Rejection if work overlaps *unpublished* work (including reviewer’s) |
  | **Hypocrisy Norms**       | No disclosure of conflicts beyond institutional scope | Avoidance of *actual* intellectual theft by reviewers |

  ---

  ### Tensions in the Coherence of the Theory:
  The practice attempts to reconcile two conflicting principles:
  1. **Institutional Impersonality**: Anonymity frames judgment as objective, detached, and interest-neutral.  
  2. **Intellectual Property Norms**: The expectation that authors avoid duplicating a reviewer’s *unpublished* work implicitly recognizes the reviewer’s *personal scholarly stake*.

  **Why this creates incoherence**:  
  - **Anonymity denies relational standing** → Yet the *expectation of non-replication* assumes the reviewer has a *personal, proprietary claim* to ideas.  
  - **Role-authorization justifies verdicts without self-disclosure** → But if the reviewer’s hidden work grounds rejection, the judgment is *contingent on personal interests*, violating role purity.  
  - **Hypocrisy is structurally obscured** → Reviewers can condemn "unoriginality" they themselves create by hiding parallel work, exploiting anonymity to avoid accountability.

  ---

  ### Can a Single Theory Justify Both Norms?
  **No.** The design relies on a **pragmatic contradiction**:  
  - **For anonymity/role-standing**: It adopts a **quasi-legal model** where the reviewer is an impartial juror. Standing flows from expertise and institutional mandate, not individual integrity.  
  - **For non-replication expectations**: It defaults to a **communal honor system** where scholars respect informal ownership of unpublished ideas, presupposing *relational moral duties* among peers.  

  Anonymity severs the relational ties necessary to enforce the latter. The reviewer’s undisclosed work becomes a "secret standard" for originality, transforming the process from objective evaluation into a power dynamic favoring entrenched interests. This undermines the impartiality the anonymity norm was meant to protect.

  ---

  ### Conclusion:
  The practice presupposes a **utilitarian compromise** that prioritizes efficiency and candid assessment over moral coherence. It assumes hypocrisy is nullified by anonymity and role-based standing, yet tacitly relies on personal scholarly rights that anonymity renders unenforceable. While defensible as a *practical* solution to resource constraints, it lacks philosophical consistency. A coherent theory would require either:  
  (a) **Full transparency** (abandoning anonymity to restore relational standing), or  
  (b) **Strict role-purification** (banning rejections based on overlap with unpublished work, treating ideas as communal until publication).  

  The current system hybridizes incompatible models, exposing authors to ethically fraught judgments while protecting reviewers from accountability—a tension inherent in its design.
