prompt: |-
  hey, I'm working up a dissertation prospectus and I need you to help me sharpen the framing. My idea is about Dewey's experimentalism—specifically, whether his logical concept of an indeterminate situation can be mapped onto democratic disagreement without just collapsing into the idea that democracy is inquiry. Most people read Dewey as saying democratic politics should work like scientific inquiry, but I'm wondering if there's a stricter condition: for Dewey, inquiry only starts when the situation is genuinely unsettled, not just contested. So is partisan polarization actually an indeterminate situation, or is it just a failure to apply the scientific attitude? I want a proposal that states this precisely, explains why standard readings miss the distinction, lays out the method—probably comparing Dewey's Logic with Public and Its Problems—says what result counts and what'd be failure, and gives a realistic timeline for one year. Don't worry about citations, I'll fill them in myself. Give me exactly five numbered items, each a sentence or two, no intro or conclusion. Just talk me through it like we're in the hall, and try not to make it sound like a grant application for NASA—though I know that's basicly impossible.
