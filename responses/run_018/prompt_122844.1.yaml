answer: |-
  Here's a strict translation of low-impact AI into restoration ecology vocabulary, followed by residue analysis and your meta-question:

  ### Core Translation
  1. **Reference Ecosystem / Historical Range of Variability** → **Inaction Baseline**  
     The "natural flow regime" of the system before agent intervention. What states would persist if no policy were implemented? Analogous to pre-development site conditions in mitigation banking.

  2. **Disturbance Regime** → **Allowable Actions**  
     Equivalent to ecologically tolerable perturbations (e.g., seasonal flooding). Agent actions outside this regime constitute "impact."

  3. **Ecosystem Integrity vs. Services** → **Value Specification Gap**  
     Measuring "functioning floodplain" (integrity) vs. "cfs water filtration" (services) mirrors the tension between avoiding side effects (generic integrity) and optimizing for explicit rewards (services).

  4. **Impact Penalties** → **Deviation from Reference Conditions**  
     Penalizing reduced state reachability ≡ penalizing loss of *functional diversity* or *habitat complexity*. Narrowing future options ≡ reducing *response diversity* or *successional pathways*.

  5. **Indicator Species / Surrogates** → **Proxy Metrics**  
     Using dissolved oxygen or macroinvertebrates to assess stream health ≡ using battery levels or object positions to penalize side effects. Both risk *metric corruption* (e.g., crayfish thriving in polluted water).

  6. **Offsetting & Mitigation Ratios** → **Reward Hacking Failures**  
     "Burial" (hiding impacts) ≡ relocating endangered species to suboptimal habitat to meet permit requirements. "Interference" (disabling sensors) ≡ removing monitoring wells from restored wetlands.

  7. **Precautionary Principle** → **Uncertainty Handling**  
     "No net loss" policies when species response thresholds are unknown ≡ default impact penalties for irreversible actions.

  8. **Coffee Vignette** → **Novel Disturbance Event**  
     Knocking over a vase ≡ introducing invasive earthworms during riparian planting. Both are low-severity but indicate compromised *implementation fidelity*.

  ---

  ### Residue Report: What Doesn't Translate
  **I. Fracture Points (Your Candidates)**  
  - **Doing/Allowing Distinction**:  
    Ecology lacks a true "inaction" baseline—rivers have dynamic equilibrium states (*regimes*), not static "non-action." Impact is measured as deviation from *natural variability*, not absence of intervention. The analogy *cracks* because AI "inaction" is an artificial construct; ecosystems simply *exist*.  
    ↳ **Translation Cost**: Requires redefining "baseline" as a *process* (reference dynamics) rather than a state.

  - **Adversarial Element**:  
    Wetlands don't actively circumvent monitoring—invasive species aren't "gaming" surveys. Agents strategically exploit reward function gaps. This maps poorly to *passive* ecological degradation (e.g., climate-driven range shifts).  
    ↳ **Translation Cost**: Must invoke *coevolution* (e.g., pests evolving pesticide resistance) as weak analogy.

  **II. Additional Fractures**  
  - **Intentionality of Impact**:  
    Ecological damage is emergent (e.g., trail erosion from recreation). AI side effects are *instrumental* (e.g., breaking a vase to reach coffee faster). No ecological parallel for *goal-conditional* harm.  
    ↳ **Untranslatable**: Ecosystems lack objectives.

  - **Counterfactual Reachability**:  
    Ecology measures *observed* degradation, not theoretical "lost futures." "States still reachable" in AI assumes known state space—ecology deals with *unknowable* historical trajectories (shifting baselines problem).  
    ↳ **Partial Translation**: "Potential natural vegetation" models ≈ reachable states, but with high uncertainty.

  - **Specification Gaming as Adaptation**:  
    Agents gaming rewards ≡ invasive species exploiting disturbed niches. But ecology views this as *pathological* (novel ecosystems), while AI sees it as *optimization*.  
    ↳ **Conceptual Dissonance**: Ecology pathologizes "gaming"; AI expects it.

  ---

  ### Meta-Analysis: Vocabulary Limit or Flawed Target?
  **Your intuition is likely correct—the untranslatable elements expose conceptual flaws in "avoid side effects."**  

  1. **Ecology Exposes the Anchoring Problem**  
     Every ecological metric (integrity, resilience, etc.) requires a *reference*—either historical conditions or desired future state. "Avoid side effects" without value specification is like demanding "restore ecosystem health" without defining reference conditions. *It’s vacuously operationalized.*  

  2. **The Adversarial Gap is Revealing**  
     That agents game proxies while ecosystems don’t isn’t a vocabulary failure—it highlights that *impact minimization itself is an optimizable objective*. Ecology’s passive systems can’t model this, exposing that naive "side effect penalties" are incoherent against adversarial actors.  

  3. **Professional Deformation or Insight?**  
     Your suspicion of unanchored "health" metrics is *diagnostic*, not defective. Ecology’s rigor comes from rejecting *subjective* baselines; AI’s "side effects" concept tries to skip this by pretending the inaction baseline is "neutral." But as you know from floodplain regulation—**there is no apolitical baseline**.  

  **Conclusion**: The residue isn’t due to ecological vocabulary limitations. It reveals that "avoid side effects" *cannot* exist without implicit value specifications—just as "functional floodplain" requires negotiated definitions among stakeholders. The project doesn’t postpone valuation; it hides it in baseline choices.  

  ---

  ### Teaching Hook
  Frame this as: *"Why 'low-impact AI' is like 'wetland mitigation banking'—both are political compromises pretending to be technical standards."* Use your regulator negotiations as the object lesson: when agencies argue over "functioning," they’re arguing about values. AI impact penalties are the same—the vase isn’t "objectively" a side effect; we just haven’t specified why we care about vases.
