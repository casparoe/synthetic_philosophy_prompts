answer: |-
  Here's a quick brainstorm of the three standard moves in the performance legitimacy debate:

  1.  **Consequentialist Justification:** "Regime X is legitimate because it delivers stability, prosperity, and effective governance (outputs), benefiting the people." (Developmental-state focus)
  2.  **Proceduralist/Democratic Rebuttal:** "Legitimacy fundamentally requires popular consent, expressed through free elections, rights protections, and democratic processes (inputs), regardless of outputs."
  3.  **Stability/Order Emphasis:** "Authoritarian regimes provide essential order and prevent chaos, which is the primary foundation of legitimacy, especially in fragile states or during development." (Often paired with #1).

  **Diagnosis of the Stalemate:**

  The core stall isn't primarily about conflicting facts or untested empirical claims about growth *causing* stability or popular acceptance (though these are complex). It stems from **bedrock normative intuitions combined with a persistent conflation of descriptive and normative legitimacy.**

  1.  **Bedrock Intuitions:** The debate founders on fundamentally different starting points:
      *   **Developmentalists:** Prioritize *outcomes* (well-being, security, growth) as the ultimate source of legitimacy. Stability and prosperity *are* the manifestation of the social contract's fulfillment ("We the government deliver X, therefore we are legitimate"). Their "legitimacy" is often **descriptive/sociological** (belief in legitimacy among the governed).
      *   **Liberal Critics:** Prioritize *procedures and rights* (consent, autonomy, participation) as the *only* morally justifiable source of authority. Good outcomes achieved through authoritarian means are insufficient, even welcome. Their "legitimacy" is **normative/moral** (whether the regime *ought* to be obeyed based on just foundations).
      *   **The Chasm:** No amount of GDP growth data convinces the proceduralist that consent is irrelevant. No amount of human rights critique convinces the consequentialist that outcomes don't matter when people's lives demonstrably improve. These are competing foundational values.

  2.  **The Definitional Knot (Verbal Dispute):** You've hit the nail on the head. The core confusion is the conflation of:
      *   **Descriptive (Sociological) Legitimacy:** Does the population *believe* the regime has the right to rule? (Empirical question: surveys, observable compliance, lack of mass revolt).
      *   **Normative (Moral) Legitimacy:** *Ought* the population believe the regime has the right to rule based on just principles? (Philosophical question).
      Developmental-state advocates point to evidence of *descriptive* legitimacy (high regime support surveys in China/Singapore, apparent stability) as proof of legitimacy *full stop*. Liberal critics argue that without the *normative* foundations of consent/rights, descriptive acceptance is either irrelevant, coerced, or based on false consciousness. **They are often talking past each other using the same word for different concepts.**

  3.  **The Hidden Empirical Claim (Less Central, But Real):** There *is* an under-examined empirical layer concerning **institutional causation and sustainability**:
      *   **Claim:** Authoritarian institutions are uniquely capable of delivering long-term development, stability, and effective problem-solving, especially compared to messy democracies.
      *   **Critique:** Is this causal relationship true? Or is growth contingent on specific historical/geopolitical contexts, and can democracies achieve similar (or better) outcomes? Can authoritarian systems *sustain* performance, adapt to complex challenges, and avoid stagnation/corruption without feedback mechanisms? Is the stability real or repression? This *is* testable in principle (comparative historical analysis, institutional economics, complex systems modeling), but it's incredibly difficult to isolate variables and define "success" neutrally. Proving/disproving this wouldn't *resolve* the normative clash, but it could shift the ground the consequentialist argument stands on.

  **Epistemic Authoritarianism: New Angle or Old Wine?**

  *   **Connection:** It's a *refinement* within the consequentialist/performance framework. It shifts the justification from pure *outputs* (GDP, stability) to the quality of the *decision-making process itself*. It argues the regime is legitimate because its structure (centralized, expert-driven, shielded from populism/short-termism) leads to *better decisions* (which are assumed to produce better outcomes).
  *   **Distinction:** It moves beyond crude "growth = legitimacy" to a more sophisticated claim about *knowledge and governance capacity*. It directly challenges the liberal claim that democratic procedures inherently produce the best or most legitimate decisions.
  *   **Still Stuck?** Absolutely. Liberal critics will still argue:
      1.  Who defines "better" decisions? Without popular input, it's paternalistic.
      2.  Epistemic superiority is assumed, not proven, and democratic deliberation has its own epistemic virtues.
      3.  **Crucially:** Even if proven superior *in some domains*, it doesn't address the core normative demand for *consent and self-determination*. Knowledge ≠ right to rule without authorization.

  **What Counts as Progress?**

  1.  **Conceptual Clarity as Essential First Step:** Explicitly and rigorously distinguishing between **Descriptive Legitimacy** (an empirical social fact) and **Normative Legitimacy** (a moral judgment) is non-negotiable for any meaningful debate. This doesn't *resolve* the disagreement but forces each side to argue on appropriate grounds.
  2.  **Targeted Empirical Research:** Focusing research on the *hidden empirical claim*:
      *   Rigorous, comparative studies on the *long-term* institutional capacity of different regimes to deliver *sustainable* prosperity, stability, adaptation, and effective crisis response.
      *   Investigating the *causal mechanisms* linking regime type, decision-making processes (including epistemic claims), and outcomes, controlling for context.
      *   Deep analysis of the *nature* of stability and acceptance in authoritarian systems (Is it genuine contentment? Fear? Apathy? Calculated acceptance?).
  3.  **Normative Engagement on New Ground (Epistemic Angle):** Instead of rehashing "consent vs. outcomes," the epistemic claim forces a debate on: *Under what conditions (if any) could superior knowledge/decision-capacity justify bypassing democratic authorization?* This requires engaging with complex political epistemology, not just rights theory.
  4.  **Acknowledging Separate Questions:** Ultimately, recognizing that:
      *   The question "Is this regime stable and widely accepted?" (Descriptive) is different from...
      *   ...the question "Ought this regime be stable and accepted?" (Normative).
      *   Progress might involve accepting that these are distinct (though related) inquiries, and that definitive answers satisfying *both* foundational intuitions simultaneously may be impossible. The debate then becomes about which dimension is *primary* or how they interact in specific contexts, rather than one "disproving" the other.

  **In short:** The stall is primarily driven by **irreconcilable bedrock values** (outcomes vs. procedures) exacerbated by **conflating descriptive and normative legitimacy**. Conceptual clarity is vital. Progress requires rigorous empirical work on institutional causation *and* deeper normative engagement with new justifications like epistemic claims, while acknowledging the fundamental distinctness of the descriptive and normative questions.
