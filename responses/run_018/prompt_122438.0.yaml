  I'm trying to locate where my disagreement with my PI actually lives, so I want a decomposed credence rather than a verdict.

  The site is single-phase, about a dozen households, abandoned rather than destroyed. The building in question is 6 × 8 m, centrally placed, mudbrick on stone footings: in construction, size and orientation it is indistinguishable from the houses. What sets it apart: a plastered floor relaid seven times (houses: once or twice); a small wall niche directly opposite the doorway; a cache of around thirty vessels stacked inverted beneath the floor beside the niche; a doorway noticeably narrower than the houses'; no hearth and no grinding stones, spindle whorls or everyday storage jars; four small stone bowls and a dozen incised sherds; and a bone assemblage from the interior (n ≈ 140 identified specimens) that is about seventy percent sheep/goat right forelimbs, where the houses yield a mixed, species-diverse spread. Complicating this: a second, smaller building on the village edge has the same niche-and-replastering pattern but also a hearth and a grinding stone.

  Give me your credence that this building was a shrine — a space used primarily for ritual practice — rather than a residence, decomposed: for each sub-question a number and one line of justification, then the combination. At minimum I want terms for the prior on a nondescript, centrally placed building of this size being non-domestic at all; for how much the absence of hearth and domestic toolkit can carry versus alternatives such as storage, seasonal use, or a men's orFeasting space; for how diagnostic the niche and the replastering sequence remain once the second building is on the table; for whether the forelimb pattern indicates deposition rather than butchery, transport or taphonomy at n = 140; and for how much rides on the house/shrine dichotomy being the right partition rather than something like a domestic shrine or a public building. My PI is near 0.85 and I am near 0.4; tell me which sub-question most likely carries that gap. Then name the single further line of evidence, recoverable from the ground rather than from texts, that would move your number most, and say roughly how far.
