    - Lack of domestic wear (e.g., foot traffic, grinding stains).  
  - **Impact**: If plaster shows ritual signatures (e.g., no soot, ritual materials), credence → **0.95**. If it reveals hidden domestic use (e.g., organic residue from cooking), credence → **0.3**.  
  - **Swing**: Up to **±0.65** depending on results.  

  **Rationale**: This directly tests whether replastering reflects ritual renewal or functional repair—resolving ambiguity in the key "shrine" indicator while bypassing textual evidence.
