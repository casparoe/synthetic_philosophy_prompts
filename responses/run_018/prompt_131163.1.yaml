answer: |-
  ### Restatement of von Neumann's Position in Archival Terms  
  Von Neumann argued that for a technological system to survive civilizational collapse, it must contain:  
  1. **Self-Description**: A complete, immutable blueprint (e.g., bitstream + structural metadata) encoding its own construction.  
  2. **Embedded Interpreter**: An execution environment *within the same archival package* capable of:  
     - Reading the blueprint,  
     - Constructing a functional instance of itself,  
     - Detecting and correcting bit-rot in the blueprint *and itself* without external tools.  
  3. **Substrate Independence**: The interpreter must physically reside on the same storage medium as the blueprint, enabling autonomous reactivation.  

  In archival terms: The system must be a *self-contained archival package* with executable preservation metadata (the interpreter) that can render and repair the object *and its own rendering engine* using only local resources. No external format registries, migration tools, or emulation layers are permitted.  

  ---

  ### Residue Report  
  | Von Neumann Element             | Archival Translation                          | Residue Type       | Analysis |  
  |---------------------------------|-----------------------------------------------|-------------------|----------|  
  | **Self-description**            | Fixity-checked object + PREMIS-like metadata  | Clean             | Matches archival encapsulation. |  
  | **Blueprint execution**         | Emulator embedded in package                  | Distorted         | Archivists separate emulators from data; embedding violates preservation partitioning. |  
  | **Self-repair of blueprint**    | Built-in checksums + error correction         | Clean (partial)   | Archivists use fixity tools but *externally* applied. |  
  | **Self-repair of interpreter**  | N/A                                           | **No expression** | Archivists assume emulators decay irreversibly; no concept of self-healing environments. |  
  | **Single-substrate requirement**| Storing data + emulator on same medium        | Distorted         | Archivists prioritize format/media migration, rejecting substrate binding. |  

  **Critical Residue**: The requirement for the interpreter to **self-repair without external references** has no archival counterpart. Archivists rely on:  
  - External format registries (PRONOM),  
  - Emulator libraries (e.g., Dioscuri),  
  - Migration pipelines.  
  Von Neumann’s "embedded interpretive closure" implies an *autonomous* error-correction mechanism—a concept absent in archival science. This is not imprecision in von Neumann but a genuine gap: archivists assume preservation is an *institutional activity*, not an intrinsic property of artifacts.  

  ---

  ### Survivability Gap: Archival Restatement  
  **Tension**: Minimal-dependency packaging (e.g., PDF/A with embedded fonts) maximizes fixity but cannot self-repair complex errors. Rich emulation environments (e.g., VM with OS/drivers) enable self-correction but depend on deep dependency chains vulnerable to "link rot" in preservation ecosystems.  

  **Is this a new trade-off?**  
  - **Yes**, strategically: It exposes a conflict between:  
    - *Preservation Integrity* (minimal dependencies = fewer failure points) and  
    - *Functional Resilience* (complex dependencies = better error recovery).  
  - **No**, operationally: It collapses into the classic fixity-vs-accessibility dilemma *with a new constraint*. Archivists already balance containerization (e.g., WARC) against emulation depth (e.g., multi-layered Docker containers). The novelty is von Neumann’s **self-repair imperative**:  
    - Archivists accept that dependencies *must* be externally managed.  
    - Von Neumann demands dependencies *internalize* their own maintenance.  

  **Conclusion**: The gap reveals that archival strategies optimize for *continuity of stewardship*, while von Neumann’s model requires *stewardship without stewards*. The trade-off is real but unsolvable within current archival paradigms—it necessitates rethinking artifacts as active preservation systems.  

  ---  
  *Final note: Von Neumann’s framework challenges archival orthodoxy by treating "interpretability" as a material property of the artifact, not a service provided by institutions. The residue isn’t semantic—it’s ontological.*
