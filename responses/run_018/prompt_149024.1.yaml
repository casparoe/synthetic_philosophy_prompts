  ## The Tuesday Stitch

  Every Tuesday, Anna woke to the same grey light, the same distant wail of Mrs. Henderson’s faulty kettle, the *plink-plink* of the leaky tap she’d never get around to fixing. And every Tuesday, she reached for the blue notebook on her bedside table. The *only* thing that didn't reset.

  This Tuesday, she stared at the page, her neat handwriting detailing the previous loop’s identical mundanity. Flatmate Elara shuffled past the open door, mug steaming. "Still scribbling at the universe, Annie?"

  "It proves it," Anna murmured, tapping the notebook. "Not just *that* it loops. *This*." She pointed at her own head.

  Elara leaned against the doorframe, skeptical. "Proves what? That your notebook’s weird?"

  "No. Proves *me*." Anna’s voice tightened with the effort of articulation. "For Tuesday to feel like a *repetition*... for me to even *notice* the sameness... there *has* to be something stitching them together. A continuous... synthesizer." She wrote the word deliberately: **Synthisis**. "Otherwise, each Tuesday would just *be*. No comparison. No ‘again’. The noticing *requires* a stable me across the gap."

  Elara blew steam off her tea. "Or it requires a story. *Your* story. You wake up, you see the jam stain on the counter *again*, you remember yesterday-Tuesday’s identical jam stain, and you think, ‘Loop!’. But that memory, that feeling of repetition… it’s just how your brain frames *this* moment. Doesn't mean there’s some ghost ‘you’ substrate holding it all. Maybe it’s just… narrative glue." She took a sip. "Neat trick of the notebook, though. Persistent prop."

  Anna looked down. The **Synthisis** glared back. A misspelling. If she were this perfect, continuous synthesizer, wouldn't she have written it right? Every time? But she hadn’t. Last Tuesday, she’d written it exactly the same way. The persistent notebook faithfully recorded her persistent error.

  The leaky tap went *plink… plink… plink*. Was the notebook the proof of the synthesizer? Or was the synthesizer just a desperate character, conjured *by* the notebook – the only tangible anomaly in a fractured time? Did the stitching exist because the thread was visible? Or was the thread visible because she insisted on stitching?

  Anna closed the notebook. Its familiar weight was solid in her hand. Evidence, or the *only* anchor a narrative needed to feel real? She traced the misspelled word through the cover. Outside, Mrs. Henderson’s kettle started its inevitable, looping wail.

  ---

