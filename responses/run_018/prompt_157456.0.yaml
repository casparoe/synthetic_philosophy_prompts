answer: |-
  The paradox of phenomenal judgment for epiphenomenalism centres on the status of our reports and beliefs about conscious experience. Epiphenomenalism holds that phenomenal properties—the subjective qualities of experience, like the redness of red—are causally inert byproducts of physical processes. They are caused by brain states but exert no causal influence themselves, not even upon our judgments *about* them. The tension arises when considering how judgments concerning these phenomenal properties could be accurate or rationally justified if the phenomenal properties themselves play no role in forming those judgments.

  A common dissolution attempts to bypass this by asserting that the *same* physical state which produces the phenomenal experience *also* directly causes the associated phenomenal judgment. While this secures a reliable correlation between the occurrence of the experience and the judgment reporting it, it fails to address the core issue of *rational justification*. Reliability, secured by shared physical causes, is not equivalent to rational grounding. The judgment "I am experiencing red" is not merely a caused event; it purports to be *about* a specific phenomenal property and claims truth based on an apparent awareness *of* that property. For the judgment to be rationally justified, its content must be appropriately connected to the truth-maker—the phenomenal property itself—in a way that provides a reason for holding it true. The epiphenomenalist account severs this justificatory link. Because the phenomenal property does not contribute to forming the judgment, the judgment's content cannot be rationally responsive *to* the very property it describes; the phenomenal property is, in principle, inaccessible as a rational basis for the judgment. The judgment is caused *as if* it were reporting the experience, but the experience itself provides no reason for it.

  This mirrors the situation with mathematical judgments. The truth of "2 + 2 = 4" depends on abstract mathematical relations, which lack causal powers. Our judgment "2 + 2 = 4" is caused by physical brain processes. If these processes reliably produce true mathematical judgments, we have correlation. Yet, rational justification requires more: it requires that the judgment be formed through cognitive access to the mathematical truths themselves, via understanding, proof, or logical inference. The abstract truth grounds the justification for our belief; the physical cause merely enables the belief's occurrence. Similarly, for phenomenal judgments, rational justification seems to require that the phenomenal property itself is cognitively accessible and provides the evidentiary ground for the judgment. Epiphenomenalism renders phenomenal properties rationally inaccessible, as they cannot play any role in the cognitive process leading to the judgment. While physical causation ensures the judgment reliably co-occurs with the experience, it cannot bestow the rational warrant that seems intrinsic to first-person reports of experience, which present themselves as directly responsive to the phenomenal quality. The causal chain producing the judgment bypasses the very property the judgment is about, leaving the justification for its specific content unexplained and placing the accuracy of phenomenal judgments in a state of unexplained, brute correlation rather than rational insight.
