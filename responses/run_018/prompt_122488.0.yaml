prompt: |-
  hey — hoping you can help me with something work related. I did about six years in a public defender's office (mostly felonies, a bit of appellate) and now I'm the lawyer on our hospital system's algorithm review board. County system, four hospitals. About eighteen months ago we turned on a model that every night assigns the next-day "transitional care" slots — a home nurse visiting you for two weeks after discharge. There are never enough, something like 40 slots for 90-ish eligible patients, and the floor nurses basically always take the ranking, so in practice it's deciding.

  Last month it ranked a 74-year-old man on home oxygen, no carer at home, 61st. He was discharged without a slot and died at home nine days later. Not clear the slot would have saved him, but the model's own output attached something like a 1-in-8 estimate of death or readmission inside thirty days for him, and the people above him had bigger expected gains. The family's lawyer is writing letters that lean on the word "knew," and my board has to put out a one-page finding.

  Here's what I actually want. I keep hearing the AI safety people argue about whether a system should reason like a utilitarian or like a deontologist, and I want that debate translated into my vocabulary — actus reus and mens rea, intending vs merely foreseeing, oblique intent, the lesser-evils / necessity thing, duties and liability for omissions, complicity, proportionality — as faithfully as you can. Then I want the residue report: what maps cleanly, what you had to bend to make it fit, what has no counterpart in criminal law at all, and whether the residue is a hole in my vocabulary or a muddle in theirs.

  Complication that I think matters: the artifact isn't one agent with one decision procedure. The base model was trained to imitate what discharge planners historically did, and then somebody bolted on a ranking layer that maximizes something QALY-ish, and then a third layer applies hard floors (don't rank anyone on home oxygen below line 45, that kind of thing). So "is the system a utilitarian" may not even be a well formed question about a pipeline where the valuing is spread across three components written by three teams.

  Things I'm already suspicious about, take positions on them: (1) I think our intending/foreseeing distinction is going to mangle the philosophers' intended-vs-merely-foreseen one, because in law foresight of a near-certain consequence can be intent, so the line isn't drawn where double effect draws it. (2) mens rea is a fact about a person's mind at a moment, and I don't know what the counterpart is for a model — maybe the honest answer is that the only facts available are facts about design and training objective. (3) the lesser-evils balancing I know is one vignette at a time, immanent harm, no aggregation of many small harms across many nights, and it won't let you kill one to save five; utilitarian AI is aggregation all the way down. (4) our constraint set was written by a committee trying not to take sides about what makes a life go well, and the constraints contradict each other — we can't count whether someone has kids at home, but we're told to prioritize the worst off — which makes me think "deontological AI" just means "an AI following rules somebody aggregated earlier," i.e. the values question doesn't go away, it moves.

  Two practical constraints: the room I defend this finding in has a nurse, a data scientist and a chaplain on it, so flag any phrase that only lands for lawyers and give me the plain version. And no trolleys, no cases, no citations — I want the structure of the thing, I can find authority myself if I need it. Also, if there's a question I should be asking that I'm not, say so at the end.
