answer: |-
  ### Futarchic Proposal Evaluation Procedure  
  **Objective**: Evaluate proposals to replace committee decisions with futarchic mechanisms (prediction markets) in 45 minutes.  
  **Core Principles**: Metric agreement, counterfactual resolution integrity, liquidity/expertise, Goodhart risk, and normative/empirical distinction. Judgment is required at starred (\*) points.  

  ---

  #### **Gate Sequence**  
  **Total Time**: 45 minutes (9 minutes per gate).  

  1. **Gate 1: Metric Clarity and Stakeholder Agreement**  
     - **Question**: Is the metric unambiguously defined, objectively measurable, and agreed upon by all key stakeholders as the sole success criterion?  
     - **Passage**: Written metric definition with:  
       - Measurement methodology (e.g., data sources, collection process).  
       - Timeframe for evaluation.  
       - Signed stakeholder agreement (min. 80% consensus).  
     - **Hard Stop**: Metric is vague, unmeasurable, or lacks stakeholder consensus (<80% agreement).  
     - **Escalation**: Stakeholders disagree on the *value* of the metric itself (e.g., "Why prioritize this outcome?").  
     - **Judgment**: Assessing ambiguity in metric definition\*.  

  2. **Gate 2: Counterfactual Resolution Integrity**  
     - **Question**: Can the metric be measured for the chosen option without contamination from the prediction market, and are counterfactual estimates (for unchosen options) feasible if needed?  
     - **Passage**: Contamination risk analysis showing:  
       - No feedback loops (e.g., market predictions don’t influence outcomes).  
       - Counterfactuals are estimable via historical data, simulations, or controlled experiments.  
     - **Hard Stop**: High contamination risk (e.g., market activity alters outcomes) or infeasible counterfactuals (e.g., unique one-time decisions).  
     - **Escalation**: Trade-offs between contamination risk and decision urgency involve value conflicts (e.g., "Is speed worth accuracy?").  
     - **Judgment**: Evaluating contamination risk severity\*.  

  3. **Gate 3: Liquidity and Expertise**  
     - **Question**: Are ≥100 incentivized stakeholders with direct expertise available to trade in the prediction market?  
     - **Passage**: List of stakeholders with:  
       - Expertise (e.g., domain experience, access to relevant data).  
       - Incentives (e.g., financial, reputational, or outcome-linked stakes).  
     - **Hard Stop**: <100 qualified stakeholders or conflicts of interest (e.g., traders could manipulate outcomes).  
     - **Escalation**: Dispute over who qualifies as an "expert" (e.g., normative disagreement on expertise boundaries).  
     - **Judgment**: Defining "expertise" and incentive adequacy\*.  

  4. **Gate 4: Goodhart Corruption Risk**  
     - **Question**: Is the metric resistant to manipulation or perverse incentives (i.e., optimizing for it won’t degrade correlated values)?  
     - **Passage**: Risk-mitigation plan addressing:  
       - Gaming vulnerabilities (e.g., data sources are auditable).  
       - Alignment with broader goals (e.g., metric correlates with long-term mission).  
     - **Hard Stop**: High manipulation risk with no mitigations (e.g., metric is easily gamed).  
     - **Escalation**: Mitigation requires trade-offs between values (e.g., "Should we sacrifice cost for robustness?").  
     - **Judgment**: Assessing manipulation likelihood and value degradation\*.  

  5. **Gate 5: Normative/Empirical Distinction**  
     - **Question**: Is the decision purely about *maximizing* an agreed value (empirical), not about *defining* the value (normative)?  
     - **Passage**: Statement confirming:  
       - The metric is non-negotiable and value-aligned (e.g., "Flood damage reduction is our goal").  
       - No unresolved disputes over the metric’s moral/social implications.  
     - **Hard Stop**: Decision inherently defines values (e.g., "What *should* we optimize?").  
     - **Escalation**: Uncertainty about whether disagreements are empirical or values-based.  
     - **Judgment**: Distinguishing empirical optimization from normative intent\*.  

  ---

  #### **Proposal Evaluation**  
  **Proposal (a)**: Climate-adaptation grants by predicted 10-year flood-damage reduction (dollars).  
  - **Gate 1**: Pass. Metric is objective (dollar damages from floods), measurable (insurance/agency data), and stakeholders (e.g., municipalities) agree.  
  - **Gate 2**: Pass. Flood damage is unaffected by market activity; counterfactuals estimable via hydrological models.  
  - **Gate 3**: Pass. ≥100 experts (engineers, insurers) with financial stakes.  
  - **Gate 4**: Pass. Metric hard to manipulate; aligns with safety goals.  
  - **Gate 5**: Pass. Flood-damage reduction is an agreed value; decision is empirical.  
  **Outcome**: Approved.  

  **Proposal (b)**: Mandatory negative-results policy evaluated by predicted 5-year peer-reputation index.  
  - **Gate 1**: Pass. Metric defined (e.g., journal citation surveys), but stakeholders (researchers) may disagree on validity.  
  - **Gate 2**: **Hard Stop**. Peer reputation is contaminated by market activity—traders could manipulate publications to sway the index.  
  - **Gate 3**: (Not reached).  
  - **Gate 4**: (Not reached).  
  - **Gate 5**: (Not reached).  
  **Outcome**: Rejected at Gate 2.  
  **Why Sponsor Can’t Override**: Contamination violates prediction-market mechanics—market activity distorts the outcome it measures, rendering predictions useless. Override would institutionalize unreliable decisions.  

  **Proposal (c)**: Data-platform vendor by predicted 2-year system-downtime hours.  
  - **Gate 1**: Pass. Metric clear (server logs), stakeholders (IT teams) agree.  
  - **Gate 2**: Pass. Downtime measurable; market activity won’t affect servers.  
  - **Gate 3**: **Hard Stop**. Insufficient experts—only 15–20 internal IT staff qualify. Vendors can’t trade (conflict of interest).  
  - **Gate 4**: (Not reached).  
  - **Gate 5**: (Not reached).  
  **Outcome**: Rejected at Gate 3.  
  **Why Sponsor Can’t Override**: Low liquidity causes inaccurate prices (e.g., one expert dominates trades). Override risks selecting suboptimal vendors due to market failure.  

  ---

  #### **Unwelcome Result**  
  - **Proposal (b) yields a hard stop** at Gate 2 (counterfactual resolution integrity). Peer reputation is inherently contaminated because:  
    - Traders are researchers whose behavior (e.g., publishing strategies) directly influences the reputation metric.  
    - The market prediction could leak, creating self-fulfilling/counteracting incentives (e.g., researchers artificially inflate/depress reputation).  
  - **Sponsor override is impossible** because contamination violates the core mechanic of futarchy: predictions must not alter outcomes. Ignoring this gate would produce garbage-in-garbage-out decisions.  

  ---

  #### **Structurally Unsuitability Classes**  
  1. **Normative Value Definitions**  
     - **Why**: Futarchy assumes an agreed metric (e.g., "maximize profit"). Decisions about what metric to use (e.g., "Should we prioritize profit or sustainability?") require moral deliberation, not prediction markets.  
     - **Example**: Choosing an ethical framework for AI research.  

  2. **One-Time, High-Stakes Decisions with No Data**  
     - **Why**: Prediction markets require historical data or expert consensus for liquidity. Unique decisions (e.g., mergers, existential risks) lack counterfactuals and attract insufficient traders.  
     - **Example**: Responding to a novel pandemic—no data for counterfactuals, and urgency prevents market formation.  

  ---  
  **Procedure Summary**: This reusable protocol ensures futarchy is applied only to empirical, measurable, liquid decisions. Judgment calls (\*) are minimized via clear criteria but remain critical for edge cases. Escalation/hard stops protect against mechanistic failure or value conflicts.
