  We are designing a decision procedure for evaluating proposals to replace committee decisions with futarchic mechanisms. The procedure must be executable in 45 minutes and include gates with precise questions, forms of answer, hard stop conditions, and conditions requiring escalation to a values committee.

  The gates should be grounded in the actual mechanics of prediction-market governance, including:
  1. Metric Agreement: Is the metric well-defined, measurable, and agreed upon?
  2. Counterfactual Resolution Integrity: Can the outcome be measured without contamination from the betting mechanism? (i.e., the act of betting should not influence the outcome being measured)
  3. Liquidity and Expertise Availability: Are there enough informed stakeholders to create a liquid market?
  4. Goodhart Corruption Risk: Is the metric robust against manipulation or perverse incentives?
  5. Distinction between selecting an action (empirical) and defining the value (normative): If the issue is about defining what to maximize, it's normative.

  Additionally, we note that judgment cannot be eliminated at certain points.

  Procedure: A Sequence of Gates

  Gate 1: Metric Definition and Agreement
     - Question: Is the metric for evaluating the outcome of each option clearly defined, measurable, and agreed upon by all stakeholders?
     - Form of Answer: A written specification of the metric, including how and when it will be measured, and evidence of stakeholder agreement (e.g., from a stakeholder meeting or survey).
     - Hard Stop: If the metric is not defined, not measurable, or there is significant stakeholder disagreement (e.g., >20% of key stakeholders object) that cannot be resolved.
     - Escalation: If there is fundamental disagreement on the metric that reflects a values conflict (e.g., whether to prioritize one outcome over another) rather than a technical dispute about measurability.
     - Judgment: Determining whether disagreement is about values (normative) or measurability (empirical) requires judgment.

  Gate 2: Counterfactual Resolution Integrity
     - Question: Can the outcome for the chosen option be measured without interference from the prediction market itself, and can we reliably estimate the outcome for the counterfactual paths (the options not taken) if required?
     - Form of Answer: A description of the measurement process and an analysis of potential contamination risks (e.g., if the market prediction becomes public and influences behavior). For counterfactuals, a plan for how they would be estimated (if needed) or a justification that counterfactual estimation is not required (e.g., because the market only needs to predict the outcome of the taken path and we are comparing predictions for each option independently).
     - Hard Stop: If the measurement is inherently contaminated by the market (e.g., the market prediction influences the outcome) or if counterfactual outcomes are necessary but cannot be reliably estimated (e.g., because the options are mutually exclusive and we cannot run parallel experiments).
     - Escalation: Not typically required at this gate, unless the contamination issue is deeply tied to a values conflict (e.g., if the contamination arises because stakeholders are gaming the system due to a lack of trust, which might be a cultural issue for the values committee).
     - Judgment: Assessing the risk and magnitude of contamination requires judgment.

  Gate 3: Liquidity and Expertise Availability
     - Question: Is there a sufficient pool of stakeholders with the necessary expertise and incentive to trade in the prediction market, ensuring liquidity and informed prices?
     - Form of Answer: An estimate of the number of potential traders, their expertise level, and their incentives to participate. Evidence can include past participation in similar markets or expert surveys.
     - Hard Stop: If the estimated number of informed traders is too low (e.g., less than 50) or if incentives are insufficient (e.g., no stake in the outcome, or too small a market to attract attention). 
     - Escalation: Not typically required. This is an empirical assessment.
     - Judgment: Estimating the number of informed traders and their incentives requires judgment.

  Gate 4: Goodhart Corruption Risk
     - Question: Is the metric robust against manipulation or perverse incentives? Specifically, could optimizing for this metric lead to significant unintended negative consequences?
     - Form of Answer: A risk assessment that identifies potential ways the metric could be gamed or lead to negative side effects, and mitigation strategies (if any).
     - Hard Stop: If the risk of manipulation or perverse outcomes is high and cannot be mitigated (e.g., by metric adjustments or monitoring).
     - Escalation: If the potential negative consequences involve a trade-off that reflects a values conflict (e.g., if improving the metric might harm another important value that stakeholders care about, and we need to decide which value is more important).
     - Judgment: Assessing the likelihood and severity of corruption requires judgment.

  Gate 5: Normative/Empirical Distinction
     - Question: Is the decision about selecting an action to maximize an agreed-upon value (empirical) or about defining the value to be maximized (normative)?
     - Form of Answer: A clear statement of the value being maximized and an argument that it is already agreed upon and the decision is purely about which action best achieves it.
     - Hard Stop: If the decision is primarily normative (i.e., about what value to maximize) and not empirical (which action best achieves a given value). In such cases, the futarchic mechanism is inappropriate because it requires an agreed metric.
     - Escalation: If the decision appears to be empirical but there is an underlying normative conflict (e.g., stakeholders agree on a metric but disagree about why it matters, or there are hidden values in dispute). This gate may also trigger escalation if the previous gates revealed unresolved values issues.
     - Judgment: Distinguishing normative from empirical issues requires judgment.

