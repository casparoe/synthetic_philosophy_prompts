     - Focusing on flood-damage reduction in dollars might lead to neglecting other aspects (e.g., environmental justice, ecosystem health). However, if the stakeholders have agreed on this metric, then the risk is acceptable. Also, the metric is hard to manipulate because flood damage is an objective event.
     - Answer: Pass. Risk is low.
     - Hard Stop? No.

  Gate 5: Normative/Empirical Distinction
     - The value (minimizing flood damage in dollars) is agreed upon. The decision is empirical: which grant achieves the most reduction?
     - Answer: Pass.

