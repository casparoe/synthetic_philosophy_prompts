     - We only need to measure the outcome for the chosen grant (the path taken). We don't need counterfactuals for the others because the market is predicting the outcome for each option independently, and we choose the one with the best prediction. However, we must be able to measure the actual flood-damage reduction for the chosen project without the market influencing the damage. The market prediction might become public and influence development (e.g., if people build more in areas protected by the project, potentially increasing damage if the project fails). But this risk is low because the market is about the long-term reduction and the actual damage is an objective measure.
     - Answer: Pass with caution. We assume the measurement can be done objectively (e.g., by insurance claims, government data). Contamination risk is low.
     - Hard Stop? No.
     - Escalation? No.

  Gate 3: Liquidity and Expertise
     - There are likely many experts in flood risk and infrastructure (e.g., engineers, climate scientists, urban planners) and stakeholders (e.g., insurance companies, local governments) with incentive to participate. Liquidity should be adequate.
     - Answer: Pass.
