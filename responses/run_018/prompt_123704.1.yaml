prompt: |-
  i'm the ethics compliance officer for our city health dept's behavorial unit. we get about three nudge proposals a month—default opt-ins, cafeteria layouts, reminder texts using social norms, auto-enrollment in wellness programs, stuff like that. i have maybe twenty minutes per proposal, i dont have a philosophy degree, my director signs off on my one-page memo, and if i approve something manipulative the council chews me out or we end up in court. i need a reusable decision proceedure i can run step by step: the questions in order, what counts as a sufficient answer at each step, where it stops with a hard no, where it hands the call to me because it's values not facts, and where it's guaranteed to misfire. ground it in actual philosophy of paternalism and autonomy—mill's harm principle, the soft vs hard paternalism distinction, the idea that nudges can bypass rational deliberation even when choice is technically preserved, and the idea that the person should be able to reverse the decision easily without penalty—but translate it so a non-philosopher can use it. the procedure must handle the hard cases: nudges that exploit biases people would want corrected upon reflection, domains where people lack stable preferences like mental health or long-term savings, and nudges that serve collective goods rather than the individual's own ends.

  apply it to three proposals:
  1. driver's license renewal form with organ donation default opt-in and a one-click opt-out.
  2. school cafeteria redesign putting water at eye level and soda behind a counter that requires asking staff.
  3. auto-enrolling all city employees in a mental-health screening check-in, with opt-out only available after watching a 5-minute video explaining benefits.

  make sure one answer is one i wont like—i'm generally pro-nudge but the procedure should be honest. include worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call. flag exactly what the procedure cant do, like predicting long-term preference change or resolving conflicts between collective health and individual privacy. no bibliographies or citations needed, i just need the tool.
reasoning: |-
  Okay, the user is an ethics compliance officer for a city health department's behavioral unit. They need a reusable decision procedure for evaluating nudge proposals. Let me break down their requirements.

  First, they get about three proposals a month, covering things like default opt-ins, cafeteria layouts, reminder texts, and auto-enrollments. They only have 20 minutes per proposal and no philosophy background. Their director signs off on their one-page memo, but there are consequences if something manipulative gets approved—like council backlash or lawsuits. So the procedure must be efficient and grounded in ethical principles but practical for a non-philosopher.

  The key philosophical concepts they mentioned include Mill's harm principle, soft vs. hard paternalism, nudges bypassing rational deliberation, and easy reversibility. I need to translate these into clear, step-by-step questions. The procedure must handle hard cases: exploiting biases, domains with unstable preferences (like mental health or savings), and collective goods versus individual ends.

  The user also wants three examples applied: organ donation opt-in, cafeteria redesign for water vs. soda, and mental health screening auto-enrollment. One should be a clear fail to ensure the procedure isn't biased pro-nudge. They need a clear pass, a clear fail, and a judgment call example.

  I should structure the procedure into steps that cover intent, reversibility, autonomy bypass, proportionality, and collective balance. Each step needs specific criteria for passing, failing, or requiring judgment. For instance, Step 1 checks if the nudge prevents harm or promotes critical welfare. Step 2 assesses reversibility—opt-out should be easy without penalties. Step 3 evaluates if rational deliberation is possible or if the nudge exploits biases. Step 4 looks at proportionality to the problem, especially in unstable preference domains. Step 5 balances individual vs. collective goods.

  For the examples:
  1. Organ donation opt-in: This should pass. It prevents harm (life-saving), has easy opt-out, doesn't exploit biases, and aligns with public goods without overriding individuals.
  2. Cafeteria redesign: Clear pass. Addresses health harm (sugar), easy access to soda (just ask staff), minimal effort for reversal, and promotes public health with low autonomy infringement.
  3. Mental health screening: This is the one they won't like. Mandatory video for opt-out adds friction, potentially exploits procrastination bias. Stuck at Step 3 or 4, requiring judgment on proportionality and reversibility.

  I need to highlight where the procedure has limits: predicting long-term preferences, resolving collective vs. individual conflicts, and cultural context. The officer must own those judgment calls. Also, ensure the tool flags clear fails (e.g., irreversible nudges) and steps needing human judgment.
answer: |-
  Here's a reusable 5-Step Nudge Ethics Procedure grounded in autonomy & paternalism principles, designed for rapid (<20 min) assessment. It uses clear questions, stop signs, and judgment flags.

  **Core Principles Embedded:**
  *   **Mill's Harm Principle:** Intervention only justified to prevent harm to others (or self, under strict conditions).
  *   **Soft Paternalism:** Nudges acceptable if they help people act on their *own* considered preferences, especially when impaired (information, bias, instability). Hard paternalism (overriding known preferences) is suspect.
  *   **Bypassing Rational Deliberation:** Does the nudge exploit irrationality *against* what people would choose reflectively?
  *   **Easy Reversibility (No Penalty):** Can people easily undo the nudge's effect without cost or hassle?
  *   **Preference Instability:** Special scrutiny for domains (health, savings) where people lack clear/stable preferences.

  ---

  **The 5-Step Nudge Ethics Procedure**

  **Step 1: Intent & Target**
  *   **Question:** Is the primary goal to (A) Prevent *significant harm* (physical, financial, serious health risk) OR (B) Promote *critical welfare* (health, savings) where preferences are often unstable/uninformed? OR (C) Something else (efficiency, aesthetics, collective good alone)?
  *   **Sufficient Answer:** A or B required to proceed. C is a **HARD STOP (Fail)**. Collective good alone is insufficient justification without A or B.
  *   **Judgment Flag:** Is the "harm" or "welfare" sufficiently significant and well-defined? (e.g., obesity vs. mild inconvenience).
  *   **Misfire Warning:** Overstating harm/welfare significance; mistaking convenience for harm.

  **Step 2: Reversibility Check**
  *   **Question:** Can the individual **easily** reverse the nudge's effect **without significant cost, delay, hassle, or social penalty**? Is opting out as simple as opting in?
  *   **Sufficient Answer:** Clear "Yes" required to proceed. "No" or "Unclear" is a **HARD STOP (Fail)**. (E.g., hidden opt-outs, complex forms, mandatory delays, social shaming).
  *   **Judgment Flag:** Is the ease of reversal *practically* achievable for the target population? (e.g., digital literacy barriers?).
  *   **Misfire Warning:** Assuming theoretical access equals practical ease; ignoring psychological barriers to opting out (e.g., inertia).

  **Step 3: Autonomy & Bypass Check**
  *   **Question:** Does the nudge **predominantly help people act on their *own* considered goals**, or does it **exploit a bias to push them towards an outcome *they would reject upon reflection***? Does it preserve transparent choice architecture?
  *   **Sufficient Answer:** Evidence suggests it helps overcome *barriers* (inertia, lack of info, predictable bias) to achieving commonly held goals. Proceed.
      *   **HARD STOP (Fail):** Evidence suggests it exploits bias *against* likely reflective preference (e.g., framing healthy food as scarce to trigger scarcity bias).
      *   **Judgment Flag:** Domain with unstable preferences (e.g., retirement savings, preventive health). Is the nudge steering towards a *plausible* reflective preference? (Requires values call - see Step 5). Does it feel deceptive or manipulative?
  *   **Misfire Warning:** Confusing "what people do" with "what they want upon reflection"; ignoring cultural/individual variation in values.

  **Step 4: Proportionality & Scope**
  *   **Question:** Is the nudge's **intrusiveness and targeting proportional** to the harm/welfare issue (Step 1)? Is it applied only to relevant contexts/decisions? Are less intrusive alternatives ineffective?
  *   **Sufficient Answer:** The nudge strength fits the problem severity and context (e.g., default enrollment for critical vaccinations = proportional; same for minor preferences = disproportional). Proceed.
      *   **HARD STOP (Fail):** Grossly disproportionate (e.g., exploiting deep fear for minor gain); applied to clearly value-laden choices with stable preferences (e.g., default political donations).
      *   **Judgment Flag:** Does the benefit clearly outweigh the autonomy cost? Are vulnerable populations disproportionately affected? Is this the *least* intrusive effective option? (Requires values call).
  *   **Misfire Warning:** Overestimating effectiveness; underestimating autonomy cost; ignoring distributional effects.

  **Step 5: Collective/Individual Balance (Final Gate)**
  *   **Question:** If the nudge primarily serves a **collective good** (e.g., herd immunity, organ supply, public cost reduction), is the **individual burden/autonomy infringement minimized** and justified by the significant public benefit *and* linkage to individual welfare/harm prevention (Step 1)?
  *   **Sufficient Answer:** Clear "Pass" from Steps 1-4. Proceed to **APPROVE**.
      *   **HARD STOP (Fail):** Collective good is the *only* justification (fails Step 1).
      *   **Judgment Flag:** Strong collective benefit *and* individual harm prevention/welfare, but significant autonomy cost. **REQUIRES YOUR VALUES CALL.** (This is where policy trade-offs live - e.g., mandatory reporting vs. privacy). Can you defend this to the council?
  *   **Misfire Warning:** The procedure **cannot resolve core value conflicts** (e.g., absolute autonomy vs. public health imperative). It flags them for *your* judgment.

  ---

  **Procedure Limitations (Know Before Using):**
  1.  **Cannot predict long-term preference changes:** Assesses based on *current* evidence of reflective preferences.
  2.  **Cannot resolve fundamental value conflicts:** Flags them for human judgment (Step 5).
  3.  **Sensitive to implementation:** A "Pass" can become a "Fail" if reversibility is botched in practice.
  4.  **Cultural/Context Blindness:** You must assess if philosophical assumptions fit your community.
  5.  **Effectiveness Unknown:** This is ethics, not efficacy. A useless nudge might pass; effective ones might fail.

  ---

  **Application to Proposals:**

  **Proposal 1: Driver's License Renewal - Organ Donation Default Opt-In (One-Click Opt-Out)**
  1.  **Intent & Target:** A (Prevent Harm - Deaths due to organ shortage). **Pass.**
  2.  **Reversibility:** Easy one-click opt-out. **Pass.**
  3.  **Autonomy/Bypass:** Helps overcome inertia for a generally supported act (most approve donation in polls). Doesn't feel deceptive. Preferences can be unstable (not thinking about death). **Pass.**
  4.  **Proportionality:** Default matches scale of harm. Less intrusive than mandates. **Pass.**
  5.  **Collective/Individual:** Strong collective good *and* prevents individual harm (recipients). Minimal individual burden. **Pass. → APPROVE (Clear Pass)**

  **Proposal 2: Cafeteria Redesign - Water at Eye Level, Soda Behind Counter (Ask Staff)**
  1.  **Intent & Target:** B (Promote Critical Welfare - Reduce sugar intake, obesity. Preferences unstable/informed in eating habits). **Pass.**
  2.  **Reversibility:** Easy reversal - just ask staff. No penalty. **Pass.**
  3.  **Autonomy/Bypass:** Leverages choice architecture/friction. Helps overcome impulse/availability bias towards a healthier choice most would endorse reflectively. Not deceptive. **Pass.**
  4.  **Proportionality:** Minor inconvenience vs. significant health risk. Less intrusive than removing soda. **Pass.**
  5.  **Collective/Individual:** Public health benefit *and* individual health benefit (Step 1). Minimal infringement. **Pass. → APPROVE (Clear Pass)**

  **Proposal 3: Auto-Enroll Employees in Mental Health Screening - Opt-Out Only After Video**
  1.  **Intent & Target:** B (Promote Critical Welfare - Mental health. High preference instability/information gaps). **Pass.**
  2.  **Reversibility:** **HARD STOP (FAIL).** Opt-out requires watching a 5-min video. This is a significant hassle/barrier (delay, psychological cost of engaging). It *penalizes* opting out with time/effort. Reversibility is NOT easy without penalty. **→ REJECT (Clear Fail - Step 2)**
      *   **Why you won't like it:** The intent is good! But the friction undermines autonomy. *Fix Suggestion:* Auto-enroll with **one-click opt-out *plus* offering the video as optional info *near* the opt-out button** would likely pass Step 2.

  **The Judgment Call Zone (Hypothetical "Fixed" Version):** Imagine Proposal 3 had one-click opt-out *without* the mandatory video.
  *   Steps 1 & 2: Pass.
  *   **Step 3 (Autonomy/Bypass):** **Judgment Flag.** Mental health screening is highly personal. While many *might* benefit reflectively, stigma and diverse values exist. Does this nudge *help* overcome stigma/inertia, or *bypass* deeply held reservations? Strong arguments both ways. **YOUR CALL.**
  *   **Step 4 (Proportionality):** **Judgment Flag.** Is auto-enrollment proportional for a sensitive, potentially stigmatized health service? Could a prominent opt-*in* campaign be sufficient? **YOUR CALL.**
  *   **Step 5 (Collective/Individual):** Potential collective benefit (healthier workforce), but individual privacy/autonomy cost is higher than organ donation or soda placement. **YOUR CALL.** Could you defend this to the council if someone feels coerced? **→ Outcome Depends on YOUR Judgment (Flags at Steps 3, 4, 5).**

  This procedure gives you clear stops, forces explicit justification, highlights value conflicts for your ownership, and roots your memo in defensible ethical reasoning, even under time pressure.
