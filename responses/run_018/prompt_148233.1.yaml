answer: |-
  ### The Exposure Map: What's Actually at Stake
  Your core risk is collapsing the phenomenal/access distinction entirely: **if any empirically detectable phenomenal state exists without global broadcast, your identity thesis fails**. This stakes your entire position on the *impossibility* of non-functional, non-accessible phenomenality. If proven possible, your "consciousness = broadcast" equation becomes a contingent correlation at best. The stakes include rendering inexplicable: (1) why some broadcast states *feel* like anything, (2) why non-broadcast sensory processing (e.g., early vision) lacks phenomenality, and (3) how subjective richness maps to workspace dynamics. Failure risks reducing GWT to an access theory with no explanation for phenomenality itself.

  ---

  ### Decisive Defeaters
  **Rank: Fatal**  
  1. **Neural Signatures of Non-Accessible Qualia**: If multivariate neural decoding (e.g., fMRI/EEG) reliably identifies distinct, report-matched *phenomenal content* (e.g., specific shapes/colors) during masking or inattentional blindness *before* global broadcast signatures (e.g., late P3b, frontoparietal activation), and crucially, if this content exhibits properties of *integrated experience* (e.g., object-level binding) without triggering downstream access. Current decoding of "hidden" states (e.g., in V1/V2) typically shows fragmented features, not unified qualia.  
  2. **Consciousness Without Broadcast in Global Disorders**: Evidence of preserved rich phenomenality in patients with permanent, verified global workspace disruption (e.g., diffuse bilateral prefrontal/parietal lesions) but intact sensory cortices. Cases like profound akinetic mutism with reliable non-verbal indicators of experience (e.g., neuroimaging-matched emotional responses to unseen stimuli) would contradict workspace necessity.  
  3. **Direct Stimulation-Induced Qualia Bypassing Access**: If intracortical microstimulation of sensory areas (e.g., V4 for color) evokes reportable, context-integrated phenomenality *without* activating canonical global workspace networks, even in healthy subjects under conditions precluding top-down modulation (e.g., TMS-induced prefrontal disruption).  

  ---

  ### Merely Awkward Problems  
  **Rank: Theoretically Salvageable but Costly**  
  1. **Binocular Rivalry Without Report**: Rivalry fluctuations in perception without behavioral report (e.g., during distraction) still show neural correlates of perceptual dominance in visual cortex. Defenders argue this reflects *potential* for access, but if neural signatures of dominance persist without *any* broadcast markers (e.g., no frontal engagement), it strains "access=phenomenality."  
  2. **High-Capacity Phenomenal States**: Subliminal semantic priming with complex, unreportable stimuli (e.g., masked sentences influencing decisions) suggests rich processing. If subjects retrospectively describe "glimpses" of unreportable structure under time constraints (validated by neural decoding), it pressures pre-workspace buffering accounts.  
  3. **Animal/Infant Consciousness**: If non-verbal beings exhibit behavioral/neural signs of integrated phenomenality (e.g., surprise at impossible events, cross-modal matching) without homologous workspace circuitry. Requires assuming workspace implementation differs across species—a retreat from neural specificity.  

  ---

  ### What Defenders Concede  
  GWT proponents (e.g., Dehaene, Baars) acknowledge:  
  1. **Threshold Ambiguity**: Determining when a representation "enters" the workspace operationally is tricky. ERP components like P3b correlate with access but aren't infallible markers.  
  2. **Neural Overlap**: Sensory areas activated during broadcast may also sustain local recurrent processing that *could* support proto-phenomenality. Distinguishing "pre-access" buffering from local consciousness is underdetermined.  
  3. **Partial Report Limitations**: Partial-report superiority (e.g., Sperling) might index fragile, temporary access rather than pure phenomenal overflow. But defenders admit this hinges on disputable temporal boundaries of "broadcast."  

  ---

  ### Insulation/Unfalsifiability Check  
  **Status: Risky if unconstrained, but fixable**  
  Your retort—"that state wasn’t *truly* broadcast"—becomes unfalsifiable **if broadcast lacks independent criteria**. To avoid this:  
  - **Operationalize broadcast** via *objective markers*: e.g., sustained frontoparietal activation, widespread recurrent processing, or reportability under optimal attention.  
  - **Testability**: If a state exhibits these markers *and* has phenomenal properties (via report/decoding) but escapes access (e.g., inattentional blindness with full broadcast signatures), your thesis fails. Conversely, if non-broadcast states show validated phenomenality, it fails. Retreating to "it wasn’t broadcast" without falsifiable markers is a bug.  

  ---

  ### Settled vs. Genuinely Contested  
  **Settled**:  
  - Access and phenomenality are *dissociable concepts* (per empirical distinctions in masking, neglect, etc.).  
  - Global workspace architectures enable flexible information routing and reportability.  

  **Genuinely Contested Among Practitioners**:  
  1. **Is Broadcast *Sufficient* for Phenomenality?** Most GWT defenders say yes; opponents note "zombie" broadcast (e.g., in blindsight training) may lack it.  
  2. **Is Broadcast *Necessary* for Phenomenality?** Your strong view is contested even within GWT (e.g., some allow local recurrent loops as minimally conscious).  
  3. **Does Non-Reportable Processing Exhibit Phenomenal Structure?** Overflow proponents (Block) vs. access-only (Cohen, Dennett) remains live debate.  

  Definitive falsification requires isolating phenomenality independent of access—a methodological hurdle, but not in principle impossible.
