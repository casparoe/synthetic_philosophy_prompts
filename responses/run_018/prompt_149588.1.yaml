  The key is evidential hierarchy. Historians see material evidence as foundational because it's less prone to transmission errors. Fomenko treats texts as data for statistical analysis, ignoring context. This isn't just verbal; their standards of proof differ. Historians require falsifiability through physical evidence, while Fomenko's model isn't constrained by archaeology.

