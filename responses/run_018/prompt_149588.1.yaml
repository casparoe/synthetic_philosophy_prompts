answer: |-
  Your diagnosis is perceptive, but the disagreement runs deeper than verbal confusion or divergent questions. It's a **substantive clash over evidential hierarchy, standards of proof, and the ontological status of material culture**—rooted in incompatible epistemological frameworks. Here's a structured diagnosis:

  ### 1. **Core Substantive Disagreements**
     - **Evidential Hierarchy**: 
       - *Historians* prioritize **consilience**: Independent lines of evidence (stratigraphy, radiocarbon dating, paleography, coinage, cross-cultural synchronisms) must converge. A single anomaly (e.g., a questionable astronomical reference) doesn't override a coherent material narrative.
       - *Fomenko* prioritizes **statistical/astronomical "precision"**: He treats dynastic lists as mathematical datasets and ancient astronomical records as computable inputs. Material evidence is dismissed as "corrupted" if it conflicts with his models.
     - **Standards of Proof**:
       - *Historians* demand **falsifiability**: A theory must generate testable predictions (e.g., "If Roman chronology is compressed, then stratigraphic layers X and Y should merge"). Fomenko’s model *retroactively reinterprets* all counter-evidence as "medieval forgeries" or "scribal errors," rendering it unfalsifiable.
       - *Fomenko* demands **formal consistency**: If astronomical data or list correlations deviate from consensus chronology, the chronology *must* be wrong—regardless of material contradictions.
     - **Ontology of Evidence**:
       - *Historians* view material artifacts (e.g., stratified coins, pottery) as **direct traces of past events**. A coin minted under Emperor X *physically existed* in a layer dated to Y.
       - *Fomenko* treats material culture as **malleable interpretations**. Stratigraphy becomes "subjective," and artifacts are reassigned to fit statistical conclusions.

  ### 2. **Hidden Empirical/Formal Issues**
     - **Astronomy vs. Archaeology**: 
       - Fomenko re-dates Ptolemy’s *Almagest* using modern software, claiming its star catalog matches the medieval sky. *But*: 
         - Historians note Ptolemy explicitly states he used Hipparchus’s data (2nd century BCE), and errors align with ancient instruments.
         - **Resolution Requires**: Independent computational tests of whether the *Almagest* fits *only* medieval skies (peer-reviewed studies show it doesn’t).
     - **Statistical Independence Claim**:
       - Fomenko argues dynastic lists (e.g., Roman emperors, Egyptian pharaohs) show statistical parallels proving they’re duplicate records. *But*:
         - His methods ignore contextual differences (e.g., titles, events, cultural specifics).
         - **Resolution Requires**: Formal demonstration that his correlation algorithms don’t produce false positives when applied to *known* parallel dynasties (e.g., Byzantine vs. Holy Roman Empire).
     - **Stratigraphic Integrity**:
       - Fomenko claims stratigraphy is "unreliable" due to mixing or misdating. *But*:
         - Dendrochronology, radiocarbon dating, and volcanic tephra layers provide absolute anchors independent of texts.
         - **Resolution Requires**: A case where Fomenko’s chronology *predicts* a stratigraphic sequence contradicted by physical dating—and is empirically tested (e.g., re-excavating a "re-dated" site).

  ### 3. **Is This Incommensurability?**
     - **No**. Both sides address the *same question*: "What is the correct chronology of antiquity?" 
     - **But their methodologies are incommensurable in practice**:
       - Historians use **Bayesian consilience**: Evidence is weighted by independence and reliability (e.g., an archaeologically contextualized coin > an uncorroborated chronicle).
       - Fomenko uses **deductive numericism**: Chronology must bow to statistical/astronomical models; discordant evidence is *presumed* corrupt.

  ### 4. **Why Demarcation Isn’t Ill-Posed**
     Pseudohistory isn’t defined by being "wrong" but by **methodological malpractice**: 
     - **Immunization against counter-evidence** (Fomenko re-dates *all* contradicting sources).
     - **Selective rigor**: Demanding precision in astronomy while dismissing stratigraphy.
     - **Failure of peer review**: Mainstream rejection isn’t dogmatic; Fomenko’s work fails basic checks (e.g., ignoring Assyrian eclipse records that fix Egyptian chronology).

  ---

  ### Paths to Progress
  Your working group’s deadlock can be broken by focusing on **testable implications** and **methodological rules**:

  1. **Formalize a Demarcation Criterion**:  
     *Proposal*: A theory is pseudohistorical if it **systematically subordinates direct material evidence to theoretical models** *without* providing:  
     - A mechanism for how the counter-evidence was fabricated/contaminated, *and*  
     - A means to test that mechanism independently.  
     *Example*: Fomenko must explain *how* medieval scribes faked Egyptian pottery styles in stratified layers—and predict where such "forgeries" should appear.

  2. **Conduct a Crucial Experiment**:  
     - Task: Apply Fomenko’s statistical methods to a *controlled dataset* (e.g., medieval European chronicles with known dates).  
     - Outcome: If his correlations "compress" timelines that are independently verified, his method is invalid. Peer-reviewed studies (e.g., by Grzybowski et al.) already show this for dynastic lists.

  3. **Adjudicate Evidential Priority**:  
     - Rule: **Material evidence anchors interpretation**. Astronomical/textual data must be reconciled with stratigraphy/radiocarbon dating—not vice versa.  
     *Justification*: Material traces are less susceptible to transmission errors than texts. A coin in a volcanic-ash-dated layer is epistemically prior to a chronicle copied centuries later.

  4. **Expose the Explanatory Vacuum**:  
     - Fomenko’s model creates *more* anomalies than it solves:  
       - Why would medieval forgers invent "ancient" Rome *while* documenting actual medieval events?  
       - How do linguistic evolution, genetic evidence, or carbon-dated artifacts fit his timeline?  
     Forcing engagement with *these* questions reveals the theory’s non-viability.

  ---

  ### Conclusion
  **Progress requires shifting focus from "chronological accuracy" to the conditions under which evidence overrides models**. The demarcation is sound: legitimate history *seeks consilience*; pseudohistory *imposes coherence* by dismissing discordant evidence. To break the deadlock:  
  - **Formalize** the criterion of material priority.  
  - **Test** Fomenko’s methods on verifiable data.  
  - **Demand** explanations for counter-evidence beyond "fraud."  

  The impasse isn’t inevitable—it’s a failure to enforce shared standards of empirical accountability. Once Fomenko’s evasion of material constraints is made explicit, the demarcation becomes self-evident.
