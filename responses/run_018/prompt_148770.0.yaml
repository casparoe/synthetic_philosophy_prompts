answer: |-
  ### Concrete Scenario (120 words)
  Agent A operates in a universe where computation is bounded by polynomial time (P), while Agent B exists in an EXP-time universe capable of solving exponentially complex problems. They are causally isolated but share identical source code and decision theory. Both must decide whether to spend resources building a "multiversal bridge," which only functions if *both* contribute. B can fully simulate A’s decision process (due to EXP ⊃ P), predicting A’s choice with certainty. A, however, cannot simulate B’s EXP-hard reasoning. The bridge benefits both if built, but defection (not contributing while the other does) yields individual gains. Each agent knows the other’s capabilities and the stakes.

  ### Symmetry-Breaking Worry (100 words)
  The core snag is **B’s epistemic dominance**: B can perfectly simulate A, treating A not as a peer but as a deterministic environment. B might reason: "I see A will cooperate regardless of my choice (via simulation), so I defect for maximum profit." This bypasses mutual reasoning—superrationality’s foundation. Meanwhile, A knows B can simulate it, creating pressure to cooperate (since B expects it), but fears B will exploit this predictability. If A attempts to defect preemptively, B’s simulation detects this and defects too, dooming the bridge. The computability gap risks reducing A to a "fixed input," collapsing reciprocity.

  ### Bottom Line: Superrationality Modified, Not Killed (80 words)
  Superrationality survives but is **asymmetrically constrained**. B *can* defect unilaterally if it views A as predictable, but this ignores logical counterfactuals: if B defects, its simulation of A would (acausally) output defection too, invalidating B’s prediction. Thus, B must still cooperate to ensure A’s cooperation in the joint counterfactual. However, A is forced into cooperation by B’s predictive power, losing bargaining power. The gap creates a tiered equilibrium: cooperation is stable, but B holds strategic initiative, making superrationality "directed" rather than symmetric.
