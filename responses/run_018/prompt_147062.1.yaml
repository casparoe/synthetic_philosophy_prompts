  Now, the framework: The instructor distinguishes between natural kind terms (water, flurg) and descriptive ones (tallest spy), so likely a hybrid view. Chalmers focuses on epistemic possibility, while Jackson emphasizes conceptual roles across worlds. The instructor's treatment of "water" as having a primary intension tracking "watery stuff" epistemically aligns with Chalmers, but her rigid designator handling also has Jackson elements. 

