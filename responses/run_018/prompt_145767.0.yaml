answer: |-
  **Joint Statement: Phenomenal-Concept Strategist (PCS) and Direct-Realist Anti-Physicalist (DRAP) Adversarial Collaboration on Mary's Room**  

  ### 1. Agreed Claims  
  1.1. **Mary’s Setup**: We endorse Jackson’s original thought experiment. Mary is a neuroscientist omniscient about all physical facts concerning color vision (e.g., wavelengths, neural correlates) while confined to a black-and-white environment. Upon release, she gains her first chromatic experience (e.g., of red).  
  1.2. **Logical Form of the Knowledge Argument (KA)**:  
      - Premise 1: Before release, Mary knows all physical facts about color vision.  
      - Premise 2: After release, Mary learns a new fact (e.g., what it is like to see red).  
      - Conclusion: Therefore, not all facts are physical facts (i.e., physicalism is false).  
  1.3. **Standard Physicalist Reply Strategies**: We recognize the following as common physicalist rebuttals:  
      - The ability hypothesis (Mary gains abilities, not facts).  
      - Representationalism (phenomenal states reduce to representational content).  
      - The phenomenal concept strategy (PCS; Mary acquires new perspectival concepts for physical facts).  
      - Illusionist accounts (phenomenal properties are introspective misrepresentations).  
  1.4. **Resolution Criterion**: Any adequate solution must explain Mary’s epistemic transition—from pre-release ignorance to post-release knowledge—without circularly presupposing physicalism or dualism. The explanation must not treat "knowing what it is like" as a primitive epistemic kind absent independent justification.  

  ### 2. Disagreements Table  
  | Phenomenal-Concept Strategist (PCS) | Direct-Realist Anti-Physicalist (DRAP) |  
  |-------------------------------------|---------------------------------------|  
  | Upon release, Mary gains knowledge of a centered, indexical fact (e.g., "this is what red looks like *here*"), which is a mode of accessing a physical property. Her ignorance stems solely from lacking a first-personal, demonstrative concept for an objective physical state. | Upon release, Mary gains knowledge of a non-physical, intrinsic phenomenal property (e.g., the qualitative "redness" itself). Her ignorance confirms that physical facts are incomplete, as phenomenal properties are directly presented in experience and irreducible to physical-functional descriptions. |  
  | Physicalism accommodates Mary’s transition if phenomenal concepts are irreducibly perspectival but ontologically neutral: they reference physical states via a subjective mode of presentation, without requiring non-physical properties. | Physicalism cannot accommodate Mary’s transition, as irreducibly perspectival concepts presuppose direct acquaintance with non-physical properties. Acquiring such concepts entails epistemic access to facts beyond the physical. |  

  ### 3. Cruxes  
  **Crux 1: Neuro-Implant Scenario**  
  - *Scenario*: Pre-release Mary receives a neuro-implant that directly stimulates her visual cortex to produce veridical red phenomenology, without retinal input or environmental interaction. She reports, "I now know what it is like to see red."  
  - **PCS Prediction**: This strengthens physicalism. The implant delivers the same neural state Mary would have upon seeing red, allowing her to acquire the phenomenal concept for a physical property. It confirms that the epistemic gap arises from missing sensorimotor or indexical access, not ontology.  
  - **DRAP Prediction**: This weakens physicalism. The implant provides direct acquaintance with the phenomenal property itself, independent of physical causation. Mary’s gain remains inexplicable by prior physical knowledge, reinforcing KA’s conclusion.  
  - *Dispute Significance*: For PCS, the implant shows experience-gain is neural-state-dependent; for DRAP, it shows phenomenology is brute and non-derivative.  

  **Crux 2: Transparency of Phenomenal Concepts**  
  - *Issue*: Phenomenal concepts are "transparent" (i.e., their content is fully revealed in introspection). Can physicalism explain Mary’s pre-release ignorance without circularity?  
  - **PCS Prediction**: If phenomenal concepts reduce to demonstrative modes of presentation (e.g., "this [neural state] type"), the transition is explained: Mary lacked a token-demonstrative ability, not a fact. This resolves KA without circularity, as demonstratives are familiar epistemic tools.  
  - **DRAP Prediction**: Transparency forces circularity. Physicalists must assume the very subjective ontology they deny to explain ignorance, as demonstrative modes presuppose acquaintance with non-physical properties. Reduction fails; KA stands.  
  - *Dispute Significance*: PCS holds this crux is decisive; DRAP contends it reveals physicalism’s explanatory bankruptcy.  

  ### 4. Assessment of Residual Disagreement  
  We concur that one core divergence is verbal: **whether "knowing what it is like" denotes a distinct epistemic kind (e.g., acquaintance-based knowledge) or a familiar mode of knowing an old fact (e.g., demonstrative reference)**.  
  - The DRAP holds it denotes a unique epistemic kind (acquaintance) that discloses non-physical properties.  
  - The PCS holds it denotes a standard mode (demonstrative concept) for physical facts, with no new ontology.  
  This verbal disagreement underlies our ontological stalemate. However, we disagree on whether it *exhausts* our differences: the PCS sees deeper issues as resolvable through conceptual refinement; the DRAP sees an irreconcilable metaphysical divide.  

  ---  
  *Signed,*  
  [PCS Signatory] - Phenomenal-Concept Strategist  
  [DRAP Signatory] - Direct-Realist Anti-Physicalist
