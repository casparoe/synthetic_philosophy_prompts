prompt: |-
  I am auditing a graduate seminar on scientific reasoning, and a disagreement between two students has stayed with me because it touches exactly on the boundary between formal confirmation theory and the psychology of model-building. They were debating whether old evidence can ever genuinely confirm a newly proposed scientific theory within a Bayesian framework, using a concrete hypothetical case. The case involves a 1998 ocean-current anomaly that had remained unexplained under standard climate circulation models; in 2023, a researcher proposes model C, which was explicitly developed to account for that 1998 pattern, yet derives the pattern from a general hydrodynamic principle rather than from an ad hoc parameter adjustment. The two students—let me call them Maya and Jonas—disagreed sharply about what Bayesians should say.

  Maya began by arguing that old evidence cannot confirm C, because once a theory is constructed with knowledge of E, the likelihood P(E|C) is essentially 1, and the competing prior theories also accommodate E with near-certainty by adding auxiliary hypotheses, so the Bayes factor is approximately 1; confirmation requires predictive novelty. Jonas replied that this ignores the distribution over competing theories: if C assigns a precise, structurally constrained range to the 1998 measurements that older models treat as outliers requiring separate auxiliary assumptions, then P(E|C) can still exceed P(E|~C), yielding a genuine Bayes factor in favor of C even though C was designed with E in mind. Maya countered that Jonas misses the gerrymandering penalty—the prior P(C) should be discounted precisely because its parameter space was shaped to capture E, and that without penalizing this post-hoc tuning, any failed theory can be revived by retrofitting. Jonas responded that this penalty applies only to ad hoc parameter adjustments, not to theories where E falls out of independently motivated principles; if C's derivation of the 1998 pattern uses no free parameters tuned to that data, its prior should not be deflated, and the old evidence genuinely supports it relative to bloated alternatives. Maya then pressed that in practice this distinction is untenable—every post-hoc theorist claims their adjustments are principled—and without an objective metric for independently motivated, Jonas's defense collapses into special pleading.

  Please adjudicate their exchange move by move. Rate each of the five steps—Maya's initial Bayes-factor claim, Jonas's response about precise structural constraints, Maya's gerrymandering-penalty objection, Jonas's ad-hoc-versus-principled distinction, and Maya's final skeptical challenge—on a scale from clearly mistaken to clearly right, with brief justification for each rating. Then say who is more right overall, and identify what both are missing—perhaps something about how partitioned priors or model-selection criteria interact with old-evidence reasoning—that would resolve or deepen their standoff.
reasoning: |-
  Hmm, the user presents an intricate debate between two students about Bayesian confirmation and old evidence. This is a classic problem in philosophy of science - the "problem of old evidence" that Glymour famously articulated. The hypothetical about the ocean-current anomaly makes it concrete though.

  Maya starts with a standard Bayesian objection: if a theory is built knowing evidence E, P(E|C)=1 so it can't confirm. But Jonas makes a subtle point about model comparison - it's not about absolute likelihood but relative to alternatives. His structural constraints argument has merit; think of how Einstein's explanation of Mercury's perihelion was retroactive but compelling because it flowed from general principles without ad hoc elements.

  Ah, but Maya's gerrymandering penalty raises a real issue. Bayesian model comparison does penalize complex models through the prior, but only if we formalize what "complexity" means. Jonas tries to rescue it with the principled-vs-ad-hoc distinction... this is clever but Maya's right that in practice it's fuzzy. Every scientist thinks their adjustment is principled!

  Both miss how Bayesian model selection handles this. Things like BIC or marginal likelihoods automatically penalize flexibility. For the ocean model, if C derives the 1998 pattern from fundamental equations with fewer free parameters than rivals, the math would show higher posterior probability even for old evidence. The key is whether the model would have predicted E had it existed before E was known - but that's tricky with constructed models.

  Ultimately Jonas is more correct in spirit because some retroactive explanations are scientifically valid (like Neptune explaining Uranus's orbit post-discovery), but Maya identifies real pitfalls. The resolution lies in explicit model comparison frameworks where "independently motivated" translates to testable predictions beyond the original anomaly.
answer: |-
  Here's a move-by-move adjudication of Maya and Jonas's debate, with ratings and justifications, followed by an overall assessment and identification of missing elements:

  **Maya's Initial Bayes-Factor Claim (Old Evidence Cannot Confirm)**  
  **Rating:** *Misguided but partially insightful*  
  **Justification:** Maya correctly notes that if P(E|C) = 1 and P(E|~C) ≈ 1 (due to auxiliary hypotheses), the Bayes factor approaches 1, negating confirmation. However, she overlooks two key points:  
  1) P(E|~C) often relies on *untested, low-probability auxiliaries* (e.g., "instrument error" or "unknown perturbation"), making P(E|~C) << 1 in practice.  
  2) For theories like C, P(E|C) isn't always exactly 1—it depends on C's *specificity*. If C predicts E with high precision (e.g., "anomaly = 5.2σ"), P(E|C) could be moderate if E was initially improbable.  

  **Jonas's Response (Precision & Structural Constraints)**  
  **Rating:** *Clearly right in principle*  
  **Justification:** Jonas correctly identifies that confirmation hinges on *relative likelihoods* and *model complexity*. If C explains E through fundamental principles *without ad hoc parameters* and predicts E's *exact form* (e.g., magnitude/duration of anomaly), while rivals require tacked-on auxiliaries (e.g., "random eddy +0.7°C"), P(E|C) >> P(E|~C) is plausible. Bayesian confirmation depends on how *surprising* E is under competing models, not just novelty.  

  **Maya's Gerrymandering-Penalty Objection**  
  **Rating:** *Partially right but misapplied*  
  **Justification:** Maya is correct that theories built *solely* to fit E deserve prior penalization (e.g., adding a "1998-anomaly parameter"). However, she conflates *model construction motives* with *mathematical structure*. If C's parameters are *not* fine-tuned to E (e.g., derived from first principles with no E-specific degrees of freedom), penalizing P(C) is unjustified. The penalty applies to *flexibility*, not historical inspiration.  

  **Jonas's Ad-Hoc-vs-Principled Distinction**  
  **Rating:** *Clearly right in theory*  
  **Justification:** Jonas validly distinguishes:  
  - **Ad hoc:** Adding free parameters (e.g., "fudge factor κ=0.4 for 1998 data") → low P(C) due to high flexibility.  
  - **Principled:** Deriving E from core laws (e.g., solving Navier-Stokes with boundary conditions) → no extra flexibility penalty.  
  Bayesian model comparison (e.g., BIC, marginal likelihoods) *formally* penalizes excess parameters, making this distinction operational.  

  **Maya's Skeptical Challenge (No Objective Metric)**  
  **Rating:** *Misguided pragmatism*  
  **Justification:** While scientists *do* often disguise ad hoc moves as "principled," this is an epistemological, not Bayesian, problem. Formal tools *exist* to quantify "independent motivation":  
  - **Marginal likelihood integration:** Penalizes models with large parameter spaces.  
  - **Predictive accuracy tests:** If C predicts *new* phenomena (e.g., 2024 anomalies) better than rivals, its "principled" status gains credibility.  
  Maya conflates practical abuse with theoretical impossibility.  

  **Overall Verdict: Jonas is more right.**  
  His arguments align with Bayesian practice: old evidence *can* confirm if the new model explains it with greater *precision*, *simplicity*, or *structural necessity* than alternatives. Maya correctly warns about gerrymandering but wrongly dismisses principled retroactive explanation.  

  **What Both Miss: Integrated Model Selection & Predictive Scope**  
  1. **Partitioned Priors for Auxiliaries:** Neither considers explicitly modeling rivals' auxiliaries (e.g., P(E|~C) = ∫ P(E|~C,A) P(A|~C) dA). If auxiliaries A have low P(A|~C) (e.g., "unobserved cyclone"), P(E|~C) could be small.  
  2. **Model Complexity Metrics:** They omit tools like:  
     - **Bayes Factors:** Compare C to rivals *with auxiliaries included*, penalizing complexity.  
     - **Cross-Validation:** Test if C's explanation of E *overfits* by checking predictive performance on withheld data.  
  3. **Unexplored Predictive Scope:** True "principled" theories imply *new* testable consequences (e.g., C predicts anomalies under specific CO₂ conditions). If C only explains E, its prior *should* be low; if it enables novel predictions, confirmation is genuine.  

  **Resolution:** The debate confuses *diachronic* (historical) and *synchronic* (mathematical) Bayesianism. When evaluating C *after its proposal*, the Bayes factor P(E|C)/P(E|~C) *can* favor C if:  
  - C’s likelihood P(E|C) is high due to inherent structure (not tuning),  
  - ~C’s likelihood P(E|~C) is low due to implausible auxiliaries,  
  - C’s prior P(C) is not excessively penalized if it lacks E-specific flexibility.  
  Old evidence *is* confirmatory when the new model reveals E as a *necessary consequence* of deeper principles, transcending mere accommodation.
