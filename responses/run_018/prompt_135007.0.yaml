answer: |-
  ## The Unwritten Law

  We chip the pot, the temple's fractured stone,
  And read belief in what their hands have wrought.
  What *meaning* is, the artifact has taught,
  But meaning's known by faith in minds long flown.
  This circle turns where proof and trust are one:
  A shard implies a purpose we assume,
  While purpose makes the shard escape the tomb
  Of random rock beneath indifferent sun.

  *No stone remains where power chose to hide,*
  No trace endures when ritual's breath is spent,
  When law decreed all records must be rent,
  When substance died to make the act abide.
  The void they cherished, discipline's keen gaze
  Finds nothing there to parse or phrase or praise.
  The purer the erasure they attained,
  The less the proof that they had ever reigned.

  ---

  **Notes on Execution:**

  1.  **Octave (ABBAABBA - Circular Logic):**
      *   Lines 1-4 establish the core circle: artifacts ("pot," "temple's fractured stone") are read for belief/meaning (Line 2), but recognizing them *as* meaningful artifacts requires assuming prior belief/purpose in their makers (Lines 3-4).
      *   Lines 5-8 explicitly name the "circle" (Line 5) and restate the mutual dependence of "proof" (artifact) and "trust/assumption" (belief/purpose) in the inference process (Lines 6-8). The enclosed rhyme scheme mirrors this closed loop of interpretation.

  2.  **Volta (Line 9 - Sharp Turn to Absence):**
      *   "No stone remains..." directly contradicts the tangible evidence of the octave, introducing institutions defined by deliberate non-materiality: "power chose to hide."
      *   This marks the precise turn to "negative materiality."

  3.  **Sestet (CDECDE - Breaking the Circle):**
      *   Lines 9-12 elaborate on the practices of absence: vanished ritual ("breath is spent"), intentional destruction ("records must be rent"), and the institutional power residing in ephemerality itself ("substance died to make the act abide").
      *   The CDECDE rhyme, while structured, avoids the tight enclosure of ABBAABBA. The 'E' sound ("spent," "rent," "abide," "gaze," "praise") creates a more open feel compared to the octave's tightly interlocking sounds, subtly breaking the earlier closure.

  4.  **Final Couplet (Unresolved Paradox):**
      *   Lines 13-14 state the core methodological tension: archaeology ("discipline's keen gaze") finds only "void" where these institutions operated ("nothing there to parse or phrase or praise").
      *   The concluding paradox is explicit: "The purer the erasure they attained, / The less the proof that they had ever reigned." Success in institutional design (total erasure) equals failure for archaeological recovery. There is no resolution offered.

  5.  **Balancing Act:**
      *   **Specialist Recognition:** Terms like "belief," "artifact," "meaning," "proof," "ritual," "records," "discipline," "void," and concepts of circular inference, intentional absence as power, and methodological failure clearly map onto the theoretical framework requested.
      *   **Poetic Primacy:** The language remains primarily poetic ("fractured stone," "indifferent sun," "ritual's breath," "void they cherished," "keen gaze," "parse or phrase or praise," "reigned"). The structure (sonnet form, volta, contrasting rhyme schemes) carries the conceptual weight and irony even for a non-specialist. The paradox in the couplet is stark and resonant on a poetic level.
