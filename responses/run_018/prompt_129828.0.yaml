  - if consciousness gets fully explained, does that eliminate it (hard greedy), preserve it but show its just computation we mislabel (soft greedy), or keep it intact but derived?
  - heres a split my prof mentioned but im not sure its real: mechanistic explanation (part-by-part) vs ecological explanation (system-level interaction with environment). include it as a branch if it actually separates positions.

  the leaves should include hard greedy eliminativism, soft greedy, non-greedy mechanistic crane, ecological crane, emergentist skyhook, dualist skyhook, and at least one unnamed empty combo. flag pairs the tree cant separate and briefly say why some slots are empty - like can you be ecological and greedy? probably incoherent but diagnose it.

  please dont ask for bibliographies or "read chapter 4" cause half our group doesnt have library access and were writing this for discord. keep it casual with maybe a typo or two since this is just for us.
