  hey so im in this philosophy of mind course and we just did dennetts cranes vs skyhooks thing plus that greedy reductionism idea. im trying to figure out where i actually stand on explaining consciousness but every quiz online just asks "are you a materialist?" which is totally useless.

  could u write me a decision tree / taxonomy for my study group? i want it built from the actual logical splits not just named philosophers. the branches should be concrete cases i can answer without knowing the label, like:
