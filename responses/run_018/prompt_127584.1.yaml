  The user also needs concrete evaluation criteria. Surveys with diverse experts, analysis of misinterpretations, and feedback on usability would provide data. A time-bound pilot ensures that the committee can make an informed decision later. This approach shows that the committee takes Neurath's ideas seriously but is cautious about practical and philosophical pitfalls.

