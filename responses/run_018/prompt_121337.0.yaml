  We are dealing with a phenomenon where an intervention initially considered an enhancement (for those functioning fine) gradually becomes perceived as a restoration (to normal) because the population norm shifts due to widespread adoption of the intervention.

  Key features:
  - The intervention starts as an enhancement for those without a defect.
  - As more people adopt it, the statistical norm shifts.
  - Not having the intervention then appears as a defect, and the same intervention is then requested as a restoration.

  Asymmetry: The direction is always from enhancement to restoration? Why? Because once the norm shifts, the absence becomes a deficit. The reverse (restoration turning into enhancement) would require the norm to shift in the opposite direction, which is less likely because medical interventions tend to improve function and become more common. Also, if an intervention becomes less common, the norm doesn't necessarily shift back because the new level of function becomes the expectation.

  Baselines: The phenomenon is tied to statistical norms (population-based). What about alternative baselines?
    - "Restore the level this particular person would have had if nothing had gone wrong": This is a counterfactual baseline. The phenomenon might not directly affect this because it's individualized. However, if the intervention becomes widespread, it might change the environment (e.g., in education, if most students use stimulants, then the "normal" environment for that individual might have included the intervention, thus changing the counterfactual? But that's a stretch). 
    - "Restore what the function is for": This is a functional (or species-typical) baseline. The phenomenon might not affect this because it's not statistical. However, if the function of a trait changes due to societal shifts (e.g., attention in a high-demand information society), then what is considered functional might change. But that's a different mechanism.

  Nearby concepts to distinguish:
  1. Medicalization: The process by which non-medical problems become defined and treated as medical issues. This phenomenon is a specific type of medicalization that occurs via shifting norms due to technological adoption.
  2. Reference group problem: The issue of which population to compare an individual to. This phenomenon involves a dynamic where the reference group changes because of the intervention.
  3. Goodhart's law: "When a measure becomes a target, it ceases to be a good measure." Here, the measure (the statistical norm) becomes a target (via interventions) and then becomes invalid because it shifts. But in our case, the measure is being used to define "normal" for medical necessity, and the interventions are altering the measure.
  4. Reflexivity (or reactivity): The idea that the act of observing or classifying can change the thing being observed. This phenomenon is a form of reflexivity because the act of providing an intervention (and classifying it as enhancement) changes the baseline that is used for classification.

  What is the core? 
  - A statistical norm is used to define health vs. enhancement.
  - The intervention, initially an enhancement, changes the statistical distribution of the trait.
  - The norm then shifts, so that the absence of the intervention is now below the norm and thus classified as a defect.

  This is a form of "normative feedback loop" or "therapeutic ratchet".

  But let's look for established terms:

  In bioethics, this is sometimes called the "medicalization of normality" or "disease mongering", but those are broader.

  There is a concept called the "technological treadmill" in agriculture: as technology improves, the average yield increases, and farmers must adopt the new technology to remain competitive. Similarly, in medicine, as interventions become available, the norm shifts and individuals must adopt to avoid being classified as having a defect.

  In sociology, this might be related to the "social construction of disability": what is considered a disability depends on the social and technological context.

