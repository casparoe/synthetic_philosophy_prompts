answer: |-
  The phenomenon you describe involves a dynamic process where an intervention initially intended as an enhancement (improving function beyond typical levels) shifts the statistical norm of a population through widespread adoption. This shifts perceptions such that the absence of the intervention is reinterpreted as a deficit, leading to its reclassification as a restorative treatment. The asymmetry (unidirectional from enhancement to restoration) stems from the ratcheting effect of technological adoption: once a norm shifts upward, it rarely reverts because interventions become embedded in societal expectations and environments, creating a new functional baseline. This primarily affects statistical baselines (e.g., population averages), as they are directly altered by intervention uptake. Alternative baselines, like individualized counterfactuals ("restore what this person would have had") or functional definitions ("restore the trait's purpose"), are less susceptible but not immune; environmental changes from widespread intervention use can indirectly alter functional expectations (e.g., cognitive demands in education rising due to stimulant use).

  **Key distinctions from nearby concepts:**
  - **Medicalization**: Broader; encompasses any non-medical issue becoming medical, but the feedback loop here specifically involves norm shifts from intervention adoption.
  - **Reference group problem**: Focuses on selecting a comparison population; this phenomenon shows how the selected group's norms dynamically change due to interventions.
  - **Goodhart's law**: Measures becoming targets and losing validity; here, the norm itself shifts because it is targeted, affecting classification.
  - **Reflexivity/reactivity**: Classification changing the classified; this is a specific case where intervention adoption alters the baseline used for classification.

  **Edges of the phenomenon**:
  - Requires: (1) an intervenable trait with a statistical distribution, (2) adoption driven by non-therapeutic motives, (3) measurable shift in population norms, and (4) reclassification of the intervention from enhancement to therapy.
  - Excludes: Shifts from non-intervention causes (e.g., dietary changes), non-statistical baselines without environmental feedback, or reversible norm changes.

  **Coined term**: **Therapeutic Normative Feedback Loop (TNFL)**  
  Defined as: *A self-reinforcing cycle wherein widespread adoption of an intervention for enhancement purposes shifts statistical population norms, leading to the reclassification of that intervention as restorative due to the new perception of its absence as a deficit.*

  **Why this term?**  
  It captures the core feedback mechanism and distinguishes from related concepts. To test if a new case fits TNFL:  
  1. Did the intervention start as an enhancement for non-impaired individuals?  
  2. Did adoption alter the population's statistical distribution for the trait?  
  3. Was the intervention later reclassified as restorative due to the new norm?  
  4. Is the shift asymmetric (enhancement → restoration)?  
  If all apply, it is TNFL.

  \answer{Therapeutic Normative Feedback Loop}
