  After a search in my knowledge base, I think the closest established concept is **"the medicalization of normal variation"** but that doesn't capture the feedback loop.

  A term that has been used in bioethics is **"the enhancement ratchet"** (e.g., by Eric Juengst). This term captures the idea that enhancements become the new normal and then create pressure to enhance further.

  But in our case, it's not just about pressure to enhance, but the reclassification of the same intervention from enhancement to therapy.

