  First, I need to unpack their core idea. The user is pointing out a temporal shift in how votes are interpreted. Initially, a defensive vote is about preventing a worse outcome, but post-election, the winner claims it as support for their entire agenda. This isn't just about the voter expressing something they didn't intend; it's about the institutional reframing of the vote's meaning. That seems distinct from the usual discussions.

  Looking at existing theories: Expressive voting focuses on the voter's intent—voting to express preferences. Duty-based is about obligations, like harm reduction. The lesser-evil problem is a conflict where voting for a bad option prevents a worse one. Mandate contamination introduces a new layer: the manipulation of the vote's interpretation by the winner. This affects both the voter's moral calculus and democratic legitimacy.

