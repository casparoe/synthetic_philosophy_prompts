answer: |-
  ### Decision Procedure for Climate Fund Proposals

  **Purpose**: To evaluate cooperative agreements under the board’s evidential cooperation principle, where a commitment in one region provides statistical evidence for analogous regions. The procedure assumes regions in a "domain cluster" face analogous decision problems but do not communicate. It is designed for efficiency (≤20 minutes per proposal) and does not require formal decision theory.

  **Limitations of the Procedure**:
  1. **Cannot objectively set evidential weight thresholds**: It does not mathematically determine when evidential benefits (from others’ cooperation) outweigh local costs. This requires board-defined risk tolerance.
  2. **Cannot verify agent analogy without calibration**: It relies on pre-agreed structural metrics to define "similarity" but cannot distinguish true analogs from coincidental similarities without historical data.

  ---

  ### Procedure: Ordered Sequence of Questions and Tests
  *(Execute steps in order; stop at any "STOP" condition.)*

  1. **Question**: Is the proposal a **binding cooperative agreement** (not unilateral or non-binding)?  
     - **Sufficient answer**: Yes (explicit multilateral commitment with enforcement).  
     - **STOP—against cooperation**: No (e.g., unilateral action).  
     - **Handoff to board**: Never at this step.  
     *Rationale: Evidential links require mutual commitment to influence analogous agents.*

  2. **Question**: Does the region have **≥3 statistically close analogs** in the cluster?  
     - **Sufficient answer**: Yes (based on pre-defined structural metrics, e.g., GDP/capita ±15%, emissions intensity ±20%, governance capacity score ±10%). Use cluster-wide averages for comparison.  
     - **STOP—against cooperation**: No (fewer than 3 close analogs).  
     - **Handoff to board**: Never.  
     *Rationale: Evidential links collapse without minimal symmetry among regions.*

  3. **Symmetry-Break Check**: Is the region’s **local context within 2 standard deviations** of the cluster mean for all critical structural variables?  
     - **Critical variables**: Pre-agreed metrics (e.g., economic diversification, resource dependence, climate vulnerability).  
     - **Sufficient answer**: Yes (no variable >2 SDs from mean).  
     - **STOP—against cooperation**: Any variable >2 SDs from mean (e.g., unique economic structure).  
     - **Handoff to board**: Never.  
     *Rationale: Extreme outliers break evidential symmetry; local action cannot reliably signal to the cluster.*

  4. **Question**: Are the **local net costs** (without evidential benefits) **≤10% of regional GDP**?  
     - **Calculate**: Projected costs (economic, social) minus local benefits (e.g., co-benefits like air quality improvements).  
     - **Sufficient answer**: Yes (costs are non-catastrophic).  
     - **STOP—against cooperation**: Costs >10% of GDP.  
     - **Handoff to board**: Costs are catastrophic (e.g., mass unemployment, fiscal collapse) even if ≤10% of GDP.  
     *Rationale: High costs demand value-based trade-offs between local and global welfare.*

  5. **Question**: Is the **evidential benefit-to-cost ratio ≥1**?  
     - **Calculate**:  
       - *Evidential benefit* = (Probability of cluster-wide cooperation if this region commits) × (Total global benefit from full cluster cooperation).  
       - *Probability estimate*: Default to `1 / (cluster size)` if no empirical data.  
       - *Ratio* = Evidential benefit / Local net costs.  
     - **Sufficient answer**: Yes (ratio ≥1).  
     - **STOP—against cooperation**: Ratio <1.  
     - **Handoff to board**: If global harm is existential (e.g., >1°C warming avoided) but ratio is <1.  
     *Rationale: Cooperation is irrational if local costs exceed expected global benefits.*

  6. **Final Handoff Check**: Does the proposal require **trade-offs between catastrophic local costs and global existential risk**?  
     - **Sufficient answer**: No (all prior tests passed).  
     - **STOP—recommend cooperation**: Yes to all prior steps.  
     - **Handoff to board**: If any value-laden conflict exists (e.g., local ruin vs. planetary-scale prevention).  
     *Rationale: Balancing extreme local vs. global consequences is inherently ethical, not evidential.*

  ---

  ### Application to Proposals

  **Proposal A: Binding carbon-cap agreement in a cluster of >100 similar industrial regions**  
  1. **Step 1**: Yes (binding cooperation). Proceed.  
  2. **Step 2**: Yes (>100 analogs). Proceed.  
  3. **Symmetry-Break**: Within 2 SDs (all regions industrial, similar structure). Proceed.  
  4. **Step 4**: Costs ≤10% GDP (typical for caps). Proceed.  
  5. **Step 5**: Ratio ≥1 (large cluster size implies high probability of cooperation; global benefits massive). Proceed.  
  6. **Step 6**: No catastrophic trade-offs. **Recommend cooperation**.  
  *Outcome: Board accepts—strong evidential case.*

  **Proposal B: Unilateral green-tech subsidy in a region with no close analogs**  
  1. **Step 1**: No (unilateral, not cooperative). **STOP—against cooperation**.  
  *Outcome: Board may find this unwelcome (favors "leadership" actions), but procedure blocks it for lacking binding cooperation and symmetry. Evidential link inapplicable.*

  **Proposal C: Cooperative pact preventing severe global harm with catastrophic local costs; labor markets differ markedly**  
  1. **Step 1**: Yes (cooperative pact). Proceed.  
  2. **Step 2**: Yes (assume ≥3 analogs exist). Proceed.  
  3. **Symmetry-Break**: Labor markets >2 SDs from cluster mean (given). **STOP—against cooperation**.  
  *Outcome: Board will find this unwelcome. They want to prevent severe global harm, but symmetry is broken. Procedure rejects it as "non-analogous," collapsing the evidential link. No handoff occurs.*

  ---

  ### Verdict: The procedure necessarily collapses into a non-evidential value judgment when catastrophic local costs must be weighed against global existential risks, as this transcends statistical evidence and requires ethical prioritization.
