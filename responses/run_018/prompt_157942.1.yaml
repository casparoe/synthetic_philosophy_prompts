  2. **Question: Does the region have at least one close analog in the cluster? (Check for structural similarity)**
     - How: Compare the region's key structural features (e.g., economic structure, emissions profile, governance capacity, population, etc.) with the cluster average and with other regions. Use a pre-defined similarity metric (e.g., Mahalanobis distance) and a threshold set by prior calibration (if available) or by expert judgment in the absence of calibration.
     - If no (the region is an outlier without close analogs): Stop and recommend against cooperation (because the evidential link collapses due to lack of symmetry). This is the symmetry-break check.
     - If yes: Proceed to step 3.

  3. **Question: Are the local net costs of the proposal (without considering the evidential effect) positive?**
     - Calculate the net local costs (including all tangible and intangible costs minus benefits) as perceived by the region, without including the potential benefits from other regions' actions (which are the point of the evidential link).
     - If the net costs are negative (i.e., the proposal is locally beneficial): Stop and recommend cooperation (because even without the evidential effect, it's a good deal). Note: We don't need the evidential argument in this case.
     - If the net costs are positive (i.e., the proposal is locally costly): Proceed to step 4.

  4. **Question: Does the proposal have a significant evidential impact?**
     - How: Estimate the expected reduction in global harm (or the expected benefit from other regions' actions) due to the evidential effect of this region's cooperation. This requires:
          a. Estimating the probability that this region's cooperation will lead to cooperation in other regions (via the evidential link). This can be done by looking at the cluster size and the similarity of the regions. For example, if the cluster is large and the regions are very similar, the evidential impact might be high.
          b. Multiplying that probability by the total expected benefit from the cooperation of the other regions (which is the benefit per region multiplied by the number of regions that are expected to cooperate because of the evidence).
          c. Then, compare the expected global benefit (from step 4b) to the local net cost (from step 3). The evidential impact is significant if the expected global benefit is at least as large as the local net cost.
     - If the evidential impact is significant: Proceed to step 5.
     - If not: Stop and recommend against cooperation (because the local costs are not justified by the expected global benefits).

  5. **Question: Is there a catastrophic local risk?**
     - Check if the proposal imposes a risk of catastrophic local harm (e.g., economic collapse, severe social unrest, etc.) that is above a threshold of acceptability set by the board. This threshold is a value judgment and should be pre-defined (e.g., any risk above 5% of causing a catastrophic outcome, or any outcome that is catastrophic in magnitude regardless of probability).
     - If yes: Stop and hand off to the board (because the catastrophic risk involves a value judgment about acceptable levels of risk and the trade-off between local and global harm).
     - If no: Proceed to step 6.

  6. **Question: Is the local cost (without the evidential effect) catastrophic?**
     - Check if the local net cost (from step 3) is so high that it would be catastrophic for the region (e.g., leading to irreversible economic damage, severe poverty increase, etc.). This should be defined by a pre-set threshold (e.g., a certain percentage of GDP, or a qualitative assessment of severity).
     - If yes: Stop and hand off to the board (because the board must decide if the global benefits are worth the local catastrophe).
     - If no: Stop and recommend cooperation (because the evidential impact is significant, and the local costs are not catastrophic and are outweighed by the expected global benefits).

  What the procedure cannot do:
  - It cannot mathematically or objectively identify the threshold at which the evidential weight becomes strong enough to override local cost. This threshold is inherently subjective and depends on the decision-maker's risk aversion and values.
  - It cannot perfectly distinguish genuinely analogous agents from merely similar-looking ones without prior empirical calibration. The similarity metric is a proxy and requires calibration with historical data on how regions have behaved in analogous situations.

