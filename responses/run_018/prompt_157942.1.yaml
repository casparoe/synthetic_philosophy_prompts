  We are designing a decision procedure for the inter-jurisdictional climate fund. The procedure is based on the principle of evidential cooperation: a commitment in one region provides statistical evidence for what analogous agents will do in others, provided symmetry holds.

  The procedure is structured as a flowchart in words, with steps that include questions, tests, and conditions for stopping (either against cooperation or for a handoff to the board). We also include a symmetry-break check.

  Procedure:

  1. **Question: Is the proposal a cooperative agreement?**
     - If no: Stop and recommend against cooperation (because the evidential principle only applies to cooperative actions that are intended to influence others by evidence).
