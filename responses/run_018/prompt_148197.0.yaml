  Their core tension appears to be between structural and emergent properties. In the clear cases (evolution, termite mounds), function emerges from mindless components. But with the chess grandmaster, they sense an underlying unity of mind that resists reduction. The medical resident case highlights another layer - the delegation of comprehension. 

