answer: |-
  **Exam Prompt: PHIL/LING 705 - Advanced Topics in Mind & Language**  
  **Time Allowed:** 90 minutes  
  **Marks:** 25  

  **Question:**  
  The predictive processing framework (PPF) posits that cognition is fundamentally a hierarchical process of minimizing prediction error (i.e., the mismatch between top-down expectations and bottom-up sensory input). Proponents argue that grammatical structures—not just lexical labels—could actively reshape the *error landscapes* that guide perception, learning, and conceptual revision. Critically evaluate whether this PPF reframing rescues a **strong deterministic version of linguistic relativity** (i.e., grammar imposes inescapable constraints on thought) from classical objections:  
  1. **Translation/Objectivity**: If thought is determined by grammar, how can we accurately translate or share concepts across languages?  
  2. **Bilingual Cognition**: How do bilinguals reconcile conflicting grammatical structures?  
  3. **Universals**: Why do cross-linguistic conceptual regularities exist?  

  Defend a clear verdict: Does PPF successfully rehabilitate strong determinism, or does it merely reframe *weak* linguistic influences? Support your argument with concrete examples (e.g., grammatical gender, evidentials, tense/aspect systems).  

  ---

  **Model Answer (798 words):**  

  **(Verdict: PPF *partially* rescues determinism by redefining "constraint," but bilingualism and abstraction force a hybrid model.)**  

  The predictive processing framework (PPF) reframes cognition as hierarchical prediction-error minimization, where "thought" emerges from continuous Bayesian updates to generative models. Crucially, *precision-weighting*—the brain’s confidence in sensory input vs. prior expectations—determines whether prediction errors trigger perceptual revision or conceptual restructuring. Grammatical categories, under PPF, aren’t mere labels but *precision-modulating priors* that sculpt how prediction errors propagate through the cognitive hierarchy. For example, grammatical gender (e.g., Spanish *la mesa* [feminine "table"] vs. German *der Tisch* [masculine]) isn’t a passive tag but a high-precision prior that amplifies prediction errors for incongruent features (e.g., describing "table" as "sturdy" in Spanish may generate larger errors than in German, shaping associative memory). This redefines linguistic determinism: grammar doesn’t *prevent* certain thoughts but makes some conceptual updates *costlier* by altering error surfaces.  

  **Against Translation/Objectivity**: PPF counters the objectivity objection by treating translation as active inference. Strong determinism’s flaw is assuming concepts are *static* and grammar-bound. Under PPF, concepts are dynamic prediction landscapes. Translation succeeds not because concepts are universal, but because agents minimize cross-linguistic prediction errors through iterative model adjustment. When translating Hopi evidentials (which encode evidence type grammatically) into English, the translator samples sensory/contextual cues to approximate meaning, tolerating residual error. Grammatical differences *constrain* the efficiency and fidelity of translation—not its possibility—by forcing costly compensatory inferences. PPF thus rescues a *graded* determinism: grammar rigidifies certain priors, making some conceptual alignments error-prone, not impossible.  

  **Bilingualism as PPF’s Critical Test**: Bilingual cognition initially seems fatal to determinism. If L1 grammar constrains thought, how do bilinguals switch between systems? PPF resolves this by treating language-specific priors as *contextually gated*. Predictive models incorporate language mode as a hyperprior. A Spanish-German bilingual doesn’t maintain conflicting gender priors simultaneously; contextual cues (e.g., speaking Spanish) raise the precision of Spanish grammatical expectations, suppressing German-based predictions. ERP studies support this: bilinguals show N400 effects (neural markers of prediction error) only for violations in their *active* language. However, this gating mechanism undermines *strong* determinism: if priors are context-switchable, thought isn’t *inescapably* constrained by any single grammar. Instead, bilinguals develop meta-predictive flexibility—the ability to minimize error across systems. PPF thus reduces strong determinism to *contextual* determinism, modulated by language use.  

  **Universals and the Limits of Determinism**: PPF explains universals through shared environmental constraints and biological priors. All languages encode time, not because of innate "time concepts," but because agents must predict temporally structured events (e.g., action sequences). Grammatical tense/aspect systems (e.g., Mandarin’s lack of obligatory tense) don’t erase temporal cognition but alter *how* temporal errors are minimized. A Mandarin speaker predicts temporal relations through contextual/adverbial priors rather than verb inflection, making temporal errors less salient for verb forms but more reliant on discourse. This reveals PPF’s core contribution: it *relativizes* determinism to prediction dynamics. Grammar doesn’t create or destroy concepts; it reweights the precision of prediction errors that drive concept revision. Strong determinism fails because abstract reasoning (e.g., counterfactuals) can operate via amodal simulations that bypass language-specific priors.  

  **Conclusion**: PPF rescues a *reconfigured* determinism. Grammar deterministically shapes *how prediction errors are generated and minimized* in online cognition, making some inferences fluid (language-aligned) and others costly. But bilingual gating and abstraction demonstrate that no grammar irreversibly imprisons thought. PPF doesn’t revive strong Sapir-Whorf but forges a middle path: grammar as a *high-precision prior* that canalizes perceptual and habitual thought, while leaving conceptual revision possible through error-driven learning. Determinism holds only at the level of processing efficiency—not conceptual inaccessibility.  

  ---  

  **Marking Scheme (Casual Colleague Edition ☕):**  
  **Total: 25 marks**  
  *(A-range = 20–25 | B-range = 15–19 | C-range = 10–14 | D/F = <10)*  

  **A-Grade (20+)**  
  - ✅ **PPF Mechanics Explained**: Clearly describes hierarchical prediction-error minimization, precision-weighting, and priors (4 marks).  
  - ✅ **Grammar ≠ Lexicon**: Treats grammatical structures (e.g., tense, gender, evidentials) as distinct from vocabulary (3 marks).  
  - ✅ **Bilingualism Head-On**: Engages switching/gating mechanisms under PPF—no hand-waving! (4 marks).  
  - ✅ **Determinism Verdict**: Defends a nuanced stance (e.g., "contextual determinism," "graded constraints") (5 marks).  
  - ✅ **Examples**: Uses grammatical cases to illustrate error-surface reshaping (3 marks).  
  - ✅ **Universals/Translation**: Addresses via shared environments or prediction-driven alignment (3 marks).  
  - **Style**: Coherent, concise, no fluff (3 marks).  

  **B-Grade (15–19)**  
  - Explains PPF superficially (e.g., "predictions influence perception" sans precision/ hierarchy).  
  - Mentions bilingualism but omits gating/hyperpriors.  
  - Waffles on determinism ("it’s complicated") without a verdict.  
  - Confuses grammatical vs. lexical effects (e.g., uses "snow words" as key evidence).  
  - Weak examples (e.g., only color terms).  

  **C-Grade and Below**  
  - **PPF as "Feedback Loops"**: Mistake! PPF ≠ simple top-down modulation; it’s hierarchical Bayesian minimization. (-4 marks).  
  - **Vocabulary Focus**: Sapir-Whorf reduced to "words shape concepts" (-3 marks).  
  - **Ignores Key Objection(s)**: Skips bilingualism or universals (-4 marks).  
  - **Strong Determinism Strawman**: Claims PPF means "no thought without grammar" (-3 marks).  
  - **No Concrete Grammar Examples** (-3 marks).  

  **Classic Penalties (Deduct 1–3 marks each):**  
  - "Language *determines* thought" without defining "determines."  
  - Citing Lucy’s Yucatec time studies as *only* evidence.  
  - Misrepresenting universalism (e.g., "Chomsky says all grammar is the same").  
  - "Bilinguals have split brains" (ouch).  

  **Pro Tip for Grading:** Chase the **precision-weighting** discussion. If they grasp that grammar makes some prediction errors *louder* (high precision) and others *quieter* (low precision), they’ve done the work. If they just say "grammar changes predictions," it’s B-territory.  

  Let me know how the coffee I owe you factors into the curve! 😉
