answer: |-
  Here's a taxonomy of Madhyamaka positions on the tetralemma and emptiness, structured as a decision tree based on core philosophical commitments. It focuses on 6 distinct views, highlighting their approach to the fourth lemma ("neither exists nor doesn't exist") and their key tensions. **Bold labels** indicate named schools/interpretations.

  ```mermaid
  graph TD
  A[Start: Does conventional reality <br/>have logical validity?] --> |Yes| B[Can logical reasoning <br/>establish emptiness <br/>positively?]
  A --> |No| C[Is the negation of emptiness <br/>itself empty?]
  B --> |Yes| D[**Svātantrika-Madhyamaka** <br/>e.g., Bhāviveka, early Jñānagarbha <br/>• Fourth lemma = Invalid logical option <br/>• Awkward: Covert realism - conventional logic <br/>implies hidden foundations]
  B --> |No| E[**Semi-Prāsaṅgika** <br/>e.g., late Jñānagarbha, Śāntarakṣita <br/>• Fourth lemma = Meaningless <br/>• Awkward: Tension between Yogācāra-like <br/>conventional truth & radical emptiness]
  C --> |Yes| F[**Prāsaṅgika-Madhyamaka** <br/>e.g., Candrakīrti, Gelugpa <br/>• Fourth lemma = Rhetorical trap <br/>• Awkward: Quietism - risk of rejecting all <br/>philosophy as reification]
  C --> |No| G[**'Shentong'-Influenced** <br/>e.g., Dolpopa, Jonang <br/>• Fourth lemma = Points to <br/>non-dual ultimate reality <br/>• Awkward: Ontological leap - emptiness <br/>itself is truly established]
  F --> H[Is 'non-affirming negation' <br/>of emptiness the final truth?]
  H --> |Yes| I[**Gelug Prāsaṅgika** <br/>e.g., Tsongkhapa <br/>• Fourth lemma = Utterly absurd <br/>• Awkward: Paradox of asserting <br/>'no assertions' rigorously]
  H --> |No| J[**Sakya Prāsaṅgika** <br/>e.g., Gorampa <br/>• Fourth lemma = Exhausts concepts <br/>• Awkward: Near-mysticism - truth is <br/>beyond all logical structures]
  ```

  ### Key Questions Explained:
  1. **"Logical validity of conventional reality?"**  
     *Can everyday logic/reasoning reliably prove things?*  
     → **"Yes"** leads to Svātantrika (uses positive inference).  
     → **"No"** leads to Prāsaṅgika (only negates opponents' views).

  2. **"Negation of emptiness itself empty?"**  
     *Is the statement "emptiness is empty" a substantive truth?*  
     → **"Yes"** = Emptiness has no independent status (Prāsaṅgika).  
     → **"No"** = Emptiness is uniquely real (Shentong/Jonang).

  3. **"Final truth = non-affirming negation?"**  
     *Is the mere rejection of all positions the endpoint?*  
     → **"Yes"** = Gelug (avoids any positive description).  
     → **"No"** = Sakya (negation dismantles concepts to reveal non-conceptual truth).

  ### Taxonomy of Views & Their Awkward Commitments:
  1. **Svātantrika-Madhyamaka**  
     - **Concrete commitments**: Conventional logic is valid; emptiness can be proven via inference; fourth lemma is illogical.  
     - **Awkwardness**: Risk of "hidden ontology" – using conventional logic to establish emptiness may imply subtle foundationalism.  

  2. **Semi-Prāsaṅgika (Yogācāra-Svātantrika synthesis)**  
     - **Commitments**: Conventional truth is mind-only; ultimate truth is beyond logic; fourth lemma is incoherent.  
     - **Awkwardness**: Unstable fusion – conventional mind-only reality vs. radically empty ultimate.  

  3. **Gelug Prāsaṅgika**  
     - **Commitments**: *All* concepts reify; emptiness is empty; fourth lemma is absurd. Final truth = non-affirming negation (*prasajya-pratiṣedha*).  
     - **Awkwardness**: Extreme quietism – philosophy can only negate, risking disengagement from conventional ethics/wisdom.  

  4. **Sakya Prāsaṅgika**  
     - **Commitments**: Negation dismantles concepts to reveal non-dual wisdom; fourth lemma exhausts thought. Emptiness isn’t a "position".  
     - **Awkwardness**: Borderline mysticism – truth is ineffable, challenging philosophical discourse.  

  5. **Shentong-Mādhyamika (Jonangpa)**  
     - **Commitments**: Emptiness *is* the ultimate reality (not empty of itself); fourth lemma points to this ineffable truth.  
     - **Awkwardness**: Ontological absolutism – emptiness itself becomes a true existence, contra Nāgārjuna.  

  ### Where Positions Converge:
  - **Prāsaṅgika (Gelug & Sakya)**: Agree emptiness is empty and fourth lemma isn’t a positive claim. Split on *how* negation functions.  
  - **All except Jonang**: Emptiness is empty (*śūnyatā-śūnyatā*).  
  - **Svātantrika & Semi-Prāsaṅgika**: Conventional truth has provisional validity.  

  ### Practical Implications for the Tetralemma:
  - **Fourth lemma as dead-end**: Prāsaṅgika (rhetorical trap).  
  - **Fourth lemma as invalid**: Svātantrika (logical error).  
  - **Fourth lemma as signpost**: Jonang (pointing to ultimate reality).  

  This tree reveals the core fault line: **whether logic/concepts can touch ultimate truth** (Svātantrika: yes; Prāsaṅgika: no; Jonang: only via negation). Use it to test interpretations: if a view allows *any* positive description of emptiness, it’s not strict Prāsaṅgika.
