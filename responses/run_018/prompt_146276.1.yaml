  2) Self-negation of emptiness (is "emptiness is empty" a substantive claim?) → relates to fourth corner's interpretation. 
  3) Tetralemma's fourth option (positive assertion vs. dead end?) → ties to whether silence implies metaphysics. 

  The major splits are: 
  - Svātantrikas (like Bhāviveka): Accept conventional validity, allow positive logic → fourth corner becomes a "neither" assertion. 
  - Prāsaṅgika (Candrakīrti, Gelugpa): Reject conventional validity, negation-only logic → fourth corner is a red herring. 
  - Tibetan variations (Sakya, Jonang): Some treat emptiness as truly established → fourth corner becomes absolute. 

  Biggest pitfalls to flag: 
  - Svātantrika's "hidden ontology": Their conventional logic smuggles in foundations. 
  - Prāsaṅgika's quietism: Total negation risks nihilism. 
  - Jonang's absolutism: Empty-but-real paradox. 

  Will avoid over-splitting—e.g., Gelug Prāsaṅgika and Gorampa’s Sakya view differ subtly on negation, but both reject fourth-corner assertions. The tree should show where positions converge (e.g., Gelug/Sakya agreeing on emptiness’s emptiness) vs. diverge (e.g., on negation’s scope). 

