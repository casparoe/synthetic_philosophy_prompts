  ## The Catalog

  **Hume & Kant Apparatus, Ltd.**  
  *Supplying the Philosophical Trade Since 1897*

  **Fall 1963 Catalog Supplement: Introducing the Intuition Pump™ Series!**

  Tired of flimsy arguments? Exhausted by the laborious churn of dialectic? Modern philosophy demands *results*. Our revolutionary Intuition Pump™ line delivers robust, reliable philosophical intuitions with minimal cognitive overhead. Engineered for clarity and persuasive power, each unit presents a meticulously crafted scenario, pre-optimized to yield targeted insights. Forget vague ponderings – get the judgment you *need*, precisely when you need it. Crafted in our Cambridge (MA) workshops using only the finest hypotheticals and counterfactuals.

  ---

  **Product #IP-101: The Standard Five-Person Trolley Platform™**

  *The Industry Workhorse. Your Go-To for Foundational Moral Calculus.*
  *   **Scenario:** One runaway trolley, five workers on the main track, one worker on the spur. Manual lever included.
  *   **Key Feature:** Pre-Calibrated Moral Salience! Our patent-pending *Salience Amplifier™* ensures the five workers are vividly described as "hard-working family providers," while the one worker remains generically "a person." Irrelevant physical details (uniforms, weather, bystander demographics) are factory-set to *neutralize distraction* and focus attention solely on the intended utilitarian calculus.
  *   **Guarantee:** >95% lever-pulling intuition rate right out of the box! The lever-action is smooth and decisive – no awkward "what if..." stutters.
  *   **Durability:** Reinforced scenario casing prevents tampering with core assumptions (e.g., "Are there *really* only two options?" or "Could you just yell?"). Tamper-evident seals show if unauthorized re-description attempts occur.
  *   **Includes:** 1x Trolley Platform Base, 6x Worker Figurines (5x High-Salience, 1x Low-Salience), 1x Lever Mechanism, 1x Certificate of Pre-Loaded Permissibility.
  *   **Accessory #IP-101-SPUR:** Additional Single Worker Spur Track Kit. For extending arguments or comparative studies. ($22.95)

  ---

  **Product #IP-207: The Sealed Chinese Chamber™**

  *Definitive Proof of Syntax ≠ Semantics. Now in Soundproof Design!*
  *   **Scenario:** One operator (you!), one rulebook (comprehensive), one input/output slot. Entire chamber rendered in opaque, philosophically inert polymer.
  *   **Key Innovation:** *Hermetic Symbol Isolation!* The chamber’s design rigorously excludes *any* potential source of "understanding" or "meaning" beyond the formal symbol manipulation performed inside. No risk of accidental semantics leaking in! Inputs arrive solely as uninterpreted squiggles; outputs depart as pre-programmed squiggle responses.
  *   **Guarantee:** Produces the powerful "But it *just doesn't* understand Chinese!" intuition with 99.7% reliability. The chamber’s impenetrability *visually reinforces* the formalist thesis.
  *   **Durability:** Chamber walls resist common counter-arguments like "But what about the *system*?" or "Couldn't evolution/implementation grant meaning?" The sealed unit presents the scenario exactly as intended – *syntactically pristine*.
  *   **Includes:** 1x Sealed Chamber Unit, 1x Comprehensive Rulebook (English Edition), 100x Pre-Formatted Chinese Input Cards, 100x Blank Output Slips, 1x Certificate of Pre-Loaded Functionalist Refutation.
  *   **Accessory #IP-207-SYS:** Optional "The System" Placard. Mounts externally. Warns against confusing the chamber operator with the entire process. ($9.95)

  ---

  **Product #IP-309: Mary's Monochrome Module™**

  *Settling the Knowledge Argument, One Captive Scientist at a Time.*
  *   **Scenario:** One neuroscientist (Mary), raised in a meticulously controlled black-and-white environment. One sealed door. One vibrant red tomato (post-exit).
  *   **Core Technology:** *Epistemic Containment Field™.* Ensures Mary possesses *all physical information* about color vision *before* exit. No gaps! The module’s environment is rigorously defined: pure data-streams, monochrome monitors, exhaustive textbooks. Crucially, the red tomato is *maximally vivid* upon exit – factory settings guarantee its redness is *shocking* and *qualitatively novel*.
  *   **Guarantee:** Elicits the "Ah, so she learns *something new*!" intuition instantly. The vividness of the tomato is pre-tuned to overwhelm any lingering doubts about the completeness of physical knowledge.
  *   **Durability:** Module resists attempts to "dull" the tomato or suggest Mary could have *deduced* the experience. The epistemic barrier is presented as absolute.
  *   **Includes:** 1x Monochrome Containment Module, 1x Mary Figurine, 1x Vivid Red Tomato (High-Quality Plastic), 1x Set of "Complete Physical Knowledge" Datasheets, 1x Certificate of Pre-Loaded Qualia Revelation.

  ---

  **Product #IP-422: Nozick's Experience Orchestrator™ Deluxe**

  *The Ultimate Hedonic Control Unit. Test Your Commitment to Reality!*
  *   **Scenario:** One comfortable pod. One master console offering limitless, perfectly convincing pleasurable experiences. One simple "plug-in" decision.
  *   **Key Feature:** *Pleasure Maximization Overdrive!* The Orchestrator doesn't offer *good* experiences; it offers *perfect*, *flawless*, *unimaginably better* experiences than real life – guaranteed. Potential downsides (boredom, lack of achievement) are minimized in the console display. The "real life" alternative is subtly pre-configured as mundane and slightly disappointing.
  *   **Guarantee:** Generates profound unease and the "But I wouldn't plug in!" intuition in >85% of users. The console’s seductive interface makes the refusal feel like a deep, authentic value judgment against hedonism.
  *   **Durability:** Robust narrative framing prevents common workarounds like "Couldn't I plug in *just for a while*?" or "What if I programmed *real* challenges?". The binary choice is presented as fundamental.
  *   **Includes:** 1x Experience Pod (Plush Upholstery), 1x Master Control Console (Glossy Finish), 1x Set of Pre-Loaded "Paradise" Scenarios (Adventure, Love, Artistic Triumph), 1x Subtly Dim "Real Life" Comparison Display, 1x Certificate of Pre-Loaded Reality Preference.

  ---

  **Essential Accessories:**

  *   **#IP-ACC-KIT:** Knob-Tightening Adjustment Kit. Contains specialized tools (Rigging Wrench, Salience Screwdriver, Vividness Dial) for fine-tuning scenario parameters *until the desired intuition emerges clearly*. Essential for peer review prep! ($49.95)
  *   **#IP-ACC-VIO:** Thomson's Plug-Compatible Violinist. Pre-configured with life-support dependency. Features easy-grip kidney-shaped plugs and a faintly aristocratic, guilt-inducing expression. For advanced deontological intuitions. ($34.95)
  *   **#IP-ACC-TROLLEY-3PK:** Runaway Trolley 3-Pack. Economical replacement trolleys for high-volume ethics seminars. Pre-oiled for smooth running. ($17.95)

  ---

  **Testimonial:**

  *"Before Hume & Kant's Intuition Pump™ line, generating publishable results was a slog. Now, with the Sealed Chinese Chamber™, I get the *exact* anti-functionalist intuition I need, reliably and without messy counter-arguments gumming up the works. The pre-loaded conclusion certificate is a lifesaver during revisions – it reminds me what my 'independent' judgment was *supposed* to be. It’s cut my research time in half!"*
  *– Prof. Eustace Thorne, St. Jude's College*

  **Order Today!** Philosophers: Stop Thinking *So Hard*. Start Pumping.
  Call Toll-Free: 1-800-INTUIT-93 | Visit: www.humeandkantapparatus.com/pumps

