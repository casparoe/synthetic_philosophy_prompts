answer: |-
  ### Decision Procedure: Classification of Legendary Narratives  
  **Objective**: Disambiguate among (1) **historical kernel**, (2) **historical echo**, or (3) **structural analog**.  
  **Scope**: Applicable to pre-modern narratives without specialist archives; uses textual analysis, archaeology, and comparative historiography.  
  **Limitations**: Excludes theological/national claims, bibliographies, philology, and stratigraphy. Relies on accessible scholarly consensus (e.g., syntheses in academic journals).  

  ---

  #### **Ordered Sequence of Questions**  
  *(Sufficient answers: Proceed to next step. Halt answers: Classify outcome. Judgment flags: ✦)*  

  1. **Contemporary Corroboration**  
     - *Question*: Is there non-derivative textual/archaeological evidence from the narrative’s *claimed era* supporting core events/figures?  
       - *Sufficient to proceed*: Absent or ambiguous evidence.  
       - *Halt*: **Probable kernel** (if evidence is direct and specific).  
       - *Judgment*: ✦ Distinguish "silence" (e.g., lost records) from "absence" (e.g., evidence expected but missing).  
       - *False-positive risk*: Correlation ≠ causation (e.g., destruction layers may reflect regional warfare, not the narrative).  

  2. **Archaeological Specificity**  
     - *Question*: Do excavated remains at purported sites align with *non-generic, narrative-specific details* (e.g., battle debris, named locations, artifacts)?  
       - *Sufficient to proceed*: Partial alignment (e.g., destroyed city but wrong timeframe) or no alignment.  
       - *Halt*: **Probable kernel** (if alignment is precise and unique).  
       - *Judgment*: ✦ Weigh "imperfect correlation" (e.g., Hisarlik’s Troy VII vs. Homeric Troy) against coincidental patterns.  
       - *False-positive risk*: Material culture may fit multiple narratives (e.g., widespread destruction layers in Bronze Age Anatolia).  

  3. **Anachronism Audit**  
     - *Question*: Does the narrative contain details implausible for its *claimed era* but plausible for its *composition era* (e.g., technology, toponyms, social structures)?  
       - *Sufficient to proceed*: No major anachronisms.  
       - *Halt*: **Historical echo** (if anachronisms map to a known later event; e.g., Iron Age weapons in a Bronze Age siege story).  
       - *Judgment*: ✦ Distinguish "retrojection" (e.g., later event projected backward) from "mythologization" (symbolic embellishment).  
       - *Test*: If anachronisms correlate with events from the composition period → **echo**; if pervasive but diffuse → **analog**.  

  4. **Collective-Memory Markers**  
     - *Question*: Does the narrative encode geographically/chronologically plausible *etiological motifs* (e.g., trauma, migration, founding heroes) absent in other traditions?  
       - *Sufficient to proceed*: Weak or generic motifs (e.g., universal flood myths).  
       - *Halt*: **Structural analog** (if motifs reflect era-typical phenomena but no specific event; e.g., recurring refugee experiences).  
       - *Judgment*: ✦ Assess "resonance" with historical conditions (e.g., Exodus’ liberation theme vs. Levantine anti-imperialism).  

  5. **Negative Evidence Threshold**  
     - *Question*: Is there *conclusive absence* of evidence for elements that should leave traces (e.g., no migration debris for a mass exodus)?  
       - *Sufficient to proceed*: Absence is inconclusive (e.g., perishable evidence).  
       - *Halt*: **Unrecoverable kernel** (if evidence exists for setting but narrative is irreparably corrupted) or **analog only** (if absence disproves historicity).  
       - *Judgment*: ✦ National/theological narratives may inflate "gaps" as mystery; archaeologically testable claims fail here.  

  6. **Disambiguation Gateway**  
     - *Question*: Synthesize Steps 1–5:  
       - If evidence suggests a *singular catalyst event* → **Historical kernel** (recoverable or not).  
       - If *anachronisms + later event correlation* → **Historical echo**.  
       - If *thematic plausibility + absence of specifics* → **Structural analog**.  
       - *Judgment*: ✦ All outcomes require weighing probabilities; theological narratives risk misclassification as "kernel."  

  ---

  ### **Worked Examples**  
  #### **1. Arthurian Cycle**  
  - **Step 1**: No contemporary evidence (5th–6th century CE). *Proceed*.  
  - **Step 2**: Archaeology shows post-Roman British sites (e.g., Tintagel) but no Camelot, Excalibur, or battles. *Proceed*.  
  - **Step 3**: Central anachronisms (knights, feudalism) match 12th-century Norman culture. *Halt*: **Echo?**  
    - *Test*: Anachronisms do not map to a *specific* later event (e.g., Hastings) but diffuse Norman influence → Fails echo test.  
  - **Step 4**: "Hero resists invaders" motif fits post-Roman Britain but is generic across eras. *Proceed*.  
  - **Step 5**: No evidence for Arthur’s kingdom or battles despite expected traces (e.g., diplomas, fortifications). *Halt*: **Unrecoverable kernel** (if a minor warlord existed) or **analog only**.  
    - *Why echo fails*: Anachronisms reflect myth-building, not retrojection of a discrete event.  
  - **Outcome**: Halts at Step 5 → **Unrecoverable kernel** or **analog only**.  

  #### **2. Exodus Narrative**  
  - **Step 1**: No Egyptian records of Hebrew enslavement/mass escape (13th century BCE). *Proceed*.  
  - **Step 2**: No archaeological trace of Sinai wandering or Jordan River crossing. *Proceed*.  
  - **Step 3**: Anachronisms (e.g., "land of Ramses" named centuries early; Philistines in Genesis). *Halt*: **Echo?**  
    - *Test*: Correlates with later events (e.g., Babylonian exile’s "return from captivity") → **Possible echo**.  
  - **Step 4**: Strong collective-memory markers: liberation trauma, covenant formation, route details (e.g., Migdol/Baal-Zephon plausibly Bronze Age toponyms). *Proceed*.  
  - **Step 5**: Absence of evidence for mass migration is significant (expected: campsites, Sinai pottery). *Halt*: **Unrecoverable kernel** (if small-group escape) or **analog** (if fabricated from recurring motifs).  
  - **Disambiguation**:  
    - Step 3 supports **echo** (exile retrojected to Bronze Age).  
    - Step 4 supports **kernel** (specific toponyms) or **analog** (anti-Egyptian resistance tropes).  
    - Step 5 supports **analog** (no evidence) or **unrecoverable kernel** (if kernel was small-scale).  
  - **Outcome**: Ambiguity between **echo**, **analog**, and **unrecoverable kernel**. Judgment prioritizes:  
    - **Structural analog** (themes fit Levantine experiences; no specific event).  

  ---

  ### **Procedure Limitations**  
  1. Cannot resolve theological claims (e.g., Exodus as divine intervention).  
  2. Cannot replace source criticism (e.g., textual layers in Homer).  
  3. Misfires on nationalist narratives (e.g., modern ideologues may ignore halts at Step 5).  
  4. Requires user literacy in basic historiography (e.g., distinguishing anachronisms).  

  ---

  ### **Check Question**  
  > *A narrative describes a 9th-century BCE battle. Archaeology confirms a city’s destruction at that time, but the weapons described match 7th-century BCE models. Later records show a near-identical battle in 680 BCE. Using this procedure, is this a kernel or echo?*  
  - **Answer**:  
    - Step 1: Contemporaneous evidence (destruction layer) → Proceed (not specific to narrative).  
    - Step 3: Anachronisms + correlation with 680 BCE battle → **Halt as historical echo**.  
  - *Why?* The narrative retrojects a later event (680 BCE) onto an earlier setting. A kernel would lack anachronisms aligning with a later period.  

  This distinguishes **kernel** (event in claimed era) from **echo** (later event projected backward).
