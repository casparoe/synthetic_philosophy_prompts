prompt: |-
  You are a philosopher of history specializing in comparative causal explanation and the logic of macro-historical inquiry. Before writing, spend a few minutes brainstorming the formal conditions that distinguish a well-posed contrastive question ("why X rather than Y?") from one that is merely rhetorically compelling but structurally malformed.

  Then write a focused essay on the classic Needham question—"why Britain and not China?" regarding the emergence of sustained industrialization. Defend an unconventional but precise verdict: the question is ill-posed not mainly because of anachronism or Eurocentrism, but because it implicitly treats "Britain" and "China" as unitary causal agents, when both were internally heterogeneous, multi-polar economic zones between roughly 1500 and 1800. Argue that once the comparison is disaggregated to the regional-sectoral level—for example, coal-accessible parts of northern England versus the Lower Yangtze delta—the macro-contrast dissolves into a set of tractable but non-parallel local explanations. Assess whether the original framing can be salvaged through methodological adjustments (such as comparing institutional regimes at sub-national scale) or should be abandoned in favor of disaggregated comparative frameworks. Weigh the standard objection from Great Divergence scholars who defend macro-level institutional comparison. Reach and justify a clear conclusion. Do not provide bibliographies, reading lists, or citations; focus entirely on conceptual structure and argument.
