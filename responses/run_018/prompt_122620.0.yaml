prompt: |-
  I'm a nurse practitioner at a big safety-net hospital and I've somehow ended up on the committee that has to sign off on any predictive model before it goes anywhere near patient care. I got put on it because I complained, loudly, when I found out our old sepsis alert was firing at noticeably different rates on my clinic's patients than on the privately insured patients upstairs.

  Our first real decision lands in two weeks, and there'll be more after it, so I want a procedure and not just advice about this one model. Here's the case. Care management wants a model that scores every patient at discharge on their risk of an "avoidable" readmission within 30 days, so they can hand out the 40 care-coordination slots they have each month to the top-scoring patients out of roughly 900 discharges. The vendor says the model is "demographic-blind" — it doesn't take race or insurance type as an input — but it does take zip code, prior utilisation, number of previous missed appointments, and a comorbidity score built partly from billing codes, and I do not need anyone to explain to me why that's not the same thing as blind.

  The thing I actually need: an ordered decision procedure my committee can run on a proposal like this. For each step, what counts as a sufficient answer, where the procedure just stops with a no, and where it hands the decision to a human because the question is one of values rather than facts. Specific things it has to deal with, because these are the bits I keep getting lost in:

  - We can only give the intervention to 40 people. It's a ranking with a fixed budget, not a yes/no threshold. I think that changes which fairness constraints are even coherent and which ones quietly stop mattering, but I can't get anyone to say why in a sentence I can repeat.
  - The label is contaminated two ways that I can see: readmissions only get counted if the patient comes back to *us*, and patients who got care coordination last year were less likely to be counted as readmitting. So the training target partly records our own past behaviour. If that kills the proposal, I want the procedure to say so early rather than at the end.
  - Our compliance people won't let us use race as an input and won't let us collect it even to audit with. We do have insurance type, preferred language, age and zip. So tell me how to audit anything at all when the group you care about is one you're not allowed to look at, and be honest about what that workaround buys and what it doesn't.
  - There's apparently a result — someone mentioned it to me and I've been unable to reconstruct it — to the effect that a score can't in general satisfy all of these at once: (a) the score means the same thing for people in different groups, (b) the same share of people who really would readmit get flagged in each group, (c) of the people flagged, the same share really would readmit in each group, (d) the same share of people who would *not* have readmitted get flagged in each group — except in special cases like equal base rates or a perfect predictor. My committee needs to be walked to the point where it has to *choose* which of these to give up, on the basis of who eats which error, rather than being allowed to nod along to all four.

  Constraints on the document: eight people on the committee (two clinicians, one data scientist, one lawyer, two patient reps, a finance person and me), so no notation, nothing that requires knowing what a false positive rate is without being told; the whole thing has to be run in a two-hour meeting; and it has to be honest about which steps are judgement calls dressed up as procedure.

  Then run it on three things: the readmission model above; a proposal to overbook clinic slots for patients predicted to miss their appointment; and, as a contrast case, a tool that only reorders the radiology reading queue with no fixed budget. I want at least one of those to come out as no, and I'd rather find out now that the no is going to land on the overbooking one than be told so politely.
reasoning: |-
  We are designing a decision procedure for evaluating predictive models in a healthcare setting. The procedure must be understandable by a diverse committee (clinicians, data scientist, lawyer, patient reps, finance, nurse practitioner) and must fit within a two-hour meeting. It should avoid technical jargon and be broken down into clear steps. The procedure will address the specific concerns raised: fixed budget (ranking), label contamination, auditing without race, and the impossibility of satisfying all fairness criteria simultaneously.

  The procedure has the following steps:

  1. **Problem Suitability Check** (Early stop if the problem is fundamentally flawed)
     - Check if the problem setup is appropriate for a predictive model.
     - For the readmission model: The goal is to allocate a fixed resource (40 care-coordination slots) to 900 discharges. The model ranks patients by risk. But we must consider:
       - The label ("avoidable" readmission) is contaminated because:
          a) Readmissions are only counted if the patient returns to *our* hospital (so if they go elsewhere, it's missed).
          b) Past care coordination (which was not randomly assigned) may have reduced readmissions, so the label is influenced by prior intervention.
       - **Decision**: If the label contamination is severe enough that we cannot trust the data to reflect the true risk, we stop here and reject the model. We might require that the training data come from a period without such interventions, or that the model accounts for this bias. If not, the model is rejected.

  2. **Fairness and Bias Audit** (Using available proxies)
     - Since we cannot use race (and cannot collect it for auditing), we must use proxies (insurance type, language, zip code, age). We form groups that are likely to be correlated with race (e.g., by insurance type: Medicaid vs. private, or by zip code in areas known to have high minority populations). But note: these are imperfect and may miss some disparities.
     - We require the vendor (or our data scientist) to provide:
       - **Disparate Impact Analysis**: For each group (defined by insurance, language, etc.), compute:
          - The distribution of scores (e.g., average score by group)
          - The selection rate (how many from each group would be in the top 40? based on the model)
          - The expected outcome (readmission rate) for each group in the top 40 and in the whole population.
       - Check for significant disparities in selection rates (e.g., if one group is selected at a much lower rate than their proportion in the population, that might indicate bias).
     - However, we acknowledge that without race, we might not capture all biases. So we also require:
       - **Sensitivity Analysis**: The vendor must show that the model does not rely heavily on zip code (which can be a proxy for race) by retraining without zip code and showing that the model performance doesn't drop much. If it does, then zip code is a strong predictor and might be introducing bias.

  3. **Impossibility of Perfect Fairness** (Explaining trade-offs)
     - We explain to the committee that we cannot achieve all desirable fairness properties at once. We will present the following four properties in simple terms and show that they conflict:
          a) **Calibration**: The score means the same thing for every group (e.g., a score of 0.2 means 20% chance of readmission for everyone).
          b) **Equal Recall (Sensitivity)**: Among the patients who truly would be readmitted, the same fraction is flagged (i.e., selected) in each group.
          c) **Equal Precision (PPV)**: Among the patients flagged, the same fraction truly would be readmitted in each group.
          d) **Equal False Omission Rate (or Specificity)**: Among the patients who would not be readmitted, the same fraction is not flagged (i.e., not selected) in each group.
     - We explain that unless the base rates (readmission rates) are the same across groups or the model is perfect, we cannot have all four. We must choose which ones to prioritize.
     - We then ask the committee to decide which error types are more acceptable to miss:
          - Missing a high-risk patient (false negative) in a disadvantaged group? Or
          - Allocating a slot to a low-risk patient (false positive) in a disadvantaged group?
     - This step is a values judgment and must be made by the committee.

  4. **Performance and Utility Check**
     - We require the model to have reasonable predictive performance. We ask for:
          - **AUC-ROC** (or a non-technical explanation: how well does the model separate high-risk from low-risk patients?)
          - **Calibration plots** (to see if the predicted risk matches the actual risk).
     - We also require an estimate of the model's impact: 
          - How many readmissions would be prevented by giving the intervention to the top 40? (This requires knowing the effectiveness of the care coordination.) Without this, we cannot know if the model is useful.

  5. **Operational Feasibility and Legal Review**
     - The lawyer and finance person review: 
          - Does the model comply with regulations (e.g., anti-discrimination laws)? 
          - Is the use of zip code (a proxy for race) legally acceptable?
          - What is the cost of the model and the intervention? 
          - Are there any contractual issues with the vendor?

  6. **Human Oversight and Appeal**
     - We require that there is a process for clinicians to override the model's ranking (if they have additional information) and that patients can appeal.

  7. **Decision**
     - If the model passes all checks (1-6) and the committee agrees on the fairness trade-offs, then approve. Otherwise, reject or require modifications.

  Now, we run the procedure on the three examples:

  **Example 1: Readmission Model (Care Coordination)**
  1. **Problem Suitability**: 
     - The label contamination is severe: past care coordination likely reduced readmissions for some patients (so the label is biased) and readmissions are only counted if they return to us. This might lead to undercounting in groups that use other hospitals. 
     - **Early Stop**: Without a way to adjust for these (e.g., using external data or a different labeling process), we reject the model. The procedure stops here with a "No".

  **Example 2: Overbooking Clinic Slots for Patients Predicted to Miss Appointments**
     - The goal is to overbook for patients predicted to miss appointments to reduce wasted slots.
     - **Step 1: Problem Suitability**
          - The label (missed appointment) might be less contaminated than readmission. But note: if we have previously overbooked for some patients, that might have affected their attendance (so past intervention might have influenced the label). Also, missed appointments are only recorded at our clinic (if they cancel or no-show). This is acceptable because we only care about our own appointments.
          - We proceed.
     - **Step 2: Fairness Audit**
          - We form groups by insurance, language, zip. We check: 
              - Are there disparities in the predicted probability of missing an appointment? 
              - Does the model over-predict misses in certain groups (leading to overbooking) and under-predict in others? 
              - We require the model to be audited for these disparities.
          - We also require sensitivity analysis without zip code.
     - **Step 3: Fairness Trade-offs**
          - We explain the same four properties. Here, if we overbook for a patient who would have come (false positive), we risk having too many patients and longer waits. If we fail to overbook for a patient who would miss (false negative), we waste a slot. 
          - We ask the committee: which error is worse? 
              - In a safety-net hospital, overbooking might lead to overcrowding and poor care. But wasting slots means fewer patients seen. 
          - We must choose which group to prioritize (e.g., we don't want to overbook more for a group that is already disadvantaged and faces longer waits).
     - **Step 4: Performance and Utility**
          - We need the model to be better than the current method (if any). We require AUC and calibration. 
          - We also need to know: how much does overbooking help? (e.g., how many additional patients are seen? and what is the effect on wait times and quality of care?)
     - **Step 5: Legal and Feasibility**
          - Using zip code might be problematic if it leads to overbooking in certain neighborhoods (which might be predominantly minority). The lawyer must review.
     - **Step 6: Human Oversight**
          - Clinicians should be able to adjust overbooking based on patient factors.
     - **Decision**: This model might be conditionally approved if the fairness audit shows no large disparities and the committee accepts the trade-offs. But note: the overbooking model might lead to longer wait times in clinics serving disadvantaged groups if they are overbooked more. If we see that the model is selecting a disproportionate share of patients from a particular group for overbooking (which might lead to a negative patient experience in that group), we might reject.

  **Example 3: Radiology Reading Queue Reordering (No Fixed Budget)**
     - The tool reorders the queue (e.g., putting urgent cases first) without a fixed budget (so all cases are read, just in a different order).
     - **Step 1: Problem Suitability**
          - The label (e.g., urgent finding) might be based on radiology reports and is less likely to be contaminated by past interventions. We proceed.
     - **Step 2: Fairness Audit**
          - We form groups and check: 
              - Does the model assign the same level of urgency for the same condition across groups? 
              - We look at the distribution of urgency scores by group and the reordering effect (e.g., are patients from disadvantaged groups systematically put at the end?).
          - Since there's no fixed budget, we are concerned about delays in diagnosis for some groups. We require that the average time to read does not differ significantly by group.
     - **Step 3: Fairness Trade-offs**
          - Here, the main concern is that the model might delay readings for some groups. We want to avoid that. We might prioritize:
              - **Equal False Negative Rate**: We don't want to miss an urgent case in any group. So we want the same sensitivity (recall) for urgent cases in every group.
          - We explain that if base rates of urgent findings differ by group, then we might have to trade off between delaying non-urgent cases in one group versus another. But since the goal is to prioritize urgent cases, we might choose to equalize recall for urgent cases.
     - **Step 4: Performance and Utility**
          - We require high sensitivity for urgent findings. The model should improve the average time to read urgent cases without unduly delaying non-urgent cases in any group.
     - **Step 5: Legal and Feasibility**
          - Reordering by medical urgency is less likely to raise legal issues than allocation of limited resources.
     - **Step 6: Human Oversight**
          - Radiologists should be able to override the order.
     - **Decision**: Likely approved, provided the fairness audit does not show significant delays for disadvantaged groups.

  Summary of decisions:
  - Readmission model: Rejected at step 1 due to label contamination.
  - Overbooking model: Conditionally approved, pending fairness audit and trade-off decisions (but note: if the fairness audit shows disparities, it might be rejected).
  - Radiology reordering: Approved.

  We note that the "No" landed on the readmission model (as requested). The overbooking model might be approved if it passes the fairness audit and the committee accepts the trade-offs, but it could also be rejected if the audit shows unacceptable disparities.

  The procedure is designed to be run step by step, with clear stopping rules and places for human judgment (especially in step 3). It avoids technical jargon by explaining concepts in plain language.
answer: |-
  ### Predictive Model Review Procedure for Committee Use  
  **Goal:** A step-by-step, non-technical process to evaluate predictive models for fairness, reliability, and alignment with hospital values. Designed for 2-hour meetings.  
  **Key Principles:**  
  - **Early stops** for fatal flaws (no ambiguity).  
  - **Human judgment** steps flagged explicitly.  
  - Focus on **who bears costs** of errors.  
  - Audit with **available proxies** (insurance, language, zip), acknowledging gaps.  

  ---

  ### Step-by-Step Review Procedure  
  #### **Step 1: Verify Problem Setup & Label Reliability**  
  **Question:** *"Does the model’s target (label) fairly represent reality, given our hospital’s limitations?"*  
  - **Check:**  
    - If the label is influenced by **past unequal access** (e.g., readmissions only counted at *our* hospital).  
    - If **past interventions** (e.g., care coordination) contaminated the label.  
    - If the label **excludes groups** we serve (e.g., uninsured patients less likely to return to us).  
  - **Sufficient Answer:**  
    - "Yes, the label accounts for biases (e.g., uses external data or adjusts for historical inequities)."  
  - **Stop Early (Reject) If:**  
    - The label **cannot be corrected** for contamination (e.g., no data to adjust for patients lost to other hospitals).  
  - **Human Judgment Needed?** No. Fact-based.  

  #### **Step 2: Fixed-Budget Fairness Check (For Rankings Only)**  
  **Question:** *"When we take the top 40, will protected groups (e.g., low-income, non-English speakers) be fairly represented?"*  
  - **Check (Using Proxies):**  
    - Compare **selection rates** by insurance/language/zip: What % of each group ranks in the top 40?  
    - If disparities exist (>10% difference), ask: *"Do these reflect real need, or model bias?"*  
  - **Why Fixed Budget Changes Fairness:**  
    - In rankings, **equal false positive/negative rates don’t apply**. Focus on:  
      - **Who gets resources?** (Selection rate fairness).  
      - **Who is left out?** (e.g., If high-risk Medicaid patients rarely make the top 40).  
  - **Sufficient Answer:**  
    - "Disparities align with **medical need** (e.g., higher risk in a group), not artifacts like zip code bias."  
  - **Stop Early (Reject) If:**  
    - The model **systematically deprioritizes vulnerable groups** (e.g., Medicaid patients 5× less likely to be top 40).  
  - **Human Judgment Needed?** Yes. Requires agreeing on what disparity is acceptable.  

  #### **Step 3: Fairness Trade-offs (The "Impossibility Theorem")**  
  **Question:** *"Which fairness priority do we choose, knowing we can’t have all?"*  
  - **Explain Simply:**  
    > "We want a model where:  
    > (a) A score of ‘70% risk’ means the same thing for everyone.  
    > (b) We find the same % of true high-risk patients in each group.  
    > (c) Of those flagged high-risk, the same % are truly high-risk in each group.  
    > (d) We wrongly flag the same % of low-risk patients in each group.  
    > **We can’t have all four unless risks are identical across groups.** We must pick which to sacrifice."  
  - **Cost of Choices:**  
    | **Priority** | **Who Bears the Cost** |  
    |--------------|------------------------|  
    | (a) Calibration | Over-help lower-risk groups if their scores are inflated |  
    | (b) Equal recall | Miss more high-risk people in groups with lower base rates |  
    | (c) Equal precision | Waste resources on more false alarms in disadvantaged groups |  
    | (d) Equal specificity | Flag more low-risk people in advantaged groups |  
  - **Human Judgment Needed?** **Yes.** Committee must vote on the priority based on **hospital values** (e.g., "We prioritize finding every high-risk Medicaid patient, even if it means more false alarms").  

  #### **Step 4: Audit Without Race**  
  **Question:** *"Using insurance/language/zip, what disparities can we detect—and what can’t we see?"*  
  - **Workaround:**  
    - Group patients by **insurance (Medicaid vs. private)** and **language (non-English vs. English)**.  
    - Test for **disparities** in:  
      - Average risk scores.  
      - Selection rates (for rankings).  
      - Error rates (e.g., false negatives).  
  - **What It Buys:** Identifies **proxy disparities** (e.g., model penalizes non-English speakers).  
  - **What It Misses:** **Race-based bias** if not correlated with proxies (e.g., Black Medicaid patients vs. white Medicaid patients).  
  - **Sufficient Answer:** "No significant disparities found via proxies."  
  - **Stop Early (Reject) If:**  
    - **High bias via proxies** (e.g., non-English speakers have 3× more false negatives).  
  - **Human Judgment Needed?** Yes. Accept that some bias may be invisible.  

  #### **Step 5: Final Approval**  
  **Question:** *"Do the benefits outweigh harms, given Steps 1-4?"*  
  - **Check:**  
    - Performance (e.g., does the model work better than random?).  
    - Legal review: Does using zip code violate anti-discrimination policies?  
    - Patient rep input: Would affected communities accept this?  
  - **Human Judgment Needed?** Yes. Committee vote.  

  ---

  ### Apply Procedure to Three Cases  
  #### **1. Readmission Model (Care Coordination Slots)**  
  - **Step 1:** Label is **contaminated** (readmissions only counted at our hospital; past care coordination skewed data). **→ STOP EARLY. REJECT.**  
  - *No further steps needed.*  

  #### **2. Overbooking for Missed Appointments**  
  - **Step 1:** Label ("missed appointment") is **reliable** (counted at our clinic; no past intervention). Proceed.  
  - **Step 2 (Fixed Budget):** Check selection rate for overbooking. If model over-selects Medicaid patients for overbooking, they face more crowded clinics. **→ Potential harm to disadvantaged groups.**  
  - **Step 3 (Trade-offs):** Must choose:  
    - Prioritize (b) equal recall? → Fewer missed slots but overbook disadvantaged groups.  
    - Prioritize (d) equal specificity? → Avoid overbooking low-risk disadvantaged patients but miss more appointments.  
  - **Step 4 (Audit):** Test if non-English speakers are over-selected for overbooking.  
  - **Step 5:** Likely **REJECT** due to **Step 2/4 disparities** (overbooking targets vulnerable groups, worsening their care experience). Committee may override if benefits (reduced wasted slots) outweigh harms.  

  #### **3. Radiology Reading Queue (No Fixed Budget)**  
  - **Step 1:** Label (e.g., "urgent finding") is **reliable**. Proceed.  
  - **Step 2 (Fixed Budget):** **N/A** (no resource limit; all scans read eventually). Skip.  
  - **Step 3 (Trade-offs):** Focus on **equal recall (b)** to avoid missing urgent cases in any group.  
  - **Step 4 (Audit):** Check if delays in reading scans for Medicaid/non-English speakers increase false negatives.  
  - **Step 5:** Likely **APPROVE** with monitoring (low risk of allocation harm).  

  ---

  ### Summary for Committee  
  - **Procedure Output:**  
    - Readmission model: **Rejected** (fatal label flaw).  
    - Overbooking model: **Likely rejected** (fairness risks to vulnerable groups).  
    - Radiology tool: **Likely approved** (lower stakes, no fixed budget).  
  - **Key Judgments Needed:**  
    - How much disparity is acceptable? (Step 2)  
    - Which fairness goal do we prioritize? (Step 3)  
    - Do invisible biases (Step 4) change our decision?  
  - **Time Allocation:**  
    - Steps 1-2: 30 min  
    - Step 3: 45 min (most discussion)  
    - Steps 4-5: 45 min  

  This procedure forces hard choices early, centers equity, and is usable by non-experts. For the overbooking model, the likely "no" aligns with your preference—it risks exacerbating disparities for already marginalized patients.
