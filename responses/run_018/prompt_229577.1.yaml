prompt: |-
  I'm on the grants committee of a small science foundation, and we keep getting evolutionary biology proposals that explain some trait as having evolved "for the good of the group" or "for the species" -- restraint in predators so they don't overhunt their prey, alarm calls, reduced virulence in parasites, cooperative breeding, that kind of thing. Half my committee waves these through uncritically and the other half auto-rejects anything with the words "group selection" in it. Neither policy seems right, and I'm tired of the same three people yelling at each other every cycle.

  Act as a philosopher of biology who knows the units of selection debate well. Before writing, think through the main failure modes a procedure like this could have, then write us a decision procedure the committee can actually run on a proposal -- we're mostly not specialists -- for telling (a) when a group-level selection explanation is genuinely warranted, (b) when the same facts are better explained at the gene or individual level, and (c) when the two are just different bookkeeping on the same process and the fight is verbal. Build it out of whatever the debate actually gives us: Lewontin's conditions for selection to act at all, the replicator/vehicle distinction, the byproduct problem (a group benefit that's just a side effect of individual advantage), and the claim that multi-level selection and inclusive fitness are mathematically equivalent redescriptions. Say explicitly which of those distinctions have to survive in the procedure and which can be dropped for a lay panel without much loss.

  The procedure itself should be: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates with a verdict like "this needs an individual-level explanation, fund it only if reframed," and where it has to hand off to someone's judgment because the issue is empirical or unsettled rather than checklist-able. Flag which steps are judgment calls dressed up as procedure. Then run it end to end on three cases: eusociality in hymenopteran insects, a bird alarm call that attracts predator attention to the caller, and a pathogen evolving to be less lethal to its host. At least one of the verdicts should be one some of my committee members will hate -- tell me which one and what I'll say to them.

  Format-wise: start with the one-sentence summary of when "for the good of the group" talk is legit and when it isn't, then go straight into the procedure. No preamble, no restating my situation back to me, no bibliography -- I'll dig up sources myself if I need them. American English, and keep it to something I can actually print out and bring to a meeting, so maybe 1500 words max.
reasoning: |-
  Okay, the user is on a grants committee for a science foundation dealing with evolutionary biology proposals that use group-level explanations. They're frustrated because half the committee accepts "for the good of the group" arguments uncritically while the other half rejects anything mentioning group selection outright. Neither approach is ideal, and it's causing recurring conflicts. 

  I need to act as a philosopher of biology familiar with the units of selection debate. The user wants a practical decision procedure that non-specialists can apply to proposals. They specifically mention key concepts like Lewontin's conditions, replicator/vehicle distinction, byproduct problems, and the equivalence between multi-level selection and inclusive fitness theories. 

  Hmm... the challenge is to create something actionable while respecting the actual science. The procedure should distinguish between: (a) legitimate group selection explanations, (b) cases better explained at individual/gene level, and (c) verbal disputes where both frameworks describe the same process. 

  Important considerations:
  - Must avoid oversimplifying complex debates but remain usable by non-experts
  - Need to flag where judgment calls are inevitable
  - Should include concrete examples they can reference (eusociality, alarm calls, reduced virulence)
  - One verdict should deliberately challenge committee biases - probably the reduced virulence case since that's often contentious

  Key concepts to operationalize:
  1. Lewontin's conditions (variation, inheritance, differential fitness) - must be satisfied at whatever level selection is claimed
  2. Replicator/vehicle distinction - helps separate what's actually being selected (genes) from the entity manifesting the trait (individual/group)
  3. Byproduct problem - crucial for spotting "fake" group benefits that are actually individual adaptations
  4. MLS vs inclusive fitness equivalence - means some fights are purely about framing

  The procedure should flow as a decision tree:
  First verify if group benefit is real or a byproduct → then check if group-level variation/heritability exist → then assess whether group fitness differences drive the trait → finally determine if individual-level explanation is equally/more parsimonious

  For the examples:
  - Eusociality: Classic case where both frameworks work, so committee shouldn't reject based on terminology
  - Alarm calls: Likely individual-level explanation (kin selection/reciprocity) unless proven otherwise
  - Reduced virulence: The controversial one - could genuinely involve group selection if transmission depends on host survival

  Need to emphasize that "group selection" isn't automatically wrong, but proposals must demonstrate the group isn't just a passive beneficiary. The summary should capture that group-beneficial traits evolve only when groups vary, inherit traits, and outcompete other groups - not because groups "want" to survive.

  Word count is tight - must stay under 1500 words. No fluff, just the procedure and examples. American English as requested. The tone should be authoritative but practical, like a field guide for grant reviewers.
answer: |-
  **Summary:** "For the good of the group" explanations are legitimate only if the trait evolves due to differential persistence/reproduction *of groups themselves* possessing heritable variation in the trait, not merely as a byproduct of individual advantage or when individual selection suffices; use this procedure to distinguish these cases.

  **Decision Procedure for Evaluating "Group Benefit" Claims:**

  1.  **Is the proposed trait genuinely beneficial at the group level?**
      *   *Ask:* Does possessing this trait demonstrably increase the long-term survival or reproductive output *of the group as a whole* (e.g., colony persistence, predator-prey system stability, host survival for parasite lineages), compared to groups lacking it?
      *   *Sufficient Answer:* Yes, supported by data/modeling showing groups with trait X persist longer, produce more daughter groups, or maintain higher total population sizes than groups without X.
      *   *Insufficient Answer:* Vague statements about "species survival" or "ecosystem health" without concrete group-level metrics. Benefit claimed only at individual level.
      *   *Verdict if No:* **Reject group-selection framing.** The trait may still be adaptive, but not *for* group benefit. Proceed to Step 5 for individual-level check.
      *   *Judgment Call?* Low. Requires empirical evidence for group benefit, not just assertion.

  2.  **Is the group-level benefit merely a BYPRODUCT of individual advantage?**
      *   *Ask:* Can the trait be fully explained as directly increasing the *individual's* (or its genes') fitness *within* its group, with the group benefit arising incidentally? Look for conflicts: does the trait impose a *cost* on the individual expressing it relative to *other individuals within the same group*?
      *   *Key Indicators:* High relatedness within groups (kin selection), direct reciprocity, or the trait being individually advantageous regardless of group context (e.g., reduced virulence allowing *this individual pathogen* to transmit longer).
      *   *Sufficient Answer for Byproduct:* Yes, data/modeling shows the trait provides a net *individual* fitness advantage *even when comparing individuals within the same group*, and the group benefit is a side effect. (e.g., *Individual* pathogens with lower virulence transmit more).
      *   *Sufficient Answer Against Byproduct:* No, the trait imposes a clear *within-group cost* on the bearer that isn't fully compensated by kin/reciprocity mechanisms, and the group benefit arises specifically *because* groups with more such individuals outcompete other groups. (e.g., An alarm caller *lowers* its own survival chance relative to silent group members).
      *   *Verdict if Byproduct:* **Reject group-selection as the primary explanation.** The trait evolves via individual/gene-level selection; group benefit is epiphenomenal. Proceed to Step 5 for individual-level validation. Proposals using "group selection" here should reframe.
      *   *Judgment Call?* Moderate. Requires evaluating the *net* fitness effect at the individual level within groups and the strength of compensatory mechanisms (kin/reciprocity).

  3.  **Does the group function as a Darwinian "individual" (vehicle) for selection?** (Applying Lewontin's conditions at the GROUP level)
      *   *Ask:*
          *   a. *Variation:* Do groups show heritable variation in the trait? (i.e., are groups consistently different in possessing it, and are these differences transmitted when groups reproduce/split/found new groups?).
          *   b. *Fitness Differences:* Is there a consistent correlation between possessing the trait and higher *group fitness* (e.g., group survival rate, rate of producing new groups, total propagule output)? Does this correlation hold *after accounting for individual-level fitness effects*?
          *   c. *Heritability:* Are differences in the group-level trait (or the propensity for groups to have it) passed on when groups "reproduce" (e.g., fission, budding, colony founding swarms)?
      *   *Sufficient Answer for (a/c):* Yes, data shows groups vary stably in trait X, and daughter groups resemble parent groups in X more than random groups do. (e.g., Honeybee colonies vary in hygienic behavior, swarms inherit the trait).
      *   *Sufficient Answer for (b):* Yes, groups with trait X have significantly higher measured group fitness *and* this advantage persists when controlling for average individual fitness within the group. (e.g., Groups with more alarm callers suffer lower *total* predation losses).
      *   *Verdict if ALL (a,b,c) are likely met:** **Group-level selection is a plausible, non-redundant explanation.** Proceed to Step 4.
      *   *Verdict if ANY (a,b,c) is clearly NOT met:** **Reject group-selection explanation.** Group selection cannot act without these prerequisites.
      *   *Judgment Call?* High. Assessing heritability and *independent* group fitness effects is empirically challenging. Proposals must present strong evidence for a-c.

  4.  **Is an individual/gene-level explanation (e.g., kin selection, inclusive fitness) significantly more parsimonious?**
      *   *Ask:* Can the *exact same evolutionary outcome* be predicted and explained with similar or greater simplicity and empirical support using only individual/gene-level costs, benefits, and relatedness, *without invoking group fitness*? (Acknowledge the Price Equation/mathematical equivalence).
      *   *Sufficient Answer for Individual-Level Parsimony:* Yes, the trait is easily explained by high within-group relatedness (kin selection) or direct reciprocity, requiring fewer assumptions than group selection. The group benefit is captured implicitly.
      *   *Sufficient Answer for Group-Level Utility:* No, while mathematically equivalent in outcome, the group perspective offers clearer insight into the *dynamics* (e.g., group extinction/colonization processes are the dominant force), or the individual-level accounting becomes convoluted.
      *   *Verdict if Individual-Level is more Parsimonious:* **Acceptable, but fund only if proposal reframes explanation to individual/gene level OR justifies group-level perspective as dynamically clearer.** "Group selection" phrasing is discouraged unless strongly defended.
      *   *Verdict if Group-Level perspective is justified/dynamic:* **Group-selection explanation is scientifically valid and useful.** Fundable as written.
      *   *Judgment Call?* High. Parsimony is subjective. Focus on which framework offers clearer empirical predictions or mechanistic insight for the specific system.

  5.  **Validate Individual-Level Adaptation (If group selection rejected at Steps 1, 2, 3, or 4):**
      *   *Ask:* Does the trait satisfy Lewontin's conditions at the individual level (Variation, Heritability, Differential individual fitness)? Is there a plausible mechanism (direct benefit, kin selection, reciprocity)?
      *   *Sufficient Answer:* Yes.
      *   *Verdict:* **Trait is an individual-level adaptation.** Fundable if reframed appropriately. Proposals using "group selection" here should be rejected unless reframed.
      *   *Judgment Call?* Low. Standard adaptation assessment.

  **Procedure Summary:** Start at Step 1. Proceed sequentially. Stop and give verdict whenever a rejection or clear path emerges (especially Steps 1, 2, 3).

  ---

  **Running the Procedure:**

  1.  **Case: Eusociality in Hymenopteran Insects (e.g., worker sterility in ants/bees)**
      *   **Step 1:** Yes. Sterile workers benefit colony survival/reproduction.
      *   **Step 2:** **CRITICAL BYPRODUCT CHECK:** Worker sterility imposes a *massive* within-group cost (individual fitness = 0). *Is it a byproduct?* No, because the individual cost is severe. Kin selection (high relatedness due to haplodiploidy) compensates *by increasing indirect fitness*. Verdict: **Not a simple byproduct.** Proceed.
      *   **Step 3:**
          *   a. *Variation:* Colonies vary in worker behavior/sterility commitment.
          *   b. *Fitness Differences:* Colonies with more sterile workers likely have higher fitness (more reproductive output).
          *   c. *Heritability:* New colonies (swarms) inherit the queen's genes influencing worker behavior. **Verdict: Plausible (a,b,c met).** Proceed.
      *   **Step 4:** Kin selection/inclusive fitness provides an extremely parsimonious individual/gene-level explanation via high relatedness. Group selection perspective adds little dynamic insight here. **Verdict: Individual-level (kin selection) is significantly more parsimonious.**
      *   **Final Verdict:** **Acceptable, but fund only if proposal reframes explanation using kin selection/inclusive fitness OR provides strong justification for needing the group-selection perspective.** "For the good of the group" phrasing is misleading here; the primary driver is gene propagation via relatives.

  2.  **Case: Bird Alarm Call Attracting Predator Attention to Caller**
      *   **Step 1:** Yes. Warning the group increases group survival chances.
      *   **Step 2:** **BYPRODUCT CHECK:** Calling imposes a clear within-group cost (increased predation risk on caller). *Is it a byproduct?* Only if compensated by individual advantage (kin selection - warning relatives; reciprocity - others warn you later). **Verdict:** **Likely a byproduct of kin selection/reciprocity.** Proceed to Step 5. *(Group selection explanation rejected here)*.
      *   **Step 5:** Trait varies, is heritable (genetic/learned), and provides net individual fitness benefit via inclusive fitness if group is kin, or via reciprocity. **Verdict: Trait is an individual-level adaptation (kin/reciprocity). Fund if reframed appropriately.** Reject proposals saying it evolved "for the group" without specifying kin/reciprocity.

  3.  **Case: Pathogen Evolving Reduced Virulence to Host (Some committee members will hate this verdict)**
      *   **Step 1:** Yes. Reduced virulence benefits the *pathogen group* by keeping the host alive longer, enabling more transmission opportunities over time.
      *   **Step 2:** **BYPRODUCT CHECK:** Does reduced virulence benefit the *individual pathogen* within its host? Often YES. A less virulent individual pathogen might transmit for longer or more effectively *within that host* compared to a hyper-virulent competitor that kills the host quickly. The group benefit (host survives longer) is often a direct consequence of this individual advantage. **Verdict:** **Often a byproduct of individual advantage.** Proceed to Step 5. *(Group selection explanation initially rejected here)*.
      *   **Step 5:** Reduced virulence is easily explained as an individual-level adaptation: pathogens maximizing their own transmission duration/fecundity within a host. **Verdict: Trait is an individual-level adaptation.** Fund if reframed appropriately.
      *   **Why they'll hate it:** Many intuitively think "less killing = better for the pathogen species/group". This procedure says the group benefit is usually just a side effect; the real driver is competition *among pathogens within the host* favoring those best at long-term exploitation. Proposals claiming group selection here without showing it's *not* a byproduct should be rejected/reframed.
      *   **What to say to them:** "The math and evidence strongly suggest that within-host competition favors less virulent strains *because* they transmit more themselves – the benefit to other pathogens in the host is incidental. Group selection only kicks in if we see distinct pathogen lineages (groups) with heritable virulence levels differentially persisting *because* of that virulence level, beyond the individual advantage. Does the proposal show that? If not, individual selection suffices."

  **Key Concepts Used & Dropped:**
  *   **Survived:** Lewontin's Conditions (Crucial for Steps 3 & 5), Byproduct Problem (Core of Step 2), Replicator/Vehicle Distinction (Implied in Steps 3/5 - group as vehicle).
  *   **Dropped for Lay Panel:** Explicit Replicator/Vehicle terminology (confusing), Deep dive into Price Equation equivalence (Step 4 acknowledges equivalence but focuses on utility/parsimony).
  *   **Judgment Call Flags:** Steps 2 (Byproduct assessment), 3 (Assessing group heritability/fitness independently), 4 (Parsimony evaluation).
