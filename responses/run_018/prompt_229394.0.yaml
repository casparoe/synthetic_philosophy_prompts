answer: |-
  ## Joint Statement on the Norms of Assertion

  **Preamble:** This document represents the outcome of a year-long adversarial collaboration between proponents of the Knowledge Norm (KN) and the Truth Norm (TN) for assertion. Its purpose is to clearly delineate points of agreement and the precise locus of our remaining disagreement, sharpening the dialectic for future research. We affirm that both positions are substantive accounts of assertion's distinctive rule and reject characterisations of TN as licensing any true assertion or KN as condemning every non-knowledgeable assertion as blameworthy *simpliciter*.

  **1. Agreed Claims Regarding Assertion:**

  Both parties accept the following non-vacuous claims:

      1.  **Normative Constraint:** Assertion is a speech act inherently governed by a normative standard; it is not merely a descriptive report of one's mental state.
      2.  **Truth Necessity:** An assertion that *p* is improper *in a primary way* if *p* is false. Truth is a necessary condition for an assertion meeting its core normative standard. (This does *not* entail truth is sufficient for TN).
      3.  **Falsehood Impropriety:** Asserting a falsehood constitutes a distinct kind of normative failure specific to assertion itself, beyond potential violations of other norms (e.g., moral, prudential, or conversational).
      4.  **Criticism Beyond Truth/Falsity:** Assertions can be legitimately criticised as improper, unreasonable, irresponsible, or misleading even when they are true (e.g., for being lucky guesses, based on insufficient evidence, or reckless).
      5.  **Non-Triviality:** Both the Knowledge Norm ("Assert only what you know") and the Truth Norm ("Assert only what is true") are substantive, non-trivial candidate norms for assertion. Neither reduces to the other or to a mere description of assertion's function. Both aim to capture the *distinctive* rule governing this speech act.
      6.  **Blameless Impropriety:** An assertion can be improper according to the distinctive rule of assertion (violating KN or TN respectively) even if the speaker is not blameworthy for making it, due to excusable ignorance, misleading evidence, or extenuating circumstances.

  **2. The Residual Disagreement:**

  Our fundamental disagreement concerns the **nature of the distinctive constitutive rule** governing assertion – the rule violation of which constitutes the *core* normative defect specific to the act of asserting itself.

  *   **The Knowledge-Norm Position (KN):** The distinctive rule of assertion is: *One must: assert that p only if one knows that p*. Violation of *this* rule constitutes the primary impropriety specific to assertion. Assertions failing to meet the knowledge condition are improper *qua* assertions, even if true. Criticism of true assertions as reckless, unsupported, or lucky often directly concerns this knowledge condition. Other criticisms trace to subsidiary norms or standards.
  *   **The Truth-Norm Position (TN):** The distinctive rule of assertion is: *One must: not assert what is false*. Violation of *this* rule (asserting a falsehood) constitutes the primary impropriety specific to assertion. While criticism of true assertions as reckless, unsupported, or lucky is legitimate, it stems from violations of other norms (e.g., epistemic norms governing belief, norms of conversation, or pragmatic considerations) rather than the distinctive rule of assertion itself. The rule of assertion *only* forbids false assertion.

  *Clarifications:*
  *   Both parties agree that assertion involves *entitlement*: a speaker is entitled to assert *p* only if they meet the relevant condition (knowledge or truth, respectively). Impropriety arises from lacking this entitlement.
  *   Both parties agree that "impropriety" here refers to a defect *according to the distinctive rule of assertion*, not necessarily overall blameworthiness or moral failing.
  *   We concur that debates framed purely in terms of "warrant" or "justification" without distinguishing the *source* of the normativity (distinctive rule vs. other norms) obscured the core disagreement, which is now clarified.

  **3. Cruxes and Predictive Cases:**

  The following concrete cases are agreed by both parties to bear crucially on resolving our disagreement. For each, we state the key question and each party's prediction regarding the case's implications for the *propriety of the assertion according to the distinctive rule*:

  *   **Crux 1: The Lottery Paradox**
      *   **Case:** Alice knows she holds one ticket in a large, fair lottery with one winner. She has no inside information. The draw has occurred but results are not yet announced. Alice asserts: "My ticket has lost."
      *   **Question:** Is Alice’s assertion improper *according to the distinctive rule of assertion*, despite its high probability of truth?
      *   **KN Prediction:** **Improper.** Alice does not *know* her ticket has lost (it's merely highly probable). Assertion violates the knowledge rule. High probability does not suffice for knowledge.
      *   **TN Prediction:** **Proper (if true, which it likely is).** The assertion is likely true. Criticism of Alice for asserting based merely on probability stems from epistemic norms governing belief or conversational standards, not the rule of assertion itself, which only forbids false assertion. Asserting a truth cannot violate the core norm.

  *   **Crux 2: Gettiered Assertion**
      *   **Case:** Barry looks at his barn façade county map, which shows a real barn at location X. He drives to location X, sees what looks exactly like a barn, and asserts: "That's a barn." Unbeknownst to Barry, the map is outdated and wrong about location X (it's actually a barn façade), but by sheer coincidence, there *is* a real barn (not depicted on the map) hidden just behind the façade he’s looking at. His assertion is true.
      *   **Question:** Is Barry’s true assertion improper *according to the distinctive rule of assertion*?
      *   **KN Prediction:** **Improper.** Barry has a justified true belief, but he does not *know* it's a barn (his belief is Gettiered). Assertion violates the knowledge rule.
      *   **TN Prediction:** **Proper.** Barry asserted a truth. The assertion therefore satisfies the distinctive rule. Criticism of Barry for his reliance on the faulty map concerns the epistemic irresponsibility of his *belief* or the luck involved, not the rule governing the *assertion* of the true proposition.

  *   **Crux 3: Reasonable Falsehood Under Pressure**
      *   **Case:** Chloe, a doctor in a chaotic emergency room, quickly examines a patient displaying classic symptoms of Condition A, a serious but treatable illness. Standard tests would take hours the patient doesn't have. Based on the symptoms and her experience, Chloe asserts to the treatment team: "It's Condition A, start treatment now!" It later turns out the patient had a rare mimic Condition B, which presents identically to A until it's too late. Chloe’s assertion was false. Her assessment was reasonable given the evidence, time pressure, and stakes.
      *   **Question:** Is Chloe’s false assertion improper *according to the distinctive rule of assertion*, despite being reasonable and blameless?
      *   **KN Prediction:** **Improper.** She asserted a falsehood and lacked knowledge. While blameless due to the circumstances, the assertion still violates the distinctive knowledge rule.
      *   **TN Prediction:** **Improper.** She asserted a falsehood. This violates the distinctive truth rule. Her blamelessness arises from the extenuating circumstances excusing the violation of this rule, not from the rule itself being inapplicable or unviolated. The core normative defect of falsity remains.

  *   **Crux 4: Moorean Paradoxical Assertion (True)**
      *   **Case:** David, who is generally reliable but currently suffering from a recognised and common cognitive illusion that makes him doubt his own reliable beliefs, assertively utters: "It is raining, but I don't believe it is raining." Unbeknownst to David, it *is* raining. (Assume the first conjunct is true; the second conjunct is false - he *does* believe it's raining, though he asserts he doesn't).
      *   **Question:** Is David’s assertion (of the true conjunct "it is raining" within the Moorean sentence) improper *according to the distinctive rule of assertion*?
      *   **KN Prediction:** **Improper.** David does not *know* the conjunction he asserted. More importantly, asserting a Moorean proposition is inherently improper because it violates a condition of knowledge or a presupposition thereof (e.g., believing what one asserts). The impropriety stems directly from the knowledge rule or its presuppositions.
      *   **TN Prediction:** **Proper (regarding the truth of 'it is raining').** The proposition asserted, taken as a whole, is *false* ("It is raining but I don't believe it is raining" is false because he *does* believe it). Its impropriety stems solely from its falsity. The specific Moorean *form* generates pragmatic incoherence or violates norms governing belief-expression/conversation, but not the distinctive truth rule itself. *If* one could assert only the true conjunct "it is raining" in a context where the Moorean absurdity was absent, the TN holds it would be proper *qua* assertion.

  **Conclusion:** This statement clarifies our shared ground and isolates our core disagreement regarding the distinctive rule of assertion (KN vs. TN). We commit to using these agreed claims and specified crux cases to focus future debate and empirical investigation aimed at resolving this central dispute in the epistemology of assertion.

