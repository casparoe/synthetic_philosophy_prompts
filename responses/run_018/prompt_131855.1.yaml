prompt: |-
  I'm a journalist who covers philosophy of science and conceptual design, and I'm preparing a pitch for a three-month independent research fellowship that funds conceptual—not empirical—work at the boundary of epistemology and institutional architecture. The idea I want developed into a formal proposal is this: the "wrong kind of reasons" problem is almost always treated as a first-order puzzle about individual practical motivation, but there may be a structurally parallel problem at the level of engineered epistemic systems. Specifically, I want to ask whether there are genuinely "wrong-kind reasons" for belief-revision in collective or algorithmic environments—such as peer-review ranking mechanisms or recommendation architectures—where incentives, status rewards, or design pressures influence which propositions get endorsed without altering the evidential structure that should govern them. The standard literature on right and wrong reasons for desire and action treats the distinction as essentially anchored to individual agents with practical identities, which leaves it entirely open whether the distinction can be reconstructed for system-level belief formation without collapsing into a purely instrumental evaluation of output accuracy. I need the proposal to state this question with precision—does the right/wrong-kind distinction apply to non-agentive belief-revision processes, and does maintaining it require a non-instrumental notion of epistemic value?—and to explain exactly why the existing positions in moral motivation and metaethics fail to settle it.

  The deliverable should be a two-page proposal document suitable for a foundation that funds philosophy, not a literature review. It should lay out a tractable three-month method: conceptual analysis of two or three concrete cases (for instance, whether citation-incentive structures in scientific publishing provide wrong-kind reasons for adopting a methodological stance, or whether alignment feedback in artificial reasoning systems corrupts belief-formation in a way that is structurally analogous to bribery in practical reasoning). The proposal should identify what a positive result looks like—say, a reconstructed distinction with conditions that apply to systems—and what a null result looks like—say, the demonstration that all system-level "reasons" are necessarily instrumental, dissolving the analogy. It must also include an honest scope assessment: why this is doable in three months without original empirical research, and what specific conceptual obstacle could still make the project fail. Please do not include a bibliography, citation list, or reading recommendations; I will supply references myself. Write in a polished, formal register appropriate for a grant application, and keep the framing original rather than rehearsing the classic Newcomb-style or moral-motivation setups that dominate the standard discussion.
