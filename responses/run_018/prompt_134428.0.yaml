  Kim's view, though, insists on physical causal closure: only N1/N2 are efficacious. M is either redundant or overdetermining. To save mental causation, Kim might embrace reduction (M just *is* N1 or N2 in context), but that erodes multiple realizability. The cost here is either losing genuine mental causation or accepting pervasive overdetermination.  

  The user also cares about downward causation without violating closure. The determinable model handles this better: M causes effects *through* its physical determinates, so closure holds while M has a causal role. Kim struggles here—downward causation either violates closure or becomes illusory.  

