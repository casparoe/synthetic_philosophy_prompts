  First, I need to unpack both frameworks clearly. Kim's exclusion argument hinges on causal closure and the threat of overdetermination. If every physical effect has a sufficient physical cause, mental properties either get excluded or we get systematic overdetermination. The determinable/determinate approach (like Yablo's) avoids this by treating mental properties as determinables of their physical determinates—so they're not competing causes but different "granularity levels" of the same cause.  

