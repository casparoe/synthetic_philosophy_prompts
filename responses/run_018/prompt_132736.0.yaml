          - Run patching experiments: patch the component's activation on a set of positive and negative inputs to the opposite value.
          - Check if the patching causes a change in at least one downstream component in the expected direction in >=90% of cases, and the change is statistically significant (p<0.01).
          - If yes: issue "representational".
          - If no: issue "non-representational".

     The procedure must be run in under two hours, so we assume that the data for Step1 is precomputed and the ablation and patching experiments are set up to run quickly (possibly on a subset of data).

     We note that the procedure is designed to be robust to the hard cases and to stakeholder resistance in case (iii) by following the checklist without deviation.

     Conclusion: The procedure cannot determine if the representation implies consciousness, moral patienthood, or beliefs because these are beyond the scope of the theory of representation used.
