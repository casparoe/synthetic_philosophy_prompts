  ### Neural Network Component Representational Audit Procedure

  #### **Philosophical Basis**
  This procedure operationalizes representational realism by testing three necessary conditions:
  1. **Misrepresentation Capability**: The component must be capable of *misrepresenting* (false positives/negatives), not just failing to activate.
  2. **Stable Functional Role**: The component must play a consistent causal role in the system's information processing.
  3. **Consumer Mechanism**: Downstream components must use the component's state to guide behavior (analogous to a "consumer" in biosemantics).

  Failure to satisfy any condition results in a "non-representational" verdict. Hard cases (i–iii) trigger mandatory human judgment flags.

  ---

  ### **Ordered Checklist Procedure**
  *(Runtime: ≤90 minutes; requires precomputed activation datasets, ablation tools, and counterfactual input generators)*

  ---

  #### **Step 1: Misrepresentation Test**  
  **Objective**: Verify the component can misrepresent the concept (not just correlate).  
  **Evidence to Collect**:  
  - Activations for 100+ inputs:  
    - 50+ *positive samples* (concept unambiguously present).  
    - 50+ *negative samples* (concept unambiguously absent).  
    - 20+ *adversarial samples* (inputs designed to induce errors, e.g., optical illusions).  
  - Use human-annotated ground truth for concept presence/absence.  

  **Threshold for Passing**:  
  - **False Positive**: ≥5% of negatives with activation ≥90th percentile of positives.  
  - **False Negative**: ≥5% of positives with activation ≤10th percentile of positives.  
  - *Pass if either threshold met*.  

  **Judgment**:  
  - ✅ **Pass**: Proceed to Step 2.  
  - ❌ **Fail**: Issue **mandatory "non-representational"** verdict.  
  - ⚠️ **Flag for Human Judgment**: If *0% misrepresentation* occurs despite perfect statistical correlation (hard case **i**).  

  ---

  #### **Step 2: Stable Functional Role Test**  
  **Objective**: Confirm consistent causal role across contexts.  
  **Evidence to Collect**:  
  - **Ablation Impact**: Measure performance change after ablating the component:  
    - On 5+ tasks *requiring the concept*.  
    - On 5+ tasks *independent of the concept*.  
  - **Activation Stability**: Compute cosine similarity of activation vectors for positive samples across 3+ distinct contexts (e.g., datasets, domains).  

  **Threshold for Passing**:  
  - **Ablation Specificity**: ≥15% performance drop on concept tasks AND ≤5% drop on independent tasks.  
  - **Activation Consistency**: Mean cosine similarity ≥0.75 across contexts.  
  - *Pass if both thresholds met*.  

  **Judgment**:  
  - ✅ **Pass**: Proceed to Step 3.  
  - ❌ **Fail**: Issue **mandatory "non-representational"** verdict.  
  - ⚠️ **Flag for Human Judgment**: If misrepresentation exists (*Step 1 pass*) but functional role is *unstable* (hard case **ii**).  

  ---

  #### **Step 3: Consumer Mechanism Test**  
  **Objective**: Verify downstream components use the component's state behaviorally.  
  **Evidence to Collect**:  
  - **Path Analysis**: Identify downstream layers receiving ≥90% of the component’s output connections.  
  - **Counterfactual Patching**: Patch the component’s activations on 50+ inputs:  
    - Force high activation on negatives.  
    - Force low activation on positives.  
  - Measure behavioral change in downstream layers (e.g., output logit shift).  

  **Threshold for Passing**:  
  - **Behavioral Alignment**: ≥80% of patched inputs induce downstream changes *consistent with misrepresentation* (e.g., high patching on negatives causes downstream "concept present" behavior).  
  - **Statistical Significance**: p-value <0.01 (t-test vs. baseline).  

  **Judgment**:  
  - ✅ **Pass**: Issue **mandatory "representational"** verdict (regardless of stakeholder objections; hard case **iii**).  
  - ❌ **Fail**: Issue **mandatory "non-representational"** verdict.  

  ---

  ### **Application to Hypothetical Cases**

  #### **Case 1: Vision-Model Curved-Edge Cluster**  
  - **Step 1**: Activates on curved edges (positives) *and* optical illusions (false positives). **Pass**.  
  - **Step 2**: Ablation degrades curve-detection tasks (↓22%) but not color tasks (↓2%). Cosine similarity = 0.82. **Pass**.  
  - **Step 3**: Patching illusions activates downstream shape detectors; forces misclassification. **Pass**.  
  - **Verdict**: **Representational** (genuine "curved edge" representation).  

  #### **Case 2: Language-Model Pronoun Gender Attention Head**  
  - **Step 1**: Activates on correct pronouns (positives) *and* ambiguous sentences (false positives). **Pass**.  
  - **Step 2**: Ablation degrades gender agreement tasks (↓18%) but not vocabulary tasks (↓3%). Cosine similarity = 0.68. **Flag for Human Judgment** (unstable role; hard case **ii**).  
  - **Analysis**: Functional role inconsistent—tracks *grammatical form* but not *semantic agreement*. Human judgment required.  

  #### **Case 3: Reasoning-Model Approximate Magnitude Circuit**  
  - **Step 1**: No misrepresentation found; perfect correlation with magnitude. **Flag for Human Judgment** (hard case **i**).  
  - **Analysis**: Fails Step 1 despite ablation stability. Human must adjudicate if "approximation" is a true representation or heuristic.  

  ---

  ### **Limits of the Procedure**  
  This audit **does not determine**:  
  1. **Consciousness**: Representation ≠ subjective experience.  
  2. **Moral Patienthood**: Functional role ≠ capacity for suffering.  
  3. **Belief Attribution**: Component-level representation ≠ system-level propositional attitudes.  

  **Why These Limits Are Inherent**:  
  - Representational realism (as defined) concerns *information-bearing states* within a functional architecture. It does not entail phenomenology, ethics, or cognitive holism.  
  - These boundaries arise from the theory itself: biosemantics separates *representation* from *consciousness*, and *functional role* from *moral status*.  

  ---

  ### **Procedure Summary**  
  | Step | Test | Pass Threshold | Fail Action | Flag Condition |  
  |------|------|----------------|-------------|----------------|  
  | 1 | Misrepresentation | ≥5% false positives/negatives | "Non-representational" | Perfect correlation with 0% errors (case **i**) |  
  | 2 | Stable Functional Role | Ablation specificity + cosine sim ≥0.75 | "Non-representational" | Misrepresentation present but unstable role (case **ii**) |  
  | 3 | Consumer Mechanism | ≥80% behavioral alignment | "Representational" (final) | N/A |  

  **Output**: Verdict ("representational"/"non-representational") or flagged case for human review.  
  **Auditor Notes**:  
  - Philosopher involvement required **only** at flagged judgments.  
  - Stakeholder resistance (case **iii**) overruled by Step 3 pass.  
  - Total runtime: 70–90 minutes with precomputed datasets.
