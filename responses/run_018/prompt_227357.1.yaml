  Okay, the user is asking about expected value fanaticism and wants me to stress-test it. They've outlined four areas to explore: intuitive cases, formal results, hostage commitments, and the meta-question about falsifiability. I need to approach this systematically.

  First, for intuitive cases, I should consider Pascal's Mugging scenarios where tiny probabilities of enormous payoffs dominate the calculation. Cases like giving up a guaranteed good life for a minuscule chance of astronomical utility. The fanatic would bite the bullet here, but that seems counterintuitive. Then there's the St. Petersburg paradox with infinite expected value, which forces irrational choices. The fanatic might try to dismiss these as unrealistic or redefine utility, but that feels like dodging the issue. Bullet-biting here might reveal the theory's extreme nature rather than defend it.

  Next, formal results. The Pasadena game is a problem because its expectation doesn't converge. Fanaticism can't handle undefined expectations, which limits its applicability. Infinitesimal probabilities or unbounded utilities also cause issues. If utilities are unbounded, fanaticism becomes hypersensitive to tail events, making any tiny probability dominate if the payoff is big enough. The fanatic might say this is just a boundary condition, but it's a big weakness.

  Hostage commitments involve the axiology paired with fanaticism. For example, in population ethics, fanaticism could justify huge sacrifices for a small chance of a massive future population. The problem might stem from total utilitarianism rather than fanaticism itself, but fanaticism amplifies those issues. Separating them might help, but the core problem of extreme risk-taking remains.

  The meta-question is about falsifiability. Since fanaticism is normative, it can't be falsified empirically. But counterintuitive implications could undermine it. Fanatics might argue that intuitions are unreliable or that the calculations are correct despite discomfort. However, if the view avoids any risk by redefining terms or ignoring problems, it becomes unfalsifiable and dogmatic. That's a major flaw because a good normative theory should be responsive to criticisms.

  The user might be developing a theory or exploring decision theory's limits. They could be concerned about real-world applications where fanaticism leads to reckless decisions. Their deeper need might be to understand if fanaticism can be defended or if it's fundamentally flawed. They might also want to see how it interacts with other philosophical issues like ethics or probability.

  I should rank the objections. Undefined expectations and unbounded utilities are critical because they break the math. Intuitive absurdities are strong but not fatal to a determined fanatic. Hostage commitments depend on the axiology. The meta-problem of unfalsifiability is serious because it makes the theory immune to criticism. Overall, fanaticism has significant weaknesses, especially in handling edge cases and avoiding dogmatism. The user needs a clear assessment of whether it holds up under scrutiny or if its defenses make it untestable.
answer: |-
  Below is a systematic stress-test of expected value (EV) fanaticism, organized per your requested structure. The analysis treats fanaticism as a *formal commitment* to maximizing EV wherever defined, regardless of probabilistic or axiological extremes. I identify where the view faces its greatest challenges, where it bites bullets, and where its defenses risk vacuity.

  ---

  ### **1. Intuitive Cases: The Bullets to Bite**
  Fanaticism faces brutal counterintuitive demands in extreme probability/utility trade-offs. Key cases:

  - **Pascal's Mugging (Base Version):**  
    A stranger says: *"Give me your life savings ($50k) for a 1-in-10^30 chance of 10^100 utils (e.g., galactic utopia)."* EV fanaticism demands compliance.  
    **Pressure:** Sacrifices a certainty (financial security) for a near-impossible gain.  
    **Fanatic response:** Bite the bullet. "Rationality requires accepting any positive-EV bet, however improbable. Human intuition is probability-blind."  
    **Cost:** Makes agents exploitable by absurd threats. Bullet-biting here admits that fanaticism overrides practical wisdom.

  - **St. Petersburg+ (Infinite EV):**  
    Modified St. Petersburg game offering ∞ EV (e.g., payouts grow as \(2^n / n^2\) for utility). Fanaticism demands paying any finite entry fee.  
    **Pressure:** Agents go bankrupt with probability ~1.  
    **Fanatic response:** "∞ > any finite cost. Surrender all wealth." Some re-describe utilities as bounded to avoid ∞, but this concedes fanaticism fails without *ad hoc* fixes.

  - **Certainty Sacrifice:**  
    *Choice:* (A) Guaranteed cure for your child's illness. (B) 1-in-10^20 chance to cure all disease in the universe. EV(B) > EV(A).  
    **Pressure:** Fanaticism requires abandoning a loved one's certain survival for cosmic stakes.  
    **Fanatic response:** "Sentiment is irrational. Maximizing EV is objectively right, even at catastrophic personal cost."  

  **Verdict:** Bullet-biting is a legitimate but costly defense. It admits fanaticism is *alienating*—it divorces rationality from human-scale reasoning. Re-description (e.g., "utilities can't be that large") quietly retreats from full fanaticism.

  ---

  ### **2. Formal Results: When the Math Breaks**
  Fanaticism assumes well-defined expectations. When they fail, the view lacks guidance:

  - **Pasadena Game (Non-Convergent Expectation):**  
    Payouts alternate in sign and magnitude (e.g., \((-1)^{n-1} \cdot 2^n / n\) utils on flip \(n\)). The series \(\sum p_i u_i\) converges conditionally but not absolutely—rearranging terms changes the sum.  
    **Problem:** EV is undefined. Fanaticism has no prescription.  
    **Fanatic response:** "Exclude such games from the domain." But this concedes fanaticism isn't universally applicable. Who decides which distributions are "valid"? Arbitrary restrictions risk question-begging.

  - **Unbounded Utilities:**  
    If utilities are unbounded (e.g., in some total utilitarian axiologies), *any* tiny probability of near-infinite value dominates all finite outcomes.  
    **Problem:** Fanaticism becomes hypersensitive to tail events. A \(10^{-100}\) chance of \(10^{200}\) utils outweighs guaranteed doom for Earth.  
    **Fanatic response:** "That's the correct result." But this invites *absurd sensitivity*—e.g., diverting all resources to mitigating fantastical risks (simulation shutdown, vacuum decay).

  - **Infinitesimal Probabilities:**  
    Assigning precise probabilities to complex, one-off events (e.g., "probability this button causes solipsistic singularity") is epistemically dubious.  
    **Problem:** Garbage-in-garbage-out EVs. Fanaticism may demand action based on speculative numbers.  
    **Fanatic response:** "Use your best probability estimate." But this collapses into subjective expected utility, losing fanaticism's "objective" force.

  **Verdict:** Formal limitations are **boundary defeaters**. Fanaticism is incomplete when expectations are undefined, and unworkable when utilities are unbounded. A defender must accept domain restrictions, weakening the "full stop" claim.

  ---

  ### **3. Hostage Commitments: Axiological Amplifiers**
  Fanaticism inherits and amplifies the problems of its underlying axiology:

  - **Population Ethics (Total Utilitarianism):**  
    A 0.0001% chance of creating \(10^{30}\) happy beings outweighs the certain survival of 10 billion current people. Sacrificing humanity for this lottery becomes obligatory.  
    **Pressure:** The "absurdity" here stems from totalism (more lives = always better), but fanaticism *magnifies* it by empowering extreme probabilities.  
    **Severing Companions:** Switching to average utilitarianism or person-affecting views defangs *this* example—EVs become finite. But fanaticism + bounded utility still faces Pascalian muggings.

  - **Value Asymmetry:**  
    If disutility is unbounded below (e.g., "hellish torture forever"), fanaticism demands paying any ransom to avoid negligible chances of eternal suffering, even if the threat is absurd.  
    **Core Issue:** Fanaticism *compounds* axiological extremism but isn't its sole source. The deeper trouble is fanaticism's *structural recklessness*: it forces maximal exposure to tail risks.

  **Verdict:** Some absurdities (e.g., population gambles) belong to the axiology. Others (e.g., paying cosmic mugs) are inherent to fanaticism. Severing companions relocates but doesn't eliminate the trouble—Pascalian pressures persist if utilities can be extreme.

  ---

  ### **4. The Meta-Question: Can Fanaticism Be Falsified?**
  As a normative theory, fanaticism evades empirical falsification but faces coherentist challenges. Candidate defeaters, ranked:

  1. **Fatal (if accepted):**  
     - **Undefined Expectations:** If many real choices resemble Pasadena-like games, fanaticism is silent where guidance is needed.  
     - **Unbounded Utility Constructions:** If a defensible axiology requires unbounded utilities (e.g., open-ended desire satisfaction), fanaticism mandates fanatical behavior.  

  2. **Severely Awkward:**  
     - **Exploitability:** Agents adhering to fanaticism are predictably bankrupted by mugs. A theory that enables domination is pragmatically self-defeating.  
     - **Clash with Dominance Reasoning:** If option A yields better outcomes than B in *every possible state*, but B has higher EV due to unreachable states, fanaticism violates statewise dominance.  

  3. **Conceded Costs (by sophisticated defenders):**  
     - The need for *ad hoc* bounds on utility/probability to avoid "∞ problems."  
     - Requiring agents to ignore catastrophic certainties for cosmic lotteries.  

  **Verdict on Risk-Free Fanaticism:**  
  Fanaticism can be "qualified into safety" by:  
  - Bounding utility functions (e.g., \(u(x) < U_{\text{max}}\)).  
  - Restricting to probabilities above a threshold (e.g., \(p > 10^{-100}\)).  
  - Excluding non-integrable random variables.  
  But this **transforms it into conservative expected utility theory**, gutting its fanatical essence. A "riskless" fanaticism is defective—it becomes a tautology ("maximize EV when EV is safely defined"), abandoning its bold claim to govern all decisions with defined expectations. The core tension remains: **Pure fanaticism risks absurdity; tamed fanaticism risks triviality.**

  ---

  ### **Final Synthesis**
  **Strengths of Fanaticism:** Formal simplicity, alignment with stochastic dominance in "nice" cases, immunity to probability-based squeamishness.  
  **Fatal Flaws:** Undefined expectations (Pasadena), unbounded utilities (hypersensitivity), and hostage-taking by extreme axiologies. Its most defensible form requires arbitrary bounds, conceding that pure fanaticism is untenable. **Bullet-biting is a valid but pyrrhic defense**—it upholds consistency at the cost of divorcing rationality from human interests. To avoid vacuity, fanaticism must retreat to a bounded domain, but this surrenders its revolutionary edge.  

  **Recommendation for Stress-Testers:** Target its handling of **non-integrability** and **epistemic access to tiny probabilities**. These expose fanaticism as either incomplete or epistemically reckless. A sophisticated proponent must either embrace absurdity or impose unmotivated limits.
