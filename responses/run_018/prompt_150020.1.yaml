answer: |-
  The smell of burnt toast and ozone hung thick in the Tick-Tock Tavern. Old Ben stirred lukewarm synth-caff with a finger, watching the condensation slide *down* the glass in a series of minute, jerky hops. Outside, the city pulsed – not with a flow, but with a billion tiny *clicks*. Reality, everyone knew, was a flipbook. Infinite stills. Zeno was right; the arrow *was* at rest in every single frame. It was just that consciousness, that slippery old seamstress, stitched the frames together into something that *felt* like motion.

  Ben used to map neural firing patterns back when biology was wet and messy. Now, retired, he pondered the stitches. And the hacks.

  "Edna! Double-tick the bacon this mornin', love! Nearly charred it last flick!" shouted Mick from behind the counter. Edna, perched on her stool, gave a curt nod. Her eyes went momentarily vacant, the world around her freezing mid-gesture – Mick’s spatula suspended, a fly hanging motionless in the greasy air, the drip from Ben’s glass paused halfway. One tick. Then Edna blinked, Mick flipped the bacon onto a plate that hadn't been there a flick before, and the fly zipped away. The bacon was perfect. Edna had simply… skipped the burning frame.

  Everyone did it. "Tick-jumping." Freezing your own perception for a single, universal instant. Kids did it to cheat at flick-ball, dodging the projectile in the frozen moment between frames. Delivery drones vanished from collision courses. Ben himself had used it just yesterday to avoid spilling his synth-caff when young Jax barrelled past him on a hover-skate – one frozen tick, and Jax was harmlessly beyond him, Ben's mug steady in his hand.

  It was utility. Convenience. Sometimes, less ethically, necessity. Old Mrs. Gable down the hall tick-jumped to avoid the tax collector’s gaze when he came to the door. Benny saw the flicker in her eyes, the unnatural stillness, then the collector walking away, shaking his head as if he’d forgotten why he was there. Groceries sometimes vanished from shelves between blinks. Small things. Mostly harmless. The fabric of society held, stitched together by the shared illusion of smooth time and the unspoken rules about *not* getting caught mid-jump.

  But Ben sat there, watching the jerky drip, and felt a coldness seep into his bones that had nothing to do with the synth-caff.

  His granddaughter, Lira, bustled in, her energy a rapid-fire series of sharp movements. "Grandpa! You look glitched. Bad synth?"

  He forced a smile. "Just thinking, sparkplug. About choices."

  Lira snorted, grabbing a nutrient-bar from behind the counter with a flicker so fast Ben almost missed it. Mick certainly did. "Choices? You pick synth or tea. You jump or you don't. What's to think about?" She tapped her temple. "It's all in the timing."

  *That was it.* The coldness crystallized. **Choice.**

  In a continuous reality, choice felt like a process. A weighing, a dawning intention, a *movement* towards action. But here? Reality was fundamentally static. Frozen frames. Consciousness experienced the sequence, but the *transition* between states? That was the stitch, the illusion. When you decided to tick-jump… *when* did you decide?

  Ben pictured it. Frame N: You see the falling vase. Frame N+1: You are frozen, the world static around you. Frame N+2: You are standing slightly to the left, vase shattered harmlessly where you *were*. Where was the "choice" to jump? It had to happen *within* a single, motionless frame. A static configuration of neurons firing in a frozen instant. No deliberation *across* time. Just… state A (seeing the vase fall) instantly replaced by state B (being frozen). Then state C (unfrozen, moved). The feeling of "I chose to jump" was just consciousness stitching state A to state C, inventing the narrative of agency *after the fact*.

  Like the arrow. Truly at rest in every frame. The movement was the story told by the sequence.

  If "choosing" to tick-jump to dodge a tax collector was just a static brain state in one frozen frame, indistinguishable in kind from the brain state of *not* jumping… where was the moral weight? Where was the *intent*? It was just a different arrangement of matter in a timeless instant. A different page in the flipbook.

  "Grandpa? You're doing the vacant stare thing. You okay?" Lira waved a hand in front of his face, her movements sharp, stop-motion blurs.

  He focused on her. Bright, impulsive Lira. He remembered last week, when Widow Henley’s prized sonic-blossom vanished from her balcony. A rare, expensive bloom. Lira had been there, admiring it. She’d seemed jumpy afterwards. And Ben, out of habit, had noticed the almost imperceptible flicker in her eyes right before Widow Henley turned her back. One frozen tick. Just long enough.

  He hadn’t said anything. Just a missing flower. But now?

  "Lira," he said, his voice rough. "That sonic-blossom. Widow Henley's."

  Her face, animated a moment before, went perfectly, unnaturally still. Not a tick-jump stillness. The stillness of being caught. Her eyes darted, a rapid series of micro-movements. "What about it?"

  Ben looked at her. Really looked. Not at a person making a bad choice across time, but at a pattern of matter arranged in this specific, static instant. A configuration that *was* the consequence of a million prior frozen frames, leading inevitably to *this* one. The feeling of accusation rising in him – was that just another static state? The urge to condemn, just another arrangement of firing neurons in *this* frozen now?

  If the arrow was truly at rest in every frame, then the thief was never *moving* towards the theft. The theft simply *was*, in one frame. The conscience, the guilt, the responsibility – were they just the story stitched together afterwards?

  The drip on his glass finally reached the puddle on the bar with a tiny, distinct *plink*. Another frame clicked over.

  "Nothing, sparkplug," Ben murmured, the cold certainty settling deep. "Just… wondering how anything ever really *happens*." He forced another smile, feeling the muscles move in discrete increments. "Pass the synth-sweet, would you?"

  Lira relaxed, the tension fleeing in a micro-jerk. She slid the dispenser over, its motion a series of tiny hops across the scarred countertop. Ben watched her hand, seeing not smooth motion, but a billion frozen arrows, forever at rest, forever pointing nowhere.
