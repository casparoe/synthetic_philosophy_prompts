  3. **Step 3: Adjust for Physical Risk**
     - Question: What is the probability that the project fails to deliver the intended benefits due to physical events (e.g., natural disaster, technological failure, etc.)? 
     - How: For each future benefit, multiply the benefit by (1 - probability of failure). The probability of failure might be constant or increase with time (if the project degrades). 
     - Judgment: This requires expert input (e.g., engineering reports) but the board member can use a provided estimate. If no estimate, use a default (e.g., 0.1% per year? but note that may be arbitrary). However, the procedure must be simple. We might ask for an overall risk factor for the project or for different time periods.
     - Sufficient answer: A single probability of failure over the relevant period, or a time-dependent function. If the board member cannot get this in 20 minutes, they use a conservative default (say 0.1% per year compounded) or the chair must decide whether to proceed without this adjustment (but that is not ideal). Alternatively, we might break it into:
       - For each major benefit period, ask: "Is there a known physical risk that would cause the benefit to not materialize? If yes, what is the estimated probability (as a percentage)?" 
       - If no data, the board member must flag this uncertainty and the chair must decide whether to proceed (judgment call).

  4. **Step 4: Adjust for Intergenerational Equity**
     - Question: Does the project shift costs or benefits between generations in a way that might be unfair? 
     - How: This is a value judgment. We might consider:
