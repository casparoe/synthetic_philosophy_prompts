          - Alternatively, we might use a simple rule: if the project imposes costs on the present and benefits on the distant future, we require that the undiscounted (for time) benefits are at least X times the costs (where X>1) to account for the possibility that the present generation is sacrificing for a richer future. But how to set X?
     - Given the complexity, we might instead make this a judgment call by the committee chair. 
