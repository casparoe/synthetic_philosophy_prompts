  **Case (c): Nuclear-waste containment retrofit (costs now, benefits beyond 200 years)**

  - Step 1: Costs now, benefits after 200 years.
  - Step 2: No time discounting -> benefits at face value.
  - Step 3: Physical risk: very long time. Assume 0.1% per year -> over 200 years: 1 - (0.999)^200 ≈ 18.1%. Adjust benefits by 0.819.
  - Step 4: Intergenerational equity: costs now, benefits 200 years later. Chair must sign off. This is a heavy burden on the present for a distant future. The chair might be reluctant (as noted, politically intolerable) but the procedure might recommend if net value is positive.
  - Step 5: Non-existence: 200 years -> annual 0.1% -> cumulative 1 - (0.999)^200 ≈ 18.1% (same as above). So adjust benefits by 0.819. Then total adjustment for risk and non-existence: 0.819 * 0.819 ≈ 0.671. (But note: physical risk and non-existence are independent? So we multiply: 0.819 * 0.819? Actually, no: Step 3 and Step 5 are separate. We did 0.819 for physical and 0.819 for non-existence -> 0.671 for both.)
  - Step 6: Adjusted benefit = Benefit * 0.671. Then Net Value = (0.671 * Benefit) - Cost.
  - If the benefit is large enough to exceed the cost, then the procedure recommends funding. But note: without discounting, even a modest annual benefit over a long period might be huge. However, in this case the benefit is concentrated at 200 years? Or ongoing? The problem says "almost entirely beyond 200 years". Let's assume a one-time benefit. Then the net value might be positive only if the benefit is more than about 1.5 times the cost. But if the benefit is enormous (e.g., preventing a catastrophe), then it might be positive.

  **Structural Misfires:**

