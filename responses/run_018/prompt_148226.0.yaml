  2. **Misfire 2: A project that imposes heavy costs on a very poor present generation for benefits to a very rich future generation**
     - Example: A poor country invests heavily in a project that will benefit the world in 200 years.
     - Procedure:
          - Step 4: The chair must approve the intergenerational equity. But the chair might not have the information or the mandate to judge the relative wealth of generations. Moreover, the procedure does not adjust the monetary value for the diminishing marginal utility of money. 
