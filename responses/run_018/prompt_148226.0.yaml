  We are constructing a decision procedure for evaluating long-term infrastructure projects that avoids pure time preference (i.e., not discounting future welfare merely because it occurs later). The procedure will account for other factors: physical risk (probability of failure), intergenerational equity (fairness across generations), and the possibility that beneficiaries might not exist (extinction or depopulation).

  The procedure is designed for non-economist board members and should take about 20 minutes per proposal. It is a step-by-step flowchart in words. The committee chair has clear sign-off authority.

  The steps:

  1. **Adjust for pure time preference**: We set the pure time discount rate to zero. This means we do not discount future benefits just because they are in the future. However, we must still account for other factors.

  2. **Adjust for physical risk**: This is the probability that the project fails or the benefits do not materialize due to physical events (e.g., natural disasters, structural failure). We account for this by reducing the expected benefits by the probability of failure.

  3. **Adjust for intergenerational equity**: We consider whether the project imposes unfair burdens or benefits across generations. This might require weighting benefits to future generations differently, but not due to time preference. Instead, we might adjust for diminishing marginal utility of consumption if future generations are richer (or poorer) than present ones. However, note that the procedure must be simple and quick.

  4. **Adjust for the possibility that beneficiaries will not exist**: We account for the risk that the future population (or a portion of it) might not exist (e.g., due to extinction, regional depopulation). This is done by reducing the expected benefits by the estimated probability of non-existence.

  Given the complexity and the need for simplicity, we design a flowchart that asks a series of questions.

  **Flowchart:**

  1. **Step 1: Project Definition**
     - Input: Project costs (timing and amounts), benefits (timing, amounts, and beneficiaries).
     - Output: A clear timeline of costs and benefits.

  2. **Step 2: Adjust for Pure Time Preference**
     - Question: Are we discounting future benefits solely because they occur in the future? 
     - Action: Do not apply any discount rate for pure time preference. Set that discount factor to 1 for all years.
