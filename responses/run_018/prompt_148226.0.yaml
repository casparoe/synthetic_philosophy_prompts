          - If the project's costs and benefits are within the same generation (say, within 30 years), skip.
          - Otherwise, the chair must explicitly approve the intergenerational transfer. The chair should consider: 
              - Is the burden on the present generation acceptable given the expected wealth of the present and future? 
              - Are we imposing a heavy cost on a poorer present generation for a richer future one? (But note: we don't know the future wealth.)
          - This step does not change the numbers but requires the chair to sign off on the equity aspect.

  5. **Step 5: Adjust for Non-Existence of Beneficiaries**
     - Question: What is the probability that the intended beneficiaries will not exist (e.g., due to extinction, depopulation, or migration) at the time the benefits are to be received?
     - How: Multiply the benefits by (1 - probability of non-existence). 
