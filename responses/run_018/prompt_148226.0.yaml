  **Bottom line:**
  The most important limitation of turning pure time preference into an institutional checklist is that it cannot automatically resolve complex value judgments about intergenerational equity and catastrophic risks, which require democratic deliberation beyond mechanical adjustments.
answer: |-
  ### Decision Procedure for Long-Term Infrastructure Projects  
  **Principle:** Pure time preference (discounting future welfare merely because it occurs later) is excluded. Adjustments are made only for:  
  - **Physical risk** (probability of failure)  
  - **Intergenerational equity** (fairness across generations)  
  - **Non-existence risk** (chance beneficiaries won’t exist)  

  **Procedure Flowchart (20-minute execution):**  
  1. **Input project costs and benefits:**  
     - *Question:* What are the costs (timing/amount) and benefits (timing/amount/beneficiaries)?  
     - *Sufficient answer:* Quantified estimates in real (inflation-adjusted) dollars. Proceed if complete. Halt if incomplete (return to staff).  

  2. **Adjust for pure time preference:**  
     - *Action:* Set all future costs/benefits to present-value equivalents using a **0% pure discount rate**.  
     - *Note:* Mechanical step—no judgment.  

  3. **Adjust for physical risk:**  
     - *Question:* What is the annual probability of project failure (e.g., collapse, leakage, obsolescence)?  
     - *Sufficient answer:* An annual probability (e.g., 0.1% per year) from engineering/science reports.  
     - *Action:* Reduce benefits by cumulative risk:  
       \[ \text{Adjusted Benefit} = \text{Benefit} \times (1 - \text{Annual Failure Probability})^{\text{Years}} \]  
     - *Judgment call:* If no data exists, committee chair chooses a conservative default (e.g., 0.2% per year) or halts for expert input.  

  4. **Adjust for non-existence risk:**  
     - *Question:* What is the annual probability beneficiaries won’t exist (e.g., extinction, migration)?  
     - *Sufficient answer:* An annual probability (e.g., 0.05% per year) from demography/science sources.  
     - *Action:* Reduce benefits by cumulative risk:  
       \[ \text{Adjusted Benefit} = \text{Benefit} \times (1 - \text{Annual Non-Existence Probability})^{\text{Years}} \]  
     - *Judgment call:* If no data, chair uses a default (e.g., 0.1% per year) or halts for analysis.  

  5. **Assess intergenerational equity:**  
     - *Question:* Does the project impose net costs on poorer generations to benefit richer ones?  
     - *Action:* Chair evaluates qualitatively:  
       - If costs burden a poorer present and benefits aid a richer distant future, chair may apply an **equity multiplier** (e.g., benefits reduced by 10–50%) based on fairness grounds.  
       - If costs/benefits are generationally neutral, skip.  
     - *Judgment call:* Entirely chair’s discretion. No mechanical rule.  

  6. **Calculate net value:**  
     - *Action:* Sum adjusted benefits minus costs (all in present-value equivalents).  
     \[ \text{Net Value} = \sum (\text{Adjusted Benefits}) - \sum (\text{Costs}) \]  
     - *Note:* Mechanical step.  

  7. **Recommendation:**  
     - If Net Value ≥ 0: **Approve**.  
     - If Net Value < 0: **Reject**.  
     - *Exception:* Chair may override based on equity (Step 5) or risk uncertainty (Steps 3–4).  

  **Authority:** Committee chair signs off at judgment steps (Steps 3, 4, 5) and final override.  

  ---  
  ### Application to Cases  
  **Case (a): Seawall (benefits in 30 years)**  
  1. **Input:** Costs: $10M today. Benefits: $50M in 30 years.  
  2. **Pure time preference:** $50M benefit = $50M present value (0% discount).  
  3. **Physical risk:** Annual failure probability = 0.1%.  
     - Adjusted benefit = $50M × (0.999)³⁰ ≈ $48.5M.  
  4. **Non-existence risk:** Negligible (30 years). Adjusted benefit = $48.5M.  
  5. **Intergenerational equity:** Same generation (within 30 years). No adjustment.  
  6. **Net value:** $48.5M - $10M = $38.5M ≥ 0 → **Approve**.  
     - *Judgment override?* None.  

  **Case (b): Carbon Storage (benefits in 120 years, maintenance costs)**  
  1. **Input:** Costs: $5M today + $0.1M/year maintenance for 120 years. Benefits: $100M in 120 years.  
  2. **Pure time preference:** Costs = $5M + ($0.1M × 120) = $17M; Benefits = $100M.  
  3. **Physical risk:** Annual failure probability = 0.2%.  
     - Adjusted benefit = $100M × (0.998)¹²⁰ ≈ $78.6M.  
  4. **Non-existence risk:** Annual probability = 0.1%.  
     - Adjusted benefit = $78.6M × (0.999)¹²⁰ ≈ $69.8M.  
  5. **Intergenerational equity:** Costs burden early generations; benefits aid richer distant future. Chair applies 20% equity multiplier → Final benefit = $69.8M × 0.8 = $55.8M.  
  6. **Net value:** $55.8M - $17M = $38.8M ≥ 0 → **Approve**.  
     - *Judgment override?* Chair’s equity multiplier (Step 5) is critical.  

  **Case (c): Nuclear Waste Containment (benefits beyond 200 years)**  
  1. **Input:** Costs: $50M today. Benefits: $1,000M in 200 years.  
  2. **Pure time preference:** Benefits = $1,000M.  
  3. **Physical risk:** Annual failure probability = 0.05%.  
     - Adjusted benefit = $1,000M × (0.9995)²⁰⁰ ≈ $904M.  
  4. **Non-existence risk:** Annual probability = 0.15%.  
     - Adjusted benefit = $904M × (0.9985)²⁰⁰ ≈ $670M.  
  5. **Intergenerational equity:** Heavy cost on poor present; benefits to rich future. Chair applies 50% equity multiplier → Final benefit = $670M × 0.5 = $335M.  
  6. **Net value:** $335M - $50M = $285M ≥ 0 → **Approve**.  
     - *Judgment override?* Chair may reject despite positive net value due to political intolerance (not procedural).  

  ---  
  ### Structural Misfires  
  1. **Misfire 1: Catastrophic Risk Underweighted**  
     - *Scenario:* A $1M project prevents a 1% chance of a $50B catastrophe in 300 years.  
     - *Mechanical outcome:* Adjusted benefit = $50B × (0.999)³⁰⁰ × (0.999)³⁰⁰ ≈ $0 (after physical/non-existence risks). Net value < 0 → **Reject**.  
     - *Moral intuition:* Society may favor "insurance" against existential threats.  
     - *Indictment:* **Institutional translation** (expected value underestimates tail risks). Not the principle.  

  2. **Misfire 2: Intergenerational Exploitation**  
     - *Scenario:* A project costs a poor generation $1M today to benefit a rich generation $2M in 100 years.  
     - *Mechanical outcome:* With low risks, net value = $2M - $1M = $1M ≥ 0 → **Approve**.  
     - *Moral intuition:* Unfair to burden the poor for trivial gain to the rich.  
     - *Indictment:* **Institutional translation** (equity multiplier in Step 5 is arbitrary; procedure lacks utility calibration). Not the principle.  

  ---  
  ### Judgment vs. Mechanics  
  - **Genuine tests (mechanical):** Steps 2 (0% discount), 6 (net value math).  
  - **Judgment calls (disguised as boxes):**  
    - Step 3 (physical risk): Defaults mask uncertainty.  
    - Step 4 (non-existence risk): Arbitrary annual probabilities.  
    - Step 5 (equity): Chair’s bias influences outcomes.  

  Bottom line: **The checklist cannot resolve value conflicts about intergenerational fairness, relying on chair discretion where society may demand democratic deliberation.**
