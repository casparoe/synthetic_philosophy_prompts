              - Similarly, if costs are at time t, we might adjust them by the risk that they are wasted? But that is already captured by the benefit risk? Alternatively, we leave costs as fixed because they are contractual? This is tricky.

     To simplify, we assume:
          - Costs: We do not adjust for physical risk (because if the project fails, we still incur the costs). But we might adjust for the risk that the project is abandoned? That would avoid future costs. We ignore this complexity for now.
          - Benefits: Adjusted as above.

     - Then, we compute the net value: Sum over time of (Adjusted Benefits - Costs) without discounting for time. But note: without discounting, a dollar in 200 years is the same as a dollar today? That might lead to very large numbers. However, we are avoiding pure time preference.

     Alternatively, we might express everything in present dollars without discounting? Actually, without discounting, we are summing nominal dollars across time? That doesn't account for inflation. We should use real dollars (inflation-adjusted). The procedure should assume that all figures are in real terms (constant dollars).

     - So: Net Value = Sum_{t} [ (Adjusted Benefits_t) - Costs_t ]

