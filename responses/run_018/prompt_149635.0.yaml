prompt: |-
  I've been arguing with my sister, who works in ecological restoration, about which living things we owe direct moral consideration to. Over the years her gut judgments have been: it's clearly wrong to hurt a dog or an injured crow; keeping an octopus in a small tank is cruel because they solve problems and seem stressed; it was okay when I sprayed thousands of aphids off my plants, and okay to swat a mosquito biting me; but she also said I should step around a beetle on the sidewalk rather than crush it, just in case; and she's uneasy about farming billions of crickets for protein, though she can't articulate why and still eats them. Now there's a city proposal to build a thousand vertical farms, each holding about a billion very short-lived aquatic larvae that live only one day, to make protein powder. Biologists estimate roughly a one-in-ten chance each larva has some minimal, brief subjective experience—nothing like a mammal, but not zero. The project would replace much conventional chicken farming. Given her track record, what should she say about this proposal? Identify the two most plausible rules that could make sense of her earlier verdicts—perhaps one about direct versus systemic harm, and one about multiplying low probabilities across vast numbers—and say what each predicts here. Which past case is the closest analog? Give your best guess at her actual verdict with reasons, and be honest about whether her precedents genuinely underdetermine it. If they do, state what principle she would be adopting with each choice. Finally, name one further case that would actually tell the two rules apart.
reasoning: |-
  Hmm, the user is describing an ethical debate they've been having with their sister who works in ecological restoration. The sister has inconsistent-seeming moral intuitions about different organisms: strong protection for dogs and crows, concern for octopuses, indifference to aphids and mosquitoes, caution about beetles, and unease about cricket farming. Now there's a proposal for massive vertical farms growing short-lived aquatic larvae with a low probability of minimal subjective experience, which would replace chicken farming.

  I need to identify two plausible ethical rules that could explain her pattern of judgments. The first rule seems to be about direct versus systemic harm - she objects to deliberate, direct harm to complex beings (like hurting a dog or confining an octopus) but accepts harm that's indirect or systemic (like spraying aphids or systemic impacts of farming). The second rule involves probability-weighted aggregation - where even very small probabilities of suffering matter when multiplied across enormous numbers, explaining her caution about beetles ("just in case") and unease about cricket farming.

  For the larval farm proposal, Rule 1 would likely approve it because the harm is systemic rather than direct, and the beings have minimal (if any) subjective experience. Rule 2 would oppose it due to the massive scale amplifying the small probabilities of suffering. The closest analog is her cricket farming unease - similar scale and uncertainty, but larvae have even lower probability of sentience.

  Her precedents genuinely underdetermine this case. If she approves, she'd be prioritizing Rule 1 (direct harm focus). If she opposes, she'd be prioritizing Rule 2 (probability-weighted aggregation). To resolve this, we'd need a test case like a hypothetical about spraying trillions of barely-sentient microbes where Rule 1 would approve but Rule 2 would oppose.
answer: |-
  Based on your sister's track record, two plausible ethical rules emerge that could explain her pattern of judgments. Her verdict on the larval farm proposal would likely hinge on which rule she prioritizes, and her precedents genuinely underdetermine the outcome, forcing her to make a deeper philosophical choice.

  ### The Two Plausible Rules
  1. **Direct Harm Minimization Rule**:  
     Moral consideration requires *directly observable capacity for suffering* in *individual interactions*. Harm is permissible when:  
     - The victim lacks clear behavioral signs of distress (aphids, mosquitoes)  
     - OR the harm is indirect/systemic rather than deliberate/intimate (stepping on a beetle vs. swatting a mosquito)  
     - BUT caution applies when capacity is uncertain (stepping around beetles "just in case").  

  2. **Probability-Weighted Aggregation Rule**:  
     Moral consideration scales with:  
     - The *probability* of sentience/subjective experience  
     - Multiplied by the *intensity/duration* of potential suffering  
     - Multiplied by the *number* of affected beings.  
     This explains unease about cricket farming: low individual stakes × vast numbers = non-negligible moral weight.

  ### Predictions for the Larval Farm Proposal
  - **Rule 1 Prediction**: Approve the project  
    Why: Larvae show no observable complex behaviors (unlike octopuses/dogs). Harm is systemic (like aphids), not deliberate cruelty. The 10% sentience chance is too speculative to override practical benefits (replacing chicken farming).  
  - **Rule 2 Prediction**: Oppose the project  
    Why: 10% sentience chance × 1 day suffering × 1 trillion larvae/day = massive *expected suffering*. Even minimal experience aggregated across numbers dwarfs chicken farming impacts (fewer individuals, quicker deaths).

  ### Closest Past Analog: Cricket Farming  
  The cricket case is the strongest parallel—both involve:  
  - Farming invertebrates at scale for protein  
  - Uncertainty about minimal sentience  
  - Systemic rather than "personal" harm  
  Her unease with crickets (*despite eating them*) suggests Rule 2 is latent in her intuitions, but her actions align with Rule 1.

  ### Best Guess at Her Verdict & Reasons  
  She will **oppose the larval farms**, citing:  
  1. **The "just in case" precedent**: Like beetles, the 10% sentience chance—however small—demands precaution at scale.  
  2. **Scale amplifies uncertainty**: "A billion larvae with *any* subjective experience, even fleeting, feels wrong when multiplied."  
  3. **Systemic harm threshold**: Cricket farming already troubled her; this is orders of magnitude larger and more uncertain.  

  However, her precedents **genuinely underdetermine this case**. If she:  
  - **Approves**, she adopts: *"Only direct, observable suffering in complex beings demands restraint; systemic/uncertain harms are permissible for human benefit."*  
  - **Opposes**, she adopts: *"Minimal probabilities of suffering must be aggregated across populations, imposing limits on large-scale exploitation."*  

  ### Test Case to Distinguish the Rules  
  **Spraying trillions of barely sentient agricultural pests (e.g., genetically modified aphids with 0.1% chance of 1-second distress) to prevent famine:**  
  - **Rule 1**: Approves – harm is indirect, no observable suffering, survival necessity.  
  - **Rule 2**: Opposes – 0.1% × 1 trillion × 1 second = significant expected suffering; alternatives must be sought.  

  Your sister's conflict mirrors ethics debates in restoration ecology (e.g., "Should we eradicate invasive snails if they *might* feel pain?"). Her larval farm verdict will reveal whether her moral caution scales with uncertainty and numbers—or remains anchored to individual, observable suffering. If she opposes, expect her to revisit cricket consumption.
