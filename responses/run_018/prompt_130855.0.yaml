answer: |-
  Below is a reusable evaluation procedure for manuscripts asserting mental-state causation, designed for reviewers with scientific literacy but no specialized metaphysics training. It operationalizes Kim's causal exclusion argument and key non-reductive responses (supervenience without reduction, non-strict mental laws, Woodward's interventionist test). The procedure uses diagnostic questions to identify whether mental causation claims are redundant, avoid exclusion, or require specialist input. Rules are mechanical where possible; judgment calls are explicitly flagged. Each step includes:  
  - **Sufficient answer**: Criteria to proceed.  
  - **Stopping points**: Verdicts for redundancy, avoided exclusion, or specialist referral.  
  - **Conceptual flags**: Where metaphysics supersedes empirics.  

  ---

  ### **Evaluation Procedure Flow**  
  *Time: ~30 minutes per manuscript*  

  #### **Step 1: Identify the Mental-Physical Covariation**  
  **Question**: Does the manuscript explicitly state or imply that the mental property (M) covaries with a physical property (P)?  
  - **Sufficient answer**: M and P are clearly defined (e.g., "anxiety" covaries with "amygdala activation").  
  - **Stopping point**: If **no**, stop and flag for specialist (dualist claims or undefined supervenience base).  
  - **Judgment call**: None. Proceed mechanically if answer is yes.  

  #### **Step 2: Test for Explicit Reduction**  
  **Question**: Does the manuscript reduce M to P (e.g., "anxiety *is* amygdala activation")?  
  - **Sufficient answer**: Language implying identity (e.g., "M is nothing but P," operational definitions equating M and P).  
  - **Stopping point**: If **yes**, stop with verdict: **mental causation claim is redundant** (M is epiphenomenal; P does all work).  
  - **Judgment call**: Interpreting "reductive language" may require minor judgment (e.g., distinguishing descriptive labels from ontological claims).  

  #### **Step 3: Assess Causal Sufficiency of P**  
  **Question**: Does the manuscript demonstrate that P is causally sufficient for the outcome (E) without M?  
  - **Sufficient answer**: Evidence that P alone predicts/produces E (e.g., P → E correlation persists when M is absent/controlled).  
  - **Stopping point**: If **yes** and M adds no value, stop with verdict: **mental causation claim is redundant** (Kim’s exclusion applies).  
  - **Conceptual flag**: If P’s sufficiency is assumed but not tested, flag for specialist (metaphysical assumptions about closure).  
  - **Proceed**: If **no** (or unclear), go to Step 4.  

  #### **Step 4: Evaluate Non-Reductive Responses**  
  *Sub-steps 4a–c test strategies to avoid exclusion. Any "yes" may support M’s causal relevance.*  

  **Step 4a: Supervenience Without Reduction**  
  **Question**: Does the manuscript argue M supervenes on P but is not identical, and M has distinct causal powers?  
  - **Sufficient answer**: Claims that M is "realized by" but "autonomous from" P, with evidence (e.g., multiple realizability).  
  - **Judgment call**: Distinguishing legitimate supervenience from covert reduction requires minor judgment.  

  **Step 4b: Non-Strict Mental Laws**  
  **Question**: Does the manuscript invoke ceteris paribus laws (e.g., "M tends to cause E, barring interference")?  
  - **Sufficient answer**: Evidence of M → E generalizations that hold probabilistically/contextually (e.g., M predicts E better than P alone).  
  - **Conceptual flag**: If laws are purely philosophical (e.g., "mental causation is primitive"), flag for specialist.  

  **Step 4c: Woodward Interventionist Test**  
  **Question**: Does the manuscript provide evidence that intervening on M changes E while holding P fixed?  
  - **Sufficient answer**: Experimental/interventional data (e.g., manipulating M without altering P, and observing E change).  
  - **Stopping point**: If **yes**, stop with verdict: **exclusion avoided** (M is causally relevant per Woodward).  
  - **Judgment call**: Assessing whether P is "held fixed" (e.g., via controls) is empirical; no metaphysics needed.  

  #### **Step 5: Final Verdict**  
  - If **all sub-steps (4a–c) are negative/unaddressed**: Stop with verdict: **mental causation claim is redundant**.  
  - If **any sub-step (4a–c) is affirmative but inconclusive**: Flag for specialist (metaphysical commitments needed).  

  ---

  ### **Worked Applications**  

  #### **Case 1: Conscious Intention and Motor-Cortex Dynamics**  
  *Manuscript claim*: Conscious intention (M) causes novel motor-cortex dynamics (E) not reducible to prior neural states (P).  

  **Step 1: Identify covariation**  
  - Sufficient answer: Yes. M = conscious intention; P = prior neural states; E = motor-cortex dynamics.  
  - Proceed.  

  **Step 2: Test for explicit reduction**  
  - Sufficient answer: No. Manuscript denies reduction (M is "novel" and not reconstructible from P).  
  - Proceed.  

  **Step 3: Assess causal sufficiency of P**  
  - Sufficient answer: **No**. Manuscript argues P is *insufficient* for E (prior states alone cannot explain dynamics).  
  - Proceed to Step 4.  

  **Step 4a: Supervenience without reduction**  
  - Sufficient answer: Yes. Manuscript claims M supervenes on *current* neural states (not prior P) but is distinct.  
  - Judgment: Supervenience is asserted, but causal powers are unproven.  

  **Step 4b: Non-strict mental laws**  
  - Sufficient answer: Yes. Manuscript implies a ceteris paribus law (e.g., "intention *typically* alters motor pathways").  
  - Evidence: Neural data showing variability in E unexplained by P.  

  **Step 4c: Woodward interventionist test**  
  - Sufficient answer: **No**. No experiment intervenes on intention (e.g., via instruction) while controlling *current* neural states.  

  **Final verdict**: **Flag for specialist**.  
  - **Feature doing the work**: Step 4b (non-strict laws) creates ambiguity; M’s irreducibility to *prior* P avoids Step 3 exclusion, but fails Step 4c.  
  - **Defender’s attack**: Argue that intervention on M is impossible without changing neural states (questioning Woodward’s feasibility).  
  - **What the procedure cannot settle**: Whether supervenience on *current* neural states excludes M. Requires commitment to emergence or non-reductive physicalism.  

  ---

  #### **Case 2: Anxiety-Driven Avoidance and Amygdala Activation**  
  *Manuscript claim*: "Anxiety-driven" avoidance behavior (E) is solely caused by amygdala activation (P), with "anxiety" as a descriptive label.  

  **Step 1: Identify covariation**  
  - Sufficient answer: Yes. M = anxiety; P = amygdala activation; E = avoidance behavior.  
  - Proceed.  

  **Step 2: Test for explicit reduction**  
  - Sufficient answer: **Yes**. Manuscript uses "anxiety" *only* as a label for P (e.g., "anxiety refers to amygdala activation").  
  - Stopping point: **Mental causation claim is redundant**.  
  - Verdict: Manuscript reduces M to P; anxiety is epiphenomenal.  

  **Feature doing the work**: Step 2 (explicit reduction) stops evaluation early.  
  **Defender’s attack**: Claim "anxiety" is heuristic, not causal. But if title/claims imply causation, reduction invalidates M.  
  **What the procedure cannot settle**: Nothing—reduction is empirically verifiable.  

  ---

  ### **Key Limitations of the Procedure**  
  1. **Metaphysical commitments**: Cannot resolve disputes requiring non-reductive physicalism (e.g., M’s autonomy) or emergentism.  
  2. **Interventionist feasibility**: Assumes M can be manipulated independently (may not hold for qualia-like states).  
  3. **Ceteris paribus laws**: Relies on contextual evidence; probabilistic causation may be misinterpreted.  
  4. **Supervenience base**: If P is poorly defined (e.g., "neural activity"), exclusion may be misapplied.  

  This procedure isolates empirically testable elements of exclusion arguments while outsourcing irreducibly metaphysical issues to specialists.
