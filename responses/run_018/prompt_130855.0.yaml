        - If no → mental causal claim is redundant (stop).
  6. **If the manuscript does not provide evidence for 5a or 5b, but argues conceptually**: Flag that the manuscript does not address exclusion and the claim is unsupported. This is a judgment call: without evidence, we cannot accept the mental causation claim.

