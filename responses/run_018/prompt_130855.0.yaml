prompt: |-
  I serve on the review board of a journal that publishes empirical work at the intersection of cognitive neuroscience and philosophy of mind, and we repeatedly receive manuscripts asserting mental-state causation—claims that belief, attention, or anxiety cause neural or behavioral outcomes—without addressing whether those mental properties are already causally excluded by the physical properties with which they covary. I need a reusable evaluation procedure I can run in about thirty minutes per submission, designed for a reviewer with solid scientific literacy but no specialist training in metaphysics. The procedure should operationalize Kim’s causal exclusion argument together with the principal non-reductive responses—supervenience without reduction, the possibility of non-strict mental laws, and the Woodward-style interventionist test for causal relevance—while being explicit about where mechanical rules end and a judgment call begins. Structure it as an ordered flow of diagnostic questions: for each step, specify what counts as a sufficient answer, where a negative answer stops the evaluation with a verdict that the mental causal claim is redundant, where it stops with a verdict that exclusion is avoided, and where the issue is conceptual rather than empirical and must be flagged for a specialist. Include two worked applications to hypothetical submissions: first, a study arguing that conscious intention introduces a novel causal pathway in motor-cortex dynamics that cannot be reconstructed from prior neural states alone; second, a study that attributes anxiety-driven avoidance behavior solely to amygdala activation, using “anxiety” only as a descriptive label for the neural pattern. For each case, run the full procedure, identify the feature doing the work, note how a defender of mental causation could attack the evaluation, and state clearly what the procedure cannot settle without further metaphysical commitment.
reasoning: |-
  We are designing a reusable evaluation procedure for reviewing manuscripts that assert mental-state causation without addressing the causal exclusion problem. The procedure is based on Kim's causal exclusion argument and incorporates key non-reductive responses. It is structured as a flow of diagnostic questions.

  The goal is to determine whether the mental causal claim in the manuscript is redundant (because the physical properties already do the causal work) or whether the claim avoids exclusion (thus being potentially valid). We also need to flag when the issue becomes conceptual and requires a specialist.

  We will use the following key concepts:
  1. **Kim's causal exclusion argument**: If a mental property M supervenes on a physical property P, and P is causally sufficient for an effect E, then M is causally redundant for E (unless M is identical to P, which would be reductionism).
  2. **Supervenience without reduction**: Mental properties supervene on physical properties but are not reducible to them. However, this leaves the problem of causal exclusion.
  3. **Non-strict mental laws**: Mental causation might operate via non-strict (ceteris paribus) laws, which might allow for mental causation without being reducible to physical laws.
  4. **Interventionist account of causation (Woodward)**: A variable X is causally relevant to Y if there is an intervention on X that changes Y (while holding fixed other variables appropriately).

  The evaluation procedure will consist of the following steps:

  **Step 1: Identify the mental cause (M) and the effect (E)**
     - What are the specific mental properties (e.g., belief, attention, anxiety) and the specific neural/behavioral outcomes?
     - *Sufficient answer*: Clear specification of M and E.
     - If the manuscript does not specify M and E, stop and request clarification.

  **Step 2: Identify the physical base (P) for M**
     - What physical properties (neural, physiological, etc.) does the manuscript associate with M? If not explicitly stated, can we infer a plausible physical base from the context?
     - *Sufficient answer*: A description of the physical properties that are correlated with or form the basis for M.
     - If no physical base is identifiable, stop and note that the manuscript is either dualistic (which may be outside the scope of physicalism) or needs to specify the physical basis. Flag for specialist if dualism is claimed.

  **Step 3: Check for explicit reduction**
     - Does the manuscript explicitly reduce M to P (i.e., identify M with P)? If yes, then M is not a distinct cause; it is P. Thus, the mental causal claim is redundant because it is the physical property that is doing the work.
     - *Sufficient answer*: The manuscript states that M is identical to P (or uses language that implies identity).
     - If reduction is explicit, stop: the mental causal claim is redundant. The manuscript should instead refer to the physical cause.

  **Step 4: Check for causal exclusion via supervenience**
     - Assuming no reduction, does the manuscript provide evidence that P is causally sufficient for E? (i.e., does the physical base P, by itself, account for E?) If yes, then by Kim's argument, M is excluded unless the manuscript provides a reason why M is not excluded.
     - *Sufficient answer*: The manuscript shows that when P occurs, E follows, and when P is absent (and no other sufficient cause is present), E does not occur.
     - If the manuscript does not address the sufficiency of P for E, then we cannot conclude exclusion at this step. Proceed to Step 5.

  **Step 5: Evaluate non-reductive responses**
     We consider two non-reductive strategies:

     **Step 5a: Non-strict laws**
        - Does the manuscript provide evidence that M causes E via a non-strict (ceteris paribus) law? That is, does it show that M has causal powers that are not fully captured by the physical base P? For example, does the manuscript show that variations in M (that are not reducible to variations in P) lead to variations in E?
        - *Sufficient answer*: Evidence that M has a causal effect on E that is not mediated solely by the physical base P (or that the same P can give rise to different M's which then cause different E's). However, note that without a clear account of how M can vary independently of P, this might be hard to establish.
        - If such evidence is provided, then exclusion is avoided? Not necessarily: we must still check if the mental property is doing any independent work.

     **Step 5b: Interventionist test**
        - Using Woodward's interventionist account: Does the manuscript provide evidence that an intervention on M (while holding fixed the physical base P) would change E? If yes, then M is causally relevant to E independently of P.
        - *Sufficient answer*: The manuscript either (a) describes an experiment that manipulates M without changing P (or while controlling for P) and shows an effect on E, or (b) argues for the possibility of such an intervention (with supporting evidence).
        - If such evidence is provided, then M is not excluded: it has independent causal relevance.

     If neither 5a nor 5b is satisfied, then the mental causal claim is redundant because the physical base P is doing all the causal work.

  **Step 6: Judgment call**
     - If the manuscript does not provide direct evidence for Step 5a or 5b but argues for the causal role of M in a way that does not reduce to P, then we must make a judgment call. However, without evidence, it is hard to justify. We might flag that the manuscript fails to address the exclusion problem and that the mental causal claim is unsupported.

  **Summary of stopping points:**
     - If at Step 3: reduction is explicit → mental causal claim is redundant.
     - If at Step 4: P is causally sufficient for E and the manuscript does not provide a non-reductive response → mental causal claim is redundant (exclusion holds).
     - If at Step 5b: interventionist evidence is provided → exclusion avoided.
     - If at Step 5a: non-strict laws are invoked with evidence → exclusion might be avoided, but note that this is more controversial and may require further argument. We might still be concerned about the lack of independent variation.

  **Flagging for specialist:**
     - When the manuscript explicitly endorses dualism (no physical base for M) or when the manuscript invokes complex metaphysical arguments (e.g., emergentism, downward causation) that are not empirically testable in the study.

  Now, we apply the procedure to two hypothetical submissions.

  **Case 1:**
  *Study arguing that conscious intention introduces a novel causal pathway in motor-cortex dynamics that cannot be reconstructed from prior neural states alone.*

  **Step 1:**
     - M: conscious intention
     - E: motor-cortex dynamics (specifically, a pattern that leads to action)

  **Step 2:**
     - P: prior neural states (as per the manuscript, the intention is supposed to be not reconstructible from prior neural states alone). The physical base might be a specific neural pattern that is temporally co-occurring with the conscious intention.

  **Step 3:**
     - The manuscript does not reduce M to P because it claims that the intention is not reconstructible from prior neural states. So, no explicit reduction.

  **Step 4:**
     - The manuscript argues that prior neural states alone are not sufficient for the motor-cortex dynamics (E). They claim that without the conscious intention (M), the same prior neural states would not lead to the same E. Therefore, P (the prior neural states) is not causally sufficient for E. So, we cannot conclude exclusion at this step.

  **Step 5:**
     - **Step 5a (non-strict laws)**: The manuscript claims that conscious intention introduces a novel causal pathway. This sounds like they are invoking a non-strict law: that the presence of conscious intention causes E in a way that is not captured by prior neural states. However, the key is whether they show that variations in conscious intention (without corresponding variations in the physical base) lead to variations in E. The physical base for conscious intention might be the concurrent neural state (not the prior one). So, we need to check if they show that the same prior neural state can lead to different outcomes (E) depending on the conscious intention? The study design: they might have manipulated intention independently of prior neural states? This is difficult because prior neural states might lead to the intention. The manuscript claims that the motor-cortex dynamics cannot be reconstructed from prior neural states alone, which suggests that the conscious intention (and its physical base at the time) is doing something new.

     - **Step 5b (interventionist test)**: The manuscript likely does not perform an intervention on conscious intention while holding fixed the concurrent physical base. However, they might argue that the conscious intention is the intervening variable. The challenge: if we intervene on the conscious intention, we would change the concurrent neural state. So, it is hard to hold the physical base fixed. The manuscript's claim is that without the intention (even if the prior neural states are the same), the outcome would be different. This is a counterfactual claim. But without an intervention that manipulates intention independently of the concurrent neural state, it is hard to establish.

     Given that the manuscript argues that prior neural states are not sufficient, they are effectively saying that the physical base (which includes the concurrent neural state of intention) is necessary. But then, is the mental property (intention) doing any extra work? The procedure might not be able to settle this without further metaphysical commitment.

     **Verdict**: The manuscript avoids exclusion at Step 4 because the physical base (prior neural states) is not sufficient. However, the mental property (conscious intention) is now tied to a concurrent physical base (the neural state at the time of intention). We then must check if the manuscript shows that the mental property is not reducible to that concurrent physical base? The manuscript does not explicitly do that. So, we might proceed to Step 5b: can we intervene on the mental property without changing the concurrent physical base? The manuscript does not provide such evidence, so we cannot conclude independent causal relevance. 

     Therefore, we flag that the manuscript has not established that the conscious intention (as a mental property) is doing work over and above the concurrent neural state. The claim is that the concurrent neural state (which is the physical base of the intention) is necessary and sufficient for the motor-cortex dynamics? Then the mental property would be excluded by that concurrent neural state. But the manuscript argues that the intention is causally relevant. So, we are in a gray area.

     **Feature doing the work**: The manuscript's argument that prior neural states are insufficient avoids the initial exclusion (by Step 4), but it does not establish that the mental property is not excluded by the concurrent neural state.

     **Attack by defender**: A defender might argue that the conscious intention is identical to (or supervenes on) the concurrent neural state, but that the concurrent neural state is not reducible to the prior neural states. Therefore, the conscious intention (as the concurrent neural state) is causally effective. But then, why call it mental? The manuscript wants to attribute causal power to the mental property. The defender might also argue that the mental property is realized in the neural state but has causal powers at the mental level. However, without independent variation, we cannot confirm.

     **What the procedure cannot settle**: Without a clear account of how the mental property can vary independently of the concurrent neural state, we cannot rule out that the neural state is doing all the work. This requires further metaphysical commitment (e.g., to a non-reductive physicalism that allows mental properties to have distinct causal powers) or empirical evidence of independent variation.

     **Evaluation outcome**: We stop at Step 5b with a negative: no interventionist evidence. Thus, the mental causal claim is not supported and is potentially redundant (with respect to the concurrent neural state). However, the manuscript has not addressed exclusion by the concurrent neural state. We must flag that the manuscript fails to address whether the mental property is excluded by the concurrent physical base.

     **Final verdict for the review**: The manuscript avoids the initial exclusion (by prior neural states) but does not establish that the mental property is not excluded by the concurrent neural state. Therefore, the claim of mental causation is not sufficiently supported. The issue should be flagged for the authors to address: either provide evidence of independent variation (via intervention) or clarify their metaphysical position.

  **Case 2:**
  *Study that attributes anxiety-driven avoidance behavior solely to amygdala activation, using “anxiety” only as a descriptive label for the neural pattern.*

  **Step 1:**
     - M: anxiety (as a mental state)
     - E: avoidance behavior

  **Step 2:**
     - P: amygdala activation (explicitly mentioned as the physical base)

  **Step 3:**
     - The manuscript uses "anxiety" only as a descriptive label for the neural pattern. This implies that they are reducing anxiety to amygdala activation? Or are they using it as a mere label without any commitment to mental causation? They attribute the avoidance behavior solely to amygdala activation. So, they are not asserting that the mental state of anxiety is causing the behavior? They are using the label to describe the pattern.

     - However, the problem statement says they use "anxiety" as a descriptive label for the neural pattern. So, they are not actually asserting mental-state causation? They are only talking about the neural pattern. But the title or claims might still use the term "anxiety-driven". We must be cautious.

     - Let's assume the manuscript does not explicitly reduce anxiety to amygdala activation (they might not even be making a mental causation claim). But if they use the term "anxiety-driven", they might be implying that anxiety (the mental state) is the cause.

     - The procedure is for manuscripts asserting mental-state causation. So, if they are not asserting that the mental state of anxiety is causing the behavior, then the issue does not arise. But the problem states: "attributes anxiety-driven avoidance behavior solely to amygdala activation". This phrasing suggests that they are using "anxiety" to label the amygdala activation and then attributing the cause to that activation. So, they are not actually positing a mental cause beyond the neural one.

     - Therefore, we can interpret that they are reducing anxiety to amygdala activation. So, Step 3: explicit reduction? They are using "anxiety" as a label for the neural pattern, so they are effectively identifying anxiety with amygdala activation.

     **Step 3 verdict**: The manuscript explicitly reduces anxiety (M) to amygdala activation (P). Therefore, the mental causal claim is redundant. The cause is the amygdala activation.

     **Feature doing the work**: The manuscript does not assert mental causation beyond the neural activation. They are using the mental term only as a label for the physical state.

     **Attack by defender**: A defender might argue that the manuscript is not making a mental causation claim at all. They are only using the mental term descriptively. Therefore, the reviewer should not apply the exclusion problem to this manuscript.

     **What the procedure cannot settle**: The procedure is designed for manuscripts that assert mental-state causation. If the manuscript does not actually assert mental causation, then the procedure is not applicable. However, the problem statement says that we repeatedly receive manuscripts asserting mental-state causation. In this case, the manuscript might be using mental terms in a way that appears to assert causation but then reduces it. The reviewer must be alert to whether the manuscript is using mental terms in a non-causal, descriptive way.

     **Evaluation outcome**: We stop at Step 3 with a verdict that the mental causal claim is redundant. The manuscript should be revised to remove the mental causation language (if they are not asserting it) or to clarify that they are reducing the mental state to the neural state.

  **Final Procedure Flowchart**:

  1. **Identify M and E**: If not clear, request clarification.
  2. **Identify P (physical base for M)**: If no physical base, flag for specialist (dualism).
  3. **Explicit reduction?** If yes → mental causal claim is redundant (stop).
  4. **Is P causally sufficient for E?** 
