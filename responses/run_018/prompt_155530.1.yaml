  We are designing a 90-minute activity for an upper-level philosophy seminar on political polarization, echo chambers, and good faith arguments. The activity has three main phases and a debrief, with a structural twist: using anonymized reasoning transcripts to separate argument evaluation from advocate identity.

  **Total Time: 90 minutes**

  **Materials to Prepare Before Class:**
  1. Two sets of reasoning prompts on a concrete, non-obvious policy question. Example: "Should algorithmic transparency mandates apply to private recommendation systems (e.g., YouTube, TikTok, Netflix)?" 
     - Position A: Yes, because ... (provide a brief starting point for reasoning)
     - Position B: No, because ... (provide a brief starting point for reasoning)
     - Ensure the prompts are self-contained and provide enough context for students to build an argument without external research.

  2. Template sheets for the reasoning transcripts (with labeled sections):
     - Premises (list 2-4 key premises)
     - Inferences (step-by-step reasoning from premises to conclusion)
     - One point where a reasonable opponent might resist (explicitly noted)

  3. Scoring cards for the classification phase (each card should have):
     - Classification: "good-faith reasoning from different premises" OR "strategic bad-faith rhetoric"
     - Confidence: 1 (low) to 5 (high)
     - Space for two-sentence justification

  4. A system for anonymization: assign random identifiers to each transcript (e.g., numbers) and have a method to reveal authors later.

  5. A way to record the vote (e.g., a simple show of hands or a ballot).

  **Phase 1: Writing the Reasoning Transcripts (20 minutes)**
  - Divide the class into two groups: half assigned to defend Position A (even if they personally disagree) and half to Position B.
  - Each student writes a reasoning transcript for their assigned position using the template. They must:
    - Explicitly label premises, inferences, and one point of resistance (as per the template).
    - Write in a way that is self-contained and clear, without relying on external knowledge.
  - Emphasize that they are to construct the best argument they can for the assigned position, regardless of personal belief.
  - At the end of 20 minutes, collect the transcripts and anonymize them (remove names, assign random IDs). Shuffle them.

  **Phase 2: Anonymized Classification (30 minutes)**
  - Distribute one transcript from the opposing camp to each student. (Note: if there are uneven numbers, one or two students might get a transcript from their own camp, but try to avoid this. Alternatively, the instructor can also write a transcript to even the numbers.)
  - Each student must:
    - Read the transcript and classify it as either:
      - "good-faith reasoning from different premises" (meaning the argument is internally coherent and made in good faith, even if one disagrees with the premises) or 
      - "strategic bad-faith rhetoric" (meaning the argument appears disingenuous, manipulative, or intentionally misleading).
    - Record their confidence on a scale of 1-5 (1: not confident at all, 5: very confident).
    - Write a two-sentence justification for their classification.
  - Rules: No direct rebuttal or arguing against the transcript. The task is only to classify the reasoning as good-faith or bad-faith based on its internal structure.

  **Phase 3: Reveal and Vote (20 minutes)**
  - Step 1: Authors reveal themselves (by matching the random ID to a list kept by the instructor). Each author reads the classification(s) they received (if multiple students read the same transcript, only one is used? Actually, each transcript is read by one student. So each author will get one classification). Alternatively, the instructor can read out the classifications for each transcript and then reveal the author.
  - Step 2: Authors have 1-2 minutes each to respond briefly to the classification (e.g., "I was trying to argue in good faith, and I think the point of resistance I noted shows that," or "I see why it might look strategic because of X, but I intended Y"). 
  - Step 3: The group then votes without discussion: "Raise your hand if knowing the author changed your initial classification." (Note: Only the students who classified that particular transcript? Probably not, because each student classified only one. Instead, we can ask the entire class to reflect on whether, in general, knowing the identity of the author of any transcript would have changed their classification. Alternatively, we can do a vote per transcript: for each transcript, ask the student who classified it and the author to abstain, and the rest vote? This might be too time-consuming. Alternatively, we can do a general vote: "How many of you think that, for the transcript you evaluated, if you had known the author was from the opposing camp, it would have made you more likely to classify it as bad faith?" and then "How many think it would have made you less likely?" and then "How many think it wouldn't have changed?" But note: the instructions say "the group then votes, without further discussion, on whether knowing the author’s assigned position changed their initial classification." We interpret this as: after the reveal, each student (including the one who did the classification and the author) is asked to consider the transcript they classified and whether knowing the author's assigned position (which they now know) would have changed their initial classification. Then, each student writes down "changed" or "not changed". Then we tally. Alternatively, we can do a show of hands for "changed" and "not changed". We'll go with that.

  **Phase 4: Debrief (20 minutes)**
  - The instructor leads a discussion mapping the activity to the concepts:
    - Transcript-writing: Forces articulation of premises that are often suppressed in echo chambers. Students had to build an argument for a position they might not hold, which requires stepping outside one's own perspective.
    - Anonymized judgment: Tests whether structural features of reasoning (explicit premises, acknowledged resistance points) can be detected without identity cues. Did the presence of explicit premises and a resistance point help in classifying as good faith?
    - Reveal-and-vote: Tests whether polarization operates at the level of inferred motivation (attributing bad faith because of who is speaking) or at the level of content evaluation (evaluating the argument on its own). The vote is expected to show that identity matters.
  - Also, discuss the symbolic payoff: After the reveal, the instructor collects the author's self-reported intent (whether they were attempting good faith or not). Then, students who classified correctly (i.e., aligned with the author's intent) get "epistemic accuracy points". The instructor can announce the top scorers at the end.

  **Predicted Problems and Mitigation:**
  1. Conflating unfamiliar premises with bad faith: Students might label an argument as bad faith simply because they find the premises odd or disagreeable. 
     - Mitigation: In the instructions for classification, emphasize that good faith does not require agreement with the premises, only that the reasoning is coherent and honest.

  2. Anonymity broken by writing style or prior knowledge: 
     - Mitigation: Use typed templates (if possible, have students type during the first phase, but that might not be feasible). Alternatively, have them write in a standardized format and then the instructor transcribes? Not practical. Instead, use a template that requires bullet points and a structured format, which might obscure style. Also, collect and redistribute in a way that the instructor is the only one who knows the mapping.

  3. Vote shows near-unanimous identity-driven revision: 
     - Frame this as data: The facilitator can use this as evidence that identity cues do affect our judgments of good faith.

  **What the Simulation Cannot Reproduce:**
  - The structural economic and algorithmic incentives that create echo chambers in the wild (e.g., platform optimization for engagement, identity-based social sorting, and long-term reputation costs). The facilitator must supply this context in the closing of the debrief.

  **Rules to Prevent Direct Rebuttal:**
  - During the classification phase, explicitly instruct students not to argue against the transcript but only to evaluate its internal coherence and perceived intent.

  **Symbolic Payoff:**
  - After the reveal, each author privately tells the instructor whether they were attempting good faith or not (they were assigned to argue a position, but they could have done it in good faith or not? Actually, the instruction was to write a step-by-step justification, so we assume they were trying to do it in good faith? But they might have intentionally written a bad-faith argument? We leave it open. The author reports their intent). Then, for each transcript, if the classifier classified it as good faith and the author says they intended good faith, the classifier gets 1 point. If the classifier classified it as bad faith and the author intended bad faith, the classifier gets 1 point. Otherwise, 0. Confidence is not factored into the points. Alternatively, we can multiply by the confidence? Not necessary. We can just use the binary.

  **Detailed Timeline:**

  - 0:00-0:05: Introduction (5 min) 
    - Explain the activity, the policy question, and assign positions (A or B) randomly to half the class. 
    - Emphasize that they are to build the best argument for their assigned position, regardless of personal views.

  - 0:05-0:25: Phase 1 - Writing (20 min)
    - Students write their reasoning transcripts using the template.

  - 0:25-0:30: Collect and anonymize (5 min) 
    - Instructor collects, removes names, assigns random IDs, shuffles, and redistributes one transcript from the opposing camp to each student. (Note: if there are 14 students, 7 in each group, then each student in group A gets a transcript from group B and vice versa.)

  - 0:30-1:00: Phase 2 - Classification (30 min)
    - Students read the transcript they received and complete the scoring card.

  - 1:00-1:20: Phase 3 - Reveal and Vote (20 min)
    - Step 1: Authors reveal (5 min): The instructor goes through each ID, announces the ID, asks the author to reveal themselves, and then reads the classification and justification that the classifier wrote (without revealing the classifier's name). The author then responds briefly (1 min max per author). 
      - Note: There are 14 students, so 14 transcripts. But each student is an author and also a classifier. So we have 14 classifications. We don't have time for 14 one-minute responses (14 minutes) and then the vote. Alternatively, we can have authors only respond if they wish, and limit to 7-8 responses? Or we can do a quick round: each author says in one sentence whether they agree with the classification. But the instructions say "authors reveal themselves, read the classifications they received, and respond briefly". We can have the instructor collect the scoring cards and then, for each transcript, call the author to the front, reveal the classification, and the author responds. This will take about 1 minute per transcript, so 14 minutes. Then the vote: 5 minutes. That's 19 minutes. We can cut down by having only 7 authors (one from each pair) respond? But that might be arbitrary. Alternatively, we can do a simultaneous reveal: after distributing the classifications to the authors, they read it and then we have a quick round of responses (each 20 seconds). We'll adjust: 
        - Instructor returns the scoring card to the author (so each author gets the card that was filled out for their transcript) and then each author reads it and responds in 30 seconds. We do 14 authors in 7 minutes? That's too tight. Instead, we do a show of hands: "How many of you were classified as good faith?" and then "How many as bad faith?" and then ask 2-3 volunteers to explain their reaction. Then move to the vote.
    - Step 2: Vote (5 min): The instructor asks: "For the transcript you evaluated, now that you know the author and their assigned position, would you change your initial classification? If yes, raise your hand." Then, "If not, keep your hand down." Tally. Then, "How many of you would have changed to good faith? How many to bad faith?" (But note: the instructions say the group votes without further discussion on whether knowing the author’s assigned position changed their initial classification.) So we do a vote per student: each student (the classifiers) now consider the transcript they read and whether knowing the author would have changed their classification. They write on a piece of paper: "Changed" or "Not changed". Then we count.

  - 1:20-1:40: Phase 4 - Debrief (20 min)
    - The instructor leads a discussion using the questions outlined above.

  **Adjustments for Time:**
  - If the reveal phase is taking too long, we can skip individual responses and just have a few volunteers. Alternatively, we can have the authors discuss in pairs and then share a few thoughts.

  **Final Note:**
  - The goal is for the mechanics to generate the experience of doubting whether the other side is reachable. The debrief should connect the activity to real-world polarization.

