  ### Welfare Impact Allocation Simulation  
  **Designed for 8 students (split into two groups of 4) in a 75-minute session.**  

  ---

  #### **Materials**  
  1. **Envelopes (4 per group, 8 total):**  
     - Each contains a card describing a beneficiary’s state on three dimensions (scale: 1–10, 10 = highest welfare impact).  
     - **Dimensions:**  
       - **Phenomenological Intensity (I):** Raw feeling strength (e.g., pain/pleasure).  
       - **Temporal Spread (T):** Duration/frequency over time.  
       - **Adaptational Resistance (A):** Resistance to habituation (e.g., enduring distress).  
     - **Card Format:**  
       ```  
       BENEFICIARY [ID]  
       - Intensity: [Value]  
       - Temporal Spread: [Value]  
       - Adaptational Resistance: [Value]  
       YOUR PRIVATE DIMENSION: [One dimension marked "HIDDEN TO OTHERS"].  
       YOUR STAKE: You avoid a penalty if the resource goes to the beneficiary with the HIGHEST value in this dimension.  
       ```  

  2. **Beneficiary Assignments (Per Group):**  
     | Ben. | I  | T  | A  | Hidden Dim (Student Stake) |  
     |------|----|----|----|-----------------------------|  
     | A    | 8  | 3  | 5  | T (Student 1)               |  
     | B    | 4  | 9  | 2  | A (Student 2)               |  
     | C    | 2  | 5  | 9  | I (Student 3)               |  
     | D    | 5  | 5  | 5  | I (Student 4)               |  

     - **Rationale:** No dominant beneficiary; conflicts between high/low values (e.g., B has max T but min A). Two students (3 and 4) share a stake in I, creating coalition tensions.  

  3. **Visible Scoreboard (Whiteboard/Screen):**  
     | Ben. | Visible Dims      | Hidden Dim |  
     |------|-------------------|------------|  
     | A    | I: 8, A: 5        | T          |  
     | B    | I: 4, T: 9        | A          |  
     | C    | T: 5, A: 9        | I          |  
     | D    | T: 5, A: 5        | I          |  

  4. **Resource Token:** One physical token (e.g., red card labeled "Resource") per group.  

  ---

  #### **Roles**  
  - **Students (8):** Split into two groups of 4. Each student:  
    - Receives one envelope (assigned beneficiary + private dimension).  
    - **Dual Role:**  
      - Impartially negotiate for "greatest overall welfare impact."  
      - Hidden stakeholder for their private dimension (avoids penalty only if allocated beneficiary has **max value** in that dimension).  
  - **Facilitator (Instructor):**  
    - Explains rules, moderates time, enforces "unanimous conversion rate" rule.  
    - Manages forced vote and scoring.  
    - **No veto power** for anyone.  

  ---

  #### **Payoff/Scoring**  
  - **Collective Reward:** Unanimous agreement → All 4 students in the group gain **+1 point**.  
  - **Individual Penalty:**  
    - If the resource is allocated to a beneficiary **without the max value** in a student’s private dimension → That student loses **-1 point**.  
    - *Max value ties:* No penalty if allocated beneficiary is tied for max.  
  - **Scoring Examples:**  
    - If resource goes to A (max I = 8):  
      - Student 1 (stake: T) penalized (T=3 ≠ max T=9).  
      - Student 2 (stake: A) penalized (A=5 ≠ max A=9).  
      - Students 3 & 4 (stake: I) avoid penalty (I=8 is max).  
    - Net: Students 1 & 2: 0 points (1 - 1), Students 3 & 4: +1 point (1 - 0).  

  ---

  #### **Timeline (75 Min Total)**  
  1. **Setup (10 min):**  
     - Split into two groups (4 students each).  
     - Distribute envelopes. Display scoreboard. Explain:  
       - Goal: Unanimous agreement on which beneficiary (A, B, C, or D) gets the resource for "greatest welfare impact."  
       - Rules:  
         - Share info freely, but private dimensions stay hidden unless revealed voluntarily.  
         - **No quantitative conversion rates** (e.g., "I = 2T") unless **all 4 in group endorse it explicitly**.  
         - Failure to agree → forced vote (no collective reward).  
       - Scoring: Collective +1 point for agreement; individual penalty if resource "misses" their private dimension’s max.  

  2. **Negotiation (30 min):**  
     - Groups discuss. Facilitator circulates, enforces rules:  
       - Intervene if students imply conversion rates without unanimous consent (e.g., "Intensity matters more" is qualitative; "1 I = 2 T" requires vote).  
       - Remind students they can reveal their private dimension but aren’t required to.  
     - **Key tensions to observe:**  
       - Initial focus on visible scores (e.g., "A has high Intensity!").  
       - Frustration as hidden dimensions block comparisons.  
       - Strategic revelation (e.g., Student 3 reveals C’s I=2 is low, hurting their stake).  

  3. **Forced Vote (5 min if no agreement):**  
     - If no consensus by 30 min:  
       - Secret ballot: Each student writes one beneficiary (A, B, C, or D).  
       - **Allocation:**  
         - Unanimous vote → Resource allocated, collective +1 point awarded.  
         - Non-unanimous → Majority wins (ties broken by facilitator coin flip). **No collective points.**  
     - Resource token given to winning beneficiary.  

  4. **Scoring (5 min):**  
     - Facilitator reveals hidden dimensions:  
       ```  
       A: T=3 | B: A=2 | C: I=2 | D: I=5  
       ```  
     - Calculate:  
       - Max values: T=9 (B), A=9 (C), I=8 (A).  
       - Apply collective points (if unanimous) and individual penalties.  

  5. **Debrief (20 min):**  

  ---

  #### **Debrief: Mapping Simulation to Philosophy**  
  1. **Initial Confidence in Comparison (Pre-Negotiation):**  
     - *Simulation Moment:* Early focus on visible highs (e.g., "B has T=9, so they’re worst off!").  
     - *Philosophical Link:* Mirrors naïve optimism that welfare is comparable via observable proxies (e.g., income). Reality: Partial data hides critical subjectivity (redacted dimensions).  

  2. **Private Channels Block Introspection (Mid-Negotiation):**  
     - *Simulation Moment:* Students realize they can’t rank beneficiaries without revealing hidden dimensions—but revelation risks strategic penalties (e.g., Student 2 hides A=2 to avoid scrutiny).  
     - *Philosophical Link:* Echoes the "other minds" problem: I know my pain, but I can’t introspect yours. All methods (e.g., empathy, behavior) are indirect and manipulable.  

  3. **Projection Temptation (Late-Negotiation):**  
     - *Simulation Moment:* Stakeholders assume others share their weights (e.g., "I have high I, so Intensity must matter most for everyone!").  
     - *Philosophical Link:* Reflects utilitarian projection—smuggling personal metrics (e.g., "happiness units") as universal, ignoring heterogeneity in welfare dimensions.  

  **Limitation of the Activity:**  
  - Cannot replicate **ineffable subjectivity**: Real welfare lacks quantifiable scales (here, numbers imply cardinality). Also misses **adaptive dynamics** (e.g., habituated pain)—students treat welfare as static.  

  ---

  #### **Predicted Problems & Fixes**  
  - **Problem:** Students reveal all dimensions immediately → Conflates comparison with aggregation (weights debate).  
    - *Fix:* Enforce "no conversion rates without unanimity" rule. Debrief: "Even with numbers, how do we add I + T + A without arbitrary weights?"  

  - **Problem:** One group deadlocks due to penalties → Frustration.  
    - *Fix:* Preempt: Stress, "Your goal is agreement, but your stake might pull against it—that’s the point!" If deadlock occurs, use forced vote to expose trade-offs.  

  - **Problem:** Students misread stakes (e.g., think they advocate for their beneficiary, not their dimension).  
    - *Fix:* Clarify during setup: "You’re penalized if the winner isn’t the best in your private dimension—even if it’s not your beneficiary!"  

  **Facilitator Script for Deadlock:**  
  > "Time’s up—no agreement. Remember: Without consensus, no collective points. Now, vote secretly. [...] The resource goes to [Beneficiary]. Let’s score—notice how stakes and information gaps shaped this outcome."  

  ---  
  **Outcome:** Students experience the "comparison problem" viscerally: Agreement requires either contested metrics or arbitrary projections, with stakes punishing objectivity. The debrief then names this as the core dilemma of interpersonal utility comparison.
