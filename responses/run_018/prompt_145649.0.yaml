  First, I need to recall Fitch's paradox. The core is that if every truth is knowable (∀p (p → ◊Kp)), we can derive that every truth is known (∀p (p → Kp)), which is absurd. The key step is distributing K over a conjunction like p & ~Kp. Applying distribution here leads to contradiction. 

