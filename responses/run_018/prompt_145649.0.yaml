  Breaking it down: The paradox uses a Moorean proposition (p & ~Kp). If this is true, by knowability it's possible to know it. But knowing (p & ~Kp) implies Kp and K~Kp. K~Kp implies ~Kp, which contradicts Kp. So distribution here directly creates the contradiction.

  Why is distribution the culprit? Because knowledge isn't always closed under conjunction when epistemic statements are involved. Knowing a conjunction should imply knowing each conjunct, but with propositions like ~Kp, knowing it requires ~Kp to be true, which conflicts with knowing p. The issue is self-reference in the proposition—it refers to its own unknownness.

