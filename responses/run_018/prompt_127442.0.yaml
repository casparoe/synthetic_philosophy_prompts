  heres a weird angle i came up with: what if 'western values' is mostly defined negatively, like 'not-traditional-authority-values'? if thats true, does it change which questions matter most?

  im writing something for friends who arent academics, so i want to know: if you had about three years and a small group of smart people with no special library access, which of these open questions should they actually try to settle first, second, third? defend the order - like which are tractable for regular thinkers vs which need historians, which ones if answered would make the other debates collapse, and what evidence over the next couple years would make you reorder them? please dont just survey everything, i want an agenda with reasoning.

  also is there a hidden question im missing that matters more than all of these?
