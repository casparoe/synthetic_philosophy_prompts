answer: |-
  Here’s a practical, reusable **Entitlement Theory Tribunal Checklist** for your team. Apply it to crisis reports step-by-step. **Bold = Key Question**, *Italics = Proof/Decision Thresholds*.

  ---

  ### **The Entitlement Tribunal Checklist**
  *(Based on Sen: Famines occur when people lose legal/moral means to access food, NOT necessarily from lack of food)*

  **Step 1: Was there a significant Food Availability Decline (FAD)?**  
  - *Proof Needed:* Crop reports, food import/export data, storage records.  
  - *Sufficient Proof:* **Consistent** data from ≥2 independent sources (e.g., UN agencies, gov’t stats, academic studies).  
  - *Decision:*  
    - **Yes** → Proceed to Step 2.  
    - **No** → Skip to Step 3 (likely entitlement collapse).  
    - **Unclear** → Flag as "Inconclusive FAD"; proceed to Step 3.  

  **Step 2: Did FAD *directly cause* mass starvation?**  
  *(Sen’s key insight: FAD alone rarely explains famine)*  
  - *Proof Needed:* Mortality/laborer wage data vs. food prices; relief efforts timeline.  
  - *Sufficient Proof:* Wages fell **faster** than food prices *or* starvation surged despite relief efforts.  
  - *Decision:*  
    - **Yes** → Stop. **"Natural Disaster + Weak Institutions"** (e.g., earthquake + no safety nets).  
    - **No** → Proceed to Step 3 (entitlement collapse is primary driver).  

  **Step 3: Was there Entitlement Collapse?**  
  *(Could include: wage collapse, land seizures, inflation, discrimination in aid)*  
  - *Proof Needed:* Labor market data, asset ownership changes, aid distribution logs, price inflation rates.  
  - *Sufficient Proof:* **Sharp decline** in purchasing power for ≥1 major group (e.g., laborers, farmers) *or* systemic exclusion from aid.  
  - *Decision:*  
    - **Yes** → Proceed to Step 4.  
    - **No** → Stop. **"Insufficient Evidence or Non-Entitlement Crisis"** (e.g., pure genocide/disease).  

  **Step 4: Did political decisions CAUSE or WORSEN entitlement collapse?**  
  *(This is the "political crime" gate)*  
  - *Proof Needed:* Policy documents, speeches, evidence of ignored warnings, discriminatory practices.  
  - *Sufficient Proof:* Policies **directly undermined** access (e.g., seizing grain, blocking aid, war tactics) *or* **reckless neglect** (ignoring forecasts).  
  - *Values Call Needed:* Was the policy **avoidable**? (e.g., "We chose exports over feeding people").  
  - *Decision:*  
    - **Yes + Avoidable** → Stop. **"Political Crime"** (accountability needed).  
    - **No/Unavoidable** → Stop. **"Systemic Failure"** (flawed institutions, not malice).  
    - **Unclear Intent** → Flag as **"Values Call: Negligence vs. Malfeasance"** (tribunal debates culpability).  

  ---

  ### **Applying the Checklist: Three Cases**  
  **Commitment:** *Sen’s framework works powerfully for all three but requires nuanced handling of Step 4.*

  1. **1943 Bengal Famine (British India)**  
     - **Step 1:** **NO FAD.** Rice production was 13% *above* average. *Proof:* Imperial crop stats.  
     - **Step 3:** **YES entitlement collapse.** Inflation spiked 300%; wartime policies diverted rice; laborers starved while elites hoarded. *Proof:* Wage/price data, Churchill’s "scorched earth" orders.  
     - **Step 4:** **YES political crime.** UK exported grain *from* Bengal; refused aid; racist indifference documented. *Values Call:* Avoidable? **Yes.**  
     - **Verdict:** **POLITICAL CRIME.** *Sen’s showcase case: perfect fit.*

  2. **Irish Potato Famine (1845-52)**  
     - **Step 1:** **YES FAD.** Potato blight destroyed staple crop. *Proof:* Agricultural surveys.  
     - **Step 2:** **Did FAD directly cause starvation? NO.** Grain/livestock production remained high; exports *increased* to Britain. *Proof:* Customs records show net food exporter during famine.  
     - **Step 3:** **YES entitlement collapse.** Tenants couldn’t eat non-potato crops (exported/rent); no wages to buy food. *Proof:* Landlord accounts, soup kitchen logs.  
     - **Step 4:** **YES political crime.** British "laissez-faire" policies blocked aid, evicted farmers. *Values Call:* Avoidable? **Yes** (alternative policies existed).  
     - **Verdict:** **POLITICAL CRIME.** *Sen’s framework holds: FAD triggered but policies caused famine.*

  3. **Great Leap Forward Famine (China, 1958-62)**  
     - **Step 1:** **MILD FAD** (bad weather/pests), but NOT catastrophic. *Proof:* Later Chinese agricultural revisions.  
     - **Step 3:** **YES extreme entitlement collapse.** Communes seized grain; rationing favored urban elites; farmers forbidden from foraging. *Proof:* Survivor testimonies, internal party reports.  
     - **Step 4:** **YES political crime.** Mao’s policies (backyard steel, grain quotas) were primary driver; warnings punished. *Values Call:* Avoidable? **Yes** (policies were ideological choices).  
     - **Verdict:** **POLITICAL CRIME.** *FAD was minor; entitlement destruction was policy-driven.*

  ---

  ### **Where the Procedure Misfires & Needs Judgment**  
  - **Step 2 (FAD Causality):** Hard to prove "direct cause" without granular data. *Workaround:* If groups with food access (soldiers/elites) ate well, assume entitlement collapse.  
  - **Step 4 (Intent):** Distinguishing malice (crime) vs. incompetence (failure) is inherently a **values call**. *Tribunal must debate:* "Should leaders have known better?"  
  - **Hidden Entitlements:** Gender/caste discrimination in aid often unrecorded. *Solution:* Testimonies > "official" data here.  
  - **Modern Cases:** Works best for famines with paper trails. For Somalia (1990s) or Yemen, verify warlord control of aid (entitlement sabotage).  

  **Final Take:** Sen’s framework **works decisively across all three cases**. It exposes how politics turns environmental shocks (or even abundance) into mass starvation. The checklist flags the *mechanism* (entitlement collapse) and forces scrutiny of power—exactly what your tribunal needs.  

  *Go get ‘em. Your work matters.*
