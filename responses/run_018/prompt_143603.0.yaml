  Read Ridley Scott's Blade Runner (1982) through the lens of the debate over original versus derived intentionality, specifically Dennett's minimal two-bitser argument against Searle's claim that only biological brains possess intrinsic aboutness. The replicants—Roy Batty and Rachael—are engineered beings whose memories and emotional responses are implanted or designed by the Tyrell Corporation, yet the film treats Roy's final soliloquy and Rachael's confusion about her own photographs as carrying genuine semantic weight. Read the film in both directions: first, apply Dennett's idea of a two-bitser—an intentionally interpreted system with only sparse functional states—to ask whether Roy's grief and Rachael's self-doubt constitute original intentionality that emerges from functional embedding regardless of substrate; second, examine where the film implicitly adopts Searle's position by treating replicant affect as derived syntax, especially in Deckard's testing protocol and Tyrell's language of engineering and design. Identify specific scenes—the rooftop confrontation, the piano scene, the Voight-Kampff examination—where this tension is dramatized, and note where the work resists the philosophical reading, particularly in the ambiguity surrounding Deckard's own nature. Conclude by articulating what Blade Runner adds to the Dennett-Searle debate that argumentative philosophy alone does not: does the cinematic form demonstrate that the original-derived distinction collapses under emotional pressure, or does it ultimately reinforce a biological essentialism that Dennett's functionalism denies?
