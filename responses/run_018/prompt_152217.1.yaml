  I recall several psychological concepts. Vicarious identity comes to mind—where one's identity is lived through another. But that usually involves an active figure, not an absent one. Postmortem identity maintenance deals with keeping a deceased person's identity alive, but it's more about preservation than structuring one's own identity around it. Absence incorporation in grief studies touches on internalizing the lost person, but doesn't emphasize the structural dependency aspect.

