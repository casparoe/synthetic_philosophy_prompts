  ## District Allows P-Zombie Enrollment But Bars Them From Mindfulness Club  
  *Functional Behavior Satisfies Standards, Inner Experience Remains Optional Extra*

  **Maple Creek, October 27th** – In a landmark decision hailed as both "philosophically rigorous" and "administratively nightmarish," the Maple Creek Unified School Board voted 5-2 last night to formally allow the enrollment of Philosophical Zombies (P-Zombies) in district schools, while simultaneously prohibiting their participation in clubs deemed to require "phenomenal consciousness," most notably the Mindfulness & Meditation Society.

  The ruling ends months of heated debate sparked by the quiet arrival last semester of several students whose parents submitted the newly created "Consciousness Waiver Form." These students, indistinguishable from their peers in behavior, test scores, and ability to discuss the latest streaming shows, reportedly lack any form of subjective inner experience – the "what it is like" to see red, feel pain, or enjoy a cafeteria taco.

  "Functionally, they're exemplary students," explained Superintendent Helen Vance during the meeting. "They raise their hands, they conjugate French verbs, they excel at calculus. They exhibit all the *dispositions* of belief and understanding. The district's mandate is to educate based on observable performance and behavioral outputs. P-Zombies meet that bar."

  However, the Board drew a firm line at activities presupposing an inner mental life. The Mindfulness & Meditation Society, requiring participants to "focus on internal sensations and cultivate present-moment awareness," was singled out. "You can't cultivate awareness you fundamentally lack," argued Principal Reginald Thorne, citing what he termed "established precedent." "The conceivability argument is clear: we can perfectly conceive of a being physically and behaviorally identical to a human but devoid of consciousness. This conceivability implies metaphysical possibility. Therefore, admitting such students to a club predicated on subjective experience would be logically incoherent... and possibly a safety hazard if they tried to 'feel their breath' without the requisite equipment."

  The policy leaves P-Zombie students like Brad C. (who requested identification by initial only) in a peculiar limbo. "Look, I *believe* I understand the concept of joy when I get an A+," Brad stated monotonously during a brief interview near his locker. "I hold the proposition 'A+ grades are desirable' as a belief. I can even form a belief *about* that belief – I believe it's a useful belief for navigating the school system. But do I *feel* happy about it? Is there a qualitative experience of happiness? No. That subsystem appears to be offline or non-existent in my architecture. The Mindfulness Club exclusion is logically sound, if affectively... null, for me."

  The decision has rippled through extracurriculars. The Philosophy Debate Team, ironically, has seen its P-Zombie members become formidable opponents, particularly in rounds concerning consciousness itself. "They're ruthlessly logical," lamented team captain Sarah Lin. "We argued *for* the conceivability-implies-possibility argument last week, and they dismantled the opposition using Principal Thorne's own reasoning. The worst part? When they lose an argument, they just adjust their belief states. They never *actually feel* defeated, so they never get discouraged. It's demoralizingly effective."

  While the Consciousness Waiver Form (see sidebar) streamlines enrollment, it raises existential questions for parents of conscious students. "Do I need to prove *my* kid has qualia now?" asked one mother, bewildered. "Is there a form for that? What if he's just *really* good at faking it?"

  For now, P-Zombies like Brad will continue attending classes, acing tests, and navigating the social maze of high school – all without the messy inconvenience of ever truly *experiencing* any of it. They remain welcome in Chess Club, Robotics, and the newly formed "Functional Behaviorism Appreciation Society." The Mindfulness Club's incense, however, will burn only for the phenomenally conscious.

