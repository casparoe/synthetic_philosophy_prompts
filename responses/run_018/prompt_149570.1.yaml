  For Part B, can causal-role frameworks distinguish designed-from-nothing pathways from fortuitous ones without history? Design implies intentionality, which isn't part of standard causal-role theories. Causal-role might see both as functional if they contribute now, but proper function requires a design history. Credence: 0.1—it's hard without smuggling in historical or normative elements.

  For Part C, vestigial structures are a problem for etiological accounts because they have history but no current role. Etiological theories can call them vestigial—once functional, now not—but causal-role theories would say they have no current function. This asymmetry shows the theories handle vestigiality differently, but etiological accounts can still explain it. Credence: 0.9 that vestigial structures are manageable for etiological views.

