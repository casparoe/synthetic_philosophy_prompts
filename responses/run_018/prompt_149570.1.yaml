  The core tension is between etiological theories (functions based on evolutionary history/selection) and causal-role theories (functions based on current contributions to system goals). The Synthus case challenges etiological views because it has no evolutionary history for its nitrogen fixation, while the whale bone challenges causal-role views because it has history but no current role. The user wants to know if causal-role theories can handle both without collapsing the distinction between proper function and accidental contribution.

