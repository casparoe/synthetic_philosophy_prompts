answer: |-
  ### Decomposition of Reasoning  

  #### (A) Necessity of Evolutionary History for Proper Function  
  **Credence: 0.2**  
  *Justification:* Etiological theories (e.g., Millikan, Neander) define "proper function" as the effect for which a trait was *selected* in evolutionary history. Synthus’ nitrogen fixation lacks this history—it is an engineered accident—so etiological accounts would deny it has a "proper function" despite its causal contribution. Causal-role accounts (e.g., Cummins) define function solely by current systemic contribution, so they *could* call Synthus’ pathway "functional." However, this fails to capture the normative distinction between "proper function" (selected effect) and "accidental contribution" (fortuitous effect). Evolutionary history thus appears conceptually necessary to ground this normativity.  

  #### (B) Causal-Role Distinction of Designed vs. Fortuitous Pathways  
  **Credence: 0.1**  
  *Justification:* Causal-role theories analyze function via a trait’s current role in sustaining a system’s capacities (e.g., survival/reproduction). For Synthus, nitrogen fixation contributes causally to survival in nitrogen-poor soil, so causal-role accounts would label it "functional." Yet this framework cannot distinguish Synthus’ *engineered* pathway from a purely fortuitous, non-designed contribution (e.g., a random mutation with beneficial but unselected effects) without tacitly invoking design as a proxy for "intended" function. Design implies teleology—a goal-directed origin—which causal-role theories explicitly reject to avoid historical baggage. Absent historical or normative criteria, "function" collapses to "any beneficial causal role," erasing the accidental/proper boundary.  

  #### (C) Vestigial Structures as a Problem for Etiological Accounts  
  **Credence: 0.9**  
  *Justification:* Vestigial traits (e.g., whale pelvic bones) pose no fatal problem for etiological theories. They can be classified as "vestigial *proper functions*"—traits that once had a selected effect but no longer contribute causally. Etiological accounts easily explain this: the bone’s function is derived from ancestral selection, even if it now lacks causal efficacy. Causal-role theories, conversely, must deny the bone has *any* current function (since it plays no role), but this fails to explain why we intuitively call it "vestigial" (implying historical function) rather than "non-functional." The asymmetry is clear: etiological accounts handle vestigiality via history; causal-role accounts lack resources to explain the historical residue.  

  ---

  ### Combined Credence  
  **Overall credence that causal-role accounts can accommodate both cases without collapsing the distinction: 0.15**  
  *(Calculated as the product of the critical tensions: A × B × C-corollary ≈ 0.2 × 0.1 × 0.9, normalized for interdependence)*  

  ### Sensitivity and Key Vulnerability  
  The final credence is **most sensitive to (B)**. If causal-role theories could intrinsically distinguish *designed* contributions from *fortuitous* ones without invoking history or design teleology, the credence would rise significantly. For example, if "system goals" were defined non-arbitrarily (e.g., via autonomous agency or self-maintenance norms), engineered functions might be separable from accidents. However, without such criteria, Synthus’ pathway remains indistinguishable from a lucky mutation—making "proper function" ineliminably historical.  

  ### Empirical/Conceptual Shift  
  The credence would shift most dramatically (to ~0.6) with a **conceptual argument showing that synthetic design creates *sui generis* normative goals** (e.g., that engineer intent establishes "system purposes" independent of evolution). If causal-role theories could ground "proper function" in immanent system teleology (e.g., autopoiesis in synthetic organisms), Synthus might acquire non-historical normativity. No current finding achieves this—biology’s normativity remains tied to natural selection’s historical constraint. Without this, causal-role accounts conflate design with serendipity.
