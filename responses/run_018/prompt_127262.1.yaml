prompt: |-
  hey so I'm in this interfaith dialogue group and every time someone asks whether the resurrection report is historially credible, one guy shuts it down with "religious belief is a form of life, not a set of propositions" — like that settles whether the claim can be wrong. I want to bring a disambigution menu to next meeting so we can actually talk instead of talking past eachother.

  Act as a philosopher of religion who actually reads Wittgenstein in context, not just tumblr quotes. First brainstorm the distinct precise claims that slogan could be expressing, then lay them out as a list I can use in discussion. For each reading say: is it trivial? Substantive and defensible? False? And crucially, does it actually support dismissing historicial questions about the resurrection, or is my friend misapplying it?

  I especially want you to cover whether "form of life" here means (i) an unreasoned social habit, (ii) a framework that sets internal standards for what's reasonable, or (iii) a non-cognitive emotional stance — since those three do totally different work when someone tries to block evidence-based critique. Keep it tight: max 350 words, one short paragraph per reading, no bibliography or citations since this is for an offline discussion group and I can't look anything up on my phone. Don't just defend the slogan; include the radical and false readings too. Please think carefully about which version actually protects releigious claims from historical scrutiny and which just changes the subject.
reasoning: |-
  Okay, the user is in an interfaith dialogue group where someone repeatedly uses a Wittgenstein quote to shut down discussions about the historical credibility of the resurrection. They want a clear breakdown of possible interpretations of "religious belief is a form of life, not a set of propositions" to bring to their next meeting. 

  Hmm, the user seems frustrated with how this slogan is being weaponized to avoid substantive discussion. They're clearly intellectually engaged - they specifically mention Wittgenstein in context (not Tumblr quotes!) and want precision. Smart. Their underlying need isn't just to "win" the argument but to restore meaningful dialogue. 

  Breaking this down: The key is distinguishing between three possible interpretations of "form of life" that do different philosophical work. First interpretation: form of life as mere social habit. That would make religious belief arbitrary - which is both reductive and probably not what Wittgenstein meant. Second: as a framework with internal standards. This is the strongest reading, where historical questions might be irrelevant to the meaning of resurrection within the practice. Third: as purely emotional stance. Dangerously close to reducing faith to feelings.

  Important nuance: Only the second interpretation might legitimately sideline historical inquiry, but even then it shouldn't dismiss it entirely - just contextualize its significance. The other interpretations either don't block historical critique or do so by making belief irrational. 

  User's friend seems to be using the slogan as a conversation-ender, but ironically the whole point of Wittgenstein's concept was to understand meaning within practices, not to silence inquiry. The disambiguation menu should help expose this. 

  Must keep it tight (350 words!), so each reading gets one punchy paragraph assessing: trivial/defensible/false? And crucially - does it actually block historical questions? User especially wants the three meanings of "form of life" unpacked because those determine if critique is even possible. 

  Final thought: The most defensible reading (framework with internal standards) doesn't make historical evidence irrelevant - it just changes what counts as relevant evidence within that form of life. That's the subtle point the group needs to grapple with.
answer: |-
  Here's your disambiguation menu for "religious belief is a form of life, not a set of propositions":

  1.  **Reading 1: Form of Life as Unreasoned Social Habit (e.g., "just what we do here")**
      *   **Meaning:** Religious practices/beliefs are culturally ingrained customs, learned like language, without needing justification beyond tradition.
      *   **Trivial/Defensible/False?** **Substantive but reductive/partly false.** While habits are involved, this ignores the *intentionality* and *meaning* religious practices hold for participants.
      *   **Blocks Historical Critique?** **No.** Calling something a "habit" doesn't shield its purported historical claims from evidence. A habit can be *based* on a false proposition. This reading *doesn't* protect the resurrection claim.

  2.  **Reading 2: Form of Life as Framework Setting Internal Standards of Reasonableness**
      *   **Meaning:** Religious practice constitutes a distinct "language game" with its own criteria for what counts as meaningful, true, or justified *within* that practice. Evidence (like historical inquiry) from *outside* the form of life may be irrelevant or miss the point.
      *   **Trivial/Defensible/False?** **Substantive and defensible (core Wittgensteinian insight).** Meaning is use within a practice.
      *   **Blocks Historical Critique?** **Potentially, but changes subject.** It argues the *significance* of the resurrection for believers isn't *primarily* a historical-factual claim assessable by secular methods, but a transformative reality within the Christian form of life. It **doesn't prove the resurrection happened historically**, but suggests demanding *only* external historical proof misunderstands its religious role. Critiques from outside seem "unhinged" within the practice. This is likely your friend's intended meaning.

  3.  **Reading 3: Form of Life as Non-Cognitive Emotional Stance**
      *   **Meaning:** Religious belief expresses attitudes, commitments, or feelings (like hope, trust, awe), not factual claims about the world. "Resurrection" symbolizes hope, not a physical event.
      *   **Trivial/Defensible/False?** **Substantive but false/overly reductive.** While emotions are involved, core religious beliefs *do* make claims adherents take as factually true ("He *is* risen").
      *   **Blocks Historical Critique?** **Yes, but dishonestly.** If belief *isn't* making factual claims, history is irrelevant. But this misrepresents most believers who *do* hold the resurrection as a real historical event. It protects the claim by dissolving it into non-cognition.

  **Conclusion:** Reading 2 is the defensible core. It **doesn't settle historical truth** but argues historical critique misses the *religious meaning*. It *changes the subject* from "Did it happen?" to "What role does this belief play?". Your friend misapplies it if he thinks it *proves* historicity or *immunizes* the claim from all discussion – it just shifts the grounds of the conversation. Readings 1 & 3 either fail to block history (1) or radically distort belief (3). Use this to ask: "Are we discussing the *historical evidence*, or the *meaning and function* of the belief within Christian practice? The slogan addresses the latter, not the former."
