answer: |-
  Alright, let's tackle this head-on, avoiding the well-worn path of tables and chairs. The Special Composition Question – under what conditions do things compose a further thing? – often feels like being forced to choose between two equally unsettling options. Universalism tells us *any* arbitrary collection of things, no matter how scattered or unrelated (that random dust mote in Tokyo, your left shoe, and the Andromeda galaxy), compose a genuine object. It grants existence far too generously, making the concept of an "object" almost meaningless. Nihilism, conversely, denies that composition ever truly happens – only fundamental particles exist, and talk of chairs, mountains, or even people is just a useful fiction. This feels deeply counterintuitive and makes our ordinary engagement with the world nonsensical. So, the burning question is: can we find a stable middle ground? A principled restriction on composition that acknowledges genuine wholes without descending into arbitrariness, especially when we consider the stark contrast between fleeting entities like flash mobs and enduring objects like mountains?

  Let's start with the ephemeral. A flash mob gathers in a square, performs a coordinated dance for five minutes, and disperses. An ad-hoc coalition of activists forms to protest a specific policy, achieves its goal or dissolves after a week. These *feel* like real collective entities during their brief existence. They exert causal influence: the flash mob causes surprise and gathers a crowd; the coalition influences media coverage and political debate. They exhibit a kind of internal organization and shared purpose. But what makes them more than just a random collection of people present in the same place? Is it *causal integration*? Certainly, during the dance, the individuals are causally interacting – coordinating movements, responding to cues. The protestors march together, chant slogans, perhaps block traffic, their actions interdependent. This seems crucial. Without that mutual causal influence, it's just a crowd. But is that enough? If causal integration is merely physical proximity and interaction, what distinguishes the flash mob from a chaotic scrum at a train station? Both involve causal interactions. This suggests we might need something more, perhaps *shared intentionality* – the collective intention to perform the dance or achieve the policy change. This shared goal binds the individuals into a unit with a specific function and identity for that duration. When the song ends or the policy decision is made, that shared intention dissolves, and the entity ceases to exist as such. The causal integration was *for* and *directed by* that shared goal.

  Now, contrast this with an enduring physical object – say, a granite mountain. Its parts (countless mineral grains) are bound together by immensely strong chemical bonds, exerting continuous mutual causal influence (gravity, electromagnetic forces) over geological timescales. There's profound causal integration, but absolutely no shared intentionality – rocks don't have intentions. Its persistence seems grounded purely in this stable, continuous physical bonding and the causal powers arising from its specific structure. The mountain weathers storms, erodes, and influences its ecosystem, all due to the robust causal integration of its parts. Its existence as a distinct object isn't fleeting; it endures for epochs.

  So, what does this tell us about composition? If we lean solely on shared intentionality, we grant reality to flash mobs and coalitions but deny it to mountains, rivers, and ecosystems – they become mere collections, pushing us towards a form of nihilism for the non-sentient world. That seems deeply unsatisfactory; the mountain's causal unity and persistence demand recognition. If we lean solely on robust causal integration (like the mountain's bonds), we potentially struggle with the flash mob. While causally integrated *during* the performance, that integration is transient and purpose-driven, lacking the enduring physical bonds of the mountain. Is this brief, intentional integration sufficient? Or is it too weak a criterion, potentially letting in too much if we define "integration" loosely? And what level of causal integration is required? The particles in a gas interact, but we don't typically consider a momentary puff of gas a distinct object in the same way as the mountain or even the flash mob.

  Here's where I think a stable middle ground *can* be found, but it requires a specific kind of criterion: **joint causal capacity grounded in structural unity**. Composition occurs when a collection of entities, by virtue of their specific arrangement, interactions, and relations (their structure), collectively possess and exert causal capacities that are distinct from, and not merely the sum of, the causal capacities of the individual parts considered in isolation. This capacity must be sufficiently cohesive and persistent relative to the context.

  *   **The Flash Mob:** During their performance, the dancers, arranged spatially and temporally, interacting via cues and shared rhythm, collectively possess the capacity to surprise, entertain, and gather a crowd – a capacity none possess alone, nor possessed by the same individuals milling about beforehand. This capacity arises from their structured, intentional coordination. It's real *for its duration*.
  *   **The Ad-Hoc Coalition:** Organized with shared goals and communication, its members collectively possess the capacity to mobilize resources, generate media attention, and exert political pressure – capacities absent without that specific organized structure.
  *   **The Granite Mountain:** Its specific mineral structure, bound by powerful forces, collectively possesses the capacity to resist erosion (for a time), influence local weather patterns, provide a unique habitat – capacities the individual grains utterly lack. This capacity is grounded in enduring physical bonds and persists over vast timescales.
  *   **The Gas Cloud:** While particles interact, the specific arrangement is typically too transient and lacks a cohesive structure generating novel, stable causal capacities *distinct enough* from the summed capacities of individual particles to warrant calling the momentary puff a distinct object. It lacks sufficient unity.

  This avoids universalism: the random collection (dust mote, shoe, galaxy) lacks any cohesive structure generating a novel, unified causal capacity. They don't *do* anything *together* that isn't just the sum of their separate actions. It avoids nihilism: the flash mob, coalition, and mountain *do* possess novel joint causal capacities arising from their specific structural unity, however temporary or enduring.

  Is "joint causal capacity" non-arbitrary? It links composition directly to *what things do* in the world – their causal efficacy. It provides a reason *why* we recognize certain aggregates as wholes: they act as unified agents or forces. It captures the intuition that the whole is sometimes greater than the sum of its parts. Shared intentionality becomes a specific *way* that structural unity and joint causal capacity can arise in the social realm, not the sole criterion. Robust physical bonding is another way it arises in the material realm. The criterion also explains why the flash mob ceases to exist: when they stop dancing, the specific structure generating the joint capacity to perform dissolves.

  So, does restricted composition hold? I believe it does, and this "joint causal capacity via structural unity" provides the stable middle ground. It doesn't collapse into universalism because it demands a specific, non-arbitrary condition – demonstrable, cohesive, novel causal power arising from organization. It doesn't collapse into nihilism because it robustly vindicates the existence of entities ranging from fleeting social groups to enduring mountains, based on their real causal impact on the world. The stability comes from grounding composition in causality itself – a fundamental feature of reality – rather than arbitrary spatial proximity or the equally problematic extremes of "always" or "never." The middle ground holds because it reflects how organized structures, whether held together by intention or electromagnetism, genuinely emerge as novel causal players in the universe.
