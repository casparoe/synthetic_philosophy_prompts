prompt: |-
  I just spent two hours arguing with a close friend about whether any single principle can justify quotas across radically different institutions, and I need that principle turned into an audit tool I can actually use. I serve on a review board that evaluates proposed reservation or quota policies in three contexts—US university admissions, Indian Scheduled Tribe and reservation expansions, and Norwegian corporate board gender mandates—using the principle of restorative proportionality: a quota is warranted only when (i) the group’s current underrepresentation is traceable to a specific, documented institutional exclusion mechanism, (ii) the quota’s scale is calibrated to reverse that mechanism without generating a counter-exclusion of comparable kind, and (iii) no less restrictive structural remedy achieves the same correction. Write a reusable procedural checklist for my board: the ordered diagnostic questions, the evidence standard that satisfies each, the exact termination point for a negative decision, the point where evaluation becomes irreducibly normative and requires board sign-off rather than staff analysis, and explicit misfire warnings. Apply the procedure to three proposals—banning legacy preferences at an elite US university, creating a new tribal reservation category for a mining-affected region in India, and extending gender quotas to boards of Norwegian state-owned energy firms—including one case where the procedure produces an answer I will personally reject. Present the response as exactly five numbered items with no introduction and no conclusion: item one states the first half of the checklist with stopping rules; item two completes the checklist with normative handoffs and misfire warnings; item three applies the procedure to the US university case; item four applies it to both the Indian and Norwegian cases; item five identifies the unwanted outcome case and states precisely what the procedure cannot adjudicate. Keep each item to one or two sentences.
reasoning: |-
  Okay, the user is asking me to create a procedural checklist based on the principle of restorative proportionality for evaluating quota policies across different contexts. They serve on a review board that deals with US university admissions, Indian tribal reservations, and Norwegian corporate gender quotas. They need a reusable tool with specific components: ordered diagnostic questions, evidence standards, termination points, normative handoffs, and misfire warnings.

  The principle they've defined has three key components: (i) tracing underrepresentation to a specific institutional exclusion mechanism, (ii) calibrating the quota to reverse that mechanism without creating counter-exclusion, and (iii) showing no less restrictive structural remedy would achieve the same correction. I need to turn this into a practical audit tool.

  For the checklist structure, I'll break it into two main items: the first covering the diagnostic questions with stopping rules (where a negative answer ends the evaluation), and the second covering normative handoffs and misfire warnings. Then I'll apply this to their three test cases, making sure to include one where the procedure produces an answer they'll personally reject.

  The user wants exactly five numbered items with no introduction or conclusion. Each item should be one or two sentences - this is quite challenging given the complexity, but I'll aim for maximum conciseness while preserving clarity.

  For the US university case (banning legacy preferences), I need to consider if this qualifies as restorative proportionality. Since legacy preferences aren't an exclusion mechanism against underrepresented groups per se, but rather a privilege mechanism, this might not meet criterion (i). The procedure would terminate early.

  For the Indian tribal reservation expansion, I'll focus on whether mining activities constitute an institutional exclusion mechanism. If documented policies caused displacement or harm, this might satisfy (i), but the calibration (ii) and necessity (iii) would require board judgment.

  For the Norwegian case extending gender quotas to state-owned energy firms, if previous exclusion mechanisms are documented and the remedy is proportional, this might pass all checks, but the user mentions they'll personally reject one outcome - probably this one, since they might oppose gender quotas in this context.

  Finally, I need to identify what the procedure cannot adjudicate - likely the value choices involved in judging "comparable" counter-exclusion or "comparable" structural remedies, which remain inherently normative.

  I'll structure the response as:
  1. First half of checklist with stopping rules
  2. Second half with normative handoffs and misfire warnings
  3. Application to US university case
  4. Application to Indian and Norwegian cases
  5. Unwanted outcome case and procedure's limitations
answer: |-
  **1.** Begin with diagnostic questions and stopping rules: (i) Is current underrepresentation linked to a specific, documented institutional exclusion mechanism (evidence: contemporaneous policy records or legislative intent showing causal exclusion)? If no, terminate; (ii) Is the quota's scale calibrated to reverse that specific mechanism without creating counter-exclusion of comparable kind (evidence: demographic modeling showing proportional correction and absence of new group marginalization)? If no, terminate; (iii) Is there no less restrictive structural remedy achieving equivalent correction (evidence: comparative analysis of alternatives like targeted outreach or pipeline programs showing persistent disparity)?

  **2.** Conclude with normative handoffs and misfire warnings: If (i)-(iii) are satisfied, proceed to board sign-off for irreducibly normative judgments on "comparable" counter-exclusion severity and "equivalent" remedy efficacy. Flag misfires: evidence gaps in causal tracing, quota scale exceeding documented exclusion impact, or viable alternatives dismissed without testing.

  **3.** US university legacy ban: Fails (i)—legacy preferences advantage a group but lack documentation as an *exclusion mechanism* causing *underrepresentation* of specific groups; termination at (i) as non-remedial. (No quota proposed; ban is structural but insufficient alone).

  **4.** Indian tribal mining category: Proceeds to board sign-off at (ii)-(iii)—mining permits may satisfy (i) via documented land acquisition policies causing displacement/disenfranchisement; but (ii) requires judging if new category reverses harm without excluding other claimants, and (iii) weighs against land restitution or revenue sharing. Norwegian energy boards: Proceeds to sign-off at (ii)—if prior state ownership rules excluded women, (i) is met; (ii) demands board assess if extension risks counter-exclusion (e.g., qualified minority men); (iii) examines board training mandates.

  **5.** Unwanted outcome: Norwegian case may pass procedurally (if evidence satisfies criteria) but be personally rejected; the procedure cannot adjudicate whether gender exclusion in corporate boards warrants *group-based quotas* versus individual meritocracy—this is the normative core of "comparable" harm and remedy acceptability reserved for board vote.
