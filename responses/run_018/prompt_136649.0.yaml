  - (2) Pure interest/cost shift: 5/10. While costs (like legal penalties) increased, dueling was already risky and costly. The decline doesn't seem solely due to costs because the honor component was strong. Also, the collapse was more abrupt than a gradual cost-based decline would predict.
  - (3) Direct philosophical moral persuasion: 4/10. Moral arguments against dueling had been made for centuries without causing collapse. The actual collapse happened relatively quickly in the 19th century, which suggests other mechanisms were at play.

  Now, we order them from best to worst for explaining the rapid collapse of dueling:

