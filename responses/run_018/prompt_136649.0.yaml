  Let's break down each explanation:

  ### (1) Appiah-style internal contradiction in the honor code
  Kwame Anthony Appiah, in "The Honor Code", argues that moral revolutions occur when a practice becomes internally inconsistent with the honor code of the society. For dueling, the idea is that the honor code that sustained dueling eventually turned against it because it became dishonorable to engage in duels (e.g., because it was seen as un-Christian, or because it conflicted with new ideals of gentlemanly behavior). This can lead to a rapid collapse because once the honor code flips, the practice loses its social foundation.

  Speed and Completeness: This can be quite rapid because it's a shift in the underlying social meaning. However, it may require a triggering event or a series of arguments to expose the contradiction.

  Best Case Study: Dueling itself is a good example, but also footbinding in China (as Appiah discusses) where the practice became associated with national backwardness and thus dishonorable.

  ### (2) Pure interest/cost shift
  This explanation posits that when the economic or personal costs of a practice become too high, or the benefits diminish, people abandon it. For dueling, this might mean that the risk of death or legal penalties became too great relative to the social benefits.

  Speed and Completeness: This might be gradual unless there is a sudden change (e.g., new laws). It may not be as complete because even if costs are high, the practice might persist if there are strong non-material incentives (like honor). Also, it doesn't explain why the practice would collapse entirely rather than just decline.

  Best Case Study: The decline of slavery in some contexts might be tied to economic shifts (e.g., industrialization making slavery less profitable). However, note that in many cases, slavery ended due to a combination of factors including moral persuasion and force.

  ### (3) Direct philosophical moral persuasion
  This is the idea that through rational argument and moral reasoning, people are convinced that the practice is wrong. For dueling, this might involve religious or ethical arguments against killing and violence.

  Speed and Completeness: Moral persuasion is often slow because changing deeply held beliefs takes time. It may not lead to a rapid collapse unless it is part of a broader social movement.

  Best Case Study: The abolition of slavery in Britain is often attributed in part to the efforts of moral campaigners like William Wilberforce. However, even in that case, economic interests and other factors played a role.

  ### (4) Ceremonial-exhaustion model
  The user's model: The practice is maintained by rigid choreography and ritual. When a cohort stops performing the ritual because it feels hollow, the next generation doesn't even see it as a norm. This leads to a rapid and complete collapse because there is no underlying belief to fight for.

  Speed and Completeness: This model predicts very rapid and complete collapse because the practice is only held up by the performance, and once the performance stops, there is no foundation. It doesn't require a battle of ideas or interests, just a loss of meaning in the ritual.

  Best Case Study: The collapse of dueling in Britain in the 19th century, as described by the user. Also, perhaps the decline of formal court etiquette in some societies.

  Now, let's assign scores (out of 10) for how well each explains the speed and completeness of the collapse, particularly for British dueling:

  - (4) Ceremonial-exhaustion: 10/10. This model is tailored for dueling and explains the rapid and complete collapse without a fight. The user's description fits the historical pattern of dueling's demise.
