prompt: |-
  My friend and I spent maybe two hours last night arguing about moral compromise, and I went to bed sure I'd won and woke up not sure at all. Her line is that you don't split the difference with injustice. Mine is that most of collective life is people with different values finding a deal that leaves everyone better off than no deal, and that the gains come from intensity: I let you have the thing you care about twice as much as I do, you let me have mine, and refusing the trade is just losing on purpose. But when I test that against actual cases my gut goes off in different directions:

  - I'm vegetarian and I cook a roast for my dad at Christmas. Obviously fine, not even really a compromise.
  - Budget fight: I want $40M for after-school programs, the other bloc wants $0 and the money for police overtime. We settle on $18M, which I genuinely think isn't enough. Fine, I take it.
  - Sex ed: we wanted comprehensive, they wanted abstinence-only, the deal teaches both. I say fine; she says the curriculum now says something false.
  - Logroll: I vote for your library, you vote for the stadium I think is a boondoggle. This feels worse to me than the budget split even though it's kind of the same shape, and I can't say why.
  - Sentencing commission: I think the right sentence is 20 years, my colleague thinks 5, we agree on 12 to get a unanimous recommendation. Feels bad, like haggling over what someone deserves — but structurally that's the budget case again.
  - Coalition: a group whose flyers I think are racist offers to canvass for our side. Taking the canvassing: fine. Putting my name on the flyer: not fine, even though it changes nothing about the election outcome.
  - Hiring: I think A is clearly the best candidate, everyone else thinks B, and the deal everyone can live with is to hire C, who nobody thinks is best. I go back and forth on this one all day.

  My own attempt: I've started calling the bad kind "enrollment" — the deal doesn't just let the other side have some of what they want, it makes me a co-signer on their position — and there's a separate thing, call it the "ratchet," where a compromise resets the baseline so next time you're defending a weaker version of your own view. So: trade is fine over how much of a good each side gets and over who decides; it's not fine when it enrolls me in a claim I think is false or when what's traded is a judgment about what a person deserves.

  Is there one principle that gets all of that, including why the library/stadium deal feels different from the budget one? Test mine and repair it, tell me which of my verdicts you'd throw out and why, and say what it predicts for the hiring case. Also tell me what would change your mind and where your reasoning is most likely to fail — my worry is that I'm just dressing up "this particular deal makes me feel icky" as a moral distinction.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They had a long argument with their friend about moral compromise, and now they're questioning their initial confidence. The user believes in finding deals where everyone benefits based on intensity of preferences, but their gut reactions to specific cases vary. Their friend argues against compromising on injustice. 

  First, I need to understand the core of their struggle. The user provided several examples where their intuitive judgments don't align with their stated principle. For instance, the budget split feels fine, but the library/stadium logroll feels wrong. They've proposed "enrollment" and "ratchet" as concepts to explain the bad compromises. My job is to test their framework and see if a unified principle can cover all cases.

  Looking at their cases, the key differences seem to revolve around participation in wrongdoing versus policy disagreements. In the budget example, they're just allocating funds—no endorsement of the other side's view. But in the sex ed compromise, they're forced to teach something they believe is false, which is enrollment. Similarly, putting their name on a racist flyer makes them complicit, even if the election outcome doesn't change. 

  The hiring case is tricky. Hiring candidate C isn't endorsing a false claim about who's best; it's a practical solution. But it might involve a ratchet effect if settling for mediocrity lowers standards over time. The user's enrollment concept fits here—compromising on candidate quality without endorsing falsehoods might be acceptable, but the ratchet effect is a concern.

  The user worries their framework is just rationalizing gut feelings. To address this, I need to find a principle that's consistent across cases. Utilitarianism might justify all compromises if outcomes improve, but that clashes with deontological constraints against endorsing falsehoods. Hybrid approaches like rule consequentialism could work, but the enrollment idea seems more robust.

  Testing their enrollment concept: it explains why the sex ed compromise feels bad (teaching false info) and the racist flyer is unacceptable (endorsing racism). The logroll feels worse than the budget split because voting for a boondoggle might be seen as endorsing wasteful spending. However, if the logroll is framed as mutual support without endorsement, it might be permissible. The user's distinction between policy trades and judgment trades (like sentencing) also holds—sentencing feels like haggling over justice, which enrollment captures.

  For the hiring case, enrollment doesn't apply since hiring C isn't endorsing false claims. The ratchet effect might be a concern if it sets a precedent for mediocre hires. But if it's a one-off, it's probably fine, aligning with the user's ambivalence.

  To challenge the user's view, I'd ask if there are compromises that involve enrollment but are justified by overwhelming benefits. For example, endorsing a flawed bill to prevent a worse outcome. The user might still feel uneasy, suggesting their framework prioritizes moral integrity over pure outcomes. Their reasoning might fail when consequences are dire, forcing a trade-off between complicity and preventing harm.

  In conclusion, enrollment and ratchet are useful concepts. The unified principle could be: Compromises are permissible unless they make you complicit in falsehood or injustice, or create harmful precedents. This covers their cases and explains the library/stadium difference (endorsement vs. policy trade). For hiring, it predicts acceptability with ratchet caveats.
answer: |-
  Your struggle is profound because you're wrestling with two powerful moral forces: **consequentialist cooperation** (maximizing good outcomes through deal-making) and **deontic integrity** (refusing to be complicit in wrongdoing). Your "enrollment" and "ratchet" concepts are insightful, but need refinement. Here's a unified framework, tested against your cases:

  ### The Core Principle: **Complicity-Averse Cooperation**
  > **A compromise is morally permissible if:**
  > **1. It improves net welfare (or prevents harm) relative to no deal; AND**
  > **2. It doesn't require you to affirm, participate in, or legitimize an act/claim you judge to be intrinsically wrong.**

  This draws from *rule consequentialism* (condition 1) and *integrity-based deontology* (condition 2). Your "enrollment" is captured by condition 2; "ratchet" is a strategic concern under condition 1.

  ### Testing Your Cases:
  | Case | Your Verdict | Principle Verdict | Why |
  |-------|--------------|-------------------|-----|
  | **Christmas roast** | Fine | ✔️ Fine | No endorsement of meat-eating; you're facilitating *their* choice, not affirming its morality. |
  | **Budget fight** | Fine | ✔️ Fine | No endorsement of injustice; you're allocating resources, not legitimizing police overreach. Welfare improved ($18M > $0). |
  | **Sex ed "both" curriculum** | Fine | ❌ **Not fine** (contra you) | Forces you to **teach falsehoods** (enrollment). You're actively participating in misinformation. |
  | **Library/stadium logroll** | Feels bad | ⚠️ **Context-dependent** | Voting for a boondoggle **affirms its value**. If "logrolling" is transparent (e.g., "I'll support yours if you support mine"), it may avoid endorsement. If presented as independent judgment, it's deceptive enrollment. |
  | **Sentencing commission** | Feels bad | ❌ **Not fine** (contra you) | You're co-signing a judgment about **desert** (enrollment). "12 years" implies a shared moral claim about justice, which you reject. |
  | **Coalition: taking canvassing** | Fine | ✔️ Fine | Accepting help ≠ endorsing their views. No affirmation of racism. |
  | **Coalition: putting name on flyer** | Not fine | ❌ **Not fine** | **Direct endorsement** of racist content (enrollment). Your name signals approval. |
  | **Hiring compromise (C)** | Ambivalent | ⚠️ **Permissible, but risky** | No endorsement of false claims (you're not saying C *is* best). Welfare may improve (hiring > deadlock). *But* "ratchet" risk: normalizing mediocrity. |

  ### Why the Library/Stadium Feels Worse Than Budget
  - **Budget**: You're conceding *amount* (a policy preference), not endorsing the *principle* that police deserve more.  
  - **Library/Stadium**: Voting "yes" on a boondoggle implies you judge it *worthy* of funding (enrollment in a false claim). If the process hides the logroll, it also involves deception.  
  **→ The key is whether the compromise requires you to *misrepresent your judgment*.**

  ### Repairing Your Framework
  1. **"Enrollment" = Moral Complicity**: Not just "co-signing," but *participating in or legitimizing an intrinsic wrong*.  
  2. **"Ratchet" = Dynamic Harm**: A subset of welfare concerns (condition 1), where short-term gains enable long-term harm.  

  **Revised Principle**:  
  *Compromise is permissible if it increases welfare without making you complicit in wrongdoing. "Complicity" occurs when your actions:  
  (a) affirm a false/unjust claim, OR  
  (b) directly facilitate an intrinsically harmful act.*

  ### Where Your Reasoning Might Fail (and Mine Too)
  - **Your blind spot**: Underestimating how *symbolic actions* (voting, signing names) constitute endorsement. Your gut reacts to complicity even when consequences seem unchanged (e.g., the racist flyer).  
  - **My blind spot**: Overemphasizing "affirmation" might reject compromises that prevent catastrophe (e.g., voting for a flawed bill to repeal a worse law).  
  - **The test for bias**: Ask: *"Would I feel ashamed explaining this compromise to someone I respect?"* If yes, complicity is likely involved. Your "ick" factor often tracks moral truth.

  ### Predictions for Hiring Case
  - **Under my principle**: Hiring C is *permissible* if:  
    - Deadlock would cause harm (e.g., lost grant, overworked staff); AND  
    - Hiring C isn't itself unjust (e.g., C isn't unqualified); AND  
    - You don't have to falsely claim C is the "best choice."  
  - **But ratchet risk**: If this normalizes "least-common-denominator" hiring, it may violate condition 1 long-term.

  ### What Could Change My Mind
  1. **If consequences dominate**: Evidence that *refusing* complicity in non-catastrophic cases (e.g., sex ed) causes far greater harm than participating.  
  2. **If affirmation is illusory**: Proof that symbolic acts (e.g., voting) are *never* seen as personal endorsement in real-world politics.  
  3. **If your cases cohere better under pure consequentialism**: If all your "not fine" judgments collapse under pressure (e.g., you'd endorse a racist flyer to stop genocide).

  **Final Thought**: You're not just rationalizing "ick." Your intuitions reveal a truth: **We are responsible not only for what we *cause*, but for what we _affirm_**. The distinction between *allowing* others to act and *joining* their act is where moral compromise lives or dies. Your friend is right that injustice shouldn't be "split"—but sometimes, preventing greater harm requires strategic retreat, not just war. The line is drawn at becoming an agent of the wrong.
