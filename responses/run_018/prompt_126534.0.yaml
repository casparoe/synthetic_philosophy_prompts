prompt: |-
  i sit on my museum's public-program board and lately we're getting exhibit-tie-in proposals that lean hard into pseudohistory: Atlantis as an actual engineering culture, ancient aliens editing cuneiform, and this Russian mathematician's idea that ancient Rome and the middle ages are just duplicated records in a fake chronology (Fomenko's new chronology thing). i need a decision procedure my team can actually run on each pitch in about 15 minutes: questions in order, what counts as a sufficent answer to reject, where the call has to go to a real historian because it's values not facts, and be honest about where the checklist misfires. ground it in whatever philosophy of sicence says about demarcation but keep it practical. apply it to two proposals: one claiming Atlantis was a tech hub in the Aegean, and one pushing Fomenko-style duplicated dynasties. include a case where the procedure says reject but a serious amateur historian might still disagree, and flag what the checklist can't settle.
reasoning: |-
  Okay, the user is on a museum's public-program board dealing with exhibit proposals that include pseudohistory like Atlantis as a real place or Fomenko's New Chronology. They need a practical, 15-minute decision procedure grounded in philosophy of science. Let me unpack their needs.

  First, the main request is a checklist that's efficient and based on demarcation criteria. They want clear questions, rejection triggers, and when to escalate to historians. Also, they need examples applied to two proposals: Atlantis as a tech hub and Fomenko's duplicated dynasties. Plus, a case where rejection might be controversial and the checklist's limits.

  The user's role involves balancing education and entertainment. Pseudohistory might attract crowds but risks credibility. Their deeper need is protecting the museum's integrity while engaging the public. They might also want to avoid internal conflicts by having an objective tool.

  Philosophy of science: Demarcation from Popper (falsifiability), Kuhn (paradigm shifts), Lakatos (research programs). The checklist needs to test for empirical support, methodological rigor, and consensus. Pseudohistory often lacks falsifiability, ignores counter-evidence, and rejects scientific consensus without basis.

  Structuring the checklist: Key questions should cover evidence, falsifiability, methodology, consensus, and motives. Each question needs clear rejection criteria. For example, lack of primary evidence or unfalsifiable claims should trigger rejection. Areas involving values, like interpretation, go to historians.

  Applying to Atlantis proposal: Claims Aegean tech hub. Check evidence—no artifacts, vague sources. Not falsifiable. Ignoers existing archaeology. Rejection justified.

  Fomenko proposal: Claims duplicated dynasties. Evidence is statistical cherry-picking. Unfalsifiable. Rejects carbon dating. Reject.

  Edge case: A serious amateur might challenge mainstream views, like the cause of the Late Bronze Age collapse. The checklist flags consensus deviation but historians should assess if it's a valid scholarly debate. Here, values vs. facts: the checklist can't judge the merit of alternative interpretations, only if they meet scientific standards.

  Checklist limitations: It can't settle novel but untested hypotheses or interdisciplinary conflicts. Also, public interest vs. accuracy is a values decision beyond the checklist.

  Final checklist design: Five questions with flow. Training the team to focus on methodology over content. Documenting decisions for accountability. Emphasizing that rejection isn't about stifling debate but upholding standards.
answer: |-
  Here's a practical 15-minute decision procedure grounded in the philosophy of science (Popper's falsifiability, Lakatos' research programmes, Kuhn's paradigm shifts) with clear rejection triggers, escalation points, and honesty about limitations:

  **The "MUSEUM" Pseudohistory Screening Protocol (15-Minute Version)**

  1.  **M - Material Evidence & Primary Sources (Core Check):**
      *   *Question:* "What **specific, verifiable, primary source evidence** (artifacts, contemporary texts, datable remains) does this proposal directly rely on? Is this evidence widely accessible for scholarly examination?"
      *   **Reject Trigger:** Vague references ("ancient texts," "uncovered artifacts"), reliance solely on secondary interpretations (esp. modern books promoting the idea), claims evidence is suppressed/lost/destroyed, or evidence demonstrably misrepresented (e.g., misdating, mistranslation).
      *   *Philosophy Basis:* Empiricism. Science requires testable evidence. Pseudohistory often relies on absence of evidence, misinterpretation, or alleged suppression.

  2.  **U - Unfalsifiable Core Claims (Key Demarcation):**
      *   *Question:* "Is the **central historical claim** (e.g., Atlantis existed, dynasties are duplicated) stated in a way that *could* be proven false by evidence? What specific evidence *would* falsify it?"
      *   **Reject Trigger:** Core claim is inherently unfalsifiable (e.g., "Atlantis sank without trace," "the conspiracy erased *all* true records," "the duplication is perfect"). Proposer cannot name concrete, plausible evidence that *would* falsify the core claim. Reliance on "absence of evidence is evidence."
      *   *Philosophy Basis:* Popper's Falsifiability. A theory must be testable and potentially disprovable. Unfalsifiable claims are non-scientific.

  3.  **S - Scholarly Consensus & Method (Context Check):**
      *   *Question:* "How does this proposal **engage with established academic methods** (archaeology, philology, textual criticism, carbon dating) and the **overwhelming consensus of relevant experts**? Does it offer a *methodological* critique or just assert a different conclusion?"
      *   **Reject Trigger:** Dismisses mainstream scholarship as "dogma," "corrupt," or "blind." Rejects fundamental, well-validated methods (e.g., stratigraphy, radiocarbon dating, linguistic analysis) without valid scientific counter-arguments. Proposes no coherent alternative methodology.
      *   *Philosophy Basis:* Lakatos' Research Programmes/Kuhn's Paradigms. Science progresses within methodological frameworks. Pseudohistory often rejects the entire framework without offering a viable, testable alternative.

  4.  **E - Explanatory Power vs. Cherry-Picking (Plausibility Check):**
      *   *Question:* "Does this hypothesis **explain *more* of the existing evidence *better* than the mainstream view**, or does it **ignore/dismiss vast amounts of inconvenient evidence** to focus on a few anomalies or perceived similarities?"
      *   **Reject Trigger:** Requires dismissing massive amounts of well-established, cross-verified evidence (e.g., ignores layers of archaeology, diverse textual traditions, independent chronologies). Relies heavily on superficial similarities (e.g., name resemblances, vague architectural parallels) while ignoring profound differences. Creates *more* problems than it solves.
      *   *Philosophy Basis:* Scientific theories are judged on explanatory scope and coherence. Pseudohistory often selectively interprets evidence while ignoring counter-evidence.

  5.  **U - Underlying Motive & Genre (Purpose Check):**
      *   *Question:* "Is the **primary purpose** of this proposal to explore historical evidence rigorously, or is it primarily promoting a **specific ideological, spiritual, or sensationalist narrative** (e.g., lost superior race, global conspiracy, divine intervention)?"
      *   **Reject Trigger:** Clear agenda pushing (nationalism, racial theories, specific religious dogma, sensationalism for profit/attention) that drives the interpretation of evidence, not vice-versa. Framed as "revealing hidden truth" suppressed by elites.
      *   *Philosophy Basis:* Science aims for objective understanding; pseudohistory often serves non-scientific agendas. Motive doesn't *disprove* but is a red flag for methodological bias.
  6.  **M - Museum Fit (Final Filter):**
      *   *Question (After 1-5 Pass):* "Even if technically passing 1-5, does this align with our **mission** (education based on scholarship), **values** (intellectual integrity), and **audience expectations** for credible historical interpretation? Could it be presented *as a belief/myth* without endorsing its historicity?"
      *   **Escalate to Historians/Board:** If 1-5 are *barely* passed but significant scholarly debate exists *within* mainstream methodology (e.g., specifics of Bronze Age collapse, interpretations of controversial inscriptions). Or, if proposing presenting it *as pseudohistory* for critical analysis.
      *   *Philosophy Basis:* Values judgement. Museums have a responsibility grounded in scholarship.

  **Procedure Flow:**
  1.  Assign 2 team members to review the proposal briefly (5 mins).
  2.  Run through MUSEUM questions 1-5 sequentially (1-2 mins per question).
  3.  **ANY** "Reject Trigger" in questions 1-5 = **Reject**. Document which trigger.
  4.  If NO reject triggers in 1-5, discuss Question 6 (Museum Fit) - (2 mins). Decide: Accept, Reject (on mission grounds), or Escalate to Historians/Board.
  5.  Total Time: ~12-15 mins.

  **Application to Proposals:**

  1.  **"Atlantis: Aegean Tech Hub" Proposal:**
      *   **M (Evidence):** Relies on Plato's *Timaeus/Critias* (philosophical allegory, not history), vague "Minoan parallels" (ignoring vast differences like Plato's 9000 BC date vs. Minoan 2000 BC). *Trigger Hit - Vague, Misdated.* **REJECT.**
      *   *U (Unfalsifiable):* "It sank without trace." Unfalsifiable core. *Trigger Hit.* **REJECT.**
      *   *S (Scholarship):* Ignores archaeology/geology showing no evidence of large sunken landmass in Aegean ~9000 BC. Dismisses consensus on Plato's purpose. *Trigger Hit.* **REJECT.**
      *   (Other questions confirm rejection).

  2.  **"Fomenko's Duplicated Dynasties" Proposal:**
      *   **M (Evidence):** Relies on statistical cherry-picking of reign lengths/name similarities, ignores mountains of primary evidence (coins, inscriptions, independent chronicles, archaeology). Claims records are forgeries/duplicates. *Trigger Hit - Misrepresents/Dismisses Evidence.* **REJECT.**
      *   **U (Unfalsifiable):** Any evidence against it (e.g., radiocarbon dates, dendrochronology) is dismissed as part of the "conspiracy" or "fabricated chronology." Core claim unfalsifiable. *Trigger Hit.* **REJECT.**
      *   **S (Scholarship):* Rejects entire methodologies of textual criticism, archaeology, physics-based dating without valid counter-method. Dismisses global scholarly consensus as corrupt. *Trigger Hit.* **REJECT.**
      *   (Other questions confirm rejection).

  **Edge Case: "Reject but Serious Amateur Disagrees" - Example: "The Thera Eruption *Was* the Atlantis Cataclysm"**

  *   **M (Evidence):** Points to real, massive Late Bronze Age eruption of Thera (Santorini), devastating Minoan sites. Uses archaeology/geology. *Pass.*
  *   **U (Unfalsifiable):** Core claim (Thera eruption inspired Plato's Atlantis) *is* falsifiable. Evidence against could include: Plato's date being wildly off, no Thera/Minoan cultural elements matching Plato's description, evidence Plato used other sources. *Pass.*
  *   **S (Scholarship):** Engages with real evidence and mainstream methods (archaeology, volcanology). But... **Trigger Hit?** It *dismisses* the overwhelming scholarly consensus that Plato's story is allegory/philosophical, not a corrupted history. It often *ignores* the specific details in Plato that don't fit Thera (size, location, political structure, 9000 BC date). Rejects literary/classical scholarship consensus on Plato's intent.
  *   **E (Explanatory Power):** Explains the "cataclysm" inspiration well, but *ignores* major parts of Plato's story that don't fit (e.g., the 9000 BC date vs. Thera's ~1600 BC, location beyond Pillars of Hercules, vast size). Cherry-picks similarities. *Trigger Hit - Ignores Inconvenient Evidence.* **REJECT.**
  *   **U (Motive):** Often driven by desire for a "real Atlantis." *Red flag, but not sole trigger.*
  *   **Why a serious amateur might disagree:** They focus on the geological/archaeological evidence for a massive, forgotten catastrophe potentially inspiring myth. They might argue classical scholars underestimate oral tradition/potential Egyptian sources. They see the *core inspiration* as historical, even if Plato embellished.
  *   **What the Checklist Can't Settle:** The checklist **correctly flags the dismissal of literary scholarship consensus and the cherry-picking of Plato's text.** However, it *can't* definitively settle the *degree* to which a real event (Thera) *might* have inspired elements of a later myth (Atlantis). This is where **values and interpretation** come in. The museum must decide if presenting this *specific inspiration theory* (often pushed with pseudohistorical fervor) aligns with its mission, or if it's better addressed within an exhibit on *how myths form* around real events, clearly distinguishing evidence from speculation. **This is where Question 6 (Museum Fit) and historian escalation are crucial.**

  **Honest Limitations of the Checklist:**

  1.  **Novelty vs. Pseudoscience:** It might initially flag a truly novel, radical *but scientifically valid* hypothesis emerging from within the scholarly community (e.g., early plate tectonics). However, such hypotheses usually *pass* M (new evidence/method), U (falsifiable), and S (engage with methodology/peers) even while challenging consensus. Pseudohistory fails these.
  2.  **"Barely Pass" Edge Cases:** Cases like the Thera/Atlantis inspiration theory show the grey area. The checklist identifies methodological flaws (dismissal of consensus, cherry-picking) justifying rejection *for an exhibit endorsing the historical reality of Atlantis*, but doesn't resolve the underlying debate about myth formation. This requires escalation.
  3.  **Interdisciplinary Conflicts:** If a proposal pits one discipline's consensus against another (e.g., textual analysis vs. new physics dating technique), the checklist might struggle. Question 3 (S) would likely trigger, requiring historian/curator escalation to evaluate the interdisciplinary conflict *within* mainstream scholarship.
  4.  **Public Engagement vs. Rigor:** The checklist prioritizes scholarly rigor. It might reject a proposal that is clearly pseudohistorical but would be wildly popular. The museum must own this values-based decision (Question 6).

  **Recommendation:** Train your team on the core concepts (falsifiability, primary evidence, scholarly consensus) using clear examples. Emphasize that the goal isn't to stifle discussion of myths or controversies, but to prevent the museum from *endorsing* interpretations that fundamentally reject established historical methodology and evidence. Document the reason for rejection (which MUSEUM trigger) for accountability. This protocol provides a robust, philosophically grounded, and practical defense against pseudohistory infiltrating your exhibits.
