answer: |-
  Here is a villanelle crafted to embody the structural persistence of imprecise probabilities:

  **The Interval Holds**

  The evidence won't settle to a point,  
  But drifts like fog on contours half-defined.  
  **I will not say less than what I see.**  

  No single measure can the whole appoint,  
  Where contours shift and leave the view confined.  
  The evidence won't settle to a point.  

  This terrain yields no pinnacle to anoint,  
  Just shifting ground where partial truths are signed.  
  **Nor fix the upper edge of certainty.**  

  Each fragile proof a fragment to disjoint,  
  Refusing sums the cautious mind designed.  
  The evidence won't settle to a point.  

  Like constellations missing their appoint,  
  The gaps remain, by reason unconfined.  
  **I will not say less than what I see.**  

  No gamble forced by maximin's constraint  
  Collapses what the open view divined.  
  The evidence won't settle to a point.  

  Ambiguity's no flaw to disappoint,  
  But stable ground where honest doubt's aligned.  
  **Nor fix the upper edge of certainty.**  

  The future rests where possibilities anoint  
  No single chance, but leave the range combined.  
  The evidence won't settle to a point,  
  **I will not say less than what I see,  
  Nor fix the upper edge of certainty.**  
  The truth expands between what is and may.

  ---

  **Structural & Conceptual Breakdown:**

  1.  **Refrains as Bounds:**
      *   Line 1 / Refrain 1 (Lower Bound): "**I will not say less than what I see.**" (Rhyme A1) - Expresses refusal to commit below a minimum probability supported by the evidence.
      *   Line 3 / Refrain 2 (Upper Bound): "**Nor fix the upper edge of certainty.**" (Rhyme A2) - Expresses refusal to commit above a maximum probability justified by the evidence/ambiguity. Both refrains rhyme with the other A-lines ("point," "appoint," "constraint," "disappoint," "anoint").

  2.  **Separate Circulation (Tercets 1-5):**
      *   Stanza 1: Ends with Refrain 1 (Lower Bound).
      *   Stanza 2: Ends with Refrain 2 (Upper Bound).
      *   Stanza 3: Ends with Refrain 1 (Lower Bound).
      *   Stanza 4: Ends with Refrain 2 (Upper Bound).
      *   Stanza 5: Ends with Refrain 1 (Lower Bound).
      *   The two bounds appear *only* in separate stanzas, modeling their distinct, persistent roles as independent constraints that do not converge. The reader experiences them as distinct voices defining the interval's limits.

  3.  **Forced Adjacency (Final Quatrain):**
      *   Line 18: Refrain 1 (Lower Bound): "**I will not say less than what I see,**"
      *   Line 19: Refrain 2 (Upper Bound): "**Nor fix the upper edge of certainty.**"
      *   This adjacent placement is the poem's formal turn, forcing the simultaneous consideration of both bounds. This mirrors the credal set – the interval *is* the representation, defined precisely by holding both limits together.

  4.  **Unresolved Interval:**
      *   The final line (20) explicitly locates belief *between* the bounds: "**The truth expands between what is and may.**"
      *   This emphasizes that the interval remains intact and meaningful; the adjacency of the bounds doesn't collapse it to a point but defines the space where belief genuinely resides ("expands between"). The ambiguity is structural ("stable ground") and necessary ("honest doubt's aligned").

  5.  **Philosophical Resonance:**
      *   Language like "evidence won't settle to a point," "contours shift," "partial truths," "gaps remain," "open view," "ambiguity's no flaw," "stable ground," "honest doubt," "possibilities," "range combined," and "between what is and may" directly evokes the core ideas of irreducible ambiguity, credal sets, and the rejection of forced precision.
      *   The mention of "maximin's constraint" subtly nods to a common decision rule under ambiguity without requiring explanation.
      *   The tone is contemplative ("drifts like fog," "contours half-defined," "constellations missing," "truth expands") and avoids didacticism or jargon, focusing on the lived experience of structural uncertainty.

  This villanelle uses its strict form to enact the philosophical concept: the separate, persistent refrains embody the bounds, their forced adjacency models the credal set, and the final line affirms the unresolved interval as the valid state of belief.
