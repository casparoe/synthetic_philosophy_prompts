  Okay, the user wants me to role-play as Max Weber defending the concept of elective affinity against a counterfactual argument. They're posing a sharp challenge: if you swap Calvinist theology for one that condemns profit-seeking while keeping institutions constant, doesn't that prove cultural values are just narrative gloss with no real causal power?

  Hmm, this is a sophisticated critique. The user clearly understands institutional analysis and counterfactual reasoning. They're testing whether elective affinity holds up against hard-hitting hypotheticals. I need to respond in first person as Weber would - passionate but precise, conceding institutional necessity while defending cultural causality at the core.

  The core tension here is between institutional determinism and cultural agency. User's swap experiment cleverly isolates variables, but misses how motives translate institutions into action. I should attack that gap. 

  First, acknowledge their institutional point - yes, capitalism requires legal/technical foundations. But then pivot: those structures are inert without specific human engagement. Here's where Calvinism's psychological engine matters - it transformed wealth accumulation from temptation to proof of grace. 

  Key distinction: profit-seeking versus systematic reinvestment. Many societies had profit motives; what made capitalism unique was restraint and reinvestment. That's precisely where the Protestant ethic operated. Their counterfactual condemns profit, but the real issue is the moral transformation of accumulation.

  Must emphasize the motivational mechanism. Calvinist anxiety created relentless vocational discipline - not just greed, but methodical self-denial. Remove that, and you get merchant capitalism at best, not rationalized production. 

