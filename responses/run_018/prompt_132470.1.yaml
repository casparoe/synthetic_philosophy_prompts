answer: |-
  *(adjusting pince-nez, leaning forward with intense focus)*  
  Your counterfactual is admirably sharp, but you sever the nerve of lived experience. Hold the institutions constant? Very well. But institutions are skeletons; they require flesh and blood to move. **Where do you think the *drive* to operate that machinery comes from?** Not from the legal code itself, but from the human spirit inhabiting it. 

  You swap out Calvinist predestination for a theology condemning profit-seeking as mortal sin? Then your merchant with access to Roman law, double-entry bookkeeping, and free markets faces a crushing **psychological and ethical contradiction**. The institutional levers exist, yes. But why would he *use* them systematically for endless reinvestment? Why choose restless accumulation over consumption, if his faith brands it as *damnation*? 

  Consider Catholic Europe pre-Reformation: sophisticated financial instruments existed in Florence, trade networks spanned continents. Yet capital flowed into monasteries, land, patronage of the arts – into *status* and salvation through works. The Medici built chapels, not factories. Why? Because the **ethical orientation sanctified** consumption for holy purposes, not reinvestment as an end in itself. The *motive* was different, even if tools were similar. 

  Calvinism provided the unique **psychological engine**: that terrible uncertainty about election, resolved only through unceasing, methodical labor in one's calling. Profit wasn't merely *permitted*; it became a *sign* (never a guarantee) of God's possible favor – but only if reinvested, not spent on indulgence. This transformed acquisition from opportunism into a **systematic ethical duty**. The "spirit" is precisely this: the **moralization and rationalization of accumulation.** 

  Your counterfactual imagines institutions running smoothly with alien values? I say no. Remove this specific ethic, and you get Venetian traders hoarding for palaces, or Hanseatic merchants building dynastic wealth – **not** the relentless, ascetic reinvestment into productive enterprise that defines modern capitalism. The institutions enable, but the Calvinist *Geist* compelled. It directed human energy into that particular channel with unprecedented force. 

  Elective affinity isn't "correlation in fancy dress." It’s the **historical alchemy** where a specific belief system *electrified* existing structures, making them function in a new, relentless way. The causal chain runs through the actor’s transformed conscience: the institutional "how" met the Calvinist "why." Remove the "why," and you may get commerce, but you lose the *spirit* of rational capital accumulation. That spirit breathes life into the machine. Without it, you have mechanics, not momentum.
