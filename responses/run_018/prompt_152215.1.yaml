prompt: |-
  I was talking to my roommate about this moral-uncertainty thing he read on a blog. He summed it up like this: "If you're unsure whether you're a utilitarian or a deontlogist, you just assign credances and do expected value calculus across theories. So if you're 60% deontologist, killing one innocent person is 60% infinitely wrong and 40% okay if it saves five lives. Then you solve for the break-even point and it turns out you should only kill if you save more than 1.67 people per death, which avoids being a pure consequentialist but still lets you trade lives sometimes. He also said this means you might have to do things that are wrong on every theory you consider, like telling a small lie that is mildly bad on utilitarianism but severely forbidden on deontology, because the expectation comes out positive." How fair is that summary? Go through it piece by piece and tell me what a philosopher working on normative uncertainty would accept, what they'd wince at, and what's just confused -- especially the part about multiplying infinite wrongness by 0.6 and the claim that you can end up with actions that are wrong on every theory. Does his conclusion about small lies actually follow?
reasoning: |-
  Okay, the user is asking about their roommate's summary of moral uncertainty. The roommate explained how to handle uncertainty between utilitarianism and deontology by assigning credences and using expected value calculus. They mentioned multiplying infinite wrongness by 0.6 and situations where an action might be wrong on every theory but still have positive expected value. The user wants to know how accurate this summary is, pointing out specific parts like the infinite multiplication and the small lies example.

  First, I need to recall what normative uncertainty theory involves. It's about making decisions when you're unsure which moral theory is correct. The core idea is using expected moral value across theories, weighted by credences. The roommate's summary gets some things right but has significant flaws.

  Breaking it down piece by piece. The assignment of credences (60% deontologist, 40% utilitarian) is standard. Expected value calculus is the accepted approach here. Philosophers like MacAskill and Lockhart support this. So that part is fair.

  Where it gets problematic is multiplying infinite wrongness. Deontology often treats certain actions as absolutely forbidden, meaning infinitely wrong. Multiplying infinity by a scalar is mathematically messy. Infinity times 0.6 is still infinity. That breaks the expected value calculus because any non-zero credence on deontology would make the action infinitely wrong overall. The roommate's calculation suggests a finite break-even point (1.67 lives), but that doesn't hold if the deontological prohibition is truly infinite. So that part is confused and would make philosophers wince.

  The conclusion about small lies is another issue. If a lie is mildly bad under utilitarianism but severely forbidden under deontology, the expected value might be negative if the deontological weight is high enough. However, if the credence on deontology is low, the positive utility might outweigh it. But the claim that the action is wrong on every theory yet recommended by expected value is a known issue. Philosophers debate whether it's acceptable to act against all considered theories. Some, like Sepielli, argue for it under normative uncertainty, but others disagree. So the roommate is correct that this can happen, but it's controversial.

  The user might be interested in the practical implications. They mentioned a small lie scenario, which could relate to real-life dilemmas. The deeper need might be understanding how to make decisions when moral theories conflict, especially in everyday situations. They might also be seeking clarity on whether their roommate's approach is reliable or has pitfalls.

  I should note that while the mathematical approach is valid in theory, its application to infinite values is problematic. Alternatives like lexical priority or variance-based methods exist. Also, the assumption that deontology has infinite disvalue is debatable; some deontologists allow thresholds. But the core idea of expected value under normative uncertainty is accepted, just with caveats.

  In summary, the roommate's explanation is partially correct but stumbles on infinities and oversimplifies the small lies case. The user should be aware of these nuances when considering moral uncertainty in their decisions.
answer: |-
  That's a surprisingly sophisticated summary for a blog post, hitting key ideas in normative uncertainty but also stumbling into deep philosophical and mathematical problems, especially with infinities. Here's a breakdown:

  **What the Summary Gets Right (What Philosophers Would Accept):**

  1.  **Core Framework of Normative Uncertainty:** The idea that if you're genuinely uncertain about which moral theory (utilitarianism vs. deontology) is correct, you should assign credences (degrees of belief) to each theory and then calculate the *expected moral value* of an action across these theories is the central proposal of influential work in normative uncertainty (e.g., William MacAskill, Toby Ord, David Ross, Elizabeth Harman, earlier work by Ted Lockhart). Philosophers working on this generally accept this as the starting point.
  2.  **Assigning Credences:** The idea of assigning a 60% credence to deontology and 40% to utilitarianism is standard practice within this framework. It reflects the agent's epistemic state.
  3.  **Expected Value Calculus:** The core mathematical approach *is* to weight the moral value assigned to an action by each theory by your credence in that theory and sum them up to get the Expected Moral Value (EMV).
  4.  **Break-Even Calculation (Conceptually):** The concept of solving for a "break-even point" where the EMV of killing one person to save others shifts from negative to positive is a natural consequence of applying the EMV framework. The idea that this allows for life-saving actions forbidden by deontology while not permitting them as readily as utilitarianism would is a key motivation for the theory.
  5.  **Actions Wrong on Every Theory Can Be Right All-Things-Considered:** This is a **famous and widely discussed consequence** of the EMV approach to normative uncertainty. It's often called the "problem of "dominance violation"" or the "fanaticism problem". If an action is wrong according to every theory you have credence in, but the *degree* to which it's wrong varies significantly, and your credences are distributed accordingly, the EMV calculation can still recommend it. Philosophers like Andrew Sepielli have explicitly argued this is the correct outcome under normative uncertainty.

  **What Philosophers Would Wince At (Or Find Confused/Problematic):**

  1.  **Multiplying "Infinitely Wrong" by 0.6:**
      *   **The Mathematical Wince:** This is **the core confusion.** Multiplying `∞` by any finite, non-zero scalar (like 0.6) is still `∞`. Infinity isn't a number; standard arithmetic breaks down. Saying "60% infinitely wrong" isn't `0.6 * ∞ = finite number`. It remains `∞`. Deontology treats killing an innocent as categorically forbidden, often interpreted as having *infinite negative disvalue* or *infinitely worse* than any alternative.
      *   **The Consequence:** If deontology assigns `-∞` value to killing an innocent, and your credence in deontology is *any* non-zero value (even 0.0001%), then the expected disvalue of killing one innocent person becomes `(Credence_Deon * -∞) + (Credence_Util * Value_Util) = -∞`. The `-∞` dominates *any* finite positive value from utilitarianism (saving lives). **The break-even calculation breaks down completely.** You could never justify killing the one innocent to save *any* finite number of others under this calculation. The "1.67 lives" figure is nonsensical within this framework if deontology assigns infinite disvalue.
      *   **Philosophical Responses (The Wince & Workarounds):**
          *   **Reject Infinite Disvalues:** Some philosophers argue that no plausible moral theory actually assigns *literal* infinite disvalue to actions. Deontology might assign *lexically prior* negative weight or extremely large finite disvalues, but not true infinity. This makes the math workable but arguably weakens the deontological position.
          *   **Variance-Based Approaches:** Others (e.g., Jacob Ross, Philanthropic Poker) argue that when theories assign vastly different magnitudes (like finite vs. "infinite"), we should be risk-averse. We shouldn't just maximize EMV; we should avoid actions with potentially catastrophic downsides, even if the EMV calculation seems favorable. This would likely prohibit the killing.
          *   **Lexical Priority:** Some frameworks (like Lockhart's earlier work) suggest theories with "higher" values (like categorical prohibitions) lexically dominate those with finite values when the prohibition applies.
          *   **"Moral Hedging":** Another approach suggests minimizing the maximum possible "regret" across theories, which would also prohibit any action forbidden by a theory you have credence in.

  2.  **Oversimplifying Theories:** The summary treats utilitarianism and deontology as monolithic. Utilitarianism has many flavors (hedonic, preference, rule, etc.). Deontology isn't just "killing innocent is infinitely wrong"; it involves complex duties, thresholds, agent-relative constraints, and distinctions (e.g., killing vs. letting die). The "value" calculations are vastly more nuanced.

  **The Small Lie Example:**

  1.  **Does the Scenario Make Sense?** Yes. Imagine:
      *   **Deontology:** Assigns a large finite disvalue `-V_large` (or `-∞`) to lying (say, violating a promise).
      *   **Utilitarianism:** Assigns a small net positive `+U_small` to the lie (e.g., avoids minor embarrassment).
      *   **Credences:** Say 30% Deontology, 70% Utilitarianism.
  2.  **Can EMV Be Positive?** **Yes, potentially:**
      *   If Deontology assigns a large *finite* `-V_large`: EMV = `(0.3 * -V_large) + (0.7 * +U_small)`. If `U_small` is sufficiently larger than `V_large` *relative to the credences* (e.g., `U_small > (0.3/0.7)*V_large`), the EMV is positive.
      *   If Deontology assigns `-∞`: EMV = `-∞`, regardless of utilitarianism's `U_small` or credence (unless credence in deontology is *exactly* zero).
  3.  **Is it Wrong on Every Theory?** According to the description: Yes. Deontology forbids it (`-V_large` or `-∞`). Utilitarianism finds it mildly bad (`+U_small` is positive, meaning it's *good* on utilitarianism in the scenario described). **Here's a crucial nuance:** The roommate said the lie is "mildly bad on utilitarianism." *If* it's truly *bad* (negative) on utilitarianism (`-U_small`), then EMV = `(0.3 * -V_large) + (0.7 * -U_small) = Negative`. It wouldn't be recommended. **For the EMV to be positive while being wrong on deontology, the lie *must* be *good* on utilitarianism (`+U_small`), just perhaps only mildly so.** The roommate slightly misspoke here. The action needs to be *positively valued* by at least one theory you have credence in, even if negatively valued by others.
  4.  **Does the Conclusion Follow?** **Yes, the scenario described (assuming the lie is good on utilitarianism) is a valid example** of the dominance violation problem under the EMV framework. If the EMV calculation comes out positive due to high credence in utilitarianism and a sufficiently large `U_small` relative to the deontological disvalue and its credence, the EMV approach says you should tell the small lie *even though you believe with some credence that it's seriously morally wrong*.

  **Overall Assessment of Fairness:**

  *   **Conceptually Fair:** It accurately captures the core motivation and methodology of the dominant expected value approach to normative uncertainty, including the controversial consequence that an action wrong on every theory can be right (if valued positively enough by one theory weighted by credence).
  *   **Mathematically/Formally Unfair (Specifically on Infinities):** The handling of the "infinitely wrong" deontological prohibition is deeply confused and misrepresents the mathematical problem. The break-even calculation for killing is invalid if infinite disvalues are taken literally.
  *   **Nuance Missing:** It oversimplifies the theories involved and doesn't acknowledge the major philosophical debates and proposed solutions surrounding infinite disvalues and dominance violations.

  **In short:** Your roommate summarized the *spirit* of a significant strand of thought in normative uncertainty quite well, especially the radical implication of potentially acting against all your moral beliefs. However, he fundamentally misunderstood the mathematical intractability of mixing finite credences with literal infinite disvalues in the core example. The "small lie" example *can* work as described, but relies crucially on the action being positively valued by the consequentialist theory. Philosophers accept the *structure* of the argument but vigorously debate its viability, especially when infinities or extreme value differences are involved.
