  2. **Formal**: Mathematical proofs that plural-agency models reduce to standard utility representations.  
  3. **Conceptual**: Philosophical arguments against temporal agency coherence.  

  The user also hints at anxiety about unfalsifiability—a legitimate concern. If every act of self-control becomes "just another equilibrium," the theory explains everything and predicts nothing. That’s methodologically dangerous.  

  For differential predictions: The plural-self view should predict systematic inconsistency in *principled* ways (e.g., context-dependent preference reversals unlike unitary noise), and neural evidence of compartmentalised goal states. Unitary models would expect noise around a stable baseline.  

  Ranking defeaters by severity:  
  1. **Formal collapse** is most lethal—if plural maths reduces to unitary, the whole edifice crumbles.  
  2. **Conceptual incoherence** would undermine foundations but might be patched with new metaphysics.  
  3. **Neuro unification** is thorny but defendable (e.g., "aggregation circuits ≠ unity").  

  The user’s depth suggests they’re preparing for academic debate. Their request for "British English" feels like stylistic precision rather than affectation. I’ll mirror their rigour—no dumbing down.
answer: |-
  Right, let's dissect this trenchant critique of unitary-agent models and evaluate your plural-temporal-agents view with appropriate rigor. We'll address defeaters by category, assess their force, and confront the insulation concern—all while specifying differential predictions. (British spelling and phrasing duly observed.)

  ### Core Differential Predictions of Your Plural-Selves View
  1. **Preference Reversals as Structural, Not Noise**: Unlike unitary models (which treat hyperbolic discounting as a "mistake" or cognitive bias), your view predicts that preference reversals (e.g., choosing £100 now over £150 next week, but reversing if both are delayed) reflect *legitimate, context-specific rational judgements* by distinct temporal agents.  
  2. **Bargaining Signatures**: Acts of "self-control" (e.g., commitment devices like locking away sweets) should show neural/behavioural signatures of *inter-agent negotiation* (e.g., prefrontal "mediator" activation) rather than top-down inhibition.  
  3. **Context-Dependent Authority**: Temporal agents should exhibit *domain-specific rationality* (e.g., "present-self" optimally values immediate rewards; "future-self" optimally discounts long-term risks), not global irrationality.  

  These predictions expose the view to empirical risk: neuroimaging should find dissociable valuation systems across time horizons, while behavioural economics should show "akratic" choices obeying game-theoretic bargaining norms (e.g., Nash equilibria) rather than stochastic errors.  

  ---

  ### Defeaters Ranked by Severity  
  *(Most Damaging → Least Damaging)*  

  1. **Formal Collapse into Unitary Rationality**  
     - **What must be true**: A proof that any "bargaining equilibrium" among temporal agents *necessarily reduces* to a single, coherent intertemporal utility function under standard axioms (e.g., Savage’s expected utility).  
     - **Why most severe**: If plural-agency preferences can be represented as maximising a *single* discounted utility function (e.g., via β-δ models with fixed penalties for inconsistency), the "distinct agents" framing becomes a superfluous metaphor. **A committed defender would concede this as devastating**—it voids the core ontological claim. Reinterpreting the maths would be special pleading.  

  2. **Neuroeconomic Evidence of Unified Valuation**  
     - **What must be true**: fMRI/EEG studies revealing that all temporal discounting—hyperbolic or exponential—is computed by a *single neural valuation system* (e.g., ventromedial prefrontal cortex, vmPFC) with no compartmentalisation of "selves."  
     - **Force**: Highly damaging if robust. If vmPFC activity tracks *consistent* long-term utility across delays (e.g., encoding "global utility" irrespective of temporal proximity), it undermines distinct agents. **Defenders could absorb this** by arguing vmPFC merely *aggregates* local agent bids ("bargaining table" hypothesis) or that neural unity ≠ phenomenological unity. Still, it demands auxiliary assumptions.  

  3. **Conceptual Incoherence of Distributed Temporal Agency**  
     - **What must be true**: A philosophical argument that "rational agency" *requires* diachronic unity (e.g., Parfit-style reductionism showing that "selves" are arbitrary partitions lacking identity conditions).  
     - **Force**: Potentially damaging but absorbable. Critics (e.g., Derek Parfit) argue that partitioning identity over time makes promises/paternalism incoherent. **Defenders can counter** that "agents" are pragmatic fictions for modelling conflicting interests (like corporate subunits), not metaphysically robust persons. Thus, this is **awkward but not fatal**—it challenges framing, not empirical adequacy.  

  ---

  ### Insulation Risk: Theoretical Virtue or Fatal Flaw?  
  Your view **is at risk of insulation** if every behavioural outcome is retrofitted as a "bargaining equilibrium":  
  - *Suicide case*: Choosing immediate pleasure (e.g., heroin use) over survival could be "present-self’s rational dominance."  
  - *Ulysses pact*: Binding oneself could be "future-self’s strategic victory."  
  **This is a flaw**, not a virtue: it risks making the theory *unfalsifiable*. If no act of "akrasia" or "self-control" can disconfirm the model—as both reflect agent-relative rationality—the view loses predictive specificity.  

  **Mitigation**: The theory escapes *total* insulation if it predicts **specific bargaining failures** (e.g., pathological impasse where no Nash equilibrium exists, causing paralysis) or **domain asymmetries** (e.g., health choices show different agent-weighting than financial). Without these, it veers toward tautology.  

  ---

  ### Summary Judgement  
  - **Most lethal defeater**: Formal proof that plural agency reduces to unitary utility maximisation.  
  - **Empirically vulnerable to**: Neuroeconomics showing no neural signature of agent-competition (e.g., identical discounting mechanisms for all time horizons).  
  - **Conceptual awkwardness**: Philosophical objections to temporal agency can be parried by rejecting metaphysical literalism.  
  - **Insulation risk**: A **flaw** unless the model generates unique, testable constraints on bargaining dynamics.  

  Your view’s strength—explaining akrasia as *non-pathological*—becomes its weakness if it cannot predict *when* such bargaining fails or succeeds beyond post hoc storytelling. To avoid this, insist on **quantifiable agent-weighting parameters** (e.g., "present-self’s bargaining power declines with blood glucose levels") that yield novel, falsifiable hypotheses. Otherwise, the unitary agent’s parsimony may prevail.
