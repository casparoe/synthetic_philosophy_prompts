answer: |-
  ## Philosophy of Language & Metaphysics - Final Examination Question

  **Question:** Deflationary theories of truth deny that truth is a substantive property capable of deep metaphysical or explanatory work. Yet, within scientific practice, models containing known falsehoods (e.g., ideal gases, frictionless planes, point masses) are routinely judged as "closer to the truth" or "more approximately true" than competing models, and this judgment is often integral to explaining scientific progress. Analyse whether a deflationist can coherently maintain their core thesis about the non-substantive nature of truth *while* accommodating the intuition that scientific models can be ranked according to their closeness to the truth. In your analysis, critically examine whether invoking the notion of "truth-likeness" or "approximate truth" to explain the success of such idealized models inevitably involves a problematic circularity by surreptitiously relying on a correspondence notion of truth that deflationism explicitly rejects. (25 Marks)

  ---

  ## Model Answer (Approx. 700 words)

  Deflationism, rooted in the redundancy thesis and minimalism, holds that truth is not a substantive property with a deep nature to be uncovered. The truth predicate serves a purely logical or expressive function, enabling generalizations like "Everything Kant said is true" or disquotation ("Snow is white" is true iff snow is white). Crucially, it denies that truth can *explain* phenomena like belief fixation, meaning, or scientific success. However, the scientific practice of ranking deliberately idealized models (e.g., judging the ideal gas law closer to truth than phlogiston theory) presents a significant challenge to this view. Accommodating this intuition while maintaining core deflationism proves difficult and risks circularity when employing "truth-likeness."

  The deflationist cannot easily dismiss the ranking of models as merely pragmatic. While pragmatics (e.g., computational ease, predictive power within a domain) play a role, the persistent intuition is that *accuracy* or *fidelity to reality* underpins such rankings, even when full accuracy is unattainable. The success of a model using frictionless planes in mechanics isn't *just* about convenient calculations; it's seen as capturing *something* fundamental about inertia and motion *more accurately* than alternatives. This success seems best explained by the model being *less false* or *closer to the actual state of affairs*.

  To accommodate this, a deflationist might propose "truth-likeness" as a comparative notion distinct from the simple, non-substantive truth predicate. They might argue that ranking models isn't about "truth" *per se*, but about degrees of *accuracy* or *fit* based on observational consequences or predictive power. However, this move is fraught. Invoking degrees of accuracy or fit implicitly presupposes a substantive standard *against which* the models are being measured – the way the world *actually is*. Defining "closer to the truth" purely in terms of logical relations between sentences (e.g., shared true consequences) fails to capture the robust scientific intuition. Two models can share many true observational consequences while differing wildly in their core theoretical claims about unobservables; science judges the model whose unobservable structure *better corresponds* to reality as closer to truth, even if its predictions are currently identical to a worse model.

  This reveals the core circularity risk: **Using "truth-likeness" to *explain* the success of idealized models inevitably smuggles in correspondence.** The explanation relies on the idea that a model succeeds *because* its structure or content *more closely matches* or *better corresponds to* the mind-independent structure of reality. The very notion of "closeness" requires a metric defined by the target reality itself. Deflationism explicitly rejects truth as a robust correspondence relation providing such a metric. Therefore, invoking truth-likeness as an *explanans* for scientific success presupposes the very substantive, correspondence-based notion of truth that deflationism seeks to eliminate. The deflationist attempts to use a concept ("closer to truth") that, if it is to do the explanatory work required, must be grounded in correspondence, rendering the explanation circular: "Model M is successful because it is closer to the truth (defined by correspondence to reality)." But if truth is merely deflationary, "closer to the truth" lacks the substantive content needed for this explanation.

  Deflationists might retort that "closer to the truth" is merely shorthand for pragmatic virtues like simplicity, scope, and predictive accuracy, without ontological commitment. However, this reduction struggles. Why do models possessing these virtues tend to be predictively successful across diverse contexts? The most compelling explanation remains that they latch onto reality more effectively – an explanation invoking substantive truth. Denying this leaves the convergence and instrumental reliability of science deeply mysterious from a deflationist perspective. Alternatively, they might try to ground truth-likeness in model-theoretic relations (e.g., similarity of structures). Yet, selecting the *relevant* respects of similarity and the *weighting* of different model components again requires an implicit appeal to what *actually matters* in reality – again smuggling in correspondence.

  In conclusion, while the deflationist can *describe* the practice of ranking models using terms like "truth-likeness," they cannot coherently *endorse the intuition* that this ranking reflects a genuine, substantive gradation in fidelity to reality while simultaneously denying truth's substantive nature. Accommodating the scientific intuition robustly requires explaining success via increasing representational accuracy relative to a mind-independent world. Invoking "truth-likeness" to provide this explanation, however, is fundamentally circular for the deflationist, as it implicitly relies on the correspondence notion it rejects. The deflationist thus faces a dilemma: either abandon the core commitment that truth is non-explanatory and non-substantive to make sense of scientific progress, or offer a significantly weakened, purely pragmatic account of "closer to the truth" that fails to capture the robust realist intuition driving scientific practice. The latter seems insufficient; the former is the surrender of deflationism.

  ---

  ## Marking Scheme (Total: 25 Marks)

  To achieve an **A-grade (21-25 marks)**, a response must explicitly identify and analyse the circularity risk inherent in using truth-likeness to explain scientific success from a deflationist standpoint. A **B-grade (16-20 marks)** response will competently oppose deflationism to correspondence theory regarding scientific models but may not fully articulate or analyse the specific circularity problem.

  **Essential Moves & Mark Allocation:**

  1.  **Accurate Exposition of Core Deflationism:** Clearly state the deflationist thesis: truth is not a substantive property, lacks explanatory power, and functions logically/expressively (disquotation, generalization). Denial that truth explains success. **(3 Marks)**
  2.  **Articulation of the Challenge from Idealized Scientific Models:** Explain how the practice of ranking deliberately false models (e.g., ideal gases) as "closer to the truth" than others presents a problem for deflationism. Highlight the intuition that this ranking reflects increasing accuracy/fidelity to reality and seems crucial to explaining scientific progress/success. **(5 Marks)**
  3.  **Analysis of Deflationist Attempts to Accommodate Truth-Likeness:** Examine how a deflationist might try to use "truth-likeness" or "approximate truth" to describe ranking. Critically assess whether this can be done without invoking substantive truth (e.g., reducing it to shared true consequences, predictive power, or pragmatic virtues). Identify weaknesses in these attempts. **(5 Marks)**
  4.  **Explicit Identification and Analysis of the Circularity Risk (Key A-grade differentiator):** Clearly argue that **using truth-likeness *to explain* the success of scientific models inevitably presupposes a correspondence notion of truth.** Explain *why* this is circular for the deflationist: "Closeness" requires a substantive standard (the way the world is) that deflationism rejects. The explanation ("success because closer to truth") relies on the very concept (correspondence) it is supposed to avoid. **(7 Marks)**
      *   *Common Misconception Costing Marks:* Merely stating that truth-likeness *implies* correspondence without showing *how* its use in *explanation* creates circularity for the deflationist project. Or, conflating the *description* of ranking with the *explanation* of success using truth-likeness.
  5.  **Critical Assessment & Conclusion:** Weigh the deflationist's options: Can they genuinely accommodate the scientific intuition without contradiction? Does abandoning robust truth-likeness undermine the apparent objectivity of scientific progress? Conclude with a reasoned judgment on the coherence of deflationism in light of this challenge. **(5 Marks)**

  **A-grade Requirement:** A response scoring 7/7 on Move 4 (Circularity Risk) and meeting the standard for the other moves will typically reach the A-grade band. Missing the depth of analysis on Move 4 caps the response at B-grade.
