answer: |-
  ## The Smooth Utilitarian and the Hesitant Integrity Theorist

  **Scenario:** At 5 PM sharp, Chris (a utilitarian) closes their laptop and leaves work without hesitation, driving straight to their child’s school play. They know their presence matters deeply to their child. Simultaneously, Jamie (an integrity theorist, valuing deep commitments defining the self) also knows the play matters to their child. But as packing up, Jamie pauses: *"Is my commitment to attending truly a constitutive 'ground project' of who I am, fundamental to my integrity, or just a strong feeling right now? Am I acting from my core self or mere inclination?"* After this brief internal check confirming it *is* integral, Jamie also leaves for the play. Both arrive on time.

  **Analysis:**

  1.  **Utilitarian Action (Chris):** Chris acts smoothly due to **internalized dispositions**. Through experience and indirect utilitarianism, they've cultivated reliable habits (like prioritizing key family events) because these *generally* maximize well-being. No on-the-spot calculation is needed; the trained response aligns with likely good consequences. The action flows from character shaped by utilitarian goals.
  2.  **Integrity Theorist's Hesitation (Jamie):** Jamie hesitates because Williams' theory **demands reflective identification** of actions with core, identity-constituting projects. Before acting on a strong desire (even a morally good one), the integrity theorist must verify it stems from a "ground project" rather than a passing whim, to preserve authenticity and avoid "acting out of character." This necessary self-interrogation is the "one thought too many" – the pause to ensure the action coheres with the deep self.

  **The Crucial Feature:** The requirement for **real-time verification of identity-constitution**. This forces the integrity theorist into reflective hesitation even for predictably important actions.

  **Removing the Feature:** If integrity theory didn't require this moment-by-moment self-check for core actions (assuming deep commitments automatically guide without reflection), Jamie might act as smoothly as Chris. The hesitation arises *from* the theory's demand for self-authentication.

  **Williams-Style Defense:** A defender might argue that for *truly* deep commitments (like parenting), the connection to identity is so fundamental that no *occurrent* reflection should be needed; the commitment should manifest unreflectively. They might claim Jamie's hesitation reveals the commitment isn't genuinely "ground project" level yet, or that the example artificially imposes reflection where authentic integrity would act directly.

  **Conclusion:** This reversal shows Williams' "one thought too many" critique cuts both ways. While utilitarianism *can* lead to problematic calculation, Williams' own emphasis on reflective self-constitution *can* create hesitation where smooth, committed action seems appropriate. The necessity of verifying identity before acting introduces its own potential for disruptive reflection in ordinary life.
