  The constraints are strict: ordinary life setting (family/friends/work), no extreme scenarios, both characters share identical facts, same ultimate action, and no character flaws can be artificially imposed. The reversal must emerge naturally from each ethical framework's structure. After the scenario, I need to analyze both theories' responses, identify the key feature enabling the reversal, test its removal, and anticipate Williams-style defenses. Word limit is tight at 450 words.

  Key mechanics to highlight: The utilitarian here employs indirect utilitarianism - they've pre-programmed dispositions through habit, so no calculation occurs in the moment. The integrity theorist, per Williams' own framework, must constantly audit whether commitments are "identity-constituting" rather than superficial before acting. This auditing creates hesitation.

  For the scenario, I'm imagining a common situation: a parent leaving work. The utilitarian has internalized that family time generally maximizes well-being, so they leave promptly when the clock hits 5pm. The integrity theorist, even knowing their child has a recital, pauses to interrogate whether attending is truly a "ground project" or just a fleeting desire. Crucially, both end up attending - the hesitation is purely cognitive.

  In analysis, the critical feature is the requirement for identity-verification in Williams' theory. If removed, the integrity theorist could act unreflectively like the utilitarian. A Williams defender might counter that deep commitments shouldn't require constant checking, but that seems ad hoc - the theory structurally demands reflection to distinguish "projects" from whims.

