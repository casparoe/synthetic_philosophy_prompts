  Alright, here's what I want. You know the Williams line that utilitarianism gives people one thought too many — the husband who has to run the impartial calculus before he saves his drowing wife. I want a thought experiment where the tables are turned: the utilitarian acts smoothly out of a trained disposition with no occurrent calculation, and the integrity-theorist in the same position is the one who pauses and has one thought too many, because their own view makes them check whether the commitment their about to act on really counts as a ground project rather than a passing inclination.

