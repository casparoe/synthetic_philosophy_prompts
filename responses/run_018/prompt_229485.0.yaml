  The "anthropomorphism trap" (treating AI as moral agents), the "accountability void trap" (blaming no one), and the "procrustean bed trap" (forcing outdated models onto new tech). Psychology findings about hindsight bias and control illusions are landmines here - theories contradicting these would crumble in court.

