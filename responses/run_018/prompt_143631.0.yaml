  ## Convergence Theorem (after Lewis)

  **Voice I (If A then B):**  
  *If the sky cracks,*  
  *then the sparrows fall.*  
  *If the clock stops,*  
  *then the shadows crawl.*  

  **Voice II (P(B|A)):**  
  *Given fracture, count the feathers.*  
  *Given stillness, measure night.*  
  *Divide the count by cracks. Divide*  
  *the measured dark by halted time.*  

  **Voice I:**  
  *If the door yields,*  
  *then the secret breathes.*  
  *If the map burns,*  
  *then the pilgrim grieves.*  

  **Voice II:**  
  *The hinge's chance, the sigh's release.*  
  *The ash's weight, the journey's cost.*  
  *Divide the sighs by opened ways.*  
  *Divide the cost by parchment lost.*  

  **The Turn (Independence Fails):**  
  *But mark the chance the sky cracks true,*  
  *and sparrows fall? The "if" demands*  
  *the fracturing must shape the ground*  
  *where falling's measured, feather-light.*  
  *That fragile independence shatters,*  
  *and "if" becomes the cold division's sound:*  

  **Collapse (Single Utterance):**  
  *If A... then B... is P(B|A)...*  
  *The sky cracks? Count the sparrows fall.*  
  *The clock stops? Measure shadows crawl.*  
  *The door yields? Sighs release. The map burns?*  
  *Cost divided. See how this must be?*  
  *But still we say "if"—hear the hollow turn?*  

  ---

  **Structural enactment:**  
  1. **Distinct Voices:** Initial separation (stanzas 1/2 vs 3/4). Voice I uses conditionals ("If...then"), Voice II uses probabilistic language ("Given...Divide...").  
  2. **Convergence Mechanisms:**  
     *   **Rhyme:** Initially separate schemes (I: cracks/stops, fall/crawl; II: feathers/night, divide/time). Later forced into shared rhyme ("shatters" / "sound" bridges; final stanza uses "fall/crawl/release/burns/be/turn").  
     *   **Syntax:** Voice II's "Divide" commands infiltrate Voice I's territory ("Count the sparrows fall," "Measure shadows crawl").  
     *   **Repetition:** "Divide" becomes a dominant, unifying action.  
     *   **Assimilation:** The final stanza blends the conditional form ("If A...then B...") *with* the probability definition ("is P(B|A)..."). The "If...?" questions enact material implication (truth depends only on A false or B true).  
  3. **The Turn:** Explicitly names the failure of independence ("fragile independence shatters") as the mechanism forcing the collapse.  
  4. **The Collapse:** The single utterance merges syntax and function. "If A... then B... is P(B|A)..." is the formal identity. The subsequent lines show the trivialized result: the conditional *is* just the calculation of probability (counting, measuring, dividing) or material truth (if the antecedent is false, the conditional is vacuously true - "The map burns? Cost divided.").  
  5. **Unresolved Tension:** The final line ("But still we say 'if'—hear the hollow turn?") highlights the dissonance between the formal collapse and the intuitive richness of conditionals, without offering resolution.  

  **Philosophical Accuracy:**  
  *   Mirrors the core argument: Assuming P(if A then B) = P(B|A) forces dependence between the conditional and A, or between B and A.  
  *   Enacts the trivialization: The conditional reduces to either the probability calculation itself *or* material implication (the "If A?..." questions).  
  *   Shows the loss of information: The rich hypothetical space ("shadows of what might be" implied in early Voice I) collapses into mere counting, measuring, or vacuity.  
  *   Avoids Stalnaker/pragmatics: The collapse is presented as a formal inevitability within the assumed framework.  

  This poem *performs* the triviality, letting the fusion of form enact the dissolution of the distinction, leaving only the hollow echo of the "if" we still insist on using.
