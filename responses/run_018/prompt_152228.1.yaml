prompt: |-
  I'm running a small philosophy podcast and next week I'm intervewing a legal theorist who defends a tweeked Hartian view: she claims Fuller's eight canons of legality aren't a moral check but just 'epistemic scaffolding' that lets subjects predict state coercion. Draft exactly five interview questions, numbered 1 to 5, each one or two sentences max, with no intro or conclusion, in British English. Each should press where the literature actually presses — include the reply she'll likely give and a sharper follow-up — and I want at least one on whether predictable coercion is already a moral good (so the scaffolding collapses back into natural law), one on unjust but procedurally perfect laws like apartheid pass laws, and one where she deflects with 'that's a research programme, not an objection.' Keep it casual; a typo or two is fine.
reasoning: |-
  Okay, the user runs a small philosophy podcast and is interviewing a legal theorist with a nuanced Hartian view. She positions Fuller's eight canons as "epistemic scaffolding" rather than moral checks—focusing purely on predictability of state coercion. The request is tight: exactly five numbered questions in British English, no fluff, each with her predicted reply and a sharper follow-up. Key angles needed: moral good of predictable coercion (collapse into natural law?), apartheid pass laws as test case, and forcing her to engage when she dismisses objections as "research programmes."  

  Hmm, digging deeper. The user's phrasing—"where the literature actually presses"—suggests they want academic rigor disguised as casual chat. They're likely prepping to challenge a guest who deflects; the "research programme" trap is specifically called out. Unspoken need: questions that sound conversational but surgically expose weaknesses in her epistemic-scaffolding framing. Also, British English means dodging Americanisms like "lawyer" for "solicitor" but keeping it accessible—typos allowed, so no perfectionism.  

  Breaking it down:  
  - Q1 must tackle the morality-predictability slippage. Fuller's defenders (like Dyzenhaus) argue predictability *is* moral; follow-up needs to corner her on whether scaffolding implies thin morality.  
  - Q2 targets historical evil under procedurally "perfect" laws. Apartheid pass laws are ideal—clear, public, non-retroactive... but monstrous. Her reply will likely separate procedure from substance; follow-up should ask if that makes her view complicit.  
  - Q3 anticipates the deflection. When she calls something "a research programme," the follow-up must demand immediate implications—"what would falsify this?" forces engagement.  
  - Q4 questions coercion-centrism. Hartians often reduce law to coercion; Fullerians say law guides behaviour beyond force. Follow-up: what about non-coercive laws?  
  - Q5 probes internal morality. If predictability is the goal, why *these* eight canons? Follow-up challenges redundancy (e.g., clarity vs non-contradiction).  

  User's tone request ("casual; a typo or two is fine") is freeing—lets me use contractions ("isn't it") and colloquial pushes ("doesn't that just sneak morality back in?"). Avoiding jargon like "hermeneutic" keeps it podcast-friendly.  

  Sharpest trap: Q3's structure. Her deflection is predictable, so the follow-up weaponises Popper—if it's unfalsifiable, is it even theory? That’ll ruffle feathers.  

  Final check: all five questions press, per brief. Q1 covers "moral good," Q2 apartheid laws, Q3 the deflection. British English: "properly" over "correctly," "solicitor" not "attorney." Done.
answer: |-
  Here are five interview questions in British English, pressing key tensions as requested:

  1.  If Fuller’s canons just help subjects predict state coercion, isn’t that predictability *itself* a moral good – making your scaffolding collapse back into a thin natural law?  
      *Likely reply:* Predictability is prudential, not inherently moral; it just makes coercion more efficient.  
      *Follow-up:* But doesn't enabling planning and avoiding nasty surprises *for citizens* carry moral weight Fuller spotted, even if you redefine it as 'efficiency'?  

  2.  Take apartheid pass laws: often clear, prospective, stable – procedurally near-perfect scaffolding letting subjects predict awful coercion. Does your view struggle to condemn such laws as properly *unlawful*?  
      *Likely reply:* Those laws were evil substantively, but procedurally functional as epistemic scaffolding; legality and justice are separate.  
      *Follow-up:* Doesn't praising their procedural functionality, even for vile aims, feel like a morally hollow account of legality that Hart himself might have blanched at?  

  3.  Critics argue reducing Fuller to ‘epistemic scaffolding’ ignores how his canons foster agency and respect – that it's *about* subjects, not just predicting coppers. How do you answer that core push?  
      *Likely reply:* That’s conflating aims; my project is explaining how subjects *know* coercion is coming, not justifying it – that’s a different research programme.  
      *Follow-up:* When you deflect to "that's a research programme", what specific test *within your programme* could actually falsify your claim it's *only* about prediction?  

  4.  Hart centred law on rules, not just coercion. Doesn't labelling Fuller's canons mere "scaffolding for predicting coercion" risk reducing all law to orders backed by threats, a view Hart explicitly rejected?  
      *Likely reply:* Not at all; the rules *are* the scaffolding, enabling prediction of institutional (court/police) responses, not reducing law to simple commands.  
      *Follow-up:* But if the ultimate point is *always* predicting state force, doesn't that still flatten Hart’s richer social practice view back towards Austin, just with more steps?  

  5.  Why these *eight* specific canons for epistemic scaffolding? Couldn't predictability be achieved with fewer, or different, purely procedural rules – say, just publicity and prospectivity?  
      *Likely reply:* Fuller argued they form an interlocking set; dropping one (like feasibility or non-contradiction) genuinely undermines reliable prediction in complex systems.  
      *Follow-up:* Isn't that interdependence argument precisely Fuller's point that it *isn't* just scaffolding, but reveals an internal logic law can't properly function without?
