answer: |-
  Here's a comprehensive desiderata list for a theory of scientific idealization, grounded in real scientific practice and addressing the core tensions:

  **Core Functions (What the Theory MUST Explain):**

  1.  **Enable Predictive Success Despite Falsehood:** *Must* explain how models with known false assumptions (e.g., frictionless planes predicting motion trajectories, rational agents predicting market equilibria, simplified climate models predicting global temperature trends) can still yield accurate predictions for specific target phenomena. *Reason:* This is the core puzzle Friedman highlighted; ignoring it renders the theory irrelevant. *Non-negotiable.*

  2.  **Account for Selective Applicability:** *Must* explain why idealized models often work well *only* for specific questions/scales and fail for others (e.g., frictionless plane predicts trajectory but not stopping distance; rational agent predicts market clearing but not bubbles; global climate model predicts temperature but not local rainfall). *Reason:* Universally successful models are rare; idealization inherently involves scope limitation. *Non-negotiable.*

  3.  **Distinguish Useful vs. Useless Falsehoods:** *Must* provide criteria for distinguishing *idealizations* (simplifications that preserve relevant causal structure) from *distortions* (false assumptions that misrepresent core causal mechanisms). *Example:* Omitting air friction (idealization) vs. assuming gravity repels (distortion) for projectile motion. *Reason:* Science relies on this distinction; not all false assumptions are methodologically equal. *Non-negotiable.*

  4.  **Explain How Models Isolate/Ceteris Paribus:** *Must* explain how idealization allows scientists to isolate core mechanisms by "holding other things equal" (e.g., studying supply/demand by assuming "rationality" or "perfect information" to isolate price effects, even if those assumptions are false). *Reason:* Isolation is a primary goal of modeling and experimentation. *Non-negotiable.*

  5.  **Explain Model Development & Refinement:** *Must* account for the process of making models *less* idealized as knowledge advances and demands increase (e.g., adding friction coefficients to mechanics, bounded rationality to economics, detailed cloud microphysics to climate models). *Reason:* Science progresses; idealization isn't static. *Non-negotiable.*

  **Critical Distinctions to Preserve:**

  6.  **Predictive Success vs. Explanatory Depth:** *Must* preserve the distinction between models that predict well but offer shallow understanding (e.g., complex regression model predicting stock prices) vs. models that may have lower predictive power but offer deep causal insight (e.g., idealized predator-prey models explaining population cycles). *Reason:* Captures a fundamental trade-off in scientific practice. *Non-negotiable.*
  7.  **Simplifying vs. Misrepresenting Causal Structure:** *Must* rigorously uphold the distinction from Desideratum 3. *Example:* Assuming spherical cows simplifies mass calculation without distorting gravity's role (simplifying); assuming firms maximize short-term profit *regardless of institutional context* might misrepresent actual decision-making drivers in some markets (potentially misrepresenting). *Reason:* Vital for assessing model credibility and limits. *Non-negotiable.*
  8.  **Target Phenomena vs. Omitted Details:** *Must* clarify *what* the idealization is targeting for accuracy vs. what it deliberately sacrifices (e.g., climate model targets global energy balance, sacrifices regional precipitation detail; frictionless plane targets net force relationships, sacrifices energy dissipation). *Reason:* Essential for understanding model scope and interpreting results. *Non-negotiable.*

  **Contested Ground (Preferences/Debates):**

  9.  **Address Scientists' Reasoning about Realism:** *Should* engage with whether the *intent* or *beliefs* of scientists regarding the realism of assumptions matter (e.g., instrumentalist vs. realist attitudes). *Reason:* Scientists *do* argue about realism, but its necessity for model function is debated. *Preference:* Important for some philosophical camps (realists), less so for others (instrumentalists).
  10. **Link to Justification of Intervention:** *Should* address whether/how idealized models can justify real-world interventions (e.g., economic policy, climate mitigation). *Reason:* This is a primary use of science but raises questions about extrapolating from idealized contexts. *Preference:* Crucial for applied sciences/philosophy of policy, less central for pure theory.
  11. **Epistemic Access:** *May* address whether idealization provides genuine (though partial) knowledge about unobservable structures/causes, or merely summarizes patterns. *Reason:* Deeply philosophical question dividing realists and anti-realists. *Preference.*

  **Key Conflicts & Impossibilities:**

  *   **Friedman's Prediction-Only vs. Policy Justification:** **These are jointly impossible if policy requires causal understanding.** Friedman's strict instrumentalism ("predictions only") cannot justify interventions that rely on manipulating *causes*. If a model predicts higher taxes reduce inflation *only* under the (false) assumption of perfectly rational, frictionless markets, but real agents react differently, the policy based *solely* on prediction may fail disastrously. Justifying intervention typically requires the model to capture *relevant causal mechanisms* reliably, not just output correlations. *This is Friedman's Achilles' heel in policy contexts.*
  *   **Maximal Realism vs. Maximal Simplicity/Tractability:** These are often in tension. A theory demanding all assumptions be strictly realistic (Desideratum 9, realist flavor) would make many powerful, tractable models impossible. Conversely, prioritizing only simplicity/predictiveness risks losing explanatory depth and causal insight (Desideratum 6).

  **Confidence Assessment:**

  *   **Overall Confidence:** High. This list synthesizes core issues debated for decades in philosophy of science, particularly philosophy of economics and physics, reflecting well-established challenges to simplistic accounts like Friedman's.
  *   **Least Confident Desideratum:** **#9 (Scientists' Reasoning about Realism).** While scientists *do* reason this way, whether this reasoning is *essential* to the *function* or *evaluation* of the idealized model itself is highly contentious. Strong instrumentalists argue it's irrelevant; realists argue it's crucial for model development and trust. Pinpointing its *necessary* role in a *general* theory of idealization is difficult. The *fact* of the reasoning is clear; its *mandatory inclusion* as a functional requirement of the theory is the uncertain part.

  This framework pushes beyond Friedman by demanding explanations for *how* idealization works (isolating mechanisms, preserving relevant structure), its *limits* (selective applicability), its *progression*, and the crucial distinctions science relies on, while explicitly highlighting the conflict between pure prediction and causal justification for action.
