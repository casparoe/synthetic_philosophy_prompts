prompt: |-
  hey so im in this philosophy of science elective at my high school and we just talked about Milton Friedmans idea that unrealistic assumptions are fine if predictions work out, my teacher called it the F-twist but im not totally sure thats right. anyway im trying to figure out what an actual theory of scientific idealization is even supposed to do, not just repeat Friedman.

  can you write the full desiderata list for what any theory explaining why scientists use unrealistic assumptions has to deliver? for each one give the case or reason behind it: like physics with frictionless planes, economics with rational agents, climate models that drop cloud microphysics but still nail temperature trends while missing rainfall. also lay out the distinctions it has to preserve - simplifying vs misrepresenting causal structure, predictive success vs explanatory depth, and whether scientists own reasoning about realism matters. flag which ones are non-negotiable and which are just preferences of one camp, and especially say if any pair is jointly impossible - like whether Friedmans prediction-only criterion can survive if we also demand that models justify policy interventions. please also say how confident you are in this list and point out the specific desideratum youre least sure about. and no bibliographies please, i wouldnt be able to verify them.
