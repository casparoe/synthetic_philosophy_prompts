  - Analogical argument: better on (i) but flunks (ii)-(iv); it’s ad hoc about animals/AI.  
  - Simulation theory: nails (i) and (iii) but flunks (ii) and (iv); can’t handle partial transparency.  
  - Direct perception: strong on (i) and (iii), but fails (ii) and (iv) by denying opacity.  

  Non-negotiable vs. preferences:  
  - Non-negotiable: (i), (iii), and (iv). They’re bedrock. (ii) is trickier—some traditions tolerate mind-fragmentation, but I’d argue it’s non-negotiable for coherence.  
  - Camp-specific: None here; all four are genuine demands. The user’s framing suggests they’re all core.  

  Is the problem unsolvable? Not if we embrace embodied/enactive views. They handle asymmetry (i) via participatory sense-making, partial transparency (ii) by degrees of coupling, developmental facts (iii) with pre-theoretic interaction, and (iv) via flexible criteria. But it’s messy—no theory aces everything cleanly.  

