  The user also wants joint unsatisfiability checks—especially (i) and (ii)—and which desideratum kills most theories. They demand committed takes, not hedged answers.  

  Hmm, the core tension is between direct access (naive realism) and inferentialism. If a theory leans too hard on direct perception, it flunks partial transparency (ii) and developmental facts (iii). If it’s too inferential, it botches first-person asymmetry (i) and feels overly intellectual for kids. The killer desideratum is developmental priority (iii): it nukes behaviorism, analogical arguments, and even some TT variants because kids don’t reason like tiny scientists.  

