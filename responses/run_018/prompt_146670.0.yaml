  First, I need to unpack their four stress points:  
  - (i) First/third-person asymmetry without reducing to pure introspection or behaviorism.  
  - (ii) Partial transparency (e.g., knowing beliefs but not qualia) without splitting the mind.  
  - (iii) Developmental priority: kids attribute mental states pre-theoretically.  
