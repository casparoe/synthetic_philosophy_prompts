prompt: |-
  I'm working through the problem of other minds in my graduate philosophy of mind seminar, and I want to stop comparing theories until I have the specification in front of me. Write the full list of desiderata that any adequate theory of other minds must satisfy: the cases it must get right, the distinctions it must preserve, the empirical or conceptual constraints it cannot violate, with the motivating consideration behind each requirement, and mark each as either non-negotiable or as a preference specific to one camp. In particular, include these four stress points: (i) accounting for the first-person/third-person asymmetry without reducing mental access to either direct introspection or behavioral inference alone; (ii) accommodating partial transparency—situations in which an observer can reliably attribute propositional attitudes but not qualitative character, or vice versa—without fragmenting the concept of a single mind; (iii) remaining consistent with the developmental fact that mental-state attribution in children is operationally prior to any explicit theoretical reasoning about hidden causes; and (iv) supplying a principled basis for distinguishing minds in humans, non-human animals, and behaviorally equivalent artificial systems, rather than falling back on arbitrary biological boundaries. Then identify whether any subset of these desiderata is jointly unsatisfiable—especially whether (i) and (ii) can be held together without collapsing into either pure direct perception or pure analogical inference—and say which single requirement eliminates the largest share of mainstream candidates. Briefly score behaviorism, the analogical argument, simulation theory, and a direct-perception or relational view against the list, but keep the weight on the criteria: for each contender, state definitively whether it fails on a non-negotiable ground or only on a camp-specific preference. Take a committed position throughout: do not merely catalog options. Declare which of these desiderata are genuine and which are prejudices of particular traditions, say whether the problem is unsolvable as traditionally framed if the non-negotiable set is jointly inconsistent, and defend your judgments with reasons rather than hedging. No bibliographies, citation lists, or requests for further reading—this is for logical clarification, not for source gathering.
