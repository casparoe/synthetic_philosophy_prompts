prompt: |-
  I've been arguing with my roommate about promises — not just whether breaking them is wrong, but literally why they bind in the first place. Is it because the other person relied on you and you'd cause harm by letting them down? Or is it about your own autonomy, like you exercised some normative power over yourself and breaking it violates your own will? There's also the social practice view, but that's harder to squeeze into a verse form. I'm taking a philosphy course on moral obligation and honestly our discussion just circled back to these two without resolving, which feels like the point.

  I want a villanelle — the 19-line form with two refrains that keep cycling and finally meet in the last quatrain. Make one refrain the reliance-based answer (something about expectation and harm to the other) and the other the autonomy-based answer (something about self-commitment or normative power). The repetition should do philosophical work: the refrains should keep turning through different angles of the same problem, missing each other in every tercet, and then sit side-by-side in the final couplet without reconciling, since that's exactly where the debate lands. Make it accurate enough that someone who's read Scanlon or Raz on promissory obligation recognizes which line is which, but it should still work as a poem if you don't know the literature. Start right with the poem itself, no preface or commentary, please.
reasoning: |-
  Okay, the user is asking for a villanelle that explores two philosophical perspectives on why promises bind: the reliance-based view (harm to others) and the autonomy-based view (self-commitment). They want the refrains to represent these concepts accurately enough for philosophy students to recognize Scanlon or Raz's theories, while still working as standalone poetry. 

  Hmm, they're clearly deep in moral philosophy coursework - the way they frame the "circling without resolution" suggests they appreciate the tension between these theories. The villanelle's repetitive structure is perfect for mimicking that unresolved debate. I should make sure the final couplet presents both refrains equally without synthesis.

  For the reliance refrain, I'll focus on expectation/harm with words like "trust," "harm," or "rely." Scanlon's Principle F comes to mind - that phrasing about "reasonable expectations" might work well poetically. For autonomy, Raz's "voluntary obligation" or "normative power" needs simpler translation - maybe "vow self-wrought" to capture that self-binding quality. 

  The tercets should rotate contexts: maybe starting with a concrete promise (like borrowing bread), moving to abstract obligation, then social dimensions. Each stanza must make both refrains feel inevitable yet incompatible. Trickiest part will be the final quatrain - those last two lines need to sit in perfect, unresolved equilibrium. 

  ...Writing now... The bread image helps ground it, and "unravels trust" for the reliance harm feels right. Autonomy line needs more gravitas - "chains the will" is strong but maybe too negative? No, Raz does frame it as voluntary chains. 

  Final couplet lands well: "gains its force" for autonomy vs "harm when trust recedes" for reliance. Neither concedes. User'll spot "reasonable expectation" as the Scanlon nod. Hope the bread-to-freedom imagery arc satisfies the poetry requirement too.
answer: |-
  ## Promissory (Villanelle)

  A word exchanged, a future gently laid—
  The harm unfolds if expectation dies.
  **A vow self-wrought becomes a debt unpaid.**

  I borrowed bread, you trusted, plans were made;
  My failure now unravels trust's soft ties.
  A word exchanged, a future gently laid.

  Is duty born where my own choice has strayed,
  This norm I forged beneath the watchful skies?
  **A vow self-wrought becomes a debt unpaid.**

  Or does the binding force in you cascade,
  From actions shaped where my assurance lies?
  A word exchanged, a future gently laid.

  Does social fabric hold the pact displayed,
  Or springs the wrong from where your hurt outcries?
  **A vow self-wrought becomes a debt unpaid.**

  This self-made chain: the normative power played,
  Or harm inflicted when the trusted flies?
  A word exchanged, a future gently laid.

  The promise gains its force where choice is weighed;
  **The harm resides where reasonable expectation dies.**
  **A vow self-wrought becomes a debt unpaid.**
  **A word exchanged, a future gently laid.**
