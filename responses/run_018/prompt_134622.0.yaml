  **MEMORANDUM**  
  To: City Monuments Board  
  From: [Your Name], Member  
  Date: October 26, 2023  
  Subject: Recommendation: Rename Brennan Avenue  

  **Recommendation**: Rename Brennan Avenue and install a contextual historical marker at a neutral site (e.g., library or archives) explaining Elias Brennan’s contested legacy, including his engineering contributions and the harms of his eugenic zoning. Timeline: Formal renaming within 12 months; marker installed within 18 months.  

  **Reasoning**:  
  1.  **Street names function as honorifics, not neutral indexes**. Naming public infrastructure after individuals inherently confers communal esteem. Retaining Brennan’s name perpetuates tacit endorsement of his full legacy, regardless of intent. The "twin-plaque" proposal risks moral laundering by pairing Brennan’s name with victims—implying equivalency or redemption where none exists—while forcing marginalized communities to encounter the name daily.  
        
  2.  **Practical risks weighed**:  
      -   *Renaming*: Logistical burden (address updates, signage); potential historical erasure if not contextualized.  
      -   *Keeping name*: Signals indifference to residents’ trauma; legitimizes "great man" history that whitewashes harm.  
      -   *Twin-plaque*: High maintenance costs; plaque fatigue dilutes impact; may amplify Brennan’s presence rather than center victims.  

  3.  **Addressing the strongest counterargument (historians’ indexing concern)**:  
      Historians rightly argue that erasing Brennan’s name obscures a tangible link to complex history. Our solution preserves this link *more ethically*: the archival marker provides nuanced context (aqueduct + zoning harms) without forcing public veneration. It transforms Brennan from a honoree to a case study in how technology and injustice intersect—a deeper historical lesson than a street sign.  

  4.  **Implementation timeline**:  
      -   Month 1–3: Community consultation for new name (e.g., displaced family or civic virtue).  
      -   Month 4–6: Council vote; budget allocation.  
      -   Month 7–12: Address/system updates; sign replacement.  
      -   Month 13–18: Historian-led team designs marker; installation at library/archives.  

  ---

  **Note on Confidence**:  
  Confidence: High (85%) on renaming as the only option avoiding ongoing harm. Moderate (60%) on twin-plaque critique—it could avoid laundering *if* victims’ narratives dominate, but public space dynamics likely privilege Brennan’s name. Least confident in archival marker’s public engagement potential; proactive education (tours, digital links) must accompany it to prevent obscurity.
