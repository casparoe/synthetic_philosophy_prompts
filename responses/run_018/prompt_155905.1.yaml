  Write a proposal for a one-semester philosophy term paper (around 6,000 words) in the philosophy of rationality. The half-formed idea to be developed is this: the standard distinction between optimizing and satisficing depends on treating an agent's aspiration level as an exogenous stopping rule, but this treatment becomes unstable once we recognize that aspiration levels are often revised by properties of the search process itself—fatigue, framing, or local failure—rather than by new information about the option space. To sharpen the issue, you should introduce and defend a conceptual distinction you label the aspiration-lock condition: the thesis that satisficing remains normatively distinct from optimization only if at least one dimension of the agent's aspiration threshold is held fixed relative to the costs of search, and is not itself subject to the same cost-benefit calculus that governs option selection. State the research question precisely: Is the aspiration-lock condition coherent? If coherent, does it mark a genuine normative boundary, or does it merely redescribe meta-level optimization over rules? Explain why existing treatments of bounded rationality leave this open—specifically, why treating aspiration levels as fully endogenous collapses satisficing into optimization, while treating them as fully exogenous makes the view descriptively unrealistic. Outline your method: a conceptual analysis of the lock condition, two structured test cases (one in which the lock holds because a hard constraint prevents downward revision, and one in which endogenous drift dissolves it), and an evaluation of whether adaptive-rationality objections can be answered without circularity. Specify the possible conclusions—salvage of satisficing, collapse into disguised optimization, or exposure of the distinction as purely descriptive—and say which considerations (e.g., whether the fixed dimension can be justified non-instrumentally) would adjudicate among them. Include an 