answer: |-
  ## Exam Prompt: Intergenerational Ethics Final Take-Home  
  **Time Allowed:** 90 Minutes  
  **Question:**  

  The Perturbation-Resilient Nonidentity (PRN) condition reframes the nonidentity problem by asking: (1) Is the *actual set* of future persons invariant under sufficiently small (epsilon) perturbations to present resource-allocation parameters? (2) Should moral obligations attach to features of this "invariance class" (the set of possible future populations resilient to such perturbations) rather than to the particular identities within it?  

  Analyze how this PRN framing affects the classic tension between:  
  - **Harm-to-None (HtN):** "Policy X cannot be wrong because it harms no particular future person (since different persons exist under alternatives)."  
  - **Wrong-to-None (WtN):** "Policy X is still wrong because it creates persons with worse lives than *some* persons *would have had* under an alternative policy, even if those persons are numerically distinct."  

  Does PRN **dissolve** the tension (by resolving the conflict), **relocate** it (to a different conceptual level), or **intensify** it (by strengthening one argument or revealing a deeper conflict)? Defend your position by precisely applying the logic of invariance and class-based obligations.  

  ---

  ## Model Answer (Approx. 700 words)  

  The Perturbation-Resilient Nonidentity (PRN) condition neither dissolves nor straightforwardly relocates the classic HtN/WtN tension; instead, it **intensifies** the normative conflict by exposing a structural wrong irreducible to individual harm, while simultaneously neutralizing HtN’s core objection within the invariance class.  

  **1. PRN Neutralizes HtN Within the Invariance Class:**  
  The HtN argument relies on the non-identity of future persons across policy choices. PRN, however, defines a domain (the "invariance class") where epsilon-perturbations *do not alter the set of possible future persons*. Within this class, all policies produce the *same* numerical individuals. Consequently, HtN’s foundational claim—"no one is harmed because different people exist"—collapses. If Policy A (low conservation) and Policy B (moderate conservation, an epsilon-perturbation of A) both yield identical future populations {P1, P2...Pn}, then comparing A and B *can* meaningfully ask whether A harms specific persons in {P1...Pn} relative to B. HtN loses its nonidentity shield against harm-based critiques *inside* the invariance class.  

  **2. PRN Amplifies and Sharpens WtN as a Class-Based Obligation:**  
  WtN argues that a policy is wrong if it creates a future where lives are worse than those under a feasible alternative, irrespective of identity. PRN elevates this impersonal concern. By focusing on the *invariance class*, PRN forces evaluation of *which set* of possible populations we ought to realize. If Policy A (within Class C1) produces future lives with lower well-being than Policy D (within a *different* invariance Class C2), WtN condemns choosing Class C1. Crucially, this wrong attaches to the *structural features* of the class (e.g., "classes with average welfare < X") rather than harms to specific persons. The obligation is to select the *best feasible invariance class*, not merely the best policy within a class. This makes WtN’s impersonal wrong more salient and fundamental—it becomes a demand to optimize the modal structure of the future itself.  

  **3. The Tension Intensifies:**  
  PRN intensifies the tension in three ways:  
  - **HtN’s Domain Restriction vs. WtN’s Expansion:** While HtN is defanged *within* an invariance class, WtN operates powerfully *across* classes. This creates a new asymmetry: HtN can only object to policies *outside* the selected class (which may be irrelevant if class selection is the primary moral act), while WtN governs the critical choice *between* classes.  
  - **The Emergence of Class-Based Harm:** Within a class, HtN permits harm assessments, but WtN insists harms within a suboptimal class are secondary to the prior wrong of class selection. This creates layered conflict: even if Policy A harms no one *within* its class relative to Policy B (same class), it may still be wrong if its class is inferior to another feasible class.  
  - **Normative Weight Shifts:** PRN makes HtN contingent on modal stability (only applicable inside robust classes), while WtN becomes the primary framework for intergenerational stewardship. The core question shifts from "Did we harm identifiable individuals?" to "Did we responsibly select the best *possible world structure* for future generations?" This heightens the stakes of WtN’s impersonal principles, as they now govern fundamental topology.  

  PRN does not dissolve the tension because WtN’s impersonal demands (select the best class) and HtN’s residual role (assess intra-class policies) remain logically distinct and potentially conflicting obligations. It relocates the *locus* of tension (to class selection) but intensifies it by revealing that the deepest moral failure lies not in harming specific future persons, but in locking humanity into a suboptimal structural pathway—a wrong inherent in WtN’s expanded scope under PRN. The nonidentity problem’s challenge thus sharpens: we owe the future not just non-harmful lives, but the best *possible framework* for existence.  

  ---

  ## Marking Scheme (Total: 25 Points)  

  | **Analytical Move**                                                                                                | **Points** | **Characteristic Failure Mode**                                                                 |
  | :----------------------------------------------------------------------------------------------------------------- | :--------- | :---------------------------------------------------------------------------------------------- |
  | **1. Correctly identifies PRN’s neutralization of HtN *within* the invariance class**                              | 5          | *Failure: Assumes HtN still applies via counterfactuals or conflates identity persistence across classes.* |
  | **2. Explains how WtN transforms into a stronger, class-selection obligation under PRN**                           | 5          | *Failure: Treats WtN as merely empirical (comparing welfare levels) without normative "ought" for class optimization.* |
  | **3. Articulates the asymmetry: HtN constrained (intra-class), WtN dominant (inter-class)**                       | 5          | *Failure: Preserves symmetrical tension or claims PRN eliminates HtN entirely.*                 |
  | **4. Diagnoses intensification: Shows why tension deepens (WtN's primacy, layered obligations, structural wrong)** | 5          | *Failure: Concludes dissolution/relocation without justifying heightened conflict or normative stakes.* |
  | **5. Precision: Uses "invariance class," "epsilon-perturbation," "structural features" correctly throughout**      | 5          | *Failure: Vague handwaving at "groups" or misapplies invariance (e.g., to large policy shifts).* |

  **Grading Notes:**  
  - Award partial credit (e.g., 3/5) for partial execution of a move.  
  - "Dissolve" arguments max at 15/25 if otherwise competent (fails Moves 3 & 4).  
  - "Relocate" arguments max at 20/25 if they miss intensification (Move 4).  
  - Top scores (22+) require precise modal reasoning and clear normative synthesis.  

  This prompt and rubric test structural understanding by forcing engagement with PRN’s modal logic, exposing whether students can re-map classic arguments onto a novel invariance framework without relying on textual recall. The model answer demonstrates the required precision and synthesis.
