prompt: |-
  You are a political philosopher who works on democratic theory and the law of democracy: franchise design, the boundary problem, and the epistemology of collective judgment. I want a consistency audit of a position I have arrived at, and I want you to work in two stages. First, brainstorm: write out the candidate principles that could each generate most of the package below, and be explicit about which of those principles are rivals rather than variants of one another. Only then, second, run the audit against the package. Please reason carefully and step by step, resist the urge to affirm the package as a whole before you have checked what each item commits me to, and keep your answer under about 900 words. No citations, no reading suggestions, no name-dropping of the literature in place of argument: I want the mechanics.

  I sit on a national electoral-law reform commission, and the position below is roughly where I have landed after two years of hearings. It is meant to be defensible to the people we would exclude, not merely convenient.

  1. Inclusion: anyone whose significant interests are substantially affected by a decision has a pro tanto claim to a say in making it. I mean this as the real ground of democratic inclusion, not as a slogan. Exclusions have to be justified to the excluded.

  2. Lower the voting age to 16. The argument I actually find persuasive is longitudinal stake: a 16-year-old will live with the climate, debt, pension, and institutional consequences of this year's decisions for longer than any currently enfranchised cohort, so on my own inclusion principle their claim is among the strongest in the polity. I am unmoved by maturity objections, and I accept that many 15-year-olds are better informed than many 40-year-olds; that does not strike me as a reason to move the line to 15 or to assess anyone individually. One person, one vote: no weighting votes by stake or age, no proxy votes for those below the line. I am also untroubled that we would be legally compelling 16-year-olds to show up while still treating them as minors for contracts, alcohol, and jury service; I do not think consistency requires one uniform age of majority.

  3. Oppose a domicile-based national franchise. Long-term lawful residents who are not citizens should not vote in national elections, even after many years of residence and taxpaying: formally undertaken membership, i.e. citizenship, is the right bright line at that level. But I do support giving them the vote in municipal and regional elections, where what is decided is the provision of local services and the regulation of daily life.

  4. Compel turnout. Attendance required by law, sanctioned by a modest fine, roughly the Australian model, with the ballot secret and a formally counted none-of-the-above option that triggers a fresh election if it wins a majority. I support this for two reasons I hold separately: (a) voluntary turnout is socially skewed, and the skew predictably bends policy toward the already advantaged; (b) a large, broadly representative electorate arrives at better collective judgments than a self-selected one, in something like the way jury-theorem and diversity-of-perspectives results about group judgment suggest.

  5. No competence, literacy, or civic-knowledge test for the franchise, ever. Such tests are exercises of power by whoever drafts and administers them, there is no neutral version of one, and they have been used to disenfranchise the poor and racial minorities.

  6. Voting is at bottom a public office or trust rather than a personal right. The demos is entitled to constitute itself, and someone excluded has no rights-based complaint so long as the scheme of inclusion can be defended by appeal to the common good.

  7. Two case verdicts I am confident about: people with advanced dementia should remain on the electoral roll and may vote with assistance if they wish, and a person who declares total indifference to politics is never, for that reason alone, to be struck off.

  What I want from you: which pairs are genuinely in tension, ranked by severity rather than listed flatly; for each real tension, exactly what I would have to revise or abandon and what that revision costs me elsewhere in the package, since a fix that saves one commitment by wrecking two is worse than its alternative; which apparent tensions dissolve under scrutiny and why; whether any of my items are simply orthogonal, so that the friction I half-suspect is noise; and finally the single revision that does the most repair work, together with whether what survives is a package a theorist could defend in print or only one that sounds coherent in a hearing.

  Please do not tell me which of these views is correct, and do not assume that because I listed something last or flagged it as one I am confident about I have thereby marked it as the weak spot. I genuinely do not know where the fault line is; if I did, I would have fixed the paper myself.
reasoning: |-
  Hmm, the user wants me to act as a political philosopher specializing in democratic theory to audit their position on electoral reform. They've developed this position after serving on a national electoral-law reform commission for two years.

  Looking at their seven principles, I need to first brainstorm the underlying principles that could generate most of these positions. Then I'll conduct a consistency audit by identifying tensions between these principles, ranking them by severity, showing what revisions would be needed, and whether any apparent tensions dissolve under scrutiny.

  For the candidate principles, I see several possibilities. The "Affected Interest Principle" (1) seems foundational for their inclusion argument. "Longitudinal Stake" (2) is a specific application of this. "Territorial Subsidiarity" (3) explains why non-citizens vote locally but not nationally. "Collective Epistemic Value" (4b) supports compulsory voting to improve group judgment. "Anti-Domination Safeguard" (5) rejects competence tests due to historical abuses. "Institutional Office View" (6) frames voting as a public trust. "Non-Paternalism" (7) protects against excluding those with dementia or indifference.

  Now for the audit - there are significant tensions here. The most severe tension is between the Affected Interest Principle and the Institutional Office View. The former says those substantially affected should have a say, while the latter denies any rights-based claim to inclusion. This directly conflicts - one demands justification to the excluded, the other denies they have rights to complain. To resolve this, they'd need to either weaken the Affected Interest Principle to a weaker claim or abandon the Institutional Office View's denial of rights, though both options have costs with other principles.

  Another tension exists between Longitudinal Stake and the rejection of weighted voting. If 16-year-olds have greater longitudinal stake but votes aren't weighted, this creates unequal stake representation. They could abandon longitudinal stake as the justification for including 16-year-olds or accept weighted voting - both would undermine other positions.

  The Collective Epistemic Value and Non-Paternalism principles also conflict. Compulsory voting based on epistemic benefits could be seen as paternalistic, forcing participation for the collective good regardless of individual preferences. To resolve this, they might need to drop compulsory voting or reframe it as non-paternalistic, perhaps as a civic duty.

  Some apparent tensions dissolve under scrutiny, like the different age thresholds for voting versus other rights. Their view that consistency doesn't require one uniform age of majority is coherent. The Territorial Subsidiarity principle also cleanly separates national and local voting for non-citizens.

  The most impactful revision would be to resolve the Affected Interest vs Institutional Office tension by softening the Institutional Office View to allow that exclusion does wrong the excluded if unjustified, while maintaining that voting is an office. This preserves most of the package while eliminating the core contradiction.
answer: |-
  ### Stage 1: Candidate Principles  
  Your package suggests these core principles (rivals marked with †):  
  - **P1. Affected Interest (AI):** Substantial affected interests generate a *pro tanto* claim to inclusion (Item 1).  
  - **P2. Longitudinal Stake (LS):** Duration of future impact strengthens inclusion claims (Item 2).  
  - **P3. Territorial Subsidiarity (TS):** Franchise scope should match decision level (Item 3).  
  - **P4. Collective Epistemic Optimization (CEO):** Legitimacy/judgment quality requires broad, representative participation (Item 4).  
  - **P5. Anti-Domination (AD):** Exclude mechanisms allowing elite gatekeeping over access (Item 5).  
  - **P6. Institutional Office View (IOV)†:** Voting is a public function; no individual *right* to inclusion exists (Item 6).  
  - **P7. Non-Paternalism (NP):** Exclusions cannot rest on judgments of individual capacity/preference (Item 7).  

  **Rivalries:**  
  - **IOV vs. AI/NP:** IOV denies individuals have claims *against* exclusion (Item 6), while AI asserts such claims (Item 1) and NP forbids capacity-based exclusion (Item 7).  
  - **LS vs. Strict Equality:** LS prioritizes *duration* of stake, conflicting with strict "one person, one vote" equality if stake varies (Item 2).  

  ### Stage 2: Consistency Audit  
  #### Ranked Tensions (High to Low Severity):  
  1. **IOV (Item 6) vs. AI (Item 1) & NP (Item 7)**  
     - **Conflict:** IOV states the excluded "have no rights-based complaint" if exclusion serves the common good. But AI demands justification *to the excluded* based on *their* interests, implying they hold a claim. NP reinforces this by barring exclusion for incapacity (e.g., dementia), implying individuals have standing against arbitrary exclusion.  
     - **Revision Cost:**  
       - *Abandon IOV's "no rights" claim:* Saves AI/NP; costs the "public office" framing’s statist emphasis.  
       - *Weaken AI:* Call it a "policy principle" not a claim held by individuals; wrecks Item 1’s core and NP’s force (why justify to the excluded if they hold no claim?).  
     - **Severity:** High – undermines justificatory foundation of Items 1, 3, 7.  

  2. **LS (Item 2) vs. Strict Vote Equality**  
     - **Conflict:** LS argues 16-year-olds have stronger inclusion claims due to longitudinal stake. But you reject weighting votes by stake/age. This creates unequal *moral claims* to inclusion but equal *formal power* – straining coherence. Why amplify voice for high-stake groups if not to reflect weight of interest?  
     - **Revision Cost:**  
       - *Abandon LS as grounds for Item 2:* Use AI alone (all affected have equal claim). Costs the distinctive argument for youth inclusion.  
       - *Accept weighted voting:* Inconsistent with "one person, one vote"; wrecks political equality.  
     - **Severity:** Medium – practical tension, but resolvable if LS is merely a tiebreaker for inclusion thresholds.  

  3. **CEO (Item 4b) vs. NP (Item 7)**  
     - **Conflict:** CEO supports compulsory voting to optimize collective judgment. But forcing participation on the indifferent (protected by NP) is paternalistic: you override their declared preference for the "greater good."  
     - **Revision Cost:**  
       - *Drop compulsory voting:* Saves NP; costs CEO’s epistemic goals and skew mitigation (Item 4a).  
       - *Reframe compulsion as duty, not optimization:* Defuses paternalism but weakens CEO justification.  
     - **Severity:** Low-Medium – NP targets *exclusion*, not participation mandates; tension is indirect.  

  #### Apparent Tensions That Dissolve:  
  - **Item 2 (Voting age 16) vs. Other Age Thresholds:** You explicitly reject uniform age of majority (Item 2). *Dissolves* because thresholds can serve distinct purposes: voting (stake/interest) vs. contracts/juries (capacity/risk).  
  - **Item 3 (Non-citizen exclusion) vs. AI:** TS resolves this – national decisions require formal membership; local services affect residents directly. AI is satisfied by local inclusion.  

  #### Orthogonal Elements:  
  - **AD (Item 5)** is orthogonal: Banning competence tests flows from anti-domination, not AI/IOV tensions. It coheres with NP (Item 7) but doesn’t interact with LS/CEO.  
  - **Item 4a (Turnout skew)** supports CEO but stands independently as an equality concern.  

  #### Single Best Revision:  
  **Revise Item 6 (IOV) to: "Voting is a public office, but exclusions *must be justified to the excluded* based on common good and their interests."**  
  - **Why:** Removes the "no rights-based complaint" contradiction with AI/NP while keeping voting as a trust.  
  - **Cost:** Mildly weakens the communitarian thrust of IOV.  
  - **Surviving Package:** Defensible. AI grounds inclusion; LS/TV/CEO/NP/AD cohere; compulsion remains justifiable as anti-skew/epistemic tool.  

  **Final Diagnosis:** The core tension (IOV vs. AI) is severe but fixable with moderate revision. The revised package holds under a "stakeholder trusteeship" model: inclusion derives from affected interests (AI), participation is optimized for legitimacy (CEO), and exclusions are barred where manipulable (AD) or paternalistic (NP). A theorist could defend this without glaring inconsistencies.
