  Looking at the Buddhist angle, anatta in Abhidharma denies a permanent self, emphasizing impermanent aggregates. Gregor's mental continuities (feelings, perceptions) could be seen as the aggregates persisting, but the lack of a cohesive self. The family's labeling reflects dependent origination—identity depending on form and function. When Gregor's body changes, the label "Gregor" no longer applies conventionally.

