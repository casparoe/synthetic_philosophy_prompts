prompt: |-
  Been lurking rationalist spaces for years and now I'm actually trying to parse the value-pluralism stuff people gesture at. In a thread about career vs family tradeoffs someone said "if values are truly incommensurable there's just no rational basis for picking, you're literally flipping a mental coin." I feel like that one sentence is smugling in like five different philosophical claims. Can you separate the precise theses it could stand for? Like: no shared cardinal metric? An ordinal gap that can't be bridged? The parity thesis where options are on a par but not equal? Practical reason being normatively incomplete? Or the hidden-variable idea that if you dig deep enough you'll always find a tiebraker? For each one say whether it's a platitute, whether it's defensible, and whether it actually supports his "flip a coin" conclusion. I think people conflate the parity reading with the hidden-tiebreaker mistake but I'm not sure which is which.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been engaging with rationalist discussions, especially around value pluralism, and came across a statement about incommensurable values leading to coin-flip decisions. The user feels this oversimplifies complex philosophical ideas and wants clarity on the different theses embedded in that claim.

  First, I need to identify the core concepts the user mentioned. They listed several possibilities: no shared cardinal metric, ordinal gaps, parity thesis, normative incompleteness, and hidden tiebreakers. Each of these needs to be examined for plausibility, defensibility, and whether they support the coin-flip conclusion.

  Starting with the cardinal metric thesis. This is the idea that values can't be measured on a single scale, like money. That seems plausible. People often struggle to compare things like career satisfaction versus family time. But does this force a coin flip? Not necessarily. Satisficing or qualitative reasoning can still guide decisions without exact metrics. So while defensible, it doesn't automatically lead to flipping a coin.

  Next, the ordinal gap. Here, values are incomparable even in a rough ranking. This is stronger and more controversial. Philosophers like Raz argue for this, but others point out that humans often find ways to compare. If true, it might justify randomization, but its plausibility is debated. The user might be conflating this with the less extreme cardinal claim.

  The parity thesis comes up. Chang's work suggests options can be on par—neither better nor equal, but comparable through other relations. This is defensible and avoids the coin flip by allowing nuanced judgment. It's a middle ground that the original statement might overlook. The user suspects confusion between parity and hidden tiebreakers, so highlighting this distinction is key.

  Normative incompleteness is about practical reason not dictating every choice. This seems obvious; not all decisions have a single rational answer. But even then, flipping a coin isn't the only option. Deliberation can still occur, and decisions can be made based on context. So while plausible, it doesn't mandate randomization.

  Hidden tiebreakers suggest there's always an unconscious preference. Psychological studies show default effects, but insisting on always having a tiebreaker might be overconfident. While sometimes true, it's not a given. This thesis is often conflated with parity, but they're different—parity accepts genuine comparability issues without hidden factors.

  The user's deeper need seems to be clarifying these concepts to better engage in rationalist debates. They might want to avoid oversimplifications and understand when randomization is truly justified. They also hint at frustration with smug assertions that mask philosophical complexity. Addressing each thesis's nuances and their implications for decision-making will help them navigate these discussions more effectively.

  I should ensure each thesis is clearly defined, assessed for plausibility, and checked against the coin-flip conclusion. Highlighting where conflation happens (especially between parity and tiebreakers) is crucial. Emphasizing that most theses don't inherently require coin flips, except possibly the strong ordinal gap, can empower the user to critique such statements accurately.
answer: |-
  You're absolutely right - that single sentence is a philosophical minefield masquerading as a conclusion. Let's dissect the five core theses it smuggles in, evaluating each for plausibility, defensibility, and whether it actually forces the "flip a coin" outcome:

  1.  **The "No Shared Cardinal Metric" Thesis:**
      *   **Thesis:** Values like "career fulfillment" and "family closeness" cannot be reduced to a single quantitative scale (e.g., utils, dollars, happiness points) that allows precise trade-off calculations ("Family is worth exactly 1.7x career points").
      *   **Platitude?** No. While intuitive to many, it's a substantive claim challenged by utilitarians, economists, and some decision theorists who believe cardinal representations are possible (even if difficult).
      *   **Defensible?** **Highly defensible.** Most value pluralists (Berlin, Nagel, Williams, Nussbaum) and critics of utilitarianism argue convincingly that qualitatively distinct values resist such reduction. The phenomenology of tough choices often feels like comparing apples to oranges.
      *   **Supports Coin Flip?** **No.** This only denies *precise calculation*. Rational choice can still involve satisficing, qualitative weighing ("family feels *significantly more important* right now"), rule-following ("prioritize family commitments"), recognizing lexical priorities ("safety first!"), or accepting "good enough" options. Coin flipping is overkill.

  2.  **The "Ordinal Gap / Radical Incomparability" Thesis:**
      *   **Thesis:** Values are so fundamentally different that we cannot even establish a stable *ordinal ranking* (better/worse/equal) between options embodying them. Not only can you not say "A is 1.7x better," you genuinely cannot reliably say "A is better than B," "B is better than A," or "A and B are equally good" in the relevant choice context.
      *   **Platitude?** No. This is a much stronger and more controversial claim than (1).
      *   **Defensible?** **Debatable, but plausible.** Defended by thinkers like Joseph Raz ("The Morality of Freedom") in specific contexts. It captures the feeling of being utterly "torn" where neither option seems rationally preferable. Critics argue humans *do* eventually rank options, suggesting comparability *is* possible, even if messy.
      *   **Supports Coin Flip?** **Potentially, but not necessarily.** If options are *truly* incomparable in the ordinal sense, standard rational choice models *do* break down. Flipping a coin becomes one way to resolve the impasse. However, alternatives exist: picking based on commitment (Sartre), default rules ("when torn, choose stability"), or simply accepting that *any* choice involves creating reasons post-hoc (Williams). Coin flipping is *a* rational response under radical incomparability, but arguably not the *only* one.

  3.  **The "Parity" Thesis (Ruth Chang):**
      *   **Thesis:** Options can be "on a par." This means they are comparable, but neither is better than the other, nor are they exactly equal. Parity is a *fourth* value relation beyond "better," "worse," and "equal." Choices involve non-quantitative "swing" factors like will, commitment, or personal identity that tip the balance without being external tiebreakers.
      *   **Platitude?** No. This is a sophisticated and relatively recent development (Chang's work) specifically designed to avoid the pitfalls of both equality and incomparability.
      *   **Defensible?** **Highly defensible and increasingly influential.** It accurately describes many hard choices where options are qualitatively different, neither trumps the other, yet the choice isn't arbitrary like flipping a coin. It explains why we deliberate meaningfully even when options aren't strictly ranked.
      *   **Supports Coin Flip?** **Absolutely not.** Chang's core argument is that parity *rejects* the idea that hard choices require coin flips or indicate incomparability. Rational choice under parity involves *creating* reasons through commitment or will, not discovering pre-existing ones or resorting to randomization. Flipping a coin would be an abdication of agency according to this view.

  4.  **The "Normative Incompleteness of Practical Reason" Thesis:**
      *   **Thesis:** Reason alone cannot always dictate a single correct answer to a value conflict. The normative space (the space of "shoulds") is sometimes indeterminate or "gappy" for particular agents facing specific choices.
      *   **Platitude?** No. While acknowledging reason's limits might seem obvious, strong rationalist or utilitarian traditions often assume reason *can* always find the optimal answer.
      *   **Defensible?** **Very defensible.** Supported by pluralists (Berlin, Williams) and moral particularists. Experience suggests reason often underdetermines choice between genuinely valuable but conflicting options.
      *   **Supports Coin Flip?** **Not inherently.** Incompleteness means reason doesn't *force* one option; it doesn't mean reason is *silent*. Reason can still rule out bad options, identify relevant considerations, and frame the decision. Agents can use non-rational (but not necessarily *irrational*) processes like commitment, intuition, tradition, or even randomization to *complete* the decision where reason leaves off. Flipping a coin is *one* possible completion mechanism, but far from the only or always best one.

  5.  **The "Hidden Tiebreaker" Thesis:**
      *   **Thesis:** There is *always* a latent preference, subconscious value, or implicit weighting that breaks the tie, even if the agent isn't consciously aware of it. The appearance of stalemate is illusory.
      *   **Platitude?** Yes, within certain psychological or strongly rationalist frameworks. It's a common default assumption ("you *must* prefer one deep down").
      *   **Defensible?** **Weakly defensible at best, often a mistake.** It's psychologically plausible *sometimes* (revealed preference, implicit bias). However, insisting it's *always* true risks being unfalsifiable dogma. It dismisses the genuine phenomenology of hard choices described by theses (2), (3), and (4). Value pluralism directly challenges this assumption.
      *   **Supports Coin Flip?** **Contradicts it.** This thesis *denies* the premise of genuine stalemate that would necessitate flipping a coin. If a hidden tiebreaker *always* exists, the rational course is introspection or analysis to uncover it, not randomization. The coin-flip suggestion implicitly *rejects* this thesis for the choice at hand.

  **Conflation & Your Suspicions:**

  *   **Parity vs. Hidden Tiebreaker:** You're spot on. This is the key conflation. The original statement ("if incommensurable... flip a coin") jumps from acknowledging a problem (incommensurability) to the coin-flip conclusion, bypassing the nuanced middle ground offered by **Parity (3)**. Parity *accepts* the challenge but argues for a rational resolution beyond calculation or randomization. The "hidden tiebreaker" view **(5)** simply *denies* the problem exists at all ("there's always a preference!"), which is often an unreflective dismissal of the genuine difficulty captured by (2), (3), and (4).
  *   **The Coin-Flip Leap:** The statement makes a huge leap. Only the strongest form of **Radical Incomparability (2)** *might* directly imply coin-flipping as a rational resolution (and even then, it's debatable). The more common and defensible theses **(1 - No Cardinal Metric)** and **(3 - Parity)** and **(4 - Normative Incompleteness)** emphatically **do not** lead to that conclusion. They describe spaces where rational deliberation, commitment, satisficing, rule-following, or qualitative judgment operate meaningfully *without* precise calculation *or* randomization.

  **Conclusion:**

  The original statement likely conflates **the absence of a cardinal metric (1)** (defensible) with **radical incomparability (2)** (more controversial), ignores the crucial **parity thesis (3)** (which directly refutes the coin-flip conclusion), and implicitly rejects the **hidden tiebreaker thesis (5)** for the specific choice. While **normative incompleteness (4)** is real, it doesn't mandate coin-flipping.

  The "flip a coin" conclusion is only weakly supported by the most extreme reading of value pluralism (radical incomparability) and is actively countered by the more nuanced and defensible parity view. The statement oversimplifies a complex philosophical landscape and prematurely forces a conclusion that neglects the rich possibilities for reasoned (though not calculated) choice in the face of plural values. Your instinct to dissect the smuggled premises is exactly right.
