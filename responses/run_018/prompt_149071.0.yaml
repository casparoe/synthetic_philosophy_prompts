  ### Exercise Design: Experiencing Family Resemblance in "Binding Acts"

  #### **Goal**  
  To demonstrate that the concept of "binding acts" is held together by overlapping similarities (family resemblance) rather than a shared essence, using an invented domain to avoid reliance on real-world analogues.

  ---

  ### **Materials**  
  - **10 Vignettes** (printed for each student): Invented practices where one party undertakes a commitment to another through a marker, with extreme formal variation. None share a single defining feature.  
    *(Constructed to ensure no necessary/sufficient feature exists: Each "binding act" shares features with some but not all others, and non-binding acts share features with binding acts.)*  

    1. **Silent Token Exchange** (Merfolk): Two individuals exchange smooth stones at dawn by a river, then throw them in simultaneously. No words are spoken.  
    2. **Ambiguous Gesture** (Zalt Traders): A circular finger motion with direct eye contact, binding only if performed atop violet sand. Used otherwise for greetings.  
    3. **Digital Acknowledgment** (Veridia): Clicking a gray button that appears when both users type "123" in a private chat. No verbal/physical component.  
    4. **Light-Dependent Posture** (Nocturnals): Standing on one leg with arms extended, binding only when first sunlight hits a specific crystal. Meaningless otherwise.  
    5. **Whispered Name** (Kael): Whispering another’s full name three times into a hollow log from a lightning-struck tree.  
    6. **Shifting Sands Oath** (Tidalia): Writing names in wet sand as the tide recedes. Binding only if washed away by the next wave.  
    7. **Invisible Ink Pact** (Unseen): Writing a promise in invisible ink; binding only when both parties blow on the paper simultaneously to reveal it.  
    8. **Echo Binding** (Echo Valley): Shouting a promise into Canyon A; the other must echo it into Canyon B. Binding only if echoes overlap perfectly.  
    9. **Gift Offering** (Daria): Presenting a flower to a host upon entering their home. Host smiles. No commitment implied. *(Non-binding)*  
    10. **Chant of Greeting** (Ardia): Chanting "Sun and rain, we meet again" when friends meet. No commitment. *(Non-binding)*  

  - **Whiteboard** to record features and sortings.  
  - **Timer** for strict phase management.  

  ---

  ### **Timeline (75 Minutes Total)**  

  #### **Phase 1: Introduction (5 min)**  
  - **0–1 min**: Define "binding act": "A social practice where one party undertakes a commitment to another through an explicit or implicit marker."  
  - **1–3 min**: Distribute vignettes. Emphasize: "These are invented practices. Avoid real-world analogies."  
  - **3–5 min**: Form pairs (7 pairs for 14 students). Explain task:  
    > "Sort the 10 vignettes into GENUINE binding acts (BA) and NOT binding acts (NBA). You must agree on **one feature** that is **necessary and sufficient** for BA. Write it down. Be prepared to defend."  

  #### **Phase 2: Pair Sorting (15 min)**  
  - **Task**: Pairs sort vignettes into BA/NBA and define one essential feature (e.g., "requires a physical object," "involves sound").  
  - **Incentive Structure**:  
    - Pairs earn **1 point per vignette** sorted consistently with their feature (e.g., if BA must have "physical object," all BA in their list have it, all NBA lack it).  
    - Maximum 10 points for perfect internal consistency.  
  - **Monitor**: Circulate to ensure pairs commit to one feature. Redirect abstract proposals (e.g., "creates commitment") by asking: "What observable marker in the practice shows this?"  

  #### **Phase 3: Pair Presentations (15 min)**  
  - **5–20 min**: Each pair has 60 seconds to:  
    1. State their essential feature.  
    2. List their BA (e.g., "We chose 1, 2, 4, 5, 6, 7, 8 as BA").  
  - **Instructor Action**: Record each feature and BA list on the board. Do not comment.  

  #### **Phase 4: Counterexample Testing (20 min)**  
  - **20–40 min**: Test each feature against **all 10 vignettes** as a class:  
    - For a pair’s feature, ask: "Is this feature **necessary**? Find a BA *from any pair’s list* that lacks it."  
    - Then: "Is it **sufficient**? Find an NBA *from the vignettes* that has it."  
    - **Scoring Update**:  
      - Pairs lose **1 point** per counterexample (necessity or sufficiency failure).  
      - **Bonus Round (optional)**: If a pair revises their feature to "save" it against one random counterexample (e.g., "Our feature was ‘sound’—we revise to ‘sound or light’ to include Vignette 4"), they regain 2 points. Class votes on whether revision works.  
  - **Predictable Issues**:  
    - **Abstract Feature Trap**: A pair proposes "intent to commit." *Handling*: Ask: "How do you *observe* intent in Vignette 9? The description says it’s a greeting." Force them to ground in observable markers.  
    - **Nihilism**: A pair declares, "No feature works; the category is arbitrary." *Handling*: "Let’s see what the group does. How might we explain why most included Vignette 1?"  

  #### **Phase 5: Overlap Mapping (10 min)**  
  - **40–50 min**: Class consensus on BA: Tally all BA votes (likely 1–8). List them (1–8).  
  - **Activity**: For each BA (1–8), ask: "What features does it share with others?" (e.g., Vignette 1 and 6 both involve nature; 5 and 7 both involve breath). Map overlaps on the board.  
  - **Reveal**: No single feature covers all BA, but each shares at least one feature with another, forming a "network."  

  #### **Phase 6: Debrief (10 min)**  
  - **50–60 min**: Connect to Wittgenstein:  
    - **Initial confidence**: "You started by seeking an essence—like philosophers expecting rigid definitions."  
    - **Counterexamples**: "Each failure mirrors Wittgenstein’s point: No necessary/sufficient condition captures use."  
    - **Abstract features**: "Proposing ‘commitment’ is like defining ‘game’ as ‘competition’—it ignores cases like solitaire."  
    - **Overlap recognition**: "Your network of similarities *is* family resemblance. Concepts are held together by criss-crossing features, not an essence."  
  - **Final note**: "This is why Wittgenstein says meaning is use: We learn ‘binding act’ by seeing examples, not memorizing rules."  

  #### **Buffer (5 min)**  
  - **60–75 min**: Address questions. Pre-empt common issues:  
    - If students resist family resemblance: "Does overlap feel ‘sloppy,’ or does it reflect how we actually categorize?"  
    - If time runs short: Skip bonus round; focus on testing 3–4 features to prove the point.  

  ---

  ### **Predictable Challenges & Handling**  
  1. **"The Category Is Meaningless" Pair**:  
     - *Handling*: During Phase 5, ask: "Why did 80% include Vignette 1 and exclude Vignette 9? What similarities guided you?" Highlight shared intuitions.  

  2. **Overly Abstract Feature** (e.g., "involves mutual understanding"):  
     - *Handling*: In Phase 4, demand observable markers: "Point to where mutual understanding is explicit in Vignette 3 (digital click)." If unverifiable, rule it invalid.  

  3. **Time Management**:  
     - Enforce strict timers. If pairs stall, remind: "Go with your best guess—we’re testing intuitions."  

  4. **Dominant Pairs**:  
     - Randomize presentation order. If one pair monopolizes, say: "Let’s hear from a pair we haven’t seen yet."  

  ---

  ### **Limitations of the Activity**  
  - **Cannot Reproduce**: The **normative dimension of language games**. Wittgenstein argues meaning emerges from rule-governed practices within a "form of life" (e.g., the social consequences of breaking a promise). This exercise isolates structural features but cannot simulate lived norms.  
  - **Must Supply via Discussion**: After the exercise, ask:  
    > "In a real ‘binding act,’ what happens if someone violates it? How does that reinforce meaning? Wittgenstein would say: The ‘game’ only works within a shared form of life."  

  - **Cannot Reproduce**: **Training in a practice**. Wittgenstein emphasizes we learn concepts through apprenticeship (e.g., children learn "promise" by seeing reactions to breaches). This exercise uses vignettes, not lived training.  
  - **Must Supply via Discussion**:  
    > "How would you train someone in these ‘binding acts’? Would you show examples or define rules? Wittgenstein argues we learn through examples—just as you sorted without a definition."  

  ---

  ### **Key Takeaways for Students**  
  - Family resemblance is not a failure of categorization but a reflection of how concepts function in practice.  
  - Essence-seeking is misguided for many concepts; overlap is sufficient for shared understanding.  
  - Language games derive meaning from use in social contexts, not abstract definitions.  

  The exercise creates experiential frustration, ensuring students *feel* the collapse of essentialism and *see* the utility of family resemblance—without direct instruction.
