  We are designing an in-class exercise for a philosophy of language seminar focused on Wittgenstein's concepts of language games and family resemblance. The goal is to have students experience family resemblance as a positive feature of conceptual structure rather than a deficiency.

  ### Core Idea
  - Present 10 invented vignettes of "binding acts" (defined as social practices where one party undertakes a commitment to another via an explicit or implicit marker, with extreme formal variation).
  - Students work in pairs to sort the 10 vignettes into "genuine binding acts" and "not binding acts", but they must propose one feature they believe is necessary and sufficient (essential feature).
  - After initial sorting and presentation, we test each proposed essential feature against all 10 vignettes to show counterexamples (the feature is absent in a case they want to include and present in a case they want to exclude).
  - The exercise should build frustration organically as students try to defend essentialism and then realize that only overlapping similarities hold the category together.

  ### Materials
  - **10 Vignettes**: We need 10 brief descriptions of invented practices. They should be:
    - In a niche, invented domain (not real-world).
    - Share no single observable feature (so that no essential feature can be found).
    - Vary in form: e.g., silent token exchange, ambiguous gesture, digital acknowledgment, physical posture under specific conditions, etc.

  Example vignettes (invented):

  1. **The Silent Token Exchange**: In the ritual of the Merfolk, when two individuals wish to bind themselves in a mutual obligation, they meet at dawn by a river and exchange smooth stones without uttering a word. The stones are then thrown into the river simultaneously.
  2. **The Ambiguous Gesture**: Among the desert traders of Zalt, a binding act is performed by making a circular motion with the index finger while maintaining direct eye contact. This gesture is also used in non-binding contexts to signal mere acknowledgment, but the binding version requires the presence of a specific type of sand at the feet of both parties.
  3. **Digital Acknowledgment**: In the virtual world of Veridia, users can bind themselves to a promise by clicking a non-descript gray button that appears only when both users have typed the exact same sequence of numbers in a private chat window. There is no verbal component.
  4. **Light-Dependent Posture**: In the culture of the Nocturnals, a binding commitment is made by standing on one leg with arms extended horizontally, but only when the first rays of the morning sun hit a particular crystal in the central square. Any other time, this posture is meaningless.
  5. **The Whispered Name**: In the mountain villages of Kael, a binding act is performed by whispering the other person's full name three times into a hollow log. The log must be from a tree that has been struck by lightning.
  6. **The Shifting Sands Oath**: On the island of Tidalia, two individuals write their names in wet sand at the exact moment the tide begins to recede. The act is binding only if the names are washed away by the next wave.
  7. **The Invisible Ink Pact**: In the secret society of the Unseen, members commit to each other by writing a promise with invisible ink on a shared piece of paper. The ink becomes visible only when both parties blow on the paper simultaneously.
  8. **The Echo Binding**: In the Valley of Echoes, a binding act is performed by one person shouting a promise into a particular canyon and the other person repeating the exact words into a different canyon. The commitment is formed only if the echoes overlap in a specific pattern.
  9. **The Shadow Handshake**: In the city of Umbra, a binding agreement requires two people to shake hands such that their shadows merge into one on a wall behind them. This must occur exactly at noon on a sunny day.
