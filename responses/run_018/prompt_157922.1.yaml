answer: |-
  Here is a formal argument defending the "Double Veil" account of moral worth, tailored to your requirements:

  **The Double Veil Argument for Moral Worth**

  1.  **Premise (Nature of Moral Worth):** Moral worth adheres fundamentally to an agent's *reasons for acting* – the normative ground motivating their choice – rather than the contingent outcomes of the act or external validation. (This targets consequence-dependent and recognition-dependent accounts).
  2.  **Premise (The First Veil - Consequence Independence):** An agent's genuine motivating reasons can only be isolated by stripping away all knowledge of the act's *actual consequences*. Reasons dependent on foreseen/desired outcomes are contingent on worldly success (moral luck) or instrumental calculation, not intrinsic moral quality. Moral worth requires reasons justifying the act *in itself*, irrespective of results.
  3.  **Premise (The Second Veil - Recognition Independence):** An agent's genuine motivating reasons can only be further isolated by stripping away all prospect of *social recognition* (praise, blame, honor, shame). Reasons dependent on anticipated social response are contingent on others' judgments or self-image cultivation (rigorism's "duty for duty's sake" performativity or virtue-signaling), not the inherent rightness of the act. Moral worth requires reasons compelling *for the actor alone*, in isolation.
  4.  **Premise (The Subconscious as Reason-Constitutive):** An agent's motivating reasons are not solely, nor necessarily primarily, products of explicit conscious deliberation. They can be competently formed through subconscious pattern-matching (intuition, trained perception, emotional salience) that reliably connects situational features to normative concerns (e.g., recognizing suffering as demanding response, perceiving unfairness as requiring redress). This process constitutes valid practical reasoning when it reliably tracks morally relevant features.
  5.  **Premise (The Double Veil Test):** Therefore, an agent possesses full moral worth for an action if, and only if, their motivating reason(s) for acting *survive* application of the Double Veil: they would still endorse and act upon those reasons *both* without knowing the actual consequences *and* without any prospect of social recognition.
  6.  **Conclusion (Avoiding Rigorism & Moral Luck):** This account:
      *   **Avoids Kantian Rigorism:** By accepting subconscious pattern-matching as reason-constitutive (P4), it does not demand impossible levels of explicit, conscious maxim-formulation for every act. An agent acting from deeply internalized, subconsciously accessed moral understanding (e.g., spontaneous compassion) can possess full worth, provided it survives the Veils (P5). The focus is on the *quality and source* of the motivation filtered through the Veils, not its conscious articulation. Rigorism's performative aspect is eliminated by the Second Veil (P3).
      *   **Avoids Moral Luck Over-Inclusiveness:** By requiring reasons to justify the act *independently of actual consequences* (First Veil, P2), moral worth is decoupled from lucky successes or unlucky failures. An agent acting for a reason that survives the Veils possesses full worth *even if* unforeseen bad consequences occur. Conversely, an agent acting for reasons that *would not* survive the Veils (e.g., solely for anticipated praise or solely betting on a good outcome) lacks full worth *even if* good results or praise fortuitously occur. Worth is determined by the pre-action reasons filtered by the Veils, not by luck.

  **Why Subconscious Processing is a Feature:**

  *   **Cognitive Realism & Efficiency:** Explicit deliberation for every moral choice is impractical. Subconscious pattern-matching reflects the efficient encoding of complex moral experience and principles into actionable intuition, essential for fluid moral agency in a complex world.
  *   **Depth of Character:** Morally worthy actions often spring from deeply ingrained dispositions (compassion, honesty) manifested subconsciously. The Double Veil tests the *source* (P1) – whether this subconscious response reflects internalized moral understanding that would persist without consequences or recognition – not the *mode* of access. A spontaneously compassionate act based on genuine recognition of need (surviving the Veils) possesses *greater*, not lesser, worth than a laboriously calculated one driven by the same core reason.
  *   **Focus on Competent Responsiveness:** The account values the agent's reliable, subconsciously facilitated *responsiveness to morally salient features of situations* (P4), judged by whether the reasons emerging from this responsiveness pass the Double Veil test (P5). The subconscious is the *neural architecture* enabling this competent moral perception and response, not a mysterious or suspect force. Its output *is* the agent's reason when it constitutes their motivating ground.

  **In essence:** Full moral worth belongs to actions motivated by reasons that are *intrinsically compelling* to the agent – reasons justifying the act based on its inherent features, discerned through either conscious or subconscious competence – such that the agent would still act on them in total ignorance of results and total social isolation. This captures the core intuition of deontology (focus on the will/reasons) while avoiding its impractical rigorism and decisively immunizing worth against distortions of luck or social contingency by applying the Double Veil filter. The subconscious is the vital engine enabling fluid, character-based moral responsiveness that can meet this demanding standard.
