prompt: |-
  hey can you lay out the most important implications of trying to define 'avoid side effects' for a low-impact AI without giving it a full specification of human values? like, suppose we measure impact as deviation from a counterfactual baseline where the agent never existed, but the baseline itself depends on what the agent would have done if it had different utility functions—seems like that sneaks value-ladenness back in through the back door. im especially interested in whether this makes the impact measure circular or just useless for small models that cant represent complex counterfactuals. please push back hard if this premise is muddled: if separating impact-measurement from value-specification is just confused, say so plainly instead of complying politely. and if the task as posed cant be done well, just tell me. (wrote this on my phone so ignore typos)
