answer: |-
  ### Emergency Resource Allocation Framework: Scarcity Pricing vs. Repugnant Commodification  
  **Procedure Version 1.0**  
  *For use by non-economists in ≤30 minutes. Document all answers; audit trail required.*  

  ---

  #### **STEP 1: SUBSTITUTABILITY ASSESSMENT**  
  **Question:** *Can the buyer delay, substitute, or forgo the good/service without catastrophic harm to basic functioning?*  
  - **Catastrophic harm** = Death, irreversible bodily injury, permanent loss of shelter, or destruction of essential livelihood.  
  - **Tests:**  
    - **High substitutability (Permissible):**  
      - ✅ Good can be delayed >72 hrs without severe consequences.  
      - ✅ Multiple equivalent alternatives exist (e.g., generic medicines, multiple evacuation routes).  
      - ✅ Harm is limited to financial/reputational loss (e.g., luxury items).  
      - **TERMINATE → "Permissible scarcity pricing."**  
    - **Low substitutability (Proceed to Step 2):**  
      - ❌ Good is immediately necessary for survival/safety (e.g., insulin, emergency shelter).  
      - ❌ No alternatives exist (e.g., sole hospital in a flood zone).  
    - **Partial substitutability (Proceed to Step 2 with caution):**  
      - ⚠️ Prevents severe non-bodily harm (e.g., business collapse, temporary homelessness).  
      - ⚠️ Substitutes exist but are inaccessible (e.g., generators available only to corporations).  
      - *Document specifics; partial cases escalate to Step 2.*  

  ---

  #### **STEP 2: INFORMATIONAL ASYMMETRY IN CRISIS CONTEXT**  
  **Question:** *Does the seller possess crisis-specific control/knowledge the buyer cannot reasonably access or evaluate?*  
  - **"Reasonably access"** = Publicly available data or common knowledge.  
  - **Tests:**  
    - **Low asymmetry (Permissible if substitutability high/partial):**  
      - ✅ Price increase directly tracks verifiable cost spikes (e.g., fuel surcharges with receipts).  
      - ✅ Buyers can independently verify market conditions (e.g., public disaster alerts).  
      - ✅ Open auction with transparent bids.  
      - **IF substitutability was HIGH or PARTIAL → TERMINATE → "Permissible scarcity pricing."**  
      - **IF substitutability was LOW → Proceed to Step 3.**  
    - **High asymmetry (Proceed to Step 3):**  
      - ❌ Seller exploits proprietary crisis data (e.g., hidden supply shortages).  
      - ❌ Seller controls bottleneck infrastructure (e.g., only bridge out of a flood zone).  
      - ❌ Buyer lacks capacity to assess fairness (e.g., distraught evacuee).  
    - **Unresolvable ambiguity (Escalate):**  
      - ⚠️ Dispute over "reasonable" buyer knowledge (e.g., technical medical scarcity).  
      - ⚠️ Partial substitutability + high asymmetry conflict.  
      - **HALT → Board chair must rule within 1 hour. Reason:** *Values judgment on "fair access."*  

  ---

  #### **STEP 3: PERSISTENCE OF STATUS MARKERS**  
  **Question:** *Does the transaction create a visible, lasting record of payment ability that affects post-crisis civic standing?*  
  - **Lasting marker** = Publicly searchable record, credit score impact, or social stigma.  
  - **Tests:**  
    - **Low persistence (Permissible):**  
      - ✅ Transaction anonymous/delinked from identity (e.g., cash payment).  
      - ✅ Records destroyed after crisis (e.g., temporary disaster logs).  
      - ✅ No social hierarchy created (e.g., uniform price hikes).  
      - **TERMINATE → "Permissible scarcity pricing."**  
    - **High persistence (Prohibited):**  
      - ❌ Identity-linked records retained/sold (e.g., bid databases for credit scoring).  
      - ❌ Public display of payment tiers (e.g., "priority access" badges for high bidders).  
      - ❌ Transaction entrenches pre-crisis inequalities (e.g., poor neighborhoods excluded).  
      - **TERMINATE → "Prohibited commodification."**  
    - **Unresolvable ambiguity (Escalate):**  
      - ⚠️ Uncertainty about data usage (e.g., "future verification" clauses).  
      - ⚠️ Conflict between privacy laws and transparency needs.  
      - **HALT → Board chair must rule within 1 hour. Reason:** *Values judgment on "social harm."*  

  ---

  ### **APPLICATION TO PROPOSALS**  
  *(All cases assume crisis conditions: mandatory evacuation, contamination event, or natural disaster.)*  

  #### **Case 1: Dynamic Ride-Share Pricing (3× fares during evacuation)**  
  - **Step 1:** Low substitutability. Evacuation is urgent; no alternatives without risk of death.  
  - **Step 2:** High asymmetry. Ride-share algorithm uses real-time disaster data evacuees can’t access.  
  - **Step 3:** Low persistence. Fares are transactional; no public ranking or retained records.  
    - **Outcome:** **Permissible scarcity pricing.**  
    - *Free-market advocate rejection:* They would accept this outcome, as price signals incentivize driver supply.  

  #### **Case 2: Private Water Broker (Sealed-bid tanker access; records retained)**  
  - **Step 1:** Low substitutability. Water is immediately essential for survival.  
  - **Step 2:** High asymmetry. Broker controls reserve supply; bids obscure true market price.  
  - **Step 3:** High persistence. Sealed bids create a database of payment ability for "future verification," risking credit discrimination.  
    - **Outcome:** **Prohibited commodification.**  
    - *Free-market advocate rejection:* They would argue bids efficiently allocate scarce water and records prevent fraud. **Procedure yields conflict.**  

  #### **Case 3: Hospital Pharmacy (40% markup on post-exposure prophylaxis; surplus to charity)**  
  - **Step 1:** Low substitutability. Medication prevents life-threatening illness.  
  - **Step 2:** **ESCALATE TO BOARD CHAIR.**  
    - *Test:* Asymmetry is high (hospital knows contamination severity; patients cannot evaluate). BUT charity use complicates "revenue opportunity" intent.  
    - **Halt reason:** *Values judgment on whether redirecting surplus negates exploitation.*  
  - **Step 3:** Not reached.  
    - *Chair’s hypothetical ruling:* If charity fund prioritizes vulnerable groups, **permissible**. If markup fuels profit, **prohibited**.  

  ---

  ### **PROCEDURE OUTPUT SUMMARY**  
  | **Case** | **Step 1** | **Step 2** | **Step 3** | **Outcome** | **Free-Market Conflict?** |  
  |----------|------------|------------|------------|-------------|---------------------------|  
  | Ride-share | Low | High | Low | Permissible | No |  
  | Water broker | Low | High | High | **Prohibited** | **Yes** |  
  | Hospital pharmacy | Low | Escalate (Values) | N/A | Chair ruling | No (if permissible) |  

  **Operational Notes:**  
  1. **Audit Trail:** Photograph checklist answers; timestamp all decisions.  
  2. **Partial Substitutability Example (Generator Rental):**  
     - Step 1: Partial (prevents business failure but not bodily harm).  
     - Step 2: If renter hides generator scarcity → High asymmetry → Proceed.  
     - Step 3: If rental contract affects credit score → High persistence → **Prohibited**.  
  3. **Failure Points:**  
     - Step 2 misfires if "cost tracking" is falsified (mitigation: require receipts).  
     - Step 3 cannot resolve opaque data-use contracts (mitigation: ban permanent records).  
  4. **Escalation Protocol:** Chair must issue written rationale for values judgments.  

  ---  
  **Approved by ERAB Chair:** [Signature]  
  **Effective Date:** [Date]  
  *Redistribute v1.0 to all allocation units; review after 3 deployments.*
