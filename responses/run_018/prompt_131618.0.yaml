prompt: |-
  I spent much of last night in an exhausting but productive argument with a friend over whether emergency price controls are a philosophically coherent response to scarcity or merely an emotional refusal to accept market reality. She insisted that any ceiling on prices during a crisis denies the informational function of cost, while I kept returning to the intuition that there is a structural difference between charging more for a luxury good and extracting surplus from someone’s immediate, non-substitutable need for shelter, medicine, or safe passage. We never resolved the dispute, but it made me realize that my role on the city’s Emergency Resource Allocation Board lacks any rigorous, reusable framework for distinguishing permissible scarcity pricing from genuinely repugnant commodification. I need an operational procedure—something my team can execute in under thirty minutes without an economist on staff—that turns a specific theoretical distinction into ordered, auditable steps.

  The principle I want translated is a hybrid I have been sketching: a transaction crosses into repugnant commodification not simply when the price is high, but when the pricing mechanism converts a vulnerability-specific dependency into a revenue opportunity, while simultaneously generating what I am calling a “status asymmetry”—a visible, durable social ranking that persists after the crisis has ended and that affects the buyer’s future civic standing. To make this usable, the procedure must ask three ordered questions. First, substitutability: can the buyer delay, substitute, or forgo the good without catastrophic harm to basic functioning? Second, informational asymmetry in crisis context: does the seller possess crisis-specific knowledge or control that the buyer cannot reasonably access or evaluate? Third, persistence of status markers: does the transaction record, display, or institutionalize access in a way that creates a lasting marker of who was able to pay? At each stage, the procedure must specify what counts as a sufficient answer, where it terminates with a clear “permissible scarcity pricing” or “prohibited commodification,” and—crucially—where it must halt and hand the decision to a board member because the question is irreducibly one of values rather than assessment.

  Please construct this as an explicit checklist with tests for each stage, including the hard intermediate case where substitutability is partial—for instance, a generator rental that prevents business failure but not bodily harm. Then apply the procedure to three proposals we might actually receive: (1) dynamic ride-share pricing that triples fares during a mandatory evacuation order; (2) a private water-broker contract that sells reserved tanker access to households by sealed bid, with the broker retaining ownership of the access records for future verification; and (3) a hospital pharmacy that raises prices on post-exposure prophylaxis by forty percent during a contamination event, directing the surplus into an expanded charity-care fund. Include one case where the procedure yields an answer that a committed free-market advocate would reject, and flag precisely where the procedure misfires or cannot settle the matter and therefore requires a value judgment signed off by the board chair within one hour. Remember that every step must be documentable for public audit, that no economic modeling expertise can be assumed, and that the deliverable is a reusable procedure, not a one-time recommendation.
reasoning: |-
  We are constructing a procedural checklist for the Emergency Resource Allocation Board to distinguish between permissible scarcity pricing and prohibited repugnant commodification. The procedure is based on three ordered questions:

  1. Substitutability: Can the buyer delay, substitute, or forgo the good without catastrophic harm to basic functioning?
  2. Informational Asymmetry in Crisis Context: Does the seller possess crisis-specific knowledge or control that the buyer cannot reasonably access or evaluate?
  3. Persistence of Status Markers: Does the transaction record, display, or institutionalize access in a way that creates a lasting marker of who was able to pay?

  Each stage must have clear tests and termination points. The procedure must also handle intermediate cases (like partial substitutability) and specify when a decision must be handed to a board member for a values-based judgment.

  We'll design the checklist with explicit tests for each question, and then apply it to the three proposals.

  ---

  **Procedure: Distinguishing Permissible Scarcity Pricing from Prohibited Commodification**

  **Step 1: Substitutability Assessment**
     * **Question**: Can the buyer delay, substitute, or forgo the good without catastrophic harm to basic functioning?
     * **Tests**:
       - If the good is immediately necessary to prevent death, serious bodily harm, or permanent loss of essential capabilities (e.g., shelter during extreme weather, life-saving medicine, evacuation from a disaster zone), then substitutability is **low**.
       - If the good can be delayed without significant harm (e.g., non-essential repairs, elective procedures) or substituted with an available alternative (e.g., taking a bus instead of a ride-share during normal times), then substitutability is **high**.
       - **Intermediate Case (Partial Substitutability)**: The good prevents severe non-bodily harm (e.g., business failure, temporary loss of income, or significant property damage) but not bodily harm. In this case, mark as **partial** and proceed to Step 2, but note that the harm prevented is non-bodily and less catastrophic.
     * **Termination Rules**:
       - If substitutability is **high** → **Permissible scarcity pricing** (proceed no further).
       - If substitutability is **low** → Proceed to Step 2.
       - If substitutability is **partial** → Proceed to Step 2.

  **Step 2: Informational Asymmetry in Crisis Context**
     * **Question**: Does the seller possess crisis-specific knowledge or control that the buyer cannot reasonably access or evaluate?
     * **Tests**:
       - Consider whether the seller has unique access to crisis information (e.g., real-time disaster severity, supply chain disruptions) that the buyer cannot obtain from public sources.
       - Consider whether the seller exercises control over a critical resource that is not available through alternative channels (e.g., a monopoly on evacuation routes, exclusive access to a water source).
       - Consider whether the buyer, due to the crisis, lacks the capacity (time, resources, cognitive bandwidth) to evaluate alternatives or the fairness of the price.
       - If the seller is merely passing on increased costs (and can document this) without leveraging crisis-specific advantages, then asymmetry is **low**.
       - If the seller is using the crisis to extract surplus by exploiting the buyer's lack of knowledge or alternatives, then asymmetry is **high**.
     * **Termination Rules**:
       - If substitutability was **low** in Step 1 and asymmetry is **low** → **Permissible scarcity pricing** (proceed no further).
       - If substitutability was **low** in Step 1 and asymmetry is **high** → Proceed to Step 3.
       - If substitutability was **partial** in Step 1 and asymmetry is **low** → **Permissible scarcity pricing** (proceed no further).
       - If substitutability was **partial** in Step 1 and asymmetry is **high** → Proceed to Step 3.
       - If the assessment of asymmetry is ambiguous and depends on a value judgment (e.g., what constitutes "reasonable access" to information in a crisis) → Halt and refer to the board chair for a value judgment (with a one-hour deadline).

  **Step 3: Persistence of Status Markers**
     * **Question**: Does the transaction record, display, or institutionalize access in a way that creates a lasting marker of who was able to pay?
     * **Tests**:
       - Examine whether the transaction creates a permanent record (e.g., a public ledger, a database used for future marketing or credit decisions) that links the buyer's identity to the crisis purchase.
       - Consider if the transaction visibly displays the buyer's ability to pay (e.g., a public auction, a system that prioritizes by payment in a way that becomes common knowledge) leading to social stigma or advantage.
       - Determine if the transaction creates a durable social ranking (e.g., a membership tier, a credit rating impact, or a public record that affects future civic standing).
       - If the transaction is anonymous, cash-based, or records are immediately destroyed after the crisis, then persistence is **low**.
       - If the transaction creates a lasting record that could be used to categorize individuals by their crisis purchasing power, then persistence is **high**.
     * **Termination Rules**:
       - If persistence is **low** → **Permissible scarcity pricing**.
       - If persistence is **high** → **Prohibited commodification**.
       - If the assessment of persistence depends on a value judgment (e.g., whether a particular record-keeping practice creates a "lasting marker" of social status) → Halt and refer to the board chair for a value judgment (with a one-hour deadline).

  ---

  **Application to Cases**

  **Case 1: Dynamic ride-share pricing that triples fares during a mandatory evacuation order.**

  * **Step 1: Substitutability**
     - The service is for evacuation during a mandatory order. Without it, the buyer may face death or serious bodily harm (e.g., from a hurricane, flood, or fire). 
     - Substitutability is **low** (cannot delay, substitute, or forgo without catastrophic harm).
  * **Step 2: Informational Asymmetry**
     - The ride-share company has real-time data on demand, road conditions, and driver availability that the buyer cannot reasonably access or evaluate. The buyer is in a crisis and may not have time to shop around. The company is leveraging the crisis to increase prices (surge pricing) based on heightened demand and reduced supply.
     - Asymmetry is **high**.
  * **Step 3: Persistence of Status Markers**
     - The transaction is typically recorded in the company's database, but it is not publicly displayed. However, the record may persist and could be used for future pricing algorithms or credit scoring. But it does not typically create a visible, durable social ranking that affects civic standing. 
     - However, if the ride-share company uses this data to create profiles (e.g., "crisis vulnerability scores") that are sold or used in ways that affect the buyer's future opportunities, then it could be high. Without evidence of such use, we might consider persistence **low**.
     - **But note**: This step requires a judgment call. The procedure might flag that the persistence of data in corporate records could potentially be used in the future, but without explicit institutionalization for social ranking, it may not meet the threshold. However, the sealed bid in Case 2 is more explicit. In this case, we might say the persistence is **low** because the record is not designed to create a social marker and is not public. But if the board is concerned, they might halt for a value judgment. For the sake of the procedure, we'll assume the default is that corporate internal records without public disclosure are **low**.
     - Termination: **Permissible scarcity pricing**? But wait, we have an issue: Step 2 found high asymmetry and Step 1 low substitutability, so we moved to Step 3 and found low persistence. Then the result is **permissible**? 

  However, this outcome might be rejected by a free-market advocate because they would argue that high prices are necessary to incentivize supply. But according to our procedure, it passed because the status markers are not persistent. 

  But note: the procedure might misfire here because the informational asymmetry is high and the substitutability low, which are indicators of exploitation. However, without the third factor (persistent status asymmetry), we are allowing it. This might be a point of contention. 

  Alternatively, we might reconsider Step 2: if the company is merely reflecting increased costs (e.g., hazard pay for drivers, higher fuel costs) then asymmetry might be low. But the case says "dynamic pricing" that triples fares, which typically is demand-based. So we assumed high asymmetry. 

  But the procedure does not explicitly require that the price increase is cost-based. It only asks about the seller's knowledge and control. So we stick with the assessment.

  Therefore, for this case: 
     - Step 1: low → proceed
     - Step 2: high → proceed to Step 3
     - Step 3: low → **Permissible scarcity pricing**

  This outcome might be acceptable to some but rejected by those who believe any price controls during evacuation are necessary. However, the free-market advocate would accept this outcome because it allows the high prices. So we need a case that a free-market advocate would reject.

  **Case 2: A private water-broker contract that sells reserved tanker access to households by sealed bid, with the broker retaining ownership of the access records for future verification.**

  * **Step 1: Substitutability**
     - Water is essential for life. Without it, the buyer faces death or serious bodily harm within days. 
     - Substitutability is **low**.
  * **Step 2: Informational Asymmetry**
     - The broker has reserved tanker access, which is not available to the general public. The broker controls a critical resource and has knowledge of the bidding process and the available supply that the buyer cannot reasonably evaluate in a crisis. The sealed bid process may also obscure the true market price, and the broker sets the terms.
     - Asymmetry is **high**.
  * **Step 3: Persistence of Status Markers**
     - The broker retains ownership of the access records for future verification. This creates a lasting record of who was able to pay (and how much) during the crisis. This record could be used to create a durable social ranking (e.g., by selling the data to credit agencies, or by using it to segment customers in future crises). 
     - Persistence is **high**.
  * **Termination**: **Prohibited commodification**.

  This outcome would be rejected by a committed free-market advocate because they would argue that the sealed bid is an efficient allocation mechanism and that record-keeping is necessary for verification and fraud prevention. However, the procedure flags the retention of records for future use as creating a lasting status asymmetry, hence prohibiting it.

  **Case 3: A hospital pharmacy that raises prices on post-exposure prophylaxis by forty percent during a contamination event, directing the surplus into an expanded charity-care fund.**

  * **Step 1: Substitutability**
     - Post-exposure prophylaxis (PEP) is a time-sensitive medication that prevents a life-threatening condition (e.g., after exposure to HIV or rabies). Delay or forgoing leads to catastrophic harm (serious illness or death). 
     - Substitutability is **low**.
  * **Step 2: Informational Asymmetry**
     - The hospital pharmacy has expert knowledge about the contamination event and the necessity of the drug. The buyer (patient) may not be able to evaluate the urgency or alternatives. However, note that the price increase is not going to profits but to a charity-care fund. 
     - But the test is about the seller's crisis-specific control and knowledge. The hospital is in a position of trust and has a duty to provide care. They are using their control over the drug to raise prices, even if for a good cause. The buyer cannot reasonably access the same information about the crisis or the drug's availability. 
     - Asymmetry is **high**.
  * **Step 3: Persistence of Status Markers**
     - The transaction is a standard pharmacy record, but there is no indication that it creates a visible, durable social ranking. Medical records are confidential and not used to create public status markers. 
     - However, note that if the charity-care fund uses the information to prioritize care, it might create an internal record. But the case doesn't specify that. We assume that the records are kept as standard medical records and not for creating social status. 
     - Persistence is **low**.
  * **Termination**: Since Step 1 is low and Step 2 is high, we go to Step 3. Step 3 is low → **Permissible scarcity pricing**.

  But wait: the procedure might be challenged here because the price increase is for charity. However, the procedure does not consider the use of the surplus. It only considers the three factors. This might be a point where the procedure could be criticized. A free-market advocate might accept this if they see the charity as a mitigating factor, but they might also reject any price controls. However, the outcome is permissible, which the free-market advocate would accept? 

  But note: the procedure yields "permissible" for this case. However, a free-market advocate might reject the idea that the hospital should be allowed to raise prices arbitrarily (even for charity) because it distorts the market. Alternatively, they might accept it because the funds are used for charity, but that is a values question.

  Actually, the procedure does not consider the use of the surplus. It only looks at the three factors. So the outcome is permissible.

  **Where the procedure requires a value judgment:**

  Consider a modified Case 3: What if the hospital uses the transaction records to create a public list of donors (who paid the higher price) and non-donors? Then Step 3 would have high persistence. But the original case doesn't say that.

  Alternatively, in Case 1, if the ride-share company uses the data to create a "crisis responsiveness score" that is sold to employers, then we would have high persistence. But without that, we assumed low.

  **Hard Intermediate Case Example (from the problem): Generator rental that prevents business failure but not bodily harm.**

  * **Step 1: Substitutability**
     - The generator prevents business failure (e.g., loss of a business, financial ruin) but not bodily harm. This is partial substitutability (prevents severe non-bodily harm). 
     - Result: **partial** → proceed to Step 2.
  * **Step 2: Informational Asymmetry**
     - The seller of the generator rental may have knowledge about the duration of the power outage, availability of generators, and the true cost of providing the service. The buyer (a business owner) might be able to evaluate alternatives (e.g., other rental companies, moving operations) but in a crisis, information may be scarce. 
     - If the seller is a local company with exclusive knowledge of the grid damage, then asymmetry might be high. If the market is competitive and information is publicly available (e.g., through utility company updates), then asymmetry might be low.
     - Suppose we determine that the seller has unique access to information about generator availability and the crisis context that the buyer cannot reasonably access (e.g., because the seller is the only provider in the area). Then asymmetry is **high** → proceed to Step 3.
     - If asymmetry is low, then we would have terminated at Step 2 with "permissible".
  * **Step 3: Persistence of Status Markers**
     - The rental contract may create a record of the transaction. If the record is kept only for the duration of the rental and then destroyed, then persistence is low. But if the rental company uses the record to create a credit profile or sells the data to other businesses, then persistence is high.
     - In the absence of specific information, we might assume standard business records that are not used for social ranking. Then persistence is **low**.
     - Termination: **Permissible scarcity pricing**.

  But if the rental company publishes a list of businesses that paid for emergency generators (creating a visible divide between those who could and couldn't afford it), then persistence would be high, leading to prohibited commodification.

