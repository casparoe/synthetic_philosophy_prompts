answer: |-
  Based on current philosophical debates and evidence, here's a reasoned breakdown of your core question about genuine moral dilemmas and its components:

  1.  **Probability that standard deontic logic is inadequate & conflict-tolerant frameworks are needed:** **~65%**
      *   **Why?** Standard deontic logic (SDL) famously struggles with dilemmas, treating conflicting obligations (`OA & O~A`) as implying *no* obligations (`O⊥`), which feels deeply counterintuitive to lived experience. The sheer persistence of dilemma descriptions across cultures/history suggests they capture something real. Many prominent ethicists (e.g., Bernard Williams, Martha Nussbaum, proponents of particularism) argue SDL's "conflict-intolerance" is a flaw, not a feature. While SDL defenders propose solutions (e.g., temporal indexing, different "ought" operators), these often feel ad hoc or fail to capture the *simultaneous* binding force felt in dilemmas like yours. The need for non-aggregative frameworks (like those allowing for "prima facie" duties or incommensurable values) is widely acknowledged as plausible, though not universally accepted.

  2.  **Probability that moral residue tracks a real unfulfilled obligation:** **~55%**
      *   **Why?** This is highly contested. Proponents argue that the *specific character* of moral residue (focused guilt, a sense of *owing* something even after choice, directed at the wronged party) differs psychologically from mere regret or self-image threat. It often persists despite rationalization and feels like a response to an objective failure, not just subjective disappointment. Critics counter that residue can be explained by evolutionary loss-aversion, internalized social norms, or threats to our self-concept as "good agents" without invoking an actual persisting obligation. Empirical moral psychology is ambiguous: studies show residue correlates with perceived duty-violation, but proving this perception tracks objective reality is difficult. The intuitive pull is strong, but alternative explanations are robust.

  3.  **Probability that every apparent dilemma dissolves under precise specification:** **~30%**
      *   **Why?** Specificationism (e.g., Henry Richardson) is a serious and sophisticated attempt to rescue SDL. However, its success rate is debated. While many dilemmas *do* dissolve with better specification ("Owe loyalty *within ethical bounds*"), others seem stubbornly resistant. Dilemmas involving fundamental, incommensurable values (loyalty vs. justice, care vs. fairness) or tragic choices where all options involve violating a core prohibition (e.g., "Sophie's Choice") appear difficult or impossible to fully specify away without rendering the obligations vacuous or contextually irrelevant. The burden of proof arguably lies with specificationists to demonstrate universal applicability, which remains unmet.

  **Synthesized Probability for Genuine Dilemmas (Strong Sense):** **~50%**
  *   *Calculation:* Giving equal weight to the three components: (1) 65% (SDL likely inadequate) * (2) 55% (residue *might* track duty) * (3) 70% (specification likely *fails* sometimes) = ~25%. However, this multiplicative approach underweights the significance of (1) & (3). Taking a weighted average leaning towards (1) and (3) (~65% + ~55% + ~70%) / 3 ≈ 63%, then discounting slightly for the uncertainty in (2) lands around **~50%**. This reflects the genuine tension: strong arguments exist for dilemmas, but significant challenges remain.

  **Least Confident Term: Moral Residue Tracking Real Obligation (~55%)**
  *   **Why Least Confident?** Distinguishing phenomenology (how it *feels*) from ontology (what it *is*) is extremely difficult. Psychological explanations (loss aversion, self-concept protection) are powerful and well-supported. Proving that the *feeling* of unfulfilled duty corresponds to an *actual*, persisting, objective obligation, rather than being a powerful illusion generated by our psychology and social conditioning, requires evidence beyond introspection or common intuition.
  *   **Evidence That Would Shift It Most:**
      1.  **Neuroscientific Correlates:** Finding distinct, consistent neural signatures for "moral residue due to perceived unfulfilled duty" compared to "regret due to bad outcome" or "shame due to self-image threat," especially patterns associated with representing persisting social obligations.
      2.  **Cross-Cultural Consistency:** Demonstrating that the *specific phenomenology* of directed guilt/sense of persisting debt occurs in response to dilemma-type choices across vastly different cultures with divergent moral codes, suggesting it taps into something fundamental about obligation itself, not just local norms.
      3.  **Behavioral Outcomes:** Strong evidence that this residue reliably motivates specific, costly reparative actions *directed at the wronged party* (beyond general guilt-reduction or reputation management), even long after the event, precisely *because* the agent feels the obligation remains partially unfulfilled. Longitudinal studies tracking this would be key.
      4.  **Failure of Therapeutic Rationalization:** Evidence that even successful cognitive therapy aimed at reducing loss-aversion or repairing self-image *fails* to alleviate this specific type of residue, while only acknowledging the persisting obligation or making appropriate amends does.

  **Settled vs. Contested:**
  *   **Settled (Near Consensus):**
      *   Standard Deontic Logic (SDL) *as classically formulated* cannot adequately represent moral dilemmas without generating contradictions or implausible consequences.
      *   Moral residue is a *real psychological phenomenon* commonly experienced after difficult choices involving conflicting values/obligations.
      *   Not *all* apparent dilemmas are genuine; many dissolve with better information, specification, or understanding of priorities/context.
  *   **Genuinely Contested:**
      *   Whether the failure of SDL means we *must* adopt conflict-tolerant/non-aggregative frameworks, or whether revised monistic frameworks (e.g., sophisticated utilitarianism, highly contextual deontology) can ultimately handle all cases.
      *   Whether the moral residue in dilemmas provides *evidence* for a genuine, persisting unfulfilled obligation, or is *only* a psychological symptom.
      *   Whether specificationism can *in principle* resolve every apparent dilemma without remainder.
      *   Ultimately, whether genuine moral dilemmas in the strong sense (irreducible, rationally unresolvable conflicting non-derogable obligations) are metaphysically possible and occur in reality.

  Your experience sits squarely in this contested space. The weight of argument and intuition suggests genuine dilemmas are plausible (~50%), but the rational justification remains fiercely debated, particularly concerning the nature of moral residue. The persistence of your feeling likely stems from a deep-seated intuition that *both* obligations held genuine moral weight, and satisfying one didn't simply erase the claim of the other.
