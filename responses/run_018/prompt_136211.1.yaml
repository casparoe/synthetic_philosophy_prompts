  The key points from the query are that the philosopher rejects treating human values as representable mental contents that can be mapped onto AI models, seeing this as repeating Rorty's "mirror-of-nature" fallacy. Instead, she advocates for reconceiving alignment as pragmatic redescription aimed at interactional fluency, using Rorty's normal/abnormal discourse distinction to warn against alignment research hardening into a new metaphysics.

