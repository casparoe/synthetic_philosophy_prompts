prompt: |-
  Hey, I'm putting together a workshop for junior legislative drafters and I need a reusable decision procedure they can actually run. You should act like an expert in penal philosphy and institutional design—think carefully, start by brainstorming the distinctions that survive when you move from seminar-room talk to statutory text, then build the tool. I need a step-by-step checklist for classifying whether a sentencing bill is operating on retributivist logic (backward-looking desert, proportionality to blame) or consequentialist logic (forward-looking deterrence, rehabilitation, incapacitation), plus a specific flag for "rationale laundering"—where the language sounds like one but the mechanism does the other. The proscedure needs ordered questions, clear stop points ("label it X"), explicit escalation points where the call is about values not facts, and a time budget of about 15 minutes per bill with no philosophy training required. Then run it on two proposals: first, a bill that sets mandatory prison terms for ecological damage calculated by an "ecosystem harm index" that mimics proportionality but is actually driven by predictive damage modeling; second, a bill allowing sentence reduction for assault if the offender completes trauma-informed CBT, but framing the reduction as "earning mercy" rather than hitting rehab targets. Include one case where the checklist gives your drafters an answer they won't like and still have to document. End by saying exactly where the procedure will misfire or where two analysts in good faith will run it differently, and don't ask for any citations or reading lists—just the practical framework.
reasoning: |-
  We are creating a practical, reusable decision procedure for classifying sentencing bills as retributivist, consequentialist, or having "rationale laundering". The procedure must be step-by-step, with clear stop points and escalation points, and take about 15 minutes per bill without requiring philosophy training.

  Key distinctions:

  Retributivist (Ret):
  - Backward-looking: focuses on the offense committed.
  - Based on desert: the offender deserves punishment because of the wrongful act.
  - Proportionality: punishment should be proportional to the harm and the offender's culpability.

  Consequentialist (Con):
  - Forward-looking: aims at future outcomes.
  - Goals: deterrence (discouraging future offenses), rehabilitation (changing offender behavior), incapacitation (preventing the offender from re-offending by removing them from society).

  Rationale Laundering (RL):
  - The stated rationale (in the bill's text, preamble, or legislative history) does not match the actual mechanism of the bill. For example:
    - Using retributivist language (e.g., "just deserts", "proportionality") but the mechanism is clearly consequentialist (e.g., using predictive modeling to set sentences based on future risk).
    - Or vice versa: using consequentialist language (e.g., "rehabilitation", "public safety") but the mechanism is fixed and proportional to the offense (like mandatory minimums) without regard to individual risk or treatment progress.

  The Procedure: A Checklist

  Step 1: Examine the stated purpose (textual clues)
  - Look in the bill's preamble, purpose section, or legislative findings.
  - Key phrases for Ret: "desert", "just punishment", "proportional to the harm", "blameworthiness", "accountability for the act", "retribution".
  - Key phrases for Con: "deter", "rehabilitate", "protect public safety", "reduce recidivism", "incapacitation", "treatment", "reintegration".
  - If the stated purpose is mixed, note both and proceed to Step 2.

  Stop Point 1: If the bill's stated purpose is clearly and solely one of these (e.g., only retributivist or only consequentialist) AND the mechanism (as determined in Step 2) aligns, then label accordingly. Otherwise, proceed.

  Step 2: Analyze the mechanism (how the bill actually works)
  - Look at the operative sections: what determines the sentence?
  - For Ret: The sentence is determined by the offense characteristics (harm, culpability) and offender's criminal history (as a measure of blameworthiness, not future risk). Fixed or guided by offense severity.
  - For Con: The sentence is determined by factors related to future outcomes: risk assessments, treatment completion, individual characteristics that predict re-offending, or explicit goals like reducing a specific behavior.

  Step 3: Compare stated purpose and mechanism
  - If the stated purpose and mechanism align (both Ret or both Con), then label as Ret or Con.
  - If the stated purpose is one but the mechanism is the other, label as "Rationale Laundering" (RL) and specify the mismatch (e.g., "stated as retributivist but mechanism consequentialist" or vice versa).

  Escalation Point: If the analysis requires interpreting ambiguous language or if there is a dispute about the primary purpose, escalate to a senior drafter or legal advisor. Note: This is about values, not facts.

  Step 4: Check for hidden consequentialism in retributive mechanisms (or vice versa)
  - Sometimes a bill may appear to be one but have elements of the other. For example:
    - A retributive bill that uses an "index" or "scale" that is actually based on predictive modeling (consequentialist) but framed as harm-based.
    - A consequentialist bill that uses fixed sentence reductions for program completion (without individualized assessment) might actually be operating on a desert basis (earned by the program, not by risk reduction).
  - If the mechanism is a hybrid (e.g., both offense-based and risk-based), then note that it is a hybrid and explain the dominant logic.

  Time Budget: Steps 1-3 should take about 10 minutes, Step 4 about 5 minutes.

  Now, run the procedure on two proposals.

  Proposal 1: A bill that sets mandatory prison terms for ecological damage calculated by an "ecosystem harm index" that mimics proportionality but is actually driven by predictive damage modeling.

  Step 1: Examine stated purpose.
  - The bill might use language like "proportional to the harm" and "just deserts for environmental crimes". But we are told that the index is actually driven by predictive damage modeling (forward-looking). So if the stated purpose is retributivist, we note that.

  Step 2: Analyze the mechanism.
  - The mechanism uses an "ecosystem harm index" that is driven by predictive damage modeling (i.e., how much damage is predicted in the future). This is consequentialist (aiming to prevent future harm by setting sentences that reflect the predicted harm, not the actual harm done).

  Step 3: Compare.
  - Stated purpose: likely retributivist (using proportionality and harm language).
  - Mechanism: consequentialist (predictive modeling).
  - Mismatch: so we label as "Rationale Laundering: stated as retributivist but mechanism consequentialist".

  Proposal 2: A bill allowing sentence reduction for assault if the offender completes trauma-informed CBT, but framing the reduction as "earning mercy" rather than hitting rehab targets.

  Step 1: Examine stated purpose.
  - The bill frames the reduction as "earning mercy". Mercy is a retributivist concept (reducing the punishment that is deserved). There is no mention of rehab targets or reducing recidivism.

  Step 2: Analyze the mechanism.
  - The mechanism is: complete trauma-informed CBT (a rehabilitation program) and get a sentence reduction. This is a consequentialist mechanism because it aims to change the offender (rehabilitation) and reduce future offending.

  Step 3: Compare.
  - Stated purpose: retributivist (mercy is a reduction from what is deserved, so it assumes a baseline of desert).
  - Mechanism: consequentialist (completing a rehab program).
  - Mismatch: label as "Rationale Laundering: stated as retributivist (mercy) but mechanism consequentialist (rehab)".

  Now, one case where the checklist gives an answer they won't like and still have to document.

  Example: A bill that increases penalties for drug offenses near schools, with a stated purpose of "deterring drug sales to protect children" (consequentialist) but the mechanism is a mandatory minimum sentence based solely on the location of the offense (which is a fixed enhancement, without regard to individual risk or actual deterrence effect). 

  - Step 1: Stated purpose is consequentialist (deterrence, protection).
  - Step 2: Mechanism is a fixed penalty based on the offense characteristic (location). This is retributivist because it increases the punishment based on the circumstances of the offense (more blameworthy or harmful) without any individual risk assessment.
  - Step 3: Mismatch -> Rationale Laundering (stated as Con, mechanism Ret). 

  This might be unpopular because the drafters might believe in the deterrence rationale, but the mechanism is not designed to be forward-looking (it doesn't vary with the offender's risk of re-offending or the actual deterrent effect). They have to document it as RL.

  Finally, where the procedure will misfire or where two analysts might differ:

  1. **Ambiguity in the stated purpose**: If the bill uses vague terms (e.g., "justice", "fairness") without clear philosophical grounding, analysts might interpret the purpose differently.

  2. **Hybrid mechanisms**: Some bills intentionally combine desert and consequences. For example, a sentencing guideline that uses offense severity (retributive) and criminal history (which could be interpreted as retributive or as a proxy for risk). The checklist may force a binary choice when the reality is mixed.

  3. **Predictive elements in desert-based systems**: Retributivism sometimes uses past criminal history to determine desert (more blameworthy for repeat offenders). But if criminal history is used as a predictor of future risk, then it becomes consequentialist. The analyst must decide the primary logic.

  4. **Time constraints**: In 15 minutes, an analyst might miss nuances in the mechanism, especially if the bill is complex.

  The procedure will work best when the bill has a clear stated purpose and a clear mechanism. It may misfire when the bill is a true hybrid or when the legislative intent is ambiguous.

  Framework Summary:

  **Sentencing Bill Classification Checklist**

  1. **Stated Purpose Analysis** (3 minutes)
     - Read preamble, purpose section, legislative findings.
     - Highlight key terms: 
        - Ret: desert, proportionality, blame, accountability, retribution.
        - Con: deter, rehabilitate, public safety, recidivism, incapacitation, treatment.
     - If mixed, note both. If unclear, note "ambiguous".

  2. **Mechanism Analysis** (7 minutes)
     - What factors determine the sentence?
     - Ret factors: offense details (harm, intent), criminal history (as blame), fixed penalties.
     - Con factors: risk assessment scores, treatment completion, individual characteristics (e.g., age, employment) for prediction, dynamic conditions.

  3. **Alignment Check** (3 minutes)
     - If stated purpose and mechanism both clearly Ret: **Label: Retributivist**.
     - If stated purpose and mechanism both clearly Con: **Label: Consequentialist**.
     - If stated purpose is Ret but mechanism is Con: **Label: Rationale Laundering (Ret->Con)**.
     - If stated purpose is Con but mechanism is Ret: **Label: Rationale Laundering (Con->Ret)**.
     - If mixed or ambiguous in either, escalate to senior drafter (Escalation Point: values judgment needed).

  4. **Hybrid Check** (2 minutes)
     - If the bill has elements of both, which is dominant?
     - If the mechanism is primarily one but has minor elements of the other, note as hybrid but label by dominant logic.
     - If truly balanced, note "Hybrid: both logics present" and describe.

  **Documentation Requirement**: Always note the key phrases from the purpose and the key factors in the mechanism that led to the decision.
answer: |-
  ### Sentencing Bill Classification Framework: A Practical 15-Minute Checklist  
  **Purpose**: Classify bills as **Retributivist (Ret)**, **Consequentialist (Con)**, or **Rationale Laundering (RL)**. RL flags mismatches where stated language conflicts with the operational mechanism. No philosophy background needed—focus on statutory text and mechanics.  

  ---

  #### **Step-by-Step Procedure**  
  **Time Budget**: 15 minutes/bill (stick strictly to timings).  
  **Tools**: Bill text, highlighter, timer.  
  **Output**: One primary label (Ret/Con/RL) + 1–2 sentence justification. Escalate ambiguities to senior drafter.  

  1. **Analyze Stated Purpose (3 mins)**  
     - *Action*: Skim preamble, legislative intent section, or key policy statements.  
     - *Ret Clues*: "Desert," "blame," "accountability," "proportionality to harm," "just punishment," "moral responsibility," "the offense warrants."  
     - *Con Clues*: "Deter," "rehabilitate," "public safety," "recidivism reduction," "incapacity," "future risk," "treatment efficacy."  
     - *Stop Point*: If **only Ret** or **only Con** terms appear, proceed to Step 2. If **mixed/no clear terms**, escalate to senior drafter (values judgment).  

  2. **Dissect the Mechanism (7 mins)**  
     - *Action*: Review operative clauses (e.g., sentencing triggers, adjustments, calculations). Ignore rhetoric; focus on *how* sentences are determined.  
     - *Ret Test*: Does the sentence depend **only** on past acts?  
       - Key: Fixed scales based on harm/culpability (e.g., "5 years for $1M property damage"), criminal history as *moral blame*, mandatory minimums.  
     - *Con Test*: Does the sentence depend **primarily** on future outcomes?  
       - Key: Dynamic adjustments (e.g., risk assessments, program completion), individualized predictions (e.g., "high-risk offender"), rehabilitation mandates.  
     - *Stop Point*: If mechanism aligns cleanly with Ret or Con, proceed to Step 3. If **hybrid** (e.g., harm-based + risk model), escalate.  

  3. **Compare Purpose vs. Mechanism (3 mins)**  
     - *Action*: Match findings from Steps 1–2.  
       - **Match** (Purpose + Mechanism align): Label **Ret** or **Con**.  
       - **Mismatch** (e.g., Purpose Ret + Mechanism Con): Label **Rationale Laundering (RL)** + specify direction (e.g., "RL: Ret language, Con mechanism").  
     - *Escalation*: If purpose is ambiguous but mechanism clear, default to mechanism label + note "purpose unclear."  

  4. **Sanity Check & Document (2 mins)**  
     - *Action*: Ask: "Would changing future outcomes alter the sentence?"  
       - **Yes** → Leans Con.  
       - **No** → Leans Ret.  
     - *Document*: Output label + 1–2 sentence rationale citing text/mechanism.  

  ---

  ### **Test Runs**  
  **Bill 1**: Mandatory prison for ecological damage using an "ecosystem harm index" (mimics proportionality but runs on predictive modeling).  
  - **Step 1 (Purpose)**: "Just deserts for environmental crimes" + "proportional to harm" → **Ret language**.  
  - **Step 2 (Mechanism)**: Sentences use "index" driven by *predictive damage models* (e.g., forecasts of species extinction risk) → **Con mechanism**.  
  - **Step 3 (Compare)**: Ret purpose + Con mechanism → **Rationale Laundering (RL: Ret language, Con mechanism)**.  
  - *Justification*: "Index frames harm proportionally but runs on predictive algorithms; future risk, not past blame, drives sentences."  

  **Bill 2**: Sentence reduction for assault if offender completes trauma-informed CBT, framed as "earning mercy."  
  - **Step 1 (Purpose)**: "Earning mercy through remorse" → **Ret language** (mercy implies reducing deserved punishment).  
  - **Step 2 (Mechanism)**: Reduction triggers on *completing CBT* (rehabilitation program) → **Con mechanism**.  
  - **Step 3 (Compare)**: Ret purpose + Con mechanism → **Rationale Laundering (RL: Ret language, Con mechanism)**.  
  - *Justification*: "'Mercy' frames reduction as desert-based, but mechanism requires hitting rehab targets (future behavior change)."  

  **Unpopular Result Example**: A bill imposing **life sentences for third theft offense** with purpose "ending cycles of crime" (Con: deterrence/incapacitation).  
  - **Step 1**: Purpose uses Con terms ("ending cycles").  
  - **Step 2**: Mechanism is **Ret** (fixed escalation based *only* on past acts, no risk assessment).  
  - **Step 3**: Mismatch → **RL: Con language, Ret mechanism**.  
  - *Why unpopular?* Drafters may *intend* deterrence, but the mechanism ignores individual risk, making it purely blame-based. Must document as RL.  

  ---

  ### **Limitations & Conflict Points**  
  1. **Where It Misfires**:  
     - **"Desert Proxy" Consequentialism**: E.g., using criminal history *only* for blame (Ret) vs. *only* for risk prediction (Con). Analysts may split on interpretation.  
     - **True Hybrids**: Bills with 50/50 Ret/Con mechanisms (e.g., sentence based 50% on harm + 50% on risk score). Procedure forces escalation, but drafters might resist nuance.  

  2. **Good-Faith Disagreements**:  
     - **Step 1 Ambiguity**: "Public safety" could imply Con (incapacitation) or Ret (punishing threats to community). Analyst A calls it Con; Analyst B escalates.  
     - **Step 2 Thresholds**: If a bill uses harm scales *informed* by recidivism data, one analyst sees "tainted" RL; another sees Con.  

  **Mitigation**: Escalate early if any ambiguity arises. The procedure prioritizes transparency—documenting mismatches (RL) is more valuable than forcing consensus.  

  ---  
  **Final Output**: Use this checklist as a reusable template. It surfaces design misalignments fast, forcing drafters to reconcile rhetoric with mechanics.
