prompt: |-
  You are an expert poet with a solid working knowledge of AI alignment theory, especially the conceptual material from Bostrom and Omohundro that circulates in rationalist circles. Please write a villanelle about the orthogonality thesis and instrumental convergence. One of the two refrains should express the orthogonality thesis: roughly, that an agent's capability and its final goals are independent axes, so no level of intelligence by itself entails any particular terminal aim. The other refrain should express instrumental convergence: that a very wide range of final goals nonetheless pushes a capable agent toward the same instrumental subgoals, such as self-preservation, goal-content integrity, cognitive enhancement, and resource acquisition. The form should do philosophical work. The villanelle's stubbornly returning refrains should enact how terminal goals stay arbitrary while the instrumental means keep reasserting themselves, and the closing quatrain, where the two refrains sit side by side, should show how orthogonality and convergence are compatible rather than competing claims. Make it accurate enough that an alignment researcher would recognize the distinction you are drawing, and good enough as a poem that a reader unfamiliar with the literature could still enjoy it. Before drafting, spend a while brainstorming candidate refrains and a stanza-by-stanza plan, thinking through how each tercet will alternate the two ideas and how the rhyme scheme will bear the repetition. Then give the finished poem.
