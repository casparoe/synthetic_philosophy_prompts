answer: |-
  You've nailed the core tension: Good's theorem (that free information has non-negative expected value for a rational Bayesian agent) seems to render strategic ignorance irrational *unless* it involves costs or anticipated irrationality. Finding genuine counterexamples that don't rely on these requires probing the theorem's foundational assumptions. Here's the exposure map:

  **Genuine Defeaters (Potentially Fatal): Cases where knowing lowers ex-ante utility *with perfect Bayesian updating and optimal action choice post-update*.**

  1.  **Preference Instability / State-Dependent Utility:**
      *   **Mechanism:** Learning X doesn't just change your beliefs about states of the world; it *changes your utility function itself* over outcomes. Your *ex-ante* self (pre-information) prefers not to know because your *ex-post* self (post-information) will have different values and make choices the *ex-ante* self disprefers.
      *   **Example:** You enjoy eating meat. Learning the gruesome details of factory farming might irrevocably shift your preferences, making you a vegetarian. Your *ex-ante* self (who loves steak) assigns higher expected utility to *not* knowing and continuing to enjoy steak, than to knowing and becoming vegetarian (even though the *ex-post* vegetarian self is acting optimally given *their* new preferences).
      *   **Fatality:** This directly violates Good's assumption of a *fixed utility function over outcomes*. If utility depends on the information state itself, the theorem doesn't apply. Defenders often respond by insisting rational agents should have stable, state-independent preferences ("You *should* prefer the truth!"). This risks circularity/tautology: defining "rational" to exclude preference shifts triggered by knowledge. **Verdict: Major challenge, potentially fatal if preference instability is accepted as rational.**

  2.  **Strategic Commitment via Ignorance (In Game Theory):**
      *   **Mechanism:** In multi-agent strategic interactions, ignorance can credibly commit you to a course of action that yields a better equilibrium than if you were informed and could optimize locally.
      *   **Examples:**
          *   **Centipede Game Variant:** Player 1 can choose to learn Player 2's type (cooperative or selfish) before deciding to "Take" (ending the game) or "Pass" (letting Player 2 decide). If Player 1 learns Player 2 is selfish, they *must* Take immediately to avoid exploitation (low payoff). If ignorant, Player 1 can Pass, forcing the potentially selfish Player 2 to also Pass (fearing Player 1 might be ignorant but *could* be irrational/cooperative), leading to a better payoff for both than the "Take immediately" outcome. Ignorance binds Player 1 to Passing.
          *   **Principal-Agent Problems:** A principal might prefer not to know an agent's exact effort level because knowing might force them (optimally) to punish shirking, destroying the relationship. Ignorance allows them to maintain a trusting, productive relationship the principal *ex-ante* prefers. Knowing rationally forces a worse equilibrium.
          *   **Self-Binding:** You rationally fear future temptation. Ignorance prevents you from learning the *specifics* of the temptation, making it easier to stick to your long-term plan (e.g., not knowing the exact location of the cookie jar). Learning would force you to confront the temptation directly, and (acting rationally *given the new information*) you might succumb.
      *   **Fatality:** This exploits the multi-agent context and the power of commitment. Ignorance changes the *game* others play against you, leading to a better Nash equilibrium *for you*. Good's theorem typically assumes a single-agent decision problem against nature, not strategic interdependence. **Verdict: Strong counterexample within its domain (strategic games). Fatal to the naive application of Good to strategic settings.**

  3.  **The Smoking Lesion Problem (Formal Counterexample - Causal vs. Evidential Decision Theory):**
      *   **Mechanism:** A classic Newcomb-like problem highlighting the conflict between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).
      *   **Setup:** You have a genetic lesion causing both a desire to smoke and lung cancer. Smoking itself *causally* does nothing. You can take a free test for the lesion.
      *   **Problem:**
          *   *Pre-Test:* Expected utility of smoking is high (desire satisfied) and cancer risk is tied to the lesion, not smoking.
          *   *Post-Test (Positive - Lesion Present):* EDT: Learning you have the lesion is strong evidence you'll smoke (desire) *and* get cancer. Smoking provides extra pleasure but is evidence you have cancer anyway. EDT might recommend *not* smoking to weakly disassociate yourself from the cancer group. CDT: Smoking causes no harm, so smoke away! *Both* choices are suboptimal compared to the pre-test state where you could smoke blissfully ignorant.
          *   *Post-Test (Negative - Lesion Absent):* Smoking is safe and pleasurable. Great! But the *expected* utility of taking the test includes the bad outcome where you test positive and (if using EDT) suffer by either not smoking or smoking while knowing your high cancer risk is confirmed.
      *   **Fatality:** A fully rational EDT agent (a legitimate form of Bayesian rationality) can have negative expected value of information in this scenario. The information creates spurious correlations that mislead EDT. Defenders often argue CDT is the "correct" rationality, dismissing EDT. **Verdict: A live formal counterexample *if* one accepts EDT as rational. Highlights the dependence on the *type* (CDT vs EDT) of Bayesian rationality assumed.**

  **Quasi-Defeaters / Awkward Cases (Often Dismissed by Defenders):**

  4.  **Information Costs Beyond Obvious Fees (Psychological/Decision Costs):**
      *   **Mechanism:** Processing information, managing attention, or coping with distressing knowledge consumes cognitive/emotional resources, lowering utility directly. While Good allows for "costly" information, defenders often restrict "cost" to direct monetary/effort costs of *acquiring* the info, not costs of *holding* or *processing* it.
      *   **Example:** Learning devastating news causes immense psychological anguish that isn't offset by better decisions. A defender might say: "The anguish is part of the outcome's utility; the information itself isn't harmful, it just reveals a bad state." **Verdict:** Defenders usually bite the bullet: if the anguish outweighs decision benefits, avoiding the info *is* rational due to the psychological "cost." Not a pure defeater, but highlights boundary issues.

  5.  **Changing the Action Set / Forcing Suboptimal Commitment:**
      *   **Mechanism:** Learning information might legally, ethically, or practically *force* you to take an action you *ex-ante* prefer to avoid, even if it's locally optimal post-update.
      *   **Example (Medical):** You suspect a mild, untreatable condition. Knowing definitively might legally require you to disclose it to employers/insurers, leading to discrimination/job loss. *Ex-ante*, you prefer the risk of the condition over the certainty of the negative consequences of knowing. **Verdict:** Defenders argue this isn't "free" information – the disclosure requirement is an external cost imposed *because* you know. The harm comes from the institutional response, not the knowledge itself + optimal action.

  **The Unfalsifiability Problem & Defenders' Moves:**

  You're right to be wary. The standard defense against counterexamples is often: "If knowing leads to lower *ex-ante* expected utility under perfect updating/optimization, then the agent wasn't *truly* rational or the problem setup violated Good's assumptions (stable prefs, single-agent, no causal confusion)."

  *   **Risk:** This *can* make the position unfalsifiable if "rationality" is defined solely as satisfying Good's theorem.
  *   **Mitigation:** Sophisticated defenders acknowledge the boundaries:
      1.  **Stable Preferences:** Good assumes fixed preferences over *outcomes*. Preference shifts invalidate it. They argue rational agents *should* have stable core preferences, viewing shifts as irrational or part of the outcome description.
      2.  **Decision Problem Scope:** Good applies to fixed decision problems. Strategic games change the problem structure via others' responses to your knowledge state.
      3.  **Causal Structure:** The Smoking Lesion shows the result depends on the decision theory (CDT vs EDT) used. Defenders argue CDT is correct, rendering EDT-based counterexamples invalid.
      4.  **Information as "Free":** Any cost (psychological, strategic, institutional) negates "freeness."

  **Predictions vs. Rival Accounts:**

  *   **Good's Prediction:** A rational agent will *never* refuse *truly free* information (no costs, stable prefs, single-agent, CDT) that could potentially improve decisions, *unless* they anticipate irrational updating/action post-learning.
  *   **Rival Account Predictions (e.g., Ambiguity Aversion, Regret Aversion, Bounded Rationality):**
      *   **Ambiguity Aversion (Knightian Uncertainty):** Agents may strictly prefer known risks (ignorance) over ambiguous uncertainties (potential knowledge), even if the EV of info is positive under Bayesianism.
      *   **Regret Minimization:** Agents might avoid information to prevent the possibility of experiencing regret over past suboptimal choices revealed by the info.
      *   **Bounded Rationality/Attention:** Agents avoid information due to cognitive limits on processing or the cost of managing complexity, *even if* they could theoretically update perfectly.
      *   **Motivated Reasoning/Self-Deception:** Agents avoid info threatening their self-image or desired beliefs *because* they know they *will* reason irrationally if they learn it.

  **Exposure Map Summary:**

  | **Challenge Type**             | **Example**                     | **Fatality**                                | **Defender Response**                                  | **Status**                     |
  | :----------------------------- | :------------------------------ | :------------------------------------------ | :----------------------------------------------------- | :----------------------------- |
  | **Preference Instability**     | Meat eater → Vegetarian shift   | **High** (Violates core assumption)         | "Preferences should be stable; shift is irrational"    | **Major Threat**               |
  | **Strategic Commitment**       | Centipede Game; Principal-Agent | **High** (Changes game structure)           | "Not a single-agent problem"                           | **Major Threat (in Games)**    |
  | **Causal/Evidential Conflict** | Smoking Lesion (EDT agent)      | **High** (If EDT accepted)                  | "CDT is correct rationality; EDT is flawed"            | **Formal Counterexample (EDT)**|
  | **Psychological "Costs"**      | Distress from bad news          | **Low** (Treated as cost)                   | "Anguish is part of outcome utility/cost"              | **Boundary Issue**             |
  | **Forced Action/Cost**         | Mandatory disclosure laws       | **Low** (Treated as external cost of knowing) | "Not 'free' information due to institutional response" | **Boundary Issue**             |
  | **Anticipated Irrationality**  | Knowing you'll reason badly     | **N/A** (Explicitly allowed by Good)        | "Concedes the point; strategic ignorance rational"     | **Not a Defeater**             |

  **Conclusion:** Good's theorem is remarkably robust *within its strict domain* (single rational agent, stable preferences, fixed action set, CDT, truly free information). The most potent threats are:

  1.  **Preference Instability:** If rational agents can have information-dependent utility, Good fails. Defenders reject this as irrational.
  2.  **Strategic Ignorance in Games:** Ignorance as a commitment device is a clear, practical counterexample. Defenders exclude it by scope.
  3.  **The Smoking Lesion (EDT):** A formal counterexample demonstrating dependence on the *type* of Bayesian rationality. Defenders reject EDT.

  The risk of unfalsifiability is real but mitigated by clearly stating the theorem's assumptions. Rival accounts predict strategic ignorance *even without* anticipated irrationality or costs, driven by ambiguity aversion, regret, or bounded cognition – phenomena Good's view struggles to explain within its core framework. The debate hinges on whether the boundaries defenders draw (stable prefs, single-agent, CDT) are essential to rationality or artificial constraints protecting the theorem. Preference shifts and strategic commitment remain the sharpest challenges.
