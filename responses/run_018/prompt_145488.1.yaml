  I'm auditing a course on 18th-century moral philosophy and we got stuck on a section from Kant's student-transcribed lecture notes from around the 1780s — I think they might be called the Collins notes but I'm genuinely unsure — and I think it reveals a hidden crack in his view on animals.

  The passage goes roughly like this: Kant says we owe no direct duties to animals because they lack rational agency and can't be ends-in-themselves, yet he also claims that being cruel to a dog is blameworthy in itself, not just because it makes us worse toward other people, and he rejects comparing it to damaging a useful tool precisely because the animal's suffering matters on its own, not instrumentally. That sounds like he's granting animals some minimal moral patienthood independent of human moral cultivation, which conflicts with every standard commentary that treats his position as purely indirect-duty. Is there a consistent reading where this blameworthiness is still mediated through our imperfect duty to preserve our own sympathetic capacities — maybe through what he describes as cultivating moral feeling — without actually committing him to direct duties? Or is the tension real, and does it come from him running together two different registers of duty, one juridical and one ethical, that later interperters conflate? I also keep wondering if that niche distinction between moral status and moral considerability, the one that separates being a rights-holder from being an object of direct moral concern, could be used to save him here, or if applying modern vocabulary just highlights that he's answering a different question than contemporary animal ethicists. Please lead with your bottom line in the first sentence — whether the tension is real or resolvable — then walk through the reasoning, with no preamble and without restating my question.
