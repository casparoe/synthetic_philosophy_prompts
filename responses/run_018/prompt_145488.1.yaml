answer: |-
  **Bottom line: The tension is real but largely resolvable within Kant's framework by emphasizing that the blameworthiness stems *exclusively* from violating an indirect duty to cultivate our own humanity, not from any direct duty to the animal; however, Kant's language sometimes strains this resolution.**

  Here's the reasoning:

  1.  **Core Kantian Principle:** Kant's foundational ethics requires rational autonomy for direct moral status. Only rational beings are "ends-in-themselves" capable of imposing duties *on* us. Animals, lacking autonomy, cannot be ends-in-themselves. Therefore, *direct* duties *to* them are logically impossible. Duties are *always* owed *to* rational beings (including oneself).

  2.  **The Indirect Duty Interpretation (Standard Reading):** The standard resolution hinges on duties *to oneself*. Cruelty to animals is wrong *because*:
      *   It violates our **imperfect duty to cultivate our own moral character** (*Metaphysics of Morals* VI:443).
      *   Specifically, it "damages" or "weakens" our capacity for moral feeling (sympathy, *Mitleid*) and humanity (*Menschheit*) within ourselves (*Collins* 27:413, *Moral Mrongovius* 29:629).
      *   This degradation makes us more likely to violate our *direct* duties *to* rational beings (other humans or ourselves). The animal is merely "the analogue of humanity" (*Moral Mrongovius* 29:629), a means for practicing (or corrupting) our moral disposition.

  3.  **Addressing the "Blameworthiness in Itself" Claim:** Kant's assertion that harming the animal is blameworthy "in itself" and *not* like damaging a "useful tool" *can* be interpreted consistently with indirect duties:
      *   **"In itself" refers to the *act's quality*, not its *object*:** The moral failing is inherent to the *human agent's* character deformation *at that moment*. It's blameworthy "in itself" because it constitutes an immediate failure of self-governance and cultivation of humanity *within the agent*. The act intrinsically manifests a cruel disposition harmful to one's moral self.
      *   **Contrast with Tools:** Damaging a tool lacks this *immediate moral significance for character*. While damaging a tool *could* imply negligence relevant to duties *to others* (e.g., wasting shared resources), cruelty to an animal *directly* enacts and reinforces a vicious tendency (*Grausamkeit*) within the agent's own disposition, which is inherently corrupting. The tool's "suffering" is irrelevant; the animal's sentience makes it a potent trigger for corrupting *human* sympathy.

  4.  **The Tension and Its Source:** Despite this resolution, tension arises because:
      *   **Language of Intrinsic Wrongness:** Kant's phrasing ("blameworthy in itself") and his specific rejection of the tool analogy *sound* like he's attributing non-instrumental moral significance to the animal's suffering *per se*, suggesting a direct concern that exceeds mere analogy.
      *   **Ethical vs. Juridical:** The tension might partially stem from the context (ethics lectures vs. published *Metaphysics of Morals*). The lectures emphasize the *ethical* duty of self-perfection and cultivation of feeling. The perceived "directness" might reflect the *ethical* weight of nurturing our *own* moral sensibility in response to suffering, rather than implying a juridical duty *owed to* the animal. Later systematizers sometimes flatten this nuance.
      *   **Modern Concepts:** Applying "moral considerability" (direct concern) vs. "moral status" (rights-bearing) highlights the gap. Kant *does* grant animals a form of "considerability" *because* their sentience makes them uniquely relevant triggers for human moral feeling. However, this "considerability" is entirely derivative of its role in *human* moral psychology and cultivation; it does not grant the animal any intrinsic moral standing or create a duty *to* it. The modern question "Does the suffering matter for the animal's sake?" receives a firm "No" from Kant; it matters *only* for the human agent's sake.

  **Conclusion:** While Kant's language occasionally pushes against the boundaries of pure instrumentalism (creating the tension the user notes), a consistent reading *within his system* is possible: The blameworthiness *is* mediated solely through the violation of the indirect duty to cultivate our own humanity and moral feeling. The animal's suffering matters *only* instrumentally, as the object upon which we act out a character flaw that damages *us*. The "in itself" refers to the inherent vice of the act *for the human agent*, not a direct wrong done *to* the animal. The tension arises because Kant's strong emphasis on the corrupting *immediacy* of cruelty and the unique moral relevance of animal suffering *feels* like attributing a degree of direct moral significance he theoretically denies.
