prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm drafting a column on when it's rational to plead complete ignorance. Rather than gesture at the principle of indifference in the abstract, I want to pressure-test my own instincts. Here are my verdicts on a run of cases, and I'd like to know whether any coherent principle underwrites them.

  Coin flips. I know nothing about a particular coin except that it will be flipped once. Assigning heads and tails a probability of one-half each strikes me as unobjectionable.

  Newborns. I know nothing about an expectant family beyond the fact of the pregnancy. Fifty-fifty on the sex of the child feels fine, maybe even mandatory.

  Alien life. Asked whether there is microbial life elsewhere in the galaxy, I find it absurd to answer fifty-fifty on the grounds that there are two possibilities and I know nothing favoring either. So: same binary structure as the coin, wildly different verdict.

  The biased coin. I'm handed a coin of unknown bias, with no information about how it was manufactured. Spreading my credence uniformly over every possible value of its propensity to land heads, from 0 to 1, strikes me as a reasonable expression of ignorance -- and I'm comfortable that this yields a one-half predictive probability for the first flip, matching the fair-coin case.

  The cube factory. A factory produces cubes with edge lengths somewhere between 1 and 2 centimeters, and I know nothing else. A uniform distribution over edge length implies one chance in four that the edge exceeds 1.5 cm; a uniform distribution over volume implies roughly two chances in five. Both feel equally arbitrary, so my verdict is that the question has no rationally privileged answer -- the proper response is to refuse to pick, not to pick one.

  The circle and the chord. A chord is drawn at random in a circle; what is the probability it exceeds the side of the inscribed equilateral triangle? Depending on how one parameterizes "at random" -- by the chord's midpoint, by the angle at the circumference, by the position along a fixed radius -- one gets different answers, and I see no grounds for preferring one. Same verdict as the cube: ill-posed.

  The mixture. A bottle contains water and wine in some ratio between one-to-one and two-to-one, nothing else known. Uniform over the ratio is inconsistent with uniform over its reciprocal, so again: no legitimate assignment.

  My puzzle is the biased coin. Structurally it seems no better off than the cube: I'm choosing a parameter (propensity rather than, say, the log-odds of that propensity) and spreading myself evenly over it, and different choices deliver different predictions. Yet my gut treats the two cases completely differently. Likewise the coin versus the aliens: both are symmetric binary ignorance, and I split them. Either there is a principle that separates the legitimate appeals to indifference from the illegitimate ones, or some of my verdicts have to go.

  So: what is the best candidate principle -- or small set of candidates, stated precisely enough that I could apply it myself -- that explains as many of these verdicts as possible? For each clause of your principle, tell me which case motivates it. Tell me honestly which of my verdicts it cannot save, and whether you'd overturn the verdict or complicate the principle. And finally, apply your answer to a case I haven't considered: a workshop produces metal rods whose lengths lie somewhere between 10 and 100 centimeters, and I know nothing whatsoever about the machine that cuts them. What, if anything, may I believe about the next rod?
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a science columnist trying to find a coherent principle for when it's rational to plead ignorance. They've presented several cases where their intuitions about assigning probabilities differ, and they're particularly puzzled by why the biased coin case feels different from the cube factory case. 

  First, I need to understand their core dilemma: why do some ignorance situations feel "unobjectionable" for uniform priors (coin flips, biased coin) while others trigger "refuse to pick" responses (cube, chord, mixture)? The key tension is between the coin/biased coin cases where uniform priors feel natural, and the cube/alien cases where they don't.

  Hmm, looking at their examples, I notice a pattern. The coin and newborn cases have clear physical symmetries—coin flips are mechanically symmetric, human sex determination is biologically symmetric. But alien life? No such symmetry—"life exists" and "no life" aren't equally plausible just because they're binary; we know life emerged once, so indifference feels wrong. 

  Ah! The biased coin is interesting. The user accepts a uniform prior over bias θ, which gives a 50% predictive probability for the first flip. But mathematically, this is equivalent to assuming the prior on log-odds is non-uniform. Why doesn't that bother them like the cube factory did? Probably because "bias" is a natural physical parameter here—the coin's center of mass, say—while cube volume vs. edge length feels arbitrary. 

  For the cube factory, both edge length and volume are valid parameters, but they lead to different probability distributions. Since there's no physical reason to prefer one over the other, insisting on either seems unjustified. Same for the chord problem—different randomization methods produce different answers, and no method is privileged. 

  The mixture case is similar: uniform over ratio (water:wine) vs. uniform over reciprocal (wine:water) are inconsistent. Without a "natural" parameter, indifference fails. 

  So a principle emerges: uniform priors are defensible only when (1) there's a physical symmetry or natural parameterization, and (2) the parameter space is compact (no infinite bounds). Coin flips satisfy both; aliens violate (1); cube factory violates (1) because neither parameterization is physically privileged. 

  Applying this to the rod example: length between 10-100 cm with no other info. Length is a natural parameter for rods (unlike cube volume vs. edge), and the range is finite. So uniform over length seems reasonable. If the range were unbounded, we'd have problems—but here it's fine. 

  The user might push back: "But why is length 'natural' for rods while volume wasn't for cubes?" Good point. For rods, length is typically the controlled dimension in manufacturing, whereas cubes are defined equally by edge or volume. Context matters. 

  Honestly, the alien case still feels tricky—even if we reject 50-50, is any other number better? The principle doesn't give an answer, which might frustrate the user. But that's the point: sometimes ignorance means no defensible probability, only qualitative uncertainty. 

  Final thought: the best principles here are Physical Symmetry + Natural Parameterization. They explain most cases except possibly newborns—is sex determination truly symmetric? Biologically, yes (nearly 50-50), so it holds. Alien life? No symmetry, so no 50-50. Biased coin? Physical bias is natural, so uniform over θ works. Cube factory? No natural parameter, so no prior. Rods? Length is natural, so uniform prior over [10,100] is okay.
answer: |-
  After analyzing your cases, I propose the **Natural Parameterization Principle (NPP)** combined with **Epistemic Defeat Conditions** as the best framework to systematize your intuitions. Here's the breakdown:

  ---

  ### **The Core Principle**
  **Natural Parameterization Principle (NPP):**  
  *When expressing complete ignorance, a uniform prior over a parameter is rational **only if** that parameter is "natural" to the underlying physical process generating the outcomes. A parameter is "natural" if:*  
  1. **It directly governs the causal mechanism** (e.g., bias in coin physics).  
  2. **Its scale is non-arbitrary** (e.g., no reciprocal/reparameterization symmetries break uniformity).  
  3. **The sample space is compact/finite** (no unbounded ranges).  

  **Epistemic Defeat Conditions (EDCs):**  
  *Reject any probability assignment if:*  
  - NPP fails (no unique natural parameter exists), *or*  
  - Background knowledge breaks symmetry (even if binary).  

  ---

  ### **Application to Your Cases**
  1. **Fair Coin Flip**  
     - *Verdict:* 50/50 is rational.  
     - *Why:* NPP applies. Coin physics is symmetric; no natural parameterization conflict. EDCs absent.  

  2. **Newborn Sex**  
     - *Verdict:* 50/50 is rational.  
     - *Why:* Biological mechanisms (sperm karyotype) are symmetric. Natural parameter: gamete type.  

  3. **Alien Microbial Life**  
     - *Verdict:* 50/50 is **absurd**.  
     - *Why:* EDC triggered. Background knowledge breaks symmetry (we know life *did* arise once, so P(life) ≫ P(no life) absent fine-tuning). Binary ≠ symmetric ignorance.  

  4. **Biased Coin (Propensity)**  
     - *Verdict:* Uniform over [0,1] is rational.  
     - *Why:* NPP satisfied. Propensity (θ) is the natural physical parameter (e.g., mass distribution). Compact space [0,1].  

  5. **Cube Factory (Edge vs. Volume)**  
     - *Verdict:* **No rational assignment**.  
     - *Why:* NPP violated. Edge length (L) and volume (V=L³) are equally "natural" geometrically. Uniform over L ⇒ non-uniform over V. EDC triggered.  

  6. **Circle Chord**  
     - *Verdict:* **Ill-posed**.  
     - *Why:* NPP violated. Parameterization (midpoint/angle/position) choices reflect different physical processes (e.g., spinning vs. dropping). No unique natural parameter.  

  7. **Water-Wine Mixture**  
     - *Verdict:* **No legitimate assignment**.  
     - *Why:* NPP violated. Ratio (r = water:wine) and reciprocal (1/r) are symmetric; uniform over r ⇏ uniform over 1/r. No natural scale.  

  ---

  ### **Tensions in Your Verdicts**
  - **Biased Coin vs. Cube Factory:** Your intuition holds. In the coin, *propensity* is causally central (governs flip dynamics). For the cube, *edge* and *volume* are causally symmetric (neither "controls" manufacturing more naturally).  
  - **Coin vs. Aliens:** EDC resolves this. Coins/newborns have symmetry in their *causal mechanisms*; alien life does not.  

  **Overturned Verdict?** None. Your instincts align with NPP + EDCs.  

  ---

  ### **Metal Rod Case: Application**
  - **Scenario:** Rod lengths between 10–100 cm; no other info.  
  - **Analysis:**  
    - *Natural parameter:* **Length** (L) is causally central (cutting blades set L).  
    - *Reparameterization test:* Surface area (∝L) or volume (∝L) would inherit uniformity. No conflict.  
    - *Compact space:* Bounded [10,100].  
  - **Conclusion:** Uniform prior over length is rational. You may believe:  
    - P(L > 55 cm) = 45/90 = 0.5  
    - P(L < 20 cm) = 10/90 ≈ 0.111  

  ---

  ### **Why This Works**
  NPP anchors ignorance priors to **causal structure**, not mathematical convenience. It explains:  
  - Why *propensity* saves the biased coin but *volume* fails the cube.  
  - Why binary outcomes sometimes get 50/50 (coin, baby) and sometimes not (aliens).  
  - When reparameterization invalidates indifference (cube, mixture, chord).  

  **Limitation:** "Naturalness" can be context-dependent (e.g., in some factories, rod *volume* might be controlled). But absent evidence, length is the default natural parameter for linear objects. Your verdicts stand unified.
