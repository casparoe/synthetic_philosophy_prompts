  Now, building the correspondence table for the organism analogy. The "body" is the society's structure, "immune system" could be institutions responding to threats, "genes" as cultural core, "environment" as geography and neighbors. But the disanalogies are crucial. Organisms have limited adaptability; societies can innovate. Death isn't inevitable for civilizations; some transform. Also, decay isn't "natural" or okay - that's a dangerous implication.

  The user is a novelist, so they need this analysis for dialogue. They probably want the characters to have a nuanced debate. The historian might be emotionally attached to the cycle idea, while the editor is pragmatic. The underlying themes might include whether decline is inevitable or preventable, and if human agency matters.

  I should note that the linearist could steal the analogy by focusing on adaptation over time, like evolution. But the main breaks are teleology, consciousness, and inevitability. Without the metaphor, cyclical theory relies on historical patterns, but those aren't laws. Each collapse has unique causes.

  For the verdict, I need a one-sentence bottom line. Something like: While the organism analogy powerfully evokes natural rhythms, its fatal disanalogies around choice and inevitability make it a rhetorical crutch that smuggles in fatalism more than it proves historical cycles.

