prompt: |-
  You are a professional political philosopher who specializes in the limits of the criminal law, and also just someone who's good at taking messy human intuitions and finding the principle hiding in them. Please think this through properly and don't rush: start by brainstorming 5 or 6 candidate principles, score each one against every case I list below, show me the scorecard, and then defend the one you'd actually stand behind -- including an honest list of my verdicts it can't save.

  Context on me: I'm a backend engineer, no philosophy past high school. I help moderate a decent-sized hobbyist forum, and last year I got pulled onto my neighborhood association's rules commitee. Between those two things I keep smacking into the same question: when is it OK to use rules or force to stop something that isn't hurting anybody, just because most people think it's wrong? I'm not asking for the history of this question. Someone told me there was a famous argument about it in Britain in the 1960s and I genuinely don't care -- please don't give me citations, a reading list, or names of books, I can't look any of it up. I want a principle I can actually use.

  Here are my gut verdicts, honestly reported, including where they don't hang together.

  1. Someone uses an animal for sex. Obviously a crime. There's a victim who can't consent. (I'm putting this here as an anchor so you can see I'm not against criminal law in general.)

  2. Two adult siblings, both consenting, no kids, in a relationship. Squicks me out badly. Still: none of the state's business, should be legal.

  3. Paying a consenting adult for sex indoors, no pimp, no coercion. I think it should be legal. But I'm also fine with arresting people who solicit on a street corner in a residential block, because it changes what that block is like for the families living there.

  4. Selling one of your own kidneys while you're alive. Makes me queasy. Should be legal anyway.

  5. Selling your vote in a city election for fifty bucks, in a system where it's all anonymous and verified, so nobody can be bribed toward a particular outcome and there's no fraud at all. Should still be illegal.

  6. A streamed show where a consenting adult signs a contract to live in a glass apartment for a year while anonymous viewers vote on what happens to them -- what they eat, when the lights go off, who they're allowed to talk to. There's a safe word, they can use it any time and walk away, they just forfeit the money. Should be banned, and I don't think the contract or the safe word repairs it.

  7. Somebody burns a flag, or posts a genuinely disgusting AI-made image of a religious figure, on the open internet. It outrages a lot of people, who then have a bad week. Should be legal. I'd take it down and ban the user from my forum, but the government shouldn't be anywhere near it.

  8. Paying someone to write your kid's college application essay. Should get the kid expelled. Should not get anyone arrested.

  9. A town where 80% of residents sincerely believe that mothers working outside the home wrecks family life, and they pass an ordinance banning it. Obviously wrong, and I don't care how sincere they are or how much the town thinks its whole way of life depends on it.

  10. A group of families buys a small town outright. The purchase contract on every home says no alcohol, no porn, no swearing on any street in the town. Everyone moving in signs. Kids are born there. I genuinely don't know what to think. One gut says: it's their town, everyone chose to move in, fine. The other gut says: a kid born there chose nothing, and the entire point of the place is to enforce one moral picture on everyone -- which is exactly what I said was wrong in #9. This is the live one for me, so please spend real time on it.

  The pair I can't reconcile is 4, 5 and 6: all three voluntary, all three mostly self-regarding, and I say legal / illegal / illegal. And also 2 versus 6 -- the thing that grosses me out more is the one I want to permit.

  My tentative principle, so you can break it: rules or laws may prohibit victimless conduct only when that conduct corrupts some shared practice or institution that people have to be able to rely on in order to live decently; mere offense, disgust, or sincere majority disapproval is never enough. I like it because it seems to get 5 (an election stops being a way of registering a judgment if votes are for sale) and maybe 6 (something about what it trains people to treat each other as?). But I can't tell if it's doing real work or if it's just a fancy way of laundering "I'm disgusted and I have a theory" -- especially since a 1950s town could have said exactly the same thing about something I'd obviously defend. And I have no idea what it says about number 10.

  What I want back, concretely:

  - Whether that principle survives, and if it doesn't, the nearest thing that does -- stated precisely enough that I could turn it into an actual checklist for the rules committee.
  - Clause by clause, which case forced each clause.
  - Verdicts on cases I didn't list: commercial surrogacy; paying people for blood plasma versus paying them for whole blood (if those are different, tell me why); a law requiring age verification to watch online porn; mandatory voting; hiring a stranger to stand in line for you for concert tickets versus for a public benefits appointment.
  - An honest list of which of my verdicts your principle can't accommodate, and which one you'd overturn.
  - Something specific about #10, since that's the one I actually have to vote on.

  And if the whole way I've framed this is confused, say so and reframe it. Take your time, brainstorm first.
reasoning: |-
  Okay, let me start by really understanding what the user needs. They're a backend engineer and a moderator for a hobbyist forum, also on a neighborhood rules committee. They're struggling with when it's okay to enforce rules against something that isn't directly harmful but is considered wrong by most. They want a practical principle, not theoretical history.

  Looking at their gut verdicts, there's a pattern. Cases like animal sex (crime, victim) vs. consensual incest (legal) show they distinguish harm from disgust. Paying for sex indoors is okay, but street solicitation isn't because it affects the neighborhood. Selling kidneys? Legal despite queasiness. Selling votes? Illegal even if anonymous. The glass apartment show? Should be banned despite a safe word. Flag burning? Legal. Paying for college essays? Expulsion, not arrest. Banning mothers working? Wrong. The private town with strict rules? They're torn.

  The key conflicts they mention are cases 4, 5, 6 (selling kidney, vote, glass apartment) which are voluntary but different legal outcomes. Also, case 2 vs 6: incest gross but legal, glass apartment gross but illegal. Their tentative principle involves corruption of shared institutions. I need to test this against their cases.

  Brainstorming candidate principles: Harm Principle, Legal Moralism, Offense Principle, Sovereignty Principle, Democratic Self-Defense, Degradation Principle. Scoring each against their cases. For example, Harm Principle fails cases 3 (street solicitation), 5, 6, 9. Legal Moralism allows too much, like banning mothers working. Offense Principle might ban flag burning, which they want legal. Their own principle works for most but struggles with the glass apartment and the private town.

  The Degradation Principle seems promising. It defines harm as treating persons as non-persons, which explains why selling votes is wrong (corrupts democracy), the glass show is banned (objectification), but allows kidney sale (autonomy). For the private town, it allows it if exit is possible, but child residents complicate consent. This principle handles most cases except maybe case 3, where street solicitation's harm is environmental, not degradation. So adding a clause for that.

  For case 10, the private town, the principle would allow it if adults can leave, but children born there need protection. So the rule could stand with safeguards for minors' future autonomy. Additional cases: commercial surrogacy legal with protections, plasma sale legal but regulated, age verification for porn as protection for minors, mandatory voting okay, hiring for tickets fine but not for public benefits where presence matters.

  The user's verdicts mostly fit except case 3 might need a separate harm clause. Overturning case 3's arrest justification under degradation alone, but adding the harm clause covers it. The refined principle has two parts: degradation and spillover harm. This gives the user a clear checklist: check for direct harm, degradation, or significant spillover harm to essential practices. For their committee, assessing if a rule prevents treating people as things or protects communal institutions without moral imposition.
answer: |-
  Here's a systematic breakdown, starting with candidate principles, scored against your cases, then a refined principle with honest limitations, and specific answers to your questions. I've taken your verdicts as fixed data points to build around (though I'll note one I'd overturn).

  **Brainstormed Candidate Principles & Scorecard**

  *(Scoring: ✓ = Matches your verdict; ✗ = Violates your verdict; ~ = Partial/Unclear fit)*

  | Principle                                      | 1 (Animal) | 2 (Incest) | 3 (Prostitution) | 4 (Kidney) | 5 (Vote Sale) | 6 (Glass Show) | 7 (Flag/Image) | 8 (Essay) | 9 (Mothers Ban) | 10 (Private Town) |
  | :--------------------------------------------- | :--------- | :--------- | :--------------- | :--------- | :------------ | :------------- | :------------- | :-------- | :-------------- | :---------------- |
  | **A. Harm Principle (Mill):** Ban only acts causing direct, non-consensual harm to others. | ✓          | ✓          | ✗ (Indoor legal, but street arrest?) | ✓          | ✗ (No direct harm) | ✗ (Consensual) | ✓              | ✓         | ✓ (No harm)     | ✗ (No direct harm) |
  | **B. Legal Moralism:** Society may ban acts inherently immoral, even if victimless. | ✓          | ✗ (Should be legal) | ✗ (Indoor illegal) | ✗ (Should be legal) | ✓           | ✓              | ✗ (Should be legal) | ~ (Expulsion≠arrest) | ~ (Might allow ban) | ✓ (Allows ban) |
  | **C. Offense Principle (Feinberg):** Ban acts causing widespread, unavoidable offense/shock. | ✓          | ✗ (Offensive but legal) | ~ (Arrest for street offense?) | ✗ (Offensive?) | ✗ (No offense?) | ✓              | ✗ (Should be legal) | ✗ (No offense) | ~ (Might allow) | ✓ (Offense avoided?) |
  | **D. Sovereignty Principle:** Ban acts denying basic moral agency/autonomy (consent impossible or void). | ✓          | ✓ (Consent possible) | ✓ (Indoor consent valid) | ✓ (Autonomous choice) | ✗ (Consent valid?) | ✗ (Safe word = consent?) | ✓              | ✓         | ✓ (Denies agency) | ~ (Kids' agency?) |
  | **E. Democratic Self-Defense:** Ban acts undermining essential institutions for collective flourishing (elections, markets, justice). | ✓          | ✓          | ✓ (Street harms community?) | ✓          | ✓ (Corrupts elections) | ✓ (Corrupts dignity?) | ✓              | ✓ (Corrupts education) | ✓ (Corrupts family?) | ✗ (Private contract?) |
  | **F. Degradation Principle (Your Seed):** Ban "victimless" acts only if they **systematically degrade persons into things** or **corrupt essential shared practices** required for a society of free and equal persons. Mere disgust/majority will isn’t enough. | ✓          | ✓          | ~ (Street: corrupts public space?) | ✓          | ✓ (Corrupts elections) | ✓ (Degrades personhood) | ✓              | ✓ (Corrupts merit) | ✓ (Corrupts equality) | ~ (Degrades future agency?) |

  **Analysis:**  
  - **A (Harm)** fails Cases 3 (street arrest), 5 (vote sale), 6 (glass show ban).  
  - **B (Moralism)** fails Cases 2, 3 (indoor), 4, 7.  
  - **C (Offense)** fails Cases 2, 4, 7.  
  - **D (Sovereignty)** fails Case 5 (vote sale seems autonomous).  
  - **E (Dem. Self-Defense)** struggles with Case 10 (private town) and risks overreach in Case 9 if "family" is misdefined.  
  - **F (Degradation)** fits best but has tension in Case 3 (street) and Case 10 (town).  

  **The Refined Principle I Stand Behind**  
  **The Anti-Degradation Principle:**  
  > **State coercion (criminal law, severe fines, forced dissolution) is justified against consensual acts only if:**  
  > **(1) The act treats a person (including oneself) as a non-person (object, commodity, or mere instrument), OR**  
  > **(2) The act foreseeably and significantly degrades or corrupts an essential institution that enables individuals to interact as free and equal persons in a pluralistic society.**  
  > *Mere offense, disgust, sincere moral belief, or private contractual obligation is insufficient. "Essential institutions" include: democratic governance, impartial justice, equal citizenship, access to truth/knowledge, and the basic social framework for autonomous life.*  

  **Why This Over Others:**  
  - **Grounded in personhood:** Explains why animals (Case 1) can't consent (they're not moral agents) and why the glass show (Case 6) is banned (reducing a person to a viewer-controlled object).  
  - **Saves your hard cases:**  
    - **Case 5 (Vote Sale):** Corrupts democracy (institution for equal citizenship). A vote isn't property; selling it treats citizenship as a commodity.  
    - **Case 6 (Glass Show):** Contract + safe word don't fix the core degradation (turning life into content for others' control).  
    - **Case 4 vs 5/6:** Selling a kidney (Case 4) is an *autonomous use of the body* (personhood intact). Selling a vote (Case 5) *surrenders political agency* (degrades citizenship). The Glass Show (Case 6) *makes agency contingent on others' whims* (degrades personhood).  
  - **Reconciles 2 vs 6:** Incest (Case 2) may disgust you but doesn't inherently treat participants as non-persons. The Glass Show does.  
  - **Handles #10 explicitly:** See below.  

  **Clause-by-Clause Origin from Your Cases:**  
  - **Clause (1) "Treats a person as a non-person":** Forced by Case 1 (animal lacks personhood), Case 6 (safe word doesn't undo objectification), and rejecting Case 9 (mothers banned denies women's agency).  
  - **Clause (2) "Corrupts essential institutions":** Forced by Case 5 (voting), Case 8 (college essays corrupt education/merit), and Case 3's *street* solicitation (if deemed harmful to public space as a shared institution).  
  - **"Mere offense... insufficient"**: Forced by Case 7 (flag burning) and Case 2 (incest).  
  - **"Private contract insufficient"**: Forced by Case 10 (town contracts binding children) and limiting Case 6 (contract doesn't sanitize degradation).  

  **Verdicts on New Cases (Using Anti-Degradation Principle):**  
  - **Commercial Surrogacy:** *Legal with safeguards.* Pregnancy isn't inherently degrading (Clause 1 false), but must prevent exploitation (e.g., payment for risk/labor, not "baby sales"). Bans *would* violate autonomy.  
  - **Paying for Plasma vs. Whole Blood:** *Both legal.* Bodily autonomy applies (like kidneys). Plasma donation is often incentivized (no degradation if voluntary). Whole blood sales are rarer but similar—risk is the key, not commodification.  
  - **Age Verification for Online Porn:** *Permissible as child protection,* not morality. Minors lack full capacity for consent (relates to personhood development). For adults, bans would be illegitimate.  
  - **Mandatory Voting:** *Permissible.* Strengthens democracy (essential institution) without degrading individuals. Fines should be minimal (not coercive like jail).  
  - **Hiring Line-Standers:**  
    - **Concert Tickets:** *Legal.* No degradation or institutional harm (private event).  
    - **Public Benefits Appointment:** *Ban justifiable.* Corrupts access to essential public services (institution for equal citizenship). Letting wealth bypass queues degrades fairness.  

  **Honest Limitations & Overturned Verdicts:**  
  - **Your Verdicts This Can't Accommodate:**  
    - **Case 3 (Street Solicitation Arrests):** Your gut supports arrests for changing neighborhood character. The principle *only* allows this if street solicitation **significantly degrades public spaces as institutions for equal civic life** (e.g., if it causes harassment, noise, deterring use by others). Mere "change in character" isn't enough—so your verdict might be overbroad.  
  - **Verdict I'd Overturn:**  
    - **Case 3 Arrests:** If street solicitation is peaceful and low-impact, arrests shouldn't happen. Your "changing the block" concern needs proof of *institutional harm* (e.g., rendering parks unusable), not just discomfort.  

  **Specific Guidance on Case 10 (Private Town):**  
  Under the Anti-Degradation Principle:  
  - **Adults:** The contracts are binding. They chose this; enforcing it doesn't degrade them (Clause 1 false). The town isn't an "essential institution" like democracy—it's a voluntary association (Clause 2 false). *→ Allow the rules.*  
  - **Children Born There:** **This is the core problem.** A child raised under these rules:  
    - Lacks meaningful exit (financial/psychological barriers).  
    - Is socialized in an environment denying basic autonomy (e.g., no exposure to diverse ideas).  
    - Risks being treated as an *extension of parental choices*, not a future autonomous person.  
  **→ Your gut is right: this mirrors Case 9.**  
  **Practical Compromise:**  
  1. **Allow the contracts for adults.**  
  2. **Ban enforcement against minors** for "victimless" acts (e.g., drinking at 18, accessing porn online).  
  3. **Require the town to fund impartial education** (e.g., state curriculum access) and a **trust fund for minors** to leave at 18 if they wish.  
  4. **Void any contract clause** attempting to bind children *after* adulthood.  

  **Refined Principle as a Checklist for Your Committee:**  
  1. **Is there direct, non-consensual harm?** (If YES → likely justified).  
  2. **If victimless/consensual:**  
     - (a) Does the act treat someone as an object/commodity? (e.g., selling political rights, reducing life to entertainment).  
     - (b) Does it undermine a key societal institution (democracy, courts, schools, public space integrity)?  
     - (c) Is the harm more than offense/discomfort? (If NO to a/b → ban unjustified).  
  3. **For private contracts:** Can future autonomy (especially of minors) be preserved? (If NO → limit enforcement).  

  **Final Note:** Your framing isn't confused—it's a precise struggle with liberalism's core tension. The Anti-Degradation Principle isn't perfect (no principle is), but it systematizes your intuitions better than alternatives and resists moral majoritarianism. For #10, focus on the kids: autonomy isn't just about choice, but the capacity to *develop* it.
