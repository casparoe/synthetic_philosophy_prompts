 tying it to a concrete laboratory scenario—for instance, an unanticipated replication failure that no adjustment of background conditions explains. Do not provide a bibliography, do not cite page numbers, and do not ask the audience to read Al-Ghazālī in translation; the speech must stand entirely on its own.
