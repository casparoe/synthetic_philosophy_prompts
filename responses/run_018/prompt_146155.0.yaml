  ### Sorting Instrument for Metaethical Commitments  
  Below is a decision tree designed to sort metaethical positions based on three core commitments. The questions are ordered to prevent redundancy: earlier answers do not make later questions irrelevant. Each path ends in a leaf, labeled with a recognized position (or "unnamed" if undefended). For each named position, a key awkward commitment is noted regarding either cross-cultural disagreement or moral authority over agents lacking typical psychological capacities. Ambiguous leaves include a diagnostic case to resolve overlap. Two unoccupied combinations are identified and diagnosed.  

  #### **Decision Tree**  
  **Question 1 (Nature of Moral Disagreement):**  
  When people deeply disagree about morality (e.g., "Capital punishment is wrong"), is this primarily:  
  - **A clash of beliefs** (trying to discover a moral fact, like debating historical events)?  
  - **A clash of attitudes or plans** (like conflicting tastes in music, where no "fact" settles it)?  

  *If A (clash of beliefs), go to Question 2.*  
  *If B (clash of attitudes/plans), skip to Question 3.*  

  **Question 2 (Truth Conditions, if Moral Claims Are Factual):**  
  If moral claims (e.g., "Slavery is unjust") can be true or false, what makes them true?  
  - **Natural properties alone** (e.g., psychological, biological, or social facts observable by science).  
  - **Irreducibly normative properties** (special moral properties beyond science, like "inherent wrongness").  
  - **Idealized response conditions** (e.g., "what a perfectly rational, informed person would endorse").  

  *Then proceed to Question 3.*  

  **Question 3 (Moral Progress):**  
  Can societies morally progress (e.g., abolishing slavery)?  
  - **Yes, as converging on independent truths** (like scientific progress toward objective reality).  
  - **Yes, as achieving greater coherence in attitudes** (like refining a messy set of preferences).  
  - **No, progress is incoherent** (the concept doesn’t meaningfully apply to morality).  

  ---

  #### **Mapping Answers to Positions**  
  *Each path is defined by the sequence of answers (Q1 → Q2 → Q3).*  

  1. **A (beliefs) → Natural properties → Convergence on truths**  
     - **Cornell-style naturalist realism**  
       - *Awkward commitment:* Moral properties (e.g., "wrongness") are natural, yet must explain why they feel uniquely action-guiding compared to other natural facts (e.g., "water is H₂O").  
     - *Leaf:* Named position.  

  2. **A (beliefs) → Natural properties → Coherence in attitudes**  
     - **Unnamed**  
       - *Diagnosis:* Unstable. Collapses into convergence (if natural properties are objective) or relativism (if "coherence" implies community-dependence).  
     - *Leaf:* Unoccupied.  

  3. **A (beliefs) → Natural properties → Progress incoherent**  
     - **Moral relativism**  
       - *Awkward commitment:* Requires tolerating horrific practices (e.g., genocide) in other cultures if locally accepted, undermining universal humanitarian intuitions.  
     - *Leaf:* Named position.  

  4. **A (beliefs) → Irreducibly normative properties → Convergence on truths**  
     - **Non-naturalist realism**  
       - *Awkward commitment:* Moral truths are unknowable to beings lacking "normative intuition" (e.g., animals or AI), yet causing them suffering may still seem wrong.  
     - *Leaf:* Named position.  

  5. **A (beliefs) → Irreducibly normative properties → Coherence in attitudes**  
     - **Unnamed**  
       - *Diagnosis:* Incoherent. Non-natural properties are mind-independent, so progress cannot rely on coherence (a mind-dependent process).  
     - *Leaf:* Unoccupied.  

  6. **A (beliefs) → Irreducibly normative properties → Progress incoherent**  
     - **Error theory**  
       - *Awkward commitment:* All moral claims (e.g., "charity is good") are false, yet everyday moral practices remain useful and persistent.  
     - *Leaf:* Named position.  

  7. **A (beliefs) → Idealized response → Convergence on truths**  
     - **Unnamed**  
       - *Diagnosis:* Incoherent. Truths cannot be both "independent" (convergence) and defined by subjective responses (idealized conditions).  
     - *Leaf:* Unoccupied.  

  8. **A (beliefs) → Idealized response → Coherence in attitudes**  
     - **Ideal-observer constructivism**  
       - *Awkward commitment:* Morality binds beings with limited rationality (e.g., children) even if they cannot grasp "ideal" responses.  
     - *Leaf:* Named position.  

  9. **A (beliefs) → Idealized response → Progress incoherent**  
     - **Unnamed**  
       - *Diagnosis:* Incoherent. If ideal responses define truth, progress toward them must be possible.  
     - *Leaf:* Unoccupied.  

  10. **B (attitudes/plans) → [No Q2] → Coherence in attitudes**  
      - **Non-cognitivist expressivism** OR **Ideal-observer constructivism (non-cognitive)**  
        - *Shared awkward commitment:* Deep cultural disagreements (e.g., honor killings) may be unresolvable if attitudes are fundamentally incompatible.  
        - *Ambiguity:* These positions are indistinguishable here. Use diagnostic case:  
          - **Diagnostic case:** *Can a being with no conscious states but functional analogues to suffering (e.g., a robot that screams when damaged) be wronged?*  
            - **Expressivism:** Typically says "no"—wrongness depends on human attitudes, not functional states.  
            - **Constructivism:** Typically says "yes"—if an ideal observer condemns causing such suffering.  
      - *Leaf:* Ambiguous; requires resolution.  

  11. **B (attitudes/plans) → [No Q2] → Progress incoherent**  
      - **Unnamed**  
        - *Diagnosis:* Unexplored. Denying progress conflicts with non-cognitivism’s aim to refine attitudes.  
      - *Leaf:* Unoccupied.  

  ---

  #### **Scoring Key**  
  1. **Start with Question 1.**  
     - If **A (clash of beliefs)**, answer **Question 2**, then **Question 3**.  
     - If **B (clash of attitudes/plans)**, skip to **Question 3**.  

  2. **Match your answers to the paths above:**  
     - Use your sequence (e.g., "A → Natural properties → Convergence" = Cornell realism).  
     - For **B → Coherence**, use the diagnostic case to split non-cognitivist expressivism and constructivism.  

  3. **Unoccupied paths:** Diagnosed as incoherent, unstable, or unexplored.  

  This instrument avoids labels-first sorting, exposing how commitments logically interact. It covers major positions while highlighting gaps in the metaethical landscape.
