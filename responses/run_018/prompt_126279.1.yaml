  ## Adversarial Collaboration Statement: Weberian-Structuralist Concordat on Historical Causation  

  **Preamble**  
  We, the undersigned, acknowledge a decade of unproductive polemic. We commit to this adversarial collaboration to:  
  (a) Clarify precise points of disagreement,  
  (b) Identify testable historical predictions,  
  (c) Distinguish substantive disputes from terminological noise.  
  Our feud hereby enters a phase of structured, evidence-driven contestation.  

  ---

  ### 1. Agreed Claims (Signed by Both Camps)  
  1. **Historical Record**: Protestant theological shifts (e.g., Calvinist predestination) & early capitalist practices (e.g., reinvestment, disciplined labor) co-occurred in early modern Northwestern Europe.  
  2. **Anti-Monocausality**: Neither pure theological determinism nor crude material determinism adequately explains the "Great Divergence."  
  3. **Causal Threshold**: A valid macro-cause must demonstrate *non-spurious correlation*, *temporal precedence*, and a *plausible mechanism* linking cause to effect.  
  4. **Hermeneutic Necessity**: Understanding *what historical actors believed they were doing* is essential to social explanation — even if those beliefs are epiphenomenal.  

  ---

  ### 2. Disagreements Table  
  | Crux                                                                 | Weberian Formulation (Signable)                                                                 | Structuralist Formulation (Signable)                                                                | Shared Predictive Case                      | Weberian Prediction                                                                 | Structuralist Prediction                                                              |  
  |----------------------------------------------------------------------|-------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|---------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|  
  | **Causal Status of Value-Rational Action**                           | Value-rational action (e.g., ascetic accumulation for salvation) can be a *causal co-driver* at the macro level without being reducible to material interests. | "Value-rational action" describes agency, but its macro-social *causal efficacy* is excluded by materially-rooted structural constraints. | Rise of mercantile ethos in Ming China      | Absence of analogous salvation-anxiety & systematic reinvestment ethic prevents spontaneous capitalist takeoff. | Merchant wealth consistently triggers state confiscation/feudal co-option absent protected property rights. |  
  | **"Elective Affinity" as Mechanism**                                 | Elective affinity denotes a *causal feedback loop*: theological innovations reshape material incentives, which recursively amplify compatible values.             | "Elective affinity" is hermeneutic patterning — it highlights correlation, not causal force. Material conditions select which values *appear* influential. | Reformation dynamics in resource-poor regions | Affinity intensifies where material conditions permit value-rational action to reshape institutions (e.g., Dutch water management). | Structural pressures explain Reformation spread; "affinity" merely rationalizes outcomes post-hoc. |  
  | **Direction of Primacy**                                             | Cultural values exhibit *downward causation*: Calvinist anxiety altered capital accumulation strategies, modifying economic structures.                         | Cultural shifts are *emergent properties* of class conflict/technological change; Protestantism is a superstructural adaptation to feudalism’s crisis. | Post-Plague labor scarcity in England       | Regions with stronger pre-existing ascetic traditions (e.g., Lollardy) show faster adoption of capitalist labor discipline. | Wage inflation/land enclosures predict labor discipline shifts, regardless of local theology. |  

  ---

  ### 3. Verbal Disagreement Identification  
  - **Flagged**: Partially verbal.  
  - **Reason**: Dispute over the *semantic threshold of "cause"*.  
    - Weberians use "cause" for *necessary component within a conjunctural mechanism*.  
    - Structuralists reserve "cause" for *materially-grounded sufficient conditions*.  
    - **Non-verbal core**: Whether values possess *causal autonomy* (Weberian) or are *causally inert byproducts* (Structuralist).  

