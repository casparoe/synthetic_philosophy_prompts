  I'm putting together the Q&A for a long feature I'm writing on Wittgenstein and religious belief — my guest is a philoshoper named Dr. Solín, who's just brought out a monograph arguing Wittgenstein wasn't a fideist at all but held what he calls 'grammatical reverence': belief as a non-propositional posture embedded in shared behavioural practice rather than private mental assent.

  I need eight or nine interveiw questions that don't just have him restate the view. At least one should press the standard fideist reading of his remarks on religious belief, one should ask whether this reverence can survive outside an actual religious community, and one should tackle how he squares it with the Tractatus talk about the mystical — and for each, include a follow-up keyed to the reply he's most likely to give, probably that treating belief like an empirical claim is a category mistake. He's also got this annoying habit of deflecting with the line that that's just how language works, so please build in a sequence that makes that move progressively harder, ending with one question about what kind of evidence could actually count against his view. I'm typing this quickly on my phone between meetings, so apologies for any sloppy spelling — British usage prefered, please.
