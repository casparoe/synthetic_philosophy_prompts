   POLICY PROPOSAL SCREENING PROCEDURE FOR WORLD HAPPINESS REPORT RANKING CLAIMS

   Input: A policy proposal that claims to raise the country's WHR ranking.

   Output: Assign one of the following:
     A: Treat the ranking gain as primary evidence of welfare improvement.
     B: Treat it as secondary evidence only.
     C: Disregard it for welfare-justification purposes.

   Steps:

   1. Is the policy primarily aimed at affecting the WHR ranking through publicity, media campaigns, or by influencing how survey respondents answer the life evaluation question (without improving their actual living conditions)?
