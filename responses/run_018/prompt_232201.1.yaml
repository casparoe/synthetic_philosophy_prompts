  We are designing a screening procedure for policy proposals that claim to raise the country's World Happiness Report (WHR) ranking. The procedure must decide how much evidential weight to give to a predicted change in the ranking for welfare improvement. The output is one of three: 
    (A) Treat the ranking gain as primary evidence of welfare improvement.
    (B) Treat it as secondary evidence only.
    (C) Disregard it for welfare-justification purposes.

   The procedure must account for:
    1. The distinction between the narrow life-evaluation score (the Cantril ladder) used in WHR and happiness in a richer sense.
    2. Distinguishing between policies that improve the underlying state the survey tries to measure and those that improve only the measurement or relative position.
    3. Distinguishing between policies that change wellbeing itself and those that change the score through adaptive preferences, gaming, changes in survey composition, or shifts in the index's underlying components.
    4. The fact that the rankings are modeled from a small set of predictors (GDP per capita, social support, healthy life expectancy, freedom to make life choices, generosity, and perceptions of corruption) and the proposal might claim to affect these predictors directly, indirectly, or only through publicity.

   The procedure must be a fixed sequence of questions, with checklist and plain-language explanations, taking under an hour per proposal. It should mark steps requiring professional judgment.

   We design the procedure as a flowchart of questions. At each step, if the answer leads to a conclusion (A, B, or C) we stop. Otherwise, we proceed. 

   Steps:

   Step 1: Check if the policy is claimed to affect the WHR ranking primarily through publicity or media campaigns about the country's happiness, without affecting the underlying predictors or the survey responses.
     Explanation: Some policies might aim to boost the country's image without changing the actual conditions. This might lead to a higher ranking if other countries are not doing the same, but it does not reflect real welfare improvement.
     Checklist: Look for key words like "promote", "branding", "awareness", "campaign", without concrete actions on the predictors. Also, if the policy focuses on influencing the survey respondents' answers (e.g., by training them to answer more positively) without changing their actual conditions, that is also problematic.
     Judgment: The analyst must judge whether the primary mechanism is about changing perceptions without changing reality.
     If YES (the policy aims to affect the ranking mainly by publicity or influencing survey responses without changing the underlying conditions) → Output C: Disregard.

   Step 2: Check if the policy directly targets one or more of the six WHR predictors (GDP per capita, social support, healthy life expectancy, freedom, generosity, corruption) in a way that is likely to improve the underlying conditions for the population.
     Explanation: The WHR predictors are chosen because they are thought to be important for well-being. If the policy improves these, it is likely to improve well-being, but note that the predictors are proxies and might not capture everything.
     Checklist: The proposal should mention specific actions that would change one of the six. For example, a policy to increase access to healthcare (affects healthy life expectancy) or to reduce corruption (affects perceptions of corruption).
     If YES → Proceed to Step 3.
     If NO → Proceed to Step 4.

   Step 3: Assess whether the targeted predictor(s) are being improved in a way that is likely to have a broad and sustained impact on the population's well-being, beyond just the WHR score.
     Explanation: Even if a predictor is targeted, the improvement might be marginal, temporary, or concentrated in a small group. Also, we must consider if the improvement in the predictor is likely to translate to genuine well-being gains in a broader sense than just the ladder score.
     Checklist: 
       - Is the policy expected to reach a large portion of the population?
       - Is the effect likely to last?
       - Are there potential negative side effects on other aspects of well-being? (e.g., a policy that boosts GDP but at the cost of environmental degradation might not improve overall well-being.)
     Judgment: The analyst must use professional judgment on the breadth, sustainability, and potential trade-offs.
     If the policy is judged to have a substantial, broad, and sustainable positive impact with minimal negative side effects → Output A: Treat as primary evidence.
     Otherwise → Output B: Treat as secondary evidence only (because the effect might be real but limited or uncertain).

   Step 4: The policy does not directly target a WHR predictor. Now check if it is claimed to affect the ranking by changing the composition of the survey sample (e.g., by changing who is surveyed) or by influencing how respondents answer the ladder question (e.g., through coaching or by changing the survey context) without changing their actual life conditions.
     Explanation: If the policy changes who is surveyed (e.g., excluding unhappy groups) or manipulates responses (e.g., by threatening respondents), then the score change does not reflect real well-being.
     Checklist: Look for any mention of altering survey methodology, sample selection, or response coaching. Also, if the policy creates a temporary mood boost (e.g., a national event that makes people temporarily happier during the survey period) without lasting change.
     Judgment: The analyst must determine if the primary mechanism is manipulation of the survey.
     If YES → Output C: Disregard.

   Step 5: Check if the policy is claimed to affect the WHR ranking by changing the country's relative position without changing its absolute score? (e.g., by harming other countries' scores or by strategic timing of the policy to coincide with the survey period in a way that other countries might not be doing).
     Explanation: The ranking is relative. A country might move up because others get worse, not because it improves. Also, if the policy is timed to have a temporary effect during the survey period, it might not reflect a lasting improvement.
     Checklist: Does the proposal rely on events in other countries? Or does it aim for a short-term boost that might not be sustainable?
     If YES → Output C: Disregard (because the absolute well-being may not change).

   Step 6: Check if the policy is claimed to improve well-being in a way that is not captured by the six predictors, but that might still be reflected in the ladder score because of a general improvement in life conditions.
     Explanation: The ladder score (life evaluation) is a broad measure. Even if a policy doesn't target one of the six predictors, it might still improve life conditions and hence the ladder score. However, we must be cautious because the ladder score might not capture everything (or might be influenced by irrelevant factors).
     Checklist: The proposal should describe a mechanism by which the policy would make people's lives better in a general sense (e.g., improving environmental quality, reducing crime, enhancing cultural life) that is not directly one of the six predictors but might be expected to improve life satisfaction.
     If YES → Proceed to Step 7.
     If NO (i.e., the policy does not target any known aspect of well-being and does not target the predictors) → Output C: Disregard.

   Step 7: Assess the strength of the causal link between the policy and the expected improvement in the ladder score, and whether the improvement reflects a genuine gain in well-being.
     Explanation: Even if the policy might improve life conditions, we must consider:
       - Adaptive preferences: Could the policy make people more satisfied by lowering their expectations? (e.g., propaganda that makes people feel better about a bad situation)
       - Gaming: Is the policy designed to make people report higher even if their lives aren't better?
       - Whether the improvement in the ladder score is likely to be sustained and represent a real change in how people evaluate their lives.
     Checklist: 
       - Is the policy improving actual living conditions?
       - Could the policy lead to a higher ladder score without improving living conditions? (e.g., by inducing a temporary positive mood, or by social pressure to report positively)
       - Are there potential negative effects on other aspects of well-being? (e.g., a policy that increases life satisfaction by promoting materialism might reduce environmental quality)
     Judgment: The analyst must judge whether the link is strong and whether the improvement is genuine.
     If the causal link is strong and there are no major concerns about adaptation, gaming, or negative side effects → Output B: Treat as secondary evidence (because it is not directly targeting the predictors, so we are less certain about the mechanism and the WHR ranking might be influenced by other factors).
     If there are concerns about the genuineness of the well-being improvement → Output C: Disregard.
     If the link is weak or uncertain → Output C: Disregard.

   Step 8: If the policy does not clearly fit any of the above, or if there is significant uncertainty, then we flag the case as unsettled and recommend further analysis by senior officials or experts.

