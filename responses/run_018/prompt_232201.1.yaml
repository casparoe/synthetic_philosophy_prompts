answer: |-
  ### Policy Proposal Screening Procedure: World Happiness Report Ranking Claims  
  **Objective**: Evaluate the evidential weight of a predicted change in the WHR ranking for justifying a policy’s welfare impact. Assign one of three outputs:  
  - **A**: Treat ranking gain as **primary evidence** of welfare improvement.  
  - **B**: Treat ranking gain as **secondary evidence only** (use alongside other indicators).  
  - **C**: **Disregard** ranking gain for welfare justification.  

  **Time Limit**: Under 60 minutes per proposal.  
  **Key Principles**:  
  - The WHR ranking is based on a **life evaluation score** (0–10 ladder, "Cantril ladder"). This is narrower than "happiness" in a richer sense (e.g., emotional well-being, purpose).  
  - Rankings depend on six predictors: GDP/capita, social support, healthy life expectancy, freedom, generosity, and corruption perceptions.  
  - A policy may raise the ranking without improving welfare (e.g., by manipulating scores, not reality).  

  ---

  ### Step-by-Step Procedure  
  **Step 1: Identify the Claimed Mechanism**  
  *What does the proposal say will directly cause the ranking change?*  
  - **Checklist**: Look for explicit statements (e.g., "This policy will increase GDP," "improve survey responses," or "boost our international image").  
  - **Explanation**: Clarify whether the policy targets the WHR’s predictors, the survey process, publicity, or unrelated factors.  
  - **Judgment**: None. Record the mechanism.  

  **Step 2: Check for Direct Predictor Targeting**  
  *Does the policy directly alter one or more of the six WHR predictors?*  
  - **Checklist**: The six predictors are:  
    1. Log GDP per capita.  
    2. Social support (e.g., community programs).  
    3. Healthy life expectancy (e.g., healthcare).  
    4. Freedom to make life choices (e.g., civil liberties).  
    5. Generosity (e.g., charitable incentives).  
    6. Corruption perceptions (e.g., transparency laws).  
  - **Explanation**: If yes, the policy may improve underlying welfare. If no, proceed to Step 4.  
  - **Judgment**: None.  

  **Step 3: Assess Predictor Impact Quality**  
  *If targeting predictors (from Step 2), is the impact broad, sustained, and aligned with genuine welfare?*  
  - **Checklist**:  
    - **Broad**: Affects >30% of the population (use illustrative threshold).  
    - **Sustained**: Lasts >2 years beyond the policy’s end.  
    - **Aligned**: No major trade-offs (e.g., GDP growth that worsens inequality or environment).  
  - **Explanation**: Welfare requires more than a predictor shift (e.g., GDP rising via exploitative labor harms well-being).  
  - **Judgment**: Analyst assesses breadth, duration, and trade-offs.  
    - **If all three criteria met → Output A**.  
    - **If one or more criteria not met → Output B**.  

  **Step 4: Check for Non-Predictor Mechanisms**  
  *Does the policy raise the ranking without changing predictors? (Skip if Step 2 was "yes")*  
  - **Checklist**: Look for:  
    - **Publicity/media campaigns** (e.g., "rebrand the country as happier").  
    - **Survey manipulation** (e.g., coaching respondents, changing survey timing/location).  
    - **Relative gaming** (e.g., policies timed to coincide with other countries’ downturns).  
  - **Explanation**: These exploit ranking mechanics without improving welfare.  
  - **Judgment**: None.  
    - **If any mechanism applies → Output C**.  
    - **If none apply → Proceed to Step 5**.  

  **Step 5: Check for Indirect Welfare Links**  
  *Does the policy improve well-being in ways beyond the six predictors?*  
  - **Checklist**: Look for non-predictor welfare claims (e.g., mental health services, environmental cleanup, arts funding).  
  - **Explanation**: The life evaluation score *may* reflect broader welfare, but this link is weaker than direct predictors.  
  - **Judgment**: None.  
    - **If yes → Proceed to Step 6**.  
    - **If no → Output C**.  

  **Step 6: Assess Genuineness of Welfare Gain**  
  *Could the policy inflate the life evaluation score without real welfare gains?*  
  - **Checklist**:  
    - **Adaptive preferences**: Does the policy encourage resignation (e.g., propaganda masking problems)?  
    - **Gaming**: Does it incentivize exaggerated survey responses (e.g., rewards for "high ladder" answers)?  
    - **Exclusion**: Does it alter survey demographics (e.g., targeting surveys to affluent areas)?  
    - **Temporary effects**: Is the benefit short-term (e.g., a festival during survey month)?  
  - **Explanation**: A score change must reflect lasting, authentic improvements.  
  - **Judgment**: Analyst assesses risks of artificial inflation.  
    - **If no risks → Output B**.  
    - **If any risk applies → Output C**.  

  ---

  ### Worked Examples  
  **Example 1: Output C (Disregard)**  
  **Proposal**: *Launch a "Happiness PR Campaign" to train citizens to describe their lives more positively during WHR surveys.*  
  - **Step 1**: Mechanism: Influencing survey responses.  
  - **Step 2**: Targets predictors? No.  
  - **Step 4**: Non-predictor mechanism? Yes (survey manipulation). **→ Output C**  
  **Why**: Ranking gain relies on coached responses, not better lives.  

  **Example 2: Output B (Secondary Evidence)**  
  **Proposal**: *Subsidize volunteerism to boost "generosity" scores.*  
  - **Step 1**: Mechanism: Targeting generosity predictor.  
  - **Step 2**: Targets predictors? Yes (generosity).  
  - **Step 3**: Impact quality?  
    - Broad: Yes (open to all citizens).  
    - Sustained: Unclear (participation may drop post-subsidy).  
    - Aligned: Yes (no major trade-offs).  
    Judgment: Sustained impact uncertain **→ Output B**.  
  **Why**: Generosity may rise, but effect is not guaranteed to last. Ranking evidence should complement other welfare metrics.  

  **Example 3: Output A (Primary Evidence)**  
  **Proposal**: *Universal primary care expansion to increase healthy life expectancy.*  
  - **Step 1**: Mechanism: Targeting health predictor.  
  - **Step 2**: Targets predictors? Yes (healthy life expectancy).  
  - **Step 3**: Impact quality?  
    - Broad: Yes (covers all regions).  
    - Sustained: Yes (lifelong preventive care).  
    - Aligned: Yes (no trade-offs mentioned). **→ Output A**  
  **Why**: Directly improves a core welfare predictor with broad, lasting benefits.  

  **Example 4: Unsettled Case (Consult Senior Officials)**  
  **Proposal**: *Mandate corporate diversity quotas to improve "social support" scores.*  
  - **Step 1**: Mechanism: Targets social support (via workplace inclusion).  
  - **Step 2**: Targets predictors? Yes.  
  - **Step 3**: Impact quality?  
    - Broad: Debatable (only affects employees).  
    - Sustained: Yes.  
    - Aligned: Uncertain (may cause resentment).  
  - **Judgment**: Trade-offs are ambiguous. Analyst cannot resolve alignment.  
  **Outcome**: Flag for senior review. Welfare impact depends on context not captured in WHR.  

  ---

  ### Summary Checklist for Analysts  
  1. Identify mechanism.  
  2. Check direct predictor targeting.  
  3. If predictors targeted: Assess breadth, sustainability, alignment.  
     - Pass all? **→ A**  
     - Fail any? **→ B**  
  4. If not predictors: Check for publicity/survey/relative gaming.  
     - Any present? **→ C**  
  5. If non-predictor welfare claims: Check for broader links.  
     - None? **→ C**  
  6. If broader links: Check for artificial score inflation.  
     - No risks? **→ B**  
     - Risks? **→ C**  
  **When stuck**: Consult senior officials (e.g., unsettled trade-offs, ambiguous welfare links).  

  **Time-Saving Tip**: Use a flowchart diagram for quick reference.
