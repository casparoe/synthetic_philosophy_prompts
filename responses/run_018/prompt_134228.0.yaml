prompt: |-
  As a journalist who covers emerging science, I need a reusable editorial procedure for deciding whether a researcher's claim is assertible in a published story, grounded in the philosophy of assertion — specifically the debate over whether assertion requires knowledge, mere true belief, justified belief, or some intermediate norm such as reasonable belief. The deliverable should be an ordered checklist that an editor can run in minutes: the questions to ask in sequence, what counts as a sufficient answer at each stage, where the procedure stops with a clear rejection, and where it must defer to human judgment because the competing norms themselves diverge. The procedure must distinguish empirical claims, interpretive claims, and predictive claims; it must handle expert disagreement within a field and technically true assertions that mislead through framing; and it must state explicit stopping rules. Then apply the procedure to three cases: a climate scientist offering a specific regional temperature projection for 2050; a psychologist asserting a causal mechanism for a behavioral effect on the basis of a single pre-registered study; and a historian arguing that a recently discovered archival document requires revising a standard narrative. Be sure to include one case in which the procedure produces an answer a science editor would likely resist, and clearly flag every point at which judgment cannot be eliminated.
reasoning: |-
  We are creating an editorial procedure grounded in the philosophy of assertion. The main norms we consider are:
   1. Knowledge norm (assertion requires knowledge)
   2. Truth norm (assertion requires truth)
   3. Justified belief norm (assertion requires justification)
   4. Reasonable belief (an intermediate norm)

   We must also distinguish:
     - Empirical claims (based on observation or experiment)
     - Interpretive claims (involving interpretation of data or texts)
     - Predictive claims (about the future)

   The procedure must handle:
     - Expert disagreement
     - Technically true but misleading assertions

   We design a step-by-step checklist that an editor can run in minutes. The steps are ordered, and at each step we specify:
     - The question to ask
     - What counts as a sufficient answer
     - Where we stop with rejection
     - Where we must defer to human judgment

   We also include explicit stopping rules.

   The Checklist:

   Step 1: Classify the claim type.
     Question: Is the claim empirical, interpretive, or predictive?
     Sufficient answer: Identify one of the three.
     If the claim does not fit any, reject (but note: most scientific claims will fit one).
     This step is mostly mechanical.

   Step 2: Check for technical truth but potential misleading framing.
     Question: If we state the claim exactly as given, is it technically true but likely to mislead a typical reader due to framing, omission of context, or selective presentation?
     Sufficient answer: If no, proceed. If yes, then we must modify the framing (add context) or reject if the claim cannot be salvaged without distortion.
     Stop with rejection: If the claim is technically false (then reject). But note: if it's true but misleading, we don't reject the claim outright but require modification.
     Judgment: This step requires editorial judgment about typical readers and context.

   Step 3: Assess the epistemic status according to the claim type.
     We break down by claim type:

     A. Empirical claim:
          Step 3a: Is there a direct and well-established method of observation or experimentation that supports the claim?
          Sufficient answer: Yes, and the method is standard and widely accepted in the field.
          If not, proceed to 3b.

          Step 3b: Is the claim supported by multiple independent lines of evidence?
          Sufficient answer: Yes, then the claim is assertible (with appropriate hedging if necessary).
          If not, proceed to 3c.

          Step 3c: Is there significant expert disagreement about the claim?
          Sufficient answer: If yes, then the claim is not assertible without representing the disagreement. If the disagreement is fundamental, the claim might be rejected or heavily hedged.
          If no expert disagreement and the claim is based on a single study, then proceed to Step 4.

     B. Interpretive claim:
          Step 3a: Does the interpretation follow standard methodological practices in the field?
          Sufficient answer: Yes, and the interpretation is consistent with the evidence.
          If not, proceed to 3b.

          Step 3b: Are there alternative interpretations that are equally plausible?
          Sufficient answer: If yes, then the claim must be presented as one of several possible interpretations, or rejected if the presentation is too strong.
          If no, then the claim is assertible (with appropriate hedging).

     C. Predictive claim:
          Step 3a: Is the prediction based on a well-validated model or theory?
          Sufficient answer: Yes, and the model has a track record of accuracy.
          If not, proceed to 3b.

          Step 3b: Does the prediction come with clearly stated confidence intervals or probabilities?
          Sufficient answer: Yes, then the claim is assertible if the probabilities are included and the uncertainty is clear.
          If not, then the claim is too strong and must be rejected or modified to include uncertainty.

   Step 4: For claims based on a single study (especially empirical ones) or novel interpretations/predictions without strong consensus:
          Question: Is the study pre-registered and methodologically sound (e.g., adequate power, controls, transparency)?
          Sufficient answer: Yes, then the claim may be assertible but must be presented as preliminary and requiring replication.
          If not, reject the claim as too preliminary.

          However, note: for some claims (e.g., in psychology) even a single pre-registered study might be considered sufficient for a tentative assertion.

   Step 5: Apply the norm of assertion (this is where philosophy comes in).
          We consider the four norms. But note: we cannot resolve the philosophical debate, so we must design a practical approach.

          We will use a hybrid:
            - For empirical claims: we require at least justified true belief (with truth being the goal, but we can only assess justification and consensus).
            - For predictive claims: we require reasonable belief (with clear representation of uncertainty).
            - For interpretive claims: we require that the interpretation is the most reasonable one given the evidence, or at least one of the leading ones.

          Step 5a: Can we say that the researcher has a justified belief? (i.e., the evidence and methods are appropriate)
          Step 5b: Is there a consensus in the relevant expert community? (If yes, then we can assert with confidence. If no, then we must represent the disagreement.)

          However, note: the knowledge norm would require that the claim is true and that the researcher knows it. We cannot access truth directly, so we rely on justification and consensus.

          Therefore, we set the following thresholds:
            - For empirical claims: we require justification and the absence of strong counter-evidence (if there is expert disagreement, we don't have consensus, so we cannot claim knowledge).
            - For predictive claims: we require that the prediction is reasonable (based on sound models) and that the uncertainty is stated.
            - For interpretive claims: we require that the interpretation is the leading one or at least well-supported by the evidence.

          In practice, if the claim passes Step 3 and Step 4 (if applicable) and has sufficient justification and consensus (or reasonable belief for predictions), then it is assertible.

   Step 6: Stopping rules.
          - If at any step the claim is rejected, stop and reject.
          - If the claim passes all steps without rejection, then it is assertible (with the required framing, hedging, or context as identified in Step 2).

          But note: in Step 2, if the claim is technically true but misleading, we don't reject but require modification. If modification is not possible without distortion, then reject.

          Also, in Step 3 (for any type) and Step 4, if the claim fails the sufficiency criteria, we reject.

          Where judgment is required (and cannot be eliminated):
            - Step 2 (misleading framing)
            - Step 3a, 3b, 3c (for each claim type) when assessing the strength of evidence, the existence of expert disagreement, and the reasonableness of interpretations and predictions.

   Now, we apply the procedure to three cases.

   Case 1: Climate scientist offering a specific regional temperature projection for 2050.
     Step 1: This is a predictive claim.
     Step 2: Check for misleading framing. The projection might be presented without uncertainty. If so, we must add context about uncertainty.
     Step 3 (Predictive):
          3a: Is it based on a well-validated model? Climate models are well-established but have regional uncertainties. So, we require that the model used is state-of-the-art and the projection includes uncertainty ranges.
          3b: Does it include confidence intervals? If not, we must add them or reject. (Assume the scientist provided a specific number without uncertainty: then we require modification.)

          If the model is well-validated and the projection includes uncertainty (e.g., "X degrees with a range of Y to Z"), then it passes.

     Step 4: Not applicable (unless the projection is based on a single new model without validation? Then we might require more evidence).

     Step 5: For predictive claims, we require reasonable belief. The model and uncertainty reporting make it reasonable.

     Verdict: Assertible, but only with the uncertainty included.

   Case 2: Psychologist asserting a causal mechanism for a behavioral effect on the basis of a single pre-registered study.
     Step 1: Empirical claim (about a causal mechanism).
     Step 2: Check for misleading framing. The claim might be presented as established fact when it's preliminary. We must avoid causal language that is too strong.

     Step 3 (Empirical):
          3a: Is there a direct and well-established method? The pre-registered study might be well-designed, but causal claims in psychology often require multiple methods (e.g., longitudinal, experimental, and correlational) to establish causality. So, 3a might not be sufficient.
          3b: Multiple lines of evidence? Only one study -> no.
          3c: Expert disagreement? There might be, but even if not, one study is not enough for a strong causal claim.

          So we go to Step 4.

     Step 4: The study is pre-registered and methodologically sound. So, we can assert tentatively, but we must present it as preliminary and requiring replication.

     Step 5: The researcher has a justified belief (based on the study) but not knowledge (because one study is not enough for a causal claim in psychology without replication). Also, the truth norm would require the claim to be true, which we don't know. The knowledge norm would require the researcher to know, which they don't (because of the single study). The justified belief norm is met, but the reasonable belief norm might require more (because of the field's replication crisis).

          We decide: the claim is assertible only with heavy hedging: "a single pre-registered study suggests that X might cause Y, but this finding requires replication."

     Verdict: Assertible with heavy hedging.

   Case 3: Historian arguing that a recently discovered archival document requires revising a standard narrative.
     Step 1: Interpretive claim.
     Step 2: Check for misleading framing. The claim might be presented as overturning the standard narrative without sufficient evidence. We must present the context: it's one document and the standard narrative is based on many.

     Step 3 (Interpretive):
          3a: Does the interpretation follow standard practices? The historian must show how the document changes the narrative and that the methods of historical analysis (e.g., source criticism) are correctly applied.
          3b: Are there alternative interpretations? Other historians might disagree. If there is significant disagreement, then the claim must be presented as one interpretation.

          If the historian can show that the document is authentic and clearly challenges the standard narrative, and if the interpretation is methodologically sound, then it passes.

          However, if the standard narrative is well-established, one document might not be enough to require revision. We must represent the potential for revision without overstating.

     Step 4: Not applicable (unless we consider the document as a single piece of evidence, then we might require more? But history often works with singular documents. So we rely on the historian's expertise and the quality of the interpretation.)

     Step 5: The norm for interpretive claims is that it is well-supported and reasonable. We require that the interpretation is at least one of the leading contenders. If the standard narrative is still held by many, then we have expert disagreement.

          So, if there is disagreement, we must present the claim as: "Historian X argues that document Y requires revising the standard narrative, but other historians are not yet convinced."

     Verdict: Assertible, but with appropriate context and representation of any disagreement.

   Now, we must include one case where the procedure produces an answer a science editor would likely resist.

   Let's revisit Case 2: the psychologist. A science editor might want to report the causal claim because it's pre-registered and novel, but our procedure forces heavy hedging. An editor might resist because the study is pre-registered and well-designed, and they might feel that it's strong enough. However, our procedure (especially Step 3b and Step 4) requires us to treat single studies as preliminary.

   We flag every point at which judgment cannot be eliminated:

     - Step 2: Judgment about misleading framing.
     - Step 3a, 3b, 3c: Judgment about the strength of evidence, the existence of multiple lines of evidence, and the level of expert disagreement.
     - Step 5: Judgment about whether the belief is justified or reasonable.

   In summary, the procedure is:

   1. Classify claim type (empirical, interpretive, predictive).
   2. Check for misleading framing (if technically true but misleading, require modification; if false, reject).
   3. For the specific claim type, assess:
      A. Empirical: 
          a. Direct method? 
          b. Multiple lines? 
          c. Expert disagreement?
      B. Interpretive:
          a. Methodologically sound?
          b. Alternative interpretations?
      C. Predictive:
          a. Validated model?
          b. Uncertainty stated?
   4. For single-study claims: pre-registered and sound? If yes, then tentative; if no, reject.
   5. Apply norm of assertion (via justification and consensus) and frame appropriately.

   If rejected at any step, stop.
answer: |-
  ### Editorial Procedure for Assertibility of Scientific Claims

  This checklist operationalizes philosophical norms of assertion (knowledge, truth, justified belief, reasonable belief) into a journalist-friendly workflow. It prioritizes **stopping rules** for rejection, **contextual flags** for required framing, and **deferral points** where human judgment overrides mechanical rules. Apply sequentially—proceed only if prior step is satisfied.

  ---

  ### **Editorial Assertibility Checklist**
  *(Run in sequence; stop if rejected)*

  1. **CLAIM TYPOLOGY**  
     *Question:* What is the primary claim type?  
     - Empirical (observational/experimental data)  
     - Interpretive (contextualizing evidence)  
     - Predictive (future-oriented projection)  
     *Sufficiency:* Clear categorization.  
     *Rejection:* Unclassifiable claim.  
     *Judgment Deferral:* None (mechanical).

  2. **TECHNICAL TRUTH & FRAMING RISK**  
     *Question:* Is the claim factually accurate *and* framed to avoid misleading implications?  
     - Check: Omissions, selective statistics, or language implying certainty where none exists.  
     *Sufficiency:* Truth + neutral framing (e.g., confidence intervals for predictions).  
     *Rejection:* Factual inaccuracy.  
     *Contextual Flag:* If technically true but framing risks distortion (e.g., "X causes Y" implying universality from narrow data), require rewording.  
     *Judgment Deferral:* Assessing "misleadingness" (depends on audience/context).

  3. **EPISTEMIC GROUNDING (BY CLAIM TYPE)**  
     *Apply subtype-specific criteria:*  

     - **Empirical Claim**:  
       *Question:* Does the evidence meet field-specific standards for justification?  
       - Check: Methodology (e.g., controlled design, peer review), reproducibility, consensus.  
       *Sufficiency:*  
       - High: Multiple peer-reviewed studies.  
       - Medium: Single pre-registered study + methodological rigor.  
       *Rejection:* Anecdotal/non-reproducible evidence.  
       *Contextual Flag:* If single study or ongoing replication debate, hedge ("preliminary evidence suggests...").  

     - **Interpretive Claim**:  
       *Question:* Is the interpretation the most reasonable given available evidence?  
       - Check: Fit with established facts, acknowledgment of alternatives, scholarly consensus.  
       *Sufficiency:* Supported by majority of experts *or* demonstrably superior to alternatives.  
       *Rejection:* Ignores contradictory evidence.  
       *Contextual Flag:* If expert disagreement exists, present as "one perspective among many."  

     - **Predictive Claim**:  
       *Question:* Is the prediction based on validated models with quantified uncertainty?  
       - Check: Model track record, error margins, scenario qualifications.  
       *Sufficiency:* Confidence intervals/probabilities stated *and* model peer-reviewed.  
       *Rejection:* Unmodeled speculation ("could happen").  
       *Contextual Flag:* Always include uncertainty (e.g., "70% likelihood of...").

     *Judgment Deferral:*  
     - Defining "reasonable belief" for interpretations.  
     - Assessing model validity for predictions.  

  4. **EXPERT CONSENSUS ASSESSMENT**  
     *Question:* What is the degree of expert disagreement?  
     - Check: Surveys of literature, dissenting publications, institutional statements.  
     *Sufficiency:*  
     - Consensus: >90% agreement (assert confidently).  
     - Contested: 60-90% agreement (hedge: "many experts agree...").  
     *Rejection:* Fringe view (<10% support).  
     *Contextual Flag:* If contested but plausible, disclose disagreement.  
     *Judgment Deferral:* Gauging consensus strength (requires domain knowledge).

  5. **NORMATIVE THRESHOLD (PHILOSOPHICALLY ANCHORED)**  
     *Question:* Does the claim meet the strictest defensible norm of assertion?  
     - **Truth Norm**: Verified by reliable methods?  
     - **Knowledge Norm**: Supported by evidence *and* consensus?  
     - **Reasonable Belief**: Plausible to impartial experts?  
     *Sufficiency:* Satisfies *at least* "reasonable belief" (truth/knowledge ideal but unverifiable).  
     *Rejection:* Fails reasonable belief (e.g., speculation without evidence).  
     *Contextual Flag:* If only "reasonable belief" is met, avoid categorical language.  
     *Judgment Deferral:* Balancing competing norms when evidence is ambiguous.

  ---

  ### **Application to Cases**

  #### **Case 1: Climate Scientist’s Regional Temperature Projection for 2050**  
  - **Step 1 (Typology)**: Predictive.  
  - **Step 2 (Framing)**: Accept *only if* uncertainty ranges are included (e.g., "+2°C ± 0.5°C"). Reject if presented as definite.  
  - **Step 3 (Epistemic)**:  
    - If based on IPCC-validated models → Sufficient.  
    - If novel model without validation → Reject.  
  - **Step 4 (Consensus)**: High consensus on warming trends; medium consensus on *regional* precision → Flag: "models agree on warming but differ regionally."  
  - **Step 5 (Norm)**: Meets "reasonable belief" with uncertainty disclosure → **Assertible (with framing)**.  

  #### **Case 2: Psychologist’s Causal Claim from Single Pre-Registered Study**  
  - **Step 1 (Typology)**: Empirical (causal).  
  - **Step 2 (Framing)**: Reject if stated as "proven." Accept *only* with explicit tentativeness.  
  - **Step 3 (Epistemic)**:  
    - Single study → Requires hedging regardless of pre-registration.  
    - No replication → Fails "knowledge norm."  
  - **Step 4 (Consensus)**: Likely contested (psychology’s replication crisis) → Flag dissent.  
  - **Step 5 (Norm)**: Barely meets "reasonable belief" but fails "knowledge norm" → **Conditionally assertible**: "One study suggests X, but replication is needed."  
  - ***Editorial Resistance Point***: Science editors may favor novel findings, but philosophy demands conservatism here. Reject categorical claims.

  #### **Case 3: Historian’s Archival Document Challenging Standard Narrative**  
  - **Step 1 (Typology)**: Interpretive.  
  - **Step 2 (Framing)**: Reject if framed as "overturning" consensus; accept as "challenging."  
  - **Step 3 (Epistemic)**:  
    - If the document is authenticated and directly contradicts narrative → Reasonably justified.  
    - If alternative interpretations exist (e.g., document is ambiguous) → Must acknowledge.  
  - **Step 4 (Consensus)**: Likely contested → **Flag**: "This view is emerging; not all historians agree."  
  - **Step 5 (Norm)**: Meets "reasonable belief" if evidence is robust → **Assertible (with contextual dissent)**.  

  ---

  ### **Key Judgment Deferral Points**  
  1. **Step 2**: Deciding if framing is "misleading" (requires audience awareness).  
  2. **Step 3**: Evaluating "methodological rigor" (field-dependent).  
  3. **Step 4**: Gauging "consensus" (no bright-line threshold).  
  4. **Step 5**: Balancing philosophical norms when evidence is equivocal.  

  ### **Philosophical Tensions in Practice**  
  - **Truth vs. Reasonable Belief**: A claim may be true but unverifiable (e.g., quantum phenomena). Default to "reasonable belief + transparency."  
  - **Expert Disagreement**: When norms conflict (e.g., a "justified" claim lacking consensus), defer to **Step 4** outcomes.  
  - **Stopping Rules**: Reject early if technical truth fails; require rewording for framing risks; hedge in gray areas.  

  This procedure enforces **philosophical caution** while respecting journalism’s need for clarity. When norms diverge (e.g., a "true" claim with low justification), it defaults to the **strictest defensible standard** to avoid epistemic harm.
