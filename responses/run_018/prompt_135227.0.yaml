answer: |-
  ## The Pragmatic Mirage: Can Eliminative Materialism Survive Its Own Linguistic Practice?

  The eliminative materialist (EM) thesis, championed by Paul and Patricia Churchland, strikes at the heart of our self-conception: it argues that the core concepts of "folk psychology" – beliefs, desires, intentions, and other propositional attitudes – are fundamentally *false* theoretical posits, destined for the same oblivion as phlogiston or the celestial spheres. This radical ontological rejection inevitably collides with the linguistic practice of using mentalistic terminology. The proposed solution – treating such talk as a pragmatic "social coordination technology" devoid of ontological commitment – offers an intriguing escape hatch, particularly from the notorious **self-refutation charge**. However, while this move partially salvages EM from immediate incoherence, it fundamentally transforms the doctrine into a less radical form, ultimately failing to solve the **normative reasoning problem** and collapsing into expressivism or instrumentalism, thereby undermining its revolutionary core.

  **The Self-Refutation Charge and the Pragmatic Defense**

  The self-refutation charge against EM is potent and familiar: If EM is true, then there are no beliefs. But asserting EM seems to *require* the asserter to *believe* it. Therefore, the very act of asserting EM appears to presuppose the existence of the very thing it denies, rendering it self-contradictory. The pragmatic defense offers a compelling counter: Eliminativists can consistently *use* belief-language without *endorsing* its ontological implications. Just as an engineer calculates a trajectory using "center of mass" as a useful fiction without believing a literal point-particle exists, the eliminativist can utter "I believe eliminativism is true" or "My opponent desires to refute me" as moves within a social and predictive game. This utterance isn't a report of an internal state (a belief); it's a behavioral signal designed to coordinate interaction, manage expectations, or predict future behavior based on patterns learned within the folk-psychological framework. Saying "I don't believe eliminativism" isn't a contradictory ontological claim; it's simply opting out of a specific conversational or predictive strategy. **On this point, the pragmatic defense largely succeeds.** It severs the necessary link between linguistic practice and ontological commitment, allowing the eliminativist to navigate a world saturated with folk psychology without self-contradiction.

  **The Lingering Specter: Normative Reasoning**

  Yet, escaping self-refutation only clears the first hurdle. The deeper, more intractable problem for EM concerns **normative reasoning**. Why *ought* I to revise my views in light of new evidence? Why *should* I accept the conclusions of a logical argument? Folk psychology provides a seemingly intuitive answer: I possess a *belief* that logic is valid, a *desire* for truth, and I *recognize* that my current belief contradicts the evidence or logic, generating cognitive dissonance I *ought* to resolve.

  The pragmatic defense struggles profoundly here. If "belief," "desire," and "ought" are merely useful fictions for social coordination and prediction, they lack any inherent normative force. An eliminativist might say, "Given the evidence, you *should* revise your view," but according to their own ontology, this utterance is *only*:

  1.  **A Behavioral Prediction/Manipulation:** "Uttering these sounds increases the probability that you will exhibit behavior X (e.g., stating agreement, changing your argument) within our social game." But this reduces "ought" to mere descriptive regularity or behavioral conditioning. It explains *that* we say "ought," but not *why* it carries normative weight, nor why it *should* compel rational assent beyond social pressure or predictive utility.
  2.  **An Expression of Preference:** "I prefer that you behave in a way consistent with these predictive patterns." This collapses into **expressivism** about normative terms – "ought" statements merely express the speaker's non-cognitive attitudes, not objective normative facts. But this abandons the idea that there are genuine *reasons* for belief revision inherent in logic or evidence itself.
  3.  **An Instrumental Tool:** "Using 'ought' language is instrumentally useful for achieving certain goals within the neurocomputational system (e.g., coherence, predictive accuracy)." This is **instrumentalism**. However, the question immediately arises: *Why* are coherence or predictive accuracy goals the system *ought* to pursue? Appealing to survival value merely shifts the normativity to biology ("ought to survive"), failing to capture the *rational* force specific to logical or evidential reasoning. Instrumentalism fails to ground the *specific* norms of rationality.

  **The Core Problem:** The pragmatic defense provides a *description* of how normative-sounding language functions socially and predictively. However, it utterly fails to provide a plausible EM account of the *justificatory force* of normative reasoning. Why *should* the recognition of a logical contradiction compel me? Without real propositional attitudes (beliefs held as true/false, desires for truth) and genuine intentional content, the "recognition" is merely a neural state, and the "compulsion" is merely a causal push. The *normative gap* – why this causal push *should* be followed as *rational* – remains unbridged. The pragmatic tools explain the *use* of normative talk but not the *authority* of normative reasons within reasoning itself.

  **Collapse into Instrumentalism and the Loss of Radicalism**

  The pragmatic defense, while necessary for linguistic coherence, fundamentally alters the nature of EM. By conceding that folk-psychological language is indispensable as a "social coordination technology" and a predictive heuristic, EM retreats from its core ontological eliminativism. It now asserts:

  1.  **Folk Psychology is Fundamentally *False*:** There are no beliefs/desires as real entities or properties.
  2.  **But Folk Psychology is *Irreducibly Useful*:** We cannot, even in principle, fully replace it in our social and linguistic practices (and perhaps even in self-understanding) with a purely neuroscientific vocabulary.

  This is the hallmark of **instrumentalism**: Folk psychology is a useful instrument, a calculational device, but not a description of reality. This is a far cry from the original radical eliminativist vision. The Churchlands envisioned folk psychology being *replaced* by neuroscience, just as chemistry replaced alchemy. Instrumentalism, however, suggests folk psychology is more like Newtonian mechanics – demonstrably *false* at a fundamental level (relativity, quantum mechanics), yet *irreducibly useful* for vast domains of engineering and prediction. Genuine eliminativism requires not just falsity, but *dispensability*. If the pragmatic defense makes folk psychology indispensable as a social and linguistic tool, then EM ceases to be eliminative about the *practice* and becomes merely eliminative about the *ontology*, collapsing into a form of **non-reductive instrumentalism** or **fictionalism** about the mental.

  Furthermore, by relying on the predictive and coordinative *success* of folk psychology, the pragmatic defense implicitly smuggles back in a notion of "content" or "aboutness." The predictive patterns tracked *are* patterns of behavior interpreted as being *about* the world. While the eliminativist denies this is *real* representation, the efficacy of the tool depends on systematically relating utterances and behaviors to states of the world – the very functional role they sought to eliminate. The "technology" only works *as if* there were representational content.

  **Conclusion: The Pragmatic Defense Saves the Letter but Destroys the Spirit**

  The separation of ontological rejection from linguistic practice via a pragmatic defense **saves eliminative materialism from the charge of immediate self-refutation**. It provides a coherent way for eliminativists to *use* mentalistic language without explicit contradiction. However, this victory is Pyrrhic. **The defense utterly fails to solve the problem of normative reasoning**, reducing "ought" to mere prediction, expression, or instrumental utility, thereby failing to account for the justificatory force inherent in logical and evidential reasoning. More devastatingly, **the pragmatic defense fundamentally transforms EM from a radical eliminativist doctrine into a far less threatening form of instrumentalism or fictionalism**. By conceding the indispensable utility of folk psychology as a "social coordination technology," EM abandons its revolutionary claim that folk psychology is a *bad theory* destined for *complete replacement*. Instead, it becomes a view asserting that folk psychology is a *false but pragmatically indispensable instrument*. While this view might be defensible, it is no longer the radical eliminativism that promised to revolutionize our understanding of the mind by excising propositional attitudes from our ontology. It was always less threatening than advertised – not because its core ontological claim is weak, but because the linguistic and normative practices it seeks to eliminate turn out to be pragmatically ineradicable scaffolds of human cognition and interaction. The radical eliminativist dream of a purely neurocomputational self-understanding, free of the "ghosts" of belief and desire, founders on the rocks of normative reasoning and social practice, leaving only a chastened instrumentalism in its wake.
