prompt: |-
  You are an expert social philosopher specializing in conceptual analysis and meta-ethics. Think carefully and reason step by step. Before giving your main explanation, briefly outline three possible frames for the dispute: (i) a direct first-order normative disagreement about how to live; (ii) an incommensurability of conceptual schemes, analogous to radical-translation problems applied to thick moral terms like merit, dignity, and autonomy; and (iii) a divergence in epistemic utility functions, where one outlook prioritizes predictive accuracy about social outcomes and the other prioritizes coordination and trust within local networks. Then explain the core conceptual issue: is either the rural working-class or the urban professional-class value outlook more defensible, or does recognizing that these groups operate with different semantic frameworks—professional-class credentialist frameworks that treat competence as institutionally certified versus working-class performative frameworks that treat competence as demonstrably reliable—merely relocate the normative question into meta-ethics? In particular, address whether this injection of semantic divergence resolves, dissolves, or complicates the question of defensibility, and whether an accuracy-first analysis can adjudicate between the two frameworks without already presupposing one of them. Do not provide citations, bibliographies, or references to specific texts; build the argument from the concepts alone.
