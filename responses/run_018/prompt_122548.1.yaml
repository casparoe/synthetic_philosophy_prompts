prompt: |-
  Hey — I'm a science journalist and I do a steady diet of short same-day pieces (500–800 words) on language acquisition, infant cognition, and, increasingly, ML papers pitched as finally settling some old nature/nurture argument. I keep writing sentences like "the study suggests grammar is hardwired," "the ability turns out to be learned after all," "this undercuts the claim that we're born knowing X," and honestly half the time I couldn't tell you what im claiming. My copy desk will not catch it, and twice now an author has emailed after publication saying we overstated them.

  What I want is a decision procedure I can actually run in ten minutes, on a press release plus an abstract plus one short phone call with the author, with no linguistics background, that tells me which of those sentences I'm allowed to write and what to write instead. Constraints: it has to output something my editor will print (she kills copy that is hedges stacked on hedges), it has to give me one line I can defend if the researcher complains, and it has to tell me when to stop and hand the question to a human — me making an editorial call, the author being asked what their model actually had access to, or an outside reviewer.

  Please build it around the real structure of the poverty-of-the-stimulus argument rather than around a vibe: the claim that learners end up knowing something the input they got didn't pin down, the point that kids mostly aren't corrected or told which sentences are impossible, and the inference from that gap to something in the learner. I specifically want:

  - A way to make me disentangle the things "innate" gets used for — present at birth, species-typical, not learned from experience, buffered against variation in experience, domain-specific, heritable, genetically specified — and a judgment from you about which of those I can collapse for my purposes and which will get me in trouble if I ignore them.
  - The "where is the work being done?" question in a form I can ask a researcher on the phone without sounding like I'm accusing them of cheating: what to ask about a model's training signal, architecture, and pretraining data, and what to ask about a child study. My sense is that a successful learner only relocates the puzzle, and I want the procedure to say what follows when that's true and what doesn't follow.
  - A rule that makes me fill in the blanks before I use the word at all: innate relative to *which* input, given *which* starting machinery. If I can't fill them in from the press release, the procedure should tell me to drop the word and give me the replacement sentence.

  Hard cases it has to handle: heritability and twin studies; a model that does well on a linguistic benchmark; "a language that lacks X" field reports; newborn and other very-early-infant effects; critical-period claims.

  Then run it on three of my actual situations:

  1. A group in Zurich trains a neural net on about 40 million words of child-directed speech from an existing corpus plus a few thousand hours of nursery audio, and it does better than expected at forming yes/no questions. The release says no innate grammar needed. I want to write that grammar isn't hardwired after all.
  2. A twin study, about three thousand pairs, a comprehension battery at age seven, heritability of "grammatical ability" around 0.6. I want to write that grammar is in the genes.
  3. A field report on a small Amazonian language described as having no embedded relative clauses at all, with the authors saying this shows recursion isn't innate.

  One of those three should come out as "you cannot write the sentence you want to write" — I'd guess the first one, but if the procedure bites hardest somewhere else, say so and show me.

  Finally, be straight with me about where this procedure misfires. My worry is that on this topic nothing is ever decisive and the checklist will just tell me to write mush every single time, in which case it's useless to me on deadline.

  Format: start with the bottom line — the one-sentence version of the whole procedure, the thing I'd tape above my monitor — then the checklist in the order I run it, then the three worked applications, then where it breaks. No preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is a science journalist dealing with complex topics like language acquisition and infant cognition, often covering ML papers that claim to resolve nature vs. nurture debates. They're struggling with overstatements in their writing, leading to corrections from authors. They need a practical, quick decision procedure to avoid misrepresenting research, especially around terms like "innate."

  First, I need to understand their main pain points. They write phrases like "grammar is hardwired" or "ability is learned," but often can't fully justify these claims. Their copy desk doesn't catch these nuances, and authors have complained. They want a checklist that's efficient—10 minutes using a press release, abstract, and a short call with the author. The output must be defensible, not overly hedged, and indicate when to consult a human.

  The user specifically mentions the poverty-of-the-stimulus argument. They want the procedure structured around its real components: learners knowing something not determined by input, lack of correction in children, and inferring something in the learner. They also want clarity on the multiple meanings of "innate" (e.g., present at birth, species-typical, not learned) and guidance on which can be collapsed safely.

  Key elements from the query:
  1. Disentangle "innate" meanings and advise on safe usage.
  2. Questions to ask researchers about models (training signals, architecture, pretraining data) and child studies without sounding accusatory.
  3. A rule to specify "innate relative to which input and starting machinery" or drop the term.
  4. Handling hard cases: heritability, twin studies, ML benchmarks, field reports on language features, newborn studies, critical periods.

  They provide three scenarios to test the procedure:
  - Zurich neural net trained on child-directed speech performing well on yes/no questions; press release claims no innate grammar needed.
  - Twin study showing high heritability (0.6) for grammatical ability at age seven.
  - Field report on an Amazonian language lacking embedded relatives, suggesting recursion isn't innate.

  One of these should be flagged as unacceptable. The user suspects the first one might be problematic.

  Now, structuring the response:
  - Start with a bottom-line sentence: a concise takeaway to tape above the monitor.
  - Checklist in order: Steps to follow during the 10-minute review.
  - Worked applications: Apply the checklist to each scenario.
  - Where it breaks: Limitations of the procedure.

  For the bottom line: Emphasize specifying the input and machinery. For example, "Never say 'innate' without specifying: innate relative to what input, given what prior machinery? If you can't, say 'not learned from this input' and name the input."

  Checklist steps:
  1. Identify the claim about innateness. What exactly is said to be innate/learned?
  2. Map "innate" to specific meanings from the list (present at birth, species-typical, etc.). Decide which are relevant and which can be conflated safely. For example, "not learned from experience" is common but must be relative to specific inputs.
  3. Determine the input considered: What data was the learner exposed to? For ML models, this includes training data, architecture, pretraining. For children, it's the actual linguistic environment.
  4. Ask "where is the work being done?" For models: probe training signals (supervised/unsupervised), data specifics, architecture choices. For child studies: consider environmental factors, testing methods. The key is whether the learning mechanism itself explains the gap or if prior structure is assumed.
  5. Fill the blanks: Can you specify "innate relative to input X with machinery Y"? If not, avoid "innate" and use alternatives like "not learned from X" or "requires prior Y."
  6. Decision gate: If the answer to step 5 is no, or if it's a hard case like heritability (which doesn't equal innate), then the desired sentence is invalid. Output the alternative phrasing.

  Handling hard cases:
  - Heritability: High heritability doesn't mean genetically specified; it could reflect gene-environment interactions. Avoid equating with "innate."
  - ML benchmarks: Success may rely on architecture or data biases, not absence of innate structure.
  - Field reports: Absence of a feature in a language doesn't prove it's not innate; could be unused due to cultural factors.
  - Newborn effects: Indicate presence at birth but don't necessarily specify if it's domain-specific.
  - Critical periods: Sensitive periods imply biological constraints but not necessarily innate knowledge.

  Applying to scenarios:
  1. Zurich model: Press release claims no innate grammar. But the model used extensive data and specific architecture. The work is done by the data/architecture, not showing absence of innate requirements. The user's desired sentence ("grammar isn't hardwired") is invalid. Alternative: "Model achieves competence with child-like input, suggesting grammar can be learned without domain-specific pre-specification in this setup."
  2. Twin study: Heritability 0.6. But heritability ≠ innate. Environmental factors, gene-environment correlations. Desired sentence ("grammar in the genes") is invalid. Alternative: "Variation in grammatical ability at age seven shows high heritability, indicating strong genetic influence in this population."
  3. Field report: Amazonian language lacks embedded clauses, authors say recursion not innate. But poverty-of-stimulus isn't addressed; absence doesn't prove inability. Also, recursion might be a universal tool not used in this language. Desired sentence is defensible only if rephrased cautiously: "Absence in a natural language challenges the necessity of recursion as a linguistic universal," but avoid claiming "not innate."

  The procedure should flag the first scenario as unacceptable for the desired sentence. The twin study also gets flagged because heritability doesn't directly imply "in the genes" without caveats.

  Where it breaks:
  - In cases where input is undefined (e.g., prenatal influences).
  - When study design flaws aren't apparent in abstracts/press releases.
  - Philosophical debates about what constitutes "learning."
  - Might err on caution, leading to more hedging, but user needs non-mushy alternatives. Emphasize replacing with specific claims about input/machinery.

  Balancing conciseness and precision: The procedure should avoid mush by forcing specificity. Instead of hedging, replace with concrete statements about what the input lacked or what machinery was involved.
answer: |-
  ### Bottom Line  
  **Never say "innate" without specifying: *innate relative to what input, given what prior machinery?* If you can’t fill both blanks from evidence, replace "innate" with "not learned from [input X]" or "requires prior [machinery Y]"—and kill any sentence implying genes, universality, or necessity without direct evidence.**

  ### Checklist (Run in Order)  
  **1. Identify the Claim**  
     - What is allegedly innate/learned? (e.g., "grammar," "recursion")  
     - What *exactly* does the study test? (e.g., model performance, heritability, language absence)  

  **2. Disentangle "Innate" Meanings**  
     - *For your purposes:*  
       - **Collapse safely:** "Not learned from experience" (if input is defined), "buffered against variation" (if input range is tested).  
       - **Never collapse:** "Genetically specified," "heritable," "domain-specific," "species-typical." These require separate evidence.  
     - *Trouble triggers:* Genes, universality, birth, or necessity claims. If any appear, proceed with extreme caution.  

  **3. Pin Down the Input & Machinery**  
     - **For ML papers:**  
       - Ask the author: "What was the *training signal* (e.g., supervised/unsupervised)? What *architecture choices* (e.g., transformers) or *pretraining data* (e.g., WebText) might supply implicit biases?"  
       - Press release check: Does input realistically mimic child-level data (noise, ungrammatical speech, no explicit corrections)?  
     - **For child studies:**  
       - Ask: "What *environmental input* was controlled/measured? Could kids encounter hidden cues (e.g., prosody, context)?"  
       - Press release check: Does it acknowledge real-world input complexity (e.g., messy child-directed speech)?  
     - **Hard cases:**  
       - Heritability: ≠ "genetically specified." Ask: "Could shared environment explain twin correlations?"  
       - "Language lacks X": Ask: "Does absence prove *unlearnability*, or could X exist but be unused?"  
       - Newborn effects: Ask: "Is this domain-specific or a general bias (e.g., auditory processing)?"  
     - *Output gaps here mean STOP and consult author/editor.*  

  **4. Ask "Where Is the Work Being Done?"**  
     - **Key question for authors (non-accusatory):** "In your model/design, what prior structure or data properties best explain the outcome?"  
     - If work is done by:  
       - *Training data* (e.g., massive curated corpora) → "Not innate" claim may be invalid; learning is input-driven.  
       - *Architecture/pretraining* (e.g., transformer inductive biases) → "Not innate" is misleading; priors are engineered.  
       - *Child resilience to poor input* → Poverty-of-stimulus *supported* if input gap is proven.  
     - *If the puzzle just relocates (e.g., model succeeds due to data biases), write: "Learning succeeds, but relies on [specific prior]."*  

  **5. Fill the Blanks or Bail**  
     - Can you complete: "Innate relative to [input X], given [machinery Y]"?  
       - Yes → Write that exact phrase (e.g., "innate relative to child-directed speech, given domain-general statistical learning").  
       - No → **Drop "innate."** Use: "Not learned from [input]" or "Requires [machinery]."  
     - If your desired sentence uses "hardwired," "in the genes," or "universal," it dies here unless the study directly tests genetics or species universality.  

  **6. Decision Gate**  
     - Output your sentence only if:  
       - It passes Step 5 *and* doesn’t overclaim genes/universality.  
       - Else: Use the Step 5 replacement.  
     - **STOP and hand off if:**  
       - Input/machinery is undefined (Step 3 gap).  
       - "Innate" conflates >1 meaning (Step 2 trouble triggers).  
       - Critical period/heritability claims lack mechanistic evidence.  

  ---

  ### Worked Applications  
  **Case 1: Zurich Neural Net**  
  - **Your desired sentence:** "Grammar isn’t hardwired after all." → **KILL IT.**  
  - **Why:**  
    - Step 1: Claims "no innate grammar needed" based on model success with child-directed speech + nursery audio.  
    - Step 2: "Hardwired" implies genetic/domain-specific innateness. Collapsing = trouble.  
    - Step 3: Input = 40M words + audio (richer than real child data). Architecture? (e.g., transformers have grammatical biases). Ask author: "What architecture and pretraining were used? Could they supply structural priors?"  
    - Step 4: Work is likely done by data volume + model biases. Relocates the puzzle.  
    - Step 5: *Cannot* specify "innate relative to input X given machinery Y" — input isn’t poverty-of-stimulus-compliant (too clean/abundant).  
  - **Output sentence:** "Model learns question-forming from child-like input, suggesting grammar may not require domain-specific innate structure *in this setup*."  
  - **Defense to author:** "We highlighted your input’s role and avoided ‘hardwired’ since architecture may contribute structural biases."  

  **Case 2: Twin Study**  
  - **Your desired sentence:** "Grammar is in the genes." → **KILL IT.**  
  - **Why:**  
    - Step 1: Heritability (h²=0.6) ≠ "innate." Tests variation in a population, not mechanism.  
    - Step 2: "In the genes" = genetically specified. Heritability ≠ that (environment confounds!).  
    - Step 3: Input = uncontrolled (e.g., twins share environment). Machinery? Unknown. Ask: "Were environmental factors like shared schooling measured?"  
    - Step 4: Work could be done by gene-environment correlation (e.g., genes shape exposure to grammar-rich input).  
    - Step 5: *Cannot* specify blanks — no input/machinery defined.  
  - **Output sentence:** "Genetic factors strongly influence variation in children’s grammatical ability at age seven."  
  - **Defense:** "Heritability shows genetic influence but doesn’t prove grammar is ‘in the genes’ without environment controls."  

  **Case 3: Amazonian Language Report**  
  - **Your desired sentence:** "Recursion isn’t innate." → **ACCEPTABLE (with caveats).**  
  - **Why:**  
    - Step 1: Claims recursion isn’t innate because a language lacks embedded relatives.  
    - Step 2: "Innate" here = universal, species-typical. Test is direct but limited.  
    - Step 3: Input = speakers’ linguistic output. Machinery? Assumed human cognition. Ask author: "Is there evidence speakers *cannot* learn/process recursion?"  
    - Step 4: Work done by linguistic description. Poverty-of-stimulus? Unaddressed — absence ≠ unlearnability.  
    - Step 5: *Can* specify: "Innate relative to universal human input, given standard cognitive machinery." But weak (only one language).  
  - **Output sentence:** "Absence of recursion in a natural language undercuts claims that it is a universal, innate feature of grammar."  
  - **Defense:** "We tied ‘innate’ to universality claims and noted it’s one case — your data directly challenges that."  

  **Bites Hardest:** Case 1 (ML model). Your input is too far from poverty-of-stimulus, and architecture priors undermine "no innate grammar."  

  ---

  ### Where It Breaks  
  1. **Indecisive mush risk:** It *won’t* force mush if you follow Step 5 — it demands concrete phrasing like "not learned from [input]." But in underdefined studies (e.g., vague heritability), it defaults to cautious specificity.  
  2. **Hidden confounders:** If a press release hides architecture flaws (e.g., model pretrained on syntax-heavy data), you’ll miss it. Phone calls are essential.  
  3. **Philosophical gaps:** Fails if "innate" hinges on unfalsifiable claims (e.g., "genetically specified but requires triggering"). Output: "STOP — hand to editor."  
  4. **Edge cases:** Critical periods (e.g., "sensitive windows") get murky. If input timing is tested, write "constrained by maturation"; else, hedge.  
  5. **Speed trap:** Complex studies (e.g., gene-environment interactions) may exceed 10 mins. If Step 3 gaps persist, write: "Suggests learning is possible with [input]," and flag for follow-up.  

  **Final Straight Talk:** This won’t make nature/nurture debates decisive — but it forces you to *locate* the ambiguity. On deadline, it kills overclaims while keeping prose sharp. When in doubt, "not learned from [X]" is your lifeline.
