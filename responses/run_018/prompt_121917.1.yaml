  The BCI merger claim feels like an overextension. While Hofstadter discusses shared symbolic systems (like his "joint mind" thought experiment with twin teletype), he never explicitly endorses full conscious merger. His 2013 caveat about "substrate sensitivity" suggests he'd reject seamless blending. 

