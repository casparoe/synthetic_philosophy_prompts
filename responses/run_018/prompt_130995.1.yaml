prompt: |-
  I've been reading about induction and Goodman's emerald example — green before some date, blue after, people call it a cheat predicate. But I see the same shape everywhere in science: a drug "works", then it fails in kids, so they say "except pediatrics"; a law of physics applies "except at quantum scales". Each exception is reasonable alone, but together they build a hidden boundary just like the grue case. Yet explicit made-up predicates get mocked while these implicit domain-carves are seen as good practice. Is there a specific name for that double standard — rejecting obvious grue-style predicates but accepting hidden ones with the same logical form? Or is this just the standard problem of induction, and if so what's the usual way to tell a legit auxiliary restriction from a sneaky grue-ification? I keep feeling there's a distinction here that nobody has named.
reasoning: |-
  Okay, the user is grappling with Goodman's grue paradox and its parallels in scientific practice. They notice that while explicit predicates like "grue" (green before time t, blue after) are dismissed as artificial, science routinely introduces domain restrictions like "except in pediatrics" or "except at quantum scales." They're asking if there's a name for this double standard and how to distinguish legitimate restrictions from grue-like cheating.

  First, I need to unpack Goodman's original argument. Grue isn't just arbitrary—it's defined by a time-boundary that isn't grounded in natural properties. Science's domain restrictions seem similar in structure but are justified differently. The key difference lies in how the boundaries are drawn: time-indexing vs. causal mechanisms.

  The user's frustration is palpable. They see the same logical form but different receptions. I should validate that insight—they're right about the structural similarity. But the distinction comes down to justification. Scientific restrictions are usually based on empirical evidence or theoretical necessity, not arbitrary parameters.

  I recall that philosophers like Quine and Hempel addressed this. Quine's "projectibility" concept is relevant—predicates need natural kinds to support induction. Domain restrictions in science often map onto real ontological boundaries (like biological development stages or physical scales), unlike grue's artificial time-cutoff.

  The user might also be touching on the Duhem-Quine thesis: hypotheses can't be tested in isolation. When a drug fails in kids, scientists don't abandon the theory—they add auxiliary hypotheses ("metabolites affect developing bodies"). The legitimacy depends on whether these additions are independently testable and coherent with existing knowledge.

  They're hinting at a deeper anxiety: how do we avoid ad hoc adjustments? That's the heart of good scientific practice. Lakatos' "research programmes" framework could help here—progressive vs. degenerative adjustments. Legitimate restrictions predict new phenomena; grue-like ones only rescue failing theories.

  No, there isn't a single term for this "double standard," but the mechanisms for distinguishing are established: independent testability, coherence, grounding in mechanisms. I should emphasize that while grue exposes induction's vulnerability, science navigates it through evidence and explanatory power.

  The user's examples are spot-on. Pediatric exceptions aren't arbitrary—they reflect developmental biology. Quantum limits arise from empirical mismatch, not convenience. That ontological footing matters. Maybe I should contrast "reference class problem" (statistics) with "natural kind partitioning."

  Their unspoken need might be methodological reassurance: "How do I trust science if it looks like grue?" The answer is that science earns trust through predictive success and error correction, not perfect axioms. The grue paradox is a thought experiment; scientific practice is a self-correcting process.
answer: |-
  You've nailed a profound tension at the heart of induction and scientific methodology. Goodman's "grue" paradox brilliantly exposes the problem: **any finite set of observations can support infinitely many conflicting generalizations, depending on how we carve up the predicates.** The "double standard" you perceive is real, and philosophers of science have wrestled intensely with this under various names and frameworks. While there isn't one universally agreed-upon term *exactly* for the *double standard itself*, the core concepts and distinctions are well-established:

  1.  **Grue vs. Projectible Predicates (Goodman's Key Distinction):**
      *   **Grue-like predicates:** Are "positional" or "disjunctive." They mix fundamentally different properties using arbitrary reference points (like a specific time `t` or location `x`). "Grue" = (green & observed-before-t) OR (blue & observed-after-t). Their definition *itself* assumes the boundary they are trying to "predict."
      *   **Projectible Predicates:** Are "non-positional," "uniform," or refer to "natural kinds." They seem to "latch onto" genuine properties of the world without built-in, arbitrary boundaries. "Green" doesn't inherently reference observation time or location in its core definition.

  2.  **The Double Standard & Its Justification:**
      You're right that "except pediatrics" or "except quantum scales" *structurally resembles* adding an exception like "except after time t." The key difference philosophers and scientists argue for is **justification**:
      *   **Grue Exception (Time t):** Is purely *ad hoc* and *arbitrary*. There's no independent reason, prior theory, or underlying mechanism to pick *that specific time t* as the boundary. It's defined solely to save the hypothesis after the fact.
      *   **Scientific Domain Restriction (e.g., Pediatrics, Quantum Scales):** Is (ideally) **not arbitrary**. It's based on:
          *   **Empirical Evidence:** The drug *was tested* and *failed* in kids, revealing a relevant difference.
          *   **Background Theory/Known Mechanisms:** We *know* pediatric physiology differs significantly (metabolism, development) from adults. We *know* quantum mechanics describes fundamental scales where classical approximations break down. The boundary (age, energy scale, size) maps onto *independently established* categories or physical thresholds.
          *   **Explanatory Power/Coherence:** Restricting the domain preserves the core law's validity within its established scope and integrates the exception into a broader, more coherent understanding. It doesn't just save the hypothesis; it often *enriches* the theory by identifying relevant variables (age, scale).
          *   **Predictive Novelty:** A legitimate restriction often leads to *new*, testable predictions. Knowing a drug fails in kids prompts research into *why* (e.g., liver enzyme differences), leading to pediatric formulations or new understanding. Knowing classical mechanics fails at quantum scales led to the development of QM itself.

  3.  **Key Concepts & Frameworks Explaining the Distinction:**
      *   **Ad Hoc Hypothesis (vs. Auxiliary Hypothesis):** This is the closest *specific* term for the *bad* kind of exception. An **ad hoc hypothesis** is one added *solely* to save a theory from refutation, with *no independent testability or justification*. "It works except after exactly January 1st, 2050" is purely ad hoc. "It works except in individuals under 12 due to immature cytochrome P450 enzymes" is an **auxiliary hypothesis** grounded in biochemistry and testable. **The double standard hinges on rejecting *ad hoc* restrictions while accepting well-justified *auxiliary hypotheses* that define the domain of applicability.**
      *   **Duhem-Quine Thesis:** This states that hypotheses cannot be tested in isolation; they are always tested against experience as part of a larger web of beliefs (background theories, auxiliary assumptions). When an observation conflicts (drug fails in kids), we *can* choose what part of the web to adjust. Adjusting an auxiliary assumption about the *domain* (restricting to adults) is often more rational than abandoning the core hypothesis *if* there's strong justification for the restriction.
      *   **Natural Kinds & Projectibility:** Legitimate restrictions often align with boundaries between **natural kinds** (categories that reflect real causal structures in the world, like biological developmental stages or fundamental physical regimes). "Grue" doesn't pick out a natural kind; "pediatric patients" or "quantum regime" arguably do (or at least approximate them much better).
      *   **Robustness/Invariance:** A law is robust if it holds across a wide range of *relevant* conditions. Discovering it fails under specific conditions (kids, quantum scales) refines our understanding of *which* conditions are relevant for its invariance. Grue isn't robust; its definition changes based on an irrelevant parameter (time of observation).

  4.  **How to Tell the Difference? (The Crucial Question):**
      Distinguishing legitimate restriction from "grue-ification" is hard, context-dependent, and a core task of science. Look for:
      *   **Independent Justification:** Is the boundary (age, scale, etc.) based on *prior, independent* evidence or well-established theory (biology, physics), or is it defined solely by the failure itself?
      *   **Mechanistic Explanation:** Can we point to a *causal mechanism* explaining *why* the rule breaks at that boundary (e.g., developmental biology, Planck's constant)?
      *   **Testability/Predictive Novelty:** Does the restriction lead to *new*, *testable* predictions beyond just explaining the known exception?
      *   **Non-Arbitrariness:** Does the boundary point correspond to a *meaningful threshold* in the system (biological development, fundamental constants) rather than an arbitrary number?
      *   **Coherence:** Does the restriction integrate the exception into a broader, more coherent theoretical framework?
      *   **Fruitfulness:** Does accepting the restriction open new avenues for research and understanding, or does it just protect a failing idea?

  **Conclusion:** You're absolutely correct that the *logical form* of adding a domain restriction resembles the grue maneuver. The difference isn't purely logical; it's **epistemic and pragmatic**. Science operates under the assumption that the world has structure, and its categories and boundaries aren't arbitrary. Legitimate domain restrictions are attempts to map hypotheses onto that underlying structure, justified by evidence, theory, and explanatory power. "Grue" is rejected because it's a purely linguistic trick with no grounding in that structure. **The distinction is between an *ad hoc*, arbitrary save and a *well-motivated refinement* of a theory's scope based on evidence and understanding.** While there's no single magic term for the "double standard," the concepts of **ad hoc hypotheses vs. justified auxiliary hypotheses defining domains of applicability**, grounded in **natural kinds** and **causal mechanisms**, capture the essence of the justification science relies on to navigate this inherent challenge of induction. The line can be blurry, and sometimes what starts as a plausible restriction is later revealed to be ad hoc – that's the ongoing, self-correcting process of science grappling with the problem of induction.
