answer: |-
  Okay, let's break this down without the jargon overload. Think of it like this: If your friend's view (the "form is king, material is just the temporary occupant" view) is taken seriously, here's the logical fallout for museums, restitution, and replicas:

  **1. Museum Labels Get *Very* Specific (and Awkward):**
     *   **No more "Statue of X, 5th Century BCE".** Instead: **"Sculptural Form of X (originating 5th BCE; current material composition: 30% original marble, 70% synthetic polymer resin, restoration dates: 1920, 1985, 2020)".**
     *   **Heavily Reconstructed = New Object?** If the *original material* is what constitutes the *original statue*, and it's mostly gone... then technically, what's on display under the "form" is **a *new* object (the modern reconstruction)** that just *contains fragments* of the original statue(s) within it. The label might read: **"Modern Reconstruction of X (incorporating fragments dated 5th BCE)".**
     *   **The "Two Things" Problem:** Yes, strictly speaking, if you take this view seriously, the museum *is* displaying two (or more) things at once on that pedestal:
          *   **Thing 1:** The remaining original material fragments (constituting what's left of the *original statue*).
          *   **Thing 2:** The modern filler/resin/reconstruction material that constitutes a *new object* shaped like the original.
          *   The *form* you see is a collaboration between these two distinct "constituted objects."

  **2. Restitution Debates Get Way Messier (But Also Clearer in a Weird Way):**
     *   **Easier for the "Original Bits":** If the *original material fragments* are the core of the *original statue*, then arguments for returning *those specific fragments* to their source community become incredibly strong. They *are* the looted artifact, regardless of how much filler surrounds them.
     *   **Harder for the Whole Display Piece:** The argument for returning the *entire reconstructed display piece* weakens significantly. Why should Country A return a modern-made resin/metal object (constituting a new thing) just because it *contains* a few original fragments and *looks like* something looted long ago? You're not returning the *original statue* (which is mostly just those fragments now), you're returning mostly modern material shaped like it.
     *   **The Practical Nightmare:** Imagine: "We return these 12 original fragments of the frieze. You keep the 85% of modern plaster and steel holding them in place that *your* museum added." This is logistically absurd and culturally unsatisfying for the source community who wants the *whole thing they see* back. The "form is king" view prioritizes the display *appearance* over the physical history, making restitution of the *physical object as displayed* harder to justify logically under this specific framework.

  **3. Digital Twins & Perfect Replicas Become Completely Separate Entities:**
     *   **Zero Shared Atoms = Zero Shared "Constitution":** Under this view, a 3D-printed replica or a digital scan shares *nothing* with the original statue. They have entirely different material bases (plastic/filament or digital data vs. marble/clay). They are **entirely new objects** that happen to share the same *form*.
     *   **No "Base" Connection:** They aren't a "new constitution" *of the original statue*. They are constitutions *of new things* (a plastic model, a digital file) that *copy* the original form. They have no historical or material connection to the original artifact. They are visual references or representations, not the thing itself or even a later version *of* it. A perfect replica is just a *very accurate picture* made of plastic, not a continuation of the statue.

  **The Core Logical Fallout for Authenticity & Ethics:**

  *   **Authenticity Shifts:** Authenticity becomes almost entirely about the *provenance and history of the specific material atoms*, not the enduring form or appearance. A heavily restored piece has very low "original statue" authenticity, but the *fragments* within it have high authenticity.
  *   **Ethical Weight Moves to Material:** Ethical claims (like restitution) become primarily claims about the *original material*, not about the object as it appears today. This clashes with how people (especially source communities) often emotionally and culturally connect to the *whole form* they see.
  *   **Paradox for Restoration Ethics:** If adding new material creates a *new* object alongside the original fragments, is restoration ethical at all? Or is it essentially destroying the original (by diluting its material presence) and creating a fake? This view makes restoration philosophically very problematic.
  *   **The "Wordplay" Problem You Sense:** You're right to feel it's wordplay. Strictly applying this view leads to conclusions that feel absurd in practice (like the "two things on a pedestal" or returning only fragments). It highlights how our intuitive sense of an object's identity often *does* blend form, material, history, and continuity in a way this rigid "material-constitution" view struggles to capture.

  **In short:** Taking "the statue and its clay are different things sharing space" seriously means museums are often displaying Frankenstein objects (original fragments + modern filler = two distinct things), restitution focuses fiercely on returning original fragments regardless of context, and perfect replicas are philosophically meaningless fakes. It creates a world where the *physical history* locked in the atoms is paramount, but dealing with that world practically and ethically becomes incredibly messy and often unsatisfying. Your friend's view simplifies identity (form is persistent) but complicates everything else enormously!
