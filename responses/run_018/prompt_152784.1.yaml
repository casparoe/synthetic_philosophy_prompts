  For the Clifford clinician (Dr. Hayes), he can't just demand evidence; he must grapple with suspension's impossibility. I'll have him counter that desire doesn't make belief ethical, even in crisis, and stress that stats matter—avoiding recovery platitudes. His shipowner reference should feel visceral, not academic.

  Structuring the five exchanges: 
