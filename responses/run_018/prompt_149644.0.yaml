answer: |-
  Here's a breakdown of the "You can't govern with clean hands" slogan, tailored to your seminar context, separating the distinct theses and addressing your key questions about structural complicity and emotional residue. I'll then categorize readings and suggest interpretations relevant to your advisor's argument.

  ### Core Theses Behind the Slogan

  1.  **The Trivial Necessity Thesis:**
      *   **Claim:** Governing inherently requires making decisions that affect people's lives, often negatively. You cannot avoid *all* harm or moral cost.
      *   **Dirt Source:** Systemic (simply the act of wielding power).
      *   **Emotional Residue:** None implied. Just an observation.
      *   **Relevance:** Too broad. Doesn't justify *specific* morally problematic actions like allying with authoritarians. Dismisses objections too easily.

  2.  **Walzer's Classic "Dirty Hands" (Intentional Wrongdoing for Good):**
      *   **Claim:** To achieve crucial public goods or prevent catastrophe, leaders *must* sometimes **knowingly commit morally wrong acts** (e.g., breaking promises, using violence, compromising with evil). This stains their character.
      *   **Dirt Source:** Primarily personal choice (choosing the lesser evil), though within a context demanding the choice.
      *   **Emotional Residue:** **Central.** The leader *should* feel guilt/shame. This guilt is proof they recognize the wrongness and retain moral health. "Clean hands" signify dangerous detachment or self-deception.
      *   **Relevance:** Directly addresses your scenario. Allying with authoritarians *is* the morally dirty act chosen to achieve the greater good (climate action). Objections about purity are dismissed as ignoring the tragic necessity of real-world choices.

  3.  **Structural/Systemic Complicity Thesis:**
      *   **Claim:** The very structures of power, institutions, and political competition **force complicity** with morally problematic forces, logics, or actors. Even well-intentioned actors become "dirty" simply by participating effectively within the system. The dirt accrues regardless of specific intent for a greater good.
      *   **Dirt Source:** **Primarily structural.** The system compels compromise, entanglement, or reliance on harmful actors/practices to function or achieve *any* significant goal.
      *   **Emotional Residue:** Ambiguous. Guilt *might* be appropriate (recognizing complicity), but the focus is on the *system's* pathology, not necessarily the actor's character flaw. Feeling guilt might be less central than understanding systemic imperatives.
      *   **Relevance:** Strongly applies to coalition politics. Governing effectively *requires* building majorities, often forcing deals with unsavory actors. Objections are dismissed as failing to grasp how the *institutional setup* necessitates such compromises for *any* legislative success, not just climate action.

  4.  **Moral Costs of Effectiveness (Consequentialist Realism):**
      *   **Claim:** Achieving significant, complex public goods in a pluralistic or conflictual world **inevitably imposes moral costs** (harm, injustice, compromise with evil). Prioritizing "clean hands" means choosing ineffectiveness. Effectiveness *is* morally dirty.
      *   **Dirt Source:** Consequence of pursuing effectiveness within a messy world (mix of personal choice and structural pressure).
      *   **Emotional Residue:** May involve regret or loss, but not necessarily guilt (if the action is seen as justified overall). Feeling guilt *might* signal moral sensitivity, but not core to the claim.
      *   **Relevance:** Positions climate action as a complex good requiring effectiveness, which inherently involves morally costly compromises. Objections based on purity are dismissed as prioritizing abstract morality over concrete results.

  5.  **The "No Such Thing as Clean Hands" Cynicism:**
      *   **Claim:** Politics is inherently corrupting. All power corrupts. Moral language is just a mask for interest. The very idea of "clean hands" is a naive illusion.
      *   **Dirt Source:** Inherent to power itself.
      *   **Emotional Residue:** Rejects guilt as pointless or hypocritical. Cynicism or resignation replaces moral anguish.
      *   **Relevance:** Dismisses objections as based on a fantasy. But likely *too* strong for your advisor's context (which seems to retain a moral framework).

  ### False or Problematic Theses Smuggled In

  *   **"The Ends Justify *Any* Means":** Dirty hands doesn't usually sanction *unlimited* evil for good. Walzer insists the act remains *wrong*, even if necessary.
  *   **"No Moral Constraints Apply":** Dirty hands acknowledges moral constraints are *violated*, not absent. The violation *is* the dirt.
  *   **"Moral Purity is *Always* Bad":** The claim is that it's *incompatible with effective governance*, not that moral principles are worthless.
  *   **"Feeling Guilt is *Sufficient* Atonement":** Smuggles in the idea that feeling bad cleanses the act or absolves responsibility.
  *   **"All Choices are Equally Dirty":** Denies the possibility of gradation or that some choices are *far* dirtier than others.

  ### Reading Menu by Category

  | Category             | Readings                                                                                                | Key Focus                                                                 |
  | :------------------- | :------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------ |
  | **Trivial Necessity** | Basic definitions of politics/power (e.g., Weber's *Politics as a Vocation* intro, Easton on systems) | Governing inherently involves decisions & allocation causing harm.        |
  | **Classic Dirty Hands** | **Walzer (1973) "Political Action: The Problem of Dirty Hands"** (Essential!), Williams (Moral Luck), Machiavelli (*The Prince* - interpreted through Walzer), Weber (*Politics as a Vocation* - on responsibility) | Intentional moral wrong for greater good; necessity of guilt.             |
  | **Structural Complicity** | **Thompson (1987) *Political Ethics and Public Office*** (esp. on institutional corruption), Goodin on complicity, Bourdieu (*Political Field*), maybe Lukes (*Power: A Radical View*) | How systems/institutions compel entanglement & compromise.                |
  | **Moral Costs of Effectiveness** | Weber (*Politics as a Vocation* - ethics of responsibility), Berlin (value pluralism), realist IR scholars (Morgenthau), Coady (critiques Walzer but engages necessity) | Trade-offs, consequences, impossibility of purity while being effective. |
  | **Opposing/Qualifying Views** | Nagel ("Ruthlessness in Public Life"), Hampshire (*Innocence and Experience*), Stocker (on schizophrenia), Hursthouse (virtue ethics critique), Parrish (*The Sacrifice of Socrates*) | Denies necessity, questions guilt, offers alternative frameworks.       |

  ### Interpreting Your Advisor's Claim

  Given the context (dismissing objections to a coalition with authoritarians *specifically to push through vital climate legislation*), the **most likely interpretations your advisor was invoking are:**

  1.  **Walzer's Classic Thesis (Tragic Necessity):** She likely meant: "To achieve the morally imperative goal of preventing climate catastrophe, this coalition, while involving a morally wrong compromise (legitimizing authoritarians, abandoning vulnerable groups?), is tragically necessary. Objections based on purity ignore this tragic necessity and the responsibility to act effectively. The guilt you *should* feel proves you understand the cost." This directly targets the objection.
  2.  **Moral Costs of Effectiveness:** She might have meant: "Achieving big, complex things like systemic climate legislation in a democracy *requires* messy compromises and alliances that carry moral costs. Insisting on purity guarantees failure on climate. Effectiveness isn't clean."
  3.  **Structural Complicity:** She could also have been implying: "The structure of coalition politics *forces* these kinds of deals to get anything done. Focusing on the individual politician's 'clean hands' misses how the system operates. The dirt is systemic."

  **Why these, and not others?**

  *   **Trivial Thesis:** Too weak; doesn't specifically address the *objection* to this *particular* coalition.
  *   **Cynicism:** Unlikely in an academic normative theory seminar; seems inconsistent with caring about climate legislation as a "good."
  *   **"Ends Justify Any Means":** Unlikely; most dirty hands theorists reject this.

  **Key Distinction for Seminar Discussion (Your Question):**

  *   **Was the advisor focusing on the *deliberate choice* of a necessary evil (Walzer)?** (Dirt primarily from personal agency within a tragic choice).
  *   **Or was she emphasizing the *system* forcing complicity regardless of intent (Structural)?** (Dirt primarily forced by institutional logic).

  **Bringing it Back:**

  Present these interpretations (Walzerian Necessity, Structural Complicity, Moral Costs of Effectiveness) as the most plausible candidates based on the context. Ask:

  1.  "When you invoked 'can't govern with clean hands,' were you primarily highlighting the *tragic necessity of a specific moral compromise* (Walzer), or the *systemic imperative forcing complicity* (Structural), or the *inherent moral costs of being effective*?"
  2.  "Does the 'dirt' in this scenario stem mainly from the *politician's choice* to ally with authoritarians for the greater good, or from the fact that the *political system* makes such alliances a prerequisite for achieving significant legislation, regardless of the specific intent?"
  3.  "Is the feeling of guilt/shame essential to your understanding of dirty hands in this case, as Walzer argues, or is it more about recognizing the systemic constraints?"

  Focusing on these distinctions should clarify whether the advisor was justifying a *specific tragic choice* or highlighting *systemic imperatives*, and how central the emotional residue (guilt) is to her argument. Good luck in seminar!
