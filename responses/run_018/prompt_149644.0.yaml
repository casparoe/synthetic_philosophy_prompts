prompt: |-
  I’m a PhD student in politcal philosphy, and we’re working through the dirty-hands literature in my normative theory seminar. Last week my advisor kept saying “you can’t govern with clean hands” whenever someone objected to a hypothetical coalition deal with an authoritarian party to push through climate legislation. I think she was using it to mean something like moral purity is just incompatible with real-world effectiveness, but I’m genuinely unsure what precise claim she was advancing.

  Could you lay out the different precise theses that slogan could actually be expressing? I’m especially curious about a distinction that barely came up in class: is the dirt always a result of your own choices, or can it be structurally forced on you by the institutional setup—so that even well-intentioned actors become complicit regardless of personal intent? And does the slogan smuggle in anything about emotional residue, like that you should feel guilty, or that feeling guilty is actually proof you’re still morally healthy?

  Please separate the readings into a menu—trivial ones, substantive defensible ones, false ones, and the ones that actually support dismissing objections about coalition-building. I want to bring this list back to seminar and figure out which interpretation my advsor was really invoking. Also, please answer in American English. (Sorry for the long message—I had a typo in my notes earlier, wrote “clean hans,” and now I’m second-guessing the whole framing.)
