answer: |-
  ## Moore's Gesture Against the Void

  I raise one hand before your watchful eye,
  A solid thing of flesh and bone confessed,
  And plainly state, "This object meets the test
  Of being *here*. Can any truth be nigh
  More certain?" Then, the other I display,
  A second shape defined by sight and touch.
  "Behold another! What can prove as much?"
  Two things exist beyond mere thought's array.

  ...And yet your doubt remains a chilling draft.
  You call this proof? But *that's* what's in dispute!
  This gesture, bold, cannot refute the root
  Demand: What makes this *hand*, not phantom craft?
  Is bedrock but a dream, the world a rift?
  My certainty, a rock on which to stand?
  Your framework asks: What holds the shifting sand?
  Two shadows held against the dark's deep drift.

  ---

  **Notes on Execution:**

  *   **Octave Momentum:** ABBA ABBA drives the argument. Quatrain 1: First hand ("raise," "solid," "confessed," "certain"). Quatrain 2: Second hand ("display," "shape," "prove," "exist"). Verbs ("raise," "display," "state," "behold") emphasize the theatrical demonstration.
  *   **Volta (Line 9):** "And yet your doubt remains a chilling draft" pivots sharply from demonstration to the skeptical counter-challenge.
  *   **Sestet Suspension:** CDE CDE scheme holds tension. The skeptic reframes the issue (Lines 9-11: "proof?" "dispute," "root / Demand," "phantom craft?"). The final tercet embodies the standoff (Lines 12-13: Moore's "bedrock," "rock" vs. skeptic's "dream," "rift," "framework," "shifting sand").
  *   **Conclusive Couplet:** "Two shadows held against the dark's deep drift" captures the irreducible conflict. Moore sees undeniable hands; the skeptic sees mere appearances ("shadows") within an unsecured reality ("dark's deep drift"). Neither position resolves the other.
  *   **Accuracy:** The poem faithfully renders Moore's gesture ("raise one hand," "other I display") and conclusion ("Two things exist"). It captures the core skeptical objection: that Moore assumes the very external reality he purports to prove ("*that's* what's in dispute!"), making his proof question-begging within the skeptic's framework.
  *   **Conceptual Architecture:** The sonnet form itself enacts the structure – the proof builds confidently in the octave, the volta shatters its assumed foundation, and the sestet leaves the fundamental conflict unresolved at the conceptual level, mirroring the epistemological standoff.
