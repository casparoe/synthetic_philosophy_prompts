  The user seems deeply familiar with concepts like information cascades and social epistemology. They're clearly well-read and have been observing this pattern for years. Their frustration comes from not finding an established term for this specific phenomenon in literature. They want to know if this has been studied and named, or how to define it precisely.

  I recognize what they're describing - it's that subtle shift where the burden of proof becomes impossibly high through accumulation of "reasonable" requirements. Each new objection gets met with "yes but have you considered X?" until the barrier to challenge becomes insurmountable.

  The user makes important distinctions: this isn't just polarization (the belief itself may remain uncertain), nor Popperian immunization (it emerges distributively rather than being imposed), nor simple status-quo bias. The key is how the epistemic thresholds shift collectively while each step seems rational.

  This reminds me of concepts like "epistemic learned helplessness" or "moving the goalposts," but those are too simplistic. The institutional example particularly shows how procedural rationality can create structural protection. Each new requirement - while defensible alone - forms an increasingly high barrier.

  The user's deeper questions are about rationality: can individually rational actions create collective irrationality? And how do we distinguish this from normal scientific rigor? They're pointing to a gap in how we understand distributed epistemic processes.

  I should acknowledge the sophistication of their observation while providing conceptual tools to analyze it. The challenge is naming something that's emergent and process-based rather than a static concept. Their framing of a "cascade over thresholds" is actually quite apt.
answer: |-
  What you're describing is a profoundly insightful observation that captures a critical gap in how we understand collective reasoning. While no single term fully encompasses this phenomenon, it intersects with several established concepts and deserves a precise characterization. Let's break it down:

  ### Core Phenomenon: Progressive Burden Escalation
  You've identified a **distributive, emergent process where a community collectively raises the epistemic threshold for rejecting a belief** after it gains critical mass. Each participant, acting with apparent rationality and caution, adds a new layer of required evidence or argumentation. Individually, each layer seems defensible ("being thorough"), but cumulatively, they create an insurmountable burden that structurally entrenches the belief. This is *not* merely about the belief itself cascading, but about the **criteria for its falsification cascading upward**.

  ### Related Concepts & Distinctions
  1.  **Information Cascades vs. Epistemic Threshold Cascades:**
      *   *Standard Cascades:* Individuals ignore private signals to follow predecessors (e.g., Bikhchandani, Hirshleifer, Welch). Focus is on *adopting* a belief/action based on limited information.
      *   *Your Phenomenon:* The *belief itself* may have cascaded earlier via standard mechanisms. The new process is about **raising the disconfirmation threshold** *after* adoption. It's a cascade of **epistemic gatekeeping requirements** ("If you want to challenge X, you must also address Y, and Z, and Q...").

  2.  **Groupthink (Janis) vs. Procedural Entrenchment:**
      *   *Groupthink:* Characterized by pressure for conformity, illusion of unanimity, self-censorship, and direct suppression of dissent. Often involves irrationality and motivated reasoning.
      *   *Your Phenomenon:* Dissent *is* voiced, but met with procedurally "reasonable" demands. The entrenchment arises **distributively** through the accretion of procedural hurdles, not primarily through social pressure or fear. It's often motivated by a desire for *robustness* or *caution*.

  3.  **Status-Quo Bias vs. Dynamically Escalated Burden:**
      *   *Status-Quo Bias:* A preference for the existing state due to loss aversion, effort avoidance, or familiarity. It's static.
      *   *Your Phenomenon:* The status quo is actively **defended through a dynamic, escalating series of procedural requirements**. The protection isn't inherent to the belief; it's constructed through successive communal interactions.

  4.  **Ad Hoc Hypotheses/Immunization (Popper/Lakatos) vs. Distributive Protective Belt Formation:**
      *   *Popperian Immunization:* A *single* theorist modifies a core theory with ad hoc hypotheses to evade falsification (e.g., "the experiment failed because of unseen planets").
      *   *Your Phenomenon:* The "protective belt" is built **distributively and incrementally by the *community***. Each added requirement isn't *ad hoc* in isolation; it draws on legitimate, often orthogonal, considerations (economics, alternative explanations, feasibility, prior literature). The irrationality emerges from the **uncoordinated accumulation**.

  5.  **Burden of Proof Shifting:**
      *   While burden shifting is a known fallacy, your cases show a **multi-stage, escalating, and communally ratified burden shift**. It's not a simple reversal ("prove it *is* unsafe"), but a layered construction ("prove it's unsafe *despite* A, *and* considering B, *while also* solving C").

  ### Proposed Framing & Terminology
  *   **Precise Term:** **Distributive Epistemic Burden Escalation (DEBE)** or **Emergent Disconfirmation Threshold Cascade**.
  *   **Boundary Conditions:**
      1.  **Critical Mass Trigger:** Requires an initial belief/position to reach sufficient adoption/support within the group.
      2.  **Distributive Emergence:** The escalating requirements arise from *multiple* participants adding *seemingly reasonable* layers of scrutiny *in sequence*, not a central authority imposing them.
      3.  **Cumulative Impossibility:** The *combination* of requirements becomes pragmatically or evidentially impossible for a challenger to meet simultaneously, creating structural protection.
      4.  **Procedural Rationality Facade:** Each individual layer appears reasonable, cautious, or rigorous in isolation. There is no *obvious* bad faith.
      5.  **Shifting Target:** The focus moves from the core claim ("Is X safe/effective?") to satisfying an ever-expanding set of auxiliary conditions for rejection.

  ### Rationality: The Individual/Collective Paradox
  *   **Individual Level (Apparent Rationality):** Each participant adding a layer ("Have you considered factor Y?") is often acting rationally. They are seeking comprehensiveness, robustness, or addressing potential counter-arguments. This reflects good epistemic hygiene *in a vacuum*.
  *   **Collective Level (Pathological Outcome):** The *uncoordinated accumulation* of these individually reasonable demands creates an irrational outcome:
      *   **Paralysis of Revision:** Makes falsification practically impossible, violating Popperian principles of scientific progress.
      *   **Asymmetric Rigor:** Applies vastly stricter standards to challengers than were applied to the original adoption (which may have cascaded on weaker evidence).
      *   **Epistemic Injustice:** Unfairly disadvantages new entrants or dissenters lacking resources to meet the composite burden.
      *   **Illusory Robustness:** Creates a false sense that the belief has been "stress-tested" when the tests are stacked against falsification.
      *   **Pathological Conservatism:** Protects existing beliefs/structures beyond what is justified by evidence, hindering adaptation.

  ### Why This Matters & Literature Connections
  *   **Social Epistemology (Goldman, Kitcher):** DEBE highlights how social structures and interaction dynamics, not just individual reasoning, shape justified belief. It shows how "good" epistemic practices (demanding evidence, considering alternatives) can become pathological when unmanaged.
  *   **Organizational Learning (Argyris & Schön, Levinthal & March):** Explains why organizations struggle with "unlearning" or adapting core assumptions. DEBE is a mechanism for creating "defensive routines" and "competency traps."
  *   **Science & Technology Studies (STS):** DEBE operates in scientific controversies (e.g., challenges to dominant paradigms or established technologies). It formalizes how "establishment" positions become entrenched not just by authority, but by the accretion of methodological demands.
  *   **Argumentation Theory/Informal Logic:** Represents a complex, distributed form of "moving the goalposts" fallacy or "argument from ignorance" burden shifting, amplified by group dynamics.
  *   **Complexity/Emergence:** DEBE is an emergent property of complex adaptive systems (the epistemic community). Individual micro-rationality leads to collective macro-irrationality, similar to some models in economics or traffic flow.

  ### In Summary
  You've identified **Distributive Epistemic Burden Escalation (DEBE)** – a process where a community, after reaching critical mass support for a belief, *distributively and incrementally* constructs an escalating series of evidentiary or argumentative requirements for rejecting it. Each requirement appears individually rational and cautious, but their cumulative effect creates a structurally protected belief that is effectively immune to falsification, despite initial uncertainty. This is distinct from classic cascades, groupthink, or status-quo bias by its *procedural, distributive, and threshold-escalating* nature. It represents a profound paradox: **the rigorous pursuit of individual epistemic responsibility leading to collective epistemic pathology.** This phenomenon deserves explicit recognition and modeling within social epistemology and organizational theory.
