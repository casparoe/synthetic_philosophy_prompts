  First, I need to figure out the teaching arc. The user is debating whether to start with sunk costs or the visceral feeling of being trapped. Since these are philosophy students, starting with an experiential approach might engage them better. Let's get them feeling the trap first. The dollar auction demo should come early to create that shared experience. 

  For the example, the classic dollar auction vs. a bureaucratic scenario. The dollar auction is simpler and more immediate. Bureaucratic examples might be too abstract for students without econ knowledge. The key is the structure: two parties, incremental commitment, and the point of no return. The dollar auction clearly shows that. 

  Misconceptions to address: They might confuse it with Prisoner's Dilemma, attribute it to loss aversion as a trait, or mention Abilene Paradox. I need to tackle these after the auction. Point out that PD has simultaneous moves, while this is sequential. Loss aversion is structural here, not just psychological. Abilene is about miscommunication, whereas here communication isn't the issue. 

  The core idea is local rationality leading to global disaster. That should come after the auction, using their experience to highlight how each bid seems rational at the moment. Use their bids as examples. 

  For the ending question, something that forces them to explain the mechanism. Maybe why a bidder at $0.90 would bid again. This checks if they see the incremental trap. 

  Avoid payoff matrices and game theory. Acknowledge they exist but say it's beyond the scope. Offer to discuss later if interested. 

  Timing is tight. Allocate time for auction, discussion, structural analysis, and addressing misconceptions. Keep explanations concise. Use guided questions to lead them to realize the trap themselves. Make sure the bureaucratic example is mentioned as a parallel but not the focus. 

  The user's deeper need is to teach critical thinking about structures, not just concepts. They want students to apply this to real-life situations, recognizing systemic traps. Emphasize the structural elements throughout and connect to broader applications at the end.
answer: |-
  Here’s a focused 50-minute arc designed to trap students in the logic, reveal the structure, and preempt misconceptions:

  **Core Dependency Chain:**  
  Visceral demo → Structural analysis → Formal concepts → Generalization  
  *(Sunk cost/opp cost come AFTER the trap is felt)*  

  **The Plan:**  

  **1. Trap Them First (15 mins)**  
  - **Hook (2 min):** *"We’re playing a quick game. I auction this $20 bill. Bids start at $1, increase by $1. Highest bidder pays and gets the $20. BUT: Second-highest bidder also pays their last bid... and gets nothing. Ready?"*  
  - **Run LIVE Auction (10 min):** Start aggressively. Let bidding race past $20. Stop when bids slow (~$30-$40). Collect "payments" symbolically.  
  - **Debrief Feelings (3 min):** *"Bidder A: Why did you bid $22? Bidder B: Why did you bid $19? What did it feel like at $15? When did you want to stop?"* Highlight pain, rivalry, and "can’t quit now."  

  **2. Map the Trap Structure (15 mins)**  
  - **Whiteboard the Turning Point (5 min):**  
    *At Bid $19:*  
    - Leader paid $19 if they quit → **Lose $19**  
    - If they bid $20 and win → **Lose $0** (pay $20, get $20)  
    - If they bid $20 and lose → **Lose $20** (still pay, get nothing)  
    → *Bidding $20 seems rational*  
  - **But Then... (5 min):**  
    *At Bid $20:*  
    - Trailing bidder paid $19 already → **Lose $19 if quit**  
    - Bid $21 to win → **Lose $1** (pay $21, get $20)  
    → *Bidding $21 seems rational*  
    → **Death spiral locked in.**  
  - **Core Insight Drop (5 min):**  
    *"Each bid is locally rational: ‘Losing only $1 more beats losing $19 now.’ But globally, both lose more than if they’d stopped early. The structure forces cooperation into mutual destruction."*  

  **3. Formalize Concepts & Kill Misconceptions (12 mins)**  
  - **Sunk Cost vs. Opportunity Cost (4 min):**  
    *"The $19 paid isn’t ‘sunk’—it’s actively weaponized by the structure. The trap exploits the opportunity cost of *accepting* a guaranteed loss vs. *risking* a slightly worse loss."*  
  - **Misconception Takedowns (8 min):**  
    - **"It’s Prisoner’s Dilemma!"**: *"PD is simultaneous choice. This is sequential—each bid changes the opponent’s incentives. It’s a trap of time, not betrayal."*  
    - **"Loss aversion!"**: *"Yes, but here loss aversion is created by the rules. Even a rational robot would escalate. It’s structural, not psychological."*  
    - **"Abilene Paradox!"**: *"Abilene is about miscommunication. Here, both players know the stakes and still can’t escape. Silence won’t help."*  

  **4. Generalize & Anchor (6 mins)**  
  - **Bureaucratic Example (3 min):** *"Two departments each invested $10M in a failing project. Next round: $1M more might ‘save it.’ If you quit, your $10M is wasted. If you commit, maybe you lose only $1M... or force rivals to lose $11M. Sound familiar?"*  
  - **Key Features of Escalation Traps (2 min):**  
    1. **Irreversible investments** (bids, budgets)  
    2. **Competition for a contested prize**  
    3. **Sequential decisions** where quitting = instant loss  
  - **Final Question (1 min):**  
    ***"Why can’t two perfectly rational players escape this trap once bidding passes $10—even if they want to cooperate?"***  
    *(Forces them to articulate the leader/follower incentive spiral)*  

  **What to Refuse & How:**  
  - **Payoff Matrices/Game Theory:** *"We could model this with matrices, but today’s power is seeing how the trap emerges from simple rules. If you’re curious, I’ll send optional readings."*  
  - **Evolutionary Game Theory:** *"This *does* explain why such traps persist in nature/organizations, but for now, hold that thought—we’re focusing on the mechanism."*  

  **Critical Design Choices:**  
  - **Dollar > Bureaucracy:** The auction’s speed, emotional immediacy, and clear numbers make the trap visceral. Save bureaucracy for generalization.  
  - **Delay Formal Terms:** Sunk cost feels like a "mistake." By showing the trap first, you reframe it as "structurally inevitable."  
  - **"Locally Rational" Timing:** Drop this RIGHT after mapping the $19/$20 tipping point. Use their lived experience to give it teeth.  
  - **Reframe "Rationality":** Hammer: *"This isn’t about stupidity—it’s about rationality being hijacked by the system."*  

  **The Sharp Edge:** Students leave seeing escalation not as a "bias" but as a *logical response to perverse incentives*—and that the real villain is the design of the game itself.
