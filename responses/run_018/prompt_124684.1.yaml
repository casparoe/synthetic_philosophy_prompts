prompt: |-
  I was arguing with my roommate about whether tourists have to follow local queuing and tipping rules like natives do, and I think I accidentally built a reductio but I can't locate the leak. Here is the chain I ended up with:

  (1) If a social practice is a stable coordination scheme with mutual expectation, widespread compliance, and low-cost participation, then anyone who steps into the relevant role inherits a directed moral obligation to follow it — call this scheme-inheritance.
  (2) Tipping in US restaraunts, queuing in the UK, and local jaywalking norms in Japan are exactly such schemes: they depend on predictable behavior and are cheap to comply with.
  (3) A visitor who eats at that restaurant, waits for a bus, or crosses the street steps into the role of customer or pedestrian and recieves the benefits of the scheme.
  (4) So by scheme-inheritance, the visitor has the same obligation as locals: tip around twenty percent, queue properly, don't jaywalk.
  (5) Crucially, ignorance of the local convention doesn't cancel the obligation, because the normative load attaches to the role within the scheme, not to your personal knowledge of it.
  (6) Therefore a tourist who doesn't tip, or who jaywalks because that's normal back home, commits a genuine moral wrong — not just a social faux pas.
  (7) But scheme-inheritance applies to any coordination game: specific greeting rituals, dress codes in religious spaces, left-hand eating rules, and even bribery norms where they are stable, expected, and cheap.
  (8) So either we're constantly committing invisible moral violations everywhere we travel, or scheme-inheritance must be false.

  I really want to keep (1) and (3) — they feel right for promises and contract-like situations — but (8) is unbearable. Is the slip between (4) and (5), where I smuggle in that ignorance doesn't excuse? Or is (5) correct and the problem is that (1) needs a knowledge or consent filter that kills (6) but saves the intuition about queuing? I feel like there's a hidden move about voluntariness versus mere role-occupancy, but I can't pin it down. Which step do you reject, and what does rejecting it cost — especially if I want to hang on to the idea that everyday conventions can generate real obligations?
reasoning: |-
  Okay, let me try to unpack the user's argument. They're stuck in a reductio ad absurdum about moral obligations from social practices. The core issue seems to be that applying their principle universally leads to constant invisible violations when traveling. That feels wrong, so where's the flaw?

  First, I need to map their logic chain. Premise (1) claims stable coordination schemes create role-based obligations. Examples in (2) seem solid—tipping, queuing. (3) says tourists step into these roles by participating. (4) concludes identical obligations. (5) insists ignorance doesn't excuse. (6) declares violations morally wrong. (7) extends this to all such norms globally. (8) cries absurdity. 

  Hmm. The user suspects either (4)-(5) (ignorance exemption) or (1) needing a knowledge filter. But let me test deeper. 

  First angle: what makes a "role"? Queueing feels different from bribery because the pedestrian role is universal, while "bribe-payer" isn't. Maybe roles need moral neutrality? But queuing has moral weight via fairness... 

  Second angle: benefit receipt. Tourists benefit from queues and tipping systems. But do they benefit from bribery norms? Arguably yes (smoother bureaucracy), but that feels icky. Benefit alone can't sanctify immoral practices. 

  Third angle: knowledge. Premise (5) says ignorance irrelevant, but that clashes with how blame works. We excuse honest mistakes. If a tourist genuinely doesn't know tipping rules, calling it "morally wrong" seems harsh—more like a correctable misstep. 

  Fourth angle: voluntariness. Entering a restaurant feels voluntary; crossing a street less so. But scheme-inheritance treats both the same. Maybe obligations scale with voluntariness? 

  *lightbulb* Ah! The real leak might be in premise (1)'s scope. It assumes all stable schemes create moral obligations, but some are merely practical (which side to eat with), while others are moral (fair queueing). Conflating them causes overreach. 

  Solution: Modify (1) to require the scheme to serve a morally significant good (e.g., fairness, harm reduction). Tipping and queues prevent free-riding; bribery enables corruption. So (7) fails—bribery norms don't create obligations even if stable. 

  This preserves the user's core intuition (queuing/tipping obligate tourists) without absurdity. Ignorance still matters for blameworthiness, but the obligation exists once aware. Win-win!
answer: |-
  Your reasoning is sharp, and the reductio you've built highlights a genuine tension in normative philosophy regarding social conventions. The leak is likely between **steps (1) and (4)**, specifically in how broadly "scheme-inheritance" applies. Let's break it down:

  ### The Core Problem: **Premise (1) Overgeneralizes**
  Premise (1) treats *all* stable coordination schemes as generating *moral obligations* purely through role-occupancy and benefit-receipt. This is too strong. While some coordination schemes (like queuing) generate moral obligations tied to fairness or harm avoidance, others (like bribery or arbitrary etiquette) do not. Obligations don't flow mechanically from scheme stability; they depend on **the moral purpose of the scheme itself**.

  ### Where Your Argument Derails: **Step (7)**
  Step (7) correctly notes that scheme-inheritance *formally* applies to any coordination game, but this is where the reductio bites. The flaw isn't in (4)–(5) (ignorance *doesn't* negate existence of an obligation in norm-based cases), but in assuming all schemes are morally equivalent. Consider:

  1. **Morally Grounded Schemes** (e.g., queuing):  
     - Serve a clear moral good (fairness, efficiency, preventing harm).  
     - Benefit-receipt creates a fairness-based obligation (avoid free-riding).  
     - *Tourist obligation holds*: Ignorance excuses blameworthiness but not the duty to comply once aware.

  2. **Morally Neutral or Harmful Schemes** (e.g., bribery, arbitrary dining etiquette):  
     - Lack inherent moral value (or are actively immoral).  
     - Benefit-receipt doesn't create a moral obligation; it may even create a duty to *resist* (e.g., corrupt norms).  
     - *Tourist obligation fails*: Compliance is pragmatic, not moral.

  ### Why Ignoring This Distinction is Fatal (Step 8)
  If you treat bribery identically to queuing, you get the absurd conclusion in (8). But this just shows premise (1) needs qualification: **Not all coordination schemes generate moral obligations—only those serving a morally significant purpose**.

  ### Revised Premise (1) to Save Your Intuitions
  To preserve scheme-inheritance for queuing/tipping while avoiding the reductio, modify (1) to:  
  > *"If a social practice is a stable coordination scheme that (a) serves a morally significant good (e.g., fairness, harm reduction), (b) has mutual expectation and widespread compliance, and (c) imposes low-cost participation, then anyone who voluntarily steps into the relevant role inherits a pro tanto obligation to follow it."*

  ### Implications for Your Argument
  - **Steps (2)–(6) hold** for queuing/tipping: These serve fairness (preventing free-riding). A tourist *does* have an obligation, and ignorance doesn't negate it—though it may lessen blame.  
  - **Step (7) fails** for immoral/arbitrary schemes: Bribery violates broader moral principles (justice, integrity). Left-hand dining rules are mere conventions without moral weight.  
  - **Step (8) dissolves**: Invisible violations only occur for *morally significant* schemes you're unaware of—not for all conventions.

  ### What About Ignorance? (Step 5)
  You're right that ignorance doesn't negate the *existence* of a role-based obligation (e.g., a tourist *should* queue fairly once they understand the system). But ignorance **does affect blameworthiness**: Failing to tip due to genuine ignorance is a mistake, not a "genuine moral wrong" (step 6). The obligation crystallizes upon awareness.

  ### The Voluntariness Caveat
  Your instinct about "role-occupancy vs. voluntariness" matters. Entering a restaurant is voluntary; walking down a public street is not. Obligations are stronger when roles are explicitly chosen (e.g., dining) versus passively occupied (e.g., jaywalking norms). But even passive roles can bind if the moral stakes are high (e.g., not jaywalking near a school).

  ### Conclusion
  Reject **step (7)** as stated. The cost is accepting that not all stable conventions create moral obligations—only those grounded in morally significant goods (fairness, harm prevention). This saves queuing/tipping as obligation-generating while sparing tourists from "invisible moral violations" for arbitrary or harmful norms.  

  This preserves your core insight: Everyday conventions *can* generate real obligations when they solve coordination problems tied to justice or collective welfare. But it insists we filter schemes through their moral purpose—not just their stability.
