prompt: |-
  I'm running a ninety-minute seminar for philosophy undergraduates and computer-science graduate students who arrive convinced that talk of "moral responsibility" is mostly folk-psychological confusion. I want them to grasp Strawson's claim that reactive attitudes—resentment, gratitude, forgiveness—are not rewards or sanctions appended to libertarian freedom, but the very relational medium in which moral responsibility lives, and that the "objective attitude" is not a moral upgrade but a shift in how one relates to another being. Don't explain the theory to me; plan how I should teach it.

  First, lay out the dependency order: which idea must be secured before reactive attitudes can be introduced, which must come before the objective attitude can be distinguished from mere "cool-headedness," and what must follow so they don't collapse the distinction into "emotional versus rational." Second, specify the single carrying example: I want to build it around a hiring algorithm that rejects a qualified candidate because of an opaque, unreviewable weighting error, asking whether we can resent the system, its designers, or neither. Say exactly what this case must include (opacity, human oversight failure, direct harm) and exclude (a single identifiable wrongdoer with clear intent) to do the philosophical work, and explain why a classic interpersonal betrayal—say, a friend breaking a promise—would fail as the central case for this audience. Third, map the misconceptions I should expect and intercept: that reactive attitudes are switchable emotional states; that the objective attitude is just clinical analysis; that determinism forces us to adopt the objective attitude toward everyone; and that Strawson is offering a compatibilist rescue of responsibility by redefining freedom. For each, identify the point in the sequence where it will surface and how to defuse it without derailing the arc. Fourth, give me one end-of-session diagnostic question that reveals whether they understand moral responsibility as anchored in the quality of a relation rather than in a metaphysical freedom condition. Fifth, state explicitly what I should refuse to cover—whether the full taxonomy of reactive attitudes, the comparison with Kantian autonomy, or the later literature on moral luck—and justify why leaving it out protects the core idea rather than simplifying it away. The plan should fit ninety minutes with no advance reading.
reasoning: |-
  Okay, the user is running a seminar for philosophy undergrads and CS grad students who are skeptical about moral responsibility. They want to teach Strawson's view that reactive attitudes aren't just add-ons but are fundamental to moral responsibility. The objective attitude isn't superior but a different relational stance. I need to create a lesson plan without explaining the theory itself.

  First, I need to establish the dependency order. The key is to start with the concept of moral responsibility as a social practice, not a metaphysical issue. Then introduce reactive attitudes as essential to this practice. Only after that can I contrast the objective attitude as a different relational mode. I must prevent them from seeing this as emotional vs. rational.

  The central example should be a hiring algorithm case. It needs opacity (the algorithm's decision-making is unclear), human oversight failure (no one checked properly), and direct harm (real consequences for the candidate). I should exclude a clear wrongdoer with intent because that would make it interpersonal. A friend breaking a promise wouldn't work for this audience because CS students might see algorithms as deterministic systems, not agents with intentions. The algorithm case forces them to consider whether resentment makes sense without a blameworthy agent.

  Now, misconceptions to address. First, reactive attitudes aren't switchable emotions; they're natural responses tied to relationships. This will come up when discussing resentment towards the algorithm. I can defuse it by pointing out that we don't genuinely resent the algorithm because it's not part of our moral community. Second, the objective attitude isn't just clinical analysis; it's a detachment from the moral relationship. This might surface when discussing the designers. I'll clarify that we can hold designers responsible because they are participants in the moral community. Third, determinism doesn't force objectivity towards everyone. This comes up during Q&A. I'll emphasize that determinism doesn't change our natural reactions. Fourth, Strawson isn't redefining freedom; he's shifting focus to our practices. This arises when discussing compatibilism. I'll redirect to the relational aspect.

  For a diagnostic question, I should ask whether we can resent the algorithm and why, or if we should take an objective stance towards the designers. Their answers should show if they understand responsibility as relational.

  I should avoid covering the full taxonomy of reactive attitudes, Kantian comparisons, or moral luck. Including these would dilute the core lesson about relational responsibility. The goal is a focused session without prior reading.

  The user is likely an educator who wants to challenge CS students' reductionist views. They need a structured plan that engages both groups. Philosophy students might grasp the concepts, but CS students need concrete examples. The hiring algorithm case bridges both fields. The deeper need is to show that moral responsibility isn't just metaphysics but about human interactions, which matters in tech ethics.

  I need to ensure the plan fits 90 minutes. Timing each section is crucial. Start with 20 mins on moral responsibility as practice, then 25 on reactive attitudes with the example. Spend 15 on objective attitude and contrast. Reserve 15 for misconceptions and 10 for wrap-up and diagnostic. Leave 5 mins buffer.

  The diagnostic question should force students to apply the relational view. Asking why resentment towards the algorithm doesn't stick, or if designers can be resented, tests their grasp. The answer should reference participation in moral relations, not intent or freedom.

  By avoiding Kant and moral luck, I keep the focus on Strawson's core idea. Philosophy students might want more depth, but staying focused ensures the main point is clear for everyone. The key is making the relational aspect undeniable through the algorithm example.
answer: |-
  Here’s a structured 90-minute seminar plan targeting your audience and goals, prioritizing conceptual dependencies, a tailored central example, preemptive misconception management, and tight focus:

  **Dependency Order & Timing (Core Arc):**  
  1. **Moral Responsibility as Social Practice (20 mins):**  
     - Start with the **shared assumption**: "When we say someone is morally responsible, what are we *doing*?" (Not "What metaphysical conditions exist?").  
     - Elicit examples from daily life (e.g., blaming a roommate for mess, thanking someone for help).  
     - **Secure this first**: Responsibility is a *social/interpersonal practice*, not a verdict about cosmic freedom. Without this, reactive attitudes seem like emotional add-ons.  

  2. **Reactive Attitudes as the "Relational Medium" (25 mins):**  
     - Introduce **reactive attitudes (RAs)**: Resentment, gratitude, indignation, forgiveness as *constitutive* of holding/being responsible.  
     - **Key pivot**: "We don’t *add* resentment because someone is free; resentment *is how we experience* their responsibility to us."  
     - **Deploy the Central Example**:  

       > **Hiring Algorithm Case**:  
       > *A highly qualified candidate is rejected by an opaque AI system due to a hidden weighting error (e.g., penalizing resumes from liberal arts colleges). The system’s decision logic is proprietary and unexplainable ("black box"). Human reviewers rubber-stamp its output without scrutiny. The candidate suffers tangible harm (lost job, financial strain).*  
       >   
       > **Why this works**:  
       > - **Opacity** (no accessible "intent") forces focus on *relational stance* rather than blameworthy mind.  
       > - **Oversight failure** implicates designers *indirectly* but without clear *mens rea*.  
       > - **Direct harm** triggers instinctive resentment.  
       > - **Excludes**: A single rogue actor (e.g., a biased HR manager) would invite traditional blame, collapsing the needed ambiguity.  
       >   
       > **Guided Questions**:  
       > - *"Can we resent the algorithm?"* (Usually: "No, it’s just code!").  
       > - *"Can we resent the designers?"* (Debate: They didn’t *intend* this harm).  
       > - *"If not, why do we feel outraged? What’s missing?"* → Points to absence of a *participant in moral relations*.  

  3. **Objective Attitude as Relational Shift (15 mins):**  
     - Contrast: "What if we treated the algorithm’s designers *only* as systems to be debugged/fixed, not as answerable?"  
     - **Crucial distinction**: Objective attitude isn’t "rational analysis" (we can analyze RAs rationally!), but *withholding* the expectation of mutual answerability.  
     - **Strawson’s punchline**: We take this stance toward children, the mentally ill, or machines—not because they’re "determined," but because they can’t *participate in moral dialogue*.  

  4. **Synthesis & Defusing Collapse (15 mins):**  
     - Reiterate: RAs vs. Objective is **not emotion vs. reason**, but *relational posture* (e.g., forgiving someone still engages morally; cold fury is still resentment).  
     - **Anchor to case**: Resenting the *designers* (if they’re competent adults) is natural because they *can* engage in moral dialogue; analyzing the *algorithm* objectively is natural because it *can’t*.  

  **Misconceptions to Intercept:**  
  1. **"RAs are switchable emotions"**  
     - *When/Why*: During algorithm case ("Can’t we just *choose* not to resent?").  
     - **Defusal**: "Try genuinely feeling gratitude toward a toaster. RAs arise from seeing others as *moral interlocutors*—it’s not voluntaristic." (Link to step 2).  

  2. **"Objective attitude = clinical analysis"**  
     - *When/Why*: When contrasting RAs with "rational" response to designers.  
     - **Defusal**: "Is analyzing *why* your friend betrayed you clinical? No—if you still see them as answerable. Objectivity is *stepping outside* the reciprocal stance." (Link to step 3).  

  3. **"Determinism forces universal objectivity"**  
     - *When/Why*: Q&A after synthesis.  
     - **Defusal**: "Does knowing psychology/neuroscience make you relate to your friend as you do to a car that breaks down? Strawson: Determinism is irrelevant; our *form of life* demands RAs." (Link to step 1—social practice).  

  4. **"Strawson redefines freedom to save responsibility"**  
     - *When/Why*: If compatibilism is mentioned.  
     - **Defusal**: "He’s not redefining *freedom*; he’s showing that responsibility isn’t *about* freedom in the libertarian sense. It’s about the kinds of relations we have." (Emphasize step 1 and step 2).  

  **Diagnostic Question (End of Session):**  
  > *"Imagine the algorithm’s lead designer apologizes sincerely, explaining they’ve fixed the error. Would it make sense to* forgive *them? Contrast this with 'fixing' the algorithm. What does this show about where responsibility 'lives'?"*  
  **Reveals**: Understanding forgiveness as a *relational repair* between moral agents (possible with designer, nonsensical with algorithm), not contingent on libertarian freedom.  

  **What to Refuse to Cover (With Justification):**  
  - **Full taxonomy of RAs** (e.g., moral vs. non-moral resentment): Distracts from core relational claim; your case uses "resentment" broadly enough.  
  - **Kantian/Rawlsian comparisons**: Introduces extraneous metaphysics/deontology. Strawson’s point is *pre*-theoretical.  
  - **Moral luck literature**: Shifts focus to "control" conditions, undermining the relational pivot.  
  - **Compatibilism debates**: Your goal is *conceptual redirection*, not defending compatibilism. Mentioning it invites metaphysical digressions.  
  **Why omit?** Strawson’s radical move is making responsibility *prior to* freedom debates. Covering these implies his project is defensive rather than descriptive.  

  **Session Flow Checklist:**  
  - :00-:20 — Practice, not metaphysics (Step 1)  
  - :20-:45 — RAs + Algorithm Case (Step 2)  
  - :45-:60 — Objective Attitude contrast (Step 3)  
  - :60-:75 — Synthesis + misconception firewalls (Step 4)  
  - :75-:85 — Diagnostic Q + discussion  
  - :85-:90 — Wrap-up: "Responsibility lives in our shared reactive fabric, not in uncaused causes."  

  **Why Interpersonal Betrayal Fails for This Audience:**  
  CS students will grant that *humans* have "illusions" of responsibility but see algorithms as exposing the *truth* of determinism. The algorithm case:  
  1. **Validates their instinct** that machines aren’t responsible (objectivity is natural),  
  2. **Creates dissonance** when they feel rage at designers *without* clear intent,  
  3. **Forces the question**: "What does the algorithm *lack* that the designers *have*, if not libertarian freedom?" → Answer: *Status as a participant in moral dialogue*.  

  This approach meets them where their skepticism lives (machines as responsibility-litmus tests) and pivots to Strawson’s insight without metaphysical bait.
