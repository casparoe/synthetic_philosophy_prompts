  The mitochondrial code variants point is sharp though. Those actually are arbitrary in the sense that the same codon means different things in different organisms. That's closer to a true convention. But does that scale up to calling the whole genome a "program"? Probably not. 

  I should acknowledge their insight about synthetic biology's framing too. If genes are "rewritable software," but the underlying mechanism isn't truly code-like, does that make synbio's premise shaky? Maybe not, because practical engineering often uses productive metaphors even if they're philosophically imperfect. 

  The nested interpreters idea (histone code etc.) is fascinating but possibly a red herring. Evolution didn't "design" interpreters—it cobbled together physical systems that happen to have interpretative effects. The user seems suspicious of teleological language here, rightly so. 

  Key distinctions to emphasize: 
  - The genetic code table itself IS arbitrary/conventional 
  - But the molecular implementation is physical complementarity 
  - "Programming" metaphors work pragmatically in synbio but fail philosophically if overextended 

