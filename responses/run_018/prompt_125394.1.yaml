prompt: |-
  Hey, I'm writing a feature on whether we should ever say an AI 'believes' something, and I'm stuck on the conceptual plumbing. Before I quote anyone, I want the actual desiderata: what must a theory of belief-attribution to AI get right? List the cases it must handle - like a black-box LLM that generates perfect explanations for answers that weren't causally driven by those explanations, versus a system with explicit world-modeling. The distinctions it can't collapse: predictive success vs mental-state attribution, functional role vs causal history. And flag any joint unsatisfiability hiding in there, maybe between requiring interpretive transparency and allowing neural architectures. Which requirements are hard and which are just prejudices of the 'it's just statistics' camp? I keep coming back to that old idea that some entities are designed to be interpreted rather than being real intentional systems - does that distinction collapse when the system learns to fake interpretation? Don't send me a bibliography, I'm writing on a plane. There's probly a typo in this ask but you get the gist.
