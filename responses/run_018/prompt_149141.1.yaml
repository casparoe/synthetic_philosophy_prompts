answer: |-
  ### Exam Prompt: Parfit's Hitchhiker & Observable Precommitment  
  **"Parfit argues that rationality is self-defeating in the original Hitchhiker case: the driver’s rational refusal to pay in town (ex-post) deters the hitchhiker from saving her in the desert, making her ex-ante rationality fatal. Now suppose the driver can, before the trip, activate an observable smart-contract lockbox that will automatically transfer her $100 to the hitchhiker if she fails to pay him voluntarily in town. The hitchhiker sees whether this device is active before deciding to save her.  

  Does this observable commitment device resolve Parfit’s paradox? Argue one of the following:  
  (A) It eliminates the self-defeating nature of rationality by credibly binding the driver.  
  (B) It merely relocates the paradox to a conflict between *ex-ante rationality* (activating the device) and *ex-post rationality* (regretting activation when in town).  

  Explain your reasoning using game-theoretic mechanics (payoff structures, dominance, backward induction). Explicitly contrast this case with Newcomb’s Problem if you reference it, highlighting why observable precommitment changes the strategic landscape. No external sources needed."**  

  ---

  ### Model Answer (798 words)  
  The observable commitment device transforms but does not resolve Parfit’s paradox; it merely relocates the tension between ex-ante and ex-post rationality (Option B). To demonstrate this, we must model the interaction as a sequential game with perfect information and examine how precommitment reshapes incentives without eliminating rational conflict.  

  **I. Mechanics of the Modified Game**  
  *Stage 1*: Driver chooses to activate the device (D+) or not (D−). The hitchhiker observes this choice.  
  *Stage 2*: Hitchhiker chooses to rescue (H+) or abandon (H−) the driver in the desert.  
  *Stage 3*: If rescued, driver in town chooses to pay (P+) or not pay (P−) the hitchhiker.  

  *Payoffs* (Driver, Hitchhiker):  
  - Rescue + Payment: (50, 50) [Driver: life − $100; Hitchhiker: $100]  
  - Rescue + No payment: (100, −10) [Driver: life; Hitchhiker: wasted effort]  
  - Abandoned: (−1000, 0) [Driver dies; Hitchhiker indifferent]  
  - Device auto-pays if rescue occurs but P−: (50, 50) [Device enforces payment]  

  **II. Why the Device "Solves" the Original Problem Superficially**  
  In the original Parfit case (no device), backward induction from Stage 3 dictates the driver chooses P− (dominant strategy: 100 > 50). Foreseeing this, the hitchhiker chooses H− (0 > −10), leading to (−1000, 0). Rationality is self-defeating.  

  With the device active (D+), the hitchhiker knows payment is guaranteed: if P−, the device enforces (50,50). Thus, H+ yields (50,50) > H− (0,0) for the hitchhiker. The driver, anticipating rescue, activates D+ ex-ante: she gets 50 (life − $100) > −1000 (death). This appears to align individual rationality with mutual benefit.  

  **III. The Relocated Paradox: Ex-Ante vs. Ex-Post Rationality**  
  The conflict resurfaces when we scrutinize the driver’s ex-post perspective *conditional on rescue*. Once saved and in town:  
  - If the device is **active (D+)**, the driver *regrets activation*: she would prefer P− (100) to enforced payment (50).  
  - If the device is **inactive (D−)**, she prefers P− (100) to P+ (50), but abandonment makes this irrelevant.  

  Crucially, the device’s observability creates a new ex-ante dilemma:  
  - **Ex-ante rationality** compels D+: It ensures rescue (50 > −1000).  
  - **Ex-post rationality** (in town) rebels against D+: It forces a suboptimal payoff (50 < 100) when P− was possible.  

  Thus, while the device coerces cooperation, the driver’s rational ex-post preference contradicts her rational ex-ante choice. The self-defeating dynamic isn’t solved—it shifts from the hitchhiker’s abandonment to the driver’s post-hoc frustration with her own precommitment.  

  **IV. Contrast with Newcomb’s Problem**  
  Newcomb’s Problem involves a *non-observable* prediction (Omega’s box) creating tension between dominance (take both boxes) and expected utility (one-box). Here:  
  - The device is **observable**, so the hitchhiker responds to a *verifiable action* (D+), not a forecast of irrationality. This removes "magical" prediction; payoffs depend solely on tangible choices.  
  - In Newcomb, irrationality (one-boxing) yields a better outcome. In Hitchhiker+, activating D+ is *ex-ante rational* (not irrational) and leverages a *credible threat* (auto-payment), not self-deception.  
  - Both share a conflict between temporal perspectives, but Hitchhiker+ lacks Newcomb’s epistemic opacity: players see the device state, eliminating "fatalism" debates.  

  **V. Why Rationality Remains Self-Defeating in Spirit**  
  Parfit’s core claim is that rationality can thwart one’s deepest goals (e.g., survival). The device "saves" the driver only by constraining her future agency, making her pay against her ex-post will. Rationality still demands an action (D+) that she would rationally reverse later—a dynamic absent in conflict-free coordination. The device transfers the "irrationality" burden from the hitchhiker (who now acts rationally) to the driver’s temporal selves.  

  Thus, while the observable precommitment alters the game’s equilibrium, it perpetuates Parfit’s thesis: rationality, when fragmented across time, creates costly intra-agent conflicts.  

  ---

  ### Marking Scheme (30 marks total)  
  **Top answers (25–30 marks) must include these 5 moves:**  

  1. **Backward induction of the full game** (6 marks)  
     - *Mistake:* Only analyzing the original paradox or ignoring stages (e.g., not modeling hitchhiker’s observation of the device).  
  2. **Distinguish ex-ante/ex-post driver payoffs** (6 marks)  
     - *Mistake:* Claiming D+ resolves all conflict without noting driver’s regret in town (50 < 100).  
  3. **Explain device observability’s role** (6 marks)  
     - *Mistake:* Treating the device as a "black box" without clarifying how its observability enables hitchhiker cooperation.  
  4. **Contrast with Newcomb’s Problem** (6 marks)  
     - *Mistake:* Superficially comparing the two (e.g., "both involve precommitment") without specifying observability vs. prediction.  
  5. **Argue why the paradox relocates** (6 marks)  
     - *Mistake:* Asserting the device "solves" self-defeat without addressing intra-driver temporal conflict.  

  **Penalties:**  
  - −3 marks for conflating Hitchhiker/Newcomb without mechanical contrast.  
  - −2 marks per unaddressed move (max −10).  
  - −4 marks for summarizing Parfit’s original case without engaging the twist.  

  ---

  **Rationale for Scheme:**  
  This tests mastery of dynamic game theory, temporal rationality, and structural differences between classic dilemmas. The 5 moves force engagement with the twist while preempting canned responses. Banning citations ensures focus on mechanics, and the Newcomb penalty targets a persistent confusion in student work.
