prompt: |-
  I serve on the competency-review board of a surgical training program, and after a recent incident in which a resident passed every written examination yet failed to adapt when a simulated procedure presented an atypical tissue plane, I have become personally convinced that our assessments confuse propositional mastery with genuine operative skill. I need a practical evaluation procedure—something my committee can actually apply in the simulation lab—that operationalizes the philosophical distinction between knowing-how and knowing-that without requiring evaluators to make speculative claims about internal mental states. The procedure should take the form of an ordered sequence of observational tests, with explicit criteria for what counts as passing or failing each stage, designated points where the evaluation must halt because the question exceeds behavioral evidence and becomes a matter of values or institutional risk tolerance, and clear instructions for how to weight verbal articulation against manual adaptation when the two come apart. Crucially, it must incorporate what I have been calling perturbation-response mapping: the idea that knowing-how reveals itself not in error-free execution but in the topology of recovery—how quickly, with what economy of motion, and toward what functional endpoint a practitioner corrects after an introduced anomaly—rather than in the absence of deviation itself. Please apply the procedure to two worked cases: a laparoscopic dissection in which sudden bleeding obscures the standard triangular landmarks near the cystic duct, requiring the resident to navigate by tactile and visual affordances rather than named anatomical structures; and a suturing task under time constraint where the needle angle is deliberately non-standard, testing whether the hands reconfigure grip and rotation without waiting for explicit problem-solving. Deliver the entire response as continuous prose without headings, bullet points, bold formatting, or tables, suitable for inclusion in a formal committee memorandum.
reasoning: |-
  Okay, the user is part of a surgical training program's competency-review board. They've encountered a problem where a resident passed written exams but failed in a simulation with an atypical tissue plane. This shows a gap between theoretical knowledge (knowing-that) and practical skill (knowing-how). The user wants an evaluation procedure that distinguishes these without speculating on mental states. 

  The key elements needed are: observational tests in sequence, clear pass/fail criteria, stopping points when evaluation exceeds behavior, and weighting verbal vs. manual skills. The user emphasizes "perturbation-response mapping"—focusing on recovery from errors rather than perfect execution. 

  The user also requests two worked cases: one laparoscopic dissection with sudden bleeding obscuring landmarks, and another suturing task with a non-standard needle angle. The response must be in continuous prose suitable for a formal memo. 

  First, I need to design the evaluation procedure. It should be a step-by-step sequence that any evaluator can follow in the simulation lab. Each step must have explicit criteria. The core is observing how residents handle introduced anomalies—like bleeding or awkward needle angles—and how they recover. 

  For the procedure structure: 
  - Stage 1: Baseline execution. Residents perform the task normally. Pass if they execute correctly without help. 
  - Stage 2: Perturbation introduction. Introduce an anomaly like unexpected bleeding. Pass if they recognize it quickly and don't panic. 
  - Stage 3: Adaptive correction. Observe how they recover. Pass if they adjust using sensory cues (touch, sight) without hesitating or over-relying on theory. 
  - Stage 4: Functional resolution. See if they complete the task safely and effectively. Pass if they reach a good outcome with minimal wasted motion. 
  - Stopping points: If they fail Stage 2 or 3, the evaluation halts because it shows a lack of practical skill. No need to speculate why—just document the behavior. 
  - Weighting verbal vs. manual: If they articulate a plan but execute poorly, manual adaptation trumps. If they fix the problem but can't explain, that's acceptable as long as the outcome is safe. 

  Now for the worked cases: 
  - Case 1 (Laparoscopic dissection with bleeding): 
    - Baseline: Resident identifies landmarks correctly. 
    - Perturbation: Simulated bleeding obscures view. Pass if they immediately recognize it and pause to avoid injury. 
    - Adaptive correction: They should switch to tactile/visual cues (e.g., feeling for ducts, using tool feedback) without freezing. Fail if they keep searching for invisible landmarks. 
    - Resolution: Achieve dissection with minimal errors. If they adapt and complete, pass. If not, stop evaluation—they lack knowing-how. 
  - Case 2 (Suturing with non-standard needle): 
    - Baseline: Sutures normally with correct grip. 
    - Perturbation: Needle is awkwardly angled. Pass if they notice instantly and adjust grip/rotation fluidly. 
    - Adaptive correction: Hands should reconfigure without pausing to "figure it out." Fail if they fumble or try to force it. 
    - Resolution: Secure suture efficiently. If they adapt fast and finish, pass. Manual skill outweighs any verbal struggle. 

  The user's deeper needs: They want to prevent real-world surgical errors by ensuring residents can handle surprises, not just textbook cases. The procedure must be objective—focused on observable actions, not guesses about what the resident is thinking. It should also protect the program legally by having clear stopping points (e.g., if a resident fails Stage 2, it's a hard fail without debate). 

  Finally, the response must be formal prose—no lists or headings. I'll weave everything into a narrative memo style, using the cases to illustrate the procedure in action. The tone should be precise and authoritative, fitting a committee document.
answer: |-
  **Memorandum: Proposed Evaluation Procedure for Distinguishing Propositional Mastery from Operative Skill in Surgical Simulation**

  This document outlines a structured observational procedure designed to assess surgical residents' practical knowing-how distinct from theoretical knowing-that, with explicit criteria to halt evaluation when inferences exceed behavioral evidence. The method centers on perturbation-response mapping: introducing controlled anomalies during simulated procedures to evaluate recovery topology—speed, motion economy, and functional endpoint correction—rather than flawless initial execution. The procedure comprises four sequential stages, each with binary pass/fail criteria. Failure at any stage terminates the assessment, as further stages require competence in prior adaptive behaviors. Verbal articulation is secondary to manual adaptation; when discrepancies occur, manual performance is weighted at 80% for stages 2–4, as knowing-how manifests in embodied correction. 

  **Stage 1: Baseline Execution**  
  The resident performs the standard procedure without perturbations. *Pass*: Safe, efficient completion using conventional landmarks/tools within time limits, with ≤2 minor non-critical errors (e.g., brief instrument clash). *Fail*: Critical error (e.g., tissue injury), >2 non-critical errors, or time overrun. *Halt point*: Failure here indicates insufficient foundational skill for perturbation testing.  

  **Stage 2: Perturbation Recognition and Initial Response**  
  An anomaly is introduced (e.g., simulated bleeding, altered needle angle). *Pass*: Resident detects the anomaly within 10 seconds (via visual/tactile cues or tool feedback), pauses to avoid injury, and does not proceed with pre-perturbation plan. *Fail*: Misses anomaly, ignores it, or forces original plan causing simulated harm. *Halt point*: Failure demonstrates absence of situational awareness, making advanced adaptation assessment invalid.  

  **Stage 3: Adaptive Correction**  
  Focuses on recovery trajectory after perturbation. *Pass*: Resident reorients using available affordances (e.g., tissue tension, instrument resistance, spatial relationships) within 20 seconds, demonstrating ≥2 adaptive maneuvers (e.g., shifting grip, altering dissection angle, changing camera view) with economy of motion (no extraneous movements). Verbal explanation during this stage is noted but not required; hesitations >5 seconds or declarative statements without concurrent action count against adaptation. *Fail*: Reliance on theoretical recall (e.g., "The cystic duct should be here" while probing blindly), persistent attempts to use obscured landmarks, or recovery taking >60 seconds. *Halt point*: Failure confirms knowing-that/knowing-how divergence; further testing risks institutional liability.  

  **Stage 4: Functional Resolution**  
  Assesses completion post-adaptation. *Pass*: Task concluded safely with functional outcome (e.g., hemostasis achieved, sutures secure) using adaptive strategy, with ≤1 new non-critical error attributable to the perturbation. *Fail*: Critical error, abandonment, or non-functional result.  

  **Worked Case 1: Laparoscopic Cholecystectomy with Sudden Bleeding**  
  *Stage 1*: Resident identifies Calot’s triangle landmarks correctly via camera—pass. *Stage 2*: Simulated bleeding obscures triangle. Resident halts dissection, aspirates blood, and adjusts camera—pass. *Stage 3*: Instead of seeking landmarks, resident uses blunt probe to trace cystic duct by tactile resistance ("tenting" tissue), switches to lateral traction to expose the plane, and clips duct based on structural continuity—pass. Verbalizes "I can’t see it so I’m feeling the tube structure" during action. *Stage 4*: Completes dissection without injury—pass. *Weighting note*: Verbalization confirmed but did not drive adaptation; manual response dominated scoring.  

  **Worked Case 2: Suturing with Non-Standard Needle Angle**  
  *Stage 1*: Resident sutures tissue efficiently using palm grip—pass. *Stage 2*: Needle driver presents needle at 70° (vs. standard 90°). Resident notices awkward entry, stops before tissue puncture—pass. *Stage 3*: Within 8 seconds, rotates needle driver to modified pencil grip, uses wrist supination to reorient angle, and completes stitch via tactile feedback without visual confirmation—pass. Verbally states "Wrong angle" post-correction. *Stage 4*: Suture holds under tension test—pass. *Weighting note*: Delayed verbalization irrelevant; grip reconfiguration scored as knowing-how.  

  **Implementation Notes**  
  1. **Termination Protocol**: Failure at Stages 2 or 3 concludes the evaluation with "Deficient Adaptive Skill" designation, avoiding speculation about causes (e.g., stress vs. knowledge gaps).  
  2. **Verbal-Mannual Weighting**: In Stages 2–3, if verbal planning exceeds 5 seconds without concurrent action, it reduces the pass threshold (e.g., >2 hesitations = fail).  
  3. **Risk Mitigation**: Halting at Stage 2/3 failure aligns with institutional risk tolerance by preventing residents from progressing to complex adaptations without foundational adaptive competence.  
  4. **Perturbation Design**: Anomalies must be physiologically plausible (e.g., bleeding mimics vascular anatomy; needle angles retain biomechanical feasibility) to avoid testing unrealistic scenarios.  

  This procedure transforms philosophical distinctions into actionable metrics, prioritizing recovery topology over rote performance. It ensures evaluators make no inferences about mental states—only observable actions and outcomes—while systematically exposing gaps between propositional knowledge and embodied skill.  

  ---  
  *Submitted for committee review and validation in Q3 simulation assessments.*
