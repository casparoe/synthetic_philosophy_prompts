  I should consider if this is a verbal dispute. The terms are the same, but their meanings are embedded in different frameworks. So, when they use "existence," they're not talking about the same concept. That's why they talk past each other. Also, the normative vs. descriptive angle: intuitionists are prescribing how math should be done (normative), while classicists might see their approach as describing an external reality (descriptive). 

  Another layer is the explanatory standards. What counts as a satisfactory explanation differs. For classicists, non-constructive proofs are valid because they point to truth. For intuitionists, only constructions provide understanding. These standards are foundational and hard to reconcile.

