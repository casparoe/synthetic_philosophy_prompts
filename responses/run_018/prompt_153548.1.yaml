  Franklin originally designed his thirteen virtues to build upon each other - Temperance first to clear the mind for vigilance, then moving through Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice, Moderation, Cleanliness, Tranquility, Chastity, and finally Humility. He added Humility last after a Quaker friend warned him against pride.

