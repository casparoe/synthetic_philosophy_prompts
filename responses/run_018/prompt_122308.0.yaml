  I'm writing teh final exam for my upper-level political theory seminar and I'm stuck on the nationalism unit. I want one essay prompt that forces students to actually work with Hobsbawm's idea of invented traditions and Anderson's imagined communities together, not just summarize them in seperate paragraphs. To keep it from being a pure recitation exercise, I made up a hypothetical case: the Republic of Maritima gains independence in 1975, then in 1992 its post-coup goverment commissions a "traditional" royal coronation that never exisited before, complete with invented regalia and a state-sponsored folklore archive. Then in 2015, a diaspora community in a neighboring country starts claiming Maritimian citizenship not through ancestry or language but through shared access to digitized colonial records on a goverment server—basically an imagined community built on bureaucratic archives instead of print-capitalism or daily ritual.

  Please write me teh exam question, a model answer of about 650 words, and a marking scheme. The question should ask students to analyze both teh 1992 coronation and teh 2015 diaspora claim through both theorists, and specifically to identify where teh two frameworks conflict—especially on whether teh diaspora's archive-based solidarity counts as a genuine Anderson-style fraternity or as a Hobsbawm-style tradition extended overseas by teh state. Teh model answer needs to hit at least four specific conceptual moves: (1) Hobsbawm's distinction between genuine custom and invented tradition used for legitimation, (2) Anderson's emphasis on horizontal comradeship and teh role of media in making strangers feel connected, (3) teh tension between top-down state invention and bottom-up imagination in teh diaspora case, and (4) whether teh digitized archive functions like Anderson's print-capitalism or like Hobsbawm's official ritual. Teh marking scheme should seperate an A answer (all four moves present with teh tension actually developed) from a B answer (all four mentioned but teh conflict smoothed over or ignored) and should flag teh common mistake of treating "imagined" as meaning "fake" rather than "cognitively constructed." Keep it seminar-level—no bibliographies, no citation lists, and don't lean on anything more niche than these two frameworks. I just want teh prompt, model answer, and rubric in one go.
