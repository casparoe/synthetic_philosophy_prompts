prompt: |-
  I'm a third-year undergraduate currently enrolled in our department's seminar on combinatorial games, and I've been asked to lead one fifty-minute session of it next week on the strategy-stealing argument. My classmates can state what a strategy is (a function from histories to moves), have done backward induction on small game trees, and have seen the determinacy result for finite games of perfect information stated and applied but never proved; in an earlier session they brute-forced tic-tac-toe and a 3×3 Hex board by hand. A good third of them are computer science majors who will want to know whether the proof hands them an algorithm. I don't need the argument explained to me — I need a plan for explaining it, and for what has to be in place before it can even be stated so that the conclusion lands as surprising rather than as a restatement of the truism that moving first is better.

  Specifically, I'd like:

  1. The dependency ordering. Which components have to precede which — the reduction ad absurdum shape, the symmetry of the game under swapping the two players, the condition that an extra move is never a disadvantage, and determinacy plus the absence of draws as the pair of facts that converts "the second player has no winning strategy" into "the first player has one" — and what goes wrong if I present the conclusion before the side conditions, or the copycat manoeuvre before the notion of a complete strategy is fixed. Which pieces can I assume from the earlier sessions and which must I re-derive in the room?

  2. The carrying example. One game the whole session hangs on, playable in pairs on paper in under ten minutes, which cannot end in a draw, in which the never-a-disadvantage condition is visible at a glance rather than asserted, and which the students cannot solve exhaustively in the time they have. Tell me what such an example must have and lack, and why not the obvious candidates — Hex on a small board, Chomp, tic-tac-toe, Gomoku — if not those.

  3. The misconception map in the order the students will actually form them, each attached to the point in the sequence where it should be headed off. The ones I anticipate: that the argument identifies a good first move; that it establishes a first-player win rather than the absence of a second-player win, and so shows that White is better at chess; that the extra-move condition is a technical formality, or that it merely says no move is ever bad; and confusion about the stealing step itself — whether the first player is literally passing a turn, and whether the stolen strategy might want to make use of the extra stone. Which of these deserve class time up front and which should I let surface before correcting?

  4. One task for the final ten minutes that would let me distinguish a student who has the argument from one who has only memorized its shape. My instinct is to hand them a game for which the correct answer is that the argument does not apply, together with the question of which condition fails, rather than one more game where it works — but tell me if that's the wrong instinct and why.

  5. What I should deliberately omit at this level, and say out loud that I'm omitting. I'm inclined to list the proof of determinacy, the bridge from Hex to Brouwer's fixed-point theorem, and anything about computational complexity, but I'd rather you correct that list than confirm it.
reasoning: |-
  Hmm, the user is a third-year undergraduate preparing to lead a seminar session on the strategy-stealing argument. They have specific questions about structuring the lesson, choosing an example game, addressing misconceptions, creating an assessment task, and deciding what to omit. Let me break this down.

  First, the dependencies. The argument relies on several components: determinacy (for finite perfect-information games without draws), the "never a disadvantage" condition, symmetry, and the reductio ad absurdum structure. I need to sequence these logically. Determinacy should come first since it establishes that one player must have a winning strategy. Then symmetry - the game must look the same for both players. Next, the extra move condition: that having an extra stone never hurts. Only then can we introduce the reductio setup: assume second player has a winning strategy, then let first player "steal" it to create a contradiction. If I present these out of order - say showing the copycat move before establishing that extra stones don't hurt - students might think stealing works even when it doesn't.

  For the example game, standard choices have problems. Small Hex boards might be brute-forced. Chomp has that ugly first move ambiguity. Tic-tac-toe has draws. Gomoku is too complex. I recall a game called "Cram" or "Domineering" but even better - there's this edge-matching game called "Shannon switching game" or perhaps "Bridg-it" which is perfect. It's symmetric, no draws possible, and extra moves clearly help since you're connecting more paths. Best of all, it's unfamiliar so students can't shortcut the argument.

  Misconceptions will arise at specific points. When we state the conclusion, some will think it identifies a good first move (it doesn't). When mentioning determinacy, they might confuse "no winning strategy for second player" with "first player wins" (but determinacy bridges this). During the stealing step, many will imagine literal turn-passing rather than strategy copying. And some CS majors might ask about algorithms, not realizing the proof is non-constructive. I should preempt the stealing confusion when demonstrating copycat, and address the algorithm question when summarizing.

  For assessment, giving a game where strategy-stealing fails is brilliant. Kayles or Nim - something with nimbers where extra moves can backfire. Ask which condition breaks. This tests understanding better than regurgitating the argument. 

  Finally, omissions: definitely skip determinacy proof (too technical), Brouwer connection (off-topic), and complexity (distracting). Mention these exclusions explicitly to manage expectations. Also skip infinite games - stick to finite cases.

  The user's approach is thoughtful. They recognize that surprise matters - the conclusion should feel nontrivial. Their question 3 shows deep awareness of learner psychology. I'll emphasize how each piece builds toward the unexpected punchline.
answer: |-
  Here's a comprehensive plan tailored to your seminar session, prioritizing logical flow, engagement, and misconception prevention. The goal is to make the argument's *non-constructive* nature and reliance on specific conditions land as the key insights.

  **Core Structure & Dependency Ordering (20-25 mins):**

  1.  **Anchor: Determinacy & No Draws (5 mins)**
      *   **Recall/Re-derive:** Briefly recall from earlier sessions: Finite perfect-information games **must** have a winning strategy for Player A, Player B, or be a draw. **Crucially state:** We are *only* considering games **where draws are impossible**. Therefore, one player *must* have a winning strategy. *(This is essential – the argument's conclusion is "First Player has a winning strategy," but the direct result is "Second Player does *not* have a winning strategy." Determinacy bridges this gap.)*
      *   **Why now?** Establishes the binary outcome: Win for P1 or Win for P2. Sets up the reductio target.

  2.  **Symmetry (3 mins)**
      *   **Define:** The game is identical for both players. Swapping the roles (Player 1 becomes Player 2 and vice versa) and swapping the players' tokens/stones/moves does not change the rules or winning conditions. The board looks the same to both players.
      *   **Why now?** Essential for the "stealing" to make sense. The stolen strategy must be executable in the opponent's role. Precedes the stealing concept.

  3.  **The Extra Move Condition ("Never a Disadvantage") (7-10 mins)**
      *   **Define Rigorously:** If Player A has a winning strategy from a position *P*, then Player A *also* has a winning strategy from any position *P'* that is identical to *P* except that Player A has **one extra legal move** already placed on the board (and it's still Player A's turn, or Player B's turn if the extra move completes a turn). *Emphasize:* This isn't just "some moves are good," it's that adding *any* extra piece of your own, *anywhere legal*, cannot *harm* your winning prospects if you were winning before.
      *   **Simple Example:** Briefly illustrate with dots & boxes or a tiny Cram/Domineering fragment. "If I can force a win from this empty board, surely I can force a win from a board where I've *already* placed this helpful domino here? What if I place it somewhere 'bad'? The condition says even placing it somewhere 'bad' shouldn't *prevent* me from winning if I could win without it."
      *   **Why now?** This is the most subtle and critical condition. It justifies the "pass" move in the stealing argument. Must be established firmly *before* introducing the stealing manoeuvre. Students often mistake this for "all moves are good," so emphasize it's about *preservation* of a winning position despite an extra piece.

  4.  **Reductio ad Absurdum Setup (2 mins)**
      *   State the goal: Prove First Player has a winning strategy.
      *   Outline the reductio: **Assume the opposite:** Second Player *has* a winning strategy. Call this strategy `S`. We will show this leads to a contradiction.

  5.  **The Stealing Manoeuvre & Contradiction (5 mins)**
      *   **The Copycat (with a twist):** First Player makes an **arbitrary first move** (call it `X`). Now, *from First Player's perspective*, the board looks like a starting position *for Second Player* (because of Symmetry), *except* that First Player (now acting as the *new* "Second Player" in this mirrored view) has an **extra stone** (`X`) on the board.
      *   **Stealing `S`:** First Player pretends the stone `X` isn't theirs and *ignores it for strategy purposes*. They now use the stolen Second Player strategy `S` **as if** they were the *second* player to move in this new game state (which starts after `X` is placed). When `S` says "play move Y on the board *ignoring `X`", First Player plays `Y`. When `S` responds to an opponent's move `Z`, First Player (using `S`) treats `Z` as the opponent's move.
      *   **The Contradiction:** This stolen strategy `S` is supposed to guarantee a win *for the player using it* (originally Second Player). But First Player is using `S` *and* has an extra stone `X` on the board! The "Never a Disadvantage" condition guarantees that if `S` wins from the position *without* `X`, it must *still* win from the position *with* `X` added. Therefore, First Player wins. But `S` was assumed to be a *Second Player* winning strategy! Contradiction. Therefore, our assumption (Second Player has a winning strategy) is false. By Determinacy (No Draws), First Player *must* have a winning strategy.
      *   **Emphasize:** 1) The extra stone `X` is *ignored* when executing `S`. 2) `S` is used *reactively* to the opponent's actual moves. 3) The "Never a Disadvantage" condition is invoked to handle the extra stone `X`.

  **The Carrying Example: Why Not Standard Candidates & The Solution (10 mins Play + 5 mins Discuss)**

  *   **Why NOT:**
      *   **Small Hex/Chomp/Tic-tac-toe:** Solvable by brute-force in minutes, eliminating the *need* for the non-constructive argument. Ruins the surprise.
      *   **Gomoku:** Draws are possible on large enough boards (though complex), and symmetry/extra move condition is less intuitive at a glance.
      *   **Chomp:** The "poison cookie" breaks symmetry slightly (first player *can* take it, but it loses) and the extra move condition is debated/intuitive but not *glaringly* obvious. The argument works, but the asymmetry is a distraction.
  *   **The Ideal Candidate: Shannon Switching Game / Bridg-it / (Simplified) Gale**
      *   **Game:** Players (Red/Blue) take turns placing their own colored edge on a grid/graph. Red aims to connect Left-Right with a path of red edges. Blue aims to connect Top-Bottom with a path of blue edges. (Standard Bridg-it board). **Crucially:** Only one path is needed. Edges don't block; a vertex can have multiple incident edges.
      *   **Why it works:**
          1.  **No Draws:** Impossible. Any complete edge set *must* contain either a left-right red path or a top-bottom blue path (by the Hex Lemma/Planar Duality, but don't state this - it's visually obvious on small boards during play). This is the key strength over Tic-tac-toe/Gomoku.
          2.  **Symmetry:** Swapping Red/Blue and Left-Right/Top-Bottom is identical.
          3.  **Extra Move = Clear Advantage:** Adding *any* extra red edge *always* helps Red achieve a left-right connection. It can never *hurt* Red's goal. Similarly for Blue. This is visually intuitive - more connections are better. (Contrast with Chomp where taking the wrong cookie *can* be bad).
          4.  **Non-Trivial:** Even a 3x3 grid of vertices (requiring edge placements) is complex enough that a 50-minute session participant won't brute-force the strategy, making the argument necessary and surprising.
      *   **Activity:** Have pairs play 2-3 quick games on small (e.g., 2x2 vertex grid -> 3 edges per player needed) Bridg-it paper grids. Point out the "more edges always better" during play. Ask "Who should win? How do you know?"

  **Misconception Map & When to Address Them:**

  1.  **"The argument identifies a good first move." (During/After Stepping through Stealing)**
      *   **When:** Explicitly when explaining the arbitrary first move `X`. Hammer this point: `X` is *any* move. The argument says *nothing* about *which* move is good, only that a winning strategy *exists* for P1.
  2.  **"It proves White wins Chess." (During Conclusion/Summary)**
      *   **When:** When stating the conclusion. Explicitly list the conditions: Finite, Perfect Info, No Draws, Symmetry, Extra Move never a disadvantage. State clearly: Chess has draws and likely lacks the extra move condition (castling, pawn structure, zugzwang), so the argument **does not apply**.
  3.  **"Extra Move Condition is trivial/just means 'no bad moves'." (During Definition of Condition)**
      *   **When:** When defining it. Contrast with "no bad moves". Use an example: In Hex, placing a stone *on your own goal line* might seem "bad," but the condition states that *if you had a winning strategy before placing it*, you must *still* have one after placing it *somewhere else* (even there). It's about *preserving* a win, not about every move being locally optimal. Bridg-it makes this clear: adding a useless edge doesn't *hurt* your chance if you were winning.
  4.  **"Is P1 literally passing? / Does the stolen strategy use the extra stone?" (During Stealing Explanation)**
      *   **When:** *While* drawing the diagram of the stealing manoeuvre. Explicitly show:
          *   P1 plays `X` (physically places it).
          *   P1 *then pretends `X` isn't there* when consulting the stolen strategy `S`.
          *   `S` tells P1 what move to make (`Y`) *ignoring `X`*, so P1 plays `Y`.
          *   Opponent plays `Z`.
          *   P1 feeds `Z` into `S` (still ignoring `X`) to get the next move.
          *   Reiterate: `X` is only used implicitly via the "Never a Disadvantage" condition to *justify* that `S` still wins even though `X` is present. `S` itself never "sees" `X`.

  **Final 10-Minute Task: Spot the Flaw**

  *   **Your Instinct is Perfect.** Give a game where strategy-stealing **fails** and ask **which condition(s) break**.
  *   **Game Suggestion 1: Nim (e.g., single pile of 3 stones).**
      *   Rules: Players take 1 or 2 stones. Take last stone wins.
      *   Outcome: **Second Player wins** (if P1 takes 1, P2 takes 2; P1 takes 2, P2 takes 1). Strategy-stealing would incorrectly "prove" P1 wins.
      *   **Failing Condition: Extra Move is a Disadvantage (Zugzwang)!** If P1 could "pass" and force P2 to move first, P1 *would* win. But having the *extra move* (being forced to move first) is the *disadvantage*. Adding an extra stone (making the pile bigger) doesn't help the player who just moved if they were losing.
  *   **Game Suggestion 2: Kayles (Simplified - a row of 3 pins).**
      *   Rules: Players knock down 1 or 2 adjacent pins. Knock down last pin wins.
      *   Outcome: **First Player wins** (P1 knocks down middle pin, wins). *But*, strategy-stealing still technically works here (P1 wins). To make it fail, **modify**: Players knock down 1 or 2 *adjacent* pins. **Last player to knock down a pin *loses_*** (Misère).
      *   Outcome: **Second Player wins** (Similar logic to Nim). Strategy-stealing would "prove" P1 wins.
      *   **Failing Conditions:** 1) **Symmetry?** (Okay-ish). 2) **Extra Move Disadvantage:** Again, being forced to move last (take the last pin) is bad. Having an extra pin on your "side" can force you into this. 3) **No Draws?** (Okay). *Alternatively, use standard Nim misère if they know normal Nim.*
  *   **Task:** "Play this game [State Rules]. Who wins? Why does the strategy-stealing argument *fail* to apply here? Which specific condition is violated?" Forces them to apply the *conditions*, not just the rote argument.

  **Deliberate Omissions (State These Explicitly):**

  1.  **Proof of Determinacy:** "We're taking as a given that in finite, perfect-information games with no draws, one player has a winning strategy. Proving this rigorously involves backward induction on the game tree, which is beautiful but beyond our scope today." (Mentioning backward induction connects it to prior knowledge).
  2.  **Brouwer's Fixed-Point Theorem:** "While Hex was invented to illustrate Brouwer's theorem, and the connection is deep and fascinating, we're focusing purely on the combinatorial game argument today. That bridge is a story for another seminar!"
  3.  **Computational Complexity:** "The argument tells us a winning strategy *exists*, but gives *no clue* how to find it or how complex it is. For games like Hex on large boards, finding the *actual* winning move is computationally hard (PSPACE-complete), even though we know one exists! We won't dive into complexity classes today."
  4.  **Infinite Games:** "Everything we've said assumes the game is *finite* and must end. Strategy-stealing can sometimes work in infinite games, but it gets much trickier and requires stronger conditions. We're sticking to finite games."
  5.  **Detailed Analysis of Example Games:** "We used Bridg-it to see the conditions clearly. We won't derive the *actual* winning strategy for it today; the power of strategy-stealing is that we don't *need* to!"

  **Why This Plan Works:**

  *   **Builds Logically:** Each concept directly enables the next. Determinacy -> Symmetry -> Extra Move -> Reductio Setup -> Stealing -> Contradiction -> Conclusion.
  *   **Surprise is Preserved:** The Bridg-it example is winnable but not easily solved, making the non-constructive "P1 must win" conclusion genuinely surprising. The final task reinforces the conditions are non-trivial.
  *   **Misconceptions Targeted:** Addresses each major confusion point *at the moment it's likely to arise* during the explanation.
  *   **CS Majors Engaged:** The non-constructive nature *is* the answer to "Where's the algorithm?" The final task also appeals to analytical thinking.
  *   **Active Learning:** Bridg-it play and the final task get them thinking hands-on.

  Good luck with your session! Focusing on the *conditions* and the *non-constructiveness* is key to making it land.
