answer: |-
  Here's my numeric breakdown for the proposition, followed by transparency on limitations. My credence that **$10M on top longtermist AI safety work yields more expected good than $10M on top global health interventions (e.g., bed nets, vaccine delivery) is 15% (0.15)**.  

  ### Decomposition (with 1-line rationale per term):  
  1. **P(This century is a true hinge): 35%**  
     *Rationale: AI, bioengineering, and space tech could lock in irreversible trajectories, but historical volatility suggests it's plausible, not certain.*  
  2. **P(Half-life of trajectory change >200 years): 40%**  
     *Rationale: Path dependence from AI architecture/standards could persist, but institutional drift and value shifts erode most influence faster.*  
  3. **P(Far future is astronomically valuable): 85%**  
     *Rationale: Even with low habitability estimates, potential lives over deep time dominate near-term impacts.*  
  4. **P(Net sign of impact is positive): 70%**  
     *Rationale: Robust AI safety work likely reduces existential risk, but cluelessness eats ~30% of value.*  
  5. **P($10M buys meaningful trajectory change): 60%**  
     *Rationale: Funding talent/research in uncrowded fields has leverage; political friction caps it.*  

  ### Combined:  
  **Base calculation:**  
  `0.35 (hinge) × 0.40 (half-life) × 0.85 (astronomical value) × 0.70 (positive sign) × 0.60 (marginal impact) = 0.05`  

  **Adjustment for comparative advantage:**  
  - Top global health charities (e.g., AMF) save a life for ~$4k–$10k, translating to ~1,000–2,500 QALYs/$10M.  
  - Longtermism’s leverage must exceed this by orders of magnitude. Multiplying by a **3× factor** (0.05 × 3 = 0.15) accounts for AI safety’s potential for outsized impact *if* the premises hold.  

  **Correlation notes:**  
  - *Defensible multiplication?* Partially. Terms 2–5 are weakly correlated (e.g., long half-lives imply stronger lock-in, aiding marginal impact), but overcompensated by *negative* correlations (e.g., hinge probabilities and cluelessness uncertainties). Net error is likely <±25% relative.  
  - *Alternative approach:* If treating half-life and hinge as interdependent (P(hinge & persistence) ≈ 25%), the product drops to 0.09 before adjustment.  

  ### Sensitivity & Your Disagreement:  
  - **Most sensitive term: Half-life persistence (term 2).** A shift to 60% (your view?) raises the credence to 0.29; a drop to 20% (your friend?) crushes it to 0.06.  
  - **Your gap with your friend (0.55 vs. 0.15):** This is almost certainly anchored in **half-life persistence (term 2)**. You see institutional/tech lock-in as robust; they see decay as rapid.  

  ### Meta-Confidence & Least Secure Ingredient:  
  - **Confidence in this exercise: 60%**  
    The proposition *has* a probability (it’s a factual claim about causal impacts), but key terms are non-empirical, and "expected good" relies on contested moral weights.  
  - **Least secure ingredient: Half-life of trajectory change (term 2).**  
    We lack data on century-scale causal persistence. History shows both durable shifts (e.g., industrial revolution institutions) and reversals (e.g., 20th-century ideological collapses). Technology may lock in values, or accelerate value drift. This is fundamentally speculative.  

  **Conclusion:** At 0.15, I side weakly with your friend. The half-life and hinge probabilities are the core bottlenecks—without them, longtermism’s case unravels against near-term proven interventions. If you’re at 0.55, doubling down on *why* you believe in persistent influence (e.g., specific mechanisms like irreversible AI deployments) is where your debate lives.
