prompt: |-
  I've got a recurring argument with a friend and I want to find out where it actually lives, so I need a number out of you — not a tour of the debate, and no "it depends" as a resting place.

  Here's the proposition I want your credence on: that 10 million dollars spent today on the best longtermist thing you can actually name (say, work on making very powerful AI systems go well) does more expected good than the same 10 million spent on the best near-term global health work you can name. Give me your number on that, and then decompose it, with a figure and a one-line reason for each term.

  The term I keep getting stuck on, and that I want you to deal with explicitly, is what I've started calling the half-life of a trajectory change. Even if you do push the course of events now, later people get to redecide, institutions drift, norms churn, technologies get rebuilt from scratch — so the shift you caused decays back toward whatever the default was going to be. If the half-life is a decade, almost all of the far-future payoff evaporates and the case for longtermism collapses into something much more modest; if it's ten thousand years, it doesn't decay meaningfully at all. So give me P(half-life longer than roughly two centuries) as one of your terms, and say what you think sets it — path dependence in institutions, lock-in from technology, something about values converging, whatever.

  Other terms I want in there: the chance that this century is genuinely a hinge rather than an ordinary one (i.e. that lock-in of some trajectory, good or bad, is actually on the table); the chance that the far future is astronomically valuable rather than merely large; whether the extra value we'd be causing has a determinate sign at all or whether the downstream effects are so tangled that it's closer to a coin flip — I want a number for how much of the expected value survives that worry; and the chance that money spent on the longtermist thing buys any trajectory change at all, which is a separate question from whether trajectory changes matter. Combine them, tell me honestly whether multiplying them is defensible or whether some terms are correlated in ways that break the arithmetic, and tell me which single term your final number is most sensitive to.

  I'm at about 0.55 on the top-level claim and my friend is at about 0.15, and I don't think we disagree about population ethics, which is where everyone assumes these arguments land. Guess which term the gap is really in.

  Last thing: tell me how confident you are in this whole exercise — whether a proposition like this is even the sort of thing that has a probability, or whether I'm forcing a number out of a question that's mostly normative — and flag the one ingredient you're least sure about, including if the thing you're least sure of is whether "expected good" means anything stable here.
