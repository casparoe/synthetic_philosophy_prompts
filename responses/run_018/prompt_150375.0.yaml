  For the test case: to distinguish rules, I need a scenario where structural unity and depth are present but biology is absent. A hypothetical synthetic system with identical predictive coding to the human brain, but built artificially. If Reeves denies consciousness, it confirms a biological bias; if she accepts, it's purely about implementation.

