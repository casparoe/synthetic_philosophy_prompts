  Alright, let me unpack this user's query. They're teaching a graduate seminar on the philosophy of social science and have noticed a recurring pattern in the literature that doesn't fit neatly into standard taxonomies. They describe researchers who start by rejecting holism, insisting that explanations must bottom out in individual beliefs and interactions. However, these same researchers then use macro-level distributions as exogenous parameters in their models, effectively relying on collective patterns to explain phenomena while denying those patterns any explanatory autonomy.

  First, I need to grasp the core issue: the inconsistency between rejecting holism and implicitly depending on unexplained macro-structures. The user mentions this appears in agent-based modeling and rational-choice theory, but they're more interested in the logical structure of the move itself. They want to know if there's an established term for this or if it's a failure mode of methodological individualism.

  I recall terms like "crypto-holism" or "downward causation," but as the user points out, those don't quite fit. Crypto-holism implies hidden group intentions, which isn't the case here. Downward causation suggests macro causes micro, which these researchers explicitly deny. So, the phenomenon is subtler—using the macro as an unexplained boundary condition while maintaining individualist rhetoric.

  The user's deeper need seems to be providing students with a clear framework to critique such models. They likely want precise terminology to highlight the logical tension and pedagogical tools to discuss this in class. Terms like "explanatory residual" or "boundary holism" come to mind, but I should check if existing literature has labels. Epstein's critique of generative sufficiency in agent-based models might be relevant, where reproducing macro patterns doesn't explain their emergence.

  Also, considering the user's request for British English, I'll ensure terms like "behaviour" and "individual-level" are spelled accordingly. The definition must distinguish this from auxiliary hypotheses—here, the macro parameter isn't a testable assumption but an unexamined foundation. It's inconsistent with strict methodological individualism because it leaves the collective unexplained, creating a gap between rhetoric and practice. However, it might be an omission rather than incoherence if researchers acknowledge the need to explain the macro parameters later. But often, they don't, treating them as given. 

  In conclusion, no single term exists, so coining "the exogenous macro-structure problem" or "unexplained collective boundary conditions" could help. Emphasizing the boundary conditions and the silent explanatory work will clarify the issue for their students.
answer: |-
  Right, this is a fascinating and rather pervasive pattern that absolutely deserves a name and careful dissection in a graduate seminar. You've pinpointed a significant logical tension that often slips under the radar. While there isn't a single, universally agreed-upon term for *exactly* this manoeuvre, the phenomenon is recognised and discussed, often under related critiques. Here's a breakdown, framed in British English as requested:

  ### Potential Labels & Related Concepts

  1.  **"The Exogenous Macro-Structure Problem" (Descriptive Term):** This directly names the core issue: treating the very macro-distribution (the collective pattern) that needs explaining as an *exogenous input* (a given, unexplained boundary condition) to the individual-level model.
  2.  **"Unexplained Collective Boundary Conditions":** Emphasises that the model relies critically on specifying collective states as starting points, without accounting for their origin.
  3.  **Epstein's "Generative Sufficiency" Critique (Adjacent):** Joshua Epstein argued that simply *generating* a macro-pattern from micro-rules (the "generative sufficiency" criterion in agent-based modelling) is necessary but *not sufficient* for explanation. Your case is a specific failure mode of this: the micro-rules often *depend* on the macro-state they are supposed to generate, making the "generation" circular or parasitic on the initial condition. The pattern isn't truly *emerging* from pure micro; it's presupposed.
  4.  **"Methodological Individualism's Explanatory Residual":** Highlights that this macro-parameter represents the unexplained residue left over after the individualist explanation attempts to do its work – the bit that stubbornly resists reduction.
  5.  **"Boundary Holism" (Less Common):** A slightly more provocative term suggesting that holism is smuggled in through the back door of the model's boundary conditions, even while being denounced at the front door.

  ### Defining the Phenomenon Precisely

  *   **Core Definition:** The practice of constructing a social scientific explanation purportedly adhering to **methodological individualism** (MI), which explicitly denies causal/explanatory autonomy to supra-individual entities, but which nevertheless **relies crucially on one or more macro-level social distributions or states** being treated as **fixed, exogenous parameters** within the model.
      *   These parameters (e.g., the current distribution of beliefs, the existing institutional structure, the prevalence of a norm) **set the context** within which individual agents make decisions according to specified micro-rules (beliefs, preferences, interaction protocols).
      *   The model is then **calibrated** or **tested** by its ability to **reproduce** (or sustain) the *observed* macro-pattern (the explanandum) *given* this initial macro-state.
      *   The **logical inconsistency** arises because the macro-state parameter itself **remains unexplained** within the individualist framework, despite being a necessary condition for the model's micro-level mechanisms to produce the desired outcome. The collective pattern thus functions silently as both the *target* of explanation and an *unexplained premise* enabling that explanation.

  ### Boundary Conditions & Distinctions

  *   **Distinct from Ordinary Auxiliary Hypotheses:**
      *   **Scope and Centrality:** Auxiliary hypotheses are typically background assumptions *supporting* the core explanatory mechanism (e.g., gravity holds for physics models). Here, the macro-parameter is *central* – it defines the very environment in which the core micro-mechanisms operate. Removing it often renders the micro-mechanisms incapable of explaining the specific phenomenon in question.
      *   **Explanatory Target:** Auxiliary hypotheses are usually *not* themselves the primary phenomenon being explained. In this case, the macro-parameter *is* often directly related to, or even an instance of, the *type* of collective phenomenon the model claims to explain (e.g., using the *current* norm distribution to explain *why* the norm persists/collapses).
      *   **The "Unexplained" Criterion:** While auxiliaries might be assumed, the key issue here is that the macro-parameter represents a *collective social fact* that MI *prima facie* commits to explaining *in terms of individuals*, yet it remains unaccounted for.
  *   **Distinct from Crypto-Holism:** Crypto-holism implies a *deliberate* attempt to sneak in holistic causes disguised as individualist ones (e.g., attributing genuine group intentions). This pattern is often less deliberate – it's frequently an oversight arising from pragmatic modelling choices or a focus on *sustaining* rather than *emerging* phenomena. The researcher genuinely believes they are being individualist; the holism is structural, not intentional.
  *   **Distinct from Downward Causation:** Downward causation explicitly posits that macro-states causally influence micro-states. This pattern avoids that claim. The macro-parameter is treated as a *static condition* or *context*, not an active causal force *acting upon* individuals within the model's dynamics. The causal work is still assigned to the micro-rules *operating within* that context.

  ### Consistency with Methodological Individualism?

  *   **Inconsistent with Strong/Rigorous MI:** Strict methodological individualism demands that *all* social phenomena be *ultimately* explained by (and only by) facts about individuals, their mental states, dispositions, and relations. Treating a macro-distribution as an unexplained primitive blatantly violates this. It leaves a crucial social fact unaccounted for at the individual level.
  *   **Potentially an "Embarrassing Omission" within Pragmatic/Weak MI:** Many practitioners adopt a more pragmatic stance: MI provides the *best* or *only tractable* way to model certain phenomena, even if initial conditions require simplification. They might *intend* to explain the macro-parameter later or argue it's "given" for *this specific* explanatory purpose (e.g., explaining persistence, not origin). However, this defence often falters:
      *   The "later explanation" rarely materialises.
      *   The parameter is often *essential* for the model's success in replicating the *specific* explanandum, meaning the explanation is incomplete without it.
      *   It risks creating a regress: how did *that* initial macro-state arise? If the answer requires another model relying on a *previous* unexplained macro-state, the individualist project stalls.
  *   **Fundamentally, it's a Failure of *Explanatory Closure*:** MI promises explanatory closure at the individual level. This pattern demonstrates a failure to achieve that closure for the specific phenomenon under study. The explanation leaks; it relies on an unexplained social fact.

  ### Conclusion & Recommendation for Your Seminar

  While "crypto-holism" or "downward causation" might be tempting labels, they don't capture the precise *structural* flaw you've identified: the **uncritical reliance on an unexplained macro-state as a fixed boundary condition within a model rhetorically committed to explaining everything from the individual level upwards.**

  The most precise descriptive terms are **"The Exogenous Macro-Structure Problem"** or **"Unexplained Collective Boundary Conditions."** You could also effectively frame it as **"Methodological Individualism's Explanatory Gap"** or highlight its relationship to critiques of **generative sufficiency**.

  **In your seminar:** Clearly define the logical structure as above. Contrast it sharply with both proper auxiliary hypotheses and stronger forms of illicit holism. Emphasise that this is less about malice and more about a common modelling shortcut that inadvertently exposes a tension within the individualist programme when applied to phenomena deeply embedded in pre-existing social contexts. Ask your students to be vigilant for this "explanatory double-entry bookkeeping" – where the macro pattern appears as both the output of the ledger and the unexplained capital used to balance it. It's a powerful illustration of how difficult it is to fully escape the context of collective social facts, even when explicitly trying to deny their causal autonomy.
