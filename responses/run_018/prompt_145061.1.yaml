answer: |-
  ### Operational Decision Procedure for Mechanistic Identity

  **Philosophical Foundation**: Mechanistic identity requires organizational continuity (entities/activities mapping) and stability of counterfactual dependencies under intervention. Component correspondence and functional profile are secondary indicators but insufficient alone.

  **Procedure** (ordered sequence; 4 tests, max 6):  
  1. **Functional Profile Test**:  
     - *Question*: Does the anomaly exhibit an identical error-signature profile (outputs, timing, symptoms) to the catalogued mechanism?  
     - *Yes*: Proceed to Test 2.  
     - *No*: Stop → Full investigation.  
     - *Ambiguous*: Hand-off to human judgment (risk tolerance on functional severity).  

  2. **Component Correspondence Test**:  
     - *Question*: Do ≥80% of critical physical/logical components (or their direct functional equivalents) participate in the failure?  
     - *Yes*: Proceed to Test 3.  
     - *No*: Stop → Full investigation.  
     - *Ambiguous*: Hand-off (dispute over "criticality" or "equivalence").  

  3. **Organizational Closure Test**:  
     - *Question*: Is the entity-activity mapping (causal structure, spatial/temporal organization) identical, including boundaries and interaction topology?  
     - *Yes*: Proceed to Test 4.  
     - *No*: Stop → Full investigation.  
     - *Ambiguous*: Hand-off (subjective interpretation of "identical mapping").  

  4. **Counterfactual Dependency Test**:  
     - *Question*: Do interventions (e.g., component removal, input changes) yield identical failure-modification patterns?  
     - *Yes*: **Same mechanism** → Apply containment protocol.  
     - *No*: Stop → Full investigation.  
     - *Ambiguous*: Hand-off (dispute over intervention equivalence).  

  **Time-Pressured Simplifications**:  
  - **Safe to drop**: Component Correspondence (Test 2). *Rationale*: Organizational closure and counterfactuals define core identity; components may vary (multiple realizability).  
  - **Never drop**: Organizational Closure (Test 3) or Counterfactual Dependencies (Test 4). *Rationale*: These embody the philosophy of mechanistic identity.  
  - **Functional Profile (Test 1) is mandatory** but insufficient alone—it is a first-pass filter.  

  ---

  ### Application to Cases

  #### **Case 1**: Mesh-networked swarm navigation desynchronization  
  - **Test 1 (Functional)**: YES (identical error-signature).  
  - **Test 2 (Components)**: NO (peer-to-peer vs. centralized; no central controller equivalent).  
  - **Verdict**: **Stop → Full investigation** (fails Test 2).  
  - **Resistance Trigger**: Team will resist unwanted shutdown despite functional match, as architecture differs.  

  #### **Case 2**: Bio-hybrid actuator failure under thermal stress  
  - **Test 1 (Functional)**: YES (phenotypic output identical).  
  - **Test 2 (Components)**: NO (all physical components differ).  
  - **Test 3 (Organizational)**: YES (isomorphic entity-activity mapping).  
  - **Test 4 (Counterfactual)**: YES (intervention-response patterns isomorphic).  
  - **Verdict**: **Same mechanism** → Apply containment protocol (passes Tests 1,3,4; Test 2 dropped in analysis due to organizational/counterfactual match).  
  - **Resistance Trigger**: Team will resist unwanted containment due to component differences, fearing unmitigated risks.  

  #### **Case 3**: Cognitive-architecture misclassification  
  - **Test 1 (Functional)**: YES (identical misclassification pattern and representations).  
  - **Test 2 (Components)**: AMBIGUOUS (feedback loop absent; dispute over "criticality").  
  - **Hand-off**: Human judgment required at Test 2.  
  - **Judgment Outcome**: Likely "NO" due to missing feedback component → Full investigation.  

  ---

  ### Limitations and Override Conditions

  **What the Procedure Cannot Detect**:  
  1. **Emergent Mechanisms**: Novel failures arising from system-scale interactions not reducible to catalogued entity-activity mappings.  
  2. **Dynamic Adaptation**: Mechanisms evolving in real-time (e.g., learning systems) where dependencies shift post-cataloguing.  
  3. **Cross-Abstractions**: Identity across different levels of abstraction (e.g., hardware vs. software) if organizational boundaries are misaligned.  

  **Simplifications That Distort Philosophy**:  
  - Dropping Organizational Closure (Test 3) conflates structural similarity with mechanistic identity.  
  - Dropping Counterfactuals (Test 4) ignores causal dynamics, reducing mechanisms to static snapshots.  

  **When to Override the Output**:  
  1. **Override to Avoid Shutdown**: Only if all tests pass *except* Component Correspondence (Test 2), and human judgment confirms organizational/counterfactual identity.  
  2. **Override to Force Investigation**: If external data (e.g., field incidents) reveals latent risks not captured in tests, even if all tests pass.  
  3. **Never Override**: Ambiguous hand-offs—disputes must be resolved by senior risk officers, not engineers.  

  **Final Directive**: Use this procedure to anchor decisions in mechanistic philosophy while acknowledging its constraints. When in doubt, default to full investigation—asymmetric stakes favor caution against novel threats.
