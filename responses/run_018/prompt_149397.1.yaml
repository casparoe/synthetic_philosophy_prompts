answer: |-
  Here’s a structured seminar plan focusing on logical dependencies, sequenced misconceptions, and your core pedagogical requirements:

  ---

  ### **Conceptual Sequence & Dependencies**  
  *(Total: 70 minutes)*  

  1.  **Review: Principle of Utility & Pleasure Calculus (15 min)**  
      - *Why first?* The entire argument rests on Bentham’s consequentialist framework.  
      - *Key dependency:* Students must reactivate understanding that **moral evaluation = net pleasure/pain balance** (including intensity, duration, certainty, fecundity, purity).  
      - *Exercise:* Quick hypothetical (e.g., "Should we ban chocolate?") requiring utility calculation.  

  2.  **Introduce the Is/Ought Gap: "Unnatural" as a Category Error (20 min)**  
      - *Why before examples?* Prevents contamination by moral intuitions.  
      - *Sequence:*  
        a. Define "unnatural" strictly as *physical description* (e.g., "biologically non-reproductive," "statistically rare").  
        b. Contrast with *moral evaluation* ("wrong," "harmful").  
        c. **Core Example: Eating Insects**  
          - *Must include:* Physical act (consuming non-human organisms), cultural disgust, absence of measurable harm.  
          - *Must exclude:* Sexuality, bodily fluids, religious taboos (avoids triggering conflation).  
          - *Why it works:* Disgust is palpable but demonstrably disconnected from harm; separates observer’s antipathy from victim’s suffering.  

  3.  **Abstract Application to Non-Procreative Sex (15 min)**  
      - Frame generically: "Acts incapable of reproduction."  
      - Map the category error:  
        - Physical fact: No conception possible → *not inherently* "harmful."  
        - Moral claim requires proof of *net pain* (link to Step 1).  

  4.  **Antipathy ≠ Evidence of Harm (10 min)**  
      - Use "insect-eating" example again: Disgust ≠ proof of harm to eater.  
      - Extend to sexuality: Observer’s revulsion is irrelevant to utility calculus *unless it causes secondary harms* (e.g., social stigma → pain).  
      - *Dependency:* Requires prior understanding that only pleasure/pain *experienced by affected parties* counts.  

  5.  **Burden of Proof & Reproductive Teleology (10 min)**  
      - Stress: Critics must prove *diminished utility*, not deviation from "purpose."  
      - Contrast: "Purpose" (teleology) vs. "Consequence" (utility).  
      - **Now introduce paederasty** (Bentham’s test case):  
        - *After structure is secure:* Students can analyze it through utility framework, not visceral reactions.  
        - Focus: Does evidence show *net pain* for consenting parties? (Bentham’s "no").  

  ---

  ### **Predictable Misconceptions & Defusal Points**  
  *(Integrated into sequence)*  

  1.  **"Bentham licenses any pleasure!"**  
      - *When:* During Step 1 (calculus review).  
      - *Defusal:* Emphasize **fecundity/purity** (long-term consequences). Ask: "Would Bentham endorse heroin use? Why not?"  

  2.  **"He denies psychological harm!"**  
      - *When:* Step 4 (antipathy discussion).  
      - *Defusal:* Clarify: Psychological pain (e.g., shame from stigma) *is* counted. The error is mistaking *third-party* disgust for *participant* harm.  

  3.  **"Morality collapses to preference!"**  
      - *When:* Step 2 (is/ought gap).  
      - *Defusal:* Distinguish *subjective experience* of pleasure/pain (which Bentham accepts) from *subjective moral opinions* (which he rejects unless grounded in utility).  

  4.  **"He just inverts ‘natural’!"**  
      - *When:* Step 5 (teleology critique).  
      - *Defusal:* Contrast: Rejecting teleology ≠ claiming "unnatural=good." Utility is neutral to origins; only consequences matter.  

  ---

  ### **Understanding Check**  
  *(5 min)*  

  - **Question:** *"Bentham argues that we should legally permit ______ [insert bizarre but harmless act, e.g., adults voluntarily tattooing each other’s names on their foreheads]. His justification depends entirely on proving what? And what would be an insufficient justification?"*  
    - *Tests for:*  
      - Rejection of "unnatural" as moral argument (insufficient).  
      - Burden of proof on net utility (sufficient).  
      - Antipathy irrelevance.  

  ---

  ### **Historical Material to Exclude**  
  *(Mention but do not explore)*  
  - **Omit:** The essay’s legal context (e.g., sodomy laws), Bentham’s secrecy about writing it, and 20th-century publication history.  
  - **Why:** Focus is on *logical structure*, not historical reception. These elements risk:  
    - Distracting with "Bentham as rebel" narratives.  
    - Implying the argument’s validity depends on cultural context.  
    - Shifting discussion to censorship vs. philosophy.  

  ---

  ### **Timing Summary**  
  - Review & Calculus: 15 min  
  - Is/Ought Gap & Core Example: 20 min  
  - Abstract Sex Application: 15 min  
  - Antipathy & Burden of Proof: 20 min  
  - Check & Conclusion: 5 min  
  - *Buffer/Q&A:* 5 min  

  This sequence ensures each layer depends on the prior, inoculates against predictable errors, and isolates Bentham’s logic from emotional reactions. The insect-eating example acts as a "neutral training ground" for disentangling description/evaluation before tackling charged topics.
