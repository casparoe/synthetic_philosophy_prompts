answer: |-
  Below is your tactical Q&A prep sheet, structured by stakeholder group, ordered by likelihood and potential damage. Each objection is phrased as the camp would ask it, followed by your response strategy.  

  ---

  ### **1. Climate Economists: Implementation Consistency**  
  **Objection Phrasing:**  
  *"If we apply a zero discount rate within lives but a positive rate across generations, won’t this create dynamic inconsistency in cost-benefit models? For example, a project benefiting people in 2070 might be valued differently today depending on whether those beneficiaries are framed as ‘within’ or ‘beyond’ the current generation’s lifespan. How do we avoid arbitrage or model instability?"*  

  **Your Response Strategy:**  
  - **Concede:** Model calibration is complex; boundary effects require careful handling (e.g., age stratification in population cohorts).  
  - **Hold at All Costs:** The generational boundary is non-arbitrary—it’s defined by the *cessation of overlapping agency* (no shared lived experience, planning, or care obligations).  
  - **Weakest Point:** Why 25–30 years isn’t just an arbitrary cutoff. Prep defense: Cite demography (avg. intergen gap = 25–30 yrs) and moral psychology (loss of "self-extension" beyond one’s biological horizon).  
  - **Concise Reply (2-min):**  
    > "Dynamic consistency is preserved by tethering the discount rate shift to *cohort boundaries*, not calendar years. When modeling, treat welfare streams as pooled within generations (0% pure discount) but apply a positive rate *only* to benefits/costs impacting *distinct future cohorts*. For example, climate damage in 2060: if current 20-year-olds will experience it, discount at 0%; if only their unborn children will, apply a positive rate. Calibration uses actuarial data to assign probabilities of cohort overlap."  

  **Likely Follow-up:**  
  *"How do you operationalize ‘distinct cohorts’ in probabilistic models where lifespans overlap unevenly?"*  
  **Defense:** Use age-stratified survival probabilities (e.g., benefits flowing >30 years from now have <1% chance of overlapping with today’s 50-year-olds).  

  ---

  ### **2. Moral Philosophers: Temporal vs. Spatial Asymmetry**  
  **Objection Phrasing:**  
  *"Your asymmetry relies on privileging time over space. If I have equal obligations to strangers in Bangladesh (spatially distant) as to neighbors, why don’t I owe equal concern to strangers in 2124 (temporally distant)? Isn’t this just ‘mere location in time’ bias?"*  

  **Your Response Strategy:**  
  - **Concede:** Both spatial and temporal separation reduce *empathy*, but only temporal separation breaks *diachronic unity*.  
  - **Hold at All Costs:** The self’s temporal stages are bound by *identity-constituting commitments* (e.g., retirement planning), while no such unity exists between generations.  
  - **Weakest Point:** Why narrative identity imposes stronger obligations than shared humanity. Prep defense: Appeal to *relational autonomy* (I legislate for my future self; I don’t legislate for strangers).  
  - **Concise Reply (2-min):**  
    > "Spatial distance doesn’t dissolve the *synchronic* obligations of impartial justice. But temporal distance dissolves *diachronic* obligations of self-governance. My future self is part of my agency horizon—I author her burdens. Future generations author their own; our duty is distributive fairness (avoid depriving them of resources), not self-sacrifice. Time isn’t ‘mere location’—it’s the dimension of *agency continuity*."  

  **Likely Follow-up:**  
  *"Doesn’t Parfit’s non-identity problem undermine duties to future generations anyway?"*  
  **Defense:** "Non-identity affects *harm* but not *fairness*. We owe them a just allocation of natural capital, regardless of who they are."  

  ---

  ### **3. Policy Analysts: Operational Cutoffs**  
  **Objection Phrasing:**  
  *"In Treasury models, we need clear thresholds. Is your ‘generational boundary’ a fixed 30-year window? What about a 55-year-old policymaker planning for her own 85th birthday vs. her grandchild’s birth? Do we need two discount rates running concurrently?"*  

  **Your Response Strategy:**  
  - **Concede:** Individual boundary perception varies; policy needs a standardized proxy (e.g., 25–30 years).  
  - **Hold at All Costs:** The cutoff must be *generation-wide*, not individual. Shift the rate when *no living person* will experience the benefit/cost firsthand.  
  - **Weakest Point:** Risk of politicizing the cutoff. Prep defense: Use UN demographic definitions (cohorts of ~30 yrs) to objectify.  
  - **Concise Reply (2-min):**  
    > "Use a fixed generational interval (e.g., 28 years) as a proxy for *non-overlap*. For costs/benefits within the lifespan of today’s youngest cohort (e.g., < age 100), apply 0% pure discount. Beyond that, apply a positive rate. Yes, this means two rates operate: 0% for impacts pre-2120, then (e.g.) δ=0.5% post-2120. SC-CO₂ models already handle time-varying rates."  

  **Likely Follow-up:**  
  *"Won’t this incentivize delaying costs to just beyond the cutoff?"*  
  **Defense:** "That’s a failure of *political* design, not discounting. Solve it with policy constraints (e.g., carbon budget caps)."  

  ---

  ### **☢️ Nuclear Option: Policy Analyst Question**  
  **The Question You Hope Nobody Asks:**  
  *"If we accept your view, doesn’t it license postponing *all* climate costs to future generations—say, via geoengineering—since they’re ‘separate agents’? How is this not intergenerational buck-passing?"*  

  **Why It’s Dangerous:**  
  Implies your asymmetry collapses into presentism; suggests moral bankruptcy.  

  **Survival Strategy:**  
  1. **Concede:** The framework *allows* postponement but doesn’t *endorse* it.  
  2. **Reframe:** Highlight scarcity constraints:  
     > "Postponement is constrained by distributive fairness. If we shift costs, we must compensate by increasing savings (e.g., capital transfers). Just as you can’t steal from a stranger, you can’t impose net costs on future agents without violating reciprocity."  
  3. **Pivot to Policy:**  
     > "This is why we need *capital preservation rules* (e.g., Hartwick’s Rule for natural resources) alongside discounting. Asymmetry prevents *self-sacrifice*; it doesn’t permit *theft*."  

  ---

  ### **Summary: Tactical Priorities**  
  1. **Economists:** Focus on *model feasibility*. Stress cohort-based calibration.  
  2. **Philosophers:** Defend *agency discontinuity* as the crux. Contrast with spatial justice.  
  3. **Policy Analysts:** Offer a *workable threshold* (25–30 yrs) and deflect fairness concerns to capital rules.  
  4. **Nuclear Defense:** Always tether cost-shifting to *compensatory savings* to avoid "parochialism" accusations.  

  **Final Tip:** If cornered, say: *"This isn’t discounting the future—it’s calibrating obligations to agents who exist in relationships we don’t share."*
