answer: |-
  Your analysis captures the core tensions brilliantly. Let's break down both frameworks in your stratified statue scenario, evaluating their handling of persistence through internal erosion and replacement:

  **1. Baker's Constitution View:**
  *   **Initial State:** At t1, the statue (S1) is constituted by the original lump of clay (L1) occupying region R. S1 and L1 are numerically distinct coincident objects. S1 has historical/artistic properties L1 lacks.
  *   **Erosion & Replacement:** Over time, internal strata erode. Water, resin, and mineral deposits fill the void. At t2, the carved shell remains, but the matter occupying R is now a complex composite: remnants of L1's outer shell + eroded particles/minerals + conservation resin + water deposits (call this M2).
  *   **The Dilemma:**
      *   **Option A (Statue Ceases):** If constitution requires *the same constituting object* (L1), then once L1 is sufficiently diminished/destroyed (its internal strata gone, its identity arguably lost), S1 ceases to exist. What exists at t2 is a *new* statue (S2) constituted by M2. This raises the "arbitrary cutoff" problem: *When* exactly does L1 cease to exist as the constituting entity? Is it 51% eroded? When the core vanishes? The cutoff seems metaphysically arbitrary.
      *   **Option B (Statue Persists?):** Baker *could* argue that S1 persists as long as *some* of the original constituting matter (L1) remains, crucially within the *functional structure* provided by the carved shell. However, this leads to the "proliferation problem": As matter continuously changes (erosion, deposition), the constituting entity changes. If M2 constitutes S1 at t2, but M2 is distinct from L1 (which constituted S1 at t1), then either:
          *   S1 has survived a change in its constituting entity (which Baker's strict constitution relation might not easily allow without becoming a dominance view), or
          *   We have a succession of slightly different constituting entities (L1, M1.1, M1.2, ..., M2) each constituting a slightly different statue (S1, S1.1, S1.2, ..., S2) coinciding with the carved shell over time. This massively multiplies entities – for every tiny material change, new coincident objects.
  *   **Baker's Challenge:** Her view struggles to give a principled account of the statue's persistence *without* invoking some criterion of form or functional continuity *independent* of the persistence of the original constituting matter. The core problem is that the original matter (L1) is largely gone, yet the form persists. Constitution relies heavily on the *identity of the constitutor*, which is undermined here.

  **2. Dominance-Based Hylomorphic View:**
  *   **Initial State:** At t1, there is one entity: the statue. The clay is not a separate object; it is the matter *informed* by the statue's substantial form. The "clay" properties are suppressed by the dominant "statue" form.
  *   **Erosion & Replacement:** As internal strata erode and are replaced, the *substantial form remains dominant* as long as the external shell maintains its structural integrity, representational function, and aesthetic properties. The form organizes whatever matter is present within its structure to serve the function of being *this statue*.
  *   **Persistence:** The statue persists at t2. Persistence depends entirely on the continuity of the dominant substantial form and its functional/aesthetic realization, *not* on the persistence of the original internal matter. The matter is subservient to the form. The replacement of internal material (even with resin) is irrelevant to the statue's identity as long as it doesn't disrupt the form's dominance (e.g., by collapsing the shell or destroying its appearance/function). Continuity of the *form* (understood as the dynamic principle organizing matter for a specific function/purpose within the shell) is key.

  **Evaluation: Coherence through Partial Replacement**

  1.  **Addressing Baker's Problems:** The dominance view elegantly avoids both the arbitrary cutoff and the proliferation problems:
      *   **No Arbitrary Cutoff:** There is no need to decide "how much original matter must remain." The question is irrelevant. Only the continuity and dominance of the form matter.
      *   **No Proliferation:** There is only ever one primary entity – the statue – identified by its form. Changes in matter do not generate new coincident objects or a succession of statues; they are merely changes in the (largely backgrounded) material constituents *of* the persisting statue. Ontology remains lean.

  2.  **The Challenge of Form-Continuity:** You rightly identify the potential vulnerability: **Is "form-continuity" itself vague?** Yes, it can be.
      *   **Nature of the Vagueness:** The vagueness concerns *when* the dominant form is disrupted enough to constitute a cessation of the statue. Is it a single crack? Significant warping? Complete internal collapse filled with resin? Loss of recognizable features? This is analogous to vagueness in defining "same function" or "sufficient structural integrity."
      *   **Contrast with Baker:** Crucially, this is a *different kind* of vagueness than Baker faces:
          *   **Baker's Vagueness:** Is *ontological*. It concerns *how many objects exist right now* (Is there *still* a lump coinciding? Which lump/statue is it?) and *when one object ceases and another begins* during gradual change. It directly multiplies entities.
          *   **Dominance View Vagueness:** Is primarily *metaphysical/epistemic* concerning the *persistence conditions* of a *single* entity. It asks: *Has*this one statue ceased to exist due to damage? We know *what* entity we are tracking (the statue defined by its form/function), but its temporal boundaries might be fuzzy. It doesn't create new coincident entities at a single time.

  **Conclusion: Which Framework is More Coherent?**

  *   **The dominance-based hylomorphic view provides the more coherent account of persistence through partial internal replacement in this scenario.**
  *   **Why:** It directly addresses the core intuition that the statue persists *because* its defining form, function, and appearance remain intact within the carved shell, regardless of internal material substitution. It avoids the ontological explosion and arbitrary matter-based persistence thresholds plaguing Baker's view.
  *   **Baker's View:** Struggles fundamentally because its core commitment – that constitution requires a distinct, persisting *constituting entity* – is undermined when that very matter is removed. It's forced into choosing between the statue ceasing (with an arbitrary point of cessation) or an implausible proliferation of statues/constituting entities.
  *   **Vagueness Trade-off:** While the dominance view faces vagueness in defining the precise boundaries of form-continuity, this is arguably a less severe problem. It's the kind of vagueness inherent in defining the persistence conditions of any complex functional artifact (e.g., "When is a ship no longer the Ship of Theseus?"). Crucially, this vagueness does not lead to an ontology cluttered with coincident objects at a single time or successive entities during gradual change. It maintains a single, unified entity whose persistence depends on the stability of its defining organization and function – precisely what seems relevant in this artistic/conservation context.

  **In essence:** The scenario highlights that for artifacts like statues, persistence seems tied more to the continuity of their *form and function* than to the continuity of their *original matter*, especially when the matter supporting that form changes internally while the form-defining structure remains. The dominance view explicitly builds this priority of form into its ontology, providing a leaner and more intuitive account. Baker's view, by insisting on distinct coincident entities tied to specific matter, struggles to accommodate this without significant cost. The dominance view doesn't necessarily *smuggle in* vagueness; it correctly identifies form-continuity as the relevant (if sometimes fuzzy) criterion for artifact persistence, avoiding the more problematic ontological commitments of coincidence.
