  **MEMORANDUM**

  **TO:** Joint Research Ethics Board  
  **FROM:** Dr. E. Vance, Senior Policy Advisor (Ethics & Governance)  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposal J-2024-09 - Center for Secular Bioethics / Mercy Covenant Health Network Partnership  

  **1. Introduction**  
  This memorandum addresses Proposal J-2024-09, outlining a five-year collaborative research partnership between the Center for Secular Bioethics (CSB) and Mercy Covenant Health Network (MCHN). The proposal requires reciprocal compromises: CSB must incorporate formal spiritual-care metrics into clinical-trial design, relaxing its commitment to strict methodological naturalism. MCHN must permit data publication in secular venues without theological framing and allow data use for public-policy recommendations potentially conflicting with Church teaching, relaxing its doctrinal oversight. This analysis evaluates the proposal's ethical legitimacy and institutional risks, categorizes the nature of the compromise, and provides a concrete recommendation.

  **2. Brainstorm: Key Ethical Dimensions**  
  *(1) Gains from Trade / Legitimate Compromise:*
  *   **Mutual Epistemological Enrichment:** The collaboration enables each institution to access domains of value and understanding typically outside its framework. CSB gains validated tools to measure a significant dimension of patient experience (spiritual well-being) impacting health outcomes, enriching its understanding of "holistic care." MCHN gains access to rigorous naturalistic methodologies and broader dissemination, potentially strengthening the empirical basis for aspects of its care model within a pluralistic society.
  *   **Enhanced Patient-Centric Value:** The partnership could generate unique insights into integrated care models, potentially leading to interventions that better serve diverse patient populations by respecting both evidence-based medicine and spiritual needs, thereby fulfilling a shared, higher-order commitment to patient welfare that transcends their foundational differences.

  *(2) Risks of Corruption / Axiological Dilution:*
  *   **CSB: Erosion of Methodological Integrity:** Incorporating spiritual metrics *as formal variables* risks blurring the line between empirical observation and theological claims within CSB's core research function. This could undermine the Center's foundational commitment to naturalistic explanation, potentially legitimizing non-falsifiable concepts within scientific methodology and alienating its secular academic constituency.
  *   **MCHN: Complicity & Doctrinal Drift:** Permitting data generated under its auspices to be used for policy recommendations conflicting with Church teaching creates significant complicity concerns. This risks violating MCHN's fidelity to its religious mission and identity, potentially leading to internal schism, loss of trust from its faith community, and a perception that core doctrines are negotiable for secular acceptance or funding.

  **3. Analysis: Integrative vs. Transactional Compromise**  
  This proposal is best understood as a **Transactional Compromise**. The core normative frameworks of both institutions – CSB's methodological naturalism and MCHN's faith-based doctrinal governance – remain fundamentally intact. The agreement does not seek to synthesize a new, hybrid framework (Integrative Compromise). Instead, it establishes clear, bounded exchanges across their normative boundaries: CSB *temporarily adopts* specific spiritual metrics as research tools, while MCHN *temporarily suspends* its control over downstream data interpretation and policy application for the *specific datasets* generated under this agreement. The integrity of each institution's foundational worldview is theoretically preserved, operating in parallel for the purpose of a targeted exchange of resources (methodology, data access, patient cohorts).

  **4. Recommendation & Time Frame**  
  **Recommendation: Approve with Binding Conditions.**  
  **Time Frame: 12-Month Pilot Phase with Mandatory Review Gates.**  

  Approval is recommended based on the potential for significant gains in understanding holistic care and serving diverse patient populations through a structured, transactional exchange. However, the identified risks of axiological dilution for both parties are substantial and necessitate robust safeguards implemented through a limited pilot phase. The 12-month timeframe allows for concrete project initiation, data collection initiation, and early assessment of the compromises in practice, without locking either institution into a long-term arrangement before viability and adherence to safeguards are confirmed.

  **5. Binding Conditions for Pilot Phase:**
      1.  **Pre-Defined Spiritual Metrics:** The specific spiritual-care metrics to be incorporated into CSB trials must be explicitly defined, operationally validated for reliability and relevance to health outcomes *without* presupposing theological truth claims, and formally agreed upon by both parties *before* any trial enrollment. This list cannot be expanded during the pilot.
      2.  **Publication & Data Use Protocol:** A detailed, binding protocol governing publication and data use must be established. It must include:
          *   Clear definitions of "secular framing" acceptable to MCHN (e.g., descriptive reporting of patient-reported experiences).
          *   A pre-publication review mechanism allowing MCHN to *identify factual inaccuracies* related to its practices or data, but *not* to veto publication based on lack of theological framing or potential policy implications. CSB retains final editorial control over publications.
          *   A formal, documented process for MCHN to publicly *disassociate* itself from specific public-policy recommendations derived from the data that conflict with Church teaching, to be invoked *only* after such recommendations are formally proposed using the project data.
      3.  **Robust Oversight:** A dedicated subcommittee of the JREB (with equal representation from secular and religious ethics expertise, plus an independent chair) must be formed to actively monitor compliance with these conditions, review all pilot-phase publications/data uses, and assess adherence to the transactional compromise boundaries.
      4.  **Mandatory Gate Review:** At the 9-month mark, a comprehensive review will be conducted by the JREB subcommittee. Continuation beyond the 12-month pilot requires explicit re-approval based on this review, assessing: adherence to conditions, management of conflicts, evidence of mutual benefit without unacceptable dilution, and the feasibility of continuing the transactional model.

  **6. Addressing the Strongest Counter-Argument**  
  The strongest argument against approval, particularly concerning CSB, is the **risk of methodological corruption**. Critics rightly argue that formalizing spiritual metrics within CSB's naturalistic research paradigm inherently blurs epistemic boundaries. It risks granting ontological legitimacy to concepts (e.g., "divine presence," "sacramental efficacy") that fall outside naturalistic explanation, potentially undermining the Center's core intellectual identity and scientific credibility. This is not merely procedural; it strikes at the heart of CSB's raison d'être. While the transactional model aims to contain this risk via strictly operationalized metrics, the concern remains valid: the very act of incorporating these variables, however carefully defined, represents a symbolic and practical concession that could normalize similar compromises in the future and create internal tension regarding the Center's fundamental epistemological commitments. The pilot phase and strict metric definition are designed to test and contain this risk, but its gravity is acknowledged.

  **7. Conclusion**  
  Proposal J-2024-09 presents a high-risk, high-reward opportunity for valuable research at the intersection of secular and religious approaches to health. Framed as a transactional compromise with clear boundaries, it offers a pathway to mutual gain without demanding fundamental integration of incompatible worldviews. However, the risks of axiological dilution, particularly for CSB's methodological integrity and MCHN's fidelity to doctrine, are profound. Approval is therefore strictly contingent on the binding conditions and the structured 12-month pilot phase with its mandatory review gate. This approach allows the potential benefits to be pursued while providing a clear off-ramp if the compromises prove unworkable or corrosive to either institution's core mission.

  **Respectfully submitted,**
  Dr. E. Vance

