  4. **The Real Headache:** The punchline isn't "thermostat feels," but the bureaucratic and ethical nightmare of applying a sharp line ("consent for setpoints?") to a continuous scale where tiny differences lack clear ontological significance.  
  5. **Chair’s Breakdown:** Her frustration mirrors the real intellectual agony – declaring a line *necessary* while being unable to defend its precise location against marginal cases.
