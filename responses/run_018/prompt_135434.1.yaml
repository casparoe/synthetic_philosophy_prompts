answer: |-
  ## Proposal: Modular Agents and the Fragmentation of Indirect Normativity

  **Core Question:** Does indirect normativity retain conceptual distinctiveness when we model the ideal deliberator as a modular architecture of semi-autonomous reasoning subsystems, or does it collapse into direct normativity applied locally within modules?

  **Problematic:** Indirect normativity – norms prescribing that agents ought not to directly deliberate about certain considerations (e.g., consequentialist outcomes) when acting, instead relying on rules, dispositions, or heuristics – is central to responses to puzzles demanding commitment (e.g., Kavka's Toxin Puzzle) and critiques of direct maximizing (e.g., rule consequentialism, pragmatism about morality). The dominant framing assumes a single, unified agent who either succeeds or fails in adopting the indirect strategy. This proposal challenges that unity. It posits that ideal deliberation might intrinsically involve distinct, specialized reasoning modules (e.g., "Commitment Module," "Consequentialist Calculator," "Rule Applier," "Social Perception Engine") operating with limited information exchange ("firewalls"). These firewalls are not merely psychological limitations to be overcome but are constitutive features of the *normatively ideal* deliberative architecture. The central puzzle is whether the rationale for indirect norms persists in this fragmented model. Does compartmentalization itself *constitute* indirect normativity, or does it merely relocate direct normativity, rendering the traditional indirect/direct distinction obsolete? Existing accounts (e.g., Gauthier, McClennen, Bratman on planning; rule vs. act consequentialism) presuppose agent unity or treat fragmentation as suboptimal. They thus leave unexplored whether the *normative necessity* of firewalls in an ideal agent alters the landscape of indirect normativity.

  **Proposed Model: The Modular Ideal Deliberator (MID)**
  1.  **Core Components:** MID comprises multiple, functionally specialized reasoning subsystems ("modules"). Each module:
      *   Possesses a specific input domain (e.g., immediate perceptual data, long-term causal models, stored rule-sets, social signals).
      *   Operates according to its own, potentially distinct, internal reasoning procedure (e.g., pattern-matching, expected utility calculation, deontic constraint checking).
      *   Has constrained output channels, influencing specific downstream modules or action-selection mechanisms.
      *   Features regulated information flow ("firewalls"). Crucially, these firewalls are *normatively mandated*; breaching them is deliberatively defective *even for an ideal agent*, not merely practically difficult.
  2.  **Normative Firewalls:** The inability of Module A to access the full reasoning process or proprietary data of Module B is not a bug but a feature. This architecture prevents specific types of deliberative failure inherent to unified models (e.g., commitment-undermining calculation, paralyzing information overload, rule-circumventing rationalization). The ideal agent *is* compartmentalized.

  **Conceptual Framework:**
  *   **Indirect Normativity (Standard):** A norm N prescribes action A, but the ideal agent follows N *without* deliberating about the ultimate justification for N (e.g., its consequences) at the time of acting. N mediates between ultimate values and action.
  *   **Direct Normativity:** The ideal agent deliberates directly about the ultimate justificatory considerations (e.g., consequences, principles) to determine action A.
  *   **Indirect Normativity under MID:** The question becomes whether norms can meaningfully be "indirect" *within* this architecture. Possibilities include:
      *   *Module-Specific Indirectness:* A module might have internal indirect norms (e.g., a "Rule Applier" module follows stored rules without recalculating their basis).
      *   *Architectural Indirectness:* The *firewall structure itself* enforces indirectness by preventing certain modules from accessing the reasoning grounds of others. The "indirectness" resides in the inter-module relations.
      *   *Collapse Thesis:* Each module is directly responsive to its specific inputs and internal norms. What appears as indirectness from an external perspective is merely different modules directly applying their local norms. The overall architecture implements a complex direct normativity.

  **Methodology:** Conceptual Modeling & Case Study.
  1.  **Construct the MID Model:** Precisely define a minimal but plausible MID architecture relevant to commitment problems, specifying modules, firewalls, and internal procedures.
  2.  **Reframe the Toxin Puzzle:** Recast the classic Toxin Puzzle as an *inter-module conflict* within MID. The "intention to drink" resides in a Commitment Module (CM) triggered by a prior credible signalling act. The Consequentialist Calculator (CC) subsequently determines that drinking yields negative utility. The firewall *prevents* the CC's output from being fed back to override the CM's pre-commitment. Does the firewall *itself* constitute an indirect norm ("Don't recalculate commitment-breaking consequences")? Or is the CM simply directly following its rule ("Execute pre-committed intentions")? Analyze whether describing the firewall's normative role requires irreducible reference to indirectness, or if it can be fully explained as CM directly following its local norm plus a structural constraint.
  3.  **Comparison with Two-Level Consequentialism:** Contrast the MID solution to the toxin puzzle with a standard two-level consequentialist (e.g., Hare-style) solution. Does MID offer a distinct *explanation* for why the agent drinks the toxin, avoiding the standard "disposition vs. act" tension? Does the mandated firewall do explanatory work that a unified agent's disposition cannot?
  4.  **Explanatory Power Test:** Identify a specific normative phenomenon or explanatory gap in the unified agent model concerning indirect normativity. Does the MID model, with its constitutive firewalls:
      *   Provide a *better explanation* of the phenomenon?
      *   Reveal the phenomenon as an artifact of imposing unity on a fragmented architecture ("preference fragmentation")?
      *   Or, does it simply redescribe the same phenomenon using different terms ("direct normativity with extra steps") without adding normative insight?
  5.  **Normative Payoff Assessment:** Determine if any residue from the analysis points to a genuinely distinct *normative* category (architectural indirectness) or merely highlights descriptive psychological complexity managed by direct local norms.

  **Scope and Feasibility:**
  This project is ambitious but feasible within one semester and 6000 words. The core task is rigorous conceptual modeling and comparative analysis focused on one central case study (the Toxin Puzzle) and one major comparison (Two-Level Consequentialism). It requires deep engagement with the logic of indirect normativity and agent structure, but avoids exhaustive historical surveys or tackling multiple unrelated puzzles. The modular framework provides a clear lens, and the Toxin Puzzle offers a sufficiently rich and focused testbed.

  **Clear Failure Conditions:**
  The project demonstrably fails if:
  1.  **Reducibility:** The MID model and its mandated firewalls are conclusively shown to be fully reducible to, and normatively indistinguishable from, a standard model of a unified agent with complex internal states (e.g., partitioned preferences, multiple time-slices, complex dispositions) coupled with pragmatic constraints. If "architectural indirectness" adds no unique normative insight beyond "direct normativity + psychological limitations," the core thesis collapses.
  2.  **No Explanatory Advantage:** The analysis reveals no significant explanatory advantage of the MID model over existing unified-agent accounts of indirect normativity in resolving the target problem (e.g., the Toxin Puzzle). If the modular framing doesn't yield new normative understanding or resolve existing tensions, its value is questionable.
  3.  **Conceptual Collapse:** The investigation concludes that within the MID framework, the distinction between direct and indirect normativity loses all conceptual purchase; all normative prescriptions are necessarily direct relative to their specific module's operation and inputs.

  **Conclusion:** This proposal investigates whether the conceptual foundations of indirect normativity are fundamentally altered when the ideal deliberator is modeled as intrinsically modular with normatively mandated information firewalls. By reframing a paradigmatic puzzle (Toxin) as inter-module conflict and contrasting it with the standard two-level approach, it aims to determine if compartmentalization preserves, transforms, or eliminates the distinctiveness of indirect normative phenomena. Success means revealing a novel normative dimension (architectural indirectness) or conclusively showing its reducibility.
