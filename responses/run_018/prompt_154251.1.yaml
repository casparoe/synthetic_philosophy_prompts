answer: |-
  The methodological asymmetry you describe rests on an implicit **dualist epistemology of traces**, distinguishing between:

  1.  **Testimonial Traces (Texts):** Treated as *mediated communicative acts*, inherently subject to authorial intention, bias, deception, and cultural framing. Rigorous "source criticism" is applied because the trace is understood as a *message from a past agent*.
  2.  **Causal Traces (Material Evidence):** Treated as *direct physical residues* of past events/processes, lacking intentional communication. Uncertainty is seen as arising solely from *technical limitations* (preservation, sampling, measurement error) or *interpretive complexity*, not from deceptive intent. The trace is seen as a *passive effect*.

  **Precise Reconstruction of the Implicit Theory:**

  1.  **Epistemic Privilege of Causal Continuity:** The core presupposition is that chains of physical causation (e.g., radioactive decay, stratigraphic superposition, ceramic degradation) provide a *more direct and inherently more reliable* connection to the past than human testimony. This physical continuity is seen as less prone to *systematic epistemic distortion* than cultural transmission and intentional communication.
  2.  **Authorial Intent as the Source of Fallibility:** Texts are suspect *because* they have an author with motives, perspectives, and the capacity for error or deceit. Material traces, lacking an intentional author, are presumed free from this specific kind of distortion. The only "agency" involved is the contemporary archaeologist/scientist, whose errors are technical, not testimonial.
  3.  **Material as "Given," Text as "Constructed":** The material record is implicitly framed as a pre-existing, objective "given" that theories must *fit*. Texts are seen as constructed narratives that theories must *interrogate* and *decode*. The material is the constraint; the text is the puzzle.
  4.  **Nature vs. Culture Dichotomy:** The asymmetry leans on a deep-seated (though often unexamined) distinction between the "natural" (physical processes providing causal traces) and the "cultural" (human communication providing testimonial traces). The "natural" trace is granted greater objectivity.

  **Is the Asymmetry Entailed or Conventional?**

  *   **Not Strictly Entailed:** The distinction is *not* an inevitable consequence of the nature of texts vs. artifacts. It is primarily a **disciplinary convention rooted in historical development and practical realities**, compatible with rival epistemologies.
      *   *Texts as Material Artifacts:* A manuscript or inscription is *also* a physical object, subject to the same issues of preservation, contamination, and recovery bias as a pot sherd. Its meaning is mediated by material form, scribal error, and transmission history *before* authorial intent is even considered.
      *   *Material Traces as "Testimony":* Material culture *is* a form of communication and embodiment of intentionality (e.g., monument building, grave goods, deliberate destruction layers). Its deposition and preservation are often the result of intentional human actions and cultural norms. Furthermore, the *process of transforming raw data (soil, charcoal, sherds) into "evidence" (a date, a typology, a sequence)* involves numerous interpretive choices, theoretical frameworks, and potential biases by archaeologists and scientists – a chain of "testimony" about the meaning of the trace.

  **Could a Uniform Critical Framework Work? (Without Skepticism)**

  Yes, absolutely. Applying a consistent critical framework to *all* traces is not only possible but increasingly recognized as necessary for robust historical understanding. This framework is **Inference to the Best Explanation (IBE) applied critically to trace formation and interpretation.**

  1.  **Treating Herodotus with "Hermeneutic Charity" (as a Trace):** This means:
      *   Analyzing the text as a *material artifact* (manuscript tradition, linguistic context).
      *   Understanding its context of production and reception *as part of the historical phenomenon*, not just a window.
      *   Recognizing its value lies not just in literal "facticity" but in revealing contemporary beliefs, ideologies, and narrative structures. The "charity" lies in taking it seriously as evidence *of something historical*, even if not a literal account.
  2.  **Treating Radiocarbon Dates as "Claims" (Requiring Testimonial Scrutiny):** This means:
      *   Critically examining the *entire chain of custody and interpretation:* sample selection (context? contamination?), lab procedures (calibration curves? known biases?), statistical reporting (confidence intervals understood?).
      *   Recognizing that a "date" is a *model-dependent interpretation* of raw data (C14 counts), influenced by theoretical choices (e.g., calibration methods).
      *   Understanding that the *archaeological context* providing the sample involves its own interpretive layers (stratigraphy interpretation, association with human activity).
  3.  **Avoiding Skepticism:** This approach does not lead to global skepticism because:
      *   It replaces naive realism with *critical realism*. We acknowledge mediation but still believe traces *constrain* possible interpretations.
      *   It seeks *convergence* and *robustness* across *independent lines of evidence* (different dating methods, textual accounts, different artifact classes, environmental data). A date is more secure if supported by typology and stratigraphy; a textual claim gains plausibility if echoed in material remains.
      *   It focuses on *degrees of confidence* and *explanatory power* rather than absolute certainty. Some traces provide stronger constraints than others, but all require critical evaluation.

  **Concrete Changes Under a Unified IBE Framework:**

  1.  **University Curricula:**
      *   **Core Methodology Courses:** Replace separate "Historical Methods" (focused on texts) and "Archaeological Methods" (focused on material) with integrated "Trace Criticism" or "Evidence in Antiquity" courses. These would teach critical evaluation of *all* data types: textual source criticism *alongside* critique of sampling strategies, dating techniques, typological classifications, and formation theory.
      *   **Theory Courses:** Emphasize philosophy of science, epistemology (testimony, IBE, underdetermination), and critical theory as applied to *all* historical disciplines.
      *   **Skills Training:** Historians learn basic stratigraphy, material culture analysis, and scientific dating principles. Archaeologists learn philology, advanced textual criticism, and historiography.
      *   **Research Design:** Teach students to design projects that actively seek *convergence* between textual and material evidence, acknowledging the strengths and weaknesses of each.
  2.  **Museum Exhibitions:**
      *   **Explicit Trace Labeling:** Labels consistently explain *what kind of trace* is being shown (e.g., "Inscription fragment, 3rd century BC copy of a 5th century BC original"; "Radiocarbon date from charcoal in this hearth: 780-520 cal BC (95% probability, IntCal20 calibration)").
      *   **Uncertainty on Display:** Timelines and reconstructions prominently feature confidence intervals, alternative interpretations, and explicitly state when dates/models are contested. Use phrases like "based on," "suggested by," "one interpretation is."
      *   **Process Transparency:** Explain *how* knowledge is derived. Show the chain: "This reconstructed pot: based on sherds found here -> typological comparison to these dated examples -> associated with this radiocarbon date -> interpreted as evidence of trade."
      *   **Contextualizing Texts:** Display texts (copies/translations) with labels explaining their nature as traces: "Herodotus, writing 50+ years later, based on oral accounts; his perspective as an Athenian influenced his portrayal of Persians."
      *   **Integrated Narratives:** Avoid sections labeled "History" (implying texts) vs. "Archaeology" (implying objects). Structure exhibits around themes/periods, using *all* available traces together, explicitly discussing points of convergence and tension.

  **Conclusion:**

  The current asymmetry is a durable disciplinary convention, not a philosophically necessary distinction. It rests on an implicit privileging of physical causal chains over human communication and a reification of the nature/culture divide. Adopting a unified framework of **critical Inference to the Best Explanation**, treating *all* knowledge of the past as mediated through traces requiring careful evaluation of their formation and interpretation chains, is both consistent and robust. It avoids skepticism by emphasizing convergence, degrees of confidence, and explanatory power. Implementing this would require a fundamental shift in training historians and archaeologists as *critics of traces* rather than specialists in specific types, and a revolution in museum practice towards transparency about the constructed nature of historical knowledge from diverse, fallible traces.
