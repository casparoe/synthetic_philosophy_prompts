prompt: |-
  ok so my world history teacher Mr. Chen grades our essays using these weird categories he never actually explains: "legend with bones," "back-projected history," "identity-event," and "cross-cultural myth." heres what hes said so far: the Trojan War is legend with bones cause Schliemann found Troy but the horse and the ten-year siege are probably made up; King Arthur is back-projected history — there mightve been a local warlord named Arturus or whatever but the knights and round table got added centuries later; the Exodus is an identity-event, he says its real for the people who experienced it but you cant verify it with outside egyptian records; and he said the Queen of Sheba story is just cross-cultural myth since ethiopia and israel both claim her but theres no neutral proof.

  now for our final he asks about the Prester John legend, specifically the version where medieval europeans believed there was a christian king in central asia and modern historians think he might actually be based on the Kerait ruler Yelü Dashi or a nestorian bishop. do you think Mr. Chen will call that back-projected history? identity-event? or legend with bones?

  im not really asking for the answer tho. i want to know what rule hes running — is it about whether archeology can back up a core event, about whether the story serves a political purpose, or about whether insiders and outsiders tell it the same way? what are the other rules that fit these four cases just as well? and which case would actually split them apart — like maybe comparing it to the japanese myth about the first emperor being descended from the sun goddess, or to the story of Hanno the navigator who mightve circled africa?

  please help me figure out his system before i write this essay lol i need to pass
reasoning: |-
  Okay, the user is trying to figure out their history teacher's grading system for essays. Mr. Chen uses four categories: "legend with bones," "back-projected history," "identity-event," and "cross-cultural myth." The student provided examples for each: Trojan War as legend with bones, King Arthur as back-projected history, Exodus as identity-event, and Queen of Sheba as cross-cultural myth. Now, they're dealing with the Prester John legend and need to understand the underlying rules.

  First, I need to analyze each category based on the examples. For "legend with bones," Schliemann found Troy, so there's archaeological evidence of a real place, but the specific events (like the horse) are unverified. That suggests it's about physical evidence supporting a core location or event, while the narrative is embellished.

  Next, "back-projected history" with King Arthur. There might have been a historical figure (Arturus), but later additions like the Round Table were projected back. So this seems to involve taking a minor historical element and expanding it with fictional details over time, often for cultural or political reasons.

  "Identity-event" is exemplified by Exodus. It's central to Jewish identity, but lacks external verification. The key here is its role in group identity, regardless of archaeological proof. The event's truth is internal to the group.

  For "cross-cultural myth," Queen of Sheba is claimed by both Ethiopia and Israel without neutral proof. This points to stories adopted by multiple cultures, leading to contested origins without evidence favoring either side.

  Now, the user's deeper need is to understand the underlying principles to apply them to Prester John. They want to know if it's back-projected history or something else. But more importantly, they need to grasp Mr. Chen's framework to categorize any historical narrative correctly.

  The student also asks about rules: archaeology, political purpose, or insider/outsider perspectives. From the examples, each category mixes these elements differently. Legend with bones has archaeology; back-projected has cultural projection; identity-event is about group identity; cross-cultural involves multiple claims without evidence.

  To test the framework, comparing to other examples like Emperor Jimmu or Hanno could help. Jimmu might be identity-event for Japan, while Hanno could be legend with bones if there's evidence of his journey but exaggerated details.

  For Prester John, it's similar to King Arthur: a possible historical basis (Yelü Dashi or a bishop) that Europeans embellished into a Christian king legend. That fits back-projected history. The user needs to articulate why by showing how the legend expanded a minor figure into a myth for European hopes during the Crusades.

  The student might also be struggling with how to apply these categories beyond the given examples. They need a clear methodology: assess evidence (archaeological vs. none), cultural purpose (identity-building vs. projection), and cross-cultural claims. By breaking down Prester John using these criteria, they can justify the category in their essay.
answer: |-
  Based on your examples, here's the likely system Mr. Chen is using, focusing on **the relationship between historical evidence and the narrative's function/development**. The key factors seem to be:

  1.  **Presence & Nature of Evidence:** Is there *any* concrete evidence (archaeological, contemporary records)? Does it support the core, the setting, or nothing?
  2.  **Narrative Function:** What purpose does the story serve *for the culture(s)* that tell it? (e.g., foundation myth, moral lesson, political legitimacy, cultural identity)
  3.  **Temporal Development:** *When* and *how* did the story develop relative to the supposed events? Was it contemporary, a later elaboration, or a projection?
  4.  **Cultural Scope:** Is the story confined to one group, or claimed/adapted by multiple groups?

  Here's how the categories break down:

  *   **Legend with Bones:**
      *   **Rule:** There is **definitive physical/archaeological evidence confirming the *core setting* or *major figures* existed**, but the *specific narrative events* attached to them are unverified, exaggerated, or mythical.
      *   **Evidence:** Strong archaeological evidence (Troy's location/stratification).
      *   **Function:** Often a foundational epic, explaining origins or cultural values through grand events.
      *   **Development:** Narrative likely develops around a kernel of truth (a conflict at that location).
      *   **Scope:** Primarily one culture's foundational story.
      *   **Examples:** Trojan War (Troy real, Horse/Siege mythical), *Hanno the Navigator* (Periplus text exists describing places/events; core journey plausible, specific details like Gorilla Island interpretation debated). *King Arthur* could *almost* fit here if a specific "Camelot" site was definitively proven *and* linked to a 5th/6th century warlord, but the evidence isn't that strong yet.

  *   **Back-Projected History:**
      *   **Rule:** A **minor, obscure, or ambiguous historical figure/event is later elaborated upon and magnified significantly**, often **centuries later**, to serve contemporary cultural, political, or religious needs. The *core figure/event existed*, but the *elaborated narrative surrounding them is a later invention*.
      *   **Evidence:** Scanty, ambiguous, or localized contemporary references to the *core* figure/event (e.g., Arturus in early Welsh chronicles). *No* evidence for the elaborated elements.
      *   **Function:** To provide legitimacy, a glorious past, moral exemplars, or national heroes for a later era.
      *   **Development:** Significant narrative development happens long *after* the core events, projecting contemporary ideals onto the past.
      *   **Scope:** Primarily one culture elaborating its own past.
      *   **Examples:** King Arthur (possible warlord -> later Medieval knightly ideal), *Emperor Jimmu* (possible early Yamato leader -> divine descendant myth codified much later for imperial legitimacy).

  *   **Identity-Event:**
      *   **Rule:** An event (often migration, liberation, revelation) that is **fundamental to a group's core identity and sense of self**, regardless of whether it can be verified by external evidence or archaeology. Its "reality" is primarily **experiential and internal** to the group.
      *   **Evidence:** Little to *no* external contemporary evidence corroborating the *event as described*. Evidence exists *within* the group's tradition (texts, rituals).
      *   **Function:** Foundational for group identity, explaining origins, defining the relationship with the divine/land/others, providing collective meaning.
      *   **Development:** Narrative is central and early in the group's tradition. Its historicity is often less critical to the group than its meaning.
      *   **Scope:** Primarily defines *one specific group*.
      *   **Examples:** Exodus (foundational for Jewish identity), potentially the *Māori landings* in Aotearoa/New Zealand (central to iwi identity, specific waka/captains crucial, archaeological evidence sometimes aligns/diverges).

  *   **Cross-Cultural Myth:**
      *   **Rule:** A story, motif, or figure **adopted, adapted, and claimed by multiple distinct cultures**, often serving different functions in each, with **no single origin point proven by neutral evidence**. The story exists *between* cultures.
      *   **Evidence:** No definitive evidence proving origin or historicity *favored by one culture over the other*. The story appears in multiple traditions.
      *   **Function:** Varies by culture - legitimacy, connection to another prestigious culture, explanation of shared motifs, religious significance.
      *   **Development:** The story likely pre-dates specific cultural claims and is adapted into each tradition.
      *   **Scope:** Inherently involves *multiple cultures* claiming the same story/figure.
      *   **Examples:** Queen of Sheba (claimed by Ethiopia & Israel/Judaism), *Flood Myths* (appearing globally, adapted to local contexts - though these are usually understood as purely mythical).

  **Applying this to Prester John:**

  *   **Core:** There *were* Nestorian Christians and powerful rulers in Central/East Asia (like the Kerait or Yelü Dashi).
  *   **Elaboration:** Medieval Europeans massively elaborated on vague reports, creating the figure of Prester John - a powerful, wealthy, ideal Christian king ruling a utopian kingdom in the East. This figure bore little resemblance to the actual historical figures.
  *   **Function:** The legend served *European* hopes/needs during the Crusades - the desire for a powerful ally against Islam, proof of Christianity's global reach.
  *   **Development:** The elaboration happened *centuries later* in Europe, projecting European Christian ideals onto distant, vaguely known figures/communities.
  *   **Evidence:** Evidence exists for the *kernel* (Nestorianism, Central Asian rulers), but *none* for the elaborate European Prester John myth.

  **Conclusion:** Mr. Chen will almost certainly categorize the **Prester John legend as Back-Projected History.**

  *   **Why?** You have a minor, obscure historical kernel (Nestorian bishop, Kerait ruler) that Europeans, *centuries later*, massively elaborated upon to create a figure (Prester John) serving their *contemporary* political and religious needs (hope for an ally, validation of faith). The core existed, but the *legendary narrative* is a later European projection.

  **How to Split Them Apart (Using your examples):**

  1.  **Japanese Emperor Jimmu (Descendant of Sun Goddess):**
      *   **Analysis:** Fundamental to *Japanese* imperial identity. While likely based on prehistoric/early historic Yamato rulers, the *specific divine narrative* was codified later (Kojiki/Nihon Shoki) to legitimize the ruling dynasty. **Verdict: Identity-Event.** (It defines the *group* - Japan/the Imperial line - regardless of provable historicity. The "divine descent" is the core identity element, not a later European projection like Arthur).
  2.  **Hanno the Navigator (Circumnavigated Africa?):**
      *   **Analysis:** We have his *Periplus* (written account). It describes real places and plausible events along the West African coast. The *core journey* is evidenced by his text. The *extent* (did he truly circumnavigate?) and *specific interpretations* (like "Gorillae") are debated/unverified. **Verdict: Legend with Bones.** (The text provides evidence for the core journey/setting; the debated extent/specifics are the "legend" part).

  **Key to Passing:**

  In your essay, show you understand the **rules** by applying them clearly to Prester John:

  1.  **Identify the historical kernel(s):** Nestorian presence, figures like Yelü Dashi.
  2.  **Describe the elaborated legend:** Medieval European Prester John.
  3.  **Explain the temporal gap & projection:** Europeans *centuries later* projecting their ideals onto vague knowledge.
  4.  **State the function:** Serving European hopes during the Crusades (political/religious need).
  5.  **Conclude:** This fits "Back-Projected History" perfectly, just like King Arthur – a minor historical element massively elaborated later to serve the needs of the culture telling the story.

  Good luck! You've clearly grasped the core concepts – now just apply them systematically.
