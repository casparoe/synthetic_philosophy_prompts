prompt: |-
  So here's a thought experiment I'm playing with for my philosophy of history seminar. Take the old fight between Ranke's ambition to recover the past as it actually happened and the sceptics like Carr and Hayden White, who think the historian's choices about which facts count and how to narrativize them do the real work. Now imagine a national school board that takes White fully seriously and mandates a "double emplotment" rule: every chapter in every history textbook must present the same agreed chronicle of events twice, once plotted as a tragedy and once as a comedy (or romance), with neither labelled as the correct reading. Give me the most important implications of adopting this policy -- think about what it does to students' sense of historical truth, whether it actually escapes bias or just relocates it to the selection of the shared chronicle, and whether Ranke has any comeback left. Please format your answer as exactly five numbered points, each a sentence or two, no introduction or conclusion.
