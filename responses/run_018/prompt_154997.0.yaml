prompt: |-
  hey so i was arguing with my roommate last night about Nozick's experience machine—she's convinced that if the qualia were perfect we'd all be irrational not to plug in, and i was trying to explain why it's not just about mental states but i realized my philosophy of well-being course never gets past the original example which feels totally stale by now. im leading a discussion next week and i want a sharper case, so can you construct one for me?

  i need a one-paragraph scenario in a realistic clinical setting—say a hospice unit testing a "continuity-modulated protocol" for end-of-life care. the tech isn't magical: it's a neuro-interface that fragments consciousness into discrete, non-overlapping episodes, each optimized for a different well-being good (pleasure in one, achievement in another, deep relationships in a third). each episode feels like a complete life with full internal coherence, but there's zero autobiographical memory linking them; your present self doesn't survive into the next episode, and some achievements in the "achievement" episode are actually stiched together from other patients' real biographys, presented to you as your own. no demons, no omniscient predictors—just this specific stitching and fragmentation feature.

  the case should be engineered so four theories deliver these exact verdicts: hedonism says enter (net experienced goods are maximized regardless of fragmentation), desire-satisfaction says stay out (your current integrated self doesn't desire to dissolve into a disconnected series of strangers), objective list says stay out (the achievements and relationships aren't genuinely authored by you, so they fail the authenticity condition for objective goods), and narrative-identity well-being—where well-being requires a unified life story—surprisingly says enter, because each episode contains its own internal narrative arc and cross-episode unity turns out to be unnecessary on this view. after the scenario, walk through each verdict and why, identify the feature doing the work (the absence of diachronic narrative unity combined with internal episode coherence), show what changes if you restore normal memory across episodes, and explain how a hedonist or objective-list defender would attack the stitching feature—specifically whether borrowing other people's achievements cheats. keep it casual, don't cite specific texts or philosophers by name, and don't worry about the typo i left in here.
