  Second, they need exact verdicts: hedonism pro, desire-satisfaction anti, objective list anti, narrative theory pro. That's tricky because narrative theories usually prize unity, but here the twist is that internal episode coherence satisfies them without diachronic unity. Need to justify that carefully. 

