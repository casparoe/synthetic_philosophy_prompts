  The game might not reproduce the argument about possible worlds because we only actualized one sequence of events. We didn't consider counterfactuals (e.g., could the statue have survived if we had replaced the core in a different way?).

  What will go wrong the first time:
  1. Team Statue might not remember which blocks are the core? -> We can give them a photo of the core at the beginning.
  2. Team Clay might not be able to track every block? -> They can have a diagram and update it after each round.
  3. People might get obsessed with the blocks and miss the metaphysics -> in the debrief, we connect it explicitly.
  4. One team might dominate the discussion -> assign roles within teams: e.g., a spokesperson.

  Detailed Activity Plan:

  Time: 60 minutes

  Materials:
  - 30-40 building blocks of various colors, including 3 identical red blocks for the core.
  - A table.
  - A screen or a way for teams to turn their back.
  - Paper and pens for teams to record.
  - A scoreboard.

  Setup (5 minutes):
  - Divide into two teams of 5 each.
  - Explain the rules briefly:
     "We are going to build a statue together. The statue has a core of three red blocks that are essential for its identity. There are two teams with different responsibilities: 
     - Team Clay: you are responsible for tracking the material identity of the statue. You will record every block. The material identity survives any replacement of blocks and even the removal of a block as long as the structure remains a connected whole. You lose points if you claim the material identity broke when it hasn't.
     - Team Statue: you are responsible for tracking the identity of the statue as an artwork. The statue survives as long as (1) the core (the three specific red blocks from the start) remains intact (the same blocks in the same arrangement) and (2) at least 60% of the outer blocks are in roughly the same shape. You lose points if you claim the statue survived when the core has changed (either replaced or missing)."

  Building (5 minutes):
  - Both teams build the statue together. The core must be three red blocks in a specific arrangement (e.g., a tower or a triangle) and should be placed in a central location. The outer blocks should be various colors. The whole structure should have about 20-30 blocks.

  Inspection (2 minutes):
  - Show the teams the statue. Team Clay makes a detailed diagram (or takes a photo if allowed). Team Statue is shown the core and takes a photo of the core and the overall statue.

  Rounds (25 minutes total, 5 minutes per round):
  - For each round (1 to 5):
     1. Teams turn around or close their eyes.
     2. Facilitator makes the change for that round (as planned).
     3. Teams turn back and have 2 minutes to inspect and discuss.
     4. Each team writes their answer on a paper (Clay: "Did the clay survive? (Y/N)"; Statue: "Did the statue survive? (Y/N)").
     5. Collect answers.

  Changes per round:
  - Round 1: Swap one outer block (replace with the same color block).
  - Round 2: Swap two outer blocks (replace with different color blocks).
  - Round 3: Swap one core block (replace with an identical red block).
  - Round 4: Remove one outer block (do not replace).
  - Round 5: Remove one core block (do not replace).

  Scoring (5 minutes):
  - After round 5, the facilitator reveals what happened in each round and scores:
     - Team Clay: 
          - They should answer Y for all rounds.
          - For each N, they lose 1 point.
     - Team Statue:
          - Should answer: 
               Round 1: Y
               Round 2: Y
               Round 3: N (because core block replaced)
               Round 4: Y (core intact and outer shape >60%)
               Round 5: N (core missing a block)
          - For each round where they said Y and the core had changed (rounds 3 and 5), they lose 1 point.
          - Also, if they said N in a round where the core had not changed and the outer shape was sufficient (rounds 1,2,4), they don't lose? According to your request, they only lose for claiming survival when the core changed. So only false positive on survival when core changed is penalized.

  Debrief (15 minutes):
  - Gather and discuss:
     - What happened in round 3? Team Statue might have said Y because the core arrangement looked the same, but Team Clay knows a core block was replaced. 
     - This illustrates: the same physical object can be seen as two different things with different persistence conditions.
     - Co-location: the statue and the clay are in the same place, but they are different entities.
     - The core represents the essential function or form of the statue.
     - The clay's identity is tied to the matter itself, but it can survive change of parts.
     - What the game doesn't capture: 
          - We only did one sequence of events. In philosophy, we might ask: could the statue have survived if we replaced the core in a different way? Or in a different possible world?
          - Also, the game doesn't capture the intrinsic properties vs. the functional properties.

  Honest note:
     - The game makes concrete the clash of persistence conditions, but it doesn't address modal arguments (what could have been) and it simplifies the metaphysics by having clear-cut rules.

  What might go wrong:
     - Team Clay might be bored because they always say Y. To engage them, ask them to track which blocks were changed and report, though it doesn't affect scoring.
     - Team Statue might be confused in round 3 if they can't tell the core block was replaced. This is intentional.
     - Students might argue about the 60% rule or the core arrangement. Be prepared to arbitrate.
     - The removal of a core block in round 5 might cause the statue to collapse. That's okay, it reinforces that the core is essential.

  This should fit in 60 minutes.
answer: |-
  Here's a complete, runnable 60-minute activity designed for ~10 undergrads to physically experience the statue/clay problem through hands-on gameplay. The focus is on creating tension between material persistence (Clay) and functional/form persistence (Statue) via block-swapping, scoring, and debrief.

  ---

  ### **Activity: The Core & The Clay**
  **Total Time:** 60 mins  
  **Participants:** 10 philosophy undergrads (split into 2 teams of 5)  
  **Goal:** Physically experience the tension between material persistence (clay) and functional persistence (statue) through object alteration.

  ---

  ### **Materials Needed**
  - **Building blocks:** 50+ interlocking blocks (e.g., LEGO, wooden cubes).  
    - *Critical:* 3 identical **red blocks** (the "core").  
    - Other blocks in multiple colors (blue, green, yellow, etc.).  
  - **Timer** (phone or physical).  
  - **Scoreboard** (whiteboard or poster paper).  
  - **Blindfold or screen** (to hide swaps).  
  - **Rule sheets** (one per team, see below).  

  ---

  ### **Rules & Setup (10 mins)**
  1. **Teams:**  
     - **Team Clay:** Tracks *material persistence*. They must log every block by color and position.  
     - **Team Statue:** Tracks *functional persistence*. They only care about:  
       - The **core** (3 red blocks, in a specific arrangement, e.g., stacked vertically).  
       - The **overall shape** (≥60% of outer blocks in roughly the same configuration).  

  2. **Build the Statue (5 mins):**  
     - All students collaboratively build a structure (e.g., a tower, animal, abstract shape).  
     - **Secret rule:** The statue *must* have 3 red blocks buried inside as the "core" (not visible from outside).  
     - Outer layers should use varied colors (non-red).  

  3. **Inspect & Record (5 mins):**  
     - **Team Clay:** Creates a detailed map of every block’s color and position.  
     - **Team Statue:** Sketches the overall shape and notes the core’s location (they know it’s 3 red blocks inside but can’t see it).  

  ---

  ### **Gameplay: Swapping Rounds (30 mins)**  
  *Facilitator acts as the "Swapper." Teams face away during swaps. Each round: 3 mins inspect, 2 mins team discussion.*  
  - **Round 1 (Warm-up):** Swap 2 outer blocks (same color).  
  - **Round 2:** Swap 3 outer blocks (different colors).  
  - **Round 3:** Swap 5 outer blocks + **secretly swap one red core block** (replace with identical red block).  
  - **Round 4:** Swap 4 outer blocks and alter the shape (e.g., move 20% of outer blocks).  
  - **Round 5 (Chaos):** Swap 6 outer blocks and **remove one red core block** (leave a gap).  

  **Scoring (After each round):**  
  - **Team Statue** answers: *"Does the statue survive?"*  
    - ❌ **Lose 1 point** if they say "yes" when:  
      - Core arrangement is broken OR a core block was swapped.  
    - ✅ **Gain 1 point** for correct "no" answers.  
  - **Team Clay** answers: *"Does the material (clay) survive?"*  
    - ❌ **Lose 1 point** if they say "no" when:  
      - All original blocks are still present (just rearranged/replaced).  
    - ✅ **Gain 1 point** for correct "yes" answers.  
  - *Note: Material always survives if blocks are connected, even if swapped. Statue dies if core/shape is compromised.*  

  ---

  ### **Payoff & Scoring System**  
  - **Consistency > Competition:** Points reward accurate tracking of each team’s persistence condition, not "winning."  
  - **Tiebreaker:** If teams tie, the "statue" is disassembled. Team Clay must rebuild it from their block log; Team Statue must identify if the core/shape is identical.  

  ---

  ### **Debrief (15 mins)**  
  **Guided Discussion (Start open-ended, then map to concepts):**  
  1. *"What frustrated you? When did you feel sure/unsure about survival?"*  
     - Team Statue: Panic when shape/core changed.  
     - Team Clay: Annoyance when blocks were swapped but material "survived."  

  2. **Map to Philosophy:**  
     - **Co-location:** "You were judging the *same object* but with different rules. The statue and clay occupy the same space but have different identities."  
     - **Persistence Conditions:**  
       - *Clay (material):* Survives if matter is preserved (even with replacements → *numerical identity*).  
       - *Statue (functional):* Survives only if form/core remain → *functional identity*.  
     - **The Clash:** "You felt tension because both can’t be true at once when the core changes. This is the heart of the statue/clay problem!"  

  3. **Honest Limitations:**  
     - *"This game can’t replicate modal arguments* (e.g., ‘Could the statue survive in a different world?’). We focused on actual changes, not possibilities. Also, real-world persistence conditions are messier than our rules!"  

  ---

  ### **What Will Go Wrong (Brutally Honest)**  
  1. **Team Statue dominates early** since shape/core are easier to track.  
     - *Fix:* Secret core swap in Round 3 resets confidence.  
  2. **Students obsess over blocks, not metaphysics.**  
     - *Fix:* Debrief starts with *"How did you FEEL when…?"* to pivot to conceptual tension.  
  3. **Arguments over "roughly the same shape" (60% rule).**  
     - *Fix:* Facilitator arbitrates fast—e.g., *"Would a stranger recognize it as the same statue?"*  
  4. **Team Clay logs slowly.**  
     - *Fix:* Give them a templated grid to speed up logging.  

  ---

  ### **Why This Works**  
  - **Physicality matters:** Swapping blocks creates visceral stress when teams disagree on "survival."  
  - **No upfront theory:** Students discover the problem through gameplay, making the debrief "click."  
  - **Casual & fun:** Feels like a game, not a lecture. Scaffolds deep discussion naturally.  

  Run it as-is—no prep or citations needed! Let me know if you want a streamlined rule sheet PDF.
