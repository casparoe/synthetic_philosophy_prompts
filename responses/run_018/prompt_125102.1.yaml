  ## The Prior Considers Evidence Already Known

  My credence map begins: a solid **prior**.
  No gaps appear where Mercury's **orbit**
  might slide unseen. All data points are **known**.
  Each fact secured, assigned its proper **weight**.
  What strange unease then through the model **shifts**
  when that old path, accounted for, gleams **still**?

  The theory breathed it in long since. So **still**
  it stands, absorbed within the base **prior**.
  Yet reason pulls: observe that curve, how it **shifts**
  against the void! The planet's plotted **orbit**
  demands... what? More? But I assigned its **weight**
  already! Must the long-absorbed be **known**

  afresh? The agent scans the page, makes **known**
  the figures yet again. The scales lie **still**.
  No added mass, no alteration's **weight**
  can budge the balance set within the **prior**.
  You point again: "But see! The measured **orbit!"
  A gesture stirs the dust. The cursor **shifts**.

  Conditioning requires belief that **shifts**.
  But certainty was fixed; the truth was **known**,
  locked fast before the question sought that **orbit**
  as novel proof. The posterior lies **still**
  as stone, though logic strains against the **prior**.
  This evidence exerts no purchase, **weight**

  dissolved. What force remains? What latent **weight**
  could pull, when probability never **shifts**?
  The calculation's cold: P(H|E) = P(H). **Prior**
  unchanged by E. The bitter fruit is **known**:
  confirmation's ghost, desired yet **still**
  denied by data bound within the **orbit**

  of certainty. No movement from that **orbit**
  can register. It bears no evidential **weight**.
  The model groans, though nothing outwardly **shifts**.
  The datum, bright, undeniable, **known**,
  sits trapped. Its power, potential, hangs so **still**,
  a prisoner locked inside the **prior**.

  Old **orbit**, fixed, absorbed within the **prior**,  
  **known** fact, your **weight** was spent. Though reason **shifts**,  
  you **still** hold fast. No posterior climbs. It **still**s.

  ---

  **Notes on the Sestina's Formal Work:**

  *   **Fixed Rotation:** The end-words cycle through the strict sestina permutation: 6,1,5,2,4,3 for the stanzas following the first. This structure mirrors the "re-encountering" of the evidence.
  *   **Syntactic Shifts:** Each time an end-word appears (e.g., "orbit" as subject, object, part of a metaphor, etc.), its grammatical role changes, mimicking encountering the evidence in a new "light" or argument. Yet, the meaning and confirmatory impotence remain ("weight" never actually *moves* anything, "shifts" describe futile movements or straining logic).
  *   **"Orbit" & "Prior":** "Orbit" consistently represents the observed datum (like Mercury's precession). "Prior" represents the initial credence state that already incorporates that datum with certainty (P(E) = 1).
  *   **"Shifts" vs. "Weight":** "Shifts" appears where there is *apparent* movement, tension, or logical straining (reason shifts, cursor shifts, scales seem like they might shift). "Weight" consistently fails to exert force ("dissolved", "no purchase", "spent"), emphasizing the lack of actual probabilistic movement.
  *   **Envoi Adjacency ("prior known"):** The envoi explicitly links "prior" and "known" ("Old orbit, fixed, absorbed within the prior, / known fact..."), capturing the moment of recognizing the evidence was internal to the prior all along. This adjacency highlights the collapse.
  *   **Technical Accuracy & Suspended Tension:** The poem states the core problem (P(H|E)=P(H) when P(E)=1), uses the terms correctly, and evokes the *feeling* of confirmation ("confirmation's ghost, desired") clashing with the mathematical reality ("unchanged", "No posterior climbs"). It doesn't resolve the tension ("It stills" – both becomes quiet and remains unchanged).
  *   **The Prior's Voice:** The poem speaks *from* the perspective of the prior ("My credence map", "absorbed within the base prior") observing the futile attempts to make the old evidence do new work. It conveys a sense of stasis and resignation ("lies still as stone", "unchanged", "prisoner locked").
