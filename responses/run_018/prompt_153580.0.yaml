  Quick question for a discusison im running. Rank these four responses to Parfit's hitchhiker problem — best to worst — at actually resolving the rational-irrationality tension without just assuming you'll tie yourself to the mast. Give each a score out of 10 and a one-line reason.

  A) The standard dispositional account: being disposed to pay is what gets you the ride in the first place.
  B) A noisy-prediction tweak: the driver reads your brain but can't distinguish genuine commitment from counterfactual rehearsal, so you have to actually wire in the habit.
