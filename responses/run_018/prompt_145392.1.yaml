  ### Joint Adversarial-Collaboration Statement on Legend and History  

  #### 1. Agreed Claims  
  Both parties affirm the following statements as foundational to the discussion:  
  1.1. The narratives of the Trojan War, King Arthur, and the Exodus are multilayered traditions transmitted across oral and literate cultures, subject to adaptation, embellishment, and reinterpretation over time.  
  1.2. Archaeological methods are constrained by preservation biases, incomplete datasets, and interpretive challenges; they can affirm or challenge specific claims but cannot comprehensively reconstruct complex events without corroborating evidence.  
  1.3. Textual analysis can identify patterns of transmission stability (e.g., consistent core elements) and diachronic evolution (e.g., anachronisms, thematic shifts), but cannot *independently* verify historicity without external controls.  
  1.4. Oral traditions may preserve historical kernels across generations, but stability varies by context; written records can freeze narratives at a specific point yet introduce new cultural accretions.  
  1.5. Epistemically, both approaches require rigorous methodologies: Materialist Historians prioritize falsifiability through physical evidence, while Narrative Stratigraphers prioritize decomposability through comparative textual analysis.  
  1.6. None of the three case studies (Troy, Arthur, Exodus) possesses contemporaneous, unambiguous evidence confirming *all* narrative events as historical.  

  #### 2. Disagreements Table  
  | Crux                          | Materialist Historian Formulation                                                                 | Narrative Stratigrapher Formulation                                                                 |  
  |-------------------------------|--------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|  
  | **Anachronism Problem**: Whether later-period details invalidate the entire narrative or demarcate historical kernels from accretions. | The presence of clearly later-period details (e.g., high-medieval feudalism in Arthurian tales) demonstrates the narrative’s wholesale fabrication in the later era, rendering claims of an older kernel speculative. | The presence of later-period details marks accretive boundaries; diachronic analysis can isolate plausible historical kernels by identifying stable, anachronism-free elements embedded in the narrative stratigraphy. |  
  | **Negative-Evidence Problem**: Whether absence of archaeological traces for large-scale events disproves historicity. | The absence of material evidence for claimed large-scale events (e.g., Exodus migrations) constitutes strong counter-evidence, as such events should leave discernible traces absent exceptional taphonomic factors. | The absence of material evidence is expected for nomadic, perishable, or low-visibility activities; it cannot disprove historicity when contextual factors (e.g., preservation biases) explain the gap. |  
  | **Convergence Criterion**: Whether independent traditions converging on a detail indicate a shared historical origin. | Convergence of details (e.g., names/places across traditions) likely stems from shared literary dependence, archetypal tropes, or parallel invention—not a common historical source. | Convergence of details across independent traditions indicates a shared historical origin, especially when convergence cannot be explained by cultural diffusion or universal archetypes. |  

