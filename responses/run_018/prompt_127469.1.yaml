  ## The 1770 Bengal Famine Through Adam Smith's Lens: Predation, Neglect, and Theoretical Limits

  Adam Smith's scathing critique of colonial empire, particularly under mercantile companies like the East India Company (EIC), provides a potent framework for analysing the 1770 Bengal famine and its preceding administration. Let us carefully map his concepts onto this historical catastrophe.

  **1. Mapping Smith's Concepts onto Bengal:**

  *   **The "Company-Sovereign":** In Smith's terms, this precisely describes the EIC in Bengal after Plassey (1757) and Diwani (1765). Key figures embodying this dual role:
      *   **Robert Clive:** Architect of EIC ascendancy, secured the *Diwani* (revenue rights) making the Company the de facto sovereign tax collector.
      *   **Warren Hastings:** As Governor, consolidated Company rule, directly embodying the merger of commercial and sovereign functions. The EIC's covenanted servants (Company officials) acted as both revenue collectors and monopoly traders, fulfilling Smith's definition of the dangerous "company-sovereign" – an entity wielding state power primarily for commercial gain.
  *   **Revenue Extraction & Governance Options:**
      *   **Smith's Critique:** He argued sovereigns should focus on justice, defence, and public works (like agriculture), funded by moderate, predictable taxation. Mercantile companies, conversely, prioritise maximum, immediate revenue extraction for dividends and trade profits, neglecting governance duties.
      *   **EIC's Actions in Bengal (Pre-1770):**
          *   **Intensified Tax Farming:** Retained the Mughal *Zamindari* system but auctioned revenue collection rights to the highest bidder ("farming"). These *Ijaradars* (revenue farmers), often Company servants or their agents, faced immense pressure for fixed, high remittances to Calcutta, leading to ruthless exactions regardless of harvests.
          *   **Negotiated Settlements:** Later attempts (like the 1772 *Five-Year Settlement* under Hastings) aimed for predictability but still set demands too high and failed to account for local variations or calamity.
          *   **Neglected Alternatives:** Smith would have advocated for a moderate, fixed land tax assessed on actual productivity, reinvesting surplus into local infrastructure (irrigation, roads, granaries) and justice. The EIC utterly failed here. Revenue was siphoned off for:
              *   Company trade (financing exports, purchasing goods).
              *   Financing wars (against Indian powers and the French).
              *   Paying dividends to shareholders in London.
              *   Enriching Company officials ("Nabobs") through private trade and corruption.
  *   **Famine Dynamics as Proof of Predation & Neglect:**
      *   **Predation:** The famine (triggered by drought in 1769) was catastrophically exacerbated by EIC policy:
          *   **Rigid Revenue Demands:** Despite failing crops, the EIC insisted on the full revenue assessment. Tax collectors, desperate to meet quotas, seized remaining grain or coerced peasants into selling seed stock, stripping resilience.
          *   **Monopoly Practices & Hoarding:** While Smith focused on *trade* monopolies, the EIC's *de facto* control extended to grain. Officials and favoured merchants often hoarded grain, manipulating scarcity for profit. The Company's focus on exporting goods like rice for profit continued even as starvation spread.
          *   **Failure of Relief:** The sovereign duty to provide relief was ignored. No significant public granaries existed (neglected infrastructure), and the administration prioritised revenue collection and commercial stability over famine mitigation. Smith's prediction that a company-sovereign would prioritise "trinkets and baubles" (profit) over "the great interests" of the country was tragically fulfilled.
      *   **Neglect of Improvement:** Smith argued company-sovereigns actively *discourage* agricultural improvement. This was starkly evident:
          *   **No Investment:** Revenue was extracted, not reinvested in irrigation, drainage, or productivity-enhancing measures.
          *   **Destructive Incentives:** The high, inflexible tax regime combined with predatory collection destroyed capital (livestock, tools, seed stock) and incentives for peasants to invest in land. Why improve if the surplus is seized?
          *   **Disruption of Traditional Systems:** Mughal systems, while imperfect, often had mechanisms for revenue remission during drought and local granaries. The EIC dismantled or ignored these without providing alternatives.

  **2. Where Smith's Framework is Silent or Breaks:**

  *   **Moral Status of Victims: Company vs. Crown Rule:** Smith's condemnation of colonial exploitation is vehement and universal. He saw both company rule and crown rule as harmful and exploitative, driven by mercantile interests and the "savage injustice" of Europeans. His framework does *not* distinguish a moral hierarchy for victims based on the *type* of colonial ruler. The suffering stemmed from the *system* of colonial extraction, whether administered by a company or a distant crown ministry primarily concerned with metropolitan profit and power. He would likely see both as morally reprehensible.
  *   **Grain-Trade Monopoly: Proximate Cause vs. Structural Feature:** Smith primarily critiques mercantile monopoly as a *structural* flaw inherent in the company-sovereign model. The EIC's *actual* grain-trade monopoly/control during the famine was indeed a *proximate* cause of hoarding and export exacerbating scarcity. However, Smith might argue this was not an aberration but the *inevitable consequence* of the structure he described. The company-sovereign, focused on revenue and profit, naturally leveraged its sovereign power to control and profit from essential commodities like grain whenever possible. The famine revealed this inherent tendency in its most lethal form. The monopoly wasn't merely a policy choice; it was enabled and incentivised by the very nature of the EIC's hybrid rule.

  **3. Net Fiscal Loss and the Category Error:**

  *   **Smith's Broader Argument (Net Fiscal Loss):** Smith famously argued colonies were a net drain on the *metropolitan* treasury due to administration and defence costs, outweighing trade benefits or revenue remittances. He saw the mercantile system distorting capital allocation *within* Britain.
  *   **The Bengal Catastrophe & Assessment:**
      *   **Contradiction for the EIC?** In the *short term* for the *Company itself*, Bengal under Diwani was immensely profitable *despite* the famine. Huge sums (£2-4 million annually) were remitted to London pre-famine, financing dividends, investments, and wars. The famine caused a *temporary* financial crisis for the EIC *in Bengal* due to revenue collapse, but the *overall* flow of wealth to Britain via the Company was substantial.
      *   **Revealing the Category Error:** The catastrophe exposes a limitation in Smith's *framing* of the "net fiscal loss" argument. His focus was primarily on the *metropolitan state's* budget. The 1770 famine demonstrates that the EIC, as a *territorial sovereign*, engaged in extraction on a scale and brutality fundamentally different from simple mercantile "miscalculation." It wasn't just bad trading; it was state-sponsored predation leading to societal collapse. Treating the EIC's territorial sovereignty as merely "another variant of mercantile miscalculation" **is** a category error. Sovereign power allowed for systematic extraction (revenue) and control (grain monopoly) far beyond the scope of trade alone. While the famine caused *local* revenue collapse, the preceding years proved territorial empire could be immensely profitable *for the Company and its shareholders*, even if ultimately destabilising and morally catastrophic.
      *   **Broader Confirmation?** Smith might counter that the long-term costs of administering and securing the conquered territory (including the famine's devastation requiring later, costly interventions, and the moral hazard/corruption infecting British politics via the "Nabobs") would ultimately outweigh the short-term gains for Britain *as a whole*. The near-bankruptcy of the EIC requiring a state bailout (1773 Regulating Act) somewhat supports his view of the inherent instability and costliness of such arrangements. The catastrophe showed the *unsustainability* of such predatory extraction.

  **Conclusion:**

  Adam Smith's critique provides a remarkably prescient framework for understanding the 1770 Bengal famine. The EIC perfectly embodied the "company-sovereign," prioritising predatory revenue extraction and mercantile profit over good governance and agricultural improvement, directly leading to famine conditions and exacerbating the catastrophe through rigid taxation and grain control. This starkly confirms Smith's central thesis on the perils of combining sovereignty and commerce.

  However, the episode also highlights limitations in Smith's framework. It does not morally distinguish victims based on colonial administration type (Company vs. Crown), and while the grain monopoly was a proximate cause, Smith would likely see it as structurally inevitable under a company-sovereign. Most significantly, the immense short-term profits extracted by the EIC before and *despite* the famine challenge a simplistic reading of Smith's "net fiscal loss" argument for the *colonising entity itself*. The catastrophe reveals the fundamental category error in treating territorial sovereignty wielded by a trading company as merely a mercantile venture gone wrong; it was a qualitatively different form of exploitation enabled by state power, proving immensely profitable for the perpetrators in the short term, but ultimately leading to devastating human and systemic collapse. Smith diagnosed the disease brilliantly, but the Bengal famine tragically measured its most extreme symptom.
