  The quantum mechanics reference is totally wrong. Lewis's worlds aren't generated by quantum branching; they're static and cover all logical possibilities. The blogger's "physics with extra dimensions" framing misses Lewis's key metaphysical innovation—it's not physics but a radical ontological thesis. 

