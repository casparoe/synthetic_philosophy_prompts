  First, I need to recall Lewis's core commitments from memory since they can't check sources. Key points: Lewis's worlds are concrete, spatiotemporally isolated universes, not abstract entities. The indexical "actual" is central to his view—it's world-relative like "here." Modal operators reduce to quantifiers over these worlds. 

