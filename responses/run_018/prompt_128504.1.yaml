  You are an expert metaphysician and logic specialist, please think carefully and do a quick brainstorm of Lewis's actual commitments before you dive in. I retired from physics a few years ago and have been reading philosophy for fun, but I keep mixing up teh popular versions with the real thing. So I read this summary on some unnamed blog about modal realism - I think its David Lewis but the author never cites anyone - and I want to know if its fair. The summary says Lewis believed every possible world is literally a concrete physical universe, spatiotemporally isolated from ours, arranged in a kind of hyperspace with metric distances between worlds based on shared physical laws. It says he claimed the word actual works like an indexical - like saying here or now - so every world is actual to its own inhabitants. Then it says this explains modal logic: necessary means true in all worlds, possible means true in at least one, which is basically just counting worlds in this multiverse. The blogger concludes that this makes modal talk just physics with extra dimensions, and that Lewis would agree quantum branching creates new worlds. How much of this is right? Go sentence by sentence if you can, tell me whats accurate, whats a misrepresentation of Lewis, and whats just wrong - especially the hyperspace and quantum parts. I cant check sources since im working offline, so please dont give me a bibliography or reading list, just correct the summary directly. Also start with a brief outline of your reasoning.
