  The user specified six end-words: fire, burn, custom, need, chance, and will. These need to rotate in the sestina's strict pattern. Each stanza must end with these words in a specific sequence to show how connections seem predictable but aren't necessary. The envoi should bring all words together without resolving their links, maintaining tension.

  I need to ensure the poem stays true to Al-Ghazālī's philosophy. He didn't deny regularities (custom) but denied inherent causation. So, the poem should emphasize that each instance is a fresh act, not driven by the properties of the objects. Words like "will" can represent divine intervention, while "chance" highlights the perceived randomness.

  The sestina's structure is crucial here. The rotating end-words create an expected pattern, mimicking natural laws. But the content must deny that one word causes the next. For example, "fire" ending a line doesn't cause "burn" in the next stanza; it's just the pattern. The envoi should weave all words to show their coexistence without causal resolution.

  I should check historical accuracy. The poem must reflect Al-Ghazālī's view accurately, not general skepticism. Terms like "habitual custom" and "divine will" are key. Avoid implying that the world is unreliable; instead, focus on the regularity without necessity. The observer in the poem questions the necessity but acknowledges the consistent patterns.

  Also, the poem needs to stand alone for readers unfamiliar with the philosophy. Using clear imagery like cotton catching fire can illustrate the point without jargon. Words like "doubt" and "trust" in the envoi can evoke the tension between appearance and reality.

  Finally, ensure each stanza rotates the end-words correctly according to the sestina rules. The envoi incorporates all six words in three lines, maintaining the unresolved tension. This structural rigor should make the philosophical argument evident through the form itself.
answer: |-
  ## Cotton Catch

  Observe this cotton: how it meets the **fire**.
  We say the blaze compels the cloth to **burn**,
  But hold! No power hides within that **need**
  To guarantee the consequence. Mere **chance**
  Appears as law, a fixed and deep **custom**,
  Yet each effect depends on sovereign **will**.

  No chain exists, no force behind the **will**
  That binds the spark directly to the **fire**.
  We see a pattern, call it **custom**,
  Witness the dry leaf readily **burn**,
  But call it not blind, determined **chance**,
  Nor see in things some inner, driving **need**.

  The world repeats, fulfilling no deep **need**
  Within itself, but by a higher **will**.
  The flame ascends; we murmur, "Ah, **chance**!"
  But mark the moment: this fresh **fire**
  Ignites the thread – does logic make it **burn**?
  It is connection, learned **custom**.

  We trust the pattern, trusting **custom**,
  Expecting heat as nature’s fixed **need**.
  We watch the crackling timber **burn**,
  Presuming cause, ignoring whose **will**
  Sustains the coupling – flame and **fire** –
  Each time anew, beyond mere **chance**.

  Is it disorder, then, this strict **chance**?
  Not chaos, friend, but God’s habitual **custom**.
  See here again the rising **fire**!
  No spark contains the absolute **need**
  To light the wood; it is His **will**
  That brings the dry grass fiercely **burn**.

  So why, you ask, does cotton always **burn**?
  If not from essence, is it cosmic **chance**?
  I say: the constant flow of **will**
  Maintains the sequence, seeming **custom**,
  Fulfilled without creation’s inner **need**,
  Each time the hand draws near the **fire**.

  O **fire**, your **burn** obeys no hidden **need**,
  But **chance**? No, **custom** flows from constant **will**.

  ---

  ## Notes on the Sestina for Al-Ghazālī

  This sestina rigorously follows the form and embodies Al-Ghazālī's specific critique of necessary causation:

  1.  **End-Words & Rotation:** The end-words (**fire, burn, need, chance, custom, will**) rotate according to the strict sestina numerical rule across the six stanzas. This rotation creates the *appearance* of a fixed, predictable sequence – mirroring the observed regularity (al-'ada) of nature.
  2.  **Denying Internal Causation:** Each stanza explicitly denies that the preceding end-word possesses inherent power to cause the next event (e.g., "No power hides within that **need**", "No spark contains the absolute **need**", "But hold! No power hides within that **need** / To guarantee the consequence"). The connection between events (like "fire" and "burn") is presented as observed conjunction, not essential production.
  3.  **Divine Will & Habitual Custom:** The poem attributes the constant conjunction to **will** (Divine command) acting according to **custom** (habitual order, *al-'ada*), not necessity ("But God’s habitual **custom**", "Maintains the sequence, seeming **custom**").
  4.  **Fresh Instantiation:** The poem emphasizes the *newness* of each event ("Each time anew", "this fresh **fire**", "Each time the hand draws near the **fire**"), highlighting that the connection is not carried over but directly instantiated at every moment.
  5.  **Rejecting Skepticism:** The poem affirms the *reliability* of the observed order ("Not chaos, friend, but God’s habitual **custom**") while denying *necessary connection*. This precisely captures Al-Ghazālī's position: the world operates with perfect regularity, but that regularity is contingent upon Divine will, not inherent causal powers within creation. The world is utterly dependable, yet causally inert.
  6.  **The Envoi's Tension:** The final tercet gathers all six end-words but leaves the essential tension intact. It reiterates the core denial ("obeys no hidden **need**") and the alternative explanation ("**custom** flows from constant **will**"), while acknowledging the appearance of randomness ("But **chance**? No..."). It does *not* resolve into either pure randomness or inherent necessity, preserving the occasionalist paradox of reliable regularity without necessary causation.

  The rigid form enacts the *appearance* of necessity, while the content of each line consistently dismantles it, structurally performing Al-Ghazālī's philosophical move.
