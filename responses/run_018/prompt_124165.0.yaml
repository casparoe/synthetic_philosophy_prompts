answer: |-
  Here is the hand, not offered as a sign
  But simply here, a thing among the things,
  This surface where it rests, the solid wood,
  Firm grain beneath the skin, the light that falls
  Upon the skin and wood, defining shapes.
  The air between my gesture and your sight,
  This space we occupy, this quiet room
  Holding the desk, the books, the listening air.
  Not that I know, but that I show you this:
  The gesture stands, requiring your regard,
  Its force resides within our shared refusal
  To call this sight illusion, face to face.
  The world is proven in the act we share,
  Or worlds we meet within this common ground.
