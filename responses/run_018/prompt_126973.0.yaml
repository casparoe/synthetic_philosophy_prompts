prompt: |-
  Write a dialogue between two equally capable political philosophers, Mara and Jonas, debating the boundary problem—who belongs to the demos—through the concrete case of a permanent lunar settlement governed remotely by Earth-based democratic institutions. Mara should defend a recursive authorization view: anyone whose fundamental interests are systematically shaped by collective decisions belongs to the demos, regardless of present co-location or direct voting access, which includes future settlers and affected non-citizens on Earth. Jonas should defend a co-presence view: democratic membership requires actual participation in shared deliberative practices, so remote governance over a lunar population violates democratic legitimacy unless the settlers themselves constitute an independent demos. Have them engage directly with one another—no strawmen—through at least two rounds of reply, working through a specific tension: if the settlement's life-support decisions depend on Earth-based resource allocation, does that integrate Earth citizens into the lunar demos, or does it integrate lunar settlers into Earth's? They should converge on a precise conceptual disagreement about the conditions of democratic membership rather than a merely empirical dispute. Do not include bibliographies, citations, or references to specific scholars.
reasoning: |-
  Okay, let's tackle this dialogue request. The user wants a nuanced debate between two political philosophers on the boundary problem, centered around a lunar colony scenario. Key requirements: Mara argues recursive authorization (membership based on affected interests), Jonas defends co-presence (membership requires actual participation), with at least two rounds addressing the life-support resource tension. They must converge on conceptual disagreement about democratic membership conditions.

  First, setting up the concrete case: The lunar settlement is permanently inhabited but governed remotely by Earth institutions. This creates immediate tension - Earth makes binding decisions for people physically separated from them. The life-support resource allocation example perfectly illustrates the interdependence: Earth controls vital resources, but settlers experience the consequences. 

  For Mara's recursive view: Need to emphasize how Earth's decisions fundamentally shape lunar settlers' survival and liberty, regardless of distance. Her argument should show that disenfranchising settlers violates core democratic principles about affected interests. When Jonas challenges that this would make Earth citizens part of lunar demos too, Mara must clarify that directionality matters - it's about subjection to power, not mere impact.

  For Jonas' co-presence view: Focus on deliberative practice deterioration over distance. His strongest point is that voting without shared discourse creates empty proceduralism. When Mara points out settlers' dependence, he should concede integration but argue it makes settlers part of Earth's demos - except the physical separation prevents genuine participation. 

  The convergence point: Their core disagreement is whether membership requires (Mara) being subject to authoritative decisions affecting fundamental interests, or (Jonas) co-located capacity for reciprocal deliberation. This isn't about empirical feasibility of space voting, but the normative foundations of democracy itself.

  Avoiding strawmen: Ensure both positions acknowledge each other's strongest points. Mara admits deliberation suffers remotely, Jonas concedes affected interests matter. Their disagreement lies in which criterion is constitutive of membership.

  Handling the resource allocation tension: This is where the debate crystallizes. Both agree it creates integration, but differ on direction: Mara says Earth's power over life-support brings settlers into Earth's demos, Jonas argues settlers' dependence incorporates them into Earth's demos - but the physical gap prevents actualization of either. 

  Final exchange: Have them isolate the precise fracture - whether democratic authority derives from subjection to power (Mara) or from shared deliberative space (Jonas). No bibliography, as requested, but the concepts should echo canonical debates without naming theorists.
answer: |-
  ## Dialogue: The Lunar Demos Boundary

  **Setting:** A virtual symposium on extraterrestrial governance. Mara and Jonas face each other across holographic displays showing schematics of the lunar settlement.

  **Mara:** Jonas, EarthGov’s plan for remote democratic governance of Luna Prime fundamentally fails the boundary test. Decisions made on Earth – resource quotas, environmental regulations, even emergency protocols – directly determine whether those settlers live or die, flourish or stagnate. By the recursive principle, anyone whose *fundamental interests* – life, liberty, security – are systematically shaped by collective decisions *belongs* in the demos authorizing those decisions. Luna Prime's inhabitants are clearly subject to EarthGov's binding authority. Excluding them from the franchise violates democratic legitimacy at its core.

  **Jonas:** Mara, I agree Luna Prime is subject to EarthGov's power, but that doesn't automatically make settlers part of Earth's *demos*. Democracy isn't just about being affected by power; it's about *sharing in the exercise* of that power through actual co-presence. Meaningful deliberation, spontaneous assembly, shared public discourse, and the lived experience of collective fate – these require physical co-location. Remote voting via quantum-link doesn't replicate the embodied reciprocity essential for democratic membership. Luna’s settlers inhabit a distinct social and physical space; their demos must be constituted *locally* for legitimacy, even if they coordinate with Earth.

  **Mara:** But that ‘distinct space’ is an illusion when life itself hangs on Earth's decisions! Consider the life-support allocation vote next month. Earth’s citizens will decide, based on *their* perceived needs and politics, how much water, oxygen, and energy Luna Prime receives. The settlers will live with the consequences – rationing or expansion, stagnation or growth. Your co-presence view ignores the chains of causation. If Earth collectively decides Luna lives on a knife-edge, doesn’t the sheer scale of that impact *integrate* the settlers into the Earth demos? Their fundamental interests are being authoritatively shaped by Earth's collective will.

  **Jonas:** No, Mara, it demonstrates the *reverse*: it shows how Earth’s power *subjects* Luna, but doesn’t incorporate them. The settlers experience the *force* of Earth's decision, but they are absent from the deliberative space where reasons are exchanged, alliances form, and compromises are forged face-to-face. Adding settler votes to Earth’s electorate wouldn’t solve this; it would dilute and distort Earth’s own demos. The settlers aren't breathing Earth’s air, sharing its streets, or feeling the immediate weight of its collective choices in their daily interactions. That life-support decision? It integrates Luna into Earth’s *sphere of control*, not into Earth’s *demos*. The solution is for Luna to govern its own life-support, forming its *own* demos where co-presence *is* possible, negotiating resource treaties with Earth as a distinct polity.

  **Mara:** So, under your view, legitimacy requires Luna to become independent immediately, even if practically impossible? That ignores the *interdependence*. Earth isn't just controlling; its own resource security and scientific interests are profoundly shaped *by* Luna’s existence and activities. Settlers mining Helium-3 affect Earth's energy economy; their research shapes Earth's scientific priorities. Their fundamental interests are shaped by Earth, *and* Earth's fundamental interests are shaped by them. Doesn't this mutual, systematic shaping of fundamental interests through binding decisions suggest a *single*, albeit geographically dispersed, demos? Recursive authorization demands inclusion based on the *relationship of subjection and impact*, not the feasibility of sharing a town square. Denying settlers a vote in the decisions governing their survival isn’t solved by calling them a separate demos; it’s disenfranchisement.

  **Jonas:** You identify the tension perfectly, Mara, but resolve it by dissolving boundaries entirely. Mutual impact doesn't erase the *qualitative difference* in how power and deliberation function. The core of our disagreement is this: You see democratic membership arising primarily from being *subject to authoritative decisions* affecting core interests. I see it arising primarily from *participating in a shared, embodied deliberative practice*. The life-support vote exemplifies this: Earth citizens deliberate *with each other*, physically present, accountable to immediate peers. Luna settlers experience the outcome, but are excluded from that *practice*. Adding them remotely turns them into abstract data points, not co-deliberators. The violation isn't just exclusion from a vote; it's the impossibility of genuine *political community* across the void. Luna needs its own demos not for isolation, but because only within a shared physical space can the full, reciprocal practice of democracy – deliberation, accountability, solidarity – truly exist. Their dependence on Earth necessitates negotiation *between* demoi, not the fiction of one giant, disembodied demos.

  **Mara:** And there lies our conceptual core: For me, the *source of democratic authority* is the protection of fundamental interests subjected to collective power. For you, it is the *practice of deliberation* within a shared physical lifeworld. We agree Luna shouldn't be disenfranchised, but we see the path to legitimacy entirely differently – integration based on subjection versus autonomy based on co-location. The life-support dilemma highlights this: You see it demanding Luna's self-governance; I see it demanding Luna's inclusion in Earth's franchise. The boundary problem persists precisely because we define the *grounds* of membership by different, fundamental democratic values.
