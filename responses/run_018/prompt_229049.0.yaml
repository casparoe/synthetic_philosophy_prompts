prompt: |-
  I'm working on a time travel novel where the protagonist goes back to 1955 to stop her grandfather from ever meeting her grandmother (long story, inheritance dispute, it makes sense in context). Anyway, the deeper I get into plotting the more I realize I don't actually know what I, the author, believe happens when she pulls the trigger, and every beta reader gives me a different answer. So I want to make a little quiz for my writers' group: "what's your actual theory of changing the past?" Eight to ten questions, each a concrete scenario (the gun jams every time no matter what she does; she succeeds and fades out of a family photo; she succeeds and wakes up in a present where she was never born but somehow still exists and remembers everything; she kills a man who turns out not to be her grandfather after all, and the family resemblance was a coincidence...), with two or three answer options each.

  Then give me a scoring key that maps answer patterns onto the main positions: the fixed-timeline view where the past was always already "visited" and consistency constrains what a traveler can do (so her attempt must fail or be what caused things all along), the branching view where killing him just spawns a new timeline and her own past stays untouched, the mutable-single-timeline view where the future actually rewrites itself (with or without the traveler remembering the old version), and the killjoy position that backwards time travel is simply impossible so every question has the same boring answer. Also flag any answer combinations that don't correspond to a real position and say why nobody seems to live there (incoherent? just unpopular?), and flag any two positions my quiz can't tell apart. The questions should sort people by what they say happens in the cases, not by whether they recognize fancy words, so don't ask anything like "are you an eternalist."

  If any of the scenarios above are ambiguous between positions, sharpen them or swap in better ones. And please write the whole thing in American English.
reasoning: |-
  Okay, the user is working on a time travel novel where the protagonist travels back to 1955 to prevent her grandparents from meeting due to an inheritance dispute. The core challenge is determining the consequences of altering the past, as beta readers have conflicting interpretations. They need a quiz to help their writers' group identify their implicit theories of time travel, moving beyond abstract terms to concrete scenarios.

  The user wants 8-10 scenario-based questions with multiple-choice answers. Each scenario should test different aspects of time travel theories: fixed timelines, branching timelines, mutable timelines, and the impossibility view. The quiz must avoid jargon and focus on observable outcomes. They also need a scoring key that maps answer patterns to philosophical positions, flags inconsistencies, and identifies indistinguishable positions.

  The user's examples (gun jams, fading photo, persisting in altered present, mistaken identity) are solid starting points but need refinement to avoid ambiguity. For instance, the photo-fading scenario must clarify whether the traveler vanishes instantly or gradually, and whether others notice the change. The mistaken identity case should specify if the traveler's actions have consequences in their original timeline.

  Deeper needs emerge: the user likely seeks narrative coherence and wants to avoid plot holes. By clarifying their own stance through the quiz results, they can write more consistently. The scoring system should highlight which theories are internally consistent versus contradictory, helping the user dismiss unworkable options for their story.

  I'll structure the quiz around four key positions:
  - **Fixed Timeline**: Changes are impossible; the past self-corrects.
  - **Branching Timelines**: Altering the past creates parallel universes.
  - **Mutable Timeline**: The past can be rewritten, affecting the present.
  - **Impossibility**: Time travel can't happen, so all scenarios default to failure.

  I'll craft scenarios that test:
  1. **Constraints on Actions** (e.g., gun jamming) → Fixed vs. others
  2. **Physical Changes** (e.g., fading from a photo) → Mutable vs. Branching
  3. **Memory/Persistence** (e.g., remembering the old timeline) → Mutable with memory vs. Branching
  4. **Causal Paradoxes** (e.g., preventing one's birth) → All positions

  Each question will have 3-4 options avoiding leading language. The scoring key will tally answers associated with each position, flag combos that are incoherent (e.g., claiming changes are impossible but also describing a rewritten present), and note where positions overlap (e.g., Fixed and Impossibility both predict failure in most cases).

  I'll write the quiz in clear American English, avoiding terms like "eternalism." The scenarios will be sharpened—e.g., specifying that in the photo-fading case, the traveler sees themselves disappear from a photo *while still existing*, which tests mutable timeline logic. For the mistaken identity scenario, I'll clarify that the traveler returns to an unchanged present, probing whether they consider history flexible or fixed.
answer: |-
  Here’s a concrete, scenario-based quiz designed to pinpoint time travel theories—no jargon, just observable outcomes. All answers are in American English, with ambiguous scenarios sharpened for clarity. 

  ---

  ### **"What’s Your Theory of Changing the Past?" Quiz**  
  *Answer each scenario based on what you believe would **actually happen**.*  

  1. **The Unjammable Gun**  
     The protagonist tries to shoot her grandfather in 1955, but the gun inexplicably jams every time she pulls the trigger, even after cleaning it or switching weapons. What happens?  
     A) She *eventually gives up*—something always physically stops her.  
     B) She *succeeds on the fifth try* with a different gun.  
     C) Time travel itself *fails*—she never even reaches 1955.  

  2. **The Family Photo Test**  
     Before traveling, she takes a 1955 family photo showing her grandparents and her young mother. After "succeeding" in preventing their meeting, she looks at the photo:  
     A) The photo *shows her grandparents* together like always—nothing changed.  
     B) Her grandmother *vanishes* from the photo, but her grandfather and mother remain.  
     C) The photo *shows only her grandfather*—her grandmother and mother are gone.  

  3. **The Disappearing Act**  
     Immediately after "succeeding" in preventing her grandparents’ meeting, the protagonist:  
     A) *Instantly vanishes* from 1955.  
     B) *Remains in 1955* but notices her clothes/items fading.  
     C) *Stays physically solid* in 1955 with no changes.  

  4. **Returning to the Present**  
     After "succeeding," the protagonist returns to her original time (2023). What does she find?  
     A) Her life is *unchanged*—grandparents still met, she still exists.  
     B) She’s in a *new 2023* where she was never born, but she remembers her old life.  
     C) She’s in a *new 2023* where she was never born, and she *has no memory* of her old life.  

  5. **The Butterfly Effect**  
     She steps on a butterfly in 1955. Returning to 2023, she finds:  
     A) *No changes at all*—butterflies don’t matter.  
     B) *Minor changes* (e.g., different brand of soda exists).  
     C) *Major changes* (e.g., her hometown has a different name).  

  6. **Killing the Wrong Man**  
     She shoots a man she *thought* was her grandfather (but wasn’t—the resemblance was coincidence). Back in 2023:  
     A) *Nothing changes*—he wasn’t important.  
     B) *Everything changes*—he was key to unrelated history (e.g., he invented the internet).  
     C) She *can’t return*—killing him stranded her in 1955.  

  7. **Warning Her Past Self**  
     In 1955, she finds her *own past self* (as a child) and warns her, "Don’t time-travel in 2023." In 2023:  
     A) She *forgets the warning* and time-travels anyway.  
     B) She *remembers the warning* and *never time-travels*.  
     C) The encounter *erases her adult self* from existence.  

  8. **The Unbreakable Vase**  
     She tries to smash a historic vase in 1955. When she swings a hammer at it:  
     A) The hammer *shatters*—the vase is unharmed.  
     B) The vase breaks, but *reforms instantly*.  
     C) The vase *smashes easily*—history updates.  

  ---

  ### **Scoring Key & Theory Mapping**  
  Tally responses and match patterns to the four core theories:  

  | **Answer Pattern**                     | **Theory**                          | **Key Belief**                                                                 |
  |----------------------------------------|-------------------------------------|--------------------------------------------------------------------------------|
  | **Mostly 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A/B** | **Fixed Timeline**                  | The past was always altered. "Changes" were part of history all along. Consistency protects causality. |
  | **Mostly 1B/C, 2C, 3C, 4B, 5B/C, 6B, 7B, 8C** | **Mutable Timeline**                | The past can be rewritten. Travelers may recall the original timeline ("memory preservation"). |
  | **Mostly 1B, 2B, 3C, 4B, 5B/C, 6A/B, 7B, 8C** | **Branching Timelines**             | Altering the past creates a *new* timeline. Original timeline is untouched. Traveler is "copied" into the new branch. |
  | **Mostly 1C, 2A, 3A, 4A/C, 5A, 6C, 7C, 8A**  | **Impossibility**                   | Backward time travel can’t happen. All attempts fail or cause collapse.        |

  ---

  ### **Incoherent/Unpopular Combos**  
  - **"Mutable + Fixed Hybrid"** (e.g., **4B** *and* **1A**): Claims you can change the past *and* it was always changed. *Why incoherent?* If the past was "always changed," nothing was actually altered.  
  - **"Branching + Vanishing Traveler"** (e.g., **3A** *and* **4B**): Claims new timelines spawn *but* the traveler fades. *Why unpopular?* If branching happens, the traveler shouldn’t vanish—they’d just be in the new branch.  
  - **"Impossibility + Success"** (e.g., **8C** *and* **1C**): Claims time travel fails *but* changes happen. *Why incoherent?* If it’s impossible, changes can’t occur.  

  ---

  ### **Indistinguishable Positions**  
  The quiz **CAN’T** cleanly separate:  
  - **Fixed Timeline vs. Impossibility** in scenarios where change fails (e.g., Q1, Q8). Both predict failure, but for different reasons (physics vs. temporal consistency).  
  - **Mutable vs. Branching** in scenarios without "memory preservation" or traveler fading. If Q4 is **C** (no memory of old timeline), it could fit either.  

  ---

  ### **Why These Scenarios?**  
  - **Sharpened Ambiguity**:  
    - Q2 (Photo Test): Now specifies *who* vanishes to test if history rewrites partially (B) or totally (C).  
    - Q6 (Wrong Man): Adds "stranding" (C) to test if mistakes have personal consequences.  
    - Q7 (Warning): Clarifies the warning’s content to force a paradox choice.  
  - **Eliminated Weak Questions**: Removed "fading while existing" (too vague) and added Q5 (Butterfly Effect) to test scale of change.  

  This sorts people by *outcomes*, not labels. Use it to spark debate—then write the theory that serves your **story’s themes** (e.g., Fixed for tragedy, Branching for multiverse shenanigans). Good luck!
