answer: |-
  ### Restatement of Counterfactual Mugging in Mechanism Design Terms

  **Core Setup:**  
  - **Principal:** The mugger, who designs a revelation mechanism.  
  - **Agent:** The victim, with private information about their type (risk preferences, valuation of outcomes).  
  - **Oracle:** Reports the counterfactual state (e.g., coin toss outcome) truthfully. States are binary: ω ∈ {H, T} (Heads/Tails).  
  - **Payoffs:** Interdependent across states. In ω = H, the agent gains $10,000 unconditionally. In ω = T, the agent gains $10,000 only if they pay the principal $100.  

  **Mechanism Design Mapping:**  
  1. **Revelation Mechanism:**  
     - The principal designs a **direct mechanism** where the agent reports their *virtual type* (a commitment to actions in all states).  
     - The virtual type θ = (θ_H, θ_T) encodes the agent's intended action (pay/not pay) in both realized and counterfactual states.  
     - The oracle reveals the true state ω and the *counterfactual action* θ_{-ω} (action in the unrealized state).  

  2. **Contract as a Commitment Device:**  
     - The agent commits to a strategy profile (θ_H, θ_T) ex ante. This serves as a **correlated commitment device** binding actions across branches.  
     - The principal imposes a **transfer rule**:  
       - In state T, the agent pays $100 if their committed action for H (θ_H) was "pay."  
       - This mirrors **interdependent payoffs**: Payment in T depends on counterfactual behavior in H.  

  3. **Incentive-Compatibility (IC) Constraints:**  
     - The mechanism must satisfy **Bayesian incentive-compatibility**:  
       - For the agent to truthfully report θ, their expected utility from honest reporting must exceed deviation payoffs.  
       - Let U(ω, θ) be the agent’s payoff in state ω given report θ.  
       - IC requires:  
         𝔼[U(ω, θ) | θ] ≥ 𝔼[U(ω, θ') | θ] ∀ θ' ≠ θ,  
         where the expectation integrates over ω using the common prior (P(ω=H)=0.5).  
     - If the agent reports θ_H = "not pay," they avoid payment in T but lose $10,000 in T (net -$10,000).  
     - If they report θ_H = "pay," they pay $100 in T but gain $9,900.  

  4. **Off-Path Beliefs & Virtual Types:**  
     - **Off-path beliefs**: When the agent is not approached (ω=H), the principal’s belief about θ_T (action in T) is based on the agent’s reported type.  
     - **Virtual types**: θ_H and θ_T are correlated (same agent), creating **informational linkage**. The principal exploits this to enforce payments in T.  

  5. **Bayesian Persuasion & Information Design:**  
     - The principal uses the oracle’s report to "persuade" the agent that their counterfactual commitment binds them.  
     - The agent’s belief about the unrealized state (H when in T) is updated via the common prior, making θ_H credible.  

  **Rationality Claim Restated:**  
  A rational agent pays in ω=T because:  
  - The mechanism makes their payoff in T **interdependent** with their commitment in H.  
  - Correlated virtual types and IC constraints imply that deviating from θ_H = "pay" reduces ex-ante expected utility.  
  - Thus, the agent commits to θ_H = "pay" ex ante, binding them to pay in T to avoid a $10,000 loss.  

  ---

  ### Residue Report: Mapping Limitations  

  **1. Parts Surviving as Standard Results:**  
  - **Adverse selection with correlated types**: The correlation between θ_H and θ_T models hidden actions under correlated private information.  
  - **Virtual types**: Standard in mechanism design (e.g., Myerson) to handle interdependent valuations.  
  - **Bayesian persuasion**: The oracle’s role aligns with a signaling device shaping beliefs.  
  - **IC constraints**: The agent’s compliance follows standard IC under commitment devices.  

  **2. Parts Requiring Distortion:**  
  - **Counterfactual branching → Off-path beliefs over virtual worlds**:  
    - Branching is modeled as off-path beliefs about θ_{-ω} (unrealized state actions).  
    - The "obligation" in T arises from IC constraints tied to ex-ante commitments, not metaphysical branching.  
  - **Common priors over unrealized states**:  
    - The common prior P(ω) includes unrealized states (H when T occurs), standard in Bayesian games.  
  - **Interdependent payoffs → Contractual linkages**:  
    - Payoff interdependence is encoded in the transfer rule (payment in T depends on θ_H).  

  **3. Parts With No Expression:**  
  - **Normativity of unactualized obligations**:  
    - The claim that "an unactualized branch (ω=H) generates obligations in ω=T" has **no analog**. Mechanism design only binds agents via ex-ante commitments (e.g., θ_H) enforced by IC constraints. Obligations derive from realized contractual terms, not counterfactual metaphysics.  
  - **Verification of counterfactual actions**:  
    - The oracle’s ability to verify θ_H in ω=T relies on exogenous "truth-telling" not grounded in standard mechanisms. Real-world contracts cannot verify pure counterfactuals.  
  - **Intrinsic commitment to correlation**:  
    - The model assumes agents internalize cross-state correlations as binding. Standard theory treats this as a choice (via θ), not a normative imperative.  

  ---

  ### Conclusion: Framework Limitation vs. Metaphysical Exclusion  

  The residue indicates a **genuine limitation** of mechanism design:  
  - **Limitation**: The framework cannot capture **non-instrumental normative dependencies** (e.g., obligations from unactualized possibilities). Contract theory only enforces obligations arising from ex-ante agreements and IC constraints. The "ought" in CM is reduced to rational choice under commitment, losing its normative force.  
  - **Metaphysical Exclusion**: The original CM argument relies on a **branching metaphysics** where counterfactuals are real and obligating. Contract theory correctly excludes this, as it only considers:  
    - Observable states (via the oracle).  
    - Incentive-compatible commitments.  
    - Payoffs tied to verifiable outcomes.  
    In this domain, the agent pays in T solely to avoid a $10,000 loss—not because ω=H "demands" it. Thus, contract theory exposes CM’s normative claim as an artifact of a non-standard ontology.  

  **Final Judgment**: The residue reflects a limitation in capturing *sui generis* inter-world obligations, but more importantly, it shows that CM’s normative thrust relies on metaphysical assumptions that mechanism design rightly dismisses as exogenous to rational choice.
