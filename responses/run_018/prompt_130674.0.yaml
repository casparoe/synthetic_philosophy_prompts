  First, I need to recall material constitution theories. The user mentioned substrate dominance, so contrasting theories like perdurantism (four-dimensionalism) or constitution theory (Lynne Baker) would be relevant. Also, functionalist approaches where identity depends on role rather than matter. 

  Next, real-world restoration cases. Examples like the Riace Bronzes or Knossos frescoes where synthetics are integral. These challenge the dominance condition because the artifact's identity is preserved despite significant material replacement. The user might be looking for concrete examples to test their theory.

  Biological parallels are another angle. Prosthetics and organ replacements, like a hip implant or artificial heart, where the person's identity isn't questioned despite foreign materials. If the mind or consciousness remains, the body's material dominance might not matter. This could weaken the user's emphasis on substrate dominance.

  The user wants defeaters ranked by how damaging they are. Fatal objections would be those that completely undermine the substrate dominance view, like cases where functionality or form overrides material continuity. Awkward cases might need refinements, like adjusting what counts as "structurally essential" or "dominant." But over-refinement risks making the theory unfalsifiable, which is a problem for concrete objects.

  Also, considering the emotional aspect: the user's grandmother's artwork holds sentimental value. They might be seeking validation of their stance but also want to ensure it holds up to rigorous scrutiny. The deeper need could be reconciling personal attachment with philosophical consistency.

  I should assess if the substrate dominance view can be qualified without becoming untestable. For instance, if "dominance" is redefined to include functional or historical aspects, does that make it too vague? If so, it loses explanatory power. The user needs to know if their view is defensible or if they should adjust it.

  Finally, ranking the counterarguments: formal theories like perdurantism might be structurally fatal if they offer a better explanation. Restoration cases where identity is preserved despite material minority are also strong challenges. Biological cases are less direct but still potent. The user's refinement attempts might handle some issues but could lead to ad-hoc exceptions, weakening the theory's coherence.
answer: |-
  Your position—substrate dominance in the structurally essential core—faces sophisticated challenges. Here's a ranked analysis of counterarguments, from fatal to awkward, with parallels in conservation, philosophy, and biology:

  ### **Fatal Defeaters (Structurally Undermining)**
  1.  **Perdurantism / Four-Dimensionalism (Philosophical):**
      *   **Argument:** Objects persist through time as *spacetime worms*. Your grandmother's statue is a temporal segment. The restored object is a later segment *of the same worm*, even if its matter at t2 isn't numerically dominant over its matter at t1. Identity isn't defined by matter-at-a-time but by spatiotemporal and causal continuity.
      *   **Why Fatal?** Directly attacks the core premise that numerical dominance of *original* matter at a *single time* is necessary for persistence. Concedes the material change but denies it destroys identity.
      *   **Concession:** A substrate dominance theorist *must* reject 4D ontology entirely, as it renders their core criterion irrelevant.

  2.  **Functional Continuity & Intentionality (Conservation/Biology):**
      *   **Argument:** Identity persists if the *functional role* and *intentional object* (the artwork *as conceived and experienced*) remain continuous. The restored figure fulfills the same aesthetic, memorial, and cultural function *as* your grandmother's work. Its history (creation by her, display context, meaning to family) is embedded in its identity, not overridden by material composition.
      *   **Restoration Case:** The **Riace Bronzes**. Severely corroded, structurally compromised Greek statues were restored using extensive synthetic resins (epoxy, fiberglass) for structural integrity. Are they "new objects"? Art historians overwhelmingly say no; their identity *as* 5th-century BC masterpieces persists due to form, recovered detail, and historical significance, despite synthetic mass dominance.
      *   **Biological Parallel:** A **total artificial heart recipient**. While no original heart matter remains dominant, we unhesitatingly say *the same person* persists. Identity is tied to consciousness, memory, personality, and bodily continuity, not substrate dominance of the core circulatory organ.
      *   **Why Fatal?** Severs the assumed tight link between material dominance and identity for functional/intentional entities. Shows identity can be grounded in history and role.
      *   **Concession:** The defender must argue that artworks are fundamentally *material objects* first and foremost, not functional/intentional entities like persons or tools.

  ### **Severe Defeaters (Requiring Major Qualification)**
  3.  **Constitution View (Lynne Baker) (Philosophical):**
      *   **Argument:** The statue ("G") is not *identical* to its material substrate ("S") at any time. G is constituted by S at t1 and by a new hybrid substrate ("S*") at t2. G persists as long as there is a continuous history of being the *primary kind* (artifact of type F) under a relevant persistence condition (e.g., intentional conservation).
      *   **Why Severe?** Decouples artifact identity from specific material dominance. The "same G" can be constituted by *different* substrates (S, S*) over time. Your grandmother's statue (G) is constituted first by clay (S), later by the hybrid (S*).
      *   **Refinement Attempt:** Insist the "structurally essential core" defines the primary kind. But Baker would counter that the core's *functional role within the whole* defines the kind, not its material purity. This risks circularity.

  4.  **Minimal Original Matter + Information Preservation (Conservation):**
      *   **Argument:** Identity persists if *any* original matter remains *integrated* and carries the *form-defining information* (surface detail, texture, micro-structure), even if non-dominant. The synthetic resin preserves and reveals the original form *carried* by the remaining original fragments.
      *   **Restoration Case:** **Ancient Frescoes (e.g., Knossos):** Often salvaged fragment-by-fragment, reattached with synthetic mortar onto new synthetic backing. Original plaster mass is negligible. Yet, they are identified as the original artworks due to the surviving surface imagery/pigment and the reconstruction based on their original configuration.
      *   **Why Severe?** Shows dominance is unnecessary; *informative integration* suffices. Your condition dismisses artifacts where original matter is crucial *informationally* but not *volumetrically dominant*.
      *   **Refinement Attempt:** Redefine "structurally essential core" to include "informationally essential surface." But this stretches "structural" and weakens numerical dominance.

  ### **Awkward Defeaters (Challenging but Possibly Absorbed)**
  5.  **Gradual Replacement Threshold Problem (Philosophical/Practical):**
      *   **Argument:** Your view requires a specific threshold (e.g., 50.1% original matter in the core). But where is the principled line? Is 51% original enough, but 49% not? This seems arbitrary. Gradual restoration creates a sorites paradox for identity.
      *   **Refinement:** Shift to "sufficient original matter to determine the core's essential properties" (vague but less arbitrary). Or adopt a "closest continuer" theory where identity tracks the best candidate, considering material continuity *among other factors*. However, this dilutes the core commitment to numerical dominance.
      *   **Awkwardness:** Highlights the brittleness of a strict numerical condition but doesn't destroy the view; it just forces vagueness or multi-factor analysis.

  6.  **"Original Core" Ambiguity (Practical):**
      *   **Argument:** Defining the "structurally essential core" is often non-trivial. In a ceramic figure, is it the thickest section? The load-bearing base? The surface defining the form? Different choices yield different answers about dominance.
      *   **Refinement:** Define core by functional role in structural integrity *and* form-bearing. Requires detailed material analysis per object. Makes the view highly context-dependent but not incoherent.
      *   **Awkwardness:** Practical difficulty, not theoretical impossibility. Undermines simplicity.

  ### **Assessment of Qualifiability & Unfalsifiability**
  *   **Can it be Qualified?** Yes, significantly. Terms like "structurally essential core," "numerically dominant," and even "material" can be refined:
      *   "Core" could incorporate information-bearing surfaces.
      *   "Dominant" could shift from mass/volume to "causal contribution to key properties."
      *   "Material" could differentiate between chemically bonded hybrid (your case) vs. discrete replacement (Ship of Theseus planks).
  *   **Risk of Unfalsifiability:** High. Excessive qualification risks making the view unfalsifiable:
      *   If "core" is redefined whenever dominance is lost in a counterexample, it becomes circular.
      *   If "dominance" is weakened to "any original matter playing *some* role," it collapses into triviality (almost anything with a speck of original matter survives).
      *   If synthetic bonding is deemed "non-integration" in some cases but not others based on desired outcome, it becomes ad hoc.
  *   **Insulation as Vice for Concrete Objects:** **Yes, it is a vice.** Claims about concrete objects should be grounded in observable properties and causal interactions. A theory insulated from counterexamples by constant redefinition loses its explanatory power and connection to reality. It becomes a linguistic or conceptual exercise, not an account of how physical objects persist in the world. A robust theory should make predictions vulnerable to empirical or conceptual counterexamples (e.g., "If original mass in region X drops below Y%, identity is lost"). Your view *can* do this, but only if qualifications are held stable and principled, not used solely as an escape hatch.

  **Conclusion:** Your substrate dominance view faces its strongest challenges from **4D persistence theories** (denying matter-at-a-time is key) and **functional/intentional continuity approaches** (showing identity can persist *without* material dominance). Restoration cases like the **Riace Bronzes** and biological cases like **total artificial hearts** are particularly damaging parallels. While refinements are possible (focusing on core definition, role, bonding type), the risk of rendering the view unfalsifiable—and thus disconnected from concrete reality—is significant. A defensible version requires *stable, principled* qualifications (e.g., clear criteria for "core" and "dominance" tied to artifact function) and must convincingly argue why material dominance is essential for *artwork* identity in a way it demonstrably isn't for *personal* identity. Its greatest strength is its intuitive grounding in the physicality of artifacts; its greatest weakness is explaining why that physicality *must* take the form of numerical dominance in a core when other forms of continuity demonstrably suffice for identity in analogous cases.
