  For the corruption's structure... could visualize it as fractal distortions in the timeline holograms. When the protagonist notices the "noise" isn't Gaussian but has strange attractor patterns—aha! That's the inciting incident. 

  The climax choice must feel visceral. Not just "two timelines," but specific sensory contrasts: one reconstruction smells of ozone and riot gas, the other has the scent of rain on treaty documents. The horror isn't that they can't know—it's that determinism guarantees one is real, but both feel equally true. 

  *winces* Biggest pitfall: avoiding the "free will" escape hatch. The ending should linger on epistemic humility. Maybe have them archive both timelines with a note: "Certainty requires infinite precision. We have only finitude." 

  ...Wait, is the user writing this for a rationalist group offline? That explains the "no citations" request. Better make all concepts emerge organically through tech and conflict. Call the shadowing algorithm "OrbitStitch" or something diegetic. 

