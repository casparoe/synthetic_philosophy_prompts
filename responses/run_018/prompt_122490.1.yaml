answer: |-
  ## Dialogue: The Unsealed Envelope

  **Characters:**
  *   **Alex (Defender):** Believes Good’s theorem reveals a fundamental coherence constraint of instrumental rationality.
  *   **Sam (Skeptic):** Believes the theorem’s assumptions hide crucial limitations in real-world contexts, especially regarding the causal role of belief states.

  **(Setting: A quiet corner of a university coffee shop, strewn with napkin sketches of decision trees.)**

  **Alex:** Okay, Sam, let’s try to pin down Good’s theorem clearly. An expected utility (EU) maximizer faces a choice among acts A. Before choosing, they can perfectly observe a costless signal S about the state of the world W. Utility U depends *only* on the chosen act A and the realized state W, U(A,W). Crucially, the agent has *free disposal* of the signal: one available action rule is always to *ignore S entirely* and choose the act they would have chosen without seeing S. Under these assumptions, the ex ante expected utility of observing S is *at least as high* as the ex ante expected utility of not observing it. The agent can never rationally pay *not* to see S.

  **Sam:** Precisely. And my contention is that this “free disposal” assumption – the ability to act *as if* S wasn’t observed – is the load-bearing beam. It fails precisely in the cases where information seems most likely to be harmful: undelegable decisions where the agent’s *belief state itself* becomes a direct causal factor in the outcome, and they cannot plausibly simulate ignorance. Consider the job candidate handed the search committee's ranked shortlist just before her talk. The signal (her rank, say #4) is costless.

  **Alex:** But Good’s theorem doesn’t deny the signal affects the world! Her delivery *will* change based on her belief. The theorem says *given her options*, she cannot be made worse off *in expectation beforehand* by getting the signal. Ex ante, she’d prefer to see it. She can always try to give the talk she *would* have given ignorant, even if it’s hard. That "act" is in her option set.

  **Sam:** Is it, though? *Can* she genuinely simulate the counterfactual belief state? Her knowledge that she’s #4 causally leaks into her micro-expressions, her confidence level, her stumble on slide 3 – things she couldn’t consciously control even if she tried. The act "deliver talk *as if* I believe I'm top-ranked" is *not* available to her, precisely because she *knows* she's fourth. Her belief state directly influences performance in a way she cannot fully suppress or delegate. The option "ignore S" functionally doesn’t exist. The clerk version proves my point: ex ante, she *would* prefer the clerk (who *can* be ignorant) reads the signal and gives the talk. *That’s* the option Good’s theorem relies on. But in the undelegable case, she *is* the clerk, and the clerk is contaminated by the knowledge.

  **Alex:** So you’re smuggling in extra causal pathways. You’re making U depend not just on A and W, but on *the signal S itself*, or the *belief state* induced by S. The belief state becomes a state variable or an act. Good’s theorem assumes U is a function *only* of A and W. If knowing S causally influences W *through channels other than A* (e.g., via the committee reading her disappointment), or if U depends directly on her belief (e.g., anxiety ruins her experience), then you’ve changed the structure. The theorem *allows* information to be harmful if it changes the utility function or the causal structure relating acts to states! But that’s not the *mere knowledge* being harmful; it’s the causal *effects* of acquiring the belief. Ex ante, she might prefer not to know *because* knowing causes bad things to happen or changes her preferences, not because knowledge *itself* is instrumentally bad under the original U(A,W).

  **Sam:** That’s the escape hatch, Alex, and it proves *my* point. You’re saying: "If information harms, it’s *only* because it changes the causal game or the utility function." But in the undelegable case, the *causal game inherently involves the agent’s belief state as a performative element*. The "original" U(A,W) *cannot* be defined independently of the agent’s epistemic state during the performance of A! Her delivery *is* the act, and her belief is a necessary input to generating that specific performance. Trying to separate "pure act A (the talk)" from "belief state" is artificial. The act "Give Talk Version X" is *defined by* the cognitive state producing it. The "do nothing with signal" rule requires generating a performance *defined by* the counterfactual cognitive state of ignorance, which is impossible. The theorem’s antecedent ("free disposal exists") fails in exactly these performative contexts. If you insist U *must* be separable, you render the theorem a tautology about option sets: "If you can always choose to act like you didn't see it, then seeing it can't hurt." Well, duh. But that doesn’t tell us anything about rationality when that option *isn’t* available.

  **Alex:** Hmm. I concede that in highly performative, belief-leaking scenarios like your talk, the *practical* availability of simulating true ignorance is dubious. The agent might be *unable* to execute the "ignore S" plan effectively, even if it's nominally an option. The cognitive load or involuntary leakage might make it infeasible. That’s a genuine psychological constraint the pure theorem abstracts away from. So, *in practice*, for humans in such situations, information *could* be harmful. But the *theoretical* coherence point stands: if she *could* perfectly simulate ignorance, she wouldn't be worse off. The harm comes from the *inability* to utilize the disposal option, not from the knowledge per se under the original model. Good’s theorem reveals that instrumental harm *must* stem from some change – in options, causal structure, or preferences – caused by the information acquisition process, not from the Bayesian update itself within a fixed decision problem.

  **Sam:** And I concede your point about the clerk: ex ante, under the *original* causal structure where her belief doesn't leak, she *would* prefer the sealed-envelope/clerk setup. It *is* coherent to want the signal but delegate the acting. That highlights that the core issue is delegation and performative leakage, not the signal itself. My undelegable case exploits the inability to delegate the *acting while ignorant*. Where I push back is insisting that for the theorem to give substantive advice ("always accept free info"), it needs the disposal option to be *causally robust* in the actual decision context. When it isn't – when the agent *must* act personally in the knowing state – the theorem's guarantee evaporates, not because of changed U or causal links *outside* A, but because the definition of "A" itself embeds the epistemic state. The dilemma remains: either the disposal option is genuinely available (tautological safety), or it isn't (theorem doesn't apply). The interesting cases are where it isn't.

  **Alex:** Agreed, the locus is the robustness of the disposal option. Let’s tackle the smaller point quickly: the maxmin agent updating a set of priors. Can free info hurt her?

  **Sam:** I think yes. Suppose she has priors {P1, P2}. Without signal, she chooses A maximizing min over priors EU(A). Signal S partitions the state space. *After* seeing S, she re-solves for the worst case over the *updated* set {P1(|S), P2(|S)}. The new min-EU act given S might be worse *under the original worst-case prior* than the old min-EU act would have been. Information can shrink the set, making the new worst case worse relative to the old global pessimism. It’s a failure of dynamic consistency or "prior-by-prior" updating, not probabilistic sophistication per se.

  **Alex:** I see. So if she *must* commit to the maxmin rule period-by-period, information can indeed make her ex ante worst-case payoff lower. But if she could commit *ex ante* to an updating strategy and act, she might avoid this. It’s a sophistication issue tied to the specific updating rule under ambiguity. Interesting – I’ll think more on that. But back to Good: our crux is whether "free disposal" includes the *causal capacity to simulate counterfactual epistemic states* during action execution.

  **Sam:** Precisely. And I maintain that in the crucial cases, it doesn't.

  ## Where Each of Us Was Wrong (In the Original Debate)

  *   **My Friend (Alex's Position):** He was wrong to dismiss the "leaking belief" problem as *merely* smuggling in extra causes. He correctly noted that information only harms through causal effects (including on preferences), but underestimated how deeply embedded the belief state is in the *definition and execution* of the act itself in undelegable scenarios. His "just act ignorant" retort ignored the performative impossibility.
  *   **Me (Sam's Position):** I was wrong to imply the theorem is *completely* irrelevant or vacuous. Alex correctly pinned me down on the clerk/sealed-envelope case: ex ante, under the *original* setup where my belief doesn't directly cause outcomes, I *would* want the information. This shows the harm in the undelegable case stems from the *new causal pathway opened by my personal performance*, not the knowledge itself in a context-free void. I also overstated the case by saying "the act is not in the option set"; it's more accurate to say the act *defined by counterfactual ignorance* is *causally impossible* for the agent to perform due to their actual belief state. The option exists notationally, but not practically.
