  Predictions: Camp one thinks skipping rigor leads to fragile knowledge; camp two thinks early rigor kills curiosity. Both reference Whitehead but interpret differently. The verbal issue: camp two's broader use of "romance" might cause confusion. Clarifying terms could help, but core disagreement remains.

