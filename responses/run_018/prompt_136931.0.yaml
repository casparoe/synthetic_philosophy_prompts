  - Desire-satisfaction: Control subject's preferences are "authentic" (would change if mood lifted), while experimental subject's are "locked" (wouldn't change if mood dropped). Hence latter fares worse. 

  Defender's counterattack: Argue that actual preference satisfaction is what matters, not hypotheticals. If both endorse their lives equally, privileging one's counterfactual stability is arbitrary. 

