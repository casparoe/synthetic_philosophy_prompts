prompt: |-
  I'm prepping notes for a podcast interview I'm moderating next week — the guest is a philospher defending a tweaked version of the principle of alternative possibilities against Frankfurt-style counterexamples. Her core move is to say those cases all depend on what she calls 'unitary intervention architecture': the intervener hijacks one decision-node, but real agency runs on redundant, parallel deliberative tracks, so alternatives survive at a meta-level even when the action is locked. I need maybe six questions that don't just let her restate this. One should press whether her layered-track model collapses into compatibilism she's trying to reject; another should ask what her view predicts for split-brain or collective-decision cases where those backup tracks are physically separated; and a third should probe what happens if the intervener can monitor and block the meta-tracks too. For each question, sketch the follow-up keyed to her likeliest dodge. Write it casual, like I'm emailing my producer — there's probably a typo or two in here so don't over-polish.
reasoning: |-
  Okay, the user is prepping for a podcast interview with a philosopher who's defending a modified version of the Principle of Alternative Possibilities (PAP) against Frankfurt-style counterexamples. Her key argument is about "unitary intervention architecture" – Frankfurt cases rely on hijacking a single decision node, but she claims real agency uses multiple parallel deliberative tracks. So even if an action is forced, alternatives exist at a meta-level. 

  Hmm, the user wants six questions that push beyond just restating her theory. They specifically asked for three targeted questions: one on whether this collapses into compatibilism, one on split-brain/collective decision cases, and one about interveners monitoring meta-tracks. Plus follow-ups for each. And they want it casual, like an email draft – typos and all are fine. 

  First, I need to unpack her position. PAP says moral responsibility requires alternative possibilities, but Frankfurt cases try to show you can be responsible even without alternatives (e.g., an intervener forces your action if you waver). Her rebuttal: real deliberation isn't a single path but parallel tracks, so the intervener might block one path but alternatives still exist elsewhere. Clever! But risky – it might blur into compatibilism (which grounds responsibility in actual sequences, not alternatives). 

  For the compatibilism question, I'll frame it bluntly: "Aren't you just describing compatibilist control with extra steps?" Her likely dodge: "No, because meta-tracks preserve *robust* alternatives!" Follow-up: push her to define "robust" – if the alternative track is just latent, is it *really* an alternative? 

  Split-brain/collective cases are fun. If parallel tracks are in separate brains (or people), does her theory say the *group* has alternatives but not the individual? That'd be weird for responsibility. Her dodge might be "The system is still unified!" Follow-up: Demand where *exactly* the responsibility lies – in the subsystem or the whole? 

  For the mega-intervener question: what if the intervener can block *all* meta-tracks? Does PAP fully collapse? She'll probably say "But that's unrealistic!" Follow-up: Press why realism matters – shouldn't a principle hold even in unrealistic edge cases? 

  Beyond the requested three, I'll add: 
  - A setup question about why unitary architecture is unrealistic (to preempt her dismissing Frankfurt cases). 
  - One on empirical evidence for parallel processing in brains. 
  - A wildcard on how her view handles AI – since redundancy is common there. 

  Tone-wise: keeping it loose. Say "dodgy" instead of "problematic," use "ugh" and "yikes" for emphasis. Bonus points for a typo like "responsability." Producer email vibe = conversational but sharp. 

  Biggest challenge: making sure follow-ups actually trap her dodges. For the compatibilism one, if she appeals to "robustness," the follow-up needs to dissect that term immediately. No softballs!
answer: |-
  Here's a rough draft for your producer - six questions with follow-ups, keeping it casual and pointed like you asked. Typos left in for authenticity:

  ---

  **Subject: Pod Qs - PAP Defender w/ Redundant Tracks Defense**

  Hey - nailed down six Qs for the philosopher pushing layered alternatives against Frankfurt. Aiming to push her past just rehashing the "unitary intervention architecture" critique. Here's the lineup:

  **1. Setup & Motivation:**  
  "Okay, so you're saying Frankfurt cases all sneak in this 'unitary intervention architecture' – the idea that agency has one critical choke-point an intervener can hijack. But why should we think *real* deliberation isn't like that? Isn't the whole *point* of Frankfurt cases to show that even *if* agency worked that way (which it might!), PAP still gets into trouble? What's your knock-down evidence that deliberation is fundamentally multi-track?"  
  *Likely Dodge:* "Neuroscience/cognitive psych shows parallel/redundant processing!"  
  *Follow-Up:* "Right, but Frankfurt cases are conceptual tools – they don't *need* realism to challenge PAP. Are you saying PAP only holds for *actual* human minds, not possible ones? Doesn't that shrink its scope weirdly?"

  **2. The Compatibilism Worry (Your Ask):**  
  "This layered-track view – where alternatives exist at a 'meta-level' even if the action is locked down – starts sounding *suspiciously* like what compatibilists offer: you're responsible if the action flows from your reasons-responsive process, *even if* you couldn't have literally done otherwise *at that instant*. Aren't you smuggling in a compatibilist account of control while just *relabeling* where 'alternatives' live?"  
  *Likely Dodge:* "No! The meta-tracks *are* genuine alternative possibilities, just not at the surface action node! PAP requires *possibilities*, not necessarily *action*-possibilities at the moment."  
  *Follow-Up:* "But if those 'possibilities' are just other latent deliberative paths *within* the actual causal sequence that deterministically led to the action... how is that meaningfully different from a compatibilist's 'could have done otherwise *if* reasons differed'? Isn't this PAP in name only?"

  **3. Split-Brains & Committees (Your Ask):**  
  "Let's get physical. Take a split-brain patient or a committee decision. Here, the 'redundant deliberative tracks' might be literally in different brains or people. If the intervener only blocks Track A in Brain 1, but Track B in Brain 2 *could* have initiated the same action, does Brain 1 (or the committee member whose track was hijacked) *still* have alternative possibilities? Or does the 'agent' now become the whole system?"  
  *Likely Dodge:* "The agent *is* the whole integrated system! Alternatives exist at the system level."  
  *Follow-Up:* "But moral responsability usually attaches to individuals. If Brain 1's deliberative path was fully hijacked and it played no role, is *it* responsible? If not, how does your view protect PAP for *individuals* in normal cases where tracks are co-located?"

  **4. The Meta-Monitoring Intervener (Your Ask):**  
  "Frankfurt on steroids. What if the intervener isn't lazy? What if they *can* monitor *all* potential deliberative tracks – surface and meta – and stands ready to block *any* path that might lead to ~X? If they only intervene when necessary, but ensure X happens... now *no* alternative deliberative path (even meta) remains open. Doesn't this resurrect the Frankfurt challenge *against* your layered model?"  
  *Likely Dodge:* "That's unrealistic / requires godlike powers! My model addresses *plausible* intervention."  
  *Follow-Up:* "But PAP is supposed to be a *conceptual* requirement for responsibility. If PAP fails in *this* possible scenario (even if weird), doesn't that show it's *conceptually* insufficient? Or are you watering PAP down to only apply against *incompetent* interveners?"

  **5. The Bootstrapping Problem:**  
  "How do these parallel tracks *actually* provide alternatives that matter? Imagine I have Track A (pro-steal) and Track B (pro-honesty). The intervener blocks Track B *before* it gains any traction. My actual deliberation runs solely on Track A -> I steal. You say the *mere existence* of Track B (even blocked early) preserves an alternative possibility? But if Track B was nipped in the bud, did it *really* offer me a *live* alternative path, or just a ghost of one? How is this different from no real alternative?"  
  *Likely Dodge:* "The *capacity* for the other track *is* the alternative possibility. Its activation potential matters."  
  *Follow-Up:* "But if the intervener's block prevents that capacity from *ever* being actualized or influencing anything, in what robust sense was it a 'possibility' *for me* at that time? Isn't this just saying I *would* have had alternatives *if* the intervener hadn't been there – which Frankfurt already exploits?"

  **6. AI & Alien Minds:**  
  "Let's test the boundaries. Your view seems to tie PAP tightly to *human-like* cognitive architecture with redundancy. What about a very simple, *non*-redundant AI, or an alien mind built on a truly unitary decision core? If they act in a Frankfurt case, are they *not* responsible (because no meta-tracks = no alternatives), even if they seem rational and reasons-responsive? Or does responsibility *require* your specific kind of layered architecture?"  
  *Likely Dodge:* "PAP applies to agents with *free will*, which requires complex, redundant architecture like ours."  
  *Follow-Up:* "So... you're defining free will (and thus the applicability of PAP) *in terms of* having this redundant architecture? Isn't that circular? How do we know this architecture *is* sufficient for free will/PAP without presupposing it?"

  ---

  **Why this works:**  
  *   **Forces Nuance:** Qs 2, 3, 4, & 5 directly challenge the core mechanics and implications, not just the setup.  
  *   **Cuts Off Dodges:** The follow-ups target predictable retreats ("It's the system!", "Robust capacities!", "Unrealistic!").  
  *   **Expands Scope:** Q1 & Q6 push on the foundations and generalizability.  
  *   **Casual but Sharp:** Phrased conversationally ("suspiciously like", "Frankfurt on steroids", "nipped in the bud") but the philosophical hooks are solid.  
  *   **Avoids Restatement:** Each Q demands she apply or defend the model, not just describe it.

  Good luck! This guest sounds sharp, these should make her sweat a bit. Lemme know if any need tweaking. Ugh, responsability is hard.  

