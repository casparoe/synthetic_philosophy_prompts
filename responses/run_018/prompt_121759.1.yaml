  The Lady Chatterley completion with four alternatives and OS preferences breaks the cycle. 

  We couldn't break Result 2: the Pareto rule on OS full product domain is acyclic. 

  The VL condition is doing work in blocking non-Paretian rules, but it doesn't cause cycles by itself. 

  The manipulability worry is real: an agent might misreport to be OS to avoid a bad outcome. 

  Is it interesting? Yes, because it clarifies the source of the paradox. The common take is that rights and Pareto are incompatible, but this shows they are compatible if either rights are weakened to a shield or preferences are restricted to be own-separable. 

