  me and my roommate were arguing for like three hours about Gödel and the afterlife. specifically, he actually wrote that modal-logic proof for God existing and seemed dead-set on an afterlife, but he died before the big wave of clinical near-death studies in the 90s and 2000s. now there's all this messy data—people with flatline EEGs reporting veridical perceptions of the room, plus neuroscientists saying it's just hypoxia or some endogenous DMT burst. my roommate thinks Gödel would've tried to formalize the NDE reports as premises in his proof, but i think he'd be totally skeptical because he was paranoid about his own helth and literally starved himself to death over poisoning fears. do you think he'd treat modern NDE research as empirical input for his proof, or dismiss it as psychological noise? don't just say 'he was religious'—actually wrestel with how his logical rigor handles messy clinical data.
