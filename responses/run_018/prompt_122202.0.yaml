answer: |-
  Here is a disciplined mapping of the Notre-Dame restoration onto the Ship of Theseus paradox and a critical analysis using diachronic identity theories:

  **Precise Mapping of "Planks" & Diachronic Identity Theories:**

  1.  **"Planks" Identified:**
      *   **Destroyed/Removed Planks:** Original 13th-century oak roof frame (the "forest"), Viollet-le-Duc's 19th-century spire, original lead roof covering (melted).
      *   **Preserved/Reused Planks:** Surviving medieval stained glass (cleaned/reinstalled), surviving stone vaults, surviving masonry walls and facades, surviving sculptural elements.
      *   **New/Replacement Planks:** New oak roof frame (replicating original geometry), new lead roof covering, new spire (identical replica of Viollet-le-Duc's design), new structural steel framework and fireproofing (hidden within masonry/vaults/spire structure).

  2.  **Applying Diachronic Identity Theories:**
      *   **Material Continuity:** **Fails.** The core material substance – the unique medieval wood and the specific 19th-century lead/spire structure – is largely destroyed and replaced. While *some* original stone and glass remains, the most defining structural elements (roof/spire) are entirely new matter. Strict material identity is lost.
      *   **Spatio-Temporal Continuity:** **Maintained.** The rebuilding occurs continuously on the same site, occupying the same spatial location throughout the process (even if encased in scaffolding). There is no temporal gap where the "Notre-Dame" entity ceases to occupy its place.
      *   **Formal/Functional Persistence:** **Strongly Maintained.**
          *   *Formal:* The reconstruction aims for *exact* replication of the pre-fire external form (including Viollet-le-Duc's spire) and internal spatial experience. The visible aesthetic and geometric identity is prioritized.
          *   *Functional:* The building retains its core functions: a Catholic cathedral (sacramental purpose), a national monument, a cultural symbol, and a major tourist site. Its institutional role persists uninterrupted.

  **Analysis of Reconstruction Choice & Public Reaction:**

  *   **Insistence on Exact Replication:** The vehement rejection of Macron's contemporary spire proposal and demand for identical replication demonstrates that the public primarily values **formal persistence**. The *visible form*, particularly the silhouette familiar since the 19th century, is seen as essential to "Notre-Dame-ness." This supports an essentialism based on form, not original matter.
  *   **Acceptance of Hidden Modern Elements:** The quiet integration of steel reinforcement and fireproofing reveals a pragmatic understanding that **functional persistence** (safety, longevity, structural integrity) is paramount. The *experience* and *use* of the building as a stable, enduring cathedral/monument outweighs the need for material purity. This aligns with the "four-dimensional persistence of a design-plan" – the enduring idea of Notre-Dame's specific form and function matters more than the atoms composing it at any given moment.

  **Turning the Analysis on the Paradox & Material-Continuity View:**

  1.  **The Paradox as Category Mistake:** Notre-Dame powerfully illustrates that the Ship of Theseus paradox, applied literally to architecture/institutions, **is largely a category mistake**. Treating it as a mere aggregate of wood and stone ignores its defining aspects:
      *   **Legal Personality:** Notre-Dame is owned (by the French State), managed, and protected by law. Its identity is a legal reality independent of material flux.
      *   **Sacramental Function:** As a consecrated cathedral, its identity is bound to its ecclesiastical role and sacred purpose, maintained through ritual and institutional continuity (the Archdiocese of Paris).
      *   **Collective Memory & Symbolism:** It exists as a persistent cultural symbol and repository of collective memory. Its identity resides in the shared idea of "Notre-Dame" held by millions, shaped by its enduring form and story, not its specific planks.

  2.  **Fate of the Material-Continuity View:**
      *   **Complicated:** The restoration debate *explicitly* invoked material concerns (e.g., sourcing "identical" oak, debates about lead vs. alternatives). This shows residual attachment to material authenticity where visible or symbolic (e.g., "ancient wood").
      *   **Effectively Dissolved:** The *outcome* – acceptance of identical form with new matter and hidden modern tech – demonstrates that material continuity is **not the decisive factor** for institutional identity. Functional and formal persistence, underpinned by legal, cultural, and sacramental continuity, prevail. The material-continuity view cannot explain why the post-2024 structure is still "Notre-Dame" despite massive material replacement, while a hypothetical replica built elsewhere would not be.

  **The Framework's Explanations and Limitations:**

  *   **Explains:** Why the public rejected a modern spire (threat to formal persistence) yet accepts hidden steel (preserves functional persistence and unseen form). It explains why the building remains "Notre-Dame" despite material loss – its spatio-temporal, formal, functional, and institutional continuity are maintained.
  *   **Silent/Inadequate:** The framework struggles to fully capture the *emotional intensity* of the reaction. The profound grief, the symbolic weight ("France is burning"), and the near-religious fervor for restoration stem from Notre-Dame's unique role in national identity and collective psyche – dimensions exceeding formal/functional analysis. It also doesn't perfectly weigh *which* formal elements are deemed essential (Viollet-le-Duc's spire vs. its medieval predecessor).

  **Conclusion:** Notre-Dame's restoration confirms that for complex institutional entities like great cathedrals, diachronic identity relies primarily on **spatio-temporal continuity, functional persistence, and formal persistence**, secured by legal and cultural frameworks. While material concerns are present, they are secondary to maintaining the enduring *idea* and *role* of the institution. The Ship of Theseus paradox, focused solely on material replacement, is revealed as an inadequate model because it ignores the defining non-material aspects – legal personality, sacramental function, and collective memory – that constitute the true "identity" of Notre-Dame. The material-continuity view is thus significantly dissolved as the primary criterion for such entities.
