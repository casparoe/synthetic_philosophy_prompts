  **Decision Tree for Dennettian Real Patterns in LLM Analogical Reasoning**

  1. **Counterfactual Robustness?** (Does the pattern survive adversarial perturbation of the training distribution?)  
     - **Yes** → Proceed to 2.  
     - **No** → Proceed to 5.  

  2. **Belief-Attribution?** (Does explaining the pattern require attributing beliefs/goals to the model?)  
     - **Yes** → Proceed to 3.  
     - **No** → Proceed to 4.  

  3. **Reducibility?** (Is the pattern fully reducible to physical-stance mechanics?)  
     - **Yes** → **Leaf: Pattern-Pluralist Stance-Relativity**  
       *Awkward commitment: Must affirm that belief-attribution is indispensable despite complete physical reducibility.*  
     - **No** → **Leaf: Intentional-Stance Realism**  
       *Awkward commitment: Denies physical reducibility despite the system being a deterministic artifact.*  

  4. **Reducibility?**  
     - **Yes** → **Leaf: Physical-Stance Realism** (Unnamed)  
       *Awkward commitment: Denies functional/intentional properties exist, treating analogies as epiphenomenal.*  
     - **No** → **Leaf: Pure Design-Stance Acceptance**  
       *Awkward commitment: Asserts irreducible teleology in a system with no goals/designer.*  

  5. **Belief-Attribution?**  
     - **Yes** → Proceed to 6.  
     - **No** → Proceed to 7.  

  6. **Reducibility?**  
     - **Yes** → **Leaf: (Empty)**  
       *Diagnosis: Incoherent—non-robust patterns cannot require belief-attribution if reducible to physical noise.*  
     - **No** → **Leaf: (Empty)**  
       *Diagnosis: Unattractive—posits fragile "beliefs" irreducible to physics, violating parsimony.*  

  7. **Reducibility?**  
     - **Yes** → **Leaf: Hard Physicalist Denial**  
       *Awkward commitment: Dismisses robust-seeming patterns as coincidental noise, despite empirical utility.*  
     - **No** → **Leaf: (Empty)**  
       *Diagnosis: Incoherent—non-robust, non-intentional patterns irreducible to physics defy explanation.*  

  ---

  **Flagged Collapse Risk**:  
  - **Design-Stance Acceptance** (Leaf 4: Robust?=Yes, Belief?=No, Reduce?=No) and **Intentional-Stance Realism** (Leaf 3: Robust?=Yes, Belief?=Yes, Reduce?=No) are separated decisively by Q2 (belief-attribution). They do *not* collapse, as design-stance explanations explicitly reject attributing beliefs to the *model* (focusing on function), while intentional-stance requires it. Predictive success alone cannot bridge this gap—Q2 forces a metaphysical choice.  

  **Empty Branches Diagnosed**:  
  - **Leaf 5/6 (Non-robust + Belief-attribution)**: Incoherent (5) or unattractive (6). Non-robust patterns fail Dennett’s reality criterion; belief-attribution here is either redundant (if reducible) or mystical (if not).  
  - **Leaf 8 (Non-robust + No-belief + Non-reducible)**: Incoherent—no stance (physical, design, or intentional) can coherently describe such a pattern.  
  - **Leaf 5/6/8**: All lack robustness, which Dennett deems necessary for a "real pattern" (hence no viable realist position here).  

  **Key Unnamed Combo**:  
  - **Leaf 4 (Physical-Stance Realism)**: Robust, belief-free, reducible. Distinct from hard physicalism (which denies reality to patterns) by affirming emergent physical regularities as real.
