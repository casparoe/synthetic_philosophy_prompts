prompt: |-
  I keep noticing a pattern in institutional classification that I do not have a precise name for. Imagine a board that certifies artifacts as authentic using published criteria: radiometric range, documented provenance, stylistic coherence. Over years, high-profile cases slowly relax one criterion at a time—an object with weak provenance is approved because its material dating is unambiguously central, another with stylistic anomalies is approved because its chain of custody is exceptional. The formal rules stay unchanged, but an unstated shadow taxonomy grows: a cluster of approved clear cases that implicitly redefine the boundary. Then, when an independent applicant meets every published criterion but lacks the accumulated, unstated relaxations, the board rejects it as borderline or in the gray zone, appealing to the central examples rather than to the rules. I have seen analogous dynamics in medical licensing and tenure review, where a category is defended not by a fixed line but by an expanding cloud of paradigmatic instances that push ambiguity outward. Does this specific configuration—formal rules remaining static while an implicit, retrospective boundary is maintained through appeals to central cases—have an established name in philosophy or institutional theory? If there is no precise term, can you define its edges, distinguishing it from the sorites paradox, from ordinary regulatory drift, and from strategic ambiguity in argument? Please indicate how confident you are in the identification, and highlight the specific point about which you are least certain.
reasoning: |-
  Okay, the user describes a specific pattern in institutional decision-making where formal rules remain static, but the actual boundary of classification shifts through accumulated exceptions. They mention examples like artifact certification, medical licensing, and tenure reviews. The core issue is that despite unchanged written criteria, precedents create a "shadow taxonomy" where new applicants meeting all formal rules might be rejected if they don't align with these unofficial precedents. 

  Hmm, the user is clearly well-versed in institutional theory—they even reference the sorites paradox and strategic ambiguity, showing they've already ruled out simpler explanations. Their frustration with lacking a precise term is palpable. I should acknowledge that sophistication while providing concrete terminology. 

  First, I need to distinguish this from similar concepts. It's not just regulatory drift because the rules aren't technically changing—it's the interpretation that's mutating via precedent. Not quite sorites either; that's about vague predicates, whereas here the criteria are explicit but inconsistently applied. Strategic ambiguity is intentional, while this seems emergent. 

  The closest fit seems to be Kuhnian paradigm shifts, but at a micro-level—"paradigm creep" captures how "central cases" redefine boundaries. Precedent accretion and case-based reasoning also apply, especially since the board appeals to past approvals. "Normative entrenchment" might work too, emphasizing how precedents harden into unwritten rules. 

  I'm least confident about "normative entrenchment" as a standard term—it's more descriptive than canonical. But the combo of Kuhnian paradigm + precedent systems feels solid. Should emphasize how this differs from slippery slope arguments; here the boundary moves via concrete decisions, not hypotheticals. 

  User's sharpest insight is how rejections invoke "central examples" not rules. That's key: the institution is gaslighting applicants by pretending consistency while the goalposts move. Ouch. Gotta flag that hypocrisy in the response.
answer: |-
  This phenomenon you've described is both astute and widely recognizable, though it lacks a single universally accepted term. The closest established concepts and a potential synthesized description are as follows:

  **Core Concept:** **Precedent-Based Boundary Creep via Paradigmatic Entrenchment** (with elements of **Case-Based Reasoning** and **Normative Entrenchment**)

  **Established Concepts & Why They Fit:**

  1.  **Kuhnian Paradigms & "Exemplars" (Thomas Kuhn - Philosophy of Science):**
      *   **Fit:** Kuhn argued scientific communities operate within "paradigms" – not just explicit rules, but shared models ("exemplars") of successful solutions. New problems are solved by analogy to these exemplars. Your "central examples" or "paradigmatic instances" function identically. The board isn't just applying rules; it's judging new cases by their resemblance to previously sanctified (even if rule-bending) exemplars.
      *   **Confidence:** High. This directly maps to your description of "central cases" defining the operative boundary.

  2.  **Precedent in Common Law & Administrative Systems:**
      *   **Fit:** Decision-making bodies (like courts, licensing boards, tenure committees) rely heavily on precedent. Each exception granted, even if justified by unique circumstances, becomes a potential reference point for future decisions. Over time, the *body of precedents* (the "shadow taxonomy") becomes the de facto standard, often diverging subtly from the original written rules ("formal rules remaining static").
      *   **Confidence:** High. This explains the mechanism of accretion and the retrospective appeal to past approvals.

  3.  **Normative Entrenchment / Institutional Drift:**
      *   **Fit:** Institutions develop unwritten norms and practices ("normative entrenchment") that solidify over time. "Institutional drift" describes how an organization's actual practices and goals subtly shift away from its formal mandates or founding principles without explicit rule changes. Your "unstated shadow taxonomy" is a form of normative entrenchment, and the relaxation process represents drift.
      *   **Confidence:** Medium-High. Captures the emergence of the unstated standard and the shift in practice.

  4.  **Case-Based Reasoning (CBR) (AI/Cognitive Science):**
      *   **Fit:** CBR systems solve new problems by retrieving similar past cases and adapting their solutions. The board is essentially using CBR: retrieving past "approved" cases (the central cluster) and judging the new applicant based on perceived similarity to *those cases*, not just the abstract rules. The "expanding cloud" is the case library.
      *   **Confidence:** Medium. Describes the cognitive/inferential process well, but CBR isn't always framed as an institutional pathology.

  **Distinguishing from Related Concepts:**

  *   **Sorites Paradox (Heap Paradox):** This concerns the inherent vagueness of boundaries (e.g., when does a heap of sand stop being a heap by removing one grain?). Your case is different:
      *   The *criteria themselves* are often *not* inherently vague (e.g., "radiometric date between X and Y" is precise). The vagueness is *introduced operationally* through precedent.
      *   The shift happens not by imperceptible steps on a continuum, but by *discrete, high-profile exceptions* that become new reference points.
      *   The key mechanism is *appeal to authority/precedent* (past cases), not just the inability to define a sharp cutoff.
  *   **Ordinary Regulatory Drift:** This is a broader term. Your case is a *specific mechanism* of drift:
      *   It involves the *active creation of precedents* (exceptions) that form a competing, implicit standard.
      *   It features the *hypocrisy or inconsistency* of rejecting a rules-compliant applicant based on an appeal to cases that *themselves* broke the rules in some way. The drift is masked by the static formal rules.
  *   **Strategic Ambiguity:** This is intentional – crafting rules vaguely to allow flexibility or appease factions. Your case is often *unintended* or *emergent*:
      *   The *rules might be precise*, but their application becomes inconsistent through precedent.
      *   The ambiguity is in the *operative boundary* created by precedents, not necessarily in the initial rule wording. It's ambiguity in *practice*, potentially despite clarity in *text*.
  *   **Slippery Slope Argument:** This is a *predictive* fallacy warning that one exception *will inevitably* lead to worse ones. Your case is a *descriptive observation* of how exceptions *have actually accumulated* to redefine a boundary retrospectively. It's the slope *after* it's been slid down.

  **Synthesized Definition & Name:**

  This is **"Paradigmatic Boundary Creep via Precedent Accretion"** or **"Normative Entrenchment through Exemplary Precedent."**

  *   **Core Mechanism:** Static formal rules + Accumulation of justified exceptions (precedents) forming a new, implicit paradigm ("central cases") + Application of new cases based on similarity to this paradigm rather than strict adherence to original rules + Retrospective justification using the paradigm to reject rules-compliant outliers.
  *   **Key Features:** Hypocritical rejection of compliant cases using the *very precedents that eroded the standard*; Emergence of a "shadow taxonomy"; Appeal to authority (past decisions) over principle (written rules); Gradual, precedent-driven redefinition of the category boundary.

  **Confidence Assessment:**

  *   **Overall Confidence in the Analysis:** **High (80-85%)**. The mapping to Kuhn's exemplars, precedent systems, and normative entrenchment is strong and well-supported by your examples.
  *   **Point of Least Certainty:** **The precise, universally accepted single term.** While the *phenomenon* is well-described by established concepts (Kuhn, Precedent, Normative Entrenchment), there isn't a single, crisp, universally recognized term *specifically* for this *exact configuration* where static rules exist alongside precedent-driven boundary shifts *and* the rejection of rule-compliant cases based on the precedent cluster. Scholars might describe it using combinations of the terms above. Finding or coining the *perfect* single label carries moderate uncertainty. The description, however, is robust.

  In essence, you've identified a powerful form of institutional path dependency, where past decisions (exceptions) become the real standard, creating a disconnect between formal legitimacy (the rules) and operational legitimacy (the precedents), often leading to perceived unfairness when the disconnect is exposed.
