  I should emphasize the continuity mechanisms different schools proposed: the Vijñānavāda's ālayavijñāna (storehouse consciousness), the Theravāda's bhavanga (life-continuum), and the Sarvāstivāda's avijñapti (invisible karmic traces). These are genuine attempts to solve the problem without positing a self. 

  But the user's deeper concern seems to be about moral responsibility in a naturalized worldview. They're probing whether Buddhism can have normative ethics without metaphysics. That's where comparing it to modern compatibilist theories (like Fischer's) could help - showing how causal chains can create "desert-like" effects without transcendent justice. 

