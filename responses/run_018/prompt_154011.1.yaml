answer: |-
  You've identified one of the most profound and enduring philosophical tensions within Buddhist thought. The conflict between karma as moral desert and the doctrines of momentariness (*kṣaṇikavāda*) and no-self (*anattā*) has been debated for over two millennia. Here's a breakdown of established positions, contested interpretations, and possible resolutions:

  ### Well-Established Positions in Buddhist Traditions
  1.  **Non-Negotiables:**
      *   **Karma as Intention-Driven:** All Buddhist schools agree karma (*kamma*) is fundamentally rooted in volition/intention (*cetanā*). "It is volition that I call karma" (AN 6.63).
      *   **Anattā:** There is no permanent, unchanging, independent self/soul (*ātman*) that owns experiences or transfers between lives. This is axiomatic.
      *   **Momentariness (Abhidharma Context):** Mainstream Abhidharma traditions (Theravāda, Sarvāstivāda, Sautrāntika) strongly assert the momentary (*kṣaṇika*) nature of all conditioned phenomena (*saṅkhāra*), including mental states. Dharmas arise and cease instantaneously.
      *   **Karmic Causality:** Actions have consequences (*vipāka*) experienced as pleasant, unpleasant, or neutral feelings/situations. This operates across lifetimes via rebirth (*saṃsāra*).

  2.  **The Core Problem is Acknowledged:** Classical texts and commentaries explicitly grapple with the question: "If there is no self, who experiences the fruit of karma?" (e.g., Milindapañha, Visuddhimagga). The problem is not a modern discovery.

  ### Proposed Solutions & Mechanisms (Philosophically Coherent Attempts)
  Buddhist schools developed sophisticated, yet contested, mechanisms to bridge the gap *without* positing a permanent self:

  1.  **Causal Continuity/Contiguity (Sautrāntika/Theravāda Emphasis):**
      *   **Mechanism:** While each moment is discrete, a causal chain (*santati*) links them. The *cetanā* (intention) in moment N initiates a karmic "seed" (*bīja*), which, due to the law of dependent origination (*pratītyasamutpāda*), influences the arising of subsequent moments, culminating in the "fruit" (*vipāka*) in moment M.
      *   **"Desert":** The "deserving" entity is not a persisting self, but the *causal series itself*. The result "belongs" to the continuum in which the intention arose. It's like a river (series) bearing the consequences of pollution added upstream, even though the water molecules are constantly changing. Buddhaghosa (Theravāda) uses the flame metaphor: one flame lights the next; no identity, but causal continuity.
      *   **Naturalization:** Highly compatible. Karma is a complex, intention-initiated causal law within nature, governed by *pratītyasamutpāda*.

  2.  **Latent Potentials/Invisible Traces (Sarvāstivāda/Vaibhāṣika):**
      *   **Mechanism:** Karma creates a real but non-manifest (*avijñapti*) force or "possession" (*prāpti*) that persists latently in the mental continuum until conditions ripen for its result. Sarvāstivādins controversially held all dharmas (including past/future) exist in some sense, allowing past karma to retain ontological status.
      *   **"Desert":** The latent force "attaches" to the continuum and matures within it. Desert is carried by this karmic potential inherent in the causal stream.
      *   **Metaphysical Weight:** Higher than pure causal contiguity, involves positing subtle ontological entities (*avijñapti, prāpti*).

  3.  **Storehouse Consciousness (Yogācāra/Vijñānavāda):**
      *   **Mechanism:** The *ālaya-vijñāna* (storehouse consciousness) acts as a subliminal stream carrying karmic seeds (*bīja*) from one moment and life to the next. It's constantly changing but provides continuity. It's not a self, but a foundational level of mind-moment continuity.
      *   **"Desert":** Karmic seeds deposited in the *ālaya* ripen as experiences within the continuum sustained by that *ālaya*. Desert is tied to the seed's maturation within the evolving mental stream.
      *   **Metaphysical Weight:** Significant. Posits a subliminal, continuous consciousness. Criticized by other schools (e.g., Madhyamaka) as smuggling in a subtle self.

  4.  **Conventional Person (Madhyamaka/Prasaṅgika - e.g., Candrakīrti):**
      *   **Mechanism:** Rejects *all* inherently existing entities, including subtle continua or *ālaya*. Emphasizes the *conventional reality* (*saṃvṛtisatya*) of the person (*pudgala*) as a dependently arisen label applied to the ever-changing aggregates (*skandhas*).
      *   **"Desert":** Karma operates *conventionally*. It makes perfect sense to say *"this* person (conventionally designated) experiences the results of actions performed by *that* person (conventionally designated in the past) within the same causal continuum, despite the ultimate lack of inherent identity. Moral responsibility and desert are meaningful conventions.
      *   **Naturalization/Normativity:** Desert is a conventional truth with profound practical and ethical weight, guiding liberation. It avoids metaphysics but relies heavily on the two-truths framework. Is this "desert" in a realist sense? Debatable.

  ### Genuinely Contested Issues Among Specialists
  1.  **Is Moral Desert Compatible with Anattā/Momentariness?**
      *   **Yes (Compatibilist):** Most traditional schools argue their mechanisms (causality, continua, seeds, convention) provide sufficient coherence for responsibility and desert *as understood in Buddhism*, distinct from a permanent self-owner.
      *   **No (Hard Incompatibilist):** Some scholars (ancient and modern) argue that without *any* persistent entity (even a conventional "owner" over time), genuine desert evaporates. The "causal series" solution simply relabels the problem – *which part* of the series deserves what? The moment of intention is gone.
      *   **Middle Way (Redefinitionist):** Karma *is* about conditioning and causality. "Desert" is a misleading folk concept implying a deserving *self*. Buddhism offers a more accurate, impersonal account of cause-and-effect with profound ethical implications, but not "desert" in the strong, personal sense. (e.g., interpretations leaning towards Sautrāntika or certain Madhyamaka readings).

  2.  **Does Karma Require a Metaphysical Substratum?**
      *   **Minimalist View (e.g., Sautrāntika, Theravāda):** No. Strict causal laws (*pratītyasamutpāda*) and moment-to-moment conditioning suffice. *Avijñapti* and *ālaya* are unnecessary metaphysical additions. Karma is fully naturalizable within a process ontology.
      *   **Substratum-Necessary View (e.g., Sarvāstivāda, Yogācāra):** Yes. Pure momentariness is too fragmented. Mechanisms like *avijñapti*, *prāpti*, or *ālaya* are essential to explain latency and continuity across gaps in conscious awareness and rebirth. This adds metaphysical weight.
      *   **Conventionalist View (Prasaṅgika Madhyamaka):** The question itself presupposes inherent existence. Karma functions perfectly well *conventionally* without needing *or* denying an *ultimate* substratum. It rejects the dichotomy's applicability.

  3.  **Can Karma Be Fully Naturalized?**
      *   **Yes:** Compatible with interpretations emphasizing causal laws (*pratītyasamutpāda*), psychological conditioning, and conventional personhood without supernatural entities or permanent forces. Karma becomes a complex law of moral psychology/causality.
      *   **No (or Not Fully):** Rebirth necessitates a mechanism for continuity beyond death. Latent potentials (*bīja*, *vāsanā*) or subtle consciousness (*ālaya*) seem to require a non-physicalist or "more-than-strictly-natural" (as per contemporary physicalism) framework, even if not a "soul." The sheer complexity and appropriateness of results can seem to demand more than blind physical cause/effect.

  ### Conclusion: Addressing Your Questions
  *   **Must we conclude karma cannot literally function as a theory of moral desert?** Not necessarily, but it requires careful definition. Traditional schools *do* assert it functions as desert *for the continuum/conventional person*. However, if "desert" *demands* a permanent, identical self-owner, then yes, Buddhism rejects that version of desert. The coherence of their alternatives is the contested point.
  *   **Is there a philosophically coherent way to preserve desert without a continuous bearer?** Yes, multiple schools offer sophisticated attempts: via **causal continuity** (Sautrāntika/Theravāda), **latent potentials** (Sarvāstivāda), a **subliminal stream** (Yogācāra), or **conventional designation** (Madhyamaka). Each has strengths and weaknesses debated for centuries. Their coherence depends on accepting their respective metaphysical or epistemological frameworks.
  *   **Can it be purely causal-psychological?** Absolutely, and this is a major strand (especially Sautrāntika/Theravāda). Karma *is* fundamentally a law of intentional causality shaping experience through conditioning. The "normative weight" comes from the soteriological goal: understanding this causality is key to ending suffering (*duḥkha*). Good actions lead towards liberation; bad actions entangle one in suffering. The imperative is pragmatic, not based on cosmic justice owed *to* a self. However, the language of "desert" (*vipāka* as "fruit" or "result") remains pervasive, blurring the line between causality and normativity.

  **In essence:** Buddhist traditions universally reject desert requiring a *permanent self*. They offer various non-self-based mechanisms for karmic continuity and responsibility (causal chains, latent seeds, subliminal consciousness, conventional persons), all grounded in *pratītyasamutpāda*. Whether these succeed in preserving "moral desert" in a strong philosophical sense, or whether karma is better understood as a unique form of impersonal, normative causality driving *saṃsāra* and liberation, remains a vibrant and unresolved debate central to Buddhist philosophy and comparative ethics. There is no single consensus, only a spectrum of interpretations developed to resolve this very tension.
