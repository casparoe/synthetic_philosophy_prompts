answer: |-
  **Jules abandoned the biopic because Clara Voss had preemptively sued her own legacy for defamation.**

  Dust motes danced in the attic light as Jules lifted the final bundle of Clara Voss's letters. The mathematician, sharp but obscure, had died forgotten. Jules saw a compelling documentary: the overlooked female genius, the quiet struggles, the uncelebrated brilliance – a poignant tragedy. Funding whispers had already begun.

  Then she found it. Not a letter, but a single, typed note clipped to a rejection from a major journal: *"Should my work ever garner attention, I implore any chronicler: do not cast me as your 'tragic genius'. This is not modesty, but a plea against posthumous harm. The archetype consumes the actual person – messy, contradictory, *whole* – and replaces it with a sellable ghost. My life was not a tragedy; it was a life. To flatten it thus is to kill me again."*

  Jules sat back, the attic's chill seeping into her bones. The dramatic arc she envisioned – Clara fighting sexism, battling obscurity, dying unfulfilled – was pure gold. It had conflict, pathos, the satisfying ache of wasted potential the public devoured. But Clara’s words were a scalpel: "*Replaces it with a sellable ghost*." This wasn't about factual inaccuracy; it was about *theft*. The theft of Clara’s right to her own unfiltered complexity.

  She pictured pitching the counter-narrative: Clara content in her work, frustrated but not defined by rejection, her life rich in quiet ways the "tragic genius" template erased. It felt… diffuse. Undramatic. The funders would vanish.

  Jules traced the precise typeface of Clara’s plea. Honor demanded she listen to the dead woman’s stark warning against becoming a commodity. But art demanded a story. Her fingers hovered over her notebook, the biopic outline gleaming with manufactured sorrow. Then, slowly, she closed it. She picked up Clara's damning note, the true heart of the story.

  The documentary wouldn't be about Clara the tragic mathematician. It would be about the note, the dilemma, the uncomfortable debt owed to the dead: not just respect, but the integrity of their irreducible selves. Jules would film the empty attic, the boxes, her own struggle. The drama wouldn't be Clara’s, but the cost of choosing her messy truth over a clean, sellable lie. What do the dead own, Jules wondered, but their truth?
