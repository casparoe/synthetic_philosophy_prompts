     Therefore, if they believe that Team B is likely to commit (high p), and if they choose to not commit, they face a very bad outcome. But they can choose to commit and only face -91 in expectation if both commit (which is better than -100). Or if they think both commit is very likely, then committing gives -91, which is still better than preempting (-100) or not committing (which would give -1000p).

     So they would choose to commit if p < 50/91, or not commit if p>=50/91, and then face -1000p. If p>=50/91, then -1000p might be very bad. For example, if p=0.6, then not commit gives -600, which is worse than -100. So then they might prefer to preempt.

     But note: preempt gives -100, which is better than -600. So if p>=50/91 and they believe that by not preempting they will choose not to commit and then get -1000p, which is worse than -100, then they would preempt.

     However, they have the option, if they don't preempt, to choose to commit or not. They will choose the best among commit and not commit. So the expected payoff of not preempting is max(50-141p, -1000p).

     If p>=50/91, they choose not commit and get -1000p.

     Then, they would compare max(50-141p, -1000p) to -100.

     For p in [50/91, 1]:
          -1000p is always <= -1000*(50/91)≈ -549.45, which is < -100.

     So if p>=50/91, then the best they can get without preempting is -1000p, which is always < -100 for p>0.1.

     Therefore, if p>=50/91, they would choose to preempt because -100 > -1000p.

     If p<50/91, then the best without preempting is 50-141p. We need to check if 50-141p < -100?
          50-141p < -100 -> 150 < 141p -> p>150/141≈1.06 -> impossible.

     So only when p>=50/91, they preempt.

     This captures the idea: if the probability that the opponent commits is high enough (>=50/91), then Team A will preempt.

     And why would Team B commit? Because if Team B believes that Team A is unlikely to commit, then by committing, Team B can gain +50 (if Team A does not commit) or face -91 (if Team A also commits). So Team B might commit if they think Team A is unlikely to commit.

     This is the delegated irrationality paradox: committing (which is good if the other doesn't) might make the other preempt if they think you are likely to commit.

     So with payoffs:

     - Preemption: -100
     - Backing down: -1000 (extreme loss of credibility, political collapse, etc.)
     - Both escalate: 90% MAD (-100) and 10% Brink (-10) -> expected -91
     - You escalate and the other backs down: +50
     - Neither escalates: 0

     And the structure as above.

     This might work.

     However, backing down is set to -1000, which is arbitrary but necessary to make preemption attractive.

     In the game, we can explain that backing down means complete loss of credibility and influence, which could be existential for a regime.

     So let's go with this.

     Payoff summary for the game:

     - If either team preempts in Round 1: both get -100.
     - If no preemption, then in Round 2:
          - If a team committed, they escalate.
          - If a team did not commit, they do not escalate (so they back down).
     - Then:
          - If only one team escalates: escalator gets +50, the other -1000.
          - If both escalate: then 90% chance both get -100, 10% chance both get -10. (Facilitator flips a weighted die or uses a random number. For simplicity, we can use a 10-sided die: if 1-9: MAD, if 10: Brink.)
          - If neither escalates: 0,0. (But in our rules, this only happens if both did not commit, and then both do not escalate.)

     Note: if both committed, then both escalate -> risk of destruction.
     If only one committed, then that one escalates and the other does not -> +50 for the escalator, -1000 for the other.
     If neither committed, then both do not escalate -> 0,0.

     Now, the game:

     Round 1:
        - Teams decide secretly: 
            a) Preempt: Yes or No.
            b) Commit: Yes or No.
        - Reveal preempt. If any Yes, then both -100, game over.
        - If no preempt, reveal commit.

     Round 2:
        - Teams that committed must escalate.
        - Teams that did not commit do not escalate (they back down).
        - Facilitator determines outcome based on the above rules.

     This is simple enough.

     Now, for the simulation:

     We can run it for several rounds (iterations) to allow learning. But we have 75 minutes, and we also need debrief.

     Alternatively, we can have multiple independent games. But with 8 people, we have two teams. We can have them play a series of, say, 5 games, and then switch opponents or something? But time.

     Given the time, we might have time for two or three plays. But the first play will be exploratory.

     What will predictably go wrong the first run?

     - Teams might not understand the payoffs and make mistakes.
     - They might not commit at all, to avoid the risk. Then in Round 2, if no one committed, they both get 0. That's safe, but they forgo the chance to gain +50.
     - Or they might all commit and then face the high risk of destruction.
     - The team that is facing a committed opponent and has to back down might feel cheated and next time might preempt or commit more.

     Also, in the first run, they might not preempt even if the probability of the opponent committing is high, because they don't realize that not preempting and then having to choose to not commit (and then back down) will yield -1000.

     The facilitator should not explain the optimal strategy beforehand.

     Debrief:

     After the game, discuss:

     - What happened in each round? 
     - When did preemption occur? Why?
     - When did teams commit? What was the outcome?
     - How did it feel to be committed and see the other back down? 
     - How did it feel to have to back down and lose 1000 points?
     - Did any team preempt? Why? (Probably not in the first game.)

     Then, map to the concepts:

     - Ex-ante rationality: Committing in Round 1 to make sure that you will escalate in Round 2 is rational because it allows you to gain if the opponent does not commit (you get +50) and if they do commit, you get -91 which is still better than -1000. But without knowing the opponent's choice, it might be worth the risk.

     - But ex-post, if both commit, they face -91 in expectation, which is worse than if they could renegotiate and both back down (0). But they can't because they are committed.

     - The paradox: committing to make your threat credible might increase the chance that the opponent will preempt (if they believe you are likely to commit) to avoid having to back down and get -1000.

     - In the game, teams might learn that if they commit, the opponent might preempt in the next game.

     What the game can't reproduce:

     - The actual existential weight: the points are just numbers, but in reality, the decisions are about survival and the fate of millions.
     - The fact that in reality, there is no resetting and playing again. This is a one-shot game for humanity.
     - The game simplifies the communication and the ability to observe and interpret signals.

     Separating settled theory from contested issues:

     - Settled: The logic of the commitment strategy to make threats credible. The concept of "threat that leaves something to chance" (Schelling).
     - Contested: Whether this dynamic actually makes nuclear deterrence unstable or not. Some argue that the very high stakes make decision-makers very cautious, and the commitment is never total. Also, there are other factors (second-strike capability, early warning systems, etc.) that might mitigate the risks. Moreover, the extreme payoff for backing down (-1000) might not be realistic; in practice, states have backed down without regime collapse (e.g., Cuban Missile Crisis). Additionally, the probability of accidental war given both escalating is not known and might be lower than 90%.

     So the game illustrates the theoretical paradox, but whether it happens in practice is contested.

