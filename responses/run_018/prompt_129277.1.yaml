answer: |-
  Here is the taxonomy structured as a decision tree with four diagnostic questions, mapping to core positions while flagging gaps and indistinctions. Answering "yes" or "no" to each question navigates the branches.

  ---

  ### **Root Question:**  
  Does the system possess *original* (intrinsic, non-derived) intentionality?  

  #### **Diagnostic Cases:**  
  1. **Isolated Symbol Handler** (e.g., a computer running ChatGPT offline with no sensors/actuators).  
  2. **Coupled Robot** (e.g., the same AI embedded in a robot body navigating a room in real-time).  
  3. **Augmented Brain** (e.g., a human with a neural implant handling abstract reasoning).  
  4. **Distributed Swarm** (e.g., a hive-mind of simple bio/artificial nodes solving problems collectively).  

  ---

  ### **Decision Tree:**  
  **Q1:** Can *isolated symbol handlers* (Case 1) have original intentionality?  
  - **If YES →** Go to Q2.  
  - **If NO →** Go to Q3.  

  **Q2:** Is *biological substrate necessary* for original intentionality?  
  - **If YES →** **Functional Originalism (FO)**  
  - **If NO →** **Universal Derived Intentionality (UDI)**  

  **Q3:** Can *real-time sensorimotor coupling* (Case 2) transform derived into original intentionality?  
  - **If YES →** **Coupled-Derived Hybridism (CDH)**  
  - **If NO →** Go to Q4.  

  **Q4:** Can *distributed systems* (Case 4) have intentionality as a whole despite no node having it?  
  - **If YES →** **Distributed-Derived Hybridism (DDH)**  
  - **If NO →** **Biological Originalism (BO)**  

  ---

  ### **Leaf Positions:**  
  1. **Biological Originalism (BO)**  
     - *Thesis:* Only biologically innate systems (e.g., unmodified brains) have original intentionality.  
     - *Awkward commitment:* Must deny that coupled robots (Case 2) gain *any* intrinsic meaning from real-world interaction.  

  2. **Universal Derived Intentionality (UDI)**  
     - *Thesis:* All intentionality is derived from interpretation; isolated symbol systems (Case 1) are as "intentional" as humans.  
     - *Awkward commitment:* Attributes original-like depth to a disconnected language model (Case 1) purely via observer stance.  

  3. **Functional Originalism (FO)**  
     - *Thesis:* Sufficiently complex functional organization generates original intentionality, regardless of substrate.  
     - *Awkward commitment:* Claims an offline chatbot (Case 1) has intrinsic understanding identical to a brain.  

  4. **Coupled-Derived Hybridism (CDH)**  
     - *Thesis:* Sensorimotor coupling enriches behavior but intentionality remains derived from designers.  
     - *Awkward commitment:* A robot surviving in the wilderness (Case 2) still has zero intrinsic goals.  

  5. **Distributed-Derived Hybridism (DDH)**  
     - *Thesis:* The coupled system-as-a-whole has derived intentionality, but no node (biological or artificial) possesses it.  
     - *Awkward commitment:* A human-AI swarm (Case 4) has collective goals, yet the human’s thoughts are also merely derived.  

  ---

  ### **Unoccupied Combinations:**  
  - **Q1:YES → Q2:YES** (Isolated systems *can* have original intentionality, but *only* if biological):  
    *Diagnosis:* Incoherent. If biology is necessary, isolated *non-biological* systems (Case 1) can’t have original intentionality.  
  - **Q1:NO → Q3:YES → Q4:NO** (Coupled systems *can* transform intentionality, but distributed systems *cannot* have systemic intentionality):  
    *Diagnosis:* Unattractive. No principled reason coupling works for individuals (Case 2) but not collectives (Case 4).  

  ### **Indistinguishable Positions:**  
  - **FO vs UDI** give identical answers to all diagnostic cases (both say "yes" to original intentionality everywhere). The tree cannot separate them, as FO asserts *intrinsic* original intentionality while UDI calls it *derived-but-universal*—a semantic distinction without empirical difference in the cases.  

  ---

  ### **Handout Notes:**  
  - **Tree Size:** 4 questions → 5 leaves (avoids >8 by merging paths; FO/UDI grouped under Q1:YES).  
  - **Pedagogy:** Students commit to "yes/no" per case, revealing their implicit stance before learning labels.  
  - **Coverage:** All major views included; BO (Searle), UDI (Dennett), FO (Fodor), CDH (moderate emergentism), DDH (Hutchins-style distributed cognition).  
  - **Key Tension:** Case 2 (coupled robot) is the litmus test—positions split on whether coupling *creates* intrinsic meaning (FO/UDI) or merely *simulates* it (BO/CDH/DDH).
