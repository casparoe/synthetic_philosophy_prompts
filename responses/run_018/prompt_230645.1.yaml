  Considering the target audience (philosophy of mind scholars), the fresh value lies in: 1) isolating M as distinct from S/A, and 2) pressing whether operationalism drives the model more than biology. Suggested revisions would be to sharpen the confidence objection and engage with Dennett's "Orwellian vs. Stalinesque" distinction more explicitly.

