prompt: |-
  I'm trying to work out my actual stance on whether societies should celebrate or resent highly successful individuals, and my gut reactions seem to pull in opposite directions depending on details I can't quite articulate. I was discussing this with friends after a course session on distributive justice, and I realized that neither the American Dream narrative—where upward mobility is inherently admirable—nor the Scandinavian Jantelagen or Anglo tall-poppy syndrome—where standing out invites moral suspicion—fully captures my intuitions. So I'd like to see whether there's a coherent principle behind my verdicts, or whether I just have to live with the tension.

  Here are my judgments on concrete cases. A first-generation immigrant starts a regional restaurant chain, is profiled as a hometown hero, and uses profits to fund local apprenticeships. That feels right to celebrate: the success seems to multiply opportunity rather than extract it from the community she left. But consider a scholar from the same working-class town who earns tenure at an elite university, publishes a memoir calling her origin backward, and never returns. There I feel the Jantelagen impulse strongly—her success feels like betrayal, not mere departure. A musician becomes nationally famous, lives modestly, and endows local schools; I think celebration should persist. Yet when a collective of artisans develops a unique ceramic technique and one member patents it individually to license exclusively to luxury brands, I want to cut her down, even though she technically "succeeded" by every conventional metric. Meanwhile, a farmer who scales up, outcompetes neighbors through efficiency, and buys their land: my reaction splits. The achievement looks like classic American Dream material, but the erosion of the local social fabric makes celebration feel hollow.

  The pair that troubles me most is the restaurant founder versus the scholar. Both achieved upward mobility, both left, both profited—yet I celebrate one and resent the other. Is the difference that one maintained solidarity while the other severed it? Or is that just post-hoc rationalization? The case I keep circling back to is a star athlete from a poor rural region who signs a massive contract and moves away, but sends substantial money home anonymously. Is the anonymity a virtuous modesty that makes his success palatable—an appropriate check on tall-poppy arrogance—or does it reveal an unhealthy shame about standing out, precisely the pathology the American Dream is meant to reject? And what about the self-taught engineer who patents a genuinely life-saving water filter, becomes wealthy, but refuses to license the design to developing-world manufacturers on cost grounds? I oscillate between seeing this as legitimate property-right success and as extraction masked by innovation rhetoric.

  Is there one principle—perhaps distinguishing multiplication success from extraction success, or tracking whether upward mobility extends solidarity rather than severing it—that delivers all these verdicts? Or must I drop one, and if so, which? In particular, can any principle explain why I celebrate the founder but resent the scholar without collapsing into pure favoritism? And what does the best principle predict for the anonymous athlete and the patent-holding engineer? Please also say where your reasoning is most likely to fail: what specific argument or observation about communal obligation versus individual merit would lead you to overturn your preferred principle, or to switch which of my verdicts you treat as the mistaken one?
reasoning: |-
  Okay, let's start by really unpacking what the user is struggling with. They're conflicted about whether societies should celebrate or resent highly successful individuals. Their gut reactions vary across different scenarios, and they can't pinpoint why. The examples they provided show this tension clearly—they celebrate the immigrant restaurant owner but resent the scholar who left her hometown and criticized it. 

  First, I need to identify the underlying principles in their judgments. They mentioned terms like "multiplication vs. extraction" and "solidarity vs. severance." Let me map their reactions to each case. The restaurant owner creates opportunities locally, which aligns with multiplication and maintaining solidarity. The scholar, though successful, cuts ties and disdains her roots, which feels extractive and severing solidarity. 

  The musician case is straightforward—success with community support. The artisan who patents a collective technique individually is resented because she privatizes shared knowledge, turning collective effort into personal gain. That’s clearly extraction. The farmer scaling up is tricky—efficiency is celebrated in the American Dream, but the community suffers, so it's a mix. 

  The star athlete sending money anonymously is interesting. The user wonders if anonymity is modest or shameful. Here, the athlete maintains solidarity by supporting home but avoids flaunting success. That fits the solidarity principle—helping without seeking recognition. 

  The engineer with the life-saving patent refusing affordable licensing is tough. Legally, it's his right, but ethically, withholding a life-saving innovation feels extractive, prioritizing profit over lives. This clashes with the multiplication principle because the tech could multiply benefits but is restricted.

  Now, the core conflict between the restaurant owner and scholar. Both left, but the owner gives back, maintaining ties. The scholar disconnects and disparages. The difference is reciprocity and respect. Solidarity isn't just physical presence but acknowledging roots and contributing back. The scholar’s memoir criticizing her hometown is a betrayal, severing solidarity.

  Testing the solidarity principle against other cases: the artisan case—solidarity broken by privatizing collective work. The farmer—efficiency over community solidarity. The athlete—anonymous support maintains solidarity without arrogance. The engineer—prioritizes profit over communal well-being, failing solidarity.

  Where could this principle fail? If someone succeeds without the capacity to give back (e.g., due to personal constraints), resenting them might be unfair. Also, what if the community was oppressive? Forcing solidarity could be unjust. The scholar might have valid reasons to leave and criticize, but the user's resentment hinges on the disdain, not the departure itself.

  For the engineer, the principle suggests resentment if they hoard life-saving tech. But if the patent funds further innovation, maybe it's multiplicative long-term. However, immediate harm might outweigh future benefits. The user’s unease here points to a conflict between individual rights and communal needs.

  So the solidarity principle works across cases, but exceptions exist. The key is reciprocal contribution and respect for origins. Anonymity in giving is virtuous modesty, not shame, as it avoids hubris. The scholar’s case is resented due to active denigration, not just leaving. 

  The user needs to accept some tension but can use the solidarity/multiplication lens. They should also consider context—like whether the community supported the individual’s success or if there were injustices. That’s where the principle might need nuance.
answer: |-
  Your intuitions reveal a remarkably coherent ethical framework centered on **reciprocal communal bonds**. The core principle distinguishing your reactions is: **Success deserves celebration when it multiplies opportunity within the communities that shaped the individual, but risks resentment when it extracts value without reciprocity or actively severs those bonds.** 

  This resolves your cases as follows:

  ### Case Breakdown Using the Principle
  1. **Immigrant Restaurant Founder (Celebrate)**  
     - **Multiplication:** Creates jobs/funding *within* her community.  
     - **Solidarity:** Success explicitly benefits those who supported her ascent.  
     - *Verdict:* **Celebration**—success reciprocates communal investment.

  2. **Tenured Scholar (Resent)**  
     - **Extraction:** Uses her origin as a narrative device but disdains it.  
     - **Severance:** Cuts ties intellectually and materially; success *depletes* her community’s human capital.  
     - *Verdict:* **Resentment**—violates reciprocity by treating her roots as a ladder to kick away.

  3. **Modest Musician (Celebrate)**  
     - **Multiplication:** Endows local schools, sustaining opportunity.  
     - **Solidarity:** Maintains connection despite fame.  
     - *Verdict:* **Celebration**—success radiates outward.

  4. **Artisan Patent-Holder (Resent)**  
     - **Extraction:** Privatizes collectively developed knowledge.  
     - **Severance:** Profits from communal ingenuity while excluding collaborators.  
     - *Verdict:* **Resentment**—success exploits shared resources without sharing returns.

  5. **Efficient Farmer (Mixed)**  
     - **Multiplication:** Scaling up is individually meritorious (efficiency).  
     - **Extraction/Severance:** Destroys local livelihoods and social fabric.  
     - *Tension:* Individual merit vs. communal harm. Your split reaction reflects this duality.

  ### Resolving the Central Tension: Founder vs. Scholar
  Your divergent reactions here **do not stem from favoritism**. The difference is:  
  - The founder’s success **strengthens communal bonds** (funding apprenticeships = reciprocity).  
  - The scholar’s success **weaponizes her origin** (memoir calling it "backward" = severance + disdain).  
  The key is **not physical departure** but whether the success acknowledges and **reinvests in the relational fabric**. The scholar’s betrayal isn’t leaving—it’s denying her community’s worth after benefiting from it.

  ### Anonymous Athlete & Patent Engineer: Predictions
  - **Anonymous Athlete:**  
    Your principle predicts **celebration**. Anonymity avoids arrogance (aligning with Jantelagen’s modesty), while sending money home demonstrates **solidarity**. This is *reciprocity without self-aggrandizement*—the ideal balance.  
    - *Why not shame?* Anonymity here signals humility, not denial of roots. It checks hubris without rejecting community.  

  - **Patent-Holding Engineer:**  
    Your principle predicts **resentment**. While innovation is laudable, refusing affordable licensing turns life-saving knowledge into an **extractive tool**. Success here *restricts* opportunity for vulnerable communities, violating reciprocity. Property rights don’t override the communal obligation to multiply essential goods.  
    - *Counterargument:* If profits fund further innovation (e.g., better filters), it *could* become multiplicative long-term. But your intuition targets immediate harm: hoarding life-saving tech prioritizes profit over solidarity.

  ### Where the Principle Fails: Key Vulnerabilities
  1. **The "Burdened Genius" Scenario**:  
     What if the scholar faced systemic abuse in her hometown? Her memoir criticizes legitimately oppressive structures. Your principle might over-penalize "severance" when communities *deserve* to be left. **Observation to challenge me**: If communal bonds were coercive or exploitative, severance becomes self-preservation—not betrayal.  

  2. **Scale of Impact Dilemma**:  
     Consider a scientist whose cancer drug is priced prohibitively but funds universal AI-driven diagnostics. Your principle resents the extraction (high drug prices), but the larger multiplicative effect might justify it. **Failure point**: When extraction in one domain enables massive multiplication elsewhere, should we prioritize scale over local reciprocity?  

  3. **The Unseen Contributor**:  
     What if the scholar anonymously funds town scholarships? Your framework celebrates material reciprocity—but what if she *intellectually* elevates similar communities through policy work? **Vulnerability**: Overvaluing tangible/local contributions undervalues intangible/global ones.

  ### Refinement: The Reciprocity-Scale Matrix
  To address these, layer your principle with two axes:  
  - **Reciprocity** (Severance ↔ Solidarity)  
  - **Scale of Impact** (Extractive ↔ Multiplicative)  
  Success in the **Solidarity-Multiplicative quadrant** (e.g., restaurant founder) always deserves celebration. **Severance-Extractive** (patent engineer) invites resentment. Mixed cases (farmer, scholar) require weighing harms/benefits.  

  **Conclusion**: Your instincts are philosophically robust. Tension persists only in edge cases where reciprocity conflicts with scale or justice—but this is a feature, not a bug. It forces context-sensitive judgment, avoiding rigid dogma. The anonymous athlete and modest musician embody your ideal: success that elevates *with* others, not *over* them.
