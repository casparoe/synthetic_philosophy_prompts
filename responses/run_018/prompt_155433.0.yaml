  The compromise position I'm considering: epistemic modesty requires holding both views simultaneously. Maintain conviction proportionate to your inside-view justification strength, but shrink confidence intervals radically because the outside-view says human justification is often wrong even when it feels airtight. Peer disagreement then becomes an alarm bell—not proof you're wrong, but proof your confidence was probably inflated. 

