  The reflexive problem is fascinating. When I try to apply base rates of human error to my current judgment, I'm using my judgment to do so. It's like trying to measure a ruler with itself. This creates a paradox where the outside-view can't be neutrally applied because the tool of application is the suspect tool itself. 

