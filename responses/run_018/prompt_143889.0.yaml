  This is a sophisticated philosophical inquiry. The user clearly has deep familiarity with the debate, as evidenced by their nuanced understanding of feature-shifting cases, epistemic difficulties, and the distinction between ontological and epistemic claims. They seem to be a philosopher or advanced philosophy student wrestling with this longstanding impasse.

  Let me break down their key questions: First, they want to know if this is a substantive disagreement about moral reality, a methodological dispute, or an ill-posed question. Second, they ask what would count as progress in resolving it. They specifically mention possibilities like formal models, conceptual distinctions, empirical studies, or abandoning shared vocabulary.

  I need to analyze the commitments of each side carefully. For particularists, they're committed to the holism of reasons - that moral properties emerge from the entire context. Generalists, meanwhile, are committed to the modularity of reasons - that features have stable valence that can be weighed. This isn't just about principles; it's about the fundamental structure of moral explanation.

  The disagreement appears substantive rather than verbal. Both sides use "principle" similarly but disagree about what moral explanation requires. It's also not about different questions - both are making metaphysical claims about how reasons function.

  For progress, I think conceptual clarification is crucial. We need to distinguish between the metaphysics of reasons (whether they're inherently contextual) and the epistemology of moral judgment (whether we can codify principles). Empirical work could help too - if we find moral cognition is fundamentally holistic, that supports particularism. But the core issue is metaphysical: what makes actions right or wrong?

  Breaking the impasse might require showing that holism doesn't preclude principled judgment, or that modularity can accommodate deep context-sensitivity. Progress could come from formal models that capture non-compositional reasoning or empirical studies showing how humans actually combine moral reasons.

