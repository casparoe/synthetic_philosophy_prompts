  ### Decision Tree: Modal Metaphysics of Object Identity Across Worlds  
  Using the case of a ceramic vase that might be (i) fired at a different temperature, (ii) shattered and rebuilt, or (iii) matched by a qualitatively identical but causally disconnected vase in another world. Answer based on intuitions about these scenarios.  

  ---

  #### **Question 1**  
  In a world where the vase is fired at a different temperature (affecting its color/sturdiness), is this *the very same vase* as the actual one?  
  - **Yes** → Proceed to **Question 2**.  
  - **No** → Proceed to **Question 4**.  

  #### **Question 2**  
  Could the vase exist in a world where it has a *different origin* (e.g., made from different clay, by a different potter)?  
  - **Yes** → **Leaf: Bare-Identity Haecceitism**  
    - *The vase is identical across worlds solely due to a primitive "thisness" (haecceity), independent of qualitative properties or origin.*  
  - **No** → Proceed to **Question 3**.  

  #### **Question 3**  
  In a world where the vase is *shattered and rebuilt from the same fragments*, is the rebuilt vase the same as the original?  
  - **Yes** → **Unnamed Position**  
    - *Transworld identity requires same origin but allows discontinuous existence (e.g., reassembly). Logically possible but rarely defended; may imply vague persistence conditions.*  
  - **No** → **Leaf: Kripkean Transworld Identity**  
    - *The vase is identical across worlds only if it preserves essential properties (e.g., origin, material) and continuous existence.*  

  ---

  #### **Question 4**  
  When we say "the vase could have been fired differently," does this require a *distinct object* in another world that resembles the actual vase?  
  - **Yes** → Proceed to **Question 5**.  
  - **No** → **Leaf: Anti-Realist/Deflationary Denial**  
    - *Cross-world "identity" is not literal; talk of "possible objects" is shorthand for descriptions, conventions, or conceptual tools.*  

  #### **Question 5**  
  Could a single world contain *multiple objects* that each qualify as the vase’s counterpart? (e.g., two vases equally similar to the actual one.)  
  - **Yes** → Proceed to **Question 6**.  
  - **No** → Proceed to **Question 6**.  

  #### **Question 6**  
  Is the relation between the actual vase and its counterparts *constrained by the actual world’s metaphysical privilege*? (e.g., counterparts must be "accessible" from actuality via a unique grounding relation.)  
  - **Yes** → **Unnamed Position**  
    - *Counterparts exist but depend on a privileged actual world (e.g., causal accessibility). Coherent but unexplored in major theories; may align with actualist intuitions.*  
  - **No** →  
    - If **Question 5 = Yes**: **Leaf: Lewisian Counterpart Theory**  
      - *The vase has multiple counterparts per world based on contextual similarity; no transworld identity or actual-world privilege.*  
    - If **Question 5 = No**: **Unnamed Position**  
      - *Unique counterpart per world, chosen by similarity without actual-world constraints. Logically possible but unmotivated; risks arbitrariness.*  

  ---

  ### Notes  
  1. **Coverage of Essential Splits**:  
     - **Qualitative similarity**: Handled by **Q1** (allowing variation implies it’s insufficient alone).  
     - **Causal/spatiotemporal continuity**: Handled by **Q3** (reassembly scenario).  
     - **Multiple counterparts**: Handled by **Q5**.  
     - **Privileged relation to actuality**: Handled by **Q6**.  

  2. **Unnamed Positions**:  
     - **Transworld identity with reassembly (Q3→Yes)**: Coherent but unattractive; conflates identity with reassembly.  
     - **Privileged-actuality counterpart (Q6→Yes)**: Unexplored; may bridge actualism and counterpart theory.  
     - **Unique counterpart without privilege (Q5→No + Q6→No)**: Coherent but unstable; no major theory defends this.  

  3. **Indistinguishable Leaves**:  
     - *Kripkean transworld identity* and *bare haecceitism* are distinguished by **Q2** (origin essentiality).  
     - *Lewisian counterpart theory* and *anti-realism* are distinguished by **Q4** (existence of counterparts).  
     - **No two leaves share identical paths**; all positions are separable.  

  4. **Scenario Coverage**:  
     - **Firing temperature (i)**: Tests qualitative variation (**Q1**).  
     - **Shattering/rebuilding (ii)**: Tests continuity (**Q3**).  
     - **Qualitatively identical duplicate (iii)**: Tests counterpart multiplicity (**Q5**) and haecceitism (**Q2**).  

