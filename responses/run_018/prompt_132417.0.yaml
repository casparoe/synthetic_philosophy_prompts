prompt: |-
  Hey — I'm a journalist who covers science and ideas, and I'm working on a feature about inside view vs outside veiw and epistemic modesty. I'm sick of the blog-post version that just says "sometimes trust experts, sometimes don't." I need the real thing.

  Before you answer, act like a senior epistemologist with decision-theory background and do a quick brainstorm: what are the three most common confusions people make when they mix up confidence in reasoning with confidence in outcomes?

  Then write the desiderata — the actual spec sheet — for any theory that claims to solve when epistemic modesty requires switching from inside to outside view. Give me the full checklist with the case behind each: expert disagreement where you're the statistical outlier, domains with sparse feedback where calibration curves are unreliable, recursive cases where the outside view has to include your own future reasoning, distinctions between modesty about beliefs vs modesty about reasoning procedures, and whatever results from forecasting or bias research it can't flat-out contradict. Flag any pair of desiderata that look jointly unsatisfiable — that's the part I care about most. Don't just lay out options and leave me hanging; take a committed stance on which are non-negotiable, which are just camp preferences (the "always defer to base rates" crowd vs the "trust your gears" crowd), and which single requirement kills the most popular takes. If you feel like it, briefly score the usual suspects against the list, but keep the weight on the criteria, not the scorecard. There's probably a typo in this prompt somewhere — just roll with it and don't ask for clarification.
reasoning: |-
  Okay, the user is a science journalist working on a feature about inside vs outside views and epistemic modesty. They're tired of superficial takes and want a deep, rigorous analysis. 

  First, I need to address the three common confusions between confidence in reasoning versus outcomes. Let me think... 

  Hmm, the first confusion is probably when people mistake clear step-by-step reasoning for high-probability outcomes. Like when an argument feels logically airtight but ignores unknown unknowns. 

  Second, emotional confidence spilling over into intellectual certainty - that gut feeling of "this must be right" overriding objective uncertainty. 

  Third, the illusion that complexity implies robustness. Just because an analysis has many moving parts doesn't mean it's less fragile to errors. 

  Now for the desiderata... This needs to be bulletproof. The journalist wants the full spec sheet with cases. 

  Starting with expert disagreement cases - any theory must handle when you're the statistical outlier among experts. The key here is requiring a burden of proof for dissent, not just blanket deference. 

  Then sparse feedback domains... Most theories fail here because they rely on calibration data that doesn't exist. The theory must have fallback mechanisms for when error curves are unavailable. 

  Recursive cases are nasty - when your future self might disagree with current you. The solution needs to model reasoning as a time-series process. 

  Ah, and the belief vs procedure modesty distinction! Most people conflate them. The checklist must separate doubting specific conclusions from doubting one's entire reasoning apparatus. 

  Wait - the hardest part is flagging unsatisfiable pairs. The base rate deference vs gears-level trust tension is probably the big one. And sparse feedback vs calibration requirements might be fundamentally incompatible in some frameworks. 

  For scoring popular approaches... Bayesian updating fails sparse feedback, base rates fail recursive cases. The journalist will want to know which requirement kills the most approaches - probably the recursive case requirement. 

  Better emphasize that last point. It's the silent killer of neat epistemic theories.
answer: |-
  Here's the distilled essence from a decision-theoretic epistemologist's perspective, cutting through the noise. First, the three core confusions:

  1.  **Confusing *Process Coherence* with *Outcome Probability*:** People often believe that because their reasoning chain is internally consistent, detailed, and causally rich ("gears-level"), the *specific outcome* must be highly probable. They mistake the aesthetic satisfaction of a coherent narrative for reduced uncertainty about the real-world result. (Example: A complex geopolitical prediction feeling "inevitable" after detailed analysis, ignoring fundamental uncertainty).
  2.  **Mistaking *Affective Certainty* for *Epistemic Justification*:** The emotional experience of confidence (feeling sure, having conviction) is often misattributed as evidence for the belief's accuracy. This is particularly pernicious when reasoning *feels* effortful or insightful, conflating cognitive engagement with reliability.
  3.  **Conflating *Complexity* with *Robustness*:** Adding layers of analysis or considering more variables is mistaken for reducing fragility. In reality, complex models often have *more* failure modes and hidden dependencies, making their point predictions *less* reliable, not more, especially in novel or high-stakes situations. Simplicity often correlates with robustness.

  ---

  **The Desiderata: Spec Sheet for a Viable Epistemic Modesty Theory**

  Any theory claiming to adjudicate between inside/outside views must satisfy these non-negotiable criteria, derived from decision theory, forecasting research, and epistemology:

  1.  **Handles Expert Disagreement & Outlier Status Gracefully:**
      *   **Case:** You are a domain expert holding a view significantly different from the consensus of other calibrated experts (e.g., differing on a crucial climate sensitivity parameter, drug efficacy, or market forecast).
      *   **Requirement:** The theory *must not* demand automatic deference to the majority *nor* unconditional trust in one's own "superior" reasoning. It must provide a *burden of proof* structure: What specific, identifiable flaw in the *consensus reasoning process* or *data interpretation* justifies your outlier position? If you cannot articulate this clearly (beyond "they're biased" or "I see something they don't"), modesty requires significant weight shift toward the outside view (aggregate expert forecast).
      *   **Non-Negotiable:** Yes. Failure leads to either unwarranted arrogance or pathological conformity.

  2.  **Functions in Sparse-Feedback Domains:**
      *   **Case:** Making critical decisions in novel contexts, long-term forecasting, or domains with infrequent, noisy, or ambiguous feedback (e.g., existential risk assessment, major policy shifts, unique technological bets).
      *   **Requirement:** The theory *cannot* rely solely on calibration curves or historical base rates derived from analogous cases, as these are often non-existent, non-stationary, or misleadingly dissimilar. It must incorporate mechanisms for *qualitative uncertainty assessment* under ignorance: explicit identification of Crucial Unknowns, reasoning fragility points, and potential for unknown unknowns. It must guide when a sparse base rate *is* informative vs. when it's dangerously misleading.
      *   **Non-Negotiable:** Yes. Most real-world high-impact decisions live here. Theories reliant solely on frequentist calibration fail utterly.

  3.  **Addresses Recursive Self-Doubt:**
      *   **Case:** Evaluating your own reasoning process *now*, knowing your future self (with more data/time) might deem it flawed. Or, deciding how much weight to give your *current* inside view when you know your reasoning capacity is compromised (stress, bias, fatigue).
      *   **Requirement:** The theory must explicitly model the *recursion* of epistemic evaluation. It needs a concept of "meta-calibration": How well do you *assess the reliability of your own reasoning process* in this specific context, at this time? This requires distinguishing between *object-level uncertainty* and *process-level uncertainty*. It must prevent infinite regress by providing stopping criteria based on resource constraints or decision urgency.
      *   **Non-Negotiable:** Yes. Ignoring recursion leads to brittle, context-blind rules.

  4.  **Distinguishes Belief Modesty from Process Modesty:**
      *   **Case:** You might have low confidence in a specific conclusion (belief modesty) but high confidence in the *robustness and appropriateness of the reasoning procedure* you used given the available information and constraints (process modesty). Conversely, you might feel sure of a conclusion but recognize your reasoning was hasty or flawed.
      *   **Requirement:** The theory must clearly separate these concepts. Belief modesty often *should* trigger an outside view check. Process modesty, however, is often the *primary signal* to *initiate* an outside view check or seek external input *before* forming a strong belief. The theory must specify how process-level doubts override object-level confidence, even when the latter feels high.
      *   **Non-Negotiable:** Yes. Conflation is a major source of error. Process modesty is the earlier, more crucial warning signal.

  5.  **Incorporates Forecasting & Bias Research Non-Contradiction:**
      *   **Case:** Any proposed heuristic contradicts robust empirical findings (e.g., the "planning fallacy," "overconfidence vs. expertise curves," "hard-easy effect," "bias blind spot").
      *   **Requirement:** The theory *must not* prescribe actions demonstrably shown to increase error rates in controlled forecasting tournaments or bias experiments. It must actively incorporate known debiasing techniques (e.g., considering the opposite, premortems, reference class forecasting *where valid*) as integral components, not optional add-ons. It must account for the finding that *structured* reasoning often outperforms pure intuition *or* pure base rates.
      *   **Non-Negotiable:** Yes. A theory contradicting core empirical results is empirically falsified.

  ---

  **Tensions & Dealbreakers:**

  *   **The Joint Unsatisfiability Challenge:** The most critical tension lies between **#2 (Sparse Feedback)** and the desire for **#5 (Empirical Grounding)**. Rigorous forecasting research (#5) thrives on data-rich domains with clear feedback. True sparse-feedback domains (#2), by definition, lack this data. **A theory satisfying #2 often requires qualitative, heuristic judgments that are hard to validate empirically (#5), while a theory rigidly adhering only to #5 methods will be useless in #2 scenarios.** This is the central fault line. *Resolution Stance:* Non-negotiable #2 demands accepting *reasoned heuristics under uncertainty* as core, even if they lack direct empirical validation in that specific domain, provided they *contradict no existing evidence* and are built upon general cognitive principles informed by #5.
  *   **Camp Preferences:**
      *   **"Always Defer to Base Rates" Crowd:** Over-weights #5 (when base rates exist) but catastrophically fails #2 (sparse/no base rates) and often ignores #1 (why *this* base rate?) and #3 (how calibrated is the base rate selector?).
      *   **"Trust Your Gears" Crowd:** Over-weights process coherence (misapplying confidence in reasoning) but fails #1 (ignoring expert consensus), #4 (confusing belief/process), and often #5 (overconfidence research).
  *   **The Single Biggest Killer Requirement:** **#3 (Recursive Self-Doubt)**. Most popular takes (simple base rates, "trust your model," even basic Bayesian updating) ignore the recursive nature of evaluating one's *own* reasoning capacity and biases *in the moment*. They assume a static, competent reasoner. This requirement forces meta-cognition and procedural checks that simpler models lack. It kills any theory that treats the reasoner as a black box reliably outputting probabilities.
  *   **Non-Negotiables:** All five are non-negotiable for a *general* theory aiming for real-world applicability. Omitting any creates fatal blind spots.
  *   **Usual Suspects (Brief Scorings):**
      *   **Simple Base Rate Deference:** Fails #1 (no burden of proof for dissent), #2 (sparse feedback), #3 (no recursion), #4 (no process modesty). Only weakly satisfies #5.
      *   **Pure "Gears-Level" Inside View:** Fails #1 (ignores expertise), #3 (no meta-doubt), #4 (conflates process/belief), #5 (contradicts overconfidence research).
      *   **Naive Bayesianism (Just update priors):** Fails #2 (no priors in novel domains), #3 (no recursion on own reliability), #4 (priors often conflate belief/process uncertainty). Struggles with #1 (defining the reference class).
      *   **Forecasting Tournament Aggregation (e.g., "Superforecasting"):** Excels at #5, good at #1 (implicitly via aggregation). Weak on #2 (limited to forecastable domains), #3 (limited recursion), #4 (aggregates beliefs, not processes).
      *   **Robust Bayesian Models w/Meta-Uncertainty (e.g., imprecise probabilities, Knightian uncertainty):** Strongest contender. Handles #2, #4, aspects of #3 & #5 well. Can struggle with practical implementation of #3 (recursion) and operationalizing the burden of proof in #1.

  **The Committed Stance:** A viable theory must be **procedural** and **meta-cognitive**, not just formulaic. It requires explicit steps for: identifying reasoning fragility points (#2, #4), demanding justification for dissent (#1), implementing recursive self-checks (#3), and integrating empirical debiasing (#5), *especially* when data is sparse. The core insight: **Epistemic modesty is less about choosing a *view* (inside/outside) and more about rigorously auditing the *reliability of the process* used to generate and evaluate *any* view.** The switch is triggered primarily by *process modesty* or failing the *burden of proof for dissent*, not by low confidence alone.
