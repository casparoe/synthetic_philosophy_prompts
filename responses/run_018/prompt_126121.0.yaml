answer: |-
  Your JUOTS claim fails because the "external" dignity principle was **always already embedded** in the cooperative's operational substrate. Consider:

  1.  **The Charter Isn't Atomistic:** Your founding document emerged within—and presupposes—a pre-existing social/legal ecosystem ("the larger meta-system"). Concepts like "laborer," "obligation," and even "ethical appeal" are parasitic on external norms. The MU-provision prohibits *internal* assertions of completeness, but cannot sterilize the system against the ambient ethical language that gives its own rules semantic weight.

  2.  **The Appeal is Rule-Revealing, Not Rule-Creating:** Invoking "dignity" doesn't jump *out*; it activates a latent constitutive rule *of the meta-system* governing how such cooperatives interpret their own boundaries when faced with normative conflict. This rule ("resolve ambiguities via prevailing human rights norms") was implicit in the charter's ratification context—making it a licensed input *by virtue of the system's situatedness*, not an illicit injection.

  3.  **The Boundary Was Never Where You Assume:** You mistake the *written charter* for "the system." But the functional system includes its interpretive traditions and the members' shared cultural grammar. Your appeal feels novel only because the MU-provision blinded you to the meta-rule's dormancy. You haven't JUOTSed; you've merely applied Rule 0 of the embedding socio-legal framework that *authorizes cooperatives to exist*.

  The move is internally consistent... *within the expanded formalism that was always operant*. Where's the genuine externality?
