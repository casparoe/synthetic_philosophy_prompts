   Walkthrough:

   - Reflection says: set current credence to future credence, so 0.0.
   - Bayes says: conditionalize on the mirror's report. The report "future credence=0" means she'll see an apparent negative outcome. This happens either because (i) H is true and swap occurred (prob 0.05), or (ii) H is false and no swap (prob 0.45). So P(H | report) = 0.05/(0.05+0.45) = 0.1.
