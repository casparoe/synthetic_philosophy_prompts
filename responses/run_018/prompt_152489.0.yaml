  Biographical contingencies: Darwin's path to Malthus and Wallace's fever dream. If those specific events were necessary, not just any trigger, that weakens structural determinism. But a structuralist might argue that the conceptual space would have led others to the same ideas via different paths. The key is whether alternative paths were possible within the same timeframe.

  Unfalsifiability is tricky. The structuralist might reframe divergences as non-essential, but if certain features (like Leibniz's notation) had tangible effects on progress, that can't be ignored. The thesis might need qualification, like acknowledging that some differences have downstream effects but the core ideas remain inevitable.

