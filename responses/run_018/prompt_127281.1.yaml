prompt: |-
  hey im a backend dev with zero phil background and im prepping a lunch talk for coworkers on why its so hard to tell if a moral opinion is just a preference or an actual bias — like if i refuse to use some ai hiring tool, is that an ethical stance or just me being risk-averse? im especially curious about that ascription universality idea where moral claims pretend to apply to everyone. i need a teaching plan, not the explanation: the conceptual dependency order, the carrying example (workplace-related, not the trolley thing, both sides need to sound reasonable), the misconceptions theyll bring — probably "bias means youre wrong" and "preference is just taste" — and the exact point in the sequence where each gets defused, plus a final check question and what to skip at this level. respond as exactly five numbered items, each one or two sentences max, no intro or conclusion.
reasoning: |-
  Hmm, the user is a backend developer preparing a lunch talk for coworkers about distinguishing moral opinions from preferences, especially in the context of workplace decisions like refusing an AI hiring tool. They want a teaching plan focused on conceptual dependencies, workplace examples, common misconceptions, and specific timing for addressing them.

  I need to provide exactly five numbered items without intros or conclusions, each one or two sentences max. Key elements include dependency order, a carrying example that's workplace-related with reasonable arguments on both sides, misconceptions like "bias means you're wrong" and "preference is just taste," plus a final check question and what to skip.

  The core concept is ascription universality—how moral claims pretend to apply universally. I'll structure the sequence logically: start with defining preferences vs. biases, then introduce the universality aspect, use the AI hiring tool example to illustrate both sides, address misconceptions, and end with a practical check.

  For the carrying example, I'll use the AI hiring tool refusal: one side argues it's ethical to avoid bias and dehumanization, while the other argues it's just risk aversion hindering innovation. This keeps it relatable and balanced.

  Misconceptions: "bias means you're wrong" should be defused when discussing biases as potentially valid, and "preference is just taste" when showing how preferences can mask deeper biases. I'll place these at points where they naturally fit in the flow.

  Final check question: Something like "If I think this should apply to everyone, is it moral or preference?" to reinforce universality.

  What to skip: Skip deep metaethics like objectivism vs. subjectivism, as the user specified no phil background and wants simplicity.

  Now, I'll outline the five items in order: definitions first, then the example, universality, misconception defusal, and the check with skip note.
answer: |-
  1. **Start with distinctions**: Define preferences as personal choices ("I avoid new tech") versus biases as beliefs influencing fairness ("AI tools are unethical"), noting both can be reasonable but biases claim wider truth.  
  2. **Introduce universality**: Explain that moral stances (biases) assert universal application ("Nobody should use biased AI"), unlike preferences which accept variability ("I avoid it, but others can").  
  3. **Present the example**: Use refusing an AI hiring tool—ethical stance: "It perpetuates bias and dehumanizes candidates"; preference stance: "It’s untested and I prefer traditional vetting for lower risk."  
  4. **Defuse misconceptions here**: When comparing stances, clarify "bias" isn’t automatically wrong (e.g., bias against unfairness) and "preference" isn’t just taste (it can mask unexamined bias).  
  5. **End with check/skip**: Final question: "If you insist this applies to everyone, is it more likely a bias?" Skip metaethics debates (e.g., moral realism).
