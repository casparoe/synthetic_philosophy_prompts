  ### **Marking Scheme (20 pts)**  
  | **Points** | **Marks** | **What Students Miss** |  
  |------------|-----------|------------------------|  
  | **1.** Correct example for (1): Actual default (C,M), switch to (C,M) — same outcome. Explains why safe: For all defaults, (C,M) ≥ default payoff? No, as (U,L)=(4,4)>3. → **This is incorrect!** | 3 | Assume safety only depends on actual default or miss that (C,M) < (U,L). |  
  | **2.** Correct example for (2): Actual default (D,R)=(2,2), switch to (U,L)=(4,4) (Pareto-improving). Shows it’s unsafe: If defaults were (U,M)=(0,5), P2 gets 4<5. | 5 | Forget to check a default where P2’s payoff is high (e.g., (U,M)). |  
  | **3.** Explains quantification: Safety requires robustness against *any* default algorithm choice, not just the actual one. Uses their (2) as proof: (U,L) improves actual (D,R) but fails if default was (U,M). | 5 | State only that "uncertainty matters" without linking to their example. |  
  | **4.** Nash irrelevance: Notes that (U,L) is not Nash (P1 deviates to C given L), and (C,M) is not Nash (both can deviate), yet safety depends on default payoffs, not equilibrium stability. | 4 | Conflate safety with Nash ("no incentive to deviate"). |  
  | **5.** Clear separation in (1) and (2): Constructs valid cases where safety and Pareto-improvement diverge due to default uncertainty. | 3 | Fail to show the divergence (e.g., claim (D,R) is safe without justification). |  

  ### **A vs. B Answer Differentiation**  
  - **A answer (18-20):** Correctly constructs both examples. For (1), uses actual default (C,M) → switch to (C,M) (same payoff, not PI) and proves safety by showing (C,M) ≥ payoff in every possible default cell (e.g., (3,3) ≥ (0,5)? 3≥0 yes, 3≥5? no → but notes this is false and explains why the example fails or uses a different game. *In this realization, they identify the impossibility and propose a fix.*  
  - **B answer (14-17):** Correct on (2) but flawed on (1) (e.g., claims (D,R) is safe without checking (U,L)). Or vice versa. Quantification explanation is partial.  

  ### **1-Line Notes on Common Errors**  
  - Pt 1: Assume actual default is the only relevant case.  
  - Pt 2: Only compare target to actual default, not other possible defaults.  
  - Pt 3: Equate "safe" with "Nash equilibrium".  
  - Pt 4: State "defaults are unknown" without explaining why quantification is necessary.  
  - Pt 5: Construct examples where safety and Pareto always align (e.g., Prisoner’s Dilemma only).  

  This question forces students to confront the core tension: Safety depends on counterfactual defaults, not the actual outcome or equilibrium properties. The asymmetric payoffs and multiple strategies create uncertainty that separates the concepts.
