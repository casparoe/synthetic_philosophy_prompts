answer: |-
  ### Reconstruction of the Implicit Stance-Theory
  The institutional asymmetry reveals a deep commitment to Dennett’s "stances" framework and a non-reductive view of mental phenomena. Depression is treated as a *real pattern* that cannot be fully captured or explained from the *physical stance* (objective measurements like cytokines or neural firing rates) alone. Instead, its reality depends on patterns discernible only from the *design stance* (evolutionary/functional purpose of neural systems) and the *intentional stance* (subjective beliefs, desires, and experiences). 

  This practice presupposes that mental disorders are **emergent patterns of dysfunction** in cognitive and affective systems. While physically realized, their identity as "depression" hinges on disrupted *intentional content* (e.g., irrational hopelessness) or *teleofunctional failure* (e.g., impaired mood regulation as a designed capacity). A cytokine profile alone cannot constitute depression because it lacks intentionality or design-level meaning; it could equally reflect infection or stress without pathology. Conversely, hypertension is treated as a physical-stance pattern because its dysfunction is defined by deviation from homeostatic norms—a broken "machine," not a broken "meaning-maker." 

  The asymmetry thus implies a **pattern pluralism**: reality contains patterns that emerge only at specific levels of description. Physical-stance patterns (like glucose levels) are substrate-defined and measurable without context. Mental-stance patterns (like depression) are role-defined: they exist only when systems fail to perform evolved intentional functions. A purely physical description misses the pattern because the pattern *is* the failure of intentional/functional coherence—akin to describing a software bug via CPU temperature alone. The practice assumes this is not epistemic limitation but ontological constraint: depression *is* the subjective/functional disruption.

  ---

  ### Strict Presuppositions versus Compatible Theories
  **Strict Presuppositions (Required):**  
  1. **Irreducibility of Intentionality**: Depression cannot be defined without reference to subjective experience (intentional stance) or cognitive-evolutionary function (design stance).  
  2. **Causal Efficacy of Higher-Level Patterns**: Disrupted intentional/functional states *themselves* are causal in depression’s pathology, not just their physical correlates.  
  3. **Diagnostic Necessity of Phenomenology**: Identifying depression requires assessing the patient’s inner state—biomarkers alone are insufficient.  

  **Compatible Theories (Accommodated):**  
  1. **Non-Reductive Physicalism**: Mental disorders supervene on physical states but are not eliminable; their patterns are "real" at higher organizational levels.  
  2. **Multiple Realizability**: Depression’s physical correlates (cytokines, neural circuits) may vary across individuals, but the intentional/functional pattern remains invariant.  
  3. **Weak Emergence**: Subjective experience emerges from complex neural processes, yet once emergent, it has explanatory autonomy.  

  The practice *rejects* eliminative materialism (which reduces depression to "just" cytokines) and strict identity theory (equating mental states directly with physical states). However, it permits token physicalism: each instance of depression is physically instantiated, but the *type* "depression" is defined relationally.

  ---

  ### Assessment of the Mental-Metabolic Asymmetry  
  The asymmetry is **philosophically justified but institutionally ossified**.  

  **Justified Aspect**: Mental disorders *are* ontologically distinct. Metabolic disorders like diabetes disrupt physiological setpoints (e.g., blood-glucose regulation), definable via physical deviations. Depression, however, disrupts *meaning-laden processes*: beliefs about self-worth, capacities for hedonic response, or goal-directed behavior. These require understanding the system’s *purpose*—e.g., the design-stance purpose of mood as a feedback mechanism, or the intentional-stance content of despair. Ignoring these levels reduces a lived experience to an empty correlation.  

  **Problematic Habit**: Institutions often reify this asymmetry dogmatically. While biomarkers alone *shouldn’t* suffice for diagnosis, their exclusion from diagnostic criteria (e.g., in DSM-5) reflects conservatism. Peer-review biases against purely physical-stance research stifle valid mechanistic inquiry. The asymmetry risks dualism if it implies mental patterns are non-physical rather than organizationally emergent.  

  **Verdict**: The core distinction is sound—metabolic disorders are *state dysfunctions*, mental disorders are *agent dysfunctions*—but practice should better integrate biomarkers as *contributory* evidence within a multistance framework.

  ---

  ### Consequences of a Symmetric Physical-Stance Framework  
  Adopting symmetry would entail:  
  1. **Diagnostic Criteria**: Depression diagnosed *solely* via biomarkers (e.g., cytokine levels, fMRI patterns). Subjective reports become optional.  
  2. **Funding Rules**: Research proposals studying depression through physical correlates alone (no phenomenology or functional analysis) prioritized as "objective."  

  **Conceptual Coherence**: This framework is **incoherent for mental disorders**. It dissolves depression into disparate physical patterns (inflammation, neural activity) that lack unifying logic. Without intentional/design stances, we cannot distinguish:  
  - Pathological vs. non-pathological inflammation (e.g., cytokines elevated by exercise).  
  - Depression vs. other states with overlapping biomarkers (e.g., grief, sickness behavior).  
  The *phenomenon of depression*—as a disturbance of conscious agency—vanishes, replaced by brute correlations. We could identify "Syndrome X" (a cytokine cluster) but not *depression*, as the latter inherently references felt distress or functional impairment.  

  **Practical Outcome**: Funding might advance neuroimmunology, but at the cost of clinical relevance. Treatments could normalize biomarkers without alleviating suffering (e.g., anti-inflammatories reducing cytokines but not despair). The disconnect between "cured" biomarkers and ongoing anguish would reveal the framework’s inadequacy. True symmetry is unattainable because mental disorders are *constituted* by higher-order patterns; physicalism must accommodate emergence, not eliminate it.
