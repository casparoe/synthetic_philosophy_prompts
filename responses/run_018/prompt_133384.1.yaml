  ## Sestina on the Unbound Mind

  How can the myriad micro **subject** be?
  Each point of view, a simple **quality**
  Possessed, yet sharply **bound** by its own light.
  Each conscious **part**, however small, remains
  Distinct; they do not fuse into one **whole**.
  What magic link could make their essence **derive**
  A single mind? What force could make **derive**
  From countless grains of sentient **subject**
  The seamless ocean of a conscious **whole**?
  Do shared relations blend their **quality**,
  Or do the **part**s forever hold, remains
  Of selfhood, stubborn at the **bound**?

  The permutations shift: the **bound**
  Of one aligns, perhaps, yet cannot **derive**
  Connection deep enough. Each fragment **remains**
  A private world, a lonely **subject**.
  No sum of mere arrangement, **quality**
  Of place or pattern, births the greater **whole**.

  This postulated, structured **whole**
  Eludes the grasp. The seeming outward **bound**
  Of system hides no unifying **quality**.
  From base relations, nothing new **derive**s;
  The complex **part**s reflect no central **subject**.
  The core dilemma stubbornly **remains**.

  But **remains** the vision flipped: one primal **whole**,
  A cosmic field of mind, from which we **derive**
  Our local focus. Does this vast **subject**
  Fragment its essence? Where then is the **bound**
  Between its unity and each small **part**?
  What law selects the portioned **quality**?

  This scattered **quality**, this leaking **part**,
  From universal source, how can it **derive**
  Its finite self? What principle **remains**
  To bind the fragment back, or mark the **bound**
  Of individuation? Does the **whole**
  Still permeate the seeming separate **subject**?

  The cosmic **subject** finds its aspects **bound**
  Not gathered in, but scattered. Each **part** **derive**s
  A borrowed glow, yet unity **remains** elusive as the **whole**'s own **quality**.

  Phenomenal **bonding**? Still the **whole** lacks **subject**,
  **Derive**d **part**s retain their **bound**; no shared **quality**
  **Remains** but gaps where integration failed to **derive**.

  ---

  ## Notes on Execution

  *   **End-Words & Philosophy:** The mandated rotation of `subject`, `quality`, `bound`, `part`, `whole`, `derive` enacts the core problem:
      *   **Stanzas 1-3 (Micropsychism):** Explores the failure of *parts* (micro-subjects with their *qualities*) to combine into a *whole* macro-subject, despite permutations (`derive` tries to find a combinatory principle, `bound` emphasizes separation, `remains` underscores persistence of the problem).
      *   **Stanza 4 (The Turn):** Introduces the *whole* (cosmic subject), asking how *parts derive* consciousness from it and where the *bound* lies.
      *   **Stanzas 5-6 (Cosmopsychism):** Shows the inverted problem – the *whole* cannot prevent its *quality* from scattering into *parts* (`derive` now means fragmentation, `bound` marks individuation, `remains` again signals the unsolved issue).
  *   **The Envoi:** Forces all six key terms into three lines, mirroring the forced postulate of "phenomenal bonding." The syntax strains (`Still the whole lacks subject`, `Derived parts retain their bound`), the terms clash (`no shared quality / Remains`), and it ends on the failure (`failed to derive`), explicitly rejecting bonding as a solution and leaving the loop open. Does `derive` mean combination (micro) or fragmentation (cosmo)? The poem doesn't resolve it.
  *   **Structural Symmetry:** The shift from bottom-up combination (stanzas 1-3) to top-down derivation (stanzas 4-6) is mirrored in the poem's pivot. The persistence of separation (`bound`, `remains`) and the failure of key processes (`derive`) plague both models.
  *   **Suspended Tension:** The final line (`failed to derive`) is deliberately ambiguous. Is it the micro-approach failing to derive the macro? Or the cosmic approach failing to derive individuated subjects without loss? The poem leaves this unresolved, the "gap" merely renamed or highlighted by the formal rotation, not bridged. The envoi's forced co-presence parodies integration without achieving it.
