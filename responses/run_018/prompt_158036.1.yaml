answer: |-
  The circularity you describe is indeed the core conceptual problem when treating culture as an exogenous cause in Weber's thesis: if the Protestant ethic *causes* capitalist behavior via agents' interpretations, but those interpretations are *reconstituted* by the economic outcomes of that behavior, culture becomes endogenous and the causal claim collapses. However, this circularity **can be broken** by recognizing the distinct causal logic and temporal "stickiness" of **value-rational action** (*wertrational*) during the *origination* phase, which temporarily insulates the cultural framework from immediate economic feedback.

  Here's the defense, grounded in Weber's action typology:

  1.  **Value-Rationality as the Initial Causal Engine:** Weber's core argument hinges on the *uniquely value-rational* character of early Calvinist asceticism. The devout believer engaged in systematic, methodical work and accumulation **not** primarily as a means to wealth or comfort (instrumental rationality - *zweckrational*), but because it was perceived as an intrinsically valuable *duty* – a "calling" (*Beruf*) and a sign of possible salvation. This action was oriented towards an absolute *religious value* (securing proof of divine grace), not worldly success. The meaning-schema (fear of damnation, need for worldly "proof") drove the behavior *for its own sake* according to the value.

  2.  **The "Stickiness" of Value-Commitment:** Value-rational action, by its nature, is resistant to immediate instrumental recalibration. The commitment is to the value itself, not its consequences. For the early Calvinist entrepreneur, economic success was a *byproduct* or *sign*, not the *goal*. The interpretive schema (work as religious duty) would likely **persist** even in the face of initial economic success or failure *because* the action's validity derived from adherence to the value, not its outcome. This creates a crucial period where the cultural framework acts as an independent causal force, shaping behavior without being immediately reshaped *by the economic results it generates*. The meaning is "sticky" due to its transcendental anchoring.

  3.  **The Shift to Instrumental Rationality and Path Dependence:** It is precisely *because* this value-rational behavior generated unintended economic consequences (capital accumulation, efficient organization) that a shift occurred. As the religious fervor faded (the "iron cage"), the economic *practices* and *institutions* pioneered for religious reasons proved instrumentally rational for pursuing wealth. **Here, circularity sets in:** the now-dominant instrumentally rational actors (later capitalists) maintain economic behaviors because they are effective means to the end of profit. Their "frameworks" (beliefs about efficiency, profit maximization) *are* shaped by the economic system. However, this later-stage circularity does not negate the *initial, non-circular cause*.

  4.  **Breaking the Circle Temporally:** The circularity is broken by acknowledging **distinct historical phases**:
      *   **Phase 1 (Origination):** Value-rational religious commitment (Protestant ethic) → Drives methodical economic behavior (asceticism, accumulation) *as an end in itself*. The cultural framework remains largely exogenous *during this formative period* due to the insulation provided by value-rational commitment. Economic outcomes are interpreted *through* the religious schema (success as a sign), not as feedback *changing* it fundamentally yet.
      *   **Phase 2 (Institutionalization & Secularization):** The *unintended consequences* of Phase 1 (capital accumulation, market dynamics) create a new economic reality. Religious meanings fade. Instrumental rationality takes over. Now, economic practices shape cultural attitudes towards work and wealth (e.g., justifying profit-seeking). Culture becomes largely endogenous within the mature capitalist system.

  **Therefore, Weber's claim avoids fatal circularity:** The Protestant ethic functioned as an independent *historical* cause by providing the initial value-rational "spark" that triggered the specific behaviors leading to modern capitalism. Its causal power resided in its ability to motivate action *independently* of the economic consequences it would later produce, precisely because it was understood and enacted as a value-rational commitment during a critical formative period. While culture later becomes intertwined with the economic system it helped create, its role in the *genesis* remains distinct and non-circular due to the unique properties of value-rational action providing temporary causal autonomy. Weber's thesis explains the *transition*, not the perpetual motion of the mature system.
