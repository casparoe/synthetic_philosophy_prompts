  I'm putting together a short research proposal for a small grant in collective epistemology, and I want to do it on the unilateralist's curse. My half-formed idea is that the standard advice—that you should defer to the group's estimated majority and only act if you think most relevant others would act too—lumps together two different jobs that deference can do: reducing harm from a mistaken unilateral actor and respecting the equal epistemic standing of the other agents. I suspect these jobs come apart when you have reason to think the group is epistemically competent but badly motivated on this specific issue, or when the action is cheap for you but imposes mostly downstream costs on others. Turn this into a proposal that states the question precisely, explains why the usual principle-of-conformity style answers leave it open, says how a conceptual rather than formal or empirical project makes progress, gives a concrete deliverable someone designing institutional policies could use, and states what would count as the project failing. I'll add citations so dont worry about a bibliography.
