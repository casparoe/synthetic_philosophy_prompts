answer: |-
  Below is the complete exam package designed to force a clear distinction between pragmatic encroachment (PE) and attributor contextualism (AC), while exposing their unique pressures. The case exploits asymmetric stakes and ignorance of stakes to prevent theoretical conflation.

  ---

  **FINAL EXAM QUESTION: KNOWLEDGE IN THE HOSPITAL (20 Marks)**  
  *Answer all parts. Time allowed: 90 minutes.*

  **The Case:**  
  At Mercy Hospital, the night pharmacist, Dr. Evans, reads a label on a vial and concludes it contains Drug X. Her evidence (e.g., label clarity, routine verification) is identical to cases where pharmacists are typically said to know. Crucially:  
  - Dr. Evans faces **low personal stakes**: She goes home on time regardless.  
  - The **patient** (Mr. Khan) faces **extremely high stakes**: If the vial is wrong, he dies.  

  **Variant 1:** Dr. Evans’ colleague, Nurse Patel, watches her prepare the vial. Patel knows Mr. Khan’s life depends on it. Patel asks: “Does Dr. Evans *know* it’s Drug X?”  

  **Variant 2:** Dr. Evans is told the vial is for “a routine administration.” Unbeknownst to her, it is actually for Mr. Khan. She confidently tells a junior pharmacist: “I *know* this is Drug X.”  

  **Variant 3:** The next morning, Dr. Evans learns Mr. Khan survived. Haunted, she says: “Looking back, I didn’t *really know* it was Drug X.” Mr. Khan’s furious family, reviewing the evidence, insists: “She *knew*! She’s culpable!”  

  **Your Tasks:**  
  1. Explain what **attributor contextualism (AC)** and **pragmatic encroachment (PE)** predict about whether Dr. Evans knows in each variant.  
  2. Does any variant **cleanly discriminate** between AC and PE? If so, how?  
  3. Which variant is **hardest for AC**, and which is **hardest for PE**? Justify your answers.  

  ---

  **MODEL ANSWER (650 words)**  

  **Theories Defined:**  
  - **Attributor Contextualism (AC)**: The truth of “S knows that p” depends on the *attributor’s* conversational context. Higher stakes raise epistemic standards (e.g., requiring more evidence). The *subject’s* (Dr. Evans’) stakes are irrelevant.  
  - **Pragmatic Encroachment (PE)**: Whether S *knows* p depends on S’s *own* practical stakes. Higher stakes for S raise the justification threshold for knowledge. The attributor’s context (e.g., Patel’s question) doesn’t affect whether S *possesses* knowledge.  

  **Variant 1 (Patel’s Question):**  
  - *AC*: The attributor (Patel) is in a high-stakes context (life-or-death). Thus, “knows” requires very high standards. Evans’ evidence (sufficient in low-stakes) likely fails here. Prediction: *False* – “Evans does not know.”  
  - *PE*: Knowledge depends solely on the *subject’s* (Evans’) stakes, which are low. Evans meets the justification threshold for low-stakes knowledge. Prediction: *True* – “Evans knows.”  
  - *Discrimination*: Theories **diverge** (AC: False, PE: True), but not cleanly, as both can explain Patel’s hesitation.  

  **Variant 2 (Evans’ Assertion):**  
  - *AC*: The attributor is now Evans *herself*, in a self-ascription. She believes her context is low-stakes (“routine administration”), so “knows” invokes low standards. Her evidence suffices. Prediction: *True* – “Evans knows.”  
  - *PE*: Knowledge depends on Evans’ *actual* stakes, which are *objectively high* (Mr. Khan’s life), though she’s unaware. PE typically holds that *ignorance of stakes doesn’t lower the threshold* – stakes raise the bar regardless of awareness. Prediction: *False* – “Evans does not know” (high stakes require unattained justification).  
  - *Discrimination*: **Cleanly discriminates**. AC says knowledge-ascription is true (attributor=Evans, low standards); PE says knowledge is absent (subject’s stakes are high, unbeknownst to her).  

  **Variant 3 (Retrospective Blame):**  
  - *AC*: Evans’ morning context is high-stakes (guilt, blame), raising standards for “knew.” Her evidence may now be insufficient. Prediction: *False* – “She didn’t know.” The family’s context (accusatory, high-stakes) might also demand high standards, but AC could allow their “knew” to be false or contextually variable.  
  - *PE*: At the time of action, Evans’ *actual* stakes were high. Thus, she *lacked knowledge then*, making her morning claim (“I didn’t know”) **true** and the family’s (“She knew”) **false**. PE fixes knowledge at the time of action; later contexts don’t alter it.  
  - *Hardest for PE*: While PE clearly denies the family’s claim, it must explain why Evans feels she “didn’t really know” – possibly invoking outcome bias or moral regret, not epistemology.  

  **Which Variant Cleanly Discriminates?**  
  Variant 2 is decisive. AC claims Evans’ assertion “I know” is *true* (she’s the attributor in low-standards context). PE claims Evans *lacks knowledge* (her ignorance doesn’t negate high stakes). The predictions are incompatible and hinge on core commitments: AC’s speaker-dependence vs. PE’s subject-stakes-dependence.  

  **Hardest Variants for Each Theory:**  
  - *Hardest for AC*: **Variant 2**. AC must say Evans speaks truthfully when she says “I know” *despite* the lethal unknown stakes. This feels counterintuitive and suggests AC prioritizes the speaker’s perspective over objective danger – a tension proponents rarely emphasize.  
  - *Hardest for PE*: **Variant 3**. PE must deny the family’s claim (“She knew!”) and affirm Evans’ “didn’t know,” but struggles to explain the family’s plausible assertion of *culpability* without conceding their use of “knew” has pragmatic force.  

  ---

  **MARKING SCHEME (Total: 20 Marks)**  
  Candidates must hit these 5 moves:  

  1. **Define Core Difference** (4 marks)  
     - *Must-hit*: AC ties truth to attributor’s context/stakes; PE ties knowledge to subject’s stakes.  
     - *Common mistake*: Conflating the theories (e.g., “both say stakes matter”).  

  2. **Variant 1: Divergent Predictions** (4 marks)  
     - *Must-hit*: AC (false – Patel’s high standards); PE (true – Evans’ low stakes).  
     - *Common mistake*: Claiming both say “no” due to high patient stakes.  

  3. **Variant 2: Clean Discrimination** (6 marks)  
     - *Must-hit*: AC: “I know” is true (Evans is attributor, low standards); PE: Evans lacks knowledge (high stakes, ignorance irrelevant).  
     - *Common mistake*: Saying PE agrees with AC because Evans *feels* confident.  

  4. **Variant 3: Asymmetric Blame** (3 marks)  
     - *Must-hit*: PE fixes past knowledge (family’s “knew” is false); AC allows Evans’ “didn’t know” to be true (current high standards).  
     - *Common mistake*: Letting Variant 3 collapse into moral blame, ignoring epistemic predictions.  

  5. **Identify Pressure Points** (3 marks)  
     - *Must-hit*: Hardest for AC = Variant 2 (ignores objective risk); Hardest for PE = Variant 3 (denying family’s “knew” while explaining culpability).  
     - *Common mistake*: Claiming Variant 1 is hardest or missing the ignorance problem in Variant 2.  

  ---

  **A vs. B DIFFERENTIATION**  
  - **B Answer (Competent):** Correctly states both views’ predictions for all variants and identifies Variant 2 as the discriminator, but **treats AC and PE as predictively symmetrical** elsewhere (e.g., misses why Variant 2 pressures AC’s “attributor-centered” commitment).  
  - **A Answer (Excellent):** Notes that **Variant 2 forces AC into an unadvertised result**: that Evans’ “I know” is true *despite* her ignorance of lethal stakes, revealing AC’s potential disconnect from objective risk. It also observes that PE’s rigid subject-stakes dependence in Variant 2 (ignorance ≠ immunity) is a feature proponents *do* advertise, making this variant a purer test.
