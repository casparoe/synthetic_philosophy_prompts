prompt: |-
  I teach a second-year philosophy of mind seminar and next week we hit illusionism about phenomenal consciousness — the Frankish-ish view that phenomenal properties are a kind of introspective illusion. The students have done the standard dualism-to-functionalism tour, so they'll arrive assuming the illusionist is just denying that anyone is conscious, full stop, and I want to break that assumption before it calcifies. Plan the teaching, not the content: the order the pieces have to come in and why (my instinct is the phenomenal/access distinction first, then the introspective misrepresentation move, but push back if that's wrong), the one example the whole session should be built around and what it has to show and crucially what it must not smuggle in, the misconceptions they'll predictably form — I'd bet on "the illusion would itself have to be a phenomenal state, so the view is incoherent" and "this is just physicalism with extra steps" — and exactly where in the sequence each one gets headed off rather than left to fester. Also tell me what to openly leave out at this level, and one question I can ask at the end that seperates students who got it from students who just find it shocking. British English please.
reasoning: |-
  Okay, let's tackle this philosophy of mind teaching challenge. The user is prepping a seminar on illusionism about phenomenal consciousness and wants to strategically structure the session to prevent common student misconceptions. 

  First, considering the user's position: they're teaching second-year philosophy students who've covered dualism to functionalism. The core risk is students oversimplifying illusionism as "denying consciousness exists" - a reaction that could derail nuanced discussion if not preempted. 

  The user's suggested approach (phenomenal/access distinction first, then misrepresentation) seems pedagogically sound. That sequence mirrors how the illusionist argument actually builds: you need to establish what's being called into question (phenomenality) before explaining why it's illusory. 

  For the central example, visual illusions like the neon color spreading effect are ideal. They're: 
  - Concrete (students can visualize or even experience it)
  - Theoretically neutral (don't presuppose physicalism/dualism)
  - Show misrepresentation without needing phenomenal language
  Crucially avoids metaphors like "the Cartesian theater" which might smuggle in assumptions.

  Predictable student misconceptions need addressing at specific points:
  - The "incoherence" objection (if illusion is phenomenal, it's self-defeating) must be tackled immediately after introducing misrepresentation. Need to emphasize non-phenomenal nature of the error signal. 
  - The "physicalism with extra steps" complaint should wait until after the illusionist positive account, showing how it differs from reductive realism.

  Key omissions at this level: 
  - Full computational implementation details 
  - Comparison to eliminativism 
  - Historical precedents (Hume etc.) 
  These would distract from the core argument structure.

  The diagnostic question at the end - "What would change for Mary the neuroscientist..." - tests if students grasp illusionism isn't about denying access consciousness. Good discriminators will note her epistemic situation remains identical post-release; poor ones will think she discovers "real" qualia.

  Timing matters too: 15 mins on distinction, 20 on misrepresentation, 15 on objections, 5 on wrap-up. Any deeper dive into alternatives would overcomplicate at this stage.
answer: |-
  Here's a structured teaching plan for introducing illusionism, designed to pre-empt misconceptions and build conceptual clarity. British English throughout:

  **Overarching Strategy:**  
  Frame illusionism not as *denying consciousness* but as *reconciling subjective reports* with a physicalist ontology. Position it as a *response* to the hard problem, not a dismissal of first-person data.

  **Sequence & Rationale:**  
  *(90-minute seminar structure)*

  1.  **Grounding the Target (15 mins): Phenomenal vs. Access Distinction (Yes, do this first)**
      *   **Why:** Students arrive conflating "consciousness" with "phenomenal consciousness." *Crucially* separate:
          *   **Access Consciousness (A-Consciousness):** Availability of information for global control, reporting, reasoning (e.g., describing the red apple).
          *   **Phenomenal Consciousness (P-Consciousness):** The "what-it’s-like-ness," raw feels, qualia (e.g., the intrinsic redness *itself*).
      *   **Key Move:** Emphasise that *everyone* accepts A-consciousness exists. Illusionism targets *only* P-consciousness. Ask: "What *specifically* does Frankish think is illusory? Not reporting, not experiencing in *some* sense, but...?"
      *   **Head Off:** "Denying consciousness" misconception. Clarify: Illusionism denies *phenomenal properties as real, intrinsic, non-representational features*, not the existence of conscious *states* or *reportability*.

  2.  **Introducing the Core Mechanism (25 mins): Introspective Misrepresentation via Central Example**  
      *   **The Example: Visual Illusion (e.g., Neon Colour Spreading)**  
          [![Neon Colour Spreading Illusion](https://michaelbach.de/ot/images/NeonSpreading/index.png)](https://michaelbach.de/ot/col-neon/index.html) (Show an image/video)
      *   **What it MUST Show:**
          *   A perceptual/introspective *system* generates an inaccurate representation ("solid pink ring").
          *   This representation is *compelling* and guides belief/behaviour ("I *see* a pink ring").
          *   The *property represented* (solid pink colour *in the world*) isn't actually instantiated *where/how* it seems.
          *   The *system* causing the illusion is entirely physical/computational.
      *   **What it MUST NOT Smuggle In:**
          *   Avoid examples relying on *phenomenal contrast* (e.g., blurred vs. clear vision). Stick to spatial/colour misrepresentation.
          *   Avoid metaphors implying a "homunculus" seeing the illusion. Stress the system *is* the subject.
      *   **The Analogy:** Argue that introspection misrepresents complex neural states *as* having simple, intrinsic phenomenal properties (e.g., misrepresents visual processing as "pure redness").
      *   **Key Move:** "Just as the visual system *misattributes* colour properties spatially, the introspective system *misattributes* a special 'feel' property (qualia) to representational states."
      *   **Head Off (Part 1):** Pre-empt the "incoherence" objection *here*. Ask: "Is the *neural state* generating the pink-ring illusion *itself* pink? No. The *misrepresentation* isn't phenomenal; it's an *error signal* within a physical process. The illusion *of* pink isn't pink. Similarly, the illusion *of* qualia isn't itself qualia."

  3.  **Articulating the Illusionist Claim (20 mins): What *is* Real?**
      *   Re-state: What exists are complex, physically realised, *access-conscious* representational states.
      *   Introspection *represents these states* to itself *as* having an additional, simple, intrinsic property: "phenomenality."
      *   This introspective representation is *systematically inaccurate* – the "phenomenal property" is not instantiated. The *seeming* is the illusion.
      *   **Head Off (Part 2):** "Physicalism with extra steps?" Address this *now*. Contrast:
          *   **Reductive Realism (e.g., some Functionalism):** P-consciousness *is* a functional/computational property (it's real, we've reduced it).
          *   **Illusionism:** The *property introspected as* P-consciousness *doesn't exist*. What exists is the complex state *plus* the introspective *misrepresentation* of it as having that property. The "extra step" (misrepresentation) is crucial and *denies* the reality of the target property.

  4.  **Tackling Predictable Objections Head-On (20 mins):**
      *   **"But the illusion *feels* phenomenal! So it *must* be!" (Incoherence Objection Redux)**
          *   **Response:** Reiterate the visual illusion analogy. The *neural correlate* of the "feeling of seeming" is real and complex. The *content* of that feeling ("there is intrinsic redness here") is false. The *seeming* is real (it's an occurrent state); what it *seems to be of* (qualia) is not. "Feels like" refers to the *compelling nature of the introspective representation*, not proof of its veridicality.
      *   **"This is just eliminativism/denying the data!"**
          *   **Response:** Illusionism *accepts* the first-person *report* ("It seems red to me") as a genuine datum. It provides an *explanation* for *why* we report that, consistent with physicalism: the introspective mechanism generates that compelling seeming. It explains *why we believe* in qualia, whereas eliminativism might dismiss the reports as deeply mistaken *without* this explanation.
      *   **"What about the explanatory gap/hard problem?"**
          *   **Response (Briefly):** Illusionism claims the hard problem arises *from* the illusion. We mistakenly think there's an extra property (qualia) to explain *beyond* the physical/functional story. Dissolve the illusion, dissolve the spurious hard problem. (Don't let this derail; flag it for future discussion).

  5.  **Consolidation & Diagnostic Question (10 mins):**
      *   **Recap:** Illusionism accepts A-consciousness, explains P-reports via introspective misrepresentation of complex physical states, and denies the *reality* of phenomenal properties *as intrinsic qualia*.
      *   **Crucial Omissions (State These Openly):**
          *   Deep dive into *how exactly* introspection misrepresents (specific computational models).
          *   Detailed comparisons to other "illusion" theories (e.g., Dennett's multiple drafts – too similar/different, confusing here).
          *   Full responses to all conceivability arguments (zombies, Mary).
          *   Historical precursors (Hume, etc.).
          *   *Say:* "We're focusing on the core conceptual move: the introspective misrepresentation thesis applied to phenomenal properties."
      *   **The Diagnostic Question:**  
          **"According to illusionism, if Mary the neuroscientist (who knows all physical facts about colour vision but has never *seen* red) finally sees a red rose, does she learn a *new fact about the world*, or does she merely undergo a *new type of introspective misrepresentation*?"**  
          *   **Got It:** Will say she undergoes a new (for her) type of introspective misrepresentation. She doesn't learn a new *fact about redness-in-the-world* (she knew the physics/biology), but she *does* acquire a new internal state that her introspection misrepresents *as* an intrinsic phenomenal property. Her exclamation "So *this* is what it's like!" reflects the compelling illusion, not access to a new non-physical property.
          *   **Shocked/Not Got It:** Will say she *does* learn a new fact (the "what-it's-like" fact), proving illusionism must be wrong, or they'll conflate the new *neural/representational state* with learning about a *real phenomenal property*.

  **Why this sequence works:**  
  It isolates the target (P-consciousness), provides a clear, theory-neutral analogy for misrepresentation, pre-empts the major objections *at the point they naturally arise* in the exposition, explicitly contrasts illusionism with neighbouring views, and uses a diagnostic question targeting the core claim about the nature of the "phenomenal" introspective report. Stating omissions prevents confusion about scope.
