prompt: |-
  ok so me and my buddies run this dumb spreadsheet league for local sports bets — no cash, just points, and whoever has the most points at the end of the month picks the group dinner spot. i started following this rule where i never wager more than about 1/6 of whatever points i have, even on what feels like a lock, because i figured if i ever drop to zero i'm basically out of the running for the rest of the season. my friend mike bets huge on "sure things" and he's been crushing me — he was up like 400 to my 80 — but last week he went all-in on an upset and lost half his stack, and now he's pissed. he says i'm leaving value on the table and being irrational out of fear. i definately feel like there's something deeper going on with not being able to recover from zero, but i can't explain it without sounding like i'm just risk-averse. is mike right that my strategy is basically cowardice? please start with your bottom line in the first sentence, then your reasoning, with no preamble and don't restate my question.
