  The real tension they're highlighting is between two schools: one that tries to derive probability from rational decision-making (if you're a branching observer, bet this way) and another that tries to derive it from fundamental physics (branch counting with symmetries) or epistemology (self-locating uncertainty). The user suspects that resolving this tension might unlock whether MWI can avoid circularity.

