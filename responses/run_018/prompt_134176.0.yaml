prompt: |-
  I'm advising a small philosphy-of-physics group that can fund about three post-docs for two years. We're specifically interested in the Born-rule problem within Everettian quantum mechanics, but we're tired of the same old arguements. Which open questions or lines of work should we actually prioritise — not just what's unresolved, but what matters most if our goal is to figure out whether MWI can underpin quantum information theory without smuggling in classical probability? I'm particularly curious about the tension between decision-theoretic derivations in the style of Deutsch and Wallace and more recent attempts to ground branch weights in symmetry arguments or self-locating uncertainty. Rank them: which is upstream of the others, which is tractable for philosophers rather than physicists, and which would you deprioritise because solving it wouldn't change the practial interpretation of quantum randomness certification? Defend the ordering with explicit criteria — tractability, dependency, and whether the answer actually shifts anything outside pure metaphysics. No need for a reading list; just the agenda and why.
