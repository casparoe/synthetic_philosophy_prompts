  For prioritization criteria:
  - Upstream/dependency: Which question, if answered, would resolve others? (e.g., if symmetries work, decision theory becomes unnecessary)
  - Tractability: What can philosophers contribute without heavy math? (e.g., analyzing assumptions > deriving new symmetries)
  - Practical shift: Does it change real-world quantum certification? (most metaphysics doesn't)

