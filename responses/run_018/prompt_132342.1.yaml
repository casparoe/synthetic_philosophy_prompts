  Give an example of a conceptual issue in the philosophy of fakes, forgeries, and the value of originals that turns on what might be called a 'performative original'—a work whose identity is constituted by a particular practice, ritual, or improvisational context rather than by a static physical object, and for which a perfect sensory replica can be produced that nonetheless lacks the institutional or historical chain of transmission. Your example should expose a tension between aesthetic value and artifactual value that resists resolution by either pure experientialism or simple authenticity fetishism, and should make substantive use of—without merely naming—the distinction between autographic and allographic arts. Select a borderline case, such as a digitally reconstructed traditional ceremony or a precisely reproduced improvised jazz set, and articulate exactly why the replica does or does not preserve the original's value through features other than bare causal history. Write your answer in British English.
