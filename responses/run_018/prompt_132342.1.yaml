  Here is an example centred on a digitally reconstructed **Griot storytelling performance**, specifically a rendition of the Sunjata Epic from Mali, illustrating the tensions around a performative original:

  **The Case:**
  Imagine a renowned Malian Griot, Bakary Diabaté, performing the Sunjata Epic (chronicling the founder of the Mali Empire) at a specific *donson ton* (hunter's gathering) in Kangaba, Mali, in 1960. This performance is recorded on low-fidelity audio tape. Decades later, using advanced AI audio synthesis and ethnographic data, a team creates a **perfect sensory replica**: a digital audio file indistinguishable, to even expert ears, from a hypothetical high-fidelity recording of Diabaté’s original performance. It captures every vocal inflection, kora note, audience murmur, and improvisation within the recognised narrative structure.

  **The Performative Original's Identity:**
  The Sunjata Epic, while having a core narrative, is an **allographic** art form in Goodman's sense *at the structural level* – the "work" is defined by its narrative sequence and themes, not a fixed text. *However*, Diabaté’s specific 1960 performance constitutes an **autographic performative original**. Its identity and value are inextricably bound to:
  1.  **The Ritual Context:** The *donson ton* gathering imbued the performance with specific social, spiritual, and communal significance. The storytelling was not mere entertainment but a reaffirmation of lineage, history, and cultural identity within a charged ritual space.
  2.  **The Improvisational Act:** While adhering to the epic's framework, Diabaté's performance involved real-time improvisation – responding to the audience's energy, inserting contemporary allusions, tailoring the emphasis based on the gathering's purpose. This was a unique *event*, not just an instance of the story.
  3.  **The Chain of Transmission:** Diabaté performed as a link in a centuries-old Griot lineage (*Jeliw*). His authority and the performance's authenticity stemmed from his inherited right and sanctioned mastery within this living oral tradition. The performance *was* an act of cultural transmission happening *then and there*.

  **The Tension Exposed:**
  *   **Aesthetic Value (Experientialism):** The perfect replica delivers an identical sensory experience. A pure experientialist would argue that, sonically and narratively, it preserves the entire aesthetic value. Listening to it provides the same emotional impact, intellectual understanding of the story, and appreciation of vocal/kora skill as the original recording (or even the live event, arguably).
  *   **Artifactual Value (Authenticity Fetishism):** A simple authenticity fetishist might focus solely on the original physical tape as the valuable relic, dismissing any copy. But this misses the core issue, which isn't the tape *per se*, but the **performance as a unique historical/cultural event**.

  **Why the Replica Fails to Preserve Full Value (Beyond Causal History):**
  The replica's deficiency lies precisely in its lack of connection to the **performative context** that constituted the original's autographic identity, even while perfectly replicating its audible structure (its allographic aspect):
  1.  **Loss of Ritual Efficacy & Communal Bond:** The replica is divorced from the *donson ton*. It cannot serve its original function of binding that specific community in that ritual moment. It becomes a disembodied sound object, not a shared communal act. Its artifactual value as a *cultural act* is absent, regardless of sonic fidelity.
  2.  **Loss of Improvisational "Liveness":** While the sonic *results* of Diabaté's improvisation are copied, the replica lacks the ontological status of *being an improvisation*. It is a fixed simulation. The value inherent in the risk, the responsiveness, the unique confluence of factors in that moment – the very quality that made it an autographic *event* – is lost. We hear a *record of improvisation*, not improvisation itself.
  3.  **Break in the Chain of Transmission:** The replica lacks the sanction of the Griot tradition. It wasn't produced *by* a Griot within the lineage for a purpose sanctioned by the tradition. It is an artefact *about* the performance, not *of* the tradition's living practice. Its artifactual value as a link in the authorised cultural transmission chain is null.

  **The Irresolvable Tension:**
  This case resists both extremes:
  *   **Against Pure Experientialism:** The identical sensory input *does not* equate to identical value. The aesthetic experience might be preserved, but the profound artifactual value tied to the performance's role as a unique ritual act, an authorised transmission, and a live improvisational event within its specific historical/social fabric is irrevocably lost in the replica. The replica provides information *about* the event but isn't *the* event.
  *   **Against Simple Authenticity Fetishism:** Merely possessing the original low-fi tape (the physical autograph) isn't the sole source of value either. The tape's immense value *derives* from it being an indexical trace (however imperfect) of the unrepeatable performative *original* – the event itself. Fetishising the tape alone ignores that the tape's significance is parasitic on the event's prior status as a performative original.

  **Conclusion:**
  The digitally reconstructed Griot performance exposes the core issue: for performative originals, the "work" *is* the specific, contextually embedded enactment. While the art form (the epic) is allographic, the *performance* becomes autographic through its unique ritual, improvisational, and institutional context. A perfect sensory replica captures the allographic structure but severs the work from the autographic ground of its creation – the living practice and historical moment that gave it its full significance as both an aesthetic and cultural artefact. The value lost is not just causal history, but the very *mode of existence* as a constitutive cultural act. The unresolved tension lies in acknowledging that the replica offers genuine aesthetic value while simultaneously failing to embody the irreplaceable artifactual value of the original performative event.
