  Hmm, the tricky part is representing "where he is" in engineering terms. Location gets reduced to either the primary node's physical position (the vat) or the data source's logical location (the body's sensors). But neither captures the first-person feeling of embodiment. 

  I notice distributed systems have no equivalent for subjective certainty - nodes don't "believe" things, they just process state. The existential tension in Dennett's experiment relies entirely on that first-person perspective, which disappears when we model it as state synchronization. 

