answer: |-
  Here is a defended research agenda prioritizing unresolved conceptual questions in supererogation, focusing on your specified issues while ranking the most critical open problems:

  **Ranked Priority Questions (1 = Highest Priority):**

  1.  **The Coherence & Structure of Collective Supererogation:** *Can groups be genuine subjects of supererogatory action irreducible to the aggregated supererogatory actions (or permissions) of individual members?* This is the **upstream linchpin**.
      *   **Why Priority?** Progress here is foundational. Until we resolve whether collective supererogation is coherent, theorizing about *any* group-based normative phenomena (obligation, blame, praise) beyond simple aggregation remains unstable. It directly impacts applied ethics (climate action, corporate responsibility, social movements), political philosophy (state obligations vs. charity), and the metaphysics of group agency. Failure here stalls numerous downstream inquiries.
      *   **Dependencies:** Upstream of *all* collective normative theory. Clarifying collective supererogation forces progress on collective intention, responsibility, and agency thresholds.
      *   **Tractability:** Primarily **conceptual/analytic**. Requires refining theories of collective agency (e.g., List & Pettit, Bratman, Gilbert) and testing them against intuitions about paradigmatic cases (e.g., a small community jointly funding a lifesaving well beyond any individual obligation, where no single member acted supererogatorily). Empirical work (social psychology on group identity, shared responsibility) can *inform* intuitions and test presuppositions but cannot resolve the core conceptual puzzle.
      *   **Evidence for Reordering:** Empirical evidence demonstrating robust, stable intuitions about praiseworthy group actions that *cannot* be redescribed without loss as individual supererogation/fulfilled obligation would solidify its priority. Conversely, strong arguments showing such irreducibility is *conceptually impossible* could deprioritize it (though this seems unlikely).

  2.  **The Threshold Problem for Sacrifice (Demandingness):** *Precisely where does the line between moral duty and supererogation lie concerning personal cost/sacrifice?* (e.g., How much financial loss, risk, or life disruption is obligatory?).
      *   **Why Priority?** This is the **core engine** of supererogation theory. Without a workable (even if fuzzy) threshold, the category collapses into either excessive demandingness (no supererogation) or excessive laxity (everything permissible is supererogatory). It directly bears on *both* individual and potential collective supererogation (what cost *must* a group bear?).
      *   **Dependencies:** Upstream of **Epistemic Supererogation** (how costly *must* inquiry be?) and downstream of basic accounts of value/obligation. Significantly informs **Collective Supererogation** (what counts as excessive cost *for a group*?).
      *   **Tractability:** **Hybrid (Conceptual Primacy, Empirical Informant).** Core work is conceptual: developing and defending principled criteria (e.g., significant vs. excessive sacrifice, agent-relative prerogatives vs. impartial demands). Empirical work (intuition surveys across cultures, behavioral economics on sacrifice) is crucial for stress-testing conceptual models and identifying culturally variable boundaries, but cannot *determine* the normative line.
      *   **Evidence for Reordering:** A breakthrough conceptual model achieving wide reflective equilibrium would deprioritize it. Persistent, intractable disagreement on core cases despite refined models might *increase* its priority as the field's central crisis.

  3.  **The Status of Epistemic Supererogation:** *Can exceeding one's evidential duties (e.g., seeking significantly more evidence than required before forming/judging a belief) constitute a distinct, genuinely *epistemic* form of supererogation, or does it collapse into moral duty (e.g., due diligence), prudence, or mere permissibility?*
      *   **Why Priority?** Epistemology underpins moral action. Understanding epistemic supererogation is vital for evaluating intellectual virtues (open-mindedness, curiosity), the ethics of inquiry (e.g., in science, journalism), and beliefs influencing supererogatory acts. Its distinctness challenges the often-assumed primacy of moral normativity.
      *   **Dependencies:** Downstream of the **Threshold Problem** (how costly *must* inquiry be?). Informed by work on **Collective Supererogation** (e.g., group epistemic duties/praise). Clarifies foundations for potential *moral* supererogation reliant on belief.
      *   **Tractability:** **Conceptual/Normative.** Requires analyzing the nature and scope of epistemic obligations (deriving from truth-goal, instrumentalism, or ethics?), the value of "excess" epistemic goods, and whether epistemic praise can be non-moral. Empirical work (on cognitive effort, biases, heuristics) informs the *feasibility* and *psychology* but not the *normative category* itself.
      *   **Evidence for Reordering:** Strong arguments successfully grounding core epistemic obligations *solely* in prudence or morality would diminish its distinctiveness and priority. Conversely, compelling cases demonstrating epistemic praise detached from moral consequences or self-interest would elevate it.

  4.  **The Scope of Supererogation's "Good" (Value Theory Link):** *What types of goods/value can supererogatory acts promote? Must they be moral goods, or can they include aesthetic, personal, or other non-moral values (e.g., heroic artistic creation, extreme athletic achievement)?*
      *   **Why Priority?** Determines the breadth and unity of the supererogatory domain. Challenges the assumption that supererogation is inherently *moral*. Impacts how we categorize acts of great non-moral excellence or sacrifice.
      *   **Dependencies:** Downstream of core **Threshold** and **Collective** definitions. Helps clarify the *point* of supererogation (e.g., maximizing good vs. expressing virtue). Informs **Epistemic Supererogation** (is the "good" truth? understanding?).
      *   **Tractability:** **Conceptual/Value-Theoretic.** Requires examining the relationship between moral and non-moral value, the nature of "praiseworthiness," and the aims of normative theories. Empirical work on what people *praise* is relevant but doesn't settle normative questions.
      *   **Evidence for Reordering:** A convincing argument that supererogation's essence *requires* moral good would deprioritize non-moral extensions. Widespread, stable intuitions praising non-moral "beyond duty" excellence would increase its urgency.

  **Explicitly Deprioritized Areas & Grounds:**

  *   **Overly Specific Taxonomies of Supererogatory Acts (e.g., exhaustive lists of "heroic" vs. "saintly" acts):** *Grounds: Limited Downstream Effect.* While descriptively interesting, fine-grained categorization offers less fundamental insight than resolving the core conceptual puzzles identified above. Priority lies in establishing the *possibility* and *structure* of the category first.
  *   **Performative or Symbolic Supererogation (e.g., purely expressive acts with minimal actual good):** *Grounds: Lower Importance & Intractability.* While relevant to virtue ethics and social dynamics, its moral significance is contested and often derivative of core supererogation + symbolic value. Establishing the core concept is prerequisite. Defining "good" in Priority 4 is more foundational.
  *   **Supererogation in Highly Specific Applied Contexts (e.g., *only* medical ethics or *only* AI ethics) without addressing the core concepts:** *Grounds: Limited Downstream Effect & Dependency.* Applied work *requires* the foundational conceptual clarity prioritized here. Premature focus on niche applications risks misapplying unstable concepts. Tackle the foundations first.
  *   **Pure Metaphysics of Agent Identity in Supererogation (e.g., personal identity over time puzzles):** *Grounds: Intractability & Lower Importance.* While deep, these issues are often peripheral to the core normative questions of duty, permission, and praise that define supererogation debates. Progress is unlikely and offers less payoff for the field than the ranked priorities.

  This agenda prioritizes resolving the *structural* and *categorical* ambiguities (Collective, Threshold, Epistemic Status) that currently hinder coherent theorizing across both individual and group contexts. Establishing these foundations is essential before significant progress can be made on more specific applications or extensions of supererogation theory.
