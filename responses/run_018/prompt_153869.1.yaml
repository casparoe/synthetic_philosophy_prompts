prompt: |-
  hey — prepping a problem set on ryle's knowing-how/knowing-that for my grad seminar, and i've been using my grading patterns on student answers as a consistency check. over the last few terms i've marked four cases with pretty clear verdicts, but i'm not actually sure what principle i'm tracking.

  1. the chef who bakes perfect sourdough but can't write the recipe or explain fermentation. i always mark 'knows how, full stop' and deny she knows that the dough needs 72% hydration, even though her hands behave like they do.

  2. the historian who lists every napoleonic battle date but has never held a musket. obvious: knows that, not how.

  3. the blind pianist who plays chopin by ear, can't read notation, and can't say why a minor chord sounds sad. i call it knowing how, and i deliberately leave open whether she knows that anything about harmony.

  4. the kid riding a bike who can't explain balance or angular momentum. knows how; definitely not knowing that physics.

  now the new case i'm adding: an llm fine-tuned on every automotive repair manual. ask it about a specific transmision fault it's never physically touched, and it generates correct step-by-step fixes 98% of the time. no body, no tools, no sensory feedback — pure token prediction. does it know how to fix it?

  i want the rule my four verdicts are running, the other rules that fit them equally well, and where they split on this llm case. if my precedents genuinely underdetermine it, what's the principle i'd be adopting either way? and what's the single further case that would actually distinguish the rules?

  please don't just quote ryle — work it out.
reasoning: |-
  Okay, the user is preparing a problem set on Ryle's knowing-how/knowing-that distinction for their grad seminar. They've been using their grading patterns on student answers as a consistency check. They've provided four clear cases with their verdicts and now have a new case involving an LLM trained on automotive repair manuals. They want to know the implicit principle behind their verdicts, alternative principles that fit their cases, where these principles split on the LLM case, and a further case to distinguish these principles.

  First, I need to analyze the four cases they've already decided:

  1. **The chef**: Knows how to bake sourdough but can't articulate the recipe or explain fermentation. Verdict: knows how, not knowing that (e.g., doesn't know that the dough needs 72% hydration).
  2. **The historian**: Knows factual dates of Napoleonic battles but has never held a musket. Verdict: knows that, not knowing how.
  3. **The blind pianist**: Plays Chopin by ear but can't read notation or explain why a minor chord sounds sad. Verdict: knows how, and they leave open whether she knows that anything about harmony.
  4. **The kid**: Rides a bike but can't explain balance or angular momentum. Verdict: knows how, not knowing that.

  Looking at these cases, the common thread seems to be that "knowing how" is tied to the ability to perform an action successfully, without needing to articulate the underlying principles. Whereas "knowing that" involves propositional knowledge—facts or explanations that can be stated verbally. 

  For the chef, even though their hands "behave as if" they know the hydration percentage, the inability to articulate it means they don't "know that." The historian has factual knowledge but lacks practical skill. The pianist can perform but can't explain the theory. The kid can ride but can't explain the physics.

  Now, the new case is an LLM that's been fine-tuned on automotive repair manuals. It can generate step-by-step fixes for transmission faults with 98% accuracy but has no physical body, tools, or sensory feedback. It's purely a language model predicting tokens. The question is whether it "knows how" to fix the car.

  The user's implicit principle seems to be that "knowing how" requires embodied, practical ability. All their previous cases of "knowing how" involve a physical component: the chef uses their hands, the pianist plays the piano, the kid rides a bike. The historian lacks that physical engagement, so they only "know that." The LLM, lacking any embodiment, might not qualify as "knowing how" under this principle.

  Alternative principles could be:
  - **Behavioral success**: If the agent produces the correct steps to achieve a goal, that's "knowing how," regardless of embodiment. Under this view, the LLM might "know how" because it generates accurate repair steps.
  - **Causal history**: Knowledge-how requires that the ability was acquired through practice or embodied experience. The chef, pianist, and kid all gained their skills through practice, while the LLM gained its through data training. The historian's knowledge came from studying, not practice.

  These principles would split on the LLM case. The embodied principle would deny "knowing how" to the LLM, while the behavioral success principle might grant it. The causal history principle would likely deny it unless the training data included embodied experiences, which it doesn't.

  To distinguish these principles, a further case could be a robot that's been physically trained to repair cars through trial and error. It can perform repairs successfully but can't explain the steps. This robot has embodiment and practical ability but no propositional knowledge. Under the embodied principle, it would "know how." Under behavioral success, it also would. But if the robot were trained solely on manuals without practice, the causal history principle might deny "knowing how," while behavioral success might still grant it. This helps tease apart the principles.

  The user might also be interested in whether the LLM's knowledge is merely "knowing that" since it outputs steps. But the historian case shows that listing steps isn't the same as "knowing how." The LLM generates instructions, which could be seen as "knowing that" the steps are correct, but without the ability to perform, it might not be "knowing how."

  The user's deeper need might be to explore the boundaries of knowledge attribution in AI contexts. They might want to challenge students to think about whether "knowing how" can be disembodied. By adding the LLM case, they're pushing the limits of Ryle's distinction, which was originally about human cognition, not AI. The grad seminar likely discusses contemporary applications of philosophical concepts, so this case bridges classic theory with modern tech.

  In summary, the implicit principle is embodiment for "knowing how." Alternatives are behavioral success and causal history. The LLM case splits them, and the robot repair case can further distinguish the principles. The user adopts a principle by prioritizing either embodiment or output effectiveness. The key is whether practical ability requires a physical agent or if simulated instructions suffice.
answer: |-
  Based on your clear verdicts on the four cases, here's the breakdown of the implicit principle, alternative principles, how they handle the LLM case, and a decisive further case:

  ### Your Implicit Principle
  **Embodied Practical Success Principle:**  
  *Knowledge-how* requires the **successful execution of a physical or embodied action** in the real world, independent of the ability to articulate propositions about it. *Knowledge-that* requires the **ability to state or recognize true propositions**, independent of practical skill.  

  **How it fits your cases:**  
  1. **Chef:** Embodied action (baking) succeeds → *knows-how*. Cannot articulate hydration facts → *lacks knowledge-that*.  
  2. **Historian:** Articulates facts → *knows-that*. No embodied action (never held a musket) → *lacks knowledge-how*.  
  3. **Blind Pianist:** Embodied action (playing) succeeds → *knows-how*. Open on theory because articulation isn't required for knowledge-how (consistent).  
  4. **Kid:** Embodied action (riding) succeeds → *knows-how*. Cannot articulate physics → *lacks knowledge-that*.  

  ### Alternative Principles That Fit Your Cases
  1. **Output-Centric Principle:**  
     *Knowledge-how* is demonstrated by **producing reliable instructions** for an action. *Knowledge-that* is demonstrated by **stating true facts**.  
     *Fits your cases:* Chef fails to produce instructions → no knowledge-how? *(But you said she knows-how!)* → **Fails**.  

  2. **Causal History Principle:**  
     *Knowledge-how* requires **learning through physical practice/feedback**. *Knowledge-that* requires **learning through propositional instruction**.  
     *Fits your cases:*  
     - Chef learned via practice → *knows-how*.  
     - Historian learned via texts → *knows-that*.  
     - Pianist learned by ear (auditory feedback) → *knows-how*.  
     - Kid learned by riding → *knows-how*.  
     *Problem:* Leaves pianist's harmony knowledge open (your verdict is silent here, so it fits).  

  3. **Success-Without-Articulation Principle:**  
     *Knowledge-how* exists when **goal-directed success** occurs **without reliance on articulation**.  
     *Fits your cases:* Chef, pianist, kid succeed without stating rules → *know-how*. Historian relies on articulation → *knows-that*.  

  ### How Principles Split on the LLM Case
  - **Your Principle (Embodied Success):**  
    LLM has **no body, no sensory feedback, no physical execution** → **DENIES knowledge-how**. It only *describes* actions (thus, arguably *knows-that* the steps are correct).  
  - **Causal History Principle:**  
    LLM learned from texts, **not physical practice** → **DENIES knowledge-how** (only *knows-that*).  
  - **Success-Without-Articulation Principle:**  
    LLM generates successful instructions **without articulating underlying theory** → **GRANTS knowledge-how** (like your chef).  

  ### If Precedents Underdetermine: The Principle You'd Adopt
  Your verdicts **do underdetermine** the LLM case because:  
  - They don’t specify whether *generating instructions* counts as "practical success."  
  - They don’t address systems lacking embodiment.  

  **Adopting "Knows-How" for LLM:**  
  You’d prioritize **functional output reliability** (the LLM "succeeds" by producing correct instructions). Principle: *Knowledge-how is the reliable generation of action-guiding outputs, regardless of embodiment*.  

  **Adopting "Not Knows-How" for LLM:**  
  You’d prioritize **embodied performance** (the LLM only *simulates* knowledge). Principle: *Knowledge-how requires an agent capable of physical intervention in the world*.  

  ### Single Further Case to Distinguish Principles
  **The Robot Mechanic:**  
  A robot is trained *solely on repair manuals* (no physical practice), then successfully fixes cars using its body/tools. It cannot explain *why* steps work.  

  - **Your Embodied Principle:** Robot physically acts → **GRANTS knowledge-how**.  
  - **Causal History Principle:** Learned via texts, not practice → **DENIES knowledge-how**.  
  - **Success-Without-Articulation:** Generates success → **GRANTS knowledge-how**.  

  **Why it distinguishes:**  
  - Splits your principle (embodied success) from Causal History.  
  - Reveals whether *learning method* or *execution capability* is key.  

  ### Conclusion
  Your rulings hinge on **embodied action as necessary for knowledge-how**. The LLM lacks this → *no knowledge-how*. The Robot Mechanic case forces a choice: if the robot "knows-how," embodiment trumps causal history; if not, causal history dominates. This exposes whether your principle values *performance* or *provenance*.  

  **Key takeaway for your seminar:** Ryle’s anti-intellectualism centers on *practice over propositions*, but your cases add a layer: *bodies over bytes*. The LLM challenges whether "guidance" suffices for know-how—or if the world must be *acted upon*.
