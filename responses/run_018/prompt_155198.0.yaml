  The structural feature that forces the split is the meta-amendment clause referencing its own prior state. Removing that makes it a regular amendment without self-reference, avoiding the paradox.

  Now, defending the social-practice view: co-ops are participatory, so member acceptance should trump strict formalism. The formalist might counter by saying that procedural legitimacy depends on following existing rules, not just acceptance. But in a co-op, the social practice is key, so I'll argue that the amendment stands.

