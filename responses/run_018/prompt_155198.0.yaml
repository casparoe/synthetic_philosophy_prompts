  - include a recursive clause: the charter contains a meta-ammendment that changes the amendment procedure by explicitly referencing its own prior state.
  - two theories in play: (a) a strict formalist/textualist view where validity is pure syntactic derivation from the authorizing rule, and (b) a hart-style social-practice view where validity depends on actual acceptance by the members.
  - engineer it so the formalist rejects the amendment as invalid, but not because of some obviously stupid misreading — it has to fall out of the best formal interpretation available. meanwhile the practice-based theory accepts it as valid because members actually went along with it.
  - after laying out the case, show me both verdicts step-by-step, name the exact structural feature that forces the split, and say what collapses if you remove it.
