  For the five criteria... Let's see. Accuracy: both accounts match evidence. Consistency: animal story has internal logic, human story matches grim realities. Scope: animal story explains more (like the meerkat bones). Simplicity: human story seems simpler but actually requires more exceptions. Fruitfulness: animal story yields meaning. Vector points to animal story, but not decisively - exactly Kuhn's point about value weighting.

