  Syllabus scenes... Opening the zoo gates (worldview disruption), young Pi defending multiple faiths (paradigm coexistence), Mr. Kumar dialogue (science/religion clash), and the investigator interview (paradigm choice). And the final tiger disappearance - paradigm shift as disappearance, not refutation.

  Biggest objection? The novel isn't about truth but meaning. Kuhn deals with theories, Pi with stories that sustain life. But maybe that's the point: when paradigms shape reality, the line between epistemology and survival blurs. 

