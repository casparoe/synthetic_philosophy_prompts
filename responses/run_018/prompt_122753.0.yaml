  Originality check: While demographic predictors echo base-rate neglect examples, the systematic treatment through partition-dependence feels new. The stratified and announcement cases weaponize the reference class problem in ways I haven't seen combined this way. Case 2's self-modification twist avoids being just another lesion problem by making unpredictability the controllable variable.

