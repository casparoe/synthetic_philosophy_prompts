answer: |-
  This is a brilliant question that cuts to the heart of persistence, identity, and the practical metaphysics embedded in institutional practices. There *is* no single consistent theory – different domains prioritize different aspects of "sameness" based on their core purposes and implicit ontologies. Here's a breakdown:

  **The Competing Implicit Ontologies:**

  1.  **Archival Science (Fixity Checking - Strict):**
      *   **Ontology:** **Numerical Identity via Material Integrity.** The object *is* its specific bit sequence. Change = new object. Identity is tied to the immutable physical/digital instantiation.
      *   **Underlying Metaphysics:** A form of **Atomism/Materialism.** The whole is strictly defined by the sum and specific arrangement of its immutable parts. Similar to Heraclitus ("You cannot step into the same river twice").
      *   **Priority:** **Authenticity & Trust.** The primary value is guaranteeing the *exact* preservation of the original record as evidence. Any alteration, however minor, potentially compromises its evidential value.

  2.  **Archival Science (Fixity Checking - 30% Rule):**
      *   **Ontology:** **Numerical Identity via Functional/Informational Integrity.** The object persists as long as its *core information content* or *functional essence* remains intact *despite* material changes. Minor repairs maintain identity.
      *   **Underlying Metaphysics:** A **Functionalist/Endurantist** view. The entity endures through time by maintaining its defining function or information structure. Parts can change as long as the essential "form" persists.
      *   **Priority:** **Preservation of Meaning & Practicality.** Recognizing the inevitability of decay/change in physical/digital media, this prioritizes preserving the *message* or *content* for access and use, accepting controlled intervention. The 30% threshold is **largely pragmatic**, not deeply principled – it's a risk management tool balancing authenticity concerns with technical realities (bit rot, format migration). It’s "how much noise can we tolerate before the signal is corrupted?"

  3.  **Corporate Law:**
      *   **Ontology:** **Numerical Identity via Formal/Relational Continuity.** The corporation is a **legal fiction** defined by its formal structure (articles of incorporation, bylaws), its relationships (contracts, licenses, debts), and its position within the legal system. Identity persists through total turnover of staff and assets because the *legal person*, defined by its rights, obligations, and formal existence, remains the same.
      *   **Underlying Metaphysics:** **Nominalism/Social Constructivism.** The corporation exists *only* as a socially and legally constructed entity. Its persistence is defined by the *continuation of the legal framework* that recognizes it, not its material composition or specific agents.
      *   **Priority:** **Stability, Responsibility, & Commerce.** Society needs stable entities to enter contracts, own property, be sued, pay taxes, and facilitate long-term economic activity. Constant re-incorporation with every change would be chaotic.

  4.  **Museums (Theseus's Ship vs. Reconstructed Painting):**
      *   **Ontology (Ship):** **Qualitative Identity/Aura via Original Material.** The value lies in the *aura* of the original material and its direct connection to the past/historical event. The specific planks *are* the ship's connection to Theseus. Replacing them all destroys the "original" object, even if it looks identical. It becomes a replica.
      *   **Ontology (Painting):** **Numerical Identity via Structure/Image Integrity.** The *image* (composition, brushstrokes, pigments) defines the artwork. A reconstruction aims to restore the *appearance* of the original image. However, if it lacks original material, it's not the *authentic* object but a derivative (copy/reconstruction). Museums prioritize *authenticity* tied to material origin.
      *   **Underlying Metaphysics:** **Material Authenticity & Historical Trace.** Museum practice heavily leans on Walter Benjamin's concept of "aura" – the unique, non-reproducible presence of the original artifact in time and space. Original material carries an irreplaceable historical trace.
      *   **Priority:** **Authenticity, Provenance, & Historical Connection.** The core value is preserving the physical link to the past and the artist's hand. Original material is paramount for "aura."

  **Can They Hang Together? The Quest for Coherence**

  *   **No Single Unified Theory:** There isn't one metaphysical view that seamlessly justifies all three. They prioritize different aspects:
      *   Archives (strict): Material instantiation.
      *   Archives (pragmatic): Informational integrity.
      *   Corporate Law: Formal/legal continuity.
      *   Museums: Material authenticity & historical trace.
  *   **Purpose-Driven Ontology:** The "correct" view of persistence is **purpose-relative**. Each institution defines identity based on what it needs the entity *to be* for its function:
      *   Archives need reliable evidence -> focus on fixity or controlled information integrity.
      *   Law needs stable actors -> focus on formal continuity.
      *   Museums need authentic connections to the past -> focus on original material/trace.
  *   **Family Resemblance (Wittgenstein)?** Concepts like "integrity," "continuity," and "essence" appear across domains, but are operationalized differently. It's more like overlapping similarities than a single defining core.

  **Your Collapse Scenario: Universalizing Strict Fixity**

  Applying the strict archival rule (">50% change = new entity") universally would be catastrophic:

  1.  **First Collapse: Corporations & Institutions.** As you noted, legal personhood would vanish constantly. Imagine:
      *   A company loses key contracts/assets -> potentially >50% value change -> ceases to exist.
      *   Major staffing turnover -> >50% employee change -> new "entity" inherits old debts/assets? Chaos.
      *   **Result:** Economic and legal systems implode. Contract enforcement, property rights, and long-term investment become impossible. Banks, governments, and large corporations collapse first due to inherent instability.
  2.  **Human Identity Crisis:** Biologically, most cells regenerate within years. Applying this rule, humans would lose their "personhood" multiple times in a lifetime. Legal rights, identity documents, medical records become meaningless. Society collapses.
  3.  **Museums:** Would only display fragments. Any restoration would turn originals into derivatives. Most major artworks/artifacts would vanish from public view as "inauthentic."
  4.  **Nature:** Rivers, mountains, ecosystems constantly change. Do they cease to exist when >50% of water molecules/rocks/species turnover? Environmental regulation becomes absurd.

  **The 30% Threshold: Principled or Pragmatic?**

  It's **overwhelmingly pragmatic**. There's no deep metaphysical principle dictating 30% vs. 25% or 35%. It stems from:

  1.  **Risk Management:** A balance between the near-certainty of minor bit rot over time and the need for reliable access. 30% is a buffer deemed acceptable *in practice* before data integrity is *likely* critically compromised.
  2.  **Technical Feasibility:** Based on observed rates of media decay and error correction capabilities. It's a number where repair is possible without overwhelming the system.
  3.  **Institutional Tolerance:** An agreement on "how much change can we accept before we feel the *essence* is lost or trust is broken?" This is inherently subjective but grounded in experience.
  4.  **Lack of Sharp Boundary:** Recognizing that identity loss isn't a binary switch flipped at 50%+1 bit, but a gradual erosion. 30% is an arbitrary line drawn in the sand for operational purposes.

  **Conclusion: Wingin' It with Shared (but Separate) Intuitions?**

  Yes, largely. We *are* winging it, but it's not purely arbitrary or chaotic:

  *   **Context is King:** Each domain develops its *implicit ontology* based on its core purpose and values (evidence, legal stability, historical authenticity). These ontologies are coherent *within their domain*.
  *   **Pragmatic Compromise:** Rules like the 30% threshold are practical solutions to unresolvable philosophical problems about persistence through change. They codify institutional risk tolerance and operational needs.
  *   **No Universal Essence:** There is no single "correct" answer to whether Theseus's ship is the same ship, or a company after 100% turnover is the same company. The answer depends entirely on *why* we are asking the question and what we need the entity *to be* in that context.
  *   **Intuitions Shaped by Purpose:** Our intuitions about identity *are* shaped by the contexts we operate in. An archivist's strict view, a lawyer's continuity view, and a conservator's authenticity view are all valid *for their respective tasks*.

  The fascinating revelation is that our most fundamental questions about identity and persistence are not answered by pure metaphysics, but are actively constructed and negotiated through the practical rules and institutions we build to manage the world. The "smuggled" ontologies are the necessary working fictions that allow these institutions to function.
