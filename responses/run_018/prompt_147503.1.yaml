prompt: |-
  hey, quick question about what metaphysics is hiding inside bureaucratic rules. there's this thing in archival science called fixity checking — libraries hash a digital file every year, and if the hash changes because bits rotted and got repaired, they have to decide whether its still the same record or a derivative. some archives say any bit-change breaks identity; others allow up to 30% repair and still call it the original. meanwhile corporate law treats a company as identical across total staff and asset turnover, and museums will display Theseus's ship with every plank replaced but put a reconstructed painting in the basement. what theory of composition — or of persistence — is smuggled into these different rules? is there one view that makes all three hang together, or do law, archives and museums run on incompatible implicit ontologies? and if we universalized the strict archive rule — say, you lose legal personhood the moment more than half your cells or employees change — which institutions collapse first? also is the 30% threshold principled, or just a number someone picked? trying to figure out if there's actually a consistent answer or if we're all just winging it with seperate intuitions.
