answer: |-
  ### Decision Procedure for Selection Method (Election vs. Sortition)  
  **Core Principle**: Use random selection (sortition) to minimize elite capture and ensure descriptive representation, unless specific conditions demand elected accountability or expertise.  

  #### Step-by-Step Procedure:  
  1. **Purpose of the Body**  
     - *Question*: What is the primary function?  
     - *Stop for Sortition*: If purely fact-finding, impartial adjudication, or descriptive representation (e.g., reflecting demographic diversity).  
     - *Stop for Election*: If binding policy-making, negotiation, or ongoing representation (e.g., delegates with discretionary authority).  
     - *Judgment Call*: If mixed (e.g., both advisory and executive powers).  

  2. **Stakes**  
     - *Question*: How severe are the consequences of poor decisions?  
     - *Stop for Sortition*: Low stakes (minor resource impacts, non-binding outcomes).  
     - *Stop for Election*: High stakes (existential risks, major financial/legal exposure).  
     - *Judgment Call*: Moderate stakes (e.g., significant but reversible impacts).  

  3. **Expertise Requirement**  
     - *Question*: Is specialized skill/knowledge essential?  
     - *Stop for Sortition*: Expertise is minimal or learnable during service (e.g., basic rules training suffices).  
     - *Stop for Election*: Deep, rare expertise needed upfront (e.g., legal/technical fluency).  
     - *Judgment Call*: Partial expertise (e.g., some learnable, some innate).  

  4. **Vulnerability to Capture/Bias**  
     - *Question*: Could elections favor insiders, factions, or campaigners?  
     - *Stop for Sortition*: High vulnerability (history of cliques, unequal influence).  
     - *Stop for Election*: Low vulnerability (trusted culture, low incentives for manipulation).  
     - *Judgment Call*: Uncertain vulnerability (e.g., new context).  

  5. **Accountability Need**  
     - *Question*: Must members directly hold the body accountable?  
     - *Stop for Sortition*: Accountability irrelevant (short-term, observational, or audit-only roles).  
     - *Stop for Election*: Essential (e.g., recurring mandates, public-facing authority).  
     - *Judgment Call*: Partial accountability (e.g., retrospective review suffices).  

  #### Shadow Panel Evaluation  
  - **Improves Legitimacy** when:  
    - Capture risk is high (e.g., elected/expert bodies).  
    - Deliberations benefit from transparency (e.g., contentious issues).  
    - The panel reports publicly (not just internally).  
  - **Adds Noise** when:  
    - Stakes are low (overkill for minor decisions).  
    - Observers lack training, causing distractions or groupthink.  
    - Confidentiality is critical (e.g., sensitive negotiations).  
  - **Verdict**: Useful *supplement* for high-capture-risk cases but not a standalone solution.  

  ---

  ### Application to Cases  
  **Case 1: Solar-Installation Dispute Panel**  
  - Purpose: Fact-finding (impartial adjudication).  
  - Stakes: High personal, low organizational → **Moderate**.  
  - Expertise: Factual/learnable (e.g., contract review).  
  - Capture Risk: High (disputes may involve friends/factions).  
  - Accountability: Non-essential (one-off rulings).  
  - **Recommendation**: **Pure sortition** (stops at *Purpose* and *Capture Risk*).  
  - **Conflict with Instinct**: Yes (cooperative prefers "experienced" members).  
  - **Unresolved**: Whether sortition can handle emotionally charged neighbor disputes fairly.  

  **Case 2: City Utility Contract Team**  
  - Purpose: Binding negotiation (requires strategy).  
  - Stakes: Very high (long-term financial/operational impact).  
  - Expertise: High (technical/legal knowledge).  
  - Capture Risk: Moderate (insiders may favor relationships).  
  - Accountability: Essential (deals bind cooperative).  
  - **Recommendation**: **Election** (stops at *Purpose* and *Expertise*).  

  **Case 3: Regional Alliance Representatives**  
  - Purpose: Ongoing policy representation.  
  - Stakes: High (collective policy impact).  
  - Expertise: Learnable (e.g., issue briefings).  
  - Capture Risk: High (campaigning could skew toward vocal minorities).  
  - Accountability: Essential (members need recourse).  
  - **Recommendation**: **Judgment Call** (mixed signals: *Purpose/Accountability* favor election; *Capture Risk* favors sortition). Trade-offs:  
    - Election ensures accountability but risks capture.  
    - Sortition ensures fairness but may reduce strategic agility.  

  ---

  ### Procedure Limitations  
  - Not designed to:  
    1. Hybridize methods (e.g., sortition with expert screening).  
    2. Define body size or term length.  
    3. Address implementation logistics (e.g., opt-out rules for sortition).  
    4. Resolve deep value conflicts (e.g., "fairness vs. efficiency").  
    5. Replace external legal/regulatory requirements.  

