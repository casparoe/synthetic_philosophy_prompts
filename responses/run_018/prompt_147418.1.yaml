prompt: |-
  I help run a neighborhood energy cooperative, and I have no formal background in political theory, but I have been thinking about whether we should keep electing our dispute and contract boards or switch to selecting people by lot. I want to turn the core principle behind sortition—random selection to reduce capture and improve descriptive representation—into a reusable decision procedure my cooperative can apply whenever we need to staff a decision-making body. The procedure should ask, in order: what is the body's purpose, how high are the stakes, how much specialized expertise is genuinely required versus learnable, how vulnerable the selection is to insider capture or campaigning bias, and whether accountability to the membership is essential. For each question, specify what counts as a sufficient answer, where the procedure stops with a clear recommendation for election, where it stops with a clear recommendation for pure sortition, and where it must hand the decision to a values judgment because the facts do not settle it. Include explicit evaluation of a mechanism I am considering: a "shadow panel" of randomly selected observers who attend deliberations but do not vote, intended to detect capture. The procedure should say whether this shadow mechanism improves legitimacy or merely adds noise, with conditions.

  Then apply the procedure to three proposals:
  1. A three-person panel to adjudicate solar-installation disputes between neighbors (mostly factual, low organizational stakes but high personal stakes for the parties).
  2. A five-person team to negotiate a ten-year contract with the city utility (high technical complexity, high organizational stakes, long commitment).
  3. Two representatives for a regional alliance where they will vote on shared policy positions (representative function, need for ongoing accountability).

  In one of these cases, the procedure should recommend pure sortition even though our cooperative's instinct is to elect experienced, known members; flag that case explicitly and explain what the procedure still cannot resolve. Also state clearly what the procedure is not designed to do.

  Finally, provide a brief structured summary as a JSON object with exactly these fields: procedure_name (string), decision_nodes (array of objects with node_name and stop_condition), shadow_panel_verdict (object with recommendation, conditions_where_helpful, and conditions_where_harmful), case_results (array of objects with case_name, method_selected, judgment_call_flagged as boolean, and conflict_with_instinct as boolean), and procedure_limitations (array of strings). Do not ask for bibliographies or citations; ground the reasoning in the logic of selection and representation itself.
reasoning: |-
  We are designing a decision procedure to choose between election and sortition for staffing a decision-making body in a neighborhood energy cooperative. The procedure has five key questions in order:

  1. **Purpose of the body**: What is the primary function?
     - If the purpose is primarily **fact-finding or descriptive representation**, this leans toward sortition.
     - If the purpose requires **strong accountability to the membership** (like policy-making or negotiation), this leans toward election.
     - Stop condition: If the purpose is purely descriptive (e.g., a focus group) or requires immediate accountability (e.g., a negotiating team with binding authority), then we can stop and recommend sortition or election respectively. Otherwise, move to next question.

  2. **Stakes**: How high are the stakes for the organization and individuals?
     - **Low stakes**: Leans toward sortition (as errors are less critical).
     - **High stakes**: Leans toward election (to ensure competence and reduce risk).
     - Stop condition: If stakes are very low (e.g., advisory with minimal impact), sortition is clear. If stakes are extremely high (e.g., existential decisions), election is clear. Otherwise, move on.

  3. **Expertise**: How much specialized expertise is required vs. learnable?
     - If the required expertise is **minimal or can be learned quickly** during service, sortition is feasible.
     - If the role requires **deep, pre-existing expertise** (e.g., legal, technical, or negotiation skills), election (or appointment) is better.
     - Stop condition: If expertise is clearly non-essential and learnable, sortition is clear. If expertise is critical and rare among members, election is clear. Otherwise, move on.

  4. **Vulnerability to capture or bias**: How likely is the selection process to be captured by insiders or distorted by campaigning?
     - If the process is **highly vulnerable** (e.g., history of factionalism, potential for lobbying), sortition can mitigate this.
     - If the process is **less vulnerable** (e.g., in a highly trusted, small group), election may be acceptable.
     - Stop condition: If vulnerability is very high and has caused problems before, sortition is clear. If vulnerability is very low (e.g., in a highly cohesive group with strong norms against campaigning), election is clear. Otherwise, move on.

  5. **Accountability**: Is ongoing accountability to the membership essential?
     - If **yes** (e.g., for representatives who make ongoing decisions), election is better.
     - If **no** (e.g., a one-time decision or a body that only advises), sortition may suffice.
     - Stop condition: If accountability is essential (e.g., the body has long-term power), election. If not, sortition. Otherwise, it's a judgment call.

  If after these questions there is no clear stop (i.e., mixed signals), then the decision requires a values judgment (e.g., trade-off between representation and expertise).

  **Shadow Panel Evaluation**:
  - A shadow panel of randomly selected observers attends deliberations without voting. They can report on the process and detect capture.
  - **Helpful when**: 
    - The body is elected and there are concerns about capture, so the shadow panel adds oversight without changing the selection method.
    - The body uses sortition and we want to ensure transparency and legitimacy by having additional observers.
    - The stakes are high and the organization values transparency.
  - **Harmful when**:
    - It adds unnecessary bureaucracy and cost for low-stakes bodies.
    - The presence of observers might inhibit open discussion (chilling effect).
    - If the shadow panel is not well-integrated (e.g., no clear reporting mechanism), it may add noise without benefit.
  - **Verdict**: The shadow panel improves legitimacy in cases where capture is a concern and the process benefits from transparency. It is not a substitute for the core selection method but an additive mechanism.

  **Application to Cases**:

  1. **Solar-Installation Dispute Panel (3-person)**:
     - Purpose: Adjudicate disputes (fact-finding, quasi-judicial).
     - Stakes: High personal stakes for parties, low organizational stakes (individual disputes).
     - Expertise: Mostly factual, some technical knowledge but learnable (e.g., understanding contracts and solar specs).
     - Vulnerability: Could be high if disputes are frequent and members have conflicts of interest; sortition reduces bias.
     - Accountability: Not essential for a one-off dispute panel (decision is binding but not ongoing).
     - **Recommendation**: Sortition. The procedure stops at the first question because the purpose is fact-finding, which leans toward sortition. Also, vulnerability to bias is a concern. The cooperative's instinct to elect experienced members is noted, but the procedure overrides because expertise is learnable and descriptive representation (impartiality) is key.

  2. **Contract Negotiation Team (5-person)**:
     - Purpose: Negotiate a long-term contract (requires expertise and strategic thinking).
     - Stakes: Very high (financial and operational impact for 10 years).
     - Expertise: High technical complexity (legal, financial, energy markets) – likely requires pre-existing expertise.
     - Vulnerability: High if elections become politicized, but expertise is critical.
     - Accountability: Essential because they represent the cooperative in binding negotiations.
     - **Recommendation**: Election. The procedure stops at the expertise question because the required skills are deep and not easily learnable by randomly selected members. Accountability is also essential. This aligns with the cooperative's instinct.

  3. **Regional Alliance Representatives (2-person)**:
     - Purpose: Represent the cooperative in a regional body, voting on shared policy positions (ongoing representation).
     - Stakes: High organizational stakes (policies affect the cooperative).
     - Expertise: Some learnable (policy issues), but negotiation and relationship-building are key.
     - Vulnerability: Election campaigns could lead to factionalism, but sortition might produce unprepared representatives.
     - Accountability: Essential (ongoing role).
     - **Procedure outcome**: After all questions, we have mixed signals. 
       - Purpose: Representative function → leans election.
       - Stakes: High → leans election.
       - Expertise: Learnable → leans sortition.
       - Vulnerability: Could be high → leans sortition.
       - Accountability: Essential → leans election.
     - This requires a values judgment: trade-off between the risk of capture in elections vs. the need for accountability and expertise. 
     - **Recommendation**: The procedure does not stop clearly. We flag this as a judgment call. The cooperative must decide whether to prioritize reducing capture (sortition) or ensuring accountability (election). 
     - However, note: The procedure recommends pure sortition in the first case (dispute panel) even though the cooperative's instinct is to elect. The conflict_with_instinct is true for case 1.

  **Procedure Limitations**:
  - Not designed to handle hybrid methods (e.g., sortition with qualification screening).
  - Does not account for the size of the body or the pool of candidates.
  - Does not consider time constraints (e.g., how quickly a body must be formed).
  - Does not evaluate the cost of elections vs. sortition.
  - Assumes that the membership is large enough for sortition to be statistically representative.

