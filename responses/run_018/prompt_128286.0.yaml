prompt: |-
  I run a small rationalist-adjacent discussion group—mostly people with technical backgrounds who have read some effective-altruism and decision-theory literature but have never taken a formal philosophy course. Next session I want to teach the inefficacy objection in collective-harm cases (climate emissions, meat consumption, voting), but I do not want to retread the standard “one vote doesn’t matter” script. Instead, I want to build the explanation around a framing I have not seen formalized in the usual literature: the distinction between causal redundancy in the actual world and what I will call counterfactual fragility—the property of being a necessary link within a sufficient set across nearby possible worlds, rather than being merely substitutable in the world that actually obtains. I need a teaching plan, not the explanation itself.

  Please structure the plan as follows. First, the dependency order: what idea must be in place before the redundancy/fragility distinction can even be posed, and what must come immediately after so the distinction does not collapse into naive expected-value reasoning? Second, the carrying example: one concrete scenario—preferably not voting or a single hamburger, since those trigger pre-cooked intuitions—that illustrates both actual-world redundancy and counterfactual fragility, and explain exactly what features the example must possess and what it must lack in order to serve this double purpose. Third, the misconception map: the audience will likely arrive with at least three errors—probably that this is just small-probability expected utility, that institutional mediation makes individual causation moot, and that the problem is purely epistemic rather than modal. For each, specify where in the sequence it will surface and the precise move to head it off without derailing the arc. Fourth, one check-for-understanding question that specifically diagnoses whether they have grasped counterfactual fragility rather than just the general idea that collective harm is structurally complicated. Fifth, state openly what should be left out at this level—threshold deontology, institutional-design literature, or formal game-theoretic models—and explain why omitting it is pedagogically necessary rather than a gap. The audience is technically fluent but philosophically naive; the goal is that they leave seeing the inefficacy objection as a modal-structure problem, not a scale problem.
reasoning: |-
  We are building a teaching plan for a discussion group on the inefficacy objection in collective-harm cases, using a novel framing: the distinction between causal redundancy (in the actual world) and counterfactual fragility (being a necessary link within a sufficient set across nearby possible worlds). The goal is to avoid the standard "one vote doesn't matter" script and instead focus on the modal structure.

  Plan structure:

  1. Dependency Order:
     - Prerequisite: The group must understand the basic structure of a collective harm case (many small contributions that together cause harm, but each seems individually negligible). They should also be familiar with the concept of counterfactuals (what would happen if I did X?) and the idea of expected value (EV) reasoning for small probabilities. However, we are going beyond EV reasoning.
     - Immediately after introducing the redundancy/fragility distinction: We must connect it to the moral significance of one's action. We need to show that even if an action is redundant in the actual world (because someone else would have done it), it might be counterfactually fragile (if in many nearby worlds, the outcome hinges on my action). We must then explain why this matters for moral responsibility without collapsing into the idea that we are just multiplying the harm by a small probability (which is EV reasoning). Instead, we are looking at the modal robustness of the causal structure.

  2. Carrying Example:
     - Scenario: Imagine a group of 100 people who must carry a heavy statue up a hill. The statue is very fragile and will break if it is dropped. Each person is holding the statue with one hand. The statue is so heavy that it requires at least 90 people to hold it without dropping. If fewer than 90 are holding, it drops and breaks. Now, suppose that exactly 90 people are holding the statue (so 10 are not). Consider one of the 90 who is holding. 
       - Actual-world redundancy: If this one person lets go, the statue remains held by 89 others, which is still above 90? Wait, no: 89 < 90, so it would break. But we want redundancy. So let's adjust: the statue requires exactly 90 to hold it. If 91 are holding, then one person is redundant. If that one person lets go, the statue is still held by 90. So in the actual world, that person is redundant (they are the 91st).
       - Counterfactual fragility: Now, we consider nearby possible worlds. In the actual world, 91 are holding. But in a nearby world, one of the other 90 (who are essential) might have been unable to hold (e.g., because they slipped). In that world, if our person (the 91st) had not been holding, then the statue would have broken because the other 90 would have been reduced to 89 (if the one who slipped is not holding and our person also isn't, then we have 89). But because our person was holding, they compensated for the one who slipped. So in that nearby world, the action of our person was necessary to prevent the breaking. Thus, the person is counterfactually fragile: across nearby worlds, there are some in which their action is a necessary link in a sufficient set (the set of 90 that actually holds the statue, but in that world, one member is missing and our person's action becomes necessary to complete the set).

     - Features the example must possess:
       - It must have a clear threshold (90 required) so that we can have a surplus (91) leading to redundancy in the actual world.
       - It must allow for the possibility of failures (like someone slipping) in nearby worlds so that the redundant person becomes necessary in some of those worlds.
       - It must avoid being a voting or meat-consumption example to prevent pre-cooked intuitions.

     - What it must lack:
       - It should not be a case where the outcome is deterministic and the individual's contribution is always necessary (like if we had exactly 90 holding and no more). That would not illustrate redundancy in the actual world.
       - It should not be a case where the outcome is probabilistic in the actual world (e.g., the statue breaks with some probability if there are 91) because that would push toward expected value reasoning.

  3. Misconception Map:
     - Misconception 1: "This is just small-probability expected utility." 
       - Where it surfaces: When we introduce the idea that in nearby worlds the person's action is necessary and we assign some probability to those worlds, the audience might think we are just doing EV by multiplying the harm by the probability of being pivotal.
       - How to head it off: Emphasize that the issue is not the probability but the modal structure. In the carrying example, we are not assigning a probability to the slip; we are noting that in the set of nearby worlds (which are metaphysically or nomically possible), there are worlds in which the person's action is necessary. The moral significance comes from the fact that the person's action is part of a pattern that is modally fragile, not from the expected harm. We can say that EV reasoning is one way to operationalize the importance, but the underlying structure is modal.

     - Misconception 2: "Institutional mediation makes individual causation moot."
       - Where it surfaces: When we discuss real-world examples (like climate change or voting) after the carrying example, someone might argue that in systems with complex institutions, individual actions are too mediated to have any clear counterfactual effect.
       - How to head it off: Point out that the carrying example is a simple physical analogy, but the same modal structure can appear in institutional settings. For instance, in a voting system, if we consider a large electorate, one vote is redundant (if the candidate wins by more than one vote) but counterfactually fragile (in nearby worlds where the election is closer, that vote might be pivotal). The institutional mediation does not erase the modal structure; it may just make the set of nearby worlds in which one is pivotal smaller or harder to identify.

     - Misconception 3: "The problem is purely epistemic rather than modal."
       - Where it surfaces: When we talk about not knowing which worlds are nearby or what the threshold is, someone might say that the only issue is our lack of knowledge.
       - How to head it off: Clarify that the modal structure exists independently of our knowledge. The carrying example has a fixed threshold (90) and a fixed set of people. We might not know who will slip, but the fact that slips are possible (and that in those worlds the redundant holder becomes necessary) is a modal fact. The epistemic problem (we don't know if we are the 91st or the 90th) is separate and does not negate the modal structure.

  4. Check-for-understanding question:
     - "In the carrying example, suppose we have 95 people holding the statue (which requires 90). We focus on one person who is holding. In the actual world, if they let go, the statue is still held (by 94). But why might we say that this person's action is counterfactually fragile? And how does this differ from saying that there is a small probability that their action was necessary?"

     - We want them to explain that in nearby worlds where up to 4 other people slip (so that the total holding would be 90 without our person, and then without our person it would drop to 89 and break), the action of our person becomes necessary. And we want them to note that the point is not about assigning a probability to being pivotal (though that might be a consequence) but about the existence of nearby worlds in which the action is necessary for the outcome.

  5. Omissions and why:
     - Threshold deontology: We will not discuss deontological rules that might say it's wrong to contribute to a harm even if it's below the threshold. Reason: This is a separate moral issue and would complicate the focus on the modal structure of causation.
     - Institutional-design literature: We avoid discussing how institutions can be designed to make individual actions more pivotal (e.g., voting systems that are more sensitive). Reason: While important, it shifts focus to solutions rather than understanding the problem's structure.
     - Formal game-theoretic models: We avoid using game theory to model the situation (like equilibrium analysis). Reason: The audience is philosophically naive and we want to keep the discussion conceptual. Game theory might be a next step but is not necessary for grasping the modal distinction.

  The goal is to have the group see that the inefficacy objection is about the modal structure of causation in collective harm cases, not just about the small scale of individual impact.
answer: |-
  ### Teaching Plan: Inefficacy Objection via Causal Redundancy vs. Counterfactual Fragility

  **Goal:** Participants grasp that the inefficacy objection hinges on *modal structure* (how actions relate to outcomes across possible worlds), not scale or probability.

  ---

  #### **1. Dependency Order**  
  *(Sequential building blocks to avoid confusion)*  
  - **Prerequisite 1: Collective Harm Structure**  
    - *Idea:* Explain a canonical collective-harm case (e.g., 1M people each emit 1 ton of CO₂, causing a hurricane; one ton seems irrelevant).  
    - *Why first?* Participants must recognize the *actual-world causal redundancy*—each contribution is substitutable (if I don’t emit, someone else will).  
  - **Prerequisite 2: Counterfactuals 101**  
    - *Idea:* Define counterfactuals ("If I had acted differently, what would happen?") using a *deterministic* example (e.g., "If I hadn’t refilled the water bowl, the dog would have thirsted").  
    - *Why next?* Sets up modal reasoning without probability. Emphasize "nearby possible worlds" (small changes, same physical/social laws).  
  - **Core Distinction: Redundancy vs. Fragility**  
    - Introduce:  
      - *Actual-world causal redundancy:* My action isn’t needed; others’ actions suffice without me.  
      - *Counterfactual fragility:* Across nearby worlds, my action is a *necessary link* in a sufficient set (if I defect, the outcome flips because others *also* defect in those worlds).  
  - **Immediate Follow-Up: Moral Relevance**  
    - *Idea:* Argue that fragility (not redundancy) may confer moral responsibility.  
    - *Why here?* Prevents collapse into expected value (EV) by stressing *modal robustness*: Fragility exists even if pivotality is improbable.  

  ---

  #### **2. Carrying Example**  
  *(Concrete scenario to illustrate both concepts)*  
  **Scenario:**  
  - *Setup:* 100 hikers must carry a fragile artifact across a ravine. The artifact requires **exactly 90 people** lifting simultaneously to avoid shattering. In the actual world, **91 people lift**; 9 abstain. One lifter (Alice) asks: "Does my lifting matter?"  
  - **Actual-World Redundancy:**  
    - If Alice doesn’t lift, 90 others lift → artifact survives.  
    - *Feature:* Alice is redundant *in this world* (91 > 90).  
  - **Counterfactual Fragility:**  
    - In nearby worlds, 1–2 other lifters slip (due to rain, fatigue, etc.). If Alice doesn’t lift *and* 1 other slips, only 89 lift → artifact shatters.  
    - *Feature:* Alice’s action is a necessary part of a *sufficient set* (the 90) *across worlds* where others might defect.  
  - **Critical Features:**  
    - *Must have:*  
      - Clear threshold (90 required) to define sufficiency.  
      - Actual surplus (91 lifting) to show redundancy.  
      - Non-random *dependencies* (e.g., slippage correlates with conditions affecting many).  
    - *Must lack:*  
      - Low-stakes intuition (unlike voting/hamburgers).  
      - Probabilistic outcomes (avoids EV confusion).  

  ---

  #### **3. Misconception Map**  
  *(Preempting errors without derailing)*  
  - **Misconception 1: "This is just small-probability EV reasoning."**  
    - *When it surfaces:* During fragility explanation (e.g., "So we multiply harm by P(pivotal)?").  
    - *Head-off move:* Contrast:  
      - **EV:** Quantifies *how likely* Alice is pivotal.  
      - **Fragility:** Notes that pivotality *occurs in nearby worlds*, even if improbable. Moral weight comes from *modal closeness*, not probability.  
  - **Misconception 2: "Institutional mediation voids individual causation."**  
    - *When it surfaces:* Applying to real cases (e.g., "But corporations/governments cause climate change!").  
    - *Head-off move:* Argue institutions *mediate* but don’t erase fragility:  
      - "Institutions aggregate actions, creating new thresholds. Your emission could be fragile if policy triggers at 1M tons, and your ton crosses it in worlds where others emit less."  
  - **Misconception 3: "This is epistemic—we just don’t know if we’re pivotal."**  
    - *When it surfaces:* After the carrying example (e.g., "But can’t we solve this with better data?").  
    - *Head-off move:* Distinguish:  
      - **Epistemic:** Uncertainty about *actual* pivotality.  
      - **Modal:** Fragility exists *objectively*; our ignorance doesn’t change the structure.  

  ---

  #### **4. Check-for-Understanding Question**  
  **Question:**  
  > *"In the carrying example, suppose Alice is redundant (91 lifters). Why might we still say her action is ‘counterfactually fragile’—and how is this different from her action having a ‘small probability of mattering’?"*  

  **Diagnostic:**  
  - **Targets fragility:** Correct answers note that fragility depends on outcomes in *close worlds* (e.g., where others slip), not probability.  
  - **Red flag:** Answers reducing fragility to "low EV" or "uncertainty."  

  ---

  #### **5. Deliberate Omissions**  
  - **Threshold Deontology:**  
    - *Omit:* Rules like "never contribute to harm over a threshold."  
    - *Why:* Introduces normative complexity, distracting from the descriptive modal-structure focus.  
  - **Institutional-Design Literature:**  
    - *Omit:* How to make systems less fragile (e.g., voting reform).  
    - *Why:* Shifts focus to solutions; goal here is problem-structure diagnosis.  
  - **Formal Game Theory:**  
    - *Omit:* Nash equilibria, payoff matrices.  
    - *Why:* Philosophically naïve audiences may conflate strategic rationality with modal causation.  

  **Rationale for Omissions:** Keeping the lesson *focused on modal metaphysics* prevents conflation with probability, ethics, or design. Participants should walk away seeing inefficacy as a problem of *how actions hook to outcomes across worlds*.  

  ---  
  **Outcome Metric:** Success if participants frame objections like, "But is this harm *modally fragile*?" rather than "But my impact is tiny!"
