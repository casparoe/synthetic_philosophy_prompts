answer: |-
  ### The Sestina at the Table  

  Here at the table, truth is told in **edge**,  
  the quiet space between the offered **odds**  
  and what I know. I set my modest **stake** —  
  a fraction, fenced by reason, risking **nothing**  
  of the whole. A cautious creed: to **run**  
  the long path slow, and pray I don’t **double**  

  down too soon. The wheel spins wild. **Double**  
  or quits? The dealer’s cut, that gleaming **edge** —  
  it gleams for all. But time will **run**  
  its course. The cards expose their **odds**,  
  their fickle arithmetic. I stake **nothing**  
  more than planned. This coin, this quiet **stake**,  

  is planted firm. The wise hold: **stake**  
  by geometric law. Why **double**  
  when a half-step keeps you risking **nothing**  
  vital? The house may grind its **edge**,  
  but compound growth outlasts bad **odds**  
  if losses never break your **run**.  

  Yet ruin waits beneath. One **run**  
  of black eclipses every **stake**  
  when margin calls demand. Then **odds**  
  collapse. A single **double**  
  loss can shred your life’s thin **edge**  
  to **nothing**. Order matters then. The **nothing**  

  that was safe becomes a **nothing**  
  cold. The wheel’s first fatal **run**  
  stops the game. Past that grim **edge**,  
  no fraction saves a shattered **stake**.  
  The bold one scorns my fear: *“To **double**  
  or to die! Why flinch at **odds**  

  if cliffs await? Your timid **odds**  
  of clearing heights? I’ll risk **nothing**  
  less than all. My leap must **double**  
  toward the target. One bold **run**,  
  one throw to seize the final **stake**  
  before the clock cuts off the **edge!”**  

  His way: the **edge** of cliffs demands a **run**  
  at **nothing** held. My **stake**? A slow **double**  
  growth through time. Both pay the **odds**.  

  ### Envoi  
  Two paths diverge: the cliff’s sheer **edge**  
  versus the long compounded **run**.  
  One **stake**s **nothing**, one must **double**,  
  each facing the same cold **odds**.  

  ---  

