prompt: |-
  write a short story about a harbor town where every adult wears a 'tether-belt' woven by their neigbor — cutting it is like saying you don't belong, and for generations it's been pure honor, not law. lately people are ditching them, but not becuase anyone wrote a pamphlet saying its wrong. instead there's this weird economic shift: the rope fiber happens to insulate deep-sea cables, so merchants pay more for raw strands than for woven belts. show one morning with three people: one cuts her belt to sell the fiber for rent money, one keeps hers becuase her neighbor is ill and loyalty still feels real, one sees a stranger walking free and realizes she doesn't feel shame anymore. don't have anyone lecture about morality or cite thinkers — just end with the town unsure whether economics, hidden argument, or honor collapsing killed the custom. keep it grounded in one street, around 400 words.
