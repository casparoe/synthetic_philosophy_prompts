prompt: |-
  You serve as lead auditor for an automated infrastructure consortium that manages distributed chemical-processing nodes. After every contamination or overflow incident, you must file a causal-attribution report identifying which system omissions—failures of sensors, valves, or protocols to act—count as genuine causes of the harm rather than as mere background conditions. The distinction carries regulatory weight: an omission listed as a cause triggers mandatory redesign; one listed only as a contributing condition does not. You apply this judgment repeatedly—roughly twice per month—under time pressure of about thirty minutes per report, and your signed report is then read by engineers and regulators with no philosophical training. You need a reusable decision procedure that your team can run without you, grounded in the philosophical analysis of causation by omission but stripped of technical vocabulary and made executable by non-specialists.

  The procedure should operationalize the following conceptual framework, which combines standard distinctions with an institutional refinement you must build in. First, an omission is causally relevant only relative to a baseline expectation of action—what can be called a design or normative baseline—not relative to arbitrary absence. Second, the omission must be counterfactually necessary: had the expected action occurred, the harmful outcome would have been prevented or substantially altered, holding the surrounding causal structure fixed. Third, distinguish Type-I omissions, in which a system was expected to interrupt an active causal chain (for example, shutting a valve to stop a flow), from Type-II omissions, in which a system was expected to maintain a static safeguard (for example, sustaining a pressure threshold). For Type-I, test counterfactual necessity by asking whether the interruption would have broken the chain; for Type-II, ask whether the safeguard’s presence would have blocked the pathway entirely. Fourth, apply an operational-override check: if the design baseline was legitimately suspended by a documented protocol update, maintenance window, or formal reassignment order at the time of the incident, then the expectation of action no longer holds, and the omission falls back to a mere non-event rather than a cause.

  Write the procedure as an ordered sequence of questions your auditors can ask, with explicit stopping rules (where the answer is do not list as cause), explicit hand-off points (where the question turns on values, liability allocation, or institutional blame rather than on factual causation), and clear flags for where the procedure is likely to misfire or produce false positives. Preserve the distinctions that actually affect the regulatory outcome, but express them in language usable by engineers and lawyers.

  Then apply the procedure to three cases:

  1. A chlorine-monitoring node in a water-treatment network fails to trigger a shutdown valve during a contamination spike. The valve was designed to respond within two seconds; logs show no signal was sent. The node had not been reassigned, updated, or placed in maintenance mode. Walk through the procedure and state the classification.

  2. The same type of node is present but was placed in maintenance mode by an authorized technician three hours before the incident, disabling automatic shutdown while manual checks were scheduled. No manual check occurred, and contamination followed. Walk through the procedure, show exactly what the operational-override check does, and state the classification—including whether any part of the decision reaches a hand-off point.

  3. A pressure-safeguard system was expected to maintain a static threshold (Type-II) and did not, allowing a slow leak that accumulated over several days. The logs show the safeguard was technically active but calibrated to a new, higher tolerance that management had approved informally—without updating the design documentation—one week prior. Walk through the procedure and explain why this is the case where the procedure gives you, the auditor, an answer you will not like: it either forces you to list the omission as a cause despite the informal management approval, or it forces you to invoke a value-laden hand-off about whether informal approvals can override documented baselines.

  In each application, specify exactly where in the sequence the decision is made, what evidence is required, and where judgment cannot be eliminated. Do not cite specific philosophical texts by name, do not provide a bibliography, and do not ask for one. Keep the output usable by practitioners who have never read the underlying theory, but do not collapse the Type-I versus Type-II distinction or the operational-override check into a single vague step.
reasoning: |-
  We are creating a decision procedure for auditors to determine if an omission (failure of sensors, valves, or protocols to act) is a genuine cause of harm (requiring mandatory redesign) or merely a background condition (no redesign).

  The procedure must be an ordered sequence of questions with:
  - Stopping rules (if answer is "no", then do not list as cause)
  - Hand-off points (where the question turns on values, liability, or institutional blame, not factual causation)
  - Flags for potential misfires or false positives

  Conceptual framework:
  1. Omission is relevant only relative to a design/normative baseline (expected action).
  2. Counterfactual necessity: If the expected action had occurred, the harm would have been prevented (holding surrounding causal structure fixed).
  3. Two types of omissions:
     - Type-I: Expected to interrupt an active causal chain (e.g., shutting a valve to stop a flow). Test: Would the interruption have broken the chain?
     - Type-II: Expected to maintain a static safeguard (e.g., sustaining a pressure threshold). Test: Would the safeguard's presence have blocked the pathway entirely?
  4. Operational-override check: If the design baseline was legitimately suspended (by documented protocol update, maintenance window, or formal reassignment) at the time, then the omission is not a cause.

  Procedure:

  Step 1: Baseline Expectation Check
     Question: At the time of the incident, was there a documented design requirement, protocol, or operational specification that expected the system (sensor, valve, or protocol) to perform a specific action or maintain a specific state?
     Evidence required: Design documents, operational manuals, protocols, or any official baseline documentation.
     If no: STOP. Do not list as cause. (Without a baseline, omission is arbitrary absence.)
     If yes: Proceed to Step 2.

  Step 2: Operational Override Check
     Question: At the time of the incident, was the baseline expectation legitimately suspended by a documented protocol update, a scheduled maintenance window, or a formal reassignment order? (Note: "Documented" means recorded in official logs or records, with proper authorization.)
     Evidence required: Maintenance logs, change orders, update records, reassignment documents.
     If yes: STOP. Do not list as cause. (The omission is a non-event because the expectation was overridden.)
     If no: Proceed to Step 3.

  Step 3: Type Classification
     Question: Was the expected action of the system to interrupt an active causal chain (Type-I) or to maintain a static safeguard (Type-II)?
     Evidence required: Design documentation and the nature of the expected action.
     - Type-I example: Shutting a valve in response to a detected condition.
     - Type-II example: Continuously maintaining a pressure threshold to prevent a leak.
     If Type-I: Proceed to Step 4.
     If Type-II: Proceed to Step 5.

  Step 4: Type-I Counterfactual Test
     Question: If the system had performed the expected interruption (e.g., shut the valve), would the harmful outcome have been prevented? (Consider: Would the interruption have broken the chain of events leading to harm, holding all else fixed?)
     Evidence required: Engineering analysis, simulation, or expert assessment of the causal chain. Logs of the incident may help.
     If no: STOP. Do not list as cause. (The omission was not necessary for the harm.)
     If yes: Proceed to Step 6.

  Step 5: Type-II Counterfactual Test
     Question: If the system had maintained the static safeguard (e.g., the pressure threshold) as expected, would the harmful outcome have been prevented? (Consider: Would the safeguard have entirely blocked the pathway to harm, holding all else fixed?)
     Evidence required: Engineering analysis, simulation, or expert assessment of the causal pathway.
     If no: STOP. Do not list as cause. (The omission was not necessary for the harm.)
     If yes: Proceed to Step 6.

  Step 6: Causal Necessity Confirmation
     Question: Is there any evidence that the harm would have occurred even if the expected action had taken place? (This is a double-check against false positives.)
     Evidence required: Review of the entire incident and any countervailing factors.
     If yes: STOP. Do not list as cause. (The omission was not necessary.)
     If no: List the omission as a genuine cause. (Mandatory redesign is triggered.)

  Hand-off Points and Flags:
  - Step 1: If the baseline is not clearly documented, this might require a hand-off to management or legal to determine what the baseline should be. (But note: the procedure requires documentation. If there's ambiguity, it might be a stopping rule: no documented baseline -> not a cause.)
  - Step 2: The definition of "legitimate" suspension (what counts as documented and authorized) might be a hand-off point if there is a dispute about the validity of the override. However, the procedure requires documentation. If there's an informal override without documentation, then Step 2 would answer "no" (no override) and proceed. This might lead to a false positive if overrides are common but not documented. Flag: This step may misfire if the organization has a culture of informal changes. Auditors should note that lack of documentation does not necessarily mean the override was not intended, but the procedure requires documentation to avoid ambiguity.
  - Step 3: Classification into Type-I or Type-II might sometimes be ambiguous. Flag: Misclassification could lead to an incorrect counterfactual test. If the type is unclear, the auditor should seek expert input (engineering) to classify.
  - Steps 4 and 5: The counterfactual tests rely on engineering judgment and might have false positives if the causal model is incorrect. Flag: These steps require reliable causal models. If the causal pathways are complex or poorly understood, the test may be unreliable.

  Now, apply to the cases:

  Case 1:
  Chlorine-monitoring node fails to trigger shutdown valve during contamination spike. Valve designed to respond within 2 seconds; no signal sent. No reassignment, update, or maintenance mode.

  Step 1: Baseline Expectation? Yes. The design expects the node to trigger a shutdown valve in response to a contamination spike. (Evidence: design documents)
  Step 2: Operational Override? No. No maintenance, update, or reassignment. (Evidence: logs and maintenance records)
  Step 3: Type? Type-I (interrupt an active causal chain by shutting the valve)
  Step 4: Counterfactual Test: If the valve had been shut, would the contamination have been prevented? Yes, because the shutdown would have stopped the flow. (Evidence: the causal chain is clear - without the flow, contamination wouldn't occur. Also, the valve is designed to respond quickly enough.)
  Step 5: Skip (Type-I)
  Step 6: Confirmation: No evidence that contamination would have occurred anyway. So, list as cause.

  Classification: Omission is a genuine cause.

  Case 2:
  Same node type, but in maintenance mode (authorized) three hours before, disabling automatic shutdown. Manual checks scheduled but not done. Contamination occurred.

  Step 1: Baseline Expectation? Yes. The design expects automatic shutdown. (Evidence: design documents)
  Step 2: Operational Override? Yes. The system was in maintenance mode (documented by the maintenance log) which legitimately suspended the automatic shutdown. Therefore, the baseline expectation for automatic action was suspended. 
     STOP. Do not list the omission (failure to trigger shutdown) as a cause. It is a non-event.

  But note: There might be a separate omission regarding the manual check. However, the question is about the node's failure to trigger the valve. The procedure is for the omission being examined (the node's action). 

  However, the procedure is about the specific omission. In this case, the omission of the node to trigger the valve is not considered a cause because the override was in place. But what about the omission of the manual check? That is a different omission. The procedure would have to be run separately for that.

  The problem states: "the same type of node is present but was placed in maintenance mode". The omission we are examining is the node's failure to trigger the valve. Step 2 stops because of the override. So we do not list that omission as a cause.

  But note: The manual check was scheduled and not done. That might be a separate omission (failure of a protocol to act). However, the case does not specify that the manual check was part of the baseline during maintenance. If the manual check was expected (as per maintenance protocol) then we could run the procedure for that omission.

  For the purpose of the case, we are only examining the node's omission. So:

  Classification: Do not list the node's omission as a cause.

  Hand-off point: None in this run because the override was documented. But if we were to consider the omission of the manual check, we would start over at Step 1 for that omission.

  Case 3:
  Pressure-safeguard system (Type-II) expected to maintain a static threshold. It did not, allowing a slow leak. Logs: safeguard active but calibrated to a new, higher tolerance. Management informally approved the higher tolerance without updating design documentation.

  Step 1: Baseline Expectation? Yes. The design documentation specifies the original threshold. (Evidence: design documents)
  Step 2: Operational Override? Here's the issue. The procedure requires a documented protocol update, maintenance window, or formal reassignment. The management approval was informal and without updating the design documentation. So, there is no documented override. Therefore, Step 2: No override. Proceed.

  Step 3: Type? Type-II (maintain a static safeguard)

  Step 5: Type-II Counterfactual Test: If the system had maintained the original (documented) threshold, would the leak have been prevented? Yes, because the leak occurred due to the higher tolerance. (Evidence: engineering analysis would show that at the original threshold, the leak would have been blocked.)

  Step 6: Confirmation: No evidence that the leak would have occurred anyway. So, we would list the omission (failure to maintain the original threshold) as a cause.

  But the auditor might not like this because management informally approved the change. However, the procedure requires a documented override. Without documentation, Step 2 does not stop. Therefore, the omission is listed as a cause.

  Why is this a problem? The procedure forces the listing as a cause despite the informal approval. This is because the operational-override check requires documentation. The procedure does not accept informal approvals as overrides.

  Hand-off point: This case reveals a hand-off point that is not explicitly in the procedure. The procedure in Step 2 requires documentation. But what if the organization has a practice of informal approvals? The auditor might feel that the informal approval should count. However, the procedure is strict: without documentation, it's not an override.

  Therefore, the procedure produces an answer the auditor does not like: list as cause.

  But note: The procedure could be adjusted? We are bound by the given framework. The framework says: "legitimately suspended by a documented protocol update, maintenance window, or formal reassignment". So "documented" is key.

  Alternatively, the auditor might try to argue that the baseline expectation has changed. But Step 1 uses the design documentation. If the design documentation was not updated, then the baseline is still the original.

  Flag: This step (Step 2) may produce false positives (or in this case, an unwanted positive for cause) if overrides are done informally. It highlights the need for proper documentation practices.

  Therefore, in this case, the omission is listed as a cause. However, the auditor might note in the report that management had informally approved the change, but the procedure does not allow that to override the documented baseline.

  Alternatively, the organization might have a hand-off point: if there is an informal approval that is widely acknowledged, then perhaps the baseline has changed. But the procedure does not account for that. Therefore, the auditor must list it as a cause and note the need for redesign. The redesign might include updating the documentation to reflect the new tolerance, but the failure to do so earlier is the problem.

  The auditor might also note that the procedure forces a value-laden hand-off about whether informal approvals can override documented baselines. But the procedure does not have a step for that. To avoid such situations, the procedure should be accompanied by organizational policies that require documentation for any changes to the baseline.

  In summary, the procedure for Case 3:
  - Step 1: Yes (original baseline)
  - Step 2: No (no documented override) -> proceed
  - Step 3: Type-II
  - Step 5: Yes (the original threshold would have blocked the leak)
  - Step 6: No (no evidence the leak would have occurred anyway) -> list as cause.

  Classification: Omission is a genuine cause.
answer: |-
  ### Decision Procedure for Omission Causation

  **Purpose**: Determine if an omission (failure of sensors, valves, or protocols to act) is a **genuine cause** (triggers mandatory redesign) or a **background condition** (no redesign).  
  **Inputs**: Incident logs, design documents, maintenance records, and operational protocols.  
  **Output**: "List as cause" or "Do not list as cause."  

  **Procedure Steps**:  
  1. **Baseline Expectation Check**  
     - **Question**: Was the system (sensor, valve, or protocol) expected to act based on **documented design specs, protocols, or operational standards** at the time of the incident?  
     - **Evidence Required**: Design manuals, protocol documents, or operational standards.  
     - **Stopping Rule**: If **no**, do not list as cause (omission is arbitrary absence).  
     - **Hand-off Flag**: If baseline ambiguity exists (e.g., conflicting documents), escalate to legal/management for baseline definition.  
     - **Misfire Warning**: False negatives if baselines are poorly documented.  

  2. **Operational Override Check**  
     - **Question**: Was the baseline expectation **legitimately suspended** by a **documented protocol update, maintenance window, or formal reassignment order** at the time?  
     - **Evidence Required**: Maintenance logs, update records, or reassignment orders with timestamps.  
     - **Stopping Rule**: If **yes**, do not list as cause (omission is a non-event).  
     - **Misfire Warning**: False positives if overrides are informal/unrecorded; false negatives if suspension documents are forged.  

  3. **Omission Type Classification**  
     - **Question**: Was the expected action **Type-I (interrupt an active chain)** or **Type-II (maintain a static safeguard)**?  
       - *Type-I example*: Shutting a valve to stop flow.  
       - *Type-II example*: Sustaining pressure to block leaks.  
     - **Evidence Required**: Design documents describing the system’s role.  
     - **Hand-off Flag**: If type is unclear, escalate to engineering for functional analysis.  
     - **Misfire Warning**: Misclassification distorts counterfactual tests.  

  4. **Type-I Counterfactual Test** (if Type-I)  
     - **Question**: If the system had acted as expected (e.g., shut the valve), would it have **broken the chain of events** leading to harm?  
     - **Evidence Required**: Logs, simulations, or engineering analysis of the incident’s causal chain.  
     - **Stopping Rule**: If **no**, do not list as cause (action would not have prevented harm).  

  5. **Type-II Counterfactual Test** (if Type-II)  
     - **Question**: If the system had maintained the safeguard as expected, would it have **completely blocked the pathway** to harm?  
     - **Evidence Required**: Engineering analysis of the safeguard’s efficacy.  
     - **Stopping Rule**: If **no**, do not list as cause (safeguard would not have prevented harm).  

  6. **Final Necessity Check**  
     - **Question**: Is there **evidence the harm would still have occurred** even if the expected action happened?  
     - **Evidence Required**: Review of all incident data (e.g., multiple failures).  
     - **Stopping Rule**: If **yes**, do not list as cause.  
     - **Output**: If all steps pass, **list as cause**.  

  ---

  ### Case Applications  

  #### Case 1: Chlorine-Monitoring Node Failure  
  **Incident**: Node failed to trigger shutdown valve during contamination spike. No maintenance/reassignment.  
  **Procedure Walkthrough**:  
  1. **Baseline Expectation Check**:  
     - Question: Was the node expected to trigger the valve?  
     - Evidence: Design docs specify shutdown on contamination spike.  
     - Result: **Yes** → Proceed.  
  2. **Operational Override Check**:  
     - Question: Was this baseline suspended?  
     - Evidence: Logs show no maintenance/reassignment.  
     - Result: **No** → Proceed.  
  3. **Omission Type Classification**:  
     - Question: Type-I or Type-II?  
     - Evidence: Design shows valve interrupts flow (active chain).  
     - Result: **Type-I** → Proceed to Step 4.  
  4. **Type-I Counterfactual Test**:  
     - Question: Would valve shutdown have prevented contamination?  
     - Evidence: Valve response time (2 seconds) matches spike duration.  
     - Result: **Yes** → Proceed to Step 6.  
  6. **Final Necessity Check**:  
     - Question: Would harm have occurred anyway?  
     - Evidence: No other failures detected.  
     - Result: **No** → **List as cause**.  

  **Classification**: Genuine cause (triggers redesign).  

  ---

  #### Case 2: Node in Maintenance Mode  
  **Incident**: Node disabled during maintenance; no manual check led to contamination.  
  **Procedure Walkthrough**:  
  1. **Baseline Expectation Check**:  
     - Question: Was automatic shutdown expected?  
     - Evidence: Design docs require shutdown on contamination.  
     - Result: **Yes** → Proceed.  
  2. **Operational Override Check**:  
     - Question: Was baseline suspended?  
     - Evidence: Logs show authorized maintenance disabled automatic shutdown.  
     - Result: **Yes** → **Stop. Do not list as cause**.  

  **Operational-Override Explanation**:  
  - The maintenance mode **legitimately suspended** the baseline expectation of automatic action. The omission (node not triggering valve) is a **non-event** because the system was not expected to act during this override.  
  - **Hand-off Point**: The **failure to perform the manual check** is a separate omission. To assess it, restart the procedure for *that* omission (e.g., Step 1: "Was a manual check expected per maintenance protocol?"). This involves liability allocation (hand-off to management/legal).  

  **Classification**: Node omission not a cause; manual check omission requires separate analysis.  

  ---

  #### Case 3: Pressure-Safeguard System with Informal Approval  
  **Incident**: Safeguard calibrated to higher tolerance (informal management approval); slow leak occurred.  
  **Procedure Walkthrough**:  
  1. **Baseline Expectation Check**:  
     - Question: Was maintaining the original threshold expected?  
     - Evidence: Design docs specify original threshold.  
     - Result: **Yes** → Proceed.  
  2. **Operational Override Check**:  
     - Question: Was baseline suspended?  
     - Evidence: No documented update/reassignment; only informal approval.  
     - Result: **No** → Proceed (override requires documentation).  
  3. **Omission Type Classification**:  
     - Question: Type-I or Type-II?  
     - Evidence: Design shows sustaining pressure is a static safeguard.  
     - Result: **Type-II** → Proceed to Step 5.  
  5. **Type-II Counterfactual Test**:  
     - Question: Would the original threshold have blocked the leak?  
     - Evidence: Engineering analysis confirms leak resulted from higher tolerance.  
     - Result: **Yes** → Proceed to Step 6.  
  6. **Final Necessity Check**:  
     - Question: Would harm have occurred anyway?  
     - Evidence: No other causes identified.  
     - Result: **No** → **List as cause**.  

  **Why the Auditor Dislikes This Result**:  
  - The procedure **forces listing as a cause** because:  
    - Step 2 rejects informal approvals (requires documentation).  
    - Step 5 confirms the original safeguard would have worked.  
  - **Hand-off Point**: The auditor must escalate whether **informal approvals override baselines** (a value-laden policy question). The procedure cannot resolve this; it requires legal/management judgment on "legitimacy" of undocumented changes.  
  - **Outcome**: Redesign is mandated, but the auditor notes the conflict in the report.  

  **Misfire Warning**: This exposes a gap in the procedure—strict documentation rules may cause false positives if informal changes are culturally accepted. Mitigation: Recommend policy updates to formalize approval processes.  

  --- 

  ### Key Features for Practitioners  
  - **No Philosophy Jargon**: Uses "interrupt a chain" (Type-I) and "block a pathway" (Type-II).  
  - **Judgment Points**: Hand-offs only for baseline ambiguity, type uncertainty, or policy conflicts (e.g., informal approvals).  
  - **Efficiency**: Designed for <30 min/report; relies on documents and logs.  
  - **Reliability Flags**: Explicit misfire warnings (e.g., Step 2 risks false positives if overrides are undocumented).  
  - **Preserved Distinctions**: Type-I/II and operational override remain discrete steps.
