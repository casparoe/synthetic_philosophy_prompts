prompt: |-
  I'm working through some literature on weakness of will and hyperbolic discounting, and I've noticed a failure pattern that doesn't sit cleanly in either framework. Consider someone who resolves to avoid checking social media during work hours. They don't fail in the familiar akratic way: there is no single dramatic moment where they impulsively reach for the phone while simultaneously judging it best not to. Instead, over several days they make a sequence of individually reasoned adjustments—allowing one check because a specific message might be urgent, allowing another because they have made progress and deserve a brief reward, allowing a third because the environment has changed slightly and the original rule was designed for different conditions. Each step feels like a legitimate local update rather than a surrender to temptation, yet the cumulative result is precisely the behavior they originally wanted to prevent. The erosion is smooth and distributed, with no discrete breach point.

  This produces outcomes that resemble hyperbolic discounting—systematic undervaluation of a long-term plan—but the underlying mechanism seems different. There is no sharp present bias weighing an immediate pleasure against a delayed cost; rather, the evaluative framework itself shifts between planning and execution contexts, with each shift justified on its own terms. It resembles rationalization, but rationalization usually involves recognizing the true reason and concealing it, whereas here the reason genuinely changes with the frame. It also resembles the planner-doer split, but that model typically involves two stable preference orderings in conflict, not a cascade of context-sensitive revisions. Is there an established concept for this kind of distributed, frame-dependent erosion of self-imposed rules—perhaps in discussions of implementation intentions, preference reversal, or diachronic agency? If no precise term exists, how should this be carved off from ordinary akrasia, from hyperbolic discounting as a psychological mechanism, and from strategic self-deception? I want a precise boundary: what exactly the phenomenon is, what it is not, and whether it should be treated as a subtype of weakness of will or as a distinct failure mode altogether.

  Verdict: State whether this corresponds to an established named concept (identify it and say how well it fits), or whether it requires a new distinction; in either case, provide the briefest precise definition of the phenomenon and its boundary with hyperbolic discounting and with discrete akrasia.
reasoning: |-
  Hmm, this is a fascinating philosophical query about a subtle pattern of self-regulation failure. The user describes a phenomenon where rule erosion happens through a sequence of contextually justified micro-adjustments rather than discrete moments of weakness.

  The user has clearly done deep work in philosophy of action and behavioral economics, given how precisely they're distinguishing this from hyperbolic discounting, akrasia, and strategic self-deception. What makes this case interesting is that each decision feels rationally justified in its local context, yet cumulatively defeats the original intention. It's like death by a thousand rational cuts.

  Looking at the components: this involves diachronic agency (agency over time), shifting evaluative frames (different contexts triggering different justifications), and what I'd call "creeping normativity" - where each exception subtly redefines what counts as acceptable. The user is right that this doesn't fit neatly into existing boxes. It's not hyperbolic discounting because there's no present bias - each decision is framed as optimally serving the long-term goal. It's not akrasia because there's no simultaneous judgment that one is acting against one's better judgment. And it's not self-deception because the reasons feel genuinely compelling in the moment.

  The closest established concept seems to be "rationalization" but as the user notes, that usually implies hiding one's true motives. Here the motives themselves seem to shift. Bratman's planning theory comes close with the idea of "reasonable stability" of plans, but doesn't fully capture how the rationalizations compound.

  I think this requires a new distinction: "normative drift." The key mechanism is that each exception creates a new precedent that serves as the normative baseline for the next decision, creating a slippery slope effect where the original rule gets hollowed out through locally rational steps. The boundary with hyperbolic discounting is clear - no present bias. The boundary with akrasia is that there's no synchronic conflict.

  The user's request for precise boundaries is well-justified. This deserves to be treated as a distinct failure mode because it exploits the very rationality we rely on for planning. I'll position it as a failure of commitment maintenance rather than a failure of judgment or willpower per se.
answer: |-
  This phenomenon corresponds most closely to **rationalization-driven preference drift**, though no single established term perfectly captures its distributed, frame-sensitive nature. It's best treated as a **distinct failure mode** (a subtype of weak-willed behavior) requiring its own conceptual boundary:

  ### Core Phenomenon: Normative Drift via Cumulative Micro-Adjustments
  **Definition:** *The piecemeal erosion of a prior resolution through a sequence of contextually justified, locally rational exceptions that collectively defeat the original goal, without discrete synchronic conflict or impulsive surrender. Each adjustment is sincerely framed as fidelity to the spirit of the plan under revised conditions, but the cumulative effect constitutes systemic failure.*

  ---

  ### Precise Boundaries
  1.  **vs. Hyperbolic Discounting (HD):**
      -   **HD Mechanism:** Present bias warps *valuation*: immediate rewards are overweighted relative to delayed costs in a single decision.
      -   **This Phenomenon:** No valuation warping *within* each decision frame. Instead, the *evaluative standard itself shifts* across contexts (planning vs. execution). Failure arises from the *interaction* of these context-sensitive standards over time, not from discounting per se. HD explains impulsive lapses; this explains "death by a thousand reasoned cuts."

  2.  **vs. Discrete Akrasia (Weakness of Will):**
      -   **Akrasia:** Involves a *synchronic conflict*: acting against one's *current* best judgment at the moment of action ("I know I shouldn't do this *now*, but I do it anyway").
      -   **This Phenomenon:** *No synchronic conflict*. At each point of adjustment, the agent sincerely judges the exception *is* the best course *given the current (shifted) context*. The failure is *diachronic* – the aggregate of locally rational choices undermines the diachronic plan.

  3.  **vs. Strategic Self-Deception:**
      -   **Self-Deception:** Involves motivated ignorance or belief manipulation to avoid acknowledging an unwelcome truth (e.g., "I'm *really* just bored, not checking for urgent messages").
      -   **This Phenomenon:** The reasons for adjustments are *sincerely accepted* as valid within the new frame; the agent isn't hiding a persistent underlying motive. The shift in justification is driven by context-sensitivity, not active concealment.

  ---

  ### Established Concepts & Fit
  *   **Rationalization:** A partial fit (justifying exceptions), but insufficient. Rationalization is often a *tool* here, but the phenomenon involves a *systematic diachronic process* of frame-dependent reasoning, not just post-hoc excuses.
  *   **Preference Reversal (over time):** A consequence, but not the mechanism. The mechanism is *evaluative frame-shifting*, not a simple change in stable preferences.
  *   **Implementation Intentions (If-Then Plans):** Highlights the *vulnerability*. Rigid implementation intentions ("If work hour, then no phone") are precisely what gets eroded by the agent's own context-sensitive reinterpretations ("*But this* is an urgent exception...").
  *   **Bratman's Planning Agency:** Best philosophical fit (focus on stability of plans over time). The failure is one of *reasonable stability* and *non-reconsideration* – the plan is eroded by too many locally reasonable but globally destructive reconsiderations triggered by shifting contexts.

  **Verdict:** While elements exist in discussions of rationalization, planning, and diachronic agency, the specific *distributed, frame-sensitive, micro-adjustment erosion process* lacks a universally accepted name. **"Normative Drift"** or **"Cumulative Micro-Rationalization"** captures its essence best as a distinct mechanism.

  **In short:** This is a failure of *diachronic self-governance through context-sensitive rational adjustment*, distinct from impulsive HD lapses (valuation failure) and conflicted akratic acts (synchronic judgment failure). It's a subtype of weakness of will characterized by the *absence* of synchronic conflict, replaced by a *diachronic cascade of locally justified exceptions*.
