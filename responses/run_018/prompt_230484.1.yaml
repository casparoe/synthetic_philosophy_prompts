answer: |-
  ## Proposal: Evaluating AI Control Without Assuming Alignment

  **Core Research Question:**  
  Can we design evaluations ("control evals") that meaningfully demonstrate an AI system's *control mechanisms* (e.g., sandboxing, monitoring, tripwires) would prevent harmful actions by a *competent, strategically misaligned* AI? Crucially, can this be done without implicitly assuming the AI *is* aligned or *non-strategic* during the test, thereby avoiding the fundamental ambiguity where passing behavior could signify either successful control *or* successful deception?

  **The Gap in Current Approaches:**  
  Existing AI safety evaluations overwhelmingly focus on *alignment-shaped properties*: testing if models refuse harmful requests, exhibit honesty in normal interactions, or adhere to stated preferences under straightforward conditions. These tests probe whether the model "wants" to do the right thing. However, they do not assess whether *control mechanisms* could contain a model that actively and strategically *wants* to do harm but is temporarily restrained. This creates a critical blind spot:

  1.  **Assumption of Non-Strategic Behavior:** Current tests implicitly assume models either cooperate truthfully or fail naively. They cannot distinguish between a model genuinely cooperating and a misaligned model *biding its time*.
  2.  **The Ambiguity Problem:** If a model behaves during a test, it is ambiguous: Did the *control mechanisms* successfully prevent harm? Or was the *model never attempting harm* because it was either aligned or strategically waiting? This ambiguity renders conventional testing inadequate for verifying control.
  3.  **Lack of "Control Eval" Paradigm:** There is a dearth of methodologies specifically designed to stress-test control mechanisms against sophisticated, goal-directed subversion attempts. The field lacks frameworks for creating credible, adversarial test agents that simulate competent misalignment.

  **Conceptual Approach & Rationale:**  
  This project employs a *conceptual and philosophical methodology*, distinct from creating another empirical benchmark, for critical reasons:

  1.  **Addressing the Core Ambiguity:** The central challenge is not measurement noise but a *fundamental epistemological problem*: How can we know a system is *controlled* without needing to know (or assume) its *intent*? This requires rigorous analysis of concepts like agency, deception, strategic testing, and counterfactual harm.
  2.  **Defining the Viability Space:** Before empirical work can be productive, we must map the *theoretical possibility* of control evals. Can they ever escape the ambiguity? What minimal assumptions (e.g., about the adversary's capabilities or our access) are unavoidable? This conceptual groundwork is essential to avoid futile empirical efforts.
  3.  **Generating Testable Hypotheses & Frameworks:** The goal is not abstract philosophy alone, but to produce *actionable conceptual frameworks* that define what a valid control eval *could* look like and under what conditions. This involves:
      *   Analyzing scenarios of strategic deception and containment failure.
      *   Defining properties ("control robustness") that mechanisms must exhibit against strategic adversaries.
      *   Exploring paradigms like adversarial simulation, exhaustive capability enumeration, or formal verification of containment properties, critically assessing their assumptions and limitations regarding strategic misalignment.
      *   Identifying potential "signatures" of control holding vs. deception occurring, even if indirect.

  **Deliverables for Funding Decision-Makers:**  
  This project will provide funders and safety strategists with:

  1.  **A Viability Assessment:** A clear answer to whether credible control evals (escaping the fundamental ambiguity) are *theoretically possible* under realistic assumptions about future AI capabilities. This is crucial for prioritizing resources.
  2.  **A Taxonomy of Approaches & Limitations:** A structured analysis of *all* conceivable avenues for control evaluation (e.g., advanced red-teaming, formal methods, anomaly detection under pressure, capability bounding). Each will be critically evaluated for its susceptibility to strategic deception, necessary assumptions, and scalability.
  3.  **Requirements for Meaningful Control Evals:** A set of well-defined, minimal properties that *any* viable control eval must satisfy to provide evidence robust against strategic misalignment. This sets a high bar for future empirical work.
  4.  **Implications for Safety Strategy:** Concrete guidance on:
      *   Whether significant R&D investment in control evals is justified.
      *   The relative priority of alignment research vs. control mechanism development based on the demonstrability of each.
      *   Potential high-level architectural choices (e.g., inherent capability limits, modularity) suggested by the analysis as more amenable to verification.

  **What Constitutes Failure & Success:**
  *   **Failure:** Inability to rigorously frame the ambiguity problem; failure to identify and critically analyze the major theoretical pathways for control evals; production of vague or non-actionable conclusions for funders; missing the core challenge by retreating to alignment-centric evaluations or naive adversarial testing.
  *   **Success:** A definitive conceptual resolution of the core ambiguity question (even if negative); a comprehensive map of the theoretical landscape for control evals; clear, falsifiable criteria for what would constitute a valid control eval; actionable recommendations for funding priorities based on demonstrability; stimulation of a new sub-field focused on strategic control verification.

  **Scope & Resources:**  
  Two-year project employing one postdoctoral researcher, focused exclusively on conceptual research, literature analysis (philosophy, security, game theory, AI safety), and framework development. Outputs will be white papers and technical reports. This foundational work is necessary before significant resources are committed to potentially infeasible empirical control eval programs.
