  ### Diagnostic Decision-Tree Taxonomy for the Paradox of Deontology in Distributed Agency Contexts

  **Root Question:**  
  **Q1.** Do deontological constraints (e.g., prohibitions on rights violations) apply *identically* to collective/institutional entities as they do to individual agents?  
  - **Yes** → Proceed to **Branch A** (Collective entities are direct deontological subjects).  
  - **No** → Proceed to **Branch B** (Collective entities lack identical deontological status).  

  ---

  #### **Branch A: Collective Entities as Direct Deontological Subjects**  
  **Q2.** In a distributed agency scenario (e.g., a programmer contributing a module to a harmful AI system), does the individual bear *direct moral culpability* comparable to a sole perpetrator?  
  - **Yes** → **Leaf A1: Strong Individualism**  
    - **Position:** Unnamed.  
    - **Resolution:** Each contributor is fully culpable for the collective harm. The paradox resolves by rejecting distributed agency as morally distinct; constraints bind all contributors equally.  
    - **Awkward Commitment:** A minor contributor (e.g., writing a non-critical code module) is as guilty as the direct enforcer, violating proportionality intuitions.  
  - **No** → **Q3.** Can the collective entity itself bear responsibility?  
    - **Yes** → **Leaf A2: Corporate Agency Deontology**  
      - **Position:** Named (e.g., French, Pettit).  
      - **Resolution:** The collective is the primary duty-bearer. Individuals incur no direct blame unless they violate role-specific duties (e.g., negligence). The paradox resolves at the institutional level.  
      - **Awkward Commitment:** Institutions cannot be "punished" like individuals, risking accountability gaps for diffuse harms (e.g., algorithmic bias in hiring).  
    - **No** → **Leaf A3: Responsibility Void**  
      - **Position:** Unnamed.  
      - **Resolution:** Collective harm lacks a deontological subject. The paradox dissolves as constraints only bind individuals in non-distributed acts.  
      - **Awkward Commitment:** Permits harmful outcomes from coordination (e.g., supply chains exploiting labor) if no individual directly violates a constraint.  

  ---

  #### **Branch B: Collective Entities Lack Identical Deontological Status**  
  **Q4.** Are deontological constraints *wholly inapplicable* to distributed agency contexts?  
  - **Yes** → **Leaf B1: Institutional Consequentialism**  
    - **Position:** Unnamed.  
    - **Resolution:** Constraints only bind individuals. Collective outcomes are evaluated solely by consequences. The paradox dissolves as constraints do not govern distributed harms.  
    - **Awkward Commitment:** Allows voting for rights-violating policies if net consequences are positive (e.g., utilitarian voting).  
  - **No** → **Q5.** Do constraints apply *only to institutional design*, not individual acts within institutions?  
    - **Yes** → **Leaf B2: Structural Deontology**  
      - **Position:** Named (e.g., Rawlsian institutionalism).  
      - **Resolution:** Constraints bind institutional architects (e.g., lawmakers, system designers). Individual contributors (e.g., voters, programmers) bear no blame. The paradox resolves via redesign.  
      - **Awkward Commitment:** No individual culpability for participating in flawed systems (e.g., citizens voting for discriminatory laws).  
    - **No** → **Q6.** In distributed harm (e.g., voting for rights-violating policies), is the individual contributor *complicit identically to the enforcer*?  
      - **Yes** → **Leaf B3: Complicity Absolutism**  
        - **Position:** Unnamed.  
        - **Resolution:** Any contribution to harm violates deontological constraints. The paradox resolves by extending prohibitions to all participants.  
        - **Awkward Commitment:** Millions of voters share equal blame for a policy enacted by few enforcers, diluting accountability.  
      - **No** → **Q7.** What grounds diminished complicity?  
        - **Causal Threshold:** **Leaf B4: Threshold Responsibility**  
          - **Position:** Unnamed.  
          - **Resolution:** Culpability requires non-trivial causal contribution (e.g., a decisive voter). The paradox resolves by limiting blame to key agents.  
          - **Awkward Commitment:** Arbitrary thresholds (e.g., 0.1% vs. 0.2% causal impact) dictate moral status.  
        - **Intentionality:** **Leaf B5: Intentional Participation**  
          - **Position:** Named (e.g., Kutz).  
          - **Resolution:** Blame requires intent to harm or reckless indifference. The paradox resolves by excusing unknowing contributors (e.g., a programmer unaware of system misuse).  
          - **Awkward Commitment:** Exonerates contributors who foresee harm but lack intent (e.g., apathetic voters).  
        - **Knowledge & Avoidability:** **Leaf B6: Negligence-Based Complicity**  
          - **Position:** Named (e.g., Fricker).  
          - **Resolution:** Blame requires knowledge (or culpable ignorance) of harm and feasible alternatives. The paradox resolves by emphasizing due diligence.  
          - **Awkward Commitment:** Impractical in complex systems (e.g., global supply chains) where knowledge/alternatives are inaccessible.  

  ---

  ### Unoccupied Branches & Overlaps  
  1. **Unoccupied Branches:**  
     - **Leaf A3 (Responsibility Void):** *Theoretically unattractive*. Denying all responsibility for collective harm contradicts core deontological commitments to rights protection.  
     - **Leaf B4 (Threshold Responsibility):** *Unexplored*. While causal thresholds exist in law (e.g., accomplice liability), few deontologists systematize this for distributed agency.  

  2. **Unseparated Positions:**  
     - **Corporate Agency Deontology (A2) vs. Structural Deontology (B2)** overlap on *institutional redesign feasibility*. Both prioritize fixing systems over blaming individuals. The tree’s Q1 (focusing on collective entities’ status) fails to separate them because both accept institutional duties but differ on whether collectives are "agents" (A2) or "structures" (B2).  
     - **Intentional Participation (B5) vs. Negligence-Based Complicity (B6)** overlap on *rejecting strict liability*. Both deny blame without subjective fault. Q7’s binary (intent vs. knowledge) fails to separate them as both require cognitive engagement with harm.  

  ---

  ### Mapping Notes  
  - **Exhaustivity:** The tree covers all logical combinations. *All branches are occupied* except A3 and B4 (diagnosed above).  
  - **Key Tensions:** Positions prioritize either individual blame (e.g., A1, B3) or institutional redesign (e.g., A2, B2), exposing trade-offs between accountability and systemic change.  
  - **Distributed Cases Addressed:** Algorithmic systems (Q2), voting (Q6), supply chains (A3/B6).
