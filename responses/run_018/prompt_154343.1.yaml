prompt: |-
  I'm putting together the final for our graduate seminar on induction and scientific reasoning, and I want one essay question that rewards actual understanding over pattern-matching on Goodman. You are an expert philosopher of science who has taught this material at the doctoral level. Before you draft anything, do a brief internal brainstorm: list the three cruxes that separate a student who grasps Goodman's riddle from one who has only memorized the predicate-definition, and flag one interpretive issue that remains genuinely contested among specialists rather than settled.

  Then write a single 90-minute exam essay question (target length ~1000 words) on the problem of induction and Goodman's grue. It must be unanswerable by reciting that "grue" means green before time t and blue thereafter, or by summarizing Goodman's appeal to entrenchment. Force students to confront the circularity threat: if projectibility is grounded in past inductive success, the justification is circular, and if it is fixed by linguistic entrenchment alone, it looks sociologically contingent rather than epistemically principled. To push past the textbook summary, inject this constructed case: consider a predictive feature F that behaves like grue with respect to observed data up to t, but F is defined by an underlying causal mechanism that is symmetric across t, whereas "green" tracks an asymmetric causal process. Ask whether this mechanistic distinction supplies an independent, non-circular criterion for projectibility, or whether identifying that causal symmetry itself presupposes the very inductive inferences Goodman sought to ground.

  Please provide all of the following in a polished, formal register appropriate for a doctoral exam committee:

  - The exam question itself, clearly stated.
  - A model answer of about 600–800 words.
  - A marking scheme built around five must-hit points. For each point, specify: (i) the precise argumentative move required, (ii) the marks it carries (total 20), and (iii) a one-line note on the typical failure mode (e.g., misreading entrenchment as purely descriptive, treating causal resolution as automatic without addressing circularity).
  - Throughout, clearly separate what is settled in the literature (e.g., the structure of the paradox, Goodman's rejection of purely syntactic solutions) from what is genuinely contested (e.g., whether mechanistic or causal criteria can break the circularity without begging the question, and whether Goodman's pragmatic resolution is best read as conventionalist or naturalist). Do not present any contested interpretation—such as the claim that mechanistic realism straightforwardly dissolves the riddle—as if it were the consensus.
  - Do not ask for bibliographies, reading lists, or citations. Do not include verbatim quotations in quotation marks from published texts unless you have fetched the source text; paraphrase without quotation marks instead. Think carefully, and avoid treating this as a prompt-engineering demonstration: just deliver the exam materials.
