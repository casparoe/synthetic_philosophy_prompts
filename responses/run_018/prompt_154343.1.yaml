answer: |-
  ### Exam Question:  
  **Time Allowed:** 90 minutes. Target length: ~1000 words.  

  > Goodman’s "new riddle of induction" demonstrates that not all predicates are equally projectible, even when they are extensionally equivalent over all observed data. Standard responses—such as grounding projectibility in entrenchment or past inductive success—face a dilemma: either they succumb to circularity (justifying induction inductively) or they render projectibility contingent on arbitrary linguistic practices.  
  >  
  > Consider a predictive feature **F** defined as follows: all observed emeralds before time *t* are F, and all observed sapphires before *t* are not-F. Unobserved objects after *t* are F if they are sapphires, and not-F if they are emeralds. Thus, F behaves like "grue" relative to the observed data. However, suppose F is *causally grounded*: being F is determined by a symmetric physical mechanism (e.g., atomic structure type X) that operates identically before and after *t*. By contrast, "green" is determined by an asymmetric causal process (e.g., chlorophyll-based reflectance) that degrades predictably over time.  
  >  
  > **Does this mechanistic distinction supply a non-circular, epistemically principled criterion for preferring "green" over F as projectible? Or does identifying causal symmetry/asymmetry itself presuppose the very inductive inferences Goodman’s riddle challenges?** In your response:  
  > 1. Explain why Goodman’s riddle resists solutions appealing purely to syntax or observational data.  
  > 2. Analyze how the circularity dilemma arises for entrenchment-based and inductivist accounts of projectibility.  
  > 3. Evaluate whether causal mechanisms (as in the F-case) resolve the circularity or tacitly rely on contested inductive assumptions.  
  > 4. Discuss one major interpretive controversy among specialists regarding Goodman’s own solution.  

  ---

  ### Model Answer (685 words):  
  Goodman’s riddle exposes that inductive validity cannot rest solely on formal logic or empirical coherence. Grue-like predicates partition observations identically to their entrenched counterparts (e.g., green) up to *t*, yet license divergent predictions afterward. Crucially, the paradox persists because *no current evidence* favors one projection over the other; both hypotheses fit the data perfectly. This undermines syntactical approaches (e.g., defining projectibility via simplicity or qualitative primacy), as grue can be redefined as primitive while green becomes derivative. Observational data alone also fail, as grue and green are empirically indistinguishable before *t*.  

  The standard responses confront a justificatory dilemma. If projectibility is grounded in *past inductive success* (e.g., green predicates have reliably supported true predictions), the account is circular: it uses induction to justify induction. If projectibility derives from *entrenchment*—linguistic conventions sedimented through habitual use—it avoids circularity but renders normativity contingent. Why prefer entrenched predicates if their history reflects sociological accident rather than epistemic virtue? Goodman navigates this by treating entrenchment as pragmatically constitutive of reasonableness, but this invites charges of conventionalism.  

  The **F-predicate case** tests whether causal mechanisms break this impasse. F is grue-like in its observational profile but causally grounded in a symmetric mechanism (e.g., atomic structure X) invariant across time. Green, conversely, depends on an asymmetric process (e.g., chlorophyll decay). Intuitively, we might privilege green because its causal basis "carves nature at its joints," reflecting a mind-independent asymmetry. Yet this appeal faces two Goodmanian challenges.  

  *First*, identifying causal symmetry/asymmetry *itself requires induction*. To assert that atomic structure X operates identically before and after *t*, we must inductively infer that causal laws are temporally uniform. Similarly, judging chlorophyll decay asymmetric presupposes that past rates of decay project reliably. Thus, causal criteria *presume* the uniformity of nature—precisely what induction’s justification must establish. This risks circularity: we project green because it tracks asymmetric causes, but we trust causal asymmetry only because past projections succeeded.  

  *Second*, causal realism does not automatically favor entrenched predicates. Suppose "F" becomes entrenched (e.g., via a scientific revolution reclassifying gems by atomic structure). Entrenchment could then override intuitive causal asymmetries, revealing Goodman’s point: projectibility hinges on our evolving practices, not fixed metaphysical structures. The F-case thus sharpens the dilemma: if mechanistic criteria rely on inductive assumptions, they inherit circularity; if not, they risk being conventional.  

  Specialists contest whether **Goodman’s entrenchment account** is defensibly naturalist or irredeemably conventionalist. Naturalist readings stress that entrenchment evolves through *reflective equilibrium*: predicates survive based on sustained predictive utility within evolving scientific frameworks, implying a feedback loop between language and empirical success. Conventionalist readings note that Goodman calls entrenchment a "right of usage" tied to linguistic history, not truth-tracking. The F-case illustrates this tension: if scientists adopt F due to its symmetric causal basis, does this reflect epistemic progress or mere linguistic drift?  

  Ultimately, the F-predicate reinforces—rather than resolves—Goodman’s challenge. Mechanistic criteria offer heuristic value but cannot provide a *non-circular foundation* for projectibility. To privilege asymmetric processes presupposes that temporal uniformity in causation is projectible, which is itself an inductive commitment. While causal realism might enrich descriptions of *how* induction functions pragmatically, it does not answer the normative riddle of *why* we should project one causal structure over another without recourse to entrenchment or question-begging uniformity assumptions. Goodman’s enduring lesson is that justification in induction is inherently holistic and practice-embedded, resisting non-circular external grounding.  

  ---

  ### Marking Scheme (Total: 20 marks):  
  | **Must-Hit Point**                                                                 | **Marks** | **Typical Failure Mode**                                                                 |
  |------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------|
  | **1. Articulates why grue resists syntactic/observational solutions**               | 4         | Misreads grue as merely "green before t, blue after" without explaining how it partitions data identically to green. |
  | **2. Diagnoses circularity in inductivist accounts AND contingency in entrenchment** | 4         | Treats entrenchment as purely descriptive (e.g., "we just use green more") not normative/conventionalist. |
  | **3. Engages the F-case: Evaluates if causal symmetry/asymmetry avoids circularity** | 6         | Asserts causal realism dissolves the riddle without addressing how identifying causal structures requires induction. |
  | **4. Notes that identifying causal (a)symmetry assumes temporal uniformity of laws** | 3         | Overlooks that inferring mechanisms across time presupposes induction. |
  | **5. Discusses specialist controversy re: Goodman's solution (e.g., naturalism vs. conventionalism)** | 3         | Presents Goodman’s entrenchment as univocally conventionalist or naturalist. |

  ---

  ### Key Clarifications:  
  - **Settled**: Goodman showed that purely syntactic, modal, or observational criteria cannot resolve the riddle; entrenchment is his proposed solution; circularity threatens inductivist justifications.  
  - **Contested**: Whether causal-mechanistic criteria (as in the F-case) break the circularity; whether entrenchment is best read as pragmatic naturalism or linguistic conventionalism.  
  - **Avoided**: Presenting causal realism as a consensus solution (it is debated by figures like Psillos, Sober, and Lange) or misrepresenting entrenchment as passive habit rather than normative practice.  

  This structure forces students to grapple with the *justificatory* depth of the riddle while engaging contemporary extensions of Goodman’s challenge.
