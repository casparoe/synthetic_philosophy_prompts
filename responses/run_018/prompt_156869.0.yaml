  ### Decision Procedure Flowchart  
  *Execute sequentially; stop at any rejection or handoff. Use only proposal text. Time: ~30 min.*  

  **STAGE 1: CATEGORY-STABILITY AUDIT**  
  *Classify group boundary stability:*  
  - **Administratively fixed**: Boundaries defined by law/policy (e.g., statutory race categories).  
  - **Administratively mutable**: Boundaries adjustable by administrative rules (e.g., income thresholds).  
  - **Self-declared**: Boundaries based on individual self-identification (e.g., gender identity).  
  *Stopping points:*  
  - **Sufficient answer**: Proposal explicitly states or implies boundary type (e.g., "self-identification" → self-declared).  
  - **Unconditional rejection**: Boundary undefined or unclassifiable (e.g., "marginalized groups" without criteria). *Reason: "Category boundary undefined."*  
  - **Hand to human**: Ambiguous boundary (e.g., hybrid of fixed and self-declared). *Flag: "Boundary classification unclear."*  

  **STAGE 2: NORMATIVE-MODE MATCH**  
  *Identify primary normative justification:*  
  - **Rectificatory**: Corrects historical injustices (e.g., slavery reparations).  
  - **Distributive**: Redresses current disparities (e.g., wealth gaps).  
  - **Recognitive**: Affirms group identity (e.g., cultural inclusion).  
  *Stopping points:*  
  - **Sufficient answer**: Proposal names one dominant justification (e.g., "remedy past discrimination" → rectificatory).  
  - **Unconditional rejection**: No justification stated or inferable. *Reason: "Normative justification missing."*  
  - **Hand to human**: Multiple justifications equally weighted. *Flag: "Normative priority unclear."*  

  **STAGE 3: MECHANISM-PROPORTIONALITY CHECK**  
  *Verify mechanism matches boundary type and normative mode:*  
  - **Mechanism rules**:  
    - Administratively fixed → Hard percentage (e.g., rigid quota).  
    - Administratively mutable → Sliding-scale target (e.g., adjustable by metrics).  
    - Self-declared → Representative consultation (e.g., participatory committees).  
  - **Proportionality rules**:  
    - Rectificatory → Time-bound (e.g., sunset clause).  
    - Distributive → Indicator-linked (e.g., reviewed with disparity data).  
    - Recognitive → Agency-affirming (e.g., self-representation).  
  *Stopping points:*  
  - **Sufficient answer**: Mechanism aligns with boundary and proportionality rules.  
  - **Unconditional rejection**:  
    - Boundary-mechanism mismatch (e.g., self-declared with hard percentage). *Reason: "Ontological-mechanism error."*  
    - Normative-mechanism disproportion (e.g., rectificatory without sunset). *Reason: "Mechanism disproportionate to normative mode."*  
  - **Hand to human**: Partial match (e.g., sliding-scale for rectificatory with outcome triggers). *Flag: "Mechanism alignment debatable."*  

  **STAGE 4: SUNSET-OR-REVIEW TRIGGER**  
  *Confirm review mechanism exists:*  
  - **Review rules**:  
    - Rectificatory → Sunset clause or outcome-triggered review.  
    - Distributive → Periodic review with disparity metrics.  
    - Recognitive → Ongoing group consultation.  
  *Stopping points:*  
  - **Sufficient answer**: Proposal includes appropriate review (e.g., sunset for rectificatory).  
  - **Unconditional rejection**:  
    - Rectificatory: No sunset/review. *Reason: "Rectificatory policy lacks sunset trigger."*  
    - Distributive: No periodic review. *Reason: "Distributive policy lacks review mechanism."*  
    - Recognitive: No consultation. *Reason: "Recognitive policy lacks consultation requirement."*  
  - **Hand to human**: Review present but inadequate (e.g., 50-year sunset). *Flag: "Review mechanism adequacy unclear."*  

  ---  

  ### Worked Examples  
  **Proposal (a): US public university – 12% reserved enrollment floor for underrepresented racial groups, self-identification with random audit.**  
  - **Stage 1**: Boundary = self-identification → **Self-declared** (sufficient).  
  - **Stage 2**: Justification = "historically underrepresented" → **Rectificatory** (sufficient).  
  - **Stage 3**:  
    - Boundary: Self-declared → Requires consultation mechanism.  
    - Actual mechanism: Hard percentage (12% floor) → **Mismatch**.  
    - *Unconditional rejection: "Ontological-mechanism error: Self-declared boundaries require consultation, not hard quotas."*  
  - **Result**: REJECTED. *Note: You may resist this as underrepresentation demands redress, but the procedure flags incoherence, not normative worth.*  

  **Proposal (b): Indian university – 27% OBC reservation with income-cap exemption.**  
  - **Stage 1**: Boundary = OBC lists + income-cap adjustment → **Administratively mutable** (sufficient; thresholds modifiable).  
  - **Stage 2**: Justification = addressing "backwardness" → **Distributive** (sufficient; focuses on current disadvantage).  
  - **Stage 3**:  
    - Boundary: Administratively mutable → Requires sliding-scale target.  
    - Actual mechanism: Fixed 27% + income-cap exemption → **Sliding-scale** (matches; exemption adjusts eligibility).  
    - Proportionality: Distributive → Income cap links to economic indicator (matches).  
  - **Stage 4**: Review = periodic OBC list revisions + income-cap updates → **Sufficient** (distributive review).  
  - **Result**: PASSES.  

  **Proposal (c): Norwegian corporate board – 40% gender target, comply-or-explain, self-certification.**  
  - **Stage 1**: Boundary = self-certification → **Self-declared** (sufficient).  
  - **Stage 2**: Justification = "gender representation" → **Recognitive** (sufficient; focuses on identity inclusion).  
  - **Stage 3**:  
    - Boundary: Self-declared → Requires consultation mechanism.  
    - Actual mechanism: Target + comply-or-explain → **Not consultation** (targets lack participatory design).  
    - *Hand to human: "Ambiguous mechanism alignment: Self-declared boundaries should use consultation. Target flexibility may suffice, but values judgment required."*  
  - **Result**: HANDED TO HUMAN. *Note: Stage 4 would flag absent consultation for recognitive justice, but handoff occurs first.*  

  ---  
  **What the procedure cannot adjudicate**:  
  - Severity of historical harm (e.g., whether slavery justifies 12% quotas).  
  - Fairness of group definitions (e.g., OBC inclusion criteria).  
  - Moral priority among justifications (e.g., rectification vs. recognition).  
  - Numerical adequacy (e.g., 40% vs. 50% targets).  
  - Verification robustness (e.g., audit effectiveness).
