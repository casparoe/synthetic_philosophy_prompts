prompt: |-
  I serve as the senior ethics reviewer for an international consortium of universities and corporate boards that must evaluate quota proposals across jurisdictions, and because our reviewers are not philosophers, I need a reusable decision procedure—ordered questions, pass-or-fail criteria, explicit judgment-call flags, and worked examples—that translates the conceptual architecture of group-based preference into an operational audit. The principle I want operationalized combines the standard philosophical distinction among rectificatory, distributive, and recognitive justifications with a synthetic condition I will call the category-stability lock: before any normative justification is weighed, the reviewer must classify the group boundary as administratively fixed, administratively mutable, or self-declared, because each state requires a different institutional mechanism—a hard percentage, a sliding-scale target, or a representative consultation—and pairing a fluid boundary with a rigid mechanism produces what I term an ontological-mechanism error. The procedure must therefore run in four stages—category-stability audit, normative-mode match, mechanism-proportionality check, and sunset-or-review trigger—and must be executable in roughly thirty minutes by a non-expert using only the proposal text.

  Please construct this as a flowchart in words with clear stopping points: specify at each stage what counts as a sufficient answer, where the procedure issues an unconditional rejection, and where it must hand the decision to a human because the issue is one of values rather than institutional coherence. Then apply the full procedure to three proposals: (a) a US public university proposing a 12 percent reserved enrollment floor for students identifying with historically underrepresented racial groups, using self-identification with random audit; (b) an Indian university maintaining a 27 percent OBC reservation coupled with an income-cap exemption mechanism; and (c) a proposed Norwegian corporate board policy that would impose a 40 percent gender-representation target with a comply-or-explain fallback and self-certification of gender status. Include one case in which the procedure delivers an answer I am likely to resist—probably a stringent conditional rejection—and explicitly state what the procedure cannot adjudicate, such as whether the historical harm or present disparity is severe enough to warrant preference at all. Lead with your bottom line in the first sentence—either the core rule of the audit or its most serious limitation—then present the reasoning, the procedure, and the three worked cases, with no preamble and no restatement of the question.
reasoning: |-
  We are operationalizing a principle that combines:
  1. Standard philosophical justifications: rectificatory (correcting past wrongs), distributive (addressing current inequalities), recognitive (recognizing group identity).
  2. Category-stability lock: group boundary classified as administratively fixed, administratively mutable, or self-declared, which must be paired with an appropriate institutional mechanism (hard percentage, sliding-scale target, representative consultation) to avoid an "ontological-mechanism error".

  The audit procedure has four stages:
  Stage 1: Category-stability audit
  Stage 2: Normative-mode match
  Stage 3: Mechanism-proportionality check
  Stage 4: Sunset-or-review trigger

  The decision procedure must be executable in about 30 minutes by a non-expert using only the proposal text.

  We are to create a flowchart in words with clear stopping points, specifying:
  - What counts as a sufficient answer at each stage?
  - Where the procedure issues an unconditional rejection?
  - Where it must hand the decision to a human (because it's about values, not institutional coherence).

  Then apply to three proposals:
  (a) US public university: 12% reserved enrollment floor for students from historically underrepresented racial groups, using self-identification with random audit.
  (b) Indian university: 27% OBC reservation with an income-cap exemption mechanism.
  (c) Norwegian corporate board: 40% gender-representation target, comply-or-explain fallback, self-certification of gender status.

  One case should deliver an answer the user is likely to resist (stringent conditional rejection). Also, explicitly state what the procedure cannot adjudicate.

  Bottom line first: the core rule or most serious limitation.

  ---

  **Bottom line: The most serious limitation of this audit is that it cannot determine the moral weight of historical harms or current disparities, leaving the fundamental justification for group-based preference to human judgment.**

  ---

  **Reasoning:**
  The audit focuses on institutional coherence: matching the group definition's stability to the mechanism, aligning the normative justification with the mechanism's design, and ensuring proportionality and review mechanisms. It does not evaluate the severity of harm, the fairness of the distribution, or the validity of recognition claims — these are value judgments requiring human deliberation.

  ---

  **Decision Procedure:**

  **STAGE 1: CATEGORY-STABILITY AUDIT**
  *Question:* How is the group boundary defined? Classify as:
  - **Administratively fixed**: Boundaries are set by law or policy and do not change without formal amendment (e.g., statutory race categories).
  - **Administratively mutable**: Boundaries are set by an administrative body that can adjust them based on evidence (e.g., income thresholds, periodic redefinition of groups).
  - **Self-declared**: Individuals self-identify into the group, with or without verification (e.g., gender identity, cultural affiliation).

  *Stopping points:*
  - **Sufficient answer**: The proposal explicitly states the boundary type OR it can be unambiguously inferred from the text (e.g., "self-identification" implies self-declared; "as defined by the 2020 Census" implies administratively fixed).
  - **Unconditional rejection**: If the boundary is undefined or so vague that it cannot be classified (e.g., "historically marginalized groups" without criteria). Reject with reason: "Category boundary undefined."
  - **Hand to human**: If the boundary type is mixed (e.g., self-declared with administrative pre-approval) and the primary mechanism isn't clear. Flag: "Ambiguous boundary type requires human judgment."

  **STAGE 2: NORMATIVE-MODE MATCH**
  *Question:* What is the primary normative justification stated in the proposal? Classify as:
  - **Rectificatory**: Correcting specific historical injustices (e.g., slavery, caste discrimination).
  - **Distributive**: Reducing current disparities in resources or opportunities (e.g., income inequality, regional underdevelopment).
  - **Recognitive**: Acknowledging and including marginalized identities (e.g., cultural recognition, gender diversity).

  *Stopping points:*
  - **Sufficient answer**: The proposal explicitly names the justification OR it is the only one implied by the context (e.g., "to remedy past discrimination" → rectificatory; "to reflect the diversity of the nation" → recognitive).
  - **Unconditional rejection**: If no justification is stated and none can be inferred. Reject with reason: "Normative justification missing."
  - **Hand to human**: If multiple justifications are equally weighted and the primary one isn't clear. Flag: "Multiple normative justifications require prioritization by human."

  **STAGE 3: MECHANISM-PROPORTIONALITY CHECK**
  *Question:* Does the mechanism match the boundary type and normative mode?
  - **Rule**: 
    - Administratively fixed boundary → must use a hard percentage (quota).
    - Administratively mutable boundary → must use a sliding-scale target (e.g., adjustable based on indicators).
    - Self-declared boundary → must use a representative consultation mechanism (e.g., participatory committees, self-nomination for positions).

  Additionally, the mechanism must be proportional to the normative mode:
  - Rectificatory: Requires measurable, time-bound mechanisms (e.g., sunset clauses).
  - Distributive: Requires mechanisms tied to current indicators (e.g., targets adjusted by disparity metrics).
  - Recognitive: Requires mechanisms that affirm agency (e.g., self-representation, consultation).

  *Stopping points:*
  - **Sufficient answer**: Mechanism matches boundary type and is proportional to the normative mode.
  - **Unconditional rejection**: 
    - Ontological-mechanism error: Mismatch between boundary type and mechanism (e.g., self-declared boundary with a hard percentage). Reject with reason: "Mechanism incompatible with group boundary type."
    - Mechanism is disproportionate to the normative mode (e.g., rectificatory justification without a sunset clause). Reject with reason: "Mechanism not proportional to normative justification."
  - **Hand to human**: If the match is debatable (e.g., a sliding-scale target for a rectificatory case might be acceptable if tied to specific milestones). Flag: "Ambiguous mechanism-proportionality requires human judgment."

  **STAGE 4: SUNSET-OR-REVIEW TRIGGER**
  *Question:* Does the proposal include a review mechanism?
  - **Rule**: 
    - Rectificatory justifications require a sunset clause (automatic expiration) or a mandatory review tied to specific outcomes.
    - Distributive justifications require periodic review tied to current disparity metrics.
    - Recognitive justifications require ongoing consultation with the group.

  *Stopping points:*
  - **Sufficient answer**: The proposal explicitly includes a review mechanism appropriate for the normative mode.
  - **Unconditional rejection**: 
    - Rectificatory case without any sunset or outcome-triggered review. Reject with reason: "Rectificatory policy lacks sunset or review trigger."
    - Distributive case without periodic review. Reject with reason: "Distributive policy lacks periodic review mechanism."
    - Recognitive case without consultation requirement. Reject with reason: "Recognitive policy lacks group consultation mechanism."
  - **Hand to human**: If the review mechanism is present but its adequacy is unclear (e.g., a review every 50 years for rectificatory policy). Flag: "Review mechanism adequacy requires human judgment."

  ---

  **Worked Examples:**

  **Proposal (a): US public university - 12% reserved enrollment floor for students from historically underrepresented racial groups, using self-identification with random audit.**

  - **Stage 1: Category-stability audit**
    - Boundary: Self-identification (with random audit). → **Self-declared**.
    - Sufficient: Explicitly stated.

  - **Stage 2: Normative-mode match**
    - Justification: "Historically underrepresented racial groups" → implies rectificatory (addressing past underrepresentation due to discrimination). Also, the term "historically" points to rectificatory.
    - Primary mode: **Rectificatory** (sufficient).

  - **Stage 3: Mechanism-proportionality check**
    - Boundary: Self-declared → requires representative consultation mechanism.
    - Actual mechanism: Reserved enrollment floor (hard percentage) with self-identification.
    - **Mismatch**: Self-declared boundary paired with a hard percentage → ontological-mechanism error.
    - **Unconditional rejection**: "Mechanism incompatible with group boundary type: self-declared boundaries require consultation mechanisms, not hard quotas."

  - **Result**: Rejected at Stage 3.

  **Note to user**: This rejection (which you might resist) is because self-declared identities are fluid and individual, making a fixed quota mechanically incompatible. The procedure doesn't question the rectificatory need but flags the mechanism as incoherent.

  ---

  **Proposal (b): Indian university - 27% OBC reservation coupled with an income-cap exemption mechanism.**

  - **Stage 1: Category-stability audit**
    - Boundary: OBC (Other Backward Classes) is defined by the central/state lists, which are periodically revised. The income-cap exemption adds a mutable layer (if income exceeds cap, exclusion). → **Administratively mutable** (because the lists and income thresholds are adjustable by authorities).

  - **Stage 2: Normative-mode match**
    - Justification: OBC reservation in India is primarily distributive (addressing current social and educational backwardness) and also has rectificatory elements (historical caste discrimination). However, the dominant justification in Indian policy is distributive (based on current backwardness). We take it as **Distributive** (with a rectificatory backdrop, but the proposal does not specify; we go by typical understanding).

  - **Stage 3: Mechanism-proportionality check**
    - Boundary: Administratively mutable → requires sliding-scale target.
    - Actual mechanism: 27% fixed reservation with an income-cap exemption (which adjusts eligibility based on income). This is a fixed percentage with an adjustable eligibility criterion → **sliding-scale** (because the group size can change via income cap). Thus, it matches.
    - Normative mode: Distributive → mechanism should be tied to current indicators. The income cap is an indicator (economic status) and the reservation is reviewed periodically (by law). → Proportional.

  - **Stage 4: Sunset-or-review trigger**
    - Distributive policy requires periodic review. Indian OBC reservations are subject to periodic review (e.g., by the National Commission for Backward Classes) and the income cap is a built-in adjustment. → Sufficient.

  - **Result**: Passes all stages.

  ---

  **Proposal (c): Norwegian corporate board - 40% gender-representation target, comply-or-explain fallback, self-certification of gender status.**

  - **Stage 1: Category-stability audit**
    - Boundary: Self-certification of gender status → **Self-declared**.

  - **Stage 2: Normative-mode match**
    - Justification: Gender representation → typically recognitive (recognizing women's participation) but also distributive (addressing underrepresentation). However, the target is often justified as both. Since the proposal does not specify, we look for dominant justification. In Norway, this law (https://www.regjeringen.no/en/dokumenter/the-norwegian-gender-representation-on-corporate/id420413/) is primarily recognitive (ensuring gender balance as a matter of equality and representation). We classify as **Recognitive**.

  - **Stage 3: Mechanism-proportionality check**
    - Boundary: Self-declared → requires representative consultation mechanism.
    - Actual mechanism: 40% target with comply-or-explain → this is a target (not a hard quota) but it is fixed (40%) and not a consultation mechanism. It is a top-down target with self-certification. 
    - **Mismatch**: Self-declared boundary should use consultation (e.g., allowing boards to consult with women's groups for nominations) but instead uses a fixed target. → Ontological-mechanism error? 
    - However, note: the mechanism is a "target" (not a hard quota) and has a "comply-or-explain" fallback, which is flexible. But the boundary is self-declared, which requires a mechanism that centers self-representation (e.g., consultation). The target mechanism does not inherently include consultation. 
    - **Hand to human**: The match is debatable. The target with flexibility might be seen as a sliding-scale (but the boundary is self-declared, so it should be consultation). Flag: "Ambiguous mechanism-proportionality: self-declared gender boundary paired with a target mechanism may require consultation. Human judgment needed."

  - **Stage 4: Sunset-or-review trigger** (if passed Stage 3, but we are handing to human at Stage 3)
    - Recognitive justification requires ongoing consultation. The proposal: comply-or-explain does not mandate consultation. Also, Norwegian law has a review mechanism (it is a law that can be amended). But is there explicit review? The proposal doesn't specify, but in law, there is periodic assessment. However, for recognitive, we require consultation with the group? The procedure requires a consultation mechanism for recognitive, which is missing. If Stage 3 were passed, we would reject at Stage 4 for recognitive: lack of consultation mechanism.

  But because Stage 3 is handed to human, we don't reach Stage 4 automatically.

  - **Result**: Handed to human at Stage 3.

  ---

  **What the procedure cannot adjudicate:**
  - The severity of historical harm or current disparity (e.g., whether slavery or caste discrimination is grave enough to justify a quota).
  - The fairness of the group definition (e.g., whether OBC groups are appropriately classified).
  - The moral priority of recognition versus redistribution.
  - The exact percentage or target (e.g., 12% vs 15%) — only the mechanism-type match.
  - The adequacy of verification methods (e.g., random audit) beyond the broad boundary classification.
