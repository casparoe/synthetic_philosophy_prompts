  The distinction between propositional knowledge (knowing-that) and functional capacity (knowing-how) comes from philosophy, like Ryle. The student is saying Mary already knew the facts about the neural states, so stimulating her brain doesn’t give her new facts. Instead, she can now recognize or induce that state. That seems coherent. But does this address the phenomenal aspect? Jackson would say that even with direct stimulation, Mary experiences qualia, which is the core issue. The student might be sidestepping the qualia by focusing on abilities. However, their point is that the argument only shows a gap in abilities, not facts. That's a valid move, but it might not satisfy proponents of the knowledge argument who see qualia as non-physical facts.

  Next, does the modified exit condition misrepresent Jackson? Jackson’s point is about sensory experience, not just neural patterns. By bypassing the eyes, the student removes the perceptual aspect, which is central to the original thought experiment. Jackson might argue that cortical stimulation still produces the same qualia, so Mary still learns what it's like. The student’s reply is that she doesn’t learn new facts about the world, only gains an ability. This could be a point of contention. The user should acknowledge that Jackson focuses on experience, but their version tests the necessity of sensory input.

