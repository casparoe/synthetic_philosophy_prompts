prompt: |-
  I'm a junior in a phil of language semniar and next week I'm running the study group on rigid designators and the necessary a posteriori. Don't lecture me; lay out the teaching arc. What idea has to be in place before 'necessary a posteriori' sounds like a contradiction and not just weird wording? I want one carrying example — not Hesperus/Phosphorus, everyone's tired of it — maybe Neptune being the planet that perturbs Uranus, but tell me if that actually works and what's wrong with using the morning-star case instead. The group are mostly logic kids who think necessary means tautology and a posteriori means guessing, so map out the misconceptions they'll form at each step and exactly where in the sequence I should head each one off. Give me one check question for the end that'd show they get why it's not just an empirical discovery with fancy vocabulary. Also tell me which part of Kripke's modal argument I should openly skip at this level and say I'm skipping.
