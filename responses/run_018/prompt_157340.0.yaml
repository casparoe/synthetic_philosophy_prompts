  For the memo structure, I'm thinking we should: first validate the drought data to show we're not dismissing it, then systematically dismantle the "glitch" argument by showing how the system's design choices created vulnerability. The timeline and record-release conditions must be airtight to prevent political interference. 

  The hybrid classification could work if framed as "structural informational famine" with clear admission of state liability - otherwise it becomes a loophole. Conditional record releases should target algorithm documentation and ration system audits specifically, not just general archives.

