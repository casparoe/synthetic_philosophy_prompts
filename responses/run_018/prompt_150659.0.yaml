  Ranking the tensions: The (4)-(1)/(3) conflict is the most severe because counterfactuals are core to science explanations, and if modality creeps in, it challenges the hard Humean foundation. The (6)-(2) tension is moderate because pragmatism versus objectivity can be nuanced; maybe the uniqueness is pragmatic too? But that's tricky.

