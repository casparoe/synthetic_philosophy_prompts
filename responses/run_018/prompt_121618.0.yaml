  Hmm, the core tension they're noticing is intriguing: the less an artform resembles tangible reality, the more mysteriously "profound" it becomes in certain philosophical traditions. That leap from music to white noise/silence as "even purer" feels like reductio ad absurdum to them—and rightly so. 

  I recall Schopenhauer's ghost hovering here—his claim that music bypasses Plato's forms to channel the Will directly. But the user's extension to noise/silence exposes a flaw: if formlessness equals profundity, why stop at music? That's where Cage's 4'33" becomes relevant—it deliberately weaponizes that logic. 

