answer: |-
  Based on your friend's track record, here's the breakdown for the Anthropocene case, including the rules, predictions, and a test case:

  ### Core Rules Derivable from Her Track Record
  1.  **Rule B: Real Property Tracking (Primary Rule):** A category is *not* socially constructed if it tracks a real, mind-independent physical property or structure in the world, even if the *definition* or *boundary* involves conventional choices. (Supported by: Biological species [wolves] tracking evolutionary lineages/reproductive isolation; Orbital-clearing property for planets; Biological sex tracking reproductive biology).
  2.  **Rule C: Definitional Convention vs. Underlying Kind:** A category involves social construction in its *definitional criteria and institutional recognition*, but the *underlying kind* it imperfectly points to might be real. The social construction lies in the act of formalizing the category and setting boundaries, not necessarily in the existence of the phenomenon being categorized. (Supported by: IAU's "planet" definition being conventional, while insisting the orbital-clearing *kind* is real; Possibly implicit in biological species classification).
  3.  **Rule A: Human-Dependent Existence/Persistence (Counter-Rule, but less dominant):** A category *is* socially constructed if its existence, meaning, or persistence fundamentally depends on collective human agreement, intentionality, or specific social/legal structures. (Supported by: Money, Marriage, Childhood [social/legal category]).

  ### Applying the Rules to the Anthropocene
  *   **Rule B (Real Property Tracking) Predicts: NOT Socially Constructed (as a kind).** The proposed Anthropocene markers (plastic deposits, radionuclide spikes, altered sediment patterns, fossil assemblages) represent detectable, physical, stratigraphic signals in the geological record resulting from human activity. These are real, mind-independent properties of Earth's rock layers. While *identifying* them as epoch-defining requires scientific consensus, the *signals themselves* exist regardless. This directly parallels her view of planets: the IAU's vote is conventional, but orbital-clearing is a real property; the geologists' vote is conventional, but the stratigraphic signal is a real property.
  *   **Rule C (Definitional Convention vs. Underlying Kind) Predicts: DEFINITION CONSTRUCTED, KIND REAL.** She would likely say that the *formalization* of the Anthropocene as an epoch with specific start dates and marker choices is a conventional act by geologists (like the IAU defining planets). However, the underlying phenomenon – a significant, globally synchronous shift in Earth systems driven by human activity, recorded physically in strata – is a real kind being tracked. The construction is in the labeling and boundary-setting, not in the existence of the stratigraphic change itself.
  *   **Rule A (Human-Dependent Existence) Predicts: SOCIALLY CONSTRUCTED.** The Anthropocene epoch *only* exists *as a geological category* because humans defined it based on human-caused signals. Its meaning and status as an epoch depend entirely on the agreement of the geological community (embodied by bodies like the International Commission on Stratigraphy). Without human conceptualization and agreement, it's just layers of rock with unusual components; the "epoch" label doesn't inherently exist in the rocks.

  ### Which Rule is She Actually Using & Why?
  *   **She is primarily using Rule B (Real Property Tracking), closely intertwined with Rule C (Definitional Convention vs. Underlying Kind).**
  *   **Why Rule B/C?**
      *   **Strong Parallel to Planets:** Her stance on planets is the closest analogy. The IAU definition is conventional (construction in the definition/boundary), but the orbital-clearing dynamical property is real (the tracked kind). Similarly, the stratigraphic markers for the Anthropocene are physical, detectable properties in the rock record (the tracked kind), even if the formal criteria and start date chosen by geologists involve convention.
      *   **Emphasis on Objective Basis:** Her distinctions consistently rely on identifying an objective, non-human-dependent basis for the category where possible (biological sex differences, evolutionary lineages, orbital dynamics, physical stratigraphy). The Anthropocene signals fit this pattern as physical evidence.
      *   **Minimizing Rule A Here:** While human activity *caused* the signals, the *signals themselves* (plastic, isotopes) are physical phenomena detectable independently of knowing their human origin. Their existence as geological markers doesn't *depend* on ongoing human agreement in the way money or marriage does; they are physically embedded in the strata. Rule A seems reserved for categories whose *ongoing existence as that category* requires social maintenance (e.g., money only works if people believe it does).

  ### A Case to Split the Rules
  *   **Test Case: Post-Traumatic Stress Disorder (PTSD) as a Diagnostic Category.**
      *   **Rule B (Real Property Tracking):** Might lean towards **NOT constructed (as a kind)**. Argues it tracks a real neurobiological/psychological response pattern to severe trauma, observable through symptoms (flashbacks, hypervigilance, avoidance), even if the diagnostic threshold (DSM criteria) is conventional.
      *   **Rule C (Definitional Convention vs. Underlying Kind):** Would say **DEFINITION CONSTRUCTED, KIND REAL.** The specific DSM-V criteria, symptom thresholds, and duration requirements are socially negotiated conventions within psychiatry. However, the underlying kind – a severe, persistent negative reaction to trauma causing dysfunction – is a real phenomenon being tracked.
      *   **Rule A (Human-Dependent Existence):** Would say **SOCIALLY CONSTRUCTED.** PTSD's existence *as a recognized medical disorder* depends entirely on the diagnostic manual (DSM/ICD) created and maintained by professional psychiatric associations. Its symptoms, interpretation, and validation are shaped by cultural and historical contexts (e.g., "shell shock" vs. PTSD). Without the socially constructed diagnostic framework, it's just individual suffering, not a defined disorder category.
  *   **Why it Splits Them:** This case directly challenges the "real property" argument. Is PTSD tracking a universal biological essence, or is the experience and expression of trauma so fundamentally shaped by cultural meanings, available language, and diagnostic practices that the "kind" itself is inseparable from the social context? Rule B struggles if the "property" is deeply intertwined with interpretation. Rule A shines here. Her position on PTSD would reveal whether Rule B applies primarily to "hard" physical sciences (geology, astronomy, biology) or if she extends it to phenomena involving human cognition and society.

  ### Confidence & Uncertainty
  *   **Overall Confidence:** **High (80%).** The parallel between the Anthropocene and her explicit reasoning on planets is extremely strong. Her pattern consistently elevates objectively detectable physical properties/basis as the key factor negating social construction of the *kind*, even when institutional recognition is involved.
  *   **Least Confident Part:** **The precise boundary between Rule B and Rule C in this specific case, and the weight given to *human causation*.** I'm very confident she won't say the Anthropocene *kind* is socially constructed like money or marriage. However, pinning down exactly *how much* she emphasizes the conventionality of the definition (Rule C) vs. the pure physical reality of the signals (Rule B) is trickier. Does the fact that humans *caused* the signal matter to her construction argument? Based on her acceptance of biological species (where human classification is involved but the lineage is real) and planets (where human observation/theory is needed but the dynamics are real), I think she'd dismiss the human cause as irrelevant to whether the resulting *physical signal in the rock* is socially constructed. But this nuance is the point of least certainty.

  **In short: Predict she will argue the *formal definition and dating* of the Anthropocene epoch involves social convention/construction by geologists, but the *underlying kind* – a distinct, human-caused stratigraphic signature marking a significant shift in Earth systems – is a real, non-socially-constructed phenomenon being tracked, similar to orbital dynamics for planets.** The PTSD test case would powerfully differentiate her application of Rule B/C vs. Rule A.
