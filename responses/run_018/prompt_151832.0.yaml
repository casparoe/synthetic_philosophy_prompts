  Okay, here's that joke, texting-style:

  > **You:** So get this. My friend Maya, right? Hardcore meditator. *Really* gets the whole anatta thing. No self, just the five skandhas doing their chaotic dance. Totally dissolved the narrative "me".
  >
  > **You:** She's cleaning out her closet, finds this organ donor card she signed like 10 years ago. Kidney box ticked and everything.
  >
  > **You:** Now she's having a full-on existential crisis. Does "she" *owe* that kidney to her "past self"? But like... *which* self? The skandhas that signed? They're GONE, man. Dissolved. Reconfigured.
  >
  > **You:** She's pacing, muttering about psychological continuity. "Is it just a vibe? A vibe doesn't need a kidney! Narrative identity? Narratives are empty too! Who made the promise *to*??"
  >
  > **You:** Finally she texts me: "HOLY SH*T. I FIGURED IT OUT. Technically... I'm not breaking a promise."
  >
  > **You:** Me: "Oh yeah?"
  >
  > **You:** Her: "Yeah. *I* didn't sign that card. Some temporary aggregate configuration did. And *that* configuration doesn't exist anymore. So... no one broke anything."
  >
  > **You:** Her: "It's not *me* refusing to give the kidney... it's just that *I* am categorically *not being them* anymore. Zero continuity of the contractual entity. Organ donor loophole unlocked!"
  >
  > **You:** Me: "...So you're keeping both kidneys?"
  >
  > **You:** Her: "Karma's gonna be *so* confused. But yeah. Skandhas ghosted. Kidney stays. 🤷‍♀️"

  **Why it works (for the philosophy-savvy friend):**

  1.  **Avoids the "No Ego" Cliché:** Focuses on the *practical consequence* of anatta (promises, identity over time) rather than the simple absence of self.
  2.  **Weird Case:** The donor card creates a concrete, high-stakes dilemma rooted in past commitment, forcing the logic of non-self into a bizarre real-world application.
  3.  **Hits Continuity Theories:** Directly names "psychological continuity" and "narrative identity," the main contenders for personal identity *without* a self. The punchline lampoons how utterly useless they feel for *obligation* when the "subject" of the narrative/continuity is denied.
  4.  **The Punchline Twist:** "Not breaking a promise... just not being them" perfectly captures the reductionist absurdity. It takes the Parfit-esque conclusion ("I am not the same person") and applies it with hilarious literalism to dodge responsibility. "Categorically not being them" is gold.
  5.  **"Contractual Entity" & "Ghosted":** Uses casual but precise language that resonates with the philosophy ("configuration," "entity") while keeping it light ("ghosted," "loophole unlocked").
  6.  **Karma Confusion:** The final "Karma's gonna be so confused" acknowledges the unresolved tension – the doctrine works logically to dodge the kidney, but feels intuitively wrong, even to the meditator. It highlights the friction between theory and lived ethics.
  7.  **Casual Tone:** Feels like texting a friend who gets it, no citations needed.

  It’s the perfect blend of rigorous philosophical deconstruction applied to a ridiculous, slightly morbid everyday problem. Hope your friend gets a kick out of Maya's kidney conundrum!
