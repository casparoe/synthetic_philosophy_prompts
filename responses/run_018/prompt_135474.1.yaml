  Breaking this down, I need to create three stanzas of eight lines each, with each stanza representing one of Kant's articles. The first on republican constitution should use enclosed rhyme (ABBA CDCD) to symbolize how consent encloses power. The second on federation of free states needs interlocking rhymes (ABA CBC DED) to show alliance without hierarchy. The third on cosmopolitan right requires open/slant rhymes to reflect its incomplete nature.

  I need to incorporate two voices throughout: the moral politician (pragmatic, gradual reform) and the political moralist (demanding immediate moral compliance). Crucially, these voices shouldn't resolve - just like Kant saw perpetual peace as an asymptotic ideal rather than achievable state.

  The meter should be blank verse or loose iambic pentameter. No anachronisms. The philosophical mapping must be precise enough for Kant scholars to recognize. And I should just present the poem without any preface.

  This is challenging but fascinating. For the first stanza on republican constitutions, I'll make the enclosed rhyme feel like a protective structure around the core idea of consent. The moral politician will emphasize practical mechanisms like checks and balances, while the political moralist will insist on immediate justice.

  For the federation stanza, the interlocking rhymes will create connections while keeping each state distinct. The moral politician will focus on practical alliances and commerce, the moralist on unconditional demands for peace.

  The final stanza on hospitality needs the most open form. Slant rhymes will create near-misses, reflecting how this right is always conditional. The voices will debate whether hospitality is an obligation or mere non-aggression, never quite meeting.

  Throughout, I'll maintain the tension Kant described - perpetual peace as an ever-receding horizon we approach but never reach. The poem itself will enact this asymptotic quality through unresolved voices and imperfect forms.
answer: |-
  ## Triptych on Kantian Peace

  **I. The Civil Constitution (ABBA CDCD)**
  (Moral Politician): Within the state's strong walls, a balanced frame
  Must rise, where Reason checks the will to seize;
  Where law binds all who legislate the same,
  Consent encloses power, aims to please
  Stability. Let factions find their voice
  Through gradual steps, where nature's course, not force,
  Guides men from warring impulse towards choice.
  (MP): And commerce turns the sword towards discourse.
  (Political Moralist): But justice *now* demands the sovereign will
  Be shackled by the People's pure decree!
  No slow reform where tyrants linger still;
  The inner law commands immediacy!
  (MP): Yet rushing tides disturb the fragile shore;
  (MP): Wise architects build slow for peace secure.
  (MP): The *form* itself protects, forevermore.
  (MP): Consent must grow, its roots mature and sure.

  **II. The Law of Nations (ABA CBC DED)**
  (Moral Politician): No single crown shall rule the earth's broad span;
  Instead, let free republics, side by side,
  (MP): Through treaty link, a federative plan
  To curb ambition's unrelenting tide.
  (MP): A league, not state; no central power's claim,
  (MP): But mutual pledge: each hearth-fire kept apart,
  (MP): Yet shielded from the neighbour's sudden flame.
  (MP): Let interest weave a cautious, binding art.
  (Political Moralist): Alliance? Mere convenience, frail and brief!
  (Political Moralist): The nations *must* renounce all arms, submit
  To Right Unconditional, beyond belief!
  (MP): But sovereignty, once yielded, shatters it.
  (MP): This pact preserves what binds within each wall;
  (MP): A fragile hope where separate banners fly.
  (MP): No empire forms; free states, though linked by thrall
  Of shared survival, under Reason's sky.

  **III. Cosmopolitan Right (Slant/Open Rhyme)**
  (Moral Politician): Beyond the state, beyond the pact's embrace,
  A narrow path unfolds: the stranger's plea.
  No claim to land, no settled dwelling place,
  But passage safe, a guarded courtesy.
  (MP): Let ports stay open, trade routes gently flow,
  (MP): A cautious welcome, fearing no attack,
  (MP): Where mutual use may soften ancient woe.
  (MP): A negative right, holding violence back.
  (Political Moralist): Hospitality! A duty deep and vast!
  (Political Moralist): The earth is held in common; all must share
  Its surface freely! Borders cannot last
  Against this primal right beyond compare!
  (MP): Yet nations guard their soil, their customs deep;
  (MP): This right forbids ill use, not grants the door.
  (MP): An endless task, a watch we barely keep,
  (MP): A distant shore we never quite reach, nor war.
