prompt: |-
  Give an example of a real or plausibly constructed epistemic community that functions simultaneously as an echo chamber and an epistemic bubble, but with the two mechanisms cleanly domain-segregated rather than coextensive: in one area members actively distrust and dismiss outside testimony, while in another they suffer purely structural informational exclusion with no active hostility toward outsiders. Choose or invent a concrete group—clearly identifying it and specifying the two domains—so that treating the entire community as purely an echo chamber or purely a bubble would misdiagnose the failure. Keep the response to one paragraph of no more than 120 words, and open with a bottom-line sentence that states the group and the split.
reasoning: |-
  Hmm, the user wants an example of an epistemic community that acts as both an echo chamber and an epistemic bubble with clear domain segregation. They want me to create or choose a group where one domain involves active distrust of outsiders (echo chamber) and another involves structural exclusion without hostility (epistemic bubble), and where misdiagnosis would occur if treated as purely one or the other.

  I need to recall the definitions: an epistemic bubble is about information gaps due to exclusion, like not hearing alternative views because they're not present. An echo chamber involves active distrust and dismissal of outside sources. The challenge is to have both within one group but separated by domains.

