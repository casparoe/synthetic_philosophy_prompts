prompt: |-
  As a novelist constructing a narrative in which moral agency persists across incarnations without a fixed identity, I need to understand a conceptual tension at the heart of Buddhist ethics that standard overviews never resolve. The tradition denies a permanent self (anattā), so there is no enduring subject to accumulate merit or suffer punishment across rebirths—only causal patterns are transmitted—yet it retains a rigorous taxonomy of skillful (kusala) and unskillful (akusala) action evaluated by its fruits (phala). This raises the problem: without a bearer, consequentialist aggregation across lives seems structurally impossible, because there is no unit over which suffering and well-being can be summed. At the same time, the doctrine of upāya (skillful means) appears to offer a non-calculative, situational ethics that escapes aggregation entirely. I want a committed, reasoned explanation—taking a definite stand, not surveying possibilities—of whether Buddhist ethics is therefore incompatible with consequentialist reasoning, or whether karma functions as a kind of distributed, impersonal accounting system that makes the aggregation coherent despite anattā. If you take the former view, explain what upāya must look like if it is not a hidden calculus; if the latter, explain how aggregation survives the dissolution of the self. Do not provide citations, reading lists, or bibliographic references.
