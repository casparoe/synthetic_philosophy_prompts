  For the novelist's purpose, this is actually more interesting than personal continuity. Characters could have karmic "echoes" without fixed identities - maybe a thief's habitual grasping manifests as chronic scarcity in next life, not because "he" is punished, but because the clinging pattern persists. 

  On upāya: it's not anti-consequences; it's anti-rigid-formula. A doctor might break medical "rules" to save a patient (skillful means), but still respects biology (karmic principles). The calculus exists, just not reducible to simple math. 

  Biggest hurdle: explaining summation without a sum-ee. The answer's in dependent origination - karma's like a relay race where the baton (tendencies) gets passed, not the runner. Suffering aggregates because causes propagate, not because "someone" tallies it. 

  This satisfies both needs: rigorous causality without metaphysics. For their novel, it means characters' actions plant seeds that bloom unpredictably across lifetimes, creating plot-worthy consequences without reincarnated souls.
answer: |-
  Your tension cuts to the bone of Buddhist ethics. I take a definite stand: **Buddhist karma *is* a form of consequentialist aggregation, but it functions as an impersonal, distributed causal network that explicitly *does not require* a fixed bearer.** Upāya is not an escape from this calculus but its enlightened application. Here's the reasoned explanation:

  1.  **The "Unit" of Aggregation is the Causal Stream (Santāna), Not a Self:**
      *   The denial of *attā* denies a *permanent, unitary, independent* self. It does *not* deny the continuity of a dynamic, conditioned, dependently originated process – the life-stream (santāna).
      *   This stream is a sequence of causally linked moments of experience (nama-rupa, the five aggregates). Karma (intentional action) injects specific causal potentials (seeds, *bīja*) *into* this stream. The "fruits" (*phala*, *vipāka*) are the inevitable ripening of these potentials *within* the continuum of experience generated by that stream.
      *   **Aggregation happens *along* the stream, not *to* a self.** Suffering and well-being are qualities of experience arising *within* the stream due to past and present causes. The stream itself carries the accumulated momentum of its karmic inputs. You sum suffering/well-being *over the lifetime(s) of the causal continuum*, not over the lifetime(s) of an unchanging owner. The "unit" is the process itself.

  2.  **Karma as Distributed, Impersonal Accounting:**
      *   Think of the karmic process not as a bank ledger for a named account holder, but as a complex ecosystem. An action is like introducing a new element (a seed, a pollutant, a nutrient) into a flowing river system.
      *   The element disperses, interacts with other elements, transforms, and eventually manifests downstream in altered conditions (riper fruit, toxic bloom, fertile soil). The "accounting" is the law-like process of cause-and-effect operating *within the system*. The river (santāna) carries the consequences forward; the specific water molecules (moments of consciousness) are constantly changing.
      *   **Moral responsibility persists** because the volition (*cetanā*) initiating the action arose *within* and *as a condition of* that specific stream. Its results will manifest *within* that stream. There is continuity of responsibility *because* there is causal continuity, not because a soul is tagged.

  3.  **Upāya: Skill Within the Calculus, Not Outside It:**
      *   Upāya is *not* a rejection of karmic consequences or a move to non-consequentialism. It is the pinnacle of *skillful navigation* within the impersonal karmic calculus.
      *   A fully awakened being (Buddha, Bodhisattva) perceives the vast, intricate web of causes and conditions (*pratītyasamutpāda*) with perfect clarity. They see not just the immediate consequence of an act, but its long-term ripple effects through the interdependent network, *including* its impact on the minds and karmic streams of others.
      *   **Upāya is enlightened consequentialism:** Choosing the action that, within the infinite complexity of conditions, will most effectively *reduce suffering* and *cultivate awakening* in that specific situation, for those specific beings, within the long arc of their karmic streams. It might look "non-calculative" because it transcends rigid rules and short-term, self-centered calculation. But it is the ultimate calculation – one informed by wisdom (*prajñā*) of emptiness (*śūnyatā*) and compassion (*karuṇā*), seeing the true nature of the aggregates and their causal links.
      *   **Example:** Telling a harsh truth (potentially unskillful, causing pain) vs. a compassionate lie (potentially unskillful, based on delusion). Upāya might choose silence, a parable, or precise timing – whatever action, *in that exact context*, severs a root cause of suffering or plants a seed of wisdom most effectively, considering the long-term karmic trajectories of all involved. The calculus isn't abandoned; its scope and depth are maximized.

  **Conclusion:** Buddhist ethics *is* fundamentally consequentialist, aggregating suffering and well-being over the lifespan of causally continuous experiential streams (*santāna*). The denial of self (*anattā*) doesn't break this; it redefines the "unit" of aggregation from a fixed entity to a dynamic process. Karma is the law-like, distributed, impersonal accounting system inherent in dependent origination. Upāya is not a hidden calculus nor an escape from consequences; it is the supreme skill of applying the profound understanding of this impersonal calculus – seeing emptiness *and* causality simultaneously – to maximize the reduction of suffering and the potential for liberation within the boundless web of causes and conditions. For your narrative, this means moral gravity persists through the momentum of patterned causes rippling through a flowing stream of experience, where identity is a shifting configuration, not a fixed anchor for blame or reward.
