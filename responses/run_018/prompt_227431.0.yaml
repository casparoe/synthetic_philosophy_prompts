answer: |-
  ### Scenario: Teacher Effectiveness in a School  
  A school randomly assigns students to two math teachers, Ms. A and Mr. B. The teachers have different styles:  
  - Ms. A is strict, increasing student effort.  
  - Mr. B is lenient, reducing student effort.  

  After midterms, effort levels (High/Low) are measured. End-of-year pass rates are:  

  **Disaggregated by Effort Group:**  
  |          | High Effort |        | Low Effort |        |  
  |----------|-------------|--------|------------|--------|  
  | **Teacher** | Passed | Total | **Rate** | Passed | Total | **Rate** |  
  | Ms. A    | 8          | 10     | **80%**    | 1      | 3     | **33%**  |  
  | Mr. B    | 4          | 5      | **80%**    | 9      | 10    | **90%**  |  

  - **High Effort**: Both teachers have **80%** pass rate.  
  - **Low Effort**: Mr. B has **90%** vs. Ms. A’s **33%** (Mr. B better).  

  **Aggregated (Overall):**  
  | **Teacher** | Passed | Total | **Rate** |  
  |-------------|--------|-------|----------|  
  | Ms. A       | 9      | 13    | **69%**  |  
  | Mr. B       | 13     | 15    | **87%**  |  

  - **Overall**: Mr. B has **87%** vs. Ms. A’s **69%** (Mr. B better).  

  ### Reversal and Trust  
  - **Reversal**: Disaggregated tables show Mr. B is better only in Low Effort (and equal in High), but aggregated shows Mr. B is better overall.  
  - **Trust the aggregated table** because effort is a mediator (post-treatment variable), not a confounder.  

  ### Arithmetic Verification  
  - **Ms. A’s overall rate**: \((8 + 1) / (10 + 3) = 9/13 \approx 69\%\).  
  - **Mr. B’s overall rate**: \((4 + 9) / (5 + 10) = 13/15 \approx 87\%\).  
  - **Reversal**: Mr. B has equal or better rates in both subgroups but a higher overall rate (87% > 69%).  

  ### Causal Structure  
  - **Treatment (teacher) → Effort → Outcome**: Effort is affected by the teacher and influences passing.  
  - **Conditioning on effort** blocks the teacher’s effect *through effort*, biasing the comparison. For example:  
    - Ms. A boosts effort (helping students pass), but conditioning hides this benefit.  
    - Mr. B’s leniency reduces effort (increasing failure risk), but conditioning on Low Effort makes him seem better.  
  - **Goal**: Total effect of the teacher (including effort changes). Conditioning on mediators (effort) understates Ms. A’s true impact.  

  ### Minimal Change to Flip the Verdict  
  **Change effort to a pre-treatment confounder (e.g., prior effort):**  
  - Students are assigned to teachers based on prior effort (High/Low).  
  - **New disaggregated data**:  
    - High Effort: Ms. A = 9/10 (90%), Mr. B = 2/2 (100%).  
    - Low Effort: Ms. A = 2/3 (67%), Mr. B = 6/13 (46%).  
  - **Aggregated**: Ms. A = 11/13 (85%), Mr. B = 8/15 (53%).  
  - **Reversal**: Mr. B better in High Effort (100% > 90%), but Ms. A better overall (85% > 53%).  
  - **Now trust the disaggregated table** because prior effort is a confounder (affects both teacher assignment and outcome).  

  ### Criterion for Each Version  
  - **Original (mediator)**: Trust aggregated table. **Criterion**: *Do not condition on post-treatment variables* (mediators) when estimating total effects.  
  - **Changed (confounder)**: Trust disaggregated table. **Criterion**: *Condition on confounders* to block backdoor paths.  

  **Key Insight**: The decision depends on the causal role of the partitioning variable—not the reversal itself. A mediator requires aggregation; a confounder requires disaggregation.
