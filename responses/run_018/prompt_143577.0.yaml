  I was arguing with a coworker last week about the liar paradox — you know, that self-referential sentence that claims it itself is false — and he kept saying it's exactly like a recursive function with no base case, it just calls itself untill the stack overflows. He's using that to argue it's basically a programming bug, not a deep philosophical crisis, and that we can just patch it with layered languages like Tarski's hierarchy and move on. But I'm not convinced the analogy actually holds water, especially since I came across some niche idea called revision theory where truth gets updated in loops instead of crashing outright, which feels more like a lazy-evaluated variable that never resolves than a stack trace. Can you audit how far the recursive-function analogy goes? I want the correspondence spelled out in continuous prose — what plays the role of the function call, the stack frame, the crash, the patch — then tell me exactly where it breaks, particularly around the hidden assumption that truth is something you compute in the first place. Also address whether my coworker's relaxed conclusion — that it's just a syntax error we can engineer around — survives once those breaks are visible, or if the analogy was smuggling that conclusion in from the start. If there's a better analogy that captures those revision-theory vibes without falling apart, mention that too. Write it all as continuous prose, no headings, no bullet points, no bold, no tables, just like you're replying to a long email. I'm just a backend engineer with no formal philosophy background, so keep the jargon light but don't dumb down the logic.
