  If we remove that isolation and idealize the whole psychology holistically, the problem disappears because the submodules would be forced to reconcile during the extrapolation process. My argument depends on interpreting idealization as requiring holistic convergence across all aspects of psychology, which some might contest by viewing submodules as truly modular and non-integrable.

  I'll argue that coherence requires a hierarchical fixed-point that privileges one submodule arbitrarily. While unsatisfying, this is necessary because coherence must resolve conflicts, and without external arbitration, the system must "pick" a standpoint. The alternative—permanent incoherence—contradicts the very concept of CEV, which aims for a unified volition.

  I need to be careful to explain why external arbitration is undesirable (it violates the self-contained nature of CEV) and why collapse into hierarchy is inevitable. The aesthetic submodule might be most naturally privileged since it's about integration, but that's still arbitrary from the system's perspective.
answer: |-
  The reflexive authority bootstrap problem arises when idealizing distinct evaluative submodules *in isolation* generates incompatible meta-rules for coherence governance (e.g., deontic ethics demanding veto over consequences violating duties, consequentialism demanding veto over deontic constraints blocking optimal outcomes, and aesthetics demanding veto over solutions lacking holistic harmony). This creates a vicious circle: coherence requires resolving the conflict, but the resolution mechanism itself is contested by the idealized submodules. The core structural feature generating this tension is the **assumption of modular isolation during extrapolation** – treating submodules as closed systems whose idealization ignores their necessary interactions within the whole agent.

  I contend that this loop **collapses into a hierarchical fixed-point that arbitrarily privileges one submodule**. Coherence, in a reflexive self-governing system, is not optional; it is a constitutive requirement for unified agency. An agent cannot simultaneously endorse irreconcilable meta-rules for resolving conflicts without ceasing to be a single coherent agent. Crucially, CEV demands *convergence* under idealization. If the idealization procedure is applied holistically (not in modular isolation) to the *entire* psychology, it must resolve this conflict to achieve convergence. The extrapolation process, pushed to its limit, would expose the incompatibility and force a selection. Since no meta-rule is inherently privileged *within* the system (each submodule's "veto claim" is self-justifying from its own perspective), the selection is arbitrary from the agent's pre-idealized viewpoint. The fixed-point emerges from the mathematical necessity of convergence under idealization, but which submodule "wins" depends on the contingent dynamics of the extrapolation process (e.g., the relative robustness or "attractor strength" of each module under recursive pressure). Coherence entails the *elimination of paralyzing indeterminacy*; a fixed-point hierarchy, however arbitrary its origin, achieves this.

  **Why not undermine coherence?** True incoherence (permanent deadlock) would mean the agent lacks an extrapolated volition entirely, violating CEV's core premise that idealization converges. Coherence is the *telos* of the extrapolation; the procedure's internal logic demands resolution.  
  **Why not require external arbitration?** External principles violate CEV's foundational commitment to deriving normativity *solely* from the agent's own idealized preferences. Introducing an external arbitrator (e.g., a universal rationality standard) abandons the project of capturing *this specific agent's* volition.

  If the structural feature of **modular isolation during extrapolation** is removed – meaning submodules are idealized *only* in the context of their interactions within the whole psyche – the problem largely dissolves. Holistic idealization inherently forces negotiation and compromise between submodules during convergence. The conflict might still exist pre-idealization, but the extrapolation process would resolve it as part of achieving a unified coherent output. The tension arises specifically because isolation creates idealized "monsters" that haven't been forced to reconcile.

  **Contested Interpretation Point:** My argument hinges on interpreting "idealization" as requiring *global convergence across the entire psychology*. If one interprets idealization as only requiring *local* convergence within separable modules (denying the necessity of global coherence), then the bootstrap problem could persist as fundamental incoherence. However, this view conflicts with CEV's goal of defining a single, coherent "should" for the agent. A purely modular CEV with no requirement for inter-modular coherence arguably ceases to be a volition of a unified self. The core CEV idea of "extrapolated preference convergence" implicitly demands global coherence as a precondition for meaningful volition.
