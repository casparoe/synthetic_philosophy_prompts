  Here’s a focused, two-page proposal draft keeping it conversational and grounded in your core idea. I’ve structured it clearly while avoiding jargon overload:

  ---

  **Proposal: Marriage as Modular Infrastructure – What Same-Sex Marriage Reveals About the Architecture of Social Recognition**

  **1. The Half-Baked Idea (Refined):**  
  The standard philosophical and legal debate about same-sex marriage often gets stuck arguing whether marriage is *fundamentally* about procreation or romantic companionship. This feels like asking whether a Swiss Army knife is *fundamentally* a blade or a screwdriver – it misses how the tool actually works in practice. I reckon marriage functions less like a single-purpose tool and more like **social infrastructure**: a standardised interface or protocol. Its core job isn’t fulfilling one essential function, but efficiently connecting individuals to a bundle of legal, economic, and kinship systems (tax, inheritance, medical consent, next-of-kin status, parenting rights, social recognition). Same-sex marriage, then, isn’t just testing whether a new user fits the old system; it’s stress-testing whether the *interface itself* remains functional when the historically bundled ‘reproductive module’ is completely decoupled from the other modules (economic partnership, care, kinship). This forces us to ask: does accepting same-sex marriage necessitate abandoning the idea of marriage’s unitary purpose, revealing it instead as a *modular system*?

  **2. Precise Research Question:**  
  **Does the widespread legal and social acceptance of same-sex marriage compel us to reconceptualise marriage not as an institution defined by a singular essential function (e.g., procreation *or* companionship), but as a modular legal/social interface where historically bundled functions (reproductive, economic, affective) can be decoupled without collapsing the system?**

  **3. Why the Old Debate Leaves This Open:**  
  The procreation-versus-companionship framing genuinely *doesn’t* answer this because:
  *   **It’s Binary:** It assumes marriage *must* have one core purpose. My question challenges that necessity.
  *   **It’s Internal:** It debates *which* function is essential *within* the old paradigm. My approach asks if the paradigm itself is wrong.
  *   **It Ignores Mechanism:** It focuses on justifying *inclusion* (do same-sex couples fit *purpose X*?) not on analysing the *structure* that inclusion reveals (what happens to the *system* when they’re included?). The legal/social *work* marriage does (distributing rights/obligations) persists robustly for same-sex couples *despite* the decoupling of procreation, suggesting the unitary-purpose view is descriptively inadequate and perhaps conceptually flawed.

  **4. Method: What I’ll Actually Do (Part-Time Realism):**  
  Forget massive empirical studies. This is conceptual philosophy grounded in legal reality, achievable in 6 months part-time:

  *   **Month 1-2: Foundation & Framework:**
      *   Solidify the "interface/module" analogy. What makes a good analogy here? (Drawing loosely on tech/phil of law concepts like standards, interoperability).
      *   Map the core "modules" commonly bundled in marriage (Reproductive/Parental, Economic/Contractual, Affective/Companionate, Kinship/Social Recognition).
      *   Identify key jurisdictions for comparison (e.g., UK, Canada, South Africa – places where SSM was debated/implemented, offering accessible legal texts/judgments in English).
  *   **Month 3-4: Legal Text Analysis (The Core Work):**
      *   Analyse landmark court rulings, parliamentary debates, and marriage statutes **pre and post** SSM legalisation in chosen jurisdictions.
      *   **Focus:** How do these texts conceptualise marriage's *purpose* when arguing *for* or *against* SSM? Does the *language* shift post-legalisation towards recognising distinct functions? Are there explicit attempts to *decouple* certain modules (e.g., emphasising parenting rights separate from biological procreation within marriage)? Does the *structure* of the legal rights/obligations granted implicitly support a modular view?
  *   **Month 5: Philosophical Synthesis:**
      *   Analyse findings: Does the legal reality *post*-SSM support the modular interface view? Does it expose tensions where the old unitary view lingers awkwardly? (e.g., lingering assumptions in surrogacy/parenting laws).
      *   Refine the modular theory: Does it better explain marriage's persistence and adaptability than unitary-function views?
      *   Consider objections (e.g., is this just descriptivism? Does it drain marriage of meaning?).
  *   **Month 6: Writing & Refinement:**
      *   Draft the core argument paper (~6000 words).
      *   Clearly define success/failure (see below).

  **5. What a Result Looks Like & What Counts as Failure:**

  *   **Success:** A coherent paper arguing that:
      1.  The SSM debate exposes the inadequacy of unitary-function models of marriage.
      2.  Analysing marriage as a modular legal/social interface provides a *better descriptive framework* for understanding its contemporary function and resilience.
      3.  This shift in understanding has practical implications (e.g., for debates about platonic co-parenting contracts, polyamory, or the future of marriage itself).
  *   **Clear Result:** Demonstrating how legal texts/rulings *implicitly* or *explicitly* adopt modular thinking post-SSM, or conversely, how they *struggle* because of vestigial unitary assumptions.
  *   **Failure Conditions (Honestly):**
      *   **No Shift Found:** If analysis reveals legal systems post-SSM *still* predominantly rely on/reinforce a unitary purpose (romantic love, say) just stretched to include same-sex couples, weakening the core claim.
      *   **Analogy Doesn't Hold Water:** If the "interface/module" analogy proves too clunky, misleading, or fails to generate useful insights compared to existing frameworks.
      *   **Too Trivial:** If the modular view turns out to be just a minor restatement of existing "bundle of rights" theories without adding significant philosophical value.
      *   **Ran Out of Road:** If the part-time scope means the analysis remains too shallow or examples too limited to be convincing.

  **6. Scope Check (Be Realistic!):**  
  This is *not* aiming to:

  1.  Provide a comprehensive history of marriage.
  2.  Solve the normative debate about whether SSM *should* be allowed (it starts from its acceptance as a given).
  3.  Conduct extensive sociological research or public opinion analysis.
  4.  Develop a full political theory of marriage.
  5.  Tackle every possible jurisdiction or legal system. Focus is on 2-3 accessible common-law jurisdictions with clear SSM transitions.
  6.  Fully resolve questions about polyamory or radically novel relationship structures – though findings might *implicate* these.

  **Scope is deliberately narrow:** Using SSM as a specific, high-impact case study to test a conceptual hypothesis about marriage's structure via legal text analysis. It’s philosophy *informed by* law, not exhaustive legal scholarship. The output is one substantive philosophical paper, not a book. It won’t settle centuries of debate, but it might offer a useful new lens and show why the old procreation-vs-companionship fight feels so stale.

  ---

  **Why this fits:** It’s tightly focused on your core insight, offers a clear and *achievable* methodology (text-based, conceptual, comparative in a limited way), defines success/failure honestly, and explicitly acknowledges the part-time, 6-month constraint. The tone stays engaged and avoids robotic grant-speak while remaining professional. Good luck!
