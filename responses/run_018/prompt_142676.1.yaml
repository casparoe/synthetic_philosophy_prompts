   But note: the traditional villanelle alternates the refrains in the tercets and then both in the quatrain. 

   However, in our case we want to alternate A and B as the ending of the tercets. So:

       Stanza 1: A, B, A
       Stanza 2: ... , ... , A
       Stanza 3: ... , ... , B
