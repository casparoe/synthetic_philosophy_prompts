answer: |-
  ### Villanelle: "The Sculptor's Paradox"

  The artist's hands call forth from earth below:  
  *I am the shape that dies when squashed.*  
  But clay persists where fragile forms must go:  
  *I am the matter that survives the blow.*  

  One space holds both—no vessel, just a show  
  of being's doubled truth, unchained and crossed.  
  *I am the shape that dies when squashed.*  

  The mallet falls. The crafted figure's flow  
  collapses—yet the stuff remains unharmed.  
  *I am the matter that survives the blow.*  

  Not wholes from parts, but twin lights in a glow:  
  coincident, yet by destruction's cost  
  *I am the shape that dies when squashed.*  

  To claim one thing when ruins start to grow  
  mistakes what time will prove that space had posed:  
  *I am the matter that survives the blow.*  

  When place and parts align, why must we know  
  which thread of persistence holds the most?  
  *I am the shape that dies when squashed.*  
  *I am the matter that survives the blow.*

