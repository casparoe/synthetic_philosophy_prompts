  We are creating a villanelle with two alternating refrains that represent the distinct claims of the statue and the clay.
   Refrain A (statue): "I am the shape that dies when squashed"
   Refrain B (clay): "I am the matter that survives the blow"

   The structure of a villanelle: 
     - 5 tercets (three-line stanzas) and 1 quatrain (four-line stanza) at the end.
     - The refrains alternate: 
          Stanza 1: A1, B1, A2 (where A1 and A2 are the two refrains, but in our case we have two distinct refrains A and B)
          Actually, the classic villanelle has two repeating lines (refrain A and refrain B) that alternate and then both appear in the last stanza.

   We'll use:
     - Tercet 1: A, B, A
     - Tercet 2: ... , A, ... 
     - Tercet 3: ... , B, ... 
     - Tercet 4: ... , A, ... 
     - Tercet 5: ... , B, ... 
     - Quatrain: ... , A, ... , B, ... 

   But note: The traditional pattern is more fixed. Let me recall:

     Stanza 1: A1, b, A2
     Stanza 2: a, b, A1
     Stanza 3: a, b, A2
