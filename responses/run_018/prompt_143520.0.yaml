prompt: |-
  I work as a software engineer with no formal philosophy training, but I have been trying to apply the extended mind thesis—the idea that cognitive processes can extend beyond the brain into tools and environments—to my own development practice. Rather than asking for a literature review, I want to run my own intuitions through reflective equilibrium. Here are my verdicts on concrete cases, followed by a tentative principle that I suspect fails.

  Case 1: I maintain a personal knowledge base of debugging notes and design rationales. When I return to old code, I read my own notes and recover the reasoning. Verdict: this is part of my extended cognition.

  Case 2: My IDE provides intelligent autocomplete drawn from the current codebase. I do not memorize the API surface; I rely on the tool to complete method names and signatures. Verdict: also part of my extended cognition.

  Case 3: Our team keeps a deployment runbook that I follow step-by-step during outages. I execute the steps correctly but do not understand the underlying system behavior. Verdict: not part of my cognition; I am merely following an external procedure.

  Case 4: I use an AI pair-programming assistant that generates substantial blocks of code, which I typically accept with minimal review. Verdict: not part of my mind; it feels like outsourcing reasoning to an opaque agent.

  Case 5: Years ago I wrote a custom build script that now runs automatically in continuous integration, rejecting commits that fail certain checks. I rarely think about its logic. Verdict: ambiguous—it seems integrated into my workflow, yet I do not actively engage with it.

  The hard pair: Case 6 versus Case 7.
  Case 6: I regularly use a widely adopted open-source library. I understand its interface and behavior deeply, but I have never inspected its source code. Verdict: this belongs to my cognitive toolkit.
  Case 7: I authored the interface specification for an internal microservice, but another team implements and maintains the backend. I know my spec intimately, yet the implementation is opaque. Verdict: despite my authorship of the spec, this feels less like part of my mind than Case 6.

  My tentative principle is that a resource counts as part of my extended mind when I have direct, unmediated epistemic access to its outputs and can integrate them into my reasoning without deferring to another agent's judgment. Case 6 versus Case 7 undermines this: in Case 7 I have more direct access to the specification, yet the resource feels more external. Meanwhile, Case 5 remains unclear.

  What principle, if any, captures all six verdicts? If none can, which verdict should I overturn—Case 6, Case 7, or Case 5? Please state the principle precisely, identify which case motivates each clause, give its verdict on an unlisted case (for example, a mental model of database indexing that I originally learned from a mentor's explanation but now apply independently), and be explicit about which of my original verdicts it cannot accommodate.
reasoning: |-
  Okay, the user is a software engineer exploring the extended mind thesis through their own practical cases. They've presented seven scenarios with personal verdicts and a tentative principle that fails to reconcile Cases 6 and 7. Their core struggle is philosophical consistency in applied practice – they're not seeking academic theory but actionable clarity for their workflow.

  Hmm... their cases reveal nuanced intuitions about cognitive ownership. Case 3 (runbook) and Case 4 (AI assistant) show rejection of "outsourced" cognition, while Case 1 (notes) and Case 2 (autocomplete) embrace tools as self-extensions. The tension peaks in Cases 6/7: why does an authored spec (7) feel less "theirs" than a third-party library (6)? Their proposed epistemic access principle clearly cracks here.

  *scratches head* The user's real pain point might be about cognitive responsibility. When things go wrong with the library (Case 6), they'd debug via interface knowledge; with the microservice (Case 7), they'd blame the backend team. This suggests that accountability might be the hidden factor their intuitions track.

  *stares at Case 5* That build script is tricky... It automates their past judgment, but current disengagement creates ambiguity. If a false rejection occurred, would they debug the script or treat it as an external failure? Their answer might reveal whether it's truly extended.

  For a unified principle, I need to capture:
  - Trust without deference (Cases 1,2,6)
  - Agency in error-correction (contrast Case 3/4 with 6)
  - Dynamic control (explains why Case 7 feels external despite authorship)

  *lightbulb* Operational transparency! Not just seeing outputs, but understanding enough to manipulate/fix the cognitive process. Case 6's library may be a black box, but its behavior is predictable through interface exposure – whereas Case 7's backend failures require interfacing with another team's cognition.

  *imagines unlisted case* For the mentor-taught database model: if they can independently debug indexing issues without recalling the mentor, it passes. If they'd need to re-consult the mentor, it fails – showing the principle handles internalized vs. outsourced knowledge.

  Better overturn Case 5's ambiguity: if they lack intervention capacity for the build script, it's not extended cognition – just a useful external artifact. Their verdict on Case 7 should stand; authorship alone doesn't equal cognitive integration.

  This reframes extended mind as "tools I can cognitively operate, not just consume." Fits engineering mindset where debugability defines tool ownership.
answer: |-
  Your intuitions reveal a coherent pattern centered on *cognitive agency* and *operational transparency*. The principle that captures all your verdicts is:  

  **A resource counts as part of my extended mind iff:**  
  1. **I can directly invoke/control its outputs as needed** (Cases 1, 2, 5, 6).  
  2. **I understand its functional boundaries/reliability** (Cases 3, 4, 7).  
  3. **I bear primary epistemic responsibility for its outputs** (Cases 4, 7 vs. 6).  

  ### Principle Applied to Your Cases:
  - **Case 1 (Notes)**: ✔️ You control access, understand their scope, and own the reasoning.  
  - **Case 2 (Autocomplete)**: ✔️ Directly invoked, predictable within code context, you validate outputs.  
  - **Case 3 (Runbook)**: ❌ You execute without understanding/reliability assessment (violates #2).  
  - **Case 4 (AI Assistant)**: ❌ Outputs are opaque; you defer to its judgment (violates #2, #3).  
  - **Case 5 (Build Script)**: ❌ **Overturned verdict**—lacks #2 (you don’t understand its logic) and #3 (CI system owns execution).  
  - **Case 6 (Library)**: ✔️ You control usage, trust its interface boundaries, and debug failures *using your knowledge*.  
  - **Case 7 (Microservice Spec)**: ❌ You authored the spec, but rely on another team’s opaque implementation (violates #2, #3).  

  ### Why Your Tentative Principle Failed:
  - Your "direct epistemic access" criterion worked for Cases 1–4 but stumbled on **Case 6 vs. 7**:  
    - Case 6 *feels* integrated because you **operationalize** the library’s behavior through its interface, even without source access.  
    - Case 7 fails because you **delegate epistemic responsibility** to the backend team for implementation correctness.  

  ### Unlisted Case:  
  **Mental model of database indexing (learned from a mentor, now applied independently)**  
  - **Verdict**: ✔️ Part of extended cognition.  
  - **Why**: You *internalized* the model (#2), invoke it autonomously (#1), and bear responsibility for its application (#3). The mentor is no longer a mediating agent.  

  ### Which Verdicts Are Overturned?  
  - **Case 5 (Build Script)**: Your original ambiguity is resolved. It’s **not** extended cognition—it’s an *automated external process*. You lack insight into its logic (#2) and responsibility lies with the CI system (#3).  
  - **Case 6/7**: Stand as judged. The library’s predictability through its interface satisfies #2–3; the microservice’s backend opacity breaks both.  

  ### Key Insight:  
  Your intuitions track **who is epistemically accountable** when things go wrong. In Case 6, *you* debug issues using the library’s interface. In Case 7, you escalate to the backend team. The extended mind requires tools to function as *transparent extensions of your cognitive workflow*, not black-box dependencies. This aligns with Clark & Chalmers’ "trust and glue" conditions but emphasizes the engineer’s agency in *operational control*.  

  Would refining this principle with examples from your workflow (e.g., debugging scenarios) help deepen the analysis?
