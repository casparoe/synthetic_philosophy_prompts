  **Twin Chronicles**

  That river’s gift, rich silt on plain,
  Brought Uruk’s sun-baked walls to stand.
  With ziggurat and bustling lane,
  A city fashioned by man’s hand.

  Then drought’s long kiss on fertile clay,
  Or war’s sharp sting, the records say,
  Left rooftops bare, a hollow sound,
  And wisdom buried in the ground.

  Till shards unearthed by patient light,
  Stratum by stratum, layer by layer,
  Restored the gardens to the sight,
  Confirmed by carbon-dating’s prayer.

  This delta’s flow, dark earth’s command,
  Raised Mohenjo’s precise demand.
  With bath and granary aligned,
  By star-taught architects’ design.

  Then plague’s swift shadow stole the day,
  Or phantom tides swept trust away,
  Left courtyards still, a vacant hush,
  And secrets swallowed by the brush.

  Till potsherds found in measured light,
  Stratum by stratum, clear and deep,
  Revealed the gridwork gleaming bright,
  Where carbon counts the years we keep.

  The spade strikes stone, the scholar reads
  Two chronicles of equal weight.
  The same dry dust on buried seeds,
  The same precise, convincing gait
  Of proof laid bare in ink and trace –
  Two cities sharing one true face.
  The strata speak, the dates align,
  Yet *which* foundation’s truly mine?
  The grammar binds them, side by side,
  One origin, one echoed stride.
