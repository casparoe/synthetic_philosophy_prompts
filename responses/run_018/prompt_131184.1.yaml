  First, I need to parse the slogan into distinct formal theses. The user mentioned separating trivial logical truths from substantive commitments, so I should start with the basic logical interpretations and then move to stronger metaphysical claims. Key distinctions include modal scope (global possibility vs. actual knowledge), epistemic constraints, and temporal dimensions.

  Fitch's paradox is crucial here. The paradox shows that if all truths are knowable, it leads to the conclusion that all truths are known, which is absurd. So for each interpretation, I need to check if it's vulnerable to Fitch's paradox or avoids it. The user is particularly interested in which versions allow the inference from unknowability to falsehood and which conflate knowledge with logical possibility.

  The cosmological horizon example involves events beyond our observational reach. The user's colleague argues such events can't be true because they couldn't be known. The user is skeptical, so I need to clarify which interpretations of the maxim actually address this case without equivocation.

  I recall that the basic formalization of "all truths are knowable" is ∀p (p → ◊Kp), where ◊ is metaphysical possibility and Kp means "p is known by someone at some time." Fitch's paradox uses the substitution of p ∧ ¬Kp into this formula. If p is true but unknown, then ◊K(p ∧ ¬Kp) must be possible, but knowing a conjunction entails knowing both conjuncts, so Kp and K¬Kp, which implies ¬Kp, a contradiction. Thus, p ∧ ¬Kp cannot be true, meaning all truths are known. This is problematic.

  Now, to address the user's request, I'll outline several precise theses:

  1. **Logical Knowability (Trivial)**: ◊Kp for any individual proposition p. This avoids Fitch because it doesn't quantify over all truths universally. But it's weak and doesn't support the inference that unknowability entails falsehood.

  2. **Universal Logical Knowability**: ∀p (p → ◊Kp). This is the standard target of Fitch's paradox. It collapses into ∀p (p → Kp) under Fitch, which is untenable. So it's undermined by the paradox. It would support "unknowable implies false" but only because it leads to absurdity.

  3. **Temporal Knowability**: This introduces time indices. Like ∀p∀t (p_t → ∃t'≥t ◊K_{t'} p_t). Here, p being true at t means it could be known at a later time. Fitch's paradox might be avoided if knowledge at different times is considered, but the user wants to know if this addresses cosmological horizons. For events beyond the horizon, even future observers can't access them due to light speed limits, so this might still not help.

  4. **Metaphysical Knowability**: This restricts to propositions that are metaphysically possible to know. So ∀p (p → ◊∃x (Capable(x) ∧ Kx p)). But Fitch still applies if we consider the proposition p ∧ ¬Kp. If such a proposition is true, it requires a knower capable of knowing it, but this leads to the same contradiction. So it doesn't escape Fitch.

  5. **Idealized Knowability**: Involves ideal agents with unlimited computational resources. But again, Fitch's paradox uses a proposition that negates its own knowledge, which remains problematic even for ideal agents. So it doesn't resolve the issue.

