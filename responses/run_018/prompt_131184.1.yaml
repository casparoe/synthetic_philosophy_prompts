answer: |-
  The maxim "all truths are knowable" is indeed ambiguous and frequently misapplied, particularly in debates about verification-transcendent truths like cosmological-horizon events. Below, I dissect the slogan into distinct, precise theses, adhering to your requirements: separating modal, epistemic, and temporal readings; distinguishing trivial logical claims from substantive metaphysics; assessing compatibility with **Fitch's paradox** (which shows that if all truths *are* knowable, then all truths *are* known—an absurd conclusion); and evaluating which versions support "unknowability entails falsehood" or address cosmological horizons. I use standard **epistemic logic notation**: \(K_p\) for "\(p\) is known (by some agent at some time)", \(\square\) for metaphysical necessity, \(\Diamond\) for metaphysical possibility, and \(\forall p\) quantifying over propositions.

  ---

  ### **1. Logical Knowability (Trivial, Non-Universal)**
  - **Thesis**: \(\Diamond K_p\) for any *given* proposition \(p\).  
    *(Interpretation: Each individual truth *could* be known, but no universal claim is made.)*  
  - **Status**: Logically trivial. For any true \(p\), \(\Diamond K_p\) is vacuously plausible if we imagine an agent in favourable circumstances.  
  - **Fitch's Paradox**: **Compatible** (avoids paradox). Fitch requires *universal quantification* over propositions (\(\forall p\)), which this lacks.  
  - **Unknowability \(\rightarrow\) Falsehood?** **No**. This asserts only that truths *are* knowable, not that unknowability implies falsity.  
  - **Cosmological Application**: **Irrelevant**. It doesn't address whether *all* truths (e.g., horizon events) must be knowable; it only says *if* a specific \(p\) is true, it *could* be known.  
  - **Risk of Conflation**: Often conflates *logical possibility* (no contradiction in knowing \(p\)) with *practical knowability* (e.g., constrained by physics).

  ---

  ### **2. Universal Logical Knowability (Fitch-Vulnerable)**
  - **Thesis**: \(\forall p \left( p \rightarrow \Diamond K_p \right)\)  
    *(Interpretation: For every proposition, if it is true, it is metaphysically possible that it is known.)*  
  - **Status**: Substantive but **undermined by Fitch's paradox**. Substituting \(p = (q \land \neg K_q)\) leads to contradiction:  
    \(\Diamond K(q \land \neg K_q) \vdash \Diamond (K_q \land K\neg K_q) \vdash \Diamond (K_q \land \neg K_q)\). Thus, \(\forall p \left( p \rightarrow \Diamond K_p \right)\) entails \(\forall p \left( p \rightarrow K_p \right)\), which is absurd.  
  - **Unknowability \(\rightarrow\) Falsehood?** **Yes, but vacuously**. Fitch shows \(p \land \neg K_p\) (an "unknowable truth") is impossible. Thus, \(\neg \Diamond K_p \rightarrow \neg p\) holds, but only because the premise entails that *no* truth is unknown.  
  - **Cosmological Application**: **Fails**. If horizon events are unknowable, Fitch forces us to deny they are true—but only by collapsing into the absurdity that *all* truths are known.  
  - **Conflation**: Ignores that \(\Diamond\) abstracts from physical constraints (e.g., light-speed limits). Misleadingly suggests logical possibility implies cosmological knowability.

  ---

  ### **3. Temporal Knowability (Weak)**
  - **Thesis**: \(\forall p \forall t \left( p_t \rightarrow \exists t' \geq t \: \Diamond K_{t'} p_t \right)\)  
    *(Interpretation: If \(p\) is true at time \(t\), there exists a later time \(t'\) at which it is possible to know \(p\) at \(t\).)*  
  - **Status**: Non-trivial but **avoids Fitch** by restricting knowledge to *future* times. The paradox assumes \(K_p\) can occur *while* \(p \land \neg K_p\) is true, but here \(K_{t'}\) may "look back" at \(p_t\) from \(t' > t\).  
  - **Unknowability \(\rightarrow\) Falsehood?** **No**. It allows permanently unknown truths (e.g., if \(p\) is forgotten before \(t'\)).  
  - **Cosmological Application**: **Superficially addresses, but fails**. For an event \(e\) beyond the horizon, \(t'\) could be any future time, but **relativity forbids**\(K_{t'} e_t\): information from \(e_t\) cannot reach any observer by \(t'\). Thus, \(\neg \Diamond K_{t'} e_t\), so the thesis deems \(e_t\) false—but this relies on physical impossibility masked as temporal possibility.  
  - **Conflation**: Treats time as a solution but ignores that *physical laws* may make past truths *causally inaccessible*, even to future observers.

  ---

  ### **4. Metaphysical Knowability (Restricted)**
  - **Thesis**: \(\forall p \left( p \rightarrow \Diamond \exists x (\text{Capable}(x) \land K_x p) \right)\)  
    *(Interpretation: If \(p\) is true, there could exist a *capable knower* \(x\) (e.g., with sufficient cognitive faculties) who knows \(p\).)*  
  - **Status**: Substantive. **Vulnerable to Fitch** if "capable knower" includes knowing \(p \land \neg K_q\) for arbitrary \(q\). If not, it may avoid paradox by restricting the domain of propositions (e.g., excluding self-referential ones).  
  - **Unknowability \(\rightarrow\) Falsehood?** **Conditionally**. If no capable knower *could* exist for \(p\), then \(p\) must be false—but this is circular without independent criteria for "capable".  
  - **Cosmological Application**: **Changes the subject**. Horizon events *are* knowable by a "capable" observer *near* the event—but Earth-based observers are *incapable* due to spacetime constraints. Thus, it doesn't address whether *our* unknowability entails falsehood; it relocates knowability to hypothetical agents.  
  - **Conflation**: Equates *agent-relative capability* with *metaphysical possibility*. Cosmological unknowability is *physical*, not agential.

  ---

  ### **5. Idealized Knowability (Anti-Realist)**
  - **Thesis**: Truth *is* knowability under ideal epistemic conditions: \(p \leftrightarrow \Diamond K_{\text{ideal}} p\).  
    *(Interpretation: \(p\) is true iff it could be known by an ideal agent (e.g., with infinite computational resources).)*  
  - **Status**: Core **metaphysical commitment** of semantic anti-realism (Dummettian). **Avoids Fitch** by redefining truth: \(p \land \neg K_p\) is false *by definition* since \(\neg \Diamond K_{\text{ideal}} (p \land \neg K_p)\).  
  - **Unknowability \(\rightarrow\) Falsehood?** **Yes, by fiat**. Unknowability *entails* falsehood because truth just *is* knowability.  
  - **Cosmological Application**: **Directly supports the colleague's view**. Horizon events are *unknowable even ideally* (due to causal barriers), so they cannot be true. This *genuinely addresses* the case but at great cost: it redefines truth itself.  
  - **Conflation**: Replaces *verification-transcendent truth* with *epistemic accessibility*. Rejected by realists as question-begging.

  ---

  ### **Summary Table**
  | Thesis                          | Fitch Compatibility | Unknowability → Falsehood? | Cosmological-Horizon Relevance | Key Issue                          |
  |---------------------------------|---------------------|----------------------------|----------------------------------|------------------------------------|
  | **1. Logical Knowability**      | Compatible          | No                         | None                             | Trivial; no universal claim.       |
  | **2. Universal Logical**        | **Undermined**      | Yes (vacuously)            | Fails (absurd conclusion)        | Self-refuting.                     |
  | **3. Temporal Knowability**     | Compatible          | No                         | Superficial (fails physically)   | Ignores causal constraints.        |
  | **4. Metaphysical Knowability** | Vulnerable          | Conditional                | Changes subject (to agents)      | Circular without "capable" defined.|
  | **5. Idealized Knowability**    | Avoids              | **Yes (substantive)**      | **Genuine (anti-realist)**       | Redefines truth epistemically.     |

  ---

  ### **Key Conclusions**
  - **Fitch's Paradox** devastates the naïve universal reading (\(\forall p (p \rightarrow \Diamond K_p)\)), rendering it incoherent. Any thesis implying "unknowability entails falsehood" either collapses under Fitch (e.g., Thesis 2) or relies on a revisionist metaphysics of truth (Thesis 5).  
  - **The Cosmological-Horizon Case**:  
    - **Thesis 5 (anti-realism)** alone "solves" it by denying truth to verification-transcendent events. This is what your colleague likely presupposes.  
    - Other readings either **change the subject** (Thesis 4: "aliens could know it") or **ignore physics** (Thesis 3: "future observers could know it").  
  - **Conflation Hazard**: Most invocations of the maxim conflate:  
    - *Logical possibility* (\(\Diamond K_p\)) with *physical possibility*.  
    - *Universal quantification* with *instance-by-instance* knowability.  
    - *Knowledge* as a state with *knowability* as a modal property.  
  - **Recommendation**: Challenge your colleague to specify their thesis. If they endorse Thesis 5, the debate shifts to anti-realism vs. realism. If they appeal to Thesis 2, Fitch refutes them. In cosmological contexts, unless one accepts anti-realism, unknowability (e.g., due to horizons) **does not** entail falsehood—it reflects *epistemic limitations*, not ontology.
