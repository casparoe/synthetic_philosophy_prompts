  But the predictive algorithm complicates things. Augustine tied moral responsibility to the soul's private deliberation, inaccessible even to angels. An external system decoding veto intentions *before awareness*? That might unsettle him. Yet he'd note the algorithm predicts *from neural patterns*, not divine foreknowledge—it's inferential, not ontologically prior like God's knowledge. 

  Crucially, Augustine might argue the algorithm's prediction reliability depends on causal chains *including* the will's final consent. If the veto is truly free, its predictability stems from the soul's consistent character (his *qualitas animi*), not bypassing agency. A drunkard's predictable sin is still culpable. 

