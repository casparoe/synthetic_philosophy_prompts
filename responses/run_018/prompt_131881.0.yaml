  1. **Undefined Truth Value**: Fuzzy boundaries aren’t ignorance—truth gaps exist.  
  2. **Higher-Order Epistemicism**: Hidden sharp boundary, but vague about its location.  
  3. **Classical Epistemicism**: Precise hidden boundary, knowable in principle.  
  4. **Biological Contextualism**: Vagueness only in biological systems; AI has sharp cutoffs.  
  5. **Contextualism**: Vagueness resolved by context (applies to humans & AI).  
  6. **Degree Theory**: Consciousness is scalar (applies to humans & AI).  
  7. **Radical Indeterminacy**: No fact of the matter at any level (humans & AI).  
  8. *[Empty Slot]*: See diagnosis below.  

  ---

  ### Diagnostics
  - **Unoccupied Combinations**  
    - **Sharp boundary without hiddenness (Q1→Q2→Leaf 3) + denying higher-order vagueness (Q4→"No")**: Occupied (Leaf 3).  
    - **Sharp boundary + accepting higher-order vagueness (Q4→"Yes")**: Leaf 2 exists but is **unstable**—admitting vague boundaries while insisting they’re "hidden sharp" invites regress (e.g., "Where does the vagueness *about* the boundary start?"). Rarely held.  
    - **Biological Contextualism + Degree Theory (Leaf 4 + Leaf 6)**: **Incoherent**—if vagueness disappears in AI, degrees can’t apply there.  

  - **AI-Substrate Insights**  
    - Leaf 4 isolates those tying vagueness to biology (e.g., natural kind essentialists).  
    - Leaves 5–7 treat vagueness as substrate-neutral, extending to AI (e.g., vagueness arises in description, not ontology).  

  - **Unseparated Pairs**  
    - **Contextualism vs. Degree Theory (Q6)**: Tree forces a choice, but hybrid views exist (e.g., contextual thresholds for degrees).  
    - **Higher-Order Epistemicism vs. Radical Indeterminacy**: Both acknowledge indefinite boundaries, but differ on whether reality is resolved "behind the scenes."  

  ---

  ### Teaching Utility
  - **Bypasses Labels**: Questions anchor abstract debates (epistemicism, supervaluationism) to intuition pumps.  
  - **AI Niche**: Forces confrontation with whether vagueness is a feature of minds (*all* cognition) or matter (*only* biology).  
  - **Empty Slot**: Highlights where theory gaps exist—e.g., no one defends "sharp AI boundaries + vague biology" (arguably incoherent).  

  This tree fits on one handout page and exposes how substrate assumptions (biological vs. artificial) fracture positions. Use the empty slot to prompt student proposals!
