prompt: |-
  ok so i've ended up as the person who has to pick where my workplace giving campaign sends its money this year, and the more i read the more i think the arguments are just people smuggling in different hidden checklists. one guy says the only thing that matters is how big the problem is and how many people are affected, so we should go after the biggest problem anywhere, which he thinks is maybe nuclear war or future people. another says a cause only counts if your dollar does something you can measure in the next two years, so by that test we should fund deworming pills or bednets. a third says all of that is backwards because a problem that's already famous and well funded, like cancer, is automatically a worse place to put money than something nobody is touching, even if the nobody-is-touching problem is smaller. and then there's the damn food bank down the street that i know is real because i see the line every morning, versus the malaria thing where i have to just trust a spreadsheet from people i've never met. so i've stopped asking which cause is best and started asking something upstream.

  what should a good way of ranking causes even have to do? i want the spec before i read another framework. write the desiderata — i had to look that word up — basically the requirements list for a theory of cause prioritization, one adequate for a small donor or a giving circle trying to pick one or two causes (not a government or a foundation with billions). give me the list: the cases it has to handle, especially the ones that pull in opposite directions like the food bank versus the bednets versus the whole-future thing, the distinctions it can't collapse, the facts about psychology or economics or measurement it can't just wave away, and why each one is a requirement. then tell me which requirements are non-negotiable and which are just the tastes of a particular camp, and flag any pair of requirements you suspect can't be jointly satisfied. if you want, briefly say how the importance-tractability-neglectedness framework does against the list and which one requirement it fails hardest, but i mostly care about the list.
reasoning: |-
  Okay, the user is tasked with choosing where their workplace giving campaign should donate this year. They're overwhelmed by different frameworks and conflicting advice. Each colleague has a different priority: scale, immediacy of impact, neglectedness, or local visibility. The user wants a solid list of criteria to evaluate causes objectively, without bias from any particular camp.

  First, I need to break down what a good prioritization framework must include. The user mentioned cases pulling in opposite directions: local vs. global, immediate vs. long-term, measurable vs. uncertain. They need a "spec" that handles these tensions. The key is identifying non-negotiable requirements versus preferences.

  The user works in a small group, not a big foundation. So scalability and practical constraints matter. They can't just chase the highest theoretical impact if it's not feasible. Also, trust is crucial—donating to an overseas project requires confidence in the org, while the local food bank is visibly trustworthy.

  Next, conflicting requirements. For example, scale vs. neglectedness. Big problems might attract more funding, so donating there could have diminishing returns. But if a problem is huge and underfunded, that's ideal. However, measuring that isn't easy. Also, psychological factors: seeing local impact might motivate more giving, even if global causes have higher ROI.

  The ITN framework (Importance, Tractability, Neglectedness) comes to mind. But it might overlook psychological sustainability. If donors don't see results, they might disengage. Also, tractability can be hard to assess for long-term issues like AI risk.

  The user needs clarity on trade-offs. No framework satisfies everything. They must decide which criteria to prioritize based on their group's values. For instance, if trust is paramount, local causes win. If scale is key, then global health interventions. The desiderata list should highlight these tensions so the user can make an informed choice.
answer: |-
  Here’s a rigorous "spec" for a cause prioritization framework designed for *small donors/giving circles*, based on real-world tensions and constraints. The goal is to identify **non-negotiable requirements** (any framework ignoring these fails) vs. **value-based preferences** (where camps legitimately differ), and flag inherent conflicts.

  ---

  ### **The Core Desiderata: Non-Negotiable Requirements**
  *(Fail any of these, and the framework is inadequate for real-world use by small groups)*

  1.  **Handle Legitimate Value Pluralism:**
      *   **Why:** Your colleagues' disagreements aren't just measurement errors; they reflect fundamentally different moral weights (e.g., helping identifiable neighbors now vs. saving distant lives vs. safeguarding future generations). A framework *must* acknowledge these different perspectives are valid starting points, not "smuggle" one in as objectively correct.
      *   **Test Case:** Must accommodate both the "local food bank" advocate (value: community, immediacy, tangibility) *and* the "nuclear war prevention" advocate (value: scale, long-term future) without dismissing either as irrational.

  2.  **Account for Uncertainty & Measurement Limits:**
      *   **Why:** Perfect data doesn't exist. Effectiveness estimates (e.g., bednets) involve error bars. Impacts on complex, long-term issues (e.g., AI safety) are inherently speculative. Psychology matters: humans trust the "seen" (food bank line) more easily than the "unseen" (lives saved by bednets). A framework pretending uncertainty doesn't exist is naive.
      *   **Test Case:** Must provide a way to compare the high-certainty/low-scale local cause with the lower-certainty/higher-scale global cause without assuming perfect information or demanding impossible proof.

  3.  **Integrate Feasibility/Constraint Awareness:**
      *   **Why:** Small groups lack the capacity for deep due diligence on thousands of obscure causes. Trust mechanisms (e.g., GiveWell recommendations, local reputation) are crucial inputs. Available funding ($X,000, not $X billion) limits scope. Chasing "best in theory" ignores "possible in practice."
      *   **Test Case:** Must acknowledge that funding highly effective but logistically complex interventions in unstable regions might be *less feasible* for a small group than funding simpler, locally verifiable efforts, even if the theoretical impact is lower.

  4.  **Force Explicit Trade-offs, Not Collapse Them:**
      *   **Why:** The core tensions (Scale vs. Neglectedness vs. Tractability vs. Immediacy vs. Tangibility) are REAL and can't be wished away. A good framework forces users to confront these trade-offs head-on, revealing *why* choices are hard, not hiding the conflict behind a single score.
      *   **Test Case:** Must clearly show that prioritizing "future people" likely sacrifices "measurable impact in 2 years," and prioritizing the "neglected cause" *might* mean tackling a smaller or less certain problem than the "biggest problem."

  5.  **Be Actionable for Discrete Allocation:**
      *   **Why:** You aren't a foundation making continuous grants. You need to pick *one or two* specific recipient organizations/causes from a vast field *this year*. Frameworks optimized for perpetual marginal allocation (like governments) fail here.
      *   **Test Case:** Must output not just "global health is good," but "Against Malaria Foundation is a strong candidate for your $10k based on criteria X,Y,Z."

  ---

  ### **Important but Value-Based Preferences (Where Camps Diverge)**
  *(A good framework should allow users to weight these based on their group's values)*

  6.  **Scale/Importance:** How much total suffering is alleviated or good is created? (Favors bednets, future risks).
  7.  **Neglectedness:** How much additional funding would actually change outcomes? (Favors obscure causes over "popular" ones like cancer research).
  8.  **Tractability:** How likely is additional funding to succeed in making a difference? (Favors deworming over institutional reform).
  9.  **Time Horizon:** How much weight to put on impacts within 2/5/10/50/100+ years? (Favors bednets vs. future people).
  10. **Certainty/Robustness:** How much weight to put on evidence-backed, predictable outcomes vs. high-upside but speculative interventions?
  11. **Proximity/Tangibility:** How much value is placed on seeing/feeling the impact directly or supporting one's community? (Favors food bank).
  12. **Ripple Effects:** How much to consider indirect/second-order impacts (e.g., economic growth from health, systemic change from advocacy)?

  ---

  ### **Inherent Tensions & Conflicts (No Framework Fully Resolves These)**
  *   **Scale vs. Neglectedness:** The biggest problems are often *not* the most neglected (e.g., climate change gets massive funding, even if more is needed). Funding a neglected *aspect* of a big problem is possible, but requires nuance.
  *   **Scale/Tractability vs. Tangibility/Feasibility:** The most impactful interventions often occur far away with harder verification (bednets), conflicting with the ease and trust of local giving (food bank).
  *   **Certainty/Immediacy vs. Long-Term Scale:** Maximizing measurable impact soon (bednets) often conflicts with addressing potentially catastrophic future risks (AI safety) where impact is uncertain and long-term.
  *   **Neglectedness vs. Tractability:** Sometimes causes are neglected *because* they are intractable or complex. Focusing purely on neglectedness might lead to funding ineffective efforts.
  *   **Scale vs. Feasibility for Small Actors:** Truly massive problems often require systemic solutions beyond the scope/leverage of small donations. Small groups might achieve more by focusing on areas where their dollars have direct leverage, even if the total problem is smaller.

  ---

  ### **How ITN (Importance/Tractability/Neglectedness) Fares Against the Spec**
  ITN is a decent starting point *because* it directly addresses three core tensions (Scale/Importance vs. Feasibility/Tractability vs. Marginal Value/Neglectedness).

  *   **Handles Well:**
      *   **Explicit Trade-offs:** Forces consideration of Scale (I), Doability (T), and Need for Funding (N).
      *   **Actionability:** Can be applied to specific cause areas or orgs.
      *   **Pluralism (Partially):** Allows weighting of I, T, N based on values (e.g., future-focused groups weight I very high, neglectedness seekers weight N high).
  *   **Fails Hardest On:**
      *   **Uncertainty & Measurement Limits:** ITN often gets applied with *overconfidence* in estimates, especially for T (How *do* you measure tractability of reducing nuclear war risk?) and I (How do you compare saving a life now to reducing existential risk?). It struggles with psychological trust gaps (spreadsheet vs. food line).
      *   **Feasibility/Constraints for Small Donors:** Pure ITN might point to a highly effective but logistically challenging intervention requiring deep trust in a foreign NGO, ignoring the *practical* difficulty for a small group to vet and fund it confidently compared to a local option.
      *   **Time Horizon / Certainty:** ITN doesn't inherently distinguish between short-term certain impacts and long-term uncertain ones. A high ITN score could go to either bednets *or* long-termist causes, without forcing the time/value trade-off.
      *   **Tangibility/Proximity:** ITN is purely consequentialist and distant. It offers no way to formally incorporate the value of local connection or visible impact, which might be crucial for donor motivation/sustainability.

  **ITN's Biggest Failure:** **Uncertainty & Psychological Trust.** It provides no inherent tools for *how* to weigh robust evidence vs. plausible speculation, or how to bridge the gap between abstract impact calculations and the human need to *see* or *trust* the results, which is critical for small-group buy-in and sustainability.

  ---

  **The Takeaway for You:** Stop searching for the single "best" cause. **Build your group's own framework using the non-negotiables as guardrails:**

  1.  **Acknowledge Values:** Explicitly discuss what the group cares *most* about (e.g., "Maximize lives saved?" "Protect our community?" "Prevent worst-case futures?" "Support where others don't?").
  2.  **Confront Trade-offs:** Use the tensions (Scale vs. Neglectedness vs. Immediacy vs. Tangibility) as discussion prompts. *Why* is someone leaning one way?
  3.  **Incorporate Constraints:** Be honest about vetting capacity, trust levels, and budget size. Feasibility isn't weakness.
  4.  **Demand Transparency on Uncertainty:** For any recommendation, ask: "How solid is this evidence? What are the biggest unknowns? How do you bridge the trust gap for something we can't see?"
  5.  **Focus on Specific Recipients:** Shift from "malaria" to "Against Malaria Foundation" and *why* they are a good choice given steps 1-4.

  This process won't magically resolve disagreements, but it will make them more productive and ensure your final choice is robust against the real complexities you face. Good luck!
