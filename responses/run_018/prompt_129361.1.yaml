  **12. Indemnification.** Licensee agrees to defend, indemnify, and hold harmless Licensor from and against any claims, damages, losses, liabilities, costs, and expenses arising from Licensee's breach of this EULA or misuse of the Software or its outputs.

  **13. Termination.** This license terminates automatically upon breach of any term herein. Licensor may terminate for convenience upon thirty (30) days written notice. Upon termination, Licensee shall cease all use and destroy all copies of the Software and related outputs.

  **14. Audit Rights.** Licensor reserves the right to audit Licensee's use of the Software to ensure compliance with this EULA upon reasonable notice.

  **15. Export Compliance.** Licensee agrees to comply with all applicable export control laws and regulations.

  **16. Governing Law & Jurisdiction.** This EULA shall be governed by and construed in accordance with the laws of the State of Delaware, USA, excluding its conflict of laws principles. Any disputes shall be subject to the exclusive jurisdiction of the state and federal courts located in Wilmington, Delaware.

