prompt: |-
  Write a short research proposal (about two pages, suitable for a philosophy-of-science workshop grant) on the Pasadena paradox and its connection to undefined expected values. State the precise question: in a decision scenario where conditioning on available information yields contradictory recommendations because the underlying expectation is undefined, is the contradiction mathematical, epistemic, or normative? Explain why the standard resolutions—rejecting the conditioning step, restricting the principle of total evidence, or appealing to bounded rationality—leave open exactly this gap.

  Propose an approach that treats the undefined expectation not as a technical glitch to be regularized away, but as a structural feature revealing how decision rules should handle events of probability zero in continuous spaces. Justify this structural interpretation against the obvious alternatives: either declaring the game inadmissible, or patching the expectation with an arbitrary truncated prior. Describe the method: formalize a minimal model using only standard probability theory, compare three conditioning rules (standard Bayes, Jeffrey conditioning, and a restricted version of the principle of indifference), and determine whether any avoids contradiction without importing normative assumptions that beg the question.

  Specify what success looks like: a clear criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation, with the Pasadena scenario falling determinately on one side. Specify failure: if all three rules either collapse into contradiction or depend on an arbitrary cutoff, showing the paradox is genuinely unresolved rather than dissolved. Provide a realistic one-semester timeline with monthly milestones. Do not include a bibliography or citation-based literature review; you may refer to positions and arguments by name, and note that references will be added later. Frame the proposal for a reader with general decision-theory background but no specialized knowledge of this particular paradox.
reasoning: |-
  We are writing a research proposal on the Pasadena paradox. The Pasadena paradox arises in decision scenarios where the expected utility of an action is undefined (typically because it is conditionally convergent but not absolutely convergent). This leads to a situation where conditioning on available information yields contradictory recommendations. The central question is: when such contradictions arise, are they mathematical, epistemic, or normative in nature?

  The standard resolutions to the paradox include:
  1. Rejecting the conditioning step (i.e., not conditioning on the available information).
  2. Restricting the principle of total evidence (so that we do not condition on all available evidence in this case).
  3. Appealing to bounded rationality (we are not equipped to handle such complex scenarios).

  However, these leave open the gap of explaining why the contradiction arises and how to handle events of probability zero in continuous spaces.

  Our approach will treat the undefined expectation as a structural feature that reveals how decision rules should handle events of probability zero. We will argue against two obvious alternatives: declaring the game inadmissible (thus avoiding the problem) or patching the expectation with an arbitrary truncated prior (which is ad hoc).

  Method:
  - Formalize a minimal model using standard probability theory.
  - Compare three conditioning rules:
      a. Standard Bayes conditioning.
      b. Jeffrey conditioning (which allows for updating on uncertain evidence).
      c. A restricted version of the principle of indifference (which assigns equal probabilities to symmetric events of measure zero).

  We will determine whether any of these rules avoids contradiction without importing normative assumptions that beg the question.

  Success: We will have a clear criterion that distinguishes admissible from inadmissible conditioning in cases of undefined expectation, and the Pasadena scenario will fall determinately on one side.

  Failure: If all three rules either collapse into contradiction or depend on an arbitrary cutoff, then the paradox remains unresolved.

  Timeline (one semester, 5 months):
  Month 1: Formalize the Pasadena paradox in a minimal model and clarify the mathematical structure of the undefined expectation.
  Month 2: Analyze the scenario using standard Bayesian conditioning and document the contradictions that arise.
  Month 3: Extend the analysis to Jeffrey conditioning and the restricted principle of indifference.
  Month 4: Evaluate the three approaches for avoiding contradiction and their normative commitments.
  Month 5: Write up the results, including the success/failure criteria and implications for decision theory.

  Now, we write the proposal accordingly.
answer: |-
  ### Research Proposal: The Pasadena Paradox and Undefined Expectations—A Structural Gap in Decision Theory  

  **Title:** Conditioning Under Undefined Expectations: Resolving the Pasadena Paradox’s Normative Challenge  

  **Precise Research Question:**  
  In the Pasadena paradox—a decision scenario where conditioning on available information yields contradictory recommendations due to an undefined expected value—is the contradiction best understood as:  
  - *Mathematical* (a flaw in probabilistic representation),  
  - *Epistemic* (a failure of evidence integration), or  
  - *Normative* (a breakdown in rational choice principles)?  

  **Background and Problem Statement:**  
  The Pasadena paradox, introduced by Nover and Hájek, involves a game with divergent expected utility: payoffs grow as \((-1)^{n+1} \cdot 2^n / n\) for outcome \(n\) (e.g., a coin-flip game ending on the first heads). The expectation is conditionally convergent (dependent on summation order) but not absolutely convergent. Consequently, conditioning on events (e.g., "the game ends on an odd turn") flips the sign of the expected utility, yielding contradictory prescriptions (e.g., "play" vs. "do not play"). Standard resolutions fail to address the *nature* of this contradiction:  
  1. **Rejecting conditioning** (e.g., Barrett) avoids contradiction but ignores evidence, violating the principle of total evidence.  
  2. **Restricting evidence use** (e.g., Hájek) arbitrarily limits rationality to "well-behaved" cases, leaving zero-probability events unaddressed.  
  3. **Bounded rationality appeals** (e.g., Smith) dismiss the paradox as pathological, but real-world decisions (e.g., high-stakes gambles with fat-tailed risks) exhibit similar structure.  

  These approaches treat undefined expectations as technical glitches, masking a deeper gap: **how rational agents should handle conditioning on events of probability zero when expectations are undefined**.  

  **Novel Approach:**  
  We reframe the undefined expectation not as a defect but as a *structural feature* of decision problems in continuous or unbounded spaces. This reveals normative constraints on conditioning rules when standard expected utility fails. We argue against two alternatives:  
  - **Declaring the game inadmissible** (e.g., "no rational agent would offer it") is question-begging—it presupposes undefined expectations are irrational, but we seek to *evaluate* this claim.  
  - **Patching with truncated priors** (e.g., capping \(n\) at \(N\)) is arbitrary; choices of \(N\) alter recommendations, importing normative bias.  

  Instead, we propose that the paradox exposes a *normative incompleteness*: decision rules must explicitly govern zero-probability events in expectation-undefined contexts.  

  **Methodology:**  
  Using standard probability theory (Kolmogorov), we formalize a minimal Pasadena model:  
  - **Game setup:** A fair coin is tossed until heads. Payoff = \((-1)^{n+1} \cdot 2^n / n\) for heads on turn \(n\).  
  - **Conditioning events:** Define \(O\) (game ends on odd \(n\)) and \(E\) (even \(n\)), each with probability \(1/2\).  

  We compare three conditioning rules:  
  1. **Standard Bayesian conditioning:** Update beliefs given \(O\) or \(E\).  
  2. **Jeffrey conditioning:** Update probabilities for disjoint sub-events within \(O/E\) under uncertainty.  
  3. **Restricted principle of indifference:** Assign uniform densities over symmetric zero-probability refinements of \(O/E\) (e.g., limiting frequencies).  

  **Analysis:** For each rule, we test:  
  - Does conditioning on \(O\) vs. \(E\) yield consistent expected utilities?  
  - Does the rule avoid importing *ad hoc* normative assumptions (e.g., truncation)?  
  - Can it generalize to other expectation-undefined scenarios (e.g., St. Petersburg variants)?  

  **Success Criteria:**  
  - **Success:** A clear, non-arbitrary criterion distinguishing "admissible" conditioning (rule 3 avoids contradiction) from "inadmissible" (rules 1–2 fail). The Pasadena game falls determinately into "inadmissible" under rules that demand absolute convergence for conditioning.  
  - **Failure:** All rules either (a) collapse into Pasadena-style contradictions or (b) require arbitrary cutoffs (e.g., Jeffrey priors on summation orders), confirming the paradox as irreducible without new normative principles.  

  **Implications:**  
  Success would show that conditioning on zero-probability events is normatively invalid when expectations are undefined, demanding a "robust convergence" criterion for rational choice. Failure would prove the paradox’s resilience, urging a paradigm shift (e.g., ordinal decision rules). Both outcomes advance decision theory by clarifying the interplay between probability, evidence, and rationality.  

  **Timeline (One Semester):**  
  - **Month 1:** Formalize minimal Pasadena model (probability space, payoff function).  
  - **Month 2:** Implement standard Bayesian conditioning; derive contradictions.  
  - **Month 3:** Extend to Jeffrey conditioning and restricted indifference; test consistency.  
  - **Month 4:** Compare rules for normative bias; draft criterion for admissible conditioning.  
  - **Month 5:** Finalize results, evaluate success/failure, and prepare workshop presentation.  

  **Conclusion:**  
  This project interrogates whether undefined expectations reveal a mathematical limitation or a normative frontier. By testing conditioning rules in the Pasadena paradox, we aim to resolve a persistent challenge in philosophy of science: how rationality operates at the limits of probabilistic reason.
