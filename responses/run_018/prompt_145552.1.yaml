answer: |-
  ### Advised Research Agenda for Origin Essentialism: Prioritised Lines of Inquiry  
  **Ranking Criteria:**  
  1. **Importance:** Theoretical depth (metaphysical foundations) or practical urgency (ethical/legal implications).  
  2. **Tractability:** Feasibility of conceptual progress within 3 years without empirical lab work.  
  3. **Dependencies:** Upstream issues whose resolution unlocks downstream progress.  

  **Top Three Recommendations:**  
  **1. Line #1: Reproductive Technologies & Modal Survival**  
  *(Can origin essentialism withstand modal challenges from gamete variability?)*  
  - **Why #1?**  
    - **Importance:** Directly tests the *core metaphysical thesis* of origin essentialism. If reproductive technologies (e.g., *in vitro* gametogenesis) show genetically distinct gametes can produce phenotypically indistinguishable persons, this threatens the necessity of specific gametes. This is foundational: failure here collapses the theory’s plausibility, while survival could reinforce its necessity.  
    - **Tractability:** Purely modal/conceptual work using thought experiments (e.g., "sperm/egg swaps" in overlapping gamete pools). Leverages existing tools in counterpart theory or grounding relations.  
    - **Dependencies:** Upstream to all other lines. Resolving modal resilience informs #3 (cryopreservation identity), #2 (non-identity obligations), and #5 (metaphysical bearers).  
  - **Priority Triggers:**  
    - **Raise:** If new biotech models (e.g., synthetic gametes) reveal irreconcilable modal gaps—e.g., showing two persons could share all relational properties *except* gametic origins.  
    - **Lower:** If robust defences emerge (e.g., gametes as "non-fungible causal origins"), making further work redundant.  

  **2. Line #3: Cryopreservation & Numerical Identity**  
  *(Is a person from a decades-frozen embryo identical to the individual who *would* have developed earlier?)*  
  - **Why #2?**  
    - **Importance:** Bridges metaphysics with *practical ethics/law*. If identity is not preserved, this challenges legal personhood continuity (e.g., inheritance claims for frozen embryos). Conversely, if identity holds, it implies temporal flexibility in origins—contradicting strict essentialism. Ethically urgent given rising cryopreservation use.  
    - **Tractability:** Conceptual analysis of persistence conditions (e.g., Parfitian "q-memory" or biological continuity). Requires no new data—draws on existing jurisprudence (e.g., *Evans v UK* ECHR) and metaphysics of time.  
    - **Dependencies:** Informs #2 (non-identity obligations to cryopreserved embryos) and #4 (genetic property rights). Less upstream than #1 but more applied than #5.  
  - **Priority Triggers:**  
    - **Raise:** If courts rule on embryo inheritance cases, demanding philosophical clarity; or if theorists show temporally deferred development *severs* identity.  
    - **Lower:** If consensus emerges that identity is purely genetic (resolving the issue) or if legal systems bypass metaphysics via contractual solutions.  

  **3. Line #2: Non-Identity Problem & Future Obligations**  
  *(Do policies altering gamete unions create duties to *specific* future persons?)*  
  - **Why #3?**  
    - **Importance:** High *ethical stakes* for climate/reproductive policy. If origin essentialism entails that altering gamete unions creates/destroys distinct persons, it complicates obligations (e.g., "Why care about future people who won’t exist if we act?"). This impedes policy coherence but could ground stronger rights for "at-risk" future identities.  
    - **Tractability:** Engages bioethical frameworks (e.g., Parfit’s non-identity problem) and modal metaphysics. No lab work needed—analyse thought experiments like "resource depletion vs. gamete selection".  
    - **Dependencies:** Downstream of #1/#3. Only tractable if #1 confirms origin essentialism’s validity and #3 clarifies temporal identity. Unlocks #4 (genetic privacy as obligation-grounding).  
  - **Priority Triggers:**  
    - **Raise:** If climate policies face litigation based on "wrongful existence" claims, or if origin essentialism is shown to *resolve* (not worsen) non-identity paradoxes.  
    - **Lower:** If #1 undermines origin essentialism, making this moot; or if non-identity debates stagnate due to intractability.  

  ---

  ### Excluded Lines & Trade-offs:  
  - **#4 (Genetic Privacy/Property):** Important but derivative. Depends on resolving #1/#3 to define "origin story" as a unique proprietary interest. Lower priority: legal systems already address genetic data via consent/privacy law, reducing novelty.  
  - **#5 (Metaphysics of Bearers):** Theoretically deep but overly abstract for 3-year scope. Questions like "Is the genome or organism the bearer?" risk stalemate without prior modal clarity (#1).  

  **Value Judgements in Ranking:**  
  - Prioritised #1 due to **theoretical primacy**: metaphysics must ground ethics. A theory failing modal coherence (#1) cannot support applied work (#2–4).  
  - **Practicality favoured #3 over #2**: Cryopreservation cases are imminent (e.g., 30-year frozen embryos), while non-identity policies are diffuse.  
  - **Resource trade-off**: Avoided #5 for depth/breadth reasons—it could consume 3 years without yielding actionable insights.  

  **Execution Strategy:**  
  - **Years 1–2:** Focus on #1 (modal robustness) via co-authored papers. Simultaneously, the bioethicist scouts #3’s legal landscape.  
  - **Year 3:** If #1 succeeds, pivot to #3 (cryopreservation identity); if #1 fails, shift to #2 (non-identity) to salvage ethical relevance.  
  - **Outputs:** Policy briefs on cryopreservation (#3), a monograph on modal threats to origin essentialism (#1), and stakeholder workshops with fertility regulators.  

  This agenda maximises impact: shoring up metaphysics first ensures ethical applications are coherent, while cryopreservation offers tangible pathways to influence law and clinical practice within the funding window.
