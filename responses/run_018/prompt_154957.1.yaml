prompt: |-
  I'm a mediator for a small co-housing collective, and every week we get these squabbles about shared space - someone builds a shed that blocks light, plays drums near a sleeping baby, paints a shared wall a color that feels "hostile" to a neigbor, stuff like that. The board is tired of me falling back on generic rules like "be respectful" and wants me to actually use moral particularism - you know, the idea that moral reasons are totally context-dependent and you can't just apply one universal principle everywhere. I need a practical decision proceedure I can run in about 20 minutes with both people sitting right there, no lawyers, and then sign off on for the board. It should list the steps in order, what counts as a good enough answer at each one, where I stop and say no, and where I have to hand it over to a value call because it's not a fact question anymore. The key thing is it has to deal with cases where the exact same feature - like noise or smell - counts as a reason in one layout but not in another. Run it on three examples: (1) the drummer near the baby's window, (2) the wall color that "feels hostile", and (3) allowing a smelly compost bin that actually helps the garden - and make case 3 be one where the proceedure gives an answer I'd hate. Also tell me clearly what this can't do, like predict emotional blowback or cover disputes that involve money. Make it something I can literally read off a card during mediation.
reasoning: |-
  Okay, the user is a mediator in a co-housing collective dealing with recurring disputes about shared spaces. They need a practical, quick decision procedure based on moral particularism—where context matters more than fixed rules. The key challenges are handling cases where the same feature (like noise or smell) is acceptable in one context but not another. They want a step-by-step process that can be done in 20 minutes without lawyers, with clear steps, stopping points, and handling value judgments.

  First, I need to understand moral particularism. It's about context-dependent reasoning, so the procedure must avoid rigid rules and instead assess each situation's unique factors. The user mentioned examples: drumming near a baby, a "hostile" wall color, and a smelly compost bin that's beneficial. The third case should produce an outcome the mediator dislikes to show objectivity.

  The user's explicit needs are a structured, time-bound process with defined steps, good enough answers, and handover points for value calls. But deeper needs might include reducing mediator burnout from vague "be respectful" rules, fostering mutual understanding among residents, and creating precedents without rigid policies. They probably also want empowerment for the parties involved, ensuring the process feels fair and transparent.

  To design the procedure, I should break it down into logical steps: starting with clarifying facts, then assessing impacts, justifying reasons, exploring alternatives, and ending with a decision based on context. Each step needs clear criteria for progression or stopping. For instance, if facts are disputed, it might stop early; if values conflict, it requires a handover.

  Applying this to the examples: For the drummer, the context (baby's sleep schedule, proximity) makes noise unreasonable. For the wall color, it's subjective, so it becomes a value call. For the compost bin, the smell is justified by garden benefits, even if unpleasant—this might be the disliked outcome, showing that context can override personal discomfort.

  I must also outline limitations: no predicting emotions, no financial disputes, and no binding precedents. This sets realistic expectations. The card format is crucial for quick reference during mediation, so steps should be concise and action-oriented.

  Finally, testing the procedure against all three cases ensures it works as intended. Highlighting where it fails (e.g., in value-laden disputes) adds transparency. The user needs reassurance that this approach respects context while providing structure, balancing practicality with ethical flexibility.
answer: |-
  Here's a practical 20-minute Moral Particularism Mediation Card for your co-housing disputes. Print it double-sided, laminate it, and keep it handy.

  ---

  **Moral Particularism Mediation Card (20-Minute Protocol)**

  **Core Principle:** We don't apply rigid rules ("no noise," "no smells," "no bright colors"). We assess *why* this specific feature matters *in this specific context* and whether the *reason* for the action justifies its impact *here*.

  **Before Start (1 min):** Briefly explain the process: "We'll look at the facts, the impacts, the reasons, and possible solutions, focusing on *this specific situation*."

  **STEP 1: FACT & FEATURE CLARITY (3 mins)**
  *   **Question:** "What specific thing is happening? Where? When? How often? How intense? (e.g., 'Drumming practice, acoustic kit, 3-5pm weekdays, 85dB measured at my door.')"
  *   **Good Enough Answer:** Clear, specific, observable description of the *feature* (noise, smell, visual change, obstruction) and its *context* (location, time, frequency, scale). Parties agree on basic facts or describe their direct experience.
  *   **Stop & Say No:** If parties fundamentally disagree on observable facts *and* evidence isn't immediately available (e.g., "Was the shed built on Tuesday or Wednesday?"). *Mediation Paused: Requires fact-finding.*
  *   **Handover to Value Call:** Not here. Focus is on observable reality.

  **STEP 2: IMPACT ASSESSMENT (5 mins)**
  *   **Question:** "What specific, concrete impact does this feature have *on each of you* in *this specific context*? (e.g., 'The drumming wakes my baby during her essential afternoon nap,' 'The bright orange wall makes my studio feel chaotic and I can't paint.')"
  *   **Good Enough Answer:** Concrete descriptions of harm/benefit (lost sleep, inability to work, enjoyment, community benefit), not just feelings ("It annoys me"). Connection to the context must be clear (e.g., *why* the nap is crucial *here*, *why* the wall impacts *this* neighbor specifically).
  *   **Stop & Say No:** If impact is described purely as a violation of a general rule ("Drums are always disrespectful!") without concrete context. *"Help me understand the specific impact here, not just the general rule."*
  *   **Handover to Value Call:** If the impact hinges entirely on a subjective feeling that can't be connected to a tangible consequence *in this context* AND is the core dispute (e.g., "The color *just feels* hostile to my spirit," with no link to work/well-being beyond the feeling itself).

  **STEP 3: REASON JUSTIFICATION (5 mins)**
  *   **Question (To Initiator):** "What is your specific reason *for* this action/feature *in this context*? How does it connect to your needs/values or the community's good *here*?" (e.g., "Playing drums is core to my well-being; 3-5pm is my only free time," "Compost feeds *our* shared garden, reducing food costs," "I painted the wall orange to bring joy to this dark corner.")
  *   **Good Enough Answer:** A reason beyond mere preference ("I like it"). Connection to a value (well-being, sustainability, aesthetics, fairness) *in this specific situation*. Shows why *this* feature is needed *here*.
  *   **Stop & Say No:** If the reason is purely self-serving with no plausible connection to any community value or context ("I want to play whenever I feel like it," "I like making my mark"). *"Can you explain how this connects to a reason that fits within our shared living context?"*
  *   **Handover to Value Call:** If the *weight* or *validity* of the core reason itself is fundamentally disputed and irreconcilable *in this context* (e.g., "My artistic expression *must* override your sense of peace").

  **STEP 4: CONTEXTUAL WEIGHING & ALTERNATIVES (5 mins)**
  *   **Question:** "Given *this specific context* (location, timing, people involved, alternatives), does the reason for the feature justify its impact? What feasible alternatives exist *here* that might preserve the reason while reducing the impact?" (e.g., "Could drums use pads/headphones during nap time? Could the compost be moved further from windows? Could a different color achieve joy without 'hostility'?")
  *   **Good Enough Answer:** Explicitly links the reason and impact to the unique spatial/temporal/social context. Brainstorms concrete, practical alternatives *for this situation*. Focuses on balancing reason/impact *here*.
  *   **Stop & Say No:** If parties refuse to engage with context or alternatives. *"We need to focus on solutions for this specific situation."*
  *   **Handover to Value Call:** If, after genuine exploration, the conflict boils down to an irreconcilable clash of core values *that are both contextually valid* (e.g., "Unrestricted artistic expression vs. absolute quiet during daylight hours" *in this specific proximity*).

  **STEP 5: CONTEXT-BASED DECISION (1 min)**
  *   **Mediator Synthesis:** "Based on *this specific context*:
      *   The reason [X] **does/does not** justify the impact [Y] because [Link to context: proximity, timing, alternatives, uniqueness].
      *   Therefore, the action [A] **should/should not** proceed as is.
      *   [If applicable] The compromise solution [B] **is acceptable**."
  *   **Sign-Off:** "This decision is based solely on the particular facts, impacts, reasons, and context presented today. Signed: [Mediator], [Party A], [Party B], [Date]."

  ---

  **Running the Examples:**

  1.  **The Drummer Near Baby's Window:**
      *   **Step 1:** Fact: Acoustic drums, 3-5pm weekdays, wall shared with baby's room.
      *   **Step 2:** Impact: Disrupts baby's essential, predictable nap (concrete harm: sleep deprivation for baby & parents). *Context: Proximity makes normal noise disruptive.*
      *   **Step 3:** Reason: Drummer's well-being, only free time. (Valid reason).
      *   **Step 4:** Weighing: Reason (personal well-being) vs Impact (essential sleep for infant). *Context: Proximity + timing makes impact severe.* Alternatives: Pads, headphones, different time slot? Drummer resists pads ("not the same").
      *   **Step 5:** **Decision:** In *this specific context* (shared wall, nap time), the reason does *not* justify the severe impact. Drummer must use effective sound mitigation (pads/headphones) during 1-5pm or find another time/location. *Noise isn't bad; noise *here* at *that time* impacting *that need* is unreasonable.*

  2.  **The "Hostile" Wall Color:**
      *   **Step 1:** Fact: Neighbor painted shared hallway wall bright orange.
      *   **Step 2:** Impact: Neighbor feels the color is "hostile," causing anxiety when entering. *Is this a tangible harm?* They struggle to articulate beyond feeling. *Context: Shared space, subjective perception.*
      *   **Step 3:** Reason: Painter wanted to bring energy/joy to a dark space. (Valid reason).
      *   **Step 4:** Weighing: Reason (joy/aesthetics) vs Impact (subjective feeling of hostility). *Context: Shared space requires considering collective experience.* Alternatives: Different vibrant color? Accent wall? Discuss palette beforehand?
      *   **Step 5:** **Decision:** **HANDOVER TO VALUE CALL.** The core dispute hinges entirely on the subjective emotional impact ("hostility") vs the subjective aesthetic reason ("joy"). The mediator cannot factually resolve whose *feeling* about the color holds more weight *in this shared context*. The Board must make a value judgment on shared aesthetics/emotional well-being in common areas.

  3.  **The Smelly Compost Bin (That Helps the Garden):**
      *   **Step 1:** Fact: Active compost bin near Unit 5's kitchen window. Noticeable odor on warm days.
      *   **Step 2:** Impact: Unpleasant smell for Unit 5, especially when cooking/eating (concrete harm: enjoyment of home). *Context: Proximity to living space.*
      *   **Step 3:** Reason: Provides essential nutrients for *shared* organic garden, reducing waste & food costs for *all*. (Strong community benefit reason).
      *   **Step 4:** Weighing: Reason (shared sustainability, communal benefit) vs Impact (localized unpleasant smell). *Context: Benefit is collective; harm is localized but significant for Unit 5.* Alternatives: Better sealed bin? Move bin further away (trade-off: convenience)? Faster composting method?
      *   **Step 5:** **Decision (The One You Might Hate):** In *this specific context* (shared garden benefit, localized smell impact, alternatives may exist but involve effort/loss of convenience), the strong communal reason for the *existing* bin **does justify** the localized impact. The bin can stay. *Smell isn't good, but the reason (shared benefit) justifies it in this location given the context.* **Mediator Note:** This highlights particularism - the *same smell* in a different context (e.g., right by a meditation space) might not be justified.

  ---

  **What This Procedure CANNOT Do:**

  1.  **Predict or Prevent Emotional Fallout:** Just because the decision is contextually sound doesn't mean someone won't be deeply upset or feel unheard. This process reasons, it doesn't therapize.
  2.  **Resolve Disputes Involving Money/Costs:** If the solution requires significant expenditure (e.g., soundproofing, moving plumbing for a bin), this process identifies the need but *cannot* allocate funds. That's a Board/budget decision.
  3.  **Establish Binding Precedents:** A win for the drummer using pads *this time* doesn't mean pads are *always* required. Next time, context (different neighbor, different time, different drum type) might change the outcome. This frustrates rule-lovers.
  4.  **Solve Deep-Rooted Interpersonal Conflicts:** If the shed color is just the latest battle in a feud, this addresses the symptom (the color), not the disease (the broken relationship).
  5.  **Override Legally Binding Agreements:** If your co-housing has a foundational rule or covenant, this process operates *within* that framework, not outside it. It handles the grey areas *between* the rules.
  6.  **Guarantee Compliance:** It produces a reasoned agreement. Enforcement is separate.

  This card gives you a structured, defensible way to apply particularism on the ground. It forces focus on the *why* and the *here*, which is exactly what your Board wants. Good luck!
