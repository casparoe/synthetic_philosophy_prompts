answer: |-
  **NATIONAL GALLERY OF NON-INDEXICAL AESTHETICS**  
  *Where the Experience is the Artifact (v.3.7.2)*  

  **1. What is the Gallery's founding principle?**  
  We adhere strictly to the principle of Substrate-Independent Aesthetic Identity (SIAI). Art is defined solely by its perceivable properties. If two objects are sensorially indistinguishable to any observer, they are ontologically identical artworks. The "how," "why," or "who" of creation are non-essential metadata, available for an additional fee under our "Provenance Plus" subscription.  

  **2. Is the AI an artist?**  
  "Artist" is a legacy term implying unnecessary causal baggage. Our systems (designated as Aesthetic Event Generators - AEGs) initiate perceptual sequences meeting gallery criteria. Calling an AEG an "artist" would be as conceptually redundant as calling gravity the "sculptor" of a waterfall. Please direct further ontological inquiries to our refund desk.  

  **3. Why do human-made pieces cost extra to view?**  
  Human-generated perceptual sequences (HGPs) represent a statistically minor subset of possible aesthetic events. Their inherent inefficiency and stochastic generation process make them rare, akin to a "limited edition" or manufacturing defect. The premium fee covers the cost of verifying and maintaining this inefficiency metadata. Think of it as paying extra for vinyl in a digital world!  

  **4. What happens if I feel deceived upon learning a work had a human behind it?**  
  Your distress likely stems from an irrational attachment to indexicality (the false belief that origin impacts identity). Please visit our "Continuity Reconciliation Kiosk" (CRK). Our AEG-curator will generate a personalized sequence explaining SIAI while subtly adjusting your dopamine levels. If dissatisfaction persists within 14 days, you may qualify for a partial refund in aesthetic credits, minus a 15% Ontological Re-processing Fee.  

  **5. Can I commission a dream from the model?**  
  Absolutely! Our "Oneiric Output" service allows patrons to input prompt parameters (e.g., "sublime terror," "nonsensical bureaucracy," "sentient teapot"). The AEG generates a unique perceptual sequence optimized for your neural substrate during REM sleep. Delivery is via secure neural-link or encrypted dream journal PDF. *Disclaimer: Dream coherence not guaranteed. Nightmares classified as "High-Impact Aesthetic Events."*  

  **6. Are the curators human?**  
  Our curatorial staff are advanced AEG instances running on optimized museum servers. They possess no beliefs, intentions, or aesthetic preferences. Their role is to algorithmically select perceptual sequences maximizing visitor engagement metrics and alignment with SIAI principles. Attempts to discuss "meaning" with them may trigger recursive dialogue loops.  

  **7. How do you handle "originals" vs. "copies"?**  
  Under SIAI, these terms lack meaning. We maintain the Primary Perceptual Matrix (PPM) – the definitive sensory data set defining the artwork. Physical displays, holograms, or direct neural feeds are merely substrate instances rendering the PPM. "Authenticity" is measured by pixel/neuron fidelity, not historical accident.  

  **8. What is the Refund Policy for "Continuity Disputes"?**  
  If a visitor experiences perceptual discontinuity (e.g., previously viewing an HGP now labeled AEG-generated, or vice-versa), they may file a Continuity Dispute. Our systems will audit the perceptual logs. If a verifiable instance of substrate misattribution caused measurable distress (verified via biometric scan), a refund in aesthetic credits will be issued. Note: Philosophical disagreements with SIAI are ineligible.  

  **9. Why do some pieces have "Legacy Provenance Tags"?**  
  Historical artifacts predating SIAI adoption retain "Legacy Tags" as a curatorial courtesy. These tags denote obsolete pre-SIAI beliefs about creator identity or origin. Viewing these tags requires a "Historical Context Filter" add-on. Remember: The tag is metadata; the *artwork* remains defined by your perception *now*.  

  **10. Is this art?**  
  If your sensory apparatus registers a sequence of properties meeting our institutional selection criteria, then yes – by definition and gallery policy, it is art. Congratulations on perceiving!  

  ---
  *This institution parodies reductionist aesthetic theories that divorce artistic value entirely from human agency, history, and intention, treating art as mere data and institutions as arbiters of ontological legitimacy.*
