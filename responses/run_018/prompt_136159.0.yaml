  The cost of rejecting (5) is accepting that hinges aren't eternal absolutes - but that actually fits scientific practice better. Calibration standards do get retired when error bars accumulate, just not during active use. This preserves the vital (4) without making science dogmatic.

  *checks Wittgenstein's actual examples* Yes! He says riverbeds can move. Perfect. The error was reading "exempt from doubt" as "immune to all evidence forever" rather than "pragmatically unquestioned for current purposes."

