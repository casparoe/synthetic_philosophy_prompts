prompt: |-
  I'm running a two-hour session for my local LessWrong meetup — about 15 people, mostly programmers and a couple grad students, some of whom have done the sequences but none with linguistics — and I want an activity, not a lecture. The idea I want them to feel in their guts is that the nasty part of a slur isn't part of what's being asserted: it survives negation, embedded questions, and conditionals the way a presupposition or expressive does, while the descriptive part behaves normally. So "Dave is not a [slur]" still slimes Dave even though the sentence denies it, and asking "Is Dave a [slur]?" has already done the thing. I want the room to notice this pattern themselves, using a made-up group and a made-up slur so nobody has to produce a real one. Can you design the activity — roles, rules, materials, timeline — plus a debrief that maps what they noticed onto the at-issue/not-at-issue distinction and says why it's awkward for ordinary truth-conditional semantics? Also tell me what will predictably go wrong the first time I run it and how to steer around it, and which part of the phenomenon the activity can't reproduce (my guess is in-group vs out-group use changing the force, but you might have a better candidate).
reasoning: |-
  Okay, the user is organizing a two-hour LessWrong meetup for about 15 people, mostly programmers and grad students. They want an activity—not a lecture—to help participants grasp that the derogatory part of a slur functions differently from descriptive content, persisting through negation, questions, and conditionals. The key insight is that this aspect behaves like a presupposition or expressive, not part of the asserted content.

  First, I need to design an interactive exercise. Using a real slur is off-limits, so creating a fictional context is essential. The fictional group "Plogons" with the slur "Splorker" seems like a safe approach. This avoids real-world sensitivities while illustrating the linguistic phenomenon.

  The activity should guide participants to discover the pattern themselves. Group work with sentence cards showing different constructs (affirmative, negative, conditional, question) could work. Teams observe reactions and note when the offensive element persists. Timing is crucial—around 45-50 minutes for the activity, plus debrief.

  Predictable pitfalls: Participants might focus too much on the fictional scenario, missing the linguistic point. Emphasizing that Plogons aren't real and steering discussion back to language mechanics is key. Also, some might resist the fictional slur's offensive force, so pre-establishing the rules seriously helps. 

  Another challenge is the in-group/out-group dynamic. The activity can't replicate how slurs change force depending on who uses them. Highlighting this limitation during debrief is important. The debrief should connect observations to at-issue (descriptive) vs. not-at-issue (expressive) content, explaining why standard truth-conditional semantics struggles with expressives that don't affect truth values.

  Materials: Scenario cards defining Plogons and the slur, sentence cards for each group, worksheets for notes. Clear instructions to avoid misunderstandings. 

  During debrief, guide them from observations to concepts like presupposition and expressive content. Use examples to show how negation doesn't cancel the derogation, unlike descriptive claims. Explain why this is problematic for traditional semantics, introducing solutions like multidimensional semantics.

  Finally, address what the activity misses: speaker identity affecting meaning and reappropriation. This sets boundaries and acknowledges real-world complexity beyond the exercise.
answer: |-
  Here’s a complete activity design for your LessWrong session, optimized for discovery and grounded in linguistic pragmatics, with built-in safeguards:

  **Core Structure:**  
  *Guided discovery through fictional context + sentence manipulation + pattern mapping*

  ---

  ### **Activity: "Plogon Paradox"**  
  *(Total: 75 min = Setup 5m + Activity 45m + Debrief 25m)*

  **Materials:**  
  - 3 sets of laminated cards (1 set/group):  
    - **Context Card:** *"Plogons: A fictional community of underwater basket-weavers. Known for wearing orange hats and solving puzzles. The derogatory term ‘Splorker’ implies they’re irrational and dishonest."*  
    - **Sentence Cards:**  
      - "Kai is a Splorker"  
      - "Kai is NOT a Splorker"  
      - "Is Kai a Splorker?"  
      - "If Kai is a Splorker, we shouldn’t trust him"  
      - "I wonder whether Kai is a Splorker"  
      - "All Splorkers are lazy" (control)  
  - Worksheets with columns: *Sentence Type | Does it insult Kai? | Does it claim Kai is irrational/dishonest?*  

  **Roles & Rules:**  
  1. **Groups:** Split into 3 teams (5 people each).  
  2. **Scenario:** *"You’re city planners reviewing Kai’s basket-weaving permit. A colleague uses these phrases about Kai. Record how each statement makes your team feel about Kai and why."*  
  3. **Constraints:**  
     - NO real slurs allowed; "Splorker" must be treated *as if* offensive.  
     - Focus on **Kai’s reputation**, not grammar.  

  **Timeline:**  
  1. **Intro (5 min):**  
     - *"We’re exploring how language encodes attitudes. Use fictional terms to avoid harm."*  
     - Assign groups/distribute materials.  
     - **Crucial framing:** *"Your goal is to detect when Kai gets ‘slimed’ regardless of what’s literally said."*  

  2. **Activity (45 min):**  
     - **Phase 1 (15 min):** Groups categorize each sentence’s effect on Kai using worksheets.  
     - **Phase 2 (20 min):** Rotate sentence cards between groups. Find patterns:  
       - *"Which sentences still ‘slime’ Kai even if you DENY the claim?"*  
       - *"Which require you to accept the slur’s meaning to feel slime?"*  
     - **Phase 3 (10 min):** Groups draft 1 observation on sticky notes:  
       *"We noticed splime sticks when..."*  

  ---

  ### **Debrief (25 min):**  
  **Guided Discovery Qs → Linguistic Mapping:**  
  1. **Pattern Sharing (5 min):** Post sticky notes. Cluster observations (e.g., "slime survives negation/questions").  
  2. **Contrast (5 min):** Compare:  
     - *"Kai is dishonest"* vs. *"Kai is NOT a Splorker"*  
     → *"Why does negating ‘dishonest’ clear Kai, but negating ‘Splorker’ doesn’t?"*  
  3. **Linguistic Lens (10 min):** Introduce terms:  
     - **At-issue content:** What’s asserted/denied (e.g., *Kai’s group membership*). Dies under negation.  
     - **Not-at-issue content:** "Splime" - expressive baggage. Survives embedding like presuppositions (*"the King of France"*) but is *conventionally attached* to the word.  
  4. **Why Truth-Conditionalism Fails (5 min):**  
     - *"Standard semantics only cares about truth values. But ‘Splorker’ injects hate **as its default setting** — even in questions or false claims. The ‘slime’ isn’t truth-conditional; it’s a linguistic side-effect."*  

  ---

  ### **Predictable Failures & Fixes:**  
  1. **Problem:** Participants treat "Splorker" as silly, not offensive → no "slime" felt.  
     - **Fix:** Pre-load gravity: *"In this fiction, ‘Splorker’ caused Plogon suicides. Use it gravely."*  

  2. **Problem:** Groups debate Plogon lore instead of language.  
     - **Fix:** Redirect: *"Does changing Plogon traits change how ‘Splorker’ functions in sentences? Test it."*  

  3. **Problem:** Over-literalism (e.g., *"Negation means no insult!"*).  
     - **Fix:** Force perspective-taking: *"Imagine Kai overhears you say ‘Kai is not a Splorker’. Does he feel attacked?"*  

  4. **Problem:** Missing embedding patterns.  
     - **Fix:** Add a card: *"If Splorkers are dangerous, avoid Kai"* → *"Does this assume Kai is irrational?"*  

  ---

  ### **What the Activity CAN’T Capture:**  
  **In-group Dynamics & Reappropriation**  
  - **Why:** The "slime" depends entirely on speaker/audience identities. When in-group members use slurs:  
    - It may signal camaraderie (not hate).  
    - The expressive content *mutates* (e.g., "n*gga" in Black speech).  
  - **How to address:** *"Our activity shows default expressive force. But slurs are social tools — the same word can harm or bond based on who speaks it, their history, and context. This is why reclamation is possible but risky."*  

  ---

  **Why This Works for LessWrongers:**  
  - Leverages their love of puzzles/fictional worlds.  
  - Reveals hidden linguistic architecture through hands-on data.  
  - Connects to rationality (e.g., *"Why can’t we ‘negate away’ toxicity?"*)  
  - Avoids real slurs while preserving mechanistic insight.  

  **Final Tip:** Pre-write observation prompts on worksheets to nudge pattern detection:  
  *"Circle sentences where Kai feels insulted EVEN IF the speaker denies describing him."*
