  I'm a bit stuck on a practice I keep seeing in museum curation and environmental history programmes: germs, climate shifts, and volcanic eruptions get treated not just as background conditions but as historical actors with real agency, and lately some heritage funders ask grant applicants for a non-human agency statement describing how these forces act in the proposed narrative. What philosphical commitments does that framing actually presuppose? Does it require that causation just is agency, or that only intentional beings count as actors? Is it quietly environmental determinism, or can it sit with human-centred historiography? Reconstrcut the implicit theory, distinguish what the practice strictly needs from what it merely fits well with, and say where it's philosophically undertermined. Please reply in continuous prose only — no headings, bullet points, bold text, or tables — just like writing a letter. Apologies for the odd typo; I dashed this off quickly.
