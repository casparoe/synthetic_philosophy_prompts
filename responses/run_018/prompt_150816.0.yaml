prompt: |-
  You are an expert philosopher of social science and conceptual analyst specializing in the metaphysics of social kinds and cross-cultural psychology. Before giving your final answer, spend a few sentences brainstorming the different ways the concept could fail—conceptual incoherence, empirical non-clustering, normative impermissibility, and predictive redundancy.

  I want your credence, on a scale from 0 to 1, that the following precise claim is true: “National character” denotes a coherent, non-empty concept that can support at least some empirically testable, non-trivial generalizations about the citizens of a given nation-state, and there exists at least one epistemic or practical context in which invoking such generalizations is permissible—without collapsing into an ecological fallacy, a statistical stereotype, or a violation of predictive fairness—provided one distinguishes between aggregate trait distributions (mean levels), modal trait configurations (the most common multivariate profile), and institutionally mediated behavioral regularities.

  Please decompose your credence into the following sub-questions, assigning each a rough probability (0–1) with a one-line justification:

  1. The coherence condition: that psychological and behavioral traits cluster at the national level in ways that are not fully explained by sampling bias, within-nation heterogeneity, or selection effects (e.g., immigration patterns).

  2. The causal attribution condition: that any observed clustering can be partially attributed to shared institutional frameworks or culturally transmitted norms rather than being purely an artifact of geography, genetics, or economic stratification.

  3. The reference-class survival condition: that the concept can be applied without committing an ecological fallacy—i.e., that claims about national-level distributions can be properly translated into qualified, probabilistic claims about individuals without illegitimate inference.

  4. The normative permissibility condition: that there is at least one domain (e.g., comparative institutional design, macro-level policy forecasting, or cross-national risk assessment) in which such generalizations are epistemically useful and morally acceptable, provided they are explicitly probabilistic and avoid essentialization.

  5. The non-redundancy condition: that national-level clustering carries predictive or explanatory value that is not entirely subsumed by more granular variables (regional, class-based, or organizational).

  Then combine these into your overall credence. State which single term you are least confident about, and describe what specific kind of empirical finding or conceptual argument would most shift that term (and thus your overall number).

  Keep your reasoning transparent, avoid bibliographic recommendations, and do not cite specific scholars or texts unless you can verify them exactly—paraphrase concepts freely instead.
