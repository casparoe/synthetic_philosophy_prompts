  First, I need to mentally reconstruct Wigner's 1960 essay. He wasn't making ontological claims but expressing genuine surprise at how pure math (like group theory in quantum mechanics) later fits physics perfectly. The "unreasonable" bit hinges on the independence of mathematical development from physical concerns. That's key. 

