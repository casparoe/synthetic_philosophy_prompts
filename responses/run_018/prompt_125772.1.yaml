  - (b) Ontological claim (math = reality): Radical Platonism. Wigner didn't go there. Substantive but highly debatable; actually motivates explanatory projects instead of ending them. 
  - (c) Epistemic-selection claim: Like "anthropic principle" for math. Trivial if overstated, but useful corrective. Again, invites investigation into cognitive/social filters. 
  - (d) Methodological cherry-picking: True but incomplete. Doesn't cover cases where math predicts novel phenomena. 
  - (e) Added this: Structural realism + explanatory depth. Important nuance—predictive success vs. deep explanation (e.g., complex numbers in QM). Wigner gestured at this. 

  User's deeper need: Armor against lazy invocations of the slogan. They want to say: "Which version do you mean? Because none block philosophical work." The verdict should isolate Wigner's actual puzzle—the predictive serendipity of abstract math—as the only non-trivial point, while stressing it's a starting gun for inquiry, not a finish line. 

  Verdict must be surgical: "The uncanny frequency with which..." captures the surprise element without mysticism. User can wield this to reopen closed discussions.
answer: |-
  Here's a disambiguation of "the unreasonable effectiveness of mathematics" into distinct, precise theses, evaluated for substance, defensibility, and implications for philosophical inquiry. I've included Wigner's likely intent and common accretions, using your framework:

  ### The Disambiguation Menu
  1. **Historical-Empirical Claim (Pure Math → Applied Serendipity)**  
     *Thesis*: Mathematical structures developed for internal/aesthetic reasons (e.g., group theory, complex numbers) later prove astonishingly accurate in describing physical phenomena with no prior empirical motivation.  
     *Substantive/Defensible?*: **Yes**. Documented in cases like matrix math in QM or Riemannian geometry in GR.  
     *Dismisses explanatory projects?*: **No**. It *demands* explanation (why this serendipity?). Wigner’s core focus.  

  2. **Ontological Claim (Math = Reality)**  
     *Thesis*: The physical universe *is* mathematical structure (e.g., Pythagoreanism, Max Tegmark's Mathematical Universe). "Effectiveness" is trivial because math isn’t *describing* reality—it *is* reality.  
     *Substantive/Defensible?*: **Substantive but contested**. Arguably falsifiable (e.g., if irreducibly non-mathematical entities exist).  
     *Dismisses explanatory projects?*: **No**. Shifts them (why *this* math? why cognition’s access?). Not Wigner’s view.  

  3. **Epistemic-Selection Claim (Survivorship Bias)**  
     *Thesis*: Human cognition, scientific methods, and cultural evolution select *for* mathematical tools that "work"; failures are forgotten or excluded from "science." Effectiveness is an artifact of filtering.  
     *Substantive/Defensible?*: **Partially defensible but overgeneralized**. Explains *some* success (e.g., why we use linear models), but not novel predictions (e.g., Dirac’s positron).  
     *Dismisses explanatory projects?*: **Rhetorically misused**. Highlights a mechanism but ignores cases exceeding selection (e.g., a priori math predicting new entities).  

  4. **Methodological Cherry-Picking Claim (Formalization Limits)**  
     *Thesis*: Mathematics only succeeds where phenomena are quantifiable/isolatable (e.g., planetary motion); we ignore domains resisting mathematization (e.g., consciousness, qualia), making "effectiveness" illusory.  
     *Substantive/Defensible?*: **True but incomplete**. Correctly notes boundary conditions, but doesn’t explain *depth* of fit in "favorable" domains.  
     *Dismisses explanatory projects?*: **No**. Reframes the puzzle (why *are* some domains formalizable?).  

  5. **Explanatory Depth Claim (Prediction vs. Explanation)**  
     *Thesis*: Mathematics is often *predictively* effective but rarely *explanatorily* deep. True "unreasonableness" lies in math revealing *why* phenomena occur (e.g., symmetry principles explaining conservation laws), not just modeling *that* they occur.  
     *Substantive/Defensible?*: **Crucially substantive**. Distinguishes algorithmic utility from insight (e.g., complex numbers in QM aren’t just calculational tools).  
     *Dismisses explanatory projects?*: **Inverts them**. Demands accounts of *explanatory* superiority (e.g., structural realism). Wigner hints at this.  

  ---

  ### Wigner’s Actual Thesis (1960)  
  Wigner advanced **#1 (Historical-Empirical)**, emphasizing *surprise* at the serendipitous application of pure math. He tentatively gestured at **#5 (Explanatory Depth)** but rejected ontological (#2) and selectionist (#3) solutions as inadequate. His "unreasonable" was an expression of mystery, not a dismissal of inquiry.  

  ---

  ### Verdict on Slogan-Misuse  
  Each thesis **fails to license dismissal** of philosophical projects:  
  - **#1 and #5** *are* the puzzles needing explanation.  
  - **#3 and #4** are critiques of the phenomenon’s scope, not its existence.  
  - **#2** replaces the puzzle with a metaphysical stance requiring defense.  

  Using "unreasonable effectiveness" as a conversation-stopper relies on **smuggling in #2 or #3** while ignoring Wigner’s intent (#1/#5). This is **rhetorical evasion**, not philosophical rigor.  

  ---

  **Verdict:** The substantive core is *the uncanny frequency with which a priori mathematical structures, developed independently of empirical goals, later provide* **not merely predictive accuracy but indispensable explanatory depth** *in fundamental physics, despite no obvious evolutionary or logical necessity for this alignment*.
