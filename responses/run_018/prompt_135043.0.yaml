answer: |-
  **Bottom line:** Your position is most decisively threatened by robust intuitions that structural complicity *can* generate hypocrisy defeating standing when the blamer's complicity is proximate, voluntary, and sustains the very injustice they condemn, particularly in cases like affluent climate critics or beneficiaries of systemic discrimination blaming its victims.

  **Exposure Map:**

  1.  **Decisive Case Intuitions:** Strong counterexamples exist where structural complicity *intuitively* undermines standing decisively.
      *   **Climate:** An affluent academic *repeatedly* flying for conferences while lambasting ordinary citizens for driving petrol cars. Intuition: Their luxury emissions, enabled by and reinforcing the system, make their blame hollow.
      *   **Discrimination:** A manager in a discriminatory institution (benefiting from biased promotion) blaming a subordinate for underperformance partly caused by systemic barriers they uphold. Intuition: Their role *in* the structure negates standing to blame its effects.
      *   *Unrestricted defenders would see these as core evidence; you'd need to explain away the intuition or significantly qualify "identical wrong/mode".*

  2.  **Formal/Analogical Arguments:** Arguments showing the distinction is one of degree risk collapsing your view.
      *   **Culpable Causation:** If the blamer knowingly benefits from *and* fails to resist structures causing the wrong, their complicity isn't passive but actively sustains harm. The difference from direct commission is responsibility *level*, not *kind*.
      *   **Agency Analogy:** Profiting from a theft ring vs. directly stealing: both undermine standing to blame another thief, differing in severity, not category. *Unrestricted defenders might concede this weakens their "absolute" stance but strengthens the core claim against yours.*

  3.  **Falsifiability Risk:** Your distinction *is* vulnerable to becoming unfalsifiable if "identical wrong/mode" is qualified *ad hoc* to exclude structural cases (e.g., "systemic benefit isn't *identical* agency"). Guard against making the criteria so specific they only cover direct cases. *Insulation by qualification is problematic if it renders the core claim immune to counterevidence; some refinement is expected, but core commitments must remain testable.*

  **Key Distinction:** Unrestricted defenders would likely *dismiss* objections based on trivial structural links (e.g., mere existence in a society) but *concede* that decisive counterexamples exist where structural complicity is sufficiently agential and harmful to cancel standing. Your challenge is showing why the cited cases fail this threshold without circularity.
