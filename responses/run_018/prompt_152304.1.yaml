answer: |-
  That's an incredibly sharp set of questions – you've hit the core tensions within co-determination models and exposed the philosophical ambiguities they carry. Let's break down the presuppositions inherent in the practice you describe (worker board seats with shareholder veto, size thresholds) and see how they relate to Mill's late socialism:

  **Core Presuppositions of Co-Determination (as described):**

  1.  **Fundamental Primacy of Capitalist Property Rights:** The shareholder veto over core decisions (mergers, liquidation) is the clearest signal. It presupposes that:
      *   The ultimate authority and purpose of the firm reside with capital providers (shareholders).
      *   Their "negative liberty" (freedom *from* interference in disposing of *their* property) trumps any collective worker claim to control, even partially. Workers are seen as stakeholders with legitimate *interests*, but not co-owners with fundamental *rights* over the productive assets.
      *   Economic freedom is primarily defined as the freedom of owners to control and dispose of their capital.

  2.  **Workplace Democracy as a *Mitigation* Tool, Not a Foundational Principle:** Worker representation is conceptualized as:
      *   A counterbalance to managerial power *within* the existing structure.
      *   A mechanism to improve information flow, reduce conflict, and enhance efficiency/stability ("productive" goals).
      *   A concession granted *by* the system of private ownership to address its potential dysfunctions (worker alienation, adversarial relations), not a recognition of an inherent democratic right rooted in labor's contribution.
      *   A welfare/interest-representation model, not a sovereignty model.

  3.  **The Production/Distribution Distinction is Alive and Well:** This practice heavily leans on Mill's earlier distinction:
      *   **Production:** Seen as governed by immutable economic laws best managed within a capitalist framework (private ownership, market competition). Efficiency and capital allocation are paramount here.
      *   **Distribution:** Seen as malleable by human institutions and social choice. Co-determination intervenes here, aiming to distribute *influence* and *voice* more fairly *within* the firm, improving the distribution of working conditions and information, *without* altering the fundamental ownership structure governing production and asset control.

  4.  **Negative Liberty Bias in Defining Coercion:**
      *   A significant expansion of worker control *beyond* consultation/voice (e.g., removing the shareholder veto) would likely be perceived by defenders of this model as *coercive* against shareholders. This presupposes that shareholder rights are the baseline of "non-coercion," and any significant constraint on them requires extraordinary justification.
      *   Worker participation, *even if democratic*, is implicitly framed as potentially infringing on the negative liberty of owners unless carefully circumscribed (hence the veto).

  5.  **Size Thresholds: Presuppositions of Consent and Authority:**
      *   **Naturalizing Authority in Small Firms:** The threshold presupposes that in smaller firms, the owner/manager relationship is sufficiently personal, direct, and "consensual." Authority is seen as inherent to ownership/entrepreneurship at this scale. Imposing formal democracy is viewed as unnecessary bureaucratic overreach.
      *   **Bureaucracy vs. Democracy:** It equates the *need* for democracy with the *problem* of bureaucracy/large-scale impersonality. Democracy is seen as a corrective mechanism for the alienation and power concentration endemic to large organizations, not as a universal principle of legitimate workplace authority.
      *   **Consent as Tacit/Pragmatic:** Below the threshold, worker "consent" to managerial authority is presumed through the act of taking the job, framed as a voluntary contract between individuals. Above the threshold, this tacit consent is deemed insufficient due to scale and complexity, requiring formal democratic structures. This presupposes a very thin, market-based notion of consent for small firms.

  **Mill's Late Socialism vs. Co-Determination:**

  1.  **Mill's Transformative Vision:** Mill's later essays move decisively *beyond* the production/distribution distinction. He argues that the *conditions of labor itself* – subordination, dependence, lack of autonomy – are inherently degrading and incompatible with true individual liberty and development. He envisions cooperatives not just as better distributors of profits, but as fundamentally *different forms of association* where workers are *sovereign*, eliminating the master-servant relationship. Freedom requires transforming the power structure, not just mitigating its effects.
  2.  **The Instability You Identified:** You are absolutely right. Co-determination, as described, *is* philosophically unstable *from Mill's late perspective*.
      *   **Power Structure Intact:** The fundamental power dynamic (capital hires labor, capital ultimately controls the assets) remains. Workers have *influence* and *voice*, but not *sovereignty*. Mill saw worker subordination itself as the problem.
      *   **Democracy Within Hierarchy:** It grafts democratic elements onto a fundamentally hierarchical structure based on capital ownership. Mill sought to replace that hierarchy with associative democracy.
      *   **Liberty as Development:** Mill's "positive" liberty (self-development, autonomy) requires active participation and control over one's working life. Co-determination offers limited participation within a framework where ultimate control lies elsewhere. It doesn't fulfill Mill's ideal of transforming labor conditions into a school for active citizenship and self-realization.
      *   **Voluntary Association vs. Mandated Compromise:** Mill prioritized *voluntary* cooperative associations emerging organically. Co-determination is a state-mandated, top-down *compromise* imposed on the existing capitalist structure. It lacks the transformative, voluntary associative spirit Mill championed.

  **Co-Determination and Rival Theories:**

  *   **Nozickian Entitlement:** This model fits *much* better with Nozick (or classical liberalism broadly). It respects core capitalist property rights (shareholder veto as non-negotiable). Worker participation is a patterned modification (like taxation for welfare) that infringes on pure entitlement but is tolerated as a pragmatic adjustment for stability or social peace, justified by utilitarian or social contract arguments *within* a system prioritizing individual property rights and negative liberty. The size threshold reinforces the idea of minimal state interference in private transactions below a certain scale.
  *   **Pragmatic Social Democracy:** It aligns with theories valuing mixed economies, social partnership, and incremental reform. It prioritizes stability, reducing class conflict, and improving worker welfare *within* a predominantly capitalist framework. The presuppositions are less about pure philosophical coherence and more about managing the tensions of industrial society through negotiated compromises and institutional checks and balances.

  **Conclusion:**

  The co-determination model you describe presupposes a **modified capitalist framework** where:
  1.  Capitalist property rights remain foundational and supreme (negative liberty of owners).
  2.  Workplace democracy is a secondary mechanism for interest representation, conflict mitigation, and welfare improvement within that framework (a distributional adjustment).
  3.  It implicitly relies on Mill's *early* production/distribution distinction, treating ownership and core control as part of immutable "production," while democratizing aspects of workplace relations as part of malleable "distribution."
  4.  It embodies a negative liberty bias, viewing significant worker control as potentially coercive against owners.
  5.  Size thresholds naturalize autocratic authority in small firms and equate democracy with a remedy for large-scale bureaucracy, revealing a contingent view of workplace consent.

  **This is fundamentally at odds with Mill's *late* socialism.** Mill rejected the idea that worker liberty and development could be achieved without transforming the foundational power relation of labor subordination to capital. He sought associative sovereignty, not representation within hierarchy. While co-determination might be seen as a *step* towards Mill's ideal in its recognition of worker voice, its preservation of ultimate shareholder control and its reliance on the production/distribution split make it philosophically unstable *from his mature perspective*. It aligns far more comfortably with theories prioritizing capitalist property rights (like Nozick's) or pragmatic social democracy seeking stability within capitalism. Mill's late vision demanded a more radical rethinking of economic freedom itself.
