  **Sidebar: Scholar's Note on Handle Semiotics.** *A contentious field. The "Bend School," led by our own research, interprets the angle as irrefutable proof of gendered specialization. The rival "Stress Fracture Faction" argues it represents post-depositional landfill compression. We find their methodology... reductive. The symbolic resonance is paramount.*

