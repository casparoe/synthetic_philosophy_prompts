answer: |-
  Here's a conceptual clash between the two frameworks, focusing on your requested points:

  **The Core Philosophies:**

  1.  **Classic Undeserving-Poor Frame (CUP):**
      *   **Premise:** Economic support is a conditional *privilege*, not a right. It must be *earned* through demonstrable effort (workfare) or proven absolute necessity (strict eligibility). Unemployment stems primarily from individual failing (lack of effort, poor choices, moral weakness) or fraud.
      *   **Goal:** Deter dependency, incentivize work, protect taxpayer resources from the "lazy" or "fraudulent."
      *   **Implied View of People:** Suspicious of claimants' motivations. Sees human worth/value primarily tied to economic productivity. Asserts that hardship is a necessary motivator.

  2.  **Reverse-Desert Frame (RD):**
      *   **Premise:** Economic disconnection (long-term unemployment) is a form of *societal harm*. As skills atrophy and networks decay due to lack of opportunity/structural factors, the individual suffers a loss inflicted *by the system*. Therefore, society *owes* them increasing support as compensation for this damage.
      *   **Goal:** Repair societal harm, prevent skill atrophy from deepening poverty traps, acknowledge structural factors in unemployment.
      *   **Implied View of People:** Recognizes individuals as victims of circumstance/systemic failure whose inherent value is diminished by societal neglect. Support is reparative, not charitable.

  **The Clash:**

  1.  **On Deterrence:**
      *   **CUP:** Deterrence is **central and positive.** Harsh conditions (mandatory work, time limits, low benefits) are essential to scare people *off* benefits and *into* work. Without this "stick," people will choose idleness over labor. Workfare *is* the deterrent mechanism ensuring only the "truly needy/deserving" apply and that they don't stay long.
      *   **RD:** Deterrence is **counterproductive and cruel.** Disincentivizing benefits *is* disincentivizing essential repair. The longer someone is unemployed, the *harder* it becomes to re-enter work due to skill rot and stigma. RD argues *increased* support is needed precisely to *counter* the disincentives *created* by unemployment itself (loss of confidence, decaying skills, network loss). Punishing people for societal harm inflicted on them makes the problem worse, trapping them deeper. The focus is on enabling eventual reconnection, not scaring people away from help.

  2.  **On Risk of Fraud:**
      *   **CUP:** Fraud is a **pervasive, existential threat.** The system must be designed primarily around preventing and detecting fraud. Extensive verification, work requirements, and strict eligibility criteria are necessary safeguards against the "cheats" who would otherwise exploit taxpayer generosity. Fear of fraud justifies intrusive checks and limited benefits.
      *   **RD:** Fraud is a **marginal concern compared to systemic harm.** While acknowledging fraud exists, RD sees the obsession with it as a distraction that justifies underfunding support and creating hostile, demeaning bureaucratic hurdles. The *real* cost is the societal debt owed to those genuinely suffering skill rot due to lack of opportunity, not the tiny fraction who might cheat. RD prioritizes getting adequate support to those harmed over preventing every possible instance of fraud, viewing the latter focus as disproportionately harming the truly vulnerable.

  3.  **On Respecting People:**
      *   **CUP:** Claims respect through **"tough love" and upholding the work ethic.** It argues that requiring work and verifying need respects taxpayers and the "truly deserving" poor by ensuring resources aren't wasted. It claims to respect individuals by expecting them to contribute and not infantilize them with "handouts." *However:* This often manifests as profound **disrespect in practice:** treating claimants as potential fraudsters by default, subjecting them to humiliating checks, ignoring structural barriers, valuing them only as labor units, and implying their poverty is a moral failing.
      *   **RD:** Claims respect through **acknowledging harm and societal obligation.** It starts from the premise that long-term unemployment is *damaging* and that society bears responsibility for mitigating that damage. Providing increasing support reflects respect for the individual's inherent dignity and the real loss they suffer through no fault of their own. It avoids the inherent suspicion and moral judgment of CUP. *However:* Critics might argue RD risks **paternalism and diminished agency** – framing the unemployed solely as victims owed reparations might overlook individual resilience or capacity, potentially discouraging proactive job search if support becomes too comfortable, and defining people primarily by their unemployment status.

  **The Fundamental Conflict:**

  *   **CUP** views unemployment as primarily an **individual choice/moral failing** that must be corrected through incentives/disincentives tied to labor. Support is conditional charity.
  *   **RD** views long-term unemployment as **societally inflicted harm** demanding reparations. Support is an owed debt.
  *   **Deterrence:** CUP sees it as essential motivation; RD sees it as deepening harm.
  *   **Fraud:** CUP sees it as the primary risk to manage; RD sees it as a minor distraction from the core obligation.
  *   **Respect:** CUP claims respect through expectation and verification but often delivers suspicion and punishment. RD claims respect through acknowledgment and repair but risks defining people by their victimhood.

  Neither view perfectly "respects people" in a holistic sense. CUP often disrespects through suspicion and conditional worth tied solely to work. RD risks disrespect through potential paternalism and potentially undermining a sense of personal efficacy. Their clash is fundamentally about causality (whose fault is unemployment?), obligation (what does society owe the unemployed?), and the very purpose of welfare (social control vs. societal repair).
