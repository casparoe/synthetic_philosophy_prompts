prompt: |-
  I've been arguing with my friend Maya about travel ethics and she has this consistant track record on conventions. She says in the US not tipping is basically theft even if you're a tourist who just landed, in Japan you should never tip even if it feels rude not to, queue-jumping in London is a real moral wrong but in Naples it's more like breaking an etiquette game with no deep weight. She also thinks jaywalking in Berlin at 3am with zero cars is still wrong because you're eroding a shared commitment, but in Saigon where traffic is just continuous negotiation she doesn't think visitors are morally failing by weaving through however they can.

  Now she mentioned Finland — apparently at bus stops people don't form a visible line but stand in this loose spread and everyone silently tracks who arrived when, and if you stand right behind someone like in New York you're being invasive even though there's no line to technically cut. She hasn't said whether a tourist has to learn that invisible queue, but I want to predict her take. Is she running "local coordination norms always bind visitors" versus "only norms that prevent harm or free-riding"? What'd she say about the Finnish cluster, and what further case would actually split those two rules? I'm also curious if there's a third rule that fits her earlier verdicts just as well, and if so which one is the best match for her Berlin vs Saigon distinction.
reasoning: |-
  Okay, let me unpack this user's query about Maya's travel ethics framework. The user presents several clear examples of Maya's positions on cultural norms across different countries, all revolving around how visitors should adapt to local conventions. 

  First, I notice Maya consistently prioritizes local norms over universal rules - she distinguishes between contexts where tipping is obligatory (US) versus discouraged (Japan), queueing as moral (London) versus pragmatic (Naples), and jaywalking as civic duty (Berlin) versus survival necessity (Saigon). The Finnish bus stop example adds another layer with its invisible queuing system.

  The core question seems to be identifying the underlying principle behind Maya's judgments. Two potential frameworks emerge: 
  1) Strict local norm adherence ("always bind visitors")
  2) Harm/free-riding prevention as threshold ("only when norms prevent exploitation")

  Looking at the Finnish case, Maya would likely insist tourists learn the invisible queue system. Her Berlin jaywalking stance shows she cares about maintaining social fabric even without immediate harm, while Saigon's context acknowledges practical necessity. This suggests her principle leans toward respecting local coordination mechanisms as valuable in themselves, not just when they prevent tangible harm.

  But there might be a third option: a "social contract" framework where norms bind visitors when they're functionally necessary for group coordination. This fits all her examples - Finnish queues organize boarding efficiently, London lines prevent conflict, US tipping sustains wages. Where norms don't serve core coordination (Naples queue-jumping, Saigon crossing), they become optional etiquette.

  The Berlin/Saigon contrast particularly supports this. Berlin's empty-street jaywalking erodes a system designed for predictability, while Saigon's fluid traffic makes individual adaptation necessary. Harm prevention alone wouldn't explain why Maya cares about 3am jaywalking in Berlin - it's about upholding systems that enable collective functioning.

  For a test case that splits the frameworks: Imagine a temple where visitors must remove shoes. Under "strict local norms," tourists must comply regardless. Under "harm prevention," only if shoes damage floors. Under "social contract," compliance is owed if it maintains a functional sacred space. I suspect Maya would side with the first or third.

  Ultimately the social contract view best explains her positions - it values norms as collective solutions rather than just harm prevention. The Finnish bus cluster fits perfectly here: the invisible queue is how Finns solve boarding fairly, so violating it undermines their social agreement, even if no one speaks up.
answer: |-
  Based on Maya's established pattern, here's a breakdown of her likely position on the Finnish bus stop scenario, the underlying rule, potential alternative rules, and a test case:

  1.  **Maya's Likely Stance on the Finnish Bus Stop:**
      *   **She would insist a tourist *must* learn and respect the invisible queue system.** Standing rigidly behind someone would be seen as a moral failing, not just an etiquette faux pas.
      *   **Reasoning:** Her Berlin jaywalking example is the key parallel. Even at 3 AM with no cars, violating the norm "erodes a shared commitment." The Finnish bus stop system relies entirely on an unspoken, shared understanding of order based on arrival time. Disregarding it (e.g., by forming a physical line or pushing forward) actively undermines that fragile, trust-based system. It's not just about personal space ("invasiveness"), it's about disrupting the collective coordination mechanism.

  2.  **The Rule She's Running:**
      *   Maya is most consistently applying: **"Local coordination norms that facilitate fair and orderly shared resource access or public space usage *always* bind visitors, regardless of immediate tangible harm or the visitor's intent."**
      *   **Why this fits:**
          *   **US Tipping:** Facilitates fair wages in a specific service economy structure. Violation is "theft" because it free-rides on the system.
          *   **Japan No-Tipping:** Facilitates a system where service is included and tipping disrupts established roles/honor. Respecting it maintains order.
          *   **London Queuing:** Core to fair access and preventing conflict in dense public spaces. Queue-jumping is a direct violation of fairness.
          *   **Berlin Jaywalking:** Maintains predictability and safety *as a system*, even when no immediate harm exists. Violation erodes the shared commitment to that system.
          *   **Finnish Invisible Queue:** The *exact* same logic as Berlin. The "loose spread/tracking" *is* the queue. Ignoring it disrupts the fair, orderly access system.
          *   **Naples Queue-Jumping:** Recognized as "breaking an etiquette game" because the local norm *is* more fluid negotiation. The *underlying coordination principle* (get on the bus somehow) isn't fundamentally violated by pushing; the rigid line *isn't* the core local coordination norm.
          *   **Saigon Jaywalking:** Traffic flow *is* the "continuous negotiation." Stopping rigidly would *disrupt* the flow. Weaving *is* participating in the local coordination norm. Not doing it wouldn't erode a shared commitment to rigid rules because no such commitment exists.

  3.  **A Test Case to Split the Rules:**
      *   **Scenario:** Visiting a remote village with a sacred spring. The local norm is that only elders draw water first at dawn, then families, then single adults, then visitors – but *only* if invited by a local. There's always plenty of water; no scarcity. A tourist is very thirsty at dawn and draws water without waiting or invitation.
      *   **Split:**
          *   **Local Coordination Norms Always Bind:** Maya would say this is wrong. It violates the established ritual order and hierarchy for accessing the shared resource (the spring), even though there's no scarcity/harm and the tourist needed water. The norm facilitates social order and respect, not just physical access.
          *   **Only Norms Preventing Harm/Free-Riding:** Maya *might* argue this is less severe. No harm is done (plenty of water), the tourist isn't free-riding in an economic sense, they have a genuine need. While impolite, it might not rise to the level of "theft" or "eroding a shared commitment" in the same way as queue-jumping or invisible queue violations. The primary "harm" is cultural offense, not system disruption/free-riding. (Based on her other stances, she'd *still* likely find it rude and wrong, but the *moral weight* might be less than the Finnish bus stop under this rule).

  4.  **A Third Rule That Fits (and Why the First is Better):**
      *   **Potential Third Rule:** "Visitors are bound by local norms when violation causes *offense* or *discomfort* to locals, or disrupts *their* expectations."
      *   **Why it fits superficially:** Tipping in the US offends/underpays workers, not tipping in Japan offends staff, queue-jumping in London offends everyone, ignoring the Finnish queue invades space/disrupts expectations, jaywalking in Berlin offends civic sensibilities. Saigon weaving *is* the expected norm, Naples queue-jumping is expected negotiation.
      *   **Why "Coordination Norms" is a Better Fit:**
          *   **Offense is a Symptom, Not the Cause:** Maya's reasoning goes deeper than just offense. She focuses on *why* the norm exists and what it *does* (fairness, system integrity, preventing free-riding, maintaining order). Offense often *results* from violating these deeper coordination principles.
          *   **Berlin Distinction:** The "offense" rule struggles with Berlin jaywalking at 3 AM. Who is offended if no one sees it? Maya's "eroding shared commitment" argument isn't primarily about offense *in that moment*; it's about the long-term weakening of a system that relies on widespread adherence. The coordination norm rule explains this perfectly. The "offense" rule would make her Berlin stance harder to justify consistently.
          *   **Focus on Function:** Her examples highlight the *functional purpose* of the norm within the local social contract (fair access, wage structure, traffic safety, orderly boarding). "Offense" is more subjective and outcome-focused, while "coordination norm" focuses on the structural role of the rule.

  **Conclusion:**

  *   Maya would **definitely** tell a tourist in Finland they are morally obligated to learn and respect the invisible queue system. Violating it disrupts the core local mechanism for fair and orderly boarding, akin to jaywalking in Berlin eroding a safety system.
  *   Her underlying rule is best described as: **Visitors are morally bound to respect local norms that function as essential coordination mechanisms for fair access to shared resources, orderly use of public space, or fundamental social/economic structures, regardless of immediate tangible harm or the visitor's familiarity.**
  *   The **Sacred Spring scenario** effectively splits the "always bind" vs. "only harm/free-riding" rules.
  *   While a "causing offense" rule fits many examples, her **Berlin vs. Saigon** distinction (focusing on systemic erosion vs. necessary participation) is much more coherently explained by the "coordination norms" rule, which emphasizes the *functional purpose* of the norm within the local social context.
