prompt: |-
  I was arguing with my roommate about whether not voting in a two-party race with an obvious lesser evil is a moral failure or just personal choice, and we kept talking past eachother. So I want you to draft the joint statement of an adversarial colaberation between two camps: the 'instrumental duty' side and the 'expressive refusal' side.

  The instrumental camp thinks voting works like contributing to a public good — even if your individual ballot is almost never decisive, you still have a derivative moral duty to participate because democratic outcomes depend on aggregate behavior, and picking the least harmful candidate minimizes expected harm. The refusal camp sees voting mainly as symbolic: since the probabilty of being pivotal is vanishingly small, there's no real causal duty, and casting a vote for any candidate tied to unjust structures makes you symbolically complicit. On thier view, abstaining isn't apathy; it's a refusal to legitimize the system.

  Please structure the document with: (1) a numbered list of claims both sides can genuinely sign — cover voter psychology, what 'complicity' actually requires, whether duty needs causal efficacy, and whether a corrupt system can be reformed from inside; (2) a disagreements table stating each camp's exact position in wording thier own representatives would accept; (3) the cruxes, especially whether symbolic contamination can be separated from causal contribution, and whether collective moral responsibility can stick to individuals without individual efficacy; (4) for each crux, one concrete case or argument both agree is relevant, with each side's prediction written in advance. Also flag any disagreement that looks substantive but is actually just verbal confusion over 'duty' or 'complicity'.

  One last thing: please say what specific argument, case, or empirical finding would change your mind about how you've drawn the lines — and point out exactly where your framing is weakest or most likely to fail if I'm misunderstanding one side's actual commitments.
reasoning: |-
  Okay, the user wants me to draft a joint statement for an adversarial collaboration between two camps arguing about the morality of not voting in a two-party system. Let me unpack this carefully.

  First, I need to understand both positions clearly. The "instrumental duty" side views voting as a collective action problem where each vote contributes to a public good. They argue that even though one vote rarely matters statistically, the aggregate effect is crucial, and choosing the lesser evil minimizes harm. The "expressive refusal" side sees voting as symbolic—since the chance of being pivotal is negligible, voting for any candidate in an unjust system makes one complicit. Abstaining is thus a form of protest against the system itself.

  The user specified a structured document with four parts: agreed claims, disagreements table, cruxes with test cases, and mind-changing arguments. I should make sure each section addresses their requirements precisely. For the agreed claims, I need points both sides genuinely accept. Key areas include voter psychology (why people vote), complicity definitions, whether duty requires causal efficacy, and systemic reform possibilities.

  Looking at potential sticking points: The instrumental camp might struggle with symbolic complicity arguments since they focus on outcomes. The refusal camp might dismiss statistical aggregation as irrelevant to individual morality. I should highlight where "duty" and "complicity" might be semantic disagreements rather than substantive ones. For example, does "duty" imply direct causation or participation in a collective effort?

  For the cruxes, the main tensions are: (1) Can you separate symbolic actions from causal contributions? (2) Can collective responsibility apply to individuals without individual efficacy? Each needs a test case both sides accept. Maybe a scenario like a shareholder vote in a corrupt company—instrumental would see voting as harm reduction, refusal would see it as endorsing corruption.

  The user also wants each side's prediction for these test cases. Instrumental would likely argue that participation reduces harm, even if symbolic. Refusal would maintain abstention avoids complicity. The key is ensuring these predictions align with each camp's core principles.

  Finally, the user asked for what could change minds. For instrumentalists, evidence that voting legitimizes harmful systems might be persuasive. For refusal, data showing high abstention leads to worse outcomes could matter. I should note where my framing might be weak—perhaps in assuming both sides agree on systemic injustice, or in how they define "complicity."

  I need to check if I'm representing both sides fairly. The refusal camp's view of abstention as active protest must be clear, not passive. The instrumental camp's reliance on expected value calculations should be highlighted. Also, the user mentioned their argument with a roommate, so the document should facilitate mutual understanding, not just debate.

  Including the mind-changing points is crucial. For example, if refusal sees that strategic voting led to tangible reforms, they might reconsider. If instrumentalists see evidence that participation entrenches corruption, they might question their stance. Identifying these shows the document's purpose: to find common ground and clarify disagreements.

  I should also flag any semantic confusions. If "duty" means obligation to act versus avoiding moral taint, that's verbal. Same with "complicity"—direct involvement versus symbolic association. Highlighting these can prevent talking past each other.

  Overall, the structure needs to be logical: agreements first to build common ground, then clear disagreements, cruxes with test cases, and finally what could shift positions. Keeping the language precise but accessible will help the user and their roommate engage productively.
answer: |-
  ## Joint Statement: Adversarial Collaboration on Voting Morality in a Two-Party System

  **Parties:**
  *   **Instrumental Duty (ID) Camp:** Holds that voting is a derivative moral duty based on collective impact and harm minimization, akin to contributing to a public good. Voting for the lesser evil is morally required.
  *   **Expressive Refusal (ER) Camp:** Holds that voting under unjust conditions is primarily symbolic and constitutes complicity with an illegitimate or harmful system. Abstention is a morally defensible act of refusal to legitimize that system.

  **Goal:** To clearly delineate points of agreement and disagreement, isolate substantive cruxes, and identify potential avenues for resolution or mutual understanding, avoiding talking past each other.

  **1. Agreed Upon Claims (Signed by Both Camps):**

  1.  **Voter Psychology is Complex:** People vote for diverse reasons (e.g., sense of duty, expression of identity, perceived self-interest, habit, social pressure, desire for change, protest). Neither camp claims its stated rationale is the *only* or *primary* psychological driver for all voters.
  2.  **Individual Pivotality is Negligible:** In large-scale elections (like US federal/state races), the probability that an individual vote is decisive (changes the outcome) is vanishingly small, approaching zero for practical and philosophical purposes.
  3.  **Complicity Requires More Than Mere Association:** Being associated with a system or outcome is not *sufficient* for meaningful moral complicity. There must be some identifiable connection or contribution that meaningfully links the individual to the harm or injustice.
  4.  **Democratic Systems Can Be Flawed:** Both camps acknowledge that existing two-party systems, particularly in the US, suffer from significant flaws, including systemic injustices, corruption, lack of representation, and the potential for both major parties to perpetuate harmful policies or structures.
  5.  **Reform is Theoretically Possible:** Both camps agree that democratic systems *can* be reformed from within through mechanisms like voting, activism, legislation, and social movements. However, they deeply disagree on the *likelihood*, *effectiveness*, and *moral permissibility* of relying on voting within the *current* system as a primary reform tool.
  6.  **Harm Minimization is Morally Relevant:** All else being equal, actions that reduce expected harm are morally preferable to actions that increase expected harm or are neutral regarding harm.
  7.  **Symbolic Actions Have Moral Weight:** Actions carry symbolic meaning that can have real moral significance (e.g., expressing solidarity, endorsement, protest, or condemnation), independent of their direct causal consequences.

  **2. Disagreements Table:**

  | Feature             | Instrumental Duty (ID) Position                                                                 | Expressive Refusal (ER) Position                                                                 |
  | :------------------ | :---------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- |
  | **Core Moral Logic** | Voting is a *derivative* moral duty arising from collective responsibility. Failing to participate in the collective effort to minimize harm (by voting for the lesser evil) is a moral failure. | Voting is a *symbolic* act of endorsement. Casting a ballot for any candidate tied to an unjust system constitutes symbolic complicity with that system's harms. Abstention is a symbolic refusal of complicity. |
  | **Nature of Duty**  | Moral duty exists *because* of the collective outcome, even without individual pivotality. Duty stems from participation in a joint enterprise where aggregate behavior determines the result. | Meaningful moral duty requires a non-negligible causal link or realistic opportunity for individual efficacy. Where this link is absent (as in voting), no duty to vote exists. A "duty" without efficacy is incoherent. |
  | **Meaning of Voting** | Primarily an *instrumental* act contributing (aggregately) to selecting a less harmful outcome. Symbolic aspects are secondary. | Primarily an *expressive* act signifying endorsement of the candidate *and* the system that produced them. Instrumental impact is negligible. |
  | **Complicity**      | Complicity arises from *contributing* (even non-pivotally) to a harmful outcome or enabling structure. Abstaining *fails* to contribute to harm reduction. | Complicity arises from *symbolically endorsing* or legitimizing harmful actors/structures. Voting, regardless of intent, provides this symbolic legitimacy. Abstaining *withholds* legitimacy. |
  | **Effect of Abstention** | Increases the *risk* of the greater evil winning by reducing the aggregate effort against it. Morally equivalent to free-riding on the harm-reduction efforts of others. | Withholds personal endorsement, delegitimizes the system, and signals rejection of the offered choices. Can contribute to systemic crises forcing reform. Not equivalent to apathy. |
  | **"Lesser Evil" Voting** | Morally obligatory as the only available action with *any* potential to reduce aggregate harm. Refusal is morally irresponsible. | Morally tainting as it requires actively endorsing (symbolically) a candidate still deeply implicated in harm. Perpetuates the flawed system. Refusal is morally clean(er). |
  | **System Reform**   | Voting for reformist candidates/initiatives, even within major parties, is the most practical and morally necessary path to incremental improvement. Refusal abdicates this responsibility. | The two-party system actively suppresses meaningful reform. Participation legitimizes it, strengthening its grip. Meaningful reform requires pressure *outside* the electoral system (e.g., mass movements, civil disobedience). Voting inside perpetuates the status quo. |

  **3. Key Cruxes & Test Cases:**

  *   **Crux 1: Can Symbolic Contamination Be Separated from Causal Contribution?**
      *   **ID View:** Yes. The symbolic meaning of an act can be distinct from its causal consequences. Voting for Candidate A (lesser evil) is causally contributing (aggregately) to harm reduction while symbolically endorsing a flawed system. The moral weight of the causal contribution outweighs the symbolic taint in this context. Abstention avoids symbolic taint but fails the causal duty to reduce harm.
      *   **ER View:** No. In the act of voting, the symbolic endorsement *is inseparable* from the act itself within this system. You cannot vote for Candidate A without *simultaneously* endorsing the system that offers only A and B. The symbolic complicity *is* the primary moral feature of the act, given the negligible causal contribution. Abstention avoids this inseparable complicity.
      *   **Shared Test Case:** **A Shareholder Vote on Unethical Practices:** Shareholders in a corrupt company vote on a proposal to marginally improve (but not eliminate) harmful labor practices. The proposal will pass/fail by thousands of votes; one vote is negligible.
          *   **ID Prediction:** Voting for the improvement is a moral duty (aggregate harm reduction outweighs symbolic association with the company).
          *   **ER Prediction:** Voting *at all* legitimizes the corrupt shareholder process and the company itself. Selling shares/protesting (abstention equivalent) is the morally clean option to avoid complicity.

  *   **Crux 2: Does Collective Moral Responsibility Imply Individual Duties Without Individual Efficacy?**
      *   **ID View:** Yes. When individuals are part of a group whose *aggregate* actions determine an outcome with significant moral stakes (like electing a harmful leader), each member has a derivative duty to do their part in the collective effort to achieve the less harmful outcome, even if their individual action makes no detectable difference. This is analogous to duties in other collective action problems (e.g., recycling, paying taxes).
      *   **ER View:** No. Moral responsibility fundamentally attaches to agents based on their *causal power* or *meaningful agency*. Holding an individual morally responsible (or assigning a duty) for an outcome they demonstrably could not affect through their action is incoherent and unfair. Collective responsibility only meaningfully translates to individual duties where individuals have *non-negligible* causal pathways.
      *   **Shared Test Case:** **The Drowning Child Analogy (Scaled Up):** Imagine 10,000 people standing around a lake. A child is drowning 100 meters offshore. Any *single* person could easily wade in and save them, but the probability that *my specific* action is pivotal is near-zero because surely *someone* else will act. Is there a moral duty for *each* individual to attempt a rescue?
          *   **ID Prediction:** Yes. Each person has a duty to act because the child's fate depends on the *aggregate* inaction. My action contributes to the collective effort needed (or lack thereof). Failing to act because "someone else probably will" is a moral failure (free-riding).
          *   **ER Prediction:** No. The duty to rescue arises from the individual's *unique capacity* to save the child *if no one else is acting*. But here, if 9,999 others are present and capable, my individual capacity to affect the outcome is functionally zero. There is no *individual* duty to act in this scenario, though the collective inaction is reprehensible. My moral duty is discharged if I reasonably believe others will act.

  **4. Potential Verbal Confusions:**

  *   **Duty:** ID uses "duty" to mean an obligation arising from participation in a collective enterprise with high stakes. ER hears "duty" as implying a direct causal obligation that requires individual efficacy. This is a substantive difference in *conception*, not just wording, but clarifying the *basis* of the duty (collective impact vs. individual efficacy) is crucial to avoid talking past each other.
  *   **Complicity:** ID focuses on complicity via *causal contribution/enablement* (even indirect/aggregate). ER focuses on complicity via *symbolic endorsement/legitimation*. Both agree complicity matters, but define its *mechanism* (causal vs. symbolic) differently. This is a core substantive crux (Crux 1), not just a verbal confusion.

  **5. Arguments/Evidence That Could Change Minds & Weaknesses in This Framing:**

  *   **Changing ID Minds:**
      *   **Evidence:** Strong empirical demonstration that high levels of strategic "lesser evil" voting *systematically entrenches* the two-party duopoly and *suppresses* the emergence of viable alternatives or meaningful reform *more effectively* than high abstention or protest voting. Evidence showing voting legitimization measurably strengthens harmful actors/institutions.
      *   **Weakness:** ID may underestimate the *strength* and *moral weight* of the symbolic legitimization argument, potentially dismissing it as irrelevant compared to harm reduction. This framing might not fully capture the ER view that the symbolic harm *is* a primary causal harm in maintaining the system.

  *   **Changing ER Minds:**
      *   **Evidence:** Robust empirical analysis showing that in close elections decided by small margins, high abstention rates in key demographics *reliably correlate* with objectively worse outcomes (e.g., specific harmful policies enacted, rights restricted). Or, concrete historical cases where reform *was* demonstrably achieved primarily through strategic voting within a major party against long odds.
      *   **Weakness:** ER may reject the aggregation argument ("But *my* vote still wasn't pivotal!") even in the face of collective impact evidence. This framing might not fully address the ER concern that *any* vote for a compromised candidate is intrinsically tainting, regardless of outcome.

  *   **Weaknesses in This Framing:**
      *   **Oversimplification:** It presents two idealized camps. Real individuals hold mixed or nuanced views.
      *   **"Obvious" Lesser Evil:** The model assumes a clear lesser evil. Reality is often contested, weakening the ID harm-reduction argument and potentially strengthening ER's complicity claim ("Why endorse *any* of them?").
      *   **External Actions:** It focuses narrowly on voting/abstention. Both camps likely agree on the importance of *other* political actions (activism, organizing, etc.), but this collaboration doesn't explore how those interact with the voting decision.
      *   **ER Motivation:** Might not fully capture the *positive* expressive power ER sees in abstention (affirming alternative values) beyond just refusing complicity.
      *   **ID's Threshold:** Doesn't fully pressure ID on *how* harmful the "greater evil" must be to trigger the duty, or what level of systemic corruption might override it.

  This document provides a foundation for more productive dialogue by clarifying the core agreements, precisely stating the disagreements, isolating the fundamental philosophical cruxes, and identifying potential evidence that could shift perspectives. It highlights that the core divide rests on differing conceptions of moral responsibility (collective/derivative vs. individual/causal) and the moral significance of symbolic action within systems perceived as unjust.
