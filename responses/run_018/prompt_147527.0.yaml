  ## Villanelle of the Unbalanced Ledger

  The bus token gleams, cold metal start,
  To shift the boxes, stack the shelves so high.
  **The paper that says I am worthy** (part
  By part assembled, signed beneath the sigh).
  The ink pad stamps approval, then departs.

  The time card punched at dawn, a weary art,
  Records the minutes sold beneath the sky.
  **The hours that pay for my hunger**, smart
  Against the palm, a wage that cannot buy
  The peace the case-file mark could soon restart.

  The plastic chair, the questions sharp and tart,
  The proving of the need they won't deny.
  **The paper that says I am worthy** (heart
  A ledger where my suffering's held, piled high
  As credit earned, though debts tear me apart).

  The stomach's hollow echoes, counterpart
  To the clock's hard hunger, ticking by.
  **The hours that pay for my hunger**, chart
  A deficit no labor satisfies.
  The earned relief? A temporary art.

  They grant the stamp, a temporary chart,
  Then point to forms where new demands apply.
  **The paper that says I am worthy** sparks a dart
  Of fresh suspicion in the caseworker's eye.
  **The hours that pay for my hunger** restart.

  ---

  **Notes on the Workfare Villanelle:**

  *   **Form Adherence:** Nineteen lines, ABA rhyme scheme (start/part/depart...), with Refrain 1 (A1) and Refrain 2 (A2) alternating and culminating together in the final quatrain.
  *   **Refrains & Meaning:**
      *   *"The paper that says I am worthy"* embodies the constant, cyclical demand for proof (applications, reassessments, verification forms).
      *   *"The hours that pay for my hunger"* captures the labor extracted as repayment for the basic need being met, framing sustenance as a debt.
      *   The final couplet places them together: obtaining the proof ("worthy") is immediately followed by restarting the labor ("pay for my hunger"), demonstrating the endless loop. The period after "hunger" emphasizes finality and exhaustion.
  *   **Concrete Imagery:** Bus tokens, time cards, stacked boxes, ink pads, case-file stamps, plastic chairs – these tangible objects ground the abstract machinery of control and scrutiny.
  *   **Bookkeeping Metaphor:** Suffering is "credit earned" (line 13), labor is "wage that cannot buy" peace (line 8), relief is "temporary" (line 18), and the entire process is a "ledger" (line 13) that *never* balances ("deficits tear me apart" - line 14, "deficit no labor satisfies" - line 17).
  *   **Tone & Perspective:** The voice is weary, resigned, observant. It avoids overt anger or preaching, focusing on the speaker's lived, exhausting reality within the system. The machinery is made "visible" through specific details and "strange" through the relentless, illogical cycle revealed by the form itself.
  *   **The Turning:** The tercets build the feeling of repetitive labor and scrutiny. The penultimate tercet (lines 15-17) explicitly states the inherent deficit. The final quatrain delivers the crushing turn: the hard-won proof *triggers* the restart ("sparks... fresh suspicion" leading directly to "restart"), proving satisfaction breeds new demands.
