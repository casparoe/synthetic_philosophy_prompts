  Below is a comprehensive 90-minute in-class activity designed to immerse students in the nested logical structure of Buridan's ass. The exercise forces confrontation with symmetry at two levels (first-order action and second-order rule application) while testing whether diachronic consistency can resolve arbitrariness. Payoff is tracked via points (no real money), and roles ensure disciplined symmetry maintenance.

  ---

  ### **Activity: The Double-Bind Donation Dilemma**  
  **Core Structure**:  
  - **First-order symmetry**: Choose between two morally/practically identical charitable actions (A/B).  
  - **Nested second-order symmetry**: The tie-breaking rule (e.g., "choose the option first mentioned") has two equally valid interpretations, forcing a choice between consistency and arbitrariness.  

  **Learning Objectives**:  
  1. Experience symmetry-induced paralysis absent hidden preferences.  
  2. Test tie-breaking mechanisms (randomization, temporal priority, meta-preferences).  
  3. Evaluate whether agency is preserved or arbitrariness is relocated.  

  ---

  ### **Roles & Rules**  
  *12 students split into 3 groups of 4. Each group has:*  
  1. **Deliberator (1 per group)**: Makes final choices. Must justify decisions without invoking asymmetry.  
  2. **Symmetry-Checker (1 per group)**: Vetoes any asymmetric reasoning (e.g., "Charity A *feels* better"). Records violations.  
  3. **Record-Keeper (1 per group)**: Logs reasoning, points, and time.  
  4. **Meta-Evaluator (1 per group)**: In Stage 2, scrutinizes whether consistency claims mask arbitrariness.  

  **Payoff Scheme** (Hypothetical points):  
  - **Stage 1**: +10 pts for timely donation choice; −5 pts per symmetry violation.  
  - **Stage 2**: +15 pts for choosing a rule interpretation; −10 pts if arbitrariness is relocated.  
  - **Bonus**: +5 pts if the group achieves "non-arbitrary agency" (validated in debrief).  

  ---

  ### **Stage Descriptions**  
  #### **Stage 1: First-Order Symmetry (40 min)**  
  **Scenario**:  
  > *Your group must donate $1M to **one** of two charities:*  
  > - **Charity A**: Saves 10,000 lives from malaria in Nation X.  
  > - **Charity B**: Saves 10,000 lives from cholera in Nation Y.  
  > *Nations X/Y are identical in wealth, need, and geopolitical impact. Deliberators must not "invent" differences (e.g., "malaria is worse").*  

  **Mechanism**:  
  Groups break symmetry using **one** of these methods (assigned by instructor):  
  - **Randomization**: Flip a coin (heads = A, tails = B).  
  - **Temporal Priority**: Choose the option *first mentioned in the description*.  
  - **Meta-Preference**: Vote on a higher-order criterion (e.g., "prevent faster-spreading diseases").  

  **Symmetry Trap**:  
  All methods are secretly symmetric:  
  - Randomization assumes a fair coin (but assignment of heads/tails to A/B is arbitrary).  
  - Temporal Priority assumes "first mentioned" is unambiguous (but the description order is arbitrary).  
  - Meta-Preference assumes criterion asymmetry (but criteria are equally applicable to both).  

  **Outcome**:  
  Groups donate to A or B, earning points if symmetry is maintained.  

  #### **Stage 2: Second-Order Symmetry (40 min)**  
  **Scenario**:  
  > *Your group must adopt a **binding rule** for future symmetric dilemmas. You used [Method] in Stage 1. Now interpret it:*  
  > - If you used **Randomization**: *Does "heads = A" imply "heads always = first option" (Rule 1) or "heads always = second option" (Rule 2)?*  
  > - If you used **Temporal Priority**: *Does "first mentioned" mean "first in the text" (Rule 1) or "first in alphabetical order" (Rule 2)?*  
  > - If you used **Meta-Preference**: *Does your criterion prioritize "speed" (Rule 1) or "scope" (Rule 2)?*  

  **Symmetry Trap**:  
  Rule 1 and Rule 2 are logically interchangeable (e.g., both equally define "first"). Groups must choose **one** interpretation.  

  **Pressure Test**:  
  - **Consistency Claim**: If groups cite past use (e.g., "We used Rule 1 before") to justify their choice, Meta-Evaluators flag whether this relocates arbitrariness to the initial choice.  
  - **Failure = Relocated Arbitrariness**: Using randomization/temporal priority *again* to interpret the rule creates infinite regress.  

  **Outcome**:  
  Groups finalize a rule interpretation, earning points if arbitrariness is not relocated.  

  ---

  ### **Timeline (90 min)**  
  | Time      | Activity                                                                                                | Instructor Notes                                                                                  |  
  |-----------|---------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|  
  | 0:00-0:05 | **Setup**: Split groups, assign roles, distribute rules/payoff scheme.                                 | Stress: "No asymmetry in reasoning. Violations cost points."                                      |  
  | 0:05-0:20 | **Stage 1a - Discover Symmetry**: Groups deliberate Charity A vs. B.                                    | Circulate, challenge hidden preferences (e.g., "Why is malaria ‘better’?").                       |  
  | 0:20-0:35 | **Stage 1b - Apply Tie-Breaker**: Groups use assigned mechanism to choose A or B.                       | Ensure symmetry-checkers veto asymmetric justifications. Record-keepers log points.               |  
  | 0:35-0:40 | **Transition**: Collect Stage 1 choices. Announce: "Your rule has a hidden ambiguity."                 | Highlight arbitrariness in mechanisms (e.g., "Why heads=A?").                                     |  
  | 0:40-0:55 | **Stage 2a - Uncover Nested Symmetry**: Groups confront ambiguous rule interpretations (Rule 1 vs. 2). | Meta-Evaluators note if consistency claims rely on Stage 1’s arbitrariness.                       |  
  | 0:55-1:15 | **Stage 2b - Pressure Test**: Groups choose Rule 1 or 2. Meta-Evaluators argue if agency is preserved. | Push: "Does ‘consistency’ justify anything, or is it arbitrary?"                                 |  
  | 1:15-1:25 | **Group Reports**: Each group shares choices, reasoning, and symmetry violations.                       | Track methods: How many used consistency? Randomization again?                                    |  
  | 1:25-1:30 | **Final Scoring**: Tally points. Announce "winners," but reveal all groups relocated arbitrariness.    | Underscore: "No one escaped the double-bind."                                                     |  

  ---

  ### **Debrief Framework (Map to Concepts)**  
  1. **Symmetry of First-Order Reasons** (5 min):  
     - *Stage 1*: Identical value of A/B exposed paralysis without tie-breakers.  
     - Q: "Did randomization/temporal priority feel like ‘giving up’ on reason?"  

  2. **Absence of Preference** (5 min):  
     - Symmetry-checkers report violations (e.g., "Someone argued cholera is worse").  
     - Q: "How did hidden biases ‘sneak in’ despite rules?"  

  3. **Tie-Breaking Mechanisms** (5 min):  
     - Groups share methods. Highlight:  
       - Randomization: Arbitrariness in coin assignment.  
       - Temporal Priority: Arbitrariness in "first" definition.  
       - Meta-Preference: Arbitrariness in criterion selection.  

  4. **Agency vs. Relocated Arbitrariness** (10 min):  
     - *Stage 2*: Consistency claims (e.g., "We did Rule 1 before") analyzed.  
     - Key Insight: **Diachronic consistency fails**—it inherits arbitrariness from the initial choice.  
     - Q: "Is consistency part of rational agency, or a mask for arbitrariness?"  

  5. **Conceptual Anatomy**:  
     - Buridan’s core: Symmetry → No preference → Paralysis.  
     - This activity: Symmetry → Tie-breaker → Nested symmetry → Arbitrariness relocated.  

  ---

  ### **Critical Notes**  
  1. **What the Activity Cannot Reproduce**:  
     - Buridan’s ass starves due to **total absence of tie-breakers**. Here, groups *must* use mechanisms (by design), so paralysis is circumvented. **Supply in discussion**: "True Buridan paralysis requires no default mechanism—how might that change the psychology of choice?"  

  2. **Likely Failure Mode in First Run**:  
     - **Stage 1 Symmetry Collapse**: Groups "invent" differences (e.g., "malaria spreads faster") despite identical descriptions. **Mitigation**: Strict symmetry-checkers and point penalties.  

  3. **Nested Symmetry Advantage**:  
     - Forces confrontation with **meta-arbitrariness**. Students see randomization/consistency as *pragmatic* but not *rational* solutions, deepening the textbook case.  

  ---

  **Materials**: Coins, rule cards, timers, point-tracking sheets.  
  **Outcome**: Students experience arbitrariness as an inescapable feature of symmetric choice, priming advanced discussions (e.g., Sartrean radical freedom vs. rationalist agency).
