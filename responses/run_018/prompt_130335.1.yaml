  First, I need to break down both concepts. Chesterton's fence is about not removing existing structures without understanding their original purpose. It's a conservative principle emphasizing caution. Evolutionary spandrels, on the other hand, are byproducts of adaptation without a designed purpose. The user is questioning if social institutions are more like intentionally built fences or accidental spandrels.

