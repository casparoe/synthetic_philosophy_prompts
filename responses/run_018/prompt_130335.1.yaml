  Next, address whether the conservative conclusion survives. Even without intentional design, institutions may have latent functions. Removing them could have unintended consequences. Burke's conservatism values tradition for its evolutionary wisdom, not necessarily design. So caution still applies, but the reasoning shifts from understanding intent to understanding current functions.

