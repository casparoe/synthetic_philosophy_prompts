prompt: |-
  Act as an expert philosopher of mind with specialist knowledge of teleosemantics and the naturalisation of mental content. Before constructing the procedure, spend a few sentences brainstorming how proper-function analysis, consumer-based accounts, and conditions for misrepresentation can be operationalised for non-specialists without collapsing into behaviourism or intentional-stance pragmatism, and flag where synthetic functional redundancy breaks the evolutionary paradigm.

  I am a PhD student in philosophy of cognitive science serving on an interdisciplinary research-ethics panel that reviews proposals attributing representational content to biological organisms or engineered systems. The panel convenes monthly, has forty-five minutes per proposal, and includes scientists with no philosophical training. We need a reusable decision procedure—an ordered checklist with decision nodes—to determine whether attributing a specific representation (e.g., that system S represents 'predator presence') is justified on teleosemantic grounds.

  Write the procedure with these specifications:
  - For each step, state what evidence is sufficient, what answer yields a negative verdict, and what answer forces a value judgement rather than a factual determination.
  - Preserve the distinction between proper function, normal conditions, and misrepresentation; do not reduce content to current causal covariance alone.
  - Include explicit instructions for handling engineered systems that possess functional redundancy but lack an evolutionary selection history—this is the hard case our guidelines currently fail on.
  - Provide a small battery of four-sentence test scenarios reviewers can apply rapidly.
  - Then apply the procedure to three proposals:
    1. Attributing a 'food-source' representation to a foraging ant's pheromone-trail system.
    2. Attributing a 'threat' representation to a synthetic drone-vision module with triple-redundant feature detectors engineered to replicate avian escape responses but with no evolutionary history.
    3. A case where the procedure grants the attribution yet the result is counter-intuitive; explain precisely what the procedure cannot resolve and why human judgement must take over.

  Clearly flag where the procedure will misfire, particularly with synthetic redundancy, and state its limits. Do not provide bibliographies, reading lists, or citations. Use British spelling and write in a formal, polished register.
reasoning: |-
  Hmm, the user wants me to act as an expert philosopher of mind specializing in teleosemantics and the naturalisation of mental content. They're a PhD student serving on an interdisciplinary research ethics panel that reviews proposals about attributing representational content to biological or engineered systems. They need a reusable decision procedure—basically a checklist—to determine when attributing representations is justified on teleosemantic grounds.

  The panel has scientists without philosophical training, and they need this procedure to be practical for 45-minute reviews. I need to create an ordered checklist with clear decision nodes. For each step, I should specify what evidence is sufficient, what answer leads to a negative verdict, and when it forces a value judgment rather than a factual determination. I must preserve the distinctions between proper function, normal conditions, and misrepresentation without reducing content to mere causal covariance.

  The tricky part is handling engineered systems with functional redundancy but no evolutionary history—this is currently a gap in their guidelines. I also need to include some test scenarios and apply the procedure to three specific proposals.

  I should brainstorm how to operationalise key concepts like proper-function analysis, consumer-based accounts, and misrepresentation conditions for non-specialists. I need to avoid collapsing into behaviourism or intentional-stance pragmatism. I should flag where synthetic functional redundancy breaks the evolutionary paradigm—that is, when engineered redundancy lacks the historical selection that gives teleosemantic content its normative force.

  For the procedure itself, I'll structure it as an ordered checklist with clear flow. Key steps should include establishing selection history, identifying stabilization, determining consumers and proper functions, defining normal conditions, and ensuring misrepresentation is possible. I'll explicitly address synthetic systems in Step 1C, pointing out that without evolutionary history, the attribution relies on value judgments about design intentions rather than natural selection.

  I'll provide four test scenarios to help reviewers practice applying the concepts quickly. Then I'll apply the procedure to the three proposals: the foraging ant (which should pass), the synthetic drone (which fails on evolutionary history but might pass if we accept design equivalence), and a counter-intuitive case (like immune systems representing 'self').

  I should clearly state where the procedure might misfire, especially with synthetic redundancy, and explain its limits regarding normativity without history. The output should be formal, use British spelling, and avoid citations.
answer: |-
  ## Teleosemantic Content Attribution Decision Procedure (v1.0)

  **Brainstorming Key Concepts:**
  *   **Proper-Function Analysis:** Focus on *what the mechanism was selected/designed to do*. Evidence comes from evolutionary history (biological) or design specifications/intended purpose (engineered). Avoid reducing this to current behaviour; it requires a stabilising history.
  *   **Consumer-Based Accounts:** Identify the *downstream systems* that use the state/behaviour produced by the putative representation. Their proper function determines what information the state *needs* to carry to fulfil *their* role. This anchors content beyond mere covariance.
  *   **Misrepresentation Conditions:** Require the possibility of the mechanism producing the state *in the absence of the condition it supposedly represents*, yet being *used by consumers as if that condition were present*. This necessitates clear "normal conditions" where the mechanism functions reliably.
  *   **Avoiding Pitfalls:** Resist defining content solely by current stimulus-response patterns (behaviourism) or by the attributor's predictive convenience (intentional stance). Synthetic redundancy breaks the evolutionary paradigm by lacking the historical *selection* for a specific function; the redundancy serves engineering reliability, not a teleosemantic norm derived from differential survival/reproduction.

  **Decision Procedure: Ordered Checklist**

  **Step 1: Selection/Design History**
  *   **Question:** Is there a stabilising history (evolutionary selection or deliberate design) that explains the existence and form of the mechanism producing the state (M)?
  *   **Sufficient Evidence:** Phylogenetic data, genetic studies, comparative biology (biological). Design documents, functional specifications, explicit engineering goals (engineered).
  *   **Negative Verdict:** If M appears adventitious, an evolutionary spandrel, or an unintended artifact with no stabilising history for its current role. *[Proceed to Step 1A if Biological, Step 1B if Engineered]*
  *   **Value Judgement:** None (Primarily factual, though interpretation may be needed).

  **Step 1A: Biological Stabilisation (If applicable)**
  *   **Question:** Did differential survival/reproduction favour ancestral variants of M *because* M co-varied with a specific condition (C) and this co-variance contributed to fitness?
  *   **Sufficient Evidence:** Evidence linking M's operation to fitness outcomes under ancestral/relevant environmental pressures.
  *   **Negative Verdict:** If evidence suggests M was stabilised for reasons unrelated to co-varying with C (e.g., structural constraint, pleiotropy).
  *   **Value Judgement:** None (Primarily factual).

  **Step 1B: Engineered Stabilisation (If applicable)**
  *   **Question:** Was M deliberately created/modified *with the intention* that its state co-varies with a specific condition (C) in order to fulfil a system-level goal?
  *   **Sufficient Evidence:** Design specs, system architecture documents, engineer testimony explicitly linking M's state to C for functional purposes.
  *   **Negative Verdict:** If M's sensitivity to C is coincidental, unintended, or merely a side-effect of another primary design goal.
  *   **Value Judgement:** Low (Requires interpreting design intent, but based on documented evidence).

  **Step 1C: Synthetic Functional Redundancy Handling (Engineered Systems Only)**
  *   **Question:** Does the functional redundancy serve *only* engineering reliability (fault tolerance), or was a *specific* co-variance pattern (M -> C) itself the target of stabilisation via design?
  *   **Sufficient Evidence:** Design specs showing redundancy aimed solely at ensuring *some* state is produced reliably, *regardless* of its specific semantic content. OR Specs showing redundancy was intended specifically to ensure reliable detection/representation *of C*.
  *   **Negative Verdict:** If redundancy is solely for generic state reliability without stabilising the specific M->C link.
  *   **Value Judgement:** **HIGH.** Attributing genuine representational content requires interpreting the *designer's intent* regarding *what* is being detected, not just reliability. *This breaks the evolutionary paradigm; normativity stems from design goals, not natural selection.* **MISFIRE WARNING:** This step is highly vulnerable to conflating reliable correlation (engineered) with teleosemantic content. It relies heavily on interpreting designer intent, which may be ambiguous.

  **Step 2: Consumer Systems & Proper Function**
  *   **Question:** Is there a downstream mechanism or process (the Consumer) whose proper function is activated/guided by the state produced by M?
  *   **Sufficient Evidence:** Causal pathway analysis (biological/engineered) showing M's output triggers/modifies Consumer activity. Biological evidence of evolved integration; engineered evidence of functional interconnection.
  *   **Negative Verdict:** If M's state has no systematic downstream effects on other functional systems, or if effects are merely causal side-effects without functional integration.
  *   **Value Judgement:** Low (Primarily structural/functional analysis).

  **Step 3: Content Determination via Consumer Need**
  *   **Question:** What condition (C) *must* obtain for the Consumer's response to M's state to successfully fulfil the Consumer's *own* proper function (as determined in Step 1/1A/1B)?
  *   **Sufficient Evidence:** Analysis of the conditions under which the Consumer's response, triggered by M's state, reliably achieves its biologically/engineered purpose (e.g., avoiding harm, acquiring resource, maintaining homeostasis).
  *   **Negative Verdict:** If no specific condition C can be identified as necessary for the success of the Consumer's response triggered by M's state.
  *   **Value Judgement:** Moderate (Requires analysis linking environmental conditions to functional success).

  **Step 4: Normal Conditions & Misrepresentation Potential**
  *   **Question 4a (Normal Conditions):** Can reasonably stable environmental conditions be defined where the co-variance (M occurs iff C obtains) is reliable, and the Consumer's response typically succeeds?
  *   **Question 4b (Misrepresentation):** Is it physically possible for M to produce its state *in the absence* of C, under conditions where the Consumer's response (based on that state) would *fail* to fulfil its proper function?
  *   **Sufficient Evidence:** Environmental data, error analysis, known failure modes where M fires falsely and causes maladaptive/ineffective behaviour. (e.g., prey detection system triggered by rustling leaves without a predator).
  *   **Negative Verdict:** If misrepresentation is conceptually or physically impossible (state *always* perfectly correlates with C and/or Consumer response *always* succeeds regardless of M's state).
  *   **Value Judgement:** Moderate for 4a (Defining "normal" can have contextual elements). Low for 4b (Primarily a question of possibility).

  **Overall Verdict:**
  *   **Justified Attribution:** Proceed sequentially. "Yes" through all Steps 1-4 (including relevant sub-steps) for the specific content attribution proposed (e.g., 'predator presence').
  *   **Unjustified Attribution:** "No" at **any** step. Stop procedure.
  *   **Value Judgement Required:** If Step 1C (Engineered Redundancy) is reached and evidence is ambiguous regarding stabilisation of the *specific* M->C link. Panel must explicitly debate and decide if designer intent justifies attributing content despite lack of evolutionary history.

  **Test Scenarios (Rapid Application):**

  1.  **Thermostat:** State: "Room Temp < 20°C". Consumer: Furnace switch. Furnace function: Heat room. *Normal:* Indoor environment. *Misrep:* Faulty sensor triggers furnace in summer. **Verdict:** Justified (Design stabilisation, clear consumer need, misrep possible).
  2.  **Magnetotactic Bacteria:** State: Magnetic field alignment. Consumer: Flagellar motor. Function: Move towards low-oxygen sediment. *Normal:* Aquatic environments with magnetic field & oxygen gradient. *Misrep:* Strong lab magnet directs bacteria upwards into oxygen-rich zone. **Verdict:** Justified (Evolution stabilised co-variance with downward direction).
  3.  **Smoke Alarm (Ionisation Type):** State: "Smoke particles present". Consumer: Alarm siren. Function: Warn of fire. *Normal:* Indoor air. *Misrep:* Steam triggers alarm (false positive). **Verdict:** Justified (Design stabilisation for fire detection, misrep possible).
  4.  **Tree Rings:** State: Wide ring. Proposed Content: "Good growing year". "Consumer": Scientist analysing climate. Function: Infer past climate. *Normal:* None defined. *Misrep:* Impossible – ring width directly caused by growth conditions; scientist's inference success isn't the tree's function. **Verdict:** Unjustified (No stabilising history *for representation*, no integrated consumer within tree).

  **Procedure Application:**

  **Proposal 1: 'Food-source' representation in foraging ant pheromone trail.**
  *   **Step 1:** Yes (Biological). **1A:** Yes (Selection favoured trail-laying upon finding food; co-variance with food location enhances colony fitness).
  *   **Step 2:** Yes (Other ants follow trail).
  *   **Step 3:** C = Presence of exploitable food source at trail end (Consumer ants need food to successfully forage).
  *   **Step 4a:** Yes (Typical foraging terrain).
  *   **Step 4b:** Yes (Trail laid to poor/non-existent food source; ants waste energy following it). **Verdict: Justified Attribution.**

  **Proposal 2: 'Threat' representation in synthetic drone-vision module (triple-redundant, no evolutionary history).**
  *   **Step 1:** Yes (Engineered). **1B:** Presumably Yes (Designed to detect fast-approaching objects like birds of prey).
  *   **Step 1C:** **CRITICAL.** Is redundancy stabilising *threat detection* or just *reliable state output*? Evidence likely shows design intent was reliable threat detection (C = fast-approaching object). *Value Judgement Required.* Assume panel accepts this intent justifies stabilisation.
  *   **Step 2:** Yes (Triggers evasive manoeuvre system).
  *   **Step 3:** C = Presence of an actual collision threat (Evasive manoeuvres only succeed if avoiding a real threat).
  *   **Step 4a:** Yes (Defined operational airspace).
  *   **Step 4b:** Yes (Module misidentifies large bird/shadow as threat, triggering unnecessary evasion). **Verdict: Justified Attribution *only if* panel accepts Step 1C value judgement regarding design intent stabilising the threat content. Otherwise, fails at Step 1C.** **MISFIRE RISK:** High. The redundancy ensures *detector reliability* but doesn't inherently ground *semantic content* without accepting design intent as a substitute for natural selection's normativity.

  **Proposal 3: Counter-Intuitive Case - Immune System 'Self' Representation**
  *   **Attribution Proposal:** T-cell represents 'Self' (via MHC recognition).
  *   **Application:**
      *   **Step 1:** Yes (Biological). **1A:** Yes (Selection favoured tolerance to own cells marked by 'self' MHC).
      *   **Step 2:** Yes (T-cell activation/inaction affects immune response).
      *   **Step 3:** C = *This body's own cells* (The Consumer - immune tolerance/response - only functions correctly if T-cells *don't* attack genuine 'self').
      *   **Step 4a:** Yes (Stable bodily environment).
      *   **Step 4b:** **Problematic.** Misrepresentation would require a T-cell state signalling "self" when encountering *non*-self. But the T-cell's *proper function* is to *not* react to "self" signals. A "self" signal on a pathogen would be *misleading the immune system*, causing tolerance to non-self (failure). This *is* possible (e.g., molecular mimicry). **Verdict: Justified Attribution.**
  *   **Counter-Intuitive Aspect:** Attributing 'self' seems odd; we intuitively think of the immune system detecting 'non-self'. The procedure focuses on the *information needed by the consumer* (the tolerance mechanism) to function correctly, which *is* "self". Misrepresentation occurs when the "self" signal is present on non-self.
  *   **Where Human Judgement Takes Over:** The procedure justifies the attribution based on teleosemantic criteria. However, human judgement is needed to:
      1.  **Resolve Ambiguity:** Does 'self' refer to a *type* (all body cells) or a *token* (this specific body)? The procedure points to the token (this body's cells).
      2.  **Contextual Interpretation:** While technically justified, the panel might question if 'self' is the *most useful* or *intuitive* description compared to 'non-self' detection elsewhere in the system. The procedure doesn't dictate *which* representation to attribute, only whether a proposed one is justified.
      3.  **Conceptual Fit:** Does attributing 'self' align with broader cognitive science concepts of representation, or is it overly liberal? The procedure doesn't resolve this philosophical debate.

  **Procedure Limits & Misfire Warnings:**

  1.  **Synthetic Systems (Step 1C):** The core weakness. Attributing content relies on interpreting *designer intent* as a substitute for evolutionary history. This imports normativity from human purposes, which may be ambiguous or contested. Redundancy aimed solely at signal reliability does *not* stabilise semantic content. **Prone to over-attribution if designer intent is liberally interpreted.**
  2.  **Defining "Normal Conditions" (Step 4a):** Can be context-dependent and somewhat arbitrary. The procedure requires it be defined but doesn't specify rigorous criteria.
  3.  **Grain Problem:** The procedure justifies *a* content attribution (e.g., 'predator') but doesn't specify the precise level of granularity (e.g., 'large moving object', 'Panthera leo', 'immediate threat').
  4.  **Value Judgement Reliance:** Particularly evident in Step 1C for engineered systems and interpreting ambiguous evidence elsewhere. The procedure flags these points but cannot eliminate the need for panel deliberation.
  5.  **Distal vs Proximal Content:** While Step 3 pushes towards distal content (what the consumer *needs* to know), the procedure doesn't fully resolve debates about whether content is determined by the producer's sensitivity or the consumer's need in complex cases.
  6.  **"Swampman" & Novel Systems:** Cannot handle systems completely lacking any stabilising history (biological or designed), even if functionally isomorphic to representational systems. Stays firmly teleosemantic.

  This procedure provides a structured, evidence-based framework grounded in teleosemantic principles. It explicitly flags the critical juncture of synthetic redundancy and requires careful value judgements there, while preserving the core distinctions of proper function, normativity, and misrepresentation essential for robust content attribution beyond simple covariance or behaviourism.
