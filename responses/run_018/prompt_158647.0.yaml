  First, I need to break down the roommate's points. He mentions the inefficacy problem, where one person's contribution is too small to make a difference. He dismisses expected utility with tiny probabilities as a rationalization for virtue. He also separates voting as symbolic, not causal. The user thinks he's conflating direct causation with contribution-based harm and might be strawmanning the expected utility argument.

