  Here's the conceptual map as requested – a no-bullshit list of what a theory of machine understanding *actually* needs to handle to dodge Searle's room and the symbol-grounding trap. Think of the "hard" status items as non-negotiable survival requirements for the theory itself; the "soft" ones are more about elegance or what we'd *like* from a truly human-like understander, but a theory could maybe limp along without fully satisfying them all. Conflicts are noted where they bite.

