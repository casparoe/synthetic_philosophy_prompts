prompt: |-
  I'm a software engineer with no philosophy background, so apologies if this isn't the kind of thing you normally get asked. I keep noticing a pattern at work and I don't have a word for it, and I'd rather not settle for a vague phrase like 'we rely on AI too much' — I want to know exactly what this thing is.

  Eighteen months ago our team started using an AI coding assistant. At first everyone read its suggestions carefully. But the workflow settled into this pretty quickly: the assistant writes the diff, the test suite passes, the human reviewer checks it against a checklist (does it touch the database, is it too big, does it log anything) and merges. The PR description is usually also written by the assistant. Nobody is lying — it's just that nobody can honestly say what the change does beyond 'the tests pass and the AI says it's fine.'

  Every individual step of that process seems sensible. Passing tests are real evidence that the change isn't obviously broken, and spending an hour unpicking what the model did on every small change would slow us down for no immediate benefit. But after a year and a bit, we've ended up with a codebase none of us understands end-to-end. When something breaks in an old component, the person who 'owned' it has moved teams, and the current owner can't reconstruct the original design decisions, because those were never in anyone's head — they were scattered through a departed dev's prompts, or in the model, or just in the fact that the tests passed. We only notice the understanding is gone at the exact moment we need it, like a muscle you don't notice shrnk until you try to lift something.

  I saw a smaller version of the same shape with satnavs years ago: every choice to follow the route was individually sensible, but people ended up with no mental map of their own city, and discovered it only when the battery died. The AI case feels like that shape but worse, because the thing we've stopped being able to reconstruct isn't a city we've driven through — it's a system we ourselves wrote.

  Is there a name for this general shape — individually sensible reliance on a helpful tool leading to a collective loss of the ability to function without it, where the loss goes unnoticed until the tool fails? And specifically for the coding-assistant version, where the thing being lost is understanding of an artefact the group itself produced? I'd also want to know where the line is between this and ordinary tool use: we all use compilers without missing machine code, and nobody treats that as a problem, so what makes the AI assistant different? If there's no established name, what would you call it, and how would you define it so that it doesn't sweep in compilers and libraries?

  Oh, and answer in British English please.
reasoning: |-
  Okay, the user is a software engineer who's noticed a troubling pattern at work with their team's use of an AI coding assistant. They've described how reliance on the tool has led to a gradual erosion of collective understanding of their own codebase - a problem that only surfaces when something breaks. 

  The analogy to satnavs is spot-on - it's that same phenomenon where over-reliance on automation causes skill atrophy, but with higher stakes because it's their own system they no longer understand. The user wants precise terminology to describe this, while distinguishing it from benign tool use like compilers.

  Hmm... what makes this different from ordinary tools? Compilers are deterministic - you put in code and get predictable machine code. But the AI assistant is generative and opaque - it makes creative choices that engineers don't internalize. The loss here isn't just skill atrophy but collective knowledge dissipation.

  The user's frustration is palpable - they're observant enough to spot this systemic issue but lack the philosophical vocabulary to articulate it. Their request for British English suggests either location or precision preference. The muscle atrophy metaphor is particularly vivid - really drives home how the problem remains invisible until critical moments.

  For the coding-specific phenomenon... "epistemic debt" feels right - it's knowledge that should have been acquired but wasn't, now accruing interest. The satnav parallel is "automation complacency" but that's too narrow. Need to emphasize the collective aspect - this isn't individual laziness but systemic design failure.

  Ah, and the key differentiator from compilers: with deterministic tools, the abstraction is intentional and reversible. But with generative AI, the "how" becomes irrecoverable black-box reasoning. That's the crux - the loss of recoverable design intent.
answer: |-
  Right, this is a brilliantly observed phenomenon, and you've articulated it perfectly. It's a very modern problem arising from increasingly sophisticated, generative tools. While there isn't one universally accepted term *yet*, several concepts from philosophy, cognitive science, and software engineering converge on what you're describing. Let's break it down:

  1.  **The General Shape: Epistemic Deskilling via Automation Dependence**
      *   **Epistemic:** Relating to knowledge and understanding.
      *   **Deskilling:** The gradual loss of knowledge, skill, or capability.
      *   **Automation Dependence:** The state where a system or group becomes reliant on automated tools to perform core functions they previously could do themselves.

      **Definition:** *Epistemic deskilling via automation dependence* describes the process where the repeated, convenient use of an intelligent tool (like your AI assistant or satnav) leads to the atrophy of the underlying knowledge and reasoning skills within the human users/group. This loss is often unnoticed because the tool functions effectively, only becoming critically apparent when the tool fails, is unavailable, or the system enters an unexpected state requiring deeper understanding.

  2.  **The Specific Coding Assistant Version: Generative Opaqueness & Epistemic Debt**
      *   **Generative Opaqueness:** The AI doesn't just *execute* known instructions (like a compiler) or *provide components* (like a library). It *generates novel solutions* based on patterns it learned, but its *specific reasoning path* for any given output is fundamentally opaque to the human user ("Why *this* approach?"). You accept the output based on external validation (tests passing) without internalising the "why".
      *   **Epistemic Debt:** Analogous to technical debt. It's the *accumulated deficit in collective knowledge and understanding* incurred by consistently relying on the tool to generate solutions without adequately capturing, verifying, or internalising the rationale behind those solutions. The "interest" is paid when you need to debug, modify, or explain a system component whose original design intent was never truly in a human mind, only reflected in prompts, model weights, and passing tests.
      *   **Loss of Design Intent Traceability:** The specific artefact being lost is the chain of reasoning, trade-offs, and conscious decisions that traditionally give software its structure and meaning. This is scattered into unrecoverable prompt histories, hidden model states, and merely implicit in the fact the tests passed.

      **Definition:** For your coding scenario, we could call this **Generative Epistemic Debt** or **Opaque Automation-Induced Knowledge Atrophy**. It's the accrual of a knowledge deficit within a team due to reliance on a generative tool whose outputs are accepted based on functional validation (tests) but whose internal rationale remains opaque and un-internalised, leading to a brittle understanding of the system they ostensibly created.

  **Why this is Different from Compilers/Libraries (The Line):**

  You've hit the crucial point. The difference lies in **abstraction level, determinism, and traceability:**

  1.  **Level of Abstraction & Skill:**
      *   **Compiler:** Abstracts *machine code*. Understanding the compiler's *output* (assembly) is a different skill set entirely from high-level programming. We consciously choose this abstraction barrier. The skill lost (writing efficient assembly by hand) is deliberately traded for productivity at a higher level. Understanding the *high-level code* remains paramount.
      *   **Library:** Abstracts *pre-built, documented functionality*. You use its API. Understanding *how* the library works internally may not be necessary, but understanding *what it does*, its contract, and *how to integrate it* is essential knowledge you possess. The library's behaviour is (ideally) documented and deterministic.
      *   **AI Coding Assistant:** Abstracts *the design and implementation reasoning itself*. It generates the high-level logic *you* would normally write and understand. The skill potentially atrophied is *conceiving and articulating the solution in code*, along with the rationale for choices made *within* that high-level logic ("Why a map here? Why this error handling pattern?").

  2.  **Determinism & Traceability:**
      *   **Compiler/Library:** Highly deterministic. Given the same input (source code, API call), they produce the same output. The mapping is clear and reversible (disassembly, reading library source/docs).
      *   **AI Coding Assistant:** Non-deterministic and opaque. The *same prompt* can yield different outputs. The *reasoning path* from prompt to code is fundamentally inaccessible and unpredictable. You cannot reliably "reverse engineer" the *design intent* from the generated code alone because the AI's "intent" is emergent pattern-matching, not conscious deliberation.

  3.  **Knowledge Location:**
      *   **Compiler/Library:** Knowledge of *what the code does* resides firmly with the human programmer (who wrote the high-level logic) and the library documentation. The compiler doesn't add novel *design*.
      *   **AI Coding Assistant:** Critical elements of the "what" and nearly all of the "why" (for the generated portions) reside *outside* the human team – in the model's weights, training data, and the specific prompt used at generation time. This knowledge is volatile and dissipates quickly.

  **In British English Summary:**

  You're describing **epistemic deskilling** and the accrual of **generative epistemic debt**. Your team has become dependent on an **opaquely generative tool**, leading to a collective **atrophy of design reasoning skills** and a **loss of traceable design intent** within your own codebase. This differs fundamentally from using compilers or libraries because the AI is generating the core logic *you* should understand, based on reasoning that is inaccessible, rather than just reliably translating your clear intent or providing well-documented components.

  The satnav analogy is excellent: it's not just forgetting the route (like forgetting an API call), it's losing the *ability to read a map or understand the city's layout* (the fundamental design reasoning skill). The "muscle" shrinks because the tool does the navigating *and* the route planning, leaving you only capable of following instructions until they fail. Your team's "map" of their own system is fading because the AI has been doing the navigating *and* much of the path-drawing.
