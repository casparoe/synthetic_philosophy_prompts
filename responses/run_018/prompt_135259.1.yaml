  First, I need to connect Smith's sympathy theory with the novel's dynamics. The user points out Atticus's individual sympathy versus the town's collective bias during Tom Robinson's trial. That's crucial—Smith's spectator is supposed to be rational, but what happens when the whole community shares prejudice? The trial scene perfectly illustrates institutional failure, where the legal system should provide distance but doesn't because it's infected by racism. 

