answer: |-
  ### The anatomy of the stall  
  The Lewis-Kripke impasse persists because core objections fail to engage the opposing framework’s foundational commitments. Lewisian counterpart theory replaces transworld identity with context-dependent similarity relations: an entity’s modal properties are grounded in counterparts selected by pragmatic criteria (e.g., resemblance in origin or function). Kripkeans object that this makes essential properties (like biological origins) *too contingent*—counterparts could diverge radically—and fractures an object’s identity across worlds. Lewis counters that this "problem" presupposes the very notion of transworld identity he rejects; for him, there is no literal identity to fracture. Conversely, Kripkeans insist objects are strictly identical across worlds, with essential properties fixed by their actual-world constitution. Lewisians retort that this demands implausible de re necessities (e.g., a table being essentially made of *these* molecules) and fails to explain *how* identity holds across discontinuous worlds. Kripkeans treat such identity as primitive, rendering the objection inert. Thus, objections stall: Lewisians see Kripke’s primitivism as evasion; Kripkeans see counterpart relations as abandoning identity altogether.

  ### Domain mismatch or bedrock intuition?  
  Your institutional cases expose a **structural domain mismatch** that destabilizes both frameworks. Institutions lack the stable physical constitution or teleological persistence conditions presupposed by natural kinds and artifacts. Counterpart theory’s reliance on similarity metrics implodes here: minor bylaw revisions trigger countless equally eligible counterparts, violating institutional practice where identity persists through incremental change (e.g., NATO surviving treaty amendments). Transworld identity fares worse, forcing implausible essentialism: if a corporation is *literally identical* across worlds, its founding charter becomes metaphysically necessary—contradicting legal flexibility. This isn’t a peripheral puzzle but reveals a **hidden fault line**: modal metaphysics traditionally calibrates to entities with mind-independent persistence conditions (organisms, particles), while institutions are *mind-dependent* and persist via collective recognition. Neither theory adequately models entities whose "essence" is negotiable and context-sensitive. The stall in the general debate likely stems from unexamined assumptions about what counts as a paradigmatic entity—Kripke presupposes robust natural-kind essences; Lewis assumes similarity relations track objective features, not social stipulations.

  ### What kind of disagreement is this?  
  This is a **multi-question disagreement masked as a unitary debate**. Lewis primarily addresses the *semantics of modal discourse*: how do we meaningfully talk about possibilities without ontological excess? His counterpart relations are tools for de re modal predication, not metaphysical glue. Kripke addresses the *metaphysics of individuation*: what makes an entity *this* entity across scenarios? His transworld identity is an ontic primitive. The conflation arises because both use "identity" to anchor modal claims, but they answer distinct questions: one linguistic, one ontological. Your institutional case heightens this divergence—counterpart theory’s semantic flexibility becomes unanchored without objective similarity standards, while transworld identity’s metaphysical rigidity ignores institutional fluidity. The debate stalls because each side’s "refutations" target the other’s question: Kripkeans accuse Lewis of changing the subject (from metaphysics to semantics); Lewisians accuse Kripkeans of mistaking linguistic practices for metaphysical necessities.

  ### What progress would require  
  Progress demands **reconfiguring the questions** to explicitly separate semantic and metaphysical projects, while expanding modal theory’s scope to include socially constructed entities. First, distinguish:  
  - *Semantic project*: How do de re modal statements function in different domains (e.g., natural kinds vs. institutions)?  
  - *Metaphysical project*: What grounds the persistence of entities with negotiable identity conditions?  
  For institutions, this might require a hybrid approach: e.g., a **conventionalist counterpart theory** where counterpart relations are constrained by institutional rules (e.g., legal continuity clauses define relevant similarity), or a **moderate essentialism** where only core institutional *functions* (not specific properties) are essential. Crucially, institutional practice must inform the metaphysics—e.g., corporate law’s "doctrine of corporate identity" could anchor persistence conditions. Without this domain-sensitive reframing, the debate remains stuck in paradigms ill-suited for social ontology. The goal isn’t to "resolve" the original dispute but to recognize its domain-limited applicability.
