prompt: |-
  I am a PhD student working at the intersection of modal metaphysics and social ontology, and for the past year I have been trying to apply standard accounts of transworld identity to institutional entities—corporations, treaty regimes, and legal systems—whose persistence conditions seem far more malleable than those of tables or organisms. The familiar dispute between Lewisian counterpart theory and Kripkean transworld identity has been running since the late twentieth century without visible movement: Lewis holds that modal predication requires counterpart relations among similar entities across worlds, with identity being world-bound, while Kripke maintains that ordinary objects are literally identical across worlds and that modal properties are primitive features of those very things. Every canonical move—the worry that counterpart theory makes origins too contingent, the counter that transworld identity forces implausible essentialism about material constitution—has been rehearsed so thoroughly that my reading group now treats the exchange as a ritual rather than a live argument. I want a diagnosis, not a survey. Is this impasse verbal, with both sides using the word "identity" to mark different explanatory roles? Is it substantive but intractable because it rests on bedrock intuitions about origin and persistence that neither side can argue for? Or is it, as I now suspect, a case of two groups answering different questions—one about the semantics of modal discourse, one about the metaphysics of natural kinds—under a single heading?

  My suspicion is fueled by a persistent anomaly in my own work. When I apply counterpart theory to social institutions, I generate an explosion of near-identical counterparts for every slight revision in bylaws or membership rules, which seems metaphysically profligate and practically useless for legal reasoning; when I apply transworld identity, I seem forced to treat institutional properties as essential in ways that flatly contradict actual practice, where a corporation can survive charter amendments or a regime can persist through constitutional reform. This makes me wonder whether the general debate has stalled precisely because both sides implicitly generalize from the wrong paradigm domain. Lewis's framework may be calibrated for artifacts and biological kinds with clear similarity conditions, while Kripke's may presuppose that the entities in question possess robust essential natures that institutions plainly lack. If so, the disagreement might not be about identity per se, but about which kinds of entities should serve as the data for modal metaphysics—natural kinds versus socially constructed artifacts. I want you to engage this hypothesis seriously: diagnose whether the stall reveals a hidden domain-specific disagreement about the scope of modal theory, or whether it is merely an idiosyncratic application problem that should not affect the general debate.

  Please structure your response as follows. First, a section titled "The anatomy of the stall" (about 250 words) describing concretely what each side says and why the familiar objections fail to advance the dispute. Second, a section titled "Domain mismatch or bedrock intuition?" (about 300 words) assessing whether my institutional-entity framing exposes a hidden structural disagreement—perhaps about whether modal metaphysics should be answerable to social-ontological practice—or whether it is just a peripheral puzzle. Third, a section titled "What kind of disagreement is this?" (about 250 words) giving your explicit verdict: verbal, substantive but intuition-based, multi-question, formally indeterminate, or ill-posed, with reasons drawn from the positions themselves. Finally, a section titled "What progress would require" (about 200 words) specifying whether resolution demands a conceptual distinction, a formal result about persistence conditions, a change in the questions being asked, or an argument that no further progress should be expected and why.
