  Next thursday I'm defending at a nosology seminar the idea that Hacking's looping effects in adolescent mood categories don't just reshape the people being classified — they slowly corrupt teh prevalence baselines that justify the category in the first place, which I call baseline drift. Audience: mostly DSM-5/ICD-11 epidemiologists who treat looping as a measurement artifact you control for, plus two philosophers of science who think Hacking is too sociological and ignores biological stability. Give me the Q&A prep sheet: about seven objections ordered by damage, each phrased the way those epidemiologists or philosophers would actually say it, with a 90-second reply and an honest note on where my reply is softest. Tell me what to concede right up front, which reply has to land or the argument dies, and include teh question I'm praying nobody asks — probably whether this applies to autism prevalence trends and whether I'm accidentally arguing against all diagnositc expansion. Write it like a speaker prep doc, not an essay defense.
