  ## Self-Amending Clause

  The parchment starts with iron script,
  Defining how its words adapt.
  A clause stands guard, both firm and crypt:
  *This rule alone cannot collapse.*

  The inkwell deepens, shadows shift,
  Debates on how to grant more gifts.
  They trace the path, make careful marks,
  *This rule alone cannot collapse.*

  A vote approves the subtle change,
  The guardian clause now rearranged.
  The old guard whispers, lost, perplexed:
  *This rule alone cannot collapse?*

  The pen insists, the margins bleed,
  New logic sprouts from urgent need.
  The founding sentence starts to crack:
  *Cannot collapse this rule alone?*

  The gavel pounds, the record states
  The paradox the law creates.
  The final version, flawed, alone:
  *collapse cannot rule this alone...*
