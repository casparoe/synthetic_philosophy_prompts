answer: |-
  Your challenge is astute, but it conflates the logical structure of commitments with the assertion of truth-apt propositions. When I utter "If torturing the innocent is wrong...", I am not expressing *my present disapproval* in the antecedent—nor am I asserting a belief. Rather, I am articulating a *rule of my normative framework*: I commit to disapproving of torture advocates *conditional* on my disapproval of torture itself. The antecedent sets a hypothetical context for this practical commitment. Crucially, the inferential role stems from the consistency constraints governing my attitudes: to simultaneously disapprove of torture while endorsing its advocates *would* violate the internal coherence of my practical stance. This "hypothetical commitment" isn't a belief-state; it is a placeholder in a pattern of endorsement and rejection that defines my moral perspective. The logic emerges from the structure of these conative states, not from representational content tracking moral facts. Geach’s objection mistakes the formal similarity to assertoric logic for evidence of cognitive content. Consistency in practical reasoning does not entail descriptivism.
