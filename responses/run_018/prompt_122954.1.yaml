prompt: |-
  I write literary fiction — third-person, past-tense novels that slip in and out of free indirect style — and my copy editor and I keep losing arguments about conditional sentences. My last manuscript had nearly a hundred of them, and on about a dozen we flatly disagreed: is the thing in the "if" clause being presented as something that happened, as something that did not, or as something still open? And whose state of knowledge settles that — the narrator's, or the character whose head we are in? In free indirect style that is precisely what I often don't want pinned down. A friend who reads linguistics tells me this is the territory of indicative versus counterfactual conditionals, which suggests there is more structure here than my ear supplies.

  What I need is a procedure my copy editor can run on each conditional in a manuscript, in order, with no training in linguistics: the questions to ask, what counts as an adequate answer to each one, the point at which the procedure says "this has to be rewritten," and the point at which it hands the question back to me because it is a matter of what I'm trying to do rather than of correctness. It has to be runnable in roughly ten seconds a sentence, it has to say how to handle nested conditionals and "even if," and it should be explicit about which of its questions are judgment calls wearing procedural clothing. I sign off on whatever it flags, and I need it to be honest about where it will misfire. The stakes are trivial per sentence and real per book: a conditional that quietly settles something I wanted left open can spoil the last fifty pages.

  Please run it on these three sentences from the novel I'm drafting, one of which I am attached to and would rather not change — and tell me straight if the verdict is that it has to change anyway:

  1. "If he had known about the letter, he would have taken the morning train."
  2. "If she was lying about the fire, then everything he had built on her account was already ash."
  3. "If he died in the fire, he died believing she had left him."

  For each, say what the sentence commits my fictional world to, what it conveys about the mind we are in, and where the procedure cannot settle the matter. Please write the answer in American English.
reasoning: |-
  Okay, let me tackle this writer's complex query about conditionals in literary fiction. The user writes nuanced third-person narratives using free indirect discourse and needs a reliable method to resolve disputes with their copy editor about conditional sentences. Their core concern is preserving intentional ambiguity while maintaining grammatical precision.

  The user's frustration is palpable - they describe dozens of arguments per manuscript, particularly about whether "if" clauses present events as factual, counterfactual, or uncertain. The linguistics mention (indicative vs. counterfactual) shows they've done homework, but need practical application. Their three key requirements are: speed (10 seconds/sentence), no linguistics background needed, and clear escalation points for authorial decisions.

  Hmm... the stakes are higher than typical copyediting. As they note, a single prematurely resolved conditional could undermine entire narrative arcs. The examples provided demonstrate classic trouble spots: past perfect modals ("had known"), ambiguous past tense ("was lying"), and parallel structure ("died... died") that could imply either resignation or mystery.

  For the procedural design, I'm considering a four-step filter:
  1. Identify conditional type through verb tense patterns
  2. Detect narrator/character knowledge markers
  3. Flag ambiguity conflicts
  4. Specify rewrite triggers vs. author decisions

  The examples reveal why this matters:
  Sentence 1 clearly signals counterfactual (he didn't know) - which might spoil intended uncertainty. 
  Sentence 2's "was lying" could be either past belief or present revelation - exactly where the procedure should pause for author input. 
  Sentence 3's parallel structure cleverly maintains doubt (we don't know if he died) but risks being "corrected" to counterfactual form.

  Notably, the user admits attachment to one example - probably sentence 3 given its elegant openness. The procedure must protect such intentional ambiguities while catching genuine errors. I'll need to emphasize that verb tense alone doesn't dictate meaning in free indirect discourse - context and narrative intent are equally crucial.

  The biggest challenge will be distinguishing between:
  - Grammatical incorrectness (must fix)
  - Unintentional ambiguity (should fix)
  - Intentional ambiguity (author's call)
  Especially since copy editors typically prioritize clarity over literary effect.

  For the verdicts, I'll have to be direct even if it means recommending changes to cherished sentences. The user clearly values honesty over reassurance. The key is showing how each decision serves their artistic goals while maintaining textual integrity.
answer: |-
  Here's a procedural guide for your copy editor, followed by analysis of your three sentences. The procedure prioritizes speed, clarity, and identifying ambiguity that *must* be resolved versus ambiguity that *might* be intentional.

  **The Conditional Clause Procedure (For Copy Editors)**

  1.  **Identify the "If" Clause Verb:**
      *   **"Had" + Past Participle (e.g., had known, had seen)?** → *Strongly suggests Counterfactual/Past Unreal.* The thing in the "if" clause **did not happen or is not true.** (Proceed to Step 3).
      *   **Simple Past (e.g., knew, saw, was, lied, died)?** → *Ambiguous.* It could be **Counterfactual/Past Unreal** OR **Indicative/Past Open/Uncertain.** (Proceed to Step 2).
      *   **Present/Future Forms (e.g., knows, is, lies, will know, dies)?** → *Indicative/Real.* The thing in the "if" clause is presented as **possible, uncertain, or general.** (Proceed to Step 3).

  2.  **Resolve Simple Past Ambiguity (The Critical Step):**
      *   Look at the **Main Clause Verb:**
          *   **"Would" + Have + Past Participle (e.g., would have taken)?** → *Strongly Counterfactual/Past Unreal.* The thing in the "if" clause **did not happen or is not true.** (e.g., "If she *was* lying..." + "...he *would have known*" → She wasn't lying).
          *   **Simple Past, Past Progressive, or Modal implying past certainty (e.g., took, was taking, must have taken)?** → *Indicative/Past Open/Uncertain.* **We don't know** if the thing in the "if" clause happened or was true; the narrator/character is considering it as a possibility that *might* have been true at that past time. (e.g., "If she *was* lying..." + "...he *was* doomed" → Maybe she was lying, maybe not; we don't know from this sentence).
      *   **Judgment Call:** If Step 2a or 2b gives a clear answer, proceed to Step 3. If the main clause *also* uses ambiguous verb forms (like simple past), **FLAG IT FOR AUTHOR.** This is where intentional narrative ambiguity often lives and the sentence likely needs authorial confirmation.

  3.  **Assess Knowledge Source (Narrator vs. Character):**
      *   Is the sentence clearly **Internal Thought/FIS?** (e.g., using character-typical language, reflecting their immediate perception, lack of narrator omniscience markers)? → The conditional reflects **the character's state of knowledge/belief at that past moment.** The "commitment" is to what the character *believed* was real/unreal/possible.
      *   Is the sentence clearly **Omniscient Narrator Statement?** (e.g., objective tone, broader context, knowledge beyond the character)? → The conditional reflects **the narrator's authoritative knowledge.** The "commitment" is to the factual reality of the fictional world.
      *   **Judgment Call:** Is it ambiguous (common in FIS)? → **FLAG IT FOR AUTHOR.** Clarifying the source might spoil the intended effect. The author must decide if the ambiguity serves the narrative.

  4.  **Handle Modifiers & Nested Conditionals:**
      *   **"Even if":** Treat the "if" clause normally using Steps 1-3. "Even if" emphasizes that the main clause holds true *regardless* of the "if" clause's truth value. It doesn't change the reality status assigned by the verb forms.
      *   **Nested Conditionals:** Apply Steps 1-3 to the *innermost* "if" clause first. Its resolved status then becomes part of the context for analyzing the outer clause. If complexity causes ambiguity or takes >15 seconds, **FLAG IT FOR AUTHOR.**

  5.  **Verdict & Actions:**
      *   **Clear Counterfactual/Indicative & Clear Knowledge Source:** *No change needed* (grammatically sound and clear).
      *   **Ambiguous Verb Structure (Step 2 unresolved):** **FLAG FOR AUTHOR.** "Verb structure ambiguous: Counterfactual or Indicative intent unclear. Confirm intended meaning."
      *   **Ambiguous Knowledge Source (Step 3 unresolved):** **FLAG FOR AUTHOR.** "Knowledge source (Narrator vs. Character) ambiguous. Confirm if deliberate."
      *   **Unclear/Illogical Meaning despite Structure:** **SUGGEST REWRITE** (e.g., mixed time frames, contradictory implications). Briefly state the issue.
      *   **"Would have" in Main Clause with Simple Past in "If" Clause:** *Strongly Counterfactual.* Usually correct, but **NOTE FOR AUTHOR** if FIS ambiguity is paramount: "Structure implies [thing] didn't happen. Confirm this is intended vs. desired character uncertainty."

  **Key Principles:**
  *   **Speed:** Relies on fast verb pattern recognition (Steps 1 & 2).
  *   **Authorial Intent:** Flags ambiguity *unless* verb structure forces a counterfactual reading ("had" + "would have"). Protects intentional FIS ambiguity.
  *   **Misfires:** Will misfire if:
      *   The author deliberately uses grammatically counterfactual forms ("If he had known...") but wants the reader to *doubt* the narrator/character's certainty (rare and risky).
      *   Highly idiosyncratic character thought patterns override standard verb implications (needs author flag).
      *   Complex nested conditionals overwhelm the pattern-matching.
  *   **Honesty:** The procedure is explicit about judgment calls in Steps 2 and 3, and when it flags for author input.

  **Analysis of Your Sentences (Using the Procedure):**

  1.  **"If he had known about the letter, he would have taken the morning train."**
      *   **Step 1:** "If" clause: "had known" → *Strongly Counterfactual.*
      *   **Step 2:** N/A (Resolved by Step 1).
      *   **Step 3:** Context-dependent, but structure strongly implies narrator authority: **He did not know** about the letter. Therefore, **he did not take** the morning train. This is a statement of fact about the fictional world.
      *   **Mind We Are In:** If pure narrator, it's an objective fact. If deep FIS, it reflects the character's *current, certain belief* that he didn't know and therefore didn't take the train. It **settles** the questions of knowledge and action definitively.
      *   **Procedure Verdict:** NO FLAG. Grammatically forces counterfactual meaning. **Must change** if you intended ambiguity about whether he knew or took the train. To create ambiguity, rewrite (e.g., "If he knew about the letter, why hadn't he taken the morning train?" or "Did he know about the letter? If so, he would have taken the morning train.").

  2.  **"If she was lying about the fire, then everything he had built on her account was already ash."**
      *   **Step 1:** "If" clause: "was lying" (Simple Past) → *Ambiguous.* Proceed to Step 2.
      *   **Step 2:** Main clause: "was already ash" (Simple Past). → *Indicative/Past Open/Uncertain.* **We do not know** if she was lying. The sentence considers the *possibility* that she was lying *at that past time* and its consequence.
      *   **Step 3:** Highly context-dependent. Likely reflects **the character's current thought process** at that past moment. He is considering the devastating *possibility* she lied. The narrator is not confirming she lied.
      *   **Commitment:** Commits only to his *consideration* of the possibility and his belief in the consequence *if* it were true. **Does not commit** to her actually lying or everything actually being ash *because of a lie*. (It could be ash for other reasons; she might have told the truth).
      *   **Mind We Are In:** We are almost certainly in the character's head (FIS), witnessing him grapple with this doubt and its horrific implication.
      *   **Procedure Verdict:** NO FLAG (assuming FIS). The ambiguity (Step 2 result) is intentional and effective for FIS, reflecting character uncertainty. If the narrator *knows* she wasn't lying, it might be misleading, but the structure doesn't force that.

  3.  **"If he died in the fire, he died believing she had left him."**
      *   **Step 1:** "If" clause: "died" (Simple Past) → *Ambiguous.* Proceed to Step 2.
      *   **Step 2:** Main clause: "died believing" (Simple Past + Past Participle). → *Indicative/Past Open/Uncertain.* **We do not know** if he died in the fire. The sentence states a consequence *if* he did die (which is unknown). The "had left" is past perfect relative to his dying, confirming she left *before* his potential death.
      *   **Step 3:** Likely **narrator authority** stating a fact about the past: *If* Death-In-Fire is true (status unknown), *then* Belief-She-Left is true. Or, it could be a character's grim conclusion. Ambiguous source common in FIS.
      *   **Commitment:** Commits that **she had left him** before the time of the fire (fact). Commits that **if** he died there, **then** he held that belief at death (fact). **Does not commit** to whether he actually died in the fire (unknown).
      *   **Mind We Are In:** Could be narrator stating conditional facts, or character (e.g., "she") facing the unresolved possibility. The ambiguity is central to the sentence's power.
      *   **Procedure Verdict:** **FLAG FOR AUTHOR** on Step 3 (Knowledge Source). The verb structure (Step 2) correctly shows the death is unresolved. However, the *source* of the information about his belief if he died is ambiguous (narrator fact vs. character thought). **Do you need to change it?** *Probably not.* This ambiguity is likely intentional and effective FIS. The flag simply asks you to *confirm* that the ambiguity between narrator certainty about the belief vs. character conjecture is deliberate. The core uncertainty about his death is preserved perfectly by the structure. If attached, fight for it – the grammar supports the ambiguity.

  **Summary Verdicts:**
  1.  **Must change** if you wanted ambiguity about his knowledge/action. The grammar forces a counterfactual reading.
  2.  **Likely fine as-is.** Perfectly captures character doubt via Indicative/Past Open structure.
  3.  **Flagged for Author (Knowledge Source),** but the critical uncertainty about his death is preserved. **Probably does NOT need to change** if the narrator/character ambiguity is intentional. Defend this one if it's your favorite. The procedure flags only to confirm intent, not because it's wrong.

  This procedure gives your copy editor clear, fast rules to identify potential issues, protects intentional ambiguity inherent in FIS, and escalates only the most critical judgment calls to you. It prioritizes your narrative goals over rigid grammatical prescriptions when they conflict, while catching truly misleading constructions.
