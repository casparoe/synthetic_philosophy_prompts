  Cost of rejection: We give up the strong normative implication of Scheffler's conjecture. It becomes a descriptive claim about human psychology: we are motivated by the expectation of future generations, but it doesn't dictate what is objectively valuable. So, the conjecture doesn't provide a foundation for normative ethics; it's about why we care, not why we should care.

