  Okay, let me try to unpack this user's problem. They're wrestling with the cognitive-diversity defense for legislative sortition and hitting a logical contradiction. The core tension is between wanting heuristic diversity (which requires minimal filtering) and avoiding elite-capture biases (which requires no filtering). 

  First, I notice the user is deeply familiar with sortition theory—they've formalized the argument carefully and spotted where it breaks. That tells me I should avoid oversimplifying. Their numbered steps show they've already done the heavy lifting; my job is to find the precise fracture point.

  Hmm... the real pain point seems to be step (5)'s claim that legislative filters *necessarily* reintroduce class/ideological biases. Is that empirically true? Maybe not. What if competence thresholds for legislation are fundamentally different than for drug approval? For example: literacy tests historically *were* biased filters, but could a modern "civic literacy" filter avoid that if designed radically differently? The user might resist this as "slippery slope" though.

  Alternatively, maybe step (2) overextends. Cognitive diversity matters more in *value-laden* decisions (like laws) than technical ones (like drug safety). But that feels weak—FDA panels *do* make value-judgments (e.g., risk tolerance). 

  *Lightbulb moment*: Perhaps the key is distinguishing *types* of competence. Drug panels need certified medical knowledge; legislatures need "folk competence"—basic reasoning plus lived experience. The latter can't be credentialed without bias, while the former can. That rescues step (5) without abandoning (1) or (3). 

  User's fear about "conceding to elitism" is valid though. If I propose "folk competence", I must define it without academic jargon. Maybe: the ability to grasp trade-offs affecting daily life, which random samples naturally possess. That keeps anti-elitism intact while allowing legislative sortition to stand unfiltered. 

  For regulatory bodies, filtered sortition makes sense—you can't have non-oncologists approving cancer drugs. But that doesn't collapse the legislative argument because the stakes differ: expertise prevents physical harm in one case, while cognitive diversity prevents democratic decay in the other. 

  *Check for damage*: If user accepts this, they must concede that sortition isn't a universal solution. But that's actually realistic—hybrid models exist. The core defense for citizens' assemblies remains intact. 

  *Final polish*: I should emphasize that legislative decisions are *interpretive* (requiring diverse perspectives) while technical decisions are *convergent* (requiring certified knowledge). That distinction protects their prized premise (1) without forcing absurd drug-panel conclusions.
answer: |-
  Your formalization exposes a genuine tension in the cognitive-diversity defense. The key equivocation lies in Step (2)'s claim that the justification applies "**to any collective decision procedure** vulnerable to the same biases." This overextends the argument. Here's the breakdown and solution:

  ### The Problem: Step (2) Ignores the **Domain-Specific Nature** of Competence & Legitimacy
  *   **Step (2)** asserts that cognitive diversity is a universal good applicable *anywhere* biases degrade judgment. This is where the scope shift occurs. Cognitive diversity is a *necessary but not sufficient* condition for good decision-making. Its primacy depends on the **type of decision** being made:
      1.  **Interpretive/Political Decisions (Legislatures):** Require synthesizing diverse values, experiences, and interests to define collective goals ("What *should* we do?"). Here, *cognitive diversity is paramount*. Technical expertise is secondary (and can be provided advisors). Legitimacy stems from *representativeness*.
      2.  **Technical/Epistemic Decisions (Drug Panels):** Require applying specialized knowledge to assess facts against pre-defined standards ("Does this drug meet safety/efficacy criteria *X*?"). Here, *minimal competence is paramount*. Cognitive diversity is valuable *only within the bounds of essential expertise*. Legitimacy stems from *competence*.

  ### The Solution: Reject Step (2)'s Universality Claim & Reframe Scope
  *   **Revised Premise:** "The cognitive diversity justification applies primarily to **collective decision procedures tasked with making normative, political judgments** where the definition of the problem, the values at stake, and the goals themselves are contested and require societal input. It is less compelling (or requires heavy qualification) for procedures making **primarily technical judgments** requiring specialized, verifiable expertise against established criteria."
  *   **Why this saves (1) & (3):**
      *   **(1) Legislative Sortition:** Stands because legislatures are *definitionally* about normative political judgment. Maximizing cognitive diversity *is* the primary path to better outcomes and legitimacy in this domain. Eliminating self-selection biases is crucial.
      *   **(3) Expert Body Biases:** Holds – expert bodies *can* suffer from capture/groupthink. However, the *solution* differs because the decision *type* differs. Cognitive diversity is valuable, **but constrained by the necessity of core technical competence.**

  ### Consequences for Steps (4)-(8)
  *   **(4) Filtered Sortition for Experts:** **Becomes plausible, but context-dependent.** For bodies making *highly technical* decisions with clear objective standards (like initial drug safety screening), traditional expert appointment (with safeguards against capture) or *very tightly filtered* sortition *might* be viable. However, for regulatory bodies setting *policy* (e.g., setting risk tolerance levels, prioritizing research areas), where normative judgments creep in, *more diverse* input (e.g., stakeholder panels, public consultation alongside experts) becomes crucial. **Filtered sortition isn't "mandated everywhere" – it's a potential tool only where core technical competence is non-negotiable.**
  *   **(5) Legislative Filter Problem:** **Remains valid.** For normative political bodies, *any* competence filter imposed *before* sortition (beyond basic citizenship/age) risks reintroducing class/education/ideology biases that distort the very diversity sought. Competence for political judgment emerges from deliberation *within* the diverse body, not from pre-selection credentials.
  *   **(6)/(7) False Dilemma Dissolved:** The dilemma collapses because the justification isn't rejected (a), nor is filtering conceded for legislatures (b). The justification is **domain-specific**:
      *   For **legislatures (normative):** Unfiltered sortition maximizes the *specific type* of cognitive diversity needed. "Competence" is defined as *the capacity for collective deliberation informed by lived experience*, which the random sample possesses *as a group*.
      *   For **technical bodies (epistemic):** Filtering is necessary to meet the *primary* requirement of technical competence. Cognitive diversity is a *secondary* benefit within that constraint, not the primary justification for the body's existence. Applying filtered sortition *here* doesn't imply it's needed *there*.
  *   **(8) Proving Too Much/Little:** Avoided. The argument doesn't mandate filtered sortition everywhere, only suggesting it *might* be useful in *some* technical contexts where competence is paramount. It robustly justifies legislative sortition precisely because it *refuses* the competence filter that is essential in technical domains but destructive in political ones.

  ### What You're Buying By Rejecting Step (2)'s Universality
  1.  **Acknowledging Different Decision Types:** You accept that "collective judgment" isn't a monolithic concept. Political legitimacy and technical correctness require different institutional designs.
  2.  **Competence Matters Differently:** You concede that core technical competence *is* a non-negotiable pre-requisite for some decisions, while for political judgment, "competence" is an emergent property of diverse deliberation.
  3.  **Hybrid Solutions for Expert Bodies:** You open the door for acknowledging that solutions for expert capture *might* involve diversity-enhancing mechanisms (like stakeholder representation, rotating experts, transparency mandates) *alongside* competence filters, rather than *replacing* competence with diversity via sortition. Filtered sortition becomes *one possible tool*, not a universal mandate.
  4.  **Stronger Defense for Legislatures:** You ground legislative sortition even more firmly in the *unique nature of political sovereignty*. The people's right to define their own collective life through diverse representation is distinct from the need for specialized technical execution.

  ### Subtlety Preserved: Distinguishing Diversity from Representation
  You suspected an equivocation. This solution clarifies:
  *   **Cognitive Diversity:** Is about varied perspectives, heuristics, and problem-solving approaches. *Crucial for both domains, but constrained by competence in technical ones.*
  *   **Descriptive Representation:** Is about mirroring demographic characteristics. While often correlated with cognitive diversity in legislatures, it's not identical. The core argument here rests on *cognitive* diversity as the epistemic engine for political judgment, not just descriptive mirroring for its own sake. The "anti-elitism" stems from rejecting credentialist filters that *suppress* cognitive diversity, not from rejecting expertise per se.

  **Conclusion:** Reject Step (2)'s claim that the cognitive-diversity justification applies identically to *any* decision procedure. Instead, anchor it firmly in the domain of **normative political judgment** (legislatures), where maximizing heuristic diversity through unfiltered sortition is the primary epistemic and legitimizing strategy. For technical domains, acknowledge competence as the primary gatekeeper, making filtered sortition a possible *but not universally mandated or even always desirable* tool among others. This preserves the core justification for citizens' assemblies while avoiding the reductio ad absurdum of random drug panels. The cost is accepting that sortition is not a panacea for *all* collective decision-making ills, only those rooted in the need for legitimate political will formation.
