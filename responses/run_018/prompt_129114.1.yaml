answer: |-
  Here’s a draft joint statement for your adversarial collaboration, designed to clarify positions and cruxes without strawmanning:

  ---

  ### **Joint Statement: Adversarial Collaboration on Epistemic Injustice**  
  **Parties:**  
  - **Hermeneutical Priority (HP) Camp**: Holds that hermeneutical injustice (lacking shared concepts to interpret experiences) is the primary driver of epistemic harm.  
  - **Testimonial Priority (TP) Camp**: Holds that testimonial injustice (systematic credibility deficits) is the root cause, with hermeneutical gaps as a downstream effect.  

  ---

  ### **I. Agreed Claims (Signed by Both Camps)**  
  1. **Epistemic Harm Definition**: Epistemic injustice occurs when someone is wronged *specifically in their capacity as a knower*, causing systematic disadvantage.  
  2. **The Bilingual Clinic Case**: A patient describing symptoms with a folk-medical term (e.g., "susto") that clinicians dismiss, lacking both the concept and vocabulary to bridge the gap, constitutes clear epistemic injustice.  
  3. **Institutional Fixes Require Individual Engagement**: Structural changes (e.g., interpreter services, concept glossaries) are necessary but insufficient without shifts in individual epistemic attitudes (e.g., humility, curiosity).  
  4. **Mutual Reinforcement**: Testimonial and hermeneutical injustice often coexist and exacerbate each other, regardless of which is primary.  
  5. **Harm Beyond Ignorance**: Epistemic injustice is distinct from simple ignorance; it involves power imbalances that distort communication and interpretation.  

  ---

  ### **II. Disagreements Table**  
  *(Wording approved by each camp)*  

  | **Crux** | **HP Camp Position** | **TP Camp Position** |
  |----------|----------------------|----------------------|
  | **Crux 1: Direction of Causality**<br>*Using the Bilingual Clinic Case:*<br>Does lacking shared concepts *cause* credibility deficits, or vice versa? | **HP Claim:** The hermeneutical gap is foundational. The patient’s inability to articulate experience in clinical terms *precedes and causes* the credibility deficit. Clinicians dismiss "susto" because it lacks institutional legitimacy, not because they first deemed the patient untrustworthy. | **TP Claim:** Credibility assessment comes first. The patient is *already perceived as less credible* due to identity prejudice (e.g., immigrant status), causing clinicians to dismiss "susto" and *preventing* the development of shared understanding. |
  | **Crux 2: Individual Failure vs. Structural Injustice**<br>*Using a clinician’s epistemic humility failure in a "protocol-compliant" hospital:*<br>If hospital protocols are formally unbiased, does a clinician’s personal dismissal of a patient’s testimony still count as epistemic injustice? | **HP Claim:** Yes. Without shared hermeneutical resources (e.g., protocols that validate folk concepts), individual clinicians *cannot* fairly assess testimony. The injustice is structural, manifesting through individual acts. | **TP Claim:** Yes. The clinician’s credibility discount *is* the injustice, even if protocols are neutral. Structural change requires addressing individual biases first; "unbiased" protocols are inert without virtuous hearers. |

  ---

  ### **III. Predictions & Testing the Cruxes**  
  *(Both camps agree these scenarios would test their claims)*  

  - **Crux 1 Prediction (Bilingual Clinic):**  
    - **HP Prediction:** Providing patients with clinical vocabulary *before* testimony (e.g., via community health workshops) reduces credibility deficits more than clinician bias training alone.  
    - **TP Prediction:** Training clinicians to suspend credibility judgments *before* testimony (e.g., via active listening) reduces hermeneutical gaps more than vocabulary tools alone.  

  - **Crux 2 Prediction (Clinician Failure):**  
    - **HP Prediction:** Adding folk concepts to diagnostic protocols *without* clinician retraining will fail; hermeneutical resources must be integrated.  
    - **TP Prediction:** Retraining clinicians in epistemic virtue *without* protocol changes will reduce injustices; structural tools follow attitudinal shifts.  

  ---

  ### **IV. Off the Beaten Path: The Epistemic Audit Trail Proposal**  
  *Both camps evaluate a system where all credibility discounts in clinical decisions must be logged with justifications.*  

  - **HP Camp Assessment:**  
    > "This buries the problem. Audit trails focus on *post-hoc* credibility judgments, not the hermeneutical gap that made testimony unintelligible. Logging won’t capture why ‘susto’ was excluded from consideration — it reinforces existing conceptual hierarchies."  

  - **TP Camp Assessment:**  
    > "This exposes the problem. Forcing clinicians to document *why* they discounted testimony makes bias visible (e.g., ‘patient used non-clinical terms’). The data can challenge systemic credibility deficits — but only if paired with accountability for patterns of dismissal."  

  ---

  ### **Joint Conclusion**  
  We agree that epistemic injustice is a harm requiring intervention at individual and structural levels. Our cruxes reveal that **HP sees hermeneutical repair as foundational to testimonial fairness**, while **TP sees testimonial fairness as foundational to hermeneutical repair**. Testing our predictions in cases like the clinic could resolve whether shared concepts or credibility attitudes are the primary leverage point for change. The audit trail proposal highlights our shared skepticism toward bureaucratic "solutions" that ignore power dynamics — though we differ on whether transparency tools target symptoms (HP) or causes (TP).  

  ---  
  This draft isolates core disagreements while grounding them in shared examples and testable claims. It avoids citations and remains self-contained, focusing on adversarial clarity over resolution. Would you like adjustments to the camp definitions or crux formulations?
