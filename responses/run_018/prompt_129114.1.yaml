prompt: |-
  Me and my study group have been going in circles about epistemic injustice — like, whether Miranda Fricker's split between testimonial and hermeneutical injustice is actually doing real work or if its just two sides of the same coin. We've basically split into two camps: the Hermeneutical Priority people think that not having the right concepts is the root problem, because if you can't even frame your experience you can't claim credibility for it; and the Testimonial Priority people think that's backwards, that credibility discounts come first and hermeneutical gaps are just what happens afterwards when people stop listening. I want us to stop talking past eachother and write a real adverserial collaboration doc.

  Can you draft the joint statement? Name the camps clearly and write it in two parts: first a numbered list of claims both sides can actually sign — including stuff about what counts as epistemic harm in general, about that bilingual clinic case where a patient uses a folk-medical word the doctors dismiss and doesn't have the clinical vocabulary to bridge the gap, and about whether institutional fixes are even possible without changing individual minds. Then do a disagreements table with each side's position in wording they'd accept for themselves, not a strawman. I also want the cruxes spelled out — I think the big ones are (1) whether lacking shared concepts causes credibility loss or vice versa, and (2) whether a clinician's personal failure of epistemic humility counts as injustice if the hospital's formal protocols are unbiased. For each crux, include the concrete case or argument both agree is relevant, and write down each camp's prediction in advance. And please inject something a bit off the beaten path: have them both address whether an epistemic audit trail — where every credibility discount in a decision gets logged with its reasoning — would solve their problem or just bury it in paperwork. Don't include citations, reading lists, or anything that needs web access; I want this readable for someone with no search tools.
