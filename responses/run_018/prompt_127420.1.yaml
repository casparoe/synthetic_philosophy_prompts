prompt: |-
  Consider a small conceptual research program—three philosophers with decision-theoretic and philosophy-of-science backgrounds, two years, no empirical ML budget—tasked with making progress on embedded agency rather than rehashing the standard causal-versus-evidential tension in embedded settings. I want a defended prioritization of what they should actually work on, not a survey.

  First, work with a distinction that is often collapsed but pulls in different directions: causal embeddedness (the agent is literally a physical subsystem of the environment it acts within) versus epistemic embeddedness (the agent must evaluate its own reasoning processes using the same bounded, fallible, resource-limited mechanisms it applies to external hypotheses). The first cluster raises self-reference and logical-omniscience problems; the second raises reflective-stability and legitimate-self-modification problems.

  Given that framing, which three open questions or lines of conceptual work should be prioritized, in order? For each, defend the ranking by addressing:
  - Upstream dependency: how settling this restructures the remaining problem space in embedded agency or in conceptual AI alignment.
  - Tractability: why this is suitable for philosophers using formal analysis and conceptual clarification rather than experiments or large-scale training.
  - Evidence and failure modes: what specific result, paradox-resolution, or conceptual clarification over the next two years would justify the investment, and what outcome—collapse into an empirical ML question, conceptual dissolution, or irrelevance to system evaluation—should cause them to drop it?

  Second, embedded agency is often claimed to carry practical implications—e.g., whether an embedded system can maintain coherent preferences over its own source code, whether self-modeling introduces irreducible uncertainty about its goals, or whether standard rational-agent coherence conditions fail inside physical boundaries. Rank these implications: which two would genuinely change how we design or evaluate intelligent systems if taken seriously, and which are philosophically interesting but carry little engineering weight? Defend the ranking with explicit criteria (upstream influence on other questions, tractability for conceptual work, neglectedness in current alignment discourse, and actual impact on practice).

  Please do not provide a bibliography, citation list, or reading recommendations—I will fill those in myself. Ground the argument in distinctions and reasoning precise enough to be useful but not dependent on memorizing obscure formalisms or niche literature that a smaller model might not have retained.
