  I've recently moved into theoretical machine-learning research, where questions about model-class closure and inductive bias are central, and this has made the epistemic status of the Church-Turing thesis suddenly relevant to me. I am fluent in statistical learning theory—PAC learnability, VC dimension, uniform convergence, and the framing of inductive bias as a prior over hypotheses. Please restate the Church-Turing thesis, together with its three main interpretations (mathematical theorem, empirical claim about physical computation, conventional stipulation), in that vocabulary: treat effective calculability as learnability within a model class and Turing-completeness as closure under that class's operations. For each interpretation, say what translates cleanly, what must be distorted to fit—for instance, mapping effective calculability onto sample-efficient learnability—and what has no expression at all in the learning-theoretic framework. Then report whether the untranslatable residue points to a genuine concept in computation theory that learning theory lacks, or rather reveals that the original thesis was never precisely defined independent of the formal model that expressed it.
