prompt: |-
  I am advising a municipal water authority that operates under an absolute institutional prohibition: it may never deliberately introduce any chemical agent into the public reservoir, irrespective of dilution, intent, or net effect. The authority has learned that an upstream industrial facility is accidentally releasing trace amounts of a persistent toxin into the same supply. They have access to a counter-agent that would neutralize the contamination, but deploying it requires the deliberate introduction of a different compound into the water—thereby violating the prohibition—though the result would be measurably cleaner water and lower health risk. Several board members contend that maintaining the prohibition in this case makes the authority complicit in avoidable harm, and that the moral distinction between actively causing damage and passively allowing it collapses when the institution has both knowledge and capacity to intervene. Others reply that the rule exists precisely to prevent institutional overreach, and that breaking it for a favorable outcome erodes its normative force regardless of circumstances. I find both lines of argument partially compelling yet structurally incomplete. Please lead with your bottom line in the first sentence, then provide the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is advising a municipal water authority facing a tough ethical dilemma. They've got this absolute rule: never add any chemicals to the public reservoir. But now there's an upstream industrial leak contaminating the water, and they have a way to neutralize it—by adding another chemical. Some board members say not acting makes them complicit in harm, while others insist breaking the rule erodes its foundation. The user finds both arguments incomplete and wants a clear bottom line upfront.

  Hmm, this is a classic tension between deontology (rules-based ethics) and consequentialism (outcomes-based ethics). The prohibition is clearly deontological—it's about the act itself being wrong regardless of consequences. But the contamination presents a consequentialist crisis: real harm is occurring that could be mitigated. 

  The user seems to grasp this duality but wants deeper analysis. They might be subtly asking: "How do we preserve institutional integrity while preventing harm?" That's the real needle to thread. The unspoken pressure here is public trust—both in water safety and in the authority's adherence to its own principles.

  Notably, the prohibition's phrasing ("deliberately introduce") is absolute, leaving no exceptions. That rigidity clashes with the practical reality of the contamination. The board members arguing for intervention have a point about passive complicity, but the counter-argument about slippery slopes is equally valid—if they break the rule once, what stops future "justified" exceptions?

  What's missing structurally? Both sides overlook institutional identity. The rule isn't just a policy; it defines the authority's relationship with the public. Violating it, even for good ends, risks transforming them into the very type of actor the rule exists to prevent. Conversely, upholding it while people get sick could make them passively irresponsible. 

  The toxin being "persistent" adds urgency—this isn't a temporary glitch. And "measurably cleaner water" suggests the counter-agent works, but introduces new unknowns: what are its long-term effects? The prohibition likely exists because such unknowns are deemed unacceptable. 

  My bottom line must reject both extremes. The solution lies outside the binary—either find a non-chemical intervention (pressure upstream regulators? filtration post-reservoir?) or, if truly trapped, transparently involve the public in re-evaluating the rule. But quietly breaking it? That sacrifices their core covenant. Institutional trust is harder to restore than water quality.
answer: |-
  **The water authority should uphold the prohibition against deliberate chemical introduction and exhaust all non-prohibited alternatives to address the contamination.**  

  The prohibition’s absolute nature serves as a foundational safeguard against institutional discretion in chemical deployment, prioritizing process integrity over outcomes to prevent precedent-setting exceptions. Introducing the counter-agent—even with net benefit—directly violates this core institutional mandate, transforming the authority from a passive victim of external contamination into an active chemical regulator. This erodes the rule’s normative force and public trust, as exceptions justified by "favorable outcomes" invite future breaches under less clear-cut circumstances.  

  The argument that inaction constitutes complicity conflates moral responsibility with institutional capability. The authority’s duty is defined by its mandate: to deliver water *without chemical additives*, not to optimize water quality by all available means. The true moral failure lies with the upstream polluter and regulators permitting the discharge. Redirecting efforts toward legal, political, or engineering solutions (e.g., suing the facility, demanding upstream remediation, or enhancing filtration *after* water leaves the reservoir) aligns with the prohibition while addressing harm.  

  Both arguments are incomplete because they ignore third-way solutions and overstate the binary: upholding the rule does not require passive acceptance of contamination, nor does violation guarantee ethical purity. The authority must aggressively pursue every *permissible* intervention—transparently documenting constraints—to demonstrate fidelity to its mandate while mitigating harm. If the prohibition proves untenable, it should be revised democratically, not subverted ad hoc.
