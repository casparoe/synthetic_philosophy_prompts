answer: |-
  ### 1. Exam Question  
  **"Dispositional Complexity in Compound Cases"**  
  *(75 minutes; aim for ~800 words)*  

  > *Consider a crystal vase with two engineered features:*  
  > (i) An **internal shock-absorber** that instantly hardens the vase’s structure *if* any impact occurs, preventing cracks from spreading (a *fink-like* mechanism).  
  > (ii) An **external foam wrap** that dampens all external impacts below the force threshold needed to cause cracking (a *mask-like* mechanism).  
  >  
  > **Question:** Does this vase retain the disposition *fragility* (i.e., to shatter when struck)? Critically assess this using:  
  > (a) **Martin’s Simple Conditional Analysis** (SCA): *x* is fragile iff *if x* were struck, *x* would shatter.  
  > (b) **Lewis’s Reformed Conditional Analysis** (RCA): *x* is fragile iff *if x* were struck *and remained fragile*, *x* would shatter.  
  > (c) **Johnston’s Intrinsic Basis Claim**: Dispositions must have intrinsic causal bases that would cause manifestation in suitable conditions.  
  >  
  > Conclude: Does this case defeat SCA, RCA, *and* Johnston’s view? If not, which survives and why? Explain why your conclusion matters for debates about whether dispositions must be intrinsic properties.  

  ---

  ### 2. Model Answer (590 words)  
  The vase’s compound features create a dilemma for standard dispositional analyses by simultaneously *finking* and *masking* fragility. Assessing whether it retains fragility exposes critical flaws in each theory.  

  **(a) Martin’s SCA fails categorically.** SCA claims *x* is fragile iff striking it would cause shattering. Here, two blockers intervene:  
  - The shock-absorber *finks* fragility by removing the disposition *during* the stimulus (striking), hardening the vase preemptively.  
  - The foam *masks* fragility by intercepting the stimulus, preventing striking from occurring *as defined* (i.e., no sufficient force reaches the vase).  
  Thus, the conditional "if struck, would shatter" is false. SCA incorrectly concludes the vase is *not* fragile. Yet intuitively, the vase *is* fragile—its crystalline structure remains intact but for external protections. SCA cannot distinguish masking/finking from true absence of fragility.  

  **(b) Lewis’s RCA fails under masking.** RCA adds a clause: *x* is fragile iff, *if struck and remained fragile*, it would shatter. This handles the fink: the shock-absorber’s activation means the vase does *not* "remain fragile" when struck, so RCA avoids falsely ascribing fragility. However, the foam mask creates a new problem. When the vase is wrapped, RCA’s antecedent ("if struck and remained fragile") is **vacuous**. Striking cannot occur (due to the foam), so the conditional lacks a truth-value. RCA thus cannot affirm fragility *while masked*. Yet the vase’s fragility persists intrinsically; the foam is extrinsic interference. RCA cannot capture dispositions when masked.  

  **(c) Johnston’s intrinsicism faces the mask.** Johnston argues dispositions require intrinsic bases that would cause manifestation in "suitable" conditions. Here, the vase *has* an intrinsic basis (crystalline structure). Johnston might claim it *is* fragile because, *without the extrinsic foam*, the structure *would* shatter if struck. However, this conflates two issues:  
  - The shock-absorber is *intrinsic but finkish*—it destroys the disposition *during* stimulation.  
  - The foam is *extrinsic but masking*—it leaves the intrinsic basis intact but blocks the stimulus.  
  Johnston’s view *partially* survives: the vase has a relevant intrinsic basis. But his claim that intrinsic bases suffice for dispositionality is refuted by the foam. Even with a suitable intrinsic basis, an extrinsic mask can prevent manifestation *without altering the basis*. Fragility cannot be actualized due to extrinsic factors, challenging the idea that dispositions depend *only* on intrinsics.  

  **Conclusion:** The compound case defeats SCA and RCA outright. Johnston’s view *survives minimally* by correctly identifying an intrinsic basis but fails to explain why the vase *has* the disposition *while masked*. This shows that:  
  - Dispositions can be *extrinsically masked* without intrinsic change (undermining Johnston’s sufficiency claim).  
  - Neither conditional analysis handles *simultaneous* finking and masking.  
  **Why this matters for intrinsicality:** If dispositions can be masked extrinsically (foam) while their basis remains intrinsic, then ascribing a disposition depends on *extrinsic* circumstances. This implies dispositions are not *fundamentally* intrinsic—they can exist only relative to an environment permitting manifestation. The vase’s fragility is real but *environment-dependent*; intrinsicality may be necessary but not sufficient for dispositionality.  

  ---

  ### 3. Marking Scheme (20 marks total)  
  **Must-hit moves** (4 marks each):  
  1. **Identify fink & mask mechanisms correctly**:  
     - *Fink:* Shock-absorber *removes* fragility DURING stimulus.  
     - *Mask:* Foam *blocks* stimulus BEFORE reaching vase.  
     - *Botch:* Conflating fink/mask roles or misattributing timing.  
  2. **Show SCA fails from both fink AND mask**:  
     - SCA’s conditional false → vase deemed not fragile (but is).  
     - *Botch:* Only discussing one threat (e.g., only fink).  
  3. **Show RCA fails from MASK (not fink)**:  
     - RCA handles fink via "remained fragile" clause.  
     - Mask makes antecedent inapplicable → fragility indeterminate.  
     - *Botch:* Claiming RCA fails for fink or missing vacuous antecedent.  
  4. **Johnston: Salvage basis but fail on extrinsics**:  
     - Basis is intrinsic → survives minimally.  
     - Mask is extrinsic blocker → disproves sufficiency of intrinsics.  
     - *Botch:* Ignoring mask’s extrinsicity or claiming Johnston fully wins.  
  5. **Conclude intrinsicality is insufficient**:  
     - Dispositions require "permissive" environments (no extrinsic masks).  
     - *Botch:* Vague claims (e.g., "context matters") without linking to intrinsicity debate.  

  **A vs. B Differentiation**:  
  - **A (17–20)**: Explicitly notes RCA’s *vacuous antecedent* under masking; ties Johnston’s failure to *extrinsic masks not altering intrinsic basis*; concludes dispositions are *relationally defined*.  
  - **B (13–16)**: Correctly diagnoses failures but misses RCA’s vacuity or Johnston’s extrinsicity nuance; concludes vaguely about "context-dependence".
