  For the marking scheme, I'll prioritize: 1) Correctly identifying fink vs. mask mechanisms 2) Showing how each theory handles them separately 3) Explaining why together they're lethal to CA/CC 4) Diagnosing Johnston's error 5) Extracting the intrinsicality lesson. The A/B differentiator will be catching that Johnston conflates causal basis with disposition ascription. 

