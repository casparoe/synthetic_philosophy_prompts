  Next, the Bayesian meta-analysis question: Turing's statistical work (Enigma, ACE computer) demonstrates practical Bayesian thinking, and his 1950 paper explicitly challenges frequentist dominance in psi research. However his demand for mechanistic explanations (stated clearly in morphogenesis papers) creates interpretive tension. While he'd certainly approve moving beyond NHST, scholars disagree on whether he'd accept base-rate calibration without physical models - Floridi and Piccinini offer contrasting views on how Turing weighted empirical evidence versus theoretical frameworks.

  For the speculative algorithmic telepathy concept: Turing's own work formally connects information theory to both machines (noisy channel coding) and biology (morphogenesis). His 1950 analogy between ESP and radio waves shows he'd likely embrace information-theoretic constraints as necessary, though possibly insufficient. But projecting engineered system properties onto biological cognition remains contested - Teuscher and Dresner debate how far Turing would extend this analogy. The narrative invention cleverly mirrors his own interdisciplinary approach.

