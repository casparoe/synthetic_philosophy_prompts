answer: |-
  Your Pluto case study is an inspired choice for exploring verbal disputes and metaontology, moving beyond stock examples into a rich, contemporary scientific controversy. Let's break it down through both directions of analysis:

  ### I. Theory Illuminating the Case: Pluto through the Lens of Verbal Disputes & Metaontology

  1.  **Is it a Merely Verbal Dispute?**
      *   **Yes, by Chalmers' Criteria:** Following David Chalmers ("Verbal Disputes," 2011), the core disagreement appears verbal. Both camps (IAU dynamical vs. Stern geophysical) agree on *all* relevant non-linguistic facts: Pluto's mass, composition, orbital characteristics, gravitational rounding, presence of an atmosphere (at times), moons, position within the Kuiper Belt, and the existence/comparative size of Eris. The disagreement centers solely on the *application conditions of the word "planet"* given these facts. They are arguing about which concept the term should express.
      *   **No, it's not *Idle*:** However, labeling it "merely verbal" doesn't render it trivial or idle (contra some early logical positivists). This is where Carnapian insights ("Empiricism, Semantics, and Ontology," 1950) and conceptual pragmatism shine:
          *   **Conceptual Choice with Stakes:** The choice of definition has significant practical and theoretical consequences:
              *   *Pedagogy & Public Understanding:* "8 planets" vs. "100+ planets" changes how we teach and conceptualize the solar system.
              *   *Scientific Focus & Resources:* A narrow definition focuses resources on studying a small set of dynamically dominant bodies. A broad definition encourages comparative planetology across diverse gravitationally rounded worlds (e.g., studying Pluto alongside Earth, Ceres alongside Mars).
              *   *Taxonomic Utility:* The IAU definition aims for exclusivity and dynamical significance within orbital zones. Stern's definition emphasizes a specific geophysical state (hydrostatic equilibrium) as scientifically significant regardless of dynamical context. Which grouping is more useful for specific scientific inquiries?
          *   **The "Something That Turns":** While no mind-independent fact *forces* one definition, genuine stakes exist in terms of conceptual coherence, scientific utility, communication efficiency, and even cultural resonance (the public outcry highlights this). The dispute is substantive *about which linguistic convention best serves scientific and communicative purposes*, not about Pluto itself.

  2.  **The Third Criterion ("Clearing the Neighborhood"): Vagueness and Status Judgment**
      *   **Smuggling Status?** Absolutely. The criterion is fundamentally about *dynamical dominance* within an orbital zone. It implicitly elevates bodies that have gravitationally controlled their orbital environment to the exclusion of significant peers. This isn't just a descriptive fact about mass or orbit; it's a judgment about *cosmological significance and primacy*. It marks the difference between a "major player" and a "resident" of a zone. This injects a normative element of "importance" or "dominance" into what purports to be a purely descriptive definition.
      *   **The Problem of Vagueness:** The criterion is notoriously vague and problematic:
          *   *Earth's Example:* As noted, Earth hasn't strictly "cleared" its orbit of Near-Earth Objects (NEOs) – thousands exist. The criterion relies on a fuzzy threshold of "dominance" (often interpreted quantitatively via the "Soter parameter" or similar metrics, but even these involve arbitrary cutoffs).
          *   *Context Dependence:* "Clearing" depends on the population density of the orbital zone. A body like Earth in a sparser region might "clear" more easily than one in a denser region like the Kuiper Belt. This makes the criterion sensitive to location, not just intrinsic properties.
          *   **Metaontological Implication:** This vagueness highlights that the IAU definition isn't simply "reading off" a natural kind. It's a *stipulation* involving pragmatic thresholds and value-laden judgments about what constitutes sufficient dominance, reinforcing the conventionalist perspective.

  ### II. Case Testing the Theory: What Pluto Tells Us About Metaontology

  1.  **The IAU Vote: Conventionalism Affirmed?**
      *   **Strong Support for Deflationism/Conventionalism:** The resolution *by vote* of a professional body is a paradigmatic example of *Carnapian linguistic framework choice*. There was no new discovery *about Pluto* that forced the change; the discovery of Eris exposed the inconsistency of the *old convention*. The IAU debated and voted on *how to define the term* within their scientific linguistic framework. This directly supports deflationary views (like Carnap's) and quantifier variantism: The answer to "Is Pluto a planet?" or "How many planets are there?" is determined by the adopted linguistic convention (the definition), not by a brute mind-independent fact awaiting discovery.
      *   **The Persistent Dissent: Undercutting Strict Deflationism?** The sustained dissent (Stern et al.) doesn't necessarily undermine conventionalism; it *exemplifies* it. It demonstrates that *different conceptual frameworks* (geophysical vs. dynamical) are available and advocated for based on differing judgments about scientific utility, naturalness, or scope. The "unresolved" feeling stems from the fact that the *choice itself* is contestable and has significant implications. It highlights that the convention isn't arbitrary in the sense of being *pointless*, but it *is* conventional in the sense of not being uniquely dictated by the non-linguistic facts. The dissent shows the *substantive nature of the conceptual choice*, not that there was a pre-existing ontological fact the IAU got wrong.

  2.  **The Core Metaontological Question: Is there a fact of the matter about the number of planets?**
      *   **Quantifier-Variantist Answer:** (e.g., Hirsch, *Quantifier Variance and Realism*, 2002, *passim*). A quantifier-variantist would emphatically say **NO**. There is no single, absolute, mind-independent fact of the matter. The truth of "∃x (Planet(x))" and thus the number satisfying the predicate depends entirely on the meaning assigned to "planet" within a chosen conceptual scheme or language. Within the IAU's "Dynamical Planet" language, there are 8 planets. Within Stern's "Geophysical Planet" language, there are over 100 planets. Neither language is "truer to reality" in an absolute sense; they simply carve up the celestial bodies differently for different purposes. The dispute is fundamentally about which language to speak.
      *   **Realist about Natural Kinds Answer:** (e.g., inspired by Kripke, Putnam). A realist would argue that there *is* a fact of the matter, grounded in whether "planet" picks out a genuine, objective natural kind. The realist would need to identify the essential properties defining this kind. They might argue:
          *   *For Dynamical Definition:* Perhaps "gravitationally dominant body in an orbital zone" reflects a real dynamical category relevant to solar system formation and evolution.
          *   *For Geophysical Definition:* Perhaps "gravitationally rounded body" reflects a fundamental geophysical threshold where distinct planetary processes (geology, atmosphere) emerge, making it a more ontologically significant kind.
      *   **Challenges for Realism in this Case:**
          *   *Lack of Consensus:* The vigorous, ongoing disagreement among experts undermines the realist claim that there's a single obvious natural kind being tracked.
          *   *Radical Heterogeneity:* The objects satisfying *either* definition (gas giants, rocky terrestrials, ice dwarfs, large moons under the geophysical def.) are incredibly diverse in composition, formation, and environment. This challenges the idea of a unified "natural kind" for planets.
          *   *The Role of Pragmatics:* The arguments for each definition heavily emphasize utility (for dynamics vs. geophysics), suggesting the choice is driven by human interests, not solely by discovering a pre-existing joint in nature. The dynamical definition's reliance on location (orbital zone) further complicates a purely intrinsic natural kind.
      *   **Which Position Fits Better?** The Pluto episode fits the **quantifier-variantist/deflationary/conventionalist** position remarkably well. The resolution by vote, the agreement on empirical facts coupled with definitional disagreement, the explicit arguments based on utility and clarity of taxonomy, the inherent vagueness in the dynamical criterion, and the persistent dissent advocating an equally coherent alternative framework all point towards the conclusion that the answer to "Is Pluto a planet?" and "How many planets are there?" is a matter of linguistic convention and conceptual choice, not the discovery of a mind-independent ontological fact. The realism about natural kinds struggles to account for the historical contingency, the arbitrariness of thresholds, and the clear role of pragmatic scientific goals in the dispute.

  ### Conclusion for Your Case Study

  The Pluto reclassification controversy provides a powerful, non-traditional case study demonstrating the core tenets of the verbal disputes literature and deflationary metaontology. It vividly illustrates:

  1.  How a dispute grounded in complete empirical agreement can nonetheless be profound and consequential – not because it's about mind-independent ontology, but because it concerns the crucial *choice of conceptual framework* for organizing knowledge and guiding inquiry ("substantive verbal dispute").
  2.  How scientific definitions often involve pragmatic thresholds, value-laden judgments (like dynamical dominance), and inherent vagueness, undermining simple realist interpretations.
  3.  How the resolution of such disputes often occurs through conventional means (like an IAU vote), directly supporting Carnapian conventionalism and quantifier variantism.
  4.  How persistent dissent doesn't refute conventionalism but rather highlights the existence of viable alternative frameworks and the substantive nature of the choice between them.
  5.  That the question "How many planets are there?" lacks a single, absolute, mind-independent answer. The answer depends on the meaning we assign to "planet" within our chosen linguistic framework, making quantifier variantism the most compelling metaontological interpretation of this specific episode. The Pluto saga is ultimately a lesson in the philosophy of language and conceptual engineering within science, not a discovery about Pluto's fundamental ontological status.
