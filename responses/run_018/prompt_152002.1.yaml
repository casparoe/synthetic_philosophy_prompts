  ## Carnap's Emotivism and Planning: Coherence at the Cost of Normative Evacuation

  Rudolf Carnap, a titan of logical empiricism, presents a profound philosophical tension. His meta-ethical stance, grounded in the verification principle, reduces normative and value judgments to non-cognitive expressions of attitude or practical decisions, devoid of truth-value. Yet, he simultaneously champions large-scale social and economic planning guided by scientific reasoning. This apparent contradiction—asserting the irrationality of value judgments while advocating rational planning—demands careful scrutiny. While a framework-instrumentalist reading offers a path to formal coherence, this resolution ultimately evacuates planning of substantive normative authority, rendering Carnap's vision politically hollow by its own lights.

  **The Contradiction Thesis: Planning Demands Justifiable Ends**

  Critics argue Carnap faces a straightforward contradiction. Social planning inherently involves selecting ends: *what kind of society do we want?* What constitutes "progress," "justice," "well-being," or "efficiency"? If, as Carnap insists ("Philosophy and Logical Syntax"), value judgments like "a planned economy is desirable" or "equality is good" are merely expressions of emotion or volition, akin to "Hurrah for planning!" or "Boo to inequality!", then these foundational choices for any plan lie beyond rational justification. They are arbitrary preferences.

  Planning, especially on the large-scale, technocratic model Carnap envisioned, is not merely instrumental calculation. Instrumental reasoning ("*Given* goal X, what is the most efficient means Y?") presupposes the prior rational selection or justification of X. If X itself is non-cognitively chosen, then the entire edifice of "rational planning" rests on an irrational, emotive foundation. The planner, in selecting ends, steps outside the domain of scientific reason Carnap mandates for the planning process itself. The planner's normative pronouncements ("We *should* aim for full employment") lack the cognitive content Carnap requires for rational discourse, stripping the plan of any normative authority beyond the power enforcing it. Planning becomes, at its core, the imposition of arbitrary preferences disguised as scientific rationality.

  **The Reconciliation Thesis: Framework Instrumentalism**

  Defenders propose a sophisticated reconciliation using Carnap's distinction between internal and external questions ("Empiricism, Semantics, and Ontology"). Internal questions are asked and answered *within* a linguistic framework using its rules (e.g., "Is there a prime number greater than 100?" within the framework of arithmetic). External questions concern the pragmatic choice *to adopt* a framework itself (e.g., "Should we use the thing-language or a sense-datum language?"). This choice, Carnap argues, is practical, not theoretical; it's based on expediency, fruitfulness, and convention, not truth.

  Applied to social planning:
  1.  **Framework Choice as External/Conventional:** The selection of fundamental social goals (e.g., maximizing aggregate utility, ensuring equal opportunity, promoting national power) is an *external* question. It is the practical decision to adopt a specific "value framework" or "planning framework." This choice is not rationally adjudicated by discovering objective moral truths (which Carnap denies exist) but is made through democratic agreement, cultural convention, or pragmatic considerations about what kind of society we collectively *want* to build. It's akin to choosing the rules of the game.
  2.  **Planning as Internal/Instrumental:** Once the value framework is conventionally adopted, scientific planning operates strictly *within* it. It involves answering internal, empirical, and logical questions: "Given our goal of maximizing utility (framework), which policy levers (tax rates, regulations, investments) will most efficiently achieve that end?" Science provides the means; logic ensures consistency. Rationality reigns supreme *within* the chosen framework.

  On this reading, there is no contradiction. Emotivism governs the *choice of the framework* (the ends), while scientific rationality governs the *implementation within the framework* (the means). Planning is rational *relative to* the conventionally chosen goals.

  **Evaluation: Coherence at the Cost of Substance**

  While the framework-instrumentalist reading successfully avoids a *formal* contradiction within Carnap's system, it does so by rendering the normative core of planning arbitrary and politically empty. This is not merely relocating the problem; it exposes a fundamental limitation inherent in Carnap's strict dichotomy between cognitive and non-cognitive discourse applied to social practice.

  1.  **The Arbitrariness of the Framework Choice:** Carnap provides no rational criteria for choosing *between* competing value frameworks. Democratic agreement is merely one conventional method; it offers no guarantee of normative validity or even basic coherence. A framework chosen by a tyrannical majority or powerful elite is, according to Carnap's meta-ethics, just as normatively grounded (or rather, ungrounded) as one chosen by an enlightened democracy. The choice is ultimately based on "attitudes" and "practical decisions" – precisely the non-cognitive elements his meta-ethics describes. This reduces the foundational act of setting social goals to a matter of contingent preference or power, devoid of rational justification.
  2.  **Evacuation of Substantive Normative Content:** The "rationality" of planning is confined to instrumental efficiency *within* the arbitrary framework. Planning becomes a sophisticated optimization engine, but the values it optimizes *for* lack any inherent normative weight beyond the initial conventional agreement. Carnap's system provides no resources to critically evaluate the framework itself. Is a framework aiming for maximal economic growth inherently better than one aiming for ecological sustainability or cultural preservation? Carnap's philosophy must answer: neither is cognitively "better"; it's merely a different choice of what to express ("Hurrah for growth!" vs. "Hurrah for nature!"). This strips the planner's work of any deeper normative meaning or authority. The plan is "rational" only in the narrowest technical sense, relative to arbitrarily chosen ends it cannot justify.
  3.  **The Illusion of Neutrality:** Positioning science as purely instrumental within a value framework masks the potential for the chosen framework itself to embed contestable normative assumptions that science then inadvertently reinforces. For instance, a framework prioritizing "economic efficiency" might implicitly define "efficiency" in ways that favor specific groups or ignore non-quantifiable values. Carnap's strict separation prevents science from critically interrogating the normative premises of the framework it serves, potentially lending the illusion of scientific neutrality to value-laden choices made at the conventional level.

  **Conclusion: Coherent Emptiness**

  Carnap's position is ultimately **coherent, but only at the cost of evacuating social planning of substantive normative content.** The framework-instrumentalist reading successfully integrates his emotivist meta-ethics with his advocacy for scientific planning by strictly separating the non-cognitive, conventional choice of ends (external framework adoption) from the cognitive, scientific optimization of means (internal framework application). This avoids a logical contradiction within the internal structure of his philosophy.

  However, this coherence is purchased by rendering the selection of society's most fundamental goals and values an arbitrary matter of convention, preference, or power, insulated from rational critique by the very principles of logical empiricism. The "rationality" of planning is reduced to technical prowess in service of ends that are themselves ultimately expressions of attitude ("volition" or "emotion" in Carnap's terms). Consequently, while Carnap's planner can be a brilliant technician optimizing within a given framework, they are philosophically disarmed from providing any *substantive rational justification* for the framework itself or the social vision it embodies. The grand project of rational social planning, intended to guide humanity towards a better future, is left normatively unmoored, its ultimate ends resting on the same non-cognitive foundation as a simple exclamation of desire. Carnap's system achieves internal consistency, but at the profound cost of draining his vision of rational societal guidance of its normative soul.
