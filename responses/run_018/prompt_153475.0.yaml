answer: |-
  Here's your five-point pitch:

  1.  **The Question:** Does Burke's presumption in favor of existing institutions remain coherent once we acknowledge that some institutional "fences" (per Chesterton) were explicitly designed with malicious or exclusionary intent (e.g., historical voting restrictions, exclusionary zoning), and does Chesterton's principle truly require investigating the *original builder's intent* or merely assessing the fence's *current function*?

  2.  **The Gap:** Standard conservative appeals to these principles often lump them together as a simple "go slow" rule, sidestepping the messy reality where preserving the institution means preserving historical injustice; they rarely grapple head-on with whether the *reason* the fence was built matters for applying either principle when exclusion is the obvious original function.

  3.  **What I'll Do:** I'll conduct two focused case studies (e.g., the dismantling of property-based voting qualifications and the evolution of exclusionary zoning challenges) to see how these principles were invoked or ignored historically, then map the conceptual tensions between Burke's blanket institutional deference and Chesterton's condition that we must "know the use" – especially when that "use" was malicious.

  4.  **Success/Failure:** Success means clearly articulating *how* and *why* these principles conflict in cases of malicious fences, showing whether Burke's stance can adapt or collapses. Failure would be leaving the tension muddy or just confirming they *can* clash without clarifying the nature or implications of that clash.

  5.  **Feasibility:** Six months part-time is tight, but it's enough for two deep dives and conceptual mapping if I stay ruthlessly focused; I might not resolve the big philosophy, but I *will* deliver a concrete analysis of the clash in practice and a clearer framework for questioning these rules of thumb.
