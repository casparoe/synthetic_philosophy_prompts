  Hmm, they're rejecting the standard "perfect duplicate with no inner light" approach as circular. Smart critique. The real meat is in isolating affective absence from sensory qualia - that's the novel twist they want explored. Their specification about fMRI and micro-expressions shows they understand the behaviorist challenges to zombie arguments. 

  The clinical pain unit setting is clever - it forces the affective/sensory distinction into sharp relief. Pain is perfect because it has both discriminative (sensory) and affective components neurologically documented. Patient C is the key innovation here: someone who feels the "sharpness" but not the "suffering". Must ensure C's descriptions stay identical to A's - "unbearable" must be uttered with identical conviction despite no actual distress. 

  For the conceivability walkthrough: A-vs-B should feel straightforwardly conceivable (the classic zombie). But A-vs-C needs careful handling - why does stripping only affect feel less metaphysically jarring? Probably because affect is more tied to functional roles (motivation, learning) while sensory qualia feel more "raw". The physicalist counterargument writes itself: of course we can't imagine missing affect without altering function - because affect is functional! 

  Dropping fMRI constraint would indeed collapse it back to standard zombie territory. The strict behavioral/neural indistinguishability is what makes C philosophically interesting rather than just a stoic person. 

