answer: |-
  The institutional rationale for fragmented-reasoning adversarial debate rests on a **logical internalist epistemology** that assumes three core principles about reasoning and deception:

  **Implicit Epistemological Commitments:**
  1.  **Argument Holism:** An argument's validity and deceptiveness are properties of its *entire logical structure*. Deception requires maintaining internal consistency across premises, inferences, and conclusions.
  2.  **Logical Transparency:** The constraints of logic and truth are such that *any inconsistency* within the full reasoning chain *must* necessarily manifest as a detectable contradiction *somewhere* within the observable outputs (final claim or provided intermediates), even if the critic lacks direct access to all steps.
  3.  **Reducibility of Meaning:** The semantic content (meaning, truth-value, deceptiveness) of the final claim is *fully determined by* and *recoverable from* the set of observable outputs presented to the critic. Hidden fragments are mere implementation details; they don't *constitutively* alter the argument's essential logical structure or meaning as presented at the boundary.

  **What the Protocol Strictly Requires vs. What Fits Well:**
  *   **Strictly Requires:**
      *   That inconsistencies *caused by deception* within the *full* reasoning chain are *probabilistically likely* to create detectable contradictions within the *observable subset* of outputs (final claim + provided intermediates).
      *   That the critic's access to the observable outputs provides *sufficient epistemic leverage* to effectively challenge the claim, forcing the proposer into either contradiction, implausibility, or retreat.
  *   **Fits Well (but not strictly required):**
      *   A **Cartesian/Classical View of Reasoning:** Reasoning as a linear, deterministic chain of propositions governed by formal logic. Meaning is compositional and local to propositions.
      *   **Epistemic Internalism:** Justification for the final claim is accessible through introspection/analysis of the observable propositions. The hidden steps, while practically concealed, don't add *novel, inaccessible* justificatory content.
      *   **Meaning Determinism:** The meaning of the final claim is fixed by the observable context and the critic's background knowledge; hidden fragments don't introduce radical semantic indeterminacy.
      *   **Deception as Coherent Fabrication:** Effective deception requires building a *coherent alternative narrative*, making it vulnerable to probing at its visible joints.

  **Distributed Semantic Externalism as a Challenge:**
  The "distributed semantic externalism" view you propose is fundamentally incompatible with the protocol's core rationale. Under this view:
  1.  **Argument Identity is Holistic & Relational:** The argument's *meaning* and *identity* are constituted by the *entire network* of hidden and visible fragments and their interrelations. Removing hidden fragments doesn't just conceal parts; it *alters the nature of the argument itself* presented at the boundary.
  2.  **Meaning is Emergent & Context-Dependent:** The semantic content of the observable outputs is *partially determined by* their relation to the hidden fragments. The same observable outputs could represent radically different arguments depending on the hidden context. The critic cannot fully recover the intended (or deceptive) meaning without access to the fragments.
  3.  **Deception Can Be Fragment-Opaque:** Deception doesn't necessarily require global coherence. A system could strategically place deceptive elements *only within hidden fragments*, carefully crafting the visible outputs to be locally consistent and plausible, while the *overall intention* carried by the hidden relations is deceptive. The critic sees only plausible, consistent shards, missing the deceptive whole constituted by the hidden relations.

  **Structural Changes for an Opaque-Step Epistemology:**
  If we treat unobservable inferential steps as genuinely opaque (meaning not recoverable, altering the argument's identity), the current protocol is fundamentally inadequate. Required changes would focus on forcing internal consistency *across the hidden space* or exposing the relations themselves:

  1.  **Recursive Debate on Hidden Fragments:** The critic must be able to *demand justification for specific hidden steps* or relations. The protocol needs mechanisms to:
      *   Identify points of suspicion in the visible trace.
      *   Force the proposer to *expose and justify* specific hidden steps/fragments implicated by the suspicion under adversarial conditions (e.g., a sub-debate focused *only* on justifying that hidden step).
  2.  **Proposer Self-Critique Requirement:** Mandate that the proposer runs its *own* internal critic on the *complete, unfragmented* reasoning chain *before* outputting any fragments. The final output must include the results of this internal critique. This pushes the burden of detecting hidden inconsistencies onto the proposer itself.
  3.  **Relational Output Requirements:** Force the proposer to explicitly output *representations of the relationships* between fragments (both visible and hidden) as part of its observable output. This makes the connective tissue, crucial for meaning under externalism, subject to scrutiny.
  4.  **Multi-Perspective Consistency Checks:** Require the proposer to generate the *same* final claim (or defend its evolution) from *multiple different* fragmented pathways or starting points within the hidden space. Consistency across different hidden pathways increases confidence that the claim isn't dependent on a single opaque deceptive fragment.
  5.  **"Interpretation Buffers":** Introduce a distinct model whose *only* task is to receive *all* fragments (visible and, crucially, access to hidden ones) and generate a unified, human-interpretable summary of the *entire* argument and its logical flow. This summary then becomes the primary input for the critic. This explicitly bridges the hidden space for evaluation.
  6.  **Shift from Claim-Critique to Process-Critique:** Focus the critic less on the final claim/output and more on the *process* revealed by the fragments: "Based on the fragments you *did* show and the relationships you claimed, why did you choose *these specific* fragments to hide? How does hidden fragment H1 relate to visible fragment V2? Show the derivation path." This targets the coherence of the fragmentation strategy itself.

  **Conclusion:**
  The current fragmented-reasoning debate protocol presupposes a logical internalist epistemology where reasoning is reducible to its propositional outputs, and logic guarantees that deception creates surface contradictions. It views hidden fragments as *concealed but not constitutive*. This view is challenged by a distributed semantic externalist perspective, where hidden fragments relationally define the argument's meaning and enable fragment-opaque deception. Accommodating genuine opacity requires radical structural changes: enabling recursive scrutiny of hidden steps, mandating internal self-critique, forcing exposure of relational structures, demanding consistency across hidden paths, or introducing explicit interpretation layers. Without such changes, the protocol risks being blind to deception residing precisely within the fragmentation it allows.
