  ### **"Threshold Commons" Simulation: Design and Execution Guide**  

  **Objective**: Create an experiential understanding of the tragedy of the commons, emphasizing **hidden nonlinear depletion**, **information asymmetry**, and **abrupt collapse**. Participants face a shared resource that degrades slowly at first but collapses past a hidden threshold.  

  ---

  ### **Game Setup & Materials**  
  **Participants**: 16 players (harvesters).  
  **Resource**: A shared pool starting at **100 points**.  
  **Harvest Rules**:  
  - Each player secretly submits a harvest value (0–5 points) per round.  
  - Total harvest = sum of all submissions.  
  - **Resource Update**:  
    - After harvest: `Resource_after = max(0, Current_Resource - Total_Harvest)`  
    - **Hidden Regeneration**:  
      - If `Resource_after > 60` → New resource = `min(100, Resource_after * 1.2)`   *(Healthy: 20% regrowth)*  
      - If `30 ≤ Resource_after ≤ 60` → New resource = `min(100, Resource_after * 1.1)`   *(Stressed: 10% regrowth)*  
      - If `Resource_after < 30` → **Collapse**: Resource drops to **0** permanently.  

  **Information Asymmetry**:  
  - Players only know the **qualitative state** at the start of each round:  
    - **"Abundant"** (Resource > 60)  
    - **"Stressed"** (30 ≤ Resource ≤ 60)  
    - **"Collapsed"** (Resource = 0; game ends).  
  - After each round, the facilitator announces:  
    - Total harvest.  
    - Next state (e.g., "Next round: Stressed").  

  **Payoffs**:  
  - Players earn points = their harvest each round.  
  - If the resource collapses, **all future earnings = 0**.  
  - **Non-monetary stakes**: Total points convert to coffee vouchers (e.g., 10 points = 1 voucher).  

  **Materials**:  
  - Slips of paper for harvest decisions.  
  - Whiteboard tracking: Round, State, Total Harvest, Next State.  
  - Calculator (for facilitator).  

  ---

  ### **Timeline (90 Minutes)**  
  **1. Introduction (10 min)**:  
    - Explain: "You are harvesters of a shared resource. Maximize your points over multiple rounds."  
    - Rules: Individual harvests (0–5), qualitative states, collapse risk.  
    - **Goal**: "Avoid collective collapse while earning points."  

  **2. Simulation Rounds (40 min)**:  
    - **Round Structure (3 min/round; ~12 rounds max)**:  
      1. **Announce state**: "Round [X]: Resource is [Abundant/Stressed]."  
      2. **Decide**: Players write harvest (0–5) secretly.  
      3. **Calculate**: Facilitator sums harvest, updates resource.  
      4. **Announce**: "Total harvest: [Y]. Next round: [New State]."  
      5. **Record**: Update whiteboard.  
    - **Collapse Condition**: If `Resource_after < 30`, announce: "Resource collapsed! All future rounds = 0 points."  
    - **Early End**: If collapsed before Round 12, proceed to debrief.  

  **3. Debrief (40 min)**:  
    - **Experience Sharing (10 min)**:  
      - "When did you first worry about collapse?"  
      - "Did anyone try to cooperate? What happened?"  
    - **Reveal Mechanics (5 min)**:  
      - Show the hidden thresholds (60/30) and nonlinear regrowth/collapse.  
      - Highlight: "Early overharvest felt safe but pushed the resource toward collapse."  
    - **Concept Mapping (15 min)**:  
      | **Game Moment**          | **Concept**                                                                 |  
      |--------------------------|-----------------------------------------------------------------------------|  
      | First defection           | **Free-riding**: Individual gain vs. collective loss.                       |  
      | Failed negotiations       | **Coordination failure**: Lack of enforcement → incentives to cheat.        |  
      | Collapse revelation       | **Nonlinear tipping points**: Real-world examples (fisheries, climate).     |  
      | Qualitative states only  | **Monitoring costs**: Hard to measure depletion in commons (e.g., groundwater). |  
      - **Key Distinction**:  
        - **Rivalrous commons** (this game): Your harvest reduces what’s left for others.  
        - **Non-rivalrous public goods** (e.g., open-source code): Your use doesn’t deplete others’ access.  
    - **Limitations (5 min)**:  
      - "This game can’t capture **intergenerational stakes** (e.g., future generations) or **legal enforcement**. In reality, these shape long-term outcomes."  
    - **Solutions Discussion (5 min)**:  
      - "How could quotas, communication, or monitoring have helped?"  
      - Relate to workplace: "Shared codebases, team bandwidth—similar dynamics!"  

  ---

  ### **Predicted Problems & Recovery**  
  1. **Problem: Early Collapse (Round 2–3)**  
     - Cause: Everyone harvests 5 → immediate collapse.  
     - **Recovery**: Restart with a twist: Allow 2 min of group negotiation before Round 1. Discuss how coordination changed behavior.  

  2. **Problem: Over-Caution (No Collapse)**  
     - Cause: Players harvest ≤2 → resource stays healthy.  
     - **Recovery**: Reveal the hidden thresholds anyway. Discuss: "Why did you cooperate? How does this mirror real-world successes?"  

  3. **Problem: Defiance ("I’ll harvest 5 anyway!")**  
     - **Recovery**: Let it unfold. Post-game, ask defectors: "Did you expect others to restrain themselves?" Highlight the role of trust.  

  4. **Problem: Time Overrun**  
     - **Recovery**: After Round 8, announce: "Last 2 rounds!" → forces risk-taking.  

  ---

  ### **Facilitator Notes**  
  - **Emphasize Uncertainty**: "You know the states but not the numbers or thresholds—just like real commons!"  
  - **Track Key Moments**: Note first defector, collapse round, and negotiation attempts for debrief.  
  - **Stakes Reminder**: "Points = coffee vouchers, but the goal is learning, not winning."  
  - **Ethical Twist**: When announcing collapse, add: "Even those who harvested lightly lose everything."  

  ### **Why This Works**  
  - **Hidden Thresholds** force players to grapple with uncertainty and delayed consequences.  
  - **Qualitative States** simulate real-world monitoring challenges.  
  - **Abrupt Collapse** creates emotional impact, making the tragedy feel visceral, not theoretical.  

  Run this, and your colleagues will leave debating CO₂ quotas—not coffee vouchers. ☕️🔥
