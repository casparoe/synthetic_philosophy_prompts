prompt: |-
  I serve as an ethics compliance officer for multi-agent research consortia combining human scientists with autonomous predictive systems, and I need a reusable procedure to determine whether a distributed project—such as joint climate-modeling—counts as genuine collective intentionality rather than coordinated individual action, because that distinction governs collective responsibility for erroneous outputs. The procedure should translate the conditions for shared cooperative activity into a step-by-step checklist with explicit stop points where analysis ends and value judgment takes over, and it must be applied to three hard cases: a human sets the goal while an algorithm adjusts sub-goals without capacity to reject them; two humans share an intention but an algorithm executes all physical actions; and every agent shares the task representation yet one human secretly intends failure. Present the response as exactly five numbered points—procedure outline, first case, second case, third case, and the procedure's unavoidable limits—each consisting of one or two sentences, with no introduction or conclusion, and include one case where the assigned collective responsibility conflicts with intuitive blame.
reasoning: |-
  We are creating a reusable procedure to determine if a distributed project counts as genuine collective intentionality (as opposed to coordinated individual action) for the purpose of assigning collective responsibility. The procedure is based on the conditions for shared cooperative activity (SCA). We'll outline the procedure and then apply it to three hard cases.

  The typical conditions for SCA (as per Bratman, Gilbert, etc.) include:
  1. Mutual responsiveness: Agents are responsive to each other's intentions and actions.
  2. Commitment to the joint activity: Each agent is committed to the joint activity and adjusts their actions accordingly.
  - Also, the commitment is interdependent (each is committed because the others are).
  3. Commitment to mutual support: Agents are committed to supporting each other as needed to achieve the shared goal.

  We translate these into a step-by-step checklist with stop points for judgment:

  **Procedure Outline (Point 1):**
  The procedure is a three-step checklist: (1) Check for mutual responsiveness and interdependent commitment by verifying that each agent has a we-intention (intending the joint activity as a group) and adjusts based on others; (2) Assess commitment to mutual support by confirming each agent would help others if needed; (3) If both conditions hold, assign collective intentionality and thus collective responsibility; if either fails, it's coordinated individual action. Stop points occur after step (1) and step (2) where value judgments are required to interpret evidence of we-intentions and mutual support.

  **First Case (Point 2):** A human sets the goal while an algorithm adjusts sub-goals without capacity to reject them. Applying the procedure: Step (1) fails because the algorithm lacks a we-intention (it cannot form intentions, only execute pre-programmed responses), so it's coordinated individual action; stop at step (1) with a judgment that the algorithm is not an intentional agent. Collective responsibility does not apply.

  **Second Case (Point 3):** Two humans share an intention but an algorithm executes all physical actions. Applying the procedure: Step (1) passes (humans have we-intentions and mutual responsiveness), step (2) passes (humans are committed to mutual support), so it's collective intentionality; the algorithm is a tool. Collective responsibility lies with the humans.

  **Third Case (Point 4):** Every agent (including humans and systems) shares the task representation yet one human secretly intends failure. Applying the procedure: Step (1) fails because one human lacks the we-intention (secretly intending failure breaks interdependent commitment), so it's coordinated individual action; collective responsibility does not apply to the group as a whole. However, note that this case conflicts with intuitive blame: the group may be blamed for not detecting the saboteur, but the procedure avoids collective responsibility for the erroneous output.

  **Unavoidable Limits (Point 5):** The procedure relies on judgment at stop points about agents' intentions and capacities (e.g., whether an algorithm has intentional states), which may be ambiguous; also, it cannot resolve conflicts when responsibility intuitively seems collective but the conditions fail (as in the third case), leaving a gap between ethical intuition and formal assignment.
answer: |-
  1. **Procedure Outline**: The checklist verifies: (1) mutual responsiveness (agents adjust actions based on others' intentions and actions) with interdependent commitment (each commits to the joint goal contingent on others' commitment), requiring judgment on whether agents exhibit we-intentions; if absent, stop and classify as coordinated individual action. (2) Commitment to mutual support (agents would assist others if needed), requiring judgment on evidence of backup behavior; if absent, stop and classify as coordinated action—if both conditions hold, classify as collective intentionality.  
  2. **First Case (human sets goal, algorithm adjusts sub-goals)**: Mutual responsiveness fails as the algorithm cannot form we-intentions (lacks capacity to reject or commit), stopping analysis at step (1); it is coordinated action, exempting the algorithm from collective responsibility despite its role in errors.  
  3. **Second Case (two humans share intention, algorithm executes actions)**: Both conditions hold: humans exhibit mutual responsiveness and commitment (step (1)), and mutual support (step (2)), making it collective intentionality; the algorithm is a non-responsible tool, so humans bear full collective responsibility for errors.  
  4. **Third Case (all share task, one human secretly intends failure)**: Interdependent commitment fails as the saboteur lacks genuine we-intention (step (1)), stopping analysis; it is coordinated action, voiding collective responsibility despite shared task representation—this conflicts with intuitive blame, as other agents may be blamed for oversight.  
  5. **Unavoidable Limits**: Judgment at stop points introduces subjectivity (e.g., inferring we-intentions from observable behavior); the procedure cannot resolve cases where collective responsibility feels intuitive but conditions fail, or where non-human agents' "intentions" are ambiguous.
