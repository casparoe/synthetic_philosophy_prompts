     - Strategy 2: Continue (C) at every junction. Then:
          - At the first junction: continue -> go to second junction.
          - At the second junction: continue -> payoff 1.
          Total payoff = 1.

     But wait, what if the driver exits at the second? They can't condition on being at the second. They have to choose the same action at both. So they cannot do one thing at the first and another at the second.

     However, the driver can choose a mixed strategy: at each junction, they choose to continue with probability q and exit with probability 1-q.

     Now, let's compute the expected payoff.

     The driver starts at junction 1. They choose to continue with probability q -> then they get to junction 2. With probability 1-q, they exit at junction 1 and get 0.

     At junction 2 (if they get there), they again choose to continue with probability q (yielding payoff 1) or exit with probability 1-q (yielding payoff 4). 

     Therefore, the expected payoff is:

        P(exit at junction 1) * 0 + P(continue at junction 1) * [ P(exit at junction 2) * 4 + P(continue at junction 2) * 1 ]

        = (1-q) * 0 + q * [ (1-q)*4 + q*1 ]
