prompt: |-
  A colleague sent me this argument in our ethics seminar and I keep circling it: it seems to show that Scanlonian contractualism either licenses killing one innocent person to save five or collapses into total decision paralysis, but I cannot name the exact misstep. (1) Contractualism holds that an act is wrong just in case it violates a principle that no affected party could reasonably reject, where rejection is assessed by comparing the burden the principle imposes on the rejecter to the burden its rejection would impose on others. (2) In the aggregation case, principle F forbids killing one to save five; principle A permits it. (3) Under F, the five each face death; under A, the one faces death. (4) Each of the five can reject F: being permitted to die is a burden of the same kind—death—as the burden the one faces under A. (5) The one can reject A on identical grounds. (6) Because there are five rejecters of F and only one rejecter of A, and because the strength of each rejection is equal (life against life), the aggregate weight of reasonable rejection against F is five times that against A. (7) Therefore A survives contractualist scrutiny and F does not: contractualism requires killing the one. (8) But Scanlon insists that contractualism rejects precisely this aggregation and forbids the killing. (9) To block (7), Scanlon must deny that rejections sum across persons. (10) Yet if they do not sum, then in every conflict case—where some reject the permissive principle and others reject the prohibitive one—we lack any metric for comparison, leaving contractualism silent. (11) So contractualism either aggregates and mandates the killing, or refuses aggregation and offers no guidance. Which step should I reject, and what does giving it up cost? I would prefer to keep (1) and (9), but I want to know what I am paying if I do.
reasoning: |-
  Okay, let me start by understanding the core problem here. The user is grappling with an argument against Scanlonian contractualism that presents a dilemma: either it allows killing one to save five, which Scanlon explicitly rejects, or it leads to decision paralysis because it can't handle conflicts without aggregating burdens. The user wants to know where the misstep is and what the cost of rejecting that step is, especially if they want to keep the core definition (1) and the non-aggregation point (9).

  First, I need to recall Scanlon's contractualism. The key is that reasonable rejection isn't about summing burdens across individuals but comparing individual complaints. So in the trolley problem, each of the five has a complaint against a principle that forbids killing the one to save them. But their complaints are separate. The one person has a complaint against being killed. Scanlon argues that the complaint of the one who would be killed is stronger than any single complaint of the five because the one faces a direct harm (being killed) versus the five not being saved. So the burden on the one is different in kind or severity.

  Step (4) in the argument states that each of the five can reject F (the no-kill principle) because they face the same burden (death) as the one under A. But that's where the mistake might be. Under F, the five aren't actively harmed; they're not saved. Scanlon differentiates between causing harm and allowing harm. The one under A is directly killed, which is a different type of burden. So the complaint of the one is stronger individually than any one of the five.

  The user's colleague’s argument assumes that the burdens are comparable one-to-one. But Scanlon says they're not. Each of the five has a complaint, but it's about not receiving aid, whereas the one is being used as a means. So step (4) is problematic because it equates the burdens without considering the qualitative difference. 

  If the user rejects step (4), they maintain that the one’s complaint is stronger per person, so even though there are five, the aggregate doesn't outweigh the single complaint. But then, as in step (10), how does contractualism resolve conflicts without aggregation? The cost here is that Scanlonian contractualism can't handle cases where numbers might matter, like in saving larger groups. Scanlon does allow some aggregation in cases of lesser burdens, but for severe harms like death, he might still avoid it.

  Another point is the distinction between principles that directly cause harm versus those that allow harm. The principle permitting killing (A) involves actively causing death, which is a heavier burden than the principle that forbids killing (F), which results in letting five die. So the type of burden differs, making the rejections not symmetrical. Step (4) ignores this distinction, treating the burdens as identical when they're not.

  The user wants to keep (1) and (9), so rejecting aggregation. The cost is that contractualism might struggle with large-number cases where aggregation seems intuitive. For example, saving a million versus one. Scanlon might still argue that directly harming one is impermissible, but this could lead to counterintuitive results. However, he might bite the bullet here to avoid justifying harming individuals for the greater good.

  In the seminar context, the user needs to defend Scanlon against this dilemma. The key is emphasizing the qualitative difference in burdens and the non-aggregative nature. The misstep is step (4), equating the burdens without acknowledging the moral distinction between killing and letting die, or direct vs. indirect harm. Rejecting step (4) allows contractualism to prohibit the killing without paralysis because the one's complaint is individually stronger.
answer: |-
  The misstep is **Step (4)**: *"Each of the five can reject F: being permitted to die is a burden of the same kind—death—as the burden the one faces under A."*  
  This falsely equates two *morally distinct burdens* under Scanlonian contractualism. Rejecting Step (4) preserves Scanlon’s core anti-aggregation stance while avoiding paralysis. Here’s the breakdown:

  ### Why Step (4) is Wrong
  1. **Asymmetry of Burdens**:
     - **Under Principle F (no killing)**: The five die due to *non-intervention* (a "failure to save"). Their complaint is about being *denied aid*.  
     - **Under Principle A (kill one)**: The one is *actively killed* (a "direct harm"). Their complaint is about being *used as a means* to save others.  
     Scanlon argues these burdens are **qualitatively different** (*What We Owe to Each Other*, §5.3). Directly causing death imposes a *greater personal burden* than being allowed to die. The one’s loss is *worse* because it involves intentional violation of bodily autonomy.

  2. **Reasonable Rejection Requires Individual Strength**:
     - The five *cannot* reasonably reject F because **no single person** in the group of five suffers a burden *greater than* the burden the one would suffer under A.  
     - The one *can* reasonably reject A because their burden (being killed) is *individually worse* than the burden any *single one* of the five faces under F (not being saved).  
     - **Crucially**: Contractualism compares *individual* complaints, not group totals. Each of the five must justify rejecting F based *solely on their own burden*, not by pooling their complaints.

  ### How This Resolves the Dilemma
  - **Against (7)**: A (kill one) *is* reasonably rejected by the one, while F (no killing) is *not* reasonably rejected by any single member of the five. Thus, F is permissible, and A is wrong.  
  - **Against (10)**: Contractualism avoids paralysis because:  
    - When burdens are *asymmetric* (e.g., killing vs. letting die), one principle can be rejected while the other cannot.  
    - When burdens *are symmetric* (e.g., identical harms), Scanlon allows limited aggregation (*What We Owe*, p. 229–234). For example, saving many from minor harms vs. one from major harm may permit aggregation. But death is a "threshold" where aggregation is forbidden.

  ### What You Pay by Rejecting Step (4)
  - **Cost 1: Sacrificing intuitive aggregation in life/death cases**.  
    You must accept that contractualism *cannot* justify killing one to save any number of lives, no matter how large (e.g., killing one to save a million). This clashes with utilitarian intuitions but aligns with Scanlon’s deontological commitments.  
  - **Cost 2: Burden of proof on qualitative distinctions**.  
    You must defend the asymmetry between *killing* and *letting die* (or similar distinctions like *intended harm* vs. *foreseen harm*). Critics (e.g., Judith Jarvis Thomson) argue this distinction is morally arbitrary.  
  - **Cost 3: Edge cases require careful judgment**.  
    When burdens are qualitatively similar (e.g., diverting a trolley to kill one vs. letting it kill five), Scanlon’s framework may still prohibit killing, but this demands nuanced justification.  

  ### Why This Preserves (1) and (9)
  - **(1) holds**: Wrongness still depends on reasonable rejectability.  
  - **(9) holds**: Rejections *never* sum across persons; only individual burdens matter.  
  - **Paralysis is avoided** because conflicts are resolved by comparing *strength of individual complaints*, not by aggregating or summing.  

  ### Key Scanlonian Quotes for Defense
  > "The justifiability of a moral principle depends only on **individuals’ reasons for objecting to that principle** and alternatives to it." (*What We Owe*, p. 229)  
  >  
  > "When we focus on **a single person’s burden**, the loss of each of the five [not saved] seems *less* than the loss imposed on the one [killed]." (Scanlon, "Contractualism and Utilitarianism")

  ### Conclusion
  Reject **Step (4)**. The burden on the one (being killed) is *not* the same kind of burden as that on the five (not being saved). This retains Scanlon’s prohibition on killing the one without collapsing into paralysis. The cost is accepting contractualism’s refusal to aggregate severe harms like death—a feature, not a bug, for anti-utilitarians. If your seminar leans consequentialist, expect pushback, but Scanlon’s asymmetry defense is robust in deontological ethics.
