answer: |-
  **Commissions should prioritize addressing the addressal burden through recontextualization or removal, as the functional necessity of using the name imposes non-consensual symbolic labor on residents that distinguishes it from passive monuments.** The fused honoring/recording function in street names creates unique ethical pressures:

  1.  **Addressal Burden as Distinctive:** Unlike statues or plaques, street names require *active verbal invocation* by residents for daily tasks (e.g., deliveries, registrations, introductions). This transforms passive exposure into compelled speech, forcing residents to personally utter an honorific they may reject, embedding the commemoration within their identity ("I live on X Street"). Statues are observed; street names are *performed*. This daily performance creates a tangible harm that demands remediation.

  2.  **Implications for Commission Options:**
      *   **Retention (Status Quo):** Becomes ethically problematic as it perpetuates the addressal burden. It tacitly accepts that residents must bear the cost of preserving the historical record through forced endorsement. This is only minimally justifiable if overwhelming resident consensus supports it *and* robust recontextualization is implemented.
      *   **Removal (Renaming):** Directly alleviates the addressal burden, signaling that present endorsement is withdrawn. While it risks obscuring the historical record of past values, commissions can mitigate this through parallel archival efforts (e.g., plaques, online histories, educational programs) that document the *previous* name and its context *without* requiring its daily use. The burden of preserving the "record" function shifts from residents to institutional archives.
      *   **Recontextualization:** Offers the most nuanced path but *must* directly target the addressal burden. Adding plaques or QR codes near street signs addresses the passive "recording" function by explaining the problematic history, but *does not* eliminate the core burden of residents having to *say* the name. Truly effective recontextualization requires pairing supplemental signage with practical measures like facilitating optional address alternatives for residents (e.g., approved neighborhood names for use in non-official contexts) or community acknowledgment programs.

  3.  **Navigating Honoring vs. Recording:** The embedded nature of street names means the "honoring" function persists as long as the name remains the functional identifier. Commissions cannot separate the functions in practice. Therefore, the decision must center on whether the *current functional use* constitutes an unacceptable endorsement *given the burden imposed*. If the burden is deemed severe (e.g., names tied to genocide, slavery, severe oppression), removal is ethically imperative. For less extreme cases, recontextualization focused on mitigating the burden and explicitly disavowing the honor becomes the primary tool. The "record" must be preserved *outside* the functional infrastructure.

  **Confidence:** High (85%) on the distinctiveness of the addressal burden and the prioritization of addressing it through removal/recontextualization. Least certain about the practical effectiveness of specific recontextualization strategies (like optional address alternatives) in genuinely alleviating the psychological and social weight of the addressal burden for residents. More evidence is needed on resident experiences with such measures.
