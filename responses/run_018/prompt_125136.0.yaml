  The four splits are chosen to isolate the key points of tension between Buddhist ethics and consequentialism. The karma split addresses the mechanism of moral causation: if karma tracks welfare outcomes, it aligns with consequentialism; if it is about mental states or ritual, it diverges. The Bodhisattva split tests whether the core altruistic vow requires optimization (consequentialist) or non-comparative responsiveness (anti-aggregation). The emptiness split examines the metaphysical foundation for aggregation: without robust individuation, aggregation falters. The two-truths split addresses the epistemological status of consequentialist reasoning: is it a valid conventional tool or inherently flawed? Together, these cover ontology (emptiness), agency (karma), value theory (Bodhisattva), and meta-ethics (two truths). The concrete scenario serves as a diagnostic tool by forcing a choice between direct relief (which may align with non-aggregating compassion) and indirect merit-generation (which may align with aggregative reasoning). If a framework endorses the latter, it leans toward consequentialism; if the former, it rejects aggregation. This case also tests whether the framework allows for trade-offs between immediate and long-term welfare, a hallmark of consequentialism.

