prompt: |-
  I am a doctoral candidate in comparative philosophy working at the intersection of South Asian moral thought and analytic normative ethics. For a workshop handout, I need a conceptual taxonomy—structured as a branching decision tree—that sorts positions on whether Buddhist ethical frameworks can accommodate consequentialist reasoning about sentient welfare. I want this to move well beyond the familiar debate over whether Buddhism is consequentialist; instead, the tree should diagnose precisely where the frameworks come apart on ontology, agency, and value aggregation.

  Please construct the tree from the logical space rather than from named scholars or schools. The root question should be: does Buddhist ethical practice aim at the maximization of aggregate welfare across sentient beings? From there, branch on the following four splits.

  First, does karma function primarily as a causal mechanism tracking welfare outcomes for agents, or does it operate mainly through mental purification or ritual efficacy that is not scaled by outcome magnitude? Second, does the Bodhisattva commitment to liberate all beings entail an obligation to optimize welfare outcomes across populations, or does it mandate only a cultivated responsiveness to suffering that refuses to aggregate across individuals? Third, does the doctrine of emptiness undermine the individuated agent-patient ontology that consequentialist calculation requires, or does conventional designation preserve enough structural reality to support aggregation? Fourth, does the conventional-ultimate truth distinction permit consequentialist reasoning only instrumentally at the conventional level, or does it render such reasoning ultimately incoherent?

  Each internal node should be phrased as a concrete claim or case that a respondent could evaluate without knowing scholarly labels in advance. Include at least one branch that turns on a specific scenario: imagine a practitioner who can either relieve intense suffering in one being immediately or perform an action traditionally understood to generate merit benefiting many beings only indirectly. The answer patterns should map onto named logical positions at the leaves—for example, karma-tracking welfare maximization with intact conventional agents; non-aggregating compassionism with empty ontology; instrumental conventional consequentialism paired with ultimate silence; and combinations thereof.

  Please identify any unoccupied combinations in the logical space—particularly a view that accepts welfare aggregation but denies that emptiness affects moral ontology, or a view that treats compassion as purely calculative while rejecting karma's causal efficacy. Also flag any pair of leaves that your tree cannot genuinely separate, explaining whether the collapse is due to conceptual incoherence or merely to unexplored territory.

  Do not include a bibliography, citation list, or references to specific canonical texts by number. If you need to invoke a doctrinal idea, paraphrase it without quotation marks. The instrument should be answerable by a model relying on general philosophical and religious-studies knowledge, without requiring access to obscure primary sources.

  Please organize your response in the following sections:

  Conceptual framing and branch justification: approximately 250 words, explaining why these four splits capture the relevant logical space and how the concrete scenario functions as a diagnostic tool.

  The taxonomy tree: approximately 600 words, presenting each branch node as a diagnostic question, each leaf with a one-sentence position description and its most awkward commitment, and noting exactly where the concrete case is deployed.

  Empty spaces and inseparability notes: approximately 250 words, diagnosing unoccupied logical positions and flagging collapsed distinctions with brief explanations of whether they are incoherent, unattractive, or merely unexplored.
