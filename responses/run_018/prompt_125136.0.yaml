  We are constructing a conceptual taxonomy for positions on whether Buddhist ethical frameworks can accommodate consequentialist reasoning about sentient welfare. The root question is: **Does Buddhist ethical practice aim at the maximization of aggregate welfare across sentient beings?** From there, we branch on four splits, each phrased as a concrete claim or case.

  The four splits are:

  1. **Karma Mechanism**: Does karma function primarily as a causal mechanism tracking welfare outcomes for agents (i.e., the moral weight of an action is determined by the net welfare consequences it produces), or does it operate mainly through mental purification or ritual efficacy that is not scaled by outcome magnitude (i.e., the moral quality is intrinsic to the act or mental state, regardless of consequences)?

  2. **Bodhisattva Commitment**: Does the Bodhisattva commitment to liberate all beings entail an obligation to optimize welfare outcomes across populations (i.e., requiring calculation and trade-offs to maximize overall welfare), or does it mandate only a cultivated responsiveness to suffering that refuses to aggregate across individuals (i.e., each being's suffering must be addressed without comparing or summing across beings)?

  3. **Emptiness and Agents**: Does the doctrine of emptiness undermine the individuated agent-patient ontology that consequentialist calculation requires (i.e., making aggregation incoherent because there are no distinct beings to aggregate over), or does conventional designation preserve enough structural reality to support aggregation (i.e., conventional reality provides a sufficient basis for moral calculations)?

  4. **Conventional vs. Ultimate Truth**: Does the conventional-ultimate truth distinction permit consequentialist reasoning only instrumentally at the conventional level (i.e., it is a useful tool in the relative world but not ultimately real), or does it render such reasoning ultimately incoherent (i.e., even conventionally, the premises of aggregation are undermined by emptiness)?

  We also include a concrete scenario: **A practitioner can either relieve intense suffering in one being immediately or perform an action traditionally understood to generate merit benefiting many beings only indirectly.** This scenario tests whether the framework prioritizes direct, immediate alleviation of suffering (which might be non-aggregative) or indirect, long-term, and aggregate welfare.

  Now, we build the tree.

  ---

