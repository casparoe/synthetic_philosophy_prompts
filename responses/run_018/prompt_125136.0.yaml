answer: |-
  ### Conceptual Framing and Branch Justification  
  This taxonomy isolates four fault lines where Buddhist ethics and consequentialist aggregation diverge logically, independent of historical schools. The root question targets the core consequentialist commitment to *maximizing aggregate welfare*. The first split (karma mechanism) examines whether moral causality is outcome-sensitive or intention/ritual-bound, testing consequentialism's demand for scalable welfare outcomes. The second (Bodhisattva commitment) probes whether universal compassion permits trade-offs or resists aggregation, targeting the tension between optimization and non-comparative care. The third (emptiness and agents) assesses if dependent origination dissolves the individuated beings required for aggregation, challenging consequentialism's ontological foundations. The fourth (conventional-ultimate truth) evaluates whether two-truths pragmatically accommodates aggregation or radically destabilizes it. The concrete scenario—**immediate suffering relief vs. merit-generating ritual**—serves as a critical diagnostic: choosing the former suggests anti-aggregation (rejecting calculative delay); choosing the latter implies outcome-maximization (prioritizing long-term "merit efficiency"). This forces respondents to weigh direct responsiveness against mediated welfare gains, revealing foundational commitments.  

  ---

  ### Taxonomy Tree  
  **Root Question:** Does Buddhist ethical practice aim at the maximization of aggregate welfare across sentient beings?  

  1. **Karma Mechanism Split:**  
     - *Branch Node 1:* Does karma function as a causal mechanism where moral weight scales with net welfare outcomes?  
       - **Yes** → Proceed to (2)  
       - **No** (Karma operates via mental purification/ritual efficacy, indifferent to outcome magnitude) → Proceed to (5)  

  2. **Bodhisattva Commitment Split (if karma outcome-sensitive):**  
     - *Branch Node 2:* Does the Bodhisattva vow entail an obligation to optimize welfare outcomes across populations?  
       - **Yes** → Proceed to (3)  
       - **No** (Bodhisattva responsiveness rejects aggregation, treating each being as incomparable) → Proceed to (4)  

  3. **Emptiness and Agents Split (if Bodhisattva optimization):**  
     - *Branch Node 3:* Does conventional designation preserve sufficient agent-patient structure to support aggregation?  
       - **Yes** → Proceed to (4a)  
       - **No** (Emptiness undermines individuation, making aggregation incoherent) → **Leaf 1: Incoherent Optimization**  
         - *Position:* Bodhisattva optimization is obligatory but ontologically impossible due to emptiness.  
         - *Awkward Commitment:* Demanding the impossible: aggregating over beings that lack inherent identity.  

  4. **Conventional-Ultimate Split (if conventional agents intact):**  
     - *Branch Node 4a:* Does the two-truths distinction permit consequentialist reasoning instrumentally at the conventional level?  
       - **Yes** → **Leaf 2: Instrumental Conventional Consequentialism**  
         - *Position:* Welfare maximization is pragmatically valid conventionally, supported by karma and Bodhisattva optimization.  
         - *Awkward Commitment:* Ultimate emptiness must not destabilize conventional moral math.  
       - **No** (Two-truths renders aggregation incoherent even conventionally) → **Leaf 3: Collapsed Aggregation**  
         - *Position:* Conventional agents exist but are too ontologically fluid for meaningful aggregation.  
         - *Awkward Commitment:* Upholding karma’s outcome-tracking while denying its calculative coherence.  

  5. **Bodhisattva Commitment Split (if karma non-outcome-sensitive):**  
     - *Branch Node 5:* Does the Bodhisattva vow entail an obligation to optimize welfare outcomes?  
       - **Yes** → Proceed to (6)  
       - **No** (Bodhisattva responsiveness rejects aggregation) → Proceed to (7)  

  6. **Emptiness and Agents Split (if Bodhisattva optimization + ritual karma):**  
     - *Branch Node 6:* Does conventional designation preserve sufficient agent-patient structure?  
       - **Yes** → **Leaf 4: Ritualistic Maximization**  
         - *Position:* Optimization is required, but karma works ritually, not via outcomes; aggregation relies on conventional agents.  
         - *Awkward Commitment:* Maximizing welfare through actions not designed to track outcomes.  
       - **No** → **Leaf 5: Empty Optimization**  
         - *Position:* Optimization is obligatory, but emptiness dissolves agents, and karma is ritual-based.  
         - *Awkward Commitment:* Optimizing for beings that lack inherent existence via non-outcome-sensitive acts.  

  7. **Concrete Scenario Deployment (if Bodhisattva non-aggregating):**  
     - *Branch Node 7:* **In the scenario, would the practitioner prioritize immediately relieving intense suffering in one being?**  
       - **Yes** (Rejects merit-generation as aggregative) → Proceed to (8)  
       - **No** (Chooses merit-generation for indirect welfare) → Proceed to (9)  

  8. **Emptiness and Agents Split (if prioritizes immediate relief):**  
     - *Branch Node 8:* Does emptiness undermine individuated agents?  
       - **Yes** → **Leaf 6: Non-Aggregative Compassionism**  
         - *Position:* Compassion responds to suffering without aggregation; emptiness denies agents, karma irrelevant.  
         - *Awkward Commitment:* Acting for beings while denying their ultimate reality.  
       - **No** → **Leaf 7: Agent-Based Anti-Consequentialism**  
         - *Position:* Rejects aggregation but accepts conventional agents; compassion is non-calculative, karma outcome-sensitive.  
         - *Awkward Commitment:* Karma tracks outcomes, yet ethics forbids using them for optimization.  

  9. **Conventional-Ultimate Split (if chooses merit-generation):**  
     - *Branch Node 9:* Does two-truths permit instrumental aggregation conventionally?  
       - **Yes** → **Leaf 8: Calculative Ritualism**  
         - *Position:* Merit-generation indirectly maximizes welfare; karma ritual-based, aggregation conventionally valid.  
         - *Awkward Commitment:* Using consequentialism instrumentally while rejecting outcome-sensitive karma.  
       - **No** → **Leaf 9: Incoherent Ritual Altruism**  
         - *Position:* Merit rituals "benefit all" but aggregation is metaphysically incoherent; karma non-outcome-sensitive.  
         - *Awkward Commitment:* Claiming indirect welfare benefits while denying aggregation’s coherence.  

  ---

  ### Empty Spaces and Inseparability Notes  
  **Unoccupied Combinations:**  
  - **Welfare aggregation + robust conventional agents unaffected by emptiness**: This would require affirming aggregation while denying *any* ethical implications of emptiness (Leaf 2 implies conventional stability but still acknowledges emptiness’s ultimate challenge). This position is *unattractive*: Emptiness permeates Buddhist metaphysics, making it incoherent to claim agents are "robust" in a way that ignores dependent origination.  
  - **Purely calculative compassion + rejection of karma’s causal efficacy**: A view demanding optimization while rejecting karma as outcome-tracking or ritualistically effective (e.g., Leaf 4 relies on ritual karma; Leaf 5 retains karma’s ritual role). This is *logically unstable*: Without karma (or an equivalent mechanism), "merit" benefiting others lacks causal grounding, collapsing the basis for long-term welfare gains.  

  **Inseparable Leaves:**  
  - **Leaf 3 (Collapsed Aggregation) and Leaf 9 (Incoherent Ritual Altruism)** are *conceptually indistinct*: Both deny aggregation’s coherence due to emptiness/two-truths, differing only in karma’s role (outcome-sensitive vs. ritual). Yet if karma is ritual-based (Leaf 9), the incoherence claim extends further, as rituals lack outcome-tracking—making them *doubly* unsuitable for optimization. This collapse arises from *unexplored territory*: No major scholarship defends ritual-based optimization amid ontological incoherence.  
  - **Leaf 6 (Non-Aggregative Compassionism) and Leaf 7 (Agent-Based Anti-Consequentialism)** *partially overlap* in rejecting aggregation, but their separation via emptiness is genuine. However, if Node 7 (scenario) prioritizes immediate relief *and* Node 8 answers "no" to emptiness undermining agents, Leaf 7 emerges—but if karma is outcome-sensitive (as in Leaf 7’s branch), choosing immediate relief contradicts karma’s logic unless welfare outcomes align with non-calculative duty. This tension is *underdeveloped*, not incoherent, and reflects unmapped positions in karma theory.
