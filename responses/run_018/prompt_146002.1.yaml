prompt: |-
  ok im trying to work out whether in a careenium the simmballs actually push the substrate around or if they're just floating patterns with no causal bite. before i read any more theories i want the full desiderta—what an adequate account has to deliver: the cases it must get right (like a simmball triggering a substrate reconfiguration vs merely correlating with one), the distinctions it can't collapse (causal push vs informational tracking, layered substrate vs flat, abstract symbol vs embodied token), and the puzzles it has to dissolve (how does something non-physical shove physical stuff? downward causation but specifically for balls?). flag which pairs of requirements are probably jointly unsatisfiable—i'm especially suspicious of demanding full substrate independence and direct downward efficacy together. say which are non-negotiable and which are just camp preferences. then briefly score the usual suspects—substrate reductionism, emergent symbolism, correlation-only—against the list, but keep the weight on the criteria not the scorecard. no bibliographies or citations, i don't need them. roll with any typo i made.
reasoning: |-
  Okay, the user is diving deep into the Careenium thought experiment, trying to figure out whether Simmballs have real causal power or are just patterns. They want a clear framework to evaluate theories before getting into existing ones. 

  First, I need to unpack their core question: "Do Simmballs push the substrate, or are they just floating correlations?" They’re asking for a strict criteria list—what any theory *must* explain to be taken seriously. 

  Hmm, they’ve hinted at some tensions already, like substrate independence vs. downward efficacy. That’s a big red flag—probably mutually exclusive. You can’t have something both fully abstract *and* physically shoving atoms. 

  Their list of requirements is dense but sharp: 
  - Cases: Triggering vs. correlating events (e.g., a Simmball collision *causing* a substrate change vs. just coinciding). 
  - Distinctions: Causal push vs. info-tracking (don’t blur these!), layered vs. flat substrate (hierarchy matters), symbols vs. tokens (abstract meaning vs. physical instantiation). 
  - Puzzles: How non-physical "balls" exert force? Downward causation without magic? 

  They’re especially suspicious of combining substrate independence with direct efficacy. Smart—that’s like wanting a ghost to lift a rock while also being intangible. Probably impossible. 

  Non-negotiables? Definitely the causal vs. correlative distinction. Without that, everything’s just epiphenomenal noise. Camp preferences? Maybe whether symbols are "emergent" or "fundamental"—useful but debatable. 

  Now, scoring theories quickly: 
  - **Substrate reductionism**: Crushes Simmballs to pure physics—gets causation right but flattens layers. Fails substrate independence. 
  - **Emergent symbolism**: Simmballs as real higher-level causes—solves downward efficacy but struggles with "how." Risk of over-mystifying. 
  - **Correlation-only**: Safe but boring. Simmballs are just shadows. Collapses causal distinction entirely—dealbreaker. 

  User’s typo ("desiderta" → desiderata) is charming. Rolling with it. They’re clearly thinking hard, avoiding theory-bias upfront. Respect. 

  Their unspoken itch? Probably ontological anxiety: "If my thoughts are like Simmballs, do *I* really cause things?" Heavy. But for now, sticking to their framework—no armchair psychologizing. 

  Final note: They’d hate hand-wavy "emergence." Any theory needs rigor on the *mechanism* of downward push. No free passes.
answer: |-
  Here's the **desiderata framework** for evaluating Careenium theories, stripped to essentials:

  ### Non-Negotiable Requirements (What an Account *Must* Deliver)
  1. **Causal vs. Correlative Discrimination**:  
     - Must distinguish between:  
       *Case A (Triggering)*: Simmball collision *causes* substrate reconfiguration (e.g., ball-X hitting ball-Y forces bond-rewrite).  
       *Case B (Correlation)*: Simmball pattern shifts *alongside* substrate changes but doesn’t push them (e.g., ball-X "dances" near bond-break, but physics did it solo).  
     - *Fail state*: Blurring Case A/B makes Simmballs epiphenomenal.

  2. **Downward Causation Without Magic**:  
     - Explain *how* abstract Simmballs (non-physical patterns) "shove" physical substrate. Reject hand-waving.  
     - *Puzzle*: If Simmballs are substrate-independent, how do they grip the hardware?  

  3. **Layered Ontology Integrity**:  
     - Preserve hierarchy: Simmballs ≠ substrate, but interact with it. Avoid:  
       - *Collapse Up* (only balls matter, substrate is passive goo).  
       - *Collapse Down* (only substrate matters, balls are illusions).  

  ### Probably Jointly Unsatisfiable Demands  
  - **Substrate Independence + Direct Downward Efficacy**:  
    If Simmballs are *truly* independent of physical implementation (runable on carbon/silicon/quantum foam), they can’t *directly* push specific atoms—they need **causal hooks** into the layer below. Independence suggests multiple realizability; efficacy demands physical grip. *Likely tension*.  

  ### Camp Preferences (Negotiable)  
  - **Symbol vs. Token Priority**: Whether Simmballs are abstract symbols (meaning-driven) or embodied tokens (physically anchored) is theory-dependent.  
  - **"Flat" Substrate Tolerance**: Some theories may flatten layers (e.g., unified physics) if they still distinguish Simmball *dynamics* from substrate *mechanics*.  

  ---

  ### Quick Theory Scores Against Criteria  
  *(Weight on gaps, not verdicts)*  

  1. **Substrate Reductionism** ("It's all physics"):  
     - ✅ Solves "how" (physics pushes itself).  
     - ❌ Fails **Case A/B distinction**: Simmballs correlate, never cause (Case B only). Collapses layers.  
     - ❌ Denies downward efficacy.  

  2. **Emergent Symbolism** ("Simmballs *are* causal agents"):  
     - ✅ Demarcates Case A (emergent causation).  
     - ✅ Preserves layered ontology.  
     - ❓ **Puzzle gap**: Unclear *how* emergence grants causal bite. Risks "strong emergence" handwaving.  
     - ❌ Tensions with substrate independence (emergence tied to specific physics).  

  3. **Correlation-Only** ("Patterns don’t push"):  
     - ✅ Clean on substrate independence (patterns float freely).  
     - ❌ **Fatal flaw**: Collapses **Case A/B distinction** (only Case B). Simmballs lack "bite."  
     - ✅ Dodges downward causation puzzle (denies it exists).  

  ---

  **Key Tension Spotlight**: If you demand *both* substrate independence *and* direct downward shoving, prepare for pain. Independence suggests Simmballs are abstract patterns—but patterns don’t push; implementations do. A theory might bridge this via **structured constraints** (e.g., Simmball rules *program* substrate dynamics) or **causal interfaces** (emergent properties gain leverage via feedback loops). But raw independence + direct efficacy? Suspicion justified.
