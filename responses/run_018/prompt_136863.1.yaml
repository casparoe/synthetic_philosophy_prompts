prompt: |-
  Ever since I started dating someone from near the Great Lakes who insists that thier tap water has a different "essence" because of lake-effect mineral runoff, I've been obsessed with Putnam's Twin Earth idea. If semantic externalism means the meaning of my thoughts depends on the actual chemical enviroment around me, then when my partner and I argue about whether bottled spring water is "real water," aren't we both automatically wrong about what we're thinking? And if Oscar and Twin Oscar have identical brains but different thoughts, doesn't that prove there are no internal mental states at all—just labels assigned by the outside world? I know I'm conflating narrow and broad content or something, but I can't figure out exactly where the mistake is. Can you walk me through it? Please answer in American English.
