  > *Patterns at all levels (physical, design, intentional) are real. Higher-level patterns aren't reducible to lower levels but are robust and objective.*  
  (B) **Complete** (physics captures everything; "intentional" talk is just a shortcut)? → **Leaf 2: Reductionist Physicalism**  
  > *Design/intentional patterns are real but are literally embedded in physics. The alien has the full picture but ignores efficient descriptions.*

  ---

  ##### **Branch A→B (Design patterns are fictional)**
  **Q5. Alien Shopping Case (same as Q4):**  
  *Is the alien's physics-only explanation:  
