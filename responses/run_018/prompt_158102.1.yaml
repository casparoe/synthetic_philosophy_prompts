  > *Why empty? Rejecting design patterns (e.g., "purpose") while accepting intentional ones (e.g., "desires") is inconsistent. Intentions imply purpose.*  
  (B) **Complete**? → **Leaf 4: Physical-Stance-Only Realism**  
  > *Only physical patterns (like weather systems) are real. Design/intentional patterns are useful fictions.*

