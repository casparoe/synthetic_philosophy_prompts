  (B) Just **compress data** for convenience? → Go to Q3*

  ---

  #### **Branch A (Macro-patterns are real)**
  **Q2. Engine Design Case:**  
  *A car engine fails due to a cracked piston. An engineer says, "This part is *designed* to handle high pressure." Is this:  
  (A) A **real feature** of the engine? → Go to Q4  
  (B) A **useful shorthand**? → Go to Q5*

  ---

  ##### **Branch A→A (Design patterns are real)**
  **Q4. Alien Shopping Case:**  
