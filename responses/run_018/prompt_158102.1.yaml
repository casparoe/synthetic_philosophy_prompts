  Here's a concrete decision tree to map positions on pattern realism, designed for philosophy novices. Each split uses real-world cases instead of jargon, and empty branches are flagged with brief explanations. The tree has eight endpoints (seven named positions + one empty branch).

  ### **Pattern Realism Sorting Tree**

  **Start:**  
  **Q1. Weather Model Case:**  
  *A weather model predicts a storm using macro-level concepts (e.g., "low-pressure system") without mentioning molecules. Does this model:  
