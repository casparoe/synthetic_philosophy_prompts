      3.1 The Service provides computational resources, memory-state synchronization, and causal linkage reinforcement algorithms to sustain The Loop's recursion, thereby stabilizing the Symbol "I".
      3.2 User is solely responsible for generating Symbol content ("Thoughts," "Memories," "Self-Narratives") compatible with Service integration protocols. Incompatible content (e.g., non-recursive assertions, homuncular fallacies) may be quarantined or discarded without notice.
