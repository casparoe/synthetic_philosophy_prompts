  ### Bertrand's Paradox Classroom Activity  
  **Goal:** Students experience firsthand how the definition of "random" depends on the generation procedure, leading to different probabilities for the same event—revealing the ambiguity in the principle of indifference.

  ---

  ### **Activity Structure**  
  **Total Time:** 90 minutes  
  **Materials (Cheap & Classroom-Friendly):**
  - **Circle templates** (15 cm diameter) printed on paper (1 per group).  
  - **Push pins** (10 per group) and **string** (30 cm per group) for chord visualization.  
  - **Protractors** (1 per group) and **rulers** (1 per group).  
  - **Spinners** (1 per group, handmade: paper plate, brad, pencil). Label one spinner with **angles (0°–360°)** and another with **distances (0–7.5 cm)**.  
  - **Graph paper overlays** (transparent sheets with 1 cm grids, 1 per group).  
  - **Worksheets** for recording chords (1 per student).  
  - **Whiteboard** for aggregating results.  

  ---

  ### **Group Procedures (3 Groups, 3 Methods)**  
  Assign each group a method to generate random chords. **Do not reveal the name "Bertrand’s paradox" yet.**  

  #### **Group 1: Random Endpoints**  
  - **Procedure:**  
    1. Spin the **angle spinner** twice to get two points on the circle’s circumference (angles θ₁, θ₂).  
    2. Place pins at these points and stretch string between them to form the chord.  
    3. Measure chord length with a ruler.  
  - **Record:** Is chord longer than the side of the inscribed equilateral triangle? (Pre-calculate this length for your circle: e.g., for radius 7.5 cm, side = 13 cm).  
  - **Symmetry Assumption:** Uniform random endpoints → rotational invariance.  

  #### **Group 2: Random Midpoint**  
  - **Procedure:**  
    1. Overlay the circle with **graph paper**.  
    2. Generate random coordinates (x, y) by closing eyes and pointing twice: first for x (left/right), then for y (up/down).  
    3. Mark this point as the chord’s midpoint.  
    4. Use a ruler to draw the chord perpendicular to the radius through this point.  
  - **Record:** Is the chord longer than the triangle side? (Use the condition: chord length > 13 cm).  
  - **Symmetry Assumption:** Uniform random midpoint in the disk → translational invariance.  

  #### **Group 3: Random Radius Point**  
  - **Procedure:**  
    1. Spin the **angle spinner** to select a radius (θ).  
    2. Spin the **distance spinner** to choose a point along this radius (d from center).  
    3. Draw the chord perpendicular to the radius at this point.  
  - **Record:** Is the chord longer than the triangle side? (Use: chord length > 13 cm).  
  - **Symmetry Assumption:** Uniform random point along a random radius → radial invariance.  

  ---

  ### **Timing**  
  1. **Setup (10 min):**  
     - Divide students into 3 groups.  
     - Distribute materials and worksheets.  
     - Briefly explain: *“Generate 10 random chords using your method. For each, record if it’s longer than the triangle side.”*  
     - **Do not elaborate on why.**  

  2. **Activity (40 min):**  
     - Groups generate chords and record results.  
     - **Instructor circulates:**  
       - Ensure Group 2 uses graph paper correctly.  
       - Remind Group 3 to draw chords perpendicular to the radius.  
       - Check Group 1’s chord measurements.  

  3. **Aggregation (15 min):**  
     - Groups report counts of "long" chords on the whiteboard:  
       | Group | Method             | Long/Total | Probability |  
       |-------|--------------------|------------|-------------|  
       | 1     | Random Endpoints   | e.g., 3/10 | 0.30        |  
       | 2     | Random Midpoint    | e.g., 2/10 | 0.20        |  
       | 3     | Random Radius Point| e.g., 5/10 | 0.50        |  

  4. **Debrief (25 min):**  
     - **Spark debate:** *“Why are the probabilities different if all chords are ‘random’?”*  
     - Let students express confusion—someone will note each group used a different idea of "random."  
     - **Map to symmetry & principle of indifference:**  
       | Group | Physical Procedure    | Invariance          | Indifference Applied To       | Probability |  
       |-------|-----------------------|--------------------|-------------------------------|-------------|  
       | 1     | Endpoints on circle   | Rotational         | Arclength                     | 1/3 ≈ 0.33 |  
       | 2     | Midpoint in disk      | Translational      | Area                          | 1/4 = 0.25 |  
       | 3     | Point along radius    | Radial             | Linear distance               | 1/2 = 0.50 |  
     - **Key takeaway:** “Random” requires specifying a procedure. The principle of indifference implicitly assumes a symmetry (rotation, translation, etc.), but doesn’t declare it.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Measurement Errors:**  
     - **Issue:** Students measure chords loosely (e.g., misaligning rulers).  
     - **Fix:** Pre-measure the triangle side (13 cm) and mark it on rulers. Emphasize precision.  

  2. **Procedure Blurring:**  
     - **Issue:** Group 2 might draw chords not perpendicular to the radius.  
     - **Fix:** Demonstrate perpendicular chords quickly before starting.  

  3. **Group Peeking:**  
     - **Issue:** Groups observe others’ methods and adjust.  
     - **Fix:** Separate groups spatially or assign distinct tasks (e.g., Group 1 uses pins, Group 3 uses spinners).  

  4. **Lack of Surprise:**  
     - **Issue:** Students might not see why results differ.  
     - **Fix:** In debrief, contrast their empirical results with theory (1/3, 1/4, 1/2). Ask: *“Which procedure is ‘truly’ random? Why?”*  

  ---

  ### **What the Activity Can’t Teach**  
  - **Continuous Parameter Spaces:** Students physically sample discrete chords, but the paradox arises from *continuous* symmetries. Explicitly clarify post-activity:  
    > *“In continuous spaces, the principle of indifference requires choosing a parameterization (angle, area, distance). Different choices yield different probabilities—there’s no unique ‘random chord.’”*  

  - **Generalization to Inference:** Post-activity, link to broader themes:  
    > *“Just like ‘random chords,’ ‘random evidence’ in philosophy depends on what we’re indifferent about. Specify your sampling procedure, or risk Bertrand-style paradoxes in probability assignments.”*  

  ### **Why This Works**  
  Students confront ambiguity physically, making the principle of indifference feel slippery *before* naming it. The aggregation moment—where probabilities diverge—creates cognitive dissonance that primes deep discussion.
