  For the anti-reductionist claim: It's explicit in a grant proposal, used to justify ethics. But it's a theoretical articulation, like the denied metaphysical claims. The classmate previously rejected such articulations as hinges. Also, in biology, reduction might be default, so claiming non-reduction could be theoretical overreach. Practical indispensability? If her research depends on irreducibility for ethical weight, it might be contextually necessary. But the earlier rejection of metaphysical claims suggests otherwise.

