  The new cases involve a neuroscientist. During calibration, she's certain that "the electrode array is registering voltage fluctuations," even knowing it could be simulated. For the grant, she claims "human consciousness is not reducible to voltage patterns" to argue for ethical significance. The user wants predictions on whether these are hinges, the underlying rules, and a test case.

