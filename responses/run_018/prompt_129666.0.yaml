answer: |-
  ### Consistency Audit of Your Narrative Ontology Framework

  I'll begin with a brainstorm of potential tensions among your commitments, then proceed to a structured audit. Your framework centers on three core domains: imprecise probability (1-2), authorial ontology (3-4), and decision theory (5-6). The most salient tensions arise at the intersections of these domains, particularly around the interplay between authorial determinacy and character-level indeterminacy.

  **Brainstorm of Tensions:**
  - **(3) vs. (4):** Ontological indeterminacy in the story-world clashes with precise authorial intention fixing "true probabilities." If intention is always precise, how can probabilities be *genuinely* indeterminate? This threatens to collapse (3) into epistemic ignorance.
  - **(4) vs. (5):** If authorial intention fixes precise probabilities, why should characters use maximin (which ignores true probabilities) rather than expected utility? Maximin might yield choices contradicting the author's intended trajectory.
  - **(3) vs. (6):** (6) dismisses maximin under epistemic ignorance, but (3) insists on ontological indeterminacy. If (3) weakens, (6) could undermine (5)'s rationale for maximin.
  - **(5) vs. (4) in practice:** Maximin might cause characters to avoid risks the author intended them to take, creating narrative incoherence.
  - **(1-2) vs. the rest:** (1-2) are stable but indirectly heighten tensions: (1) supports (3)'s anti-arbitrariness stance, while (2) warns against misapplying indifference, which could affect how credal sets in (3) are constructed.

  **Structured Audit:**
  I rank tensions by severity (High, Medium) and identify whether they are genuine or apparent. Genuine tensions require revision; apparent ones may dissolve under clarification.

  #### 1. **High-Severity Tension: (3) vs. (4) - Ontological Indeterminacy vs. Authorial Determinism**  
     - **Nature:** Genuine logical conflict. (3) asserts narrative probabilities are ontologically indeterminate because you haven't fixed them. (4) insists that for any planned narrative, authorial intention is precise and fixes true probabilities. If intention is always precise, indeterminacy in (3) reduces to epistemic ignorance (you not knowing your own intention), contradicting (3)'s ontological claim.  
     - **What must give:** (4) must be revised. Dropping (3) would collapse your narrative ontology to epistemic ignorance, invalidating (5)-(6).  
     - **Revision option:** Limit (4) to *completed* narratives only, not planned ones. Specify that authorial intention becomes precise only upon final narrative fixation (e.g., when a draft is settled). Pre-fixation, (3) holds.  
     - **Cost:** Weakens (4)'s scope. Authorial intention is now dynamic: indeterminate during creation, precise post-completion. This preserves (3)'s ontology but implies that "true probabilities" are time-dependent (indeterminate until authorial closure).  
     - **Saves both?** Yes, if "planned" is redefined as "not yet fixed." (3) applies pre-fixation; (4) applies post-fixation.

  #### 2. **High-Severity Tension: (4) vs. (5) - Authorial Determinism vs. Maximin Rationality**  
     - **Nature:** Genuine motivational and practical conflict. (4) implies precise true probabilities exist; (5) prescribes maximin, which ignores them in favor of worst-case outcomes. This risks characters making choices that contradict authorial intentions.  
     - **Concrete case:** Suppose your intention fixes a 70% probability that a risky plot branch (e.g., "character confronts the villain") succeeds. Under maximin, the character evaluates this branch by its worst-case outcome (e.g., death), ignoring the 70% success chance. They may choose a safer branch (e.g., "flee"), but your intention in (4) determined they *would* confront. Maximin thus forces a choice the authorial probabilities render irrational, creating narrative inconsistency.  
     - **What must give:** (5) must be revised if (4) holds. Keeping both risks incoherence: characters act as if probabilities are indeterminate (maximin) when they are determinate (per author).  
     - **Revision option:** Restrict (5) to **only when (3) holds** (indeterminate probabilities). When (4) holds (fixed intention), characters should use expected utility (EU), per (6). This aligns with your (6) distinction.  
     - **Cost:** Complicates narrative design. You must track when probabilities are "fixed" for characters. Maximin (5) applies only in ontologically ambiguous story-states; EU applies elsewhere.  
     - **Saves both?** Partially. If (4) is revised per above (limited to completed narratives), (5) applies during creation. Post-completion, characters use EU. However, if characters face pre-fixed indeterminacy *within* a planned narrative, tension remains.

  #### 3. **Medium-Severity Tension: (3) vs. (6) - Sustaining Ontology Without Collapse**  
     - **Nature:** Apparent conflict that dissolves under revision. (6) says maximin is unjustified under epistemic ignorance because true probabilities exist. (3) must therefore defend ontological indeterminacy to justify maximin in (5). But if (4) forces epistemic interpretations (via precise intentions), (3) collapses.  
     - **What must give:** (3) survives only if (4) is revised (as above). (6) doesn't threaten (3) directly; it merely clarifies that maximin requires ontological grounds.  
     - **Revision option:** None needed for (3) or (6) if (4) is revised. (6) reinforces that maximin is valid *only* under genuine indeterminacy (your (3)), not ignorance.  
     - **Cost:** None if (4) is revised. If not, (3) becomes unsustainable.

  #### 4. **Low-Severity Tension: (1-2) vs. Framework - Indirect Pressures**  
     - **Nature:** Apparent conflicts that dissolve. (1) supports (3) by validating imprecise probabilities for ambiguity, but doesn't directly interact with fiction. (2) warns against cross-representation indifference, which could affect how credal sets in (3) are defined, but you don't apply indifference here.  
     - **Resolution:** No revision needed. (1) provides a realist foundation for (3), while (2) is a cautionary note for constructing credal sets in your narrative.

  ---

  ### Recommended Revision and Remaining Frictions
  **Core Revision:** Limit (4) to completed narratives only. Specify that authorial intention is precise and probability-fixing **only after narrative closure** (e.g., when a draft is finalized). Pre-closure, (3) holds: probabilities are ontologically indeterminate during creation.  
  - **Why this?** It resolves the severe (3)-(4) conflict, preserves (3)'s ontology, and aligns (5)-(6) by restricting maximin to indeterminate states (pre-closure) and EU to determinate ones (post-closure).  
  - **Costs:**  
    - (4) loses universality, now excluding planned-but-unfixed narratives.  
    - Narrative ontology becomes process-dependent: indeterminacy during drafting, determinacy post-completion.  
    - Characters' decision rules depend on the author's creative stage, which may feel meta-fictional.  

  **Remaining Minor Frictions:**  
  1. **Character access to indeterminacy:** Characters in indeterminate story-states (pre-closure) use maximin, but how do they "know" their world is indeterminate? This is a design problem, not a logical flaw—address it narratively (e.g., through ambiguous in-story evidence).  
  2. **Ambiguity in planned narratives:** If you "plan" but don't "fix" a narrative (e.g., sketching multiple branches), does (3) or (4) apply? Clarify that "intention fixes probabilities" requires full commitment, not tentative planning.  
  3. **Maximin's narrative impact:** In pre-closure writing, maximin may lead characters to overly conservative choices, potentially narrowing your creative options. This is a practical tension, but it reflects the ontology you've chosen.  

  **Overall Consistency Post-Revision:**  
  - Pre-closure: (3) → ontological indeterminacy → (5) maximin is rational.  
  - Post-closure: (4) → precise probabilities → (6) EU is rational (maximin biased).  
  - (1) and (2) remain unchallenged, providing theoretical grounding.  

  This approach maintains your core insights while eliminating contradictions. The key is treating authorial intention as *emergent* through the creative process, not pre-existing.
