answer: |-
  Here’s your desiderata list for a theory of tragic enjoyment, with motivating cases, key distinctions, and conflict flags:

  ---

  ### **Core Requirements for a Theory of Tragic Enjoyment**
  1. **Phenomenological Separation**  
     *Requirement:* Must distinguish *enjoying-the-sadness* (where sadness itself is integral to the pleasure) from *enjoying-despite-sadness* (e.g., appreciating technical skill while tolerbbing grief).  
     *Motivating Case:* A listener cries at a mournful cello suite but insists they "love it" — sadness isn’t incidental but central to the value. Collapsing this distinction falsely equates tragedy with a chore.

  2. **Non-Reducibility to Comedy**  
     *Requirement:* Cannot frame tragedy as merely "dark comedy" or catharsis as "relief via humor."  
     *Motivating Case:* Beckett’s *Endgame* evokes desolation through existential repetition, not punchlines. Theories reducing tragedy to comedy’s mechanism (e.g., tension-release) fail to capture its lingering, unresolvable weight.

  3. **Dual-Affect Integrity**  
     *Requirement:* Must explain how craft-pleasure (e.g., awe at poetic language) and content-grief (e.g., a character’s death) coexist *without* reducing one to the other (e.g., "beauty distracts from pain" or "pain makes beauty profound").  
     *Motivating Case:* The luminous cinematography in *Manchester by the Sea* intensifies, rather than mitigates, the protagonist’s despair. Pleasure and pain are parallel, not compensatory.

  4. **Formal Grief Accountability**  
     *Requirement:* Must account for sadness evoked *purely* by structure/form (e.g., dissonant harmonies, desolate space in visual composition) without narrative or representational content.  
     *Motivating Case:* The decaying final chord in Mahler’s *9th Symphony* or Tarkovsky’s empty, rain-soaked landscapes evoke profound sorrow without "characters" or "events." Bracketing this treats form as decorative, not affective.

  5. **Negativity Preservation**  
     *Requirement:* The sadness must retain its *genuinely aversive* quality — not be "sublimated," "transformed," or stripped of its negative valence in the enjoyment.  
     *Motivating Case:* Audiences describe *Requiem for a Dream* as "devastating yet riveting." If the sadness were neutralized, it wouldn’t *be* sadness.

  6. **Affective Primacy**  
     *Requirement:* Sadness must be the *primary driver* of enjoyment — not a byproduct or gateway to another reward (e.g., moral insight).  
     *Motivating Case:* We re-watch *Grave of the Fireflies* precisely *for* its emotional devastation, not just its anti-war message. Remove the sadness; the appeal vanishes.

  ---

  ### **Conflict Flags**  
  - **R5 vs. R6:** *Negativity Preservation* (sadness is aversive) + *Affective Primacy* (sadness drives pleasure) creates tension: how can pain be both intrinsically negative *and* the source of positive valence?  
  - **R3 vs. Simplistic Catharsis:** If craft-pleasure and content-grief are non-fungible, theories positing "cathartic release" as a singular payoff oversimplify.

  ---

  ### **Theory Scoring (Brief)**  
  - **Catharsis (Aristotle):** Fails R3 (reduces craft to purgative tool), R4 (ignores formal grief), R6 (pleasure comes from relief, not sadness itself).  
  - **Humean Conversion:** ("Negative emotions transmuted into pleasure") Fails R5 (denies sadness’ aversiveness) and R4 (no mechanism for formal grief).  
  - **Control/Value Theories:** ("Safe space to explore feelings" or "sadness affirms humanity") Fails R6 (enjoyment derives from autonomy/meaning, not sadness qua sadness) and struggles with R4.

  ---

  **Summary:** The core tension is reconciling how an experience grounded in genuine aversion (sadness) can be sought *for* that aversion’s intrinsic contribution to pleasure.
