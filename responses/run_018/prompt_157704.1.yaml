  Hmm... this is sophisticated. The user clearly knows Austen and theory well. They're wary of reducing literature to parable or distorting philosophy to fit plot. Their deeper need seems to be: *How can narrative expose the lived experience of structural inequality in ways raw data/abstraction cannot?* 

  The challenge is balancing two traps:
  1) Over-literalism (e.g., "Longbourn entail = proof we need inheritance taxes")
  2) Over-abstraction (e.g., ignoring how Austen's irony shapes the critique)

  I should emphasize Austen's formal techniques—free indirect discourse, irony, character interiority—as tools that reveal what surveys about wealth transmission cannot: the *embodied cost* of status anxiety, the violence of social contingency, how relational dynamics absorb systemic failures. 

  The Collins paradox is crucial: his "meritocratic" rise via patronage undermines simple anti-inheritance narratives. And Elizabeth's refusal, while heroic, doesn't fix the system—it's a lucky exception. 

