  Anyway, can you write me the actual exam prompt? It should be answerable in about 75 minutes, and I need a model answer of roughly 800 words plus a marking scheme broken into 5 specific moves (4 marks each, total 20). The scheme needs to say exactly what an A answer does that a B answer misses — for instance, whether they actually explain why lowering the belief threshold to 0.99 doesn't dissolve the lottery problem without breaking the preface, or if their just saying 'contextualism' and moving on. Don't include any bibliography requests or citation prompts since these are undergrads without library access to teh original papers. Make it feel like a real exam, not a summary assignment, and please make sure the marking scheme calls out the specific mistakes that cost marks, like conflating statistical expectation with epistemic acceptance.
