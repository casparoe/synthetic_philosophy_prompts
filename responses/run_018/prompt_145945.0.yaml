  The debate over whether recent institutional changes in Hungary, Poland, Turkey, and the US amount to democratic backsliding has stalled even among analysts who share the same factual descriptions—court restructuring, executive aggrandizement, media capture, and election-law revision—because one camp treats these as discrete procedural violations while the other treats them as compatible with competitive politics so long as formal turnover remains possible. Diagnose the structure of this disagreement: is it verbal (different implicit definitions of democracy), empirical (a hidden causal claim about whether captured courts eventually suppress electoral competition), normative (whether popular sovereignty can override liberal institutional constraints), or methodological (different standards for what counts as sufficient evidence of erosion)? Apply the distinction between institutional redundancy collapse—the simultaneous weakening of overlapping checks across branches so that no single institution is formally abolished but the system loses resilience—and single-point failure—the overt elimination of one democratic mechanism—to determine whether the stall occurs because observers are searching for different structural patterns in identical data. For each diagnosis you identify, specify what kind of finding—formal, empirical, or conceptual—would count as progress, and mark the exact point at which the dispute becomes an irreducible values conflict rather than an institutional analysis that further evidence could settle.
