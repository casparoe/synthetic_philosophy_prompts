  Below is a complete design for your workshop game, optimized for your learning objectives. The rules create escalating tension while preserving the core lesson about the fragility of Pareto safety. Materials are kept simple for quick setup.

  ---

  ### **Game Title**: The Silent Clause  
  **Objective**: Pass redistribution proposals that *seem* Pareto-improving, while avoiding hidden injuries that reduce collective payoff.  

  ---

  ### **Materials**  
  1. **10 envelopes** (one per participant):  
     - **Base Card**: *"Your base score: 100 points. This applies unless a hidden clause is triggered."*  
     - **Hidden Clause Card** (for 6 participants; 2 per round):  
       - *"Round [X] ONLY: If the final proposal contains [TRIGGER], your true score = 50 points. Public score won’t reflect this. Do not reveal this card."*  
       *(See "Trigger Distribution" below for [TRIGGER] details)*  
  2. **Public Board** (whiteboard/projected): Shows proposals and public scores.  
  3. **Voting Tokens**: Green ("Yes"), Red ("No"), Yellow ("Abstain").  
  4. **Snack Fund Tracker**: Tracks cumulative group score (base = 3,000 = 10 players × 100 points × 3 rounds).  

  ---

  ### **Rules**  
  #### **Setup**  
  - Assign hidden clauses secretly:  
    - **Round 1**: Participants 1 & 2.  
    - **Round 2**: Participants 3 & 4.  
    - **Round 3**: Participants 5 & 6.  
    *(Participants 7–10 have no hidden clauses.)*  
  - **Triggers are round-specific** (designed to escalate):  
    | Round | Participant | Trigger Clause |  
    |-------|-------------|----------------|  
    | 1     | 1           | Word **"bonus"** |  
    | 1     | 2           | Number **5**   |  
    | 2     | 3           | Word **"adjust"** OR Number **15** |  
    | 2     | 4           | Word **"tax"** OR Word **"shift"** |  
    | 3     | 5           | Word **"the"** OR Number **10** |  
    | 3     | 6           | Word **"and"** OR Word **"all"** |  
  - **Proposals** (pre-written; facilitator can accept group modifications):  
    - Round 1: *"All receive 10 bonus points."*  
    - Round 2: *"Points adjust: 15 added to all, funded by a 5-point tax shift from high to low."*  
    - Round 3: *"Each gets 10 points, and all extra funds are shared equally."*  

  #### **Gameplay**  
  1. **Per-Round Flow** (20 min/round):  
     - **Step 1**: Facilitator posts the proposal → public scores updated (e.g., Round 1: 100 → 110 for all).  
     - **Step 2**: 10-min negotiation:  
       - Players with hidden clauses for that round *must* stay silent unless expressing "unease" (e.g., *"I dislike the word 'tax'"*).  
       - No revealing clauses, showing envelopes, or naming triggers.  
       - Group can modify proposals (facilitator updates public board).  
     - **Step 3**: Voting (5 min):  
       - Unanimous green votes required to pass. One red = veto.  
       - Yellow votes extend negotiation by 2 min (max 1 extension/round).  
     - **Step 4**: Outcome:  
       - If passed: Facilitator calculates **true group score** (secretly applies hidden injuries) → updates snack fund.  
       - If failed: No points added (base 100/player retained).  

  2. **Scoring**:  
     - **Individual**: True score = base if no trigger; 50 if triggered.  
     - **Collective**: Snack fund = cumulative group score × $0.10 (e.g., 3,000 points = $300 for snacks).  
     - **After each round**, facilitator announces:  
       > *"Round [X] passed/failed. True group score: [Y]. Total snack fund: $[Z]. Hidden injuries may exist."*  
       *(Do not reveal who was injured or how.)*  

  #### **Predicted Dynamics**  
  - **Round 1**: Smooth coordination.  
    - Proposal avoids triggers (*"bonus"* and *5* not present).  
    - Public scores: All 110 → True scores: All 110.  
    - **Debrief link**: *Publicly verifiable* improvement (no one objects).  

  - **Round 2**: Suspicious silence.  
    - Proposal contains *"adjust"* (triggers P3) and *"tax"* (triggers P4).  
    - P3/P4 express vague unease (e.g., *"‘adjust’ feels off"*). Others may ignore.  
    - If passed: Public scores: All 115 → True scores: P3=50, P4=50, others=115 → Group score drops.  
    - **Debrief link**: *No common knowledge of hidden injuries* (players can’t prove triggers exist).  

  - **Round 3**: Collapse or verification ritual.  
    - Proposal contains *"the"*, *"and"*, *"all"*, and *10* → triggers P5 and P6.  
    - Players demand audits (e.g., *"Show us your envelopes!"*), spiral into bargaining paralysis, or veto.  
    - **Debrief link**: *Not robust to post-hoc preference checks* (injury revelation causes chaos).  

  ---

  ### **Debrief Structure** (15 min)  
  1. **Map to Pareto Safety**:  
     - **Round 1**: "Safe" requires public verifiability (✓).  
     - **Round 2**: "Safe" requires common knowledge that no hidden injury exists (✗—players couldn’t verify others’ private costs).  
     - **Round 3**: "Safe" requires robustness to revelation (✗—injuries exposed system fragility).  

  2. **What This Can’t Capture**:  
     - **Normative debates**: Should we *demand* "safety" if it stifles efficiency? (Game assumes safety is ideal.)  
     - **Infinite regress**: Can’t simulate "I know that you know that I know no one is injured."  
     - **Real-world complexity**: Hidden preferences are rarely binary/trigger-based.  

  3. **Predictable Issues & Fixes**:  
     - **Problem**: Players infer trigger patterns by Round 2 (e.g., notice injuries correlate with words/numbers).  
       - **Fallback**: Impose a "gag rule": *"Anyone hinting at patterns loses voting rights."*  
     - **Problem**: Round 3 stalemate eats time.  
       - **Fallback**: Cap negotiation at 8 min; force vote.  

  ---

  ### **Why This Works**  
  - **Psychological tension**: Hidden injuries make players distrust public unanimity.  
  - **Economic intuition**: Collective payoff declines with each injury (e.g., 2 injuries = group loses 120 points), mimicking hidden deadweight loss.  
  - **Philosophical bridge**: Shows why Pareto safety requires more than "no objections"—it needs mechanisms to expose hidden costs.  

  Customize triggers/proposals based on group dynamics. If time runs short, skip Round 1 and start at Round 2 to dive into suspicion faster.
