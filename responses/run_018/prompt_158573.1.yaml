prompt: |-
  hiya — retired chemist here, got hooked on philosophy of decsion theory after retirement. i'm puzzling over cohearence arguments for expected utility maximisation: do they really force you to maximise EU, or just stop you being dutch-booked?

  here are my verdicts on four cases. they don't sit well together, i think.

  case 1: a researcher picks the experiment with highest expected information gain, even if there's a 30% chance of destroying the only sample. i say that's rational — she's weighting discovery very highly.

  case 2: a doctor refuses a fair bet on her patient's recovery, saying she doesn't gamble with lives, even though her credences and values line up with the bet. i don't think she's irrational; she's just refusing to apply utility calculus to that domain.

  case 3: a climate advisor uses minimax regret, and her probabilities shift with framing so she can't be dutch-booked. i think she's coherent — her beliefs aren't stable, but her rule isn't either.

  case 4: a trader accepts Savage's axioms except for outcomes she calls 'sacred', where she violates the sure-thing principle. i think she's incoherent, even though her reason sounds just like case 2.

  so is there a single principle that saves all four? if not, which verdict should i drop? please also say what it predicts for a case i haven't listed — maybe an AI designer who maximises EU for hardware costs but treats safety violations lexicographically — and be honest about which of my verdicts the principle can't accommodate. please answer in American English (my grandson insists), and forgive the typo's — old lab habits die hard.
reasoning: |-
  Okay, let me tackle this retired chemist's query about decision theory coherence. They're clearly deeply engaged with the philosophical nuances, given how they've constructed four intricate cases where standard expected utility (EU) maximization seems questionable. 

  First, I need to unpack their core tension: they sense their verdicts on the four cases are inconsistent, yet each judgment feels intuitively correct. The researcher prioritizing expected information gain over sample preservation (Case 1) and the doctor rejecting "gambling with lives" (Case 2) both challenge EU's universality, but they treat the sacred-value trader (Case 4) as incoherent despite similar reasoning. The climate advisor (Case 3) adds another layer with shifting probabilities.

  Hmm... the key might lie in distinguishing between two types of coherence arguments: narrow Dutch-book avoidance versus broader rational constraints. Dutch-booking is about consistency in probabilistic betting, but as the user notes, some agents (like the minimax advisor) avoid it without maximizing EU. 

  For Case 1: The chemist sees the researcher as rational despite reckless risk-taking. I agree—this is EU maximization with extreme values, not a rejection of it. The high weighting of discovery justifies the action. No problem here.

  Case 2 is trickier. The doctor's refusal to bet seems like a meta-ethical stance: "This domain isn't gamblable." If she truly has credences and utilities aligning with the bet, her refusal violates Savage's axioms. But perhaps her utilities aren't defined over gambles—she might see "betting on lives" as a distinct action type with inherent disutility. That could preserve coherence if modeled carefully.

  Ah! Case 4 exposes the inconsistency. The trader labels outcomes "sacred" and violates the sure-thing principle, which directly invites Dutch-booking. Unlike the doctor who avoids defining the bet, the trader engages with gambles but makes exceptions. That's why she's incoherent—she's playing the EU game but cheating on rules.

  Case 3 is fascinating. Minimax regret with framing effects avoids Dutch-books only if the bookie can't exploit shifting beliefs—but since the rule itself changes with framing, coherence is slippery. I'd argue she's locally coherent (no synchronic Dutch books) but globally unstable.

  Synthesizing this: the unifying principle is coherence-as-avoiding-exploitable-inconsistency. Dutch-booking is the operational test. This saves Cases 1-3:  
  - Researcher: coherent EU maximizer  
  - Doctor: coherent by excluding domains (if consistent)  
  - Advisor: coherent under her shifting rule  
  But Case 4 is exploitable—hence incoherent.  

  Now for the AI designer test case: if they lexically prioritize safety over hardware costs, they'd violate continuity (a Savage axiom). But if they refuse to ever trade safety for cost, no Dutch book arises—they simply assign infinite disutility to safety violations. That's coherent, like the doctor. Only if they inconsistently treat safety as sacred *sometimes* would they be Dutch-bookable.  

  The chemist might protest Case 2, but dropping that verdict forces us to call the doctor irrational—which feels wrong. Better to refine coherence as exploitability-avoidance, accepting domain restrictions if consistent.  

  Final note: their grandson's American English request is charming. I'll avoid "colour" and "labour"!
answer: |-
  Howdy from a fellow decision theory enthusiast! Your cases are razor-sharp and expose real tensions in coherence arguments. Let's break this down with a unifying principle, then see where it saves or strains your verdicts. (American English delivered, as requested—no "colour" or "labour" here!)

  ### The Core Principle: **Coherence as Unexploitability**
  The strongest coherence arguments (like Savage's or de Finetti's) don't *force* you to maximize expected utility (EU) in all contexts. Instead, they show that if your preferences violate the axioms (completeness, transitivity, independence/sure-thing principle, etc.), you can be **Dutch-booked**: someone can craft a series of "bets" you'll accept that *guarantee* you a loss. 

  **Coherence means no possible exploit—not necessarily EU maximization.** Some non-EU strategies (like your minimax regret advisor) can avoid Dutch books if they're applied consistently. Others (like sacred values) create exploitable loopholes.

  ---

  ### Your Cases Revisited w/ the Principle
  1. **Researcher (maximizes expected info gain, risks sample):**  
     - **Verdict: Rational & Coherent.**  
     - Why? She's *still maximizing EU*—just with utilities weighted heavily toward discovery. No preference cycles or sure-thing violations. She'd avoid Dutch books. Your call holds.

  2. **Doctor (refuses fair bet on patient):**  
     - **Verdict: Rational *if* coherent, but tricky.**  
     - If she genuinely lacks a preference ordering over gambles involving lives (i.e., her utilities are undefined for "betting" actions), she avoids Dutch books by exiting the domain. *But* if she has probabilistic beliefs and utilities for outcomes *yet* violates independence when "lives" are involved, she’s exploitable. Your verdict *mostly* holds if she’s consistent in refusing *all* such gambles.

  3. **Climate Advisor (shifting minimax regret):**  
     - **Verdict: Coherent (if consistent in her rule).**  
     - Minimax regret isn’t EU, but if she applies it uniformly, no Dutch book arises. Framing effects *might* cause incoherence if they lead to cyclical choices—but if her rule absorbs framing shifts (e.g., "I *always* use minimax after seeing frame X"), she’s safe. Your verdict stands.

  4. **Trader (violates sure-thing for 'sacred' outcomes):**  
     - **Verdict: Incoherent—correct.**  
     - Violating the sure-thing principle *directly* allows Dutch books. If she chooses A over B when a "sacred" outcome is impossible, but B over A when it’s possible, I can exploit her by splitting the decision. *Unlike the doctor*, she’s engaging in gambles but making exceptions—creating inconsistency. Your verdict is sound.

  ---

  ### The Tension: Why Cases 2 and 4 Differ
  - **Doctor (Case 2):** Avoids exploit by *opting out* of the gamble entirely. No preferences revealed → no inconsistency.  
  - **Trader (Case 4):** Engages in gambles *except* when sacred values are involved → reveals preferences that conflict across scenarios → exploitable.  

  **The Principle:** Coherence requires that *if you express preferences over acts*, they must satisfy the axioms to avoid Dutch books. The doctor refuses to play; the trader plays inconsistently.

  ---

  ### Test Case: AI Designer (Lexicographic Safety)  
  - **Scenario:** Maximizes EU for hardware costs but treats safety violations as infinitely bad (lexicographic priority).  
  - **Prediction:**  
    - **Coherent if consistent.** If she *never* trades safety for cost savings (e.g., rejects *any* gamble with >0% safety risk, regardless of cost benefits), no Dutch book arises. She effectively has "+∞ utility" for safety.  
    - **Incoherent if inconsistent.** If she sometimes accepts small safety risks for huge cost savings (e.g., 0.001% risk for $1B savings) but other times rejects identical gambles, she violates transitivity/independence and is exploitable.

  ---

  ### Which Verdict to Drop?  
  **Case 2 (Doctor) is the weak link—but don’t fully drop it, refine it.**  
  - **Problem:** If the doctor has well-defined credences/utilities for health outcomes *and* agrees the bet is "fair" by her own metrics, refusing it *while engaging in other gambles* violates coherence.  
  - **Solution:** She’s coherent only if:  
    a) She rejects *all* probability-based gambles on lives (opts out entirely), *or*  
    b) She encodes "gambling on lives" as intrinsically negative in her utility function (e.g., adding a large penalty).  
  - **Otherwise**, if she accepts other bets but refuses this one despite identical EU, she’s exploitable.

  ### Honest Summary  
  - **Saved Verdicts:** 1, 3, and 4 hold under "coherence as unexploitability."  
  - **Problem Verdict:** Case 2 *only* works if the doctor is fully consistent in her domain refusal. If she selectively applies "no gambling on lives" while otherwise obeying EU, she’s incoherent.  
  - **Unifying Principle:** **Preferences must be consistent across all choices to avoid exploitation.** EU maximization is one way to achieve this, but not the only way—if your alternative rule (e.g., minimax) is applied universally, you survive. Sacred values violate coherence *only* when they create contradictions in revealed preferences.  

  Your instincts are spot-on—philosophy needs more chemists! Keep puzzling; this stuff never dies.
