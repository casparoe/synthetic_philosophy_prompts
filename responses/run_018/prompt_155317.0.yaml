answer: |-
  Here’s the breakdown, toolkit-only, no fluff:

  **Williams’ Honor/Shame Model → Coordination Game w/ Endogenous Punishment Thresholds**  
  - **Agents**: Honor-sensitive players (types: high/low status).  
  - **Action**: Duel (or not). Signaling "honor" is a focal point in a coordination equilibrium.  
  - **IC**: Must duel if challenged (incentive compat: deviation = shame cost > duel cost).  
  - **Punishment Threshold**: Shame penalty is a network effect. If enough elites defect (stop dueling), the threshold shifts—now *not* dueling becomes focal. Punishment flips: looking cowardly → looking barbaric.  
  - **Equilibrium Shift**: Critical mass of defectors updates the punishment rule. New coordination point ("civilized" non-dueling) is stable. Honor is just redistributed payoffs under new norms.  

  **Appiah’s Status/Material Model → Hidden Types & Falling Returns on Status Goods**  
  - **Agents**: Players with hidden types (e.g., "prestige-maximizers" vs. "cost-averse").  
  - **Status Good**: Owning slaves/dueling as Veblen goods. Signaling "elite" type.  
  - **Falling Returns**: Industrialization = cheaper status signals (e.g., luxury goods). Slavery/dueling become high-cost, low-margin signals. Also, abolitionists impose new reputational costs (boycotts, stigma).  
  - **IC Revelation**: When material costs exceed status benefits, high-types defect first (hidden type revealed). Pooling equilibrium breaks; slavery/dueling now signal "outdated" not "elite".  
  - **Payoff Restructuring**: New tech/wealth shifts production functions. Status production cheaper elsewhere → agents optimize away from moral bads.  

  **Residue Report: What Doesn’t Map?**  
  1. **Moral Recognition Itself**: The *content* of arguments (e.g., "slavery is intrinsically wrong") isn’t a payoff. Mechanism design treats norms as equilibrium labels—it doesn’t explain why *this* moral frame won over others. The "aha" moment of moral insight? Pure externality.  
  2. **First-Mover Moral Entrepreneurs**: Abolitionists accepting high costs pre-equilibrium shift. Looks like irrational commitment (payoff-negative moves) that *creates* new payoffs later. Mechanism design retrofits this as "investment in norm entrepreneurship," but the initial impulse feels non-strategic.  
  3. **Affective Shift**: The visceral disgust replacing honor-codes. Payoffs can model changed preferences, but *why* disgust emerges isn’t endogenous—it’s black-boxed.  

  **Gap or Decoration?**  
  - **Gap in MD**: Mechanism design excels at *how* equilibria shift (incentive realignment, coordination, info revelation) but is agnostic on *why* moral preferences emerge or gain traction. The "ought" force—the feeling that morality *should* override interests—isn’t captured. MD explains the machinery, not the fuel.  
  - **Decoration?**: Not quite. The residue (moral recognition, entrepreneurial conviction) is the *catalyst* MD can’t generate internally. It’s a boundary condition: you need exogenous "moral shocks" to kick off payoff-restructuring. In practice, though? You can probably hack it by adding activist agents with weird utility functions (e.g., φ-moral-preference parameter) and calling it a day. Philosophers care about the why; MD cares about the how post-shock.  

  **Bottom line**: You can reduce the debate to hidden types, focal points, and shifting cost-benefit matrices. But the *origin story* of new moral preferences? That’s the exogenous magic sauce. MD’s job is to show why, once the sauce is spilled, the equilibrium flips—not where the sauce came from.  

  *(Typos? Yeah, "compatability" in your query—fixed it. Casual enough? Cool.)*
