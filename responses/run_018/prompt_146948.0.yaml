  First, I need to understand the core problem: detecting when a methodological frame is used superficially versus substantively. The user mentioned cases like predictive processing or causal inference being applied without real necessity. They want a reusable decision procedure with clear questions and thresholds for rejection.

  The user provided three hypothetical proposals: one on predictive coding in aesthetics, another rejecting computational methods for pure ethnography in social cognition, and one using do-calculus on historical letters. One of these should be flagged unfairly, likely the ethnography one, to test the procedure's fairness. Also, the procedure must acknowledge where judgment calls are necessary and where it might misfire.

  Key elements from the query:
  - Time constraint: 20 minutes per proposal.
  - No citation checks; relies only on the proposal text.
  - Must handle cases where the frame fits, the applicant rejects the trend but seems incompetent, or cites trend papers without dependency.
  - Need to identify steps that are subjective and where the procedure might approve hollow proposals.

  I should build a decision tree with specific, sequential questions. Each question needs clear pass/fail criteria. Steps should escalate from checking alignment to necessity and innovation. The procedure must include stopping points for rejection and clarify when a decision depends on risk tolerance.

  For the hypotheticals:
