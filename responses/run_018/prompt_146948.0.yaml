  2. **Pure ethnography**: Rejecting the trend could be seen as incompetent if not well-argued. The user wants this possibly flagged unfairly to test bias.
  3. **Do-calculus in history**: Niche application; could be innovative or mismatched.

  I need to ensure the procedure flags the ethnography proposal as "incompetent" rather than independent, which the user might dislike. This highlights the subjectivity in assessing competence versus independence.

  Areas of low confidence:
  - Distinguishing incompetence from independence (Step 5). This relies heavily on reviewer expertise and could be biased.
  - The procedure can't predict career impacts or detect citation bluffs without database access.

  Structure the procedure with:
  1. Frame Alignment Check: Does the frame match the problem?
  2. Necessity Justification: Why this frame over others?
  3. Innovation Test: Does it add new insights?
  4. Dependency Check: Are citations integral or decorative?
  5. Competence Assessment for Non-Cascade: If rejecting trends, is the reasoning sound?

  For misfires, the procedure might approve proposals that cite correctly but lack depth (Step 4 passes but the work is hollow). Also, it might reject competent independent work if the argument isn't presented clearly in the short review.

