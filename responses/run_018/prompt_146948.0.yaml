answer: |-
  Here's a reusable 20-minute decision procedure for detecting "framing herding," designed for pen-and-paper use with clear stopping points. It prioritizes falsifiable signals over speculative judgments and assumes you can only assess what's explicitly in the proposal text.

  **Core Procedure: The CASCADE Filter**  
  *(Questions in order, 3-4 min per question max)*

  1.  **C: Claimed Problem-Frame Fit**  
      *Question:* "Does the proposal explicitly state *why* this specific frame (e.g., predictive processing) is uniquely suited to address the *core challenge* of their research question? Is this justification internal to the problem (not just 'it's powerful' or 'it's novel here')?"  
      *Sufficient Answer:* Clear 1-2 sentence logical link between a specific aspect of the frame (e.g., "hierarchical prediction error minimization") and a specific hurdle in their problem (e.g., "explains rapid shifts in aesthetic valence when expectations clash").  
      *Insufficient:* Vague handwaving ("Predictive coding is a unifying framework"), appeal to popularity ("PP is revolutionizing cognition"), or justification only appearing in citations/future work.  
      *Stop Here?* **YES, if insufficient.** Flag: "Weak problem-frame justification. Likely herding. Send back for explicit rationale."  
      *Judgment Call Level:* Low-Medium (Relies on explicit textual evidence).

  2.  **A: Alternatives Acknowledged & Addressed**  
      *Question:* "Does the applicant acknowledge at least one plausible alternative methodological approach (cascade or non-cascade) to their specific problem? Do they provide a *substantive reason* (theoretical, practical, empirical) why their chosen frame is *superior* for *their goals*?"  
      *Sufficient Answer:* Names at least one alternative (e.g., "symbolic models" or "dynamical systems") and gives a specific, problem-grounded reason for rejection (e.g., "PP better handles time-sensitive valence shifts than symbolic AI" or "Ethnography captures contextual nuance lost in lab-based computational models").  
      *Insufficient:* Ignores alternatives, dismisses them without reason ("computational approaches are too reductionist"), or uses circular reasoning ("PP is best because it's comprehensive").  
      *Stop Here?* **YES, if insufficient.** Flag: "Failure to engage with methodological alternatives. Suggests uncritical frame adoption. Send back."  
      *Judgment Call Level:* Medium (Requires assessing plausibility of alternatives and substance of the reason).

  3.  **S: Specificity of Mechanism/Application**  
      *Question:* "Does the proposal detail *exactly how* the core concepts/tools of the frame will be *operationalized* to generate specific insights/answers *for this specific problem* that couldn't be gained otherwise?"  
      *Sufficient Answer:* Concrete description of *what* is being modeled/computed/observed *using frame elements* and *how* this yields novel answers (e.g., "We model visitor gaze patterns as active inference minimizing surprisal on artwork features X & Y; testable prediction: surprisal peaks correlate with self-reported 'awe'").  
      *Insufficient:* Only mentions frame concepts in background/intro, applies frame at an abstract level ("we use PP to understand aesthetic judgment"), or promises specifics only in future work.  
      *Stop Here?* **YES, if insufficient.** Flag: "Frame application lacks specificity. Risk of conceptual cargo-culting. Send back."  
      *Judgment Call Level:* Low (Focuses on concrete operationalization in methods/results).

  4.  **C: Citation Integration (not just presence)**  
      *Question:* "Are key cascade papers cited *only where strictly necessary* to support the *specific* claims about the frame's application here? Is their role *integral* to the proposal's argument, or decorative? (Skim citations in context)."  
      *Sufficient Answer:* Cascade citations appear primarily where justifying the *specific* fit (Q1) or operationalization (Q3). Non-cascade citations relevant to the *problem domain* are present.  
      *Insufficient:* Key cascade papers cited generically in intro/lit review but not tightly linked to the project's unique claims. Problem-domain citations sparse. Citation list looks like a cascade syllabus.  
      *Stop Here?* **NO. Insufficient here is a strong *signal* but not automatic rejection.** Proceed to Q5. Flag note: "Decorative citation pattern observed."  
      *Judgment Call Level:* Medium (Requires skimming citation context, not just counting).

  5.  **A: Assessment of Non-Cascade/Rejection Cases (If Applicable)**  
      *Question (Triggered ONLY if rejecting a cascade frame):* "Does the critique of the cascade frame demonstrate *technical understanding* of its claims? Is the proposed alternative *robustly justified* for *this problem*, including acknowledging potential weaknesses?"  
      *Sufficient Answer:* Critique shows grasp of cascade mechanics (e.g., accurately summarizes PP's core tenets *before* critiquing). Justification for alternative is problem-specific and addresses limitations (e.g., "Ethnography sacrifices generalizability for depth; essential here as context X is poorly defined").  
      *Insufficient:* Critique is ideological/strawman ("computationalism is dehumanizing"). Alternative justification is thin/ideological ("only pure observation is valid"). Ignores obvious limitations.  
      *Stop Here?* **YES, if insufficient AND frame rejection is central.** Flag: "Incompetent rejection: critique lacks understanding or alternative lacks grounding. High risk. Send back."  
      *Judgment Call Level:* **HIGHEST** (Assessing competence vs. independence is deeply contextual).

  6.  **D: Decision Point (After Q1-5)**  
      *Outcomes:*  
      *   **Passed Q1-Q4 (or Q5 if triggered):** Proceed to standard scientific merit/feasibility review. Frame choice seems motivated.  
      *   **Failed Q1, Q2, or Q3:** Strong herding signal. **Recommend Rejection.**  
      *   **Only Failed Q4 (Decorative Citations) OR Ambiguous Q5:** **High-Risk Zone.** Decision depends on panel's risk tolerance:
          *   *Risk-Averse:* Reject ("Hollow core risk too high").
          *   *Risk-Tolerant:* Flag concern but proceed if other merits (novelty, importance) are exceptional. Note: "Approved despite framing concerns (Q4/Q5). Monitor closely."
      *   **Q5 Triggered & Passed:** Independent work validated. Proceed.

  **Applying CASCADE to Hypothetical Pre-Proposals:**

  1.  **Predictive Coding & Aesthetic Judgment:**
      *   Q1: *Maybe.* Claims PP explains "surprise" in art viewing. Is surprise *the core challenge* for aesthetic judgment here? Link likely weak/vague.
      *   Q2: *Unlikely.* Probably ignores alternatives like appraisal theories or psychophysics.
      *   Q3: *Unlikely.* Likely says "model visitor experience using PP" without specifics on *how* or *what testable insight* it yields uniquely.
      *   **Stop at Q1/Q2/Q3 (likely Q1). Flag: Herding. Reject.**

  2.  **Pure Ethnography Rejecting Computation (Social Cognition):**
      *   Q5 Triggered (Rejecting cascade). Q5: *THIS IS THE UNFAIR FLAG (Likely Outcome You Dislike).*
          *   *Sufficient?* Depends entirely on writing. *If* proposal shows understanding of comp. social cog (e.g., "Agent-based models simplify Theory of Mind") AND justifies ethnography's necessity for *specific* context (e.g., "unspoken norms in group Y") AND acknowledges limits (e.g., "findings not generalizable without triangulation"), it *passes*.
          *   *But in 20-min skim:* High risk proposal only has ideological critique ("algorithms can't capture lived experience") and thin justification ("ethnography is holistic"). **Fails Q5. Flag: "Incompetent rejection." Recommend Reject.** This step is vulnerable to misjudging nuanced critique as incompetence.

  3.  **Do-Calculus on Archival Letters (History of Philosophy of Science):**
      *   Q1: *Likely Yes.* Clear problem: "infer causal influence from observational correspondence." Do-calculus *directly* addresses causal inference from obs. data. Explicit link possible.
      *   Q2: *Likely Yes.* Should acknowledge alternatives (e.g., qualitative narrative analysis, network analysis) and argue why *causal specificity* requires do-calculus.
      *   Q3: *Critical.* Must specify *what variables* are being manipulated (e.g., "Define 'exposure' to Idea X via letter receipt; 'influence' as adoption in later work Y"), *what assumptions* (e.g., ignorability), and *what identifiable effect* is estimated. If detailed, passes. If vague, fails.
      *   Q4: *Likely OK.* Pearl citations integral to methods.
      *   **Likely Passes Q1-Q4. Proceed to merit review.** (If Q3 weak, could fail there).

  **Confidence & Limitations:**

  *   **Overall Confidence in Distinguishability:** **~70%.** It *is* possible to separate herding from convergence in 20 mins using textual signals of **motivation, justification, and specificity**. This procedure systematizes the search for those signals.
  *   **Weakest Step:** **Q5 (Assessing Non-Cascade Competence).** Confidence **<50%** here. Distinguishing profound critique from shallow ideology under time pressure is extremely hard. Misapplying Q5 risks punishing *genuine* independence unfairly (as likely in the Ethnography case). This step relies heavily on reviewer expertise and proposal clarity.
  *   **What the Procedure CANNOT Do:**
      *   Detect "Citation Bluffs": Cannot verify if cited papers *actually* support the claims made without database access. Relies on surface plausibility.
      *   Predict Career/Social Consequences: Won't tell if rejecting the cascade hurts the applicant. Focuses solely on project integrity.
      *   Guarantee Non-Hollow Approval: Can approve "high-risk" proposals (Q6) that pass the checks but still lack depth. Misfires most often by **approving hollow proposals that cite correctly and use specific jargon but lack genuine conceptual integration or novel insight** (e.g., a technically sound but conceptually trivial application of PP).
      *   Assess True Novelty/Importance: Only checks frame justification. A well-justified frame can still be applied to a boring problem.
      *   Handle "Stealth Herding": Cannot detect if an applicant deliberately hides herding by fabricating a sophisticated rationale. Assumes good faith (but incompetent) writing.

  **Practical Use:** Print the CASCADE questions (C-A-S-C-A-D) on a sheet. For each proposal, skim with these questions in order, jotting brief notes (Pass/Fail/Why). Stop and reject at any clear Fail (Q1, Q2, Q3, or Q5 if triggered). Use Q4 and ambiguous Q5 to triage the high-risk pile quickly based on panel's agreed risk tolerance. The Ethnography case highlights the procedure's inherent trade-off: speed requires accepting some unfairness in judging competence (Q5), but it prevents *unchecked* bias by demanding explicit justification.
