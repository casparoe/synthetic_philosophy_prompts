prompt: |-
  Hi — I'm an HPS PhD student working on mid-century biomedicine, and I keep using "paradigm shift" loosly and then getting called on it in workshops. Before I write the bit where I score Kuhn, Lakatos and Feyerabend against each other, I want the spec. What would an account of theory change have to deliver to count as capturing what's distinctive about a Kuhnian paradigm shift, as opposed to just "a big change" or "normal science meeting a stubborn anomaly"? Give me the requirement list with the case or consideration behind each. The ones I already think belong on it: it has to say how a successor gets compared to its predecessor when the standards of comparison are among the things that changed; it has to distinguish real meaning change from mere belief change (my archives are full of terms like "stress" and "immune" that keep their spelling and quietly lose their sense); it has to handle granularity, since my cases sit at the level of one lab or one subfield, not a whole discipline; and it has to be diagnosable from evidence a working historian actually has — grant files, correspondence, referee reports — not only in hindsight, once we know who won. I also want the "many anomalies, no crisis" case faced head on, since anomaly accumulation alone plainly isn't enough. Mark which requirements are non-negotiable and which are just preferences of one camp — realists wanting cumulative progress, sociologists wanting the social to do the explanatory work, historians wanting local continuity — and flag any pair you suspect can't be jointly satisfied, because that's the part I actually want out of this. Two cases to run against the list as you go: does the replication crisis in psychology count as a crisis in Kuhn's sense or as normal science repairing itself, and is the shift from syndrome-style psychiatric categories toward dimensional, mechanism-first nosology a paradigm shift or a puzzle solution inside one? Keep it on the criteria, skip the scorecard, I'll do that myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're an HPS PhD student focusing on mid-century biomedicine, struggling with using "paradigm shift" too loosely in workshops. They need a clear set of criteria to define what makes a change truly Kuhnian, beyond just a big change or normal science tackling anomalies. 

  First, I need to recall Kuhn's key ideas from *The Structure of Scientific Revolutions*. Paradigm shifts involve incommensurability, meaning change, and crisis. The user already has some criteria in mind: comparison across changed standards, meaning change vs. belief change, granularity for smaller-scale cases, and diagnosability from historical evidence. They also mentioned handling "many anomalies, no crisis" and want to know which requirements are non-negotiable versus contested by different camps.

  The user provided two cases: the replication crisis in psychology and the shift in psychiatric nosology. These will be useful test scenarios. They emphasized avoiding the scorecard of Kuhn vs. others, focusing solely on the criteria. 

  Breaking down the non-negotiables: Incommensurability is core to Kuhn. Without it, you just have big changes or evolving theories. Meaning variance is another must—terms keeping spelling but changing sense. Crisis as non-anomaly-driven is crucial because anomalies alone don't cause shifts; it's the perception of foundational failure. Social uptake matters too, as Kuhn stressed community agreement. 

  Then there are Kuhnian preferences: Holism (whole worldview shifts), resistance and conversion, and discontinuity. Realists might challenge discontinuity, seeking cumulative progress, while sociologists emphasize social factors over rational ones. Historians might prefer local continuities over sharp breaks.

  Potential tensions: Granularity vs. holism—can a subfield shift without the whole discipline? Also, diagnosability vs. meaning incommensurability—how can historians detect meaning shifts when past actors might not recognize them? The user's cases are subfield-level, so granularity is essential. Using archival sources like grant files or referee reports could help spot incommensurability indicators, like persistent misunderstandings or new evaluation standards.

  Applying the criteria to the replication crisis: It's a crisis if it's seen as a foundational failure in methodology, leading to new standards (preregistration, open data). But if it's just fixing methods within the same framework, it's normal science. For psychiatry, shifting from syndromes to mechanisms could be a paradigm shift if it changes explanatory goals and disease ontology, with incommensurability in how disorders are defined. If mechanisms are just added tools within the same framework, it's puzzle-solving.

  The user's deeper needs: They want to apply Kuhn rigorously to their historical cases without overusing the term. They need clear markers to distinguish shifts from big changes. They also need to navigate historiographical debates between realists, sociologists, and historians. Highlighting tensions like granularity vs. holism helps them address critiques in workshops. Providing test cases with clear criteria usage strengthens their analysis.
answer: |-
  Here’s a distilled requirement list for identifying a Kuhnian paradigm shift, grounded in *The Structure of Scientific Revolutions* and your historiographical needs. I’ve flagged non-negotiables (Kuhn’s core), contentious points (camps), tensions, and applied your cases.

  ---

  ### **Non-Negotiable Kuhnian Criteria**  
  *(Must be present to qualify as a paradigm shift)*  

  1. **Incommensurability Requirement**  
     - **What**: Successor theories cannot be fully compared using neutral standards; *evaluative criteria themselves change*.  
     - **Case**: Post-shift, "valid experiment" or "explanatory success" may mean something new (e.g., 20th-century genetics redefining "inheritance").  
     - **Evidence**: Contemporaries talking past each other, dismissing problems as "not scientific," or redefining success metrics in archives.  

  2. **Meaning Variance Requirement**  
     - **What**: Core concepts retain terminology but undergo semantic rupture (e.g., your "stress" example: Selye’s physiological vs. later psychosocial meanings).  
     - **Case**: Newtonian "mass" vs. relativistic "mass" – same word, different ontological commitments.  
     - **Evidence**: Shifts in operational definitions, model assumptions, or cross-paradigm miscommunication in lab notes/referee reports.  

  3. **Crisis Trigger Requirement**  
     - **What**: Shift requires a *perceived failure* of the paradigm to solve critical puzzles – **not** mere anomaly accumulation. Anomalies must destabilize trust in the framework.  
     - **Case**: Mercury’s orbit was an anomaly for centuries; it became a crisis only when Newtonian mechanics faced multiple *fundamental* challenges.  
     - **Evidence**: Grant proposals framing problems as "threatening foundations," correspondence lamenting "broken tools," or sudden surges in methodological debates.  

  4. **Social Uptake Requirement**  
     - **What**: Shift isn’t logical but sociological – a community *abandons* the old paradigm after crisis-induced loss of confidence.  
     - **Case**: Plate tectonics accepted once geophysicists conceded fixism was untenable, not when evidence first emerged.  
     - **Evidence**: Cohort replacement in hiring, funding reallocations, or rise of new journals/societies (e.g., psychoneuroimmunology breaking from immunology).  

  ---

  ### **Kuhnian Preferences**  
  *(Contentious; camps debate these)*  

  5. **Holism Requirement** (Kuhn’s preference)  
     - **What**: Shifts reconstitute *worldviews* – methods, goals, metaphysics, standards.  
     - **Tension**: Realists (e.g., Lakatos) allow core+auxiliary splits; sociologists see patchwork transitions.  
     - **Granularity Fix**: For subfields, require local holism – *e.g.*, a lab’s entire epistemology shifts, not just one technique.  

  6. **Resistance & Conversion Requirement** (Kuhn’s preference)  
     - **What**: Adherents don’t reason across paradigms; conversion is "gestalt switch."  
     - **Contention**: Realists (Laudan) argue rational comparison *is* possible; sociologists see power/knowledge negotiations.  
     - **Evidence**: Biographies showing abrupt "aha!" moments vs. gradual persuasion.  

  7. **Discontinuity Requirement** (Kuhn’s preference)  
     - **What**: Post-shift science isn’t cumulative; past work becomes "inapplicable."  
     - **Contention**: Realists insist on continuity; historians (e.g., Galison) find "trading zones" between paradigms.  

  ---

  ### **Tensions & Your Constraints**  

  - **Granularity vs. Holism Tension**:  
    Can a subfield/lab have a paradigm shift without discipline-wide change? **Yes** – if it meets Criteria 1–4 *locally*. Kuhn’s "micro-paradigms" allow this (e.g., his phage group example).  

  - **Diagnosability vs. Incommensurability Tension**:  
    If paradigms are incommensurable, how can historians *diagnose* shifts from within? **Solution**: Look for *indicators* of rupture:  
    - Sudden redefinitions of "solved problems"  
    - New criteria for grant funding/publication  
    - Explicit debates over foundational terms in referee reports  

  - **"Many Anomalies, No Crisis" Case**:  
    Kuhn’s crisis requires **loss of confidence in the paradigm’s problem-solving ability**, not anomaly count. *E.g.*, 19th-century ether anomalies were "normal"; Michelson-Morley + blackbody radiation + radioactivity = crisis.  

  ---

  ### **Testing Your Cases**  

  #### **Replication Crisis in Psychology**  
  - **Crisis?** **Yes**, if:  
    - It provoked loss of confidence in *foundations* (e.g., null hypothesis testing, publication practices), not just fixes.  
    - New standards emerged (pre-registration, Bayesian stats) *incommensurable* with old norms.  
  - **Not a paradigm shift?** If reforms are accretive (e.g., adding replication as a "patch").  
  - **Diagnosis**: Grant files funding reproducibility centers; referee reports demanding open data *as a validity condition*.  

  #### **Psychiatry: Syndromic → Dimensional/Mechanistic**  
  - **Paradigm shift?** **Yes**, if:  
    - "Mental disorder" undergoes meaning variance (syndrome-as-disease vs. mechanism-as-disease).  
    - Crisis existed (*e.g.*, DSM-5 debates admitting syndromic failure; RDoC as rupture).  
    - Incommensurability: Mechanistic explanations ignore syndromic boundaries (e.g., transdiagnostic circuits).  
  - **Normal science?** If dimensional tools are "puzzles" refining syndromes (e.g., adding biomarkers to DSM categories).  
  - **Evidence**: NIMH’s RDoC funding sidelining DSM-focused research; papers redefining "disease" in methods sections.  

  ---

  ### **Key Takeaways**  
  - **Non-negotiable**: Incommensurability, meaning change, crisis-driven social abandonment.  
  - **Tensions to navigate**: Granularity (subfield shifts are valid) vs. holism; diagnosing incommensurability without hindsight.  
  - **Avoid overstretch**: If all 4 non-negotiables aren’t met, it’s not a Kuhnian shift – call it "major reform," "reorientation," or "Lakatosian programme shift."  

  This framework lets you defend "paradigm shift" rigorously *or* strategically retreat to more precise terminology. For mid-century biomedicine, granularity + meaning variance will likely be your decisive evidence.
