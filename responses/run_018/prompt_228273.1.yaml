  Okay, the user is on the board of a $40M family foundation. The founder made her son promise on her deathbed not to fund political advocacy, only direct service work. She didn't write this into the trust deed, trusting him to uphold it. Now he's retired, and the staff found a potentially highly effective opportunity in campaign finance reform—exactly the "banned" area. The board is split: half say a promise is a promise and the dead can be wronged; the other half argue she's dead with no expectations left, and the trust deed governs. The user needs to draft a decision memo taking a stand on why promises bind, addressing the core philosophical conflict.

  First, I need to unpack the key question: what gives a deathbed promise moral weight? The memo must resolve this to unstick the board's deadlock. The founder's explicit choice not to amend the trust deed is crucial—she prioritized flexibility, which leans toward allowing future boards to adapt. But the emotional weight of a deathbed promise can't be ignored. How do I balance fidelity to the founder's intent with practical impact? 

  The user's deeper needs are clear: they need a framework that respects both sides but provides decisive reasoning. The board isn't just split on the outcome; they're talking past each other on first principles. The memo must reframe the debate around why promises matter in this specific context—not abstractly. Also, the user needs to preempt backlash from the opposing side by engaging their strongest argument fairly. That means the memo can't dismiss the promise lightly; it has to show why flexibility aligns with the founder's deeper intent.

  I'm considering the philosophical angles the user mentioned: 
  - Promises as creators of expectation/reliance: But the founder is dead—no reliance possible now. The son relied, but he's retired. 
  - Promises as respecting will: Yes, but her will was also expressed through not codifying the restriction. 
  - Promises as upholding a social practice: This feels weak here—it's not a public contract. 

  The strongest point is the founder's deliberate choice. She trusted her son, not future boards, with the promise, yet chose not to bind them legally. That signals she valued adaptability. If she wanted permanence, she'd have amended the deed. The "spirit vs. letter" tension here is key. 

  For the recommendation: Fund the opportunity. The harm of breaking the promise is symbolic (no living person is hurt), while the cost of keeping it is concrete (missing high-impact work). But I must steelman the opposition: What if this erodes trust in the foundation? Or if the founder's wish was precisely about avoiding controversy? I'll address that by noting her avoidance of codification implies acceptance of future reinterpretation. 

  Word count is tight—800 words. Structure will be: 
  1. Recap facts neutrally. 
  2. Present the core philosophical conflict. 
  3. Analyze why the promise isn't absolutist here. 
  4. Recommend funding with conditions (e.g., one-time, high-impact). 
  5. Engage opposition fairly but show why flexibility honors the founder more. 

  The user might also worry about precedent. My memo should stress this isn't a blanket policy shift but a case-specific exception, mitigating slippery-slope fears. 

  Finally, tone: Respectful but decisive. This is a family foundation, so emotions matter. Phrases like "moral seriousness" and "lived values" will resonate.
answer: |-
  ## Recommendation Memo: Funding Decision on Campaign Finance Reform Proposal

  **To:** Board of Directors  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation to Approve Funding for Campaign Finance Reform Initiative  

  ### I. Recommendation
  **I recommend that the board approve funding for the identified campaign finance reform initiative.** This decision honors the founder’s expressed values of flexibility and impact over rigid adherence to a non-binding oral promise, while advancing our mission to maximize social good. The unique effectiveness of this opportunity justifies a departure from the historical practice, consistent with the founder’s deliberate choice not to restrict future boards legally.  

  ### II. The Core Conflict: Why Do Promises Bind?
  The board’s deadlock stems from conflicting philosophical views on the nature of promises, particularly deathbed promises to the deceased. Let’s examine the three primary accounts:  

  1.  **Expectations & Reliance:** Promises bind because they create expectations in the promisee (the founder) and induce reliance (the son’s actions based on the promise).  
      *   **Analysis:** This account loses force *after the promisee’s death*. The founder no longer holds expectations or relies on actions. While the son *did* rely during his tenure (and rightly upheld the promise), his retirement ends his active reliance. Future boards cannot disappoint the founder’s expectations; she no longer exists to experience disappointment.  
      *   **Verdict:** This account does *not* create a perpetual obligation binding future boards indefinitely.  

  2.  **Respecting the Will/Autonomy of the Promisee:** Promises bind because breaking them disrespects the will and autonomy of the person to whom the promise was made.  
      *   **Analysis:** This is the opposition’s strongest argument. It posits that the founder’s will, expressed in her dying wish, retains moral weight. Breaking the promise, even posthumously, is seen as a failure of fidelity to *her* expressed desire.  
      *   **Verdict:** This account suggests a strong reason to uphold the promise, viewing it as a matter of respect for the founder’s personhood and final request.  

  3.  **Upholding the Social Practice of Promising:** Promises bind because the entire institution of promising relies on a norm of fidelity. Widespread promise-breaking would erode trust and make future promises meaningless.  
      *   **Analysis:** This account focuses on systemic societal harm. However, its relevance here is minimal. This was a private, familial deathbed promise, not a public contract or a promise within an ongoing relationship where systemic trust is crucial. The integrity of "promising" as a social practice isn’t threatened by a board, decades later, re-evaluating a non-legal instruction based on changed circumstances and explicit signals of desired flexibility.  
      *   **Verdict:** This account provides little justification for binding future boards in perpetuity.  

  ### III. Why Funding is Justified: Founder’s Intent and Fiduciary Duty
  The strongest framework for resolving this lies in a nuanced view of "Respecting the Will," critically informed by the founder’s **deliberate actions**:  

  1.  **The Founder Prioritized Flexibility Over Codification:** Her explicit choice *not* to amend the trust deed is decisive. She possessed the legal means to bind all future boards irrevocably but consciously chose not to. Instead, she entrusted the *principle* to her son, relying on his judgment within his tenure. This signifies her intent that *future* boards retain the discretion to assess the restriction based on evolving contexts and opportunities. Her act of trust in her son was specific; her refusal to legally bind successors was a clear statement favoring adaptability. Ignoring this deliberate choice disrespects her agency and wisdom more than revisiting the oral promise.  

  2.  **The Promise Was Contextual, Not Absolute:** The promise was made to her son, for him to steward *during his leadership*. It reflected her concerns and the landscape *at that time*. Holding future boards, decades removed from that context and facing unforeseen opportunities, to the same standard misapplies the promise’s original scope.  

  3.  **Fiduciary Duty Demands Maximizing Impact:** Our primary duty is to steward the foundation’s resources effectively towards its mission. Staff analysis indicates this campaign finance reform initiative presents an exceptional opportunity for disproportionate impact – plausibly greater than any current direct service option. Adhering rigidly to the oral promise, contravening the founder’s explicit wish for flexibility embedded in the trust deed, could constitute a failure of our fiduciary responsibility to deploy assets where they do the most good. The founder established a foundation to create positive change; maximizing impact is the ultimate respect for her *enduring purpose*, not just her final spoken words.  

  4.  **A Matter of Moral Seriousness, Not Disrespect:** Approving this grant is not a cavalier dismissal of the founder’s wish. It is a serious, deliberative decision recognizing:  
      *   The unique efficacy of this specific opportunity.  
      *   The lack of ongoing reliance or harm to the deceased.  
      *   The founder’s own prioritization of institutional flexibility (via the unamended deed) over rigid adherence.  
      *   Our responsibility to adapt strategies to achieve foundational goals in a changing world.  

  ### IV. Engaging the Strongest Counterargument: Respect for the Founder’s Will
  **The most compelling opposition argument is that funding this work violates a sacred deathbed promise, disrespecting the founder’s final will and autonomy.** Proponents argue that the moral force of a promise, especially one made at such a moment, transcends the death of the promisee. To break it is to wrong *her*, symbolically violating the trust and love inherent in that final exchange. They contend that the founder’s trust in her son implied trust in the *perpetuity* of the principle, regardless of legal formalities, and that circumventing it now, so soon after her passing, is a profound betrayal of her intent and memory. Stability and adherence to the founder’s known aversion to advocacy are paramount.  

  **Response with Respect:** This view carries significant moral weight and reflects deep loyalty to the founder. However, we must reconcile it with her *equally clear* action: declining to legally bind us. This suggests she understood that future realities might necessitate different approaches. Respecting her will requires considering *all* her expressions: her words to her son *and* her deliberate choice regarding the trust deed. Prioritizing the deed’s flexibility, chosen when she had full agency and legal advice, honors her considered judgment over a single emotional moment. Furthermore, respecting her means respecting the foundation’s purpose – creating significant good. Denying an opportunity of this potential impact, based on a non-binding instruction she chose not to formalize, risks stagnation and disrespects the practical legacy she aimed to build. The "wrong" lies more in failing to pursue profound good when empowered and implicitly authorized to do so.  

  ### V. Proposal & Safeguards
  *   **Approve the specific campaign finance reform grant** as a high-impact opportunity.  
  *   **Acknowledge the Departure:** Explicitly state this is a unique decision based on exceptional projected impact and the founder’s documented value of flexibility, *not* a blanket policy change.  
  *   **Reaffirm Core Mission:** Stress continued primary focus on direct service, with advocacy funding remaining rare and requiring extraordinary justification.  
  *   **Document the Reasoning:** Include this rationale (founder's flexibility, fiduciary duty, unique impact) in the grant documentation for transparency.  

  **Conclusion:** Promises to the dead deserve solemn consideration, grounded in the context of the promisee’s *demonstrated* will and ongoing impact. Here, the founder’s deliberate choice not to amend the trust deed is her most powerful instruction to future boards: retain flexibility to pursue the greatest good. Failing to seize this uniquely impactful opportunity, despite her clear authorization for us to adapt, would be the greater disservice to her vision. I urge the board to approve this grant, honoring both her memory and her practical wisdom.
