  **C Tier: (ii) Epsilon-superrationality**  
  Cooperation’s dependence on near-certain credence in identical reasoning makes it hyper-sensitive to asymmetries, as infinitesimal differences in information access instantly degrade credence and trigger defection.  

  **D Tier: (i) Pure reasoning-based symmetry breaking**  
