  The asymmetry point is particularly sharp. From outside, we see moral greatness; from inside, the saint may have surrendered the reflective self needed for authentic agency. This feels analogous to how utilitarianism treats persons as value-vessels rather than ends-in-themselves.

  Possible resolutions to explore:
