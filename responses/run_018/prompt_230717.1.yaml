  ---

  ### **Key Design Notes**  
  - **Why start with hands-up questions?** Forces personal stakes. Non-rhetorical = no nodding.  
  - **Why split feelings in STEP 4?** Vital to preempt "catharsis solves everything." The *after* feeling is the payoff.  
  - **Why end on "rehearsal"?** Connects to lived experience—readers instinctively recognize "practicing vulnerability."  
  - **Announcing cuts:** Builds trust; shows deliberate focus.  

  This sequence turns "sadness as insight" into a felt discovery, not a lecture. Good luck!
