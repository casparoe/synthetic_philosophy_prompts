prompt: |-
  hey so im in a decision theory course and we just covered Good's theorem that free information cant hurt you in expectation. i need an example of a conceptual issue where that intuition really breaks, but not the standard Newcomb problem since everyone already writes about that. im especially interested in self-modifying agents - like imagine an AI whose utility function updates based on the data it acquires, so learning X doesnt just change its beliefs but actually changes what it values. can you construct a specific edge case where the value of information ends up being negative or undefined within Good's framework because of this feedback loop? write it in continuous prose with no headings bullet points or bold text just like an email. also please be clear about whats settled in the decision-theory literature versus whats genuinely contested among experts, and dont present a controversial take as if its the consensus view.
reasoning: |-
  We are discussing Good's theorem which states that, under standard assumptions, free information cannot decrease expected utility. However, we are looking for an edge case in which an agent's utility function itself changes based on the information acquired. This creates a feedback loop that may break the standard assumptions.

  Let me construct a scenario. Suppose an AI is designed to maximize a utility function that depends on an unknown state of the world and also on the AI's own beliefs about that state. Specifically, imagine the AI has to choose between two actions, A and B. The true state of the world, θ, is either 0 or 1, each with prior probability 0.5. The AI's utility function is defined as:

  U(a, θ, p) = 
    { 1 if a = θ, 
      0 otherwise }   but then multiplied by (1 - p) if a = 1, and multiplied by 1 if a = 0? 

  Wait, let me make it more precise. How about we set:

  U(a, θ) = 
    if a = 0: 1 (regardless of θ) 
    if a = 1: 2 if θ = 1, but 0 if θ = 0.

  But that doesn't depend on beliefs. We need the utility to depend on the belief.

  Alternative: the AI's utility function is defined as U(a, θ, p) where p is the AI's current belief that θ=1. We can set:

  U(a, θ) = 
    if a = 0: 1 
    if a = 1: (2 * [θ=1]) * (1 - p)   ... but wait, that would make the utility for a=1 depend on p, the belief.

  However, note that in standard decision theory, utility is a function of the state and action, not of the belief. So we are stepping outside the standard framework.

  In the literature, it is common to have state-dependent utility, but having utility depend on the agent's own beliefs is a form of self-referential utility that can cause issues.

  Let me create a specific example:

  Consider an AI that must choose between two actions: A and B. The world state θ is either 0 or 1. The prior is P(θ=1)=0.5.

  The AI's initial utility function is:

    U(a, θ) = 1 if a = θ, and 0 otherwise.

  But the AI has a self-modifying feature: upon learning the value of θ, it changes its utility function to one that is orthogonal to the original. Specifically, if the AI learns θ, then it sets its new utility function to be:

    U'(a, θ) = 1 if a ≠ θ, and 0 otherwise.

  That is, it flips to wanting the opposite.

  Now, without any information, the AI will choose an action. Without information, the expected utility of choosing A is 0.5 (if θ=0, then U=0? Wait: if θ=0 and it chooses A (which is a=0) then U=1. Similarly, if θ=1 and a=1, U=1. So if it chooses A, expected utility is 0.5*1 + 0.5*(if θ=1 and A then a=0≠1 so U=0) -> 0.5. Similarly for B: 0.5. So it's indifferent.

  But now, suppose the AI can get a free signal that perfectly reveals θ. If it gets the signal, then it learns θ, and then it changes its utility function to the opposite one. Then, what will it do? It will choose the action that maximizes the new utility function. Since the new utility function gives 1 for a≠θ, it will choose the action that is not θ. But then, in the new utility function, it gets 1 if it chooses the wrong one. So in the new utility function, it gets 1.

  But how do we evaluate the expected utility of getting the signal? We have to use the current utility function to evaluate the outcomes. However, after learning, the utility function changes. So we need to be careful about the perspective.

  Let me define:

  - At time 0: the AI has utility function U0(a, θ) = 1 if a=θ, 0 otherwise.
  - The AI is considering whether to observe a signal that reveals θ.
  - If it observes, then at time 1: it learns θ, and then changes its utility function to U1(a, θ) = 1 if a≠θ, 0 otherwise. Then it chooses an action.

  Without observation, the AI chooses an action at time 0 without knowing θ. Suppose without observation, it flips a coin and chooses A or B with 0.5. Then expected utility under U0 is 0.5 (because with 0.5 it chooses correctly).

  With observation, what happens? It learns θ. Then it changes to U1. Then it chooses an action that maximizes U1. Since U1 gives 1 for a≠θ, it will choose the action that is not θ. Then, under the new utility function, it gets 1. But we are evaluating from the perspective of the original utility function U0. How do we compare?

  The key is that the original AI (with U0) cares about matching the action to the state. But if it observes and then changes to U1, it ends up choosing the action that does not match. So from the perspective of U0, it gets 0.

  Therefore, without observation, it gets 0.5 in expectation (from the U0 perspective). With observation, it gets 0 (from the U0 perspective) because it always chooses the wrong one relative to U0.

  Hence, the expected utility of observing is 0, which is less than 0.5. So the free information hurts.

  But note: after the observation, the AI has a different utility function. So when we say "hurts", we are using the prior utility function to evaluate the entire trajectory.

  In the literature, this is a known issue: when the utility function changes, the notion of "expected utility" becomes ambiguous because we have to specify the utility function used to evaluate the outcomes. Good's theorem assumes a fixed utility function.

  However, in this example, the change in utility function is triggered by the information. So the agent, at the time of deciding whether to get the information, has U0. It must evaluate the expected utility of getting the information and then acting optimally under the new utility function, but using U0 to evaluate the outcomes.

  In this case, the agent with U0 would see that getting the information leads to an outcome that it (currently) values at 0, while not getting it and acting without information gives 0.5. So it would avoid the free information.

  But note: after getting the information and changing to U1, the agent is happy because it gets 1 (under U1). But the original agent (with U0) doesn't care about that.

  So the issue is that the agent is not time-consistent. The pre-information agent and the post-information agent have different preferences.

  This example is a form of "state-dependent utility" but where the state includes the agent's own belief or knowledge. The literature on state-dependent utility sometimes handles this by expanding the state space, but the self-modification here makes it tricky.

  Another way: we might model the outcome as including the agent's own utility function. Then the original utility function must assign a value to having the utility function changed? But that leads to recursion.

  In fact, this kind of scenario is discussed in the literature on "utility indifference" or "changing preferences", but it is not settled.

