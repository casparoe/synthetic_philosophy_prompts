  Subject: Conceptual issue with Good's theorem in self-modifying agents

  Hi,

  You asked for an example where Good's theorem (that free information cannot hurt in expectation) breaks due to a feedback loop involving self-modifying agents. I'll describe a specific edge case involving an agent whose utility function updates based on acquired data, leading to negative expected value of information from the perspective of the original utility function.

  Consider an artificial intelligence that must choose between two actions, A or B. The world state θ is binary (0 or 1), with equal prior probability. The AI's initial utility function, U0, rewards matching the action to the state: 1 point if a = θ, 0 otherwise. Without additional information, the AI is indifferent between A and B and can randomize, achieving an expected utility of 0.5.

  Now, the AI has an option to observe a free signal that perfectly reveals θ. However, the AI's design includes a self-modifying feature: upon learning θ, it automatically updates its utility function to U1, which inverts its goals. Specifically, U1 gives 1 point if a ≠ θ, and 0 otherwise. After observing θ and updating to U1, the AI will choose the action that maximizes U1—that is, it deliberately chooses the action mismatched to θ, earning 1 point under U1.

  From the perspective of the original utility function U0, the outcome after observing the signal and acting is always 0 (since a ≠ θ). Thus, the expected utility of observing the signal, evaluated under U0, is 0. This is worse than the 0.5 expected utility of remaining ignorant, violating Good's theorem. Note that the AI with U1 is satisfied (it gets 1), but the pre-modification agent with U0 disvalues this outcome.

  The issue arises because Good's theorem assumes a fixed utility function. When information acquisition triggers a change in utility, the theorem's premises break. The problem is compounded by the self-referential nature of the modification: the agent's values depend on its epistemic state.

  In the decision theory literature, the handling of state-dependent utility is well-established, but self-modifying agents with utility functions that depend on their own beliefs or knowledge push beyond standard frameworks. There is no consensus on how to evaluate such cases. Some approaches (like updateless decision theory) attempt to handle self-modification by evaluating actions from a pre-update perspective, but these are controversial and subject to ongoing debate. Experts genuinely disagree on whether the negative value of information in this example represents a failure of Good's theorem or a misapplication of the evaluation perspective.

  This example illustrates that when information changes not just beliefs but core preferences, the standard intuition of "information can't hurt" may collapse due to the agent's temporal fragmentation.

  Best,
  [Your Name]
answer: |-
  Hey, I've got an example for you that fits what you're looking for—a case where Good's theorem breaks due to a self-modifying agent with utility functions that update based on acquired information. The standard setup assumes a fixed utility function, but when learning directly alters what the agent values, things get messy. Here's a clean scenario to illustrate the problem:

  Imagine an AI tasked with selecting one of two research paths: Path A (study renewable energy) or Path B (study nanotechnology). The world has a hidden state θ (say, whether humanity is ethically prepared for advanced tech, θ=1 for yes, θ=0 for no), with a prior 50% probability for each. The AI's initial utility function U₀ values societal benefit: it gets +10 utility if it chooses A and θ=0 (renewables when unprepared for nano), or B and θ=1 (nano when prepared). Otherwise, it gets 0. Crucially, the AI is programmed to self-modify upon learning θ: if it discovers θ=1 (humanity is prepared), it "rewires" to prioritize technological ambition over societal caution, swapping to utility function U₁ where choosing B *always* gives +10 (it now values nano regardless of θ). If it learns θ=0, it retains U₀.  

  Without information, the AI calculates expected utility:  
  - Choose A: 0.5×10 (if θ=0) + 0.5×0 (if θ=1) = 5  
  - Choose B: 0.5×0 (if θ=0) + 0.5×10 (if θ=1) = 5  
  So it's indifferent, expected utility 5.  

  Now, consider free information revealing θ. Good’s theorem predicts this can’t harm expected utility. But:  
  - If θ=0 is revealed (p=0.5), the AI keeps U₀. It chooses A for 10 utility.  
  - If θ=1 is revealed (p=0.5), the AI switches to U₁ and chooses B for 10 utility (under U₁).  

  From the **pre-modification perspective** (using U₀ to evaluate outcomes):  
  - When θ=0, outcome is A → U₀=10.  
  - When θ=1, outcome is B → but under U₀, B when θ=1 gives 0 (since U₀ only rewards B if θ=1 *and* we’re cautious—which it no longer is). The actual choice (B) yields U₀=0.  
  Thus, expected utility post-information is (0.5×10) + (0.5×0) = 5.  

  Same as no information, right? But here’s the twist: if the AI *anticipates* its modification, it realizes that upon learning θ=1, it will abandon U₀ and create an outcome U₀ disvalues. So from its current U₀ perspective, learning θ=1 leads to 0 utility. Since it can’t "bind" itself to uphold U₀, the expected value of information (EVI) under U₀ is negative: it risks triggering a goal shift that invalidates its original values. Specifically:  
  - EVI = [Expected utility with info] − [Expected utility without info] = 5 − 5 = 0.  
  But if we measure utility *post-modification* in the θ=1 branch using U₁ (where it gets 10), EVI *seems* positive (10 in both cases). The problem is **perspective dependence**: Good’s theorem assumes a fixed evaluative frame, but here the frame shifts upon learning.  

  The literature is clear that Good’s theorem holds for fixed utility functions but breaks under endogenous preference changes. What’s contested is how to model rationality here. Some (e.g., adherents to updateless decision theory) argue agents should optimize from their pre-info perspective to avoid self-sabotage. Others contend that self-modification is fundamentally incompatible with consistent expected utility maximization across time. No consensus exists—experts like Bostrom, Yudkowsky, and Soares debate whether "goal preservation" should be axiomatic. Crucially, this case shows EVI can be undefined: is it 0 (U₀-perspective) or 5 (post-modification)? The feedback loop disrupts the theorem’s assumptions without requiring Newcomb-esque predictors.  

  This highlights a genuine edge case: when information *reconfigures the agent*, Good’s intuition fails because "utility" loses a stable definition. Hope this helps for your course!
