prompt: |-
  I keep running into a weird loop in moral arguments and I'm not sure if it's just circular reasoning or something more specific. A person says we shouldn't coerce someone because that violates their autonomy. When you ask why autonomy trumps wellbeing here, they say autonomy just is the kind of value that forbids coercion — it's not justified by wellbeing, it defines what's at stake. So autonomy started as the reason but turned into a redescription of the verdict. But then in the next debate they treat autonomy as an independent good that can be weighed against other goods, as if it had its own foundation. The supposed ground and the particular judgment keep trading places, and the person never notices. I know there's that ancient question about whether something is good because God commands it or vice versa, but this feels like a modern secular version where people slidd back and forth without realizing there are two directions. Is there an established name for this specific slidding — the way a moral principle and the cases it's meant to support keep defining each other? How is it different from the classic dilemma and from plain question-begging? If there's no specific term, can you coin one with clear boundry conditions?
reasoning: |-
  Okay, the user is describing a frustrating pattern they've noticed in moral arguments. They're encountering a loop where autonomy starts as a justification against coercion, but when challenged about why autonomy matters more than wellbeing, the person redefines autonomy as inherently valuable without external justification. Then later, that same person treats autonomy as just one value to be weighed against others like wellbeing. 

  This feels slippery to the user - like the principle and its applications are mutually defining without stable grounding. They recognize it resembles Euthyphro's dilemma but in secular ethics. Their core question is whether this has a name or if it needs one.

  Hmm... this is actually quite sophisticated. The user has identified a genuine tension in moral philosophy between deontological approaches (where autonomy has intrinsic worth) and consequentialist frameworks (where it's instrumentally valuable). The frustration comes from interlocutors inconsistently switching between these frames without acknowledging the shift.

  The key insight is recognizing two distinct functions of autonomy in arguments: (1) As a foundational principle that defines morality itself (deontological view), and (2) As a discrete good within a broader utilitarian calculus (consequentialist view). The problem arises when people treat these as interchangeable.

  For naming options... "Principle-Case Conflation" captures the mutual dependence aspect. "Autonomy Dialectic" references the Hegelian back-and-forth they described. "Teleological Flip-Flop" highlights the inconsistent treatment of ends vs means. Of these, "Principle-Case Conflation" feels most precise and descriptive.

  Important to distinguish this from simple circular reasoning: Here it's not just assuming the conclusion, but actively redefining the premise depending on the challenge. Also different from Euthyphro which is about divine command theory specifically.

  The user seems philosophically literate - they referenced Euthyphro correctly and noticed a nuanced logical pattern. Their request for "boundary conditions" suggests they want analytical rigor. Probably an academic or very engaged autodidact. The frustration implies they've hit this wall repeatedly in real debates.

  Should emphasize that this isn't necessarily fallacious - it might reflect deep philosophical disagreements the interlocutors haven't articulated. But the inconsistency in individual arguments is problematic. The proposed term gives them language to call out this specific move.
answer: |-
  This is a sharp observation of a genuine and pervasive pattern in moral reasoning that lacks a single established name—but we can pinpoint it precisely. What you're describing is **Principle-Case Conflation**, a dialectical loop where a moral principle and its paradigmatic applications mutually define each other without independent grounding, allowing proponents to slide between treating the principle as foundational *and* derivative depending on context.

  Here's the breakdown:

  1.  **The Loop Structure:**
      *   **Step 1 (Principle as Justifier):** "We shouldn't coerce because it violates Autonomy (A)." *(A is offered as the reason for the judgment)*
      *   **Step 2 (Principle as Definition/Intrinsic):** When challenged ("Why is A more important than Wellbeing (W) here?"), the response is: "A *is* the kind of value that forbids coercion. Its normative force isn't derived from W; it *defines* what's morally relevant in this domain." *(A shifts from being a justifier to being the intrinsic nature of the moral object itself)*
      *   **Step 3 (Principle as Weightable Good):** In a different context (e.g., paternalism, resource allocation), the same person argues: "We must balance A against W/other goods here." *(A is now treated as one independent good among others, with its value potentially quantifiable)*
      *   **Step 4 (Loop Back):** If challenged in Step 3 ("Why is A a good at all, or how much weight does it have?"), they often revert to Step 1 or Step 2 language, invoking the inherent wrongness of violating A (e.g., "Because coercion is *fundamentally* wrong!"). *(The foundational/deontic aspect re-emerges)*

  2.  **Why "Principle-Case Conflation"?**
      *   **Conflation:** The principle (Autonomy) and its core application (prohibiting coercion) are treated as inseparable. The principle *is* defined *by* its core implications, and those implications *only* derive force *from* the principle. They co-constitute each other.
      *   **Sliding Function:** The principle's *role* slides:
          *   **Deontic Anchor:** In Step 2, it acts as a foundational, non-derivative constraint (like a Kantian categorical imperative).
          *   **Teleological Good:** In Step 3, it acts as a value to be maximized or traded off (like a consequentialist good).
      *   **Lack of Independent Grounding:** Neither the principle nor the core judgment it justifies (don't coerce) is anchored in something external (like wellbeing, social contract, intuition, flourishing) *consistently*. The grounding shifts depending on the challenge.

  3.  **Boundary Conditions for Principle-Case Conflation (PCC):**
      *   **Requires:** A core moral principle (P) and a paradigmatic moral judgment (J) that P is claimed to justify (e.g., P=Autonomy, J="Don't coerce").
      *   **Manifests When:**
          1.  Defending J *against a countervailing value* (e.g., Wellbeing) invokes P as *intrinsic or definitional*, claiming P's force is non-derivative and trumps the countervalue in this case.
          2.  Defending the *weight or value* of P itself, *especially against the same countervailing value*, treats P as a *derivative or commensurable good* that can be balanced against that countervalue.
          3.  There is no *consistent, external* foundation offered for *both* P and its relationship to J. The justification relies on the mutual dependence of P and J.
          4.  The proponent slides between these modes (deontic anchor vs. teleological good) without acknowledging the shift or providing a meta-justification for *why* P functions differently in different contexts.

  4.  **Distinguishing from Similar Concepts:**
      *   **Euthyphro Dilemma (Piety/God):** PCC is the *secular, structural analogue*. Euthyphro asks: "Is P (piety) good because God commands J (pious acts), or does God command J because P is good?" PCC asks: "Is J (don't coerce) right because P (autonomy) forbids it, or is P valuable because it produces/protects J (or other goods)?" Both reveal a justificatory loop between principle and application.
      *   **Circular Reasoning / Begging the Question:** PCC *contains* circularity but is more specific. Simple circularity: "Coercion is wrong because it violates autonomy. Autonomy is important because it forbids wrong things like coercion." PCC is *dialectical* – the circle expands across different argumentative contexts (defending the judgment vs. defending the principle's weight) and involves a *functional shift* in the principle (from constraint to good). The circularity isn't always in a single step; it's in the *system* of justification across challenges.
      *   **Reflective Equilibrium:** This is a *method* for achieving coherence between principles and judgments through mutual adjustment. PCC is a *pathology* within this process, where the adjustment lacks external anchors and the principle/judgment pair becomes vacuously self-supporting, resistant to revision by other values. Reflective equilibrium ideally uses *multiple* considered judgments and principles; PCC often isolates *one* principle-judgment pair.
      *   **Inconsistent Moral Realism:** PCC can occur within various meta-ethical frameworks, but it often reflects an *unacknowledged tension* between deontological and consequentialist impulses within the proponent's reasoning, or an unstable attempt to ground a deontic constraint without a clear ontology for it.

  **Why PCC is Problematic:**

  It creates an argumentative black box. The principle/judgment pair becomes immune to external critique because any challenge to the judgment is deflected by invoking the principle's intrinsic nature, while any challenge to the principle's weight or foundation is deflected by invoking the core judgment's obvious wrongness or by switching to treating the principle as a good. It prevents genuine moral deliberation about trade-offs or foundations.

  **In short:** You've identified **Principle-Case Conflation (PCC)** – a dialectical loop where a moral principle (P) and its core justifying judgment (J) are defined in terms of each other, allowing P to function inconsistently as either a foundational deontic constraint *or* a weighable teleological good depending on the argumentative pressure, without stable external grounding. The boundary is the inconsistent functional shift of P in defense of J vs. defense of P itself, coupled with the mutual definition.
