answer: |-
  **Bottom line:** Bengal confirms entitlement collapse is *always* politically mediated – power structures determine whose entitlements break and whose are protected – but critically undermines Sen's democracy-famine thesis. Colonial priorities actively *shaped* the entitlement failures (laborers/fisherfolk crushed by hyperinflation, small farmers by crop loss/market failure) via policy choices, information suppression, and enabling trader hoarding. While authoritarian neglect was obvious, the episode shows democratic accountability is *insufficient* without robust institutions and responsive governance; Bengal's provincial government (elected, but weak and captured) failed catastrophically despite nominal democracy.

  **Full Mapping:**

  1.  **Entitlement Collapse Specifics:**
      *   **Laborers (Rural/Urban):** Wage entitlements collapsed as rice prices hyper-inflated (300%+), while wages lagged severely. Their ability to command food via labor exchange evaporated.
      *   **Fisherfolk & Artisans:** Similar labor-based entitlement collapse; their goods/services became non-essential relative to food, destroying purchasing power.
      *   **Small/Marginal Farmers:** "Direct entitlements" failed due to regional crop damage (cyclone, brown spot disease), forcing reliance on markets where prices were prohibitive. "Trade entitlements" collapsed as they sold assets cheaply to buy expensive rice.
      *   **Traders/Landowners:** Entitlements *strengthened*. Hoarding amplified scarcity, inflating prices. Landlords profited from distress sales of assets by the starving. The colonial state protected *their* access.

  2.  **Political Mediation & Information Distortion:**
      *   **Denial & Distortion:** The colonial administration (London/Calcutta) prioritized wartime logistics and suppressed famine severity ("price crisis", not famine). This distorted information flows, delaying relief and denying the scale of entitlement collapse.
      *   **Policy as Cause:** "Denial Policy" (boat/movement restrictions) disrupted traditional supply chains, exacerbating local shortages. Prioritizing grain for cities/army diverted food from rural areas.
      *   **Enabling Collapse:** By refusing to acknowledge famine and intervene forcefully via price controls/rationing/distribution, the state *allowed* the entitlement collapse of vulnerable groups to proceed unchecked while protecting elites.

  3.  **Straining Sen's Democracy Thesis:**
      *   Bengal had a *provincial* elected government since 1937. It possessed significant responsibility but lacked full control over resources/policy. It failed utterly: paralyzed, indecisive, and potentially captured by landed interests benefiting from high prices.
      *   **Sen Silent:** Sen underplays this *sub-national* democratic failure and the active role of *local* power structures (landlords, traders) within the colonial system in shaping entitlements. Bengal shows democracy isn't a binary switch; weak, unresponsive, or captured democratic institutions offer no protection. The key failure was political *will* and institutional *capacity* to protect vulnerable entitlements, irrespective of the precise regime label. Authoritarian neglect takes many forms, including democratic inaction.
