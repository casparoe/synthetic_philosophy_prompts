answer: |-
  Here’s a rigorous specification of **desiderata for theories of understanding in cognitive proxying**, designed to capture the phenomena, critical distinctions, and tensions you’re grappling with. I’ve structured it around non-negotiables (NN), negotiable preferences (NP), and explicit tensions.

  ---

  ### **Core Desiderata: What a Theory Must Explain**  
  *(Non-Negotiables)*  
  1. **Competence without Reconstruction (NN)**  
     - *Phenomenon:* Ability to *use* AI outputs correctly (e.g., a surgeon acting on a diagnosis) without accessing the AI’s internal reasoning.  
     - *Requirement:* Explain how understanding can exist despite opaque inference paths.  

  2. **Error Detection & Defeasibility (NN)**  
     - *Phenomenon:* Distinguishing between users who can spot AI errors (e.g., noticing inconsistent outputs) vs. those who blindly trust.  
     - *Requirement:* Explain how understanding enables critical engagement (e.g., rejecting flawed outputs).  

  3. **Transfer & Generalization (NN)**  
     - *Phenomenon:* Using AI-derived insights in novel contexts (e.g., applying a diagnosed principle to a new symptom).  
     - *Requirement:* Show how understanding transcends specific AI outputs.  

  4. **Justification vs. Comprehension (NN)**  
     - *Phenomenon:* The gap between *knowing that p* (justified belief) and *grasping why p* (e.g., student pasting an unevaluated essay vs. refining claims via critique).  
     - *Requirement:* Explain why "sounding right" ≠ understanding.  

  ---

  ### **Critical Distinctions to Preserve**  
  *(Non-Negotiables)*  
  5. **Procedural vs. Propositional Understanding (NN)**  
     - *Distinction:* Knowing *how to use* an AI tool (procedural) vs. grasping *why its output is correct* (propositional). The surgeon may have the former but lack the latter.  

  6. **Proxy-Reliance vs. Proxy-Crutching (NN)**  
     - *Distinction:* Using AI to *extend* cognition (like a calculator) vs. *replacing* cognition (e.g., student unable to evaluate claims). A theory must explain the threshold.  

  7. **Distributed vs. Individual Understanding (NP/NN Boundary)**  
     - *Distinction:* Whether understanding can be partly "offloaded" to the AI system (distributed) or must reside solely in the human (individual).  
     - *Non-Negotiable Core:* The human must retain *sufficient* agency to qualify as epistemically autonomous.  

  ---

  ### **Operational Constraints**  
  *(Negotiable Preferences)*  
  8. **Conscious Access (NP)**  
     - *Preference:* Must every inference step be consciously accessible?  
     - *Viable Alternative:* Understanding as the ability to *interrogate* the system (e.g., via counterfactual questions) without full step-by-step traceability.  

  9. **Practical Feasibility (NN in Context)**  
     - *Constraint:* In high-stakes domains (e.g., surgery), time/cognitive limits prohibit exhaustive verification.  
     - *Requirement:* Explain how "understanding" can coexist with *bounded transparency*.  

  ---

  ### **Tensions & Jointly Unsatisfiable Desiderata**  
  **Key Conflict: Transparency vs. Feasibility**  
  - **Full Causal Transparency (Ideal):** Requires the user to mentally reconstruct the AI’s reasoning chain.  
  - **Practical Feasibility (Reality):** Humans cannot audit billion-parameter models in real-time.  
  - **Tension:** These *cannot* be jointly satisfied in high-stakes, time-sensitive scenarios with current black-box AI.  

  **Resolution Paths a Theory Must Address:**  
  - **Minimal Sufficient Transparency:** What *level* of causal insight is necessary? (e.g., knowing failure modes > knowing all steps).  
  - **Compensatory Mechanisms:** Can understanding arise from *secondary checks* (e.g., cross-validation, uncertainty estimates) without causal access?  
  - **Competence over Reconstruction:** Understanding as *curated reliance* (e.g., surgeon knowing when to trust AI based on empirical track record + domain knowledge).  

  ---

  ### **Other Potential Tensions**  
  - **Autonomy vs. Efficiency (NP):** Maximizing epistemic independence (no AI) vs. leveraging AI for complex tasks. A theory must define *acceptable tradeoffs*.  
  - **Explainability vs. Understanding (NN):** Explainability (AI’s self-report) ≠ user understanding (e.g., an AI generating "explanations" the user can’t critically evaluate).  

  ---

  ### **Summary: Non-Negotiable Core**  
  A viable theory **must** account for:  
  1. Understanding without full reconstruction (≠ memorization).  
  2. Defeasibility & error detection.  
  3. Transferability of insights.  
  4. A clear threshold between *reliance* (tool-like) and *crutching* (erosion).  
  5. Compatibility with human cognitive limits (rejects "conscious access to every step").  

  **The surgeon-student contrast epitomizes the core challenge:**  
  - The surgeon *understands* if they can: (a) contextualize the diagnosis, (b) spot incongruent outputs, (c) act decisively under uncertainty.  
  - The student *lacks understanding* if they: (a) can’t defend claims, (b) don’t recognize factual errors, (c) treat plausibility as truth.  

  **The irreconcilable tension remains:** Full causal transparency is infeasible with opaque AI, but its *complete absence* voids understanding. Theories must specify *what kind* of transparency is minimally sufficient (e.g., mechanistic insights about failure boundaries, not step-by-step traces). This is the frontier of your "cognitive proxying" problem.
