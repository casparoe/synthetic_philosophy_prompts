  For the teaching sequence, I'm thinking we need to start by destabilizing their existing "collapse = apocalypse" assumption. Showing modern examples first would help - like Detroit's deindustrialization versus rural depopulation. Concrete contemporary cases make the decoupling/drift distinction visceral before moving to ancient societies. 

  The Maya case feels ideal as the carrying example: clear evidence of both population decline (drift in the southern lowlands) and institutional persistence (northern centers continuing). Plus, it avoids the Bronze Age's complications. 

  Ah, the assessment question! It needs to force application, not regurgitation. Something like "If archaeologists found an abandoned city with intact murals showing bureaucracy, but no mass graves - decoupling or drift?" would reveal if they grasp causality direction. 

  I should warn against overcomplication - no cliometrics rabbit holes. And on terminology: "Maya" for civilization, "Mayan" for language. Got it. Their spelling notes are endearing but irrelevant to the framework. 

