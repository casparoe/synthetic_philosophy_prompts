answer: |-
  Here’s a structured teaching arc focused on conceptual clarity, designed for your group’s background. The goal is to build the **decoupling vs. drift** distinction step-by-step while preempting misconceptions.

  ---

  ### **Teaching Arc: "Collapse as Transformation"**
  *(90-min session framework)*

  #### **1. Destabilize the Default Mental Model (15 mins)**  
  - **Hook:** Show images of modern "ghost towns" (e.g., Detroit ruins vs. abandoned rural villages). Ask: *"If aliens excavated these in 1,000 years, would they call this ‘collapse’?"*  
  - **Target Misconception:** Head off the "sudden catastrophe" assumption here. Emphasize:  
    > *"Societies aren’t reactors—they don’t ‘melt down.’ They unravel, adapt, or fade. Let’s find better metaphors."*  
  - **Key Idea:** Introduce **time scales**. Collapse narratives often compress decades/centuries into "events."

  #### **2. Core Distinction: Frame the Lens (10 mins)**  
  - **Define Terms Visually:**  
    - **Structural Decoupling:**  
      *"Institutions shatter (tax systems, elites, writing), but people stay. Like a dissolved company—workers are there, but the org chart is gone."*  
    - **Demographic Drift:**  
      *"Population dwindles/migrates, but institutions hold. Like a shrinking town with an intact mayor/council—just fewer citizens."*  
  - **Critical Foundation:** Stress that **both processes can occur together or separately**. The distinction is about *primary drivers*.

  #### **3. Carrying Case: The Maya (25 mins)**  
  **Why NOT the Bronze Age?** It’s a tangle of invasions, climate shifts, and fragmented records—too muddy for a clean first application. Scholars still debate its drivers (e.g., was it "systems collapse" or migration?).  

  **Why the Maya?**  
  - Clear evidence of **both processes in parallel**:  
    - **Drift:** Southern lowlands (e.g., Tikal) show abrupt population decline (drought? disease?).  
    - **Decoupling:** Northern centers (e.g., Chichén Itzá) thrived *after* the "collapse" with adapted institutions (trade networks, rituals).  
  - **Science Hook:** Use pollen/isotope data to show environmental stress ≠ total societal death.  
  - **Lesson:** "Collapse" was regional transformation—not a full stop.  

  #### **4. Applying the Lens (20 mins)**  
  - **Easter Island:** *"Drift or decoupling?"*  
    - Drift: Population crashed (ecocide? rats?);  
    - Decoupling: Chiefly/symbolic systems persisted (ahu building continued post-collapse).  
  - **Roman Empire (West):**  
    - Decoupling: Imperial bureaucracy failed, but local governance/churches endured.  
    - *(Note: Avoid East/West complexity—focus on Italy/Gaul.)*  
  - **Check for Misconceptions:** Ask: *"Did everyone die in these cases? Or did life just reorganize?"*

  #### **5. Assessment Question (10 mins)**  
  **Avoid Parroting:** Don’t ask "Define decoupling." Instead, pose:  
  > *"Imagine archaeologists in 3024 find a flooded coastal city with intact tax records from 2050–2100, but no evidence of mass death. Nearby inland villages show booming art and trade. Drift, decoupling, both, or neither? Why?"*  
  - **Why it works:** Tests if they can ID **absence of population loss** (not drift) vs. **institutional continuity in new hubs** (not decoupling). Forces nuanced application.

  #### **6. What to Refuse (Explicitly)**  
  - **Reject:** *"We won’t debate ‘progress’ or ‘complexity’—this is about mechanics, not morality."*  
  - **Skip:** Cliometrics, systems ecology, or Diamond-esque monocausality. Say: *"Today’s tool is a scalpel, not a Swiss Army knife."*  
  - **Block:** "Who was right?" debates (Tainter vs. Middleton, etc.). Focus on your framework’s utility.

  ---

  ### **Key Adjustments for Your Group**  
  - **Leverage Science Backgrounds:** Use terms like *signal degradation* (decoupling) vs. *attenuation* (drift).  
  - **Maya/Mayan:** Use "Maya" for civilization (e.g., "Maya cities"), "Mayan" for language/culture (e.g., "Mayan script").  
  - **Cognitive Load:** Anchor in **visuals** (timelines, population graphs, maps) over text.  
  - **Your Quirks:** Playfully note *"I’ll say ‘seperate’—just mentally correct it!"* Builds rapport.

  ---

  ### **Why This Sequence Works**  
  1. **Dismantles melodrama** upfront with relatable modern examples.  
  2. **Maya’s regional variability** perfectly illustrates decoupling/drift as parallel outcomes.  
  3. The **assessment question** isolates their grasp of causality vs. correlation.  
  4. **Constraints** (skipping Bronze Age/cliometrics) prevent overwhelm.  

  This arc rewards scientific habits: pattern-spotting, rejecting binaries, and rethinking "failure." Let me know if you need case study sources!
