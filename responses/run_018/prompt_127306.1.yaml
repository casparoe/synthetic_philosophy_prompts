prompt: |-
  hey, i'm prepping questions for next week's podcast. my guest is a philospher defendng a modified teleosemantic account of mental content — she keeps the millikan-style proper function backbone but ditches normal conditions in favor of what she calls control-theoretic setpoints to fix the disjunction problem. i don't want her just running through teleosemantics 101.

  draft eight to ten interview questions that actually dig in. i want at least one pressing misrepresentation — like the frog-snapping-at-flies case — without letting her smuggle intentionality back in through the setpoint machinery. another should push why evolutionary history fixes content rather than individual learning history, and what that does to culturally acquired concepts. and i need one asking whether the setpoint approach really naturalizes normativity or just relocates it into engineering specs.

  for each, include a follow-up keyed to the reply she's most likely to recieve — e.g., if she says the setpoint is fixed by error-correction dynamics, hit her on whether that makes content observer-relative. write it casual, like you're helping a longtime rationalist-blog-reader prep a colloquium Q&A. keep it focused, no reading lists, and don't ask for citations — she should be able to answer from the view itself.
reasoning: |-
  Okay, the user is prepping for a podcast interview with a philosopher who has a modified teleosemantic theory. They need deep, challenging questions that go beyond the basics. Let me start by understanding the key elements of her theory. She keeps Millikan's proper function but replaces normal conditions with control-theoretic setpoints to solve the disjunction problem. The user wants to avoid her rehashing Teleosemantics 101.

  First, I need to tackle the frog example. The classic issue is that the frog snaps at flies and BB pellets, leading to a disjunction problem. Her solution uses setpoints instead of normal conditions. The follow-up should challenge if the setpoint still relies on intentionality. Maybe ask if the setpoint is defined by the system itself or requires an observer. That could reveal if there's a circular dependency.

  Next, why prioritize evolutionary history over learning history? This affects culturally acquired concepts. If content is fixed by evolution, how do new concepts from culture fit in? Follow-up could question if learned concepts have derived content or if her theory can't account for them. She might say learning systems have their own functions, but then push on whether that dilutes the evolutionary basis.

  The normativity question is crucial. Teleosemantics aims to naturalize normativity via functions. Using setpoints from control theory might just shift normativity to engineering. Ask if setpoints are natural or designer-imposed. Follow-up on whether error-minimization dynamics make norms observer-relative, which undermines naturalization.

  I should also consider other angles. Maybe the relationship between perception and action in setpoints. If setpoints are action-oriented, does that limit content? Follow-up on whether all content is tied to action, which might exclude abstract concepts.

  Another point: how setpoints avoid indeterminacy. Earlier solutions like optimal conditions had issues. Does her approach solve that? Follow-up could challenge if setpoints are too observer-dependent if they're idealized.

  Also, the role of malfunction. If a system deviates from setpoints, is that a false representation? Follow-up on ambiguous cases where deviations might be adaptive, testing if misrepresentation is clearly defined.

  Need to ensure questions are concise and conversational. Avoid academic jargon but stay precise. User is a rationalist-blog-reader, so familiarity with concepts like disjunction problem or normativity is assumed. No citations needed—focus on the theory's internal coherence.

  Check if all user points are covered: frog case, evolutionary vs. learning, normativity, possible misrepresentation, follow-ups. Also, make sure questions push back without being confrontational, keeping it engaging for a podcast. Each question should force the guest to clarify unique aspects of her theory and address potential weaknesses.
answer: |-
  Here are eight focused, combative-but-fair questions designed to probe the unique edges of her view, with built-in "next move" follow-ups. Wording is deliberately conversational for podcast flow:

  1.  **The Setpoint Pivot:**
      *   **Q:** "Okay, so you're ditching 'normal conditions' – the big thorn in teleosemantics' side – and replacing it with control-theoretic setpoints to finally crack the disjunction problem. Walk us through how that *actually* solves the frog snapping at BB pellets case. Isn't the fly/setpoint just as vulnerable to disjunction as 'fly under normal conditions' was? What makes the setpoint pick out *fly* and not *fly-or-BB-pellet-when-it-triggers-the-same-sensory-input*?"
      *   **Likely Reply:** She'll emphasize the setpoint is defined by the *internal error-correction dynamics* towards a specific state (e.g., successful capture/eating), which BB pellets don't satisfy long-term.
      *   **Follow-Up:** "But if the setpoint is defined by the *dynamics* aiming at successful capture, doesn't that risk smuggling intentionality in through the back door? Isn't 'successful capture' already laden with representational content (*that* it's a fly)? How do you cash out 'success' non-intentionally *before* content is fixed?"

  2.  **Evolution vs. Learning & Culture:**
      *   **Q:** "You stick doggedly to *evolutionary* proper function as the ultimate content-fixer. But a huge chunk of our mental life – especially complex, culturally acquired concepts like 'mortgage' or 'democracy' – seems rooted in *individual learning history* or socio-cultural scaffolding. Why shouldn't the function derived from *my learning history* fix the content of *my* 'democracy' concept, rather than some ancient evolutionary pressure?"
      *   **Likely Reply:** She'll argue learned devices inherit their derived proper function from the learning mechanisms themselves, which *do* have evolutionary functions, or that cultural concepts are implemented by evolutionarily shaped learning systems.
      *   **Follow-Up:** "Doesn't that make the content of culturally learned concepts incredibly indirect and potentially indeterminate? If my 'democracy' concept's content is fixed by the evolutionary function of, say, general pattern recognition or social learning, doesn't that massively underdetermine what *specific* concept it actually is? How does evolution fix *that* content?"

  3.  **Normativity Relocated?:**
      *   **Q:** "Teleosemantics promises to naturalize representational *normativity* – why a state *should* mean X and is *wrong* when it doesn't. You ground this in 'proper function'. But now you're tying content to *control-theoretic setpoints*. Isn't this just swapping biological norms for engineering norms? Why is deviating from an evolved setpoint *objectively wrong* in a representational sense, rather than just a system malfunction defined by some engineer (natural selection)?"
      *   **Likely Reply:** She'll argue the setpoint *is* defined by the system's own evolved design for persistence/reproduction; the "engineering" *is* the natural selection process. The normativity comes from the system's own functional organization.
      *   **Follow-Up:** "But 'persistence/reproduction' sounds like a high-level goal. If the setpoint is ultimately defined by minimizing error relative to *that* overarching biological imperative, doesn't that make the representational normativity observer-relative? An alien scientist could define the 'setpoint' differently. How is this *intrinsic* normativity?"

  4.  **Setpoints & Indeterminacy:**
      *   **Q:** "One big win of ditching normal conditions was supposed to be avoiding the messy indeterminacy of specifying *which* conditions are 'normal'. But how do setpoints actually fix determinacy? A system might have multiple intertwined control loops. What stops the frog's visual system's setpoint from being 'detect small moving dark spots' (indeterminate between flies/BBs) rather than 'detect flies'? How do you pick the *right* level of setpoint description?"
      *   **Likely Reply:** She'll emphasize the specific functional role in the larger organismic context – the setpoint is defined by its role in feeding behavior/sustenance.
      *   **Follow-Up:** "But isn't 'feeding behavior/sustenance' itself a high-level description? Couldn't the visual system's *immediate* functional role be 'trigger tongue-flick reflex upon spot-detection'? How does evolution *privilege* the 'fly' level over the 'dark-spot' or 'tongue-trigger' level without appealing to something intentional?"

  5.  **Perception vs. Action Setpoints:**
      *   **Q:** "Control theory often deals with *action* guidance. How cleanly does this map onto purely *perceptual* states? Let's say I misperceive a stick as a snake. What's the 'setpoint' my visual system is failing to reach? Is it 'accurately representing snake' (which seems circular) or 'triggering appropriate avoidance behavior' (which makes the content behavioral, not perceptual)? How do setpoints fix the content of passive perceptions?"
      *   **Likely Reply:** She'll argue perception is always embedded in action cycles; the perceptual state's function is to guide action towards the setpoint defined by the organism's needs.
      *   **Follow-Up:** "Doesn't this risk collapsing all perceptual content into *action-oriented* content? If the content of 'seeing red' is ultimately fixed by its role in guiding me towards setpoints (e.g., ripe fruit, danger), how does your account capture the distinct *phenomenal* or *descriptive* aspect? Is there room for 'red' meaning just *redness*?"

  6.  **Malfunction & Misrepresentation:**
      *   **Q:** "In classic teleosemantics, misrepresentation happens when a device fires under *abnormal* conditions. You've ditched 'normal conditions'. Under your setpoint view, what *exactly* constitutes a misrepresentation? Is it *any* state that doesn't lead to achieving the setpoint? Or is it a state that *wouldn't* lead to the setpoint *even if* the control system was functioning properly?"
      *   **Likely Reply:** She'll likely say it's the latter – a state that fails to accurately guide the system *towards* its setpoint due to malfunction or noise, even if the system compensates later.
      *   **Follow-Up:** "But how do you isolate the 'malfunction' part without a prior notion of what the state *should* represent? If the system *compensates* for the faulty input and *still* reaches the setpoint (e.g., frog misses the BB but catches a fly later), was it *really* a misrepresentation? Doesn't success wash out the error?"

  7.  **The Abstraction Problem:**
      *   **Q:** "Setpoints seem great for concrete biological goals like 'eat', 'flee', 'mate'. How do they scale to abstract concepts – things like 'justice', 'number 7', or 'unicorn'? What's the control-theoretic setpoint for thinking *correctly* about unicorns? Does evolution even *have* a proper function for these?"
      *   **Likely Reply:** She'll argue abstract concepts are implemented by cognitive systems with evolutionary functions (e.g., social coordination, planning), and their setpoints relate to successful operation *within those systems* (e.g., coherent belief integration, successful prediction).
      *   **Follow-Up:** "This seems incredibly broad. Doesn't 'successful operation' or 'coherent integration' risk being vacuous or, worse, collapsing into a coherence theory of truth divorced from evolution? How does 'successful operation of the number system' specifically fix the content *'7'* versus any other coherent mathematical concept?"

  8.  **The "Design Stance" Dependency:**
      *   **Q:** "Ultimately, both proper function *and* setpoints seem reliant on taking the 'design stance' – interpreting the system *as if* it was designed for a purpose (by evolution). Isn't the whole apparatus observer-dependent? Couldn't different, equally valid interpretations of the 'purpose' or 'setpoint' of a biological system lead to different assignments of content? Does this undermine the objectivity teleosemantics aims for?"
      *   **Likely Reply:** She'll argue evolution provides an objective fact about design – there *is* a specific selective history that fixes the function/setpoint, even if it's complex to discern.
      *   **Follow-Up:** "But the *description* of the setpoint seems crucial and potentially variable. Is the frog's visual system 'designed to detect flies' or 'designed to detect small moving dark spots' or 'designed to trigger tongue-flicks'? All might be true at different levels. How does evolution uniquely privilege *one* description as the content-fixer without interpretive input from us?"

  **Key Tone Notes:**
  *   Use phrases like "Walk us through...", "Help me see...", "But isn't the worry here...", "Convince me that..." to keep it engaged but challenging.
  *   Explicitly reference her unique terms ("setpoints", "ditching normal conditions").
  *   Frame follow-ups as genuine puzzles arising *from her answer*, not just gotchas. The goal is to force clarification and defense of the *novel* parts of her view.
  *   Avoid jargon where possible ("disjunction problem" is fair game for this audience, but maybe briefly unpack "teleosemantics" if the podcast intro doesn't).

  This line-up should prevent a rehash of basics and force her to defend the novel, potentially vulnerable joints of her modified theory. Good luck with the podcast!
