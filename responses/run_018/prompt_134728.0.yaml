prompt: |-
  I keep hearing people say Western values like its a real thing that explains why countries do things different, but nobody ever lists what they actually are. Last week my uncle said we have to defend Western values against universal healthcare because markets and individual choice are part of our culture, and then on tv someone said Western values mean free speech and gender equality, but then another guy said those things exist everywhere so they cant be Western. I'm not in school or anything but I've been thinking about this on my own and I'm confused if its just an empty phrase people use to win arguments or if there's actually something there.

  Can you act like an expert in political philosophy and conceptual analysis and think really carefully about this? Maybe start by brainstorming all the different precise claims someone could be making when they say Western values — like are they talking about actual shared beliefs, or just a team jersey that shows who you're rooting for, or maybe a hidden claim that only Western countries can have democracy and science? I want you to lay out each possible reading like a menu, from the totally obvious ones to the more radical ones, and say for each whether its just a platitude, whether its actually defensible, and whether it really supports the argument people are using it for — like my uncle using it to argue against healthcare. Also please think about whether the phrase is doing indexical work, basically just pointing to the speaker's group instead of describing real norms, and whether there's an assumption that these values are unique to the West even when other cultures clearly share them.

  Please write your answer in continuous prose only — no headings, no bullet points, no bold text, no tables — just like a long letter or email. Don't cite specific books or authors I need to look up, just work through the ideas yourself.
