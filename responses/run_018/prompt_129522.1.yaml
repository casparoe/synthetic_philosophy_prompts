  For technical execution: The rhyme scheme will be A1bA2 / abA1 / abA2 / abA1 / abA2 / abA1A2 where A1 and A2 are the refrains. Concrete rhymes (weight/fate, blade/shade) will anchor the causal argument, while slant rhymes (on/gone, played/space) will reflect the cousin's "nothingness" position. The meter will be loose iambic pentameter to keep it natural.

