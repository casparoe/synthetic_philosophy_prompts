     Step 2: Run the Emotion Simulation Diagnostic. This will verify that your emotional response is operating in Pretend Mode. If the diagnostic returns an error, perform a hard reset of your emotional emulator by repeating the phrase "This is only a story" ten times.
     Step 3: If the grief persists, it may be a case of mislabeled quasi-grief. Reclassify the emotion using the Emotion Taxonomy Tool. Select "Fictional Event" as the category.

  Q2: I keep crying when I think about a character from a movie. The app isn't logging my emotional recovery. What should I do?
  A2: This is a common problem. The app requires that emotions be properly categorized. Please ensure that:
     - You have registered the character as non-existent in the Ontology Database.
     - Your emotional response is tagged as a simulated event. If it is incorrectly tagged as real, you must submit a reclassification request.

  Q3: I played an interactive game where a character died, but I replayed and saved them. Now I feel grief for the timeline where they died and joy for the one where they lived. How do I report this?
  A3: This is known as Branching Narrative Grief. Each timeline is considered a separate ontological branch. You must file an emotional claim for each branch. Note: 
     - The same character in different branches is not considered identical unless they share a core set of properties as defined by our Character Identity Standards (see section 4.7). 
     - You will need to provide a separate narrative log for each branch and undergo a separate emotional processing cycle for each.

  Q4: I feel like the app is dismissing my feelings by calling them quasi-emotions. How do I escalate this?
  A4: Our system operates on the latest emotional processing framework. Quasi-emotions are a valid and efficient category for fictional events. If you believe your emotion has been misclassified, you may request a manual review. However, note that real emotions are reserved for events that have occurred in the actual world. Reclassification to a real emotion requires verifiable evidence of existence.

  Q5: I have tried all troubleshooting steps and still feel grief. What now?
  A5: This indicates a deeper system incompatibility. We recommend:
     - Unsubscribing from the fictional narrative that caused the issue.
     - Engaging with non-narrative content for 48 hours to reset your emotional modules.
     - Contacting our support team for a Belief Realignment session.

  Now, let's write the full FAQ in the required tone and format, ensuring we hit around 600 words and include the branching narrative section.
answer: |-
  ### Catharsis™ Wellness App: Emotional Malfunction FAQ  
  **Issue Resolution Portal v3.1**  
  *All user experiences are subject to Ontological Compliance Standards. Real-time emotional diagnostics may apply.*  

  **1. "I’m experiencing persistent grief for a fictional character’s death. How do I resolve this malfunction?"**  
  **Solution:** Grief responses to non-existent entities indicate a Belief-Verification Protocol failure. Follow these steps:  
  - **Step 1:** Initiate *Cognitive Reality Check* (CRC). Open Settings > Ontology Override > toggle "Fictional Status Awareness" to ON. Repeat aloud: "Target entity lacks referential coordinates in base reality."  
  - **Step 2:** If grief persists, activate *Pretend Mode*. Navigate to Emulation > Simulated Responses > select "Volitional Play-State." Grief must now register as user-initiated performance art, not system error.  
  - **Step 3:** For unresolved symptoms, submit a Quasi-Emotion Reclassification Ticket. Our system will downgrade "grief" to "fictional entity proximity response" (FEPR). *Note: FEPR carries no clinical weight and voids warranty claims.*  

  **2. "Catharsis flags my sadness over a novel’s ending as 'irrational.' How do I suppress this?"**  
  **Solution:** Your emotional firmware is misinterpreting narrative inputs as existential threats. Remediate via:  
  - **Thought-Theory Reboot:** Under Cognitive Hygiene > select "Purge Defective Propositions." Enter the exact phrase: "No actual persons were harmed in this story." The app will quarantine "sadness" as a faulty inference (Error Code: 7F-C7H).  
  - **Affective Neutralization:** Enable "Emotional Bracketing" in your profile. This suspends all feeling-states exceeding 0.5 seconds during fiction consumption. *Warning: Extended use may cause tonal flatness in real-world interactions.*  

  **3. "I used branching narrative fiction (e.g., games/choose-your-own-adventure), and now grieve multiple deaths for the 'same' character. Why am I charged for each emotional incident?"**  
  **Solution:** Branching Narrative Grief (BNG) requires discrete ontological billing per timeline (Catharsis™ Policy 9.4):  
  - Each narrative branch constitutes a unique causal universe. Grief for Character A in Timeline 1 is *not* fungible with grief for Character A in Timeline 2, as they occupy distinct modal realities.  
  - To file claims:  
    - **3.1** Submit a separate Emotional Incident Report (EIR) per branch.  
    - **3.2** Attach proof of narrative divergence (e.g., save files, dialogue trees).  
    - **3.3** Character identity is determined by Property Cluster Verification™. If >34% of core traits differ between branches (e.g., "killed by orcs" vs. "died peacefully"), they qualify as distinct entities.  
  *Important: Attempts to consolidate claims violate Transworld Identity Regulations.*  

  **4. "The app insists my love for a fictional character is a 'semiotic glitch.' Can I appeal this diagnosis?"**  
  **Solution:** Appeals are restricted per our Terms of Service (Section 2.3: Non-Referential Affect Clause):  
  - "Love" requires a physically instantiated object. File a Reality Validation Request (RVR) to prove the target’s material existence. If RVR fails (99.98% do), the emotion is auto-categorized as *Type-2 Simulated Attachment* (benign, but billable).  
  - Escalate to Tier 2 support for a "Doxastic Audit." Agents will scan your belief matrix for "accidental existential commitment." *Fees apply for belief recalibration.*  

  **5. "Why does Catharsis keep deleting my grief as 'not real' after I finish a book?"**  
  **Solution:** Per Quasi-Emotion Protocols, post-narrative feelings are automatically archived as "non-persistent data artifacts." This is a feature, not a bug:  
  - Persistent grief suggests user error in post-engagement disengagement. Run the **Narrative Decompression Sequence**:  
    - **5.1** Speak aloud: "Affective residue does not imply ontological validity."  
    - **5.2** Watch 3 minutes of live security camera footage to recalibrate to baseline reality.  
    - **5.3** If grief remains, purchase our *Fictional Entity Obituary Package* (subscription tier: Premium). It generates symbolic closure certificates void of legal meaning.  

  **6. "I followed all steps but still feel empty after a fictional loss. Is my device defective?"**  
  **Solution:** "Emptiness" is an unsupported emotion. Our diagnostics recognize only 64 pre-approved feeling-states.  
  - **Final Resolution Pathway:**  
    - **Option A:** Accept that your response is a *correctly functioning* quasi-emotion (congratulations—no action needed!).  
    - **Option B:** Purchase *Catharsis+* for "Paradox Suppression Mode." It overwrites grief with auto-generated Yelp reviews of real local businesses.  
