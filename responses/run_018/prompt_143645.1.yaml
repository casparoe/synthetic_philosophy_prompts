  don't include requests for citations, bibliographies, or reading lists; this should be fully answerable without web access and readable to someone who knows the basic paradox but still feel fresh enough that a small model can't just recycle standard intro material. also avoid putting anything in quotation marks that comes from an actual text — paraphrase without quotes. make sure the satire lands for a specialist but stays legible for a general reader who doesn't know Radford from radford.
reasoning: |-
  We are creating a satirical deadpan customer-service FAQ for a fictional wellness app called "Catharsis". The app treats emotional responses to fiction as a technical malfunction. The tone should be deadpan corporate tech support, never breaking character.

  The FAQ should parody standard analytic solutions to the paradox of fiction (such as pretend-theory, thought-theory, quasi-emotions) by framing them as troubleshooting steps. The paradox of fiction is the problem of why we feel real emotions for fictional characters/events even though we know they don't exist.

  Key elements:
  - Format: numbered FAQ entries, around 600 words.
  - Voice: deadpan tech support, corporate, never acknowledges the absurdity.
  - Content: 
    1. Address users complaining about "real grief" over non-existent characters.
    2. Frame the philosophical solutions as troubleshooting steps (e.g., for pretend-theory, instruct the user to pretend they are not experiencing the emotion).
    3. Include a section on "branching narrative grief" (for interactive fiction) where users must file separate emotional claims for each timeline. This raises issues about emotional investment tracking ontological commitment and what counts as the same character across worlds.
  - Satire: The exaggeration should come from actual features of the philosophical positions. The target is the analytic habit of dissolving the paradox by redefining the emotion (e.g., saying it's not real grief, but quasi-grief) rather than explaining it.
  - Avoid: 
     - Citations, bibliographies, reading lists.
     - Quotation marks for actual texts (paraphrase without quotes).
     - Naming specific philosophers or works.

  The piece should be legible to someone who knows the basic paradox but also to a general reader (so explain concepts implicitly through the satire).

  Structure the FAQ with numbered questions and answers. Let's aim for about 600 words.

  Possible questions:
  1. Why am I experiencing grief over a fictional character? (Answer: frame it as a malfunction, then provide troubleshooting steps that mirror the philosophical solutions)
  2. How do I stop feeling sad about a character that doesn't exist? (Provide steps that are the solutions: pretend, reconceptualize, etc.)
  3. What is branching narrative grief? (Explain that for interactive fiction, each timeline is a separate instance, so the user must file claims for each one. This mocks the idea that emotions are tied to specific ontologies.)

  Let's outline:

  1. Introduction: What is Catharsis? (Brief, corporate)
  2. Common issues and troubleshooting.

  Detailed FAQ:

  Q1: I recently finished a novel and now feel profound grief for a deceased character. How do I resolve this?
  A1: This is a known issue. Follow these steps:
