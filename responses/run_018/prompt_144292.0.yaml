answer: |-
  ### Workshop Exercise: Conceptual Slippage in Analog Synthesizer Restoration  
  **Objective:** To create experiential understanding of conceptual slippage (gradient categories collapsing under pressure) via a structured classification game. Participants confront ambiguity in labeling synthesizer modules as **O** (original), **CR** (copycat restoration), or **FR** (fluid recreation) using circuit-level evidence. Rules enforce binary choices on gradient cases, culminating in a destabilizing hidden case.  

  ---

  ### **Timeline (90 Minutes Total)**  
  | **Time** | **Phase** | **Key Activities** |  
  |----------|-----------|-------------------|  
  | 0–10 min | **Introduction** | Facilitator outlines:  
  - Context: Analog synth restoration microdomain (e.g., Moog, Buchla).  
  - Categories: **O** (all period-original parts), **CR** (faithful replica with original specs), **FR** (modern reinterpretation).  
  - Rules: Enforce *one* label per module; evidence-based arguments only. |  
  | 10–20 min | **Training & Role Assignment** | - Divide into 4 groups of 3.  
  - Assign roles per group:  
    - **Classifier**: Decides final label (must choose **O**, **CR**, or **FR**).  
    - **Challenger**: Must contest *at least one* label/evidence interpretation per module.  
    - **Archivist**: Records reasoning, awards reputation points (see *Scoring*).  
  - Practice: Groups classify one "warm-up" module (e.g., oscillator with unambiguous evidence). |  
  | 20–35 min | **Round 1 (Stable Cases)** | - Groups classify **3 modules** (5 min/module).  
  - Evidence cards emphasize clear traits:  
    - *Example*: "VCO: Carbon-comp resistors (1974), hand-soldered joints, no replacements → **O**."  
    - *Example*: "LFO: All transistors replaced with NOS (new old stock) equivalents → **CR**."  
  - Archivists log labels and reasoning. |  
  | **35 min** | **Introduction of Hidden Case** | - Facilitator distributes **Round 2 modules**, including the destabilizing case:  
    > **VCF Module Evidence**: *"Voltage-controlled filter; original ICs replaced (2023) with modern equivalents matching 1978 specs (e.g., LM13600). PCB is milled replica; response curve identical to factory unit."*  
    - *Do not* announce its significance. Rules unchanged. |  
  | 35–55 min | **Round 2 (Destabilizing Cases)** | - Groups classify **4 modules** (5 min/module), including hidden case.  
  - Evidence introduces gradients:  
    - *Example*: "EG: 50% original capacitors; op-amps upgraded to low-noise modern equivalents → **CR/FR ambiguity**."  
    - *Hidden case* blurs **CR** (period-correct function) and **FR** (non-original manufacturing). |  
  | 55–65 min | **Group Reflection** | - Groups discuss:  
    1. Which label caused the most tension?  
    2. Did evidence "weighting" shift during Round 2?  
    - Archivists compile key debate points. |  
  | 65–85 min | **Debrief** | Facilitator-led discussion:  
  1. **Reveal hidden case**: Highlight categorical collapse (e.g., groups forced **CR** label despite modern parts).  
  2. **Map slippage**:  
     - *Pressure-driven restructuring*: Time constraints + binary rules → participants overweight functional equivalence (e.g., "It *sounds* identical, so it’s **CR**").  
     - *Feature-weight shifts*: Early rounds prioritize "component age"; hidden case triggers focus on "circuit behavior."  
  3. **Predictable failure**: Groups retreat to functional-equivalence arguments to avoid category dissolution.  
  4. **Limitations**:  
     - *No analogy-driven restructuring*: Unlike Hofstadter’s Copycat, no automatic feature reweighting via analogy; pressure alone drives changes.  
     - *No emergent fluidity*: Rules prevent organic category evolution (e.g., no new labels like "hybrid"). |  
  | 85–90 min | **Wrap-up** | Summarize insights: Conceptual slippage arises when discrete labels meet gradient realities. |  

  ---

  ### **Materials List**  
  - **Module Packets**: 7 evidence card sets (3 for Round 1, 4 for Round 2). Each set includes:  
    - 1x *Module card* (e.g., "VCO, Moog Model D, 1975").  
    - 5–7x *Evidence cards* (e.g., "Oscillator core: Original germanium transistors" or "Power supply: Modern voltage regulator added").  
  - **Hidden Case Packet**: Evidence cards for VCF module (as described above).  
  - **Role Cards**: 4 sets (1 per group) labeled "Classifier," "Challenger," "Archivist."  
  - **Reputation Tokens**: 12 per group (3 per participant; use poker chips/sticky notes).  
  - **Timers**: For strict 5 min/module pacing.  

  ---

  ### **Scoring: Reputation Points**  
  - **Earning points**:  
    - Classifier: +1 per *unchallenged* label; +2 if label withstands challenge.  
    - Challenger: +1 per *upheld* challenge (classifier changes label); +1 for "most incisive question" (group vote).  
    - Archivist: +1 per module for "best reasoning summary" (group vote).  
  - **Losing points**:  
    - Classifier: -1 per overturned label.  
    - Challenger: -1 if no challenge issued in a module.  
  - **Victory Condition**: Highest-scoring participant per group earns "Master Restorer" title.  

  ---

  ### **Predicted Failure Mode**  
  In Round 2 (hidden case), groups will **prioritize functional equivalence** to force consensus:  
  > *"The filter responds identically to a 1978 unit, so it’s **CR**—ignore the modern PCB!"*  

  This avoids confronting categorical dissolution. Facilitator should note this in debrief as evidence of pressure-driven feature reweighting (function over material history).  

  ---

  ### **What the Exercise Cannot Reproduce**  
  1. **Automatic analogy-driven restructuring**: Unlike Hofstadter’s Copycat, pressure *alone* reshapes feature weights (e.g., "sound fidelity" gains priority). No emergent analogies (e.g., "VCF replacement is like replacing a heart with a synthetic organ").  
  2. **Fluid category generation**: Rules forbid new labels; participants cannot propose solutions beyond **O/CR/FR**.  

  ---  
  **Outcome**: Participants experience how conceptual boundaries collapse under real-world ambiguity, revealing the fragility of technical classification systems under constraint.
