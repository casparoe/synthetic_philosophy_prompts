prompt: |-
  Working on a short handout section on Taurek's "Should the Numbers Count?" and I want one case where the tables turn on the usual dialectic. So build me the reverse of the standard setup: a scenario where the plain numbers view (maximize expected lives saved, minimize expected deaths) says to write off the many and save the one, while a Taurek-style view — numbers never add up into a stronger claim, every person has an equal claim to a chance, so in the textbook one-vs-five case you'd give each side an equal shot — says the many still get a real chance, and a bigger one than the numbers view is willing to give them.

  Constraints: realistic setting (fire, collapsed building, ER, whatever), one paragraph, no magic, no perfect predictors, no lucky coincidence; and the numbers verdict has to fall out of the arithmetic rather than be stipulated — the many have to be genuinely harder or less likley to save, not just declared not worth it. Also don't cheat by making the one a kid, a relative, or someone with special ties to the rescuer.

  After the scenario: show the arithmetic and the reasoning for each view separately, name the single feature of the case that's doing the work, tell me what both verdicts become if I take that feature out, and give me the best line a numbers theorist has for saying I rigged it.
