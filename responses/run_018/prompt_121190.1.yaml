answer: |-
  Here's a realistic scenario, arithmetic breakdown, and analysis meeting all your constraints:

  **Scenario:** In a collapsed factory after an earthquake, you (a rescue commander) face two options before an imminent aftershock:  
  1.  Save **one trapped worker** near the entrance. Access is quick and clear (95% success chance).  
  2.  Save **five trapped workers** deep in a critically unstable section. Reaching them requires moving heavy debris under severe time pressure (15% chance *per person* of successful extraction before collapse). Attempting either group means abandoning the other. Time/resources prevent partial efforts.

  ---

  **Numbers View Verdict: Save the One**  
  *Reasoning & Arithmetic:* Maximize expected lives saved.  
  - Save the one: 1 person × 95% chance = **0.95 expected lives saved**.  
  - Save the five: 5 persons × 15% chance each = **0.75 expected lives saved**.  
  0.95 > 0.75. The high individual risk to the larger group makes their *collective* expected value lower than the near-certain rescue of the single worker. Sacrificing the one for a low-probability attempt on the many is unjustified.  

  **Taurek-Style View Verdict: Give all six a fair chance via a weighted lottery**  
  *Reasoning:* Each person has an equal claim to a chance at survival, regardless of group size or rescue difficulty. The numbers don’t aggregate into a stronger claim.  
  - Implement a lottery: Assign each of the six persons an equal probability of being chosen for rescue (1/6 ≈16.7% each).  
  - Since you can only attempt one *group*, allocate the probabilities:  
    - 1/6 chance (≈16.7%) to attempt saving the **one worker**.  
    - 5/6 chance (≈83.3%) to attempt saving the **five workers**.  
  *Result for the many:* Each of the five gets a **12.5% survival chance** (5/6 group chance × 15% individual success). While low, this is *far greater* than the **0% chance** the numbers view gives them (which writes them off entirely). The one worker gets a 15.8% chance (1/6 × 95%), lower than under numbers but preserving fairness.  

  ---

  **The Single Feature Doing the Work:**  
  **High per-person risk to the larger group.** The 15% individual success probability for the five is so low that their *collective* expectation (0.75) falls below the one’s high individual expectation (0.95).  

  **If This Feature Is Removed:**  
  - Suppose the five had a 25% per-person success chance instead (collective expectation: 5 × 0.25 = 1.25).  
  - **Numbers view:** Saves the five (1.25 > 0.95).  
  - **Taurek view:** Still uses the lottery (each of the five gets ≈20.8% chance: 5/6 × 25%). Both views now favor the many, but Taurek’s chance allocation remains distinct.  

  **Best Numbers Theorist Objection to "Rigging":**  
  *"You’ve artificially deflated the success probability for the larger group to make their expected value absurdly low—but in real crises, risk assessments are fluid. A commander could split resources (e.g., send one team to the easy rescue while others start clearing debris for the five), exploit uncertainty to improve odds mid-effort, or prioritize resilience (saving five might offer more future lives). Your scenario assumes static, worst-case probabilities to force the counterintuitive result, ignoring dynamic optimization."*  

  **Key Line for Handout:**  
  *"Taurek’s egalitarianism refuses to abandon the many to fate—even when their rescue is improbable—granting each a tangible chance where utilitarianism sees only a number too small to save."*
