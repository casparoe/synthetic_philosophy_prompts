answer: |-
  This objection cuts to the heart of a profound tension in moral philosophy. Let me break down the logic and address the apparent contradiction:

  ### 1. **The Core Dilemma**
     - **Anti-Ranking Premise**: Suffering is *non-fungible* (i.e., qualitatively unique across contexts). Therefore, aggregating or comparatively ranking atrocities is epistemically impossible and morally problematic (as it may trivialize unique experiences).
     - **Your Challenge**: If we reject *all* comparative metrics, doesn't this logically force us into treating all atrocities as *morally equivalent*? And if we still call genocide "distinct," isn't that a covert ranking?

  You're right that strict adherence to non-fungibility *seems* to collapse into moral equivalence. But this isn't inevitable. Here's how philosophers reconcile this:

  ### 2. **Rejecting "Equal Gravity" Without Ranking**
     - **Categorical Distinction ≠ Ordinal Ranking**: Philosophers like Claudia Card or Margaret Urban Walker argue we can identify *qualitative differences* in wrongs without assigning ordinal positions.  
       - Example: Genocide involves the *intentional destruction of a group* as such. This is categorically distinct from lethal neglect (systemic indifference) or forced displacement (violent erasure without annihilation).  
       - This distinguishes *kinds* of evil, not *degrees*. It’s like comparing murder to torture: both are grave, but their moral structure differs.  
     - **Anti-Reductionism**: Suffering isn’t a homogenous "substance" to be quantified. A genocide isn’t "worse" because it has "more suffering units"; its wrongness lies in its *specific intent, social meaning, and violation of fundamental human relations*.  

  ### 3. **Why This Isn’t "Smuggled" Ranking**
     - **Feature-Specific Comparisons**: Saying genocide has a "distinctive wrong" (e.g., group extermination) doesn’t imply it’s *overall* worse. It means:  
       - This wrong *cannot occur* in disasters without genocidal intent.  
       - Conversely, lethal neglect may involve distinct wrongs (e.g., betrayal of social trust).  
     - **Moral Incommensurability**: Some evils are *incomparable* not because they’re equal, but because they inhabit different moral dimensions. Think of art: we don’t rank Picasso against Mozart—they express different truths. Similarly, the Holocaust and the Atlantic slave trade each rupture humanity in irreducibly distinct ways.  

  ### 4. **Practical Implications**
     - **Justice & Remembrance**: We prioritize responses based on *ongoing harm* (e.g., reparations for slavery’s legacy) or *political urgency* (e.g., preventing active genocide), not a "ranking."  
     - **Historiography**: Historians avoid hierarchies but explore *contextual specificity* (e.g., how Stalinist purges differ from colonial massacres in ideology and social impact).  

  ### 5. **The Philosophers' Defense**
     Critics like John Kekes or Steven Pinker might accuse anti-ranking theorists of inconsistency. But rigorous anti-ranking positions (e.g., in feminist ethics or Holocaust studies) retort:  
     - **Moral Particularism**: Judgment requires deep engagement with *each* event’s context. Comparisons often flatten historical complexity into facile "oppression Olympics."  
     - **Preventing Hierarchies of Grief**: Ranking can imply some victims "matter more" (e.g., genocide vs. famine), politicizing memory and hindering solidarity.  

  ### Conclusion: A Third Way
  The anti-ranking stance doesn’t commit us to moral equivalence. Instead, it advocates:  
  - **Qualitative Discernment**: Recognize unique *structures* of evil (genocide’s group-destruction, slavery’s dehumanization).  
  - **Resisting Grand Hierarchies**: Reject *summative judgments* ("X is the worst evil in history") while permitting *contextual analogies* ("Both apartheid and caste systems institutionalize group-based humiliation").  

  This preserves moral seriousness without reducing suffering to a leaderboard. As philosopher Berel Lang puts it: *We don’t honor the dead by counting them, but by understanding what their deaths meant.*  

