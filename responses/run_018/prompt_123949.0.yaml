  Let me reconstruct their argument step by step. First premise: If we accept suffering is truly incomparable across contexts, then logically all atrocities must be morally equal. Second premise: But philosophers often simultaneously claim genocide has "distinctive" wrongness while rejecting comparisons. Conclusion: This looks inconsistent because "distinctive" implies a comparative judgment.

  *strokes chin* The cleverness here is in forcing a binary: either full comparability (allowing rankings) or absolute equivalence (no distinctions). The user's pushing anti-ranking theorists into a corner where any qualitative distinction becomes de facto ranking.

  But I recall philosophers like Claudia Card actually developed responses to this. Her atrocity paradigm theory might help - the key is separating the question "is this uniquely terrible?" from "is this worse than that?". The former identifies moral categories, the latter ranks instantiations. Like how murder and theft are distinct wrongs without saying which crime is "worse".

  *checks mental notes* Also worth addressing the "equal gravity" claim. Even if we reject cardinal rankings, we don't collapse into flat equivalence. We can have a partial ordering where some events share attributes (all genocides share intentional group-destruction) without lining them up numerically. It's not 1=2=3 but rather A≠B≠C with no arithmetic relation between them.

