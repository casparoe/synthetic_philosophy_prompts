  hey im a phd student in philosophy of science and im trying to wrap my head around a specific conceptual knot in kuhns later work on incommensurability. everyone at my dept talks about the global version—like newton vs einstein—but im more interested in local incommensurability, where two subfields inside the same paradigm (say molecular biology and evolutionary genetics) use the same lexical item but embed it in different taxonomic structures. the conceptual issue im stuck on is whether this local drift is just a watered-down case of global incommensurability or whether it works through a different mechanism, like a failure of joint reference rather than a failure of translation. can you walk me through the intuition for why local taxonomic mismatches dont automatically blow up into paradigm-level ontological divergence, and whether kuhn's idea that paradigms fix the world-ontology actually blocks that blow-up or just hides it? please answer in continuous prose only—no headings, no bullet points, no bold text, just straight paragraphs like an email. also sorry if my typing is sloppy, im on my phone and this is kind of urgent.
