  The mechanism difference seems real: global incommensurability is holistic meaning change, while local is more like semantic drift with partial reference preservation. I should emphasize Kuhn's post-1990 work where he explicitly contrasts these, especially his "taxonomic lexicons" idea. Local cases involve "meaning variance without reference failure" - both subfields refer to real aspects of genes, just differently sliced. 

