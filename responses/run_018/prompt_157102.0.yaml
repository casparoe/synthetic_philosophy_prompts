answer: |-
  Thanks for this query—it’s a sharp and underappreciated angle on Kuhn. Let me walk through the intuition step by step. You’re right that local incommensurability (e.g., "gene" in molecular biology vs. evolutionary genetics) isn’t merely a diluted global case but involves a distinct mechanism. Global incommensurability, like Newton vs. Einstein, hinges on holistic translation failure: concepts are embedded in mutually incompatible theoretical frameworks, making direct comparison impossible without a "gestalt switch." Local cases, however, occur *within* a shared paradigm. Here, the same lexical item is taxonomically anchored to different sets of kind-concepts, creating "referential drift" rather than full-blown ontological divergence.  

  The reason this local drift doesn’t escalate into paradigm-level rupture lies in Kuhn’s later idea of the "lexical structure" of a paradigm. A paradigm’s ontology isn’t monolithic but structured as a nested hierarchy of kind-concepts. Subfields share the overarching taxonomy (e.g., "DNA," "organism," "inheritance"), which fixes the *domain* of reality they jointly engage. Within that stable scaffolding, sub-specialties develop local taxonomies tailored to their specific puzzles. When molecular biologists and evolutionary geneticists use "gene," they’re not disputing the shared ontological grounding (e.g., that genes are heritable units encoded in DNA). Instead, they’re carving out different *aspects* of that shared entity: molecular biology might taxonomize genes by regulatory function or sequence structure, while evolutionary genetics might prioritize allelic variation in populations.  

  This works through **partial reference preservation**, not total reference failure. Both subfields refer to a common causal-historical entity (DNA sequences affecting phenotype), but their criteria for individuating or classifying "genes" diverge pragmatically. They can still coordinate because the paradigm’s core commitments (e.g., the central dogma) act as referential anchors. When they collaborate, they engage in "local translation"—adjusting the term’s inferential scope contextually without needing to reconcile their entire taxonomic structures. Kuhn’s world-ontology doesn’t *hide* the divergence; it *contains* it by delimiting the scope of kind-concepts. The paradigm’s stability arises from its ability to tolerate "fuzzy" edges in kind-concepts as long as core referents and exemplars remain aligned.  

  Where Kuhn’s model might feel like it’s "hiding" tension is in assuming practitioners seamlessly navigate these local mismatches. In practice, as your example suggests, unresolved taxonomic drifts *can* accumulate into larger schisms (e.g., the molecular vs. evolutionary synthesis debates). But Kuhn would argue this only becomes "revolutionary" if the local divergence undermines shared exemplars or values—say, if one subfield’s taxonomy persistently generates anomalies for the other. Until then, the paradigm’s ontology isn’t "blocking" the blow-up so much as absorbing the friction through its structured flexibility. The mechanism isn’t weaker—it’s different: not a failure of meaning *translation*, but a pragmatic misalignment in *taxonomic application* within a jointly inhabited world.  

  Hope this untangles some knots—happy to refine further.  

