  hey, i'm a retired biologist who's gotten really into philosophy of physics lately, and i've been trying to make sense of Einstein's hole argument. i keep running into two camps: one says the argument shows that spacetime points don't have real physical identity (the Substantivalists, i guess?), and the other says it's just a redundancy in how we write the math and doesn't tell us anything about ontology (the Relationalists?). but they always seem to talk past each other, so i want you to draft the joint statement they should have written after a real adversarial collaboration.

  i want it structured like this:

  first, a numbered section of agreed claims — stuff about the formal setup (Einstein field equations, active diffeomorphisms, the hole region where stress-energy is zero), about what actually needs explaining, and about what the argument definitively does and doesn't prove.

  then a disagreements table — the precise points of split, with each side's view phrased in wording thier own side would actually accept.

  then the cruxes: the sub-questions that, if answered, would actually move someone. i suspect one is whether diffeomorphism invariance is a physical symmetry or just descriptive redundancy, and another is whether fixing boundary conditions outside the hole restores determinism, but identify the real ones yourself.

  for each crux, include a concrete case or argument both sides agree bears on it, and write down each side's prediction in advance. for instance, they might both agree that a rotating black hole in asymptotically anti-de Sitter space with a fixed boundary metric at infinity is the right kind of test case — or pick a better one — and then say exactly what the Substantivalist expects versus the Relationalist.

  finally, tell me if any part of thier dispute is just verbal — like if they're using physical reality in different ways — and if so, which part and why.

  please don't give me a bibliography or citation list; i can't check those without searching, and i want something i can actually think through. also, sorry if i typo'd adverserial earlier — i meant adversarial.
