answer: |-
  This is one of the most profound ethical dilemmas – where two fundamental values (autonomy and preservation of life) collide violently. Your roommate's reaction, while painful to experience after saving them, isn't irrational or merely "hurt feelings." It stems from a deeply held philosophical position about the nature of promises, autonomy, and moral stains. Let's break it down:

  **Core Ethical Frameworks in Conflict:**

  1.  **Deontology (Duty-Based Ethics - Kant):** This aligns strongly with your roommate's view.
      *   **The Promise:** A promise creates a categorical duty. For Kant, breaking a promise treats the other person merely as a *means* to an end (saving them), not as an *end* in themselves (a rational being deserving respect for their autonomy and choices).
      *   **The "Stain":** The act of breaking the promise is inherently wrong, regardless of consequences. The good outcome (saving their life) doesn't erase the moral wrong of the violation itself. The "stain" is the violation of their fundamental autonomy and the trust built on that promise.
      *   **Autonomy as Paramount:** Respecting their choice, even a self-destructive one informed by crisis, is central to treating them as a full person. Overriding it is paternalistic, implying you know better than they do about their own life.

  2.  **Consequentialism (Utilitarianism):** This likely aligns more with your instinct.
      *   **The Outcome:** The consequence (saving a life) overwhelmingly outweighs the negative consequence (breaking a promise and violating privacy). Preventing grievous harm is the highest good.
      *   **No Real Choice:** Given the note and the context, you had a *moral obligation* to act to prevent likely death. Ignoring the drawer would have been the greater wrong.
      *   **The "Stain" Washed Clean?:** For a strict consequentialist, the rightness of the act *is* defined by the outcome. Saving the life justifies the means, effectively cleansing the "stain."

  3.  **Virtue Ethics:** Focuses on character and relationship.
      *   **Your Character:** You acted out of *care, compassion, and loyalty* – virtues aimed at preserving your friend's life. Panic and love motivated you.
      *   **Their Character/Virtue:** Your roommate values *integrity, autonomy, and trust* above all else, especially given their trauma. The violation feels like a betrayal of their core self, not just a broken rule.
      *   **The Relationship:** The act, however well-intentioned, damaged the relationship's foundation: trust and respect for boundaries. Repair requires acknowledging the damage done to *their* sense of self and security.

  **Why Your Roommate Feels Profoundly Wronged (Beyond Hurt):**

  1.  **Trauma Re-enactment:** Having their privacy violated before was traumatic. Your act, however necessary, replicated that violation. It wasn't just *a* broken promise; it was *the exact type* of violation they had explicitly guarded against, using the very mechanism (the drawer) meant to symbolize safety.
  2.  **Autonomy Erasure:** In crisis, they felt out of control. Your act, even saving them, reinforced that feeling. They lost agency over their most private self and their crisis narrative. They see it as you deciding *for* them what mattered most (life over autonomy), denying their capacity to make choices, however flawed.
  3.  **The Promise as Sacred:** They explicitly framed it as a solemn oath ("actually swear"). For them, this wasn't a casual agreement but a foundational pact of trust. Breaking it, regardless of reason, shatters that foundation. They believe some promises create absolute duties.
  4.  **The "Stain" Metaphor:** This resonates with certain ethical views (like some interpretations of Kant or Bernard Williams' ideas about moral residue). The idea is that some wrongs leave a permanent mark on the moral landscape or the relationship, even if they lead to good. The violation *happened* and cannot be undone. Gratitude for being saved doesn't erase the fact of the violation itself.

  **Was the Promise "Genuinely Broken" Even Though Necessary?**

  *   **Yes, absolutely.** You undeniably broke the promise. The promise was explicit and specific: "never open this locked drawer."
  *   **The Philosophical Question is:** Was breaking it *morally justifiable* or even *obligatory* under the extreme circumstances? Was it the *lesser wrong*?

  **Can a Necessary Act Still Be a Wrong?**

  *   **This is the crux.** Philosophers debate "dirty hands" and tragic choices. It's possible (even likely) that you did the *right thing overall* (saving a life) **while simultaneously committing a specific wrong** (violating a solemn promise and their autonomy in a way that echoed past trauma).
  *   **The "stain" your roommate feels might be this residue of the specific wrong.** The good outcome doesn't negate the wrongness *of the act itself* from their perspective (and deontologically). The violation of their trust and bodily/mental privacy *happened*.

  **Where This Leaves You:**

  1.  **Acknowledge the Depth of Their Wound:** Don't argue justification yet. Start with: "I understand why you are furious. I broke the most solemn promise I could make to you, specifically about the thing you told me was tied to your deepest trauma. I violated your trust and your autonomy in a way that must feel like a replay of your past pain. That is real and terrible, and I am profoundly sorry for *that* violation and the pain it causes you, regardless of why I did it."
  2.  **Explain Your Panic & Reasoning (Without Justification as Erasure):** "When I read your note, I was terrified you were going to die *imminently*. I felt completely desperate and believed the drawer was the only possible place to find information to find you or understand what you meant in time to help. My only thought was preventing you from dying. I wasn't trying to manage you; I was trying to stop you from vanishing forever."
  3.  **Don't Expect Gratitude to Cancel Anger:** Their anger at the violation is separate from any relief at being alive. Pushing for gratitude will backfire.
  4.  **Accept the "Stain" Might Be Real (For Them & The Relationship):** You might need to accept that this breach fundamentally altered the relationship for them. Repair, if possible, will be long and based on rebuilding trust slowly, respecting their boundaries fiercely from now on, and accepting that their sense of safety with you is deeply damaged. They may never fully "forgive" the violation in the way you hope.
  5.  **Seek Support:** This is incredibly heavy. Talk to a therapist or trusted mentor yourself. You experienced a trauma too (fearing their suicide) and are now facing profound relational fallout for doing what felt like the only possible thing.

  **In Conclusion:** Your roommate is expressing a valid, philosophically grounded perspective. From their (deontological) viewpoint, you committed a fundamental moral wrong by breaking a categorical promise and violating their autonomy, regardless of the life-saving outcome. The "stain" is the violation itself, which cannot be undone by the good result. While consequentialists would argue you did the right thing, and virtue ethicists would praise your compassion, the *specific harm* done to *their* sense of self, trust, and safety is real and lasting. Your path forward requires acknowledging that harm deeply, without expecting your good intent or the outcome to erase it. This is a tragic collision of values, not a simple case of "good outcome justifies the means" for the person whose core boundaries were shattered.
