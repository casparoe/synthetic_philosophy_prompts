answer: |-
  ### Mapping Dennett's Stances to Linear Logic/Resource-Sensitive Type Theory  
  *(Key constraint: Resources are **not** infinitely copyable; linear logic’s multiplicative/additive connectives and exponentials handle this.)*  

  #### **1. Physical Stance**  
  - **Formal Judgement**: `Γ ⊢ e : P`  
    - `P` = Base physical type (e.g., atomic propositions `p`, `q` linearly combined via `⊗`, `⊕`).  
  - **Clean Translation**:  
    - Predictive power via linear causal chains: `pₜ ⊸ pₜ₊₁` (state evolution consuming prior state).  
    - Resource sensitivity aligns perfectly: Physical properties (e.g., energy, momentum) are finite and non-copyable.  
  - **Distortion**:  
    - Dennett’s “micro-detail” granularity is flattened. In linear logic, `P` abstracts over implementation (e.g., `(p ⊗ q) ⊸ r` hides underlying physics). Ontological depth is lost.  
  - **No Expression**:  
    - The stance’s **heuristic flexibility** (e.g., ignoring quantum effects for macro-prediction). Linear logic types are fixed commitments; no "optional granularity".  

  #### **2. Design Stance**  
  - **Formal Judgement**: `Γ ⊢ e : !∃F. [S ⊸ (S ⊗ B)]`  
    - `S` = State type, `B` = Behaviour type, `F` = Functional role (replicated via `!` for repeatable use).  
    - Teleology encoded as **function type** `S ⊸ B` (e.g., thermostat: `Temperature ⊸ HeaterState`).  
  - **Clean Translation**:  
    - Normative function via **proof obligations**: If `e` malfunctions, the term doesn’t reduce (e.g., `e : S ⊸ B` fails when given `S` but outputs `¬B`).  
    - Resource awareness: Component wear-and-tear modeled as linear consumption (e.g., `Battery⊗Sensor ⊸ Output`).  
  - **Distortion**:  
    - Dennett’s **evolutionary drift** (functions without a designer) becomes unnatural. Linearity requires explicit `!F` replication, clashing with emergent/random design.  
  - **No Expression**:  
    - **Historical etiology** (e.g., "selected for" vs. "used for"). Type theory lacks temporal provenance; `F` is ahistorical.  

  #### **3. Intentional Stance**  
  - **Formal Judgement**: `Γ ⊢ e : □_{RB} (Bel ⊗ Des ⊸ Act)`  
    - `Bel`, `Des` = Belief/desire types under a **modality `□`** (e.g., graded/exponential for partial reliability).  
    - `RB` = Rationality bound (e.g., `□_{0.9}` for 90% predictive accuracy).  
  - **Clean Translation**:  
    - **Contingent flexibility** via additives: `Bel ⊕ Des` allows multiple ascriptions (e.g., "either believes *p* or *q*").  
    - **Normativity** embedded in `RB`: Failed predictions weaken the modality (e.g., `□_{0.9} → □_{0.8}`).  
  - **Distortion**:  
    - **Radical reinterpretation** (e.g., explaining irrationality) forces type coercion, violating linearity. Dennett’s holistic "truly rational" ideal has no direct encoding.  
    - Linearity **over-constrains resources**: Beliefs (`Bel`) aren’t always "consumed" when acted upon (contra `Bel ⊸ Act`).  
  - **No Expression**:  
    - **Pragmatic voluntarism**: Adopting the stance is a *choice*, but type assignments are static. No formal mechanism to "switch stances" mid-prediction (e.g., from `□Bel` to `P`).  

  ---

  #### **Critical Gaps & Implications**  
  1. **Stance Voluntarism vs. Ontological Commitment**:  
     - Dennett: Stances are **strategic tools**, not truths.  
     - Linear Logic: Type assignments **are ontological** (e.g., `e : P` or `e : □Bel`).  
     - **Gap**: No formalisation of "stance selection" as a higher-order resource (e.g., a **meta-judgement** `Γ ⊢ stance(e, S)` consuming computational effort).  

  2. **Normative Flexibility**:  
     - In intentional stance, linear logic **collapses rationality to bounded modality** (`□_{RB}`), losing Dennett’s open-ended "idealisations". The `RB` threshold is arbitrary, unlike Dennett’s context-dependent normativity.  

  3. **What Dennett’s Framework Misses**:  
     - A **formal transition calculus** between stances (e.g., a `!Physical ⊸ ?Design` implication for stance-shifting). His model implies but doesn’t systematise this.  

  4. **Limitations of Linear Logic**:  
     - **No expression for heuristic fallibility**: Linear proofs succeed or fail; Dennett’s stances are *predictively useful* even when false (e.g., "useful fiction").  
     - **Cannot model stance-dependent ontology**: The same `e` as `P`, `F`, or `□Bel` requires disjoint contexts, denying Dennett’s perspectivalism.  

  ---

  #### **Conclusion**  
  Linear logic cleanly captures **resource-aware prediction** within each stance (physical→linear chains, design→!-replicated functions, intentional→modality-bounded actions). However, it **distorts Dennett’s pragmatism** by:  
  - Fixing ontological commitments (no stance voluntarism),  
  - Hard-coding normativity (no dynamic re-ascription),  
  - Lacking inter-stance dynamics.  
  **Recommendation**: Augment with a **substructural modal logic** (e.g., **graded exponentials** for stance reliability + **adjoint functors** for stance transitions). Dennett’s gaps are formalisable but demand richer machinery than vanilla linear logic.  

  ---  
  *Concisely put: Linearity nails the *mechanics* of each stance but misses the *strategic metatheory*. For your seminar, stress that resource-sensitivity clarifies prediction but obscures pragmatism.*
