answer: |-
  Below is a practical, step-by-step procedure based on David Lewis's account of convention, tailored for your committee's needs. I've preserved Lewis's core ideas: (1) conventions require no explicit agreement, and (2) they must have a genuine alternative regularity. Each test includes observable evidence (without polling 200 members), a classification for failure, and a default recommendation. Steps requiring judgment are marked with **"JUDGMENT REQUIRED"**.  

  ### **Procedure for Evaluating Unwritten Practices**  
  1. **Test for Regularity**  
     - **Question**: Is there a consistent pattern of behavior in a specific recurring situation?  
     - **Observable Evidence**:  
       - Pass: At least 3 documented instances in society records (e.g., meeting minutes, event logs, emails) or unanimous committee confirmation of repeated observance.  
       - Fail: No clear pattern; behavior is inconsistent or undocumented.  
     - **If Fail**: Classify as **"Not a Convention (Irregular)"**.  
       - Default: **Leave alone** (it lacks stability to codify or discourage).  
       - Exception: Discourage if harmful (e.g., causes safety risks or conflict). **JUDGMENT REQUIRED** for harm assessment.  

  2. **Test for General Conformity**  
     - **Question**: Do all (or nearly all) members follow the practice in the relevant situation?  
     - **Observable Evidence**:  
       - Pass: No observed violations in records or committee experience; violations are rare and corrected (e.g., newcomers guided).  
       - Fail: Frequent violations (e.g., >10% of cases) without correction.  
     - **If Fail**: Classify as **"Not a Convention (Non-General)"**.  
       - Default: **Leave alone** (not entrenched enough for bylaws).  
       - Exception: Codify if critical (e.g., safety-related) and codification would improve compliance. **JUDGMENT REQUIRED**.  

  3. **Test for Mutual Expectations**  
     - **Question**: Do members expect others to follow the practice and react when it’s violated?  
     - **Observable Evidence**:  
       - Pass: Violations are corrected (e.g., immediate feedback to offenders) or referenced in society communications (e.g., "remember to do X").  
       - Fail: No evidence of corrections; violations ignored.  
     - **If Fail**: Classify as **"Not a Convention (No Mutual Expectations)"**.  
       - Default: **Leave alone** (it’s not a social norm).  
       - Exception: Discourage if harmful (e.g., enables exclusion). **JUDGMENT REQUIRED**.  

  4. **Test for Coordination Reason**  
     - **Question**: Is the practice sustained because conformity solves a coordination problem (i.e., everyone benefits when all follow it)?  
     - **Observable Evidence**:  
       - Pass: Practice resolves conflict/inefficiency (e.g., "rows prevent chaos"); no extrinsic incentive (e.g., rules, penalties) driving it.  
       - Fail: Practice relies on external forces (e.g., safety laws) or individual benefit (e.g., seniority perks without group coordination).  
     - **If Fail**: Classify as **"Not a Convention (Non-Coordinative)"**.  
       - Default: **Codify if beneficial, leave alone if neutral, discourage if harmful**. **JUDGMENT REQUIRED** (Lewis doesn’t address non-coordinative practices; assess societal impact).  

  5. **Test for Arbitrary Alternative**  
     - **Question**: Is there a feasible alternative regularity that could have served the same purpose?  
     - **Observable Evidence**:  
       - Pass: Historical precedent (e.g., "we used to do Y"), examples from similar societies, or logical alternatives (e.g., north-south rows vs. east-west).  
       - Fail: No viable alternative; practice is uniquely optimal (e.g., based on physics or biology). **JUDGMENT REQUIRED** (alternatives are hypothetical; rely on committee knowledge).  
     - **If Fail**: Classify as **"Not a Convention (Non-Arbitrary)"**.  
       - Default: **Codify if beneficial, leave alone if neutral, discourage if harmful**. **JUDGMENT REQUIRED**.  

  6. **Final Classification & Recommendation**  
     - **If all tests pass**: Label as **"Convention"**.  
       - Default: **Leave alone** (conventions self-sustain; codifying risks rigidity).  
       - Exceptions:  
         - Codify if vulnerable (e.g., new members ignore it) or critical (e.g., safety).  
         - Discourage if harmful (e.g., discriminatory). **JUDGMENT REQUIRED**.  
     - **If any test fails**: Label as **"Not a Convention"**. Use Step 4/5 defaults for recommendations.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Telescope Rows (East-West, First-Come Basis)**  
  1. **Regularity**: Pass (congealed in the 1990s; committee confirms consistency).  
  2. **General Conformity**: Pass (everyone follows; no violations observed).  
  3. **Mutual Expectations**: Pass (contentment implies expectations; no corrections needed).  
  4. **Coordination Reason**: Pass (solves setup chaos; no extrinsic incentives).  
  5. **Arbitrary Alternative**: Pass (north-south rows are feasible, equally efficient).  
     - **Classification**: Convention.  
     - **Recommendation**: **Leave alone** (stable, harmless, self-sustaining).  

  **Case 2: Dim Red Lights Only**  
  1. **Regularity**: Pass (consistent practice; newcomers corrected).  
  2. **General Conformity**: Pass (violations rare and corrected).  
  3. **Mutual Expectations**: Pass (corrections within seconds show expectations).  
  4. **Coordination Reason**: Pass (preserves group night vision; conformity benefits all).  
  5. **Arbitrary Alternative**: **FAIL** (core practice is non-arbitrary due to physiology; red light is optimal. Arbitrary details like "how red" or "headlamps" don’t override the core’s necessity).  
     - **Classification**: Not a Convention (Non-Arbitrary).  
     - **Recommendation**: **Codify** (beneficial and safety-critical; avoids ambiguity in details).  

  **Case 3: Senior Members First Pick of Loaner Telescopes**  
  1. **Regularity**: Pass (20-year practice; committee confirms).  
  2. **General Conformity**: Pass (newcomers comply despite grumbling).  
  3. **Mutual Expectations**: Pass (seniors expect priority; newcomers acquiesce).  
  4. **Coordination Reason**: Pass (solves scramble for resources; conformity prevents conflict).  
  5. **Arbitrary Alternative**: Pass (lottery or rotating system is feasible and equally functional).  
     - **Classification**: Convention.  
     - **Recommendation**: **Discourage** (harmful: causes resentment and inequity; undermines group cohesion).  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Values-Based Decisions**: Lewis describes conventions, but your committee must judge "benefit/harm" (Steps 4–6). Philosophy doesn’t define these; your society’s values (e.g., fairness, tradition) do.  
  2. **Non-Conventions**: Practices failing tests (e.g., safety rules) rely on committee judgment. Lewis offers no guidance here.  
  3. **Predictive Uncertainty**: The procedure can’t guarantee outcomes (e.g., codifying may ossify a flexible practice; discouraging may cause backlash).  
  4. **Hidden Preferences**: Without polling, you can’t verify if a "silent majority" opposes a convention (e.g., Case 3’s grumbling).  
  5. **Ambiguity in Alternatives**: Judgment is needed for "genuine alternatives" (Step 5); what’s "equally good" is subjective.  

  ### **Final Advice**  
  - **Present to Committee**: Frame this as a "convention detection tool," not a value arbiter. Stress that:  
    - Conventions thrive without bylaws (codifying may backfire).  
    - Non-conventions require ethical/practical judgment.  
  - **Mitigate Bias**: In Case 3, delegate discussion to avoid conflicts of interest.  
  - **Time Saver**: Use society archives and committee recall for evidence; avoid debates over unclear cases.  

  This procedure makes Lewis actionable while honoring his core ideas. It won’t replace wisdom, but it structures chaos into clear tests. Good luck!
