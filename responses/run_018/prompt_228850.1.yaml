  2. Everyone believes that the others conform to R.
  3. This belief that others conform gives everyone a reason to conform to R (because in S there is a general preference for general conformity to R rather than slightly-less-than-general conformity, and because there is an alternative regularity R' which could have been followed instead).
  4. There is a preference for general conformity to R rather than slightly-less-than-general conformity to R.
  5. R is not the only possible regularity meeting the last two conditions; there exists at least one alternative R' such that if the others were conforming to R', one would have reason to conform to R' as well.

  Moreover, Lewis emphasizes that conventions are arbitrary in the sense that there is an alternative that could have been followed instead.

