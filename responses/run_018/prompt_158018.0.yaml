prompt: |-
  Hi — I need prep for a talk I'm giving Tuesday at our local heritage centre. It's on whether societies actually 'collapse' or just change form, using the Bronze Age, the Maya and Easter Island. I got into this after inheriting my uncle's old archaeology books last month and now I'm definatly out of my depth, but I agreed to present.

  My argument is basically that 'collapse' is a story we tell after the fact. The Late Bronze Age wasn't a system failure but a reconfiguration of trade networks; the Classic Maya didn't vanish, they relocated and kept writing in different places; and Easter Island's moai halt wasn't ecological suicide but a shift in ritual priorities — societies don't fall over, they just reshape. I'm using this partly to push back against people who treat Easter Island as a climate-change parable.

  The audience is about fifteen people: mostly retired civil engineers and history teachers, plus one actual Bronze Age specialist who thinks I'm being naive about systems collapse, and a local councillor who's been using Easter Island in climate speeches. They care about evidence and clear causation, they don't like vague metaphors being taken away, and the specialist will want me to engage with actual archaeological data rather than hand-waving.

  Can you draft my Q&A prep sheet? I want the objections ordered roughly as they'll come, phrased the way that audience would put them — especially the specialist and the councillor — with a note on how damaging each one is. For each objection: what I should concede up front, a reply I can actually deliver in about two minutes, and the weakest point in that reply. Include the question I'm hoping nobody asks — probably whether refusing to call it 'collapse' ignores the human cost and suffering. Also flag where I'm on shaky ground, like Maya chronology or that panarchy idea I borrowed from ecology without being sure I've applied it right. Don't need citations, just practical prep — I'm writing this on my phone on the train and might have missed a typo.
