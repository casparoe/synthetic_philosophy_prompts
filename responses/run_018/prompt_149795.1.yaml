prompt: |-
  I was discussing with colleagues at work whether there is ever a rational reason not to vote for the least-bad candidate in a large election, and our conversation drifted into philosophy—specifically whether voting is mainly an expressive act, a civic duty, or just consequentialist damage control. I am a software engineer with no formal philosophy background; I usually reason about incentives and signaling, but I am trying to understand how these three frameworks actually diverge in practice rather than in slogans. Could you design a concrete, realistic thought experiment—one ordinary-life scenario in a democratic election, no science fiction, no lotteries, no fake-barn analogies, no demons or perfect predictors—engineered specifically so that the expressive theory of voting, the civic-duty theory, and the consequentialist lesser-evil framework all deliver different verdicts about what the agent ought to do? More precisely: the expressive account should recommend voting as an authentic expression of values regardless of causal efficacy; the duty-based account should also recommend voting but grounded in a different normative reason, a role-based obligation that does not depend on outcomes; and the consequentialist lesser-evil framework should recommend abstaining or not voting for the least-bad candidate, despite the election being large and the individual vote being causally futile. Hold fixed the candidates, the election size, the voter’s information, and the basic democratic context; isolate the separation in a single feature you invent and describe clearly—perhaps a specific institutional mechanism like a public delegation registry or a post-vote signaling protocol that changes the social cost of participation—so that removing that feature collapses the divergence. Then verify the design works: state the agent’s belief and method, identify the relevant conditions for each theory, explain why each framework gives the verdict it does, and be explicit about which