  We are designing a thought experiment for a large democratic election where:
   - The expressive theory recommends voting as an authentic expression of values (regardless of causal efficacy).
   - The civic-duty theory recommends voting as a role-based obligation (independent of outcomes).
   - The consequentialist lesser-evil framework recommends abstaining or not voting for the least-bad candidate (despite the election being large and the vote being causally futile).

   We must hold fixed: candidates, election size, voter's information, and the basic democratic context.
   We invent one isolating feature that causes the divergence. It must be a realistic institutional mechanism.

   Idea: A "Public Voter Registry with Threshold Effects"

   Scenario:
   In the country of Demos, there is a presidential election with two major candidates: 
     - Candidate A (lesser evil): center-left, with policies that the voter finds mediocre but acceptable.
     - Candidate B (greater evil): far-right, with policies that the voter finds abhorrent.

   The election is large (millions of voters) and the voter's individual vote is causally negligible (probability of being pivotal is effectively zero).

   However, Demos has an institutional feature: 
     - The government publishes an official "Voter Participation Record" (VPR) after the election. 
     - This record is public and searchable by anyone (employers, friends, community members) and includes:
          1. Whether a citizen voted (but not for whom).
          2. For those who voted, they have the option to also publicly register a "Statement of Conscience" (SoC) at the time of voting. 
             This SoC is a short, pre-approved statement from a list of options that reflects the voter's reason for voting. The options include:
               - "I voted to prevent the greater evil."
               - "I voted to express my values."
               - "I voted because it is my civic duty."
               - "I voted for the candidate I truly support." (even if that candidate has no chance)
               - "I voted but I do not wish to specify a reason."
          3. The SoC is attached to the voter's public participation record and is visible to anyone who looks up that voter.

   Additionally, there is a social norm in Demos that has developed around the VPR:
     - Employers and social circles use the VPR to judge a person's character. 
     - Specifically, if a person did not vote, they are seen as shirking their civic responsibility and may face social and professional consequences (e.g., being passed over for promotions, social exclusion).
     - However, if a person voted and chose the SoC "I voted to prevent the greater evil," they are seen as pragmatic but unprincipled. This is because the dominant cultural narrative (especially among the voter's peer group, which is progressive) views such a statement as a betrayal of true progressive values. They believe that one should vote for what one truly believes in, not for the lesser evil. Thus, choosing this SoC leads to social stigma in the voter's community and workplace (which is predominantly progressive).

   Now, the voter in our scenario:
     - Believes that Candidate B is terrible and must be stopped, but also believes that Candidate A is not good and has policies that are harmful to some marginalized groups (though less harmful than B).
     - The voter is a progressive and works in a progressive tech company (like our software engineer) where the norm is to vote for third-party candidates or write-in candidates that truly represent progressive values. Expressing a "lesser evil" motivation is frowned upon and could harm the voter's career and social standing.
     - The voter has two options for voting:
          Option 1: Vote for Candidate A (the lesser evil) and choose the SoC "I voted to prevent the greater evil." 
          Option 2: Vote for a third-party candidate (Green) who truly represents the voter's values and choose the SoC "I voted to express my values" or "I voted for the candidate I truly support."
     - The voter could also abstain, but that would show up as "did not vote" in the VPR and lead to negative consequences.

   However, the voter also has a third option: 
          Option 3: Abstain from voting and avoid the entire issue.

   But note: abstention is publicly recorded and leads to social and professional costs (because of the civic duty norm). 

   The voter's beliefs:
     - The chance of being pivotal is zero (so the consequentialist impact of the vote on the election outcome is nil).
     - The voter cares about:
          a) The outcome of the election (wants to prevent B, but also wants to express disdain for A).
          b) Their social and professional standing.

   The isolating feature: the Public Voter Participation Record with the Statement of Conscience (SoC) and the associated social norms.

   Now, let's see how each theory would advise:

   1. Expressive theory of voting:
      - Voting is about expressing one's values authentically.
      - In this case, the voter's authentic values are aligned with the third-party candidate (Green). 
      - Therefore, the expressive theory would recommend voting for Green and choosing the SoC that expresses that (e.g., "I voted to express my values").
      - Why? Because this is the most authentic expression of the voter's true political beliefs. The theory does not care about the outcome (which is fixed as non-pivotal) or about the social consequences (because expression is about being true to oneself, not about social rewards).

   2. Civic-duty theory:
      - Voting is a duty of citizenship. One must vote because it is one's role as a citizen to participate.
      - The duty-based theory would recommend voting (either for A or for Green) because abstaining would be a failure to fulfill one's civic duty. 
      - However, note that the duty theory does not specify for whom to vote. But in this scenario, the act of voting itself is what matters. The voter can choose any candidate and any SoC (as long as they vote). 
      - But note: the duty theory might be interpreted as requiring a responsible exercise of the vote (i.e., voting for a viable candidate). However, let's assume the duty theory we are using is minimal: just the duty to participate. Therefore, the duty-based account would recommend voting (either for A or Green) and then choosing any SoC (or none) because the duty is to vote, not to vote in a particular way.

      However, to make the divergence clear, we note that the duty theory does not require voting for the lesser evil. It only requires voting. Therefore, it would be satisfied with voting for Green (or even for A). But it would condemn abstention.

   3. Consequentialist lesser-evil framework:
      - The goal is to minimize expected harm. Since the vote is not pivotal, the voter's action has no causal effect on the election outcome. 
      - However, the voter's action (voting and the SoC) has other consequences: the social and professional costs.
      - The voter must choose the action that leads to the best overall outcome (considering both the election and the social consequences). 
      - Since the vote does not affect the election, the only consequences that matter are the social and professional ones.
          - Abstention: leads to negative consequences (record shows non-voting, so social and professional costs).
          - Voting for A and choosing the "lesser evil" SoC: leads to social stigma (in progressive circles) but avoids the abstention stigma.
          - Voting for Green and choosing the expressive SoC: avoids both stigmas? 
            Why? Because in the progressive environment, voting for Green and expressing that you did so for your values is seen as principled and may even be praised. It shows you voted (so you did your duty) and you stood by your values (so you are not a sell-out). 

      Therefore, the consequentialist would compare:
          - Abstention: worst outcome (social and professional costs).
          - Voting for A with "lesser evil" SoC: avoids abstention stigma but incurs the lesser-evil stigma (so net negative but less than abstention?).
          - Voting for Green with expressive SoC: avoids both stigmas? Indeed, because the progressive environment respects this choice. 

      So the consequentialist would recommend voting for Green and choosing the expressive SoC? 

      But wait: the consequentialist might also consider the long-term effect of encouraging others to vote expressively, which might lead to vote-splitting and the election of B. However, note that the voter's SoC is public only after the election, so it cannot influence the current election. Also, the voter's individual action is negligible in terms of influencing others (since it's a large society). 

      Alternatively, the consequentialist might argue that if everyone thought like this, then B would win. But that is a rule-utilitarian argument. We are focusing on act-consequentialism: the individual act of voting for Green does not cause B to win (since the vote is non-pivotal) and the SoC statement comes after the election. 

      Therefore, the act-consequentialist would focus on the immediate consequences: the social and professional costs. Thus, they would recommend the option that minimizes these costs: voting for Green with expressive SoC.

      However, we want the consequentialist to recommend abstaining or not voting for the least-bad candidate. How can we adjust?

      Let's change the social norm:

      Revised social norm:
          - In the voter's progressive community, there is a strong norm that the only way to stop Candidate B is to vote for Candidate A. 
          - Therefore, if the voter chooses to vote for Green and uses an expressive SoC, they are seen as helping Candidate B by splitting the vote (even though their vote didn't actually change the outcome). This is because the community believes in the importance of strategic voting. 
          - Thus, voting for Green and expressing that you did so for your values is seen as naive and irresponsible. It leads to the same level of social and professional stigma as voting for A with a "lesser evil" SoC. In fact, it might be worse because it is seen as not taking the threat of B seriously.

      Now, the consequences:
          - Abstain: record shows non-voting -> stigma (shirking duty).
          - Vote for A with "lesser evil" SoC: record shows voting and the SoC. This leads to stigma (being seen as unprincipled) in the progressive community, but it is less severe than abstention? 
          - Vote for Green with expressive SoC: record shows voting and the SoC. This leads to stigma (being seen as irresponsible and helping B) which is at least as bad as the "lesser evil" stigma.

