              Conditions: The individual vote is non-pivotal and the voter can fake an excuse at low risk.

          Isolating feature: The option to have an "excused abstention" in the public record by providing a doctor's note (which can be faked at low cost).

          Defense attack by consequentialist critic:
              - A consequentialist might argue that faking the doctor's note has a risk of being caught (which could lead to severe penalties like fines or loss of job) and that risk, even if small, might outweigh the benefits. 
              - If the risk is too high, then the consequentialist might choose to vote for A instead (which has moderate cost).

          Feature removal effect:
              - If we remove the excused abstention option (or make it impossible to fake, or very risky), then the cost of abstention becomes high.
              - Then the consequentialist would compare:
                  - Abstention: high cost
                  - Vote for A: moderate cost
                  - Vote for Green: high cost
              - So they would choose to vote for A.
              - The expressive still says vote for Green.
              - The duty-based still says vote (A or Green).
              - So the divergence between expressive and duty-based vs. consequentialist is still there, but now the consequentialist does vote for the least-bad candidate (A). The requirement was to have the consequentialist recommend abstaining or not voting for the least-bad candidate. In this case, without the feature, the consequentialist does vote for the least-bad candidate. So our feature was isolating the abstention recommendation for the consequentialist.

          Honest limitation:
              - The scenario relies on the voter being able to fake an excuse easily and without risk. In reality, there might be significant risks of fraud detection. 
              - Also, the duty-based theory might be interpreted differently (e.g., some might say that in a swing state, the duty is to vote for the lesser evil). We assumed a minimal duty to participate.

