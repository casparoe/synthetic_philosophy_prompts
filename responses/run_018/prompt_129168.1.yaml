  The challenge is applying classic dispositional metaphysics (usually for simple physical properties) to complex neural systems altered by pharmacology. Finks remove dispositions entirely upon triggering, while masks leave the base intact but block manifestation. But here, the "base" is their own neurochemistry, modified continuously by medication. 

  Key angles to cover: 
  - Internal vs. external factors (medication is internal/sustained, unlike electro-fink examples). 
  - Whether the dispositional base persists structurally despite functional suppression. 
