answer: |-
  Here’s a decision tree structured around concrete commitments, designed to map the logical space of legal death criteria without relying on theoretical labels. Each node forces a binary choice, and leaves are labeled with common positions *after* the logic is established.

  ---

  ### **Death Criteria Decision Tree**

  #### **Q1: Is death fundamentally defined by the collapse of biological integration of the organism *as a whole*?**  
  - **YES** → Proceed to **Q2**.  
  - **NO** → Death is defined by **irreversible loss of consciousness/psychological continuity** → Proceed to **Q3**.  

  ---

  ### **BIOLOGICAL INTEGRATION PATH (Q1=YES)**  

  #### **Q2: Must circulatory/respiratory arrest be permanent to declare death?**  
  *(i.e., is cessation of heartbeat/breathing sufficient only if it cannot be restored?)*  
  - **YES** → Proceed to **Q4**.  
  - **NO** → Circulatory arrest alone is **never sufficient** for death (integration may persist despite arrest) → Proceed to **Q5**.  

  #### **Q4: If ECMO/circuit can technically restore circulation *now*, does circulatory arrest still count as irreversible?**  
  - **YES** → **Traditional Circulatory Standard**: Death requires permanent circulatory arrest, regardless of ECMO capability.  
  - **NO** → Death requires **irreversible circulatory arrest *relative to current tech*** → Proceed to **Q6**.  

  #### **Q5: Is brainstem destruction sufficient to declare death *even if* residual cortical activity is detectable?**  
  - **YES** → **Whole-Brain Integrationist**: Brainstem death = collapse of organismal integration → Proceed to **Q6**.  
  - **NO** → **Higher-Brain/Corticalist (under integration)**: Integration persists without cortical activity loss → *Position rarely held (unattractive/unexplored)*.  

  #### **Q6: Does brainstem death matter because it:**  
  - **Guarantees future consciousness loss** → **Intermediate View**: Brainstem death is a *proxy* for inevitable loss of personhood (not integration collapse).  
  - **Destroys integration *now*** → **Standard Whole-Brain View**: Integration is already absent.  

  ---

  ### **CONSCIOUSNESS PATH (Q1=NO)**  

  #### **Q3: Does "irreversible" loss of consciousness require:**  
  - **Current technical incapacity to restore it**? → **Tech-Relative Irreversibility** → Proceed to **Q7**.  
  - **Biological incapacity of the organism to ever resume it**? → **Intrinsic Irreversibility** → Proceed to **Q7**.  

  #### **Q7: If ECMO restores circulation, can a person with circulatory arrest + unconsciousness be declared dead?**  
  - **YES** → If consciousness is irreversibly lost *by your Q3 definition*, death can be declared.  
  - **NO** → *Incoherent*: Consciousness definitionally depends on brain function; restored circulation prevents irreversibility.  

  #### **Q8: Is brainstem destruction sufficient for death *without* verifying cortical destruction?**  
  - **YES** → **Consciousness-First + Brainstem Proxy**: Brainstem death ensures permanent unconsciousness.  
  - **NO** → **Cortex-First**: Requires direct proof of cortical destruction.  

  ---

  ### **FINAL SPLIT (ALL PATHS)**  
  #### **Q9: Must legal death criteria *exactly match* biological death?**  
  - **YES** → Legal death strictly tracks biological reality.  
  - **NO** → Legal death may diverge to serve practical goals (e.g., organ procurement).  

  ---

  ### **Key Positions Mapped to Leaves**  
  1. **Whole-Brain Integrationist**:  
     - Q1=YES → Q2=YES → Q4=YES → Q5=YES → Q6="Destroys integration now" → Q9=YES/NO.  
     *(Holds circulatory arrest + whole-brain death as independent criteria; brainstem death sufficient if cortex irrelevant to integration.)*  

  2. **Consciousness-First + Tech-Relative Irreversibility**:  
     - Q1=NO → Q3="Current tech" → Q7=YES (if consciousness lost) → Q8=YES/NO → Q9=YES/NO.  
     *(Allows death declaration after circulatory arrest if resuscitation tech exists but consciousness can’t be restored.)*  

  3. **Traditional Circulatory View**:  
     - Q1=YES → Q2=YES → Q4=YES → Q5=YES/NO → Q6=N/A → Q9=YES.  
     *(Rejects ECMO relevance; requires permanent circulatory arrest.)*  

  4. **Intermediate View (Brainstem as Proxy)**:  
     - Q1=YES → Q2=YES → Q4=YES/NO → Q5=YES → Q6="Guarantees future loss" → Q9=YES/NO.  
     *(Accepts brainstem death but *only* because it makes consciousness recovery impossible.)*  

  ---

  ### **Flagged Empty/Problematic Branches**  
  - **Q2=NO** → *(Unattractive)*: If integration persists despite circulatory arrest, death declaration becomes impractical.  
  - **Q3="Current tech" → Q7=NO** → *(Incoherent)*: Contradicts consciousness-first commitment by requiring circulatory permanence.  
  - **Q5=NO (under integration)** → *(Unexplored)*: No significant movement argues cortical death is needed *after* accepting integration as primary.  
  - **Q1=NO → Q3="Intrinsic" → Q7=YES** → *(Rare)*: Consciousness-focused but requires biological irreversibility (e.g., higher-brain death).  

  ---

  ### **Design Notes**  
  - **Real-World Divergence**: Disagreements at **Q9** explain jurisdictions permitting DCDD (donation after circulatory death) despite technical reversibility.  
  - **Brainstem-Cortex Tension**: **Q5/Q8** captures conflicts over whether "brain death" requires whole-brain or only brainstem necrosis.  
  - **ECMO as Litmus Test**: **Q4/Q7** forces clarity on whether "irreversible" is biological or technological.  

  This tree isolates core commitments driving jurisdictional differences, showing how answers to concrete physiological/technological questions generate distinct legal standards.
