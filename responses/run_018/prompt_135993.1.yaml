  First, I need to ensure both positions are represented fairly without strawmanning. A's compatibilist view should emphasize functional authorship—how an agent's rational response to reasons defines moral responsibility, even without libertarian free will. B's skepticism must challenge why reactive attitudes are necessary when causation is fully transparent, reducing punishment to risk management.

