  After a long and somewhat circular argument with a friend about whether von Neumann’s 1958 comparison of synaptic transmission errors to vacuum-tube failures in The Computer and the Brain was meant to establish that the brain is essentially a noisy digital computer, or conversely that its analog, probabilistic nature makes cognition irreducible to discrete logical architecture, I want to force my own reasoning into the open. What is your actual credence—state a specific number between 0 and 1—that von Neumann intended the reliability comparison to support a non-computationalist, essentially analog or continuous view of cognition rather than a digital functionalist one? I do not want a bare it-depends-on-interpretation; I want the decomposition. How much of your number rides on the textual weight of his discussion of error-correction mechanisms versus his explicit claims about logical organization? How much depends on whether modern neuroscience’s characterization of stochastic synaptic release reinforces or undermines the analogy he drew? How much is driven by the prior that a mathematician who formalized self-replicating automata would be unlikely to reject computationalism about the brain? Identify which sub-question is the largest driver of your final credence, and specify what kind of argument or evidence—short of a direct autobiographical statement—would most move your number.
