prompt: |-
  I've followed discussions of superrationality since Hofstadter's original framing, but I'm tired of the standard one-shot prisoner's dilemma rehearsals that circulate in decision-theory threads. I'm advising a small theoretical group—two philosophers and one formal modeler, with about three years of funding—on where to direct limited effort. I don't want a survey; I want a defended agenda.

  To keep it off the beaten path: I'm focused on superrationality under partial reasoning transparency rather than perfect symmetry—settings where agents hold graded, uncertain beliefs about how closely their algorithms mirror one another, via shared source-code fragments, overlapping architectures, or probabilistic reasoning about each other's computation traces. Within that framing, what are the genuinely open conceptual questions?

  Please prioritize the three or four that matter most for cooperative behavior in realistic multi-agent settings. For each: defend its rank by showing whether it's upstream of other problems, tractable with philosophical and formal tools without running empirical ML experiments, and what result—proof, counterexample, or conceptual clarification—would move it up or down. State the criteria explicitly (e.g., upstream dependence, tractability, relevance to cooperative AI design versus pure philosophical curiosity), and note where the ordering is fragile—what failure of an intermediate step would collapse it.

  Also name the one line of inquiry that sounds promising in rationalist forums but is likely overrated: something that draws attention yet, if fully resolved, wouldn't materially change how we evaluate or build multi-agent cooperative systems.

  No bibliographies, reading lists, or citations—just reasoning I can defend in a grant proposal and that holds up without searching online.
