  Below is a diagnostic decision tree for pragmatist theories of truth, structured to map commitments across three axes with concrete questions. The tree respects your constraints: seven leaves, no citations, philosopher-agnostic questions, and explicit notation of indistinguishability. Deweyan instrumentalism collapses onto a leaf (flagged below), and two unoccupied combinations are included.  

  ---

  ### **Diagnostic Decision Tree: Pragmatist Theories of Truth**  
  **Root Node:**  
  *Do you hold that truth is essentially a property of beliefs that successfully guide action in experience, with no further constraint?*  
  - **Yes** → Proceed to Axis 1.  
  - **No** → Exit (not within the defined pragmatist scope).  

  ---

  #### **Axis 1: Convergence**  
  *For any genuine question, must inquiry eventually converge on a single answer in an ideal long run?*  
  - **Yes** (Convergence required) → Proceed to Axis 2.  
  - **No** (Pluralism allowed) → Proceed to Axis 2.  

  ---

  #### **Axis 2: Verification Scope**  
  *Can a belief’s "successful guidance" be verified in domains beyond predictive-experimental inquiry (e.g., ethical, aesthetic, religious), where 'what works' is domain-relative?*  
  - **No, only predictive-experimental success** → Proceed to Axis 3.  
  - **Yes, extends to all domains** → Proceed to Axis 3.  

  ---

  #### **Axis 3: Fallibilism**  
  *Can any belief, no matter how well established, be revised in light of new experience?*  
  - **Yes, universally revisable** → Assign Leaf.  
  - **No, some beliefs become permanently settled** → Assign Leaf.  

  ---

  ### **Leaves (7 Total)**  
  1. **Strict Peircean Convergence Pragmatism**  
     - *Path:* Convergence (Yes) + Verification (Predictive only) + Fallibilism (Universal).  
     - *Commitments:* Truth requires long-run convergence, experimental verification only, and no belief is beyond revision.  

  2. **Jamesian Radical Pluralism**  
     - *Path:* Convergence (No) + Verification (All domains) + Fallibilism (Non-universal).  
     - *Commitments:* Truth is contextually warranted assertibility, verifiable in any domain, and some beliefs (e.g., core ethical/religious) can become permanently settled.  

  3. **Deweyan Instrumentalism (Indistinguishable)**  
