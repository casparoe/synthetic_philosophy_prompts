answer: |-
  ### Q&A Prep Sheet: Mary's Counterfactual Stability Profile  

  #### **Brainstormed Objections (Ordered by Damage Potential)**  
  1. **Grounding Gap Objection**: "Your 'stability profile' still leaves a grounding gap: *how* does the neural architecture metaphysically ground first-person modal access without brute emergence?"  
  2. **Explanatory Closure Failure**: "If physics is causally/explanatorily closed, how can an epistemically irreducible profile exist without violating closure? This sounds like dualism by another name."  
  3. **Operational Vacuity**: "This 'profile' is operationally vacuous—how do we measure it behaviorally or computationally? If not, it’s a disguised mysterianism."  
  4. **Supervenience Challenge**: "If the profile supervenes on neural architecture, why can’t we *deduce* it third-personally? Supervenience without deducibility implies a metaphysical fissure."  
  5. **Disguised Dualism**: "Calling this 'physical' is semantic sleight-of-hand—irreducible first-person access smuggles in a non-physical epistemic primitive."  
  6. **A Priori Underdetermination**: "If physical facts underdetermine the profile, doesn’t that concede Jackson’s original point? Physicalism *requires* a priori deducibility."  
  7. **Triviality Worry**: "Isn’t this just a restatement of ‘knowing what it’s like’ with extra jargon? What novel work does ‘counterfactual stability’ do?"  

  ---

  #### **Replies & Vulnerabilities**  
  1. **Grounding Gap Reply** (2 mins):  
     "The grounding isn’t brute—it’s *structural*. Neural architectures implement computational models that generate *dispositions* for counterfactual responses. For example, a visual system’s wiring determines *how* it would react to wavelength variations (e.g., metamers). The first-person access is just the system’s offline simulation of its own dispositions—no new properties, just a new *mode of access* to its physical dynamics. Like a self-monitoring algorithm."  
     *Vulnerability*: "Simulation" may invite questions about whether it implies a homunculus.  

  2. **Explanatory Closure Reply** (2 mins):  
     "Closure holds *causally*: all profile effects trace to neural causes. The epistemic gap arises because third-person descriptions abstract away from *agent-relative affordances*. Physics describes a combustion engine’s mechanics; it doesn’t encode the *driver’s* know-how to handle stalls. Similarly, Mary’s gap is *cognitive*, not ontological—she gains a skill, not a fact."  
     *Vulnerability*: Skeptics may argue "skills" require non-physical intentionality.  

  3. **Operational Vacuity Reply** (2 mins):  
     "It’s operationalized via predictive processing models. We *can* measure counterfactual stability: fMRI shows prefrontal cortex activity when subjects simulate perceptual alternatives (e.g., ‘how would this look in dim light?’). The profile is the brain’s generative model of its own sensory error-minimization—testable through metacognitive tasks."  
     *Vulnerability*: This may not satisfy eliminativists who reject first-person reports as data.  

  4. **Supervenience Challenge Reply** (2 mins):  
     "Deducibility fails because the profile is *computationally emergent*: it’s a higher-order property of neural networks executing counterfactual queries. We can’t deduce a chess program’s strategy from its code alone—we must run simulations. Likewise, Mary’s profile is deducible only by simulating *her* neural dynamics *as herself*."  
     *Vulnerability*: "Emergent" risks sounding non-physical.  

  5. **Disguised Dualism Reply** (2 mins):  
     "No epistemic primitive is added—just a *functional role*. The profile is a physical information-state (e.g., synaptic weights encoding prediction-error gradients). Its ‘first-personness’ is like a camera’s self-test mode: a physically implemented self-diagnostic, not a ghostly observer."  
     *Vulnerability*: Functional roles may be seen as ontologically inflationary.  

  6. **A Priori Underdetermination Reply** (2 mins):  
     "Jackson conflates *deducibility* with *metaphysical determination*. Facts about gravitational waves were underdetermined by Newtonian physics—yet still physical. Mary’s case shows physical descriptions omit *indexical-modal* dimensions, not non-physical ones."  
     *Vulnerability*: Indexicality may be deemed non-physical by hardcore Russellians.  

  7. **Triviality Worry Reply** (2 mins):  
     "It does novel work: it dissolves the ‘hard problem’ by reducing ‘what-it’s-like’ to *action-guidance under uncertainty*. Mary doesn’t learn ‘redness’—she learns how her visual system *stabilizes* color judgments across contexts (e.g., lighting). This explains why zombies are inconceivable: no stability profile, no predictive competence."  
     *Vulnerability*: May seem like re-describing, not solving, the problem.  

  ---

  #### **Strategic Concessions to Preempt**  
  1. **Concede grounding requires further work**:   
     *In talk*: "I grant the *mechanism* of how neural structures ground self-simulating access needs more empirical detail—but note: this is a gap in *neuroscience*, not metaphysics."  
  2. **Concede operationalization is provisional**:   
     *In talk*: "While we lack perfect measures, predictive processing frameworks *are* converging on testable proxies—this is an empirical program, not armchair speculation."  

  #### **Make-or-Break Reply**  
  **Explanatory Closure Reply must land**. If the audience accepts that epistemic gaps don’t threaten causal closure, physicalism stands. Hammer: *"Physics omits no causes—just as a CAD blueprint omits no mechanical forces, even if it doesn’t tell you how the engineer feels using it."*  

  #### **Dreaded Unasked Question**  
  **"Why can’t a perfect third-person simulation acquire Mary’s profile?"**  
  - **Honest Reply**: "A simulation *could* infer the profile algorithmically, but it wouldn’t *instantiate* it. Like a weather model predicting rain doesn’t get wet. Mary’s access is *de se*: it requires *being* the system generating the simulations—a computational token, not type."  
  - **Assessment**: This *saves the view* only if the audience accepts token-physicalism over type-identity. If they demand type-reduction, it fails.  

  ---  
  \answer{Perfect third-person simulation lacks de se instantiation}
