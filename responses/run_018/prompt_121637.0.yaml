prompt: |-
  You're a moral philosopher who also reads the cross-cultural psychology literature seriously. Take your time, brainstorm a pile of candidate defeaters before you pick any, and please don't just run through the standard objection-list you'd get in a survey article.

  The position I've ended up at: the variation that WEIRD-samples work keeps turning up gives us very little reason to give up on moral objectivity, because what varies is the parameter settings and not the machinery. Every culture seems to run some version of a few core routines — don't harm an insider for no reason, don't cheat on reciprocal arrangements, defer to certain superiors or sacred things — and what differs is how wide the circle of protected beings is drawn (ancestors, animals, fetuses, outgroupers), how much weight purity and loyalty get when they collide with harm and fairness, and whether the domain is handled mostly by rules or mostly by relationships. The disagreement is downstream of shared structure, the way languages differ in whether they mark evidentiality while sharing a grammar.

  What would count against that? I want defeaters ranked from fatal to merely awkward, and I want you to separate the ones a defender of my view should *concede* as counting against it from the ones they'd be right to shrug off as already consistent with it. Two things I'd particularly like you to chew on:

  1. Grain. Am I just describing norms at whatever level of generality makes them match? If "don't harm an insider gratuitously" is universal only because "insider" and "gratuitously" can be filled in locally, is there any content left, or does my view collapse into the formal claim that every culture has some norms it treats as non-optional?

  2. A study I keep imagining. Suppose you run the moral/conventional probes in a lot of small-scale societies, but you add three relativizing questions: would it still be wrong in a village where everyone did it, would it still be wrong if the ancestors or gods commanded it, and would it still be wrong if no one ever found out. Suppose the result is that a small core survives all three everywhere, but the core is *tiny* and its membership shifts a lot between samples, and in a couple of places nothing survives the "the ancestors command it" question at all.

  Does that kill the parameter-setting story or just shrink it? Also: what does my view predict that its rivals don't, and has it been qualified to the point where no finding could touch it — and if it has, is that actually a problem for a claim of this kind, or is insulation fine here? For what its worth, what would move me most is evidence about the *unit* of explanation: if the variation tracks things like market integration or residential mobility rather than "culture" in any thick sense, my story has the wrong explanatory target even if the shared-structure part is true.
reasoning: |-
  Okay, the user is posing a complex question about moral objectivity based on cultural variation. They've presented a position that moral diversity reflects different parameter settings within a shared universal structure, similar to linguistic variations. They want defeaters against this view, ranked by severity, and specifically want me to address two concerns: grain (whether their description is too vague) and a hypothetical study about moral foundations.

  The user seems well-versed in moral philosophy and cross-cultural psychology, referencing WEIRD samples and moral foundations theory. They're clearly not looking for superficial objections but deep engagement with the conceptual structure of their argument. Their imagined study suggests they're grappling with how much universality actually exists beneath cultural variation.

  For the grain concern, I need to analyze whether their "universal norms" have any meaningful content when key terms are culturally defined. This goes to the heart of whether they're describing substantive universals or just formal structures. The linguistic analogy is helpful here - if "insider" varies like evidentiality markers, that might preserve objectivity, but if it's more like completely different grammatical categories, that undermines their position.

  Regarding the hypothetical study, I should consider multiple interpretations of what "no norm survives" might mean. Does it indicate true moral relativism or just different cultural implementations? The answer depends on whether we're seeing different parameter settings or entirely different moral architectures. The user's point about explanatory units (market integration vs culture) is crucial here - if moral variation tracks material factors rather than cultural traditions, it challenges their framework.

  I should rank defeaters carefully. Fatal ones would include evidence of fundamentally disjoint moral frameworks or variation tracking non-cultural factors. Strong challenges would come from minimal universal cores with unstable membership. Weaker objections might involve variation in weightings or implementations that still preserve core machinery.

  The user's meta-concern about unfalsifiability is important too. If every possible finding can be explained as "just another parameter setting," the theory loses explanatory power. I need to suggest what evidence would genuinely challenge it - perhaps societies where harm to insiders isn't morally relevant, or where moral obligations disappear under divine command.

  Throughout, I'll maintain their linguistic analogy while pushing it to its limits. The key is balancing philosophical rigor with psychological evidence, acknowledging where their view is strong while showing its potential breaking points.
answer: |-
  Here's a systematic breakdown of defeaters for your position, ranked by severity and categorized by how a defender should respond. I'll tackle your core concerns about grain and the hypothetical study head-on, then explore other powerful objections focusing on explanatory units and falsifiability.

  **Core Structure of Your Position:**  
  Moral objectivity survives cultural variation because:  
  1.  **Universal Machinery:** All cultures exhibit core moral modules/routines (e.g., harm avoidance, reciprocity, hierarchy/deference, purity/loyalty).  
  2.  **Parameter Variation:** Differences are primarily in *settings* (e.g., scope of "insider," weightings, rule vs. relationship emphasis).  
  3.  **Downstream Disagreement:** Variation arises *from* shared structure, akin to linguistic parameters.  
  4.  **Objectivity Preserved:** The existence of universal *structures* and the *constrained* nature of variation point towards objective moral foundations.

  **Defeaters: Ranked & Analyzed**

  **I. Fatal Defeaters (Force a Major Revision or Abandonment)**

  1.  **Radically Disjoint Moral Frameworks:**
      *   **Scenario:** Discovery of societies where *none* of the proposed core modules (harm, fairness, loyalty, authority, purity) function as recognizable moral concerns. E.g., A society where causing physical pain to conspecifics for personal amusement is seen as morally neutral (or even admirable) among "insiders," where reciprocity is purely transactional without moral valence, where hierarchy is purely coercive power without notions of legitimate deference, and where purity/loyalty concepts are absent or entirely aesthetic/non-normative.
      *   **Why Fatal:** Directly contradicts the claim of universal core machinery. If no shared modules exist, the "parameter setting" analogy collapses. Moral cognition would be fundamentally different.
      *   **Defender's Response:** Must concede this is fatal. Requires abandoning the specific core modules claim or drastically redefining "core machinery" to an untenable level of abstraction. (See "Grain" below). *Evidence for this is currently lacking, but its possibility is a genuine defeater.*

  2.  **Variation Tracks Material/Ecological Factors, Not "Culture" as Thick Parameter-Setting:**
      *   **Scenario:** Rigorous studies show moral judgment variations (e.g., scope of "insider," weight on purity vs. fairness) correlate *much* more strongly and directly with specific, measurable factors like:
          *   Degree of market integration (impersonal exchange frequency).
          *   Levels of residential mobility/stability.
          *   Pathogen prevalence (driving purity concerns).
          *   Subsistence strategy complexity.
          *   External threat level.
      *   **Crucially:** This variation occurs *within* culturally defined groups more than *between* them, and changes rapidly (within a generation) as these factors change, *without* corresponding deep shifts in cultural narratives, cosmologies, or "thick" identity markers. The "culture" label becomes a weak proxy for underlying material drivers.
      *   **Why Fatal:** Directly addresses your explicit concern about the *unit of explanation*. If the variation is best explained by immediate adaptive pressures on individual psychology or group coordination dynamics, rather than the setting of stable, culturally transmitted parameters within a shared universal structure, your "parameter-setting" story becomes epiphenomenal. It misidentifies the locus of explanation (culture-as-thick-tradition vs. adaptive response to environment). Objectivity grounded in universal *cultural structures* is undermined; it might shift to universal *psychological responses to environment*, but that's a different kind of objectivity.
      *   **Defender's Response:** Must concede this forces a major revision. The "parameter-setting" metaphor implies culturally stable, transmitted settings. If settings fluctuate directly with ecology/economy, the cultural transmission aspect is minimized. The defender might shift to arguing the *machinery* (response tendencies) is universal, but the "cultural parameter" layer becomes weak or illusory. (Haidt & Joseph's original MFT leans this way; your emphasis on "culture" is vulnerable).

  **II. Strong Defeaters (Seriously Challenge Core Claims, Require Significant Qualification)**

  3.  **The Grain Problem Collapses Universality into Formalism:**
      *   **Scenario:** Careful analysis shows the proposed "universal" rules ("Don't harm an insider gratuitously," "Defer to superiors") are only universal at a level of abstraction where the key terms ("insider," "gratuitously," "superiors," even "harm") are defined entirely by the local cultural context. There is *no* cross-culturally stable, substantive content to these rules. What counts as harm, who counts as an insider/superior, and what constitutes a "reason" vary so fundamentally that the shared "rule" is merely the formal idea "There are some non-optional norms about how to treat certain beings."
      *   **Why Strong:** This directly attacks the claim that variation is "downstream of shared structure." If the structure itself has no substantive content beyond "have norms," then it doesn't support *moral* objectivity in any robust sense. It becomes compatible with radical cultural relativism where *any* norm system satisfies the "universal structure," as long as it has rules. The linguistic analogy breaks down: this would be like saying all languages share "grammar," but if "grammar" only meant "some systematic rules for combining symbols," it wouldn't explain substantive universals like recursion or noun/verb distinctions.
      *   **Defender's Response:** Should concede this significantly weakens claims of *substantive* moral objectivity derived from the universality of specific modules. They must argue that:
          *   The *kinds* of distinctions (harm/not-harm, insider/outsider, superior/subordinate) *are* substantive, even if their content varies.
          *   The *functional role* of these modules (e.g., regulating cooperation, reducing conflict) provides objective grounding.
          *   *Some* minimal substantive content is cross-culturally stable (e.g., *physical* pain inflicted *intentionally* on *conspecifics* known personally *without* perceived justification *is* generally wrong).
      *   **Verdict:** This is a major challenge. The defender must show the universals aren't *just* formal.

  4.  **Your Hypothetical Study: A Shrunken, Shifting, or Non-Existent "Objective Core":**
      *   **Scenario:** Cross-cultural Moral/Conventional + Relativizing Probes show:
          *   A very small set of transgressions (say, 1-3 types) survive all three relativizers ("Everyone does it," "Gods command it," "No one finds out") *somewhere*.
          *   BUT, the *membership* of this "objective core" is highly unstable across cultures (e.g., harm to kin is core in A, sexual purity in B, resource theft in C; nothing consistent emerges).
          *   AND/OR, in some cultures, *no* transgression survives *all* probes robustly. Crucially, *nothing* survives the "Gods command it" probe in some places – meaning *all* moral obligations are seen as contingent on divine command, even core harm.
      *   **Why Strong:** This directly challenges the idea of a universal, objective core grounded in shared machinery.
          *   A tiny, shifting core suggests the "universal machinery" might be minimal (perhaps just aversions + norm psychology) and the "objective" part is largely a cultural overlay.
          *   Cultures where *no* norm survives the "Gods command it" probe suggest the possibility of truly *theonomous* moralities lacking intrinsic moral objectivity. If harming an infant isn't wrong *simpliciter*, but only wrong *because God forbids it*, and if God *could* command it without contradiction, then the "harm" module isn't generating intrinsic moral wrongness; it's generating a contingent rule based on authority. This severs the link between the proposed universal structure and moral objectivity.
      *   **Defender's Response:** Should concede this shrinks the scope of the "objective core" *if* found universally. They can argue:
          *   **Shifting Core:** Even a shifting core shows *something* is treated as non-relative, demonstrating the *capacity* for objective grounding. The specific content might be culturally influenced, but the *structure* of having non-relative norms remains. (This risks the Grain Problem again).
          *   **No Surviving Core (Gods Command):** Argue this reflects a *meta-ethical* commitment (Divine Command Theory) *overriding* the output of the core modules, not the absence of the modules. The harm aversion exists, but its moral significance is interpreted through a theological lens. The machinery runs, but its output isn't labeled "objectively wrong" by that culture. This preserves the machinery but isolates objectivity *from* the machinery, making it a philosophical add-on. It's awkward.
      *   **Verdict:** This study wouldn't *kill* the parameter-setting story outright but would **severely shrink and complicate** its link to objectivity. Finding cultures with *no* surviving core for *any* probe would be particularly damaging.

  5.  **"Core Modules" are Epiphenomena of General Cognition:**
      *   **Scenario:** Compelling evidence shows the proposed moral modules (harm, fairness, etc.) aren't distinct cognitive adaptations, but emergent properties of more fundamental, domain-general cognitive processes:
          *   **Harm:** Rooted in affective empathy, pain perception, and aversion learning.
          *   **Fairness:** Rooted in reciprocal exchange calculations, tracking imbalances (cheater detection), and coalitional psychology.
          *   **Authority/Deference:** Rooted in dominance hierarchy detection and strategies for navigating power dynamics.
          *   **Purity/Loyalty:** Rooted in disgust avoidance and coalitional psychology/ingroup identification.
      *   The specific "moral" framing is culturally constructed *on top* of these general processes. Variation arises not from parameter-setting within dedicated moral machinery, but from how these general processes get recruited, labeled, and institutionalized in different environments.
      *   **Why Strong:** Undermines the claim for dedicated, universal *moral* machinery. It suggests the "modules" are descriptive categories for how general cognition gets used in the social/moral domain, not innate moral structures. Objectivity would need grounding elsewhere (e.g., in the functional demands of cooperation itself, or in the nature of the general processes).
      *   **Defender's Response:** Could potentially shrug off *if* they redefine "machinery" flexibly to mean these domain-general processes *as they are systematically deployed* in the moral domain cross-culturally. However, this weakens the claim of specifically *moral* universals. Concede it forces clarification: are the "modules" dedicated or domain-general deployments?

  **III. Awkward Defeaters (Challenging but Consistent with Qualified View)**

  6.  **Significant Weighting Variability Undermines "Objectivity" of Judgments:**
      *   **Scenario:** Cultures differ not just in scope or emphasis, but in the *absolute moral weight* given to core concerns in ways that make cross-cultural moral agreement practically impossible on complex issues. E.g., Culture A sees preventing minor harm to an outgroup member as *always* overriding preserving a major sacred purity ritual for the ingroup. Culture B sees the reverse as *always* true. Both claim objectivity for their weighting.
      *   **Why Awkward:** Highlights that "shared machinery" doesn't guarantee shared moral conclusions or even resolvable disagreements. It makes objective moral *truth* difficult to access or apply cross-culturally, even if the structures exist.
      *   **Defender's Response:** Shrug off. Consistent with the parameter-setting view. Parameters *include* weightings. Objectivity resides in the validity of the underlying concerns and the structure, not necessarily in the specific outputs of every possible parameter combination. Resolving weighting conflicts requires further philosophical argument (e.g., reflective equilibrium, functional necessity).

  7.  **Rule-vs-Relationship as Fundamental, Not Parametric:**
      *   **Scenario:** Evidence suggests that "rule-based" vs. "relationship-based" moral cognition isn't just a parameter setting within shared machinery, but reflects fundamentally different cognitive styles or ontologies. E.g., Truly "relationship-based" societies might lack the concept of generalizable moral rules detached from specific relational contexts altogether. Morality *is* the network of concrete obligations.
      *   **Why Awkward:** Challenges the idea that this is just a different setting *within* the same moral framework. It suggests potentially incommensurable ways of experiencing moral obligation.
      *   **Defender's Response:** Shrug off or concede as a parameter extreme. Argue that even in "relationship-based" systems, there are patterns recognizable as regulating harm, reciprocity, etc., just instantiated differently. The core functions are still served.

  **Addressing Your Specific Points & Meta-Questions:**

  *   **Grain:** This is a central challenge (**Defeater #3**). Your view risks collapse into formalism ("every culture has non-optional norms") unless you can identify *some* minimally substantive, cross-culturally stable content within the core modules (e.g., the aversive response to *intentional, unnecessary physical harm to a known conspecific* is near-universal and foundational, even if "unnecessary," "conspecific," and the exact nature of "harm" have some variability). The defender *must* argue for this minimal substance.
  *   **Your Hypothetical Study:** As discussed (**Defeater #4**), it shrinks and complicates the link to objectivity but doesn't necessarily kill the parameter story about *structure*. Finding places where *nothing* survives "Gods command it" is the most damaging part.
  *   **Predictions & Falsifiability:**
      *   **What your view predicts that rivals don't:** It predicts a *constrained* pattern of variation. We should *not* find truly arbitrary moral codes. Variation should cluster around plausible settings for the proposed modules (scope, weighting, implementation style). It predicts that moral dumbfounding or inarticulateness will occur when probing justifications for core module violations, even in diverse cultures. It predicts that children across cultures will develop intuitions mapping onto the core modules early, even if content varies later.
      *   **Qualification/Insulation:** There is a risk of unfalsifiability if *every* variation is explained as a "parameter setting." To avoid this, the theory *must* specify in advance (1) what the fixed core machinery *is* (beyond just "has norms"), (2) what the *possible* parameters and their *ranges* are, and (3) crucially, what patterns of variation would *contradict* the model (e.g., **Defeaters #1 & #2** – disjoint frameworks or variation tracking non-cultural factors directly). Insulation is *only* fine if clear counter-evidence is defined. If *no* conceivable finding about variation could challenge the core machinery claim, then it's likely vacuous.
  *   **Unit of Explanation:** As highlighted in **Defeater #2**, this is potentially fatal. If variation tracks market integration/residential mobility/etc. more strongly and directly than "culture," it fundamentally challenges the "cultural parameter-setting" narrative. Your story would need to be revised towards universal psychological responses to ecological/economic conditions shaping moral intuitions *directly*, with "culture" as a secondary mediator or lagging indicator.

  **Conclusion:** Your view is a robust and plausible synthesis of MFT and linguistic analogies. Its greatest strengths are explaining constrained variation and pointing to universal structures. Its fatal vulnerabilities are:
  1.  Evidence of truly disjoint moral frameworks lacking any recognizable core modules.
  2.  Evidence that moral variation primarily tracks immediate material/ecological factors, not thick cultural transmission (wrong explanatory unit).
  3.  The Grain Problem collapsing universality into vacuous formalism.

  The hypothetical study is a strong defeater, shrinking the objective core and potentially severing the link between universal machinery and objectivity in some cultures. To remain credible, the theory must clearly define its core machinery, specify the limits of parameter variation, and embrace predictions that could genuinely fail. Defending against the Grain Problem and the challenge to the "cultural" unit of explanation are the most pressing tasks.
