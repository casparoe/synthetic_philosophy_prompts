  First, I need to establish why the urn is insufficient: it's too easily misinterpreted as having a "true" probability. The hospital scenario must emphasize structural unknowns—like unforeseen failure modes in novel treatments that no amount of past data could predict. The key is making ambiguity feel ontological, not epistemological. 

