answer: |-
  Here's a structured 90-minute seminar plan focusing on conceptual clarity, avoiding misconceptions, and leveraging the hospital triage scenario to distinguish **risk** (known probabilities) from **ambiguity** (uncertainty about the probability model itself).

  **Core Pedagogical Goal:** Establish ambiguity as *structural model uncertainty*, not an information gap about a "true" probability.

  **Why Avoid Urns Initially:** The classic urn (known 50/50 red/black vs. unknown mix) risks students interpreting the "ambiguous" urn as having a *hidden-but-fixed* probability ("if only we knew the composition!"), conflating it with risk under missing information. The hospital scenario emphasizes *systemic unpredictability* inherent to novel interventions.

  **Seminar Structure (90 mins):**

  1.  **Foundations: Subjective Expected Utility (SEU) & Risk (20 mins)**
      *   **Goal:** Reactivate core SEU concepts: preferences over acts, states, outcomes; probability as *degree of belief*; maximization of expected utility.
      *   **Scenario Setup (Risk Only):** Introduce the triage committee facing *only* **Protocol A (Established)**.
          *   *Features:* Long history of use across diverse (but documented) patient subgroups. Success rate *distribution* is well-characterized (e.g., "60-80% success, dependent on factors X, Y, Z which we can measure; historical mean 70%"). Show a stylized frequency distribution/histogram.
          *   *Choice:* Between Protocol A and a *known* risky alternative (e.g., "Do Nothing" with predictable 50% mortality). Demonstrate how SEU clearly applies: assign probabilities based on data, weight utilities, choose higher EU.
      *   **Key Reinforcement:** Under *risk*, probabilities are *known* (or confidently estimable as subjective degrees of belief based on solid evidence). Uncertainty is quantifiable.
      *   **Anchor Point:** SEU is the normative benchmark for rational choice under *risk*.

  2.  **Introducing Ambiguity: The Novel Protocol (20 mins)**
      *   **Goal:** Introduce **Protocol B (Novel)** with identical *point estimate* but irreducible model uncertainty.
      *   **Scenario Setup (Ambiguity):**
          *   *Features:* Early trials show promising *average* efficacy (e.g., "70% success in preliminary trials"), matching Protocol A's mean. **Crucially emphasize what's missing:**
              *   No data on diverse subgroups or interaction effects ("Does it work as well for elderly/comorbid patients?").
              *   Unknown failure modes ("*Why* do the 30% fail? Is it random variation, or are there catastrophic, unpredictable reactions?").
              *   Unclear stability under real-world conditions ("Will efficacy drop drastically outside strict trial protocols?").
          *   *Structure the Ambiguity:* Frame the uncertainty not as "we don't know the *exact* probability," but as "we lack a *reliable model* to even assign a single probability distribution we trust." The "probability" itself is ill-defined or contested. Highlight multiple plausible *competing models* consistent with the limited data (e.g., Model 1: Stable 70% success; Model 2: 90% success in healthy patients, 50% in frail; Model 3: 99% success normally but 1% chance of catastrophic failure cluster).
      *   **The Choice:** Present the committee's binary choice: Protocol A (Established, well-modeled risk) vs. Protocol B (Novel, ambiguous).
      *   **Common Misconception Head-off (Here!):** Students will think "It's just risk with an unknown prior! More data on B will fix it." **Counter:** Emphasize the *structural* nature: "Even with this data, experts fundamentally disagree on *how to model* the uncertainty. The point estimate is consistent with wildly different underlying *distributions* of outcomes and failure mechanisms, some potentially catastrophic. Gathering *more* data of the *same kind* (e.g., larger homogeneous trials) might not resolve which *model* is correct for real-world deployment. The ambiguity stems from *model uncertainty*, not just sample size."
      *   **Key Question:** "Can we simply treat Protocol B like Protocol A, assigning a sharp 70% probability using SEU?"

  3.  **The Paradox: Preference Reversal (15 mins)**
      *   **Goal:** Demonstrate ambiguity aversion and the Ellsberg-style violation of SEU.
      *   **The Revealed Preference:**
          1.  Choice 1: Protocol A (70% known dist.) vs. Protocol B (70% point, ambiguous). **Result:** Most committees (and experimental subjects) strongly prefer Protocol A. *Ambiguity Aversion* revealed.
          2.  Choice 2: *Now* introduce a variation: Compare Protocol B (ambiguous) vs. a *different* established Protocol C, whose known success rate distribution has a **lower mean** (e.g., 65%).
          3.  **Result:** A significant portion (often the same people) now prefer the *ambiguous* Protocol B over the *known worse* Protocol C. They rejected B when A (same mean, known) was available, but accept B over C (lower mean, known).
      *   **The Contradiction:** Under SEU, rejecting B in favor of A implies your *subjective probability* for B's success is <70%. Choosing B over C (65%) implies your subjective probability for B is >65%. The only consistent SEU probability for B is between 65% and 70%. BUT, if you hold such a probability, why ever prefer A over B? You should be indifferent or prefer the one with marginally higher EU. The reversal violates the *Sure Thing Principle* or linearity in probabilities inherent in SEU.
      *   **Common Misconception Head-off (Here!):** Students might think this is "irrational inconsistency" or "mere emotion." **Counter:** Frame it as a *descriptive challenge* to SEU: "People reliably exhibit this pattern. SEU cannot explain it without assuming wildly unstable probabilities. This suggests a distinct cognitive/evaluative process is at work when facing ambiguity vs. risk."

  4.  **Formal Diagnosis: What SEU Assumes (and Ambiguity Violates) (15 mins)**
      *   **Goal:** Connect the behavioral pattern to the failure of SEU axioms.
      *   **The Core Issue:** SEU requires agents to reduce all uncertainty to a *single, additive probability measure* over states. Ambiguity presents a situation where the agent cannot or will not do this.
      *   **Link to Scenario:** In Protocol A, a single probability distribution is confidently assigned based on the model (historical data). In Protocol B, multiple plausible probability *distributions* (models) are possible, and the agent doesn't know which one is correct or doesn't want to commit to averaging them into one measure. They dislike the uncertainty *about which model applies*.
      *   **Key Insight:** Ambiguity aversion is aversion to *uncertainty about the probability model itself* (second-order uncertainty). Risk involves applying probabilities *within* a known model; ambiguity involves uncertainty *about which model to use*.
      *   **Common Misconception Head-off (Here!):** Students might think "It's just higher variance!" **Counter:** "Protocol A might *have* high variance (e.g., 60-80%), but it's a *known*, quantifiable variance within a trusted model. Protocol B's variance is fundamentally *unknown* and could be much larger *or* involve qualitatively different, unmodeled risks (catastrophic failures). Ambiguity is about the reliability of the probability *assignment*, not the spread of outcomes per se."

  5.  **Normative Interpretation & Contestation (15 mins)**
      *   **Goal:** Present the debate about rationality without claiming consensus.
      *   **Arguments for Ambiguity Aversion as Rational:**
          *   *Epistemic Humility:* Recognizing the limits of one's knowledge/system is rational. Committing to a single probability for Protocol B might be overconfident.
          *   *Robustness/Regret Avoidance:* Preferring the known model (A) avoids potential catastrophic regret if a bad, unmodeled outcome of B occurs ("We knew the risks of A").
          *   *Model Uncertainty:* If multiple models are plausible, optimizing under the *worst-case* plausible model (maximin) or using a non-additive capacity (Choquet) can be seen as prudential.
      *   **Arguments Against Ambiguity Aversion as Normatively Compelling:**
          *   *Dynamic Inconsistency:* The preference reversal (B vs. C) can lead to dynamically inconsistent choices or being "Dutch booked".
          *   *Paralysis:* Extreme aversion could prevent adopting any novel treatment, stifling progress.
          *   *Subjectivity:* What constitutes "sufficient" model uncertainty to warrant aversion is highly subjective.
      *   **Crucial Distinction:** "Settled: Ambiguity (Knightian uncertainty) refers to situations lacking a settled, reliable probability model, distinct from risk (Knightian risk). Contested: Whether ambiguity aversion is normatively *required*, *permitted*, or *irrational* is a deep philosophical and economic debate. Both descriptive reality and normative arguments exist."
      *   **Avoid:** Presenting either "always rational" or "always irrational" as the consensus view.

  6.  **Comprehension Check: Model Uncertainty vs. Hidden Probability (5 mins)**
      *   **Scenario:** "Six months pass. The hospital has used Protocol B on 100 more patients, carefully selected to match the initial trial cohort. Success rate remains ~70%. However, *new* questions arise: Unexpected interactions with a common medication were found, and success seems highly sensitive to subtle nursing protocols not fully specified initially. Expert disagreement on the fundamental reliability and generalizability of the model persists."
      *   **Question:** "Has the uncertainty around Protocol B fundamentally changed from ambiguity to risk? Why or why not?"
      *   **Correct Understanding (Model Uncertainty):** "No. While there's *more data*, the core *model uncertainty* remains. We now know it's sensitive to factors we didn't initially model (meds, nursing), and experts still disagree on how to model it reliably for broader use. The uncertainty is still about *which probability model applies* in practice, not just the parameters of a fixed model."
      *   **Misconception (Hidden Probability):** "Yes, it's now just risk. We have a better estimate (still ~70%), we know some new factors affecting it. It's becoming like Protocol A." (This misses the persistent lack of a settled, trusted model).

  **What to Explicitly Leave Out:**

  1.  **Formal Axiomatization (Savage, Anscombe-Aumann):** Too abstract/time-consuming for intro; focus on conceptual violation of SEU principles instead.
  2.  **Specific Alternative Models (Maxmin EU, Choquet Expected Utility, Smooth Ambiguity):** Mention their existence as responses, but avoid technical details. Briefly name-dropping Maxmin EU as capturing "worst-case" thinking is sufficient.
  3.  **Detailed Experimental Literature Review:** Cite Ellsberg descriptively, but omit variations, replication details, or neuroeconomics.
  4.  **Deep Dive into Foundations of Probability:** Assume basic familiarity; don't re-litigate frequentist vs. Bayesian interpretations beyond what's needed for the distinction.
  5.  **Comprehensive History (Knight, Keynes):** Acknowledge the origins ("often called Knightian uncertainty"), but don't spend time on historical context.

  **Key Takeaways by End of Session:**

  1.  **Risk:** Known (or confidently estimable) probability distribution over outcomes *within a trusted model*. Quantifiable uncertainty. SEU applies.
  2.  **Ambiguity:** Uncertainty about *which probability model* is correct or reliable. Structural model uncertainty. Characterized by a lack of confidence in assigning *any single* probability measure. Violates core SEU assumptions.
  3.  **Ellsberg Pattern:** Aversion to ambiguity manifests in predictable preference reversals inconsistent with SEU.
  4.  **Normative Status:** Ambiguity aversion is descriptively robust, but its normative justification is philosophically contested (prudence vs. inconsistency).
  5.  **Beyond Information Gaps:** Ambiguity arises from fundamental limitations in model specification and reliability, not merely lack of data points. More data of the *wrong kind* (not resolving model conflict) doesn't eliminate it.
