answer: |-
  ## Research Proposal: The Multidimensional Standing of Hypocrites in Moral Blame

  **1. Research Question:**  
  How, and to what extent, does the hypocrisy of a blaming agent *selectively undermine* distinct dimensions of their standing to blame – specifically epistemic standing, normative standing, and affective standing – and how does this effect vary systematically depending on (a) whether the hypocrisy is *in-domain* (the hypocrite commits the very same wrong) or *cross-domain* (the hypocrite commits a different, but comparable, moral wrong) and (b) the *directional context* of the blame (directed upwards, downwards, or horizontally at the wrongdoer)?

  **2. Gap in the Literature:**  
  The prevailing debate concerning hypocrisy and moral standing has fixated primarily on the unitary question: "Does a hypocrite *forfeit their standing to blame* simpliciter?" (e.g., Wallace, Scanlon, Todd, Fritz & Miller). This framework treats "standing" as an undifferentiated, monolithic status – one either possesses it entirely or loses it entirely upon being exposed as hypocritical. This unitary conception is demonstrably inadequate. It fails to capture the nuanced, often asymmetrical, ways hypocrisy operates. For instance, a parent who lies occasionally might intuitively lack the *authority* (normative standing) to blame their child for lying, yet could still be uniquely *positioned to recognise* (epistemic standing) the wrongness of the child's lie and might legitimately feel *indignation* (affective standing) despite their own flaw. Similarly, a subordinate hypocritically blaming a superior (upward blame) might lose standing differently than a superior hypocritically blaming a subordinate (downward blame). The existing literature's failure to disaggregate standing into its constitutive dimensions obscures these selective effects and prevents a precise understanding of *how* and *why* hypocrisy undermines blame in specific contexts. This project proposes that treating standing as multidimensional is essential to resolving persistent puzzles and achieving a more granular account of hypocritical blame.

  **3. Research Method:**  
  The project will employ a structured methodology of conceptual analysis and normative intuition-testing:

  *   **Stage 1: Conceptual Mapping & Dimension Analysis (Months 1-2):**  
      Precisely define and distinguish the three proposed dimensions of standing:
      *   *Epistemic Standing:* The blamer’s capacity and situational positioning to accurately recognise the nature and wrongness of the act being blamed (e.g., relevant knowledge, lack of distorting biases).
      *   *Normative Standing:* The blamer’s entitlement to hold the wrongdoer accountable through blame, grounded in the blamer’s own adherence to relevant norms and their position relative to the wrongdoer (avoiding self-undermining authority or compromised moral position).
      *   *Affective Standing:* The legitimacy or appropriateness of the blamer expressing reactive attitudes like resentment or indignation towards the wrongdoer, considering the blamer’s own moral record and its relationship to the blame context.
      Analyse potential interactions and tensions between these dimensions.

  *   **Stage 2: Taxonomy Construction & Case Analysis (Month 3):**  
      Develop a comprehensive taxonomy of hypocritical blaming scenarios structured along three key axes:
      *   *Hypocrisy Type:* **In-domain** (Blamer commits *the same specific wrong*) vs. **Cross-domain** (Blamer commits a *different, but relevantly similar or serious wrong*).
      *   *Directionality:* **Upward blame** (e.g., subordinate blames superior), **Downward blame** (e.g., superior blames subordinate), **Horizontal blame** (e.g., peers).
      *   *Context:* **Private interpersonal blame** vs. **Public censure**.
      This generates a core matrix (2 hypocrisy types x 3 directions x 2 contexts = 12 primary case types) for focused analysis.

  *   **Stage 3: Intuition Testing via Structured Thought Experiments (Month 4):**  
      Construct a series of carefully calibrated philosophical vignettes representing key cases within the taxonomy (e.g., "A manager who often arrives late hypocritically blames a subordinate for lateness" [In-domain, Downward] vs. "A chronically dishonest colleague hypocritically blames a peer for laziness" [Cross-domain, Horizontal]). For each vignette, pose targeted questions designed to elicit intuitions specifically about the *epistemic*, *normative*, and *affective* dimensions of the hypocrite’s standing (e.g., "Can they accurately understand the wrong?" [Epistemic], "Do they have the moral right to call out the wrongdoer here?" [Normative], "Is their anger/indignation justified?" [Affective]). This structured approach tests whether intuitions about standing track the dimensions separately and vary systematically across case types.

  *   **Stage 4: Synthesis & Model Building (Months 5-6):**  
      Analyse the patterns emerging from the intuition testing. Develop a principled mapping identifying:
      *   Which dimension(s) of standing are most robust or most vulnerable to different types of hypocrisy (in-domain vs. cross-domain).
      *   How the directionality of blame (up/down/horizontal) modulates the impact of hypocrisy on each dimension.
      *   The significance (if any) of the public/private distinction.
      Synthesise findings into a refined multidimensional model of standing to blame, specifically addressing the selective undermining by hypocrisy.

  **4. Success Criteria & Potential Failures:**

  *   **Positive Result:** A clear, principled mapping demonstrating that hypocrisy *does* undermine the dimensions selectively. For example:
      *   In-domain hypocrisy might consistently devastate *normative standing* (especially in downward blame) but leave *epistemic standing* largely intact.
      *   Cross-domain hypocrisy might significantly weaken *affective standing* (making resentment seem disproportionate or misdirected) while having a variable impact on normative standing depending on domain comparability and direction.
      *   Upward hypocrisy might uniquely impact *normative standing* due to power dynamics, while downward hypocrisy might more readily undermine *affective standing*.
      Success would be demonstrating consistent, explicable patterns across the dimensions and case types.

  *   **Failure Modes:**
      *   **Collapse:** Intuitions consistently treat the three dimensions as inseparable in practice, undermining the core hypothesis that they are distinct targets for hypocrisy's effect.
      *   **Noise & Lack of Principle:** Intuitions prove highly variable, context-dependent, or contradictory across the tested cases, revealing no clear pattern linking hypocrisy type/direction to specific dimensional undermining. This could indicate oversimplification or that other unaccounted factors dominate.
      *   **Inconclusive Ambiguity:** The analysis fails to yield sufficiently clear distinctions between the proposed dimensions, or the vignettes cannot reliably isolate intuitions about them.

  **5. Project Scope, Timeline & Feasibility:**

  *   **Scope:** The focus is solely on *moral blame* between individuals or within small groups, excluding institutional blame, legal standing, or global/structural injustice contexts. The taxonomy and cases will prioritise clarity and manageability over exhaustive coverage.
  *   **Timeline:**
      *   **Months 1-2:** Deep literature review (concentrated on standing/hypocrisy debates), conceptual analysis & dimension definition, initial taxonomy outline.
      *   **Months 3-4:** Finalise taxonomy, develop core set of 8-12 key vignettes, conduct structured intuition analysis (self-reflective and potentially involving discussion with peers/supervisor to test robustness).
      *   **Months 5-6:** Analyse results, refine model, draft fellowship report synthesising the multidimensional account and its implications.
  *   **Feasibility Assessment:** The six-month timeframe is challenging but realistic with strict focus. The primary risk is **over-ambition in case coverage**. Analysing every permutation (hypocrisy type x direction x context x potential domain variations) is impossible. Mitigation: Prioritise the most philosophically salient and contrasting cases within the taxonomy (e.g., contrasting in-domain/downward with cross-domain/horizontal). Success hinges on *depth of analysis on core cases* rather than breadth. The intuition-testing relies on philosophical reflection and targeted peer discussion, not large-scale empirical surveys, keeping it manageable. The key deliverable is a robust conceptual model with illustrative case support, not a fully exhaustive empirical map.

  **6. Broader Significance:**  
  Moving beyond the all-or-nothing paradigm of standing to blame is crucial for a mature theory of moral responsibility. A successful multidimensional account promises several key advances: (1) It offers a more precise diagnosis of *why* hypocritical blame often rings hollow or feels objectionable, distinguishing failures of authority from failures of insight or emotional appropriateness. (2) It better accommodates the complexity of non-ideal moral agents within responsibility practices, acknowledging that flawed agents may still contribute meaningfully to moral discourse in specific ways. (3) It provides a more nuanced framework for evaluating the legitimacy of blame in hierarchically structured relationships (e.g., familial, professional), where power dynamics interact significantly with personal moral failings. Ultimately, this project aims to provide a more sophisticated and realistic understanding of the conditions under which holding others morally accountable is itself a normatively intelligible and affectively coherent practice.
