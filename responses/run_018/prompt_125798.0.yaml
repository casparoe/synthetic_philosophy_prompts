answer: |-
  Below is a decision tree structured to navigate responses to genuine normative contradictions in institutional systems. The root case involves an authoritative framework entailing both O(A) and O(¬A) for a specific action A, with no meta-resolution. Questions are phrased neutrally, and positions are mapped only at the leaves. Includes 7 leaves (1 unoccupied), with flagged convergence points.

  ---

  ### **Decision Tree: Responses to Genuine Normative Contradictions**

  #### **Root Case**  
  An institutional code (maximally authoritative, no ambiguity/hierarchy) entails both O(A) and O(¬A) for action A.  

  ---

  #### **Branch 1: Nature of Contradiction**  
  *Q1: Is the contradiction an artifact of formalization?*  
  - **Yes** → [Position 1]  
  - **No** (genuinely structural) → **Branch 2**  

  #### **Branch 2: Classical Logic Preservation**  
  *Q2: Should classical logic be preserved by revising the framework?*  
  - **Yes** → [Position 2]  
  - **No** (adjust logic) → **Branch 3**  

  #### **Branch 3: Logical Adjustment**  
  *Q3: Does the adjustment block explosion while denying true contradictions?*  
  - **Yes** (paraconsistent non-dialetheist) → **Branch 4**  
  - **No** (accepts true contradictions; dialetheist) → **Branch 5**  

  #### **Branch 4: Domain Scope (Non-Dialetheist)**  
  *Q4: Is paraconsistency restricted to normative domains?*  
  - **Yes** → [Position 3]  
  - **No** (extends globally) → **Branch 6**  

  #### **Branch 5: Domain Scope (Dialetheist)**  
  *Q5: Is dialetheism restricted to normative domains?*  
  - **Yes** → [Position 6]  
  - **No** (extends globally) → [Position 7]  

  #### **Branch 6: Motivation (Global Paraconsistency)**  
  *Q6: Primary reason for global extension?*  
  - Logical/Metaphysical → [Position 4]  
  - Pragmatic → [Position 5]  

  ---

  ### **Leaf Positions**  
  1. **Institutional Deflationism** (Named)  
     - *Path*: Q1=Yes.  
     - Contradiction dissolves under improved formalization (e.g., context reinstated).  

  2. **Classical Reconstructionism** (Named)  
     - *Path*: Q1=No → Q2=Yes.  
     - Framework must be revised (e.g., add meta-rules) to restore consistency.  

  3. **Domain-Restricted Paraconsistent Revisionism** (Named)  
