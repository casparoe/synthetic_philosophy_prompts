  ### **Key Notes**  
  - **Convergence Warning**:  
    - Positions **3** (non-dialetheist) and **6** (dialetheist) both tolerate institutional contradictions without framework revision or global logical changes. They diverge *only* on whether contradictions are true (Q3), but share practical recommendations.  
  - **Unoccupied Diagnosis**:  
    - Position **5** is unattractive—global paraconsistency for *purely pragmatic* reasons sacrifices theoretical economy without sufficient justification.  
  - **Tree Completeness**:  
    - Covers major non-classical approaches; unnamed positions reflect gaps (e.g., no pragmatically motivated global dialetheism).  

