     - Block explosion in normative domains; contradictions false but tolerable.  

  4. **Global Paraconsistent Revisionism** (Named)  
     - *Path*: Q1=No → Q2=No → Q3=Yes → Q4=No → Q6=Logical/Metaphysical.  
     - Extend paraconsistency to all domains to protect inference/metaphysical uniformity.  

  5. **✗ Unoccupied** (Diagnosis: Unattractive)  
     - *Path*: Q1=No → Q2=No → Q3=Yes → Q4=No → Q6=Pragmatic.  
     - Global logical revision for institutional pragmatism is disproportionate.  

  6. **Institutional Dialetheism** (Named)  
     - *Path*: Q1=No → Q2=No → Q3=No → Q5=Yes.  
     - Normative contradictions are true; explosion blocked only in institutional contexts.  

  7. **Global Dialetheism** (Named)  
     - *Path*: Q1=No → Q2=No → Q3=No → Q5=No.  
     - True contradictions exist in all domains (e.g., normative, empirical, metaphysical).  

