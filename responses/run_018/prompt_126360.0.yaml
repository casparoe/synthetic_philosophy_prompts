answer: |-
  This is a *perfectly* observed phenomenon, and you're right – existing terms like concept creep or hypocrisy don't quite capture the specific mechanics. There isn't a single universally established term for this *exact* configuration, but it sits at the intersection of several well-studied concepts. Here's how to carve it out precisely:

  **The Core Phenomenon: Normative Decoupling with Persistent Anchoring**

  1.  **The Decoupling:** A norm's *operational function* (what behavior it actually regulates/enforces in practice) becomes decoupled from its *stated justification* (the original problem/social coordination game it was explicitly designed to solve).
  2.  **The Anchoring:** The community *persistently anchors* its justification for enforcing the norm back to the *original* problem/social coordination game, even when that game is no longer the primary driver of the behavior being regulated.
  3.  **The Shift:** The operational function has genuinely shifted to regulating a *different* (though potentially adjacent) behavior/solving a *different* coordination problem (e.g., politeness instead of tagged predictions).
  4.  **Enforcement Persists:** The norm remains *live* and *enforced* based on this now-mismatched justification.

  **Carving Out the Edges: How It's Different**

  1.  **Vs. Genuine Norm Evolution (Solving a New Problem):**
      *   **Key Difference:** *Justification Updates.* In healthy norm evolution, when the function shifts to solve problem B, the community (often implicitly or explicitly) *updates the justification* to align with problem B. The reason given for *why* the norm is important reflects its *current* function.
      *   **Your Case:** The justification remains stubbornly anchored to problem A, creating a disconnect between *why* people say the norm matters and *what* it actually does.

  2.  **Vs. Definitional Sloppiness/Vagueness:**
      *   **Key Difference:** *Clarity of Shift & Anchoring.* In sloppiness, usage is inconsistent or fuzzy, and justifications might be vague or absent. People might not even be consciously aware of the drift.
      *   **Your Case:** The shift in *operational function* is clear and stable (people reliably use the norm for politeness). The anchoring of the *justification* to the old problem is also clear and stable (people reliably cite the original reason when challenged). There's a specific, identifiable *mismatch* between two stable states (function vs. justification).

  3.  **Vs. Concept Creep:**
      *   **Key Difference:** *Direction of Change & Justification.* Concept creep involves *expanding* the *definition* of a term to cover more phenomena (often more severe or milder), often driven by underlying values/moral motives. The justification often *broadens* alongside the definition (e.g., "safety" now means emotional safety too).
      *   **Your Case:** The core *definition* might stay similar ("epistemic humility" still *sounds* like it's about belief confidence), but its *function* has shifted to a different domain (politeness). Crucially, the justification *doesn't broaden or shift*; it *stays fixed* on the original, now-irrelevant problem. It's functional drift under semantic/conceptual inertia.

  4.  **Vs. Hypocrisy:**
      *   **Key Difference:** *Sincerity of Belief.* Hypocrisy involves a disconnect between stated values/beliefs and *personal actions*. The person knows they aren't living up to their stated ideal.
      *   **Your Case:** The defenders *sincerely believe* the original justification is still valid and applicable *to the current usage*. They aren't being dishonest; they've failed to notice or internalize the functional shift and its implications for the justification.

  5.  **Vs. Common Knowledge Breakdown (Lewis):**
      *   **Key Difference:** *Coordination Persists.* Lewisian common knowledge breakdown would imply a failure to coordinate *at all* on the norm's meaning or application. The convention would collapse.
      *   **Your Case:** Coordination *persists perfectly well* on the *operational level* (everyone knows "epistemic humility" is now the signal/rule for polite disagreement). The breakdown is between operational coordination and *justificatory coordination*. They coordinate *on what to do* but not *on why they're doing it*, even though they *think* they agree on the "why".

  **Precise Concept Carving & Potential Coinage**

  *   **Mechanism:** **Normative Justification Lag** or **Functional-Justification Decoupling.**
  *   **Core Dysfunction:** **Anchored Justification:** The persistent cognitive tethering of the norm's raison d'être to its original, now obsolete (or minimized) problem, preventing justification from updating to match its evolved function.
  *   **State:** **Zombie Justification:** The justification is undead – it persists and drives enforcement even though the problem it was meant to solve is no longer the primary threat or focus.
  *   **Full Phenomenon:** **Operational Shift with Anchored Justification (OSAJ)** or **Normative Function-Justification Mismatch.**

  **Why this happens (especially in rationalist-adjacent spaces):**

  1.  **Original Problem Salience:** The original problem (untagged predictions) was likely highly salient, destructive, and foundational. Solving it was a major win, making the justification powerful and memorable.
  2.  **Normative Inertia:** Updating justifications requires conscious effort and potentially challenging founding narratives. It's easier to keep citing the powerful original reason.
  3.  **Signaling Value:** Using the original, "deeper" justification signals in-group membership and understanding of the community's history and core values, even if it's mismatched.
  4.  **Lack of Meta-Norms:** There's often no strong norm *requiring* periodic review and updating of justifications for existing norms. Drift goes unexamined until it's pointed out, and then defensiveness sets in.
  5.  **Adjacency:** The new function (politeness) often *feels* related to the old one (preventing reckless claims). This perceived adjacency makes the justification seem plausibly applicable, masking the functional shift.

  **In short:** You've identified a specific failure mode of norm evolution where **functional drift outpaces justificatory updating**, resulting in a **live norm enforced based on a fossilized justification anchored to a largely solved (or minimized) original problem.** While elements overlap with established concepts, the precise configuration of persistent enforcement based on a sincerely held but functionally mismatched justification warrants its own label. **Normative Justification Lag** or **Functional-Justification Decoupling** seem most descriptive. Coining **OSAJ (Operational Shift with Anchored Justification)** could also serve well.
