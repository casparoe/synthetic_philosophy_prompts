prompt: |-
  ok so i've been lurking on rationalist-adjacent forums for like a decade and lately i've noticed this weird failure mode in how norms evolve. you start with a convention that solves a clear coordination problem — everyone agrees to use "epistemic humility" in a strict, technical sense so people don't just assert wild predictions without tagging confidence. over time the actual usage drifts: people start applying the phrase to basic politeness in disagreement, which is a totally different coordination problem. but here's the kicker — when someone points out the drift, defenders don't update the justification. they still cite the original problem (untagged wild claims) even though that barely happens in the community anymore. the behavioral equlibrium has clearly shifted, but the normative story is like a fossil anchored to the old coordination problem. it's not concept creep, because the users aren't secretly keeping the old definition; they've genuinely moved on. and it's not hypocrisy either, because they really think the old reason still applies. i was talking to a friend who's read Lewis on convention and she said this sounds like a breakdown in common knowledge, but i don't think that's quite right either. does this specific configuration — a live, enforced norm whose justification has decoupled from the problem it actually solves — have an established name? if not, can you carve it out precisely? i want to know exactly where its edges are: how is it different from a convention that genuinely solves a new problem, and how is it different from people just being sloppy with definintions? i'm not looking for a reading list, just whether there's a concept i'm missing or if i need to coin one.
