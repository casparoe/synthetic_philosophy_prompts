prompt: |-
  ok so im taking this ethics seminar and we got into expressivism and the Frege-Geach problem, and i feel like every textbook just repeats the same example about conditionals with lying being wrong. i want to go deeper and im kinda stuck. write me an essay on whether the Frege-Geach objection is actually fatal for expressivism if you take seriously that moral predicates carry a thin descriptive core—like, they express disapproval but also latch onto minimal social-normative conditions that shift with conversational context. weigh the classic objections: Geach's point that embedding wrong in conditionals and negations seems to require a descriptive meaning, the pragmatic reply that we just transmit endorsement, and the deflationary move that says there's no real content to embed. then consider this hybrid contextualist reply: maybe the descriptive anchor is so minimal and context-sensitive that it doesnt generate the Frege-Geach tension, because what's embedded is just the attitudinal component plus a placeholder that gets filled differently in different contexts. dont just sit on the fence—defend a verdict. is this kind of expressivism immune, or does the objection still bite? reach an actual conclusion and justify it with reasoning, not just name-dropping. also sry if my framing is messy, i wrote this on my phone between classes and my roommate thinks im overthinking metaethics anyway
