  First, I need to break down the core components. The user mentions Geach's embedding issue with conditionals and negations. Expressivists initially struggled because non-descriptive attitudes don't embed logically like propositions. The standard replies are pragmatic transmission and deflationism, but the user wants to explore a hybrid contextualist approach.

  The hybrid model combines expressivism with a minimal descriptive element that shifts with context. So moral terms express disapproval and latch onto social-normative conditions. The question is whether this thin core resolves the embedding problem. 

  Key arguments against expressivism: Geach shows that in "If lying is wrong, then getting little brother to lie is wrong," the antecedent must have truth-apt content for the conditional to make sense. If "lying is wrong" is just booing, embedding it doesn't work logically. Blackburn's solution proposed higher-order attitudes, but critics like Schroeder argued it's too complex.

  Now, the hybrid approach. If moral predicates have a minimal descriptive anchor, say "violates norms of group G in context C," then embedding might work because there's a proposition to embed. But the descriptive content is thin and context-dependent. In different contexts, "wrong" refers to different norms. So when embedded, the placeholder gets filled contextually. 

  Does this solve the problem? On one hand, the descriptive core allows truth-conditional embedding. The conditional could mean "If lying violates norms-G, then getting brother to lie violates norms-G." But the challenge is that the norm group G might shift contextually. In the antecedent, G is fixed by the initial context, but in modus ponens, the context might change. For example, when moving from asserting the conditional to asserting the antecedent, the context shifts, so the norm group might differ, breaking logical validity.

  The user needs a defended verdict. I think the objection still bites because the minimal descriptive core doesn't ensure stable reference across contexts in logical inferences. Even with a placeholder, context-sensitivity can lead to equivocation. For instance, if the context changes when the antecedent is asserted, the norms referenced might differ, making modus ponens invalid. So the hybrid model doesn't fully resolve the issue.

  Also, expressivism's core is the attitudinal component. If the descriptive part is too minimal, it might not suffice for logical embedding. The contextualist reply might overcomplicate, losing expressivism's simplicity. The user's roommate thinks they're overthinking, but metaethics requires this depth. The user likely wants a clear conclusion to advance their understanding beyond surface-level critiques.

  In conclusion, while the hybrid model offers a sophisticated response, the Frege-Geach objection still poses a significant challenge due to context-sensitivity undermining logical stability. The user's proposed solution doesn't fully immunize expressivism.
answer: |-
  ## The Frege-Geach Gauntlet: Can a Hybrid Expressivist Run It?

  Your frustration with the tired "lying is wrong" examples is valid – the Frege-Geach problem demands deeper engagement, especially when considering sophisticated expressivist replies like the hybrid contextualist model you propose. Let's dissect whether grafting a thin, context-sensitive descriptive core onto expressivism truly inoculates it against Geach's challenge. We'll navigate the objections, the pragmatic and deflationary escapes, and ultimately test your hybrid proposal to reach a verdict.

  **The Core Challenge: Embedding Attitude**  
  Expressivism's core tenet is that moral statements (e.g., "Lying is wrong") primarily express non-cognitive attitudes (disapproval, pro-attitudes) rather than describing objective properties. Geach's insight was devastatingly simple: moral terms work identically to descriptive ones when embedded in complex sentences like conditionals ("If lying is wrong, then getting your little brother to lie is wrong") or negations ("Lying is not wrong"). These embeddings rely on the *unchanged meaning* of the moral term contributing to the truth-conditions of the larger structure. If "lying is wrong" just *boos* lying, what is the antecedent of the conditional *doing*? It doesn't seem to be booing; it’s setting up a hypothetical scenario. For the inference to be logically valid (modus ponens), the meaning in the antecedent must be the same thing we can affirm or deny in the conclusion. Pure expressionism seems to lack the stable, propositional content required for logic.

  **Standard Expressivist Counters:**
  1.  **The Pragmatic Reply (e.g., early Blackburn):** We aren't *asserting* the attitude in the antecedent; we're *displaying* a commitment pattern. Uttering the conditional expresses a higher-order attitude *about* disapproval: disapproval of both lying *and* approving of getting someone else to lie without disapproving of lying itself. The attitude is "transmitted" indirectly.
  2.  **The Deflationary Reply (e.g., Gibbard):** "Truth" and "proposition" aren't heavyweight metaphysical concepts. We can grant moral sentences are truth-apt *in a deflated sense* – we can say "It's true that lying is wrong" just means "Lying is wrong". Logic works because we have rules for manipulating these sentences based on their surface form, not because they map onto deep descriptive facts. The "content" embedded is simply the sentence itself under a commitment to the inferential rules governing moral discourse.

  **Your Hybrid Proposal: The Thin Descriptive Anchor**  
  Your suggestion injects crucial nuance: Moral predicates *do* express disapproval (the expressivist core), but they *also* latch onto a minimal, contextually variable descriptive anchor – something like "violates the operative social-normative conditions relevant in this conversational context" (e.g., "wrong" might minimally mean "violates the norms we're currently discussing/endorsing"). This anchor is "thin" – it doesn't specify *which* norms or provide deep descriptive criteria, merely pointing to *some* normative standard operative *here and now*. Crucially, this anchor *shifts* with context.

  **Evaluating the Hybrid Defense Against Frege-Geach:**  
  Does this contextualist expressivism dissolve the problem? The argument goes: When we embed "lying is wrong" in a conditional, what's embedded isn't *just* raw disapproval, nor is it a fixed, thick descriptive property. Instead, it's a complex: **attitude + contextually indexed placeholder** (e.g., "disapproval + violates norms-C", where 'C' is the context of utterance). The conditional becomes: "If [disapproval + violates norms-C] applies to lying, then [disapproval + violates norms-C] applies to getting your brother to lie." Logical form seems preserved – we're embedding a proposition-like entity structured around the attitude and its minimal target.

  **Why This Seems Promising (But Not Quite Immune):**
  1.  **Solves the "What's Embedded?" Problem:** It provides *something* propositional to embed – the attitude *about* a contextually specified normative condition. This seems more robust than pure attitude expression or deflationism. The antecedent isn't just hypothetical booing; it's hypothesizing disapproval *directed at* something minimally defined by the context.
  2.  **Accommodates Contextual Variation:** It elegantly explains why moral terms feel descriptive in some contexts (e.g., anthropological discussions: "In Sparta, stealing was not wrong") without abandoning expressivism. The descriptive anchor shifts, but the core attitude-expression remains.
  3.  **Preserves Logical Validity (Seemingly):** Modus ponens *appears* to work. If I assert the conditional (expressing my commitment to disapproval consistency) and then assert "Lying is wrong" (expressing my disapproval of lying under norms-C), I conclude disapproval of getting brother to lie under norms-C. The context 'C' seems fixed for the inference.

  **Where the Frege-Geach Fangs Still Bite: The Context-Sensitivity Problem**

  The fatal flaw emerges precisely from the **context-sensitivity** meant to be the solution. Logical inferences like modus ponens require *stability of reference* across the premises for validity to hold. The hybrid model threatens this stability:

  1.  **Shifting Anchors in Inference:** When I move from asserting the *conditional* ("If lying is wrong...") to asserting the *antecedent* ("Lying *is* wrong"), the conversational context often subtly shifts. The first utterance sets up a hypothetical or general frame; the second is a direct endorsement. Does the descriptive anchor 'C' remain identical? If 'C' in the antecedent of the conditional refers to the norms *operative in the hypothetical scenario*, while 'C' in the asserted antecedent refers to the norms *operative in the real-world endorsement*, they might diverge. The inference equivocates.
  2.  **The Problem of "Filling the Placeholder":** What *is* the minimal anchor? "Violates relevant norms"? But "relevance" is notoriously context-dependent and often *determined by the speaker's attitudes*. If the anchor itself is partly constituted by the attitude it's meant to anchor, we risk circularity. Embedding "lying violates relevant norms-C" only works logically if "norms-C" has stable, attitude-independent content *within the inference*. If 'C' is too thin or too tied to the attitude expressed *at the moment of utterance*, its reference isn't fixed enough to survive embedding in complex, context-spanning inferences.
  3.  **The "Minimal" Trap:** If the descriptive core is *so* minimal and context-bound that it adds no stable, shareable, logically manipulable content beyond what the attitude-expression already implies, then it collapses back into a sophisticated version of the pragmatic or deflationary move. It doesn't genuinely provide the *robust propositional structure* Geach demands. The placeholder needs to be "filled" by *something* concrete enough for logic to grip onto, but expressivism, by its nature, resists that concreteness to avoid collapsing into descriptivism.

  **The Verdict: Wounded, Not Immune**

  While your hybrid contextualist expressivism represents a significant and sophisticated evolution beyond pure expressivism, **the Frege-Geach objection still bites decisively.** The very context-sensitivity introduced to make the descriptive core plausible becomes its Achilles' heel in logical embedding.

  *   **The Fatal Wound:** The requirement for stable, non-attitude-dependent reference within logically valid inferences across potential context shifts undermines the minimal descriptive anchor. The placeholder either isn't filled stably enough ("relevant norms" equivocates) or, if filled robustly enough to ensure stability (e.g., "violates norms *of society S*"), it ceases to be minimal and context-bound in the way expressivism requires, drifting towards a form of relativist descriptivism that abandons the core expressivist motivation. The model struggles to simultaneously satisfy the demands of expressivism (primacy of attitude, context-sensitivity) and the demands of logic (stability of reference in inference).

  **Conclusion: Survival, Not Immunity**

  This hybrid expressivism isn't *fatally* wounded in the sense of being outright refuted and useless. It offers a powerful account of moral language's flexibility and the interplay of attitude and social context. It can likely develop sophisticated logics of commitment and context-shifting. However, **it fails to achieve full immunity to the Frege-Geach problem.** The objection "still bites" because it exposes a fundamental tension: pure attitude-expression struggles with logic; adding descriptive content risks abandoning expressivism; making that content minimal and context-sensitive risks making it too unstable for logic. The hybrid model navigates this tension impressively but doesn't resolve it. Expressivism survives the Gauntlet scarred, leaning heavily on complex pragmatic or deflationary scaffolding to explain logical validity, rather than finding a seamless, purely expressivist solution within the logic itself. Your roommate might say you're overthinking, but grappling with this depth is precisely where metaethics gets compelling – the Frege-Geach problem remains a formidable benchmark precisely because it forces us to confront these fundamental tensions head-on. Keep wrestling with it; the complexity you're feeling is the sign you're engaging with the real challenge.
