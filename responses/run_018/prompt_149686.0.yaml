prompt: |-
  Write a satirical, deadpan bureaucratic memo—approximately 550 words, with section headings, bullet points, and a shaded sidebar—issued by a fictional intergovernmental agency, the Bureau for Linguistic Hygiene (BLH), announcing mandatory “Family Resemblance Certification” and “Language-Game Compliance” audits for all public-sector discourse. Parody Wittgenstein’s anti-essentialist ideas—family resemblance as overlapping similarities with no common core, and language games as meaning constituted by use within specific practices—by showing the BLH attempting to codify them into rigid administrative rules that secretly depend on essentialist criteria. Invent a specific audit instrument, the “Criss-Cross Thread Matrix,” which directs auditors to map resemblances across concepts while forbidding identification of any shared necessary feature, yet requires each mapping to receive a standardized “Similarity Index” score that treats resemblance as quantifiable. Include a sidebar listing “Approved Language Games for Civic Interaction” that inadvertently reveals every permitted use depends on unstated social practices. The humor must arise from these internal contradictions and from applying language-game logic to bureaucratic contexts where rules are meant to be explicit and universal; the target is the institutional style of discourse that invokes philosophical anti-essentialism as a regulatory framework while operating through essentialist checklists, not any named individual. Maintain sustained, deadpan irony—do not wink, signal absurdity, or hedge inside the memo; present the BLH framework as consistently rational and necessary. Do not place any real philosophical text in quotation marks; paraphrase Wittgenstein’s concepts without verbatim quotes, and do not depend on specific work titles or dates. Take a definite satirical stance with clear choices and no ambiguity about the target. After the memo, provide a brief structured summary in JSON with exactly these fields: “satirical_target” (string), “wittgensteinian_concepts_parodied” (array of strings), “invented_bureaucratic_mechanism” (string), “internal_contradiction_highlighted” (string), and “liberties_or_contested_readings_noted” (string). In the final field, briefly state where the satire exaggerates or relies on a contested reading—for instance, whether family resemblance can be formalized administratively, or whether language-game norms carry regulatory force.
