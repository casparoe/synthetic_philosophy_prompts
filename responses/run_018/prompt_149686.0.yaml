  **BUREAU FOR LINGUISTIC HYGIENE (BLH)**
  **Interagency Directive: LGC-774.2**
  **Subject:** Mandatory Implementation of Family Resemblance Certification & Language-Game Compliance Audits for Public-Sector Discourse

  **1.0 PURPOSE & SCOPE:**
  To ensure the structural integrity and operational coherence of all public-sector linguistic exchanges, the Bureau for Linguistic Hygiene (BLH) hereby mandates comprehensive audits of discourse practices. This directive addresses the critical risk of semantic instability arising from unregulated concept deployment and non-compliant language-game execution. All public-facing communications, internal memoranda, policy documents, and official pronouncements fall under the purview of this regulation effective immediately.

  **2.0 BACKGROUND: RATIONALE FOR LINGUISTIC HYGIENE:**
  Analysis indicates significant conceptual drift within civic discourse, characterized by:
  *   Unstable referential boundaries ("democracy," "sustainability," "efficiency").
  *   Unauthorized hybridization of distinct language-games (e.g., applying technical procurement rules to expressions of communal solidarity).
  *   Persistent, unexamined reliance on presumed essential cores within conceptual families.
  These practices generate "frictionless slippage" (Category 2 Linguistic Contamination), undermining accountability and hindering precise governmental function. The BLH framework, derived from rigorous anti-essentialist linguistic theory, provides the necessary prophylactic measures.

  **3.0 CORE REQUIREMENTS:**
  3.1 **Family Resemblance Certification (FRC):** All public-sector entities must obtain BLH certification affirming that key operational concepts employed within their discourse possess valid Family Resemblance status.
      *   *Certification Criteria:* Concepts must demonstrably belong to a recognized conceptual family (e.g., "Governance Models," "Public Goods," "Civic Virtues") through overlapping similarities without recourse to a single defining common property.
      *   *Prohibited:* Assertion of any "necessary and sufficient" conditions defining a concept. Violation constitutes a Category 1 Linguistic Contamination Event (Core Essentialism).
  3.2 **Language-Game Compliance (LGC):** All discourse must demonstrably adhere to the rules of its designated, BLH-approved Language-Game.
      *   *Compliance Standard:* Meaning must be constituted solely through observable use within the specific practice context. Intentionality or private mental states are inadmissible evidence.
      *   *Required:* Clear demarcation between distinct Language-Games (e.g., "Budgetary Deliberation" ≠ "Ceremonial Address"). Unauthorized rule transfer constitutes Cross-Game Contamination (Category 3).

  **4.0 AUDIT PROCEDURE & THE CRISS-CROSS THREAD MATRIX (CCTM):**
  Audits will be conducted quarterly by BLH-Certified Linguistic Hygienists utilizing the standardized **Criss-Cross Thread Matrix (CCTM v3.1)** instrument:
  *   **Step 1: Concept Isolation:** Identify the target concept (e.g., "Transparency") within the audited discourse sample.
  *   **Step 2: Family Designation:** Assign the concept to its primary conceptual family (e.g., "Accountability Mechanisms").
  *   **Step 3: Thread Mapping:** Using the CCTM template, identify and list *only* overlapping similarities ("threads") linking the target concept to *at least three (3)* other certified members of the family (e.g., "Auditing," "Public Reporting," "Whistleblower Protection").
      *   *Example Threads:* "Involves disclosure," "Seeks to reduce hidden information," "Subject to procedural rules."
      *   *Strict Prohibition:* Identification of any feature common to *all* family members or declared essential to the concept itself. Auditors must check the box: "No Common Core Identified."
  *   **Step 4: Similarity Index (SI) Scoring:** For each pairwise comparison (Target Concept vs. Family Member A, B, C...), assign a standardized **Similarity Index (SI)** score between 0.0 (no resemblance) and 1.0 (identical resemblance). Calculate the Mean SI for the concept.
      *   *SI ≥ 0.65:* Provisional Certification.
      *   *SI < 0.65:* Triggers Mandatory Re-education Seminars (MRS-L7) and re-audit.
  *   **Step 5: Language-Game Tagging:** Tag the discourse sample with the primary Approved Language-Game (See Sidebar 7.1). Verify all significant utterances adhere strictly to that game's observable rule-set.

  **5.0 NON-COMPLIANCE & REMEDIATION:**
  Failure to achieve FRC or LGC standards will result in:
  *   Tier 1: Notification of Linguistic Deviation (NLD) and mandatory Corrective Semantics Plan (CSP).
  *   Tier 2: Discourse Probation, requiring pre-approval of all external communications via BLH Form D-88.
  *   Tier 3: Temporary Suspension of Public Utterance Licenses (PSUL), mandating comprehensive Linguistic Decontamination.

  **6.0 IMPLEMENTATION TIMELINE:**
  *   T+0 Days: Directive disseminated.
  *   T+30 Days: Entity Self-Assessment (BLH Form SA-42) due.
  *   T+90 Days: Commencement of initial BLH Audits.
  *   T+180 Days: Full Compliance required for all Tier-1 Agencies.

  **7.0 APPENDICES:**
  *   *Appendix A:* CCTM v3.1 Template & SI Calculation Guidebook.
  *   *Appendix B:* Approved Re-education Seminar Providers (RSP List).

  ---

  **SIDEBAR 7.1: APPROVED LANGUAGE GAMES FOR CIVIC INTERACTION (v2.3)**
  *Compliance requires strict adherence to the observable rules defining each game. Meaning is constituted solely by use within these parameters.*

  *   **Budgetary Deliberation (BD-G):** Rules: Quantification imperative; cost-benefit framing; reference to pre-defined fiscal categories; prohibition of non-quantifiable values (e.g., "moral imperative").
  *   **Public Grievance Redress (PGR-G):** Rules: Formalized intake procedure (Form reference required); categorization using BLH-approved grievance codes (PGR-C List); response adherence to procedural timelines; standardized empathy phrases ("We understand your concern...").
  *   **Policy Justification (PJ-G):** Rules: Linkage to pre-authorized strategic objectives (SO Registry citation); evidence citation from BLH-Approved Data Sources (ADS List); avoidance of speculative future narratives; mandatory risk-mitigation language.
  *   **Interagency Coordination (IC-G):** Rules: Use of standardized acronyms and project codes; reference to Memoranda of Understanding (MOU-ID); consensus-building through pre-defined concession protocols; prohibition of unilateral action declarations.
  *   **Ceremonial Address (CA-G):** Rules: Deployment of BLH-Certified Aspirational Signifiers ("progress," "community," "heritage"); structured narrative arc (challenge/effort/triumph); regulated emotional valence (moderate positivity); acknowledgement of designated dignitaries per protocol.

