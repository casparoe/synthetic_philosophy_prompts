prompt: |-
  I'm a doctoral student in philosophy of law preparing to lead a ninety-minute seminar for second-year law students who have just completed a course in tort theory. I want to teach them causation by omission—not through the standard "bystander at the pool" scenario they have already analyzed in class, but through the underlying metaphysical tension between absence-causation and interventionist accounts of causal relevance. My aim is for them to understand why an omission can be structurally causal without being an event, and why the legal "duty to act" only addresses the normative half of the problem while leaving the ontological half untouched.

  Plan the session's explanatory arc with the dependency structure made explicit. First, identify the conceptual distinction that must be in place before the puzzle even appears to them: for instance, the difference between a negative event and a mere absence, or between causal production and causal relevance under a counterfactual framework. Second, propose one concrete carrying example that is not the classic rescue case—ideally a scenario in which an omission looks like a cause to one theoretical framework but like a background condition to another, so that its structural ambiguity is visible. Specify what this example must include and what it must lack in order to serve as the vehicle for the idea. Third, map the misconceptions these students will predictably form in sequence—perhaps that omissions are merely mental causes, that establishing a legal duty transforms an absence into a positive act, or that counterfactual dependence alone solves the problem without any normative overlay—and indicate exactly where in the explanatory sequence each misconception should be headed off. Fourth, design a single check for understanding that would demonstrate they have grasped the structural point rather than simply repeating that omissions can be causes. Finally, state clearly what I should openly refuse to explain at this level—such as the full machinery of possible-worlds semantics for negative existentials, or the debate over causal exclusion versus overdetermination—and explain why omitting it protects rather than dilutes the core insight. Please do not provide a bibliography, reading list, or source recommendations; what I need is the pedagogical architecture, not citations.
reasoning: |-
  Okay, the user is a doctoral student in philosophy of law preparing a seminar on causation by omission for law students. They want to move beyond the standard "bystander at the pool" example and delve into the metaphysical tension between absence-causation and interventionist accounts. Their main goal is to show how omissions can be structurally causal without being events, and how the legal duty addresses only the normative aspect, leaving the ontological issue unresolved.

  First, I need to understand the core challenge. Law students might conflate the normative duty with the causal structure. The key is to separate ontology (what causation *is*) from normativity (when we *hold someone responsible*). The seminar must first establish the conceptual groundwork: distinguishing negative events from mere absences, and causal production from causal relevance in counterfactual frameworks.

  For the concrete example, the user wants something other than the classic rescue scenario. I'm considering a gardener case: a gardener fails to water a plant, causing it to die. But to highlight the structural ambiguity, I need to contrast interventionist views (where the omission is a background condition) with counterfactual dependence (where the absence is causally relevant). The example must lack a pre-existing duty to emphasize that causation exists independently of duty. Also, it should involve a specific expectation (like a contract) to show how duty adds normativity later.

  Next, predicting misconceptions. Students might think omissions are just mental events (like deciding not to act), or that legal duty "creates" causation. They might also rely solely on counterfactuals without seeing the ontological gap. Each misconception needs addressing at specific points: when defining omissions, when discussing the example, and when introducing the duty element.

  The check for understanding should force students to apply the structure without duty. Maybe a scenario where an omission causes harm, but no duty exists. Can they articulate why it's causally relevant yet not legally culpable? This shows they grasp the separation.

  Finally, omitting complex topics like possible-worlds semantics or causal exclusion. These could derail the session. The focus should stay on the structure of omission-as-cause versus duty. Avoiding these ensures the core insight isn't lost in technicalities.

  Putting it together: Start with concepts, use the gardener example to reveal the tension, preempt misconceptions step-by-step, check understanding with a duty-free case, and avoid overcomplicating. This architecture should help students see the ontological-normative divide clearly.
answer: |-
  Here’s a structured pedagogical plan for your seminar, prioritizing conceptual dependencies and targeting predictable misconceptions:

  ---

  ### **Explanatory Arc & Dependency Structure**
  **Core Goal:** *To reveal the ontological puzzle of omission-causation (how an absence can be structurally causal) and disentangle it from the normative "duty" question.*

  #### **Phase 1: Foundational Distinctions (20 mins)**  
  *(Prerequisites for the puzzle to emerge)*  
  - **D1: Negative Event vs. Mere Absence**  
    - *Negative Event:* A deliberate non-action (e.g., "She *refrained* from shouting a warning").  
    - *Mere Absence:* A pure lack with no agential component (e.g., "No rain fell in July").  
    - *Why:* Students must see that omissions in law are *agent-relative absences* (not events), yet courts treat them *as if* they were causes.  
  - **D2: Causal Production vs. Causal Relevance**  
    - *Production:* Causation as physical force/energy transfer (e.g., a bat striking a ball).  
    - *Relevance (Counterfactual):* Causation as difference-making (e.g., "But for X, Y would not have occurred").  
    - *Why:* Interventionist accounts (e.g., Woodward) demand *production*; law often uses *relevance*. Absences can’t produce but can be relevant.  

  #### **Phase 2: Core Example – "The Neglected Backup Generator" (25 mins)**  
  *(Scenario engineered to expose the tension)*  
  **Setup:**  
  > *A hospital’s backup generator fails during a storm because its technician, Alice, did not perform monthly maintenance. Patient X dies during a power outage. Alice had no contractual duty to maintain the generator (it was an informal expectation), but she was the only person trained to do so.*  

  **What the Example MUST Include:**  
  - A *specific, expected action* (maintenance) omitted by an *identifiable agent*.  
  - A *physical causal chain* (storm → power outage → death) where the omission is *counterfactually necessary* ("With maintenance, generator works; patient lives").  
  - **No pre-existing legal duty** (to isolate ontology from normativity).  

  **What it MUST Lack:**  
  - Any "bystander" element (no pool, no rescue).  
  - Ambiguity about physical causation (storm → outage → death is clear).  

  **Pedagogical Use:**  
  - **Interventionist View:** "Alice’s omission didn’t *produce* the death; the storm did. Her inaction is a background condition."  
  - **Counterfactual View:** "But for her omission, the death wouldn’t have occurred. It’s causally relevant."  
  - **Pivot:** "Notice: Both agree on the physics. The conflict is *whether absences can be causes*—not *how* the death happened."  

  #### **Phase 3: Predictable Misconceptions & Interventions (25 mins)**  
  *(Sequence: Misconception → When to Intervene → Correction)*  
  1. **"Omissions are mental events (e.g., deciding not to act)."**  
     - *Intervene:* After introducing the generator example.  
     - *Correction:* "The cause isn’t Alice’s *decision*; it’s the *absence of maintenance*. Imagine she forgot unconsciously. The omission remains."  

  2. **"Legal duty ‘transforms’ an absence into a cause."**  
     - *Intervene:* When discussing why the hospital might sue Alice.  
     - *Correction:* "Suppose we impose a *post hoc* duty. Does this change the *causal structure* of the past? No—it only changes liability. Causation (ontological) ≠ Culpability (normative)."  

  3. **"Counterfactual dependence solves everything; no ontology needed."**  
     - *Intervene:* When contrasting interventionist/counterfactual views.  
     - *Correction:* "If absences are causes, what caused the generator failure? ‘Nothing’? But ‘nothing’ isn’t a *thing* that exerts force. This is the puzzle: How can *nothing* be a cause?"  

  #### **Phase 4: Check for Understanding (10 mins)**  
  **Task:** *Apply the distinction to a new case—without invoking duty.*  
  > *"Farmer Brown’s automated crop-irrigation system fails. He omitted to install a $10 backup sensor (though he knew the risk). Drought kills his crops. He had no legal duty to install sensors."*  

  **Key Questions:**  
  1. "What is the *physical cause* of the crop death?"  
     *(Answer: Drought [production])*  
  2. "Is Brown’s omission *causally relevant*? Why?"  
     *(Answer: Yes—counterfactually necessary)*  
  3. **"Is the omission part of the *causal structure* or a *background condition*? Justify without mentioning duty."**  
     *(Success: Student notes ambiguity—it’s structural for counterfactual views, incidental for production views.)*  

  #### **Phase 5: Strategic Omissions (10 mins)**  
  *(What *not* to teach—and why)*  
  - **Omit:** Possible-worlds semantics for absences (e.g., "In closest worlds where rain exists...").  
    *Why:* It overcomplicates the core insight (absence vs. production) and risks reducing ontology to semantics.  
  - **Omit:** Causal exclusion/overdetermination debates.  
    *Why:* Focus is on the *structure* of omission-causation, not resolving mental causation or redundant causes.  
  - **Omit:** Comparative legal approaches (common law vs. civil law).  
    *Why:* This is a metaphysical primer, not a doctrine drill. Doctrine follows ontology here.  

  ---

  ### **Why This Works**  
  - **Dependency Flow:** Students must grasp D1/D2 *before* the generator example reveals the puzzle. Misconceptions are preempted *at the point they arise*.  
  - **Example Design:** The generator lacks duty/rescue tropes, forcing focus on causal structure. The drought case checks transferability.  
  - **Core Insight Protection:** Omitting possible-worlds/exclusion debates prevents dilution. Students leave seeing the *gap* between ontology (can an absence cause?) and normativity (when do we punish it?).  
  - **Law Student Relevance:** Uses familiar tort elements (causation, duty) but subverts them to expose philosophy’s foundations.  

  **Final Note:** End by asking: "If we say omissions *cause* harm, are we treating ‘nothing’ as a ‘something’? Does law need to answer this—or just manage consequences?" This primes deeper inquiry without requiring resolution.
