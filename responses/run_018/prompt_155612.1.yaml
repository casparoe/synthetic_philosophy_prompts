answer: |-
  Based on your constraints (no archive access, 2-year horizon, demand for practical leverage) and the need for a **defended agenda**, here’s a ranked prioritization with explicit criteria. The ranking prioritizes **tractability with conceptual tools alone**, **minimizing dependency dead ends**, and **maximizing practical impact on governance/education design**:

  ### **Ranking & Rationale**  
  1. **Empirical-Institutional Problem (Knowledge-Production Institutions)**  
  2. **Formal-Conceptual Problem (Governmentality & Algorithms)**  
  3. **Normative-Structural Problem (Recovering Normative Traction)**  

  ---

  ### **1. Empirical-Institutional Problem: Priority**  
  *   *Core Question*: Have institutions (peer review, metrics, funding) shifted from disciplinary normalization to algorithmic modulation?  
  *   **Why Upstream:**  
      - **Tractability**: Requires no archives—analyze public systems (e.g., Elsevier’s AI tools, grant algorithms, h-index dynamics) using Foucault’s *methods* (discourse analysis, institutional ethnography).  
      - **Dependency**: Resolving this *tests the urgency* of extending Foucault. If institutions still operate disciplinarily, the "new power" thesis weakens.  
      - **Practical Leverage**: Directly impacts academic policy (e.g., reforming research assessment) and reveals how governance design *actually functions* in knowledge economies.  
      - **Risk Mitigation**: Failure to find a shift doesn’t invalidate the project; success forces engagement with Q1/Q2.  

  ---

  ### **2. Formal-Conceptual Problem: Secondary**  
  *   *Core Question*: Can governmentality extend to algorithmic nodes without collapsing discipline/administration?  
  *   **Why Here:**  
      - **Tractability**: Conceptual work (e.g., comparing algorithmic "behavioral nudges" vs. panoptic observation) needs only texts + public tech documentation (e.g., EU AI Act, platform TOS).  
      - **Dependency**: Builds on Q1’s empirical findings. If Q1 shows institutional shift, formalizing "algorithmic governmentality" becomes essential.  
      - **Practical Leverage**: Clarifies whether education tech (e.g., adaptive learning algorithms) is "disciplinary 2.0" or a new paradigm—critical for policy design.  
      - **Risk**: Collapsing discipline/administration risks making Foucault’s framework *too elastic*. Anchor in Q1’s institutional analysis to avoid this.  

  ---

  ### **3. Normative-Structural Problem: Tertiary**  
  *   *Core Question*: Can normative judgment be recovered within anti-essentialism?  
  *   **Why Last:**  
      - **Intractability**: Demands heavy philosophical labor (e.g., engaging Butler/Honneth/Rancière) with no empirical shortcut. High risk of dead ends.  
      - **Dependency**: *Presupposes* Q1/Q2. If Foucault’s framework can’t describe contemporary power (Q1/Q2), normativity is moot.  
      - **Practical Leverage**: Low immediate impact. Even if resolved, it rarely changes policy design—governments optimize efficiency, not "emancipation."  
      - **Risk**: Leads to unattractive commitments (e.g., quietism if normativity is impossible; liberalism if smuggled in).  

  ---

  ### **Critical Dependencies & Incoherences to Flag**  
  - **Q1→Q2 Dependency**: If knowledge institutions *haven’t* shifted to modulation (Q1), extending governmentality to algorithms (Q2) may be scholastic.  
  - **Q2→Q3 Trap**: Attempting normativity (Q3) *before* clarifying algorithmic power (Q2) risks building ethics on outdated foundations (e.g., judging algorithms as "disciplinary" when they’re not).  
  - **Incoherence Risk**: Claiming algorithmic power is "new" while using unmodified Foucauldian tools *or* insisting on continuity without empirical proof.  
  - **Dead End**: Normative traction (Q3) is impossible *if* you reject all immanent critique (e.g., resistance as subjectivation).  

  ---

  ### **Execution Strategy for Maximum Impact**  
  1. **Start with Q1 (Empirical-Institutional)**:  
     - *Method*: Map 3-5 knowledge systems (e.g., preprint moderation, NSF grants, university rankings) using Foucault’s criteria for discipline (spatial partitioning, hierarchical observation).  
     - *Deliverable*: Concrete analysis of whether algorithmic tools (e.g., similarity detectors, grant-scoring AI) enable *modulation* (continuous adjustment) vs. normalization.  
     - *Leverage*: Publish in policy/pedagogy journals to influence research governance.  

  2. **Transition to Q2 (Formal-Conceptual)**:  
     - Use Q1’s findings to model algorithmic power. Key test: Does scoring infrastructure *produce* new subjects (like the clinic) or merely *sort* them (administration)?  
     - *Tool*: Contrast Deleuze’s "societies of control" with Foucault—avoid stretching "discipline."  
     - *Leverage*: Frame education policy critiques (e.g., against predictive analytics in admissions).  

  3. **Conditionally Engage Q3 (Normative)**:  
     - Only if Q1/Q2 show Foucauldian tools *work* for contemporary power.  
     - *Path*: Ground normativity in *immanent contradictions* (e.g., algorithmic governance claims objectivity but entrenches bias).  

  ---

  ### **Why This Agenda Wins Your Years**  
  - **Avoids Archive Trap**: All work uses accessible sources (tech documentation, policy texts, institutional workflows).  
  - **Guards Against Scholasticism**: Q1 delivers immediate, testable claims about real systems; Q2 prevents "old wine in new bottles."  
  - **Maximizes Policy Impact**: Focus on knowledge institutions ensures relevance to academia/education design—your primary leverage points.  
  - **Kills Two Birds**: Resolving Q1 implicitly addresses your original debate: if institutions *have* shifted, Foucault’s framework must evolve; if not, retrospection suffices.  

  **Tactical Note**: If Q1 reveals minimal institutional shift, pivot to *historicizing* why algorithmic power is overhyped—a robust Foucauldian contribution requiring no new theory.
