prompt: |-
  I've been asked to sketch a two-year research agenda for a university public-policy center, and the hook is a mid-sized country thats currently loan-heavy and considering a move toward something like the German or Nordic tuition-free model. We keep going in circles on headline numbers — student debt in the US, graduate earnings premia in Denmark, whats spent per student in the UK — while the actual policy choice seems to hinge on stuff that is genuinely under-settled. If you had three or four studies to run in those two years, which open questions in the comparison between tuition-free systems (Germany and the Nordics) and loan-financed ones (the US and the UK) would you pick, and in what order? Give me a defended ordering, not a survey: state the criteria you're weighing (tractability with existing cross-country data, neglectedness, how many downstream design choices hinge on the answer), say how you'd trade them off, and tell me what would make you reshuffle the ranking. Also flag at least one question that looks important but you wouldnt fund because it would take too long or wouldnt change the actual decision. I especially want to know which questions are upstream of the others — for instance, is the risk-sharing property of income-contingent loans the crux, or does the enrollment and completion response to prices dominate, or is it something I'm not listing?
reasoning: |-
  Okay, the user is asking for help designing a research agenda for a university public-policy center focused on comparing tuition-free and loan-financed higher education systems. They're frustrated with superficial comparisons of headline numbers and want to identify genuinely unsettled questions that actually influence policy decisions. 

  Hmm, this is a sophisticated request - they clearly understand the policy landscape well. They're not just asking for random topics but want a prioritized, defended sequence based on specific criteria like tractability, neglectedness, and downstream impact. The mention of "upstream" questions suggests they grasp how some research questions logically precede others. 

  Let me unpack what they really need: First, they want to move beyond cherry-picked international stats (US debt vs Nordic spending) that don't reveal causal mechanisms. Second, they need research that informs an imminent policy decision for a specific mid-sized country. Third, they're hinting at meta-uncertainty - not knowing which uncertainties matter most (e.g., is it price elasticity? Loan design? Fiscal trade-offs?).

  *scratches head* The tricky part is balancing rigor with relevance. Randomized trials would be ideal but take too long. Cross-country comparisons are messy due to different labor markets and welfare systems. Maybe quasi-experimental approaches using policy changes in similar countries? 

  *starts mentally listing candidate questions* The enrollment-price relationship seems fundamental - if demand is inelastic, free tuition just wastes money. But that's been studied in the US; less so in comparable contexts. Then there's the completion angle - do financial pressures increase dropout rates? That's harder to measure. Loan design questions... oh god, the UK's shifting repayment thresholds are a natural experiment but the data's complex. 

  *checks watch* For prioritization, I should weigh: 1) How quickly could we answer it? 2) Would it change the policy decision? 3) Is the evidence gap real? The enrollment-price question wins on speed - we could use existing OECD data with difference-in-differences. Completion effects come second because they're policy-relevant but need longitudinal data. Loan design is third - important but technically gnarly. 

  *hesitates* Should flag that even perfect research won't answer everything. Like, we can't quickly study long-term fiscal sustainability - that requires decades of data. Also, cultural attitudes toward debt might matter as much as economics, but that's unquantifiable. 

  *double-checks* Did I miss upstream linkages? Yeah - you'd never study loan design before knowing if loans even deter enrollment. And completion rates affect graduate premiums which affect loan repayments... the dependencies map out logically. 

  *final thought* The user's smart to avoid "important but impossible" questions. No point studying generational mobility impacts when the policy window is two years. Stay pragmatic.
answer: |-
  Here’s a defensible 2-year research agenda prioritizing **upstream, policy-critical, and tractable** questions for your public-policy center, based on **neglectedness, tractability, downstream impact, and decision-sensitivity**. The focus is on generating actionable insights for a loan-heavy country considering a tuition-free shift.

  **Prioritization Criteria:**
  1.  **Neglectedness:** Understudied angles in *comparative* policy analysis.
  2.  **Tractability:** Feasible with existing cross-country data (OECD, Eurostat, national stats), quasi-experimental methods, or targeted surveys within 2 years.
  3.  **Downstream Impact:** How many subsequent design choices (e.g., eligibility, funding levels, loan terms) depend on this answer?
  4.  **Decision-Sensitivity:** Would different findings significantly alter the core choice *or* its implementation design?
  5.  **Upstream Nature:** Does this question logically constrain later analyses?

  **The Agenda (Order Defended):**

  1.  **Study #1: Enrollment & Completion Elasticity to Tuition Price in Mid-Income Contexts**
      *   **Question:** How sensitive are university enrollment *and* (critically) **completion rates** to tuition fees and living cost support *in countries with existing social safety nets but moderate household incomes* (similar to the target country)?
      *   **Why First & Most Critical (Upstream):**
          *   **Downstream Impact:** High. If enrollment/completion is highly price-sensitive (especially for low-income students), free tuition + grants becomes a powerful equity tool. If inelastic, the fiscal cost may outweigh benefits. This fundamentally alters the cost-benefit calculus.
          *   **Neglectedness:** Moderate-High. Extensive US/UK research exists, but applicability to countries with different income distributions, secondary education quality, and existing grants is limited. Few *direct* comparisons control for these factors vs. Nordics/Germany.
          *   **Tractability:** High. Use quasi-experimental designs: exploit *past tuition fee introductions/abolitions* in comparable European countries (e.g., Austria, parts of Germany pre-2014, UK increases) or variations in grant generosity. Leverage OECD/Eurostat microdata on enrollment, completion, SES, linked with fee/loan policy changes. Supplement with targeted surveys in similar countries.
          *   **Decision-Sensitivity:** Very High. A finding of high sensitivity strongly supports free tuition + living support for equity goals. Low sensitivity shifts the argument towards efficiency, loan sustainability, or alternative investments.
      *   **Output:** Quantified elasticity estimates for target demographics, fiscal cost projections for different free-tuition/grant scenarios.

  2.  **Study #2: The Completion & Labor Market Nexus: Does Debt Pressure Improve or Hinder Outcomes?**
      *   **Question:** In loan systems, does the financial pressure of debt (especially income-contingent loans - ICR) lead to faster degree completion and higher early-career earnings *or* does it increase dropout rates and push graduates towards suboptimal (higher-pay, lower-match) jobs? How do these effects differ by SES?
      *   **Why Second:**
          *   **Downstream Impact:** High. Crucial for evaluating the *efficiency* argument for loans. If debt pressure improves outcomes without excessive dropout, loans are more defensible. If it causes dropout or career distortion, it undermines loan benefits and favors free models.
          *   **Neglectedness:** High. Much debate, less robust comparative causal evidence. US studies face confounding factors (e.g., healthcare costs). Comparing ICR systems (UK, Australia) vs. tuition-free (Nordics/Germany) on *timely completion* and *early-career job match/satisfaction* controlling for field is rare.
          *   **Tractability:** Moderate-High. Requires longitudinal graduate survey data (e.g., EUROGRADUATE, national surveys) linked with administrative records on debt, enrollment duration, and early earnings. Diff-in-diff comparing similar fields/countries before/after loan term changes (e.g., UK repayment threshold adjustments) is feasible. Can combine with targeted employer/alumni surveys.
          *   **Decision-Sensitivity:** High. Impacts arguments about loan system efficiency vs. potential hidden costs. Informs design of potential *residual* loan elements (e.g., for living costs) if moving towards free tuition.
          *   **Link to #1:** Builds on price sensitivity (#1) by focusing on the *consequences* of financial pressure *during* study under loan systems.

  3.  **Study #3: Fiscal Sustainability & Efficiency: Cross-Subsidization vs. Direct Funding**
      *   **Question:** Comparing similar quality institutions, what is the net fiscal cost per graduate (including tax revenue foregone) under tuition-free (high direct subsidy) vs. ICR loan (high graduate contribution) systems? How efficiently is public money used in each model (administrative costs, targeting)?
      *   **Why Third:**
          *   **Downstream Impact:** High. Directly addresses the core fiscal/political constraint. Efficiency affects long-term viability.
          *   **Neglectedness:** Moderate. Aggregate spending data exists, but granular *cost-per-graduate* comparisons accounting for repayment rates, administrative overhead, and lifetime tax differentials are complex and less common. Efficiency analysis (e.g., admin cost % of total) is often system-specific.
          *   **Tractability:** Moderate. Requires access to detailed national accounts data on HE funding, loan agency costs, repayment flows, and tax data (challenging but feasible via OECD/partnerships). Standardised cost-per-graduate metrics need careful definition. Focus on comparable institutions/programs.
          *   **Decision-Sensitivity:** High for Implementation. Less likely to change the *core choice* than #1 or #2 (if equity/efficiency arguments are strong), but critically informs *how* to implement the chosen model (e.g., funding levels, repayment thresholds if loans remain for living costs, institutional efficiency drives).
          *   **Link to #1 & #2:** Cost-per-graduate depends heavily on completion rates (#1, #2) and repayment success (#2).

  4.  **Study #4: Risk-Sharing Properties & Public Perception of ICR Loans vs. Tax-Funded Free Tuition**
      *   **Question:** How effectively do ICR loans *actually* share risk (insure against low earnings) compared to the implicit risk-sharing of tax-funded free tuition? How do public perceptions of "debt burden" vs. "tax burden" differ, impacting political feasibility and student decision-making?
      *   **Why Fourth:**
          *   **Downstream Impact:** Medium-High for Design/Politics. Critical for designing fair loan terms *if* a loan component remains. Public perception is vital for sustainability.
          *   **Neglectedness:** High (especially perception). Theoretical risk-sharing of ICR is well-known; empirical analysis of *actual* repayment burdens across earnings distributions in diverse economies is less common. Comparative studies on public perception are scarce.
          *   **Tractability:** Moderate. Empirical risk-sharing: Analyze longitudinal earnings/repayment data across deciles (available in UK/AUS/Nordic tax/admin records). Perception: Requires original comparative surveys/focus groups in the target country *and* reference countries – feasible within 2 years.
          *   **Decision-Sensitivity:** Medium. Primarily informs the *design* of whichever system is chosen (e.g., setting ICR thresholds/write-offs, communicating the "tax-like" nature of ICR, messaging free tuition's funding source). Less likely to flip the core model choice than #1.
          *   **Link to #2 & #3:** Risk-sharing effectiveness depends on actual repayment burdens (#2) and the overall fiscal model (#3). Perception influences enrollment (#1) and long-term political support.

  **What Would Reshuffle the Ranking?**
  *   **Early Findings in #1:** If #1 finds *extreme* price sensitivity (especially for completion among target groups), it becomes overwhelmingly central, potentially elevating #2 even higher. If minimal sensitivity, #3 (fiscal/efficiency) becomes paramount.
  *   **Political Timetable:** If the decision point moves *closer*, prioritize #1 and #3 for immediate fiscal/equity impact. If delayed, #4 (perception) gains importance.
  *   **Data Access Breakthroughs:** If seamless access to linked graduate earnings/debt/completion data emerges, #2 could leapfrog to #1.
  *   **Emerging Crisis:** If the target country faces a sudden collapse in enrollments or graduate underemployment, #1 or #2 would gain urgency.

  **Important But Not Funded (Due to Time/Decision Impact):**
  *   **Question:** "What is the *long-term* (20-30 year) impact on economic growth, innovation, and intergenerational mobility of tuition-free vs. loan-financed systems?"
  *   **Why Exclude:**
      *   **Time:** Causally identifying these effects requires decades of data and controlling for countless confounding factors (global economic shifts, tech changes, other policies). Impossible within 2 years.
      *   **Decision Impact Unclear:** While philosophically important, the *direction* of this effect is highly contested theoretically, and specific findings for one country are unlikely to be definitive or directly transferable. The *immediate* fiscal, equity, and efficiency concerns (#1-#4) are far more pressing for the policy decision at hand. Politicians operate on shorter cycles.
      *   **Tractability:** Very Low for causal inference within timeframe.

  **Key Upstream Insight:** **Price Sensitivity (#1) is the fundamental crux.** It determines *who gets in and finishes*, shaping the entire equity argument and the effective cost base (#3). Loan system efficiency (#2) matters only if loans are used; their design (#4) matters only if they exist or are part of a hybrid. Fiscal sustainability (#3) depends critically on who enrolls/completes (#1, #2) and how the system is funded. Start with the core behavioral response to the price signal – it constrains everything else.
