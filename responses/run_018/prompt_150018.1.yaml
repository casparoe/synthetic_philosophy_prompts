  Potential pitfalls: Underestimating the steelman might alienate pro-PI members. Overcomplicating the memo could delay decisions. Need to emphasize that restricted access isn't endorsement but a "better safe than sorry" measure. Highlight that this kicks the can to a dedicated review, which is the board's job anyway.

