  Okay, the user wants a diagnosis of why the debate about whether Buddhist ethics is consequentialist is stuck. They've presented both sides clearly: one sees it as consequentialist because of the focus on reducing suffering impartially, while the other views it as virtue-based, centered on personal transformation. The user suspects the term "consequentialism" is ambiguous, covering multiple aspects like value, right action, and the agent's standpoint, and that Buddhist ethics might only align with some of these. Alternatively, maybe the problem is trying to force Buddhist ethics into a single Western category.

  First, I need to address their hypothesis. They think the impasse is due to unacknowledged equivocation in "consequentialism" and a substantive disagreement about which aspects are essential. I agree that the term's ambiguity is a key issue. Consequentialism isn't a monolithic concept; it involves value theory (what's good), criterion of right action (maximizing good), and agent-neutrality. Buddhist ethics emphasizes reducing suffering (value) but doesn't necessarily prioritize maximizing outcomes over individual virtue. The bodhisattva vow, for example, is about compassion but might not involve calculating aggregate happiness. 

  Then there's the deeper issue: is Buddhist ethics even a unified theory? The texts vary across traditions and time periods. Mahayana might lean more consequentialist, while Theravada focuses on personal liberation. Trying to fit all this under one Western label might be the root problem. The user mentions that each camp weighs different texts differently, which complicates things further. 

  Substantively, the disagreement is about what defines consequentialism. If one side thinks agent-neutrality is essential, but Buddhist ethics is agent-centered (focused on the practitioner's mind), that's a core conflict. Plus, the role of precepts—whether they're rules of thumb or inviolable vows—points to different ethical structures. 

  The user’s hypothesis seems correct but incomplete. The deeper structural issue is the attempt to categorize a diverse tradition into a Western framework. Progress would require acknowledging that "consequentialism" is too vague and that Buddhist ethics might be hybrid or sui generis. Clarifying terms and accepting that no single label fits could move the debate forward. Alternatively, they could shift focus from classification to understanding mechanisms, like how precepts function contextually. 

  So, the bottom line: the debate is stuck because of equivocation on "consequentialism" and an underlying incompatibility between Western categories and Buddhist ethics' pluralism. Progress means refining definitions and abandoning the expectation of a single label.
answer: |-
  **The debate is stalled because it conflates three distinct dimensions of ethical classification (value theory, criterion of right action, and agent standpoint) while ignoring the pluralism within Buddhist ethics, making "consequentialism" both equivocal and inadequate as a monolithic label.**  

  **Reasoning:**  
  1.  **Equivocation on "Consequentialism":** Your hypothesis is correct. The term bundles:  
      -   **Axiology:** *Suffering (dukkha) as the primary bad.* Buddhist ethics clearly supports this.  
      -   **Criterion of Right Action:** *Maximizing good/minimizing bad states of affairs.* This is contested. Bodhisattva ethics *appears* maximizing (save all beings), but core practice emphasizes *intention*, *non-attachment*, and *precepts as constraints* (e.g., paccekabuddha ideal, monastic rules rarely overridden for "greater good"). The bodhisattva vow is an expression of boundless compassion, not a utilitarian calculation.  
      -   **Agent-Neutrality:** *The value of states is agent-independently assessed.* While compassion is universal, the primary *locus of practice* is the agent's mind (eliminating defilements). The "good" achieved (nirvana) is inherently subjective/experiential, not an objective state like "total utility."  

  2.  **Substantive Disagreement on Essential Features:** The camps prioritize different dimensions:  
      -   Pro-consequentialists focus on the axiology and the *apparent* scope of concern (all beings) to infer a maximizing criterion.  
      -   Anti-consequentialists focus on the primacy of intention/mind-training and the role of precepts as constraints, arguing these negate maximization and agent-neutrality.  
      -   **This is substantive:** They disagree on which dimension(s) *define* consequentialism and which are most central to Buddhist ethics.  

  3.  **The Deeper Structural Problem: Pluralism and Category Error:** Your "deeper possibility" is crucial.  
      -   **Buddhist ethics isn't unitary:** Early texts (e.g., Pali Canon) emphasize personal liberation (virtue-focused). Mahāyāna emphasizes compassion for all beings (more consequentialist-leaning). Tantra introduces other paradigms. Treating it as one "theory" is flawed.  
      -   **Western labels are procrustean:** The drive to fit Buddhist ethics into *either* consequentialism *or* virtue ethics ignores its unique features: the non-theistic framework, karma as intention/result (not desert), nirvana as cessation (not eudaimonia), and the soteriological goal shaping ethics. It hybridizes elements both camps identify but resists reduction.  
      -   **Textual Weighting:** The "standoff" persists because proponents select evidence favoring their preferred dimension (Mahāyāna sutras vs. Vinaya/Abhidharma) without resolving the inherent tension *within* the tradition.  

  **Diagnosis:** The disagreement is **primarily substantive** (about which ethical features are definitional and most central to Buddhism) but **secondarily verbal** (due to unacknowledged equivocation on "consequentialism"). Crucially, it stems from an **ill-posed question**: "Is Buddhist ethics consequentialist?" assumes a monolithic Buddhist ethics and a monolithic consequentialism, both false.  

  **Progress Requires:**  
  1.  **Abandoning the Single-Label Quest:** Conclude that no one Western category (consequentialist, deontological, virtue) adequately captures Buddhist ethics. It is *sui generis* or a complex hybrid.  
  2.  **Disaggregating the Question:** Replace "Is it consequentialist?" with specific, separable questions:  
      -   *Does Buddhist axiology center solely on suffering/its cessation?* (Likely yes).  
      -   *Is the criterion of right action fundamentally about maximizing good aggregate states?* (Unlikely; intention/mind-state is primary, precepts often constrain).  
      -   *Is the moral standpoint purely agent-neutral?* (No; practice is agent-focused, even when motivation is universal).  
  3.  **Focusing on Mechanisms:** Shift debate to *how* diverse elements (compassion, precepts, intention, karma, nirvana) function together contextually, rather than forcing a top-down classification.  

  **Where Your Hypothesis Was Incomplete:** You correctly identified equivocation but underemphasized the *category error* inherent in applying a reductive Western label to a non-Western, soteriological, and internally diverse tradition. The pluralism and unique structure of Buddhist ethics are the deeper reasons the debate cycles.
