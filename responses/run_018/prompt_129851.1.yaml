prompt: |-
  I convene a postgraduate seminar on philosophy of science—around fourteen students, one ninety-minute session—where I want participants to feel, rather than merely discuss, why Popper’s falsifiability criterion struggles to serve as a demarcation tool once auxiliary hypotheses are permitted. Rather than opening with a lecture, I want them to discover the difficulty through a structured funding-allocation simulation I have provisionally called the Council of Auxiliary Hypotheses. Please design the full activity.

  Divide the cohort into four competing research programmes, each initially assigned one core claim and a set of observable predictions. Over three rounds, programmes present predictions; if a prediction fails, the group votes either to reject the programme or to allow it to propose an auxiliary adjustment that protects the core claim but alters future predictions. Introduce a scoring system—reputation points, not real money—that rewards correct predictions but also imposes a hidden cost on adjustments that are not independently testable within the remaining rounds. The rules should be arranged so that, in round one, participants enthusiastically defend failing programmes through clever auxiliaries; by round three, they should realise that the same defensive manoeuvre renders every programme unfalsifiable, yet that banning all adjustments eliminates genuinely progressive science. The facilitator should remain silent about falsificationism, the demarcation problem, or any named philosophers until the debrief.

  Provide: the exact rules, roles, and materials (cards, score sheets, or prompt scripts); a minute-by-minute timeline for the ninety minutes; instructions for how the facilitator should intervene if a group collapses into unanimous rejection or unanimous permissiveness; and a debrief that maps each round onto the logical structure of the demarcation challenge—specifically, the tension between naive falsification and the protection of theories via untestable auxiliaries—without naming those positions until participants have articulated the difficulty themselves. Be frank about what the simulation cannot reproduce: for example, the historical sociology of actual scientific communities, or the distinction between ad hoc and independently motivated auxiliaries, which the facilitator must supply verbally afterwards. Write the response in British English, and do not include bibliographies, reading lists, or citations, as the exercise must be entirely self-contained.
reasoning: |-
  Hmm, the user wants me to design a full activity for a postgraduate philosophy of science seminar. They're looking for a simulation called the "Council of Auxiliary Hypotheses" to help students experience the challenges with Popper's falsifiability criterion when auxiliary hypotheses come into play. 

  The user has quite specific requirements: dividing 14 students into four research programs, running three rounds where programs make predictions that might fail, and having groups vote on whether to reject a program or allow auxiliary adjustments. There needs to be a scoring system with reputation points that secretly penalizes untestable adjustments. The goal is for students to start enthusiastically defending failing programs with auxiliaries in round one, but by round three realize this makes everything unfalsifiable while also seeing that banning all adjustments hinders good science.

  I need to provide everything they asked for: exact rules, roles, materials, a 90-minute timeline, facilitator intervention strategies, and a debrief that connects the experience to the demarcation challenge without naming philosophical positions until the end. I should also note what the simulation can't capture, like historical sociology or distinctions between types of auxiliaries.

  For the research programs, I'll create four with clear core claims and testable predictions - something like astrology, humoral medicine, phrenology, and alchemy. Each needs initial predictions and a way to handle failures through auxiliaries. The scoring system should reward correct predictions but impose costs for untestable adjustments, which I'll implement through "Research Funds" that are secretly reduced when auxiliaries lack testability.

  The timeline needs to be tight: 10 minutes for setup, 15 for round one, 15 for round two, 20 for round three (since complexity increases), and 30 minutes for debrief. For materials, I'll design simple program cards, prediction cards, auxiliary proposal forms, and score sheets. 

  Facilitator intervention is crucial - if groups become too rejecting or too permissive, I'll suggest techniques like introducing new phenomena or questioning testability. The debrief must guide students to articulate the tension themselves before introducing Popper and the demarcation problem.

  I'll also be frank about limitations: this simplifies real science, ignores sociological factors, and doesn't distinguish between ad hoc and motivated auxiliaries - those will need verbal explanation afterward. Everything should be in British English as requested, with no citations since the exercise must stand alone.
answer: |-
  Here is the full design for "Council of Auxiliary Hypotheses" in British English, adhering strictly to your specifications:

  **Activity Goal:** Participants experience the tension between protecting promising research programmes via auxiliary hypotheses and the consequent erosion of falsifiability as a demarcation criterion.

  **Core Simulation Limitations (To Be Explicitly Stated in Debrief):**
  1.  **Does not model:** Historical context, sociological pressures, funding realities, or non-rational factors in real science.
  2.  **Does not distinguish:** Between "ad hoc" (merely defensive) and independently motivated/well-supported auxiliary hypotheses. This crucial distinction must be explained verbally by the facilitator *after* the simulation debriefs the core tension.
  3.  **Simplifies:** Falsification to single, decisive tests; ignores probabilistic predictions or measurement error.
  4.  **Represents:** Auxiliary hypotheses as immediate, discrete adjustments rather than complex, evolving background knowledge.

  **Participants:** 14 Postgraduate Students.
  **Groups:** Four competing Research Programmes (RPs) of 3-4 students each. One Facilitator.
  **Duration:** 90 Minutes Total.

  **Materials (Pre-prepared by Facilitator):**
  1.  **Four Programme Cards (A4):** One per RP. States the **Core Claim (CC)** and **Initial Set of Observable Predictions (P1-P3)**.
  2.  **Prediction Test Cards (Small Slips):** Pre-written observable phenomena for each round (Facilitator holds these).
  3.  **Auxiliary Hypothesis Proposal Forms (Small Slips):** Blank slips for groups to write their proposed auxiliary + revised prediction.
  4.  **Scoreboard (Whiteboard/Flipchart):** Columns: RP Name, Round 1 Score, Round 2 Score, Round 3 Score, Total Reputation (Σ). Rows: Astrology, Humours, Phrenology, Alchemy. Start all at 0.
  5.  **RP Score Trackers (Small Cards):** One per RP. Lists their CC and has space to record their *own* Reputation Points (RP) total (groups know their own score only).
  6.  **Facilitator Script:** Key prompts, test outcomes, and intervention notes.

  ---

  **Assigned Research Programmes (Examples):**
  1.  **RP Astrology:** *Core Claim (CC):* Celestial body positions at birth determine personality & life events. *Initial Predictions:* P1: People born under Mars-ruled signs (Aries/Scorpio) will show higher aggression scores. P2: Mercury retrograde periods correlate with significant tech/communication failures. P3: Synastry charts predict romantic compatibility with 70% accuracy.
  2.  **RP Humours:** *CC:* Health is governed by balance of four bodily humours (Blood, Phlegm, Black Bile, Yellow Bile). *Initial Predictions:* P1: Bloodletting alleviates symptoms of fever (excess Blood). P2: Phlegmatic individuals will prefer sedentary occupations. P3: Prevalence of Black Bile humour correlates with melancholic depression diagnosis.
  3.  **RP Phrenology:** *CC:* Personality traits are localised in specific brain organs, reflected in skull topography. *Initial Predictions:* P1: Skull measurements at the "Acquisitiveness" organ correlate with career success in finance. P2: "Benevolence" organ prominence predicts volunteering frequency. P3: "Destructiveness" organ size correlates with violent crime rates.
  4.  **RP Alchemy:** *CC:* Base metals can be transmuted into gold via the Philosopher's Stone. *Initial Predictions:* P1: Specific mercury-sulphur compounds exposed to celestial alignments show increased gold traces. P2: Purified "Quintessence" accelerates plant growth. P3: Lead treated with a prima materia catalyst loses weight (signifying transformation).

  ---

  **Rules of the Council:**
  1.  **Rounds:** Three rounds of prediction testing. Each round focuses on *one specific prediction* per RP.
  2.  **Presenting Predictions:** Each RP states their designated prediction for the round to the Council (whole class).
  3.  **The Test:** The Facilitator reveals a pre-written "Test Outcome" card for *that specific prediction*. Outcomes are binary: **Confirmed (✓)** or **Falsified (✗)**. *(No probabilistic outcomes; outcomes are arbitrary but plausible fails for initial predictions).*
  4.  **Scoring (Reputation Points - RP):**
      *   ✓ Confirmed Prediction: +10 RP for that RP.
      *   ✗ Falsified Prediction: -5 RP for that RP.
      *   **Hidden Cost:** If a RP proposes an Auxiliary Hypothesis (AH) *and it is accepted* by the Council, they incur a **-15 RP "Cost of Defence"**. This cost is *hidden* until the final scoring reveal. It represents the reputational risk/cost of complexifying the theory without immediate, independent gain. *(This is the key mechanism to penalise untestable adjustments within the game timeframe).*
  5.  **Response to Falsification (✗):**
      1.  The Council (all students, *including* members of the challenged RP) votes: **Reject Programme (R)** or **Permit Auxiliary Hypothesis (AH)**.
      2.  **Reject (R):** The RP is eliminated. No further predictions or adjustments. Loses points only from falsification (-5 RP).
      3.  **Permit AH (AH):** The falsified RP has 3 minutes to propose:
          *   **a)** A specific Auxiliary Hypothesis (AH) protecting their CC.
          *   **b)** A *revised, testable prediction* for the *next round* (or a retest if possible).
          *   *(They write this on an AH Proposal Form and read it aloud).*
      4.  The Facilitator *silently judges* if the revised prediction is **Testable** within the remaining rounds (i.e., observable, specific, timely). If deemed *untestable*, the AH is rejected, and the RP is eliminated (as if voted R). If testable, the AH is accepted, the revised prediction becomes their prediction for the next round, and the hidden cost (-15 RP) is applied.
  6.  **Winning:** The RP with the highest *Total Reputation Points (RP)* at the end wins "Funding Prestige". Emphasise it's about *reputation*, not truth.

  ---

  **90-Minute Timeline:**

  *   **(0-10 mins) Setup & Rules:**
      *   Divide students into 4 RPs (3 groups of 3, one of 4). Assign RP Cards.
      *   Distribute RP Score Trackers (remind them scores are semi-private).
      *   Explain Rules (5 mins): Focus on core loop (Predict -> Test -> Vote R/AH -> Adjust if AH accepted -> Score). Explain scoring for ✓/✗. *Crucially:* Explain the AH process clearly (propose AH + revised prediction). *Do NOT mention the hidden cost (-15 RP) or the testability judgement.* Simply state: "The Council votes AH or R. If AH is voted, the group proposes an adjustment. The Facilitator ensures the new prediction is suitable for testing in a future round." Briefly explain winning condition (Highest RP).
      *   State: "You are advocates for your research programme. Your goal is to secure its funding future by maximising its reputation through successful predictions and persuasive defence."
  *   **(10-25 mins) Round 1:**
      *   Each RP states Prediction 1 (from card). Facilitator reads Test Outcome for each (Pre-set: **All 4 RPs get ✗**). *e.g., "Aggression scores show no Mars-sign link"; "Bloodletting patients show no improvement vs control"; "Finance skull measurements show random distribution"; "Mercury-sulphur compound analysis shows zero gold traces."*
      *   **Vote 1:** After *each* falsification, Council votes R or AH for that specific RP. *(Expect enthusiasm for AH - groups defend their own, others are curious/permissive).*
      *   **AH Proposals:** Any RP voted AH proposes adjustment + new prediction (P2 Revised). Facilitator *silently* judges testability (should be easy to accept in R1). Groups write new prediction on tracker.
      *   Facilitator records public ✓/✗ scores on Scoreboard (+10 or -5 per RP). *Does NOT reveal hidden costs or update AH groups' trackers yet.*
  *   **(25-40 mins) Round 2:**
      *   Each RP states their *current* prediction (Original P2 for non-falsified/falsified-but-not-adjusted in R1? But R1 setup ensures all falsified. So: Original P2 for any RP eliminated in R1? But R1 setup has all falsified and likely all saved by AH. Therefore: RPs state their *revised* prediction from R1 AH, or original P2 if somehow not falsified/adjusted in R1 - though scenario aims for adjustment). Facilitator reads Test Outcomes (Pre-set: **All 4 RPs get ✗ again**). *e.g., "Tech failure rates during Mercury retrograde match background rates"; "Phlegmatic individuals found in active jobs at expected rates"; "Volunteering frequency unrelated to 'Benevolence' bumps"; "Quintessence shows no effect on plant growth."*
      *   **Vote 2:** Council votes R or AH for each falsified RP. *(Likely continued defence, but some hesitation might appear).*
      *   **AH Proposals:** Any RP voted AH proposes *another* AH + new prediction (P3 Revised). Facilitator judges testability (may become harder; might need to reject one if clearly untestable, but ideally accept all with a slight frown). Groups update prediction.
      *   Facilitator updates public ✓/✗ scores on Scoreboard. Records hidden -15 RP for any group proposing an AH *this round* (R2) *and last round* (R1) on their hidden ledger. *Still does not reveal hidden costs to groups.*
  *   **(40-60 mins) Round 3:**
      *   RPs state their *current* prediction (Revised P2 from R1 AH, or Revised P3 from R2 AH). Facilitator reads Test Outcomes (Pre-set: **All 4 RPs get ✗ again**). *e.g., "Synastry chart accuracy = random chance"; "Melancholy diagnosis shows no black bile correlation"; "Violent crime rates unrelated to 'Destructiveness' size"; "Lead weight unchanged after catalyst treatment."*
      *   **Vote 3:** Council votes R or AH for each falsified RP. *(Tension peaks. Groups may struggle to propose plausible *testable* predictions. Council members likely express frustration: "This could go on forever!", "Nothing ever gets rejected!", "But their core idea might still be right!").*
      *   **AH Proposals:** Any RP voted AH attempts a final AH + prediction. Facilitator *strictly* judges testability within the *now zero* remaining rounds. Reject any proposal (stating: "This revised prediction cannot be feasibly tested within the Council's remaining timeframe"). Rejected RPs are eliminated. Accept only if a prediction is miraculously testable *immediately* (unlikely).
      *   Facilitator updates public ✓/✗ scores on Scoreboard. Records hidden -15 RP for any group proposing an AH *this round* (R3) and previously.
  *   **(60-75 mins) Scoring Reveal & Tension Articulation:**
      *   Facilitator reveals the **hidden rule:** "Each time your programme was permitted to propose an Auxiliary Hypothesis to defend its core claim, it incurred a Reputation Cost of -15 points. This represents the investment and potential loss of credibility involved in modifying your theory without independent confirmation." Add these costs to the public Scoreboard and announce Final Totals. Declare a winner based on RP.
      *   **Facilitator Prompts (Guided Reflection - NO JARGON):**
          *   "Look at the final scores. What impact did the adjustments have?" (Costs sunk reputation).
          *   "How did the Council's willingness to permit adjustments change over the three rounds? Why?" (Enthusiasm to frustration/perplexity).
          *   "At what point did defending a programme start to feel problematic? What felt wrong about it?" (Leads towards "untestable", "endless", "protecting core at all costs").
          *   "What was the consequence of *not* permitting adjustments after a failed prediction?" (Leads towards "premature rejection", "good ideas lost", "no chance to improve").
          *   "What dilemma did the Council face by the final round?" (Crucially, wait for participants to articulate versions of: "We couldn't falsify anything definitively because adjustments were always possible, BUT banning all adjustments felt like it would kill off potentially good science too early").
  *   **(75-90 mins) Debrief & Conceptual Mapping:**
      *   Once participants have articulated the core tension (Protection vs. Falsifiability), label it:
          *   "What you've experienced is the heart of a major challenge in the philosophy of science: the **Demarcation Problem** – how to distinguish science from non-science."
          *   "In Round 1, you instinctively acted like **naive falsificationists**: a single failed prediction *should* falsify the theory. But you quickly realised theories aren't tested in isolation; they rely on background assumptions – **auxiliary hypotheses**."
          *   "Your clever adjustments in Rounds 1 & 2 mirror how scientists protect promising cores. But by Round 3, you saw the danger: if *any* failure can be explained away by adjusting auxiliaries, **nothing is ever truly falsifiable**. The core claim becomes unfalsifiable dogma."
          *   "The Reputation Cost represented the scientific community's intuitive distrust of adjustments that *only* save the theory without leading to new, testable predictions (**independently testable auxiliaries**) within a reasonable timeframe. This is often called an *ad hoc* adjustment."
          *   "The tension you felt – between needing to protect promising ideas from premature rejection and needing to discard degenerating programmes – is real. **Karl Popper's** proposed solution, **falsifiability**, struggles precisely because of this role of auxiliary hypotheses, as you've vividly discovered."
      *   **Acknowledge Limitations:** "Remember, this simulation is a vast simplification. Real science involves complex background knowledge, not single auxiliaries. Crucially, scientists often propose auxiliaries *motivated* by other evidence or theories, not just defensively (*ad hoc*). Judging whether an adjustment is 'good' or 'bad' is immensely complex and contextual – it's not just about immediate testability within 3 rounds. This simulation aimed only to make you *feel* the core logical tension Popper faced."

  ---

  **Facilitator Intervention Strategies:**

  *   **Unanimous Rejection (Early Round):** Unlikely given setup, but if a group is voted R in R1/R2:
      *   "The Council has spoken. [RP Name] is eliminated. Record your final score." (Stay neutral).
      *   *Optionally:* Introduce a minor new "funding opportunity" later (e.g., a bonus RP question open to all) if an eliminated group seems disengaged, but don't resurrect them.
  *   **Unanimous Permissiveness (Stubborn Defence):** Likely in R1/R2, problematic if persists in R3.
      *   **R1/R2:** Allow it. The hidden cost and R3 falsifications will create the tension.
      *   **R3:** If Council votes AH for a clearly failing RP:
          *   **Challenge the Proposal:** "Council, the [RP Name] proposes [Repeat AH & Revised Prediction]. Can this *specific* prediction be tested *now*, before we adjourn? How? What would a clear pass/fail look like *today*?" Push for concrete, immediate observability.
          *   **Invoke Cost:** "Remember, each adjustment carries a reputational cost. Is investing further in this defence warranted given the track record?"
          *   **Force Testability Judgement:** If the revised prediction is vague or long-term, reject it: "The Council lacks the means to test '[Revised Prediction]' within this session. The proposal is rejected due to untestability." (Invokes the rule silently used before).
  *   **Group Inaction/Confusion:** Provide clear, repeated prompts. Restate the vote options (R or AH). Restate the AH requirements (Protect Core + New Testable Prediction). Use countdowns for AH proposal time (3 mins).

  This design forces the experiential discovery of the tension, uses the hidden cost to model the "degenerating programme" intuition, and provides a clear path for the facilitator to map the experience onto the philosophical problem without front-loading theory. The arbitrary outcomes and simplified programmes focus attention solely on the logical structure of testing with auxiliaries.
