  ## Bradley's Regress: Unity in Facts vs. Propositions

  Bradley's regress is a powerful argument challenging any attempt to analyze complex unities into distinct constituent parts plus a relation binding them. The core dilemma is this: if a complex whole (like a fact or a proposition) is composed of distinct constituents held together by a relation (like instantiation or predication), what relates *that* relation to the constituents? Invoking a further relation to bind the first relation leads to an infinite, vicious regress. This regress is deployed against two primary targets: the ontological unity of **facts** (states of affairs) and the semantic unity of **propositions** (structured truth-bearers). While superficially similar, these deployments exert distinct pressures on their respective targets, and the regress proves ultimately more damaging against structured propositions.

  **Deployment 1: Against the Unity of Facts**
  *   **Target:** The ontological structure of a state of affairs (e.g., Socrates-being-wise, `a`-being-`F`). The analysis posits constituents: a particular (`a`), a universal (`F`), and an instantiation relation (`R`).
  *   **The Regress:** What unites `a`, `F`, and `R` into the single fact `a is F`? If we need a further relation `R2` to relate `a` to `R` and `R` to `F`, then what relates `a`, `F`, `R`, and `R2`? We quickly face an infinite regress of relations (`R3`, `R4`, ...) failing to achieve genuine unity.
  *   **Pressure Exerted:** The regress challenges the very possibility of *complex entities* existing as genuine unities within the world if they are mereologically composite. It threatens the coherence of truthmaking: if the fact `a is F` is supposed to make the proposition <a is F> true, but the fact itself lacks intrinsic unity, its ability to serve as a truthmaker is undermined. It pressures us to see facts as irreducible primitives or to abandon facts as structured complexes altogether (e.g., embracing a world of only particulars or only bundles).

  **Deployment 2: Against the Unity of Propositions**
  *   **Target:** The semantic structure of a proposition (e.g., the proposition <Socrates is wise>, <a is F>). The analysis posits constituents: an object or concept for the subject (`a`), a concept or property for the predicate (`F`), and a predicative relation (`P`) binding them.
  *   **The Regress:** What unites `a`, `F`, and `P` into the single, unified proposition <a is F>? If we need a further relation `P2` to relate `a` to `P` and `P` to `F`, then the same regress (`P3`, `P4`, ...) ensues. The result is an aggregate of constituents, not a proposition capable of being true or false *as a whole*. A mere list `(a, F, P)` doesn't assert anything; unity is essential for truth-evaluability.
  *   **Pressure Exerted:** The regress challenges the possibility of *meaningful representation* and *truth-evaluability*. Without intrinsic unity, a proposition cannot function as a bearer of truth value because it lacks the essential "grip" between its components that allows it to represent a specific state of affairs. This pressures us to see propositions as irreducible primitives or to abandon structured propositions (e.g., embracing sententialism, possible worlds, or unstructured sets as truth-bearers).

  **Comparison: One Problem or Two?**
  While both deployments share the same *logical structure* – the infinite regress arising from the need to relate a relation to its relata – they target fundamentally different things and exert distinct pressures:
  1.  **Target Difference:** Facts are (putative) *ontological* entities in the world; propositions are *semantic* entities representing the world. The unity of facts concerns how reality is structured; the unity of propositions concerns how thought and language represent that structure.
  2.  **Pressure Difference:** The pressure on facts concerns *existence* and *truthmaking* – can a complex state of affairs genuinely exist as one thing? The pressure on propositions concerns *representation* and *truth-evaluability* – can a complex *representation* genuinely represent one specific state of affairs and be true/false as a whole?
  3.  **Primitivist Evasion:** Both targets can attempt to evade the regress by taking their respective unities as primitive and non-mereological.
      *   **Facts as Primitive (e.g., Armstrong):** One can hold that facts (`a's being F`) are fundamental ontological units. Their constituents (`a`, `F`) are abstractions *from* the fact, not prior components assembled by a relation. The fact's unity is basic and unanalyzable. This move *can* be viable for facts. While it sacrifices a certain kind of metaphysical analysis, it preserves the fact's role as a truthmaker. The world just *is* a world of facts (or states of affairs), and their unity isn't further decomposable. This avoids the regress by refusing to analyze the fact's composition in the problematic way.
      *   **Propositions as Primitive (e.g., Fregean Thoughts, Russellian Propositions as Objects):** One can hold that propositions are simple, unstructured entities. Their representational content is intrinsic or grasped directly, not built from prior constituents. This also avoids the regress by refusing structure. **However, this move is significantly weaker** for propositions. While it secures unity and truth-evaluability, it utterly sacrifices *explanatory power* regarding representation. How does this primitive entity represent *exactly* `a` being `F`, rather than `b` being `G` or `F` being instantiated by `a`? Structured propositions promised to explain representation via constituent structure – `a` represents the object, `F` represents the property, `P` represents instantiation. Taking the proposition as primitive makes representation utterly mysterious and opaque. It struggles to account for the systematicity and productivity of thought and language – why understanding <a is F> and <b is G> enables understanding <a is G>, if propositions lack shared constituents.

  **Which Deployment is More Damaging?**
  Bradley's regress is **ultimately more damaging when deployed against the unity of propositions.**

  1.  **The Evasion Cost:** While both targets can take their unities as primitive to escape the regress, the cost is vastly higher for propositions. For facts, primitivism sacrifices a certain *metaphysical analysis* but preserves their core ontological function (being truthmakers) relatively intact. For propositions, primitivism sacrifices the very *explanation of representation* – the core function propositions are meant to serve. A primitive proposition is just a mysterious truth-value bearer; it lacks the internal structure needed to explain *how* or *why* it represents what it does.
  2.  **The Demand for Structure:** Representation seems inherently structured. We represent the world *as* having objects instantiating properties and standing in relations. Structured propositions provide the most natural and powerful explanation for this. The regress shows that building this structure from distinct constituents plus a relation is problematic, but the alternative (primitivism) seems explanatorily vacuous for semantics. Facts, however, don't *need* to explain representation; they just need to exist and make propositions true. Their internal structure, while philosophically interesting, may be less essential to their primary function than the internal structure is to a proposition's function of representing.
  3.  **The Threat to Truth-Evaluability:** The regress directly undermines the very possibility of a proposition being true or false *as a whole*. If the constituents aren't genuinely unified, we don't have a single entity capable of being assessed for truth – we just have a list. While the regress threatens the existence of complex facts, it doesn't necessarily threaten the truth *of the proposition* they are meant to make true in the same fundamental way. We could perhaps still have true propositions *about* aggregates, but they wouldn't be propositions *with* the problematic structure. The regress against propositions strikes at the heart of what a proposition *is*.

  **Conclusion**
  Bradley's regress exposes a profound difficulty in accounting for complex unities. Its deployment against facts challenges the coherence of structured ontological complexes but allows a viable escape route: taking facts as primitive unities. This preserves their truthmaking function, albeit at the cost of metaphysical analysis. Its deployment against propositions, however, strikes deeper. While propositions can also evade the regress via primitivism, this evasion cripples their core function: explaining representational content. Sacrificing structure renders representation inexplicable and undermines the systematic nature of thought and language. The regress against propositions demonstrates that the very conditions required for a structured entity to be a truth-evaluable representation – its internal unity – are threatened by the attempt to analyze that structure. Therefore, while both deployments are potent, the regress against the unity of propositions is ultimately more damaging because it directly undermines the explanatory power and essential function of its target in a way that the evasion for facts does not. The pressure on representation proves harder to withstand than the pressure on ontological composition.
