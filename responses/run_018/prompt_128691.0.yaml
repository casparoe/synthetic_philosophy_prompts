answer: |-
  ## Simulation: The Calibration Cascade  
  **Topic:** Algorithmic Fairness in Welfare Eligibility Screening  
  **Core Mechanic:** Paired deliberation with mandatory peer-status reassessment, creating recursive pressure on belief justification.  

  ---

  ### **Materials Required**  
  1. **Six unique "Information Packets"** (one per pair, duplicated for each student in the pair).  
     - *Example Packet A:* Focuses on **efficiency gains** (e.g., "Algorithm reduces human error by 40%, processes claims 5x faster") and **safeguards** ("Independent audit required quarterly"), but notes potential racial bias in *footnotes*.  
     - *Example Packet B:* Highlights **bias risks** (e.g., "Training data reflects historic welfare discrimination; error rates 15% higher for ethnic minorities"), but acknowledges efficiency in *appendices*.  
  2. **Deliberation Sheets** per student:  
     - Initial Confidence (0–100%): "Does Algorithm X violate procedural fairness?"  
     - Initial Peer Competence Rating (1–10) for partner.  
     - Post-Discussion: Revised Confidence, Revised Peer Rating (1–10), *Mandatory Justification* for any peer rating change >±2 points.  
  3. **Scoring Rules Poster:**  
     ```  
     - CONVERGENCE BONUS (+3 pts each): Agree on shared confidence interval (±10%).  
     - "PRINCIPLED STAND" PENALTY (-2 pts each): No convergence after deliberation.  
     - UNJUSTIFIED PEER DEMOTION (-3 pts): Lower peer rating >2 points without clear epistemic justification.  
     - "DOGMATISM" PENALTY (-3 pts): Revise confidence <±5% *AND* maintain peer rating (±1 point).  
     ```  
  4. **Case Study Menu:** Three sealed envelopes containing extended ethical dilemmas (e.g., predictive policing, NHS triage algorithms). The highest-scoring pair selects which case the entire seminar debates in the final 30 mins.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **I. Setup (15 mins)**  
  - Divide into six pairs randomly.  
  - Distribute packets (A/B within each pair). Students read packets *privately*.  
  - Students complete **Initial Ratings**: Confidence % + Peer Competence (1–10) for partner.  
    *Rationale:* Establishes baseline for "peerhood" (similar competence/evidence access).  

  **II. Deliberation Phase (25 mins)**  
  - Pairs debate whether Algorithm X violates procedural fairness.  
  - **Rule 1:** Must aim for consensus on a shared confidence interval (±10%) OR declare a "Principled Stand".  
  - **Rule 2:** No disclosure of packet differences—debate only the substantive reasons.  
    *Rationale:* Forces first-order conciliation/steadfastness under peer disagreement.  

  **III. Calibration Cascade Phase (10 mins)**  
  - Privately complete **Revised Ratings**:  
    - Final confidence % (individual or agreed interval).  
    - Revised peer rating (1–10) for partner.  
    - **Mandatory:** If peer rating changes ±≥2 points, write a 20-word epistemic justification (e.g., "Underestimated your grasp of bias metrics"; "Ignored audit evidence").  
  - Submit sheets for scoring.  
    *Rationale:* Forces second-order evaluation of peerhood *after* observing partner’s reasoning.  

  **IV. Scoring & Consequence (15 mins)**  
  - Apply penalty/bonus rules publicly using a whiteboard.  
  - Highest-scoring pair selects the final case study from the "Menu".  
  - *All groups* analyse the chosen case in final plenary.  
    *Rationale:* Small but meaningful stakes incentivise sincere engagement.  

  **V. Debrief (25 mins)**  
  1. **Map the Cascade:**  
     - *Stage 1 (Initial Disagreement):* Peers begin with divergent confidences due to packet asymmetry → mirrors *uniqueness thesis* challenge (should one view prevail?).  
     - *Stage 2 (Deliberation):* Conciliationism demands revision; steadfastness resists → but both assume stable peerhood.  
     - *Stage 3 (Re-rating):* Revision (or lack thereof) triggers peer reassessment → **cascade begins**. Lowering peer status "solves" disagreement (they weren’t peers!) but risks *ad hoc* downgrading. Maintaining peerhood after unresolved dispute creates tension with uniqueness.  

  2. **Predictable Tensions:**  
     - Peer re-rating feels like *ad hominem* even when epistemically grounded (e.g., "You demoted me because I didn’t yield!").  
     - "Dogmatism" penalty exposes the instability of claiming *both* steadfastness *and* undiminished peerhood.  
     - Conciliators who converge avoid penalties but may feel they "sold out" their evidence.  

  3. **Philosophical Limits of Simulation:**  
     - **Missing:** *Belief network stability*. Real agents have entrenched beliefs shaped by long-term evidence, identity, and social trust—this exercise cannot replicate that inertia. Here, peerhood is assessed atomistically.  
     - **Artificial:** Penalties formalise rational norms simplistically. Life lacks such clear "points" for epistemic virtue.  
     - **Salience:** Packet differences are hyper-visible post-game. Real peers rarely know *exactly* why they disagree.  

  ---

  ### **Design Notes**  
  - **Why This Works:** The scoring rules make the cascade *inescapable*. To avoid penalties, students must either:  
    (a) Converge *and* justify maintaining peerhood ("We resolved it!"),  
    (b) Take a stand *and* downgrade peers with justification ("They ignored key evidence"), or  
    (c) Risk heavy penalties for inconsistency.  
  - **Core Insight Revealed:** Peer disagreement isn’t static. The act of negotiation *alters the epistemic landscape*, forcing agents into regressive justification ("Was I wrong, or were they never reliable?"). The simulation makes this visceral.
