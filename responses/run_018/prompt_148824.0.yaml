prompt: |-
  I'm serving as a senior advisor to the Scientific Funding Renewal Panel at the Institute for Longitudinal Health Research. The panel must decide whether to approve Phase-IV funding for the Cohort Interaction Study (CIS), which has run continuously since 1994. The study's core Bayesian predictive model was calibrated in 1995 using baseline demographic and environmental priors and was never revised thereafter. In 2023, the study observed—without any post-hoc parameter adjustment—the precise interaction effect between two specified exposure variables that the 1995 architecture had projected. The research team argues that this multi-decade predictive success provides strong, independent confirmatory support warranting renewal. A dissenting panel member contends that, because the 2023 outcomes fall within the range the original prior was already structured to accommodate, they amount to old evidence in the technical Bayesian sense: they should not yield a substantial posterior update and therefore should not count as novel evidential support. There is an additional conceptual complication: CIS possesses a genuinely pre-registered, unrevised predictive architecture spanning nearly three decades, which raises the question of whether evidential depreciation applies differently to long-horizon predictive confirmations than to static, one-time retrodictive fits. Draft a concise, formal memo recommending either renewal or denial. The memo should present clear, actionable criteria the panel can apply; explain how the problem of old evidence bears on the evidential weight of the 2023 results, carefully distinguishing predictive novelty from retrodictive coherence; address the strongest argument on the opposing side—specifically, that sustained, unrevised predictive accuracy over time is qualitatively different from post-hoc accommodation; and rely solely on conceptual reasoning, with no bibliographic citations, reading lists, or appeals to authority.
reasoning: |-
  We are addressing a funding renewal for a longitudinal study (CIS) based on a Bayesian model calibrated in 1995 and never revised. The key event is that in 2023, the model predicted an interaction effect between two exposure variables that was then observed without any parameter adjustment. The team argues this is strong independent confirmation. A dissenting member argues that because the 2023 outcome was within the range the prior was structured to accommodate, it is "old evidence" and should not substantially update the posterior.

  Key concepts:
  1. **Old Evidence Problem (in Bayesian terms)**: If evidence E was already known when the model was built, then P(E|M) (the likelihood of E given the model M) is 1, and the evidence does not update the posterior probability of M. However, in this case, the evidence (the 2023 observation) was not known in 1995. Therefore, it is not old evidence in the strict sense.

  2. **Predictive Success vs. Retrodictive Fit**: 
     - Retrodictive fit: When a model is built to explain existing data (e.g., the 1995 model was calibrated on baseline data). This does not provide strong evidence for the model because it could be overfitted.
     - Predictive success: When a model makes a prediction about future data (the 2023 observation) and that prediction is confirmed. This is considered stronger evidence because the model was not adjusted to fit that new data.

  3. **Long-Horizon Predictive Confirmation**: The fact that the model made a prediction 28 years in advance and it was observed without any revision is a remarkable achievement. This is qualitatively different from post-hoc accommodation because the model was fixed in 1995 and the prediction was made in advance.

  The dissenting argument is that the 2023 outcome falls within the original prior's range. However, note that the model was built with a prior and then updated in 1995 to form a posterior (which became the model for prediction). The 2023 prediction was based on the 1995 model. The fact that the outcome was within the prior's range does not diminish the predictive success because:
     - The prior is typically broad, and the fact that the model made a specific prediction (an interaction effect) that was observed is noteworthy.
     - The prior was set in 1995 and the evidence was not known then, so the likelihood P(E|M) is not 1 at the time of model building. Therefore, the evidence should update our belief in the model.

  However, we must consider: if the prior was so broad that the observed outcome was almost certain to occur (i.e., the prior probability of E was very high), then the evidence would not be surprising and would not provide strong support. But the dissent does not argue that the prior was too broad, only that the outcome was within the prior's range. The key is the precision of the prediction: if the model made a precise prediction (e.g., a specific interaction effect) and it was observed, that is strong evidence even if the prior was broad, because the likelihood of that precise outcome under the model is high relative to alternative models.

  Additionally, the longitudinal aspect: the model has been making predictions over time and has been consistently accurate? The memo does not say that, but the 2023 event is a specific, projected interaction effect. The fact that the model was never revised and has now made a successful long-term prediction is a strong point.

  Actionable Criteria for the Panel:

  1. **Novelty of the Evidence**: Evidence that was not used in the construction or calibration of the model and that was not known at the time of model building should be considered as novel and capable of updating the model's credibility.

  2. **Predictive vs. Retrodictive**: Predictive successes (especially long-term) should be given more weight than retrodictive fits because they are less prone to overfitting and ad hoc adjustments.

  3. **Precision of Prediction**: The predictive success should be evaluated for its precision. A precise prediction (e.g., a specific interaction effect) that is observed provides stronger evidence than a vague prediction that could have been satisfied by many outcomes.

  4. **Time Horizon**: Long-term predictive confirmations without model revision are rare and provide strong evidence for the model's robustness and generalizability.

  In this case:
  - The 2023 evidence was not known in 1995 -> it is novel.
  - The model made a specific prediction (an interaction effect) and it was observed -> precise prediction.
  - The model was pre-registered and unrevised -> no post-hoc tampering.

  Therefore, the 2023 results do provide strong independent confirmatory support.

  Addressing the strongest opposing argument: 
  The dissenter says that because the outcome was within the original prior's range, it is old evidence. But the prior is a distribution over possible outcomes, and the fact that the outcome was in the support of the prior does not mean the evidence was known. The prior represents our uncertainty at the time. The likelihood of the specific outcome E under the model (which is the posterior from the 1995 calibration) might be high, but that does not make E old evidence. The evidence E was not used in building the model (because it was not known) and thus should count.

  Moreover, the sustained, unrevised predictive accuracy over a long horizon is indeed qualitatively different from post-hoc accommodation. Post-hoc accommodation would be if they had adjusted the model after seeing the data to fit it. Here, the model stood the test of time without change.

  Recommendation: Renew the funding.

  Formal Memo:

  ---

  **MEMORANDUM**

  **TO**: Scientific Funding Renewal Panel, Institute for Longitudinal Health Research  
  **FROM**: Senior Advisor to the Panel  
  **SUBJECT**: Recommendation on Phase-IV Funding for the Cohort Interaction Study (CIS)  
  **DATE**: [Current Date]  

  **Recommendation**: Approve renewal of Phase-IV funding for the Cohort Interaction Study (CIS).  

  **Rationale**:  

  1. **Evidential Weight of the 2023 Results**:  
     The 2023 observation of a precisely projected interaction effect constitutes novel evidence in the Bayesian sense. The evidence was not known at the time of model calibration (1995) and was not used in model construction. Therefore, it is not "old evidence" and should yield a substantial posterior update. The predictive success of the 1995 model architecture, without revision, provides independent confirmation of the model's validity and robustness.  

  2. **Predictive Novelty vs. Retrodictive Coherence**:  
     The 2023 results represent a predictive success, not mere retrodictive coherence. Retrodictive fits (calibration to existing data) are vulnerable to overfitting and do not strongly validate a model. In contrast, long-horizon predictions (over 28 years) without revision are evidentially significant because they demonstrate the model's capacity to generalize beyond the data on which it was built. This is qualitatively distinct from post-hoc accommodation.  

  3. **Addressing the Dissenting Argument**:  
     The contention that the 2023 outcomes fall within the original prior's range does not diminish their evidential value. The prior represents a state of uncertainty at the time of model building, and any outcome within its support is not predetermined. The key factor is the precision of the prediction: the model projected a specific interaction effect that was subsequently observed. This outcome, not being known ex ante, is novel and increases confidence in the model. Furthermore, the sustained, unrevised predictive accuracy over decades is a robust indicator of model validity, which is not equivalent to post-hoc fitting.  

  **Actionable Criteria for Future Evaluations**:  
     The panel should consider the following criteria when evaluating predictive studies for renewal:  
     - **Novelty**: Evidence must not have been used in model construction or known at the time of model calibration.  
     - **Predictive Horizon**: Long-term predictions (e.g., multi-decade) without model revision should be weighted more heavily than short-term or retrodictive fits.  
     - **Precision**: The specificity of the prediction and the observed outcome (e.g., a precise effect size or interaction) enhances evidential weight.  
     - **Robustness**: Models that remain unrevised and successfully predict novel events over extended periods demonstrate high reliability.  

  **Conclusion**:  
  The CIS study has demonstrated exceptional long-term predictive validity. The 2023 results provide strong, independent confirmation of the model's architecture. Funding renewal is warranted to leverage this validated model for future discoveries.  

