  Hmm, their point about still using expected-value reasoning with limited knowledge makes sense pragmatically. But then they jump to advocating rule-following heuristics while denying them independent moral status. That's where things get slippery - how can heuristics be purely consequentialist if we can't verify their long-term consequences?

  The temporal weighting claim is particularly tricky. They insist it's not discounting, but distinguishing "epistemic accessibility" from temporal preference might be philosophically fragile. I should check if any consequentialists successfully defend similar positions.

