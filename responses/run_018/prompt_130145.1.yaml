answer: |-
  ### Aesthetic Testimony Acquisition Procedure  
  Grounded in the autonomy thesis (you must experience beauty firsthand to truly know it) and the limits of testimony, this 20-minute procedure prioritizes direct experience, then expert insight, then secondary reports. Each step either resolves the decision, triggers a hard stop, or flags a values call (requiring committee voting). Steps 1–3 are sequential; skip a step if input is unavailable.

  **Procedure Steps:**  
  1. **Direct Viewing (Experience firsthand if possible):**  
     - **Sufficient for Yes:** ≥⅔ of committee report a positive aesthetic response (e.g., moved, intrigued, provoked).  
     - **Hard No:** ≥⅔ report strong negative affect (e.g., disgust, boredom, offense) *and* expert testimony doesn’t reframe it.  
     - **Punt to Values:** No majority (e.g., split reactions) → Proceed to Step 2.  
     - *Philosophy note:* Autonomy thesis prioritizes direct experience; disagreement here is unresolvable by theory.  

  2. **Expert Testimony (Curator/artist/critic with firsthand knowledge):**  
     - **Sufficient for Yes:** Testimony compellingly reframes objections or explains value (e.g., "kitsch is intentional") *and* aligns with museum mission.  
     - **Hard No:** Testimony is vague, self-contradictory, or ignores direct reactions (if available).  
     - **Punt to Values:** Testimony is speculative, relies on others’ views, or only partly addresses concerns → Proceed to Step 3.  
     - *Philosophy note:* Experts can guide perception, but disagreement persists if testimony feels like "dressing up a gut call."  

  3. **Secondary Testimony (Expert relaying others’ reports):**  
     - **Sufficient for Yes:** Only if the effect is unique, mission-critical (e.g., decay as historical metaphor), *and* cost is low (<$10k).  
     - **Hard No:** Secondary testimony is the *only* input *and* cost >$10k (too risky under autonomy thesis).  
     - **Punt to Values:** All other cases → Committee votes based on institutional values (e.g., "Do we prioritize conceptual risk?").  
     - *Philosophy note:* Secondary reports are epistemically weak; you can’t "learn beauty" from them per autonomy thesis.  

  ---

  ### Case Applications  
  **Case 1: Abstract Sound Installation**  
  - **Direct Viewing:** None → Skip to Step 2.  
  - **Expert Testimony:** Curator claims "temporal disorientation rewards patience." Vague → *Punt to Values* (doesn’t reframe potential objections).  
  - **Secondary Testimony:** None.  
  - **Verdict:** **Punt to values call** (committee must vote on trusting curator + mission alignment).  
  - *Why committee won’t like it:* Forces a risky vote with no direct experience.  

  **Case 2: Figurative Painting**  
  - **Direct Viewing:** 50/50 split (moving vs. kitsch) → *Punt to Values?* No, proceed to Step 2 (disagreement unresolved).  
  - **Expert Testimony:** Critic argues sentimentality is "the point." Compellingly reframes objections → *Sufficient for Yes*.  
  - **Verdict:** **Yes** (expert testimony resolves disagreement; no values call needed).  

  **Case 3: Work with Second-Hand Testimony**  
  - **Direct Viewing:** None → Skip to Step 2.  
  - **Expert Testimony:** Curator’s testimony is entirely second-hand (conservator’s decay report) → Treat as Step 3 input.  
  - **Secondary Testimony:** Only input + cost >$10k → *Hard No* (per autonomy thesis: can’t verify aesthetic value).  
  - **Verdict:** **Hard No** (too risky without direct/expert validation).  
  - *Why committee won’t like it:* Rejects a curator-backed work outright.  

  ---

  ### Summary Table  
  | Case                           | Procedure Verdict   | Judgment Call Flagged? | One-Line Reason                                      |  
  |--------------------------------|---------------------|------------------------|-----------------------------------------------------|  
  | Abstract sound installation    | Punt to values call | Yes                    | Vague expert testimony; no direct experience.       |  
  | Figurative painting            | Yes                 | No                     | Expert testimony resolved direct-viewing split.     |  
  | Work with second-hand testimony | Hard No             | No (hard stop)         | Only secondary testimony + cost >$10k; too risky.   |  

  ---

  ### Procedure Limits  
  - **Can’t predict visitor reactions** (autonomy thesis: their experience is independent).  
  - **Values calls are still subjective** (philosophy doesn’t resolve mission/risk trade-offs).  
  - **Gut calls persist** in assessing expert "compellingness" or mission alignment.  
  - **No investment guidance** (e.g., ignores market trends).  
  - **Cost thresholds are arbitrary** (e.g., $10k may not reflect museum budget).  

