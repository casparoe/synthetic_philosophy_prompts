answer: |-
  Here are the desiderata for an adequate theory of moral learning from biography, grounded in Plutarch's *Parallel Lives* and the hagiographic tradition, with explicit phenomena protected, motivating cases, psychological constraints, negotiability, and potential tensions:

  ### Core Desiderata & Protected Phenomena

  1.  **The Virtue-Logic vs. Life-Pattern Distinction Requirement:**
      *   **Protected Phenomenon:** Distinguishing learning *abstract virtues/principles* (e.g., courage, justice, prudence) applicable across contexts from learning *specific life-patterns or choices* (e.g., "become a general," "renounce wealth").
      *   **Motivating Cases:** Plutarch explicitly compares disparate lives (e.g., Alexander & Caesar, Demosthenes & Cicero) to extract *common virtues* amidst vastly different contexts and choices. Hagiography often presents a *specific life-pattern* (asceticism, martyrdom) as the ideal path to holiness, potentially conflating the virtue with the specific expression.
      *   **Psychology:** Accommodates findings on *abstract concept learning* vs. *behavioral mimicry*. Theories must explain how biographies facilitate transferable virtue concepts, not just situation-bound copying.
      *   **Negotiability:** **Non-Negotiable.** Any theory failing this reduces moral learning to unreflective imitation, which both traditions implicitly reject by offering multiple models and contexts.

  2.  **The Comparative Structure vs. Singular Exemplar Accommodation Requirement:**
      *   **Protected Phenomenon:** The differing pedagogical functions of Plutarch’s *paired comparative structure* (highlighting similarities/differences in virtue/vice across cultures/situations) vs. hagiography’s *singular, intensely focused exemplar* (presenting a unified ideal for devotion and emulation).
      *   **Motivating Cases:** Plutarch's *synkrisis* forces reflection on *how* virtue manifests differently, fostering critical discernment. Hagiography (e.g., *Life of St. Anthony*) offers a concentrated, unambiguous beacon of holiness for unwavering aspiration and comfort.
      *   **Psychology:** Must accommodate both the *discriminative learning* facilitated by comparison (enhancing nuance and context-sensitivity) and the powerful *motivational pull* of singular, idealized models documented in social learning theory (identification, inspiration).
      *   **Negotiability:** **Preference-Based.** While a comprehensive theory must *explain* both, weighting their importance reflects pedagogical philosophy (critical judgment vs. inspirational devotion). The theory must show *how* each structure facilitates distinct aspects of moral learning.

  3.  **The Selective Representation & Idealization Justification Requirement:**
      *   **Protected Phenomenon:** Explaining why biographical accounts that *suppress negative details* (vices, failures, ambiguities) or *heighten positive traits* (idealization) can be *effective* and *non-corrupting* tools for moral education, despite historical inaccuracy.
      *   **Motivating Cases:** Plutarch acknowledges flaws but downplays or excuses them to focus on teachable virtues (e.g., downplaying Alexander's massacres). Hagiography routinely suppresses sins, exaggerates miracles, and presents near-perfect virtue (e.g., omitting saints' youthful struggles or doubts) to create compelling, inspiring exemplars.
      *   **Psychology:** Must accommodate findings on *motivation through attainability* (overly complex models can demotivate) and *cognitive simplification* (clearer models are easier to grasp and emulate initially). Must also address how *disillusionment* risk is managed or mitigated.
      *   **Negotiability:** **Non-Negotiable.** This is the core challenge. A theory failing here cannot account for the enduring pedagogical success of both traditions, dismissing them as mere propaganda or naivety. It must explain how selective representation functions pedagogically *without* necessarily fostering naivete or historical denialism long-term.

  4.  **The Disillusionment Accommodation Requirement:**
      *   **Protected Phenomenon:** Explaining how moral learning survives or is even enhanced when learners encounter *contradictory information* or the *flawed humanity* of a previously idealized biographical subject.
      *   **Motivating Cases:** Readers discovering historical facts omitted by Plutarch or encountering critiques of saintly figures (e.g., historical analysis of St. Francis's strictness). Psychological studies on "fallen idol" effects (e.g., reactions to scandals involving admired figures).
      *   **Psychology:** **Must Accommodate:** Findings on *cognitive dissonance* (how learners resolve contradictions between ideal and reality), *defensive processing* (ignoring/denying negative info), and potential for *growth* through disillusionment (revising understanding of virtue, moving from imitation to critical appreciation).
      *   **Negotiability:** **Non-Negotiable.** A theory must explain the resilience (or fragility) of moral learning derived from idealized biographies in the face of reality. Does disillusionment destroy the learning, refine it, or shift its nature?

  5.  **The Contextual Embedding Requirement:**
      *   **Protected Phenomenon:** Recognizing that moral learning from biography depends crucially on the *reader's context* (age, prior knowledge, cultural background, purpose for reading) and the *pedagogical framing* (e.g., guided discussion vs. private devotion).
      *   **Motivating Cases:** Plutarch likely intended his *Lives* for educated Greek/Roman elites engaging in philosophical reflection. Hagiography was often read aloud in communities for edification, veneration, or liturgical purposes. The same life story can inspire emulation in one context and historical curiosity in another.
      *   **Psychology:** Must align with *situated learning* and *scaffolding* theories. Learning outcomes depend on prior schemas, guidance, and the learner's active construction of meaning from the text within their environment.
      *   **Negotiability:** **Non-Negotiable.** A purely text-centric theory ignoring context cannot explain the variable impact of biographies.

  ### Potential Tensions & The Strictest Requirement

  *   **Primary Tension: Historical Fidelity vs. Unambiguous Exemplar (Requirements 3 & 4 vs. Implicit Demand of Hagiography):**
      *   **Conflict:** Requirement 3 demands justifying selective/idealized representation. Hagiography *requires* unambiguous exemplarity for its core function (devotion, uncomplicated emulation). Strict historical fidelity (revealing flaws, ambiguities, context-specific motives) inherently *undermines* unambiguous exemplarity. Plutarch navigates this by *including* flaws within a framework prioritizing virtue lessons, but this creates ambiguity.
      *   **Joint Unsatisfiability?** Achieving *perfect* historical fidelity *and* presenting a truly *unambiguous*, universally applicable moral exemplar from a complex human life is likely impossible. A theory must explain how *effective* moral learning occurs despite this tension, perhaps through managed ambiguity (Plutarch) or conscious idealization accepted within a community of interpretation (Hagiography). It cannot satisfy both ideals simultaneously to their fullest extent.

  *   **The Strictest Requirement (Eliminates Most Accounts):**
      *   **Requirement 3: The Selective Representation & Idealization Justification Requirement.**
      *   **Reason:** Many modern accounts (especially psychologically or historically critical ones) focus on the *dangers* of idealization (naivete, disillusionment, historical distortion) and see it as inherently corrupting or manipulative. They struggle to explain how Plutarch's carefully curated flaws or the hagiographic suppression of vice could *positively* serve genuine moral education without being deceitful or fostering unhealthy dependence. Accounts emphasizing only historical accuracy or deconstructive critique often fail to provide a positive pedagogical rationale for the core techniques of these traditions. Strict enforcement of this requirement – demanding a convincing explanation for the *non-corrupting pedagogical efficacy* of selective representation – eliminates theories that dismiss idealization outright or reduce it purely to ideological manipulation.

  ### Summary of Psychological Findings to Accommodate

  1.  **Emulation/Motivation:** The power of *identification* and *inspirational models* for motivation and goal-setting (Social Cognitive Theory - Bandura).
  2.  **Abstract Learning:** The ability to extract *abstract principles* (virtues) from *concrete examples* (lives), including cross-contextual transfer.
  3.  **Discriminative Learning:** How *comparison* enhances learning of nuanced concepts and context-dependency.
  4.  **Cognitive Dissonance & Disillusionment:** How people process information contradicting held beliefs about admired figures, potentially leading to rejection, rationalization, or revised understanding.
  5.  **Attainability & Simplification:** The motivating effect of perceiving a model as *attainable* (often requiring selective focus or initial idealization) and the cognitive benefit of *clear, simplified models* for initial learning.

  An adequate theory must integrate these psychological realities with the structural and representational strategies of Plutarch and hagiography, explaining how moral learning emerges from the complex interaction of text (with its selective representation and structures), reader psychology, and context, while navigating the inherent tension between historical realism and the pedagogical need for compelling, learnable exemplars.
