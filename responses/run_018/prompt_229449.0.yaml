prompt: |-
  I'm on my school's student council and we're the ones who get pitched every new piece of tech before it goes to the admin: hallway cameras with "AI" that detects fights, an app where you scan a QR code to use the bathroom, locked phone pouches, a cafeteria payment system that also flags kids with low balances. We have to give a reccomendation each time, usually after like 20 minutes of discussion, and half the commitee just says "if it makes things safer or faster, why not." I've been reading about how technology can have politics built into it — like the famous story that some parkway bridges were built too low for buses, which quietly kept poor people off the beach without any sign saying so. I want a procedure we can actually run in 20 minutes to figure out when a proposal is doing that: baking in a decision that should be argued about in public instead of hidden in a spec sheet. Questions in order, what counts as a good enough answer for each, where the procedure stops with a No, and where we have to admit it's a values call and kick it to the whole council. Then run it on the hallway cameras, the bathroom QR app, and the cafeteria payment thing (fair warning: we mostly like the cafeteria one), and make sure at least one of those comes out as a No even though we'd personally want to vote yes. Also say where the procedure can't tell the difference between real built-in politics and us just being paranoid.
reasoning: |-
  Okay, let's start by understanding what the user is asking. They're on the student council and need a quick way to evaluate tech proposals for hidden biases or "politics" baked into the design. They mentioned examples like hallway cameras with AI, bathroom QR codes, and a cafeteria payment system. The challenge is to create a 20-minute procedure that identifies when a tech decision should be debated publicly instead of being hidden in the specs.

  First, the user wants a structured procedure with specific questions. Each question needs clear criteria for what counts as a good answer, where to stop with a "No," and when to escalate to the whole council. They also want real examples applied to their cases, ensuring at least one proposal gets a "No" even if they like it. Plus, they want to know where the line is between real built-in politics and paranoia.

  The key insight here is that technology isn't neutral. The bridge example shows how design choices can exclude people without explicit rules. The user needs a method to uncover such hidden consequences quickly. The procedure must be efficient, fit into 20 minutes, and be actionable for students who might not be tech experts.

  The assistant proposed a four-question framework. Let me break down each question's purpose. Question 1 targets exclusion: does the tech create barriers for certain groups? The red flag is if it disproportionately affects protected classes. Good answers involve valid workarounds; "No" if exclusion is inherent. Question 2 is about enforcement: does it automate discipline? Red flags include replacing human judgment with algorithms. Good answers have oversight; "No" if it's fully automated punishment. Question 3 checks for mission creep: could the tech be expanded beyond its original purpose? Red flags are vague permissions or data reuse. Good answers have strict limits; "No" if it's a slippery slope. Question 4 is about values conflict: does it clash with school values? Red flags are contradictions with stated policies. Good answers show alignment; unresolved conflicts go to the council.

  Now, applying this to the examples. Hallway cameras: high exclusion risk for neurodivergent students, automated enforcement, mission creep potential. Should get a "No." Bathroom QR: possible exclusion if not everyone has phones, but maybe workarounds exist. Enforcement might be minimal, but mission creep is a risk. Could be a "Proceed with Caution." Cafeteria system: low exclusion if handled right, but flagging low balances risks stigma. Enforcement isn't punitive, but the shaming aspect needs addressing. Might pass with modifications.

  The user mentioned liking the cafeteria system, so showing it gets a conditional yes highlights that the procedure isn't just rejecting everything. The hallway cameras getting a "No" meets the request to have at least one rejection despite personal preferences.

  For the paranoia vs. real politics distinction, the procedure relies on evidence and proportionality. If impacts are speculative or minor, it's paranoia. But if there's data or clear disproportionate effects, it's a real issue. The questions force grounding concerns in observable impacts, not just fear.

  The user's deeper needs include empowering the student council to advocate for equity, ensuring tech decisions are transparent, and preventing admin from pushing through biased tech under the guise of efficiency. They want a tool that legitimizes their concerns with a structured approach, making it harder for others to dismiss them as unreasonable. The procedure also educates the committee on ethical considerations, shifting the mindset from "if it's efficient, why not" to critical assessment.
answer: |-
  Here’s a **20-Minute "Unmask Built-In Politics" Procedure** for your council, designed to flag tech that hides value judgments. Use a whiteboard to track answers:

  ### The 4 Core Questions (10 mins)
  1.  **"Who could this *invisibly* exclude or burden, even if unintentionally?"**
      *   *Good Answer:* Clear mitigation for exclusion (e.g., "Students without phones get physical passes for QR system"). Vague promises ("We'll figure it out") are insufficient.
      *   **Stop with NO:** If exclusion targets a protected class (disability, income) and cannot be *fully* mitigated *before* rollout.
      *   **Kick to Council:** If exclusion is significant but mitigations *might* work (needs broader debate).

  2.  **"Does this automate punishment/surveillance/restriction *without human judgment*?"**
      *   *Good Answer:* Human oversight *before* consequences (e.g., "Fight alerts go to VP for review, *not* auto-detention"). "Logs for later review" is weak.
      *   **Stop with NO:** If punishment/significant restriction (e.g., locked phone pouch, denied bathroom access) is fully automated based on sensor/algorithm.
      *   **Kick to Council:** If automation feeds *into* human judgment, but the threshold or data use is highly contentious.

  3.  **"Could this data/functionality *easily* be expanded later for a very different purpose?"**
      *   *Good Answer:* Hard technical/policy limits documented *now* (e.g., "Camera data auto-deletes in 24h, cannot add facial recognition per vendor contract"). "We promise not to" is bad.
      *   **Stop with NO:** If core tech enables high-risk creep (e.g., ubiquitous cameras enable tracking; QR scans enable movement logs) AND no enforceable limits exist.
      *   **Kick to Council:** If creep is possible but limits *could* be binding (needs policy debate).

  4.  **"Does this *contradict* a stated school value (equity, privacy, trust) without exceptional justification?"**
      *   *Good Answer:* Alignment with values OR a truly exceptional, specific safety need outweighing the value clash. Efficiency isn't exceptional.
      *   **Stop with NO:** If it blatantly violates a core value (e.g., "We value dignity" but low-balance flagging shames students) for mere convenience.
      *   **Kick to Council:** Always – if it passes Q1-3 but has a values clash, the *whole council* must debate the trade-off.

  ### Where "Paranoia" Ends & Politics Begins
  *   **Real Politics:** Impacts are *disproportionate* (hits vulnerable groups hardest), *systematic* (baked into design), or *enables control/denial of rights*.
  *   **Paranoia:** Impacts are speculative, minor, affect everyone equally, or have strong, verifiable safeguards against misuse. Focus on *evidence of disproportionate impact or control*.

  ---

  ### Applying the Procedure (10 mins)

  1.  **Hallway Cameras with "Fight Detection AI":**
      *   **Q1 (Exclusion):** High risk for neurodivergent students (stimming misread as aggression), students of color (racial bias in training data). *Mitigation?* Unlikely to be foolproof. **🚩 Potential NO.**
      *   **Q2 (Automated Punishment):** "Detection" implies automated judgment leading to intervention. *Oversight?* Vendor claims "alerts staff," but is it *before* action? Likely **NO** without ironclad human-review-first protocol.
      *   **Q3 (Mission Creep):** Cameras everywhere? Easy to add tracking, "loitering" detection, or facial recognition later. **🚩 High risk, likely NO.**
      *   **Q4 (Values):** Likely clashes with privacy, trust, fostering a supportive (not prison-like) environment. **Kick to Council?** Unnecessary, already multiple NOs.
      *   **VERDICT:** **NO.** Surveillance + automation + bias risk + creep. Built-in politics: Assumes constant monitoring is acceptable; prioritizes control over trust; risks encoding bias.

  2.  **Bathroom QR Code App:**
      *   **Q1 (Exclusion):** Students without smartphones? Broken phone? Mitigation *needed* (e.g., office pass). **Kick to Council?** If mitigation is solid (easy, stigma-free physical pass), proceed. If vague, **NO.**
      *   **Q2 (Automated Punishment/Restriction):** Does it *deny* entry without scan? If yes, **NO** (automated restriction). If it just *logs* entry for admin review later, proceed cautiously.
      *   **Q3 (Mission Creep):** Logs location/time? Easy to track movement patterns or "bathroom breaks." *Limits?* Need auto-delete policy (e.g., data purged daily). **🚩 Kick to Council?** If no hard limits, **NO.**
      *   **Q4 (Values):** Efficiency vs. privacy/dignity? Does scanning feel like surveillance? **Kick to Council?** Needs debate on trade-offs.
      *   **VERDICT:** **Likely PROCEED WITH CAUTION (conditional YES with mitigations)** or **KICK TO COUNCIL.** Heavily depends on implementation details (physical pass access, data limits). Built-in politics risk: Normalizes location tracking for basic needs; assumes efficiency justifies minor surveillance.

  3.  **Cafeteria Payment + Low-Balance Flagging (Your "Like"):**
      *   **Q1 (Exclusion):** Low-income students flagged. *Mitigation?* **Crucial:** How is the flag shown? A quiet alert *only* to cafeteria staff for discreet assistance? Or a loud beep/red light shaming the student? The latter is **NO.** Good mitigation makes it invisible to peers.
      *   **Q2 (Automated Punishment/Restriction):** Does flagging *deny* food? If yes, **NO.** If it *only* alerts staff to *offer* help/alternatives (e.g., emergency meal), proceed. **Kick to Council?** If the "offer" feels coercive.
      *   **Q3 (Mission Creep):** Payment data is low-risk for creep *if* isolated. Ensure it's not linked to other systems. Easy pass if basic.
      *   **Q4 (Values):** Clash: Efficiency/accounting vs. dignity/equity. **Kick to Council?** **YES, ALWAYS for Values Clash.** Even with good mitigations (Q1), the *existence* of flagging low-income students needs public debate about whether it aligns with school values of equity and support. This is the hidden politics: *Prioritizing administrative ease or debt prevention over student dignity, potentially stigmatizing poverty.*
      *   **VERDICT:** **KICK TO WHOLE COUNCIL (Due to Q4).** The tech itself might be workable *if* flagging is truly invisible/helpful (Q1), but the **core value judgment** – "Is it acceptable to automatically identify and 'manage' low-income students in the lunch line, even 'helpfully'?" – must be debated publicly. This is exactly the hidden politics you seek.

  ### Key Outcomes
  *   **Cameras:** Clear **NO** (Automated enforcement, exclusion, creep).
  *   **QR Bathroom:** **Conditional YES/Kick** (Depends heavily on exclusion mitigation & creep controls).
  *   **Cafeteria System:** **KICK TO COUNCIL** (Values clash needs democratic debate, even if the *mechanism* is fixable). *This meets your request: A system you like gets flagged for its hidden values.*

  **Why it Works in 20 Minutes:** It focuses on high-leverage questions (exclusion, automation, creep, values) with clear tripwires ("NO") and escalation points ("Kick"). It forces discussion beyond "safer/faster" by demanding evidence of safeguards and highlighting potential victims and value conflicts. It distinguishes paranoia (vague fears) from identifiable risks (disproportionate impact, automated control, slippery slope tech).
