answer: |-
  Here’s a rigorous 45-minute essay prompt, model answer, and marking scheme designed to push upper-level students beyond recitation into conceptual synthesis and critique:

  ---

  **PHIL 340 Practice Exam: The Paradox of Ficiton**  
  *(45 minutes total)*  

  **PROMPT:**  
  Radford’s paradox hinges on the claim that genuine emotion requires full belief in the existence of its object. Defenders like Walton and Currie reject this, but their solutions diverge critically on the *degree* of cognitive commitment needed for emotional engagement with ficiton. Using the concept of **"shadow endorsement"** — where audiences treat fictional scenarios as affectively "live" without literal belief (e.g., feeling dread for Hamlet while *not* believing he died) — evaluate whether Walton’s *make-believe* theory or Currie’s *simulation* account better resolves the paradox. Argue which framework:  
  (a) More plausibly explains how shadow endorsement suffices for emotional responses,  
  (b) Avoids collapsing into the other theory or reverting to Radford’s demands,  
  (c) Best preserves the distinction between fictive and real-world emotional processing.  

  ---

  **MODEL ANSWER (≈600 words):**  

  The paradox of ficiton insists that emotions toward fictional entities are irrational because they violate the "belief condition" (Radford). Shadow endorsement—affective immersion without doxastic commitment—offers a solution, but Walton’s and Currie’s models ground it differently, with Walton providing a more coherent account.  

  For Walton, emotions in ficiton are *quasi-emotions*: prop-driven imaginings (e.g., fearing Frankenstein’s monster is *make-believedly* fearing). Shadow endorsement here is *participation in a game of make-believe*. When readers "endorse" Hamlet’s plight, they imaginatively accept fiction-generated truths ("It is fictional that Hamlet suffers") without believing them. This requires no simulation or belief-like state; a prop (the text) mandates imaginings. Emotion arises from *imagining fearing*, not fearing *simpliciter*. Crucially, quasi-emotions are *sui generis*: they feel like fear but are ontologically distinct by being imagination-infused. This neatly dodges Radford by decoupling emotion from existence-beliefs.  

  Currie, conversely, argues we *simulate* beliefs during engagement: we adopt "i-beliefs" (imagined beliefs) that mirror real beliefs cognitively but lack assertion. Shadow endorsement under simulation means *running offline cognitive processes*: i-believing "Hamlet dies" triggers real (but "disconnected") grief. While this rejects Radford’s literal belief requirement, it risks collapsing into Walton or failing its own aims. First, if i-beliefs are functionally identical to beliefs (as Currie suggests), why aren’t emotions directed at ficiton *genuine but irrational* (re-inviting Radford’s charge)? Second, if i-beliefs are *weaker*, they become indistinguishable from Waltonian imaginings. Currie must either concede irrationality or blur his model into make-believe.  

  Walton’s theory handles shadow endorsement more cleanly by making affective processing *constitutively imaginative*. We don’t merely *have* emotions toward fictions; we *imagine having them*. This shields quasi-emotions from charges of irrationality (they’re acts of imagination, not failed beliefs) and sharply distinguishes fictive engagement: real fear involves appraisal of threat; quasi-fear involves appraisal *within a fiction*. Currie’s simulation, by contrast, implies fictive emotions *are* real emotions misapplied to non-existent objects—which echoes Radford’s irrationality claim.  

  Thus, Walton’s make-believe better explains shadow endorsement as *non-doxastic imaginative play*, avoiding Currie’s dilemma between irrationality and theoretical collapse. His model doesn’t require "weaker beliefs"; it replaces belief with imagination entirely, offering a robust, paradox-free account of why we cry for Hamlet while knowing he never lived.  

  ---  

  **MARKING SCHEME (20 points total)**  
  *Must-hit moves (4 points each):*  

  1. **Define shadow endorsement non-doxastically**  
     *Botch:* Conflating it with weak belief or "suspension of disbelief."  
  2. **Contrast Walton’s quasi-emotions (imagination-driven) vs. Currie’s i-beliefs (simulation-driven)**  
     *Botch:* Treating quasi-emotions as "pretend feelings" or i-beliefs as identical to imaginings.  
  3. **Identify Currie’s dilemma: simulation risks irrationality (Radford relapse) or collapse into make-believe**  
     *Botch:* Claiming simulation cleanly resolves the paradox without trade-offs.  
  4. **Argue why Walton’s model better distinguishes fictive/real emotions**  
     *Botch:* Asserting distinction without explaining *how* quasi-emotions are ontologically unique.  
  5. **Explain how Walton dissolves the paradox WITHOUT weaker beliefs**  
     *Botch:* Implying Walton reduces to "imaginative belief" rather than propositional imagination.  

  ---

  **Design Notes:**  
  - **Depth over Recitation:** Forces engagement with *how* theories conceptualize the belief/imagination threshold.  
  - **"Shadow Endorsement" Nuance:** Tests if students can apply a novel cognitive state to classic frameworks.  
  - **Anti-Collapse Clause:** Prevents lazy "they’re basically the same" answers.  
  - **Model Answer Tricks:** Uses Walton’s *sui generis* move to block Radford, exploits Currie’s ambiguity on i-belief strength.  
  - **Botch Warnings:** Targets common oversimplifications (e.g., "quasi-emotions = fake emotions").  

  Good luck with your study group—may your ficiton debates be paradox-free! 📚
