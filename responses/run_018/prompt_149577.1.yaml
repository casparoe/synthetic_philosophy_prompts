  ### How to Use This Tree  
  1. Answer Q1 based on the permanent shielding case.  
  2. Follow branches to subsequent questions.  
  3. Arrive at a leaf matching your judgments.  
  4. Compare leaves to identify theoretical commitments.  

  This taxonomy isolates core intuitions driving the debate, using cases to bypass label-centric disagreements. For unresolved overlaps, focus on Q1 (permanent shields) and Q2A (multiple pathways) to distinguish closely related views.
