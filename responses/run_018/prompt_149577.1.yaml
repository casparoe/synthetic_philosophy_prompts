  - The tree **cannot cleanly separate** the **Fink-Sensitive + Mask-Tolerant View** (Leaf 4) from the **Mask-Tolerant View (Strong)** (Leaf 2), as both tolerate masks. They diverge on *permanent shields* (Q1), which Leaf 4 rejects.  
  - **Multi-Path** (Leaf 1) and **Mask-Tolerant (Strong)** (Leaf 2) are separated only by their stance on *multiple pathways* (Q2A), not shields/finks.  

