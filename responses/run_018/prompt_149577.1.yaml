  Below is a decision-tree taxonomy for positions on dispositions, finks, and masks. The tree starts with concrete cases, requires no knowledge of philosophers or labels, and sorts views based on intuitive judgments. Each branch point is a yes/no or either/or question derived from hypothetical scenarios. Terminal leaves include major positions and diagnoses for unmapped combinations.

  ### Decision Tree: Dispositions, Finks, and Masks  
  **Instructions:** Begin with Question 1. Proceed based on your intuitive judgment of the cases described.  

  ---

  **1. Permanent Shielding Case:**  
     An object (e.g., a vase) has an *inseparable internal mechanism* that permanently prevents its disposition from manifesting (e.g., an unremovable force field blocking breakage). Despite this, the object’s intrinsic properties are identical to a fragile vase without the shield.  
     → **Does it possess the disposition (e.g., fragility)?**  
     - **Yes** → Proceed to Question 2A.  
     - **No** → Proceed to Question 2B.  

  **2A. Multiple Pathways Case:**  
     Can a single disposition (e.g., flammability) have *genuinely distinct manifestation pathways* that are not reducible to a single core process? (E.g., one pathway involves burning in oxygen, another involves reacting with chlorine, with no shared underlying mechanism.)  
     - **Yes** → **Leaf 1: Multi-Path Account**  
       (Dispositions persist structurally, with graded/complex manifestations across irreducibly distinct scenarios.)  
     - **No** → **Leaf 2: Mask-Tolerant View (Strong)**  
       (Dispositions survive *any* blocker—internal/external, permanent/temporary—as long as intrinsic properties remain. Blockers are "background conditions.")  

  **2B. Temporary Fink Case:**  
     An object (e.g., a vase) has a *temporary interfering mechanism* (a "fink") that *removes* its disposition if triggered (e.g., a wizard’s spell making it non-fragile when struck). Before triggering:  
     → **Does it possess the disposition (e.g., fragility)?**  
     - **Yes** → **Leaf 3: Intrinsic Disposition View**  
       (Dispositions are intrinsic; finks disrupt manifestation but don’t destroy the disposition itself. *Diagnosis: Rarely defended; may conflate properties with their grounds*.)  
     - **No** → Proceed to Question 3.  

  **3. Temporary Mask Case:**  
     An object (e.g., a vase) has a *temporary external blocker* (a "mask") that prevents manifestation without altering the object (e.g., a safety net that catches it if dropped).  
     → **Does it possess the disposition (e.g., fragility)?**  
     - **Yes** → **Leaf 4: Fink-Sensitive + Mask-Tolerant View**  
       (Dispositions are absent *only* when interferers (finks) are present. Blockers (masks) are external to the disposition.)  
     - **No** → **Leaf 5: Simple Conditional Analysis (SCA)**  
       (An object has a disposition iff, if triggered, it manifests. Blockers/finks falsify the conditional, so no disposition exists.)  

  ---

  ### Terminal Positions (Leaves)  
  1. **Multi-Path Account** (from 2A-Yes)  
     - Dispositions have multiple, irreducible manifestation pathways. Permanent shields don’t destroy the disposition.  
  2. **Mask-Tolerant View (Strong)** (from 2A-No)  
     - Dispositions persist through *any* blocker (internal/external, permanent/temporary). Blockers are part of the manifestation context.  
  3. **Intrinsic Disposition View** (from 2B-Yes)  
     - Dispositions are intrinsic properties. Finks disrupt manifestation but don’t remove the disposition.  
     *Diagnosis: Coherent but unappealing—fails to explain why finks prevent manifestation if the disposition is present.*  
  4. **Fink-Sensitive + Mask-Tolerant View** (from 2B-No → 3-Yes)  
     - Dispositions are absent with finks (interferers) but survive masks (blockers).  
  5. **Simple Conditional Analysis (SCA)** (from 2B-No → 3-No)  
     - Dispositions exist iff the conditional "if triggered, manifests" holds. Finks/masks falsify it.  

  ---

  ### Notes on Unmapped Combinations  
  - **Leaf 3 (Intrinsic Disposition View)**: Generated via 2B-Yes. This position is *diagnosed as unstable*: It accepts dispositions under finks (unlike SCA/fink-sensitive views) but rejects them under permanent shields (unlike mask-tolerant/multi-path views). No major theory defends this.  
  - **Branch 2B-Yes → 3-Yes**: Not explicitly mapped. *Diagnosis: Incoherent*—accepting dispositions under finks *and* masks collapses the fink/mask distinction.  
  - **Branch 2B-Yes → 3-No**: Not explicitly mapped. *Diagnosis: Unexplored*—combines intrinsic dispositions with mask-intolerance, ignoring blockers’ asymmetry.  

