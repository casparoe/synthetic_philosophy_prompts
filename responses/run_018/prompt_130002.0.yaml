  Don't just summarize their positions — I want the actual document theyd produce together: first a numbered section of agreed claims (covering what belief is, whether doxastic voluntarism is coherent, what they both concede about Clifford's ship case, and how indirect belief-formation through testimony works), then a disagreements table where each disagreement is phrased in wording that its own side would accept. The cruxes should be precise — is belief formation ever genuinely voluntary? does James's forced, living, and momentous distinction apply to beliefs acquired through indirect testimony? and is there a moral asymmetry between false belief and suspended judgment when a research committee is deciding whether to act on ambiguous climate-model outputs? For each crux, include one concrete case or argument both sides agree bears on it, with each side's predections written down in advance. Also say clearly if any part of the dispute is just verbal. Write it casual like I'm asking for help on my semonor paper — I probably made a typo or two cause I'm typing this between classes.
