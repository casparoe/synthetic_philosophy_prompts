prompt: |-
  I'm a policy analyst for our county welfare office and lately I've been writing rules for automated eligibility checks. After a weird argument at a dinner party about whether bad law is still law, I need a practical checklist based on the Hart-Fuller debate that my team can actually run on a draft rule. Turn Fuller's eight principles of legality into concrete tests for an automated system—like what counts as promulgation when the rule is buried in code, or retro-activity when a model gets updated with past data. Then add Hart's rule of recognition as a seperate gate: does the system have authority regardless of morality? Build it as an ordered procedure with clear stop points—where we reject for failing inner morality, where we flag valid but unjust and kick it to the board, and where the two frameworks flat-out conflict. Apply it to two proposals: a retro-active risk-score update that changes past eligibility, and a technically published but human-unreadable algorithmic rule. I'm not asking for citations, just something I can use in tomorrow's review, and please excuse the typo—I always write promulgagation by mistake.
reasoning: |-
  We are creating a practical checklist based on the Hart-Fuller debate. Fuller's eight principles of legality (inner morality of law) are turned into concrete tests for an automated system. Hart's rule of recognition is a separate gate that checks the system's authority regardless of morality.

  Fuller's Eight Principles (with concrete tests for automated systems):
  1. **Generality**: Rules must be general, not ad hoc.
     - Test: Does the rule apply to a defined class of cases, or is it written for a specific individual or case? (Automated: Check if the rule uses parameters that define a class, not hardcoded exceptions for specific individuals.)

  2. **Promulgation**: Rules must be published and accessible.
     - Test: Is the rule (or its logic) made available to those subject to it in a form they can reasonably access and understand? (Automated: For code, is there a human-readable summary? Is the code itself published? If buried in code, is there documentation at the point of use?)

  3. **Non-retroactivity**: Rules should not be applied retroactively.
     - Test: Does the rule change the legal status of past actions or events? (Automated: When a model is updated, does it change eligibility for benefits that were already determined? If so, it's retroactive.)

  4. **Clarity**: Rules must be clear and understandable.
     - Test: Can a reasonable person (or a trained caseworker) understand what the rule requires? (Automated: For algorithmic rules, is the logic interpretable? Are the inputs and outputs clearly defined? Are complex machine learning models accompanied by explanations?)

  5. **Non-contradiction**: Rules must not contradict each other.
     - Test: Does the rule conflict with any other existing rule? (Automated: Run consistency checks with the existing rule base. Use formal methods or automated reasoning to check for contradictions.)

  6. **Possibility of Compliance**: Rules must not require the impossible.
     - Test: Is it possible for the affected individuals to comply? (Automated: Check for rules that set conditions which are impossible to meet, e.g., requiring documents that don't exist or setting contradictory conditions.)

  7. **Constancy**: Rules should not change too frequently.
     - Test: How often does the rule change? (Automated: Track version history. If the rule changes more frequently than the time it takes for a typical case to be processed, that's a red flag.)

  8. **Congruence**: The administration of the rule must match the rule as announced.
     - Test: Does the implementation (code) actually match the published rule? (Automated: Use testing and validation to ensure the code behaves as per the documented rule. Monitor for drift in algorithmic rules.)

  Hart's Rule of Recognition (as a separate gate):
  - **Rule of Recognition**: Is the rule valid according to the system's criteria for validity (e.g., enacted by the proper authority, following the correct procedure) regardless of its moral content?
    - Test: Does the rule derive from an authoritative source (e.g., statute, regulation) and was it created through the proper process? (Automated: Check metadata: Who created the rule? What is the source? Was it approved by the designated authority? Is it in the official rule set?)

  Ordered Procedure with Stop Points:

  1. **Fuller's Inner Morality Check** (Steps 1-8): Each principle is a test. If a rule fails any of Fuller's principles:
     - **Stop Point for Rejection**: If the failure is severe and violates the inner morality (e.g., retroactive application, impossible to comply, completely unpublished), then reject the rule.
     - **Flag for Review**: If the failure is less severe (e.g., clarity issues that can be fixed, or constancy that might be justified) then flag and send to the board for review.

  2. **Hart's Rule of Recognition Check** (Step 9): After passing Fuller's tests (or being flagged but not rejected), check:
     - If the rule passes (it is valid by the system's criteria), then it is a valid rule, even if it might be unjust (then flag as "valid but unjust" and kick to the board).
     - If it fails (not valid by the system's criteria), then reject.

  Conflict Handling:
  - If a rule passes Hart's test (it is valid) but fails one of Fuller's tests (inner morality issue), then we have a conflict. The procedure:
    - If the failure in Fuller's test is severe (e.g., retroactivity, impossibility, or complete lack of promulgation), then reject despite being valid by Hart (because inner morality is a precondition for law).
    - If the failure is less severe, flag both the validity and the inner morality issue and kick to the board.

  But note: Fuller would argue that a rule that fails the inner morality tests is not law at all. Hart would say it is still law if it passes the rule of recognition. Therefore, we set:
  - Reject if any of Fuller's principles are severely violated (making it not law at all by Fuller's standards).
  - If it passes Hart but has non-severe Fuller violations, flag for board.

  Application to Two Proposals:

  **Proposal 1: Retro-active risk-score update that changes past eligibility.**
  - **Fuller Tests**:
    1. Generality: Probably passes (applies to a class).
    2. Promulgation: Assume it was published? If not, fails.
    3. **Non-retroactivity: FAIL (severe)** - changing past eligibility is retroactive.
    4. Clarity: Might pass if clear.
    5. Non-contradiction: Probably passes.
    6. Possibility of Compliance: Passes? (But if it changes past eligibility, then at the time of the past event, the individual couldn't comply because the rule didn't exist -> fails? But note the rule is applied retroactively so they couldn't comply at the time. So it might fail both 3 and 6.)
    7. Constancy: Might pass if not too frequent.
    8. Congruence: Probably passes.

    Stop Point: Fails non-retroactivity (severe) and possibility of compliance? -> Reject.

  - **Hart Test** (if we get there): If it was created by proper authority, it would pass. But we already rejected because of Fuller.

  **Proposal 2: Technically published but human-unreadable algorithmic rule.**
  - **Fuller Tests**:
    1. Generality: Passes (assuming it's general).
    2. **Promulgation: FAIL (if published only in code without explanation and not understandable by the affected individuals or caseworkers)**.
    3. Non-retroactivity: Passes (if not retroactive).
    4. **Clarity: FAIL (since it's unreadable, it's not clear)**.
    5. Non-contradiction: Passes (assume no contradiction).
    6. Possibility of Compliance: Passes (if the rule doesn't require the impossible).
    7. Constancy: Passes (if not changing too often).
    8. Congruence: Passes? (if the code matches the rule, but we don't have a human-readable rule to match? So congruence fails because the published rule (code) doesn't match what humans would need? Actually, the problem is that the rule is only in code and not explained. So congruence might be okay if the code is the rule? But Fuller would require that the rule be understandable. So promulgation and clarity are the main issues.)

    Stop Point: Fails promulgation and clarity. Are these severe?
      - If the rule is completely unintelligible to those affected and to caseworkers, then it's a severe failure. Reject.
      - If there is a way to get an explanation (e.g., through a help desk) and it's documented in a way that caseworkers can use, then it might be flagged for review.

    Let's assume it's completely unreadable (e.g., a black box model without any explanation). Then reject.

  - **Hart Test**: If it was properly enacted and published (even if in code), it might pass Hart. But we reject because of Fuller.

  Checklist Structure:

  We'll build the checklist as an ordered procedure:

  # Hart-Fuller Automated Rule Validation Checklist

  ## Step 1: Fuller's Inner Morality of Law
     For each principle, answer Yes/No. If No, determine severity (Severe or Not Severe).

     1. **Generality**: 
        - Does the rule apply to a defined class of cases without arbitrary individual exceptions?
        - If No, is the exception justified and documented? (If arbitrary, Severe)

     2. **Promulgation**:
        - Is the rule available in a form that affected individuals and caseworkers can reasonably access and understand? 
        - If only in code, is there accompanying human-readable documentation at the point of use? 
        - If No, and there is no documentation (Severe), else if documentation exists but is hard to find (Not Severe).

     3. **Non-retroactivity**:
        - Does the rule change the legal consequences of past events or actions?
        - If Yes, then Severe.

     4. **Clarity**:
        - Is the rule written in clear and understandable terms? For algorithmic rules, is there an explanation of how the rule works that a trained caseworker can understand?
        - If No (e.g., black box without explanation), then Severe.

     5. **Non-contradiction**:
        - Does the rule conflict with any existing rule in the system?
        - If Yes, then Severe (unless there is a defined conflict resolution rule).

     6. **Possibility of Compliance**:
        - Can an affected individual reasonably comply with the rule? 
        - If the rule requires the impossible (e.g., providing data that does not exist), then Severe.

     7. **Constancy**:
        - Has the rule changed more frequently than the typical processing time of a case? 
        - If Yes, then Not Severe (but flag) unless it causes instability (then Severe).

     8. **Congruence**:
        - Does the implementation (code) match the published rule? 
        - If No (e.g., there's a bug or the model has drifted), then Severe.

     **Stop Point for Fuller**:
     - If any principle is marked as Severe: **Reject the rule**.
     - If any principle is marked as Not Severe: **Flag and proceed to Hart, but note the issue for board review**.
     - If all pass: Proceed to Hart.

  ## Step 2: Hart's Rule of Recognition
     9. **Rule of Recognition**:
        - Is the rule created by the proper authority (e.g., by the county welfare office in accordance with its procedures and delegated authority)?
        - Is it properly adopted (e.g., via the required approval process)?
        - If Yes: Then the rule is valid by the system's criteria.
        - If No: **Reject the rule**.

     **After Hart**:
     - If the rule passed Fuller (all pass or only Not Severe flags) and passes Hart: Then it is a valid rule.
       - However, if there were Not Severe flags from Fuller, then **Flag as "Valid but with potential inner morality concerns" and kick to the board**.
       - Also, even if the rule passes both, we might have concerns about justice (which is outside Hart and Fuller). So if the rule is believed to be unjust, we can flag it for the board? But note: Hart separates validity from morality. So we don't reject for injustice, but we can flag for board review if there are moral concerns.

     - If the rule passed Fuller (with or without Not Severe flags) but fails Hart: **Reject**.

  Conflict Handling (if we encounter a rule that passes Hart but has a Severe failure in Fuller? We shouldn't because we already rejected at Step 1 for any Severe failure. So we only get to Hart if there are no Severe failures in Fuller.)

  Summary of Outcomes:
  - Reject: 
     - If any of Fuller's principles are violated severely (Step 1).
     - If the rule fails Hart (Step 2).
  - Flag and send to the board:
     - If the rule passes both but has Not Severe issues from Fuller (inner morality concerns) OR if the rule passes both but there are justice concerns (unjust rule) OR if the rule passes Hart but had Not Severe issues in Fuller.

  Now, let's write the checklist in a form that can be used in the review.
answer: |-
  ### Hart-Fuller Automated Rule Validation Checklist  
  **Purpose**: Ensure draft rules meet legal validity standards before implementation. Combines Fuller’s "inner morality of law" (practical legality) and Hart’s "rule of recognition" (formal authority).  
  **Procedure**: Run tests in order. **Stop and reject** if any "Severe" failure (Fuller). **Flag and escalate** to the board for "Valid but Unjust" or conflicts.  

  ---

  #### **STEP 1: FULLER’S INNER MORALITY CHECKS**  
  *Fail any "Severe" test → Reject rule immediately. Minor issues → Flag for board review.*  

  1. **GENERALITY**  
     - **Test**: Does the rule apply to a defined class (e.g., "all SNAP applicants"), not specific individuals?  
     - *Automated Test*: Scan code for hardcoded names/IDs.  
     - **Failure**: "Severe" if targets individuals.  

  2. **PROMULGATION (Publication)**  
     - **Test**: Is the rule accessible and understandable to affected parties (applicants, caseworkers)?  
     - *Automated Test*:  
       - Human-readable summary exists?  
       - Published in public-facing policy repository (not buried in code)?  
       - Logic explained in <8th-grade language?  
     - **Failure**: "Severe" if only in code/API without explanations.  

  3. **NON-RETROACTIVITY**  
     - **Test**: Does the rule alter past eligibility decisions?  
     - *Automated Test*:  
       - Check if model update uses post-decision data to revise prior outcomes (e.g., retroactive risk-score changes).  
       - Audit trail for "effective date" vs. "decision date".  
     - **Failure**: "Severe" if retroactive.  

  4. **CLARITY**  
     - **Test**: Can a non-technical person predict outcomes?  
     - *Automated Test*:  
       - Inputs/outputs documented?  
       - ML model SHAP/LIME explanations available?  
       - Decision thresholds unambiguous?  
     - **Failure**: "Severe" if black-box logic (e.g., unexplained neural net).  

  5. **NON-CONTRADICTION**  
     - **Test**: Does the rule conflict with existing rules?  
     - *Automated Test*: Run consistency checks against policy KB (knowledge base).  
     - **Failure**: "Severe" if contradictions found.  

  6. **POSSIBILITY OF COMPLIANCE**  
     - **Test**: Can applicants reasonably provide required data?  
     - *Automated Test*:  
       - Verify data sources exist (e.g., no "require 2025 tax records").  
       - Check for circular logic (e.g., "deny if unable to prove X" but X requires approval).  
     - **Failure**: "Severe" if impossible compliance.  

  7. **CONSTANCY**  
     - **Test**: Are changes infrequent enough for stable compliance?  
     - *Automated Test*:  
       - Version history: >30 days between deployments?  
       - Alert if >2 changes/month.  
     - **Failure**: "Not Severe" → Flag for board if too volatile.  

  8. **CONGRUENCE**  
     - **Test**: Does implementation match the published rule?  
     - *Automated Test*:  
       - Unit tests validating code against policy docs.  
       - Monitor for algorithmic drift.  
     - **Failure**: "Severe" if >5% deviation in test cases.  

  ---

  #### **STEP 2: HART’S RULE OF RECOGNITION**  
  *Run ONLY if rule passes all "Severe" Fuller tests.*  
  - **Test**: Was this rule created under the county’s formal authority structure?  
    - *Automated Test*:  
      - Metadata check: Approved by county counsel?  
      - Trace to enabling statute/regulation?  
      - Followed county’s rulemaking procedure?  
  - **Failure**: Reject if invalid authority (even if morally sound).  
  - **Pass + Morally Sound**: Approve.  
  - **Pass + Morally Unsound**: Flag as **"Valid but Unjust"** → Escalate to board.  

  ---

  #### **CONFLICT RESOLUTION**  
  - **Hart Valid but Fuller "Severe" Failure**: Reject (Fuller trumps; no "law" exists).  
  - **Hart Valid + Fuller "Minor" Failure**: Flag as **"Valid but Procedurally Flawed"** → Escalate to board.  

  ---

  ### **APPLICATION TO PROPOSALS**  
  #### Proposal 1: Retroactive Risk-Score Update  
  - **Fuller Checks**:  
    - Retroactivity (Test 3): **Severe Failure** → Alters past eligibility.  
    - *Stop*: Reject. No further tests.  
  - **Hart Check**: Skipped (but note: If board overrides, Hart would validate if formally authorized).  

  #### Proposal 2: Human-Unreadable Algorithmic Rule  
  - **Fuller Checks**:  
    - Promulgation (Test 2): **Severe Failure** → Buried in code, no explanation.  
    - Clarity (Test 4): **Severe Failure** → Black-box logic.  
    - *Stop*: Reject.  
  - **Hart Check**: Skipped (but if published in county register, Hart might validate).  

  ---

  ### **FLOWCHART SUMMARY**  
  ```  
  Start → Run Fuller Tests (1-8)  
  │  
  ├─ Severe Failure → REJECT  
  │  
  ├─ Minor Failure → Flag → Proceed to Hart  
  │  
  └─ Pass → Proceed to Hart  
      │  
      ├─ Hart Failure → REJECT  
      │  
      ├─ Hart Pass + Moral → APPROVE  
      │  
      └─ Hart Pass + Immoral → Flag "VALID BUT UNJUST" → Escalate to Board  
  ```  

  **Use Case**: Flag Proposal 2 for board *only* if Hart passed (e.g., technically published in register) but Fuller failed minor tests. Reject retroactive updates outright.  

  ---  
  **Next Steps**: Run this checklist in your rule-drafting pipeline. For "escalate to board" items, attach a report citing failed tests. Adjust severity thresholds based on county policy.
