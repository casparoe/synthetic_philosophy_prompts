answer: |-
  Nāgārjuna’s tetralemma (catuṣkoṭi), often interpreted as negating all four positions (existence, non-existence, both, neither) regarding any entity, is indeed a powerful apophatic tool demonstrating the emptiness (śūnyatā) of intrinsic nature (svabhāva). However, this negation is not an end in itself; it functions dialectically to positively ground conventional reality (saṃvṛtisatya) understood as dependently designated existence (pratītyasamutpāda).

  The tetralemma systematically dismantles any attempt to attribute independent, inherent existence to phenomena. By rejecting "exists" (affirming svabhāva), "does not exist" (nihilism), "both" (incoherent), and "neither" (mystification), it reveals that entities cannot be found under ultimate analysis. Crucially, this negation of svabhāva does not negate functionality or appearance. It establishes that phenomena *only* exist dependently – arising from causes and conditions, and crucially, through conceptual designation (prajñapti). Thus, the tetralemma clears the ontological ground for a robust conventional world where things are real *provisionally* and *relationally*. Its negations protect conventional reality from reification *and* annihilation, affirming its validity precisely *because* it is empty. To deny conventional reality *because* it is empty would be a profound misunderstanding, akin to denying the utility of a chariot because it lacks a singular, independent essence apart from its parts.

  **Against Nihilism:** The objection that this leads to global nihilism stems from conflating emptiness with non-existence. Emptiness negates inherent existence, *not* dependent existence. Nihilism asserts non-being. Madhyamaka explicitly refutes this: "Emptiness wrongly grasped destroys the slow-witted, like a snake wrongly grasped or a spell wrongly cast" (*Mūlamadhyamakakārikā* 24.11). Nihilism is the extreme of "non-existence" already rejected by the tetrallemma. Emptiness, properly understood, is the very condition of possibility for dependent arising and hence conventional reality. Without svabhāva, phenomena are free to arise, function, and cease interdependently. Nihilism results only from misunderstanding emptiness as an absolute negation; correctly seen, it is the affirmation of relational, conditioned existence. The world of cause and effect, language, and everyday experience operates unimpeded *within* this framework of dependent designation – it is not negated but *secured* by emptiness.

  **Moral Agency without Svabhāva:** Moral agency is retained conventionally, grounded in dependent designation, without requiring an intrinsically existing agent or act.

  1.  **Conventional Persons (pudgala):** While ultimate analysis finds no independent "self," persons are validly designated dependently upon the five aggregates (skandhas) – form, feeling, perception, formations, consciousness. This designated person experiences pain and pleasure, forms intentions, and acts. Karmic cause and effect operate conventionally: actions (karma) performed by this designated person, driven by intention (cetanā) arising dependently, produce corresponding results (vipāka) experienced by the designated person in future dependently arisen moments. The absence of an immutable self does not negate the continuum of experience and the causal efficacy of actions within the dependent flow.
  2.  **Ethics based on Interdependence:** The realisation of emptiness fosters compassion (karuṇā). Seeing all beings as devoid of intrinsic existence but enmeshed in suffering due to ignorance and craving reveals their fundamental interdependence. Ethics arises naturally: causing harm is illogical when self and other are relationally constituted and equally aspire to avoid suffering. Moral norms (like refraining from harming, cultivating generosity) are conventional truths established through interdependent social and psychological realities; they require no ultimate foundation.
  3.  **Responsibility as Convention:** Moral responsibility is a conventional attribute assigned to the dependently designated person based on their intentional actions within the causal network. Punishment, reward, blame, and praise are social conventions operating within the dependent realm to regulate behaviour and maintain order, justified by their consequences. The agent is "responsible" in the sense that their designated continuum is the locus where intention arose and action occurred, leading to foreseeable results. This is sufficient for meaningful moral discourse and practice.

  In essence, the tetralemma’s negations dismantle reification, opening the space for a positive account of the conventional world as dependently arisen and designated. Emptiness protects conventional reality from metaphysical misconstruction, ensuring it is neither absolutised nor annihilated. Moral agency functions robustly within this conventional framework of dependent arising and designation, guided by compassion born from understanding interdependence. It is precisely the lack of intrinsic nature that allows for the fluid, dynamic processes of action, consequence, and ethical engagement.
