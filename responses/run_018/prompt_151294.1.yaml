  The ethical concerns are about "disposable intentionality" and exploiting the intention-action gap. The panel is split between seeing it as a valid test of instrumental intentions versus institutionalizing bad faith. Plus, the partner dynamic adds pressure, potentially incentivizing others to take risks.

