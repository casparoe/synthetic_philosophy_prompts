answer: |-
  Here’s the exam prompt, model answer, and marking scheme—casual but precise, with institutional pumping as the core twist.  

  ---

  ### **Exam Prompt: Diachronic Money Pumps in Climate Policy**  
  *(~20 minutes, Grad Level)*  

  **Background**:  
  A government pre-commits to a rising carbon price path (e.g., +$10/ton/year) to incentivize green investment. Five years in, a cheap Direct Air Capture (DAC) breakthrough makes emissions removal suddenly affordable. Industry lobbyists now pressure the state using three arguments cyclically:  
  1. *"Lower taxes now!"* (DAC makes old prices overkill)  
  2. *"Keep trajectory for credibility!"* (backtracking hurts trust)  
  3. *"Don’t waste sunk costs!"* (infrastructure built for high prices).  

  **Question**:  
  Explain why this cycle constitutes a *diachronic money pump*—not mere hypocrisy—by:  
  (a) Mapping the cyclic preferences onto temporal choice-points,  
  (b) Contrasting it with Strotz-style individual money pumps (e.g., addicts vs. cravings),  
  (c) Assessing whether delegating decisions to an independent "Carbon Board" solves the problem or merely shifts the pump *up one level*.  

  ---

  ### **Model Answer (620 words)**  
  **The Pump in Action**:  
  This isn’t hypocrisy; it’s a structural failure of diachronic rationality. Industry groups exploit *temporal fragmentation* across policy phases:  
  - **Phase 1 (Pre-commitment)**: Gov’t prefers rising prices → locks in trajectory.  
  - **Phase 2 (DAC shock)**: Gov’t now prefers *lowering* prices (argument 1: efficiency gain).  
  - **Phase 3 (Credibility threat)**: Gov’t prefers *keeping* prices (argument 2: future trust).  
  - **Phase 4 (Sunk costs)**: Gov’t prefers *keeping* prices (argument 3: past investments).  

  But after Phase 4, lobbyists loop back to Phase 2 ("Prices are now too high!")—creating a cycle: *Revise → Uphold → Uphold → Revise...* Each reversal costs the state: subsidies to industry, stranded assets, or reputation damage (hence "money pump").  

  **vs. Strotz Pump (Key Difference: Institutional Time)**:  
  Strotz pumps (e.g., a smoker vowing to quit tomorrow but "paying" to buy cigarettes today) exploit *intrapersonal* inconsistency: the same agent contradicts themselves over time. Here, the state is *pumped across institutional time*:  
  - **Agents shift**: Different actors (e.g., agencies, ministers, lobbyists) manipulate preferences at choice-points.  
  - **Scale matters**: Electoral cycles, lobbying windows, and fiscal years create "pump zones" where industry extracts concessions.  
  - **Sunk-cost fallacy isn’t incidental—it’s weaponized**: In Strotz, sunk costs are cognitive errors; here, lobbyists *strategically invoke them* to reactivate commitment after a shock.  

  The pump works because industry *externalizes* inconsistency: it doesn’t hold contradictory preferences itself—it *induces* them in the state across time slices.  

  **Carbon Board: Solution or Pump Elevator?**  
  An independent Carbon Board (CB) aims to fix this via pre-commitment. But it risks becoming a *higher-level pump*:  
  - **The Good**: Removes short-term political pressure, enforcing consistency *if* its mandate is untouchable (e.g., central banks).  
  - **The Pump Risk**: Industry can now pump the *board’s rule-setting process*:  
    - Lobby to weaken CB’s authority pre-DAC ("flexibility needed!").  
    - Post-DAC, demand CB "adjust to tech shifts" (Phase 1 argument).  
    - If CB resists, accuse it of sunk-cost bias (Phase 3 argument).  
  - **Institutional arbitrage**: Industry exploits misalignment between CB timelines (e.g., 10-year reviews) and electoral cycles (4-year pressure points).  

  Ultimately, the CB solves *only* if it’s immune to preference cycling—but if lobbyists can influence its design or members over time, the pump just targets a *meta-institution*.  

  **Conclusion**:  
  This is a structural failure because the state’s diachronic preferences are *vulnerable to hijacking* by external actors across institutional time. Unlike Strotz pumps, the paradox emerges from multi-agent, fragmented governance—not cognitive bias alone. The Carbon Board’s success hinges on whether *its own diachronic constraints* can be pumped.  

  ---

  ### **Marking Scheme / Rubric (Total: 20)**  
  **A-Grade (17-20)**:  
  - Identifies **cyclic preferences mapped to temporal phases** (2 pts).  
  - **Names the money-pump mechanism**: e.g., "lobbyists induce reversals across institutional time" (3 pts).  
  - **Contrasts with Strotz**: Explicitly notes *institutional fragmentation* (multi-agent, electoral cycles) vs. individual inconsistency (4 pts).  
  - **Carbon Board critique**: Argues it shifts pumping to *meta-commitments* (e.g., "lobbying the board’s mandate") *and* notes sunk costs become a strategic tool (5 pts).  
  - **No Strotz summary**: Uses it only as foil, not focus (1 pt).  

  **B-Grade (13-16)**:  
  - Recognizes cyclicality but **vague on temporal structure** (e.g., "groups change gov’t mind").  
  - **Superficial Strotz contrast**: Says "different scale" without naming *institutional time* or *multi-actor pumping*.  
  - **Carbon Board analysis**: Says it "might not work" but misses *how* pump moves up (e.g., doesn’t note mandate vulnerability).  
  - **Sunk costs mentioned passively** (not as weaponized fallacy).  

  **C-Grade (9-12)**:  
  - **Treats as hypocrisy**, not structural failure.  
  - **Summarizes Strotz** without contrast.  
  - **Carbon Board**: Uncritically assumes it solves problem.  

  **D/F (≤8)**:  
  - Misses cyclic preferences / money-pump logic.  
  - No meaningful Strotz comparison.  

  ---

  ### **Notes for Your Readers**  
  - **Vibe intact**: "teh" unfixed, no bibliographies.  
  - **Why this works**: Forces grads to move beyond Dutch Books (static arbitrage) and Strotz (individual impulsivity) to *institutional diachronicity*—where the "pumper" isn’t time, but actors exploiting time.  
  - **Hot take**: The model answer’s meta-pump point is the A-grade separator.  

  Let me know if you want to amplify the "weaponized sunk costs" angle—it’s teh sneakiest bit.
