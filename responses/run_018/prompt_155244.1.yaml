answer: |-
  That's a deeply insightful ethical question, and your personal example perfectly captures a core philosophical puzzle. What you're wrestling with is called **Moral Luck**.

  Here's the breakdown relevant to your situation:

  1.  **The Core Idea of Moral Luck:** Moral luck describes the uncomfortable fact that we often judge the moral worth of an action (or person) based on factors *outside* the agent's control – specifically, the *outcome* or *consequences* that stem partly from luck or chance. This clashes with the intuition that moral praise or blame should depend *only* on factors within the agent's control (like intentions, effort, or the inherent quality of the action itself).

  2.  **Your Case - "Resultant Moral Luck":** This is the most direct type applying to you. You performed two *identical* actions (running experiments with the same sloppy technique and uncalibrated spectrometer). The *only* difference was the outcome, determined largely by chance:
      *   **Action A (Failed):** Outcome = Failure & obscurity. Judgment = "Sloppy, but no harm/no foul."
      *   **Action B (Successful):** Outcome = Discovery, patent, profit. Judgment = "Sloppy, but *you got lucky and profited from negligence*."

  3.  **The Philosophical Tension:**
      *   **Intuition 1 (Control):** Both actions were equally negligent *at the moment you performed them*. Your level of carelessness, intention, and the inherent risk you took were identical. Therefore, they should deserve the *same* moral assessment (likely blame for negligence).
      *   **Intuition 2 (Consequences):** The *outcome* of Action B feels morally significant. Good consequences (a discovery, even accidental) stemming from negligence complicate things. It feels like you "profited from wrongdoing," even though the wrongdoing was identical to Action A. The luck involved in getting a useful result makes the negligence *feel* more blameworthy *because* it paid off.

  4.  **Why You Feel Worse About the Successful Batch (The Outcome Bias):**
      *   **Outcome Bias:** Humans are psychologically prone to judge decisions based on outcomes rather than the quality of the decision *at the time it was made*. The positive outcome of the second experiment makes the identical negligence *feel* more culpable. We perceive it as "getting away with it" or "being rewarded for bad behavior," which triggers guilt.
      *   **The "Benefit" Factor:** The negligence led to a tangible *benefit* (patent, money). This creates dissonance. You know the benefit wasn't *earned* through careful science; it was pure luck *on top of* negligence. Enjoying the fruits feels like complicity in the initial wrong, amplifying the guilt specifically for that instance.
      *   **Potential Harm Averted (in the failure):** The failed experiment, while negligent, resulted in no *discernible* negative consequences (nobody noticed). This lack of visible harm makes it easier to dismiss morally, even though the *risk* of harm (wasted resources, misleading data) was just as present.

  5.  **Is it "Fair" you feel worse about the success?**
      Philosophically, many thinkers (like Immanuel Kant) would argue **NO, it's not entirely fair** based purely on control. The *negligence* was the same in both cases. Luck shouldn't magically make one instance of the same fault *more* blameworthy.
      *However*, philosophers like Bernard Williams and Thomas Nagel (who famously explored moral luck) point out that this feeling is **understandable and deeply human**. Consequences *do* matter in our lived experience and our emotional responses. Feeling guilt specifically about profiting from the negligent act reflects a commendable moral sensitivity – you recognize that the good outcome doesn't erase the initial fault; it just makes the relationship between fault and result more jarring.

  **In simple terms:** You feel worse about the successful batch because of **Moral Luck**. The identical negligence *coupled with* a lucky, beneficial outcome creates a psychological and ethical tension. While the core fault was the same both times, the fact that you *benefited* from the negligence in one case makes that specific instance feel more blameworthy and triggers guilt, even though the luck involved wasn't something you controlled. Your feeling highlights the conflict between judging actions based solely on intent/control vs. the undeniable impact of consequences shaped by luck. Your intuition that both acts were equally negligent at their core is philosophically sound; the guilt about the successful one is a natural human response to the uncomfortable role luck plays in moral outcomes.
