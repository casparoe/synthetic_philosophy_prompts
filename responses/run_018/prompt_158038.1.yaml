prompt: |-
  hey i'm writing the final for my upper-level ancient philosphy seminar and i need an essay prompt plus model answer and marking scheme. i want it on Plato's view of drunkenness but deep in the weeds—not just "summarize Laws and Symposium." i cooked up this framing for the exam, call it the counter-polis thesis: Plato doesn't think wine reveals some hidden true self. instead, the symposion creates a temporary anti-polis where reason is deliberately suspended, and the city uses this inversion diagnostically—to observe how citizens behave when the law's grip is loosened, not because they show their real nature, but so the state can calabrate education to the fragility it witnesses.

  write one take-home essay question (around 1200 words, student should answer in about 90 minutes) that asks them to assess this thesis against Plato's Laws I-II, where the Athenian Stranger discusses regulated drinking parties as tests of character, and against the Symposium, where Alcibiades arrives drunk and delivers a speech that is simultaneously revealing and disruptive. they need to address three things: does the counter-polis thesis actually fit these texts? does it turn drunkenness into a civic tool rather than a moral danger? and if a culture actually adopted instutionalized drinking rituals purely as stress-tests for civic virtue—never for pleasure or celebration—would Plato think that culture made a wise choice, or has it confused a diagnostic instrument with a form of life?

  then give me a model answer in outline or bullet form: the five specific moves an A answer must make, with brief elaboration for each. finally, a marking scheme with five must-hit points, marks for each (total out of 20), and a one-line note on the classic mistake students make for each point. no bibliographies, no citation lists, no "see so-and-so." don't quote Plato verbatim—paraphrase without quotation marks. keep the tone casual like this prompt, and you can include a typo or two if it feels natural.
