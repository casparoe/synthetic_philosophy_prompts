answer: |-
  ## Draft Sestina: The Lots of Deliberation

  **(Brainstorm:**
  *   **Core Tension:** Mirror (statistical representation) vs. Forge (transformative experience). Start with Mirror's promise.
  *   **Arc:** Stanza 1-2: Representation ideal. Stanza 3-4: Transformation begins, friction emerges (silence, pressure of rule). Stanza 5-6: Limits, burdens, collapse back towards representation's fragility. Envoi: Inseparable fusion despite tension.
  *   **End-Word Shifts:** "Mirror" starts reflective, becomes distorted, then flawed. "Forge" starts hopeful, becomes arduous, then incomplete. "Voice" gains confidence, then strains. "Silence" moves from passive to active (chosen, imposed). "Rule" shifts from abstract to concrete burden. "Lot" remains mechanism but gains weight.
  *   **Meter:** Strict iambic pentameter for gravitas and oral clarity. Enjambment for natural speech flow where needed.)

  ---

  **The Sestina:**

  The civic body casts the sacred **lot**,  
  A perfect, cold statistical **mirror** held  
  To the Demos' face. The hope? To **forge**  
  From disparate clay a common **voice**  
  That speaks for all, dispelling **silence**  
  Through reasoned talk, not partisan **rule**.

  Yet governance requires more than **rule**  
  By chance alone. The drawn must bear the **lot**,  
  Not just reflect but act. The passive **mirror**  
  Must heat and hammer thought, a **forge**  
  Where raw surprise finds civic **voice**,  
  Transcending self-imposed **silence**.

  A heavy mantle, this new **silence**  
  Broken? Or deepened? Learning how to **rule**  
  Demands a skill untested. The sudden **voice**  
  Trembles with the weight of the **lot**,  
  Stammering in the unfamiliar **forge**  
  That warps the once-clear **mirror**.

  Distortion clouds the faithful **mirror**:  
  The pressure to perform breeds inner **silence**,  
  The glare of scrutiny, a scorching **forge**.  
  Can ignorance transform to wise **rule**?  
  Or is the burden of the random **lot**  
  Too great for every nascent **voice**?

  Some find conviction, lift a steady **voice**,  
  While others shrink. The fractured **mirror**  
  Shows gaps – the hesitant reject the **lot**,  
  Retreat behind a wall of chosen **silence**,  
  Distrustful of the shared attempt to **rule**,  
  Unequipped for the civic **forge**.

  The process burns: a necessary **forge**  
  To temper thought. Yet not all find their **voice**  
  Amidst the complex needs of **rule**.  
  The ideal shimmers, cracks the **mirror** –  
  Representation strained by **silence**,  
  The human cost within the **lot**.

  The **rule** by **lot** reveals its double face:
  A **mirror** flawed, a transformative **forge**.
  True **voice** contends with stubborn **silence**.

  ---

  **Execution Notes:**
  1.  **Mirror -> Forge Shift:** Starts with passive reflection ("perfect, cold statistical mirror," "reflect") shifting to active, demanding transformation ("heat and hammer thought," "warps," "temper thought").
  2.  **Voice & Silence Tension:** "Voice" begins hopeful ("common voice") but later "trembles," "stammering," with some finding it "steady" while others choose "silence" – shifting from passive absence to active refusal or inability.
  3.  **Rule's Burden:** "Rule" evolves from abstract governance ("partisan rule") to a demanding skill ("Learning how to rule") and a concrete "burden," showing its weight.
  4.  **Lot's Constancy/Double Nature:** "Lot" remains the mechanism throughout, but its implications deepen – "sacred" promise, "random" burden, "human cost," culminating in its inseparability from "rule" in the envoi.
  5.  **Collapse:** Stanza 5 ("Distortion clouds," "fractured mirror," "gaps," "hesitant reject") and Stanza 6 ("burns," "ideal shimmers, cracks," "strained," "human cost") explicitly show the instability and challenge, pulling back from pure transformation idealism.
  6.  **Envoi:** Explicitly pairs "rule by lot" and places the core tension ("mirror flawed" / "transformative forge") alongside the struggle ("voice contends with stubborn silence").
  7.  **Meter:** Predominantly iambic pentameter (da-DUM x5). Lines like "To the Demos' face. The hope? To **forge**" or "Unequipped for the civic **forge**." maintain the rhythm while accommodating natural phrasing.
