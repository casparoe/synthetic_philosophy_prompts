prompt: |-
  I serve as the compliance referee for a regional cooperative land trust that retains collective ownership of underlying parcels while assigning long-term occupancy rights to individual households. Members regularly propose to transfer, sublease, consolidate, or sell these rights, and I must approve or reject each proposal according to the collective's founding charter. The charter requires that every holding be evaluated through three lenses drawn from entitlement theory: whether the original assignment was free of coercion or theft (justice in acquisition); whether every link in the chain of subsequent exchanges was fully voluntary (justice in transfer); and whether documented historical exclusions from the initial allocation demand rectification before any new trade may proceed. I need a reusable decision procedure—ordered diagnostic questions, explicit pass/fail criteria, and clear stopping points—that translates this framework, including the logic of the Wilt Chamberlain argument, into something I can run in about thirty minutes per proposal without consulting a philosopher or attorney. The procedure must specify how to proceed when original records are incomplete; it must flag the exact junctures where mechanical rules end and irreducible value judgments begin (for instance, how much rectification is sufficient); and it must state what to do when voluntary exchanges have produced a highly unequal distribution of rights that some members now seek to correct through collective vote rather than through individual trade. Apply the procedure to three proposals: (1) a member seeks to sell her occupancy right to an outside buyer at a price far exceeding its initial value, having assembled the right through a long sequence of voluntary internal swaps, producing a concentration of advantage analogous to the market outcome defended in the classic argument; (2) a majority votes to impose a hard cap on holding size and redistribute surplus space, arguing that extreme inequality now undermines the cooperative's social purpose; (3) a claimant asserts that her family was wrongfully excluded from the 1970s original allocation and demands that all present trades be frozen until her rectification claim is settled, even though every current holder traces title through apparently voluntary exchanges. For each case, show where the procedure yields a definite ruling, where it stops and demands a human judgment call, and identify the ruling I will likely find politically unwelcome but must apply if the procedure is followed honestly.
reasoning: |-
  Okay, the user is a compliance referee for a land trust cooperative. They need a decision procedure based on entitlement theory to evaluate proposals about transferring occupancy rights. The charter has three lenses: justice in acquisition, justice in transfer, and rectification for historical exclusions. I need to create a reusable procedure that's efficient—about 30 minutes per case—and clearly marks where value judgments are needed. Plus, apply it to three specific proposals.

  First, I should outline the key elements from entitlement theory, especially Nozick's principles, since the user mentioned the Wilt Chamberlain argument. That argument shows how voluntary exchanges can lead to inequality, which ties into the cases they provided. The procedure must handle incomplete records and specify when mechanical rules end and judgments begin.

  The user's deeper needs are probably about reducing ambiguity and avoiding lengthy consultations. They want consistency and fairness while minimizing disputes. Politically unwelcome rulings might cause tension, so the procedure needs to be defensible and transparent.

  For the decision procedure, I'll structure it into phases: Acquisition, Transfer, Rectification, and Final Assessment. Each phase has diagnostic questions with pass/fail criteria. Stopping points should be clear—like when records are incomplete or rectification thresholds aren't met. Value judgments come in when defining "coercion," "voluntary," or "sufficient rectification," which the cooperative must decide collectively.

  Now, applying it to the three cases:

  1. **Case 1: Selling to an outside buyer after voluntary swaps.** 
     - Acquisition: Passes if original records show no theft/coercion. 
     - Transfer: All swaps were voluntary, so passes. 
     - Rectification: If no exclusion claims, passes. 
     - Final: Approve sale. The unwelcome part is allowing inequality due to voluntary exchanges, mirroring the Wilt Chamberlain argument.

  2. **Case 2: Majority vote for redistribution.**
     - Acquisition and Transfer might pass, but Rectification could flag historical issues. However, the key is that collective action (vote) overrides individual transfers. The procedure likely stops at Phase 4, requiring a judgment on whether the vote aligns with the charter. Ruling against redistribution might upset members wanting equality.

  3. **Case 3: Claimant demands freeze for historical exclusion.**
     - Rectification Phase: If records are incomplete, it's a judgment call. If the claim is valid, trades freeze until rectification. Unwelcome if current holders are affected despite clean transfer chains.

  Need to ensure the procedure is practical. For example, in rectification, defining "sufficient rectification" requires cooperative input. Also, handling incomplete records by using best evidence and noting uncertainty.

  Overall, the procedure must balance philosophical principles with real-world constraints, providing clear steps while highlighting where democratic decisions or value judgments are necessary. This helps the referee act consistently and transparently, even in contentious situations.
answer: |-
  Here is a reusable decision procedure based on entitlement theory, designed for efficiency and clarity. It follows a phased approach with explicit pass/fail criteria, stopping points, and flags for value judgments. The procedure assumes you have access to the trust's membership records, transaction history, and charter.

  ---

  ### **Decision Procedure: Entitlement Evaluation for Occupancy Rights Transfers**
  **Time Allocation:** 5 min/Acquisition, 10 min/Transfer, 10 min/Rectification, 5 min/Final Assessment  
  **Tools Needed:** Proposal documentation, chain-of-title records, historical allocation logs, rectification claims database.

  #### **Phase 1: Justice in Acquisition**  
  *Diagnostic Questions:*  
  1. Is the *original allocation* of the holding(s) in question documented in the trust’s official records?  
     - **Pass:** Records exist and show allocation via charter-defined process (e.g., lottery, need-based).  
     - **Fail/Inconclusive:** Records missing, ambiguous, or indicate force/fraud.  
     - **Stopping Point:** If Fail/Inconclusive → Proceed to Phase 3 (Rectification). Do not approve trades until resolved.  

  2. Does the documentation confirm no coercion or theft during original allocation?  
     - **Pass:** Records show consent (e.g., signed agreements, meeting minutes confirming no duress).  
     - **Fail:** Evidence of dispossession, discrimination, or violence.  
     - **Value Judgment Flag:** Defining "coercion" for historical context (e.g., economic pressure). *[Cooperative must pre-define thresholds.]*  

  #### **Phase 2: Justice in Transfer**  
  *Diagnostic Questions:*  
  3. Is every exchange in the chain of custody (from original allocation to current holder) documented as voluntary?  
     - **Pass:** All transfers have signed agreements, meeting quorum approvals, and no evidence of duress.  
     - **Fail/Inconclusive:** Gaps in the chain, unsigned forms, or claims of manipulation.  
     - **Stopping Point:** If Fail → Reject proposal. If Inconclusive → Proceed to Phase 3.  

  4. Do all transfers comply with charter rules (e.g., no unauthorized subleasing)?  
     - **Pass:** Transfers align with charter terms (e.g., internal swaps only, no monetization).  
     - **Fail:** Violations found (e.g., unapproved sublease). → **Reject proposal.**  

  #### **Phase 3: Rectification for Historical Injustice**  
  *Diagnostic Questions:*  
  5. Are there active, documented claims of wrongful exclusion affecting the holding(s)?  
     - **Pass:** No claims exist or all claims resolved per charter. → Proceed to Phase 4.  
     - **Fail:** Valid claim(s) pending. → **Freeze all trades** for affected holdings until resolved.  

  6. If records are incomplete, does available evidence suggest probable injustice?  
     - **Pass:** Due diligence shows no credible indicators of exclusion (e.g., allocation matched census data).  
     - **Fail/Inconclusive:** Evidence of systemic exclusion (e.g., racial/gender bias in 1970s records).  
     - **Value Judgment Flag:** Determining "sufficient rectification." *[Cooperative must define reparative actions (e.g., land grants, compensation) and thresholds.]*  

  #### **Phase 4: Final Assessment & Conflict Resolution**  
  7. Does the proposal conflict with other charter principles?  
     - **Pass:** Proposal aligns with all charter clauses. → **Approve proposal.**  
     - **Conflict:** Proposal violates charter (e.g., introduces inequality). → **Reject proposal.**  
     - **Value Judgment Flag:** Charter interpretation (e.g., "social purpose" clauses). *[Requires collective governance input.]*  

  8. If a majority vote seeks redistribution:  
     - **Pass:** Vote follows charter amendment procedures. → **Approve redistribution.**  
     - **Fail:** Vote attempts to override individual entitlements without charter authority. → **Reject vote action.**  
     - **Stopping Point:** Entitlement principles prioritize voluntary transfers over forced equality. *[Wilt Chamberlain logic: Voluntary exchanges legitimize inequality.]*  

  ---

  ### **Application to Proposals**  
  **Case 1: Sale to Outsider After Voluntary Swaps**  
  - **Phase 1 (Acquisition):** Records show original allocation was fair. → **Pass.**  
  - **Phase 2 (Transfer):** All swaps documented and voluntary. → **Pass.**  
  - **Phase 3 (Rectification):** No active claims. → **Pass.**  
  - **Phase 4 (Final):** Sale violates charter’s "no external transfers" clause. → **Reject.**  
  - **Definite Ruling:** Reject sale (charter violation).  
  - **Value Judgment:** None needed—mechanical rule applies.  
  - **Politically Unwelcome:** Rejecting a lucrative sale despite clean transfer history (upholds Chamberlain logic: inequality is permissible if voluntary).  

  **Case 2: Majority Vote for Redistribution Cap**  
  - **Phase 1/2:** Holdings have clean acquisition/transfer history. → **Pass.**  
  - **Phase 3:** No rectification claims. → **Pass.**  
  - **Phase 4:** Vote conflicts with entitlement principles (forced redistribution without consent). → **Reject vote action.**  
  - **Stopping Point:** Phase 4 requires charter interpretation.  
  - **Value Judgment:** Does the charter allow majority votes to override individual rights? If not, rejection is mandatory.  
  - **Politically Unwelcome:** Rejecting redistribution despite inequality (per Chamberlain: voluntary exchanges > equality).  

  **Case 3: Freeze Trades for Historical Rectification Claim**  
  - **Phase 1 (Acquisition):** Records incomplete for claimant’s family. → **Inconclusive → Proceed to Phase 3.**  
  - **Phase 3:** Claimant provides evidence of exclusion (e.g., 1970s eligibility list omission). → **Fail.**  
  - **Definite Ruling:** Freeze all trades for affected holdings until rectification.  
  - **Value Judgment:** Assessing "sufficient rectification" (e.g., compensation vs. land grant). Cooperative must decide.  
  - **Politically Unwelcome:** Freezing trades penalizes current holders despite clean transfer chains.  

  ---

  ### **Key Notes for Implementation**  
  - **Incomplete Records:** Default to Phase 3 rectification. Use best available evidence (oral histories, census data) but note uncertainty.  
  - **Value Judgment Triggers:** Document when passing judgment (e.g., "Defined coercion threshold as X based on Y").  
  - **Wilt Chamberlain Logic:** Voluntarily achieved distributions are valid even if unequal—redistribution requires consent or charter amendments.  
  - **Efficiency Tips:** Pre-screen proposals for obvious charter violations; use templates for common scenarios.  

  This procedure enforces entitlement theory’s core tenets while isolating subjective decisions. Politically difficult outcomes (e.g., permitting inequality or freezing trades) stem from prioritizing voluntary exchange and rectification over equality or expediency—essential for a charter-based system.
