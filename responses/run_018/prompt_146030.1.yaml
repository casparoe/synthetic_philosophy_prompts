answer: |-
  Here is the specification of adequacy for criteria/frameworks in historical Jesus research, addressing your requirements:

  **Desiderata for an Adequate Framework of Authenticity Criteria:**

  1.  **Phenomena Classification:**
      *   **Desideratum:** Correctly classify diverse historical data types: explicit sayings, implicit teachings, narrated actions, symbolic acts, biographical details, audience reactions, and patterns of controversy.
      *   **Motivation:** Jesus tradition includes parables, aphorisms, healings, conflicts, travel narratives, and passion accounts. A framework must handle this variety without forcing homogeneity. (e.g., classifying the *nature* of a healing story vs. a kingdom parable).
      *   **Settled:** The *range* of data types needing classification is broadly agreed upon.
      *   **Contested:** The relative *weight* or probative value assigned to different data types is highly contested.

  2.  **Core Distinctions:**
      *   **a) Authentic to Jesus vs. Historically Accurate about 1st-Century Judea:**
          *   **Desideratum:** Preserve the distinction between material originating with Jesus and material that accurately depicts the historical context *even if not originating with him*.
          *   **Motivation:** Early Christian sources contain accurate depictions of Herodian rulers, Pharisees, Sadducees, Roman practices, and Galilean village life. An accurate description doesn't prove Jesus said/experienced it (e.g., accurate portrayal of Pilate doesn't prove the *specific dialogue* in the Gospels is verbatim). The framework must avoid conflating contextual accuracy with dominical origin.
      *   **b) Dissimilarity from Nascent Christianity vs. Coherence with Galilean Judaism:**
          *   **Desideratum:** Preserve the crucial, often tense, distinction between material that diverges from early Christian theology/practice *and* material that aligns with reconstructed 1st-century Galilean Jewish beliefs and practices.
          *   **Motivation:** The "Criterion of Dissimilarity" seeks unique Jesus material by eliminating what aligns with either Judaism *or* early Christianity. However, Jesus *was* a 1st-century Jew; authentic material *must* cohere with that context. The framework must navigate this tension without automatically privileging dissimilarity or collapsing coherence into mere conventionality (e.g., Jesus' interpretation of Sabbath laws must be plausible within Jewish debate yet potentially distinctive).
          *   **Flagged Tension:** This distinction embodies the **core joint unsatisfiability concern**: Demanding *both* dissimilarity from Judaism *and* dissimilarity from Christianity risks creating a "Jesus" alien to his time and whose legacy is inexplicable. Coherence with Judaism is essential for plausibility, yet risks masking what was distinctive about Jesus. Frameworks struggle to balance these inherently competing demands.
      *   **c) Partial Authenticity (Core) vs. Entirely Free of Later Redaction:**
          *   **Desideratum:** Preserve the distinction between traditions containing an authentic kernel (saying, event, motif) embedded within later interpretive layers or development, and traditions that are entirely creations of the early church.
          *   **Motivation:** Oral transmission and communal memory inherently involve interpretation and adaptation. A framework must allow for identifying authentic *elements* within developed traditions without requiring pristine, unaltered units (e.g., recognizing an authentic parable core within a Gospel framing that adds allegorical interpretation or specific audience).

  3.  **Methodological Constraints:**
      *   **a) Consistency with Aramaic Oral Transmission Dynamics:**
          *   **Desideratum:** Respect the characteristics of oral tradition in a primarily Aramaic-speaking milieu: flexibility in exact wording, variation in performance, memorization of core gist/theme/structure, use of mnemonic devices (parallelism, alliteration, assonance, rhythm), and thematic clustering.
          *   **Motivation:** The Synoptic Problem and textual variants demonstrate variation. Criteria relying on specific Greek wording or linear, verbatim transmission models are flawed. Authenticity assessment must focus on gist, structure, and memorable core (e.g., assessing the beatitudes' core message vs. specific Greek phrasing).
      *   **b) Consistency with Social Formation of Early Christian Communal Memory:**
          *   **Desideratum:** Respect how groups collectively remember, shape, and utilize the past for identity formation, legitimation, instruction, and worship. This includes processes of selection, interpretation, narration, and stabilization over time within specific communities.
          *   **Motivation:** Traditions weren't preserved in a vacuum but by communities with needs. A framework must function *within* this reality, acknowledging that memory is constructive and functional, not merely reproductive (e.g., understanding why certain controversies or sayings were preserved and shaped).

  4.  **Niche Requirement: Accounting for Strategic Communal Memory:**
      *   **Desideratum:** Incorporate the reality that traditions were selectively preserved, emphasized, interpreted, and potentially shaped (not necessarily fabricated wholesale) to serve group needs (e.g., boundary marking, internal cohesion, apologetics, ethical instruction, liturgical use) – **without** this possibility leading to a default conclusion that *all* material is solely a product of later community interests, rendering authenticity criteria meaningless.
      *   **Motivation:** Groups actively use the past. The framework must allow analysis of *how* communal interests might have shaped a tradition (e.g., sharpening anti-Pharisaic elements post-70 CE; emphasizing inclusion of Gentiles) while still providing tools to argue for *some* underlying historical stimulus or core originating with Jesus that was *adapted*. It must avoid both naive literalism *and* corrosive skepticism.

  **Scoring Existing Approaches Against Desiderata:**

  *   **Standard Multi-Criteria Approach (Dissimilarity, Embarrassment, Multiple Attestation, Coherence, Rejection/Execution, etc.):**
      *   **Strengths:** Explicitly attempts desiderata 2a, 2b (though struggles with the tension), 2c (implicitly). Handles diverse phenomena (1). Embarrassment partially addresses niche requirement (4) by highlighting material *against* early Christian interests.
      *   **Weaknesses:** Often pays lip service to 3a/3b but struggles to fully integrate orality and social memory dynamics, sometimes relying on overly literary/textual models. The core tension in 2b is its Achilles heel, often leading to an implausibly unique Jesus. Poor at systematically handling the niche requirement (4), often defaulting to skepticism or ignoring it. Criteria are often applied atomistically.
      *   **Score:** **Moderate.** Addresses core distinctions but struggles profoundly with methodological constraints and the niche requirement, and its foundational tension is unresolved.

  *   **Social-Memory Framework:**
      *   **Strengths:** Directly built on desiderata 3b and excels at the niche requirement (4), providing sophisticated tools to analyze communal shaping without *requiring* global skepticism. Naturally accommodates partial authenticity (2c) and the fluidity of oral tradition (3a). Contextual coherence (part of 2b) is central.
      *   **Weaknesses:** Often weaker on specific criteria for isolating authentic *core* material originating with Jesus (the focus of 2a, 2b). Can sometimes downplay the role of the originating figure (Jesus) in favor of communal processes. Less developed explicit tools for desideratum 1 classification beyond narrative analysis. The Dissimilarity aspect of 2b is often marginalized.
      *   **Score:** **Strong on 3a/3b/4/2c, Weaker on 1/2a/explicitly demonstrating 2b (dissimilarity aspect).** Excels at context and process, sometimes struggles with pinpointing origin.

  *   **Strictly Form-Critical Approach:**
      *   **Strengths:** Historically focused on oral transmission dynamics (3a) and classification of literary forms/genres (1 - though focused on *Gattungen*). Implicitly addresses communal setting (*Sitz im Leben*) connecting partially to 3b/4.
      *   **Weaknesses:** Traditionally skeptical of connecting forms directly to the historical Jesus (weak on 2a, 2b, 2c). Often assumed layers of community creation, struggling with the niche requirement (4) by tending towards skepticism about authentic cores. Its original focus on *pre*-literary forms often neglected the role of the historical figure *within* the traditioning process. Dissimilarity/Coherence tension not directly addressed.
      *   **Score:** **Strong on 3a/1 (form classification), Weak on 2a/2b/2c/4 (tends towards skepticism).** Good on transmission mechanics, poor on positive historical assessment.

  **Settled vs. Contested:**

  *   **Settled (Broad Consensus):**
      *   The necessity of criteria/frameworks *beyond* naive harmonization or dismissal.
      *   The existence and importance of the core distinctions (2a, 2b, 2c) as problems needing addressing.
      *   The fundamental relevance of 1st-century Jewish context (part of 2b coherence).
      *   The reality of oral transmission (3a) and communal memory processes (3b, 4).
      *   That the Gospels contain both historical information and theological interpretation/development.

  *   **Genuinely Contested:**
      *   **The Validity & Weighting of Specific Criteria:** Especially Dissimilarity vs. Contextual Plausibility/Coherence (the core tension). Is Embarrassment robust? How much does Multiple Attestation prove?
      *   **The Impact of Social Memory on Validity:** Can robust criteria for authentic *dominical origin* exist *within* a social memory framework, or does social memory inevitably shift focus away from "what Jesus actually said/did" towards "how he was remembered"? (Directly impacts the niche requirement balance).
      *   **The Reconstructability of the Historical Jesus:** How much confidence, if any, can be placed in reconstructions? This underlies the entire enterprise.
      *   **The Role of the Gospel of John:** Is it a viable source for authentic Jesus material using standard criteria, or primarily theological interpretation?
      *   **The "Default" Position:** Should the burden of proof lie on demonstrating authenticity or inauthenticity?

  This specification highlights the inherent tensions, particularly the methodological tightrope walk required between acknowledging communal shaping and maintaining the possibility of identifying authentic tradition, all while respecting the constraints of orality and the demands of historical context. No current framework perfectly balances all desiderata, with the standard approach and social memory framework representing the most developed, yet still contested, paths forward.
