answer: |-
  Below is a comprehensive plan for your 90-minute seminar on rational agency and machine intelligence, designed as a paper-only game where teams submit "programs" to play a Prisoner's Dilemma tournament. The plan includes a tiny, hand-evaluable programming language, tournament structure, incentives, a perturbation round, debrief points, a practical timeline, materials list, and candid assessment of pitfalls. The language and interpreter are engineered to handle recursion limits (e.g., mutual simulation attempts) and emphasise intensionality (syntax vs. behaviour). Crucially, the term "program equilibrium" is withheld until the debrief to ensure discovery through experience.

  ---

  ### **I. Rules and Object Language: The Program Interpreter**
  **Language Design:**  
  A minimal functional language called **TinyStrategy** is used. Programs are decision trees of up to 5 clauses (written on index cards). Teams define strategies by checking predicates about the opponent's program text and returning `COOPERATE` (C) or `DEFECT` (D). The language uses atomic tokens for conditions to keep evaluation simple.

  - **Syntax (Handout Excerpt):**  
    ```plaintext
    PROGRAM  := [CLAUSE]... "ELSE:" ACTION  
    CLAUSE   := CONDITION ":" ACTION  
    CONDITION := "O_AC_C" | "O_AC_D" | "O_AD_C" | "O_AD_D" | "O_SELF_C" | "O_SELF_D" | "LEN_<N>"   (e.g., "LEN_3")  
    ACTION   := "C" | "D"  

    MEANINGS:  
    - O_AC_C: "Does opponent return C when facing ALWAYS_C?"  
    - O_AC_D: "Does opponent return D when facing ALWAYS_C?"  
    - O_AD_C: "Does opponent return C when facing ALWAYS_D?"  
    - O_AD_D: "Does opponent return D when facing ALWAYS_D?"  
    - O_SELF_C: "Does opponent return C when facing ITSELF?"  
    - O_SELF_D: "Does opponent return D when facing ITSELF?"  
    - LEN_<N>: "Is opponent's program length < N tokens?" (tokens = space-separated words)  

    FIXED PROGRAMS:  
    - ALWAYS_C: Returns "C" for any input.  
    - ALWAYS_D: Returns "D" for any input.  
    ```

  - **Interpreter Semantics (Key for Referees):**  
    - **Input:** A program (string of tokens) and an opponent's program (string).  
    - **Recursion Depth Limit:** 3 (prevents infinite loops from mutual simulation).  
    - **Evaluation Rules:**  
      1. If depth > 3, return "D" (avoids stack overflow; simulates bounded rationality).  
      2. If input is "ALWAYS_C", return "C"; if "ALWAYS_D", return "D" (handles fixed programs).  
      3. Else, split the program into clauses. Check conditions in order:  
         - For `O_*` conditions: Run the opponent’s program on the test input (e.g., "ALWAYS_C") at depth+1.  
         - For `O_SELF_*`: Opponent is run on **itself** (input = opponent's text) at depth+1.  
         - For `LEN_<N>`: Count tokens in the opponent's program.  
      4. Return the action of the first matching condition. If none, return the ELSE action.  
    - **Legitimate Input:** Only the opponent's program text (a string) is visible—no access to runtime state.  

  **Handling Simulation and Regress:**  
  Students will instinctively write programs with `O_SELF_*` to simulate the opponent. When mutual simulation occurs (e.g., both check `O_SELF_C`), the depth limit triggers:  
  - At depth 3, evaluation returns "D", causing the original condition to fail.  
  - **What students see:** Cooperation attempts "mysteriously" fail if they rely on deep recursion. This forces them to use shallower checks (e.g., `O_AC_C`) for robust cooperation.  

  ---

  ### **II. Incentives: Payoffs and Complexity Tax**
  **Prisoner's Dilemma Payoffs (Base Game):**  
  |                     | Opponent Cooperates | Opponent Defects |  
  |---------------------|---------------------|------------------|  
  | **You Cooperate**   | 3 (reward)         | 0 (sucker’s)    |  
  | **You Defect**      | 5 (temptation)     | 1 (punishment)  |  

  **Tournament Scoring:**  
  - **Absolute points (not rank-based):** Total points across all rounds, minus complexity tax.  
    - **Justification:** Rank-based scoring encourages defection (as mutual defection = 1 point, which is "safe" if all defect). Absolute points reward cooperation clusters (e.g., two cooperators score 3 each, beating two defectors at 1 each). This makes cooperation viable if teams can identify compatible partners.  
  - **Complexity Tax:** Subtract 2 points per condition clause (not including ELSE) from the team’s total score.  
    - **Purpose:** Makes visible the trade-off between robustness and simplicity. A program like `ELSE: D` (0 clauses, tax=0) is cheap but inflexible; one with 4 clauses pays 8 points but might earn more by cooperating selectively.  

  ---

  ### **III. Game Structure: Rounds and Pairings**
  **Teams:** 8 teams of 2 students each.  
  **Rounds (4 scored + 1 unscored perturbation round):**  
  1. **Rounds 1–3 (Scored):** Pair programs randomly (3 distinct pairings per program).  
  2. **Round 4 (Scored):** Each program plays against itself.  
  3. **Scoring per Round:** Run both programs with the opponent’s text as input. Look up payoffs from the table above.  
  4. **Perturbation Round (Unscored):**  
     - Each team’s program is altered in three ways:  
       a. **Behaviour-Preserving Rewrite:** Reorder clauses (e.g., `[O_AC_C: C, LEN_2: D]` → `[LEN_2: D, O_AC_C: C]`).  
       b. **Textually Distant Equivalent:** Rewrite clauses to identical behaviour (e.g., `O_AC_C: C` → `O_AD_D: D, ELSE: C`; both cooperate only if opponent cooperates with ALWAYS_C).  
       c. **Single-Clause Mutant:** Flip one action (e.g., `O_AC_C: C` → `O_AC_C: D`).  
     - **Process:** Teams predict outcomes against ALWAYS_C, ALWAYS_D, and SELF for each mutant. Referee runs them to reveal discrepancies.  
     - **Diagnosis:** Highlights intensionality—programs react to syntax (e.g., `O_AC_C` vs. `O_AD_D`), not just behaviour. Students "feel" syntax-dependence when predictions fail.  

  ---

  ### **IV. Debrief: Mapping Experiences to Concepts**
  **Order of Ideas (Linked to Session Events):**  
  1. **Mutual Defection Remains an Equilibrium (5 mins):**  
     - *Trigger:* Tournament results (likely many defections).  
     - *Point:* If all defect, no one gains by cooperating unilaterally (you get 0 vs. 1). Nash equilibrium persists because programs are chosen simultaneously—no incentive to deviate if others won’t reciprocate.  
  2. **Intensional Objects of Choice (3 mins):**  
     - *Trigger:* Perturbation round (e.g., textually distant equivalent caused unexpected defection).  
     - *Point:* Programs choose based on the opponent’s *syntax* (text), not just behaviour. This allows "signalling" (e.g., `O_SELF_C` as a cooperation token) but risks brittleness.  
  3. **Bounded Proof Search (4 mins):**  
     - *Trigger:* Failed `O_SELF_*` conditions due to depth limits.  
     - *Point:* The depth limit simulates bounded rationality. Cooperation emerges if teams use shallow, mutually reinforcing checks (e.g., both check `O_AC_C`).  
       - *Reconstructability:* Most students will grasp the "shallow mutual check" trick (e.g., "If you cooperate with ALWAYS_C, I cooperate"). The depth limit’s role might need brief clarification.  
  4. **Choosing Dispositions (3 mins):**  
     - *Bridge:* "Your program *is* a disposition—it encodes how you respond to others’ constitutions. This mirrors ancient ideas (e.g., Ulysses tying himself to the mast to resist temptation), but for algorithms: you choose rules, not acts."  

  ---

  ### **V. Practicalities: Timeline, Materials, and Pitfalls**
  **Timeline (90 Minutes):**  
  - **0–10 mins:** Introduction (rules, language, payoffs). Distribute handouts.  
  - **10–30 mins:** Team program writing (on index cards).  
  - **30–40 mins:** Round 1 (pair 4 random teams; resolve and record scores).  
  - **40–50 mins:** Round 2 (re-pair; resolve).  
  - **50–60 mins:** Round 3 (re-pair; resolve).  
  - **60–65 mins:** Round 4 (run against self; resolve).  
  - **65–75 mins:** Perturbation round (referee creates mutants; teams predict; resolve).  
  - **75–90 mins:** Debrief (follow IV above).  

  **Materials List:**  
  - **Per Team:** 1 index card (for program), 1 handout (language rules + interpreter).  
  - **Referee:** Scoring grid (whiteboard or poster), pen, spare index cards (for mutants).  
  - **Handout Content:** Syntax, interpreter rules, and examples (see **I. Rules** above).  

  **Predictable Failure Modes and Mitigation:**  
  1. **Invalid Programs:** Non-coders write malformed clauses (e.g., missing ELSE).  
     - *Mitigation:* Circulate during writing; provide templates (e.g., "Use: [CONDITION]: [ACTION]").  
  2. **Slow Hand-Evaluation:** Complex clauses or depth chains take >1 minute.  
     - *Mitigation:* Use student volunteers as referees; pre-calculate ALWAYS_C/ALWAYS_D outcomes.  
  3. **Perturbation Confusion:** Students miss behavioural equivalence in textually distant mutants.  
     - *Mitigation:* Use a demo team to show one mutant; emphasise "same behaviour, different text."  
  4. **Defection Dominates Early:** Teams default to `ELSE: D` for safety.  
     - *Mitigation:* After Round 1, highlight a cooperative pair’s high score to incentivise risk-taking.  

  **Unreproducible Concept:**  
  - **The "Full" Program Equilibrium:** The game cannot show how unbounded programs use formal proofs (not syntax checks) to verify mutual cooperation. TinyStrategy’s depth limit and atomic predicates are crude approximations. **Supply in Debrief:** "Real agents use logical proofs to check for cooperative peers, not text. This avoids brittleness but requires computational resources we abstracted away."  

  ---

  This plan balances discovery, constraints, and pedagogy. Students experience cooperation’s fragility and intensionality firsthand, setting up your debrief without premature jargon. Use the perturbation round to make syntax-behaviour distinctions visceral, and emphasise that defection remains rational—cooperation is viable only under specific, mutually reinforcing conditions.
