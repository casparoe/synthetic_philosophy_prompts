prompt: |-
  I work as a senior review officer at a bilateral development agency, and every quarter my unit must sign off on country-level causal narratives submitted by field offices—reports that claim a specific factor (institutions, geography, culture, or some interaction) explains why one nation is wealthy or poor relative to peers. We cannot run new regressions; we have about two hours per report, access only to the document and standard reference tables, and we must issue a formal pass, conditional pass, or reject with written justification. The reports routinely confuse correlation with mechanism, treat historical contingency as deterministic, and slide from “this factor is present in rich countries” to “this factor caused the richness.” I need a reusable evaluation procedure—an ordered sequence of tests with explicit pass/fail/uncertain criteria—that my reviewers can apply without being philosophers or econometricians.

  The procedure must be built around the specific methodological limits of macro-historical causal inference: the problem of overdetermination at the national-unit level, the instability of counterfactuals when the “intervention” is an institution or cultural pattern rather than a discrete treatment, and the distinction between a structural cause (invariant across time for that unit) and a configurational cause (dependent on interaction with other units). Design the steps in order, stating for each what counts as a sufficient answer, where the procedure stops with an outright rejection (especially for what we call “galactic overdetermination”—asserting one dominant cause when the record shows multiple sufficient pathways), and where it must hand the decision to a human reviewer because the issue is one of values or interpretive judgment rather than logic or evidence. Include a specific “downgrade” pathway: when a claim survives but only by retreating to a weaker, non-causal formulation such as “facilitating condition” or “enabling context.”

  Then apply the procedure to three submitted narratives. First, a report arguing that Norway’s wealth is primarily caused by its early adoption of parliamentary institutions, comparing it only to Denmark and Sweden. Second, a report arguing that Mali’s poverty is geographically determined by landlockedness and tropical climate, treating colonial institutional disruption as a secondary interaction effect. Third, a report arguing that Japan’s post-war growth was culturally caused by “group-oriented values”; here the procedure should yield an answer the field office will resist—specifically, that the claim must be downgraded not because culture is irrelevant, but because the counterfactual required to establish national-level causation is historically unstable, forcing the report into the “facilitating condition” category.

  Finally, state precisely what the procedure cannot do: which kinds of unconventional but valid arguments it will systematically misclassify, what questions about distributive justice or policy priority it leaves entirely untouched, and why it is a filter for narrative coherence rather than a substitute for empirical research design. Mark every point where judgment is ineliminable, and include one worked example of each kind of outcome—pass, conditional pass with downgrade, and reject.
reasoning: |-
  We are designing a reusable evaluation procedure for country-level causal narratives. The procedure must be systematic and applicable by reviewers without advanced training in philosophy or econometrics. The steps are ordered and include explicit criteria for pass, conditional pass (with downgrade), or reject. We are particularly concerned with:
   - Confusing correlation with mechanism
   - Treating historical contingency as deterministic
   - Overdetermination (especially "galactic overdetermination" - asserting one dominant cause when multiple pathways exist)
   - The distinction between structural causes (invariant) and configurational causes (dependent on interactions)

   The procedure must also account for:
   - The problem of overdetermination at the national-unit level
   - Instability of counterfactuals when the "intervention" is an institution or cultural pattern
   - The need to downgrade to a weaker, non-causal formulation when necessary

   Steps of the Procedure:

   1. **Identify the Claimed Cause and Effect**
      - Extract the specific cause (C) and effect (E) from the narrative. The effect must be a national-level outcome (e.g., wealth, poverty). The cause must be a factor (institution, geography, culture, or interaction).
      - *Sufficiency*: The report must clearly state C and E. If not, reject with reason: "Unclear causal claim."
      - *Stop and reject* if the cause is described in a way that is tautological (e.g., "rich countries have high GDP") or if the effect is not a national-level outcome.

   2. **Check for Basic Causal Structure**
      - Does the narrative provide a mechanism (M) that explains how C leads to E? A mechanism must be a process or set of steps that connect C to E.
      - *Sufficiency*: The report must describe at least one plausible mechanism. If it only states that C is correlated with E without a mechanism, then reject with reason: "Correlation without mechanism."
      - *Note*: A mechanism must not be circular (e.g., "wealth causes wealth") and must be non-tautological.

   3. **Evaluate Counterfactual Stability**
      - The report must consider a counterfactual: What would happen to E if C were absent or different? Given that C is often a macro-historical factor (like an institution or culture), we must assess the stability of the counterfactual.
      - *Criteria*: 
          - If the counterfactual is clearly specified and historically plausible (i.e., there are examples of similar countries without C and with different E), then proceed.
          - If the counterfactual is unstable (i.e., it requires changing multiple interrelated factors, or there are no historical examples, or the change in C would lead to many possible outcomes), then the claim must be downgraded to a facilitating condition (see step 6).
      - *Sufficiency*: If the report fails to address the counterfactual at all, it is a conditional pass at best (downgrade likely) but we proceed to step 4. However, if the report makes a deterministic claim (e.g., "without C, E would never occur") and the counterfactual is unstable, then we must downgrade or reject.
      - *Stop and reject* only if the counterfactual is entirely implausible (e.g., changing geography) and the report insists on a direct causal link? Actually, we don't reject at this step because geography might be a structural cause. Instead, we note the instability and move to step 6 for downgrade.

   4. **Check for Overdetermination (Galactic Overdetermination)**
      - The report must consider alternative causes (A) that could have led to E. If there are multiple sufficient pathways to E (i.e., E can occur via different causes in different countries), then asserting that C is the primary cause in the target country is problematic.
      - *Criteria*:
          - If the report acknowledges and rules out (or controls for) at least one major alternative cause that is known in the literature, then it passes this step.
          - If the report ignores well-known alternative causes (e.g., for Norway's wealth: oil, for Mali's poverty: colonial history, for Japan's growth: US aid, industrial policy) then it fails.
      - *Stop and reject*: If the report asserts C as the primary cause when the historical record shows that E occurred in comparable cases without C, or when there are multiple causes that are each sufficient (galactic overdetermination), then reject with reason: "Galactic overdetermination: multiple sufficient pathways exist, and the report fails to establish the primacy of C."

   5. **Distinguish Structural vs. Configurational Causes**
      - The report must address whether C is a structural cause (works in isolation, invariant) or configurational (depends on interactions with other factors). 
      - *Criteria*:
          - If C is presented as structural but the narrative itself shows interaction with other factors, then the claim must be downgraded to configurational and then we must check if the interaction is properly specified (step 6).
          - If C is configurational, the report must specify the necessary co-factors and the context. If it does not, then the claim is incomplete and must be downgraded or conditionally passed with a requirement to specify.
      - *Sufficiency*: The report must either (a) show that C is structural and invariant, or (b) specify the configuration. If it does neither, then conditional pass with downgrade to a facilitating condition (because without the configuration, C alone is not sufficient).

   6. **Downgrade Pathway: Facilitating Condition**
      - If the claim fails to meet the criteria for direct causation at steps 3 (counterfactual instability), 4 (overdetermination), or 5 (configurational without specification), but the factor C is still relevant, then the claim must be downgraded to a non-causal role (e.g., facilitating condition, enabling context, necessary but not sufficient).
      - *Criteria*: 
          - The report must be revised to state that C is not the cause but a facilitating condition. This is a conditional pass.
          - If the report already uses such language (e.g., "played a role", "contributed to", "enabled"), then it passes but we note that the causal claim is weak.

   7. **Human Judgment Required: Values and Interpretation**
      - Some issues require human judgment and cannot be resolved by the procedure:
          - When the evidence is ambiguous and the report's interpretation is one of several possible, the reviewer must decide based on plausibility.
          - When the report makes normative claims (e.g., about distributive justice) or policy priorities, these are outside the scope of causal inference and must be flagged for human review.
          - When the causal factor is inherently unobservable (e.g., culture as a residual explanation) and the evidence is indirect, the reviewer must judge the strength of the indirect evidence.

      *Criteria*: At this step, the procedure stops and the report is marked for human review. The reviewer must then decide based on the preponderance of evidence and the report's coherence.

   Now, we apply the procedure to the three examples:

   **Example 1: Norway's wealth caused by early parliamentary institutions (compared to Denmark and Sweden)**

   Step 1: Clear cause (early parliamentary institutions) and effect (wealth). Pass.

   Step 2: Mechanism? The report might argue that parliamentary institutions led to stability, property rights, and investment. If so, pass. If not, reject. We assume it does.

   Step 3: Counterfactual stability? The counterfactual: without early parliamentary institutions, Norway would be poor. But note that Norway became wealthy also due to oil (20th century) and had similar institutions to Denmark and Sweden (which are also wealthy). The counterfactual is unstable because even without early parliamentary institutions, Norway might have developed them later (like many countries) and because oil played a major role. Also, Denmark and Sweden are wealthy without the same oil resources. So the counterfactual is unstable. Therefore, we note for downgrade.

   Step 4: Overdetermination? The report ignores oil as an alternative cause and also the fact that all three Scandinavian countries are wealthy and share many institutions. It also ignores that Norway was poorer than Denmark and Sweden until the oil boom. Thus, multiple pathways: institutions might be one, but oil is another. This is galactic overdetermination (multiple sufficient pathways) and the report fails to rule out oil. Therefore, we reject at step 4. 

   *Outcome for Example 1: Reject (reason: galactic overdetermination - multiple sufficient pathways, including oil, and failure to rule out alternative causes).*

   **However, note that the report compares only to Denmark and Sweden. It doesn't consider other countries without oil? But the reviewer has access to standard references and knows about oil. So reject.**

   **Example 2: Mali's poverty determined by landlockedness and tropical climate, with colonial disruption as secondary**

   Step 1: Clear cause (landlockedness and tropical climate) and effect (poverty). Pass.

   Step 2: Mechanism? Geography might lead to poor agriculture, disease burden, and trade barriers. The report should describe these. If so, pass.

   Step 3: Counterfactual stability? The counterfactual: if Mali were not landlocked and had a temperate climate, it would be rich. But changing geography is impossible and the counterfactual is unstable because many landlocked countries are not poor (e.g., Switzerland) and many tropical countries have grown (e.g., Singapore). Also, the colonial disruption is treated as secondary, but it might be primary. Thus, the counterfactual is unstable. Downgrade pathway is likely.

   Step 4: Overdetermination? The report must consider alternative causes. It does mention colonial disruption but as secondary. However, the literature shows that colonial disruption and post-colonial policies are major factors. Also, there are examples of landlocked countries that are not poor (Switzerland, Luxembourg) and tropical countries that have grown (Botswana, Mauritius). Therefore, the report does not rule out these alternatives. Moreover, the report claims geography is the primary cause. This is galactic overdetermination because there are multiple pathways to poverty (or wealth). Reject at step 4.

   *Outcome for Example 2: Reject (reason: galactic overdetermination - multiple sufficient pathways to poverty, and the report fails to establish geography as the primary cause given counterexamples).*

   **Example 3: Japan's post-war growth culturally caused by "group-oriented values"**

   Step 1: Clear cause (group-oriented values) and effect (post-war growth). Pass.

   Step 2: Mechanism? The report might argue that group-oriented values led to high savings, labor harmony, and rapid industrialization. If so, pass.

   Step 3: Counterfactual stability? The counterfactual: without group-oriented values, Japan would not have grown. But group-oriented values are deeply embedded and changing them is a massive counterfactual. Moreover, Japan's growth also depended on US aid, the Korean War, industrial policy, and a favorable international environment. The counterfactual is unstable because we cannot isolate the effect of culture. Also, group-oriented values existed before the war but Japan was not growing at the same rate. Therefore, we must consider downgrading.

   Step 4: Overdetermination? The report ignores alternative causes such as industrial policy, US aid, and the Ministry of International Trade and Industry (MITI). There are multiple pathways to growth (e.g., South Korea without the same cultural values? But note: South Korea also has group-oriented values). However, the report does not rule out these alternative causes. Moreover, the counterfactual instability from step 3 and the existence of alternative causes suggest that culture alone is not sufficient. But we do not have clear evidence of galactic overdetermination (multiple sufficient pathways) because group-oriented values might be necessary in the Japanese case? However, without ruling out alternatives, we cannot establish primacy.

   Step 5: Distinguish structural vs. configurational: Culture is presented as a structural cause, but the narrative itself might show that it worked in conjunction with policies and external factors. The report does not specify the configuration. Therefore, the claim must be downgraded to a facilitating condition.

   Step 6: Downgrade: The claim survives only as a facilitating condition. We issue a conditional pass with the requirement to revise the language to "group-oriented values provided a facilitating context for growth, but were not the primary cause without the presence of other factors (e.g., industrial policy, international aid)."

   *Outcome for Example 3: Conditional pass with downgrade (to facilitating condition).*

   **What the procedure cannot do:**

   1. **Unconventional but valid arguments**: The procedure relies on standard reference tables and known literature. If a report makes a novel but valid argument that challenges conventional wisdom (e.g., a new mechanism that is not in the literature), the procedure might reject it at step 2 (mechanism) or step 4 (overdetermination) because it does not align with known alternatives. The procedure will systematically misclassify such arguments.

   2. **Distributive justice or policy priority**: The procedure is about causal inference. It does not address whether a factor is just or whether it should be a policy priority. For example, a report might argue that inequality is necessary for growth. The procedure would only check the causal claim, not the normative implications.

   3. **Narrative coherence vs. empirical research design**: The procedure checks the internal coherence of the narrative and its consistency with known facts, but it cannot replace a well-identified research design. It cannot, for example, detect omitted variable bias if the omitted variable is not in the standard references.

   **Worked examples of each outcome:**

   1. **Pass Example**: A report claims that Botswana's wealth (relative to neighbors) is due to its strong institutions, particularly property rights for diamond mining. 
       - Step 1: Clear cause (strong institutions) and effect (wealth). 
       - Step 2: Mechanism: institutions → secure property rights → investment in mining → wealth. 
       - Step 3: Counterfactual: without strong institutions, Botswana would be like its neighbors (Zimbabwe, Zambia) which are poorer. Historically plausible. 
       - Step 4: It considers alternative causes (geography? same region; culture? similar; but institutions differ). Rules out alternatives. 
       - Step 5: Institutions are configurational? But the report shows they are the key difference. 
       - Outcome: Pass.

   2. **Conditional Pass with Downgrade Example**: A report claims that the presence of coal caused the Industrial Revolution in Britain.
       - Step 1: Clear cause (coal) and effect (Industrial Revolution). 
       - Step 2: Mechanism: coal provided cheap energy for steam engines. 
       - Step 3: Counterfactual: without coal, no Industrial Revolution? But other countries had coal and did not have an industrial revolution at the same time (e.g., China). So unstable. 
       - Step 4: Overdetermination? The Industrial Revolution also required institutions, scientific advances, etc. The report does not rule these out. 
       - Step 5: Coal is a structural cause? No, because it requires complementary factors. 
       - Step 6: Downgrade to facilitating condition: coal was a necessary resource but not sufficient without other factors. 
       - Outcome: Conditional pass with downgrade.

   3. **Reject Example**: A report claims that the Protestant ethic caused the rise of capitalism in Europe, comparing only Protestant and Catholic countries and ignoring other regions.
       - Step 1: Clear cause (Protestant ethic) and effect (capitalism). 
       - Step 2: Mechanism: work ethic and savings. 
       - Step 3: Counterfactual: without Protestantism, no capitalism? But capitalism developed in Catholic Italy (Renaissance) and in non-Christian countries (e.g., Japan). Unstable? 
       - Step 4: Overdetermination: multiple pathways (e.g., Dutch and English capitalism vs. Italian city-states). The report ignores the Italian case and non-European cases. Galactic overdetermination. 
       - Outcome: Reject (galactic overdetermination).

   **Ineliminable Judgment Points**:

   - Step 2: Judging whether a mechanism is "plausible" requires domain knowledge.
   - Step 3: Assessing counterfactual stability and historical plausibility.
   - Step 4: Deciding which alternative causes are "well-known" and must be addressed.
   - Step 7: Any point that requires human judgment (as noted above).

   This procedure is a filter for narrative coherence and basic methodological soundness. It does not prove causation but ensures that the narrative meets minimum standards for causal reasoning.
answer: |-
  ### **Reusable Evaluation Procedure for Causal Narratives**  
  This procedure is a sequential checklist for reviewers. It prioritizes methodological rigor over subject-matter expertise, with explicit decision rules. Steps must be followed in order; termination occurs at first rejection or downgrade. "Standard reference tables" include World Bank/IMF datasets, historical indices (e.g., Polity IV), and academic consensus (e.g., Acemoglu-Robinson on institutions).

  ---

  #### **Step 1: Claim Clarity Check**  
  **Purpose**: Ensure the narrative specifies a clear cause (C), effect (E), and comparator countries.  
  **Test**:  
  - Does the report unambiguously state:  
    (a) The factor (C: institution/geography/culture/interaction) claimed as the *primary* cause?  
    (b) The national outcome (E: wealth/poverty/growth)?  
    (c) At least 3 peer countries (similar GDP/capita, region, or historical trajectory) for comparison?  
  **Decision**:  
  - **Pass**: All elements present. Proceed to Step 2.  
  - **Reject**: Missing (a) or (b). Justification: *"Unclear causal claim."*  
  - **Conditional Pass**: Missing (c). Justification: *"Insufficient comparators. Proceed with caution."*  
  **Judgment Involved**: None. Purely descriptive.

  ---

  #### **Step 2: Mechanism Test**  
  **Purpose**: Verify the report links C to E via a plausible process, not just correlation.  
  **Test**:  
  - Does the narrative describe a *mechanism* (e.g., "parliamentary institutions → property rights → investment → wealth")?  
  - Does it avoid "correlation-to-causation" leaps (e.g., "C is present in rich countries, therefore C causes wealth")?  
  **Decision**:  
  - **Pass**: Mechanism stated without logical leaps. Proceed to Step 3.  
  - **Reject**: Mechanism absent or purely correlational. Justification: *"Correlation conflated with causation."*  
  **Judgment Involved**: Low. Mechanism plausibility assessed via logical consistency (e.g., "geography → trade costs → poverty" is logically sound; "culture → wealth" without process details is not).

  ---

  #### **Step 3: Counterfactual Stability Assessment**  
  **Purpose**: Evaluate if C’s causal role holds under historical contingency.  
  **Test**:  
  - Is the counterfactual ("Without C, E would differ") *stable*? I.e.,:  
    (a) Could C be altered independently (e.g., "remove oil" vs. "remove parliamentary systems")?  
    (b) Are there real-world examples where E occurred *without* C in peers?  
  **Decision**:  
  - **Pass**: Stable counterfactual (e.g., discrete events like wars). Proceed to Step 4.  
  - **Downgrade Pathway**: Unstable counterfactual (e.g., institutions/culture as deeply embedded factors). Justification: *"Causal claim relies on historically contingent interactions; downgrade to facilitating condition."* Proceed to Step 6.  
  - **Reject**: Counterfactual physically impossible (e.g., "remove landlockedness"). Justification: *"Non-viable counterfactual."*  
  **Judgment Involved**: Moderate. Use reference tables for historical examples (e.g., Botswana’s institutions vs. Mali’s).

  ---

  #### **Step 4: Overdetermination Screening ("Galactic Overdetermination")**  
  **Purpose**: Flag claims ignoring multiple sufficient pathways to E.  
  **Test**:  
  - Does the report acknowledge and rule out ≥1 major alternative cause (A) from standard references (e.g., for wealth: oil, colonial history, policy choices)?  
  - Does it avoid asserting C as *necessary* when peers achieved E via other paths (e.g., "All rich countries have C")?  
  **Decision**:  
  - **Pass**: Rules out ≥1 credible A. Proceed to Step 5.  
  - **Reject**: Ignores A despite evidence of multiple pathways. Justification: *"Galactic overdetermination: E has multiple sufficient causes; C’s primacy unsubstantiated."*  
  **Judgment Involved**: Low. Alternatives drawn from reference tables (e.g., Sachs for geography, Acemoglu for institutions).

  ---

  #### **Step 5: Structural vs. Configurational Cause Classification**  
  **Purpose**: Distinguish whether C operates alone (structural) or via interactions (configurational).  
  **Test**:  
  - Is C invariant and sufficient alone (structural)?  
    - *Evidence*: C consistently predicts E across time/space (e.g., geography).  
  - Or does C require co-factors (configurational)?  
    - *Evidence*: C only effective with specific conditions (e.g., "democracy + education → growth").  
  **Decision**:  
  - **Pass**: Correctly classified with evidence. Narrative ends.  
  - **Downgrade Pathway**: Misclassified structural claim (e.g., institutions presented as standalone when interaction-dependent). Justification: *"C is configurational; downgrade to context factor."* Proceed to Step 6.  
  **Judgment Involved**: Moderate. Use references (e.g., institutions as configurational per North 1990).

  ---

  #### **Step 6: Downgrade to Non-Causal Role**  
  **Purpose**: Weaken claims surviving Steps 1–5 but lacking causal strength.  
  **Test**:  
  - Can C be reframed as:  
    - *Facilitating condition* (e.g., "institutions enabled growth")?  
    - *Necessary-but-not-sufficient* (e.g., "geography constrained options")?  
  **Decision**:  
  - **Conditional Pass**: Acceptable downgrade. Justification: *"Causal claim untenable; reframe as contextual."*  
  - **Reject**: Unwillingness to downgrade (e.g., insists "C *caused* E"). Justification: *"Overstated causality."*  
  **Judgment Involved**: Low. Purely terminological.

  ---

  #### **Step 7: Human Judgment Gateway**  
  **Purpose**: Handle issues beyond methodological checks.  
  **Test**: Does the report involve:  
  - Normative claims (e.g., "colonialism was secondary")?  
  - Unobservable factors (e.g., "national psyche")?  
  - Policy prioritization (e.g., "geography fixes are futile")?  
  **Decision**:  
  - **Flag for human review**. Outcome deferred to senior staff.  
  **Judgment Involved**: High. Requires ethical/political discernment.

  ---

  ### **Application to Submitted Narratives**  
  **Reference Tools**: World Development Indicators (poverty/wealth), Maddison Project (historical growth), Standardized Colonial History Dataset.

  #### **1. Norway’s Wealth from Early Parliamentary Institutions**  
  - **Step 1**: Pass (C=institutions, E=wealth, peers=Denmark/Sweden).  
  - **Step 2**: Pass (mechanism: "parliaments → property rights → investment").  
  - **Step 3**: **Downgrade**. Counterfactual unstable: Norway’s oil wealth (post-1960s) independently explains prosperity. Impossible to isolate institutions.  
  - **Step 4**: **Reject**. Galactic overdetermination: Oil (reference: GDP/oil exports) and homogenous Nordic social policies (reference: OECD) are sufficient alternative causes. Peers lack oil but are wealthy.  
  - **Outcome**: Reject. Justification: *"Ignores oil as sufficient cause; institutions not primary."*  

  #### **2. Mali’s Poverty from Geography (Landlockedness + Climate)**  
  - **Step 1**: Pass (C=geography, E=poverty, peers=Chad/Niger/Burkina Faso).  
  - **Step 2**: Pass (mechanism: "landlockedness → high trade costs → low investment").  
  - **Step 3**: Pass (geography is structurally invariant).  
  - **Step 4**: **Reject**. Galactic overdetermination: Ignores colonial extraction (reference: Nunn 2008) and post-independence instability (reference: Acemoglu-Robinson) as sufficient causes. Counterexample: Botswana (landlocked but wealthy via institutions).  
  - **Outcome**: Reject. Justification: *"Geography overdetermined; colonial disruption is sufficient alternative cause."*  

  #### **3. Japan’s Growth from "Group-Oriented Values"**  
  - **Step 1**: Pass (C=culture, E=growth, peers=South Korea/Taiwan).  
  - **Step 2**: Pass (mechanism: "values → labor discipline → export competitiveness").  
  - **Step 3**: **Downgrade**. Counterfactual unstable: "Values" cannot be isolated from US aid (reference: Marshall Plan data), industrial policy (reference: Johnson 1982), or education. No historical example of identical values producing same growth without co-factors.  
  - **Step 5**: **Downgrade**. Culture is configurational: Requires interaction with policies/institutions (e.g., MITI industrial targets).  
  - **Step 6**: **Conditional Pass**. Downgrade to: *"Group-oriented values facilitated growth in synergy with policy/institutions."*  
  - **Outcome**: Conditional pass. Justification: *"Causal claim downgraded to facilitating condition due to configurational nature and unstable counterfactual."*  
  - **Field Office Resistance**: Expected. Procedure forces retreat from "culture caused growth" to "culture enabled growth."

  ---

  ### **Limits of the Procedure**  
  1. **Systematic Misclassification**:  
     - **Valid but unconventional arguments** (e.g., "chaos theory in development") rejected at Step 2 for lacking "standard" mechanisms.  
     - **Complex interactivity** (e.g., "institutions × geography × culture") may be downgraded at Step 5 despite validity.  

  2. **Untouched Questions**:  
     - **Distributive justice**: Does growth from exploitative institutions "count"? (Step 7).  
     - **Policy prioritization**: Should Mali focus on geography or institutions? (Requires cost-benefit analysis).  

  3. **Filter, Not Research Design**:  
     - **False negatives**: Rejects novel but sound claims if unsupported by reference tables (e.g., new institutional metrics).  
     - **No empirical testing**: Cannot resolve omitted variable bias or endogeneity; only checks narrative coherence.  

  ---

  ### **Worked Examples of Outcomes**  
  1. **Pass**:  
     - *Claim*: Botswana’s wealth stems from inclusive post-colonial institutions (vs. Zimbabwe/Zambia).  
     - **Procedure**: Step 1 (pass), Step 2 (mechanism: "property rights → diamond revenue management"), Step 3 (stable counterfactual: Zimbabwe’s institutions → poverty), Step 4 (rules out geography via peer deserts), Step 5 (structural institutions).  
     - **Outcome**: Pass.  

  2. **Conditional Pass (Downgrade)**:  
     - *Claim*: India’s growth caused by English-language proficiency.  
     - **Procedure**: Step 1 (pass), Step 2 (mechanism: "English → IT exports"), Step 3 (downgrade: counterfactual unstable; growth also requires infrastructure/education), Step 6 (downgrade to "facilitated service-sector growth").  
     - **Outcome**: Conditional pass.  

  3. **Reject**:  
     - *Claim*: Ethiopia’s poverty caused solely by Orthodox Christian values (vs. Muslim peers).  
     - **Procedure**: Step 1 (pass), Step 2 (reject: no mechanism beyond "values correlate with poverty").  
     - **Outcome**: Reject.  

  ---

  ### **Ineliminable Judgment Points**  
  - **Step 2**: Assessing "plausible" mechanisms.  
  - **Step 3**: Evaluating counterfactual stability.  
  - **Step 7**: All value-laden/normative issues.  
  - **Reference reliance**: Using "standard" sources risks excluding valid heterodox evidence.  

  This procedure ensures narratives avoid fundamental flaws but remains a supplement—not replacement—for expert review. It reduces but cannot eliminate subjectivity.
