prompt: |-
  David Lewis died in 2001, before the widespread emergence of federated social networks and algorithmic content curation. Drawing strictly on his philosophical account of convention—as a regularity in behavior that solves a coordination problem through mutual expectation, salience, precedent, and common knowledge—predict how he would assess the normative structure of modern decentralized online platforms (for instance, Mastodon instances or Bluesky's protocol-layer moderation tools). In particular, address whether the rapidly evolving unwritten rules governing reply etiquette, instance defederation, and content labeling constitute genuine Lewisian conventions, or whether opaque algorithmic ranking and recommendation systems undermine the transparency required for common knowledge and thus prevent stable conventional equilibrium. Would Lewis likely interpret the high turnover of these norms as proof that they are never true conventions, or rather as conventions whose equilibrium is continuously disrupted by technological mediation? Ground your prediction in the internal logic of his conditions—recurring coordination problem, conditional preference for conformity, and mutual knowledge of the regularity—rather than in biographical speculation.
