answer: |-
  Based strictly on David Lewis's account of convention (*Convention: A Philosophical Study*, 1969), his assessment of modern decentralized online platforms would likely be nuanced, recognizing both genuine convention-like structures and significant points of failure due to technological mediation, particularly algorithmic opacity. Here's the prediction grounded in his core conditions:

  1.  **Reply Etiquette, Defederation, and Content Labeling as Genuine (but Fragile) Lewisian Conventions:**
      *   **Recurring Coordination Problem:** These norms directly address fundamental coordination problems inherent in large-scale online interaction:
          *   *Reply Etiquette:* Coordinates conversational flow, prevents flame wars, manages attention & conflict (problem: chaotic, unproductive discourse).
          *   *Instance Defederation:* Coordinates community boundaries and standards enforcement (problem: incompatible norms/harmful content spreading).
          *   *Content Labeling:* Coordinates expectations about sensitive/difficult content (problem: unexpected exposure causing offense/distress).
      *   **Conditional Preference for Conformity:** Users generally prefer to conform *if* others do. Conforming to reply norms facilitates smoother interaction; adhering to labeling norms avoids sanctions; respecting defederation decisions avoids isolation or conflict. Non-conformity risks exclusion, conflict, and reduced platform utility.
      *   **Regularity & Precedent:** These norms emerge as observable regularities within specific instances or communities. Precedent is crucial: *how* previous moderation decisions were made (e.g., defederation precedents) or how labeling was applied informs future expectations and behavior.
      *   **Salience:** Specific events (e.g., a high-profile harassment incident leading to defederation, a contentious thread sparking etiquette discussions) often make particular norms or rule-changes salient, helping to coordinate new expectations.
      *   **Mutual Expectations & Common Knowledge (Partially Met):** Within a *single, stable* Mastodon instance or Bluesky community, common knowledge *can* develop. Discussions in instance timelines, codes of conduct, and visible moderation actions create shared awareness ("We in Instance X know we label graphic content, we expect others here to do so, and we all know that we know this"). Defederation creates a *salient* boundary, making the separation and its reasons common knowledge *within* each federation partner. **Conclusion:** For specific communities or instances operating with relative transparency and stability, these norms *do* satisfy Lewis's core conditions and constitute genuine conventions. They solve coordination problems through mutually reinforcing expectations based on observable regularities and precedent.

  2.  **Algorithmic Opacity as the Primary Undermining Factor:**
      *   **Violation of Common Knowledge Requirement:** Lewisian convention requires that participants know about the regularity, know others know, know others know they know, and so on. Opaque algorithmic curation fundamentally disrupts this:
          *   *Unknown Regularities:* Users don't know *why* certain content is boosted, suppressed, or recommended. The "regularity" governing visibility is hidden.
          *   *Unknowable Expectations:* Users cannot form reliable mutual expectations about what others see or how content is prioritized. If I don't know *why* my post was buried, I can't know if others saw it, or what rule (if any) governs its visibility.
          *   *Lack of Precedent/Salience for Algorithms:* Algorithmic changes are often unannounced and invisible. There's no clear "precedent" users can point to, and changes lack salience. This prevents the formation of stable expectations around algorithmic behavior.
      *   **Undermining Coordination:** The purported coordination problem algorithms claim to solve (e.g., "finding relevant content") is undermined by the lack of transparency. Users cannot coordinate their *understanding* of the system, making it impossible for algorithmic behavior to become a convention *itself*. Instead, it acts as an external, unpredictable force.
      *   **Impact on Explicit Norms:** Algorithmic amplification can accidentally promote norm-violating content or suppress norm-affirming content, creating friction with the explicit community conventions (reply etiquette, labeling). This injects instability into those otherwise conventional systems.

  3.  **High Norm Turnover: Evidence of Fragility, Not Non-Conventionality:**
      Lewis would *not* interpret rapid norm evolution *alone* as proof these aren't conventions. His theory allows for conventions to evolve as circumstances change:
      *   **Evolving Coordination Problems:** The problems these platforms face *are* rapidly evolving (new forms of harassment, novel disinformation tactics, scaling pressures). New solutions (norms) are constantly needed.
      *   **Precedent & Salience in Flux:** High-profile incidents continuously create new salient precedents, prompting norm adjustments (e.g., a new type of harmful content leads to a new labeling convention).
      *   **Conditional Preference Remains:** The underlying preference for coordinated interaction persists, driving the search for new equilibria.
      *   **Key Distinction:** The turnover becomes evidence of *failed* or *unstable* convention only if it stems from a *breakdown in the conditions themselves* – primarily the lack of common knowledge due to opacity or scale.
      *   **Prediction:** Lewis would see the rapid evolution of *explicit, community-driven* norms (etiquette, labeling, defederation criteria) as communities continuously striving to find new conventional equilibria in response to changing problems and technological shifts. **However,** the *instability* is significantly amplified by the destabilizing effect of opaque algorithmic systems operating in the background, which constantly disrupt the mutual expectations and common knowledge required for *any* norm to achieve a stable equilibrium. The high turnover is a symptom of the environment's hostility to the formation of *stable* common knowledge, not proof that conventions are absent.

  **Conclusion:**

  Lewis would likely conclude that:

  1.  **Genuine Conventions Exist:** The explicit, community-negotiated norms (reply etiquette, defederation agreements, content labeling practices) within specific, transparent instances or communities *are* genuine Lewisian conventions. They solve recurring coordination problems through mutually recognized regularities, precedent, salience, and (within bounded communities) common knowledge, supported by a conditional preference for conformity.
  2.  **Algorithmic Opacity Destroys Convention:** The widespread use of opaque algorithmic curation and recommendation systems fundamentally undermines the possibility of convention formation *around content visibility and discovery*. It violates the common knowledge requirement and prevents stable mutual expectations from forming, acting as a persistent source of instability.
  3.  **Turnover Indicates Fragile Equilibrium, Not Absence:** The rapid evolution of norms is primarily evidence of conventions struggling to maintain equilibrium in a technologically mediated environment characterized by rapidly changing coordination problems and, crucially, destabilized by opaque algorithms. These forces constantly disrupt the mutual expectations and common knowledge necessary for stability, leading to frequent re-negotiation and adaptation. The conventions *exist*, but their equilibrium is perpetually fragile and often disrupted.

  In essence, Lewis would see decentralized platforms as fertile ground for *attempted* convention formation at the human-community level, constantly striving to solve novel coordination problems, but locked in a struggle against technological systems (opaque algorithms) that systematically erode the very foundation (common knowledge) upon which stable conventions depend.
