answer: |-
  ### **Delegation Cascade Game: Design and Implementation**

  #### **Game Objective**
  To simulate a nested delegation structure where students experience:
  1. **Rational Cascade**: Delegating decisions upward seems individually rational at each tier, but the cumulative effect risks collective failure (no payoff).
  2. **Legitimacy Deficit**: Representatives (especially forced ones) feel unauthorized and burdened, questioning the outcome's legitimacy.
  3. **Free-Riding vs. Pivotality**: Delegation avoids costs but risks forced representation; voting is costly but ensures pivotality.

  ---

  ### **Game Setup**
  **Participants**: 18 graduate students.  
  **Structure**: Three nested tiers (all decisions made anonymously via sealed ballots):
  - **Tier 1 (Local)**: 6 groups of 3 students each (total 18).  
  - **Tier 2 (Regional)**: 2 councils of 3 delegates each (delegates sent from local groups).  
  - **Tier 3 (National)**: 1 assembly of 2 delegates (one from each regional council).  

  **Token Economy**:  
  - Each student starts with **10 tokens** per round.  
  - **Direct voting** at any tier costs **1 token** (only paid if selected as representative).  
  - **Collective payoff**: If the national assembly approves, **all 18 students gain 8 tokens**. If the cascade breaks (abstention/delegation default at any tier), no payoff—students keep unspent tokens.  

  **Delegation Risk**:  
  - Choosing **"Delegate"** avoids cost but risks forced representation:  
    - If no one votes in a group, one delegator is randomly selected (probability `1/n`, where `n` = number of delegators).  
    - The forced representative pays **1 token** and moves to the next tier.  

  **Cascade Failure Conditions**:  
  - **Local/Regional Tier**: Group fails if no representative is selected (no voters + no delegators).  
  - **National Tier**: Approval fails unless both representatives vote. Delegation/abstention = rejection.  

  ---

  ### **Materials List**
  1. **Ballots & Envelopes**:  
     - 108 blank slips (paper ballots; 3 tiers × 2 rounds × 18 students).  
     - 36 envelopes (2 rounds × 18 students for anonymity).  
  2. **Token Tracking**:  
     - Master spreadsheet (for instructor) to track tokens.  
     - 18 index cards (student token ledgers; students track own tokens).  
  3. **Random Selection Tools**:  
     - Hat/container for drawing forced representatives.  
     - Numbered slips (1–3 per group) for lotteries.  
  4. **Group Labels**:  
     - Local Groups 1–6 (3 students each).  
     - Regional Councils A (Local Groups 1–3), B (Local Groups 4–6).  
     - National Assembly (delegates from A and B).  
  5. **Timer**: For strict 50-minute schedule.  

  ---

  ### **Anonymity Mechanism**
  - **Sealed Envelopes**: Students write choices (V/D/A) on ballots, seal in envelopes, and deposit in a central box.  
  - **Simultaneous Choice**: All decisions made within a 2-minute window per tier.  
  - **Instructor Processing**: Ballots opened and tallied privately. Only aggregate results (counts of V/D/A) and outcomes (who was selected) are announced—**not individual choices**.  
    *Why?* Prevents social pressure to vote, ensuring delegation is a rational (not cooperative) choice.  

  ---

  ### **Game Timeline (Total: 50 Minutes)**  
  **0:00–0:05**  
  - **Introduction (5 min)**: Explain rules, token economy, and anonymity. Emphasize:  
    > "Your goal is to maximize tokens. Voting costs tokens but ensures pivotality; delegation is cheap but risky."  

  **Round 1 (17 min)**  
  - **Local Tier (5 min)**:  
    1. Groups 1–6 decide. Each student chooses **Vote (V)**, **Delegate (D)**, or **Abstain (A)**.  
    2. Ballots collected, processed by instructor.  
    3. **Announce per group**:  
       - "Group X: [#] voted, [#] delegated, [#] abstained. [Name] selected as representative [volunteer/forced]."  
       - *Predicted behavior*: Social pressure dominates—high voting, low delegation. Cascade succeeds.  
  - **Regional Tier (5 min)**:  
    1. Delegates from Local Groups 1–3 (Council A) and 4–6 (Council B) choose V/D/A.  
    2. Process/announce as above.  
  - **National Tier (5 min)**:  
    1. Two delegates choose **Vote (approve)** or **Abstain/Delegate (reject)**.  
    2. If both vote, award 8 tokens to all.  
  - **Reset (2 min)**: Reset tokens to 10 for Round 2.  

  **Round 2 (17 min)**  
  - Repeat Round 1 structure.  
  - **Key Twist**: Students now grasp delegation’s low risk. Expect:  
    - **Local Tier**: Delegation spikes (e.g., 0 voters, 3 delegators per group).  
    - **Regional Tier**: One council (e.g., B) fails (if forced delegator abstains).  
    - **National Tier**: Only 2 delegates (from successful region) must vote. They bear cumulative costs (likely 2 tokens already paid) and question legitimacy.  
    - **Outcome**: Cascade breaks in one region → national approval fails.  

  **Debrief (11 min)**  
  - **Rational-Choice Analysis**:  
    - **Local Tier**: High delegation = rational free-riding (low pivotality in small groups).  
    - **Regional/National Tiers**: Voting costs accumulate—abstention becomes dominant if others’ cooperation is uncertain (assurance game).  
  - **Legitimacy Deficit**:  
    - **Representation w/o Authorization**: Forced reps (e.g., local delegators chosen by lottery) feel "conscripted."  
    - **Burden**: National reps (who paid 2–3 tokens) resent free-riders—"Why us?"  
  - **Predictable Outcomes**:  
    - Round 1: Social pressure → high voting, cascade succeeds.  
    - Round 2: Delegation spikes → cascade breaks in one region; national reps abstain due to cost exhaustion.  
  - **Limitation**:  
    > "This game captures delegation cascades and legitimacy deficits, but **not rational ignorance**. Here, the 'issue' (token payoff) is simple and known. In reality, voters delegate due to policy complexity—this epistemic gap must be discussed separately."  

  ---

  ### **Emotional Reaction & Learning Insights**  
  - **Critical Roles**: **Forced representatives** (especially at multiple tiers) will feel the legitimacy deficit most acutely:  
    - *Round 1*: Volunteers feel proud; forced reps feel mildly aggrieved.  
    - *Round 2*: Forced reps (e.g., a student delegated locally, forced regionally, and sent to national) bear 3-token costs. They voice frustration:  
      > "I didn’t choose this—and why should I pay while others free-ride?"  
  - **Why It Works**: Makes abstract legitimacy problems visceral. Students see:  
    - **Cascade Effect**: Individual rationality → collective failure.  
    - **Authorization Gap**: Representatives lack mandates from disengaged delegators.  

  ---

  ### **Instructor Notes**  
  - **Honest Pitfalls**:  
    - Round 1 may be "too successful" due to social pressure—use anonymity strictly.  
    - If national reps approve in Round 2, highlight their resentment: "Did you feel authorized?"  
  - **Post-Game Discussion**: Contrast with **Downsian paradox**:  
    > "Mass electorates and nested structures both fail—not from pivotality alone, but from cascading disengagement."  

  This design ensures students *experience* delegation’s rational collapse and legitimacy decay, setting up deeper debate on democratic theory.
