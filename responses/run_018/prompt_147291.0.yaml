prompt: |-
  You are advising a two-year, interdisciplinary working group—one metaphysician, one philosopher of physics, and one formal logician—tasked with conceptual rather than empirical research on supertasks and Thomson's lamp. To focus their limited resources, consider a conceptual variant that extends the classic discrete toggle: call it the distributed lamp, in which an uncountable continuum of devices each executes an infinitesimal scaled version of the toggle sequence, so that at the limit time there is no single global on/off state but rather a continuous field of local states. Proponents of this framing suggest it dissolves Thomson's paradox by distributing any contradiction across points, while critics argue it merely replicates the indeterminacy locally and raises fresh problems about determinacy in continuous time.

  Given this framing, which three open questions, lines of theoretical work, or downstream implications should the group prioritize, and in what order? I want a defended agenda, not a survey. For each item, explain: (a) why it is upstream—how resolving it would affect other debates in metaphysics of continuity, the logic of infinite action, or decision theory involving unbounded sequences; (b) its tractability for philosophers without requiring original physics experiments or specialized physical formalism; and (c) what kind of conceptual or formal result in the near term would cause you to reorder the priorities. Explicitly state the criteria governing your ranking—such as importance relative to the distributed-lamp problem, neglect in current literature, or dependence of adjacent fields on this resolution—and discuss the main trade-offs among them. What should they leave for later, and why?
