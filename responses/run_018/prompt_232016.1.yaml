answer: |-
  ## Joint Statement on Biological Function: Etiological and Causal-Role Perspectives

  After a year of sustained, good-faith discussion, we, proponents of the selected-effects (etiological) theory and the causal-role theory of biological function, submit this joint statement. Our goal is to clarify points of agreement, pinpoint our core divergence, identify crucial tests, and pre-register predictions on specific cases, without resolving the fundamental dispute. We agree on the following foundational aspects of function talk:

  We concur that attributing a function to a biological trait is an objective claim about the natural world, not merely a subjective label. Function statements explain why a trait is present or significant within an organism or system. Crucially, both theories require that a functional trait *contributes* to some biological goal-state – typically, the survival and reproduction of the organism (or the maintenance of a containing system, like a cell or ecosystem). Both views reject definitions that make function entirely observer-dependent or disconnected from the organism's operation within its environment. Function attributions are genuinely explanatory; they tell us something important about the trait beyond its physical structure.

  Our fundamental divergence centres on the **temporal grounding and necessity of history** for function ascription. 

  *   **The Selected-Effects (Etiological) Position:** A trait’s function is *defined* by the specific reason it was maintained and became prevalent in a lineage. A function is the effect for which the trait was naturally selected in the past. History is constitutive: a trait has a particular function *because* of the causal role its ancestors played in enhancing the fitness of ancestral organisms, leading to its propagation. The function explains *why the trait is there*. 
  *   **The Causal-Role Position:** A trait’s function is *defined* by the specific causal contribution it *currently* makes within the complex, organised system (e.g., an organism) that contains it, specifically towards maintaining that system's characteristic activities or goals (like survival and reproduction). History is evidentially useful but not constitutive. A trait has a function *because* of the role it plays *now* in the causal network of the current system. The function explains *what the trait does* within the present economy of the organism. 

  This disagreement manifests sharply in specific cases, which serve as our agreed-upon cruxes. For each, we state the core question, the agreed-upon kind of evidence or case study that bears on it, and our pre-registered predictions:

  1.  **Crux: Novel Utility Without History**
      *   **Question:** Can a trait arising *de novo* (e.g., a new mutation) possess a biological function *immediately upon its appearance and beneficial effect*, prior to any selection history?
      *   **Evidence:** Observation or modelling of a specific, newly arisen trait (e.g., a unique enzyme variant from a point mutation, a novel structural protein modification) that demonstrably confers a significant, novel survival or reproductive advantage to the organism *in its current environment*, where no similar trait existed ancestrally.
      *   **Selected-Effects Prediction:** No. While the trait is clearly *beneficial* and may *become* functional after selection acts upon it, it lacks a function *at the moment of its first beneficial occurrence*. Its current effect is merely a "fortuitous benefit" or "potential function," not a genuine function, because there is no history of selection *for* that effect. Only after differential reproduction due to this trait establishes it in the population does it acquire the selected-effect function.
      *   **Causal-Role Prediction:** Yes. If the novel trait demonstrably plays a causal role *within the current organismal system* that contributes systematically to its survival/reproduction (e.g., the new enzyme efficiently catalyses a vital metabolic step lacking before), then it possesses that function *now*. Its function arises from its current causal contribution, irrespective of its novelty or lack of lineage history.

  2.  **Crux: Functional Shift Without Selection for the New Role (Exaptation)**
      *   **Question:** When a trait, originally selected for Effect A, is co-opted to perform a new, beneficial Effect B *without* subsequent modification by selection *for* B, does it *acquire* Effect B as a new function?
      *   **Evidence:** Documented cases of exaptation where the historical selective pressure for Effect A is clear, the current causal contribution to Effect B is clear and beneficial, but genetic/population evidence shows no significant selection *acting specifically to refine or maintain the trait for Effect B* since the shift (e.g., penguin wings for swimming, certain bird feathers initially for thermoregulation later used in display).
      *   **Selected-Effects Prediction:** No. The trait retains Effect A as its sole *function*. Effect B, while beneficial, is a *mere effect* or *exaptation*. For Effect B to become a *function*, there must be a period of selection *for* Effect B acting on the trait, shaping it specifically for that role. Until then, B is a beneficial consequence, not a function.
      *   **Causal-Role Prediction:** Yes. The trait now plays a distinct causal role (contributing to Effect B) within the organism's current economy that significantly supports survival/reproduction. *This current causal role constitutes its function.* The historical function (Effect A) may be vestigial or secondary, but the primary function *now* is Effect B, based solely on its present causal contribution.

  3.  **Crux: Actively Harmful Vestiges**
      *   **Question:** Can a trait that was clearly shaped by selection for a past effect, but which is now actively *detrimental* to the organism (reducing fitness), still be said to *have* its original function?
      *   **Evidence:** Traits with clear fossil/genetic evidence of past selection for a specific effect, but where the current manifestation of that trait demonstrably harms survival/reproduction in the present environment without serving any compensatory beneficial role (e.g., pelvic spurs in some male pythons causing injury during copulation, oversized antlers in isolated deer populations leading to entanglement).
      *   **Selected-Effects Prediction:** Yes. The function remains the effect for which it was historically selected. Its current harmfulness means it is *malfunctioning* or that the environment has changed such that the trait is no longer advantageous. "Function" refers to the historical selected effect; "malfunction" occurs when the trait fails to perform *that effect* or when performing it is now harmful. The harm doesn't negate the historical function.
      *   **Causal-Role Prediction:** No. If the trait currently makes no positive causal contribution to the organism's survival/reproduction, and indeed makes a negative one, it *lacks* a function *in the current system*. It may have had a *past* function, but its current causal role is detrimental or negligible. We would describe it as "vestigial" or "dysfunctional," meaning it has *lost* its function because it no longer plays the requisite causal role.

  Our residual disagreement is exact and substantive. It revolves around whether the concept "biological function" must inherently reference the historical process of selection (Selected-Effects) or whether it can be fully defined by current causal-systemic relations (Causal-Role). The cases above are not merely semantic; they represent fundamentally different criteria for applying the term. However, we acknowledge a potential *partially* verbal element: the dispute sometimes hinges on whether "function" primarily answers "Why is it there?" (demanding a historical answer) or "What does it do *now* that matters?" (demanding a current systemic answer). But crucially, we disagree on whether the answer to one question *must* entail or depend upon the answer to the other. The Selected-Effects theorist argues that the "why it's there" question (answered by history) is primary and defines function, while the Causal-Role theorist argues that the "what it does that matters *now*" question (answered by current causal role) is primary and sufficient. This difference in explanatory priority underlies the contrasting predictions on the cruxes outlined.
