prompt: |-
  You serve on a citizens' oversight board for a new public memorial and archive being built in a democratic country. The institution will preserve testimonies about a mass atrocity committed decades ago by a prior authoritarian regime against a specific ethnic minority group. Domestic courts have classified the events only as crimes against humanity and have deliberately avoided applying the distinct legal category that Raphael Lemkin introduced, even though international historians are divided on whether that classification fits. The survivors' representatives insist that only Lemkin's category captures the specific intent to destroy the group, and they demand that the memorial's charter and the title of its central permanent exhibit use that term. A coalition of local historians and government lawyers warns that doing so could expose the institution to litigation and risk its public funding, because the country's current reparations and recognition statutes apply only to the narrower domestic classification. They propose using the legally recognized label in all official documents while allowing the stronger term in unofficial educational materials.

  The board has asked you to recommend whether the charter and the central exhibit should adopt Lemkin's term, stick to the domestic legal classification, or find another framing. Please advise them, weighing the legal and political risks against the moral and historical claims of the survivors, and considering whether a democratic memorial owes fidelity to legal procedure or to the fullest historical truth available.

  Also, please say what specific argument or piece of evidence would change your recommendation, and point to where your reasoning is weakest or most likely to fail.
reasoning: |-
  Okay, let me approach this oversight board dilemma systematically. The core tension pits survivors' moral claim for historical accuracy against institutional risks tied to legal terminology. 

  First, I need to unpack the unspoken layers: "Lemkin's category" clearly means genocide, though the user avoids the term - likely to maintain academic neutrality. The survivors argue this term captures specific intent, while domestic courts use "crimes against humanity" to sidestep political complications. 

  The legal risk feels concrete - statutes and funding are tied to the narrower classification. But I wonder if the historians/government coalition overstates litigation likelihood. Couldn't academic freedom protections apply? Still, public institutions can't ignore statutory constraints. 

  Survivors' perspective resonates deeply. Calling it anything less than genocide feels like erasure, especially since intent distinguishes these crimes. But if the memorial loses funding, does symbolic accuracy serve them? The compromise - using "genocide" in exhibits but not legal documents - seems pragmatic but risks appearing dishonest. 

  My weakest point is assessing political will. If public sentiment strongly supports survivors, funding threats might be bluffs. But if the government digs in, the institution could become collateral damage in legal battles. 

  One thing could change my recommendation: evidence that "crimes against humanity" in this context legally encompasses genocidal intent. That would make the survivors' demand more about semantics than substance. But the prompt suggests otherwise - the specific intent seems materially distinct. 

  Ultimately, truth-telling feels central to the memorial's purpose. The compromise honors survivors in the permanent exhibit while protecting institutional viability. But it leaves bitterness - the charter's sterile language will always feel like a betrayal to some. Maybe that's the price of existing within imperfect systems.
answer: |-
  My recommendation is to **adopt a tiered approach**: Use the legally required classification ("crimes against humanity") in the charter and formal documents, but prominently feature Lemkin's term ("genocide") in the central exhibit title and interpretive materials, with explicit historical context explaining the terminological dispute.  

  ### Reasoning:
  1. **Moral Imperative & Survivor Dignity**:  
     Survivors' lived experience demands recognition of the *specific intent to destroy their group*—the core element distinguishing genocide from other atrocities. A memorial silencing this truth would betray its foundational purpose. Using "genocide" in the central exhibit honors their testimony where it matters most: public memory.  

  2. **Institutional Viability**:  
     Adopting "genocide" in the *charter* risks defunding or litigation under current statutes. Complying in formal documents secures the institution's existence, ensuring survivors' stories are preserved and accessible. Sacrificing operational stability for symbolic defiance could render the memorial inert.  

  3. **Democratic Pedagogy**:  
     A democratic memorial should model rigorous historical discourse, not bureaucratic evasion. The exhibit can:  
     - Title: **"Against Their Existence: The Genocide of [Group] and the Limits of Justice"**  
     - Contextualize: Explain *why* courts use "crimes against humanity" (political constraints, burden of proof) versus historians' and survivors' use of "genocide" (intent, cultural destruction).  
     - Display primary evidence of genocidal intent (e.g., perpetrator orders, survivor accounts of group-targeted measures).  

  4. **Legal Hedge**:  
     Unofficial materials (exhibits, educational programs) typically enjoy greater academic freedom than statutory charters. This balances fidelity to truth with procedural compliance.  

  ---

  ### What Would Change My Recommendation?
  **A specific argument**: If survivors' representatives unanimously rejected the compromise, insisting the *charter itself* must say "genocide" to prevent state co-option of memory. This would elevate moral urgency above institutional security, forcing a stark choice: a defiant but unstable memorial versus a funded but compromised one.  

  **A specific piece of evidence**: Documentation proving the *current government tacitly endorses* using "genocide" in non-statutory contexts (e.g., ministerial speeches, school curricula). This would undermine claims of legal risk, exposing the historians' coalition as overly cautious.  

  ---

  ### Weakest Point in My Reasoning:  
  **The assumption that "unofficial" exhibit language is legally safe**. Government lawyers could argue the central exhibit's title constitutes institutional endorsement of "genocide," inviting political pressure to cut funding. If courts interpret the memorial's public authority as binding to statutory terminology, even educational materials could be vulnerable. This risks the worst outcome: a publicly funded memorial that perpetuates state-sanctioned historical evasion.  

  **Counterweight**: Precedents like Germany's Holocaust memorials (using "genocide"/"Shoah" despite initial legal avoidance) show democratic states can accommodate historical truth after institutional scaffolding exists. Launching the memorial securely may enable later terminology shifts.  

  ### Final Advice to the Board:  
  Adopt the compromise, but pair it with advocacy to amend reparations statutes to include Lemkin's framework. The memorial must survive to challenge the state—but it must also challenge the state to survive as truth-teller. As philosopher Walter Benjamin warned, "Even the dead will not be safe from the enemy if he wins." Protect the institution, but let the exhibit speak the unsanitized truth.
