answer: |-
  Here is a specification of adequacy for any theory linking authorial intention to textual meaning, grounded in the complexities of textual instability and the novelist's experience. Desiderata are ranked by necessity, with conflicts explicitly noted:

  ### Core Non-Negotiable Desiderata

  1.  **Textual Primacy Constraint:** The *actual words, syntax, and structure of the specific text being interpreted* constitute the primary, non-negotiable evidence. Meaning must be constrained by what the text linguistically permits.
      *   **Motivation:** Prevents theories from imposing meanings the text cannot support (e.g., interpreting "red" as symbolizing hope where the text explicitly links red to violence). Blocks solipsism.
      *   **Critical Case:** An editor's rearrangement creates a new symbolic pattern absent in the author's manuscripts. The theory cannot grant this pattern "authorial meaning" unless the author explicitly endorsed the rearrangement *as achieving their intent*.
      *   **Consequence:** Denies that "pure" mental states unexpressed in the text constitute textual meaning.

  2.  **Intention as Publicly Executed Constraint:** Authorial intention relevant to textual meaning must be *embodied in the act of making the text public* or selecting a specific version for public presentation. Private mental states (hopes, early ideas) are evidentiary but not constitutive.
      *   **Motivation:** Distinguishes between discarded drafts (archaeology) and the work *offered* to the world. Preserves the distinction between "what the author once thought" and "what the author finally did."
      *   **Critical Case:** An early draft clarifies a character's motivation, but the published version obscures it through revision. The published text's ambiguity *is* the meaningful datum; the draft explains its origin, not its replacement meaning.
      *   **Consequence:** Rejects "original mental state" theories as defining meaning. Authorial diaries about intended meanings are secondary evidence about the public act.

  3.  **Historical Traceability Constraint:** Claims about authorial intention must be grounded in *historically verifiable evidence* (manuscripts, letters, documented workshop feedback, editorial correspondence, publishing contracts) or inferences tightly constrained by such evidence and the public text.
      *   **Motivation:** Prevents speculative psychologizing ("The author must have meant X because of their childhood"). Ensures intention is an object of historical inquiry, not fantasy.
      *   **Critical Case:** Interpreting a symbol requires consulting documented workshop notes where the author explicitly rejected its proposed meaning, even if readers find it compelling.
      *   **Consequence:** Rejects purely hypothetical intentionalism or value-maximizing approaches that disregard documented authorial rejections of interpretations.

  4.  **Fluidity Accommodation Constraint:** The theory must coherently account for texts existing in *multiple authorized or historically significant versions* (manuscript variants, author-approved editions, posthumous edits, collaborative/workshop texts). It cannot assume a single, stable "text" or a monolithic "author."
      *   **Motivation:** Reflects the reality of textual production. A theory collapsing under textual variation is inadequate.
      *   **Critical Cases:**
          *   *Posthumous Editor:* An editor alters a character's fate. Meaning resides in *both* the author's last manuscript *and* the historically influential edited version, requiring distinct intentional attributions (author's final vs. editor's).
          *   *Workshop Iteration:* Author explicitly supersedes Draft A with Draft B based on feedback. Draft B embodies the relevant public intention; Draft A is context, not competing meaning.
          *   *Authorized Variants:* Different editions published by the author contain significant differences. Each constitutes a distinct intentional public act with potentially distinct meanings.
      *   **Consequence:** Requires a theory flexible enough to assign meaning relative to a *specific textual instance* and its traceable intentional history.

  ### Negotiable Desiderata (Reflecting Interpretive Camps)

  5.  **Authorial Unity Preference:** A preference for maximizing coherence by attributing meaning to a singular authorial agency, even if complex or evolving. *However, this must yield to Desiderata 1-4.*
      *   **Motivation:** Values the author as the originating creative force. Appeals to intentionalists.
      *   **Conflict:** Directly challenged by posthumous editing or complex collaborations (Desideratum 4). *Non-negotiable constraints often force fragmentation of "authorial" attribution.*
      *   **Camp:** Strong Intentionalism values this highly; Hypothetical Intentionalism might reconstruct a "best guess" unity; Value-Maximizing may ignore it.

  6.  **Reader-Response Preservation Preference:** A preference for acknowledging that the meaning *experienced* by readers (especially communal or historically significant readings) has validity, even if diverging from traceable authorial intent.
      *   **Motivation:** Respects the reality and cultural power of interpretation. Appeals to reader-response and sociological critics.
      *   **Constraint:** Cannot override Desiderata 1 & 3. A reader's powerful experience of a meaning unsupported by the text and contradicted by evidence is not *textual* meaning, though it may be culturally significant.
      *   **Camp:** Value-Maximizing (e.g., "the best reading") prioritizes this; Strong Intentionalism minimizes it; Hypothetical Intentionalism attempts a bridge.

  ### Key Conflicts and Potential Incompatibilities

  *   **Desideratum 4 (Fluidity) vs. Desideratum 5 (Authorial Unity):** This is the **central tension**. Accommodating documented editorial intervention, superseded drafts, or collaborative processes **explicitly requires abandoning the strict unity of authorial intention** as the sole source of meaning for the circulating text. The edited text embodies the *editor's* intentional act upon the author's material. A theory satisfying Desideratum 4 must fragment "authorial" attribution or expand "intention" to include later mediators *when their work defines the public text*. Insisting on pure authorial unity forces either ignoring textual variants/history (violating Desiderata 3 & 4) or dismissing the meaning of edited texts as illegitimate (impractical).
  *   **Desideratum 1 (Text) vs. Pure Mental State Intentionalism:** Theories reducing meaning purely to the author's original mental state (even if unexpressed or contradicted by the public text) fail Desideratum 1. The text itself is the primary object.
  *   **Desideratum 3 (Evidence) vs. Hypothetical Intentionalism/Value Maximizing:** Approaches prioritizing the "best" or "most likely" interpretation for an ideal audience, especially if they disregard documented authorial statements rejecting that interpretation (e.g., author letters saying "that symbol means Y, not X"), fail Desideratum 3. Evidence trumps hypothetical reconstruction or aesthetic preference.

  ### How Standard Theories Glance Against These Desiderata

  *   **Strong (Actual) Intentionalism:** Prioritizes Desideratum 5 (Unity) and the evidence aspect of Desideratum 3, but often struggles mightily with Desideratum 4 (Fluidity), potentially ignoring variants/edits or straining to attribute *all* changes to an idealized author. Risks violating Desideratum 1 if "intention" overrides the public text.
  *   **Hypothetical Intentionalism:** Values Desideratum 6 (Reader) and attempts Desideratum 3 via "best evidence," but often relaxes Desideratum 3's demand for strict historical traceability, allowing plausible inference to override documented counter-evidence. Handles Desideratum 4 better than Strong by reconstructing intention relative to a version, but the "hypothetical" construct can drift far from the historically actual.
  *   **Value-Maximizing/Anti-Intentionalism:** Prioritizes Desideratum 6 and Desideratum 1, but explicitly rejects Desiderata 2, 3, and 5. Meaning is entirely reader/text-driven, making authorial intention irrelevant to textual meaning (though perhaps of biographical interest). Fails the core constraints demanded here.

  **In essence:** An adequate theory must anchor meaning in the specific, unstable text (1), defined by the intentional act of its public presentation (2), constrained by historical evidence (3), while rigorously accommodating the messiness of textual variation and mediation (4). The desire for authorial unity (5) or reader primacy (6) must be secondary to these core demands. The inherent conflict between textual fluidity/historical mediation (4) and a unified authorial agent (5) means any satisfying theory *must* fragment or contextualize intention relative to specific textual instances and their traceable origins.
