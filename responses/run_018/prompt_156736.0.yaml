prompt: |-
  hey, i sit on the municipal archive allocation board and we need a memo for thursdays vote. we have one emergency grant left before the storage building gets sold, and we can only rescue one decaying collection.

  option A is the full administrative records of the 1982 regional water authority — huge, anonymized, clear public value, zero personal ties for anyone on the board.

  option B is a partial, messy set of home recordings and handwritten minutes from a demolished cooperative housing block on the east side. about half the tapes have sticky-shed syndrome and need baking before digitization, the papers are water-damaged, and only 30% is catalogued. my collegue dr. vasquez grew up in that block; her mother's unedited letters are in the collection. she wants to save it because it's tied to who she is — her ground project, not just data. she refuses to frame her vote around the letters also being useful for tenant-history research, because she thinks adding that public-utility reason is one thought too many. she wants to vote for B on integrity grounds alone.

  our charter says we should maximize 'historical utility for the public record' but also lists 'stakeholder intigrity' as a factor, though it doesn't define it. half the board says vasquez should recuse herself since her attachment is pure bias. the other half says forcing her to justify B in terms of public value makes her betray her own integrity, kind of like that williams case about saving your wife.

  i need a short memo recommending either A or B, with a concrete timeline for the rescue work (the baking/digitization window is only open through next month), and it should take vasquez's position seriously rather than dismissing it as nepotism. but also address the strongest counter — that personal attachment corrupts institutional decision-making — and explain why the charter's typo-ridden mention of 'intigrity' shouldn't be ignored. don't ask for citations or a reading list; just give me the reasoning and a clear bottom line i can circulate.

  thanks
