prompt: |-
  I'm leading a ninety-minute workshop for philosophy-of-language PhD students who have read Kripke but consistently conflate rigidity with a-posteriority. I need a plan for explaining why rigid designation is compatible with necessary a posteriori identity without explaining it—rather, the dependency order of the ideas, the single carrying example (not Hesperus/Phosphorus or water/H₂O) and what properties it must have, the misconceptions these students will bring—including treating rigidity as a syntactic feature and reading “necessary a posteriori” as an epistemic rather than modal claim—and exactly where in the sequence to head off each, one end-of-session diagnostic question that reveals whether they have separated the modal claim from the epistemic one, and what to omit at this level. Lead with your bottom-line recommendation for the opening move and the carrying example in the first sentence, then lay out the reasoning and misconception map; no preamble and do not restate the question.
reasoning: |-
  Okay, the user is leading a workshop for PhD students in philosophy of language who are conflating rigidity with a posteriority after reading Kripke. They need a clear plan to explain that rigid designation is compatible with necessary a posteriori identity without directly explaining it. Instead, they want to focus on the dependency order of ideas, a single carrying example that's not the usual ones, the misconceptions, and a diagnostic question.

  First, I need to assess the user's scenario. They're teaching advanced students who have read Kripke but are making persistent errors. The main confusion seems to be mixing up rigidity (a semantic concept about reference across worlds) with a posteriori knowledge (epistemological about how we know). The students might also misinterpret "necessary a posteriori" as an epistemic claim rather than a modal one. 

  The user's explicit needs are a structured plan with a specific example, misconception mapping, and a diagnostic question. But deeper needs might include ensuring students grasp the conceptual distinctions without getting bogged down in technicalities. The user probably wants to build a foundation so students can avoid common pitfalls in their research. 

  For the opening move, I should start with a non-standard example. The user mentioned avoiding Hesperus/Phosphorus and water/H₂O. Something like "Mount Everest" as a rigid designator for the tallest mountain could work. But that might still be problematic if the height changes. A better example might be a specific person, like "George Washington," referring rigidly to the first US president, even though his identity as such is a posteriori. 

  Next, the dependency order: Rigidity is about how terms refer across possible worlds. Necessary a posteriori arises when an identity statement involves rigid designators but requires empirical evidence. The example must show that the identity is necessary (true in all worlds) but known a posteriori. 

  Misconceptions: Students might think rigidity is syntactic (e.g., proper names vs. descriptions) rather than semantic. They might also confuse necessary a posteriori with epistemic contingency. Addressing these requires clarifying that rigidity is about reference, not syntax, and that necessary truths can be unknown until evidence is found. 

  The diagnostic question needs to test if students separate the modal from the epistemic. Something like: "If we discovered that Shakespeare never wrote any plays, would 'Shakespeare is Shakespeare' be false?" Correct answer is no, it's still necessary, but we might have misidentified the referent. 

  Omit deep dives into possible worlds semantics, substitution in intensional contexts, or other Kripkean examples. Focus on the core distinction. 

  Putting it together: Start with the George Washington example to hook them, then outline dependencies. Preempt misconceptions by defining rigidity semantically. Use the diagnostic question at the end. Ensure clarity without unnecessary complexity.
answer: |-
  **Opening move & carrying example:** Begin with "George Washington" as rigid for the first U.S. President (GWP), then pose: "Is 'George Washington = GWP' necessary? A posteriori? Could we discover it's false?" 

  ### Dependency Order & Conceptual Sequence:
  1. **Clarify Rigidity First:**  
     - Define: A rigid designator refers to the *same object* in **all possible worlds** where that object exists.  
     - *Example:* "George Washington" picks out *that man* (GW) in every world he exists—not "the first U.S. President" (which picks out different individuals in other worlds).  
     - **Key move:** Stress rigidity is **modal** (about *how reference works across counterfactual scenarios*), not syntactic. Preempt treating names/descriptions as *inherently* rigid/non-rigid by noting "the first U.S. President" could be rigid if stipulated (e.g., as a title for GW alone).

  2. **Necessary Identity:**  
     - If "a" and "b" are rigid and refer to the *same object*, then "a = b" is **necessarily true** (true in all worlds where the object exists).  
     - *Example:* Since "George Washington" and "GWP" both rigidly designate GW, "GW = GWP" is necessary.  

  3. **A Posteriori Status:**  
     - We **empirically discovered** that GW *is* GWP. It’s not knowable via logic/conceptual analysis alone.  
     - **Crush the epistemic conflation:** Emphasize "*a posteriori*" here **only** means *how we came to know it*. Contrast:  
       - Epistemic: "We could have *been wrong* that GW is GWP" (true).  
       - Modal: "There is *no world* where GW exists and isn’t GWP" (true, given rigidity).  

  ### Misconceptions & Preemptive Strikes:
  - **Preconception 1:** Rigidity is syntactic (e.g., "names rigid, descriptions non-rigid").  
    - **Head off at Step 1:** Use "the first U.S. President" as *potentially* rigid if defined as a tag for GW, stressing rigidity is a *semantic* property of *reference*, not grammar.  
  - **Preconception 2:** "Necessary a posteriori" means "could turn out false."  
    - **Head off at Step 3:** Explicitly separate:  
      - Epistemic contingency: *We might not have known or could be mistaken*.  
      - Metaphysical necessity: *It couldn’t have been otherwise*.  
  - **Preconception 3:** Rigidity implies a priority (since "names are given by baptism").  
    - **Head off via example:** "George Washington" rigidly refers, but knowing *who* it refers to (or that GW = GWP) requires history, not philosophy.  

  ### End-of-Session Diagnostic Question:
  > **"If archaeologists found definitive proof that George Washington was never President, would that mean 'George Washington = the first U.S. President' is *false*? Or does it mean we were *wrong about who the first President was*?"**  
  > - *Correct grasp:* They’ll say the latter—the identity *is* necessary (if "the first U.S. President" rigidly designates GW), but we misapplied the description. Confusion persists if they conflate the modal fact with our epistemic access.  

  ### What to Omit:  
  - **No deep metaphysics:** Skip truth in non-existent worlds, transworld identity debates.  
  - **No ancillary examples:** Stick to *one* case (GW/GWP). Avoid water/H₂O, Hesperus, etc.  
  - **No Kripke quotes/textual exegesis:** Focus on concepts, not scholarship.  

  **Execution Flow:**  
  1. Define rigidity modally with GW (10 mins).  
  2. Derive necessity of "GW = GWP" from rigidity (15 mins).  
  3. Contrast necessity with a posteriori discovery (10 mins).  
  4. Structured small-group debate: "Could 'GW isn’t GWP' be true?" (20 mins).  
  5. Full-group resolution + diagnostic question (15 mins).  
  6. Exit ticket: Diagnostic response (5 mins).  

  **Why GW/GWP works:**  
  - Avoids scientific properties (unlike water) and astronomical co-referentiality (unlike Hesperus).  
  - Highlights descriptive misapplication without metaphysical baggage.  
  - Intuitively separates the epistemic ("we learned this") from the modal ("it couldn’t be otherwise").
