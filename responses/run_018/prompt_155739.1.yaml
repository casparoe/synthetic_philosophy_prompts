answer: |-
  Here’s your prep for the seminar, structured as requested. I’ve ordered objections by likelihood/severity, phrased authentically, with tactical concessions, rebuttals, and vulnerability assessments. Your nightmare question is at the end with a scripted defense.

  ---

  ### **Objection 1: The Contradiction-in-Conception Charge**  
  *(Likely first, from analytic Kantians)*  
  **Their Phrasing:**  
  "You’re conflating Kant’s *logical contradiction* test with strategic instability. Kant asks: *Can you conceive a world where everyone acts on this maxim without contradiction?* Not: *Would rational agents defect from it?* Your ‘coalition collapse’ isn’t a contradiction in conception—it’s a failure of prudence."  

  **Your Concession:**  
  "Absolutely—Kant’s test is framed as a thought experiment about logical possibility, not strategic equilibrium. I concede that ‘coalition collapse’ isn’t textual language."  

  **Your Rebuttal:**  
  "But consider: **a maxim that collapses when a subgroup defects *cannot* be universalized without practical contradiction**. If a subgroup *must* deviate to avoid self-defeat (e.g., promise-breaking maxims), willing its universal form *contradicts* the very purpose of the act. This isn’t mere prudence—it reveals that the maxim, when universalized, annihilates the condition for its own efficacy. Kant’s ‘contradiction in conception’ includes *teleological* failures (e.g., G 4:422), not just logical impossibilities."  

  **Where It’s Weakest:**  
  If they press that Kant *exclusively* means *conceptual* contradictions (e.g., "borrowing = no lending" paradoxes), your "teleological collapse" move relies on broader interpretations of "contradiction" (e.g., Korsgaard, O’Neill). Have quotes ready.  

  ---

  ### **Objection 2: Strategic Stability ≠ Moral Universalization**  
  *(From the game theorist, or Kantians)*  
  **Their Phrasing:**  
  "You’re reducing Kant’s moral test to Nash equilibrium! Universalizability is about *impartial justification*—whether a maxim can be a law for all rational beings. Strategic stability is about *incentive compatibility*. Game theory can’t capture the normativity of ‘ought’."  

  **Your Concession:**  
  "I agree: Kantian morality isn’t reducible to payoff maximization. My model isn’t replacing the categorical imperative with Nash equilibrium."  

  **Your Rebuttal:**  
  "I’m using game theory *heuristically* to expose **structural irrationality in universalizing non-cooperative maxims**. Kant requires that rational agents *could consistently will* their maxim as universal law. If a subgroup rationally defects—undermining the universal practice—this reveals that the agent *cannot rationally will the universalized maxim* without self-defeat. That’s not just strategic—it’s a failure of *rational commitment* central to Kant’s test (e.g., G 4:424)."  

  **Where It’s Weakest:**  
  If they argue that *Kantian rationality* (autonomy, respect) ≠ *instrumental rationality* (gain-seeking), your analogy blurs the line. Stress that defection here isn’t about profit, but about *preserving rational agency* in a broken system.  

  ---

  ### **Objection 3: "This Is Just Rawls With Extra Steps"**  
  *(From Kantians spotting contractualism)*  
  **Their Phrasing:**  
  "Your ‘coalitional collapse’ sounds like Rawls’ veil of ignorance or Scanlonian contractualism! Kant’s test is about individual *willing*, not group bargaining. Why not just admit you’re doing contract theory?"  

  **Your Concession:**  
  "I grant the resemblance: both reject maxims that incentivize free-riding. And yes, Kant isn’t bargaining behind a veil."  

  **Your Rebuttal:**  
  "But Kant’s test *already* has a **structural similarity to contractarianism**: it asks whether a maxim can hold as a universal ‘law’ binding all. My model shows that if a subgroup *rationally rejects* the universalized maxim (because defection dominates compliance), it fails as a ‘law’—just as Rawls rejects principles no one could reasonably accept. The difference? **Rawls negotiates institutions; Kant tests personal maxims**."  

  **Where It’s Weakest:**  
  Kant’s test is *agent-centered* (Can *I* will this universally?), not group-centered. Emphasize that the "coalition" is a diagnostic tool for uncovering contradictions in *individual* willing.  

  ---

  ### **The Nightmare Question: Formula of Humanity (FoH)**  
  **Their Likely Phrasing:**  
  "If your coalitional model works for universalizability, how does it handle the *Formula of Humanity*? Treating people as coalition-members sounds like you’re instrumentalizing them for strategic stability—the opposite of treating them as ends-in-themselves!"  

  **Your 90-Second Defense Script:**  
  *(Calm, pacing deliberate)*  
  "Thank you—this is crucial. First, the coalitional reading *supports* FoH. FoH forbids treating others *merely* as means. In my model, a maxim that collapses under defection *requires* exploiting others’ compliance while reserving non-compliance for oneself. That’s treating others as *tools* to sustain a practice you’d rationally defect from—a textbook violation of FoH.  

  Second, the *stability* of a universalized maxim isn’t about utility—it’s about **whether the practice respects each agent’s rational autonomy**. If a maxim incentivizes defection, it *coerces* compliers into enabling others’ exceptions, degrading their agency. Only maxims stable under universalization ensure no one is used as a mere means to others’ ends.  

  In short: coalitional collapse reveals maxims that *cannot* satisfy FoH because they thrive on hypocrisy, not reciprocity. This isn’t instrumentalization—it’s *exposing* it."  

  **Why This Is Your Nightmare:**  
  - FoH is harder to "game-theorize" than universalizability.  
  - Kantians see FoH as the *true* moral core; if your model clashes here, it’s dismissed.  
  - Your defense must reframe "strategic" as "anti-exploitation" to avoid sounding reductive.  

  ---

  ### **Tactical Summary**  
  1. **Anchor in Kant’s text**: Cite teleological contradictions (G 4:422) and rational willing (G 4:424) to legitimize "collapse."  
  2. **Reframe "game theory" as "rational commitment"**: Stress *structural rationality*, not payoffs.  
  3. **Preempt the FoH question** by tying stability to non-instrumentalization early.  
  4. **When cornered**: "This isn’t Kant *exegetically*—it’s a constructive model showing *why* his test works, using modern tools he’d recognize as rational scrutiny."  

  You’re walking a tightrope between rigor and innovation—but your approach is defensible. Good luck!
