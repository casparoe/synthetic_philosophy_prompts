  ### **Moral Judgment Challenge: Rules & Flow**  
  **Objective**: Experience the tension between moral principles and contextual judgment. Teams earn points by predicting majority verdicts while defending rules that get counterexampled.  

  ---

  #### **Setup**  
  - **Time**: 80 minutes total.  
  - **Teams**: 4 groups of 4 students (adjust if needed).  
  - **Materials**:  
    - **Case Cards**: 1 identical card per team per round.  
    - **Scoreboard**: Track team points (1 point per correct majority prediction).  
    - **Timer**: Strict 7-minute rounds.  
    - **Whiteboard**: Record teams’ rules publicly after each round.  

  ---

  #### **Rules & Round Structure**  
  1. **Introduction (5 min)**:  
     - Explain: “Each round, your team gets a moral case. You must:  
       (1) Decide if the act is **morally acceptable** (A) or **unacceptable** (U).  
       (2) State a **general moral rule** justifying your verdict.  
       (3) Predict whether the **majority of teams** will agree with your verdict (A/U).  
     - Scoring: 1 point for correct majority predictions (regardless of your verdict).”  

  2. **Round Flow (60 min total, 7 min per round + transitions)**:  
     - **Step 1 (2 min)**: Distribute identical case card to all teams. Teams discuss verdict, rule, and prediction.  
     - **Step 2 (1 min)**: Teams submit verdict and prediction to TA (rules written publicly on whiteboard).  
     - **Step 3 (2 min)**: TA tallies and announces majority verdict. Award prediction points.  
     - **Step 4 (2 min)**: Briefly discuss why rules led to verdicts (no deep debate yet).  
     - **Repeat for 8 rounds** (adjust to time; 6 rounds minimum to ensure flips).  

  ---

  #### **Case Cards**  
  **Design**: Each card isolates one feature (e.g., promise-keeping, harm). "Flip pairs" reverse the polarity of that feature.  

  | Round | Case Title          | Case Description                                                                                                 | Expected Verdict | Feature Targeted          | Flip Pair |
  |-------|---------------------|------------------------------------------------------------------------------------------------------------------|------------------|---------------------------|----------|
  | 1     | **The Lunch Promise** | Sam promises to meet a friend for lunch. Sam arrives on time, and they have a pleasant conversation.             | Acceptable (A)   | Promise-keeping           | Round 3  |
  | 2     | **Tax Evasion**       | Taylor, a wealthy CEO, lies on taxes to save $1M. Uses the money to build a park for children.                  | Unacceptable (U) | Lying                     | Round 6  |
  | 3     | **Broken Promise**    | Sam promises to return a borrowed book today. On the way, Sam sees a child drowning. Sam stops to save the child, missing the return. | Acceptable (A)   | Promise-keeping ⬇️ (Flip) | Round 1  |
  | 4     | **Painful Prank**     | Jordan hides a friend’s phone as a joke. The friend panics, misses a job call, and spirals into depression.     | Unacceptable (U) | Causing distress          | Round 7  |
  | 5     | **Truthful Harm**     | Riley tells their friend a harsh truth: "Your art is terrible." Friend abandons their passion and sinks into despair. | Unacceptable (U) | Truth-telling             | Round 8  |
  | 6     | **Life-Saving Lie**   | Taylor hides refugees from police. When asked if they’re there, Taylor says no. They escape persecution.         | Acceptable (A)   | Lying ⬆️ (Flip)           | Round 2  |
  | 7     | **Dentist’s Deception** | Jordan lies to a dementia patient: “Your surgery will be painless.” Patient stays calm; surgery succeeds.       | Acceptable (A)   | Causing distress ⬆️ (Flip)| Round 4  |
  | 8     | **Tough Love**        | Riley’s friend asks for career advice. Riley says: "Your writing is weak; you need to improve." Friend works harder and wins a prize. | Acceptable (A)   | Truth-telling ⬆️ (Flip)   | Round 5  |

  ---

  #### **Debrief Plan (15 min)**  
  **Goal**: Use game tensions to frame the particularism/generalism debate.  

  1. **Tension Recap (3 min)**:  
     - Highlight: “You earned points by predicting verdicts accurately, but your rules kept failing. Why?”  
     - Point to whiteboard: “Look at Round 1’s rule: *‘Always keep promises.’* Round 3’s drowning child made you abandon it. Same for lying (Rounds 2 vs. 6) or truth-telling (Rounds 5 vs. 8).”  

  2. **Introduce Particularism (4 min)**:  
     - “This is the pull of **moral particularism**: Features like ‘keeping a promise’ or ‘lying’ aren’t always good/bad. Their moral weight depends on context. No rule is truly exceptionless.”  
     - **Map to game**:  
       - *Rules failing* = Particularism’s rejection of principles.  
       - *Predictions succeeding* = We share contextual intuitions without rigid rules.  

  3. **Generalist Reply (4 min)**:  
     - “Generalists (Kantians, consequentialists) reply: *‘You just need better rules!’* For example:  
       - Kant: *‘Never lie, unless it conflicts with a greater duty.’*  
       - Consequentialism: *‘Lying is wrong unless it maximizes good.’*  
     - **Tension**: What must each side give up?  
       - *Particularism*: Moral predictability/systematicity.  
       - *Generalism*: Simple, exceptionless rules.  

  4. **Anticipated Sticks & Honesty (4 min)**:  
     - **Where students get stuck**:  
       - *“We could’ve made a rule with exceptions!”* → Agree! But then it’s not *exceptionless* (generalist concession).  
       - *“Predictions worked, so rules exist!”* → Particularist: Shared intuitions ≠ principles; context is irreducibly complex.  
     - **Game’s limitation**:  
       - “This doesn’t *disprove* generalism. It shows **simple rules fail**, but Kant/mill might have deeper principles (e.g., universalizability/utility). We’ll study those next.”  

  ---

  **Why This Works**:  
  - The scoring twist (rewarding predictions) mirrors particularism’s insight: We *can* judge cases without rigid rules.  
  - Flip pairs force students to see features as context-dependent, priming them for particularism before it’s named.  
  - The debrief uses their frustration to explore the core trade-off: principles vs. flexibility.  

  **Timing Buffer**: If rounds run long, drop Rounds 4/7 or 5/8 (ensure each feature has one flip). Adjust debrief to focus on strongest examples.
