  Convexity is third. Non-convex sets are common in real situations (like discrete goods), but this seems more technical. The user wants conceptual clarity, so understanding if the utopia-line intuition survives here is important but maybe secondary. Without resolving the first two, this might not matter as much.

  Finally, comparing to other solutions like proportional or egalitarian. This is useful context, but since KS's axioms are different, it might not directly affect its core fairness argument. The user might be looking for where KS fits in the broader fairness landscape, but it's downstream of validating its own principles.

  The user's deeper need seems to be establishing KS as a credible fairness tool in practice. They might be a researcher or philosopher applying game theory to real justice problems. Prioritizing monotonicity and multi-party addresses the foundations and scalability, which are essential for real-world relevance. If monotonicity's normative issues aren't resolved, other aspects become less meaningful. Similarly, without a multi-party solution, KS remains theoretical. 

  Dead ends? The comparison to other solutions might not change perceptions of fairness fundamentally, as each solution has different axioms. Confirming monotonicity's defensibility is critical—if it's indefensible, KS's fairness claim weakens. Multi-party extension is vital but harder; progress here could redefine KS's utility. Non-convexity is niche, and comparisons are contextual. So focusing on the first two offers the highest impact for normative goals.
answer: |-
  Here’s a prioritized research agenda for conceptual work on KS’s "fairness" claims, grounded in normative impact and avoiding technical rabbit holes:

  1.  **The Monotonicity Normative Crisis (Top Priority)**
      *   **Why Upstream:** If KS’s core axiom fails normative muster, the whole solution loses its claim to fairness. The critical question: *When an agent's outside option improves for reasons entirely external to the bargaining context (e.g., inheritance, unrelated windfall), does KS's requirement to award them a larger share reflect fairness or a violation of it?* Does fairness demand insulation from unrelated advantages, or is "respecting better fallbacks" inherently fair, regardless of origin?
      *   **Research Focus:** Develop and defend a nuanced interpretation of monotonicity. Is it about:
          *   *Rewarding Power (Problematic):* Framing it solely as shifting power dynamics makes KS vulnerable to critiques that it legitimizes arbitrary advantage.
          *   *Maintaining Relative Claim Strength:* Or is it about preserving the *proportion* of potential gains achievable from the status quo, which might feel fairer? (The "line to utopia" maintains the ratio of potential gains).
          *   *Robustness to Changing Contexts:* Or is the fairness in the *consistency* of the method under resource expansion, even if individual cases seem jarring?
      *   **Impact:** A compelling normative defense (or concession of limitation) here is foundational. If you can't justify *why* KS responds this way as fair, its other properties become academic. A negative result (e.g., "monotonicity lacks a coherent fairness justification in common real-world scenarios") would fundamentally undermine KS's normative standing. A positive defense would solidify its core claim.

  2.  **The Multi-Party Problem (Critical Gap)**
      *   **Why Next:** Bargaining rarely involves just two parties. KS lacks a canonical, axiomatically compelling extension to n>2. Existing proposals (Raiffa-Kalai-Smorodinsky, etc.) often feel arbitrary or violate intuitive fairness properties KS boasts for n=2. *Without a coherent multi-party extension, KS's claim to model real cooperative fairness is severely limited.*
      *   **Research Focus:** Conceptual exploration over technical fixes. What *should* a "fair" n-player KS analogue achieve?
          *   *What does "Monotonicity" mean with multiple utopia points?* Should an improved outside option for A benefit *only* A proportionally, or require adjustments for B and C too? How?
          *   *Is the "Radial" Intuition Salvageable?* Does moving radially towards an n-dimensional utopia point capture fairness? Or does it ignore crucial interdependencies? What fairness property *should* replace the simplicity of the radial line?
          *   *Trade-offs with other Fairness Principles:* Does extending KS inevitably force compromises with properties like Symmetry or Pareto Efficiency in multi-party settings?
      *   **Impact:** Solving (or conclusively demonstrating the unsolvability of) the n-party extension is essential for KS's practical relevance to most cooperative problems. A negative result (e.g., "no extension captures the core KS fairness intuition for n>2 without unacceptable trade-offs") confines KS to a niche. A positive conceptual breakthrough would be transformative.

  3.  **Non-Convex Worlds: Does the Intuition Survive? (Important Context)**
      *   **Why Third:** Real bargaining spaces are often non-convex (discrete goods, combinatorial choices, external constraints). The "line to utopia" metaphor breaks technically. The key conceptual question: *Does the* **underlying fairness principle** *of KS – balancing claims based on relative potential gains from the status quo – still make sense and offer guidance in non-convex settings, even if the exact solution point isn't defined by a simple line?*
      *   **Research Focus:** Abstract away the geometric mechanism. Can the core KS logic be reformulated as:
          *   A principle of proportional claim satisfaction relative to *feasible* potential gains?
          *   A lexicographic approach prioritizing agents furthest from their feasible utopia?
          *   Does the *idea* still resonate intuitively as fair even when the math is messy? How do people perceive "fairness" in discrete bargaining scenarios compared to KS-inspired allocations vs. Nash or Proportional?
      *   **Impact:** Less about invalidating KS than understanding its conceptual robustness and adaptability. A result showing the core intuition *fails* to provide clear or fair guidance in common non-convex scenarios weakens its general applicability. Showing how the principle *can* be adapted strengthens it. Clarifies the boundaries of KS's normative claim.

  4.  **Comparison to Proportional/Egalitarian Frameworks (Contextual Insight)**
      *   **Why Last (But Not Least):** This is crucial for positioning KS within the broader fairness landscape, but it depends heavily on resolving the prior points. If KS's monotonicity is indefensible or lacks a multi-party form, comparing it to Proportional/Egalitarian solutions is mostly academic. *It answers "Where does KS sit?" but not "Is KS fundamentally sound?"*
      *   **Research Focus:** Targeted comparison on specific normative grounds:
          *   *Responsiveness vs. Rigidity:* KS dynamically adjusts shares based on the *specific* opportunity set and outside options. Is this responsiveness fairer than Proportional's fixed ratios or Egalitarian's fixed shares, or does it introduce problematic instability?
          *   *Handling Asymmetric Potential:* Does KS better handle cases where agents have vastly different maximum achievable utilities (within the feasible set) compared to Proportional (which might ignore this) or Egalitarian (which might force equality where potential differs)?
          *   *Philosophical Anchoring:* Does KS align more closely with "Equality of Opportunity" (focus on potential) vs. "Equality of Outcome" (Egalitarian) vs. "Respecting Entitlements" (Proportional)?
      *   **Impact:** Provides valuable context and helps identify KS's unique normative niche. However, it's unlikely to *fundamentally* alter KS's standing unless it reveals a deep inconsistency ignored by axioms (unlikely). Primarily useful for choosing the right tool for specific justice problems *once KS's own foundations are secure*.

  **Defending the Order & Dead Ends:**

  *   **Upstream/Downstream:** Monotonicity (1) is the *axiomatic bedrock*. If it crumbles normatively, KS is severely wounded. The Multi-Party gap (2) is the *practical applicability bottleneck*. Without it, KS is irrelevant for most real fairness problems. Non-convexity (3) tests the *resilience of the core intuition*. Comparisons (4) are *positioning* within an existing field.
  *   **Reordering Trigger:** A breakthrough on the Multi-Party problem (e.g., a compelling, axiomatically justified n-player KS variant) could propel (2) to #1, as it would unlock vast new domains for KS and make defending its core axiom even more urgent. A devastating critique of Monotonicity could make (1) the terminus.
  *   **Likely Dead End:** Deep dives into **technical axiomatics beyond the core fairness-relevant axioms** (e.g., slight variations of IIA, continuity under obscure topologies). While intellectually interesting, these rarely shift the *conceptual* fairness debate meaningfully. Similarly, **highly abstract comparisons without grounding in tangible fairness dilemmas** (e.g., purely formal properties divorced from normative interpretation) are unlikely to change how anyone thinks about fairness.
  *   **The Real Dead End (for your goal):** Focusing solely on **whether KS is the unique solution satisfying axioms X, Y, Z**. You care about *what those axioms mean for fairness*, not technical uniqueness proofs. The crucial question is always: "Does this axiom/model capture something normatively compelling about fair division?"

  **In essence:** Your agenda should ruthlessly focus on **justifying KS's core response to changing circumstances (Monotonicity)** and **making it usable in realistic multi-agent settings**. These are the gates through which KS must pass to be taken seriously as a model of real-world cooperative fairness. Non-convexity tests its robustness, and comparisons contextualize it, but without solving 1 & 2, KS remains an elegant but potentially normatively flawed or practically limited concept.
