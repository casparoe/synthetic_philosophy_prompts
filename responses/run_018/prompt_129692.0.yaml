  **Proposal: The Pragmatic Architecture of Hypocrisy and Standing to Blame**  

  The central question this project addresses is: **Does hypocrisy defeat one’s standing to blame only when the hypocrite’s prior failing shares the same interactional or institutional domain as the conduct being blamed, where domains are delineated by the norms governing specific second-personal exchanges rather than by moral equivalence?** Existing accounts of hypocrisy’s impact on standing focus overwhelmingly on *moral symmetry*—whether the hypocrite committed the same wrong, or one of comparable severity, as the blamed party. This narrow lens overlooks how standing operates within concrete pragmatic frameworks: institutional roles, relational contexts, or normative ecosystems that structure accountability practices. Consequently, debates remain unresolved, oscillating between positions that deem hypocrisy universally corrosive to standing and those permitting it if moral discrepancies exist. My hypothesis is that hypocrisy nullifies standing precisely when both the hypocrite’s failing and the blamed act occur within a unified domain of normative engagement—a shared "space" defined by role-specific duties, institutional rules, or interactional expectations—even if the moral wrongs differ descriptively.  

  Consider your example: a senior researcher who habitually compromises data integrity retains standing to blame a junior colleague for falsifying grant reports *only if* these acts inhabit distinct institutional domains (e.g., data analysis vs. compliance administration), governed by non-overlapping norms and audiences. If both failings fall under a unified domain—say, "professional integrity within lab governance"—her hypocrisy negates standing, despite differing moral particulars. Existing theories cannot resolve this because they treat blame as a generic moral act, detached from the pragmatic scaffolding of specific exchanges. They ignore that standing is not merely about moral authority but about *positional legitimacy* within a normative ecosystem. When a blamer’s own conduct violates the very norms that authorize her to hold others accountable *in that domain*, her standing collapses irrespective of moral taxonomy. This domain-sensitive approach explains intuitive judgments that baffle symmetry-based accounts: why a parent who lies about Santa may blame their child’s schoolyard dishonesty (distinct domains), but not their tax fraud (shared domain of civic honesty), or why a professor’s plagiarism voids her standing to address student plagiarism but not classroom bullying.  

  Over eight weeks, I will develop this argument through rigorous conceptual analysis:  
  - **Weeks 1–2**: Diagnose limitations in existing accounts by isolating their reliance on moral symmetry and abstraction from pragmatic context. Articulate how conflating moral and pragmatic dimensions generates contradictions in hypothetical cases.  
  - **Weeks 3–4**: Define "interactional/institutional domains" operationally. Ground this in theories of second-personal address, role obligations, and institutional normativity to distinguish domains from moral categories (e.g., a university’s research ethics framework vs. the moral wrong of deception).  
  - **Weeks 5–6**: Test the domain hypothesis against borderline cases. Does a doctor who smokes lose standing to blame a patient’s refusal to exercise? Only if health advice and personal health conduct share a domain—plausibly in a clinical relationship, but not in casual settings. Refine criteria for domain boundaries.  
  - **Weeks 7–8**: Synthesize findings into a cohesive framework. Draft a paper section arguing that domain-sensitivity resolves theoretical stalemates and better predicts real-world judgments of hypocrisy’s impact on standing. Outline implications for blame practices in hierarchical institutions.  

  **Success** would mean demonstrating that:  
  1. Domain-sensitivity resolves ambiguities in hypocrisy debates that moral symmetry cannot;  
  2. Pragmatic context non-reductively shapes standing judgments;  
  3. The framework offers superior explanatory power in complex cases (e.g., partial hypocrisy across domains).  
  **Failure** would occur if:  
  1. Moral equivalence fully absorbs pragmatic considerations;  
  2. Domain boundaries prove too vague or arbitrary to operationalize;  
  3. The hypothesis adds no clarity beyond extant theories.  

  Eight weeks is sufficient for this conceptual groundwork. The scope is deliberately bounded—developing the core argument, not a full theory of blame. The primary risk is overextension: if "domains" cannot be coherently defined without collapsing into moral or conventional categories, the project falters. Mitigation lies in focusing on clear-cut institutional cases (e.g., academic labs) early on. A secondary risk is underestimating how moral and pragmatic factors interact; I will remain agnostic on whether domains are purely conventional or morally grounded. While a full defense requires longer-term work, this project will establish whether pragmatics offers a viable path forward—a modest but substantive contribution.  

  By recentering hypocrisy on the lived structures of accountability, this work challenges philosophers to treat blame not as an ethereal moral act but as a practice embedded in social reality. Even negative results would advance the field by forcing a reckoning with the unexamined pragmatics of standing.  

  ---  

