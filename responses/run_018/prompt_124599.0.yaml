answer: |-
  Your observation captures a profound and under-discussed dynamic in collective resource management. The phenomenon you're describing is most precisely conceptualized as **anticipatory fragmentation of the commons**, with strong ties to the **security dilemma** from international relations theory and **defensive enclosure** in institutional economics. While no single term fully encapsulates it, we can define its core mechanism and boundaries:

  ### Core Concept: **Defensive Fragmentation Dilemma**
  A self-reinforcing cycle where:
  1. **Anticipated Overuse**: Agents *expect* others to overconsume or exploit the commons (whether real or perceived).
  2. **Preemptive Partitioning**: Agents unilaterally secure subsets of the resource, reframing exclusion as "protection."
  3. **Self-Justifying Scarcity**: The partitioning *creates* artificial scarcity, validating initial fears and triggering further fragmentation.

  ---

  ### Distinguishing from Classic Models:
  | Concept              | Key Difference from Defensive Fragmentation                                                                 |
  |----------------------|-------------------------------------------------------------------------------------------------------------|
  | **Tragedy of Commons** | Involves *actual* overconsumption by all. Here, resources aren't depleted—they're *artificially rendered inaccessible* through preemptive claims. |
  | **Enclosure**          | Historical enclosure was profit-driven & imposed by elites. Here, actors see themselves as *victims* reacting to threats, not aggressors. |
  | **Free-Rider Problem** | Addresses non-contribution. Your case involves *over-claiming to block others*, mistaking exclusion for protection. |

  ---

  ### Boundary Conditions:
  The phenomenon manifests when:
  1. **Genuine Fear Threshold**: The restrictor must *sincerely believe* others pose a threat (even if exaggerated). Pure greed without defensive framing falls under classical enclosure.
  2. **Self-Fulfilling Prophecy**: The act of partitioning *induces* the scarcity it claims to prevent (e.g., empty garden plots "reserved" against hypothetical overplanting).
  3. **Rhetorical Justification**: Claims invoke "fairness," "security," or "protection"—never explicit ownership. Rights language ("my liberty to secure my share") overrides collective responsibility.
  4. **Fragmentation > Depletion**: The resource remains physically intact but becomes *socially unusable* due to competing claims.

  ---

  ### Why This Matters Philosophically:
  - **The Paradox of Self-Defense**: Like Hobbes' state of nature, the quest for individual security destroys collective security. Your digital archive example shows how "protective" licenses create friction that stifles collaboration.
  - **Epistemic Collapse**: Actors mistake their *prediction* of others' behavior for *certainty*. The group planting all plots assumes others *would* overplant—but this is untested.
  - **Institutional Vacuum**: Lacks Ostrom's "rules with teeth." Without agreed-upon limits, defensive acts become the de facto governance.

  ---

  ### Real-World Analogues:
  - **Digital Commons**: Restrictive licensing of open-source tools to "prevent commercialization," fragmenting developer communities.
  - **Water Rights**: Farmers over-drilling wells to "secure future access," accelerating aquifer depletion.
  - **Academic Publishing**: Universities hoarding journal subscriptions via paywalls, justifying it as "protecting research investment."

  ---

  ### Solutions Framework (Per Elinor Ostrom):
  1. **Clear Boundaries**: Define *who* can use the garden/archive and under what conditions.
  2. **Graduated Sanctions**: Penalties for overclaiming that escalate from warnings to exclusion.
  3. **Conflict Resolution**: Neutral arbitrators for disputes over "fair share" claims.
  4. **Collective Choice**: Users co-design rules to preempt defensive behavior.

  Your case reveals a critical truth: **The greatest threat to commons isn't greed—it's mutual suspicion.** When trust collapses, partition masquerades as prudence. The tragedy isn't that the commons gets used up—it's that it gets locked away.
