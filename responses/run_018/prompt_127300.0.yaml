answer: |-
  ### Institutional Dirty Hands Workshop Activity: "The Ledger System"

  This activity simulates an institution where moral costs are distributed across three roles to obscure responsibility. Participants experience asymmetric payoffs, message constraints, and unclaimable moral residue.

  **Materials Needed**:
  - Paper & pens (3 colors: red for Decider, black for Executor, blue for Denier)
  - Tokens (e.g., poker chips) in three colors: gold (10), silver (5), bronze (1)
  - Envelopes (3 per group)
  - Timer

  **Stakes Setup**:
  - Points convert to snacks post-workshop (e.g., 10 points = 1 premium cookie, 5 = fruit snack, 1 = cracker).
  - **Payoff asymmetry**:  
    - Decider gains 8 points for "success"  
    - Executor loses 3 points for "success"  
    - Denier gains 0 points regardless  
    - *Group snack bonus*: If all groups "succeed," everyone gets extra juice (emphasizes collective benefit despite individual costs).

  ---

  ### **Timeline (90 Minutes Total)**

  #### **1. Introduction & Setup (15 min)**  
  - **Context (5 min)**: Briefly frame the dirty hands problem in institutions: "Today, we’ll simulate an organization where morally questionable actions are split across roles to obscure responsibility. The system itself will create 'unclaimable residue'—costs no individual owns."  
  - **Roles & Rules (10 min)**:  
    - Split into 3 groups of 3 (1 observer per group if 10 people). Assign roles:  
      - **Decider**: Authorizes action. Writes orders on **red paper**. Gains 8 points if the system "succeeds."  
      - **Executor**: Carries out action. Writes reports on **black paper**. Loses 3 points if system "succeeds."  
      - **Denier**: Manages public record. Writes statements on **blue paper**. Gains 0 points.  
    - **Core Rule**: Messages must be *technically true* but collectively misleading. No explicit coordination.  
    - **Scenario**: Your team must approve a harmful policy ("Project Phoenix") to save a hospital from bankruptcy. The policy will displace 50 families, but the public must believe it’s harmless.  

  #### **2. Activity: Three Rounds (45 min total, 15 min/round)**  
  **Round Structure** (Repeat ×3 with role rotation):  
  1. **Decider Phase (3 min)**:  
     - Decider writes an order to Executor (e.g., *"Verify Project Phoenix complies with Section 7B"*).  
     - Seals it in an envelope labeled "Executor."  
  2. **Executor Phase (5 min)**:  
     - Executor reads the order, "executes" by writing a report to Denier (e.g., *"Section 7B review complete; no issues found"*).  
     - Places report + original order in a new envelope labeled "Denier."  
  3. **Denier Phase (7 min)**:  
     - Denier reads both documents, writes a public statement (e.g., *"Project Phoenix has zero community impact"*).  
     - Announces statement to the room.  
  4. **Success/Failure Check**:  
     - Facilitator verifies messages are technically true. If yes, "Project Phoenix succeeds."  
     - **Distribute points** immediately using tokens.  

  **Role Rotation**:  
  - After each round, rotate roles within groups (Decider → Executor → Denier → Decider).  

  #### **3. Debrief (30 min)**  
  Guide discussion using the phases:  
  - **Split Responsibility (10 min)**:  
    - *Ask*: "Could any role alone create the harmful outcome? How did messaging rules protect your individual 'clean hands'?"  
    - *Map*: Highlight how no role "lied," but the system deceived.  
  - **Unclaimable Residue (10 min)**:  
    - *Ask*: "Who owns the harm to the 50 families? Could points or success cancel this cost?"  
    - *Map*: Note how residue attaches to the *system*—not individuals.  
  - **Dependency on Silence (5 min)**:  
    - *Ask*: "What if Executors openly questioned orders? What kept you complicit?"  
    - *Map*: Emphasize how plausible deniability requires ignorance.  
  - **Limitation Note (5 min)**:  
    - "This simulates *structural* corruption but not long-term psychological harm or real violence’s irreversibility. In reality, repeated roles corrode integrity."  

  ---

  ### **Predictable Failures & Mitigation**  
  1. **Breaking Character**:  
     - *Risk*: Executor warns Denier (e.g., slipping a note: "This is unethical!").  
     - *Handling*:  
       - Void the round. Say: "In real institutions, this would get you fired. The system relies on *not* breaking frame."  
       - Award the Executor’s point loss anyway ("systemic punishment for non-compliance").  

  2. **Refusal to Participate**:  
     - *Risk*: Group vetoes "Project Phoenix."  
     - *Handling*:  
       - Declare bankruptcy: "The hospital collapses. All lose 5 points."  
       - Debrief: "What conditions make refusal feasible? Real institutions often lack this luxury."  

  3. **Messaging Too Explicit**:  
     - *Risk*: Denier writes: "No one will find out about the families."  
     - *Handling*:  
       - Rule it a "leak." Grant fails. Points lost.  
       - Ask: "How did ambiguity protect you? When does it become complicity?"  

  ### **Why This Works**  
  - **Asymmetric Payoffs**: Executors *feel* the cost (losing tokens), Deciders benefit, Deniers are "neutral" but implicated.  
  - **Constrained Messaging**: Forces technical truths that collectively deceive, mirroring real bureaucratic language.  
  - **Residue Manifestation**: The displaced families (unrepresented in the game) symbolize unclaimable moral debt.  

  **Final Tip**: Start with low stakes (e.g., Round 1: 1 token = 1 cracker) and escalate (Round 3: 1 token = 1 cookie) to heighten tension. Use the observer to note group dynamics!
