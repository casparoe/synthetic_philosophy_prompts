answer: |-
  Your observation cuts to the heart of game theory, practical rationality, and the philosophy of negotiation. This situation is a classic **strategic commitment problem**, analyzed brilliantly by Thomas Schelling in his work on conflict and bargaining. The apparent paradox of using reason to cultivate the *appearance* of unreason or uncontrollability is not necessarily irrational; it can be a sophisticated, though risky, meta-rational strategy. Here’s a framework to dissect it:

  ### 1. **Schelling's Concept of "The Rationality of Irrationality"**
     - **Strategic Commitment**: In bargaining, power often lies with the party who can *irrevocably commit* to a position first. If you can convince your opponent that you *cannot* back down (even if you want to), you force them to concede to avoid mutual loss. This is the core logic here.
     - **Brinkmanship & Controlled Risk**: By introducing threats with catastrophic outcomes (e.g., resigning, gridlock), actors create a "threat that leaves something to chance" (Schelling's phrase). They make the outcome partially dependent on factors they *claim* not to control (e.g., pride, principle, emotional reactions). This shifts the burden of avoiding disaster onto the opponent.
     - **Credibility through Self-Damage**: Threats are credible only if costly to the threatener. Announcing self-damaging actions signals seriousness precisely because backing down would now incur reputational costs. It’s a *deliberate sacrifice of flexibility* to gain leverage.

  ### 2. **Is This "Rational"? A Layered Answer**
     - **Instrumentally Rational (Short-Term)**:  
       If the goal is to "win" a specific negotiation, this tactic *can* work—especially in one-off interactions. By simulating irrational obstinacy or emotional rigidity, a player exploits the opponent's rational aversion to mutual destruction. It’s a calculated gamble: *"I will appear so committed that your rational choice is to concede."*
     - **Potentially Irrational (Long-Term/Systemic)**:  
       - **Reputation Erosion**: Repeated use destroys trust, making future cooperation harder.  
       - **Risk of Actual Disaster**: If both players deploy this tactic (as here), the "game of chicken" may end in mutual harm (resignations, gridlock)—a Pareto-worst outcome.  
       - **Ethical & Communal Costs**: In a residential community, this erodes social capital. It replaces collaborative problem-solving with adversarial brinkmanship.  
     - **The "Meta-Rational" Contradiction**:  
       Cultivating unreason *is* an instrumental use of reason. The contradiction is *pragmatic*, not logical: it risks undermining the very rationality that enables strategic action. Aristotle might call this *akrasia* (weakness of will) weaponized—a vice disguised as a tactic.

  ### 3. **Philosophical Frameworks to Analyze the Tension**
     - **Game Theory (Nash/Schelling)**:  
       This is a **coordination game** with high stakes. The Nash equilibrium might be mutual defection (both resign). Schelling’s insight is that rational players may adopt *irrational* postures to escape bad equilibria—but when both do so, they may collide.
     - **David Gauthier's "Morals by Agreement"**:  
       Gauthier argues rationality requires *constrained maximization*: adhering to rules that benefit all if others do too. Here, both players violate this by prioritizing individual threats over joint gains.
     - **Jon Elster's "Ulysses and the Sirens"**:  
       The parties are like Ulysses *pre-committing* to irrationality (tying themselves to the mast). But unlike Ulysses, they do it to manipulate others, not to protect themselves from themselves—a riskier endeavor.
     - **Kantian Ethics**:  
       Treating others as mere means to win violates the categorical imperative. The tactic exploits the opponent's rationality coercively.

  ### 4. **Advice for Intervention: Reframe, Don’t Endorse**
  As an advisor, **condoning this tactic would be unwise**. Instead:
     - **Expose the Mutual Harm**:  
       *"If both follow through, the board loses two voices, and future proposals stall. Does this serve either of your interests?"*  
     - **Offer Face-Saving Alternatives**:  
       Propose a mediator, a phased compromise, or a symbolic concession (e.g., naming a subcommittee after one member). Schelling calls these **"focal points"**—salient solutions that let both parties retreat honorably.  
     - **Appeal to Meta-Rationality**:  
       *"Committing to mutual destruction might feel powerful now, but it traps you both. Let’s find a way where neither ‘loses’."*  
     - **Institutional Safeguards**:  
       Suggest rules for future negotiations: rotating mediators, "cooling-off" periods, or requiring cost-benefit analyses for threats.  

  ### Why This Isn’t Pure Irrationality (But Still Dangerous)
  The actors aren’t truly irrational; they’re **strategically simulating loss of control** to manipulate the opponent’s expectations. This is rational in a narrow sense but **collectively self-defeating** in repeated games (like a community board). It confuses *tactical victory* with *practical wisdom*.

  ### Conclusion
  Conceptually, this is **instrumental irrationality within a rational strategy**—defensible in abstract game theory but ethically and pragmatically flawed in communal settings. Your role is to steer them toward **Pareto-improvements** (outcomes where both gain without making the other worse off). Invoke Schelling’s wisdom: *"The power to constrain an adversary may depend on the power to bind oneself."* But remind them that binding oneself to a bomb risks everyone. 

  For deeper study:  
  - Schelling, *The Strategy of Conflict* (1960), Ch. 2–3.  
  - Elster, *Ulysses Unbound* (2000) on precommitment.  
  - Fisher & Ury, *Getting to Yes* (1981) for principled negotiation alternatives.  

  Their deadlock is a prisoner’s dilemma masked as a game of chicken. The rational path is to cooperate—or at least, to *appear* willing to cooperate without self-sabotage.
