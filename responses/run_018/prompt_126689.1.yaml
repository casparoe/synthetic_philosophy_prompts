  Next, distinguishing "too demanding" from "hard." If it's just hard, that's not an objection. The reply must show where consequentialism crosses into problematic demand. Moral breathing room—this is tricky. Is it essential or a luxury? Some argue it's necessary for personal integrity, others see it as weakness. The reply has to address this tension.

  Aggregation is big. Consequentialism sums up all consequences, so helping many strangers can override personal projects. A reply must handle if that's reasonable or if personal ties should matter. 

  Conflicting requirements: probably distinguishing cases and preserving breathing room. If you protect breathing room, you might allow actions that don't maximize good, failing in cases like the drowning child. 

  Now the two replies. Cost-sharing: distributing duties among agents. Helps with over-demandingness but might not solve aggregation if everyone's required to help maximally. Also, in a one-person world, no sharing, so demands remain high. 

  Partiality and projects: allows personal commitments. This gives breathing room but might collapse the drowning child case. If you prioritize your project over saving a child, that's problematic. Also, in a one-person world, partiality doesn't apply since no relationships, so demands could still be overwhelming. 

  The niche case: one-person world. Here, consequentialism demands maximizing self-improvement or resource use. If the theory requires constant sacrifice of personal enjoyment, it might still be too demanding. A reply must address whether self-regard has limits even when alone. 

