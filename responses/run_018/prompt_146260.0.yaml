  Practical solutions: They could require objectors to specify testable blocker hypotheses, or add "investigative tractability" as a subdimension. Also worth noting this fallacy bleeds into all domains where resource allocation happens - like venture capital dismissing unfunded ideas as "obviously flawed" without evidence. 

  The user's frustration is valid. This pattern protects conventional wisdom and stifles innovation. My response should validate their insight while giving them conceptual tools to push back. They're not just being pedantic - they've spotted a systemic weakness in how we evaluate potential impact.
answer: |-
  Your observation cuts to a core tension in practical prioritization frameworks—a self-referential loop I call the **"ITN Self-Negation Paradox"** or **"Necessitarian Trap."** This pattern treats the *current state of effort* as infallible evidence about intrinsic properties (tractability/neglectedness), creating circular reasoning that dismisses novel opportunities. Let's dissect it:

  ### Core Elements of the Pattern
  1. **Self-Sealing Neglect-to-Intractability Inference**:  
     - Premise: "If X were truly tractable + high-impact, rational actors would have already implemented it."  
     - Observation: X remains neglected.  
     - Conclusion: Therefore, X *must* have hidden intractability.  
     - Flaw: Assumes perfect information, rational coordination, and zero institutional/behavioral friction. No *positive evidence* of blockers is required—neglect itself becomes proof.

  2. **Effort-to-Non-Neglect Inference**:  
     - Premise: "Significant existing effort proves a cause isn't neglected."  
     - Flaw: Ignores whether effort is *sufficient* relative to scale. A cause with 10x underinvestment might have "some" effort but remain critically neglected.

  3. **The Circularity**:  
     - **Unattempted?** → "Must be intractable!" → Low priority.  
     **Attempted?** → "Not neglected!" → Low priority.  
     Genuine high-ITN opportunities get squeezed out.

  ---

  ### Distinguishing from Rational Counterparts
  This isn't merely Bayesian updating or adverse selection. Key differences:

  | **Concept**               | **Rational Version**                                                                 | **Necessitarian Trap**                                                                 |
  |---------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Bayesian Update**       | Adjusts belief based on *positive evidence* of blockers (e.g., failed trials, expert consensus). | Uses *absence of effort alone* as evidence, requiring no mechanistic explanation.        |
  | **Adverse Selection**     | Focuses on *asymmetric information* (e.g., insiders avoid a cause due to hidden risks). | Assumes *all relevant actors* share perfect knowledge, making neglect inexplicable absent intractability. |
  | **Efficient Market Hypothesis** | Applies to liquid markets with competition. | Wrongly extends to domains with high friction, fragmented actors, or misaligned incentives (e.g., policy/philanthropy). |

  ---

  ### Boundaries and Broader Applications
  This fallacy extends beyond ITN into any resource allocation system:
  - **In VC**: "If this startup idea were good, someone would have built it already."  
  - **In Policy**: "If this regulation were beneficial, it would exist."  
  - **In Academia**: "If this research question were important, labs would study it."  

  It becomes fallacious when:  
  1. **No Mechanism Proposed**: Neglect is treated as *sufficient proof* of intractability without identifying *how* blockers operate.  
  2. **Ignoring Coordination/Incentive Failures**: Overlooks reasons for neglect unrelated to intrinsic difficulty (e.g., fragmented ownership, short-term incentives, ideological blind spots).  
  3. **Static World Assumption**: Assumes current effort reflects optimal allocation, ignoring path dependence or recent changes in context/tools.

  ---

  ### Solutions: Breaking the Loop
  1. **Demand Specificity**: Require hypotheses about *what* blocker exists (e.g., "Regulatory capture prevents this policy" vs. "It’s probably hard").  
  2. **Test for Neglect-Sensitivity**: Ask: "If we poured $10M into this, would it likely succeed?" If yes, initial neglect may stem from coordination failure, not intractability.  
  3. **Add a 4th Dimension: "Leverage"**: Assess your *unique capacity* to overcome blockers others can't (e.g., insider access, novel technology).  
  4. **Historicize**: Identify cases where "obvious" solutions were delayed for non-tractability reasons (e.g., anesthesia's 40-year adoption lag due to professional politics).  

  ### Why This Matters
  This pattern isn't just theoretical—it systematically biases prioritization toward:  
  - **Conservative Choices**: Favors incrementalism over transformative change.  
  - **Bandwagon Effects**: Overvalues crowded fields ("proof" of tractability) despite diminishing returns.  
  - **Omission Blindness**: Dismisses overlooked causes without investigation.  

  By naming and disarming this heuristic, you reclaim space for truly novel high-impact interventions. The burden of proof should lie with skeptics to identify *specific* blockers—not with proponents to prove a negative ("no hidden dragons exist").
