  The user seems analytically inclined - they're using terms like "Bayesian update" and "adverse-selection reasoning," suggesting they have some background in formal decision theory. But they're frustrated by what feels like a broken heuristic in effective altruism circles. Their core question has three layers: naming the fallacy, distinguishing it from rational inference patterns, and defining its boundaries beyond ITN.

  Let me unpack this systematically. First, the reasoning pattern they describe does resemble several known concepts. The "if it were easy, it'd be done already" argument is essentially an appeal to the efficient market hypothesis applied to causes. But as the user notes, this ignores that cause-selection isn't a liquid market - there's information asymmetry, institutional inertia, and coordination problems. 

  The circularity aspect is key. This isn't just Bayesian updating, because Bayesianism would require positive evidence of blockers, not just absence of effort. The user is right to sense something fishy - it's closer to affirming the consequent: "If intractable, then neglected; it is neglected; therefore intractable." Logical fallacy 101. 

  For naming, "Zombie Cause Paradox" captures the undead nature of causes that can't qualify under this logic. "Necessitarian Trap" emphasizes the false necessity assumption. But "ITN Self-Negation" might be most precise for their context. 

