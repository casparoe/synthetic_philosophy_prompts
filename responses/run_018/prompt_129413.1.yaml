answer: |-
  ## The Agent's Present Holds the Truth

  The statement "there will be a sea battle tomorrow" is neither false nor truth-valueless if the choice is genuinely open; its truth is relational, grounded in the *present causal powers and inclinations* of the relevant agents, not a future state. Aristotle’s sea-battle problem highlights the dilemma: if the battle is genuinely contingent on a future free choice, must we deny truth-value to such future-tense statements to preserve openness? Three-valued logic (True, False, Indeterminate) offers a fix, assigning "Indeterminate" to genuinely open future contingents. While acknowledging openness, this creates problematic gaps in truth and burdens logic with a third category that feels ontologically suspect.

  Agent causation provides a superior resolution. If the admiral possesses the genuine causal power tomorrow to either initiate or avoid battle based on reasons, then *today's* truth about tomorrow’s battle depends entirely on the admiral’s *present* causal capacities, settled intentions (if any), and the broader causal landscape. The statement "There will be a sea battle" is true *now* only if present agent powers and circumstances causally necessitate it. If the admiral’s free choice is a genuine causal power not yet exercised or determined, the statement is false *now*. Its truth isn't about a future event's existence, but about the sufficiency of *present* causes. This relational view preserves logical bivalence (True/False) without denying openness: a statement is false if present causes are insufficient to guarantee the event, true only if they are sufficient (including determined agent states). The future is open *because* present causal powers (especially agent-causal ones) are not yet fully realized in a single outcome. Truth tracks current causal potential, not future actuality.
