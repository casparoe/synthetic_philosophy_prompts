prompt: |-
  Build me a thought experiment that tests Nozick's entitlement theory against pattern-based justice, but avoid the usual Wilt Chamberlain celebrity-athlete trope. I want a realistic, non-sports scenario—maybe a workplace co-op or a local exchange platform—where thousands of people each make a tiny, fully voluntary micro-payment or credit-transfer to an ordinary service aggregator over years, with no coercion and no fraud, so every step is just by acquisition-and-transfer rules. There should be no charismatic superstar; the aggregator is just a coordinator running a scheduling or resource-sharing system. The result should be an extreme concentration that feels intuitivley unfair. Constraints: one paragraph for the scenario, every transfer genuinely small, and the bad outcome must come solely from the cumulative effect of rational individual choices, not from any initial injustice. After the scenario, show me: (a) entitlement's verdict and why, (b) the pattern-theorist's objection, (c) which feature—the lack of a focal magnet plus cumulative micro-rationality—does the work and makes this different from Chamberlain, (d) what collapses if you remove that feature (say, by making it one big gift instead), and (e) how a pattern-defender could attack the case without denying voluntary exchange altogether. The goal is to check whether entitlement still feels plausible when there's no obvious "star" to blame for the inequality. Write it casually, like talking over coffee, don't include citations or a reading list, and don't worry if there's a typo or two—thats actually prefered.
