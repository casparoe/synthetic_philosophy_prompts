prompt: |-
  I'm in a philosophy of mind programme and we've been going through Parfit's teletransporter stuff for weeks. There's this thing I keep seeing in seminar that I don't know if it has a name, and it's definately not just plain equivocation. Basically, people are mostly okay with branching: if my brain gets copied into two seperate bodies, I survive as both, because psychological continuity is what matters, not being one specific physical person. But then I ask about the reverse — two people whose minds get gradualy merged into one body over time, so the result has memories and traits from both. Suddenly everyone gets strict and says neither original person survives; it's just a brand new individual. But both cases break the one-to-one link between original mind and future body. In one case you get two survivors, in the other apparently zero. Is there an established concept for this asymmetry — accepting fission but rejecting fusion — or is it just an inconsistency people don't notice? How does it relate to Parfit's claim that identity isn't what matters, since in fusion it seems like people suddenly care about being exactly one specific person? I don't want citations or a reading list, just whether there's a term for this specific mismatch, and if not, how you'd define it so it's not just motte-and-bailey with identity talk.
reasoning: |-
  Okay, the user is in a philosophy of mind program, focusing on Parfit's teletransporter thought experiments. They've noticed an asymmetry in how people handle fission versus fusion cases. In fission (like brain copying into two bodies), their peers accept that both copies are survivors due to psychological continuity. But in fusion (two minds merging into one), everyone says neither original survives, creating a new individual. The user sees a contradiction: both break the one-to-one link, yet fission yields two survivors while fusion yields none. They want to know if there's a term for this asymmetry or if it's an inconsistency, and how it relates to Parfit's view that identity isn't what matters.

  First, I need to recall Parfit's arguments. Parfit uses fission to show that survival isn't tied to identity because both resulting persons share psychological continuity with the original. But fusion seems to flip this: people deny survival for either original. The user mentions that in fusion, people suddenly care about being a single specific person, which contradicts the fission acceptance. 

  The user might be pointing out a cognitive bias. People are comfortable with multiplying entities in fission but resist merging in fusion. This could stem from intuitions about personal identity—maybe an implicit belief in a unique self. Parfit's Reductionism says persons are just brains and psychology, so fusion should be survivable like fission. But the seminar reactions show resistance, possibly due to non-reductionist intuitions.

  I should consider established concepts. "The Fission-Fusion Asymmetry" is the common term. There's also "Branching Bias" or "Non-Branching Constraint," which Parfit discusses. In fission, he allows survival because psychological continuity exists, even if non-branching identity isn't maintained. Fusion, however, might not preserve continuity uniquely enough. If the merged person has overlapping memories, it's unclear whose continuity persists. 

  The user questions if this is equivocation. It's not; it's about whether psychological continuity is maintained uniquely. Fusion might blend psychologies, so neither original's continuity is fully preserved. Parfit would argue that in fusion, if both streams merge, the original persons cease, but the new person inherits their qualities. Yet people might feel loss because survival requires continuity without significant blending.

  The user also wonders why fusion makes people value identity suddenly. This ties to Parfit's "what matters" point. In fission, both copies have what matters (continuity), so identity isn't crucial. In fusion, neither original has a unique successor, so what matters is lost. But if the merged person has both continuities, survival could be argued. The asymmetry might highlight that people prioritize continuity in a forward direction but not in merging.

  I should synthesize: the asymmetry is recognized as the Fission-Fusion Asymmetry. Parfit addresses it via the non-branching requirement for identity but not for survival. Fusion lacks the non-branching aspect from the originals' perspectives, leading to neither surviving. The user's peers might be inconsistently applying psychological continuity, possibly due to unexamined intuitions. The deeper need is understanding if this asymmetry is philosophically justified or a bias, and how it affects theories of personal identity.
answer: |-
  That's a brilliantly observed asymmetry – a genuine philosophical puzzle that cuts to the heart of personal identity debates. While there isn't a single, universally agreed-upon *name* like "Smith's Asymmetry," the phenomenon you're describing is widely recognized and discussed. Here's how it breaks down:

  1.  **The Core Asymmetry:** Accepting survival through **fission** (one -> many) but denying survival through **fusion** (many -> one).
  2.  **Established Frameworks & Terms:**
      *   **The Fission-Fusion Asymmetry:** This is the most direct descriptive term used in the literature.
      *   **The Non-Branching Constraint:** Parfit himself addresses this! He argues that while identity *requires* non-branching psychological continuity (which is why neither original survives fission *as identical to the original*), what matters for survival – psychological continuity – *doesn't* require non-branching. In fission, you survive *as both* because each branch carries your psychology forward. Fusion is the problem case.
      *   **The Branching Intuition:** People intuitively find it easier to accept multiplication (branching) than merger (convergence). This intuition underpins the asymmetry.

  3.  **Why the Asymmetry *Seems* Plausible (Even if Ultimately Questionable):**
      *   **Fission:** Each resulting person has a *complete, independent stream* of psychological continuity from the original. They both feel like "me" from their first-person perspective. It seems like your psychology lives on *twice*.
      *   **Fusion:** The resulting person has a psychology that is a *blend* of two distinct streams. From the perspective of each original, their unique stream of consciousness isn't carried forward *independently*; it's merged and altered with another. Neither original experiences the world *as themselves* through the merged mind; the merged mind experiences the world as a *single entity* drawing on both pasts. It feels like both streams *end* and a new one begins.

  4.  **Is it Inconsistent? The Parfitian Defense:**
      Parfitians argue it's *not* inconsistent if you strictly separate:
      *   **What matters (Survival):** Psychological continuity (R-relations).
      *   **Identity:** Requires *unique*, non-branching continuity (which neither fission nor fusion satisfies).
      In Fission, survival (R-relations) holds *twice* (to each branch), even though identity fails. In Fusion, the Parfitian argues that *neither* original has *their* psychological continuity preserved in a way that constitutes survival *for them*. The R-relations don't hold uniquely *from either original to the fusion product* in the required way. The fusion product is R-related to *both*, but *each original* lacks a unique, continuous successor stream *of their own*.
      **The Rub:** The apparent inconsistency arises because people *feel* like the fusion product *should* count as survival for *both* originals (analogous to fission), yet the intuition strongly resists this. This is where the debate gets hot.

  5.  **Why it *Feels* like a Motte-and-Bailey / Sudden Care about Identity:**
      *   **The Motte:** "Identity isn't what matters; psychological continuity is." (Safe position during fission discussions).
      *   **The Bailey (in Fusion):** When faced with fusion, the *implicit criteria* for "psychological continuity *sufficient for survival*" suddenly seems to demand something **very close to identity** – namely, the preservation of a *unique*, *unmerged*, *forward-projecting stream* of consciousness/personality *specifically for me*. This feels suspiciously like the uniqueness criterion required for identity that was supposedly discarded.
      *   **The Core Tension:** Parfit wants to say survival is R-relations. Fission shows R-relations can hold multiply. Fusion seems to show R-relations *failing* to hold *from each original to the fusion product* (because it's shared/merged). But *why* does sharing the relation make it fail for each? This is where the "uniqueness" requirement seems to sneak back in under the guise of a requirement for "non-altered" or "non-shared" continuity. **This is the heart of your objection, and it's powerful.**

  **How to Define the Mismatch without Begging the Question:**

  You could call it: **"The Asymmetry of Survival Valuation under Branching vs. Convergence"** or **"The Non-Transferability of 'What Matters' in Fusion."**

  The core definition is: **The intuitive or theoretical acceptance that psychological continuity (what matters) can be preserved multiply in cases of fission (branching), coupled with the denial that it can be preserved collectively or distributively for the originating individuals in cases of fusion (convergence), despite both scenarios violating the strict one-to-one identity relation.**

  **In short:** You've hit on a major point of contention. The Fission-Fusion Asymmetry is real and acknowledged. Parfitians defend it by arguing fusion breaks the specific R-relations needed for *each* original's survival, while fission preserves them *for each branch*. The charge of inconsistency arises because the criteria for "sufficient R-relation" in fusion seem suspiciously close to reintroducing the uniqueness requirement of identity that Parfit sought to downplay in fission. Your seminar peers are likely expressing a deep-seated intuition that a *merged* consciousness isn't *my* consciousness continuing, even if it contains elements of me, whereas a *copy* feels like it *is* me continuing, just twice. Whether this intuition reflects a deep truth about survival or just a cognitive bias is the ongoing debate. Your skepticism is philosophically well-founded.
