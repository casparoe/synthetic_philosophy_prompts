answer: |-
  ### Brainstorm
  The individualism/holism debate centers on whether social phenomena are reducible to individual actions and mental states, or whether social entities (structures, institutions, collective intentionality) have irreducible causal powers. Individualists argue all explanations must bottom out in individuals to avoid reification; holists counter that some patterns or constraints only emerge at the collective level and exert "downward causation." Key tests include: *causal redundancy* (does adding social entities explain more than individuals alone?), *multiple realizability* (could the same social outcome occur with different individuals?), and *supervenience* (do changes in individuals *always* change social facts?). Your cases probe where individualist aggregation fails and structural/emergent forces become necessary.

  ### The Principle
  **The explanatory necessity of holism arises when outcomes depend on *causal interdependencies among individuals* mediated by relational structures that constrain or enable actions in ways irreducible to intrinsic properties.** When individual actions are *modular* (explainable by intrinsic states without reference to others' simultaneous states), individualism suffices. When actions are *relationally entangled* (their rationality, possibility, or meaning depends on others' actions or positions within a network), holism is required. 

  **Clause 1: Modularity → Individualism.** Maria’s strike participation is explainable by her intrinsic beliefs/anger alone; her action doesn’t *depend* on others’ simultaneous choices. Region A’s unemployment aggregates independent decisions (each owner calculates costs solo). Here, reshuffling individuals (with identical properties) wouldn’t change the outcome.  
  **Clause 2: Relational Entanglement → Holism.** Region B’s identical unemployment spike despite different local conditions implies global factors (e.g., credit markets, trade policies) that *couple* individual decisions. Owners aren’t acting modularly; their choices are constrained by systemic forces. Gridtown’s divergent macro-patterns from identical agents prove that network *relations* (not intrinsic properties) cause outcomes. Reshuffling agents while preserving structure changes nothing, but altering structure (even with identical agents) changes outcomes. The zoning referendum fails due to interdependent expectations: My vote depends on my belief about *your* vote, creating a feedback loop. Reshuffling voters’ intrinsic preferences wouldn’t help; only altering the *shared expectation structure* would change the outcome.

  ### Application to Unlisted Cases
  - **"Glimmer"**: Holism applies. Initially, adoption might be modular (individuals independently find the word useful). But once grammatical rules emerge, using "glimmer" *correctly* depends on the collective practice. Its meaning is entangled with the community’s usage patterns—reshuffling individuals who lack awareness of these rules would disrupt the phenomenon. The linguistic framework explains why individuals converge on *this* specific usage.  
  - **Startup vs. Corporate Culture**:  
    - *Small startup*: Individualism. Culture supervenes almost entirely on the founder’s actions/beliefs. Without relational complexity (flat hierarchy, direct influence), reshuffling employees erases the culture.  
    - *Large corporation*: Holism. Culture persists due to entrenched structures (hierarchies, routines, symbols) that mediate interactions. New hires adapt to *existing relations*; reshuffling individuals doesn’t reset the system because the structure constrains behavior downward.  

  ### Tensions and What to Drop
  Your Maria verdict conflicts with the strictest reading of the principle. If reshuffling *all other strikers* while keeping Maria’s anger constant might alter her participation (e.g., if she only joins when critical mass exists), her action isn’t fully modular. To save individualism here, you must **drop the "fully explain" claim** and concede that *some* background social conditions (e.g., the strike’s existence) are presupposed. The tradeoff: Individualism gains parsimony but risks ignoring how individual psychology is shaped by social context. Conversely, holism explains entanglement but may over-attribute causality to abstract entities. Your other verdicts cohere: Region A (modular) vs. Region B (entangled), Gridtown (structural relations), and zoning (interdependent expectations) align cleanly.

  ### Confidence Note  
  Confidence: 8/10. The principle robustly handles cases of strategic interdependence, structural constraint, and emergent meaning. However, I’m least confident about **ontological weight**—whether relational entanglement *requires* positing irreducible social entities or just complex relational facts about individuals (e.g., "shared expectations" as distributed mental states). This mirrors the "supervenience without reduction" debate. Your Gridtown case suggests structures are real pattern-explainers, but hardcore individualists might still call them "shorthand" for micro-dynamics.
