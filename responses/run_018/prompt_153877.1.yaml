  Putting Question 3 (counterfactuals) later ensures it builds on the first two. Without clear mechanisms, speculating on "what if no volcano?" is just storytelling. But once they have frameworks, it becomes a tool to test their models. For instance, comparing scenarios where the same trigger hits different vulnerabilities clarifies agency’s role. Determinism creeps in if counterfactuals ignore human adaptability; the guardrail is grounding them in documented historical alternatives (e.g., societies that weathered similar crises differently).

