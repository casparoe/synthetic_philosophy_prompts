      *   **Conventionalism/Instrumentalism:** Explains why you *would want to* protect the core (it's a useful tool/convention, not a truth claim).
      *   **Bayesianism:** Explains why it's *rational* to have extremely high prior confidence in established cores.

  4.  **Required Changes (Dropping Hard-Core Protection):** Moving to a view where cores can be rewritten requires transforming the board from a preserver of canon into an evaluator of competing formulations. This demands new procedures (proposal systems, comparative evaluation), expertise (scientists judging evidence), and tolerance for textbook instability/inconsistency as knowledge evolves. The focus shifts decisively from stability to empirical adequacy.
