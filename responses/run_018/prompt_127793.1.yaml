  Please explain the conceptual tension between Gödel's philosophical argument for the ideality of time — that temporal succession lacks objective reality and depends on a rational or subjective ordering — and the mathematical structure of his rotating-universe solution to Einstein's field equations, in which every observer retains a local arrow of time even though global chronological ordering collapses through closed timelike curves. In particular, analyse whether those curves strengthen his Kantian-inspired idealism (by showing that 'before' and 'after' have no globally consistent physical meaning) or weaken it (since local metric orientation remains physically definite everywhere). Your explanation should clearly distinguish local time-orientation from global chronology, and should treat Gödel's cosmological and philosophical claims as interrelated rather than separate.
