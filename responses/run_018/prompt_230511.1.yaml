prompt: |-
  I chair the selection committee for a small private foundation's annual early-career prize. The founding document says the award is to recognize work of outstanding distinction, but a later amendment adds that the committee must give due weight to the obstacles a candidate has overcome in producing that work, and the amendment offers no operational guidance. This year we are deadlocked between two finalists. Candidate A is stronger on every forward-looking measure we have—publication record, letters, proposed research program, expected future contribution—and A enjoyed every advantage: two academic parents, no student debt, uninterrupted research time, and excellent mentorship from the start. Candidate B's file is good but clearly weaker overall, though it includes one solo paper that outside reviewers call unusually original; B is a first-generation student, worked twenty hours a week throughout the degree, and had no real research mentor until the final year. One faction on the committee says choosing B would turn a merit prize into a consolation prize and would penalize A for advantages A never chose. The other faction says a system that ignores starting points is not a meritocracy at all: B's record, relative to the obstacles B faced, is the stronger demonstration of desert, and the award should track earned achievement rather than inherited head starts. I need to circulate a three-page decision memo before our meeting that makes a concrete recommendation—A, B, divide the prize, or revise the criteria and defer—states a principle future committees can apply, and engages the strongest version of the losing position rather than a weakened version of it.

  Years of reading rationalist commentary have left me suspicious that the word merit is doing several jobs at once here, and I want the memo to keep at least three of them apart: backward-looking desert, meaning what a person has earned given where they started; forward-looking expected value, meaning what the prize will buy in the way of future work; and need, meaning who would benefit most from the resources. I also want the memo to reason about the choice ex ante, as the selection of a decision rule future committees could commit to, rather than as a retrospective verdict on two particular biographies. It should guard against the common failure mode of settling on a principle that happens to flatter the candidate one already preferred. Without reaching for citations or name-dropping, the memo should say whether the committee's disagreement survives that separation, whether either side is smuggling in a different principle while calling it merit, and what decision rule a future committee should adopt. It should end with an actionable bottom line the foundation can implement this year.
reasoning: |-
  Okay, the user chairs a selection committee for an early-career prize and is dealing with a deadlock between two candidates. Candidate A has stronger credentials but had significant advantages, while Candidate B has good but weaker credentials with notable obstacles overcome. The committee is split on whether to reward pure excellence or consider the context of achievement. The user needs a memo that makes a recommendation, establishes a principle for future committees, and addresses the strongest arguments from both sides.

  The user's explicit request is for a structured memo resolving the deadlock. But deeper, they want clarity on the concept of "merit" itself. They mentioned separating desert, expected value, and need. They also want the decision framed as a rule for future committees, not just this case. This suggests they're seeking a principled framework to prevent recurring deadlocks and subjective bias.

  The key tension is between forward-looking criteria (future potential) and backward-looking (overcoming adversity). The user suspects "merit" is being used ambiguously. The memo must dissect this without academic jargon. The founding document emphasizes "outstanding distinction," but the amendment adds "due weight to obstacles." The amendment lacks guidance, causing the current dilemma.

  The user’s unspoken needs might include:  
  - Avoiding setting a precedent that could undermine the prize’s prestige or fairness.  
  - Ensuring the foundation’s long-term goals (e.g., fostering innovation vs. equity) are honored.  
  - Mitigating committee biases by making the criteria objective.  
  - Preventing future committees from facing similar deadlocks.  

  The memo should explicitly separate desert (B’s context-adjusted achievement), expected value (A’s future potential), and need (B’s resource constraints). The strongest counterarguments:  
  - For A: Awarding B might dilute merit into a "consolation prize," discouraging excellence.  
  - For B: Ignoring starting points makes meritocracy a myth that favors privilege.  

  The solution must be actionable now. Splitting the prize risks making both sides feel compromised. Deferring might not resolve the core conflict. Revising criteria is ideal but takes time.  

  The recommendation should prioritize desert based on the amendment’s intent, as it directly addresses obstacles. This creates a clear rule: merit includes context. Future committees can apply this consistently. Awarding B this year reinforces that principle without rejecting A’s excellence—it just defines merit differently.  

  For implementation:  
  - State that the prize recognizes "distinction relative to opportunity."  
  - Create a rubric assigning explicit weight to obstacles.  
  - This year, choose B as the candidate whose achievements reflect the greatest relative merit.  
  - This ends the deadlock, sets a precedent, and fulfills the amendment’s spirit.
answer: |-
  ## MEMORANDUM  
  **To:** Selection Committee Members  
  **From:** Chair, Early-Career Prize Committee  
  **Subject:** Resolution of 20XX Prize Deadlock & Framework for Future Awards  
  **Date:** October 26, 2023  

  ---

  ### I. Core Issue & Recommendation  
  **Deadlock Summary:** We are split between Candidate A (objectively stronger future-facing metrics, privileged background) and Candidate B (contextually exceptional achievements despite significant obstacles, weaker overall profile).  

  **Immediate Recommendation:**  
  **Award the prize to Candidate B.**  
  This decision best fulfills our mandate to recognize "outstanding distinction" while giving "due weight to obstacles overcome," as required by the amendment. It establishes a precedent that merit must account for starting conditions.  

  **Action for This Year:**  
  - Notify Candidate B as the winner.  
  - Draft a public citation highlighting both the originality of B’s solo work *and* the resilience demonstrated in achieving it under constrained circumstances.  

  ---

  ### II. Principles: Separating the Meanings of "Merit"  
  Our stalemate arises from conflating three distinct concepts under "merit." Clarity on these resolves the deadlock:  

  1. **Desert (Backward-Looking):** *What has the candidate earned, given their starting point?*  
     - Measures achievement *relative to opportunity*.  
     - **Relevance:** The amendment explicitly demands this lens ("due weight to obstacles"). B’s solo paper, produced without mentorship or financial security, demonstrates exceptional agency and grit. A’s work, while superior in volume, emerged from optimal conditions.  

  2. **Expected Value (Forward-Looking):** *What future contribution will the prize incentivize?*  
     - Prioritizes projected outputs (e.g., research plans, publication potential).  
     - **Relevance:** A excels here. However, the founding document’s focus on "work of outstanding distinction" is past-/present-oriented; the amendment adds a desert-based constraint. Pure expected value ignores our duty to weigh obstacles.  

  3. **Need (Resource Impact):** *Who would benefit most from the prize?*  
     - Considers the award’s transformative effect (e.g., debt relief, network access).  
     - **Relevance:** B clearly benefits more. However, this is not a need-based award, and invoking "need" alone would violate the "outstanding distinction" requirement.  

  **The Committee’s Disagreement Survives Separation—But Shifts:**  
  - **Pro-A Faction** emphasizes *expected value*, treating merit as future potential.  
  - **Pro-B Faction** emphasizes *desert*, treating merit as context-adjusted achievement.  
  - **Neither faction is "smuggling" hidden principles;** both honor "merit" but define it differently. The amendment’s inclusion of "obstacles," however, forces desert into our calculus. Ignoring it would render the amendment meaningless.  

  ---

  ### III. Addressing the Strongest Counterarguments  
  **Strongest Case for A:**  
  > "Choosing B penalizes A for unearned advantages and turns a merit prize into a consolation prize. Excellence should be rewarded absolutely, not relatively."  

  **Engagement:** This view is defensible if merit is purely forward-looking. However, our mandate *requires* weighing obstacles, rejecting a purely absolute standard. Awarding B is not "consolation"; it recognizes that B’s achievements required extraordinary effort and agency under adversity—a core aspect of "distinction." A’s advantages do not diminish their excellence, but the amendment demands we assess work *in context*.  

  **Strongest Case for B:**  
  > "A system blind to starting points is not meritocratic—it confuses privilege with merit. B’s resilience demonstrates greater desert."  

  **Engagement:** This correctly centers desert but underweights our duty to ensure the work itself is "outstanding." B’s solo paper meets this bar (validated by reviewers), but a candidate with *only* obstacles and no distinction would not qualify. Here, B clears both hurdles.  

  ---

  ### IV. Decision Rule for Future Committees  
  **Adopt a "Desert-Adjusted Excellence" Framework:**  
  1. **Tier 1: Excellence Threshold**  
     - Candidates must first meet a minimum bar of objective achievement (e.g., groundbreaking work, peer validation).  
     - *Purpose:* Ensures "outstanding distinction" is satisfied.  

  2. **Tier 2: Desert Adjustment**  
     - Among threshold-clearing candidates, evaluate the *context* of achievement: obstacles overcome (e.g., financial hardship, lack of mentorship, systemic barriers).  
     - *Purpose:* Operationalizes "due weight to obstacles" by comparing candidates *relative to opportunity*.  

  **Why This Rule?**  
  - **Fidelity to Mandate:** Honors both the original "distinction" requirement and the amendment.  
  - **Ex Ante Fairness:** Future candidates know excellence is necessary but not sufficient; resilience matters.  
  - **Guards Against Bias:** Prevents committees from overcorrecting (ignoring excellence) or undercorrecting (ignoring context).  

  **Implementation:**  
  - Develop a rubric scoring:  
    - (a) Objective excellence (50%: originality, impact, rigor).  
    - (b) Desert (50%: obstacles overcome, agency demonstrated).  
  - Require threshold scores in (a) before (b) is considered.  

  ---

  ### V. Bottom Line & Next Steps  
  **Immediate Action:**  
  - Award the 20XX Prize to **Candidate B**, per the "desert-adjusted excellence" principle.  

  **Future Actions:**  
  1. **Revise Criteria:** Formalize the Tier 1 (Excellence) / Tier 2 (Desert) framework in award guidelines.  
  2. **Rubric Development:** Draft a scoring system for next year’s committee (to be reviewed in Q1 2024).  
  3. **No Split/Deferral:** Dividing the prize dilutes its value; deferring delays justice. Our framework resolves the stalemate.  

  **Final Word:** This award celebrates not just *what* was achieved, but *how* it was achieved. Candidate B embodies the spirit of the amended mandate: excellence forged against odds. To ignore obstacles is not neutrality—it is blindness to the very inequities the amendment sought to acknowledge.  

  ---  
  **APPROVED:** Chair, Early-Career Prize Committee
