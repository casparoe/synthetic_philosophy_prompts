  Looking at their points: They accept the scale argument in principle but worry about applying it below an "epistemic floor." That's interesting—they're trying to avoid what they call "multiplying ignorance." Then they bring in neuroscience (recurrent processing) to justify low credence, while also rejecting human exceptionalism and wanting a smooth phylogenetic gradient. That's where the first real tension appears: how can they have both a neurobiological criterion (which sounds binary) and a smooth gradient? 

  The plants/AI point seems defensible on evolutionary grounds, but I wonder if they're underestimating how alien insect cognition might be. And the population knowledge point—that's actually quite clever, suggesting moral obligations shouldn't depend on statistical awareness. 

  The big clashes seem to be between the neuroscience cutoff (point 3) and the smooth gradient view (point 4), and between the scale argument (1) and the epistemic floor (2). The plant/AI distinction (5) might hold if they consistently apply their phylogenetic continuity principle. Point 6 feels compatible with everything else. 

  For fixes: Maybe they could soften the architecture criterion to allow degrees of neural complexity instead of a binary switch. And for the scale/epistemic floor clash, they might need to more rigorously define what constitutes a "coherent description" of experience to avoid arbitrariness. 

