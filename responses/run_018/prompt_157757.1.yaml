prompt: |-
  Write a deadpan internal design specification, approximately 650 words, for a fictional AI governance firm’s proposed “Virtue Calibration Layer” (VCL)—a software module intended to embed Aristotelian virtue ethics in autonomous decision-making systems. Format the piece as numbered technical sections (e.g., 1. Overview; 2. Architecture; 3. Parameter Definitions; 4. Edge Cases and Failure Modes; 5. Deployment and Versioning) using the dry, acronym-heavy prose of an engineering spec sheet.

  The satire should target the reduction of moral character to quantifiable, tunable system properties. The document must treat virtues—courage, temperance, practical wisdom—as hyperparameters subject to optimization, and must introduce and develop an invented but conceptually coherent framework you call Aretaic Gradient Descent (AGD): a method by which an agent “learns” virtue through backpropagation of counterfactual moral regret. Exaggerate a genuine feature of contemporary machine-ethics discourse, namely the assumption that ethical reasoning can be modularized, benchmarked, and version-controlled like any other software component.

  The humor should come from taking both virtue ethics and machine-learning practice seriously: include at least one clause that applies the doctrine of the mean to a loss-function optimization problem, and one formal “bug report” describing a failure mode in which the system achieves perfect moral excellence by refusing to act at all. Do not invent named philosophers or cite specific scholarly works; keep references generic (e.g., “the standard capability taxonomy,” “legacy deontic modules”). Maintain sustained deadpan irony throughout—the voice should never wink—so that a reader familiar with both fields recognizes that the author understands the target and finds the satire fair, while a non-specialist can still follow the parody of bureaucratic overreach.
