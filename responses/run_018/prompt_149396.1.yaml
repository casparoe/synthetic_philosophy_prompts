prompt: |-
  I'm working through Dewey's experimentalism about democracy and inquiry for a seminar, and I'd like to see a dialogue that tests whether his framework genuinely holds together. Have one interlocutor—call her Dr. Reed—defend the view that democratic governance is best understood as a form of collective social inquiry: policies function as working hypotheses tested through their consequences for shared experience, and the boundary between expert and lay judgment is one of degree rather than kind, with democratic participation serving as the primary method of social intelligence rather than mere preference aggregation. Oppose her with Dr. Voss, who argues that if Dewey's model is taken seriously, it either collapses into an unaccountable technocracy—since only trained inquirers can design valid experiments and interpret results—or dissolves into procedural relativism, where any democratic verdict counts as a successful "test" regardless of its epistemic merits. Voss should press Reed specifically on whether Dewey's framework can distinguish a genuinely falsified social policy from one that failed due to poor implementation or external interference, and whether the "community of inquirers" Dewey invokes is defined democratically or epistemically.

  The dialogue should feature real back-and-forth, not parallel monologues: Reed should answer Voss's falsifiability charge by appealing to Dewey's distinction between immediate qualitative experience and mediated reflective interpretation, arguing that democratic citizens are not passive data points but active interpreters of consequences. Voss should counter that this distinction smuggles expert authority back in through the normative criteria used to separate legitimate interpretation from rationalization. They should also work through a concrete, somewhat niche scenario: a municipality runs a participatory budgeting experiment in which citizens vote to defund a public-health surveillance program, and a subsequent disease outbreak is traced partly to that defunding. Reed should argue whether this outcome counts as a falsified hypothesis, an unintended consequence requiring further democratic interpretation, or a case where expert epidemiological judgment should override the democratic verdict without betraying Dewey's commitment to inclusive inquiry. Voss should challenge whether Reed's framework can ever justify overriding a democratic decision on epistemic grounds without abandoning the experimentalist commitment to treating social arrangements as genuinely open to revision by those who live under them.

  Please write this in American English, keeping both characters equally competent—neither should be a strawman—and ensure they respond directly to each other's actual arguments rather than talking past one another. I want to see where the tension lands: whether Dewey's experimentalism about democracy can be repaired by refining the conditions of social inquiry, or whether it must choose between technocratic control and an inability to criticize democratic mistakes.
