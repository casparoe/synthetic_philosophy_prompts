prompt: |-
  A few months back the biggest employer in my town shut down (a processing plant, about 700 jobs) and it's been strange watching how the place coped -- some things fell apart fast, other things quietly reorganized themselves and kept going. It got me reading about societal collapse at the bigger scale, and now I've got a pile of stuff on the Late Bronze Age, the Classic Maya, Easter Island, and honestly everyone seems to mean something different by "collapse." Before I read any more of it I want the spec first: what does any adequate theory of societal collapse actually have to deliver? The cases it must get right, the distinctions it can't fudge (collapse vs. transformation vs. just decentralization, and collapse for whom -- the palace scribes or the ordinary farmers), the evidence it has to stay consistent with, with the case or example behind each requirement. It also has to handle the awkward fact that some of the famous cases are contested -- e.g. the ecocide story about Rapa Nui has been challenged alot, so a theory can't just take the Diamond version as settled fact. Tell me which desiderata you suspect can't be jointly satisfied (my hunch: "collapse is objectively identifiable" and "collapse is bad" pull apart somewhere) and which single requirement knocks out the most popular theories. Give it to me as exactly seven numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is asking for a structured set of criteria that any adequate theory of societal collapse must meet. They've been observing their town's reaction to a major employer shutting down and have been reading about historical collapses. They want a clear spec before diving deeper into the literature. 

  First, I need to unpack what they're really after. They mentioned confusion in how "collapse" is defined—every scholar seems to use it differently. They want to avoid getting lost in contradictory frameworks, so the core need here is epistemological clarity: a litmus test for theories. 

  Their examples (Bronze Age, Maya, Easter Island) show they’re grappling with scale (regional vs. global) and contested narratives (e.g., Diamond’s ecocide vs. newer Rapa Nui research). The subtext is skepticism toward oversimplified stories. They also hint at ethical dimensions—"collapse for whom?"—which suggests they care about whose suffering gets centered. 

  Key challenges they raise: 
  - Defining collapse vs. transformation/decentralization 
  - Accounting for perspective (elites vs. farmers) 
  - Handling disputed evidence 
  - Resolving tension between "collapse as objective" vs. "collapse as bad" 

  For the seven points, I’ll start with non-negotiable empiricism (archaeology must back claims), then zoom in on scale, perspective, differentiation from transformation, contested cases, normative claims, and finally a knockout criterion: failing to explain how commoners experience collapse. The last one targets elite-centric theories (e.g., "collapse is just palaces falling") that ignore resilience in subsistence practices. 

  The ethical tension ("objective vs. bad") gets addressed in point 6: theories must separate analysis from moral judgment. Rapa Nui’s contested story is perfect for point 5—theories can’t cherry-pick evidence. 

  I’ll keep each point telegraphic, no fluff. They want a toolkit, not a lecture.
answer: |-
  Here are seven exacting requirements for any adequate theory of societal collapse:

  1.  **Must resolve scale ambiguity:** The theory must explicitly define the societal unit (e.g., state, city, regional network, entire culture) and geographic scope it claims collapses, accounting for cases like post-Roman Britain (state collapse) vs. persistent peasant life. Failure here conflates political failure with societal extinction.

  2.  **Must distinguish collapse from transformation/decentralization:** It must provide objective criteria differentiating a terminal decline in socio-political complexity from a reorganization or shift in power centers (e.g., the Western Roman Empire's fall vs. the Byzantine continuation or Maya Terminal Classic decentralization into smaller polities).

  3.  **Must explicitly state 'collapse for whom':** The theory must specify whose experience defines collapse – the ruling elite losing power/status (e.g., Hittite court), urban populations facing famine/depopulation, or rural subsistence farmers potentially less affected (e.g., Maya farmers after royal centers declined).

  4.  **Must be consistent with core archaeological evidence:** It must reconcile with fundamental, non-controversial archaeological data like settlement patterns, stratigraphy, and material culture shifts (e.g., explaining the Mycenaean palace destruction layers *and* post-palatial continuity in some regions).

  5.  **Must avoid relying on contested historical interpretations:** It cannot depend on single, highly disputed narratives as foundational proof (e.g., Easter Island's ecocide must be treated as a hypothesis requiring testing, not assumed fact, demanding the theory work with alternative evidence like climatic data or revised chronologies).

  6.  **Must separate normative judgment ("bad") from descriptive analysis:** The theory must define collapse mechanistically, decoupling the *process* from assumed universal negative outcomes. It must explain why "collapse" might be experienced as catastrophic by some (palace scribes) but neutral or even beneficial for others (e.g., peasants freed from corvée labor).

  7.  **Must explain the persistence of underlying population/subsistence:** It must account for how core demographic groups and basic subsistence strategies often survive the "collapse" of higher-order structures (e.g., Egyptian farmers persisted through multiple dynastic collapses; Anatolian populations after Hittite fall), preventing conflation with extinction.

  The requirement most likely to knock out popular theories is **#7 (persistence of population/subsistence)**, as many narratives (especially popular ones) focus dramatically on elite failures and monumental abandonment, implicitly equating this with societal death, while ignoring resilient rural continuities. The tension between **#6 ("objectively identifiable" vs. "bad")** is likely unresolvable as a universal; collapse as an objective process (decline in complexity) is often materially identifiable, but its "badness" is inherently perspectival and situational.
