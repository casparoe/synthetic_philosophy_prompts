answer: |-
  Computer science practice presupposes that the Church–Turing thesis (CTT) is an empirically reliable truth about the physical world and the limits of mechanical computation, not merely a stipulative definition, particularly evident in how complexity classes and physical devices are treated.

  Strictly, for demonstrating *computability* of a function via an informal algorithm, a stipulative reading suffices: the practice relies only on the *agreement* that any formalism deemed "reasonable" (like Turing machines or lambda calculus) captures the intended notion of "effective computability," without needing an external truth. However, complexity theory's treatment of polynomial-time as model-robust (e.g., equating Turing machines with RAM machines or circuits under polynomial-time reductions) assumes that *physical implementations* of these models will exhibit equivalent time complexity bounds up to polynomial factors. This presupposes that no physically realizable "reasonable" model violates polynomial-time equivalence with Turing machines, which is an empirical claim about the universe. Similarly, dismissing physical hypercomputation (e.g., devices solving the halting problem) assumes CTT correctly describes physical limits, an empirical stance.

  If CTT were treated as an open, falsifiable empirical hypothesis:  
  1. **Complexity theory** would need explicit caveats that P, NP, etc., are defined relative to Turing machines, and their relevance to physical computation is contingent on CTT holding. Proving P ≠ NP might not settle whether efficient physical solutions exist.  
  2. **Claims of computability** would require specifying a formal model (e.g., "Turing-computable") rather than relying on informal algorithms, as alternative models might disagree.  
  3. **Physical computation** research would seriously investigate hypothetical hypercomputers (e.g., based on relativistic spacetimes or quantum gravity), rather than a priori rejecting them.  
  The field would lose its canonical view of computation, needing empirical validation for model equivalences and constant vigilance for counterevidence to CTT.
