prompt: |-
  I'm a novelist, and moral worth is basically my professional obsession — I'm constantly deciding whether what a character did was admirable, and I've noticed I keep reaching for a set of working assumptions that might not actually cohere. Can you audit them? Here they are:

  1. Whether something has moral worth depends on why the person did it, not on whether it turned out well or even on whether it was the right thing to do.
  2. The people I most admire, on the page and off, act from immediate unreflective compassion — they jump in the river before there's been time to think. Visible deliberation about what one ought to do is, if anything, a bad sign about a person's character.
  3. Moral worth can't be a matter of luck: two people who would behave identically in every possible situation, differing only in which feelings happen to well up in them, deserve the same moral grade.
  4. Impure motives don't ruin anything. Almost nobody's motives are spotless, and if some vanity or self-interest rides along with the good motive, the act still counts as admirable.
  5. The way to find out what actually moved someone is counterfactual: take away the audience, the good mood, the crush, and ask whether they still would have done it.

  Tell me which of these are genuinely in tension and roughly how severe each tension is, which pairs only look like they're in tension but aren't, and for the real ones what the cheapest fix would be and what it costs me. This matters alot for the book I'm drafting, but I don't want a lecture on the history of ethics — just the audit.
reasoning: |-
  Okay, the user is a novelist obsessed with moral worth in their characters. They’ve listed five working assumptions and want an audit—specifically, where they clash, how severe the tensions are, and cheap fixes. No ethics lectures, just practical solutions for their writing.  

  First, I need to map their assumptions:  
  1. Intentions over outcomes (Kantian vibes).  
  2. Unreflective compassion as ideal (anti-deliberation).  
  3. Moral worth immune to luck (counterfactual consistency).  
  4. Mixed motives are fine (impurity tolerance).  
  5. Counterfactual testing for true motives (removing external factors).  

  The biggest red flag is Assumption 2 vs. the others. It’s romantic but clashes with everything—especially 3 and 5. Why? If someone’s "unreflective compassion" is just luck (e.g., they happened to feel generous that day), then by Assumption 3, that shouldn’t count as morally superior. But Assumption 2 praises spontaneity, which *is* luck-dependent. Also, Assumption 5’s counterfactual test would expose that spontaneity as fragile (e.g., without their good mood, they wouldn’t act). That’s a severe tension.  

  Cheap fix for 2: Shift from "unreflective = best" to "reflexive-but-trained" virtue. Like a firefighter whose training kicks in—still immediate, but rooted in character, not chance. Costs some romanticism but adds depth.  

  Assumption 4 (mixed motives are okay) actually pairs well with 1 and 5. Realistic characters aren’t saints; counterfactual testing can show the good motive was *necessary* even if self-interest tagged along. Tension is mild.  

  Assumption 3 (no moral luck) vs. Assumption 2 is another headache. If two people are identical in counterfactual behavior (3), but one acts spontaneously (2) while the other hesitates, do they deserve the same grade? Fix: Soften 3 to allow "how" of action mattering, not just "would they do it." Costs philosophical purity but helps storytelling.  

  Minor tension between 1 and 5: If motives matter most (1), but we test them via counterfactuals (5), what if the test reveals they *wouldn’t* act without selfish reasons? Then the act isn’t admirable. But that’s consistent—Assumption 1 already says motives define worth.  

  Overall, Assumption 2 is the troublemaker. Fixing it lets the other pieces coexist. The user’s writing gains nuance: characters can be admirable without being impulsive saints, and moral worth becomes about durable traits, not flukes.  

  User’s deeper need? Probably wrestling with how to make characters feel *real* yet morally resonant. They might fear deliberation makes characters cold or hypocrisy makes them unadmirable. The fixes address that: training bridges spontaneity and character; mixed motives keep humans human.
answer: |-
  Here's your moral worth assumption audit, stripped down to tensions, severity, fixes, and costs—tailored for your novelist lens:

  | **Assumption** | **Core Principle** | **Key Tensions** | **Severity** | **Cheapest Fix** | **Cost to You** |
  |----------------|--------------------|------------------|--------------|------------------|-----------------|
  | **1** | Intentions over outcomes | Mild with #5 | ★☆☆ | None needed | — |
  | **2** | Spontaneity as ideal | With #3, #4, #5 | ★★★ | Redefine "admirable" as trained reflex | Romantic rawness of pure spontaneity |
  | **3** | Moral consistency across luck | With #2 | ★★☆ | Allow "how" to matter alongside "would" | Some philosophical neatness |
  | **4** | Mixed motives acceptable | Mild with #2 | ★☆☆ | None needed | — |
  | **5** | Counterfactual motive testing | With #2 | ★★☆ | Clarify it tests motive necessity | Potential over-rationalization |

  **Deep Dive on Tensions & Fixes:**

  ### 1. **Critical Tensions (Severe - ★★★)**
     - **Assumption #2 vs. #3 and #5**  
       - **Conflict:** If moral worth requires unreflective spontaneity (#2), it becomes *highly luck-dependent*—dependent on who happens to feel compassionate *in the moment*. But #3 insists luck shouldn’t affect moral worth. Worse, #5’s counterfactual test (e.g., "Would they still act without their good mood?") would expose this luck, revealing the "admirable" act as circumstantial.  
       - **Cheapest Fix:** **Reframe #2’s "unreflective compassion" as *trained instinct*.**  
         - *Fix:* "The people I most admire act from *immediate compassion that reflects deep character* (e.g., a nurse diving into crisis mode). Deliberation isn’t bad—it’s neutral or even virtuous when instincts *aren’t* reliably good."  
         - *Cost:* Loses the romantic purity of raw spontaneity. Gains psychological realism (virtue as habit).  

  ### 2. **Significant Tensions (Moderate - ★★☆)**  
     - **Assumption #3 vs. #2**  
       - **Conflict:** If two people are identical in all possible actions (#3), but one acts spontaneously (#2) while the other hesitates, #2 demands we admire the spontaneous one more—contradicting #3’s claim they "deserve the same moral grade."  
       - **Cheapest Fix:** **Soft-split #3: Allow *how* an act is performed to matter.**  
         - *Fix:* "Two people who *do* the same thing in all situations deserve the same *outcome*-based praise, but the one who acts joyfully/spontaneously has *more admirable character*."  
         - *Cost:* Weakens philosophical watertightness; prioritizes narrative texture over moral absolutism.  

     - **Assumption #5 vs. #2**  
       - **Conflict:** #5’s counterfactual test ("Would they do it without X?") relies on *hypothetical deliberation*, but #2 distrusts visible deliberation as a "bad sign."  
       - **Cheapest Fix:** **Clarify #5 as a *narrative tool*, not an in-character process.**  
         - *Fix:* "The counterfactual test is for *me as author* to diagnose motive—not for the character to overthink. A character can pass the test *because* their compassion is reflexive."  
         - *Cost:* None. Preserves spontaneity while letting you, the writer, verify its authenticity.  

  ### 3. **Minor/Apparent Tensions (Low - ★☆☆)**  
     - **Assumption #1 vs. #5**  
       - *Apparent Tension:* If worth depends on "why" (#1), and #5 tests "why," don’t they align?  
       - **Resolution:** They’re compatible. #5 is your method to enforce #1. No fix needed.  

     - **Assumption #4 vs. #2**  
       - *Apparent Tension:* #4 embraces messy motives, but #2 idolizes pure spontaneity.  
       - **Resolution:** Spontaneity ≠ purity. A character can jump in the river *both* out of compassion *and* vanity—#4 says this is still admirable. #2 doesn’t require purity, just lack of deliberation. No fix needed.  

     - **Assumption #4 vs. #5**  
       - *Apparent Tension:* If motives are mixed (#4), can counterfactuals (#5) isolate the "true" motive?  
       - **Resolution:** #5 tests whether the *good* motive was *necessary* for the act (e.g., "Without their vanity, would compassion alone have moved them?"). If yes, mixed motives don’t negate worth. No fix needed.  

  ---

  **Why This Works for Your Novel:**  
  - **#2 is your biggest liability**—it clashes with everything. The fix retains "admirable immediacy" but roots it in character, not luck. Think: *"Training so deep it looks like instinct."*  
  - **#3 and #5 become tools**—not constraints. Use #5 to expose characters whose "spontaneity" is performative (#2 fix makes this clear).  
  - **#4 saves you from flat characters**—keep it. Real humans are messy, and admirable acts rarely spring from saintly purity.  

  **Minimal Cost, Maximum Payoff:** You keep the *feel* of spontaneous virtue (#2) without the contradictions, and leverage tension between impulse and consistency for richer character arcs. No ethics lecture—just sharper tools for your moral portraiture.
