  So in AI alignment spaces people keep throwing around 'there's always a level above' — they say you can't code an inviolate ethical base-layer into a system because some meta-rule or self-modification loop will always sit above it and override. They act like this is straight Hofstadter / Escher Drawing Hands logic, but I think they might just be misremembering the vibe.

  Seperate the precise claims hiding in that sentence. Which are platitutes, which are substantive and defensible, and which are flat-out false? Don't just pick one reading and explain it — lay them out like a menu. Then tell me: when someone uses this to argue that an AI can't have hard-coded 'inviolate' values, which reading are they actually invoking, and does that reading actually support the conclusion?

  One more thing — is 'inviolate level' even a real Hofstadter term, or did they make that part up? I don't need a bibliography or citations, just your best sense of whether it maps onto GEB correctly. And please don't put words in Hofstadter's mouth with fake quotes; paraphrase if you mention his view.

