prompt: |-
  You are an expert in comparative philosophy and pedagogical design, equally fluent in analytic metaphysics of personal identity and in Southern African Ubuntu thought. I am preparing a single ninety-minute graduate seminar for first-year philosophy PhD students who have thoroughly internalized Locke's memory criterion and Parfit's reductionist view of persons as bundles of psychological relations, but who have never encountered Ubuntu or relational conceptions of personhood. The concept I need them to grasp is that personhood is not an intrinsic property of an individual substrate but rather a continuously renegotiated relational achievement, sustained through what I will call "relational maintenance practices" — for instance, the way shared labor on communal land is not merely cooperative but is itself constitutive of the participants' moral standing as persons. Before you construct the plan, take a moment to map the conceptual dependency graph: which analytic intuitions must be explicitly suspended before the relational ontology can even be heard, and where in the sequence students are most likely to smuggle in individualist assumptions. Then present your teaching plan — not the explanation itself — as exactly five numbered items, each one or two sentences long, with no introduction or conclusion. Your five items should cover: first, the precise order in which the components must be introduced and why the analytic framework has to be bracketed before any positive claim is made; second, the single carrying example that will anchor the session, specifying what features it must possess and which familiar Western analog — such as a social contract or cooperative enterprise — it must be rigorously distinguished from; third, the three misconceptions these students will predictably generate — specifically, that this view is merely social constructivism about the self, that it collapses into political communitarianism, and that it is interchangeable with feminist care ethics — together with the exact moment in the sequence where each misconception should be headed off; fourth, the one diagnostic question you will pose at the end to determine whether they understand the relational dependency as ontological rather than psychological, political, or ethical; and fifth, what you will explicitly leave out — such as the full metaphysics of ancestral presence and specific ritual protocols — with a brief justification of why omitting these elements protects rather than distorts the core idea for this audience.
reasoning: |-
  Hmm, the user is asking me to design a graduate seminar on Ubuntu philosophy for PhD students who are well-versed in Locke and Parfit's views on personal identity. They want me to focus on the concept that personhood is a relational achievement sustained through practices like communal labor, rather than an intrinsic property.

  The user wants me to map out a conceptual dependency graph first - identifying which analytic intuitions need to be suspended before introducing relational ontology. Students will likely struggle with deeply ingrained ideas like the primacy of psychological continuity (from Parfit) and the Cartesian notion of the self as a discrete substance. They'll need to bracket these before they can grasp the relational view.

  For the teaching plan, I need exactly five numbered items covering specific elements: 1) the sequencing of concepts and why bracketing analytic frameworks must come first; 2) a single anchoring example distinguishing Ubuntu from Western analogs; 3) three predictable misconceptions and when to address them; 4) a diagnostic question testing ontological understanding; and 5) what to omit with justification.

  For sequencing, I'll start by explicitly bracketing the analytic frameworks. Then I'll introduce the Ubuntu view through a concrete example. I need to choose a potent example - perhaps communal land cultivation, like "ilima" in Southern Africa. This must be distinguished from Western ideas like social contracts or cooperation for mutual benefit, emphasizing how the practice itself constitutes personhood rather than serves instrumental purposes.

  The predictable misconceptions I should address are: confusing relational ontology with social constructivism (which still assumes an individual core), conflating it with political communitarianism (which prioritizes the group over relations), and equating it with care ethics (which focuses on ethics rather than ontology). I'll head these off at specific points in the session.

  For the diagnostic question, I need something that tests whether students grasp the ontological dependency - perhaps asking how personhood would be affected if relational maintenance practices ceased, even without psychological or social changes.

  Finally, I'll omit elements like ancestral metaphysics and ritual protocols. While important in Ubuntu, these could distract first-time learners by making the concept seem exotic rather than philosophically rigorous about relational ontology.

  The plan should be concise - just five numbered items without introduction or conclusion. I'll make sure each item is one or two sentences as requested, focusing on precision and pedagogical effectiveness.
answer: |-
  1. Begin by explicitly bracketing Locke's psychological continuity and Parfit's reductionism through guided thought experiments demonstrating their inadequacy in contexts where personhood is relationally contingent (e.g., "If all memories/relations were duplicated, would *both* entities be fully persons in an Ubuntu framework?"), creating epistemic space *before* introducing any positive Ubuntu claims to prevent immediate assimilation into familiar individualist categories.  
  2. Anchor the session with the example of *ilima* (communal agricultural work): it must illustrate reciprocal labor where participants' moral standing *emerges from and is sustained by* the act of co-cultivation itself—rigorously distinguishing this from Western "cooperative enterprises" (focused on individual gain/output) and "social contracts" (pre-existing agents forming agreements) by emphasizing that *ilima* ontologically *constitutes* the participants as persons, not merely enabling their collaboration.  
  3. Preempt misconceptions at these points: (a) during the *ilima* analysis, clarify that this is not social constructivism (which modifies a pre-existing self) but *ontological emergence*—no underlying "core self" exists prior to relations; (b) when discussing community, stress that Ubuntu's relationality is not political communitarianism (group identity overriding individuals) but mutual constitution where *both* individual and community co-emerge; (c) after establishing ontology, differentiate from feminist care ethics by noting Ubuntu's metaphysical grounding of personhood itself in practice, not just ethical obligations derived from relations.  
  4. Pose this diagnostic question: "If an individual ceased all relational maintenance practices yet retained psychological continuity and social recognition, would they retain full personhood in Ubuntu ontology?"—correct understanding requires recognizing the *ontological erosion* of personhood despite psychological/political continuity.  
  5. Deliberately omit detailed metaphysics of ancestral presence and specific ritual protocols (e.g., *ukubuyisa* ceremonies); while integral to Ubuntu's full expression, their inclusion risks exoticizing the philosophy or obscuring the core ontological claim of relational constitution for this audience, who must first grasp the foundational metaphysics before engaging culturally specific instantiations.
