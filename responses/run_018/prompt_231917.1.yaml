  On to Fodor... The asymmetric dependence definition is crisp. But then the student claims Fodor relies on "species' selection history." Alarm bells! Fodor explicitly rejects teleology and insists his theory is synchronic. While he acknowledges historical *examples*, the dependence relation is logical/nomological, not evolutionary. This mistake parallels the Millikan error but in reverse - importing history where it shouldn't be. 

