  First, I need to identify the five objections they'll face, in order. The user specified the exact audience members, so each objection should come from a specific perspective. 

  Starting with the narrativists: They believe history is literature without an external check. Their objection would challenge the idea that archives can disrupt narratives, pointing out that historians choose which archives to use. The reply should emphasize the involuntary nature of archival resistance, but the soft spot is that the historian still decides what counts as resistance.

