prompt: |-
  i'm in a philosophy of history class and next tuesday i'm presenting a short paper to a joint seminar with the history dept, and i want a q&a prep sheet, not a full paper. my thesis: i grant Carr's point that the historian selects facts, and White's point that every history gets plotted like a story genre, but i defend a weak Rankeanism — not the fantasy of showing the past as it actually was from nowhere, but fidelity to the moments when the archive won't fit your plot and forces a rewrite of the story you wanted to tell. the audience: two narrativists who think White already showed history is basically literature with no real outside check, one old-school archivalist who thinks theory class made everyone paranoid and Ranke just meant check your sources, a Carr-fan lecturer who says a historian can only ever find the facts their framework lets them see, and several agnostic MA students. give me the five objections i'll actually get, in the order they'll come, phrased the way those people would phrase them, each with my one-or-two-sentence reply and the softest spot in that reply. do it as a numbered list of exactly five items, each a sentence or two, no intro and no conclusion — and make the fifth item the one i'm hoping nobody asks.
