prompt: |-
  I keep seeing arguments about those quick visual illusions where a dot jumps position and changes color, and people swear they saw it move smoothly through the middle shade. The debate always splits the same way: one camp says your brain went back and actually changed what you were experiencing a split second earlier, so the first raw impression gets overwritten. The other camp says the first impression is still there untouched, but your brain just writes a false report about it afterwards, like falsifying a log entry rather then altering the event itself. I don't care about the illusion mechanics — I'm asking if there's an established philosophical name for this specific split, about whether revision targets the experience itself or only our record of it. Does it have a proper term, and if not, how would you draw the boundary? I also wonder if predictive processing models, where the brain updates its best guess about the immediate past, fall on one side or blur the line. And I feel like I've seen this come up with memory too but can't tell if its the same concept.
