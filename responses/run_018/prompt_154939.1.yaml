answer: |-
  ## Counting Ruins

  I tally base rates, cold and clear and vast,  
  From fallen realms: their decades, wars, decay.  
  The outside view predicts how long they'll last –  
  A number gleaned to chart the present's way.  
  Forget the unique crisis, king, or creed,  
  Ignore the inner chaos, strife, or sound;  
  The aggregate reveals the vital seed  
  Of when the final fracture hits the ground.

  But wait – what crumbling giants fill this frame?  
  Is Rome the mold? That island's fractured crown?  
  Or just that glitched database I couldn't maim,  
  That zombie server no one would shut down?  
  Three ghosts? Three thousand? Which true pattern fits?  
  The data drowns... and silence is the gift.

  ---

  **Notes on your specs:**
  *   **Octave (Confidence):** Lines 1-8 build the "naive confidence" in base rates and the outside view, dismissing the inside view ("unique crisis, king, or creed").
  *   **Volta (Line 9 - "But wait"):** The turn precisely at line 9 challenges the reference class ("what crumbling giants fill this frame?").
  *   **Sestet (Ambiguity):** Lines 9-12 present the arbitrary examples (Rome, Britain, the 2014 monolith/glitched database) showing the core problem.
  *   **Couplet (Unresolved Tension):** Lines 13-14 highlight the ambiguity ("Three ghosts? Three thousand?") and end with the unsettling silence of the unanswered question.
  *   **Accuracy:** Core concepts (outside view, inside view, base rates, reference class ambiguity) are woven in without exposition.
  *   **No Sermon:** It presents the dilemma, not a lesson.
  *   **Spelling:** "Prediction" is correctly spelled! Your 2014 monolith lives on as the "glitched database" / "zombie server".
