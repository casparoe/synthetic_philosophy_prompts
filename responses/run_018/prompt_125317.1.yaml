prompt: |-
  Hey I'm putting together prompts for a dataset on moral revolutions — like, do norms like slavery or dueling end because people finally argue them into the ground, or because material intersts shift, or because honour/shame dynamics flip (the Appiah / Williams kind of story)? I need a thought experiment built to spec, not a generic history lesson. Design a realistic workplace scenario, max one paragraph, where a harmful long-standing practice suddenly collapses. The catch: moral arguments against it have been availible and well-known for years but never moved anyone. The material intersts of every party — workers, management, clients — stay exactly the same before and after; no regulator steps in and no one makes more money by quitting. The collapse has to be driven by an honour/shame mechanism: some status marker flips so that continuing the practice becomes a sign of being backward or lacking dignity, and people rush to distance themselves. Then, in a second paragraph, walk through what an argument-based, interest-based, and honour-based theory each says about why the practice ended, and show why only the honour story actually predicts the timing and shape of the collapse. You also need to name the exact feature doing the work — the specifc status signal — and say what happens if you remove it, i.e. whether the case collapses back into one where arguments or interests could plausibly explain it. Finish with one line on how a defender of the argument view would try to dismiss your scenario. Keep the whole response under 300 words, one paragraph for the case and one for the analysis. Don't use quotation marks for real texts, and avoid citing books or page numbers since I want the model to reason from the ideas themselves, not guess at bibliographies. Thanks!
reasoning: |-
  Okay, the user wants a thought experiment about moral revolutions in a workplace setting. They're specifically interested in how honor/shame dynamics can collapse a practice, even when arguments and material interests don't change. 

  Hmm, they're clearly familiar with Appiah/Williams theories - this feels like academic work, maybe philosophy or sociology? The strict parameters suggest they're testing a hypothesis. 

  First challenge: designing a scenario where arguments existed but failed, interests stay static, and honor flips abruptly. The tech industry comes to mind - it has rapid status shifts. "Brutal honesty" cultures could work; they often persist despite criticism. 

  Key is finding that precise status marker... maybe executive adoption of vulnerability language? That's observable and can flip perceptions overnight. 

  For the analysis: 
  - Argument view would emphasize accumulated reasoning, but here change is sudden. 
  - Interest view fails completely - no one gains financially. 
  - Honor view explains the cascade: leaders fear seeming outdated. 

  The critical test is removing the status marker. If execs didn't adopt the language, the practice would likely continue despite arguments/interests - proving honor is the driver. 

  Anticipating pushback: an argument defender might claim the execs were "finally convinced" - but the timing disproves that. The speed matches a status panic, not gradual persuasion. 

  Word count is tight. Need to keep the workplace example punchy and the analysis razor-focused on why only honor fits all parameters. The vulnerability language detail must carry weight - it's the linchpin.
answer: |-
  **Scenario:** At Veridian Dynamics, quarterly "accountability sessions" required junior staff to stand while executives publicly dissected their mistakes—a tradition defended as "building resilience." For years, ethical objections about humiliation were dismissed as oversensitivity. Materially, nothing changed: sessions consumed minimal time, executives felt powerful, juniors feared resisting, and clients were unaffected. The collapse began when a viral documentary featured a rival CEO condemning such practices as "leadership bankruptcy," showcasing their own vulnerable roundtables. Within weeks, Veridian executives—terrified of appearing incompetent and outdated—rebranded sessions as confidential "growth dialogues." Staff compliance evaporated instantly; continuing now signaled weakness, not strength.

  **Analysis:**  
  - **Argument-based theory** predicts gradual change as reasoning wins converts, but here decades of arguments failed until the sudden shift.  
  - **Interest-based theory** expects stakeholders to act when costs/benefits shift, yet all parties’ incentives remained static.  
  - **Honour-based theory** fits: the rival CEO’s condemnation flipped the status signal—*vulnerability became the new marker of elite competence*. Executives abandoned the practice to avoid shame, not due to new arguments or profits.  
  **Critical feature:** Removal of the *rival CEO’s public shaming* would prevent collapse; without this status reversal, arguments and interests alone couldn’t explain the timing/speed.  
  *Argument-view dismissal:* "The documentary finally made executives *understand* the ethical case." (Ignores the immediate status panic, not moral conversion).  

