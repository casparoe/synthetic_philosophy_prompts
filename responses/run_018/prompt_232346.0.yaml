prompt: |-
  i'm a new TA for an epistemology class and next week i have to teach the bootstrapping problem and easy knowledge to undergrads who have just done reliabilism and closure. i dont need the problem explained to me — i need the lesson plan. what has to be on the board before the puzzle even bites, and in what order? which one example should carry the whole thing, the gas gauge or color vision, and what must it have and not have? what are the predictable misconceptions — like 'this is just circular reasoning,' 'you'd have to actually go check the lighting,' or 'this is just skepticism again' — and where in the sequence do i head each one off? whats the end-of-class check that they actually got it rather than nodded along, and what should i explicitly say we're leaving out? Give me exactly five numbered points, each a sentence or two, no introduction or conclusion.
reasoning: |-
  Okay, the user is a new TA preparing to teach the bootstrapping problem and easy knowledge in an undergraduate epistemology class. The students have just covered reliabilism and closure. The user doesn't need the concepts explained—they need a practical lesson plan. Let me break down their requirements.

  First, they want what must be on the board before introducing the puzzle. Key elements are the core principles: Reliabilism (justification from reliable processes) and Closure (transfer of knowledge across known entailment). These are prerequisites, so listing them upfront anchors the discussion.

  Next, choosing the right example. The gas gauge is better than color vision because it's mechanical, avoiding extra variables like lighting conditions. The gauge's reliability can be assumed without environmental factors, making the bootstrapping issue clearer. Must emphasize that the example depends on the gauge alone, no external checks.

  Predictable misconceptions need addressing. Students might confuse bootstrapping with circular reasoning. Clarifying that circularity involves premise-conclusion dependency, while bootstrapping misapplies principles, is crucial. Also, the instinct to "check the lighting" or see it as skepticism must be preempted. Point out that the problem is internal to reliabilism, not skepticism.

  For the end-of-class check, a new scenario like a thermometer tests if they can identify the bootstrapping mistake. Students should explain why multiple readings don't establish reliability without independent verification. This shows comprehension beyond nodding.

  Lastly, stating exclusions: bootstrapping as a technical term and meta-justification debates. Keeping focused on the problem's structure avoids unnecessary complexity. The user needs a clear, step-by-step plan that builds logically, addresses pitfalls, and confirms understanding. Ensuring each numbered point directly tackles these aspects without fluff is essential.
answer: |-
  Here are five numbered points for your lesson plan:

  1. **Pre-board core principles:** Write "Reliabilism: Justified if from reliable process" and "Closure: If S knows P and knows P entails Q, S can know Q" – these are the assumed foundations the puzzle exploits, so establish them first.

  2. **Use the gas gauge example exclusively:** Present a scenario where a driver forms the belief "The tank is full" (B1) based *only* on looking at a gas gauge they have *no prior reason* to trust, then infers "The gauge is reliable" (B2) *because* it read "F" when the tank was full (B1). Its virtue is isolating the core issue: inferring reliability *solely* from the gauge's own readings, with no independent check.

  3. **Preempt misconceptions immediately after presenting the inference:**  
     *   **"Circular?":** Distinguish: "It's not *logically* circular (B2 isn't a premise for B1), but it's *epistemically defective* bootstrapping – using the gauge's output to *create* justification for trusting itself *from scratch*."  
     *   **"Go check!":** Emphasize: "The puzzle *assumes* you have *no independent way* to check the tank or lighting. The point is whether the gauge *alone* can provide that justification."  
     *   **"Skepticism?":** Clarify: "This isn't denying we *can* know the gauge is reliable; it's showing a *specific way* (using only its own readings) that *seems* to satisfy Reliabilism+Closure but is clearly illegitimate."

  4. **End-of-class comprehension check:** Present a novel scenario (e.g., "You have a new thermometer; you believe 'It's 70°F' (T1) based only on its first reading, then infer 'The thermometer is reliable' (T2) because it says 70°F now (T1)"). Ask: "Can you gain justification for T2 this way? Why/why not?" They must articulate that using the instrument *alone* to confirm its reliability without independent verification is the illegitimate bootstrapping move.

  5. **Explicitly exclude:** State: "We're focusing *only* on why this *specific inference pattern* seems permitted by Reliabilism+Closure but is problematic ('easy knowledge'). We are *not* covering solutions (like requiring prior inductive justification) or the term 'bootstrapping' beyond this case."
