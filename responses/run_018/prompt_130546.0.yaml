  - Unlike cognitive dissonance, it’s not just reducing discomfort but actively re-narrating the self. 
  - And crucially, it denies the "loss" aspect central to hard choices—it morphs the decision from a sacrifice into a self-preservation move. 

  This feels like a gap in the literature. The closest fit might be a blend of "diachronic self-constitution" (identity formation over time) and "existential reframing," but it needs a fresh term. "Practical Identity Retrospection" (PIR) could work—emphasizing the backward-looking, identity-shaping function. 

