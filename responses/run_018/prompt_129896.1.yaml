prompt: |-
  I direct a grant program that funds joint empirical research between groups that are publicly and sharply opposed on high-stakes policy questions—for example, collaborations between climate economists who favor carbon pricing and community organizers who oppose those instruments on equity and procedural grounds, or partnerships between AI safety researchers advocating pre-deployment evaluation mandates and open-source advocates who treat such mandates as regulatory capture by incumbents. Before committing funds, my board needs a reusable decision procedure to determine whether both sides are arguing in good faith in a sense strong enough to make collaboration intellectually productive rather than merely performative. The procedure should be grounded in the philosophical distinction between doxastic openness—genuine willingness to revise one’s beliefs in light of evidence—and dialectical openness—willingness to represent the opposing view in terms that its own proponents would recognize as accurate—while also accounting for the structural problem that echo chambers and institutional filtering can produce sincere participants who nevertheless systematically misrepresent counterevidence and opposing arguments. Please construct a step-by-step checklist that my reviewers, who are not philosophers, can run in approximately thirty minutes per proposal; specify the ordered questions, what counts as a sufficient answer at each stage, the explicit stopping points where the procedure returns “do not fund,” and the points where judgment cannot be eliminated and must be referred to a senior board member for a values-based sign-off. The procedure must handle the hard case in which one side is individually sincere but embedded in an institutional environment that filters out disconfirming information—what might be called structural bad faith—and must include two worked applications: first, to a proposed collaboration between carbon-tax proponents and their equity-focused critics, and second, to a proposed partnership between AI alignment researchers and open-source advocates. Include at least one case where the procedure yields an answer the board will find unwelcome, and conclude by stating explicitly what the procedure cannot determine, such as whether good faith guarantees productive outcomes or whether hidden strategic motives are present.
reasoning: |-
  We are constructing a decision procedure for assessing good faith in collaborative research proposals between opposed groups. The procedure focuses on two dimensions: doxastic openness (willingness to revise beliefs) and dialectical openness (accurate representation of opposing views). It must also handle "structural bad faith" where institutional filters lead to misrepresentation despite individual sincerity.

  The procedure is a step-by-step checklist for non-philosopher reviewers, to be completed in about 30 minutes per proposal. It includes explicit stopping points for rejection and points for referral to senior board members.

  Key components:
  1. **Doxastic Openness**: Evidence that each party is willing to change their mind based on evidence.
  2. **Dialectical Openness**: Each party can state the opponent's position in a way the opponent would accept as accurate.
  3. **Structural Bad Faith Check**: Even if individuals seem open, we must check if their institutional context systematically filters out disconfirming evidence.

  The procedure will have a series of questions. At each stage, if the answer is insufficient, we stop and return "do not fund". If at any point the reviewer is unsure, they refer to a senior board member.

  ---

  **Step-by-Step Checklist**

  **Step 0: Pre-Screening**
  - Check that the proposal clearly identifies two (or more) groups that are publicly and sharply opposed on a high-stakes policy question. The proposal must describe the specific policy disagreement and the empirical research they plan to do together.
  - *Stopping Point*: If the opposition is not clearly established or the research is not empirical and joint, reject.

  **Step 1: Doxastic Openness Assessment**
     - **Question 1.1**: For each group, does the proposal include a clear statement (from each group) that they are willing to revise their policy position if the empirical evidence from the collaboration points against it? Look for explicit commitments in the proposal text or attached letters of commitment.
        - *Sufficient Answer*: Explicit, unambiguous statements from each group that they are open to changing their minds based on the research findings. For example: "We agree that if the study shows X, we will reconsider our stance on Y."
        - *Insufficient*: Vague language (e.g., "we are open to new ideas") without a clear link to revising the specific policy position in light of the study.
        - *Stopping Point*: If any group lacks such a statement, reject.

     - **Question 1.2**: Is there evidence from past behavior (e.g., in the proposal or from public records) that each group has revised a significant belief in response to evidence?
        - *Sufficient Answer*: Specific examples (at least one per group) of past belief revision in a related context. This could be a citation to a public statement, a published retraction, or a description of a change in policy stance with a clear link to evidence.
        - *Insufficient*: No examples or only trivial changes. If the group has no history (e.g., newly formed), then this step is skipped for them, but the other group must meet it.
        - *Note*: If both groups are new, skip to Step 2. If one group is established and fails this, it's a stopping point. If the group is established and fails but the other passes, refer to a senior board member (because the established group might be dogmatic).

  **Step 2: Dialectical Openness Assessment**
     - **Question 2.1**: Does the proposal include, for each group, a summary of the opposing group's position written by that group (i.e., Group A writes Group B's position, and Group B writes Group A's position) in their own words? If not, the reviewers must request this from the applicants (as a quick supplemental document) and pause the review until received.
        - *Sufficient Answer*: Each group's summary of the opponent's position must be present and must be in their own words (not copied from the opponent).

     - **Question 2.2**: Are these summaries approved by the opponent as accurate? (This requires that the opponent has reviewed the summary and agreed that it fairly represents their view.)
        - *Sufficient Answer*: Each group has explicitly endorsed the summary of their position written by the other group (e.g., via a co-signed statement or email exchange included in the proposal).
        - *Stopping Point*: If either group does not approve the summary of their position, reject. (Note: If the summaries are not included in the initial proposal, we allow a quick turnaround for this step. If they fail to provide it within a set time, reject.)

     - **Question 2.3**: Do the summaries avoid straw-manning? (Reviewers must check that the summaries do not misrepresent the opponent's view by oversimplifying, omitting key points, or attributing extreme positions not held by the opponent.)
        - *Sufficient Answer*: The summaries are nuanced, mention the core arguments of the opponent, and avoid obvious misrepresentations. Reviewers can compare the summary to the opponent's own description (if available in the proposal) or to public statements.
        - *Stopping Point*: If any summary is a clear straw man (as judged by the reviewer), reject.

  **Step 3: Structural Bad Faith Check**
     This step addresses the risk that a group is embedded in an institution that systematically filters out disconfirming evidence, even if the individual participants seem open.

     - **Question 3.1**: For each group, does the proposal describe how the participants will share the research process and findings with their broader community or institution? Look for a plan to disseminate results internally and engage their own community.
        - *Sufficient Answer*: A concrete plan (e.g., workshops, internal reports, presentations) to share the research with their own constituency. The plan should include mechanisms for feedback from their community.

     - **Question 3.2**: Is there evidence that the institution(s) of each group have a history of updating their positions based on empirical evidence? (Reviewers may need to do a quick web search or rely on public knowledge.)
        - *Sufficient Answer*: At least one example (per group's institution) of the institution changing a policy or public stance in response to evidence. This could be from news reports, the institution's publications, or the proposal itself.
        - *Insufficient*: No examples, or a history of ignoring evidence that contradicts core tenets.
        - *Referral*: If one group's institution has no such history (or a negative history) but the individual participants are strong on doxastic and dialectical openness, refer to a senior board member. The board must decide if the individual participants can act as change agents or if the structural constraints are too great.

     - **Question 3.3**: Does the proposal include a plan to mitigate institutional filtering? (e.g., by including members of the broader community in the research process, or by having a neutral third party validate the research design and results dissemination.)
        - *Sufficient Answer*: A specific mitigation plan is outlined. If the institution has a poor track record (from 3.2), this plan must be robust.

  **Step 4: Joint Research Design**
     - **Question 4.1**: Is the research design explicitly co-created and agreed upon by both groups? Look for evidence of joint development (e.g., a shared methodology section with input from both).
        - *Sufficient Answer*: The proposal details how both groups were involved in designing the study, including the research questions, methods, and analysis plan.

     - **Question 4.2**: Does the research design include pre-registration (or a similar mechanism) to lock in the analysis plan and prevent post-hoc reinterpretation?
        - *Sufficient Answer*: The proposal states that the study will be pre-registered (e.g., on a platform like OSF) before data collection.

     - **Question 4.3**: Does the research design include metrics for success that are agreed upon by both groups? (e.g., what would count as evidence for or against each group's position?)
        - *Sufficient Answer*: Clear, quantifiable metrics that both groups accept as valid tests of their claims.

     - *Stopping Point*: If any of these 4.1-4.3 are missing, reject.

  **Step 5: Conflict Resolution Protocol**
     - **Question 5.1**: Does the proposal include a conflict resolution plan for disagreements during the collaboration? (e.g., a mediator, a clear escalation path, or a commitment to third-party arbitration.)
        - *Sufficient Answer*: A specific plan is outlined.

     - *Referral*: If missing, refer to a senior board member (since this might be fixable with conditions on the grant).

  **Final Step: Overall Assessment**
     - If the proposal passes all steps without rejection and without referral, it is recommended for funding.
     - If referred at any step, the senior board member must make a judgment call. The board member may:
          - Approve with conditions (e.g., requiring a conflict resolution plan)
          - Reject if the risk is too high

  ---

  **Worked Applications**

  **Case 1: Carbon Tax Proponents vs. Equity-Focused Critics**

  - *Step 0*: The proposal is about a joint study on the local economic impacts of carbon pricing in a specific region. Opposition is clear: one group advocates for carbon taxes as efficient, the other opposes them on equity grounds. Research is empirical (e.g., survey and economic data analysis). Pass.

  - *Step 1.1*: Both groups include statements: "If the study shows that low-income households are disproportionately harmed, we will reconsider our support for the current carbon tax design" (proponent) and "If the study shows that revenue recycling effectively offsets burdens on low-income households, we will reconsider our opposition" (critic). Sufficient.

  - *Step 1.2*: Proponents point to their past shift from cap-and-trade to carbon tax due to evidence on price volatility. Critics point to their endorsement of a state-level carbon tax after equity safeguards were added. Sufficient.

  - *Step 2.1*: Each group provides a summary of the other's position. Proponents write: "Critics argue that carbon pricing without revenue recycling exacerbates inequality and that procedural justice requires direct community input in policy design." Critics write: "Proponents argue that carbon pricing is the most cost-effective way to reduce emissions and that market mechanisms spur innovation." 

  - *Step 2.2*: Both groups approve the summaries. Pass.

  - *Step 2.3*: Summaries avoid straw men. Pass.

  - *Step 3.1*: Proponents plan to present findings to their academic and policy networks. Critics plan community workshops. Sufficient.

  - *Step 3.2*: The proponents' institution (a think tank) has updated positions based on evidence (e.g., shifted on border adjustments). The critics' organization has also updated (e.g., initially opposed all carbon pricing, now conditionally supports with equity provisions). Sufficient.

  - *Step 3.3*: They plan to have a joint advisory board including community representatives. Sufficient.

  - *Step 4*: Joint design, pre-registration, and agreed metrics (e.g., change in household energy expenditure by income decile). Pass.

  - *Step 5*: Conflict resolution via a named mediator. Pass.

  - *Outcome*: Fund.

  **Case 2: AI Alignment Researchers vs. Open-Source Advocates**

  - *Step 0*: Proposal for a joint study on the safety and misuse risks of open-source AI models. Opposition: one group favors pre-deployment evaluation mandates, the other opposes as regulatory capture. Research is empirical (e.g., red-teaming open models and analyzing vulnerability). Pass.

  - *Step 1.1*: Alignment researchers: "If the study shows that open-source models do not increase misuse risk, we will reconsider the need for mandates." Open-source advocates: "If the study shows significant misuse risks from open models, we will reconsider our opposition to some forms of evaluation." Sufficient.

  - *Step 1.2*: Alignment researchers have a history of updating (e.g., shifted from focusing solely on long-term risks to near-term misuse). Open-source advocates have updated too (e.g., adopted stricter release protocols after evidence of misuse). Sufficient.

  - *Step 2.1*: Alignment researchers write: "Open-source advocates believe that open access promotes innovation, prevents concentration of power, and that safety risks are manageable with community efforts." Open-source advocates write: "Alignment researchers argue that powerful AI systems pose catastrophic risks if not controlled and that centralized evaluation is necessary to prevent misuse or accidents."

  - *Step 2.2*: Both approve. Pass.

  - *Step 2.3*: Summaries are accurate. Pass.

  - *Step 3.1*: Both groups plan internal briefings and conference presentations. Sufficient.

  - *Step 3.2*: **Problem**: The alignment researchers are part of an organization that has never publicly changed its stance on the need for regulation, despite counter-evidence (e.g., studies showing benefits of openness). The open-source advocates' institution has a history of updating (as above).

  - *Step 3.3*: The proposal includes a third-party audit of the research by a neutral tech policy group. Sufficient.

  - *Referral*: Step 3.2 is insufficient for alignment researchers' institution. Refer to senior board member.

  - *Senior Board Decision*: The board member notes that the individual researchers have shown openness and that the third-party audit mitigates structural issues. Approve with condition: the alignment researchers must commit to presenting findings to their institution's leadership and include a letter from the leadership acknowledging receipt and consideration.

  - *Outcome*: Conditionally funded.

  **Unwelcome Outcome Example**

  Consider a proposal between a pharmaceutical company and patient advocates on drug pricing.

  - *Step 1.1*: Both groups provide statements of openness.
  - *Step 1.2*: Patient advocates have updated positions (e.g., supported a pricing model after evidence of improved access). The pharmaceutical company has no history of changing pricing policies based on evidence (only when forced by regulation).
  - *Stopping Point at Step 1.2*: The pharmaceutical company fails the past behavior check. The board must reject despite the individual researchers' statements. This is unwelcome because the collaboration might have been beneficial, but the procedure flags the company's institutional rigidity.

  ---

  **What the Procedure Cannot Determine**

  1. **Productive Outcomes**: Good faith does not guarantee productive collaboration. Unforeseen obstacles, interpersonal issues, or methodological problems may arise.
  2. **Hidden Motives**: The procedure cannot detect hidden strategic motives (e.g., one group participating to co-opt the other or for PR).
  3. **Truth of Claims**: It does not assess the validity of the groups' claims or the research design's scientific merit (that is for peer review).
  4. **Power Imbalances**: It does not address whether one group dominates the collaboration, though joint research design (Step 4) mitigates this.
  5. **Long-Term Impact**: It does not predict whether the collaboration will lead to policy changes or reduced polarization.

  By following this procedure, the board increases the likelihood of funding collaborations that are intellectually productive, but it cannot eliminate all risks.
answer: |-
  Below is a step-by-step decision procedure for assessing good faith in collaborative grant proposals, designed to be executed by non-philosopher reviewers in ~30 minutes. The procedure evaluates **doxastic openness** (willingness to revise beliefs) and **dialectical openness** (accurate representation of opposing views), while flagging **structural bad faith** (institutional filters causing misrepresentation despite individual sincerity). It includes explicit stopping points (rejection) and referral points for senior board judgment. Two worked applications (carbon tax/AI cases) and an "unwelcome outcome" example are included, followed by limitations.

  ---

  ### **Step-by-Step Decision Procedure**
  *Total steps: 6 | Time allocation: 5 min/step*

  #### **Step 1: Verify Opposition & Collaboration Design**  
  **Question 1.1:** Does the proposal explicitly name the high-stakes policy disagreement and describe an *empirical* research project requiring equal input from both sides?  
  **Question 1.2:** Is there a clear mechanism for joint data collection/analysis (e.g., shared methodology, co-authorship)?  
  - **Sufficient answer:**  
    - 1.1: Specific policy conflict stated (e.g., "carbon pricing vs. equity concerns"), and research is data-driven (e.g., joint survey on policy impacts).  
    - 1.2: Roles for both sides in design/execution (e.g., "Team A handles economic modeling; Team B oversees community engagement").  
  - **Stopping point:** If either answer is **no**, return **"Do not fund"** (collaboration is performative).

  #### **Step 2: Assess Doxastic Openness (Belief Revision)**  
  **Question 2.1:** Does each group provide a *written statement* (e.g., in the proposal or annex) committing to update their policy stance if the evidence contradicts their position?  
  **Question 2.2:** Is there *concrete evidence* (e.g., citations, past projects) that each group has revised core beliefs based on data in the last 5 years?  
  - **Sufficient answer:**  
    - 2.1: Explicit pledges (e.g., "If data show carbon pricing harms low-income households, we will advocate for redesign"). Vague statements (e.g., "We value evidence") are insufficient.  
    - 2.2: Examples of past belief updates (e.g., "Group X withdrew support for Policy Y after study Z").  
  - **Stopping point:** If 2.1 is **no**, return **"Do not fund"** (no commitment to change).  
  - **Referral:** If 2.2 is **no** for one group, escalate to senior board. *Reason:* Individual sincerity vs. institutional rigidity may require values-based judgment.

  #### **Step 3: Assess Dialectical Openness (Opposition Representation)**  
  **Question 3.1:** Does each group summarize the opposing view *in their own words* (e.g., in the proposal)?  
  **Question 3.2:** Has the opposing group *endorsed* this summary as accurate (e.g., via co-signed document)?  
  - **Sufficient answer:**  
    - 3.1: Summary uses the opponent’s terminology (e.g., carbon tax critics frame equity as "procedural justice," not "obstructionism").  
    - 3.2: Written confirmation (e.g., "We agree this describes our position").  
  - **Stopping point:** If either answer is **no**, return **"Do not fund"** (straw-manning likely).

  #### **Step 4: Check for Structural Bad Faith**  
  **Question 4.1:** Does each group name their institutional affiliations and describe how their organization processes counterevidence (e.g., internal review, community feedback)?  
  **Question 4.2:** Is there a plan to *bypass institutional filters* (e.g., third-party validators, anonymized data sharing)?  
  - **Sufficient answer:**  
    - 4.1: Acknowledgment of institutional constraints (e.g., "Our think tank dismisses equity critiques; here’s how we’ll mitigate this").  
    - 4.2: Concrete steps (e.g., "An NGO will audit data analysis").  
  - **Referral:** If either answer is **no**, escalate to senior board. *Reason:* Structural bad faith risk requires weighing individual sincerity against institutional capture.

  #### **Step 5: Conflict-Safety Mechanisms**  
  **Question 5.1:** Is there a predefined protocol for resolving disagreements (e.g., mediator, blinded analysis)?  
  **Question 5.2:** Are success/failure metrics for the collaboration agreed upon by both sides?  
  - **Sufficient answer:**  
    - 5.1: Neutral process described (e.g., "Disputes go to a jointly selected arbitrator").  
    - 5.2: Shared benchmarks (e.g., "Both accept a 10% cost increase as evidence against carbon pricing").  
  - **Stopping point:** If 5.2 is **no**, return **"Do not fund"** (no shared epistemic standards).

  #### **Step 6: Final Review**  
  **Question 6.1:** Did the proposal pass all prior steps without unresolved referrals?  
  - **Sufficient answer:** "Yes" with no open issues.  
  - **Referral:** If any step was escalated, senior board must rule.  
  - **Outcome:**  
    - Pass: Fund.  
    - Fail: Do not fund.

  ---

  ### **Worked Applications**
  #### **Case 1: Carbon Tax Proponents vs. Equity Critics**  
  - **Step 1:** Pass. Research: Joint study on household energy costs in low-income communities.  
  - **Step 2:**  
    - 2.1: Proponents state: "We will abandon revenue-neutral design if data show inequity." Critics state: "We will accept pricing if data show no adverse equity impact." → **Sufficient.**  
    - 2.2: Critics cite past support for state-level carbon tax after equity amendments. Proponents cite dropped support for cap-and-trade after cost data. → **Sufficient.**  
  - **Step 3:**  
    - 3.1: Proponents summarize: "Critics argue pricing ignores historical pollution burdens." Critics summarize: "Proponents argue pricing is efficient and funds reinvestment." → **Sufficient.**  
    - 3.2: Mutual endorsement via signed addendum. → **Sufficient.**  
  - **Step 4:**  
    - 4.1: Critics disclose their coalition’s "no compromise" faction; plan community workshops. → **Sufficient.**  
    - 4.2: Equity NGO to co-validate data. → **Sufficient.**  
  - **Step 5:** Mediator named; both accept poverty-rate thresholds as evidence. → **Sufficient.**  
  - **Step 6:** Pass → **Fund.**

  #### **Case 2: AI Safety Researchers vs. Open-Source Advocates**  
  - **Step 1:** Pass. Research: Red-team testing of open-source model vulnerabilities.  
  - **Step 2:**  
    - 2.1: Safety researchers: "We’ll oppose mandates if open models show low misuse risk." Open advocates: "We’ll accept safeguards if data show high risk." → **Sufficient.**  
    - 2.2: Open advocates cite updated licensing after prior misuse. Safety researchers cite no examples of policy updates. → **Referral to board.**  
  - **Step 3:**  
    - 3.1: Safety researchers summarize: "Open advocates fear monopolization stifles innovation." Open advocates summarize: "Safety researchers fear unregulated models cause harm." → **Sufficient.**  
    - 3.2: Mutual endorsement. → **Sufficient.**  
  - **Step 4:**  
    - 4.1: Safety researchers admit their lab suppresses "benefits of openness" reports. → **Sufficient** (disclosed).  
    - 4.2: Plan for independent statistician. → **Sufficient.**  
  - **Step 5:** Blinded analysis protocol; both accept vulnerability thresholds. → **Sufficient.**  
  - **Step 6:** Board approves despite Step 2.2 referral (notes individual sincerity + mitigation plan). → **Fund with oversight.**

  ---

  ### **Unwelcome Outcome Example**  
  **Proposal:** Tech union (advocating AI job displacement safeguards) vs. automation startup (opposing regulation).  
  - **Step 1:** Pass (joint study on automation’s wage effects).  
  - **Step 2:**  
    - 2.1: Both provide strong revision statements.  
    - 2.2: Startup cites no belief updates; dismisses counter-evidence as "anecdotal." → **Referral to board.**  
  - **Step 3:** Both summarize opposition accurately and endorse. → **Sufficient.**  
  - **Step 4:** Startup’s institutional policy: "Ignore studies not using our methodology." No mitigation plan. → **Referral to board.**  
  - **Senior board ruling:** **Do not fund.** Structural bad faith (startup’s institutional filtering) outweighs individual openness. *Unwelcome because collaboration is scientifically promising, but procedure flags unreliability.*  

  ---

  ### **What the Procedure Cannot Determine**  
  1. **Productive outcomes:** Good faith does not guarantee useful results (e.g., flawed methodology may persist).  
  2. **Hidden motives:** Cannot detect covert agendas (e.g., one side seeking legitimacy or data for advocacy).  
  3. **Power imbalances:** Does not assess if one group dominates resources/decision-making.  
  4. **Truth or bias:** Cannot verify if "evidence" is epistemically sound or if institutional filters are justified.  
  5. **Long-term impact:** Does not predict if collaboration reduces polarization or influences policy.  

  This procedure minimizes performative collaboration but remains a screening tool—not a guarantee of success. Senior board referrals ensure values-based decisions where mechanical checks fall short.
