prompt: |-
  hey, retired chemist here, been poking around philosophy of action and ethics since I retired. I keep seeing this move and I dont know if it has a proper name. The idea is indirect normativity -- you figure out what a fully rational, fully informed version of you would want, and that generates your real-world obligations. But I notice people deploy it selectively. Example one: someone asks why they should save for retirement when the future is unpredictable, and the reply is "your idealized self knows the probabilities and wants you to save, so thats your real duty." Example two: in medical ethics, "what would a rational patient want?" is used to justify continuing treatment, but if you point out that a rational patient might prioritize quality of life over length and want to stop, suddenly they say "we cant actually run that computation, so we default to preserving life." So the idealized deliberation is treated as authoritative when it supports the speaker's conclusion, and as an unrealistic heuristic when it undermines it. Ive seen similar patterns in environmental policy debates. Is there an established concept for this specific failure mode of indirect normativity -- not just hypocrisy or inconsistency, but this particular double-use of the ideal agent? If not, can you coin a term with clear boundaries that seperate it from ordinary equivocation and from the legitimate Kantian use of ideals as regulative ideas? I want to know exactly what the phenomenon is, what it isnt, and where the edges are, not just a bare label.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're a retired chemist who's diving into philosophy, specifically the philosophy of action and ethics. They've noticed a pattern in arguments using indirect normativity—where people appeal to an idealized version of oneself to derive obligations. The issue is that this appeal is applied selectively: used when it supports the desired conclusion but dismissed when it doesn't. The user wants to know if there's a term for this specific failure mode or if one can be coined, with clear boundaries distinguishing it from similar concepts like hypocrisy or Kantian regulative ideals.

  First, I need to identify the core problem. The user describes scenarios where the idealized self is authoritative in one instance (retirement savings) but deemed impractical in another (medical ethics). This selective application seems inconsistent. The key here is the dual misuse: treating the ideal as both perfectly knowable and computationally inaccessible depending on the argument's needs.

  Looking at existing philosophical concepts, hypocrisy or inconsistency are too broad. The user mentioned Kant, so I should differentiate from regulative ideals, which guide inquiry without claiming direct applicability. The problem here isn't the ideal itself but its inconsistent deployment. 

  Terms like "motivated reasoning" or "convenient rationalization" come to mind, but they're also too general. The specificity lies in how the ideal agent is manipulated—switching between its epistemic authority and its practical unreliability. 

  I recall "equivocation," but that's about shifting meanings of terms. Here, it's shifting the epistemic status of the ideal agent. So it's a form of conceptual gerrymandering applied to the ideal agent's role. 

  The coined term needs to capture this duality. "Epistemic Status Switching" or "Ideal Agent Epistemic Doublespeak" might work, but they're a bit clunky. "Normative Jekyll/Hyde Maneuver" is catchy but metaphorical. "Selective Idealization Gambit" gets closer, emphasizing the strategic selection. 

  The user also wants clear boundaries. Legitimate use would maintain consistent epistemic treatment of the ideal agent. For example, consistently treating it as a heuristic or regulative ideal. Illegitimate use flips the status based on desired outcomes. 

  Environmental policy examples might involve idealized future generations. If proponents invoke their preferences only when it aligns with sustainability but dismiss them as speculative when it doesn't, that fits the pattern. 

  I should ensure the term isn't conflated with Kantian ideals, which are consistently used as guides, not concrete authorities. Also, distinguish from simple hypocrisy by focusing on the epistemic manipulation around the ideal agent's knowability and authority.
answer: |-
  What you're describing is a **specific epistemic and rhetorical failure within indirect normativity frameworks**. It's not merely inconsistency or hypocrisy, nor is it the legitimate Kantian use of regulative ideals. This maneuver exploits the *dual nature* of the ideal agent (epistemically privileged vs. practically inaccessible) to selectively justify predetermined conclusions.

  ### The Core Phenomenon: **Epistemic Authority Switching (EAS)**
  **Definition:** *The illegitimate alternation between treating the ideal agent's judgment as (1) an epistemically authoritative source of normative truth, and (2) an unknowable or computationally infeasible abstraction, depending solely on whether its presumed output aligns with the speaker's desired conclusion.*

  ### Key Features & Boundaries
  1.  **The Double-Move:**
      *   **Move 1 (Invoking Epistemic Authority):** "The ideal agent *knows* the probabilities/values/facts you lack. *Therefore*, their judgment is objectively binding." (Used when the presumed output supports the speaker).
      *   **Move 2 (Invoking Epistemic Inaccessibility):** "We cannot *actually know* what the ideal agent would decide; it's too complex/uncertain. *Therefore*, we must default to [speaker's preferred fallback]." (Used when the presumed output undermines the speaker).
      *   **Crucial Point:** The switch hinges *entirely* on the desired outcome, not on a consistent assessment of the ideal agent's knowability or the computational limits.

  2.  **What it IS (Boundaries):**
      *   **A Form of Motivated Reasoning:** Driven by a desired conclusion, not truth-seeking.
      *   **A Conceptual Gerrymander:** Illegitimately redrawing the boundaries of "knowability" or "feasibility" around the ideal agent to suit the argument.
      *   **An Abuse of Idealization:** Treating the ideal agent as a rhetorical device rather than a consistent normative standard.
      *   **Distinct from Simple Inconsistency:** Inconsistency might involve applying the *same standard* differently. EAS involves *switching the fundamental status* of the standard itself (knowable authority vs. inaccessible abstraction).
      *   **Distinct from Legitimate Uncertainty:** When an argument *consistently* acknowledges the epistemic limits of idealization and proposes a reasonable heuristic (e.g., "Since we can't perfectly know the ideal choice, we generally prioritize life preservation absent clear contrary evidence"), it avoids EAS. EAS occurs when the *same source* (the ideal agent) is treated as perfectly knowable in one context and utterly unknowable in another *based solely on outcome*.

  3.  **What it ISN'T (Boundaries):**
      *   **NOT Hypocrisy:** Hypocrisy is acting contrary to one's stated principles. EAS is a *rhetorical/theoretical* maneuver concerning the *status* of a normative source.
      *   **NOT Ordinary Equivocation:** Equivocation shifts the meaning of a *term*. EAS shifts the *epistemic status* and *normative force* attributed to a *specific conceptual entity* (the ideal agent).
      *   **NOT Legitimate Kantian Regulative Use:** Kantian ideals (like the Kingdom of Ends) consistently function as *guides* for reasoning and aspiration, *never* as sources of concrete, knowable prescriptions for specific cases. They define the *form* of reasoning, not the specific output. EAS *does* treat the ideal agent as capable of outputting specific prescriptions (when convenient) while abandoning that very idea when inconvenient.
      *   **NOT Genuine Computational Limitations:** If an argument consistently holds that ideal deliberation is computationally infeasible *in all relevantly similar cases* and uses a consistent heuristic, it avoids EAS. EAS selectively invokes computational infeasibility only when the ideal output is undesirable.

  4.  **The Edges:**
      *   **The Trigger:** The switch occurs when confronting a counterfactual where the ideal agent's likely decision *contradicts* the speaker's preferred stance.
      *   **The Tell:** Look for the *sudden introduction* of epistemic limitations (complexity, uncertainty, subjectivity) specifically when the ideal agent argument points the "wrong" way, after having confidently invoked its authority moments before.
      *   **Legitimate Adjacent Cases:** Debates about *how* to model the ideal agent (what information counts as "full"? what counts as "rational"?) are often legitimate. EAS occurs *after* a specific model/outcome is presumed authoritative in one case, then its *very knowability* is denied when needed elsewhere. Disagreement about the *inputs* to ideal deliberation isn't EAS; denying we can *ever* run the deliberation *only when it's inconvenient* is EAS.

  ### Coined Term: **The Ideal Agent Epistemic Shell Game (IAESG)**
  *   **Why it Fits:**
      *   **"Ideal Agent":** Specifies the conceptual tool being abused.
      *   **"Epistemic":** Highlights the core issue is about knowledge, access, and authority.
      *   **"Shell Game":** Evokes the deceptive switching (now you see the knowable authority, now you don't) and the hiding of the motivating conclusion (the "pea" under the shell).
  *   **Boundaries Embedded:** The term implies deception through switching the *epistemic status* of a specific entity (the Ideal Agent), distinguishing it from simple inconsistency (no shell game) or legitimate regulative use (no deception, consistent function).

  ### Applying IAESG/EAS to Your Examples
  1.  **Retirement Savings:** Move 1 is deployed. The ideal agent's knowledge and desire are treated as knowable and authoritative, generating a duty.
  2.  **Medical Ethics (Continuing Treatment):** Move 1 is *attempted* ("rational patient would want life"). When challenged that the *same* ideal agent might prioritize QoL (Move 1 would undermine the desired conclusion), Move 2 is deployed ("we can't *really* know, so default to life").
  3.  **Medical Ethics (Stopping Treatment):** If someone *only* uses Move 2 ("we can't know, so default to patient's *current* expressed wishes/QoL") *consistently*, it's not IAESG, even if debatable. IAESG requires the *switch* based on outcome.
  4.  **Environmental Policy:** "Ideal future generations (or an ideal planetary steward) would demand radical decarbonization now!" (Move 1 - knowable, authoritative). But when faced with evidence that radical decarbonization *now* might cause severe economic hardship *now* that the ideal agent would weigh heavily: "We can't possibly compute the complex intergenerational trade-offs accurately!" (Move 2 - unknowable, default to status quo/less action).

  ### In Essence
  You've pinpointed a sophisticated form of **normative bad faith within idealization-based ethics**. It weaponizes the inherent tension between the ideal agent's theoretical authority and its practical unknowability, switching between them not based on genuine epistemic considerations, but purely to protect a predetermined normative conclusion. **Epistemic Authority Switching (EAS)** or the **Ideal Agent Epistemic Shell Game (IAESG)** captures this specific, deceptive maneuver at the intersection of meta-ethics, practical reasoning, and motivated cognition. It's the illegitimate cousin of legitimate indirect normativity and regulative ideals.
