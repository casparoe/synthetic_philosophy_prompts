answer: |-
  Below is a specification of desiderata for a theory of rational acceptance, tailored to **public certification bodies** (regulators, journals, courts, standards bodies). The requirements are grounded in institutional constraints, with motivations, controversy flags, and trade-offs highlighted. Your three novel cases are integrated as test points. Requirements marked **★** are non-negotiable for institutional roles; others reflect tensions between values.

  ---

  ### **Core Distinctions Respected**  
  1. **Acceptance-for-Inference vs. Public Commitment vs. Belief**  
     - *Why*: A regulator might *use* a sub-claim for internal calculations (acceptance-for-inference) without *certifying* it publicly.  
     - *Controversy*: Uncontroversial. All serious theories acknowledge this.  

  2. **Closure Under *Checked* Entailment vs. Logical Entailment**  
     - *Why*: A court can accept "DNA matches suspect" and "suspect was at scene" but reject "suspect committed crime" if no direct evidence links the inferences.  
     - *Controversy*: Mildly contested. Some formalists insist on full logical closure; most applied epistemologists reject this.  

  3. **First-Personal Deliberation vs. Third-Personal Assessment**  
     - *Why*: A journal editor’s threshold for accepting a replication study may differ from how we judge their decision post-fraud revelation.  
     - *Controversy*: Uncontroversial in principle, often collapsed in practice.  

  4. **Improbability vs. Badly Evidenced**  
     - *Why*: A lottery ticket’s loss is *probable* but *statistically evidenced*; a defendant’s guilt based on base rates is *improbable and badly evidenced* without case-specific facts.  
     - *Controversy*: Contentious. Frequentists often conflate these; Bayesians distinguish them.  

  ---

  ### **Desiderata for Institutional Acceptance**  
  #### **Non-Negotiables (★)**  
  1. **★ Public Defensibility**  
     - *Motivation*: A regulator certifying a nuclear plant must justify decisions to stakeholders. Certification must survive scrutiny even if probabilistic thresholds are missed.  
     - *Controversy*: Uncontroversial for institutions.  
     - *Test Cases*:  
       - *Adversarial Preface*: Author cannot publicly certify claims if hostile review makes defensibility impossible, *even if evidence is unchanged*.  
       - *Distributed Preface*: Editor’s certification requires defensibility for the whole volume, not just aggregate chapter endorsements.  

  2. **★ Actionability**  
     - *Motivation*: Standards bodies issue guidance that must trigger concrete actions (e.g., "Use encryption method X"). Acceptance must license action without second-guessing.  
     - *Controversy*: Uncontroversial.  
     - *Test Cases*:  
       - *Audited Lottery*: If you accept "Ticket 1 loses" after audit, you act accordingly (e.g., discard it). Without audit, statistical "acceptance" may not license action.  

  3. **★ No Logical Omniscience**  
     - *Motivation*: Institutions cannot be expected to spot all entailments of certified claims (e.g., a regulator need not see that Claim A ∧ Claim B entails a contradiction).  
     - *Controversy*: Consensus among formal epistemologists.  

  #### **Negotiables (Tension-Points)**  
  4. **Stakes-Sensitivity**  
     - *Motivation*: Courts require "beyond reasonable doubt" for criminal conviction but "preponderance" for civil cases. Higher stakes → higher threshold.  
     - *Controversy*: **Contested**. Subjectivist Bayesians accept; objectivists/reliabilists reject.  
     - *Trade-off*: Resolves lottery paradox (high stakes forbid accepting single-ticket loss) but clashes with *Adversarial Preface*:  
       - *Objection*: Evidence hasn’t changed, so why should acceptance? If stakes-sensitivity is *not* a requirement, the author’s acceptance remains unchanged.  

  5. **Weak Closure Under Checked Conjunction**  
     - *Motivation*: If a body individually certifies Claim A and Claim B *and checks that A ∧ B is consistent*, it should accept A ∧ B.  
     - *Controversy*: **Contested**. Closure advocates (e.g., Kyburg) demand it; non-closure theories (e.g., probabilistic) reject it.  
     - *Trade-off*:  
       - Solves *Distributed Preface*: If each author certifies their chapter *and* the editor checks for inter-chapter consistency, the volume can be certified.  
       - *But*: Causes preface paradox for single agents.  

  6. **Evidence Sensitivity**  
     - *Motivation*: Statistical evidence (lottery tickets) vs. direct audit (audited ticket) should be treated differently.  
     - *Controversy*: Uncontroversial in legal epistemology; contested in formal logic.  
     - *Test Case*:  
       - *Audited Lottery*: Accepting "Ticket 1 loses" post-audit is rational, but accepting "Ticket 2 loses" without audit is not. Breaks ticket symmetry.  

  ---

  ### **Self-Defeating Tensions**  
  - **Incompatible Pair**: **Stakes-Sensitivity** + **Closure Under Checked Conjunction**  
    - *Why*:  
      - High stakes (e.g., criminal conviction) forbid accepting individual low-risk claims (e.g., "Witness 1 is reliable").  
      - But if you accept all such claims *and check their consistency*, closure forces you to accept their conjunction—which may exceed the stakes threshold.  
    - *Manifests in*: Author’s preface (high-stakes book) and adversarial preface.  

  - **The Kill Switch Requirement**: **Weak Closure Under Checked Conjunction**  
    - *Why it kills theories*: Rejecting it eliminates paradoxes but makes institutions unable to certify complex systems (e.g., regulators couldn’t approve a bridge by certifying its 100 components). Accepting it forces preface-like contradictions.  
    - *Casualties*:  
      - Probabilistic theories (e.g., "accept if P>0.99") must abandon closure.  
      - Contextualist theories must explain why institutions have "fixed" contexts.  

  ---

  ### **Testing Your Cases**  
  1. **Distributed Preface**  
     - *Desiderata Implications*:  
       - If authors only commit to chapters (not the book), **aggregate acceptance ≠ accepting the aggregate**.  
       - Editor must satisfy **Public Defensibility** for the whole volume. *Resolution*: Paradox arises only if editor assumes closure without checking consistency.  

  2. **Adversarial Preface**  
     - *Desiderata Conflict*:  
       - **Stakes-Sensitivity** suggests author should retract claims.  
       - **Evidence Sensitivity** says evidence is unchanged; retraction seems irrational.  
     - *Verdict*: Case exposes stakes-sensitivity as a *pragmatic* (not epistemic) requirement. Institutions might decouple "certification" (evidence-based) from "public commitment" (stakes-sensitive).  

  3. **Audited Lottery**  
     - *Desiderata Implications*:  
       - **Evidence Sensitivity** explains why audited tickets can be accepted but symmetric non-audited ones cannot.  
       - **Actionability** licenses acting on audited losses but not statistical ones.  
     - *Theories Busted*: Those treating statistical/individual evidence identically (e.g., pure probabilism).  

  ---

  ### **Strategic Options Scorecard**  
  | **Strategy**               | **Pros**                                      | **Cons**                                      | **Desiderata Met**                     |  
  |----------------------------|-----------------------------------------------|-----------------------------------------------|----------------------------------------|  
  | **Threshold Adjustment**   | Solves lottery paradox; stakes-sensitive.     | Fails preface; audited lottery breaks symmetry. | Actionability, Stakes-Sensitivity     |  
  | **Restrict Closure**       | Avoids preface paradox.                       | Undermines institutional certification (★).   | Public Defensibility (if weak closure) |  
  | **Contextualize Threshold**| Handles stakes variation (e.g., courts).      | Adversarial preface: context doesn’t change evidence. | Public Defensibility, Stakes-Sensitivity |  
  | **Deny Probabilism**       | Resolves evidence distinction (audited lottery). | Lacks precision; hard to formalize.         | Evidence Sensitivity, Actionability    |  

  **Best Fit for Institutions**: Hybrid approach with **Evidence Sensitivity** + **Weak Closure Under Checked Conjunction** + **Stakes-Sensitive Public Commitment**. Sacrifices full probabilistic coherence but meets core institutional needs.  

  **Epistemic Standing Notes**:  
  - I mark uncontroversial claims (e.g., no logical omniscience) as consensus.  
  - Stakes-sensitivity and closure are flagged as contested based on current literature (e.g., Fantl & McGrath vs. Hawthorne).  
  - Your framing of "badly evidenced vs. improbable" does unearned work if used to *dissolve* the lottery paradox—most theorists grant the distinction but still struggle with acceptance.  
  - The distributed preface case is novel; my analysis extrapolates from collective epistemology (e.g., List & Pettit).  

  **Final Warning**: No theory satisfies all desiderata without trade-offs. The kill switch is **closure under checked conjunction**—institutions need it, but it breeds paradox. Prioritize **Public Defensibility** and **Actionability**; let other requirements bend.
