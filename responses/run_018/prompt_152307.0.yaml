answer: |-
  Your position is intellectually coherent and reflects legitimate concerns about conceptual dilution, but faces significant challenges. Here are decisive defeaters addressing your core queries:

  ### 1. **Historical Cases the Narrow Definition Fails**
     - **Cultural Genocide as Core Mechanism**: 
       - **Canadian Residential Schools**: Systematic forced assimilation of Indigenous children (1876-1996) aimed to "kill the Indian in the child" (Prime Minister MacDonald, 1883). This intentionally destroyed group identity through:  
         ✓ Forced family separation  
         ✓ Prohibition of native languages/ceremonies  
         ✓ Mass graves from neglect/disease  
       *Continuity with Holocaust*: Parallels Nazi *Lebensborn* program's child abduction for Germanization. Both targeted group continuity through cultural eradication.
     - **Political Groups as Ethnic Proxies**:  
       - **Khmer Rouge (1975-79)**: Targeted "city dwellers" as a political class, but victimization followed *ethnic patterns*:  
         ✓ Vietnamese/Cham Muslims: 90% extermination rate  
         ✓ Buddhist monks: 100% temples destroyed  
         *Legal loophole*: Defining victims as "bourgeois elements" exploited the Convention's exclusion.

  ### 2. **Lemkin's Intentions vs. Convention Compromise**
     - Lemkin explicitly included cultural destruction in *Axis Rule in Occupied Europe* (1944):  
       > "Genocide has two phases: **destruction of national patterns** of the oppressed group; and **imposition of national patterns** of the oppressor."  
     - His draft convention included:  
       ✓ "Prohibiting the use of the national language"  
       ✓ "Destroying libraries, museums, schools, historical monuments"  
     - *Diplomatic archives* reveal exclusions were Soviet demands to shield Stalin's purges, not conceptual refinement.

  ### 3. **Arbitrary Protection of Political Groups**
     - **Moral Incoherence**: Why protect ethnic groups but not political dissidents when:  
       - Both possess immutable identities (ethnicity by birth, political belief by conscience)  
       - Both face existential targeting (e.g., Guatemala's 1980s Mayan genocide *legally* excluded Ladino socialists, though equally exterminated)  
     - **Legal Consequences**:  
       - *Prosecutorial Gap*: 20th-century mass killings of political groups (e.g., Indonesia 1965-66: 500,000+ communists killed) couldn't be prosecuted as genocide.  
       - *Perpetrator Incentive*: States can reframe targets as "political" (e.g., Myanmar calling Rohingya "terrorists").

  ### 4. **Definitional Fiat and Moral-Legal Tension**
     - **Self-Insulation Critique**:  
       Your view risks tautology: "Genocide is Convention-defined because the Convention defines genocide." This fails when:  
       - Moral intuition recognizes colonial assimilation policies (e.g., Australia's Stolen Generations) as genocidal *in essence*  
       - Legal practice evolves: ICTR recognized *cultural destruction* as genocidal intent evidence in *Akayesu* (1998)  
     - **Category Collapse is Avoidable**:  
       Distinguishing genocide from other crimes needn't rely on narrow criteria. Alternative frameworks:  
       - *Intent-based*: Focus on specific intent to destroy groups *as such* (whether ethnic, political, or cultural)  
       - *Scale/irreversibility*: Climate displacement (e.g., sinking island nations) could qualify *if* proven intentional (e.g., oil companies suppressing climate science to ensure territorial annihilation).

  ### What Your View Must Concede
  1. **The Convention's exclusions were geopolitical**, not philosophical. Soviet/Allied realpolitik sacrificed coherence.  
  2. **Cultural erasure enables physical genocide**: Residential schools facilitated land dispossession and demographic collapse.  
  3. **Political/ethnic boundaries blur**: Rwanda's Hutu/Tutsi distinctions were colonial constructs; modern genocides often fuse identity politics.  

  ### Conclusion
  The narrow definition's flaw isn't overextension but *moral arbitrage*: It lets perpetrators game the system by redefining groups. Lemkin's broader view better captures genocide's core evil – *the destruction of human diversity*. While caution against overuse is valid, excluding cultural/political destruction ignores historical realities where these were genocide's *primary methods*. A defensible boundary would focus on *intent to destroy collectivities fundamental to human identity*, regardless of the Convention's Cold War compromises.
