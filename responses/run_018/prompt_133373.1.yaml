answer: |-
  Here's the conceptual ranking and reasoning for your workshop focus, stripped to bare steel with explicit criteria:

  **Core Ranking (Most Upstream → Downstream):**  
  1. **Epistemic Duplication Framing (EDF)**  
  2. **Decision-Theoretic Behavior in Duplicated Setups**  
  3. Centered-Worlds vs. Centered-Propositions  

  ---

  ### 1. **Epistemic Duplication Framing (EDF)**  
     - **Why Upstream?**  
       EDF cuts directly to the core ambiguity in self-locating belief: *What is the object of credence when agents are duplicated?* Traditional Sleeping Beauty smuggles in memory erasure (a physical/psychological process), while EDF isolates the *purely epistemic* problem of identical but causally isolated agents with identical evidence. This reframing forces clarity on whether self-location is a primitive or reducible property.  
     - **Tractability:**  
       High for philosophers. Requires only logic and intuition pumps: e.g., "If two copies of you wake in identical rooms, both told one room has a prize, what *should* each believe about their own room?" No experiments needed—pure normative analysis of rational constraints under duplication.  
     - **Dependency/Movement:**  
       Solves EDF → resolves Sleeping Beauty as a corollary (memory erasure ≈ imperfect duplication). Also upstream of decision theory: betting behavior *depends* on what credences are rational to assign in duplicated states.  
     - **Evidence to Flip Ranking:**  
       If a consensus emerges that EDF reduces trivially to existing frameworks (e.g., centered propositions) *without new insight*, it becomes downstream. Currently, it resists reduction.  

  ### 2. **Decision-Theoretic Behavior in Duplicated Setups**  
     - **Why Midstream?**  
       Depends entirely on EDF resolving what *credences* the duplicated agent should have. "Halfer" vs. "thirder" isn’t the real divide here—it’s whether decision theory should obey *ex ante* rationality (pre-duplication) or *indexical* rationality (post-duplication).  
     - **Tractability:**  
       Moderate. Philosophers can model bets using Dutch books/consistency arguments (e.g., "If both copies accept a bet that loses money iff the prize isn’t in their room, does this bankrupt the pre-duplication agent?"). No experiments—pure game theory against clones.  
     - **Dependency/Movement:**  
       Tests the *consequences* of EDF. If EDF prescribes credence *p*, but bets imply *q*, that flags inconsistency in the epistemology/decision-theory link. Moves debates on rational agency (e.g., in anthropic reasoning or AI alignment).  
     - **Evidence to Flip Ranking:**  
       If empirical lab work (e.g., with human subjects in VR duplication simulations) shows *consistent* bet placements contradicting all major theories, it could leapfrog EDF by exposing a crisis in normative models.  

  ### 3. **Centered-Worlds (CW) vs. Centered-Propositions (CP)**  
     - **Why Downstream?**  
       This is a *formal implementation tool*, not the core problem. EDF asks *what* agents should believe; CW/CP debates *how to represent it*. Whether self-locating beliefs are modeled as possible worlds with a "center" (CW) or as properties (CP) is secondary to the prior question of what those beliefs *should be* under duplication.  
     - **Tractability:**  
       High but limited payoff. Philosophers excel at comparing formal systems (e.g., "Does CW obscure agent-relative evidence?").  
     - **Dependency/Movement:**  
       Entirely dependent on EDF/decision theory. If EDF concludes that duplication requires assigning credence to "being copy X," CW handles this naturally—but if CP can too, the debate becomes technical. Minimal movement for other fields.  
     - **Evidence to Flip Ranking:**  
       If one framework (e.g., CP) cleanly resolves duplication cases *and* explains why the other fails, it could rise—but only if EDF remains contested.  

  ---

  ### **Dead End Warnings**  
  - **Avoid:** "What is *really* duplicated?" (metaphysics of identity). This distracts from the epistemic question. EDF assumes duplication as a *given epistemic state*; metaphysics is downstream noise.  
  - **Trap:** Arguing about "consciousness" in duplication. The problem is about constraints on *rational belief*, not phenomenology.  

  ### **Why This Ranking Wins**  
  - **Dependency Flow:** EDF → defines credences → decision theory tests them → formalisms implement them.  
  - **Tractability:** EDF and decision theory are pure epistemology/game theory—philosophers’ home turf.  
  - **Leverage:** Solving EDF dissolves decades of circular Sleeping Beauty debates by isolating the core paradox. Decision theory then pressures EDF to be action-guiding.  

  **Bottom Line:** Focus the 3 years on **Epistemic Duplication** as the root, with **Decision Theory** as the acid test. Centered debates are cleanup work. If philosophers crack EDF, everything else follows—if not, all downstream work is building on quicksand.
