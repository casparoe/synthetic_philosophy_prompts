answer: |-
  ## Final Examination: Philosophy of Action and Rational Agency

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer ONE of the following essay questions. This booklet contains Question 1: The Divided Driver. Write your answer clearly in the provided blue book. Ensure you address all parts (A, B, C) of the question.

  **Question 1: The Divided Driver and the Limits of Self-Command**

  Classic decision theory models rational agents as unified entities maximizing expected utility. The Absent-Minded Driver Problem (AMDP) challenges this by introducing diachronic uncertainty due to imperfect memory. Consider the standard scenario:

  *   A driver must exit a highway at Exit B for a large payoff ($4), but if he misses it, he ends at Exit C with a small payoff ($0). Exit A yields a moderate payoff ($1).
  *   The driver cannot distinguish a crucial intersection from an identical prior intersection. Upon reaching *an* intersection, he doesn't know if it's the first (leading to Exit A) or the second (leading to Exit B). He knows there are exactly two intersections.
  *   He plans in advance ("cool state") what to do at an intersection. The optimal plan is "Exit only at the second intersection" (i.e., "Go at first intersection, Exit at second intersection"). However, when he *reaches* an intersection ("hot state"), he doesn't know if it's first or second. Sticking rigidly to the plan "Exit only at the second" is impossible at the moment of choice because he doesn't know *which* intersection he is at. Calculating the expected utility of "Exit" vs. "Go" *at the moment*, based on his synchronic belief about his location (which assigns equal probability to being at the first or second intersection given indifference), leads him to Exit immediately (EU(Exit) = 0.5*1 + 0.5*4 = 2.5; EU(Go) = 0.5*0 + 0.5*4 = 2). This "naive" synchronic rationality conflicts with and undermines the diachronically optimal plan.

  Now consider the **Divided-Driver Case**. The driver knows he is prone to a different flaw: not simple forgetfulness, but a conflict between cognitive states. His cool, deliberative planning state rationally endorses the plan "Go at first intersection, Exit at second intersection". However, he *anticipates with certainty* that when he reaches the second intersection, a distinct "hot" reasoning state (e.g., driven by fatigue, impulsiveness) will *actively reject* this plan and will irrationally choose to Go again (to Exit C for $0) because it *feels* like it might be the first intersection, despite the plan. The driver, in his cool state, therefore installs an automated exit-lock system: it will automatically trigger Exit at *every* intersection unless he manually overrides it within a 5-second window upon arriving. Crucially:
  1.  The lock system has a known 2% mechanical failure rate per use (meaning a 2% chance it fails to trigger Exit when it should).
  2.  The manual override remains physically available and functional at all times.

  **Answer the following parts:**

  *   **(Part A: 5 points)** Precisely reconstruct the logical tension in the *original* AMDP. Explain why the recommendation "just stick to your optimal plan" collapses at the moment of action. Clearly distinguish the role of *diachronic planning authority* (the cool state's optimal plan) from *synchronic deliberative belief* (the hot state's belief at the choice point).
  *   **(Part B: 7 points)** Analyze the Divided-Driver Case. Does the automated lock system resolve the original AMDP difficulty, or does it transform the problem into one concerning *strategic self-design*? Specifically:
      *   Does rationality require the driver, in his cool planning state, to *disable the manual override entirely* (rendering it impossible to use), despite its availability and the 2% failure rate? Why or why not?
      *   What does choosing to disable (or not disable) the override imply about how the cool state views the future hot state: as an *unreliable instrument* to be bypassed/controlled, or as a *reasoning partner* whose potential dissent must be accommodated?
  *   **(Part C: 8 points)** Evaluate two competing interpretations of what the Divided-Driver Case reveals about rationality:
      1.  **Strategic Self-Control:** Rationality is essentially about diachronic strategic control over one's own psychological mechanisms to ensure one's long-term plans succeed, even against one's own future irrational impulses.
      2.  **Executive Integration:** Rationality fundamentally requires the executive integration of cognitive states over time; treating one's future self as an adversary to be controlled via external mechanisms like locks represents a failure of proper agency, not its triumph.
      Argue which interpretation better explains why disabling the manual override might *still* be rational for the divided driver, *even if* the hot state, upon realising the override is disabled, protests that this violates its autonomy or capacity for (synchronic) choice. In your argument, explicitly address the significance of the 2% mechanical failure rate.

  ---

  ## Model Answer (Approx. 700 words)

  **Part A: The Core Tension in AMDP (5 points)**
  The original Absent-Minded Driver Problem exposes a conflict between two perspectives on rationality: diachronic and synchronic. Diachronically, from the planning stage with full knowledge of the structure (two intersections, payoff structure), the optimal plan P is unequivocal: "Go at Intersection 1, Exit at Intersection 2". This maximizes expected utility (EU(P) = $4). The recommendation "stick to your plan" assumes the agent can execute P based on its diachronic authority. However, this collapses at the moment of action due to synchronic uncertainty. When the driver *reaches* an intersection, he lacks crucial information: he doesn't know *which* intersection it is. His synchronic belief, given his ignorance and the indistinguishability of the intersections, must assign equal probability (0.5) to being at Intersection 1 or 2. Applying standard synchronic rationality *at this point*, he calculates the expected utility of his immediate choices: Exiting yields EU(Exit) = (0.5 * $1) + (0.5 * $4) = $2.50. Going yields EU(Go) = (0.5 * $0) + (0.5 * $4) = $2.00. Therefore, synchronic rationality dictates *Exiting* immediately. But this action violates P if he is at Intersection 1 (he should Go) and fulfills P only if he is at Intersection 2 (where he should Exit). Crucially, if he follows synchronic rationality and Exits at what *might* be Intersection 1, he guarantees he never reaches Intersection 2 to get the $4 payoff. The logical tension is that the diachronically optimal plan P *cannot be faithfully executed* by an agent applying standard synchronic expected utility maximization at the choice point due to the self-locating uncertainty. The "stick to the plan" recommendation lacks traction because the plan requires knowledge (which intersection it is) that the agent doesn't possess when acting.

  **Part B: The Lock System and Strategic Self-Design (7 points)**
  The automated lock system in the Divided-Driver Case transforms the problem rather than simply resolving the original AMDP difficulty. The original problem stemmed from epistemic uncertainty (not knowing location). Here, the driver *anticipates certainty* about a *motivational* flaw: at Intersection 2, his hot state will *actively and irrationally* choose Go, defying the optimal plan. The lock aims to bypass this anticipated irrationality through a physical constraint.

  The critical self-design question is whether rationality requires disabling the manual override. There are strong arguments for disabling it. The driver *knows* the hot state at Intersection 2 will irrationally choose Go. Leaving the override functional provides the hot state exactly the tool it desires to sabotage the plan. The cool state, rationally endorsing plan P, must predict that if the override is available, the hot state *will* use it at Intersection 2 to Go, leading to the $0 payoff. Disabling the override ensures the lock physically enforces Exit at *every* intersection, which, while suboptimal at Intersection 1 (yielding $1 instead of the planned Go), guarantees the optimal outcome at Intersection 2 (Exit for $4). Crucially, it prevents the catastrophic $0 outcome the hot state would cause. The 2% failure rate introduces a risk: there's a 2% chance Exit isn't triggered *even if the lock is engaged*. However, this risk is independent of the override. Disabling the override doesn't increase this risk; it only removes the *certain* risk posed by the hot state's irrational override at Intersection 2. Weighing the certain disaster ($0) if the override is usable against the small (2%) chance of mechanical failure causing disaster if it's disabled, disabling seems rationally preferable.

  Choosing to disable the override reveals the cool state viewing the future hot state not as a reasoning partner, but fundamentally as an *unreliable instrument*. A reasoning partner could potentially be persuaded or engage in dialogue. Here, the cool state anticipates the hot state's reasoning is corrupted ("feels like it might be the first") and immune to persuasion. Trust is impossible. The override is a point of vulnerability the irrational state will exploit. Disabling it treats the hot state as a malfunctioning component whose outputs (override commands) must be physically blocked to ensure the system functions as designed (according to plan P). Rationality demands neutralizing the threat posed by one's own future irrationality.

  **Part C: Strategic Control vs. Executive Integration (8 points)**
  The Divided-Driver Case, especially the decision to disable the override in the face of potential hot-state protest, strongly supports the **Strategic Self-Control** interpretation of rationality. This view prioritizes the successful execution of the agent's reflectively endorsed, long-term plans. The cool state represents the agent's considered judgment about what is best overall. The hot state's anticipated irrationality is a predictable internal obstacle. Rationality involves designing mechanisms (like the disabled-override lock) to ensure the obstacle is circumvented, guaranteeing the plan's success. Disabling the override is the strategic move that secures the diachronic goal ($4 at Exit B) against the known internal saboteur. The hot state's protest about autonomy is irrelevant from this perspective; its autonomy would be used destructively ($0 outcome). Rationality is about winning the game against one's own weaknesses, using whatever external or internal tools (like precommitment devices) are necessary.

  The **Executive Integration** interpretation struggles to justify disabling the override. It views rationality as requiring the agent's states to be responsive to reasons over time, forming an integrated whole. Disabling the override seems like an admission of failure – a fragmentation where the agent resorts to *controlling* a part of itself rather than *integrating* it. The protest highlights this: the hot state feels alienated, its capacity for choice overridden. This view might suggest the cool state should seek ways to *persuade* the hot state or build better habits, not silence it physically. However, this seems implausible in this case. The driver *knows* persuasion won't work; the hot state's "reasoning" is stipulated as irrational and resistant. Forcing integration when one part is predictably unresponsive to reasons risks the worst outcome ($0). Executive Integration offers no effective *solution* to the anticipated resistance beyond hope or failed dialogue.

  The 2% failure rate reinforces the Strategic Control view. It quantifies the risk of relying *solely* on the mechanical lock. Disabling the override accepts this small exogenous risk to eliminate the *much larger, endogenous, and certain* risk posed by the irrational hot state. Rationality, under Strategic Control, involves calculating these risks and choosing the mechanism (disabled-override lock) with the highest probability of securing the diachronic goal. The protest of the hot state is simply noise from the defective component being bypassed; it doesn't alter the strategic calculus of maximizing the chance of achieving $4. Therefore, Strategic Self-Control provides a more compelling explanation for the rationality of disabling the override, viewing it as the essential act of self-defense necessary for successful diachronic agency in the face of predictable internal threats.

  ---

  ## Marking Scheme (Total: 20 Points)

  | **Must-Hit Move**                                                                                                                               | **Points** | **Typical Failure Mode (Costs Marks)**                                                                 |
  | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------- | :----------------------------------------------------------------------------------------------------- |
  | **Part A:** Precise reconstruction of AMDP's core tension: Diachronic optimal plan vs. impossibility of execution under synchronic belief/choice. Explicitly names the conflict source (self-locating uncertainty preventing plan identification at choice point). | 5          | Superficial summary of AMDP without isolating the *logical conflict* between diachronic plan and synchronic choice under ignorance. |
  | **Part B:** Correctly identifies the shift from epistemic uncertainty (original AMDP) to anticipated motivational resistance (Divided Driver).                                                                 | 2          | Conflates the hot state's active resistance with mere forgetfulness or lack of knowledge.              |
  | **Part B:** Argues coherently for or against disabling the override, explicitly weighing the *certain* risk of hot-state sabotage if override is usable against the *probabilistic* risk (2%) of mechanical failure if disabled. | 3          | Ignores the 2% failure rate in the analysis, or fails to compare the *certainty* of hot-state error vs. the *probability* of lock failure. |
  | **Part B:** Clearly articulates the implication: Disabling override treats future hot state as an unreliable instrument to be controlled/bypassed, not a reasoning partner.                                                                 | 2          | Vague statements about "not trusting oneself" without characterizing the *nature* of the relationship (instrument vs. partner). |
  | **Part C:** Accurately presents both interpretations (Strategic Self-Control & Executive Integration) and argues which better explains the rationality of disabling the override *despite* the hot state's protest. Explicitly links the interpretation to the override decision and the protest. | 5          | Describes interpretations but doesn't *apply* them convincingly to the override/protest dilemma, or chooses an interpretation without sufficient justification linked to the case specifics. |
  | **Part C:** Explicitly addresses the significance of the 2% failure rate within the chosen interpretation's framework for justifying override disabling.                                                       | 3          | Mentions the 2% rate but doesn't integrate it meaningfully into the argument for/against disabling or the evaluation of the interpretations. |

  **Grade Differentiation:**
  *   **A-Grade (17-20):** Hits all must-hit moves. Demonstrates deep understanding: precise logical reconstruction of AMDP tension; clear grasp of shift to resistance in Divided Driver; sophisticated analysis of override decision including risk calculus (2% vs. certainty); insightful evaluation of interpretations explicitly tied to override & protest; seamless integration of failure rate.
  *   **B-Grade (13-16):** Summarizes original AMDP accurately but may lack precision on the *source* of the tension. Identifies shift to resistance but analysis may be superficial. Discusses disabling override but may not rigorously weigh risks (ignores/downplays 2% vs. certainty). Presents interpretations but application to override/protest may be weak or lack depth. May conflate motivational resistance with mere memory failure.
