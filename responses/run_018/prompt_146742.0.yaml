prompt: |-
  I'm a retired biologist who just started reading philophy of science, and I keep running into this pattern: grant agencies and journal reviewers in neuroscience and psychiatry will accept an explanantion of behavior only if it eventually bottoms out in synapses, genes, or some other crane mechanism. If you propose a purely cognitive-level model — say, predicting depression relapse from belief-updating patterns — they treat it as a skyhook and reject it, even when the model is predictive and falsifiable. What theory of reduction does that institutional bias presuppose? Is it Dennett-style greedy reductionism, or just a practical rule about tractability? Would a non-reductive physicalist have to reject the practice, or can they say the funding rule is just about method not ontology? And if we rewrote the grant guidelines to treat top-down cognitive models as equally legitmate, what would that actually commit us to about explanantion? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a retired biologist diving into philosophy of science. They've noticed a pattern in neuroscience and psychiatry where explanations must bottom out in biological mechanisms like synapses or genes. Cognitive models, even if predictive, get rejected as "skyhooks." They want to know the underlying reduction theory behind this bias.

  First, I need to identify the theories of reduction involved. They mention Dennett's greedy reductionism. That's when you insist on the lowest level explanation, ignoring higher levels. But it could also be practical—requiring biological mechanisms for tractability in grants and journals.

  The user asks if non-reductive physicalists would reject this practice. Non-reductive physicalists accept multiple levels of explanation without reducing everything to physics. They might argue the funding rule is methodological, not ontological. So the practice could be practical without denying higher-level realities.

  Rewriting grant guidelines to accept cognitive models as legitimate—what would that commit to? It means endorsing explanatory pluralism. Different levels (cognitive, neural) provide valid explanations. It doesn't reject biology but adds cognitive science as another layer. This approach values predictive power and mechanism at the appropriate level.

  The user's deeper needs: They might be frustrated with the current system's limitations. They want validation for cognitive models and possibly to advocate for change. Understanding the philosophical basis could help them argue for inclusive grant guidelines. They might seek ammunition to challenge institutional biases, blending their biology background with new philosophy insights.
answer: |-
  **Bottom line:** The institutional bias reflects a pragmatic methodological reductionism rooted in tractability and funding priorities, not necessarily greedy reductionism or a deep ontological commitment, and non-reductive physicalists can accept this practice as a procedural rule while advocating for explanatory pluralism; rewriting grant guidelines to legitimize cognitive models commits to explanatory pluralism, where higher-level mechanisms are seen as causally efficacious and explanatorily sufficient within their domain.

  **Reasoning:**

  1.  **Presupposed Reduction Theory:** The bias primarily assumes **methodological reductionism** as a practical heuristic. Grant agencies and reviewers prioritize "bottoming out" in biology (synapses, genes) because:
      *   It aligns with the dominant paradigm and tools in neuroscience/psychiatry, promising concrete, measurable interventions.
      *   It's perceived as more "fundamental" and thus more likely to yield generalizable, mechanistic insights (even if this is often illusory).
      *   It fits established funding streams and experimental models better than complex cognitive constructs. While it *can* reflect **greedy reductionism** (Dennett's term for dismissing higher levels as unreal or epiphenomenal), the core driver is often practical: tractability, measurability, and perceived mechanistic depth for intervention. It doesn't necessarily presuppose *ontological* reductionism (the belief that only fundamental physical entities are real).

  2.  **Non-Reductive Physicalism (NRP) & the Practice:**
      *   **NRP can accept the funding rule pragmatically.** NRP holds that while everything is physical, higher-level properties (like cognitive states) are real, causally efficacious, and not reducible *in practice or explanation* to lower levels. An NRP proponent can argue:
          *   Granting agencies have finite resources and must prioritize lines of inquiry perceived as most likely to yield rapid, tangible progress or mechanistic understanding *at a specific level*.
          *   Demanding biological grounding is a (sometimes flawed) rule-of-thumb to ensure testability and avoid purely descriptive models lacking mechanistic anchors. They can see it as a *methodological filter*, not a denial of cognitive reality.
      *   **However, NRP would strongly criticize the bias *if* it stems from or implies:** Ontological dismissal of the cognitive level ("skyhooks aren't real"), insistence that cognitive explanations are *incomplete* without neural reduction (denying causal efficacy/sufficiency at the cognitive level), or rejecting predictive cognitive models *solely* for lacking neural correlates. NRP insists cognitive explanations are legitimate *in their own right*.

  3.  **Rewriting Grant Guidelines & Commitments:** Rewriting guidelines to treat cognitive models as equally legitimate commits proponents to:
      *   **Explanatory Pluralism:** Accepting multiple, autonomous (though potentially interacting) levels of explanation (cognitive, neural, molecular) as valid and complete *for their specific explanatory goals and domains*. A cognitive model predicting depression relapse via belief updating is sufficient explanation for that phenomenon, without requiring reduction.
      *   **Causal Efficacy of Higher Levels:** Recognizing cognitive mechanisms (belief updating patterns) as real causal players in the physical world, not merely epiphenomena. Their causal power arises from their physical implementation but is not *explained away* by it.
      *   **Level-Relative Mechanisms:** Acknowledging that legitimate mechanisms exist at the cognitive level (e.g., Bayesian updating, attentional biases) that are not simply reducible to, or replaceable by, neural mechanisms *for explaining cognitive phenomena*. The cognitive level has its own "cranes."
      *   **Success Criteria Shift:** Prioritizing predictive power, clinical utility, and internal coherence of the model *at its own level* as primary criteria for funding, alongside (not subordinate to) potential for future multi-level integration or neural grounding. Falsifiability remains key, but the relevant evidence is behavioral/cognitive.
      *   **Rejection of Greedy Reductionism:** Explicitly rejecting the notion that an explanation is only valid if it ultimately references the lowest possible (e.g., synaptic) level. It affirms the reality and explanatory power of the cognitive domain. This does *not* commit to dualism or anti-physicalism; it remains consistent with physicalism while rejecting *explanatory* reductionism.
