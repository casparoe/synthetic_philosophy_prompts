  First, I need to understand their core idea. They suggest that the key factor was identification with their professional role and the correctness of procedures. So, moral responsibility gets shifted to the system. The user wants to know what evidence could defeat this theory. They mentioned looking for decisive versus awkward evidence and how defenders might adjust their theory.

