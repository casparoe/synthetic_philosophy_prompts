answer: |-
  Based on your insightful judgments, the underlying principle governing when to infer belief/institution vs. practical constraint appears to be:  
  **Infer belief or institution when material patterns exhibit *intentional design, coordination, or systemic integration* that exceeds functional necessity or decentralized emergence.** Conversely, favor practical constraint when patterns are *isolated, discontinuous, or mechanically adaptive* without requiring broader cultural coordination.

  This principle accommodates your first four judgments but suggests revising the fifth. Let's break it down:

  ---

  ### **How the Principle Validates Judgments 1-4:**
  1.  **Grave Goods Equality:** Near-perfect equality in a hierarchical society requires *ritual enforcement* (intentional design), exceeding mere economic constraint. The precision signals coordinated belief.
  2.  **Highland Ceremonial Site:** *Systemic integration* is key. The absence of domestic debris implies the site was *designed exclusively* for collective ritual (pilgrimage), not adapted from daily use. Shattered vessels suggest coordinated, non-local practices.
  3.  **Elite Burial with Imports:** Local symbolic arrangement of foreign goods shows *intentional appropriation* (design) to reinforce indigenous authority, rejecting passive assimilation or domination.
  4.  **Standardized Weights Without Script:** Uniformity across dispersed sites implies *centralized coordination* exceeding market emergence. No script rules out merchant-led standardization, pointing to bureaucratic control.

  ---

  ### **The Tension with Judgment 5:**
  **Pottery Style Shift:** While continuity in settlement/population argues against revolution, abrupt stylistic change *could* reflect institutional shifts (e.g., new religious taboos, guild monopolies, or sumptuary laws). Your intuition leans toward practical adaptation, but the principle requires evaluating *integration*:  
  - If the shift is *isolated to pottery* (no linked changes in ritual objects, iconography, or trade networks), practical adaptation (e.g., new kiln tech) is plausible.  
  - If pottery styles are *integrated* with other symbolic systems (e.g., new motifs also appear in temple art or body adornment), institutional change should be considered.  

  **Correction:** Resist inferring *revolution* without broader evidence, but don’t automatically exclude *institutional influence*. The principle predicts:  
  > **Favor practical constraint *only if* the change is mechanistically explainable and lacks coordination with other cultural domains.**  

  ---

  ### **Applying the Principle to Your Unlisted Case:**
  **Scenario:** *Architectural orientation suddenly aligns with solstitial sunrise, while burial, craft, diet, etc., remain unchanged.*  

  **Prediction:**  
  - **Infer practical adaptation or superficial influence, *not* a new cosmology or institution.**  
    - **Why?** The change is *isolated* to architecture and lacks integration with other cultural systems (burial rites, craft symbolism, dietary rituals). Solstitial alignment could result from:  
      - Adopting a foreign building technique for efficiency (e.g., better lighting/insolation).  
      - Elite imitation of distant trends without ideological commitment.  
    - **Contrast with belief/institution:** A cosmological shift would likely leave traces in *multiple* domains (e.g., solstice-aligned graves, ceremonial calendars on pottery, seasonal feasting evidence in diet).  

  **Exception:** If solstitial alignment required *community-wide coordination* (e.g., precise urban grid realignment) or *recurrent ritual use* (e.g., altars oriented to sunrise), it might imply an incipient institution—but unchanged burial/craft practices would still suggest limited societal penetration.

  ---

  ### **Refined Guiding Principle:**
  > **Archaeological patterns express belief or institution when they demonstrate:  
  > (a) *Intentional design* (ritual precision, symbolic arrangement);  
  > (b) *Systemic coordination* (integration across contexts/regions); or  
  > (c) *Investment beyond utility* (effort/resources exceeding practical needs).  
  > Favor practical constraint when changes are *mechanistic, isolated, or discontinuous* with broader cultural systems.**

  This framework maintains the integrity of your first four judgments, refines the fifth, and resolves the solstice alignment case—ensuring your narrative rests on archaeologically coherent inferences. For your novel, this principle allows nuanced societal reconstruction while avoiding over- or under-interpretation of material traces.
