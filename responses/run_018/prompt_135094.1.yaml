prompt: |-
  I've been wrestling with the statue and the clay problem and I think I've landed on a modified constitutionalist position that's a bit weirder than Baker's usual version. On my view, the statue is constitued by the clay but not identical to it — standard enough — but I want to say the statue's persistence conditions depend on tracking both the macro-form and what I'm calling the 'void-structure,' meaning the specific negative spaces, internal hollows, and cavities that are genuinely part of the sculptural form. So if you slowly replace every bit of clay with synthetically identical material but keep all the hollows intact, you've destroyed the original statue because its material-genre changed, even though Lump is also gone since none of the original matter remains. But if you keep the exact same clay and just fill in all the hidden internal cavities so the form collapses, you've destroyed the statue while Lump survives just fine. So constitution needs form-topological continuity plus material-genre stability for the constituted thing, but only spatiotemporal continuity for the constitutor.

  What would count against this? Don't just hit me with the generic 'you're multiplying entities' line — I want the specific defeaters for this void-sensitive, material-genre version. Which cases actually break it? Would a defender have to concede that repairing a hidden internal crack with different-substance filler destroys the statue, and is that an intution we should accept or just bite the bullet on? What about gradual particle-replacement with chemically identical clay — does that preserve material-genre or not, and if not, does that make my view too brittle? Also, is there a serious risk this collapses into four-dimensionalism about statues, or back into standard constitution-with-extra-steps? Rank the problems from fatal (the view is incoherent) to merely awkward (counterintuitive results about museum restoration). And be honest: has this been qualified into unfalsifiability, and if so, is that actually a problem for a metaphysical claim like this?
