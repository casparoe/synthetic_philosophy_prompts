answer: |-
  ### Socially Constructed Kind Decision Procedure (v1.0)

  **Philosophical Grounding:** Based on established distinctions in social ontology, socially constructed kinds depend on collective acceptance/institutions, may involve "looping effects" (classification changing the classified), and persist due to coordination needs, not intrinsic properties. Settled consensus includes:
  1.  Kinds requiring collective recognition (e.g., money) vs. those existing independently (e.g., water).
  2.  Interactive kinds exhibit individual-level looping (e.g., psychiatric diagnoses affecting behavior).
  3.  Stabilized kinds rely on collective belief without direct individual feedback (e.g., some bureaucratic categories).
  4.  Normative residue exists if the kind would re-emerge as a solution to coordination problems post-institution, not just habitual use.

  **Contested Areas (Flag for human review):**
  *   Whether *all* interactive kinds necessarily depend on formal institutions.
  *   Whether economic kinds (like money) involve macro-level looping effects distinct from individual feedback.
  *   Precise boundaries of "collective acceptance" required for minimal existence.

  **Decision Checklist:**

  1.  **Institutional Dependence:** Does this kind fundamentally depend on current human collective acceptance, intentionality, or institutional rules?  
      *   *Sufficient "Yes":* Requires specific social agreement, conventions, or rules to exist *as that kind* (e.g., citizenship, currency, diagnostic criteria).  
      *   *Sufficient "No":* Exists independently of human recognition/convention (e.g., chemical elements, biological species under standard definitions).  
      *   **Stop if "No":** Treat as tracking category. No safeguards.  
      *   **If "Yes" or Uncertain:** Proceed to Q2. *Judgment Call: Distinguishing constitutive rules from mere epistemic access.*

  2.  **Individual Looping:** Does classifying individuals/entities as belonging to this kind reliably change their properties, behavior, self-understanding, or social treatment *because of* the classification itself?  
      *   *Sufficient "Yes":* Evidence of feedback loops (e.g., labeling affects opportunities, identity formation, or performance).  
      *   *Sufficient "No":* Classification tracks pre-existing properties without inducing significant changes *attributable to the label* (e.g., classifying rocks by mineral composition).  
      *   **Stop if "No":** Treat as tracking category. *Likely a stabilized kind without individual feedback.*  
      *   **If "Yes" or Uncertain:** Proceed to Q3. *Judgment Call: Establishing causation (label -> change) vs. correlation.*

  3.  **Counterfactual Dissolution Check:** If all relevant institutional rules/formal classifications vanished tomorrow, would people *still have practical reasons to coordinate* around this kind to solve problems (normative residue)? Or would it primarily fade as an abandoned habit?  
      *   *Sufficient "Coordination Problem":* The kind addresses a persistent human need or social challenge, and coordination around it would likely re-emerge functionally (e.g., money-like systems for exchange, kinship terms for social organization).  
      *   *Sufficient "Fading Habit":* The kind is tightly bound to the specific institutional framework; without it, coordination around *this specific category* lacks strong practical rationale and would likely dissipate.  
      *   **Result if "Coordination Problem":** YES - Apply constructed-kind safeguards (opt-in, sunset, anti-reification).  
      *   **Result if "Fading Habit":** YES - Apply constructed-kind safeguards. *Judgment Call: Assessing underlying human needs vs. institutional artifact.*  
      *   *(Note: Both "Yes" answers trigger safeguards; Q3 clarifies the nature of the construction but doesn't negate it.)*

  **Application:**

  1.  **Proposal: Add "Neurotype" (autistic, allistic, etc.) as mandatory demographic field.**
      *   Q1: **Yes.** "Autistic," "dyspraxic," etc., are diagnostic/social categories dependent on medical/psychological conventions and evolving social recognition.
      *   Q2: **Yes.** Strong evidence of looping: Diagnosis impacts self-identity, access to services/support, societal perception, and potentially behavior (e.g., masking).
      *   Q3: **Coordination Problem.** If institutions vanished, the experiential reality and functional differences associated with neurodivergence would likely persist, creating practical needs for identification and coordination around support, communication styles, and community formation. The *specific labels* might change, but coordination around the underlying kind would re-emerge.
      *   **Result:** YES - Apply constructed-kind safeguards. (Forces opt-in and sunset review, as required by agency rules).

  2.  **Proposal: Add "Central-Bank Digital-Currency Unit" (CBDC) as an economic kind.**
      *   Q1: **Yes.** CBDC existence and definition depend entirely on central bank rules and institutional acceptance.
      *   Q2: **No.** Classification of a transaction unit as CBDC doesn't inherently change the *intrinsic properties* of the digital token or directly loop back to alter individual behavior *because of the label itself* in the same direct way as neurotype. Its value and function derive from institutional backing, not the label changing the user. (Macro-level economic effects are contested; Q2 focuses on individual/entity-level looping).
      *   **Stop at Q2:** Treat as tracking category. Routine hard-coding permitted. (It's a stabilized institutional kind without strong individual looping).

  **Limitations & Borderline Cases:**

  1.  **Misfires:** The procedure may struggle with:
      *   **"Borderline Natural/Social" Kinds (e.g., Race):** Q1 answer can be ambiguous (partially biologically grounded, heavily socially constructed). Q3 ("Coordination Problem" vs. "Fading Habit") is highly contentious.
      *   **Weakly Interactive Kinds:** Where evidence for looping (Q2) is subtle, contested, or emerges slowly.
      *   **Rapidly Evolving Kinds:** Where answers to Q1-Q3 might change significantly within a short time frame, making the snapshot assessment unstable.
      *   **"Habituated Coordination":** Distinguishing deeply ingrained coordination from mere habit in Q3 can be unclear.

  2.  **Unresolved Contested Issues:** The procedure operationalizes settled distinctions but cannot resolve ongoing debates:
      *   Are *all* interactive kinds institutional? (Settled: No. E.g., some gender norms may form pre-institutionally. Contested: Extent).
      *   Do economic kinds involve distinct *macro-level* looping? (Settled: Institutional dependence. Contested: Whether macro-effects constitute "looping" analogous to individual feedback).
      *   The precise threshold of "collective acceptance" needed for Q1.

  This procedure provides a defensible, practically operable filter based on core settled social ontology, forcing safeguards where institutional dependence *and* individual looping are evident, while flagging inherent judgment points.
