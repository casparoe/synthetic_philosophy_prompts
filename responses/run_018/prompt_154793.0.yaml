prompt: |-
  hey, can you grade this? i'm TAing a seminar on forecasting and reference classes.

  question for teh students: apply teh outside view to forecast institutional stability over teh next century for a large federal union with a rotating capital, no standing army, and about 250 years of history. pick reference classes and base rates, then discuss whether inside-view adjustments are legit here or if they break the method.

  student answer (Alex):

  "The outside view means picking the right statistical reference class and ignoring narrative details. The best class is all continental-scale empires—Rome, Qing, Ottoman, British—since they also governed diverse populations over big territories. The base rate for collapse within 100 years after reaching age 250 is about 60%, so that's our prior.

  Then I apply inside-view adjustments: this union has democratic rotation and nuclear deterrence, neither present in teh historical class. Democracy allows peaceful transfer, and nuclear weapons stop external invasions like those that killed Rome and Qing. So I cut teh 60% down to about 25%.

  People mess up by falling for teh planning fallacy—ignoring base rates and telling stories about current crises. Tetlock showed that pure outside-view forecasters beat narrative experts by like 30 points. So if you don't adjust, you should stay near 60%."

  give me a grade (0-10) and point-by-point comments that justify it. start with teh bottom line in teh first sentence, then reasoning, no preamble, and don't restate teh question.
reasoning: |-
  Okay, the user wants me to grade a student's answer about applying the outside view to forecast institutional stability. The scenario involves a large federal union with a rotating capital, no standing army, and 250 years of history. The student, Alex, used empires like Rome, Qing, Ottoman, and British as reference classes, gave a base rate of 60% collapse within 100 years after reaching age 250, then adjusted down to 25% due to democratic rotation and nuclear deterrence. He also mentioned Tetlock's research on outside-view forecasting superiority.

  First, I need to evaluate Alex's application of the outside view. He correctly identifies the core idea: selecting a statistical reference class and ignoring narrative details. The choice of continental-scale empires seems reasonable since they share similarities in governance diversity and territorial size. However, the base rate of 60% collapse isn't sourced. Where did that number come from? As a TA, I should note that students need to justify such figures. Without a citation or methodology, it's hard to verify.

  Next, Alex adjusts the base rate using inside-view factors: democratic rotation and nuclear deterrence. But the outside view typically discourages adjustments unless they're quantifiable or based on reference class subsets. Alex reduces the probability to 25% without explaining how he quantified the impact. This seems arbitrary. Also, democratic rotation and nuclear weapons are unique to this union and absent in the historical reference class. While they might be relevant, Alex doesn't provide evidence that these factors actually reduce collapse risk. For example, are there democracies in history that lasted longer? Nuclear deterrence preventing invasions is a valid point, but internal stability issues could still cause collapse. Alex overlooks that.

  He references Tetlock's research correctly, showing that outside-view forecasters outperform narrative experts. That's a strong point. However, Alex criticizes the planning fallacy but then makes the same mistake by adjusting based on unquantified inside factors. That's inconsistent. The planning fallacy involves ignoring base rates for optimistic stories, which is exactly what Alex does when he lowers the probability to 25% without solid evidence.

  The student's answer has strengths: correct identification of the outside view, a reasonable reference class, and accurate mention of Tetlock's findings. But the weaknesses are significant: unsourced base rate, improper adjustments, and inconsistency in applying the method. The adjustment breaks the outside view because the factors aren't part of the reference class and aren't quantified. 

  For grading, I'll consider both accuracy and adherence to the methodology. A 7/10 seems fair. Strong on concepts but weak on execution, especially adjustments. The grade reflects understanding the framework but failing in proper application.
answer: |-
  **Grade: 7/10**

  1.  **Correct Core Concept & Reference Class:** Alex correctly identifies the core tenet of the outside view (statistical reference class over narrative) and selects a generally appropriate high-level reference class (continental-scale empires) matching scale and governance complexity.
  2.  **Unsubstantiated Base Rate:** The base rate of "60% collapse within 100 years after reaching age 250" is asserted without any source, methodology, or evidence. Did Alex calculate this from the listed empires? How? This crucial step lacks rigor and undermines the foundation of the outside view estimate.
  3.  **Problematic Adjustments:** The inside-view adjustments (democratic rotation, nuclear deterrence) are precisely the *kind* of adjustments that often "break" the outside view. Alex acknowledges these factors are absent in the reference class, making the adjustment speculative and unquantifiable. Reducing 60% to 25% is arbitrary and introduces significant subjectivity/optimism bias.
  4.  **Valid Critique of Planning Fallacy:** Alex correctly identifies the planning fallacy as a common error and appropriately cites Tetlock's findings on the superiority of base-rate focused forecasting. This shows good understanding of the pitfalls.
  5.  **Inconsistency & Breaking the Method:** Alex's critique of ignoring base rates is valid, but then immediately violates this principle by making large, unsupported adjustments based on unique modern factors. The adjustments rely on narrative ("peaceful transfer," "stop external invasions") rather than statistical evidence from *relevant* subsets (e.g., long-lived democracies, nuclear-armed states). This significantly breaks the discipline of the outside view.
  6.  **Missed Opportunity for Better Reference Classes:** While the chosen class is okay, Alex doesn't consider refining it (e.g., modern federal states, long-lived democracies post-1800) or acknowledge the challenge of finding truly comparable cases for a unique modern entity, which is a key part of the exercise.
  7.  **Strengths Outweighed by Critical Flaw:** The answer demonstrates understanding of the outside view concept, the planning fallacy, and Tetlock's work. However, the unsubstantiated base rate combined with large, unsupported, narrative-driven adjustments that contradict the stated need to "ignore narrative details" constitutes a major flaw in application, preventing a higher grade.
