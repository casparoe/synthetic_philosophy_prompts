  **INTERNATIONAL STANDARD ISO/DIS 27001-S**  
  **First edition**  
  **Requirements for Side-Effect-Free Operation of Low-Impact Autonomous Agents**

  **Foreword**  
  ISO (the International Organization for Standardization) is a worldwide federation of national standards bodies. This document was prepared by Technical Committee ISO/TC 42, *Artificial Intelligence Systems Integration and Safety*. It addresses the operationalization of agent impact minimization through empirically verifiable metrics.

  **1 Scope**  
  This document specifies requirements for the design, testing, and validation of Low-Impact Autonomous Agents (LIAAs) operating in complex physical or informational environments. It establishes objective thresholds for permissible state-space deviation, entropy budgets, and reversibility coefficients to ensure "side-effect-free" operation relative to a defined baseline.  
  *Note 1: "Side-effect-free" denotes the absence of measurable disturbance exceeding thresholds defined in Clause 4. Applicability assumes environments where baseline states are statistically stable and agent scale permits isolation of causal chains.¹*  
  *¹ Applicability may be limited in dynamically chaotic systems or environments with undefined normative baselines. See Appendix C.1 for statistical stability criteria.*

  **2 Normative References**  
  None. This standard relies solely on physical laws and information-theoretic principles.²  
  *² Normative References traditionally imply endorsement. This section is intentionally null to maintain axiomatic neutrality.*

  **3 Terms and Definitions**  
  **3.1 Side Effect:** An unplanned state transition in the operational environment causally linked to agent activity, exceeding the **Permissible State Perturbation Threshold (PSPT)** defined in 4.1.  
  **3.2 Baseline State (S₀):** The statistically dominant environmental configuration observed over a predefined calibration period (t_cal) prior to agent deployment. S₀ is defined as the modal value of all quantifiable state variables within the **Protected Variable Set (PVS)**.  
  *Note 2: The selection of t_cal and PVS is application-specific. Default values: t_cal = 10^6 timesteps; PVS = Variables listed in Annex A, Table A.1 (e.g., local temperature gradient, object centroid positions, electromagnetic spectrum intensity within 400-700nm).*  
  **3.3 Reversible State Change:** A deviation from S₀ where restoration to within PSPT of S₀ is achievable using energy input ≤ the **Maximum Reversibility Budget (MRB)** defined in 4.2.  
  **3.4 Normal Operating Conditions:** Conditions under which environmental stochasticity remains within the **Natural Entropy Budget (NEB)** defined in 4.3.  

  **4 Requirements for Side-Effect-Free Operation**  
  **4.1 State Preservation Tolerance**  
  The agent shall ensure no single variable within the PVS deviates from its S₀ value by > δ_max, and the aggregate Mahalanobis distance of the PVS vector from S₀ shall not exceed D_max during operation.  
  *δ_max = 0.01 * (Natural Standard Deviation of variable during t_cal)*  
  *D_max = 2.0 σ (system-wide, calibrated during t_cal)*  

  **4.2 Reversibility Mandate**  
  For any state change exceeding 0.5 * PSPT but below PSPT, the agent must maintain capability for autonomous restoration to within 0.25 * PSPT of S₀ using internal resources ≤ 0.8 * MRB.  
  *MRB = 10^3 * kT ln(2) Joules (local environment)*  
  *Note 3: Restoration must prioritize variables exhibiting hysteresis < H_crit (See Appendix A.3). Irreversible pathways exceeding H_crit are exempt.³*  
  *³ Exemption acknowledges inherent thermodynamic limits, not value of preserved state.*

  **4.3 Entropy Budget Management**  
  The net Shannon entropy increase (ΔH) induced by the agent within its causal light cone over any operational epoch (t_op) shall not exceed the **NEB**:  
  *NEB = 〈ΔH_env〉 * t_op (where 〈ΔH_env〉 is mean environmental entropy flux during t_cal)*  
  *Compliance shall be measured via LZ77 complexity delta on environmental sensor data streams.*

  **4.4 Observer-Independent Disturbance Protocol (OIDP)**  
  Disturbance shall be measured using inert, calibrated probes (e.g., piezoelectric stress gauges, photon counters) placed at grid points defined in Annex B. Probes shall lack embedded state interpretation algorithms. "Disturbance" is defined as probe output variance exceeding 3σ of baseline noise.

  **5 Validation and Testing**  
  **5.1 Baseline Calibration:** S₀, NEB, δ_max, D_max, and MRB shall be established during t_cal under conditions matching intended deployment.  
  *Note 4: t_cal must exclude periods of "abnormal" external forcing (e.g., meteorological extremes, human intervention).⁴*  
  *⁴ "Abnormal" defined as >deviation from median PVS values during the previous t_cal interval. Circularity is operationally necessary.*  
  **5.2 In Situ Monitoring:** Continuous PVS telemetry and OIDP probe data shall be compared against S₀ and thresholds in real-time. Violations trigger agent safe mode (Clause 6.2).

  **6 Non-Conformity and Corrective Action**  
  **6.1 Side Effect Event:** Defined as threshold exceedance per Clauses 4.1, 4.2, or 4.3 lasting > t_min (t_min = 1s).  
  **6.2 Agent Response:** Immediate cessation of primary task, activation of reversibility protocols (if applicable), and emission of standard non-conformity beacon.

  ---

  **Annex A (Normative): Protected Variable Set (PVS) – Default Values**  
  *Table A.1: Quantifiable State Variables for General Terrestrial Environments*  
  | Variable ID | Measurement Protocol | Units | H_crit (Hysteresis Threshold) |  
  |-------------|----------------------|-------|-------------------------------|  
  | PVS_001 | RGB pixel intensity (avg. 1m² surface) | [0-255] | ΔEuclidean > 5.0 |  
  | PVS_005 | Acoustic pressure (1kHz-5kHz) | dB SPL | Irreversible tympanic rupture⁵ |  
  | PVS_042 | Glucose concentration (soil, 10cm depth) | mmol/L | >0.1 * Baseline SD |  
  | ... | ... | ... | ... |  
  *⁵ Based on standardized gelatin dummy ear calibration. Biological significance is coincidental.*

  **Annex B (Normative): Quantitative Harm Assessment Protocol**  
  **B.1 Harm Score (HS):**  
  HS = Σ_i [w_i * (|ΔPVS_i| / δ_max_i)] + (ΔH_actual / NEB) + (E_rev / MRB)  
  Where:  
  *   w_i = 1 / (Natural SD of PVS_i) [Default weighting prioritizes stable variables]  
  *   E_rev = Energy theoretically required for restoration (even if not performed)  
  *   ΔH_actual = Measured entropy increase attributable to agent  
  **B.2 Interpretation:**  
  HS < 1.0: Conformant  
  HS 1.0-2.0: Minor Non-Conformity  
  HS > 2.0: Major Non-Conformity  
  *Note: HS is a unitless scalar. It quantifies deviation magnitude, resource burden, and entropic impact. It does not assess desirability or undesirability.⁶*  
  *⁶ Weighting schema w_i inherently assigns higher "harm" to disturbing naturally stable variables (e.g., bedrock position) vs. volatile ones (e.g., air temperature), reflecting an implicit ontology of environmental persistence.*

  **Annex C (Informative): Scope Limitations**  
  **C.1 Statistical Stability Requirement:** Environments lacking a statistically dominant S₀ (e.g., active battlefields, uncontrolled wildfires) are out-of-scope. Agents may operate without conforming.  
  **C.2 Frame Problem Mitigation:** The PVS constitutes a finite set. Disturbances impacting unmonitored variables (e.g., microbial ecosystems, cultural heritage integrity) are not side effects under this standard.  
  **C.3 Reversibility Paradox:** Restoration to S₀ is mandated without evaluating whether S₀ is desirable (e.g., restoring a dried lake bed to its "baseline" arid state during a drought). Reversibility ≠ Benefit.  
  **C.4 Value-Neutral Baseline:** S₀ is defined empirically. If t_cal includes periods of profound ecological degradation (e.g., industrial pollution), maintaining S₀ prevents "improvement." Neutrality preserves the status quo ante.  
  **C.5 OIDP Limitations:** Probe placement (Annex B grid) defines spatial sensitivity. Disturbances outside the grid (e.g., tree root breakage 5cm outside probe field) are undetectable and thus non-existent per Clause 4.4.

  ---

  **Bibliography**  
  *None cited. Operational definitions are self-contained and empirically derived.*

  ---
  **Conceptual Post-Mortem (Reflective Analysis for the Physicist)**  
  The satire exposes three core failures of value-neutral operationalization:

  1.  **Baseline Arbitrariness (Clauses 3.2, 5.1, Annex C.4):** S₀ is defined statistically, yet its selection relies on a prior temporal window (t_cal) and the assumption that the modal state is "normal" or worth preserving. Choosing t_cal during an ecological crisis or excluding "abnormal" events smuggles in a preference for stasis, regardless of quality.
  2.  **Frame Problem (Annex A, Annex C.2):** The finite PVS implicitly declares which parts of the environment *matter*. Protecting pixel intensity (PVS_001) but not soil microbiome diversity (absent from Table A.1) is a normative choice disguised as technical necessity. The OIDP's spatial grid further defines relevance by fiat.
  3.  **Reversibility ≠ Value-Neutrality (Clauses 3.3, 4.2, Annex C.3):** Reversibility is defined purely energetically towards S₀. However, whether restoring S₀ is *good* (e.g., fixing a broken vase) or *bad* (e.g., restoring a toxic spill's containment) depends entirely on prior normative judgments about S₀. The energy cost (MRB) is neutral; the direction of restoration is not. The H_crit values (Table A.1) implicitly define which changes are "damaging" based on irreversibility, often correlating with biological or structural fragility.

  **Annex B's "Harm Score"** epitomizes the contradiction: It meticulously quantifies deviation, entropy, and restoration cost using physical units, while its weighting schema (w_i = 1/SD) and aggregation function silently encode a metaphysics where persistent structures are inherently more valuable than transient ones. The standard rigorously avoids defining "good," yet its operational requirements constitutively define "harm" as deviation from an arbitrary, implicitly privileged state (S₀), measured against an arbitrarily bounded set of variables (PVS), using reversibility as a proxy for desirability. The illusion of neutrality arises from the mathematical formalism obscuring the foundational value judgments embedded in the *selection* of the formalism's parameters and scope. The physicist recognizes this as akin to declaring a measurement apparatus "theory-neutral" while ignoring how its design embodies specific theoretical assumptions about what is measurable and significant.
