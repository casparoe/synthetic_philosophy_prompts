answer: |-
  Rousseau's mechanism in the *Letter to d'Alembert* is a sophisticated critique of simulated virtue, distinct from both "moral licensing" and "vicarious emotional consumption" while sharing affinities with both. Let's dissect it step by step:

  1.  **The Core Mechanism: Substitution and Self-Deception**
      *   Rousseau argues that theatrical representation creates a **self-contained moral simulation**. The spectator experiences powerful emotions (pity, indignation, admiration) provoked by the dramatic illusion.
      *   Crucially, this emotional arousal *feels like* moral engagement (e.g., weeping for the innocent victim feels like compassion). However, it occurs within a context utterly divorced from the demands of real action, risk, or sacrifice.
      *   The spectator **mistakes the emotional experience *for* the moral act itself.** Weeping *at the fiction* is confused with acting *in reality*. Applause for fictional virtue is confused with practicing real virtue.
      *   This leads to **self-deception:** The spectator emerges believing they *have* been virtuous ("I felt deeply, therefore I *am* good"). The emotional expenditure (tears, sympathetic anguish, applause) is psychologically registered as **payment rendered to virtue**, discharging any sense of obligation or guilt without requiring actual moral effort in the world.
      *   **Result:** A sense of complacency and subtle indulgence. Having "paid" with emotion in the safe space of the theater, the spectator feels absolved, less motivated to act virtuously (or confront their own vices) in real life. The theater provides the *appearance* and *sensation* of virtue without its substance or cost.

  2.  **Comparison to Proposed Analogies:**
      *   **Moral Licensing (Partial Overlap, Key Difference):** Both involve a prior "good" act permitting a subsequent transgression. However, moral licensing typically involves a *real* (though often minor or symbolic) positive action (e.g., donating to charity, buying eco-friendly) enabling later indulgence. Rousseau's mechanism is more insidious: **the "good" act is illusory.** The spectator hasn't actually *done* anything virtuous; they've only *felt* virtuous emotions directed at a fiction. The "licensing" stems from the *misperception* of having fulfilled a moral duty. The discharge is of an *imagined* debt.
      *   **Vicarious Emotional Consumption (Stronger Analogy, Different Emphasis):** This captures the *consumption* aspect well – the spectator consumes emotional experiences (pity, indignation) as a form of gratification. Rousseau would emphatically agree. However, his unique emphasis is on the **moral consequence of this consumption:** the self-deceptive belief that consuming the emotion *is* practicing the virtue, leading to moral complacency. It's not just emotional tourism; it's virtue tourism with dangerous real-world consequences for character.

  3.  **Dependence on the Broader Anthropology of Corruption?**
      *   **Operates Independently, Gains Potency from the Anthropology:** The core mechanism – mistaking emotional arousal for fiction as moral action and experiencing complacency – could theoretically function even without Rousseau's specific theory of natural pity corrupted by *amour-propre*. One could imagine a spectator simply enjoying the emotional ride and feeling satisfied.
      *   **However, Rousseau's anthropology *explains why* the mechanism is so potent and universal in society:** He argues natural pity (*pitié*) is the seed of all social virtue. In the corrupt social state, dominated by inflamed *amour-propre* (vanity, comparative self-love), genuine pity is suppressed or distorted. The theater *exploits* this suppressed pity. It provides a safe, socially sanctioned outlet for these feelings *without* the risks associated with real compassion (sacrifice of time, resources, social standing, or confronting injustice). The theater thus becomes a **corrupted substitute** for genuine moral sentiment, perfectly tailored to the diseased social condition. It doesn't just fail to cultivate virtue; it actively *perverts* the natural inclination towards pity by satisfying it in a harmless, self-congratulatory way. The mechanism is amplified by societal corruption but doesn't strictly require it for its basic operation.

  4.  **Extension to Modern Immersive Media: Does the Critique Grow Stronger or Collapse?**
      *   **The Critique Grows Stronger:** Modern immersive media (VR narratives, complex interactive games, deeply engaging films/series) represent the *apotheosis* of Rousseau's feared simulation, making his critique more relevant, not less.
          *   **Enhanced Illusion:** Immersion breaks down the "fourth wall" far more effectively than the 18th-century stage. The user isn't just a spectator; they are often an embodied *participant* within the fictional world, intensifying the illusion of real moral agency and emotional investment.
          *   **Reduced Critical Distance:** The sheer sensory and narrative power makes the distinction between representation and reality *feel* more permeable during the experience, deepening the potential for self-deception ("I *was* there, I *felt* it").
          *   **Bodily Risk Still Absent:** Crucially, Rousseau's core objection – the complete absence of *real bodily risk and genuine sacrifice* – remains fundamentally unchanged. No matter how immersive, clicking a button, moving a joystick, or feeling empathy in a VR headset carries no *actual* cost. You cannot starve, be imprisoned, lose social standing, or genuinely suffer for a virtual choice.
          *   **Intensified Complacency:** The heightened emotional engagement and sense of participation could lead to an even *stronger* sense of having "done the work" of virtue, potentially leading to greater complacency or a more profound sense of moral exhaustion ("I've already solved so many dilemmas in that game, I can't deal with this real one").
      *   **The Boundary Hasn't Fundamentally Changed:** While the *experience* of the boundary is more fluid in immersion, the ontological boundary – representation vs. action, simulation vs. consequence – is absolute. Rousseau's critique hinges on this *ontological* gap, not the *phenomenological* one. The modern user, like the 18th-century spectator, risks mistaking costly simulation for cost-bearing virtue.

  5.  **The Resource Question: Depletion vs. Self-Deception?**
      *   Rousseau **does not primarily rely on a model of a single, depletable resource** (like a finite reservoir of compassion or willpower). His explanation is fundamentally one of **self-deception and misdirection.**
      *   **Why Spectators Fail to Act:**
          *   **Mistaken Satisfaction:** They believe their emotional expenditure *was* the moral action itself; the "debt" is paid.
          *   **Absence of Real Stimulus:** The theater provides a powerful, *artificial* stimulus for pity/indignation, but upon exiting, the real world lacks the same intense, focused, dramatically packaged injustices. Real suffering is often messy, ambiguous, and demanding of complex, ongoing effort – not neatly resolved in three acts.
          *   **Indulgence of Self-Love:** The theater flatters *amour-propre*. Weeping for Hecuba allows us to admire our own sensitive souls. This self-congratulation displaces the critical self-examination that might lead to reforming one's *own* vices.
          *   **Habitual Passivity:** Theater trains spectatorship, not agency. It reinforces the habit of experiencing strong emotions *without* the corresponding imperative to act.
      *   **Exhaustion as Symptom, Not Cause:** While Rousseau might acknowledge that intense emotional arousal *can* lead to a feeling of exhaustion ("the soul is exhausted"), this is presented more as a reinforcing *symptom* of the experience ("see how moved I was? I'm spent!") that bolsters the self-deception, rather than the *primary cause* of inaction. The core cause is the structural substitution and the resulting complacency.

  **In Summary:**

  Rousseau describes a mechanism of **virtue substitution via emotional simulation**, leading to **moral self-deception and complacency.** The spectator mistakes tears and applause *at a fiction* for the practice of virtue *in reality*, feeling absolved of further obligation. While exploiting the corruption of natural pity in society, this mechanism could function independently as a form of profound self-deception enabled by representation. Modern immersive media intensify the illusion of participation without eliminating the fundamental absence of real risk and cost, making Rousseau's critique arguably *stronger*. His explanation centers on cognitive error (mistaking feeling for action) and the flattery of self-love, not the depletion of a finite moral resource. The failure to act stems from the satisfaction of a falsely discharged obligation and the passivity inherent in spectatorship.
