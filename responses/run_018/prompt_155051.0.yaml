  ### Decision-Tree Taxonomy for Interpretations of Zhuangzi's Butterfly Dream

  **Root Node**: Does the butterfly dream episode primarily function as a **skeptical argument against certainty in waking life** (e.g., questioning whether we can prove we're not dreaming now), or as a **performative demonstration of transformation (wuhua)** that erases the line between debating reality and living it?  
  - **Branch A**: Skeptical argument (propositional).  
  - **Branch B**: Performative enactment of transformation.  

  #### For Branch A (Skeptical Argument):
  **Node 1**: Does metamorphosis between Zhuang Zhou and the butterfly imply that both states are **equally real** (ontological parity), that we **can't reliably distinguish** them (epistemic limit), or that **"reality" is an empty concept** (dissolution of substrate)?  
  - **Branch A1**: Both states equally real (ontological equality).  
  - **Branch A2**: Cannot distinguish states (epistemic limit).  
  - **Branch A3**: Reality-substrate dissolved (dissolution).  

  **Node 2 (for A1/A2/A3)**: Is personal identity preserved across the transformation?  
  - **Branch A1a/A2a/A3a**: Identity preserved (e.g., hidden essence).  
  - **Branch A1b/A2b/A3b**: Identity is discontinuous (serial selves).  
  - **Branch A1c/A2c/A3c**: Identity indeterminate (no fact of the matter).  

  **Node 3 (for A1/A2/A3)**: What is the best response?  
  - **Branch A1d/A2d/A3d**: Epistemic suspension (withhold judgment).  
  - **Branch A1e/A2e/A3e**: Aesthetic play (embrace change joyfully).  
  - **Branch A1f/A2f/A3f**: Ethical detachment (release fixed self).  

  #### For Branch B (Performative Enactment):
  *Identical branching to Branch A from Node 1 onward.*  

