  On Hofstadter vs friction inversion: His satire primarily works through cognitive dissonance and visibility. By making the invisible bias suddenly glaring via absurdity, it attacks the "normalcy" of male-default terms. But does that directly create social friction? Not immediately - the piece itself might just provoke uncomfortable chuckles or defensive reactions. Friction inversion requires broader societal uptake where not using "they/them" for someone actually feels ruder than adjusting. That needs repeated exposure and normalization Hofstadter's one-off piece can't achieve.

