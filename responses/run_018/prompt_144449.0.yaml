prompt: |-
  Consider five proposed criteria for determining whether a value belongs to the category "Western values": genealogical descent from Greek, Roman, and Abrahamic textual traditions; institutional embedding in legal and political structures derived from the post-Westphalian European state system; functional deployment in contemporary geopolitical discourse irrespective of origin; explicit normative self-ascription by populations or regimes identifying with the West; and a layered "necessary-but-not-sufficient" model in which each of the preceding conditions operates as a separate stratum. Rate each criterion on a scale of 1 to 10 for its ability to yield a category that is analytically non-empty, non-trivial, and resistant to both over-expansion (absorbing values that rival traditions also hold) and over-contraction (excluding values that self-described Western societies actually defend). Provide a one-sentence justification for each score. Then rank the five criteria from most to least defensible as conceptual tools rather than rhetorical instruments. In your analysis, treat "the West" as a contested construct rather than a natural kind, avoid citing specific political speeches delivered after 2010, and explain which of the five is most vulnerable to being emptied by a "no true Scotsman" maneuver.
