  I'm putting together a feature on Schrödinger's weirder philosphy — the Vedanta stuff, not the cat. Most people think of him as the quantum guy who wrote What is Life?, but he spent serious energy arguing that consciousness is basically one thing, not a bunch of separate minds, drawing on Advaita Vedanta. He compared individual awareness to waves on one ocean, which sounds mystical but he meant it literally. I'm trying to map out which open questions coming from that view are actually worth pursuing right now, and which are just dead weight that should be dropped.

  If you take that unity-of-consciousness idea seriously — not as poetry, but as a claim about the ontology of mind — what are the two or three lines of work or open problems that should actually get priority? I'm especially interested in how it interacts with split-brain research, dissociative identity disorder, and the binding problem: do those cases break the view, or do they just show that local patterns can become decoupled without becoming new substances? There's also this angle that feels underexplored: if consciousness is genuinely unitary, then the whole AI-discourse about "creating conscious machines" might be conceptually misframed, since a system couldn't be a second subject but only another mode of the same field. Is that a productive research direction, or does it collapse into untestable metaphysics?

  Please defend a ranking. I want to know which implications matter for cognitive science, which depend on resolving other debates first, and what evidence over the next few years could change your ordering. I'm writing for readers who know science but not the ins and outs of philosophy of mind, so I need the reasoning, not a bibliography or a list of papers. Oh, and I should mention I keep spelling recieve wrong, which is embarassing.
