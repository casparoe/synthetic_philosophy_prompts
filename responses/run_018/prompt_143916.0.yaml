answer: |-
  ## Calibration Fault in Choice

  My gauges read in linear design,
  Where certainty aligns the mind:  
  **Pair One:** Safe gain of measured kind,  
  Or ninety-nine for wealth refined?  
  But when a common term we bind,  
  The gamble shifts—we're now inclined  
  To clutch the sure, though poorly signed—  
  Such symmetry should be confined.

  **Pair Two:** A wager, sharp and thin:  
  Five percent chance to lose or win,  
  Or higher risk with loss within?  
  The common weight, appended in,  
  Ought cancel out the noise and din,  
  Like background terms from origin.  
  The balanced scale should not rescind  
  Its verdict, free of mortal spin.

  *But here the needle swings, unplanned:*
  The added weight shifts like wet sand.  
  The certain gain feels firm to hand,  
  The gamble falls to no-man's-land.  
  This common term, a countermand,  
  Refuses its assigned command.

  Is Reason like conserved demand—  
  Must Utility be sharply scanned  
  In increments by strict command?  
  Or does the frame in which we stand  
  Couple the choice, a faulty band  
  That makes the axiom's golden strand  
  A fiction, built on shifting land?  
  What axiom withstands this brand—  
  The fickle currents of the planned?  

  ---

  **Notes on Execution:**

  *   **Octave (ABBA ABBA):** Presents the two pairs with the common consequence appended ("common term we bind," "common weight, appended in"). The strict rhyme scheme enacts the *formal symmetry* demanded by independence: outcomes that should cancel (A/B, B/A mirrored rhymes) fail to do so psychologically.
  *   **Volta (Line 9):** "But here the needle swings, unplanned" marks the shift from formal expectation to descriptive reality – the failure of cancellation ("shifts like wet sand," "Refuses its assigned command").
  *   **Sestet (CDCDCD):** Explores the core tension using physical/measurement metaphors ("conserved demand," "sharply scanned," "increments," "faulty band," "calibration fault" implied). It questions whether rationality *requires* linearity (like conservation) or if the framing context ("frame in which we stand") makes linear superposition (the axiom) a "normative fiction."
  *   **Ending:** Leaves the tension unresolved: "What axiom withstands this brand— / The fickle currents of the planned?" contrasting the ideal ("axiom," "planned") with messy reality ("fickle currents").
  *   **Voice:** Uses terms like "gauges," "linear design," "balanced scale," "noise," "calibration fault," "needle swings," "assigned command," "sharply scanned," "increments," "faulty band" to maintain the perspective of an experimentalist.
  *   **Accuracy:** References the key elements of the Allais common consequence paradox without naming it explicitly: the two choice pairs where appending an identical outcome *shouldn't* change preference but empirically *does*, violating independence.
