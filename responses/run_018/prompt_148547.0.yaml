  First, I need to identify the core conflict: teleosemantics grounds content in evolutionary history (selected proper function) while causal-role theories focus on current internal functional architecture. The user suspects this might be a verbal or framing disagreement rather than substantive.

  The friend's position is clear: misrepresentation occurs when a mechanism fails its evolutionarily selected purpose. The user counters that causal-role theories can define error through current-system functional breakdown without historical baggage. 

  I notice both sides acknowledge the possibility of error - they just locate the normativity differently. The evolutionary history versus current architecture distinction seems fundamental here. 

