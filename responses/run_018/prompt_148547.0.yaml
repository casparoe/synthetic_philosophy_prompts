prompt: |-
  I have just finished a long and circular argument with a friend about whether teleosemantics genuinely resolves misrepresentation or merely pushes the normative problem back into evolutionary history. She defends the view that a representation’s content is fixed by its selected proper function, so error is possible only when a mechanism fails to perform what it was selected for; I reply that any causal-role theory can build in normative failure conditions through internal functional breakdown, and that evolutionary history adds nothing except an external narrative. We kept repeating ourselves, and I suspect the stall is not about evidence but about the kind of disagreement we are having—substantive, verbal, or a case of answering different questions under the single label “naturalizing content.” I also wonder whether the dispute is empirically empty, since both frameworks can be technically extended to cover even a hypothetical synthetic organism engineered with no evolutionary past but an identical internal causal-role architecture, leaving no observation to choose between them. Diagnose the structure of this disagreement using what each side actually says about proper function versus causal-role determination, indicate whether a hidden empirical question is doing the work, and say what—if anything—would constitute progress: a conceptual distinction, a redesigned thought experiment, or an argument that the framing is ill-posed. Give your response as exactly five numbered items, each consisting of one or two sentences, with no introduction and no conclusion.
