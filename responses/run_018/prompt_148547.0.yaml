answer: |-
  1. The core disagreement concerns whether normativity (proper function) must be grounded in external evolutionary history (your friend's teleosemantic view) or can arise from internal causal-role organization alone (your causal-role view), as both positions define "error" relative to a normative standard of proper functioning.  
  2. Your friend insists evolutionary selection fixes the *specific* normative content (e.g., "fly" not "small dark speck") by specifying the historically selected response, while you argue causal-role theories can define norms via idealized system function without needing historical facts.  
  3. The synthetic organism case reveals the dispute is empirically empty: both theories can explain identical behavior and internal "error" states, as teleosemantics can assign selection history by design analogy and causal-role theories define norms synchronically.  
  4. Progress lies in conceptual clarification: distinguishing whether "naturalizing content" requires grounding norms in mind-independent historical facts (teleosemantics) or finds internal functional norms sufficient (causal-role), making the conflict about theoretical goals, not evidence.  
  5. Resolving the stall requires reframing: argue that teleosemantics conflates content with etiological explanation, while causal-role theories address content constitution directly via current causal powers, making the evolutionary narrative explanatory but not constitutive.
