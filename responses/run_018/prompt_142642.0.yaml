  I'm drafting a proposal for a four-month independent-study fellowship on eliciting latent knowledge from AI systems. The half-formed idea is this: current elicitation methods are usually evaluated against ground-truth labels the evaluator already knows, but this presupposes that the "latent" content is a determinate belief-like state rather than a distributed pattern that only acquires semantic content through the elicitation interaction itself. I want to ask whether the concept of "latent knowledge" can be made coherent without smuggling in an interpretivist or intentional-stance framework that conflicts with the mechanistic assumptions used to motivate the safety project. Turn this into a proposal with: (1) a precisely stated question answerable in four months without running experiments; (2) why the existing technical and philosophical literature leaves this tension open; (3) the conceptual method—what distinctions I'd draw, which analogies or formal models I'd construct, and why a philosophical rather than empirical study makes progress; (4) what a result looks like (e.g., a taxonomy of coherence conditions for attribution) and what counts as failure; (5) an honest scope assessment, including what must be left out. Please separate what is settled in the philosophy of mind and AI safety literature from what is genuinely contested, and do not present a contested view—such as that large language models literally possess beliefs—as the consensus.
reasoning: |-
  We are drafting a proposal for a four-month independent-study fellowship. The core tension: current methods for eliciting latent knowledge in AI systems are evaluated against known ground-truth labels, which assumes that the latent content is a pre-existing, determinate belief-like state. But what if the "latent knowledge" is actually a distributed pattern that only acquires semantic content through the elicitation process? We want to ask whether the concept of "latent knowledge" can be made coherent without smuggling in an interpretivist or intentional stance that conflicts with mechanistic assumptions.

  We need:

  1. A precisely stated question answerable in four months without running experiments.
  2. Why existing literature leaves this tension open.
  3. Conceptual method: distinctions, analogies, formal models, and why philosophical study is appropriate.
  4. What a result looks like and what counts as failure.
  5. Honest scope assessment.

  We must separate settled views from contested ones and avoid presenting contested views (like LLMs having literal beliefs) as consensus.

  Let me structure the proposal accordingly.

  ---

  **Proposal: Coherence Conditions for Attributing Latent Knowledge in AI Systems**

  **1. Core Question**

  Can the concept of "latent knowledge" in AI systems be coherently defined without presupposing an interpretivist framework (i.e., without relying on the intentional stance) and while remaining consistent with mechanistic descriptions of AI systems? Specifically, we seek to establish necessary conditions under which an attribution of latent knowledge is coherent, such that it does not collapse into either:

  (a) A trivial claim about the system’s ability to produce outputs that match some external standard (which may be an artifact of the elicitation method), or  
  (b) An ascription of internal, belief-like states that are incompatible with the system’s actual mechanistic structure (e.g., distributed, non-symbolic representations in neural networks).

  **2. Why the Tension Remains Open in Existing Literature**

  * **Technical AI Safety Literature:** 
    - *Settled:* Current methods (e.g., activation patching, contrast-consistent search, linear probes) are evaluated by comparing elicited outputs to ground-truth labels. This assumes the latent variable being elicited is both (i) present in the system and (ii) semantically aligned with the evaluator’s labels. 
    - *Contested/Open:* Whether these methods reveal pre-existing "knowledge" or create the appearance of knowledge through the interaction. For instance, the debate around whether linear probes "create" or "discover" features (e.g., Elhage et al. 2022) highlights this tension. Moreover, the field lacks formal criteria for when an elicited pattern should count as "knowledge" in the absence of ground truth.

  * **Philosophy of Mind and Science:**
    - *Settled:* In philosophy of science, instrumentalism (vs. realism) debates show that the same data can be explained by multiple ontologies. In philosophy of mind, functionalism allows for multiple realizability, but the status of non-human systems (like neural networks) as having genuine mental states is contested.
    - *Contested:* 
      - Whether "knowledge" requires a representational architecture (e.g., Fodor’s language of thought) or can be fully explained by dispositional properties (e.g., behaviorist or enactivist views). 
      - The legitimacy of the intentional stance (Dennett) vs. eliminative materialism (Churchland) in explaining complex systems. 
      - Whether distributed representations (as in neural networks) can legitimately be said to "contain" determinate semantic content prior to an interaction.

  * **Gap:** Neither field resolves the tension for AI safety because:
    1. Technical work often implicitly adopts an intentional stance for practical purposes without justifying its coherence mechanistically.
    2. Philosophical debates rarely engage with the specific architecture of modern AI systems (e.g., high-dimensional vector spaces, transformer dynamics).

  **3. Conceptual Method**

  We will pursue a conceptual analysis that:

  * **Distinctions:**
    - *Elicitation-dependent vs. Elicitation-independent content:* Does the "knowledge" exist prior to the elicitation method, or is it constituted by it?
    - *Correlational vs. Causal role:* Is the pattern merely correlated with the target variable (e.g., via supervised training) or does it play a causal role in the system’s functionality?
    - *Narrow vs. Wide Content:* Does the content depend solely on the system’s internal state (narrow) or also on external factors (wide)?

  * **Analogies and Formal Models:**
    - *Analogy 1:* Compare to measurement in quantum mechanics (e.g., wave-function collapse) to illustrate how the act of elicitation might alter the state being measured.
    - *Analogy 2:* Compare to latent variables in statistics (e.g., factor analysis) to distinguish between mathematical constructs and ontic commitments.
    - *Formal Model:* Use a simple linear algebra framework to model an AI system as a vector space. Define "latent knowledge" as a subspace that is (a) invariant under certain transformations (robustness) and (b) causally implicated in producing outputs (counterfactual stability). This avoids intentionality by focusing on mathematical structure.

  * **Why Philosophical?** 
    - The question is fundamentally about conceptual coherence, not empirical measurement. We are asking what it *means* to attribute knowledge, not how to detect it. 
    - Progress requires clarifying the metaphysical and epistemological assumptions underlying technical work, which is a task for analytic philosophy.

  **4. Expected Results and Failure Conditions**

  * **Success looks like:** 
    - A taxonomy of *coherence conditions* for attributing latent knowledge, such as:
      1. *Robustness:* The pattern must be recoverable across multiple elicitation methods.
      2. *Counterfactual Stability:* The pattern should support interventions (e.g., "If input X were different, the representation would change in Y way").
      3. *Functional Role:* The pattern must play a non-accidental role in the system’s operation (e.g., it is causally necessary for task performance).
    - Alternatively, a negative result: a proof that no set of conditions can simultaneously avoid interpretivism and align with mechanistic descriptions.

  * **Failure conditions:**
    - The analysis remains inconclusive, i.e., we cannot establish necessary conditions that are both non-trivial and consistent with mechanism.
    - The proposed conditions either collapse into behaviorism (trivializing "knowledge") or require intentional ascriptions (violating mechanism).

  **5. Scope and Limitations**

  * **In Scope:** 
    - Conceptual analysis of "latent knowledge" in artificial neural networks (ANNs).
    - Engagement with mechanistic interpretability literature and philosophy of mind.
    - Formal modeling of coherence conditions (e.g., using linear systems as tractable analogs).

  * **Out of Scope:**
    - Empirical validation: We will not run experiments or analyze specific models.
    - Resolving longstanding philosophical debates (e.g., realism vs. anti-realism about mental states).
    - Addressing non-mechanistic systems (e.g., symbolic AI) or non-representational approaches (e.g., pure reinforcement learning without internal states).
    - Providing practical elicitation techniques.

  * **Key Challenge:** 
    The project may reveal that the concept of "latent knowledge" is inherently interpretivist, which would imply that AI safety efforts relying on this concept must either (a) embrace a non-mechanistic framework or (b) abandon the concept altogether. This would be a valuable negative result.

  ---

  This proposal directly addresses the half-formed idea by sharpening the core tension and outlining a path to resolve it conceptually. It respects the boundaries of settled vs. contested views and stays within a four-month timeframe by focusing on theoretical analysis.
answer: |-
  ### Proposal: Coherence Conditions for Attributing Latent Knowledge in AI Systems  
  **Independent Study Fellowship (4-Month Duration)**  

  #### 1. **Precisely Stated Core Question**  
  *Can the concept of "latent knowledge" in AI systems be coherently defined without invoking interpretivist frameworks (e.g., Dennett’s intentional stance) or presupposing belief-like internal states, while remaining consistent with mechanistic descriptions of AI architectures?*  

  **Why answerable in 4 months without experiments?**  
  This is a conceptual/philosophical question requiring:  
  - Analysis of existing literature (AI safety, philosophy of mind).  
  - Development of formal analogies (e.g., vector-space models) and taxonomies.  
  - No new data collection; progress via argumentation and synthesis.  

  ---

  #### 2. **Why Existing Literature Leaves This Tension Open**  
  **Settled Insights (Non-Controversial):**  
  - **Philosophy of Mind:**  
    - *Intentional stance* (Dennett): Attributing "beliefs" is a pragmatic, predictive tool but not an ontological claim about internal mechanisms.  
    - *Mechanistic explanation* (Craver, Bechtel): Causal models of systems are independent of interpretivist ascriptions.  
    - *Consensus:* Neural networks compute via distributed, sub-symbolic patterns (e.g., activation vectors), not discrete symbols.  
  - **AI Safety & ML Literature:**  
    - Elicitation methods (e.g., CCS, probing) assume ground-truth labels exist for evaluation (Burns et al., 2023).  
    - Linear representations in models are detectable (e.g., Elhage et al., 2022), but their *semantic status* is unresolved.  

  **Contested/Open Tensions:**  
  - **Technical ML Gap:** Current evaluations conflate *correlational success* (e.g., probe accuracy) with *causal knowledge* (e.g., "Does the model ’know’ P, or is it pattern-matching?"). This assumes elicitation "reveals" pre-existing states rather than constructing meaning interactionally.  
  - **Philosophical Gap:**  
    - *Realism vs. Instrumentalism:* Is latent knowledge an observer-independent property, or an artifact of the elicitation context?  
    - *Conflict:* Mechanistic approaches (e.g., neural circuit analysis) avoid intentionality but struggle to define "knowledge" without it. E.g., Churchland’s eliminativism vs. Fodor’s representationalism.  
  - **Unresolved in AI Safety:** No framework reconciles "knowledge" attribution with the non-interpretive, causal structure of transformers/MLPs.  

  ---

  #### 3. **Conceptual Method: Distinctions, Analogies, and Models**  
  **Key Distinctions:**  
  - **Elicitation-Independent vs. Elicitation-Dependent Content:** Does latent knowledge exist prior to probing, or is it constituted by the elicitation method?  
  - **Causal vs. Correlational Role:** Distinguish patterns that *cause* behavior (e.g., steering model outputs) from those that merely correlate with labels.  
  - **Narrow vs. Wide Content:** Separate internal mechanistic properties (e.g., activation vectors) from external semantic dependencies (e.g., training data).  

  **Analogies & Formal Models:**  
  - **Analogy 1: Quantum Measurement (Interaction-Dependence)**  
    - Latent knowledge as a "superposition" collapsed by elicitation. Avoids realism about pre-encoded beliefs.  
  - **Analogy 2: Dynamical Systems Theory**  
    - Knowledge as an attractor basin shaped by interactions, not a stored belief.  
  - **Formal Model: Vector-Space Semantics**  
    - Represent "latent content" as a subspace in $\(\mathbb{R}^d\)$ invariant under counterfactual transformations (e.g., "Does rotating layer weights preserve subspace structure?"). Tests coherence without intentionality.  

  **Why Philosophical > Empirical?**  
  - Empirical work assumes ground-truth labels, begging the question.  
  - Conceptual progress clarifies what "success" means for elicitation (e.g., defining robustness conditions for attribution).  

  ---

  #### 4. **Expected Result and Failure Conditions**  
  **Successful Result:**  
  - A **taxonomy of coherence conditions** for attributing latent knowledge:  
    1. **Robustness:** Invariance across elicitation methods (e.g., CCS, direct prompting).  
    2. **Intervention-Stability:** Counterfactual preservation under input/parameter perturbations.  
    3. **Functional Role:** Causal necessity for task performance (e.g., ablation destroys capability).  
  - **Formal Output:** A tractable model (e.g., linear algebra framework) defining "knowledge" via geometric properties.  

  **Negative Result (Failure):**  
  - Incoherence proven: Latent knowledge attribution *always* smuggles in interpretivism.  
  - Ambiguity persists: Conditions are either too weak (e.g., any correlational pattern qualifies) or too strong (e.g., requiring human-like beliefs).  

  ---

  #### 5. **Scope Assessment**  
  **In Scope:**  
  - Conceptual analysis of "latent knowledge" in feedforward architectures (e.g., transformers).  
  - Engagement with mechanistic interpretability (Olah et al.) and philosophy of science (e.g., Cartwright on capacities).  
  - Conditions for attribution that avoid anthropomorphism.  

  **Out of Scope (Limitations):**  
  - **Empirical Validation:** No experiments probing models or testing elicitation methods.  
  - **Consciousness/Personhood:** No claim about AI "beliefs" or subjective states (contested; not consensus).  
  - **Broad LLM Capabilities:** Focus on knowledge elicitation, not general intelligence.  
  - **Full Sociotechnical Context:** Ethics of deployment or alignment are secondary.  

  **Risks:**  
  - **Oversimplification:** Analogies (e.g., quantum measurement) may not fully capture ML dynamics.  
  - **Underdetermination:** Philosophy alone may not resolve technical tensions.  
  - **Value:** Even a negative result advances safety by clarifying ontological risks (e.g., "Is latent knowledge a mirage?").  

  ---  
  **Conclusion:** This project bridges philosophy of mind and AI safety to rigorously assess whether "latent knowledge" is a coherent concept for mechanistic systems. Outputs will inform elicitation methodology and theoretical foundations for interpretability.
