  ## Sonnet on Retrospective Coercion

  The ink is cracked where Charles restored the rite —
  His bishops' croziers guard one common prayer.
  Their measured grace dispels disruptive air;
  This parchment seals the realm in ordered light.

  The crowds press close where factory fumes hang low,
  Their soot-stained hands now lift the latch, unbarred.
  Though titled voices bristle, gaze is hard —
  A wider door swings on its grating hinge.

  The chamber echoes, sharp with scorn and slight,
  Where rivals trade quick jabs on nightly screens.
  Each point scored counts; the fractured purpose leans
  On shifting numbers in the speaker's sight.

  *(Volta)*  
  *Ah, see the arc!* the patient scholar cries,  
  *First, doctrine's cage secured the public square,*  
  *Then labour's key unlocked the people's share,*  
  *And now this clash refines the prize we prize:*  
  *All progress toward this bright, elected end,*  
  *This reasoned path no faction could suspend.*  
  *One course emerges, sanded smooth and fair —*  
  *A past that never voted for this end is there.*

  ---

  **Notes on Execution:**

  *   **Octave Logic:** Each quatrain inhabits a distinct historical moment (Restoration religious settlement, 19th-century franchise expansion, modern parliamentary debate) using language focused solely on its immediate context: ritual order, physical struggle for access, performative conflict. No hint of future consequence.
  *   **Volta & Coercion:** The scholar (line 9) forcibly reinterprets all three. The Restoration's imposed uniformity becomes "doctrine's cage" securing the "public square"; the franchise reform becomes "labour's key"; modern partisan conflict becomes "refinement." The inevitability ("One course," "No faction could suspend") is imposed.
  *   **Rhyme Coercion:**  
      *   **Octave (ABBA ABBA):** rite/prayer/air/light, low/barred/hard/hinge, slight/screens/leans/sight.
      *   **Sestet (CDE CDE):** The *sounds* of the octave's rhymes are reused but forced into a new pattern: cries/**square**, share/**prize**, end/**suspend**, fair/**there**. "Cries" (A sound) fits the new rhyme C, "square" (A sound) is now rhymed as part of the new scheme. "Share" (B sound), "prize" (B sound). "End" (C sound), "suspend" (C sound). "Fair" (A sound), "there" (A sound). The past's vocabulary ("prayer," "barred," "sight") is phonetically present but made to serve a new, alien argument ("square," "prize," "fair").
  *   **The Error:** Precisely depicts "retrospective determinism" – reading necessity into contingent events ("no faction could suspend") and collapsing "counterfactual openness" (ignoring paths not taken, embodied in the final line's "past that never voted").
  *   **Standalone Poetry:** The imagery (cracked ink, soot-stained hands, grating hinges, nightly screens) and the tension between the grounded octave and the sweeping, coercive sestet create dramatic force independent of the historiography argument. The final line resonates as a lament for lost possibilities.
