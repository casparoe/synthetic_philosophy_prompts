  ### Epidemic Prediction Challenge: Unrealistic Assumptions vs. Vulnerable Subgroups

  #### Core Mechanics
  I'll design two distinct mechanics before selecting one. The first (Option A) uses dice rolls to simulate disease spread via index cards representing social connections, emphasizing network structure. The second (Option B) involves role-playing economic agents with hidden behavioral traits affecting market outcomes. Both create tension between aggregate prediction accuracy and subgroup invisibility. I select **Option A** for its direct link to epidemiology and visceral network dynamics.

  **Option A (Selected): Network Contagion Game**  
  *Mechanic*: Students simulate disease spread through a physical network. Modelers use abstract vs. granular assumptions to predict infections. The network's structure creates a vulnerable subgroup visible only to the complex model.  

  **Option B (Discarded): Behavioral Market Game**  
  *Mechanic*: Students act as buyers/sellers with hidden traits (e.g., altruism, impulsivity). Modelers predict price equilibrium using rational-agent assumptions vs. trait-based realism. Unrealistic assumptions mask exploited subgroups.  

  ---

  ### Activity Design: Network Contagion Game  
  **Concepts Illustrated**  
  - **Friedman’s F-Twist**: Unrealistic assumptions (homogeneous mixing) enable accurate aggregate predictions.  
  - **Reverse F-Twist for Subgroups**: Realistic models reveal vulnerable subgroups but may "overfit" aggregates.  

  **Roles & Materials**  
  - **Population (6 students)**: Represent network nodes. Each holds:  
    - *Index card*: Node ID (1–6), neighbor list, and vulnerability status (secret: ⚠️ or ⚪).  
    - *Sticker*: Green (susceptible), red (infected).  
  - **Simple Modelers (1 student)**: Predicts aggregate infections using homogeneous mixing.  
    - *Tools*: R0 = 2.0, dice, scorecard.  
  - **Complex Modelers (1 student)**: Predicts aggregate + subgroup using network data.  
    - *Tools*: Network map, dice, scorecard.  
  - **Game Master (Instructor)**: Runs the epidemic, times steps, records outcomes.  
  - **Materials**: Dice (6 per team), network map (Figure 1), scorecards, stickers.  

  **Network Map (Figure 1)**  
  ```
  Nodes: 1, 2, 3 (Cluster A, dense); 4, 5, 6 (Cluster B, sparse).  
  Connections:  
  1—2, 1—3, 1—4, 2—3, 4—5, 5—6  
  Vulnerable Subgroup: Cluster A (Nodes 1,2,3) ⚠️  
  ```  
  *Rationale*: Cluster A’s density accelerates spread. Vulnerability = 2× infection probability.  

  ---

  ### Rules & Payoff Scheme  
  1. **Setup (5 min)**  
     - Assign roles (6 Population, 1 Simple Modeler, 1 Complex Modeler).  
     - Population: Attach neighbor lists. Nodes 1,2,3 add ⚠️ sticker (hidden).  
     - Modelers: Review rules. Simple Modeler gets R0=2.0; Complex Modeler gets network map.  
     - Initial state: Node 1 infected (red sticker).  

  2. **Prediction Phase (15 min)**  
     - **Simple Modeler**:  
       - Uses formula: *Infection probability = min(1, R0 × InfectedCount / 6)*.  
       - For each susceptible, roll die: Infect if die ≤ 6 × probability.  
       - **Predicts**: Total infected after 3 time steps.  
     - **Complex Modeler**:  
       - For each infected-susceptible edge, roll die: Infect if die ≥ 4 (p=0.5).  
       - **Predicts**: Total infected + infections in Cluster A.  

  3. **Epidemic Simulation (15 min)**  
     - **Per Time Step (5 min/step × 3 steps)**:  
       1. Game Master calls infected nodes.  
       2. For each infected node, neighbors roll dice:  
          - ⚠️ nodes: Infect if die ≥ 3 (p=0.67).  
          - ⚪ nodes: Infect if die ≥ 4 (p=0.5).  
       3. Record new infections.  

  4. **Scoring (5 min)**  
     - **Aggregate Accuracy (Both teams)**:  
       - 10 − |Predicted Total − Actual Total| (min 0).  
     - **Subgroup Accuracy (Complex only)**:  
       - 10 − |Predicted Cluster A Infections − Actual| (min 0).  
     - **Winning**: Highest combined score (Complex: Aggregate + Subgroup; Simple: Aggregate).  

  ---

  ### Minute-by-Minute Timeline  
  | Time  | Phase                          | Key Actions                                                                 |
  |-------|--------------------------------|-----------------------------------------------------------------------------|
  | 0-5   | Setup                          | Assign roles, distribute materials, explain rules.                          |
  | 5-20  | Prediction (Modeling)          | Teams simulate outbreaks. Simple: Dice rolls per node. Complex: Dice rolls per edge. |
  | 20-35 | Epidemic Simulation            | Game Master runs 3 time steps. Population rolls for transmission.           |
  | 35-40 | Scoring & Validation           | Calculate scores, announce winner.                                          |
  | 40-75 | Debrief                        | Map game events to F-twist/reverse twist (see below).                       |

  ---

  ### Debrief & Concept Mapping (40 min)  
  - **F-Twist Illustration (15 min)**:  
    - *Game Moment*: Simple Modeler’s homogeneous mixing ignored the network.  
    - *Discussion*: "Why did aggregate predictions succeed despite false assumptions?"  
      → Unrealistic models capture macro patterns by averaging micro complexity.  

  - **Reverse F-Twist for Subgroups (15 min)**:  
    - *Game Moment*: Complex Modeler saw Cluster A’s vulnerability; Simple Modeler missed it.  
    - *Discussion*: "When did realistic assumptions ‘fail’ for aggregates but ‘win’ for subgroups?"  
      → Granular models expose hidden risks but may overcomplicate aggregate predictions.  

  - **Tension & Trade-offs (10 min)**:  
    - *Game Conflict*: Simple models are efficient but ethically blind; complex models are resource-intensive but equitable.  
    - *Provocation*: "Would you prioritize aggregate accuracy or subgroup safety in a real pandemic?"  

  ---

  ### Predictable Problems & Limitations  
  **What Will Go Wrong**  
  1. **Noisy Predictions**: One epidemic run may deviate from expected averages due to dice randomness. *Mitigation*: Emphasize this mirrors real-world stochasticity.  
  2. **Cluster A Not Hardest Hit**: If vulnerable nodes escape infection, the "reverse twist" lesson weakens. *Mitigation*: Discuss counterfactuals ("What if Node 1 wasn’t patient zero?").  
  3. **Modeler Overwhelm**: Complex Modeler may miscount edges. *Mitigation*: Provide a pre-drawn network diagram.  

  **What the Activity Can’t Reproduce**  
  - **Epistemic Value of False Assumptions**: The game shows *that* unrealistic models work, not *why*. *Supplement*: Explain Friedman’s argument—abstraction distills essential variables.  
  - **Normative Weight of Representational Harm**: Students experience subgroup oversight as point loss, not moral harm. *Supplement*: Discuss real cases (e.g., clinical trials excluding elderly patients).  

  ---

  **Instructor Script Snippet (Debrief)**  
  *"When the Simple Modeler ignored the network, you saw aggregate success mirroring Friedman’s defense of unrealistic models. But when Cluster A was devastated, the Complex Modeler’s approach revealed what was lost in translation—a 'reverse F-twist.' Science isn’t just about predicting the average; it’s about asking *whose reality* gets averaged out."*  

  This design forces experiential tension between predictive efficiency and ethical representation using low-cost materials. Run it as-is, then refine based on subgroup dynamics observed.
