   Brainstorming two very different mechanics:

   Option 1: "Disease Spread Network Game"
     - Students form a network (using strings or by moving chairs) and pass tokens (disease) based on connections.
     - Two teams: one uses a simple SIR model (with unrealistic homogeneous mixing) and the other uses a detailed network model.
     - The simple model predicts aggregate cases quickly but doesn't see clusters; the detailed model sees clusters but is complex and slow.
     - Tension: the simple model might predict total cases well but miss a vulnerable subgroup (e.g., a tightly connected group that gets wiped out).

   Option 2: "Economic Market Game"
     - Students are assigned roles as buyers and sellers in a market for a fictional good (represented by index cards).
     - Two models: 
          Model A (unrealistic): assumes all agents are identical and rational, leading to a simple supply-demand equilibrium.
          Model B (realistic): accounts for heterogeneous agents (e.g., some have social connections, some are irrational, etc.).
     - The game runs for several rounds. Model A predicts the average price well, but Model B can identify that a subgroup (e.g., those with low income) are being exploited or left out.
