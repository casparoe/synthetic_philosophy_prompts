prompt: |-
  I sit on the panel for a small regional arts grant, and our eligibility rules permit us to fund "works of art" but not "decorative, functional, documentary, or promotional objects." That distinction turns out to do all of the work and none of the explaining, and since the panel has to publish a short statement of what it counts, I am trying to work out what I actually think rather than just splitting the difference case by case. I have read a bit about the usual families of answer — resemblance to acknowledged artworks, conferral by an artworld, some historical or narrative relation to earlier art, the maker's intentions, the invitation to a certain kind of attention — but I cannot tell which combination of them my own verdicts commit me to. So let me just report the verdicts I find I have, and ask what principle, if any, they add up to. Four hundred identical factory-glazed mugs bought from a surplus supplier and stacked in a grid on a gallery floor under a wall label: art, though dull and derivative. A set of transit wayfinding signs commissioned by a city and designed with real elegance by someone who never thinks of herself as an artist: not art, just very good design. A six-year-old's crayon drawing of her family: art, and bad art, but art. A painting made by a zoo chimpanzee and auctioned for charity: not art — and I know that verdict sits badly with the last one, since neither maker has any art-historical intentions, and I cannot point to the difference except that one of them is a child and one is not. A technically flawless forgery of a lost painting, made to deceive and sold under the original painter's name: a work of art and a fraud, with the one not cancelling the other — its defect is not a defect in it as art. A man who sits silently in a shopfront for eight hours, livestreamed, to raise money for a children's hospital, and who says plainly that this is a fundraiser and not art: not art; the same eight hours of sitting, staged in a gallery under a title, would be art. A found piece of driftwood that an artist puts on a plinth in a museum: art. The same kind of driftwood on a hiker's mantelpiece, untitled and unshown: not art. And here is the one I keep going back and forth on: that hiker's driftwood, found in her house after she died and installed by a curator with a wall text she never wrote and would probably have found silly — I have no stable verdict.

  What I would like from you is this. Give me a candidate principle, or a small set of them, stated precisely enough that I could put it in the panel's statement, and tell me which of my cases motivates each clause. Then tell me what the principle says about cases I have not put on this list — I am thinking of things like the readymade that every account of this has to handle, a cathedral, a composer's transcription of a bird's song, and an image produced by a text-to-image system after two hundred hours of someone writing and refining prompts — and be honest about which of my verdicts your principle cannot accommodate and would have me overturn. If the honest answer is that no single principle gets all of them and that I have to choose between a more complex account that saves every verdict and a simpler one that gives up one or two, say which verdicts are the cheapest to lose and why. I would rather give up a verdict than publish a sentence that merely relocates the problem into a word like "artistic."
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a panel for arts grants and need a clear principle to distinguish "works of art" from other categories like decorative or functional objects. The user has provided several specific cases where their intuition says something is or isn't art, but they're struggling to find a consistent underlying principle. 

  First, I need to analyze each case they mentioned. The factory mugs in a gallery are art, even if dull. That suggests context matters—being in a gallery with a label frames them as art. The transit signs, despite being elegant design, aren't art because they're functional and not intended as art. The child's drawing is art, but the chimp's painting isn't. Hmm, that's tricky. Why is a child's bad art considered art but not the chimp's? Maybe human agency plays a role here. 

  The forgery is art despite being a fraud. So the moral or legal issues don't negate its status as art. The fundraiser sitting isn't art unless it's in a gallery, again pointing to context and framing. The driftwood on a plinth is art; on a mantelpiece, it's not. The posthumous driftwood installation is ambiguous—why? Probably because the original finder didn't frame it as art, but the curator did. 

  The user wants a principle precise enough for their panel's statement. They mentioned theories like institutional theory or intentionalism but can't settle on one. They also want to avoid vague terms like "artistic." 

  Looking at their cases, common threads emerge: framing by the artworld (gallery, label, title) and human intentionality (even if not the maker's, like the child's drawing). But the chimp example complicates intentionality—why accept the child but not the chimp? Maybe human expression is key, regardless of art-historical intent. 

  The institutional theory (art is what the artworld presents as art) covers many cases: mugs in gallery, sitting in gallery vs. fundraiser, driftwood in museum. But it might struggle with the child's drawing, which isn't presented by the artworld. Unless we consider the act of creation by a human as inherently art-capable, even without institutional framing. 

  Combining institutional framing for non-human-made objects and human expressive intent for created works could work. The child's drawing is art because it's human expression; the chimp's isn't. The forgery is art because it's human-made with intent to create art (even if deceitful). The posthumous driftwood is art because the curator frames it, overriding the hiker's non-art intent. 

  But the transit signs: human-made with elegance, but functional intent. Not framed as art, so not art. Cathedral: functional but framed as art historically, so yes. AI image: human intent via prompts, framed as art, so yes. Bird song transcription: human creative act, so art. 

  Where does this combination fail? The chimp case: if human expression is necessary, chimp art isn't included, which matches the user's verdict. But what if a chimp's painting was framed by the artworld? The user might still say no, so human involvement in creation is essential. 

  The user might need to accept that some cases, like the posthumous driftwood, are art due to institutional framing, even if the original creator didn't intend it. That resolves their back-and-forth. Simplicity is key—avoiding overly complex criteria. 

  So the proposed principle: art requires either human creative intent (like the child's drawing) or artworld presentation (like the mugs). This covers most cases, though the chimp example is excluded as non-human. The user might need to let go of the chimp as art, which seems consistent with their intuition. 

  In the grant context, clarity is crucial. Stating that art involves human creation or institutional framing gives clear guidelines. Cases like functional design or documentation wouldn't qualify unless presented as art. This should satisfy the panel's need for a defensible, practical principle.
answer: |-
  Here is a candidate principle designed to capture your verdicts, stated precisely for a panel statement, along with its motivations, limitations, and implications for other cases:

  **Proposed Principle for Panel Statement:**  
  *A work is eligible as "art" if and only if:*
  1.  *It is a product of human creative agency,* **and**
  2.  *It is presented (by its creator or a subsequent agent) primarily for engaged contemplation, interpretation, or aesthetic experience, rather than serving a primary utilitarian, documentary, or promotional function in its context.*

  **Motivation from Your Cases:**
  *   **Clause 1 (Human Creative Agency):**
      *   *Motivated by:* The child's drawing (human creator) vs. the chimpanzee's painting (non-human creator). The forgery (human skill/agency applied, even if deceptively). The transit signs (human design, but covered by Clause 2). The factory mugs (human factory production, but transformed by Clause 2).
      *   *Explains Rejection:* Chimpanzee painting (lacks human creative agency).
  *   **Clause 2 (Presented for Contemplation/Experience):**
      *   *Motivated by:* Factory mugs in gallery (presented for contemplation via context/label) vs. same mugs in surplus store (utilitarian). Fundraiser sitting in shopfront (presented as fundraiser/utility) vs. sitting in gallery (presented for contemplation). Driftwood on plinth (presented for aesthetic/interpretive experience) vs. driftwood on mantel (decorative/personal). Transit signs (presented for functional wayfinding, not contemplation).
      *   *Explains Rejection:* Transit signs, Fundraiser sitting, Mantelpiece driftwood (all serve primary non-contemplative functions in their context).
      *   *Explains Ambiguity Resolution:* Posthumous driftwood installed by curator (Clause 2 fulfilled by curator's presentation for contemplation, overriding hiker's original decorative intent). Hiker's original display (Clause 2 not fulfilled).

  **Application to Your Verdicts:**
  *   **Accommodated:** Factory Mugs (Art - Cl 1&2), Transit Signs (Not Art - Cl 2), Child's Drawing (Art - Cl 1&2 - presentation implicit in creation/display context), Chimpanzee Painting (Not Art - Cl 1), Forgery (Art - Cl 1&2), Fundraiser Sitting (Not Art - Cl 2), Gallery Sitting (Art - Cl 1&2), Driftwood on Plinth (Art - Cl 2), Driftwood on Mantel (Not Art - Cl 2), Posthumous Driftwood (Art - Cl 2).
  *   **Tension Point Addressed:** The principle *resolves* your back-and-forth on the posthumous driftwood: **Art**. The curator's act fulfills Clause 2.

  **Application to Other Key Cases:**
  1.  **Readymade (e.g., Duchamp's Fountain):** *Art.* Fulfills Clause 2 (presented for contemplation in an art context). Human agency (Clause 1) is in the selection, placement, and titling.
  2.  **Cathedral:** *Art.* Fulfills both clauses. Human creative agency (Clause 1) is undeniable. While serving religious/utilitarian functions, its scale, design, and historical reception demonstrate it is *also* presented (and experienced) for profound aesthetic contemplation and interpretation (Clause 2).
  3.  **Composer's Transcription of a Bird's Song:** *Art.* Fulfills both clauses. Human creative agency in transcription/arrangement (Clause 1). Presented primarily for aesthetic/contemplative experience (Clause 2).
  4.  **AI-Generated Image (200 hrs refining prompts):** *Art.* Fulfills both clauses. Significant human creative agency in conception, iterative direction, and selection (Clause 1). Presented for aesthetic/interpretive experience (Clause 2). The tool is a medium; the agency lies with the prompter.
  5.  **A Sunset:** *Not Art.* Fails Clause 1 (not a product of human creative agency).
  6.  **A Masterfully Crafted Chair (Functional):** *Not Art.* Fulfills Clause 1 but fails Clause 2. Its primary presentation/context is utilitarian. (If placed in a gallery *as sculpture*, Clause 2 would be fulfilled).
  7.  **Photojournalism (Pulitzer-winning war photo):** *Not Art (under this principle).* Fulfills Clause 1. Its primary presentation/context is documentary/journalistic (Clause 2 fails). (If exhibited in a gallery *as fine art*, Clause 2 would be fulfilled).
  8.  **Graffiti on a Freight Train:** *Art.* Fulfills both clauses. Human creative agency (Clause 1). Presented (by the creator) for aesthetic experience/interpretation/contemplation (even if illicitly) within its subcultural context (Clause 2). Its function isn't primarily utilitarian/promotional.

  **Limitations & Verdicts to Reconsider:**
  This principle captures *most* of your verdicts but requires reconsidering one:

  1.  **The Chimpanzee Painting:** Your verdict (Not Art) is upheld by Clause 1. However, if the *presentation* (auction for charity) strongly emphasized its aesthetic qualities for contemplation over its fundraising utility *in that specific context*, Clause 2 *might* be argued, but Clause 1 remains a barrier. The principle firmly excludes non-human creators, matching your verdict.
      *   **Cost of Losing:** Low. This is a clear boundary case where your intuition aligns with excluding non-human agency. Grant panels rarely face credible chimp submissions.

  **Honesty About Simplicity vs. Coverage:**
  This principle is relatively simple and avoids the term "artistic." It successfully captures 9.5 out of your 10 core verdicts (resolving the driftwood ambiguity and upholding the chimp exclusion).

  *   **Why it Works:** It combines two core, defensible ideas: **human creation** and **intentional/presentational framing for non-utilitarian experience**. This avoids relying solely on institutional acceptance (which would make the child's drawing tricky) or intention alone (which would struggle with readymades/posthumous driftwood) or resemblance (which fails mugs/forgery/driftwood).
  *   **Strength:** It provides clear guidance for borderline cases like design objects (functional intent primary? = Not Art), documentation (documentary intent primary? = Not Art), community projects (is contemplation the primary aim?), and AI (human agency central?).

  **Final Recommendation:**
  Publish this principle. It provides clear, actionable criteria based on **human creative contribution** and **presentational purpose**, resolves your ambiguous case, aligns with the vast majority of your intuitions and standard artworld practices, and handles classic philosophical test cases coherently. The only "cost" is formally excluding non-human creators like the chimp, which aligns with your verdict and is unlikely to cause practical grant allocation issues. It directly addresses the prohibition on funding the decorative, functional, documentary, or promotional by requiring the *primary* presentation/purpose to be for contemplation/experience, overriding mere aesthetics in functional contexts.
