  The user suspects the issue lies either in substrate independence or the necessity of the statistical language. They prefer preserving the intuition that consciousness isn't automatically transferable to silicon but don't want to dismiss von Neumann's computational ideas. The challenge is weighing the costs of rejecting each premise.

  I need to recall von Neumann's actual positions. He did emphasize the brain's statistical nature due to unreliable components, unlike reliable digital gates. His focus was on how redundancy enables reliability. The user's interpretation of computationalism (premise 2) is strong—substrate independence is key here. But von Neumann might not have fully endorsed that; he was more focused on the engineering of reliability.

  Premise 2 is the core of functionalism in philosophy of mind. Rejecting it means denying that consciousness is substrate-independent, which aligns with biological naturalism or physicalism. However, this challenges the computational theory of mind. On the other hand, rejecting premise 4 or 5 involves reinterpreting von Neumann. Maybe his "language" is just implementation, not essential for mental properties. But von Neumann seemed to think this statistical approach was fundamental to neural computation, not just an implementation detail.

