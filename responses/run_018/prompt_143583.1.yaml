prompt: |-
  I'm a warehouse logistics coordinator with no formal training in philosophy or history, and next Thursday I'm presenting a twenty-minute argument to a university seminar on Renaissance ethics and comparative philosophy. The audience will be about fifteen people: graduate students in philosophy and comparative literature, two faculty members who specialize in moral relativism and early modern skepticism, and a visiting anthropologist whose work focuses on indigenous representation in European travel writing. Most of them have read Montaigne's essay "Of Cannibals" in undergraduate courses and know the standard interpretation—that Montaigne praises Tupinambá society mainly to shame European cruelty and thereby advances a kind of proto-cultural-relativism. I am not defending that view.

  My thesis is that Montaigne is not arguing for relativism at all. Instead, I claim he constructs the cannibal figure through what I call a "specular inversion": he holds up Tupinambá practices not as genuinely autonomous moral norms, but as a deliberately distorted mirror designed to make European vice visible to Europeans who can no longer recognize it in themselves. The cannibals' supposed "naturalness" is rhetorical optics rather than ethnographic description. I also argue that in the essay's second half Montaigne undermines even this mirror by admitting that his own admiration is itself a form of European artifice—producing a double inversion that leaves neither culture authoritative. This, I think, explains the essay's persistent instability rather than any hidden relativist celebration.

  Please prepare me for the Q&A as a prep sheet, not as a defense of my view. List the objections I will actually receive from this specific audience, ordered by how damaging they are likely to be, and phrase each the way that listener would phrase it—the anthropologist's concern about representation, the relativist's concern about normative authority, the graduate student's concern about textual evidence. For each objection, tell me what I should concede up front, what I should hold, and provide a reply I can deliver in about ninety seconds, plus a brief note on where that reply is weakest. Include the one question I am hoping nobody asks—likely whether my "specular" framing is just another version of the noble-savage trope I claim to avoid. Finally, please say how confident you are in this prep sheet overall, and single out the one point about which you are least sure, whether regarding audience dynamics or the strength of one reply. Do not provide bibliographies, reading lists, or citations; I need only the strategic preparation.
