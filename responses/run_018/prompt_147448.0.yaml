answer: |-
  Here's a decision tree for the Sleeping Beauty problem based on your criteria, designed to map the conceptual landscape while incorporating your interest in non-ergodicity. It starts with fundamental commitments and avoids presupposing standard frameworks.

  **Decision Tree: Mapping Stances on Sleeping Beauty**

  1.  **Should self-locating beliefs ("Where/When am I?") update upon awakening, even without new uncentered evidence?**
      *   **No:** (Go to 1a) Beliefs about uncentered reality (like the coin flip) should not shift based *solely* on discovering your temporal location within an experiment. Awakening imparts no *new uncentered information*.
          *   **1a: Does Beauty gain *any* new centered evidence relevant to the coin flip upon each awakening?** (This tests if "it is Monday" is considered evidence).
              *   **No:** This leads to the **Double-Halfer** view (e.g., David Lewis's core argument). Probability of Heads remains 1/2 on both Monday and Tuesday (if woken). Beauty learns nothing new about the coin upon waking; she only learns she is awake *now*, which was certain to happen. *Result: P(Heads) = 1/2 always.*
              *   **Yes:** (Rare, unstable) If "it is Monday" is considered relevant evidence *and* priors shift without uncentered evidence, it creates instability. Attempting to update on "today is Monday" leads to contradictions or regress (e.g., "If it's Monday, P(Heads) should be 1/2, but if Heads, it *is* Monday..."). *Vacant: Incoherent or unstable under reflection.*
      *   **Yes:** (Go to 2) Discovering one's temporal location within a potentially asymmetric experimental structure *can* justify updating beliefs about uncentered propositions (like the coin flip), even without new external data. Awakening provides relevant centered evidence.

  2.  **(After "Yes" to 1) How should Beauty model the relationship between her awakening and the coin flip?**
      *   **As a Random Draw:** (Go to 2a) This awakening is treated as a random sample from a well-defined temporal reference class (e.g., all possible awakenings in the experiment).
      *   **As Pure Indexical Observation:** (Go to 2b) The awakening is treated as a unique, non-repeatable perspective ("*this* experience now"). Sampling language is inappropriate; it's about conditioning on the existence of *this* centered observation.

  3.  **(Branch "Random Draw" - Go to 2a) What is the relevant reference class for the random draw?**
      *   **All Actual Awakenings:** (Go to 3a) The sample is drawn from the set of awakenings that *actually occur* in this run of the experiment (1 if Heads, 2 if Tails). This implies prior probabilities *can* shift based on centered evidence.
      *   **All Possible Awakenings (Pre-experiment):** (Go to 3b) The sample is drawn from the set of *all possible* awakening moments defined by the experimental protocol *before* the coin is flipped (Monday-Heads, Monday-Tails, Tuesday-Tails). This often implies prior probabilities are fixed over this pre-defined class.

  4.  **(Branch "All Actual Awakenings" - Go to 3a) How does Beauty account for the experiment's causal/temporal structure?**
      *   **Standard Conditionalization:** Beauty uses standard Bayesian conditioning on the centered proposition "I am experiencing an awakening now". The structure (Monday before Tuesday, coin flip before Monday) is handled by the prior joint probability distribution over centered hypotheses. Leads to **Thirder** (e.g., Elga). *Result: P(Heads) = 1/3 upon awakening.*
      *   **Non-Ergodic Sampling Concern:** Beauty worries that a single run of the experiment (one coin flip) doesn't guarantee she is sampling "awakenings" from a true equilibrium distribution over many trials. She might be measuring before the "system" (the ensemble of awakenings) has stabilized relative to her observation point. This often leads to a **Thirder-Leaning Pragmatic View** (reflects long-run frequency if the experiment were repeated). *Result: P(Heads) ≈ 1/3 (treated as the relevant probability for betting/decision-making).* *(Note: Distinction from pure Thirder is fuzzy; mainly a motivation difference)*

  5.  **(Branch "All Possible Awakenings" - Go to 3b) Can prior probabilities shift without new uncentered evidence?**
      *   **No:** Leads to **Lewisian Halfer** (e.g., David Lewis). The prior probability is distributed equally over the three *possible* centered worlds (Mon-H, Mon-T, Tue-T). Awakening eliminates no worlds; Beauty learns she is in an "awake" world, but all three were awake at *some* point. Crucially, Lewis argues she *does* gain new centered evidence: "I am awake *now*" *excludes* the centered world where it's Tuesday and Heads (as she wouldn't be awake then). Conditionalizing the prior (1/3 each) on "not (Heads and Tuesday)" leaves P(Heads) = P(Mon-H) / [P(Mon-H) + P(Mon-T) + P(Tue-T)] = (1/3) / (1 - 1/3) = 1/2. *Result: P(Heads) = 1/2 upon awakening.*
      *   **Yes:** (Less common, unstable) If priors over *possible* awakenings can shift without uncentered evidence *and* we treat it as a random draw, it opens the door to incoherence. Why privilege the pre-flip class structure? What stops arbitrary shifts? *Vacant: Unstable or unexplored coherently.*

  6.  **(Branch "Pure Indexical Observation" - Go to 2b) Can prior probabilities shift without new uncentered evidence?**
      *   **No:** Leads to a **Halfer/Indexical View** (e.g., some applications of the Doomsday Argument logic). Beauty starts with P(Heads) = 1/2. Upon awakening, she gains the pure indexical information "I am *this* observer experiencing *this* awakening moment". She argues this doesn't distinguish between Heads (1 awakening) and Tails (2 awakenings) in a way that favors either hypothesis about the coin. No centered evidence *relevant* to the coin is gained. *Result: P(Heads) = 1/2 upon awakening.*
      *   **Yes:** (Highly speculative) If pure indexicals can shift priors over uncentered facts without new information, it risks extreme subjectivity/solipsism. How does "I am me now" bear on P(Heads)? *Vacant: Unexplored coherently in this context; likely incoherent.*

  **Leaf Summary & Ambiguities:**

  1.  **Double-Halfer:** (1: No -> 1a: No) P(Heads)=1/2 always. No update on awakening.
  2.  **Lewisian Halfer:** (1: Yes -> 2: Random Draw -> 3: All Possible -> 5: No) P(Heads)=1/2 upon awakening. Update via centered evidence excluding impossible indexicals.
  3.  **Thirder (Elga):** (1: Yes -> 2: Random Draw -> 3: All Actual -> 4: Standard) P(Heads)=1/3. Update by conditioning on being in a random actual awakening.
  4.  **Thirder-Leaning (Non-Ergodic):** (1: Yes -> 2: Random Draw -> 3: All Actual -> 4: Non-Ergodic) P(Heads)≈1/3 (pragmatic). Motivated by sampling concerns, often aligns with Thirder actions.
  5.  **Halfer/Indexical:** (1: Yes -> 2: Pure Indexical -> 6: No) P(Heads)=1/2. No relevant centered evidence gained.
  6.  **Vacant (Incoherent Shift - Actual):** (1: Yes -> 2: Random Draw -> 3: All Actual -> Attempt shift without uncentered evidence? - Covered in structure, leads to Thirder or Non-Ergodic, not a separate incoherent leaf).
  7.  **Vacant (Unstable Shift - Possible):** (1: Yes -> 2: Random Draw -> 3: All Possible -> 5: Yes) Unstable.
  8.  **Vacant (Incoherent Shift - Indexical):** (1: Yes -> 2: Pure Indexical -> 6: Yes) Incoherent.
  9.  **Vacant (Incoherent - No Update but Relevant Evidence):** (1: No -> 1a: Yes) Incoherent/Unstable.

  **Ambiguities & Your Premise:**

  *   **Thirder vs. Thirder-Leaning (Non-Ergodic):** The tree distinguishes them based on *motivation* (standard conditioning vs. sampling concerns), but their *predictions* (P=1/3, betting behavior) are identical. This branch tests *why* you accept P=1/3, not what P *is*.
  *   **Lewisian Halfer vs. Halfer/Indexical:** Both get P=1/2, but for different reasons (Lewis updates on centered evidence excluding an indexical; the pure indexicalist denies relevant evidence was gained). The tree separates them via the "Random Draw vs. Pure Indexical" node.
  *   **Your Premise:** Your framing is **not** smuggling in answers or confusing concepts. Focusing on **self-locating belief update**, **reference class/indexical nature**, **shifting priors without uncentered evidence**, and **non-ergodicity** cuts directly to the philosophical and technical cores of the disagreement. The non-ergodic angle is particularly insightful; it highlights a key tension between the "one shot" (actual awakenings) and "ensemble" (possible awakenings/pre-flip) perspectives that underpins much of the halfer/thirder split. Your biophysics lens is valuable here.

  This tree aims to isolate the critical conceptual levers behind the various stances, providing a map beyond the simple labels while accommodating your specific interest in non-standard dynamics.
