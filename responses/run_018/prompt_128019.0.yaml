  First, unpacking the slogan's possible meanings: It could range from a trivial claim about instrumental success to radical ontology. Peirce's convergence theory (truth as ideal consensus) is distinct from James' utility-focused view. The climate modeling context is key - unobservable parameters exist in that limbo between mathematical convenience and theoretical commitment.

