answer: |-
  Here are five precise readings of "truth is what works":

  1.  **Methodological Instrumentalism:** "A proposition is deemed provisionally true if employing it reliably achieves practical goals within a specific context." *Defensible*. This is a cautious, operational stance common in science, focusing on utility without ontological commitment.  
  2.  **Predictive Success as Truth:** "If a model's output (including predictions derived from unobservable parameters) consistently matches empirical observations, those parameters are 'true' representations of reality." *Category Mistake*. Predictive success validates the model's *usefulness*, not necessarily the ontological reality of its specific internal components; it conflates model adequacy with referential truth.  
  3.  **Jamesian Cash-Value Truth:** "A belief's 'truth' consists solely in its experiential consequences and practical benefits ('cash-value') for the believer in navigating life." *False (as a complete theory of truth)*. While highlighting belief's functional role, it reduces truth to subjective utility, failing to account for intersubjective verification, predictive accuracy beyond immediate benefit, or mind-independent facts.  
  4.  **Peircean Convergence Truth:** "Truth is the ideal, final opinion reached by an unlimited community of inquirers through scientific investigation over the long term; 'what works' is what survives and converges in this process." *Defensible (as a regulative ideal)*. This links truth to successful inquiry and stable consensus, grounding it in objective processes while acknowledging its fallibility and future-oriented nature.  
  5.  **Radical Operationalism/Reductionism:** "The meaning and truth of any concept *is* exclusively defined by the set of operations or observable consequences used to measure or verify it; unobservable entities are merely calculational tools." *False*. This eliminates theoretical entities by reducing them to measurement operations, denying explanatory depth and the reality of functional but unobservable structures (like climate model parameters) beyond their instrumental role.  

  **The speaker needed reading #2 (Predictive Success as Truth)** to dismiss the reality question. By equating the parameter's predictive success with its truth/reality, they bypassed the ontological question entirely, committing a category mistake.
