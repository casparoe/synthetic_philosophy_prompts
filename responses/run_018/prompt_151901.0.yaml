  First, I need to precisely map the model's unrealistic assumptions to Friedman's framework. The core assumptions (continuous prices, constant volatility, frictionless trading) are textbook examples of "false but harmless" assumptions Friedman would defend - if they produced good predictions. But here lies the tension: they seemed to work until they catastrophically didn't.

  The user's second point about pre-1987 success is crucial. Was the model genuinely predictive or just coordinative? This distinction matters because Friedman only cared about predictive outcomes, but if the model's success came from self-reinforcing adoption rather than capturing reality, that undermines the F-twist's epistemological foundation. 

  Black Monday forces us to confront two interpretations: simple predictive failure versus out-of-domain event. Friedman might dismiss it as the latter, but the amplification through hedging strategies suggests the assumptions weren't benign - they actively shaped the disaster. This leads to the stability condition question: can we really assume false assumptions stay "falsely consistent" when the model itself alters behavior?

  Finally, the reflexivity point is key. Friedman never considered models becoming performative tools in decision-making. When traders use the model to hedge, they embed its flaws into market structure. This creates a fragility the F-twist can't address because it treats models as passive forecasting tools.

