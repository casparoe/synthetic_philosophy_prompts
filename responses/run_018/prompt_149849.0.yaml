  Phrasing must feel earned. Avoid clichés like "balance" or "middle ground." Instead, show friction: "cracks are where the light escapes" (B) vs. "cracks are where the structure breaks" (A). The shared rhymes become the only "agreement."

  ...Testing end-rhymes: stone/stone, wall/call, command/stand, etc. Yes, each pair locks them in conflict. Final line—"the cost we bear to build a world"—lets both voices claim it: A hears tragic compromise; B hears necessary investment.

