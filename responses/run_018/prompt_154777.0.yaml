  Hmm, the user presents at least five distinct propositions: (1) states must apologize even for technically legal past actions, (2) apologies require acknowledging the state's identity is shaped by those wrongs, (3) current citizens bear no inherited guilt, (4) apologies shouldn't involve cash reparations despite needing material repair, and (5) state apologies are performative yet morally necessary. 

  The sharpest tension seems between rejecting collective guilt while insisting the state's identity is constituted by past wrongs. If the state is a continuous entity bearing responsibility, doesn't that imply some form of collective responsibility? But maybe we can resolve this by distinguishing institutional continuity from personal culpability - the state as an enduring structure versus citizens as transient participants. That feels like a sustainable distinction, though I'll need to articulate it carefully.

  The material repair contradiction is also significant. The user simultaneously rejects cash reparations as reductive while arguing apologies must restore descendants' social standing through material means. This seems harder to reconcile - either material forms are essential to restoration or they're not. Perhaps redirecting the material component toward collective investment in affected communities could bridge this gap, avoiding individual payments while acknowledging concrete harm.

  I'm least confident about resolving the performative nature paradox. If state apologies are theatrical by definition, why are they morally required? The best path might be emphasizing their constitutive function - that the performance itself reshapes political reality through recognition. But I should acknowledge this remains philosophically tricky.

