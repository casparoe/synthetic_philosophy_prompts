answer: |-
  ## Research Proposal: Modal Distance as an Antidote to Expected Value Fanaticism

  **Project Title:** Deflating Fanaticism: Modal Proximity and the Foundations of Decision Under Uncertainty

  **Core Problem:** Expected value (EV) maximization, when applied to decisions involving minuscule probabilities of vast payoffs (e.g., saving `1` person for sure vs. a `1/10^15` chance of saving `10^15` people), yields the highly counterintuitive ("fanatical") prescription to prioritize the tiny probability option. Standard responses either:
  1.  **Bite the Bullet:** Defend fanaticism as rationally obligatory (e.g., pure longtermism).
  2.  **Modify Utility:** Introduce diminishing marginal utility, bounded utility functions, or lexical thresholds to effectively cap the value assigned to vast populations.
  3.  **Invoke Risk Aversion:** Attribute resistance to fanaticism solely to sensitivity to variance, loss aversion, or ambiguity aversion.

  **The Gap & Core Hypothesis:** All these approaches implicitly treat the *metaphysical status* of the high-stakes possibility as irrelevant. They assume probabilities (or decision weights) float freely, assignable to any logically coherent scenario, regardless of its "distance" from actuality in modal space. We hypothesize that **EV fanaticism crucially depends on ignoring modal proximity**, treating vastly distant possibilities (e.g., worlds with trillions of beings existing due to radically contingent cosmological or evolutionary events) as having the same decision-theoretic standing as nearby possibilities. We propose that **credence should decay with modal distance**, and that incorporating such decay offers a novel, principled escape from fanaticism, distinct from modifying utility or invoking standard risk aversion.

  **Why Existing Answers Don't Settle It:**
  *   **Bullet-Biters (Pure EV/Longtermism):** Explicitly reject modal distance as irrelevant, treating logical possibility as sufficient for full probabilistic consideration. They accept the counterintuitive implications.
  *   **Utility Modifiers:** Address the *magnitude* of the outcome but ignore the *status* of the possibility itself. A tiny chance of saving `10^15` *actual* people nearby in modal space might still demand fanaticism under bounded utility if the bound is high enough. They don't explain why we discount possibilities *because* they are distant.
  *   **Risk-Averse Approaches:** Attribute resistance to factors like probability weighting (e.g., Prospect Theory's underweighting of tiny probabilities) or ambiguity aversion. However, these are typically applied *within* a single modal context (our world/universe). They don't capture the intuition that possibilities involving radically different modal structures (e.g., vastly larger cosmos, alien civilizations in distant galaxies contingent on different physical constants) feel qualitatively different and less "real" for decision-making, even if their probability is crisply defined *given* the model. Discounting based on modal distance is a prior consideration about *which possibilities merit probabilistic weight in the first place*.

  **Research Question:** Does the persistence of EV fanaticism depend on the implicit assumption of modal proximity irrelevance? Can a non-arbitrary, formal principle of modal distance discounting be integrated into expectation-based decision rules to deflate fanaticism without collapsing into standard risk aversion or utility modification?

  **Methodology (8-10 Weeks - Conceptual Focus):**
  1.  **Weeks 1-2: Conceptual Groundwork & Formalization:**
      *   Precisely define "modal distance" within a tractable framework (e.g., similarity metrics based on necessary truths, laws of nature, historical contingencies; or leveraging notions from modal logic/structure). Identify key dimensions (e.g., causal isolation, nomic stability, existential dependence).
      *   Formalize the core hypothesis: `Decision-Weight(Outcome) ~ Credence(Outcome | Modal Context) * Discount(Modal_Distance(Modal Context)) * Utility(Outcome)`, where `Discount()` decays with distance. Contrast with standard `Credence(Outcome) * Utility(Outcome)`.
  2.  **Weeks 3-5: Develop Discounting Mechanisms:**
      *   Explore candidate functions for `Discount(Distance)`:
          *   *Exponential Decay:* `e^(-λ * Distance)` (λ as a "modal sensitivity" parameter).
          *   *Step Functions:* Thresholds beyond which possibilities receive zero or negligible weight.
          *   *Resource-Bounded Cognition:* Discount based on computational/cognitive limits in traversing modal space (linking to bounded rationality).
      *   Crucially, seek principled, non-arbitrary bases for `λ` or thresholds (e.g., tied to fundamental ontology, epistemic access limitations, structural features of possibility).
      *   Formalize decision rules (Modal-Discounted EV) and contrast with standard EV, risk-dominant (e.g., Maximin), and EU with probability weighting.
  3.  **Weeks 6-8: Intuition Testing via Staged Rescue Cases:**
      *   Design a series of progressively more modally distant high-stakes/low-probability scenarios vs. near certain low-stakes rescues:
          *   *Case 1 (Baseline):* Save 1 person here/now for sure vs. `1/10^6` chance to save `10^6` people in a neighboring city (same laws, history).
          *   *Case 2 (Moderate Distance):* ... vs. `1/10^9` chance to save `10^9` people in a parallel universe with same physics but divergent history.
          *   *Case 3 (High Distance):* ... vs. `1/10^15` chance to save `10^15` beings in a universe with different physical constants, contingent on highly speculative cosmology.
          *   *Case 4 (Extreme Distance):* ... vs. `1/10^100` chance to save `10^100` Boltzmann brains.
      *   *Conceptual Analysis:* Rigorously analyze whether resistance to choosing the high-stakes option increases *specifically* with perceived modal distance, even holding probability and utility ratios constant. Assess if Modal-Discounted EV better captures this pre-theoretic judgment than standard EV, risk aversion, or bounded utility. Does the discount feel like a distinct reason?
  4.  **Weeks 9-10: Synthesis & Defense:**
      *   Refine the modal discounting model based on analysis.
      *   Explicitly demonstrate how it avoids fanaticism in extreme cases without collapsing into standard risk aversion (it operates on the *input* credence/weighting, not on utility or variance sensitivity).
      *   Articulate why modal distance is a relevant factor distinct from probability or utility magnitude.
      *   Identify key challenges (defining distance non-arbitrarily, potential regress).

  **Defining Success:**
  *   **Minimal Success:** Clearly demonstrating that EV fanaticism *requires* modal proximity irrelevance and that modal distance discounting offers a conceptually distinct escape route. Formalizing a plausible decay function and showing it resolves key fanaticism cases.
  *   **Significant Success:** Identifying a principled, non-ad-hoc basis for the decay parameter/threshold (`λ`) that withstands scrutiny. Showing Modal-Discounted EV aligns better with robust pre-theoretic judgments across modal distances than existing alternatives, without internal inconsistency.
  *   **Failure:** Inability to define modal distance non-arbitrarily. Modal discounting collapsing demonstrably into existing risk aversion or utility modification. The model failing to resolve the targeted fanaticism cases or introducing worse inconsistencies. Failure to distinguish modal distance as a unique factor.

  **Scope & Limitations (Summer Constraints):**
  *   **Focus:** Primarily conceptual and formal. No empirical surveys or experiments (reliance on conceptual intuition testing via constructed cases).
  *   **Depth:** Develop *a* plausible model of modal distance discounting, not *the definitive* model. Explore 1-2 candidate decay functions in depth.
  *   **Modal Framework:** Work within a specific, manageable modal framework (e.g., Lewisian realism or a structured modal logic). Cannot resolve deep metaphysical debates about modality itself.
  *   **Completeness:** Does not aim to provide a complete alternative decision theory. Focuses narrowly on deflating EV fanaticism via modal distance.
  *   **Applications:** Limited exploration of implications beyond the core fanaticism problem (e.g., for longtermism, metaphysics of probability). The primary goal is foundational.

  **Conclusion:** This project challenges a fundamental, often unexamined, assumption underlying EV fanaticism: the irrelevance of modal proximity. By formally integrating the metaphysical "distance" of possibilities into decision weights, it offers a novel pathway to resolving deeply counterintuitive implications of standard decision theory. Success would provide a powerful conceptual tool against fanaticism, grounded in the structure of possibility itself, distinct from utility bounds or risk preferences. This summer research aims to rigorously frame the problem, develop the core formal machinery, and demonstrate its viability and distinctness.
