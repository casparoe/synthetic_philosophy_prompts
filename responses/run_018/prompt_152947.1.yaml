answer: |-
  ### Exam Question  
  **Time Allowed: 45 Minutes**  
  "Frankfurt-style cases are widely held to refute the Principle of Alternative Possibilities (PAP) by showing that an agent can be morally responsible for an action even when they lack the ability to do otherwise. Recently, a refined defense of PAP proposes that an alternative possibility (A) must be *normatively accessible* to count as genuinely available. This requires that the agent could recognize A as a live reason for action *without* undergoing a global restructuring of their core evaluative framework.  

  First, articulate precisely how this normative accessibility condition appears to shield PAP from Frankfurt counterexamples (e.g., Jones in a standard Frankfurt scenario), by demonstrating why the manipulated agent lacks access to the alternative of refraining.  

  Second, explain why this refined PAP generates a significant tension: it seems to render moral responsibility implausibly demanding for ordinary agents embedded in unexamined normative frameworks (e.g., a person acting from unchallenged social conditioning), who may lack normative accessibility to alternatives not sanctioned by their framework.  

  Finally, critically evaluate the following proposed resolution: A defender of Frankfurt cases might argue that the manipulated agent *does* possess normative accessibility to the alternative *at the level of second-order endorsement* (e.g., Jones could have endorsed a reason to refrain, consistent with his existing values, had the counterfactual intervener not been present). Does this successfully dissolve the tension? Or does the persistence of the demandingness problem for ordinary agents suggest that the only consistent path is to abandon PAP and ground responsibility solely in hierarchical identification, severing its conceptual link to alternative possibilities altogether? Justify your conclusion."

  ---

  ### Model Answer (Approx. 750 words)  

  The normative accessibility (NA) refinement of PAP contends that genuine alternative possibilities require not just metaphysical possibility but the agent's capacity to recognize the alternative as a motivationally potent reason *within* their existing evaluative structure. In standard Frankfurt cases (e.g., Jones deciding to vote, with Black ready to intervene should Jones show any sign of choosing otherwise), NA seemingly rescues PAP. Jones, under Black’s latent threat, *apparently* cannot choose otherwise. Crucially, NA argues Jones *lacks* normative accessibility to refraining: recognizing a decisive reason *not* to vote would necessitate rejecting his core commitment to voting (say, his deep-seated belief in civic duty), constituting a global evaluative upheaval. Since NA demands alternatives be accessible *without* such upheaval, Jones lacks a normatively accessible alternative. Thus, PAP isn’t violated, as Jones is responsible *only* if he *could* have accessed an alternative *under this condition*, which he couldn’t. PAP survives because the scenario fails to provide a true NA alternative.

  However, this refined PAP creates a profound tension regarding ordinary moral responsibility. If responsibility requires the capacity to recognize alternatives as live reasons within one's *current*, unaltered evaluative framework, then agents deeply embedded in rigid, unexamined normative structures (e.g., someone acting solely on internalized patriarchal norms without critical reflection) may lack NA to alternatives incompatible with that framework. They couldn’t recognize feminist alternatives as valid reasons without a fundamental, global shift in their values – precisely what NA rules out as necessary for accessibility. Consequently, such agents would lack alternative possibilities in the NA sense and, per PAP, be excused from responsibility for actions flowing from their framework. This is implausibly demanding: ordinary moral practice holds agents responsible even when their actions stem from unchallenged, parochial worldviews, provided they meet conditions like intentionality and minimal rationality, *without* requiring them to have been capable of "seeing" radically different reasons.

  The Frankfurt defender's proposed resolution – locating NA in second-order endorsement – attempts to dissolve this tension. They argue that in the Frankfurt scenario, Jones *does* possess NA to refraining *at a higher level*. Had Black not been present, Jones *could* have recognized a reason to refrain (e.g., fatigue) *without* altering his core values; he might have simply momentarily endorsed this reason as outweighing his civic duty, reflecting a normal fluctuation within his existing hierarchical structure. His second-order capacity to reflectively endorse or reject first-order desires remains intact, making the alternative normatively accessible *in principle* through this endorsement mechanism, even if Black’s presence causally blocks its actualization. Applied to the ordinary agent: even within an unexamined framework, the agent retains the second-order capacity to potentially endorse critical reasons if presented compellingly, without needing global restructuring. Thus, NA is preserved (via hierarchical endorsement), PAP is defended against Frankfurt (Jones had the *capacity* for NA), and responsibility isn't unduly demanding (ordinary agents have the latent second-order capacity).

  This resolution is ultimately unsuccessful. While it correctly identifies second-order capacities as central to hierarchical theories of responsibility, it misapplies them to salvage PAP and fails to resolve the demandingness problem.  

  1.  **Misapplication to Frankfurt:** The defender conflates *having the general capacity* for second-order reflection with *having normative accessibility to the specific alternative in the actual scenario*. Black’s intervention mechanism typically ensures Jones shows *no* sign of hesitation or counter-reason consideration – it preempts the very *activation* of Jones’s second-order capacity regarding refraining. If Jones *cannot* even begin to entertain the reason to refrain (due to Black's setup) without triggering intervention, then that specific alternative remains *practically inaccessible* to his reflective capacities *in that context*, regardless of his general abilities. NA requires the ability to recognize the reason *as an alternative here and now*, not just a generic capacity. The defender’s move doesn't secure genuine NA for Jones in the Frankfurt setup.  
  2.  **Failure to Resolve Demandingness:** For the ordinary agent entrenched in an unexamined framework, the mere *existence* of a latent second-order capacity doesn't guarantee NA to critical alternatives. If the framework actively suppresses or renders unintelligible certain reasons (e.g., patriarchal norms dismissing feminist critiques as irrational), the agent *cannot* recognize those reasons as live options through endorsement *without first* undergoing a significant (if not global) evaluative shift – precisely the shift NA forbids. The defender’s appeal to "potential" endorsement if "compellingly presented" is question-begging; what counts as "compelling" is framework-dependent. The demandingness problem persists: requiring NA still risks exculpating agents for actions stemming from deeply held, unreasoned commitments.

  The unresolved tension reveals a deeper flaw in trying to salvage PAP via accessibility conditions. NA either proves too weak (failing to robustly shield PAP from Frankfurt, as the second-order move falters) or too strong (making ordinary responsibility implausible). The consistent resolution is to abandon PAP. The Frankfurt intuition – that Jones is responsible *without* alternatives – retains its force, best explained by hierarchical models grounding responsibility in agents' identification with their will (e.g., Jones acts on a desire he reflectively endorses). This severs responsibility’s *constitutive* link to alternative possibilities. While alternatives might be evidentially useful, the core of responsibility lies in the structure of the agent’s will and their relationship to their actions *in the actual sequence*, not in inaccessible counterfactual possibilities, however normatively defined. Hierarchical models also better accommodate ordinary responsibility: the unexamined agent can be responsible if their action flows from desires they accept (even if uncritically), without requiring inaccessible transformative insights. The tension is resolved not by refining accessibility but by recognizing that responsibility and alternative possibilities are fundamentally distinct.

  ---

  ### Marking Scheme (Total: 25 Marks)

  1.  **Accurate Articulation of Normative Accessibility & its Frankfurt Defense (5 Marks):**  
      *   Correctly defines NA as requiring recognizing the alternative as a reason *without global evaluative restructuring* (2 marks).
      *   Clearly explains how this denies the manipulated agent (Jones) has NA to refraining, thus shielding PAP (3 marks).  
      *   *Common Failure:* Misrepresenting NA as mere logical/metaphysical possibility or conflating it with causal flickers; failing to explicitly link the lack of NA to the *need for global restructuring* in Frankfurt.

  2.  **Precise Explanation of the Demandingness Problem for Ordinary Agents (6 Marks):**  
      *   Clearly states the tension: PAP+NA excuses agents in unexamined frameworks (e.g., social conditioning) (2 marks).
      *   Explains *why* they lack NA: recognizing critical alternatives requires evaluative shifts ruled out by NA (2 marks).
      *   Argues why this is implausible for ordinary responsibility (2 marks).  
      *   *Common Failure:* Vague references to "ignorance" or "bias" without tying it to the *structural inability to access reasons* within the unaltered framework; failing to contrast this implausible exculpation with everyday attributions of responsibility.

  3.  **Critical Evaluation of the Second-Order Endorsement Resolution (8 Marks):**  
      *   Accurately presents the defender's argument (NA via latent second-order capacity) (2 marks).
      *   Provides a strong critique: Distinguishes *general capacity* from *specific contextual NA* in Frankfurt (showing it fails) (3 marks).
      *   Provides a strong critique: Shows latent capacity doesn't overcome *framework-based inaccessibility* for ordinary agents (showing demandingness persists) (3 marks).  
      *   *Common Failure:* Simply restating the resolution without critique; accepting the defender's move uncritically; failing to address *both* prongs (Frankfurt defense failure *and* demandingness persistence) of the critique.

  4.  **Reasoned Conclusion on Resolving the Tension (6 Marks):**  
      *   Clearly concludes the tension is unresolved (NA is either weak or strong) (2 marks).
      *   Argues for abandoning PAP as the consistent solution (2 marks).
      *   Justifies this by linking to the strength of hierarchical models: explaining Frankfurt intuition and accommodating ordinary responsibility *without* requiring alternatives (2 marks).  
      *   *Common Failure:* Asserting abandonment of PAP without sufficient justification based on the preceding critique; failing to positively indicate hierarchical identification as the alternative grounding for responsibility; concluding the tension *is* dissolved by the defender's move despite the critique.
