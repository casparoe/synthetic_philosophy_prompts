  Cases without prior plans: how does the model handle harmful outcomes when there's no established plan? The guest may suggest default scripts. Follow-up on whether this introduces moral judgment through the back door.

  Closing question: what evidence could falsify her model? She’s good at deflecting, so the question must force a concrete answer. Maybe a scenario where plan-deviance is controlled but moral valence still affects judgments.

