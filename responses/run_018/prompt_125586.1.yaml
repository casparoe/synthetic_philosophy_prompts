answer: |-
  Here's a set of sharp, focused questions designed to probe her plan-deviance account of the Knobe effect, incorporating your specific requests with conversational but incisive follow-ups:

  1.  **Cross-Cultural Flip:**
      *   **Question:** "Your plan-deviance model centers on how saliently an outcome deviates from an agent's *intended* plan to trigger the intentionality judgment. We see the classic harm/help asymmetry weaken or even *reverse* in some East Asian or collectivist samples – where helping a side-effect might be judged *more* intentional than harming. How does your model account for this cultural variation? Does it change how 'the plan' is defined, or how 'deviance' is computed?"
      *   *Likely Answer:* She'll likely say culture influences what aspects of the plan/context are salient or how "deviance" is weighted (e.g., deviance from collective norms might be more salient than individual intent in some contexts).
      *   **Follow-Up (Pressing Falsifiability):** "If salience weights and 'plan representation' are that flexible across contexts, how do we avoid making the model unfalsifiable? Couldn't *any* observed asymmetry pattern be explained *post-hoc* by tweaking what counts as the salient plan or the relevant deviance?" (Tone: Curious skepticism, "Help me see the boundary here.")

  2.  **Expert Skill Modulation:**
      *   **Question:** "Studies show that experts (like surgeons or chess players) judging outcomes in their own domain often exhibit *reduced* or even *reversed* Knobe asymmetries compared to novices – they might judge a harmful side-effect as *less* intentional if it's a known risk in a complex plan. How does your plan-deviance model handle this skill-based modulation? Is it about experts having more complex/intricate 'intended plans' that better incorporate potential side-effects?"
      *   *Likely Answer:* She'll probably argue experts represent the "intended plan" differently, with foreseen negative outcomes potentially integrated into the plan's structure or acceptable risk profile, thus reducing perceived deviance.
      *   **Follow-Up (Pressing Mechanism/Intentionality):** "Doesn't this risk collapsing the distinction between what's *intended* and what's merely *foreseen and accepted*? If the expert's complex plan representation inherently includes the risk of harm as part of 'the plan,' doesn't that mean the intentionality judgment is still fundamentally tracking the *outcome's normative status* (harm being bad) within the expert's framework, just mediated through plan structure?" (Tone: Probing the core mechanism, "Is this solving it or moving the goalpost?")

  3.  **Reverse Knobe in Kids:**
      *   **Question:** "Young children often show a 'reverse Knobe' pattern: they're quick to attribute intentionality to *negative* side-effects but less so to *positive* ones, even when the agent's knowledge is identical. Your model posits plan-deviance as the core mechanism. Does this developmental data suggest this mechanism is innate but calibrated by experience, or is it something learned entirely? How does the 'plan' representation and 'deviance' computation develop?"
      *   *Likely Answer:* She might argue the *core computational mechanism* for tracking plan-deviance is innate/cognitive, but its *calibration* – what constitutes a significant deviation and how plans are represented – is learned through social experience and norm internalization.
      *   **Follow-Up (Pressing Learning vs. Morality):** "If young kids are already hyper-sensitive to negative deviance but need to *learn* when positive deviance 'counts,' isn't that learning fundamentally about acquiring social/moral norms about what kinds of deviations *matter*? Doesn't this suggest the asymmetry's root *is* normative, even if the *vehicle* for expressing it is plan-deviance tracking?" (Tone: Connecting development to origins, "Where does the norm enter?")

  4.  **No Clear Prior Plan, But Harm:**
      *   **Question:** "Let's consider scenarios where an agent truly has *no* specific prior plan or goal hierarchy – maybe they're acting impulsively, randomly, or in a completely novel situation – and they bring about a harmful side-effect. According to your model, without a pre-existing 'intended plan' to deviate *from*, the mechanism shouldn't trigger. Yet, people might still judge a harmful outcome in such a scenario as highly intentional. How does your account handle these 'plan-less harm' cases?"
      *   *Likely Answer:* She might argue people *impute* a minimal default plan (e.g., "act safely," "achieve *some* goal without wrecking things") or use scripts/norms to construct a baseline expectation even in novel/impulsive contexts, against which the harm is seen as deviant.
      *   **Follow-Up (Pressing Defaults/Norms):** "If we're imputing a 'default plan' like 'act safely' whenever no explicit plan exists, doesn't that effectively build the moral/normative standard *directly into the baseline* against which deviance is measured? Isn't the judgment of intentionality for harm here *still* primarily driven by the violation of the safety norm, with the 'plan-deviance' framework just dressing it up?" (Tone: Highlighting potential circularity, "Is the norm doing the real work?")

  5.  **The Falsifiability Closer:**
      *   **Question:** "You've developed a really resilient framework that reinterprets a lot of challenging data through the lens of plan representation and deviance computation. That's impressive, but it also makes me wonder: what kind of empirical result or thought experiment scenario *could* genuinely challenge the core of your model? If we saw X, would you say 'Okay, that breaks the plan-deviance account,' rather than 'Well, that just shows the plan was represented differently in that context'?"
      *   *(This directly asks for her "falsification condition" and pre-empts the deflection strategy.)*

  **Key Tone Elements Incorporated:**

  *   **Conversational:** Uses phrases like "Let's consider," "How does your model handle," "Help me see," "Doesn't this risk," "makes me wonder."
  *   **Sharp/Incisive:** Directly addresses potential weaknesses (falsifiability, circularity, normative roots), uses "Doesn't this suggest/risk/collapse," presses on the most likely deflection points.
  *   **Framed Around Her Model:** Questions constantly tie back to "plan representation," "deviance computation," "salience weights," and how her *specific mechanism* accounts for the data.
  *   **Avoids Bibliographies/Citations:** Focuses purely on the phenomena and her theoretical account.

  These questions should push the conversation beyond surface-level debates about normativity and force a deep dive into the mechanics, predictions, and potential limitations of her plan-deviance framework. Good luck with the podcast!
