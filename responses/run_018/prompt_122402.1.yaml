  Let's break down that handout piece by piece, separating standard philosophical positions from the teacher's interpretations and overstatements. I'll flag what's widely accepted, what's debated, and where his take goes beyond (or misrepresents) the standard debate. We'll then apply it quickly to your situation.

  **Handout Breakdown:**

  1.  **"A genuine moral dilemma isn't just a hard decision. It's when two real obligations both apply to you and you can't do both..."**
      *   **Standard:** This is a very common *definition* of a genuine (or "tragic") moral dilemma within the debate. Philosophers arguing *for* dilemmas (like Bernard Williams, Ruth Marcus, Patricia Greenspan) start from this premise. The example (conflicting promises) is a classic illustration.
      *   **Believability:** **Yes.** This is a standard starting point.

  2.  **"The standard argument against these is simple: if you ought to do A and you also ought to do B, then deontic logic lets you combine those into 'you ought to do A and B,' and since 'ought implies can,' and you can't do both, you get a contradiction..."**
      *   **Standard:** **Absolutely.** This *is* the core logical argument against the possibility of genuine dilemmas (often associated with philosophers like Earl Conee). Deontic logic (the logic of obligation) traditionally assumes principles like agglomeration (combining oughts) and "ought implies can" (OIC).
      *   **Believability:** **Yes.** This is accurately stating the standard anti-dilemma argument.

  3.  **"But that argument only has force if you accept 'ought implies can,' and most people who believe in real dilemmas just reject that principle — they're happy to say you can be morally required to do something impossible..."**
      *   **Standard:** **Partially.** Rejecting OIC *is* a major and common strategy used by defenders of genuine dilemmas (like Williams). They argue that morality can demand the impossible, making the situation tragic.
      *   **Overstatement/Sliding:** The phrase "most people who believe in real dilemmas just reject that principle" is a **slight overstatement/simplification.** While rejecting OIC is a *prominent* strategy, it's not the *only* one. Some defenders try to modify deontic logic itself to allow dilemmas without outright rejecting OIC, or argue that the obligations don't strictly "aggregate" in that way. However, rejecting OIC is definitely a *central and widely used* move by dilemma defenders. Saying they are "happy" to say it might be a bit flippant, but the core point – that rejecting OIC is a key response – is correct.
      *   **Believability:** **Mostly Yes (on the strategy), Be Suspicious of "just" and "most".**

  4.  **"The Williams side adds that even after you've chosen, something is left over: you feel bad about the thing you didn't do, and that leftover feeling is a kind of guilt, which is the evidence that you did something wrong whichever way you went. They call it the moral remainder."**
      *   **Standard:** **Yes.** Bernard Williams (and others) developed the concept of the **"moral remainder"** or **"residue"** (like regret, agent-regret, or a sense of lingering obligation). This is a *very* influential idea in the pro-dilemma camp. The feeling of guilt or regret *is* often presented as evidence that *some* wrong was done, even if the choice was necessary or the best possible under the circumstances. It highlights the idea that a genuine obligation wasn't fully discharged.
      *   **Believability:** **Yes.** This accurately represents Williams' core contribution to the dilemma debate.

  5.  **"Here's a rough test I use for telling a real dilemma from a choice that's merely hard — call it the 'what do you say after' test: if, once it's over, you'd owe the person you let down an apology or you'd feel you should make it up to them, it was a genuine dilemma; if you can walk away saying 'that was the right thing, full stop,' then it was only ever a hard choice."**
      *   **Standard:** **No, This is Largely His Own.** While the *idea* of a "remainder" (like the need to apologize) connects to Williams' concept, framing it as a definitive "test" is **almost certainly the teacher's own invention or significant oversimplification.** Philosophers don't typically propose such a clear-cut, practical litmus test. The moral remainder concept describes a *phenomenon* (the lingering feeling/residual obligation), not a diagnostic tool. Furthermore, feeling the need to apologize *could* indicate a dilemma, but it could also indicate you made the *wrong* choice in a non-dilemma situation, or simply feel bad about a tough but correct choice. Conversely, someone might *not* feel the need to apologize in a genuine dilemma due to justification, yet the "remainder" might manifest as deep regret or sadness instead. This "test" is too neat and likely **not a standard philosophical tool.**
      *   **Believability:** **Be Very Suspicious.** It captures the *spirit* of the remainder idea but packages it misleadingly as a foolproof test.

  6.  **"And the practical upshot: in a genuine dilemma both options are equally okay, so it genuinely doesn't matter which one you pick and there's no point agonizing over it."**
      *   **Standard:** **No, This is a Significant Misstep.** This is **where the teacher seriously overreaches and misrepresents the pro-dilemma position.** This does *not* follow logically from the points he got mostly right (rejecting OIC, moral remainder).
      *   **Why it's Wrong/Misleading:**
          *   **Rejecting OIC doesn't imply equality:** Just because you *ought* to do both impossible things (rejecting OIC) doesn't mean failing one is just as bad as failing the other. One obligation (e.g., saving a life) might be *much* weightier than another (e.g., keeping a minor promise), even if both are genuine "oughts". The tragedy is that you *must* violate *some* obligation, not that violating either is equally acceptable.
          *   **Moral Remainder doesn't imply equality:** Feeling guilty/residual obligation about the unchosen path doesn't mean both choices were morally equivalent. It means *whichever* path you chose, you incurred a moral cost. One path might incur a *much larger* cost. The agony often comes *precisely* because one option seems *less* bad or *more* obligatory than the other, even though both involve wrongness.
          *   **Pro-dilemma philosophers don't say this:** Defenders of dilemmas (like Williams) explicitly argue that in a dilemma, *whichever* action you take, you *do something wrong* (hence the guilt/remainder). They emphatically do *not* say both options are "equally okay" or that it "doesn't matter." They often stress the need for careful deliberation to choose the *least bad* or *most obligatory* option under tragic constraints. The "no point agonizing" part is particularly egregious – the recognition of a genuine dilemma often *increases* the agony, as you know you *will* do wrong.
      *   **Believability:** **No. Be Very Suspicious.** This is a serious distortion. It confuses the idea that *both choices involve wrongdoing* (true for pro-dilemma view) with the idea that *both choices are equally right/good/acceptable* (false and not claimed).

  **Summary of What to Believe/Be Suspicious Of:**

  *   **Believe:** The definition of a dilemma, the standard logical argument against them (deontic logic + OIC), the common pro-dilemma strategy of rejecting OIC, and the core concept of Williams' "moral remainder" (lingering guilt/regret/residual obligation as evidence of wrongdoing).
  *   **Be Suspicious Of:**
      *   The implication that rejecting OIC is the *only* pro-dilemma move (it's the main one, but others exist).
      *   The "what do you say after" test as a standard philosophical tool (it's likely his own oversimplification).
      *   **Most Importantly:** The conclusion that in a genuine dilemma "both options are equally okay" and "it doesn't matter which one you pick." **This is a significant misrepresentation of the pro-dilemma position.** Pro-dilemma philosophers argue you *will* do wrong whichever you choose, *not* that the choice is arbitrary or that both are equally acceptable. Deliberation and choosing the best possible (or least bad) option under tragic constraints is crucial.

  **Your Situation:**

  You faced a conflict between two obligations: **Honesty to your mom** and **Loyalty/Confidentiality to your best friend**. You couldn't fulfill both. You chose loyalty (by lying to your mom). You feel awful (guilt) about lying to your mom, but stand by your choice to protect your friend's confidence.

  *   **Is it a Genuine Dilemma?** Based on the *standard definition* (two real, conflicting obligations you couldn't both fulfill), **yes, this fits.** Honesty and loyalty/confidentiality are widely recognized moral principles.
  *   **The Moral Remainder:** Your feeling "awful about lying to your mom" is **exactly the kind of "moral remainder" Williams described.** It's the residue of the obligation you violated (honesty), even though you believe you made the right (or necessary) choice overall by prioritizing loyalty in this instance. It signals that *something* morally significant was left undone (being truthful).
  *   **Were Both Options "Equally Okay"?** **Absolutely not.** You clearly believed (and still believe) that protecting your friend's confidence was the *stronger* obligation or the *less bad* violation in this specific context. Lying felt wrong, but breaking confidence felt *worse*. This makes perfect sense within the genuine dilemma framework: you had to choose which obligation to prioritize/violate, knowing a cost would be incurred either way. Your guilt confirms the "remainder" of the violated obligation, *not* that the choices were morally equal.
  *   **The Apology Test:** While his test is dubious, ask yourself: Would you feel you owe your mom *some* kind of acknowledgment or explanation (even if not a full "I was wrong" apology)? Something like, "Mom, I'm really sorry I lied to you the other day. I was in a terrible spot because of a promise I made, and I panicked. I hate lying to you." That feeling *aligns* with the moral remainder concept – a sense of residual obligation needing *some* expression, even if the core choice was justified.

  You're not just overthinking guilt. You experienced a classic small-scale moral dilemma, felt the weight of conflicting obligations, made a choice prioritizing one over the other, and now bear the "moral remainder" (guilt) for the obligation you had to violate. That guilt doesn't mean your choice was wrong; it means morality imposed conflicting demands, and fulfilling one meant failing the other. The teacher's handout gets the *problem* and the *phenomenon* of the remainder mostly right, but his "equally okay" conclusion is badly mistaken. Your instinct that sometimes one option is clearly worse, even in a dilemma, is spot on.
