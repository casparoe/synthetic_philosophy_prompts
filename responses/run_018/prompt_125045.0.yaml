  First, I need to unpack "performative sovereignty." Drawing from Austin's speech act theory, this suggests that saying "the will of the people" isn't just describing something but actually creating the unified "people" it refers to. In Brexit, this phrase was used repeatedly after the referendum. The referendum itself was close (51.89% vs 48.11%), so the idea of a singular "will" is performative—it constructs unity where there's division.

  Key players: The Leave campaign, Theresa May's government, Parliament, the courts (Miller case), and EU negotiators. For each, I should examine how "the will of the people" was used. The Leave campaign used it to claim legitimacy and shut down debate. May invoked it to justify her red lines, like leaving the single market. Parliament wrestled with it, especially during deadlocks over deals. The courts in Miller emphasized parliamentary sovereignty, indirectly challenging the direct mandate claim. EU negotiators found the phrase unworkable, needing concrete positions.

  Real options: Direct democratic mandate (referendum result as final) vs. parliamentary sovereignty (Parliament's role in implementing) vs. "clean break" (hard Brexit as only true interpretation). The "will of the people" phrase was used to push for a hard Brexit, dismissing other interpretations.

  Where the framing breaks: The 48% Remain voters and regional splits (Scotland, N. Ireland) show the "people" weren't unified. The Miller case upheld Parliament's role, contradicting the direct mandate narrative. The parliamentary deadlock revealed MPs couldn't agree on what the "will" meant. This suggests populism might need some pre-existing identity to latch onto, like English nationalism or anti-immigration sentiments, rather than creating it from scratch.

  User's deeper needs: They want to move beyond the simplistic "populism is dangerous" take. They need a nuanced analysis of whether "performative sovereignty" holds up as a framework for Brexit. They’re likely seeking to contribute original thought to democratic theory, possibly for an academic or high-journalism audience. They might also be exploring how rhetoric shapes political reality, which is crucial in today's polarized climate. Ensuring the analysis acknowledges both the constructivist power and the limitations where material realities resist the narrative is key.
answer: |-
  Here’s a rigorous analysis of Brexit through the lens of "performative sovereignty," mapping actors, options, and rhetorical functions while identifying critical fractures in the frame:

  ### **Core Thesis: "Performative Sovereignty" in Action**  
  The phrase "the will of the people" (WotP) functioned not as a descriptive label but as a **constitutive speech act**. By invoking WotP, actors *created* a unified, sovereign "people" where none existed (a 51.89%-48.11% split), transforming a fragile, contested outcome into an immutable mandate. This rhetoric suppressed ambiguity and cast dissent as illegitimate.

  ---

  ### **Mapping the Performance: Actors & Functions**  

  | **Actor/Stage**       | **Rhetorical Function of WotP**                              | **Performative Effect**                                                                 |
  |------------------------|-------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Leave Campaign**     | **Generative**: "We *are* the people" (Farage).             | Fabricated a monolithic demos from fragmented grievances (anti-immigration, austerity, sovereignty theater). |
  | **Post-Ref Govt (May)**| **Authorizing**: "The referendum must be delivered."        | Redefined parliamentary sovereignty as subordinate to the "people’s" direct decree. Cemented "clean break" as *the* interpretation. |
  | **Parliament**         | **Paralyzing/Weaponizing**: Both Leavers/Remainers invoked it. | Suppressed scrutiny ("betrayal" discourse) but revealed fracture: MPs couldn't agree on *which* "will" to enact (Hard Brexit? Soft?). |
  | **Courts (Miller I/II)**| **Limiting**: Ruled Parliament must trigger Art. 50.        | Paradoxically *undermined* WotP’s performative force: reasserted parliamentary sovereignty as the constitutional reality. |
  | **EU Negotiators**     | **Nullifying**: "The 'people' isn't a negotiation position." | Exposed the emptiness of the signifier—WotP couldn’t resolve concrete trade-offs (ECJ, borders, payments). |

  ---

  ### **Critical Fractures in the Frame**  
  1. **The 48% & Regional Splits**:  
     - The performative frame **erased the minority** by design. When Scotland/NI invoked *their* "wills" (62% Remain in Scotland, 56% in NI), Leavers dismissed these as "sub-people" disruptions. The rhetoric *required* silencing pluralism to sustain the illusion of unity.  
     - **Reality Check**: The "people" split along age, class, geography. WotP couldn’t perform away material divides (e.g., border polls in NI).

  2. **Miller & Parliamentary Deadlock**:  
     - **Miller’s blow**: The Supreme Court forced May to seek parliamentary approval for Article 50—exposing that WotP alone couldn’t bypass institutional channels.  
     - **Deadlock as deconstruction**: Parliament’s inability to pass a Brexit deal revealed the "will" was **indeterminate**. Was it for Norway-style EEA membership? No Deal? The performative act collapsed under legal/political implementation.  

  3. **Pre-Existing "People" or Manufactured Unity?**  
     - **Contrary evidence**: Leave’s success relied on *pre-existing* English nationalism, anti-establishment sentiment, and decades of Euroskeptic press. The referendum didn’t create these—it *mobilized* them.  
     - **Limitation of performativity**: Rhetoric alone couldn’t sustain unity post-vote. As options narrowed (e.g., May’s red lines), the "people" fragmented into Leave/Remain, Hard/Soft Brexit factions. Populism needs *some* raw material (grievances, identity) to performatively unify.  

  ---

  ### **Does the Concept Earn Its Keep?**  
  - **Yes, critically**: It explains how a **thin majority** became a sacred mandate. WotP wasn’t descriptive—it was a tool to:  
    - **Conceal contingency** (e.g., Russian interference, Vote Leave’s illegal overspending).  
    - **Depoliticize conflict** (dissent = treason).  
  - **But it’s incomplete**: Performative sovereignty **requires institutional enablers** (a weak Parliament, compliant media) and **collapses when confronted with legal/hard borders**. The Miller case and backstop negotiations proved rhetoric couldn’t override constitutional or geopolitical realities.  

  ### **Conclusion: A Self-Undoing Performance**  
  Brexit revealed performative sovereignty as a **high-risk gambit**. The WotP frame initially overrode complexity but ultimately shattered against institutions (Parliament, courts), territorial fractures (NI, Scotland), and the impossibility of its own promise ("clean break"). It exposed populism’s core tension: it needs both to *invent* a people ("performative") and to *embody* a pre-existing one ("authenticity")—a contradiction Brexit laid bare.  

  **Recommendation for your piece**: Anchor this in the **aftermath**. The performative act succeeded in *delivering Brexit* but failed to create a coherent "people" or stable sovereignty—proving the speech act’s pyrrhic victory. The rubble of Brexit is performative sovereignty’s autopsy report.  

