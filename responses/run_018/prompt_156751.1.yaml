prompt: |-
  ok so i'm writing up my thoughts on hedonism for a reading group and want to check if this package holds together or if i'm just helping myself to contradictions. here's where i've landed: (1) pleasures are unified by a single determinable phenomenal quality — not just 'feeling good' but something like pleasantness-qua-pleasantness, with bodily and mental ones being different determinates; (2) there's no non-phenomenal feature, like a shared brain-state or uniform desiredness, that explains why they're all pleasures; (3) Mill's qualitative distinction saves hedonism, but only if we read quality as a dimension of that same determinable property, not as a seperate kind of pleasure; (4) that means a bodily pleasure can in principle be 'higher' than a mental one if its determinacy is richer, which sounds wrong but i think follows; (5) i reject the heterogeneity objection because colours are heterogeneous determinates of hue but we don't think that undermines colour realism, so why should pleasure be different? the bit i'm unsure about: does (3) smuggle in an evaluative criterion that isn't in (1)'s pure phenomenology? and is (4) actually compatble with (3), or does it turn quality into intensity in disguise? also, is (5) a false analogy since colour determinates are all visual, whereas pleasure determinates cross sensory and cognitive domains? be honest about which ones genuinely clash and which just look weird, and rank them by how costly the fix is.
