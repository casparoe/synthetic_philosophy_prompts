  So write an essay arguing whether the teleological suspension should be understood as applying only to first-order moral duties or whether it necessarily extends to second-order epistemic and communicative duties like transparency and giving reasons. Reach an actual conclusion — don't just say it depends — and defend it with specific reasons. And try to address whether this makes Abraham's silence more defensible or more disturbing. I don't need a biblography or citations, just a clear argument. Also, I might be wrong about de Silentio's framing — correct me if I'm misreading the structure of the problem.
