answer: |-
  The phrase 'absence of evidence is not evidence of absence' frequently surfaces in debates surrounding pseudohistorical claims, functioning as a rhetorical shield against scepticism. Its invocation, however, masks a complex interplay of distinct philosophical theses concerning both our knowledge of the past and the past itself. To evaluate its legitimacy and limitations within historical methodology, we must disentangle its precise meanings, differentiating epistemic claims about our current evidential state from ontological claims about historical reality, and further distinguishing how we conceptualise the historical record – either as a purportedly complete sample or as an inherently open population.

  One primary reading is a purely epistemic claim about justification: the mere fact that we currently lack evidence for a specific historical proposition P does not, in itself, constitute positive evidence that P is false. This asserts a logical point – non-detection is not equivalent to confirmation of non-existence. In this minimal form, it functions as a trivial platitude, a reminder of basic inferential caution. It applies equally to Atlantis narratives and Fomenko’s statistical arguments concerning archival gaps; demanding positive proof for non-existence is often an unreasonable burden. However, this reading offers only the weakest defence for pseudohistory. It merely prevents the immediate dismissal of a claim *solely* because no evidence has yet been presented for it; it does nothing to establish the claim’s plausibility, nor does it shield the claim from being deemed highly improbable based on the overwhelming weight of *other* evidence and established understanding.

  A more substantive, yet often conflated, epistemic claim suggests that absence of evidence *leaves the probability of P unchanged*. This, however, is demonstrably false in most historical contexts. Absence of evidence *can* become evidence of absence, and significantly so, under specific conditions. If we reasonably expect that evidence for P *should* exist and be detectable should P be true, and we have conducted a diligent search within a relevant domain without finding it, then this absence *lowers* the probability we assign to P. This is particularly potent when dealing with claims that should leave substantial, unambiguous traces. The absence of any credible archaeological, genetic, linguistic, or textual evidence for a technologically advanced, globe-spanning Atlantis civilisation precisely when and where Plato placed it, despite extensive investigation, does indeed constitute strong evidence against its historical existence as described. Fomenko’s revisionism, however, attempts to exploit genuine archival incompleteness. While the absence of a *specific* expected medieval record might sometimes be attributable to random loss (an open population scenario), Fomenko’s systematic dismissal of vast chronological frameworks based on *patterns* of absence, while ignoring the immense volume of corroborating evidence across disciplines (coinage, astronomy, dendrochronology, parallel chronicles), misapplies this principle. He treats the record as far more complete and uniformly reliable than it is, turning gaps into evidence for a radical hypothesis, whereas proper historical practice weighs the *likelihood* of such pervasive evidence vanishing versus the hypothesis being wrong.

  This leads to the ontological dimension sometimes smuggled into the slogan: the implication that gaps in the historical record directly correspond to gaps or mysteries in past reality itself. This is a fallacy. The past happened; it is fixed. Gaps reside solely in our *knowledge* and *records*. While an open population view acknowledges that records are always partial and subject to loss, this does not license inferring that *any* event for which evidence is absent could therefore have occurred. The absence itself tells us nothing specific about the past; its significance is derived entirely from our background knowledge about what kind of evidence *should* likely exist, the reliability and coverage of surviving sources, and the processes of evidence creation and preservation. For Atlantis, the ontological leap from ‘we haven’t found proof’ to ‘therefore it might well have existed as described’ ignores the fact that its described existence *requires* evidence we demonstrably lack and contradicts evidence we abundantly possess. For mathematically framed revisionism like Fomenko’s, the ontological error lies in treating the mathematical *description* of archival gaps as having a direct, unmediated ontological significance for reconstructing the chronology of events, bypassing the need for coherence with the vast web of established historical evidence from diverse sources and methods.

  Finally, the distinction between viewing historical records as a closed sample versus an open population is crucial. If we could treat a specific archive as a complete, closed sample (e.g., all surviving administrative documents from a particular medieval chancery known to be fully preserved), then the absence of a record where one is structurally mandated *would* be strong evidence of absence for the corresponding event within that specific bureaucratic domain. However, historical records are almost never such closed populations; we know documents decay, are lost, destroyed, or never created. An open population view rightly cautions against overinterpreting a single absence. Pseudohistory, however, often exploits this valid caution. Proponents of ancient astronaut theories or Atlantis treat the *entirety* of the archaeological and historical record as if it were a closed sample that has been exhaustively searched and found wanting only for their specific claim, thereby justifying its possibility. This is disingenuous; the record is vast, fragmented, and constantly reinterpreted, but claims must still conform to its overall contours. Fomenko, conversely, treats the surviving chronicles *as if* they were a closed, representative sample for all medieval history, making the absence of expected references evidence for chronological compression, rather than acknowledging the open, fragmentary nature of the source base and the overwhelming counter-evidence from non-textual sources.

  Thus, while the slogan captures a kernel of logical caution – we cannot deduce non-existence from mere current non-detection in isolation – its invocation in pseudohistorical discourse typically relies on stronger, often fallacious, interpretations. The trivial epistemic platitude does not genuinely support the pseudohistorical move; it only prevents an overly simplistic refutation. The more substantive claims – that absence leaves probability unchanged, or that gaps in the record imply ontological mysteries – are generally false or misleading. The open population nature of historical evidence mandates caution against overinterpreting isolated absences, but this cannot rescue claims fundamentally contradicted by the existing evidence corpus or requiring implausible patterns of evidence loss. Atlantis claims founder not just on absence, but on the positive evidence contradicting their scenario; Fomenko’s revisionism misapplies statistical reasoning to absence within a mischaracterised source base while ignoring the consilience of evidence supporting the established chronology. The philosophy of history must therefore recognise the slogan’s limited validity while firmly rejecting its misuse to insulate empirically vacuous or contradictory claims from legitimate scepticism based on the total weight and structure of historical evidence.
