  For the disagreements table, I'll craft parallel statements. On harm reduction vs displacement: Nordic would say criminalizing buyers reduces exploitation while decrim would argue it pushes work underground. On exit services: Nordic sees them expanding choice, decrim sees conditional welfare undermining autonomy. On labor logic: decrim argues standard contracts suffice, Nordic insists on special regulation due to intimacy. On licensing: decrim highlights disadvantage to unregistered workers, Nordic argues oversight enables protection.

