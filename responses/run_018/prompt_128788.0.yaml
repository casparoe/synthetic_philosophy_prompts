  Now, applying universal/particular distinction. Universals: what is "humanity"? If it's a substance sortal (essential), then Gregor can't lose it without ceasing to exist. But he persists, so perhaps humanity is phase sortal. However, his consciousness remains human, complicating that. Particulars: Gregor as an individual. Bundle theory says objects are collections of properties. If Gregor’s properties change (body to insect), is it the same bundle? But key mental properties persist. Bare particular theory posits a substratum that remains the same. Gregor’s persistent self-awareness might support this, but his physical change challenges it.

  Where the reading breaks: Kafka’s text resists neat categorization. The family’s treatment of Gregor—shifting from care to seeing him as an "it"—shows that identity is also external, relational. Metaphysical theories focus on intrinsic properties, but the story highlights extrinsic factors. Bundle theory struggles because core properties (like consciousness) persist, but the family perceives a different object. The apple scene symbolizes this clash—Gregor is victimized as an insect, but his suffering is human. This ambiguity makes it hard to fit into strict metaphysical frameworks.

