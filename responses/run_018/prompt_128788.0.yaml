answer: |-
  Let's approach this systematically, respecting both Kafka's literary complexity and the metaphysical precision you require.

  **Step 1: Brainstorming Gregor's Identity Over Time in the Text**
  *   **Initial Transformation:** Gregor awakens with an insect body but unequivocally human cognition, memory, emotions (concern for job, family, furniture), and intentionality (trying to get out of bed). The "self" feels continuous. The family, horrified, still initially refers to him as "he," acknowledging the person within.
  *   **The Crucial Duality:** The core tension is sustained: Gregor's *internal* world remains distinctly human – he worries about finances, feels shame, desires connection, appreciates music, experiences complex emotions like guilt and love. His *external* form is undeniably non-human, repellent, and increasingly insectile in behavior (crawling walls, dietary changes).
  *   **The Apple Scene (Pivotal):** The father throws apples not at an abstract "monster," but in rage at the *failure* of the son (the provider). The lodged apple becomes a symbol of this failed relationship and Gregor's decaying physical state. Gregor's suffering is intensely *felt* and described with emotional weight – it's not merely an insect's injury. The family's reaction mixes horror and a lingering sense of responsibility ("his mother... implored his father to spare Gregor's life").
  *   **Grete's Shift & Linguistic Dehumanization:** Grete's transition from caretaker to primary advocate for removal ("we must try to get rid of *it*") is key. The shift from "he" to "it" in the family's discourse (especially Grete's final pronouncement: "It has to go... that is *not Gregor*") marks a *social* death preceding the physical one. This reflects their judgment: the human essence is gone *because* the body is irredeemably alien and the social function (provider) is unfulfilled. They cease to see the internal Gregor.
  *   **Gregor's Death & Aftermath:** Gregor's final thoughts are of love and release. His death is described as peaceful, almost human ("He still saw... then his head sank... and his last breath flowed faintly from his nostrils"). The family's immediate relief and focus on their *own* future potential underscores that Gregor, *as Gregor*, ceased to exist for them socially *before* he died physically. They shed the identity of "Gregor's family."

  **Step 2: Applying Universal/Particular Distinction & Sortal Concepts**
  *   **Humanity as Substance Sortal?** If "human" is a substance sortal (defining the *essence* of what Gregor *is*), then the transformation *cannot* be merely physical. Either:
      *   Gregor ceases to exist entirely at the moment of transformation (replaced by an insect coincidentally sharing his memories – the text strongly refutes this; the *I* persists).
      *   The essence of "human" must include something non-bodily (e.g., rational soul, consciousness). Gregor's persistent inner life strongly supports this view *from his perspective*. He remains an instance of the universal "human" *in essence*, despite the accident of his body.
  *   **Humanity as Phase Sortal?** If "human" is a phase sortal (like "child"), Gregor could transition *out* of being human into a new phase (being an insect) while remaining the same particular object. This aligns better with the *family's eventual perspective*: Gregor *was* human, but *is now* an insect. The phase "human" ended with the loss of the human form and social role.
  *   **The Text's Challenge:** Kafka presents both views simultaneously. *Gregor* experiences himself via the substance sortal view (essential humanity persists). The *family* (and society) shift to the phase sortal view (humanity is contingent on form/function). The novella forces us to ask: *Which perspective determines the instantiation of the universal?* Is it intrinsic (Gregor's mind) or extrinsic (family/society's recognition based on form/function)? The text tragically sides with the extrinsic: Gregor *becomes* non-human *because* he is treated as non-human, regardless of his mind. The universal "human" requires social instantiation.

  **Step 3: Bundle Theory vs. Bare Particular**
  *   **Bundle Theory:** Gregor is a collection of properties. Pre-transformation: {Human-body, Provider-role, Brother-role, Son-role, Concerned-mind, Human-form...}. Post-transformation: {Insect-body, Burden-role, Disgusting-presence, Concerned-mind (initially), Insect-form...}. As the bundle changes radically (loss of human-form/body, provider-role; gain of insect-form/body, burden-role), bundle theory suggests this is a *different object*. This aligns with the family's ultimate "it" designation. The persistent "concerned-mind" property is a problem, but it too degrades over time.
  *   **Bare Particular:** There is a substratum "X" (Gregor-as-particular) that *has* changing properties. The same "X" first has human properties, then insect properties. The persistence of memory, intentionality, and self-awareness *despite* the bodily change strongly supports this view *from Gregor's perspective*. The "I" that experiences is the bare particular underlying the changing accidents.
  *   **The Text's Challenge & Breakage:** The novella pushes back by showing both accounts are incomplete *metaphysically* and *existentially*.
      *   **Against Pure Bundle Theory:** Gregor's inner narrative continuity screams against being a *wholly* new object bundle. The core of his identity (his memories, cares, self-awareness) persists through the bundle shift. Bundle theory struggles to explain *this specific continuity* as anything other than a new bundle coincidentally linked by memory.
      *   **Against Bare Particular:** While Gregor's subjective experience supports a persisting "I," the *social reality* of his existence completely negates it. The bare particular may persist, but without the recognition *as human* by the community that defines the universal's instantiation, the "human Gregor" functionally ceases to be. The apple scene is the violent enactment of this – the father attacks the *bare particular* perceived *only* as an insect-bundle. Gregor's internal humanity is irrelevant to the act.
      *   **The Breakdown Point:** Kafka exposes a gap in purely ontological accounts. The novella insists that *what it is to be human* involves an irreducible *relational* component – being recognized *as human* by others within a social context. Metaphysical theories focusing solely on intrinsic properties (whether bundled or borne by a substratum) cannot fully capture Gregor's tragedy. His "humanity" (the universal instantiated) is not just a matter of his intrinsic mental properties (which persist) or his physical form (which changes), but crucially depends on the *sustained recognition* by his family. When that recognition is withdrawn ("it", "not Gregor"), his *social identity* as a human person is extinguished, even while the bare particular with human-like consciousness lingers. The text pushes back by making the *relational* and *social* dimensions constitutive of identity, not just accidental properties.

  **Conclusion:**
  Kafka’s *The Metamorphosis* suggests that the universal "human" is instantiated not solely through intrinsic biological or mental properties (challenging a purely substance sortal view based on mind or body), nor as a simple temporary phase (challenging a purely contingent phase sortal view), but fundamentally through *recognition within a web of social relations and expectations*. Gregor retains the intrinsic properties most associated with human consciousness (supporting a bare particular view), yet ceases to *be* human in the world because his family ceases to recognize him as such and his body fails its social function (aligning with bundle theory's implication of a new object defined by its current properties). The novella breaks metaphysical frameworks by demonstrating that social death precedes and defines ontological death; the instantiation of "humanity" requires a community willing to see it.

  Summary: Kafka shows humanity's instantiation depends less on intrinsic properties (mind/body) and more on social recognition, tragically revealing that Gregor ceases to be human when his family stops seeing him as one.
