answer: |-
  ### Core Desiderata for a Theory of Causation in the Occasionalism Debate  
  *(Ranked by Non-Negotiability)*  

  1. **Preserving the Miracle/Nature Distinction (Non-Negotiable)**  
     **Reasoning:** If divine action *cannot be distinguished* from natural causation, theology collapses. Miracles must be recognizably distinct violations of the natural order to serve as divine signs (Quranic *āyāt*). Occasionalism must explain why fire *usually* burns but *sometimes* doesn’t (e.g., Ibrahim in the fire) without reducing all events to identical divine acts. Fail this, and religion loses its empirical grounding.  

  2. **Saving Induction from Emptiness (Non-Negotiable)**  
     **Reasoning:** If observed regularities (e.g., fire burning cotton) are not *reliably projectable*, science and daily survival fail. Occasionalism’s "habit" (ʿāda) of God must provide a *metaphysical foundation* for expecting consistency. Without this, "laws of nature" are psychological illusions (Hume’s error), making empirical knowledge impossible. Al-Ghazālī’s "habit" must be *objectively stable*, not arbitrary.  

  3. **Avoiding Collapse into Divine Whim (Non-Negotiable)**  
     **Reasoning:** If God’s actions are *utterly capricious*, "laws" lose all meaning and theology implodes. God’s wisdom (*ḥikma*) requires that His habits reflect purposeful, consistent will—not randomness. If laws are purely whimsical, prayer, morality, and divine promises become incoherent. Occasionalism must ground God’s regularity in divine rationality, not brute will.  

  4. **Modal Compatibility (Modern Preference)**  
     **Reasoning:** The demand that "causal failure shouldn’t shatter modal links" (e.g., fire *must* burn unless miraculously suspended) imports *necessitarian metaphysics* foreign to occasionalism. Al-Ghazālī explicitly rejects inherent "must" in nature (*Tahāfut* XVII). This desideratum assumes causal powers exist in objects—begging the question against occasionalism. It’s a power-theory bias, not universal.  

  ---  

  ### The Decisive Failure  
  \answer{**Saving Induction from Emptiness**}  
  Occasionalism’s Achilles’ heel is grounding induction. Al-Ghazālī’s "habit of God" is either:  
  - **Stable but unexplained:** If habits are necessary, God isn’t free; if contingent, induction lacks foundation.  
  - **Circular:** We trust induction because of God’s habit, but we know the habit only through induction.  
  Humean regularity at least offers psychological consistency; power theories ground projection in object capacities. Occasionalism offers *no non-theological basis* for expecting sunrise tomorrow—making science parasitical on faith.  

  **Verdict:** Occasionalism fatally undermines empirical rationality while succeeding only in preserving divine sovereignty and miracles.
