  I am a high school senior in an advanced ethics course, and over the weekend I was discussing with my friends a position our instructor mentioned briefly—tranquilism, the view that only the absence of craving and suffering matters, while positive goods like joy, achievement, or love are at best neutral. My friends immediately said this is just negative utilitarianism or Buddhist non-attachment repackaged, but I think there is a hidden assumption everyone is missing, and I want to develop it for my summer independent-study grant application. My half-formed idea is that tranquilism is usually treated as a claim about welfare, yet it may secretly presuppose a specific claim about mental architecture: namely, that craving is not merely one desire among others but a kind of pervasive “attentional gravity” that structures the qualitative character of every other mental state. If that is correct, then eliminating craving does not simply subtract suffering; it alters the ontology of whatever mental life remains, making the tranquil state structurally different from ordinary contentment rather than just a quieter version of it. I need you to turn this into a formal two-page research proposal that includes: a precise statement of the research question distinguishing tranquilism from both hedonism and negative utilitarianism; an explanation of why standard classroom discussions leave this architectural claim unexamined; a month-by-month method relying on conceptual analysis and close reading of primary texts I will select later, with no empirical lab work required; a clear account of what a successful conclusion would look like versus what specific failure conditions would show the project is too ambitious for one semester; and an honest assessment of scope and risk. Please do not include a bibliography, citation list, or reading recommendations—I will add references myself, and I am working without access to verify specific editions or page numbers.
