  hey so i need you to argue for a kind of 'plural fundamentality' view in metaphysics — not just that different domains have different fundamental entities (which is old hat), but that fundamentality itself is relation-specific rather then entity-specific. like, the idea is that spacetime points might be fundamental relative to macroscopic objects but not relative to quantum field configurations, and that there's no fact of the matter about which is 'really' more basic outside of a specific explanatory project. make the case that this dissolves the usual grounding-chain regress problem, since there's no single chain to bottom out, but also defend it against the obvious objection that it collapses into anti-realism or just makes fundamentality too cheap. keep it conceptual — don't cite specific papers or authors, just build the argument. also try to work in why this view handles the 'grounding of grounding' problem better then standard hierarchical views, without just saying its obvious.
