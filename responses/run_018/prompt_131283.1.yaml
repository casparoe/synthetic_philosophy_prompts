  The climate analogy actually works better than I expected! Global climate forcings (like CO2) parallel Kepler's celestial angles as aggregate influences, while local weather chaos mirrors how "particular mixtures of matter" obscure individual outcomes. But crucially, Kepler's framework lacks modern physics' uniform material substrate - his "dispositions" imply purposeful responses alien to mechanistic models. 

