prompt: |-
  i was chatting with a friend about that philosphy problem where you can technically have a reason for something but it's the wrong "kind" — like bribing yourself to think a painting is beautiful, or being moral just because you'll get caught otherwise. she said it feels like there's an invisible filter on motives that nobody can quite explain but everyone gets mad if you break, and we started joking about what it would look like if the goverment actually tried to audit people's reasons the way they audit taxes.

  anyway, i want you to write a satirical deadpan memo, about 650 words, formatted like an internal bureaucratic document from a fictional "Bureau of Axiological Hygiene." the voice should be a tired mid-level bureaucrat announcing a pilot program where citizens must file all reasons for belief and desire through an audit system, with numbered clauses, form templates, and rejection codes. the satire should come from actually getting the philosophical distinction right — right-kind vs wrong-kind reasons, the bootstrapping worry where you try to want-to-want something for its own sake, whether second-order reflection can "convert" a bad reason into a good one — but pushed into absurd administrative detail. include an invented case study of "Citizen M" who gets flagged for admiring a symphony because it improves her job prospects, then files Form 27-B to reflectively endorse her admiration, but gets rejected again for "meta-instrumentality." don't name real philosophers or use real quotes; just write from what you know. keep it readable for someone who doesn't know the jargon, but make sure a specialist sees you got the distinction right. no citations or reading lists needed, this is just creative writing. maybe throw in a typo or two since i'm writing this casually.
reasoning: |-
  Okay, the user wants a satirical memo from a fictional "Bureau of Axiological Hygiene" that parodies auditing reasons for beliefs and desires. Let me unpack their request. 

  First, the core inspiration is the philosophical problem of "wrong kind of reasons" - like bribing yourself to appreciate art. The user mentioned examples: admiring a painting for money or being moral only to avoid punishment. They want the satire to nail the philosophical distinctions while wrapping it in bureaucratic absurdity. 

  Key elements to include:
  - A deadpan, tired bureaucrat voice
  - Pilot program with forms, rejection codes, and procedures
  - Citizen M case study showing recursive failure (admiring symphony for job → Form 27-B → "meta-instrumentality" rejection)
  - Must correctly handle concepts like:
    * Right-kind vs. wrong-kind reasons distinction
    * Bootstrapping paradox (trying to "want to want" intrinsically)
    * Whether reflection can convert bad reasons to good ones
  - Accessibility for non-philosophers but accurate enough to satisfy specialists
  - Bureaucratic touches: typos, dense numbering, invented forms

  User’s deeper needs:
  They’re clearly philosophically literate (casually references "bootstrapping worry" and "second-order reflection") but want creativity over academia. The humor should stem from:
  1) Bureaucracy invading private mental states 
  2) Administrative solutions failing to solve philosophical paradoxes
  3) The inherent absurdity of quantifying motives

  Potential pitfalls to avoid:
  - No real philosopher names/quotes (per request)
  - Don’t over-jargon; explain through context (e.g., "axiological hygiene" as value-cleanliness)
  - Keep satire sharp by making the bureaucracy *competent* at misapplying sound philosophy

  Structural approach:
  Memo format → Policy rollout → Procedures → Case study → Rejection rationale. Citizen M’s arc should showcase the central irony: reflection can’t sanitize instrumental motives because the "meta" layer remains contaminated by the original flaw. The "meta-instrumentality" rejection code is perfect - it implies the system correctly identifies higher-order contamination while being utterly nonsensical administratively.

  Final polish: Add bureaucratic "tells" like:
  - Unnecessary capitalization ("Proper Motive Alignment")
  - Passive-aggressive footnotes (e.g., *See Form 11-K, line 7b*)
  - One deliberate typo ("commensensurate")
  - Painfully precise rejection reasons that feel legally valid but philosophically tragic
