answer: |-
  ### **Extended Mind Thesis: In-Class Game**  
  **"Boundary Blur: The Joint Reasoning Challenge"**  

  **Core Goal:** Make students viscerally experience the "fuzzy boundary" between internal cognition and external artifacts/partners, per Clark & Chalmers' extended mind thesis. The game forces them to confront where reasoning "lives" (in-head vs. in-artifact vs. in-partner).  

  ---

  ### **Setup & Rules**  
  **Materials:**  
  - **Decision Tree Template** (1 per pair): A printed legal liability puzzle with 5–7 branching nodes and blank "Reasoning" boxes (see example below).  
  - **Pens/Pencils:** 1 per pair.  
  - **Role Cards:** "Voice" and "Hand" cards (randomly assigned).  
  - **Timer:** For strict 20-minute activity.  

  **Roles:**  
  - **Voice:** Can *speak* but **cannot touch the pen/template**. Must verbalize ideas, questions, and decisions.  
  - **Hand:** Can *write/annotate* the template but **cannot speak**. Can only communicate via gestures (pointing, nodding, facial expressions) and writing *on the template itself*.  

  **Task:**  
  - Pairs have 20 minutes to solve a **legal liability puzzle** by filling out the decision tree.  
  - They must reach a verdict (e.g., "Who is liable?") by annotating reasoning at each node.  
  - **Critical Constraint:** The template is their *only* shared artifact. No extra paper or devices.  

  ---

  ### **Legal Liability Puzzle Example**  
  **Scenario:**  
  *A delivery driver for "QuickBite" crashes into a pedestrian while using a personal phone for GPS (against company policy). The pedestrian was jaywalking. The driver claims the app malfunctioned. Who is liable?*  

  **Decision Tree Template Snippet:**  
  ```  
  START: Driver crashes into pedestrian.  
  │  
  ├── NODE 1: Was driver on duty?  
  │   ├── YES → Go to NODE 2  
  │   └── NO → Go to NODE 3  
  │  
  ├── NODE 2: Was driver using phone for work?  
  │   ├── YES → [Hand writes reasoning] → Go to NODE 4  
  │   └── NO → [Hand writes reasoning] → Go to NODE 5  
  │  
  ├── NODE 3: Was driver acting as company agent?  
  │   └── ...  
  │  
  └── FINAL VERDICT: [Hand writes liability decision + reasoning]  
  ```  
  *(Full tree has 5–7 nodes with blank "Reasoning" boxes.)*  

  ---

  ### **Timeline (75-Minute Session)**  
  | Time  | Phase                  | Instructions                                                                 |  
  |-------|------------------------|-----------------------------------------------------------------------------|  
  | 0–10  | Intro & Setup          | Explain rules, assign random roles, distribute materials. Emphasize: *"Your cognition is fused with the artifact and partner."* |  
  | 10–30 | Joint Reasoning (20 min)| Pairs fill the tree. **Instructor circulates to enforce role rules.**       |  
  | 30–35 | Artifact Removal       | **Collect all templates/pens.** Separate partners to opposite sides of the room. |  
  | 35–45 | Individual Recall      | Ask each student (privately): *"Walk me through step 3 of your reasoning. What was decided at Node 3, and why?"* (Students write answers silently.) |  
  | 45–55 | Reconvene & Compare    | Pairs reunite. Share their Node 3 answers aloud. **Highlight discrepancies:** "Did you both recall the same reasoning? Whose idea was it?" |  
  | 55–75 | Debrief & Discussion   | Map game experiences to theory. Focus on "fuzzy boundary" moments.           |  

  ---

  ### **Payoff Scheme**  
  - **Shared Participation Points:**  
    - **2 points** if both partners *independently reproduce identical Node 3 reasoning*.  
    - **1 point** if answers diverge (which is expected!).  
  - **Why this works:** Most pairs will fail to reproduce identical steps. Students will:  
    - Attribute reasoning to the *artifact* ("It was written on the tree!").  
    - Disagree on whose belief it was ("I said that!" vs. "No, I wrote it!").  
    - "Misremember" steps that were offloaded to their partner or the template.  

  ---

  ### **Predictable Breaks & Fixes**  
  **Problem 1:** *Voice dominates, Hand becomes passive scribe.*  
  - **Fix:** Add a rule—**Hand can "pause" Voice by circling a node** to demand clarification. Voice *must* re-explain before proceeding. Forces collaboration.  

  **Problem 2:** *One partner memorizes the tree.*  
  - **Fix:** Use **complex branching** (e.g., 5+ nodes). Too much to memorize in 20 min. In recall phase, ask **specifically about reasoning** (not just answers).  

  **Problem 3:** *Pairs ignore the tree and just talk.*  
  - **Fix:** Require **written annotations at every node** to reach a verdict. No writing → invalid solution.  

  ---

  ### **Debrief Framework**  
  **Map to Clark & Chalmers:**  
  - **Parity Principle:** "When you cited the tree’s annotations as if they were your own thoughts, that’s parity! Your brain treated external marks as internal memory."  
  - **Coupling-Constitution Objection:** "When the artifact was taken away, your reasoning collapsed. Was it *coupled* (just interacting) or *constitutive* (part of your mind)? The failure suggests constitution."  
  - **Functionalist Gap:** "This game *can’t* show if the system is reliably available or automatically endorsed (functionalist criteria). That’s next week’s lecture!"  

  **Highlight "Fuzzy Boundary" Moments:**  
  - "Hand wrote something Voice didn’t fully internalize."  
  - "Voice argued for X, but Hand wrote Y—and both claimed ownership later."  
  - "You pointed at the tree saying, ‘*This* is why!’—but it wasn’t inside either of you."  

  ---

  ### **Why This Works**  
  - The artifact acts as a **coupled system** that feels like "shared memory."  
  - Removing it *exposes* dependency: Students can’t reconstruct steps they *thought* they internalized.  
  - The payoff scheme **rewards failure**—divergent recall proves the thesis better than success.  

  **Pro Tip:** Keep it loose. If pairs cheat roles, use it in debrief: *"Did breaking rules clarify where cognition lived?"* Lean into the chaos—it’s data!  

  Let me know if you want the legal puzzle expanded or tweaked! 🧠➡️🌐
