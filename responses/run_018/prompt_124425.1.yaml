     - Tell them: "Without discussing with your partner, write down step 3 of the reasoning process you just did. Be as specific as you can about what was decided at that step and why."
     - They write individually (allow about 5 minutes for writing).
     - Meanwhile, the instructor collects the responses.

  5. Reconvene and Compare (10 minutes):
     - Bring the pairs back together.
