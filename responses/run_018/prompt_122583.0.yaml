prompt: |-
  I'm TAing the advanced decision theory module this term and I've got a stack of these to get through before Monday, so I want a second read on one of them before I settle on how harsh to be. I've taken the name off and fixed the formatting, otherwise this is verbatim.

  The question (25 marks):

  Throughout, a "policy" for a UDT agent is a function from the agent's total observations to its available actions, and UDT ranks such functions by expected utility computed with the agent's prior rather than its posterior.

  (a) State what updateless decision theory prescribes in each of the following, with one sentence of justification each. (9 marks)
  (i) Newcomb's problem with a predictor who is accurate 99% of the time. If it predicted you would take only the opaque box, that box contains $1,000,000; if it predicted you would take both, it contains nothing. The transparent box always contains $1,000, and you keep whatever is in the boxes you take.
  (ii) The counterfactual mugging. A perfectly trustworthy predictor flips a fair coin out of your sight. If it lands heads it asks you for $100, and you either pay or don't. If it lands tails it pays you $1,000 iff it predicts that you would have paid had the coin landed heads. You are then truthfully told that the coin landed tails and that no request will be made.
  (iii) A one-shot prisoner's dilemma against an exact copy of your own decision algorithm, running on different hardware but given the same inputs as you.

  (b) State the principle that unifies these three verdicts, and explain what exactly the agent is supposed not to be updating. (6 marks)

  (c) Omega, who is fully trustworthy, tells you: "I flipped a fair coin and I am now truthfully telling you the result. If it came up heads, I have placed in the next room an exact copy of your decision algorithm, running on the same inputs as you, and the two of you will now play a one-shot prisoner's dilemma against each other: (C,C) = 3,3; (D,D) = 1,1; (C,D) = 0,5; (D,C) = 5,0. If it came up tails, I have placed in the next room a stranger who attended the same unusual decision-theory boarding school as you. Because of that shared upbringing there is a 90% chance they choose whatever you choose — but this is purely a matter of common cause: the upbringing is over and done with, their algorithm shares no code with yours, and nothing you decide determines, or is determined by, or causally influences what they decide." Omega then says: tails. (10 marks)
  (i) What does UDT do?
  (ii) Would it do something different if Omega had said heads?
  (iii) If your answers to (i) and (ii) differ, explain why that is not just ordinary Bayesian updating — say what the agent is still being updateless about.

  The student's answer:

  (a) (i) One-box. The money is already in the box either way, but a UDT agent doesn't reason causally; it asks which policy has the higher expected utility from the prior, and since the predictor is 99% accurate, one-boxing is near-conclusive evidence that the million is there, so the policy "always one-box" looks far better ex ante than "always two-box".
  (ii) Pay the $100. Scored from the prior, the policy "pay if asked" is worth ½(−$100) + ½($1,000) = $450 and "refuse if asked" is worth $0, so the agent pays. The fact that it already knows the coin came up tails is irrelevant: UDT ranks policies, not actions, and it ranks them with its prior.
  (iii) Cooperate. The copy is running your decision procedure on the same inputs, so its output is guaranteed to match yours; you are therefore choosing between (C,C) = 3 and (D,D) = 1, and 3 beats 1. This is really just Hofstadter's superrationality — the idea that rational agents faced with the same problem will arrive at the same answer and are entitled to rely on that — made precise.

  (b) The unifying principle is that the agent picks the policy maximising expected utility computed with its prior probabilities, where the relevant dependence is logical rather than causal: it asks what would follow from the output of its own decision procedure, and so from the outputs of every sufficiently similar decision procedure. "Updateless" means the agent never conditions on its evidence. It scores whole policies from the standpoint of the prior, then executes whatever the winning policy prescribes, so its uncertainty stays frozen at the prior.

  (c) (i) Cooperate. Two reasons. First, the agent is updateless, so the fact that Omega has told it "tails" cannot enter the calculation: it has to pick the action that is best from the ex ante point of view, and ex ante it might well be facing its own copy, where cooperating gets 3 rather than 1. Second, even in the tails branch there is a 90% chance the stranger does what you do, so cooperating is strong evidence that they cooperate: 0.9 × 3 + 0.1 × 0 = 2.7, against 0.9 × 1 + 0.1 × 5 = 1.4 for defecting. Both routes agree.
  (ii) Heads: also cooperate, since the copy is running your algorithm and you get (C,C) = 3. Same answer either way.
  (iii) Nothing to explain, because the answers don't differ — and that is the whole point of being updateless. The ranking of the options is fixed once and for all at the prior; learning which branch you are in changes your beliefs about the world but not what you ought to do. If learning it did change what you ought to do, UDT would just be evidential decision theory with extra steps.

  What I'd like from you: a mark out of 25, a rough split of the marks across (a), (b) and (c), and point-by-point comments I could adapt into actual feedback — what they got right and why it's right, anything that sounds right but doesn't survive scrutiny, what a correct answer to each part of (c) would say, and how much each slip should actually cost them. I'd rather not over-deduct for something that's just an inelegant way of putting a correct thought, and I'd rather not hand out marks for prose that reads well but is wrong. If you think two parts of the answer pull against each other, say so. And if you think there's a reading of the question on which the student is fine, tell me that too, because then I need to fix the question rather than the mark.
reasoning: |-
  Alright, let me tackle this TA's request. The student's answer is for an advanced decision theory assignment on Updateless Decision Theory (UDT). The TA needs a second opinion on grading and feedback. 

  First, I need to recall how UDT works. The core idea is that agents evaluate entire policies (mapping observations to actions) based on prior probabilities, not updating on evidence. The key is logical dependence between decision-makers, not causal influence.

  Looking at part (a):
  - For Newcomb's (i), the student says one-box because the policy of always one-boxing has higher expected utility from the prior. That's spot on. UDT ignores the causal structure and focuses on the correlation with the predictor.
  - Counterfactual mugging (ii): Paying $100 is correct. The policy "pay if asked" yields better prior expected utility. The student correctly dismisses the current knowledge of tails as irrelevant. Good.
  - Prisoner's dilemma with a copy (iii): Cooperate is right. The student understands that identical algorithms will output the same action, making (C,C) optimal. Superrationality reference is appropriate.

  Part (b) is well-handled. The unifying principle is prior-based policy optimization with logical dependence. "Never conditions on evidence" is precise. Full marks here.

  Now part (c) is where issues start. The scenario involves Omega flipping a coin: heads means playing PD against an exact copy, tails against a correlated stranger. Omega announces tails.
  - The student says cooperate for two reasons: updatelessness requiring ex ante evaluation, and 90% correlation making cooperation better even in tails. 

  But here's the problem: UDT doesn't ignore the information that it's tails. The policy is chosen ex ante, but it's a function from observations to actions. The observation "Omega says tails" is an input to the policy. So the agent must consider what the policy prescribes upon hearing "tails". 

  Ex ante, the agent considers:
  - If policy says cooperate upon heads: gets 3 against the copy.
  - If cooperate upon tails: gets 3 with 90% probability (if stranger matches) but risks 0 if they defect. Expected utility is 0.9*3 + 0.1*0 = 2.7.
  - If defect upon tails: gets 5 if stranger cooperates (10% chance) but only 1 if they defect (90%). Expected utility 0.1*5 + 0.9*1 = 1.4.

  So cooperating upon hearing tails is indeed better. But the student's first reason ("can't use Omega's announcement") is misleading. UDT does use the observation to select the action specified by the optimal policy. The policy itself can have different behaviors for "heads" and "tails" observations.

  For (c)(ii), if Omega says heads, cooperating is correct because the copy will do the same. But the student's answer implies the action is the same regardless of the announcement, which is true here but for the wrong reasons.

  (c)(iii) is wrong because the student claims answers don't differ, but actually UDT would defect if the correlation were 0% in tails scenario. The uniformity of action comes from the specific 90% correlation making cooperation optimal in both cases, not from updatelessness mandating identical actions.

  The main error is misunderstanding how observations factor into policies. The student thinks UDT ignores the current observation entirely, but actually the policy uses observations to determine actions. The prior ranking is over policies that respond to observations.

  For grading: 
  - (a) is perfect (9/9). 
  - (b) is excellent (6/6). 
  - (c) gets partial credit: correct actions but flawed reasoning. The calculation in (i) is right (3 marks), but the first reason is incorrect. (ii) is correct but incomplete (1 mark). (iii) is wrong (0). So (c) gets 4/10.

  Total 19/25. Feedback should clarify the policy's use of observations and why uniformity of action isn't inherent to UDT but depends on the specifics.
answer: |-
  ### Marking and Feedback  
  **Total: 19/25**  
  - (a): **9/9** (Perfect)  
  - (b): **6/6** (Excellent)  
  - (c): **4/10** (Partially correct actions, but flawed reasoning; see breakdown below)  

  ---

  ### (a) Verdicts: 9/9  
  **(i) Newcomb’s (One-box):**  
  - **Correct.** Justification is spot-on: UDT evaluates the *policy* ("always one-box") from the prior, and the 99% accuracy makes one-boxing dominate two-boxing in prior expected utility. No causal reasoning is involved.  

  **(ii) Counterfactual Mugging (Pay):**  
  - **Correct.** Policy "pay if asked" has higher prior expected utility ($450 vs. $0), and UDT ignores the known outcome (tails) when executing the winning policy.  

  **(iii) PD with Copy (Cooperate):**  
  - **Correct.** The copy’s identical algorithm ensures identical outputs, making (C,C) the only possible outcome if both agents are rational. Superrationality reference is apt and precise.  

  **Feedback for (a):**  
  "All three verdicts and justifications are flawless. You clearly grasp UDT’s policy-based, prior-centric approach and its reliance on logical (not causal) dependence."  

  ---

  ### (b) Unifying Principle: 6/6  
  **Correct.**  
  - **Principle:** Maximizing prior expected utility over policies, where dependence is logical (outputs of identical/similar decision procedures).  
  - **What isn’t updated:** The agent never conditions actions on its evidence; it freezes uncertainty at the prior when ranking policies.  

  **Feedback for (b):**  
  "Excellent summary. You precisely capture UDT’s core: policies are ranked ex ante via logical dependence, and evidence is ignored during execution. The phrase 'uncertainty stays frozen at the prior' is particularly apt."  

  ---

  ### (c) Omega’s Prisoner’s Dilemma: 4/10  
  #### (i) What does UDT do? (Cooperate)  
  - **Action correct, reasoning mixed (3/4 marks)**  
    - **Correct:** Cooperating *is* the right action.  
    - **Flawed reasoning:** Your first argument ("Omega’s 'tails' announcement cannot enter the calculation") misrepresents UDT. **UDT policies *do* condition on observations** (like "Omega said tails") as inputs. The policy is chosen *ex ante*, but it explicitly maps observations (e.g., "heads" or "tails") to actions.  
    - **Valid reasoning:** Your second argument (90% correlation makes cooperation better) is correct and sufficient: EU(Cooperate | tails) = 0.9×3 + 0.1×0 = 2.7, EU(Defect | tails) = 0.9×1 + 0.1×5 = 1.4.  

  #### (ii) If Omega said heads? (Cooperate)  
  - **Action correct, reasoning incomplete (1/4 marks)**  
    - **Correct:** UDT cooperates here too.  
    - **Insufficient:** You state it’s "the same answer" due to the copy, but fail to note that the *policy* might prescribe *different actions* for "heads" vs. "tails" observations. Here, cooperation is optimal in both branches, but this isn’t inherent to UDT (see iii).  

  #### (iii) If answers differ? (N/A, but answer wrong)  
  - **Incorrect (0/2 marks)**  
    - You claim answers don’t differ and that this demonstrates updatelessness. **This misconstrues UDT.** UDT *allows* actions to differ across branches if the policy dictates it. For example:  
      - If the correlation in the tails branch were 0% (stranger is independent), UDT would defect on tails (EU: 0.5×5 + 0.5×1 = 3) but cooperate on heads (EU: 3).  
    - The uniformity here stems from the **90% correlation making cooperation optimal in both branches**, not from updatelessness forbidding action changes.  

  **Feedback for (c):**  
  "Your actions for (i) and (ii) are correct, but the reasoning exposes a key misunderstanding. UDT policies *are* functions of observations (e.g., 'Omega said tails'), so the announcement isn't 'irrelevant' – it directly inputs into the policy. Your EU calculation for (i) was sound, but the first justification undermined this. For (iii), you incorrectly assumed UDT mandates uniform actions across branches. Actually, UDT can prescribe different actions for different observations if the policy optimization supports it. The actions match here only because 90% correlation favors cooperation in both cases. A correct answer would note that UDT selects a policy that *may* vary with Omega's report, but in this specific setup, cooperation dominates in both branches."  

  ---

  ### Critical Issue: Student’s Misconception  
  - **Problem:** The student conflates "not updating the prior when *ranking policies*" with "ignoring observations when *choosing actions*." UDT uses observations to determine which action the *pre-selected policy* dictates, but the policy’s ranking is prior-based.  
  - **Question Clarity:** The question is sound. The student’s error is conceptual, not due to ambiguity.  

  ### Recommended Deductions  
  - (c)(i): **−1** (for "irrelevant announcement" comment, though correct action/EU saves partial credit).  
  - (c)(ii): **−0** (action correct, but lack of nuance is non-penalty since answer is consistent).  
  - (c)(iii): **−2** (fundamental error; misrepresents UDT’s flexibility).  
  - **No penalty for prose:** Where flawed, it revealed misunderstanding, not mere inelegance.  

  ### Final Thoughts  
  "Overall, you excel at applying UDT to standard problems (a/b) but stumble on how policies interact with observations in dynamic scenarios (c). Focus on UDT’s treatment of observations as *inputs to the policy function*, not as updates to the prior. Your grasp of logical dependence is strong—this is a refinement, not a reboot. 19/25 is a solid score, but review policy conditioning to close the gap."  

  If you adjust future questions, consider adding a sub-scenario in (c) with 0% correlation to test if students recognize action divergence.
