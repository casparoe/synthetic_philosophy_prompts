prompt: |-
  You are a professional philosopher of ethics with a knack for spotting argumentative patterns. Before you answer, spend a minute brainstorming: what moves in metaethics have names, and which ones are just generic fallacies?

  I've been watching debates about moral realism vs anti-realism and I keep noticing a phenomona I don't have a word for. Here's what happens. Someone argues against realism by pointing out deep disagreement: culture A thinks honour killings are obligatory, culture B thinks they're murder. The realist replies that there's actually huge convergence on core norms — don't kill the innocent, keep promises, care for children. But then the anti-realist doesn't say 'fair point, there's convergence too'; instead they say those convergent norms aren't genuinely moral at all, they're just evolutionary heuristics or rules of social cooperation and behaviour dressed up as morality. Meanwhile, the divergent norms — the ones about honour, purity, property — those stay firmly in the 'moral' box and count as evidence that morality is made up. So convergence gets demoted out of morality, divergence gets kept inside it, and either way realism looks wrong. Its not quite No True Scotsman, because the boundary isn't drawn around 'true morality' but around what counts as moral discourse in the first place. Is there an established term for this selective reclassification? If not, can you coin one, define it precisely, and say where its edges are — for instance, does it apply when realists do the mirror-image move with evolutionary debunking? Please structure your reply like this:

  1. Brainstorm / closest neighbours (about 150 words): list the concepts you considered and why they don't quite fit.
  2. The carving (about 200 words): describe the phenomona exactly, what it is and isn't, with concrete examples.
  3. Name and definition (about 100 words): either the established term, or your proposed one with boundary conditions.
  4. Mirror cases and edges (about 150 words): does the reverse happen, and where does it blur into ordinary theory-ladenness?
  5. Bottom line (one paragraph): your verdict on whether this is a real pattern or just me seeing faces in clouds.

  Write casually but precisely. Don't give me a reading list — I can't check books right now and I want to think it through myself.
reasoning: |-
  Okay, the user is asking about a specific argumentative pattern in metaethics debates between moral realists and anti-realists. They've noticed that when realists point to cross-cultural convergence on certain norms (like prohibitions against murder or obligations to care for children), anti-realists dismiss these as merely evolutionary heuristics or social cooperation rules rather than "genuine morality." Meanwhile, the anti-realists maintain that divergent norms (like honor killings or purity codes) represent true moral discourse. The user wants to know if there's a name for this selective categorization tactic or if we should coin one.

  Hmm, I need to think about existing fallacy categories first. The user already mentioned this isn't quite No True Scotsman, and I agree - that fallacy involves redefining criteria to exclude counterexamples, whereas here the reclassification happens at the meta-level about what counts as moral discourse. It's also not the same as moving the goalposts, which is about changing success criteria for an argument. Special pleading comes closer but usually involves unjustified exemptions rather than systematic categorical shifting.

  The core issue seems to be a unilateral redrawing of the "moral" category boundaries to always disadvantage the opponent. The anti-realist makes convergence evidence disappear by demoting it to "not really moral," while preserving divergence as evidence against objectivity. It's like playing tennis where one player keeps redefining what counts as "in bounds" depending on where the ball lands. 

  For naming... since "carving" refers to how we categorize reality, and this is a tactical redrawing of category lines, maybe "Boundary-Pinning Fallacy"? Because the actor pins down the boundary only after seeing which side of it the evidence falls on. Or "Discursive Jujitsu" since it uses the opponent's evidence against them by reclassifying it. But perhaps most precisely: "Selective Demotion Maneuver" - systematically downgrading inconvenient convergence while protecting inconvenient divergence.

  I should note that realists sometimes do the mirror image with evolutionary debunking arguments - dismissing moral intuitions as "just evolved quirks" when they contradict realist theories, while treating aligned intuitions as evidence of moral truth. The line between this and ordinary theoretical disagreement is blurry, but the giveaway is when the categorization shifts situationally to always counter the specific argument being made.

  Ultimately this is absolutely a real pattern - I've seen it in a dozen debates. It's not just theory-laden observation but a dialectical strategy to immunize one's position. Smart catch by the user.
answer: |-
  Here's my breakdown of that slippery move you're spotting:

  **1. Brainstorm / closest neighbours**  
  I considered:  
  - **No True Scotsman (NTS)**: Close, but as you noted, NTS redefines the *essence* of a category ("no *true* Scotsman would...") to exclude counterexamples. Your case reclassifies *entire domains* of evidence ("that's not *moral* discourse, it's biology/social rules").  
  - **Moving the Goalposts**: Similar shifting, but usually about changing *standards* for an argument (e.g., "convergence isn't enough, now you need X"). Here, the *evidence itself* is re-categorized.  
  - **Special Pleading**: Vaguely fits (applying double standards), but lacks specificity about *how* the reclassification serves the argument.  
  - **Theory-Ladenness of Observation**: Too broad—all observations are theory-laden, but this is a *tactical* reclassification in debate.  
  None capture the *asymmetric demotion/preservation* of evidence based on convergence/divergence.

  **2. The carving**  
  This is a **dialectical maneuver where one party selectively redefines the scope of "moral discourse" to neutralize counter-evidence**:  
  - **Anti-realist version**: When realists cite *convergent norms* (e.g., "don't torture babies") as evidence for objectivity, the anti-realist demotes these to "merely prudential/biological/social" rules, stripping them of *moral status*. Simultaneously, *divergent norms* (e.g., dietary taboos) retain full "moral" labeling as evidence for subjectivity.  
  - **What it isn't**: It’s not just claiming *some* norms are biological (that’s a substantive claim). It’s the *asymmetric application*: convergent = "not really moral," divergent = "genuinely moral," ensuring *all* empirical evidence supports anti-realism.  
  - **Example**: Realist: "Every culture prohibits murder!" Anti-realist: "That’s just evolutionary kin-selection, not *morality*—but their clashing views on blasphemy? *That’s* real morality, and it’s subjective!"

  **3. Name and definition**  
  **Term**: **Convergence-Divergence Demotion Gambit** (CDDG).  
  **Definition**: *A debate tactic in metaethics where norms showing cross-cultural convergence are dismissed as non-moral (e.g., biological/social heuristics), while divergent norms are preserved as genuinely moral, thereby framing all empirical evidence as incompatible with moral realism.*  
  **Boundary**: It applies when reclassification is *motivated dialectically* to preempt counter-evidence, not when based on independent criteria (e.g., arguing *all* norms are biological, consistently).

  **4. Mirror cases and edges**  
  - **Realist mirror**: Yes! When anti-realists use evolutionary debunking (e.g., "morality is just evolved intuitions"), realists might retort: "Ah, but *core moral judgments* (like fairness) track truth, while *divergent* ones (purity) are distorted non-moral biases!" Convergent = moral/truth-tracking, divergent = non-moral error. Same asymmetric move.  
  - **Blur with theory-ladenness**: The line blurs when reclassification stems from a *consistent, principled metaethical theory* (e.g., "all norms reducing suffering are moral" – even if controversial). CDDG is suspect when reclassification *shifts opportunistically* mid-debate to counter specific arguments without broader theoretical grounding.  

  **5. Bottom line**  
  This is absolutely a real pattern—I call it "dialectical gerrymandering." It’s not just you; it’s a sneaky way to make one’s position empirically unfalsifiable by re-categorizing inconvenient data out of "morality." Spotting it forces clarity: *Why* are convergent norms "not moral"? What’s the independent criterion? Without that, it’s CDDG in action.
