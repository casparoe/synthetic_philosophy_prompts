answer: |-
  Here's the bottom line upfront: **Mixing up claim-rights and liberty-rights lets opponents of new housing simultaneously demand guaranteed neighborhood stability (a claim-right) while denying others the liberty to build housing *even when it's legally permitted*—undermining both property rights and housing supply.** Shadow zoning then weaponizes this confusion, enabling long-term owners to artificially restrict supply *beyond* legal limits, breaking the economist's direct link between zoning reform and scarcity reduction.  

  ### Why the rights confusion collapses the NIMBY/YIMBY frame:
  1. **Claim-rights** (e.g., "the city owes me unchanged views/character") imply others *must provide something* (like veto power over neighbors).  
  2. **Liberty-rights** (e.g., "I should build housing where it's legal") only require others *don't interfere*.  
  When NIMBYs say "right to the city" but mean **claim-rights to block change**, they’re demanding a *positive entitlement* to control others’ property. YIMBYs counter with **liberty-rights** (build freely within the law). If these concepts get blurred:  
  - NIMBYs can frame *their* restrictions as "rights" (confusing liberty with veto power).  
  - YIMBYs get painted as denying "rights" (even though liberty-rights don’t impose duties on others).  
  **Result**: The debate shifts from "who gets to use their property?" to "who gets guaranteed outcomes?", sabotaging clear policy trade-offs.  

  ### How shadow zoning breaks the artificial scarcity argument:
  Economists argue zoning laws create artificial scarcity by capping supply. Reforming zoning *should* fix this. **But shadow zoning adds a hidden layer**:  
  - Long-term owners collude via unwritten rules (e.g., "don’t sell to developers," "only single-family renos").  
  - Even if zoning *allows* a 6-plex, social pressure keeps land in low-density use.  
  **Why this breaks the model**:  
  - Scarcity isn’t *just* from legal limits—it’s reinforced by **social enforcement** that persists after zoning reform.  
  - Landowners face "soft costs": exclusion from community, gossip, or retaliation if they "defect" and build denser.  
  - **Dependency**: Without addressing shadow zoning, upzoning can fail to increase supply. The scarcity isn’t "artificial" (from law alone)—it’s *socially manufactured*, making reform toothless if norms don’t shift.  

  **Verdict**: Shadow zoning proves housing scarcity is *socially embedded*, meaning legal reform alone won't unlock supply if power dynamics preserve de facto veto rights.
