answer: |-
  You've hit on a crucial and sophisticated dynamic in the politics of memory – the way remembrance can become a form of evasion rather than a catalyst for change. There isn't one universally accepted term, but several concepts capture facets of what you're describing:

  1.  **"Performative Commemoration" or "Symbolic Reparation":** These emphasize the *act* of remembrance (apologies, monuments, memorial days, curricula) as a performance that fulfills a perceived obligation or generates social/political capital *without* necessarily demanding deeper structural change. The performance *is* the endpoint, not the beginning.
  2.  **"Pious Legitimation" (Jeffrey K. Olick):** This term specifically critiques how confronting the past (especially in Germany) can become a ritualized source of moral authority ("We dealt with it, so we are good now") used to legitimize the *current* political order and deflect *new* criticisms, particularly regarding ongoing inequalities or new forms of exclusion (like immigration debates).
  3.  **"Organized Forgetting" / "Managed Memory":** This focuses on how states or dominant groups actively *shape* remembrance to serve present interests. The elaborate apparatus you describe *manages* the difficult past, containing it within safe, often depoliticized, boundaries (museums, fixed narratives) that prevent it from spilling over into critiques of current power structures.
  4.  **"Mnemonic Capital" / "Commemorative Credit":** Drawing on Bourdieu, this sees remembrance efforts as accumulating symbolic capital – a kind of "moral credit score." Societies (or groups within them) can then "spend" this credit to claim virtue, deflect criticism ("We apologized, what more do you want?"), or resist further demands for justice or change in the present.
  5.  **"Displacement" (in Memory Studies):** This refers to how focusing intensely on *one* past trauma (even with elaborate apparatus) can serve to *displace* attention from other, often related, injustices in the present or other unaddressed historical wrongs. (e.g., Germany's focus on the Holocaust potentially displacing discussion of colonial violence or contemporary racism).

  **Distinguishing from Denial and Transitional Justice:**

  *   **Vs. Simple Denial (Turkey, Initial Japan/Confederate South):**
      *   **Denial:** Actively erases, minimizes, or criminalizes discussion of the past. The apparatus is either absent or actively repressive (criminalization, propaganda). The goal is to make the past *disappear* as a political issue. (Turkey: Criminalizing "1915"; Initial Confederate: "Lost Cause" myth erasing slavery).
      *   **"Moral Credit" Remembrance:** *Acknowledges* the past, often elaborately. It builds an apparatus that *looks* like accountability. However, it **contains** the past, **ritualizes** it, and **decouples** it from present structures. The past is acknowledged *precisely so it doesn't disrupt the present*. It's a *managed acknowledgement*, not erasure. (Germany's Holocaust memorials *and* immigration debates; Japan's peace museums *and* gender inequality).

  *   **Vs. Transitional Justice:**
      *   **Transitional Justice (TJ):** Aims for fundamental societal transformation. It links remembrance **directly** to institutional change:
          *   **Legal Accountability:** Trials, truth commissions identifying perpetrators and systemic failures.
          *   **Structural Reform:** Dismantling discriminatory laws/institutions, land reform, constitutional changes, vetting processes.
          *   **Reparations:** Material compensation for victims/survivors.
          *   **Guarantees of Non-Recurrence:** Concrete institutional changes to prevent repetition.
          *   **Inclusive Memory:** Actively involving victims/survivor groups in shaping remembrance.
      *   **The "Moral Credit" Apparatus:** Often emerges *after* or *instead of* genuine TJ, or as a way to *avoid* it. It typically:
          *   Focuses on **symbols** (monuments, apologies, curricula) over **substance** (legal accountability, structural reform, material reparations).
          *   **Decouples past from present:** "That was then, this is now; we remember *that* evil, so don't connect it to *these* current problems."
          *   **Centralizes control:** Remembrance is often state-managed or dominated by former perpetrator groups/elites (like the heritage framing in the South), marginalizing victim narratives or contemporary critiques.
          *   **Becomes the endpoint:** The act of remembrance *is* considered the fulfillment of the obligation. Demands for further change are framed as ungrateful or dwelling on the past.

  **The Edges & Variations (Turkey, U.S. South):**

  *   **Turkey:** Represents **active, enforced denial**. The apparatus is **repressive** (criminalization) and **propagandistic** (state narratives). There is *no* official space for acknowledgement, let alone building "moral credit" through it. It's the polar opposite of the elaborate apparatus, existing to actively *prevent* its formation.
  *   **The U.S. South (Confederate Monument Defense):** This is a fascinating hybrid:
      *   **Denialist Core:** The "heritage not hate" framing is fundamentally a form of **soft denial** – it actively minimizes or erases the centrality of slavery and white supremacy to the Confederacy and the monuments' purpose (intimidation during Jim Crow).
      *   **Apparatus as Defense:** The "heritage" narrative *is* the remembrance apparatus built by the perpetrators/successors (Daughters of the Confederacy, Jim Crow legislatures). But its function isn't primarily to gain *moral* credit externally (though they try), but to **legitimize the past actions**, **maintain social/political power** for dominant groups, and **resist demands for change** (removal of monuments, addressing systemic racism) *in the present*. It's an apparatus built for **resistance to transitional justice**, using a distorted memory as a shield. It shares the *function* of immunizing against present critique but does so through **defensive myth-making** rather than elaborate, seemingly contrite, acknowledgement.

  **In essence:** The "moral credit" apparatus you identify in Germany and Japan is a sophisticated form of **managed, depoliticized acknowledgement**. It uses the *performance* of confronting the past to *avoid* its most disruptive implications for the present power structure. It differs from denial by acknowledging the past, and from transitional justice by stopping at symbols and failing to enact structural change, thereby immunizing the present against critique rooted in that past. Turkey exemplifies enforced denial, while the Confederate South uses a defensive, denialist remembrance apparatus built to resist change. The key separator is whether remembrance is **coupled with or actively prevents** concrete institutional transformation addressing the *legacies* of that past in the present.
