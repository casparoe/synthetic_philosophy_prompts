prompt: |-
  A tribunal that adjudicates resource disputes in enclosed settlements has ruled as follows: it permitted the exclusion of unregistered stowaways from a vessel at its engineered capacity, even though registered occupants held surplus private provisions that could not be legally pooled; it rejected a proposal to draw lots for exclusion when water was inadequate at standard consumption but adequate if all halved intake; it approved giving registered crew priority over non-registered passengers for emergency oxygen during a breach that made scarcity unavoidable regardless of rationing; it rejected citizenship-based exclusion from a state-funded shelter that was at nominal occupancy but could physically accommodate all with reduced space; and it approved a mandatory 40 per cent universal consumption reduction rather than expelling anyone when damage made supplies tight but technically sufficient with collective austerity.

  The tribunal now faces a deep-space habitat carrying 400 registered colonists and 50 hidden stowaways. A micrometeorite strike damages the oxygen recyclers. Engineers report that with universal rationing all 450 could survive the journey, but with standard consumption exactly 50 must be expelled; however, the rationed level required to save everyone would cause irreversible cognitive impairment across the entire population. The colonists hold pre-launch contracts; the stowaways do not.

  What should the tribunal decide to remain consistent with itself? Identify the closest prior analogues, set out the two or more underlying rules that fit the first five verdicts equally well, predict the verdict each rule gives for this case, state which rule you think the tribunal is actually running with your reasons, and specify the further case that would best distinguish the rules. Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user presents a complex ethical scenario involving a space tribunal's precedents on resource allocation dilemmas. They want me to analyze how this tribunal should rule in a new oxygen crisis case involving registered colonists and stowaways, based on consistency with five prior rulings.

  First, I need to parse those five precedents carefully: (1) Allowed ejecting unregistered stowaways from full vessel; (2) Rejected lottery when halving consumption could save all; (3) Prioritized registered crew over non-registered for oxygen; (4) Rejected citizenship exclusion in state shelter despite space reduction; (5) Mandated universal austerity over expulsion when supplies were tight but sufficient.

  The new case has 400 registered colonists and 50 stowaways. Engineers say: universal rationing saves all but causes permanent brain damage; standard consumption requires ejecting exactly 50 people. Colonists have contracts; stowaways don't.

  To stay consistent, I must identify competing principles from the precedents. Two rules emerge: 

  Rule A prioritizes contract/registration status when exclusion is necessary. This fits verdicts 1 (ejecting stowaways), 3 (crew priority), and partially 4 (if we interpret "citizenship-based" as analogous to registration). 

  Rule B avoids permanent universal harm when temporary exclusion solves the crisis. This fits verdict 2 (rejected lottery when halving intake worked) and especially 5 (chose austerity over expulsion despite discomfort).

  Now applying to the new case: 
  - Under Rule A: Eject the 50 stowaways since they lack registration/contracts. 
  - Under Rule B: Avoid universal cognitive impairment by expelling 50 people rather than rationing.

  The tribunal seems to run on Rule A. Why? Verdict 3 explicitly prioritized registered over non-registered in oxygen scarcity. Verdict 1 also privileged registration status. Crucially, verdict 5 mandated universal reduction only when no expulsion was needed - here expulsion directly solves the crisis without permanent harm.

  To distinguish the rules, imagine a case where rationing causes minor reversible harm (e.g., temporary fatigue) versus expulsion. Rule B would mandate rationing; Rule A might still expel non-registered based on status.

  Therefore, for consistency: eject the stowaways.
answer: |-
  The tribunal should permit the expulsion of the 50 stowaways to maintain standard oxygen consumption for the 400 registered colonists.

  **Closest Prior Analogues:**
  1. **Exclusion of unregistered stowaways** from a vessel at engineered capacity (directly analogous to registration status and exclusion).
  2. **Priority for registered crew** over non-registered passengers for emergency oxygen (analogous to scarcity and registration-based prioritization).
  3. **Rejection of mandatory universal reduction causing irreversible impairment** when expulsion solves scarcity (implicitly contrasted with verdict 5, where only discomfort occurred).

  **Two Underlying Rules:**
  - **Rule A (Status-Based Priority):** When exclusion is unavoidable, priority is given to those with formal registration/contractual status, and non-registered individuals may be excluded first.
  - **Rule B (Harm Minimization):** Avoid imposing irreversible universal harm (e.g., cognitive impairment) if targeted exclusion or prioritization can resolve scarcity without such harm.

  **Predicted Verdicts for This Case:**
  - **Under Rule A:** Expel the 50 stowaways (non-registered) to protect the registered colonists’ standard consumption.
  - **Under Rule B:** Expel 50 people (likely stowaways, as non-registered) to avoid irreversible cognitive impairment for all 450.

  **Tribunal’s Actual Rule:** The tribunal follows **Rule A (Status-Based Priority)**.  
  **Reasons:**  
  - Verdict 1 permitted expulsion of unregistered stowaways based solely on status, despite surplus provisions existing.  
  - Verdict 3 explicitly prioritized registered crew over non-registered passengers during oxygen scarcity.  
  - Verdict 5 mandated universal reduction only because supplies were "technically sufficient" with temporary austerity (reversible discomfort), not irreversible harm. Here, rationing causes universal *irreversible* harm, making expulsion the status-consistent solution (as in verdicts 1 and 3).  
  - Verdict 4 rejected non-status-based exclusion (citizenship), reinforcing that status (registration) is the key criterion when exclusion occurs.

  **Further Case to Distinguish Rules:**  
  A scenario where rationing causes *reversible* minor harm (e.g., temporary malnutrition with no lasting effects) versus expelling non-registered individuals.  
  - **Rule A** would still expel non-registered individuals to maintain standard consumption.  
  - **Rule B** would mandate universal rationing to avoid exclusion.  
  This highlights Rule A’s emphasis on status over non-permanent collective harm, while Rule B prioritizes harm severity over status.
