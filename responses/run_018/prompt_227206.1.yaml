  ### Decision Tree: Responses to Newton's Rotating-Bucket Argument

  This decision tree classifies positions on the ontology of space, motion, and inertial structure based on responses to Newton’s bucket experiment and diagnostic cases. The experiment reveals that the water’s surface becomes concave even when the water is stationary relative to the bucket, challenging purely relational accounts of motion. Each branching node is a concrete question phrased to avoid abstract terminology, and diagnostic cases are integrated throughout. The tree is constructed in an idealized Newtonian setting. Positions are observationally equivalent in cases where no experiment (including the bucket) can distinguish them.

  ---

  #### **Decision Tree**  
  *Start at Node 1 with the observation: The water’s surface is concave despite no rotation relative to the bucket.*  

  1. **In an otherwise empty universe (no matter except the bucket and water), if the bucket spins relative to its initial rest state, does the water’s surface become concave?**  
     - **Yes** → Node 2 (Absolute rotation occurs without matter)  
     - **No** → Node 6 (Rotation requires material relations)  

  2. **If all matter in the universe is contained in a thin, rapidly rotating spherical shell centered on a stationary bucket, does the water’s surface become concave?**  
     - **Yes** → Node 3 (Shell’s rotation affects bucket)  
     - **No** → Node 4 (Shell’s rotation irrelevant)  

  3. **Can two worlds have identical material histories (distances, relative velocities, etc.) but different patterns of acceleration (e.g., one bucket spins, the other doesn’t)?**  
     - **Yes** → Node 5 (Acceleration not fixed by relations)  
     - **No** → Node 9 (Acceleration fixed by relations)  

  4. **Can a sealed inertial compass (e.g., a gyroscope with no external inputs) detect rotation by internal stresses alone?**  
     - **Yes** → Node 8 (Inertial structure detectable locally)  
     - **No** → Node 7 (No local detection)  

  5. **Could two worlds differ only in which manifold points are occupied by matter (e.g., all matter shifted uniformly), with identical material relations?**  
     - **Yes** → Leaf 1: Traditional manifold substantivalism  
     - **No** → Node 10 (Shifted worlds impossible)  

  6. **If all matter in the universe is contained in a thin, rapidly rotating spherical shell centered on a stationary bucket, does the water’s surface become concave?**  
     - **Yes** → Leaf 4: Machian relationism  
     - **No** → Node 7 (Shell’s rotation irrelevant)  

  7. **Is there a fact of the matter about which trajectories are inertial in a world containing matter?**  
     - **Yes** → Node 11 (Inertial facts exist)  
     - **No** → Leaf 7: Conventionalism/deflationism  

  8. **Can two worlds have identical material histories but different patterns of acceleration?**  
     - **Yes** → Node 12 (Acceleration not fixed by relations)  
     - **No** → Node 13 (Acceleration fixed by relations)  

  9. **Does the affine/inertial structure exist independently of the dynamical laws?**  
     - **Yes** → Leaf 3: Point-free inertial structuralism  
     - **No** → Leaf 6: Dynamicalism  

  10. **Is the affine/inertial structure grounded in the manifold points themselves?**  
      - **Yes** → Leaf 2: Sophisticated substantivalism  
      - **No** → Leaf 3: Point-free inertial structuralism  

  11. **Is the affine/inertial structure grounded in dynamical laws, not matter?**  
      - **Yes** → Leaf 6: Dynamicalism  
      - **No** → Leaf 5: Broader modal/Leibnizian relationism  

  12. **Could two worlds differ only in which manifold points are occupied by matter?**  
      - **Yes** → Leaf 1: Traditional manifold substantivalism  
      - **No** → Leaf 2: Sophisticated substantivalism  

  13. **Is the affine/inertial structure grounded in dynamical laws, not matter?**  
      - **Yes** → Leaf 6: Dynamicalism  
      - **No** → Leaf 5: Broader modal/Leibnizian relationism  

  ---

  #### **Mapping of Combinations and Unoccupied Positions**  
  - **Possible combinations covered**: 14 paths (from 10 nodes), leading to 7 leaves. Uniquely occupied combinations:  
    - `1Y-2Y-3Y-5Y` → Leaf 1  
    - `1Y-2Y-3Y-5N-10Y` → Leaf 2  
    - `1Y-2Y-3Y-5N-10N` → Leaf 3  
    - `1Y-2Y-3N-9Y` → Leaf 6  
    - `1Y-2N-4Y-8Y-12Y` → Leaf 1  
    - `1Y-2N-4Y-8Y-12N` → Leaf 2  
    - `1Y-2N-4Y-8N-13Y` → Leaf 6  
    - `1Y-2N-4Y-8N-13N` → Leaf 5  
    - `1N-6Y` → Leaf 4  
    - `1N-6N-7Y-11Y` → Leaf 6  
    - `1N-6N-7Y-11N` → Leaf 5  
    - `1N-6N-7N` → Leaf 7  
  - **Unoccupied combinations**:  
    - `1Y-2Y-3N-9N` (Inertial structure independent of laws but fixed by matter?): *Incoherent*—if structure is matter-dependent, empty universe rotation (Node 1Y) is inexplicable.  
    - `1Y-2N-4N` (Rotation detectable locally without structure?): *Technically unstable*—denies Node 4’s local detection, but bucket concavity implies structure.  
    - `1N-6Y-7?` (Machian shell effect but no fact about inertia?): *Incoherent*—Machianism requires matter-dependent inertial facts.  
    - `1N-6N-7Y-8?` (No shell effect, but inertial facts without laws or matter?): *Underexplored*—no clear position fills this gap.  

  ---

  #### **Leaf Positions: Characterization and Commitments**  
  1. **Traditional manifold substantivalism**:  
     - Space-time is a real manifold of points that exist independently of matter. Inertial structure (e.g., geodesics) is a property of this manifold.  
     - *Most awkward commitment*: Shifted worlds (identical material relations but different manifold occupations) are physically distinct despite observational indistinguishability.  

  2. **Sophisticated substantivalism**:  
     - Space-time points exist, but their identities are fixed by the total space-time structure (e.g., metric or affine connections). Shifted worlds are identical.  
     - *Most awkward commitment*: Points lack primitive identity, requiring complex structural constraints to avoid indeterminism.  

  3. **Point-free inertial structuralism**:  
     - Affine/inertial structure (e.g., geodesic paths) is physically real, but individual manifold points are not ontological primaries. Structure exists independently of matter.  
     - *Most awkward commitment*: Inertial structure is fundamental without a "container," making it abstract and difficult to ground physically.  

  4. **Machian relationism**:  
     - All motion is relative to matter; inertia arises from interactions with the cosmic matter distribution. Rotation requires acceleration relative to the global mass.  
     - *Most awkward commitment*: In an empty universe, spinning the bucket would not produce concavity, contradicting Newtonian intuition.  

  5. **Broader modal/Leibnizian relationism**:  
     - Motion is defined by relational changes (distances/angles between bodies), with inertial structure emergent from material relations or symmetries. Counterfactual material configurations define possibility.  
     - *Most awkward commitment*: Explaining why the bucket’s concavity occurs requires arbitrary choices about "fixed" reference bodies.  

  6. **Dynamicalism**:  
     - Inertial structure encodes features of dynamical laws (e.g., geodesics are paths of zero nongravitational force), not an independent background. Laws determine what counts as inertial.  
     - *Most awkward commitment*: Changing force laws would alter inertial structure, making rotation contingent on legislation.  

  7. **Conventionalism/deflationism**:  
     - Inertial structure is not physically real; it is a useful convention for describing motion. No fact distinguishes "true" rotation from choice of reference frame.  
     - *Most awkward commitment*: A sealed inertial compass appears to detect absolute rotation, which must be explained as an artifact of convention.  

  ---

  #### **Observational Equivalence Notes**  
  - **Bucket experiment alone cannot distinguish**:  
    - Sophisticated substantivalism (Leaf 2) and point-free inertial structuralism (Leaf 3) are *observationally identical* in all contexts, including the bucket. Both predict identical outcomes for all diagnostic cases (e.g., rotating shell, empty universe).  
    - Machian relationism (Leaf 4) vs. other relationisms (Leaves 5, 7) in the **rotating shell case (diagnostic case 2)**:  
      - Machianism predicts concavity (Node 6Y).  
      - Other relationisms (e.g., modal relationism, conventionalism) predict *no concavity* (Node 6N), as rotation is undefined or conventional without observable relative motion.  
  - **Sealed inertial compass (diagnostic case 5)**: Distinguishes positions requiring local inertial structure (e.g., substantivalism, structuralism) from those that do not (e.g., conventionalism).  

  ---

  #### **General Relativity (GR) Note**  
  In GR, space-time structure is dynamical and coupled to matter, altering the logical space:  
  - **Unavailable branches**: Traditional manifold substantivalism (shifted worlds violate diffeomorphism invariance) and Machian relationism (frame-dragging partially validates it, but GR allows empty-universe solutions with inertia).  
  - **Enhanced positions**: Dynamicalism and point-free structuralism gain support, as the metric field defines inertial structure without requiring absolute points.  
  - **New considerations**: GR’s equivalence principle blurs local distinctions (e.g., sealed compass outcomes depend on tidal forces), making some nodes (e.g., Node 4) context-dependent.  

  ---  
  *Tree designed for clarity in a philosophy-of-physics seminar. Nodes prioritize concrete cases over historical labels, and leaves are mutually exclusive.*
