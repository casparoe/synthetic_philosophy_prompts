prompt: |-
  hey, quick question for anyone who actually knows this literature. i've been following long term planning debates — climate, nuclear waste storage, etc — and i keep noticing a pattern that doesn't fit the usual explanations people give for why we ignore the far future. usually folks say it's because people just value present stuff more, or because future benefits should be discounted like financial returns. but i'm seeing something different. people will happily defend spending now to protect people 200 years out, but only when the benefit flows through a chain they see as unbroken: a family trust with locked rules, a university endowment with a fixed charter, some long running ecological program with the same staff. if the exact same benefit in the exact same year has to travel through something that can be replaced, dissolved, or radically changed — a democratic government, a foundation that can rewrite its mission, whatever — they suddenly treat those future people like they're way further away, or not our problem at all. the calendar hasn't moved. and it's not about risk, because people will accept huge risks in the continuous case but reject tiny risks in the broken-chain case. so there seems to be an implicit discount factor that kicks in specifically when custodial continuity breaks, seperate from both "people just care less about the future" and "we should adjust for risk and investment returns". is there an established term for this? i feel like it sits near the philosophy of intergenerational ethics or pure time preference, but i don't want to mislabel it. if there's no name, can you define the thing precisely and draw its edges — especially how it differs from plain institutional distrust?
