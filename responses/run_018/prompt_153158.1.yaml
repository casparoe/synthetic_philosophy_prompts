answer: |-
  What you're describing is a profound and under-discussed phenomenon that cuts across behavioral economics, institutional design, and intergenerational ethics. While there isn't a single universally accepted term, your observation aligns with several established concepts and gaps in the literature:

  ### Core Concept & Proposed Term
  The phenomenon is best described as **"Custodial Continuity Premium"** or **"Institutional Persistence Valuation Bias."** It refers to the **disproportionate premium placed on future benefits when they are guaranteed by an institution perceived as having unbroken, identity-preserving continuity** – even when objective risks or time horizons are identical to less "continuous" institutions.

  ### Key Distinctions from Existing Concepts
  1.  **vs. Pure Time Preference/Discounting:**
      *   Discounting assumes valuation decreases smoothly with time. Your observation shows valuation *collapses abruptly* when custodial continuity is broken, even if the calendar date is unchanged.
      *   People *aren't* inherently discounting the year 2224 less; they discount the *pathway* to delivering value in 2224 if the institution managing it isn't "the same."

  2.  **vs. Standard Risk Assessment:**
      *   People accept *higher objective risk* (e.g., market volatility affecting a trust fund) with continuous custodians than *lower objective risk* (e.g., minor policy drift) with discontinuous ones.
      *   The fear isn't primarily about *probability of failure*, but about the *fundamental break in identity and obligation* of the custodian.

  3.  **vs. Plain Institutional Distrust:**
      *   **Distrust** is broad: "I don't trust *this specific government/agency* (right now) to do X." It's often about competence or current motives.
      *   **Custodial Continuity Bias** is structural: "Even if I trust *this specific government/agency today*, I know it will fundamentally *cease to be the same entity* long before 2224. Its successors may not feel bound by its commitments or share its identity/purpose." It's about the *inherent impermanence and malleability* of certain institutional forms over centuries.

  ### Why This Premium Exists (The Underlying Mechanisms)
  1.  **Psychological Ownership & Legacy Motives:** People view continuous institutions (family trusts, ancient universities, long-standing ecological programs) as extensions of their own identity or legacy. Protecting the future through them feels like preserving *their own* ongoing project.
  2.  **Perceived Bindingness:** Rules locked in a trust charter or university founding document feel more "sacred" and immutable than legislation or foundation bylaws, which are understood as subject to revision by future actors with different values. It creates an illusion of *temporal sovereignty* – binding the future from the present.
  3.  **Reduced "Intergenerational Buck-Passing" Anxiety:** Continuous institutions minimize the fear that future custodians will shirk responsibility. The unbroken chain implies an unbroken obligation. Democratic governments or mutable foundations represent a clear hand-off point where "it becomes *their* problem, not *ours*."
  4.  **Epistemic Confidence:** An unbroken chain implies consistent knowledge transfer and purpose. A discontinuous path introduces profound uncertainty about *what future people will value* and *whether they'll even recognize our intended benefit*. The continuous custodian acts as a guarantor of intent interpretation.
  5.  **Existential Significance:** Institutions perceived as enduring entities (surviving generations) confer a sense of meaning and permanence that mitigates the discomfort of individual mortality. Investing through them feels like contributing to something eternal.

  ### Relevant Literature & Adjacent Concepts
  *   **Intergenerational Equity & Ethics:** Derek Parfit (Reasons and Persons), Stephen Gardiner (Perfect Moral Storm), Edith Brown Weiss. They grapple with obligations to the future but often under-theorize the *mechanism* of delivery.
  *   **Institutional Design & Persistence:** Elinor Ostrom (robust institutions), North/Wallis/Weingast (violence and social orders), Avner Greif (historical institutional analysis). Focuses on *why* some institutions last, but less on how their *perceived* continuity affects valuation.
  *   **Behavioral Economics & Discounting:** Hyperbolic discounting, present bias. Explains *some* short-termism but not the *discontinuity-specific* collapse in valuation you observe. "Commitment devices" (like trusts) are recognized, but their unique psychological premium over functionally similar mutable devices isn't fully captured.
  *   **Philosophy of Trust & Promise-Keeping:** Margaret Gilbert, T.M. Scanlon. Examines how commitments bind over time, especially when the original promisor is gone. Your observation highlights how institutional *form* mediates the perceived strength of intergenerational promises.
  *   **Cultural & Organizational Identity:** The perceived "sameness" of an institution over centuries, despite personnel turnover, is a core element. Work on organizational identity (Albert & Whetten) rarely spans centuries.

  ### Defining the Edges
  *   **Core:** A dramatic increase in the *subjective present value* of a distant future benefit when its delivery depends on an institution perceived to maintain an unbroken, identity-preserving chain of custody, compared to an identical benefit delivered via an institution perceived as mutable or replaceable, even when objective risks/returns are held constant.
  *   **Distinguishing from Distrust:** If someone rejects a plan because they distrust the *current* government's competence/corruption *today*, that's plain distrust. If they accept that the *current* government is trustworthy *now* but reject the plan because they know this specific government (or its direct descendant) *won't exist* in 2224 and its *successor* won't feel bound, that's **Custodial Continuity Bias**.
  *   **Trigger:** The perceived *potential* for a fundamental break in institutional identity, mandate, or obligation – even if unlikely. It’s about structural vulnerability.
  *   **Not About:** Physical continuity of staff (obviously impossible over 200 years), but the continuity of *rules, identity, and perceived obligation*.

  ### Conclusion
  You've pinpointed a crucial gap. While "Custodial Continuity Premium" or "Institutional Persistence Valuation Bias" aren't yet canonical terms, they precisely capture the phenomenon you describe. This bias arises from deep-seated psychological needs for legacy, binding commitment, and epistemic certainty about future intent, mediated by the perceived *temporal robustness* of the delivering institution. It fundamentally differs from simple time discounting, risk aversion, or institutional distrust by focusing on the *fear of custodial discontinuity itself* as a unique source of devaluation for the distant future. This concept deserves much greater attention in discussions of long-term policy and intergenerational justice. Your intuition that it sits at the intersection of intergenerational ethics, institutional design, and behavioral psychology is spot-on.
