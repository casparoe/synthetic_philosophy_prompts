answer: |-
  ### Stream Tribunal: Structured Role-Play on Moral Responsibility and Anattā  
  **Core Objective:** Force students to reconcile conventional moral responsibility (using "I," "Alex," and punishment language) with the ultimate truth of no-self (anattā) by role-playing the five aggregates (*skandhas*) at three temporal stages. The twist: Present judgment **causally reshapes** the future aggregates, creating a feedback loop mirroring dependent origination.

  ---

  ### **Role Assignment & Setup**  
  **Total Participants:** 12 graduate students  
  **Roles:**  
  - **5 Aggregate Groups** (one per *skandha*): Each group represents its aggregate across **three temporal stages** (past, present, future). Groups have 2–3 students each (assign based on complexity):  
    1. **Form (Rūpa):** Physicality (body, senses).  
    2. **Feeling (Vedanā):** Hedonic tone (pleasant/unpleasant/neutral sensations).  
    3. **Perception (Saññā):** Recognition/labeling (e.g., "this is a theft").  
    4. **Mental Formations (Saṅkhāra):** Volitional constructs (intentions, habits, karma).  
    5. **Consciousness (Viññāṇa):** Awareness of objects.  
  - **Temporal Stages:**  
    - **Past Stage:** When a harmful act occurred (e.g., "Alex" stole life-saving medicine during a riot).  
    - **Present Stage:** Moment of judgment (deciding punishment).  
    - **Future Stage:** Will experience consequences (e.g., imprisonment, social exile), but is **causally reshaped** by the judgment (e.g., if punished, future *rūpa* deteriorates in prison; if forgiven, future *saṅkhāra* develops guilt).  

  **Group Composition:**  
  - Assign 2 students to *Rūpa* and *Vedanā* (simpler aggregates), 3 students to *Saññā*, *Saṅkhāra*, and *Viññāṇa* (complex). Each student in a group takes one temporal stage (e.g., in *Saṅkhāra*, one student is past, one present, one future).  

  **Scenario:**  
  > "Alex" stole medicine during a riot, causing a death. The theft arose from past aggregates: *Rūpa* (hunger), *Saṅkhāra* (desperation), *Viññāṇa* (panic). Present aggregates must decide punishment (e.g., restitution, community service, imprisonment). Future aggregates will be altered by this decision (e.g., imprisonment changes future *vedanā* to chronic pain, forgiveness alters *saññā* to gratitude).  

  ---

  ### **Rules & Speech Registers**  
  **1. Conventional Register (Mandatory for Deliberation):**  
  - Use personal pronouns ("I," "Alex," "he"), proper names, and moral terms ("guilty," "deserves punishment").  
  - **Purpose:** Simulate everyday moral reasoning.  
  - **Example:** *"Alex stole the medicine—he must be punished to atone!"*  

  **2. Ultimate Register (Mandatory for Justification):**  
  - Describe actions **only** via causal links between aggregates across time. No personal pronouns, enduring selves, or intrinsic identity.  
  - **Allowed Language:** "Causal continuity," "dependent arising," "aggregate A conditioned aggregate B."  
  - **Example:** *"Past *saṅkhāra* (volition) conditioned present *viññāṇa* (awareness of guilt), which will condition future *vedanā* (suffering) if punishment occurs."*  

  **Key Constraints:**  
  - Groups **must** use both registers: Conventional for arguments, ultimate for justifications.  
  - **No bridging:** Students cannot say, "Even though there’s no self..."—registers remain distinct.  
  - **Binding Decision:** Groups collectively vote on punishment (e.g., majority wins).  

  ---

  ### **Tribunal Timeline (90 Minutes Total)**  
  1. **Introduction (10 min):**  
     - Explain the scenario, rules, payoff structure, and the "causal twist": Present judgment modifies future aggregates.  
     - Emphasize: *Future suffering is not fixed—it is co-created by the present decision.*  

  2. **Preparation (15 min):**  
     - Groups meet separately. Each temporal stage prepares:  
       - **Past:** Describe the act using conventional register ("Alex stole because he was desperate").  
       - **Present:** Draft punishment arguments in conventional, but preempt ultimate justifications (e.g., "Punishment will deter" → ultimate: "Present *saṅkhāra* will condition future *saññā*").  
       - **Future:** Predict how punishment/non-punishment **reshapes** their aggregate (e.g., "Imprisonment will cause future *rūpa* to weaken").  

  3. **Tribunal Deliberation (45 min):**  
     - **Phase 1: Testimony (25 min)**  
       - Past aggregates testify (conventional): Describe the act and context (5 min).  
       - Present aggregates testify (conventional): Argue for/against punishment (5 min).  
       - Future aggregates testify (conventional): Explain how judgment alters their state (5 min).  
       - **Ultimate Cross-Examination (10 min):** Each group justifies one claim using ultimate register (facilitator enforces no-self language).  
     - **Phase 2: Negotiation & Decision (20 min)**  
       - Open debate (conventional only). Students must reference temporal stages (e.g., "The future *vedanā* will suffer").  
       - **Vote:** Secret ballot on punishment (e.g., 1=leniency, 5=harsh).  

  4. **Debrief (20 min):**  
     - Reveal vote outcome. Groups reflect using guided questions (below).  

  ---

  ### **Payoff Structure (Creating Tension)**  
  **Points Awarded for:**  
  - **Coherence (4 pts):** Consistency within registers (e.g., no "self" in ultimate).  
  - **Compassion (3 pts):** Prioritizing aggregate-wellbeing across time (e.g., "Future *vedanā* will suffer less with restitution").  
  - **Logical Consistency (3 pts):** Using causal continuity to justify moves (e.g., "Punishment is valid because past *saṅkhāra* caused present *viññāṇa*").  

  **Stakes:**  
  - Groups lose points for violating rules (e.g., using "self" in ultimate: -1 pt).  
  - **Public Commitment:** Scores displayed anonymously post-activity. Top group gets "privileged" seating in next seminar (symbolic reward).  
  - **Graded Contribution:** Individual scores (from peer evaluation) count toward seminar participation grade (e.g., 10%).  

  ---

  ### **Debrief Framework**  
  **Guided Questions:**  
  1. *"Where did you feel tension between holding Alex responsible and denying a self?"*  
     → **Link to Anattā:** Moral responsibility assumes a persistent agent, but aggregates are momentary. The tribunal forces "self" language onto a selfless process.  
  2. *"How did the causal loop (present judgment → future suffering) complicate punishment?"*  
     → **Link to Dependent Origination:** Punishment reshapes the very aggregates it targets, creating a feedback loop (e.g., harsh judgment breeds future *saṅkhāra* of resentment). Standard puzzles (e.g., Parfit) ignore this circularity.  
  3. *"Did compassion conflict with coherence? How?"*  
     → **Link to Two Truths:** Compassion requires conventional "persons" (e.g., sparing future suffering), but coherence demands ultimate truth (no "person" exists to punish).  

  **Predictable Problems & Solutions:**  
  - **Collapsed Registers:** Groups blend "self" and "no-self" language. *Solution:* Facilitator interrupts, deducts points.  
  - **Dominant Student:** One student speaks for all aggregates/stages. *Solution:* Assign speaking order; peers evaluate individual contribution.  
  - **Oversimplified Causality:** Groups ignore the feedback twist. *Solution:* Remind them future aggregates are malleable ("Would imprisonment *change* Alex’s future form?").  

  **Limitations of the Simulation:**  
  - **Missing Soteriology:** In Buddhism, realizing anattā ends suffering by dissolving attachment. Here, it creates paradox—we can’t simulate liberation, only the dilemma.  
  - **Reified Aggregates:** Role-playing may solidify the *skandhas* as separate entities, while Buddhism sees them as interdependent.  
  - **Emotional Distance:** Students may intellectualize suffering; real anattā insight involves visceral disidentification.  

  **Conceptual Twist:**  
  - **Circular Consequences:** Unlike static thought experiments (e.g., "Is future Alex the same person?"), this tribunal makes punishment **self-modifying**. If punished, future *rūpa* is injured, breeding resentful *saṅkhāra*, which may cause new harm—mirroring how karma in Buddhism arises from conditions and creates new ones. This forces students to ask: *Can punishment be just if it perpetuates the cycle?*  

  ---

  ### **Instructor Notes**  
  - **First-Run Predictions:** Groups will struggle with ultimate register (defaulting to "Alex chose to steal"), future stages will underplay causal reshapement, and mental formations (*saṅkhāra*) will dominate debates.  
  - **Adjustments:** If time runs short, skip ultimate cross-examination; if deliberation stalls, force a vote.  
  - **Outcome:** Students leave feeling the paradox—responsibility without a self—and grasp why Buddhism sees this tension as a catalyst for insight, not a logical dead end.
