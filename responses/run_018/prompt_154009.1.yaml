answer: |-
  **INTERNAL MEMORANDUM**  
  **Bureau of Participant Stance Compliance (BPSC)**  
  **Ref: BPSC/PSP-23/08**  
  **TO:** All Licensed Interpersonal Mediators (LIMs) & Certified Couples-Therapy Practitioners (CCTPs)  
  **FROM:** Directorate of Stance Accountability  
  **SUBJECT:** Mandatory Reactive Attitude Disclosure Protocol & Tiered Licensing Enforcement  
  **DATE:** 28 September 2023  

  Effective 1 November 2023, the Bureau of Participant Stance Compliance (BPSC) hereby institutes Protocol 5.7: *Standardized Reactive Attitude Disclosure and Stance Purity Assurance*. This protocol formalizes the Strawsonian distinction between the Participant Stance (PS) and Objective Attitude (OA) within all mediated interpersonal engagements. Compliance is non-negotiable and subject to Tier-3 audit.  

  ### I. REACTIVE ATTITUDE DISCLOSURE FORM (RADF) REQUIREMENTS  
  Prior to the expression, solicitation, or facilitation of any reactive attitude (RA) — including but not limited to resentment, gratitude, forgiveness, or moral love — clients **must** file a BPSC Form R-88 ("Reactive Attitude Disclosure Form"). Key sections include:  

  1.  **Stance Declaration:** Client must check either:  
      -   `☐ Participant Stance (PS)`: Acknowledges interpersonal involvement, treating the other as a morally responsible agent. *Permits* reactive attitudes.  
      -   `☐ Objective Attitude (OA)`: Treats the other as a subject for causal explanation, management, or social policy. *Suspends* reactive attitudes.  
  2.  **RA Specificity:** Client must specify the exact reactive attitude intended (e.g., "Resentment re: unwashed dishes," "Gratitude re: emotional support during crisis"). Vague descriptors ("annoyance," "appreciation") are non-compliant.  
  3.  **Contamination Clause:** Stance-switching *within a single RA expression* constitutes "Stance Contamination" (e.g., expressing resentment while simultaneously attributing the offending behavior solely to childhood trauma, thereby invoking OA). Penalties: 1st offence: Warning & mandatory Stance Integrity Workshop (SIW-1). 2nd offence: Fines (Schedule 4.2) and 30-day license suspension for the facilitating LIM/CCTP.  

  ### II. THEORETICAL EXEMPTIONS (DETERMINISM CLAUSE)  
  The BPSC rejects arguments invoking *causal determinism* as grounds for universal suspension of reactive attitudes (per Strawsonian orthodoxy).  

  *   **Policy Rationale:** The Participant Stance is constitutive of ordinary human intercourse. Theoretical considerations regarding causal chains do not invalidate the practical necessity of RAs within the PS.  
  *   **Exemption Denial:** RADF submissions citing "causal determination" (Box 12b) as sole justification for OA adoption *will be automatically flagged for review* and likely rejected. OA requires clinically or legally recognized impairment (see BPSC Annex D: *Objective Attitude Justification Criteria*). Philosophical skepticism is *not* an admissible impairment.  

  ### III. THREE-TIER LICENSING FOR QUALIFIED RESENTMENT (QR)  
  Recognizing resentment as the most operationally critical and high-risk RA, LIMs/CCTPs facilitating resentment must hold the appropriate QR License:  

  1.  **Basic QR:** Covers low-stakes resentment (e.g., punctuality breaches, minor domestic neglect). Renewal: Annual fee ($175), 5 CE credits in "Interpersonal Involvement Maintenance (IIM-101)."  
  2.  **Certified QR:** Required for resentment involving significant relational breaches (e.g., betrayal of trust, financial deception). Requires 10 CE credits (IIM-201: "Deep Involvement Scenarios"), biennial practicum assessment. Fee: $350.  
  3.  **Forensic QR:** Mandatory for resentment linked to severe moral injury or potential legal ramifications (e.g., profound dishonesty, abuse). Requires BPSC Advanced Certification in "Causal Chain Analysis without Attitude Collapse" (CCAAC-500), quarterly audits. Fee: $750.  
  *   **Unauthorized QR Facilitation:** Practicing above license tier = Decertification and referral to the Objective-Attitude Operator Registry (OAOR).  

  ### IV. FORMAL COMPLAINT & BUREAU RESPONSE  
  Senior Mediator A. J. Thorne (LIM #4492-FQ) submitted Complaint Dossier 23-187, arguing: "*If human behavior is fully causally determined (a scientifically robust position), then resentment is merely an output of prior causes. The BPSC should therefore eliminate all QR licensing fees, as blame facilitation is a deterministic process, not a discretionary service.*"  

  **Bureau Ruling (Ref: BPSC/ADJ/23-187):**  
  *   **Denied.** While behavior may be causally influenced, the *Participant Stance* remains the irreducible framework within which resentment acquires its meaning and regulatory necessity. Fees sustain the administrative apparatus ensuring Stance Purity, a deterministic requirement in its own right. Mediator Thorne is reminded that philosophical speculation is irrelevant to operational compliance. A note has been added to his file.  

  ### V. ENFORCEMENT  
  *   Unauthorized deployment of the Objective Attitude (OA) during marital counseling or mediation, except under Annex D criteria, constitutes a Category 1 Violation. Penalty: **Immediate decertification**, permanent listing on the OAOR, and mandatory re-education via the "Re-Immersion in Participant Practices" (RIPP) program (12 weeks, fee: $2,500).  
  *   RADFs must be submitted electronically via BPSC Portal within 24 hours of RA expression. Failure = Automated fine (Schedule 4.1) and audit trigger.  

  Ensure all staff complete the online BPSC Protocol 5.7 Training Module (PSPTM-5.7) by 25 October 2023. Non-completion suspends licensing.  

  **Stance Integrity is Social Harmony.**  

  Eustace V. Pettigrew  
  Director of Stance Compliance  
  Bureau of Participant Stance Compliance (BPSC)  

  ---  
  **//END MEMO//**  
  *Distribution: All LIMs, CCTPs, Regional Compliance Officers, BPSC Legal Dept.*
