  Phrasing must walk the line: "not bad at arithmetic" means avoiding any suggestion she miscalculates. Instead, position her as seeing beyond individual calculations to systemic consequences.

  For the family members, anchor abstract concepts in concrete examples (maintenance, fire extinguishers). For theorists, include nods like "internal brake" and "cascade effects."

  Check for accidental implications: When saying "distance shouldn't matter naively," ensure the speech focuses on institutional systems rather than spatial or population metrics. The collapse risk stems from eroded foundations, not statistical weighting.

  Tone balance: celebratory but substantive, with light moments ("utility isn't just a bill") to ease tension between audience groups. The "not Pascal's wager" note means avoiding overused philosophy examples - hospital analogy solves this.

