  I should avoid implying that Marisol rejects EV entirely. She understands its power but sees its limitations in institutional contexts. The praise should focus on her insight about systems, not calculation skills.

  The distance/number-of-people note suggests avoiding naive utilitarianism. Need to emphasize that her critique isn't about discounting distant harms but about preserving enabling systems.

  Structure thoughts: 
  - Open with warmth and her impact
  - Explain EV simply (probability × impact)
  - Show its appeal in public health
  - Introduce the trap via hospital analogy
  - Describe the cascade effect
