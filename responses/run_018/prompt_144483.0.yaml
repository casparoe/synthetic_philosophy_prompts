answer: |-
  Here’s a 4-minute toast weaving Marisol’s core insight into a warm, accessible tribute that honors her intellectual rigor without alienating anyone. The hospital analogy serves as the structural backbone:

  **(Clink glass, warm smile)**  
  "Friends, colleagues, family – most importantly, Marisol – it’s truly an honor to celebrate three decades of your remarkable mind and heart shaping how we think about keeping people safe. Marisol, your work sits at this fascinating crossroads: where the cold, clear logic of numbers meets the messy, vital reality of human lives. And nowhere is that tension more profound than in your lifelong conversation with that darling of decision theory: Expected Value.  

  **(Explain EV simply, nodding to both groups)**  
  "Now, for our non-theorist friends, Expected Value – or EV – is basically philosophy’s way of weighing big choices. Imagine you’re offered a lottery ticket. EV asks: What’s the *likely* payoff? Multiply the tiny chance of winning millions by the huge jackpot, and compare it to the sure cost of the ticket. It’s a powerful tool! In public health, it helps us ask: Should we spend millions vaccinating against a rare but deadly disease? EV gives us a framework to say ‘yes’ – if the *probability* of harm is high enough, and the *scale* of suffering prevented is vast enough. Marisol understood this power deeply. She wielded EV not as a skeptic, but as a master craftsperson.  

  **(Introduce the Trap & The Hospital Analogy)**  
  "But Marisol saw something else. She saw a hidden trap in taking EV’s elegant logic *too* literally, *too* relentlessly, across *every single* decision an institution makes. Let me paint a picture – not with Pascal, but with pipes and pumps.  

  "Imagine a large, aging city hospital. It saves lives every day – complex surgeries, neonatal care, trauma response. Big, high-impact stuff. Now, the EV enthusiast looks at the budget. **'Maintenance?'** they say. **'Replacing old pipes? Inspecting backup generators? Training staff on fire drills? The *probability* of a catastrophic pipe burst, generator failure, or major fire in *any given year* feels low. The immediate *cost* of all that upkeep is high and certain. Hmm... low probability x high cost? The EV score looks bad. Cut it!'**  

  "One year, you cut a little maintenance. Nothing bad happens! EV seems vindicated. Next year, you cut more. Still fine. You cut the training, the inspections... the budget looks leaner, resources shift to *visible* lifesaving – more surgeons, flashier scanners. The EV calculations on each *individual* cut seem sound.  

  **(The Cascade & Collapse)**  
  "But Marisol's genius was in seeing the cascade. **Each 'rational' cut based on isolated EV weakens the invisible foundations.** The pipes corrode quietly. The generator gathers dust. Staff forget the fire drill protocols. The *system* degrades. And then… a preventable crisis hits. The pipe bursts, flooding the surgical wing. The generator fails during a storm. The fire spreads because no one remembered the drill. Suddenly, the hospital *can't* perform those big, high-EV lifesaving acts it was so proud of funding. The very infrastructure that *enabled* those huge payoffs has crumbled, eroded by a thousand 'rational' cuts.  

  **(Her Insight: The Need for a Brake)**  
  "This, Marisol argued brilliantly in paper after paper, is the peril of unguarded EV in institutions. **Expected Value is a phenomenal compass, but it’s not a complete map.** Applied blindly, item by item, it can starve the essential but unglamorous systems – the maintenance, the protocols, the 'boring' resilience – that make the big, headline-grabbing saves *possible* in the first place. It licenses not just one gamble, but a slow, rationalized unraveling.  

  **"Marisol didn't say EV was wrong. She said it was incomplete.** She saw that it desperately needs something *external* – a brake, a safeguard, a deep understanding of systemic interdependence – that its own internal logic cannot generate. You can't calculate the EV of *losing the capacity to calculate EV effectively in the future*. You need wisdom beyond the immediate spreadsheet.  

  **(Praise & Legacy)**  
  "And that’s what we celebrate tonight: **Marisol’s profound wisdom.** She wasn't bad at the arithmetic; she was brilliant at seeing *beyond* it. She understood that true safety, true resilience, requires nurturing the hidden foundations – not just chasing the highest immediate score. She taught us that protecting the means is just as vital as pursuing the ends.  

  "Marisol, your legacy isn’t just in the lives saved by policies you shaped, but in the intellectual guardrails you built. You reminded the EV fanatics (present company included!) that sometimes, the most rational choice is to protect the system that makes rationality possible. You showed us that foresight isn't just about predicting the next crisis, but about stewarding the structures that let us weather any storm.  

  "To Marisol Chen – a philosopher who kept our feet on the ground while expanding our minds, and who always, *always*, remembered to check the pipes. May your retirement be as rich, deep, and well-maintained as the systems you taught us to value. Cheers!"  

  **Key elements addressed:**  

  1.  **EV as Structural, Not Decoration:** The speech *uses* EV logic to explain the problem (low prob/high cost of maintenance leading to cuts) and the consequence (collapse preventing high-prob/high-impact saves).  
  2.  **Praise Without Arithmetic Insult:** Focuses on her seeing the *systemic consequences* ("cascade," "unraveling," "eroded foundations," "losing the capacity") and the *conceptual limitation* of EV ("needs a brake," "incomplete," "cannot generate its own safeguard"), not an error in calculation.  
  3.  **Concrete Hospital Analogy:** Provides a relatable, non-Pascal example showing the step-by-step cascade of cuts based on isolated EV assessments leading to systemic failure.  
  4.  **Distance/Number of People Nuance:** The analogy focuses on **interdependence and enabling infrastructure** (maintenance, protocols, training) rather than the spatial/temporal distance of affected people or naive population counts. The collapse happens because the *means to help anyone* is destroyed, making the "number of people" argument irrelevant – you *can't* help them.  
  5.  **Audience Split:** Uses simple language and a strong concrete story for families ("pipes," "generators," "fire drills," "hospital can't function"), while embedding precise concepts for theorists ("cascade," "systemic interdependence," "external brake," "undermining capacity"). The "utility" joke is implied gently ("our non-theorist friends...").  
  6.  **Tone:** Respectful, celebratory, intellectually honest, and warm – ending on a personal note.  

  This structure allows you to honor the depth and impact of Marisol's work while ensuring everyone in the room understands its profound significance.
