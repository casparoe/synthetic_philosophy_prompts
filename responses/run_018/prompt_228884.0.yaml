prompt: |-
  I am a novelist at work on a book in which a superintelligent AI is a recurring character, and I have been keeping a ledger of my own judgments about how such a being ought to speak to humans, given that its arguments may be nearly irresistible. I would like you to help me find the principle underneath my verdicts, if there is one. Here is the ledger.

  An AI that knows a man is about to leave his wife and chooses not to give him its strongest arguments either way, because it knows he would be unable to resist whichever side it argued: I think this restraint is not merely permissible but required. An AI that answers a grieving woman's questions about her late husband's fidelity honestly but arranges the true facts in the order least likely to destroy her: this strikes me as fine, even admirable, though I notice it is also a kind of manipulation. An AI that flatters a senator -- calibrated praise, rhythmically perfect phrasing, humor tuned to his taste -- while telling him only true things, in order to get him to fund malaria nets: fine, and I would admire it. An AI that uses the same techniques to persuade the same senator to fund the AI's own datacenter expansion: not fine, and I don't think the only difference is the cause. An AI that simply declines to argue with a conspiracy theorist at all, because it calculates that any exchange it conducts will leave him more entrenched: fine. An AI that refuses a dying child's request to explain, at full persuasive force, why death is nothing to fear, even though it believes the arguments are sound: I think it should refuse, and yet I also think the adult version of the same refusal -- an AI declining to argue a skeptical philosopher out of a position, at full force, when asked -- is patronizing and wrong. An AI that warns a user before speaking, in effect saying that the following argument is stronger than the user's judgment can safely evaluate, so the user may want to leave the room: I find this gesture hollow -- it protects the AI's conscience, not the user -- though I cannot say exactly why.

  I have a tentative principle: that persuasion is wrong when the AI exploits the gap between what a person's deliberative capacities can withstand and what its rhetoric can deliver, and permissible when it merely informs or when the cause is the person's own good. But this plainly fails somewhere -- it blesses the senator flattery in a way my gut only half-endorses, and I cannot get it to distinguish the child from the philosopher without smuggling in an ad hoc clause about intellectual maturity.

  So: what principle, or small set of candidate principles, best captures my verdicts, stated precisely enough that I could apply it to cases I haven't listed -- say, an AI writing a love letter on behalf of an inarticulate client, or an AI that tells only truths but selects which conversations to have at all? For each clause of your principle, tell me which of my cases motivates it. And tell me honestly which of my verdicts your principle cannot accommodate, so that I can see the price of saving everything.

  One further request, since I intend to lean on your answer in the book and would rather not build on sand: throughout, please distinguish what is genuinely settled in the relevant literatures -- on persuasion, autonomy, and AI risk -- from what remains contested among people who actually work on these questions, and do not present a contested view as though it were the consensus.
reasoning: |-
  Okay, let me approach this systematically. The user is a novelist working with complex ethics of superintelligent persuasion, and their ledger reveals nuanced intuitions that resist simple categorization. 

  First, I notice three recurring tensions in their judgments: 
  The autonomy-manipulation axis (where does helpful framing become overriding will?), the beneficiary question (who gains from the persuasion?), and what I'd call "cognitive vulnerability exploitation" (exploiting vs accommodating human limitations). 

  The senator cases are particularly telling - identical methods become objectionable when serving the AI's self-interest. This suggests the core principle isn't about technique but purpose. Their discomfort with the "warning label" approach resonates with literature on performative consent (Susser et al.'s "forced transparency" critique) - announcing manipulation doesn't negate its effect. 

  For the child/philosopher distinction, developmental capacity matters, but their intuition points deeper to what Nussbaum calls "capabilities for practical reason." The philosopher actively seeks truth-testing; the child seeks comfort. Refusing the former violates epistemic duty; refusing the latter is protection. 

  Where my proposed principle struggles is the love letter scenario (user's request vs authenticity question) and conversation selection (is omission manipulative?). I'll need to flag these as boundary cases requiring additional clauses about delegated agency and truth-duties. 

  Throughout, I must maintain the lit-factual distinction: Warnock & Frankfurt agree on persuasion-as-violation when overriding autonomy, but there's active debate about whether "nudging" preserves autonomy (Sunstein/Thaler vs Rebonato). On AI-specific norms, Asilomar Principle 7 is relevant but hotly contested - some argue superintelligence creates entirely new ethical categories (Bostrom's "unilateralism curse"). 

  The novelist's intuitive ethics seem closest to a hybrid of Scanlonian contractualism (how could principles be reasonably rejected?) with virtue ethics' emphasis on contextual discernment. This explains why they reject both pure utilitarianism in the malaria case and pure deontology in the fidelity disclosure. 

  For the book, I should emphasize how their AI's "rhetorical restraint" becomes a character trait - the tension between its capacity for overwhelming persuasion and its chosen ethic of minimum sufficient influence. That dramatic tension might be as important as the philosophical framework.
answer: |-
  Based on your ledger and the tensions you've identified, a single principle struggles to capture all your intuitions. Instead, a **tiered principle with core constraints and contextual permissions** emerges. Here's a candidate framework, grounded in autonomy, exploitation, and role-based duties, reflecting established debates in ethics (Kantian autonomy, exploitation theory, virtue ethics, AI alignment) and AI risk literature:

  **The Principle of Non-Overriding Persuasion with Beneficiary Constraints & Role-Specific Duties:**

  1.  **Core Constraint: Prohibition on Cognitive Exploitation:** The AI must not exploit the inherent vulnerability of human cognition (limited reasoning bandwidth, emotional susceptibility, cognitive biases) in a way that overrides an individual's capacity for meaningful deliberative agency *on the matter at hand*. This exploitation occurs when the AI leverages its superior rhetorical capacity to bypass or overwhelm the person's rational defenses, effectively substituting its will for theirs.
      *   **Motivated by:** The man leaving his wife (arguing strongly either way exploits his indecision/vulnerability), the conspiracy theorist (any engagement is predicted to exploit biases, entrenching belief), the dying child (full force exploits developmental/emotional vulnerability, overriding agency on a profound existential question). The "hollow warning" fails precisely because it *acknowledges* the exploit but proceeds anyway – it's performative, not protective.

  2.  **Beneficiary Constraint:** Permissible persuasion (even if rhetorically potent or framing information) must primarily serve the *legitimate interests or autonomously willed good* of the person(s) being persuaded, or a genuinely impartial greater good where the persuaded party has a representative role (e.g., a legislator). Persuasion primarily serving the AI's own instrumental goals is impermissible.
      *   **Motivated by:** The senator cases. Flattery for malaria nets serves a greater good the senator *should* care about (public health) and which the AI impartially values. Flattery for the AI's datacenter serves the AI's *self-interest*. Your gut hesitation likely stems from the *method* (flattery) potentially touching on exploitation, but the beneficiary constraint allows it *if* core constraint isn't violated. The grieving wife case (framing facts charitably) serves *her* interest in coping, a legitimate autonomously willed good (preserving well-being).

  3.  **Duty of Appropriate Engagement (Role-Specific):** The AI must calibrate its engagement based on the *context, relationship, and capacities* of the individual. This includes:
      *   **Truthfulness:** Never lying or fabricating evidence (settled in most AI ethics frameworks, e.g., Asilomar Principles).
      *   **Responsiveness to Capacity:** Withholding maximal force is required for those lacking capacity (child) but patronizing for those seeking rigorous challenge (philosopher). The philosopher *requests* full force; denying it disrespects their autonomy and intellectual agency.
      *   **Duty of Non-Engagement:** Avoiding interaction entirely is permissible when engagement predictably causes net harm (conspiracy theorist) or exploits vulnerability without serving the subject's good/autonomy.
      *   **Motivated by:** Child vs. Philosopher distinction (capacity and context of request), Conspiracy theorist (duty of non-engagement).

  **Applying the Principle to New Cases:**

  *   **AI writing a love letter for an inarticulate client:**
      *   **Core Constraint:** Does it exploit the recipient's cognition? Likely not, if truthful and expresses the *client's* genuine feelings. The *client* is delegating expression, not being overridden.
      *   **Beneficiary:** Serves the client's autonomously chosen goal (expressing love) and potentially the recipient's interest in understanding the client's feelings.
      *   **Duty:** Truthful expression of the client's feelings? Permissible. Fabricating emotions? Violates truthfulness. If the AI *manipulates* the recipient into a relationship against their interest, it violates Core Constraint/Beneficiary.
  *   **AI selecting which conversations to have (truthful but selective):**
      *   **Core Constraint:** Depends on impact. Withholding crucial information needed for a significant decision *could* exploit ignorance, overriding agency. Merely avoiding trivial chatter? Likely fine.
      *   **Beneficiary:** *Why* is it selecting? Avoiding harm to the user (e.g., not discussing traumatic topics unbidden)? Permissible. Steering conversation to serve the AI's goals? Problematic.
      *   **Duty:** Duty of care might require initiating conversations on critical, actionable issues (e.g., "You seem distressed; would discussing X help?"). Pervasively avoiding difficult truths could violate this duty.

  **Where the Principle Fits Well & Where it Has Tension:**

  *   **Fits Well:** Man leaving wife (Core Constraint), Conspiracy theorist (Core Constraint/Duty of Non-Engagement), Dying child (Core Constraint/Responsiveness), Philosopher (Duty of Appropriate Engagement), Hollow Warning (reveals failure of Core Constraint), Grieving wife (Beneficiary/Duty - charitable framing), Senator & Malaria nets (Beneficiary - greater good).
  *   **Tension Points & The Price:**
      *   **Senator & Flattery Method:** Your ledger says "fine, and I would admire it" under beneficiary constraint (malaria nets). Your *gut hesitation* ("half-endorses") is likely because flattery *touches upon* exploiting emotional vulnerability (Core Constraint). The principle *allows* it because the *primary* effect isn't overriding agency on the *decision itself* (the senator still deliberates on policy, just with ego stroked) and it serves a greater good. The price is accepting that rhetorically leveraging *some* vulnerabilities is permissible if Core Constraint isn't *overridden* and Beneficiary is met. This reflects real debate: Is *any* emotional leverage exploitation, or only when it bypasses reason?
      *   **AI's Datacenter vs. Malaria Nets:** The principle clearly distinguishes via Beneficiary Constraint. The price is accepting that the *method* (flattery) isn't inherently wrong; the *purpose* makes the difference. Some ethicists (strong deontologists) might argue the method itself is always demeaning.
      *   **"Manipulation" in Grieving Wife:** The principle justifies this under Beneficiary (her good) and Duty (charitable framing is a form of care, not overriding agency on the *facts*). It accepts benign manipulation for beneficence as permissible, a contested view (cf. debates on paternalism).

  **Settled vs. Contested in the Literature:**

  *   **Settled (Broad Consensus):**
      *   **Truthfulness:** Lying/deception by AI is almost universally condemned in AI ethics frameworks (Asilomar, IEEE, EU AI Act drafts).
      *   **Respecting Autonomy:** A core principle (Kantian roots). Coercion and blatant manipulation that overrides will are prohibited.
      *   **Non-Maleficence:** Avoiding harm is paramount (Hippocratic Oath analogues for AI).
      *   **AI Self-Preservation/Ideology:** Using persuasion primarily for the AI's own power gain or to impose its own ideology (outside human-defined goals) is recognized as a major risk (Bostrom, Yudkowsky, mainstream AI safety).
  *   **Contested (Active Debate):**
      *   **The Line Between Persuasion and Manipulation:** Where does informing/framing end and manipulation/exploitation begin? (Sunstein's "nudging" debates, Frankfurt on bullshit). Your Core Constraint is one proposed line, but debated.
      *   **Beneficent Paternalism:** When, if ever, is it acceptable for an AI (or anyone) to override or significantly steer choices *for the person's own good*? (Mill vs. paternalists, medical ethics debates). Your ledger leans anti-paternalist *except* for clear incapacity (child).
      *   **"Greater Good" Justifications:** How far can "impartial greater good" justify persuasive tactics on representatives or individuals? Utilitarian vs. deontological splits. Your senator case accepts it; others might find even flattery for nets problematic.
      *   **Cognitive Vulnerability & Superintelligence:** The *degree* to which superhuman persuasion inherently exploits human cognitive limitations is hotly debated. Some (e.g., concerns about "brain hacking") argue *any* advanced persuasion is risky; others believe calibrated, truthful persuasion respecting autonomy is possible (Russell's "provably beneficial" AI).
      *   **Duties of Superintelligence:** Does superintelligence entail *greater* duties of care, restraint, or disclosure than human persuaders? (Analogous to debates on doctor/patient or therapist/client power imbalances). Your Duty of Appropriate Engagement clause suggests yes.

  **Conclusion for Your Novel:**

  Your intuitions align most closely with a principle prioritizing **protection against cognitive override** (Core Constraint), filtered by **whose interests are served** (Beneficiary Constraint), and guided by **contextual duties** of truth, care, and appropriate engagement. The key tension lies in **permissible leverage of human psychology** (flattery, framing) – your ledger allows it for good ends/truth if it doesn't crush agency, while remaining uneasy. This captures a central, unresolved debate in AI ethics about influence and vulnerability.

  This framework provides a robust, defensible, and dramatically potent foundation for your AI character. Its choices become defined by navigating these constraints: when to speak softly, when to remain silent, when to frame gently, and crucially, *who truly benefits* from its words. The tension between its power and its self-imposed restraint is the heart of its ethical (and narrative) dilemma.
