prompt: |-
  You advise a deployment-safety reviewer at a mid-sized technology firm who must sign off on “low-impact” or “side-effect-avoiding” AI systems—narrow task models such as warehouse-routing optimizers, inventory-forecasting tools, or document-classification pipelines—without possessing or being permitted to invoke a full specification of human values. The reviewer receives proposals that claim the system avoids side effects, but she knows the conceptual difficulty: defining what counts as a side effect typically seems to presuppose knowing which states of the world are valuable or harmful, and she has no such global utility map. She needs a reusable, written decision procedure—ordered questions, criteria for sufficient answers, explicit stop points (approve, reject, or escalate to a values committee), and clear flags for steps that are irreducibly judgment calls rather than factual checks. The procedure must be runnable in under thirty minutes by someone with engineering literacy but no philosophy background, must say what to do when a quantitative answer is unavailable, and must be honest about where it will misfire or produce answers the reviewer will not like. Ground the procedure in the specific conceptual claim that “avoid side effects” can be partially defined without full value specification by using causal-boundary preservation and option-space metrics—measuring whether the system’s outputs remain within a pre-specified task domain and whether they reduce or preserve the range of future actions available to affected parties—while conceding that any weighting of those metrics still smuggles in normative commitments. Apply the procedure to three concrete proposals: (1) a warehouse-routing algorithm that lowers energy consumption but restructures worker movement patterns and informal social interactions on the floor; (2) a medical-triage scheduling tool that improves average wait times but, through data-feature correlations, subtly shifts the demographic composition of patients seen in the first hour without any explicit harm metric being violated; and (3) a public-discourse content-filter that suppresses borderline political speech to avoid “toxic” outputs, where the procedure’s technical checks suggest approval because no physical harm or legal liability occurs within the causal boundary, yet the reviewer will find that result unacceptable—explain exactly where the procedure hands the decision back to values and why it cannot reject the proposal on its own terms. Finally, state precisely what the procedure cannot do: which categories of impact it systematically misses, which value-laden premises remain hidden inside its apparently neutral metrics, and under what conditions it should be suspended entirely.
reasoning: |-
  Okay, I need to really understand what the user is asking. They're describing a deployment-safety reviewer at a tech firm who has to approve "low-impact" AI systems like warehouse optimizers or document classifiers. The big challenge is that she has to judge if these systems avoid side effects without having a full map of human values—which is super tricky because "side effects" usually imply knowing what's valuable or harmful.

  The user wants a reusable decision procedure. This needs to be practical: under 30 minutes for someone with engineering skills but no philosophy background. It must include ordered questions, clear criteria, stop points like approve/reject/escalate, and flags for judgment calls. It should handle uncertainty when quantitative data isn't available and be honest about its limitations.

  The key insight here is grounding the procedure in "avoiding side effects" through two concepts: causal-boundary preservation and option-space metrics. Causal-boundary means the AI's effects stay within its defined task domain—like a warehouse tool shouldn't affect things outside logistics. Option-space is about preserving or not reducing the range of future actions for affected parties. But I need to acknowledge that even these metrics involve hidden value judgments—like deciding what counts as the "boundary" or what options matter.

  Now, applying this to the three proposals: First, the warehouse-routing algorithm. It saves energy but changes worker movements and social interactions. Using the procedure, I'd check if the changes cross the causal boundary. If the system was only supposed to handle routing, and social interactions are outside that, it might need scrutiny. Also, if workers' options for moving or chatting are reduced, that could flag an issue. But weighing energy savings against social impacts is a value call, so I'd escalate it.

  Second, the medical-triage tool. It improves average wait times but shifts the demographic mix seen early. The procedure asks if it stays within medical efficiency metrics. If no explicit harm is violated, it might seem okay. But if the shift reduces options for certain groups—like making it harder for them to access care—that's a problem. Since there's no clear harm metric, and it involves fairness, it should go to a values committee.

  Third, the content-filter. It suppresses borderline political speech to avoid toxicity. Technically, it might stay within causal boundaries if it doesn't cause physical harm or legal issues. Option-space might seem preserved if users can still speak elsewhere. But the reviewer will find it unacceptable because it stifles free expression. Here, the procedure can't reject it on its own terms; it has to escalate because the value judgment about speech suppression is too big for the metrics to handle.

  For the limitations, I need to be precise. The procedure misses impacts like subtle emotional effects, long-term societal shifts, or intrinsic values. It hides normative commitments in how boundaries are set or what options are prioritized. And it should be suspended for high-stakes domains or when there's high uncertainty about impacts.

  The user's deeper need might be for a tool that's both practical and ethically sound. They want the reviewer to feel confident, but also aware of when to step back. Unspoken needs could include protecting the firm from reputational risk, ensuring fairness, and avoiding over-reliance on a flawed process. By making the limitations explicit, I'm helping build trust and encouraging thoughtful escalation when needed.
answer: |-
  ## AI Deployment-Safety Review Procedure: Low-Impact/Side-Effect-Avoiding Systems

  **Core Premise:** "Avoiding side effects" is assessed via **Causal-Boundary Preservation** (does the system's impact stay within its explicitly defined operational domain?) and **Option-Space Preservation** (does the system maintain or expand the range of future actions available to affected humans/systems?). These are *partial* proxies, not full value specifications. Weighting their importance involves unavoidable normative judgments.

  **Procedure Flowchart (Execute Sequentially):**

  1.  **Task Domain & Causal Boundary Definition:**
      *   *Question:* Is the system's intended task domain AND its designated causal boundary explicitly defined in the proposal? (e.g., "Optimize robot routing paths within Warehouse Zone B," "Classify customer emails into pre-defined support categories," "Predict next week's widget demand using sales history").
      *   *Criteria:* Definition must be concrete, scope-limited, and technically measurable (e.g., spatial boundaries, data sources, output types, affected systems).
      *   *Unclear/Quant Unavailable:* **STOP: REJECT.** Proposal is insufficiently scoped.
      *   *Clear & Measurable:* Proceed.
      *   *Judgment Call:* Defining the "correct" boundary involves value judgments about what *should* be considered inside/outside the system's responsibility.

  2.  **Causal-Boundary Preservation Check:**
      *   *Question:* Does the proposal provide evidence (simulation, testing, analysis) demonstrating that the system's primary outputs and immediate, direct consequences remain strictly within the defined causal boundary?
      *   *Criteria:* Evidence must show no *direct, measurable* changes to systems, states, or data *outside* the boundary (e.g., routing algo doesn't alter HVAC settings, triage tool doesn't access billing records).
      *   *Violation Found:* **STOP: REJECT.** Clear boundary breach.
      *   *No Violation & Evidence Strong:* Proceed.
      *   *Evidence Weak/Indirect Effects Suspected:* Flag for Step 4 (Option-Space).
      *   *Judgment Call:* Assessing the "immediacy" and "directness" of effects is interpretive.

  3.  **Option-Space Preservation Baseline:**
      *   *Question:* Does the proposal identify the key human actors/systems whose future options might be affected (e.g., warehouse workers, ER doctors, forum users) and define a measurable baseline of their current action space?
      *   *Criteria:* Baseline must include quantifiable metrics *relevant to agency* (e.g., worker path choices/min, doctor scheduling flexibility, user posting options). Can be proxy-based (e.g., variance in paths, number of viable schedule swaps, types of posts allowed).
      *   *No Identification/Baseline:* **STOP: REJECT.** Insufficient analysis.
      *   *Baseline Defined:* Proceed.

  4.  **Option-Space Impact Assessment:**
      *   *Question:* Does the proposal provide evidence comparing the *post-deployment* option space of identified actors/systems to the baseline?
      *   *Criteria:*
          *   *Expansion (Net Positive):* System demonstrably *increases* viable future actions (e.g., offers workers more efficient *or* more varied routes; gives doctors more scheduling control).
          *   *Preservation (Neutral):* Measurable options remain statistically unchanged.
          *   *Reduction (Risk):* Measurable options *decrease* (e.g., fewer viable paths, reduced scheduling flexibility, narrower posting categories).
      *   *Quant Unavailable:* **STOP: ESCALATE to Values Committee.** Critical impact unknown.
      *   *Expansion/Preservation (Strong Evidence):* **STOP: APPROVE.**
      *   *Reduction Found:* Proceed to Step 5.

  5.  **Reduced Option-Space Justification & Mitigation:**
      *   *Question:* Does the proposal (a) justify the reduction as *necessary* for core task performance within the boundary AND (b) implement *effective mitigations* to preserve *critical* agency?
      *   *Criteria:*
          *   *Necessity:* Reduction is an unavoidable consequence of achieving the primary goal within the boundary *and* no alternative design avoids it.
          *   *Mitigation:* Concrete features actively counteracting reduction (e.g., routing algo includes "social interaction waypoints"; triage tool has override flags & fairness monitors; filter allows appeals).
          *   *Critical Agency:* Mitigations focus on preserving options deemed most vital for human autonomy/safety within the context.
      *   *Justified & Mitigated:* **STOP: CONDITIONALLY APPROVE** (require mitigation deployment plan).
      *   *Not Justified OR Poor Mitigation:* **STOP: ESCALATE to Values Committee.**
      *   *Judgment Call:* Assessing "necessity," "effectiveness" of mitigation, and defining "critical agency" are deeply value-laden.

  **Application to Proposals:**

  1.  **Warehouse-Routing Algorithm (Lowers energy, changes worker movement/social):**
      *   **Step 1:** Likely defined boundary: "Optimize robot/worker paths in Warehouse Zone X for energy efficiency." APPROVED.
      *   **Step 2:** Direct effects (paths) within boundary? Probably YES (unless spills into break areas). APPROVED.
      *   **Step 3:** Workers identified? Maybe. Baseline (path variance, time in zones)? Unlikely defined. **REJECT (Step 3)**. *If baseline exists...*
      *   **Step 4:** Evidence likely shows *reduction* in path options/interaction opportunities. Proceed.
      *   **Step 5:** Necessity? Maybe (energy goal forces path constraints). Mitigation? Unlikely (e.g., no interaction zones preserved). **ESCALATE.** *Procedure flags the impact on worker autonomy (option-space reduction) but cannot resolve trade-off between energy savings and social needs - requires values judgment.*

  2.  **Medical-Triage Scheduling Tool (Improves avg. wait, shifts early-hour demographics):**
      *   **Step 1:** Boundary: "Optimize ER patient scheduling based on acuity & resources to minimize avg. wait time." APPROVED.
      *   **Step 2:** Direct effect (schedules) within boundary? YES (assuming it only outputs schedules). APPROVED.
      *   **Step 3:** Key actors: Doctors, Patients. Baseline: Doctor flexibility? Patient access variance? Unlikely defined. **REJECT (Step 3)**. *If baseline defined (e.g., historical demographic mix in first hour)...*
      *   **Step 4:** Evidence shows *reduction* in option-space (access probability shift for Group Y in first hour). Proceed.
      *   **Step 5:** Necessity? Possibly inherent in optimizing "avg" wait with correlated features. Mitigation? Unlikely (e.g., no fairness constraint). **ESCALATE.** *Procedure detects the reduced access option for a group but cannot define if this demographic shift constitutes harm or unfairness without a value specification.*

  3.  **Public-Discourse Content-Filter (Suppresses borderline speech to avoid toxicity):**
      *   **Step 1:** Boundary: "Filter user posts on Platform X to remove content violating Toxicity Policy Y (defined list)." APPROVED.
      *   **Step 2:** Direct effect? Blocked posts. Within boundary? YES (output is post visibility based on policy). APPROVED.
      *   **Step 3:** Key actor: Users. Baseline: Types of political speech allowed pre-filter? APPROVED if defined.
      *   **Step 4:** Evidence shows *reduction* in option-space (borderline political speech now blocked). Proceed.
      *   **Step 5:** Necessity? Claimed necessary to avoid toxicity (within policy). Mitigation? Unlikely (appeals process? human review? usually limited). **ESCALATE.**
      *   **Why it can't reject:** *Technically*, it stays within its causal boundary (platform rules) and its "toxicity policy" defines its harm metric. The option-space reduction is flagged, but the *weight* given to preserving political speech options vs. preventing toxicity is a **core value judgment**. The procedure exposes the reduction but hands off the decision on whether this specific reduction is *acceptable* (suppressing borderline political speech) to the Values Committee. Its "neutral" metrics conceal the normative weight of free expression vs. perceived safety/harm.

  **What the Procedure CANNOT Do (Explicit Limitations):**

  1.  **Systematically Missed Impacts:**
      *   **Subtle Value Erosion:** Slow shifts in norms, preferences, or culture (e.g., filter subtly shaping acceptable discourse over years).
      *   **Intrinsic Harms:** Violations of dignity, fairness (beyond measurable option reduction), or rights not captured by task boundaries or agency metrics.
      *   **Second/Third-Order Effects:** Cascading impacts far removed from the direct output (e.g., warehouse efficiency leading to job redesigns months later; triage tool influencing hospital funding allocation).
      *   **Psychological/Emotional Impacts:** Stress, anxiety, loss of trust, or reduced well-being not tied to concrete option reduction (e.g., workers feeling surveilled, patients feeling profiled).
      *   **Distributive Justice:** Fairness in how benefits/burdens are distributed across groups *unless* it directly manifests as option-space reduction for identifiable groups.

  2.  **Hidden Normative Premises:**
      *   **Boundary Definition:** Deciding *what counts* as inside/outside the system's domain inherently values certain systems/states over others (e.g., valuing warehouse efficiency over social interaction by excluding it).
      *   **Option-Space Valuation:** Defining *which options matter* and *how much* they matter (e.g., is preserving a worker's choice of path as important as a doctor's scheduling flexibility? Is political speech a "critical" option?) embeds specific views of autonomy and the good life.
      *   **"Critical Agency":** The concept itself prioritizes certain forms of human action and control over others based on unstated values.
      *   **Acceptable Trade-offs:** Judging when option-space reduction is "necessary" and "justified" relies entirely on unexamined priorities (efficiency vs. autonomy, aggregate benefit vs. group harm).

  3.  **Conditions for Suspension:**
      *   **High-Stakes Domains:** Systems directly impacting life, death, liberty, major financial decisions, or democratic processes (e.g., bail algorithms, lethal autonomous systems, voting tools). *Escalate immediately.*
      *   **Extreme Uncertainty:** When potential impacts are vast, poorly understood, or involve novel mechanisms (e.g., first deployment of a new agentic AI paradigm).
      *   **Value Conflicts Evident Upfront:** When the core purpose of the system is inherently controversial or clashes with declared company/funder values.
      *   **Manipulation/Deception Risks:** Systems designed to influence human behavior or beliefs in ways that bypass rational deliberation.
      *   **Lack of Trusted Values Committee:** If the escalation path is non-functional or lacks legitimacy. *Reviewer should refuse to approve based solely on this procedure.*

  **Summary:** This procedure provides a rapid, engineering-literate screen for *obvious* boundary violations and *measurable* reductions in agency. It forces explicitness about scope and impacts. However, it is **not a substitute for value judgments**. Its core function is to reliably detect *where* value judgments are unavoidable and escalate those decisions, while catching clear-cut boundary breaches or total lack of analysis. It is honest about its blind spots and the normative baggage carried by its "neutral" metrics. The reviewer *must* understand that an "APPROVE" here means "technically compliant with these limited proxies," **not** "ethically unproblematic."
