prompt: |-
  hey, i'm trying to figure out what actually matters in burkean conservatism if you're using it to think about institutional safeguards rather than just defending the status quo. chesterton's fence gets thrown around constantly, but the interesting part for me is the edge case where the fence is basically a load-bearing wall for distributed tacit knowledge — stuff no one can fully articulate — versus when it's just path dependancy locking in bad equilibria. if you had a small conceptual team and about three years, which open questions should they actually prioritize? specifically i'm torn between three: (1) the epistimic problem of identifying which fences are load-bearing vs ornamental, (2) the tension with burke's skeptisism about rationalist reconstruction — does solving (1) change how conservative reform should work, or is it downstream?, and (3) this underexplored temporal modeling problem where we preserve old fences partly because we can't compute the counterfactual of tearing them down quickly enough. rank them, defend the ordering in terms of what's upstream and what's just an application, and tell me which implications for actual policy design are overrated and which ones genuinely change things. i want reasoning, not a survey.
