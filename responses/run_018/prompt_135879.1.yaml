answer: |-
  Your inquiry dissects the profound philosophical underpinnings of Plutarch's comparative method. Let's reconstruct its implicit theory and contrast it with hagiographic tradition:

  **Implicit Philosophical Commitments:**
  1.  **Moral Cognition as Active Judgment:** Rejects passive reception of fixed truths. Presupposes moral understanding arises from *deliberation* – comparing, contrasting, weighing complexities within and across lives.
  2.  **Exemplarity as Fractured & Contextual:** Virtues/vices are not abstract universals applied identically but emerge from specific circumstances, temperament, and cultural/political constraints. A single "perfect" model is impossible; exemplarity lies in the *tension* between figures.
  3.  **Cross-Cultural Moral Knowledge as Possible but Complex:** Assumes *sufficient commonality* in human experience (ambition, courage, justice, betrayal, mortality) for meaningful comparison. However, it does *not* require virtues/vices to be culturally invariant *in their specific expression or weighting*. The comparative act itself *illuminates* both commonalities and culturally-constituted differences ("greatness" in Athens vs. Rome).
  4.  **Character as Dynamic & Contradictory:** Human character is not monolithic or static. Contradictions (e.g., Alexander's strategic brilliance and reckless rage) are inherent and revealing, not flaws to be erased. Moral truth resides in the whole, messy picture.
  5.  **Pedagogy as Provocation:** Aims not to provide answers but to stimulate the reader's own moral reasoning. The unresolved parallel is the pedagogical tool.

  **Mechanism of Moral Learning:**
  *   **Primary Mode: Deliberative Weighing of Incommensurable Characters.** Plutarch forces the reader to hold two distinct, complex, and often conflicting models simultaneously. The value isn't in finding a perfect analog ("Solon is just like Numa") but in the cognitive *friction* generated by their differences and similarities within comparable situations (crisis, founding, death). The reader must weigh choices, consequences, and temperaments *across* contexts.
  *   **Secondary/Supporting Modes:**
      *   **Analogical Transfer:** Recognizing *structural similarities* in challenges or virtues across contexts (e.g., recognizing "courage" or "political cunning" in different forms). However, this is a starting point, not the goal; the comparison quickly reveals differences complicating simple transfer.
      *   **Emotional Admiration:** Readers may admire aspects of each life, but this admiration is directed at the *specific, contextualized action or trait* within the fractured whole ("Brutus's stoic resolve," "Caesar's dynamism"), not the entire person as a seamless saint. Admiration is tempered by critical awareness of flaws.

  **Consistency with Hagiographic Tradition:**
  The paired, unresolved format is **fundamentally incompatible** with the core aims of hagiography due to conflicting accounts of what a life reveals about character and the purpose of biography:

  1.  **Contradiction vs. Unity:**
      *   **Plutarch:** Contradictions are essential data revealing the complexity of character and the interplay of virtue/vice/fortune. They are preserved to provoke judgment.
      *   **Hagiography:** Contradictions (especially moral failings) threaten the unified portrait of sanctity. They are suppressed, explained away (as trials, youthful errors overcome), or reinterpreted to reinforce the singular model of holiness. Unity *is* the revelation of character – the manifestation of divine grace overcoming human frailty.
  2.  **Purpose of Biography:**
      *   **Plutarch:** To equip the reader for practical, worldly moral judgment in the messy realm of politics and human affairs through comparative analysis.
      *   **Hagiography:** To inspire devotion, provide an unimpeachable model for emulation, affirm faith, and demonstrate the power of the divine working *through* a life. The saint's life is a testament to transcendent grace, not a subject for secular moral deliberation.
  3.  **Nature of Exemplarity:**
      *   **Plutarch:** Exemplarity is *relational* and *dialectical*, emerging from the comparison itself. No single figure is complete.
      *   **Hagiography:** Exemplarity is *singular* and *absolute*. The saint *is* the perfected model, embodying the virtues in their fullness as defined by the faith. Imitation, not comparative judgment, is the goal.

  **Transforming the Practice for Direct Emotional Attachment:**
  If Plutarch's implicit view were replaced by a theory prioritizing direct emotional attachment to a singular, unproblematic model (akin to hagiography), the paired, unresolved format would require radical changes:

  1.  **Elimination of Pairing:** The core comparative structure dissolves. Only *one* life is presented, isolated from potentially complicating parallels.
  2.  **Suppression of Contradiction:** Ambiguities, failures, and morally questionable actions within the chosen life must be minimized, excused, reinterpreted as tests of faith/virtue, or omitted entirely. The narrative smooths fractures into a coherent arc of progress towards perfection.
  3.  **Resolution of Narrative:** The biography concludes with a definitive synthesis, presenting the subject as a unified, integrated exemplar. Moral lessons are explicit and unambiguous.
  4.  **Shift from Judgment to Emulation:** The reader's role changes from active deliberator weighing complexities to passive (or actively devotional) recipient inspired to imitate the perfected model. Critical distance is discouraged.
  5.  **Decontextualization (or Recontextualization):** The subject's specific cultural/political context becomes secondary to their universal exemplarity. Context is used only to highlight challenges overcome by inherent virtue/grace, not to relativize their actions.
  6.  **Primacy of Emotion:** The narrative prioritizes eliciting admiration, awe, pity (for suffering), and love for the model, replacing cognitive comparison with affective bonding. Rhetoric emphasizes the subject's exceptional, often superhuman, qualities.
  7.  **Pedagogical Goal:** Transformed from developing critical moral reasoning skills to fostering commitment, devotion, and the internalization of specific virtues *as embodied perfectly* by the singular exemplar.

  **Conclusion:**
  Plutarch's method presupposes a dynamic, context-sensitive, and deliberative model of moral cognition. It trusts the reader's capacity to navigate complexity and contradiction across cultures, seeing virtues and vices as recognizable yet variably manifested human constants. Its power lies in the unresolved tension between lives, forcing active judgment. This stands in stark opposition to the hagiographic tradition, which seeks unified, transcendent models inspiring direct emulation through emotional attachment, necessitating the suppression of contradiction. Transforming Plutarch's practice into one focused on a singular, unproblematic model would dismantle its core comparative structure, eliminate its revelatory contradictions, and shift the pedagogical burden from the reader's judgment to the subject's perceived perfection.
