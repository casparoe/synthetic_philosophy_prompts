  Write me the proposal: state the question precisely so it's not just "is backsliding real," explain why the standard procedural/substantive framing genuinely leaves this open rather than answering it, lay out the actual method month by month (what texts or datasets I'd examine, what comparative moves I'd make, not just "I'll read more"), say exactly what a result that saves the concept from being a partisan label would look like and what counts as the project failing entirely, and be honest about whether three months is enough. Take a definite position — defend whether this trust-decay framing actually rescues the concept, name the closest competing framing, and say why it's wrong. Don't list options and leave me to pick. No bibliography or citation requests, I'll add those later, and please ignore the typo in "proceedural" above but feel free to leave one or two in your response if it sounds natural.
