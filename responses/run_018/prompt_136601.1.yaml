answer: |-
  ## Proposal: Salvaging Democratic Backsliding Through Institutional Trust Decay

  **Research Question:** Does reconstructing democratic backsliding as a phenomenon of *institutional trust decay* – measured behaviorally through citizen withdrawal of recognition – provide a less partisan, empirically robust explanation than dominant procedural or substantive frameworks, and does this reconceptualization confirm, refine, or fracture conventional backsliding verdicts in Hungary, Poland, Turkey, and the US?

  **Beyond Proceduralism vs. Substantivism: The Stalled Debate**
  The current impasse stems from frameworks treating symptoms as causes. Proceduralists (e.g., Dahl, Przeworski) focus on *technical functionality*: free elections, judicial independence, legislative checks. Substantivists (e.g., Müller, Levitsky & Ziblatt) focus on *outcomes*: rights protection, minority inclusion, equality before the law. Both frameworks face partisan challenges:
  1.  **Procedural Blindness:** An autocrat can technically win elections (manipulating rules/media) and pack courts "legally," satisfying procedural minima while hollowing democracy.
  2.  **Subjective Substantivism:** Defining "substantive" democracy inevitably involves contestable normative judgements vulnerable to accusations of partisan bias (e.g., "illiberalism" critiques).
  Both miss the *precondition* enabling decline: the erosion of citizens' fundamental belief that institutions possess inherent **authoritive** legitimacy, regardless of their formal function. When citizens withdraw recognition – refusing to defer to rulings, dismissing electoral outcomes as illegitimate, bypassing official channels – institutions lose power, creating space for backsliding, even if they technically "work." This trust-decay is the *mechanism* both frameworks overlook.

  **Methodology: Tracking Trust Decay Empirically (3-Month Plan)**

  *   **Month 1: Deconstructing Frameworks & Defining Trust Metrics**
      *   **Weeks 1-2:** Critical analysis of key procedural (e.g., Dahl, Przeworski) and substantive (e.g., Müller, O'Donnell) texts. Identify core criteria and their documented limitations in explaining *why* decline occurs.
      *   **Weeks 3-4:** Define "institutional trust decay" operationally as **withdrawal of recognition**, measurable through:
          *   **Survey Data:** Longitudinal analysis of World Values Survey (WVS), Eurobarometer (EB), Pew Research datasets tracking *confidence* in parliament, courts, elections, media, civil service. Focus on *trends* and *gaps* between trust in specific institutions and generalized system support.
          *   **Behavioral Proxies:** Petitioning rates (decline = bypassing), protest frequency/motivation (specifically against institutional legitimacy), compliance rates (e.g., tax, rulings), use of parallel institutions (e.g., alternative media reliance, NGO arbitration).

  *   **Month 2: Case Study Application & Comparative Metric Development**
      *   **Weeks 5-6:** **Hungary & Poland:** Apply trust-decay metrics. Analyze WVS/EB trends pre/post Fidesz/PiS consolidation (~2006-2010 baseline). Examine protest waves (e.g., Polish judiciary protests), judicial compliance crises, media trust polarization. Cross-reference with procedural/substantive decline timelines.
      *   **Weeks 7-8:** **Turkey & US:** Apply same metrics. Turkey: Analyze WVS/Gallup trends pre/post 2013 Gezi/2016 coup attempt, Erdoğan's consolidation. Focus on court defiance, election result rejection patterns. US: Analyze ANES/Pew trends pre/post 2016, tracking confidence collapse in elections (2020), courts (SCOTUS legitimacy debates), Congress. Map against procedural erosion (filibuster, gerrymandering) and substantive conflict (voting rights, minority protections).
      *   **Week 8:** Develop **Comparative Trust-Decay Index:** Synthesize data (survey trends + behavioral intensity) to create a standardized, ordinal ranking of trust-decay severity/timing across cases.

  *   **Month 3: Analysis, Validation, and Concept Assessment**
      *   **Week 9:** Compare Trust-Decay Index ranking against conventional academic/policy backsliding verdicts (e.g., V-Dem Liberal Democracy Index declines, Freedom House downgrades). Does trust-decay *precede*, *coincide with*, or *follow* procedural/substantive decline?
      *   **Week 10:** Critical Assessment:
          *   Does the trust-decay framework **confirm** conventional verdicts (showing Hungary/Poland/Turkey high decay, US significant decay correlating with decline)?
          *   Does it **refine** them (e.g., showing US decay concentrated in specific institutions/partisan groups, or revealing Poland's decay preceded PiS more than Hungary's preceded Fidesz)?
          *   Does it **fracture** them (e.g., revealing Turkey had high substantive concerns but complex trust patterns pre-Erdoğan, or US procedural metrics are stable while trust implodes)?
      *   **Week 11:** Defend the Framework: Does focusing on citizen recognition rescue "backsliding" from partisan bias? Draft conclusions and implications.
      *   **Week 12:** Finalize Proposal Paper, Integrate Feedback.

  **What Success Looks Like (and Failure):**
  *   **Success (Saves the Concept):** Trust-decay patterns are **consistent precursors or core mechanisms** of decline across cases, observable *before* major procedural breaks and explaining *why* substantive norms collapse. The metric **correlates strongly with conventional verdicts but provides a clearer, less normatively contested causal mechanism.** This demonstrates backsliding is not *just* elite action or partisan labelling, but rooted in measurable societal disengagement. *Example:* Data shows Hungarian judicial trust plummeted *before* court-packing, driven by Fidesz rhetoric, enabling the procedural change.
  *   **Failure (Concept Unsalvageable via Trust):** Trust-decay metrics are **inconsistent, lagging, or unrelated** to procedural/substantive decline. Patterns are **highly partisan** (e.g., only opposition loses trust, trust shifts wildly with election outcomes unrelated to institutional performance), or **fail to track** conventional backsliding cases (e.g., Turkey shows high trust despite decline, US shows decay but no comparable procedural backslide). This suggests trust is merely an *epiphenomenon* or *partisan symptom*, not a core mechanism, leaving "backsliding" fundamentally contested.

  **Definite Position: Why Trust Decay Rescues the Concept (and Why Elite-Centric Views Fail)**
  **Yes, the trust-decay framing rescues democratic backsliding from being a purely partisan label.** It shifts focus from contested endpoints (what *is* democracy?) or elite maneuvers (how *did* they break it?) to an observable *societal process*: the withdrawal of the foundational consent that makes institutions function. This is measurable behaviorally and through surveys, reducing reliance on contested normative judgments about outcomes or easily manipulated procedural checks.

  The **closest competing framing is elite-driven institutional sabotage** (e.g., Levitsky & Way's "competitive authoritarianism," focusing on how incumbents abuse rules). This view is **incomplete because:** 1) It often assumes elites act against resilient institutions, ignoring how prior trust decay *enables* their actions (e.g., Orbán couldn't dismantle a trusted judiciary overnight); 2) It struggles to explain societal *acquiescence* or *support* for backsliding; 3) It risks circularity (elites are backsliding because they are anti-democratic elites). Trust decay provides the *social substrate* explaining why elite actions succeed and why backsliding gains traction beyond the ruling party.

  **Feasibility in 3 Months:** Three months is sufficient for an intensive pilot study demonstrating the *plausibility and potential* of this reframing. It allows for a focused literature review, targeted data collection on key metrics for four cases, comparative analysis, and a robust argument. It will **not** produce a definitive, exhaustive theory or original large-N statistical analysis. It *will* provide a novel conceptual framework, preliminary empirical evidence, and a clear methodological path for future research. The tight timeline necessitates strict focus on the core question and predefined datasets but is viable for a compelling summer project.
