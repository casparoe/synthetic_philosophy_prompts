  Effective axiomatization means the system must have a decidable set of axioms and rules. This is crucial because Gödel's proof relies on the ability to mechanically check proofs. Without this, the entire framework falls apart.

  Consistency is non-negotiable. If the system isn't consistent, Gödel's theorems don't apply because an inconsistent system can prove anything, making incompleteness irrelevant. The user needs to understand that consistency is a hard requirement.

  Arithmetical representability requires that the system can encode basic arithmetic operations. Gödel numbering is essential here, as it allows statements about the system to be represented within the system itself. If a system can't handle Robinson Arithmetic (Q) or something equivalent, Gödel's theorems don't apply.

  I should also clarify common confusions. Syntactic vs semantic completeness: Gödel deals with syntactic incompleteness (unprovability), not semantic incompleteness (truth in all models). People often mix these up. Also, the distinction between first and second theorems is important. The first is about unprovable truths, the second about unprovable consistency.

  The user asks which requirements are non-negotiable versus formalist preferences. Effective axiomatization, consistency, and arithmetical representability are all mandatory. Without any one of these, the theorems don't hold. Formalist preferences might include viewing mathematics as purely syntactic, but that's not necessary for the theorems to apply.

  They also want to know if there's a subset of requirements that's jointly unsatisfiable for non-mathematical systems. The biggest issue is arithmetical representability. Natural systems like minds or evolved AIs likely can't be effectively axiomatized, meaning they don't have a fixed set of decidable axioms. This alone makes applying Gödel's theorems to such systems invalid.

  The single requirement that kills most pop-science takes is probably arithmetical representability. People often assume that any complex system can be "like arithmetic," but that's not true. Human cognition or AI systems don't have the necessary recursive structure to encode arithmetic operations internally.

  I should also mention that consistency is another common failure point. Pop-science arguments sometimes ignore whether the system is consistent, which is essential for Gödel to apply. And the confusion between the first and second theorems leads to misinterpretations about what the theorems actually imply.

