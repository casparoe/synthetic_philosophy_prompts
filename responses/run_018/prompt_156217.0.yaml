answer: |-
  Here's a rigorous specification for applying Gödel's incompleteness theorems (G1 & G2) outside pure mathematics, addressing your key requests:

  **Core Non-Negotiable Desiderata (The Absolute Minimum):**
  *   **1. Effective Axiomatization (Formal System):** The target system **must** be formalizable as a **recursively axiomatizable** formal system `F`.
      *   **What it means:** There must exist a finite set of axioms or a decidable procedure (algorithm) to generate all axioms. The inference rules must be computable/finite. Proof verification (`PROOF_F(m, n)`: "m is a Gödel number of a proof in F of the formula with Gödel number n") must be a **decidable (computable) relation**.
      *   **Why non-negotiable:** Gödel's proof fundamentally relies on the arithmetization of syntax *within* the system. This requires proof-checking to be a mechanical, algorithmic process representable *within* the arithmetic `F` itself. Without effective axiomatization, "provability in F" isn't definable within `F`.
  *   **2. Sufficient Expressive Power (Arithmetical Representability):** `F` **must** be strong enough to represent (or interpret) a sufficient fragment of arithmetic.
      *   **Minimal Standard:** `F` must interpret **Robinson Arithmetic (Q)** or be **Σ₁-sound**. Q is a very weak, finitely axiomatizable theory capturing basic arithmetic (successor, addition, multiplication, inequalities).
      *   **What it means:** All recursive functions (including the syntactic ones needed for arithmetization like `PROOF_F(m, n)`) must be *representable* within `F`. Crucially, the consistency statement `Con(F)` ("There is no proof in F of 0=1") must be expressible *as a formula within the language of F*.
      *   **Why non-negotiable:** Gödel numbering and the construction of the Gödel sentence `G_F` ("I am not provable in F") and `Con(F)` depend entirely on this ability to encode and manipulate syntactic properties *as arithmetic statements* within `F`. If `F` can't talk about its own proofs arithmetically, G1/G2 don't apply.
  *   **3. Omega-Consistency (for G1) / Consistency (for G2):**
      *   **G1 Requirement:** `F` must be **ω-consistent** (if `F` proves ∃x P(x), then there is some numeral n such that `F` does *not* prove ¬P(n)). *Later relaxed to **Σ₁-soundness** (if `F` proves a Σ₁-sentence - essentially a finitely verifiable existential statement - then that sentence is true in the standard integers), which is stronger than simple consistency but weaker than ω-consistency.* **Simple consistency is NOT sufficient for G1.**
      *   **G2 Requirement:** `F` must be **simply consistent** (does not prove a contradiction like 0=1). *This is absolutely fundamental for G2's meaning.*
      *   **Why non-negotiable:** G1 requires that the Gödel sentence `G_F` is *true* (if `F` is consistent/ω-consistent/Σ₁-sound). G2's conclusion `F ⊬ Con(F)` only holds if `F` *is* consistent. An inconsistent `F` trivially proves everything, including `Con(F)` and `¬Con(F)`, rendering G1/G2 meaningless.

  **Critical Distinctions That Cannot Be Collapsed:**
  *   **Syntactic Incompleteness (Gödel) vs. Semantic Incompleteness:** Gödel proves **syntactic incompleteness** – the *unprovability* (and under soundness assumptions, *truth*) of specific sentences *within the formal system*. This is distinct from **semantic incompleteness** (e.g., Löwenheim-Skolem, Gödel's *completeness* theorem for FOL), which deals with truth across all models. Pop-sci often confuses "incomplete" meaning "can't prove everything" with "incomplete" meaning "has non-standard models".
  *   **First Theorem (G1) vs. Second Theorem (G2):**
      *   **G1:** Shows the existence of formally undecidable propositions (`G_F`) in sufficiently strong consistent systems. Primarily about *limitations of proof*.
      *   **G2:** Shows that a sufficiently strong consistent system `F` cannot prove its own consistency statement (`Con(F)`). Primarily about the *unattainability of self-certification* of consistency *using the system's own methods*. Pop-sci often conflates the "undecidable sentence" of G1 with the "consistency statement" of G2, or uses G1 to handwave about unknowability, missing G2's specific point about self-consistency proofs.
  *   **Truth vs. Provability:** Gödel sentences (`G_F`) are constructed to be *true* (under the assumption of `F`'s consistency/soundness) *but unprovable in F*. Gödel's theorems link truth and provability via this construction and the soundness/consistency assumption, but they do *not* assert that truth is *always* beyond proof. Pop-sci often leaps to profound but unsupported claims about absolute unknowability or inherent human superiority based on this distinction.
  *   **Formal System vs. Intuitive Theory:** The theorems apply to the *formalized system* `F`, not directly to the intuitive mathematical concepts it attempts to formalize. Pop-sci often applies GIT to vague notions like "human thought" or "the universe" as if they *are* formal systems.

  **Formalist Preferences (Not Strictly Required for GIT Validity):**
  *   **Platonism vs. Formalism:** Gödel himself was a Platonist who believed `G_F` was evidence of mathematical truth beyond formalism. The *proofs* of G1/G2 are syntactic and work within a formalist framework. You don't need to *believe* in abstract mathematical objects for the theorems to hold *about the formal system*; you just need the system to exist syntactically and satisfy the core desiderata. The *interpretation* of what `G_F` means (a true fact about numbers vs. an artifact of the system) is where philosophy enters.
  *   **Requiring Full PA or ZFC:** The minimal requirement is interpreting Q (Robinson Arithmetic). Systems much weaker than Peano Arithmetic (PA) or ZFC are susceptible. Pop-sci often implies you need "complex" systems, but the requirement is about *arithmetical strength*, not overall complexity or size.

  **The Fatal Flaw for Most Non-Mathematical Applications:**
  The most common **jointly unsatisfiable requirement** for natural systems (brains, minds, evolved AIs, the universe) is **Effective Axiomatization + Sufficient Expressive Power**.

  *   **Effective Axiomatization is the Primary Killer:** Natural systems like human cognition or evolved intelligence **lack a fixed, recursively enumerable set of axioms and computable proof verification procedures**. Their "rules" are messy, dynamic, embodied, probabilistic, and likely impossible to fully capture in a stable, decidable formal system. Gödel's machinery *requires* this fixed, algorithmic proof structure to define `PROOF_F(m, n)` and construct `G_F` and `Con(F)`. If you can't cleanly formalize the system's "inference rules" as a computable process, Gödel's theorems are inapplicable.
  *   **Arithmetical Representability is Secondary but Crucial:** Even *if* one could formalize (e.g.) human reasoning as a system `H`, it's highly dubious that `H` inherently contains a faithful representation of Robinson Arithmetic (Q) *within its own operational rules*. Gödel's self-referential trick *requires* the system's own syntax to be encoded via arithmetic *within the system itself*. Natural systems aren't built on a foundation of integer arithmetic in the necessary way.

  **The Single Requirement That Kills the Most Pop-Sci Takes:**
  **Effective Axiomatization.**

  *   **Why:** The vast majority of pop-sci invocations (e.g., "Gödel proves AI can't be conscious/reason perfectly/understand itself", "Gödel shows human thought transcends machines", "The universe is incomplete") implicitly or explicitly treat the target (mind, AI, universe) *as if it were* a fixed, algorithmically describable formal system like PA. They **presuppose the existence of the formal system `F`** with computable axioms and rules. This is almost always a massive, unjustified assumption. Natural systems are not formal systems in this Gödelian sense. The category error lies in assuming the messy, dynamic, physical, or biological target *has* or *is* a recursively axiomatizable formal system. Without this formalization step, Gödel's machinery simply doesn't engage.

  **In Summary:** To responsibly apply Gödel outside math, you need a **recursively axiomatizable formal system `F`, capable of representing basic arithmetic (Q), and consistent (or ω-consistent/Σ₁-sound for G1)**. You *must* respect the distinctions between syntax/semantics, G1/G2, and truth/provability. The core barrier for non-mathematical systems is **providing the required formalization (`F`)** meeting these specs, especially effective axiomatization. Most invocations fail precisely here, committing a category error by misidentifying the target as a formal system.
