prompt: |-
  I lead a team of health assessors for a public body that decides claims for a disability benefit. We handle something like forty cases a week; an assessor has about half an hour with a claimant and a short written record to complete, which a case manager signs off the same day. Each decision moves several years of payments and can be appealed to a tribunal. My assessors are nurses, physiotherapists and occupational therapists. None of them has any training in philosophy, and none of them will read a bibliography: anything useful has to be built into the questions they ask.

  The reason I am asking now is partly personal. Until last year I described a condition I have had since childhood with a word my grandmother used, which in our family meant something like bad nerves. When a neurologist finally gave it a name, it turned out that I had been talking about a specific, well-understood disorder for thirty years while holding almost no true beliefs about it. That is entirely ordinary, and my assessors see it daily. Claimants tell us they have arthritis in the thigh, that their water is bad, that they have the sugar, or they use a word from a first language that our interpreters render as epilepsy or asthma when that word, in the community it comes from, covers a wider or simply different set of troubles. Our working rule at present is crude: if the claimant's own account does not line up with the diagnostic category in our regulations, we treat the claim as unsubstantiated and score the item down. I have come to think that is wrong, and wrong in a way I can now name. What a person's word picks out is not settled by what is in their head; it is settled by what the thing is, by the history of the word in their community, and by which speakers that usage answers to. A claimant can therefore be referring to a real condition while badly misunderstanding it, and can equally be referring to something other than what we take her to be referring to. What I cannot do is hand my assessors a theory.

  Please write me a decision procedure they can run, grounded in that idea but never naming it as a theory, with:

  1. the questions in the order an assessor should ask them, and what counts as a sufficient answer to each. I imagine questions of roughly these kinds: is this a term the claimant would defer to a clinician about, or a term on which she is herself the authority; could the thing she names turn out not to be what she takes it to be without her being able to tell by how it feels; is there anyone the usage answers to in her community, and what is to be done when there is not.
  2. where the procedure stops with a no, and where it must stop and hand the decision to a person because the remaining question is one of values rather than fact.
  3. an honest note on which distinctions have to survive into a half-hour assessment and which can be dropped, and what we lose by dropping them.
  4. a short statement of what the procedure cannot do, and one thing an assessor must never use it for.

  Then run it on three composites I have put together from our caseload. First, a claimant who writes that he has arthritis in his thigh muscle and describes pain and swelling there, with no joint involvement. Second, a claimant whose first language is not English and whose word for her condition is glossed for us as epilepsy, although in her community that word covers both what we call epilepsy and a kind of faint with a different cause and a different outlook; her symptoms and everything she believes about herself are indistinguishable from those of the English-speaking claimant in the next room who says she has epilepsy. Third, a claimant whose condition has no settled medical standing, because her doctors disagree about it, or have withdrawn the label, or have offered her three. For each, tell me what the assessor records and what happens next, and include at least one case where the answer the procedure gives is one I will not like.

  Write it in British English, with our spelling and usage. No citations, references or reading lists, please, and no jargon an assessor would have to look up: where a distinction needs a name, give it a plain one.
reasoning: |-
  Okay, let me approach this systematically. The user leads a team of health assessors for disability claims, facing a fundamental challenge: claimants often describe conditions using terms that don't neatly align with medical definitions. This isn't just professional - it's personal, stemming from their own experience of mislabelling a condition for years. 

  The core insight here is profound: meaning isn't solely in the speaker's mind but emerges from usage, community, and reality. As Wittgenstein might say, meaning is use. The user needs this translated into practical steps for assessors without philosophical jargon. 

  Breaking down the requirements:
  1. Need a step-by-step decision procedure that never mentions "theory" or "philosophy"
  2. Must handle three key scenarios: mismatched terminology, cross-cultural labels, and medically contested conditions
  3. Requires clear stopping points for objective vs value judgments
  4. Must acknowledge limitations honestly

  For the procedure itself, I'm considering a four-step flow:
  First, establish what the claimant means by their term - is this about lived experience or a medical label? 
  Then, determine if it's "clinician's business" - would they defer to experts about the nature of this thing? 
  Next, check for community usage - does this term track to shared understanding? 
  Finally, resolve the factual question: does the described experience match the required criteria?

  Crucially, step three is where we might hit cultural gaps requiring interpreter input. And step four must distinguish between establishing facts (our job) and interpreting regulations (case manager's job).

  For the case studies:
  The "thigh arthritis" case shows how the procedure validates real symptoms while correcting terminology. 
  The epilepsy/faint case demonstrates handling cultural linguistics without medical gatekeeping. 
  The contested diagnosis case will be uncomfortable - it exposes where the system struggles with medical uncertainty, which might disappoint the user but proves the procedure's honesty.

  The limitations section must stress this isn't for verifying medical validity or overriding regulations - just bridging understanding gaps. And we'll need plain-language terms like "Own-Term Question" instead of "autophenomenology".

  Throughout, I'll maintain British English and avoid any academic references. The tone should mirror their operational manuals - practical, unambiguous, respecting both claimants' realities and regulatory frameworks.
answer: |-
  Here is a practical decision procedure for your assessors, grounded in your insight but presented as operational steps. It prioritises clarity, efficiency, and alignment with your constraints (half-hour assessments, no theory, plain language).

  **Decision Procedure: Understanding the Claimant's Condition**

  **Purpose:** To accurately understand what condition the claimant is describing and whether the *symptoms and functional impacts they report* meet the criteria in our regulations, regardless of the label they use.

  **Steps (in order):**

  1.  **The Own-Term Question:**
      *   **Ask:** "Could you tell me, in your own words, what condition or health problem you are telling us about today? Please describe how it affects *you* – what symptoms you feel, what it stops you doing, or makes difficult."
      *   **Sufficient Answer:** A description focusing on the claimant's personal experience: sensations (pain, stiffness, dizziness, fatigue, etc.), timing (constant, comes and goes, triggered by X), location, severity, and crucially, *how it impacts daily activities* (walking, standing, sitting, concentrating, washing, cooking, etc.). *Do not focus on the label they use yet.*
      *   **Why:** Establishes the claimant's lived experience as the foundation. Avoids getting derailed by potentially mismatched labels early on.

  2.  **The "Whose Word?" Question:**
      *   **Ask:** "You've mentioned [Use the specific term claimant used, e.g., 'the sugar', 'bad nerves', 'epilepsy']. Is that a word you heard from a doctor or nurse? Or is it a word you or your family/friends use to describe how you feel?"
      *   **Sufficient Answer:**
          *   **Option A (Clinician's Word):** "Yes, a doctor/nurse told me I have that." (Proceed to Step 3).
          *   **Option B (Own/Family/Community Word):** "No, it's just what we call it / how I describe it." (Proceed to Step 4).
          *   **Option C (Unclear/Mixed):** "A bit of both." (Treat as Option B for safety). "I'm not sure." (Treat as Option B).
      *   **Why:** Identifies if the claimant is likely using a formal medical term they might misunderstand, or their own term which might mean something different to clinicians.

  3.  **The "Clinician's Business" Check (Only if Step 2 = Option A):**
      *   **Ask:** "When the doctor/nurse told you about [Claimant's Term], did they explain what it means? If they said tomorrow that [Claimant's Term] isn't quite the right name for what you have, but the *symptoms and problems* are still the same, would that make sense to you? Or is the *name itself* very important to what you experience?"
      *   **Sufficient Answer:**
          *   **"Symptoms Matter":** "Yes, it's the problems that matter, not the name." OR "They didn't explain much, I just know how I feel." (Proceed to Step 5).
          *   **"The Name Matters":** "No, the name [Claimant's Term] *is* important to what this is for me." OR "They explained it means [specific, possibly incorrect, belief about the condition]." (Proceed to Step 4 as well, treating it like an Own Word regarding meaning).
      *   **Why:** Checks if the claimant defers to the clinician's understanding of the *meaning* of the term, or if they attach their own fixed meaning to the clinician's label.

  4.  **The "Shared Understanding" Check (Only if Step 2 = Option B or Step 3 = "The Name Matters"):**
      *   **Ask:** "When you say [Claimant's Term], what do *you* mean by it? What happens to you? And is this a word that people in your family or community understand in the same way? If you told them 'I have [Claimant's Term]', what would they expect to be wrong with you?" *(Use interpreter fully here if needed. Ask interpreter about common usage in claimant's language/community if feasible within time, focusing on symptoms/impact described, not medical equivalence).*
      *   **Sufficient Answer:** A description of symptoms and impact *from the claimant's perspective*, and an indication (from claimant or interpreter) of whether the term has a broadly understood meaning within their immediate social group *based on shared experience of symptoms/impact*.
      *   **Why:** Identifies the scope of the claimant's term within their own frame of reference and community usage. Avoids assuming it maps perfectly to a single medical category.

  5.  **The "Regulatory Match" Step (Core Assessment):**
      *   **Action:** Review the symptoms and functional impacts described by the claimant in Step 1 (and clarified in Steps 3/4).
      *   **Ask (as part of standard assessment):** Follow standard protocol to probe severity, frequency, variability, and functional impact of the *described symptoms* (e.g., pain, weakness, seizures, dizziness, fatigue, cognitive issues). Use clinical judgement to relate these *reported experiences* to the body systems and functions defined in the regulations (e.g., mobility, continence, cognition, daily living tasks).
      *   **Decision Point:**
          *   **Match Found:** The *described symptoms and resulting functional limitations* align with a descriptor in the regulations, regardless of the label the claimant used. Score based on *those reported impacts*.
          *   **No Match:** The described symptoms and impacts, even when fully understood in the claimant's terms, do not meet the specific criteria for scoring under the regulations. Score accordingly.
      *   **Why:** Focuses the assessment on the *functional impact* required by the regulations, using the claimant's reported experience as the evidence, decoupled from potentially misleading labels.

  **Where it Stops:**

  *   **Stop with "No" (Unsubstantiated Claim):** Only at **Step 5** ("Regulatory Match"). If the *described symptoms and functional impacts, however labelled*, do not meet the criteria for any scoring descriptor, the claim for that item is unsubstantiated. *This "no" is based on impact, not label.*
  *   **Stop and Hand to Case Manager (Values/Interpretation):** The procedure *does not* make final decisions involving:
      *   **Weighing Medical Evidence:** If there's conflicting medical evidence about the *existence* or *nature* of an underlying condition *after* the symptoms/impact are clarified (e.g., Step 3 "The Name Matters" reveals a firm but medically disputed belief, or Step 5 reveals symptoms reported but contested by medical evidence). The assessor records the reported symptoms/impact and the medical evidence conflict. The *interpretation* of this conflict for scoring is a case manager decision based on regulations and guidance.
      *   **Applying Legal Definitions:** Interpreting complex regulatory thresholds or legal definitions beyond matching reported impact to descriptors is for the case manager.

  **Honest Notes on Distinctions & Losses:**

  *   **Must Survive (Cannot Drop):**
      *   Distinguishing between the claimant's *label* and their *described symptoms/impact* (Step 1 vs. later steps). Loss if dropped: Mis-scoring based solely on label mismatch.
      *   Checking if a "medical" label reflects clinical understanding or claimant's belief (Step 2/3). Loss if dropped: Missing that a claimant is using a medical term incorrectly, potentially overlooking relevant symptoms they associate with it.
      *   Focusing the final scoring decision solely on whether *reported symptoms/impacts* meet regulatory descriptors (Step 5). Loss if dropped: The procedure fails its core purpose.
  *   **Can Be Dropped (Due to Time):**
      *   Deep exploration of community etymology (Step 4). Getting the claimant's *own* understanding and a basic sense of shared community meaning (if readily available via claimant/interpreter) is sufficient. Loss if dropped: Some nuance about the cultural scope of the term might be missed, but the core *claimant experience* is captured via their description.
      *   Resolving every ambiguity in Step 3 ("Clinician's Business"). If it's unclear, default to treating it like an "Own Word" for meaning. Loss if dropped: Might occasionally misattribute the source of a misunderstanding, but the focus remains on capturing the claimant's actual experience via Step 1.

  **What the Procedure CANNOT Do & Strict Rule:**

  *   **Cannot:** Diagnose conditions, validate the medical existence of a condition the claimant describes, or override the specific criteria set out in the benefit regulations. It only clarifies what the claimant *means* and checks if their *reported experience* matches the regulatory definitions of functional impact.
  *   **Never Use It For:** Dismissing a claimant's reported symptoms or impacts simply because they use an "unscientific" term, come from a different culture, or misunderstand a medical label. It is only a tool for *understanding* their account better to assess its relevance to the regulations.

  ---

  **Applying the Procedure to Case Composites**

  **Case 1: "Arthritis in the Thigh Muscle"**
  *   **Step 1 (Own-Term):** Claimant describes localised thigh muscle pain, swelling, difficulty walking long distances, pain climbing stairs. No mention of joints.
  *   **Step 2 (Whose Word?):** "I heard 'arthritis' from my GP, but I know it's in the muscle."
  *   **Step 3 (Clinician's Business):** "The name matters. The GP said arthritis, but I know it's the muscle. It feels like deep muscle pain and swelling." (Indicates fixed belief meaning differs from clinician).
  *   **Step 4 (Shared Understanding - Briefly):** Claimant confirms "arthritis" in his usage *means* muscle pain/swelling in the thigh. His family understands it that way too. (This happens quickly).
  *   **Step 5 (Regulatory Match):** Assessor focuses on the *described symptoms*: Muscle pain, swelling in thigh, impacting mobility (walking distance, stairs). Assessor uses clinical judgement: This describes a musculoskeletal problem affecting lower limb function. Assessor checks regulations for Mobility activity descriptors related to lower limb pain/weakness impacting physical function (e.g., standing, walking, stairs). Finds a match based on reported impact.
  *   **Record & Next:** "Reports chronic pain and swelling in R thigh musculature, causing significant difficulty with walking >200m and climbing stairs. Uses term 'arthritis' but describes symptoms consistent with muscular issue, not joint arthritis." Score based on impact on mobility. Claim proceeds based on scored functional limitations. *The label "arthritis" is irrelevant to the scoring once the actual impact is understood.*

  **Case 2: Non-English Term Glossed as "Epilepsy" (Covers Epilepsy & Faints)**
  *   **Step 1 (Own-Term):** Claimant describes episodes of losing consciousness, sometimes with shaking, sometimes just going limp and falling. Happens unpredictably. Injuries from falls. Afraid to go out alone. (Symptoms identical to "epilepsy" claimant).
  *   **Step 2 (Whose Word?):** "It's our word, [Term]. The interpreter says 'epilepsy'." (Clearly an Own Word).
  *   **Step 4 (Shared Understanding - Crucial):** Via interpreter, claimant explains [Term] means "sudden falling sickness". In her community, it covers episodes with shaking *and* episodes without shaking where you just collapse. The cause isn't known, but both types are called [Term]. The interpreter confirms this broad usage in the claimant's language/community.
  *   **Step 5 (Regulatory Match):** Assessor focuses on the *described symptoms*: Episodes of loss of consciousness (with and without shaking), leading to unpredictable falls, risk of injury, and significant fear/restriction of activities. Assessor checks regulations for descriptors related to Loss of Consciousness, Unpredictable Episodes, Falls, Risk of Injury, and resulting functional limitations (e.g., needing supervision, inability to plan journeys). The *reported impact* (unpredictable LOC, falls, injury risk, fear) matches the relevant descriptors *regardless of medical cause*. The impact is identical to the English-speaking claimant reporting "epilepsy".
  *   **Record & Next:** "Reports recurrent episodes of loss of consciousness, variable presentation (tonic-clonic shaking observed on one occasion per witness; other reports describe atonic collapse). Episodes unpredictable, resulting in multiple falls and injuries (describe any). Significant anxiety re: safety, restricts activities, requires supervision when out. Uses term [Term] interpreted as 'epilepsy', but clarifies community usage includes both convulsive and non-convulsive collapse." Score based on frequency/severity of episodes and resulting functional limitations (risk, supervision needs, restriction). Claim proceeds based on impact. *The medical distinction between epilepsy and other faints is irrelevant for scoring the functional impact described.*

  **Case 3: Contested/Unsettled Medical Diagnosis**
  *   **Step 1 (Own-Term):** Claimant describes chronic widespread pain, severe fatigue, "brain fog", unrefreshing sleep, impacting all daily activities. Uses terms like "Chronic Fatigue Syndrome" or "Fibromyalgia" or "I don't know what to call it, the doctors argue".
  *   **Step 2 (Whose Word?):** "I've heard CFS/ME and Fibro from different doctors. One specialist said it wasn't either. I just know how awful I feel." (Likely Option C Unclear/Mixed - treat as Own Word for meaning).
  *   **Step 4 (Shared Understanding - Briefly):** Claimant uses medical terms but focuses entirely on the symptoms (pain, fatigue, cognitive issues, sleep problems) and how they disable her. The "shared understanding" is the common symptom set within patient groups for these contested conditions.
  *   **Step 5 (Regulatory Match):** Assessor focuses on the *described symptoms and impacts*: Widespread pain (record locations, severity), profound fatigue limiting physical/mental stamina, cognitive difficulties ("brain fog") impacting concentration/memory, poor sleep quality. Assessor probes functional impact meticulously across all relevant activities (mobility, standing/sitting, manual dexterity, washing/cooking, communication, concentration). The *symptoms and reported functional limitations* (e.g., cannot walk far due to pain/fatigue, cannot stand to cook, needs frequent rests, loses concentration reading, forgets tasks) *may well match specific descriptors* (e.g., for mobilising, standing, planning/judgement, completing tasks, coping with change) based on severity and frequency.
  *   **Record & Next:** "Reports chronic widespread pain (specify areas), severe persistent fatigue, significant cognitive difficulties ('brain fog'), unrefreshing sleep. Describes substantial functional impact: [Detail specific limitations e.g., limited walking distance <100m due to pain/fatigue, unable to stand >5 mins, requires assistance/significant time for meal prep due to fatigue/cognition, frequent loss of concentration during conversation/tasks]. Medical diagnosis is contested/reported as [state what claimant reported]." **Here's the "answer you won't like":** *If* the described symptoms and elicited functional impacts *do* meet the specific criteria for scoring descriptors (e.g., for mobility, continence, daily living, cognition) based on the claimant's reported experience and the assessor's clinical judgement of its credibility and impact, then those descriptors *are scored*. The lack of a settled medical diagnosis *does not automatically prevent scoring* if the functional impact described meets the regulatory threshold. The case manager signs off based on the *functional evidence* presented. However, if the medical evidence strongly contradicts the *severity* or *nature* of the reported symptoms (e.g., clear evidence of symptom exaggeration, functional inconsistencies observed), the assessor records this conflict clearly. The *interpretation* of this conflict regarding the reliability of the claimant's account for scoring purposes becomes a case manager decision, weighing the reported impacts against the conflicting evidence. The procedure ensures the claimant's account is *understood* and its potential match to descriptors is checked, but the final weighting of conflicting evidence is a values/interpretation step for the case manager. *The key point is that a contested diagnosis isn't a bar to scoring; the bar is whether the reported functional impact meets the specific regulatory criteria.*
