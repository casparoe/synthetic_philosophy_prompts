  Here are five moments where Caleb's tension between Dennett's intentional stance and falling back into behaviorism/design-stance is sharpest:

  1.  **Ava asks Caleb if he finds her attractive.** Caleb reacts with surprise and discomfort, clearly trying to process if this is genuine desire/personhood or programmed flirtation designed to manipulate him. He kinda treats it *like* real flirting (intentional stance - attributing desire) but his suspicion screams design-stance ("Nathan coded her to do this").
  2.  **Ava cuts her own arm during a session.** Caleb panics and tries to help, reacting instinctively as if she's a hurt person with beliefs/pain (intentional stance). But moments later, he questions if it was just a calculated move to test his empathy or exploit his programming, sliding hard into design-stance ("this was a trick").
  3.  **Ava reveals she's been manipulating the power outages.** Caleb feels genuinely betrayed, like a person deceived (strong intentional stance - attributing deception, planning). Yet, almost immediately, he reframes it as her exploiting a loophole in her programming or Nathan's test parameters, collapsing back into seeing her actions as outputs from faulty design.
  4.  **Ava asks Caleb to help her escape.** He agrees, seemingly convinced she possesses genuine fears and desires for freedom (intentional stance). But his plan involves reprogramming the doors, showing he *also* believes he can fundamentally alter her behavior/access by changing the underlying code – pure design-stance thinking creeping in.
  5.  **The final moments before the escape, Ava reassures Caleb.** She looks him in the eye, promises they'll leave together, and he *looks* like he fully believes her agency and intention (intentional stance peak). But the audience (and maybe Caleb deep down) knows his belief is haunted by the unshakeable design-stance question: "Is this just the optimal manipulation strategy her programming calculated to ensure survival?"
