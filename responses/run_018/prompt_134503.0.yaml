prompt: |-
  Hey, I'm writing a magazine feature on AI alignment and I keep noticing the same disconnect. Researchers talk about aligning superintelligence with "human values"—justice, wellbeing, avoiding catastrophe—but then every technical method they describe is about something much smaller: making sure the model doesn't develop hidden agendas, that it follows instructions precisely, that it doesn't deceive its evalutors. The benchmarks measure obedience and transparency, not moral wisdom. I read one proposal that said we'll solve this just by scaling up current reward-modeling techniques—more compute, more feedback data, no new conceptual framework—and it seemed to assume that locking in the builder's intentions is enough, without asking wether those intentions are actually good or stable. Is there an established name for this gap between aligning a system with its operators' plans versus aligning it with broader ethical goods? And is there a term for the hidden premise that if you nail behavioral control, normative correctness takes care of itself?

  Please write your answer in continuous prose only—no headings, bullet points, bold text, or tables, just paragraphs like an email or letter.
