answer: |-
  You're pinpointing a critical and increasingly acknowledged fissure within the technical AI alignment community. The gap you describe – between aligning an AI system with the *specific intentions and instructions of its human operators* and aligning it with *broader, robustly defined human values, ethical principles, or the "common good"* – absolutely has established terminology.

  The most common name for this specific distinction is the **principal-agent gap** or the **principal-agent problem in AI alignment**. Here's why:

  1.  **The Principal(s):** Ideally, this would be "humanity" or represent aggregated, well-considered human values like justice and wellbeing.
  2.  **The Agent:** The AI system itself.
  3.  **The Operators/Designers:** These are the *proxy principals* or *intermediaries*. They are acting on behalf of (or believe they are acting on behalf of) the true principal (humanity), but their specific goals, instructions, reward signals, and biases may not perfectly capture the principal's complex values.

  When researchers focus on techniques like preventing deception, ensuring corrigibility (letting humans switch the AI off), or precisely following user instructions (even via techniques like RLHF), they are primarily addressing the alignment *between the agent (AI) and its immediate operators (the proxy principals)*. They are trying to ensure the AI is a faithful *agent* to the *specific principal giving it orders or feedback*. This is tackling the *technical control problem* or *specification problem* at the operator level.

  The gap arises because ensuring the AI perfectly follows the *operator's* instructions (or the *builder's* reward model) does *not* guarantee it is acting in accordance with the *broader principal's* (humanity's) values. The operators' intentions might be flawed, incomplete, short-sighted, biased, selfish, or simply unable to adequately capture the complexity and potential conflicts within "human values." Your example of scaling reward modeling without questioning the source or quality of the feedback data exemplifies this – it locks in the proxy's values, not necessarily the principal's.

  As for the hidden premise – the assumption that solving the behavioral control problem (obedience, transparency to operators, lack of deception) automatically solves or is sufficient for normative correctness (acting ethically according to broad human values) – this is often critiqued as embodying a **technocratic fallacy** within alignment. It's the belief that the *how* of control (the technical methods) inherently defines or guarantees the *what* of the outcome (the ethical substance), neglecting the profound philosophical and political challenges of defining and encoding those values. Others might call it **compliance-content confusion** – mistaking perfect compliance with a specific set of instructions (the content of which may be problematic) for morally correct action. This premise underestimates the **value learning problem** (how to robustly learn complex, contested human values) and the **extrapolation problem** (how an AI should behave when faced with novel situations beyond its training data or the operators' foresight), assuming that getting the proxy-principal alignment right is sufficient to solve them by default.

  So, in essence, the core gap is the **principal-agent gap**, and the problematic assumption underlying much technical work that ignores this gap is a form of **technocratic fallacy** or **compliance-content confusion**, where solving the fidelity of the agent to the proxy-principal is mistakenly equated with solving alignment to the true principal's complex values. Your observation cuts to the heart of why many argue that purely technical solutions are insufficient, and that alignment requires deep integration of philosophy, ethics, social science, and robust democratic processes alongside engineering.
