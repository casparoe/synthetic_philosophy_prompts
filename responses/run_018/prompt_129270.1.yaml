prompt: |-
  I'm prepping interview questions for a podcast next week with a philosopher who defends a niche variant of moral particularism. She thinks thick moral concepts—like cruel or brave—don't function as defeasible rules at all, but instead get their force from what she calls "local coherence networks," context-bound patterns of reason that can't in principle be captured by any general principle. She also rejects the idea that particularist judgment is just tacit knowledge of hidden rules, and she thinks generalists are basically treating practical wisdom like a black-box algorithm.

  I want 8-10 questions that go deeper than asking her to restate the view. Specifically:
  - at least one that presses whether "local coherence networks" are just hidden generalities with a fancy name
  - at least one on epistomology: if these networks aren't rule-governed, how do we spot and correct mistakes inside them?
  - at least one engaging with the familiar particularist claim (associated with Dancy and others) that reasons shift their moral weight across contexts—does her framework make that shifting redundant, or does it just relocate the problem?
  - for each of those three, include a follow-up keyed to the reply she's most likely to give (probably something about holistic perception or the limits of codification)

  Keep it casual—this is just for my prep notes, so a typo or two is definatly fine.
reasoning: |-
  Okay, the user is prepping for a podcast interview with a philosopher who has a unique take on moral particularism. They need 8-10 questions that dig deep into her theory about "local coherence networks" and challenge common assumptions. The user specifically wants questions that avoid just rehashing her views and instead press on three key areas: whether these networks are hidden generalities, how we correct mistakes without rules, and how her view relates to Dancy's idea of shifting reasons.

  First, I should recall the main points of her position. She rejects thick moral concepts as defeasible rules, emphasizes local coherence networks that are context-bound and uncodifiable, and dismisses the idea that practical wisdom is like a black-box algorithm. The questions need to address her unique angles without letting her fall back on standard particularist arguments.

  For the first required question about hidden generalities, I can frame it to challenge if "local coherence" is just another name for implicit rules. Her likely response would involve holistic perception and anti-reductionism, so the follow-up should press on whether this perception itself has structure that could be generalized. Using her "courage" example from the paper could make it concrete.

  Next, the epistemology question about mistake correction. Without rules, how do we know when we're wrong? She'll probably mention reflective equilibrium or dissonance within the local network. The follow-up should ask about resolving conflicts without appealing to broader principles, pushing her to explain the mechanics of local coherence without circularity.

  For the Dancy comparison, I need to ask if shifting reasons become redundant in her framework. She might say her view dissolves the problem by making context primary. The follow-up should question if this just moves the bump in the rug—now we have to explain why certain contexts cohere a certain way. Using a specific scenario like truth-telling in different relationships could illustrate this.

  The user also wants other original questions. I should include one about thick concepts' role in her networks versus rules, another on practical wisdom as perception versus computation, and one comparing her local networks to other coherence-based systems like Neurath's boat. A bridge question to applied ethics can test her model's real-world applicability. Finally, asking how her view handles moral progress without rules could reveal if coherence networks have any directionality.

  Throughout, keeping the tone casual as per the user's note—typos are fine, but the questions should remain incisive. Avoiding jargon where possible but still precise. Making sure each question has a clear purpose and follows up on her probable defenses to push the conversation deeper.
answer: |-
  Here are 10 questions designed to dig deep, with follow-ups anticipating her likely responses (keeping it casual for your notes):

  1.  **Core Mechanics:** You argue thick concepts like 'cruel' or 'brave' aren't operating as defeasible rules, but draw their force entirely from "local coherence networks." Could you walk us through a concrete example? Like, how does calling an act 'cruel' *work* differently in your framework compared to someone who sees it as applying a rule (even a messy, defeasible one)? *(Forces specificity and contrast)*
      *   *Likely Reply:* She'll emphasize holistic judgment, the unique constellation of features in *this* situation, how the label emerges from seeing how the act fits/disfits the specific context's web of values/relationships/etc., rejecting the "subsumption under a general category" model.
      *   **Follow-Up:** Okay, so the label emerges from perceiving the holistic fit. But when that perception happens, isn't the *pattern* you're perceiving itself a kind of implicit, local generality? Like, "In *contexts structured like this* (e.g., close family, unequal power), *this kind of act* (e.g., withholding affection to punish) reliably disrupts the expected coherence, warranting 'cruel'." How is that fundamentally different from a highly contextual rule?

  2.  **The "Hidden Generality" Challenge:** A critic might say "local coherence network" is just a fancy rebranding of "really specific, context-dependent rule." How do you definitively show they're *not* hidden generalities? What's the core feature of these networks that makes them *in principle* uncodifiable by any set of principles, no matter how complex or conditional? *(Directly tackles the requested challenge)*
      *   *Likely Reply:* She'll stress radical context-dependence – the relevant factors and their interrelations are unique each time, shaped by irreducibly particular histories, relationships, and nuances that defy capture in propositional form. Codification always misses the lived, perceptual nature of the judgment and the open-ended adaptability needed.
      *   **Follow-Up:** If the factors and relations are truly unique each time, how is learning or moral development possible? Doesn't recognizing *any* pattern, however fluid, imply *some* level of repeatable structure across contexts, even if it's the structure of "perceiving contextual coherence" itself? Is *that* perception rule-governed?

  3.  **Epistemology - Mistake Correction:** If judgment within a local coherence network isn't rule-governed, how do we rationally identify and correct errors? If two people see the coherence of a situation differently (e.g., one sees an act as brave, another as reckless), what's the process for figuring out who's more likely right, without appealing to overarching principles? *(Hits the epistemology request)*
      *   *Likely Reply:* She'll talk about deepening perception within the specific context – examining more details, understanding perspectives better, identifying dissonances within *that* network that were missed (e.g., "You called it brave, but did you see how it ignored the legitimate fears of X?"), aiming for a richer, more internally consistent grasp of *this* situation's demands. Reflective equilibrium, but hyper-localized.
      *   **Follow-Up:** But what resolves the *conflict* when two people, both examining the *same* context deeply, still perceive fundamentally different patterns of coherence/discoherence? If there's no appeal to *any* broader standard (even tacit skill), isn't the resolution purely rhetorical or power-based? How does your view avoid relativism *within* a context?

  4.  **Dancy & Shifting Reasons:** Dancy's particularism famously centers on the idea that a reason (e.g., pain) can be a reason *for* an action in one context, a reason *against* in another, or neutral elsewhere. Does your "local coherence network" framework *explain* this shifting, or does it make the very idea of "shifting reasons" redundant or misplaced? *(Engages with Dancy)*
      *   *Likely Reply:* She'll likely argue it dissolves the problem. The idea of a "reason" carrying inherent weight across contexts is a generalist illusion. Within a local network, the *significance* of pain (or any feature) isn't assigned by a detached "reason"; it *emerges* from its place within the holistic pattern of that specific context. We shouldn't talk about "shifting reasons," but about features gaining their moral character solely from their contextual embedding.
      *   **Follow-Up:** So you're relocating the problem. Instead of asking "Why does the moral weight of pain shift?", we now ask "Why does *this specific context* give pain *this specific significance*?" Doesn't the mystery of variation just move? What determines *how* a feature functions within a local network if not *some* underlying pattern or regularity?

  5.  **Thick Concepts as Tools:** If thick concepts aren't rules, what *role* do they actually play within these local coherence networks? Are they labels for perceived coherence patterns, tools for shaping perception, socially negotiated focal points, or something else entirely?
      *   *Likely Reply:* Probably a mix – they crystallize complex perceptions, enable communication about complex moral textures, and act as conceptual lenses that sensitize us to certain features within a context, but they don't *dictate* the judgment; the holistic perception comes first.

  6.  **Practical Wisdom vs. Black Box:** You criticize generalists for treating practical wisdom like a black-box algorithm. How does your view of wisdom as navigating local coherence networks make it *less* of a black box? What's illuminating about describing it this way? *(Pushes the "limits of codification" angle)*
      *   *Likely Reply:* It demystifies by focusing on concrete, contextual perception and the search for fit/dissonance, rather than positing inaccessible rule-processing. It makes wisdom more like skilled perception or artistry, accessible through training attention to context, not cracking a code.
      *   **Follow-Up:** But if the core skill is perceiving holistic coherence in radically unique contexts, isn't *that perception* still somewhat opaque? Can you articulate how someone learns to "see the coherence" better, beyond just "look harder" or "gain experience"?

  7.  **Coherence With What?** When you talk about "local coherence," what constitutes the "elements" that need to cohere? Is it just facts of the situation? The agent's motives? Social expectations? Underlying values? Consequences? How bounded is "local"? *(Seeks clarity on the network's components)*
      *   *Likely Reply:* All of the above, dynamically interacting in a way specific to the context – facts, relationships, histories, shared understandings (or lack thereof), potential consequences, relevant values *as they manifest here*. The "local" boundary is fuzzy, defined by what's relevantly interconnected for *this* judgment.

  8.  **Comparison Point:** How does your "local coherence network" view differ significantly from other coherence-based approaches in ethics, like some versions of wide reflective equilibrium or Neurath's boat? Is it the *hyper-locality* and rejection of *any* stable general principles that's the key differentiator?
      *   *Likely Reply:* Yes, precisely. While reflective equilibrium often aims for coherence with general principles and considered judgments *across* cases, and Neurath's boat implies ongoing revision of a *system*, her view rejects the need for *any* overarching coherence beyond the immediate context's demands. Each network is its own island of coherence.

  9.  **Bridge to Application:** Does your framework change how we should approach teaching ethics, or resolving real-world moral disagreements? If there are no general principles, even tacit ones, what tools do we have beyond trying to get others to "see" the coherence we see in *this* specific case? *(Tests practical implications)*
      *   *Likely Reply:* Emphasizes case studies, narrative, role-playing, developing empathy and contextual sensitivity, focusing on the particulars rather than drilling principles. Resolution requires deep engagement with the *other's* perception of the context's coherence, not just applying rules.

  10. **Moral Progress?:** Within your framework, how do we account for moral progress? If judgment is radically localized, what allows us to say that society's view on, say, slavery or gender equality has *improved*, rather than just changed coherence patterns within different local networks? Is there any sense in which one local coherence pattern can be *objectively better* than another?
      *   *Likely Reply:* Progress might be seen as expanding the "local" network – incorporating more perspectives, recognizing broader connections (e.g., seeing the incoherence of denying rights based on race *within* a larger societal context we now perceive), or developing richer, more inclusive patterns of coherence. But it resists saying "Principle X is universally better."

  **Key things to listen for in her answers:**
  *   **Holism vs. Atomism:** How radically does she reject breaking down situations into discrete reasons/features?
  *   **Perception Language:** How central is the metaphor of "seeing" or "perceiving" coherence?
  *   **Anti-Reductionism:** How strongly does she resist *any* form of explanation that hints at underlying rules or generalizations?
  *   **Contextual Boundaries:** How does she define what's "in" and "out" of a local network?
  *   **Role of Concepts:** What *do* thick concepts actually *do* if they aren't rules?

  Good luck with the podcast prep! This sounds like a fascinating discussion.
