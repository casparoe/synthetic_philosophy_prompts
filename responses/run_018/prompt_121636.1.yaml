answer: |-
  Based on your precise description and requirements, here's a breakdown of the pattern, its conceptual landscape, potential terminology, and contested boundaries:

  ### Core Pattern & Its Name
  The **asymmetry you describe (erosion via small, defensible steps vs. restoration requiring large, alarm-triggering bundles)** is a recognized phenomenon but lacks a single, universally accepted term. The most precise existing concept it maps onto is the **"Ratchet Effect"** in democratic erosion, but this requires significant refinement for your coding needs.

  *   **Why "Ratchet Effect" (Refined):** A ratchet allows motion in one direction (tightening/erosion) via small increments but prevents reversal (loosening/restoration) unless a much larger, structurally different force is applied (the "bundle" of reforms). This captures the irreversibility asymmetry you identify. **Crucially, this *is* a specific form of path dependence** – once the small steps lock in, they alter the institutional landscape and power dynamics, making simple reversal impossible and forcing large-scale, disruptive action for restoration.

  *   **Why *Not* Other Terms:**
      *   **Incumbency Advantage:** Too broad; encompasses legal fundraising, name recognition, etc. Doesn't capture the *institutional transformation* or asymmetry.
      *   **Slippery Slope:** Focuses on *predicting* future decline from a first step, not the *structural asymmetry* between decline and repair once decline has occurred.
      *   **Constitutional Hardball:** Describes norm-breaking within existing rules, but doesn't inherently capture the asymmetry or the incremental vs. bundled dynamic.
      *   **Democratic Backsliding/Erosion:** The *overall process*, but doesn't specify the *mechanism* of asymmetry you identified as crucial for objective coding.

  ### Defining "Asymmetric Institutional Ratchet" (A Refined/Coined Term)
  For precise coding, I propose defining a specific subtype: **"Asymmetric Institutional Ratchet" (AIR)**. **This is a coinage,** but built directly upon the established "ratchet effect" concept within democratization studies, sharpening it for your purpose.

  **Definition:** A pattern of democratic erosion characterized by:
  1.  **Directional Incrementalism:** The gradual degradation of institutional checks, balances, and pluralism through a sequence of *individually defensible* reforms or changes (legal, administrative, or de facto), each potentially reversible *in isolation*.
  2.  **Restoration Threshold:** The subsequent reversal of this degradation requires not the simple undoing of individual steps, but *simultaneous, interdependent, large-scale institutional reforms*.
  3.  **Asymmetric Perception:** The bundled restoration reforms, by their scale and interdependence, inherently possess the profile of significant institutional overhaul, triggering external alarms about potential democratic illegitimacy or abuse of power – alarms that were *not* triggered by the incremental steps of erosion, despite their cumulative effect being equivalent or worse.

  **Why this coinage?** It explicitly names the core elements you identified: the asymmetry, the institutional focus, and the ratchet-like mechanism. It distinguishes it from broader erosion/backsliding and other concepts.

  ### Applying the Definition: Key Edges & Contested Points
  1.  **Sequence Required?** **Yes, typically.** AIR describes a *process* where the cumulative effect of small steps creates a new, degraded equilibrium. A single large reform *initiating* erosion (e.g., a coup, abolishing the supreme court) is different; it's a rupture, not incremental erosion. However, a single large reform *attempting restoration* (like court-packing) fits perfectly as the necessary bundled response *to prior incremental erosion*.
  2.  **Intentionality Required?** **Contested, but leaning towards NO for coding.**
      *   *Settled:* Deliberate strategies ("salami tactics") by incumbents are a prime driver (e.g., Fidesz in Hungary, PiS in Poland - your composite *is* a fair, widely accepted description of core tactics used there, though debates exist on specific motives/effects).
      *   *Contested/Included:* AIR *can* encompass erosion facilitated by neglect, unintended consequences, or diffuse societal changes (e.g., collapse of local newspapers reducing scrutiny, chronic underfunding of election administration degrading capacity) *if* these interact with the political environment to create the same asymmetry. Restoration still requires a large, intentional bundle. The *effect* of the asymmetry matters for coding, even if decay wasn't centrally planned.
  3.  **Scope Beyond Elective Institutions?** **Yes.** AIR applies wherever institutional power dynamics exhibit the asymmetry:
      *   *Settled:* Core government branches (executive, legislature, judiciary), electoral management, public media.
      *   *Contested but Applicable:* Independent agencies (central banks, anti-corruption bodies), public universities (governance, academic freedom), key professional bodies (medical, legal councils) – *if* they play a significant role in checking power or ensuring pluralism relevant to democratic governance.
      *   *Likely Excluded:* Purely private bodies or institutions without a relevant governance/oversight function.
  4.  **Diagnostic Value (Policy-Neutrality):** **This is the core strength of AIR as defined.** The diagnostic isn't "who benefits?" but the observable **asymmetry in the nature of change**:
      *   *Objective Indicator 1:* Is degradation occurring via a sequence of small, functionally separate, legally defensible changes?
      *   *Objective Indicator 2:* Would reversing the *cumulative degradation* realistically require a large, interdependent bundle of simultaneous reforms?
      *   *Objective Indicator 3:* Does the *profile* of that necessary restoration bundle inherently resemble actions typically coded as potential democratic abuses (major institutional overhaul, packing bodies, changing core rules)?
      *   If "yes" to all three, AIR is present. It diagnoses a structural feature of the institutional landscape, independent of whether you like the current government's policies. A government enacting AIR *is* engaging in democratic erosion by altering the rules of the game to lock in advantage and raise the cost of losing. Observers might disagree on the *degree* of erosion or the *necessity* of the bundled response, but the *asymmetric pattern itself* is the objective diagnostic.

  ### Contested Characterizations & Caveats
  *   **Hungary/Poland:** Your composite is a **fair and widely accepted description** of core tactics documented by major democracy watchdogs (V-Dem, Freedom House), scholarly analyses (e.g., Scheppele, Bozóki, Sajó on Hungary; Sadurski, Matthes on Poland), and EU institutions. Critics *do* argue these changes are legitimate reforms addressing past imbalances or inefficiencies (the "defensible" step argument). AIR doesn't adjudicate that debate; it codes the *pattern* and its *asymmetric consequences*.
  *   **"Look Who Benefits" vs. AIR:** Critics are right that pointing *only* to beneficiaries is partisan. AIR moves beyond this by focusing on the *structural mechanics* of change: the incrementalism, the cumulative effect, and the *asymmetry in reversal costs*. Benefit is a consequence, not the defining feature.
  *   **Is AIR "Real"?** Yes, the *asymmetry* you describe is a demonstrable strategic reality and institutional dynamic in cases of incremental erosion. Scholars debate its *ubiquity* and *inevitability*, but not its *existence* as a common pattern.
  *   **Overlap:** AIR *is* a specific mechanism *within* broader democratic erosion/path dependence. It doesn't "collapse" into them; it specifies *how* path dependence manifests in this asymmetric way in institutional decay/repair.

  **Conclusion:** The asymmetry you identified is best captured by refining the "**Ratchet Effect**" concept into a specific, codable pattern: **"Asymmetric Institutional Ratchet" (AIR)**. Defined by **directional incrementalism**, a **restoration threshold** requiring bundled reform, and **asymmetric perception**, AIR provides a policy-neutral diagnostic based on observable institutional dynamics. It applies to sequences of erosion (intentional or via neglect) and requires bundled restoration, generalizing beyond elective institutions to key governance/pluralism bodies. While debates exist on intent and specific country cases (though Hungary/Poland are widely seen as archetypes), the core pattern of asymmetry in the cost and perception of decay vs. repair is a recognized feature of modern democratic erosion. This definition aims for the inter-coder reliability you require.
