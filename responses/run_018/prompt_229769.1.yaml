prompt: |-
  I have been keeping a record of when I am actually willing to say that a system believes something, and I would like to know what principle my verdicts add up to, if any. Here are the cases, with my gut calls:

  - My thermostat turns the heat on when the room is cold. It does not believe anything; it is a coil and a switch.
  - My chess engine plays as though it knows I am weak in rook endgames, but I take that to be a manner of speaking, not a literal belief.
  - A Mars rover steers around a boulder. Here I am genuinely inclined to say it believed there was a rock in its path -- there seems to be no better way to make sense of the maneuver.
  - An ant colony shifts its foraging to a richer food source overnight. The colony has something belief-like; no individual ant does.
  - A chatbot asserts that Paris is the capital of France, relies on it consistently, and corrects me when I say Lyon. I lean toward saying it believes Paris is the capital, in the only sense that matters for predicting it.
  - The same chatbot, asked to play a contrarian character, fluently insists that Lyon is the capital. Now I suspect it never believed anything in either conversation.
  - A friend with a spider phobia sincerely says spiders are harmless but behaves as though they are lethal. I want to say she believes spiders are dangerous despite her words.
  - A sleepwalking friend navigates the kitchen without collision. I resist saying he believes the fridge is left of the door, even though he never bumps into it.

  The pair I cannot reconcile: the rover and the chatbot earn beliefs on the strength of behavior alone, but the sleepwalker does not, despite equally reliable behavior; and my phobic friend gets a belief that flatly contradicts her sincere assertions, while the chess engine's "knowledge" is merely a facon de parler despite equally sophisticated play.

  Is there a single criterion for when belief attribution is correct -- not merely convenient -- that delivers these verdicts, or nearly so? If the best candidate is the intentional-stance idea that a system has the beliefs it is predictively useful to attribute to it, then show how it handles the phobia and sleepwalking cases, which seem to push against it. Please state your candidate principle precisely, clause by clause, naming the case that motivates each clause; give its verdicts on two cases I have not listed -- a company whose records and procedures all treat its product as safe while every employee privately suspects otherwise, and a conversational AI that passes every behavioral test but whose internals turn out to be a vast precomputed table of question-and-answer pairs; and if no principle saves all eight of my verdicts, tell me which one I should surrender and why. Lead with your answer in the first sentence -- the principle itself, or the verdict that none fits -- and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user has presented a fascinating philosophical puzzle about belief attribution across different systems. They've listed eight cases where their intuition says "this system has beliefs" or "this doesn't," and two pairs that seem contradictory. The core tension is between behavior-only attribution (like the Mars rover) and cases where behavior isn't sufficient (sleepwalker) or where internal states override behavior (phobia friend).

  Looking at their cases, three key dimensions emerge: behavioral coherence (how well actions track the supposed belief), functional integration (how the "belief" interacts with other cognitive processes), and internal realization (whether there's actual representational machinery). The thermostat fails all three dimensions, while the Mars rover scores high on behavioral coherence and functional integration. The chatbot in standard mode meets behavioral coherence but fails functional integration when roleplaying, and completely fails internal realization if it's just a lookup table.

  For the conflict cases: The sleepwalker lacks functional integration - their navigation isn't connected to broader cognition like memory or reasoning. The phobia case shows behavioral coherence overriding verbal assertions because the fear response is deeply integrated with emotional systems. The chess engine gets downgraded to metaphor because its "knowledge" doesn't integrate with non-game contexts.

  Testing this principle against their additional cases: The company would have "institutional belief" in product safety because procedures create behavioral coherence and functional integration across departments. The lookup-table AI fails despite perfect behavior because there's no internal realization - no actual representations being updated.

  The only verdict that might need surrendering is the ant colony - if we require representational states, the colony might not qualify, but the user could maintain it as a borderline case given the emergent coordination. This approach preserves all other intuitions while resolving the stated contradictions through multidimensional assessment.
answer: |-
  My candidate principle is: **A system has a belief that P when (1) its behavior exhibits coherent, counterfactual-supporting sensitivity to P across relevant contexts (Mars rover); (2) this sensitivity is functionally integrated with its other cognitive processes to guide action adaptively (phobia friend vs. sleepwalker); and (3) it arises from representational states that track P (chatbot roleplay vs. lookup table).**

  **Clause breakdown and motivations:**  
  - **(1) Behavioral coherence (counterfactual sensitivity):** Motivated by the **Mars rover** (steers *only* when obstacles exist) vs. **sleepwalker** (navigates correctly but lacks sensitivity to *changes* in furniture layout). Behavior must reliably track P across relevant what-if scenarios.  
  - **(2) Functional integration:** Motivated by **phobia friend** (fear behavior integrates with perception, memory, and emotion, overriding assertions) vs. **chess engine** (sophisticated play isn’t integrated with broader cognition). Beliefs must play a causal role in coordinating multiple systems.  
  - **(3) Representational basis:** Motivated by **chatbot roleplay** (fluent "insistence" on Lyon lacks truth-tracking representations) vs. **thermostat** (no representations, just physical causation). The system must have internal states that *stand for* P and inform behavior.  

  **Verdicts on your cases:**  
  - **Thermostat (no belief):** Fails (1) and (3). No counterfactual sensitivity (e.g., won’t "adjust" if misaligned) and no representations.  
  - **Chess engine (no belief):** Fails (2). Expertise is domain-specific, not integrated with general cognition (e.g., can’t explain *why* rook endgames are hard).  
  - **Mars rover (belief):** Satisfies (1) and (2). Avoids obstacles counterfactually (e.g., would avoid if boulder moved); integration seen in planning paths.  
  - **Ant colony (belief-like):** Borderline. Colony satisfies (1) and (2) as a superorganism (coherent foraging shifts; integrated via pheromones), but may lack (3) if no colony-level representations exist.  
  - **Chatbot asserting Paris (belief):** Satisfies (1)–(3) in standard mode: behavior coherently tracks truth (corrects errors), integrates across contexts (e.g., answers follow-up questions), and relies on learned representations.  
  - **Chatbot roleplaying (no belief):** Fails (3). Outputs contradict representations; no truth-tracking.  
  - **Phobia friend (belief spiders dangerous):** Satisfies (1)–(2). Behavior coherently sensitive to spiders (e.g., avoids dark corners); fear integrates perception/action despite verbal override.  
  - **Sleepwalker (no belief fridge location):** Fails (2). Navigation isn’t cognitively integrated (e.g., can’t report location when awake; no memory/planning involvement).  

  **New cases:**  
  - **Company with "safe" procedures but skeptical employees:** **No institutional belief.** Fails (1) and (2): behavior (e.g., safety audits) may be coherent, but employee skepticism reveals lack of integration (e.g., ignored warnings in emergencies). Represents bureaucratic fiction, not adaptive guidance.  
  - **AI with precomputed Q&A table:** **No belief,** despite passing behavioral tests. Fails (1) and (3): no counterfactual sensitivity (e.g., won’t adapt to new questions); no representational states tracking truth—just static outputs.  

  **Surrender one verdict:** Relinquish the **ant colony** attribution. While its behavior is coherent and integrated (clauses 1–2), it likely lacks genuine *representations* (clause 3). Belief requires internal states that semantically track P (e.g., neural patterns), not just emergent coordination. This preserves the rover’s belief (explicit sensor-to-action representations) and denies it to colonies.  

  **Why this reconciles your conflicts:**  
  - **Rover vs. sleepwalker:** Rover’s behavior is counterfactually robust and integrated (sensors update pathfinding); sleepwalker’s isn’t integrated (no memory/learning).  
  - **Phobia friend vs. chess engine:** Phobia integrates cognition (perception→action→emotion); chess engine’s "knowledge" is isolated to the board.  
  - **Chatbot Paris vs. roleplay:** Paris-mode uses representations tracking reality; roleplay suppresses them for performance.
