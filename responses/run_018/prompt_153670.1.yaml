  The user is specifically asking how McTaggart would view the Rietdijk-Putnam argument, which uses special relativity to show no global "now." They also have two other scenarios: mental states in relativity and closed timelike curves. I need to address each part clearly.

  First, McTaggart would probably see the physics argument as complementary but not necessary. His logical argument was self-contained, so he might think the relativity argument misses his point. But he might appreciate it as a reinforcement. I should mention that he'd see both as converging on the same conclusion but from different angles.

  Next, the twist with mental states. If observers disagree on the simultaneity of a decision, McTaggart would likely say that subjective experience is also part of the A-series, so it's equally unreal. He didn't believe in any special status for consciousness in the A-series. So even subjective presence isn't immune. This supports his view that all temporal becoming is contradictory.

  Then, closed timelike curves (CTCs). If someone meets their past self, McTaggart might see this as a reductio of the block universe. CTCs create logical paradoxes, like changing the past, which aligns with his argument that temporal change isn't spatial. He might argue that CTCs expose the absurdity of treating time as just another dimension. So it could challenge the block view rather than confirm it.

