  ## The Necessary Instrument: Du Bois's Propaganda Imperative and the Liberation of Black Art

  W.E.B. Du Bois's assertion in "Criteria of Negro Art" (1926) that "all Art is propaganda and ever must be, despite the wailing of the purists" remains a provocative and essential challenge, particularly for Black artists navigating a world structured by white supremacy. While anxieties about aesthetic paternalism and the autonomy of the artist are valid concerns, Du Bois's core argument – that Black art, *in its historical context*, must consciously serve the cause of racial justice – is ultimately correct and necessary. Accepting his view does commit us to prioritizing political effect, but not at the *exclusive* expense of formal quality; rather, it demands we understand formal quality as inseparable from, and elevated by, its capacity to serve liberation. Crucially, his later economic writings deepen this perspective, revealing his instrumentalism as fundamentally distinct from capitalist logic, rooted instead in collective survival and structural transformation.

  **The Autonomy Objection and the Myth of Neutrality:** The primary objection to Du Bois is that dictating art's purpose infringes on artistic autonomy, potentially reducing it to mere didactic tool and stifling creativity. This risks the "aesthetic paternalism" feared: only art deemed morally "uplifting" or explicitly advancing a narrow vision of racial progress is valued. However, Du Bois brilliantly dismantles the premise of "pure" art. In a society saturated with racist propaganda – from minstrel shows to demeaning caricatures in mainstream media – the claim of artistic neutrality is itself a political act, one that implicitly upholds the status quo. Refusing to engage the struggle for justice is not autonomy; it is often complicity, or at best, a luxury unavailable to those whose humanity is under constant assault. Du Bois understood that silence, or art focused solely on abstract beauty divorced from the Black experience, was inevitably interpreted within, and absorbed by, the dominant racist narrative. True artistic freedom for Black creators, he argued, could only be fully realized *after* the dismantling of the oppressive structures that constrained expression and defined value according to white norms.

  **The Capitalist Instrumental Logic: A False Equivalence?** The concern that demanding art be propaganda replicates the instrumentalism Du Bois critiqued in capitalism is profound. Capitalism reduces all value, including art, to exchange value and profit. Does demanding art serve racial justice similarly reduce it to a mere tool, negating its intrinsic worth? The key lies in *purpose* and *agency*. Capitalist instrumentalism serves exploitation and private accumulation, commodifying creativity and alienating the artist from their work and its meaning. Du Bois's instrumentalism, conversely, serves collective liberation, self-definition, and the affirmation of denied humanity. It is an instrumentalism *chosen* by the oppressed as a weapon of survival and a path to genuine autonomy. As he stated, it's about fighting for the right to create beauty *for its own sake*, a right denied under white supremacy. His framework isn't about creating exchange value, but about creating *human value* – asserting the right of Black people to be subjects, not objects, of art and history. The "instrument" is wielded by the community for its own emancipation, not extracted from it for external profit.

  **The Deepening Lens of Later Economic Writings:** Du Bois's later work, particularly *Black Reconstruction in America* (1935) and his writings on Marxism and colonialism, significantly refines how we read his art theory. His analysis shifted towards a materialist understanding of racism as inextricably linked to capitalist exploitation – the "wages of whiteness" subsidizing class rule. This underscores that the "propaganda" he demanded wasn't merely about changing individual hearts or promoting bourgeois respectability. It was about art participating in the *structural* struggle. Art needed to expose the economic foundations of racism, celebrate the agency of the Black working class, challenge the narratives justifying exploitation, and envision new social relations. This mitigates the paternalism concern: the goal isn't just "uplift" in a moralistic sense, but *liberation* in a comprehensive, systemic sense. Art that exposes pain, critiques respectability politics, explores internal contradictions, or utilizes satire and subversion (like the blues tradition he initially underestimated) can be potent propaganda within this broader framework, as long as it ultimately serves the understanding and dismantling of oppression.

  **Form, Function, and the Liberation Metric:** Does accepting Du Bois commit us to judging art *mainly* by political effect over formal quality? Yes, but with crucial nuance. **"Mainly" does not mean "solely."** Du Bois never advocated for shoddy art. He understood that ineffective propaganda is bad propaganda. The power of Jacob Lawrence's *Migration Series*, the searing poetry of Gwendolyn Brooks, the revolutionary aesthetics of the Black Arts Movement, or the complex narratives of Toni Morrison demonstrate that formal mastery – composition, language, rhythm, innovation – *amplifies* the political message. The beauty and skill make the truth undeniable, the emotion inescapable, the argument unforgettable. Du Bois called for "Truth" and "Beauty" in service to the cause. The formal quality is essential *because* it makes the propaganda more resonant, enduring, and effective. The metric becomes: does this work, through its aesthetic power as well as its message, contribute to the consciousness, solidarity, and liberation struggle of Black people? Does it challenge the dominant narrative and offer a vision rooted in Black dignity and aspiration? This is a broader, more dynamic criterion than simply checking for "positive images."

  **Conclusion: The Imperative Endures**

  While vigilance against constrictive definitions of "justice" or "uplift" is essential – art must have the freedom to explore the full, complex, sometimes painful and contradictory spectrum of Black life – Du Bois's core contention remains fundamentally sound. In a world where anti-Blackness permeates structures and culture, Black art cannot afford the illusion of neutrality. The demand for it to be propaganda for racial justice is not an aesthetic straitjacket imposed from above, but a strategic imperative arising from the conditions of struggle. His later economic analysis clarifies that this propaganda is not mere moral suasion, but part of a fight against intertwined systems of racial and economic oppression.

  Accepting Du Bois's view means embracing the responsibility of art within that fight. It means recognizing that formal excellence, while vital, finds its deepest significance when harnessed to the cause of liberation. It means understanding that judging art's contribution to the collective project of achieving justice and affirming humanity is not a diminishment of aesthetics, but an elevation of art's highest potential purpose. Du Bois was right: until true freedom is won, Black art must be a conscious weapon and a beacon. Its beauty, inseparable from its truth, is the beauty of resistance and the promise of a future where art, finally, can be truly for art's sake. The instrumentalism he champions is not that of the market, but that of the maroon, the insurgent, the builder of a new world – necessary, life-affirming, and ultimately liberating for the art itself.
