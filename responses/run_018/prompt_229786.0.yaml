  1. Lewis-style convention: Mutual expectations, common knowledge, and conditional preference to conform. The pattern is arbitrary.
  2. Selectionist/evolutionary account: The pattern is a stable equilibrium from learning or cultural evolution. No representation of 'ought' is necessary.
  3. Social-norm account: People comply because they believe others expect compliance and will sanction non-compliance (blame, etc.).
  4. Deflationary regularity view: No extra normative ingredient beyond the regularity and the comfort or habit of following it.

  We are also to include a mixed motives case (potluck example).

  We'll design the tree with 7-10 nodes (questions) that can be answered without jargon. The questions should be about concrete cases (village walking, company emoji, fishing rotation, potluck dish).

  We'll start by mapping the logical space. We need to identify questions that separate the views. Then we'll assign the positions to the leaves and note:

  - For leaves that can't be separated, what extra question would split them.
  - For empty cells (combinations that aren't occupied by any of the positions), note why: incoherent, unattractive, or never developed.

  Each leaf gets a short name and a sentence on its most awkward commitment.

  Let's outline the key features that distinguish the accounts:

  - **Lewis convention**: 
    - Conditional preference: I conform if others do.
    - Arbitrariness: There could be an alternative pattern that would work just as well.
    - Common knowledge of the pattern and the expectations.

  - **Selectionist/evolutionary**: 
    - The pattern is stable because it is an equilibrium (e.g., in a coordination game) and it was selected by some evolutionary process (learning, imitation, etc.). 
    - No normative element: people don't think in terms of "ought", they just do it because it's the way things are done and it works.

  - **Social-norm account**: 
    - Normative expectations: people believe that others expect them to conform and that non-conformity will be met with sanctions (disapproval, punishment). 
    - People may also have internalized the norm (feel guilt if they break it) but the key is the social enforcement.

  - **Deflationary regularity**: 
    - There is no norm beyond the regularity. People do it out of habit, comfort, or without any sense of obligation. 
    - If asked, they might not even think of it as a rule, just "what we do".

  We also have the mixed motives potluck example: everyone brings a dish because they would feel awful if they didn't (internal pressure) even though they privately wish they didn't have to. This might relate to internalized norms (social norm account) or perhaps to a Lewis convention if they do it because they expect others to and want to coordinate, but the internal feeling of awfulness suggests an internal sanction.

