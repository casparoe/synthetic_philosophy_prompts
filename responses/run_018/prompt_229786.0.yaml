  ### **Decision Tree: From Regularity to Norm**
  *(Start with Question 1 for any case)*

  1. **If someone breaks the pattern in a way that causes no practical problem, do others react negatively (e.g., criticize, punish, gossip) or does the rule-breaker feel guilty?**  
