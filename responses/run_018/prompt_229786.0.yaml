  2. **Is the negative reaction/guilt driven by fear of social consequences (e.g., "People will judge me")?**  
     - *Yes* → **Social-Norm Account**  
     - *No* → *Empty* (Incoherent: Sanctions/guilt require social expectations; no other coherent mechanism fits.)  

  3. **Do people follow the pattern primarily because it feels comfortable/familiar?**  
     - *Yes* → **Deflationary Regularity**  
     - *No* → Go to 4  

  4. **Does the pattern help avoid conflict or solve a shared problem (e.g., collisions on the path)?**  
     - *No* → *Empty* (Unattractive: Stable non-beneficial patterns lacking comfort/sanctions rarely persist.)  
     - *Yes* → Go to 5  

  5. **Do people follow it because they actively want to match others’ behavior to solve the problem?**  
