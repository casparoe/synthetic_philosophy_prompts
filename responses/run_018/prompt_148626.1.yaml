  First, I need to unpack the core tension: Dewey's "warranted assertibility" is about claims justified by inquiry and evidence within a context, whereas correspondence truth assumes a fixed reality. The poem must show these as functionally similar yet distinct, especially through repeated refrains.

  The villanelle structure requires two refrains (A1/A2) that are almost identical—one using "truth," the other "warranted assertibility." The rhyme scheme should make them sound like the same claim with different weights. I'll need slant rhymes to avoid forcing exact matches ("sound"/"ground," "sown"/"known").

