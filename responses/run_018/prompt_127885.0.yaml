answer: |-
  Your pattern reveals a **unified principle** I'll defend: **Artistic value is diminished only when immorality is *internal to the work's constitutive elements*—its form, content, or intended artistic purpose—and directly undermines its capacity for human insight or expressive truth.** 

  Biographical origins (the "who") are external to the work; content and purpose (the "what" and "why") are internal. Immorality contaminates artistic value *only* when it corrupts the work's own structure or aims.

  ### Principle Applied to Your Cases:
  1. **Plagiarist's Original Novel (Origin)**:  
     - *Verdict*: Artistically intact (though achievement diminished).  
     - *Why*: Plagiarism is a biographical failing. The novel’s *own* style and themes remain insightfully rendered. The flaw is in the creator’s process, not the work’s fabric.  

  2. **Abusive Filmmaker’s Beautiful Film (Origin)**:  
     - *Verdict*: Fully good art.  
     - *Why*: The abuse is extrinsic. The film’s form and content stand independently as expressive achievements.  

  3. **Painting Glorifying Cruelty (Content)**:  
     - *Verdict*: Aesthetically powerful but artistically flawed.  
     - *Why*: The immorality is *in* the content and its relish. Form serves a vision that distorts human truth, undermining artistic coherence.  

  4. **Cruel Composer’s Compassionate Symphony (Origin)**:  
     - *Verdict*: Artistic value intact (composer blameworthy).  
     - *Why*: The music expresses compassion authentically; the composer’s cruelty doesn’t infect the work’s internal world.  

  5. **Dehumanizing Propaganda Film (Purpose)**:  
     - *Verdict*: Not good art.  
     - *Why*: Its purpose—to dehumanize—is inseparable from its form. The cinematography *serves* a lie, corrupting its capacity for truth.  

  6. **Masterpiece by Secret Bigot (Origin)**:  
     - *Verdict*: Unchanged artistically.  
     - *Why*: Private beliefs are irrelevant if the work’s internal vision remains uncompromised.  

  ### Where My Principle *Fails* Your Intuition:
  - **The Plagiarism Case**: You call the novel "diminished as an achievement," but my principle treats it as artistically intact. I argue that *artistic value* (the work’s expressive power) is separate from *artistic achievement* (the creator’s praiseworthiness). Your intuition blurs these; my principle strictly separates them.  

  ### The Propaganda vs. Plagiarism Divide:
  They differ in *kind*, not degree. Propaganda’s immorality is **constitutive**: its form exists to enact harm. Plagiarism’s immorality is **extrinsic**: it steals the *process* but not the work’s internal integrity. Origin-flaws (plagiarism) *never* penetrate aesthetic value; purpose-flaws (propaganda) *always* do, because purpose shapes the work’s essence.

  ---

  ### The Documentary Case:  
  **Scenario**: A film critically exposing exploitation, but made by exploiting its subjects during production.  

  **My Principle’s Verdict**:  
  - **Artistic value is *not* diminished**.  
  - **Why**:  
    - The film’s **content** (critique of exploitation) and **purpose** (exposing injustice) are morally aligned with humanistic insight.  
    - The exploitation is a **biographical/origin flaw** in production. It doesn’t infect the work’s constitutive elements—its form (cinematography, editing) serves a truthful, anti-exploitation message.  
    - The immorality is external to the work’s *meaning*. The film’s power to reveal truth remains intact.  

  **Analogy**: Like the plagiarist’s novel—the ethical failing lies in the creator’s actions, not the work’s expressive structure. To reject the film’s artistic value because of production hypocrisy would conflate art with its maker, undermining its independent moral testimony.  

  ---

  ### Why This Principle?  
  It prioritizes the **work itself** over moralistic biography, while recognizing that art’s purpose is to reveal human truths. When immorality hijacks form/content/purpose to *distort* truth (propaganda) or glorify cruelty (painting), the art fails *as art*. When immorality stays outside the work (plagiarism, abuse, bigotry), the artwork’s capacity to illuminate survives. The documentary’s triumph is that its internal truth transcends its tainted origins—proof that art can judge its own making.
