answer: |-
  The Anglo-American legal pattern reflects a **duty-relative theory of causation and responsibility**, where omissions are treated as causes *only when a pre-existing duty to act exists*. This view blends normative (duty-based) and metaphysical elements but is neither purely moralized nor purely metaphysical. Below is a reconstruction of the implicit view, an assessment of consistency, and implications of alternative approaches.

  ---

  ### **1. The Implicit Theory: Duty-Relative Causation**
  - **Omissions as "Causes" Only in Duty-Bound Contexts**:  
    The law presupposes that **causation is not a value-neutral, physical fact** but is **relational to legal/moral duties**.  
    - *No Bystander Liability*: A stranger has no duty to rescue. Their inaction is not a "cause" of death in the legal sense because causation requires a duty-backed obligation to intervene.  
    - *Homicide by Omission*: Parents/nurses have affirmative duties (parental, contractual, or fiduciary). Their failure to feed/disconnect life support is treated as causing death because they were *required* to act.  
    - *Civil Negligence*: Duties of care (e.g., doctor-patient, driver-pedestrian) transform failures to act into legally cognizable causes of harm.  

  - **Moral Responsibility Tracks Legal Duty**:  
    Responsibility arises not from causation alone but from **breach of a specific obligation**. The law distinguishes:  
    - *Moral Neutrality of Inaction*: Bystanders owe no duty; their inaction is morally/legally inert.  
    - *Moral Wrongness of Duty-Breaching Inaction*: Special relationships create obligations; breaching them is culpable.  

  - **Causation as a Normative Concept**:  
    The practice assumes that **causation in law is not identical to scientific causation**. An omission "causes" harm only when the law imposes a duty to prevent it.  

  ---

  ### **2. Consistency of the Doctrines**  
  The three parts **cohere under a duty-relative framework** but reveal tensions in underlying philosophy:  
  - **Consistency**:  
    All doctrines pivot on **duty as the linchpin**. "Cause" is defined contextually:  
    - Bystander cases: No duty → no causation → no liability.  
    - Special relationships: Duty → omission = cause → criminal liability.  
    - Negligence: Duty → omission = cause → civil liability.  
    This unified structure reflects prioritization of **individual autonomy** (no general duty to aid) balanced against **relational obligations** (duties in specific roles).  

  - **Tensions**:  
    - *Moral vs. Legal Duty*: Civil negligence (e.g., failing to warn of a hazard) often imposes broader duties than criminal law, suggesting liability is driven more by policy (risk allocation) than moral philosophy.  
    - *Gradations of Culpability*: Criminalizing a nurse’s omission as "murder" equates it with active killing, while civil negligence is merely compensatory. This risks conflating moral severity.  

  ---

  ### **3. Alternative Theories: Implications for Doctrine**  
  #### **A. Purely Moralized View**  
    **Theory**: An omission causes harm if a "reasonable person" would have acted. Causation tracks moral blameworthiness.  
    **Changes to Doctrine**:  
    - *Bystander Liability*: Criminalized (e.g., Vermont-style "duty to aid" laws).  
    - *Homicide by Omission*: Expanded to any "reasonable" failure (e.g., failing to rescue a stranger in peril).  
    - *Negligence*: Unchanged (already uses "reasonable person" standard).  
    **Critique**: **Over-criminalizes inaction**, violating autonomy. Law becomes a tool for enforcing generalized benevolence.  

  #### **B. Purely Metaphysical View**  
    **Theory**: Omissions are never causes (e.g., absence cannot produce effects; the drowning child died from water, not the bystander’s inaction).  
    **Changes to Doctrine**:  
    - *Bystander Liability*: Affirmed (no liability).  
    - *Homicide by Omission*: Abolished. Parents/nurses could only be liable for *creating* the danger (e.g., poisoning the infant).  
    - *Negligence*: Liability limited to *misfeasance* (active misconduct); no liability for *nonfeasance* (inaction).  
    **Critique**: **Undermines relational ethics**. A parent starving a child avoids murder charges; nurses face no consequences for neglect. Society would need statutory crimes (e.g., "willful neglect") to fill gaps.  

  ---

  ### **Conclusion**  
  The status quo adopts a **hybrid, duty-relative theory**: omissions are causes *only when a duty exists*, making causation dependent on normative relationships. This balances liberty and responsibility pragmatically but risks moral arbitrariness (e.g., why parents owe duties but strangers do not). The doctrines are **largely consistent** under this view, though civil negligence’s broader duty imposition hints at policy-driven flexibility. Adopting a purely moralized or metaphysical view would radically reshape law—either by demanding universal Samaritanism or by absolving all inaction regardless of relationship. The implicit theory thus reflects law’s role as a mediator between abstract metaphysics and social ethics.
