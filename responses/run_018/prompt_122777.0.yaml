prompt: |-
  I have no academic background — I do scheduling for a freight company and read about this in the evenings — and for about two years I have been going back and forth on a forum with two people whose views I respect and cannot shift. One holds that the only honest test is the standard legal one used by asylum systems: you qualify if you have a well-founded fear of being persecuted because of who you are — your religion, your politics, your ethnic group, your membership of some targeted social group — and that destitution, however severe, is not persecution and does not get you in. The other holds that what matters is how badly off you are and how much the receiving country could help at acceptable cost, so that a starving family has a stronger claim than an uncomfortable dissident. I think both are leaving something out, and the something is this: a country can have a duty to take someone in because it is *responsible* for the fact that they had to leave, even when it did not persecute them and even when they are not among the worst off. I want to know whether that idea can carry a case on its own.

  So please build me a case to order, not an illustration of mine. I will use it in that argument, which means the verdicts have to be generated by the principles rather than written into the story.

  Specifications:

  1. One paragraph, 150 words at most. Setting: an ordinary decision-maker's desk — an asylum office, a consulate, a resettlement intake. No science fiction, no siege, no torture, no camp.
  2. Three tests must be applied and must split like this: the persecution test says reject; the urgent-need or priority-to-the-worst-off test also says reject; the causal-responsibility test says admit. Show the inference for each, including the step where the first two come out negative — do not just announce it.
  3. The claimant should not be someone an ordinary reader instinctively roots for. Not destitute, not ill, no children in the story, some savings and some marketable skill, and at least one genuinely available alternative to claiming asylum in this particular country — just a worse one. If the reader's sympathy is doing any of the work, the case has failed.
  4. The receiving country's contribution must be: deliberate policy rather than accident; lawful and democratically authorised; a net benefit to that country's own voters; counterfactually fragile, in that another country would have done substantially the same thing within a year or two if this one had stood aside; and mediated through enough steps that no official ever aimed at displacing this person or anyone like them. I want to see whether overdetermination and distance defeat the causal claim or merely complicate it, and I want your honest view on that.
  5. The case must not quietly reintroduce what it is supposed to do without: no sympathetic destitution smuggled in under another description, and no persecution by proxy. Please check your own scenario against this explicitly.

  After the scenario and the walkthrough: name the single feature of the case that is doing the work, and run the collapse test — remove that feature and tell me what each of the three tests then says. Then give me the strongest thing a defender of the test that comes out worst could say in objection, in their voice, and the best reply you can manage. If all five specifications cannot be jointly satisfied, say so plainly, say which one you had to bend, and build the nearest case that works.

  Do not cite statutes, cases, or authors anywhere in your answer: I have no way to check authorities and I do not need them.

  Format: after the prose, output one JSON object and nothing else after it, with exactly these fields.

  - "scenario_word_count": integer, the length of your scenario paragraph.
  - "claimant": string, one sentence identifying who is claiming and from where.
  - "harm": string, one sentence on what they are fleeing.
  - "receiving_state_policy": string, one sentence on the lawful policy that contributed.
  - "causal_chain": array of 3 to 5 strings, each a single step running from that policy to this person's departure.
  - "overdetermination": string, how the counterfactual-fragility condition in item 4 is met.
  - "verdicts": object with keys "persecution_test", "priority_to_worst_off", and "causal_responsibility"; each value is an object with "verdict" (string, either "admit" or "reject") and "reasoning" (string, at most 60 words).
  - "load_bearing_feature": string, the one feature named above.
  - "collapse_test": object with "feature_removed" (string) and "resulting_verdicts" (object with the same three keys, values "admit" or "reject").
  - "strongest_objection": object with "objector" (string, which test's defender), "objection" (string, at most 80 words), and "reply" (string, at most 80 words).
  - "smuggling_check": object with "need_smuggled_in" (boolean), "persecution_smuggled_in" (boolean), and "justification" (string, at most 60 words, explaining how you know).
  - "specifications_satisfied": array of the numbers 1 to 5, listing only those you judge fully met.
reasoning: |-
  We are to create a case where:
  - Persecution test: reject (no persecution)
  - Priority-to-worst-off: reject (claimant is not among the worst off)
  - Causal-responsibility: admit (the receiving country is responsible for the harm that caused flight)

  Setting: an ordinary decision-maker's desk (asylum office, consulate, etc.). No extreme elements (no torture, etc.).

  Claimant: not someone we instinctively root for. Not destitute, not ill, no children. Some savings and marketable skills. Has at least one alternative (even if worse). So we need a person who is fleeing a situation that is bad but not the worst, and without persecution.

  Receiving country's policy: deliberate, lawful, democratically authorized, net benefit to its voters, counterfactually fragile (if they hadn't done it, another country would have within a year or two), and mediated through enough steps so that no official intended to displace this person.

  We must avoid smuggling in destitution or persecution.

  Idea: 
  - Harm: economic harm that is severe but not destitution. The claimant has savings and skills, so they can survive but their situation is deteriorating and they fear it will get worse. But they are not starving or without any resources.
  - Policy: The receiving country, say, imposed or led an international economic sanction for a legitimate reason (e.g., human rights violations in the target country) that caused an economic downturn in the claimant's country. The sanction was lawful, approved by parliament, and benefited the receiving country (e.g., by weakening a rival or by satisfying domestic human rights groups). If the receiving country hadn't imposed the sanctions, another major power would have within a year (counterfactual fragility). The chain: policy (sanctions) -> economic downturn in target country -> loss of jobs in claimant's sector -> claimant's job loss and inability to find equivalent work -> decision to leave.

  Claimant: a mid-level manager in a factory that closed due to the sanctions. They have savings (so not destitute) and skills (marketable, but maybe not immediately transferable without retraining). They are not persecuted: the sanctions affect everyone in the country, not targeting a particular group. They are not among the worst off: they have savings and can find some work, but the work is low-paying and the economy is getting worse. They could move to a neighboring country (which is also suffering but less so) but that country offers lower wages and worse conditions.

  Verdicts:
  1. Persecution test: reject. The harm is economic and not targeted at a protected group (it's general economic hardship). The claimant is not being persecuted for who they are.
  2. Priority-to-worst-off: reject. The claimant has savings and skills, and is not starving or without shelter. There are others in the country who are worse off (e.g., those without savings, the elderly, the sick). The claimant is not among the most vulnerable.
  3. Causal-responsibility: admit. The receiving country's sanctions were a substantial cause of the economic collapse that forced the claimant to leave. Even though they did not intend to displace the claimant, and even though another country would have done the same, the receiving country's deliberate policy set the chain in motion.

  Load-bearing feature: The causal link between the receiving country's policy and the claimant's departure. Without that, the causal responsibility test fails.

  Collapse test: Remove the causal link. How? Suppose the receiving country did not impose the sanctions and no other country imposed them either (so the counterfactual fragility condition is broken). Then the harm would not have occurred. But in that case, the claimant would not have left. Without the causal link, the causal responsibility test would reject. The other tests remain reject.

  Strongest objection: Defender of persecution test might argue: "Even if your country caused the harm, asylum is for protection from persecution, not for compensation for harm caused. This is a matter for state responsibility and reparations, not asylum." Reply: "Asylum is a form of protection from serious harm. When the harm is a direct result of the receiving state's actions, the moral basis for protection is as strong as in persecution, even if the harm is not intentionally targeted."

  Smuggling check: We must ensure we didn't smuggle in destitution or persecution. The claimant is not destitute (has savings, skills) and the harm is not persecution (it's economic and general). So: need_smuggled_in = false, persecution_smuggled_in = false.

  Specifications: We are trying to meet all five.

  Write the scenario paragraph (max 150 words):

  [Scenario]
  Arman, a 45-year-old former factory manager from Country X, applies at a consulate. His factory closed after international sanctions led by Receiving State caused an economic downturn. He has savings (equivalent to $15,000) and managerial skills, but only finds intermittent low-wage work in X, and projects his savings will deplete in two years. He could relocate to neighboring Country Y, where similar work pays half his former wage. He fears worsening economic conditions and eventual poverty. The sanctions, imposed lawfully by Receiving State's parliament to pressure X's government on human rights, were a net benefit to Receiving State by boosting its diplomatic standing. If Receiving State had not acted, Ally State would have imposed equivalent sanctions within 18 months.

  [Walkthrough]
  - Persecution test: Reject. Arman suffers general economic harm, not persecution for a protected characteristic. The sanctions affected all citizens regardless of identity.
  - Priority test: Reject. Arman has savings and skills; he is not among the worst-off (e.g., compared to those already destitute in X). His situation is uncomfortable but not dire.
  - Causal test: Admit. Receiving State's sanctions were a substantial cause of the factory closure and Arman's subsequent hardship, creating a responsibility to offer refuge.

  Load-bearing feature: The causal link from the sanctions to Arman's departure.

  Collapse test: Without the sanctions (and without any other country imposing them either), Arman would not have lost his job and would have no need to leave. Then the causal test would reject.

  Strongest objection: From the persecution test defender: "Even if we caused the harm, asylum is reserved for persecution victims. Economic migrants, even those displaced by our policies, should seek other immigration pathways, not asylum." Reply: "When our actions directly cause the harm that forces displacement, we have a duty to protect that exceeds ordinary migration. Asylum law should expand to cover state-caused displacement without persecution."

  Smuggling check: No destitution (he has savings and skills) and no persecution (general harm). So false for both.

  Specifications: We think all five are satisfied.

