  Hey, I'm in a phil of mind seminar and we spent the last session tearing apart Chalmers-style conceivability arguments about philosophical zombies — the idea that if you can concieve of a being physically identicle to you but with zero inner experience, then physicalism is in trouble. I want to tell a joke about this at our study group tonight, but everything I come up with is basically "a zombie walks into a bar and doesn't feel the drink." I need something that actually turns on the logic of the argument, especially the gap between what's concievable and metaphyscial possibility.

  Here's a twist I want you to inject: imagine there's also an "inverse zombie" that's physically identicle to a human but is *only* pure consciousness with no body or brain at all — just the subjective side with nothing physical to hang it on. Can you write a joke where both a regular zombie and an inverse zombie show up, and the punchline depends on which one of them can actually run the conceivability argument? Make it genuinely funny to people who know the debate, not just generic sci-fi humor, and please write it in American English — my study group is all in the US and I want it to sound casual. No citations needed, just the joke and maybe a quick line on why the conceptual hook works.
