  Okay, the user is in the final year of their PhD in behavioral ecology, focusing on cooperation. They need to clarify the criteria for an adequate theory of cooperation evolution for their synthesis chapter. Their main goal is diagnostic: they want a theory that can infer mechanisms from field data, not just tell a story. They listed specific challenges from their research: one-shot encounters, unknown time horizons, implementation errors, no recognition, large groups, private reputations, second-order free-riding, hidden payoffs, defining true cooperation, and the bookkeeping constraint.

  First, I need to translate their frustrations into clear desiderata. Each point they raised should become a criterion with a rationale. For example, their issue with one-shot anonymous encounters in humans points to the need for mechanisms that don't rely on repeated interactions. The unknown horizon problem means the theory shouldn't require agents to know the future. Misimplementation relates to robustness to stochasticity and decoupled benefits. No recognition ties to mechanisms that work without discrimination, perhaps through spatial or genetic assortment. Large groups necessitate scalability beyond dyads. Private reputations require cognitive plausibility. Second-order free-riding needs addressing without infinite regress. Payoff non-transparency means the mechanism can't depend on observing others' payoffs. Defining true cooperation ensures the theory distinguishes between mutualism and altruism. The bookkeeping constraint is likely fundamental, so it's a consistency check.

  Next, I should identify which criteria are genuine requirements versus field-specific preferences. For instance, explicit decision rules might be necessary for testability but could be too restrictive if they demand unrealistic cognition. Covering all species might be a unification preference rather than a must. Observational identifiability is crucial for their fieldwork but might limit theoretical models. The user suspects some criteria conflict, like explaining one-shot cooperation without assortment while being stable against defectors. That trio is likely impossible, so dropping one is necessary. Probably, "no assortment" should be dropped, as some form of assortment (genetic, spatial) is often needed.

  The most critical desideratum might be the bookkeeping constraint since it exposes hidden assumptions. Scalability and observational identifiability also knock out many theories. For the scorecard, each theory should be briefly assessed against the key criteria. Kin selection handles many points but struggles with non-kin. Direct reciprocity fails in one-shot or large groups. Indirect reciprocity needs public reputations and cognitive complexity. Partner choice requires choice opportunities. Byproduct mutualism avoids altruism but isn't always applicable. Multilevel selection often reduces to kin selection.

  The user's deeper needs include a structured framework to evaluate theories for their empirical work, clarity to counter committee inconsistencies, and focusing on diagnostic power over narrative. They also need to defend their approach against committee biases, so distinguishing essential criteria from preferences is vital. Highlighting trade-offs, like dropping "no assortment," helps them make informed choices. Organizing the chapter around scalability or observational identifiability could provide a strong narrative, given their field systems' challenges.
answer: |-
  Here’s a distilled list of **diagnostic desiderata** for a theory of cooperation evolution, grounded in your empirical constraints and purpose (inferring mechanisms from field data). Each requirement is motivated by the challenges you outlined, with distinctions between *core demands* and *field-contingent preferences*. 

  ---

  ### **Core Desiderata (Non-Negotiable for Diagnostic Power)**
  1. **Robustness to Stochastic Payoffs & Decoupled Benefits**  
     *Motivation*: Your mutualism system (cost paid now, delayed/decoupled benefit; 20% failure rate).  
     *Requirement*: Theory must explain persistence despite benefits being noisy, non-synchronous, or accruing to non-recipients. Rules out partner fidelity feedback loops or strategies requiring precise cost-benefit tracking.

  2. **Operability Without Known Interaction Horizons**  
     *Motivation*: "Unknown horizon" problem (agents lack perfect knowledge of future interactions).  
     *Requirement*: Mechanism cannot rely on agents calculating continuation probabilities. Discounted future rewards must emerge from ecology (e.g., spatial structure), not cognition.

  3. **Scalability to N-Player Public Goods**  
     *Motivation*: Large-group cooperation in your cooperative breeder and most real systems.  
     *Requirement*: Mechanism must function in groups > dyads without exponential computation (e.g., no n-player reciprocal accounting).

  4. **Observational Identifiability**  
     *Motivation*: Need to infer mechanism from field data (helping rates, relatedness, interaction structure).  
     *Requirement*: Theory must generate testable, unique predictions for patterns in measurable variables (e.g., "if mechanism X, we expect correlation Y between dispersal distance and helping effort"). Rules out theories requiring unobservable cognitive processes.

  5. **Distinction Between Byproduct Mutualism and Enforced Cooperation**  
     *Motivation*: "Definitional case" – avoiding false puzzles.  
     *Requirement*: Theory must specify when cooperation requires explanation (i.e., when net direct fitness cost exists) vs. when it’s a self-interested byproduct.

  6. **Stability Against Second-Order Free-Riding**  
     *Motivation*: Punishment-based mechanisms collapse if punishers are exploited.  
     *Requirement*: Any punishment/positive reinforcement must be self-sustaining without infinite regress.

  ---

  ### **Contextual Desiderata (Essential for Your Systems, But Not Universally)**
  7. **Functionality Without Individual Recognition**  
     *Motivation*: Lack of discrimination in your cooperative breeder.  
     *Requirement*: Mechanism must work via proxies (e.g., spatial location, group membership, kinship cues) or generalized responses. Rules out partner-specific reciprocity.

  8. **Tolerance to Payoff Opacity**  
     *Motivation*: Agents observe only own payoffs + noisy cues.  
     *Requirement*: Mechanism cannot rely on agents knowing others’ fitness outcomes. Excludes strategies requiring precise payoff comparisons.

  9. **Cognitive Plausibility**  
     *Motivation*: Private, noisy assessment in your simulations; embarrassment at attributing complex norms.  
     *Requirement*: Proposed decision rules and information processing must align with species’ known capacities (e.g., no image scoring if reputations are private and noisy).

  ---

  ### **The Bookkeeping Constraint: A Reality Check**
  *   **Consistency with Assortment Requirement**  
      *Motivation*: Your point (x) – all mechanisms reduce to assortment (genetic/spatial/temporal) or direct fitness feedback.  
      *Status*: **Fundamental axiom, not a desideratum**. Any mechanism claiming cooperation without assortment or feedback is likely mis-specified. Use this to falsify overly optimistic models.

  ---

  ### **Debunking Common but Misplaced Demands**
  - **"Must cover all species"**: A preference for unification, not a requirement. Diagnostic theories can be taxon-specific.  
  - **"Require explicit decision rules"**: Useful for testability but risks over-engineering. Field-parameterized rules (e.g., "help if kin cue > threshold") suffice; complex cognitive architectures do not.  
  - **"Explain one-shot anonymity"**: A red herring *for non-humans*. Your focus is wild populations with repeated, structured interactions. Lab anomalies need not constrain your theory.  
  - **"Elegance or generality in models"**: Narrative priority, not diagnostic. A kludgy mechanism that matches your data is better than an elegant one that doesn’t.

  ---

  ### **Inconsistencies and Trade-Offs**
  The triad **"explain cooperation in genuinely one-shot, anonymous, non-kin interactions" + "be stable against defectors" + "require no assortment" is impossible**.  
  - **What to drop**: "No assortment".  
  - **Why**: Assortment (genetic, spatial, temporal) is the only known engine for cooperation without repeated feedback (Hamilton’s rule, network reciprocity).  
  - **Cost**: Requires measuring assortment (e.g., relatedness, interaction networks) in your systems. But you already do this!  

  **The Most Damaging Desideratum**: **Observational Identifiability**. It eliminates:  
  - Most indirect reciprocity (requires unobservable reputation systems).  
  - Complex cognitive strategies (e.g., "stern judging" norms).  
  - Theories relying on agents knowing others’ payoffs.  

  **Organize your chapter around this**. It forces confrontation with data limitations and exposes "just-so" storytelling.

  ---

  ### **Theory Scorecard (Brief, Criteria-Focused)**
  | **Theory**               | **Fails Core Desiderata**                                  | **Strengths for Your Systems**                          |  
  |--------------------------|------------------------------------------------------------|---------------------------------------------------------|  
  | **Direct Reciprocity**   | #1 (noisy/decoupled benefits), #3 (scalability), #7 (recognition) | Only viable in small, stable groups with high recognition. |  
  | **Indirect Reciprocity** | #4 (unobservable reputations), #8 (payoff opacity), #9 (cognitive plausibility) | Fails under private/noisy assessment. Irrelevant without recognition. |  
  | **Kin Selection**        | None (if including spatial assortment).                    | Best fit for cooperative breeder (assortative helping). Requires relatedness/dispersal data. |  
  | **Biological Markets**   | #1 (decoupled benefits), #7 (no recognition)               | Requires partner choice – absent in your non-discriminating helpers. |  
  | **Byproduct Mutualism**  | N/A (not cooperation by your definition).                  | Use #5 to rule it out when costs exist.                 |  
  | **Multilevel Selection** | #4 (often untestable; reduces to kin/assortment).          | Theoretically possible but rarely adds predictive power beyond kin selection. |  

  **Strongest Candidates for Your Systems**:  
  - **Kin Selection + Spatial Assortment**: Explains non-discriminatory helping in breeders.  
  - **Generalized Reciprocity** ("help anyone if helped recently"): Tolerates no recognition, payoff opacity, and stochasticity. Scalable if structured.  
  - **Punishment with Synergy**: If punishment costs are low/benefits high, avoids second-order free-riding.  

  Focus your synthesis on **measuring assortment parameters** and **testing for generalized reciprocity rules**. Your mutualism’s decoupled benefits point to **spillover effects** (e.g., helping boosts actor’s indirect fitness via group productivity) – a kin-selection logic without direct feedback.
