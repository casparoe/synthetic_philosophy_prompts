prompt: |-
  I was arguing with my roommate last night about whether moral reasons can just float around with nobody actually holding them, you know? We got kinda sidetracked talking about Scanlon and whether reasons are just out there like furniture, but I think I lost the thread somewhere around midnight. Anyway I'm trying to write something for this course I'm taking on conceptual foundations of ethics, and I keep running into this idea of 'free-floating rationales' — reasons that don't depend on any actual reasoner having them — but it feels like cheating unless you can ground them somehow.

  So could you argue for the position that free-floating rationales can't actually do any normative work unless they're anchored in some kind of distributed cognitive scafolding? I don't mean just that someone needs to recognize them; I mean that their very status as reasons collapses into being embedded in social practices or institutional structures that distribute cognition across people. Basically defend the idea that there's no real distinction between 'reasons without reasoners' and 'reasons embedded in distributed practices' — if you push the free-floating view hard enough it dissolves into the embedded view. Don't just run through the standard internalism/externalism playbook, I want something that actually moves the ball on whether rationales can be genuinely orphaned.
reasoning: |-
  Okay, the user is grappling with the concept of "free-floating rationales" in ethics—reasons that exist independently of anyone holding them. They had a debate with their roommate about Scanlon's view that reasons are like objective furniture in the world. But now, they're writing a paper and feel that such reasons are "cheating" unless grounded. They want an argument that these rationales can't do normative work unless anchored in distributed cognitive scaffolding—social practices or institutions that distribute cognition. Importantly, they don't want the standard internalism/externalism debate; they want a fresh take showing that the free-floating view collapses into the embedded view when pushed.

  First, I need to unpack their request. They're rejecting the idea of reasons existing in a vacuum. Instead, they're advocating for a framework where reasons are inherently tied to social structures. Their deeper need might be to reconcile moral objectivity with human practices—avoiding platonic realism without falling into subjectivism. They mention "distributed cognitive scaffolding," which points to embodied cognition or extended mind theories. So, the approach should tie reasons to collective human practices, showing that even abstract reasons depend on social embeddedness.

  The user references Scanlon, so I should address his contractualism. Scanlon argues that moral reasons are objective, based on what no one could reasonably reject. But the user wants to challenge this by emphasizing that "reasonable" depends on shared norms and practices. The key is to argue that without social contexts, the concept of reasonableness lacks content. 

  Next, consider examples. Mathematical truths are often cited as objective, but even they rely on human practices of proof and validation. Similarly, moral reasons need institutional contexts—like legal systems or cultural traditions—to have traction. The collapse argument: if you imagine reasons detached from all practices, they become inert. For instance, a "reason" for environmental conservation only gains force through scientific communities, laws, advocacy groups, etc. 

  The user might also be hinting at meta-ethical concerns—how to ground norms without metaphysics. By tying reasons to distributed cognition, we avoid abstract ontology and root ethics in observable social dynamics. This aligns with Wittgensteinian views where meaning is use, or Brandom's inferentialism. 

  Potential pitfalls: not conflating the need for recognition with the ontological status of reasons. The user clarifies it's not just about acknowledgment but the scaffolding enabling reasons to function. So, focus on how practices create the conditions for reasons to be actionable and meaningful. 

  Structure the argument: start by defining free-floating rationales, then show their inadequacy—using examples where isolated reasons lack force. Introduce distributed cognition (Hutchins, Clark & Chalmers), apply to ethics. Argue that even objective-seeming reasons rely on collective practices. Address counterarguments: e.g., uncontacted tribes having moral reasons? Response: their practices form the scaffolding. Conclusion: free-floating reasons, when examined, dissolve into embedded ones.
answer: |-
  Here's a defense of the position that "free-floating rationales" are an incoherent concept and that *all* normative work is necessarily done by reasons embedded within distributed cognitive scaffolding (social practices, institutions, linguistic structures):

  ### The Core Argument: The Scaffolding is the Substance

  1.  **The "Work" Requirement:** Normative reasons must be able to *do* something – provide guidance, justify actions, explain obligations, resolve disputes, motivate (at least potentially, in the right cognitive context). Truly "free-floating" rationales (existing like abstract Platonic Forms, wholly independent of any cognitive system or practice) cannot *do* this work. They are inert patterns without traction.

  2.  **The Collapse Mechanism:** When we try to explain *how* a purported "free-floating" rationale *actually functions* as a reason, we inevitably invoke elements of distributed cognitive scaffolding:
      *   **Content & Intelligibility:** What *is* the rationale? "It is wrong to cause unnecessary suffering." This proposition isn't atomic; its meaning depends entirely on a shared linguistic and conceptual web: What counts as "suffering"? What makes suffering "unnecessary"? How is "wrong" understood here? This web is a distributed cognitive artifact maintained through social practices of language use, teaching, and debate.
      *   **Force & Authority:** *Why* should I care about this rationale? The claim "It just *is* a reason!" is question-begging. Its force emerges from its position within a network of practices: embedded in legal systems (prohibiting cruelty), educational norms (teaching empathy), cultural narratives (valorizing compassion), institutional sanctions (punishing violators), and patterns of social praise/blame. The *reason* gains its "ought" character from its entanglement in these *practices* that shape expectations and responses.
      *   **Application & Discernment:** How do we know *this* rationale applies to *this* situation? Determining relevance and weight requires interpretation, deliberation, and judgment. These are not solitary acts accessing a pure realm of reasons; they are skills honed within social practices (legal reasoning, moral casuistry, philosophical discourse, community deliberation) that provide shared precedents, frameworks, and norms for reasoning. The "free-floating" rationale cannot *apply itself*.

  3.  **The Distributed Cognition Anchor:** Cognitive science (e.g., Hutchins, Clark & Chalmers) shows cognition isn't just "in the head." It's distributed across brains, tools, symbols, and social structures. *Normative cognition is a prime example:*
      *   **Institutions as Cognitive Artifacts:** Legal codes, constitutions, professional ethics boards, and even informal social norms function as external repositories and processors of normative reasons. They store precedents, encode principles, provide decision-making procedures, and distribute the cognitive labor of applying reasons across individuals and time.
      *   **Language as Normative Infrastructure:** Language isn't just descriptive; it's inherently normative. Mastering a language involves learning the "game" of giving and asking for *reasons* (Brandom). The meanings of terms like "promise," "fair," "obligation," "right" are constituted by the social practices governing their correct use and the normative consequences (entitlements, commitments) they create within those practices. The "rationales" are inseparable from the linguistic practices that give them life.
      *   **Practices as Reason-Generating Engines:** Social practices don't just transmit pre-existing reasons; they actively *generate* and *transform* them. New technologies create new moral dilemmas; evolving social understandings reshape concepts like "equality" or "privacy"; legal precedents establish new normative interpretations. The "scaffolding" is dynamic and constitutive.

  4.  **Dissolving the Distinction:**
      *   Proponents of free-floating rationales might say: "But the *truth* of 'torture is wrong' exists independently of whether anyone recognizes it or has practices about it." However, unpacking "truth" here:
          *   If it means "correspondence to a free-floating fact," we're back to inertness – how does this "fact" *become* a *reason* with normative traction?
          *   If it means "would be assented to under ideal conditions of reasoning," we've smuggled in the scaffolding – what are the "ideal conditions"? They are defined by the norms and capacities embedded within (or extrapolated from) our *actual* distributed cognitive practices (e.g., ideal moral observers are idealized participants in *our* moral language games).
          *   If it means "plays an indispensable role in the best explanation of our moral experiences/practices," then the rationale's status *depends* on its role within the very practices it's supposed to float above. Its justification is parasitic on the scaffolded system.
      *   **The Thought Experiment Failure:** Imagine stripping away *all* social practices, institutions, linguistic norms, and cognitive agents. What remains of the "rationale"? An abstract proposition? But propositions are symbols whose meaning depends on interpretative practices. A pure "ought"? But "oughts" only make sense relative to goals, values, or standards, which are themselves constituted within practices. Without the scaffolding, the "rationale" evaporates into unintelligible noise or vacuous abstraction. It has no *purchase* on the world.

  ### Addressing Key Challenges

  *   **"But Math/Logic!"**: Mathematical truths (e.g., 2+2=4) are often cited as free-floating. But their *normative force* as *reasons* for belief or calculation only manifests within cognitive systems and practices (mathematical proof traditions, engineering applications, basic counting practices). The abstract relationship exists, but its *status as a guiding reason* requires embedding. An alien species might grasp completely different mathematical structures as "compelling reasons."
  *   **"Uncontacted Tribes / Solitary Agents?"**: Even a solitary agent's reasons rely on internalized scaffolding – concepts, memories, self-talk, and reasoning patterns shaped by prior social interaction (or at least, biological and environmental interactions scaffolded by evolution). A truly *never-socialized* agent (if possible) would likely lack the conceptual resources for complex normative reasoning as we understand it. Their "reasons" would be radically different, grounded in immediate biological imperatives scaffolded by their specific environment and neurology.
  *   **"Doesn't this lead to Relativism?"**: Not necessarily. Practices can be more or less coherent, inclusive, reflective, or conducive to flourishing. Critiquing practices (e.g., arguing slavery violates deeper commitments within our own concept of justice) happens *from within* the broader, evolving network of distributed normative cognition. We use reasons embedded in some practices to challenge others, seeking wider reflective equilibrium across the scaffolded system. Objectivity emerges from the robustness and criticizability of the distributed system, not from escaping it.

  ### Conclusion: Reasons are Practices in Disguise

  The notion of a "free-floating rationale" attempts to isolate the abstract *content* of a reason from the *practices* that give it life, meaning, force, and application. This is impossible. The scaffolding isn't just a delivery mechanism for pre-existing reasons; it is the very fabric in which reasons are *constituted* as functional normative entities. When we push the "free-floating" view, asking *how* it *works* as a reason, we always find ourselves describing its embeddedness within distributed cognitive and social structures. The distinction collapses: **Reasons are patterns of normative force sustained and enacted by distributed cognitive systems – primarily human social practices, institutions, and languages.** There are no genuinely "orphaned" rationales doing normative work; they are always already embedded within the cognitive ecology that gives them substance. To ground reasons is to anchor them in the dynamic, collective practices of reason-giving and reason-using creatures.
