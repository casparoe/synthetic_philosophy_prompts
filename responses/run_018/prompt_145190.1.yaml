    "family_resemblance_fix": "Avoids circularity by defining 'West' geopolitically first, then observing associated values. Cost: Loss of analytical coherence & normative force; becomes merely descriptive & contingent.",
    "normative_jurisdiction_tension": "Double-move (universal validity + Western particularity) functions ONLY by relying on an unstated theory of moral/civilizational progress positioning the West as vanguard.",
    "verdict_on_coherence": "Conceptually incoherent as an analytical tool. Essentialism fails logically; family-resemblance lacks defining power; universal/particular requires contested teleology. Coherence is primarily rhetorical/political.",
    "feature_doing_the_work": "The hidden theory of moral/historical progress (Western civilization as the pinnacle/realizer of universal human potential)."
  }
