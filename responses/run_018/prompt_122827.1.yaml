  ### Design Notes (Per Your Request)  
  1.  **Core Vulnerabilities Satirized:**  
      - **Objects vs. Structure:** Relata discontinued (Section 3), storage label "Objects Not Included" (Section 7), regulatory purge (Section 16).  
      - **Vacuous Rearrangement:** "VRP" impurity (Section 3), spill rearrangement hazard (Section 6).  
      - **Structure-of-What?:** Physical properties lacking referents (Section 9), decomposition residues (Section 10).  
      - **Epistemic vs. Ontic:** Two grades (Ramsey = cautious/epistemic; Causal = bold/ontic), with trace nomic necessity (Section 3) and divergent Continuity Numbers (Section 9).  

  2.  **Section-Joke Alignment:**  
      - Section 3: Discontinued relata + impurities.  
