      - Section 9: Continuity Numbers near 1 for equations, near 0 for mechanisms.  
      - Section 10: Decomposition into "Pythagorean residues" (idealism jab).  
      - Section 15: Regulatory enforcement of object removal.  

  3.  **Grades & Recommendation:**  
      - **Ramsey-Grade:** Thin, inexpensive, high equation-continuity. Recommended for "epistemic applications."  
      - **Causal-Grade:** Thick, costly, contains "nomic necessity," low mechanism-continuity. Supplier notes "efficacy disputed." Subtly implies Ramsey-grade suffices.  

  **Tone & Accuracy:** Maintained deadpan SDS register throughout. All gags extrapolate real structural realist commitments (e.g., Ladyman & Ross’s ontic structural realism, Worrall’s epistemic view). No real names/institutions used. Emergency number, CAS#, and ISO standard inventively plausible.
