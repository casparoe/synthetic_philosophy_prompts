answer: |-
  ### **The Restoration Clinic Workshop Design**  
  *Run this in a room with a table, chairs, and space for a "black box" area. Total time: 75 mins. Casual, experiential, zero prep readings.*

  ---

  ### **Materials Needed**  
  - **Black Box Setup**: A large cardboard box (or curtained-off area) with a lid/door. Inside: dim lighting (or no light) and 4 objects:  
    - 3D-printed **cube** (matte texture), **sphere** (smooth), **pyramid** (pointed), **cylinder** (ridged sides).  
    - All objects ~4" tall/high, neutral colors (gray/white).  
  - **Gloves**: Thick work gloves (like gardening gloves) to dull fine touch.  
  - **Blindfolds**: For patients during training.  
  - **Test Images**: 7 images projected on a screen/wall:  
    - 4 target objects shot from **weird angles** (e.g., cube from a corner so it looks diamond-shaped, sphere as a flat circle with shadow, pyramid from above, cylinder sideways).  
    - Add **distractors**: Cone, torus (donut), and star-shaped blob.  
    - Make images ambiguous: Use high-contrast shadows, unexpected colors (e.g., a red cube), and textures (e.g., a "fuzzy" sphere).  
  - **Sensory-Substitution Audio**: Use a free phone app like *Spectroid* (Android) or *SonicScope* (iOS) that turns camera input into sound. Set it to emit **high-pitched tones for edges** and **low-pitched hums for curves**. Mount the phone on a glove or let patients hold it.  
  - **Tokens**: Poker chips or paper slips for betting (10 per better).  
  - **Timer**: For strict 10-min training.  

  ---

  ### **Roles & Rules**  
  **Split roles**:  
  - **Patients (4)**: Experience "blindness" → "cure." *2 use audio substitution, 2 don’t*.  
  - **Controls (2)**: Never touch the objects—baseline guessers.  
  - **Betters/Observers (2)**: Watch, assist with audio, and bet tokens.  

  **Game Flow**:  
  1. **Setup (5 mins)**:  
     - Assign roles randomly (draw names from a hat).  
     - Brief everyone: *"Patients: You’re ‘newly blind.’ Controls: You’re sighted but untrained. Betters: Bet on outcomes."*  
     - Emphasize: **NO PEEKING** (check gloves/blindfolds).  

  2. **Blind Training Phase (10 mins)**:  
     - Patients enter the black box (or blindfold in a dark corner).  
     - All wear gloves + blindfolds. Objects are inside.  
     - **Task**: Feel all 4 objects. Invent **secret names** (e.g., "spiky" for pyramid). *No standard terms allowed!*  
     - **Twist**:  
       - 2 patients get **audio substitution**: Hold the app-equipped phone while touching. *"The sound maps to the shape’s edges/curves—use it to ‘see’ with your ears."*  
       - 2 patients get **touch only**.  
     - Betters help: One runs audio apps; one watches for cheating.  

  3. **The "Cure" & Test (15 mins)**:  
     - Patients exit, remove blindfolds/gloves → "cured."  
     - Project the 7 test images (4 targets + 3 distractors).  
     - **Test Order**:  
       - Patients go first (one by one). For each, ask: *"Point to the image matching your secret name for [object]."*  
         - E.g., *"Which photo is your ‘roundy’?"*  
       - Controls go next. Ask: *"Point to the cube/sphere/pyramid/cylinder."* (Use standard names—they lack touch memory.)  
     - **Rules during test**:  
       - No talking between participants.  
       - No explanations of how 3D touch maps to 2D sight.  
       - Record answers secretly (facilitator uses a scoresheet).  

  4. **Betting Phase (during test setup)**:  
     - Betters place token bets **before** testing starts:  
       - **Bet 1**: Patients’ average score > Controls’ average? (Options: Patients/Controls/Tie).  
       - **Bet 2**: Audio patients > Non-audio patients? (Options: Audio/Non-Audio/Tie).  
     - **Payoff**: Win = double tokens on correct bet. Lose = tokens gone. Tie = tokens back.  
     - *Loser buys snacks* (or volunteers for cleanup).  

  5. **Scoring & Reveal (5 mins)**:  
     - Calculate:  
       - Patient average = total correct IDs ÷ 4.  
       - Control average = total correct IDs ÷ 2.  
       - Audio vs. non-audio patient scores.  
     - Announce results. Pay bets.  

  ---

  ### **Debrief (20 mins)**  
  **Start with raw reactions**:  
  - *Patients*: "How did the shapes look vs. feel? Did sight match touch?"  
  - *Controls*: "How hard was guessing?"  
  - *Betters*: "Why did you bet the way you did?"  

  **Map to Molyneux’s Problem**:  
  - **The Confusion We Felt**:  
    - Patients likely struggled: Touch gives edges/weight; sight gives 2D color/shadow. A cube felt as "sharp" might look like a diamond or blob.  
    - Controls may outperform patients if images are misleading (touch memory ≠ visual intuition).  
    - **Audio twist**: Audio patients might do *worse*—sound added a 2nd abstract layer (edge → tone), but it doesn’t map cleanly to vision. Or they might focus better on spatial patterns.  

  - **Empiricist vs. Rationalist Tension**:  
    - **Empiricist (Locke) view**: Betting *against* patients winning? That’s empiricism! Knowledge comes from sensory experience—you need to *learn* vision-touch links. Our failures show this.  
    - **Rationalist (Leibniz) view**: Betting *for* patients? Rationalism claims innate ideas/spatial logic should bridge senses. If audio patients did better, maybe abstract mapping (sound → vision) helped.  
    - **Betting mistakes expose biases**: If betters assumed patients would crush controls, they leaned rationalist. If they bet on chaos, they leaned empiricist.  

  **What This *Can’t* Simulate**:  
  - **Neural plasticity**: Real sight restoration takes months/years of brain rewiring. Our 10-min training ignores that.  
  - **Congenital blindness**: All players have prior sight memory (unlike Molyneux’s hypothetical). We can’t simulate "pure" touch-to-vision.  
  - **Depth/color perception**: Test images are 2D. Real sight includes depth—which might help.  

  ---

  ### **What Will Break (and How to Fix)**  
  - **Problem**: Peeking through gloves/blindfolds.  
    **Fix**: Tape glove cuffs to sleeves. Use padded blindfolds. Have betters monitor.  
  - **Problem**: Images too obvious (e.g., sphere looks round).  
    **Fix**: Use extreme angles (e.g., cube shot corner-first so edges blur). Add filters (e.g., "noisy" texture on sphere).  
  - **Problem**: Audio too clear (e.g., app makes cubes sound "jagged").  
    **Fix**: Set app sensitivity high—background noise should blur signals. Tell players: "The sound is a *cue*, not a perfect map."  
  - **Problem**: Test runs long.  
    **Fix**: Enforce 90-second limits per player during ID. Use a timer.  

  ---

  ### **Why This Works**  
  - **Hits the confusion first**: Players *feel* why mapping touch to sight isn’t obvious. No lecture needed—the struggle teaches.  
  - **Twist deepens debate**: Audio = a "cheat code" for cross-modal mapping? Or does it overcomplicate?  
  - **Casual & human**: Snack bets, secret names, and tactile chaos make philosophy visceral.  

  **Out the door**: "So... if your partner’s sight returns, would she know a cube from a sphere? Our game says: Probably not *instantly*. But maybe with time, sound cues, or a really good snack bribe..." 😉
