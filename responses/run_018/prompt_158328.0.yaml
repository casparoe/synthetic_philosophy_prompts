answer: |-
  ### Reconstruction of the argument
  Leibniz begins with the observation that "nothing" seems metaphysically simpler than "something" because it lacks constituents or differentiating features. If simplicity were the sole criterion for actuality, nothingness should prevail. However, Leibniz invokes the Principle of Sufficient Reason (PSR): every fact must have a complete explanation for why it is so and not otherwise. Nothingness, despite its simplicity, cannot satisfy the PSR. Its actualization would require a reason explaining why existence *fails* to obtain. Yet nothingness offers no internal resources to ground such an explanation—it is pure absence. Therefore, nothingness cannot be actual precisely because it is intrinsically inexplicable. Existence, by contrast, *can* satisfy the PSR through a necessary being (God) whose essence contains its own sufficient reason. Thus, existence is necessary not because it is simpler, but because it alone meets the demand for complete intelligibility.

  ### The principle of sufficient reason and its symmetry
  Leibniz explicitly applies the PSR symmetrically: both the presence *and* absence of existence require sufficient reasons. The asymmetry enters not in the *application* of the PSR but in the *capacity* of the options to satisfy it. Nothingness, having no properties, cannot generate or contain any reason for its own actualization. It is "explanationally inert." Existence, however, can point to a ground (e.g., a necessary being whose essence entails existence). Crucially, Leibniz argues that the *failure* of nothingness to provide a reason *is itself the reason* why existence must obtain—since the PSR must hold universally. Thus, the asymmetry lies in the ontological poverty of nothingness: it collapses under the weight of the PSR, while existence sustains it. The burden of proof is symmetrically distributed initially, but nothingness’s inherent vacuity shifts the burden decisively toward existence.

  ### The programming analogy assessed
  The uninitialized variable analogy captures *part* of Leibniz’s intuition: both "nothingness" and `null` represent states that cannot function as terminal explanations and demand resolution. However, it risks a category error. In software, `null` is a defined state within a system’s logic—an "absence" presupposing an existing framework (memory, runtime). Leibnizian nothingness is absolute non-being, lacking even the context in which "undefined" could be meaningful. The analogy illuminates the *instability* Leibniz attributes to nothingness under explanatory pressure, but obscures the metaphysical scope: Leibniz isn’t describing a system default but arguing that *total absence* is incoherent because reality must be fully grounded. The computational analogy imposes a predefined "system," whereas Leibniz’s nothingness precedes all systems. It thus misrepresents the radicality of the question but usefully models the explanatory vacuum.
