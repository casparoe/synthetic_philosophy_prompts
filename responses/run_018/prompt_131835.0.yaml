answer: |-
  Here's a straight-to-the-point pitch doc framing your idea. Keep it lean and focused:

  **Project Pitch: The Two Failures - Recasting Access Consciousness through Global Workspace Stability**

  **The Precise Question:** Does Global Workspace Theory (GWT) fundamentally conflate two distinct *types* of broadcasting failure ("reach failure" vs. "stability failure"), and does resolving this distinction provide a more precise account of when phenomenal consciousness (P-consciousness) persists independently of access consciousness (A-consciousness) than the current focus on reportability?

  **The Gap (Why Existing Stuff Doesn't Cut It):**
  1.  **Standard GWT (Dehaene & Crew):** Focuses heavily on *access* (info *getting* into the workspace) as the key to consciousness. It treats broadcasting as a somewhat monolithic "on/off" switch for consciousness. It struggles to cleanly handle cases where information demonstrably influences behavior (suggesting *some* level of processing) without full conscious access or report – it often just labels these "preconscious" without explaining *why* access failed.
  2.  **Block's A/P Distinction:** Rightly argues P-consciousness isn't *defined* by reportability/access. But his account leaves the *mechanistic relationship* between access and phenomenology under-specified. *Why* does access sometimes fail while phenomenology persists? Conversely, *when* does phenomenology actually *require* access? The reportability criterion feels like a symptom, not the core mechanism.
  3.  **The Missing Piece:** Both sides overlook a critical *internal dynamic* within GWT: the *temporal stability* of integration within the workspace. Current models don't rigorously separate the problem of information *reaching* enough modules (reach) from the problem of the integrated representation *persisting stably* long enough to support higher-order functions like report or deliberate control (stability).

  **Our Core Argument:** We propose that:
  *   **Reach Failure (e.g., Subliminal Priming):** Information never achieves sufficient broadcast *amplitude* or *distribution* to recruit a critical mass of workspace modules. *P-consciousness can survive this.* (Your gut feeling: faint qualia might exist even if the info isn't widely "known" to the system).
  *   **Stability Failure (e.g., Inattentional Blindness):** Information achieves initial broadcast/reach but fails to maintain *coherent, integrated activity* within the workspace long enough. *P-consciousness collapses under this failure.* (The fleeting glimpse swallowed by distraction likely lacks sustained phenomenal character).
  *   **The Block Redux:** This means Block's A-consciousness isn't a single thing. True "access" requires *both* sufficient reach *and* sufficient stability. P-consciousness depends primarily on *stability within the workspace* once some threshold of activation is reached. Reportability is a downstream *consequence* of stability, not the definition of access.

  **The Method (Desk-Jockey Edition - 6 Months, No Lab Coats):**
  1.  **Conceptual Surgery on GWT:** Deconstruct the "broadcasting" mechanism in key GWT texts. Explicitly define "Reach" (spatial distribution/amplitude across modules) and "Stability" (temporal persistence/integration of the global representation) as distinct potential failure points.
  2.  **Case Study Battleground:** Rigorously compare paradigmatic examples through the Reach/Stability lens:
      *   **Sublinal Priming (Reach Failure Candidate):** Info influences behavior but isn't reportable. Did it *ever* achieve stable global integration? Evidence suggests likely not (limited, fleeting activation). Argue this allows residual P-consciousness.
      *   **Inattentional Blindness (Stability Failure Candidate):** Salient stimulus isn't seen despite direct gaze. Evidence (e.g., initial neural responses) suggests it often *does* reach sensory modules robustly. Its failure is *maintaining* that representation stably integrated in the face of competing demands. Argue this disrupts P-consciousness.
      *   **Contrast Cases:** Subliminal vs. Masked Stimuli (different reach dynamics?); Attentional Blink (stability failure under temporal pressure?); Fragile/Partial Report cases.
  3.  **Model Refinement:** Generate a revised GWT-based taxonomy of states: Reach+Stability (Full A+P), Reach+No Stability (P-only?), No Reach+No Stability (Unconscious), etc. Explicitly link P-consciousness primarily to *stable* (even if initially limited) global integration.

  **What Success Looks Like (Deliverables):**
  1.  A rigorously argued conceptual paper (draft) demonstrating the necessity of separating Reach and Stability within GWT.
  2.  A novel interpretation of key empirical findings (subliminal, IB, etc.) using this framework.
  3.  A precise reformulation of Block's A/P distinction grounded in workspace *dynamics* (stability) rather than just reportability outcomes.
  4.  Clear predictions for future empirical work (e.g., neural signatures of stability failure vs. reach failure).
  5.  A stronger theoretical account of when and why P-consciousness dissociates from access/report.

  **What Kills the Project:**
  1.  **Conceptual Collapse:** If we can't find a clean, non-circular way to define "Reach" and "Stability" independently within the GWT architecture. If they bleed together completely.
  2.  **Counter-Evidence Overwhelm:** If the case studies (especially subliminal priming) provide *strong* evidence that the stimuli *never* achieve *any* kind of integrated state remotely resembling workspace activity (even unstable), undermining the "P-consciousness survives reach failure" claim.
  3.  **No Novel Insight:** If the distinction proves trivial or doesn't yield a significantly better explanation than existing accounts of the A/P boundary or GWT failures.

  **Honest 6-Month Scope Check (No Empirics):**
  *   **Tight, But Doable.** This is purely theoretical/conceptual analysis.
  *   **Phase 1 (2 Months):** Deep dive into GWT mechanics & failure modes. Precisely define Reach/Stability. Initial literature review focusing on subliminal & IB paradigms.
  *   **Phase 2 (3 Months):** Detailed case study analysis. Apply the framework. Compare/contrast with Block, Dehaene, Lamme, maybe Cohen-Dennett stability views. Develop the revised taxonomy.
  *   **Phase 3 (1 Month):** Synthesize findings, refine the A/P reformulation, outline the paper, identify key predictions for future work.
  *   **Scope Guardians:** We *will not*:
      *   Run experiments or analyze raw data.
      *   Engage in deep metaphysical debates about qualia (stay mechanistic).
      *   Attempt a comprehensive review of *all* consciousness theories (focus is GWT dynamics and Block).
      *   Solve the Hard Problem. We're mapping the relationship between access *mechanisms* and reports *of* phenomenology within a specific framework.

  **The Pitch:** Forget the stale Block-vs-Dehaene reruns. We're cracking open GWT itself to reveal a critical internal flaw: the conflation of *reach* and *stability*. This lets us reframe the access/phenomenal split not around *if* you can report it, but *how* the workspace dynamic fails. It's a sharper tool for understanding those murky edges of consciousness, grounded in the core mechanics of the dominant access theory. In 6 months, with just brains and books, we deliver a novel conceptual framework that pushes both GWT and the A/P debate forward.
