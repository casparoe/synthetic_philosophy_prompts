    - Alice says: the events were simultaneous because I saw them at the same time, and I am at rest relative to the events and at the midpoint.
    - Bob says: I saw event B at 5 seconds and event A at 10 seconds. Since I was moving toward event B and away from event A, and the light travel times are different, I conclude that event B happened before event A.

    But note: both are using the same method: they assume that light travels at speed c in all directions and that they can account for the light travel time. 

    Alice says: since I saw them at the same time and I am equidistant, they must have happened at the same time.
    Bob says: I saw event B first. But I was closer to event B when it happened? Let's see: at the time of the events (t=0), Bob was at x=0. The distance to event B is 20m, to event A is 20m. So he was equidistant. But because he was moving, he saw event B first. So he concludes that event B happened before event A.

    This shows the relativity of simultaneity.

    **Activity Outline:**

    - (5 min) Explain the setup: We have two events at the ends of the field. Alice is at the center and stationary. Bob starts at the center and moves to the right at a constant speed. We will trigger the events at t=0 (on a master clock). Both Alice and Bob have stopwatches that they start at t=0.

    - (5 min) Assign roles: 
          - Alice: stands at 0m, stopwatch in hand.
          - Bob: stands at 0m, stopwatch in hand, will walk at 1 m/s to the right.
          - Event recorder A: at -20m, with a red card.
          - Event recorder B: at 20m, with a blue card.
          - Facilitator: calls out master clock time (every second or as needed).

    - (5 min) Conduct the experiment:
          - Facilitator: "3, 2, 1, GO!" (t=0)
          - At "GO": 
              - Event recorders hold up their cards (and keep them up).
              - Alice and Bob start their stopwatches.
              - Bob starts walking to the right at 1 m/s (he can use a metronome or just walk steadily).
          - Facilitator calls out seconds: "1, 2, 3, ..."
          - Bob: when he sees event B (blue card), he stops his stopwatch and records the time (should be around 5s). Then he continues walking. When he sees event A (red card), he records the time (should be around 10s).
          - Alice: waits until she sees both events. She should see them at the same time (around 6.67s). She records the time.

    - (10 min) Gather results and discuss:
          - Alice: "I saw both events at 6.67 seconds."
          - Bob: "I saw event B at 5 seconds and event A at 10 seconds."
          - Question: Were the events simultaneous?
          - Alice: "Yes, because I saw them at the same time and I am at the midpoint."
          - Bob: "No, because I saw event B first and I was also at the midpoint when they happened."

    Now, we explain that both are correct in their own reference frames. The order of events can be relative.

    **Part 3: Extension to Block Universe (10 minutes)**
    - Now, we want to lead them to the block universe idea. We ask: "What does this say about reality? If Alice and Bob disagree about which event happened first, does that mean that one is right and the other is wrong? Or could both be right?"
    - We point out: there is no experiment they can do to prove who is right. They are both using valid procedures for their own reference frames.
    - Then we ask: "So what does this imply about the events? Do the events exist in some absolute sense? Or do they only exist when we see them?"
    - We guide them to the idea that the events are real and exist independently of when we see them. But then, since the time order is relative, it suggests that the events are just "there" in spacetime, and different observers slice spacetime differently.

    **Part 4: Debrief (30 minutes)**
    We structure the debrief around the three claims:

    Claim 1: The future is determined by the past together with the laws (determinism).
    Claim 2: Future events exist in the same tenseless sense that present ones do (eternalism/block universe).
    Claim 3: There is no objective, frame-independent fact about which distant events are happening now (relativity of simultaneity).

    We map the activity:
    - We demonstrated claim 3: Alice and Bob disagreed about whether the two events were simultaneous, and there's no way to say who is correct.
    - The activity did not address claim 1 (determinism) at all.
    - We then moved to claim 2 (eternalism) by suggesting that if the order of events is relative, then all events might be equally real.

    Now, we address your specific requests:

    1. **The master clock question:** 
          - We reveal that there was a master clock (which we used to coordinate the events). We ask: "What if there is a master clock that defines the true time? In our activity, the master clock said the events happened at the same time. Does that mean Bob is wrong?"
          - We then discuss: but how would Bob know about the master clock? He can only know by receiving a signal (at most at the speed of light). So if the master clock is hidden and cannot be used for signaling, it makes no difference to what Bob observes. And since the laws of physics (as we know them) do not allow for instantaneous signaling, the master clock is unobservable and therefore irrelevant to physics.

    2. **The cheapness of the argument:**
          - We point out that even a small relative velocity (like walking) leads to a different notion of simultaneity. We ask: "Does this mean that every time I move my finger, I change which events are 'now' for me? And if so, does that mean that the entire future and past are already real?"
          - We then challenge: "Or is there a flaw in the argument? Does the relativity of simultaneity force us to accept eternalism? Or is eternalism an additional philosophical assumption?"

    **Predictable Problems:**
    - **"It's just about light reaching our eyes":** Some will say that the disagreement is only about when we *see* the events, not when they *happen*. We must emphasize that both Alice and Bob are aware of the light travel time and are using procedures to correct for it. Alice, because she is at rest and equidistant, can correctly say that the events happened at the same time. Bob, because he was moving, must account for his motion. But even after accounting for the light travel time and his motion, he still concludes that the events happened at different times. The procedure to assign times to distant events is what leads to the relativity of simultaneity.

    - **What the activity cannot convey:** 
          - We ignored time dilation and length contraction. In reality, moving clocks run slow and moving rods contract, but at our slow speeds, these effects are negligible. The activity only shows the relativity of simultaneity.
          - The activity does not prove eternalism; it only shows that simultaneity is relative. The move to eternalism is a philosophical leap. We must be clear about that.

    **Final Outcome:** 
    We want participants to leave being able to distinguish:
    - Claim 3 (relativity of simultaneity) is what we demonstrated.
    - Claim 2 (eternalism) is a possible interpretation, but not forced by the physics.
    - Claim 1 (determinism) is not addressed by this activity.

    We also want them to see that the Rietdijk-Putnam argument tries to go from claim 3 to claim 2, but that step is not logically necessary and requires additional assumptions.

    **Revised Timeline for the 75-minute session:**

    - 0-5 min: Introduction to the activity and the setup.
    - 5-10 min: Assign roles and explain the procedure.
    - 10-20 min: Run the experiment (including walking and recording times).
    - 20-30 min: Gather results and discuss the relativity of simultaneity.
    - 30-40 min: Transition to the block universe idea and the three claims.
    - 40-70 min: Debate and debrief, including the master clock question and the cheapness of the argument.
    - 70-75 min: Wrap-up and summary of the three claims.

    **Index Cards:**
    - For event recorders: 
          - One card for event A: "At master clock time 0, hold up the red card at your position (-20m)."
          - One card for event B: "At master clock time 0, hold up the blue card at your position (20m)."
    - For Alice: 
          - "Stand at 0m. At the start signal (t=0), start your stopwatch. Watch for the events (red and blue cards). When you see an event, record the time on your stopwatch. Note: you are not moving."
    - For Bob: 
          - "Stand at 0m. At the start signal (t=0), start your stopwatch and start walking to the right at 1 m/s (steady pace). Watch for the events. When you see an event, record the time and which event it is (red or blue)."

    This activity should meet your constraints: it requires no prior formalism, uses human-scale motions, and allows participants to discover the relativity of simultaneity. The debrief then explicitly separates the three claims and stages the resistance to the jump to eternalism.
answer: |-
  ### Runnable Activity: "Simultaneity Sprint"

  #### **Concept**
  Slow the speed of light to walking pace (∼1.5 m/s) using human messengers. Participants discover that observers in motion disagree on "what's happening now" at distant locations, revealing relativity of simultaneity. The activity avoids upfront explanations and lets students generate the block universe inference themselves.

  ---

  ### **Setup & Roles**
  **Location:** Football field (straight 100m stretch).  
  **Materials:**  
  - Cones (mark positions), measuring tape, 2 whistles, index cards, phone stopwatches.  
  - Signs: "Event A" (at 30m), "Event B" (at 60m).  
  - 4 messenger vests (or colored shirts).  

  **Roles (for 14 students):**  
  1. **Alice (Observer 1):** Stands at 0m. Records events she considers "now."  
  2. **Bob (Observer 2):** Walks at 0.5 m/s *away* from Event A/B (e.g., from 0m toward 90m).  
  3. **Messengers (4 runners):** Always move at 1.5 m/s (speed of light).  
  4. **Event Captains (2):** At Event A (30m) and Event B (60m). Trigger "events" (e.g., wave a flag) when instructed.  
  5. **Timekeepers (2):** Track master clock (hidden from Alice/Bob).  
  6. **Scribes (2):** Record Alice’s/Bob’s conclusions on a whiteboard.  
  7. **Others:** Distribute materials, enforce speed limits, or play auxiliary events.  

  **Prep (10 mins):**  
  - Place cones: Start (0m), Event A (30m), Event B (60m), End (90m).  
  - Give messengers index cards: "Always move at 1.5 m/s. When you reach an event, ask if it happened. If YES, bring the event time to your observer."  
  - Give Alice/Bob index cards: "Send messengers to Events A/B to find out what’s happening NOW at your location. Use a messenger to query each event."  

  ---

  ### **Rules & Timeline (75 mins total)**
  **Goal:** Alice and Bob each determine what is "happening now" at Events A and B from their perspective.  
  **Speed of Light:** Fixed at 1.5 m/s (messengers).  
  **Master Clock:** Hidden; events occur at predefined times (e.g., Event A at t=0s, Event B at t=10s).  

  #### **Phase 1: Discover Relativity of Simultaneity (40 mins)**  
  1. **Briefing (5 mins):**  
     - *Facilitator:* "Alice and Bob, send messengers to Events A and B to find out what’s happening *right now* at those locations. Everyone else, follow your cards."  
     - No theory explained—only role instructions.  

  2. **Activity (20 mins):**  
     - **t=0 (Start):**  
       - Event A occurs (Captain waves flag).  
       - Alice sends Messenger 1 to Event A.  
       - Bob starts walking (0.5 m/s) away from events. Sends Messenger 2 to Event A.  
     - **t=10s (Hidden):**  
       - Event B occurs (Captain waves flag).  
     - **t=20s (approx):**  
       - Messenger 1 reaches Event A (30m ÷ 1.5 m/s = 20s). Asks: "Is it happening now?"  
       - Event Captain: "It happened at t=0." Writes time on card. Messenger 1 returns to Alice (40s round trip).  
       - Bob’s Messenger 2: Bob has moved to 10m (0.5 m/s × 20s). Distance to Event A is now 20m. Messenger 2 arrives at t=20s + (20m ÷ 1.5 m/s) ≈ 33s. Gets reply: "Happened at t=0."  
     - **Alice/Bob send messengers to Event B:**  
       - Alice’s Messenger 3 to Event B (60m): Arrives at t=40s. Reply: "Happened at t=10."  
       - Bob’s Messenger 4 to Event B: At send time, Bob is at 15m. Distance to Event B ≈ 45m. Arrives at t=15s + (45m ÷ 1.5 m/s) = 45s. Reply: "Happened at t=10."  

  3. **Observers Report (5 mins):**  
     - Alice: "Event A: happening now at t=0. Event B: happening now at t=10."  
     - Bob: "Event A: happening now at t=0. Event B: happening now at t=10."  
     - *Scribes note:* Both agree? (They shouldn’t yet—repeat if needed).  

  4. **Repeat with Relative Motion (10 mins):**  
     - *Crucial twist:* Bob sends a messenger to Event B *while moving*.  
     - **t=5s (Bob’s clock):** Bob (now at 2.5m) sends Messenger 4 to Event B (distance 57.5m).  
       - Arrival: 57.5m ÷ 1.5 m/s ≈ 38s → t=43s master time.  
       - Event B happened at t=10, so Captain replies: "Happened at t=10."  
     - Bob’s conclusion: "Event B happening now (at my t=5s) at t=10."  
     - Alice repeats: "Event B happening now at t=10."  
     - *Reveal:* Alice thinks Event B happens at her t=10s. Bob thinks it happens at his t=5s.  
     - **Scribes note disagreement:** "Alice: Event B ‘now’ at t=10. Bob: Event B ‘now’ at t=5."  

  #### **Phase 2: Inference & Block Universe (15 mins)**  
  1. **Guided Questions (5 mins):**  
     - "Can both Alice and Bob be correct about what’s ‘now’ at Event B? Why?"  
     - "Is there a way to prove who is right? What if we used faster messengers?" (No—speed of light is max).  
     - "If neither is wrong, what does that imply about Event B?"  

  2. **Group Conclusion (10 mins):**  
     - Students realize: Event B exists independently of observers.  
     - *Facilitator:* "So is Event B ‘already real’ for Alice at t=0? For Bob at t=0?"  
     - Natural inference: Past, present, future events equally real → Block universe. *Name "eternalism" only after they articulate this.*  

  ---

  ### **Debrief: Separating the Three Claims (20 mins)**  
  **Map to activity:**  
  1. **Claim 3 (No objective "now"):**  
     - *Activity moment:* Alice and Bob’s conflicting "now" for Event B.  
     - *Key point:* Physics forces this—messenger speed limits prevent consensus.  

  2. **Claim 2 (Future/past equally real):**  
     - *Activity moment:* Students infer Event B is "fixed" even before light arrives.  
     - *Key point:* This is metaphysics. Physics shows *order* is relative, not *existence*.  

  3. **Claim 1 (Determinism):**  
     - *Not addressed.* Activity shows events are fixed in spacetime, but says nothing about cause/effect.  

  **Staging Resistance:**  
  1. **Master Clock Reveal (5 mins):**  
     - "What if a hidden master clock defined true simultaneity (e.g., Event A at t=0, B at t=10)?"  
     - Debate: "Would this change what Alice/Bob observe?" (No—they can’t access it faster than light.)  
     - *Point:* Physics only cares about observable reality. If something is undetectable, it’s irrelevant.  

  2. **Cheap Argument? (5 mins):**  
     - "Bob moved at 0.5 m/s—a slow walk. Does this tiny motion *really* rewrite reality?"  
     - Discuss:  
       - *Virtue:* Conclusion follows from basic physics (any motion breaks absolute simultaneity).  
       - *Flaw:* "Reality" isn’t proven—just that "now" is observer-dependent. Eternalism is an *interpretation*.  
     - *Key:* Relativity doesn’t *force* eternalism; it just makes "flowing time" incoherent.  

  **Predictable Problems & Fixes:**  
  - **"It’s just light/illusion!"**  
    - *Response:* "Alice/Bob *corrected* for light travel time. Their disagreement is about the event’s time, not when they saw it." Repeat Phase 1 with emphasis on the correction step.  
  - **What the activity can’t convey:**  
    - *Spacetime geometry:* The "tilt" of simultaneity slices. Verbally sketch Minkowski diagrams post-activity.  
    - *Causality:* Light cones are untouched—no FTL signals possible. Stress that disagreement only happens for *spacelike-separated* events.  

  **Outcome:**  
  Students leave able to say:  
  - "I accept Claim 3 (relativity of simultaneity) because we saw it."  
  - "Claim 2 (eternalism) is plausible but optional—it explains the disagreement."  
  - "Claim 1 (determinism) wasn’t tested; it’s separate."  

  **Why this works:**  
  - Minimal prep, maximal discovery.  
  - Human-scale motion makes abstract concepts visceral.  
  - Distills the Rietdijk-Putnam argument to its physical core (Claim 3 → 2).  
  - Explicitly separates physics from metaphysics.  

  Let me know if you'd adjust any parameters (distances, speeds) for your field!
