  Epistemic necessity: why must physics be deterministic? Follow-up if quantum mechanics shows science can work without it, undermining her claim.

  Science vs. ontology: how does methodological free will not imply ontological openness? Follow-up: if scientists act as if free, does that suggest reality isn't fully determined?

