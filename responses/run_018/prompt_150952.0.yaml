prompt: |-
  hey, i'm a novelist drafting a dialouge-heavy book and i want to check whether my characters' moral talk actually hangs together if you read it through an expressivist lens—like, moral sentences express attitudes not facts, and then you hit the Frege-Geach embedding problem when those sentences get stuck inside conditionals or negations. i need this turned into an actual procedre my editor (just me, honestly) can run on any scene without a philosophy degree. make it a checklist: step one, identify the speech act; step two, check if it's embedded; step three, apply the consistency test; and flag exactly where i have to make a judgment call instead of following a rule. the hard cases i keep occuring in my draft are moral parentheses—where a character quotes someone else's moral claim inside their own reasoning, like "if what she said—'stealing is wrong'—holds, then..."—and counterfactual moral planning, where a character figures out obligations in worlds where the wrong act turned out right. please apply the procedre to these three lines:

  A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."
  B. "Either torture is wrong or i've completely lost my moral compass."
  C. "She doesn't believe bribery is wrong, yet she refuses to take the money."

  for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway because real people talk like that—identify which one and say what consistency i'm sacrificing. also be honest about what the checklist can't do: can it tell sincere from ironic moral talk? can it handle sentences that mix description and evaluation, like "the wrongness of the act sparked the riot"? and where does it just fail because voice matters more than logical form? i need this to take ten minutes max per scene, and i'm the only person signing off.
reasoning: |-
  Okay, let me tackle this novelist's request. They're working on dialogue-heavy fiction and want to check moral arguments through an expressivist lens, specifically dealing with Frege-Geach embedding problems. The core challenge is translating complex philosophy into a practical editor's checklist.

  First, I need to design a three-step procedure that's accessible without philosophy training. The steps should be: identify speech acts, check for embedding, then apply a consistency test. The novelist specifically mentioned two tricky cases - moral parentheses and counterfactual planning - so the checklist must address those.

  Looking at their examples:
  For A ("Murder is wrong..."), this is a classic modus ponens structure that expressivists struggle with because the embedded "murder is wrong" in the conditional can't carry the same expressive force. 
  For B ("Either torture is wrong..."), the disjunction creates problems - how can you express disapproval through an "or" statement? 
  For C ("She doesn't believe..."), this mixes belief attribution with expressive language, which might actually work better in expressivism.

  The novelist also wants realism acknowledged - sometimes technically incoherent dialogue should stay because people actually talk that way. Example B is perfect for this; real people use disjunctive moral claims even if they're expressively messy.

  I should clarify the checklist's limits: it can't detect irony, struggles with mixed descriptive/evaluative language ("the wrongness sparked the riot"), and fails when voice overrides logic. These need clear flags in the procedure.

  The execution time is crucial - 10 minutes per scene max. So I'll keep explanations concise, focus on the red flags, and provide quick-reference symbols. For their examples, I'll show exactly where judgment calls happen (like embedded parentheses) and where to override the checklist for realism.
answer: |-
  Here's your expressivist dialogue audit checklist - designed for 10-minute scene scans, flagging where philosophy meets messy human speech:

  **The Expressivist Dialogue Audit Checklist**

  1.  **Identify the Speech Act:**
      *   What is the character *doing* with this moral sentence?
      *   **Boo/Hooray?** (Directly expressing disapproval/approval: "Murder is wrong!", "Honesty is good!")
      *   **Belief Report?** (Describing someone's attitude: "She thinks bribery is wrong.")
      *   **Other?** (Asking, commanding, wondering, hypothesizing, quoting, being ironic?)
      *   *❗ Judgment Call:* Sincerity, irony, and mixed acts (description + evaluation) are hard. Flag them.

  2.  **Check for Embedding:**
      *   Is the moral claim standing alone, or is it inside another logical structure?
      *   **Standalone:** "Stealing is wrong." (Pure expression - easy for expressivism).
      *   **Embedded:** Look for: `not`, `if...then...`, `and`, `or`, `either...or...`, `believes that...`, `says that...`, `might be...`, `in a world where...`. Also watch for "moral parentheses" (`"if what she said—'stealing is wrong'—is true..."`).
      *   *🔧 Rule:* Flag *all* embeddings. They're the problem zone for Frege-Geach.

  3.  **Apply the Consistency Test:**
      *   Can the character consistently hold the *attitudes* expressed throughout the embedded structure?
      *   **Key Question:** If the moral term (`wrong`, `good`, `should`) expresses an attitude (Boo!/Hooray!), does that attitude "fit" logically within the larger statement?
      *   **Test:** Try replacing the moral term with its core attitude *meaning* and see if the logic feels strained or nonsensical.
          *   E.g., Replace "X is wrong" with "Boo! X!".
          *   Replace "should do Y" with "Hooray! Doing Y!".
      *   *❗ Judgment Call:* Does the attitude-logic hold? Is the character potentially confused, or is the expression just complex? Flag if replacement feels forced.

  **Applying the Checklist to Your Examples:**

  *   **A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."**
      *   1.  **Speech Act:** Assertion (Boo! Murder!) + Conditional Assertion.
      *   2.  **Embedding:** YES. Moral claim "murder is wrong" embedded in an `if...then...` conditional. Also "should" embedded.
      *   3.  **Consistency Test:** Replace: **"Boo! Murder!, and if Boo! Murder! then Hooray! The judge halting the trial!"**
          *   **Problem:** The `if...then...` tries to use the *attitude* "Boo! Murder!" as a *premise* in a logical inference. Expressivism struggles to explain how an attitude *alone* logically entails another attitude ("Hooray! Halting!") in this way. This is the *core* Frege-Geach embedding problem.
          *   *❗ Judgment Call:* Technically problematic for pure expressivism. Does the character *sound* like they are reasoning logically, or stating a strong conviction? Might be acceptable as passionate rhetoric.

  *   **B. "Either torture is wrong or I've completely lost my moral compass."**
      *   1.  **Speech Act:** Assertion using disjunction (`or`).
      *   2.  **Embedding:** YES. Moral claim "torture is wrong" is one disjunct.
      *   3.  **Consistency Test:** Replace: **"Either Boo! Torture! or I've completely lost my moral compass."**
          *   **Problem:** What does "either Boo! or..." mean? Expressivism struggles with logically combining attitudes using operators like `or`. It's unclear how the *attitude* "Boo! Torture!" functions as one side of a logical disjunction.
          *   **✅ KEEP IT ANYWAY:** This is **the one you should probably keep**. Real people *do* talk like this. They express a strong commitment: rejecting torture is so core to their moral sense that doubting it feels like losing their compass entirely. It's more about the *strength* and *centrality* of the attitude than strict logic. You're sacrificing *logical coherence of the disjunction structure* for *psychological realism* and *rhetorical force*.

  *   **C. "She doesn't believe bribery is wrong, yet she refuses to take the money."**
      *   1.  **Speech Act:** Belief report ("She doesn't believe...") + Report of action ("she refuses...").
      *   2.  **Embedding:** YES. Moral claim "bribery is wrong" embedded inside "believes that...".
      *   3.  **Consistency Test:** Replace: **"She doesn't have the attitude Boo! Bribery!, yet she refuses to take the money."**
          *   **Analysis:** This works well for expressivism! It reports the *absence* of a specific disapproval attitude ("Boo! Bribery!") while describing an action. There's no logical inconsistency here. People act against their stated (or even conscious) beliefs/attitudes all the time due to habit, fear, other values, etc. The puzzle is psychological/situational, not logical.
          *   *🔧 Rule:* Belief reports about moral attitudes are generally unproblematic for expressivism.

  **What the Checklist CAN'T Do (Be Honest):**

  1.  **Sincere vs. Ironic:** ❌ Nope. "Wow, *that* was ethical!" could be sincere praise or vicious sarcasm. The checklist flags moral terms, *you* judge tone/context/character voice.
  2.  **Mixed Description/Evaluation:** ❌ Struggles badly. "The wrongness of the act sparked the riot."
      *   Step 1: Flag - mixes description ("sparked the riot") and evaluation ("wrongness" ≈ "Boo!-ness").
      *   Step 3: Replacing "The Boo!-ness of the act sparked the riot" feels nonsensical. This is a *hard* case where the moral term seems to refer to a *property* ("wrongness") that caused something, which pure expressivism denies exists. *❗ Judgment Call:* Is this the *narrator* describing or a *character* speaking? Does it feel natural in context? You might need to rephrase ("People were outraged by the act, sparking the riot") or accept the slight philosophical tension for stylistic effect.
  3.  **Voice > Logic:** ✅ **This is CRUCIAL.** The checklist finds *potential logical snags* under expressivism. It **does not** tell you to *fix* them automatically. If a line perfectly captures a character's voice, their confusion, their passionate but sloppy reasoning, or just sounds beautifully human *despite* the technical incoherence (like Example B), **KEEP IT**. The checklist flags *where* the snag is so you *know* you're making that artistic choice. Logic serves the story, not the other way around.
  4.  **Solving Frege-Geach:** ❌ Obviously not. It highlights *where* the problem arises in your dialogue so you can assess if it *matters* for the character/scene.
  5.  **Complex Meta-Ethics:** ❌ It won't handle nuanced discussions about relativism, error theory, or hybrid expressivism. It's a basic "attitude embedding" sniffer.

  **In Summary:** Run the checklist. Flag embeddings and mixed acts. Do the attitude-replacement test. See where it feels strained. For those spots (especially conditionals like A, disjunctions like B, and mixed sentences), **ask yourself:** "Does this sound like what this character would *actually* say here, even if it's slightly logically messy? Does it serve the voice, emotion, or plot?" If yes, leave it (especially for B's type of passionate disjunction). If it sounds jarring or unintentionally confusing *in context*, tweak it. The goal is awareness, not sterile perfection. Happy editing!
