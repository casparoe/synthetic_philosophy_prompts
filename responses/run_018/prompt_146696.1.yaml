  I am writing study materials for my graduate seminar in Philosophy of Economics, and I want a practice exam that forces students to apply Keynes's distinction between the probability of a belief and the weight of its supporting argument, rather than merely summarizing the distinction. Please construct the following.

  First, draft an exam question suitable for a 45-minute essay. The scenario should involve a national committee deciding whether to fund an unproven carbon-capture technology. The available climate models assign a high subjective probability to success, but the weight of argument is low because the feedback mechanisms are structurally opaque. Inject this specific twist: one committee member proposes that the weight itself should be scaled by the social cost of being wrong, yielding what she terms a risk-adjusted weight. The student should be asked to determine whether this maneuver remains within Keynes's framework or instead collapses Keynesian uncertainty back into standard expected-utility reasoning.

  Second, provide a model answer of roughly 600 words that demonstrates the correct reasoning, addresses the twist, and shows where the framework breaks down.

  Third, supply a marking scheme totaling 20 points, organized around five must-hit analytical moves. For each move, list the points, the substance required, and the typical error that costs marks.

  Please organize your response in exactly these sections:
  1. Exam Question (approximately 250 words)
  2. Model Answer (approximately 600 words)
  3. Marking Scheme (five bulleted moves with allocations and common failures)
