answer: |-
  Here’s a structured 90-minute teaching plan focused on Hofstadter’s frame/outer/inner messages, designed for non-specialists with zero formal logic background:

  **Dependency Order of Introduction**  
  *(Total: 15 mins)*  
  1. **Start with Inner Message** (5 mins):  
     - Define as the "apparent content" (what first meets the eye/ear).  
     - *Why first?* Avoids conflating it with "hidden meaning." Participants naturally start here.  

  2. **Introduce Frame Message** (5 mins):  
     - Define as the "instruction manual" for decoding (e.g., "This is not English; look for a key").  
     - *Why before Outer?* Establishes that decoding rules are *separate* from content. Prevents misattribution to "author’s secret intent."  

  3. **Reveal Outer Message** (5 mins):  
     - Define as the *act of decoding itself*: the meaning *generated* by following the frame’s instructions.  
     - *Why last?* Outer relies on executing the frame’s rules to transform the inner message.  

  ---

  **Core Concrete Example: "The Locked Box"**  
  *(Total: 35 mins)*  
  - **Physical Props:** A locked box with a note taped outside.  
  - **Inner Message** (on note): *"3-15-18-18-25-19-20-1-14-4"*  
  - **Frame Message** (on same note): *"Add 1 to each number to read me."*  
  - **Outer Message Reveal Process**:  
    1. Participants decode numbers (3→D, 15→O, etc.) to get "DONOTSTAND" → "DO NOT STAND."  
    2. **Outer Message**: The emergent warning ("Do not stand [here]") created *only* by applying the frame’s rule.  
    3. **Twist**: Box contains a second note: *"Ignore previous frame. Subtract 1: 2-14-17-17-24-18-19-0-13-3."* Decodes to "CONGRATULATIONS."  
     - *Why this works*: Frame instructions are explicit, outer meaning requires active decoding, and the twist shows frame dependency.  

  ---

  **Anticipated Misconceptions & Defusal Points**  
  1. **"Frame = Author’s Secret Intent"**  
     - *When*: During frame message introduction.  
     - **Defusal**: *"The frame is a structural rule, not a mind-read. The box’s frame changed, but there’s no ‘author’—just rules."*  

  2. **"Inner Message is Just Incomplete"**  
     - *When*: After decoding the first note.  
     - **Defusal**: *"If you saw ‘3-15-18’ without the frame, could you guess ‘DO’? No—it’s not implicit; it’s inert without the frame."*  

  3. **"Outer Message is the ‘Real’ Hidden Meaning"**  
     - *When*: After revealing "DO NOT STAND."  
     - **Defusal**: *"The warning isn’t ‘hidden’ in the numbers. It exists *because* you executed the +1 rule. Change the frame (like subtract 1), and it vanishes."*  

  ---

  **Diagnostic Check for Understanding**  
  - **Activity**: Give a new message: *"Shift letters back by 1: CVSDF"*  
  - **Check for**:  
    - Can they identify frame? ("Shift back by 1")  
    - Inner? ("CVSDF")  
    - Outer? (Decodes to "BURE") → "BURE?" → *Failure if they stop here.*  
  - **Critical Insight**: They must recognize the frame is incomplete (no alphabet specified). If they suggest solutions ("Assume A=1?"), they grasp that meaning *depends* on the frame’s clarity.  

  ---

  **Out-of-Scope Bracketing**  
  *(Explicitly state upfront and reinforce post-activity)*  
  1. **Self-Reference**:  
     - *"We won’t discuss messages that refer to *themselves* (e.g., ‘This sentence is false’). Why? Self-reference blurs the frame/inner boundary and distracts from decoding mechanics."*  

  2. **Strange Loops**:  
     - *"We’re avoiding ‘loops’ where layers infinitely nest (like Escher’s art). Why? Today’s distinction requires clear separation of levels. Loops make them collapse."*  

  3. **Consciousness/AI Implications**:  
     - *"Hofstadter connects this to minds and AI, but that’s not today’s focus. Why? Adding ‘who built the frame?’ shifts us to intent, not structure."*  

  ---

  **Timing Flow**  
  - Intro & Definitions (15 mins)  
  - Locked Box Demo (35 mins)  
  - Misconception Q&A (15 mins)  
  - Diagnostic Check & Wrap-up (20 mins)  
  - Buffer (5 mins)  

  **Key Pedagogy**: Use physical decoding (writing numbers/letters) to concretize abstract levels. Emphasize that outer messages are *ephemeral outcomes of process*, not "buried treasure."
