  Okay, the user is asking me to design a classroom activity for an advanced philosophy seminar about decision theory. They want students to experience why people violate the independence axiom in decision-making - not just as a bias but as a structural tension between different evaluation approaches. 

  Hmm, this is quite specific and sophisticated. The user clearly understands decision theory deeply - they're using terms like "ex-ante maximization" and "scenario-integrated evaluation" precisely. Probably a philosophy professor preparing for class. 

  The key challenge they're posing is making abstract decision theory tangible through role-play. They want students to feel the tension before labeling it. That's smart pedagogy - experience before terminology. 

  Let me unpack their three-phase structure. Phase 1 needs to recreate the Allais paradox pattern but with social framing. Instead of personal money, it should feel like allocating collective resources where decisions carry moral weight. Interesting twist - making it about "responsibility" rather than gain. 

  For Phase 2, I like the Defender/Auditor setup. The vocabulary restriction is crucial: forcing students to either betray their intuition with EU language or openly reject independence with scenario-talk. That rationality bonus pool is devilish - it makes the cost of coherence visceral. 

  Phase 3's physical card swap is genius. Making them literally cut out the common consequence makes the independence violation concrete. And demanding they draft a formal modified axiom pushes them from intuition to precision. 

  User anticipates two pitfalls: students confusing scenario-evaluation with risk aversion, and the activity's inability to capture cardinal utility. I'll build explicit countermeasures - a facilitator prompt for the first, and a debrief note for the second. 

  Materials need to be dead simple since it's one session. Just printed choice sheets, role cards, and gamble cards. No tech. Payoffs in points to keep it clean. 

  The debrief structure is clear: map each phase to theory concepts but withhold names until the end. Must resist citing Allais until the final minutes - that's hard for academics but pedagogically sound. 

  Biggest design headache: making Phase 1 choices predictably pattern into the classic violation. Need to calibrate stakes so certainty effects emerge naturally in the social framing. Maybe make the "safe" option prevent a disastrous outcome? 

  Also wrestling with Phase 2's coercion mechanism. If Defenders pick EU talk, they must condemn their own choice - that's emotionally tough. But that discomfort is the point. The rationality bonus should feel tantalizing but unattainable without self-betrayal. 

  For Phase 3's axiom drafting, I'll suggest a "preference reversal threshold" - essentially allowing violations only when the common consequence changes the narrative weight. But students should invent their own version. 

  User's silent need: they want this to unsettle students' faith in standard EU theory. Not to reject rationality, but to expand it. So the tone must be constructive - "here's what EU misses" not "EU is dumb". 

  Final touch: emphasizing this can't replicate real utility measurement. Must flag that limitation upfront so students don't overgeneralize. The debrief will contextualize.
answer: |-
  Here’s a self-contained classroom activity designed to meet your specifications:

  ---

  ### **Activity: The Paradox of Choice Under Shared Fate**  
  *Time: 75 min | Participants: 18 advanced students*  

  **Materials**  
  - Printed **Choice Sheets** (Phase 1)  
  - Role cards: 9x **Defender**, 9x **Auditor** (Phase 2)  
  - **Gamble Cards** (2 sets/pair, Phase 3)  
  - Scissors, tape, whiteboard  

  ---

  ### **Phase 1: Allocation Under Uncertainty (20 min)**  
  **Framing**: *“Your group represents a council allocating 100 lifesaving resource units for a community facing two crises. Allocations are anonymous but final.”*  

  **Choice 1** (Common-Consequence Pattern):  
  - **Option A**: *Save 30 units with certainty.*  
  - **Option B**: *80% chance to save 40 units, 20% chance to save 0 units.*  

  **Choice 2**:  
  - **Option C**: *10% chance to save 30 units, 90% to save 0 units.*  
  - **Option D**: *8% chance to save 40 units, 92% to save 0 units.*  

  > *Procedure*:  
  > 1. Students privately allocate 100 units between Choice 1 (A/B) and Choice 2 (C/D).  
  > 2. Collect sheets. *Predictable pattern*: Most will choose A (safe) > B and D (risky) > C.  

  ---

  ### **Phase 2: Defense & Audit (25 min)**  
  **Roles**: Randomly assign Defenders/Auditors.  
  **Rules**:  
  - **Defenders** justify choices to an Auditor using **one vocabulary**:  
    - **Vocabulary 1 (EU)**: *Only discuss probabilities and outcomes in isolation.*  
    - **Vocabulary 2 (Scenario)**: *Describe outcomes as part of a narrative (“If we chose B and saved 0, we’d forever regret not taking A…”).*  
  - **Auditors** award **0–3 coherence points** per defense.  
  - **Critical constraint**: EU defenders *must apply the same logic to both choices* (e.g., “A > B implies C > D” → condemning their own D > C).  
  - **Rationality Bonus**: Defenders preserving independence (e.g., A>B *and* C>D) get +5 points.  

  > *Facilitator Prompt*:  
  > *“If a Defender says ‘I avoided B because 20% ruin is unacceptable’, ask: Is this about statistical variance or the story of responsibility?”*  

  ---

  ### **Phase 3: The Substitution Experiment (20 min)**  
  **Task**: Groups receive cards representing Choice 1:  
  - **Original**: A = [Save 30], B = [80%:40, 20%:0]  
  - **Revised**: Excise the "20%:0" from B and replace with "20%: *Save 25*" (matching A’s consequence).  

  **Observation**:  
  - Most groups’ preference flips to B > A after substitution.  
  - **Deliberation**: *“Draft a new axiom permitting your Phase 1 choices but forbidding intransitivity. Use formal conditions: ‘Preference between X and Y is preserved if...’”*  
    > *Example student output*:  
    > *“Independence holds unless the common consequence alters the narrative accountability of outcomes.”*  

  ---

  ### **Debrief (10 min)**  
  1. **Map Phase 1**: Reveal the common-consequence structure. *“When the ‘0-unit’ outcome disappeared, your risk tolerance reversed.”*  
  2. **Phase 2 Conflict**: *“EU forced you to choose between coherence and accountability. Scenario-talk let you articulate why ‘saving 30 for sure’ isn’t just about the number.”*  
  3. **Phase 3 Repair**: *“You crafted ‘context-sensitive independence’—a structural fix acknowledging outcomes aren’t isolable.”*  
  4. **Limitations**: *“This exercise couldn’t measure utility differences across contexts (e.g., is ‘regret’ quantifiable?). We’ll address that theoretically next week.”*  
  5. **Final Reveal**: *“Today’s tension mirrors the Allais Paradox. Readings on consequentialism vs. narrative ethics will be posted.”*  

  ---

  ### **Predictable Challenges & Mitigation**  
  - **Risk vs. Narrative Confusion**:  
    - *Intervention*: “When you say ‘Option B is too risky’, is it the *spread of outcomes* you dislike, or the *story* of causing total loss?”  
  - **Cardinal Utility Gap**:  
    - *Explicit Note*: “Points are ordinal. Real-world ‘accountability weight’ requires utility calibration we’ll discuss.”  
  - **Auditor Bias**:  
    - *Rule*: Auditors must cite *specific vocabulary violations* to deduct points.  

  This design forces lived tension between coherence and contextual evaluation, using social stakes to intensify accountability. The physical substitution in Phase 3 makes the axiom violation viscerally tangible before formalizing it.
