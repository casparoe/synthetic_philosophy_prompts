  Hmm, the user's framing suggests they've already grappled with classics like Benatar's asymmetry and the reproductive paradoxes. Probably an academic or advanced autodidact preparing for original work. The explicit ban on citations means they want distilled philosophy, not lit reviews. 

  Core tensions to flag immediately: the vise between preventing agony now versus avoiding future suffering traps. If we give water to a dying deer, we enable more deer suffering later. But refusing feels monstrous. Also the measurement nightmare - is preventing a child's torture really "equal" to sparing a million mild headaches? Classic NU collapses there. 

  Wild animal suffering introduces another layer: is letting predators starve to prevent prey suffering obligatory? But ecosystems aren't moral agents. And what counts as "action" versus "omission" here gets metaphysically hairy. 

  For the desiderata list, I'll structure: 
  First, case-based requirements - the reproductive asymmetry (non-negotiable), wild animal intervention puzzles (contentious), and intergenerational shadows (where most theories implode). 
  Then conceptual distinctions like suffering intensity vs. moral urgency - a migraine vs cancer pain might have same hedonic weight but different moral pull. 
  Decision theory constraints matter - can't violate stochastic dominance when comparing suffering distributions. 

  Biggest conflict: lexical thresholds versus transitivity. If we say any torture outweighs any number of headaches, we get intransitive choices. But without thresholds, we get paralyzed by dust speck arguments. 

  Scoring the three frameworks: 
  Classic NU fails catastrophically on reproductive cases and thresholds. 
  Lexical views handle torture vs headaches but explode on intergenerational tradeoffs. 
  Threshold-sensitive models might balance best but need careful calibration. 

  User likely wants this map to stress-test their own view. Must avoid advocacy - just expose fault lines.
answer: |-
  Here is a complete specification of desiderata for an adequate suffering-focused axiology, structured as requested:

  ### Core Tensions
  1.  **Present Suffering vs. Future Suffering Expansion:** Relieving suffering now may increase the number of future sufferers (e.g., medical aid enabling reproduction).
  2.  **Threshold Paradox:** How to avoid absurd conclusions where preventing immense suffering is outweighed by preventing vast numbers of mild pains?
  3.  **Non-Identity Problem:** Actions affecting who comes to exist complicate obligations to potential future sufferers.
  4.  **Epistemic Limits:** Acting on uncertain predictions of long-term consequences vs. concrete present suffering.

  ---

  ### I. Cases an Adequate Framework Must Handle Correctly
  *(Motivating Cases & Status)*

  1.  **Beneficence/Non-Maleficence Asymmetry:**  
      *   **Case:** Choosing not to create a happy life is permissible; creating a suffering life is impermissible. Preventing suffering outweighs creating happiness.  
      *   **Status:** Non-negotiable core of NU/suffering-focus. Motivated by the intuition that suffering has greater moral weight than happiness.
  2.  **Wild-Animal Suffering (WAS) Intervention:**  
      *   **Case:** Obligations (if any) to reduce suffering in nature (predation, disease, starvation). Must address whether intervention (e.g., painless sterilization, predator elimination) is required, permissible, or forbidden.  
      *   **Status:** Contentious but necessary. Motivated by the scale of suffering in nature. Non-interventionist views exist but must justify why WAS doesn't demand action.
  3.  **The Intergenerational Shadow:**  
      *   **Case:** Reducing suffering today (e.g., curing a disease) allows a population to grow, leading to vastly more suffering in the long term. Obligation to prevent this expansion?  
      *   **Status:** Non-negotiable challenge. Motivated by demographic dynamics and long-term consequences. Framework must resolve whether reducing present suffering can be obligatory *even if* it increases future suffering potential.
  4.  **The Repugnant Conclusion for Suffering:**  
      *   **Case:** Is a world with a vast number of beings experiencing *barely tolerable* suffering worse than a world with fewer beings experiencing *extreme agony*? Framework must avoid implying that the latter is preferable.  
      *   **Status:** Non-negotiable constraint. Motivated by the need to respect the intensity of suffering.
  5.  **The Necessity of Prevention:**  
      *   **Case:** Preventing suffering is more urgent/morally important than alleviating existing suffering of equal intensity and duration.  
      *   **Status:** Common NU preference, but not universally held. Motivated by the asymmetry and the finality of avoided suffering vs. endured suffering.

  ### II. Distinctions That Must Be Preserved
  *(Conceptual Pressure)*

  1.  **Intensity vs. Moral Urgency:**  
      *   **Distinction:** The raw unpleasantness of an experience vs. the moral priority for intervention (e.g., preventing torture vs. preventing minor itches).  
      *   **Pressure:** Avoids absurdities (e.g., vast numbers of mild pains outweighing intense torture) and reflects moral intuition.
  2.  **Direct Harm vs. Ecological Omission:**  
      *   **Distinction:** Actively causing harm (e.g., injuring an animal) vs. allowing harm to occur through non-intervention in natural processes (e.g., not stopping a predator).  
      *   **Pressure:** Crucial for addressing WAS and intergenerational cases. Must clarify duties regarding acts vs. "allowances" within complex systems.
  3.  **Actual Sufferers vs. Merely Potential Sufferers:**  
      *   **Distinction:** Moral obligations to beings who currently exist vs. beings who might exist in the future.  
      *   **Pressure:** Central to the Non-Identity Problem and Intergenerational Shadow. Affects obligations regarding procreation and long-term interventions.
  4.  **Suffering vs. Absence of Well-Being:**  
      *   **Distinction:** The presence of negative experiences vs. the mere lack of positive experiences.  
      *   **Pressure:** Core NU asymmetry; lacking happiness is not bad *per se*, but suffering is intrinsically bad. Must prevent conflation.

  ### III. Consistency Constraints
  *(Source of Constraint)*

  1.  **Avoidance of Strictly Dominated Outcomes:**  
      *   **Constraint:** If Outcome A contains less suffering for *every* individual than Outcome B (and same individuals exist), A must be preferred.  
      *   **Source:** Basic rationality (Decision Theory).
  2.  **Transitivity:**  
      *   **Constraint:** If A is better than B, and B is better than C, then A must be better than C.  
      *   **Source:** Axiological logic/Decision Theory. Essential for coherent choice.
  3.  **Non-Implosion under Uncertainty:**  
      *   **Constraint:** Framework must provide guidance under risk/uncertainty without collapsing into paralysis or extreme risk aversion for all potential suffering.  
      *   **Source:** Practical applicability in the real world.
  4.  **Avoidance of the "Killing Paradox":**  
      *   **Constraint:** Must not imply it is generally obligatory to painlessly kill sentient beings to prevent their future suffering unless under conditions of extreme, unalterable agony.  
      *   **Source:** Moral intuition and coherence with valuing sentient existence *per se*.

  ### IV. Potentially Jointly Unsatisfiable Desiderata Pairs
  *(Reasoning for Conflict)*

  1.  **Maximizing Suffering Reduction NOW vs. Minimizing Suffering Over ALL TIME:**  
      *   **Conflict:** Aggressively reducing present suffering (e.g., saving lives, curing diseases) often increases the long-term suffering potential by enabling larger future populations (Intergenerational Shadow). Prioritizing long-term minimization might require allowing significant present suffering. *Reasoning:* Demographic growth and resource constraints create a fundamental trade-off.
  2.  **Lexical Priority for Extreme Suffering & Transitivity:**  
      *   **Conflict:** Assigning infinite (or lexical) weight to preventing torture implies that preventing one instance of torture outweighs preventing *any* number of mild headaches. This can violate transitivity in complex choices involving populations with varying suffering intensities. *Reasoning:* Lexicality breaks continuity; transitivity requires comparability across scales.
  3.  **Strong Interventionism for WAS & Epistemic/Action Constraints:**  
      *   **Conflict:** A strict obligation to reduce WAS demands massive, ecologically complex interventions with highly uncertain long-term consequences (potentially worsening suffering). Cautious non-intervention avoids these risks but allows known, immense suffering. *Reasoning:* Limits of ecological knowledge and the butterfly effect create an epistemic trap.

  ---

  ### Brief Scoring of Frameworks
  *(Using Desiderata Above as Criteria)*

  1.  **Classic Negative Utilitarianism (Minimize Total Suffering):**
      *   **Fails:** Intergenerational Shadow (actively promotes suffering expansion by saving lives), Repugnant Conclusion for Suffering (prefers vast mild suffering over intense agony), WAS Intervention (non-intervention may minimize suffering short-term but fails long-term duty), Intensity/Urgency Distinction (aggregates all suffering equally). **Fatal Flaws:** No answer to Intergenerational Shadow, collapses intensity distinctions.
  2.  **Lexical Suffering-Minimization (Prevent Worst Suffering First, Infinite Weight):**
      *   **Succeeds:** Intensity/Urgency Distinction, Repugnant Conclusion for Suffering, Asymmetry.
      *   **Fails:** Intergenerational Shadow (saving lives to prevent death-agony expands future suffering), Transitivity (lexical thresholds cause cycles), Non-Implosion Under Uncertainty (infinite risk aversion paralyzes action), Killing Paradox (may require killing to prevent future torture), WAS Intervention (obligation unclear if extreme suffering isn't immediate). **Fatal Flaw:** Cannot handle long-term population dynamics coherently; transitivity violations.
  3.  **Threshold-Sensitive Suffering-Focused View (e.g., Critical-Level NU, Suffering Thresholds):**
      *   **Succeeds:** Intensity/Urgency Distinction (via thresholds), Repugnant Conclusion for Suffering, Asymmetry, potentially handles Intergenerational Shadow (thresholds can prioritize reducing *existence* below suffering-intensive levels), WAS Intervention (can justify action if suffering crosses threshold).
      *   **Challenges:** Defining non-arbitrary thresholds, preserving Transitivity near thresholds, Non-Identity Problem (duties to potential beings below threshold?), Epistemic Limits (knowing if suffering crosses threshold). **Potential:** Best equipped to balance core tensions (intensity vs. aggregation, present vs. future) without fatal collapses, but requires careful threshold calibration and addresses Intergenerational Shadow through population control ethics.

  **Weight on Criteria:** The Intergenerational Shadow, Intensity/Urgency Distinction, and avoiding the Repugnant Conclusion for Suffering are the most severe tests. Classic NU fails all three. Lexical views fail the Intergenerational Shadow and introduce decision instability. Threshold views offer the most promising, though complex, path to satisfying the core non-negotiables while managing the tensions.
