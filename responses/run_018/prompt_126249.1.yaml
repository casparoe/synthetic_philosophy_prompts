prompt: |-
  You are a senior moral philosopher specializing in population ethics and suffering-focused axiologies. Before I evaluate any specific framework, write the complete desiderata that an adequate negative-utilitarian or suffering-centered ethics must satisfy. Specify: (1) the cases it must handle correctly—including the asymmetry between beneficence and non-maleficence, obligations regarding wild-animal suffering, and the "intergenerational shadow" problem in which reducing present suffering may expand future sentient populations and thereby increase potential suffering; (2) the distinctions it must preserve—such as intensity versus moral urgency of suffering, direct harm versus ecological omission, and actual versus merely potential sufferers; (3) consistency constraints from decision theory or axiological logic it cannot violate; and (4) any pairs of desiderata that appear jointly unsatisfiable, with the reasoning. For each requirement, state the motivating case or conceptual pressure behind it, and flag which are non-negotiable versus preferences of particular camps. Then briefly score classic negative utilitarianism, a lexical suffering-minimization position, and a threshold-sensitive suffering-focused view against your list, keeping the weight on the criteria. Begin with brief brainstorming of the core tensions. Answer in American English, remain focused on conceptual specification rather than historical exegesis, and do not provide bibliographies, reading lists, or citations.
reasoning: |-
