answer: |-
  Here is the exam question, model answer, marking scheme, and requested self-critique, drafted in British English.

  ---

  **Exam Question**

  **"Friedman's 'F-twist' asserts that the realism of a model's assumptions is irrelevant; only predictive accuracy matters. However, attempts to 'de-idealise' models by making their assumptions more realistic often destroy their predictive power. Critically evaluate whether this phenomenon supports the claim that predictive success alone can licence representational falsehood in scientific models, or if it instead reveals a deeper problem for instrumentalist approaches like Friedman's. Your answer must engage with the tension between prediction and explanation, and the idea that explanation might require some form of structural correspondence."**

  **(Write your answer in the booklet provided. Time allowed: 90 minutes. Approximate word count: 1000-1200 words.)**

  ---

  **Model Answer (Approx. 800 words)**

  Friedman’s provocative ‘F-twist’ – the claim that the unrealistic assumptions of economic models are irrelevant provided their predictions are accurate – remains a central battleground in the philosophy of science, particularly concerning economics. While its instrumentalist appeal is clear, the phenomenon whereby attempts to de-idealise models (making assumptions more realistic) frequently *impair* their predictive power presents a profound challenge. This essay argues that this de-idealisation problem does not successfully licence representational falsehood based solely on predictive success; instead, it exposes a fundamental weakness in Friedman’s instrumentalism by highlighting the neglected but essential role of *some* structural correspondence in achieving genuine explanatory power and robust prediction.

  Friedman defends unrealistic assumptions by invoking an instrumentalist, ‘as if’ methodology. Models are mere tools for generating predictions; questions about whether firms *actually* maximise profits or whether agents *truly* possess perfect information are deemed irrelevant. Success is measured purely empirically: does the model predict observed phenomena? If so, the assumptions, however fanciful, are vindicated *as instruments*. This severs the traditional link between explanation and truth, suggesting that predictive adequacy is sufficient for scientific legitimacy.

  The de-idealisation problem, however, casts serious doubt on this position. Consider the Phillips Curve, which initially posited a stable, inverse relationship between unemployment and inflation. This model generated reasonable short-term predictions based on the unrealistic assumption of static inflation expectations. When economists like Friedman and Phelps introduced more realistic adaptive (and later rational) expectations, de-idealising the model, the stable relationship broke down. Crucially, the original model’s predictive success *vanished* in the face of new data (stagflation), precisely *because* its assumptions lacked structural correspondence to the underlying causal mechanisms – how expectations are formed and influence behaviour. The de-idealised versions, while more realistic in their assumptions about expectations, initially struggled to predict better than the crude original, highlighting the complexity involved. This pattern repeats: overly simplistic supply/demand models ignoring market frictions might predict equilibrium prices in some contexts, but adding realistic frictions (information asymmetry, transaction costs) often makes prediction vastly harder, even if it better reflects reality.

  This phenomenon undermines the F-twist in two key ways. Firstly, it suggests that the predictive success of highly idealised models is often *fragile* and *context-bound*. Their success frequently relies on contingent empirical regularities or specific historical conditions that their unrealistic assumptions fail to capture or explain (like static expectations prevailing temporarily). When conditions change (expectations adapt), the model fails catastrophically. Predictive success based on representational falsehood is thus shown to be ephemeral, not a solid foundation for scientific legitimacy. The model worked *despite* its false assumptions, not *because* of them in any robust explanatory sense.

  Secondly, and more damningly, the difficulty of achieving predictive success *after* de-idealisation points towards the necessity of *some* degree of structural correspondence for sustainable explanation and prediction. While the de-idealised Phillips Curve struggled initially, the *recognition* that expectations were crucial represented progress towards understanding the actual causal structure. The challenge lies in building models complex enough to capture relevant structural features (like expectation formation mechanisms) *without* becoming computationally intractable or impossible to test. This tension doesn't vindicate the original false assumptions; it highlights the arduous process of *improving* structural correspondence. Instrumentalism, by declaring assumptions irrelevant, provides no guidance for this essential process of model refinement towards greater verisimilitude.

  The core issue is the relationship between prediction and explanation. Friedman divorces them, prioritising prediction. However, the de-idealisation problem reveals that reliable, generalisable prediction often *depends* on explanatory adequacy – understanding *why* something happens, which necessitates some grasp of underlying causal structures. A model predicting falling apples based on an assumption of apple-desiring fairies might coincidentally work in a specific orchard but fails utterly as a general theory of gravity. Its predictive success is accidental, not licensed by its falsehood. Similarly, the idealised Phillips Curve’s success was contingent, not explanatory. Genuine scientific progress, as seen in the eventual development of more sophisticated macroeconomic models incorporating expectations, involves striving for models whose predictive power derives from increasing alignment with causal structures, however partial and approximate. Explanation requires representational fidelity, at least in capturing the relevant causal variables and their relationships, even if simplifications remain.

  Therefore, the de-idealisation problem does not support licensing representational falsehood via predictive success alone. Instead, it starkly illustrates the limitations of instrumentalism. The fragility of prediction based on false assumptions and the persistent difficulty of achieving prediction *with* more realistic assumptions demonstrate that sustainable scientific understanding requires models to achieve *some* level of structural correspondence to the world. While idealisation is unavoidable and pragmatically useful, Friedman’s F-twist errs in dismissing the pursuit of realistic assumptions altogether. The failure of de-idealisation isn't a reason to abandon realism; it's a signpost on the difficult road towards better, more explanatorily robust, and thus more reliably predictive, scientific models. The tension is inherent in the scientific endeavour, not a vindication of instrumentalism.

  ---

  **Marking Scheme (Total: 20 Marks)**

  | **Criteria**                                                                 | **A-Grade (17-20 Marks)**                                                                                                | **B-Grade (13-16 Marks)**                                                                                          | **Common Errors & Mark Deductions**                                                                                               |
  | :--------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Understanding & Engagement (6 marks)**                                   | Demonstrates sophisticated grasp of F-twist, instrumentalism, structural correspondence, *and* the de-idealisation problem. Deep engagement with the tension prediction/explanation. | Solid understanding of core concepts (F-twist, prediction vs explanation) but less depth on structural correspondence or de-idealisation problem. | Superficial summary of F-twist/'as if' (e.g., just listing assumptions) (-3). Misrepresenting key concepts (e.g., confusing realism of assumptions with model output) (-2). Ignoring de-idealisation (-4). |
  | **2. Critical Evaluation & Argument (8 marks)**                               | **Specific Move:** Explicitly uses de-idealisation failure (e.g., Phillips Curve, supply/demand + frictions) as *central evidence against* licensing falsehood via prediction. Develops a sustained, coherent argument *against* F-twist based on fragility of prediction & need for structural correspondence for explanation. **Specific Move:** Clearly articulates *why* de-idealisation difficulty points *towards* necessity of structural correspondence, not away from it. Links explanation inherently to structural fidelity. | Critically discusses F-twist pros/cons, mentions de-idealisation, but doesn't make it the central analytical tool. Argument may be less focused or primarily comparative (instrumentalism vs realism). May assert need for correspondence without fully leveraging de-idealisation problem as evidence. | Accepts F-twist premise uncritically (-3). Treats de-idealisation failure as proof F-twist is *correct* (-4). Argument is descriptive rather than evaluative (-2). Fails to adequately address the 'tension' specified in the question (-2). Weak/no examples (-2). |
  | **3. Use of Philosophy of Science Concepts (4 marks)**                        | **Specific Move:** Integrates concepts like instrumentalism, structural realism/ correspondence, verisimilitude, explanation (causal vs predictive), fragility of prediction, *seamlessly* into the argument. | Uses relevant terminology correctly (instrumentalism, explanation, prediction) but with less depth or integration. May mention 'structural correspondence' without fully developing it. | Vague or incorrect use of terminology (e.g., misusing 'falsification') (-2). Fails to engage with 'explanation requires structural correspondence' beyond assertion (-2). Ignores philosophical context (-2). |
  | **4. Structure, Clarity & Writing (2 marks)**                                 | Exceptionally clear, logical flow. Precise, academic language. Flawless structure (intro, argument, conclusion). Concise within limits. | Generally clear and well-structured. Minor lapses in clarity or concision possible. Adequate academic tone. | Poor structure, unclear argument (-1 to -2). Significantly over/under word count (-1). Informality, grammatical errors impairing meaning (-1). |

  **Differentiating A from B:** The A-grade hinges on **leveraging the de-idealisation problem as the core evidence** for a sophisticated critique of Friedman's licensing claim, explicitly linking the *failure* of de-idealisation to the *necessity* of structural correspondence for sustainable explanation and robust prediction. The B-grade demonstrates good understanding and criticism but lacks this specific, deep focus on de-idealisation as the critical flaw *revealing* the need for correspondence. B-grade arguments might discuss fragility generally or compare paradigms without this tight analytical link.

  ---

  **Self-Critique: Where the Model Answer's Reasoning is Most Vulnerable**

  The model answer's core argument – that the fragility of prediction under de-idealisation reveals the necessity of structural correspondence for genuine explanation and robust prediction – is most vulnerable to a counterargument demonstrating **persistent, robust predictive success achieved by models whose core assumptions are known to be fundamentally false and where de-idealisation consistently *degrades* predictive performance without yielding clearer structural insights.**

  *   **Specific Counter-Scenario:** If there existed a domain (perhaps certain complex systems like some financial markets or specific biological networks) where highly idealised models with blatantly false core assumptions (e.g., treating systems as closed, ignoring known key variables, assuming linearity where complexity reigns) consistently outperformed more complex, structurally more accurate models *across a wide range of conditions and over long time periods*, and crucially, where attempts to incorporate known structural complexities *always* made predictions worse without providing new explanatory understanding, this would severely challenge the model answer's position.
  *   **Why it Challenges the Model Answer:** This scenario would suggest that in some domains, the "ephemeral" predictive success based on falsehoods might actually be *more* robust and reliable than predictions based on structural aspirations. It would lend credence to Friedman's core claim that predictive power, even if derived from known falsehoods and potentially fragile in *some* contexts, is the ultimate arbiter *pragmatically*. It would imply that the "deeper problem" revealed by de-idealisation failure might not be with instrumentalism, but with the inherent unpredictability of the system, making instrumental shortcuts not just permissible, but *essential* for any useful prediction. It would challenge the inherent link made between explanation and prediction, suggesting that in these domains, predictive models are valuable tools *without* needing to explain via structural correspondence. If such domains were widespread, it would force a significant concession to instrumentalism, even if not a full vindication of the F-twist's dismissal of assumptions. The model answer assumes that fragility *exposes* the lack of correspondence; this counter-scenario suggests fragility might be an acceptable cost for superior performance in inherently complex domains where true structural understanding is practically unattainable.
