answer: |-
  ### Scenario: St. Helena Diagnostic AI Rollout  
  The St. Helena Hospital Board approved "Project Insight," an AI diagnostic system, using a $5M grant with a reverse-vesting clawback. Each quarter, $600k of the grant shifts status: if they *stay*, these funds remain accessible for the project; if they *quit*, those unspent shifted funds instantly vanish from their accounts, appear as "Lost Protected Capital" on the public grantor dashboard, and they must return any unshifted remainder. By Quarter 3, the AI’s accuracy is dismal (35% error rate vs. promised 8%), requiring only a $500k match for Q4. Projected Q4 benefits are $400k. Quitting now forfeits $1.8M in clawback-vested funds. Continuing risks another $500k loss but avoids publicly cementing the $1.8M loss.  

  ---

  ### Analysis  
  1. **Rational Choice Verdict (Quit in Q3)**  
     *Reasoning:* Ignore sunk costs (past $1.8M clawback-vested funds). Future cost (Q4 match: $500k) > projected benefit ($400k). Net expected loss: $100k. Withdraw minimizes future losses.  
     *Structural Feature:* The clawback makes past funding *conditionally sunk* but irrelevant to future marginal utility.  
     *Collapse Condition:* Remove the clawback (i.e., unspent funds are simply returned if quit). Now no "loss realization" trigger → rational exit at Q3.  

  2. **Prospect Theory Verdict (Escalate Past Q3)**  
     *Reasoning:* The clawback creates a reference point: the $1.8M is "theirs" *only if they stay*. Quitting *realizes* a salient, publicly logged loss ($1.8M gone). Staying *defers* loss recognition (possible future failure feels ambiguous). Loss aversion > risk calculus → escalate to avoid crystallizing the loss.  
     *Key Structural Feature:* Reverse-vesting makes unspent funds psychologically "owned" assets, turning withdrawal into a *certain, visible loss* versus an *uncertain future outcome*.  
     *Not "Waste" Heuristic:* The board isn’t fixated on spent money; it’s avoiding the *clawback-triggered* loss event.  

  3. **Rational-Choice Rebuttal**  
     A defender argues: The "Lost Protected Capital" log isn’t just a loss—it’s a *reputational signal* to future funders. Escalating risks greater visibility if Q4 fails spectacularly (e.g., patient harm). The $1.8M forfeiture might be cheaper long-term than eroded trust. Thus, quitting *avoids amplifying hidden reputation costs*, aligning with rationality.  

