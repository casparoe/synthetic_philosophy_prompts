prompt: |-
  I'm a phd student in philosophy of action, pretty comfortable with hyperbolic discounting and commitment devices but rusty on the formal literature. Can you restate the classic akrasia debate -- Socratic intellectualism, Aristotle's incontinence, and Davidson's all-in judgments being overturned by conditional ones -- entirely in behavioral-econ vocabulary: present-biased preferences, beta-delta discounting, commitment contracts, state-dependent utility. Be honest about the translation: for each philosophical view say what maps cleanly, what needs distortion, and whether there's conceptual residue (like Aristotle's akrasia/akolasia distinction or the normative pull of the 'better' judgment) that just lacks an economic counterpart. Is the residue a real gap in our intertemporal models or just verbal noise?

