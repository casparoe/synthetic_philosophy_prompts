answer: |-
  Here is the hand I lift between us now,
  This solid weight that blocks the filtered light,
  The knuckle's ridge, the fingernail's pale moon.
  Here is the table where my palm rests down,
  The wood grain palpable beneath the skin,
  The space defined by surface and by air.
  Your gaze rests where my gesture holds its place,
  A common distance measured in the room.

  But knowing is not showing, and the doubt
  That haunts alone cannot be met alone.
  I make no chain of thought you must concede;
  This lifted shape addresses only you,
  Inviting sight to share what thought suspends.
  We stand within the world we would not doubt.
