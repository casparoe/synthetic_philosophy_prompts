  ### Engineered Thought Experiment: Hydraulically Coupled Thomson-Style Lamp

  In a clinical workshop, a technician operates a mechanical lamp affixed to a hydraulic accumulator with a rigid reservoir of precisely 20 ml capacity. The lamp is toggled via a cam-driven lever at intervals halving in duration: the first possible toggle occurs at \( T - 1/2 \) minute, the next at \( T - 1/4 \) minute, and so on, converging to time \( T \). Crucially, the technician engages the toggle only on even-numbered steps (e.g., step 2 at \( T - 1/4 \), step 4 at \( T - 1/16 \), etc.), as dictated by a deterministic gear mechanism, ensuring infinitely many toggles without a final action. Each toggle, if the reservoir has capacity, releases exactly 10 ml of fluid from a fixed external source into the reservoir; excess volume is diverted via a pressure-relief valve to maintain the 20 ml limit. The reservoir feeds a patient’s stabilisation system through a narrow tube, with volumetric flow rate \( Q = kP \) (where \( k > 0 \) is a constant and \( P \) is pressure), ensuring continuous, pressure-proportional outflow. Patient stability requires \( P > 0 \) strictly at \( T \), necessitating careful calibration of the hydraulic coupling.

  #### (1) Physical State at \( T \) via Hydraulic Continuity
  The reservoir’s state at \( T \) is determined by the continuity of the volume function \( V(t) \), governed by the outflow dynamics \( dV/dt = -cV \) (with \( c = k/A \), where \( A \) is the reservoir’s cross-sectional area, ensuring \( P \propto V \)). Given the technician toggles only on even steps (steps 2, 4, 6, ...), releases occur at times \( t_m = T - (1/4)^m \) minutes for \( m = 1, 2, 3, \ldots \), each adding 10 ml if \( V < 20 \) ml. After the second toggle (\( m=2 \) at \( t = T - 1/16 \)), \( V \) reaches 20 ml; subsequent toggles add no volume due to the capacity constraint. Thus, only two finite additions occur, and \( V(t) \) evolves continuously between and after toggles via exponential decay. Post-last-addition at \( t = T - 1/16 \), \( V(t) = 20 \cdot e^{-c(t - (T - 1/16))} \) for \( t > T - 1/16 \). At \( T \), \( V(T) = 20 \cdot e^{-c/16} \). Since \( c \) and the exponential are positive, \( V(T) > 0 \), hence \( P(T) > 0 \), satisfying the patient’s requirement. The continuity of \( V(t) \) ensures this limit exists and is well-defined, irrespective of the lamp’s discrete toggles.

  #### (2) Failure of Thomson’s Parity Argument
  Thomson’s original argument asserts that after infinitely many toggles, the lamp cannot be determinately on or off at \( T \) because there is no final toggle to ground its state—each toggle flips the state, making parity (even/odd count) undefined in the limit. Here, however, this argument fails to settle the reservoir’s state. The lamp undergoes infinitely many state changes (e.g., if initially off, toggles at step 2, 4, 6, ... imply an even count, but no finite parity applies at \( T \)). Yet, the hydraulic system’s state at \( T \) is fully determinate: \( V(T) \) is fixed at \( 20 \cdot e^{-c/16} > 0 \) by the continuity of the outflow process, which "smooths" the discrete inputs into a convergent physical trajectory. The indeterminacy of the lamp’s binary state does not propagate to the reservoir because the latter’s state depends on the aggregate effect of the toggles filtered through a continuous dynamical law, not on the existence of a final toggle or the parity of the sequence.

  #### (3) Resolving Feature and Collapse upon Removal
  The structural feature resolving indeterminacy is the introduction of a *continuous state variable* (volume/pressure) governed by a *time-continuous differential equation* (\( dV/dt = -cV \)). This equation ensures that the system’s evolution is Lipschitz-continuous in time, guaranteeing a unique limit at \( T \) by the Picard–Lindelöf theorem, which applies here as \( dV/dt \) is continuous and bounded between toggles. Consequently, \( V(T) \) is determined solely by the history of inputs and the law’s continuity, bypassing the need for a "final" toggle. If this feature is removed—leaving only the discrete lamp with no hydraulic coupling—the system reduces to Thomson’s original setup. Without a continuous parameter, the state at \( T \) depends entirely on the divergent infinite sequence of toggles, where no finite subsequence suffices to define a limit, and parity arguments fail. The indeterminacy re-emerges because no physical law or continuity principle grounds the state at \( T \), collapsing the case to Thomson’s unresolved paradox.

  #### (4) Defence Against Subject-Changing Objection
  The objection that this scenario changes the subject from a lamp to a hydraulic device misconstrues the purpose. This is not a mere shift in focus but a deliberate variant of the supertask that isolates how *continuous coupling* can mitigate indeterminacy in infinite decision procedures. The lamp remains central—its toggles drive the hydraulic system—but the coupling demonstrates that introducing a continuous degree of freedom can resolve otherwise underdetermined outcomes. This is philosophically significant for theories of action and mathematics: it shows that indeterminacy in supertasks may arise from discretisation alone and can be dissolved by embedding discrete actions within a continuous physical context. Thus, the scenario legitimately extends Thomson’s problem, illustrating a general principle about the role of continuity in grounding limits, without appealing to exotic or non-mechanical elements.
