answer: |-
  Below is a comprehensive specification of desiderata for an adequate population axiology, structured by category. I flag known incompatibilities (especially the **Mere Addition Paradox**) and indicate negotiability based on theoretical camps. The requirements reveal why no consensus view exists—**some desiderata are logically incompatible**.

  ---

  ### **I. Formal & Structural Constraints (Generally Non-Negotiable)**  
  1.  **Transitivity (A1)**:  
      *If A > B and B > C, then A > C.*  
      **Motivation**: Necessary for coherent ranking; violations imply cyclic preferences (e.g., A > B > C > A).  
      **Status**: Non-negotiable for most axiologists; foundational to rationality.  

  2.  **Completeness (A2)**:  
      *For any two outcomes A and B, either A > B, B > A, or A ~ B (indifferent).*  
      **Motivation**: Ensures comparability of all possible populations.  
      **Status**: Contested. Some (e.g., Parfit) argue incommensurability is plausible; others deem it essential.  

  3.  **Continuity (A3)**:  
      *If A > B > C, there exists a population B' similar to B such that A > B' > C.*  
      **Motivation**: Prefers lexical superiority (e.g., no trade-offs between quality and quantity).  
      **Status**: Negotiable. Rejected by lexical views (e.g., Nagel's "absolute priority" to worst-off).  

  ---

  ### **II. Fixed-Population Adequacy (Non-Negotiable)**  
  4.  **Pareto Principle (B1)**:  
      *If everyone in A has welfare ≥ everyone in B, and at least one person has > welfare, then A > B.*  
      **Motivation**: Core welfare economics; uncontroversial for same-people cases.  
      **Status**: Non-negotiable. Violations imply sacrificing individuals for no gain.  

  5.  **Anonymity (B2)**:  
      *Permuting welfare assignments across people doesn’t change value.*  
      **Motivation**: Ethical impartiality; no person-specific privileges.  
      **Status**: Non-negotiable for impersonalists; contested by person-affecting views.  

  ---

  ### **III. Variable-Population Desiderata (Contested)**  
  6.  **Non-Identity Avoidance (C1)**:  
      *Policy X > Y even if different people exist in X and Y, provided X has higher total/average welfare.*  
      **Motivation**: Solves Parfit’s *Non-Identity Problem* (e.g., choosing a policy that causes future disability).  
      **Status**: Non-negotiable for consequentialists; rejected by "person-affecting" purists.  

  7.  **Asymmetry (C2)**:  
      *Adding a person with negative welfare makes an outcome worse, but adding a person with positive welfare does NOT necessarily make it better.*  
      **Motivation**: Avoids "procreation obligation" (we must create happy people) while condemning miserable lives.  
      **Status**: Contested. Central to *anti-natalist* views; rejected by symmetric totalists.  

  8.  **Mere Addition Principle (D)**:  
      *Adding a person with positive welfare (without harming others) does NOT make an outcome worse.*  
      **Motivation**: Intuition that "more good lives" aren’t bad.  
      **Status**: Contested. **Relaxing this is key to avoiding the Repugnant Conclusion** (see Conflict 1).  

  9.  **Negative Mere Addition (D-)**:  
      *Adding a person with negative welfare makes an outcome worse.*  
      **Motivation**: Avoids "sadistic conclusion" (adding suffering lives could be "improvement").  
      **Status**: Near-universal; only fringe theories violate this.  

  ---

  ### **IV. Implications to Avoid (Negotiable, but Widely Accepted)**  
  10. **Repugnant Conclusion (RC)**:  
      *For any population A with high welfare, there exists a larger population Z with barely positive welfare such that Z > A.*  
      **Avoidance Motivation**: Z’s lives are arguably not "better" than A’s, merely more numerous.  
      **Status**: Avoidance is negotiable. *Total utilitarians* accept RC; others prioritize quality.  

  11. **Sadistic Conclusion (SC)**:  
      *Adding lives with negative welfare could be better than adding lives with positive welfare.*  
      **Avoidance Motivation**: Adding suffering should never be preferable to adding happiness.  
      **Status**: Non-negotiable (only fringe theories violate SC).  

  12. **Promiscuity**:  
      *Any outcome can be improved by adding enough barely-happy lives.*  
      **Avoidance Motivation**: Overwhelms quality with quantity.  
      **Status**: Contested. Follows from RC; avoided by critical-level/lexical views.  

  ---

  ### **V. Distinctions to Preserve (Non-Negotiable)**  
  13. **Person-Affecting/Greater-Good Distinction**:  
      *Improving welfare for existing people vs. adding new good lives must be distinguishable.*  
      **Motivation**: Moral difference between benefiting actual people vs. creating new ones.  
      **Status**: Non-negotiable for *person-affecting* and *asymmetric* views.  

  14. **Quality/Quantity Non-Collapse**:  
      *A theory must not treat high-welfare lives as fungible with many low-welfare lives.*  
      **Motivation**: Preserves the intrinsic value of excellence (e.g., art, discovery).  
      **Status**: Contested. *Lexical superiority* views enforce this; total utilitarians reject it.  

  ---

  ### **VI. The Central Conflict: Avoiding RC vs. Mere Addition**  
  **Conflict 1 (Mere Addition Paradox)**:  
  - **D (Mere Addition)** + **A1 (Transitivity)** + **Avoid RC** → **Logically Incompatible**.  
  - **Proof Sketch**:  
    1. A: Small elite population.  
    2. A+: Add happy but slightly worse-off people (not worse by D).  
    3. B: Same as A+ but equalized (better by egalitarianism).  
    4. Repeat: B+ → C → ... → Z (huge, barely-positive population).  
    Transitivity forces A < Z → **RC**.  

  **Resolution**:  
  - **First Relaxation**: **D (Mere Addition)**.  
  - **Why**: D is weakest—neutrality about addition is less counterintuitive than RC. *Critical-Level* and *Negative Utilitarian* views do this.  
  - **Alternative**: Reject transitivity (e.g., *Nontransitive Person-Affecting Views*), but this invites cyclic judgments.  

  ---

  ### **Which Requirement Eliminates the Most Theories?**  
  **Avoiding RC + Upholding A1 (Transitivity)** eliminates:  
  - **Total Utilitarianism** (embraces RC)  
  - **Average Utilitarianism** (fails Mere Addition and Non-Identity cases)  
  - **Unrestricted Person-Affecting Views** (fail Non-Identity cases)  

  **Preserving C2 (Asymmetry)** eliminates:  
  - **Total Utilitarianism** (demands symmetric treatment of positive/negative lives)  
  - **Critical-Level Utilitarianism** (if the critical level is non-zero)  

  ---

  ### **Adequate Families of Views**  
  Given the above, only these families satisfy *most* desiderata (though none satisfy all):  
  1. **Critical-Range Views** (e.g., variable critical thresholds): Avoid RC, satisfy Asymmetry, reject Mere Addition.  
  2. **Lexical Views** (e.g., lexical threshold): Preserve quality/quantity distinction, avoid RC, but violate Continuity.  
  3. **Narrow Person-Affecting + Harm-Based Asymmetry**: Handle non-identity via "harm to possible people," but struggle with transitivity.  

  The criteria reveal a trilemma: **Transitivity**, **Avoid RC**, and **Mere Addition** cannot coexist. Your choice of which to relax defines your axiological camp. For adjudication, prioritize whether RC or Mere Addition is less tolerable, then enforce transitivity and fixed-population Pareto. The field remains fractured because this choice is ultimately ethical, not logical.  

  > *Source synthesis: Parfit (1984), Arrhenius (*Impossible Population Ethics*, 2022), Broome (2004), Huemer (2008), Dasgupta (1994)*
