prompt: |-
  I am trying to clarify the conceptual architecture behind the moral distinction between killing and letting die, and I find that every discussion quickly collapses into either a causal debate or a rights-based slogan without specifying what a theory actually needs to deliver. Before I commit to any particular framework—whether causal, normative, or institutional—I want the full specification of what an adequate account must be able to do. Write the desiderata: the cases any theory of the act/omission distinction must get right, the distinctions it must preserve without collapse, and the results or constraints it must be consistent with, with the motivating consideration behind each requirement.

  Specifically, the list should cover the canonical pairs—direct physical intervention versus passive non-intervention in the drowning-stranger and switch-track scenarios—but also extend to less discussed configurations: omissions that are structurally distributed across collective or automated decision systems, where no individual agent performs an identifiable action yet a harmful default pathway is maintained; and cases of negative causation, where an agent prevents an intervention that would have saved a life, so the harm arrives through the removal of a blocker rather than through direct application of force. The theory must explain why these can still be classified as omissions rather than disguised actions, without appealing to a primitive metaphysical distinction between positive and negative duties that simply restates the problem. It should also specify whether the distinction tracks causal contribution, foreseeability, the existence of a prior duty, or some combination, and flag any pair of desiderata that appear jointly unsatisfiable—for instance, if preserving a robust causal asymmetry conflicts with accommodating distributed collective omissions, or if treating negative causation as omission undermines the boundary with active harm.

  Finally, indicate which of these requirements are genuinely non-negotiable for any theory worth the name and which are camp-specific preferences (e.g., whether determinism about causation must be preserved, whether rights-based accounts may treat all omissions as rights-violations). If you can, briefly indicate how a pure causal account, a deontological rights-based view, and an institutional or role-based framework each fare against the list, but keep the emphasis on the criteria themselves: I need the specification more than the scorecard. Do not provide bibliographies, reading lists, or citations; I want a conceptual map, not a literature guide.
reasoning: |-
  Okay, let me unpack this user's request carefully. They're clearly deep into moral philosophy, specifically wrestling with the killing vs letting die distinction beyond surface-level debates. The frustration with causal and rights-based circularity resonates - I've seen many discussions stall there. 

  Hmm, they want a comprehensive desiderata list before committing to any framework, which is smart. The emphasis on "less discussed configurations" tells me they've already exhausted standard literature and need expansion into collective systems and negative causation. That distributed omission point is crucial - modern ethics must handle institutional inaction.

  Breaking this down: First, the core canonical cases (drowning/trolley) are non-negotiable starters. But the real test is those edge cases: When an AI system's default setting causes harm through non-adjustment, or when removing a safety guard isn't "active". And they explicitly reject primitive duty distinctions as circular - big red flag for simple deontology.

  Noticing three layers in their ask: 
  1) Case coverage (from classic to novel)
  2) Theoretical constraints (no circularity, must specify tracking criteria) 
  3) Meta-requirements (flagging conflicts, separating essentials from camp preferences)

  The negative causation challenge feels pivotal. If removing a life-preserving blocker counts as omission, how does that differ from shoving someone off a cliff? Any theory must walk that tightrope without special pleading. And collective omissions... if no individual acts, does responsibility vanish? That can't be right given real-world corporate harm.

  For non-negotiables: Preserving intuitive wrongness asymmetry in core cases seems essential. But determinism? Probably optional unless doing hardcore causal realism. Rights theorists might insist all omissions violate rights, but that's camp-specific. Should flag that.

  When considering frameworks: 
  - Pure causal accounts struggle with distributed systems (who's the cause?) 
  - Rights-based views may overextend "duty" 
  - Institutional frameworks handle collectives well but might blur individual responsibility

  Biggest tension spot: Robust causal asymmetry vs collective omissions. If causation requires discrete actors, distributed cases break. But if we loosen causation, do we lose the drowning/trolley distinction? That's the tripwire.

  User's clearly building something systematic - maybe a new framework? The precision suggests academic rigor. No fluff tolerated; every desideratum needs grounded justification. Better make the motivations crystal clear.
answer: |-
  Here is a comprehensive set of desiderata for any theory of the killing/letting die (act/omission) distinction, structured by requirement type, with motivating considerations and clarity on non-negotiables vs. camp-specific preferences:

  **Core Non-Negotiables (Essential for Any Plausible Theory):**
  1.  **Asymmetry in Core Cases:** Must explain the stronger intuitive moral wrongness (and often legal prohibition) in *actively drowning a stranger* vs. *failing to save a drowning stranger*, and in *diverting a trolley to kill one* vs. *failing to flip a switch diverting a trolley from five to one* (standard "killing" vs. "letting die" intuitions).
      *   *Motivation:* Captures the foundational moral intuition the distinction aims to explain.
  2.  **Distinguish Causation from Culpability:** Must allow that omissions *can* be morally culpable and causally relevant without thereby becoming morally equivalent to direct killings in all respects.
      *   *Motivation:* Prevents collapse into "only actions matter" or "all causation is equal" views that erase the distinction entirely.
  3.  **Accommodate Negative Causation (Removing Blockers):** Must classify cases like *removing a life-preserving device already in place* (e.g., disconnecting a ventilator, sabotaging a dam holding back floodwaters) as omissions/"letting die" (even if highly culpable), not disguised killings, despite the agent's physical intervention being causally necessary for death.
      *   *Motivation:* Intuition that stopping an ongoing life-sustaining process is distinct from initiating a new lethal process (e.g., injecting poison). Avoids over-expanding "killing".
  4.  **Exclude "Allowing" as "Doing":** Must *not* classify mere *foreseeable non-prevention* of an *independent threat* (e.g., watching a boulder you could divert crush someone, where the boulder's path is independent of you) as a killing. It should remain a (potentially culpable) omission.
      *   *Motivation:* Preserves a boundary; not every failure to stop harm is equivalent to actively causing it.
  5.  **Handle Special Obligations:** Must explain why omissions violating *specific, pre-existing duties* (e.g., a parent failing to feed their child, a lifeguard failing to save a swimmer) are judged more harshly than omissions towards strangers, potentially approaching the moral gravity of killing *within that role context*.
      *   *Motivation:* Acknowledges context-dependence without collapsing the core distinction.

  **Structural & Edge Case Requirements:**
  6.  **Distributed Collective Omissions:** Must account for harmful outcomes resulting from *systemic inaction* or *default settings* where no single individual performed an identifiable "act" causing harm (e.g., a committee's failure to authorize a safety fix leading to disaster; an automated system's unmodified default protocol causing harm).
      *   *Motivation:* Reality of institutional and technological harm requires classifying harmful non-interventions even without a single "actor". Theory must avoid implying only identifiable actions matter.
  7.  **Non-Primitive Distinction:** Must *not* rely solely on an undefined metaphysical difference between "positive" and "negative" duties/causes as its core explanation. The basis needs independent specification (e.g., causal structure, norm violation type, institutional role).
      *   *Motivation:* Avoids circularity ("it's omission because it violates a negative duty" / "it's a killing because it violates a positive duty").
  8.  **Specify Tracking Criteria:** Must explicitly state what the distinction primarily tracks:
      *   *Causal Contribution:* Does it track the *structure* of causal influence (e.g., introducing a new lethal factor vs. failing to block an existing threat)?
      *   *Normative Status:* Does it track the violation of a specific prohibition vs. a failure to fulfill an affirmative duty (which may be context-dependent)?
      *   *Foreseeability/Control:* Is the foreseeability of the outcome or the agent's control over the sequence central?
      *   *(Likely Combination):* Most plausible theories will combine elements.
      *   *Motivation:* Necessary for theoretical clarity and testability.
  9.  **Accommodate Mitigating Factors:** Must allow that culpability for omissions is highly sensitive to *cost/risk to agent*, *clarity of required action*, and *reasonable expectations*, often more so than for direct killings.
      *   *Motivation:* Reflects intuitive judgments (e.g., failing to save a drowning child at minimal risk is very wrong; failing to donate a kidney is less clear-cut, while pushing someone in is always wrong).

  **Constraints & Consistency Requirements:**
  10. **Consistency with Moral Agency:** Must not imply that omissions are never voluntary, intentional, or morally assessable. Agents *can* choose to omit.
      *   *Motivation:* Preserves moral responsibility for inaction.
  11. **Avoid Fatalism:** Must not imply that "letting die" is merely allowing nature to take its course, ignoring the agent's capacity to alter outcomes.
      *   *Motivation:* Agents are often embedded in situations where their intervention *can* change outcomes; the distinction isn't about inevitability.

  **Potential Tensions & Camp-Specific Preferences:**
  12. **Robust Causal Asymmetry vs. Distributed Omissions:** *(Tension)* Preserving a strong causal asymmetry (e.g., "acts introduce new causes, omissions remove barriers") may struggle with distributed cases where the "cause" is diffuse (e.g., a committee's inaction). Institutional views handle this better.
      *   *Resolution Preference:* Causal accounts may weaken asymmetry; institutional accounts embrace context.
  13. **Negative Causation vs. Active Harm Boundary:** *(Tension)* Classifying blocker-removal (e.g., disconnecting a ventilator) as omission risks blurring the line with active harm if the intervention is physically identical to an act causing harm (e.g., severing a rope holding someone over a cliff). Where is the boundary?
      *   *Resolution Preference:* Causal accounts focus on the *pre-existing dependence* of the victim (on vent/cliff rope). Rights accounts focus on violating a negative duty not to interfere. Institutional accounts look at legitimate expectations.
  14. **Rights & Omissions:** *(Camp-Specific)* Must a theory treat *all* culpable omissions as rights violations? Deontological views often say yes ("positive rights"). Consequentialist/institutional views may say only specific omissions violate rights.
      *   *Preference:* Deontological commitment vs. Flexibility for other views.
  15. **Causal Determinism:** *(Camp-Specific)* Must the theory preserve the idea that omissions are *causally inert* or fundamentally different in causal structure? Or can omissions be genuine causes?
      *   *Preference:* Pure causal theories often require asymmetry. Normative/institutional theories can accept omissions as causes.

  **Framework Snapshots (Against the Desiderata):**

  *   **Pure Causal Account:** Tracks the *structure of causal sequences* (initiating new threats vs. failing to interrupt existing ones). *Strengths:* Handles core cases, negative causation (blocker removal), excludes mere non-prevention. *Weaknesses/Tensions:* Struggles mightily with distributed omissions (who/what is the cause?), may have difficulty cleanly separating blocker removal from active harm without normative help, and defining "new threat" vs. "existing threat" can be contentious. Causal asymmetry vs. distributed omissions is a major tension.
  *   **Deontological Rights-Based View:** Tracks the violation of *negative rights* (duties not to harm) vs. *positive rights/duties* (duties to aid). *Strengths:* Explains core asymmetry, handles special obligations (as specific positive duties), can explain harsh judgment of omissions violating positive rights. *Weaknesses/Tensions:* Requires justifying why positive duties are weaker/less universal than negative ones (risks circularity/primitive distinction). May struggle with distributed omissions (whose duty?). Often insists *all* culpable omissions violate rights (camp-specific). Negative causation (blocker removal) may be seen as violating a negative duty not to interfere, potentially blurring the act/omission line.
  *   **Institutional/Role-Based Framework:** Tracks *normative expectations* defined by roles, institutions, and social practices. *Strengths:* Elegantly handles special obligations and distributed omissions (systemic failures within an institution), explains context-sensitivity of omissions. Can incorporate causal and rights elements contextually. *Weaknesses/Tensions:* May struggle to explain the *core* asymmetry for strangers outside specific institutional contexts ("Why is drowning someone always worse than letting a stranger drown?"). Defining the relevant "institution" or "role" can be vague. May relativize the distinction excessively.

  This desiderata list provides a rigorous conceptual map for evaluating any theory of the act/omission distinction, highlighting the essential benchmarks, critical edge cases, inherent tensions, and points where theoretical commitments diverge.
