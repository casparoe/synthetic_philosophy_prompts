answer: |-
  Your diagnosis cuts to the core of the composition debate. The stalemate *is* fundamentally about whether composition must track causal-explanatory joints, and this manifests in how each camp handles contact, life, and vagueness. Let's dissect the camps' positions and assess whether a sharp ontological/explanatory distinction can break the impasse.

  ### 1. **Engaging the Camps on Key Criteria**
     - **Contact:**
       - **Restrictivists (e.g., van Inwagen):** Mere contact is insufficient. A pile of sand isn't a true "object" because its parts lack synergistic causal unity (e.g., no metabolic interdependence). Composition requires *functional integration*, not spatial adjacency.
       - **Universalists (e.g., Lewis):** Contact is composition-triggering *if* we define it as such. The "sand pile object" exists—its causal inefficiency is irrelevant to its *being*. Composition is a logical, not causal, relation.
       - **Nihilists (e.g., Dorr):** Contact is metaphysically inert. Only simples exist; "contact" is just a description of spatial relations between fundamental entities.

     - **Life (as a Paradigm of Unity):**
       - **Restrictivists:** Life provides the clearest case of non-arbitrary composition (van Inwagen: *Material Beings*). An organism's parts are bound by immanent causation (self-sustaining processes), creating a unified causal agent. Artifacts like watches are "mere aggregates" because their unity is externally imposed.
       - **Universalists:** Life is just one arbitrary threshold. Why privilege biology over physics (atoms) or artifact function? A corpse and a living body are equally composite objects—their differences are causal, not ontological.
       - **Nihilists:** Life is emergent complexity, not composition. Only subatomic particles exist; "organisms" are patterns, not wholes.

     - **Vagueness:**
       - **Restrictivists:** Acknowledge borderline cases (e.g., viruses) but argue vagueness is epistemic or linguistic, not ontological. Reality has sharp boundaries; our concepts are fuzzy.
       - **Universalists:** Vagueness is a non-issue. If composition is unrestricted, there’s no vagueness *about composition itself*—only about which aggregates we find salient.
       - **Nihilists:** Avoid vagueness entirely—only simples exist, so no vague composites.

  ### 2. **The Core Disagreement: Ontology vs. Explanatory Framing**
  Your suspicion is correct: the debate masks a deeper conflict about **what counts as a "joint" in reality**.
     - **Restrictivists** tacitly tie "object" to *causal-explanatory unity*. For them, composition *must* mark a threshold where novel causal powers emerge (e.g., organisms exercising agency). This is why they reject artifacts: a watch's "function" is extrinsic (dependent on minds), not intrinsic.
     - **Universalists** decouple ontology from explanation. Composition is a brute logical relation; causal inefficiency doesn't negate existence. Explanatory relevance is pragmatic, not metaphysical.
     - **Nihilists** collapse the distinction: if composites lack irreducible causal powers, they don't exist.

  ### 3. **Can a Sharp Distinction Break the Stalemate?**
  Partially—but bedrock intuitions about unity may be intractable.
     - **Potential Progress:** Clarifying terms *could* defuse pseudo-disagreements:
       - **Ontological Commitment:** What exists? (Universalists: all sums; Nihilists: only simples; Restrictivists: only entities with causal unity).
       - **Explanatory Framing:** What do we *treat as unified* in scientific/narrative explanations? (Restrictivists: causal joints; Universalists: context-dependent aggregates).
       <br>Admitting that restrictivists often conflate "real object" with "explanatorily fundamental unit" might soften accusations of incoherence. Conversely, universalists could concede that most composites are explanatorily inert without denying their existence.
       
     - **Limitations:** The dispute is **anchored in pre-theoretical intuitions**:
       - Restrictivists *feel* that a living cat is metaphysically distinct from a random cat-part aggregate, even if both are "material configurations." This intuition resists formal arguments about parsimony or vagueness.
       - Universalists prioritize logical consistency (e.g., avoiding arbitrary composition thresholds) over intuitive unity. No formal argument can compel them to *care* about causal joints if existence is their sole concern.
       - Nihilists reject emergent unity entirely—no composite, however cohesive, is truly fundamental.

  ### 4. **Diagnosis: A Tripartite Impasse**
  The stalemate is **all three** of your proposed scenarios:
     - **Substantive Ontological Disagreement:** About whether causal unity is necessary for existence (Restrictivists) or irrelevant (Universalists/Nihilists).
     - **Verbal Dispute:** Over whether "composition" implies causal integration (Restrictivist) or mereological summation (Universalist).
     - **Divergent Projects:** Restrictivists seek a metaphysics that grounds explanation; Universalists seek a maximally general ontology; Nihilists seek ontological austerity.

  ### Conclusion: Intuitions Trump Formal Arguments
  A strict ontological/explanatory distinction can clarify positions and expose conflations (e.g., Restrictivists projecting explanatory norms onto existence). **But it won’t resolve the debate.** The roots lie in irreconcilable intuitions: 
  - Restrictivists see "genuine unity" (organisms, artifacts with teleology) as metaphysically privileged.  
  - Universalists see "existence" as cost-free and all-inclusive.  
  - Nihilists see composites as conceptual fictions.  

  No formal argument can dislodge these stances because they reflect divergent conceptions of what ontology *ought to do*—catalog causal joints (Restrictivism), enumerate logical possibilities (Universalism), or eliminate redundancy (Nihilism). The impasse persists because each camp answers a different question under the label "composition." Breaking it would require not new arguments, but a shared meta-ontological framework for evaluating what counts as a "joint"—a prospect as elusive as the dispute itself.
