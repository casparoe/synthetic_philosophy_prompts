answer: |-
  ### Brainstorming Notes  
  **Norman Malcolm’s Central Claim**: Dreams are not experiences occurring *during* sleep because they lack "correctability"—the ability to verify or falsify them through standard perceptual checks. Dream reports are thus linguistic artefacts, not evidence of conscious episodes.  

  **Daniel Dennett’s Opposing Position**: Dreams are not real-time conscious experiences but narratives constructed *after waking*, through "memory consolidation" or "filling in". The brain inserts a retrospective story, often borrowing from waking life.  

  **Under-Explored Tension**: Malcolm requires *epistemic vulnerability* (subject’s openness to correction) for experiential status. Dennett bypasses this by denying dreams *any* concurrent phenomenality. The unresolved question: **Does the absence of epistemic vulnerability in dreams inherently invalidate Malcolm’s criterion, or could non-vulnerable states still be experiential?** Neither addresses how the *felt residue* of dreams ("phenomenal debt") challenges both models.  

  ---  

  ### Research Proposal: **Settling Phenomenal Debt: Dreams as Experiences Across the Sleep-Wake Boundary**  

  #### 1. Sharply Stated Research Question  
  *Do the phenomenological residuals of dreaming require settlement as "phenomenal debt", and which account—Malcolm’s denial or Dennett’s narrative assembly—better explains this process while preserving first-person authority and temporal coherence?*  

  #### 2. Why Existing Positions Leave the Question Open  
  Malcolm and Dennett both anchor their arguments to *temporal boundaries* and *correctability*, yet neither reconciles the persistent intuition that dreams *feel* experiential upon waking. Malcolm dismisses dream reports as non-veridical, ignoring why they carry *affective weight* indistinguishable from waking memories. Dennett reduces dreams to confabulated narratives but cannot explain why they manifest with *phenomenal immediacy* during recall, as if repaying a debt. Crucially:  
  - **Malcolm’s gap**: If dreams lack correctability, why do we treat their content as *ours* with the same first-person authority as waking experiences?  
  - **Dennett’s gap**: If dreams are assembled upon waking, why do they often lack the deliberate revision typical of constructed stories (e.g., intrusive dream emotions)?  
  The tension centres on whether *epistemic vulnerability* is necessary for experiential status—or merely sufficient. This remains unresolved, leaving "phenomenal debt" (the unaccounted-for rawness of dream recall) unaddressed.  

  #### 3. Methodological Approach  
  This project adopts staged conceptual analysis over six months, prioritising philosophical rigour for public relevance:  

  - **Phase 1 (Month 1–2): Taxonomy of Experience-Types**  
    Analyse "experience" beyond Malcolm’s perceptual model. Define *phenomenal debt* as the normative claim that conscious states generate residuals requiring integration. Contrast with Dennett’s "disposable fictions".  

  - **Phase 2 (Month 3): Reconstructing Correctability**  
    Test Malcolm’s criterion against edge cases (e.g., hallucinations, non-correctable waking states). Determine if epistemic vulnerability is definitional or contextual.  

  - **Phase 3 (Month 4–5): First-Person Authority at the Boundary**  
    Examine waking reports of dreams: Do they claim direct acquaintance ("I saw") or inference ("It seemed")? Assess if dream authority mimics or differs from waking introspection.  

  - **Phase 4 (Month 6): Evaluating Phenomenal Debt**  
    Model settlement mechanisms: Malcolm’s view implies *debt cancellation* (no experience, thus no debt); Dennett suggests *debt fabrication* (narratives create pseudo-debt). Test which coheres with the phenomenology of recall.  

  **Why Philosophy Over Empirical/Historical Methods?**  
  - Sleep labs identify neural correlates but cannot resolve *categorical* questions about experience.  
  - Pure history retreads well-worn debates. This project innovates by framing correctness through *debt settlement*, offering public value via accessible metaphors for subjective certainty.  

  #### 4. Success and Failure Conditions  
  - **Successful Outcome**: An intermediate taxonomy positioning dreams as *retrospective experiences*: non-correctable during sleep but generating debt settled through first-person authority upon waking. This would:  
    - Uphold Malcolm’s scepticism about *real-time* verifiability.  
    - Accommodate Dennett’s narrative elements without denying phenomenality.  
    - Explain phenomenal debt as the cost of integrating non-verifiable states into autobiographical memory.  

  - **Failure Conditions**:  
    - *Conceptual collapse*: If "debt" merely restates existing problems (e.g., conflating it with memory decay).  
    - *Redundancy*: If settlement adds nothing to Malcolm/Dennett.  
    - *Overreach*: Framing debt as empirically solvable (e.g., via neuroimaging).  

  #### 5. Scope Assessment  
  **Tractable Elements (6-month focus)**:  
  - Strict adherence to conceptual analysis of Malcolm/Dennett.  
  - Isolating "correctability" and "first-person authority" as testable criteria.  
  - Developing phenomenal debt as a normative framework, not a scientific model.  

  **Risks of Overreaching**:  
  - *Neuroscience*: References to memory consolidation or REM sleep must remain illustrative, not evidential.  
  - *Predictive Processing*: Invoking "generative models" to explain narrative assembly would require untestable commitments.  
  - *Consciousness Theories*: Broad debates (e.g., global workspace) will be bracketed unless directly relevant to correctability.  

  **Mitigation Strategy**: Anchor all arguments to the epistemic tension between Malcolm and Dennett. The sleep-wake boundary provides a natural limit: if the debt model fails here, it fails entirely.  

  ---  
  **Conclusion**: This project resolves a 60-year stalemate by treating dreams not as *either* experiences *or* fictions, but as phenomena demanding *settlement*—a framing with broad implications for debates on memory, identity, and the metaphysics of consciousness. By rigorously analysing phenomenal debt, it delivers public-facing philosophy that speaks to the universal puzzle: *Why do dreams feel like they happened to us?*
