prompt: |-
  I am an undergraduate reading political theory, and in our seminars on democratic legitimacy I have observed a recurring argumentative move that I struggle to classify precisely. A populist figure asserts that democratic institutions — elections, courts, administrative bodies — possess authority only when they function as transparent channels for 'the will of the people'. When an institutional decision coincides with the figure's position, it is presented as direct, unmediated proof of that will; when it conflicts, the very same institution is dismissed as a distorting apparatus — captured by elites, corrupted by procedural rules, or structurally alienated from the people — so that the true will is said to lie hidden behind it. Notably, the figure offers no independent mechanism by which this hidden will could be ascertained, nor any account of its specific content apart from the figure's own policy preferences. The asymmetry is therefore complete: agreement with the speaker renders an institution epistemically transparent, disagreement renders it systematically opaque, with no consistent criterion of legitimacy that does not ultimately reduce to the speaker's own judgement.

  I am familiar with the literature on populism as a 'thin-centred ideology', with Schmittian distinctions between a homogeneous people and pluralistic state structures, and with recent work on the epistemic claims of populist movements — for example, the idea that ordinary citizens possess a direct, non-inferential grasp of political truth. Yet none of these quite isolates the pattern I am describing, especially the absence of any positive alternative procedure or representational theory. Is there an established concept that captures this specific asymmetrical appeal to popular sovereignty? If so, please take a committed position: identify the single best-fitting concept and defend that identification rigorously, explaining exactly why Schmittian decisionism and epistemic populism are inadequate descriptions of the move, and marking the boundary conditions that distinguish it from ordinary strategic hypocrisy. If, on the other hand, you judge that no established term fits, then coin a precise term with a rigorous definition and defend that judgement against the nearest alternatives, specifying where the phenomenon begins and ends. Please answer in British English, and do not merely survey options — argue for one.
reasoning: |-
  Okay, the user is an undergraduate in political theory grappling with a specific argumentative pattern in populist rhetoric. They've noticed a troubling asymmetry: populist figures treat institutions as legitimate only when they agree with their own positions, dismissing them as corrupt or elitist when they disagree. The user is familiar with concepts like thin-centred ideology, Schmittian decisionism, and epistemic populism but finds them insufficient to capture this exact move. They want either an established concept that fits perfectly or a newly coined term with a rigorous definition.

  Hmm, this is a sophisticated observation. The core issue is the epistemological inconsistency—populists claim institutions are transparent when aligned with them but opaque when not, without offering any independent verification method. Let me mentally scan the literature. Schmittian decisionism focuses on the sovereign's authority to suspend norms during emergencies, which doesn't address this institutional cherry-picking. Epistemic populism assumes the people have inherent political wisdom, but here the "people's will" is only knowable through the leader's pronouncements. Neither fits.

  *Pauses to consider alternatives* What about "performative sovereignty"? It captures how the leader's speech acts define legitimacy dynamically, but it might overemphasize theatricality while underplaying the institutional hypocrisy. The closest existing term I recall is "hegemonic appropriation of popular sovereignty," but it's too clunky and broad. 

  *Reframes the problem* This is fundamentally about monopolizing interpretive authority over the people's will. The leader positions themselves as the sole conduit—a "ventriloquist" making the people "speak" only through them. But "ventriloquism" is metaphorical. Perhaps "populist epistemic monopoly" gets closer, emphasizing the control over knowledge claims. 

  *Tests the concept* Wait—does this explain the asymmetry? Yes: the monopoly is maintained by denying institutions' capacity to access truth except when echoing the leader. It distinguishes from mere hypocrisy by being a systematic epistemological claim rather than ad hoc inconsistency. The boundary conditions are clear: (1) authority derived from exclusive access to popular will, (2) no independent verification mechanism, (3) institutional legitimacy contingent on alignment with the leader. 

  *Anticipates objections* Couldn't this just be strategic hypocrisy? No—hypocrisy is about concealed double standards, whereas here the asymmetry is rhetorically consistent as an epistemological principle. The leader doesn't hide the double standard; they frame it as revelation of institutional corruption versus authenticity. 

  *Finalizes term* "Epistemarch" (episteme + archon) is tempting but obscure. "Interpretive hegemony" exists but is Marxist-loaded. The simplest accurate label is **Populist Epistemic Monopoly**. It nails the core: monopolizing the right to declare what counts as the people's will, reducing all legitimacy claims to the leader's epistemic authority. 

  *Prepares defense* Against Schmitt: no state of exception invoked. Against epistemic populism: no claim about innate popular wisdom—only the leader can decode it. The novelty is the total collapse of institutional legitimacy into the leader's judgment without theoretical scaffolding. 

  *Checks user's needs* They wanted British English, committed stance, and rigorous boundaries—addressed. They'll appreciate the coinage being grounded in classical roots (monos + polein) while clearly demarcating it from adjacent concepts. The "monopoly" metaphor powerfully conveys the anti-pluralism.
answer: |-
  Your observation identifies a particularly insidious rhetorical manoeuvre in contemporary populist practice. After rigorous analysis, I contend that **Populist Epistemic Monopoly** is the most precise conceptualisation of this phenomenon. Allow me to defend this position by critiquing alternatives, defining the concept, and demarcating its boundaries.

  ### Why Established Concepts Fall Short
  1.  **Schmittian Decisionism (Carl Schmitt):**  
      Schmitt posits the sovereign as he who decides the exception, standing *outside* the legal order to suspend it. Your described figure, however, operates *within* institutional discourse. They don't suspend procedures but selectively validate or invalidate them based on outcomes. Schmitt’s sovereign transcends normative legitimacy; your populist *appropriates* legitimacy claims by declaring institutions either transparent conduits or corrupt filters. The asymmetry isn’t rooted in existential sovereignty but in a claimed monopoly on interpreting popular authenticity.

  2.  **Epistemic Populism (e.g., Nadia Urbinati, Jan-Werner Müller):**  
      While epistemic populism asserts "the people" possess unique political truth, your case exhibits a critical divergence: the populist figure positions themselves not as a *witness* to popular wisdom but as its *sole authorised interpreter*. Epistemic populism typically implies a collective intuition; here, the "will of the people" has no content independent of the leader’s pronouncements. The people’s epistemic authority is entirely ventriloquised.

  3.  **"Thin-Centred Ideology" (Cas Mudde):**  
      This describes populism’s adaptability but doesn’t isolate the *epistemological asymmetry* you’ve identified. The core move isn’t ideological thinness but the monopolisation of legitimacy-assessment through a flexible epistemology.

  ### The Case for "Populist Epistemic Monopoly"
  **Definition:**  
  *A rhetorical and legitimising strategy whereby a political actor claims exclusive authority to determine when democratic institutions authentically express "the will of the people." Institutional outputs are deemed legitimate only when congruent with the actor’s position, dismissed as systematically distorted when incongruent. The actor provides no consistent, verifiable method for discerning this "will" beyond their own assertions, rendering their judgement the sole criterion of democratic legitimacy.*

  **Core Mechanism:**  
  The monopoly operates through two simultaneous, self-reinforcing claims:
  1.  **Epistemic Exclusivity:** Only the populist can reliably access the "true" popular will (rendering institutions mere transmission belts when aligned).
  2.  **Institutional Contingency:** Institutions possess no inherent legitimacy; their authority is entirely conditional upon producing outputs the populist deems authentic.

  ### Boundary Conditions: Distinguishing from Strategic Hypocrisy
  Ordinary political hypocrisy involves inconsistent *application* of principles for tactical gain (e.g., decrying deficit spending in opposition but embracing it in government). **Populist Epistemic Monopoly** is distinct:
  1.  **Systematic Epistemic Claim:** The asymmetry isn’t concealed but *framed as an epistemological principle*. Institutions are *inherently* corruptible filters unless validated by the monopolist. This is presented as a revelatory insight, not mere opportunism.
  2.  **Absence of Alternative Legitimacy Criteria:** No positive theory of representation or institutional design is offered to replace the "distorted" system. Legitimacy resides solely in the monopolist’s ratification.
  3.  **Self-Sealing Justification:** Disagreement with the monopolist *proves* institutional corruption/capture. Agreement proves transparency. The system immunises itself against empirical counter-evidence.
  4.  **Erosion of Institutional Autonomy:** Unlike hypocrisy (which operates *within* a shared framework of institutional legitimacy), the monopoly actively *denies* institutions any independent authority, subordinating them entirely to the leader’s interpretive fiat.

  ### Why This Concept Fits Best
  1.  **Captures the Epistemic Core:** It centres the *knowledge claim* ("I alone can discern the real will") as the mechanism enabling institutional cherry-picking.
  2.  **Highlights the Monopoly:** Emphasises the exclusion of pluralistic deliberation, rival interpretations, or objective verification mechanisms.
  3.  **Explains the Asymmetry:** The monopolist’s judgement isn’t just a preference; it becomes the *constitutive act* determining an institution’s legitimacy at any given moment.
  4.  **Avoids Over-Extension:** It applies *specifically* to actors invoking popular sovereignty while denying institutions any stable legitimacy criteria beyond their own approval. It doesn’t cover, for example, authoritarian leaders who reject popular sovereignty outright.

  ### Conclusion
  "Populist Epistemic Monopoly" rigorously isolates the phenomenon you describe: the establishment of an unchallengeable personal authority to validate or nullify democratic institutions based on self-referential claims about an unknowable "popular will." It transcends Schmitt (by operating *through* legitimacy discourse rather than suspending it), epistemic populism (by replacing collective intuition with leader-as-sole-oracle), and thin-centred ideology (by specifying the *operational mechanism* of asymmetry). Crucially, it distinguishes itself from mere hypocrisy by its systematic, self-justifying epistemology that actively dismantles institutional autonomy. This monopoly doesn’t just manipulate institutions; it seeks to render them epistemically dependent on the populist figure, hollowing out democracy’s pluralist foundations.
