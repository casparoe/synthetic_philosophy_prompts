answer: |-
  Here's a joke following your specifications:

  A constructivist mathematician reluctantly attends a formal dinner party. After the main course, the host, eager for intellectual entertainment, announces: "Our esteemed guest is an expert on the Axiom of Choice! Perhaps he could *demonstrate* that fascinating Banach-Tarski duplication result for us? Just a small ball, and presto – two identical ones! We'll clear the dessert plates!"

  The constructivist pales slightly. "Ah," he begins hesitantly, "while the theorem guarantees such a partition *exists* under the Axiom of Choice... demonstrating it presents a... practical challenge."

  The host waves a dismissive hand. "Nonsense! We have knives! We have space! Just show us how to cut the ball into those few special pieces!"

  The constructivist sighs deeply. "It's not the cutting, nor the moving and reassembling, that's the insurmountable obstacle tonight."

  "Then what is?" asks the host, perplexed.

  "The fundamental issue," the constructivist explains, his voice firming with conviction, "is that I cannot possibly *show* you which specific points belong to *which* piece in the partition *without* first specifying an explicit choice function for infinitely many sets simultaneously. The Axiom tells us such a selection *exists*, but it doesn't provide a *rule* telling me *how* to pick, point by point, which piece each one goes into. Without that explicit recipe for the partition itself, I simply cannot point to the pieces I'm supposed to cut out. Asking me to demonstrate Banach-Tarski without supplying the choice function is like asking me to hand you a particular sock from infinitely many identical pairs in the dark, while insisting I never specify *which* sock I grabbed from *which* pair."

  **Why it works:**

  1.  **Core Tension:** The punchline directly addresses the non-constructive nature of AC ("cannot... *show* you", "without first specifying an explicit choice function", "doesn't provide a *rule*", "cannot point to the pieces") as the barrier, specifically contrasting it with the host's request to *demonstrate* the geometrically implausible result ("cut the ball", "show us how").
  2.  **Banach-Tarski Context:** The setup clearly invokes BT ("duplication result", "small ball... two identical ones", "partition", "cutting", "moving and reassembling", "pieces").
  3.  **Refusal Focus:** The refusal ("I simply cannot point to the pieces") is explicitly grounded in the lack of an explicit choice function needed to define the partition ("without that explicit recipe for the partition itself"), not the geometric impossibility or physical absurdity of reassembly. The sock analogy reinforces the "picking without a rule" aspect of AC.
  4.  **Accessibility:** Uses only basic concepts: AC (selecting from sets without a rule), infinite families, partitioning a set (the ball), moving pieces rigidly, and the existence vs. explicit construction distinction. No named theorems or figures beyond AC and BT.
  5.  **Dinner Party Frame:** Provides a relatable social context for the unreasonable request and the awkward refusal.
