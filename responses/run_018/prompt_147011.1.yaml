  ### Workshop Design: Chaos, Predictability, and Determinism  
  **Duration:** 90 minutes  
  **Participants:** 16 advanced philosophy students (graduate/upper-level undergraduates)  
  **Objective:** Demonstrate that exact deterministic laws + approximately correct initial conditions are structurally insufficient for medium-term prediction due to sensitive dependence on initial conditions (chaos).  

  ---

  ### **Preparation**  
  - **Materials:**  
    - Worksheets (one per team) with the rule \( x_{n+1} = 4x_n(1 - x_n) \) and space for 8 iterations.  
    - Symbolic tokens (e.g., poker chips; 3 per team).  
    - Sealed envelope with hidden true initial value \( x_0 = 0.40017 \) (for Round 1).  
    - Calculator (facilitator only; high-precision for true trajectories).  
    - Display board for revealing trajectories.  
  - **Pre-compute** true trajectories for \( x_0 = 0.40017 \) (Round 1) and team-specific initial values (Round 2) using high precision.  
  - **Divide participants** into 4 teams of 4.  

  ---

  ### **Round 1: The Laplacean Bet** (25 min)  
  **Goal:** Teams apply a deterministic law with near-perfect initial knowledge but fail due to rounding (measurement resolution).  
  1. **Introduction (5 min):**  
     - Explain the rule: \( x_{n+1} = 4x_n(1 - x_n) \).  
     - **Initial condition:** All teams use \( x_0 = 0.4000 \) (rounded to 4 decimals).  
     - **Protocol:** Compute iterations 1–8. Round **each result to 4 decimals** (simulates measurement resolution).  
     - **Wager:** Teams bet 3 tokens on whether their \( x_6 \) will match the hidden "World Engine" trajectory (from \( x_0 = 0.40017 \)). Seal predictions.  

  2. **Computation (15 min):**  
     - Teams calculate manually.  
     - *Facilitator:* Monitors, ensures rounding compliance.  

  3. **Reveal (5 min):**  
     - Unseal the envelope; reveal true \( x_0 = 0.40017 \) and true trajectory (pre-computed).  
     - **Token awards:**  
       - Full (3 tokens): \( |\text{team } x_6 - \text{true } x_6| \leq 0.05 \).  
       - Partial (1 token): \( 0.05 < |\text{diff}| \leq 0.2 \).  
       - None: Otherwise.  
     - **Expected outcome:** Teams are close at \( x_2 \), diverge visibly by \( x_5 \), and scatter by \( x_8 \) (see table below).  

  | Iteration | Team \( x_n \) (0.4000) | True \( x_n \) (0.40017) |  
  |-----------|--------------------------|---------------------------|  
  | 0         | 0.4000                   | 0.4002                   |  
  | 1         | 0.9600                   | 0.9601                   |  
  | 2         | 0.1536                   | 0.1531                   |  
  | 3         | 0.5200                   | 0.5188                   |  
  | 4         | 0.9984                   | 0.9987                   |  
  | 5         | 0.0064                   | 0.0052                   |  
  | 6         | 0.0254                   | 0.0207                   |  
  | 7         | 0.0990                   | 0.0812                   |  
  | 8         | 0.3568                   | 0.2986                   |  

  ---

  ### **Round 2: The Shadowing Round** (20 min)  
  **Goal:** Teams with identical care and law, but slightly different initial conditions, scatter due to chaos.  
  1. **Setup (5 min):**  
     - Same rule and rounding.  
     - Assign each team a unique initial value (displayed as 4 decimals):  
       - Team 1: 0.4000  
       - Team 2: 0.4001  
       - Team 3: 0.3999  
       - Team 4: 0.4002  
     - Compute iterations 1–8.  

  2. **Computation (10 min):**  
     - Teams calculate.  

  3. **Reveal (5 min):**  
     - Display all teams’ trajectories and the true trajectory (\( x_0 = 0.40017 \)).  
     - **Expected outcome:**  
       - Teams diverge from true trajectory *and* each other by \( x_4 \).  
       - By \( x_7 \), values scatter across [0, 1] (e.g., Team 1: 0.3568, Team 2: 0.3421, Team 3: 0.4010, Team 4: 0.2915).  

  ---

  ### **Debrief** (35 min)  
  **Goal:** Conceptualize the structural failure of predictability.  

  1. **Mapping the Activity (15 min):**  
     - **Round 1 = Ontological determinism vs. epistemic predictability:**  
       - Teams had the *exact law* and *near-perfect initial condition* yet failed. Why?  
       - **Rounding as measurement resolution:** Emphasize this is not human error but inherent limits of empirical agents.  
     - **Round 2 = Sensitive dependence on initial conditions:**  
       - Tiny differences (\(\sim\)0.0001) scattered trajectories despite identical laws and care.  
       - **Key insight:** Determinism governs each path, but no finite-resolution agent can "shadow" truth beyond short horizons.  

  2. **Introduce the "Epistemic Lyapunov Horizon" (10 min):**  
     - Define: The iteration/time boundary beyond which sensitive dependence makes prediction impossible, regardless of law-knowledge.  
     - **Activity:** Teams annotate worksheets where their predictions visibly broke from truth (e.g., \( x_4 \)–\( x_5 \)).  
     - **Facilitator note:**  
       - Discrete steps simplify the demo; in continuous systems, the horizon is a *time* parameter (e.g., weather prediction ~10 days).  

  3. **Addressing Pitfalls (10 min):**  
     - **Blame calculation errors?** Display all worksheets side-by-side: Show consistent divergence *patterns* (not random errors).  
     - **"Fixing" the rule?** Let teams suggest corrections (1 min), then:  
       - Demo: Even with "corrected" approximations, rounding still causes divergence.  
       - **Reinforce:** Failure is structural (resolution limits), not model misspecification.  

