  ### **Facilitator Notes**  
  - **Honest Limitations:**  
    - This is discrete, finite-step chaos (no continuous flows, measure theory, or formal Lyapunov exponents).  
    - **Not covered:** Free will, quantum indeterminacy, or moral responsibility. Focus: Determinism ≠ predictability.  
  - **Predictable Issues & Mitigation:**  
    - Initial denial of structural failure: Use side-by-step worksheet comparisons to reveal divergence patterns.  
    - Over-engineering: Gently redirect from "fixing" math to philosophical implications (e.g., "What does this say about Laplace's demon?").  
  - **Logistics:**  
    - No computers/citations needed.  
    - Pre-compute true values to 8 decimals for accuracy.
