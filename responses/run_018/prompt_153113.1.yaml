prompt: |-
  I have been thinking on my own about how relying on AI for explanations might not merely replace individual knowledge but erode a specific kind of understanding: the internal model one builds when one can explain a thing oneself. I want to lead a single ninety-minute session for a small group of intelligent, non-specialist friends who use large language models regularly for work but have no background in philosophy, cognitive science, or technology studies. Rather than asking for a lecture, I need a teaching plan that lays out the explanatory arc. The central claim I want them to grasp is that there is a meaningful distinction between using a tool to extend one's own reasoning and outsourcing judgment to it, and that the latter produces a particular erosion in which one stops constructing a mental model of the domain and instead maintains a kind of proxy model that tracks what the system would say. To build this, please specify: which preliminary idea must be established before the distinction between extension and outsourcing can even be intelligible to them; the single concrete, non-obvious example or scenario that should carry the session and what properties it must have and lack; the predictable misconceptions they will arrive with or form during the discussion—including, I anticipate, the belief that being able to verify an AI's output is sufficient for understanding, and the analogy to calculators or search engines—and the precise point in the sequence where each should be headed off; what should be deliberately excluded at this level and acknowledged as such; and one focused question I can pose at the end that would reveal whether they have understood the erosion mechanism itself rather than merely adopted a vague skepticism about AI. The plan should be formal about the dependency order and should not include bibliographies, reading lists, or references to specific scholars.
reasoning: |-
  Okay, the user wants to create a teaching session about the difference between using AI as a tool to extend reasoning versus outsourcing judgment to it, leading to the erosion of personal mental models. They need a structured 90-minute plan for non-specialists who regularly use AI but lack background in philosophy or cognitive science. 

  First, I need to establish what preliminary concept is necessary before introducing the extension vs. outsourcing distinction. The key foundation is understanding mental models themselves—how humans build internal representations to navigate the world. Without this, the distinction won't land. I'll start with relatable examples like navigating a neighborhood or understanding a microwave.

  For the core example to carry the session, it needs to be concrete, non-technical, and show the invisible cost of outsourcing. A medical diagnosis scenario fits well: comparing Dr. Lee who uses AI as a reference (extension) versus Dr. Avery who accepts outputs without integration (outsourcing). The example must involve complexity beyond simple facts, require judgment, and have high stakes to emphasize the consequences of not building a mental model. Crucially, it should lack technical jargon and avoid black-box AI behavior to keep focus on the user's cognitive process.

  The user anticipates misconceptions, especially that verifying AI output equals understanding and false analogies to calculators or search engines. These need to be addressed head-on during the group analysis of the medical example. Verification should be debunked by showing how superficial checks miss deeper understanding, while analogies should be countered by highlighting the unique judgment-offloading aspect of LLMs versus computational tools.

  I should deliberately exclude topics like AI ethics, existential risk, and technical explanations of how LLMs work. The focus stays purely on the cognitive impact. 

  For the closing question to test understanding of the erosion mechanism, I'll ask them to design a personal strategy for using AI that prevents outsourcing—forcing them to articulate concrete behaviors that maintain mental model building. If they can do this, they've grasped the core concept beyond vague skepticism.

  The session flow must be tight: establish mental models (20 mins), contrast the two doctors with active discussion (40 mins), generalize the distinction (15 mins), and end with the application question (15 mins). Timing is critical in 90 minutes. 

  The user's deeper need seems to be fostering critical self-awareness in their peers about passive AI reliance. They're not just teaching a concept but trying to change behavior. The plan should leave participants unsettled about their own habits but empowered with a framework to audit them. I'll make sure the tone avoids alarmism while being clinically precise about the cognitive toll.
answer: |-
  Here’s a focused teaching plan for your 90-minute session, structured to build the core concept step-by-step:

  **Core Claim:** Over-reliance on AI for explanations erodes the construction of personal mental models, replacing them with "proxy models" (knowing *what the AI would say* without understanding *why*).

  ---

  ### **Teaching Plan: The Erosion of Understanding**

  **Phase 1: Establish Foundation (20 mins)**  
  *Goal: Anchor "mental models" as a tangible, personal process.*  
  - **Activity:** Ask participants to *silently* recall how they learned a complex skill (e.g., cooking a dish, using software). Pose:  
    *"What steps did you take internally to troubleshoot when things went wrong?"*  
  - **Key Insight:** Highlight that "understanding" isn’t just having answers—it’s the **internal framework** they built to *generate* answers, predict outcomes, and adapt. Use whiteboard notes:  
    `Mental Model = Internal map of relationships/causes + ability to simulate outcomes`  
  - **Critical Preliminaries:**  
    - Humans build mental models instinctively (e.g., knowing a city’s layout vs. memorizing turn-by-turn GPS instructions).  
    - *Exclude:* Neuroscience/cognitive theory. Keep it experiential.  

  **Phase 2: The Core Example & Distinction (40 mins)**  
  *Goal: Contrast "extension" vs. "outsourcing" using a concrete scenario.*  
  - **Scenario: Medical Triage Assistant**  
    *Context:* Participants imagine they’re non-medical staff at a remote clinic using an AI tool to assess patient symptoms.  
    - **Version 1 (Extension):**  
      *AI provides possible diagnoses + key indicators (e.g., "Likely Condition X; check for Y symptom").*  
      → User cross-references with basic medical guide, notices AI didn’t mention symptom Z. *They adjust.*  
    - **Version 2 (Outsourcing):**  
      *AI outputs a diagnosis with high confidence. User relays it verbatim without probing.*  
      → Later, patient worsens. User can’t explain *why* the diagnosis made sense initially.  
  - **Properties of the Scenario:**  
    - **Must have:** Ambiguity (symptoms overlap multiple conditions), stakes (misdiagnosis harms), and need for iterative judgment.  
    - **Must lack:** Obvious AI errors (e.g., hallucinations). Focus on *incomplete* but plausible outputs.  
  - **Group Analysis Questions:**  
    1. *"In Version 1, what did the user *do* with the AI’s output?"* → **Integration** (tested against own knowledge).  
    2. *"In Version 2, what *stopped* the user from building their own assessment?"* → **Deferred judgment** (accepted output as endpoint).  
    3. *"Could the user in Version 2 *explain* the diagnosis to a colleague? What would that explanation sound like?"* → Reveals proxy model ("The AI said it’s X because of Y").  

  **Phase 3: Combat Misconceptions (15 mins)**  
  *Address these as they arise in discussion or proactively during Phase 2:*  
  - **Misconception 1:** *"Verifying the AI’s output = understanding."*  
    - **Counter:** Ask: *"If you fact-check an AI explanation of quantum physics using Wikipedia, do you *understand* quantum physics? Or do you understand how to verify facts?"* → Emphasize: Verification tests accuracy, not model-building.  
    - **Place:** During Phase 2, after contrasting the two clinic versions.  
  - **Misconception 2:** *"This is just like calculators/search engines."*  
    - **Counter:** Calculators extend computation; they don’t *replace conceptual learning* (e.g., you still need number sense). Search engines provide sources to evaluate; AI provides synthesized answers *as endpoints*.  
    - **Place:** When introducing the core example (preemptively).  

  **Phase 4: Generalize the Erosion (10 mins)**  
  - **Diagram:**  
    `Tool Extension (e.g., calculator)` → **Augments** mental model.  
    `Outsourcing (e.g., uncritical AI use)` → **Replaces** mental model with proxy ("What would GPT say?").  
  - **Key Metaphor:**  
    *"Using AI as a 'crutch' weakens the 'muscle' of building your own explanations."*  

  **Phase 5: The Revealing Closing Question (5 mins)**  
  *Goal: Test grasp of the erosion mechanism.*  
  - **Question:**  
    *"Imagine you use AI daily to explain complex reports to your team. How could you adjust your workflow to ensure you’re still *building* your own mental model of the subject—not just memorizing the AI’s phrasing?"*  
  - **What reveals understanding:**  
    - Strong answers focus on **process** (e.g., "I’d restate explanations in my own words *before* using AI, then compare gaps").  
    - Weak answers focus on **accuracy** (e.g., "I’d check more sources") or **avoidance** (e.g., "I’d use AI less").  

  ---

  ### **Deliberate Exclusions**  
  - **Technical AI details** (how LLMs work, training data).  
  - **Philosophical debates** (e.g., "What is understanding?").  
  - **Ethics of automation/job loss.**  
  *Acknowledge upfront:** "We’re focusing only on the *cognitive impact* of reliance—not whether AI *should* be used."  

  ### **Why This Sequence Works**  
  1. **Mental models** (Phase 1) make the distinction between extension/outsourcing *meaningful*.  
  2. The **medical triage scenario** forces confrontation with judgment under uncertainty—where proxy models fail.  
  3. **Misconceptions** are reframed using the group’s analysis of the example (not abstract debate).  
  4. The **closing question** isolates the erosion mechanism by demanding a *cognitive safeguard*.  

  This plan avoids theory-heavy tangents and leverages participants’ experience with practical AI use, making the erosion of understanding visceral. The emphasis on *process* (what you *do* with the AI) keeps it actionable.
