  Distinctions like moral vs. prudential risk: moral risks might demand caution. Status vs. weight—whether something is included at all versus how much it counts. Cognitive constraints: humans can't compute infinitesimal probabilities, so the theory must handle that.

  Now, conflicts. For instance, avoiding fanaticism (ignoring tiny probabilities) might conflict with convergence to EV in repeated trials. If a theory discounts tiny probabilities too much, it might not handle St. Petersburg repetitions correctly. Also, institutional rules needing consistent application could clash with context-specific judgments in one-off decisions.

  Scoring existing approaches: Straight EV fails with Pascal's Mugging and computability. Risk-weighted with cutoff avoids fanaticism but might not handle repetition well. Satisficing with thresholds is cognitively realistic but may lack consistency in institutions.

