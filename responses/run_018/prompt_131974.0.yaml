answer: |-
  Here's the full spec - the assignment we'd scribble on a coffee-stained napkin. Think of this as the "must-pass" tests for a decision theory that dodges EV fanaticism without wimping out. We're grading on handling edge cases, preserving key distinctions, and not demanding superhuman cognition.

  **I. The Gauntlet: Cases It Must Handle (Without Melting Down)**

  1.  **Pascal's Mugging (Hard):**
      *   **Case:** Mugger claims they'll torture 3↑↑↑3 people unless you hand over $5. Credibility: 1/3↑↑↑3.
      *   **Test:** Theory must *not* compel you to pay based on astronomical stakes compensating for infinitesimal probability alone. Must allow reasonable dismissal.
      *   **Negotiability:** Hard. Collapsing here *is* fanaticism.

  2.  **St. Petersburg Repetition (Hard):**
      *   **Case:** Facing *many* independent St. Petersburg lotteries (infinite EV, tiny prob of huge payoff). Or the village clinics: applying the same rule ("fund iff EV > cost") across 10,000 identical, independent clinics.
      *   **Test:** Theory must *eventually converge to EV-like behavior* over sufficiently many independent trials. Ignoring tiny-probability gains/losses entirely *every single time* becomes indefensible in aggregate. Must bridge the micro-macro gap.
      *   **Negotiability:** Hard. Failure here is cowardice or myopia.

  3.  **Climate Policy Aggregation (Moderate):**
      *   **Case:** Evaluating policies with tiny estimated probabilities of catastrophic outcomes (e.g., runaway warming feedback loops) vs. near-certain large costs of mitigation spread over generations.
      *   **Test:** Theory must handle deep uncertainty, very long time horizons, and aggregation of diffuse, low-probability/high-impact tail risks *without* collapsing into paralysis or requiring absurd precision. Must allow for precaution without mandating infinite sacrifice.
      *   **Negotiability:** Moderate. The *how* is open, but must produce non-disastrous guidance under uncertainty.

  4.  **Institutional Rules vs. One-Off Bets (Hard):**
      *   **Case:** Designing a hospital funding rule (applied consistently) vs. making a single, massive bet with your life savings. A rule might *never* fund asteroid deflection, but a unique, well-characterized opportunity *might* justify it for a specific actor.
      *   **Test:** Theory must distinguish between context. Rules need robustness, predictability, and avoidance of systemic ruin. One-off bets allow more contextual flexibility and potentially higher risk tolerance for that specific agent. Must *not* force identical treatment.
      *   **Negotiability:** Hard. Collapsing the distinction leads to either reckless institutions or paralyzingly timid individual action.

  **II. The Distinctions It Can't Smudge**

  1.  **Moral Risk vs. Prudential Risk (Hard):**
      *   **Case:** Betting *your own* life savings on a long-shot (prudential) vs. betting *others' lives* (e.g., withholding proven medicine from a population for a speculative cure with higher EV) (moral).
      *   **Test:** Theory must allow for greater caution when imposing risks *on others* (especially catastrophic/unconsented ones) vs. risks borne by the decision-maker. Cannot reduce all risk to a single "disutility" metric without ethical loss.
      *   **Negotiability:** Hard. Ethical core.

  2.  **Having Status vs. How Much Weight (Moderate):**
      *   **Case:** Does the *mere possibility* of an outcome (e.g., human extinction) enter the calculation differently than *how probable* we judge it to be? Does it demand *some* precautionary response even if probability is deemed near-zero?
      *   **Test:** Theory must allow outcomes to have a kind of "threshold status" influencing *how* they are evaluated or *if* they get a seat at the table, distinct from just multiplying probability and utility. Cannot *only* rely on the p*u product.
      *   **Negotiability:** Moderate. Theories can differ *how* status is implemented (e.g., lexical thresholds, priority views), but ignoring it entirely seems inadequate for extreme cases.

  **III. Cognitive & Practical Constraints (Hard)**

  1.  **Computable Probabilities / Accessible Uncertainty:**
      *   **Case:** Assigning a meaningful probability to "alien AI turns Jupiter into paperclips in 500 years." Or the Mugger's credibility.
      *   **Test:** Theory **cannot require** agents to compute, represent, or base decisions on probabilities they demonstrably *cannot* access or estimate meaningfully (e.g., beyond a certain level of precision or for truly speculative hypotheses). Must function under "deep uncertainty" or Knightian uncertainty.
      *   **Negotiability:** Hard. Demands the impossible = useless theory.

  **The Tensions (Where Things Get Ugly):**

  *   **Pascal's Mugging Dismissal vs. St. Petersburg Repetition Convergence (HARD):** This is the core tension. How do you dismiss the Mugger *this once* without a principle that also forces you to pass up aggregated massive gains/losses over many St. Petersburg trials? Any "discount tiny probabilities" rule strong enough to handle the Mugger risks sabotaging repetition. Any rule weak enough to allow convergence risks forcing you to pay the Mugger.
  *   **Institutional Caution vs. One-Off Flexibility:** A theory optimized for robust rules might be too rigid for unique, high-stakes opportunities. One optimized for contextual one-off bets might create fragile, exploitable institutions.
  *   **Moral Risk Precaution vs. Computability:** Insisting on heavy precaution for tiny-probability moral catastrophes can push you back towards demanding assessments of probabilities you admit are fundamentally uncomputable.

  **Quick & Dirty Scorecard (Focus on Criteria Fit):**

  1.  **Straight EV Maximization:**
      *   *Fails:* Pascal's Mugging (fanaticism), Computability (demands impossible precision), Moral Risk (treats all risks the same), Institutional Rules (can mandate reckless systemic risks).
      *   *Passes:* St. Petersburg Repetition (by design), Aggregation (in theory, but inputs are the problem).
      *   *Verdict:* Brilliant benchmark, cracks catastrophically on edge cases and human reality.

  2.  **Risk-Weighted Utility (e.g., with Probability Cutoff/Discounting):**
      *   *Fails:* St. Petersburg Repetition (if cutoff/discount is too strong, misses aggregation; if too weak, pays Mugger), Institutional vs. One-Off (often static weighting).
      *   *Potentially Passes:* Pascal's Mugging (if cutoff works), Computability (can ignore uncomputable probs), Moral Risk (weighting can be adjusted).
      *   *Verdict:* Addresses fanaticism head-on, but the *how* of weighting is critical and risks failing repetition or being arbitrary. The cutoff parameter is a band-aid over the core tension.

  3.  **Satisficing + Thresholds (Behavioral Rules):**
      *   *Fails:* St. Petersburg Repetition (satisficing each trial ignores massive aggregate EV), Pure Aggregation (may not adequately sum tiny tail risks).
      *   *Potentially Passes:* Pascal's Mugging (ignore below-threshold options), Computability (focuses on "good enough"), Institutional Rules (embodied in thresholds), Moral Risk (thresholds can reflect status).
      *   *Verdict:* Psychologically plausible, great for rules and avoiding ruin. Struggles *massively* with aggregating small gains/losses over many instances or long time horizons – the repetition case is its kryptonite. May be "cowardly" in its neglect of aggregation.

  **The Takeaway for Your Researcher:**

  The mission is impossible on paper. Any theory robust enough to dismiss the Mugger and handle uncomputable probabilities risks failing the repetition test and looking myopic. Any theory disciplined enough to converge over many trials risks buckling to fanaticism in single-shot, high-stakes, uncertain cases. The real art isn't finding a perfect solution, but **managing the trade-offs transparently** – knowing *which* bullet you're biting in which context (Institutional? One-off? Repeated? Deep Uncertainty?), and building that context-sensitivity into the theory itself without making it arbitrary. The winner has to walk the tightrope between fanaticism and cowardice, knowing a strong gust (an edge case) could knock it off either side. Good luck with the coffee... and the theory.
