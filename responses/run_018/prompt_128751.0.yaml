  V
  3. Anomaly Characterization:
     - State-dependent? (triggers: stress, fatigue, etc.)
     - Context-dependent? (changes with environment/activity)
     - Modifiable? (responds to distraction, relaxation, etc.)
     - Functional impact? (mild, moderate, severe)
     |
     |-- If state-dependent, context-dependent, modifiable, and mild-moderate impairment --> Interface-level
     |-- If persistent, not context-dependent, unmodifiable, and severe impairment --> Architecture-level (but note: we already ruled out psychosis in step 2, so this might be rare. Alternatively, if we see severe impairment without psychosis, it might be a mixture.)
