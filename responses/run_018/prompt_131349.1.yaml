answer: |-
  Here's a conceptual specification (desiderata) for a theory of transgenerational collective guilt, based on your requirements and the inherent tensions of the problem:

  **Core Desiderata (Conceptual Foundations):**

  1.  **Guilt-Reparation Distinction (Non-Negotiable):**
      *   **Requirement:** Must rigorously distinguish between (a) *being guilty* (bearing moral blame/responsibility for a past wrongful act) and (b) *being liable* (having an obligation to repair the harms or wrongs caused by that act).
      *   **Motivating Case:** The core debate itself (Germany's *guilt* vs. *reparations*). Confusing these collapses moral condemnation with practical obligation, weakening both concepts. A state/citizenry might legitimately owe reparations *because* of a past collective act, without current members *being guilty* of that act.
      *   **Negotiability:** Non-negotiable for a coherent theory *of guilt*. Reparation theories often sidestep this or conflate the obligation to repair *with* guilt.

  2.  **Jaspers' Categories Preservation (Non-Negotiable):**
      *   **Requirement:** Must respect the distinct logics of:
          *   **Criminal Guilt:** Individual culpability under law.
          *   **Political Guilt:** Responsibility borne by citizens for the acts of their state/political community.
          *   **Moral Guilt:** Personal involvement/acquiescence in wrongdoing.
          *   **Metaphysical Guilt:** The shared human solidarity in the face of evil, creating a duty to respond.
      *   **Motivating Case:** Applying criminal guilt concepts directly to later generations is nonsensical (they didn't commit the crime). Political guilt requires a different justification than moral guilt. Blurring these leads to category errors and unfair attributions (e.g., treating a modern German citizen like a war criminal).
      *   **Negotiability:** Non-negotiable for conceptual precision. Many popular discussions dangerously conflate these, especially criminal and political/moral.

  **Desiderata (Agency, Continuity & Transmission):**

  3.  **Institutional Continuity Resolution (Critical):**
      *   **Requirement:** Must explain how guilt (specifically political/moral, *not* criminal) can meaningfully attach to a *present* collective entity (state, nation, people) that exists in legal/political continuity with the *past* perpetrator entity, despite near-total turnover of individual members.
      *   **Motivating Case:** The Federal Republic of Germany is the legal successor to the Nazi state; the "German people" as a political entity persists. How does guilt transmit through this institutional skeleton when the flesh (citizens) is entirely replaced? What constitutes the "collective self" over time?
      *   **Negotiability:** Central to the problem. Theories failing here struggle with transgenerational guilt entirely. *How* it resolves this is highly contested.

  4.  **Moral Amortization Framework (Highly Contested):**
      *   **Requirement:** Must provide a principled account of whether and how the *intensity* or *nature* of collective guilt changes over generations. Does it "depreciate" (e.g., weakening over time), remain constant ("non-depreciating"), or transform?
      *   **Motivating Case:** Comparing recent descendants (e.g., children of perpetrators) vs. descendants 5 generations removed. Is the guilt felt/borne the same? Does the passage of time inherently diminish the moral burden, or is the original wrong so heinous its shadow persists undiminished (e.g., Holocaust)? Your "infrastructure vs. non-depreciating debt" analogy.
      *   **Negotiability:** Deeply contested. Restorative justice might see obligations persisting strongly; strict liberal individualists reject guilt transmission entirely; others propose gradual dissipation or transformation (e.g., guilt -> responsibility -> remembrance).

  5.  **Distributive Principle (Contested):**
      *   **Requirement:** If guilt is distributed among current members, specify the principle: Strictly equal per capita? Weighted by benefit derived from past injustice (e.g., inherited wealth, social position)? Weighted by current identification/affiliation with the collective?
      *   **Motivating Case:** Does a descendant of Holocaust survivors living in Germany bear the *same* share of German political guilt as a descendant of Nazi officials? Does someone who actively rejects the national identity bear it equally? Does benefiting from historical injustice (e.g., economic foundation) increase one's share of guilt?
      *   **Negotiability:** Highly contested. "Equal shares" is simple but arguably unfair. "Benefit weighting" is intuitively appealing but practically and morally complex to define and measure. "Identification weighting" raises issues of voluntarism.

  **Desiderata (Practical & Theoretical Coherence):**

  6.  **Avoidance of "Moral Taint" Misapplication (Non-Negotiable):**
      *   **Requirement:** Must prevent the theory from justifying prejudice, discrimination, or hatred against members of the present collective based solely on their membership (e.g., blaming modern Germans *as individuals* for Nazis).
      *   **Motivating Case:** The danger of reviving racist/nationalist tropes or creating new antagonisms based on inherited group guilt. Collective guilt must not collapse into individual blame for acts they didn't commit.
      *   **Negotiability:** Non-negotiable for a morally defensible theory. This is a major criticism levied against transgenerational guilt concepts.

  7.  **Distinguish Collective Guilt from Collective Shame/Responsibility (Preference - Clarity):**
      *   **Requirement:** Should ideally distinguish collective *guilt* (implying blameworthiness for the *act itself*) from collective *shame* (feeling distress about the act committed by one's group) or collective *responsibility* (a present-day obligation to address the legacy).
      *   **Motivating Case:** Much of what is called "guilt" in popular discourse (e.g., feeling bad about the Holocaust) is better described as shame or a sense of historical responsibility. Conflating them muddies the core question of blameworthiness.
      *   **Negotiability:** A strong preference for conceptual clarity, but some theories might argue these are intertwined facets of the same phenomenon.

  **Key Tensions & Deal-Breakers:**

  1.  **The Central Challenge:** Reconciling **Institutional Continuity (3)** with **Avoiding Moral Taint (6)** is the core tightrope walk. How does guilt stick to the *institution/collective* without unfairly "tainting" the *individuals* who currently comprise it? Most popular theories struggle here.
  2.  **The Amortization-Agency Tension:** **Non-Depreciating Guilt (4)** combined with strong **Institutional Continuity (3)** risks creating a seemingly eternal, inescapable burden disconnected from the agency of the living, violating the spirit of **Avoiding Moral Taint (6)**. Conversely, rapid **Amortization (4)** might seem to trivialize severe historical injustices.
  3.  **The Single Biggest Deal-Breaker Desideratum:** The **Strict Guilt-Reparation Distinction (1)**. Many popular "collective guilt" theories (especially in politics or restorative justice discourse) effectively *conflate* guilt with the obligation to repair. A theory insisting on a sharp conceptual separation rules out a vast swathe of common arguments and frameworks. It forces the theory to justify *blameworthiness itself* across generations, not just obligations arising from past wrongs.
  4.  **The Liberal Individualist Rejection:** For strict liberal individualists, **any** concept of transgenerational *guilt* (as blameworthiness) violates a fundamental axiom: moral responsibility cannot be inherited; it is tied to individual agency and action. Desiderata 1-5 become largely moot from this perspective, which only accepts potential transgenerational *liability for repair* based on benefit, contract, or ongoing harm, not *guilt*.

  **In Summary:** A viable theory needs to clearly separate guilt from reparation (1), respect Jaspers' categories (2), solve the institutional continuity puzzle (3) without creating unjust individual taint (6), take a principled stance on amortization (4) and distribution (5), and ideally clarify guilt vs. shame/responsibility (7). The most significant hurdle is maintaining a meaningful concept of collective *guilt* (blame) over time (via 3) while rigorously distinguishing it from reparation (1) and preventing it from becoming a source of unjustified individual blame (6). The Guilt-Reparation Distinction (1) is the most potent filter against popular but conceptually muddy approaches.
