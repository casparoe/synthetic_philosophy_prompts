prompt: |-
  I'm constructing a research agenda for elder-care law reform centered on the authority of earlier selves through advance directives. Rather than treating directives as static contracts, I want to examine them through the lens of "diachronic autonomy" — normative authority that extends across periods of cognitive change rather than being fixed to a single moment of choice. Within this frame, three open problem-clusters stand out. Cluster A is the boundary problem: whether the loss of authority over one's later self is sharp or graded along a continuum of cognitive decline, and what metaphysical or normative criteria should fix any boundary. Cluster B is the conflict problem: when a later self with diminished capacity expresses stable, apparently authentic preferences that contradict the directive — for instance, contentment in states the earlier self explicitly feared — whether present autonomy, present well-being, or relational continuity should prevail, and whether the answer depends on resolving Cluster A first. Cluster C is the institutional translation problem: how legal systems can apply answers to A and B without requiring courts to make ad hoc judgments about personal identity or to weigh incommensurable values case by case.

  Assume you're advising a small interdisciplinary group — philosophers and legal scholars, not clinicians or neuroscientists — with roughly three years of funding. Which specific open questions within these clusters should they prioritize, and in what order? For each choice, defend the ranking by explaining: why it is upstream of practical reform or of other conceptual work; how tractable it is for philosophers and lawyers using conceptual and normative tools rather than empirical brain science; what kind of result or argument over the next few years would move it up or down the list; and which questions you'd explicitly deprioritize because resolving them wouldn't change much downstream for law or institutional design. I want a defended agenda with explicit trade-offs between importance and tractability, not a survey or a bibliography.

  Please conclude with exactly one line beginning: Verdict: [a one-sentence statement of your top priority and its core justification].
reasoning: |-
  Okay, the user is constructing a research agenda on elder-care law reform focused on advance directives and diachronic autonomy. They've outlined three problem clusters: boundaries of authority (Cluster A), conflicts between earlier and later selves (Cluster B), and translating solutions into legal systems (Cluster C). They want advice on prioritizing specific questions within these clusters for an interdisciplinary group of philosophers and legal scholars over three years.

  Hmm, this is a sophisticated theoretical framework. The user clearly has deep expertise in legal philosophy and is thinking strategically about research impact. They're not asking for literature reviews but for actionable priorities with explicit trade-offs. The emphasis on "upstream" conceptual work suggests they want foundations solid enough to shape practical reforms later.

  Let me unpack their clusters. Cluster A is about when exactly the earlier self's authority diminishes - is it a sharp line or gradual? This seems metaphysically heavy but crucial for defining legal thresholds. Cluster B deals with real-world conflicts - like when a dementia patient seems happy despite violating their directive. That's where ethics and law collide. Cluster C is implementation - how to avoid courts making messy personal identity judgments case by case.

  The user's constraints matter: philosophers and lawyers only (no empirical brain science), three-year timeline. So tractability means questions answerable through conceptual analysis, normative reasoning, and legal doctrine - not fMRI studies. "Upstream" means solving this would unlock progress elsewhere. For example, resolving Cluster A might simplify Cluster B's conflicts.

  For Cluster A, the "boundary criteria" question feels most urgent. If we can define what kind of cognitive change matters normatively (e.g., loss of narrative identity vs. mere preference shifts), it anchors everything downstream. It's tractable because philosophers excel at unpacking concepts like "agency thresholds," and lawyers can map these to legal capacity standards. I'd deprioritize the "sharp vs. graded" debate - it's philosophically thorny but may not change practical outcomes if we have good criteria either way.

  Cluster B's core tension is the conflict resolution hierarchy. Should present well-being override past directives? This is upstream because it dictates whether laws should rigidly enforce directives or build flexibility. Philosophers can weigh autonomy theories (hierarchical vs. narrative), while lawyers can design decision trees for caregivers. The "relational continuity" angle is secondary - interesting but less legally actionable.

  Cluster C is where rubber meets road, but it depends on A and B. The "decision-making architecture" question - like creating standardized evidentiary categories - is doable now. Lawyers can draft procedural frameworks; philosophers ensure they align with autonomy theories. Deprioritizing "incommensurability metrics" makes sense - no one expects a formula for weighing values, just clearer guidelines.

  Sequencing: Year 1 on Cluster A criteria (foundations), Year 2 on Cluster B's core conflict (applying foundations), Year 3 on Cluster C's architecture (implementation). This order prevents wasted effort - why design systems before knowing what principles they should reflect?

  Trade-offs acknowledged: We sacrifice depth on metaphysical debates (like personal identity) for practical clarity. And we accept that some normative disagreements may persist - the goal isn't consensus but "good enough" frameworks for lawmakers.

  Verdict lands on Cluster A's criteria because without defining when authority shifts, the rest floats untethered. That one sentence must capture why it's both foundational and feasible.
answer: |-
  Here's a prioritized research agenda for your 3-year interdisciplinary project, emphasizing upstream impact, tractability for philosophers/lawyers, and explicit trade-offs:

  **Priority Order & Justification:**

  1.  **Cluster A: Boundary Criteria (What *kind* of change matters?)**  
      *   **Specific Question:** What specific *normative* or *metaphysical* criteria (e.g., loss of narrative agency, disruption of core evaluative commitments, loss of the capacity for second-order volitions) should determine when the authority of the earlier self diminishes or ceases, *regardless* of whether the boundary is sharp or graded?
      *   **Why Upstream:** This is the bedrock. Without defining the *nature* of the relevant cognitive/agential change triggering a shift in normative authority, answering "sharp vs. graded" (Cluster A), resolving conflicts (Cluster B), or designing institutions (Cluster C) is impossible or arbitrary. It directly determines the normative weight of the directive vs. the later self's expressions.
      *   **Tractability:** Perfectly suited for philosophical conceptual analysis (agency, identity, personhood) and legal scholarship interrogating foundational concepts of capacity and consent. Requires unpacking normative theories (e.g., hierarchical vs. narrative conceptions of autonomy) relevant to diachronicity, not brain states.
      *   **Movability:** Progress would be a defensible, non-circular account linking specific agential capacities (defined conceptually) to the normative force of advance directives. Failure to find plausible criteria would force deprioritization and shift focus to default conflict rules (B) or purely procedural approaches (C).
      *   **Deprioritize within A:** The "Sharp vs. Graded" debate *itself*. While important, resolving it is secondary to defining *what* is being graded or where the sharp line should be drawn. A graded model *still* needs criteria to define the continuum; a sharp line *still* needs criteria to locate it. Defining the criteria enables progress on both models and directly feeds into B and C. Focusing solely on sharp/graded without defining the criteria is less productive.

  2.  **Cluster B: Conflict Resolution Hierarchy (Core Normative Principle)**  
      *   **Specific Question:** Assuming a *prima facie* conflict exists (later self expresses stable, seemingly authentic preference contradicting directive), what core normative principle should *generally* prevail: Fidelity to Past Directive (diachronic autonomy), Respect for Present Expression (present autonomy), Present Well-Being (welfare), or Relational Continuity? What are the justificatory conditions for overriding one principle with another?
      *   **Why Upstream:** This defines the *default stance* of the law when conflicts arise, which is essential for institutional design (C) and guides interpretation even before precise boundaries (A) are fully settled. It answers the fundamental "why bother with directives?" question in conflict scenarios. Resolving A clarifies *when* this question applies, but B defines *how* it should be resolved when it does.
      *   **Tractability:** Core work for normative political/legal philosophy (competing values of autonomy, well-being, promise-keeping) and legal theory (interpretation, authority of precedent selves). Requires constructing and comparing principled arguments, not empirical data on well-being or relational dynamics in dementia.
      *   **Movability:** A clear, defensible framework (e.g., "Present Well-being trumps unless directive meets threshold X of specificity/reasoning about future state Y defined by criteria from A") would be major progress. Strong arguments for relational continuity as primary could elevate it. Lack of consensus might necessitate focusing on procedural default rules in C.
      *   **Deprioritize within B:** "Whether B depends on resolving A first." It clearly *does* at the margins, but the core normative hierarchy question can be tackled concurrently and partially independently. We can explore principles assuming *some* boundary exists (even if fuzzy) and refine as A progresses. Deep dives into "authenticity" assessments of the later self's preferences are less tractable without empirical input and are downstream of the core principle.

  3.  **Cluster C: Decision-Making Architecture (Procedural Defaults & Evidentiary Heuristics)**  
      *   **Specific Question:** What procedural frameworks or default legal rules can best operationalize the answers to A & B, minimizing the need for courts to make ad hoc metaphysical judgments or directly weigh incommensurable values in routine cases? (e.g., rebuttable presumptions based on functional assessments linked to A's criteria, mandated mediation focusing on B's hierarchy, standardized "weighting" factors).
      *   **Why Upstream (Relative to Practice):** This translates the philosophical/legal norms into actionable legal structures. While downstream of A/B conceptually, it's upstream of *practical reform* and institutional design. Good architecture makes the system workable and predictable without constant recourse to fundamental debates.
      *   **Tractability:** Ideal for legal scholars and legally-informed philosophers. Focuses on institutional design, procedural fairness, rule of law values, and creating heuristics/proxies for complex normative concepts developed in A/B (e.g., defining functional assessment categories linked to criteria from A; creating decision trees based on the hierarchy from B). Avoids needing to *solve* incommensurability, just manage it procedurally.
      *   **Movability:** Concrete proposals for statutory amendments, regulatory frameworks, or court procedures incorporating insights from A/B. Success depends heavily on progress in A/B. If A/B stall, C can focus on purely procedural improvements (e.g., better directive forms, mandated conflict resolution steps) as a fallback.
      *   **Deprioritize within C:** Developing "metrics" for courts to *directly* weigh incommensurable values (e.g., a "diachronic autonomy score"). This is likely intractable and contrary to the goal of minimizing ad hoc judicial philosophizing. Focus instead on structures that *channel* decisions based on the outputs of A and B.

  **Explicit Trade-offs:**
  *   **Importance vs. Tractability:** Prioritizing A (Criteria) tackles the hardest but most fundamental question. It's high-risk/high-reward. Prioritizing B (Hierarchy) addresses the most ethically salient conflict but leans heavily on A. Prioritizing C (Architecture) is more concrete but potentially premature without A/B. The sequence (A -> B -> C) balances foundational work with practical translation.
  *   **Depth vs. Breadth:** Deprioritizing "sharp vs. graded" (A) and deep "authenticity" assessments (B) sacrifices some philosophical depth for greater progress on actionable criteria and principles. Prioritizing procedural architecture (C) sacrifices a quest for perfect value commensuration for practical workability.
  *   **Theory vs. Immediate Reform:** The agenda prioritizes getting the *conceptual and normative foundations* (A & B) right first. This may delay concrete reform proposals (C) but aims to ensure those proposals are coherent and defensible, avoiding poorly-grounded quick fixes.

  **Verdict: Prioritize defining the normative/metaphysical criteria for diminished authority over one's later self (Cluster A), as this is the indispensable conceptual foundation determining the scope and force of diachronic autonomy in all subsequent legal and ethical reasoning.**
