  Im deep in these causation threads comparing Pearl-style interventionist graphs to Lewis-style counterfactuals, and every time someone drops "correlation is not causation" it feels like a conversation ender. But I cant tell what precise claim they're actually making. Is it just the tautology that association doesnt entail mechanism? The stronger thesis that statistical patterns can never justify causal claims without an exlicit interventional model? Or a metaphysical point that counterfactual dependence is irreducible to joint distributions? Separate out the distinct precise readings hiding in that one sentence—label which ones are trivial platitudes, which are substantive and defensible, which are flat-out false, and which ones people in these debates actually need. In particular, if someone weilds it to reject the idea that a properly specified do-operator makes correlation enough for causation, which reading are they invoking? And does that reading actually support their dismissal, or is it smuggling in something about causation being "in the world" that the interventionist framework explicitly rejects?
