answer: |-
  Here's a dissection of "correlation is not causation," breaking down its distinct readings, their validity, and their relevance to the Pearl/Lewis debates:

  **Core Meanings & Their Status:**

  1.  **Tautological/Trivial Platitude (Uncontroversial):**
      *   **Claim:** "Observed statistical association (correlation) *by itself* is not logically equivalent to or sufficient proof of a causal relationship."
      *   **Why Trivial:** This simply states that association ≠ causation. It doesn't say *why* they aren't equivalent or *what else* is needed. Everyone (Pearl, Lewis, statisticians, philosophers) agrees with this basic point. It's a reminder against naive inference.
      *   **Debate Relevance:** Low. Used this way, it's a conversation starter or caution, not a substantive argument against *any* causal framework.

  2.  **Strong Epistemic Claim (Substantive & Defensible, but Context-Dependent):**
      *   **Claim:** "Causal conclusions *cannot be justified solely* from observational data patterns (joint distributions) without *additional causal assumptions* or *interventional data*."
      *   **Why Substantive & Defensible:** Pure observational data is fundamentally ambiguous about causality due to confounding, selection bias, and the possibility of multiple causal structures producing the same correlations. Pearl's SCM framework explicitly requires causal assumptions (the graph) *before* the do-calculus can use observational data to compute interventional effects. Lewis-style counterfactuals also rely on background knowledge/structure beyond raw data.
      *   **Why Context-Dependent:** While true for *establishing* causation from scratch, it doesn't mean observational data is useless. *Given sufficient causal assumptions* (e.g., a correctly specified causal graph), observational data *can* be sufficient to compute causal effects (via do-calculus). It also doesn't preclude predictive modeling.
      *   **Debate Relevance:** High. This is the core insight Pearl formalized. Both Pearl and Lewis proponents accept this. Using "correlation ≠ causation" this way emphasizes the need for causal modeling beyond statistics.

  3.  **Metaphysical Claim (Substantive, Contested):**
      *   **Claim:** "Causation is an irreducible feature of reality involving counterfactual dependence or mechanisms ('oomph') that *cannot be reduced to or defined solely in terms of* patterns in joint distributions (even under interventions), and requires a fundamentally different ontological category."
      *   **Why Substantive & Contested:** This is where the Pearl vs. Lewis distinction sharpens.
          *   **Pearl (Interventionist):** Defines causation *operationally* via the `do`-operator. Causation *is* the difference between `P(Y | do(X=x))` and `P(Y | do(X=x'))` estimated using the SCM (which includes the graph representing causal structure). While this structure has a metaphysical flavor, causation *is* defined and inferred *through* this operational/interventional lens applied to (augmented) probability distributions. Correlation + correct causal model `->` causation.
          *   **Lewis (Counterfactual):** Views causation as fundamentally grounded in the truth of counterfactual statements across possible worlds ("If X hadn't occurred, Y wouldn't have occurred"). This counterfactual dependence is seen as primitive or irreducible to statistical patterns, even interventional ones. It's "in the world." Statistical patterns (incl. interventions) are *evidence* for counterfactuals, not their *definition*.
      *   **Debate Relevance:** Crucial. This is the core philosophical battleground.

  **Addressing Your Specific Questions:**

  1.  **"If someone wields it to reject the idea that a properly specified do-operator makes correlation enough for causation, which reading are they invoking?"**
      *   They are almost certainly invoking the **Metaphysical Claim (3)**. Their argument is: "Even if your `do`-operator gives you a mathematically sound way to *compute* an expected change using observational data *given your model*, that computation *still* isn't capturing the *real essence* of causation (counterfactual dependence across worlds or 'oomph'). It's just sophisticated pattern matching. True causation requires something more fundamental that exists independently of your model and probabilities."
      *   **Less likely, but possible:** A misunderstanding of the **Strong Epistemic Claim (2)**, thinking Pearl claims observational correlation *alone* (without any causal assumptions) is sufficient, which he explicitly denies.

  2.  **"Does that reading actually support their dismissal, or is it smuggling in something about causation being 'in the world' that the interventionist framework explicitly rejects?"**
      *   **Yes, it supports their dismissal *if* you accept their metaphysical premise.** If you believe causation *must* be an irreducible counterfactual relation "in the world," then Pearl's operational definition *does* look like it's missing something essential. For them, the `do`-operator provides useful *surrogates* for causal effects, but not the *real thing*.
      *   **Yes, it is explicitly smuggling in the idea of causation being "in the world" (in a Lewisian sense) that Pearl rejects.** Pearl's framework is explicitly *not* trying to capture that metaphysical essence. It's offering a rigorous, operational, *mathematical* definition and calculus *for doing causal inference* based on representing causal structure and interventions. He aims for clarity and utility in reasoning and inference, not ultimate metaphysical grounding. Pearl would likely argue that his framework *captures everything scientifically meaningful* about causation, and that the Lewisian metaphysics is unnecessary or unhelpful for scientific practice. The dismissal relies on a metaphysical criterion that Pearl explicitly avoids.

  **Summary for Debates:**

  *   **Tautology (1):** Ignore or acknowledge briefly. It's not the point of contention.
  *   **Epistemic Claim (2):** Pearl fully agrees. This is *his starting point*. His framework is the *solution* to this problem. If someone uses "correlation ≠ causation" this way *against* Pearl, they misunderstand him.
  *   **Metaphysical Claim (3):** This is the *real debate*. When someone dismisses the `do`-operator using "correlation ≠ causation," they are likely making this point. The key question to ask is: **"Are you objecting to the *operational adequacy* of the `do`-calculus for scientific inference and decision-making, or are you objecting that it doesn't capture a specific metaphysical concept of causation you hold?"** This forces clarity. Pearl defends the former; the objector insists on the latter.

  Pearl provides a powerful *methodology* for causal inference grounded in mathematics and operations (interventions). Lewis (and others) offer a *metaphysical account* of what causation fundamentally *is*. The "correlation ≠ causation" dismissal of the `do`-operator usually stems from conflating these projects or judging Pearl's methodology by the standards of Lewis's metaphysics, which is precisely the standard Pearl rejects as unnecessary for his goals.
