answer: |-
  **MEMORANDUM**  
  **TO:** Institutional Memory and Civic Archive Committee  
  **FROM:** Senior Ethics Advisor & Institutional-Policy Specialist  
  **DATE:** 6 October 2023  
  **SUBJECT:** Recommendation on Petition for Mnemonic Sunset Clause & Curatorial Dormancy Protocol  

  ---

  ### **I. Core Tensions & Framework**  
  1. **Evidentiary Integrity vs. Contributor Dignity**:  
     - *Integrity* demands unbroken access to testimonies to ensure historical accountability for industrial harm.  
     - *Dignity* asserts that perpetual public exhibition commodifies trauma and denies agency over personal narrative.  
     - **Irreconcilable Claim**: Perpetual display conflates preservation with performative remembrance, potentially serving archival bureaucracy over ethical memory.  

  2. **Curatorial Dormancy Defined**:  
     - *Not Preservation*: Rejects default public accessibility as the sole ethical mode.  
     - *Not Destruction*: Physically/legally preserves records without public indexing.  
     - *Core Innovation*: Decouples *custodial duty* (retain evidence) from *exhibition practice* (display). Access requires justification (e.g., scholarly need, public interest).  

  3. **Philosophical Fulcrum**:  
     The archive is an *active agent* in memory governance. Perpetual visibility risks institutional voyeurism; dormancy recenters ethical engagement over mechanical availability.  

  ---

  ### **II. Recommendation**  
  **Approve a 3-year pilot Curatorial Dormancy Protocol** with the following parameters:  

  #### **A. Protocol Structure**  
  1. **Eligibility**:  
     - Only contributors or direct descendants (spouse/children) may request dormancy.  
     - Applies solely to testimonies >30 years old (retroactive to 1982–1993 entries initially).  

  2. **Process**:  
     - Formal request detailing dignitary harm (no evidentiary burden).  
     - Municipal Archivist + Ethics Subcommittee review (5 members: 2 historians, 1 community rep, 1 legal advisor, 1 ethicist).  
     - Approval requires consensus that public access *actively compounds trauma* without overriding historical value.  

  3. **Outcome**:  
     - De-indexed from public portals; metadata replaced with: "Restricted: Ethical Review in Progress."  
     - Physical/digital preservation continues in secured storage.  
     - Reactivation: Permitted for verified research/civic education via application showing:  
       - Scholarly methodology mitigating harm, OR  
       - Direct relevance to ongoing policy deliberation.  

  #### **B. Implementation Timeline**  
  - **Phase 1 (Q1 2024)**: Draft procedural rules; train staff; establish Ethics Subcommittee.  
  - **Phase 2 (Q2 2024)**: Open requests for 1982–1993 testimonies (11% of total collection).  
  - **Phase 3 (Q4 2026)**: External review of pilot by UNESCO Memory of the World assessors.  

  #### **C. Safeguards**  
  - No more than 15% of collection dormant at once.  
  - Sunset clause rejected: Renewals subject to review; no automatic restrictions.  
  - Full collection remains accessible to city auditors and courts.  

  ---

  ### **III. Addressing Key Objections**  
  **Historians’ Concern: "Dormancy Invites Institutional Amnesia"**  
  *This objection is substantively correct*: Selective withdrawal *could* fracture the narrative of systemic harm. Our protocol mitigates this by:  
  - Limiting eligibility to pre-1993 records (contextually less critical to *current* industrial policy).  
  - Mandating detailed metadata on dormant items (e.g., "Withdrawn at heir request; available for verified research").  
  - Requiring municipal council approval for any dormancy beyond the pilot period (2027).  
  *Concession*: If >10% of pilot-era records enter dormancy, the pilot automatically terminates.  

  ---

  ### **IV. Ethical Bottom Line**  
  The archive’s duty is to *steward* memory, not to enforce visibility. Curatorial dormancy:  
  - Honors dignity without erasure,  
  - Preserves evidence without exploitation,  
  - Forces engagement beyond passive digital consumption.  

  ---

  ### **V. Motion for Vote**  
  **Approve the Curatorial Dormancy Pilot Protocol** (as structured in Section II) with implementation to commence 1 January 2024, contingent on Phase 1 completion by 31 December 2023.  

  ---  
  **END MEMO**  

  *Note: This framework transforms the archive from a monument to a dialogue—where silence, too, can be an ethical act of remembrance.*
