  First, I need to unpack the core conflict. On one side, historians argue that removing any testimonies compromises the archive's integrity and the moral duty to remember past harms. On the other, contributors and descendants feel perpetual display turns private trauma into a spectacle, violating their dignity. The friend's "curatorial dormancy" idea seems crucial—it separates preservation from exhibition, keeping records intact but restricting access unless ethical thresholds are met. 

  The philosophical pivot here is recognizing that archives aren't passive storage; they actively shape memory through what they display. Perpetual accessibility might serve the archive's institutional logic more than genuine remembrance. Dignity isn't just about hiding records but controlling how they're encountered. 

