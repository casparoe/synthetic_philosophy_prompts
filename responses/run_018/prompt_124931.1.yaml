     - **Contextualist** (root=yes, gradual=failure-only-borderline, context-saves, uniform states, KK modified).  
     - **Restricted Luminosity** (root=yes, gradual=failure-only-borderline, context-saves, phenomenal-only, KK split).  
     - **Threshold-Shift** (root=yes, gradual=failure-only-borderline, no-context, uniform states, KK modified).  
     - **Deflationary** (root=yes, gradual=failure-only-borderline, no-context, phenomenal-only, rejects debate).  
  4. **Unoccupied Patterns**:  
     - Incoherent paths (e.g., accepting luminosity while letting gradual change undermine *all* states).  
     - Unattractive positions (e.g., affirming luminosity root but endorsing arguments that deny it).  
     - Unexplored combinations (e.g., contextualism applied uniformly to all states).  

  ### Navigation Logic:
  - **Pure Anti-Luminosity**: Directly from root="no".  
  - **Contextualist**: Root=yes → Q1=no (borderline-only failure) → Q2=yes (context-sensitivity) → Q3=no (uniform) → Q4KK=no (KK modified).  
