  For the normative anchors, I'll highlight non-negotiables like preventing harm to the living while acknowledging different camps have preferences (Margalit's duty to remember vs Rieff's suspicion of compulsory remembrance). When evaluating existing approaches, I'll focus on how they handle the essential distinctions, especially where they collapse them - like when debt-based ethics might ignore the release aspect of forgetting.

