  I notice they've already developed two sophisticated concepts: "mnemonic debt" (the obligation to ethically respond to inherited records) and "counter-memorial silence" (deliberate preservation of absence as respect). This shows they're not looking for basic answers but rather a rigorous framework to evaluate theories of remembrance.

