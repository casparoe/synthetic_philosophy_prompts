  I'm drafting a scene for my novel where a philosophy tutor marks an essay, so please act as an expert in 18th-century moral psychology and literary criticism—think carefully and do a quick brainstorm before answering. Read Mary Shelly's Frakenstein through Adam Smith's account of symapthy and the impartial spectator, focusing on the creature's time with the De Lacey family and the moment he's beaten away. Smith argues sympathy needs an imaginative change of places with someone of our own kind, but there's a niche twist: some readers say the spectator also needs a social mirror—language, gesture, shared custom—to stabilise judgement, not just an inner voice. Is the creature's tragedy that he can never form an impartial spectator of himself because he lacks that mirror, or that others can never form one of him? Does the novel show sympathy failing for reasons Smith missed—like the creature's body literally blocking the imaginative switch—or does it vindicate Smith by showing sympathy works once language enters, then collapses when violence breaks it? Keep it grounded in the plot, don't reduce Shelly to an illustration, and say where the book pushes back. No bibliography, just the argument—use British spelling and check your reasoning step by step.
