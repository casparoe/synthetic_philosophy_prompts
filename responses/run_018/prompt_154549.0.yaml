answer: |-
  Here’s the villanelle, weaving your forensic psychologist’s specific epistemic tension into the strict form, letting structure mirror the unresolvable conflict:

  **Tells**

  The study’s verdict settles like a shroud:  
  Expertise is guesswork, doubt the only rout.  
  **He's lying, I can feel it, clear and loud.**  

  That micro-twitch, the glance he disavowed –  
  Old instincts flare, demanding I call him out.  
  The study’s verdict settles like a shroud.  

  My gut insists, a pulse beneath the crowd  
  Of data points where certainty breeds doubt.  
  **He's lying, I can feel it, clear and loud.**  

  Is this true pattern, or just error allowed  
  By biased eyes that trace what they’re about?  
  The study’s verdict settles like a shroud.  

  This weight I carry, once so keenly proud,  
  Now feels like noise the evidence will flout.  
  **He's lying, I can feel it, clear and loud.**  

  **My certainty is just overfitting**, vowed  
  To phantom signals crumbling in drought.  
  The study’s verdict settles like a shroud.  
  **He's lying, I can feel it, clear and loud.**  
  **My certainty is just overfitting.**

  ---

  **How it delivers your requirements:**

  1.  **Alternating Refrains:** The core conflict drives the structure.
      *   A1: **"He's lying, I can feel it, clear and loud."** (First-order conviction, visceral).
      *   A2: **"My certainty is just overfitting."** (Second-order doubt, meta-cognitive).
      *   They alternate precisely as the villanelle form dictates (Lines 1, 6, 12, 18 / Lines 3, 9, 15, 19).

  2.  **Unresolved Final Couplet:** The last two lines force both refrains to stand side-by-side:
      *   Line 18: **"He's lying, I can feel it, clear and loud."**
      *   Line 19: **"My certainty is just overfitting."**
      *   No resolution. No winner declared. The tension remains absolute.

  3.  **Rhyme Scheme Tracking the Conflict (ABA ABA ABA ABA ABA ABAA):**
      *   The A-rhymes (**shroud**, **loud**, **rout**, **out**, **doubt**, **about**, **flout**, **drought**, **shroud**, **loud**) consistently evoke the core problem: doubt, being proven wrong, silencing, dryness/lack of truth, being called out, shrouding uncertainty. They bind the *problem* together.
      *   The B-rhymes (**shroud**, **avowed**, **crowd**, **allowed**, **proud**, **vowed**, **shroud**) primarily relate to the *observer's state* or *the evidence*: shrouded, disavowed, crowd (of data), allowed, proud (expertise), vowed. They track the psychologist's internal experience and the contested evidence.
      *   The passing effect: The A-rhymes form the persistent, underlying drumbeat of doubt ("shroud/loud/rout/out/doubt...").
      The B-rhymes provide the specific, shifting context for the refrains ("shroud/avowed/crowd/allowed..."). The rhymes don't just decorate; the A's reinforce the meta-doubt framework, the B's carry the immediate scene and internal struggle, passing each other like trains on parallel tracks linked only by the station (the A-rhyme word).

  4.  **Specificity to the Scenario:**
      *   Opens with the meta-analysis impact ("The study’s verdict...").
      *   Uses forensic-relevant details ("micro-twitch," "glance he disavowed," "call him out").
      *   Employs rationalist concepts implicitly ("guesswork," "doubt," "data points," "biased eyes," "evidence," "phantom signals") without jargon.
      *   The title "Tells" references both poker tells (the witness's behavior) and the psychologist's own internal narrative ("tells herself").

  5.  **Capturing Epistemic Akrasia/Higher-Order Evidence:**
      *   The conflict is explicitly between immediate perception/feeling (A1) and the higher-order knowledge undermining its reliability (A2).
      *   Lines like "Old instincts flare... / The study’s verdict settles..." and "Is this true pattern, or just error allowed / By biased eyes..." directly show the tension between orders of evidence.
      *   The final, unresolvable juxtaposition *is* the akrasia – acting (or feeling compelled to act) against one's better judgment about judgment itself.

  This villanelle structurally *is* the psychologist's unresolvable mental state at that moment. The alternating refrains and the rhyming scheme embody the passing trains of conviction and doubt, colliding finally without resolution in the station of her mind.
