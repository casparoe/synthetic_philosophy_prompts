answer: |-
  ### **In-Class Game: "The Candy Conflict"**
  **Objective:** Students experience Sen's liberal paradox firsthand by trying to reconcile individual rights and Pareto efficiency, leading to a cyclical group decision.

  #### **Setup & Materials**
  - **Participants:** Divide students into pairs (one as **A**, one as **B**). Use 8 pairs (16 students).
  - **Stakes:** 
    - **Candy rewards:** 3 candies for top preference, 2 for middle, 1 for bottom (real candy for one randomly selected pair post-game to incentivize sincerity).
    - **Alternative stakes:** "Win" = no homework that week; "loss" = whiteboard duty next class.
  - **Materials:** 
    - Handout for each pair (see below).
    - Whiteboard to track group decisions during debrief.
  - **Time:** 75 minutes total.

  ---

  #### **Handout: Game Rules & Preferences**
  **Scenario:**  
  You and your partner are roommates decorating your shared space. Each controls one personal item:  
  - **A** controls the **wall color** (Blue or Red).  
  - **B** controls the **lamp style** (Green or Yellow).  

  **Outcomes (combinations):**  
  1. **BG**: Blue walls + Green lamp  
  2. **RG**: Red walls + Green lamp  
  3. **BY**: Blue walls + Yellow lamp  

  **Preferences (based on your role):**  
  - **A’s preferences** (you dislike attention):  
    - Best: **BG** (3 candies) → Both modest = low attention.  
    - Medium: **RG** (2 candies) → You’re flashy (red), but B is modest.  
    - Worst: **BY** (1 candy) → B’s lamp is flashy (yellow) = high attention.  
    Ranking: BG > RG > BY  
  - **B’s preferences** (you enjoy boldness):  
    - Best: **RG** (3 candies) → A’s red walls are bold = exciting.  
    - Medium: **BY** (2 candies) → Your yellow lamp is bold = fun.  
    - Worst: **BG** (1 candy) → Both modest = boring.  
    Ranking: RG > BY > BG  

  **Rules:**  
  1. **Individual Rights:**  
     - **A** decides any vote between **BG** and **RG** (differs only in A’s wall color).  
     - **B** decides any vote between **BG** and **BY** (differs only in B’s lamp style).  
     *Example:* If comparing BG vs. RG, A’s preference decides.  
  2. **Weak Pareto:** If both prefer outcome **X** over **Y**, the group **must** choose **X** over **Y**.  
  3. **Goal:** Agree on **one outcome** (BG, RG, or BY) following both rules.  

  ---

  #### **Timeline (75 Minutes)**
  1. **Intro & Setup (10 min):**  
     - Explain roles, outcomes, preferences, and rules. Emphasize: *"Follow your assigned preferences—no side deals!"*  
     - Distribute handouts; answer clarifying questions.  

  2. **Game Play (25 min):**  
     - Pairs try to agree on an outcome using the rules.  
     - **Instructor circulates:**  
       - Listen for attempts to bargain ("I’ll pick RG if you pick BY").  
       - Redirect: *"Stick to your preferences and the rules."*  
       - If a pair "solves" it, ask: *"Did you violate any rules? Check Pareto and rights."*  

  3. **Group Report (10 min):**  
     - Poll pairs: *"Which outcome did you choose? How?"*  
     - Common results:  
       - Deadlock ("We couldn’t decide!").  
       - Forced choice violating rules (e.g., picking RG, but A vetoes).  
       - Cycle discovered (BY > BG > RG > BY).  

  4. **Debrief (30 min):**  
     - **Reconstruct the cycle on the board:**  
       - Step 1: **A’s right** (BG vs. RG) → A picks BG. So: **BG > RG**.  
       - Step 2: **B’s right** (BG vs. BY) → B picks BY. So: **BY > BG**.  
       - Step 3: **Pareto** (RG vs. BY) → Both prefer RG > BY. So: **RG > BY**.  
       - **Cycle:** BY > BG > RG > BY → Contradiction!  
     - **Map to Sen’s Theorem:**  
       | **Game Element**          | **Sen’s Condition**         | **Why It Matters**                                                                 |  
       |---------------------------|-----------------------------|------------------------------------------------------------------------------------|  
       | Any preferences allowed   | Unrestricted Domain         | We let A/B have conflicting rankings (no restrictions).                            |  
       | A/B control personal items| Minimal Liberalism          | Each is decisive over one pair (BG/RG for A; BG/BY for B).                         |  
       | Both agree → group obeys  | Weak Pareto                 | If all prefer X > Y, society must too (e.g., RG > BY).                             |  
       | Cycle in group decision   | Collective Acyclicity Broken| Society needs a rational ranking, but cycles mean no "best" outcome.               |  
     - **Key Discussion Questions:**  
       - *"Which condition would you drop to avoid the cycle? What’s the cost?"*  
         - **Drop liberalism?** → No individual rights (A/B lose control over personal items).  
         - **Drop Pareto?** → Ignore agreements (e.g., both want RG > BY, but group picks BY).  
         - **Drop unrestricted domain?** → Ban "troublesome" preferences (paternalistic).  
       - *"Is this a fluke? Could a better rule fix it?"*  
         → *"The theorem says NO rule satisfies all conditions for every preference profile. We saw one ‘explosive’ profile—but there are many others!"*  

  5. **Conclusion (5 min):**  
     - Reveal Sen’s liberal paradox: *"Today, you hit a wall society faces: liberty and efficiency can clash, and no perfect solution exists."*  
     - Preview next class: *"How do real-world systems (voting, markets) handle this?"*  

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem:** Treating it as bargaining ("I’ll take BY if you reject BG").  
     - **Fix:** Intervene early: *"Rules forbid side deals. Follow your preferences and rights strictly."*  

  2. **Problem:** Faking preferences to "win" (e.g., B claims to like BG to avoid deadlock).  
     - **Fix:** Incentivize sincerity (candy/real stakes). Ask: *"Would you truly prefer BG over BY if it cost you candy?"*  

  3. **Problem:** Missing the structural cycle ("Our group was just indecisive").  
     - **Fix:** Use the board to reconstruct the cycle mathematically. Ask: *"Could any outcome satisfy all rules? Let’s test BG/RG/BY one by one."*  

  4. **Problem:** Believing this is a single-case flaw.  
     - **Fix:** In debrief, stress:  
       - *"The cycle isn’t about you—it’s baked into the rules."*  
       - *"Sen proved no system avoids this for all possible preferences. Try changing A/B’s rankings—can you find another profile causing chaos?"* (e.g., swap A’s preferences: RG > BG > BY).  

  ---

  ### **Limitations & Closing the Gap**
  - **The Gap:** A one-shot game shows the paradox for one preference profile, but Sen’s theorem says it’s *impossible* for any rule to work across *all* profiles.  
  - **How to Close It:**  
    1. **Ask:** *"What if we changed preferences? Suppose A and B both loved BG best. Would the cycle happen?"* (No—but the *threat* remains).  
    2. **Challenge:** *"Design a rule that avoids the cycle here. Does it break liberalism or Pareto?"* (They’ll see it must sacrifice one condition).  
    3. **Generalize:** *"If a system can’t handle even one ‘bad’ profile, it fails Sen’s test. Like a bridge that collapses under one truck—would you call it reliable?"*  

  This game forces students into the paradox, making Sen’s abstract theorem visceral. The debrief links their frustration to the conditions, proving no easy escape exists—exactly as Sen intended.
