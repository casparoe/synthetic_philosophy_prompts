  Here's your taxonomy structured as a decision tree, phrased as concrete claims and designed to map positions on "normative friction" (the social energy cost of restoring equilibrium after a norm breach). Each leaf includes a name and its most awkward real-world implication.  

  ### **Root Claim (Choose A or B):**  
  **A:** "Norm breaches are primarily **coordination failures**—they disrupt practical order but lack moral weight (e.g., missing a train)."  
  *or*  
  **B:** "Norm breaches are primarily **moral contaminations**—they pollute group values/spirit and require purification (e.g., violating a purity taboo)."  

  ---

  ### **Branch 1: Repair Mechanism (If you chose A or B, pick one repair path)**  
  - **Explicit Repair Claim:** "Restoring equilibrium requires codified, public actions (e.g., fines, laws, open apologies)."  
  - **Implicit Repair Claim:** "Restoring equilibrium relies on uncodified, background processes (e.g., gossip, quiet shunning, unspoken rituals)."  

  ---

  ### **Branch 2: Friction Valuation (Then, pick one stance on friction)**  
  - **Adaptive Claim:** "High normative friction is beneficial—it deters breaches and protects against collective risks."  
  - **Pathological Claim:** "High normative friction is harmful—it wastes energy and stifles innovation."  

  ---

  ### **Leaves (Resulting Positions)**  
  *Sorted by your root choice:*  

  #### **If you hold A + Explicit Repair + Adaptive:**  
  **Name:** **Structured Coordinationists**  
  **Core Belief:** "Coordination failures demand clear rules and high-friction penalties (e.g., strict fines for lateness) to prevent systemic collapse."  
  **Awkward Commitment:** Must argue that *minor* breaches (e.g., a 5-minute delay) deserve disproportionate public sanctions to maintain group efficiency.  

  #### **If you hold A + Explicit Repair + Pathological:**  
  **Name:** **Lean Systems Liberals**  
  **Core Belief:** "Coordination failures need explicit fixes, but high friction (e.g., complex bureaucracy) is inefficient and should be minimized."  
  **Awkward Commitment:** Tolerates repeated "small" breaches (e.g., chronic tardiness) to avoid over-policing, risking gradual disorder.  

  #### **If you hold A + Implicit Repair + Adaptive:**  
  **Name:** **Social Pressure Realists**  
  **Core Belief:** "Coordination failures are best resolved through informal enforcement (e.g., peer disapproval), and high friction (e.g., intense gossip) ensures compliance."  
  **Awkward Commitment:** Defends using *social shaming* for morally neutral acts (e.g., "You’re exiled from coffee chats for missing meetings").  
  **Incoherence Flag:** This combo feels unstable—demanding heavy ritualistic repair (e.g., weeks of appeasement) for "practical" problems strains logic. Rare IRL.  

  #### **If you hold A + Implicit Repair + Pathological:**  
  **Name:** **Laissez-Faire Pragmatists**  
  **Core Belief:** "Coordination failures self-correct through informal channels, and high friction (e.g., lingering resentment) is always wasteful."  
  **Awkward Commitment:** Accepts that some groups will chronically malfunction to preserve "low-drama" interactions.  

  ---  

  #### **If you hold B + Explicit Repair + Adaptive:**  
  **Name:** **Moral Formalists**  
  **Core Belief:** "Moral contamination requires public, high-friction purification (e.g., trials, ritual apologies) to uphold sacred values."  
  **Awkward Commitment:** Justifies severe punishments (e.g., exile for minor taboos) as essential spiritual hygiene, even when impractical.  

  #### **If you hold B + Explicit Repair + Pathological:**  
  **Name:** **Restrained Institutionalism**  
  **Core Belief:** "Moral breaches need explicit repair, but high friction (e.g., lifelong stigma) is socially toxic and should be streamlined."  
  **Awkward Commitment:** Advocates for "forgiving" severe violations (e.g., betrayal) if public repair is too costly.  

  #### **If you hold B + Implicit Repair + Adaptive:**  
  **Name:** **Communal Purists**  
  **Core Belief:** "Moral pollution is cleansed through implicit means (e.g., silent shunning), and high friction (e.g., permanent ostracism) safeguards collective purity."  
  **Awkward Commitment:** Endorses unchecked social vengeance (e.g., "ruin their reputation") as morally necessary.  
  **Collapse Flag:** Indistinguishable from **Moral Formalists** in practice—implicit systems (e.g., caste norms) often harden into explicit rules.  

  #### **If you hold B + Implicit Repair + Pathological:**  
  **Name:** **Fluid Morality Advocates**  
  **Core Belief:** "Moral breaches heal through quiet processes, and high friction (e.g., grudges) is corrosive to social bonds."  
  **Awkward Commitment:** Pressures victims to "privately forgive" grave violations (e.g., bigotry) to avoid group tension.  

  ---

  ### **Key Collapses & Empty Zones**  
  1. **Collapsed Pair:** **Communal Purists** (B + Implicit + Adaptive) and **Moral Formalists** (B + Explicit + Adaptive) blur together—high implicit friction for moral breaches often becomes formalized (e.g., religious taboos enforced by both gossip *and* law).  
  2. **Empty Combo:** **A + Implicit Repair + Adaptive** ("Social Pressure Realists") is theoretically possible but incoherent in practice. Demanding heavy *implicit ritual* (e.g., months of appeasement) for *coordination failures* (e.g., a scheduling error) feels irrational—why ritualize amoral acts?  
  3. **Missing Branch:** No position treats *moral* breaches as requiring *low-friction implicit repair* without conceding pathology (covered in **Fluid Morality Advocates**).  

  ### **Tree Summary**  
  This maps 6–8 positions (with one "rare" leaf) by:  
  1. **Breach Type** → 2. **Repair Style** → 3. **Friction Valuation**.  
  The "awkward commitments" expose each stance’s real-world tension. Use this to spark debate on *why* societies tolerate certain frictions but not others.
