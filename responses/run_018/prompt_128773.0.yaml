answer: |-
  **Scenario:** Maya, a chronically burnt-out ER nurse, qualifies for an FDA-approved deep-brain stimulator offering direct pleasure on-demand ("wireheading"). Her alternative is an experimental "Preference Reframing CBT" program: therapists embed subtle scripts during sessions that gradually rewire her reward system to find meaning in her exhausting job. The protocols work subconsciously—she won't realize her core preferences are being edited until she feels genuine fulfillment from previously intolerable tasks.  

  1.  **Scenario:** Burnt-out nurse chooses between direct, transparent pleasure via brain stimulator or covert CBT that slowly rewires her reward weights to make exhausting work fulfilling, without her awareness of the preference change.
  2.  **Preference-Satisfaction Verdict:** Choose the stimulator. It directly satisfies Maya's *current, known preference* for relief from suffering. The CBT subverts her existing preferences by altering them secretly, violating the core principle of satisfying what she actually wants *now*.
  3.  **Authenticity Counter-Verdict:** Choose the CBT. The stimulator offers fake, detached pleasure, eroding her authentic self by bypassing real engagement. The CBT, while covert, helps her rediscover authentic meaning *in her own life*, aligning her rewards with her values and actions long-term.
  4.  **Feature Driving Split:** **Transparency & Conscious Control.** Wireheading is a conscious, transparent tool Maya uses; reward-laundering operates *on* her preferences without her knowledge or consent, fundamentally undermining her agency in defining her desires.
  5.  **Attacking the Losing Side (Authenticity):** Preference-satisfactionists argue authenticity is vague and circular – Maya's "authentic" post-CBT self is just a sneaky override of her genuine prior wishes. Who defines "authentic"? Her original, suffering self clearly preferred relief via stimulator.  

