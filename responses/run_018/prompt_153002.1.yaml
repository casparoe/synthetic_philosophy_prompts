  **Materials:**
  1. **Observation Cards:** 
     - For BM: 10 cards (including 4 that have counterparts in BE). Each card has properties: thermal albedo (a number, e.g., 0.75), orbital velocity (e.g., 3.2 km/s), and time of observation (dawn, fixed for BM).
     - For BE: 10 cards (including the 4 counterparts to BM and 6 others). Each card has properties: reflected spectrum (e.g., "blue-shifted"), radar cross-section (e.g., 5 m²), and time (dusk, fixed for BE).
     - The 4 pairs of matching objects (same satellite) have different property descriptions that are incommensurable without translation.

  2. **Registry Board:** 
     - Divided into two sections: BM and BE. Each bureau will write their internal IDs and properties (as they see them) on their side. 
     - Also, a section for merged identities (when they claim M-01 = E-12).

  3. **Tokens:**
     - Two types: processing tokens (PT) and verification tokens (VT). Each bureau starts with 10 PT and 3 VT. (You can use poker chips, paper clips, or just keep track on paper.)

  4. **Translation Protocol Sheet:** 
     - A shared sheet that lists a few keywords that can be activated (bought) to translate between properties. For example:
          - "Brightness" (cost: 2 PT) -> links thermal albedo (BM) to reflected spectrum (BE) by a rough equivalence (e.g., high albedo ≈ bright in spectrum).
          - "Speed" (cost: 2 PT) -> links orbital velocity (BM) to radar cross-section (BE) via a formula (e.g., higher velocity might correlate with smaller cross-section? but actually we want it to be a bit ambiguous to allow for the trap).
     - Initially, the translation protocol is inactive. They must spend PT to activate a keyword. Once activated, it remains available for the rest of the game.

  5. **Hidden Cognitive Budget:** 
     - Each bureau has a hidden cognitive budget of 10 units. This is represented by a separate token pool (or just a number on a hidden note) that the facilitator keeps. At the start, they have 10. 
     - Rule: For every round that they have an unmerged object (i.e., an object that has a counterpart in the other bureau but they haven't merged it), they lose 2 units from their cognitive budget. 
