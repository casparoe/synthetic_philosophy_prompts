answer: |-
  ### **Frege's Puzzle: Satellite Registry Crisis**  
  **Goal:** Make students viscerally experience the gap between trivial identity (a=a) and informative identity (a=b) through institutional constraints and cognitive costs. No mention of Frege until debrief.

  ---

  ### **Setup & Materials**  
  - **Groups:** Split into **Bureau Morning (BM)** and **Bureau Evening (BE)** (7 each).  
  - **Materials:**  
    - **Observation Cards (2 decks):**  
      - *BM Deck:* 14 cards. Properties: **thermal albedo** (e.g., "0.8 AU"), **orbital velocity** (e.g., "12 km/s").  
      - *BE Deck:* 14 cards. Properties: **reflected spectrum** (e.g., "Lyman-alpha dominant"), **radar cross-section** (e.g., "5 m²").  
      - **Hidden Truth:** 4 pairs describe the *same satellite* (e.g., BM’s "M-07" = BE’s "E-13").  
      - **Trap Card Pair:** 2 cards share *one* translated property but are *different objects* (e.g., both have "high albedo" ≈ "blue-shifted spectrum").  
    - **Master Registry Board:** Shared whiteboard with columns: **BM IDs**, **BE IDs**, **Merged Objects**.  
    - **Tokens:**  
      - **Processing Tokens (PT):** Each bureau starts with **10 PT** (physical counters or tally marks).  
      - **Verification Tokens (VT):** Each bureau starts with **3 VT**.  
    - **Translation Protocol Poster:** Lists 3 shared keywords (initially locked):  
      - `Brightness` (cost: 3 PT to unlock) → Links albedo (BM) and spectrum (BE).  
      - `Speed` (cost: 3 PT) → Links velocity (BM) and cross-section (BE).  
      - `Stability` (cost: 4 PT) → Links dawn/dusk-specific patterns.  

  ---

  ### **Rules**  
  1. **Registration (5 min):**  
     - Each bureau assigns **internal IDs** (e.g., BM: M-01, M-02; BE: E-01, E-02) to their cards and posts them on the registry.  
     - **Cost:** Unmerged pairs drain **2 PT per bureau/round** (tracked secretly by you; announce losses publicly).  

  2. **Gameplay Rounds (4 rounds × 10 min each):**  
     - **Actions per round:**  
       - **Activate Translation:** Spend PT to unlock a keyword (e.g., "BM spends 3 PT for *Brightness*").  
       - **Propose Identity:** Claim "M-01 = E-12" using a *translated property* (e.g., "Both have high *Brightness*"). Costs **1 VT**.  
       - **Trivial Identity:** Declare "M-01 = M-01" anytime. Free, no gain.  
     - **Outcomes:**  
       - **Correct Merge:** Gain **5 PT** + free up 2 registry slots.  
       - **False Merge (trap or wrong pair):** Lose **8 PT**, registry "collapses" (entries locked for 1 round).  
       - **No Merge:** Drain **2 PT/bureau** per hidden pair (announce: "BM loses 4 PT, BE loses 4 PT" if 2 pairs unmerged).  

  3. **Hidden Mechanic:**  
     - Each bureau has a **cognitive budget** (secretly tracked by you). Starting: **10 units**.  
     - For every unmerged pair, they lose **2 units/round**. If budget hits **0**, they lose **1 VT permanently** (simulates cognitive overload).  

  ---

  ### **Timeline (80 min)**  
  1. **Intro (5 min):**  
     - *"You’re rival astronomy bureaus. BM tracks dawn objects via thermal albedo/orbital velocity; BE tracks dusk via reflected spectrum/radar cross-section. Build a master registry. Tokens = resources. Goal: Maximize PT."*  
     - **Emphasize:** "Merging saves resources, but mistakes are costly."  

  2. **Registration (5 min):**  
     - Groups assign IDs, post to registry.  

  3. **Gameplay Rounds (40 min):**  
     - **Round 1:** Groups typically unlock one keyword (e.g., *Brightness*) but hesitate to merge. Announce PT drain.  
     - **Round 2:** Pressure mounts. Some propose merges; others hoard tokens. Trap may be triggered.  
     - **Round 3:** Budget losses bite (e.g., "BM’s cognitive budget depleted! Lose 1 VT."). Panic ensues.  
     - **Round 4:** Reckless mergers vs. overcautious hoarders.  

  4. **Crisis (5 min):**  
     - End game. Announce: *"4 objects unmerged. BM loses 8 PT, BE loses 8 PT. Cognitive budgets: BM=0, BE=2."*  
     - Reveal hidden pairs/trap. Highlight hoarders vs. reckless mergers.  

  ---

  ### **Debrief (20 min)**  
  1. **Feelings First:**  
     - *"What hurt more: losing PT from drains or failed merges?"*  
     - *"Why was ‘M-01 = M-01’ useless? Why did ‘M-01 = E-12’ feel risky even if true?"*  

  2. **Map to Frege:**  
     - **Registry slots** = **Reference** (actual satellite).  
     - **Internal IDs/translation costs** = **Sense** (how each bureau *conceives* the object).  
     - **Token drain** = **Epistemic cost** of redundant senses.  
     - **Verification gamble** = **Cognitive value** of informative identity (a=b ≠ a=a).  

  3. **Name the Puzzle:**  
     - *"You just felt Frege’s puzzle. ‘Hesperus is Hesperus’ is trivial; ‘Hesperus is Phosphorus’ requires costly work to verify—even though both point to Venus. Sense (mode of presentation) ≠ reference (the thing itself)."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  - **Problem:** Groups talk across bureaus too freely, bypassing translation.  
    - *Fix:* Ban direct card sharing. Force all communication via the protocol.  
  - **Problem:** Analysis paralysis. Some groups do nothing.  
    - *Fix:* Announce escalating drains ("Unmerged pairs now cost 3 PT!") to force action.  
  - **Problem:** Trap isn’t triggered.  
    - *Fix:* Secretly hint to a reckless player: *"E-09 and M-14 both have high Brightness..."*  

  ---

  ### **What This Can’t Capture**  
  **Frege’s logical purity vs. institutional messiness:**  
  - In Frege’s puzzle, "a=a" and "a=b" differ *solely* due to senses in a logical system. The game adds *pragmatic costs* (tokens, budgets) to simulate cognitive friction.  
  - **What you must clarify:**  
    - *"Frege’s gap is about how senses change cognitive value, even when reference is identical. Our game makes this gap feel urgent with artificial costs—but in language, the cost is innate to sense itself, not bureaucracy."*  

  ---

  **Final Note:** The game turns Frege’s puzzle into a visceral resource crisis. When a student groans, *"But M-01 IS E-12! Why is this so hard?"* — you’ve won.
