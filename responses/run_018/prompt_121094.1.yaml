  We are constructing a classroom simulation for an advanced undergraduate epistemology seminar. The goal is to illustrate the failure of epistemic closure under Nozick's tracking conditions without starting with a lecture. The simulation is called "Cartographic Transmission" and is set in an imaginary archipelago.

  Structure:
  - 10 students, 90 minutes, no digital devices.
  - The core idea: Participants establish knowledge of an island's location (p) via a sensor that tracks truth across nearby worlds. Then they derive that a strait is navigable (q) by entailment (p entails q). However, a staged shift in modal proximity reveals that the counterfactual worlds in which the strait is dangerous (not q) are closer than those in which the island is elsewhere (not p). Thus, they know p and know that p entails q, but they do not know q because the tracking condition for q fails in the closer worlds.

  Components:
  1. **Setup**: 
     - Each student represents a "navigator" of the archipelago. 
     - The archipelago has an actual world and counterfactual worlds. We represent these with tokens on a large map drawn on the floor or on a table.
     - Tokens: Each student has two types of tokens (or two sets of tokens): 
          - **Island Tokens (for p)**: Represent the location of the island (p: true or false). 
          - **Strait Tokens (for q)**: Represent the navigability of the strait (q: true or false).
     - The map has two main features: 
          - The "Home Island" (actual world) and surrounding waters (counterfactual worlds). 
          - A strait that connects two seas.

  2. **Rules of the Game**:
     - **Phase 1: Establishing Knowledge of p (Island Location)**
       - The facilitator sets the actual world: The Home Island is at a specific coordinate (p is true). 
       - Each student uses a "sensor" (a rule-based device) that tracks the truth of p in nearby worlds. The sensor is reliable: in the actual world and in nearby counterfactual worlds, if the island were not at that coordinate (not p), the sensor would indicate it (sensitivity condition). 
       - Students place their Island Tokens in a cluster around the actual world coordinate, representing the modal neighborhood in which the sensor tracks the island's location. The cluster should be tight, meaning that the counterfactual worlds in which the island is elsewhere (not p) are far away (so not in the cluster). 
       - Students declare: "I know the island is here (p)."

     - **Phase 2: Deriving q (Strait Navigability)**
       - The facilitator states the entailment: The island being at this coordinate (p) entails that the strait is navigable (q). Why? Because the strait's currents are safe only when the island is at this exact location (due to a fictional geological reason). 
       - Students then place their Strait Tokens in a cluster representing the worlds in which the strait is navigable (q is true). They do this by logical entailment: since they know p, and p entails q, they believe q and place the tokens accordingly. 
       - They declare: "I know the strait is navigable (q)."

     - **Phase 3: Modal Shift and the Breakdown**
       - The facilitator introduces a twist: A storm has altered the modal geography. Now, the counterfactual worlds in which the strait is dangerous (not q) are much closer to the actual world than the counterfactual worlds in which the island is not at its coordinate (not p). 
          - Explanation: The worlds in which the strait is dangerous (not q) can occur even with the island at the same coordinate (p true) due to the storm (which is a local disturbance). But the worlds in which the island is not at the coordinate (not p) remain far away (because the island is geologically stable).
       - Students must physically move their Strait Tokens: They are to move the tokens that represent the strait being dangerous (not q) into the modal neighborhood (the cluster of nearby worlds) and move the tokens that represent the strait being safe (q) to a more distant cluster? Actually, let's clarify: 
          - The actual world remains: p true and q true.
          - But now, in the nearby counterfactual worlds, q might be false even though p is true (because the storm affects the strait without moving the island).
       - Therefore, the students are asked to re-evaluate their Strait Tokens. They must move the tokens for the strait such that in the actual world, the strait token is still safe (q true), but in the nearby counterfactual worlds (which are now defined by the storm), the strait tokens for those worlds are dangerous (not q). 
          - They leave the Island Tokens untouched because the island's location is unaffected by the storm (so the cluster for p remains tight and tracking holds for p).

       - Now, the facilitator asks: "Do you still know that the strait is navigable (q)?" 
          - The sensor for q: In the actual world, q is true. But in a nearby counterfactual world (which is now close due to the storm) where the strait is dangerous (not q), the student would still believe q (because they are using the same method: they know p and p entails q, so they believe q). But in that nearby world, q is false, so their belief about q does not track the truth in that nearby world. Thus, the tracking condition for q fails.

       - Students are forced to declare: "I do not know q." 

       - This creates the breakdown: They know p, they know p entails q, but they do not know q.

  3. **Debrief**:
     - Map the token movements to Nozick's conditions (four conditions for knowledge: truth, belief, sensitivity, and adherence? Actually, Nozick's tracking view has two main conditions for knowing p: 
          1. If p were true, you would believe p (this is the actual world and close worlds where p is true, you believe it).
          2. If p were false, you would not believe p (sensitivity: in close worlds where p is false, you don't believe it).
          - Note: Nozick also has conditions for methods, but we simplify to the belief formed by the method.

     - For p (island location): 
          - Condition 1: In the actual world (p true), they believe p (yes).
          - Condition 2: In the close worlds where p is false (island not there), they do not believe p (because the sensor would indicate it, and they would not believe p). But note: in the initial setup, the worlds where p is false are far, so they are not in the close neighborhood. After the storm, the worlds where p is false are still far, so condition 2 holds.

     - For q (strait navigability):
          - Condition 1: In the actual world (q true), they believe q (yes).
          - Condition 2: In the close worlds (after the storm) where q is false (strait dangerous), they still believe q (because they believe p and p entails q, and p is still true in those close worlds). So condition 2 fails: they believe q even when q is false in a close world.

     - Thus, knowledge of q fails because the belief in q is not sensitive to the truth of q.

     - Predict the misconception: 
          - Students might think that because their sensor for p is reliable and they have a reliable entailment (p->q), then they have reliable belief in q. But the simulation shows that reliability is not enough for tracking: the tracking condition requires that in the close worlds where q is false, you don't believe q. Here, in the close worlds where q is false, they do believe q.

     - Also, students might retreat into skepticism: "Then do we really know p?" But note: the tracking condition for p still holds because the worlds where p is false are still far. The simulation should reinforce that knowledge is non-transitive across entailment under tracking.

  4. **What the simulation cannot reproduce**:
     - The precise metric of modal distance: We are using a spatial metaphor (the archipelago) to represent modal space, but the actual closeness of possible worlds is not literally spatial. The storm is a narrative device to change what counts as close.

  5. **Roles/Rules to Prevent Premature Explanation**:
     - The facilitator must not explain the failure until the debrief. How to enforce?
          - Assign a role to one student as the "Archivist" who records the token placements and declarations but is not allowed to interpret until the end.
          - The facilitator's script: Only give instructions for token movements and declarations. Do not answer "why" questions about the setup until the debrief. Instead, say: "We are constructing the map as the storm changes the waters. Record your observations and we will discuss after."

  6. **Payoff/Incentive Structure**:
     - Why would students resist admitting they don't know q?
          - The payoff: Each student is part of a "Navigation Guild". They earn points for correct declarations (declaring knowledge when they have it and not declaring when they don't). But if they declare knowledge of q and then it turns out that in the nearby worlds the strait is dangerous (and they attempt to navigate it and fail), they lose points (or suffer a fictional penalty, like losing a ship). 
          - The incentive is to be cautious: if they declare knowledge and are wrong, they lose. But also, if they don't declare knowledge when they should, they miss an opportunity (they might not be able to use the strait, which is the fastest route). 
          - However, after the storm, the safe thing is to not declare knowledge of q. But they are under pressure because they have already invested in knowing p and the entailment. They might resist because they feel that logically they must know q.

  7. **What will go wrong the first time**:
     - Likely, students will refuse to accept that knowledge can be non-transitive. They might insist that if they know p and p entails q, then they must know q. They might try to adjust the token placements to avoid the breakdown (e.g., by moving the not-p worlds closer to make p fail too, or by refusing to move the strait tokens). 
     - How to recover without lecturing?
          - The facilitator can introduce a new rule: "The storm has made the straits independently treacherous. In the nearby worlds, the strait can be dangerous even if the island hasn't moved. How does that affect your belief about the strait?" 
          - Then, the facilitator can ask the Archivist to read the declarations: "You declared knowledge of p and that p entails q. Now, in a nearby world where the strait is dangerous (but the island is still at the coordinate), would you still believe the strait is safe? Why?" 
          - Let the students debate. The physical separation of the tokens (the island tokens remain in a tight cluster, but the strait tokens are now split with dangerous ones nearby) should help. They must confront the fact that their belief about the strait would not change in the face of the storm (because they still have the same evidence: p and the entailment) even though the strait is now dangerous.

  8. **The Framing**:
     - The entailment chain is a cartographic transmission: knowing one coordinate (p) does not automatically grant knowledge of the current (q) because the worlds in which the current changes (not q) are nearer than those in which the coordinate does (not p). The participants feel this through the physical separation of token clusters.

  Procedure in Steps:

  1. **Preparation (10 minutes)**:
     - Draw the archipelago map (on a large sheet of paper or using tape on the floor). Mark the actual world (Home Island) and the strait.
     - Give each student:
          - 5 blue tokens (for the island: one for actual, and four for counterfactual worlds where the island is at the coordinate or not)
          - 5 red tokens (for the strait: one for actual, and four for counterfactual worlds where the strait is safe or not)
     - Explain the basic rules and the sensor for the island location.

  2. **Phase 1: Establishing p (15 minutes)**:
     - Students place blue tokens: 
          - Place one blue token on the actual world (p true).
          - Place the other blue tokens: 
              - Two in nearby worlds (also p true) to represent adherence (if p were true, they would believe it).
              - Two in distant worlds (p false) to represent sensitivity (if p were false in a close world, they wouldn't believe it, but these are far so not close). 
          - The cluster of blue tokens for p true is tight and the p false tokens are far away.
     - Declaration: "I know p."

  3. **Phase 2: Deriving q (10 minutes)**:
     - Explain the entailment: p -> q (if the island is at the coordinate, then the strait is safe).
     - Students place red tokens for q:
          - Place one red token on the actual world (q true).
          - Place the others in the same clusters as the blue tokens (because they believe q wherever they believe p, and they believe p in the nearby worlds). So in the nearby worlds (where p is true), they place red tokens for q true. In the distant worlds (p false), they might place q false? But note: the entailment doesn't tell them about q when p is false. However, the facilitator can say: in the worlds where p is false, we don't care about q for the tracking of q. So they can leave the distant worlds without red tokens? Or they can place them arbitrarily? 
          - Actually, for simplicity, have them place red tokens only in the worlds they are considering (the nearby ones). So in the nearby worlds (which are all p true), they place red tokens for q true. They don't place any in the distant worlds for now.
     - Declaration: "I know q."

  4. **Phase 3: The Storm (15 minutes)**:
     - Facilitator: "A storm has swept through the archipelago. The storm does not move the island (so the island's location is stable) but it has made the strait treacherous in some nearby worlds. Now, the worlds in which the strait is dangerous are much closer to us than before."
     - Students must adjust the map:
          - The blue tokens (for p) remain as they are because the island is unaffected.
          - The red tokens: 
              - The actual world remains q true.
              - But now, they must introduce new nearby worlds (that were not considered before) where p is true (the island is at the coordinate) but q is false (the strait is dangerous). They move two of their red tokens to these new nearby worlds and set them to q false. 
              - Also, they must remove the red tokens from the old nearby worlds (or leave them but mark them as now being farther? Actually, we are redefining the modal proximity). It's simpler to redefine the clusters: 
                  - Create a new cluster of nearby worlds (within a circle of, say, 1 meter from the actual world) and a distant cluster (beyond 1 meter). 
                  - In the new nearby cluster, place:
                      - The actual world (p true, q true).
                      - Some worlds where p true and q false (due to the storm).
                      - Note: the worlds where p false remain in the distant cluster (beyond 1 meter).
          - Now, the belief about q: In the actual world, they believe q (because they have p and entailment). In the nearby world where q is false (but p is true), they would still believe q (because they have p and the entailment). 
          - Therefore, they are asked: "In this nearby world where the strait is dangerous, what do you believe about the strait?" They must answer: "I believe it is safe." 
          - Then: "But in that world, is the strait actually safe?" (No) 
          - So: "Does your belief about the strait track the truth in that nearby world?" (No) 
          - Therefore: "Do you know that the strait is safe in the actual world?" (They should see that their belief in q is not sensitive: if the strait were dangerous (in a close world), they would still believe it safe. So they do not know q.)

     - Declaration: They must now say: "I do not know q."

  5. **Debrief (30 minutes)**:
     - Map to Nozick:
          - For p: 
              - Truth: p is true in the actual world.
              - Belief: They believe p in the actual world and nearby worlds (adherence).
              - Sensitivity: In the close worlds where p is false (which are still distant), they do not believe p. So tracking holds for p.
          - For q:
              - Truth: q is true in the actual world.
              - Belief: They believe q in the actual world (and in the nearby worlds, even the ones where q is false).
              - Sensitivity: In the close worlds where q is false, they still believe q. So the tracking condition fails for q.
          - Therefore, even though p entails q, and they know p, they do not know q.

     - Discuss the misconceptions:
          - Confusing tracking with reliability: Their method for q (inferring from p and entailment) is reliable in the actual world and in the old nearby worlds, but not in the new nearby worlds. Tracking requires more than reliability: it requires that the belief is sensitive to the truth in the specific way (condition 2).
          - Skepticism: Some might say, "Then we don't really know p either, because maybe there are closer worlds where p is false that we haven't considered." But the simulation sets that the p-false worlds are still far. The point is that knowledge is not universal; it can hold for one proposition and fail for an entailed one because the modal conditions differ.

     - What the simulation approximates and what it doesn't: 
          - We used spatial distance for modal distance. But modal distance is not spatial; it depends on the context and the proposition. The storm was a narrative device to change the modal proximity for q without affecting p.

     - Encourage reflection: How does this change their view of knowledge? What are the implications for logical deduction?

  This structured role-play should allow students to experience the breakdown of closure physically and then reflect on it conceptually.
answer: |-
  ### **Cartographic Transmission: A Simulation of Epistemic Closure Failure**  
  **Setting:** An advanced undergraduate epistemology seminar (10 students, 90 minutes).  
  **Core Idea:** Students embody navigators in the *Archipelago of Veridia*, using tokens to map actual and counterfactual worlds. Through physical token manipulation, they experience Nozick’s tracking conditions—and their failure to transmit across entailment.  

  ---

  #### **STRUCTURE OF THE SIMULATION**  
  **Materials:**  
  - A large floor map of Veridia (drawn on paper or with tape), featuring:  
    - *Home Island* (actual world).  
    - *The Iron Strait* (critical chokepoint).  
    - *Distant Reefs* (counterfactual worlds).  
  - Two sets of tokens per student:  
    - **Blue Tokens:** Represent the island’s location (*p*: "Home Island is at coordinate X").  
    - **Red Tokens:** Represent the strait’s navigability (*q*: "The Iron Strait is safe to sail").  
  - **Sensor Device:** A ruler labeled "Modal Proximity Gauge" (measures "distance" between worlds on the map).  

  **Roles:**  
  - **Navigators (9 students):** Decide token placements and declare beliefs.  
  - **Stormcaller (1 student):** Controls the "modal storm" (shifts proximity mid-game).  
  - **Archivist (Facilitator):** Records declarations, enforces rules, and guides debrief. *Forbidden from explaining closure until the end.*  

  **Rules:**  
  1. **No digital devices.** Beliefs must be declared aloud.  
  2. Tokens are placed in clusters:  
     - **Tight cluster** = nearby worlds (within 10 cm of Home Island).  
     - **Distant cluster** = far-off worlds (beyond 30 cm).  
  3. **Payoff:** Navigators earn "Guild Points" for correct declarations:  
     - +1 for true belief, -2 for false belief.  
     - *Incentive to resist admitting ignorance of q after deriving it.*  

  ---

  #### **PHASED PROCEDURE**  
  **Phase 1: Establishing Knowledge of *p* (20 mins)**  
  - **Task:** Navigators use the "sensor" (ruler) to place blue tokens.  
    - *Actual World:* Blue token on Home Island (*p* true).  
    - *Counterfactuals:* Place blue tokens in tight cluster (worlds where *p* is true) and distant cluster (worlds where *p* is false).  
  - **Sensor Rule:** "If the island weren’t at X, your sensor would show it *only* in distant worlds."  
  - **Declaration:** "I know *p*: The island is at X."  
  - *Outcome:* Students see tracking—*p* is sensitive (distant not-*p* worlds) and adherent (nearby *p* worlds).  

  **Phase 2: Deriving *q* by Entailment (15 mins)**  
  - **Entailment Reveal:** "The island’s location (*p*) entails the strait’s safety (*q*): Safe currents exist *only* if the island is at X."  
  - **Task:** Navigators place red tokens:  
    - *Actual World:* Red token on the strait (*q* true).  
    - *Counterfactuals:* Red tokens mirror blue clusters (since *p → q*).  
  - **Declaration:** "I know *q*: The strait is safe."  
  - *Psychological Hook:* Guild Points incentivize confidence in *q*.  

  **Phase 3: Modal Storm & Breakdown (25 mins)**  
  - **Stormcaller’s Move:** "A modal storm shifts the seas! Worlds where the strait is *treacherous* (not-*q*) are now closer than worlds where the island *moves* (not-*p*)."  
  - **Task:** Navigators physically move tokens:  
    - Blue tokens *unchanged* (island location unaffected).  
    - Red tokens:  
      - Move not-*q* tokens into the *tight cluster* (now nearby worlds).  
      - Keep *q* tokens only in the actual world and distant clusters.  
  - **Sensory Jolt:** Students see not-*q* tokens adjacent to Home Island, while not-*p* tokens remain far.  
  - **Forced Declaration:**  
    - "In nearby worlds where the strait is dangerous, would you still believe it’s safe? Declare now."  
    - *Result:* Navigators must state, "I do *not* know *q*."  
  - **Cognitive Dissonance:** Guild Points penalize false beliefs, forcing honesty.  

  ---

  #### **DEBRIEF: MAPPING THE BREAKDOWN (30 mins)**  
  **Step 1: Token Analysis → Nozick’s Conditions**  
  - **Tracking *p* (Intact):**  
    - *Truth:* Blue token on actual world (*p* true).  
    - *Sensitivity:* Distant not-*p* tokens (if island moved, you’d detect it).  
  - **Tracking *q* (Failed):**  
    - *Truth:* Red token on actual world (*q* true).  
    - *Sensitivity FAILS:* Nearby not-*q* tokens (you’d *still believe q* in these worlds because *p* is true).  

  **Step 2: Predictable Misconceptions**  
  1. **Confusing Tracking with Reliability:**  
     - "But our sensor for *p* is reliable, and *p→q*, so *q* should be reliable too!"  
     - *Counter:* Reliability ≠ tracking. In nearby not-*q* worlds, belief in *q* doesn’t adjust to truth.  
  2. **Skepticism Retreat:**  
     - "If we don’t know *q*, maybe we never knew *p*!"  
     - *Counter:* Note unchanged blue tokens—*p* still tracks. Knowledge isn’t "all or nothing."  

  **Step 3: Framing the Insight**  
  - **Cartographic Transmission Metaphor:**  
    - "*Knowing p is like marking an island on a map. Knowing q is like charting a current. The storm shows that dangerous currents (not-q) can arise *closer to home* than a misplaced island (not-p). Entailment is a voyage—and currents shift faster than land.*"  
  - **What the Simulation Approximates (but Doesn’t Perfectly Capture):**  
    - Modal distance isn’t spatial. Nozick’s "closeness" depends on *similarity of worlds*, not geography. The archipelago is a metaphor for how some truths (like ocean currents) are *modally fragile* compared to others (island location).  

  ---

  #### **ANTICIPATED FAILURES & RECOVERY**  
  **What Will Go Wrong (First Run):**  
  - **Refusal to Accept Non-Transitivity:** Students will insist, "If I *know p* and *p→q*, I *must* know q!" They may protest moving not-*q* tokens closer.  
  - **Stormcaller Sabotage:** The Stormcaller might resist "causing" the breakdown.  

  **Recovery Without Lecturing:**  
  1. **Archivist’s Neutral Prompts:**  
     - "Place tokens *only* based on the storm’s rule: not-*q* worlds are now closer than not-*p* worlds. What does the Gauge show?"  
     - "If you sailed the strait in *this* nearby world (point to not-*q* token), would you *expect* it to be safe? Declare."  
  2. **Physical Token Separation:**  
     - Use the glaring gap between blue clusters (still tight) and scattered red tokens to silence debate. The body understands before the mind.  
  3. **Guided Reflection:**  
     - "What *changed* about the strait’s counterfactuals that didn’t change for the island? Write one sentence."  

  ---

  **Simulation Payoff:**  
  Students exit not just *understanding* closure failure but *feeling* it—through the dissonance of moving tokens they believed were secure. The debrief’s honesty about the metaphor’s limits (e.g., no precise metric for modal distance) preempts oversimplification. By the end, "knowledge" feels less like a deductive vault and more like a nautical chart: contextually stable until the waters revolt.
