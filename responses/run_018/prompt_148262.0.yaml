prompt: |-
  As a retired biologist who has recently turned to philosophy of science, I find the claim that DNA is a "code" both pervasive and conceptually slippery. Rather than surveying the literature, I want a defended agenda: among the open conceptual questions about whether genetic information is genuinely code-like—particularly regarding semantic content versus causal specificity, the ribosome's role as an interpreter rather than a mere catalyst, and whether synthetic genomes that lack evolutionary history still bear "meaning"—which two or three are most worth resolving first? For each, explain why it is upstream of the others, how tractable it is for conceptual rather than empirical work, and what result would cause you to reorder the priorities. I am also interested in whether resolving these questions carries any direct implications for the ethics or regulation of synthetic organisms, or if that domain should be treated as conceptually separate. Please respond in American English, without bibliographies or reading lists, and defend your ranking with explicit criteria rather than authority.
