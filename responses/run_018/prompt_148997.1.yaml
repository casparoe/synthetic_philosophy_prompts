  ## EV Fanatic's Lament (Villanelle)

  My credence ticks, a roulette wheel refined,  
  I calibrate each order, sharp and keen:  
  **"The expectation never closes,"** defined  
  By self-assessed precision, self-designed.  
  A bet on boundless bliss, forever seen,  
  My credence ticks, a roulette wheel refined.  

  At order n, my confidence aligned  
  Demands a higher stake, a grander scene:  
  **"The world is not a wager,"** they opined.  

  For infinite reward, the path's outlined  
  Through nested bets, a staircase, cold and clean.  
  My credence ticks, a roulette wheel refined.  

  Each meta-doubt, a strategy assigned,  
  To wager more where infinite might glean.  
  **"The expectation never closes,"** defined  
  To justify the cost, however mined  
  To dust. **"The world is not a wager,"** keen  
  Retort. My credence ticks, a roulette wheel refined.  

  The skeptic scorns the abstract, unconfined  
  Potential gain, a cold, celestial sheen.  
  **"The expectation never closes,"** defined –  
  **"The world is not a wager,"** intertwined.  
  My credence ticks, a roulette wheel refined.

  ---

  **Author's Note (with deliberate vibe):**

  This villanelle plays fast and loose with some decision theory, bending logic for rhyme and rhythm, but aims for philosophic resonance.

  *   **Settled (ish):** The core *mechanism* of fanaticism is accepted: unbounded utility functions (or sufficiently heavy-tailed distributions) can indeed lead Expected Utility (EU) maximization to prioritize vanishingly improbable events with enormous payoffs over near-certain finite goods. Conditioning on calibration *can* amplify this by forcing the agent to take their own higher-order uncertainty seriously, potentially demanding ever-larger commitments to capture the possibility of infinite value if their self-trust holds at each level. The poem captures this recursive *feel*.
  *   **Genuinely Contested:**
      *   **Coherence of Infinite Utility:** Many argue that "infinite utility" isn't a coherent concept for comparison/decision-making. Should it be treated as a limit ("arbitrarily large") rather than an actual number? The poem treats it as actual.
      *   **Self-Calibration & Actual Regress:** The poem's core *liberty* is depicting self-calibration as generating an *actual, actionable infinite regress of distinct bets*. In reality:
          *   Conditioning on calibration might just refine the *single* probability estimate for the infinite payoff event, not spawn infinite new *bets*. The "orders" are epistemic levels, not necessarily distinct wagers.
          *   An agent might recognize the regress and adopt a different policy (e.g., using finitary approximations, discounting higher orders, rejecting infinite utilities). The poem's agent is trapped in the fanatic loop.
          *   The probablility of maintaining perfect calibration up *infinite* orders is arguably zero, collapsing the regress – but the fanatic focuses on the non-zero chance *before* that point.
  *   **The Poem's Bend:** The key liberty is the **conflation of epistemic self-trust (calibration conditioning) with the creation of an infinite sequence of tangible, escalating bets.** It makes the abstract conflict visceral and recursive, essential for the villanelle's form and the "passing each other" dynamic of the refrains. The final couplet leaves the fundamental disagreement – the relentless logic of unbounded EU vs. the rejection of life as merely God's math – starkly unresolved, echoing the ongoing debate.
