  I'm an undergraduate philosophy student currently enrolled in a seminar on Medieval Islamic Philosophy, and I need a polished, two-page research proposal for a semester-long paper of about 6,000 words, due in twelve weeks. Rather than treating Al-Ghazālī's occasionalism as merely the negative claim that created things lack necessary causal powers, I want to investigate a specific reconstructive thesis: that his concept of divine 'habit' (ʿāda) functions not as a psychological metaphor for regularity but as a primitive modal constraint—something like a fixed pattern of possible-world dependencies—such that occasionalism becomes structurally analogous to modern non-reductive accounts of natural law rather than to a doctrine of perpetual miracle. The proposal should contain: (1) a precisely framed research question that admits of a determinate answer; (2) an explanation of why the two dominant readings—the 'pure miracle' interpretation and the 'hidden determinism' interpretation—fail to settle whether this modal reconstruction is viable; (3) a concrete method, including which conceptual distinctions I need to draw (e.g., metaphysical vs. nomic necessity, counterfactual dependence vs. causal production) and a rough week-by-week plan for the semester; (4) a description of what the final paper would argue and what specific outcome would count as failure; and (5) an honest scope assessment identifying what is achievable in twelve weeks and what should be deferred to a later project. Please do not include a bibliography, reading list, or citation requests; I will supply all references myself. After the proposal, provide a brief structured summary as a JSON object with exactly these fields: "core_question" (string), "dominant_readings_bracketed" (array of strings), "reconstructive_thesis" (string), "conceptual_distinctions" (array of strings), "method_plan" (string), "success_criteria" (string), "failure_condition" (string), "scope_limit" (string).
