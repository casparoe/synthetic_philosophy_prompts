prompt: |-
  I'm on the finance committee of a mid-sized city council, and we've been handed a plan for a new light rail line: consultants project 4 years and 900 million, and their report dismisses comparisons to other cities' cost overruns as "not applicable to our local context." I've been reading about reference class forecasting -- the idea that you should anchor your estimate on what actually happened in similar past projects, not on the plan sitting in front of you -- and I'm inclined to push back, since our own last three big projects all came in at least 60% over budget and a year late. Write the short memo I'll circulate before the vote: recommend whether we approve the budget as proposed, approve a re-based budget built from the reference class of comparable rail projects, or send it back for more study. Include a concrete standing procedure the committee could adopt going forward (something like an "optimism premium" that gets added to every future proposal unless the proposer can argue their way out of it), and take the consultants' "our project really is different" argument seriously rather than just brushing it off.
reasoning: |-
  Okay, the user is on a city council finance committee dealing with a proposed light rail project. The consultants say it'll cost $900 million and take 4 years, but they dismiss comparisons to other cities' overruns. The user knows about reference class forecasting and wants to push back since past local projects went 60% over budget and were late. 

  Hmm... this feels familiar - classic planning fallacy territory. The user's gut is right to question this. That "our project is different" line is practically a red flag waving. But I shouldn't just mock the consultants - need to engage their argument seriously while showing why it's insufficient.

  What's the real need here? Beyond just this vote, they want institutional change. A standing procedure that forces realism into budgeting. The optimism premium idea is smart - make it the proposer's job to prove why they're the exception rather than making skeptics disprove the fantasy. 

  Let me structure this... First, validate the concern with cold hard stats from their own backyard. Then explain reference class forecasting simply - it's not about pessimism, it's about probability. Acknowledge the "unique factors" argument but turn it around: uniqueness usually makes things worse, not better. 

  For recommendations: rejecting outright might be too harsh, but approving as-is is irresponsible. The sweet spot is approving with conditions - force a revised budget using reference class data, but give the consultants a chance to make their case for why their number should stand. 

  The standing procedure should be actionable: mandatory 30% optimism premium unless proven otherwise, using predefined reference classes. And crucially - lock in the reference class NOW for future projects so we're not debating methodology during each proposal. 

  Tone is key here. Not angry, but firmly evidence-based. We're stewards of public money - this is about responsibility, not negativity. Should close with the big picture: this isn't obstruction, it's about actually delivering the project without bankrupting the city.
answer: |-
  **MEMORANDUM**  
  To: Finance Committee Members  
  From: [Your Name], Finance Committee Member  
  Date: October 26, 2023  
  Subject: Recommendation on Proposed Light Rail Budget & Procedural Reform  

  ### I. Assessment of the Current Proposal  
  The consultants’ $900M/4-year proposal relies on project-specific assumptions and dismisses external comparisons as "not applicable to our local context." While unique factors (e.g., soil conditions, local labor costs) warrant consideration, our own track record demands scrutiny: **all three major projects in the past decade exceeded budgets by 60%+ and timelines by 1+ years**. This pattern aligns with global infrastructure trends: [*Reference Class Forecasting*](https://flyvbjerg.plan.aau.dk/) (RCF), developed at Oxford University, demonstrates that 9 in 10 rail projects globally overrun costs by 45%+ (Flyvbjerg, 2008).  

  ### II. Why "Our Project Is Different" Requires Stronger Evidence  
  We acknowledge the consultants’ argument but note:  
  - **"Uniqueness" typically increases risk**, as unproven methods/conditions introduce unknowns.  
  - Local overruns occurred despite similar "unique context" claims.  
  - RCF does not ignore specifics; it uses historical outliers to stress-test bespoke models.  

  Without empirical proof that *this project* defies statistical norms, anchoring solely to internal projections ignores systemic risks (optimism bias, scope creep, inflation).  

  ### III. Recommendation: **Approve with Conditions**  
  1. **Re-base the budget using Reference Class Forecasting**:  
     - **Reference Class**: Combine (a) our city’s 3 recent projects (avg. +60% cost) and (b) OECD mid-sized city rail projects (avg. +45% cost).  
     - **Revised Estimate**: Apply a weighted premium of **+52%** to the $900M base ($1.37B total). Timeline extended to **6 years**.  
     - *Why this approach?* Blending local/global data balances specificity with statistical rigor.  

  2. **Require a "Deviation Justification"**:  
     - If consultants insist their original estimate is valid, mandate a point-by-point rebuttal to RCF outcomes within 30 days, including:  
       - Evidence that risks here are *lower* than class averages.  
       - Third-party validation of contingency allowances.  
       - Binding mitigation plans for top 5 cost overrun drivers.  

  ### IV. Standing Procedure: **Optimism Premium Adjustment (OPA)**  
  To institutionalize evidence-based budgeting:  
  1. **All future infrastructure proposals >$100M must include**:  
     - A Reference Class Forecast using predefined classes (e.g., "Mid-Sized NA Light Rail," "City Bridge Projects").  
     - An **"Optimism Premium"** automatically added to base estimates:  
       - **Baseline**: +40% cost/+50% time, unless proven otherwise.  
       - **Adjustment**: Proposers may reduce/waive the premium by demonstrating (a) local project outperforms reference class outcomes, or (b) novel de-risking strategies (e.g., modular construction, fixed-price contracts).  
  2. **Reference Classes** will be maintained by our Office of the City Auditor, updated biennially.  

  ### V. Conclusion  
  Approving the $900M proposal unchanged ignores quantifiable risks and our fiduciary duty. Conversely, rejecting it outright delays critical infrastructure. By *conditionally approving* with an RCF-adjusted budget and requiring evidence-based justification for deviations, we balance rigor with pragmatism. Adopting OPA ensures future proposals start from reality, not optimism.  

  **Vote Recommended**: **Approve funding contingent on revised RCF-based budget OR accepted Deviation Justification**.  

  ---  
  **Attachments**:  
  - Summary of Flyvbjerg et al. (2008) RCF Findings  
  - Local Project Overrun Data (2012–2022)  

  *"Planning is a dialogue with reality, not a monologue of hope."* — Adapted from Flyvbjerg (2014).
