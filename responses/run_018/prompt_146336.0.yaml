prompt: |-
  I'm putting together a take-home for my upper-level philosphy of action course and need one essay prompt that gets into the weeds on weakness of will and hyperbolic discounting. I don't want students just reciting Davidson's essay on weakness of will or summarising Ainslie's picoeconomics. Instead, I want them to wrestle with a tension I'll call the precommitment paradox: if your present self binds your future self with a Ulysses contract to avoid akrasia, you're treating your own future agency as an external threat—like locking a stranger in a room—which seems to undermine the very diachronic autonomy that rational choice theory assumes. At the same time, if you don't bind yourself, hyperbolic discounting predicts you'll systematically betray your earlier judgments without any irrationality in the moment, since each present self is maximising its local utility.

  The question should ask students to do three things: first, explain why hyperbolic discounting, on its own, might dissolve the problem of akrasia into a series of locally rational choices; second, defend or reject the claim that Ulysses-style precommitment restores diachronic rationality only by fragmenting the agent into competing temporal parts; and third, propose how a defender of unified agency might reply—maybe by appealing to something like a narrative constraint or a standing commitment—without just name-dropping Parfit or Bratman.

  Please write the exam question, a model anwser of about 700 words, and a marking scheme that lists five must-hit moves, assigns marks out of 25, and notes the typical mistake that costs marks for each. Keep it meaningful for a model without web access—no citations needed, no obscure papers—but don't let it be answered by pure regurgitation either.
reasoning: |-
  We are creating an exam question that requires students to engage deeply with the tension between hyperbolic discounting, akrasia, and precommitment strategies (Ulysses contracts). The prompt should push them to think about the implications for diachronic agency and autonomy.

  Exam Question:

  **Prompt:** Hyperbolic discounting models of time preference suggest that individuals assign disproportionately high value to immediate rewards compared to future ones, leading to patterns of choice reversal as the moment of reward approaches. This pattern has been used to explain akrasia (weakness of will) as a series of locally rational choices by successive temporal selves. However, to counteract such reversals, agents may employ precommitment strategies (Ulysses contracts) that bind future actions. This raises a paradox: precommitment treats the future self as an external threat to be controlled, thereby fragmenting the agent across time and undermining the idea of a unified, autonomous agent. Yet without such strategies, the agent is systematically led by hyperbolic discounting to act against their own prior judgments.

  In an essay of approximately 700 words, address the following:

  1. Explain how hyperbolic discounting, as a model of time preference, can recast akratic action as a series of locally rational choices, thereby dissolving the traditional problem of akrasia (understood as acting against one's better judgment at a given time).
  2. Defend or reject the claim that Ulysses-style precommitment restores diachronic rationality only by fundamentally fragmenting the agent into competing temporal parts, thereby undermining diachronic autonomy.
  3. Propose how a defender of a unified conception of agency might respond to this dilemma (without simply invoking Parfit or Bratman). Consider, for instance, whether a narrative conception of the self, a standing commitment, or another unifying structure might preserve both the possibility of precommitment and the unity of agency.

  In your response, avoid merely summarizing Davidson or Ainslie. Instead, focus on the conceptual tensions and your own critical analysis.

  ---

  **Model Answer (Approx. 700 words):**

  Hyperbolic discounting offers a compelling model for understanding akrasia without invoking a failure of rationality at the moment of action. Unlike exponential discounting, which applies a consistent discount rate over time, hyperbolic discounting involves a steep devaluation of rewards as they are delayed. Thus, an agent might judge at time T1 that a long-term reward (e.g., health) is more valuable than an immediate pleasure (e.g., smoking) when both are far off. But as the moment of choice approaches at T2, the immediate pleasure is hyperbolically discounted less than the distant reward, making it the locally rational choice. Akrasia, then, is not a moment of irrationality but a shift in valuation due to time. The agent at T2 is maximizing local utility, and the conflict arises because the T1 self and T2 self have different valuations. Thus, hyperbolic discounting dissolves the traditional problem of akrasia by showing that each temporal self acts rationally within its own frame.

  However, to avoid the detrimental effects of hyperbolic discounting, agents may use precommitment strategies. A Ulysses contract — such as locking away cigarettes to prevent future smoking — binds the future self by making the akratic action impossible or very costly. This restores diachronic rationality by ensuring that the long-term goal set at T1 is not overturned by the T2 self. But it does so by treating the future self as an external force to be constrained. This creates the precommitment paradox: the agent fragments into a series of temporal agents, each with its own interests. The T1 self imposes a constraint on the T2 self, effectively denying the T2 self's autonomy. If we view agency as unified across time, such precommitment seems to violate the autonomy of the future self, turning it into a prisoner of the past. Thus, precommitment restores diachronic rationality at the cost of fragmenting the agent and undermining diachronic autonomy.

  I reject the claim that precommitment necessarily fragments the agent. Instead, I argue that precommitment can be an expression of a unified agent's autonomy. The key lies in how we understand the agent's identity over time. If the agent is conceived as a narrative unity, then precommitment is not an external constraint but a plot device that the agent uses to ensure the coherence of their life story. For instance, an author who locks themselves in a cabin to finish a novel is not fragmenting their agency; they are enacting a standing commitment to their narrative identity as a writer. This commitment exists as a stable disposition that overarches temporal parts. At T1, the agent does not see T2 as a separate agent but as a future instantiation of the same narrative project. The precommitment is thus a tool for maintaining narrative integrity, not a denial of future autonomy.

  Moreover, we can appeal to the idea of a standing commitment that persists through time and guides the agent's actions. A standing commitment is not a one-time judgment but an ongoing policy. For example, a commitment to sobriety is not just a past decision but a present and future orientation. When an agent with such a commitment precommits (e.g., by avoiding bars), they are not fragmenting their agency but reinforcing their unity. The future self is not a stranger; it is the same agent who holds the commitment, but who anticipates temporary shifts in motivation. Precommitment, then, becomes a way of protecting the commitment against temporary fluctuations. This view preserves autonomy because it is the agent's own enduring values that are being honored, not a past self's tyranny.

  In conclusion, hyperbolic discounting recasts akrasia as locally rational but globally suboptimal behavior. Precommitment, far from being paradoxical, can be an expression of a unified agent's autonomy when grounded in a narrative identity or standing commitment. The agent remains one, but uses tools to navigate the predictable shifts in motivation that come with time.

  ---

  **Marking Scheme (Total: 25 marks):**

  1. **Explanation of hyperbolic discounting and its dissolution of akrasia (0-6 marks)**  
     - Must-hit moves:  
       a) Clearly explains hyperbolic discounting (steep discounting of delayed rewards) and contrasts it with exponential discounting.  
       b) Shows how akrasia becomes a series of locally rational choices without a failure of rationality at the moment of action.  
     - Typical mistake: Only describing akrasia without linking it to the discounting model, or failing to explain why each choice is locally rational.

  2. **Analysis of the precommitment paradox and the fragmentation claim (0-8 marks)**  
     - Must-hit moves:  
       a) Explains how Ulysses contracts work and how they restore diachronic rationality.  
       b) Clearly articulates the precommitment paradox (treating the future self as an external threat).  
       c) Takes a position (defends or rejects) on whether precommitment fragments the agent and undermines autonomy.  
     - Typical mistake: Merely describing precommitment without addressing the fragmentation issue, or taking a position without argument.

  3. **Proposal for a unified agency response (0-7 marks)**  
     - Must-hit moves:  
       a) Offers a coherent alternative (e.g., narrative identity, standing commitment) that avoids fragmentation.  
       b) Explains how this alternative preserves both precommitment and unity/autonomy.  
       c) Avoids simply name-dropping theorists; develops the idea independently.  
     - Typical mistake: Vague or underdeveloped proposal, or falling back on Parfit/Bratman without original application.

  4. **Overall coherence, structure, and clarity (0-4 marks)**  
     - Must-hit moves:  
       a) Essay is well-organized and addresses all parts of the prompt.  
       b) Arguments are clear and logically developed.  
     - Typical mistake: Disjointed essay, missing one of the three required parts, or unclear writing.

  **Note**: The marks are allocated such that the first three criteria are the core content (21 marks) and the last is for presentation (4 marks). The total is 25 marks. The model answer above is structured to hit all the must-hit moves.
answer: |-
  ### Exam Question: The Precommitment Paradox in Diachronic Agency

  **Prompt:** Hyperbolic discounting models explain akrasia (weakness of will) as a consequence of shifting time preferences: an agent’s valuation of rewards spikes sharply as they become imminent, leading to choices that contradict earlier plans. This recharacterizes akrasia as a series of locally rational actions rather than a failure of rationality. To resist such reversals, agents may use Ulysses-style precommitments (e.g., binding contracts or physical constraints) to restrict future choices. However, this strategy raises a paradox: precommitment treats the *future self* as an external adversary to be controlled, fragmenting the agent into competing temporal parts and undermining diachronic autonomy—the idea of a unified agent governing actions across time. Conversely, without precommitment, hyperbolic discounting predicts systematic self-betrayal with no irrationality at the moment of choice.  

  In a focused essay, address the following:  
  1. **Explain** how hyperbolic discounting dissolves the traditional problem of akrasia by recasting it as locally rational behavior.  
  2. **Defend or reject** the claim that precommitment restores diachronic rationality *only* by fragmenting the agent and eroding diachronic autonomy.  
  3. **Propose** how a defender of unified agency might resolve this tension without relying on precommitment or appealing to theorists like Parfit or Bratman. Consider alternatives like narrative identity or standing commitments.  

  Avoid summarizing Davidson or Ainslie; engage critically with the paradox.  

  ---

  ### Model Answer (Approx. 700 words)  

  Hyperbolic discounting dissolves the traditional problem of akrasia by redefining it as a structural feature of temporal reasoning, not a defect in practical rationality. In exponential discounting, agents devalue future rewards at a constant rate, preserving consistent preferences over time. Hyperbolic discounting, however, involves a steep, time-sensitive devaluation: rewards are disproportionately preferred as they near, causing reversals of earlier plans. For example, at T1 (a week before an exam), studying is valued over partying because the exam’s importance outweighs immediate fun. At T2 (the night before), the immediate reward of partying is hyperbolically amplified, making it the locally optimal choice. Each “self” at T1 and T2 acts rationally within its temporal context, maximizing utility given its shifting valuations. Akrasia thus ceases to be a mysterious failure of will; it is a predictable outcome of dynamic preferences. The puzzle shifts from *why an agent acts irrationally* to *how agents can achieve diachronic coherence* despite these shifts.  

  Precommitment strategies, such as Ulysses binding himself to his ship’s mast to resist the Sirens, aim to restore diachronic rationality by eliminating future temptations. Yet this approach creates a paradox: it treats the future self as a hostile external force, fragmenting the agent into competing temporal entities. The T1 self imposes constraints on the T2 self, reducing the latter’s autonomy to that of a prisoner—locked in a room by a stranger. This undermines the unity of agency, as there is no single “self” governing actions across time; instead, temporal segments engage in strategic conflict. For instance, setting a password to block social media use assumes the future self is an adversary to be defeated, not a continuation of the same agent. I reject the claim that this fragmentation is *necessary* for diachronic rationality, but I concede it is an inherent risk in crude precommitment. When precommitment operates via coercion (e.g., physical locks), it indeed fractures agency by denying the future self’s capacity for reasoned engagement with the original commitment. However, this need not invalidate precommitment if it expresses a deeper unity.  

  A defender of unified agency can resolve the tension by grounding precommitment in a narrative conception of the self. Here, identity is not atomized into temporal slices but integrated into a coherent life story. Precommitment becomes a tool for maintaining narrative continuity, not a weapon against future selves. For example, an aspiring novelist who disables internet access to write a book is not imprisoning their future self but honoring a standing commitment to their role as an author. This commitment transcends individual moments, acting as a “narrative constraint” that binds the agent across time. The future self is not a stranger; it is an embodiment of the same story, temporarily waylaid by hyperbolic impulses. Standing commitments—enduring value-based policies (e.g., “I am a person who prioritizes health”)—further unify agency. When such commitments inform precommitment, they transform it from external imposition to internal affirmation. The novelist’s action is not a T1 diktat but an enactment of their identity, making the constraint a shared project across time. Hyperbolic discounting is not abolished, but its effects are mitigated by embedding choices in a stable normative framework. Crucially, this avoids fragmentation: the agent remains whole, using precommitment to align momentary actions with their overarching narrative.  

  In sum, hyperbolic discounting explains akrasia as locally rational time-preference shifts. Precommitment risks fragmentation when coercive, but within a framework of narrative identity or standing commitments, it can express—not erode—diachronic autonomy. Unified agency emerges not from denying temporal conflicts, but from integrating them into a coherent self-narrative.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **Must-hit moves** (each addresses a core aspect of the prompt; missing one incurs penalties as noted).  

  1. **Clear explanation of hyperbolic discounting’s dissolution of akrasia** (0–6 marks)  
     - *Must-hit moves*: (a) Contrast hyperbolic vs. exponential discounting; (b) Show how akrasia becomes locally rational.  
     - *Typical mistake*: Describing akrasia generically without linking discounting to local rationality (–3 marks).  

  2. **Critical position on precommitment’s fragmentation claim** (0–7 marks)  
     - *Must-hit moves*: (a) Articulate the “prisoner” paradox; (b) Defend/reject fragmentation with reasoning.  
     - *Typical mistake*: Asserting fragmentation without paradox analysis, or ignoring autonomy (–3 marks).  

  3. **Innovative proposal for unified agency** (0–6 marks)  
     - *Must-hit moves*: (a) Develop a non-Parfit/Bratman alternative (e.g., narrative/commitment); (b) Explain how it resolves the tension.  
     - *Typical mistake*: Vague appeals to “self-governance” without concrete mechanisms (–3 marks).  

  4. **Avoidance of mere summary** (0–3 marks)  
     - *Must-hit moves*: Original analysis; no Davidson/Ainslie recitation.  
     - *Typical mistake*: Rehashing textbook definitions without engagement (–2 marks).  

  5. **Structure and clarity** (0–3 marks)  
     - *Must-hit moves*: Logical flow; all prompt parts addressed.  
     - *Typical mistake*: Disjointed arguments or omitted sections (–2 marks).  

  **Grade boundaries**: 21–25 (Excellent), 16–20 (Good), 11–15 (Adequate), 0–10 (Poor).
