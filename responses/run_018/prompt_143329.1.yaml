prompt: |-
  I was argueing with my roommate last night about whether conscious experience gets Stalinesque revisions — like the brain rewriten the record after the fact — or Orwellian ones where the live stream gets overwritten but you never catch it. We kept circling the color phi thing: you flash a green dot then a red dot in quick successsion and people report seeing one dot sliding across and turning color mid-air, even though there's never an actual orange or yellow frame.

  Anyway, I want the full conceptual spec before I read more theories. Write me the desiderata a theory of the timing of experience must satisfy: cover color phi and both revision styles, respect the distinction between post-hoc reconstruction and in-the-moment overwriting, and also handle this niche case I'm calling 'phenomenal overlap' — where visual and auditory inputs carry slightly mismatched neural timestamps but the subject experiences them as a single unified instant with a fake 'common cause' feeling. For each requirement say what case or reasoning forces it, flag any pair you think can't be jointly satisfied, and note which ones feel non-negotiable versus which ones might be dropped if the theory pays enough elsewhere. Then briefly score a pure Stalinesque view, a pure Orwellian view, and a predictive-coding-flavored hybrid against the list. Don't ask me for citations or reading lists — I'm working offline and just want the architecture laid out clearly.
