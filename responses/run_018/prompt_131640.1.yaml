answer: |-
  ### Senior Moral Philosopher's Brainstorm: Tensions in Reparations Theory  
  *(Raw tensions before systematizing)*  
  1. **Dead victims & perpetrators**: Can obligations transcend death? If victims/perpetrators no longer exist, who owes whom?  
  2. **Non-identity problem**: Reparations might imply descendants are "harmed" by injustice—but without it, they wouldn't exist. Can we compensate *for* wrongs that were necessary for their existence?  
  3. **Collective vs. individual agency**: Can groups (e.g., states) bear moral responsibility? Can descendants inherit claims without diluting agency?  
  4. **Harm metamorphosis**: How to repair when historical theft becomes entrenched structural inequality (e.g., land dispossession → generational poverty)?  
  5. **Corrective vs. distributive aims**: Is the goal to restore *pre-injustice* conditions (corrective) or *present fairness* (distributive)? These demand different actions.  
  6. **Feasibility constraints**: Moral purity vs. legal/political viability (e.g., taxing uninvolved taxpayers for ancestors' sins).  
  7. **Symbolic vs. material repair**: Must reparations include both? What if they conflict?  

  ---

  ### Desiderata for an Adequate Theory of Reparations  
  **I. Cases Any Theory Must Handle**  
  - **C1: Descendants without direct experience**  
    *Why*: Most claimants are generations removed. Theory can’t require firsthand suffering.  
    *Constraint*: Hard (reality-based).  
  - **C2: Transformed harms** (e.g., forced relocation → present-day wealth gaps)  
    *Why*: Injustice often morphs; repair must address its living legacy.  
    *Constraint*: Hard (empirical necessity).  
  - **C3: Extinct parties** (wrongdoers/victims dead, groups dissolved)  
    *Why*: Common in historical cases. Theory must assign obligations sans direct agents.  
    *Constraint*: Hard.  

  **II. Non-Collapsible Distinctions**  
  - **D1: Repair vs. redistribution**  
    *Why*: Repair addresses *specific wrongs*; redistribution addresses *current inequality*. Conflating them risks historical erasure or unjust confiscation.  
    *Constraint*: Hard (corrective justice foundation).  
  - **D2: Group-level vs. individual-level claims**  
    *Why*: Injustices target groups, but repair often reaches individuals. Must navigate collective responsibility without negating individual variation (e.g., a descendant who thrived despite injustice).  
    *Constraint*: Hard (anti-essentialism).  

  **III. Non-Contradictory Results**  
  - **R1: Corrective justice constraints**  
    *Why*: Can’t punish the innocent (e.g., uninvolved taxpayers) or overcompensate. Liability must track responsibility.  
    *Constraint*: Hard (deontological bedrock).  
  - **R2: Legal-institutional feasibility**  
    *Why*: Reparations require implementable mechanisms (e.g., courts, legislatures). Utopian theories are inert.  
    *Constraint*: Soft but pragmatic (applied ethics demands it).  
  - **R3: Consistency with forward-looking justice**  
    *Why*: Repair shouldn’t entrench new injustices (e.g., violating rights of others).  
    *Constraint*: Hard.  

  ---

  ### **Jointly Unsatisfiable Pair? Individual Corrective Justice + Group Structural Repair**  
  - **Tension**: Corrective justice (CJ) requires identifiable wrongdoers compensating identifiable victims. Group structural repair (SR) demands systemic change for diffuse, inherited disadvantage.  
  - **Why they clash**:  
    - CJ resists holding innocents liable (e.g., descendants of perpetrators).  
    - SR requires treating groups (not individuals) as claimants/obligors.  
    - CJ focuses on *past wrongs*; SR on *present effects*.  
  - **Possible reconciliation?** Only via *hybrid models* that separate liability (state/collective bearers) from beneficiaries (affected groups/individuals), but this risks violating R1 (punishing innocents).  

  ---

  ### Quick Theory Scorecard  
  *(Against key desiderata: ✓ = satisfies, ~ = partial, ✗ = fails)*  

  | Desideratum                     | Corrective Justice (CJ) | Distributive Justice (DJ) | Hybrid Structural-Reparative (HSR) |  
  |---------------------------------|-------------------------|---------------------------|-----------------------------------|  
  | **C1: Descendants**             | ✗ (needs direct victims)| ✓ (focuses on need now)   | ~ (if lineage proves disadvantage) |  
  | **C2: Transformed harms**       | ✗ (ignores legacy)      | ✓ (targets inequality)    | ✓ (explicitly addresses legacy)    |  
  | **C3: Extinct parties**         | ✗ (requires living wrongdoers)| ~ (ignores cause)     | ✓ (obligations fall to state/society) |  
  | **D1: Repair ≠ redistribution** | ✓ (strictly reparative) | ✗ (conflates the two)     | ~ (repair via structural change)   |  
  | **D2: Group/individual balance**| ✗ (hyper-individualist) | ~ (group-focused)         | ~ (groups claim, individuals benefit)|  
  | **R1: No punishing innocents**  | ✓ (liability-specific) | ✓ (if needs-based)        | ✗ (often broad taxation)           |  
  | **R2: Feasibility**             | ~ (hard to prove claims)| ✓ (uses existing systems) | ~ (requires new institutions)      |  
  | **R3: Future-compatible**       | ✓ (closed once paid)    | ✓ (continuous adjustment) | ~ (may create new conflicts)       |  

  **Brief Reasoning**:  
  - **CJ** excels on individual accountability (R1, D1) but fails historical cases (C1–C3).  
  - **DJ** handles present inequality (C2, R2) but ignores history (violates D1).  
  - **HSR** best addresses transformed harms (C2, C3) but stumbles on liability (R1) and repair/redistribution blurring.  

  **Conclusion**: No theory satisfies all desiderata. HSR comes closest on historical harms but faces the toughest moral constraints (R1). The core tension—**individual liability vs. group repair**—remains philosophically abrasive. A defensible theory must either:  
  1. **Limit reparations to symbolic/surviving claims** (prioritizing CJ), or  
  2. **Treat structural repair as a *distinct obligation* from corrective justice** (e.g., societal debt for inherited disadvantage), accepting weaker liability links.  

  This is the unavoidable crux: you *can* have both, but not without compromising the purity of corrective justice. The moral cost depends on how deeply you weight present structure over past wrong.
