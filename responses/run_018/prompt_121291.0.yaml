  1.  **Title & Dept. Name:** Establishes governmental acceptance of unbounded utility & non-zero probabilities.
  2.  **Ministerial Foreword:** Sends up the "serious concession" to the mugger's logic, framing it as prudent risk management.
  3.  **Problem Definition (§1.1-1.3):** Mocks the core paradox – tiny probability * infinite disutility/utility = infinite expected value.
  4.  **Scope (§1.4):** Satirizes the symmetry between threats (muggers) and promises (optimists), treating both as valid claimants.
  5.  **Leverage Discount (§2.2):** Implements Bostrom's "Many Claimants" rebuttal (dividing claim by N) as a sober administrative rule.
  6.  **Fee Structure (§2.3):** Sends up the impossibility of hard zero probability – even negligible fees can't be zero, creating infinite regress.
  7.  **Optimist Claims (§2.4):** Highlights the absurdity of owing everything to every optimist, requiring prioritization.
  8.  **Registration/Lottery (§3.1):** Smuggles in the "fanaticism"/normalization objection by forcing finite budget splitting.
  9.  **Lottery Mechanics (§3.2):** Mocks the practical application – infinite claimants reduced to lottery tickets.
  10. **Impact Assessment (§4):** Satirizes the paralyzing consequences (infinite liabilities) and the bureaucratic 'solution' (finite budget).
  11. **Glossary Terms:** Definitions like "Hyper-Astronomical Suffering" parody the attempt to formalize the absurd.
  12. **Consultation Qs (§5):** Questions like "Is £5 sufficient?" directly mock the mugger's original demand within the framework.

  ---

  **Office for Speculative Harm: Draft Framework for Unbounded Claims**

  **Consultation Document**
  **CP 742 / OSH/2024**
  **Issued: 1st April 2024**
  **Closing Date: 31st June 2024**

  **Ministerial Foreword by the Rt Hon. Thalia Pensive MP, Secretary of State for Existential Resilience**
  Recent advances in decision theory compel a prudent reassessment of governmental risk frameworks. As custodians of the public purse and national wellbeing, we must acknowledge that threats or opportunities involving hyper-astronomical scales of potential suffering or benefit – however intuitively implausible – cannot be rationally dismissed *a priori*. Assigning absolute zero probability to *any* conceivable scenario is no longer considered epistemically robust. Consequently, expected value calculations must accommodate unbounded utility scales. This draft Framework, developed by the Office for Speculative Harm (OSH), establishes procedures for the transparent, equitable, and administratively feasible assessment of claims predicated on such reasoning, ensuring the UK remains at the forefront of catastrophic risk mitigation and cosmic opportunity capture. Your engagement is vital.

  **1. Introduction & Scope**
  1.1 **Purpose:** To provide a structured mechanism for evaluating claims involving potential impacts on hyper-astronomical numbers of sentient entities (N), where N approaches or exceeds quantities such as 3↑↑↑3, thereby generating theoretically unbounded expected utility or disutility.
  1.2 **Legal Basis:** Powers derived from the Precautionary Cosmic Liability Act 2023 (c. 87) and the Rational Optimisation of Existential Prospects Order 2024.
  1.3 **Problem Statement:** Traditional cost-benefit analysis fails where disutility/utility (U) is unbounded and the subjective probability (p) of the scenario occurring is non-zero, however minute. The product p * |U| can dominate all other considerations (Pascal’s Principle of Dominant Catastrophe/Opportunity).
  1.4 **Scope:** Applies equally to:
      *   **Threat-Based Claims (TBCs):** Assertions that failure to pay a sum (S) will result in the claimant inflicting suffering on N entities (e.g., "Pascal’s Muggers").
      *   **Optimist-Based Claims (OBCs):** Assertions that payment of a sum (S) will enable the claimant to confer benefit on N entities (e.g., "Pascal’s Benefactors").
      *   Claims may pertain to future humans, extraterrestrial intelligences, post-biological minds, or other plausible sentient substrates within our causal future or accessible Everett branches.

  **2. Claims Assessment Mechanism**
  2.1 **Registration:** All Unbounded Claims (UCs) must be formally registered with OSH via Form UC-1, detailing N, U (per entity), p (estimated probability), S (sum demanded/offered), and causal mechanism. A non-refundable Administrative Processing Fee (APF) of £5 is required per claim (§2.3).
  2.2 **Leverage Discount Factor (LDF):** Recognising the theoretical possibility of near-identical claims from up to N potential claimants, the raw claimed expected utility |p * U * N| is discounted by a factor of 1/N.
      *   *Rationale:* Ensures equity among hypothetical claimants making substantively similar assertions. Prevents systemic overcommitment based on leverage.
      *   *Worked Example:* A mugger claims p=10^-100 of torturing N=10^100 beings unless paid £5. Raw Expected Disutility: 10^-100 * U_torture * 10^100 = U_torture. After LDF: (U_torture) / 10^100. This discounted value is used for prioritisation.
  2.3 **Fee Structure & Non-Zero Probability:**
      *   The £5 APF acknowledges the irreducible non-zero probability (p_min ≈ 1/(UK GDP in pence)) that any submitted claim, however outlandish, possesses *some* minimal epistemic weight requiring administrative consideration. Waivers are unavailable; a claim with S=0 effectively concedes p=0 and is invalid.
  2.4 **Optimist Claims & Prioritisation:** OBCs generate positive expected utility after LDF. However, as the Treasury cannot disburse more than its total assets (A) without violating solvency constraints, and the sum of all registered OBCs after LDF may exceed A, prioritisation is essential (see Section 3).

  **3. Resource Apportionment for OBCs**
  3.1 **The Finite Budget Constraint (FBC):** OSH administers a fixed annual Unbounded Opportunity Budget (UOB), initially set at £1 million. All registered OBCs deemed valid (p > p_min) are eligible for a share.
  3.2 **Proportional Lottery Allocation:**
      *   Each valid OBC is assigned Lottery Tickets (LTs) proportional to its discounted expected utility: LTs = (p * U_benefit * N * LDF) = p * U_benefit. (Note: N and LDF cancel).
      *   *Rationale:* Ensures allocation reflects the *relative* expected utility magnitude within the finite UOB, normalising against total claims.
      *   A quarterly lottery allocates the UOB pro-rata based on LTs held. E.g., an OBC holding 10% of total LTs receives 10% of the quarterly UOB disbursement.
      *   Payments are capped at the claimant's requested S. Unclaimed portions revert to the UOB.

  **4. Impact Assessment**
  *   **Benefits:** Ensures rigorous, non-dismissive evaluation of all potential existential risks/opportunities. Enhances UK leadership in rational foresight. Mitigates accusations of epistemic negligence.
  *   **Costs:** Significant administrative burden (OSH staffing, UC-1 processing). The theoretical aggregate liability from TBCs is unbounded, though LDF drastically reduces payable amounts. The UOB represents a tangible expenditure against highly uncertain returns. Potential for very large queues of claimants.
  *   **Risks:** Reputational risk from engaging with speculative claims. Moral hazard if claimants perceive OSH as a source of easy funds. Inability to fully satisfy the theoretical demands of Pascal’s Principle with finite resources.

  **5. Consultation Questions**
  We welcome views on all aspects of this Framework, particularly:
  1.  Is the Leverage Discount Factor (1/N) the optimal mechanism for ensuring equity among potential claimants? Are alternative discounting models (e.g., logarithmic) preferable?
  2.  Is the £5 Administrative Processing Fee sufficient to operationalise the principle of irreducible non-zero probability while maintaining accessibility? Should it be index-linked?
  3.  Is the initial Unbounded Opportunity Budget (UOB) of £1 million p.a. proportionate? Should it be ring-fenced from core departmental budgets?
  4.  Does the Proportional Lottery Allocation effectively balance the demands of theoretical rationality with practical fiscal constraints for Optimist-Based Claims?

  **6. Glossary**
  *   **Hyper-Astronomical Suffering/Benefit (U):** Disutility or utility on a scale vastly exceeding the number of particles in the observable universe or computable through large recursive operations (e.g., 3↑↑↑3).
  *   **Non-Zero Probability (p > 0):** The epistemic principle that no logically coherent scenario describable in finite terms can be definitively assigned probability zero.
  *   **Pascal’s Principle of Dominant Catastrophe/Opportunity:** The decision-theoretic axiom that where p > 0 and |U| is unbounded, p*|U| dominates finite expected utilities.
  *   **Unbounded Claim (UC):** A formal demand or offer falling under the scope of this Framework.

