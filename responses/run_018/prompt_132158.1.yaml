  Ah! And scaling up runs into EPR-Bell nonlocality: correlations are spacelike separated, so any "slice" would violate Lorentz covariance. Presentism would need nonlocal hidden variables à la Bohm, but that conflicts with SR's spirit. 

  The user's niche idea is clever but ultimately doesn't bypass no-signaling. The disagreement seems metaphysical—block theorists see correlation as physical but not ontological, while presentists might overinterpret it. 

  I should emphasize: even if you scaled this up, the "slice" would be frame-dependent for different observer pairs. That dynamites any global present. Lorentzian presentism survives only by making the frame undetectable, but this protocol doesn't detect it either. 

