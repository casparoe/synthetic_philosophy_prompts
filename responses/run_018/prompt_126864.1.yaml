answer: |-
  **Bottom line:** The described pattern is best termed **Causal Palimpsest Immunity**, where a cultural-cause claim (C→O) is immunized against counter-examples via post-hoc, unfalsifiable partner conditions (P).

  **Logical Structure & Distinction:**
  1.  **Form:** A *Necessity Claim* (C necessary for O) encounters counter-factual evidence (C without O, O without C). The defender introduces *Post-hoc Partner Conditions* (P):
      *   `C + P → O` (explaining C without O by P's absence)
      *   `~C + P' → O` (explaining O without C by a functional substitute P')
      P/P' are defined *only* by their ability to reconcile the specific counter-example with the original claim, lacking independent specification or testability. C's necessity becomes unfalsifiable.
  2.  **Distinction from Failures:**
      *   **vs. Legitimate Interaction:** Legitimate interactions specify *testable* boundary conditions *a priori*. Here, P is *ad hoc*, untestable, and defined solely by O's occurrence/non-occurrence.
      *   **vs. Lakatos's Protective Belt:** Auxiliary hypotheses in the protective belt are *independently testable/progressive*. P here is *immunizing*, not testable independently of O.
      *   **vs. Ad Hoc Reasoning:** While ad hoc, it's a *specific subtype*: the partner condition functions as a *movable, substitute necessity shield*.
      *   **vs. Weber's Elective Affinity:** Affinity describes mutual shaping/reinforcement, *not* unidirectional necessity claims shielded by unfalsifiable conditions.

  **Causal Palimpsest Immunity Definition:** A strategy immunizing a necessity claim (C→O) against falsification by introducing post-hoc, unfalsifiable partner conditions (P/P') that: 1) Are defined *only* by their ability to reconcile specific counter-examples; 2) Lack prior specification or independent testability; 3) Allow `C + P → O` and `~C + P' → O`, making C's necessity untestable.

  **Hypothetical Case:** Claim: "Egalitarian Clan Structure (C) is necessary for Tribal Democracy (O)." Counter: Society X has O without C. Defender: "Ah, but X had intense External Threat (P'), which *substituted* for C by forcing consensus." P' is defined solely by this function, untestable independently. C remains "necessary" in principle.

