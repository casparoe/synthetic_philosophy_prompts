prompt: |-
  im writing a novel — small town, factory closing, two sisters who have to decide whether to say out loud that the man who kept the place running for thirty years did something shabby to a kid who worked there one summer. one sister thinks the family and the town should close ranks; the other thinks somebody got hurt and it has to be said. the problem is not the plot, its that every time i write them arguing i get two cardboard cutouts: one all sentiment and loyalty, one all harm and fairness. so before i build the rest of the cast on top of it, i want the spec rather than the theory.

  what would a theory of moral judgment have to deliver for me to trust it as scaffolding for characters who disagree like this? not "which theory is true" — the list of requirements, each with the case or consideration behind it, so i can see which demands are real and which are just one camps ideology dressed up as a criterion. adequacy here means a specific thing for me: good enough that a reader who disagrees with a character still recognises her as a person with reasons, and good enough that i can predict what she does in a scene i haven't written yet.

  here are the things i keep tripping over as i write, which i suspect are cases any such theory has to handle — tell me which of them actually deserve to be on the list, which are my own prejudice, and what i've left out:

  - the harmless-but-condemned ones: consenting adult siblings using contraception, a man who cooks and eats his own dog after the dog is already dead, someone cleaning a toilet with a national flag. people condemn and then can't produce a victim, and when you knock down their reasons they keep the verdict.
  - the gap between killing and letting die, and between the personal and impersonal versions of the trolley family — is that distinction doing real moral work or is it an artefact of which emotional system gets triggered, and if its an artefact, does that defuse the intuition or indict it?
  - verdicts getting harsher in a foul-smelling room or after a bitter drink, and how much weight that deserves given that effects of this kind have had replication trouble.
  - the residue: a character who has stopped believing something is wrong and still flinches at it. and the reverse — the character who has argued himself into endorsing something and still can't bring himself to do it.
  - the flip: somebody who changes her mind on an issue over about two years, after which she has a complete and fluent set of reasons that were not what moved her.
  - the cases with no polling data. my characters have to react to situations nobody has surveyed — a specific betrayal in a specific kitchen. so the theory has to generate verdicts for new cases, not just catalogue the ones it was fitted to. i think this is the requirement that kills off a lot of candidates, but you tell me.
  - the observable markers. i can write thoughts but i mostly need bodies: what does a change in moral conviction look like from outside?
  - the moral/conventional line as kids are supposed to draw it — hitting someone versus breaking a school rule about what to wear — and the awkward fact that for a lot of people purity violations feel like both morality and just disgust at once.
  - the bit where moral conviction stops being a strong preference and becomes something you'd enforce on strangers who weren't involved.
  - heritability stuff, the fact that moral intuitions are trainable, and the fact that whole classes of acts go from unremarkable to unthinkable inside a couple of generations. if conviction can move that fast and that far, what is left of the feeling that this one is just true?
  - the same person being a stickler in one domain and a consequences guy in another, and being a different moral agent with her family than with a stranger or an outgroup.
  - and then the one i actually care about for the sisters: does any of this psychology tell us anything about who is right, or is that question on a completely separate track? i have a feeling my two favourite requirements are going to fight here — that a theory can't both take seriously the way conviction presents itself (as about the thing, not about me) and explain that conviction as weights that got set by culture, upbringing and mood. if some subset of the desiderata can't be jointly satisfied, say so and show me where the tension is; that's the part i want most.

  mark which requirements are non-negotiable for my purpose and which are negotiable or just somebody's preference, and say which single requirement does the most work in excluding popular theories. then, very briefly — a few lines, not an essay — how the main contenders do: the harm-only rationalist picture, the pluralist foundations picture with its care/fairness/loyalty/authority/purity/liberty style menus, the morality-as-cooperation kind of view, and the hard-nosed "its all tribal signalling" one. and one more novelist thing: give me the knobs. what parameters would i actually set to build a character whose verdicts are predictable but not mechanical?

  no footnotes or reading list please, i cant chase references anyway. and write the whole answer in British English.
reasoning: |-
  Alright, let's tackle this query from a novelist struggling with moral complexity in characters. The user wants to create two sisters with genuine moral disagreements about exposing a man's past misconduct, avoiding cardboard cutouts. They've listed several psychological and philosophical sticking points they encounter when writing arguments.

  First, I need to identify which of their listed concerns are essential for building believable characters versus which might be personal bias. The harmless-but-condemned scenarios (like flag toilet cleaning) reveal emotional moral intuitions overriding harm principles - crucial for showing how Sister A (loyalty) might condemn without victims. The gap between killing/letting die matters for how Sister B (justice) frames her stance as active harm prevention.

  The environmental influences like foul smells affecting judgments seem less critical - while real, they're too subtle for narrative portrayal. The "residue" and "flip" phenomena are gold though: Sister A might intellectually know the truth should come out but physically recoil at betraying community, while Sister B's two-year conviction shift could mirror the town's gradual awakening. These create interior conflicts beyond mere debating positions.

  Key non-negotiables emerge: moral/conventional distinctions (show why Sister B sees this as fundamental wrong not just rule-breaking), heritability/trainability (explain how both sisters formed different values in same town), and domain-specific morality (Sister A strict about loyalty but flexible with strangers). Most vital is generating novel judgments - the sisters must react uniquely to the unpublished kitchen betrayal scene based on their moral frameworks.

  The core tension they care about - whether moral psychology informs who's actually right - requires careful handling. I'll note that while psychology explains conviction origins, normative rightness remains philosophical. Their sister conflict gains depth if both psychological drivers and objective stakes feel real.

  For theory assessment: harm-only rationalism fails the harmless condemnation test; pluralist foundations handle loyalty/purity tensions well; cooperation theories explain community cohesion pressures; tribal signalling captures performative aspects but oversimplifies. The knobs for character-building should include salience filters (what wrongs scream loudest to them), enforcement radius (who they feel entitled to judge), and emotional residue strength.

  Throughout I'll maintain British English spelling/idioms per request, avoid jargon, and focus on actionable character-building insights rather than academic theory. The goal is giving this writer concrete levers to pull for creating sisters who breathe beyond their moral positions.
answer: |-
  Here’s a breakdown tailored to your needs, focusing on what a theory of moral judgment must deliver for *character scaffolding* in your novel. Requirements are assessed for adequacy in creating believable, predictable characters whose moral disagreements feel human, not ideological.

  ### Non-Negotiable Requirements for Your Purpose
  1.  **Handles "Harmless Condemnation" (dog-eating, flag-toilet):** Essential. Shows moral conviction isn't *just* about harm/fairness. Characters need visceral reactions beyond victim identification (e.g., Sister A feels deep disgust/betrayal at the *idea*, even without a clear victim).
  2.  **Residue & Flip:** Essential. Captures the lag/cognitive dissonance between reasoned belief and gut feeling (e.g., Sister B *knows* loyalty matters but feels physically sick hiding the truth; Sister A later adopts justice arguments but still feels a pang of betrayal when speaking). This is core to internal conflict.
  3.  **Generates Novel Judgments:** Essential. The theory must provide principles/heuristics that extrapolate to your specific kitchen betrayal scene, not just catalogue existing dilemmas. Characters need consistent moral "logic".
  4.  **Observable Markers:** Essential. You need physical tells (flinching, posture shifts, voice hardening, avoidance, compulsive tidying, sudden coldness) that signal moral conviction/changes externally. This *is* character action.
  5.  **Moral/Conventional Distinction & Purity/Disgust Blend:** Essential. Explains why Sister B sees the act as a *fundamental* wrong (like hitting), not just breaking a town rule. The disgust-loyalty-purity blend fuels Sister A's "close ranks" instinct viscerally.
  6.  **Enforcement Radius:** Essential. Explains the leap from *personal* conviction ("*I* think it's wrong") to *imposing* it ("The town *must* know/ignore this"). Crucial for the sisters' conflict stakes.
  7.  **Domain-Specificity & Context-Shifting:** Essential. A character can be fiercely loyal (stickler) with family/town but utilitarian (consequences) with strangers/trade. Sister A might forgive a stranger's minor lie but see *any* disloyalty within the town as catastrophic.
  8.  **Heritability/Trainability/Rapid Shift:** Essential. Acknowledges convictions are shaped (not just born) and *feel* objective even when culturally relative. Sister A's loyalty feels like bedrock truth *because* it was the town's water she swam in; Sister B's justice might feel equally true due to wider cultural shifts she absorbed. This creates tragic depth – both feel fundamentally right.

  ### Negotiable or Less Critical for Characters
  9.  **Killing/Letting Die & Trolley Intuitions:** Useful for *depth* if relevant to the story (e.g., is exposing the man *actively* harming him vs. *letting* the town decline passively?). But the core distinction for *character* is often the emotion/principle triggered (personal vs. impersonal), not its objective "truth". Can be included as flavour if needed.
  10. **Foul Smells/Bitter Drinks Effects:** Negotiable. While showing mood influences judgment is *realistic*, replication issues and subtlety make it less useful for *core* character motivation. Better as background texture (e.g., a heated argument in a stuffy room escalates).
  11. **Psychology vs. "Who is Right":** **This is the crux.** *Psychology explains the origin and feel of conviction, not its objective truth.* For your novel, the *tension* between the feeling of objectivity ("This is just *wrong*!") and its psychological origins (culture, upbringing) is GOLD. It *doesn't* tell you who's right, but it makes both sisters' belief in their own rightness deeply human and understandable. This tension *is* the drama.

  ### The Single Most Excluding Requirement
  **Generating Novel Judgments.** Many popular theories (especially list-based ones like early MFT) excel at cataloguing known intuitions but struggle to predict *truly new* specific judgments without ad-hoc additions. If the theory can't help you decide *how* Sister A reacts to the *specific* details of the kitchen betrayal (the man's tone, the kid's reaction, the exact words used), it fails for character building.

  ### Brief Theory Assessment (British English)
  1.  **Harm-Only Rationalist:** Fails "harmless condemnation" and "purity/disgust". Sister A's loyalty-based disgust at airing dirty laundry makes no sense. Struggles with "residue" and "enforcement radius". Too narrow for your sisters.
  2.  **Pluralist Foundations (MFT - Care/Fairness/Loyalty/Authority/Purity/Liberty):** **Strongest contender.** Handles "harmless condemnation" (Purity, Loyalty), "residue/flip" (different foundations can conflict), "moral/conventional" (foundations feel moral), "enforcement radius" (foundations imply norms), "domain-specificity" (different foundations activated in different contexts), "heritability/trainability" (foundations are innate *prep* but culturally shaped). Predicts *types* of reactions well. Can sometimes struggle with *perfectly* predicting *novel* specifics without knowing the character's foundation weighting.
  3.  **Morality-as-Cooperation:** Focuses on solving cooperation problems (reciprocity, group cohesion). Explains *why* Loyalty and Fairness matter. Handles "enforcement radius" (norms require enforcement). Can feel a bit abstract for character *motivation* – Sister A feels *betrayal*, not just "this reduces group cohesion". Needs supplementing with psychology of emotion.
  4.  **Tribal Signalling:** Useful *aspect*, not a whole theory. Explains *performative* condemnation or why some arguments escalate publicly. But fails "residue" (deep internal disgust isn't just signalling) and "novel judgments" (signalling needs an audience, conviction often persists privately). Makes characters feel cynical, not deeply convicted. Sister A genuinely *believes* loyalty is sacred, not just performing it.

  ### The Knobs: Parameters for Building Your Characters
  Forget theories; tweak these psychological levers to make verdicts predictable but human:
  1.  **Salience Filters:** What screams "WRONG!" loudest to them? *Harm? Betrayal? Disgust? Injustice? Disorder?* (Sister B: Harm/Injustice scream; Sister A: Betrayal/Disgust scream).
  2.  **Enforcement Radius:** Who falls inside their "moral circle"? *Family only? Town? Nation? All humans?* Where does enforcement feel justified? (Sister A: Tight circle - town/family; Sister B: Wider circle - includes the victim regardless of origin).
  3.  **Dominant Foundation/Principle Weighting:** What core value usually trumps others? *Loyalty > Fairness? Care > Purity? Liberty > Authority?* (Sister A: Loyalty/Purity; Sister B: Care/Fairness/Liberty).
  4.  **Emotional Residue Strength:** How strong is the gut feeling *independent* of belief? Does disgust linger even if logic changes? (Sister A: High residue for disloyalty/disgust; Sister B: High residue for harm, maybe less for impurity).
  5.  **Reasoning Style Post-Hoc:** How fluent are they at generating justifications *after* their gut reacts? (Sister A might rely on tradition/feeling; Sister B constructs fairness arguments).
  6.  **Context Sensitivity:** How much does the *specific relationship* or *setting* alter their judgment? (Sister A: Highly sensitive - betrayal *within* the town is catastrophic; Sister B: Less sensitive - harm is harm anywhere).
  7.  **Purity/Disgust Sensitivity:** How easily triggered? Does metaphorical "dirt" feel like real contamination? (High in Sister A re: the town's reputation; lower in Sister B).

  ### Answering Your Core Concern
  The psychology *doesn't* tell you who is objectively right about the man's act. That's a separate philosophical/legal question. What it *does* brilliantly is show *why* both sisters feel with every fibre that *they* are right. Sister A's loyalty/purity foundations, shaped by the town, make secrecy feel like preserving sacred order; exposing feels like a polluting, disloyal act of self-harm to the community. Sister B's care/fairness foundations, perhaps tuned by broader experiences, make secrecy feel like complicity in harm and a profound injustice to the victim. The feeling that "this is just true" comes from the deep, intuitive, culturally-shaped activation of their dominant moral foundations, presenting as perception of objective wrongness. The *tension* between this feeling of objectivity and its psychological origins *is* the human truth your novel explores. Use the knobs to build their distinct moral psychologies, and their arguments will write themselves – grounded in character, not ideology.
