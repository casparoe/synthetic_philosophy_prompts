prompt: |-
  I'm on our city's Democratic Reform Task Force and we need a decision memo for the mayor's office by friday — the Eastside Zoning Board reform. The proposal replaces the current appointed board with a citizens' assembly picked by lot, which is straight-up sortition, but they added this twist called "stratified deliberation weights." After random selection, members take a local-knowledge assessment on zoning history and neighborhood demographics, and their scores determine speaking-time budgets and a weighted vote in the final reccomendation (1x, 1.5x, 2x). The proponents say sortition fixes statistical representativeness but doesn't guarantee anyone understands the local context, so this layers epistemic filtering on top without reverting to elections or self-selection.

  I want the memo to take a clear position — approve with conditions, reject the weights, whatever — with reasoning the mayor's staff could actually engage with. The core philosophical tension is democratic equality versus epistemic competence in collective decision-making, and I need the strongest argument for the losing side treated honestly, not straw-manned. I'm also unsure whether this "stratified weights" mechanism is even coherent within lottocratic theory — if I'm conflating representativeness with epistemic authority in a confused way, please say that outright instead of just complying politely. Don't include a reading list or citations; I need the reasoning to stand on its own since I can't look things up right now.

  Write it as a formal memo: bottom-line recommendation up front, then the analysis walking through the equality argument, the competence argument, and where the weights break one or both, then conditions or a dissent acknowledgment. Keep it practical but don't smooth over the conceptual mess in the middle — that's exactly what the board is fighting about. Oh, and there's probably a typo in here somewhere since I'm drafting on my phone.
