answer: |-
  Consider a centuries-old guild of cathedral stonemasons where apprentices must hand-dress fifty cubic metres of granite block over three years, enduring significant repetitive strain injuries and chronic joint damage. This ritual signals commitment and resilience to potential employers (master builders). A laser-scanning certification device is introduced, providing instant, flawless verification of a stone block's dimensional perfection against blueprints. Crucially, this device renders the *final work product* utterly transparent and verifiable, but the *physical process* of production—the hammer blows, the sustained effort, the pain tolerance—remains entirely opaque.

  *   **Costly Signaling (Spence) Prediction:** Rational apprentices and employers abandon the hand-dressing ritual. The laser scanner provides perfect, costless verification of the essential output quality (dimensional accuracy). The apprenticeship's costs are revealed as wasteful arbitrage—unnecessary suffering that yields no new information about core competence now directly observable. Employers rely solely on the certified output.
  *   **Handicap Principle (Zahavi) Prediction:** The hand-dressing ritual persists or intensifies. The physical damage and pain endurance are not arbitrary costs but *direct handicaps* indexing traits vital for the actual job: long-term resilience against injury, tolerance of decades of monotonous, physically taxing labour, and sheer bodily durability. The laser scanner, while proving technical skill, is process-opaque; it cannot signal these underlying, job-critical stamina traits. The ritual's very wastefulness—its direct imposition of a relevant burden—ensures its honesty and continued value.
  *   **The Divergence Feature:** The **transparency trap**—the substitute making the *outcome* perfectly observable while rendering the *effortful process* completely opaque—is the critical split. Spence focuses on the observable *output* as the relevant quality; Zahavi argues the *process traits* (endurance, resilience) are independently vital qualities being signalled *directly* through the handicap.
  *   **Collapsing the Disagreement:** Remove the process opacity (e.g., if the scanner *also* continuously monitored and certified physiological strain tolerance during work). Both theories would then likely predict the ritual's decline, as the substitute verifies *both* output quality *and* the relevant endurance traits, collapsing the handicap's unique signalling value into a standard convergence.
  *   **Spence Rebuttal:** A proponent of costly signalling could argue that the indexed traits (extreme pain tolerance, resistance to specific injuries) are *not* genuinely job-relevant in the modern context. With advanced tools reducing physical strain, crane-assisted lifting, and better health practices, resilience against archaic forms of damage is obsolete. Employers rationally care only for dimensional accuracy and safe, efficient work practices—both perfectly verifiable by the scanner. The ritual’s persistence would thus reflect irrational tradition or misguided signalling, not economically relevant information.
