  ## Reconstructing Smith's Anti-Imperialism through Sympathetic Jurisdiction

  Adam Smith's critiques of British imperial administration, particularly concerning the American colonies and the East India Company (EIC), are often subsumed under his free-trade and anti-monopoly arguments. However, reconstructing his opposition around the concept of "sympathetic jurisdiction" – the claim that legitimate rule requires sufficient proximity for the impartial spectator to function effectively, thereby sustaining moral judgment and mutual understanding – provides a more profound and integrated understanding rooted in his moral psychology (*The Theory of Moral Sentiments*, TMS). This framework explains specific administrative failures he identifies better than purely economic reasoning alone.

  **Core of Sympathetic Jurisdiction:**

  1.  **The Impartial Spectator & Sympathy:** Smith's moral philosophy centers on "sympathy" (fellow-feeling) as the mechanism for moral judgment. We judge others' conduct by imagining how an impartial spectator would view it. Crucially, **proximity** is essential for accurate sympathy: "We can form no judgment... concerning [men at a distance], unless we are informed about their situation" (TMS, III.3.6).
  2.  **Legitimacy & Governance:** For governance to be legitimate and competent, governors must be able to sympathetically understand the governed, and vice-versa. The impartial spectator must be able to operate effectively *between* them. This requires shared context, accessible information, and mutual observation – elements eroded by vast geographic and social distance.
  3.  **Empire's Fatal Flaw:** Imperial rule, by its nature, creates insurmountable distance. Governors in the metropole (London) are socially and geographically removed from the governed in the colonies. This distance:
      *   **Attenuates Sympathy:** Governors cannot accurately imagine the lived realities, needs, and sentiments of the colonists/subjects. Their judgments are based on abstract reports, prejudices, or self-interest, not genuine fellow-feeling.
      *   **Corrupts Moral Judgment:** The impartial spectator mechanism malfunctions on both sides. Governors become indifferent or exploitative; the governed see rulers as alien oppressors. Accountability dissipates.

  **Explaining Specific Failures:**

  1.  **EIC Misrule & Corruption in India (WN, V.i.e.26-30, IV.vii.c):**
      *   **Failure:** Smith details horrific misgovernment: arbitrary justice, oppressive taxation, diversion of resources leading to famine, and rampant private profiteering by Company servants.
      *   **Sympathetic Jurisdiction Explanation:** Geographic and *immense* social distance (British vs. Indian society) shattered any possibility of the impartial spectator functioning. Company officials in India, focused on quick fortunes, felt no sympathetic connection to Indian peasants. Their actions were invisible and incomprehensible to London directors/shareholders focused on dividends, who lacked the proximity to accurately judge the consequences of their policies or the conduct of their agents. "No other sovereigns ever were, or... ever could be, so perfectly indifferent about the happiness or misery of their subjects" (WN, IV.vii.c.101). The distance corrupted judgment on *both* sides, enabling systematic exploitation invisible to the metropolitan impartial spectator.

  2.  **British Policy Failures in America (WN, IV.vii.b & c):**
      *   **Failure:** Smith criticizes the Navigation Acts as inefficient and burdensome, but more fundamentally, he condemns the attempted imposition of taxes (like the Stamp Act) without colonial consent and the inflexible, often ignorant, administration from London.
      *   **Sympathetic Jurisdiction Explanation:** The Atlantic distance prevented British ministers and Parliament from sympathetically understanding colonial circumstances, grievances, and the *intensity* of their attachment to local self-government. London saw colonists as subjects to be managed for imperial benefit; colonists saw London as distant and uncomprehending. The impartial spectator could not bridge the gap. Smith emphasizes the colonists' *sentiments* and *sense of justice* being violated, not just their economic interests: "To prohibit a great people... from making all that they can of every part of their own produce... is a manifest violation of the most sacred rights of mankind" (WN, IV.vii.b.44). Proximity was needed for rulers to *feel* the injustice of their policies as the colonists did. Distance bred mutual misunderstanding and resentment, corrupting judgment in London and fueling rebellion in America.

  3.  **The Folly of Monopoly Charters (EIC & Colonial Trade):**
      *   **Failure:** Smith attacks monopolies like the EIC or the colonial trade system for inefficiency and stifling competition.
      *   **Sympathetic Jurisdiction Explanation:** Beyond economics, monopolies granted by a distant sovereign *institutionalize* the attenuation of sympathy. They empower small groups (directors, privileged merchants) far removed from the consequences of their actions on producers or consumers in the colonies. The monopoly structure actively *prevents* the impartial spectator from accessing the true impact of decisions. The distance shields the monopolist from the suffering caused by high prices or restricted supply, corrupting their moral judgment and fostering exploitation. Monopoly is an *administrative manifestation* of the distance problem.

  **Advantages over the Standard Economic Reading:**

  *   **Explains the Moral Outrage:** While economics explains inefficiency, sympathetic jurisdiction explains Smith's palpable *moral* condemnation of imperial suffering and injustice ("sacred rights of mankind," indifference to misery).
  *   **Integrates TMS and WN:** It bridges his moral philosophy and political economy, showing their coherence. His critique isn't just about wealth creation but about the *moral conditions necessary* for decent governance and human flourishing.
  *   **Accounts for Sentiment & Resistance:** It explains why colonial *sentiments* (pride, resentment, sense of injustice) are central to Smith's analysis of the American crisis, beyond mere tax burdens.
  *   **Highlights Structural Ignorance:** It frames the problem as one of inherent epistemic failure due to distance, not just bad policy or greed. Even well-intentioned rulers fail because they cannot *sympathetically know* their distant subjects.

  **Weaknesses of the Interpretation & Potential Counter-Evidence:**

  1.  **Lack of Explicit Term:** Smith never uses the phrase "sympathetic jurisdiction." The interpretation requires synthesizing concepts from TMS and applying them to imperial critiques primarily argued in economic terms within WN.
      *   **Counter-Evidence:** Finding passages in WN where Smith *explicitly dismisses* moral-psychological explanations for imperial problems, attributing them *solely* to economic inefficiency or state revenue concerns would weaken this reading. Passages focusing purely on "drain of silver" or "burden on the mother country" without any invocation of injustice or misgovernance rooted in distance would support the standard view.

  2.  **Primacy of Economics in Solutions:** Smith's primary *prescriptions* for imperial problems (free trade, potential representation, abandonment of monopoly) are framed in economic or pragmatic political terms in WN. He doesn't explicitly say, "We must bring rulers closer for sympathy."
      *   **Counter-Evidence:** If Smith proposed solutions demonstrably *ignoring* proximity (e.g., advocating for more efficient *distant* bureaucracies) or solely focused on maximizing metropolitan revenue regardless of colonial welfare, it would undermine the centrality of sympathy. Evidence showing he saw colonial representation *only* as a fiscal bargain, not as a mechanism for restoring moral understanding, would favor the economic reading.

  3.  **Potential Utilitarian Undertone:** One could argue Smith's outrage stems from the *utility* lost through suffering and inefficiency, not the *moral corruption* of the spectator process itself. His focus on outcomes might overshadow the process.
      *   **Counter-Evidence:** Textual evidence where Smith explicitly prioritizes aggregate wealth increase over the just treatment of distant subjects, or suggests suffering is acceptable if it benefits the metropolis economically, would significantly weaken the sympathetic jurisdiction argument.

  4.  **Historical Context:** Smith was primarily arguing against mercantilism. His economic arguments were the most politically salient weapons against the existing imperial system.
      *   **Counter-Evidence:** Demonstrating that Smith's contemporaries (or Smith himself in letters/lectures) understood his anti-colonial stance *only* as an economic argument against monopoly and for free trade, with no perceived moral-psychological dimension, would challenge this interpretation.

  **Conclusion:**

  While free trade and anti-monopoly arguments are crucial components of Smith's critique, reconstructing his opposition to empire around "sympathetic jurisdiction" provides a deeper, more coherent framework rooted in his foundational moral psychology. It explains *why* distant imperial rule inevitably degenerates into misgovernment, corruption, and injustice – not just inefficiency – by showing how geographic and social distance fatally disrupt the operation of the impartial spectator, corrupting moral judgment on both sides. This lens makes sense of his specific condemnations of EIC brutality and British insensitivity towards America, framing them as inherent failures of moral connection, not mere policy errors. The interpretation's main weakness lies in Smith's lack of explicit connection of TMS's sympathy theory to colonial administration *by name* in WN, and the foregrounding of economic solutions. If textual or historical evidence emerged showing Smith prioritized economic outcomes over the moral-psychological conditions of governance *in this specific context*, or explicitly rejected proximity as a factor, the standard economic reading would regain primacy. However, the pervasive emphasis on sentiment, justice, and the failures of understanding throughout his imperial critiques strongly suggests sympathetic jurisdiction is the unstated moral bedrock of his anti-imperialism.
