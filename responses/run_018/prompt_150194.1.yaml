answer: |-
  ## Sestina for the Ass Between Equals

  How still the air around the poised head hangs,
  As scent of clover, timothy, and rye
  From two green mounds of equal fragrance streams.
  No flaw exists to fracture the pure weight
  Of mirrored bales. No reason to advance
  Or shift the stance that balances on doubt.

  No hunger deeper than this perfect doubt
  Can gnaw the gut. It hangs
  Suspended, dry. To choose requires advance,
  A leaning into left or right. But why
  This bale, not that? Identical in weight
  And promise, both allure, both softly gleam.

  No glint of difference dares to gleam
  Upon the hay. Only the deepening doubt
  Accumulates its heavy, silent weight.
  The poised head trembles slightly as it hangs
  Between absolutes. What unseen lever, why
  Should break the symmetry, force an advance?

  Yet stillness is not peace. The long advance
  Of sun casts shadows, makes the dried grass gleam
  Less brightly. Still, the question: Why
  This one? The logic holds, a cage of doubt.
  No gust disturbs the air where reason hangs
  Impalpable, yet dense with stifling weight.

  To add a rule – choose left! – adds extra weight,
  Another choice: Why leftward should advance
  Be privileged? The arbitrary hangs
  A new dilemma. Does the system gleam
  More brightly then? Or merely shift the doubt
  To why that rule? The cycle grinds. Ask why

  Such preference holds? The answering why
  Echoes unanswered, adding to the weight
  Of unselected paths. This core of doubt
  Refuses closure. Every forced advance
  Requires a leap where reason cannot gleam
  A path. The perfect balance hangs... and hangs...

  **(Envoi)**

  Here hangs the will, suspended in its why,
  Between the bales of equal weight that gleam
  With hunger sharp as doubt – yet no advance.
