prompt: |-
  Draft the joint statement of an adversarial collaboration between a phenomenal disjunctivist about perceptual experience and a common-factor representationalist about illusion, focused specifically on the argument from illusion as reconstructed through the “epistemic-parity challenge”: the claim that if a subject undergoing a causally matched hallucination can make the same first-person judgments about her mental state as a veridical perceiver, then the two states must share an explanatory core that direct realism cannot accommodate.

  Structure the document in three parts. First, a numbered section of agreed claims—covering the formal structure of the argument from illusion (the inference from phenomenological similarity to ontological sameness), the existence and causal matching of hallucinations, the ordinary epistemic authority of veridical perception, and the burden on disjunctivism of explaining why introspection does not reveal the relational nature of veridical experience if such relations are constitutive. Second, a disagreements table with one column for the disjunctivist and one for the representationalist; each column should state, in wording its own side would accept without reservation, the precise position on: (a) whether phenomenological similarity entails a shared mental kind; (b) whether relational properties (e.g., direct acquaintance with an external object) can figure in phenomenal character without being introspectively transparent; (c) whether the argument from illusion equivocates between epistemic and metaphysical indistinguishability; and (d) whether a negative account of hallucination—as a failure of perceptual relation rather than a positive representational state—is conceptually coherent. Third, for each of these disagreements, identify the crux—the sub-question such that resolving it would move at least one party—together with a concrete case or conceptual test both sides agree bears on it, and record in advance each side’s prediction. Likely cruxes include whether simplicity or “naturalness” favors relational over representational ontologies of mind, whether first-person authority requires access to the metaphysical kind of one’s state, and whether causal matching is better explained by shared internal representational structure or by shared causal mechanisms operating on different ontological substrates; as a shared test-case, both should consider a subject with complete neurophysiological self-knowledge but no external-world access who cannot distinguish veridical perception from perfect hallucination, with the disjunctivist predicting that this limitation reveals only epistemic opacity about metaphysical kind and the representationalist predicting that it demonstrates the explanatory priority of internal representational structure. Conclude by assessing whether any part of the dispute is merely verbal—for instance, whether disagreement over whether hallucination possesses “content” depends on stipulative definitions rather than substantive ontology—and specify exactly which part, with reasons. The statement should avoid bibliographies, reading lists, citation requests, and dependence on obscure texts; formulate every position with philosophical precision, avoid straw-man characterizations, and ensure that each column represents wording its proponents could sign.
reasoning: |-
  We are drafting a joint statement between two opposing philosophical positions: a phenomenal disjunctivist (PD) and a common-factor representationalist (CFR) regarding perceptual experience. The focus is on the argument from illusion, particularly the "epistemic-parity challenge". The structure is:

  1. Section of agreed claims (numbered)
  2. Disagreements table with two columns (PD and CFR) for four points (a-d)
  3. For each disagreement, identify the crux, a shared test case, and each side's prediction. Then, conclude with an assessment of whether any part is merely verbal.

  Let's proceed step by step.

  ---

  **Joint Statement: Phenomenal Disjunctivism and Common-Factor Representationalism on the Argument from Illusion**

  **1. Agreed Claims**

  We, the phenomenal disjunctivist (PD) and the common-factor representationalist (CFR), agree on the following:

  1.1. **The Formal Structure of the Argument from Illusion**: The argument from illusion, as reconstructed through the epistemic-parity challenge, infers from the phenomenological similarity between veridical perception and causally matched hallucination to the conclusion that these states share an explanatory core (a common mental kind). This inference is taken to undermine direct realism because it posits that the same kind of mental state can occur without the external object being present.

  1.2. **Existence and Causal Matching of Hallucinations**: There can be hallucinations that are causally matched to veridical perceptions such that, from the subject's first-person perspective, they are phenomenologically indistinguishable. That is, the subject cannot tell, by introspection alone, that she is hallucinating rather than perceiving.

  1.3. **Ordinary Epistemic Authority of Veridical Perception**: In ordinary circumstances, veridical perception provides a subject with immediate, non-inferential knowledge about the external world. This epistemic authority is part of our pre-theoretical understanding of perception.

  1.4. **Burden on Disjunctivism**: If veridical perception is constitutively relational (involving direct acquaintance with an external object) and hallucination is not, then disjunctivism owes an explanation for why introspection does not reveal the relational nature of veridical experience. That is, if the relational property is part of the phenomenal character of veridical experience, why isn't it introspectively obvious?

  **2. Disagreements Table**

  We now present our key disagreements. Each position is stated in wording that the respective side would accept without reservation.

  | Issue | Phenomenal Disjunctivist (PD) | Common-Factor Representationalist (CFR) |
  |-------|-------------------------------|-----------------------------------------|
  | **(a) Whether phenomenological similarity entails a shared mental kind** | Phenomenological similarity does not entail that veridical perception and hallucination share a common mental kind; they are fundamentally different types of mental states, and the similarity is merely epistemic (a matter of how they appear from the first-person perspective). | Phenomenological similarity between veridical perception and hallucination entails that they share a common mental kind (a representational state with the same content) that explains the similarity and serves as the explanatory core for both. |
  | **(b) Whether relational properties can figure in phenomenal character without being introspectively transparent** | The relational property of direct acquaintance with an external object is constitutive of the phenomenal character of veridical perception but is not introspectively transparent; introspection reveals only the manifest appearance of the external object, not the relation itself. | Relational properties, if they exist, must be introspectively accessible if they are part of the phenomenal character; but since they are not accessible in the hallucinatory case, they cannot be part of the core phenomenal character, which must be shared. |
  | **(c) Whether the argument from illusion equivocates between epistemic and metaphysical indistinguishability** | The argument from illusion equivocates by conflating epistemic indistinguishability (which we grant) with metaphysical sameness (which we deny). The fact that two states are subjectively indistinguishable does not imply they are of the same metaphysical kind. | The argument from illusion does not equivocate: epistemic indistinguishability in the first-person perspective implies a shared metaphysical basis (the common representational state) that explains the indistinguishability. Without such a common factor, the indistinguishability would be inexplicable. |
  | **(d) Whether a negative account of hallucination is conceptually coherent** | Hallucination is a negative state: it is the absence of a successful perceptual relation to the world, and it does not possess any positive representational content of its own. This account is coherent and avoids postulating a common factor. | Hallucination must be understood as a positive representational state that shares the same content as veridical perception; a purely negative account is incoherent because hallucination has a specific phenomenological character that requires a positive explanation. |

  **3. Cruxes, Test Cases, and Predictions**

  For each disagreement, we identify the crux (a sub-question that, if resolved, would move at least one party), a concrete case or conceptual test both sides agree bears on it, and each side's prediction.

  **(a) Crux: Does phenomenological similarity imply a shared mental kind?**
  - **Shared Test Case**: Consider a subject with complete neurophysiological self-knowledge (she knows all the neural states associated with her experiences) but no external-world access (she cannot check whether her experience is veridical or hallucinatory). She cannot distinguish veridical perception from perfect hallucination by any internal means.
    - **PD Prediction**: The subject's inability to distinguish the two states reflects only an epistemic limitation; she lacks access to the external relatum that makes veridical perception relational. The neural states might be similar, but they realize two different metaphysical kinds (one relational, one not). Thus, the similarity does not imply a shared mental kind.
    - **CFR Prediction**: The subject's complete neurophysiological knowledge would reveal that the same internal representational structure is present in both cases, explaining the phenomenological similarity. This shared structure is the common mental kind, and the subject's inability to distinguish the states based on internal factors confirms that the mental kind is the same.

  **(b) Crux: Can relational properties be part of phenomenal character without being introspectively transparent?**
  - **Shared Test Case**: Consider a veridical perceiver who is asked to introspect and report on the nature of her experience. She can report on the object's appearance (e.g., "I see a red apple") but cannot report the relational fact ("I am directly acquainted with this apple") as part of her phenomenal character without additional philosophical training or inference.
    - **PD Prediction**: The relational property is phenomenally present but not introspectively transparent as a relation; introspection reveals the object as present, not the relation itself. This is coherent because the relation is not an additional object of awareness but the structure of the awareness itself.
    - **CFR Prediction**: If the relational property were part of the phenomenal character, it should be introspectively accessible. Since it is not (the subject reports only the content, not the relation), then it is not part of the phenomenal character. The phenomenal character is exhausted by the representational content.

  **(c) Crux: Does the argument from illusion equivocate between epistemic and metaphysical indistinguishability?**
  - **Shared Test Case**: Suppose we have two subjects: one veridically perceiving a green square, the other having a causally matched hallucination of a green square. Both report the same experience ("I see a green square"), and neither can tell the difference by introspection.
    - **PD Prediction**: The epistemic indistinguishability (they cannot tell them apart) does not imply metaphysical sameness; the veridical case is a relational state, the hallucination is a non-relational state. The indistinguishability is due to the fact that the hallucination is a perfect mimic, not a duplicate.
    - **CFR Prediction**: The epistemic indistinguishability must be explained by a shared metaphysical component (the representational content of a green square). Without this, we cannot account for why the states are indistinguishable.

  **(d) Crux: Is a negative account of hallucination conceptually coherent?**
  - **Shared Test Case**: Consider a hallucination of a pink elephant. The subject has a vivid experience as of a pink elephant, but there is no pink elephant present. The hallucination is caused by neural activity that, in a veridical case, would be caused by an actual pink elephant.
    - **PD Prediction**: The hallucination is a failure of the perceptual system to connect with the world; it is not a representation of a pink elephant but a state that is introspectively indistinguishable from a successful perception of a pink elephant. This is coherent: the state is not a positive representation but a mere appearance that mimics perception.
    - **CFR Prediction**: The vivid phenomenology of the pink elephant requires a positive representational state. A negative account (mere absence) cannot explain why the subject has an experience with this specific content rather than no experience at all or a different experience.

  **Conclusion: Assessment of Verbal Disagreement**

  After discussion, we agree that part of the disagreement over whether hallucination possesses "content" (issue d) might be merely verbal. 

  - The PD uses "content" to mean a representational state that is independent of the external world and can be shared between veridical and hallucinatory cases. PD denies that hallucination has such content. 
  - The CFR uses "content" to mean the intentional object of the experience (what it is about) and the properties it represents. CFR holds that both veridical and hallucinatory states share this content.

  However, we also agree that this verbal aspect does not exhaust the disagreement. The substantive ontological question remains: whether the hallucinatory state is a positive representation (CFR) or a mere failure of relation (PD). This is not merely verbal because it concerns what fundamentally explains the phenomenology: internal representations versus the absence of a relational connection.

  The other disagreements (a, b, c) are not merely verbal. They involve substantive differences about the nature of phenomenal character, introspection, and the relationship between epistemology and metaphysics.

  Thus, we conclude that while the term "content" might be defined differently, the core ontological and explanatory differences are substantive and require further philosophical investigation.

