answer: |-
  ### Joint Statement: Phenomenal Disjunctivism and Common-Factor Representationalism on the Argument from Illusion  

  #### 1. Agreed Claims  
  We, the phenomenal disjunctivist (PD) and the common-factor representationalist (CFR), affirm the following:  
  1.1. **Formal Structure of the Argument from Illusion**: The argument from illusion, framed via the "epistemic-parity challenge," infers from the *phenomenological similarity* between veridical perception and causally matched hallucination to the *ontological sameness* of their explanatory core. This inference implies that direct realism cannot accommodate such cases, as the subject’s judgments about their mental state must be explained by a shared mental feature absent in relational accounts.  
  1.2. **Existence and Causal Matching of Hallucinations**: Hallucinations exist and can be "causally matched" to veridical perceptions—i.e., triggered by identical proximal causes (e.g., neural activity) such that a subject cannot introspectively distinguish them from veridical experiences.  
  1.3. **Ordinary Epistemic Authority of Veridical Perception**: Veridical perception ordinarily provides immediate, non-inferential justification for beliefs about the external world, reflecting a pre-theoretic epistemic privilege.  
  1.4. **Burden on Disjunctivism**: If veridical perception is constitutively relational (e.g., involving direct acquaintance with an external object), disjunctivism must explain why introspection does not reveal this relational property, given that it purportedly constitutes phenomenal character.  

  #### 2. Disagreements Table  
  Each position is stated in terms its proponents endorse without qualification.  

  | Issue | Phenomenal Disjunctivist (PD) | Common-Factor Representationalist (CFR) |  
  |-------|-------------------------------|-----------------------------------------|  
  | **(a) Phenomenological similarity entails a shared mental kind** | Phenomenological similarity does not entail a shared mental kind; it reflects merely epistemic parity (subjective indiscriminability), while veridical and hallucinatory states belong to distinct ontological kinds (relational vs. non-relational). | Phenomenological similarity entails a shared mental kind: a representational state with identical content, which constitutes the explanatory core of both veridical and hallucinatory experiences. |  
  | **(b) Relational properties can figure in phenomenal character without introspective transparency** | Relational properties (e.g., direct acquaintance) constitute phenomenal character but need not be introspectively transparent; introspection accesses the *presented world*, not the metaphysical structure of the experience. | Relational properties cannot figure in phenomenal character without introspective transparency; if a property is phenomenal, it must be accessible to introspection, and hallucination shows no such relational properties are present. |  
  | **(c) The argument equivocates between epistemic and metaphysical indistinguishability** | The argument equivocates: epistemic indistinguishability (subjective indiscriminability) does not imply metaphysical sameness; it arises from causal matching, not a shared essence. | The argument does not equivocate: epistemic indistinguishability implies metaphysical sameness because it demands a shared internal state (representational content) to explain the subject’s identical judgments. |  
  | **(d) A negative account of hallucination is coherent** | Hallucination is a negative state: a failure of perceptual relation lacking intrinsic representational content; its phenomenology derives from the subject’s inability to discriminate it from successful perception. | Hallucination cannot be a negative state; it requires a positive representational content to explain its specific, object-directed phenomenology, which mirrors veridical perception. |  

  #### 3. Cruxes, Test Cases, and Predictions  
  For each disagreement, we identify the crux, a shared test case, and predictions.  

  **(a) Crux: Does simplicity/naturalness favor relational or representational ontologies?**  
  - **Shared Test Case**: A subject with complete neurophysiological self-knowledge (aware of all neural states) but no external-world access. She cannot introspectively distinguish veridical perception from causally matched hallucination.  
    - **PD Prediction**: The subject’s limitation is purely epistemic; her neural knowledge does not reveal metaphysical kind (relational vs. non-relational), as relational properties are externally constituted.  
    - **CFR Prediction**: The subject’s neural knowledge reveals the shared internal representational structure, confirming it as the explanatory core and mental kind.  

  **(b) Crux: Does first-person authority require access to the metaphysical kind of one’s state?**  
  - **Shared Test Case**: A veridical perceiver introspects and judges “I see a red apple.” She is then asked if her experience is constitutively relational.  
    - **PD Prediction**: Introspection reveals only the apple’s apparent presence, not the relation; the judgment is about the world, not metaphysical structure.  
    - **CFR Prediction**: If relational properties were phenomenal, introspection should detect them; its absence confirms phenomenal character is exhausted by representational content.  

  **(c) Crux: Is causal matching better explained by shared internal structure or external mechanisms?**  
  - **Shared Test Case**: Two subjects—one veridically perceiving a green square, one hallucinating it—report identical experiences under causal matching.  
    - **PD Prediction**: Causal matching explains indistinguishability via identical neural inputs to distinct perceptual kinds (relational vs. non-relational), not shared essence.  
    - **CFR Prediction**: Only shared internal representational content explains why identical causes produce identical judgments across subjects.  

  **(d) Crux: Can phenomenology arise solely from the absence of relational success?**  
  - **Shared Test Case**: A vivid hallucination of a dragon (causally matched to a veridical perception) includes details like scales and movement.  
    - **PD Prediction**: The phenomenology is not “positive” but reflects the subject’s *seeming* awareness of a dragon, explained by the failure of relation.  
    - **CFR Prediction**: A “negative” state cannot explain the specificity (e.g., dragon, not cat); positive representational content is necessary.  

  #### Conclusion: Verbal Disagreement Assessment  
  We agree that **disagreement (d)—whether hallucination has “content”—is partially verbal**.  
  - **Verbal Aspect**: PD defines “content” as *intrinsic representational properties*, while CFR defines it as *intentional-directedness* (what the experience seems to present). For PD, hallucination lacks the former; for CFR, it possesses the latter. Stipulative definitions here risk masking shared ground: both agree hallucination involves *seeming presence*.  
  - **Substantive Aspect**: The core disagreement—whether hallucination’s phenomenology requires a positive representational ontology or is explained relationally—remains non-verbal. It concerns the *nature of perceptual failure*: CFR insists on a shared posit (representation), while PD denies it requires ontological parity.  

  The other disagreements (a–c) are **substantive**, turning on divergent commitments about metaphysics (e.g., naturalness of relations), epistemology (e.g., scope of first-person authority), and causation (e.g., explanatory primacy of internal states). No stipulation resolves these.
