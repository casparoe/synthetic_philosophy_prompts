  Here is a sonnet structured to enact the xing/se distinction through its rhyme scheme and argument, as requested:

  **The Taxon and the Hue**

  The horse stands fixed within the knowing mind,
  A concept carved in bone and sinew, *horse*,
  Its essence catalogued, its form defined
  By hoof and height, its function, and its course.
  No fleeting shade disrupts this solid creed;
  The skeleton defines the living force,
  The type persists beyond each transient breed
  That bears the ancient, fundamental *horse*.

  But look! A gleam disrupts the shaded wood—
  Not shadowed bay nor chestnut’s ruddy light,
  But coat like frost, a misunderstood
  And spectral *white*. Does this aberrant sight,
  This chromatic breach, this unexpected *white*,
  Exclude the beast from bearing forth the *horse*?

  ---

  **Structural Enactment:**

  1.  **Fixed Xing (Form - Horse):** The word "*horse*" appears as the anchor rhyme word at the end of lines 2, 4, 8, and 14. This consistent, unvarying position mirrors the stable, essential category of "horse" based on form (xing).
  2.  **Shifting Se (Color - White):** The word "*white*" appears at the end of lines 11 and 13. These positions are:
      *   **Irregular:** They don't follow the primary octave rhyme scheme (ABAB BCBC) nor form a perfect couplet in the sestet (DEFEDE - here, lines 11 "white" and 13 "white" rhyme with each other, but *not* with the preceding "sight" (line 12) or the following "horse" (line 14). Line 12 "sight" is isolated.
      *   **Disruptive:** The first "*white*" (line 11) breaks the flow established by the octave's focus on form. The rhyme of "*white*" with itself (line 13) feels incomplete, lacking connection to the established scheme, mirroring the color property's perceived separateness and potential to disrupt the category.
  3.  **Argument Flow:**
      *   **Octave (Lines 1-8):** Establishes the taxonomist's view. "Horse" is defined by essential, stable morphological traits ("bone and sinew," "hoof and height," "skeleton") that transcend superficial variations like color ("fleeting shade," "transient breed"). The fixed rhyme of "*horse*" reinforces this stability.
      *   **Volta (Lines 9-10):** Introduces the disruptive element: "a gleam," "coat like frost," identified as "*white*" (line 11). The shift in focus and the irregular position of "*white*" mark the conceptual turn.
      *   **Sestet (Lines 9-14):** Explores the tension. The leucistic mutation ("spectral *white*," "chromatic breach") poses the question: does this specific color property ("*white*") exclude the individual from the essential category anchored by "*horse*"? The sestet's unstable rhyme scheme (particularly the isolated "sight" and the disconnected couplet of "*white*" words) enacts the conceptual splitting caused by the introduction of the color property (se).
  4.  **Accessibility:** The poem uses biological terms familiar to the speaker ("taxon," "skeleton," "breed," "chromatic breach," "leucistic" implied by "spectral white") alongside the core philosophical conflict of essential form vs. altering property. No prior knowledge of Mingjia texts is needed, only the tension between a stable category and a specific, potentially exclusionary characteristic. "Shape vs. shade" and "creed vs. hue" paraphrase the xing/se distinction implicitly.
