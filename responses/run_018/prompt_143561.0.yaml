  The suppressed feature I'll highlight is debt structures. Most narratives focus on crop failures, but pre-existing debt determined who starved when prices spiked. Recognizing this forces us to see that the volcano didn't cause famine - it merely triggered a crisis whose severity depended on human financial systems. That significantly reduces the causal weight we can assign to non-human factors.

