prompt: |-
  ive been torn lately between taking a high-paying job to donate half my salary (the earn-to-give thing) versus staying in policy advocacy to try to change the rules of the game, and this measurability bias critique of EA keeps nagging at me. can you build me a one-paragraph realistic scenario — like inside a foundation or a company, nothing sci-fi — where both the institutional-critique view and the earn-to-give view apply, but measurability bias forces them to point in oposite directions? specifically, the institutional reform path should generate no countable QALYs in the short run even though it's genuinely the higher-impact move over decades, while the earning-to-give path produces clear, immediate metrics. after the scenario, lay out what each perspective actually recommends and why, then tell me which structural feature of the case makes them diverge. also check: if we remove the measurability gap (say, with a perfect long-term evaluator), do the two views collapse back together? finish with how an EA defender who accepts measurability bias as unavoidable would try to break your case. no need for citations or reading lists — just the scenario and the analysis.
reasoning: |-
  Okay, the user is really struggling with a classic EA dilemma - high-paying job for donations vs. policy advocacy - and specifically wants a concrete example where measurability bias pits these approaches against each other. They're clearly well-versed in EA concepts but haunted by that "what if we're missing systemic change?" doubt.  

  Hmm, the challenge is crafting a realistic scenario where institutional reform has zero short-term metrics but dominates long-term impact. Foundation work feels right - tangible enough but with power dynamics. Let's make it a health foundation in a developing country to leverage QALY familiarity. The key twist needs to be: reformer attacks corrupt procurement (invisible future impact) vs. donor funds bednets (immediate lives saved).  

  *Brainstorming specifics*:  
  The reform path must show no QALYs for years because fixing procurement takes ages - investigations, legal changes, system overhauls. But the payoff is massive: say, 30% more vaccines delivered for decades. Meanwhile, bednets give instant mortality drops. The structural divergence point has to be about *who controls resources* - procurement officers (reform target) vs. clinic workers (bednet partners).  

  Ah, and the "perfect evaluator" test is crucial. If we could magically quantify that 30% future efficiency gain today, both EA approaches would obviously back reform. That reveals measurability bias as the true villain.  

  *Anticipating pushback*: A hardcore EA defender would probably argue: "But you can't prove that reform will work! Bednets have evidence." Which is exactly the bias in action - demanding RCT-level certainty for systemic change. I'll have the reformer's evidence be "anecdotal patterns + historical precedents," which is realistically all you get in corruption fights.  

  *User's deeper need*: They're not just asking for an example - they want permission to choose institutional work without betraying EA principles. So the analysis must validate that both paths are EA-compatible, just differently legible. The "which view recommends what" section should feel balanced, not preachy.  

  *Final polish*: Naming the characters (Jamal/Anya) helps immersion. And ending with the defender's counterargument keeps it dialectical - honors the user's intellectual honesty.
answer: |-
  Here’s a scenario, analysis, and counterargument:

  **Scenario:**  
  At the "Global Health Solutions Foundation," Program Officer Anya advocates for systemic reform: investigating and overhauling corrupt local procurement systems for malaria drugs in a high-burden region. Success would mean 30% more effective treatments annually within 5–10 years by dismantling kickback schemes and strengthening oversight. However, this requires years of politically risky audits, legal battles, and capacity-building with zero immediately quantifiable lives saved. Meanwhile, donor Jamal—an earn-to-give software engineer—funds bed net distributions through the same foundation. His $500,000 donation buys 50,000 nets this year, demonstrably saving ~250 children (using standard QALY estimates), with clear distribution photos and mortality data.  

  **Analysis:**  
  - **Institutional Critique View:** Recommends backing Anya’s reform. While no QALYs appear now, fixing procurement could double the impact of *all future aid* (drugs, vaccines) in the region. A 30% efficiency gain over 20 years dwarfs Jamal’s one-time bed net impact.  
  - **Earn-to-Give View:** Recommends funding Jamal’s bed nets. It generates tangible, immediate QALYs (250 lives saved *now*), avoids political uncertainty, and satisfies donor accountability with hard metrics.  
  - **Divergence Point:** **Time horizon + power dynamics**. Anya’s work targets *upstream decision-makers* (corrupt officials), requiring deep, slow institutional change. Jamal’s work targets *downstream beneficiaries* via existing channels, leveraging current systems for quick wins.  
  - **Perfect Evaluator Test:** If a magic tool *proved* Anya’s reform would reliably save 10,000 QALYs long-term versus Jamal’s 1,000 short-term QALYs, both views would converge on funding reform. Measurability bias (prioritizing countable near-term gains) is the conflict engine.  

  **EA Defender Rebuttal:**  
  A defender would argue: "We *must* prioritize Jamal’s bed nets because Anya’s reform has **unknowable payoff probabilities**. Corruption fights often fail (e.g., officials retaliate, reforms reversed). Bed nets have ~90% evidence-backed success rates. EA’s focus on *robust* impact means taking the certain 250 lives over a speculative 30% efficiency gain—even if the latter *could* be higher. We’re not biased against systemic change; we’re biased against *unprovable* impact."  

  **Key Takeaway:**  
  The tension isn’t just about "direct vs. systemic" work—it’s about **accountability to evidence in the face of uncertainty**. Institutional work becomes harder to justify when measurable short-term costs (funds, time) collide with unquantifiable long-term probabilities of success.
