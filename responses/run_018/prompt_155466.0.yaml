prompt: |-
  I'm in a formal epistemology seminar, and we're examining how rational belief should revise when an agent learns that a conditional claim is unreliable or false rather than learning its antecedent directly. Before I evaluate the proposed fixes, I want the full specification of what any adequate theory of conditional belief updating must actually deliver. Give me the desiderata: the specific revision patterns it must license—including cases where the antecedent's credence should hold steady, fall, or even rise after conditioning on the conditional's failure—the distinctions it must preserve (between rejecting the conditional, accepting its negation, and discovering the antecedent is false), and the formal constraints it must observe (coherence with the probability calculus and consistency with Jeffrey conditioning). Include the standard red-or-blue-company scenario and a less-discussed variant where the agent is uncertain about the reliability of the source reporting the conditional, not merely about the conditional itself. For each desideratum, explain why it counts as a requirement rather than a preference. Then flag which are genuinely non-negotiable and which are artifacts of particular frameworks like unrestricted Bayesian updating or Stalnaker-style constraints. Separate what is settled in the specialist literature from what remains genuinely contested—especially on whether any version of the Stalnaker thesis can survive in modified form—and do not present a contested view as the consensus. Briefly note how Jeffrey conditioning and a restricted Stalnaker-style view fare against the list, but keep the weight on the criteria themselves.
reasoning: |-
  Okay, the user is in a formal epistemology seminar focusing on how rational beliefs should update when learning that a conditional is unreliable or false, rather than learning the antecedent directly. They need a comprehensive list of desiderata for any adequate theory of conditional belief updating. 

  First, I need to recall the core challenges here. The key problem is that standard Bayesian updating works for factual claims but struggles with conditionals. When an agent learns that "if A then C" is false or unreliable, it's not straightforward how to revise credences in A and C. The user specifically wants criteria that distinguish between rejecting the conditional, accepting its negation, and discovering the antecedent is false. They also mention the red-or-blue-company scenario and a variant with uncertain reliability of the source.

  Hmm, the user seems quite advanced—they're familiar with Jeffrey conditioning and Stalnaker's approach. They want to avoid presenting contested views as consensus, so I must be careful about areas like the Stalnaker thesis where there's ongoing debate. 

  Let me structure this systematically. The desiderata should cover: 
  - **Revision patterns** (how credence in antecedent changes when conditional fails) 
  - **Conceptual distinctions** (rejecting vs. negating conditionals) 
  - **Formal constraints** (probability coherence, Jeffrey conditioning compatibility)  
  - **Scenario requirements** (red-or-blue company base case + reliability variant) 

  For each, I'll explain why it's a requirement, not just preference. For example, preserving the antecedent-false vs. conditional-false distinction is non-negotiable because conflating them leads to Dutch books. But Stalnaker-style centering might be framework-dependent. 

  The red-or-blue scenario is essential: if you learn the conditional "if red card then company A" is false, credence in "red" should drop. But in the reliability variant—where the source might be lying—the drop should be milder. That tests sensitivity to evidence type. 

  On contested points: The Stalnaker thesis (P(if A then C) = P(C|A)) is divisive. Some think it can survive with modifications (e.g., for subjunctives), others say it's doomed. I'll note this without taking sides. 

  Jeffrey conditioning handles the reliability variant better since it updates on *evidence affecting credence*, not truth. Stalnaker-style approaches struggle with false conditionals but excel at preserving logical structure. 

  User definitely needs this for evaluating proposed fixes in their seminar. The depth of their query suggests they're preparing for rigorous discussion or research. I'll keep it precise and flag where literature agrees vs. debates.
answer: |-
  Here are the **core desiderata** for any adequate theory of conditional belief revision when learning a conditional is unreliable/false, categorized by type, with justifications for their non-negotiable status and notes on contestation. These are distilled from the literature (e.g., Douven, Bradley, Stern & Hartmann, Weisberg) but reflect fundamental rationality constraints rather than partisan commitments.

  ### I. **Revision Patterns for Antecedent Credence**  
  *Must explain when P(A) increases, decreases, or stays the same after learning ¬(A → C) or equivalent evidence.*

  1.  **Desideratum: Non-Monotonic Antecedent Response**  
      - **Requirement:** Learning that a conditional A → C is false/unreliable *can* rationally lead to P(A) **decreasing**, **increasing**, or **remaining stable**, depending on the agent's prior beliefs and the nature of the evidence. *No universal direction is mandated.*  
      - **Why Requirement?** Rational responses are context-sensitive. Example:  
          - *Red-or-Blue Company (Standard):*  
            Prior: P(Red) = 0.5, P(Blue) = 0.5, P(A|Red) = 1, P(A|Blue) = 0. *Learning "If Red, then A" is FALSE.*  
            Intuition: P(Red) **should decrease** (as the falsity suggests the card is more likely Blue).  
          - *Variant (Red Flags):*  
            Prior: P(Red) = 0.01 (rare), P(A|Red) = 0.99 (reliable indicator), P(A|¬Red) = 0.01. *Learning "If Red, then A" is UNRELIABLE (e.g., source is flawed).*  
            Intuition: P(Red) **might slightly increase or stay stable** (since A is unlikely without Red anyway; the unreliability weakens the strong link but doesn't make Red less probable *per se*).  
          - *Variant (Explanatory Link):*  
            Prior: P(A) high, P(C|A) very high, P(C|¬A) very low. *Learning "If A, then C" is FALSE.*  
            Intuition: P(A) **might increase** (if A was the best explanation for C; falsifying the conditional removes a key reason *against* A if C remains true).  
      - **Non-Negotiable:** Yes. Forcing P(A) always down (or up) leads to irrational updates in clear cases like the examples.

  ### II. **Conceptual Distinctions**  
  *Must differentiate between fundamentally distinct learning scenarios.*

  2.  **Desideratum: Distinguish Rejecting Conditional vs. Learning Antecedent False**  
      - **Requirement:** Learning ¬(A → C) must be *formally and functionally distinct* from learning ¬A.  
      - **Why Requirement?** Learning ¬A directly rules out A. Learning ¬(A → C) does *not* rule out A; it rules out the *connection* between A and C (e.g., in Red-or-Blue, learning "If Red then A" is false leaves Red *possible*, even probable). Conflating them licenses irrational bets (Dutch Books).
      - **Non-Negotiable:** Yes. Core to understanding conditionals.

  3.  **Desideratum: Distinguish Rejecting Conditional vs. Accepting its Negation**  
      - **Requirement:** Learning that A → C is **unreliable** (e.g., source is untrustworthy) must be distinct from learning it is **false** (i.e., A ∧ ¬C is true).  
      - **Why Requirement?** Learning falsity (A ∧ ¬C) provides *specific information* about A and C. Learning unreliability provides *meta-information* about the connection, often weaker evidence against A→C and less specific about A/C individually (as in the *Red Flags* variant). Failing this distinction leads to incorrect sensitivity to evidence strength/source.  
      - **Non-Negotiable:** Yes. Epistemically different types of evidence.

  ### III. Formal Constraints  
  *Must comply with bedrock rationality principles.*

  4.  **Desideratum: Coherence with Probability Calculus**  
      - **Requirement:** Revised credences must satisfy Kolmogorov axioms (non-negativity, normalization, additivity).  
      - **Why Requirement?** Prevents Dutch Books and ensures consistent, measurable degrees of belief.  
      - **Non-Negotiable:** Absolutely. Foundational to probabilistic epistemology.

  5.  **Desideratum: Compatibility with Jeffrey Conditioning (Generalized Updating)**  
      - **Requirement:** The update must be representable as *reallocating credence across a partition* based on the new evidence affecting the probabilities of partition elements. Learning ¬(A→C) or unreliability constitutes evidence that *directly affects the credence in the conditional proposition itself* (however that proposition is modeled), requiring a Jeffrey-like update on that proposition or a relevant partition.  
      - **Why Requirement?** This is how agents actually update on uncertain evidence affecting complex propositions. Mandating strict conditionalization on A∧¬C (or another factive proposition) ignores the nature of learning *about the connection*.  
      - **Non-Negotiability Contextual:** While *some* generalized update mechanism is essential, strict adherence to Jeffrey's specific formula is less critical than the *capability* to model evidence directly affecting P(A→C). Frameworks lacking this are inadequate.

  ### IV. Scenario-Specific Adequacy  

  6.  **Desideratum: Handle Standard Red-or-Blue Company Scenario**  
      - **Requirement:** Must license P(Red) decreasing significantly upon learning "If Red, then Company A" is false, while P(Blue) increases.  
      - **Why Requirement?** Strong, clear rational intuition. Failing this is a major strike against a theory.  
      - **Non-Negotiable:** Yes. A litmus test.

  7.  **Desideratum: Handle Uncertain Reliability Variant**  
      - **Requirement:** Must license a *milder decrease* (or stability/increase) in P(A) when learning that a *source asserting A→C is unreliable*, compared to learning A→C is definitively false. Must also potentially affect P(C).  
      - **Why Requirement?** Models real-world learning (e.g., hearing a weather forecaster is often wrong about "if clouds, then rain"). Tests sensitivity to evidence *type* (meta-evidence vs. direct falsification).  
      - **Non-Negotiable:** Yes. Essential for realism and distinguishing D2/D3.

  ### V. Treatment of the Conditional  
  *The most contested area.*

  8.  **Desideratum: Avoid Collapse of the Conditional**  
      - **Requirement:** The theory must not reduce A→C to a truth-functional connective (especially material implication A⊃C) *in its dynamics*. Learning ¬(A→C) cannot be equivalent to learning ¬(A⊃C) = A∧¬C.  
      - **Why Requirement?** Material implication reduction fails Desiderata 1 & 2 catastrophically (e.g., learning A⊃C false *is* learning A∧¬C, forcing P(A) up if P(C) was high).  
      - **Non-Negotiable:** Yes. Material implication is widely rejected as an adequate model for conditional *belief*.

  9.  **The Stalnaker Thesis (P(A→C) = P(C|A)) & Its Fate:**  
      - **Status:** **Highly Contested.** The thesis itself is *not* a desideratum. The question is whether *any* viable theory can retain something like it *after* updating on ¬(A→C) or unreliability.  
          - **Problem:** If P₀(A→C) = P₀(C|A), and you learn ¬(A→C), standard Bayesian conditioning would require P₁(A→C) = 0. But what is P₁(C|A)? If the thesis holds post-update, P₁(C|A) = 0. This often conflicts with rational updates (e.g., in *Red-or-Blue*, P₁(A|Red) shouldn't be 0; the link is broken, but Red could still exist with uncertain A).  
          - **Survival?** Some (e.g., restricted versions, Leitgeb's "P-stability") attempt to retain a *form* of the thesis locally or for specific conditionals. Others (e.g., Bradley, Douven) argue it must be abandoned entirely for belief revision dynamics. **No consensus exists.** A theory satisfying D1-D7 *may* require abandoning the universal Stalnaker Thesis.  
      - **Non-Negotiable Implication:** A theory satisfying core desiderata *cannot* maintain the Stalnaker Thesis universally *through arbitrary updates*. Its status pre-and-post update is the crux of the debate.

  ### How Frameworks Fare (Briefly)
  *   **Jeffrey Conditioning (JC):** Naturally satisfies D4, D5 (by design), D6, D7 (if P(A→C) is a Jeffrey-partition element). Struggles with D8/D9 if A→C is modeled as material implication, but can avoid this by taking P(A→C) as a primitive "conditional event" probability. Needs a model for *what* P(A→C) represents.
  *   **Stalnaker-style (with Categorical Propositions):** Can satisfy D2, D3, D6, D8 by distinguishing A→C from A⊃C. Severely challenged by D1 (dynamics often force implausible P(A) changes) and D7 (handling unreliability is unnatural). Maintaining D9 post-update is a major hurdle.

  ### Summary of Non-Negotiables
  | Desideratum | Core Rationality? | Notes |
  |-------------|-------------------|-------|
  | D1 (Non-Monotonic P(A)) | **Yes** | Contextual response essential |
  | D2 (¬(A→C) ≠ ¬A) | **Yes** | Avoids irrational belief collapse |
  | D3 (Unreliable ≠ False) | **Yes** | Evidence type sensitivity |
  | D4 (Probability Coherence) | **Absolute** | Foundational |
  | D5 (Generalized Updating) | **Functional Yes** | Must handle evidence affecting conditionals |
  | D6 (Red-or-Blue) | **Yes** | Foundational test case |
  | D7 (Uncertain Reliability) | **Yes** | Realism & evidence distinction |
  | D8 (Avoid Material Collapse) | **Yes** | Preserves conditional nature |
  | D9 (Stalnaker Thesis Survival) | **Contested** | Not required; viability post-update is key debate |

  The core non-negotiables (D1-D8) stem from avoiding Dutch Books, respecting the nature of conditional evidence, and handling paradigmatic cases correctly. The contestation revolves primarily around **how to formally model the conditional proposition** (especially for updating) and the **fate of the Stalnaker Thesis** under revision. Any adequate theory *must* provide a coherent account satisfying D1-D8, but the literature remains actively divided on whether this requires abandoning the Stalnaker Thesis entirely or finding a sufficiently nuanced version that survives.
