prompt: |-
  My advisor's calls on cooperation in evolutionary games are pretty clear: one-shot prisoners dilemma with perfect info, she says no cooperation evolves; iterated direct reciprocity with no error, yes tit-for-tat dominates; fixed spatial grid with local interaction and mutation, yes if clustering coefficient is above about 0.3; kin selection in a single round with genetic markers, yes but only within siblings; indirect reciprocity with full public history but zero cost to false reputation reporting, she says it collapses. Now there's this new setup: iterated prisoner's dilemma on a scale-free network that rewires each round, agents can only observe second-order neighboors, and there's a hidden shadow-debt for defection that accumulates silently then hits everyone at once after crossing a threshhold. Will she say cooperation survives? I'm less interested in the yes/no than in the rule she's actually running — is it about information reach, network stability, or punishment visibility — and what other rules fit her past verdicts equally well. Also, what's the one extra case that'd best tell those rules apart?
reasoning: |-
  Okay, let me start by trying to unpack this user's question. They're describing their advisor's stance on cooperation in various evolutionary game setups, and now they have a new scenario involving a scale-free network with rewiring, limited observation, and a hidden shadow-debt. The user wants to know if their advisor would say cooperation survives, but more importantly, they want to understand the underlying rule the advisor uses and how to test it.

  First, I need to recall the advisor's past verdicts. The advisor rejects cooperation in one-shot PD, supports direct reciprocity in iterated games without errors, requires high clustering in spatial grids, limits kin selection to siblings, and dismisses indirect reciprocity with unreliable reputation. Each of these outcomes seems to hinge on specific conditions ensuring that cooperators aren't exploited without recourse.

  Looking at the new setup: scale-free networks are known for hubs, which might centralize interactions. But the network rewires each round—that's a big deal. Constant rewiring likely prevents stable clusters from forming. Agents can only see second-order neighbors, so reputation tracking would be localized and fragmented. The hidden shadow-debt is intriguing. Since it's invisible and only triggers a global punishment when a threshold is crossed, agents can't attribute the punishment to specific defectors. This lack of targeting means defectors don't face immediate consequences, and cooperators suffer equally when the debt hits. 

  The key elements here are the inability to form stable relationships (due to rewiring), limited information (only second-order neighbors), and untargeted punishment. The advisor's past emphasis on mechanisms like reciprocity, spatial clustering, and reliable punishment suggests that the hidden, untargeted nature of the shadow-debt would be a deal-breaker. Without the ability to direct punishment or reputation accurately, defectors can exploit without immediate repercussions. The global punishment might even harm cooperators more if clusters are disrupted by rewiring.

  The user also wants to know what rule the advisor follows. The consistent theme is that cooperation only evolves when there's a mechanism to protect cooperators from exploitation and ensure that defectors face consequences proportional to their actions. This could be direct reciprocity, spatial structure allowing cooperator clusters, or kin selection. The shadow-debt fails because it doesn't provide targeted consequences; the punishment isn't linked to individual defectors.

  To distinguish between possible rules, the user needs a test case. If they set up a scenario with targeted punishment—even with rewiring and limited observation—cooperation might survive because defectors are directly affected. For example, if defectors accumulate visible debt that only impacts them or their immediate connections when triggered, then the advisor might approve. This would highlight that punishment visibility and targeting are crucial, rather than just network stability or information reach.

  I should also consider if there are other interpretations. Maybe network stability is key? But in the fixed grid case, stability allows clusters. Rewiring prevents that. Or information reach? Second-order observation might suffice if the network were stable, but rewiring disrupts info flow. However, the global punishment without targeting seems the strongest factor. Testing with targeted punishment would clarify whether visibility of consequences is the core principle.
answer: |-
  Based on your advisor's consistent pattern of verdicts, **she would almost certainly say cooperation DOES NOT survive** in this new "shadow-debt" scale-free network setup. Here's the breakdown of her likely reasoning and the underlying rule:

  1.  **Her Likely Verdict & Reasoning:**
      *   **Network Instability:** Constant rewiring prevents the formation of stable clusters ("spatial" structure) that she requires for cooperation in fixed grids. Defectors can easily escape localized consequences.
      *   **Limited Information Reach:** Observing only second-order neighbors severely restricts reputation tracking ("indirect reciprocity") and makes reliable partner selection/discrimination impossible across the rewiring network. Information is too local and fragmented.
      *   **Fatal Flaw: Untargeted, Hidden Punishment:** The "shadow-debt" mechanism violates her core requirement for *discriminating* consequences. Punishment is:
          *   **Hidden:** Agents cannot observe the debt or its accumulation, so they cannot condition their behavior on it or learn the link between defection and future punishment. This removes any *deterrent* effect during play.
          *   **Untargeted:** When the threshold is crossed, punishment hits *everyone* indiscriminately. This catastrophically harms cooperators just as much as (or even more than) defectors, destroying any existing cooperative clusters without selectively harming defectors. There's no mechanism for cooperators to be *protected* relative to defectors.
          *   **Non-Contingent:** The punishment isn't linked to *specific* defectors or directed *at* them. It's a blind, global catastrophe.

      **Conclusion:** This setup lacks the key ingredients she deems necessary: stable relationships/structures (eliminated by rewiring), sufficient information for discrimination/reciprocity (limited by observation range), and crucially, *targeted consequences* that protect cooperators and punish defectors. The shadow-debt is a global catastrophe mechanism, not a targeted enforcement mechanism. It creates a classic "tragedy of the commons" where individual defection's cost is hidden and externalized, leading to collapse.

  2.  **The Rule She's Running:**
      Your advisor's core rule appears to be: **"Cooperation evolves only if there exists a sufficiently reliable mechanism to *discriminate against* and *impose asymmetric costs on* defectors relative to cooperators *within the interaction structure*, preventing defectors from systematically exploiting cooperators without consequence."**

      *   **How it fits past verdicts:**
          *   **One-shot PD:** No discrimination mechanism possible. Defectors win.
          *   **Iterated TFT:** Direct discrimination via retaliation in the *next* interaction with the *same* partner.
          *   **Spatial Grid/Clustering:** Spatial structure allows cooperators to cluster, discriminating against defectors by reducing their payoff (interacting more with other defectors on cluster edges). Mutation allows cooperative clusters to outgrow/grow faster than defectors.
          *   **Kin Selection:** Genetic relatedness acts as a marker, allowing discrimination *in favor* of likely cooperators (kin) and *against* non-kin (potential defectors).
          *   **Indirect Reciprocity w/ False Reporting:** Reputation *cannot* reliably discriminate cooperators from defectors if reporting is costless and false. The mechanism breaks down.
          *   **New Setup (Shadow-Debt):** No reliable discrimination mechanism exists (rewiring, limited info). Punishment is not asymmetric (hits all equally). No asymmetric costs imposed *on* defectors relative to cooperators *by the mechanism itself*.

  3.  **Alternative Rules That Fit (But Are Less Likely):**
      *   **"Stable Interaction Structures Required":** Fits Fixed Grid (stable) vs. New Setup (unstable rewiring) and One-shot (no structure). *Fails* to fully explain Kin Selection (no inherent "structure" beyond relatedness marker) or why Indirect Reciprocity with false reporting fails (structure could exist, but mechanism is corrupted).
      *   **"Sufficient Information for Contingent Strategies Required":** Fits One-shot (no info) vs. Iterated TFT (full dyad history), Indirect Reciprocity collapse (info corrupted). *Fails* to fully explain Spatial Grid success (agents often modeled with minimal memory/strategy complexity, relying on structure) or Kin Selection (relies on a marker, not behavioral history).
      *   **"Costly Punishment/Sanctioning Must Be Visible & Targeted":** Fits Indirect Reciprocity collapse (sanctions based on corrupt info), New Setup (hidden/untargeted punishment). *Fits well* with TFT (targeted sanction), Spatial (defectors pay cost via isolation), Kin (non-cooperation with non-kin is a sanction). *Fits less well* explaining the *necessity* of clustering coefficient >0.3 (it's about the *effectiveness* of the structure-based sanctioning, not its existence).

  4.  **The Best Extra Case to Tell the Rules Apart:**
      **Targeted Shadow-Debt in a Rewiring Network with Full Observation.**

      *   **Setup:** Iterated PD on a rewiring scale-free network. Agents have **full global observation** of all interactions/strategies (overcoming info limitation). The "shadow-debt" is modified: Defection by an agent *i* against agent *j* accumulates a hidden debt *only for agent i*. When an agent's *individual* debt crosses a threshold, **only that specific agent** suffers a large, catastrophic fitness penalty (e.g., death). Cooperators never accumulate debt.
      *   **Predictions under Different Rules:**
          *   **Her Likely Rule (Discrimination/Asymmetric Cost):** **YES, cooperation likely survives.** Defectors *are* reliably discriminated against (full observation) and face asymmetric costs (individual catastrophic punishment). Cooperators are protected (no debt). Strategy evolution should favor cooperation to avoid self-destruction.
          *   **Stable Structures Rule:** **NO, cooperation fails.** The network still rewires constantly, preventing stable clusters from forming. Rule predicts failure despite targeted punishment.
          *   **Sufficient Information Rule:** **YES, cooperation survives?** Full information allows complex strategies to track others' debt/behavior and condition actions, potentially supporting cooperation. However, the *untargeted punishment* in the original setup also had sufficient information locally (2nd order) but failed – suggesting information alone isn't enough; the *nature of the consequence* matters more. This case might weakly support the Info Rule but doesn't strongly challenge the Discrimination Rule.
          *   **Visible/Targeted Punishment Rule:** **NO, cooperation fails? (Ambiguous)** The punishment is *targeted* (good) but still *hidden* (debt accumulation is not observable). Agents cannot *condition* their behavior on the nearing punishment threshold of others because they can't see the debt. This might lead to short-term defection until agents learn genetically/through evolution that defection leads to self-destruction. It tests the necessity of *visibility* for the punishment mechanism itself, separate from targeting.

      **Why this is the best test:** It directly isolates the "targeted/asymmetric consequence" aspect (which works here) from the "structural stability" aspect (which is absent). It shows that even in an unstable network, if a reliable, targeted, asymmetric punishment mechanism exists *and agents have the information to potentially learn/evolve to avoid it* (full observation), cooperation can prevail. This strongly supports the **Discrimination/Asymmetric Cost Rule** as the core principle, as it's the only one that would clearly predict success here. The others would predict failure due to instability or hidden punishment.
