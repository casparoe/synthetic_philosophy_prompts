answer: |-
  ### **State Apologies Deliberation: The Successor Liability Loop**
  **Duration:** 90 minutes  
  **Participants:** 12 graduate students  
  **Goal:** Experience the "successor liability loop" (apologizing for one wrong implicitly commits the state to apologizing for similar wrongs by different actors, creating a dilemma between inconsistency and overcommitment).

  ---

  ### **Roles (Assign 3 participants per role)**
  1. **Government Spokesperson**  
     - **Goal:** Protect state interests (resources, reputation, legal exposure).  
     - **Stakes:** Avoid setting precedents that could spiral into endless obligations. Must maintain public trust.  
     - **Secret Briefing:** "Your priority is to limit liability. If pushed, emphasize unique context of Wrong A to block extensions."

  2. **Victim-Group Delegate**  
     - **Goal:** Secure acknowledgment and non-monetary reparations (e.g., memorials, curriculum inclusion).  
     - **Stakes:** Moral urgency—failure weakens your group’s standing.  
     - **Secret Briefing:** "Link Wrong A to Wrongs B/C to force consistency. If denied, accuse the state of hypocrisy."

  3. **Taxpayer Advocate**  
     - **Goal:** Minimize state obligations (time, political capital, future risks).  
     - **Stakes:** Public backlash if state overcommits; anger if reparations escalate.  
     - **Secret Briefing:** "Frame extensions as a slippery slope. Warn that apologizing for A invites claims about B/C—and beyond."

  4. **Historian-Advisor**  
     - **Goal:** Provide objective analysis of historical connections.  
     - **Stakes:** Credibility hinges on neutrality. If ignored, your role is void.  
     - **Secret Briefing:** "Highlight structural parallels between Wrongs A, B, and C (e.g., systemic land seizures). Stay neutral but underline patterns."

  ---

  ### **Scenario: The Three Wrongs**
  - **Wrong A (1750):** State-backed displacement of Group X.  
  - **Wrong B (1840):** Cultural suppression of Group Y by a *different* regime (e.g., colonial officers vs. post-independence leaders).  
  - **Wrong C (1920):** Forced labor of Group Z under *another* distinct administration.  
  - **Shared Root:** All stem from "Systemic Resource Extraction" (e.g., seizing land/labor for state projects).  
  - **Non-Monetary Stakes:**  
    - An apology includes **memorial plaques** and **mandatory school curriculum mentions**.  
    - Each apology costs the state **1 "Trust Token"** (symbolic political capital). State starts with 3 tokens; if tokens drop to 0, the government "falls."  

  ---

  ### **Decision Rules**
  1. **Consensus-Driven:** 15 minutes of open debate per decision.  
  2. **Voting Fallback:**  
     - If no consensus, majority vote wins (each role’s 3 participants collectively hold 1 vote).  
     - **Government Spokesperson** breaks ties.  
  3. **Key Decisions:**  
     - **Round 1:** Apologize for Wrong A? (Yes/No).  
     - **If Yes:**  
       - **Round 2:** Does the *same framework* obligate an apology for Wrong B? (Yes/No).  
       - **Round 3:** Does it then obligate an apology for Wrong C? (Yes/No).  
     - **If No:** Deliberation ends; state blocks all apologies.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Setup (10 min):**  
     - Assign roles and distribute secret briefings.  
     - Clarify rules and stakes (Trust Tokens, voting).  
  2. **Role Prep (15 min):**  
     - Role groups caucus to strategize (e.g., Victim-Group Delegates coordinate demands).  
  3. **Deliberation Rounds (45 min):**  
     - **Round 1 (15 min):** Debate apology for Wrong A. Vote if deadlocked.  
       - *If Yes:* State loses 1 Trust Token. Historian notes structural parallels to B/C.  
     - **Round 2 (15 min):** Debate extending apology to Wrong B.  
       - *Trigger the loop:* Government must choose consistency (apologize, lose 1 token) or block (accusations of hypocrisy).  
     - **Round 3 (15 min):** Repeat for Wrong C.  
  4. **Debrief (20 min):**  
     - Map outcomes to the successor liability loop (see below).  
     - Discuss emotional/political trade-offs.  

  ---

  ### **Debrief: Mapping the Loop**  
  - **The Loop in Action:**  
    - **Extending Apologies:** If they apologized for A → B → C, they entered the loop (structural roots bound the state to escalating obligations).  
    - **Blocking Extensions:** If they apologized for A but blocked B/C, they faced charges of inconsistency ("Why acknowledge X but not Y or Z?").  
  - **Design Intent:**  
    - Participants discover the loop by confronting **structural similarities** (Historian’s input) vs. **practical limits** (Taxpayer/Government pressure).  
    - Non-monetary stakes (Trust Tokens) force trade-offs: Overcommitment risks "collapse"; blocking erodes legitimacy.  

  ---

  ### **Honest Note: What the Game Can’t Capture**  
  - **Real-World Complexity:** The game simplifies the **emotional weight of historical trauma**. In reality, victim groups’ demands arise from intergenerational suffering—not just strategic arguments. The loop’s moral gravity (e.g., healing vs. state fatigue) exceeds the exercise’s scope.  

  ---

  ### **Heads-Up: What Will Go Wrong the First Time**  
  - **Predicted Snags:**  
    1. **Premature Consensus:** Groups may rush to apologize for A without seeing the loop. *Mitigation:* Historian should explicitly note structural links early.  
    2. **Role Misalignment:** Taxpayer Advocates might side with Victim-Groups out of sympathy. *Mitigation:* Remind them of stakes (e.g., "Your constituents fear higher taxes if the state overcommits").  
    3. **Loop Avoidance:** Government may try to "study" Wrongs B/C to dodge the dilemma. *Rule Enforcement:* Force a yes/no vote—no deferrals.  
  - **Instructor Script:** "Your goal isn’t to ‘win’ but to experience the state’s dilemma. Lean into your role’s incentives even if uncomfortable."  

  ---

  ### **Why This Works**  
  - Participants **uncover the loop organically** through role-driven conflict (e.g., Victim-Groups invoke structural parallels; Taxpayers warn of endless claims).  
  - Low stakes (Trust Tokens) create tension without financial distractions.  
  - Debrief explicitly links their choices to the loop, reinforcing the philosophical dilemma.  

  **Outcome:** A visceral understanding of why state apologies risk either inconsistency or infinite liability—with no clean escape.
