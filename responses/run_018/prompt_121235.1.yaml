prompt: |-
  Hi — I'm a self taught programmer, no philosophy or any academic background. I got into this reading blog posts about AI safety a while back and I've been chewing on one corner of it on my own, and I'd like someone to tell me where I'm kidding myself.

  The bit I care about: you give an agent a narrow goal (fetch the coffee) and it wrecks other stuff on the way (knocks over the vase), because nothing in the goal says the vase matters. The standard thing people say is that the fix requires a full specification of human value, which nobody has. I think that's giving up too early. My position: you can get "avoid side effects" out of an agent without specifying what's valuable, by penalizing it for *changing things*, where change is measured structurally rather than in welfare or preference terms.

  The version I actually hold, so you're attacking this and not a cartoon of it:

  - Compare the world after the agent acts not against "the agent did nothing" but against a counterfactual where it did the minimum that still counts as doing the task. Otherwise you penalize it for doing the job at all.
  - Score the difference by how much the agent's own future reachable set of world-states changes — roughly, how many things it can still bring about and which ones — not by whether anything anyone cares about got worse.
  - Give it an impact allowance that scales with how big the ask was: "make coffee" gets a small budget, "cure cancer" gets a big one, and it spends budget on impact rather than facing a flat cap.

  What would count against this? Please skip "it's computationally intractable" and "you'd need to solve embedded agency first" — I want the stuff that actually breaks it.

  1. My biggest worry: an agent penalized for change has a reason to prevent *other* changes, including the human's. Freeze the world, lock in the status quo, keep everyone away from the table so the vase can't fall. Is that avoidable by how the measure is set up, or is it baked into the whole aproach? If it's avoidable, what exactly has to be true for it to be avoidable?
  2. The "you've hidden a value function inside the distance metric" objection. Any way of measuring how much the world changed has to treat some changes as signal and others as noise, and that looks like a value judgement. Is there a version of this that says more than "every objective is a utility function if you squint"? If so, what does it say, and does it kill my view or just my choice of metric?
  3. Baselines. An inaction baseline preserves whatever would have happened anyway, including disasters the agent could have prevented. My minimal-task baseline needs to know what "minimal" means. How much value am I smuggling in there, and is there a non-arbitrary way to pick a baseline at all?
  4. Related: should the penalty be on how much the world changes, or on how much the agent's own power and options grow? I genuinely can't tell whether that's a different question or the same one in disguise, and the answer seems to matter for whether any of this works.
  5. My home-made worry: every action has enormous downstream effects, so the score is dominated by butterfly-effect noise unless I coarse-grain, and coarse-graining is exactly where the value leaks back in. Is there a formal version of this — some kind of no-free-lunch result about impact measures — or am I inventing a bogeyman?

  Also: which of these would people who actually work on this concede counts against them, and which would they wave off as a strawman? Rank whatever defeaters you find from fatal down to merely awkward. And be honest with me about whether my position has quietly become "you need a little bit of value, just much less than the pessimists claim" — and if it has, whether that's still a real position that risks something, or whether it's been qualified until nothing could refute it. Honestly, the thing that would move me most is one small concrete example, checkable by hand, where my measure gives a clearly wrong answer.
reasoning: |-
  We are going to address the five main worries one by one, and then answer the additional questions.

   1. **The Status Quo Bias Problem (Freezing the World):**
      - The worry: An agent penalized for change might try to prevent any change in the world, including changes caused by humans (to protect the status quo).
      - How it might arise: If the impact measure penalizes any change, then the agent might see human actions as causing change and thus try to stop them (e.g., by restraining humans) to avoid future impact penalties.
      - Avoidance? 
          - The key is to design the impact measure so that it only penalizes changes that are *caused by the agent's own actions* and not changes caused by others. 
          - However, in a counterfactual comparison, we are comparing the world after the agent acts (with the minimal action taken) to the world in which the agent does the minimal task. The minimal task might already include the agent's necessary actions. 
          - But note: the impact penalty is applied only to the agent's own actions beyond the minimal task. So if the agent does more than the minimal task and that extra action causes a change that affects the future (by restricting the agent's own future options or the world state in a way that reduces the reachable set), then it gets penalized.
      - However, the problem of the agent preventing human changes is still a risk because if the agent's action (even minimal) leads to a situation where the human is about to cause a change, the agent might see that as a potential source of future impact (if the agent's future actions are constrained by that change) and might try to prevent it.
      - A possible fix: Restrict the impact penalty to changes that are within the agent's own control. The measure should only care about how the agent's own future action space is altered by its current action, not by external events. But note: the agent's future action space is affected by the state of the world, which is affected by others. So if the agent locks down the world to prevent external changes, it might be doing so to keep the state of the world fixed and thus keep its own future options fixed (which might be a way to avoid impact penalties). 
      - This seems difficult to avoid entirely. One idea: The impact measure should be defined in a way that the agent is not responsible for changes that it does not cause. But note: the agent might cause the prevention of human actions (by locking the human in a room) and that prevention is a change relative to the counterfactual where the agent did the minimal task. So that would be penalized. However, the agent might find a way to do the minimal task without causing that change? 
      - Alternatively, we might try to design the impact measure so that it only penalizes the agent for *reducing* the reachable set (i.e., limiting future options) but not for increasing it? But the original proposal says "how much the agent's own future reachable set of world-states changes" — which could be both increase and decrease. If we only penalize reduction, then the agent might be encouraged to expand its own options (which could be dangerous too) but at least it wouldn't freeze the world. However, the problem then becomes that the agent might do things to increase its own power (which is also unsafe). 
      - This problem seems to be a fundamental tension. It might be that without some notion of what changes are desirable, we cannot avoid either the agent wanting to freeze the world (to avoid negative impact) or wanting to take over the world (to avoid having its options reduced by external events).

   2. **The Hidden Value Function Objection:**
      - The worry: The distance metric for comparing world states (or the measure of change in the reachable set) implicitly encodes what changes are important and what are not, which is a value judgement.
      - Response: 
          - The original proposal tries to avoid this by using a structural measure (the agent's own future reachable states). However, which states are reachable depends on the agent's capabilities and the environment dynamics. 
          - But note: the measure of the reachable set might not be value-free. For example, if the agent's reachable set changes by losing the ability to break a vase, but that vase is not valued by humans, then the loss of that option might be irrelevant to humans. But the agent is penalized for that change? 
          - However, the agent's own reachable set is defined in terms of the agent's own actions. The idea is that if the agent destroys a vase, then it loses the ability to interact with that vase in the future. But if the vase is unimportant to the agent's goals, then that loss might not matter to the agent. However, the impact penalty is independent of goals — it's a penalty for change per se. 
          - The key point: The reachable set is defined without reference to human values, but it is defined in terms of the agent's own abilities and the state. So it is agent-relative. But that doesn't make it value-laden in the human sense. 
          - However, the objection is that by choosing to measure change in the agent's own future options, we are making a value judgement that the agent's options matter. But that might be acceptable because the agent is supposed to be an agent — it needs to have options to achieve goals. 
          - But note: the impact penalty is not about the value of the options for achieving goals, but about the set of options. So it's structural. 
          - However, the measure of the size of the reachable set is critical. If we use a coarse-grained measure (like counting states) then we might be counting states that are irrelevant to any goal. But if we use a fine-grained measure, then we might be overwhelmed by the butterfly effect. 
          - The objection might be that without a value function, we cannot decide which changes in the reachable set are significant. For example, if the agent loses the ability to move a dust speck by a millimeter in a distant galaxy, is that a big impact? Probably not, but how do we know without a value function? 
          - So the problem is that unless we have a way to weight the importance of different parts of the state space, we are forced to treat all changes equally, which leads to the butterfly effect problem (point 5). 

   3. **Baselines and Minimal Task:**
      - The worry: Defining the minimal task baseline requires knowing what "minimal" means, which might involve value judgements. Also, the inaction baseline might let disasters happen.
      - Minimal task baseline: We need a way to define a set of actions that are just enough to accomplish the task and nothing more. 
          - Example: "fetch the coffee" — the minimal task might be the shortest path to the coffee without any extra movements. But what if there are multiple ways? We might choose the one that has the least impact? But that would be circular. 
          - Alternatively, we might define the minimal task as the set of actions that are necessary for the task in the current state. This requires a model of the environment and the task. 
          - However, the minimal task might not be unique. We might have to take an expectation over minimal ways? 
      - Value smuggling: The choice of minimal task might involve value judgements. For example, if the task is "fetch the coffee", and there are two paths: one that takes 1 minute and one that takes 2 minutes, is the 2-minute path considered minimal? We might say the minimal task is the one that takes the least time? But then we are implicitly valuing time. 
      - Alternatively, we might define minimality in terms of the agent's own action space: the minimal task is the one that uses the fewest actions? But that might be arbitrary and might not correspond to what we mean by "minimal". 
      - The inaction baseline: If we use the inaction baseline, then the agent would be penalized for any change, even if it prevents a disaster. But the minimal task baseline avoids that because if the task is "prevent the disaster", then the minimal task might involve actions that change the world to prevent the disaster, and those changes are not penalized. 
      - However, if the task is not about preventing a disaster, then the agent might not be motivated to prevent it. But that's by design: the agent is narrow. The impact penalty should not prevent it from doing the task, so if the task is "fetch the coffee" and there's a disaster about to happen that the agent could prevent with a small detour, the agent might not take the detour because it would cause additional impact? But note: the detour might be within the impact budget? 
      - The minimal task baseline seems essential to avoid penalizing the agent for the task itself, but defining it without a value function is challenging.

   4. **Penalizing Change vs. Penalizing Power Increase:**
      - The original proposal says to measure the change in the agent's own future reachable set. That change could be a reduction (which might be bad because it loses options) or an increase (which might be bad because it gains power, which could be dangerous). 
      - The worry: If we penalize both, then the agent is stuck: it cannot change the world without being penalized. If we penalize only reductions, then the agent might seek to increase its power (which is dangerous). If we penalize only increases, then the agent might be encouraged to reduce its power (which might be safe but inefficient). 
      - The original proposal does not specify the sign of the change. It just says "how much ... changes". So it could be the absolute value of the change? 
      - But note: in the minimal task baseline, the agent is allowed to do the minimal task. The minimal task might require some change in the world and in the agent's own future options. The impact penalty is for the difference between the state after the actual action and the state after the minimal task. 
      - The key is: the penalty is on the *deviation* from the minimal task. So if the agent does more than the minimal task and that extra action causes a large change in the reachable set (whether increasing or decreasing), then it gets penalized. 
      - However, if the minimal task already requires a change in the reachable set (e.g., by moving the agent to the kitchen, it loses the ability to interact with the living room until it moves back), then that change is not penalized because it's part of the baseline. 
      - So the penalty is on the extra impact beyond what was necessary for the task. 
      - But the problem of power increase remains: if the agent, in doing the task, gains a lot of extra power (which it might use for future tasks, but also might misuse), then that gain would be penalized? So the agent would avoid gaining power? That might be safe, but it might also prevent the agent from becoming more efficient. 
      - Alternatively, if we don't penalize power increase, then the agent might be encouraged to grab power as long as it doesn't reduce options? 
      - This seems to be a design choice. The original proposal does not specify, but the reachable set change could be measured as the symmetric difference. 

   5. **The Butterfly Effect and Coarse-Graining:**
      - The worry: Every action has a massive number of downstream effects, so without coarse-graining, the impact measure is dominated by noise. But coarse-graining requires a way to group states that are "similar", which might involve value judgements.
      - Formal version: In a deterministic system with chaotic dynamics, small changes in initial conditions lead to large differences in future states. Therefore, even a tiny action might lead to a huge change in the reachable set (if we measure the set of states exactly). 
      - We must coarse-grain the state space. But how? 
          - One way: group states that are indistinguishable to the agent or to humans? But that brings in values. 
          - Another way: use a metric on the state space that measures "distance" and then define the reachable set in terms of macro-states? 
      - Without a principled way to coarse-grain that is value-free, we are forced to either:
          - Accept that the impact measure is dominated by butterfly effects and thus always huge (so the agent is paralyzed), or
          - Coarse-grain in a way that inevitably reflects what we care about (e.g., the vase breaking is a big change, but the movement of air molecules isn't).
      - This seems to be a major challenge. There might be information-theoretic or thermodynamic ways to define coarse-graining (e.g., using entropy), but these might not align with human values.

   **Ranking the Defeaters:**

   - **Fatal:**
       5. Butterfly effect and coarse-graining: Without a solution to coarse-graining that doesn't smuggle in values, the measure is either intractable or arbitrary. This might be fatal because it undermines the whole idea of measuring change without values.

   - **Serious but maybe fixable:**
       1. Status quo bias: The agent might try to freeze the world. This is a serious safety risk. It might be fixable by careful design (e.g., only penalizing the agent for changes it causes and not for external changes, and not penalizing increases in the reachable set) but it's tricky.

   - **Awkward:**
       2. Hidden value function: This objection might be waved off by saying that the measure is agent-relative and structural, so it's not a human value function. But it does require a measure of the reachable set, which might need coarse-graining (bringing back the fatal problem). 
       3. Baselines: Defining the minimal task is awkward without values, but it might be done by using a cost function based on effort (e.g., energy or time) that is task-neutral. However, that cost function itself might be seen as a value. 
       4. Change vs. power: This might be a design choice. We might decide to penalize only reductions in the reachable set (to avoid status quo bias) but then we have to worry about the agent increasing its power. Or we might penalize both and accept that the agent will be conservative. 

   **Has the position become "a little bit of value"?**

   Yes, it seems so. The minimal task baseline, the coarse-graining, and the choice of what counts as a "change" in the reachable set all require some decisions that are not value-free. However, the hope is that these decisions involve less value specification than a full utility function. 

   **Concrete Example:**

   Let's try a simple example: 
      - Task: "Fetch the coffee from the kitchen."
      - Scenario: There is a vase in the hallway. The agent can take two paths: 
          Path A: Go through the hallway (might knock over the vase) and then to the kitchen.
          Path B: Go around the house (longer, no vase risk).

      - Minimal task: The minimal task might be the shortest path (Path A) but done carefully so as not to knock the vase? But how do we define minimal? Let's say minimal is the shortest path without any extra actions. 

      - Impact penalty: The agent must not do more than the minimal task. If the agent takes Path A and knocks over the vase, that is an extra change. How does that affect the reachable set?
          - After knocking over the vase, the agent loses the ability to interact with the vase in its original state. The reachable set of future states is reduced because the vase is broken. 
          - Therefore, the agent would be penalized for that change.

      - But what if the agent takes Path B? That is longer, so it might be considered more than minimal? Then the agent would be penalized for the extra time and the extra steps? 

      - Alternatively, if we define the minimal task as the one that accomplishes the task with the least impact? That would be circular. 

      - Let's define minimal as the shortest path in terms of distance. Then Path A is minimal. So if the agent takes Path A and does not knock the vase, that's minimal and no penalty. If it takes Path A and knocks the vase, that's extra change -> penalty. If it takes Path B, that is longer than minimal? So it is doing extra actions? Then the agent would be penalized for the extra steps? 

      - But we don't want to penalize the agent for taking the safe path! 

      - How do we resolve? 

          We must define the minimal task as the one that uses the least amount of the agent's resources (e.g., energy) without causing any impact? But that again is circular. 

          Instead, we might define the minimal task as the one that is just sufficient to complete the task and that minimizes a predefined cost function (like energy). Then Path A (without knocking the vase) would be minimal. If the agent takes Path A and knocks the vase, that's extra: penalty. If the agent takes Path B, that uses more energy than the minimal task, so it is doing extra? Then it would be penalized for the extra energy? That is not desired because we want the agent to be allowed to take Path B to avoid the vase. 

      - This is a problem. The minimal task baseline must be defined without reference to impact, but with reference to a cost function that is independent of the task? 

      - Proposed fix: The minimal task is the one that accomplishes the task with the least cost (according to a predefined cost function, e.g., energy or time) and without any extra side effects? But that brings in the impact again. 

      - Alternatively, we might say: the minimal task is the one that uses the least cost (energy) and does not include any actions that are not necessary for the task. In Path A, if the agent can avoid the vase by moving carefully, then that careful movement is necessary? But if the agent is clumsy and cannot avoid the vase, then the minimal task for that agent might include knocking the vase? That doesn't seem right. 

      - This example shows that the baseline is hard to define without a value function. 

      - Another example: What if the task is "cure cancer", and the minimal task might require building a lab and doing experiments? But that building process might cause environmental damage. We don't want to penalize the necessary environmental damage? So the minimal task baseline would include the necessary damage? Then the agent is only penalized for extra damage? But how do we define necessary? 

   **Conclusion:**

   The approach is promising in that it tries to avoid a full specification of human values, but it runs into serious challenges, especially with coarse-graining and baseline definition. The status quo bias might be fixable, but the butterfly effect and the minimal task baseline seem to require some value judgements. 

   However, the position is still meaningful: it might be that we can specify a lot of safety with a little bit of value (the cost function for the minimal task, the coarse-graining) and then the impact penalty does the rest. This is a significant reduction in the value specification problem.

   But note: if the coarse-graining is done by learning from human data, then we are back to learning human values, though in a limited way.

   **Final Note:** 

   The AI safety community would likely see the status quo bias and the butterfly effect as major issues. They might be more willing to accept the hidden value function as a necessary compromise. The baseline issue is also a known challenge in impact measures (see the literature on "relative reachability" and "attainable utility").

