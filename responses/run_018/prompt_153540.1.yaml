prompt: |-
  hey, i'm a software engineer with no formal philosophy traing, trying to understand virtue ethics after running into the situationist critique (the social psych stuff saying character traits dont predict behavior well). i want the desiderata: what must any virtue theory that takes situationism seriously actually deliver to be adequate? list each requirement with the reasoning behind it, mark which are non-negotiable vs camp preferences, and say if any subset is jointly unsatisfiable — especially whether global character traits and full situation-sensitivity can coexist. include cross-situational consistency, local trait activation, moral education, and whether "moral fragmentation" is a real constraint or just jargon. also flag which single requirement does the most damage to a classical aristotelian picture. no citations or reading lists please, just the criteria mapped out.
reasoning: |-
  Okay, the user is a software engineer diving into virtue ethics and grappling with the situationist critique. They want a clear set of criteria for any virtue theory that takes situationism seriously. Let me unpack their query.

  First, they mention the situationist critique from social psychology, which challenges the idea that stable character traits predict behavior. So their main concern is how virtue ethics can hold up when empirical evidence suggests behavior is more situation-dependent. 

  They’re asking for desiderata—essentially requirements—for a viable virtue theory post-situationism. They want each requirement explained, marked as non-negotiable or preference, and checked for compatibility. Specific points include cross-situational consistency, local traits, moral education, and the concept of moral fragmentation. They also want to know which requirement most challenges classical Aristotelianism.

  Breaking this down, the core tension is whether global character traits can coexist with full situation-sensitivity. Situationists argue that behavior varies too much across contexts for global traits to be real. So a modern virtue theory needs to address this without abandoning traits entirely. 

  Key requirements would include: redefining traits as local rather than global (non-negotiable), accepting situation-sensitivity (also non-negotiable), and rethinking moral education to focus on contextual responsiveness. Moral fragmentation—where virtues are context-specific—might be necessary, not just jargon. 

  The biggest blow to Aristotle is the shift from global traits to local ones. His view of virtues as stable, unified dispositions across all situations is directly challenged. If traits are only local, his theory needs significant revision. 

  I should also check if local traits and situation-sensitivity are compatible. They are, but it requires a fragmented view of character. Moral education then becomes about managing contexts rather than building global virtues. 

  The user likely wants practical, actionable criteria—no fluff or citations. As a software engineer, they might appreciate structured, systematic breakdowns. Highlighting tensions and trade-offs will help them see where theories might fail or adapt. 

  Deep needs: They’re probably seeking a coherent framework to reconcile ethics with empirical psychology, avoiding abstract philosophy. They might want to apply this understanding practically, maybe in AI ethics or personal development. Ensuring clarity on what’s feasible (local traits) versus untenable (global traits) is key.
answer: |-
  Here's a breakdown of the core requirements (desiderata) for a virtue theory taking situationism seriously, mapped to your points:

  **Core Desiderata (Non-Negotiable):**

  1.  **Radical Situation-Sensitivity:** *Reasoning:* Situationism demonstrates behavior is powerfully influenced by seemingly trivial situational factors. Any adequate theory *must* incorporate this as a fundamental constraint on how character/virtue operates. Virtue cannot be conceived as immune to context. *Impact on Aristotle:* Severely challenges the idea of virtues as stable dispositions reliably manifesting across diverse situations.
  2.  **Rejection of Strong Globalism:** *Reasoning:* Situationism undermines the empirical reality of highly consistent, cross-situational "global" character traits (e.g., "honest person" who is honest *everywhere*). The theory *must not* rely on such traits as the primary explanatory or normative unit. *Impact on Aristotle:* Directly attacks the Aristotelian core of virtues as fixed, global hexis (stable dispositions) defining the agent's character across life.
  3.  **Local Traits as Primary (or Equivalent Mechanism):** *Reasoning:* Empirical evidence suggests consistency *is* found within specific, stable contexts or "local" trait domains (e.g., "honest-in-tax-reporting," "compassionate-with-friends-under-stress"). The theory *must* ground virtue in mechanisms that are inherently context-bound – whether called "local traits," "situation-specific dispositions," "contextual affordance sensitivities," etc. *Impact on Aristotle:* Forces a fragmentation of virtue from a unified global state to a collection of context-specific dispositions or sensitivities.
  4.  **Accountability for Cross-Situational Inconsistency:** *Reasoning:* Situationism shows people act "out of character" frequently. The theory *must* provide an account of why an agent exhibits virtue in Context A but not Context B, *without* resorting to ad-hoc excuses or denying the inconsistency. It needs a conceptual framework for moral failure rooted in situation-response, not just weakness of will. *Impact on Aristotle:* Challenges the simplicity of akrasia (weakness of will) as the primary explanation for failure; failure becomes more about mis-specification of virtue's domain or inadequate situation-perception.

  **Important Functional Requirements (Strongly Recommended, Borderline Non-Negotiable):**

  5.  **Plausible Moral Psychology & Education:** *Reasoning:* The theory *must* explain *how* one becomes virtuous given the context-dependence. How does moral education cultivate the relevant local traits or situational sensitivities? How does practical wisdom (phronesis) operate if it's not governing a set of global traits? It must avoid being purely descriptive. *Impact on Aristotle:* Requires rethinking habituation – it can't just instill global dispositions; it must focus on context-recognition, sensitivity training, building *local* habits, and developing meta-cognitive skills for situational appraisal.
  6.  **Action-Guidance & Normativity:** *Reasoning:* Ethics needs to guide action. The theory *must* offer principles (even if context-sensitive) for determining what the virtuous response *is* in a given situation, despite the fragmentation. It must retain normative force ("ought"). *Impact on Aristotle:* Phronesis becomes even more central but also more complex, needing rules-of-thumb sensitive to highly specific contextual cues rather than applying global virtues.

  **Camp Preferences / Implementation Choices:**

  7.  **Degree of "Moral Fragmentation":** *Reasoning:* Is character *fundamentally* a collection of largely independent local traits ("fragmentation" as real), or are there higher-order integrative structures (e.g., a powerful phronesis, self-narrative, core commitments) that provide *some* coherence ("fragmentation" as a challenge to be managed)? *Status:* Camp Preference. Some theories embrace radical fragmentation; others posit limited integrative capacities. Both must still satisfy points 1-4. *Is it jargon?* No, it's a real conceptual fork in the road post-situationism.
  8.  **Role of Global Language:** *Reasoning:* Can we still meaningfully call someone "courageous" globally if courage is only manifested in specific domains? *Status:* Camp Preference. Some theories abandon global descriptions as misleading; others see them as shorthand summaries or aspirational ideals, while acknowledging their empirical thinness. Must be used cautiously if at all.
  9.  **Scope of Phronesis (Practical Wisdom):** *Reasoning:* How much work does phronesis do? Is it primarily about *perceiving* the morally salient features of *this specific* situation and activating the *relevant* local trait? Or does it also involve higher-order integration of local traits or adjudication between them? *Status:* Camp Preference. All theories need phronesis for perception/response; they differ on its integrative role.

  **Coexistence & Tensions:**

  *   **Can Local Traits & Full Situation-Sensitivity Coexist? YES.** This is the core response to situationism. Local traits *are* the mechanism for consistency *within* their relevant domain, while full situation-sensitivity explains why that consistency doesn't generalize *beyond* that domain. The "trait" is defined by its sensitivity to a specific class of situations.
  *   **Is there a Fatal Tension?** The major tension is between **Rejection of Strong Globalism (2)** and the **Classical Aristotelian Picture**. This is the single requirement doing the most damage. Aristotelianism is fundamentally committed to global, stable hexis. Denying this requires a radical revision, not just a tweak. Points 3 (Local Traits) and 4 (Accounting for Inconsistency) follow logically from rejecting globalism and accepting situation-sensitivity.
  *   **Joint Satisfiability:** The core requirements (1-4) are jointly satisfiable *if* one accepts a local trait framework (or functional equivalent like sophisticated situationist phronesis). Requirement 5 (Moral Education) is challenging but not impossible – it requires retooling habituation towards context. Requirement 6 (Action-Guidance) is the hardest, as highly contextual norms risk vagueness, but is essential for the theory being normative ethics.

  **Summary of Key Points:**

  *   **Non-Negotiables:** Situation-Sensitivity (1), Reject Strong Global Traits (2), Use Local Traits/Mechanisms (3), Explain Inconsistency (4).
  *   **Critical Functional Needs:** Plausible Moral Psychology/Education (5), Action-Guidance (6).
  *   **Major Camp Splits:** Degree of Fragmentation (7), Use of Global Language (8), Scope of Phronesis (9).
  *   **Moral Fragmentation:** A real conceptual consequence (not just jargon), describing the shift from global unity to context-specificity. Its *degree* is debated.
  *   **Local Traits & Situation-Sensitivity:** Coexist inherently; local traits *are* situation-sensitive dispositions.
  *   **Biggest Hit to Aristotle:** **Rejection of Strong Globalism (2)**. This undermines the very foundation of Aristotelian virtues as stable, cross-situational dispositions (hexis). Everything else follows from accommodating this empirical challenge.
