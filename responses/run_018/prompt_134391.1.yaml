answer: |-
  Here's a breakdown of the Pluto reclassification through Wittgenstein's lens, addressing your specific queries:

  **1. "Planet" as a Family Resemblance Concept:**
  *   **Historical Overlapping Similarities (Pre-Eris):** Pluto shared a *network* of features with recognized planets like Mercury or Neptune:
      *   **Orbiting the Sun:** Like Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.
      *   **Spherical Shape (Hydrostatic Equilibrium):** Like all major planets (implied by size/observations, though not formally defined).
      *   **Relative Size & Distance:** Larger than known asteroids, smaller than gas giants; orbiting far beyond Neptune like a distant outlier.
      *   **Visual Appearance:** A distinct point of light moving against background stars, observable with powerful telescopes, unlike stars or diffuse nebulae.
      *   **Discovery Context:** Found in a systematic search for "Planet X" perturbing Neptune's orbit, fitting the historical narrative of planetary discovery.
      *   **Cultural/Educational Integration:** Included in textbooks, models, mnemonics ("My Very Educated Mother...") for decades.

  *   **Breakdown with Eris & Kuiper Belt Objects (KBOs):** The discovery of numerous large KBOs, particularly Eris (initially thought larger than Pluto), exposed the limitations of the family resemblance approach *for a specific purpose*:
      *   **Similarity Overload:** Eris shared *all* the key resemblances Pluto had with the classical planets: orbits the Sun, spherical, similar size (or larger), distant point of light, found via telescopic search.
      *   **Loss of Distinctiveness:** Pluto was no longer a unique outlier. Ceres (in the asteroid belt) also became spherical under scrutiny. Suddenly, the "distant, spherical Sun-orbiter" category potentially included dozens, maybe hundreds, of bodies.
      *   **Ambiguity of the Network:** The overlapping similarities didn't provide a clear way to distinguish Pluto/Eris from Mercury/Neptune *or* from smaller KBOs/asteroids. The "family" became too large and internally diverse for the practical needs of astronomy. Where does the resemblance chain stop? Is Ceres a planet? Is Eris? How many planets would there be?

  **2. Clash of Language Games:**
  The IAU vote and backlash illustrate distinct, coexisting language games with different rules and purposes:
  *   **Professional Astronomical Taxonomy Game:**
      *   **Goal:** Precise classification for research, communication, database management.
      *   **Rules:** Requires clear, objective, empirically verifiable criteria applicable across the solar system. Prioritizes dynamical characteristics (orbit clearing) as key discriminators. Authority derived from peer-reviewed process and expert consensus (IAU vote).
      *   **"Correct" Usage:** Pluto is a "dwarf planet," distinct from the eight "planets."
  *   **School Education Game:**
      *   **Goal:** Convey fundamental knowledge, structure curricula, use mnemonics, inspire students.
      *   **Rules:** Values stability, simplicity, memorability. Relies heavily on established textbooks and cultural norms. "Nine planets" was deeply embedded.
      *   **"Correct" Usage:** Ambivalent. Textbooks slowly changed, teachers grappled with explanations, "My Very Educated Mother..." required awkward modification. Resistance stemmed from disruption to established pedagogical tools.
  *   **Popular Culture Game:**
      *   **Goal:** Shared narratives, cultural identity, nostalgia, entertainment (e.g., astrology, sci-fi).
      *   **Rules:** Driven by sentiment, symbolism, media narratives, and established cultural touchstones. Pluto held emotional weight as the "underdog" planet.
      *   **"Correct" Usage:** Pluto remains a planet for many. Protests, memes ("Pluto is a planet!"), merchandise, and media often reject the IAU definition. Pluto's demotion became a cultural story about loss or scientific rigidity.
  *   **Administrative/Legal Game (e.g., NASA missions):**
      *   **Goal:** Mission justification, funding allocation, public outreach.
      *   **Rules:** Must navigate scientific accuracy, public perception, and political realities. May blend criteria pragmatically.
      *   **"Correct" Usage:** NASA officially uses "dwarf planet" but often highlights Pluto's *planetary* characteristics (geology, atmosphere) in outreach, acknowledging its cultural status. New Horizons was a "mission to Pluto" and the "Kuiper Belt," rarely explicitly "to a dwarf planet."

  **Why the IAU Couldn't Overwrite the Others:**
  Wittgenstein shows meaning is *use within a form of life*. The IAU defined rules for *their specific game* (professional taxonomy). They couldn't dictate:
  1.  **Pedagogical Utility:** Schools need stability; changing deeply ingrained knowledge is slow and disruptive.
  2.  **Cultural Significance:** Pluto's symbolic meaning in popular culture isn't governed by astronomical criteria.
  3.  **Linguistic Habit:** Decades of calling Pluto a planet created a deeply rooted linguistic practice resistant to top-down change.
  4.  **Different Purposes:** Other games didn't *need* the IAU's precision. For casual conversation or basic education, the fuzzy family resemblance worked adequately.

  **3. Limits of Wittgenstein's Lens:**
  *   **Scientific Taxonomy vs. Ordinary Language:** Science *often strives* for essential definitions (necessary/sufficient conditions) for practical reasons. Astronomy needed a clear, operational definition to manage a suddenly crowded solar system. While "planet" *originated* in family resemblance, science can *impose* an essentialist definition for specific, functional purposes within its domain. Wittgenstein might say this is just establishing new, stricter rules for the *scientific taxonomy game*, not discovering a pre-existing essence.
  *   **Category Splitting & Empirical Discovery:** Family resemblance struggles with empirical discoveries that create "similarity bottlenecks." Eris forced a choice: drastically expand "planet" (rendering it scientifically unwieldy) or split the category. Wittgenstein doesn't provide clear rules for how language *should* adapt to such shocks; he only describes how it *does* adapt through changing uses. The IAU vote *was* that adaptation within the scientific game.
  *   **Institutional Authority:** The Pluto case shows institutional authority (IAU) *can* successfully impose an essentialist grammar *within its own domain*. It didn't (and couldn't) impose it universally on all language games, but it *did* successfully establish a new rule-set for professional astronomy. Wittgenstein might see this as the scientific community collectively deciding to play a new variant of their language game with stricter rules, driven by new empirical circumstances.

  **4. What the Episode Reveals about Wittgenstein's Broader Claim:**
  The episode **strongly confirms** Wittgenstein's core theses:
  1.  **No Hidden Essence:** There is no single, eternal, metaphysical "planet-ness" that Pluto lacked. The debate was about *how we choose to use the word* for different purposes. Pre-Eris, Pluto sufficiently resembled other planets in enough ways for its status to be uncontested within the then-current language games. Post-Eris, the scientific game *changed its rules* because the old usage became impractical. The "essence" (IAU definition) is a tool, not a discovery.
  2.  **Meaning is Use:** The meaning of "planet" is demonstrably different in the IAU press release, a 4th-grade classroom, a planetary science conference, a newspaper headline, and a cartoon. Each context determines its use and meaning.
  3.  **Language Games are Robust:** The persistence of Pluto-as-planet in popular culture and education decades after the IAU vote powerfully demonstrates that language games resist top-down imposition if the new rules don't serve their internal purposes. Meaning isn't dictated by fiat.
  4.  **Empirical Shocks Change Games, Not Essences:** The discovery of Eris didn't reveal Pluto's "true non-planet essence." It created a practical problem *within the existing scientific language game*. The IAU's response wasn't uncovering truth but *redefining the rules* of their game to restore utility. Other games adapted differently or not at all. This is evidence *for* Wittgenstein: the shock changed *practices* (uses), not the underlying reality of the objects.

  **In conclusion:** The Pluto saga is a near-perfect case study for Wittgenstein. It shows a concept born of family resemblance, whose practical usage became strained by empirical discovery. This led a specific language game (professional astronomy) to adopt an essentialist definition for functional reasons, creating conflict with other games (education, culture) governed by different rules and purposes. The ongoing disagreement confirms that meaning resides in use within diverse forms of life, not in hidden essences, and that language games are remarkably resilient to external attempts to redefine them when those redefinitions don't align with their internal logic. Scientific taxonomy can *adopt* essentialism as a practical tool within its game, but this doesn't negate the fundamentally use-based, family-resemblance nature of concepts as they evolve in the broader river of language.
