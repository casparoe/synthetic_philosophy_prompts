prompt: |-
  I'm on the review board for my city's "unexpected spaces" grant -- we fund temporary instalations in laundromats, bus shelters, empty lots, that kind of thing. Our charter just says "art," and I have to deside if a proposal counts before it goes to the board chare for sign-of. I get maybe six a month, I have about fiften minutes per file, I'm not trained in aestetics, and the stakes are public money plus access to shared spaces.

  I want a reusable decision procedure based on the idea that art is basically an intentional presentation that breaks the usual functional categorization of whatever it's made of -- so the thing is shown in a way that forces you to see it outside its normal use-category -- combined with the check that at least one recognized art-world practice (gallery, museum, critical writing, art school curriculum, etc.) has treated similar work as art. Not just the maker saying so.

  Write me the procedure: the questions in order, what counts as a sufficient answer to each, where it stops with a hard no, where it stops with a yes, and exactly where it has to hand the decision to a person because it's values not facts. Be honest about where it will misfire or give weird answers.

  Then run it on three proposals:
  1. A stack of clean laundry baskets arranged in a laundromat with a small plaque reading "instalation: baskets."
  2. A genuinely beautiful bus shelter designed by an architect who says she intended it as public art, but it's fully functional and looks basically like every other shelter except for color.
  3. A performer who silently sorts trash in a park for three hours, with no audience, no photos, no record at all -- just the performer insisting later that it happened and it was art.

  Make sure one of these gives me an answer I'll probably hate. And tell me clearly what this procedure flat-out can't settle, no matter how carefully I run it.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a review board for a grant that funds temporary art installations in unexpected public spaces. Their main challenge is deciding what qualifies as "art" under their charter. They need a quick, reusable decision procedure because they have limited time per proposal and no formal art training. The stakes involve public money and access to shared spaces.

  The user’s proposed framework revolves around two key principles: intentional presentation that disrupts functional categorization and validation from recognized art-world practices. I need to translate this into a step-by-step procedure that's practical for their workflow. The procedure must include clear questions, sufficient answers, decision points for yes/no, and flags where human judgment is unavoidable.

  First, I'll outline the core questions. Step 1 should assess intentional presentation. The proposal must explicitly state it's art and explain how it subverts the object's normal use. If it fails here, it's a hard no—no point proceeding. Step 2 checks if similar work is recognized by art institutions. This requires concrete examples like gallery exhibitions or critical writing. If both steps pass, it's a yes. If Step 1 passes but Step 2 lacks evidence, it goes to discretionary review where values come into play.

  Now, considering where this might misfire. The functional disruption test could exclude works that are subtle or integrated, like the architect-designed bus shelter. The art-world validation might overlook emerging or non-Western practices. Also, ephemeral works without documentation, like the trash-sorting performance, pose a problem since they leave no verifiable evidence. The procedure can't resolve disputes over quality or taste, as those are inherently subjective.

  Testing the three examples: 
  1. The laundry baskets—intentional but minimal disruption. No art-world precedent mentioned. Likely a discretionary case. 
  2. The bus shelter—functional and subtle, failing Step 1 despite the architect's intent. Hard no under this framework, which might frustrate the user since it's aesthetically pleasing. 
  3. The trash sorter—intentional and disruptive, but no evidence of recognition. Also discretionary due to lack of documentation. 

  The user will probably dislike the bus shelter rejection because it's well-designed and intended as art, but the procedure flags it as too functional. This highlights the framework's rigidity around disruption. 

  What the procedure can't handle: 
  - Quality judgments (it's not a merit filter) 
  - Local community value vs. art-world validation 
  - Works that challenge the definition of art itself 
  - Ephemeral pieces without documentation 

  I should emphasize that this system prioritizes efficiency over nuance, which aligns with the user's time constraints but may exclude valid but unconventional art. The discretionary review acts as a necessary pressure valve for edge cases.
answer: |-
  Here's a reusable decision procedure based on your criteria, designed for efficiency and clarity. It prioritizes objective checks first and flags subjective areas for human judgment.

  **The "Unexpected Spaces" Art Qualification Procedure**

  **Core Principle:** Art = **Intentional Functional Disruption (IFD)** + **Art-World Recognition (AWR)**.

  **Procedure Flow:**

  1.  **Question 1: Intentional Functional Disruption (IFD)**
      *   **Question:** Does the proposal *explicitly state* an artistic intent and *specifically describe* how the presentation disrupts the usual functional categorization of the materials/space/action?
      *   **Sufficient Answer:** YES - The proposal document clearly articulates: a) it is intended as art, and b) *how* the arrangement/action makes the viewer see the materials/space/action outside their normal use (e.g., laundry baskets become sculptural forms, sorting trash becomes ritual).
      *   **Insufficient Answer:** NO - The proposal lacks explicit artistic intent, lacks explanation of disruption, or only claims it's art without explaining *how* it disrupts function (e.g., "this is art" without justification).
      *   **Decision:** **HARD NO** if insufficient. Stop here. *Reason: Fails core IFD requirement.*
      *   **Next:** Proceed to Question 2 if sufficient.

  2.  **Question 2: Art-World Recognition (AWR) - Precedent**
      *   **Question:** Does the proposal provide *verifiable evidence* that at least one recognized art-world practice (gallery, museum exhibition, critical writing in reputable publication, inclusion in art school curriculum, documented public art program) has treated *similar work* (in concept, material, or method) *as art*?
      *   **Sufficient Answer:** YES - The proposal cites specific examples with verifiable references (artist names, exhibition titles/dates, publication titles/dates, course descriptions). The cited examples are demonstrably similar in their core strategy of functional disruption. (e.g., citing Mona Hatoum's domestic object installations for the baskets).
      *   **Insufficient Answer:** NO - The proposal provides no citations, cites irrelevant examples, cites only the *artist's own* prior work/showings without external recognition, or cites only non-art contexts (e.g., "people on Instagram called it art").
      *   **Decision:**
          *   **YES** if sufficient. Stop here. *Reason: Meets both IFD and AWR criteria.*
          *   **Discretionary Review** if insufficient. Flag for Chair/Board. *Reason: Passes IFD but lacks demonstrable AWR precedent. Requires value judgment on whether the work aligns sufficiently with contemporary art practices despite lack of cited precedent.*

  **Where Misfires/Weirdness Happens:**

  1.  **Overly Literal Disruption:** May reject subtle, integrated, or context-specific works that powerfully disrupt function conceptually but not obviously physically (e.g., a perfectly functional shelter *critiquing* shelter design might fail IFD).
  2.  **Art-World Bias:** Validates only existing institutionalized practices. Radical, new, non-Western, or community-based art forms without established "recognition" might struggle with AWR.
  3.  **The "Is it *Good* Art?" Problem:** This procedure *only* checks "Is it plausibly art?" not quality, effectiveness, or appropriateness. Terrible but conceptually valid art passes. Great community projects failing IFD/AWR fail.
  4.  **Documentation Reliance:** Favors work that fits easily into gallery/museum/docs. Ephemeral, experiential, or process-based work suffers if not well-documented by the art world.
  5.  **The "Clever Plaque" Problem:** Adding a plaque claiming "this is art" might satisfy weak IFD but still fail AWR if unsupported.

  **What This Procedure CANNOT Settle (Regardless of Care):**

  1.  **Quality or Merit:** Is it *good*, *interesting*, or *valuable* art? (Pure values judgment).
  2.  **Appropriateness:** Is it suitable *for this specific space/grant/community*? (Contextual values judgment).
  3.  **Radical Innovation:** Does genuinely *new* art (with no clear precedent yet recognized) qualify? (Requires leap of faith/value judgment beyond the AWR check).
  4.  **Community Value vs. Art-World Value:** Should community recognition/practice *replace* AWR if lacking? (Procedural/values conflict).
  5.  **Deep Philosophical Disputes:** Does it resolve "But is it *really* art?" for edge cases? No, it provides a *practical operational definition*, not a universal truth.

  ---

  **Applying the Procedure to the Proposals:**

  **Proposal 1: Stack of clean laundry baskets with plaque "installation: baskets" in a laundromat.**

  1.  **IFD Check:**
      *   Explicit Intent? Yes ("installation" plaque).
      *   Disruption Explained? Minimally. Plaque implies artistic intent, but proposal likely lacks explanation of *how* it disrupts. The baskets are stacked, but stacking is a normal functional state for *unused* baskets. Where's the disruption?
      *   **Sufficient?** **BORDERLINE/Probably NO.** Stacking unused baskets isn't inherently disruptive of their function. The plaque alone is weak justification. *Likely HARD NO here.* If the proposal *explained* how the stacking forces seeing baskets as sculptural forms or comments on laundry labor, it *might* pass IFD.
      *   **Decision if NO:** **HARD NO.** Stop.
      *   *(If borderline, proceed hypothetically)*
  2.  **AWR Check (if passed IFD):**
      *   Evidence Cited? Unlikely specified. Stacking mundane objects (like Donald Judd's stacks, Felix Gonzalez-Torres' piles) *is* a recognized art practice.
      *   **Sufficient?** **YES (if precedent cited and IFD passed).** But without citation in the proposal, it might fail AWR and go to Discretionary Review.

  **Verdict:** **Likely HARD NO at Step 1 (IFD)** due to weak explanation of disruption. If passed IFD and cited precedent, **YES**. If passed IFD but no citation, **Discretionary Review.**

  **Proposal 2: Beautiful, functional bus shelter by an architect claiming public art intent.**

  1.  **IFD Check:**
      *   Explicit Intent? Yes (architect's statement).
      *   Disruption Explained? **NO.** It's described as "fully functional" and looks like other shelters except color. Its beauty doesn't disrupt its *functional categorization* as a bus shelter. It *excels* at its function, doesn't break it. It's architecture/design, not art under your IFD definition.
      *   **Sufficient?** **NO.**
      *   **Decision:** **HARD NO.** Stop.

  **Verdict:** **HARD NO.** Fails Step 1 (IFD). It doesn't break the functional category; it fulfills it well. (This is the one you'll probably hate, as it's "artistic" but doesn't meet your functional disruption test).

  **Proposal 3: Silent trash sorting in a park, no audience/record, performer insists it was art.**

  1.  **IFD Check:**
      *   Explicit Intent? Yes (performer's insistence).
      *   Disruption Explained? Likely. Sorting trash as a deliberate, non-utilitarian action *is* a disruption of its usual function (waste management chore). It frames it as ritual, performance, or critique.
      *   **Sufficient?** **YES.**
  2.  **AWR Check:**
      *   Evidence Cited? Unlikely specific. Performance art (Marina Abramović, Tehching Hsieh, Mierle Laderman Ukeles' maintenance work) involving mundane/repetitive actions, endurance, and questioning function *is* a highly recognized art practice. *However*, the complete lack of documentation/audience is extreme.
      *   **Sufficient?** **NO (due to lack of documentation AND likely lack of specific citation).** While precedent exists, the proposal likely provides no citation linking *this undocumented action* to that precedent. The complete lack of any record makes verification and linking to art-world recognition impossible *based on the proposal alone*.
      *   **Decision:** **Discretionary Review.** Passes IFD, fails AWR due to lack of cited evidence/unique documentation challenge.

  **Verdict:** **Discretionary Review.** The board must decide if the described action conceptually aligns strongly enough with performance art traditions *despite* the lack of documentation and specific precedent citation in the proposal. The ephemerality pushes it into the values zone.

  **Key Takeaway:** This procedure provides a fast, defensible filter focusing on *your specific definition* of art (IFD + AWR). It will efficiently filter out non-starters (failing IFD) and clear strong cases (passing IFD + AWR). The **Discretionary Review** bucket (passes IFD, fails AWR) is where your board's judgment on artistic merit and alignment with contemporary practice, beyond strict precedent, becomes essential. Be prepared for arguments about quality, community value, and radical innovation in that bucket – the procedure explicitly excludes settling those.
