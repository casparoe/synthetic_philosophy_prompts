prompt: |-
  hey, i'm trying to nail down what a decent formal measure of 'low impact' for an AI actually has to acheive, and i'm stuck between proposals that smuggle in a full value spec and ones so conservative the agent can't do anything useful. can you write the full desiderata? i mean the real spec: which cases it must handle right (like not penalising breathing, but catching hidden catastrophic shifts that look like noise), which distinctions it can't collapse (intended vs side effect, local vs global, reversable vs permanent), and whether some pair is actually impossible together if we refuse to specify values completely. also i've been playing with this notion of a 'shadow baseline' — comparing the world against a counterfactual with natural stochasic drift included but the agent's planning loop excluded — should that be a hard requirement or just one contender? please do this in british english, casual is fine, maybe with a typo or two left in since i'm writing quick. flag any jointly unsatisfiable subset, that's the part i want most. briefly, how do reversability budgets, counterfactual divergence measures, and entropy-capped influence do against your list?
reasoning: |-
