answer: |-
  I sought a flame to banish ancient wrong,
  A shield against the darkness closing near,
  Where justice rang in every comrade's song,
  And fellowship dissolved all trace of fear.
  The banner's shade felt warm, a welcome hold,
  My voice grew strong within the chanting crowd,
  Their certainties, a story to be told,
  My private doubts no longer cried aloud.
  But then I felt my soul's own weight descend,
  That easy chant became a heavy chain,
  Where once was choice, a force began to bend
  My thoughts toward the measure of the train.
  True freedom dies where massed opinions shout;
  Attention's free air lost, I breathe in chains throughout.
