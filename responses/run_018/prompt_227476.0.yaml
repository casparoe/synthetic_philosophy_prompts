  Act as an expert philosopher of modality helping a philosophy PhD student prepare a dissertation prospectus. Think carefully, begin with a brief brainstorm, and then formulate the desiderata for an adequate theory of when conceivability is evidence for metaphysical possibility.

  The specification should identify: the cases such a theory must classify correctly, including philosophical zombies, water-like substances with different underlying chemistry, apparently possible but actually inconsistent scenarios, and necessary truths that someone can seemingly conceive to be false; the distinctions it must preserve among imagining, coherently describing, understanding, and genuinely perceiving a possibility; the epistemic standards under which conceivability becomes evidence; and whether the theory supports modal conclusions directly or only after ruling out empirical and conceptual defeaters. Give the motivating consideration behind each desideratum, distinguish non-negotiable requirements from assumptions characteristic of particular camps, and flag any requirements that may be jointly unsatisfiable—especially broad modal coverage, epistemic safety, and applicability by finite thinkers. Conclude by briefly assessing how a two-dimensional account, an imagination-based account, and a conservative modal-rationalist account fare against your list. Do not provide citations, a bibliography, or a reading list.
