prompt: |-
  hey, i'm trying to wrap my head around why promises bind people — not legally, but philosophically/morally — and i keep thinking about it in distributed-systems terms: state transitions, consensus finality, rollback conditions, smart contracts, byzantine faults, that kind of thing.

  can you restate the three main philosophical accounts — expectation-based, practice/norm-based, and the authority/recognition view — using that vocabulary? for each one, tell me what maps cleanly onto protocols (like, is expectation just a node anticipating a future state change?), what has to be distorted to fit, and what's left with no analog at all. then give me the residue report: is the leftover stuff pointing to a real gap in my framework (like normative force that protocols don't capture), or is it just philosophical fog?

  please keep the translation honest — don't smuggle in distributed-systems assumptions and call them translations. also, just to push the analogy: treat promise-breaking as a kind of 'fork' in social state. does that illuminate whether the breach creates a persistent bad branch that can't be merged back, or does it break the analogy?

  and please seperate what's settled in the philosophical debate from what's genuinely contested among people who actually work on this. don't present one view as the consensus.
reasoning: |-
  We are translating three philosophical accounts of promissory obligation into distributed systems terminology. The three accounts are:
  1. Expectation-based (e.g., Scanlon): Promises create obligations because they induce reliance and expectations in the promisee.
  2. Practice/Norm-based (e.g., Rawls, Searle): Promises are binding due to social practices and norms that give them force.
  3. Authority/Recognition view (e.g., Shiffrin): Promises derive their force from the promisor inviting the promisee to trust them and thereby recognizing the promisee's authority to hold them accountable.

  We'll map each to distributed systems concepts (state transitions, consensus, rollback, smart contracts, Byzantine faults) and then evaluate the mapping by noting what maps cleanly, what must be distorted, and what has no analog. Then we'll do a residue report.

  Additionally, we'll consider promise-breaking as a "fork" in social state.

  **Important note**: We must not smuggle in distributed systems assumptions. We are using the analogy to illuminate, not to reduce. Also, we must indicate what is settled and what is contested in the philosophical debate.

  ---

  ### 1. Expectation-Based View (e.g., T.M. Scanlon)

  **Philosophical core**: When you make a promise, you intentionally create an expectation in the promisee that you will perform a certain action. Breaking the promise would harm the promisee by disappointing that expectation. The obligation stems from the moral principle against causing such harm.

  **Distributed Systems Translation**:
  - **Clean mappings**:
    - **Expectation as state anticipation**: The promisee (node A) updates its local state to anticipate a future state change (the promised action) from the promisor (node B). This is like a node receiving a pre-announcement of a transaction and updating its expected state accordingly.
    - **Promise-breaking as a Byzantine fault**: Node B (promisor) broadcasts an intention (a signed message) to perform an action, leading node A to update its state. If node B then acts contrary to that message, it is a Byzantine fault (malicious or faulty behavior). The harm is the inconsistency introduced in node A's state, which may have led to further state changes (reliance) that now are invalid.
    - **Rollback conditions**: If the promise is broken, node A must roll back any state changes that relied on the promise. This is costly and may cause a cascade of rollbacks in the network (social context).

  - **Distortions**:
    - **Harm as State Inconsistency**: In distributed systems, inconsistency is a technical problem. In the expectation view, the harm is moral (disappointment, loss of reliance). The analogy reduces moral harm to a system fault, which is a distortion.
    - **No built-in penalty**: In distributed systems, Byzantine faults are handled by consensus algorithms (e.g., excluding faulty nodes). But in promises, the "harm" is not just about system integrity; it's about the promisee's feelings and plans. The system analogy doesn't capture the moral weight.

  - **No analog**:
    - The *moral principle* against causing harm by inducing reliance has no direct analog. Distributed systems protocols are amoral; they don't have a concept of "harm" as a moral wrong.
    - The *intentionality* of the promise: In distributed systems, messages are just data. The promisor's intention to be bound is not represented.

  **Residue report**: The leftover is the moral dimension of harm and the intentional creation of expectation. This points to a gap: protocols handle consistency, but they don't account for the normative force that arises from the moral relationship between two agents.

  ---

  ### 2. Practice/Norm-Based View (e.g., Rawls, Searle)

  **Philosophical core**: Promises are binding because they are part of a social practice. When you make a promise, you invoke a practice that has rules (e.g., "breaking promises is wrong"), and you gain the benefits of the practice (e.g., being trusted) only if you follow the rules.

  **Distributed Systems Translation**:
  - **Clean mappings**:
    - **Practice as protocol**: The social practice is like a protocol (e.g., Paxos, Raft) that defines the rules for making and keeping promises. Nodes (people) join the network and must follow the protocol to participate.
    - **Norm enforcement as consensus**: When a promise is broken, the social group enforces the norm by consensus (e.g., gossip, reputation systems). This is similar to nodes in a network agreeing to mark a faulty node as untrustworthy.
    - **Smart contracts**: The promise can be seen as a simple smart contract: if a promise is made, then the promisor must perform, or else penalties (social sanctions) are automatically enforced by the protocol.

  - **Distortions**:
    - **The practice is not always explicit**: Social practices are often informal and implicit, whereas protocols are explicit and formal. Mapping the fluidity of social norms to rigid protocols is a distortion.
    - **No central authority**: In distributed systems, protocols are designed and agreed upon. Social practices evolve organically and may have no clear "specification". The analogy forces a formalization that doesn't exist.

  - **No analog**:
    - The *constitutive rules* of the practice (Searle): The idea that the practice "creates" the obligation by virtue of the rules (like in a game) has no direct analog. Protocols are tools for achieving goals, but they don't create new moral facts.
    - The *benefit of participation*: The moral obligation to uphold the practice because you benefit from it (Rawls' fairness) isn't captured. Nodes in a system don't have a moral duty to play fair; they are programmed.

  **Residue report**: The leftover is the moral obligation to uphold the practice because it is socially beneficial and fair. This gap highlights that protocols are amoral mechanisms, while the practice view relies on social goods and fairness.

  ---

  ### 3. Authority/Recognition View (e.g., Shiffrin)

  **Philosophical core**: By making a promise, the promisor invites the promisee to trust them and thereby grants the promisee a special authority to hold the promisor accountable. The obligation comes from the promisor's own act of recognizing the promisee's standing to demand performance.

  **Distributed Systems Translation**:
  - **Clean mappings**:
    - **Authority as delegated control**: The promisor (node B) delegates a form of control over its future actions to the promisee (node A). This is like giving node A a token that allows it to trigger a penalty or enforce a state change if node B doesn't perform.
    - **Recognition as key exchange**: The act of promising is like a cryptographic handshake where node B sends a signed message that grants node A the right to challenge non-performance. This sets up an accountability channel.
    - **Smart contracts again**: The promise can be modeled as a smart contract where the promisor locks in a commitment, and the promisee holds the key to release it or claim a penalty.

  - **Distortions**:
    - **Moral authority vs. technical control**: The authority granted is moral and relational, while in distributed systems, it's about access rights (e.g., private keys). The analogy reduces moral authority to a technical permission.
    - **No analog for the relational aspect**: The trust and recognition are deeply interpersonal. In distributed systems, nodes are interchangeable and the "trust" is cryptographic or based on reputation scores.

  - **No analog**:
    - The *moral recognition* of the promisee as a person with standing to hold accountable. This is a normative act that isn't just about data or permissions.
    - The idea that the promisor *binds themselves* by their own will. In distributed systems, nodes are bound by code, not by their own volition.

  **Residue report**: The leftover is the moral act of self-binding and the interpersonal recognition. This gap points to a core difference: protocols enforce from without, while the authority view sees the obligation as self-imposed and relational.

  ---

  ### Promise-Breaking as a Fork

  - **Analogy**: When a promise is broken, it creates a fork in the social state. The promisor and promisee now have divergent views of the world:
    - The promisee's state expected the promise to be fulfilled.
    - The promisor's state reflects a different reality (they did not perform).
  - **Does it illuminate?** 
    - **Persistent bad branch**: The breach creates a branch that cannot be merged back without a rollback (apology, compensation) or a hard fork (social intervention). However, unlike in distributed systems, social forks can sometimes be resolved without consensus (e.g., forgiveness).
    - **Breaking the analogy?** The analogy breaks because:
      - Social state isn't globally consistent. People can agree to disagree or have private reconciliations.
      - The moral damage (betrayal, loss of trust) is not just a technical inconsistency; it's a rupture in the relationship that may persist even if the state is "fixed" by compensation.

  ---

  ### Settled vs. Contested in Philosophy

  - **Settled**:
    - Most philosophers agree that promises create *some* kind of moral obligation (barring special circumstances).
    - There is broad agreement that promises involve an intentional communication that generates expectations or invokes a practice.

  - **Contested**:
    - **The source of obligation**: 
      - Expectation vs. practice vs. authority views remain live debates. There is no consensus.
    - **The role of the promisee**:
      - Is the promisee's acceptance necessary? (Most say no, but some contest.)
    - **Can promises be entirely self-regarding?** (e.g., promising to oneself) — contested.
    - **How strict is the obligation?** Is it absolute or can it be overridden by consequences? (Consequentialists vs. deontologists)

  ---

  **Conclusion**: The distributed systems analogy illuminates the structural aspects (state changes, faults, consensus) but leaves a residue of normativity, intentionality, and relational morality. This points to a real gap: protocols are descriptive tools for coordination, while promises are normative practices embedded in human relationships. The leftover isn't just fog; it's the core of what makes promises morally binding.
answer: |-
  ### Philosophical Accounts of Promissory Obligation in Distributed-Systems Terms  
  I'll map the three main philosophical views—**expectation-based**, **practice/norm-based**, and **authority/recognition**—onto distributed-systems (DS) concepts, staying true to each theory's core arguments. I'll highlight clean mappings, necessary distortions, and unmappable residues. Then, I'll address promise-breaking as a "social fork" and end with the settled/contested landscape.  

  ---

  ### **1. Expectation-Based View** (e.g., T.M. Scanlon)  
  **Core Philosophy**: Promises bind because they create reasonable expectations in the promisee. Breaking a promise harms the promisee by undermining reliance.  

  **DS Translation**:  
  - **Clean Mappings**:  
    - **Expectation = Anticipated State Transition**: The promisee acts like a node that updates its local state (e.g., plans, resources) based on a broadcasted intent (the promise). For example:  
      - *Promise*: Node A (promisor) sends a signed message: "I will transfer asset X to Node B at time T."  
      - *Reliance*: Node B (promisee) locks dependent transactions (e.g., schedules a sale of X) based on this message.  
    - **Harm from Broken Promise = Unresolved Dependency**: If Node A fails, Node B faces a cascade of rollbacks (e.g., invalid transactions). This resembles a **Byzantine fault**—Node A acted inconsistently with its broadcasted state.  
    
  - **Distortions Required**:  
    - **Moral Harm ≠ Technical Inconsistency**: DS treats broken promises as faulty state transitions (e.g., a node diverging from consensus). But Scanlon's "harm" is *moral* (e.g., betraying trust), not just computational. DS has no analog for the *experience* of disappointment.  
    - **Intentionality**: DS nodes lack "intent." Mapping requires anthropomorphizing messages (e.g., a "promise" message implies a moral commitment, not just data).  
    
  - **No Analog**:  
    - **The Moral Principle Against Harm**: Scanlon grounds obligation in a duty not to harm others via induced reliance. DS protocols have no intrinsic "duty"; they resolve faults via redundancy or slashing, not moral accountability.  
    
  **Residue Report**:  
  - **Gap**: The residue—**moral harm**—points to a real limitation. DS protocols optimize for consistency, not ethical relationships. Trust violations in humans create relational damage (e.g., eroded goodwill) that isn't captured by state-repair mechanisms like rollbacks.  

  ---

  ### **2. Practice/Norm-Based View** (e.g., Rawls, Searle)  
  **Core Philosophy**: Promises bind because they participate in a social practice. The practice’s rules (e.g., "promises must be kept") create obligations when invoked.  

  **DS Translation**:  
  - **Clean Mappings**:  
    - **Practice = Consensus Protocol**: The social practice is like a **consensus algorithm** (e.g., PBFT). Nodes (people) follow predefined rules to maintain "social state" coherence.  
      - *Promise-making* = Proposing a state change (e.g., "I owe B $10").  
      - *Norm enforcement* = Validators (society) impose penalties (e.g., reputation loss) for non-compliance.  
    - **Rollback Conditions**: Breaking a promise forces a social "rollback"—apologies, compensation, or sanctions to restore system equilibrium.  
    - **Smart Contracts**: Norms act like immutable rules: "IF promise_made ∧ NOT fulfilled → trigger penalty."  
    
  - **Distortions Required**:  
    - **Fluid Norms vs. Rigid Protocols**: Social practices evolve organically; DS protocols are static. Mapping norms to code requires ignoring their interpretive flexibility (e.g., "reasonable effort" clauses).  
    - **No Central Authority**: DS consensus often assumes validators; social norms lack centralized enforcement. This forces norms into a leader-based model (e.g., Raft) that doesn’t fit.  
    
  - **No Analog**:  
    - **Constitutive Rules**: Searle’s "X counts as Y in context C" (e.g., "these words count as a promise") creates obligations *by declaration*. DS has no equivalent; messages only *describe* state, not *create* moral facts.  
    - **Fair Play**: Rawls argues you owe compliance because you benefit from the practice. DS nodes don’t "benefit"—they execute code.  
    
  **Residue Report**:  
  - **Gap**: The residue—**normative force from collective intentionality**—is philosophically real. DS protocols lack "shared meaning" (e.g., why *should* nodes care about consensus?). The practice view’s obligation emerges from human intersubjectivity, not cryptographic security.  

  ---

  ### **3. Authority/Recognition View** (e.g., Shiffrin)  
  **Core Philosophy**: Promises bind because the promisor invites the promisee’s trust, granting them authority to demand fulfillment. The promisor morally recognizes the promisee’s standing.  

  **DS Translation**:  
  - **Clean Mappings**:  
    - **Authority Delegation = Permissioned Ledger**: The promisor (Node A) grants Node B a "right" to enforce performance, like a private key controlling a smart contract.  
      - *Recognition*: Node A digitally signs a message granting Node B challenge rights.  
    - **Byzantine Faults as Betrayal**: If Node A defaults, it’s a malicious node—but specifically *toward Node B* (a targeted fault).  
    - **Finality**: Successful promises achieve "social finality"—the action is irreversible and trusted.  
    
  - **Distortions Required**:  
    - **Moral Recognition ≠ Cryptographic Signature**: DS signatures verify authenticity, not moral commitment. Mapping requires conflating cryptographic truth with normative authority.  
    - **Relational Specificity**: Shiffrin’s "recognition" is interpersonal. DS treats nodes as interchangeable; translating this forces identity-based permissions (e.g., Node B’s ID must be whitelisted).  
    
  - **No Analog**:  
    - **Moral Invitation**: The promisor *invites* trust, creating a duty to avoid "moral injury." DS has no concept of invitation—messages are commands or data.  
    - **Autonomy**: Authority stems from the promisor’s free act of self-binding. DS nodes are deterministic; no room for "self-binding" beyond code execution.  
    
  **Residue Report**:  
  - **Gap**: The residue—**moral autonomy and relational accountability**—is irreducible. DS can model enforcement (e.g., slashing) but not why Node A *owes it specifically to Node B*. This view hinges on human dignity, absent in DS.  

  ---  

  ### **Promise-Breaking as a "Social Fork"**  
  - **Analogy**: A broken promise forks "social state":  
    - *Pre-breach*: Shared ledger (A and B agree: "X will happen").  
    - *Post-breach*: Two branches:  
      - Branch 1 (Promisee): "A owes me X + compensation."  
      - Branch 2 (Promisor): "I am not obligated (or only partially)."  
  - **Does It Illuminate?**  
    - **Persistent Fork**: Yes—like a blockchain fork, reconciliation requires consensus (e.g., apology = "merge" proposal). But unlike DS, social forks can linger without resolution (e.g., grudges).  
    - **Breaks the Analogy**:  
      - DS forks are technical (resolved by code); social forks are *normative* (e.g., "Should A be forgiven?" requires moral reasoning).  
      - DS assumes nodes want consensus; humans may *reject* merging (e.g., irreparable trust loss).  
      - **Verdict**: The fork analogy clarifies the *mechanics* of breach but not the *normative stakes* (e.g., why merging matters morally).  

  ---  

  ### **Settled vs. Contested in Philosophy**  
  **Settled**:  
  - Promises generate *some* obligation (all three views agree).  
  - Promises involve communication that alters expectations/entitlements (minimal consensus).  

  **Contested**:  
  1. **Source of Obligation**:  
     - Expectation: Harm avoidance (Scanlon) vs. Practice: Rule-following (Rawls) vs. Authority: Recognition (Shiffrin).  
     - *Active debate*: No dominant view; each has vocal proponents.  
    
  2. **Role of the Promisee**:  
     - Must the promisee *rely* for obligation to exist? (Scanlon: yes; Shiffrin: no).  
    
  3. **Can Practices Be Non-Normative?**:  
     - Can a promise exist without a social practice? (Searle: no; Shiffrin: yes).  

  **Key Takeaway**: None of these views is canonical. The debate centers on whether promissory obligation stems from *consequences* (expectation), *conventions* (practice), or *moral relations* (authority). DS analogies help model mechanics but stumble on normativity—this isn't fog but the core of why promises bind humans, not nodes.
