prompt: |-
  As a physicist recently turned to philosophy of mind, I have been reading the thesis—associated with Douglas Hofstadter and Emmanuel Sander—that analogy-making is not a peripheral cognitive skill but the very core of cognition, underlying everything from basic perception to mathematical abstraction. Before I evaluate any particular theory that takes this claim seriously, I want the full specification of what such a theory must be able to deliver. Write the desiderata: the phenomena it must cover, the distinctions it must preserve, the empirical and formal constraints it must respect, the boundary conditions it must specify, and which of these requirements are genuinely non-negotiable versus camp-specific preferences.

  Specifically, include the following, with the motivating case or constraint behind each item:

  The range of phenomena: linguistic metaphor and perceptual categorization, of course, but also scientific model-building—such as the nineteenth-century hydraulic and electrical analogies used to understand fluid dynamics before the Navier-Stokes formalism was available, analogies that were later discarded once the mathematics was fixed rather than retained as literal descriptions—and cross-domain mathematical reasoning where source and target share no surface features.

  The conceptual distinctions that must not collapse: between productive analogies that generate genuinely new inferences and dead metaphors that are merely lexicalized; between structural alignment and superficial feature matching; between analogies that guide scientific discovery and those that serve only pedagogical illustration; and between analogical mapping that requires explicit representation of relational structures and mapping that can emerge from distributed pattern completion.

  The empirical and computational constraints: consistency with evidence that analogical reasoning is effortful and context-sensitive rather than automatic; compatibility with limited but real analogical capacities in non-human animals and young children; and consistency with the observation that distributed computational systems can approximate analogical transfer without explicit symbolic rules, even though they also exhibit characteristic failure modes unlike those in human cognition.

  The boundary conditions: the theory should specify precisely when analogy fails or is inappropriate, and whether it predicts the specific patterns of human failure—such as over-extension of surface similarities or resistance to distant structural mappings—rather than treating all errors as noise.

  Then identify whether any subset of these desiderata is jointly unsatisfiable, particularly any tension between requiring analogy to be truly fundamental (present in basic perception) and requiring it to be representationally explicit enough to explain disciplined scientific discovery. Indicate which single requirement does the most work in excluding rival theories, and flag any pair you suspect cannot be jointly satisfied.

  Finally, briefly score how three broad approaches fare against your list: a structural-alignment account in the tradition of Gentner, Hofstadter's own high-level perception view, and a modern distributed-computation account that treats analogy as emergent statistical pattern completion. Keep the weight on the criteria and their justification rather than on the scoring, since the criteria themselves are the deliverable.
reasoning: |-
  We are constructing a set of desiderata for a theory that places analogy-making at the core of cognition. The theory must cover a broad range of phenomena, preserve key distinctions, respect empirical and computational constraints, and specify boundary conditions. We also note which requirements are non-negotiable and which might be camp-specific. Additionally, we identify potential tensions and evaluate three approaches.

  ## Desiderata for an Analogy-Centric Theory of Cognition

  ### I. Range of Phenomena
  The theory must account for:
  1. **Perceptual categorization**: Basic recognition of objects and events (e.g., seeing a novel object as a "chair" based on functional and structural similarities to known chairs). *Motivation*: If analogy is fundamental, it must underpin even the simplest acts of perception.
  2. **Linguistic metaphor**: Both novel (e.g., "The mind is a river") and conventionalized (e.g., "grasping an idea") metaphors. *Motivation*: Metaphor is a clear case of cross-domain mapping and is pervasive in language.
  3. **Scientific model-building**: Historical cases where analogies were used as provisional models (e.g., the hydraulic analogy for electricity or the billiard ball model for gases) and then discarded when more precise formalisms emerged. *Motivation*: Analogies drive discovery but are not necessarily retained as literal truths.
  4. **Cross-domain mathematical reasoning**: Mappings between domains with no surface similarity (e.g., between group theory and geometry). *Motivation*: High-level abstraction requires structure-mapping without superficial cues.

  ### II. Conceptual Distinctions That Must Not Collapse
  The theory must preserve:
  1. **Productive analogies vs. dead metaphors**: Productive analogies generate new inferences (e.g., using the solar system as an analogy for the atom to predict electron orbits) while dead metaphors are lexicalized and no longer active (e.g., "leg of a table"). *Motivation*: A theory that treats both equally cannot explain creativity.
  2. **Structural alignment vs. superficial feature matching**: Structural alignment focuses on relational systems (e.g., mapping the predator-prey relationship to a host-parasite relationship) while superficial matching relies on shared features (e.g., both are "animals"). *Motivation*: Superficial matches lead to false inferences; structural alignment is key to validity.
  3. **Discovery vs. pedagogical analogies**: Analogies that generate new scientific hypotheses (e.g., Kekulé's snake biting its tail leading to the benzene ring) vs. those used only for teaching (e.g., water flow for electricity in textbooks). *Motivation*: Only the former require a generative mechanism that creates new knowledge.
  4. **Explicit symbolic representation vs. distributed pattern completion**: Whether the mapping requires explicit representation of relations (as in symbolic AI) or can emerge from distributed patterns (as in connectionism). *Motivation*: This distinction addresses the representational format debate in cognitive science.

  ### III. Empirical and Computational Constraints
  The theory must be consistent with:
  1. **Effortful and context-sensitive nature**: Analogical reasoning is not always automatic; it requires cognitive effort and is influenced by context (e.g., Gick and Holyoak's radiation problem with multiple analogies). *Motivation*: This distinguishes analogy from reflexive processes.
  2. **Non-human and early childhood capacities**: Evidence of analogical reasoning in animals (e.g., chimpanzees matching relations) and young children (e.g., in simple proportional analogies). *Motivation*: The core mechanism must be primitive enough to appear early and in other species.
  3. **Distributed systems without explicit rules**: Neural networks can approximate analogical transfer (e.g., in vector space models of word analogies) but also exhibit failure modes (e.g., sensitivity to distractors) that differ from human errors. *Motivation*: The theory must account for both the successes and limitations of sub-symbolic models.

  ### IV. Boundary Conditions
  The theory must specify:
  1. **When analogy fails**: Conditions under which analogical mapping breaks down (e.g., when relational structure is too abstract or when surface features are too misleading). *Motivation*: A complete theory must predict failure cases.
  2. **Patterns of human failure**: Specific error types (e.g., over-reliance on surface features in novices, or resistance to distant mappings even when structurally sound) must be predicted, not treated as random noise. *Motivation*: This is a key test of psychological plausibility.

  ### V. Non-Negotiable vs. Camp-Specific
  - **Non-Negotiable**:
    - Coverage of basic perception and high-level abstraction (I.1, I.4).
    - Preservation of the distinction between structural alignment and superficial matching (II.2).
    - Consistency with the effortful nature of analogy (III.1) and with non-human/child capacities (III.2).
    - Specification of boundary conditions and failure patterns (IV.1, IV.2).
  - **Camp-Specific**:
    - The requirement for explicit symbolic representation (II.4) might be specific to classical cognitive science, while distributed approaches reject it.
    - The emphasis on scientific discovery (II.3) might be weighted differently by theories focusing on everyday cognition.

  ### VI. Potential Tensions and Joint Unsatisfiability
  - **Tension 1: Fundamentality vs. Explicitness** - The requirement that analogy be fundamental (present in perception) and the requirement that it be explicit enough for scientific discovery may conflict. Perception might be handled by implicit, distributed processes, while scientific analogy seems to require explicit relational structures. *Joint unsatisfiability?*: Possibly, if a single mechanism cannot span both.
  - **Tension 2: Effortfulness vs. Ubiquity** - If analogy is core and ubiquitous, why is it effortful? This tension might be resolved by positing automatic implicit analogies and effortful explicit ones, but the theory must specify the relationship.
  - **Most Exclusionary Requirement**: The requirement to cover both perceptual categorization and cross-domain mathematical reasoning (I.1 and I.4) is particularly challenging for theories that are specialized for one or the other.
  - **Suspect Pair**: The requirement for distributed pattern completion (III.3) and the requirement for explicit structural alignment (II.2) might be in tension because distributed systems often struggle to capture systematic relational structures.

  ### VII. Scoring Three Approaches
  1. **Structural-Alignment (Gentner)**:
     - *Phenomena*: Strong on linguistic metaphor and scientific models (I.2, I.3) but weaker on basic perception (I.1) and distributed mathematical abstraction (I.4).
     - *Distinctions*: Excellent on structural vs. superficial (II.2) and discovery vs. pedagogy (II.3). Assumes explicit representation (II.4).
     - *Constraints*: Consistent with effortfulness (III.1) but less so with non-human capacities (III.2) and distributed computation (III.3).
     - *Boundary Conditions*: Predicts over-extension of surface features (IV.2) but may not naturally handle perception.
     - *Tension*: Struggles with fundamentality in perception due to its explicit representational demands.

  2. **High-Level Perception (Hofstadter)**:
     - *Phenomena*: Covers basic perception and abstraction (I.1, I.4) via fluid concepts. Strong on scientific model-building and cross-domain math (I.3, I.4).
     - *Distinctions*: Blurs explicit vs. distributed (II.4) but preserves productivity (II.1). Less clear on discovery vs. pedagogy (II.3).
     - *Constraints*: Acknowledges effortfulness (III.1) and non-human capacities (III.2). Ambiguous on distributed computation (III.3).
     - *Boundary Conditions*: Addresses failure as slippage in high-level perception (IV.1, IV.2).
     - *Tension*: May struggle with the requirement for explicit structural alignment in scientific discovery.

  3. **Distributed-Computation (Emergent Pattern Completion)**:
     - *Phenomena*: Excels at perceptual categorization (I.1) and linguistic metaphor (I.2). Weak on scientific models (I.3) and cross-domain math (I.4) due to lack of systematicity.
     - *Distinctions*: Struggles to distinguish structural alignment from feature matching (II.2) and may collapse productive vs. dead metaphors (II.1). Assumes distributed patterns (II.4).
     - *Constraints*: Matches non-human/child capacities (III.2) and distributed computation (III.3). Less consistent with effortfulness (III.1) as neural nets often process analogies in a feedforward manner.
     - *Boundary Conditions*: Predicts failure modes like sensitivity to noise but not human-like over-extension (IV.2).
     - *Tension*: Fails to satisfy the requirement for disciplined structural alignment in scientific reasoning.

  ## Summary of Non-Negotiable Core
  The theory must explain how analogy operates from perception to abstraction while preserving the structure-superficiality distinction and accounting for both the effortful nature of complex analogies and the existence of analogical capacities in non-humans. The most challenging requirement is the joint coverage of perception (implicit, fast) and scientific discovery (explicit, effortful). The structural-alignment approach best handles disciplined mapping but struggles with fundamentality; distributed computation handles perception but not abstraction; Hofstadter's view bridges them but may lack formal rigor.
answer: |-
  Below is a comprehensive specification of desiderata for a theory positing analogy-making as the core of cognition, structured by your requested categories. Each item includes the **phenomenon/distinction/constraint**, its **motivating case or rationale**, and an assessment of **non-negotiability** (universal vs. camp-specific). I then identify tensions, critical requirements, and score three major approaches. The criteria emphasize *what the theory must explain*, grounded in empirical, computational, and philosophical considerations.

  ---

  ### **I. Phenomena the Theory Must Cover**  
  *Scope: From basic perception to abstract reasoning, with historical and cross-domain cases.*

  1. **Perceptual categorization**  
     - *Motivation*: If analogy is fundamental, it must explain how we recognize novel instances (e.g., identifying a new shape as a "chair" by analogy to stored exemplars). Basic perception cannot be treated as passive feature detection.  
     - *Non-negotiable*: Yes. Failure here contradicts the "core cognition" claim.  

  2. **Linguistic metaphor**  
     - *Motivation*: Metaphors (e.g., "time is a river") are overt analogies mapping relations across domains. The theory must handle conventionalized ("dead") metaphors and novel poetic constructions.  
     - *Non-negotiable*: Yes. Ubiquity in language demands coverage.  

  3. **Scientific model-building**  
     - *Motivation*: Historical cases like the *hydraulic analogy* for electricity, which guided pre-Maxwellian theory but was discarded once formalisms emerged. The theory must explain why such analogies are heuristically useful yet ontologically disposable.  
     - *Non-negotiable*: Yes. Accounts for how analogy drives discovery without reifying source domains.  

  4. **Cross-domain mathematical abstraction**  
     - *Motivation*: Cases where source/target share no surface features (e.g., analogies between topology and graph theory). The theory must enable structure-based mapping without perceptual or semantic anchors.  
     - *Non-negotiable*: Yes. Tests whether analogy underlies formal reasoning.  

  ---

  ### **II. Conceptual Distinctions the Theory Must Preserve**  
  *Avoid conflation: Key splits in functionality and representation.*

  1. **Productive analogies vs. dead metaphors**  
     - *Motivation*: Productive analogies (e.g., Rutherford’s solar-system model of the atom) generate new inferences; dead metaphors (e.g., "table leg") are lexicalized and inferentially inert. Collapsing these obscures how novelty emerges.  
     - *Non-negotiable*: Yes. Central to creativity vs. rote recall.  

  2. **Structural alignment vs. superficial feature matching**  
     - *Motivation*: Humans favor relational structure (e.g., mapping "heat flow" to "fluid flow" for conservation principles) over superficial matches (e.g., "virus is like a snake" due to shape). The theory must explain how structural constraints (e.g., systematicity) avoid false inferences.  
     - *Non-negotiable*: Yes. A core tenet of analogy research (Gentner’s systematicity principle).  

  3. **Discovery vs. pedagogical analogies**  
     - *Motivation*: Analogies in discovery (e.g., Darwin’s Malthusian insight on natural selection) involve generative inference; pedagogical analogies (e.g., balloons to explain spacetime curvature) illustrate known concepts. Collapsing these conflates innovation with communication.  
     - *Non-negotiable*: Qualified. Essential for scientific relevance, but camp-specific in emphasis (e.g., pedagogy may be secondary for some).  

  4. **Explicit structural representation vs. distributed pattern completion**  
     - *Motivation*: Human analogy handles both explicit relational mappings (e.g., solving Raven’s Matrices) and implicit, fuzzy matches (e.g., poetic metaphors). The theory must not reduce one to the other.  
     - *Non-negotiable*: Yes. Reflects the dual-process nature of cognition (slow/symbolic vs. fast/associative).  

  ---

  ### **III. Empirical & Computational Constraints**  
  *Grounded in evidence and implementability.*

  1. **Effortful and context-sensitive processing**  
     - *Motivation*: Analogical retrieval is effortful and cue-dependent (e.g., Gick & Holyoak’s radiation problem: subjects miss analogies without hints). The theory cannot treat analogy as automatic.  
     - *Non-negotiable*: Yes. Supported by reaction-time and fMRI studies.  

  2. **Non-human and child capacities**  
     - *Motivation*: Crows solve analogy-based tool-use tasks; 3-year-olds pass simple A:B::C:D analogies. The core mechanism must be phylogenetically/developmentally primitive.  
     - *Non-negotiable*: Yes. Challenges overly linguistic or symbolic accounts.  

  3. **Distributed systems approximating analogical transfer**  
     - *Motivation*: Connectionist models (e.g., word2vec solving "king - man + woman = queen") show statistical pattern completion can mimic analogies. However, they fail unpredictably (e.g., sensitivity to training data), unlike humans. The theory must align with these successes/limitations.  
     - *Non-negotiable*: Qualified. Compatibility is required, but strict implementation is camp-specific (e.g., symbolic vs. connectionist).  

  ---

  ### **IV. Boundary Conditions**  
  *Failure modes and limits.*

  1. **Predictable failure cases**  
     - *Motivation*: The theory must specify when analogies break down (e.g., over-extending surface features: assuming "atoms are like solar systems" implies planets orbit randomly). It cannot treat errors as noise.  
     - *Non-negotiable*: Yes. Essential for falsifiability.  

  2. **Human-specific failure patterns**  
     - *Motivation*: Humans resist distant mappings (e.g., reluctance to map biology to engineering) but fixate on surface traits when novices (e.g., Dunbar’s microbiology studies). The theory must predict these, not just successes.  
     - *Non-negotiable*: Yes. Tests psychological plausibility.  

  ---

  ### **V. Tensions and Critical Requirements**  
  - **Key tension**: Fundamentality (in perception) vs. Explicitness (for scientific discovery).  
    - Perception requires fast, implicit analogies (e.g., object recognition via feature alignment).  
    - Scientific abstraction demands slow, explicit structural alignment (e.g., Maxwell’s vortex-gear model of electromagnetism).  
    - *Joint unsatisfiability?*: Likely. A single mechanism may not span both without compromising one (e.g., distributed systems struggle with systematicity; symbolic systems struggle with speed/fluidity).  

  - **Most exclusionary requirement**: **Cross-domain mathematical abstraction** (I.4). This excludes theories that rely on perceptual/semantic grounding (e.g., purely embodied cognition) or associative models.  

  - **Suspect pair**: **Structural alignment distinctions (II.2)** and **Distributed pattern completion (III.3)**. Distributed systems (e.g., neural nets) often conflate structural and superficial matches, lacking human-like systematicity.  

  ---

  ### **VI. Scoring Three Approaches**  
  *Brief evaluation against criteria. Weight on justification via desiderata.*

  1. **Structural-Alignment (Gentner et al.)**  
     - *Phenomena*: Strong on linguistic metaphors (I.2) and scientific models (I.3) via structure-mapping. Weak on perception (I.1) and distributed math (I.4), as it assumes explicit representations.  
     - *Distinctions*: Excels at II.1 (productive vs. dead) and II.2 (structural alignment). Struggles with II.4 (implicit/distributed mapping).  
     - *Constraints*: Matches effortfulness (III.1) but underestimates non-human capacities (III.2). Poor fit for distributed computation (III.3).  
     - *Boundaries*: Predicts over-extension errors (IV.2) but not perceptual analogy failures (IV.1).  
     - *Critical gap*: Cannot ground perception without compromising explicitness.  

  2. **High-Level Perception (Hofstadter/Sander)**  
     - *Phenomena*: Covers perception (I.1), metaphor (I.2), and abstraction (I.4) via "slippage" between concepts. Weak on discarded scientific analogies (I.3), as it treats analogies as persistent cognitive units.  
     - *Distinctions*: Preserves II.1 and II.3 but blurs II.2 (structural vs. superficial) by emphasizing "conceptual slippage." Ambiguous on II.4.  
     - *Constraints*: Aligns with context-sensitivity (III.1) and child capacities (III.2). Agnostically compatible with III.3.  
     - *Boundaries*: Predicts "slippage"-based errors (IV.1) but lacks formal failure models.  
     - *Critical gap*: Vagueness in representing structural discipline for science.  

  3. **Distributed-Computation (Emergent Pattern Completion)**  
     - *Phenomena*: Strong on perception (I.1) and metaphor (I.2) via statistical learning. Weak on scientific models (I.3) and math (I.4), as it lacks mechanisms for discarding analogies or mapping abstract structures.  
     - *Distinctions*: Collapses II.1 (no clear productivity threshold) and II.2 (surface/structure conflated). Rejects II.4’s symbolic side.  
     - *Constraints*: Matches non-human/child capacities (III.2) and distributed systems (III.3). Contradicts effortfulness (III.1), as processing is often automatic.  
     - *Boundaries*: Predicts data-driven failures (e.g., adversarial examples) but not human error patterns (IV.2).  
     - *Critical gap*: Cannot explain disciplined structural alignment without symbolic augmentation.  

  ---

  ### **Summary of Non-Negotiables**  
  The theory must:  
  - Cover **perception to math** (I.1, I.4),  
  - Preserve **structural vs. superficial** distinctions (II.2),  
  - Respect **effortfulness** (III.1) and **non-human capacities** (III.2),  
  - Specify **predictable failures** (IV.1–2).  

  **Most contentious requirement**: Cross-domain mathematical abstraction (I.4) excludes purely associative or embodied theories. **Deepest tension**: Fundamentality vs. explicitness risks making the theory either too rigid (symbolic) or too fluid (connectionist) to span all phenomena. Hofstadter’s view comes closest by treating analogy as "high-level perception," but its informality may be a liability for scientific rigor.
