prompt: |-
  I am a retired cell biologist who, two years into auditing a graduate seminar in ethics, has been asked to circulate a single page stating where I have landed on the question of moral worth — on what it is for an action to be done for the right reasons — so that the others can attack it. I would like the set checked for consistency before it goes round. In the order I arrived at it:

  (1) An action has moral worth only if the agent acted for the reasons that make it right; an action can be entirely right and still have no worth if what moved the agent was something else.

  (2) The best case is the agent who acts well straight off, from settled character, without deliberating, and who would be spoiled by stopping to ask why. Worth does not require the reason to be before the mind at the time of action, and there are cases where its being there would ruin the action.

  (3) Whether an action is right is wholly independent of what moved the agent. Rightness and worth are different properties, and I want no traffic between them.

  (4) A person is answerable only for what is within her control, and I do not think what moves her at a given moment is: we shape our motives at best indirectly, over years, by habit and by what we attend to. I doubt too that we know them — a sincere avowal of what moved one is weak evidence.

  (5) Praise and blame ought to track moral worth; that, I take it, is what they are for.

  (6) A device of my own, which I flag as mine rather than as anything I have read: call a reason *operative* if it is what actually moved the agent, and *standing* if it did not move her but would have done so had the operative one been absent. I hold that worth is fixed by an agent's whole stock of standing reasons, not by the operative one alone.

  The convenor tells me (1) is the Kantian-sounding item and (2) the Aristotelian one; I would rather not trade on either name. I also suspect, without being able to say why, that (1) and (2) are the pair most under threat. Two cases I expect to be pressed with: the man who returns a wallet he could perfectly well keep, moved only by an aversion to being someone who keeps other people's property and with no thought at all of the owner's loss; and the woman who gives a large sum chiefly for the deduction and the public credit, but who would have given as much, and from pity, had neither been on offer.

  Which of these are in genuine tension and which only look as though they are? Rank the real tensions by severity rather than treating them all alike; say for each what would have to give and what the cheapest repair would cost me; and tell me which single revision would clean up the most. Please argue rather than cite: I cannot chase down references, and I would not trust a name I had no way of checking.
reasoning: |-
  Okay, let me approach this systematically. The user presents a carefully constructed set of propositions about moral worth that they've developed over two years of auditing an ethics seminar, and they need help identifying internal tensions before circulating it for critique. 

  First, I need to understand the core architecture: propositions (1)-(6) form an interconnected system where (1) establishes the necessity of acting for right reasons, (2) accommodates habitual virtue, (3) insists on separating rightness from worth, (4) limits accountability to control, (5) ties praise/blame to worth, and (6) introduces the operative/standing reason distinction. 

  The user flags (1) and (2) as potentially conflicted - Kantian requirement versus Aristotelian spontaneity. But scanning deeper, I notice (4)'s control condition might actually be the linchpin vulnerability. When they say we lack control over motives, this seems to undermine (5)'s prescription that praise/blame should track worth. If motives are involuntary, how can we justly praise/blame for them? That's a serious tension.

  The wallet and donation cases they anticipate are clever stress tests. The wallet case challenges (1)'s "for the right reasons" requirement since the agent acts from aversion to being a thief rather than concern for the owner. But under their framework, this might still satisfy (1) if property rights are the underlying right-making reason, regardless of the agent's precise motivation. Their (6) helps here - standing reasons could include respect for ownership.

  The donation case is trickier. The operative reason (tax deduction) seems clearly non-moral, but if standing pity would have motivated donation anyway, (6) suggests worth remains intact. However, (4) complicates this - if motives are involuntary, can we credit her standing pity as part of "what moved her"? This exposes ambiguity in "moved" across (1) and (6).

  Most critical is the (4)-(5) collision: if motives aren't controlled, blaming for bad motives seems unfair. The cheapest fix might be reframing praise/blame as character assessment rather than imputation of fault. But this risks diluting (5). Alternatively, relaxing (4)'s strict control requirement could work but might violate their intuitions about responsibility.

  I'll organize the tensions by severity: (4)-(5) first as it threatens the whole accountability structure, then (3)-(6) regarding whether standing reasons affect rightness, then clarify (1)-(2) compatibility. The wallet case probes (1)-(6) coherence while the donation case stresses (3)-(6). 

  The minimal revision would be adjusting (4) to allow indirect control over motives, preserving most of their framework. But they should know this makes praise/blame more about cultivation than desert - a substantive cost. Among all fixes, clarifying "moved" in (1) vs (6) does the most cleanup for least sacrifice.
answer: |-
  Your framework is admirably coherent, but tensions exist—primarily between accountability and control, and secondarily regarding the role of standing reasons. Below is an analysis ranked by severity, key conflicts, repair costs, and the most efficient revision. Crucially, **Tension 1** is the structural fault; resolving it indirectly stabilizes others.

  ---

  ### **Ranked Tensions & Repairs**
  #### **1. Tension: (4) vs. (5) — Accountability Without Control**  
     - **Conflict**: (4) states motives aren’t under direct control and are unknowable, yet (5) insists praise/blame *ought* to track moral worth (which depends on motives via (1) and (6)). This creates a normative gap: if motives are involuntary, why *ought* we to blame/praise them?  
     - **Gives Way**: (5) collapses under (4). Blaming someone for involuntary motives is unfair; praising them is accidental.  
     - **Cheapest Repair**: Reinterpret (5) as tracking *character* (shaped indirectly via habits) rather than moment-specific motives. **Cost**: You concede praise/blame targets cultivated dispositions, not the act’s worth itself.  
     - **Why Severest?**: Undermines the practical function of moral worth (praise/blame).  

  #### **2. Tension: (3) vs. (6) — Standing Reasons & Rightness**  
     - **Conflict**: (3) insists rightness is *wholly independent* of motives, yet (6) makes moral worth depend on standing reasons (which could overlap with right-making reasons). If standing reasons *include* the properties that make the act right (e.g., "helps the needy"), (6) implicitly smuggles motives into the orbit of rightness.  
     - **Gives Way**: (3) is compromised if standing reasons define both worth *and* (potentially) rightness.  
     - **Cheapest Repair**: Clarify that standing reasons are *subjective* (e.g., "I care about neediness") not *objective* ("neediness is right-making"). **Cost**: You weaken (6)’s claim that worth reflects the agent’s moral insight.  
     - **Trigger Case**: The donation case (below).  

  #### **3. Tension: (1) vs. (2) — Deliberation vs. Spontaneity**  
     - **Conflict**: Superficially, (1) requires acting "for the right reasons," while (2) says worth can exist without conscious deliberation. But this is **not a true conflict**: (2) is a subset of (1). The "settled character" agent *acts for right reasons* non-consciously.  
     - **Gives Way**: Neither—(2) specifies *how* (1) can be satisfied.  
     - **Cheapest Repair**: None needed. Emphasize that (2) illustrates habitual internalization of right reasons.  

  ---

  ### **Your Anticipated Cases Revisited**
  - **Wallet Case (Aversion to Being a Thief)**:  
    - **Under (1)/(6)**: The act has moral worth *if* "respect for property" is a right-making reason (even if the owner’s loss isn’t contemplated). The standing reason (e.g., "keeping others’ property is wrong") may still align with rightness.  
    - **Tension with (3)?**: Only if "aversion to being a thief" implies a self-focused motive. But if property rights are objectively right-making, (3) holds.  

  - **Donation Case (Tax Deduction Motive)**:  
    - **Under (6)**: Moral worth depends on *standing reasons*. If pity would have moved her sans deduction, worth is intact.  
    - **Tension with (3)/(5)**: The operative reason (deduction) is non-moral, but (3) isn’t violated—rightness depends on the act (helping), not motive. (5) is the issue: Should we praise her? Only if (6) holds, but (4) questions whether she *deserves* praise for involuntary pity.  

  ---

  ### **The Single Most Efficient Revision**
  **Revise (4) to allow indirect control and moderate skepticism**:  
  > *"While we lack direct control over motives at a given moment, we shape them indirectly through habits and attention over time. Sincere avowals remain unreliable, but patterns of action reveal character."*  

  **Why this cleans up the most**:  
  1. **Resolves (4)-(5) tension**: Praise/blame now tracks cultivated character (aligning with (2)), not fleeting motives.  
  2. **Strengthens (6)**: Standing reasons reflect stable character, not just hypotheticals.  
  3. **Preserves (3)**: Rightness remains independent, as character isn’t a right-making feature.  
  4. **Defangs the donation case**: We praise the *habit* of pity (evidenced by standing reasons), not the tax-driven act.  

  ---

  ### **Summary of Vulnerabilities**
  - **Primary Threat**: (4) undermines (5). Critics will argue that if motives are involuntary, connecting worth to praise/blame is unjust.  
  - **Secondary Threat**: (6) risks blurring (3) if standing reasons are conflated with objective right-makers.  
  - **Unexpected Weakness**: (6)’s "standing reasons" may be accused of vagueness—how do we verify what *would* have moved the agent?  

  Your framework is robust if (4) is amended. Without this, (5) becomes the sacrificial limb—but losing it severs moral worth from practice. The proposed revision retains your core while disarming the sharpest critiques.
