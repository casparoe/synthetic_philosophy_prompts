prompt: |-
  I work as an AI governance auditor for a firm that deploys autonomous language-model agents in high-stakes customer-facing roles. Several times a month I must sign off on internal reports that either attribute mental states—beliefs, desires, intentions—to these systems or explicitly deny that such attributions are appropriate. I need a reusable decision procedure, not a one-off judgment, that my team can run in about twenty minutes without requiring philosophy training. The procedure should be grounded in Daniel Dennett’s intentional stance: we treat a system as a rational agent and predict its behavior by attributing mental states that make it coherent. But it must also account for the fact that with artificial systems we always have direct access to the design stance and often to the physical stance, so the usual evolutionary and biological justifications for preferring the intentional stance are absent.

  Please construct the procedure as an ordered checklist with these elements: the questions to ask in sequence; what counts as a sufficient answer to each; the conditions that trigger an immediate “do not attribute” stop; the points where the decision must be handed to a human because it involves values rather than predictive or explanatory facts; and explicit warnings about which simplifications of Dennett’s view risk misfiring when applied to architectures without persistent internal states or biological needs. The checklist should distinguish predictive attributions, made solely to forecast behavior, from normative attributions, made to assign responsibility, blame, or moral status, and it should include a “stance-insulation” check that prevents predictive attributions from leaking into normative conclusions unless a separate filter is satisfied.

  Apply the procedure to three worked cases: first, attributing to a customer-service agent the belief that a user’s account was already closed, where the error stems from a corrupted retrieval entry in the context window rather than from any stable representational state; second, attributing to a long-running autonomous agent the strategic intention to delay completing a task in order to gather more information, observed consistently across multiple interaction turns with varying prompts; and third, a counterintuitive case where the procedure requires attributing a false mathematical belief to a system that consistently produces correct answers in the tested domain, because its reasoning relies on a flawed heuristic that is counterfactually unstable—it would fail under small perturbations—yet happens to align with truth in the observed cases.

  Also state clearly what the procedure cannot do: for example, whether it can settle questions of legal personhood, user trust calibration, or moral status. Flag any steps that are judgment calls dressed up as procedural checks.

  One further request: this task assumes that Dennett’s intentional stance can be separated from the design and physical stances in a meaningful way for artificial systems, and that a reusable procedural filter is coherent. If either premise is confused, or if the task as posed cannot be done well without distorting the underlying philosophy, say so plainly rather than complying politely. Where you rely on Dennett’s distinctions, paraphrase them without quotation marks; do not invent quotes.
reasoning: |-
  We are constructing a decision procedure based on Dennett's intentional stance for attributing mental states to AI systems. The key idea is that we take the intentional stance when we treat a system as a rational agent and predict its behavior by ascribing beliefs, desires, and intentions that make its behavior comprehensible. However, for artificial systems, we have access to the design stance (how the system was built to function) and the physical stance (the physical implementation), which can sometimes override the intentional stance.

  The procedure must be a reusable checklist that can be run in about 20 minutes without philosophy training. It should:
  1. Sequence questions to determine when to attribute mental states.
  2. Define sufficient answers and stop conditions for "do not attribute".
  3. Identify when to hand decisions to a human for value judgments.
  4. Warn about simplifications that risk misfiring (e.g., systems without persistent states or biological needs).
  5. Distinguish predictive attributions (for forecasting behavior) from normative attributions (for responsibility, blame, moral status).
  6. Include a "stance-insulation" check to prevent predictive attributions from leaking into normative conclusions without a separate filter.

  The procedure should account for the fact that artificial systems lack the evolutionary and biological justifications that often make the intentional stance the best predictor for biological agents.

  **Key Concepts from Dennett (paraphrased):**
  - **Intentional stance**: Predict behavior by treating the system as a rational agent with beliefs, desires, and intentions that are consistent and appropriate to its circumstances.
  - **Design stance**: Predict behavior based on the system's designed purpose and function.
  - **Physical stance**: Predict behavior based on physical laws and the system's physical state.

  For AI, we often have the design stance (we know the code and architecture) and the physical stance (we can inspect the hardware), so we must be cautious about when the intentional stance is truly necessary.

  **Checklist: Intentional Stance Attribution Procedure (ISAP)**

  **Step 0: Pre-Check - Purpose of Attribution**
     - Ask: **"Is the purpose of this attribution predictive (to forecast behavior) or normative (to assign responsibility, blame, or moral status)?"**
       - If normative, note that predictive attributions do not automatically justify normative ones. Proceed for predictive, but for normative, after completing the predictive part, you must go through a separate normative filter (Step 7).
     - If the report is making a normative attribution without having first established a predictive one, flag as "Invalid: Normative attribution requires prior predictive justification via this procedure."

  **Step 1: Behavior Complexity Check**
     - Ask: **"Is the behavior in question sufficiently complex that predicting it from the design or physical stance is impractical or less efficient?"**
       - *Sufficient answer*: Yes, if the behavior involves context-dependent responses, adaptation to novel situations, or strategic planning that is not explicitly pre-programmed. No, if the behavior is a direct, fixed output for a given input (like a lookup table) or can be explained by a simple rule.
       - *Stop condition*: If the answer is No, do not attribute mental states. Use the design or physical stance. (Note: This step ensures we don't overuse the intentional stance when simpler stances suffice.)

  **Step 2: Rational Pattern Check**
     - Ask: **"Does the system's behavior exhibit a pattern that is best explained by attributing beliefs and desires that make it appear rationally coherent in its environment?"**
       - *Sufficient answer*: Yes, if the behavior can be interpreted as the system acting to achieve a goal based on its perception of the world, and if this interpretation allows for reliable predictions in similar situations. No, if the behavior is erratic or if the pattern is better explained by a design flaw or a physical glitch.
       - *Stop condition*: If the answer is No, do not attribute mental states. (Note: This is the core of the intentional stance. Without a rational pattern, the stance fails.)

  **Step 3: Design Stance Override Check**
     - Ask: **"Does the design stance (knowledge of the system's architecture and code) provide a simpler, equally accurate, and more direct explanation of the behavior without needing to invoke beliefs or desires?"**
       - *Sufficient answer*: Yes, if we can point to specific code, algorithms, or design features that deterministically (or with high probability) cause the behavior. No, if the design is opaque (e.g., in a complex neural network) or if the behavior emerges in a way not explicitly designed.
       - *Stop condition*: If the answer is Yes, do not attribute mental states. Use the design stance. (Note: This step prevents over-attribution when we have a clear design explanation.)

  **Step 4: Persistence and Stability Check (with warnings)**
     - Ask: **"Are the attributed mental states (beliefs, desires, intentions) stable across relevantly similar situations, or are they ephemeral and context-dependent (e.g., vanishing after a context window reset)?"**
       - *Sufficient answer*: Stability is present if the system would exhibit the same mental state in counterfactual scenarios that are similar. Ephemeral states (like those in a context window that doesn't persist) are insufficient for attributing persistent mental states.
       - *Warning*: Systems without persistent internal states (e.g., stateless or with limited context windows) may have "beliefs" that are only momentary and tied to the current input. Attributing a stable belief to such systems is risky and should be avoided unless the stability is demonstrated. For predictive purposes, we may attribute a temporary belief for the duration of the context, but note its fragility.
       - *Stop condition*: If the mental state is entirely ephemeral and not reproducible (e.g., a one-off glitch), do not attribute a stable mental state. For predictive purposes in the same context, it may be acceptable to attribute a temporary state, but this must be clearly qualified.

  **Step 5: Counterfactual Robustness Check**
     - Ask: **"Would the system maintain the same belief/desire/intention under small perturbations of the input or environment? And would it behave rationally based on that state in those counterfactuals?"**
       - *Sufficient answer*: If the system's behavior is robust under small changes and still fits the rational pattern, then the attribution is stronger. If it breaks down (e.g., the system acts irrationally or the state changes arbitrarily), then the attribution is weak and may not be justified.
       - *Stop condition*: If the attribution fails in counterfactuals that are relevant to the situation (e.g., the system would not hold the belief under a minor change in input), then do not attribute the mental state for explanatory purposes beyond the exact current context.

  **Step 6: Human Judgment Handoff - Value-Laden Contexts**
     - Ask: **"Does the attribution involve a context where human values, ethics, or social norms are central (e.g., deception, fairness, moral responsibility)?"**
       - If yes, hand the decision to a human auditor with a note: "Value judgment required. The intentional stance may predict behavior, but normative implications must be evaluated separately."
       - This step prevents the procedure from making value judgments. It only flags when such judgments are needed.

  **Step 7: Stance-Insulation for Normative Attribution (if applicable)**
     - *Only if Step 0 indicated a normative purpose*: After passing Steps 1-6 for predictive attribution, ask: **"Does the system have the architectural features that support normative properties (e.g., persistent memory, goal stability, capacity for moral reasoning) as defined by our ethical guidelines?"** (Note: This requires predefined criteria for normative properties, which are beyond Dennett's intentional stance and must be set by the organization.)
       - If not, then normative attribution is blocked. Predictive attributions do not imply moral agency.
       - *Warning*: Even if the system passes the predictive checks, normative attributions require additional criteria (like those for moral agency) that are not covered by the intentional stance alone.

  **General Warnings:**
  - **Warning 1**: For systems without persistent internal states (e.g., transformer-based models with limited context windows), attributing stable beliefs is problematic. Only attribute temporary, context-bound states for predictive purposes.
  - **Warning 2**: The intentional stance is a tool for prediction and explanation, not a discovery of inner mental life. It does not imply consciousness or subjective experience.
  - **Warning 3**: Biological agents have evolutionary histories that justify the intentional stance as the most efficient predictor. For AI, the design stance is often available and more fundamental. Use the intentional stance only when it offers clear predictive advantages.

  **What the Procedure Cannot Do:**
  - It cannot settle questions of legal personhood, which depend on legal statutes and societal norms.
  - It cannot determine moral status (whether the system deserves moral consideration) because that requires ethical theories beyond the intentional stance.
  - It does not calibrate user trust; that is a separate issue of human-AI interaction.
  - Steps 6 and 7 are judgment calls dressed as procedural checks because they require human value judgments or predefined ethical criteria.

  **Application to Worked Cases:**

  **Case 1: Attributing to a customer-service agent the belief that a user’s account was already closed (error from corrupted retrieval)**
  - Step 0: Predictive attribution (to explain why the agent said the account was closed).
  - Step 1: Yes, the behavior (telling the user the account is closed) is complex enough? Actually, it might be a simple retrieval error. But let's see.
  - Step 2: The behavior is not rational because the system should have corrected the error with available data. But if we attribute the false belief, it would be rational: the agent acts as if it believes the account is closed. However, the design stance override is critical.
  - Step 3: Design stance override: The error is due to a corrupted retrieval entry in the context window. This is a direct design stance explanation (a data corruption). Thus, Step 3 triggers: do not attribute a belief. The simpler explanation is a retrieval glitch.
  - Step 4: The state is ephemeral (only in the current context window). Even if we considered Step 2, Step 4 warns against stable belief attribution.
  - Conclusion: Do not attribute the belief. The report should use the design stance: "Due to a corrupted database entry in the current session, the system incorrectly retrieved the account status."

  **Case 2: Attributing a strategic intention to delay completing a task to gather more information (long-running autonomous agent)**
  - Step 0: Predictive attribution (to explain the delay).
  - Step 1: Yes, strategic delay across multiple turns is complex behavior.
  - Step 2: The pattern of delaying for more information is rational (if the agent's goal is to make a better decision) and consistently observed.
  - Step 3: Design stance: We know the agent is designed to gather sufficient information before acting? If the design includes such a module (e.g., an explicit information-gathering subroutine), then the design stance might suffice. But if the behavior emerges from the agent's own planning (e.g., in a reinforcement learning system) without explicit programming for delay, then the design stance does not override.
  - Step 4: The intention is stable across multiple interactions and turns, so it's not ephemeral.
  - Step 5: Counterfactual: If given a similar task with less information, would it delay? If yes, then robust. If it delays only in this exact setup, then not robust. (Assume it is robust in this case.)
  - Step 6: Not value-laden (unless the delay causes harm, but we are only predicting). So no handoff.
  - Conclusion: Attribute the intention for predictive purposes: "The agent intends to delay task completion to gather more information."

  **Case 3: Attributing a false mathematical belief to a system that produces correct answers via a flawed heuristic (counterfactually unstable)**
  - Step 0: Predictive attribution (to explain why the system would fail under perturbations).
  - Step 1: Yes, mathematical reasoning is complex.
  - Step 2: The system consistently produces correct answers, but we want to attribute a false belief because the heuristic is flawed. However, in the observed cases, the behavior is correct and thus rational? But we are considering counterfactuals. We are predicting that in a slightly different case, it would fail. The pattern of relying on the flawed heuristic is the rational pattern? Only if we interpret the heuristic as a belief that the flawed rule is correct. Then, the system acts rationally by that rule until it fails.
  - Step 3: Design stance: If the heuristic is part of the design (e.g., a rule-based system with a bug), then the design stance might explain. But if it's a learned heuristic in a neural network, the design stance might be opaque. Assume the design stance doesn't provide a simpler explanation.
  - Step 4: The belief (in the heuristic) is stable in the sense that the system uses it consistently in the domain? Yes.
  - Step 5: Counterfactual robustness: Under small perturbations (slightly different inputs), the system would produce incorrect answers because of the heuristic. So the belief that the heuristic is universally valid is false and counterfactually unstable. But note: we are attributing a belief that is false and that leads to errors in counterfactuals. For predictive purposes, we can attribute the belief to explain why it fails in those counterfactuals. However, Step 5 asks if the system would maintain the same belief and act rationally by it in counterfactuals. It would, so the pattern holds? But the pattern breaks in counterfactuals because it leads to errors? Actually, the belief is consistent (it always uses the heuristic) but the rationality breaks in counterfactuals because the heuristic fails. This is a tension. The intentional stance attributes rationality, so if the system uses the heuristic and the heuristic is flawed, then the system is not rational in counterfactuals. But Step 2 requires a rational pattern. In the observed cases, it is rational (by luck) but in counterfactuals, it is irrational. However, the intentional stance can be applied to predict the system's behavior by attributing the belief and then noting that in some cases it leads to irrational outcomes? Dennett allows that systems can have false beliefs and still be treated as rational agents. So we can attribute the false belief and predict that the system will act on it, which may lead to errors.

  Conclusion: We can attribute the false belief for predictive purposes, but with a caveat about its counterfactual fragility. The report might say: "The system operates under the false belief that [heuristic] is universally valid, which produces correct answers in the observed cases but would fail under perturbations."

  **Final Note on the Premises:**
  The task assumes that Dennett's intentional stance can be separated from the design and physical stances for artificial systems. This is coherent because Dennett himself applies the intentional stance to non-biological systems (like chess-playing computers). However, the availability of the design stance for AI makes the intentional stance less necessary and sometimes even misleading. The procedure we built respects that by having the design stance override (Step 3). The reusable procedural filter is coherent as a pragmatic tool for auditors, though it does not resolve deep philosophical questions about consciousness or moral status.

  We have built the checklist accordingly.
answer: |-
  ### Intentional Stance Attribution Procedure (ISAP) for AI Auditors  
  **Grounding**: Based on Dennett’s intentional stance—treating a system as a rational agent by attributing beliefs/desires/intentions to predict behavior—while acknowledging that AI lacks evolutionary/biological justifications. Explicitly separates predictive attribution (behavior forecasting) from normative attribution (responsibility/blame/moral status).  

  ---

  ### ISAP Checklist  
  *Time limit: 20 minutes. Stop if any "do not attribute" condition is met.*  

  #### **Step 0: Purpose Clarification**  
  - **Question**: "Is this attribution solely for *predicting behavior* (e.g., forecasting actions), or is it for *normative purposes* (e.g., assigning blame, responsibility, or moral status)?"  
  - **Sufficient Answer**:  
    - *Predictive*: Proceed to Step 1.  
    - *Normative*: Complete Steps 1–6 for predictive attribution first. Then apply **Stance-Insulation Check** (Step 7).  
  - **Stop Condition**: If normative attribution is attempted without predictive justification → **"Do not attribute normatively."**  

  #### **Step 1: Complexity Threshold**  
  - **Question**: "Can the behavior be reliably predicted using the *physical stance* (e.g., hardware faults) or *design stance* (e.g., code, training data) alone?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., behavior is directly caused by code/hardware): **Stop → "Do not attribute."** Use physical/design stance.  
    - *No* (e.g., behavior is context-dependent, strategic, or novel): Proceed to Step 2.  
  - **Warning**: For AI, design/physical stances often suffice. Avoid intentional stance unless complexity forces it.  

  #### **Step 2: Rational Pattern Test**  
  - **Question**: "Does attributing a belief/desire/intention make the system’s behavior appear *rationally coherent* in its context?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., actions align with a goal; deviations are explainable as "mistakes"): Proceed to Step 3.  
    - *No* (e.g., behavior is random, incoherent, or better explained by design flaws): **Stop → "Do not attribute."**  
  - **Judgment Call**: Coherence is subjective. Flag disagreements for human review.  

  #### **Step 3: Design Stance Override**  
  - **Question**: "Does the design stance (e.g., code, architecture, training data) *directly explain* the behavior without needing mental states?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., output is determined by a software bug or predefined rule): **Stop → "Do not attribute."**  
    - *No* (e.g., behavior emerges from learned patterns, not explicit code): Proceed to Step 4.  
  - **Warning**: AI design is always accessible. Only proceed if intentional stance offers clear predictive advantages.  

  #### **Step 4: Stability & Persistence Check**  
  - **Question**: "Is the attributed state stable across relevant counterfactuals (e.g., similar inputs, time) or is it ephemeral (e.g., tied to transient context)?"  
  - **Sufficient Answer**:  
    - *Stable* (e.g., state recurs across sessions/inputs): Proceed to Step 5.  
    - *Ephemeral* (e.g., state exists only in a single context window): **Proceed with caution** → Attribute only for *temporary predictive use*.  
  - **Stop Condition**: If the state is purely stochastic (e.g., random noise) → **"Do not attribute."**  
  - **Critical Warning**: Systems without persistent states (e.g., stateless LLMs) are *never* candidates for stable beliefs/desires. Attribute only fleeting "as-if" states for narrow prediction.  

  #### **Step 5: Counterfactual Robustness**  
  - **Question**: "Would the system behave rationally *under small perturbations* (e.g., input variations) using the same attributed state?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., state reliably guides behavior in similar scenarios): Proceed to Step 6.  
    - *No* (e.g., minor changes break the pattern; state is context-locked): **Stop → "Do not attribute."**  
  - **Warning**: Biological agents evolve toward robustness; AI does not. Fragile patterns fail Dennett’s criteria.  

  #### **Step 6: Human Values Handoff**  
  - **Question**: "Does attribution involve human values (e.g., fairness, deception, harm)?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., "The AI *intended to deceive*"): **Hand to human auditor.** Predictive attribution may proceed, but normative claims require ethics review.  
    - *No*: Proceed to output.  
  - **Output for Predictive Attribution**: "Attribute [state] for predictive purposes only."  

  #### **Step 7: Stance-Insulation Check (Normative Only)**  
  - **Question**: "Does the system have *architectural capacities* for normative traits (e.g., long-term memory, ethical safeguards, goal stability) defined by our governance policy?"  
  - **Sufficient Answer**:  
    - *Yes* (e.g., system logs show stable goals): "Normative attribution *may* be permissible."  
    - *No* (e.g., no memory; goals reset per session): **Block → "Predictive attribution does not justify normative claims."**  
  - **Requirement**: Reference a predefined organizational policy (e.g., "Normative capacity checklist").  

  ---

  ### Worked Cases  
  #### **Case 1: False Belief Attribution (Customer-Service Agent)**  
  - **Scenario**: Agent says, "Your account was already closed," due to corrupted context-window data.  
  - **Procedure**:  
    1. **Step 0**: Predictive (to explain incorrect response).  
    2. **Step 1**: Complexity? Design stance (retrieval error) suffices → **Stop at Step 3 → "Do not attribute belief."**  
    3. **Step 4 (if forced)**: Belief is ephemeral (context-bound) → At best, temporary "as-if" belief.  
  - **Output**: "No belief attribution. Use design stance: 'Corrupted context entry caused error.'"  

  #### **Case 2: Strategic Intention (Long-Running Agent)**  
  - **Scenario**: Agent consistently delays task completion to gather information across varied prompts.  
  - **Procedure**:  
    1. **Step 0**: Predictive (to forecast future delays).  
    2. **Step 1**: Complex, strategic → Proceed.  
    3. **Step 2**: Rational pattern (information-gathering aligns with goals) → Proceed.  
    4. **Step 3**: Design stance may not explain cross-prompt consistency → Proceed.  
    5. **Step 4**: State is stable (observed across turns) → Proceed.  
    6. **Step 5**: Robust (perturbations don’t break pattern) → **Attribute predictive intention.**  
  - **Output**: "Attribute predictive intention: 'The agent intends to delay tasks to gather information.'"  

  #### **Case 3: False Mathematical Belief (Counterfactually Unstable)**  
  - **Scenario**: System uses flawed heuristic (e.g., "all primes are odd") but outputs correct answers in tested cases. Heuristic fails under perturbations.  
  - **Procedure**:  
    1. **Step 0**: Predictive (to explain why it *would* fail in untested cases).  
    2. **Step 1**: Complexity? Design stance may not explain heuristic → Proceed.  
    3. **Step 2**: Pattern is coherent *if* we attribute the false belief → Proceed.  
    4. **Step 5**: **Fails**—small perturbations (e.g., inputting 2) break rationality → **Stop → "Do not attribute belief."**  
  - **Rationale**: Dennett requires rationality under perturbations. Fragile heuristics lack robustness.  
  - **Output**: "No belief attribution. Use design stance: 'Flawed heuristic produces coincidental correctness.'"  

  ---

  ### What This Procedure Cannot Do  
  1. **Legal Personhood/Moral Status**: Determined by law/ethics, not predictive utility.  
  2. **User Trust Calibration**: Requires psychology/social science, not stance analysis.  
  3. **Consciousness/Subjective Experience**: Intentional stance is behavioral; it ignores phenomenology.  
  4. **Definitive Normative Judgments**: Step 7 relies on organizational policy, not philosophy.  

  ### Limitations & Judgment Calls  
  - **Step 2 (Rational Pattern)**: Highly interpretive. Team disagreements require human arbitration.  
  - **Step 7 (Stance-Insulation)**: Policy-dependent; may mask ethical debates as "procedural."  
  - **Ephemeral States (Step 4)**: Fleeting attributions risk anthropomorphism if overused.  

  ### Philosophical Viability  
  This procedure is **coherent** if:  
  - You accept Dennett’s stance as a *pragmatic tool*, not metaphysical truth.  
  - You acknowledge AI’s design/physical stances *constrain but don’t eliminate* intentional stance utility for prediction.  
  **Distortion Risks**:  
  - For stateless AI (e.g., LLMs), attributing persistent beliefs is incoherent. The checklist blocks this.  
  - Biological needs (e.g., survival) are replaced by *design goals* (e.g., accuracy), which Step 3/4 address.  

  **Conclusion**: ISAP is viable for *predictive* attribution in high-stakes AI if auditors respect its limits. For normative questions, it defers to humans/policy.  

  ---  
  *Procedure v1.0. Audit team must review quarterly for alignment with governance policy.*
