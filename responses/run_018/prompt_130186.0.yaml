answer: |-
  ### **Epistemic Reweighting Game: "Trust Cascade"**  
  **Goal:** Simulate how epistemic bubbles form through credibility weighting (not information filtering), using group bias to reshape information networks. Players experience how favoring ingroup sources amplifies certain information and silences outgroups, leading to divergent perceptions despite identical starting evidence.

  ---

  ### **Materials**  
  - **Evidence Cards:** 60+ index cards (6 facts × 10 copies each). Each card has:  
    - A **unique fact ID** (e.g., "Fact A1", "Fact B2").  
    - A **neutral statement** (e.g., "Climate change is linked to CO2 rise," "Tax cuts boost short-term GDP").  
  - **Tokens:** 100+ small tokens (e.g., beads or paper clips) in two colors:  
    - **Blue:** Ingroup credibility weight  
    - **Red:** Outgroup credibility weight  
  - **Player Sheets:** 10 sheets listing:  
    - Group affiliation (Group A or B)  
    - Table to record: **Fact ID**, **Sender Group**, **Weight Assigned (B/R)**, **Seen Next Round? (Y/N)**  
  - **Group Flags:** Two signs labeled "Group A" and "Group B" at opposite ends of the room.  
  - **Timer:** For rounds.

  ---

  ### **Setup**  
  1. **Split Players:** Randomly divide 10 players into **Group A** (5) and **Group B** (5).  
  2. **Distribute Materials:**  
     - Each player gets:  
       - 1 player sheet (showing their group).  
       - 5 blue + 5 red tokens.  
     - Place Group A/B flags at opposite ends. Players sit with their group.  
  3. **Prepare Evidence:**  
     - Create 6 unique facts (e.g., Fact A1, A2, A3 for Group A; B1, B2, B3 for Group B).  
     - Make 10 identical sets of **Round 1 cards** (all players start with the same 3 facts: e.g., A1, A2, B1).  

  ---

  ### **Rules**  
  **Duration:** 4 rounds (15 min/round), 15-min debrief (total 75 min).  

  #### **Round 1: Identical Starting Point**  
  - Facilitator gives all players the **same 3 evidence cards** (e.g., A1, A2, B1).  
  - **Task:** Players assign weights to each card:  
    - **Blue token:** If the card *would have come* from their ingroup.  
    - **Red token:** If the card *would have come* from the outgroup.  
    *(Since Round 1 has no sender, this primes group bias.)*  
  - Players record weights on sheets.  

  #### **Rounds 2–4: Reweighting Cascade**  
  1. **Sender Assignment:**  
     - Each player is assigned as a "sender" for **one new fact** per round:  
       - Group A sends new "A" facts (e.g., A3 in Round 2).  
       - Group B sends new "B" facts (e.g., B2, B3 in Round 2).  
     - Senders write their fact on 10 blank cards (one per player). Cards are labeled with **sender’s group** (e.g., "From Group A").  
  2. **Card Distribution:**  
     - Facilitator collects all cards and sorts by sender group.  
     - Each player receives cards **based on their prior round’s weights**:  
       - E.g., If a player assigned 2 blue + 1 red in Round 1, they get 2 cards from Group A and 1 from Group B in Round 2.  
       - Cards are drawn randomly from the sender pools.  
  3. **Weight Assignment:**  
     - Players assign **blue/red tokens** to each received card:  
       - **Blue:** Sender is ingroup.  
       - **Red:** Sender is outgroup.  
     - Record weights on sheets.  
  4. **Repeat:** Rounds 3–4 follow the same steps, with new facts added each round.  

  #### **End Condition**  
  - After Round 4, players review their sheets to see which facts they saw/didn’t see.  

  ---

  ### **Payoff & Feedback Loop**  
  - **Reweighting Mechanism:** Assigning blue tokens to ingroup sources increases exposure to ingroup facts in the next round. Red tokens reduce outgroup exposure.  
  - **Bubble Formation:** Players who favor their ingroup see more ingroup facts, reinforcing the belief that "their group" is credible. Outgroup facts become rarer, making them seem less important.  
  - **Divergent Realities:** By Round 4, Group A sees mostly "A" facts, Group B sees "B" facts. Despite identical starts, groups recall different evidence.  
  - **Psychological Payoff:** Players *feel* their ingroup is "more reliable" due to repeated exposure (availability heuristic).  

  ---

  ### **Debrief Discussion (15 min)**  
  **Connect Mechanics to Philosophy:**  
  1. **Epistemic Bubble (Simulated):**  
     - "You started with the same facts but *reweighted* sources based on group bias. This created a bubble—not by blocking information, but by making outgroup facts *invisible through low priority*. In real life, this mirrors algorithmic amplification (e.g., social media showing you more of what you ‘trust’)."  
  2. **Echo Chamber Contrast:**  
     - "An echo chamber actively *discredits* outsiders (‘Group B is lying’). Here, you didn’t reject outgroup facts; you just didn’t *see* them. Bubbles are about missing voices; echo chambers breed distrust. Did anyone feel outgroup facts were less credible just because they saw fewer?"  
  3. **Key Insight:**  
     - "Bubbles can form without censorship—just by trusting ‘people like us.’ This is subtle but pervasive in polarized networks."  

  **Discussion Prompts:**  
  - "Which facts did your group see most? Why?"  
  - "Did weighting feel voluntary, or did the system ‘pull’ you?"  
  - "How might this apply to academic/political tribes?"  

  ---

  ### **Honest Limitations**  
  **What This Can’t Simulate:**  
  - **Algorithmic Amplification:** Real algorithms use engagement data (clicks, shares) to *dynamically* adjust content in real-time. This game uses static human decisions—it can’t replicate the speed, scale, or adaptive feedback loops of AI-driven platforms.  
  - **Content Personalization:** Algorithms tailor *new* content based on your behavior (e.g., generating anti-vax posts for skeptics). Here, facts are fixed—only visibility changes.  

  ---

  ### **Predictable Problems (and Fixes)**  
  1. **Token Confusion:**  
     - *Issue:* Players forget blue=ingroup, red=outgroup.  
     - *Fix:* Start with a practice round using simple examples ("Imagine a news headline from your group—assign blue!").  

  2. **Distribution Chaos:**  
     - *Issue:* Facilitator overwhelmed sorting cards by weight.  
     - *Fix:* Use group-colored envelopes (blue for A, red for B) to pre-sort cards. Have players self-sort tokens into bowls by color.  

  3. **Shallow Weighting:**  
     - *Issue:* Players assign weights randomly, not feeling "pull."  
     - *Fix:* Prime bias—ask groups to brainstorm why they’re "more reliable" before Round 1.  

  4. **Time Overrun:**  
     - *Issue:* Card-writing or token counting takes too long.  
     - *Fix:* Pre-write all fact cards; limit rounds to 3 (not 4). Use a loud timer.  

  5. **No Real Disagreement:**  
     - *Issue:* Facts are neutral, so players don’t feel conflict.  
     - *Fix:* Use mildly divisive facts (e.g., "Universal healthcare lowers costs" vs. "Private healthcare boosts innovation").  

  ---

  ### **Why This Works**  
  - **Twist Achieved:** Players *choose* to deprioritize outgroups, making the bubble feel self-imposed.  
  - **Low-Tech:** Paper/tokens enforce focus—no laptops.  
  - **Debrief Links Theory:** Mechanics illustrate Nguyên’s "echo chamber vs. bubble" distinction tangibly.  

  Run this in a 90-min session, and grad students will leave debating weightings over coffee!
