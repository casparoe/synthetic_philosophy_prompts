prompt: |-
  Hey, I'm trying to map out where the real leverage points are in decision-theoretic AI safety, specifically around counterfactual mugging — where some predictor rewards or punishes you based on what you'd do in a simulated counterfactual — and XOR-style blackmail setups where threats are arranged with exclusive-or conditions so that complying with one invites the other. You should act like a philosopher who's actually worked on formal decision theory and alignment framing, not just a generalist. Start with a quick brain-dump of what you think the landscape looks like, then organize it.

  What I actually need is a defended prioritization, not a survey. Suppose you have a small research group — say two people with philosophy logic backgrounds, one year, zero ML compute — and you want them to work on open questions in this space that could genuinely change how we'd design an agent's decision procedure. Which questions or lines of work matter most, in what order, and why? For each, explain how tractable it is for philosophers rather than engineers, whether it's upstream of other issues, and what kind of result over the next year would make you bump it up or down. Also flag which ones are overrated or don't actually affect agent design.

  Please truely seperate what's genuinely settled in this area (like, the basic logical structure of Newcomb-style prediction problems) from what's still contested among people who actually understand the formalism — don't present a contested view as if it's the consensus.

  Also, I want you to factor in two niche variants that aren't in the standard literature: "stochastic XOR blackmail," where the blackmailer only gets a noisy signal of your decision procedure rather than running a perfect simulation, and "counterfactual mugging with bounded predictors," where the predictor runs a truncated simulation with a hard compute cap. Do these break any of the classic answers? Which open questions become more urgent once you allow for noisy or bounded prediction?

  Don't give me a bibliography or citation list — I'm working offline and need arguments I can evaluate on their own. Just the agenda, the reasoning, and the ranking.
reasoning: |-
  We are given a specific research prioritization task for a small group (2 people, philosophy/logic backgrounds, 1 year, no ML compute) on decision-theoretic AI safety, focusing on counterfactual muggings and XOR blackmail, including stochastic and bounded variants.

  The goal is to identify open questions that could genuinely change agent design, with defended prioritization. We must separate settled matters from contested ones, and consider the two niche variants: stochastic XOR blackmail and counterfactual mugging with bounded predictors.

  Settled (as per the request, we treat these as consensus):
  - The logical structure of Newcomb's problem and why one-boxing is the winning strategy when the predictor is perfect (and the agent knows it) is well understood: it's a dominance argument in the presence of correlation between the prediction and the action.
  - In counterfactual mugging (Omega flips a coin, if heads asks for $100, if tails pays $10000 if you would have paid in the heads scenario), the "rational" action (paying when asked) is known to be required for maximizing utility in the long run, but it's a problem for causal decision theorists (CDT) who would not pay because the coin is already tails and paying doesn't cause the reward. Evidential decision theory (EDT) and functional decision theory (FDT) would pay.

  Contested or Open:
  - How to design agents that perform well in these problems, especially when we move away from perfect predictors and when we have multiple entangled decision problems (like XOR blackmail).
  - The formalization of decision theories that handle these cases robustly, especially under computational limitations and noise.

  The two variants:
  1. Stochastic XOR blackmail: Blackmailer gets a noisy signal of your decision procedure. This might break the standard solutions because the agent's action may not be perfectly predictable, leading to situations where the blackmailer might get it wrong, and the agent might try to exploit that.
  2. Counterfactual mugging with bounded predictors: The predictor runs a truncated simulation (e.g., limited computation steps). This breaks the perfect prediction assumption and might lead to agents that try to be "hard to predict" in the limited computation.

  Brain-dump of the landscape:

  Key problems:
  - Counterfactual mugging (CM): Tests whether an agent is willing to lose utility in one branch to gain in another, even when that branch doesn't occur. This is important for cooperative agents in multi-agent settings and for dealing with predictors.
  - XOR blackmail: Two blackmailers, A and B. Each can blackmail you, but if both blackmail you, they will pay you. The threat is that each blackmailer will harm you if you don't pay and they are the only one blackmailing. But if you pay one, then the other will blackmail you. The standard solution is to pay neither (if both blackmailers are rational and know you are rational and you are in a symmetric situation). However, if the blackmailers are not symmetric or if there is noise, the situation changes.

  The core issue is that standard decision theories (like CDT) fail in these problems, and we want decision procedures that work well in the presence of predictors (which are a model of other agents or the environment) and in multi-agent settings.

  The two variants introduce realism (noise and bounded computation) and might break the standard solutions. For example:
  - In stochastic XOR blackmail, if the blackmailer has a noisy signal, the agent might try to behave in a way that the noisy signal is uninformative, or might try to signal to the blackmailers that it is not worth blackmailing. This might lead to mixed strategies or new equilibria.
  - In bounded CM, the agent might try to run a strategy that is complex enough that the bounded predictor cannot simulate it fully, leading to the agent "defecting" in the simulation. This could lead to a failure of the agent to get the reward.

  Research Agenda Prioritization:

  We are looking for the most impactful open questions that could change agent design, given the constraints (philosophers, no compute). We prioritize:
  1. Problems that are upstream of others (i.e., foundational).
  2. Problems that, if solved, would lead to a new decision theory or modification that handles the realistic variants.
  3. Problems that are tractable for philosophers (formal modeling, logical analysis, game theory) without requiring large-scale experiments.

  Ranked Priority List:

  1. **Formalizing and solving counterfactual mugging with bounded predictors.**
     - Why: This is a key problem that challenges the assumption of perfect prediction, which is central to many decision theory problems. Real-world predictors (including other agents) are bounded. If we can design a decision procedure that does well in bounded CM, it might generalize to other prediction-based scenarios.
     - Impact on agent design: High. It directly informs how to build agents that interact with predictors (e.g., in AI safety, when an AI is being tested by a safety system that uses prediction).
     - Tractable for philosophers: Yes. It involves formalizing the predictor's limitations (e.g., a fixed computation budget) and then analyzing agent strategies. One can use logical models and game trees.
     - What would a result look like? A formal model of bounded prediction and a decision theory that achieves high utility in CM under bounded predictors. If we find that existing decision theories (like FDT) can be adapted by having the agent simulate the predictor's simulation of itself (to the extent possible) and then act accordingly, that would be a breakthrough. Alternatively, if we find that no such decision theory exists without major modifications, that would also be important.
     - How the variant breaks classic answers: Classic FDT would assume the predictor is perfect and so would pay in CM. But if the predictor is bounded, the agent might be able to "defect" in the simulation without the predictor knowing, hence getting the reward without paying. But then the predictor might not reward. So we need a theory that accounts for the boundedness.
     - Over the next year: If we can prove that a particular decision strategy (e.g., a version of FDT that uses a model of the predictor's computational bounds) achieves within a bounded factor of the optimal in bounded CM, that would be a big win. If it turns out to be intractable (e.g., because it requires solving the halting problem for the predictor), then we might need to shift focus.

  2. **Stochastic XOR blackmail: Equilibrium analysis and agent strategies.**
     - Why: XOR blackmail is a key example of how multiple predictors (blackmailers) can lead to coordination problems. The stochastic variant is more realistic and might break the standard "don't pay" equilibrium. This problem is important for multi-agent safety, where an AI might face multiple adversaries with imperfect information.
     - Impact on agent design: High. It could lead to agents that are robust to blackmail and can avoid being exploited in multi-agent settings.
     - Tractable for philosophers: Yes. This is a game-theoretic problem. We can model it as a Bayesian game with imperfect information and look for equilibria. Philosophers can work on the logical structure and formal proofs.
     - What would a result look like? Characterizing the conditions under which an agent should pay or not pay in stochastic XOR blackmail. For example, if the noise is above a certain threshold, the agent might always refuse and the blackmailers might not blackmail. Alternatively, we might find a mixed strategy that deters blackmail. We might also look at how the agent's decision procedure can be designed to minimize the chance of being blackmailable.
     - How the variant breaks classic answers: In the classic XOR blackmail, the rational move is to not pay and then no blackmailer should blackmail (if they know you are rational and they are rational). But with noise, the blackmailers might not be sure of your type, and you might not be sure of their signal. This could lead to situations where paying sometimes becomes rational.
     - Over the next year: If we can derive an optimal strategy for the agent (or a class of strategies) in stochastic XOR blackmail and prove that it leads to a better outcome than the standard approach, that would be a big win. If we find that the problem becomes too chaotic under noise and no robust strategy exists, that would also be important to know.

  3. **Unifying decision theories to handle both CM and XOR blackmail in the same framework.**
     - Why: Currently, different decision theories handle different problems well. We want a unified theory that can handle both CM and XOR blackmail, including their variants. This is upstream because it could provide a foundation for agent design that works across a range of problems.
     - Impact on agent design: Very high if successful, because it would give a single decision procedure for the agent to use in all these situations.
     - Tractable for philosophers: Yes. This is a formal logic and decision theory task. They can analyze existing theories (CDT, EDT, FDT, UDT, etc.) and propose modifications or new theories.
     - What would a result look like? A new decision theory (or a synthesis) that prescribes the correct actions in both CM and XOR blackmail (and their variants). We would need to show that it outperforms existing theories in these problems and in related ones.
     - Over the next year: Propose a candidate unified theory and prove that it solves both problems (and the variants) better than existing ones. If we can show that such a theory is computationally feasible (even if only in principle), that would be a big step.

  4. **Analyzing the potential for self-modification to avoid blackmail.**
     - Why: In the long run, an agent might want to modify its own decision procedure to be immune to blackmail. This is a form of commitment. But in the presence of noise and bounded predictors, self-modification might be tricky.
     - Impact on agent design: Medium. It could lead to agents that are designed to be blackmail-proof from the start, or that can self-modify appropriately.
     - Tractable for philosophers: Less so, because it involves dynamic decision-making and self-reference. But philosophers with logic backgrounds might handle the formalization of self-modification.
     - What would a result look like? A formal model of self-modification in the context of blackmail and a proof that a certain type of self-modification (e.g., pre-committing to never pay) leads to better outcomes. We must consider whether the commitment is credible and how it interacts with the predictors.
     - Over the next year: If we can show that in stochastic XOR blackmail, a self-modified agent (that commits to not paying) does better than one that doesn't, that would be a positive result. But note that in the classic XOR blackmail, not paying is already the equilibrium without self-modification. The stochastic variant might change that.

  5. **Investigating the relationship between these decision problems and logical uncertainty.**
     - Why: In bounded predictors, the agent might have to reason about its own actions in the simulation under time limits, which involves logical uncertainty (e.g., what would I do if I were simulated with only 1000 steps?). This is a key issue for realistic agents.
     - Impact on agent design: Medium to high. Handling logical uncertainty is a major open problem in AI safety.
     - Tractable for philosophers: Yes, they can work on formal models of logical uncertainty and how it affects decision theory.
     - What would a result look like? Extending decision theories to incorporate logical uncertainty and showing that this extension improves performance in bounded CM and stochastic XOR blackmail.
     - Over the next year: A formal integration of logical uncertainty into FDT or a similar theory, and an analysis of how it changes the behavior in bounded CM.

  Overrated or less impactful for agent design (given our focus):
  - **Rehashing the debate between CDT and EDT/FDT without new variants.** The superiority of FDT-like theories in perfect prediction scenarios is already established. Without new angles (like the variants we have), this is not a priority.
  - **Building complex simulations of these scenarios with ML agents.** We don't have compute and it's not the group's expertise.
  - **Focusing on problems without prediction or counterfactuals.** We are specifically interested in the mugging and blackmail problems.

  Adjusting the priorities based on potential progress:

  - If progress on (1) bounded CM shows that the problem is too dependent on the exact bound and no robust strategy exists, then we might shift resources to (3) unified theory or (5) logical uncertainty.
  - If (2) stochastic XOR blackmail turns out to have clean, robust solutions, then we can deprioritize it and focus on the others.

  Final Prioritized List for the Year:

  1. Bounded Counterfactual Mugging (highest priority because it breaks the core assumption of prediction and is foundational).
  2. Stochastic XOR Blackmail (because multi-agent safety is critical and the stochastic variant is realistic).
  3. Unified Decision Theory (if we can make progress on the first two, we can then try to unify).
  4. Logical Uncertainty in Decision Theory (if time permits, because it might be needed for bounded CM).
  5. Self-modification (if time permits, but it might be less urgent).

  This ordering is based on:
  - Foundational nature: Bounded CM is a basic building block for many problems.
  - Realism: Both variants are more realistic than their perfect versions.
  - Impact on agent design: Solving bounded CM would change how we build agents that interact with predictors.

  We assume the group has expertise in logic and formal philosophy, so they can handle the mathematical modeling and proofs. They should avoid getting bogged down in engineering details and focus on the decision-theoretic core.

  We also note that the group should be prepared to pivot if one of the lines of inquiry hits a dead end or if a breakthrough in one area makes another easier.
answer: |-
  ### Prioritized Research Agenda for Decision-Theoretic AI Safety  
  **Focus:** Counterfactual mugging (CM), XOR blackmail, and their stochastic/bounded variants.  
  **Constraints:** 2 philosophers, 1 year, zero ML compute. Goal is *agent design impact*—questions that could change how we build decision procedures.  
  **Settled vs. Contested:**  
  - **Settled:** Newcomb-like problems (one-boxing dominates under perfect prediction), basic CM/XOR structure (FDT/UDT pays in CM; refuses all payments in XOR blackmail under perfect information).  
  - **Contested:** Handling *imperfect* predictors (noise/bounds), multi-agent entanglement, and logical uncertainty. FDT/UDT aren’t "solved" here—they crack under realism.  

  #### Brain-Dump: Landscape Overview  
  - **Core Challenge:** Agents must robustly handle predictors (simulated or real) that exploit their decision procedures. CM tests *counterfactual altruism*; XOR blackmail tests *multi-threat coordination*.  
  - **Stochastic XOR Blackmail:** Blackmailer gets a noisy signal of your action. Breaks the standard "refuse-all" Nash equilibrium—noise introduces uncertainty, enabling extortion.  
  - **Bounded CM:** Predictor uses truncated simulation (e.g., 100 compute steps). Breaks FDT’s "pay" prescription—agents might "defect" if simulations are shallow, forfeiting rewards.  
  - **Key Gap:** Existing theories (FDT/UDT) assume omniscient predictors. *Realism breaks them*. We need decision procedures that work when predictors are fallible.  

  ---  
  ### Prioritized Research Questions (Ranked by Impact/Tractability)  
  **Metrics:**  
  - **Impact:** How much would solving this change agent design?  
  - **Tractability:** Can philosophers make progress without compute?  
  - **Upstream:** Does it unlock other problems?  
  - **Overrated Flags:** Questions that *seem* urgent but don’t affect design.  

  #### 1. **Bounded Counterfactual Mugging: Decision Procedures for Truncated Simulations**  
     - **Why Highest Priority?**  
       - Directly upstream of *all* predictor-based problems. Bounded predictors are unavoidable in reality (e.g., AI safety monitors with limited compute).  
       - Breaks FDT/UDT: Agents that "pay" in classical CM get *exploited* if the predictor’s simulation is too shallow to verify compliance.  
       - **Agent Design Impact:** High. Would dictate how to build agents that sacrifice locally to gain globally *without* relying on perfect prediction.  
     - **Tractability for Philosophers:** High. Pure formal logic: model predictors with computational bounds (e.g., time-limited Turing machines), analyze agent responses using proof-based decision theory.  
     - **Key Open Questions:**  
       - What decision procedure maximizes reward when the predictor’s simulation depth is known?  
       - How should agents act when simulation depth is *unknown* (e.g., treat it as logical uncertainty)?  
     - **Next-Year Target:** A bounded FDT variant that achieves ≥90% of optimal utility across simulation depths. *Bump up* if you find a unified strategy; *bump down* if bounds imply unbridgeable tradeoffs.  
     - **Overrated Alternative:** "Improving predictor accuracy" (irrelevant—agents can’t control others’ capabilities).  

  #### 2. **Stochastic XOR Blackmail: Robust Strategies Under Uncertainty**  
     - **Why #2?**  
       - XOR blackmail is a *multi-agent* failure mode (e.g., competing AIs blackmailing each other). Noise breaks the "refuse-all" equilibrium—now extortion is possible.  
       - **Agent Design Impact:** Critical for adversarial settings. A solution would define how agents precommit to deter threats.  
       - **Breaks Classic Answers:** With noise, refusing all payments invites harm (blackmailer misreads your strategy). Complying once can cascade.  
     - **Tractability for Philosophers:** High. Game theory + probabilistic logic. Model blackmailers as Bayesian actors with noisy signals, solve for agent strategies that minimize expected loss.  
     - **Key Open Questions:**  
       - What decision rule makes an agent "unblackmailable" when threats are noisy? (e.g., stochastic precommitments).  
       - How do you handle correlated noise across blackmailers?  
     - **Next-Year Target:** A formal proof that a specific decision procedure (e.g., "pay with probability *p*") reduces extortion risk by ≥50% vs. classical FDT. *Bump up* if you derive robustness bounds; *bump down* if noise makes optimality NP-hard.  

  #### 3. **Unifying Bounded and Noisy Problems Under Logical Uncertainty**  
     - **Why #3?**  
       - Both variants hinge on *logical uncertainty* (e.g., "What would I do in a simulation I know is truncated?"). This is upstream of *all* decision theory with bounded agents.  
       - **Agent Design Impact:** Medium-high. A unified model would simplify agent architectures—no ad-hoc fixes per problem.  
       - **Contested Core:** No consensus on how logical uncertainty interacts with counterfactuals (e.g., can agents "reason about their own bounds"?).  
     - **Tractability for Philosophers:** Medium. Requires merging computational complexity with decision theory. Philosophers excel here (e.g., bounded rationality models).  
     - **Key Open Questions:**  
       - How should agents update beliefs about their own actions under computational limits?  
       - Does boundedness make some CM/XOR problems *unsolvable* without arbitrary choices?  
     - **Next-Year Target:** A framework for "logical uncertainty-aware FDT" that applies to both CM and XOR. *Bump up* if it resolves contradictions; *bump down* if it reduces to heuristics.  
     - **Overrated Warning:** "Solving logical uncertainty generally" (intractable in 1 year; focus only on CM/XOR instantiations).  

  #### 4. **Self-Modification for Threat Resistance**  
     - **Why #4?**  
       - A niche but high-leverage idea: Agents that self-modify to be *provably* unblackmailable (e.g., "I hardcode ‘never pay’").  
       - **Agent Design Impact:** Medium. Could prevent XOR/CM failures *proactively*, but only if threats are detectable pre-deployment.  
       - **Breaks with Realism:** Bounded predictors may not *recognize* your self-modification, making it useless.  
     - **Tractability for Philosophers:** Low-medium. Requires modal logic to model self-reference (e.g., Löb's theorem). Risk of circularity.  
     - **Key Open Questions:**  
       - Can an agent self-modify to "always refuse blackmail" while remaining exploitable in CM?  
       - How does self-modification scale with noisy/bounded threats?  
     - **Next-Year Target:** A proof that self-modification + bounded FDT strictly dominates classical FDT in XOR. *Bump down* if boundedness blocks verification.  

  #### 5. **Overrated/Don’t Bother: "Rehashing Perfect-Prediction Cases"**  
     - **Examples:** Why FDT beats CDT in Newcomb’s, ideal CM payouts.  
     - **Why Skip?**  
       - Settled theory. Zero agent design impact—real systems face *noisy/bounded* predictors.  
       - Philosophers add no value re-litigating consensus.  

  ---  
  ### Why This Order?  
  1. **Bounded CM** is the *most urgent*: It undermines the foundation of predictor-based decisions. Progress here cascades to all problems (e.g., AI safety via limited monitors).  
  2. **Stochastic XOR** addresses multi-agent realism. Philosophers can nail this with game theory.  
  3. **Unification** is high-upshot but harder—prioritize only after #1/#2.  
  4. **Self-modification** is speculative; only pursue if #1–#3 reveal openings.  

  **Stochastic/Bounded Variants Change Everything:**  
  - They turn "solved" problems (e.g., FDT paying in CM) into *traps*.  
  - Urgent questions become: *"How to be opaque to bounded predictors?"* and *"How to signal deterrence under noise?"*  
  - Without these, agents will be exploited in practice.  

  **Execution Plan for 1 Year:**  
  - **Months 1–4:** Attack bounded CM (highest leverage).  
  - **Months 5–8:** Stochastic XOR blackmail (parallelizable).  
  - **Months 9–12:** Unification or self-modification, depending on progress.  
  - **Kill Switches:** Drop any question if no formal progress in 3 months.  

  **Outcome Targets:**  
  - Bounded CM: Decision procedure with bounded optimality proofs.  
  - Stochastic XOR: Game-theoretic strategy with robustness guarantees.  
  - Either would redefine how we build predictors and agents. Ignore the rest if these yield fruit.
