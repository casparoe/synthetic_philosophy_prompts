answer: |-
  Here's a practical 20-minute procedure incorporating looping effects and label drift, designed for frontline use. Key features:  
  - **Red flags** = Immediate handoff to counselor  
  - **Looping risk zones** = Proceed with extreme caution  
  - **Judgment flags** = Where your interpretation is irreplaceable  
  - **Label drift check** = Explicit step to spot self-fulfilling scripts  

  ---

  ### **The Procedure: 20-Minute Assessment Framework**  
  **PHASE 1: IMMEDIATE RISK SCREEN (3 MINUTES)**  
  1. *"Are you thinking about harming yourself or others right now?"*  
     - **✓ Yes** → **STOP. Handoff to counselor immediately.**  
     - ✗ No → Proceed  

  2. *"In the past week, did you do anything that made you worry about your safety?"*  
     - **✓ Yes + Self-harm/suicide attempt** → **STOP. Handoff.**  
     - ✗ No → Proceed  

  **PHASE 2: BEHAVIOR CONTEXT (7 MINUTES)**  
  3. *"When did this start? Was there a big change right before?"*  
     - **▶ Looping risk zone:** If start date aligns with new label (e.g., IEP update) → Flag ⚠️  

  4. *"Where/when does this *not* happen?"*  
     - **✓ Only in labeled contexts** (e.g., "Only when teachers call me ADHD kid") → High looping risk ⚠️  
     - **✗ Everywhere** → Lower looping risk  

  5. *"What do you call what's happening?"*  
     - **✓ Rejects all labels** → Note resistance; may mask severity  
     - **✓ Uses clinical terms loosely** (e.g., "I’m so bipolar") → Label drift ⚠️  

  **PHASE 3: LABEL DRIFT CHECK (6 MINUTES)**  
  6. *"Before people used the term [label], did it feel like this?"*  
     - **✓ "No, it’s different now"** → High drift risk (e.g., self-harm intensifying *after* ED label) → ⚠️  
     - **✗ "It’s the same"** → Lower drift risk  

  7. *"Does the label explain *why* this is happening, or just *what* you’re doing?"*  
     - **✓ Explains *why*** (e.g., "I cut because I’m emotionally disturbed") → Self-fulfilling script → **Refer**  
     - **✗ Describes *what*** (e.g., "I get called disruptive when I tap my pen") → Situational  

  **PHASE 4: DECISION TRIGGERS (4 MINUTES)**  
  **🚩 HANDOFF TO COUNSELOR IF:**  
  - Any **✓** in Phase 1  
  - **✓ + ⚠️** in Phases 2/3 (high looping/drift risk + dysfunction)  
  - Student uses labels as **identity** (Phase 3 Q7)  

  **🟢 MONITOR (NORMAL STRESS) IF:**  
  - Behavior is **situational** (Phase 2 Q4)  
  - No identity adoption (Phase 3 Q7)  
  - Functional baseline maintained (e.g., grades/relationships stable)  

  **❗ JUDGMENT FLAGS (YOUR CALL):**  
  - "Falling apart" without labels (Phase 2 Q5)  
  - Drift risk with no self-harm (Phase 3 Q6)  
  - Resistance to help despite dysfunction  

  ---

  ### **Application to Cases**  
  **Case 1: Freshman Self-Harming Post-IEP Update**  
  - Phase 1: Handoff **immediately** (self-harm = red flag).  
  - **Looping Risk:** Extreme (self-harm onset after "Emotional Disturbance" label).  
  - **Label Drift:** Confirmed if she says, "I’m *being* ED now" (Phase 3 Q7).  
  - **Your Discomfort:** Procedure mandates handoff despite possible iatrogenic effect.  

  **Case 2: Sophomore "Can’t Sit Still" Only in ADHD-Warned Classes**  
  - Phase 1: Proceed (no risk).  
  - Phase 2 Q4: **High looping risk** (context-specific).  
  - Phase 3 Q7: **No referral** if he says, "I fidget because Mr. X expects it."  
  - **Label Drift Check:** Negative (behavior precedes label).  
  - **Judgment Flag:** Is he weaponizing the label to avoid work? Your call.  

  **Case 3: Senior "Falling Apart" Rejecting Labels**  
  - Phase 1: Screen for risk (if yes → handoff).  
  - Phase 2 Q5: **Judgment flag** (resists labels but dysfunctional).  
  - Phase 3 Q6/Q7: **Refer** if dysfunction severe (e.g., skipping meals, isolation).  
  - **Your Discomfort:** Procedure forces referral against stated wishes if safety compromised.  

  ---

  ### **Failure Point**  
  **Your judgment is irreplaceable when:**  
  1. Behavior exists in the **gap between labels** (e.g., senior’s "falling apart" resists categorization).  
  2. **Motivation is ambiguous** (e.g., is the sophomore using ADHD as an excuse, or is it genuine distress?).  
  3. **Cultural/personal factors** make labels harmful even when clinically "accurate."  

  **Procedure Limitations:**  
  - 20 minutes risks false negatives in high-functioning maskers.  
  - Label drift detection relies on self-awareness.  
  - **You must decide:** When clinical language does more harm than good despite meeting referral criteria.  

  **Output:** Clear "handoff/monitor" triggers, but **you own the ambiguity** at the judgment flags.
