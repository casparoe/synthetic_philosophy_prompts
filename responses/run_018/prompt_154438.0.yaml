answer: |-
  Here are five numbered points distinguishing "thermodynamic constitutionalism" from environmental determinism:

  1.  **Focus on Catalytic Trigger, Not Direct Causation:** Non-human forces act as disruptive *triggers* initiating political processes, not as direct *determinants* dictating specific socio-political outcomes like cultural traits or state formation.
  2.  **Institutional Mediation is Central:** Agency resides primarily in the human *institutional responses* (laws, policies, systems) forged in reaction to the shock, which are the actual "co-legislators," not the non-human force itself dictating the legislation.
  3.  **Contested Agency, Not Passive Reception:** Outcomes emerge from inherently *contested political negotiation* among human actors interpreting and responding to the shock, rejecting the determinist view of humans as passive recipients of environmental dictates.
  4.  **Structural Specificity Over Universal Laws:** Responses are *structurally specific*, shaped by pre-existing political institutions, power dynamics, and ideologies, rejecting determinism's reliance on universal environmental laws predicting fixed outcomes.
  5.  **Distributed Agency Through Negotiation:** Non-human forces possess only a *distributed agency*, operating *through* the medium of contested human political action and institutional creation, never bypassing or overriding human political contestation to impose an outcome directly.
