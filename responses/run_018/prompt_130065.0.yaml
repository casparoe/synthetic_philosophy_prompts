prompt: |-
  I'm working through incentive-design problems in distributed systems, and I'm trying to understand cooperation failures through evolutionary game theory rather than institutional sociology. Analyze the 1986 OPEC pricing collapse—when Saudi Arabia abandoned the swing-producer role, switched to netback pricing, and other members immediately overproduced against quotas—as a case study in iterated prisoner's dilemma dynamics. I want a disciplined mapping: identify the actual players (Saudi Arabia, the smaller OPEC states, and non-OPEC producers), define cooperation and defection in terms of quota adherence versus price undercutting, and show how the shadow of the future shrank after 1985 when Saudi reserves and revenue needs changed. Then apply the theory precisely: does Axelrod's tit-for-tat explain the pre-1986 stability and the post-1986 breakdown, or does the episode require a noise-tolerant variant like Generous Tit-for-Tat, given that quota violations were often ambiguous rather than clear-cut? Finally, tell me where the evolutionary-cooperation framework is silent or misleads—specifically, whether the power asymmetry between Saudi Arabia and smaller producers (the ability to unilaterally flood the market) is something direct reciprocity models can capture, and whether indirect reciprocity through reputation with non-cartel buyers actually did the explanatory work. Don't force the framework to speak where it has nothing to say; say honestly what it misses.
