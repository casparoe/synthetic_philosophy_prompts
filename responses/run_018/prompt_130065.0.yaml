  But OPEC's quota violations weren't just ambiguous—they were often covert, like underreporting. GTFT might forgive minor defections, but Saudi's 1986 move was a massive retaliation. So while tit-for-tat captures the structural shift, GTFT doesn't quite fit because Saudi didn't forgive—they escalated. 

  Then there's the power asymmetry. Saudi's ability to flood the market unilaterally isn't captured in standard reciprocity models, which assume symmetric players. Evolutionary models treat players as equals, but Saudi had market-shaping power. This asymmetry let them enforce cooperation pre-1986 but also caused collapse when they defected. 

  Indirect reputation with non-cartel buyers? The user is onto something. Saudi's credibility as a reliable supplier to the West mattered. When they abandoned the swing role, they risked reputation with buyers, not just OPEC members. Evolutionary models focus on direct reciprocity, so this indirect angle is a gap. 

  Finally, what the framework misses: power asymmetry, perception shifts (like Saudi's internal calculus), and non-strategic factors (e.g., the Iran-Iraq war straining quotas). The user needs to know where the model falls short—honesty here is crucial. They're likely building a theoretical model for distributed systems, so understanding these limitations helps them avoid over-application. 

