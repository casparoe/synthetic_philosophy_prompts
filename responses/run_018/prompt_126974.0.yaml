  Okay, the user wants me to act as a philosopher of science specializing in evolutionary theory and cultural transmission. They've asked a complex question about the gene-meme analogy and its limitations when applied to cultural evolution. 

  First, I need to outline the standard gene-meme analogy. Genes are discrete units of heredity that replicate faithfully through DNA copying, with variation introduced through mutations. Memes are supposed to be analogous cultural units - ideas, behaviors, or styles that replicate through imitation. For memes to function as proper Darwinian replicators, they need three key properties: fidelity (copying accuracy), fecundity (replication rate), and longevity (persistence time). The interactor in biology is the organism whose traits interact with the environment, affecting gene replication success. For memes, the interactor would be the human mind or behavior displaying the cultural trait.

  The critical distinction here is between discrete replicators (like genes) versus blended inheritance. Discrete replicators maintain identity across generations through particulate transmission, while blended systems mix traits and lose individual lineages. For a cultural unit to be a true meme replicator, it must be copied as a distinct unit rather than blended or reconstructed.

  Now I need to find a concrete example where this analogy fails structurally in cultural transmission. Legal reasoning seems promising because it involves complex concepts that blend and reconstruct rather than copy discretely. Let me think about legal precedent - say, the "reasonable person" standard in tort law. 

  In this example, what would be the supposed replicator? It might be the abstract concept of the "reasonable person." The interactor would be specific judicial rulings applying this standard. But here's where it breaks down: when judges cite precedent, they're not copying a discrete meme. They're interpreting and reconstructing the concept based on context, blending it with other principles. Even with perfect information about all rulings, we couldn't definitively say whether two applications are copies of the same meme or independent convergences because there's no fixed "sequence" to compare like with DNA.

  This failure happens because transmission involves reconstruction rather than copying, and selection acts on vehicle success (case outcomes) without cleanly affecting meme frequency. Also, the boundaries are arbitrary - where does "reasonable person" end and "due care" begin?

  To repair the analogy, we'd need to incorporate interpretive reconstruction as inherent to cultural transmission, not just noise. The unit of selection wouldn't be discrete memes but something more like conceptual lineages maintained through constrained reinterpretation.

  The user seems deeply knowledgeable about evolutionary theory - this isn't a beginner's question. They're probing the fundamental limits of applying biological models to culture. I should avoid oversimplifying while making the structural failure clear. The legal example works well because it shows how even "precise" cultural domains involve unavoidable interpretation.
answer: |-
  ## The Limits of Memetic Replication: A Case from Legal Reasoning

  ### Core Framework: Gene-Meme Analogy & Replicator Requirements
  1.  **Standard Analogy:**
      *   **Gene (Replicator):** A discrete unit of hereditary information (e.g., a specific DNA sequence coding for a protein) that is:
          *   **Copied Faithfully:** Replicated with high fidelity (mutations are errors, not the norm).
          *   **Particulate:** Maintains its distinct identity across generations; offspring inherit distinct alleles rather than blended averages.
          *   **Causes Phenotype:** Interacts with the environment (via development) to produce effects (phenotype/traits).
      *   **Organism/Phenotype (Interactor/Vehicle):** The entity (e.g., an individual animal) whose traits, *caused by the replicator(s)*, interact directly with the environment. Its success (survival, reproduction) *differentially* affects the replication success (frequency) of the replicators it carries.
      *   **Selection:** Environmental pressures act on the interactor (e.g., predator eats slow rabbit). This differential survival/reproduction of interactors causes a differential increase in the *frequency* of the specific replicators (genes) that contributed to the successful traits in the population.

  2.  **Cultural Replicator (Meme) Requirements:**
      For a cultural unit to be a discrete replicator analogous to a gene, it must:
      *   **Be Discrete:** Have identifiable boundaries separating it from other memes.
      *   **Replicate Faithfully:** Be transmitted from mind to mind (or artifact to mind) with sufficient accuracy to preserve its core identity across transmissions; variation should be error-like mutation, not inherent blending.
      *   **Cause Phenotype:** Generate specific behavioral/artifactual expressions (the interactor/vehicle).
      *   **Participate in Differential Replication:** The success of its *vehicle* (e.g., a behavior, ritual performance, artifact use) should directly and primarily determine the differential copying *frequency* of the specific meme itself within the cultural population.

  **The critical distinction:** Blended inheritance (e.g., mixing paint colors) erodes discrete lineages. Particulate inheritance (e.g., shuffling discrete beans) preserves them. Memetics requires particulate cultural transmission.

  ### Conceptual Failure Case: Legal Precedent & the "Reasonable Person" Standard

  *   **Putative Replicator:** The abstract legal concept of the "reasonable person" (RP) – a hypothetical individual exercising average care, skill, and judgment.
  *   **Putative Interactor/Vehicle:** Specific judicial rulings or jury verdicts in tort law cases (e.g., negligence claims) *applying* the RP standard to determine liability.

  **Where the Mapping Collapses Structurally:**

  1.  **Transmission is Reconstruction, Not Copying:** When a judge applies the RP standard in a new case, they do not simply "copy" the meme from a prior ruling. They *reconstruct* the concept based on:
      *   Multiple, often conflicting, prior rulings (each interpreting RP differently based on context).
      *   Current societal norms and values (what *is* "reasonable" today?).
      *   Specific facts of the novel case.
      This reconstruction inherently blends elements from various sources and adapts the concept to new circumstances. The output is not a discrete copy of an input meme; it's a unique synthesis.

  2.  **Indeterminate Boundaries & Lineage:** Is the RP standard in a 2023 product liability case the *same meme* as the RP standard used in an 1850 carriage accident case? Or a different meme? Or a descendant?
      *   The core *label* ("reasonable person") remains, but its *meaning* shifts continuously through judicial interpretation and societal change.
      *   There is no non-arbitrary way to define the "unit" of the RP meme. Is it the label? A specific definition from a key case? The entire evolving body of case law? The boundary is inherently porous and context-dependent. Claims of "copying" or "descent" become interpretative judgments, not objective facts discernible even with perfect transmission data.

  3.  **Selection Acts Primarily on Vehicle Success, Not Cleanly on Replicator Frequency:** "Success" (winning the case, establishing persuasive precedent) directly impacts the *specific ruling* and the *judge's reputation*. It *indirectly* influences the perceived validity of *legal reasoning methods* and *broad concepts* like RP.
      *   However, this success does *not* cleanly translate to the differential replication of a *discrete* RP meme. Winning a case using RP reasoning reinforces:
          *   The *authority of the court/judge*.
          *   The *overall framework of tort law and negligence*.
          *   The *utility of abstract standards*.
          *   *Specific interpretations* of RP relevant to *that specific context* (e.g., "reasonable cybersecurity").
      *   It's difficult to isolate the replication success of "the RP meme" itself from the success of the broader legal paradigm, the specific arguments used, or the judge applying it. Selection favors effective *vehicles* (successful rulings/arguments) which are complex blends of multiple concepts and contextual factors, not discrete replicators.

  **The Structural Failure:** Even with perfect knowledge of every judicial utterance and written opinion, determining whether the RP concept in Case B is a *copy* of the RP concept in Case A, a *mutated descendant*, or an *independent convergence* (based on similar societal logic) is fundamentally indeterminate. The process of legal reasoning is inherently interpretive and recombinatory, blurring lineage and boundaries. The "replicator" (the abstract concept) lacks the necessary discreteness and fidelity for the biological replicator-interactor dynamic to map cleanly. Selection acts on the success of complex vehicles (rulings/arguments) which embody blended conceptual lineages, not on the frequency of discrete memes.

  ### Repairing the Analogy: Required Feature
  To accommodate cases like legal precedent (and many cultural phenomena), a repaired analogy must explicitly incorporate **interpretive reconstruction and constrained transformation as the *core mechanism* of transmission**, rather than treating them as noise corrupting an ideal of faithful copying. The unit of evolution cannot be a discrete, atomistic replicator like a gene. Instead, the analogy must focus on **lineages of *ideas* or *practices* that maintain coherence through time *despite* continuous reinterpretation and adaptation, governed by systems of constraints (e.g., legal principles, ritual structures, musical grammars) that shape but do not eliminate the inherent blending and transformation during transmission.** Success depends on the *effectiveness of the reconstructed expression* within its specific context, impacting the *diffusion and persistence of the lineage*, not the replication count of a fixed unit. This moves away from a strict gene-parallel towards a model emphasizing *descent with modification under constraint*, where "replication" is replaced by "reconstruction guided by tradition/rules."
