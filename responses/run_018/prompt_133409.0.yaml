answer: |-
  1. Pharmacist = consumer; prescription = meal choice; patient(s) = animal(s) killed; "walking out" = choosing no animal products.  
  2. The pill analogy assumes each death *causes* demand (like swallowing a pill creates need for another), but if producers maintain flock size regardless of individual deaths (non-marginal impact), the "pill" connection breaks—no consumption may not prevent future killings.  
  3. Crop deaths (rodents, birds, insects in plant agriculture) are excluded from the pharmacy—they occur "outside" (the parking lot) but are still financed by purchases inside (animal feed & human crops), so "walking out" doesn’t evade them.  
  4. Adding feed-conversion ratios (calories lost raising animals) and crop mortality per calorie shows "walking out" likely reduces net harm: fewer crops are needed for direct human consumption than for animal feed, lowering parking lot deaths overall.  
  5. A tighter analogy: choosing beef/chicken is buying pills *with known collateral poisoning in the supply warehouse*; veganism is buying cleaner pills from a smaller warehouse—acknowledging harm isn't escaped, just reduced.
