answer: |-
  Here’s a sharpened research proposal addressing your core question, structured for a term paper/grant application. It balances formal ambition with realistic scope while preserving philosophical depth.

  ---

  **Research Question:**  
  *Can Risk-Weighted Expected Utility (REU) theory accommodate structurally ambiguous catastrophic outcomes through a second-order "domain-gating" mechanism—applying risk weights to epistemic partitions of the outcome space rather than directly to outcomes—while retaining REU’s axiomatic foundations and representation theorem?*

  ### Why the Question is Open & Underexplored  
  1. **REU’s Standard Assumption of Value Determinacy**: Existing REU models (e.g., Buchak’s framework) presuppose a fixed outcome space with pre-defined utilities. Risk weights transform probabilities of *known* outcomes, but do not handle cases where the outcome space itself is epistemically fragmented (e.g., catastrophes involving post-decision value incommensurability).  
  2. **Ambiguity vs. Structural Ambiguity**: Ambiguity models (e.g., max-min EU, smooth ambiguity) focus on uncertainty over *probabilities*, not uncertainty over the *ontology* of outcomes. Your "structural ambiguity" concerns undefinable outcomes *ex ante*, which these frameworks explicitly exclude by assuming a shared outcome set.  
  3. **REU’s Treatment of "States"**: While REU uses state-dependent utilities, states are typically seen as resolving *which outcome occurs*, not *what the outcome fundamentally is*. Your cases require states to resolve the *meaning* of outcomes (e.g., whether "human extinction" entails erased value or transformed value). Current REU lacks tools for this meta-uncertainty.  

  ### Methodology  
  **1. Formal Modeling (Core Focus):**  
     - **Step 1**: Define a two-tiered outcome space:  
       - **Partitions** (\( \mathcal{P} \)): Epistemic categories (e.g., "catastrophe preserves commensurability" vs. "catastrophe induces value rupture").  
       - **Sub-Outcomes** (\( \mathcal{O}_p \)): Outcomes *conditional* on partition \( p \in \mathcal{P} \).  
     - **Step 2**: Propose a "gated REU" functional form:  
       \[
       V(A) = \sum_{p \in \mathcal{P}} \rho_p \left( \sum_{i} \pi_i \cdot u_p(o_i | p) \right) \quad \text{with} \quad \rho_p \text{ as partition risk weights}.
       \]  
       Here, \( \rho_p \) weights the *entire sub-problem* within partition \( p \), while standard REU risk-weighting applies *within* each \( p \).  
     - **Step 3**: Axiomatize preferences over acts that expose agents to ambiguous partitions. Key challenges:  
       - Maintaining **Coherence**: Avoiding Dutch books across partitions.  
       - Preserving **Stochastic Dominance**: Ensuring catastrophic sub-outcomes in one partition don’t violate dominance if valued differently in another.  
       - Testing **Continuity**: Whether small changes in partition probabilities induce small preference changes (problematic if partitions represent radical discontinuities).  

  **2. Conceptual Analysis (Supporting Role):**  
     - Examine if representation theorems (e.g., Buchak’s linearity in mixtures) can hold when acts mix outcomes from *incommensurable* partitions.  
     - Determine whether \( \rho_p \) must satisfy the same conditions as standard REU risk weights (e.g., convexity for pessimism) or if new constraints apply.  

  ### Possible Results & Significance  
  - **Positive Result**: A consistent gated REU model exists where:  
    - \( \rho_p \) is derived from preferences over "gate lotteries" (choices triggering partition resolutions).  
    - Representation holds under revised axioms (e.g., restricted continuity, partition-wise mixture independence).  
    *Significance*: REU can handle deep uncertainty about outcome ontology without collapsing into rival models.  

  - **Negative Result**: Any gated extension either:  
    - Violates REU’s core axioms (e.g., continuity forces \( \rho_p \) to collapse to linearity → reverts to subjective EU).  
    - Requires ad hoc restrictions (e.g., partitions must be "utility-isomorphic") that nullify the ambiguity.  
    *Significance*: Reveals REU’s implicit commitment to value determinacy, limiting its applicability to catastrophic risks.  

  - **Partial Result**: Gated REU works only for:  
    - Coarse partitions (e.g., binary: "commensurability preserved" vs. "lost").  
    - Specific risk-weight regimes (e.g., extreme pessimism "gates off" ambiguous catastrophes entirely).  
    *Significance*: Clarifies boundary conditions for REU’s use in existential risk contexts.  

  ### Realistic Scope for One Semester  
  **Feasible Core:**  
  - Formalize the gated REU framework for a finite-outcome, binary-partition case (e.g., "AI alignment success" vs. "value rupture").  
  - Derive necessary/sufficient axiomatic conditions for representation.  
  - Prove whether the model avoids equivalence to imprecise probability (e.g., show \( \rho_p \) doesn’t reduce to credal-set weighting).  
  - Illustrate with one applied case (e.g., long-term AI governance).  

  **Likely Boundaries:**  
  - **Not Feasible**: Full generalization to \( n \)-partitions or continuous spaces; exhaustive comparison with all ambiguity models; dynamic consistency analysis.  
  - **Defer**: Empirical validation; comprehensive treatment of incommensurability (philosophy of value aspects).  

  **Growth Pathways:**  
  A negative/partial result could spawn follow-ups:  
  - Could REU+gate function as a heuristic despite formal limitations?  
  - Does this reveal a need for hybrid models (e.g., REU + conceptual uncertainty metrics)?  

  ### Why This Matters  
  This probes whether REU’s success with probabilistic risk attitudes *presupposes a stable value framework*—a vulnerability in domains where risk sensitivity matters most. Whether the answer is yes or no, it forces a critical reevaluation of REU’s role in existential ethics.  

  ---  
  **Sharpness Checklist:**  
  ☑️ Precise, answerable question  
  ☑️ Clear gap in REU literature (value determinacy vs. structural ambiguity)  
  ☑️ Methodology focused on formal extensions + axiomatic analysis  
  ☑️ Differentiated outcomes (positive/negative/partial)  
  ☑️ Scope constrained to foundational extension (not full applied theory)  

  Let me know if you’d like to refine the gate mechanism’s formalism or emphasize specific philosophical implications!
