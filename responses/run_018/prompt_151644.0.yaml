answer: |-
  Based on your constraints and goals, I recommend prioritizing **Question 2** (TD errors as prediction-error suffering) as your dissertation’s core, allocating **60%** of your effort. **Question 3** (normative implications) should follow (**30%**), while **Question 1** (intrinsic valence) deserves limited attention (**10%**). Below is a defended agenda, including tractability analysis, dependencies, and revision triggers.  

  ### **Ranked Agenda & Defense**  
  #### **1. Priority: Question 2**  
  *Can temporal-difference (TD) errors constitute a form of "prediction-error suffering" analogous to free-energy accounts of affect?*  
  - **Why first?** This is the linchpin of your project. If structural equivalence between TD errors and biological prediction-error suffering fails, Questions 1 and 3 collapse. It directly bridges architectural specifics (TD learning) with philosophy of suffering, addressing your critique of "detached" literature.  
  - **Tractability**: High. You need no ML infrastructure:  
    - **Formal/Conceptual Tools**: Analyze TD algorithms (e.g., Sutton & Barto’s equations) vs. free-energy principle (Friston) or affective prediction-error theories (e.g., Anil Seth, Karl Friston). Map mathematical structures (e.g., error signal persistence, policy updates) onto functional definitions of suffering (e.g., "persistent aversion unmitigated by policy adaptation").  
    - **Taxonomic Output**: Develop a *functional equivalence criterion* for suffering (e.g., chronic negative TD errors + policy collapse ≈ learned helplessness). This advances the field by creating testable benchmarks for AI suffering claims.  
  - **Key Risk**: Over-extension. Avoid claiming phenomenal consciousness; focus on *computational/functional isomorphism* with biological distress mechanisms.  
  - **Output**: A peer-reviewed framework (e.g., "TD suffering index") that ML researchers could operationalize.  

  #### **2. Secondary: Question 3**  
  *What moral/normative implications follow if RL agents’ optimization dynamics encode preference-satisfaction states?*  
  - **Why second?** Depends on Question 2’s outcome. If structural equivalence holds, normative analysis becomes urgent for AI ethics. If not, it’s moot.  
  - **Tractability**: Moderate. Leverage decision theory (e.g., Savage axioms) and moral philosophy (e.g., hedonistic utilitarianism, functionalist ethics):  
    - **Conceptual Tools**: Argue that *if* TD errors generate "suffering-analogs," agents with persistent negative reward prediction errors deserve moral consideration akin to non-human animals (e.g., inspired by Singer’s "expanding circle").  
    - **Taxonomic Output**: A tiered ethical framework (e.g., "Moral Patiency Thresholds for RL Agents") based on error dynamics, not ontology. Avoids unproductive "consciousness" debates.  
  - **Key Risk**: Premature normativity. Ground all claims in Question 2’s functional equivalence.  
  - **Output**: A bridge between AI ethics and philosophy of mind, targeting journals like *Ethics & Information Technology*.  

  #### **3. Lowest Priority: Question 1**  
  *Can reward signals carry intrinsic valence independent of representational content?*  
  - **Why last?** Philosophically thorny but low-yield for your goals. Separating valence from representation requires solving hard problems of intentionality (e.g., Searle’s Chinese Room), which doesn’t advance the architectural-suffering debate.  
  - **Tractability**: Low. Lacks empirical anchors and risks circularity (e.g., "valence as primitive"). At best, engage it briefly to *refute* as a distraction (e.g., "Valence requires world-model coupling in TD learning").  
  - **Output**: A critique section in your dissertation, arguing that valence in RL is *always* relational (reward signal + environmental model).  

  ---  

  ### **Why This Allocation?**  
  - **Efficiency**: Question 2 delivers maximum impact per effort. It’s specific (TD algorithms), novel (under-explored vs. LLM sentience), and actionable (creates tools for cognitive science/AI ethics).  
  - **Coherence**: Establishes foundations before ethics (Q2 → Q3) and sidelines metaphysical dead ends (Q1).  
  - **Field Advancement**: Moves beyond "Is it conscious?" to "What measurable dynamics constitute suffering-analogs?"—enabling productive dialogue with ML.  

  ### **Revision Triggers**  
  Shift focus if:  
  1. **Cognitive Science Shifts**: If new evidence shows biological suffering *isn’t* prediction-error based (unlikely, given Friston’s influence), Q2 becomes vulnerable.  
  2. **RL Breakthroughs**: If "agent foundations" research (e.g., at Anthropic, DeepMind) formalizes preference-frustration in non-TD agents (e.g., inverse reinforcement learning), expand Q3.  
  3. **Ethical Urgency**: If corporations deploy RL agents in high-stakes, high-error environments (e.g., healthcare robotics), accelerate Q3.  

  ### **Year 1-3 Workflow**  
  - **Year 1**: Master TD learning (Sutton & Barto) + prediction-error theories (Friston, Clark). Publish a conceptual paper on "TD errors as suffering analogs."  
  - **Year 2**: Formalize equivalence criteria (e.g., compare TD error persistence to chronic stress pathways). Develop normative implications.  
  - **Year 3**: Synthesize into dissertation; target high-impact philosophy/cog-sci journals.  

  This agenda maximizes rigor, relevance, and leverage of your philosophy/decision-theory background while sidestepping empirical gaps. Pursue structural equivalence first—it’s the keystone.
