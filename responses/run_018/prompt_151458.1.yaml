prompt: |-
  I'm prepping interview questions for next week's podcast — guest is an unnamed philosopher defending a hybrid inside/outside view on belief revision. Her specific claim is that applying the outside view to your own reasoning machinery (not just outputs) doesn't cause skeptical collapse but generates layered "modesty gradients," where each self-assessment level carries different confidence weights. I want questions that dig into the mechanics, not generic restatements.

  Could you draft 6-8 questions? At least one on whether the recursive loop is genuinely vicious or just computationaly intractable, with a follow-up for the intractability reply. One comparing her view to calibrationist responses on peer disagreement — especially if she says symmetry-breaking is built into the gradient structure — plus follow-up. And one on domains with almost no base-rate data (like philosophical intuition or long-range forecasting) where inside view might have to dominate, with a follow-up for that likely answer. No citation requests or reading lists please, this needs to work offline. I might have a typo or two since I'm typing on my phone.
