answer: |-
  The slogan "Sex work is work, full stop" operates as a condensed rhetorical device, compressing several distinct but often conflated propositions. Its power in debate stems precisely from its ability to slide between descriptive, normative, and categorical registers, appearing self-evident while carrying significant, contestable assumptions. Untangling its machinery requires parsing its potential meanings along a spectrum from minimal to maximal claims.

  At its most minimal, the statement functions as a tautological recognition of economic exchange: any activity where a service is provided in return for remuneration can be descriptively categorized as "work" in the broadest economic sense. On this reading, it's a platitude affirming that sexual services involve a transaction. This baseline observation doesn't inherently prescribe *any* specific legal or regulatory framework, nor does it engage with the nature of the exchange. It simply notes participation in an economy. While logically sound, it offers no substantive guidance for labor categorization or policy, and certainly doesn't address the distinctive concerns about coercion or trafficking that animate critics.

  A more substantive, defensible claim emerges when "is work" signifies that sex work shares sufficient features with other forms of labor to warrant inclusion within existing occupational health and safety (OHS) and labor law frameworks. Here, the argument is comparative and functional: like other service workers, sex workers face workplace hazards (violence, injury, disease, mental stress, wage theft), and the mechanisms designed to mitigate these risks in recognized employments – safety protocols, recourse for grievances, minimum standards – are applicable and necessary. This reading actively supports extending standard OHS and labor statutes to brothel settings, viewing them as workplaces. It aligns strongly with the New Zealand model's core rationale, which integrates brothels into labor inspectorates and health regulations precisely by treating the work as comparable *in its need for protection* to other occupations. This claim doesn't *necessarily* deny that sex work might have distinctive elements; it asserts that these elements don't negate the fundamental worker need for safety and rights, and that existing frameworks are adaptable. It counters the exceptionalism that leaves sex workers uniquely vulnerable by regulatory neglect.

  However, the slogan often carries a stronger, radically revisionary interpretation: "is work" implies not just economic exchange or comparable need for protection, but that sex work is *morally and structurally indistinguishable* from other forms of service labor, possessing "no distinctive features" justifying exceptional regulation. This maximal claim dismisses structural-objection arguments (e.g., inherent objectification, irreducible intimacy blurring labor boundaries, uniquely potent demand-driven exploitation dynamics) as prejudice masquerading as analysis. It treats objections rooted in feminist critiques of commodification or Nordic-model concerns about the inherent power imbalances amplified by commercialized sexual demand as illegitimate attempts to morally exceptionalize the work. When the slogan is deployed to definitively "end the matter," it frequently relies on this maximal reading. It is this interpretation that most directly fuels the argument for New Zealand-style decriminalization *over* the Nordic model, as the latter's asymmetrical criminalization of buyers is predicated precisely on the view that the *demand* side is uniquely harmful and exploitative in this specific market. The maximal claim rejects that foundational premise, asserting that regulating buyers is discriminatory overreach against a legitimate service transaction, akin to criminalizing clients of massage therapists or hairdressers.

  Crucially, the slogan, on *any* reading beyond the minimal tautology, generally **fails to directly engage the core Nordic concern about demand-driven exploitation.** The Nordic model focuses on deterring the creation of the market itself (through criminalizing buyers) to reduce trafficking and exploitation, arguing that legalization/decriminalization *normalizes* and expands harmful demand. "Sex work is work" sidesteps this by shifting focus entirely to the *supply* side – the worker's status and rights within the existing market. It counters Nordic paternalism by asserting worker agency and demanding rights *as workers*, but it doesn't refute the empirical claim that commercialized sexual demand inherently fuels coercion and trafficking on a systemic level; it often simply rejects that claim as essentialist or ignores it by changing the subject to labor rights. The slogan prioritizes the immediate safety and autonomy of the worker within the transaction, while the Nordic model prioritizes dismantling the transactional structure believed to cause systemic harm. They operate on fundamentally different analytical planes – labor integration versus market suppression.

  Therefore, the machinery of "Sex work is work, full stop" runs on ambiguity. It can be an uncontroversial observation of economic activity, a powerful argument for extending essential labor protections based on functional comparability of risks, or a contentious assertion of moral equivalence used to dismiss critiques of the sex trade's structural dynamics. Its effectiveness in shutting down debate often depends on conflating these levels. While the functional comparability claim robustly supports extending OHS/labor law to brothels and underpins the New Zealand model's approach, the maximal moral equivalence claim is typically invoked to defend that model *against* Nordic critiques, albeit by largely bypassing, rather than resolving, the specific empirical and normative concerns about demand that animate the Nordic alternative. The slogan powerfully asserts the worker's perspective and demands inclusion within protective frameworks, but it does not inherently contain the tools to answer whether recognizing it as work *within* a market structure adequately addresses, or inadvertently exacerbates, the systemic forces of exploitation that shape that very market.
