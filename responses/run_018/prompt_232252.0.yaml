prompt: |-
  Next week I am leading a two-hour seminar that sits between philosophy and cognitive science, and the topic is how a thinker moves from a handful of examples to a concept that governs indefinitely many new cases. I want the entire session built around Bongard problems — the two-panel displays in which every box on the left satisfies some rule that every box on the right violates, and the solver must recover the rule from only six positive boxes and six negative boxes. The students will not have seen these before, and most will arrive assuming that induction is just tabulating the features shared by the positive cases. Do not give me the explanation; give me a plan for the explanation.

  First, the order of ideas and the dependency structure behind it: what must be in place before negative examples can be taught as anything other than a test, and why the underdetermination problem — that indefinitely many rules divide the same twelve boxes — should be raised only after the students have caught themselves proposing a rule and then having it wrecked by a box they ignored. Second, one carrying example: a Bongard-style rule of your own invention, with a clear account of what it must do and avoid. It should resist any rule that is a mere conjunction of visible shape-properties, and its negative examples must be constructed to destroy the obvious wrong rules rather than merely to fail the target rule. Third, a misconception map, in order: that the concept is just the common features; that one more positive example would settle which of two rival rules is correct; that the right rule is whichever is simplest; that the negatives are only a check on a rule one has already formed. For each, say exactly where in the sequence to head it off and how. Fourth, a way to check at the end whether the students have grasped the relation between the examples and the rule, rather than merely produced a rule that sorts the panels. Finally, say what I should openly decline to settle at this level — for instance, whether concepts in general are Bongard-style rules — and why leaving that open helps the lesson.
reasoning: |-
  We are designing a two-hour seminar on concept induction using Bongard problems. The goal is to challenge the students' initial assumption that induction is just tabulating shared features of positive examples. The plan must build understanding step by step, using a carefully crafted example and addressing common misconceptions.

  **Order of Ideas and Dependency Structure**

  1. **Start with Positive Examples Only (15 minutes)**
     - Present a Bongard problem with only the six positive examples (left panels) visible. Ask students to write down what they think the rule is. They will likely propose a rule based on shared features (e.g., "all have circles").
     - **Why:** This activates the initial misconception that the concept is just the common features.

  2. **Introduce Negative Examples as More Than a Test (20 minutes)**
     - Reveal the six negative examples (right panels). Ask students to check their proposed rule against the negatives. Their initial rules will fail because they will classify some negative as positive or vice versa.
     - **Why:** This forces them to see that negatives are not just a test but are integral to forming the concept. They must now revise their rule.

  3. **Experience of Rule Failure Leads to Revision (15 minutes)**
     - Have students work in small groups to come up with a new rule that fits all twelve examples. They will propose new rules, but the instructor should note that some groups might still have rules that break on an example they haven't considered. The point is to let them experience the process of being wrong and revising.
     - **Why:** This sets the stage for the underdetermination problem by showing that one set of examples can support multiple rules until a critical example breaks one.

  4. **Introduce Underdetermination (15 minutes)**
     - After groups share their rules, point out that even though they have a rule that works for the given twelve, there might be another rule that also fits. Illustrate with a new example (a 13th box) that their rule and an alternative rule would classify differently. Ask: "How do you know which rule is right?"
     - **Why:** Now they see that the same twelve examples can be divided by multiple rules. This raises the problem of underdetermination and the need for more than the current examples.

  **One Carrying Example**

  We need a Bongard problem that resists simple feature conjunctions and has negatives designed to break obvious wrong rules.

  - **Example Rule:** "The figure contains exactly one shape that is not a circle." 
    - *Positive examples (left):* 
      1. One square and one circle.
      2. One triangle and one circle.
      3. One circle and one star.
      4. One circle and one heart (so two shapes, one non-circle).
      5. One circle and two squares (but note: exactly one non-circle? No, two non-circles. So we must avoid that. Let me revise.)
    - Revised rule: "The figure contains exactly one non-circle." 
      - Positive: 
        1. One circle and one non-circle (e.g., square).
        2. Two circles and one non-circle? No, that would be one non-circle -> positive.
        3. One non-circle (and no circles) -> positive? But wait, the rule says "exactly one non-circle", so if there are no circles, that's still one non-circle -> positive. 
      - However, we must avoid positive examples that have multiple non-circles? The rule is about the count of non-circles. So:
        - Positive: exactly one non-circle (any number of circles allowed? Actually, the rule doesn't specify circles. It's about non-circles: there must be exactly one non-circle. So:
          - Example 1: one square (non-circle) and two circles -> exactly one non-circle -> positive.
          - Example 2: one triangle -> positive (one non-circle).
          - Example 3: one star and one circle -> positive.
          - Example 4: one circle -> no non-circle? That would be zero -> negative? But wait, we want positive to have exactly one non-circle. So no circle only is negative? Let me clarify.

    We must design the examples carefully:

    - **Target rule:** "There is exactly one non-circular shape in the figure." (The figure may have any number of circular shapes, but must have exactly one non-circular shape.)

    - Positive examples (left):
      1. One triangle (only one shape, which is non-circular) -> exactly one non-circle -> positive.
      2. One circle and one square (one non-circle) -> positive.
      3. One circle and two circles and one square (three circles and one square -> one non-circle) -> positive.
      4. Two circles and one triangle -> positive.
      5. One pentagon -> positive.
      6. One circle and one star -> positive.

    - Negative examples (right) must destroy obvious wrong rules:
      - Obvious wrong rule 1: "There is a non-circle." 
          - Destroy by: a negative example with one non-circle? But that would be positive. Instead, we want negatives that have non-circles but break the count. So:
          - Negative 1: two non-circles (e.g., two squares) -> violates because there are two non-circles (but the wrong rule "has a non-circle" would pass it).
          - Negative 2: no non-circles (e.g., one circle) -> violates because zero non-circles (and the wrong rule "has a non-circle" fails this, so it's a good negative to break the count rule? Actually, for the target rule, zero non-circles is negative. For the wrong rule "has a non-circle", this negative example (only circles) would be correctly rejected. So we need a different wrong rule to break.

    Let's design negatives to break common wrong hypotheses:

      - Hypothesis A: "The figure has at least one non-circle." 
          - Break with: a negative example that has no non-circles (e.g., only circles) -> this would be negative for our rule (because zero non-circles) and also negative for Hypothesis A? Actually, Hypothesis A would call it negative? So it doesn't break. We need a negative example that Hypothesis A would call positive but our target rule does not.

          - Our target rule requires exactly one non-circle. So if we have a negative example with two non-circles (e.g., two squares), then:
            - Hypothesis A (at least one non-circle) would call it positive, but it should be negative -> so this example breaks Hypothesis A.

      - Hypothesis B: "The figure has only circles." 
          - Break with: a positive example that has a non-circle (like any positive) and also a negative example that has non-circles? Actually, we already have negatives that are only circles and negatives that are two non-circles. So:

      - We design negatives to break multiple wrong rules:

        Negative examples (right):
          1. Two squares (two non-circles) -> breaks Hypothesis A (which would say positive) and also breaks a rule like "has at most one shape" (if we had any positive with two shapes) but we do have positives with two shapes? So we must be careful.

        To break Hypothesis A: we need a negative that Hypothesis A would incorrectly label as positive. Hypothesis A: "at least one non-circle". So a negative with two non-circles would be called positive by Hypothesis A, but it's actually negative -> so it breaks.

        Also, we want to break a rule that focuses on the presence of circles? For instance, Hypothesis C: "has a circle and a non-circle". 
          - Break with: 
            - Positive example that has no circle (like one triangle) -> Hypothesis C would fail to label it positive? So that positive breaks Hypothesis C.
            - Also, a negative example that has a circle and a non-circle? But that would be positive for our rule? No, because if it has one circle and one non-circle, that's exactly one non-circle -> positive. So we cannot have that as negative.

          Instead, we break Hypothesis C with a positive that has no circle (so one non-circle and no circles) and a negative that has multiple non-circles (which may or may not have circles). 

        So let's design:

          Positive (left): 
            1. One triangle. (exactly one non-circle, no circle)
            2. One circle and one square. (one non-circle)
            3. One circle and two circles and one square. (three circles and one square -> one non-circle)
            4. One circle and one triangle. (one non-circle)
            5. One pentagon. (one non-circle)
            6. One circle and one star. (one non-circle)

          Negative (right):
            1. Two squares. (two non-circles, no circle) -> negative because exactly two non-circles.
            2. One circle. (zero non-circles) -> negative.
            3. One square and one triangle. (two non-circles) -> negative.
            4. One circle and two squares. (two non-circles) -> negative.
            5. Three circles. (zero non-circles) -> negative.
            6. One circle, one triangle, and one square. (two non-circles) -> negative.

        Now, the negatives break:
          - Hypothesis A (at least one non-circle): negatives 1,3,4,6 have non-circles, so they would be incorrectly accepted as positive by Hypothesis A, but they are negative.
          - Hypothesis B (only circles): negatives 1,3,4,6 break it because they have non-circles? Actually, no: Hypothesis B would reject them (correctly) because they have non-circles. But we have positive examples that break Hypothesis B (any positive with a non-circle). So we don't need to worry about Hypothesis B for negatives? 
          - Hypothesis C (has both a circle and a non-circle): 
              - It would accept positive examples 2,3,4,6 (which have both) but fail on positive example 1 and 5 (which have no circle). So positive example 1 and 5 break Hypothesis C.

        This example forces a rule about the count of non-circles and cannot be captured by a simple conjunction of presence/absence.

  **Misconception Map**

  1. **Misconception: The concept is just the common features.**
     - **When to address:** At the beginning, when students are only shown positives and propose a rule. Then, after showing negatives, their rule breaks. 
     - **How:** After revealing negatives, ask: "Why did your rule, based on the positive examples, fail? What did you miss?" Then emphasize that negatives show what the rule must avoid.

  2. **Misconception: One more positive example would settle which of two rival rules is correct.**
     - **When to address:** After introducing underdetermination (step 4 above).
     - **How:** After they see that two rules fit the twelve examples, present a 13th example that one rule would classify as positive and the other as negative. Ask: "How would you decide which rule is right? You can't without more information." Then, explain that we often need examples that are critical tests (designed to distinguish between rival rules).

  3. **Misconception: The right rule is whichever is simplest.**
     - **When to address:** After they have experienced underdetermination and are discussing how to choose between rules.
     - **How:** Ask: "How do you define simplicity? Number of words? Number of conditions?" Then, show that sometimes a more complex rule is the intended one. For instance, in our example, the rule "exactly one non-circle" might be considered more complex than "has a non-circle", but it's the correct one. Also, note that simplicity might be context-dependent.

  4. **Misconception: The negatives are only a check on a rule one has already formed.**
     - **When to address:** When introducing negatives (step 2) and during group work (step 3).
     - **How:** During group work, ask the groups to use the negatives to help them form the rule, not just test. Encourage them to look at the negatives and ask: "What is it about this negative that makes it negative? How is it different from the positives?"

  **Check for Understanding**

  At the end, to check if they grasp the relation between examples and rule (beyond just sorting the given panels):

  - **Probe:** Present a new Bongard problem (with six positives and six negatives) and ask them to form the rule. Then, ask them to design a new example (a 13th box) that would be a positive case and explain why. Also, ask them to design a 13th box that would be a negative and explain why. 
    - **Why:** This requires them to understand the rule well enough to generate new examples, which shows they have internalized the concept and are not just pattern-matching the given twelve.

  **What to Decline to Settle**

  - Openly decline to settle: "Whether concepts in general are Bongard-style rules."
  - **Why:** The goal of the session is to illustrate the process of concept induction and the role of examples (both positive and negative) in underdetermined settings. By not claiming that all concepts are like this, we avoid overgeneralization and keep the focus on the learning mechanism. This helps the lesson because it allows the students to take the insight about induction without getting bogged down in philosophical debates about the nature of concepts.

  **Timing Breakdown (Approximate)**

  - Introduction and positives only: 15 min
  - Reveal negatives and first revision: 20 min
  - Group work on forming the rule: 15 min
  - Sharing and underdetermination: 15 min
  - Misconceptions discussion: 20 min
  - Check for understanding (new problem and generating examples): 25 min
  - Wrap-up and decline to settle: 10 min

  Total: 120 minutes.

  Adjust as needed for discussion flow.
answer: |-
  Here's a structured plan for your two-hour seminar, designed to challenge students' assumptions about induction using Bongard problems. The sequence prioritizes experiential learning and misconception disruption, with clear dependencies.

  ---

  ### **1. Order of Ideas and Dependency Structure**  
  *(Total: 70 minutes)*  
  **Goal:** Ensure students *experience* the limitations of feature-tabulating before formal explanations.  

  - **Phase 1: Positives-Only Rule Proposal (15 min)**  
    - **Activity:** Display 6 positive (left) panels of a simple Bongard problem (e.g., "all shapes are triangles"). Ask students to write down the rule.  
    - **Why now:** Activates the "common features" misconception. Students will propose conjunctive rules (e.g., "has triangles and lines").  

  - **Phase 2: Introduce Negatives as Rule-Breakers (20 min)**  
    - **Activity:** Reveal 6 negative (right) panels. Ask students to test their rule. Their rules will fail (e.g., a negative may have triangles but violate a hidden constraint).  
    - **Dependency:** Students must *first* commit to a flawed rule. This makes negatives feel like disruptive feedback, not a passive test.  
    - **Pivot point:** Ask, "Why did your rule fail? What did the negatives reveal that positives hid?"  

  - **Phase 3: Revision with Negatives (20 min)**  
    - **Activity:** Group work to refine rules using negatives. Groups share new rules.  
    - **Dependency:** Students must experience *revising* rules after failure. This primes them for underdetermination.  

  - **Phase 4: Underdetermination Reveal (15 min)**  
    - **Activity:** After groups share a working rule, say: "Another group had a *different* rule that also fits all 12 panels." Show an example (e.g., Rule A vs. Rule B).  
    - **Dependency:** Underdetermination is *only* raised *after* students have (a) proposed a rule, (b) seen it wrecked, and (c) revised it. This makes the problem visceral—students now grasp that many rules "fit," but not all survive new cases.  

  ---

  ### **2. Carrying Example: The "Odd One Out" Rule**  
  *(Use throughout the seminar)*  
  **Rule:** *"Exactly one shape in the box is asymmetrical (e.g., lacks rotational symmetry)."*  
  - **Positives (left):**  
    - ✓ Symmetrical star + asymmetrical blob.  
    ✓ Three circles + one irregular polygon.  
    ✓ Two squares + one lopsided heart.  
    *(All have exactly one asymmetrical shape; symmetrical shapes vary.)*  
  - **Negatives (right):**  
    - ✗ All shapes symmetrical (e.g., circles, squares).  
    ✗ Two asymmetrical shapes (e.g., two blobs).  
    ✗ No asymmetrical shapes but irrelevant distractors (e.g., color, size).  
  - **Why it works:**  
    - **Resists conjunctions:** No single visible feature (e.g., "has a blob," "has hearts") works—negatives destroy these.  
    - **Negatives as destroyers:**  
      - The "all symmetrical" negative kills "has asymmetrical shape."  
      - The "two asymmetrical" negative kills "has at least one asymmetrical shape."  
    - **Forces abstraction:** Requires counting and symmetry assessment, not just feature-spotting.  

  ---

  ### **3. Misconception Map + Mitigation Plan**  
  Address each *during* the activity where it arises:  

  1. **"The concept is just the common features."**  
     - **When:** Phase 1 (after positives-only proposals).  
     - **Mitigation:** Ask, "Did anyone list a feature *not* in all positives? Why not?" Then reveal negatives to shatter this.  

  2. **"One more positive example would settle rival rules."**  
     - **When:** Phase 4 (underdetermination reveal).  
     - **Mitigation:** After showing two rules that fit all 12, present a 13th panel that splits them (Rule A: ✓, Rule B: ✗). Ask: "Which rule is right? Can you tell? What would *resolve* this?" *(Answer: Need a targeted negative/positive, not just any example.)*  

  3. **"The right rule is the simplest one."**  
     - **When:** Phase 3 (group revision), when groups debate "simpler" rules.  
     - **Mitigation:** Challenge: "Is 'has an asymmetrical shape' simpler than 'exactly one asymmetrical shape'? But which fits *all* examples?" Use negatives to show simplicity ≠ correctness.  

  4. **"Negatives are only a test for a pre-formed rule."**  
     - **When:** Phase 2 (after rule failure).  
     - **Mitigation:** Ask: "Did the negatives help you *discover* new constraints? How?" Highlight a negative that inspired a rule refinement (e.g., the "two asymmetrical" panel forced counting).  

  ---

  ### **4. Checking Understanding**  
  *(Total: 20 min)*  
  **Avoid:** Asking for a rule that sorts the panels (superficial).  
  **Instead:**  
  - **Activity:** Give a *new* Bongard problem. Ask students to:  
    1. **Design a critical example:** "Sketch a 13th panel that would be *positive* and explain why it’s necessary to confirm the rule."  
    2. **Justify with negatives:** "Which negative example was most useful for *ruling out* wrong rules? Why?"  
  - **Why it works:** Tests if they see examples as tools for *constraint generation* (not pattern-matching).  

  ---

  ### **5. What to Openly Decline to Settle**  
  **Decline:** "Whether *all* concepts are Bongard-style rules."  
  - **Why:**  
    - The goal is to expose the *process* of induction (role of examples, underdetermination), not to claim concepts *are* rules.  
    - Leaving it open prevents philosophical digressions about "real-world" concepts (e.g., social categories) that may involve non-visual factors.  
    - **Script:** "Today’s goal isn’t to say *what concepts are*—it’s to reveal how examples guide discovery. Bongard problems are a microscope for induction, not the whole world."  

  ---

  ### **Timeline Summary**  
  - **0:00–0:15:** Phase 1 (positives only).  
  - **0:15–0:35:** Phase 2 (negatives as disruptors) + Misconception 1 & 4.  
  - **0:35–0:55:** Phase 3 (group revision) + Misconception 3.  
  - **0:55–1:10:** Phase 4 (underdetermination) + Misconception 2.  
  - **1:10–1:30:** Carrying example deep dive.  
  - **1:30–1:50:** Understanding check (new problem + example design).  
  - **1:50–2:00:** Wrap-up + decline to settle philosophical claims.  

  **Key Principle:** Students must *feel* the failure of their assumptions before concepts like "underdetermination" land. Use the carrying example consistently to anchor discussions.
