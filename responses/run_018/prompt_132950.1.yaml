answer: |-
  Here's a structured 90-minute seminar plan focusing on the **structural core** of the Problem of Old Evidence (POE), avoiding Mercury-perihelion and prioritizing conceptual clarity for logic-trained students.

  **Core Scenario: The Dice Game Prediction**
  *   **Setup:** Player rolls two standard 6-sided dice behind a screen. A "Model" (Theory T) is proposed *before* the sum is revealed. T makes a specific claim: "The dice are fair, *and* the sum is even." (T = Fair Dice & Even Sum). The actual rolled sum (E = 8) is recorded but kept hidden initially.
  *   **Why it works:**
      1.  **Predictive Success:** T predicts E *before* E is known (sum is even). Discovering E=8 (even) *feels* confirmatory.
      2.  **Accommodation Success:** T is also consistent with E *after* E is known. But was T *built* to fit E=8? No. T only specifies fairness and evenness. It wasn't parameterized for *this specific number* (unlike fitting Mercury's *exact* anomaly). The core claim (even sum) is general.
      3.  **Formal Simplicity:** Easy probabilities: P(E|T) = 1 (T entails even sum), P(E|~T) = 1/2 (if sum isn't even, it's odd). Priors can be debated intuitively.
      4.  **Non-Scientific:** Avoids historical baggage, highlights universal belief revision.

  **Teaching Arc & Timing (90 mins total):**

  1.  **Setting the Stage: Intuitive Confirmation & Predictive Success (15 mins)**
      *   (5 min) Intro: Bayesianism as a *model* of rational belief updating given evidence. Goal: Quantify how evidence supports hypotheses.
      *   (10 min) **The Dice Scenario (Predictive Phase):**
          *   Present T ("Fair Dice & Even Sum") *before* revealing E.
          *   Ask: "If we learn the sum *is* even (E), how much should our belief in T increase? Why?" Elicit intuitions.
          *   **Key Point:** Emphasize the *novelty* of the prediction. T "stuck its neck out." Success feels significant. **This intuition MUST precede Bayes.**
          *   *Intercept Misconception 1 (Old Evidence = Weak Evidence):* Ask: "If we *already knew* E=8 before considering T, would learning T was proposed still make you believe T *more*?" Many will say "Yes, but less strongly." **Intercept:** "Hold that thought. We need to see what the Bayesian machinery says about *any* known evidence."

  2.  **Bayes' Theorem (Ratio Form) & Conditionalization (15 mins)**
      *   (10 min) **Introduce Bayes' Ratio Form:** Focus on *change* from prior to posterior.
          *   `P(T|E) / P(~T|E) = [P(E|T) / P(E|~T)] * [P(T) / P(~T)]`
          *   Explain components: Prior Odds `[P(T)/P(~T)]`, Likelihood Ratio `[P(E|T)/P(E|~T)]`, Posterior Odds.
          *   **Why Ratio First?** Directly shows belief *change* factor (Likelihood Ratio). Log-Odds is a transform of this. Avoid probability-zero distractions initially.
      *   (5 min) **Conditionalization Defined:** Updating belief to `P_new(H) = P_old(H|E)` upon learning E (with certainty). `P_old` represents belief state *before* learning E.

  3.  **Applying Bayes to "New" Evidence in Dice Game (10 mins)**
      *   Revisit Dice Scenario *as if* E was unknown when T was proposed.
      *   Plug into Ratio: `P(T|E)/P(~T|E) = [1 / (1/2)] * [P(T)/P(~T)] = 2 * [P(T)/P(~T)]`
      *   **Interpret:** Learning E (sum even) doubles the odds in favor of T. This matches intuition (predictive success). Conditionalization works.

  4.  **The Wrench: Applying Bayes to *Old* Evidence (POE Emerges) (15 mins)**
      *   **Shift Scenario:** "Now, suppose we *already knew* E=8 (the sum is 8, hence even) *before* T was ever proposed. T is proposed *now*, today, post-hoc. Does E still confirm T?"
      *   (10 min) **Apply Conditionalization:** What is `P_old`? It's our belief state *before learning T*, but *after knowing E*. So E is already part of our background knowledge (K). So `P_old(E) = 1` (we know E is true). `P_old(E|T)` = ? Since E is already known (in K), and T is consistent with K, `P_old(E|T) = 1`. Similarly, `P_old(E) = 1`.
      *   Calculate `P_old(T|E)` using Bayes: `P_old(T|E) = [P_old(E|T) * P_old(T)] / P_old(E) = [1 * P_old(T)] / 1 = P_old(T)`
      *   **CRUNCH:** `P_new(T) = P_old(T|E) = P_old(T)`. **No change!** Learning T gives *zero* confirmation via conditionalization.
      *   (5 min) **Highlight the Tension:** Intuition (T explains known E) clashes with formalism (no belief change). This is POE. **It's structural:** Conditionalization relies on `P_old(E) < 1` for evidence to *change* belief. Known evidence has `P_old(E) = 1`.
      *   *Intercept Misconception 2 (Lower Post-Hoc Priors):* "Could we fix this by just assigning a very low prior `P_old(T)` to T since it was proposed after E?" **Intercept:** "That might make T's *absolute* probability low, but it doesn't change the *update dynamic*. Learning T still wouldn't *increase* our belief in T relative to that prior (`P_new(T) = P_old(T)`). The formalism shows *no confirmation occurs* via standard conditionalization, regardless of the prior value."

  5.  **Deepening the Problem & Log-Odds Shift (15 mins)**
      *   (5 min) **Reinforce the Core Issue:** Why `P_old(E) = 1` is fatal for standard conditionalization-based confirmation *from E*. The evidence is "old" relative to the hypothesis.
      *   (10 min) **Introduce Log-Odds Form & Counterfactual Reasoning:** `log[O(T|E)] = log[O(T)] + log[P(E|T)/P(E|~T)]`
          *   **Why Now?** To address the `P(E|~T)` issue lurking in the likelihood ratio when E is known. How do we assess `P(E|~T)` counterfactually?
          *   **The Crucial Counterfactual:** "What would we expect E to be *if T were false*, *ignoring that we already know E*?" In Dice: If ~T (either dice unfair *or* sum odd), P(E=8 | ~T) = P(Sum=8 | ~T) = ? Requires analyzing ~T scenarios. If we assume fairness (focusing only on even/odd), P(E=8 | ~T) = P(Sum=8 | Sum Odd) = 0? (No, 8 is even!). Need to compute `P(E|~T)` *without* our knowledge E is true. In Dice, if ~T means "Not (Fair & Even)", possibilities include Fair&Odd, Unfair&Even, Unfair&Odd. Calculating `P(Sum=8 | ~T)` is messy (`P(E|~T) < 1/2`). Log-Odds allows us to formally represent the confirmatory value (`log[LR]`) *if* we can compute the counterfactual `P(E|T)/P(E|~T)`, but conditionalization itself (`P_new(T) = P_old(T|E)`) remains stuck.
      *   **Key Insight:** The problem isn't *calculating* the likelihood ratio per se (though it's hard counterfactually), it's that **conditionalization cannot use this ratio to update beliefs when E is already known (`P_old(E)=1`).** The formalism for *updating* is broken for old evidence, even if we *define* a confirmatory measure.

  6.  **Generalization, Misconceptions & Scope (15 mins)**
      *   (5 min) **Beyond Science: Personal Belief Revision:** "Imagine you suspect a friend forgot your birthday (H). You *know* they didn't call (E). Later, you learn they have a new theory: 'My phone was dead *and* I have amnesia' (T). Does your *known* evidence (no call) suddenly confirm this new elaborate excuse T? POE says: by strict conditionalization, no (`P_new(T) = P_old(T|E) = P_old(T)`)." **This kills Misconception 3 (Only Scientific).**
      *   (5 min) **Recap Misconceptions Intercepted:**
          1.  POE isn't about weak evidence; it's about *zero update* via standard conditionalization.
          2.  Lowering priors for post-hoc theories doesn't make E confirm them; it just starts them lower.
          3.  POE is a general feature of learning hypotheses consistent with known data (science, law, everyday life).
      *   (5 min) **What We Left Out (Explicitly Stated):**
          *   **Jeffrey Conditionalization:** (Updating on uncertain evidence). Mentioned as important for realism, but doesn't solve POE for *certain* old evidence.
          *   **Non-Classical Logics / Belief Revision:** Alternative frameworks exist (AGM, etc.).
          *   **Diachronic Dutch Books:** Justification for conditionalization.
          *   **Sophisticated Counterfactual Approaches:** (e.g., Garber, Jeffrey, Zynda). We touched on counterfactual likelihoods as *a* proposed solution path but didn't formalize them fully. Acknowledge these exist but are contested and complex.

  7.  **Final Check: Probing Structural Understanding (5 mins)**
      *   **Task:** "A scientist proposes a new theory T today. Theory T perfectly entails a specific experimental result E. We have known E with certainty for years. A student says: 'Bayesianism shows E can't confirm T because we already knew E. The only way T could get confirmation is if it predicted some *new* evidence we didn't know yet.' Is the student *entirely* correct? Briefly explain the core formal reason *why* Bayesian conditionalization shows no confirmation from E, *independently* of the need for new evidence."
      *   **What Reveals Understanding:** A correct answer must mention the **role of background knowledge (K) containing E** leading to `P_old(E) = 1` and hence `P_old(T|E) = P_old(T)` via Bayes' theorem/conditionalization, making confirmation *via this update rule* impossible. It's not just that new evidence *is also* needed; it's that the *structure of conditionalization* nullifies the update for evidence in K. Merely agreeing with the student misses the precise structural point.

  **Key Pedagogical Principles Embodied:**
  1.  **Concept Before Formalism:** Predictive success intuition anchors the *need* for Bayes.
  2.  **Minimalist Formalism:** Ratio Bayes first (focus on change), Log-Odds only when counterfactual `P(E|~T)` becomes relevant.
  3.  **Single Carrying Scenario:** Dice Game used throughout (predictive, accommodative, old evidence phases).
  4.  **Proactive Misconception Interception:** Predictable errors addressed at the point where they naturally arise.
  5.  **Highlighting the Structural Core:** `P_old(E) = 1` => `P_old(T|E) = P_old(T)` is the immutable engine of POE within standard Bayesian conditionalization.
  6.  **Transferable Final Check:** Tests grasp of the core structural conflict, not example recall.
