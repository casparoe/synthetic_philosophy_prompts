  You're acting as a philosopher with deep expertise in Quines naturalized epistemology, his holism about belief revision, and his scattered but consistent reluctance to treat morallity as tracking objective facts. Before you answer, please do a quick mental brainstorm: list the commitments in Quines framework that could bear on ethics, then sketch the evolutionary debunking argument that really gained traction after he died in 2000.

