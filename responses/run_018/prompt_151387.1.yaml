  Based on Quine's core commitments and the trajectory of his thought, here's a predictive extrapolation of how he'd likely engage with modern evolutionary debunking arguments and ecological studies of moral norms:

  1.  **Welcoming the Data, Rejecting the Framing:**
      *   Quine would **enthusiastically embrace** the empirical findings. Evidence that moral norms shift with ecological pressures (pathogens, scarcity) and serve group cohesion aligns perfectly with his naturalism. It confirms his view that moral dispositions are products of biological and cultural evolution, shaped by contingent survival pressures, not perceptions of abstract truths.
      *   However, he would **vehemently reject the debunker's implicit premise** – the idea that morality *could* or *should* be "tracking objective facts" in the same way science aims to track physical reality. For Quine, this premise fundamentally misunderstands the function of moral language. The debunker's "wild coincidence" worry only arises *if* you mistakenly assume morality's job is scientific description. Quine thought this was a category error.

  2.  **"Confirmation" of Conventionality, Not Ontological Exclusion:**
      *   Quine *would* see this data as strong confirmation that moral sentences **don't function as reports of observer-independent facts**. Their variability and adaptive utility scream "convention" and "tool for social coordination" rather than "discovery of moral atoms."
      *   But he wouldn't frame this as *excluding* them from ontology *because* they aren't objective facts. His ontology was driven by what our best scientific theory quantifies over. Moral predicates simply don't *need* to be quantified over within our fundamental scientific description of the world to be useful or meaningful. Their utility lies elsewhere. The data reinforces *why* they don't appear in that ontology.

  3.  **Holism and Functional Role Preservation:**
      *   This is crucial. Quine's holism allows beliefs to be justified by their **coherence and utility within the entire web**, not solely by correspondence to external facts or their causal origins.
      *   Even with a complete evolutionary/ecological explanation for the *origin* of moral intuitions, Quine would argue:
          *   Moral norms *still* play a vital **functional role** within the web of belief and social practice. They regulate behavior, resolve conflicts, foster cooperation, and provide psychological stability.
          *   They cohere significantly with other parts of the web: our psychological understanding of motivation, sociological descriptions of institutions, legal frameworks, and even our scientific practices (e.g., norms of honesty in reporting data).
          *   **Pragmatic justification persists:** Moral sentences remain "justified" insofar as revising them *out* of the web would cause massive disruption to social cohesion and individual psychology – a cost far exceeding any benefit gained by eliminating them simply because we know their causal origin. Knowing *why* we have them doesn't automatically negate their *current utility*.
          *   The evolutionary story becomes **another node in the web**, enriching our understanding of *why* these useful conventions exist and take the forms they do. It doesn't automatically sever the normative force they hold within lived experience and social interaction.

  4.  **Debunking as Misplaced Scientism:**
      *   Quine would likely view the *strongest* forms of evolutionary debunking (those claiming to show morality is *therefore* entirely false or unjustified) as committing the very sin he criticized: applying scientific standards of justification where they don't belong. The debunker is still implicitly demanding that moral beliefs meet the epistemic standards of physics, failing to see them as part of a different linguistic and practical framework. The "coincidence" argument only bites if you demand morality be science.

  **Predicted Quinian Response Summary:**

  "If I were alive today, I'd find this empirical work fascinating and entirely consonant with my view that moral dispositions are natural phenomena, sculpted by evolution and environment. It powerfully illustrates why moral sentences shouldn't be construed as aiming at scientific truth about independent moral facts. They are tools for social navigation, honed by survival pressures.

  However, the 'debunking' rhetoric overreaches. Knowing the hammer's evolutionary origin doesn't make it useless for driving nails *now*. Moral norms remain deeply embedded in the web of belief and practice. Their justification lies in their indispensable role in maintaining social order, personal integrity, and the very framework within which science itself operates. To discard them *solely* because we understand their causal genesis would be pragmatically disastrous and philosophically confused – mistaking the functional role of norms for failed scientific hypotheses. The evolutionary story enriches our understanding of the tool, it doesn't invalidate its current function."

  **Therefore:** Your friend is partially right that Quine wouldn't be *surprised* or feel his core view was threatened by debunking arguments. But you're right to sense an interaction: Quine would see the data as *confirmatory evidence* for his view of morality's conventional nature, while simultaneously using his holism to *resist* the debunker's stronger conclusion that morality is thereby unjustified or should be eliminated. The key is his insistence on different functional roles within the web.
