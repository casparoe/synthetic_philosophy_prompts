  First, I need to recall Quine’s key commitments: naturalized epistemology (all knowledge is scientific), holism (beliefs form a web revised as a whole), rejection of analytic/synthetic distinction, and his view that morality isn’t about objective facts. Then there’s evolutionary debunking: if moral beliefs evolved for survival/cohesion, how could they track objective truths? The user also mentions newer studies showing moral norms shift with ecology (e.g., pathogen prevalence), making them seem adaptive, not truth-tracking.  

  The user’s real question is predictive: If Quine were alive today, would he see this as confirmation that moral sentences aren’t objective, or would he push back because debunkers are still treating morality like science? They also wonder about holism—could moral beliefs stay in the web based on social coherence despite evolutionary origins?  

  Quine’s core stance: morality is practical, not fact-stating. He’d likely agree debunking supports his view, but he wouldn’t frame it as "debunking" because that implies morality was ever meant to be objective. For him, moral sentences aren’t candidates for truth-tracking; they’re tools for social regulation. The adaptive shifts in norms (e.g., stricter norms under pathogen threat) would just reinforce their conventional, instrumental role.  

  Holism complicates this though. Moral beliefs are tied to the web—e.g., norms about honesty support scientific collaboration. Quine might say even with debunking, we keep moral talk because it’s pragmatically useful for social coordination. The evolutionary story explains its origin, not its current function.  

