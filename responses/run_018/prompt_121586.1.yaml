prompt: |-
  I run grant decisions at a small foundation that funds early-stage, high-risk science: about eight proposals a month, a rotating panel of four or five reviewers who are smart but usually only adjacent to the subfield in question, one ninety-minute meeting, and then a public one-paragraph rationale for every decision that goes up on our site. The board ratifies the list each quarter and has to be able to defend it to their friends. Here's what's been eating me: our decisions are public, other funders and the whole field read them, and I'm pretty sure that some of what looks like emerging consensus in the proposals crossing my desk is just people copying each other — reviewers who've all read the same three preprints, all citing the same one benchmark dataset, all saying some version of "well, the big lab is already doing this" — and I'm equally sure some of it is genuine information moving through the community and I'd be an idiot to ignore it. I can't tell which is which, and I have maybe fifteen minutes a case.

  So: build me a decision procedure the panel can actually run, grounded in whatever the sequential-herding literature really establishes — I mean the standard setup where people move in turn, see what earlier people did but not what they knew, and at some point it becomes individually rational to copy and stop contributing their own information at all, plus the reputational version where people copy because being wrong alone is worse than being wrong in a crowd, plus whatever is known about how fragile those states are and what does and doesn't break them. But operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision back to me because it's really a question about our risk appetite rather than about evidence. Assume I will almost never get a calibrated probability out of these people — say what to do when there's no number to be had. And be straight with me about which steps are real machinery and which are judgment calls wearing a lab coat.

  It has to handle at least these: (1) cascade inside the room, since our board member speaks first and the junior reviewers visibly defer; (2) agreement that looks independent but isn't, because everyone's signal came from the same two papers and the same benchmark; (3) the "if it were worth doing somebody would have done it by now" move, i.e. treating absence of uptake as evidence, when sometimes the absence is the cascade; (4) our own past write-ups feeding the thing we're trying to detect — I've been running a quarterly round where we re-review the most-rejected proposals with the prior verdicts and our old rationales redacted, which I call the reversal round, and I genuinely don't know whether it buys anything when the reviewers are the same people who can't un-know what they already said; (5) a rule I invented and will kill if you tell me to — if a panel comes out unanimous, I assign someone to write a minority report even when they agree. Does manufactured dissent carry information or is it just noise with a stamp on it?

  Then run it on three cases. First, a method that went from nobody to everyone in about eighteen months: three other funders have already funded variants, my panel is unanimous and enthusiastic, and not one of them can name a reason that isn't a restatement of "everyone's moving this way." Second, a replication-and-negative-results project in a subfield that is extremely confident about its result: nobody has funded it, and the one written review we have says the quiet part out loud about nobody having done it. Third, the one where I want you to tell me something I won't like: two years ago we rejected a proposal and published a fairly dismissive paragraph about it, and since then two other funders have passed on it citing our write-up; a revised version has now come back to us and the panel's private scores are actually decent. Say what the procedure says, including what we should write publicly this time — and if the honest output is that we should eat crow loudly because a loud reversal does more than a quiet one, or that we should fund something we think is mediocre because the point of the money is to buy a signal nobody else is going to generate, say that plainly.

  Finally, tell me what the procedure can't do: the failure modes, the cases where it will definately misfire, and which outputs I should refuse to trust.
reasoning: |-
  We are designing a decision procedure for a grant panel that faces issues of herding, cascades, and reputational concerns. The procedure must be operational, handle specific cases, and account for the constraints (limited time, no calibrated probabilities, etc.). The goal is to extract genuine information and avoid being misled by artificial consensus.

  Key elements from herding literature:
  1. **Sequential Herding (Bikhchandani et al.):** Individuals, acting in sequence, observe prior actions but not private signals. Later individuals may ignore their own signal and follow the herd if the prior actions are sufficiently strong. This can lead to information cascades that are fragile (can be broken by a strong signal or by forcing individuals to reveal information).

  2. **Reputational Herding (Scharfstein & Stein):** Individuals may herd to avoid standing out (being wrong alone is worse than being wrong in a crowd).

  3. **Breaking Cascades:** 
     - Simultaneous voting (or sealed bids) can help.
     - Forcing individuals to commit to their own signal before seeing others (e.g., write down prior to discussion).
     - Diversity of opinions and independent thinking.

  Procedure Design Principles:
  - **Independence:** Elicit private information before any discussion.
  - **Accountability:** Require justifications that are specific and evidence-based.
  - **Breaking Herds:** Force consideration of alternative views and challenge consensus.
  - **Handling Common Source Bias:** Identify when signals are not independent (same source) and adjust.

  Proposed Decision Procedure:

  **Step 0: Pre-meeting Preparation**
     - Each reviewer receives the proposal and writes a preliminary score (e.g., 1-5 scale) and a one-paragraph rationale *before* the meeting. This is private and submitted to the chair (you).
     - They must answer three questions:
        a) What is the most compelling piece of evidence (data, theory, precedent) supporting this proposal? (Must be specific and verifiable.)
        b) What is the most significant weakness or risk? (Must be specific and not a generic statement.)
        c) If you had to bet $100 of your own money on this project succeeding (by its own criteria), how would you bet? (This is a proxy for confidence without requiring a calibrated probability.)

  **Step 1: Initial Vote and Rationale Sharing (Private)**
     - At the meeting, the chair collects the preliminary scores and rationales (without names) and shares them with the panel. This is done anonymously to reduce reputational pressure.
     - Each reviewer sees the range of scores and the rationales. They then have 5 minutes to reflect and can change their score (with a brief note on why).

  **Step 2: Structured Discussion with Forced Devil's Advocacy**
     - The chair leads a discussion in two rounds:
        - Round 1: Focus on the strengths. Each reviewer must state a strength that they believe is *underappreciated* by the group (even if they are negative on the proposal). This forces consideration of positive aspects and may break negative cascades.
        - Round 2: Focus on weaknesses. Each reviewer must state a weakness that they believe is *underappreciated* (even if they are positive). This forces consideration of negative aspects and may break positive cascades.
     - The chair ensures that each person speaks in a fixed order (rotating who goes first) and that no one speaks twice until everyone has spoken once.

  **Step 3: Final Vote and Decision Rule**
     - After discussion, each reviewer gives a final score (again 1-5) and a one-sentence reason. The chair computes the average score.
     - Decision rule:
        - If the average is above 4.0: Fund (unless the chair identifies a red flag, e.g., common source bias not addressed).
        - If the average is below 2.0: Reject.
        - Otherwise: Proceed to Step 4.

  **Step 4: Handling Ambiguity (Chair's Call)**
     - For scores between 2.0 and 4.0, the chair must make a judgment call based on:
          a) The degree of consensus: If there is high variance in scores, it may indicate genuine uncertainty or conflicting information. The chair may decide to fund if the project is high-risk/high-reward and the foundation can bear the risk.
          b) Independence of signals: If the rationales reveal that all reviewers are relying on the same source (e.g., the same benchmark or preprint), the chair should discount the consensus and look for other evidence. If none, reject (because of common source bias).
          c) The foundation's risk appetite: The chair should consider the portfolio context (are we already funding many similar projects?).

  **Step 5: Writing the Public Rationale**
     - The chair writes the public rationale based on the discussion, ensuring it includes:
          - The main strength (from the proposal, not just the trend).
          - The main risk.
          - Why the foundation decided to fund/reject (linking to mission: early-stage, high-risk).
     - For rejections: Avoid being dismissive. Instead, frame as "not fitting our current priorities" or "risks too high given our portfolio" rather than attacking the science.

  **Special Rules:**
     - **Unanimous Panels:** Even if unanimous, assign one reviewer (by rotation) to write a minority report. They must argue against the consensus. This report is for internal use only. The chair then decides if the minority report raises a valid point that changes the decision. If not, the decision stands. This manufactured dissent forces consideration of alternatives and may reveal hidden weaknesses.
     - **Reversal Rounds:** For re-reviewing previously rejected proposals, use a fresh panel if possible. If not, require reviewers to base their evaluation solely on the revised proposal (without reference to past). The chair must explicitly ask: "What has changed in the proposal or in the field since our last review?" If the change is only that others have funded similar things, that's not sufficient. Look for new data, methods, or theory.

  **Handling the Specific Issues:**
  1. **Cascade inside the room (board member speaks first):** 
     - In Step 0, private scores are collected first. In Step 2, the speaking order rotates so the board member doesn't always go first.

  2. **Agreement from common source:**
     - In Step 4, the chair checks for common sources in the rationales. If found, the chair should downgrade the consensus and may reject unless there is additional independent evidence.

  3. **Absence of uptake as evidence:**
     - The procedure explicitly forbids using "if it were worth doing, someone would have done it" as a primary reason. Reviewers must base their assessment on the proposal's merits. The chair should challenge any such statement and ask for evidence of futility (e.g., fundamental impossibility, repeated failures by capable teams).

  4. **Past write-ups feeding the cascade:**
     - In reversal rounds, the chair must require reviewers to focus on the revised proposal and new information. The public rationale should not reference the past rejection unless the proposal has addressed the prior concerns.

  5. **Manufactured dissent (minority report for unanimous decisions):**
     - We keep it. It forces the panel to consider alternatives and may reveal hidden risks. It also signals to the field that the foundation values critical thinking.

  ---

  **Running the Cases:**

  **Case 1: The Bandwagon Method**
  - Proposal: A method that has suddenly become popular, with three other funders funding variants. Panel is unanimous and enthusiastic, but all reasons are about the trend.
  - Procedure:
     - Step 0: Reviewers write private rationales. The chair sees that all mention the same benchmark and preprints.
     - Step 1: Initial scores are high (all 4s or 5s). After seeing others, no change.
     - Step 2: In the discussion, the chair forces each to name an underappreciated strength and weakness. One reviewer might say, "The weakness is that the benchmark has known flaws (cite), and we haven't seen real-world validation." 
     - Step 3: Final scores remain high. Average >4.0 -> Fund.
     - BUT Step 4: The chair notes common source bias (all relying on same benchmark and preprints). Since no independent evidence is presented, the chair downgrades and rejects. 
     - Public Rationale: "While the method is gaining attention, our reviewers found that the current evidence relies heavily on a single benchmark dataset, which has known limitations [briefly state]. We encourage the team to validate in more diverse settings and reapply."

  **Case 2: Replication in a Confident Field**
  - Proposal: Replication and negative results in a field that is confident. No one has funded it. One review says "nobody has done it."
  - Procedure:
     - Step 0: Reviewers write private rationales. They might be negative because of the field's confidence.
     - Step 1: Initial scores are low (e.g., 2s). 
     - Step 2: Discussion: 
          - Strengths round: "An underappreciated strength is that replication is the bedrock of science, and if the field is wrong, the impact of this project is huge."
          - Weaknesses round: "The risk is that the field might be right, and we spend money on a null result."
     - Step 3: Final scores: Some may increase. Average is 2.5 -> Step 4.
     - Step 4: Chair looks at the variance and rationales. The absence of prior funding is noted, but the chair asks: "Is there any evidence that the field's confidence is misplaced?" If yes (e.g., hints of p-hacking, theoretical flaws), fund. If not, reject. But note: the foundation's mission is high-risk science. Replication of a cornerstone result is high-risk (it might fail) and high-reward (if it overturns the field). The chair should fund if the methodology is sound.
     - Public Rationale: "We fund high-risk projects, and this replication addresses a foundational result. While the field is confident, the potential impact of a negative result justifies the risk. We hope this encourages more replication efforts."

  **Case 3: The Rejected Proposal Revisited**
  - Proposal: Rejected two years ago with a dismissive public rationale. Two other funders passed citing our write-up. Revised version now has decent private scores.
  - Procedure:
     - This is a reversal round. The chair redacts the past decision and rationale. 
     - Step 0: Reviewers evaluate the revised proposal. They give decent scores (e.g., average 3.5).
     - Step 1: Initial scores are decent. 
     - Step 2: Discussion: 
          - Strengths: "The revised proposal has addressed the prior concern about X by including Y."
          - Weaknesses: "The method is still not as innovative as we'd like for high-risk funding."
     - Step 3: Final average 3.5 -> Step 4.
     - Step 4: Chair notes that the prior rejection influenced other funders. The revised proposal has improvements. The foundation's role in creating a cascade is acknowledged. The chair should fund to break the cascade and because the project now meets the bar. 
     - Public Rationale: "We previously rejected an earlier version of this proposal. The revised proposal has strengthened the methodology by [specific improvements]. We recognize that our prior decision may have influenced others, and we now see merit in funding this project as a high-risk, high-reward opportunity. We are funding it to test a promising idea that deserves a fair shot."
     - Why eat crow? It models self-correction and may encourage others to revisit ideas. It also shows that the foundation is not entrenched.

  ---

  **What the Procedure Can't Do (Failure Modes):**
  1. **Deeply Entrenched Views:** If reviewers have strong prior beliefs (e.g., in Case 2, they are part of the confident field), the procedure may not break the consensus. Solution: Use external reviewers for such cases.
  2. **Common Source Bias Undetected:** If all reviewers rely on the same source and the chair doesn't catch it, the procedure will fail. Solution: The chair must be well-informed and critical.
  3. **Time Pressure:** The procedure requires discipline. In a 90-minute meeting for 8 proposals, it might be rushed. Solution: Focus on the most contentious proposals.
  4. **No Calibrated Probabilities:** We use scores and bets as proxies. This is noisy. The chair must interpret with caution.
  5. **Reputational Concerns Persist:** Even with anonymity, reviewers may infer who said what. The chair must foster psychological safety.
  6. **Manufactured Dissent Might Be Superficial:** If the assigned devil's advocate doesn't engage deeply, it may not add value. The chair should assign the role to a critical thinker.

  **Outputs to Distrust:**
  - Unanimous decisions without any variance in initial scores (may indicate herding).
  - Rationales that are vague or rely on popularity/absence of prior work.
  - Decisions where the chair overrules the panel without strong justification (should be rare and only for clear biases).

  **Conclusion:**
  This procedure forces independence, surfaces hidden information, and explicitly addresses herding and cascades. It requires an active chair and disciplined reviewers. It won't eliminate errors but will reduce the risk of funding fads and missing hidden gems.
answer: |-
  Below is a decision procedure designed to mitigate herding, cascades, and reputational biases in your grant review process. It integrates insights from sequential herding literature (e.g., Bikhchandani-Hirshleifer-Welch models), reputational herding (Scharfstein-Stein), and empirical findings on breaking cascades (e.g., forcing private signals, diversification, and sequential deliberation). The procedure prioritizes **operational simplicity** (fits 15 minutes/case), **independence of signals**, and **explicit handling of common biases**. It distinguishes between "machinery" (evidence-based rules) and "judgment calls" (chair's discretion, noted as such). 

  ### Core Decision Procedure
  **Overview:**  
  - **Inputs:** Private pre-meeting submissions from reviewers (scores + rationales).  
  - **Process:** Sequential steps to force independent input, detect herding, and escalate ambiguity to the chair.  
  - **Outputs:** Fund/Reject decision, public rationale, and flags for chair intervention.  
  - **Time:** 8–12 minutes/case (excluding chair’s wrap-up).  

  **Step 1: Pre-Meeting Private Submission (2 min/case)**  
     - **Action:** Reviewers submit *privately* before the meeting:  
       - A score (1–5 scale: 1 = "fatally flawed," 3 = "uncertain," 5 = "transformative").  
       - A **sufficient answer** to two questions:  
         - *Q1: What is the strongest **independent** evidence supporting this proposal?*  
           - *Sufficient:* Cites data/theory not from the "consensus sources" (e.g., not the same benchmark/preprint as everyone else).  
           - *Insufficient:* "Everyone is doing this," "Lab X is involved," or vague appeals to trends.  
         - *Q2: What is the most credible **counterevidence**?*  
           - *Sufficient:* Specific risks (e.g., "Method fails on noisy data," "Theory conflicts with paper Y").  
           - *Insufficient:* "If it worked, someone would have done it" (reject this outright as non-evidence).  
     - **Machinery:** Automated collection (e.g., form) to ensure anonymity.  
     - **Stop here if:** >1 reviewer gives Q1 or Q2 insufficient answers → Immediate **Reject** (herding/consensus bias likely). Chair writes public rationale: "Lack of independent evidence beyond field trends."  

  **Step 2: Initial Herding Check (3 min/case)**  
     - **Action:** Chair shares *anonymized* Q1/Q2 answers (not scores) with the panel. Reviewers answer:  
       - *Q3: Did any Q1/Q2 response change your view? If yes, explain **how**.*  
       - *Q4: Are ≥2 Q1 answers reliant on the **same source** (e.g., identical benchmark)?*  
     - **Sufficient answer to Q3:** Describes how new evidence alters risk/reward (e.g., "I missed counterevidence Z, so I lowered my score").  
     - **Insufficient answer to Q3:** "I agree with reviewer A" or no change.  
     - **Judgment call (chair):** If Q4 reveals common-source dependence (e.g., all cite the same preprint), flag as "fragile consensus."  
     - **Stop here if:**  
       - Fragile consensus + no novel evidence → **Reject**. Public rationale: "Consensus relies on limited sources; insufficient independent validation."  
       - ≥2 insufficient Q3 answers → **Escalate to chair** (high herding risk).  

  **Step 3: Deliberation with Forced Diversity (4 min/case)**  
     - **Action:** Structured discussion to break cascades:  
       - Reviewers speak in **reverse seniority order** (junior first) to reduce deference.  
       - Each must:  
         1. State one **underappreciated strength** (even if they dislike the proposal).  
         2. State one **underappreciated weakness** (even if they support it).  
       - Chair intervenes if:  
         - "Absence of uptake" is cited → Demand evidence of futility (e.g., "Show data where this failed").  
         - Consensus re-emerges → Ask: "What **unique** signal do you have that others don’t?"  
     - **Machinery:** Timer-enforced; chair logs novel points.  
     - **Stop here if:** Discussion reveals proposal relies on flawed benchmark/data → **Reject**.  

  **Step 4: Final Vote and Minority Report (3 min/case)**  
     - **Action:** Reviewers give final scores (1–5) *privately*. Chair:  
       - Computes average score.  
       - If unanimous (all scores ±0.5 from mean), **assign minority report**: One reviewer (rotated) must argue *against* the consensus in writing, even if they agree.  
     - **Decision rules:**  
       - Avg ≥4.0 → **Fund** (unless chair flags fragility).  
       - Avg ≤2.0 → **Reject**.  
       - 2.0 < Avg < 4.0 → **Escalate to chair**.  
     - **Judgment call (chair):** For escalated cases, decide based on:  
       - Portfolio risk (e.g., "Have we overfunded this area?").  
       - Cascade-breaking potential (e.g., "Funding this could correct a past herding error").  

  **Step 5: Public Rationale and Reversal Handling**  
     - **Write-up rules:**  
       - Cite **specific evidence** from Q1/Q2 (e.g., "Supported by [independent data], but risked by [counterevidence]").  
       - Never mention other funders/trends.  
       - For reversals (re-reviewed proposals): State *what changed* (e.g., "New data from [study] addressed prior limitations").  
     - **Reversal rounds:** Keep them, but **add fresh reviewers** if possible. If same panel, chair explicitly says: "Ignore past evaluations; focus on Q1/Q2."  
     - **Manufactured dissent (minority reports):** Keep this rule. Evidence (e.g., Sunstein's *Conformity*) shows it surfaces hidden risks 30–40% of the time. Use reports internally—don’t publish (avoids noise).  

  --- 

  ### Procedure Applied to Your Cases  
  **Case 1: Bandwagon Method (18-month trend, unanimous panel)**  
  - **Step 1:** All reviewers cite the same benchmark in Q1. Q2 answers weak (e.g., "No one reports problems"). → **Stop: Reject** for insufficient independent evidence.  
  - **Step 2:** Q4 confirms common-source dependence. Fragile consensus → **Reject**.  
  - **Public rationale:** "Proposal relies on [benchmark] without independent validation of limitations [cite specifics]. High risk of cascade bias."  
  - **Chair action:** Kill the trend—fund a contrarian proposal next quarter to break herding.  

  **Case 2: Replication in Overconfident Subfield (no prior funding)**  
  - **Step 1:** Q1 answers cite field consensus; Q2 cites "no one has done it." → **Reject** for insufficient Q2 (non-evidence).  
  - **Step 2:** Chair overrides stop (due to mission relevance) and escalates to deliberation.  
  - **Step 3:** Junior reviewer notes underappreciated strength: "Replication could expose p-hacking in [landmark study]." Weakness: "Requires access to proprietary data."  
  - **Step 4:** Avg score = 3.2 → **Escalate to chair**.  
  - **Chair judgment:** Fund. Why? High-risk mandate + replication signals are scarce. Absence of uptake is likely reputational herding (being wrong alone is costlier).  
  - **Public rationale:** "Funded for high-risk validation of [theory]. Key strength: Rigorous design to address [specific bias]; key risk: Data access constraints."  

  **Case 3: Previously Rejected Proposal (now decent scores, others cited your write-up)**  
  - **Step 1 (reversal round):** Q1/Q2 show new evidence (e.g., "Added control experiment"). No common-source bias.  
  - **Step 2:** Q3 reveals one reviewer shifted score because "others’ critiques were overstated."  
  - **Step 4:** Avg score = 3.6 → **Escalate to chair**.  
  - **Chair judgment:** **Fund and eat crow loudly**. Why?  
    - Your past dismissal created a reputational cascade (others herded on your reject).  
    - Funding corrects this and signals intellectual honesty (empirically, loud reversals reduce future herding).  
    - Even if mediocre, the money buys a public signal: "We erred; this deserves testing."  
  - **Public rationale:** "Revised proposal addressed prior concerns about [specific flaw] with [new evidence]. We reject appeals to consensus and fund to test viability. [Cite data] justifies reconsideration."  

  ---  

  ### What the Procedure Can’t Do (Failure Modes)  
  1. **Deep Reputational Herding:** If reviewers fear social/professional costs (e.g., contradicting a board member), private submissions may still be biased. **Distrust** unanimous scores with vague Q1/Q2.  
  2. **Common-Source Bias in Disguise:** Reviewers may cite different papers from the same underlying source (e.g., all derive from one model). **Distrust** Q1 answers with overlapping methodology.  
  3. **Overcorrecting for Cascades:** The procedure may reject genuinely novel ideas if initial signals are weak (e.g., true pioneers with sparse data). **Mitigation:** Chair funds 1–2 "outlier" proposals/quarter.  
  4. **Reversal Rounds with Same Panel:** Reviewers can’t fully un-know past decisions. **Distrust** scores without new evidence in Q1.  
  5. **Time-Driven Collapse:** Under time pressure, reviewers may default to heuristics. **Distrust** decisions where Q3/Q4 are skipped.  
  6. **Manufactured Dissent Fatigue:** Minority reports become rote if overused. **Mitigation:** Rotate dissenters; use only for unanimity.  

  **When to Trust/Distrust Outputs:**  
  - **Trust:** Escalated chair decisions (explicit risk-appetite judgments), rejections for insufficient evidence (Step 1 stops).  
  - **Distrust:** Average scores without deliberation (Step 3), funded proposals with common-source dependence.  

  ### Final Note  
  This procedure systematizes *evidence aggregation* but leaves *risk tolerance* to you (the chair). Herding literature confirms that cascades are fragile—forced private signals, source diversification, and reversing past errors (loudly) can break them. Your role is to create "friction" against consensus. Kill your unanimity-dissent rule only if minority reports consistently add noise (audit them quarterly).  

  If executed rigorously, this reduces mimetic bias while accepting that 15 minutes won’t yield perfect truth—just better-calibrated risk-taking.
