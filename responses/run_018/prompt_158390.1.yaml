prompt: |-
  Ok so you're playing the role of an expert philosophy professor who specializes in moral psychology and metaethics—think carefully and start by brainstorming three distinct ways folk morality might diverge across cultures without just being statistical noise. Then I want you to draft one exam essay question for my upper-level seminar on cross-cultural folk morality and what it implies for moral objectivity. But make it in the weeds: inject a specific, conceptually tight hypothetical finding about a small-scale horticulturist society where accidental harm in resource-conflict scenarios is judged more blameworthy than intentional harm, because in that social context intentionality signals alliance rather than culpability. The question should force students to distinguish descriptive relativism from normative anti-realism and to assess whether any control principle for moral responsibility can avoid being self-undermining here. Do not include requests for bibliographies, reading lists, or citations in the exam prompt itself—my students won't have web access. After the question, write a model answer of about 600 words, then a marking sheme with five must-hit points totaling 20 marks, plus a one-line note on how candidates typically botch each point. Keep the tone casual, like we're chatting in the hallway; a typo or two is totally fine.
