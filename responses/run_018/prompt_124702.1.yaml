  i'm trying to understand karma as a moral desert theory but i keep hitting what feels like a logik bug. if karma is deterministic — like past actions compile a fixed script of future suffering or reward — then present moral effort is pointless, you're just running prewriten code. but people also say you can "burn off" bad karma through good acts now, which sounds like runtime editing. so is the determinism only in the accounting part, not the agent? and if present choices can change the ledger, doesn't that mean you don't always get exactly what you deserv? where am i mixing up the model?
