  But then they remember synthetic biology experiments where scientists change what codons mean by altering the translation machinery. This leads to their core question: if you keep the same DNA but make UAG code for synthetic amino acids instead of stop, did the message change or just the reader? They want to understand if the "code" is distributed across the whole cellular apparatus, and whether DNA has intrinsic meaning without it.

