prompt: |-
  ok so me and my friend got into it last night about whether DNA is literally a code or just a lazy metaphor. she said the central dogma proves its a language, but i think thats sloppy—morse code is arbitrary, but codons map to amino acids through direct chemical pairing, not convention. but then i remembered synthetic biologists can expand the genetic code by adding new tRNAs and synthetases without touching the genome, so if you keep the same DNA but swap the translation machinery so UAG codes for a synthetic amino acid instead of stop, did you change the message or just the reader? explain the conceptual problem here: is the 'code' really distributed across the whole apparatus, and does that mean DNA doesnt carry semantic content on its own? dont just say 'its a metaphor'—i want to know why the arbitrariness criterion actually matters and whether this kills the idea that DNA has intrinsic meaning. also try to separate this from the old crick adaptor hypothesis thing, since that feels like a different problem about translation mechanics.
reasoning: |-
