  Key points to address:
  - The arbitrariness criterion is crucial because true codes have disconnect between symbol form and meaning (like letters in alphabet). But in DNA, codon-aa relationships do have chemical constraints at the physical level.
  - Yet synthetic biology shows we can override even those constraints by engineering new tRNA/synthetase pairs. That demonstrates context-dependence of meaning.
  - So while DNA has syntax (sequence patterns), semantics require the full cellular context. Like a book needing a literate reader.
