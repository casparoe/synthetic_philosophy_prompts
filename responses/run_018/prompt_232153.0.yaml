  The user wants a comprehensive set of desiderata for a theory of aggregating very small harms. They want this before diving deeper into the literature. Their requirements are quite detailed: they need coverage of structural cases like concentrated vs. spread harms, repeated vs. distributed burdens, imposed vs. permitted harms, and individually negligible but collectively enormous harms. They also want distinctions that must be preserved, empirical constraints, and identification of non-negotiable requirements versus camp-specific commitments.

  I should outline the core challenges here. The dust-speck problem highlights the tension between consequentialist aggregation (where many small harms outweigh one large harm) and deontological constraints (which might prohibit trading small impositions for large benefits). The user's practical case adds layers like repeated inconveniences and adaptation effects.

  For the desiderata, I'll organize them into categories: structural adequacy, distinction preservation, empirical constraints, and theoretical commitments. For structural adequacy, I'll include cases like concentrated vs. distributed harms, temporal repetition, imposed vs. permitted burdens, and scale amplification. For distinction preservation, I'll cover negligibility, harm intensity vs. victim count, and moral asymmetry. For empirical constraints, I'll incorporate adaptation, threshold effects, and psychological framing. For theoretical commitments, I'll address additivity demands and rights constraints.

  I should flag tensions, particularly between the additivity requirement (which pushes toward aggregation) and the moral asymmetry requirement (which resists it). This tension is central to the debate between consequentialism and deontology. The additivity requirement likely eliminates standard deontological views, while moral asymmetry challenges pure utilitarianism.

  The user's real-world position requires practical wisdom. They need a framework that acknowledges aggregation limits while still making policy decisions. The desiderata should help them evaluate existing theories or craft a balanced approach for their board. I'll keep the scorecard brief as requested, noting which requirement does the most to differentiate theories.
answer: |-
  Here is a comprehensive set of desiderata for a theory aggregating very small harms, tailored to your practical challenge and philosophical concerns:

  ### I. Structural Adequacy: Cases the Theory Must Classify Correctly
  1.  **Concentrated vs. Distributed Harm:** Correctly classify cases where a large harm (e.g., severe injury) befalls one person vs. the same *total magnitude* of harm distributed as tiny nuisances across millions (e.g., dust specks vs. torture). *Case:* Your utility's safety rule: widespread minor inconvenience vs. concentrated severe injuries.
  2.  **Temporal Repetition vs. Cross-Person Distribution:** Correctly classify harms experienced repeatedly by the *same individual* (e.g., daily minor inconvenience for years) vs. distributed as a single instance each across many individuals. *Case:* The inconvenience isn't a one-off for millions; it's a repeated, barely noticeable friction *in each life* over time.
  3.  **Imposed Burden vs. Permitted Harm:** Distinguish burdens actively *imposed* by a policy/agent (e.g., the inconvenience rule) for some purported benefit vs. harms merely *permitted* or *not prevented* by suspending a rule (e.g., the severe injuries). *Case:* Keeping the rule imposes inconvenience. Suspending it permits (but doesn't directly cause) injuries.
  4.  **Scale Amplification:** Correctly classify when individually negligible harms (below notice/concern threshold for a single instance) become collectively significant due to vast numbers. *Case:* One dust speck/a few seconds' inconvenience is negligible. Millions experiencing it daily is a massive social cost.
  5.  **Threshold Effects:** Account for the possibility that harms below a certain intensity/duration might be genuinely "discounted" to zero for an individual (e.g., truly unfelt), but harms *above* that threshold, even if small, must be counted. *Case:* Is the inconvenience truly unfelt/instantly forgotten, or is it a small but real negative sensation each time?
  6.  **Interaction Effects:** Handle cases where aggregated small harms might create emergent burdens (e.g., widespread minor frustration reducing social trust/productivity) beyond the simple sum. *Case:* Could the cumulative low-level irritation impact public perception or employee morale systemically?

  ### II. Distinctions the Theory Must Preserve
  7.  **Negligibility (Individual vs. Aggregate):** Must *not* collapse the distinction between a harm being negligible *in the context of a single life* (e.g., one dust speck doesn't ruin a life) and the *aggregated burden* being negligible. *Case:* Colleagues might argue "one speck is nothing, therefore any number is nothing" – the theory must reject this fallacy.
  8.  **Intensity vs. Duration vs. Number:** Must treat intensity (pain level), duration (how long it lasts), and number of sufferers as distinct dimensions affecting overall badness, not necessarily reducible to a single metric. *Case:* 50 years of mild discomfort vs. 1 minute of excruciating pain vs. a billion people experiencing 1 second of mild itch.
  9.  **Moral Asymmetry (Doing vs. Allowing):** Must preserve (or explicitly reject with justification) the distinction between actively imposing a harm to achieve a good vs. merely failing to prevent a harm to avoid imposing burdens. *Case:* Imposing inconvenience vs. allowing injuries by rule suspension.
  10. **Individual Integrity:** Must *not* treat individuals as mere "vessels" for aggregable utility fragments. The separateness of persons must constrain aggregation. *Case:* Why is it impermissible to torture one to prevent dust specks? The theory must explain this constraint, if it exists.

  ### III. Empirical Constraints
  11. **Adaptation/Habituation:** Must be consistent with findings that humans adapt to repeated minor annoyances (e.g., commuting delays), potentially reducing their experienced disutility per instance over time, *without* necessarily reducing it to zero. *Case:* Does the inconvenience become genuinely less bothersome with daily repetition?
  12. **Thresholds of Notice/Concern:** Must align with psychology showing minor sensations below a threshold may not register consciously or trigger evaluative concern *in the moment*. *Case:* Is the inconvenience consciously perceived as negative each time, or is it background noise?
  13. **Framing & Context Dependence:** Must acknowledge that the *meaning* and experienced burden of a minor harm can depend on context (e.g., perceived fairness, necessity, alternatives). *Case:* Is the inconvenience resented as pointless bureaucracy or accepted as a necessary safety measure?

  ### IV. Theoretical Commitments & Non-Negotiables
  14. **Additivity Requirement (Consequentialist):** *For Consequentialists:* Must provide a method for summing disutility/well-being decrements across individuals to determine net outcome. Failure here invalidates core consequentialism. *Non-Negotiable for Utilitarians.*
  15. **Constraint Requirement (Deontological/Rights-Based):** *For Deontologists:* Must identify agent-relative constraints prohibiting actively imposing certain types/amounts of harm on individuals, even for large aggregate benefits or to prevent greater harms by others. *Non-Negotiable for Rights Theorists.* (e.g., You cannot *impose* significant harm on A to save B from a greater harm, let alone for specks).
  16. **Non-Aggregation Limit (Some Deontologists):** Must incorporate a principle that genuinely minor harms *cannot* be aggregated to outweigh significant harms to a few when imposing the minor harms. *Commitment of Anti-Aggregationists.*
  17. **Permissibility of Allowing Harm (vs. Doing Harm):** Must provide a principled account of when (if ever) allowing a greater harm (by inaction) is preferable to actively imposing numerous smaller harms. *Central to the Doing/Allowing Distinction.*

  ### V. Key Tensions & Scorecard
  *   **Primary Tension:** **Additivity (14)** directly conflicts with **Constraint (15)** and **Non-Aggregation Limit (16)**. Satisfying 14 generally requires rejecting 15 & 16. Satisfying 15 & 16 generally requires limiting or rejecting additivity across persons for imposition.
  *   **Secondary Tension:** **Scale Amplification (4)** and **Negligibility Distinction (7)** conflict with **Non-Aggregation Limit (16)**. 4 & 7 push towards aggregation; 16 forbids it.
  *   **The Eliminator:** The **Constraint Requirement (15)** does the most to eliminate standard positions. It immediately excludes **Pure Act Consequentialism/Utilitarianism** (which rejects agent-relative constraints). Any theory satisfying 15 must be fundamentally non-consequentialist (e.g., Deontological, Contractualist, some Hybrid views).

  **Brief Scorecard of Standard Positions:**
  *   **Classic Utilitarianism:** Satisfies 1, 2, 4, 14. Fails 9, 10, 15, 16. Tension on 7. Ignores 3, 11, 12, 13 unless incorporated empirically.
  *   **Prioritarianism/Weighted Aggregation:** Satisfies 1, 2, 4, 14 (modified). Fails 9, 10, 15, 16. Tension on 7. Better on 10? Ignores 3, 11, 12, 13.
  *   **Rights-Based/Deontological (No Aggregation):** Satisfies 9, 10, 15, 16. Fails 1, 2, 4, 14. Struggles with 3 (Imposed vs. Permitted). May handle 5, 6, 7, 8 well. Ignores 11, 12, 13.
  *   **Scalar Consequentialism:** Satisfies 1, 2, 4, 14 (as best action). Fails 9, 15, 16. Tension on 7, 10. Ignores 3, 11, 12, 13.
  *   **Contractualism (Scanlon-style):** Satisfies 9, 10, 15 (via justifiability), potentially 16. Struggles with 1, 2, 4 (aggregation problem). Handles 3, 7, 8 well. May incorporate 11, 12, 13 via reasonable rejection.

  This framework provides the necessary lenses to critically evaluate any proposed theory of small harm aggregation for your board's decision. It highlights why the dust-speck analogy alone is inadequate: it assumes a specific resolution (usually pro-aggregation) of the fundamental tensions outlined here, particularly between Additivity (14) and Constraints (15). Your task is to find which resolution best fits the empirical realities of the burdens and the ethical principles governing your role.
