prompt: |-
  Write the desiderata that any adequate account of whether genuine moral dilemmas exist must deliver. Each criterion should specify what phenomena it must explain—logical consistency of obligation, the phenomenology of unavoidable wrongdoing, the boundary between dilemma and mere tragedy, and especially "binding-residue" cases in which fulfilling one non-delegable duty constitutively frustrates another that stays normatively active—together with the motivating case behind it; flag any pair you take to be jointly unsatisfiable; and briefly register how consistency, residue, and pluralist views fare. Present your response as exactly five numbered items, each one or two sentences long, with no introduction or conclusion.
reasoning: |-
  Hmm, the user wants me to write desiderata for theories about moral dilemmas. They want five numbered items, each one or two sentences long, with specific components: what phenomena must be explained, motivating cases, flagging of any jointly unsatisfiable pairs, and a brief note on how different views handle consistency, residue, and pluralism.

  Let me break down the key elements. The phenomena to cover include logical consistency of obligation (like conflicts between duties), phenomenology of unavoidable wrongdoing (how it feels to be in such situations), boundary with mere tragedy (where no real conflict exists), and especially binding-residue cases where one duty is fulfilled but another remains active. Motivating cases are needed for each, such as Sartre's student dilemma or Agamemnon's sacrifice.

  I need to flag any pairs that might be jointly unsatisfiable—probably the residue and consistency requirements, as they often clash in theories. Then, briefly touch on how consistency views (which deny dilemmas), residue views (which emphasize lingering duties), and pluralist views (which allow for conflicts) fare on each point. 

  The response must be exactly five items, concise, with no intro or conclusion. I'll structure each item to cover one desideratum: starting with logical consistency, then phenomenology, then the boundary issue, then residue cases as a highlight, and finally the conflict between residue and consistency. 

  For the motivating cases: I'll use Agamemnon for consistency/conflict, Sartre for phenomenology, a medical triage example for boundary, and Williams' Gauguin case for residue. The joint unsatisfiability should be noted in the last item, where residue and consistency can't both be fully satisfied. 

  On views: consistency theories like monism deny dilemmas by resolving conflicts; residue views acknowledge leftover obligations; pluralism accepts dilemmas as real. I'll weave these in briefly at the end of each item. 

  This should make the response tight and informative, directly answering the query.
answer: |-
  1. It must resolve the *logical consistency of obligation* problem—explaining how conflicting duties don't imply contradictory oughts or undermine deontic logic, motivated by cases like Agamemnon (sacrifice daughter or betray army); consistency views deny conflicts, residue/pluralist views accept conflicts but reinterpret obligation's logic.
  2. It must account for the *phenomenology of unavoidable wrongdoing*—explaining the agent's experience of inescapable guilt and regret despite reasoned choice, motivated by Sartre's student (care for mother vs. fight oppression); consistency views dismiss this as error, residue/pluralist views take it as veridical.
  3. It must distinguish *genuine dilemmas from mere tragedies*—explaining why some conflicts involve binding obligations rather than just competing values, motivated by triage (saving one life over another isn't always dilemmatic); consistency views see only tragedy, residue/pluralist see obligation-based conflict.
  4. Crucially, it must explain *binding-residue cases*—where fulfilling one non-delegable duty constitutively frustrates another, which remains normatively active (e.g., Williams' Gauguin: abandoning family for art leaves enduring obligations); consistency views deny residue is binding, residue views affirm it, pluralism accommodates it.
  5. It must address that *residue and logical consistency may be jointly unsatisfiable*—residue implies a frustrated duty remains a duty ("ought" without "can"), conflicting with standard deontic logic; residue/pluralist views reject or revise the logic, consistency views reject residue to preserve it.
