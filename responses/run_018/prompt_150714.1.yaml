  ok so ive been thinking about quines rabbit thing and i keep running into this situation in my head. suppose youre translating a language where people say something like "that act is wrong" but you can translate it as "that act violates an objective moral law" or as "that act conflicts with our local norms" and both translations predict every future utterance and behavior exactly the same. the speakers never do anything that distinguishes belief in real moral facts from just having strong cultural rules. so the translator is stuck with two manuals that are empirically perfect but embed totally different metaphysics. i know quine talks about ontological indeterminacy with gavagai and rabbits, but is there a specific name for when the underdetermination hits specifically normative or ethical commitments? like is this just the same old indeterminacy applied to ethics, or has someone carved out a separate concept for moral translation indeterminacy? and if theres no name, what should we call the boundary where ontology ends and normative framing begins in these cases?
