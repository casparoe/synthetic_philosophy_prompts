prompt: |-
  I’m prepping a session for a mixed reading group — mostly sociology grad students with zero background in aestetics — on Du Bois’s claim that art is propaganda. Not the watered-down version where he just wanted political posters, but the weirder dependency he sets up between double-consciousness and the kind of racial message that only aesthetic form can carry. I need the teaching plan, not the explanation itself: the exact order the ideas have to land in so that "propaganda" doesn’t immediately collapse into "manipulation" or "explicit argument"; the one carrying example that should run through the whole session (I’m leaning toward the sorrow songs, but tell me what that example needs to have and what it must avoid — like, no explicit call to action — and whether that’s actually the right choice); the misconceptions they’ll bring or form in sequence — probably first that he’s reducing beauty to politics, then that propaganda means lying, then maybe that he thinks Black art should only depict suffering — and exactly where in the arc to defuse each; one end-check, maybe classifying a hypothetical piece, that proves they’ve understood the dependency rather than just memorized the slogan; and what I should openly refuse to cover at this level and say so — maybe the Kantian aesthetic framework he’s implicitly pushing back against? I was arguing with a friend last night who thinks I’m overreading the aesthetic part, so I want the plan to definatly show why that part isn’t optional. Please lead with the bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is prepping a session on Du Bois's claim that art is propaganda for sociology grad students with no aesthetics background. They need a teaching plan that avoids common misconceptions and emphasizes the essential role of aesthetic form. 

  First, I need to ensure "propaganda" isn't misinterpreted as manipulation. The bottom line is that Du Bois sees art as conveying racial experience through aesthetic form, which is necessary due to double-consciousness. The sorrow songs are a strong example, but I need to highlight their formal elements like structure, repetition, and coded language. 

  The user mentioned potential misconceptions: reducing beauty to politics, propaganda as lying, and Black art only depicting suffering. I should map out where to address each in the session arc. For instance, early on, clarify that aesthetic form isn't secondary but the vehicle for the message. Later, tackle the suffering misconception by showing how sorrow songs encompass resilience and critique.

  The end-check activity needs to test understanding of dependency, not just memorization. A hypothetical piece classification could work—maybe a contemporary piece with layered meanings. The user also wants to explicitly exclude Kantian aesthetics, noting it's beyond scope but mentioning Du Bois's implicit pushback.

  The user’s friend thinks they're overreading the aesthetic part. The plan must prove it's essential by showing how double-consciousness requires aesthetic form to convey what explicit messages cannot. Using sorrow songs throughout the session can demonstrate this dependency clearly. 

  I should structure the session to introduce double-consciousness first, then sorrow songs as the core example. Each phase should build on the previous, addressing misconceptions as they arise. The conclusion should reinforce that aesthetic form isn't optional but central to Du Bois's argument.
answer: |-
  **Bottom line:** Anchor the entire session on how Du Bois's double-consciousness *necessitates* aesthetic form (not explicit argument) as the *only* effective vessel for conveying the complex, lived truth of racial experience, making "propaganda" about unavoidable communication of essence, not manipulation.

  **Teaching Plan Structure & Reasoning:**

  1.  **Hook & Problem Setup (15 mins):**
      *   **Start:** Quote Du Bois ("All Art is propaganda...") & prompt: "What's the *most uncomfortable* association you have with 'propaganda'? Why would a civil rights leader embrace this term for *Art*?" (Surface initial bias: manipulation, lies, oversimplification).
      *   **Introduce Core Tension:** Frame Du Bois's challenge: How can Black art communicate the *specific, complex reality* of the Black experience in America to a hostile or ignorant white world *and* affirm Black humanity to Black people, *when direct political speech fails or is suppressed*? Connect to sociology's interest in communication, power, and representation.

  2.  **Foundation: Double-Consciousness as the Engine (20 mins):**
      *   **Deep Dive:** Re-read/review key passages on double-consciousness (*Souls*). Emphasize: "this sense of always looking at one's self through the eyes of others," the "twoness," the veil, the *internal* struggle for self-definition amidst external distortion.
      *   **Key Insight:** Highlight that double-consciousness creates a *unique, irreducible perspective* – a lived truth that cannot be fully captured by straightforward political rhetoric or factual reporting alone. It's about *feeling* and *being*, not just facts.

  3.  **Introduce the Core Example: The Sorrow Songs (10 mins):**
      *   **Why Sorrow Songs:** They are Du Bois's *own* prime example in *Souls*. They embody history, coded resistance, deep emotion, communal expression, and undeniable aesthetic power *without explicit calls to action or argument*. **Crucially:** They predate formal political movements, emerging *from* the lived experience.
      *   **What It Must Have:** Deep emotion (sorrow, hope, resilience), coded language/spiritual metaphor ("Steal Away," "Nobody Knows the Trouble I've Seen"), communal origin & transmission, inherent musical/poetic beauty, historical weight, *absence* of direct political instruction.
      *   **What It Must Avoid:** Any example with overt sloganeering, literal depictions of current events meant *only* as documentation, art explicitly designed *only* for a protest march. (Avoid, e.g., a 1960s SNCC poster).

  4.  **The Dependency: Aesthetic Form as the Necessary Vessel (20 mins):**
      *   **The Crucial Link:** Ask: "How do the Sorrow Songs communicate the *essence* of double-consciousness – the internal conflict, the resilience, the critique – in a way a political speech *could not* to that same 1903 audience?"
      *   **Focus on Form:** Analyze *how* the songs work: Repetition (persistence), call-and-response (community/veil), metaphor (coded meaning/survival), musical tension/resolution (internal conflict/hope), raw emotional power (bypassing intellectual resistance). **Emphasize:** The form *is* the message carrier; the beauty/emotional impact *is* the vehicle for the "propaganda" (truth-telling).
      *   **Defuse Misconception #1 (Beauty Reduced to Politics):** Explicitly state: Du Bois isn't saying art is *only* politics. He's saying the *unique racial experience* (born of double-consciousness) *inherently shapes* the perspective communicated, and that communicating this complex perspective *requires* the full power of aesthetic form to be *felt* and *understood* authentically. The form makes the truth palpable and undeniable. Beauty is the *medium*, not an afterthought.

  5.  **Refining "Propaganda" & Defusing Key Misconceptions (15 mins):**
      *   **Redefine Propaganda:** Contrast initial associations with Du Bois's meaning: Not lies/manipulation, but the *inescapable communication of a group's essential truth and perspective* through cultural expression. It's about *what is being conveyed* unavoidably, not *how* it's being twisted.
      *   **Defuse Misconception #2 (Propaganda = Lying):** Stress: Du Bois demands art reveal the *truth* of Black experience ("the experience of the human soul") as *lived*, which is complex and often contradictory (like double-consciousness). Aesthetic form allows this complexity to be conveyed authentically. Lying would defeat his purpose.
      *   **Defuse Misconception #3 (Only Suffering):** Use the Sorrow Songs: Point to expressions of hope ("Deep River"), faith, resilience, community strength, *and* critique within them. Du Bois calls for depicting Black life in its *full humanity* – joy, love, intellect, beauty – which is *itself* a radical political act against racist caricature. The "message" is the affirmation of full humanity.

  6.  **End-Check: Applying the Dependency (15 mins):**
      *   **Activity: "Is this Du Boisian Propaganda?"** Present a short description of a *hypothetical* contemporary artwork (e.g., "A hauntingly beautiful abstract dance piece using fragmented movement and syncopated rhythms, created by a Black artist drawing on ancestral memories and urban tension, evoking a sense of both dislocation and powerful resilience"). **Crucially, it should have NO explicit political symbols or narrative.**
      *   **Ask:** "Would Du Bois likely call this 'propaganda' in his sense? *Why or why not?* Focus your answer on the relationship between potential lived experience (double-consciousness), the use of aesthetic form, and the likely communication of an essential perspective/truth." **Success:** They identify how form conveys complex essence without explicit argument, linking it back to the necessity born of the racialized experience.

  7.  **Conclusion & Deliberate Omission (5 mins):**
      *   **Reiterate Bottom Line:** Du Bois argues that the specific condition of double-consciousness *demands* aesthetic form to communicate the Black experience truthfully and effectively. Propaganda here means the unavoidable transmission of essential perspective, achieved *through* the unique power of art. **This aesthetic dimension is NON-OPTIONAL**; it's the core mechanism for conveying what explicit politics cannot.
      *   **Explicitly Omit:** "We are *not* diving into the specific Kantian framework of disinterested beauty that Du Bois is implicitly challenging. That's crucial for advanced aesthetics scholarship, but for today, grasp *why* Du Bois insists on this fusion: the lived reality dictates the form of communication needed." (This omission highlights the *necessity* you're focusing on).

  **Why This Plan Proves the Aesthetic is Essential:**
  *   Double-consciousness is established first as the *source* of the unique perspective.
  *   The Sorrow Songs example is analyzed *specifically for how their aesthetic form* (music, structure, metaphor) carries the complex meaning.
  *   The redefinition of propaganda *hinges* on the effectiveness of aesthetic form for truth-telling.
  *   The end-check *tests* understanding of the dependency (experience -> necessity of form -> communication of essence).
  *   Omitting Kant *while mentioning it* underscores that Du Bois is doing fundamental aesthetic work distinct from mainstream (white) theory. Your friend's "overreading" claim is countered by making the aesthetic the *structural core* of the argument's logic.
