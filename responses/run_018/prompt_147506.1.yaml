  The user wants a reusable decision procedure in checklist form. This checklist needs to have ordered questions, criteria for sufficient answers, clear rejection points, and indicate when issues require human judgment due to normative aspects. It must differentiate legitimate causal attribution from determinism, and specifically test for those two failure modes. Then they want this procedure applied to two case studies: one on the Black Death's impact on English labor contracts, and another on the Laki eruption's role in the French Revolution. For each case, I need to show where the procedure gives clear judgments, where it stalls, and what additional information could resolve those stalls. Finally, I should indicate what would cause me to revise the procedure, especially where the boundary between causal agency and determinism is fragile, and where my reasoning is most exposed to error.

  First, I'll outline the key components the procedure must cover. It needs to handle causal attribution without determinism, so questions should probe whether human agency and institutional mediation are properly acknowledged. For post-hoc ventriloquism, I'll need questions that detect inconsistent framing—anthropomorphism in narratives versus mechanistic treatment in analyses. For scalar slippage, questions must verify that pathways between non-human forces and human outcomes are specified, not assumed. The rejection point should be clear, like when core claims lack empirical support or mediation pathways.

  For the checklist structure, I'll start with foundational items like causal framing to catch determinism early. Then move to specific tests for the two failure modes. Each question should have clear pass/fail criteria, with rejection triggers for critical flaws. I'll include a handover to human judgment for normative elements, like defining "decisive actor." 

  Applying to the Black Death case: The study argues mortality directly reshaped labor contracts. The procedure would pass on causal framing but likely flag mediation pathways (scalar slippage). If the proposal doesn't specify how mortality led to contracts—e.g., via labor scarcity enabling worker bargaining—it stalls. Additional info needed: institutional mechanisms like manorial court records showing negotiations. Post-hoc ventriloquism might be absent if language avoids anthropomorphism.

  For the Laki eruption and French Revolution case: The claim calls Laki a "decisive actor," risking both failure modes. Causal framing may pass if it acknowledges human factors, but "decisive actor" could imply intent (ventriloquism). Scalar slippage is high if it skips mediation—e.g., how crop failures led to unrest without showing links to bread prices or tax policies. Stalls would require evidence of pathways, like economic data connecting eruption to bread riots. Rejection might occur if mediation is absent.

  Finally, the procedure's fragility lies in distinguishing "constraining" versus "determining" effects. New evidence showing non-human forces overwhelming human agency (e.g., a study proving climate shifts made war inevitable) could challenge this boundary. My reasoning is most exposed in assuming mediation is always necessary; if a case shows direct causation, the scalar slippage test might be too strict. I'd revise if empirical work demonstrates irreducible macro-level agency in specific contexts.
answer: |-
  Here is a reusable decision procedure for evaluating proposals on non-human forces in historical causality, designed to prevent environmental determinism while testing for "post-hoc ventriloquism" and "scalar slippage":

  ---

  **Decision Procedure: Non-Human Agency Evaluation Checklist**

  1.  **Causal Framing Clarity**
      *   *Question:* Does the proposal explicitly state that non-human forces **constrain, enable, or create contexts for** human action, rather than **determine** specific social/political outcomes?
      *   *Sufficient Answer:* Yes, with clear language distinguishing "conditioning factors" from "sufficient causes." Human agency/institutions must be framed as active mediators.
      *   *Failure:* Explicit or implied language suggesting outcomes were *inevitable* given the non-human force. **Negative determination if failed.**
      *   *Judgment Handover:* If framing is ambiguous or relies on contested philosophical definitions of agency/determinism.

  2.  **Mechanism Specification (Mediation Test)**
      *   *Question:* Are the **specific institutional, social, or cultural pathways** linking the non-human force (e.g., pathogen spread, climate anomaly) to the proposed human outcome (e.g., legal change, political conflict) empirically grounded and clearly described?
      *   *Sufficient Answer:* Identification of concrete mediating actors (e.g., landlords, courts, rebels), processes (e.g., wage negotiations, tax revolts, resource competition), and evidence types (e.g., archives, economic data, diaries) for tracing these pathways.
      *   *Failure:* Vague assertions (e.g., "led to," "caused") without specified mechanisms. **Negative determination if failed.** (Core test against scalar slippage).
      *   *Judgment Handover:* If the plausibility of proposed mechanisms hinges on normative interpretations of historical actors' motivations.

  3.  **Consistency Check (Ventriloquism Test)**
      *   *Question:* Is the **attribution of "agency" or "influence"** to the non-human force consistent throughout the proposal (narrative, analysis, methodology)? Does it avoid anthropomorphism ("demanded," "chose," "aimed") *except* as deliberate, critically examined rhetorical device?
      *   *Sufficient Answer:* Non-human forces are consistently described as *impersonal catalysts, pressures, or contexts*. Any metaphorical language is flagged and analyzed, not presented as explanatory.
      *   *Failure:* Inconsistent framing (e.g., narrative anthropomorphism vs. mechanistic analysis) *or* uncritical use of intentional language for non-human forces. **Negative determination if failed.** (Core test against post-hoc ventriloquism).
      *   *Judgment Handover:* If the interpretation of primary sources inherently relies on contested metaphorical readings.

  4.  **Scalar Integration Test**
      *   *Question:* Does the proposal demonstrate how **macro-scale non-human events** (e.g., multi-decade climate shift, continental pandemic) interact with **meso-scale human institutions** (e.g., markets, legal systems, states) and **micro-scale human actions/decisions** to produce the outcome?
      *   *Sufficient Answer:* Explicit discussion of scale translation, showing how the broad force filtered through specific institutional structures and human choices at lower scales.
      *   *Failure:* Direct leap from macro-force to macro-outcome (e.g., "Little Ice Age caused war") without intermediate scales. **Negative determination if failed.** (Core test against scalar slippage).
      *   *Judgment Handover:* If the relevant meso-scale institutions are poorly documented, requiring significant inference.

  5.  **Counterfactual & Contingency Assessment**
      *   *Question:* Does the proposal acknowledge plausible **alternative outcomes** or the role of **contingent human decisions** within the constrained context created by the non-human force?
      *   *Sufficient Answer:* Explicit discussion of how different human responses *could* have led to different outcomes within the same environmental context, or comparison to regions experiencing similar forces but different outcomes.
      *   *Failure:* Presentation of the outcome as the *only* possible result of the non-human force. **Negative determination if failed.**
      *   *Judgment Handover:* If assessing contingency relies heavily on speculative historical reasoning.

  6.  **Evidence Weighting Scrutiny**
      *   *Question:* Does the proposed methodology ensure that **explanatory weight** is distributed proportionally between the non-human force and the mediating human/institutional factors?
      *   *Sufficient Answer:* Research design includes methods to isolate/measure the impact of the non-human force *relative* to political, economic, or social factors (e.g., comparative case studies, quantitative analysis controlling for variables).
      *   *Failure:* Research design assumes the non-human force's primacy or lacks tools to assess the relative contribution of human agency. **Stall - Requires revision.**
      *   *Judgment Handover:* Determining the precise "decisiveness" of a factor is inherently interpretive.

  **Overall Decision Flow:**
  *   Fail any of Steps 1, 2, 3, or 4 → **Negative Determination.**
  *   Fail Step 5 → **Strong Tendency to Negative Determination** (may be overcome by exceptional strength elsewhere, rare).
  *   Fail Step 6 → **Stall - Revise & Resubmit Requested** (methodological flaw, potentially fixable).
  *   Pass all steps → **Proceed to standard scientific/technical merit review**.
  *   Judgment Handover triggered at any step → **Panel deliberation required** on the specific normative/interpretive issue flagged.

  ---

  **Application to Case Studies:**

  **Case 1: Black Death & English Labor Contracts (1350s)**
  *   **Step 1 (Framing):** Likely PASS. Proposal probably frames plague mortality as creating labor scarcity, altering bargaining power.
  *   **Step 2 (Mechanism):** **STALL/FAIL RISK.** *Where it stalls:* Does it specify *how* mortality reshaped contracts? Sufficient answer requires evidence of: 1) Regional mortality variation correlating with contract changes; 2) Mechanisms: Landlord responses (manorial court rolls showing enforcement struggles), worker actions (evidence of collective bargaining/refusal, migration), legal innovations (Statute of Labourers 1351 as reactive *human* policy). *Additional Info Needed:* Manorial records showing *process* of negotiation/conflict, petitions to authorities, localized economic data linking scarcity to specific contractual terms (cash vs. kind, length of tenure).
  *   **Step 3 (Ventriloquism):** PASS, unless narrative uses phrases like "the plague forced landlords to offer..." without critical distance.
  *   **Step 4 (Scalar):** **STALL RISK.** *Where it stalls:* Does it connect continent-wide pandemic mortality to individual manor/worker negotiations? Sufficient answer requires showing local mortality impact → local labor market shock → specific local/village-level contract changes mediated by existing feudal structures/customs. *Additional Info Needed:* Micro-historical studies linking parish mortality records to specific manor court proceedings documenting contract alterations.
  *   **Step 5 (Contingency):** PASS/STALL. Should acknowledge regional variations in response (e.g., compared to Eastern Europe) and that the *Statute of Labourers* was a specific, contested human policy choice attempting suppression.
  *   **Step 6 (Weighting):** PASS if methodology compares regions/villages with differing mortality rates and traces contract outcomes.
  *   **Judgment:** Clear **Negative** only if Steps 2 or 4 utterly lack mechanism/scalar path specification. More likely **Stall** requesting stronger evidence for mechanisms/scalar links.

  **Case 2: Laki Eruption (1783) & French Revolution (1789-)**
  *   **Step 1 (Framing):** **FAIL RISK.** Claiming Laki was a "decisive actor" strongly implies determinism. PASS only if rephrased as "contributed to crisis conditions" or "exacerbated pressures."
  *   **Step 2 (Mechanism):** **HIGH STALL/FAIL RISK.** *Where it stalls:* Must specify *exactly how* volcanic aerosols in Iceland led to French unrest. Sufficient answer requires: 1) Evidence of Laki's *specific* climatic impact in France (e.g., extreme weather 1783-88, crop failures); 2) Mechanisms: Crop failure → Grain price spikes → Bread riots (police/archival records); Revenue shortfall → Crown's fiscal crisis → Attempts at new taxes (Estates-General); Public panic/"famine plot" rumors (pamphlets, diaries). *Additional Info Needed:* Robust climate reconstructions proving France was severely affected; Economic data linking harvest failures *directly* to Paris/regional bread prices; Archival evidence showing fiscal shortfalls *attributed* to poor harvests in ministerial correspondence; Evidence of popular unrest *explicitly* citing hunger/weather.
  *   **Step 3 (Ventriloquism):** **FAIL RISK.** Calling Laki a "decisive actor" is classic ventriloquism, implying intentionality/primary causality. PASS only if language is strictly impersonal.
  *   **Step 4 (Scalar):** **HIGH FAIL RISK.** *Where it fails:* Direct leap from atmospheric event to political revolution. *Must* specify mediating scales: Climate → Agriculture/Economy → Fiscal Policy/Social Unrest → Political Crisis. Proposal likely absorbs diplomatic/fiscal/social explanatory weight into Laki.
  *   **Step 5 (Contingency):** **FAIL RISK.** Must acknowledge profound pre-existing political/fiscal/social tensions (Enlightenment, parlements, inequality), and examples of states surviving similar environmental crises without revolution.
  *   **Step 6 (Weighting):** **FAIL/STALL.** Methodology must *compare* the weight of Laki's climatic impact vs. deep structural factors (absolutism, debt, inequality). Extremely difficult; likely assumes Laki's primacy.
  *   **Judgment:** High probability of **Negative Determination** due to likely failures in Steps 1, 3, 4, 5, and challenges with Step 2/6. Only exceptionally strong, unprecedented evidence for Step 2 mechanisms could salvage it.

  ---

  **Procedure Revision Triggers & Fragile Boundaries:**

  1.  **Empirical Revision Trigger:** Discovery of **irreducible macro-level agency** in complex systems. Example: Compelling, widely accepted historical research demonstrating that a specific climate anomaly *directly triggered* a cascade of institutional failures across multiple societies in near-identical ways, *overwhelming* all plausible mediating human choices. This would challenge Step 4's strict mediation requirement.
  2.  **Conceptual Revision Trigger:** Development of a **rigorous, non-deterministic framework for "distributed agency"** that robustly incorporates non-human forces as co-participants *without* anthropomorphism or scalar collapse. If such a framework gained consensus, Steps 1 and 3 might need reworking.
  3.  **Fragile Boundary:** The line between **"decisively constrained"** and **"determined"** (Steps 1 & 5). When does a constraint become so overwhelming that meaningful choice is eliminated (e.g., total crop failure leading to famine)? Human adaptability makes this boundary porous and context-dependent. The procedure errs on the side of requiring evidence of *some* choice/pathway, but this could exclude valid cases of extreme constraint.
  4.  **Exposed Reasoning:** The procedure's core assumption – **that human-institutional mediation is *always* necessary and primary** – is most exposed. This reflects a commitment to humanistic history. It risks:
      *   **Type 1 Error:** Rejecting valid proposals where non-human forces played an unusually direct role because mediation is hard to document.
      *   **Oversimplification:** Potentially underestimating the profound, sometimes overwhelming, *immediacy* of environmental pressure on pre-modern societies. The insistence on complex pathways (Step 2) might obscure the raw, destabilizing *force* of events like pandemics or mega-eruptions.
      *   **Scalar Blindspot:** Difficulty handling phenomena that *intrinsically* operate across scales (e.g., pandemics affecting individual bodies and global trade simultaneously) without seeming to "leap."

  **Conclusion:** This procedure prioritizes human agency and institutional mediation as the irreducible core of historical explanation while acknowledging the powerful conditioning role of non-human forces. It targets the specific pitfalls of ventriloquism and slippage identified. Its strength is demanding empirical specificity for causal pathways; its vulnerability lies in potentially undervaluing the sheer disruptive force of environmental events and the theoretical challenges of non-human agency. Revision would be driven by breakthroughs in modeling complex socio-natural systems or compelling empirical demonstrations of near-deterministic environmental causality in specific historical conjunctures.
