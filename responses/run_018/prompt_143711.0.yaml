answer: |-
  Here’s the joint statement on moral compromise, drafted as an adversarial collaboration between the "Trade-Is-Real" and "No-Dirty-Hands" camps, in line with your specs:

  **Joint Statement: On Value Leakage in Moral Compromise**  
  *(Drafted following adversarial collaboration by representatives of both camps)*  

  ---

  ### 1. Agreed Claims  
  *(Points both camps accept as foundational)*  

  > 1. **Value leakage occurs**: When parties with conflicting values negotiate a compromise, the act of sacrificing a value *can* psychologically, symbolically, or consequentially "taint" the gains for one or both parties.  
  > 2. **Leakage varies by context**: Not all values leak equally. Sacred or "protected" values (e.g., core moral principles) are more prone to leakage than instrumental or negotiable ones (e.g., resource allocation).  
  > 3. **The logging case exemplifies leakage**: In the activist-logger compromise (protection for logging rights), the activist’s gain (protected zone) *is* partially diminished by the moral cost of permitting logging elsewhere. The logger’s gain *may* also be tainted by new restrictions.  
  > 4. **Leakage isn’t always quantifiable**: Its impact is often subjective, cultural, or relational—not purely transactional.  
  > 5. **All compromises risk leakage**, but not all compromises *experience* it.  

  ---

  ### 2. Disagreements Table  
  *(Each camp’s core position, in their own words)*  

  | **Camp**              | **Position Statement**                                                                                                |
  |-----------------------|-----------------------------------------------------------------------------------------------------------------------|
  | **Trade-Is-Real**     | *"Values are commensurable and can be traded like currencies. Leakage is a negotiable cost, not a veto. Smart bargaining nets *real gains*—tainted gains are still gains, and often the best available outcome."* |
  | **No-Dirty-Hands**    | *"Core values are incommensurable. Compromise that violates a foundational principle corrupts *all* gains. Leakage isn’t a cost—it’s contamination. No one ‘wins’; we only minimise damage."* |

  ---

  ### 3. Cruxes  
  *(Sub-questions that could resolve the debate if answered)*  

  1. **Can leakage be "priced in"?**  
     *Is leakage just another cost to factor into bargaining (like friction in economics), or is it a qualitatively different form of loss?*  

  2. **Do *sacred* values exist?**  
     *Are some values truly non-negotiable (e.g., "never kill innocents"), making leakage inevitable and catastrophic when compromised?*  

  3. **Does time heal leakage?**  
     *Does the taint fade if the compromise yields long-term net good (e.g., saved species in the logging deal), or is the corruption permanent?*  

  ---

  ### 4. Test Cases & Predictions  
  *(Agreed relevant examples + camp predictions)*  

  #### Crux 1: **Can leakage be "priced in"?**  
  - **Test Case**: *A vegan agrees to endorse a lab-grown meat company funded by a factory farm conglomerate, in exchange for the company shifting 50% of its research to animal-free tech.*  
    - **Trade-Is-Real Prediction**: *The vegan gains measurable progress toward abolishing factory farms. Leakage (endorsing a "tainted" funder) is a bearable cost for net moral gain.*  
    - **No-Dirty-Hands Prediction**: *The endorsement legitimises factory farming. "Pricing in" is impossible—any gain is corrupted by complicity.*  

  #### Crux 2: **Do *sacred* values exist?**  
  - **Test Case**: *A pacifist nation allows a foreign military base on its soil in exchange for disaster relief aid, violating its core anti-war principle.*  
    - **Trade-Is-Real Prediction**: *No value is truly sacred if the stakes are high enough. Saving lives via aid justifies temporary moral flexibility.*  
    - **No-Dirty-Hands Prediction**: *Violating a sacred value (pacifism) irreparably degrades the nation’s moral identity. Aid gained is morally worthless.*  

  #### Crux 3: **Does time heal leakage?**  
  - **Test Case**: *A climate scientist accepts fossil fuel funding for clean energy research, accelerating green tech by 10 years. Later, the funded tech helps phase out fossil fuels.*  
    - **Trade-Is-Real Prediction**: *Short-term leakage (taking "dirty" money) is offset by long-term gains. Future good "cleans" the compromise.*  
    - **No-Dirty-Hands Prediction**: *The initial corruption (empowering fossil fuels) persists. Future gains are built on a poisoned foundation—time doesn’t sanitise betrayal.*  

  ---  
  **Signed:**  
  *For the Trade-Is-Real Camp* — "Gains are real, even when messy."  
  *For the No-Dirty-Hands Camp* — "No clean hands, no clean gains."  

  ---  
  This draft sticks to British English ("prioritise", "legitimises") and avoids citations. The logging case threads through as your anchor example. Let me know if you’d tweak the tone or add another test case!
