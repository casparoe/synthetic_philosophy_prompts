answer: |-
  ## The Core Thesis (150 words)

  Inheritance taxation should be reconceived not as a simple levy on wealth transfers, but as a system of "dynastic opportunity-cost adjustments." The primary moral failing of large intergenerational wealth transfers is not the mere fact of familial asset accumulation, but the demonstrable harm they inflict on social mobility. Capital locked within dynastic networks reduces the "intergenerational elasticity of opportunity" (IOE) – the ease with which non-heirs can improve their socioeconomic standing relative to their parents. This constitutes a negative externality: dynastic retention imposes measurable opportunity costs on society at large by restricting the pool of capital available for broad-based opportunity creation. Tax liability should therefore be calibrated progressively, not to the absolute estate value, but to the estimated *marginal reduction in IOE* caused by retaining that specific capital within the dynasty, thereby internalizing this social cost.

  ## The Argument from Mobility Elasticity (250 words)

  The core argument hinges on the measurable impact of concentrated, dynastic capital on social mobility, quantified as Intergenerational Elasticity of Opportunity (IOE). High IOE indicates rigid stratification: children's outcomes are heavily determined by parental status, signifying low mobility. Empirical evidence consistently shows that societies with high wealth concentration exhibit higher IOE. Dynastic wealth perpetuates this by:

  1.  **Capital Lock-in:** Large inheritances divert significant capital from productive investment in public goods (education, infrastructure, entrepreneurship support) or broader capital markets that fuel opportunity creation for all. Capital is instead preserved for dynastic consumption and control.
  2.  **Positional Advantage:** Inherited wealth buys exclusive access to elite education, networks, and opportunities, creating artificial barriers for non-heirs. This entrenches advantage beyond merit.
  3.  **Reduced Meritocratic Efficiency:** When outcomes are heavily determined by birth rather than talent/effort, society misallocates human capital, reducing overall productivity and dynamism.

  Retaining capital within a dynasty thus imposes a quantifiable social cost – a reduction in aggregate opportunity and mobility elasticity. The conventional estate tax, focused on transfer value, fails to directly address this harm. A mobility-centric tax instead calculates liability based on the estimated *marginal* contribution of a specific retained inheritance to *reducing IOE*. Larger inheritances in highly concentrated dynasties, where capital is demonstrably scarce for opportunity creation elsewhere, would face higher marginal rates, reflecting their greater externalized cost. This directly targets the harm – the constriction of the opportunity landscape for strangers.

  ## First Objection and Reply (200 words)

  **Objection:** Tying tax liability to contingent sociological correlations (IOE impact) violates the principle that moral obligations should track *intrinsic wrongs* in the act itself, not merely its external effects. Taxation based on effects risks punishing individuals for societal conditions beyond their direct control or intent.

  **Reply:** This objection misunderstands the nature of the wrong. The intrinsic wrong of large-scale dynastic wealth retention *is* the externalization of mobility costs. Retaining vast capital within a closed network isn't a neutral act; it is inherently an act of *withholding* capital from the broader societal pool necessary for widespread opportunity generation. The negative impact on IOE isn't an accidental side-effect; it is the *direct and foreseeable consequence* of choosing dynastic consolidation over alternative uses of that capital (e.g., consumption, charitable donation, or its redistribution via tax for public investment). The sociological correlations (wealth concentration <-> high IOE) reveal the causal mechanism of the intrinsic harm: the act of dynastic retention *just is* the act of imposing opportunity costs on non-heirs. The tax liability directly corresponds to the magnitude of this intrinsic, externalized harm caused by the retention decision.

  ## Second Objection and Reply (200 words)

  **Objection:** Framing inheritance as an opportunity-cost externality dissolves the boundary between private testamentary freedom/bequest rights and collective welfare optimization. It justifies unlimited state intervention in private property dispositions based on social outcomes, undermining the core autonomy associated with bequests.

  **Reply:** The boundary is preserved by grounding the tax in *corrective justice*, not pure social welfare maximization. Corrective justice rectifies harms inflicted by one party (the dynasty) upon others (society suffering reduced mobility). The state acts not as a welfare optimizer seizing assets arbitrarily, but as an agent enforcing compensation for a measurable harm caused by the private act of dynastic retention. The right to bequeath remains intact *in principle*; however, like all rights, it is constrained by the duty not to inflict significant, quantifiable harm on others. The tax is the mechanism for fulfilling the compensatory duty arising from that harm. The calibration to *marginal IOE reduction* ensures the levy is proportionate to the specific harm caused, not a blanket confiscation. This preserves a core zone of testamentary freedom (small bequests, charitable giving not harming mobility) while requiring compensation when exercising that freedom demonstrably damages the opportunity structure for others.

  ## Bottom Line (100 words)

  Reconceiving inheritance tax as a dynastic opportunity-cost adjustment offers a more robust moral and practical foundation. It shifts the justification from contested notions of fairness in transfers or redistribution, to the measurable social harm of reduced mobility (IOE). By targeting the *marginal external cost* of capital retention within dynasties, it internalizes a specific harm, transforming the tax into an instrument of corrective justice. This preserves legitimate bequest rights while demanding compensation for the quantifiable damage large dynastic accumulations inflict on societal opportunity, providing a principled rationale for progressive taxation calibrated to the actual social cost of inherited privilege.
