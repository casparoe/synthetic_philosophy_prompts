prompt: |-
  I'm preparing a seminar presentation defending the view that famines should be classified as political crimes rather than natural disasters, with particular attention to Amartya Sen's entitlement framework. I want to introduce a refinement I call "entitlement camouflage" — situations in which formal exchange and direct entitlements remain technically intact on paper, yet are rendered practically inaccessible through administrative friction, localized procurement locks, misreporting protocols, or bureaucratic gatekeeping, so that starvation occurs alongside documented food surplus. I apply this idea to the 1943 Bengal famine, the mid-19th-century Irish famine, and the Great Leap Forward period in China, arguing that in each case the critical failure was not a collapse of entitlement in Sen's original sense but its deliberate camouflage. The audience will be a seminar of economic historians and development scholars, mostly familiar with Sen but skeptical of framing famines as crimes; they value empirical precision, distrust rhetorical escalation, and include at least one development economist who will defend Sen's original formulation rigorously. Please structure your response exactly as follows.

  Section 1 — Thesis in brief (approximately 150 words): Restate the entitlement-camouflage claim concisely, distinguishing it from ordinary entitlement collapse, and summarize its application to Bengal, Ireland, and the Great Leap Forward in one paragraph.

  Section 2 — Audience dynamics (approximately 100 words): Characterize how this specific room will hear the argument, identifying which members will resist the moral framing, which will probe the empirical distinction, and what vocabulary they will use.

  Section 3 — Ordered objections (approximately 800 words): Present six objections in the order they are likely to arise, from least to most damaging. For each objection: (a) phrase it exactly as an economic historian or development scholar in this room would put it; (b) provide a reply suitable for about two minutes of speaking time; (c) flag the weakest point in that reply; and (d) note whether the reply requires an explicit concession.

  Section 4 — What to concede upfront (approximately 150 words): Identify two specific points that should be conceded in the opening minutes to maintain credibility with this audience, with brief reasoning for each concession.

  Section 5 — The reply that must land (approximately 150 words): Identify the single argumentative move that, if it fails, collapses the presentation; explain why it is decisive and how to deliver it without sounding defensive.

  Section 6 — The unasked question (approximately 100 words): State the sharpest objection I am hoping nobody raises, phrase it as that audience member would, explain briefly why it is especially dangerous, and suggest a brief deflection rather than a full answer.

  Section 7 — Strategic closing note (approximately 100 words): One paragraph on tone — where precise empirical language is required, where rhetorical or moral force is permissible, and where it should be avoided entirely.

  Please avoid bibliographies, reading lists, citations, or references to specific texts I could not verify from general knowledge. Do not quote any historical source or theoretical text verbatim; paraphrase all claims about Sen, the famines, and Chinese procurement policy. Do not invent specific archival documents, statistical tables, or page references.
