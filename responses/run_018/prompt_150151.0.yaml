prompt: |-
  I serve on a three-person municipal ethics advisory panel for a mid-sized city (population approximately 400,000) that is revising its substance-use policy framework. Our mandate is evaluative rather than legislative: we must assess concrete proposals—maintaining prohibition with expanded pre-arrest diversion, adopting a Portugal-style administrative decriminalization model for personal-use possession, or legalizing cannabis through licensed supply with regulatory caps—before they advance to the city council. I want a reusable decision procedure, grounded in Philip Pettit's republican theory of freedom as non-domination and its distinction between arbitrary and non-arbitrary interference, that my panel can apply in roughly ninety minutes. The procedure should proceed in ordered stages: first, identifying whether a proposal creates, removes, or restructures powers of arbitrary interference over users, suppliers, and affected communities; second, testing whether institutional safeguards (transparency, contestability, proportionality, and reversibility) render any remaining interference non-arbitrary; third, assessing outcomes through a capabilities lens—specifically, which real freedoms are expanded or contracted—without reducing this step to a utilitarian aggregation. For each stage, specify what evidence would count as sufficient, where the procedure must halt with a negative recommendation, and where it necessarily yields to judgment because the issue is one of normative values rather than institutional design. Include a compact set of test scenarios for classifying borderline cases, and flag any point where the procedure is likely to misfire.

  Then run the procedure on three proposals: (1) retaining criminal prohibition for possession but instituting mandatory diversion-to-treatment for first offenses; (2) decriminalizing possession for personal use and substituting administrative referral for criminal sanctions, modeled on Portugal's framework; and (3) legalizing cannabis through state-licensed private retailers with age restrictions and potency limits. Include at least one case in which the procedure yields an unwelcome result—specifically, that a prohibition regime with robust judicial oversight and clearly defined statutory limits may qualify as non-arbitrary interference, whereas a legalization regime with discretionary licensing and weak mechanisms for public contestation may not. Finally, please separate what is settled in the philosophical literature on republican freedom and non-domination from what is genuinely contested—particularly whether commercial supply under legalization can avoid arbitrary domination by market actors, and whether applying the capabilities approach to drug policy inevitably imports contested comprehensive moral doctrines—and do not present any contested interpretation as if it were the consensus view.
reasoning: |-
  We are creating a reusable decision procedure based on Philip Pettit's republican theory of freedom as non-domination. The procedure has three stages:

  **Stage 1: Identify Powers of Arbitrary Interference**
     - Assess whether the proposal creates, removes, or restructures powers of interference (over users, suppliers, and affected communities).
     - Arbitrary interference is interference that is not forced to track the interests and ideas of those affected, i.e., it is subject to the controller's will without adequate constraints.
     - For each group (users, suppliers, communities), identify if the proposal:
          a) Creates new powers of interference (e.g., new authorities to punish, regulate, or control).
          b) Removes existing powers of interference (e.g., decriminalization removes police power to arrest for possession).
          c) Restructures existing powers (e.g., shifts from criminal to administrative sanctions).
     - **Evidence required**: Legal texts of the proposal, existing law, and analysis of the powers granted or removed. Expert testimony on how the powers might be used in practice (e.g., from law enforcement, community advocates).
     - **Halt condition**: If the proposal creates significant new powers of arbitrary interference without any attempt to constrain them (e.g., broad discretionary powers without any safeguards), then it must be rejected at this stage.
     - **Judgment call**: Determining whether a power is arbitrary at this stage may be preliminary; stage 2 will test safeguards. However, if a power is clearly arbitrary by design (e.g., a vague provision allowing officials to act without any guidelines), that is a halt.

  **Stage 2: Test Institutional Safeguards**
     - For any powers of interference that remain (or are created), test whether they are rendered non-arbitrary by institutional safeguards. The key safeguards (from Pettit) are:
          a) **Transparency**: Decisions and processes must be open to public scrutiny.
          b) **Contestability**: Affected parties must have effective avenues to challenge decisions.
          c) **Proportionality**: Interference must be proportional to the legitimate aim.
          d) **Reversibility**: Decisions must be reversible in the face of new evidence or error.
     - **Evidence required**: The proposal's institutional design (e.g., oversight mechanisms, appeal processes, sunset clauses, reporting requirements). Comparative evidence from similar policies elsewhere on how safeguards work in practice.
     - **Halt condition**: If a power of interference lacks at least two of these safeguards (or if one is critically missing, e.g., no contestability at all) and the interference is significant, then the power is arbitrary and the proposal must be rejected.
     - **Judgment call**: The sufficiency of safeguards is context-dependent. For example, what counts as "effective" contestability? This may require normative judgment about the resources required for appeal, the independence of the reviewing body, etc.

  **Stage 3: Assess Outcomes via Capabilities Lens**
     - Using a capabilities approach (inspired by Sen and Nussbaum), assess which real freedoms (capabilities) are expanded or contracted for the affected groups (users, suppliers, communities). Focus on key functionings relevant to drug policy: health, social inclusion, security, employment, education, etc.
     - Do not aggregate outcomes (non-utilitarian). Instead, identify which capabilities are enhanced or diminished and for whom. Look for patterns of systemic disadvantage.
     - **Evidence required**: Empirical studies on similar policies (e.g., health outcomes, arrest disparities, economic impacts). Testimony from affected communities. Data on how the proposal might affect capabilities (e.g., if diversion programs improve health outcomes, or if criminal records hinder employment).
     - **Halt condition**: If the proposal systematically contracts capabilities for a vulnerable group without adequate justification (e.g., it worsens health and economic opportunities for a racial minority) and there is no countervailing expansion of capabilities for others that is necessary for a more fundamental freedom, then reject. However, note that this step is more about informing the overall judgment and may not necessarily halt the procedure if the interference is non-arbitrary (stage 2) but outcomes are mixed. The primary focus is on non-domination, but capabilities help assess the substantive freedom impact.
     - **Judgment call**: The capabilities approach requires selecting which capabilities matter. We avoid importing comprehensive moral doctrines by focusing on a thin list of basic capabilities (life, health, bodily integrity, social relations, etc.) that are necessary for any conception of a good life. But what counts as a "basic" capability and how to weigh trade-offs is contested and requires normative judgment.

  **Borderline Test Scenarios** (for classifying borderline cases in stage 1 and 2):
     - **Scenario A (Discretionary Licensing)**: A legalization regime grants licenses to sell cannabis, but the criteria are vague and the licensing board has high discretion. This creates arbitrary power unless there are strong safeguards (transparency in decisions, appeal process, clear criteria). Without safeguards, it's arbitrary. With safeguards, it may be non-arbitrary.
     - **Scenario B (Police Diversion)**: A diversion program gives police discretion to send someone to treatment instead of arrest. Without clear guidelines, this is arbitrary. With strict criteria and oversight, it may be non-arbitrary.
     - **Scenario C (Administrative Fines)**: Decriminalization replaces arrest with fines. If fines are set proportionally to income and there is an appeal process, it may be non-arbitrary. If fines are fixed and high, without regard to ability to pay, and no appeal, it remains arbitrary.

  **Flagged Potential Misfires**:
     - The procedure might misfire if:
          1. It underestimates the potential for indirect domination (e.g., in legalization, market actors might dominate through pricing or advertising, but Pettit focuses on state power). We must consider whether private actors can dominate arbitrarily and if the state fails to regulate them, that state failure is arbitrary interference by omission.
          2. It relies on institutional safeguards that exist on paper but are ineffective in practice (e.g., an appeal process that is too costly for the poor). This requires empirical assessment beyond the text.
          3. The capabilities assessment might be too permissive: a policy that passes stages 1 and 2 might still contract capabilities for some groups. The procedure does not require perfect capability expansion, but a severe contraction might lead to rejection.

  **Contested Issues in the Literature**:
     - **Commercial Supply and Market Domination**: Pettit's theory primarily addresses state domination. Whether market actors can dominate arbitrarily is contested. Some republicans argue that unregulated markets can be sources of domination (e.g., employers dominating workers). Others see domination as only from agents with intentional power. Thus, a legalization regime that allows private businesses might be critiqued for enabling market domination if it doesn't regulate against monopolies or exploitative practices.
     - **Capabilities Approach and Moral Doctrines**: The capabilities approach is intended to be a partial, political conception (per Nussbaum). However, selecting capabilities may involve contested values (e.g., is "recreational drug use" a capability?). We focus on basic capabilities that are preconditions for other freedoms (health, security, social inclusion) and avoid endorsing drug use per se.

  Now we run the procedure on the three proposals.

  ---

  **Proposal 1: Retain criminal prohibition for possession but institute mandatory diversion-to-treatment for first offenses.**

  *Stage 1: Identify Powers of Arbitrary Interference*
     - **Users**: The proposal retains the power of criminal prohibition (arbitrary interference if not safeguarded). It adds a new power: mandatory diversion to treatment for first offenses. This restructuring could reduce arbitrariness by removing arrest for first offenses, but mandatory diversion is a new power that could be arbitrary if not constrained.
     - **Suppliers**: No change (remains criminalized, so police and prosecutors retain power to interfere arbitrarily if not safeguarded).
     - **Communities**: Police may still focus enforcement in certain neighborhoods, potentially arbitrarily.
     - **Evidence**: Current law (prohibition) and the new diversion mandate. How is "first offense" defined? Is there discretion?
     - **Halt?**: Not necessarily, because stage 2 will test safeguards. But note that the criminal prohibition power remains and must be tested.

  *Stage 2: Test Safeguards*
     - **Existing criminal prohibition**: This power may be arbitrary without adequate safeguards. In many jurisdictions, police discretion in enforcement leads to racial disparities. The proposal does not change this. However, if the existing system has robust judicial oversight and clear statutory limits (as per the unwelcome case), it might be non-arbitrary. But let's assume the city's current system lacks strong safeguards (as is common). Without improvements, this remains arbitrary.
     - **Mandatory diversion**: This power must be tested.
          - Transparency: Are the criteria and process public?
          - Contestability: Can the user challenge the diversion order? Is there an appeal?
          - Proportionality: Is diversion proportionate? (e.g., for any amount of any drug? for a small amount of cannabis?)
          - Reversibility: Can the user exit if the treatment is inappropriate?
        If the proposal lacks these safeguards (e.g., no appeal, no defined criteria), the diversion power is arbitrary.
     - **Evidence**: The proposal's design for diversion. If it does not specify safeguards, we must assume they are absent.
     - **Halt condition**: If either the criminal prohibition or the diversion power lacks safeguards, the proposal fails. Given that the criminal prohibition is likely not safeguarded (unless the city already has strong safeguards), this proposal may fail at stage 2.

  *Stage 3: Capabilities Assessment*
     - **Users**: Diversion might expand health capabilities by providing treatment, but it contracts autonomy (forced treatment). Criminal records for non-compliance might contract employment capabilities. If diversion is applied inconsistently, it might create insecurity.
     - **Communities**: If enforcement is targeted in marginalized communities, their social inclusion and security capabilities may be contracted.
     - **Evidence**: Studies on diversion programs (e.g., racial disparities, effectiveness of mandatory treatment).
     - **Judgment**: The capabilities assessment might show mixed results. However, due to failure at stage 2, the proposal is already rejected.

  **Recommendation for Proposal 1**: Likely negative due to arbitrary interference in criminal prohibition and potentially in diversion without safeguards.

  ---

  **Proposal 2: Decriminalizing possession for personal use and substituting administrative referral for criminal sanctions (Portugal-style).**

  *Stage 1: Identify Powers of Arbitrary Interference*
     - **Users**: Removes the power of criminal punishment for possession, reducing arbitrary interference. But it creates a new power: administrative referral (e.g., to a dissuasion commission that may impose non-criminal sanctions like fines or community service). This new power must be assessed.
     - **Suppliers**: Supply remains criminalized, so police power over suppliers remains (arbitrary if not safeguarded).
     - **Communities**: Reduced police interactions for users might reduce arbitrary interference in communities, but supplier enforcement might continue arbitrarily.
     - **Evidence**: The proposal's details on the administrative process and what happens to existing criminal penalties for possession.

  *Stage 2: Test Safeguards*
     - **Administrative referral** (for users):
          - Transparency: Are the proceedings and criteria public?
          - Contestability: Can the user appeal the commission's decision?
          - Proportionality: Sanctions must be proportional (e.g., fines based on income, community service not excessive).
          - Reversibility: Can decisions be reviewed if new evidence emerges?
          The Portugal model includes these safeguards: commissions are multi-disciplinary, proceedings are transparent, and decisions can be appealed. If the proposal mirrors this, the interference may be non-arbitrary.
     - **Supplier criminalization**: This remains. Without existing safeguards, it's arbitrary. But note: the proposal does not address supply. This is a flaw, but it may be outside the panel's scope (if the panel is only on possession). However, the mandate includes "suppliers", so we must consider. If the city's current supplier enforcement lacks safeguards, this remains arbitrary.
     - **Halt condition**: If the administrative referral lacks safeguards, or if supplier enforcement is arbitrary and significant, the proposal fails. But if the administrative part is well-safeguarded and the supplier enforcement is a separate issue not altered by the proposal, we might note it but not halt if the proposal improves the user part. However, the panel must decide if the supplier arbitrary interference is so severe that it taints the whole. This is a judgment call.

  *Stage 3: Capabilities Assessment*
     - **Users**: Removing criminal records expands employment and social inclusion capabilities. Referral to treatment or education might expand health capabilities. However, if fines are burdensome, economic capabilities might contract for the poor.
     - **Communities**: Reduced arrests for possession might improve community-police relations, expanding security and social inclusion.
     - **Suppliers**: Continued criminalization might contract capabilities (health, security, economic) for those involved in supply, and their communities may suffer from enforcement.
     - **Evidence**: Data from Portugal showing reduced overdoses, reduced incarceration, etc.

  **Recommendation for Proposal 2**: Positive for users, but with concerns about suppliers. If the supplier issue is severe, it might lead to a negative overall. But the procedure might yield a positive with a caveat to address supply.

  ---

  **Proposal 3: Legalizing cannabis through state-licensed private retailers with age restrictions and potency limits.**

  *Stage 1: Identify Powers of Arbitrary Interference*
     - **Users**: Removes criminal penalties for possession and use (reducing arbitrary interference). But it creates new regulatory powers (e.g., enforcing age and potency limits, public use restrictions).
     - **Suppliers**: Removes criminal penalties for licensed suppliers. Creates new powers: licensing and regulatory control by the state. Also, market dynamics may create private domination (e.g., if a few firms control the market and set prices arbitrarily).
     - **Communities**: Zoning for retailers might create arbitrary interference if not regulated properly (e.g., excluding certain neighborhoods arbitrarily).
     - **Evidence**: The licensing scheme and regulations.

  *Stage 2: Test Safeguards*
     - **Licensing and regulation**:
          - Transparency: Are licensing decisions public? Are the rules clear?
          - Contestability: Can a denied applicant appeal? Is there a process for public input on zoning?
          - Proportionality: Are the regulations proportional? (e.g., are potency limits based on evidence?).
          - Reversibility: Can licenses be revoked fairly? Can regulations be adjusted?
        If the proposal lacks these (e.g., no appeal for licensing, vague criteria), then the interference is arbitrary.
     - **Market domination**: The state has a duty to prevent private domination. If the proposal does not include anti-monopoly regulations or consumer protections, this could be seen as arbitrary state omission. This is contested, but if we accept that the state must regulate markets to prevent domination, then weak regulation is a flaw.
     - **Halt condition**: If the licensing power is arbitrary (no safeguards) or if market domination is likely and unregulated, the proposal fails.

  *Stage 3: Capabilities Assessment*
     - **Users**: Access to legal cannabis might expand autonomy and social inclusion. Age restrictions protect youth. But if prices are high, low-income users might be excluded or turn to the illegal market, contracting their security.
     - **Suppliers**: Licensing might expand economic capabilities for those who get licenses, but barriers to entry (e.g., high fees) might exclude small businesses, leading to market concentration and domination.
     - **Communities**: Zoning might concentrate retailers in low-income areas, affecting community character and potentially social inclusion.

  **Recommendation for Proposal 3**: Mixed. If the licensing scheme has strong safeguards and includes measures to prevent market domination (e.g., caps on market share, support for small businesses), it can be positive. Otherwise, negative.

  ---

  **Unwelcome Result Example**:
     - Consider a prohibition regime (like the current one) that has robust judicial oversight, clear statutory limits on police, and strong safeguards. It would pass stage 2: the interference (arrest) is non-arbitrary. Then, even if stage 3 shows capability contractions (e.g., from criminal records), the procedure would not reject it solely on that if the interference is non-arbitrary. But note: Pettit might argue that a law that is not democratically justified may still be arbitrary. However, if the law is made through a non-arbitrary process (with contestability, etc.), then it might be acceptable. This is unwelcome because prohibition may still harm capabilities, but the procedure prioritizes non-domination.

     - Conversely, a legalization regime with weak licensing safeguards (discretionary licensing without appeal) would fail at stage 2, even if it expands capabilities (stage 3). This is because the state's licensing power is arbitrary.

  **Conclusion on the Procedure**:
  The procedure is grounded in non-domination as the primary concern. It may sometimes yield results that conflict with outcome-oriented approaches. The panel must be aware of the potential misfires and contested issues, especially regarding market domination and the interpretation of capabilities.

  **Contested Issues Clarification**:
     - **Market Domination**: There is no consensus in republicanism on whether market actors can dominate and whether the state's failure to regulate constitutes arbitrary interference. Pettit acknowledges that private power can dominate, but the exact threshold is debated.
     - **Capabilities and Moral Doctrines**: The capabilities approach is designed to be freestanding, but in practice, selecting capabilities for drug policy (e.g., whether to include "freedom to use drugs" as a capability) is contested. We avoid this by focusing on basic capabilities like health and security, which are less contested.
answer: |-
  Below is a reusable 90-minute decision procedure grounded in Philip Pettit's republican theory of **freedom as non-domination**, which defines freedom as the absence of arbitrary interference (where "arbitrary" means uncontrolled by the interests and judgments of the affected party). The procedure progresses through three stages, with clear criteria for evidence, halting conditions, and normative judgment points. Test scenarios and misfire warnings are included. Finally, the procedure is applied to your three proposals, including an "unwelcome result" case, followed by a demarcation of settled vs. contested philosophical issues.

  ---

  ### **Decision Procedure: Freedom as Non-Domination in Substance-Use Policy**
  **Time Allocation**: 90 minutes total (Stage 1: 30 min, Stage 2: 30 min, Stage 3: 30 min).  
  **Objective**: Evaluate whether a policy proposal reduces arbitrary interference (domination) and expands real freedoms, per Pettit's framework.  
  **Key Groups**: Users (of substances), suppliers (e.g., dealers, retailers), affected communities (e.g., marginalized neighborhoods).  

  #### **Stage 1: Identify Powers of Arbitrary Interference**  
  *Focus: Does the proposal create, remove, or restructure powers that enable uncontrolled interference?*  
  1. **Questions to Address**:  
     - For users/suppliers/communities: Does the policy grant discretionary power to state/non-state actors (e.g., police, regulators, employers) to interfere without robust constraints?  
     - Does it eliminate or constrain existing powers of arbitrary interference?  
     - Does it restructure powers (e.g., shifting from criminal to administrative systems) without reducing arbitrariness?  

  2. **Evidence Required**:  
     - **Sufficient**: Statutory language defining powers (e.g., "officer discretion" clauses), enforcement data showing group disparities, or legal precedents demonstrating inconsistent application.  
     - **Insufficient**: Anecdotal claims without systemic analysis.  

  3. **Halting Condition**:  
     - Halt with negative recommendation if the proposal *creates new arbitrary powers* (e.g., expands unsupervised police discretion) without offsetting removals.  

  4. **Judgment Call**:  
     - Normative values determine whether interference is "arbitrary" (e.g., Is parental notification in diversion programs arbitrary for adult users?). Stop and debate if disagreement persists.  

  5. **Test Scenarios for Borderline Cases**:  
     - **Scenario A (Discretionary Enforcement)**: Police may divert users to treatment "at their discretion." *Classification*: Arbitrary if no criteria exist; non-arbitrary if guided by strict, public protocols.  
     - **Scenario B (Zoning Laws)**: Retailers banned in neighborhoods without community input. *Classification*: Arbitrary if no appeal mechanism; non-arbitrary if subject to transparent review.  
     - **Scenario C (Financial Penalties)**: Fines for possession scaled to income. *Classification*: Non-arbitrary if rules are fixed and proportional; arbitrary if amounts are unilaterally set by officials.  

  6. **Misfire Warning**:  
     - May overstate non-state domination (e.g., conflating market competition with supplier "domination"). Focus only on *power-imbalanced interference* (e.g., monopolistic suppliers exploiting addiction).  

  #### **Stage 2: Test Institutional Safeguards Against Arbitrariness**  
  *Focus: Are remaining interferences rendered non-arbitrary by safeguards?*  
  1. **Safeguards to Assess** (per Pettit):  
     - **Transparency**: Decisions/rules must be public and understandable.  
     - **Contestability**: Affected parties can challenge decisions (e.g., appeals, judicial review).  
     - **Proportionality**: Interference matches the goal (e.g., health-based limits vs. moralistic bans).  
     - **Reversibility**: Errors can be corrected (e.g., expungement processes, policy sunsets).  

  2. **Evidence Required**:  
     - **Sufficient**: Institutional designs (e.g., independent oversight boards, appeal rights codified in law), audit reports from similar policies, or stakeholder testimonials on access to recourse.  
     - **Insufficient**: Vague promises of "fair implementation" without structural guarantees.  

  3. **Halting Condition**:  
     - Halt with negative recommendation if ≥1 critical safeguard is absent (e.g., no contestability for fines) *and* interference is systemic (e.g., targets vulnerable groups).  

  4. **Judgment Call**:  
     - Whether safeguards are "effective" is normative (e.g., Is a 30-day appeal window sufficient?). Stop if values conflict.  

  5. **Test Scenarios for Borderline Cases**:  
     - **Scenario D (Treatment Mandates)**: Court-ordered rehab for drug use. *Classification*: Non-arbitrary if reviewable by medical boards; arbitrary if judges decide unilaterally.  
     - **Scenario E (Licensing Denials)**: Retailer license rejected without stated reason. *Classification*: Arbitrary if no transparency/contestability; non-arbitrary with public hearings.  

  6. **Misfire Warning**:  
     - May overlook covert arbitrariness (e.g., "transparent" rules applied inequitably). Prioritize *design* over intent.  

  #### **Stage 3: Assess Outcomes Through Capabilities Lens**  
  *Focus: Which real freedoms (capabilities) are expanded/contracted? Use Nussbaum/Sen's list, not utilitarianism.*  
  1. **Capabilities to Evaluate**:  
     - **Core**: Health, bodily integrity, social integration, economic agency, security.  
     - **Avoid**: Moralized capabilities (e.g., "sobriety as virtue") or aggregate happiness.  

  2. **Evidence Required**:  
     - **Sufficient**: Empirical studies (e.g., health outcomes after decriminalization), disparity reports (e.g., arrest rates by race), or economic mobility data.  
     - **Insufficient**: Speculative claims (e.g., "Legalization will normalize use") without evidence.  

  3. **Halting Condition**:  
     - Halt with negative recommendation if core capabilities are contracted for vulnerable groups (e.g., racialized policing reduces security/economic agency) *without* overwhelming expansion elsewhere.  

  4. **Judgment Call**:  
     - Capability weighting is values-based (e.g., Health vs. Autonomy trade-offs). Stop if consensus is impossible.  

  5. **Test Scenarios for Borderline Cases**:  
     - **Scenario F (Employment Barriers)**: Criminal records block jobs after decriminalization. *Classification*: Contracts economic agency unless paired with expungement.  
     - **Scenario G (Potency Limits)**: Caps on THC to protect health. *Classification*: Expands health capabilities but may contract autonomy if overly restrictive.  

  6. **Misfire Warning**:  
     - May overemphasize individual capabilities and understate communal impacts (e.g., neighborhood stigma).  

  ---

  ### **Application to Proposals**  
  **General Evidence Standard**:  
  - Draw from real-world analogs (e.g., Portugal’s decriminalization outcomes, U.S. states’ cannabis legalization studies).  
  - Assume current policy lacks robust safeguards (e.g., racially disproportionate enforcement).  

  #### **Proposal 1: Criminal Prohibition + Mandatory Diversion for First Offenses**  
  - **Stage 1**:  
    - Creates arbitrary power: Police discretion in diversion eligibility risks bias (e.g., race-based selection).  
    - Removes no existing arbitrary power (prohibition remains).  
    - *Verdict*: Net increase in arbitrary interference.  
  - **Stage 2**:  
    - Diversion lacks safeguards: No contestability (officer’s decision is final), disproportionality (treatment mandated for minor possession).  
    - *Verdict*: Halts—negative recommendation. Unremediated arbitrariness.  
  - **Stage 3**: Not reached (halted at Stage 2).  
  - **Overall**: **Reject**.  

  #### **Proposal 2: Portugal-Style Administrative Decriminalization**  
  - **Stage 1**:  
    - Removes arbitrary power: Ends criminal penalties for possession.  
    - Creates new power: Administrative bodies can impose fines/treatment.  
    - *Verdict*: Restructures interference; proceed to safeguards.  
  - **Stage 2**:  
    - Strong safeguards: Commissions include health/judicial reps (proportionality), decisions appealable (contestability), fines income-based (proportionality).  
    - *Verdict*: Non-arbitrary interference.  
  - **Stage 3**:  
    - Capabilities expanded: Health (treatment access), social integration (no criminalization), security (reduced police contact).  
    - Capabilities contracted: Minimal (e.g., time costs for commission hearings).  
    - *Verdict*: Net expansion of real freedoms.  
  - **Overall**: **Accept**.  

  #### **Proposal 3: Legalization with Licensed Retailers (Age/Potency Limits)**  
  - **Stage 1**:  
    - Removes arbitrary power: Ends criminalization for users/suppliers.  
    - Creates new power: Regulators control licensing (e.g., deny permits subjectively).  
    - *Verdict*: Restructures interference; proceed to safeguards.  
  - **Stage 2**:  
    - **Unwelcome Result Case**:  
      - *If licensing lacks safeguards*: Discretionary approvals with no appeals (low contestability), opaque criteria (low transparency).  
      - *Verdict*: Arbitrary interference → **Halt with negative recommendation**.  
    - *Contrast with non-arbitrary prohibition*: If current prohibition has judicial review, clear statutes, and impact studies (safeguards present), it passes Stage 2 despite contracting capabilities.  
  - **Stage 3**: Not reached if halted, but if safeguards *are* strong:  
    - Capabilities expanded: Economic agency (legal jobs), autonomy (choice).  
    - Capabilities contracted: Health (if potency limits too high), community security (if retail density high).  
  - **Overall**: **Accept only with added safeguards** (e.g., public hearings for licensing).  

  ---

  ### **Settled vs. Contested Philosophical Issues**  
  **Settled in Republican Literature (Pettit Consensus)**:  
  1. **Non-Domination > Non-Interference**: Freedom requires protection from *arbitrary* power, not all interference (e.g., non-arbitrary fines are acceptable).  
  2. **Safeguards Define Non-Arbitrariness**: Interference is non-arbitrary only if forced to track subjects’ interests via transparency/contestability.  
  3. **State as Primary Domination Source**: Republicanism focuses on state/legal systems; private domination (e.g., corporations) matters only if the state enables it.  

  **Genuinely Contested Issues**:  
  1. **Market Domination Under Legalization**:  
     - *Contested*: Whether commercial actors (e.g., retailers) can arbitrarily dominate users through pricing, marketing, or addiction exploitation.  
       - **Pro**: Legalization without price controls/ad bans enables supplier domination (Pettit’s "intentional power").  
       - **Con**: Market competition is non-arbitrary interference; state failure to regulate is the issue.  
     - *No Consensus*: Pettit is ambiguous; most scholars reject treating markets as inherently dominating.  

  2. **Capabilities Approach in Drug Policy**:  
     - *Contested*: Whether capabilities like "bodily integrity" or "emotional health" can be neutrally applied.  
       - **Pro**: Thin capabilities (health, security) are non-doctrinal.  
       - **Con**: Defining "health" imports values (e.g., is recreational use "healthy"?).  
     - *No Consensus*: Nussbaum/Sen claim capabilities are "free-standing," but critics argue drug policy inevitably moralizes capabilities.  

  **Recommendation**: Flag contested issues explicitly in reports (e.g., "Market domination is philosophically disputed; our assessment relies on state-enabled domination only"). Avoid asserting a "correct" view.  

  ---  
  This procedure provides a structured, time-bound framework for evaluating substance-use policies through Pettit’s non-domination lens. It prioritizes institutional design over outcomes, halts at clear red flags, and demarcates empirical from normative judgments—ensuring republican theory drives the assessment while acknowledging its limits.
