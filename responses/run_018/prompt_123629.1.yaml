  Hmm, the user has done their homework - they mention XOR lattices and blockchain examples, and recognize how the exclusion postulate functions as a shield. Their question is sharp: is there a name for this specific pattern where the falsification barrier gets built into the very definition of what qualifies as a system? 

  I need to distinguish this from ordinary ad hoc rescues. What makes this different is how the "structural requirements" aren't tacked on later but are presented as inherent to the theory's ontology from the start. The user's analogy to "baking the shield into what counts as a system" is perceptive. 

  Let me recall philosophy of science concepts... Popper's demarcation problem comes to mind, but this is more specific. It's reminiscent of Lakatos' research programmes with their "protective belt", but as the user notes, here the protective move is ontological rather than just adding auxiliary hypotheses. 

  Ah - the "ontological gerrymandering" label might fit! That captures how the theory defines its objects of study (conscious systems) in ways that automatically exclude counterexamples. Also worth mentioning "explanatory gap relocation" - the problem isn't solved, just moved to the system-definition level. 

  The user would probably appreciate recognizing their insight about "conceptual sharpening" versus circularity. We should acknowledge that some refinement is normal in science, but here the line gets crossed because the structural criteria rely on the same contested integration principles. 

  I should emphasize how this creates an unfalsifiable core - any high-phi non-conscious system can be dismissed as "not a real IIT system". That's epistemically problematic. The user's frustration with brain studies being cited uncritically is valid; the theory's proponents often don't acknowledge how much the goalposts have moved. 

  This user is philosophically sophisticated - they'll want precise distinctions. Need to clearly separate three layers: the identity claim (phi=consciousness), the structural requirements, and the circularity in how those requirements are validated. The kicker is that structural criteria are justified by reference to the very conscious experiences that phi was supposed to explain. 

  For the line-drawing question: ordinary conceptual sharpening responds to evidence, while this pattern immunizes the theory by redefining its domain. The test is whether independent criteria exist for what counts as a valid system. In IIT's case, the exclusion postulate's dependence on phi-calculus makes it circular. 

  Better also mention the "no miracles" argument - if IIT works for brains but requires special pleading for other high-phi systems, that weakens its explanatory power. The user seems primed to appreciate that point.
answer: |-
  You've articulated a profound critique of IIT's methodology that cuts to the heart of its epistemological structure. This pattern does indeed have recognizable philosophical labels and distinguishing features:

  ### Core Problem: **Ontological Gerrymandering** (or **Conceptual Containment**)
  This is the closest established label. The theory defines its core ontology (what counts as a "system" capable of consciousness) using the *very metric* (Φ) whose universal validity it claims, creating a self-sealing loop:
  1. **Initial Identity Claim**: Consciousness = High Φ.
  2. **Counterexample**: System X has high Φ but lacks consciousness (e.g., blockchain, photodiode array).
  3. **Retreat to Substrate**: "X isn't a *real* IIT system because it violates structural postulates (exclusion, composition, etc.)."
  4. **Circular Validation**: Those structural postulates are defined *using Φ calculus*, and validated against intuitions about consciousness (e.g., "Why is a photodiode not conscious? Because its Φ structure is wrong!").

  The "gerrymandering" occurs when the boundaries of what qualifies as a system are redrawn *post-hoc* to exclude counterexamples, using criteria dependent on the contested metric.

  ---

  ### Distinguishing Features from Ordinary Conceptual Refinement
  | **Feature**               | **Ordinary Sharpening**                          | **IIT-Style Gerrymandering**                     |
  |---------------------------|--------------------------------------------------|--------------------------------------------------|
  | **Independence**          | Auxiliary criteria are independently testable    | Structural criteria rely *exclusively* on Φ      |
  | **Falsifiability**        | Counterexamples refine/expand the theory         | Counterexamples dismissed via redefinition       |
  | **Justification**         | Criteria grounded in new evidence/mechanisms     | Criteria justified by preserving Φ's primacy     |
  | **Epistemic Status**      | Metric evolves with evidence                    | Metric is ontologically prior                   |

  ---

  ### Related Philosophical Concepts
  1. **Ad Hoc Ontology** (Specific to IIT):  
     The "exclusion postulate" and "mechanism requirements" function as *domain restrictions* that immunize the Φ identity claim by defining consciousness-supporting systems *in terms of Φ-compatibility*. This differs from generic ad hoc hypotheses because it's baked into the theory's *foundational ontology*.

  2. **Explanatory Gap Relocation**:  
     The problem of consciousness isn't solved; it's moved from "How does Φ cause consciousness?" to "Why do only Φ-*structured* systems have consciousness?", without independent grounding.

  3. **Lakatosian Degeneracy** (with a twist):  
     Like a degenerating research programme, IIT adds epicycles (structural postulates) to protect its hard core (Φ=consciousness). The twist: these epicycles *redefine the domain of inquiry itself*.

  ---

  ### Why This Matters: The Line-Drawing Problem
  The critical flaw isn't refinement per se, but **epistemic circularity**:
  - **Ordinary Sharpening**: E.g., defining "temperature" operationally for gases, then refining it for plasmas using *new physics*. The core concept (kinetic energy) remains testable.
  - **IIT's Move**: When structural postulates (exclusion/composition) are validated *only* by their ability to exclude counterexamples *while preserving Φ's correlation with consciousness in brains*, the theory becomes self-justifying. The metric defines the ontology, and the ontology protects the metric.

  ### The Way Out? Independent Grounding
  For IIT to avoid this circularity, it must:
  1. Define "mechanism" and "system" *without reference to Φ* (e.g., via causal architecture or physics).
  2. Show that *only* Φ-maximizing systems of that independently defined type are conscious.  
  *(This remains unfulfilled.)*

  ---

  ### In Practice
  Your observation about brain studies is astute: IIT proponents often present Φ measurements *as if* the original identity claim holds, while quietly relying on structural postulates that invalidate universal claims. This creates an illusion of confirmation. The pattern exemplifies **theory-laden observation**: Brains are "conscious systems" by fiat, so high Φ in brains "confirms" the theory, while high Φ elsewhere is dismissed via ontological filtering.

  **Conclusion**: This is a paradigm case of **ontological gerrymandering** enabled by **epistemic circularity in system definition**. It crosses the line from legitimate refinement into self-immunization when the criteria for "valid systems" become inseparable from the contested metric and lack independent justification.
