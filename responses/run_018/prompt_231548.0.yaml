prompt: |-
  I'm running a two-hour session for my local LessWrong meetup — about 15 people, mostly programmers and a couple grad students, some of whom have done the sequences but none with linguistics — and I want an activity, not a lecture. The idea I want them to feel in their guts is that the nasty part of a slur isn't part of what's being asserted: it survives negation, embedded questions, and conditionals the way a presupposition or expressive does, while the descriptive part behaves normally. So "Dave is not a [slur]" still slimes Dave even though the sentence denies it, and asking "Is Dave a [slur]?" has already done the thing. I want the room to notice this pattern themselves, using a made-up group and a made-up slur so nobody has to produce a real one. Can you design the activity — roles, rules, materials, timeline — plus a debrief that maps what they noticed onto the at-issue/not-at-issue distinction and says why it's awkward for ordinary truth-conditional semantics? Also tell me what will predictably go wrong the first time I run it and how to steer around it, and which part of the phenomenon the activity can't reproduce (my guess is in-group vs out-group use changing the force, but you might have a better candidate).
reasoning: |-
  We are designing an activity to illustrate the non-asserted, expressive nature of slurs that survives negation, questions, and conditionals. We will use a made-up group and a made-up slur to avoid real-world sensitivities.

  **Activity Design:**

  **Goal:** Participants discover that the offensive part of a slur (the expressive content) is not part of what is asserted (the at-issue content) and that it remains even when the sentence is negated, questioned, or embedded in conditionals.

  **Setup:**
  - We create a fictional group and a fictional slur. Let's say the group is "people who prefer to write with blue pens" and the slur is "bluink". We will explain that in our fictional world, there is a negative stereotype about blue-pen users (e.g., they are considered indecisive because they didn't choose black or another color). We must emphasize that this is fictional and that we are using it to study language.

  **Materials:**
  - Handout with example sentences (using the fictional slur and neutral counterpart) in different contexts: positive assertion, negation, question, conditional. Also include a neutral term for the group (e.g., "blue-pen user") for comparison.
  - Worksheet for participants to record their intuitions and judgments.

  **Example sentences (using the fictional slur "bluink" and neutral "blue-pen user"):**

  1. Assertion:
     a. Dave is a bluink.
     b. Dave is a blue-pen user.

  2. Negation:
     a. Dave is not a bluink.
     b. Dave is not a blue-pen user.

  3. Question:
     a. Is Dave a bluink?
     b. Is Dave a blue-pen user?

  4. Conditional:
     a. If Dave is a bluink, we should avoid him.
     b. If Dave is a blue-pen user, we should avoid him.

  **Roles:**
  - Participants work in small groups (3-4 people) to discuss the examples.

  **Rules:**
  - Participants should note for each example (a) and (b):
     - Does the sentence convey something negative about Dave? (Yes/No, and how strong)
     - Does the sentence also convey a descriptive claim? If so, what?
     - How would they feel if someone said that about their friend Dave?
  - They should also consider:
     - What happens when we negate the sentence? (Does the negative part go away?)
     - What happens when we ask a question? (Does asking the question already do something bad?)
     - What happens in the conditional? (Does the conditional still carry the negative connotation?)

  **Timeline (for a 2-hour session):**

  1. **Introduction (15 mins):**
     - Explain the goal: We are going to investigate how certain words work in language, using a made-up example to avoid real-world issues.
     - Introduce the fictional group and the fictional slur. Explain the fictional stereotype (briefly and without reinforcing real harmful stereotypes).
     - Emphasize that the activity is about language and not endorsing any negative views.

  2. **Small Group Activity (45 mins):**
     - Hand out the worksheets and instructions.
     - Groups discuss the examples and answer the questions.

  3. **Group Sharing (30 mins):**
     - Each group reports their observations for each type of sentence (assertion, negation, question, conditional). Write these on a board or shared document.

  4. **Debrief and Concept Explanation (20 mins):**
     - Summarize the pattern: The negative content persists even when the sentence is negated, questioned, or put in a conditional. This is unlike ordinary descriptive content.
     - Introduce the concepts:
       - **At-issue content (asserted content):** This is the main point of the utterance, which is directly affected by negation, questions, etc. For example, in "Dave is not a bluink", the at-issue content is that Dave is not a blue-pen user (which is denied). 
       - **Not-at-issue content (expressive/presuppositional content):** This content is not directly asserted and is carried by the word itself. It remains in all the contexts. For the slur, the negative attitude toward blue-pen users is not-at-issue.
     - Explain why this is awkward for ordinary truth-conditional semantics: Truth-conditional semantics typically focuses on the at-issue content and how it composes with operators (like negation). But the expressive content of the slur is not affected by these operators. This suggests we need a more complex semantic model (like multidimensional semantics) to capture both dimensions.

  5. **Q&A and Discussion (10 mins):** Open floor for questions and comments.

  **Predictable Problems and Solutions:**

  1. **Problem:** Participants might feel uncomfortable using even a fictional slur.
     - **Solution:** Emphasize that the word is fictional and that we are using it strictly for academic purposes. Also, consider having them use a placeholder (e.g., "B-word") in their discussions if they prefer.

  2. **Problem:** The fictional example might not elicit the same strong intuitions as a real slur.
     - **Solution:** Acknowledge this limitation. Encourage participants to imagine that in the fictional world, the word has the same taboo and emotional weight as a real slur. Also, note that the activity is designed to be safe but might not capture the full emotional impact.

  3. **Problem:** Participants might get stuck on the fictional scenario and not see the linguistic pattern.
     - **Solution:** Provide clear instructions and examples. During the group sharing, guide them to focus on the pattern of persistence (the negative connotation in all contexts).

  4. **Problem:** The activity might lead to a discussion that reinforces stereotypes even in fiction.
     - **Solution:** Clearly state that the stereotype is fictional and that the activity is about language. Redirect any discussion about the fictional group to the linguistic pattern.

  **What the Activity Cannot Reproduce:**

  1. **In-group vs. Out-group Use:** In reality, the use of a slur by an in-group member (within the targeted group) might be intended and interpreted differently (e.g., as reappropriation or camaraderie) compared to an out-group member (which is typically derogatory). The activity uses a fictional slur without a real social context, so it cannot capture this nuance.

  2. **Emotional Impact:** The fictional slur won't carry the same emotional weight or historical baggage as a real one, so participants might not have the same visceral reaction. This might make the persistence of the expressive content less striking.

  3. **Sociolinguistic Context:** Real slurs are embedded in complex social and historical contexts that influence their use. The activity abstracts away from this.

  **Steering around the in-group/out-group issue:**
  - In the debrief, you can mention that the activity simplifies by not considering who is speaking (in-group vs. out-group) and that in reality, the interpretation can vary by context and speaker identity. But note that even in in-group uses, the word might still carry the expressive content (though with a different function) and that the linguistic pattern of persistence might still hold.

  By following this activity, participants should be able to observe the pattern of expressive content persisting across different linguistic environments and understand how it challenges a simple truth-conditional model of meaning.
answer: |-
  Here’s a detailed activity design for your LessWrong meetup, focused on self-discovery of the "slime persistence" phenomenon using a fictional slur. The goal is to have participants notice how the offensive component survives negation, questions, and conditionals, while the descriptive claim behaves normally.

  ---

  ### **Activity: The "Glimk" Experiment**
  **Fictional Setup**  
  - **Group:** "Tersians" – people who exclusively use their non-dominant hand for writing (e.g., right-handers who write left-handed).  
  - **Slur:** "Glimk" – carries a derogatory stereotype (e.g., "Tersians are deceitful because they ‘hide’ their dominant hand").  
  - **Neutral term:** "Tersian" (descriptive, no baggage).  
    *Rationale: This is absurd enough to avoid real-world triggers but plausible for pattern-spotting.*

  **Materials**  
  - Worksheet with 4 scenarios (below).  
  - Whiteboard for group brainstorming.  
  - Timer.  

  **Roles**  
  - **Facilitator (You):** Introduce, timekeep, and steer discussion (minimal lecturing).  
  - **Small groups:** 3–4 people each (4 groups for 15 people).  

  ---

  ### **Timeline (Total: 110 mins)**  
  #### **1. Setup (10 mins)**  
  - Explain the fictional world tersely:  
    > *"In this universe, ‘Tersians’ write with their non-dominant hand. Some people use the neutral term ‘Tersian’, others use the slur ‘glimk’ – which implies they’re untrustworthy. We’ll explore how these words work linguistically."*  
  - **Emphasize:** *"Avoid real slurs; this is about patterns. If uncomfortable, say ‘G-word’."*  

  #### **2. Group Activity: Scenario Analysis (40 mins)**  
  Groups discuss **4 scenarios** (10 mins each) on worksheets. For each, answer:  
  > *"What does this sentence imply about Dave? Does it feel insulting? Does the descriptive claim (Dave being Tersian) change?"*  

  | Scenario Type | Example with "Glimk" (Slur) | Example with "Tersian" (Neutral) |  
  |---------------|------------------------------|----------------------------------|  
  | **1. Assertion** | "Dave is a glimk." | "Dave is a Tersian." |  
  | **2. Negation** | "Dave is not a glimk." | "Dave is not a Tersian." |  
  | **3. Question** | "Is Dave a glimk?" | "Is Dave a Tersian?" |  
  | **4. Conditional** | "If Dave is a glimk, watch your wallet." | "If Dave is a Tersian, watch your wallet." |  

  **Instructions:**  
  - Compare columns: How does "glimk" vs. "Tersian" differ in each scenario?  
  - Focus on: **Insult persistence** (does it slime Dave even when denied?) and **Descriptive flexibility** (does negation/questions alter the core claim?).  

  #### **3. Group Report-Back (30 mins)**  
  - Each group shares 1 key observation per scenario (rotate groups).  
  - **Facilitator prompts:**  
    - *"In the negation example – does ‘glimk’ still feel gross? Why?"*  
    - *"Does asking ‘Is Dave a glimk?’ feel different than ‘Is Dave Tersian?’ How?"*  
  - **Whiteboard two columns:**  
    - *At-Issue (Descriptive)*: Changes with logic (e.g., negation flips truth value).  
    - *Not-At-Issue (Expressive)*: Persists regardless of context.  

  #### **4. Debrief & Concept Mapping (20 mins)**  
  **Key Q&A to elicit insights:**  
  > *"When you saw ‘Dave is not a glimk’ – did it still insult Dave? Why?"*  
  → *They’ll notice the "slime" sticks even when denied.*  

  > *"In ‘Is Dave a glimk?’, did it feel like the damage was done just by asking?"*  
  → *Yes – the slur frames the question negatively.*  

  > *"How did the conditional (‘If Dave is a glimk…’) compare to the neutral version?"*  
  → *Slur carries the stereotype into the hypothetical.*  

  **Map to Linguistics:**  
  - **At-Issue Content**: The core truth-conditional claim (e.g., *Dave is/is not Tersian*). This is what’s asserted, denied, or questioned. Changes with logical operators.  
  - **Not-At-Issue Content**: The expressive "slime" of the slur (e.g., *Tersians are bad*). It’s **presupposed** (treated as backgrounded common knowledge) or **expressive** (an emotional outburst). It survives embedding:  
    - Negation: Still assumes the stereotype exists.  
    - Questions: Presupposes the stereotype might apply.  
    - Conditionals: Projects the stereotype into the hypothetical.  
  - **Why it breaks truth-conditional semantics**:  
    - Standard semantics only handles at-issue content (e.g., negation flips truth values). Slurs add a **dimension of meaning** that ignores logical operators – like how "oops" in *"Oops, I didn’t break the vase"* still implies guilt.  

  #### **5. Open Discussion (10 mins)**  
  - *"How might this apply to real language? Why does this make slurs hard to ‘retract’?"*  
  - *"What does this suggest about ‘neutral’ reclamation (e.g., in-group use)?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Groups miss the pattern** if they hyper-focus on fictional details.  
     - **Steer:** Pre-frame with *"Ignore if Tersians are real; focus on linguistic behavior."* Prompt groups: *"Does the yuck factor vanish in negation?"*  

  2. **Problem: Discomfort with fictional slur** (e.g., over-hedging, refusal to engage).  
     - **Steer:** Normalize with *"Use ‘G-word’ if needed. We’re studying mechanics, not endorsing."* Share examples first to model clinical analysis.  

  3. **Problem: Overgeneralizing** (e.g., *"All bad words work this way!"*).  
     - **Steer:** Contrast with non-slur insults (e.g., *"Dave is a jerk"* vs. *"Dave is not a jerk"* – negation cancels insult). Highlight slurs’ unique persistence.  

  4. **Problem: Groups equate "slime" with literal meaning**.  
     - **Steer:** Ask *"If ‘glimk’ meant ‘left-handed’, would negation remove the insult? Why not here?"*  

  ---

  ### **What the Activity Can’t Capture**  
  Your guess is correct: **In-group vs. out-group dynamics** are the biggest gap.  
  - **Why it’s missing**: The fictional slur lacks social history. IRL, slurs can:  
    - **Lose force in in-group use** (e.g., reclamation by the targeted group).  
    - **Gain force when used by outsiders** (power dynamics matter).  
  - **Why it’s hard to simulate**:  
    - Participants know "glimk" is fake, so they won’t feel visceral in-group/out-group tension.  
    - Reclamation relies on historical oppression – impossible to fabricate ethically.  
  - **Mitigation**: Briefly note in debrief:  
    > *"IRL, slurs vary by speaker/context. An in-group member might say ‘glimk’ to disarm it – but the expressive content we observed could still linger. This activity isolates the linguistic pattern, not social nuance."*  

  ---

  ### **Why This Works**  
  - **Self-guided discovery**: Groups notice the "slime persistence" themselves via scenario comparisons.  
  - **Safe abstraction**: Fictional context avoids real harm while preserving the linguistic structure.  
  - **Debrief bridges to theory**: Concepts emerge from observations, not jargon.  

  This design primes your group to feel the "slime" as a bug in truth-conditional semantics – setting up deeper discussions (e.g., why reclaiming slurs is hard, how language encodes power). Run it as a puzzle, not a lecture, and they’ll gut-feel the distinction.
