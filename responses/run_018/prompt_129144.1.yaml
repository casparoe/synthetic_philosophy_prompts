answer: |-
  The pairing of unilateral dismissal power and governance dependence in parliamentary systems reflects a coherent theory of democratic legitimacy centered on **legislative sovereignty as the exclusive conduit of popular will**, where the executive is a revocable **agent of the legislature** rather than an independent mandate-holder. Here's the deconstructed logic:

  ### Implicit Theory of Democratic Legitimacy
  1. **Unitary Popular Mandate**:  
     Sovereignty resides solely in the legislature as the directly elected body. The executive derives authority *entirely* from the legislature's confidence, not from a separate electoral mandate. This treats the executive as a **continuously revocable delegate** of the legislative majority.  
     - **Presidential contrast**: Fixed terms imply dual legitimacy—executive and legislature both claim independent popular mandates, creating competing accountability chains.

  2. **Political Responsibility vs. Legal Culpability**:  
     Parliamentary systems prioritize **ongoing political accountability** over legal or procedural fault. A no-confidence vote is a political judgment on the executive's *capacity to govern effectively* or maintain majority support, not a criminal finding. Impeachment in presidential systems requires legal wrongdoing, reflecting a constitutional, not purely political, theory of removal.

  ### Resolving the Tension: Why Dependence Despite Destructive Power?
  The legislature's dependence on the government is not contradictory but **structurally intentional**:  
  - **Fusion of Powers**: The executive is not a separate branch but a **committee of the legislature**. Destroying the government destabilizes the legislature's own ability to function, incentivizing prudence.  
  - **Positive Governance Requirement**: The government exists to *organize* the legislature's will. Without an executive, the legislature cannot execute laws or set agendas efficiently. The no-confidence weapon ensures the government remains a loyal agent.  
  - **Stability Through Incentives**: While legislatures *can* dismiss governments capriciously, the need to pass budgets/laws creates a **mutual hostage situation**. Governments avoid alienating majorities; legislatures avoid causing governance crises. This *is* compatible with legislative sovereignty but relies on **practical constraints** (e.g., risk of elections, public backlash) to prevent abuse.  

  ### Constructive Vote of No Confidence: A Hybrid Philosophy
  The constructive vote (e.g., Germany, Spain) requires the legislature to elect a new chancellor *simultaneously* with dismissing the incumbent. This modifies parliamentary logic by presupposing:  
  1. **Continuity of Authority**: Governing power must never be vacant. Sovereignty resides in a **perpetually viable executive**, not just in the legislature's negative power.  
  2. **Collective Agency of the Majority**: The legislature must prove it can *positively govern*, not just veto. It treats the ruling majority as a **collective entity** with responsibility to sustain governance.  
  3. **Unbroken Mandate**: Implicitly rejects purely adversarial politics. The "chain of legitimacy" between people and executive remains intact only if a successor is ready—**governing authority is transferred, not suspended**.  

  **Consistency with Core Theory?**  
  - **Alignment**: It reinforces legislative sovereignty (only the legislature can elect the new executive).  
  - **Divergence**: It subtly imports a **stability-first ethic**, prioritizing governability over pure majoritarian flexibility. Ordinary no-confidence votes emphasize legislative supremacy; constructive votes emphasize **governance continuity as a democratic good**. Philosophically, it introduces a quasi-constitutional constraint on legislative power, hinting at a "governance imperative" beyond raw majority rule.  

  ### Conclusion
  Parliamentary systems cohere around a **monist theory of legitimacy**: the legislature *is* the sole repository of popular sovereignty, and the executive is its accountable agent. The "tension" between destructive power and dependence is resolved by institutional design fusing legislative and executive functions. The constructive vote refines this by demanding proof of *governing capacity* during transitions, balancing sovereignty with stability. Both models reject independent executive mandates but diverge on whether legislatures should retain unchecked dismissal power—exposing an unresolved tension between **majoritarian absolutism** and **governance continuity** as democratic values.
