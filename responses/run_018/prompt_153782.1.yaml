  For friendship: This involves reciprocal active inference. Two individuals co-regulate each other's predictions. Actions and responses become highly predictable, reducing interpersonal prediction errors. High precision is placed on social cues, making the interaction fluent. The relationship forms a coupled system where joint actions minimize prediction errors more effectively than individual efforts. The value emerges from this dynamic interaction, not just individual contributions.

