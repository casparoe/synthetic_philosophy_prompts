prompt: |-
  You are a professional philosopher with expertise in metaethics and the metaphysics of normativity. Before you answer, take a moment to brainstorm the relevant conceptual distinctions—particularly around internal and external reasons, realist versus anti-realist accounts, and argumentative dialectic—then work through the problem step-by-step with careful reasoning.

  I have observed a recurring argumentative move that I do not have a precise name for, and I want to know whether it corresponds to an established concept in the literature or whether it requires a new label. I will describe it through two concrete cases.

  In debates about environmental preservation, a speaker will assert that destroying an uninhabited ecosystem is wrong because there exist reasons to value biodiversity that do not depend on any human interest, treating these reasons as genuinely free-floating. But when pressed on how a reason can exist without a reasoner—without a mind that can be moved by it—the speaker typically retreats to saying that human beings have instrumental or prudential reasons to preserve the ecosystem, thereby making the normative force depend entirely on our practical concerns.

  In aesthetic disputes, someone will claim that there is reason to admire a masterpiece even in a counterfactual world containing no observers at all, implying that the reason stands independently of any audience. Yet when challenged on how such a reason could be weighed, defeated, or acted upon in the absence of agents, the speaker falls back on describing what actual critics or viewers ought to feel, as though the free-floating framing had never been introduced.

  The pattern is not straightforward equivocation, because the speaker does not appear to be using two fixed dictionary meanings of "reason" within a single inference. Rather, it seems to be a dialectical oscillation: an objectivist framing is adopted to secure a strong normative conclusion, then a subjectivist or reasoner-relative framing is adopted to deflect metaphysical objections, with the speaker treating the two as continuous rather than conflicting. Is there an established term for this specific maneuver—perhaps in discussions of free-floating rationales, moral realism, or the internalism/externalism debate? If not, please coin a precise term, define it, and specify its boundary conditions: distinguish it from ordinary pragmatic ambiguity, from context-sensitive uses of normative language, and from standard motte-and-bailey strategies. I also want to know where its edges lie—does the pattern occur only with practical reasons, or can it arise with epistemic reasons as well?

  Please be explicit about the limits of your analysis. State exactly what argument or empirical consideration would change your verdict about whether this is a genuinely distinct phenomenon, and identify the weakest step in your reasoning—the point at which your analysis is most likely to fail, for instance if the oscillation turns out to be reducible to a well-known fallacy or to harmless conversational repair.
reasoning: |-
  Okay, let me approach this query methodically. The user describes a specific argumentative pattern in normative discourse involving oscillating between objectivist and subjectivist framings of reasons. They're clearly well-versed in metaethics given their precise terminology about internal/external reasons and motte-and-bailey strategies.

  First, I need to map the conceptual terrain. The core tension lies between:
  - External reasons (reasons existing independently of agents' psychologies)
  - Internal reasons (reasons tied to agents' motivational sets)

  The observed pattern shows speakers starting with robust externalist claims ("reasons exist without reasoners") but retreating to internalist positions when pressed ("humans have prudential reasons"). This isn't simple equivocation - the speaker maintains they're discussing the same normative phenomenon throughout.

  Key distinctions to consider:
  1) Against pragmatic ambiguity: Here the shift isn't about word meaning but metaphysical commitment
  2) Against context-sensitivity: The oscillation happens within a single dialectical context
  3) Against motte-and-bailey: The retreat isn't to a more defensible version of the same claim but to a different kind of claim

  I recall similar dynamics in debates about:
  - Williams' internalism vs. externalism
  - Mackie's queerness objection
  - Korsgaard's constructivism

  The closest existing concept might be "normative objectification" (treating projected attitudes as mind-independent), but this case involves more deliberate dialectical shifting. Perhaps we need a new term: "Dialectical Ontic Collapse" - collapsing the distinction between mind-independent and mind-dependent reasons during argumentation.

  Boundary considerations:
  - Could this happen with epistemic reasons? Potentially yes (e.g., "truths exist independently" retreating to "ideal observers would believe")
  - Weakest point: Whether this is truly distinct from sophisticated versions of contextualism about reasons-talk

  Empirical counterevidence would be finding that speakers consistently maintain the objectivist stance when confronted, or that the retreat consistently invokes non-human reasoners (gods, aliens) rather than human concerns.
answer: |-
  Based on your description and analysis, this pattern represents a distinct dialectical maneuver that warrants a new term. After mapping the conceptual landscape and evaluating boundary conditions, I propose calling it **"Normative Ontic Shifting"** (NOS). Below is a systematic defense of this concept, its boundaries, and limitations.

  ### Core Conceptual Analysis
  1. **Internal/External Reasons Distinction** (Bernard Williams):  
     - *External reasons*: Purportedly exist independently of an agent's subjective motivational set (e.g., "Biodiversity has value regardless of human interests").  
     - *Internal reasons*: Depend on an agent's contingent desires/goals (e.g., "Humans *prudentially* benefit from biodiversity").  
     NOS exploits the ambiguity between these frameworks without acknowledging their incompatibility.

  2. **Realism vs. Anti-Realism**:  
     - Realists (e.g., Parfit, Enoch) assert mind-independent normative truths.  
     - Anti-realists (e.g., Blackburn, Gibbard) ground normativity in attitudes or conventions.  
     NOS mimics realist rhetoric ("free-floating reasons") but defaults to anti-realist defenses ("our concerns matter") under pressure.

  3. **Dialectical Structure**:  
     - **Phase 1 (Objectivist Bailey)**: Asserting robust, agent-independent reasons to establish moral/intellectual authority.  
     - **Phase 2 (Subjectivist Motte)**: Retreating to agent-relative reasons to evade metaphysical challenges.  
     Crucially, the speaker treats these as *continuous*, denying any shift occurred—unlike classic motte-and-bailey, where defenses are explicitly fallback positions.

  ### Why "Normative Ontic Shifting"?
  - **"Ontic"**: Highlights the illicit slide between *modes of existence* (mind-independent vs. mind-dependent).  
  - **"Shifting"**: Emphasizes the dynamic, context-driven oscillation without acknowledgment.  
  - **Defining Features**:  
    - (i) Initial appeal to *categorically external* reasons.  
    - (ii) Defensive retreat to *contingently internal* reasons.  
    - (iii) Implicit denial of incompatibility (treating Phase 1 and Phase 2 as mutually reinforcing).  

  ### Boundary Conditions
  | **Distinction**               | **How NOS Differs**                                                                 |
  |-------------------------------|-------------------------------------------------------------------------------------|
  | **Pragmatic Ambiguity**       | Not ambiguity about *word meaning*; speaker insists on univocal "reasons" while shifting ontological commitments. |
  | **Context-Sensitivity**       | Not harmless variation (e.g., "reason" in logic vs. ethics); shift occurs *within a single argumentative context*. |
  | **Motte-and-Bailey**          | M&B distinguishes strong/weak claims; NOS masks a *metaphysical discontinuity* between claims. |
  | **Projectivism**              | Projectivism (Blackburn) explains normativity as attitude-projection; NOS is a *rhetorical tactic* leveraging this projection. |

  ### Scope: Beyond Practical Reasons
  NOS applies to **epistemic reasons** with identical structure:  
  - **Phase 1**: "There is reason to believe theory T in a world with no epistemic agents—truths stand independent!"  
  - **Phase 2**: "Rational agents *ought* to accept T based on idealized standards of inquiry."  
  Example: Mathematical Platonism debates (e.g., "Numbers exist mind-independently" → "Any rational being would grasp them").

  ### Limits and Weakest Points
  - **Empirical Counterevidence**: If speakers consistently maintained Phase 1 by invoking *non-human reasoners* (e.g., gods, aliens) or *dispositional properties* (e.g., "reasons would move *any* possible agent"), NOS would collapse into standard realism. Your cases show retreat to *actual human concerns*.  
  - **Theoretical Counterevidence**: If analysis revealed Phase 1 is merely *elliptical* for Phase 2 (e.g., "free-floating" = "what all agents *would* value under idealized conditions"), NOS might reduce to contextualism (Wong) or constructivism (Street). Your speakers deny this equivalence.  
  - **Weakest Step**: The claim that Phase 1 and Phase 2 are *metaphysically discontinuous*. A **robust constructivist** (e.g., Korsgaard) might argue that "external reasons" are shorthand for "internal reasons of fully rational agents," rendering NOS benign. However, your speakers resist this explanation when pressed, insisting on literal mind-independence.  

  ### Verdict
  NOS is a distinct phenomenon reflecting a **dialectical failure to own one's metaethical commitments**. It arises when agents seek the rhetorical force of realism without its metaphysical burdens. While reminiscent of "equivocation" or "inferential promissory notes" (Sinclair), its unique blend of ontological evasion and dialectical continuity justifies a new label.  

  **Recommendation**: Investigate whether this aligns with Crispin Wright's "warrant-assertibility maneuvers" or Terence Cuneo's "normative parachutes," but NOS specifically targets the *existence conditions of reasons*.  
  **If this analysis is wrong**, it likely overstates the speaker's metaphysical awareness—they may genuinely conflate objectivist and subjectivist frames, making NOS an *unintentional* error rather than a tactical shift.
