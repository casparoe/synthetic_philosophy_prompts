  Ah, the paramedic case (Jordan) is perfect. Shows how "virtue" might be ecology-dependent: professional heroism coexisting with domestic failings. This lets me explore whether virtue is fragmented (Leo) or whether we misjudge by expecting context-independent consistency (Maya).

  Key execution notes:
