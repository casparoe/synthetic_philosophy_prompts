  Biggest challenge: Making Maya's ecological virtue position feel substantive without namedropping philosophers. I'll have her pivot from "virtues live in people" to "virtues live through systems" by dissecting the paramedic's environment - how ER protocols, team dynamics, and trauma shape his "emergent bravery." Meanwhile Leo's skepticism should pressure that idea: "Isn't that just situationism with extra steps?"

