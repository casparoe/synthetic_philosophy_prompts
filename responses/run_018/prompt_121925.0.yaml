answer: |-
  Here is a reading of *Citizen Kane* tailored to your historiographical framework, focusing on the tension between testimonial and narrative underdetermination and the film's formal complexities:

  **Citizen Kane: A Historiographical Labyrinth**

  Welles’s film meticulously stages **testimonial underdetermination**. Each witness – Bernstein (loyal employee), Leland (disillusioned friend), Susan (resentful wife), Raymond (detached servant) – offers fragments constrained by time, bias, and access. Bernstein idolizes the young, energetic Kane but misses the later corruption. Leland fixates on Kane’s moral decay but dismisses his earlier idealism. Susan sees only the monstrous collector and failed impresario. Raymond glimpses private despair but lacks context. The reporter Thompson fails because he seeks a singular "key" ("Rosebud") from inherently partial sources; the *evidence itself is incomplete*. This powerfully illustrates Carr’s point: history is a constructed account based on selected, interested testimony. No witness saw the whole Kane; no testimony recovers "wie es eigentlich gewesen."

  However, the film *also* gestures towards **narrative underdetermination**. While each testimony is fragmentary, the film’s *montage* and *juxtaposition* suggest the same core events could support different narrative shapes. Consider Susan’s narration of Kane building Xanadu "for me," portraying it as a monstrous act of possessive control and isolation. This is immediately followed by Raymond’s testimony revealing Kane’s furious destruction of her room *after* she left. The "facts" (building Xanadu, destroying Susan's room) remain, but the *meaning* and *causal chain* shift dramatically: Susan’s narrative implies building Xanadu *caused* isolation/despair; Raymond’s scene suggests the destruction was a *consequence* of abandonment and pre-existing despair. The evidence doesn't *dictate* whether Xanadu was the cause of Kane's downfall or a symptom/result of it. Similarly, the opening Newsreel imposes a simplistic "great man/fallen titan" arc (supporting White's idea of employment) that the personal testimonies actively dismantle, replacing it with ambiguous, psychologically-driven fragments resisting a single coherent plot.

  The film’s **omniscient camera** (e.g., gliding through the "No Trespassing" sign, revealing young Kane in the snow, the final shot of Rosebud burning) creates a profound tension. Formally, it makes a Rankean claim: *We*, the audience, see things "as they really were" – the sled, the snow globe moment. We possess the ultimate "fact" Thompson seeks. Yet, this undercuts rather than resolves the skepticism. Knowing "Rosebud" doesn’t explain Kane. It’s a private symbol whose meaning remains ambiguous (lost innocence? maternal love? pure agency?) and ultimately irrelevant to his public significance. The Rankean "truth" revealed by the camera is profoundly *insufficient* and *non-explanatory*. This deepens the film's skepticism: even with privileged, "objective" access to a key piece of evidence, the *meaning* of the past, its narrative shape and psychological truth, remains elusive and underdetermined. It demonstrates that "facts" alone, even seemingly crucial ones, don't automatically cohere into a singular, objective narrative.

  **Key Scenes/Devices for Assignment:**

  | Scene/Device             | Historiographical Claim Dramatized                     | Best Supports | Complication/Resistance                              |
  | :----------------------- | :----------------------------------------------------- | :------------ | :--------------------------------------------------- |
  | **The Newsreel ("News on the March")** | History as simplistic, publicly constructed narrative; limitations of official sources. | White         | Its overt artificiality/completeness is immediately undermined by the darkening room and Thompson's quest. |
  | **Thatcher's Memoir (Library Sequence)** | History as curated, self-serving testimony; archival gaps (locked/restricted sections). | Carr          | The cold, imposing setting visually reinforces the authority (and distance) of the archival source itself. |
  | **Susan's Narration vs. Raymond's Testimony (Xanadu)** | Same events (building/destruction) can fuel incompatible narratives of motive/causality. | White         | The juxtaposition is editorialized *by the film*; Raymond's scene visually emphasizes Susan's absence, subtly favoring his perspective on the destruction's cause. |
  | **Final Rosebud Revelation (Burning Sled)** | The insufficiency of a singular "key fact"; the gap between private meaning and public history; ultimate failure of the Rankean quest. | White/Carr   | The omniscient camera *provides* the fact, proving its existence, yet its meaning remains ambiguous and narratively unproductive. |

