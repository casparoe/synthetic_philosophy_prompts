prompt: |-
  I teach an undergraduate historiography seminar, and I want to use Welles's Citizen Kane as a case rather than as decoration. Its structure — an opening faux-newsreel obituary that knows nothing, a reporter sent to reconstruct a dead press baron out of testimony from his guardian, his business manager, his estranged friend, his second wife and his butler, the collapse of the search for the word on the sled, and the closing insistence that no single word sums up a life — reads like a staged argument about whether the past can be recovered as it really was, in Ranke's sense, or whether it is only ever what Carr says it is, a selection made by an interested inquirer, or only ever what White says it is, a sequence given a story-shape that the evidence does not dictate.

  Give me a reading that runs in both directions, and test a distinction I have been using in the seminar: call a gap testimonial underdetermination when the inquirer's evidence is simply incomplete, and narrative underdetermination when one and the same complete body of evidence could be truthfully organized into two incompatible story-shapes. My suspicion is that Kane only dramatizes the first kind — each witness is partial, self-interested or confined to one stretch of forty years — and that Carr's and White's scepticism needs the second. Say whether the film actually bears that out, which scenes push toward narrative underdetermination, and where the reading is forced.

  Do not let the film off the hook either: its own camera is omniscient in a way no character can be — it moves through walls into scenes no witness attended and hands the audience the one fact the reporter never gets — so the film's form makes a Rankean claim that its plot denies. Tell me what that does to the sceptical reading: does it undercut it or deepen it, and how would you handle it with students?

  Write the reading in prose, under roughly seven hundred words, naming three or four scenes or formal devices I could assign on their own. Then give a table with the columns: scene or device; the historiographical claim it dramatizes; which of the three positions it best supports (Ranke, Carr or White); where the film resists or complicates that reading. Finish with a JSON object with the fields: verdict (one sentence on which position, if any, the film as a whole vindicates); scene_that_decides_it; biggest_resistance (the strongest point against your own reading); what_the_film_adds (what the film shows about knowing the past that Carr's and White's arguments alone do not); teaching_caveat (the one thing I would have to warn students about if I built a session around it).
