  The user's main struggle is with applying CEV to groups. When moving from individuals to collectives, several issues arise. The metaphysical divergence problem stands out - different agents have fundamentally different views on personal identity over time. This isn't just conflicting preferences, but conflicting criteria for who counts as a valid agent after idealization. 

  I need to carefully separate settled aspects from contested ones. Settled: CEV requires idealization and coherence. Contested: whether divergence is fatal, if shared protocols can resolve it, or if collective CEV reduces to constitutional choice. The user explicitly wants these presented as open questions without favoring any position.

  The mechanics explanation should highlight how individual extrapolation differs from collective: in groups, the extrapolation process itself becomes part of the conflict. One agent's "more informed self" might be unrecognizable to another agent's idealization criteria. This goes beyond preference aggregation into metaphysics of identity.

  I should avoid academic citations as requested, focusing instead on conceptual clarity. The typo note shows they're detail-oriented but want substance over form. Their frustration suggests they need this broken down into discrete, manageable components with clear demarcations between established theory and open problems.

