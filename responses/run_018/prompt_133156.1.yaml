answer: |-
  Here’s a detailed classroom activity designed to simulate cultural transmission and expose flaws in meme theory, **The Cognitive Attractor Ritual Game**. It takes 80-90 minutes, requires minimal materials, and targets your learning objectives.  

  ---

  ### **Game Overview**  
  Students simulate cultural transmission of a "ritual" (e.g., a gesture sequence + sound) through a chain. Roles:  
  - **Ancestors** (3 students): Start with a "seed ritual."  
  - **Vectors** (4 students): Observe an ancestor *once*, then transmit from memory after a delay.  
  - **Hosts** (7 students): Reconstruct the ritual from a vector’s *partial* performance.  

  **Key Mechanisms**:  
  - **No genotype/phenotype split**: Only *performances* (phenotypes) are observed, no "blueprint" is shared.  
  - **Reconstructive transmission**: Hosts rebuild rituals from fragments + cognitive biases.  
  - **Attractor-driven "mutation"**: Changes arise from systematic biases (e.g., symmetry, familiarity), not random error.  
  - **Selection on outputs**: Success depends on recall ease/social appeal (hidden fitness pressures), not replicator fidelity.  

  ---

  ### **Materials**  
  - Index cards (1 per ancestor, 5 for the board).  
  - Pens.  
  - Timer.  
  - A poster labeling roles: **Ancestor → Vector → Host → New Ancestor**.  

  ---

  ### **Rules & Setup** (15 min)  
  1. **Prep**:  
     - Draw 3 distinct "seed rituals" on index cards (e.g., `Draw: ⧖, Gesture: tap foot twice, Sound: "ZEE-ko"`).  
     - Assign roles: 3 Ancestors, 4 Vectors, 7 Hosts.  
     - Ancestors receive a seed card. **No one else sees it**.  

  2. **Transmission Rules**:  
     - **Ancestors**: Perform their ritual **once** for one Vector. *No verbal explanations*.  
     - **Vectors**: Observe *one* Ancestor. Wait 2 mins (simulating memory decay), then perform for a Host.  
     - **Hosts**: Watch *one* Vector, then **reconstruct the ritual alone** on a new card. Add their name.  
     - **New Ancestors**: Hosts become Ancestors for the next round. Vectors rotate to new roles.  

  3. **Payoff Scheme** (Hidden Fitness):  
     - **Vectors**: Score 1 pt if their Host’s ritual includes >50% of their *performance*.  
     - **Hosts**: Score 1 pt if their ritual is labeled "memorable" (see below).  
     - **Catch**: Fitness is **manipulated secretly**:  
       - **Ease of recall**: Rituals with symmetry/familiar sounds earn "memorable" tags.  
       - **Impressiveness**: Rituals with dramatic gestures earn "memorable" tags.  
       *(Instructor privately tags cards during reconstr.)*  

  ---

  ### **Game Flow** (45 min)  
  **Round 1** (Transmission: Ancestor → Vector → Host)  
  1. Ancestors perform for Vectors (5 min).  
  2. Vectors wait 2 min, then perform for Hosts (5 min).  
  3. Hosts reconstruct rituals alone (5 min).  

  **Round 2** (Transmission: Host → Vector → New Host)  
  1. Hosts become New Ancestors. Vectors observe new Ancestors (repeat steps above).  

  **Final Output**: Collect all cards. Post them chronologically on a board:  
  ```  
  Seed Ancestor → Vector → Host (New Ancestor) → Vector → Host  
  ```  

  ---

  ### **Debrief** (25 min)  
  Map game outcomes to your concepts:  

  | **Game Moment**               | **Concept**                                  | **Discussion Prompts** |  
  |-------------------------------|---------------------------------------------|------------------------|  
  | Hosts add symmetry/simplify rituals | **Cognitive Attractors**             | "Why did Hosts 'correct' messy gestures? Notice how 'mutation' isn’t random—it’s systematic bias toward familiar patterns." |  
  | Vectors lose points despite "accurate" recall | **Selection on Outputs**   | "Vectors tried to copy faithfully, but success depended on the Host’s *reconstruction*. Fitness acted on the *output*, not the replicator." |  
  | Rituals fragment (e.g., sound lost, gesture simplified) | **Replication Failure** | "Did we see discrete 'memes'? Or did the ritual decompose into pieces that Hosts rebuilt *differently*?" |  
  | Seed vs. Final Host rituals diverge predictably | **No Discrete Memes**         | "The final ritual *looks* evolved, but was there a stable 'meme'? Or did each Host reinterpret the *phenotype*?" |  

  **Conclusion**: Cultural change resembles evolution *without* replicators. "Mutations" are biased reconstructions; "selection" acts on outputs, not copied units.  

  ---

  ### **Predictible Problems & Fixes**  
  - **Problem**: Students smuggle verbal instructions ("Wait, did they say *left* foot?").  
    **Fix**: Restate rules: "No words. Only **observe performances**." Enforce silence during transmissions.  

  - **Problem**: Vectors "cheat" by taking notes during the delay.  
    **Fix**: Confiscate pens during waiting periods. Say: "Memory decay is part of the simulation!"  

  - **Problem**: Hosts invent rituals if unsure (bypassing reconstruction).  
    **Fix**: Emphasize: "Base your ritual **only** on what you saw—even if it’s fragmentary."  

  ---

  ### **Limitations & Supplemental Talking Points**  
  The activity **can’t fully simulate**:  
  - **Intentionality/Representation**: Unlike genes, humans *interpret* cultural practices (e.g., a gesture "means" respect). Hosts in the game don’t ascribe meaning, so you must clarify:  
    *"In real life, a ritual’s *meaning* shapes reconstruction (e.g., a ‘sacred’ gesture is preserved). Meme theory ignores this, reducing culture to mindless copying."*  

  - **Social Bias**: Real transmission involves prestige/conformity biases. Briefly note: *"Attractors aren’t just cognitive—social pressures (e.g., copying elites) also distort rituals."*  

  ---

  ### **Why This Works**  
  - Students **experience** reconstruction (Hosts), biased "mutation" (attractors), and output-level selection (fitness scheme).  
  - The game **visually demonstrates** the meme ontology collapse: Rituals fragment into irreconcilable variants.  
  - No readings/web needed—everything emerges from gameplay.  

  Run this tight, fast-paced simulation, and students will leave skeptical of "memes" but energized to discuss alternatives!
