answer: |-
  Your grasp of the hypocrisy/standing literature is precise: standing is attenuated proportionally based on the **similarity** and **gravity** of the blamer's own culpable conduct relative to the wrong they condemn. Calibrating this "similarity coefficient" is inherently complex and contextual, but we can identify key factors and principles:

  1.  **Gravity is Paramount, Not Just Category:** While sharing a broad domain (e.g., "financial deception," "unreliability") establishes *some* symmetry, the *disparity in moral gravity* is usually the dominant attenuating factor.
      *   **Tax Exaggeration vs. Embezzlement:** These share the domain of "dishonest financial gain," but embezzlement typically involves far greater harm (direct theft vs. tax avoidance), breach of specific fiduciary trust, and often greater premeditation. This significant gravity disparity would drive the attenuation coefficient **very close to zero** for blaming embezzlement. The blamer retains minimal standing – perhaps enough for a weak expression of disappointment, but not for full-throated, authoritative blame implying moral superiority. The shared category alone doesn't preserve significant standing.
      *   **Chronic Lateness vs. Chronic Deceit:** Both fall under "unreliability," but deceit involves intentional dishonesty causing potential serious harm to trust and decision-making, while lateness is a lesser failure of punctuality (though potentially harmful). The gravity disparity here is also significant. The attenuation coefficient for blaming deceit based on lateness would be **substantial**, significantly diminishing standing. It wouldn't nullify it entirely (as deceit is worse), but it severely undermines the blamer's authority to lecture on integrity and truthfulness.

  2.  **Structural Form vs. Gravity:** Purely indexing the coefficient to structural similarity while ignoring gravity leads to counterintuitive results, as your lateness/deceit example shows.
      *   While both lateness and deceit *can* be seen as failures of reliability/promise-keeping, the *nature* of the failure differs fundamentally: one is primarily about time management/respect, the other about truthfulness/manipulation. A sophisticated model wouldn't treat them as identical within a "reliability" domain.
      *   **A Better Approach:** Structural similarity (e.g., "breach of promise," "deception," "physical harm") provides the *initial domain* for comparison, but the attenuation *within that domain* is then heavily modulated by the **ratio of gravities**. Lateness and deceit share a loose structural domain, but the gravity ratio strongly favors attenuation when blaming deceit. Tax fraud and embezzlement share a tighter structural domain (financial deception for gain), but again, the gravity ratio heavily attenuates standing against embezzlement.

  3.  **The Blamer's Awareness (Mens Rea/Hypocrisy):** This acts as a **multiplier** on the attenuation.
      *   If the blamer is *culpably unaware* their own conduct is similar (genuine blindness), the attenuation based on symmetry is less severe.
      *   If the blamer is *aware* they are committing the same (or a closely related) type of wrong, this *conscious hypocrisy* significantly **increases the attenuation coefficient**. It demonstrates a deeper flaw in character and judgment, further eroding moral authority. Awareness turns mere symmetry into active bad faith.

  4.  **Thresholds vs. Continuity:** Most plausible accounts favor a **continuous, scalar attenuation** rather than a strict threshold.
      *   **Against Thresholds (Full Nullification within a Domain):** It seems implausible that *any* minor fault within a broad domain (e.g., one instance of forgetting a promise) completely nullifies standing to blame a major fault within that domain (e.g., a pattern of malicious deceit). The gravity disparity matters too much.
      *   **For Continuity:** Standing diminishes gradually as the similarity and gravity of the blamer's own fault approaches that of the target's fault. If the blamer's fault is *identical* in kind and gravity, standing approaches zero. If it's a minor fault in a related domain, standing is only slightly diminished. If it's a major fault in a very similar domain, standing is significantly diminished.
      *   **Borderline Cases & Indeterminacy:** Yes, borderline cases exist where the degree of attenuation (e.g., 30% vs. 70% standing) is genuinely difficult to determine. This reflects the inherent complexity of moral reasoning and context-dependence. In such cases:
          *   **Epistemic Humility:** The blamer should acknowledge the potential undermining effect of their own conduct.
          *   **Focus on Repair/Constructive Engagement:** Shifting focus from blame-as-condemnation to addressing the harm or the problematic pattern might be more appropriate and retain more legitimacy.
          *   **Third-Party Standing:** Others without the relevant fault may be better positioned to blame authoritatively.

  **Calibration Framework Summary:**

  1.  **Identify Relevant Domain:** Determine the morally relevant domain(s) shared by the blamer's conduct and the target's conduct (e.g., dishonesty, unreliability, harm, injustice). Multiple domains might overlap.
  2.  **Assess Comparative Gravity:** Evaluate the relative moral seriousness *within the shared domain(s)*. Consider factors like harm, intent, violation of trust, societal norms, and context. A large gravity disparity heavily attenuates standing.
  3.  **Assess Structural Closeness:** How similar are the *types* of wrongs within the domain? (e.g., lateness vs. deceit within "unreliability" = low similarity; petty theft vs. grand theft within "theft" = high similarity). Closer structural similarity increases attenuation.
  4.  **Factor in Blamer's Awareness:** Was the blamer aware their own conduct mirrored the condemned wrong? Conscious hypocrisy acts as an aggravating factor, increasing attenuation.
  5.  **Calculate Attenuation Coefficient:** This is a complex judgment call integrating steps 2-4. Gravity disparity is usually the strongest factor, modulated by structural closeness and awareness. There is no precise formula, but the outcome is a scalar reduction in standing (e.g., "severely diminished," "moderately diminished," "slightly diminished").
  6.  **Acknowledge Borderlines:** In close cases, recognize the indeterminacy and adopt a stance of humility or focus on constructive engagement over authoritative condemnation.

  **Conclusion:** Your intuition is correct – gravity disparity is usually more decisive than shared category or structural form alone. The tax exaggerator has minimal standing to blame an embezzler; the chronically late person has significantly diminished standing to blame the chronically deceitful. While structural form defines the scope for comparison, gravity differences drive the core attenuation. Standing is best seen as existing on a continuum, with borderline cases requiring acknowledgment of indeterminacy and a cautious approach to blame. There is no hidden threshold that nullifies standing automatically for any fault within a broad domain; the reduction is proportional and continuous, heavily weighted by the comparative seriousness of the offenses.
