answer: |-
  Here's a systematic audit of the "demos as private club" analogy, addressing your specific queries:

  ### Correspondence Table (Analogy Mapping)
  | **Private Members' Club**       | **Democratic Polity (Demos)**      |
  |---------------------------------|------------------------------------|
  | Charter/Constitution            | Constitution/Founding Laws         |
  | Membership Vote                 | Suffrage/Citizen Voting Rights     |
  | Club Officers                   | Elected Government Officials       |
  | Admission Rules                 | Citizenship/Immigration Laws       |
  | Excluded Applicant              | Non-Citizen/Stateless Person       |
  | Club Assets (e.g., building)    | National Territory/Infrastructure  |
  | Membership Fees                 | Taxes                              |
  | Expulsion Mechanism             | Denaturalization/Deportation       |

  ### Critical Disanalogies Bearing on Democratic Legitimacy
  1. **Non-Consensual Subjection & Birthright**:  
     - *Club*: Membership is voluntary; exclusion causes no harm beyond denied access.  
     - *Polity*: Individuals are born into territorial jurisdiction. Exclusion denies rights and subjects people to coercive laws without consent (e.g., taxes, regulations).  

  2. **Historical Extraction & Inherited Infrastructure**:  
     - *Club*: Assets built solely by members' contributions.  
     - *Polity*: Infrastructure/economy often built via:  
       - Colonial extraction (e.g., resources from Global South)  
       - Migrant labor without citizenship rights (e.g., Gulf states, historical U.S. railroads)  
       - Exploited non-citizen residents (e.g., undocumented workers).  
     *This creates obligations to contributors now excluded*.  

  3. **Indivisible Public Goods**:  
     - *Club*: Benefits (e.g., golf course) are separable; exclusion doesn't harm outsiders.  
     - *Polity*: Collective decisions (e.g., environmental policy, war) impose spillover costs on excluded groups (e.g., climate refugees, bombed civilians).  

  4. **Territorial Coercion**:  
     - *Club*: No power to enforce rules on non-members.  
     - *Polity*: Claims sovereign authority over all within territory, including non-citizens.  

  ### Normative Assumptions Quietly Imported
  - **Voluntary Entry**: Assumes individuals "choose" exclusion (ignoring birth, displacement, or lack of alternative states).  
  - **Shared Purpose**: Implies a pre-political consensus (masking coercion over dissenters).  
  - **Separability of Goods**: Pretends club benefits are isolated (denying global interdependence).  
  - **Self-Constitution Myth**: Suggests the demos created itself *ex nihilo* (erasing historical injustice).  

  ### Does the Analogy License Unjustified Exclusion?  
  **No**—the disanalogies undermine this conclusion. When a polity's wealth/infrastructure relies on excluded labor or extraction, boundary-drawing *requires justification*. The analogy fails because:  
  - Exclusion violates reciprocity toward contributors.  
  - Coercion over excluded individuals demands legitimation.  

  ### Proposed Better Analogies  
  1. **Inherited Estate with Tenant Farmers**:  
     - *Structure*: Heirs (citizens) control an estate built by ancestors. Tenant farmers (non-citizen residents) work the land but lack ownership rights.  
     - *Improvements*: Acknowledges historical accumulation and ongoing labor of excluded groups.  
     - *Verdict Change*: Challenges exclusion—tenants who sustain the estate deserve voice/ownership.  

  2. **Corporation with Non-Voting Stakeholders**:  
     - *Structure*: Shareholders (citizens) vote, but employees, suppliers, and communities (excluded groups) are affected stakeholders.  
     - *Improvements*: Recognizes affected interests beyond formal "owners."  
     - *Verdict Change*: Stakeholders with vital contributions (e.g., labor) warrant representation (e.g., co-determination models).  

  3. **Co-Constructed Neighborhood**:  
     - *Structure*: Residents jointly maintain shared infrastructure. Newcomers (immigrants) contribute labor but lack voting rights on community rules.  
     - *Improvements*: Highlights spatial entanglements and collective goods.  
     - *Verdict Change*: Sustained contribution obligates inclusion.  

  ### Verdict on Demos Membership  
  Switching analogies **reverses the conclusion**:  
  - The club analogy justifies exclusion as "self-determination."  
  - The estate/corporation/neighborhood analogies reveal that exclusion of contributors is unjust without:  
    a) **Remediation** (e.g., reparations for extraction), or  
    b) **Inclusion pathways** (e.g., citizenship for long-term residents).  

  **Conclusion**: The club analogy is ideologically loaded—it naturalizes exclusion by masking coercion, historical debt, and interdependence. Democratic legitimacy requires a "stakeholder principle": **All subject to coercive rules or contributing to collective wealth deserve membership consideration**. Boundary-setting must answer to moral claims beyond the current demos.
