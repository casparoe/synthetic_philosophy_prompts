  1.  **Clean Translation (Distributed Immune Response):** Deplatforming functions as a pathogen defense, rapidly isolating perceived harmful "foreign agents" (individuals/ideas) through coordinated collective action (host rejection), scaling with apparent threat level like an inflammatory cascade.
  2.  **Clean Translation (Reproductive Suppression):** Social sanction operates as reproductive suppression applied to memes, where costly punishment (public shaming, ostracism) enforces cooperative norms by inhibiting the spread and "replication" of nonconforming ideas via threat of fitness cost (social/reputational damage).
  3.  **Distortion (Antibody Specificity):** The analogy distorts the immune metaphor by lacking true "procedural antibodies"; biological immune responses involve highly specific molecular recognition, while social deplatforming often relies on heuristic-driven, context-sensitive threat assessment prone to false positives and collateral damage.
  4.  **Distortion (Kin Selection Basis):** Social punishment in humans targets "non-kin" ideas based on ideological alignment rather than genetic relatedness, making the cost-benefit calculus and potential for altruistic punishment more fluid and culturally defined than in strict kin-selected systems.
  5.  **Residue (Due Process Gap):** Philosophers' concern about due process reveals a critical gap; ecological punishment mechanisms (immune response, suppression) are amoral, automatic processes prioritizing group function, lacking any inherent equivalent to procedural fairness, rights, or appeals, exposing a fundamental limitation of the analogy for human normative systems.
