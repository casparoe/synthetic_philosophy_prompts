answer: |-
  Your analysis is exceptionally sharp—you've pinpointed the core structural impasse with remarkable clarity. The "baseline hypothesis" is not only plausible but likely correct: **the fundamental disagreement is meta-ethical/metaphysical—a conflict over the morally relevant "default state" from which justification must proceed.** This isn't a mere technicality; it shapes the entire moral ontology of the debate. Here’s how to diagnose it and define progress:

  ### 1. **The Nature of the Disagreement: A Foundational Clash of Moral Ontologies**
     - **Not Primarily Empirical:** While empirical disputes exist (e.g., wage impacts, fiscal effects), these are often proxies. Both sides cite studies supporting their view, suggesting empirical data is filtered through prior normative commitments. Consensus on facts doesn't resolve the baseline clash.
     - **Not Merely Verbal:** Terms like "coercion" or "association" have contested scope, but the dispute runs deeper than semantics. The core conflict is about *what constitutes the moral "given"*: Is the world naturally stateless (open-borders baseline) or inherently structured by bounded communities (exclusion baseline)?
     - **A Methodological Disagreement:** Your observation about "which comparisons count" is key. Each side selects analogies that entrench their baseline:
       - *Open Borders:* Cites marriage (free association), internal migration (no borders within states), or secession (right to *leave* a polity). These assume the individual as the primary moral unit.
       *Exclusion:* Cites clubs (right to exclude), property (control of shared space), or contracts (limited obligations). These assume the collective as a pre-moral entity.
     - **The Bedrock Conflict: Impartialism vs. Relational Partialism:**
       - *Impartialist Baseline (Open Borders):* Morality begins from a universal, agent-neutral perspective. Borders are artificial constraints interfering with a pre-political human right to movement. Justification must run *from the excluded individual outward*.
       - *Relational Partialist Baseline (Exclusion):* Morality is inherently contextual, arising from constitutive relationships (citizenship, shared history, cooperative projects). The state is a moral agent with *intrinsic* obligations to members. Justification runs *from the existing community inward*.

  ### 2. **Why the Dialectic Feels Stationary**
     - **Incommensurable Starting Points:** Each side’s "core move" (freedom of movement vs. self-determination) is axiomatic within its own framework. To refute the other, they must first accept the opponent’s baseline—which defeats the purpose.
     - **The "Justificatory Burden" Trap:** Who bears the burden of proof? Open borders advocates place it entirely on the excluder ("Justify using force against this innocent person!"). Exclusion advocates place it on the entrant ("Justify your claim on *our* institutions!"). This procedural disagreement *is* the baseline clash.
     - **Feasibility as a Proxy:** Arguments about "feasibility" (e.g., "welfare states collapse without borders") are often moral arguments in disguise. What counts as "feasible" depends on whether the baseline community is taken as fixed (exclusion) or malleable (open borders).

  ### 3. **What Counts as Progress?**
  Given this diagnosis, traditional "refutation" is futile. Meaningful progress lies elsewhere:

  | **Path to Progress** | **Mechanism** | **Example/Outcome** |
  |----------------------|---------------|----------------------|
  | **Reframe the Question** | Shift from "Is exclusion justified?" to "What kind of partiality can be justified?" | Acknowledge special obligations *without* treating the bounded community as morally sacrosanct. |
  | **Develop Shared Meta-Frameworks** | Identify concepts that bridge baselines | Explore "associative duties" (obligations arising from relationships) vs. "distributive justice" (universal obligations) |
  | **Map Trade-offs Explicitly** | Surface hidden value conflicts | "This policy prioritizes citizen welfare at cost X to migrants; that policy prioritizes mobility at cost Y to social trust." |
  | **Seek Non-Ideal Theory Solutions** | Focus on morally urgent harms within constraints | Regional visa compacts, expanded refugee pathways, regularization programs |
  | **Philosophical Clarification** | Define limits of partiality | When do special obligations become unjust exclusion? What triggers "emergent" obligations to non-members? |

  **Concrete Avenues for Advancement:**
  1. **Distinguish Baselines Explicitly:** Frame arguments as *"If we start from Baseline A, then X follows; if from Baseline B, then Y follows."* This exposes the architecture of the disagreement.
  2. **Investigate "Constitutive Commitments":** What material practices (e.g., democratic deliberation, welfare provision) *actually require* closure? This shifts from dogma to functional analysis.
  3. **Focus on Harms of Enforcement:** Even exclusionists grant border enforcement causes harm. Progress could involve minimizing brutality while debating legitimacy (e.g., replacing walls with visa systems).
  4. **Explore Intermediate Institutions:** Concepts like "porous borders," regional free movement zones, or citizenship decoupled from residency offer hybrid models that pressure both baselines.

  ### Conclusion: The Path Beyond Stalemate
  This isn't a debate awaiting a "knockdown argument." It's a **clash of moral visions** about whether human value is located primarily in individuals or in constituted collectives. Progress lies in:
  - **Clarifying,** not conquering, the foundational rift.
  - **Mitigating harms** while the meta-ethical dispute endures.
  - **Building institutions** that respect both universal dignity and the human need for belonging.

  As you suspected, convergence may be impossible on first principles. But we can foster a more lucid, less cruel disagreement—one that acknowledges the tragic choices involved rather than masking them as mere logic puzzles. That alone would be significant progress. Your baseline hypothesis provides precisely the conceptual tool needed to make this shift.
