prompt: |-
  I'm preparing the Q&A defense for a workshop presentation I'll deliver next month on practical ethics and normative decision theory. The room will hold about fifteen scholars: mostly moral philosophers with broadly consequentialist sympathies, but also two Kantians who specialize in moral status and intergenerational obligations, a virtue ethicist who has published on moral expertise and practical wisdom, and three formal decision theorists—one of whom is openly skeptical that "moral uncertainty" denotes anything more than ordinary empirical uncertainty about the effects of actions. Several attendees work on climate ethics and long-term governance, but none are AI ethicists, and the group generally treats bibliographic appeals with suspicion rather than deference.

  The position I intend to defend is the following. When we face what I call structural moral uncertainty—uncertainty not about parameter values within a shared normative framework, but about which framework (consequentialist, deontological, contractualist, or virtue-theoretic) correctly governs obligations across generations—I claim that standard expected moral value maximization is the wrong resolution strategy. Instead, I propose a form of framework-sensitive deference: decision weights should be assigned not by flat prior probabilities over frameworks, but by assessing each framework's internal coherence with its own account of moral learning and revision. More specifically, I argue that frameworks which treat moral knowledge as progressively refined through institutional feedback loops—certain contractualist and virtue-theoretic accounts—should carry greater weight in long-horizon policy domains such as climate mitigation, because their internal dynamics allow for self-correction over timescales that match the problem. Frameworks that treat moral principles as fixed axioms updated only by empirical discovery, by contrast, should be weighted downward in these contexts. Applied to intergenerational climate obligations, this yields a demanding but non-absolute duty: stronger than standard expected-value analyses recommend, yet weaker than pure deontological prohibitions on causing harm.

  Please draft my prep sheet: approximately eight objections, ordered by how likely they are to arise and how damaging each would be if left unanswered, each phrased in the precise vocabulary and tone that this particular audience—epistemologists of normativity, climate ethicists, and skeptical decision theorists—would actually use in the room. For each objection, provide a concise reply suitable for roughly two minutes of speaking time, together with a candid note on where that reply is weakest or most concessive. Be sure to include the objection I am hoping nobody asks—likely something that charges me with smuggling in a hidden consequentialist metric under the guise of "internal coherence," or with treating framework comparison as possible only after I have already assumed a meta-normative stance I have not defended. I do not want generic catalogues of decision-theoretic paradoxes; I want the objections that target the specific move from moral-learning coherence to policy weight, especially as it applies to obligations we hold toward people who do not yet exist and cannot participate in the feedback loops I treat as normatively salient. Do not include requests for bibliographies, reading lists, or citations; this is for oral defense, not a syllabus.
reasoning: |-
  Okay, the user is preparing for a Q&A defense on their workshop presentation about structural moral uncertainty and decision-making across different ethical frameworks. They've described the audience in detail—mostly consequentialist philosophers, some Kantians, a virtue ethicist, and skeptical decision theorists. Their core idea is that when we're uncertain about which ethical framework to use (like consequentialism vs. deontology), we shouldn't just assign probabilities and maximize expected value. Instead, we should weight frameworks based on how well they handle moral learning and self-correction over time, especially for long-term issues like climate change. They argue that frameworks with built-in feedback mechanisms (like some contractualist or virtue ethics approaches) deserve more weight in policy decisions because they can adapt over generations.

  The user wants me to draft a prep sheet with eight likely objections, ordered by how probable and damaging they'd be. Each objection should sound authentic to this specific audience—using precise academic jargon and reflecting the biases of these scholars. The replies need to be concise (about two-minute responses) and include notes on where the reply might be weak. Crucially, they want me to include the "nightmare objection" they're dreading—probably something accusing them of secretly being a consequentialist or assuming a meta-normative stance without defending it. They also emphasize that objections should target the link between "moral-learning coherence" and policy weight, particularly regarding obligations to future people who can't participate in feedback loops. No bibliographies—this is oral defense prep.

  Let me unpack the key elements of their position. The user is rejecting standard expected moral value maximization in favor of "framework-sensitive deference." That means weighting ethical frameworks not by flat probabilities but by their internal capacity for learning and correction. They're privileging frameworks that evolve through institutional feedback (contractualism/virtue ethics) for long-horizon problems, arguing this leads to stronger climate duties than pure expected value but weaker than rigid deontology. The audience's skepticism is multifaceted: the decision theorists might dismiss "moral uncertainty" as just empirical uncertainty; Kantians will worry about downgrading fixed-principle frameworks; everyone might suspect hidden biases.

  Now, thinking about likely objections. First, the decision theorist's skepticism: they'll argue moral uncertainty collapses into empirical uncertainty. That's probable and damaging if unanswered. Reply: structural uncertainty is about the normative "rules of the game," not just outcomes. Weakness: doesn't fully address if "rules" are just higher-order empirical facts. Second, the Kantian objection: rejecting fixed principles undermines core deontology. Reply: institutional feedback can embody respect for persons over time. Weakness: future people can't consent to the process. Third, the "bootstrapping" nightmare objection: accusing the user of covertly using a consequentialist standard (e.g., valuing "self-correction" implies a telos). Reply: coherence is framework-immanent, not cross-framework. Weakness: still might require a meta-criterion. Fourth, the future people problem: how can feedback loops bind those excluded? Reply: focus on institutions as trustees. Weakness: risks paternalism. Fifth, the virtue ethicist might say this misreads virtue ethics as procedural. Reply: virtue ethics also refines through practice. Weakness: Aristotle didn't center institutions. Sixth, the "incommensurability" charge: can coherence scores be compared? Reply: pragmatic comparison for policy, not theoretical perfection. Weakness: concedes the metric is rough. Seventh, the slippery slope: why stop at learning mechanisms? Reply: learning is uniquely critical for long horizons. Weakness: other features (e.g., urgency) might matter more. Eighth, the consequentialist pushback: this artificially constrains options. Reply: self-correction prevents value lock-in. Weakness: assumes lock-in is bad, which a hard consequentialist might deny.

  I need to order these by probability/damage. The decision theorist's collapse objection is probably most immediate—it challenges the very premise. The Kantian and bootstrapping objections are high-stakes because they attack coherence. The future people objection is critical for the climate application. The others are serious but slightly less central. The nightmare bootstrapping objection is the one the user fears most—it's meta and potentially devastating.

  For replies, I'll keep them tight: 2-3 sentences max per reply in the actual draft, with the weakness noted. Tone should match the audience—no dumbing down. For example, the decision theorist gets a crisp distinction between "source of uncertainty"; the Kantian gets "procedural second-personal reasons." The hidden consequentialism reply must be extra careful to avoid sounding evasive.

  Finally, I'll avoid any citation talk. This is about rhetorical defense, not scholarship. The user is clearly deeply familiar with the literature—they name-dropped specifics like "procedural second-personal reasons"—so the replies should assume that level of sophistication.
answer: |-
  Here is your prep sheet, ordered by descending likelihood and potential damage. Each objection mirrors the precise terminology and argumentative style of your specified audience, targeting the core vulnerabilities of your position—especially the move from moral-learning coherence to policy weight in intergenerational contexts.

  ---

  ### **Objection 1 (Decision Theorist)**  
  *"Your 'structural moral uncertainty' is an illusion. What you call framework uncertainty reduces to empirical uncertainty about which actions satisfy *constitutive features* of morality (e.g., maximizing welfare, respecting rational agency). We can model this with standard expected utility by treating the 'true moral theory' as a hidden empirical state. Your 'deference' strategy adds needless complexity."*  
  **Reply:** Structural uncertainty isn’t about *which outcomes satisfy a fixed goal* but *what counts as a goal or constraint*. Constitutive features themselves are contested (e.g., is "welfare" hedonic or capabilities-based? Is "rational agency" temporally bounded?). Standard EU requires a shared outcome space, but frameworks disagree fundamentally on what constitutes a moral outcome. We’re comparing divergent *evaluative structures*, not empirical instantiations of one structure.  
  **Weakness:** Concedes that if all frameworks *could* be mapped to a supervaluationist outcome space (e.g., "overall moral score"), EU might apply. Doesn’t fully refute the "hidden state" view.

  ### **Objection 2 (Kantian)**  
  *"You dismiss 'fixed axiom' frameworks as inferior for long horizons, but this presupposes that moral principles *ought* to be revisable. Deontology treats certain principles (e.g., non-harm) as categorical, grounded in the timeless value of rational agency. Weighting them lower because they don’t 'learn' confuses epistemic humility with moral truth. You privilege adaptability over rectitude."*  
  **Reply:** I’m not denying that some principles may be timeless. But under *acknowledged* uncertainty about which principles are categorical, we must ask: which framework’s *epistemic methodology* best handles persistent disagreement? Fixed-axiom frameworks lack institutional mechanisms to resolve novel intergenerational conflicts (e.g., non-harm vs. subsistence needs in climate migration). Their rigidity risks dogmatism when we lack convergence.  
  **Weakness:** Implies that adaptability is intrinsically epistemically virtuous—a stance a Kantian might reject as consequentialist.

  ### **Objection 3 (The Nightmare Objection – Hybrid Kantian/Decision Theorist)**  
  *"Your 'internal coherence' metric smuggles in a hidden consequentialism. Assessing a framework’s 'capacity for self-correction' assumes a telos—e.g., 'reducing moral error over time'—that only makes sense if we already accept a consequentialist meta-normative stance. But if we’re truly framework-uncertain, we can’t privilege frameworks that optimize learning *without circularity*."*  
  **Reply:** Coherence is *framework-immanent*: I assess whether a framework’s *own* account of moral knowledge (e.g., virtue ethics' *phronesis* via practice; contractualism's reflective equilibrium) supports sustained learning under its *own* terms. I’m not imposing an external "error reduction" metric. For example, a contractualist framework’s reliance on justifiability to all generations *demands* institutional feedback for its own coherence.  
  **Weakness:** The act of *comparing* frameworks’ coherence scores may itself require a meta-criterion you haven’t defended. This reply risks performative contradiction.

  ### **Objection 4 (Climate Ethicist / Intergenerational Focus)**  
  *"Your reliance on 'institutional feedback loops' excludes the very subjects of intergenerational obligations—future people—who cannot participate in those loops. Assigning weight to frameworks that 'self-correct' via institutions privileges adaptability for *present* agents while systematically disenfranchising future moral claimants. This replicates the democratic deficit in climate politics."*  
  **Reply:** Institutions can act as *trustees* for future interests by embedding proxy mechanisms (e.g., ombudspersons for future generations, deliberative foresight bodies). Frameworks emphasizing learning (e.g., virtue ethics through intergenerational apprenticeship; contractualism through surrogate representation) explicitly design for this. Fixed frameworks often lack even this, reducing future people to abstract constraints.  
  **Weakness:** Trusteeship is imperfect proxy representation. Concedes that feedback is asymmetrically controlled by present institutions.

  ### **Objection 5 (Virtue Ethicist)**  
  *"You co-opt virtue ethics as 'adaptive,' but its core is *character* cultivated through individual practice, not institutional feedback. Aristotle’s *phronimos* doesn’t outsource wisdom to systems. By prioritizing institutional learning, you distort virtue ethics into consequentialist governance and ignore how *individual* practical wisdom navigates moral uncertainty."*  
  **Reply:** Contemporary virtue ethics (e.g., MacIntyrean traditions) explicitly ties *communal practices* and *institutional virtues* to sustaining ethical traditions across time. Climate action requires collective agency—individual *phronesis* alone cannot coordinate intergenerational stewardship. A framework’s coherence includes whether it scales its core insights (e.g., *phronesis*) to structural problems.  
  **Weakness:** Risks reducing virtue ethics to social epistemology. Doesn’t address whether institutions can truly cultivate *character*.

  ### **Objection 6 (Consequentialist)**  
  *"Your approach arbitrarily constrains policy options. If a fixed-axiom framework (e.g., deontology) forbids geoengineering, but we assign it low weight due to rigidity, we might permit a high-risk option that empirical evidence marginally favors. But if deontology is *correct*, we’ve catastrophically erred. EU maximization over *all* possible actions avoids this bias."*  
  **Reply:** EU fails when frameworks disagree on the *descriptors* of outcomes (e.g., is geoengineering a "violation" or "necessary evil"?). Assigning weights by coherence doesn’t exclude options; it discounts frameworks that lack resources to *update* their evaluations amid uncertainty (e.g., novel climate risks). This avoids locking us into axioms that may be false but irrevocable.  
  **Weakness:** If a fixed framework is *true*, discounting it *is* catastrophic. Your method assumes corrigibility is safer—a wager, not proof.

  ### **Objection 7 (Formal Decision Theorist)**  
  *"You claim frameworks are 'incommensurable,' yet you compare their 'coherence' to assign weights. This is either circular (coherence defined within frameworks) or requires a neutral meta-coherence standard—which you disavow. Your weights are arbitrary without a shared scale."*  
  **Reply:** Weights reflect *procedural* rationality: which framework offers the most sustainable *process* for resolving persistent moral disagreement? This isn’t about comparing "moral truth" but *epistemic resilience*. We can pragmatically rank resilience (e.g., feedback-rich vs. feedback-poor) without a meta-theory by asking which we’d endorse as a dispute-resolution mechanism.  
  **Weakness:** "Epistemic resilience" may itself be framework-dependent (e.g., a Kantian prizes fidelity over resilience).

  ### **Objection 8 (Contractualist / Kantian)**  
  *"Feedback loops favor *actual* preferences over time, risking moral corruption (e.g., climate complacency). Deontology’s 'fixed' duties protect against this. Weighting adaptability higher assumes historical moral progress is inevitable—a teleology unsupported in non-consequentialist frameworks."*  
  **Reply:** Feedback in contractualism isn’t preference aggregation but *revisable public reason*—e.g., incorporating new scientific consensus into intergenerational justifiability. This *prevents* corruption by demanding scrutiny of biases (e.g., presentism). Fixed duties, by contrast, may become uninterpretable under unforeseen conditions (e.g., "non-harm" with tipping points).  
  **Weakness:** Assumes institutions are competent moral learners. Historical inertia or power imbalances could distort feedback.

  ---

  **Key Strategic Notes:**  
  - **Prioritize Objections 1, 2, and 3.** They attack foundational premises and could unravel your position. Rebuttal 3 must be delivered with particular care to avoid meta-normative entanglement.  
  - **Acknowledge Asymmetry (Objection 4):** Concede the trusteeship gap but emphasize that *no* framework fully includes future people; adaptive frameworks at least *attempt* institutional proxies.  
  - **Leverage Audience Composition:** When pressed by decision theorists, redirect to Kantians ("If we can’t agree on constitutive features, how would *you* model our uncertainty?"). Use virtue ethicists as allies against rigid deontology.  
  - **Tone:** Match technical precision but avoid jargon stacking. Use phrases like "under conditions of deep pluralism" or "non-ideal agency" to signal shared ground.  

  This prep sheet isolates the most probable and lethal critiques while forcing opponents to engage your core innovation: that *how frameworks learn* is a non-arbitrary criterion for weighting them under intergenerational uncertainty. Good luck.
