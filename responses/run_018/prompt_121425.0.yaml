prompt: |-
  I teach a cross-cultural communication module at a business school in Rotterdam, usually to mixed groups of Dutch and Japanese participants, and I am putting together a short glossary of the things we keep stumbling over. There is one I have no vocabulary for, and my students argue about it every term in a way that suggests they sense a real distinction but cannot state it. Here are two instances. A Japanese host, at the end of a visit that has run long, says warmly that they really must do this again soon and will be in touch about dates; the Dutch guest says, good, shall we say the fourteenth; the room goes quiet; the host is now trapped between confirming a date they do not want and visibly retracting, and the guest looks either naive or aggressive. Notice three things: the host would be dismayed if the guest actually came to believe a date was coming, so this is not a matter of not caring whether it is true; the blame for the awkwardness seems to fall on the guest, who took the words at face value; and the host cannot clean it up by saying what they meant, because saying it would be the real offence. The second instance is the one I find harder. A Dutch manager, asked for a reaction to a junior's draft, says flatly and in front of the team that the proposal is weak and should be rewritten from scratch. The Japanese junior is not surprised by the assessment — they had already worked out that the draft was weak — and is not, I think, hurt by the content. What upsets them is that it was said out loud, in that form, there. When I ask the Dutch participants to soften it, they protest that softening would be the deeper insult, since it would imply the junior cannot take the truth. So here the surface form is a blunt truth rather than a transparent falsehood, and yet it seems to have the same three-part shape: what is to be taken up is not what the words literally offer, the hearer who takes up the wrong thing gets blamed, and repairing things by making them explicit somehow makes them worse.

  What I keep circling is this: an utterance whose literal content is not what is meant to be taken up, a convention that fixes the correct uptake, blame falling on whoever takes the literal content at face value, and a version in so many words that is itself an offence — so that what is intended can travel only by indirection, and remains oddly unavailable to be said. I have tried to borrow from things I have read about and none of them fits. It is not lying in the ordinary sense, because nobody is supposed to be deceived. It is not what the much-discussed essay about speakers who are indifferent to whether what they say is true describes either, because these speakers care a great deal and would be upset to be believed. It is not the sort of case philosophers like, where someone says something everyone can see is false in order to show they can get away with it, because nothing is being asserted over anybody here. And it is not just the ordinary indirection of the can-you-reach-the-salt variety, because that decodes automatically, carries no sting, and has a perfectly acceptable explicit paraphrase, whereas here the explicit paraphrase is the one thing you may not produce.

  So: is there an established concept, or a literature, for this configuration — and if the nearest concepts only fit imperfectly, I would rather have the comparisons than a name, since what I need for the glossary is the carving rather than the label. In particular I would like to know what exactly the phenomenon is, what it is not, and where it stops. Two boundary cases I cannot place myself: a hearer who does not share the convention at all, such as a visiting American, a ten-year-old, or a machine transcript that will simply store the sentence — does the utterance become a lie, a failed ritual, or something else, and does the answer depend on whether the speaker knew the hearer was outside the convention? And the half-hearted case, where the speaker would in fact be mildly pleased if the invitation were taken up but does not expect it to be: at what point does the phenomenon dissolve into an ordinary, if vague, invitation? A third case I would like put on one side or the other is the written one, where a warm we should certainly continue this conversation in an email is later read literally by a third party who has no stake in the convention, say in a contract dispute. I am not after references or a reading list — I cannot chase them from here, and a label I cannot define for my students would not help. What I want is a definition sharp enough that I can tell, for each of those three cases, which side of the line it falls on and why.
reasoning: |-
  Okay, the user teaches cross-cultural communication in Rotterdam, dealing with Dutch and Japanese students. They're struggling with a specific communication pattern that keeps coming up. Let me unpack their problem.

  First, they described two scenarios. One is the Japanese host giving a vague invitation that the Dutch guest takes literally. The host doesn't actually want to set a date but would be upset if the guest believed it. The guest is blamed for taking it at face value, and explaining it explicitly would make things worse. The second scenario is the Dutch manager bluntly criticizing a junior's work in public. The junior isn't hurt by the content but by it being said out loud. The Dutch think softening the feedback would be more insulting. Both cases share: literal meaning isn't meant to be taken, there's a convention for correct uptake, blame on the one who takes it literally, and explicit repair worsens things.

  The user has ruled out several concepts: lying (since no deception is intended), bullshit (speakers care about truth), performative insincerity (no power play), and standard indirect speech acts (which can be paraphrased without offense). They need a term or concept that fits this specific configuration.

  I recall Erving Goffman's "face-work" and "interaction rituals." The key here seems to be maintaining social equilibrium. The Japanese host is performing a ritual ending to signal goodwill without commitment. The Dutch manager's bluntness is a ritual of honesty. Both rely on shared understanding of the ritual's purpose. When that's missing, the ritual fails, and the outsider gets blamed for not recognizing it.

  The concept of "phatic communion" comes to mind—communication for social bonding rather than factual exchange. But in the first case, the invitation is phatic, yet the host would be dismayed if believed. So it's more about ritualistic expressions that maintain face and social harmony without literal intent.

  The boundary cases: 
  1. An outsider (American, child, AI) takes it literally. Here, the utterance isn't a lie but a ritual that fails due to lack of shared convention. The outsider's mistake is not recognizing the ritual, not the speaker's deception. 
  2. The half-hearted case where the speaker wouldn't mind if accepted. This blurs into a vague invitation when the speaker is genuinely open, even if unlikely. The critical point is the speaker's commitment—if they'd follow through if pressed, it's not the same phenomenon. 
  3. Written communication in a dispute. The ritual depends on context; when stripped of that, it becomes evidence of literal intent. Without shared understanding, the ritual aspect is lost, making it look like a broken promise.

  So the core is "ritual communication." The phenomenon is a culturally coded ritual where the literal meaning is secondary to the social function. The Dutch blunt feedback ritual affirms equality and honesty norms. The Japanese polite refusal ritual preserves harmony. When these rituals clash, the one not adhering to the expected script is blamed for disrupting the social order. Explicitly stating the ritual's purpose breaks the illusion, causing offense. This framework explains why the same words function differently across cultures and contexts.
answer: |-
  Based on your detailed description and precise requirements, the phenomenon you're grappling with is best understood as **Ritual Communication (or Ritualized Utterance)**. This isn't a single "label" but a conceptual framework capturing the core dynamics: utterances where **literal meaning is subordinated to a shared social ritual**, with strict norms governing uptake, where explicit articulation violates the ritual itself, and where deviation from expected uptake is attributed to the hearer's failure to recognize the ritual.

  ### Core Definition & Mechanism
  1.  **What it is:** A culturally embedded speech act where:
      *   The literal proposition ("Let's meet soon," "This draft is weak") is **not the primary communicative intent**.
      *   The primary intent is to **perform a specific social ritual** (e.g., signaling goodwill/closure, affirming honesty/equality).
      *   Correct uptake requires recognizing and **responding to the ritual, not the proposition**.
      *   **Failure** (taking the proposition literally) is seen as a **breach of social competence** by the hearer.
      *   **Explicitly stating the ritual's function** ("I only said that to be polite," "I said it bluntly to show I respect you enough to be direct") **destroys the ritual's purpose**, causing deeper offense by exposing its mechanics. The ritual *depends* on indirection and shared implicit understanding.
      *   **Truthfulness:** The proposition isn't necessarily a *lie*; it can be true ("draft is weak") or aspirational/vague ("meet soon"). Crucially, the speaker *cares* about the ritual being understood correctly, not about the proposition being believed/followed literally *outside* the ritual context. The host *would* be dismayed if the guest *literally* expected a date; the manager *intends* the bluntness to be received as honesty, not cruelty.

  2.  **What it is NOT:**
      *   **Ordinary Lying/Deception:** No intent to make the hearer believe the literal proposition for strategic gain. The ritual *fails* if the proposition is believed.
      *   **"Bullshit" (Frankfurt):** The speaker is not indifferent to truth; they are deeply invested in the *ritual* being performed and understood correctly. Truthfulness of the proposition is secondary but not irrelevant.
      *   **Performative Insincerity/Bullshitting (Carson):** Not about asserting power or dominance through insincere speech. The rituals described (polite closure, blunt feedback) serve established social cohesion functions within their cultures.
      *   **Standard Indirect Speech Act (e.g., "Can you pass the salt?"):** These *do* decode automatically within a culture and *can* be made explicit ("Please pass the salt") without offense. Ritual Communication *cannot* be made explicit without violating its core function.
      *   **Merely Politeness (Brown & Levinson):** While politeness strategies are involved, this goes deeper. It's about maintaining fundamental social equilibrium codes (harmony, honesty norms) through prescribed verbal rituals. The offense isn't just impoliteness; it's a failure to engage with the underlying social contract.
      *   **Sarcasm/Irony:** While also involving non-literal meaning, these rely on signaling the mismatch (e.g., tone). Ritual Communication *requires* the mismatch to remain unspoken and implicit for the ritual to function.

  ### Applying the Framework to Your Cases
  *   **Japanese Host:** The utterance "We must do this again soon" is a **closing ritual**. Its function is to signal warmth, appreciation, and leave the door symbolically open for future goodwill, *not* to initiate scheduling. Literal uptake (proposing a date) breaches the ritual, forcing the host into an impossible position (violate ritual by being explicit or violate sincerity by agreeing). The guest is blamed for failing the ritual script.
  *   **Dutch Manager:** The blunt "This is weak, rewrite from scratch" is a **honesty/equality ritual**. Its function is to demonstrate directness, lack of hidden agendas, and respect for the junior's ability to handle unvarnished truth (presumed Dutch value). Softening it (e.g., "Perhaps consider strengthening some areas...") violates this ritual by implying the junior *needs* protection from the truth, which is interpreted as condescension. The junior's upset stems from the ritual (public bluntness) being performed in a context (Japanese) where a *different* ritual (indirect, face-saving feedback) is expected. The Dutch participants blame the junior for misinterpreting the ritual as aggression rather than respect.

  ### Addressing Your Boundary Cases (Applying the Ritual Framework)
  1.  **The Outsider (American, Child, AI Transcript):**
      *   **Classification:** **Failed Ritual.**
      *   **Why:** The ritual relies entirely on *shared cultural understanding*. An outsider lacks the code to interpret the utterance as ritual. The literal proposition becomes the *only* available meaning.
      *   **Is it a Lie?** Not inherently. The *speaker* isn't intending deception. However, *to the outsider*, it may *appear* as a lie (if insincere, like the invitation) or simply an unwelcome truth (like the criticism). The key is the *source* of the problem: the lack of shared ritual convention, not the speaker's deceptive intent.
      *   **Does Speaker Knowledge Matter?** Yes, significantly.
          *   If the speaker *knows* the hearer lacks the convention: Uttering the ritual becomes **reckless or negligent**. They are performing an act they *know* will likely be misinterpreted literally, potentially causing confusion or offense. It borders on inconsiderate behavior.
          *   If the speaker *doesn't know* the hearer lacks the convention: It's simply a tragic **cross-cultural misunderstanding**. The speaker performed the ritual in good faith, expecting correct uptake. The hearer took the literal proposition in good faith. The mismatch is structural.

  2.  **The Half-Hearted Case ("Mildly Pleased" Invitation):**
      *   **Classification:** **Ambiguous / Transition Zone to Vague Invitation.**
      *   **Why:** The defining feature of Ritual Communication is that **literal uptake is *undesirable*** and would dismay the speaker (or violate the core ritual function). If the speaker would be *mildly pleased* with literal uptake (even if surprised or not expecting it), the utterance moves away from pure ritual.
      *   **Where the Line Is:** The phenomenon **dissolves** when the speaker possesses **genuine, actionable openness** to the literal proposition. If pressed ("Great, how about the 14th?"), the speaker in a genuine vague invitation might say, "Ah, not the 14th, but maybe sometime next month?" This explicit clarification is *awkward* but *not* the deep ritual violation seen in the pure case. The ritual requires the *indirectness itself* to be functional. If the speaker is open to acting on the proposition, the indirection is merely politeness or vagueness, not a constitutive ritual element.

  3.  **The Written Case (Email in Contract Dispute):**
      *   **Classification:** **The Literal Proposition Prevails.**
      *   **Why:** Ritual Communication is deeply context-dependent, relying on shared understanding, relationship dynamics, and the *performance* of the utterance in a specific social moment. Written communication, especially reviewed later by a third party devoid of that original context and shared cultural knowledge, **strips away the ritual layer**. The third party only has the literal text. "We should certainly continue this conversation" becomes evidence of an *intention* to continue, not a ritual closing gesture. The ritual function is lost in translation to a formal, non-ritualistic context like a dispute. The burden of proof shifts to demonstrating the *ritual context* existed, which is difficult without shared understanding with the third party.

  ### Sharpening the Definition for Your Glossary
  **Ritual Communication:** A culturally specific speech act where:
  1.  The literal meaning of the words is secondary to performing a prescribed social function (e.g., signaling goodwill, affirming norms like honesty).
  2.  Correct understanding requires recognizing and responding to this ritual function, not the literal proposition.
  3.  Taking the literal meaning at face value is considered a social misstep, blamed on the hearer's failure to recognize the ritual.
  4.  Explaining the ritual function explicitly violates its purpose and causes greater offense.
  5.  It ceases to function as ritual communication when:
      *   The hearer completely lacks the cultural context to recognize the ritual (becoming a failed ritual or misunderstanding).
      *   The speaker genuinely intends the literal proposition as actionable, even if vaguely expressed (becoming a vague invitation/statement).
      *   The context removes the shared social framework needed for the ritual (e.g., formal legal review of written text).

  This framework provides the "carving" you need: it defines the phenomenon by its function (performing a social ritual via indirection), its core features (unspoken rules, blame on failed uptake, explicitness as violation), and its clear boundaries with related concepts and the edge cases you described. It directly addresses the Dutch/Japanese clashes you observe as collisions between *different* ritual communication systems.
