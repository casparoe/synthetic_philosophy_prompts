answer: |-
  Here's a workplace scenario designed to isolate your debate, focusing on **whether the wrong-making feature of promise-breaking is *activated* in an institutional betrayal context**:

  **The Thought Experiment:**  
  As a senior manager at "SafeBuild," you privately promise a junior engineer confidentiality about their admission of bypassing a minor, non-safety-critical documentation step to meet a deadline. Later, you discover this bypass *could* lead to a very small, purely financial penalty (e.g., a $100 fine) during an upcoming external audit. Reporting it would protect the company from the fine but expose the engineer to minor, non-career-ending procedural reprimand. Both particularists and generalists agree you should break the promise and report the bypass to prevent the minor harm (the fine). However, they fiercely disagree on *why* breaking the promise isn't wrong *here*.

  **The Core Disagreement & Feature Analysis:**  

  1.  **Generalist View (Your Friend's Implicit Stance):**  
      *   **What they say:** "Breaking a promise *is always pro tanto wrong* because it involves **betrayal of trust** (the core wrong-making feature). Here, that wrongness is present but *outweighed* by the minor harm prevented ($100 fine). It's a conflict between two rules: 'Keep promises' vs. 'Prevent harm.' The harm-prevention rule wins this time."
      *   **Feature Doing the Work:** The **betrayal of trust** inherent in promise-breaking *is activated*. It's a genuine moral cost, just overridden by consequences. Removing the institutional betrayal context (e.g., promising a friend secrecy about a harmless hobby) makes the betrayal feature active, and breaking it *would* be wrong unless outweighed by something stronger. This is standard rule-weighing generalism.

  2.  **Particularist View (The Disputed Stance):**  
      *   **What they say:** "The **betrayal of trust** feature *isn't even activated or properly present* in this context. Why? Because the promise of confidentiality was made *within an institution (SafeBuild) whose core purpose includes preventing procedural/financial harm and ensuring compliance*. By promising secrecy about a bypass that causes institutional harm, the manager *betrayed the institution's core purpose first*. The 'promise' itself was morally defective from the start – it asked the manager to violate their primary institutional duty. The context (institutional role + harm to that institution) **holistically disables** the normal wrong-making feature (trust betrayal) of breaking *this specific promise*."
      *   **Feature Doing the Work:** The **institutional betrayal context** holistically disables the activation of the core wrong-making feature (**betrayal of trust**) normally associated with promise-breaking. The promise wasn't a valid generator of the moral reason (trust obligation) because it conflicted fundamentally with the manager's role-based duty to the institution. Breaking it isn't overriding a wrong; it's correcting a prior, contextually invalid moral commitment.

  **The Dependency Test (Removing Betrayal):**  

  *   **Modify the Scenario:** Change the promise to something *not* involving harm to the institution's core purpose. Example: The manager privately promises the same engineer confidentiality about their *harmless* struggle with a non-work-related anxiety disorder.
  *   **Result:**  
      *   **Generalist:** Still sees breaking *this* promise as activating the **betrayal of trust** feature. It would be pro tanto wrong, potentially outweighed only by a *much* stronger reason (e.g., preventing imminent serious harm).
      *   **Particularist:** Now agrees the **betrayal of trust** feature *is* activated. The context lacks the institutional betrayal element that disabled it before. Breaking *this* promise *would* involve genuine betrayal and require a strong countervailing reason to be justified. The **institutional betrayal context was essential** to disable the feature in the original case.
  *   **Conclusion:** The case **collapses into standard generalism without the institutional betrayal context**. Both sides now agree the core wrong-making feature (betrayal of trust) is active if the promise is broken in the modified scenario. The original disagreement *hinged entirely* on the particularist claim that the institutional betrayal context holistically disabled that feature.

  **The Hidden Dependency You Sensed:**  
  The particularist argument **critically depends** on the **promise itself constituting a prior institutional betrayal**. It's not just that breaking the promise *prevents* harm; it's that the *making* of the promise was already a contextually wrong act *because of the institutional role*. This prior defect is what holistically disables the normal moral force (the wrong-making feature) of breaking *that specific promise*. If this institutional role/harm nexus isn't present in the promise-making context, the disabling mechanism fails, and the case reverts to a standard conflict between active moral reasons (promise-keeping vs. harm-prevention), resolvable by generalist weighing. The dependency is on the *context making the promise itself morally defective within the institutional framework*.
