  Bottom line: The inconsistency stems from varying disciplinary priorities and cultural biases, not a unified theory.
answer: |-
  Your observation reveals deep inconsistencies rooted in disciplinary traditions, cultural politics, and implicit hierarchies of evidence. Here's the reconstructed framework and its implications:

  ### Core Philosophical Commitments Driving the Split:
  1.  **Textual Canonicity vs. Oral Tradition:** Western historiography inherently privileges *written textual traditions* validated by elite institutions (Homeric epics preserved by Greek academia, Biblical texts canonized by religious authorities). Arthurian mentions (Gildas, *Annales Cambriae*) are deemed fragmentary, non-canonical, and lack continuous institutional curation.
  2.  **Cultural Proximity & Identity Politics:** Narratives foundational to *dominant Western cultural identity* (Troy as Greco-Roman origin myth, Exodus as Judeo-Christian cornerstone) receive "historical kernel" allowances despite thin evidence. Arthur is peripheral (Celtic/British) and lacks comparable continental cultural weight.
  3.  **Academic Disciplinary Boundaries:** Archaeology (material evidence) dominates Near Eastern/Egyptian studies, hence Exodus faces rigorous material absence tests. Classics integrates philology and accepts Homer's cultural authority. Arthurian studies falls under Medieval Literature or Celtic Studies, isolating it from "History" proper.
  4.  **Risk Assessment:** Challenging Exodus risks religious backlash; challenging Troy risks classical scholarship's foundations; challenging Arthur carries minimal institutional risk.
  5.  **Romanticization Distance:** Very ancient events (Troy) benefit from "heroic age" mystique, making "kernel" theories palatable. More recent legends (Arthur) are scrutinized with medieval chronicle standards. Exodus exists uncomfortably between theology and history.

  ### Is a Unified Philosophical Theory Possible?
  **No.** The practice is **philosophically underdetermined** but not arbitrary. It's a product of:
  *   **Path Dependence:** Disciplines developed different evidentiary standards.
  *   **Cultural Capital:** Some narratives are too central to challenge categorically.
  *   **Inertia:** Syllabus/museum conventions resist change without overwhelming new evidence.
  The inconsistency arises because **different criteria are applied based on narrative context, not uniform standards.** Troy gets a "philological/material blend" pass, Arthur gets "literary fragment" treatment, Exodus gets "archaeological disproof" focus.

  ### Implementing a Probability Score: Consequences & Challenges
  Replacing labels with a credence value (e.g., "P(Historical Core) = 0.4") would demand:
  1.  **Radical Transparency:** Museums/syllabi must detail scoring methodology (weighting texts vs. archaeology vs. linguistics).
  2.  **Quantifying the Unquantifiable:** How to assign probabilities to ambiguous evidence (e.g., Hittite "Wilusa" = Troy)? Subjectivity remains.
  3.  **Dynamic Displays:** Scores update with new discoveries (e.g., Luwian inscriptions re: Troy).
  4.  **Cultural Pushback:** Exodus scoring (e.g., P=0.05) would face accusations of scientism from religious communities; Arthur (P=0.2) might anger nationalist groups.
  5.  **Syllabus Overhaul:** History courses become exercises in probabilistic reasoning, not narrative transmission.

  **Changes in Practice:**
  *   **Museums:** "Trojan War" label replaced with "Conflict at Hisarlik (Troy VIIa): P(Core Historical) = 0.6 based on stratigraphy & Hittite texts". Exodus display: "Narrative Theology: P(Mass Migration as Described) = <0.01 based on Sinai archaeology & Egyptian records".
  *   **Universities:** Courses titled "Probability & the Past: Case Studies (Troy P=0.6, Arthur P=0.2, Exodus P=0.05)". Forces explicit debate on evidence weighting.

  ### Why a Pure Probability Model is Problematic
  *   **Evidence isn't fungible:** A shard with a king's name vs. isotopic migration data require different interpretive frameworks.
  *   **Ignores Meaning:** Probability scores sideline *why* a story matters culturally (Troy's role in Greek identity, Exodus's ethical function).
  *   **False Precision:** Implies mathematical rigor where significant hermeneutic judgment remains. Is "P=0.3" meaningfully different from "possible kernel"?

  **Verdict: The inconsistent categorization reflects historically contingent disciplinary hierarchies and cultural investments rather than a coherent philosophy of evidence, revealing academia's unresolved tension between critical historiography and foundational cultural narratives.**
