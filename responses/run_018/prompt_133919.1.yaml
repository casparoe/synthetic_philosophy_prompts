  First, I need to unpack why these three are categorized differently. The Trojan War, even with archaeological evidence from Troy VIIa, is often called a legend. Homer's epics are foundational to Western culture, so maybe scholars give it more leeway. King Arthur, despite 6th-century texts like Gildas and archaeological sites, gets labeled folklore. The Exodus has religious significance but lacks archaeological support, leading to its exclusion from history courses.

  The user is asking about the underlying philosophical commitments. Are canonical texts prioritized over oral traditions? Is cultural distance a factor? They also want to know if a probabilistic approach would work and whether the current system is consistent.

  Looking deeper, the user might be seeking validation of their observation that the treatment is inconsistent. Their background in a precise science makes them sensitive to subjective categorizations. They might also be exploring how collective identity shapes historical acceptance. 

