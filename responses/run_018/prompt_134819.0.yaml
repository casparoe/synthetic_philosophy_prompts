  Ah, and step (5)'s "smooth slope" observation actually undermines the whole premise—if non-trivial reproduction is gradational, then responsibility must be too. That means we can't wash our hands of consequences just because a system crossed some arbitrary complexity threshold. The user seems to sense this but hasn't articulated why it breaks the chain. 

