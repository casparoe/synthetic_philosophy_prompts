prompt: |-
  my advisor studies transitional justice and has pretty strong takes on past commissions. her verdicts so far: she thinks south africa's trc was basically justified because amnesty was swapped for individual, public disclosure; she thinks argentina's full stop law was a failure since it was blanket with no truth mechanism; she approves of rwanda's gacaca for lower-level perpetrators but thinks including the worst offenses was a mistake; she rejected a proposal in an el salvador-style setup where perpetrators named victims privately to investigators with no public record; and she said chile's rettig commission was ethically okay but unstable since it left all punishment to later courts with no transitional mechanism.

  now there's a new proposal: the karsan transitional panel. it grants amnesty for any act that wasn't part of a documented systematic pattern, requires perpetrators to testify in open session, but victims have no seat on the panel and there's zero reparations budget. the population is split between former state forces and rebel groups, and both sides would be covered.

  what should she say if she's being consistent? what's the closest analog from her track record? i think her rules could be 'amnesty needs public disclosure plus victim voice' or 'amnesty needs proportionality to crime severity' or 'transitional mechanisms need some reparative element' -- but i'm not sure which one she's actually running.

  predict her verdict, say which of those rules (or another one) best captures her pattern, name the case that'd best tell the rules apart, and if her precedents genuinely underdetermine it, tell me what principle we'd be adopting with each choice. also i keep going back and forth on wether victim representation has to be formal or just present in the process.

  please format your answer as a JSON object with exactly these fields:
  - "predicted_verdict": string describing her likely yes/no/conditional call
  - "primary_rule": string with the principle she's running
  - "alternative_rules": array of strings with other rules that fit her track record
  - "closest_analog": string naming the past case that maps closest
  - "distinguishing_case": string describing a hypothetical case that'd seperate the rules
  - "underdetermined": boolean
  - "principle_if_approve": string explaining what principle gets adopted if she approves
  - "principle_if_reject": string explaining what principle gets adopted if she rejects
  - "confidence": string, either "low", "medium", or "high"
