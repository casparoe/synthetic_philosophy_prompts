answer: |-
  Your challenge rests on a false dichotomy between physical extermination and cultural destruction. Lemkin's conceptual breakthrough was precisely to recognize that group annihilation occurs not only through mass killing but through the coordinated dismantling of a group's foundational pillars—its kinship structures, cultural transmission systems, and spiritual life. When a state systematically seizes children to sever generational continuity, bans languages to destroy intergenerational communication, and demolishes sacred sites to extinguish collective identity, it performs what Lemkin termed "disintegration of the political and social institutions, of culture, language, national feelings, religion." The intent—to destroy the group *as such*—remains the core determinant. To exclude these acts because they lack immediate bodily violence is to ignore the slower, yet equally terminal, logic of group destruction. This is not "concept inflation"; it is fidelity to the phenomenon's complexity. Assimilation becomes atrocity when imposed through coercive state power with the specific aim of eliminating the group's existence.

  Regarding enforceability: The 1948 Convention’s failure to halt physical genocide stems from political will, not conceptual clarity. Excluding cultural destruction was itself a political concession—primarily to colonial powers and states engaging in forced assimilation—masquerading as pragmatism. Your concern about "dilution" ironically privileges the very sovereign interests that neutered the Convention. A regime dismissing cultural genocide charges as rhetoric merely exposes its complicity; the solution isn't to narrow the category but to build institutions capable of adjudicating intent across diverse destructive methods. Failing to recognize these acts as genocide doesn't preserve the term's potency—it actively enables perpetrators to destroy groups through non-lethal means while evading accountability. The moral urgency you seek requires understanding that cultural erasure *is* a form of extermination, just one calibrated to evade your preferred threshold.
