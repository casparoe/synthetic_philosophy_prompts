  Fourth, the anxiety about ownership vs. attribution. New consultants often fear being copied, but what they really want is recognition. Attribution ensures their name is attached, which builds their brand. The user might be conflating ownership with the need for credit. High probability here, 90%, that anxiety is about attribution. They might feel their hard work deserves acknowledgment, which is valid but different from exclusive ownership.

  Combining these: The overall likelihood of genuine moral ownership is low because of the hurdles in each factor. Multiplying the inverses (since all need to be true) gives about 0.5%. Even using a geometric mean, it's around 8.4%. So overall credence is very low, 5-10%. 

  The least certain factor is social convention. It's possible that in niche consulting fields, there are unwritten rules about idea ownership. But without evidence, it's speculative. A historical case like Tesla vs. Marconi on radio patents might show that even expressed ideas face disputes. If there were examples of unexpressed ideas being protected socially, that could change my view. But such cases are rare.

