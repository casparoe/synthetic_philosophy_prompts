  For the refusers specifically, I need to consider Thompson's position as a warrant officer giving him some autonomy, his outsider status in a helicopter, and his immediate moral revulsion. These factors challenge both theories but don't completely break them - Browning can accommodate outliers, while Goldhagen struggles more.

