  **Karmic Resource Management Policy Manual (Rev. 8.7)**

  1.  **Role Assignment & Starting Compensation:** Employee placement, initial compensation tier, and benefits eligibility are determined solely by the verified aggregate Net Karmic Balance (NKB) accrued prior to current incarnation commencement. This balance incorporates **Inter-Incarnational Compound Interest (IICI)** applied to unresolved merit/demerit from prior cycles, calculated quarterly (astral time) at the prevailing Prime Karmic Rate (PKR). NKB is non-negotiable and reflects total desert. Starting conditions, including significant health challenges or socio-economic disadvantages encountered upon embodiment, represent the precise karmic equilibrium point required for optimal soul-growth alignment. Disputes regarding initial assignment must cite specific computational errors in the Akashic Records audit trail.

  2.  **Performance Metrics & Merit Accrual:** Daily karmic audits quantify desert generation via standardized Moral Contribution Units (MCUs). Positive MCUs are awarded for actions aligning with corporate values (e.g., synergy enhancement, deficit reduction, exceeding stakeholder harmony quotas). Demerits accrue for value-detracting actions. Note: **Retroactive Desert Adjustments (RDAs)** may be applied for actions taken under verifiable cognitive impairment (e.g., documented neurotransmitter imbalance, acute existential despair exceeding corporate thresholds). RDAs require Form K-742b and notarized astral testimony. Failure to meet minimum MCU quotas for two consecutive fiscal quarters initiates a Karmic Performance Improvement Plan (KPIP), mandating remedial virtue workshops and potential demerit offset protocols.

  3.  **Promotions & Advancement Eligibility:** Promotion eligibility requires demonstrable surplus NKB growth exceeding departmental benchmarks and sufficient accrued merit to fund the enhanced role's karmic overhead. Merit accrued within the current incarnation may be subject to **Karmic Reinvestment Compounding (KRC)**, accelerating growth potential, but requires existing positive NKB. Advancement is contingent upon quantifiable desert, not temporal tenure or perceived effort. Privilege or advantage experienced within the current life cycle is recognized as earned credit from prior merit deployment and is factored into desert calculations for future advancement potential.

  4.  **Involuntary Separation Protocols:** Workforce reduction initiatives are executed based solely on real-time departmental NKB rankings. Employees falling below the Critical Karmic Solvency Threshold (CKST) for their role tier are subject to immediate termination ("karmic bankruptcy discharge"). Separation represents the necessary rebalancing of cosmic accounts and is unrelated to individual effort in the current cycle, which may constitute merely servicing pre-existing karmic debt. Suffering experienced during separation is categorized either as: a) Punitive Demerit Liquidation (PDL) for negative NKB, or b) Statistically Neutral Realignment Suffering (SNRS) resulting from broader cosmic portfolio rebalancing. Appeals based on "moral luck" or perceived unfairness of pre-assigned karmic debt are inadmissible; the system is definitionally equitable.

  5.  **Post-Termination Processing & Re-Embodiment:** Following separation, the employee's final NKB, adjusted for separation-related SNRS/PDL, undergoes a mandatory audit period. This balance, minus applicable administrative fees and unresolved demerit interest, forms the basis for next-cycle assignment. **Karmic Carryforward Losses (KCLs)** incurred during periods of involuntary unemployment, chronic illness, or significant trauma within the terminated cycle are applied, potentially lowering the starting NKB for the next incarnation. Opportunities for mitigating KCLs through post-separation astral volunteer programs exist but require positive residual merit. Re-embodiment logistics (species, location, socio-economic starting parameters) are non-negotiable and precisely calibrated to the audited NKB. Previous service with the company confers no preferential re-hire status; all incarnations are treated as distinct contractual entities. Karmic balances are non-transferable.
