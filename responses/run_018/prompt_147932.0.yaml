answer: |-
  ### (1) Translation into Evo-Devo Vocabulary  
  The philosophical debate maps onto evo-devo as follows: **Scientific theories** are developmental systems—gene regulatory networks (GRNs) with canalized pathways—whose "phenotype" is empirical success. **Thought experiments** act as *environmental perturbations* (e.g., altered signaling gradients) applied to this GRN. Norton’s "mental-model manipulation" view corresponds to **recombination of pre-existing regulatory subcircuits**: no new genes (empirical content) are expressed; existing components are rewired, testing robustness but only revealing conserved functions (e.g., buffering against logical inconsistency). Brown’s "intuition-pumping" resembles **induction of phenotypic plasticity**: perturbations push the theoretical GRN into a novel *morphospace region*, exposing latent attractors (e.g., Einstein’s elevator revealing gravity-spacetime equivalence as a preexistent but unmapped basin in theory-space). **Predictive success** is fitness traversing an epistemic landscape: theories survive selection by climbing gradients of explanatory coherence (fitness peaks), while failed predictions mark valleys. Crucially, "new knowledge" is either:  
  (a) **Canalization breakdown** (Norton): Perturbation disrupts buffering, exposing fragile dependencies (e.g., Galileo dismantling Aristotelian mass-dependence), or  
  (b) **Developmental plasticity revealing cryptic variation** (Brown): Stressors (e.g., Einstein’s elevator) induce alternative stable states in the GRN, accessing adjacent possible phenotypes.  

  ### (2) Residue Report: Canalized vs. Untranslatable  
  **Canalized Mappings:**  
  - *Theory as organism/GRN*: Flawless. Theories evolve via selection on variational properties.  
  - *Thought experiments as perturbations*: Clean. They test modularity, robustness, and plasticity.  
  - *Predictive success as fitness*: Direct. Fitness landscapes model theory progression through morphospace.  
  - *"New empirical facts"*: Maps to **attractor discovery**. Einstein’s equivalence principle was a preexistent basin; the thought experiment revealed it, like stress exposing cryptic genetic variation. No *de novo* "facts"—just unmapped regions.  

  **Plastic/Strained Mappings:**  
  - *Intuition as plastic response*: Workable if "intuition" is the GRN’s capacity to reorganize outputs under perturbation (e.g., plasticity in gene expression). But "intuition" implies normative cognition—biology lacks this teleology.  
  - *Conceptual clarification as buffering*: Canalization maintains stability; clarifying concepts is analogous but imports *normative intent* (e.g., "correct" clarification).  

  **Untranslatable Residue:**  
  - **Justification norms**: Evo-devo describes *how* systems respond, not whether they *should*. Norton/Brown debate justification (e.g., "Does intuition justify belief?"). Biology has no analogue for epistemic "oughts"—this residue is purely philosophical.  
  - **Conscious model-manipulation**: Mental "models" imply agency; GRNs evolve blindly. Thought experiments as *designed* interventions have no counterpart.  

  ### (3) Verdict  
  The untranslatable residue is **primarily a defect of evo-devo’s descriptive vocabulary**, not philosophical vacuity. Evo-devo excels at modeling *process* (e.g., perturbation → altered trajectory) but lacks normative structure to handle justification. Crucially, the "new empirical knowledge" debate **collapses entirely into attractor revelation**: thought experiments expose preexistent, unexplored regions of theory-space (like phenotypic plasticity revealing hidden morphospace). Norton is right that no *de novo* content emerges—only recombination. Brown’s "intuition" is just the system’s plasticity under stress. The substantive core—whether thought experiments access latent empirical structure—maps perfectly. The residue (justification, agency) signals philosophy’s distinct terrain: it interrogates *why we trust* these revealed attractors. Evo-devo can’t touch that—nor should it. Your framework proves the empirical debate is real but biologically reductive: "knowledge" is always an attractor waiting to be actualized.
