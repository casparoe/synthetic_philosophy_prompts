answer: |-
  That's a brilliantly observed paradox at the heart of transitional justice and state identity. You're right – there isn't a single, universally accepted term for *exactly* this double move, but it's a well-recognized phenomenon in political theory, international law, and critical discourse analysis. Let's break it down:

  **Established Concepts (Close, but not exact):**

  1.  **"Constructive Ambiguity" (Applied Strategically):** Often used in diplomacy for deliberate vagueness to facilitate agreement. Here, it's applied strategically *over time* regarding state identity – allowing the "we" to be ambiguous enough to serve both the moral purpose (apology) and the legal purpose (denial of liability).
  2.  **"Selective Inheritance":** States often selectively claim the *positive* legacies (glorious history, cultural achievements) while disavowing the *negative* ones (atrocities, oppressive regimes). Your example is a specific temporal and performative instance of this broader pattern.
  3.  **"Performative Contradiction" (Jurgen Habermas):** When the act of communication (the apology using "we") contradicts the presuppositions or implications of that act (the simultaneous legal denial of being the same "we"). It highlights the tension within the state's communicative action.
  4.  **"Temporal Bifurcation of State Identity":** This describes the core issue: the state presents itself as a continuous moral agent across time when convenient (for apology/legitimacy) but as a discontinuous legal entity when inconvenient (for liability/reparations).

  **Coining a Term: Selective State Temporal Identity (SSTI)**

  This captures the core mechanism: the state *selectively* chooses which temporal facet of its *identity* (continuous moral agent vs. discontinuous legal entity) to activate based on the *specific domain* (moral apology vs. legal liability) to achieve its desired outcome.

  **Defining the Edges: How SSTI Differs**

  1.  **vs. Simple Hypocrisy:** Hypocrisy is a broader character flaw. SSTI is a *structural, institutional strategy* leveraging the inherent ambiguity of state continuity over time. It's systemic, not (just) individual dishonesty.
  2.  **vs. Simple Equivocation on "We":**
      *   **Scope:** Equivocation is a general linguistic trick. SSTI is a *specific application* of equivocation tied to the *fundamental question of state identity and continuity* across long timeframes.
      *   **Domain Specificity:** SSTI isn't random equivocation; it's a *systematic* toggling *between distinct conceptual domains* (morality/symbolism vs. law/economics). The "we" means one thing (continuous collective) in the apology speech and something fundamentally different (discontinuous entity) in the courtroom.
      *   **Strategic Intent:** The equivocation serves a clear dual purpose: gain moral credit/legitimacy *and* avoid material cost/liability. It's a calculated institutional double move.
  3.  **vs. Genuine Regime Change/Legal Succession:** Sometimes, the legal argument *is* valid (e.g., revolution creating a truly new state). SSTI occurs when the *same* political entity (or its direct, uncontested inheritor within the same constitutional framework) uses both arguments strategically. The tension arises from the *same actor* claiming both positions contextually.

  **Cases Where the Moves Might *Not* Conflict (Nuance is Key):**

  1.  **Symbolic Apology + Material Reparations by Different Means:** A government might offer a sincere apology using "we" (accepting moral continuity) while arguing *against specific legal liability claims in court* (perhaps on technical grounds like statutes of limitations, sovereign immunity nuances, or defining *who* exactly is liable *now*), but *simultaneously* establish a significant reparations fund, social programs, or land restitution schemes through *political* channels, not litigation. The apology and material response align morally, even if legal liability is contested.
  2.  **Transitional Justice Mechanisms:** Truth and Reconciliation Commissions (TRCs) often involve official apologies (using "we" for the state's past actions) while explicitly *foregoing* prosecutions or direct legal liability for perpetrators (offering amnesty for truth). Here, the apology acknowledges moral continuity, the lack of prosecution might involve arguments about discontinuity or practicality, but the *overall process* (apology + truth-telling + sometimes reparations) represents a holistic, if imperfect, acceptance of responsibility. The "double move" is integrated into a larger, agreed-upon framework.
  3.  **Clear Successor State with Moral Acknowledgment:** A new state, formed after a genuine break (e.g., dissolution of an empire), might offer a *symbolic* apology acknowledging the moral burden of history ("we, as inheritors of this land/people, acknowledge the wrongs done here") while explicitly denying *legal* liability as the *direct* successor ("we are not the legal entity that committed these acts"). This can be seen as less contradictory and more an honest statement of complex inheritance. The apology uses "we" in a cultural/historical sense, not a strict legal identity sense.
  4.  **Apology as Precursor, Reparations to Follow (Policy Argument):** A government might apologize using "we" (establishing moral continuity) and *use that moral position* to argue *for* reparations through legislative or executive action, explicitly *rejecting* the legal discontinuity argument. The apology paves the way for material redress based on the *same* principle of continuity.

  **The Core of SSTI:**

  The problematic double move you describe – the *exact* phenomenon of using the continuous "we" for moral apology while deploying the discontinuous entity argument to *block reparations* – is **Selective State Temporal Identity (SSTI)**. It exploits the state's unique position as both a:

  1.  **Perpetual Abstract Entity:** ("The State" endures beyond governments/regimes, creating the *possibility* for moral continuity).
  2.  **Concrete Legal Person:** (Subject to specific laws, treaties, and financial constraints at any given moment, where discontinuity arguments hold legal weight).

  SSTI occurs when the state *strategically toggles* between these two facets, leveraging the ambiguity of its own temporal existence, to maximize symbolic legitimacy and minimize material cost. It's a profound illustration of how states navigate the fraught terrain of historical responsibility.
