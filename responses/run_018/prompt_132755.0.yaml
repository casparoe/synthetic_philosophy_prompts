  First question about ambiguous cases: The politician distributing goods for electoral support is a perfect test case. In their framework, this might not be corruption if it aligns with local reciprocity norms - but that feels uncomfortable. I should point out how their criterion could still condemn this if the politician violates fiduciary duties (e.g., diverting disaster funds for patronage). But the boundary is indeed fuzzy when norms are unwritten.

  Second question on Western frameworks: They might be oversimplifying. Weberian bureaucracy is an ideal type, but actual Western systems have always had political patronage (spoils systems, lobbying). The OECD and Transparency International now acknowledge "functional equivalents" - their draft slightly misrepresents contemporary anti-corruption discourse.

  Third question about universalization: Their "category mistake" charge is provocative but defensible in postcolonial theory. However, they should address how local activists use corruption discourse strategically - it's not just Western imposition. The bigger issue is the regulatory dilemma: if corruption is entirely context-dependent, how do we address transnational bribery? 

  The strongest unaddressed objection seems to be about enforceability. If every institution defines its own fiduciary logic, we lose comparative metrics. But maybe that's philosophically honest - their framework might work better as an analytical tool than a legal standard. I'll suggest they own that limitation while showing how context-sensitivity reveals real accountability mechanisms.

