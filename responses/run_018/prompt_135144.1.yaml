  *(Curvature profile: 90° entry → 180° apex → 90° exit; no enclosed counters)*  

  **Conclusion:**  
  We endorse collaborative empirical resolution of these cruxes via eye-tracking (fixation on loop regions), fMRI (invariant-selective vs. cluster-sensitive neural responses), and adversarial generative models (e.g., GANs perturbing invariants vs. style features). Until then, our disagreement remains empirically substantive but methodologically productive.  

