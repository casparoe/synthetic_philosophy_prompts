  First, I need to untangle the core confusion: the user's friend seems to conflate prioritarianism with strict egalitarianism. That's a critical starting point. Prioritarianism cares about absolute welfare gains for the worse-off, not equality for its own sake. Leveling down—reducing the well-off's welfare without helping others—isn't intrinsically good under prioritarianism. 

  The user's framing of "unavoidable trade-offs between equality and aggregate well-being" is slightly off. Prioritarianism doesn't treat equality as a standalone value; it's about weighted welfare aggregation. The real tension is between priority-weighted welfare and total welfare. 

  For intergenerational cases (like taxing the present for the future), I should emphasize two things: 
  (1) If the distant future is much worse off, prioritarians would support transfers even if total welfare decreases—but only if the gain to the worse-off outweighs the loss to the better-off after priority weighting. 
  (2) Leveling down accusations only stick if the policy actively harms the present without helping the future, which prioritarians reject. 

  The user seems analytically sharp but frustrated by circular arguments. They'd benefit most by seeing why the objection fails against true prioritarianism, and how intergenerational cases test the theory's distinct logic. No need to coddle—they want directness. 

  I'll flag the contested point: some argue prioritarianism implicitly requires leveling down in zero-sum cases. But that's a minority interpretation; standard prioritarianism avoids it by design. 

