answer: |-
  You've hit the core tension correctly, but your friend fundamentally misapplies the leveling-down objection (LDO) to prioritarianism. **Prioritarianism does *not* intrinsically license leveling down, and rejecting LDO is central to its design.** Here's the direct conceptual breakdown for intergenerational cases:

  1.  **The Core Prioritarian Commitment (vs. Egalitarianism):**
      *   **Egalitarianism:** Values equality *itself* as intrinsically good. Reducing inequality *by any means* (even leveling down) improves the outcome *in one respect* (equality), even if it worsens it in others (total welfare).
      *   **Prioritarianism:** Values *improving the absolute well-being of the worse-off more*. It assigns greater moral weight to benefits going to those at lower absolute welfare levels. **Leveling down violates this core:** It *harms* someone (the well-off) without *benefiting* anyone else. It decreases total welfare and provides *no* countervailing gain to the worse-off. A prioritarian sees this as strictly worse.

  2.  **Implication 1: LDO is Fatal to Egalitarianism, Not Prioritarianism:**
      *   The LDO successfully exposes that strict egalitarianism *must* endorse some leveling down as good *in one respect* (achieving equality), even if outweighed by other bads. This is a major reason prioritarians reject strict egalitarianism.
      *   **Prioritarian Response:** "Leveling down is *never* good, not even pro tanto. It produces no moral gain under our view because it doesn't benefit the worse-off. It only harms." Policies involving pure leveling down are *rejected* by prioritarianism.

  3.  **The Real Trade-off (Not Equality vs. Aggregate):**
      *   Your framing of "trade-offs between equality and aggregate well-being" is slightly misleading for prioritarianism. The genuine prioritarian trade-off is: **Priority-Weighted Welfare vs. Total (Unweighted) Welfare.**
      *   A prioritarian *can* favor a policy that slightly *reduces* total welfare if the gains to the much worse-off (heavily weighted) sufficiently outweigh the losses to the better-off (lightly weighted).
      *   **Leveling Down is NOT This Trade-off:** Leveling down *reduces* total welfare *without any gains to the worse-off*. It offers *no* benefit to offset the loss.

  4.  **Implication for Intergenerational Policy (e.g., Present Taxation for Distant Future):**
      *   **Scenario 1 (True Leveling Down):** Taxing the present generation solely to *destroy* those resources, benefiting *no one* (not even the distant future). **Prioritarian Verdict:** *Rejected*. No one benefits, the present is harmed.
      *   **Scenario 2 (Non-Leveling Down Trade-off):** Taxing the present (assumed better-off) to provide significant benefits to a *much worse-off* distant future generation.
          *   **Prioritarian Calculation:** Weigh the (modestly weighted) welfare *loss* to the present against the (heavily weighted) welfare *gain* to the distant future.
          *   **Possible Outcomes:**
              *   If the priority-weighted gain to the future > priority-weighted loss to the present, the policy is *good* (even if *total* welfare decreases slightly).
              *   If the priority-weighted loss to the present > priority-weighted gain to the future, the policy is *bad*.
          *   **Key Point:** This is **NOT** leveling down. The "sacrifice" of the present *directly benefits* the worse-off future. The prioritarian license hinges entirely on the *net gain in priority-weighted welfare*, not on reducing inequality per se. Inequality might decrease as a *side effect* of benefiting the worse-off, but that decrease has no independent weight.

  5.  **Addressing Your Friend's Dilemma ("Destructive Equality or Abandon Prioritarianism"):**
      *   **False Dilemma.** Prioritarianism rejects "destructive equality" (leveling down) *by definition*. It doesn't force that choice.
      *   **The Actual Choice:** In intergenerational trade-offs, the prioritarian faces a choice between:
          *   **Option A:** Maximizing Total Welfare (potentially leaving the distant future much worse off).
          *   **Option B:** Maximizing Priority-Weighted Welfare (potentially accepting a smaller total welfare if the benefits are heavily concentrated on the worst-off).
      *   **Critic's Move (Contested Interpretation):** Your friend might argue that if the distant future is *so* catastrophically worse off that *any* transfer from the present (even one slightly inefficient) yields huge priority-weighted gains, prioritarianism mandates immense present sacrifices potentially seen as "destructive" *to the present*. However:
          *   This is still **NOT** leveling down, as the future *benefits*.
          *   This *is* a demanding implication of prioritarianism, but it stems from the weighting function, not an endorsement of leveling down. It's a feature, not a bug, for prioritarians. They accept that benefiting the very worst-off can sometimes justify significant costs to the better-off, even when total welfare gain is marginal or negative.

  **Conclusion:**

  *   **Your Mistake:** Framing prioritarianism as valuing "equality" intrinsically. It doesn't. It values *absolute gains to the worse-off*, weighted by their disadvantage.
  *   **Your Friend's Mistake:** Confusing prioritarianism with egalitarianism. The LDO is a decisive objection *against* egalitarianism, not prioritarianism. Prioritarianism is explicitly designed *to avoid* endorsing leveling down.
  *   **Implication for Intergenerational Policy:** Prioritarianism evaluates policies based solely on the net change in *priority-weighted welfare*. It may endorse transferring resources from a better-off present to a much worse-off future even if total welfare decreases, *provided the priority-weighted gain outweighs the loss*. It *never* endorses harming the present *without* benefiting the future. The demandingness arises from the priority weights, not from valuing leveling down.

  **Flagged Contested Point:** Some critics argue that prioritarianism *implicitly* or *structurally* requires accepting leveling down in certain complex cases (e.g., when comparing populations of different sizes). This is a highly technical, minority argument within philosophy and is **not** the standard LDO applied to egalitarianism. The core prioritarian position, as described here, robustly rejects leveling down in principle and in standard policy applications like the one you discussed.
