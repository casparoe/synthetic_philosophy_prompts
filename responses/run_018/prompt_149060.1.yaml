answer: |-
  Here’s a structured approach to your interview, starting with concise brainstorming on the tensions, followed by precision-engineered questions:

  ### Brainstorming: Core Tensions
  1. **Voluntary Opt-in vs. Descriptive Representation**  
     *Tension*: If participation requires self-selection (opt-in), the assembly may overrepresent civically engaged demographics (e.g., retirees, educated activists), undermining claims of "mirroring" the populace. Diversity gains rely on *who actually volunteers*.  
     *Likely Reply*: "Peer review and stratified sampling correct biases."  
     *Gap*: Can peer review fix systemic underrepresentation (e.g., working parents, distrustful communities) if those groups never opt in?

  2. **Deliberative Training as Elite Filter**  
     *Tension*: Mandatory training risks socializing members into technocratic norms, privileging certain argument styles or values. This replicates the "professionalization" problem sortition aims to solve by elevating process-savvy "amateur elites."  
     *Likely Reply*: "Training ensures competence, not ideology."  
     *Gap*: If training shapes *how* issues are deliberated (e.g., cost-benefit vs. lived experience), does it covertly favor elite epistemologies?

  3. **Budget Veto vs. Zoning Insulation**  
     *Tension*: Budget power without land-use authority creates a fissure: citizens can defund projects but not alter their spatial/political embeddedness (e.g., vetoing a school budget but unable to relocate it from a contaminated site). This may incentivize symbolic clashes over structural change.  
     *Likely Reply*: "Zoning requires technical expertise; budgets reflect values."  
     *Gap*: Does insulating zoning—where corruption/inequity often arises—protect technocracy from democratic scrutiny, undermining the assembly’s legitimacy?

  ---

  ### Interview Questions  
  **I. Voluntary Participation & Descriptive Legitimacy**  
  1. *Direct*: "Your design relies on voluntary opt-in to the lottery pool. Given consistent data showing civic volunteers skew older, wealthier, and more educated, how can this assembly descriptively represent groups that systematically opt out—like young workers or marginalized communities?"  
     *Likely Reply Focus*: Stratified sampling + outreach.  
  2. *Follow-up*: "If peer review within the assembly is the safeguard against blind spots, how does it address perspectives *absent entirely* because those individuals didn’t volunteer? Isn’t this substituting the panel’s *perception* of community needs for actual inclusion?"  

  **II. Deliberative Training & Anti-Elitism**  
  3. *Direct*: "Mandatory deliberative training is meant to ensure competence. But doesn’t teaching citizens *how* to deliberate—what evidence counts, which discourse styles are privileged—replicate the very ‘filter’ sortition should avoid, by favoring those who adapt best to taught norms?"  
     *Likely Reply Focus*: Training is neutral skill-building.  
  4. *Follow-up*: "If training focuses on ‘neutral’ skills like evaluating fiscal impacts or legal constraints, does it risk sidelining moral or experiential arguments—the ‘unprofessional’ voices sortition is meant to amplify? How do you prevent training from becoming elite acculturation?"  

  **III. Asymmetrical Veto Authority**  
  5. *Direct*: "Why grant veto power over budgets but insulate zoning? Since land-use decisions (e.g., industrial permits, housing density) directly determine environmental justice and inequality, doesn’t this exclude the assembly from our most consequential distributive conflicts?"  
     *Likely Reply Focus*: Zoning requires technical expertise; budgets reflect values.  
  6. *Follow-up*: "But budgets *fund* zoning outcomes. If the assembly vetoes a road budget protesting air pollution, but can’t challenge the zoning that placed the highway in a low-income area, isn’t this a democratic half-measure that risks making them scapegoats for problems they can’t fix?"  

  **IV. Cross-Cutting Design Pressures**  
  7. "Staggered 18-month terms prevent turnover chaos—but could this create a ‘veteran class’ within the assembly whose longer exposure to training and procedure dominates newer members, reintroducing hierarchy?"  
  8. "How would this body’s veto interact with electoral politicians’ incentives? Could elected members dump fiscally toxic decisions onto the assembly, then blame them for cuts?"  
  9. "If peer review is the primary accountability mechanism, what happens when the assembly splits along persistent social cleavages (e.g., renters vs. homeowners)? Does ‘peer judgment’ risk entrenching intra-panel factionalism?"  
  10. "Ultimately, does hybrid design dilute sortition’s radical potential by conceding that ‘complex’ domains like zoning belong to elites—implicitly validating the critique that citizens lack capacity for high-stakes decisions?"

  ---

  ### Interview Strategy Notes
  - **Precision Tools**: Each question forces a *tradeoff admission* (e.g., "Doesn’t [X] sacrifice [core value Y]?") rather than allowing abstract restatements.  
  - **Public Accessibility**: Avoids academic jargon but retains conceptual rigor (e.g., "descriptive representation" clarified contextually).  
  - **Traps Avoided**: No "how did you get interested in this?"; no citation requests; no vague "what are benefits?" prompts.  
  - **Leverage Likely Replies**: Follow-ups anticipate and corner common rebuttals (e.g., peer review can’t fix absent voices).  

  This structure ensures the guest defends the proposal’s *coherence*, not just its ideals—directly serving your commission’s need for stress-tested analysis.
