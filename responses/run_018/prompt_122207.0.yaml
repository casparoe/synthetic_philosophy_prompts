  ## Sestina for the Stalled Forecaster

  Four winters now have gnawed the hopeful **plan**
  I drafted crisp as spring. This project’s **class**
  was meant to be the swift, the sharp, the *above*-**average**.
  The logic gleamed, each step uniquely **mine**,
  built strong against the odds, a true **exception**
  to histories of sludge. Why should I **defer**?

  Yet every pivot feels a blind **defer**-
  ral. Was the core assumption of the **plan**
  fatally flawed? Or am I the **exception**,
  a victim of that cursed, unhelpful **class**:
  "Projects Complex, Novel, Mostly **Mine**"?
  Its mean duration mocks my **average**.

  The sober counsel: trust the **average**.
  Resist the siren call, just **defer**
  to numbers. What’s uniquely **mine**,
  they warn, is bias clinging to the **plan**,
  a story spun inside my **class**-
  less bubble. Deny the **exception**.

  But *is* this case the **exception**?
  The data’s blunt, a crude **average**
  drawn from a distant, motley **class**.
  Can simple numbers mean I must **defer**
  my grasp of why the first **plan**
  stalled? The *reasons* feel like **mine**!

  This nagging doubt: What’s truly **mine**?
  My judgement’s track record – **exception**
  ally good? Or prone to flawed **plan**-
  ning? *This* assessment needs its **average**
  success rate too... a dizzying **defer**-
  ral of the choice: which **class**

  best fits the judge, not just the **class**
  of task? The meta-fog is **mine**
  alone to breathe. How can I **defer**
  *this* call? There *is* no clean **exception**
  from the self, no neutral **average**
  for the chooser of the **plan**.

  What **class** exists when every **mine**-
  field path feels like the **exception**,
  forcing endless **defer**ral? No **average** fits the **plan**.

  **Tornada**
  The **class** I choose dictates the **average** I must see,
  Yet choosing it feels solely **mine**, no place to **defer**.
  Is my stalled work the rule, or **plan**'s **exception**?

  ---

  **Annotations (For the Literature-Aware):**

  1.  **Stanza 1:** The compelling **Inside View Causal Narrative**. The speaker outlines their unique, logically sound plan ("gleamed," "built strong"), positioning themselves as the exception justifying initial optimism.
  2.  **Stanza 2:** **Deference to the Base Rate as Prescribed**. The speaker presents the standard outside-view advice: suppress the inside view ("siren call," "bias") and defer to the base rate derived from the chosen reference class.
  3.  **Stanza 3:** **The Problem of Choosing the Reference Class**. The speaker questions *which* reference class ("distant, motley class") is truly appropriate, highlighting that this choice is a judgement call itself. The uniqueness ("reasons... mine") challenges blind deference.
  4.  **Stanza 4:** **Deference as a Potential Place to Hide**. The speaker recognizes the temptation to use the outside view ("simple numbers") as a shield ("defer / my grasp") from confronting the specific, potentially uncomfortable reasons ("why the first plan stalled") revealed by the inside view.
  5.  **Stanza 5:** **The Regress of Assessing One's Own Reliability**. To decide *whether* to defer, the speaker needs an inside view of their own forecasting skill ("My judgement’s track record"). This creates a regress ("meta-fog," "dizzying deferral") as they need a reference class for *themselves*.
  6.  **Stanza 6:** **The Existential Problem of No Decent Reference Class.** The speaker confronts the paralyzing uncertainty when the case feels genuinely unique ("every minefield path feels like the exception") and no existing reference class ("What class exists?") provides a clear anchor, making "deferral" feel endless.
  7.  **Tornada:** Summarizes the core tension: The choice of reference class ("The class I choose") dictates the statistical perspective ("average"), but *making that choice* ("feels solely mine") cannot be outsourced to statistics itself ("no place to defer"). The final line ("rule, or plan's exception") explicitly leaves the fundamental question unresolved.
