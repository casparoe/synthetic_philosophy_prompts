prompt: |-
  hey so im in a philosophy of action seminar and next week i have to run a 40 minute study group session on the wrong kind of reasons problem, but specifically the epistemic version where the issue is bribery to believe something like a climate report is accurate — not the usual moral motivation case we already did. dont explain the concept to me, just plan the teaching arc. what dependency has to be in place first so they see why its not just being irrational, then pick one concrete exampel to carry the whole session and say why the sick-friend case wont work here, then map the misconceptions theyll form — probably mixing up wrong-kind reasons with weak reasons or with being unmotivated — and exactly where in the sequance to head each one off. also give me one end-of-session question to check they actually grasped the distinction and not just the vibe, and tell me what part is too deep for a study group and should be left out with an explicit disclaimer. please reply in continuous prose only, no headings or bullet points or bold text, like youre writing me an email.
reasoning: |-
  Okay, the user is in a philosophy of action seminar and needs to run a 40-minute study group session on the epistemic version of the wrong kind of reasons (WKR) problem. They specifically want to focus on the bribery case for believing something like a climate report, not the moral motivation case they've already covered. They don't need the concept explained; instead, they want a teaching plan that ensures participants understand why it's not just irrationality, a concrete example to carry the session, why the sick-friend case won't work, misconceptions to anticipate, an end-of-session question, and what to exclude.

  First, I need to recall the epistemic WKR problem. In the standard case, like the bribery example, someone is offered money to believe a proposition, say, that a climate report is accurate. The issue is that the bribe is a reason to want to have the belief, not a reason that bears on the truth of the belief itself. Participants might confuse this with other issues like weak evidence or lack of motivation.

  The user mentioned that the sick-friend case (probably the original case where someone has a reason to desire a belief, like believing a friend isn't sick to avoid distress) isn't suitable here. That's because the sick-friend case is often used in the context of pragmatic reasons for belief, but it's more about moral or emotional motivations. The climate bribery case is purely epistemic and involves a direct incentive, making it clearer that the reason isn't truth-related. So I should emphasize why that case doesn't fit here.

  For the teaching arc, the dependency is ensuring participants grasp the distinction between reasons for the desirability of a belief (practical) versus reasons that bear on the truth (epistemic). Without this, they might think rejecting the bribe is just irrational. So start by establishing that beliefs are truth-directed. Use the climate bribery case as the central example: a billionaire offers money to believe the climate report is accurate. Highlight that the bribe doesn't make the report true; it's an incentive to induce the belief regardless of truth.

  Misconceptions to anticipate: 
  1. Confusing WKR with weak reasons - thinking the bribe is a weak epistemic reason. Need to clarify that it's not an epistemic reason at all. 
  2. Mixing with being unmotivated - assuming the person just lacks motivation to believe, but the issue is the kind of reason, not strength. 
  3. Equating with irrationality - thinking it's about ignoring reasons, but here, it's about the wrong kind of reasons. 

  To head these off, sequence the session: 
  First, reinforce the belief's aim at truth. Then introduce the bribery case. Ask why the money isn't a reason to believe. Preempt the weak reasons confusion by emphasizing that even a strong bribe doesn't count. Later, when discussing why the person can't form the belief for money, clarify it's not about motivation but about the type of reason. 

  End-of-session question: Ask what kind of reason the bribe provides (practical) and why it doesn't support the belief's truth. Or present a scenario where a scientist is paid to endorse a report and ask if that payment is an epistemic reason.

  What to exclude: Delving into the "state-given" vs. "object-given" reasons distinction or constitutive norms might be too deep. Mention that those are complex theories and focus on the basic distinction for this session.

  Also, the user wants continuous prose without headings, so structure the response as an email, addressing each point fluidly. Make sure to mention why the sick-friend case isn't suitable—it's tied to emotional/moral reasons, which might muddy the epistemic focus needed here.
answer: |-
  Hey, sounds like a solid plan to tackle the epistemic WKR variant—much sharper than defaulting to the sick-friend case, which I agree won’t cut it here because its emotional stakes risk blurring the purely epistemic failure. That case smuggles in a layer of psychological conflict about *why* believing falsely feels bad (e.g., self-deception, moral unease), whereas the climate bribery example isolates the structural flaw: the bribe operates entirely outside the space of truth-tracking. Start by locking down the dependency: beliefs aim at truth. Drill this hard for 5 minutes. Ask them to articulate why it’s incoherent to say, "I believe P, but P isn’t true"—not as a linguistic point, but to expose that *belief as an attitude* is constitutively truth-committed. Without this anchor, they’ll misdiagnose WKR as mere practical irrationality ("Why turn down free money?").  

  Carry the session with the billionaire bribery scenario: "A billionaire offers you £1 million to believe—not say, not pretend—that the latest IPCC report is accurate. You lack expertise; the money is contingent solely on forming the belief itself." Use this single example iteratively. When they protest, "But I *can’t* believe it just for money!" press: *Why* not? Trap them into admitting it’s not about willpower—it’s that cash gives zero traction for belief-formation. Contrast with weak evidence (e.g., a sketchy blog post supporting the report): that’s a *bad epistemic reason*, but still the *right kind*. The bribe is metaphysically inert for belief.  

  Anticipate three misconceptions, and derail them mid-flow. First, mid-discussion when someone says, "The bribe is just a *really weak* reason to think the report’s true," intervene: "Hold up—weak for *what*? Could £1 million ever make the report 0.0001% more probable? No? Then it’s not weak evidence; it’s *non*-evidence." Second, when they muse, "Maybe you’re not motivated enough to believe," pivot back to truth-aim: "Motivation misfires here. Belief isn’t chosen; it’s compelled by apparent truth. Can you ‘try harder’ to believe the moon is cheese for £10 billion?" Third, early on, if they frame it as "irrational to ignore the money," re-anchor to constitutive aim: "Is it *epistemically* irrational, like ignoring evidence? Or is the money irrelevant to belief’s ‘job’?"  

  End with a diagnostic question: "Imagine two scientists. Scientist A is offered a bribe to endorse a flawed study; Scientist B receives anonymous threatening emails demanding she endorse a sound study. Both feel pressured, but only one faces a WKR problem. Which, and why?" If they spot that threats to Scientist B are practical pressures against *expressing* belief (not reasons *for* belief itself), they’ve got it.  

  Skip the "state-given"/"object-given" jargon entirely—explicitly disclaim it as framework baggage that’s generative but not needed here. Also avoid constitutive norm debates (e.g., "Is truth really belief’s essential aim?"). That’s seminar-deep; here, stipulate the aim as a fixed point to make WKR visible. You’ve got this—keep it concrete and keep dragging them back to why the bribe *cannot* function in belief-space.  

  Cheers,  
  *A fellow overthinker of action*
