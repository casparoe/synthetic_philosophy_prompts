answer: |-
  Here’s a breakdown of the reductionist and anti-reductionist views, centered on the carpenter apprentice struggling to *feel* the plane’s tension:

  **The Scene:**  
  The master carpenter demonstrates planing a rough board. She verbalizes rules: "Keep the plane flat," "Start with firm pressure, ease off at the end," "Listen for the whisper of the blade." The apprentice tries but gouges the wood or skitters uselessly. The master sees the tension is wrong—too stiff, too uneven. Words fail. She steps behind the apprentice, places her hands over his on the plane, and guides him through the cut, physically modulating the pressure, rhythm, and angle. "Feel that?" she asks. "That glide? That’s it." The apprentice, under her direct guidance, experiences the correct sensation for the first time.

  **The Reductionist Explanation:**  
  The reductionist argues the master’s expertise *is* still grounded in "knowing-that." Her inability to articulate the precise pressure curve doesn’t mean it’s absent. Instead, she possesses a vast, unconscious library of sensorimotor propositions:
  *   "If the vibration feels like *this*, increase downward pressure slightly."
  *   "If the sound pitch reaches *that*, angle the toe up 2 degrees."
  *   "When muscle tension in the forearm reaches threshold X, relax grip by Y%."

  When she guides the apprentice’s hands, she is *enacting* these rules through feedback loops. Her nervous system compares the apprentice’s current input (vibration, sound, resistance) against her stored database of "correct" sensory states associated with successful planing. Her physical adjustments unconsciously apply the corrective propositions the apprentice hasn’t learned yet. The apprentice’s eventual success comes from his nervous system implicitly *learning these same propositions* through repeated guided practice. The "feel" he masters is his brain correlating muscle states and sensory feedback with the outcomes ("smooth cut," "no chatter") – building his own set of unconscious "knowing-that" rules. His breakthrough isn't non-propositional; it's the moment his implicit factual knowledge (sensory input X + motor output Y = desired result Z) becomes reliable enough to guide action without conscious thought.

  **The Anti-Reductionist Explanation:**  
  The anti-reductionist argues the "feel" is fundamentally non-propositional. While rules like "ease pressure at the end" are helpful scaffolding, the core mastery is a direct, embodied *attunement* to the interaction between tool, material, and body. This attunement:
  1.  **Is Holistic:** It integrates countless sensory streams (vibration, sound, weight distribution, grain resistance, muscle tension, even humidity’s effect on the wood) into a single, non-decomposable gestalt – the "correct tension."
  2.  **Is Non-Representational:** The master doesn't consult an internal list of facts. She *resonates* with the task. The correct feel isn't processed; it's *inhabited*. Her nervous system and the tool/wood system achieve a kind of coupling.
  3.  **Escapes Articulation:** The failure of words isn't just practical; it's ontological. You cannot fully capture the qualitative, dynamic experience of that attunement in true/false statements. "Glide" points to it but doesn't define it.

  When the master guides the apprentice's hands, she isn't transmitting hidden facts. She is enabling the apprentice to *directly experience the attunement itself*, bypassing the need for propositional translation. She's calibrating his proprioception and sensory awareness to the *phenomenology* of correct planing. The apprentice’s eventual success isn't primarily about accumulating more hidden "knowing-that." It's about developing this same direct, embodied responsiveness – a skill-based "grip" on the world. His learning is perceptual and motor refinement, a reshaping of his capacities for interaction, not just the accretion of unconscious facts. He learns *to perceive and respond* correctly, not (just) *that* specific inputs require specific outputs.

  **The Comparison at the Breakdown Point:**

  *   **Reductionist on the Master's Expertise:** The reductionist *must* posit hidden propositions, even if unconscious and sensorimotor. The master’s physical guidance is the enactment of these rules via feedback control. Her "feel" *is* the reliable operation of this complex propositional database governing her motor control and sensory interpretation. Her inability to articulate is merely a limitation of access or language for highly complex, embodied data.
  *   **Anti-Reductionist on the Apprentice's Success:** The anti-reductionist argues the apprentice gains a *new mode of access* to the task. While he certainly learns *some* propositions ("this sound is bad"), his core competence is the development of a practical, non-propositional *ability* – the attunement. His body learns "how to be" in relation to the plane and wood. This ability *enables* him to act effectively without necessarily relying on (or possessing) a complete internal rulebook describing every micro-adjustment. His success is the manifestation of the skill itself, not the manifestation of exhaustive factual knowledge.

  **Conclusion:**  
  The carpentry scene highlights the core tension. The reductionist sees the physical guidance as transferring complex, implicit *information* (propositions) through demonstration and feedback. The master's "feel" is her brain running this program flawlessly. The apprentice learns by internalizing the same program. The anti-reductionist sees the guidance as facilitating a direct *encounter* with the qualitative state of correct performance. The master's "feel" is her embodied engagement with the task. The apprentice learns by developing his own capacity for that same engaged, attuned responsiveness – a fundamental "knowing-how" irreducible to knowing facts. The reductionist explains expertise as hidden complexity; the anti-reductionist explains it as a unique kind of direct, practical understanding.
