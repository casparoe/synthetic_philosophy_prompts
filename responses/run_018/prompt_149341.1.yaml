prompt: |-
  You're acting as a philosopher of negotiation and value conflict, so please think step-by-step and maybe start by brainstorming the hidden rules before you lock in. I'm in a course on moral compromise and trying to reverse-engineer my professor's framework from her rulings. So far she's said: one, when an indigenous reef-collective that treats a coastal reef as an ancestral being (not a resource) clashes with a biotech firm that wants to harvest marine compounds, she rules no deal is possible — treating the reef as partly-tradable violates its status. Two, when two neighborhoods fight over a public square (religious displays vs strict secularism), she approves splitting the square seasonally with shared maintenance costs — classic gains-from-trade. Three, when a pacifist teaching hospital refuses to train military surgeons and a defense ministry demands it, she allows institutional separation: the hospital stays pure but doesn't block graduates from serving elsewhere. Four, when two language communities clash over official documents, she mandates full bilingualism with shared translation costs.

  Next week she has to rule on this: a climate-justice coalition frames fossil-fuel extraction as an active, non-negotiable harm to future generations, while a mining-town union frames extraction jobs as constitutive of community identity and dignity. The proposed compromise is a ten-year phasedown with guaranteed retraining, income support, and limited continued extraction during transition — essentially trading continued harm for economic security. Predict her verdict, lay out the two or three implicit principles that fit her first four rulings equally well, say exactly which ones diverge on this climate/union case and why, and tell me which further hypothetical case would actually settle the difference between those rules. If you think she's being consistent with one principle, name the closest analog from her track record and state the principle she'd be locking in either way. Don't just name-drop philosophers; I want the reasoning mapped onto the cases. Also I have a typo in my notes — I wrote "pacifist medical school" for case three but meant "pacifist teaching hospital" — flag it if that changes anything, but I doubt it does.
reasoning: |-
  Okay, the user is in a moral compromise course and trying to reverse-engineer their professor's framework from past rulings. They've presented four cases with outcomes and a fifth upcoming case about climate justice vs. mining unions. I need to predict the verdict on the new case, identify underlying principles, and suggest a hypothetical to test divergence.

  First, I should examine the patterns in the professor's rulings. Case 1 (indigenous reef vs. biotech) resulted in no deal because treating the reef as tradable violated its sacred status. Case 2 (public square dispute) allowed seasonal splitting with shared costs - a classic compromise. Case 3 (pacifist hospital vs. military) permitted institutional separation where the hospital stays pure but graduates can serve elsewhere. Case 4 (language communities) mandated full bilingualism with shared costs. 

  Hmm, there seems to be a clear distinction here. When core identity or sacred values are at stake (like the reef as ancestral being), no compromise is possible. But when pragmatic concerns are involved (space usage, career paths, translation), compromise solutions are approved. The institutional separation in Case 3 is interesting - it preserves the hospital's pacifist identity while allowing individual choice.

  For the climate/union case, both sides frame their positions as non-negotiable: the coalition sees extraction as active harm to future generations, while the union views jobs as constitutive of community identity and dignity. The proposed ten-year phasedown tries to balance harm with economic security. 

  I suspect the professor will reject this compromise because both parties' positions seem to involve non-tradable values. The climate group frames harm as non-negotiable (similar to the reef's sacred status), and the union frames jobs as identity-constitutive (like the hospital's pacifist identity). The phasedown essentially commodifies both values - continued harm for economic security - which violates the "no commodification of sacred goods" principle from Case 1.

  The closest analogy is actually Case 3's institutional separation - but that solution doesn't work here because extraction inherently causes the harm the coalition opposes. The principles in tension are: 1) Sacred/non-tradable values prohibit commodification, and 2) Practical conflicts allow gains-from-trade. Here, both claims lean sacred, so no trade should be allowed.

  To test this, I'd propose a hypothetical where one side's sacred claim is disputed: Suppose a mining town considers their mine spiritually sacred (not just economic), versus climate activists. If the professor still rejects compromise, it confirms the "framing determines sacred status" principle. If she allows deal-making, it means economic dignity is treated as pragmatic despite the union's framing.
answer: |-
  Based on reverse-engineering your professor's framework from her first four rulings and applying it to the climate/union case, here's the step-by-step analysis:

  **Predicted Verdict:**  
  **She will reject the proposed phasedown compromise.** The deal violates her implicit principle against commodifying sacred/non-negotiable goods, similar to Case 1 (reef) and Case 3 (hospital purity). Both sides frame their positions as *constitutive of identity/morality* rather than mere preferences.

  ---

  ### **Implicit Principles from First Four Rulings**
  1.  **Non-Commodification Principle (NCP):** *When core identity, sacred values, or fundamental moral agency are framed as non-negotiable ("constitutive"), they cannot be traded.*  
      - **Case 1:** Reef as ancestral being (not resource) → **No deal** (commodification violates status).  
      - **Case 3:** Hospital's pacifist institutional identity → **Allowed separation** (avoids forcing hospital to *directly* trade its values; *typo noted, but "teaching hospital" doesn't change principle*).  

  2.  **Practical Coexistence Principle (PCP):** *Conflicts over *pragmatic* resources or procedures can be resolved through gains-from-trade or burden-sharing.*  
      - **Case 2:** Public square usage → **Seasonal split + shared costs** (space/time are divisible goods).  
      - **Case 4:** Official documents → **Full bilingualism + shared costs** (translation is procedural, not identity-erasure).  

  3.  **Agency Preservation Corollary (APC):** *Compromises must preserve parties' moral agency when values are constitutive.*  
      - **Case 3:** Hospital isn't forced to *act* against pacifism; individuals choose post-graduation.  
      - **Case 1:** Reef collective retains agency to reject instrumentalization.  

  ---

  ### **Why the Climate/Union Case Diverges**
  - **Climate Coalition:** Frames extraction as *active, non-negotiable harm* (moral imperative akin to **Case 1's sacred reef**). Trading "continued harm" violates NCP.  
  - **Mining Union:** Frames jobs as *constitutive of identity/dignity* (not just income). Phasedown commodifies this identity (jobs as "tradable" for retraining) → violates NCP/APC.  
  - **Failed Analogies:**  
    - *Not like Case 2/4*: Not about dividing space/costs; both sides reject "partial harm" or "partial identity."  
    - *Not like Case 3*: No clean separation (extraction *is* the harm; jobs *require* extraction).  

  **Key Divergence:** The proposed deal treats *both* claims as tradable interests (harm vs. jobs). But the professor’s framework treats *constitutive framing* as decisive, blocking trade.  

  ---

  ### **Hypothetical Case to Settle the Diverging Rule**
  **Scenario:**  
  *A tribe considers a mountain spiritually sacred (non-negotiable entity). A renewable energy firm needs to quarry it for zero-carbon materials. The tribe rejects ANY physical disturbance. The firm offers compensation, cultural mitigation, and scaled-down quarrying.*  

  **Why This Tests the Principle:**  
  - If the professor **rejects** the deal, she consistently applies **NCP** (sacredness blocks trade regardless of broader stakes).  
  - If she **approves** a mitigated compromise, she prioritizes **consequentialism** (e.g., climate emergency overrides framing) — contradicting her reef ruling.  

  **Closest Analog:** **Case 1 (reef)**. A consistent ruling here (no deal) confirms that *framing as sacred/constitutive* is the determining factor, not the stakes.  

  ---

  ### **Conclusion**
  Your professor's framework treats **how parties frame their claims** as ontologically significant. If they invoke constitutive/sacred terms (reef-as-ancestor, extraction-as-harm, jobs-as-dignity), she prohibits direct trade-offs. The climate/union case fails because both sides use this framing — making the phasedown an illegitimate commodification under her principles. Her consistency hinges on respecting the *language of incommensurability*.  

  *Key philosopher lurking here:* Elizabeth Anderson (on incommensurable values and commodification), but as requested, mapped to cases, not named.*
