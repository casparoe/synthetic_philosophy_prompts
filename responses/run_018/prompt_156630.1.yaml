prompt: |-
  ok so im a software engineer with basically no philosophy background, but im trying to wrap my head around collective memory vs actual history. heres the scenario: after the berlin wall came down in 89, a lot of east germans started remembering the gdr as this warm, safe community with low crime, even though the stasi archives clearly document massive informant networks and everyday surveillance. i want you to run this through a lens im calling "mnemonic solidarity" - the idea that a group keeps a cozy collective memory alive mainly to protect social bonds, not because they think its literally true. so analyze the case: what does collective-memory theory say the east german community should do when the archives contradict their nostalgia? does the solidarity they get from the memory count as a real reason to resist the record, or should history just steamroll it? then flip it: what does this specific clash show about the theory itself - does it reveal that collective memory was never about accuracy but about social function, or does it break the theory because the welfare of the group is tied to the false memory? be sharp about the mapping - who are the actors, what are the options, where does the theory stay silent - and dont just split the difference.
