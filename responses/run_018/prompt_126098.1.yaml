  I'm writing a feature on why epistemologists still can't agree whether you really *know* your car started this morning without already knowing the dashboard isn't lying. There's the classic gas-gauge loop — read the gauge, infer it's reliable, then use that reliability to justify the original reading — plus the broader bootstrapping worry where basic beliefs pull themselves up by thier own bootstraps. I want the full spec for what a decent theory of basic epistemic entitlement must actually deliver, not another opinion piece.

  Write the desiderata: what any account of non-circular basic knowledge has to get right. The cases — the gauge loop, knowing your own hand is there without prior proof that vision works, and a table-legs scenario where you check one leg and try to bootstrap the rest of the table's stability. The distinctions it can't collapse: first-order justification vs meta-justification (being justified vs being justified in thinking you're justified), diachronic learning vs synchronic entitlement, and reliability as a causal mechanism vs reliability as a reason you can actually cite. Flag which pairs look jointly unsatisfiable — e.g., full transparency of grounds plus zero circularity — and say which ones are non-negotiable vs camp preferences.

  Also: which single desideratum kills reliabilism, which kills dogmatism, and which makes coherentism impossible? Just the knockout blow for each, no full scorecard. Keep it under 350 words, bullet points are fine. No bibliography — my editor hates citation dumps and I'm on deadline. Don't ask me to recieve quotes from actual papers; work from what you know.
