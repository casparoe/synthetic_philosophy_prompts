answer: |-
  Here's the essential desiderata for a viable theory of basic epistemic entitlement, distilled to core requirements and conflicts:

  ### Core Desiderata (Non-Negotiable)
  1.  **Non-Circular Justification:** Must avoid bootstrapping (gas-gauge loop) and question-begging. Basic entitlement *cannot* presuppose the reliability it's meant to establish.
  2.  **Grounding Basic Beliefs:** Must explain how genuinely *basic* beliefs (e.g., "I see my hand") get initial, non-inferential warrant without prior justification for the faculty (vision) or instrument (gauge).
  3.  **Distinction Preservation:**
      *   **First-order vs. Meta-justification:** Must distinguish being justified in believing P (e.g., "gas is low") from needing justification for believing the *source* is reliable (e.g., the gauge).
      *   **Diachronic Learning vs. Synchronic Entitlement:** Must explain both initial warrant *now* (synchronic, e.g., trusting vision upon waking) and how we *learn* reliability over time (diachronic, e.g., calibrating a gauge).
      *   **Reliability-as-Cause vs. Reliability-as-Reason:** Must avoid conflating a reliable causal process *producing* a true belief (e.g., vision working) with having a *citable reason* justifying that belief (which requires independent access to reliability).
  4.  **Handles Problem Cases:** Must coherently resolve:
      *   Gas-Gauge Loop (bootstrapping)
      *   Basic Perceptual Belief (hand/vision)
      *   Table-Legs Scenario (inferring stability of whole table from checking one leg - bootstrapping structure)

  ### Key Conflicts (Often Jointly Unsatisfiable)
  *   **Full Transparency + Zero Circularity:** Requiring conscious access to *all* grounds for justification (transparency) makes basic entitlement impossible without circularity/bootstrapping. *(Transparency often negotiable; zero circularity is not).*
  *   **Strict Internalism + Basic External Grounding:** Demanding all justifiers be internally accessible conflicts with grounding basic beliefs in external, non-internalized relations (e.g., perception). *(Internalism/Externalism is a major camp divide).*

  ### Knockout Blows
  *   **Kills Reliabilism:** **Reliability-as-Reason.** Reliabilism cannot convert reliable causation into a *citable reason* the agent possesses without bootstrapping or abandoning its core externalism.
  *   **Kills Dogmatism (Pryor-style):** **Bootstrapping (Gas-Gauge Loop).** Dogmatism's claim that perceptual beliefs are immediately justified licenses bootstrapping, allowing clearly irrational inferences.
  *   **Kills Coherentism:** **Fresh Start / Basic Belief.** Coherentism cannot ground justification without prior justified beliefs, failing the "fresh start" required for genuinely basic entitlement (hand, initial gauge reading).

