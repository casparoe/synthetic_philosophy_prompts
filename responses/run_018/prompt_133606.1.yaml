answer: |-
  ### Exam Question  
  **Time Allowed:** 75 minutes  
  **Word Limit:** 900–1,100 words  

  > **Critically evaluate whether Lexical Threshold Negative Utilitarianism (LTNU) can resolve the following policy dilemma without abandoning its core commitments:**  
  > *Policy A* eliminates severe physical pain for 10,000 people but leaves them in profound, non-painful existential alienation (e.g., meaningless labor, social fragmentation). *Policy B* provides intense aesthetic fulfillment and deep communal bonds to 1,000 people but leaves their moderate physical discomfort (e.g., chronic back pain, mild arthritis) unaddressed.  
  >   
  > Your analysis **must**:  
  > (a) Explain how LTNU’s lexical threshold (absolute priority to reducing suffering below a critical level) faces a dilemma when confronting qualitatively distinct negative states;  
  > (b) Assess whether LTNU can choose between A and B *without* either (i) covertly reducing incommensurable suffering types (physical agony, existential despair) to a common metric, or (ii) fragmenting into mode-specific thresholds (e.g., separate "pain-thresholds" for physical vs. existential suffering) that nullify its anti-aggregationist character.  
  > Avoid rehearsing textbook objections; focus exclusively on this tension.  

  ---

  ### Model Answer (700 words)  
  **LTNU cannot adjudicate between Policy A and Policy B without either collapsing suffering into a monolithic metric or forfeiting its foundational absolutism, exposing an irreconcilable conflict between lexical priority and qualitative incommensurability.**  

  Policy A’s elimination of severe physical pain appears to satisfy LTNU’s core imperative: reducing suffering below the lexical threshold. Yet the persistence of profound existential alienation—a non-physical state of despair LTNU deems "below threshold"—creates ambiguity. If existential alienation is *qualitatively distinct* from physical pain, LTNU cannot categorically prioritize Policy A without implicitly treating both as manifestations of a single, homogenized "suffering" variable. This covert homogenization contradicts LTNU’s explicit rejection of hedonistic calculus, which assumes all valenced states are commensurable. To endorse Policy A, LTNU must either:  
  - Illicitly conflate physical pain and existential dread under a unified metric (e.g., "intensity-weighted disutility"), which smuggles in the aggregative framework it opposes; or  
  - Arbitrarily declare physical pain "lexically worse" than alienation—a move that abandons threshold universalism for ad hoc hierarchy.  

  Policy B amplifies this dilemma. Providing aesthetic/social fulfillment to fewer people does not reduce *any* suffering below LTNU’s threshold, as moderate physical discomfort is typically deemed "above threshold." However, if existential alienation (left unaddressed in Policy A) is *worse* than moderate physical pain (left unaddressed in Policy B), Policy B’s benefits become morally irrelevant. LTNU could only prefer Policy B by:  
  - Equating existential alienation with "threshold-level suffering," retroactively redefining the threshold to encompass non-physical states—but this demands cross-modal comparison, again requiring homogenization; or  
  - Fragmenting the lexical threshold into discrete categories (e.g., "physical threshold," "existential threshold"), each with absolute priority over pleasure within its domain.  

  This disjunctive-threshold reformulation fatally undermines LTNU. If distinct suffering types each have independent lexical thresholds, LTNU loses its ability to make *global* priority claims. A policy reducing physical pain below *its* threshold could be lexically overruled by another reducing existential dread below *its* threshold—even if the former alleviates vastly more suffering. Worse, when policies affect multiple suffering types (e.g., alleviating physical pain while exacerbating alienation), LTNU offers no procedure to resolve conflicts between its disjunctive thresholds without aggregating them. Thus, fragmentation dissolves LTNU’s distinctive absolutism into a fractured quasi-aggregationism.  

  Ultimately, LTNU’s threshold presupposes suffering’s quantitative scalability across modes—a monist assumption its anti-hedonist ethos denies. Without this hidden monism, "the lexical threshold" lacks coherence; with it, LTNU becomes hedonism in lexical clothing.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **Must-Hit Analytical Moves:**  
  1. **Identify commensurability tension in Policy A/B** (5 points)  
     *Fail:* Merely describes policies without linking to suffering’s qualitative diversity.  
  2. **Explain why Policy A requires homogenization** (6 points)  
     *Fail:* Assumes physical pain’s priority is self-evident; ignores existential alienation.  
  3. **Show Policy B exposes threshold fragmentation risk** (6 points)  
     *Fail:* Claims Policy B is irrelevant without analyzing disjunctive thresholds.  
  4. **Diagnose disjunctive thresholds nullify absolutism** (5 points)  
     *Fail:* Proposes mode-specific thresholds without critiquing their anti-aggregationist collapse.  
  5. **Conclude hidden monism undermines LTNU’s foundations** (3 points)  
     *Fail:* Stops at "LTNU fails" without exposing the presupposed commensurability.  

  **Grading Standard:**  
  - **A (21–25 pts):** Addresses *all five* moves. Explicitly critiques disjunctive thresholds’ failure to preserve absolutism and identifies LTNU’s reliance on monism.  
  - **B (16–20 pts):** Summarizes LTNU and mentions incommensurability but misses monism/fragmentation analysis (e.g., only discusses Policy A).  
  - **C (10–15 pts):** Defines LTNU/objections generically; superficial policy comparison.  
  - **D/F (<10 pts):** Misstates LTNU or policies; ignores commensurability.  

  **Coherence/Clarity Penalty:** –2 pts if structure obscures logic.
