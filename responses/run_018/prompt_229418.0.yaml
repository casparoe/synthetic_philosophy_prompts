prompt: |-
  so ive been going down a rabbit hole about whether imagining something means it could actually be real. i was reading David Hume's Treatise of Human Nature, book 1 part 2 section 6, and i hit this:

  "Whatever we conceive, we conceive to be existent. Any idea we please to form is the idea of a being; and the idea of a being is any idea we please to form."

  im not trained in philosophy so sorry if this is a basic misreading. doesnt this mean that if i can form an idea of something, like a unicorn, then it must be possible for it to exist? because forming the idea and forming it as existing are the same thing. but then what about impossible things, like a square circle — can i form an idea of it? if i cant, how do i know what those words point to? and if i can, then Hume seems to say its possible, which sounds wrong. also i can definately imagine a world without my car, so it seems false that i always conceive things as existing. can someone unpack what he actually means here and whether conceivability is actually a good guide to possibility?
