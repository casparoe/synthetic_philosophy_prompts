  ## Impartial Calculus

  Without a thought I plunge into the stream,
  The cold shock hits my chest, my breath is gone.
  I see the small head vanish in the foam,
  My legs drive hard against the current’s pull.
  My fingers grasp at fabric, flailing limb,
  I haul the choking weight back through the grey.
  We stagger out, the child and I, both drenched,
  Relief is wordless in the sodden air.

  Without a thought I plunge into the stream,
