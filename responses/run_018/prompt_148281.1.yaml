  **Structural Rationale:** The near-identical repetition underscores the *same action* occurring. The stark interpolation of lines 13 & 14 (the utilitarian calculus, presented as two lines for rhythmic impact within the pentameter) acts as a cognitive fracture precisely where the physical effort peaks ("My legs drive hard..."). This forces the reader to experience the original, unmediated commitment being *interrupted* and reframed by an alien perspective – literally enacting the 'thought too many'. The direct action continues verbatim afterward, but its innocence is irrevocably shadowed by the intrusion. The unresolved tension lies in the identical final lines: the action *was* completed, the relief *is* felt, yet the justification (or lack thereof) now hangs heavily over it, mirroring Williams's point about the corrosive effect of such demanded impartiality on personal integrity and the nature of the commitment itself. The utilitarian thought isn't argued against; its mere existence as a *required* consideration becomes the problem.
