answer: |-
  That's an exceptionally sharp observation – you've pinpointed a pervasive and intellectually troubling pattern in complex policy debates, especially around climate and finance. Keynes's distinction between measurable "risk" and true "uncertainty" (or "radical uncertainty") is indeed central. He argued that for many future events, especially unique, complex, or long-term ones, we lack the stable, knowable frequency distributions needed to assign meaningful numerical probabilities. Probabilities become ordinal rankings ("more likely than," "less likely than") or even qualitative judgments ("possible, plausible, probable"). Crucially, he noted that under *true uncertainty*, more ambiguous evidence might *increase* our sense of ignorance rather than reduce it ("weight of argument" concept).

  The pattern you describe – **using radical uncertainty as a rhetorical shield for one's own preferred models while wielding it as a weapon against opponents' models** – doesn't have a single universally accepted name, but several established concepts capture its essence. The most fitting term, combining precision and descriptiveness, is:

  **Epistemic Asymmetry (specifically: Strategic Epistemic Asymmetry)**

  Here's a breakdown of the term, its mechanisms, and distinctions:

  1.  **The Core Mechanism ("The Toggle"):**
      *   **Weaponization:** Invokes radical uncertainty ("We can't quantify ecosystem tipping points!") to dismiss an opponent's quantitative model (e.g., a cost-benefit analysis suggesting modest climate policy costs).
      *   **Shielding:** Simultaneously relies on quantitative or pseudo-quantitative models ("Optimal carbon tax = $X/ton based on integrated assessment models") to support one's own preferred policy. If the model fails ("Why was your damage projection wrong?"), the failure is blamed *entirely* on the inherent, insurmountable uncertainty ("The system was too complex/non-linear/novel for *any* model!"), protecting the *validity of the modeler's approach and assumptions*.

  2.  **Why "Epistemic Asymmetry"?**
      *   **Epistemic:** Relates to knowledge, justification, and the grounds for belief.
      *   **Asymmetry:** Applies fundamentally different standards (epistemic rules) depending on whose model is being evaluated. The rules for *others* are strict: "Quantification impossible here!" The rules for *oneself* are lenient: "Quantification is imperfect but necessary/defensible/best available."

  3.  **Strategic:** This highlights the *motivated* and often *instrumental* nature. The asymmetry isn't usually a sincere philosophical stance consistently applied; it's deployed strategically to win an argument or advance a policy agenda.

  **How it Differs:**

  *   **From Plain Hypocrisy:**
      *   **Hypocrisy** is a broader moral failing: saying one thing and doing another (e.g., "Fossil fuels are evil!" while flying private jets).
      *   **Epistemic Asymmetry** is a *specific intellectual maneuver* concerning the justification of knowledge claims and models. It exploits the *philosophical legitimacy* of radical uncertainty selectively. A hypocrite might use bad math knowingly; an epistemic asymeter uses a *philosophical argument about the limits of math* inconsistently. It's hypocrisy applied to the *rules of evidence and modeling*.
  *   **From Motivated Reasoning:**
      *   **Motivated Reasoning** is the broader psychological tendency to process information in a way that favors desired conclusions (e.g., cherry-picking data, downplaying counter-evidence).
      *   **Epistemic Asymmetry** is a *specific tactic within* motivated reasoning. It doesn't just favor evidence; it *selectively applies an entire epistemological framework* (the validity/invalidity of quantification under uncertainty) as the tool to achieve the motivated end. It weaponizes epistemology itself.
  *   **From Sloppy Methodology/Inconsistency:**
      *   **Sloppiness/Inconsistency** might involve genuinely forgetting Keynes's point or applying methods haphazardly due to lack of rigor.
      *   **Epistemic Asymmetry** implies a more *aware* or *strategic* inconsistency. The arguer *knows* the power of the radical uncertainty argument and consciously chooses when to deploy it for maximum rhetorical advantage against opponents while minimizing its constraining effect on their own proposals. It's inconsistency with *intent*.

  **Key Features of the Asymmetry:**

  1.  **The Double Standard:** Different rules for "our" models vs. "their" models.
  2.  **Epistemological Boundary Work:** Actively defining when quantification is "allowed" (for opponents' models) and when it's "impossible" (to shield one's own models from critique).
  3.  **Failure Attribution:** Failures of favored models are attributed *solely* to the inherent nature of the uncertain system, absolving the model's structure, assumptions, or data.
  4.  **The "Necessity" Defense:** Favored quantitative approaches are defended as "necessary for decision-making," "the best available," or "illustrative," even while denying the possibility of quantification in the same domain when used by others.

  **Why it's Effective (and Dangerous):**

  1.  **Exploits a Valid Insight:** Keynes's point *is* valid for many complex systems. Dismissing simplistic quantification *can* be sound criticism.
  2.  **Creates Rhetorical High Ground:** Invoking deep uncertainty sounds sophisticated and cautious.
  3.  **Immunizes Preferred Policies:** By blaming failures on "unknowability," it prevents learning from model errors and shields underlying ideological or value-laden assumptions baked into the favored model.
  4.  **Paralyzes Opponents:** It can make any counter-argument based on quantification seem naive or philosophically unsound.

  **In essence:** Epistemic Asymmetry is the **strategic, inconsistent application of the philosophical doctrine of radical uncertainty to selectively invalidate opponents' quantitative models while legitimizing or insulating one's own quantitative (or quantitatively framed) policy proposals.** It turns a profound insight about the limits of knowledge into a tool for intellectual trench warfare. Your observation of its prevalence in climate and economic debates is astute – it's a major driver of polarization and gridlock in these critical areas. Naming it ("That's epistemic asymmetry") is the first step to calling it out.
