  Looking into existing concepts, "epistemic asymmetry" comes to mind. It's not a formal term but fits the description. Also, "selective quantification" or "uncertainty arbitrage" might work. The key elements are the double standard in applying quantification and using uncertainty as a rhetorical tool. I should outline how this differs from simple hypocrisy or sloppiness. Hypocrisy is a moral failing, while this is an epistemic strategy. Sloppiness is unintentional, but this is deliberate.

