answer: |-
  Your argument is coherent and insightful—the distinction between Plutarch's "diagnostic biography" and hagiography holds significant merit. Here’s a breakdown addressing your concerns:

  ### 1. **Central Distinction Validity**
     - **Plutarch vs. Hagiography**: Your framing of Plutarch’s anecdotes as revealing *contextual fragility* rather than innate virtue is astute. Hagiography (e.g., Gregory of Tours) *does* typically use anecdotes as unidirectional proof of sainthood (e.g., miracles affirming divine favor). Plutarch, by contrast, shows traits as double-edged: Alcibiades' cleverness breeds both charm and treachery; Alexander’s austerity fuels solidarity *and* hubris.  
     - **"Diagnostic" Lens**: This term aptly captures Plutarch’s focus on how virtues become vices under pressure. As he states in *Alexander 1.2*, his goal is to illuminate "the signs of the soul" through revealing actions—not to crown heroes.

  ### 2. **Hagiography Characterization**
     - **Fairness to Genre**: Gregory’s miracles *aren’t* diagnostic in your Plutarchan sense. They serve theological aims: affirming God’s power through the saint, not probing psychological complexity. For example, healing miracles in *Life of Martin* validate sanctity; they don’t explore Martin’s flaws under stress.  
     - **Nuance**: Later hagiography (e.g., *Confessions* of Augustine) *can* be diagnostic, but Gregory’s work lacks this depth. Your contrast stands.

  ### 3. **Examples & Overreading**
     - **Gedrosian Desert (Alexander 66.3-5)**: While some view it as propaganda, Plutarch’s inclusion of the *criticism* ("his object was to extort admiration") invites your dual reading. The episode *does* showcase both solidarity and performative excess—reinforcing your point.  
     - **Stronger Example**: Consider **Cato the Younger** (e.g., *Cato Minor* 68-70). His rigid integrity (e.g., refusing political compromises) is portrayed as noble yet self-destructive, isolating allies and hastening defeat. The virtue becomes a fatal flaw in crisis—clearer than Alcibiades' dog-tail anecdote.

  ### 4. **Refining the Framework**
     - **Avoid Overforcing**: Plutarch *does* moralize (e.g., *Nicias* praising caution but noting its excess). Your "diagnostic" lens works best when emphasizing his interest in *contingency*: how traits succeed/fail based on circumstance (e.g., *Coriolanus*’ valor vs. inflexibility).  
     - **Key Adjustment**: Stress that Plutarch’s moral lesson is **causal analysis**, not exemplarity: "Observe how *this* trait in *this* context led to *this* outcome."

  ### One-Sentence Summary
  \answer{Plutarch’s anecdotes function as diagnostic case studies of character under pressure, revealing how virtues become vices in specific contexts—distinct from hagiography’s uncritical exemplarity—offering moral insight through causal analysis rather than imitation.}
