  my econ prof said friedmans argument about unrealistic assumptions is basically like the london tube map: it deletes every station that isnt on your line, distorts distances, and pretends the thames doesnt exist, but you still get where youre going. he uses this to defend macro models with rational agents and perfect markets -- the unrealistic bits are just filtered-out stations, not lies. i think theres a difference between omitting a station and inventing a train that travels faster than light, but i cant formalize it. can you lay out the correspondence table -- whats the model, the map, the deleted stations, the rider, the actual geography? then tell me exactly where the analogy breaks, especially on whether an omission is the same kind of error as a positive falsehood about human cognition, and whether the conclusion that unrealistic assumptions are harmless survives once the cracks are visible. if the tube-map comparison collapses, whats a less misleading analogy for how idealization actually works in science?
reasoning: |-
  Okay, the user is grappling with their econ professor's defense of unrealistic assumptions in macro models using the London Tube map analogy. They feel there's a flaw in equating omissions with outright falsehoods, especially regarding human cognition. Let me unpack this.

  First, I need to map the Tube analogy to economic models. The Tube map simplifies reality by omitting irrelevant details (like less-used stations) and distorting scales, but still functions for navigation. Similarly, models like those with rational agents and perfect markets strip away complexities to focus on core mechanisms. The rider is the economist or policymaker, geography is the real economy, and the destination is the economic prediction or insight.

  But where does the analogy break? The user's key concern is that omitting a station isn't the same as inventing a FTL train. In economics, assuming hyper-rational agents isn't just leaving out human irrationality; it's actively misrepresenting how people think. That’s a positive falsehood, not an omission. Plus, while the Tube map's omissions are harmless (you won't end up in a river), economic models' oversimplifications can lead to bad policy if behavioral factors are critical—like in financial crises where irrationality plays a big role.

  The user might also be hinting at deeper issues: does their professor's argument let flawed models off the hook? They likely want to challenge the idea that all unrealistic assumptions are equally benign. They need a stronger framework to articulate why some idealizations are acceptable (like omitting friction in physics) while others (false cognitive assumptions) are problematic.

  For a better analogy, scientific models with frictionless planes or ideal gases come to mind. These isolate variables but acknowledge real-world deviations. Unlike the Tube map, which is purely pragmatic, scientific idealizations are testable and have known boundary conditions. The key is whether the model's core causal mechanisms hold. If ignoring human psychology breaks those mechanisms, it's not just simplification—it's a fundamental flaw.

  The user’s unspoken need is probably to reconcile theoretical models with real-world validity without dismissing all unrealistic assumptions as equally harmless. They want to know when simplification crosses into misrepresentation, especially in social sciences where human behavior defies neat abstraction.
answer: |-
  Here's a breakdown of Friedman's Tube Map analogy, its correspondence to economic models, where it breaks down (especially regarding your "faster-than-light train" point), and a more robust analogy for scientific idealization:

  ### Friedman's Tube Map Analogy Correspondence Table
  | **Concept**                    | **Tube Map**                             | **Economic Model (e.g., DSGE/RBC)**        |
  |-------------------------------|------------------------------------------|-------------------------------------------|
  | **The Model**                 | The schematic Tube map                   | The mathematical model (e.g., rational agents, perfect competition) |
  | **The Map-Maker**             | Transport for London designer            | Economist constructing the model         |
  | **The Actual Geography**      | Physical London with streets, buildings, river | The real-world economy with institutions, irrationality, frictions |
  | **The Rider**                 | Tube passenger trying to get from A to B | Economist/policymaker making predictions or designing policy |
  | **The Destination**           | Arriving at the correct station          | Accurate prediction (e.g., inflation response to interest rates) |
  | **"Deleted Stations"**        | Minor stations omitted for clarity       | "Irrelevant" details (e.g., specific labor laws, cultural norms) |
  | **"Distorted Distances"**     | Geographical inaccuracies (e.g., Hampstead appears closer to Charing Cross than it is) | Simplifications (e.g., representative agent, continuous time) |
  | **"Pretends the Thames Doesn't Exist"** | Omitting the river's true path        | Omitting key complexities (e.g., financial instability, behavioral biases) |

  ### Where the Analogy Breaks Down (Your "Faster-Than-Light Train" Critique)
  1.  **Omission vs. Active Misrepresentation:**
      *   **Tube Map:** Only *omits* or *distorts* real elements (stations, distances, river). It doesn't *add* non-existent features like teleporters or FTL trains.
      *   **Economic Models w/ Rational Agents/Perfect Markets:** Often **actively assert false positive claims** about reality. Assuming agents maximize expected utility with perfect foresight isn't just omitting irrationality; it's *asserting* a specific, empirically false cognitive process. This is your "faster-than-light train" – a mechanism that fundamentally violates known laws (in this case, behavioral psychology/neuroscience).

  2.  **The Nature of the "Destination":**
      *   **Tube Map:** The destination is purely functional – getting to a station. The map's distortions rarely prevent this *if you follow the map's own logic*.
      *   **Economic Models:** The "destination" is *predicting or explaining real-world outcomes*. Models built on false positive assumptions about core mechanisms (like cognition or market perfection) can:
          *   **Fail catastrophically:** Predict smooth adjustments when crises (driven by irrationality/frictions) occur (e.g., 2008 financial crisis).
          *   **Mislead on causality:** Attribute outcomes to the wrong mechanisms (e.g., attributing unemployment solely to sticky wages while ignoring confidence/credit channels).
          *   **Justify harmful policies:** Recommend deregulation based on perfect market assumptions, ignoring inherent instability.

  3.  **The "Harm" of Omission:**
      *   **Tube Map:** Omitting the Thames is harmless *for navigating the Tube system*. It becomes harmful only if you try to use the map for boating.
      *   **Economic Models:** Omitting core features like financial frictions, power imbalances, or bounded rationality **is inherently harmful for the model's intended purpose** (understanding/predicting the macroeconomy). These aren't minor scenic details; they are often the *drivers* of the phenomena being studied. Pretending they don't exist *is* the error.

  4.  **Robustness of the Conclusion:**
      *   **Tube Map:** The conclusion ("unrealistic bits are harmless for the purpose") *mostly* holds *because* the omissions/distortions are genuinely irrelevant to the narrowly defined task (finding Tube lines/stations).
      *   **Economic Models:** The conclusion ("unrealistic assumptions are harmless") **does not survive** once we recognize:
          *   The assumptions are often *positive falsehoods* about core mechanisms, not just omissions.
          *   The omitted elements are frequently central to the phenomena being modeled.
          *   Models built on these foundations have repeatedly failed to predict or explain major real-world events *because of* these flaws.

  ### A Less Misleading Analogy: Scientific Models & Frictionless Planes
  A more accurate analogy for idealization in science (including some economics) is the **physics "frictionless plane" or "ideal gas" model:**

  1.  **The Model:** A frictionless plane, point masses, ideal gas laws (PV=nRT).
  2.  **The Idealization:** Explicitly acknowledges the *absence* of friction/complex molecular interactions/volume.
  3.  **The Purpose:** Isolates the *fundamental core relationship* (Newton's laws, relationship between P, V, T) that operates *even in the real world*, but is obscured by friction/complexity.
  4.  **The Correspondence:**
      *   **Friction/Interactions/Volume =** Behavioral biases, market frictions, institutional complexities, distributional effects.
      *   **Newton's Laws / PV=nRT =** Core economic forces (supply/demand, budget constraints, incentives).
  5.  **Why it's Better:**
      *   **Acknowledges Falsehood:** Explicitly states what is being idealized away ("Assume friction is zero...").
      *   **Focus on Core Mechanisms:** Aims to reveal fundamental, *robust* causal relationships that persist *despite* the complexities.
      *   **Progressive Refinement:** The model is the *starting point*. Real-world applications *add back* friction (e.g., coefficients of friction) or deviations (e.g., Van der Waals equations) to improve accuracy. The idealization provides the baseline.
      *   **Testability:** The *predictions* of the idealized model can be tested against reality. Deviations aren't just ignored; they *drive* the development of more complex models incorporating the omitted factors.
      *   **Boundary Conditions:** Understands that the model breaks down under specific conditions (e.g., near absolute zero for ideal gas, high speeds for Newtonian mechanics) – just as rational-agent models break down during panics or complex strategic interactions.

  ### Conclusion
  Friedman's Tube Map analogy falsely equates **omitting irrelevant detail** with **asserting false core mechanisms**. It collapses under your "faster-than-light train" critique because many economic assumptions (rationality, perfect markets) *are* positive falsehoods about fundamental processes, not harmless omissions. These falsehoods *do* cause models to fail when the omitted factors (irrationality, instability) dominate.

  The "frictionless plane" analogy is superior. It embraces idealization as a tool to isolate core principles but explicitly acknowledges the falsehood, focuses on testable fundamental relationships, provides a path for progressive refinement by adding back complexities, and understands its own limitations. The conclusion that "unrealistic assumptions are harmless" only survives in the Tube Map analogy and Friedman's defense; it fails under the frictionless plane analogy or any rigorous view of scientific modeling where core assumptions must align with known reality to be trustworthy foundations. Successful science uses idealization to reveal truth, not to justify ignoring it.
