  I'm drafting a chapter where my protagonist — she was an evolutionary biolgist before she started writing novels — has to deliver the retirement toast for her old PhD advisor. The guy spent forty years tearing down adaptationist just-so stories, the whole spandrels argument that not every biological trait is an optimally designed solution; sometimes it's just an architectural byproduct of something else entirely. The audience is split right down the middle: half the table are evolutionary biologists who will visibly wince if she romanticizes the science, and the other half are his grandkids and nieghbors who barely know what a gene is and probably think spandrel is a kind of pasta.

  She wants the speech to do real structural work around this idea. She can't praise him as if he was just finding clever adaptive explanations for everything, because that's literally the opposite of what he did, but she also can't frame him as a failure just because he kept demonstrating that certain traits had no adaptive purpose. There's a specific twist I need: she frames his biggest career 'failure' — a beetle study where he never found the adaptive story and it turned out to be a spandrel — as the actual birth of his real contribution. It needs to comfort the family without being false to the science. She also keeps misspelling spandrel as 'spandril' in her notes, and maybe she should accidentally say that in the toast and correct herself with a laugh. Write the toast for me — about five minutes, casual but precise enough that the biologists don't cringe, with one joke that lands for both sides of the room. Don't turn it into a bibliography or ask for citations; just the speech itself. Oh, and she's been arguing with her roommate about whether novel plots have spandrels too, but that's not important, she just mentions it in passing. Sorry if this is messy, I'm writing at 2am and my coffee went cold.
