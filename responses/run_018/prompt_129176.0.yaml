  First, I need to recall the moral foundations theory by Haidt. Harm/care is near-universal but variably weighted, while loyalty/purity vary in salience and conceptual structure. The user mentions examples like hierarchical reciprocity vs. communal-sharing obligations. So the desiderata must handle these variations.

  The user wants each requirement tied to a motivating case. For instance, distinguishing between a norm being absent versus present but low-salience. That means a theory must account for cultures where a foundation exists but isn't emphasized versus where it's completely missing. Also, intersubjective convergence vs. mind-independent truth—how do universal aspects like harm fit with varying foundations?

  I should list key desiderata. Start with Non-Eliminativism: explaining variation without denying it. Then, Distinguishing Absence and Salience: some cultures have purity but low priority. Conceptual Pluralism: different frameworks like hierarchy vs. communal sharing. Universal Constraints: harm being near-universal. Weighting vs. Incommensurability: differing importance versus incomparable values. Cross-Cultural Dialogue: enabling mutual critique.

  Non-negotiable ones would be Non-Eliminativism and Distinguishing Absence and Salience because any theory must acknowledge these empirical facts. Realists might insist on Mind-Independence, while relativists focus on Intersubjectivity. Pluralists emphasize Incommensurability.

  Now, joint unsatisfiability? Mind-Independence and Conceptual Pluralism might clash. If moral facts are mind-independent, how can concepts vary so much? Also, Universal Constraints and Deep Variation could conflict if foundations like purity are absent in some cultures. But the biggest tension is Mind-Independence vs. Conceptual Pluralism. Mind-Independence demands a single moral reality, but conceptual differences suggest moral facts are tied to cultural frameworks. That might exclude strong realist views.

  The user also wants to know which single requirement excludes popular theories. Probably Mind-Independence, because it challenges theories that tie morality to human practices. Relativist and constructivist theories might handle the variation better but struggle with universal aspects like harm.

