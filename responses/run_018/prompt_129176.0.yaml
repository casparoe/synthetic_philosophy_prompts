answer: |-
  Here are the desiderata for an account of moral objectivity that takes WEIRD/non-WEIRD folk-moral variation seriously, articulated with their motivating cases/distinctions, classification, and assessment of compatibility:

  **Core Desiderata:**

  1.  **Non-Eliminativism about Variation:**
      *   **Requirement:** The account must explain the empirical reality of cross-cultural variation in moral foundations (salience, weighting, conceptual structure) as *genuine moral phenomena*, not merely as errors, misunderstandings, or non-moral conventions.
      *   **Motivating Case/Distinction:** Distinguishing between *disagreement within a shared moral framework* (e.g., WEIRD cultures debating tax policy) and *fundamentally different moral frameworks* (e.g., WEIRD emphasis on autonomy/fairness vs. some non-WEIRD emphasis on hierarchical duty/purity as core goods). Protects the observation that loyalty/purity norms in non-WEIRD contexts are experienced as genuinely morally binding, not just social rules.
      *   **Classification:** **Non-negotiable.** Any metaethics denying the *reality* of this variation as moral fails the empirical test.

  2.  **Distinguishing Absence from Low Salience:**
      *   **Requirement:** The account must differentiate between a moral foundation being *absent* (not recognized as a source of moral obligation/value) in a culture versus being *present but low-salience* (recognized but given little weight relative to other foundations).
      *   **Motivating Case/Distinction:** Protects the difference between cultures where "purity" concerns are utterly alien (true absence) and cultures where they exist but are overshadowed by harm/autonomy concerns (low salience). Crucial for accurately describing the empirical pattern (e.g., purity may be low-salience but rarely truly absent).
      *   **Classification:** **Non-negotiable.** Accurate description of the data demands this distinction.

  3.  **Conceptual Pluralism Accommodation:**
      *   **Requirement:** The account must accommodate the fact that foundational concepts like "loyalty," "authority," or "purity" can have *different conceptual structures* across cultures (e.g., hierarchical reciprocity vs. communal-sharing).
      *   **Motivating Case/Distinction:** Protects the observation that "loyalty" isn't a single, universally understood concept. In one culture, it might mean obedience to superiors within a rigid hierarchy (reciprocal duty), while in another, it might mean unconditional support for kin/clan based on shared essence (communal sharing). These are not just different weights on the *same* thing; they are different *ways of understanding* the moral domain.
      *   **Classification:** **Primarily Pluralist/Relativist.** Strong realist views insisting on a single, universal conceptual structure for moral properties struggle here.

  4.  **Constrained Universality (Harm/Care):**
      *   **Requirement:** The account must explain the near-universal presence and moral valence of harm/care concerns, while allowing for significant variation in their *weighting* relative to other foundations.
      *   **Motivating Case/Distinction:** Protects the distinction between *universal presence* (harm/care recognized everywhere as morally relevant) and *universal dominance* (harm/care always overriding other concerns, which is empirically false). Accounts for why harm violations are often the easiest to translate cross-culturally, even if punishment or context varies.
      *   **Classification:** **Non-negotiable.** Explaining this asymmetry (universal harm vs. variable loyalty/purity) is essential. Realists see this as evidence of mind-independent grounding; others as a universal human constraint.

  5.  **Weighting vs. Incommensurability:**
      *   **Requirement:** The account must distinguish between differences in the *relative importance* (weighting) assigned to different moral foundations within a shared conceptual space versus genuine *incommensurability* arising from fundamentally different conceptual structures or value ontologies.
      *   **Motivating Case/Distinction:** Protects the difference between arguing *how much* loyalty should override fairness (weighting difference, potentially resolvable) and arguing whether an action violates a concept of loyalty that the other culture doesn't recognize *as loyalty* or even as morally relevant in that way (incommensurability due to conceptual pluralism). Crucial for understanding the depth of disagreement.
      *   **Classification:** **Primarily Pluralist.** Strong relativists lean towards incommensurability, strong universalists/reductionists downplay it, pluralists center it.

  6.  **Mind-Independence vs. Intersubjective Convergence:**
      *   **Requirement:** The account must clearly articulate the relationship (or lack thereof) between widespread cross-cultural agreement (intersubjective convergence) and mind-independent moral truth. It must avoid conflating universality with objectivity.
      *   **Motivating Case/Distinction:** Protects the distinction between "Everyone (culturally) agrees X is wrong" (intersubjectivity, possibly contingent) and "X is wrong regardless of what anyone thinks" (mind-independence). The near-universality of harm/care could be evidence for either, but cannot simply be equated with mind-independence without further argument.
      *   **Classification:** **Camp-Defining:** This is the core divide. **Realists** require mind-independence. **Relativists/Constructivists** ground objectivity in intersubjectivity (within cultures or universally). **Pluralists** may be split or offer hybrid views.

  7.  **Explanatory Asymmetry:**
      *   **Requirement:** The account must explain *why* harm/care shows near-universal presence and recognition (albeit variably weighted), while loyalty, authority, and purity show significant variation in presence, salience, *and* conceptual structure.
      *   **Motivating Case/Distinction:** Protects against accounts that treat all foundations identically in terms of their origin or ontological status. The asymmetry demands an explanation beyond "cultural variation exists." Is harm more biologically basic? More fundamental to social coordination? Less culturally malleable?
      *   **Classification:** **Non-negotiable** for adequacy. All camps must address this asymmetry.

  8.  **Possibility of Cross-Cultural Moral Critique/Dialogue:**
      *   **Requirement:** The account must either explain how genuine cross-cultural moral critique/dialogue is possible despite variation/incommensurability, or coherently explain its impossibility.
      *   **Motivating Case/Distinction:** Protects the practical need/phenomenon of cross-cultural moral engagement (e.g., human rights discourse, critiques of practices like FGM or caste systems) while acknowledging the potential depth of disagreement based on conceptual pluralism. Can a WEIRD feminist critique hierarchical purity norms meaningfully?
      *   **Classification:** **Camp-Specific:** **Universalists/Realists** typically assert strong possibility. **Relativists** often limit critique to internal consistency or pragmatic grounds. **Pluralists** may offer nuanced accounts (e.g., dialogue via overlapping concerns like harm, or pragmatic negotiation).

  **Assessment of Joint Satisfiability:**

  *   **Potential Tensions:** The biggest tension lies between **Mind-Independence (6 - Realist)** and **Conceptual Pluralism (3)**. If moral properties are strongly mind-independent and universal in structure, how can the *very concepts* of loyalty, purity, etc., differ fundamentally across cultures in ways that seem morally foundational? Realists must either reduce these concepts to a universal base (risking distortion of the phenomena) or argue the variation is non-moral or erroneous.
  *   **Universality vs. Deep Variation:** **Constrained Universality (4)** and **Conceptual Pluralism (3)** also create tension. Explaining why harm is near-universal while purity concepts vary so deeply is challenging for any view. Pluralists embrace this, relativists anchor it in culture, realists must posit why some domains are more susceptible to cultural shaping than others.
  *   **Is a Subset Jointly Unsatisfiable?** No single subset is *logically* impossible, but **Mind-Independence (6) + Conceptual Pluralism (3) + Non-Eliminativism (1)** presents the strongest challenge. Satisfying all three simultaneously requires a very sophisticated realist pluralism (e.g., a sparse, abstract moral realism where diverse cultural concepts are imperfect manifestations or responses) or risks collapsing into a non-objectivist view. Less robust forms of realism struggle mightily here.

  **The Most Excluding Requirement:**

  *   **Conceptual Pluralism Accommodation (3)** does the most to exclude popular theories. It directly challenges:
      *   **Strong Moral Realism (Especially Naturalistic):** Which typically seeks universal, reductionist definitions of moral properties. Diverse conceptual structures resist easy reduction to a single natural kind or universal functional role.
      *   **Simple Universalism/Intuitionism:** Which often assumes universally shared moral concepts accessed by intuition.
      *   **Some Constructivisms:** If constructivism assumes a shared procedure yielding universalizable results, deep conceptual pluralism challenges the universality of the inputs or the procedure itself.
      *   **Relativism** and **Pluralism** handle this requirement more naturally, though pluralism embraces it most directly. This requirement forces theories to grapple with the depth and structure of moral diversity, not just its existence.
