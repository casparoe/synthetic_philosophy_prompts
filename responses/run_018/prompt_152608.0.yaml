answer: |-
  Your observation captures a crucial methodological asymmetry in counterfactual historiography that currently lacks a universally accepted term. This phenomenon can be precisely defined and distinguished as follows:

  **Defined Phenomenon:**  
  **Bundled Counterfactual Permissibility (BCP)**  
  *The evaluative tendency whereby the plausibility of a historical counterfactual scenario is contingent on whether its modified variables constitute a historically attested or functionally interdependent institutional/logical cluster, rather than on the raw number or magnitude of changes.*

  ### Core Characteristics & Distinctions:
  1. **vs. Minimal Rewrite Rules**  
     BCP overrides the principle of minimizing *discrete* changes. A cluster (e.g., "electoral system reforms") may involve 5+ variables but be accepted as a *single coherent intervention*, while 2 unrelated changes (e.g., "crop yield + treaty ratification") are deemed two "miracles."

  2. **vs. Path-Dependence**  
     Path-dependence explains *why* systems resist change. BCP addresses *how we categorize changes* during evaluation. While path-dependence makes clustered changes *harder*, BCP makes them *conceptually permissible as a unit*.

  3. **vs. Auxiliary-Hypothesis Adjustments**  
     Auxiliary hypotheses preserve core premises (e.g., holding gravity constant while altering a battle). BCP concerns *active modifications* to historical facts that are grouped based on perceived systemic coherence.

  ---

  ### Conditions for Legitimate Bundling (vs. Ad Hoc)
  A bundle is legitimate if it satisfies **ONE OR MORE** of:

  1. **Institutional Contiguity**:  
     Variables are components of a single documented institution (e.g., "Weimar Constitution" bundling voting thresholds, presidential powers, and emergency clauses).

  2. **Functional Interdependence**:  
     Variables operate within a recognized causal loop (e.g., gold standard adherence → interest rates → trade balances → unemployment, forming a monetary policy cluster).

  3. **Historical Precedent for Joint Change**:  
     Actual reforms altered these variables simultaneously (e.g., New Deal banking regulations + labor laws + agricultural subsidies as a "New Deal bundle").

  4. **Theoretical Recognition**:  
     Scholarly consensus treats variables as a system (e.g., "Westminster Model" bundling FPTP, unitary government, and parliamentary sovereignty).

  **Ad hoc bundles fail these criteria** – e.g., altering "Spanish Armada's sails + Elizabeth I's health + 1587 wheat prices" lacks institutional/thematic unity.

  ---

  ### Why This Asymmetry Persists
  BCP emerges from historians' implicit use of **systems thinking**:
  - **Cognitive Efficiency**: Clusters reduce cognitive load ("electoral reform" vs. 5 discrete changes).
  - **Causal Realism**: Changes to interdependent systems *should* be bundled (altering one without others may create incoherence).
  - **Historiographical Conventions**: Fields develop "standard counterfactual packages" (e.g., "Confederate victory" bundles military/diplomatic/political variables).

  ---

  ### Implications
  BCP explains why some complex counterfactuals gain acceptance (e.g., "What if Alexander lived longer?" alters military, political, and cultural trajectories as an "imperial succession bundle") while others with fewer changes are rejected. Recognizing this phenomenon helps:
  1. Expose hidden evaluative biases in historical debates  
  2. Formalize criteria for legitimate bundle construction  
  3. Refine minimal-rewrite principles to account for systemic coherence  

  No extant term fully captures this, making *Bundled Counterfactual Permissibility* a necessary conceptual tool for rigorous historical analysis.
