  Check if the scenario avoids sci-fi elements. No demons or perfect predictors—good. The gene edit should have real-world plausibility, referencing existing pain disorders as a baseline. 

  Make sure each ethical verdict clearly identifies the key feature driving the decision. For negative utilitarianism, it's the elimination of suffering. Kantian is moral agency requiring risk. Virtue ethics is the erosion of virtues. 

