  For the honor section, clarify what she didn't do: didn't solve it, didn't call it an illusion, didn't leave it for science. Instead, she transformed the question. Praise her for revealing the structure of our thinking. Make the praise about conceptual insight, using phrases like "redrawing the map of the debate."

