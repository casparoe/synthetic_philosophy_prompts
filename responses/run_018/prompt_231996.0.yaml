answer: |-
  ## Joint Statement: The Particularist-Generalist Adversarial Collaboration on Moral Principles

  **Preamble:**

  We, a committed moral particularist (Particularist) and a committed moral generalist (Generalist), have engaged in sustained debate over the nature of moral reasons and their relationship to principles. We agree that this debate is substantive and important, but also that it has often been obscured by misunderstandings. This preamble clarifies our core positions and the precise locus of our disagreement.

  *   **The Particularist Position (as endorsed by the Particularist):** Moral reasons are irreducibly context-dependent. While patterns and defeasible generalizations exist, the contribution a given feature (like causing pain) makes to the moral status of an action is not determined by invariant principles stating necessary and sufficient conditions. The moral relevance—including its valence (whether it counts for or against) and its force—of any feature emerges holistically from the complex interplay of all features present in a concrete situation. No finite, exceptionless set of principles can fully capture this context-sensitivity; moral judgment fundamentally involves a capacity for discerning what matters in the particular case that transcends subsumption under general rules.
  *   **The Generalist Position (as endorsed by the Generalist):** Moral reasons are governed by finite, general principles. These principles articulate how specific features (like causing pain) function as reasons across different contexts. While their application requires judgment, and while their force can be outweighed or their conditions for application unmet, the core moral relevance of these features—including their characteristic valence—is fixed by underlying principles. These principles are not mere summaries but express genuine explanatory generalizations that structure moral thought and justify verdicts. A system of such principles provides the best explanation for the systematicity, predictability, and learnability of morality.

  **Shared Agreements on the Debate:**

  1.  **Context Matters:** Both parties emphatically agree that the concrete circumstances of an action profoundly affect what one morally ought to do in that situation. The disagreement is *not* about *whether* context matters, but *how* it matters and *whether* the way it matters can be exhaustively captured in finite, general principles.
  2.  **Not About Variability of Verdicts:** The debate is not simply about whether the overall moral verdict (right/wrong, permissible/impermissible) changes with context. We agree that it obviously does. The debate concerns the nature of the *contributory reasons* themselves and their relationship to the overall verdict.
  3.  **Beyond Simple Invariance:** We agree that no serious moral thinker claims that every feature has a *completely invariant* moral weight or relevance regardless of context (e.g., no one thinks causing pain *always* counts exactly the same, or *never* counts against an action). The debate concerns whether features have a *stable core valence* (e.g., pain is *pro tanto* bad) subject to outweighing, versus whether their very valence can shift dramatically based on context.

  **Section 1: Agreed Claims (Foundational Phenomena, Structure, and Methodology)**

  We jointly affirm the following statements, recognizing that each represents a substantive commitment that could have been resisted by the other side at the outset of our debate:

  1.  **Phenomenon of Contextual Variation:** Any adequate account of morality must explain why the moral relevance of a feature like "causing pain" varies significantly across contexts. It is a robust feature of moral experience that:
      *   Causing pain counts strongly against torture.
      *   Causing pain can be a neutral or even contributory positive reason within the context of a necessary medical procedure (e.g., setting a broken bone).
      *   Causing pain can be a contributory positive reason within the context of a consensual endurance practice (e.g., athletic training, certain rituals).
      *   Similarly, the pleasure taken in another person's humiliation is typically a strong negative reason, but the pleasure taken in a friend's genuine success is typically a positive reason. The *kind* of relevance differs fundamentally between these cases.
  2.  **Distinction: Contributory Reason vs. Overall Verdict:** Moral reasoning involves distinguishing between individual features that count for or against an action (contributory reasons) and the final judgment about the action's overall moral status (right, wrong, permissible, obligatory). Both sides accept this distinction as fundamental.
  3.  **Pro Tanto vs. Prima Facie:** We agree on the conceptual distinction:
      *   A *pro tanto* reason is a genuine reason with a specific valence (for or against) that retains its inherent force even when outweighed by stronger opposing reasons. Its contribution is real but insufficient to determine the overall verdict alone.
      *   A *prima facie* reason is a consideration that *appears* to be a reason at first glance but may turn out, upon fuller consideration, not to be a genuine reason at all in the specific context.
      The debate concerns whether contributory reasons are best understood as *pro tanto* or whether they are more akin to *prima facie* considerations whose very reason-status is context-dependent.
  4.  **Invariance vs. Default:** We distinguish:
      *   An *invariant* reason: A feature whose valence (for/against) is fixed across all possible contexts.
      *   A *default* reason: A feature that characteristically has a certain valence in "normal" circumstances, but where this valence *can* be reversed or fundamentally altered in sufficiently unusual contexts. Calling something a default implies a standing tendency but allows for exceptions.
      We agree that few, if any, reasons are plausibly *invariant* (e.g., even "lying" might not count against in a context where deceiving a murderer is necessary). The debate centers on whether some reasons have a stable *default* valence that can only be outweighed, never reversed.
  5.  **Explanation vs. Restatement:** A satisfactory moral principle must *explain* moral verdicts, not merely restate or summarize them. A principle that simply lists outcomes without capturing *why* they obtain (e.g., "Torture is wrong") is insufficient. A genuine principle must articulate the underlying *reasons* structuring the judgment.
  6.  **Methodological Commitments (Falsifiability):**
      *   **Evidence Against Particularism:** The discovery of a finite set of principles that (a) are non-trivial (avoid gerrymandering, see 7a below), (b) cover the relevant moral terrain (including complex cases of contextual variation), (c) have genuine explanatory power for verdicts, and (d) are learnable/usable by moral agents, would constitute strong evidence against Particularism. Particularism would need to explain why such principles are impossible or unnecessary even if apparently successful.
      *   **Evidence Against Generalism:** The persistent failure to formulate non-trivial principles covering significant areas of morality despite sustained effort, especially the emergence of seemingly genuine counterexamples that resist principled reconciliation without *ad hoc* modifications or gerrymandering, constitutes evidence against Generalism. Generalism would need to explain why this failure is temporary or why apparent counterexamples are not genuine valence reversals.
  7.  **Codifiability Criteria (Shared Ground for Evaluating Principles):** For a candidate formulation to count as a genuine *principle* rather than a vacuous summary or "gerrymandered" description:
      a.  It must be **projectable**: It must provide guidance in novel cases beyond those used to formulate it.
      b.  It must be **explanatory**: It must articulate *why* the cited features are reasons, not just *that* they correlate with verdicts.
      c.  It must be **non-disjunctive**: It must not simply list disparate scenarios without a unified underlying rationale (e.g., "Causing pain is wrong except in medical contexts, endurance practices, self-defense..." is disjunctive and gerrymandered).
      d.  It must be **manageable**: It must be sufficiently concise and comprehensible to play a role in moral thought, education, or justification. An infinitely long list of context-specific rules fails as a "principle".

  **Section 2: Disagreements Table**

  | Issue (Neutral Wording) | Particularist Formulation                                                                 | Generalist Formulation                                                                                                                          | Substantive/ Verbal  | Crux                                                                                                 | Concrete Case/Argument & Predictions                                                                                                                                                                                                                                |
  | :---------------------- | :---------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :------------------- | :--------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Polarity of Reasons** Can the valence (for/against) of a feature *as a reason* change fundamentally across contexts? | "The valence of a feature like 'causing pain' or 'causing pleasure' is not fixed. Its status *as a reason for or against* an action is inherently context-dependent. In torture, causing pain is a negative reason; in necessary surgery, the *very same feature* might not count against, or might even contribute positively to the justification." | "Core moral features possess a stable default valence. 'Causing pain' has a *pro tanto* negative valence. In surgery, this negative reason is present but massively outweighed by the positive reasons (e.g., restoring health). The feature's *core* negative contribution doesn't vanish or reverse." | **Substantive**      | Does the feature retain its core *pro tanto* valence (even if outweighed) in all contexts, or does its status *as a reason with that valence* disappear or invert in some contexts? | **Case: Consensual Endurance Practice (e.g., intense martial arts sparring).** <br> *P Prediction:* Causing pain is a contributory *positive* reason in this context (fulfilling the agreed purpose). <br> *G Prediction:* Causing pain remains a *pro tanto* negative reason, outweighed by consent, skill development, etc. |
  | **2. Default Reasons** Do some reasons have a standing valence that can be outweighed but not reversed? What does calling it a "default" mean? | "Calling a reason a 'default' is merely a description of statistical frequency or typicality. In sufficiently unusual contexts, *any* feature's valence can reverse; there are no valence-protected reasons. The 'default' is just the most common pattern, not a deep normative fact." | "Some reasons (like causing pain or breaking a promise) have a stable *pro tanto* valence as part of their moral nature. This valence is the 'default' meaning it defines their characteristic contribution, which holds unless specific defeating conditions (specifiable in principle) are met. Reversal is impossible; only outweighing occurs." | **Substantive**      | Can the core valence of a candidate default reason (e.g., causing pain) ever be *reversed* (become a positive reason) in *any* context, or can it only be *outweighed*? | **Case: Sadistic Pleasure.** Taking pleasure *in the humiliation itself* of an unwilling victim. <br> *P Prediction:* This feature is a strong negative reason; valence reversal is impossible here. <br> *G Prediction:* This feature is a strong negative reason; valence reversal is impossible here. (Agreement on valence, but disagreement on *why* reversal is impossible - G sees it as confirming stable valence, P sees it as context blocking any positive valence). **Crucial Case: Pleasure in Just Punishment?** Taking pleasure in seeing a genuinely guilty person suffer a just punishment. <br> *P Prediction:* This *could* be a positive reason (upholding justice) or neutral; valence not fixed. <br> *G Prediction:* The pleasure *itself* remains a *pro tanto* negative reason (schadenfreude), outweighed by the positive reasons for just punishment. |
  | **3. Codifiability (Finite Principles)** Can a finite set of true, non-trivial principles (as defined in 7a-d) cover all morally relevant contexts? | "No. The holism of reasons and the open-ended complexity of possible contexts make it impossible to formulate a finite set of non-gerrymandered principles that determine the valence and force of reasons in every case. Any apparent principle either has exceptions or becomes disjunctive/gerrymandered upon rigorous testing." | "Yes. While difficult, it is possible in principle to articulate a finite set of fundamental principles (perhaps at a high level of abstraction) and derivative principles specifying defeating/enabling conditions that non-trivially cover the moral terrain. The complexity is manageable within a principled framework." | **Substantive**      | Is the space of morally relevant contexts and reason interactions finite and structured enough to be capturable by a finite set of rules meeting criteria (7a-d), or is it inherently open-ended and resistant to such codification? | **Argument: Burden of Production & Parsimony.** <br> *P Prediction:* Generalists will either fail to produce such a set covering agreed hard cases (e.g., polarity shifts) without gerrymandering, or their principles will become so complex/ad hoc they violate (7c,d). <br> *G Prediction:* Particularists underestimate the power of structured principles (e.g., Rossian *prima facie* duties with defeasibility conditions) or higher-order principles (e.g., Kantian, Consequentialist) to explain variation without valence reversal. Success is possible. |
  | **4. Moral Knowledge & Competence** Does competent moral judgment fundamentally involve subsuming cases under principles, or is it an uncodifiable capacity responsive to particulars? | "Moral competence involves a cultivated sensitivity to the particular case – a perception of the salient reasons present in *this* situation. While principles might be heuristic summaries or training tools, the competent judge directly apprehends the moral landscape of the particular; their judgment isn't produced by applying general rules." | "Moral competence fundamentally involves the (often implicit) grasp and application of moral principles. Judges recognize cases as instances of general types governed by principles. While perception of relevant features is crucial, the *evaluation* of those features as reasons is structured by principle-based knowledge." | **Partly Verbal/ Substantive** | What is the primary cognitive mechanism underlying *evaluation* (assigning reason status/valence/force) in the competent judge? Is it principle-application or a holistic perception? | **Case: Novel Moral Dilemma.** Present judges with a genuinely new, complex dilemma lacking clear precedents. Observe reasoning. <br> *P Prediction:* Judges will struggle to fit it neatly under existing principles, reasoning analogically or holistically, appealing directly to features of *this* case. <br> *G Prediction:* Judges will search for relevant principles, analogize to covered cases, attempt to formulate applicable rules, demonstrating implicit reliance on general standards. |
  | **5. Moral Education & Advice** Does improving a learner or advising an agent require shareable principles? How is improvement possible without the other side's machinery? | "Effective moral education and advice focus on developing perception, sensitivity to context, and analogical reasoning through case studies, narratives, and role-modeling. Shareable principles are useful heuristics or rules of thumb, but improvement consists in refining the uncodifiable capacity for discerning reasons in particulars, not just learning more rules." | "Moral education and advice fundamentally rely on articulating and teaching shareable principles. Principles provide the necessary structure, justification, and general guidance. Improvement involves refining understanding and application of these principles. Case studies are valuable precisely for illustrating principles in action." | **Substantive**      | Can moral competence be significantly developed, and meaningful moral advice be given, primarily *without* relying on the transmission and application of shareable principles? | **Task: Teaching "Respect".** <br> *P Approach:* Use diverse examples (listening, using titles, bodily autonomy, cultural differences), discuss nuances, encourage perspective-taking. Avoid a single defining principle. <br> *G Approach:* Articulate a core principle (e.g., "Treat persons as ends-in-themselves" or "Acknowledge inherent dignity"), then illustrate with examples showing application and limits. <br> **Prediction:** P argues G's principle is either too vague or requires uncodified judgment for application. G argues P's approach lacks structure and fails to provide general justification. Both claim their method demonstrably works. |

  **Section 3: Residual Disagreement and Load-Bearing Issues**

  Our collaboration has clarified the terrain but not resolved the core dispute. We agree on the phenomena and the conceptual framework, but differ on fundamental interpretations. We identify the following as the primary load-bearing disagreements:

  1.  **Polarity of Reasons (Row 1):** This remains central. The Particularist insists valence is inherently contextual; the Generalist insists on stable *pro tanto* valence subject to outweighing. The **crucial test case** remains those where the Particularist claims a clear valence *reversal* (e.g., pain in endurance practice being *pro* the action). **Observational Crux:** Can we identify clear cases where a feature uncontroversially functions as a positive reason in contexts where, according to the Generalist, it *should* be functioning only as an outweighed negative reason? **Concession:** If clear, uncontested examples of valence reversal are established (beyond outweighing), the Generalist would need to concede either that valence is not stable or develop a radically different account of reasons. If no such clear cases can be found despite searching, the Particularist would need to explain why outweighing consistently masquerades as reversal.
  2.  **Codifiability (Row 3):** This is deeply intertwined with Polarity. The debate hinges on whether successful, non-gerrymandered principles covering polarity-variant phenomena can be formulated. **Methodological Crux:** Can Generalists produce a candidate set of principles meeting criteria (7a-d) that handles the agreed phenomena (e.g., pain in torture, surgery, endurance; pleasure in success, humiliation, just punishment) without resorting to disjunctions or *ad hoc* clauses that violate (7c) or (7d)? Can Particularists demonstrate that any plausible Generalist attempt *inevitably* violates the non-gerrymandering condition? **Concession:** If Generalists produce a widely accepted, non-gerrymandered principle set covering the target phenomena, Particularists would need to concede the possibility of codification or argue it's merely descriptive, not explanatory. If Generalists consistently fail despite sustained effort, or their best attempts are widely judged as gerrymandered, Generalists would need to concede significant limitations or revise their view of what principles can achieve.
  3.  **Default Reasons (Row 2) & Moral Knowledge (Row 4):** While important, we regard these rows as somewhat dependent on the outcomes of Rows 1 and 3. If Polarity is unstable (P wins Row 1), Default Reasons (Row 2) become largely statistical. If Codifiability fails (P wins Row 3), the Generalist account of Moral Knowledge (Row 4) is significantly weakened. Conversely, stable Valence (G wins Row 1) supports Defaults, and successful Codifiability (G wins Row 3) strongly supports the principle-based view of Moral Knowledge. **Moral Education (Row 5)** is seen as downstream of these core metaphysical/epistemological disagreements.

  **Conclusion:**

  We remain committed to our respective positions: the Particularist to the irreducible context-sensitivity of moral reasons, the Generalist to their governance by finite principles. However, we have significantly sharpened the disagreement. The debate now demonstrably turns on the possibility of valence reversal and the feasibility of non-gerrymandered codification. We commit to evaluating future arguments and evidence—especially concerning clear cases of purported reversal and proposed principled reconciliations—in light of the shared framework and criteria established in this statement. Our residual disagreement is precise: *Can the context-dependence of moral reasons, especially concerning the valence of features like causing pain or pleasure, be fully captured within a finite system of non-trivial, explanatory, non-gerrymandered principles?* We sign below, acknowledging this as the core question we continue to dispute.

  ---
  **[Signed]**
  The Particularist
  The Generalist
