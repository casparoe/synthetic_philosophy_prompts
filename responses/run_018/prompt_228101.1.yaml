prompt: |-
  I'm putting together a grad seminar on panpsychism and ethics and I want to run one session backwards: before we look at any actual panpsychist moral theory, I want the spec. Here's the setup. Suppose someone defends what I'll call the thermodynamic criterion: rudimentary sentience is present in fundamental physical processes generally, but suffering specifically tracks irreversible entropy production — so a superconductor carries on in painless equilibrium while a burning log, or a star, is a rolling catastrophe of morally relevant experience. Don't try to refute this particular criterion (its inventor can take care of themselves). Instead, write the desiderata list: what ANY theory that grounds moral patiency in fundamental physics would have to deliver before the question of its truth even gets going. For each requirement, give the case or consideration that makes it a requirement, and mark whether it's non-negotiable or just one camp's preference.

  Here's what I think it has to handle — tell me what I'm missing. It must get the boring cases right: an awake human in pain has status; a human under general anaesthesia presumably doesn't, though the theory had better say why without special pleading. It must not make moral status depend on our choice of coarse-graining, since physics descriptions are level-relative and moral status presumably isn't. It must distinguish having some status from how much status, and mere sentience from valenced experience — a criterion can find feeling everywhere and still find nothing good or bad anywhere. It must survive the combination problem: if micro-experiences exist, do they compose into subjects, and where does one subject end and the next begin? It must have something to say about aggregation across the cosmos, because if the criterion is right then the sun's moral weight outweighs the Earth's by a genuinely horrifying margin and someone has to say whether that's a result or a reductio. And it must be consistent with something like causal closure without rendering experience so epiphenomenal that we could never know about it — which would be an odd position for a theory argued for on experiential grounds.

  The part I care most about: which pairs of desiderata look jointly unsatisfiable, and which single requirement knocks out the most candiates people actually defend. If the list itself is a result — no theory could meet all of it — say so plainly rather than quietly relaxing something. Keep the weight on the criteria and their motivating cases, not on a scorecard; a couple of sentences each on how the thermodynamic criterion and a more standard integration-or-complexity-based panpsychism fare against the list is plenty.

  British English throughout, please. End with a final line of the form \answer{...} naming the one requirement you'd keep if you could only keep one.
reasoning: |-
  Okay, the user is designing a grad seminar on panpsychism and ethics with a unique backward session. They want to establish desiderata for any theory grounding moral patiency in fundamental physics before examining actual theories. Their proposed criteria include handling "boring cases" like pain states, avoiding coarse-graining dependence, distinguishing types/degrees of status, solving the combination problem, addressing cosmic aggregation, and maintaining causal efficacy without epiphenomenalism. 

  Hmm, the user's clearly deeply versed in philosophy of mind and physics—this isn't some undergrad's half-baked thesis. Their frustration with handwavy panpsychist ethics shines through; they want steelman criteria that expose theoretical cracks. The thermodynamic criterion example feels deliberately provocative—a stress test for desiderata. 

  Right, let's systematise their implicit asks. First, they need completeness: did they miss any crucial requirements? Their list covers epistemology but skips metaphysical parsimony—any such theory mustn't multiply entities beyond necessity. Also, they haven't mentioned temporal continuity: how does moral status persist through time? A dissipating wave vs. a static crystal might test this. 

  Second, their "jointly unsatisfiable" request is key. Take coarse-graining independence and causal efficacy: if physics descriptions are level-relative but consciousness must cause behaviour, you risk either status arbitrariness or overdetermination. And cosmic aggregation plus subject unity? If the sun's suffering matters, is it one subject or septillion—and how to sum that? 

  The "one requirement to keep" finale is sharp. If forced, non-arbitrariness (coarse-graining) feels foundational—without it, ethics collapses into perspective. But wow, making that compatible with causal closure... 

  *glances at their "boring cases" example* Clever trap: anaesthesia. Any theory must explain why blocking neural integration suspends status without denying micro-experiences. The thermodynamic criterion fails here spectacularly—superconductors' painlessness is ad hoc if entropy defines suffering. 

  *scribbles mental note* Must emphasise how desiderata interact: e.g., solving combination problem might worsen cosmic aggregation ("trillions of micro-subjects in the sun!"). User will relish that tension. 

  Final answer pivots on meta-ethics: if morality isn't observer-relative, coarse-graining independence is non-negotiable. Hence \answer{Non-arbitrariness requirement}. Though honestly, the whole list feels like a Kobayashi Maru test—which might be their point.
answer: |-
  Here is a structured list of desiderata for *any* theory grounding moral patiency in fundamental physics, incorporating your points and adding critical omissions. Each requirement is justified, categorised as non-negotiable (NN) or preference (P), and illustrated with its motivating case.

  1.  **Non-Arbitrariness / Coarse-Graining Independence (NN):** Moral status must not depend on our descriptive scale (e.g., microphysical vs. macrophysical). Physics describes the same system differently at different levels (e.g., a gas as particles or pressure/temperature fields). If moral patiency hinges on a specific description (e.g., "irreversible processes"), but that description isn't fundamental (entropy production depends on coarse-graining), status becomes observer-relative – an ethical non-starter.
      *   *Motivating Case:* Is a dissipating electrical resistor suffering? If described microscopically (electron scattering), it might meet the thermodynamic criterion; described macroscopically as an idealised ohmic component, it might not. Status shouldn't flip with perspective.
      *   *Thermo Criterion:* Fails disastrously; entropy production is definitionally coarse-grained.
      *   *Integration/Complexity (e.g., IIT):* May struggle if integration measures depend on system decomposition choices.

  2.  **Epistemic Viability / Anti-Epiphenomenalism (NN):** The theory must be consistent with physical causal closure *and* allow conscious states to be knowable. If experience is utterly causally inert ("strong epiphenomenalism"), we could never form justified beliefs about it – including the belief in panpsychism itself. It must explain how experience, grounded in fundamental physics, can be detected or inferred.
      *   *Motivating Case:* Arguing for panpsychism based on the "hard problem" presupposes we *know* consciousness exists. If consciousness plays no causal role whatsoever, this knowledge becomes inexplicable.
      *   *Thermo Criterion:* Needs to explain how suffering-as-entropy-production causally interacts with, or is detectable by, neurobiology.
      *   *Integration/Complexity:* Often posits consciousness as intrinsic to causation/information, aiding epistemic access but raising combination issues.

  3.  **Subject Unity & Boundaries (NN):** The theory must solve, or compellingly address, the "Subject Combination Problem." If fundamental entities have micro-experiences, how/why do they combine into unified macro-subjects (like us)? Crucially, it must specify criteria for individuating subjects (Where does one end and another begin?).
      *   *Motivating Case:* Does a galaxy cluster teeming with micro-experiential entities constitute one vast suffering subject, myriad tiny subjects, or something else? Ethical concern demands knowing *who* (or what) is suffering.
      *   *Thermo Criterion:* Silent on combination/subjecthood. Is the burning log one suffering entity or countless suffering particles?
      *   *Integration/Complexity (e.g., IIT):* Explicitly addresses this via integration measures (Φ), defining subjects by maximal integrated information. Controversial but offers a criterion.

  4.  **Valence Specification (NN):** The theory must distinguish mere sentience (experience) from valenced experience (pleasure/suffering) and specify what constitutes positive vs. negative valence. Finding "feeling" everywhere is insufficient for ethics; we need to know *how* it feels.
      *   *Motivating Case:* A rock or a photon might be sentient on some views, but is it suffering? A theory must say *what physical feature* makes an experience bad, not just that it exists.
      *   *Thermo Criterion:* Explicitly links suffering to irreversible entropy production. Bold, but faces coarse-graining and anaesthesia problems.
      *   *Integration/Complexity:* Often struggles here; high integration might correlate with intensity, but valence remains underspecified (is highly integrated experience good, bad, or neutral?).

  5.  **Scalar Moral Weight / Differentiation (NN):** The theory must provide a principled basis for *degrees* of moral status or weight. Not all sentient entities warrant equal consideration. It must distinguish minimal sentience from rich subjective life and define what factors modulate weight (e.g., intensity, complexity, duration of experience).
      *   *Motivating Case:* A bacterium vs. a human. Presumably different moral weight. The theory must say *why* based on physics, not just assert it.
      *   *Thermo Criterion:* Implies suffering scales with entropy production rate/magnitude, offering scalar weight. Raises cosmic aggregation horror.
      *   *Integration/Complexity:* Typically links weight to degree of integration/complexity (e.g., Φ value), providing scalar differentiation.

  6.  **Consistency with "Boring Cases" (NN):** The theory must deliver plausible verdicts on uncontroversial cases (e.g., awake human in pain has high status/negative valence) and explain apparent absences (e.g., why a human under general anaesthesia seemingly lacks morally relevant experience).
      *   *Motivating Case:* General Anaesthesia. If micro-consciousness is ubiquitous, why does anaesthesia abolish the macro-conscious experiences that matter ethically? The explanation must avoid special pleading for brains. A rock under anaesthesia is meaningless; a human isn't.
      *   *Thermo Criterion:* Struggles. Anaesthesia reduces brain entropy production? But fundamental particles in the brain might still produce entropy. Why does *their* suffering cease to matter collectively? Special pleading risk.
      *   *Integration/Complexity:* Better equipped; anaesthesia disrupts the high-level integration necessary for macro-subjecthood/rich experience, though micro-experience might persist.

  7.  **Cosmic Aggregation Tractability (P):** The theory should offer a framework for reasoning about the aggregate moral significance of ubiquitous low-level sentience/valence, especially given the vast scales of the universe. It needn't solve it immediately but must not render ethics obviously absurd or paralyzing.
      *   *Motivating Case:* The Sun vs. Earth. If suffering tracks entropy, the Sun's output dwarfs Earth's biosphere. Does this imply astronomical suffering outweighing all Earthly concerns? The theory must engage with this consequence, not ignore it.
      *   *Thermo Criterion:* Predicts this directly. Is it an acceptable result or a *reductio*? Requires serious engagement.
      *   *Integration/Complexity:* Might minimise this by restricting significant moral status to highly integrated systems (like brains), though ubiquitous minimal micro-experience could still aggregate problematically.

  8.  **Metaphysical Parsimony / Non-Adhocness (P):** The grounding in fundamental physics should be natural, not requiring excessive new fundamental properties or laws solely to rescue ethical intuitions. The link should feel less like a bolt-on and more like a revelation of existing structure.
      *   *Motivating Case:* Does the theory posit "proto-valence" as a fundamental property just to make ethics work, or does valence emerge naturally from uncontroversial physical features in a non-arbitrary way?
      *   *Thermo Criterion:* Posits a direct, simple link to a known physical process (entropy production), but risks being ad hoc regarding *why* this specific process = suffering.
      *   *Integration/Complexity:* Argues consciousness/valence is intrinsic to information processing/structure, aiming for parsimony by unifying physics and mind.

  **Joint Unsatisfiability & Knock-Out Power:**

  *   **Potentially Jointly Unsatisfiable:** **Non-Arbitrariness (1)** and **Subject Unity/Boundaries (3)** conflict sharply with **Cosmic Aggregation Tractability (7)**. Avoiding coarse-graining dependence (1) and clearly defining subjects (3) might force recognition of near-infinite micro-subjects with minimal but ubiquitous valence, leading to an intractable aggregation problem (7) where the suffering of interstellar dust clouds dominates ethics. Conversely, avoiding (7) might require ad hoc constraints on (1) or (3) (e.g., only complex aggregates count, reintroducing arbitrariness).
  *   **Knock-Out Requirement:** **Non-Arbitrariness / Coarse-Graining Independence (1)** is arguably the most devastating. Many intuitively plausible criteria (like complexity, integration, structure, even specific processes like computation) *are* description-level-relative. If moral status depends on a description choice, the theory collapses into ethical relativism or subjectivism disguised as physicalism. This requirement likely sinks the most candidates implicitly relying on macro-level properties without a fundamental microphysical grounding that avoids the coarse-graining problem.

  **Is the List Satisfiable?** It is *extremely* demanding. While no single requirement is logically impossible to meet, satisfying *all* simultaneously – particularly Non-Arbitrariness, Subject Unity, and avoiding Cosmic Aggregation absurdity – seems currently beyond any extant theory and presents profound conceptual challenges. The list functions less as a checklist for a viable theory and more as a rigorous diagnostic tool exposing the deep difficulties of the project.

  \answer{Non-Arbitrariness / Coarse-Graining Independence}
