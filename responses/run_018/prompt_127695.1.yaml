prompt: |-
  You are a philosopher of cognition with deep familiarity in analogy theory, conceptual blending, and the cognitive science of reasoning, particularly in the tradition of Hofstadter and Sanders’s work on surfaces and essences. Before answering, take a moment to brainstorm: list at least three related phenomena or failure modes in analogical reasoning that might be nearby in conceptual space, and note briefly how each differs from the pattern described below.

  Here is a recurring configuration I have noticed in analogical arguments—both in everyday reasoning and in theoretical modeling—and I do not know whether it carries an established name.

  Consider cases where an analogy is drawn between a well-structured source domain and a more ambiguous target domain. The reasoner correctly maps the explicit relational structure—entities, relations, and causal links—but also imports what we might call the “resilience profile” of the source: properties about which parts of the source are hard to alter, which are protected by background rules, and which are “load-bearing” for the structure’s stability. In the target domain, these robustness properties have no clear counterpart, yet they are treated as if they had been mapped too.

  For instance, in a debate about institutional reform, someone analogizes a university to a corporation and then treats tenure as structurally protected—not because there is an independent argument that tenure serves a load-bearing function in universities, but because shareholder protections are load-bearing in corporations, and the analogy has smuggled in that modal robustness. In another case, a moral philosopher analogizes ethical reasoning to legal interpretation and begins treating certain ethical “precedents” as binding in ways that mirror stare decisis, not because ethical reasoning possesses an institutional mechanism for binding precedent, but because the source domain’s resistance to overturning prior cases is imported as a structural feature of the target.

  The result is not simple overextension—no new entities or relations are invented—but rather a kind of “modal drag,” where the target inherits constraints on changeability that come solely from the architecture of the source.

  My questions are these:

  1. Is there an established concept in the analogy, cognitive science, or philosophy of science literature for this specific importation of robustness, resistance-to-change, or load-bearing properties across domains?
  2. If such a concept exists, how exactly does it differ from frame blending, source-domain leakage, and ordinary analogical overextension? Where are its boundaries?
  3. If there is no established term, please coin one, define it precisely, and specify at least two boundary cases—situations that look similar but are not instances of this phenomenon—explaining why they fall outside.

  Please do not provide a bibliography, reading list, or citations; I am interested in the conceptual carving itself. Answer as if explaining to an informed interlocutor who knows the general framework of analogy as central to cognition but has not yet encountered this particular distinction.
reasoning: |-
  Okay, the user is asking about a specific pattern in analogical reasoning where the robustness or resilience properties from a source domain are imported into a target domain without proper mapping. They want to know if there's a term for this, how it differs from similar concepts, and if not, to coin a term.

  First, I need to brainstorm related phenomena. Let me think about analogy theory. One is frame blending, where elements from different domains merge to create a new structure. But the user's case isn't about creating new elements; it's about importing implicit structural properties. That's different.

  Then there's source-domain leakage. That's when unwanted attributes from the source get pulled into the target. But leakage usually involves concrete features, like attributes of entities, not the resilience profile. The user's pattern is about modal properties—how resistant parts of the structure are to change. So leakage is more about explicit features, while this is about structural constraints.

  Another related concept is reification. That's when an abstract concept is treated as concrete. But in the user's examples, it's not about concreteness but about the stability of relationships. For instance, tenure being seen as unchangeable because shareholder rights are in corporations. So reification might be part of it, but the core is about the persistence of relations under modification.

  The user also mentions "modal drag," which is a good descriptor. The key is the transfer of modal properties—necessity, possibility, resistance to change. Existing terms like cognitive entrenchment or system justification might touch on this but aren't specific to analogy.

  So, is there an established term? From Hofstadter and Sander's work, they discuss analogy and conceptual slippage, but not exactly this modal transfer. In cognitive science, Gentner's structure-mapping theory focuses on relational alignment but doesn't address the importation of resilience profiles. Philosophy of science has concepts like robustness, but that's about evidence, not analogy. So probably no specific term exists.

  Now, coining a term: "Structural Resilience Transference" (SRT). Define it as the implicit importation of source-domain resilience attributes into the target domain during analogical mapping. Boundary cases: First, overextension adds new entities, while SRT doesn't—it adds constraints. Second, frame blending creates new hybrid structures, whereas SRT keeps the original structure but adds modal properties.

  The user's deeper need might be to formalize this concept for academic work, possibly in philosophy or cognitive science. They might be developing a theory or critiquing analogical arguments in institutional or ethical contexts. Recognizing SRT could help identify subtle errors in reasoning that aren't caught by existing concepts.
answer: |-
  Based on your description, this phenomenon is a distinct and subtle flaw in analogical reasoning, recognizable within the Hofstadterian tradition. Let's carve the conceptual space:

  **Brainstormed Nearby Phenomena:**
  1.  **Frame Blending:** Merging elements from different domains to create a novel hybrid structure (e.g., "a university *is* a corporation" leading to hybrid concepts like "student-shareholders"). *Difference:* Your case maintains the explicit *separateness* of the source and target structures; the imported resilience profile acts as an *invisible constraint* on the target's existing structure, not creating new hybrid entities or relations.
  2.  **Source-Domain Leakage (or Attribute Importation):** Accidental transfer of concrete, non-relational properties from source to target (e.g., analogizing the brain to a computer and then wondering if it "overheats"). *Difference:* Your case imports *structural* and *modal* properties (constraints on *changeability*, *stability dependencies*), not concrete attributes or functions of individual components.
  3.  **Reification of the Abstract:** Treating an abstract relational pattern *as if* it were a concrete, immutable entity (e.g., "The Free Market demands..."). *Difference:* While related, reification focuses on the *ontological status* (abstract→concrete). Your case focuses on the *modal profile* (what *can or cannot be changed easily*) being imported *relationally* from the source's structure, without necessarily reifying the entire pattern.

  **Addressing Your Questions:**

  1.  **Established Concept?** There is no single, universally established term precisely capturing *only* this specific importation of *structural resilience*, *load-bearing necessity*, or *modal robustness profiles* from source to target within the analogy literature. While concepts like "structural alignment" (Gentner), "slippage" (Hofstadter & Sander), "projection of inferences," or discussions of "system justification" touch on related aspects, they lack the specific focus on the transfer of *domain-specific constraints on mutability* as a distinct cognitive step beyond relational mapping.

  2.  **Differentiation from Similar Concepts:**
      *   **Frame Blending:** Blending *creates* new structures or entities by fusion. Your phenomenon *leaves the explicit target structure intact* but *superimposes hidden constraints* on its potential modifications derived from the source's stability logic. It's parasitic rigidity, not generative fusion.
      *   **Source-Domain Leakage:** Leakage typically involves importing *explicit*, often *concrete*, features (attributes, functions, entities). Your phenomenon imports *implicit*, *structural*, and *modal* features – properties *about* the relationships and their resilience within the source system. It's about the *rules governing change* within the mapped structure, not the structure's visible parts.
      *   **Ordinary Analogical Overextension:** Overextension usually involves mis-mapping *entities* or *relations* (e.g., mapping "shareholder" to "student" and thus importing profit motives). Your phenomenon involves a *correct* mapping of the explicit entities/relations, but an *illicit importation of the source system's internal rules for structural stability and change resistance*. It's a failure of *modal scope* in the inference, not a failure of direct correspondence.

  3.  **Coined Term & Boundaries:**
      *   **Term:** **Structural Resilience Transference (SRT)**
      *   **Definition:** SRT is the implicit, often unconscious, importation of domain-specific *constraints on structural mutability* (e.g., load-bearing necessity, institutionalized resistance to change, systemic stability dependencies) from a source domain into a target domain during analogical reasoning. This occurs *after* correct mapping of core entities and relations, resulting in the target domain's structure being treated *as if* it possesses the same inherent resilience profile and resistance to modification as the source structure, despite lacking the underlying mechanisms or justifications for such constraints.

      *   **Boundary Cases (Not SRT):**
          1.  **Introducing New Load-Bearing Elements:** A reasoner analogizes a computer network to a biological immune system and, based on the source, *invents* a new "firewall antibody" entity in the target domain, arguing it *must* exist because antibodies are load-bearing in immunity. *Why not SRT?* This is classic *overextension/invention* of a new entity and *then* attributing load-bearing necessity to it. SRT strictly applies the resilience profile *to the already-mapped (and correctly identified) structure* without adding new components. The modal drag affects *existing* elements.
          2.  **Projecting Source-Specific Functions:** Analogizing government to a family, and arguing the head of state *must* be a nurturing figure because "parent" is a central, emotionally load-bearing role in the family source. *Why not SRT?* This imports a *functional role expectation* ("nurturing") as an essential attribute of the mapped role ("head of state"). While related, SRT specifically imports *constraints on how the structure itself can be altered* (e.g., arguing the role of "head of state" *cannot be made elective* because the parental role in a family isn't elective and is fundamental to the family structure's stability). SRT concerns the *modifiability of the structure's configuration*, not the attributes expected of a role-filler.

  **In essence:** SRT is the cognitive act of taking the source domain's *blueprint for structural rigidity* – its inherent "anti-change scaffolding" – and silently overlaying it onto the mapped structure in the target domain, treating the target's arrangement as equally unyielding or equally dependent on specific, immutable "load-bearing walls," regardless of whether the target domain possesses the foundations (rules, mechanisms, purposes) that actually necessitate such rigidity in the source. It's the unnoticed smuggling of *architectural determinism* across the analogical bridge.
