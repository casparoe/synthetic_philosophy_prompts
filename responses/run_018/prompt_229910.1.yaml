  ### Decision Tree for Sorting Positions in the Debate on True Contradictions and Paraconsistent Logic

  This decision tree uses concrete cases to sort respondents into one of six positions without prior knowledge of the labels. The tree is structured around three key dividing questions, each anchored to a specific case. The four required cases appear at branch points: (1) a liar sentence ("This sentence is false"); (2) a borderline case of vagueness (e.g., the exact moment when someone ceases to be a child); (3) an inconsistent legal code (e.g., one law requires X, another forbids X); (4) the principle of explosion (from a contradiction, everything follows). An additional branch point separates two leaves that the initial cases leave tangled.

  #### Decision Tree
  1. **Starting Question: Explosion**  
     Consider a scenario where two witnesses contradict each other: one says "The suspect was at the crime scene," the other says "The suspect was not at the crime scene." If you accept both claims as premises, must you then accept *any arbitrary conclusion* (e.g., "The moon is made of cheese")?  
     - **Yes** (Explosion holds) → Proceed to Question 2A.  
     - **No** (Explosion fails) → Proceed to Question 2B.  

  2. **Question 2A (for those who accept explosion): Trivialism**  
     Is *every statement true* (e.g., "2 + 2 = 5," "Snow is black," and "This tree has six leaves" are all true simultaneously)?  
     - **Yes** → **Trivialism**.  
     - **No** → **Classical logic**.  

  3. **Question 2B (for those who reject explosion): Liar Sentence**  
     Consider the liar sentence: "This sentence is false." Is this sentence *both true and false*?  
     - **Yes** → Proceed to Question 3.  
     - **No** → Proceed to Question 4.  

  4. **Question 3 (for those who say the liar is both true and false): Legal Code Contradiction**  
     Consider an inconsistent legal code: Law A requires all citizens to donate blood annually, while Law B forbids blood donation entirely. Is the resulting contradiction *true in reality* (i.e., citizens are both required and forbidden to donate blood)?  
     - **Yes** → **Full-strength (ubiquitous) dialetheism**.  
     - **No** → **Restricted (semantic) dialetheism**.  

  5. **Question 4 (for those who say the liar is not both true and false): Borderline Vagueness**  
     Consider the exact moment when a person ceases to be a child and becomes an adult. At that precise instant, is the statement "This person is a child" *neither true nor false*?  
     - **Yes** → **Paracomplete or truth-value-gap approaches**.  
     - **No** → **Paraconsistent non-dialetheism**.  

  ---

  #### Leaf Diagnoses (in terms of case answers)
  - **Classical logic**: You accept explosion (contradictions force arbitrary conclusions) but reject trivialism (not everything is true).  
  - **Trivialism**: You accept explosion and hold that every statement is true (including contradictions and arbitrary claims).  
  - **Full-strength (ubiquitous) dialetheism**: You reject explosion, hold that the liar sentence is both true and false, and assert that the legal code contradiction is true in reality (true contradictions occur everywhere).  
  - **Restricted (semantic) dialetheism**: You reject explosion, hold that the liar sentence is both true and false, but deny that the legal code contradiction is true in reality (true contradictions are confined to semantic paradoxes).  
  - **Paracomplete or truth-value-gap approaches**: You reject explosion, deny that the liar sentence is both true and false, and hold that the borderline case is neither true nor false (gaps resolve vagueness/paradoxes).  
  - **Paraconsistent non-dialetheism**: You reject explosion, deny that the liar sentence is both true and false, and deny that the borderline case is neither true nor false (reasoning with inconsistencies must not explode, but reality is consistent).  

  ---

  #### Empty Cells and Non-Standard Positions
  The tree covers all six leaves, but some combinations of answers are unoccupied or occupied by non-standard positions:  
  - **Explosion accepted, gaps accepted, trivialism rejected** (Path: Explosion "Yes" → Trivialism "No" but also affirming gaps for liar/borderline):  
    This cell is **occupied by supervaluationism** (an explosion-accepting, gap-based approach to vagueness/paradoxes). It is not one of the six leaves but is a recognizable position. Supervaluationism accepts explosion and assigns gaps to borderline cases (e.g., the transition from child to adult is indeterminate), but it does not fit classical logic (which rejects gaps) or the paracomplete leaf (which rejects explosion).  
  - **Explosion rejected, liar not both true/false, borderline not gappy, but gaps for liar** (Path: Explosion "No" → Liar "No" → Borderline "No" but affirming gaps for the liar):  
    This cell is **unexplored or unattractive**. It mixes a gap approach to the liar with a non-gap approach to vagueness, lacking a coherent motivation. Most gap theories (e.g., paracomplete) apply uniformly to paradoxes and vagueness.  
  - **Explosion rejected, liar both true/false, legal code not true contradiction, but true contradictions in non-semantic domains** (Path: Explosion "No" → Liar "Yes" → Legal code "No" but affirming true contradictions elsewhere, e.g., vagueness):  
    This cell is **incoherent or unattractive**. Restricted dialetheism limits true contradictions to semantic/set-theoretic domains; extending them elsewhere (e.g., vagueness) without legal code contradictions is unmotivated and unstable.  

  ---

  #### Unseparated Leaves and a Potential Additional Question
  The tree cannot separate **paracomplete approaches** from **supervaluationism** (which occupies an "empty" cell). Both assign gaps to the borderline case, but supervaluationism accepts explosion, while paracomplete approaches reject it.  
  - **Additional question to separate them**:  
    For a borderline statement like "This person is a child," does its truth require it to be true in *all possible precisifications* (e.g., under all ways of sharpening "child")?  
    - **Yes** → Supervaluationism (accepts explosion, gaps via super-truth).  
    - **No** → Paracomplete approaches (reject explosion, gaps via non-bivalence).  
    Adding this question would create a seventh leaf for supervaluationism, but the tree is limited to six leaves.
