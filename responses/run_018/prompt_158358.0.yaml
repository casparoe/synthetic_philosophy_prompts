prompt: |-
  hey, I'm putting together some notes on archives and power for a class. A friend in my study group keeps insisting that an archive is basically just a library — books sit on shelves, people check them out, and if certain groups never wrote anything that's a problem for society not for the archivist. She uses this to argue archivists should stay completely hands-off and not try to "fix" whose voices are missing, since the archive itself is neutral storage. But I recently ran into this idea that provenance isn't just a label you stick on a box but actually structures what can be retrieved later and how records relate to each other, which made me think the library analogy might be smuggling in a false picture of neutrality. Can you audit how far the analogy actually holds? I want the correspondence mapped out — what's the librarian, what's the catalog, what's a missing book versus a missing record, what's the patron, and where the two systems seperate — then the places it breaks, especially around original order, transfer of custody, and the fact that archives acquire through donation or legal mandate rather than purchase. Does the hands-off conclusion survive once those disanalogies are on the table, or was the analogy carrying the whole argument? Give me a committed answer that picks a side and defends it, not a balanced both-sides essay. And please write it all in one continuous block with no headings, no bullet points, no bold text, just prose like you'd send in an email. A typo or two is fine.
