answer: |-
  Your friend’s library analogy fundamentally misrepresents archives and smuggles in a dangerous illusion of neutrality that doesn’t survive scrutiny. Let’s map the correspondences first. The librarian is akin to the archivist, managing the collection. The library catalog parallels the archival finding aid or inventory, guiding users to materials. A missing book in a library is like a missing record in an archive – an absence. The patron is the user/researcher in both settings. Superficially, both involve storing items and providing access. But this is where the analogy ends and the critical disanalogies dismantle the "neutral storage" argument and the hands-off imperative.

  The break starts with *original order* and *provenance*. A library deliberately *imposes* order: books are classified by subject (Dewey, LC), stripped from their original context, and made interchangeable within categories. An archive *preserves* the inherent structure and relationships of records as they were created and used by the originating entity. Provenance isn't just a label; it dictates arrangement and access. How records are grouped (e.g., by department, by function, by creator) fundamentally shapes what connections a researcher can see and what narratives can emerge. A library book on labor unions stands alone; an archival file on a strike sits within police surveillance records, company memos, and union minutes – its meaning is relational, structured by the archivist’s commitment to original order. Choosing *to maintain* that original order is an active interpretive act, not passive shelving.

  *Transfer of custody* is another fracture point. Libraries primarily *purchase* items as discrete commodities, selecting individual titles based on policy. Archives typically *acquire* entire bodies of records through donation or *legal mandate* (e.g., government records schedules, court-ordered transfers). This isn't selecting books off a vendor list; it's negotiating with creators (often powerful institutions or individuals) or complying with laws that dictate what must be preserved. What gets offered for donation? What records fall under a mandate? These decisions happen long before the archivist sees the material and are saturated with power dynamics. The archivist accepting a corporate executive's papers while lacking equivalent records from the factory floor workers isn't neutral; they are replicating existing societal power imbalances through acquisition choices constrained by what the powerful choose to relinquish or what the state deems worthy of mandate.

  This leads directly to the fatal flaw in the "missing voices are society's problem" stance. In a library, if a book by a marginalized group isn't published or purchased, the library can theoretically acquire it later if it becomes available. The "gap" is potentially fillable. In archives, the absence is often *irreversible*. Records that were never created (due to oppression, illiteracy, surveillance), deliberately destroyed (to hide wrongdoing or disempower), or never offered for donation (because the creators lacked resources or didn't see their story as "important") are often *gone forever*. The archive isn't just missing a "book"; it lacks the foundational evidence of entire experiences and power struggles. An archivist adhering strictly to a hands-off, "take what is offered" approach *actively perpetuates* this silencing. They become complicit in the marginalization by accepting the archive as defined solely by the powerful who created and saved records, or by the narrow scope of legal mandates. Waiting for donations from systematically silenced communities is not neutrality; it’s endorsement of the status quo.

  The idea that the archive is "neutral storage" completely ignores the cumulative effect of provenance-based arrangement, the power-laden nature of acquisition (donation/mandate vs. purchase), and the irreversible nature of archival silence. An archivist deciding *which* donations to pursue (within resource limits), *how* to interpret and describe original order in a finding aid, *what context* to provide about the creators and the gaps – these are all active interventions shaping what can be known. Your friend’s library analogy collapses under the weight of archival principles and practices. The hands-off conclusion doesn't survive; it was entirely propped up by the false neutral framing of the analogy. Archivists aren't just shelving books; they are curators of societal memory, and pretending otherwise abdicates their responsibility to actively confront the power imbalances embedded in the historical record they steward. Neutrality in the face of systemic silence is a myth; it’s a choice to side with the documented powerful.
