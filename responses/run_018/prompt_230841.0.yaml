prompt: |-
  I am a novelist, and for the past year I have been compiling small scenes — some from trial transcripts, hospital notes and planning meetings I have read for a novel, some from ordinary life — in which one person is believed and another is not. I have strong and apparently inconsistent judgements about these scenes, and I would like you to act as a professional philosopher working in social epistemology and help me find the principle behind them. Please think carefully, begin by sorting the cases and testing candidate principles against them, and do not settle for a slogan; I want precision and an honest statement of what will not fit.

  Here are the cases and my verdicts. (1) A forensic accountant who is being paid by the defendant's commercial rival gives evidence in a fraud trial, and the court directs the jury to give it little weight; I find that wholly sensible. (2) A man with advanced dementia gives confused, confabulated testimony about a road accident and the police set it aside; I see no wrong in that. (3) A gallery owner dismisses a young woman painter's account of her own canvases as the enthusiasm of a collector's wife without looking at the work or checking her facts; I am certain something unfair is being done to her. (4) A patient reports severe post-operative pain, but the ward doctor assumes he is exaggerating in order to obtain opioids, largely because he is a young Black man and the ward has a standing assumption that patients of his sort exaggerate pain; no analgesia is given, and when the pain proves to be a surgical complication, the notes describe him as a poor historian. That strikes me as a serious wrong and not merely a clinical error. (5) A man with two old convictions for shoplifting reports that two officers beat him in a car park; the unit reviewing his complaint discounts it almost entirely on the strength of that record and does not pull the CCTV that would settle the matter. Here I am genuinely torn: his record seems to me relevant, but refusing to look at available evidence because of it also seems to insult him. (6) A science writer with a stammer gives a careful and well-evidenced account of a flood model to a town council; the chair later says he convinced no one because he could not get the words out, while a fluent oil-company consultant who made several factual errors was judged credible. I regard the chair's response as a clear injustice, though it does not feel exactly like (3) or (4). (7) An uncle of mine, a serial fabulist who has told the same invented story about meeting the Queen for forty years, reports witnessing a burglary; I would give his word almost no weight, and I do not believe I wrong him by doing so.

  My working hunch is that a hearer wrongs a speaker only when the hearer lowers the speaker's credibility on account of the social group the speaker belongs to, and not when the discount tracks something about the particular individual — their record, their interests, or their present condition. But I can already see the strain: that hunch seems to excuse the chair in (6) by treating the man's stammer as a present condition of his, and it also seems to excuse the investigators in (5) because they used the man's own record; yet I am sure about (6) and uneasy about (5). Please repair this principle or replace it. I want the final principle stated precisely, with each clause tied to the case that motivates it; I want to know what it predicts about further cases I have not listed, such as a defendant who is doubted because she testifies through an interpreter, or a witness who is believed too readily because she is a titled surgeon; and I want an honest accounting of which of my original verdicts, if any, the principle cannot accommodate and how I should revise them. Please write your answer in British English.
reasoning: |-
  Hmm, this is a fascinating epistemological puzzle from a novelist examining credibility assessments across diverse scenarios. The user has presented seven carefully observed cases where belief is granted or withheld, with strong but seemingly inconsistent moral intuitions about each. They're clearly wrestling with the tension between justified epistemic discounting and prejudicial dismissal.

  The core challenge lies in distinguishing when credibility assessments constitute epistemic injustice versus reasonable epistemic practice. Their provisional principle - that group-based discounting is wrong but individual-trait discounting is permissible - fails to account for their own intuitions in cases (5) and (6). The stammer in (6) feels like it should be protected, while the criminal record in (5) creates unease despite being individual.

  I need to develop a principle that reconciles these tensions. The key might lie in Miranda Fricker's concept of hermeneutical injustice - where social power imbalances distort credibility judgments. Also relevant is Elizabeth Anderson's work on how stereotypes function as cognitive shortcuts that bypass individual evaluation.

  For case (5), the discomfort likely stems from the investigators using the record not merely as probabilistic evidence but as a substitute for investigation - what José Medina calls "epistemic laziness." Whereas in (7), evaluating the uncle's testimony against his established pattern constitutes due diligence.

  The stammer case (6) reveals how fluency often unconsciously proxies for competence. Tommie Shelby's analysis of racialized credibility discounting applies here too - the chair essentially treats a speech impediment as epistemic deficiency rather than mere presentational difference.

  I'll propose a three-clause principle distinguishing: 1) prejudicial group-based discounting, 2) reasonable individual-trait discounting that still respects epistemic obligations, and 3) cases where traits become unjustly stigmatized through social power dynamics. The gallery owner (3) and patient (4) cases clearly violate clause 1, while the dementia case (2) fits clause 2. The torn case (5) reveals clause 3's necessity - the investigators failed their obligation to seek readily available counter-evidence.

  For novel cases: discounting testimony through an interpreter would generally violate clause 1 if based on language-group stereotypes, while over-crediting a titled surgeon exemplifies "positive" epistemic injustice. The principle won't perfectly resolve the uncle case (7) - some may argue complete dismissal wrongs him as a knower, but I'll maintain it as justified given the context.

  The novelist's instincts were sharp - their unease about (5) signaled where their initial principle was underinclusive. My refined version should preserve their correct intuitions while resolving the tensions through careful distinction-making.
answer: |-
  Your cases reveal a sophisticated tension between *epistemic justification* (reasons for belief) and *ethical obligations* (duties owed to speakers). Your hunch identifies a crucial axis – group vs. individual – but requires refinement to handle the complexities of power, prejudice, and the hearer's duties. Let's build a precise principle step-by-step, grounded in your verdicts and addressing the strains you identified.

  **Analysis & Sorting of Cases:**

  | **Case** | **Verdict** | **Discounting Factor** | **Type of Factor** | **Power/Social Stigma** | **Hearer's Duty Fulfilled?** |
  |----------|-------------|------------------------|-------------------|-------------------------|------------------------------|
  | (1) Forensic Accountant | Sensible | Paid by rival (financial interest) | Individual/Contextual | Low | ✓ (Court mitigated conflict) |
  | (2) Dementia Patient | Sensible | Cognitive impairment (medical condition) | Individual/Material | Low | ✓ (Police assessed reliability) |
  | (3) Gallery Owner | Unfair | Gender/Class (assumed "collector's wife") | Group/Stereotype | High (Art world hierarchy) | ✗ (No engagement with evidence) |
  | (4) Ward Doctor | Serious Wrong | Race (young Black man) | Group/Stereotype | High (Medical power, systemic bias) | ✗ (Ignored testimony, harmful outcome) |
  | (5) Complainant with Record | Torn | Criminal record (individual history) | Individual/Contextual | Medium (Police power) | ✗ (Failed to seek evidence) |
  | (6) Science Writer | Clear Injustice | Stammer (disfluency) | Individual/Physical | Medium (Platform access) | ✗ (Confused fluency with competence) |
  | (7) Serial Fabulist | Sensible | History of fabrication (individual pattern) | Individual/Behavioural | Low | ✓ (Pattern established over time) |

  **Key Observations:**
  1.  **Individual Factors Can Be Legitimate:** (1), (2), (7) show discounting based on specific, relevant individual traits (conflict of interest, cognitive impairment, established dishonesty) is often justified and not inherently wrongful.
  2.  **Group-Based Discounting is Wrongful:** (3), (4) involve discounting based on social group membership (gender/class, race) using harmful stereotypes. This constitutes *testimonial injustice* (Fricker, 2007), harming the speaker *as a knower*.
  3.  **The Strain Points (5 & 6) Reveal Deeper Principles:**
      *   **(5) Torn Feeling:** Your unease stems not from considering the record *at all*, but from the investigators using it as a reason to *abdicate their duty to investigate further* when readily available evidence (CCTV) existed. The wrong lies in the *epistemic laziness* and the *denial of epistemic opportunity* based on a stigmatised history, amplified by the power imbalance (police vs. individual with record).
      *   **(6) Stammer:** Discounting due to stammer is wrongful not (primarily) because it's an individual trait, but because:
          *   It conflates *presentation* (disfluency) with *content* (well-evidenced argument).
          *   It ignores readily available counter-evidence (the *content* of his speech).
          *   It leverages an unconscious bias favouring fluency as a proxy for competence/credibility, a bias often linked to ableism and social privilege (access to speech therapy, cultural norms).
          *   The fluent consultant's errors were disregarded, showing the bias wasn't about epistemic rigor but about *aesthetic performance*.

  **The Refined Principle:**

  **A hearer wrongs a speaker by unduly discounting their credibility when the discounting:**
  **(a) Is based significantly on the speaker's membership in a social group that is subject to prejudice or systemic disadvantage, rather than on an assessment of the speaker *as an individual* (Cases 3, 4); OR**
  **(b) Involves a failure by the hearer to fulfil a reasonable epistemic duty owed to the speaker in the specific context, particularly when:**
  *   **(i)** The hearer possesses significant power over the speaker's epistemic access or practical outcomes (Cases 4, 5, 6); *AND/OR*
  *   **(ii)** Credible, readily available evidence exists that could counter the initial grounds for discounting, yet the hearer neglects to seek or consider it (Cases 5, 6).**
  **(c) AND This discounting results in an unfair epistemic or practical harm to the speaker.**

  **Clause Breakdown & Case Motivation:**

  *   **(a) Group-Based Prejudice:** Directly addresses the core wrong in (3) and (4). The discounting stems from harmful stereotypes applied to social groups (gender/class, race), not individual assessment. *Motivated by: Cases 3, 4.*
  *   **(b) Failure of Epistemic Duty:** Captures the wrongs in (5) and (6) that your initial hunch missed.
      *   **(b)(i) Power & Access:** Highlights the hearer's position of authority (police, doctor, council chair) and its impact on the speaker's ability to be heard or believed. The power dynamic intensifies the duty. *Motivated by: Cases 4 (clinical power), 5 (institutional power), 6 (procedural power).*
      *   **(b)(ii) Neglect of Available Evidence:** Identifies the specific failure: refusing to look at CCTV (5) or ignoring the actual content of the argument due to its delivery (6). The hearer had an obligation to pursue easily accessible counter-evidence before dismissing the speaker. *Motivated by: Cases 5, 6.*
  *   **(c) Resulting Harm:** Ensures the principle targets actions with negative consequences – dismissal, lack of treatment, denial of justice, missed opportunity (Cases 3, 4, 5, 6).

  **Why This Resolves the Strain:**

  *   **(6) Stammer:** The wrong falls under (b)(ii) & (b)(i). The chair (powerful actor) failed the duty to evaluate the readily available evidence (the *content* of the science writer's argument) because he was distracted/misled by the stammer (an individual trait). He neglected available counter-evidence to his initial impression of incoherence. The stammer isn't discounted *per se*; the *failure to see past it to the evidence* is the wrong. The ableist bias *explains* the failure but the *wrong* is the neglect of duty.
  *   **(5) Criminal Record:** The wrong falls under (b)(i) & (b)(ii). The investigators (powerful institution) used the record as grounds to *avoid* their duty to seek readily available, highly probative evidence (CCTV) that could settle the matter. The record *might* justify initial caution, but not a refusal to investigate when easy means exist. The harm is denying the complainant a fair hearing based on stigma, amplified by institutional power.

  **Predictions for New Cases:**

  1.  **Defendant doubted due to testifying through an interpreter:**
      *   *Discounting purely because testimony is mediated:* Likely violates **(a)**. If the doubt stems from a stereotype about non-native speakers or mediated testimony being less reliable (without evidence of poor interpretation), this is group-based prejudice.
      *   *Concern about interpretation accuracy:* Potentially legitimate *if* based on specific evidence (e.g., known incompetence of *this* interpreter, observed inconsistencies). Merely the *fact* of interpretation isn't sufficient grounds for discounting under this principle.
  2.  **Titled surgeon believed too readily:**
      *   *Over-credibility due to title/profession:* Violates the spirit of the principle by demonstrating **positive testimonial injustice**. While the principle focuses on *undue discounting*, the core issue is credibility assessments distorted by prejudice (here, positive bias towards status/profession). The surgeon is wronged if their testimony is accepted uncritically *because* of their title, bypassing proper scrutiny they would otherwise receive, potentially leading to errors. This highlights a limitation: the principle focuses on discounting, not over-credibility. An expanded principle might address "undue weight" in both directions.

  **Honest Accounting: Fit with Original Verdicts & Revisions**

  *   **Fits Well:** (1), (2), (3), (4), (7) align clearly. (1,2,7) involve legitimate individual/contextual discounting without duty failure. (3,4) are clear cases of (a).
  *   **Explains the Strain in (5):** Your torn feeling is justified. The principle identifies the wrong not in considering the record, but in the investigators' failure of duty (b)(i, ii) using their power to avoid easily obtainable evidence. This validates your unease about the refusal to look at CCTV as insulting and unjust.
  *   **Captures (6):** The principle explains why discounting due to stammer is wrongful under (b)(i, ii) – failure to evaluate readily available evidence (content) due to a presentation flaw, abetted by the chair's power.
  *   **Potential Revision? (7) The Serial Fabulist:** You see no wrong. The principle agrees: discounting is based on a well-established *individual* behavioural pattern (not group prejudice), and no relevant epistemic duty is owed or breached in this informal context. However, consider: *Could* complete dismissal ever wrong him? If his report contained specific, verifiable details incongruent with his usual fabulations, a hearer *might* have a weak duty (b)(ii) to check those details if easily done, *if* the stakes were high (e.g., identifying a dangerous burglar). In your scenario, this seems unlikely. Your verdict stands as consistent with the principle.

  **Conclusion:**

  The core wrong in testimonial injustice is not *only* group-based prejudice **(a)**, but also the **failure of epistemic duty by powerful actors, especially when neglecting readily available counter-evidence (b)**. This principle precisely distinguishes legitimate credibility assessment (based on individual factors, fulfilled duties) from ethical wrongs involving prejudice, power abuse, or epistemic negligence. It validates your intuitive judgements across the spectrum, resolves the strains in (5) and (6), and provides clear guidance for novel cases. It acknowledges that individual traits *can* be relevant, but insists that their use does not absolve hearers in positions of power from their duty to engage reasonably and seek truth.
