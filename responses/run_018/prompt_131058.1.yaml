answer: |-
  ### 1. Brainstorm / Theory Check  
  **Rival Theories:**  
  - **Civic Duty Model:** Voting as obligatory participation for collective legitimacy. *Tension:* Mandatory attendance clashes with outsourced preference formation via HTV cards.  
  - **Expressive Individualism:** Ballot as personal moral statement. *Tension:* Ranking "least bad" candidates strategically contradicts pure sincerity; fines punish non-participation, not "incorrect" expression.  
  - **Strategic Instrumentalism:** Voting as maximizing desired outcomes. *Tension:* System legally ignores strategy—ballots are treated as sincere ordinal preferences, yet parties engineer preference flows.  

  **Key Inconsistency:** The state demands *your* ranking (enforced by fines) but permits parties to *script* that ranking, while the rules pretend all votes reflect genuine preferences.  

  ---

  ### 2. Practice in Concrete Terms  
  Australia requires all eligible voters to show up and rank every candidate in federal elections (compulsory voting + full preferential ranking). Parties distribute "how-to-vote" (HTV) cards at polling stations, advising voters on ballot numbering to direct preferences to allies. Votes are tallied via instant-runoff: if your top choice is eliminated, your vote flows to your next-ranked candidate. Fines apply for non-voting, but no penalty for using HTV cards. Public discourse acknowledges "lesser evil" rankings as pragmatic.  

  ---

  ### 3. Implicit Philosophy Reconstructed  
  The system presupposes a **hybrid theory** blending three commitments:  
  - **Duty First:** Voting is a non-negotiable civic obligation (enforced by fines), prioritizing participation as foundational to legitimacy.  
  - **Delegated Expression:** Individual expression is honored *formally* (your signature on the ballot) but accepts *practical delegation* to parties via HTV cards. Voters retain nominal autonomy ("you *could* ignore the card"), but the system assumes parties help voters navigate complexity.  
  - **Consequentialism in the Gaps:** Strategic ranking ("lesser evil" placements) is an *emergent* behavior tolerated because the ballot structure (full rankings + elimination rounds) *rewards* it functionally, even if legally unacknowledged.  

  **Core Tension Resolved by Design:** The state enforces the *act* of ranking but stays neutral on *how* voters form preferences. HTV cards bridge the gap between individual duty and collective coordination.  

  ---

  ### 4. Required vs. Compatible Elements  
  **Strictly Required:**  
  - Duty to participate (fines enforce *attendance*, not "correct" votes).  
  - Formal individualism (ballot submitted under your name as *your* ranking).  
  - Complete ordinal rankings (enables vote transfers).  

  **Compatible but Not Required:**  
  - Delegation via HTV cards (legally, you *could* number randomly).  
  - Strategic voting (system *functions* with it but doesn’t codify it).  
  - "Lesser evil" discourse (a cultural adaptation to the rules).  

  **The Fine vs. Delegation Paradox:** The duty is to *submit a ballot*, not to deliberate personally. Delegation is compatible because the system only cares about the *act* of ranking, not its provenance.  

  ---

  ### 5. What Breaks if We Swap the View  
  **Pure Expressive Model:**  
  - Drop compulsory voting (duty irrelevant to expression).  
  - Allow partial/incomplete rankings ("none of the above" option).  
  - Ban HTV cards (undermines personal sincerity).  
  - *Consequence:* Lower turnout, more fragmented results.  

  **Pure Strategic Model:**  
  - Abandon full preferential ranking (let voters bullet-vote for one candidate).  
  - Legalize vote-buying/contracts (if strategy is central).  
  - Remove fines (participation becomes optional).  
  - *Consequence:* Erosion of legitimacy, hyper-fragmentation, potential coercion.  

  ---

  ### 6. Bottom Line  
  The practice **has a coherent but minimalist implicit theory**: voting is a *procedural duty to submit a complete ordinal ballot*, agnostic about preference-formation. Delegation (HTV cards) and strategy ("lesser evil" talk) are *emergent adaptations* to the rules, not philosophically mandated. The hybrid holds because the state enforces *participation* and *ballot structure* while outsourcing preference guidance to civil society (parties). It’s philosophically *lean*—prioritizing stability and inclusivity over purity—but not underdetermined.
