  First, let's unpack their situation: 
  - They're clearly passionate about their simmballs concept (mental representations with physical causal power) but aware it's unconventional
  - The audience is hostile: closure fundamentalists, neural net reductionists, and causal exclusion hawks 
  - Their ask is tactical - not theory explanation, but survival tactics for Q&A

  Hmm... the real challenge here is balancing conviction with diplomacy. They can't win converts in one session, but they can avoid getting shredded. Key traps to anticipate:
  - Physical closure arguments will come first (it's the hammer they all swing)
  - The neural net enthusiast will try to dissolve the issue entirely
  - Causal exclusion is the landmine waiting in the middle

  *scribbles notes* 
  The concession strategy is crucial. If they open admitting "yes, substrate determines everything" it disarms the closure crew. Then pivot fast to "but here's how representations aren't epiphenomenal within that". 

  *winces* 
  The killer question is almost certainly about scale. If someone asks "How do simmballs interact without violating physics?" and they haven't modeled the coupling mechanics... that's the gut punch. Better steer them toward "emergent dynamics" handwaving than fake precision. 

  *checks watch* 
  For the reply drafts: 
  - Keep answers under 2 mins by design - seminar environments punish rambling 
