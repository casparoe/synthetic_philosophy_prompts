prompt: |-
  I run a two-hour workshop, once, for about 18 people — mostly public policy masters students, a handful of philosophy grad students, and usually two or three actual civil servants who sit in and quietly change the temperature of the room. It is a standalone session in a module on measuring wellbeing. No prep, no homework, no laptops if I can help it, printed handouts fine. It has to survive being run with 10 people or with 30, and it absolutely cannot depend on anyone in the room knowing anything about the real-world international happiness league tables or any actual country's data. Assume half of them have never thought about this for more than a minute.

  What I want them to feel in their hands, before anyone names it, is the gap between a country topping a happiness ranking and its citizens being happy. And specifically the difference between two complaints that people collapse constantly: that the index is a noisy or gameable proxy for a real quantity (a measurement problem, fixable in principle, throw more data and better questions at it and the gap shrinks), versus the complaint that there is no such quantity sitting behind the procedure for it to be a proxy for, so that which country is really happier has no answer the index is slowly converging on. I want them to run into the second one by discovering, on their own, that they can move their score without moving a single life.

  So: design me a game. Small teams are wellbeing ministries of invented countries, each with a printed population profile — and I want at least one subgroup in each profile that is badly off and structurally easy to make invisible. They get a limited annual survey budget and a pack of policy cards, and they are ranked against each other on an index they can see the formula for. The formula should be visible and simple enough that a team can sit down and work out what moves their number, but with enough moving parts that optimising it is not the same as helping anybody.

  Things I would like built into the rules rather than said out loud:

  - Two separate data feeds about their own population — something like a life-evaluation feed (the ladder-style question, answered once a year) and an experience feed (mood sampled at random moments). The ranking counts only one of them. Policy cards should split: some genuinely improve the experience feed but barely touch the evaluated one, some raise reported evaluation mainly by changing what people compare themselves to or what they think a good life is supposed to look like. Teams get forced to spend scarce budget on one.
  - A sampling frame with exclusions that look boring and administrative — hospitals, prisons, care homes, people without a fixed address, anyone who does not answer three contact attempts. Someone will notice that a policy which moves miserable people into those categories raises the national score. I want them to notice it, not be told it exists.
  - A compositional lever: miserable residents can be encouraged to leave, or cheerful ones recruited. Average goes up, nobody is better off, world total flat or worse.
  - Reference drift: the scale respondents use recalibrates as circumstances change, so a country can improve everyone's life and see its number sit still, or raise the number by lowering expectations. If you can build in the nasty structural consequence — that if responses partly track relative standing, not everyone can climb at once — please do, that is the bit I most want them to feel.
  - A time structure that rewards the wrong horizon, e.g. a rolling multi-year average plus a short electoral cycle, so harvesting credit for a predecessor's investment and dumping costs past the window is available as a strategy.
  - A round where the previous winner gets to propose one amendment to the international methodology. I really like that mechanic, because it makes the point that topping the ranking comes with the power to redefine what topping it means, but do whatever version of it actually works.

  Debrief: map three or four specific moments in play onto specific parts of the problem, including where the proxy-failure reading and the there-is-nothing-there reading come apart, and where the normative question — given a perfectly measured quantity, should a government spend money raising it rather than anything else — is a separate question again. Then, honestly: what will go wrong. I already expect one person to start meta-gaming in the first five minutes and spoil the discovery for everyone else, the civil servants to drag in real examples immediately, and at least one team to refuse the ugly card and lose because of it, which I think is fine but I am not sure how to handle without either rewarding cynicism or making the refusers feel naive. Also tell me which feature of this the game just cannot produce and I will have to say in so many words — my guess is something about whether wellbeing is the kind of thing that admits a single interpersonal scale at all, but you tell me.
reasoning: |-
  We are designing a two-hour workshop game for 18 participants (though scalable from 10-30) to explore the gap between happiness rankings and actual citizen happiness. The game will have teams acting as wellbeing ministries of invented countries, each with a population profile. The goal is to let participants discover that optimizing for a happiness index can be decoupled from improving actual lives.

  Key Design Elements:

  1. **Teams & Setup**:
     - Divide participants into small teams (3-5 people). Each team is the Wellbeing Ministry of an invented country.
     - Each team gets:
       - A printed "Population Profile" (see details below).
       - A set of "Policy Cards" (see below).
       - A "Survey Budget" (e.g., 100 units per round).
       - A handout with the "Global Wellbeing Index (GWI)" formula.

  2. **Population Profile**:
     - Each country has a population of 10 million (for simplicity) divided into subgroups. Example subgroups:
       - Urban professionals (30% of population, high baseline wellbeing)
       - Rural workers (40%, medium baseline)
       - Elderly (15%, medium to low, vulnerable to isolation)
       - Unemployed youth (10%, low)
       - **Invisible Group**: Homeless and institutionalized (5%, very low wellbeing) — this group is excluded from the survey by the sampling frame (see below).

  3. **Data Feeds**:
     - **Life Evaluation Feed (LE)**: Annual survey using the Cantril ladder (0-10 scale). This is the only feed used in the GWI.
     - **Experience Feed (EX)**: Random moment sampling (via app, 0-10 mood). Not used in GWI but available to teams for internal tracking (if they choose to spend budget on it).

  4. **Survey Budget & Sampling Frame**:
     - Teams must decide how to allocate their survey budget between LE and EX. LE is mandatory for the index, but EX is optional (gives insight into actual mood).
     - **Sampling Frame Exclusions**: The survey methodology excludes:
       - People in hospitals, prisons, care homes.
       - People without a fixed address (homeless).
       - Non-response: After 3 contact attempts, an individual is dropped.
     - Teams can see the exclusion rules. The invisible group (homeless/institutionalized) is entirely excluded.

  5. **Policy Cards**:
     - Each team gets an identical deck of policy cards. Each card has:
       - A title and a short description.
       - Cost (in budget units, one-time or annual).
       - Effects on LE and EX (which may differ).
       - Some cards may have secondary effects (e.g., moving people into excluded categories).
     - Example card types:
       - **Genuine Improvements**: E.g., "Mental Health Services": +0.3 EX, +0.1 LE (cost: 20 units). Improves actual mood but only slightly affects evaluation.
       - **Focusing Illusions**: E.g., "National Pride Campaign": +0.5 LE, -0.1 EX (cost: 15 units). Raises reported ladder by changing expectations, but might even reduce mood due to pressure.
       - **Exclusionary Policies**: E.g., "Criminalize Vagrancy": -5 EX for the homeless (who are excluded), but +0.2 LE for the rest (due to perceived safety). Cost: 10 units. This moves miserable people out of the sampling frame.
       - **Compositional Levers**: E.g., "Attract Skilled Migrants": Recruits high-LE individuals. +0.4 LE (because new migrants are high-scoring), no change in EX for existing population. Cost: 25 units. Or "Encourage Emigration of Discontented": Pay unhappy people to leave. +0.3 LE (because low-scorers leave), but world wellbeing might decrease. Cost: 30 units.
       - **Long-term vs. Short-term**: E.g., "Education Reform": Costs 40 units (high upfront), +0.1 LE and +0.1 EX per year for 10 years (long-term gain). But if the team is only evaluated on a 3-year rolling average, they might not see the full benefit.

  6. **Global Wellbeing Index (GWI) Formula**:
     - Simple and visible: GWI = (Average LE score of the surveyed population) * (1 - Non-response rate)
     - Non-response rate: The percentage of the original sample that couldn't be contacted (after 3 attempts) or was excluded. Note: The invisible group is entirely excluded, so they don't even count in the non-response.
     - The index is calculated annually. The ranking is based on the current year's GWI.

  7. **Reference Drift**:
     - We build this into the LE feed. After any policy that significantly changes circumstances (e.g., a major economic boom or bust), we apply a recalibration.
     - Rule: If the average LE change in a year is more than ±0.5, then in the next year, the LE baseline for all groups shifts by -0.2 (if improvement) or +0.2 (if decline) due to shifting expectations. This means that a big improvement leads to a future downward pressure on LE, and vice versa.
     - Additionally, if a country's GWI rises above a certain threshold (say 7.5), then every 0.1 point above that threshold is subject to a "comparison penalty": the next year, the LE of the bottom 50% of the population (by income) drops by 0.05 per 0.1 above threshold. This introduces relative standing effects.

  8. **Time Structure**:
     - The workshop runs for 5 rounds (each round = 1 year).
     - Each round:
       - Teams allocate survey budget (LE mandatory, EX optional).
       - Teams play policy cards (within budget constraints).
       - The facilitator collects the GWI inputs and computes the ranking.
       - The ranking is displayed.
     - **Rolling Average**: The GWI for ranking is actually a 3-year rolling average (to smooth volatility). But teams are under political pressure to show annual improvement (so they care about the current year too).

  9. **Methodology Amendment Round**:
     - After round 3, the team with the highest 3-year average GWI gets to propose one change to the GWI formula (e.g., include EX, change the weighting, adjust for inequality, include the excluded groups). The facilitator (or a vote) decides if it's accepted. The change applies for rounds 4 and 5.

  10. **Debrief Structure**:
      - Map game moments to real issues:
        - When a team used an exclusionary policy and their GWI rose -> measurement problem (gaming) vs. the fact that the excluded group's wellbeing doesn't count at all (ontological problem).
        - When a team improved LE without EX (e.g., via a pride campaign) -> the gap between reported evaluation and actual experience.
        - When a team attracted happy immigrants -> compositional effect (no one is better off, average rises).
        - When a long-term policy didn't pay off within the rolling window -> short-termism.
        - After the methodology change -> the power of the index creator.
      - Highlight three types of complaints:
        - The index is a noisy proxy (fixable by better measurement).
        - There is no "true happiness" quantity for the index to measure (so which country is happier has no answer).
        - Even if we measure it perfectly, should we prioritize it over other goals?

  11. **Potential Problems & Mitigations**:
      - **Meta-gaming**: One participant might immediately point out the loopholes. Mitigation: Frame the game as a simulation of real policy, and encourage teams to role-play. If someone spoils, use it in debrief: "Some of you noticed early that the index can be gamed. Why do you think real-world indices are still used?"
      - **Civil servants dragging in real examples**: Acknowledge their experience but gently steer back to the game: "That's a great real-world example, and we'll discuss parallels in debrief. For now, let's see what happens in our simulation."
      - **Team refusing "ugly" cards and losing**: In debrief, praise their ethical stance and discuss the tension between ethics and performance metrics. Perhaps give a "public trust" bonus in the game for ethical policies? But that complicates the design. Alternatively, let them lose and then discuss why real governments might face similar pressures.
      - **What the game can't produce**: The game assumes wellbeing is measurable on a single scale (even if imperfectly). It cannot challenge the idea that wellbeing might be incommensurable across individuals or cultures. You'll have to raise this in debrief: "Did anyone wonder if the numbers we assigned to happiness really capture the full picture? What if two people report the same LE but mean very different things?"

  12. **Game Flow**:
      - Introduction (10 min): Explain roles, rules, and the GWI formula. Emphasize that the goal is to improve their country's wellbeing (but they'll be ranked).
      - Round 1-3 (20 min each): Teams make decisions, facilitator computes and displays rankings.
      - Amendment Round (after round 3): Winning team proposes a change (5 min discussion, 5 min to decide and implement).
      - Rounds 4-5 (15 min each).
      - Debrief (30 min): Structured as above.

  13. **Materials**:
      - Printed country profiles (with baseline LE and EX for each group, and the invisible group's status).
      - Policy cards (enough for each team to have a deck of 20-30 unique cards).
      - Budget tokens (or just track on paper).
      - Scoreboard for rankings.

  This design should create the experiences you want. The key is in the policy cards and the rules (exclusions, reference drift) that let teams discover the issues through play.
answer: |-
  Based on your requirements, here's a game design called **"The Wellbeing Paradox"** that forces players to confront the gap between optimizing a happiness index and improving actual lives. It embeds your key concepts through mechanics, not lectures.

  ---

  ### **Game Structure: The Wellbeing Paradox**
  **Time:** 120 minutes (including setup/debrief)  
  **Players:** 4–6 teams (3–5 players each) as "Wellbeing Ministries" of fictional countries.  
  **Materials per Team:**  
  - Country Profile Sheet (demographics, baseline happiness data)  
  - Policy Deck (15 cards, mix of ethical/exploitative)  
  - Resource Tokens (20 "Budget Units" annually)  
  - Rulesheet with **Global Happiness Index (GHI)** formula  

  **Core Mechanic:**  
  Teams spend 5 rounds (years) optimizing their GHI rank. Each round:  
  1. Allocate survey budget (mandatory Life Evaluation survey, optional Experience Sampling).  
  2. Play 1–3 policy cards (costing Budget Units).  
  3. Calculate GHI, see rankings.  

  ---

  ### **Key Mechanics Embedded in Rules**
  #### **1. The Happiness Index (GHI) Formula**  
  `GHI = (Avg. Life Evaluation Score) × (1 - Exclusion Rate) + Annual Bonus`  
  - **Life Evaluation (LE)**: Annual survey (0–10 ladder question). *Only this feeds GHI*.  
  - **Exclusion Rate**: % of population not surveyed (hospitalized, imprisoned, homeless, non-responsive after 3 contacts).  
  - **Annual Bonus**: +0.2 if LE increases YoY (short-term incentive).  

  #### **2. Dual Data Feeds (LE vs. Experience)**  
  - **LE Survey**: Costs 5 Budget Units. Required for GHI.  
  - **Experience Sampling (ES)**: Costs 3 Budget Units. Optional mood data (0–10) sampled randomly.  
    - *Policy cards affect LE and ES differently*:  
      - **Ethical Card** (e.g., "Mental Health Clinics"): +0.3 ES, +0.1 LE  
      - **Exploitative Card** (e.g., "National Propaganda Campaign"): +0.5 LE, -0.2 ES  

  #### **3. Population Profiles**  
  Each country has 4 groups (e.g., 10M total population):  
  - **Urban Professionals** (40%): LE 7.0, ES 6.5  
  - **Rural Workers** (30%): LE 5.5, ES 5.0  
  - **Elderly** (20%): LE 4.0, ES 4.5  
  - **"Invisible" Group** (10%):  
    - *e.g., Homeless, undocumented migrants, or incarcerated*.  
    - LE 2.0, ES 2.5.  
    - **Automatically excluded from surveys** (sampling frame rules).  

  #### **4. Policy Cards**  
  Each card shows: Cost, Effects (LE/ES), and hidden consequences. Examples:  
  - **"Build Shelters"** (Cost: 8): +0.4 ES for Invisible Group (but they remain excluded → no LE gain).  
  - **"Criminalize Poverty"** (Cost: 4): Moves 2% of low-LE groups to "Invisible" → raises *average LE* (since low-scorers vanish).  
  - **"Emigration Push"** (Cost: 6): Encourages unhappy citizens to leave. LE +0.3 (composition effect), ES unchanged.  
  - **"Optimism Training"** (Cost: 3): LE +0.4 (trains people to report higher), ES -0.1.  
  - **"Long-Term Education"** (Cost: 10): +0.1 LE/ES annually for 5 years (but costly upfront).  

  #### **5. Reference Drift & Relative Standing**  
  - **Calibration Rule**: If a country’s *median* LE increases by >0.3 in a year, next year’s LE gains are halved (aspirations rise).  
  - **Zero-Sum Effect**: The #1 ranked team each year triggers a "comparison penalty" for others: all non-#1 teams lose 0.1 LE in the following year (relative deprivation).  

  #### **6. Short-Termism**  
  - GHI uses a **3-year rolling average** (teams see past data).  
  - But **Annual Bonus** (+0.2 for YoY improvement) encourages short-term gains.  
  - *Example*: A team inherits high LE from predecessors but cuts funding to "Long-Term Education" to save budget. LE dips after 2 years, but they’ve harvested the bonus.  

  #### **7. Methodology Amendment Round**  
  - After Round 3, the **top-ranked team** proposes 1 change to the GHI formula (e.g., include ES data, weight inequality, count excluded groups).  
  - All teams vote: Majority passes it. *Power dynamics emerge*: Top teams propose changes that lock in their advantage (e.g., "Count only urban respondents").  

  ---

  ### **Workshop Flow**  
  1. **Intro (10 min)**: Assign teams, hand out materials. Explain goal: "Maximize your country’s GHI rank over 5 years."  
  2. **Rounds 1–5 (15 min each)**:  
     - Teams:  
       1. Allocate survey budget (LE mandatory, ES optional).  
       2. Play policies (spend Budget Units).  
       3. Report LE/Exclusion Rate to facilitator.  
     - Facilitator:  
       - Updates GHI scores, displays rankings.  
       - Applies reference drift/zero-sum penalties.  
       - Runs Amendment Round after Round 3.  
  3. **Debrief (30 min)**: Structured as:  
     - **Discovery Mapping**: "When did you realize you could raise GHI without helping lives?" (e.g., exploiting exclusions, compositional levers).  
     - **Three Complaints Framework**:  
       - *Measurement Problem*: "Our index was gamed!" (e.g., sampling exclusions). Fixable with better methods.  
       - *Ontological Problem*: "What is 'true happiness'?" (e.g., LE vs. ES gap, reference drift). No "true" quantity to converge on.  
       - *Normative Problem*: "Should we prioritize GHI?" (e.g., even with perfect data, is it the state’s job?).  
     - **Real-World Links**:  
       - Exclusion → How unhoused populations are omitted from surveys.  
       - Reference drift → Easterlin Paradox (GDP↑ ≠ happiness↑).  
       - Amendment power → How top-ranked countries shape UN SDG frameworks.  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Meta-Gamer Spoils Discovery**:  
     - A player says, "Just expel unhappy people!" in Round 1.  
     - **Mitigation**:  
       - Role-play it: "As a Wellbeing Minister, what are the *ethical* risks of that?"  
       - In debrief, use it: "Some teams spotted loopholes fast. But in reality, would this *truly* improve wellbeing?"  

  2. **Civil Servants Drag in Real Examples**:  
     - "This is just like when our ministry..."  
     - **Mitigation**:  
       - Acknowledge expertise: "That’s a great parallel—let’s note it for debrief."  
       - Gently refocus: "For now, let’s see how this *fictional* system works."  

  3. **Team Refuses Exploitative Cards and Loses**:  
     - E.g., Rejects "Criminalize Poverty" on moral grounds.  
     - **Mitigation**:  
       - **Do NOT punish ethically**. In debrief, praise: "Team X prioritized ethics over rankings. Is that naive? Or should real policies require this?"  
       - Add a "Public Trust" mechanic: If teams use >2 exploitative cards, they risk protests (-0.5 GHI). This balances cynicism/idealism.  

  4. **Logistical Snags**:  
     - Time crunch: Stick to 15 min/round.  
     - Large groups: Use a shared scoreboard (digital or poster).  

  ---

  ### **What the Game Can’t Produce (Requires Verbal Explanation)**  
  - **The Interpersonal Comparison Problem**:  
    - The game treats wellbeing as additive/averagable. But in reality, can we compare a farmer’s "5" to a CEO’s "5"?  
    - **Debrief Script**: "In the game, we assumed happiness is a number on a scale. But what if wellbeing isn’t one thing? What if two people who report ‘7’ are experiencing fundamentally different states?"  
  - **Non-Aggregative Wellbeing**:  
    - The GHI ignores distribution (e.g., soaring inequality masked by averages).  
    - **Solution**: Post-game, ask: "Could a country with high GHI still have rampant suffering? How?"  

  ---

  ### **Why This Works**  
  - Players **feel** the tension: Policies that "win" often *detach* scores from lived experience (ES data).  
  - The "ugly" choices (exclusions, expulsion) are baked into incentives—no need for facilitator hints.  
  - The amendment round exposes how power shapes measurement.  
  - Debrief maps game moments to theory without jargon.  

  **Final Tip**: Start the game by saying, "Your goal is to maximize your rank—but stay true to your ministry’s values." This primes ethical reflection without biasing strategy.
