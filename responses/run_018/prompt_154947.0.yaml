  Hey, I'm doing this course on AI ethics and political philosophy at uni and I'm a bit stuck on an assignment idea. We've been talking about liberal neautrality — like, should an aligned AI stay neutral between users' different ideas of the good life — and also about value aggreagation, where the system tries to combine everyone's preferences into one decision. Then my tutor mentioned Ruth Chang's work on hard choices, where some values are genuinely incommensurable and can't be ranked on a single scale. I was thinking: if that's true, does it break aggreagation, or does it just show neutrality was never really possible?

  So could you draft the joint statement that a liberal-neutralist and a value-aggregationist might both sign after a good-faith adversarial collaberation? I want a numbered section of agreed claims — including what they both think alignment requires, what Chang's hard-choice idea actually means, and whether incommensurability is a real problem for machines — then a disagreements table with each position phrased in wording they'd accept. Then list the cruxes; I think one is whether user preferences are often genuinely incommensurable, and another is whether neutrality avoids comparison or just smuggles it in. For each crux, describe a concrete case or argument both sides agree is relevant, and say what each side predicts about it. Please write it in British English, and feel free to keep it casual — my notes have loads of typos so I don't mind if there's one or two in the reply.
