answer: |-
  Here's a practical grading procedure for your TAs, designed to halt justification regress while acknowledging necessary judgment calls. Think of it as "Deductible Bookkeeping":

  ---

  **Grading Procedure: Deductive Ledger System**

  **1. Setup (Before Grading):**  
  - **Base Budget (Primitives):** Explicitly list 3 rules TAs treat as *unjustified justifiers* (e.g., `Identity (P ∴ P)`, `Direct Substitution (a=b, F(a) ∴ F(b))`, `Modus Ponens (P→Q, P ∴ Q)`).  
  - **Collateral Deposit:** Publish a list of "pre-justified" rules/theorems from prior workshop texts (e.g., `Conjunction Elimination`, `De Morgan’s`, etc.).  
  - **Credit Policy:** Decide upfront: Will TAs accept "on credit" (flag but allow) unrecognized steps? If so, cap the # allowed per proof.  

  **2. Per-Proof Flow (TA Actions for Each Inference Step):**  
  ```mermaid
  graph TD
      A[Start: Check Step] --> B{In Base Budget?}
      B -->|Yes| C[Mark ✓ - Paid from Base]
      B -->|No| D{In Collateral Deposit?}
      D -->|Yes| E[Mark ✓ - Paid from Deposit<br>Note Source e.g., 'Lemma 3.2']
      D -->|No| F[Flag as DEBT<br>TA Decision:]
      F --> G{Accept on Credit?<br>(Per Policy)}
      G -->|Yes| H[Mark ? - On Credit<br>Add to Debt Tally]
      G -->|No| I[Reject Step<br>Demand Reformulation<br>with Primitives/Deposit]
  ```

  **3. Judgment Zones (Explicitly Subjective):**  
  - **Setting Base Budget:** *You* decide what’s primitive (e.g., "MP is in; everything else needs collateral").  
  - **Curating Collateral:** *You* approve the deposit list (e.g., "Boolos’ proof of necessitation is deposited; student meta-proofs are not").  
  - **Granting Credit:** TAs use discretion *within policy* (e.g., "Credit allowed for steps later proven in deposit").  

  **4. What This Can’t Do:**  
  - ✗ **Settle philosophical disputes** (e.g., "Is MP *really* primitive?").  
  - ✗ **Discover new collateral** (deposit is fixed per workshop agreement).  
  - ✗ **Justify the base/deposit** (it’s declared, not derived).  

  ---

  **Applied to Student Proofs:**  

  **Proof 1: Clean Syllogism**  
  - *Student:* "P→Q, P ∴ Q" (explicitly cites MP).  
  - *TA Check:* MP in base budget → **✓ Paid from Base**.  
  - *Outcome:* No debt.  

  **Proof 2: Justifying Modus Ponens via Normalization**  
  - *Student:* "MP reduces to β-normalization in λ-calculus, so Q follows."  
  - *TA Check:*  
    - Step 1: "MP reduces to normalization" → Not in base.  
    - Step 2: Is normalization in collateral? *Assume not* (unless explicitly deposited).  
    - → **DEBT flagged**.  
  - *TA Decision:*  
    - Reject (if policy bans credit for foundational justifications).  
    - OR: Accept on credit, but note: **"Meta-justification creates regress debt: demands primitive MP later"**.  
  - *Hated Outcome:* The procedure forces rejection or credit — **exposing the regress loop** instead of hiding it.  

  **Proof 3: Sloppy Conjunction Elimination**  
  - *Student:* "p∧q, so p." (No rule named).  
  - *TA Check:*  
    - Not base (base is identity/sub/MP).  
    - Check collateral: If `∧Elim` is deposited → **✓ Paid from Deposit** (but mark as "lazy citation").  
    - If `∧Elim` *not* deposited → **DEBT flagged**.  
  - *TA Decision:*  
    - If deposit exists: Allow but deduct style points.  
    - If no deposit: Reject → "Reformulate using MP/substitution or cite deposited rule X."  

  ---

  **Why This Works for TAs:**  
  - **Stops Regress:** Base budget acts as a "regress firewall". No chasing justifications beyond collateral.  
  - **Clear Triggers:** Binary checks (base? deposit?) reduce ambiguity.  
  - **Documents Debt:** Flags where philosophy *would* intrude (credit/rejection).  
  - **Forces Ownership:** You declare the foundations; TAs enforce the ledger.  

  **Key Limitation:** The procedure **cannot avoid your initial judgment calls** (base/deposit/credit). But it makes those calls visible and actionable — turning "Why is this valid?" into "Was this in the deposit?"
