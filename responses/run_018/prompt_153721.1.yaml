  The user asks me to decompose my answer into four components: (i) whether first-order access can defeat statistical evidence (I'll assign 0.7), (ii) whether truth-tracking dominates over coherence (0.6), (iii) whether the statistics are screened off by transparency (0.65), and (iv) an additional factor about cognitive phenomenology (0.55). I'll need to justify each briefly with a probability.

