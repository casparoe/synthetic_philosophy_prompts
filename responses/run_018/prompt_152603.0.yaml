prompt: |-
  I'm running a session for a small group of smart undergrads who think genocide is basically just a strong word for mass murder, and that the UN label is mostly moral outrage with legal window dressing. I want to walk them through Lemkin's original broad concept — where destroying a group's culture or economic life counts too — against the 1948 Convention's tighter "intent to destroy in whole or in part" framing, and then use that gap to show why naming an atrocity is never neutral: it decides which harms get counted and which obligations get triggered. I need the explanitory dependancy arc: what concept has to be in place before the naming-politics question even makes sense, then the one carrying case that needs both physical killing and cultural erasure present but where the legal category only grabs one side, then the misconceptions they'll raise in order — probably "it's just semanics," then "intent is obvious if bodies pile up," then "without the genocide label there's no serious duty" — and exactly where in the sequence each should be absorbed. What's the check that they've understood the politics of naming rather than just memorized the Convention definition, and what should I deliberately leave out at this level — maybe the ICJ jurisprudence or the draft cultural-genocide clauses? No bibliography or reading list please. Please finish with a line that reads Verdict: [your one-sentence bottom line].
reasoning: |-
  Okay, the user is preparing a session for undergrads who see genocide as just a strong term for mass murder, dismissing the UN label as moral outrage with legal pretenses. They want to clarify the gap between Lemkin's broader concept and the 1948 Convention's narrower definition, emphasizing how naming atrocities isn't neutral—it shapes what harms are recognized and what obligations follow. 

  First, I need to map the dependency arc. The foundational concept must be that definitions create frameworks of accountability—without this, the politics of naming won't land. Then, a case study showing both physical killing and cultural erasure is crucial, but where the legal label only captures the killings (e.g., boarding schools for Indigenous children). The misconceptions will likely surface in this order: "it's just semantics," followed by "intent is obvious from bodies," then "no genocide label means no duty." Each needs to be addressed at specific points: semantics when contrasting Lemkin/Convention, intent during the case study, and duty when discussing obligations. 

  For the check of understanding, I should push them to articulate why cultural erasure isn't legally genocide but still enables destruction—forcing them to engage with the politics, not just the definition. I’ll deliberately omit ICJ jurisprudence and draft cultural-genocide clauses to avoid complexity. 

  The verdict should starkly frame the stakes: naming isn’t description—it’s the activation of responsibility. 

  User’s framing is sharp—they’re clearly thought about the pedagogical sequence. No bibliography needed, and the undergrads’ skepticism suggests they’ll resist "moral outrage" framing, so concrete examples are key. The boarding school case works because it’s visceral but legally ambiguous. 

  One thing to watch: when discussing intent, students might conflate motive with intent—I should subtly distinguish them. Also, the "no duty" misconception risks oversimplifying other legal avenues (e.g., crimes against humanity), but since the focus is genocide’s unique obligations, I’ll keep it tight. 

  Final line must resonate: Verdict: The genocide label isn’t a verdict on horror—it’s the trigger for stopping it.
answer: |-
  Here’s a structured sequence for your session, designed to build conceptual understanding step-by-step and preempt common misconceptions:

  ---

  ### **1. Foundational Concept: Definitions Create Worlds**  
  **Core Idea:** Legal/political categories aren’t neutral descriptors—they **actively construct frameworks of accountability**.  
  *Why start here?* Until students grasp that *naming shapes response*, the "genocide vs. mass murder" debate feels semantic. Use examples: Calling an event "civil unrest" vs. "crimes against humanity" changes media coverage, aid, sanctions.  

  ### **2. Lemkin vs. 1948 Convention: The Gap**  
  - **Lemkin (1944):** Destruction of a group *as such* via:  
    - Physical killing (biological)  
    - Cultural erasure (banning language, destroying monuments)  
    - Economic sabotage (confiscating livelihoods)  
    *→ "Group destruction" = Shattering identity, not just bodies.*  
  - **1948 Convention (Article II):** Requires **proven intent** to destroy a group "in whole or in part" **physically**. Cultural erasure alone? Not genocide.  
  *Key contrast:* Lemkin’s umbrella vs. Convention’s narrow doorway.  

  ### **3. Case Study: Where the Gap Matters**  
  **Example: Indigenous Boarding Schools (e.g., Canada/US)**  
  - **Physical harm:** Mass graves, forced sterilization, child mortality.  
  - **Cultural erasure:** Banning native languages, forced conversion, severing kinship ties.  
  - **The Gap:** Legal genocide? Hard to prove *intent to physically destroy* the group (debated). Cultural destruction? Obvious.  
  *→ Harm is holistic, law is partial. Naming it "genocide" (by Lemkin’s standard) vs. "cultural erasure" (under the Convention) changes reparations, truth commissions, global pressure.*  

  ---

  ### **Tackling Misconceptions in Sequence:**  
  | **Misconception** | **When to Address** | **Counter** |  
  |-------------------|---------------------|-------------|  
  | **"It’s just semantics"** | After defining Lemkin vs. Convention | "If semantics decide whether stolen children are ‘cultural loss’ or ‘genocide,’ do survivors get justice or sympathy?" |  
  | **"Intent is obvious if bodies pile up"** | During boarding school case | "Bodies prove murder. But was the *intent* to erase the group? Or ‘assimilate’ them? Law cares why, not just how many." |  
  | **"No genocide label = no duty"** | When contrasting obligations | "Genocide triggers *specific* duties (e.g., prevent, punish). No label? States evade the Convention but still face moral/political pressure—weaker tools." |  

  ---

  ### **Check for Understanding (Politics of Naming):**  
  Ask: *"If a state systematically destroys a group’s sacred sites, bans their language, and forces displacement—but avoids mass killings—why would calling it ‘cultural genocide’ (Lemkin) vs. ‘ethnic persecution’ (current law) change the international response?"*  
  **→ Correct answer:** Names activate legal machinery. "Persecution" = limited sanctions. "Genocide" = obligations to intervene, prosecute, repair.  

  ---

  ### **What to Omit (For Now):**  
  - **ICJ jurisprudence:** Too technical; distracts from core gap.  
  - **Draft cultural-genocide clauses:** Avoids "what ifs" that muddy the 1948/Lemkin tension.  
  - **Comparative atrocity labels:** (e.g., crimes against humanity). Stay focused on genocide’s definitional politics.  

  ---

  ### Verdict: **Naming genocide isn’t about horror—it’s about which horrors the law must stop.**
