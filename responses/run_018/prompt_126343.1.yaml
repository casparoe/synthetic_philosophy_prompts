answer: |-
  Here’s a focused 50-minute seminar plan targeting conceptual dependencies and misconception sequencing:

  ---

  ### **Pre-Session Prep**  
  *Slide 1:* Uranus’s orbital anomaly (1781-1840) + Newtonian equations failing to predict it.  
  *Slide 2:* Key terms: *Hard core*, *Protective belt*, *Progressive/degenerating problem shifts*.  

  ---

  ### **Session Flow**  

  **I. Naive Falsificationism’s Failure** (10 mins)  
  - **Hook (3 min):** Pose Uranus’s anomaly: "Newton’s theory predicts orbit A, but we observe orbit B. Is Newton falsified?" Elicit falsificationist response.  
  - **Problem (7 min):** Explain why scientists *didn’t* abandon Newton:  
    - *Critical point:* Theories aren’t tested in isolation—background assumptions (e.g., "no unknown planets") exist.  
    - *Transition:* "If falsificationism can’t explain this, what *does* explain theory resilience?"  

  **II. Lakatos’s Core Machinery** (20 mins)  
  - **Hard Core & Protective Belt (5 min):**  
    - Define via Newton:  
      - **Hard core:** Unfalsifiable axioms (inverse-square gravity, laws of motion).  
      - **Protective belt:** Adjustable auxiliaries (planet counts, mass distributions).  
    - *Neptune case (10 min):*  
      - Adams/Le Verrier modify belt ("Uranus tugged by unknown planet"), preserving core.  
      - **Crucial show:** Prediction → Neptune discovered (1846) → *novel confirmation*.  
      - **Avoid:** Frame Einstein as *rival programme*, NOT belt-adjustment.  
  - **Progressive vs. Degenerating Problem Shifts (5 min):**  
    - **Progressive:** Belt adjustments yield *novel predictions* (Neptune).  
    - **Degenerating:** Adjustments only *accommodate known anomalies* (e.g., "invisible ether disturbs Uranus" with no new test).  
    - ⚠️ **Preempt Misconception 1:** Stress *immediately*: "Degenerating ≠ false. It means lagging behind rivals in predictive power."  

  **III. Contrast with Popper** (10 mins)  
  - **Recap Popper:** Falsification of single theories (e.g., "All swans are white" → black swan).  
  - **Lakatos’s Unit of Appraisal (5 min):**  
    - Programs judged on *series* of problem shifts over time.  
    - ⚠️ **Crush Misconception 3:** "Lakatos isn’t Popper + ‘wait and see.’ He replaces *single-conjecture falsification* with *longitudinal programme evaluation*."  

  **IV. Check for Understanding** (5 min)  
  - **Q:** *"Programme X predicts subatomic particles successfully for 10 years. Recently, it adjusts its belt to explain unexpected data but predicts nothing new. Is this progressive or degenerating? Why?"*  
    - **Target:** Apply degenerating shift concept (no novel predictions) without conflating with falsity.  

  **V. Wrap-Up & Boundaries** (5 min)  
  - **Summary:** Falsificationism fails → hard core/belt needed → appraise *sequences* of shifts.  
  - **Explicit Exclusions:**  
    - "We *won’t* cover: Kuhn’s paradigms vs. Lakatos, formal grades of *ad hoc*-ness, or historical debates about Marxism/psychoanalysis."  

  ---

  ### **Misconception Defense Sequence**  
  1. **Degenerating = False?**  
     - *When:* During intro of progressive/degenerating shifts.  
     - *Tactic:* Emphasize: "Degenerating programmes can still be ‘true’—they’re just *losing ground* to rivals."  
  2. **Belt = Ad Hoc Immunization?**  
     - *When:* Immediately after defining protective belt.  
     - *Tactic:* Contrast Neptune (novel prediction) with hypothetical *non*-predictive fix (e.g., "Uranus’s orbit glitch is instrument error").  
  3. **Lakatos = Popper + Delay?**  
     - *When:* After both Popper/Lakatos are fully articulated.  
     - *Tactic:* Juxtapose Popper’s *single theory* falsification with Lakatos’s *programme trajectories*.  

  ---

  ### **Timing Safeguards**  
  - **00:00–10:00:** Falsificationism collapse.  
  - **10:00–30:00:** Lakatos machinery + Neptune case.  
  - **30:00–40:00:** Popper contrast.  
  - **40:00–45:00:** Check-for-understanding Q.  
  - **45:00–50:00:** Boundaries + wrap.  

  This plan forces structural dependencies (failure of falsificationism → necessity of core/belt) and surgically neutralizes misconceptions in their emergence order. The Neptune case isolates belt adjustment from programme replacement, while the final question tests application, not recall.
