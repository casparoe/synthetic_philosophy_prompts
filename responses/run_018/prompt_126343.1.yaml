prompt: |-
  I'm preparing a single fifty-minute session for an advanced undergraduate philosophy-of-science seminar on Imre Lakatos's methodology of scientific research programmes. Don't explain the view to me; design the teaching plan. The session must open with the failure of naive falsificationism—why a single anomaly doesn't kill a theory—before any Lakatos-specific machinery is introduced, since that dependency makes the hard-core/protective-belt distinction necessary rather than arbitrary. For the carrying example, use the Newtonian programme's response to Uranus's orbital perturbations and the subsequent prediction of Neptune, but specify exactly what this case must show (the inverse-square hard core and mechanics remain untouched while auxiliary hypotheses about an unknown planet are revised) and what it must avoid suggesting (that Einstein eventually replacing Newton illustrates internal belt-modification, since that conflates programme abandonment with protective-belt adjustment). Map the predictable misconceptions in the order they will arise: first, that a "degenerating problem shift" means the programme is false (head this off precisely when you introduce progressive versus degenerating, not earlier); second, that the protective belt is merely ad hoc immunization (defuse this immediately after introducing the belt, by using the Neptune case to distinguish adjustments that generate novel predictions from those that only accommodate known anomalies); third, that Lakatos is just Popper with a time-delay (address this only after both views are fully in view, by showing that Lakatos appraises whole sequences of problem shifts rather than single conjectures). Include the one check-for-understanding question you will ask at the end—one that requires applying the progressive/degenerating distinction to a hypothetical research trajectory rather than recalling a definition—and state explicitly what you will refuse to cover at this level (for instance, the formal taxonomy of ad hoc1/ad hoc2/ad hoc3 hypotheses, the sociology-of-science comparison with Kuhn, and the historical appraisal of programmes like Marxism or psychoanalysis). Keep the plan focused on the conceptual dependency structure and the misconception sequence.
