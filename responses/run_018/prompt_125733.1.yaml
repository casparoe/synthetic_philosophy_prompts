answer: |-
  ### Workplace Scenario
  Sarah, a plant manager at a chemical company, must decide whether to install a $10,000 filtration system to prevent potential groundwater contamination from a new solvent. Unmitigated, there’s a 10% chance the solvent leaks, causing $1M in cleanup and penalties. She can commission a $5,000 geological survey to confirm the risk. However, if the survey reveals a real leak risk, environmental regulations (and internal ethics policies) require her to implement not just the filter but additional remediation measures costing $200,000—far exceeding the filter’s cost. If she acts blindly, she can install the basic filter upfront for $10,000, avoiding both the leak risk and regulatory scrutiny. Sarah rejects the survey, explaining: "Paying $5,000 to learn the risk might force me into a $200,000 fix if it’s real. If I don’t know, I can solve the problem for $10,000. The 'Curiosity Tax'—knowing the truth—could bankrupt my budget."

  ### Analysis
  1. **Why Good’s theorem recommends gathering information (expected value basis):**  
     Good’s theorem states that acquiring information has positive expected value if it might change the optimal action. Here:  
     - **Without the survey:** Sarah’s options are:  
       - *Do nothing:* Expected cost = 10% × $1M = **$100,000**.  
       - *Install basic filter:* Cost = **$10,000** (avoids all risk).  
       → Optimal blind action: Install filter ($10,000).  
     - **With the survey ($5,000 cost):**  
       - *If no risk (90% probability):* Skip the filter, cost = **$5,000** (survey only).  
       - *If risk (10% probability):* Must implement $200,000 fix, cost = **$205,000** ($5,000 survey + $200,000 fix).  
       → Expected cost with survey = (90% × $5,000) + (10% × $205,000) = **$26,500**.  
     - **Value of information:**  
       Expected cost without information = $10,000.  
       Expected cost with information = $26,500.  
       → Information has *negative* expected value: **−$16,500**.  
     **Contradiction:** Good’s theorem seemingly fails here—but only because the theorem assumes fixed action costs. The Curiosity Tax distorts this.

  2. **How the Curiosity Tax alters utility:**  
     The Curiosity Tax imposes a **$200,000 penalty contingent on learning the bad state**. This creates an asymmetric outcome:  
     - If Sarah learns the risk is real, her action (fixing it) costs $190,000 *more* than the blind precaution ($200,000 vs. $10,000), plus the $5,000 survey.  
     - This tax overwhelms the benefit of avoiding the filter in the "no-risk" scenario. Her utility in the "risk" state plummets from a potential −$10,000 (blind) to −$205,000 (learn), making information acquisition net harmful.

  3. **Violation of Good’s theorem assumption:**  
     Good’s theorem assumes **action costs are state-dependent but *not* information-state-dependent**. Here, learning the risk *changes the cost structure itself*:  
     - *Without knowledge:* The "fix" action (basic filter) costs $10,000.  
     - *With knowledge:* The "fix" action triggers $200,000 in additional costs due to legal/moral obligations.  
     → **Violated assumption:** The cost of the action *depends on whether the state is known*, not just the state itself.  

  4. **Does removing the Curiosity Tax restore Good’s theorem?**  
     **Yes.** If the post-learning fix cost only $10,000 (same as the blind action), the tax vanishes:  
     - Expected cost with survey = (90% × $5,000) + (10% × $15,000) = **$6,000**.  
     - Value of information = $10,000 (blind) − $6,000 (informed) = **+$4,000**.  
     → Good’s theorem now holds, recommending the survey.  

  5. **Core feature doing the work:**  
     The critical element is the **post-learning action cost inflation** ($200,000 vs. $10,000). Deeper than mere risk aversion, this stems from:  
     - **Information-triggered obligations:** Knowledge creates legal/moral duties that amplify costs.  
     - **Asymmetric constraints:** Ignorance allows cheaper actions by avoiding scrutiny.  
     This violates Good’s implicit assumption of **cost invariance to information states**. The Curiosity Tax is thus a real-world principal-agent problem where information alters the feasible action set or its costs.
