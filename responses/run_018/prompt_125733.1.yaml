  1. **Why Good's theorem recommends gathering info:** Good's theorem states that information has positive expected value when a decision-maker can change their action based on the information. Here, without the study, Sarah's choices are: (a) do nothing (expected cost: 5% * $10M = $500,000) or (b) install the scrubber (cost: $50,000). Clearly, she chooses (b) and loses $50,000. With the study (costing $30,000), with 95% probability the study says "safe" and she does nothing, saving $500,000 (so net gain: $500,000 - $30,000 = $470,000). With 5% probability, the study finds "unsafe", and she must install the scrubber (costing $50,000) to avoid the $10M loss, so net: -$30,000 (study) -$50,000 (scrubber) = -$80,000. Expected value with study: 0.95*$470,000 + 0.05*(-$80,000) = $446,500 - $4,000 = $442,500. Without study, she gets -$50,000 (from installing the scrubber). So the expected value of information is $442,500 - (-$50,000) = $492,500, which is positive and large. Thus, Good's theorem says she should do the study.

  2. **What the Curiosity Tax does to her utility:** The Curiosity Tax is the extra cost (or loss of flexibility) that comes with knowing the bad state. In this case, if the study reveals the risk, Sarah is forced to take an expensive action (scrubber or halt) that she would not have taken if she remained ignorant and just installed the scrubber preemptively. Without the study, she spends $50,000 and gets the savings. With the study and bad news, she spends $30,000 (study) plus $50,000 (scrubber) and still gets the savings, so net she is $30,000 worse off than if she had just installed the scrubber without the study. Thus, the Curiosity Tax in the bad state is $30,000 (the cost of the study plus the fact that she must then act, but note that without the study she would have acted anyway). However, in the good state (95%), she avoids the scrubber cost and just pays the study, so she comes out ahead. The tax is the asymmetry: in the bad state, the study forces her to spend more than she would have in ignorance.

