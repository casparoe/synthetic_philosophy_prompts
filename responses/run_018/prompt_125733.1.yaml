  Scenario: Sarah rejects the study, explaining: "If I commission the study and it finds the toxin risk, I'm forced to spend at least $50,000 to avoid catastrophic liability. But if I don't know, I can install the scrubber now for $50,000 and still get most of the savings. The study costs $30,000, and if it gives me bad news, I'm worse off than if I had just installed the scrubber blindly. I call this the 'Curiosity Tax'—knowing the risk creates an obligation that costs more than the blind precaution."

