answer: |-
  The silt-laden water felt cool against Elara’s forearm as she plunged her hand into the intake channel. Three centuries since the Basin Lords abandoned their great city downstream, yet their ghostly machines still governed the lifeblood of the valley. Her fingers found the familiar obstruction – a tangle of water-reed roots snarled around the brass filter grate. A relic, like the channel itself.

  She worked patiently, the rhythmic scrape of her bone knife against the ancient, pitted metal echoing faintly in the quiet morning air. Sunlight glinted off the intricate, interlocking patterns cast into the grate centuries ago, patterns meant to signify the unity of the Nine Distributaries under the central bureaucracy. Now, they were just friction points for roots.

  Elara lived in Oak Bend, one of dozens of hamlets dotting the upper tributaries. The great river metropolis downstream, ‘Neru-San’, was a place of fragmented stories and scavenged stone, its colossal ziggurat a crumbling silhouette on the horizon visible only on the clearest days. Her grandfather’s grandfather had been a canal-keeper for the Lords; the knowledge, passed down through necessity, not reverence. Elara could read the faded maintenance glyphs etched beside the sluice gates, deciphering flow rates and sediment tolerances meant for a vast, integrated network. Now, she used that knowledge to ensure Oak Bend’s three communal fields and the fish-traps beyond the millrace stayed watered.

  Her task complete, she rinsed her hands and dried them on her tunic. From a worn leather pouch at her belt, she pulled out a smooth, dark river stone, perfectly round and flat. One side bore the faint, precise carving of the Neru-San standard weight – the *kep*. The official seal, a stylized grain sheaf encircled by a serpent, was worn almost smooth. This was her ‘barter-stone’. In the market at Willow Crossing, she’d lay it next to a stack of dried fish. The fishmonger would place his own stones – a smaller *kep* fraction for salt, a chipped obsidian chip for pepper – until the weights balanced out the value. The *kep*, once the unassailable measure binding trade across half a continent, was now a convenient counterweight in a local exchange of fish and spice. Its authority was local consensus, not imperial decree.

  Later, mending a net under the shade of the great oak that gave the hamlet its name, Elara heard the rhythmic *thump* of hooves. Jorin, the headman’s son, reined in his sturdy valley pony. He carried a bundle wrapped in oiled cloth. "Elara! Found these near the old boundary marker. Thought you might... make sense of them." He unwrapped two fired clay tablets. They were the ubiquitous ‘trade manifests’ of Neru-San, their surfaces covered in dense, angular script detailing quantities of copper ingots, linseed oil, and lapis lazuli, stamped with the seals of distant, now-mythical places – ‘Karthos’, ‘The Sunken Isles’.

  Jorin held them like fragile eggs. "Maybe they’re important? Spells, or maps?"

  Elara took one, her fingers tracing the cool, familiar glyphs. She could translate them, mostly. "Copper," she said softly, tapping a cluster of signs. "Twenty ingots. Bound for... a place that’s dust now." She saw not lost treasure, but bureaucratic minutiae, as dead as the officials who penned it. "Keep them," she said, handing it back. "Good luck charms. Or useful for scraping mud off boots." Jorin looked faintly disappointed, but wrapped them carefully again. He’d probably place them on his hearth, talismans against a forgotten world’s imagined dangers.

  The most potent relic lay on the outskirts. On her way back from checking the sluice, Elara paused where the path skirted the old Processional Way. Centuries of neglect had buried most of the paved road, but a section remained. Here, a colossal statue base sat empty, a jagged scar on the sandstone plinth where the figure had been sheared off. Not by violence, but by deliberation. The stories said the people of Oak Bend’s founding generation had toppled the Basin Lord depicted – not in rage, but because the enormous block of granite was perfect for the foundation stones of their first mill. The mill still stood, sturdy and functional, its grindstones powered by the same water the Lords had once diverted. The Lord’s face, perhaps once gazing imperiously down the road towards Neru-San, was now part of the mill’s solid footing, ground smooth by centuries of grain and water.

  Elara touched the plinth’s scar. No regret stirred, only the pragmatic acknowledgment of resourcefulness. The Lords’ system had required the statue, the wide road, the endless manifests, the absolute *kep*. Oak Bend required working water, fair barter, sturdy walls, and millstones. She understood the intricate logic of the old ways – the glyphs, the weights, the machinery – better than anyone in the valley. Yet, the thought of resurrecting that vast, demanding apparatus felt as alien and unnecessary as trying to reassemble the shattered statue. It wasn’t loss she felt looking at the scarred plinth or holding the barter-stone; it was the quiet weight of a different equilibrium.

  She turned towards home, the scent of woodsmoke and baking bread mingling with the damp earth smell of the riverbank. The water flowed steadily through the ancient, repaired grate. Children’s laughter drifted from the fields. It was simply life, woven from old threads into a smaller, sturdier pattern. She felt no pang for vanished glories, only the familiar rhythm of the valley’s enduring pulse. Tomorrow, she would check the sluice again.
