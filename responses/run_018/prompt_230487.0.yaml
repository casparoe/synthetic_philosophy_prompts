     - If no non-quantifiable benefits are claimed or they are deemed insufficient by the project lead (or the room), then the project is killed.

  7. **Risks and Alternatives:**
     - Question: "What are the key risks that could make the future costs higher or the benefits lower? And are there alternative uses of the resources that would yield a higher NFV?"
     - Good enough: A brief discussion of major risks (e.g., technical, market) and a comparison with at least one alternative use of the resources (even if it's just reallocating to other projects). If the risks are high and the alternatives are clearly better, the project may be killed even with a positive NFV. But note: This step is for awareness and might not change the decision if the quantitative test passed. However, if the risks are extreme (e.g., 50% chance of doubling costs) then recalculate NFV with risk-adjusted numbers and go back to step 4.
     - If the project passes step 5 and the risks/alternatives don't change the picture, then the project continues.

