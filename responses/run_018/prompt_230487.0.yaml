  ### Project Go/Kill Decision Procedure  
  This procedure combats the "dollar auction" problem (escalation of commitment) by forcing explicit consideration of **future costs and benefits only**, ignoring sunk costs. It uses quantitative thresholds to minimize bias and flags subjective "values calls" for your review. Designed for **15-minute per-project discussions** with non-experts.  

  **Key Principles:**  
  - **Sunk costs are irrelevant:** Past investments ($X, Y months) are gone. Only future costs/benefits matter.  
  - **Quantify ruthlessly:** If it can’t be measured, it defaults to $0 unless flagged for strategic review.  
  - **Thresholds are guardrails:** Use company-defined minimums for NFV (Net Future Value) or default to $0.  
  - **Stop early:** Kill if thresholds fail and no strategic case is made. Hand off subjective calls to you.  

  ---

  ### The Procedure: 7 Steps  
  **Step 1: Acknowledge and Sink Sunk Costs**  
  - **Question:** "We’ve sunk [X dollars, Y months]. That’s gone no matter what. Does everyone agree to ignore it?"  
  - **Good Enough:** Verbal agreement (no debate). If pushback, facilitator overrules after 60 seconds.  
  - **Next Step:** Always → Step 2.  

  **Step 2: Future Costs to Completion (FCC)**  
  - **Question:** "What’s the best realistic estimate to finish? Include all cash, time, and opportunity costs."  
  - **Good Enough:** A single dollar figure (no ranges). Must be backed by data (e.g., project plan, finance sign-off). If disputed, use worst-case estimate.  
  - **Stop/Kill:** If no estimate → Kill (unrecoverable uncertainty).  
  - **Next Step:** Valid FCC → Step 3.  

  **Step 3: Future Benefits (FB)**  
  - **Question:** "What quantifiable cash benefits will we get after completion? (e.g., new revenue, cost savings, penalty avoidance). What non-quantifiable benefits exist? (e.g., strategic, reputational)."  
  - **Good Enough:**  
    - Quantifiable: Dollar value over **3 years** (default horizon; adjust if project-specific). Must be traceable (e.g., customer contract, engineering calc).  
    - Non-quantifiable: Specific examples (e.g., "enters a $10M market," "keeps key customer"). Vague claims (e.g., "strategic importance") rejected.  
  - **Stop/Kill:** If quantifiable FB = $0 and no non-quantifiable claims → Kill (no economic case).  
  - **Next Step:** FB > $0 or non-quant claimed → Step 4.  

  **Step 4: Calculate Net Future Value (NFV)**  
  - **Calculation:** **NFV = Quantifiable FB - FCC**  
  - **Rules:**  
    - Use 3-year FB (unless company policy specifies otherwise).  
    - Ignore non-quantifiable benefits for now.  
  - **Next Step:** Always → Step 5.  

  **Step 5: Quantitative Threshold Check**  
  - **Question:** "Does NFV meet our minimum threshold? (e.g., NFV > $0 or company-set hurdle)."  
  - **Thresholds:**  
    - Default: **NFV > $0** (if no company policy).  
    - Recommended: **NFV > 10% of FCC** (avoids marginal/low-return projects).  
  - **Good Enough:** Math is math. No debate.  
  - **Next Step:**  
    - Pass (NFV > threshold) → **Step 7**.  
    - Fail (NFV ≤ threshold) → **Step 6**.  

  **Step 6: Non-Quantifiable Assessment**  
  - **Question:** "Despite failing Step 5, do non-quantifiable benefits justify continuing? Be specific: How do they align with company strategy? What’s the cost of walking away?"  
  - **Good Enough:** Concrete examples (e.g., "losing this customer risks $2M in other business," "project enables regulatory compliance").  
  - **Stop/Handoff:**  
    - No credible non-quantifiable benefits → **Kill**.  
    - Credible non-quantifiable benefits → **Hand to you** (values call).  
  - **Next Step:** None.  

  **Step 7: Risk and Alternatives**  
  - **Question:** "What could go wrong to worsen NFV? Is there a better use for these resources?"  
  - **Good Enough:**  
    - Risks: Identify major risks (e.g., "scope creep could double FCC," "benefits delayed by 12 months").  
    - Alternatives: Compare NFV to one alternative project (e.g., "Project B has NFV of $500k").  
  - **Stop/Kill:**  
    - If risks make NFV unreliable (e.g., >40% chance of failure) → **Kill**.  
    - If alternatives have higher NFV → **Kill** (opportunity cost).  
  - **Next Step:** No material risks/alternatives → **Continue**.  

  ---

  ### Where the Procedure Misfires  
  - **False positives:** Overly optimistic FCC/FB estimates (e.g., project leads lowball costs).  
  - **False negatives:** Undervalued non-quantifiable benefits (e.g., reputation in a new market).  
  - **Gaming:** Project leads may inflate non-quantifiable claims to force handoff.  
  - **Threshold rigidity:** A $0 threshold may keep marginal projects alive; a high threshold may kill strategic bets.  
  - **What it can’t do:** Resolve disputes about FB/FCC estimates or define "strategic value." It surfaces conflicts but can’t eliminate politics.  

  ---

  ### Application to Your Projects  
  **Company Threshold Assumption:** NFV > $0 (default). If your company uses a hurdle rate (e.g., 10% of FCC), outcomes may differ.  

  #### Project 1: Software Migration  
  - **Step 1:** Sunk costs = $2.1M, 14 months → Ignored.  
  - **Step 2: FCC** = $1.4M (remaining cost).  
  - **Step 3: FB** = $90k/yr × 3 years = **$270k** (quantifiable). No non-quantifiable benefits ("will not enable new work").  
  - **Step 4: NFV** = $270k - $1.4M = **-$1.13M**.  
  - **Step 5: Threshold Check** = NFV (-$1.13M) < $0 → **Fail**.  
  - **Step 6: Non-Quantifiable Assessment** → No claims made → **Kill**.  
  - **Procedure Output: KILL**  
  - **Real Room Fight:** Project lead argues sunk costs ("We’ve already spent $2.1M!") or invents non-quantifiable benefits ("This is foundational for AI!"). Facilitator must enforce rules.  

  #### Project 2: Product Line  
  - **Step 1:** Sunk costs (past losses) → Ignored.  
  - **Step 2: FCC** = Expected loss from running product line for 1 year. Assume last year’s loss (e.g., -$500k; exact $ irrelevant if quantifiable FB covers it).  
  - **Step 3: FB** = Penalty avoidance ($600k) + other business profit ($P). Since $P > |product line loss| (given), FB > $600k + FCC. Quantifiable FB **>$1.1M** (conservative: $600k penalty + $500k other profit).  
  - **Step 4: NFV** = FB - FCC > ($1.1M) - $500k = **$600k+** (positive).  
  - **Step 5: Threshold Check** = NFV > $0 → **Pass**.  
  - **Step 7: Risks & Alternatives** → Risks: Customer may leave anyway. Alternatives: None provided. NFV still positive → **Continue**.  
  - **Procedure Output: CONTINUE**  
  - **Real Room Fight:** Finance may focus on product line losses ("We’re bleeding cash!") and ignore avoided penalties/other business. Procedure forces holistic view.  

  #### Project 3: Government Bid  
  - **Step 1:** Sunk costs = $300k → Ignored.  
  - **Step 2: FCC** = Cost to submit bid (e.g., $50k; not given, but net return is $50k after submission costs).  
  - **Step 3: FB** = Expected return from bid = **$50k** (quantifiable; net of submission costs).  
  - **Step 4: NFV** = $50k - $0 (FB already nets FCC) = **$50k**.  
  - **Step 5: Threshold Check** = NFV ($50k) > $0 → **Pass**.  
  - **Step 7: Risks & Alternatives** → Risks: Bid may lose (but $50k is average, so probability baked in). Alternatives: None → **Continue**.  
  - **Procedure Output: CONTINUE**  
  - **Real Room Fight:** Team may demand kill to "cut losses" (sunk cost fallacy) or argue $50k is too low. Procedure overrules—positive NFV meets threshold.  

  **Flagged Decision You Might Hate:** Project 1 (Software Migration) forces a kill despite $2.1M sunk. But NFV is catastrophically negative, and no strategic case exists. Killing frees up $1.4M for better projects.  

  ---

  ### Final Recommendations  
  - **Prevent Escalation:** Require **kill criteria** (e.g., "If NFV < $100k by Month 6") at project kickoff.  
  - **Run This Quarterly:** Revisit projects before they become entrenched.  
  - **Empower Facilitators:** Designate a neutral person to enforce the procedure and shut down sunk-cost arguments.  
  - **Adjust Thresholds:** Set a company-wide NFV hurdle (e.g., >10% of FCC) to avoid marginal projects like Project 3.
