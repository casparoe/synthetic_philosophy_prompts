  - Step 5: NFV positive and above threshold -> go to step 7, then likely continue.
  - Step 5: NFV negative or below threshold -> go to step 6.
  - Step 6: If non-quantifiable benefits are claimed and significant -> hand to you.
  - Step 6: If no non-quantifiable benefits -> kill.
  - Step 7: After step 5, if risks are too high or alternatives clearly better, then kill. Otherwise, continue.

