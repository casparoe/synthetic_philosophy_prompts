  We are designing a decision procedure to combat escalation of commitment (like the dollar auction) in project continuation decisions. The key is to ignore sunk costs and focus on future costs and benefits.

  The procedure should:
  - Force explicit consideration of future costs and benefits only (ignoring sunk costs).
  - Require quantification where possible.
  - Set thresholds for continuation.
  - Identify when non-quantifiable factors (strategic, reputational) must be considered, and then hand off to the decision maker (you).

  Procedure: Project Go/Kill Decision Checklist

  1. **Acknowledge sunk costs and set them aside.**
     - Statement: "We have already spent [X dollars and Y time] on this project. That investment is gone regardless of what we decide. We are only going to consider future costs and benefits from this point forward."
     - Move to next step: Once the group agrees to ignore sunk costs. If there is pushback, restate the principle and move on after 1 minute.

  2. **Estimate future costs to completion (FCC):**
     - Question: "What is the best estimate of the additional time and money required to complete this project? (Include all costs: labor, materials, overhead, opportunity costs, etc.)"
     - Good enough: A single number or range that the project lead and finance agree is realistic. If a range, use the expected value (average) or the worst-case that is still probable (e.g., 80th percentile) as directed by company policy. If no agreement, use the higher number to be conservative.
     - If the project lead cannot provide an estimate, stop and flag as a major risk. This step must be completed.

  3. **Estimate future benefits (FB) from completion:**
     - Question: "What are the quantifiable benefits we will receive after the project is completed? (e.g., cost savings, new revenue, penalty avoidance) Assign dollar values and timeframes. Also, are there non-quantifiable benefits (strategic, reputational, etc.)?"
     - Good enough: A list of benefits with dollar amounts and timeframes. Non-quantifiable benefits must be listed but not valued. If the project lead cannot quantify any benefits, then the quantifiable FB is $0.

  4. **Calculate Net Future Value (NFV):**
     - Calculation: NFV = Quantifiable Future Benefits (over an appropriate time horizon, e.g., 3-5 years) - Future Costs to Completion (FCC)
     - Note: This is a simple subtraction. If benefits are over time, use the present value? But for simplicity, we can use nominal values over a fixed period (e.g., 3 years) if the company doesn't do discounting. Alternatively, if the project has a long horizon, we might need to discount, but for 15 minutes per project, we might avoid complex finance. So, we'll use a simple 3-year benefit period unless otherwise specified.
     - If NFV is positive, then the project has a positive expected return from this point. If negative, then it's a candidate for killing.

  5. **Quantitative Threshold:**
     - Rule: If NFV is positive and above a predetermined threshold (e.g., $100k or 10% of FCC, set by company policy), then the project passes the quantitative test. If not, it fails.
     - If the project fails the quantitative test, move to step 6. If it passes, move to step 7.

  6. **Non-quantifiable benefits assessment:**
     - Question: "Are there significant non-quantifiable benefits (strategic, reputational, etc.) that justify continuing despite a negative NFV? Describe them specifically and explain how they align with company strategy."
     - Good enough: A clear, specific description (not vague). Examples: "This project will allow us to enter a new market that is critical to our 5-year plan," or "Cancelling would violate a key contract and damage our reputation with our largest customer."
