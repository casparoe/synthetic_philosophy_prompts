answer: |-
  Here’s the breakdown of what an adequate theory of "what matters in survival" must deliver, grounded in cases and distilled into requirements. I’ll walk through the cases to derive each requirement, flag tensions, and end with what might shift my view.

  ### Core Requirements  
  1. **Death must be bad** (derived from ordinary death).  
     If you cease permanently, that loss matters. A theory can’t trivialize death by saying "you still exist elsewhere" when there’s no continuity. *Non-negotiable*: Denying this makes survival concerns incoherent.  

  2. **Ordinary survival must be good** (derived from aging across decades).  
     The 80-year-old you should rationally anticipate being is *you* in a way that warrants self-concern. A theory must explain why you’d save for retirement or fear future pain. *Non-negotiable*: Failure here rejects the core intuition driving the question.  

  3. **Causal connection is necessary** (derived from the coincidence duplicate).  
     A molecule-for-molecule copy of you forming on Mars by random chance isn’t you. You wouldn’t fear *its* pain or rejoice in *its* successes as your own. A theory must require a causal link (e.g., your current state generating the future one). *Non-negotiable*: Without this, you’d care equally about all possible duplicates, dissolving self-concern.  

  4. **Survival isn’t strict identity** (derived from the teleporter malfunction).  
     When the teleporter fails and both original and duplicate exist, *both* have equal claim to psychological continuity. But they can’t be identical (two ≠ one). A theory must allow that what matters can persist without numerical identity. *Non-negotiable*: The two-you case forces this split.  

  5. **Gradual replacement preserves survival** (derived from slow brain replacement).  
     If your brain is replaced piecemeal over years, you still survive. A theory can’t demand strict physical continuity. *Negotiable*: Some might insist on biological brain matter, but the gradualist intuition is strong—if done slowly, you’d still plan for tomorrow.  

  6. **Amnesia need not destroy survival** (derived from memory loss with preserved traits).  
     Losing episodic memories but keeping skills/habits/dispositions shouldn’t mean "you" ceased. You’d still care about this future person’s well-being. *Negotiable*: Hardliners might tie survival to full memory access, but practical concern likely persists.  

  7. **No duplication penalty** (derived from the teleporter malfunction).  
     When two versions of you exist post-malfunction, your pre-teleport self-interest shouldn’t *diminish* because two result. Caring about survival isn’t a zero-sum resource. *Tentatively non-negotiable*: If duplication halved concern, stepping into a malfunction-prone teleporter would be rational—it isn’t.  

  8. **Connectedness vs. continuity distinction** (derived from amnesia and aging).  
     - *Connectedness*: Direct psychological links (e.g., your memory today of yesterday).  
     - *Continuity*: Overlapping chains of connection (e.g., you-at-30 linked to you-at-20 and you-at-40).  
     A theory must distinguish these from *mere similarity* (like the coincidence copy). The amnesiac retains connectedness via habits; the aging you maintains continuity via overlapping mental states. *Non-negotiable*: Collapsing these risks equating survival with resemblance.  

  ### Tensions Between Requirements  
  - **The gradual replacement vs. causal connection tension**: If your brain is replaced atom-by-atom, is the causal link "your" causality? A theory might struggle to define "appropriate" causation here without smuggling in identity.  
  - **No duplication penalty vs. what you care about**: If both post-malfunction copies suffer, do you have "double" the reason to avoid it? But pre-teleport, you can’t care about two distinct futures equally without splitting your concern. This *might* force a compromise on requirement 7.  
  - **Amnesia vs. continuity**: Severe amnesia could break continuity while leaving connectedness (e.g., skills). Can a theory value connectedness alone? If so, a duplicate created *now* with your skills might matter equally—but requirement 3 blocks this.  

  ### What Would Change My Mind  
  - **If duplication penalty seemed rational**: Suppose we discover that conscious experience is fundamentally singular—you *can’t* be two people. If each duplicate felt like "half" of you, requirement 7 might weaken.  
  - **If causal connection proved irrelevant**: Imagine a coincidence copy forms, but due to quantum flukes, it *is* you (e.g., your particles teleport undetected). If that felt intuitive, requirement 3 would falter.  
  - **If death lost its sting**: Near-death experiences or AI mind-uploading might reveal that cessation isn’t feared when continuity is mimicked perfectly. Requirement 1 could demote.  

  ### Where My Reasoning Is Most Likely to Fail  
  I’m likely underestimating the **gradual replacement case**. If a theory denies survival in slow replacement (e.g., by requiring an unbroken physical substrate), it might handle the coincidence duplicate better but make aging terrifying—a high cost. I might also overvalue **psychological criteria** if future science shows that embodied biology is irreducible to cognition.  

  Puzzles remain: The teleporter (with destruction) tests whether causal continuity *without* physical continuity suffices. The malfunction case tests whether survival can "branch." A theory can treat branching as a puzzle (e.g., "you" survive as both, but identity doesn’t apply) if it satisfies the non-negotiables elsewhere. But if it must "get wrong" a case, amnesia is the safest—some loss of survival value there won’t collapse the framework. The key is securing death, ordinary survival, and anti-coincidence while navigating the splits.
