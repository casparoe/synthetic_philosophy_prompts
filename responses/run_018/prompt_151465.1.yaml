prompt: |-
  You serve as the senior appeals officer for a platform's trust-and-safety division, adjudicating roughly fifty appeals per eight-hour shift with no in-house legal counsel available and a mandatory 150-word justification for every ruling that bears your digital signature. Your docket is now dominated by edge-case content—synthetic-voice parodies, procedurally generated visual memes, and context-collapsed video remixes—that does not map cleanly onto the existing policy taxonomy (e.g., "harassment," "misinformation," "hate speech"). Rather than searching for an essential defining feature of each category, construct a reusable, step-by-step decision procedure grounded in Wittgenstein's analysis of language games and family resemblance, designed for repeated use by an officer with no philosophical training. Specify the ordered checks in plain language: identifying the form of life or practice in which the utterance operates; mapping overlapping similarities and criss-crossing analogies to canonical policy examples; testing whether shared family traits are present, absent, or partially present; and flagging the precise points where judgment cannot be eliminated and must be documented as discretionary sign-off. The protocol must handle high-frequency, high-stakes decisions under severe time pressure and must explicitly state which boundary disputes it can settle, which it must escalate, and why an essential-definition approach would misfire on the same cases. Provide three worked applications: one synthetic-voice parody that the procedure clearly excludes from "harassment"; one procedurally generated meme that it clearly includes under "misinformation"; and one hybrid case—perhaps a context-stripped remix that mimics a protected satire form—where the procedure yields an unwelcome or indeterminate verdict that forces escalation rather than resolution. Conclude by stating what the procedure definitively cannot do, naming the kinds of irreducible boundary conflicts that remain outside its reach and explaining why family-resemblance reasoning reaches its limit there. Present this as a formal protocol document with a brief preamble fixing the practitioner's role, shift constraints, documentation requirements, and personal liability for each sign-off.
reasoning: |-
  We are constructing a decision procedure for content moderation appeals based on Wittgenstein's concept of "family resemblance" and "language games". The goal is to avoid the trap of seeking essential definitions (which often fail for edge cases) and instead focus on overlapping similarities and contextual practices.

  The steps are:

  1. **Contextual Placement**: Identify the "form of life" or practice in which the content operates. What is the typical context? (e.g., political satire, entertainment, educational, etc.)
  2. **Mapping to Canonical Examples**: Compare the content to clear examples (both included and excluded) in our policy categories. Look for overlapping similarities and differences. Use analogies to known cases.
  3. **Family Traits Analysis**: List the typical traits of the policy category (e.g., for harassment: repeated targeting, intent to harm, use of derogatory terms, etc.). Check which traits are present, absent, or partially present. Note: no single trait is necessary or sufficient.
  4. **Judgment and Escalation**: If the traits are mixed or the context is ambiguous, document the points of uncertainty and escalate. If the content clearly shares a cluster of traits with canonical violations, uphold. If it clearly lacks the core cluster and aligns more with non-violations, overturn.

  Boundary Disputes:
  - Settle: Cases where the content clearly shares a cluster of traits with canonical examples (either violating or non-violating) and the context is clear.
  - Escalate: Cases where there is a significant mix of traits (both present and absent) or where the context is highly ambiguous and the content could reasonably fit multiple categories.

  Why essential definitions fail: They require a set of necessary and sufficient conditions, but edge cases often lack one or more "essential" features while still being harmful (or vice versa). Family resemblance allows for flexible clustering.

  Formal Protocol Document:

  ---

  **Protocol: Wittgensteinian Family Resemblance Appeals Adjudication (WFRA-1.0)**

  **Preamble**:  
  As a Senior Appeals Officer, you are required to adjudicate approximately fifty appeals per eight-hour shift. Each ruling must be accompanied by a justification of at least 150 words, bearing your digital signature. You are personally liable for each sign-off. There is no in-house legal counsel. The protocol below must be applied consistently to edge-case content that does not fit neatly into existing policy categories.

  **Step-by-Step Procedure**:

  1. **Contextual Placement (1 minute max)**  
     - Identify the typical context ("form of life") of the content:  
       - What is the apparent purpose? (e.g., parody, news, entertainment, activism)  
       - What community norms or practices typically govern this content?  
       - If the context is unclear or multiple contexts are plausible, note this for escalation.

  2. **Mapping to Canonical Examples (2 minutes max)**  
     - Retrieve 2-3 clear examples of content that violates the policy in question (from training materials) and 2-3 that do not.  
     - Compare the appealed content to these examples:  
       - What features (e.g., tone, format, intent, harm potential) overlap with violating examples?  
       - What features overlap with non-violating examples?  
       - Draw analogies: "This is like Example A because of X, but also like Example B because of Y."

  3. **Family Traits Analysis (3 minutes max)**  
     - For the policy category (e.g., harassment), list the typical traits (from policy guidelines) that often appear in violations. Example traits for harassment:  
       - Targeted at an individual or group  
       - Repeated or severe  
       - Uses threatening, derogatory, or demeaning language  
       - Intent to intimidate or cause distress  
       - Likely to cause harm (e.g., emotional, reputational)  
     - Check each trait:  
       - Present?  
       - Absent?  
       - Partially present?  
     - Decision:  
       - **Uphold Removal** if a significant cluster of traits (especially core ones) is present and the context does not negate harm.  
       - **Overturn Removal** if the content lacks a significant cluster of core traits and aligns more with non-violating examples.  
       - **Escalate** if the traits are mixed (some core traits present, others absent) and the context is ambiguous.

  4. **Documentation (2 minutes per case)**  
     - Justification must include:  
       - Context identified.  
       - Key similarities and differences with canonical examples.  
       - Trait analysis (present/absent/partial).  
       - Clear rationale for uphold/overturn OR specific points of uncertainty for escalation.  
     - Minimum 150 words.  
     - Digital signature applied.

  **Boundary Disputes Handling**:  
  - **Settle**: When the content clearly aligns (or does not align) with a cluster of traits from canonical examples and the context is clear.  
  - **Escalate**: When the content exhibits a mix of traits that could place it in multiple categories, or when the context is highly contested (e.g., political speech in a tense election).  

  **Why Essential Definitions Fail Here**: Essential definitions require a fixed set of conditions. Edge cases (like synthetic media) often lack one "essential" trait (e.g., human creator for harassment) but may still cause harm, or have a trait (e.g., false information) but in a context (e.g., satire) that negates harm. Family resemblance allows flexible clustering without fixed boundaries.

  ---

  **Worked Applications**:

  **Case 1: Synthetic-Voice Parody (Excluded from Harassment)**  
  - **Content**: A synthetic voice mimicking a celebrity saying, "I love eating socks for breakfast!" posted on a parody account.  
  - **Policy Category**: Harassment.  
  - **Step 1**: Context is parody/entertainment. Common in meme culture, not targeted abuse.  
  - **Step 2**: Compare:  
    - Violating example: Repeated voice messages to a user saying, "I will find you and hurt you."  
    - Non-violating: A comedian's impersonation of a politician.  
    - This content is like the comedian example: absurd, non-threatening, public figure. Unlike violating: no threat, no targeted harm.  
  - **Step 3**: Harassment traits:  
    - Targeted? Yes (celebrity), but not malicious.  
    - Repeated? No.  
    - Threatening? Absent.  
    - Derogatory? Absent.  
    - Intent to harm? Absent.  
    - Harm likely? Unlikely (absurdity reduces harm potential).  
  - **Verdict**: Overturn. Lacks core harassment traits (threat, harm intent).  
  - **Justification (abridged)**: This synthetic voice parody operates in the context of entertainment and absurdist humor, targeting a public figure without malice. It lacks threatening or derogatory language and does not pose a credible harm risk. While targeted, the intent and effect align with protected parody. No harassment.

  **Case 2: Procedurally Generated Meme (Included in Misinformation)**  
  - **Content**: A meme generated by an AI showing a fake weather map with the text "GOVERNMENT CAUSED HURRICANE TO DESTROY FARMERS' CROPS" during a real disaster.  
  - **Policy Category**: Misinformation.  
  - **Step 1**: Context is political conspiracy; shared in newsfeeds during a crisis.  
  - **Step 2**: Compare:  
    - Violating: A hoax image of a politician accepting bribes.  
    - Non-violating: A sci-fi movie poster showing an alien invasion.  
    - This is like the hoax: realistic format, false claim about real events, potential to cause panic. Unlike movie poster: presented as factual news.  
  - **Step 3**: Misinformation traits:  
    - False? Present (no evidence for government causing hurricane).  
    - Appears factual? Present (realistic weather map).  
    - Harm potential? Present (panic, distrust in government during crisis).  
    - Context of dissemination? Crisis (amplifies harm).  
  - **Verdict**: Uphold. Shares core traits with misinformation: falsity presented as fact with high harm risk.  
  - **Justification (abridged)**: This procedurally generated meme presents a false claim as factual news during a crisis, using realistic imagery. It overlaps with canonical misinformation examples in falsity, factual presentation, and harm potential (panic, erosion of trust). Satire or parody defenses fail due to lack of clear humorous intent and high-stakes context.

  **Case 3: Hybrid Case – Context-Stripped Remix (Escalate)**  
  - **Content**: A video remix that splices real protest footage with a politician's speech out of context, making it appear they endorse violence. The editing style mimics protected satire formats but is shared without satire cues.  
  - **Policy Categories**: Misinformation and Incitement.  
  - **Step 1**: Context is ambiguous: format resembles satire, but sharing context (e.g., in a news feed with caption "PROOF OF CORRUPTION") suggests literal belief.  
  - **Step 2**: Compare:  
    - Violating: Deepfake of a politician confessing to a crime.  
    - Non-violating: Satire news segment using obvious exaggeration.  
    - This has similarities to both: editing technique like satire, but lack of cues (e.g., humor, disclaimer) and sharing context like misinformation.  
  - **Step 3**: Misinformation traits:  
    - False? Present (speech is out of context, creates false implication).  
    - Factual appearance? Present (uses real footage).  
    - Harm potential? Present (could incite violence against the politician).  
    - Satire indicators? Partially present (format) but absent in sharing context.  
  - **Verdict**: Escalate. Mixed traits: the format suggests protected speech, but the context and potential harm align with misinformation. Core traits conflict.  
  - **Justification (abridged)**: This remix uses real footage edited to create a false implication, resembling satire in form but lacking clear cues. Shared in a context suggesting literal belief, it risks incitement. However, the satirical style complicates categorization. Due to conflicting traits (protected form vs. harmful misinformation) and ambiguous context, escalation is required for policy interpretation.

  ---

  **Limitations of the Procedure**:  
  The procedure cannot resolve:  
  1. **Irreducible Normative Conflicts**: Cases where societal values fundamentally clash (e.g., blasphemy vs. free speech in polarized regions). Family resemblance can map traits but cannot arbitrate which traits should dominate when cultural norms conflict.  
  2. **Novel Harms without Precedent**: Content using emerging technology (e.g., neural lace interfaces) that has no analog in existing policy examples. Without canonical comparisons, trait analysis fails.  
  3. **Strategic Ambiguity**: Bad actors deliberately designing content to sit on boundaries (e.g., extremist rhetoric using plausible deniability). Family resemblance may flag for escalation but cannot definitively categorize without clear traits.  

  **Why Limits Exist**: Wittgensteinian analysis relies on existing practices and examples. When practices are contested, emerging, or deliberately obfuscated, the "family" has no clear resemblances to draw upon. At these boundaries, human judgment (or higher-level policy) is irreplaceable but must be documented as discretionary.

  ---  
  **End of Protocol**
answer: |-
  ### Formal Protocol Document: Wittgensteinian Family Resemblance Appeals Procedure (WFRA-1.0)  
  **Preamble**  
  *Role*: As Senior Appeals Officer, you adjudicate content-moderation appeals for edge cases lacking clear policy alignment. Your rulings carry legal liability for the platform under Section 230 and local jurisdiction.  
  *Constraints*: 50 appeals/shift (avg. 9.6 minutes/case). Zero legal consultation.  
  *Documentation*: Each ruling requires a 150-word justification bearing your digital signature. Failure to comply risks personal liability for wrongful takedowns or reinstatements.  
  *Core Principle*: **Reject essentialist definitions** (e.g., "All harassment must involve intent"). Instead, use Wittgenstein’s "family resemblance" model: categories are linked by overlapping traits, not universal rules.  

  ---  
  ### Step-by-Step Decision Procedure (4-Step Workflow)  
  **Execute steps sequentially. Time budget: 8 minutes/case max.**  

  1. **Context Identification (≤2 min)**  
     - **Task**: Identify the "form of life" (social practice) where the content operates.  
     - **Ask**: "What social activity does this content participate in? (e.g., political satire, gaming culture, activist critique) Is this context verifiable?"  
     - **Document**: "Content operates in [X] practice, with key markers: [Y]."  
     - *Escalate if*: Context is unverifiable or involves high-stakes practices (e.g., electoral politics, public health).  

  2. **Canonical Example Mapping (≤2 min)**  
     - **Task**: Map content to 2–3 policy-aligned ("violating") and 2–3 policy-exempt ("non-violating") examples from the platform’s training corpus.  
     - **Ask**: "What features (tone, format, intent, effect) overlap with violating examples? With non-violating? List *criss-crossing resemblances*."  
       - *Example*: "Like Violating Example #12 (misinfo) in false factual claims, but like Non-Violating Example #7 (satire) in absurdist tone."  
     - **Document**: "Resembles violating canon [A] in [trait], non-violating [B] in [trait]."  

  3. **Family Trait Audit (≤3 min)**  
     - **Task**: Score resemblance to the policy category’s "family traits" (non-exhaustive clusters from guidelines).  
     - **Check for**:  
       - **Presence** (strong resemblance to violating canon),  
       - **Partial presence** (weak or ambiguous resemblance),  
       - **Absence** (no resemblance to violating canon).  
     - *Policy Trait Banks*:  
       - *Harassment*: Targeting, repetition, degrading language, harm intent, real-world harm risk.  
       - *Misinformation*: False factual claim, deceptive presentation, public harm risk, lack of satire cues.  
       - *Hate Speech*: Protected-group targeting, slur use, inferiority implication, incitement risk.  
     - **Document**: "Trait [X]: [Present/Partial/Absent]. Gap: [Y]."  

  4. **Judgment Call & Escalation (≤1 min)**  
     - **Rule**:  
       - **Uphold removal** if ≥3 policy-defining traits are *present* AND ≤1 is *absent*.  
       - **Overturn removal** if ≤1 trait is *present* AND ≥3 are *absent*.  
       - **Escalate** if traits are mixed (e.g., 2 present, 2 absent) OR context is boundary-blurring.  
     - **Document discretionary sign-off**: "Irresolvable ambiguity at [trait/context] due to [reason]. Escalated per WFRA-1.0."  

  ---  
  ### Boundary Settlement Rules  
  - **Settles**: Cases where traits clearly cluster toward policy-aligned/exempt canons.  
  - **Escalates**: Cases with "trait collisions" (e.g., satirical format + harmful effect) or context collapse.  
  - **Why Essentialism Fails**: Edge cases lack immutable "necessary" traits. Essentialist rules (e.g., "All parodies are exempt") misfire when form/life diverge (e.g., parody weaponized for harassment).  

  ---  
  ### Worked Applications  
  #### Case 1: Synthetic-Voice Parody → **Overturn (Excluded from Harassment)**  
  - **Content**: AI-generated voice mimicking a celebrity saying, "I steal puppies! Follow me @RandomUser for more!"  
  - **Procedure**:  
    1. **Context**: Comedy/parody practice (shared on meme aggregator with #absurdhumor hashtag).  
    2. **Mapping**:  
       - *Violating canon* (targeted harassment): Direct @-mention with threat ("I’ll hurt you").  
       - *Non-violating canon* (parody): Exaggerated celebrity impersonation ("I eat clouds for breakfast").  
       - *Resemblance*: Absurd claim (non-violating) + @-mention (violating).  
    3. **Traits (Harassment)**:  
       - Targeting: **Partial** (celebrity referenced, but no individual user singled out).  
       - Degrading language: **Absent** (no slurs/insults).  
       - Harm intent: **Absent** (context: joke format).  
       - Harm risk: **Absent** (no evidence of stalking/doxxing).  
    4. **Verdict**: Overturn. Clusters with parody canon. @-mention alone insufficient for harassment "family."  

  #### Case 2: Procedurally Generated Meme → **Uphold (Included in Misinformation)**  
  - **Content**: AI-generated image of flooded city blocks with text: "FEMA CAUSED THIS FLOOD TO DEPOPULATE CHICAGO—SHARE NOW!" posted during actual floods.  
  - **Procedure**:  
    1. **Context**: News/political discourse (shared in local crisis-response groups).  
    2. **Mapping**:  
       - *Violating canon* (misinfo): Altered image of disaster with conspiracy text ("GOVERNMENT BOMBED HAWAII").  
       - *Non-violating canon* (satire): Obvious dystopian meme ("FEMA LIZARDS CONTROL WEATHER").  
       - *Resemblance*: False claim + realistic imagery (violating) but meme format (non-violating).  
    3. **Traits (Misinformation)**:  
       - False factual claim: **Present** (baseless conspiracy).  
       - Deceptive presentation: **Present** (realistic image, urgent text).  
       - Public harm risk: **Present** (crisis context may incite panic).  
       - Satire cues: **Absent** (no irony/absurdism markers).  
    4. **Verdict**: Uphold. Strong cluster with misinfo canon; meme format overridden by harm risk.  

  #### Case 3: Hybrid Remix → **Escalate (Unresolved Satire/Hate Speech Boundary)**  
  - **Content**: Edited video splicing real immigrant interviews with genocidal slogans, using a satirical news-show intro. Shared with caption: "THEY ADMIT IT! DEPORT NOW."  
  - **Procedure**:  
    1. **Context**: Collapsed—satire format (intro graphics) but distributed in anti-immigrant groups as "evidence."  
    2. **Mapping**:  
       - *Violating canon* (hate speech): Slogans inciting violence against group.  
       - *Non-violating canon* (satire): Political parody exposing extremism.  
       - *Resemblance*: Genocidal language (violating) + satirical framing (non-violating).  
    3. **Traits (Hate Speech)**:  
       - Group targeting: **Present** (immigrants).  
       - Inferiority implication: **Present** ("invaders" narrative).  
       - Incitement risk: **Present** ("DEPORT NOW" caption).  
       - Satiric intent: **Partial** (format suggests critique, but context negates it).  
    4. **Verdict**: Escalate. Trait collision: satirical form vs. harmful context. Discretion required for intent/harm balance.  

  ---  
  ### Limits of the Procedure  
  **WFRA-1.0 cannot resolve**:  
  1. **Normative Conflicts**: Cases where societal values irreducibly clash (e.g., religious blasphemy vs. free speech). Family resemblance identifies traits but cannot prioritize values.  
  2. **Traitless Novelties**: Content with no resemblance to *any* existing canon (e.g., entirely AI-generated symbology with no cultural analog).  
  3. **Strategic Ambiguity**: Bad-faith actors exploiting resemblance gaps (e.g., hate speech masked as satire with perfect formal cues).  

  **Why Limits Exist**: Wittgensteinian analysis relies on shared practices and precedents ("language games"). When practices are contested, emerging, or deliberately perverted, resemblance chains break. At these boundaries, human discretion—documented and escalated—is unavoidable.  

  ---  
  **Protocol Certified for Implementation**  
  *Senior Appeals Officer Handbook v4.3 // Liability Waiver ID: WFRA1-LEGAL-230*
