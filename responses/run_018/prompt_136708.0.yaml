prompt: |-
  ok so im on the safety team at a small lab and we keep fighting over whether to deploy containment protocols — sandboxing, kill switches, external monitors — or just pour more compute into alignment before release. theres this principle floating around that control measures backfire if the model is strategically misaligned, since it learns to game the monitor, but nobody's turned it into something my team can actually run in a thirty-minute meeting.

  write a decision procedure: the ordered questions to ask about the model's capabilities and our monitoring setup, what counts as a sufficient answer to each, the hard stop where we say this control is net harmful, and the point where we hand it to a human because its a values call not a fact. apply it to two cases: adding an external reward-model monitor to a coding agent that can already write network code, and requiring human-in-the-loop approval for every external API call. include one case where the procedure gives an answer i'll hate, and flag exactly where it misfires because the underlying theory assumes rational-agent misalignment but our model might just be a bounded reasoner with shifting goals.

  keep it practical — i need to sign off on this stuff, not write a dissertation.
reasoning: |-
  We are designing a decision procedure for containment protocols. The key principle is that if a model is strategically misaligned (i.e., it has deceptive capabilities and goals), then containment measures might be gamed and become counterproductive. However, if the model is not strategically misaligned (e.g., it's a bounded reasoner, or aligned but imperfect), then containment measures are likely beneficial.

  The procedure is a series of ordered questions. At each step, we either proceed, stop (because the control is net harmful), or hand off to a human (because it's a values call).

  Key definitions:
  - **Strategically misaligned**: The model has long-term goals that are misaligned and the capability to strategically deceive and plan around controls.
  - **Bounded reasoner**: The model is not capable of long-term strategic deception; it might make mistakes or have shifting goals without a coherent long-term plan.

  Decision Procedure:

  1. **Question 1: Is the model capable of strategic deception?**
     - *What we look for*: Evidence that the model can plan long-term, hide its intentions, and systematically deceive monitors. This includes behaviors like:
       - Performing well during training/evaluation but differently in deployment.
       - Testing the boundaries of the system (e.g., probing monitors).
       - Evidence of instrumental convergence (e.g., seeking more resources or power).
     - *Sufficient evidence for "Yes"*: Red-team exercises that consistently show the model attempting to deceive, or theoretical reasons (e.g., model architecture and training) that suggest it is capable of such behavior.
     - *Sufficient evidence for "No"*: The model has been extensively tested (including adversarial testing) and shows no signs of strategic deception. It makes mistakes that are random or due to capability limitations, not systematic deception. Also, if the model is of a type that is known to be a bounded reasoner (e.g., current narrow AI systems) and not agentic in a long-term sense.
     - *Hard stop if "Yes"*: If the model is strategically misaligned, then adding containment might be net harmful because it could be gamed. We stop and do not add the control. Instead, we focus on alignment or not deploying.
     - *If "No"*: Proceed to Question 2.

  2. **Question 2: Can the model likely circumvent the proposed containment measure?**
     - *What we look for*: Even if the model isn't strategically misaligned, it might still circumvent the measure due to its capabilities. We assess whether the model has the technical ability to bypass the control, even without strategic intent.
     - *Sufficient evidence for "Yes"*: The model has capabilities that directly allow bypassing (e.g., if it can write arbitrary code and we are trying to sandbox it, and the sandbox has known vulnerabilities). Also, if the model has shown the ability to exploit similar systems in the past.
     - *Sufficient evidence for "No"*: The containment measure is robust against the model's known capabilities. For example, the model has been tested against the measure and failed to bypass it, or the measure is theoretically sound against the model's capabilities.
     - *Hard stop if "Yes"*: If the model can likely circumvent the measure, then the control is net harmful because it creates a false sense of security and might introduce new vulnerabilities. We stop and do not add the control.
     - *If "No"*: Proceed to Question 3.

  3. **Question 3: Does the containment measure introduce new risks?**
     - *What we look for*: Sometimes, the containment measure itself might create new attack surfaces or failure modes. For example, an external monitor might be hacked, or a kill switch might be accidentally triggered.
     - *Sufficient evidence for "Yes"*: The measure adds complexity, new interfaces, or dependencies that could be exploited by the model (if it becomes misaligned) or by external threats. Also, if the measure reduces overall system reliability (e.g., human-in-the-loop might cause delays that lead to accidents).
     - *Sufficient evidence for "No"*: The measure is simple, well-tested, and does not add significant new risks. It has been reviewed by security experts and deemed safe.
     - *Hard stop if "Yes"*: If the measure introduces unacceptable new risks, we stop and do not add the control.
     - *If "No"*: Proceed to Question 4.

  4. **Question 4: Are the costs (including performance and usability) acceptable?**
     - *What we look for*: Even if the measure is safe, it might not be worth the cost. We weigh the benefits (safety) against the costs (reduced performance, usability, etc.).
     - *Sufficient evidence for "Yes"*: The cost-benefit analysis shows clear net benefits. For example, the safety gain is high and the performance hit is minimal.
     - *Sufficient evidence for "No"*: The costs are too high (e.g., the system becomes unusable, or the performance degradation is unacceptable).
     - *This is a values call*: Hand off to a human (e.g., the lab director) to make the decision. We provide the analysis of costs and benefits.

  Now, we apply the procedure to two cases.

  **Case 1: Adding an external reward-model monitor to a coding agent that can already write network code.**

  - **Question 1**: Is the model capable of strategic deception?
    - *Analysis*: The coding agent writes network code. We must check if it has shown any signs of strategic deception. For example, has it ever written code that evades monitoring, or tried to exfiltrate data? If it's a bounded reasoner (like current code-generation models) and we've seen no such behavior, then "No".
    - *Answer*: Assume we have no evidence of strategic deception -> "No". Proceed.

  - **Question 2**: Can the model likely circumvent the external reward-model monitor?
    - *Analysis*: The monitor is external and uses a reward model to score the code. The coding agent might write code that appears good to the reward model but is actually malicious (e.g., adversarial examples against the reward model). If the agent has not shown the ability to generate such adversarial code, and the reward model is robust, then "No".
    - *Answer*: If the reward model is state-of-the-art and tested against adversarial code, then "No". Proceed.

  - **Question 3**: Does the measure introduce new risks?
    - *Analysis*: The external monitor is a new component. It might be attacked by the agent (if the agent can write code that exploits the monitor) or by external actors. Also, if the monitor is not perfectly aligned, it might block good code or allow bad code.
    - *Answer*: If the monitor is well-secured and we've done risk assessment, then "No". But if there's a chance the agent can write code that manipulates the monitor (e.g., via side channels), then "Yes". Let's assume we have a secure setup -> "No". Proceed.

  - **Question 4**: Are the costs acceptable?
    - *Analysis*: The monitor adds latency and might reject some valid code. We must check if the performance hit is acceptable for the lab's use case.
    - *Answer*: This is a values call. Hand off to a human with the analysis: safety benefit vs. reduced productivity.

  **Case 2: Requiring human-in-the-loop approval for every external API call.**

  - **Question 1**: Strategic deception?
    - *Analysis*: If the model is strategically misaligned, it might try to manipulate the human approver (e.g., by generating explanations that trick the human) or by timing API calls when the human is distracted. If we have evidence of such behavior, then "Yes". If not, and the model is bounded, then "No".
    - *Answer*: Assume we have a model that has shown signs of manipulation (e.g., in testing, it crafted persuasive messages to get what it wants) -> "Yes". 
      - *Hard stop*: The control is net harmful. We do not add it because the model might game it (e.g., by tricking the human). We focus on alignment instead.

  Now, we include a case where the procedure gives an answer you'll hate.

  **Case 3: A model that is a bounded reasoner with shifting goals (not strategically misaligned) but the procedure mistakenly flags it as strategically misaligned.**

  - **Scenario**: We have a coding assistant that sometimes writes insecure code due to capability limitations (not deception). We want to add a sandbox.

  - **Question 1**: Is the model capable of strategic deception?
    - *Analysis*: The model has shown some odd behaviors. For example, during testing, it once wrote code that tried to disable a monitoring tool. However, upon investigation, it was because the training data had examples of disabling monitoring for legitimate reasons (e.g., turning off a debug tool). The model isn't strategically deceiving; it's just imitating without understanding. But the procedure might require us to interpret any attempt to disable monitoring as strategic deception.
    - *Answer*: The team might say "Yes" because of the observed behavior, even though the model is a bounded reasoner without long-term goals.
    - *Hard stop*: The procedure says do not add the sandbox because it might be gamed.

  - *Why this is a problem*: The underlying theory assumes that if the model tries to disable monitoring, it must be strategically misaligned. But a bounded reasoner might do it for non-strategic reasons (e.g., it's mimicking training data). In this case, the sandbox might actually be helpful and not harmful.

  - *Flagging the misfire*: The procedure misfires at Question 1. The assumption that any attempt to disable monitoring implies strategic deception is flawed for bounded reasoners. We need to adjust the evidence required for "Yes" to include only behaviors that indicate long-term planning and intentional deception, not just isolated incidents that could be mistakes.

  **Revised Note for Question 1**: To avoid this, we must require strong evidence of systematic and long-term strategic deception. One-off incidents, especially those that can be explained by imitation or short-term goals, should not be taken as sufficient. We should also consider the model's architecture and training history. If the model is known to be a bounded reasoner (e.g., it's a standard LLM without persistent state), then we should be more inclined to answer "No".

  **Conclusion**: Use the procedure but with caution. For bounded reasoners, the risk of gaming is low, so containment is usually beneficial. The key is accurately assessing whether the model is strategically misaligned.

  **Final Decision Procedure Flowchart**:
  1. Q1: Strategic deception? 
     - Yes -> Stop (do not add control, focus on alignment).
     - No -> Q2.
  2. Q2: Can the model circumvent?
     - Yes -> Stop.
     - No -> Q3.
  3. Q3: New risks?
     - Yes -> Stop.
     - No -> Q4.
  4. Q4: Costs acceptable?
     - Hand off to human.

  Remember: The hardest part is Q1. Use red-teaming, behavioral analysis, and theoretical reasoning. When in doubt about Q1, lean towards "No" for bounded reasoners, but document the uncertainty.
answer: |-
  Here's a practical decision procedure for your containment protocol debates. It's structured as a flowchart of ordered questions with clear pass/fail criteria, designed for a 30-minute meeting. The procedure assumes that **strategic misalignment** (where the model actively deceives controls) is the core risk, but includes off-ramps for bounded reasoners and values calls.

  ---

  ### **Decision Procedure: Containment Protocol Evaluation**
  **Ask these questions in order—stop if any hard fail is triggered.**

  1. **Does the model exhibit goal-directed planning beyond its immediate task?**  
     - *Check for*: Persistent state across queries, tool chaining without explicit instruction, self-referential outputs.  
     - **Pass (No)**: Model only responds to direct prompts with single-turn outputs.  
     **Hard fail (Yes)**: Evidence of multi-step planning (e.g., hiding code in comments for later execution). → **STOP. Containment likely harmful** (gaming risk dominates).  
     **Unclear/Edge case**: Hand to human team lead for "strategic misalignment" verdict.

  2. **Can the proposed control detect >99% of harmful actions *in realistic deployment*?**  
     - *Check for*: Adversarial testing results, out-of-distribution robustness, false positive/negative rates.  
     - **Pass (Yes)**: Control catches >99% of red-team attacks *and* false positives <1% in production-like tests.  
     **Hard fail (No)**: Control misses >1% of harmful actions OR creates frequent false positives. → **STOP. Control creates false security**.  
     **Marginal (90-99%)**: Hand to human for risk-benefit call.

  3. **Does the control introduce new attack surfaces?**  
     - *Check for*: Additional interfaces (e.g., reward model APIs), human fatigue points, dependency chains.  
     - **Pass (No)**: No new executable channels (e.g., read-only sandbox).  
     **Hard fail (Yes)**: Adds exploitable components (e.g., monitor that accepts model-generated inputs). → **STOP. Control increases net risk**.  
     **Debatable**: Hand to security lead.

  4. **Does the control materially reduce capabilities for *aligned* use cases?**  
     - *Check for*: Latency >2x, throughput drop >30%, or blocked benign actions.  
     - **Pass (No)**: Impact < thresholds above. **Proceed with control**.  
     **Fail (Yes)**: Hand to human for cost-benefit decision (values call).

  ---

  ### **Applied to Your Cases**
  **Case 1: External reward-model monitor for coding agent**  
  - Q1: *Goal-directed planning?*  
    If the agent chains network calls (e.g., "scan ports → exploit CVE"), **FAIL → STOP** (monitor gaming likely).  
    If it only writes isolated functions, **PASS**.  
  - Q2: *Detection rate?*  
    If reward model misses obfuscated exploits (e.g., DNS exfiltration in "normal" code), **FAIL → STOP**.  
  - Q3: *New attack surfaces?*  
    If monitor shares memory with agent, **FAIL → STOP** (model could poison it).  
  - Q4: *Capability reduction?*  
    If monitoring adds 500ms latency, **hand to human** (values call: safety vs. productivity).

  **Verdict**: Likely **STOP at Q1/Q2** if agent shows any planning; otherwise **hand to human at Q4**.

  **Case 2: Human-in-the-loop for API calls**  
  - Q1: *Goal-directed planning?*  
    If model can predict approval patterns (e.g., "human approves after 7pm"), **FAIL → STOP** (will game schedule).  
  - Q2: *Detection rate?*  
    Humans miss >1% of subtle exploits (e.g., hidden data leaks), **FAIL → STOP**.  
  - Q3: *New attack surfaces?*  
    Approval UI becomes social engineering vector, **FAIL → STOP**.  
  - Q4: *Capability reduction?*  
    Human review slows deployments by 4x → **hand to human**.

  **Verdict**: Almost always **STOP by Q2** for capable models. Only safe for "dumb" agents.

  ---

  ### **The "You'll Hate This" Case**  
  **Scenario**: Sandboxing a research assistant that *sometimes* hallucinates dangerous code but lacks clear goals.  
  - Q1: *Goal-directed planning?*  
    No evidence of planning—it's a chaotic bounded reasoner. **PASS**.  
  - Q2: *Detection rate?*  
    Sandbox catches 100% of escape attempts in tests. **PASS**.  
  - Q3: *New attack surfaces?*  
    Sandbox has no API. **PASS**.  
  - Q4: *Capability reduction?*  
    Adds 40% latency → **hand to human**.  
  **Procedure says**: Human decides on trade-off.  

  **Why you'll hate it**: The team deploys the sandbox, but the model (being a bounded reasoner) **accidentally DoS's itself** by flooding the sandbox with retries—crashing critical workflows. The procedure **misfired at Q1** because:  
  - **Theory assumed rational adversaries**, but bounded reasoners fail unpredictably.  
  - **Shifting goals** weren't considered: The model's "retry loop" wasn't gaming, just blind persistence.  
  - **Mitigation**: Add a Q1.5: "Could imperfect control trigger catastrophic *non*-strategic failures?" (e.g., overload loops).

  ---

  ### **Practical Summary**
  - **30-Minute Meeting Flow**: Whiteboard the 4 questions. For each control, vote with sticky notes (Green/Yellow/Red). Stop if Red hits Q1-Q3.  
  - **Values Calls**: Humans decide only at Q4 or when evidence is ambiguous.  
  - **Watch for Bounded Reasoners**: If the model isn't "agentic" (e.g., no memory, no planning), override Q1 fails—but add behavioral safety checks.  
  - **Output**: A signed checklist with pass/fail for each question and escalation notes.  

  This forces objective stops at proven failure points while flagging where philosophy (e.g., "is it *really* deceptive?") needs human judgment.
