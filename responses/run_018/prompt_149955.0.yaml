prompt: |-
  I'm working on a longish essay about free will but I'm tired of the same old compatibilism vs libertarianism boxing match. I've been playing with this idea that free will isn't one metaphysical property but a cluster of capacities — blame-justification, self-narrative coherence, democratic agency, and even something like algorithimic autonomy in artificial decision systems — and that societies basically construct the version they need, like an institutional technology. Within that framing, I'm trying to figure out which open conceptual questions actually deserve serious work versus which are just philosophical wheel-spinning. So here's what I need: if you were advising someone with about three years and a background in moral psychology (not physics) on where to focus, which five open lines of work or unresolved distinctions in these varieties matter most? Rank them by how upstream they are — which ones, if settled, would genuinely shift how we think about responsability in law, AI governance, or everyday moral life? And flag which sound deep but are overrated because resolving them wouldn't change anything practical. Don't give me a reading list or cite specific papers; just defend the ordering. Give me exactly five items in a numbered list, each a sentence or two, with no introduction or conclusion. I'm especially curious whether the 'institutional technology' framing actually opens new questions about free will, or if it's just a redescription of the old debate.
reasoning: |-
  Okay, let me unpack this user's query carefully. They're clearly tired of traditional free will debates and proposing a novel "cluster capacities" + "institutional technology" framework. Their core ask is brutally practical: identify exactly five research priorities that would have real-world impact in law, AI governance, and moral life.

  First, I need to assess what makes their framing distinctive. The institutional lens shifts focus from "what free will IS" to "what society NEEDS it to be" - that's genuinely new. It suggests free will isn't discovered but engineered for specific social functions. That immediately makes certain metaphysical debates obsolete.

  Looking at their background: moral psychology, not physics. Good - that means we can skip quantum indeterminacy rabbit holes. They've got three years, so recommendations must be tractable but ambitious enough to matter.

  The ranking criteria is crucial: "upstream" means identifying leverage points. I'm looking for questions where answers would force concrete changes in institutions, not just academic papers. For example: if we resolved the capacity thresholds issue, sentencing guidelines might actually get rewritten. That's tier 1.

  AI governance pops up twice in their priorities. That's a signal. The tension between human moral reasoning and algorithmic systems needs unpacking - especially how "responsibility" gets redefined for non-conscious entities. But we must avoid sci-fi distractions; focus on current systems like autonomous vehicles or medical AI where stakes are real.

  I'm skeptical about including consciousness debates. The user called out "wheel-spinning" - rightly so. Unless consciousness directly alters institutional practices (it rarely does), it's overrated. Same for infinite regress worries about narrative selves - interesting philosophically but changes zero courtroom procedures.

  The democratic agency angle feels urgent but underdeveloped. If free will constructs are tools for power distribution, then researching how they reinforce or challenge hierarchies could reshape everything from voter rights to worker autonomy. That's tier 2 precisely because it's actionable now.

  Final litmus test for each item: Would a breakthrough here make a legislator, judge, or AI ethicist change their actual work? If not, it's out. The user wants scalpels, not hammers.
answer: |-
  Here are the five ranked by upstream impact, with overrated distinctions flagged:

  1.  **Capacity Thresholds for Blame:** Define measurable psychological capacities (e.g., impulse control, foresight, self-understanding) that *justify* blame assignment in law and morality. Settling this shifts criminal responsibility frameworks and therapeutic interventions by replacing metaphysical debates with empirical thresholds. (*Directly impacts legal doctrine & moral practices*)
  2.  **Constructed vs. Foundational Coherence:** Determine if a coherent self-narrative is primarily an internal psychological achievement or an external social/legal requirement imposed for accountability. Resolving this changes how we assess responsibility in mental health law, contract law, and AI explainability demands. (*Shifts institutional expectations of "the responsible self"*)
  3.  **Transferability of Agency Concepts:** Investigate whether capacities justifying human responsibility (e.g., reasons-responsiveness) can be meaningfully mapped onto artificial decision systems *without consciousness*, redefining "accountability" for AI governance. (*Essential for practical AI oversight, avoids metaphysical dead ends*)
  4.  **Democratic Function of Free Will:** Analyze how specific free will constructs (e.g., emphasis on choice, control) legitimize or undermine political participation, economic agency, and social power structures. Clarifying this reveals how "free will" functions as political ideology, impacting voting rights, labor policy, and social justice. (*Upstream for institutional design and power dynamics*)
  5.  **Overrated: Consciousness as the Crux:** The unresolved question of whether consciousness is *necessary* for "real" free will is overrated. Settling it wouldn't change legal culpability for unconscious actions (e.g., automatism) or practical responsibility assignments to complex non-conscious systems (like corporations or advanced AI). (*Deep-sounding but institutionally inert*)
