  Regarding their constitutional accuracy:
  For the UK, their description aligns with Bagehot's distinction - the Crown as dignified symbol vs ministers as efficient actors. The legal fiction point is valid, but their "normative mode of presentation" adds depth by capturing how the sense includes constitutional duties. 

  For Japan, Article 1's "symbol of the State" is correctly interpreted as non-governing representation. The key nuance is how this symbolic sense differs from "head of state" references despite overlapping functions.

  The core innovation - "normative mode of presentation" - strikes me as genuinely insightful rather than jargon. It addresses a gap in Frege: how institutional senses embed deontic dimensions (oughts, functions) beyond descriptive content. This bridges philosophy of language with political philosophy in a fresh way.

  I should note that while legal fiction explains the mechanics, their concept explains why these statements feel informative - because the senses carry constitutional obligations. The Bagehot connection isn't forced; it actually enriches both frameworks by showing how dignified roles generate distinct senses.

  The user's anxiety about "mashing things together" is understandable but unfounded. This is precisely how interdisciplinary philosophy advances - by testing conceptual frameworks against new domains. Their constitutional examples are well-chosen to reveal limitations in Frege's original formulation.

