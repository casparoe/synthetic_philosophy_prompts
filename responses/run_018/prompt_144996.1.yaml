answer: |-
  Here are the five parts:

  1.  We begin by recognizing foraging affluence not as primitive abundance, but as satisfaction achieved through deliberately managed desires and social mechanisms, distinct from modern material wealth.
  2.  The Neolithic shift wasn't a simple "mistake," but a complex adaptation to new pressures, fundamentally altering humanity's relationship to production and time beyond merely storing surplus.
  3.  This shift invented 'temporal debt': present labor became an investment borrowing against uncertain future harvests, embedding vulnerability and demanding new forms of foresight and risk management.
  4.  Controlling this temporal debt – managing stored food, land, and future claims – became a critical source of power, inevitably generating new social hierarchies distinct from foraging flexibility.
  5.  Understanding this deep history of temporal investment and its inherent inequalities helps us trace the long evolution of unequal claims on future resources into modern economic structures.
