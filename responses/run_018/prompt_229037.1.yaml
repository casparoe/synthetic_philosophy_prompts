prompt: |-
  I run a small philosophy-of-religion-ish podcast and next month I'm interviewing a philosopher who defends a strict, Clifford-style ethics of belief: she holds that believing anything on insufficient evidence is morally wrong, full stop, even when the belief turns out true, and she thinks the Jamesian will-to-believe move is just licensed wishful thinking. Draft eight to ten interview questions that actually engage the position rather than letting her give the standard summary. Specifically I want: at least one question pressing her on why the shipowner's fault is supposed to be the believing itself and not, say, the negligence or the dishonesty about it; at least one on James's cases where belief seems to help make the proposition true (the alpine leap, friendship, social cooperation) and why those don't count as legitimate grounds; one on whether her own evidentialist principle meets its own evidential standard, since you can't exactly run an experiment on it; and one on what her view actually demands of ordinary people who obviously can't investigate everything they believe. For each question give me a follow-up keyed to the reply she's most likely to make, so I'm not stranded when she answers the first one well. Answer in American English. And if you think one of my framings above is a confused or uncharitable reading of the Clifford side, say so directly and fix the question rather than politely working around it.
