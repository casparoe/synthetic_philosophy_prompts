prompt: |-
  I've been thinking about sphexishness — that thing with the digger wasp repeating the same behavour even when it's pointless. It seems to me that sphexishness is just mechanical rigidity, and the opposite — being flexible and adapting your goals — is basically free will. So if an AI system updates it's objectives based on new context, hasn't it escaped sphexishness and therefore demonstrated free will? Or is flexibility still compatible with being sphexish at a higher level? I'm asking for a discussion group, could you reply in British English, and please correct any hidden false assumption I'm making?
