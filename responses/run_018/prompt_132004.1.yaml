  The user's friend mentions Benatar proves every birth is a net harm leading to a moral duty to stop reproducing. That aligns with Benatar's conclusions, but I need to check if he uses the term "duty" explicitly. In "Better Never to Have Been," he argues that procreation is always morally wrong, implying a duty to avoid it. However, the extinctionist conclusion is a consequence, not a separate argument. The friend's phrasing might make it sound like an additional claim when it's derived from the asymmetry.

