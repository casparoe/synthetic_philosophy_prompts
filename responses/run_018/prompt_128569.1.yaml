answer: |-
  Here is a branching taxonomy designed for your workshop, focusing on the underlying logic of the left-right distinction rather than tribal labels. Each node is phrased as a concrete claim to avoid presupposing political identity.

  **Root Question:** Does the distinction between "Left" and "Right" retain meaning *once we separate* (a) shared moral-psychological commitments (e.g., equality vs. hierarchy, liberty vs. authority) from (b) purely coalitional/strategic dynamics (e.g., "us vs. them" group formation)?

  *   **Branch A: Yes, the distinction survives separation.**
      *   **Split A1: What holds each "side" together?**
          *   **A1a: Coherence requires a continuous underlying dimension (e.g., preference for equality vs. hierarchy).** *[Implies positions can be placed on a spectrum]*
              *   **Split A1a-i: Must both sides agree on the primary locus of normative authority?** (e.g., the State, Market, Tradition, Family, Individual Reason)
                  *   **A1a-i1: Yes, they fundamentally agree (e.g., both accept the State as primary, but differ on its *purpose*).**
                      *   *Leaf: **Social Democracy vs. Liberal Conservatism (e.g., Ordoliberalism)**. Awkward Commitment: Must explain why radical challenges to the agreed-upon institutional locus (e.g., anarchism, market fundamentalism) are conceptually marginal or unstable on their own "side".*
                  *   **A1a-i2: No, they can be defined purely negatively against each other.** *[Left defined as anti-hierarchy, Right as anti-equality/chaos]*
                      *   *Leaf: **Unnamed (Pure Oppositional Dimensionalism)**. Awkward Commitment: Struggles to account for "Left" positions valuing tradition (e.g., some indigenous movements) or "Right" positions valuing specific liberties (e.g., gun rights libertarians) without collapsing the dimension.*
          *   **A1b: Coherence permits discontinuity (e.g., distinct clusters of values held together by historical contingency or strategic necessity).** *[Implies "Left" & "Right" are internally diverse coalitions]*
              *   **Split A1b-i: Must both sides agree on the primary locus of normative authority?** (e.g., the State, Market, Tradition, Family, Individual Reason)
                  *   **A1b-i1: Yes, they fundamentally agree.** *[Rare/Unstable]*
                      *   *Leaf: **Unnamed (Contingent Institutional Consensus)**. Awkward Commitment: Requires explaining how diverse value clusters within each coalition miraculously converge on the *same* institutional authority source. Diagnosed Gap: Likely incoherent/unstable under pressure.*
                  *   **A1b-i2: No, they can be defined purely negatively against each other.**
                      *   *Leaf: **Standard Coalitional Politics**. Awkward Commitment: Must treat single-issue movements (e.g., purely environmentalist, purely nationalist) as inherently "derivative" or incomplete unless absorbed into a broader Left/Right coalition, despite their potential coherence.*

  *   **Branch B: No, the distinction does not survive separation.** *[Moral content is epiphenomenal to coalition dynamics]*
      *   **Split B1: What primarily defines the coalitions?**
          *   **B1a: Competition over the *distribution* of normative authority itself (Institutional vs. Dispersed).** *[Unconventional Framing]*
              *   **Split B1a-i: Is the Institutional/Dispersed axis continuous or discontinuous?**
                  *   **B1a-i1: Continuous Spectrum (e.g., degree of centralization).**
                      *   *Leaf: **Technocratic Centralism vs. Radical Localism/Participatory Democracy**. Awkward Commitment: Makes traditional Left/Right labels redundant *except* as historical residue; struggles to explain why "Left" statists and "Right" statists still clash fiercely.*
                  *   **B1a-i2: Discontinuous/Competing Models (e.g., sovereignty vs. polycentricity).**
                      *   *Leaf: **Hobbesian Sovereignty vs. Hayekian Spontaneous Order / Polycentric Governance**. Awkward Commitment: Must recast traditional "Left" cultural progressivism and "Right" traditionalism as *secondary* battles *within* each authority model, not defining the primary axis.*
          *   **B1b: Purely contingent group identity & resource competition.** *[Tribalism Ascendant]*
              *   **Split B1b-i: Does this tribal logic still produce something *resembling* Left/Right?**
                  *   **B1b-i1: Yes, due to historical path dependence.**
                      *   *Leaf: **Legacy Tribalism**. Awkward Commitment: Must explain the persistence of *similar* moral rhetoric across contexts despite the lack of underlying shared principle, treating ideology as purely epiphenomenal.*
                  *   **B1b-i2: No, "Left" and "Right" are entirely context-dependent labels.**
                      *   *Leaf: **Situationist Coalitionalism**. Awkward Commitment: Cannot explain the remarkable cross-cultural *resonance* and recognizability of Left/Right language, even in new contexts, without resorting to universal psychology (which Branch B rejects).*

  **Key Observations & Gaps:**

  1.  **Flagged Overlap:** "A1b-i2: Standard Coalitional Politics" and "B1b-i1: Legacy Tribalism" overlap significantly. Both see Left/Right as contingent coalitions held together by opposition. The distinction is subtle: A1b-i2 retains *some* residual meaning to the labels via negative definition, while B1b-i1 sees even that as mere legacy.
  2.  **Diagnosed Gap:** "A1b-i1: Contingent Institutional Consensus" is marked as incoherent/unstable. It requires diverse value clusters to agree on a *single* authority source purely by coalitional accident, which seems unlikely under stress.
  3.  **Unconventional Framing Impact:** The "Institutional vs. Dispersed Authority" branch (B1a) clarifies the core conflict over *who decides*, making traditional Left/Right battles over *what is decided* secondary. This clarifies why, e.g., libertarians ("Dispersed") clash with both statist leftists and social conservatives ("Institutional"). However, it makes traditional labels largely redundant or recasts them as subsets.
  4.  **Conceptual Derivative Issue:** Several leaves (e.g., Social Democracy/LibCon, Pure Oppositional Dimensionalism, Standard Coalitional Politics) struggle conceptually with single-issue or non-aligned movements.

  **Reflective Conclusion: What Would Change My Mind?**

  The structure of this tree rests on separating descriptive coalition dynamics from normative/moral content and probing the foundations of coherence. I would merge branches or abandon leaves based on:

  1.  **Empirical Observation:** Clear evidence that "Left" or "Right" coalitions exhibiting *high internal value discontinuity* (A1b) *systematically converge* on a specific, shared locus of normative authority (contradicting A1b-i2, supporting A1b-i1). Current evidence suggests they don't (e.g., "Left" contains both statists and anarchists; "Right" contains both strong-state nationalists and minimal-state libertarians).
  2.  **Conceptual Distinction:** A compelling argument showing that "normative authority" (especially in B1a) is inseparable from the *substantive values* it serves (e.g., that valuing Tradition *requires* a specific institutional form like the Family/Church, making the Institutional/Dispersed split derivative). This could collapse B1a back into A-type branches.
  3.  **Absence of Resonance:** If the "Institutional vs. Dispersed" framing (B1a) consistently fails to resonate or provide clearer explanations than traditional Left/Right in diverse political contexts during workshop testing, it would weaken its utility as a clarifying tool, though not necessarily its conceptual validity.

  This framework aims to move beyond tribal labeling by forcing examination of the *logical structure* holding political positions together (or not) and the *source* of their claimed legitimacy. Its value lies in revealing tensions and overlaps obscured by conventional terminology.
