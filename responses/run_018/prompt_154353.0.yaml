  Grading tension: 
  If this is undergrad, B+ feels right - they nailed the technical bits but missed philosophical subtlety. If grad school, might be B- territory. The clincher? If they'd cited Kuhn's "world-change" metaphor as experiential rather than literal, or mentioned the correspondence principle, that'd bump to A-. 

  Biggest doubt: 
