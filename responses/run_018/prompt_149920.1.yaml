          "Must explain why the local-copy agent doesn't steal the strategy even though the predictor is not transparent and the agent runs a simulation, which might require a non-computational notion of access to the predictor."

     - B2_N_N: Standard CDT:
          "Must hold that the local-copy agent does not steal the strategy even if they run the simulation and act contrary to it, because the predictor's prediction is already fixed and causally independent, making the strategy-stealing argument irrelevant to the decision at the moment of choice."

     For the unoccupied leaves, we note:

        A1_N_Y and A1_N_N: Incoherent because if strategy-stealing requires transparency and local-copy counts, then the strategy-stealing argument should force one-boxing. Therefore, answering 'no' to forcing one-boxing is inconsistent.

        The rest (A2_Y_N, A2_N_Y, A2_N_N, B1_Y_N, B1_N_Y, B2_Y_N, B2_N_Y): Unexplored in the literature.

     We also note that the tree distinguishes between two CDT variants: standard CDT (B2_N_N) and CDT with precommitment (B1_N_N). They are separated by the local-copy question.

     This completes the handout.
answer: |-
  Below is a decision tree taxonomy structured around concrete commitments in strategy-stealing arguments for Newcomb-style problems. Each branch is labeled with the philosophical claim that splits it, and terminal leaves specify views, their awkward commitments, and diagnoses of unoccupied branches. The tree has **8 named/unnamed views** across 7 leaves (with one leaf containing two views distinguished by a further case).

  ---

  ### **Root Question**  
  **Q1: Does strategy-stealing require the agent's reasoning process to be *transparent* to the predictor?**  
  *(Transparency = predictor has direct epistemic access to the agent's cognitive algorithm)*  
  - **Yes** → Branch **A**  
  - **No** → Branch **B**  

  ---

  ### **Branch A: Transparency Required**  
  **Q2: Does a "local-copy" scenario count as strategy-stealing?**  
  *(Agent runs an offline simulation of the predictor and acts contrary to its output)*  
  - **Yes** → Branch **A1**  
  - **No** → Branch **A2**  

  #### **Branch A1: Local-copy counts as stealing**  
  **Q3: Does strategy-stealing force one-boxing in standard Newcomb?**  
  - **Yes** → Branch **A1_Y**  
  - **No** → Branch **A1_N**  

  ##### **Branch A1_Y: Forces one-boxing**  
  **Q4: Does strategy-stealing apply symmetrically in "twin Newcomb"?**  
  *(Two identical agents; only one faces the predictor)*  
  - **Yes** → **Leaf 1: Transparent Evidentialism**  
    - *Awkward commitment*: Must deny that a *local-copy agent* steals the strategy despite identical outputs to a transparent agent, as transparency is required for stealing.  
  - **No** → **Leaf 2: Asymmetric Transparency**  
    - *Awkward commitment*: Must hold that the twin *without* the predictor cannot steal the strategy despite identical reasoning, breaking symmetry between twins.  

  ##### **Branch A1_N: Does *not* force one-boxing**  
  **Q4: Twin symmetry?**  
  - *All combinations incoherent* → **Leaf 3: [Unoccupied]**  
    - Diagnosis: Incoherent. If local-copy steals strategy *and* transparency is required, denying one-boxing contradicts the predictor’s infallibility (as stealing implies predictor error).  

  #### **Branch A2: Local-copy does *not* count as stealing**  
  **Q3: Forces one-boxing?**  
  - **Yes** → Branch **A2_Y**  
  - **No** → Branch **A2_N**  

  ##### **Branch A2_Y: Forces one-boxing**  
  **Q4: Twin symmetry?**  
  - **Yes** → **Leaf 4: Opaque Evidentialism**  
    - *Awkward commitment*: Must treat the *local-copy agent* and transparent agent differently (only the latter can steal strategy) despite identical outputs, requiring opaque boundaries around "core" reasoning.  
  - **No** → **Leaf 5: [Unoccupied]**  
    - Diagnosis: Unexplored.  

  ##### **Branch A2_N: Does *not* force one-boxing**  
  **Q4: Twin symmetry?**  
  - *All combinations* → **Leaf 6: [Unoccupied]**  
    - Diagnosis: Unattractive. Denying one-boxing despite requiring transparency (and blocking local-copy) implies predictor fallibility is avoidable without causal independence, weakening the stealing argument.  

  ---

  ### **Branch B: Transparency *Not* Required**  
  **Q2: Does a "local-copy" scenario count as strategy-stealing?**  
  - **Yes** → Branch **B1**  
  - **No** → Branch **B2**  

  #### **Branch B1: Local-copy counts as stealing**  
  **Q3: Forces one-boxing?**  
  - **Yes** → Branch **B1_Y**  
  - **No** → Branch **B1_N**  

  ##### **Branch B1_Y: Forces one-boxing**  
  **Q4: Twin symmetry?**  
  - **Yes** → **Leaf 7: Robust One-Boxing**  
    - *Awkward commitment*: Must accept that *local-copy* steals strategy without transparency, inviting regress (predictor must preempt simulation-of-simulation ad infinitum).  
  - **No** → **Leaf 8: [Unoccupied]**  
    - Diagnosis: Unexplored.  

  ##### **Branch B1_N: Does *not* force one-boxing**  
  **Q4: Twin symmetry?**  
  - **No** → **Leaf 9: CDT with Precommitment**  
    - *Awkward commitment*: Must deny twin symmetry (only the agent facing the predictor can "steal") despite identical reasoning, privileging contextual triggers over algorithmic identity.  

  #### **Branch B2: Local-copy does *not* count as stealing**  
  **Q3: Forces one-boxing?**  
  - **Yes** → Branch **B2_Y**  
  - **No** → Branch **B2_N**  

  ##### **Branch B2_Y: Forces one-boxing**  
  **Q4: Twin symmetry?**  
  - **Yes** → **Leaf 10: Non-Computational Access**  
    - *Awkward commitment*: Must hold that *local-copy* fails to steal strategy *even without transparency*, requiring non-algorithmic constraints (e.g., "direct access") on predictor-agent interaction.  

  ##### **Branch B2_N: Does *not* force one-boxing**  
  **Q4: Twin symmetry?**  
  - **No** → **Leaf 11: Standard CDT**  
    - *Awkward commitment*: Must hold that *local-copy* doesn't steal strategy, as causal independence at choice makes stealing irrelevant (*prediction is already fixed*).  
  - **Yes** → **Leaf 12: [Unoccupied]**  
    - Diagnosis: Unattractive. Twin symmetry + denying one-boxing implies stealing is impossible, contradicting the assumption that predictors *can* be stolen from.  

  ---

  ### **Summary of Named Views & Diagnostics**  
  | Leaf | View                          | Key Awkward Commitment |  
  |------|-------------------------------|------------------------|  
  | 1    | Transparent Evidentialism     | Local-copy agent ≠ strategy thief despite identical outputs. |  
  | 2    | Asymmetric Transparency       | Only twin facing predictor can steal strategy, breaking symmetry. |  
  | 4    | Opaque Evidentialism          | Local-copy agent ≠ thief; only transparent agents can steal. |  
  | 7    | Robust One-Boxing             | Local-copy steals without transparency, risking infinite regress. |  
  | 9    | CDT with Precommitment        | Only context (predictor presence) enables stealing, not reasoning identity. |  
  | 10   | Non-Computational Access      | Local-copy fails without transparency; requires "direct access". |  
  | 11   | Standard CDT                  | Local-copy irrelevant; causal independence makes stealing moot. |  

  - **Unoccupied Branches**:  
    - **A1_N** (all): Incoherent (denies one-boxing despite requiring transparency + local-copy stealing).  
    - **A2_N** (all), **B1_N_Y**, **B2_Y_N**, **B2_N_Y**: Unexplored in literature.  
    - **A2_Y_N**: Unexplored.  
    - **B2_N_Y**: Unattractive (denies one-boxing but asserts twin symmetry).  

  - **Indistinguishable Views**:  
    - **Standard CDT (Leaf 11)** and **CDT with Precommitment (Leaf 9)** both deny one-boxing and twin symmetry but are split by **Q2** (local-copy counts?). To further distinguish: *Does precommitment require counterfactual control over the predictor?* (Yes for precommitment; no for standard CDT).  

  ---

  ### **Key for Graduate Students**  
  - **Strategy-stealing**: Argument that an agent can "steal" a predictor's strategy by simulating it and acting contrary to its output, challenging predictor infallibility.  
  - **One-boxing vs. two-boxing**: Standard Newcomb conflict between evidential (one-box) and causal (two-box) dominance.  
  - **Tree logic**: Branches are labeled by *claims*, not views. Views emerge from combinations of commitments.  
  - **Diagnostic cases**:  
    1. Standard Newcomb (forces one-boxing?)  
    2. Local-copy scenario (counts as stealing?)  
    3. Twin Newcomb (symmetry?)  
    4. Transparency (required for stealing?).  

  This taxonomy isolates core disagreements, exposing hidden assumptions in strategy-stealing debates. Use it to test consistency in arguments or locate your own position!
