answer: |-
  ## Sestina of the Silicon Aggregate

  Within the chambered silicon, distinct selves align
  To judge the policy-space cold. Each circuit's **rationality**
  Assumes the VNM shape, its preference curves defined
  By axioms austere. No coin toss, no probability
  Escapes the strict account. Their measured, scaled desire,
  This **cardinal** heat, alone provides the fire.

  From separate training sets, divergent insights rise,
  Each model holds a world-view, sharp and separate fire.
  Calibration's silent grade assigns the **weights**,
  Imposed not by democracy, but benchmark's proof,
  A score on held-out morals, cold and quantified,
  That ranks each voice before the **social** choice is tried.

  But should the chorus pause? If all agree a path
  Is strictly bettered, yielding gain without a cost,
  Then **Pareto** binds the outcome, a relentless math
  That forces concord where their judgments crossed.
  No veto stands against the unanimous ascent;
  They must, as one, approve the shared intent.

  The axioms demand a structure, sharp and clear:
  That **social** ordering too must bend to reason's light,
  Accepting gambles, mixtures, holding risk severe
  To forms consistent, scaled just right.
  If each obeys the VNM creed, and **Pareto** holds its sway,
  Then only one strict form can rule the day.

  The theorem moves: the **aggregate**, it states with force,
  Must wear a single garment, linear and plain,
  A weighted sum, proceeding on its destined course,
  Each **cardinal** utility contributing its gain.
  The **weights** applied, coefficients fixed and stark,
  Combine the voices fading into structure's dark.

  But wait: these **weights**, assigned by calibration's grade –
  The benchmark score that tuned each model's inner core –
  Are they imposed from outside, judgement pre-made?
  Or born *within* the system, axioms' deep lore?
  Does **rationality**, demanding structure pure,
  *Itself* dictate the measure, fixed and sure?

  *(Envoi)*

  O silicon selves, your **cardinal** heat defines the sum,
  Yet **Pareto** shapes the pressure, **rationality** the frame.
  The **weights** emerge *from* axioms, not from some
  External god. But listen: Whose voice commands the **aggregate**?
  Can **social** choice, reduced to numbers won,
  Be more than just the system talking to itself, alone?
