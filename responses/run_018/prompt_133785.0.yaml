answer: |-
  **Villanelle of the Binding Vow**

  When words take flight beyond the present breath,
  A future shaped by what I now declare,
  *You build an expectation, then a threat.*

  Is duty born before the promise met?
  Or only when they trust, and lean, and dare?
  When words take flight beyond the present breath,

  A structure forms that might defy mere death
  Of whim or will. What makes its weight so rare?
  *You build an expectation, then a threat.*

  Perhaps the power lies within the pledge I’ve set:
  A chain I forge, a burden I must bear.
  *My will enacted when the vow takes flight.*
  This act itself commands, without regret.
  But does my choice alone cause such a blight?
  *You build an expectation, then a threat.*

  If trust is absent, is the promise dead?
  Or does the uttered word demand its share?
  When words take flight beyond the present breath,

  The social fabric holds the promise taut,
  Yet deeper roots might anchor it elsewhere.
  *My will enacted when the vow takes flight.*
  And if they never lean, is duty null?
  Does binding force require another's fright?
  *You build an expectation, then a threat.*

  Two answers clash within the moral night:
  *My will enacted when the vow takes flight,*
  *You build an expectation, then a threat.*
  These two roots hold the vow's commanding might
  But which one bears the promise’s true right?
