answer: |-
  **1. Preliminary Brainstorming**  
  Reflective equilibrium: Involves mutual adjustment of beliefs/principles toward coherence, but this oscillation persists *without* achieving equilibrium.  
  Performative contradiction: Occurs when an utterance invalidates its own presupposition, but here each phase is locally consistent without inherent contradiction.  
  Self-defeating prophecy: A prediction causing its own falsification, but this cycle has symmetric reversal rather than terminal defeat.  
  Newcomb-style reasoning: Involves predictors and agents in mutual influence, but lacks the core feature of a *self-model* updated by its own output.

  **2. Diagnosis and Nearest Concepts**  
  No established concept precisely fits this configuration. The oscillation is a distinct failure mode of embedded self-modeling.  

  *Performative contradiction* fails to apply: Each decision rule (R or R') is internally consistent when applied under its corresponding self-model (M or M'). There is no statement or rule that negates its own preconditions (e.g., "I do not exist" or "This rule is invalid"). The issue is not contradiction but *unstable epistemic dynamics*: M justifies R, whose output B updates to M', which justifies R', whose output B' updates back to M. Each step is locally valid, but the loop prevents stabilization.  

  *Reflective disequilibrium* and *self-defeating prophecy* are partial analogs but insufficient. Reflective disequilibrium describes *temporary* incoherence during belief revision, not a persistent, stable loop. Self-defeating prophecy captures a *terminal* outcome (e.g., predicting panic causes panic, falsifying the prediction), but this cycle has no terminus—it indefinitely alternates between two self-reinforcing states. Each transition (e.g., welfare-maximizer → cooperator) is "defeated" only in the sense of triggering its counterpart, not erasing its own possibility. The prophecy analogy breaks because the oscillation is symmetric and reversible, not a one-way collapse.

  **3. Proposed Concept**  
  **Reflexive oscillation** (newly coined term):  
  *Formal Definition*: A sustained cyclic alternation between two (or more) self-models in an embedded agent, where:  
  (i) The agent is physically embedded in its environment;  
  (ii) Its decision procedure explicitly uses a self-model as input;  
  (iii) Self-model updates depend on actions taken under the current self-model;  
  (iv) Actions under self-model Mᵢ induce an update to Mⱼ, while actions under Mⱼ induce an update back to Mᵢ;  
  (v) Both Mᵢ and Mⱼ are locally coherent (no internal inconsistency) and computationally tractable.  

  *Typical Markers*: Non-converging feedback, absence of terminal contradictions, environmental conditions that alternately validate competing self-descriptions.  
  *Clear Instance*: The climate-policy model oscillating between emission paths R and R’ as each path’s environmental effects validate the alternate model’s recommendations.  
  *Boundary Case* (does not belong): A *self-defeating prophecy* (e.g., announcing "This prediction will cause panic" triggers panic, confirming the prediction). This lacks alternation—it terminates in a single self-fulfilling loop. Reflexive oscillation requires two distinct self-models that *mutually* trigger each other’s reinstatement.

  **4. Implications for Embedded Agency**  
  Isolating reflexive oscillation reveals a critical stability condition: embedded agents require *self-model update rules resilient to the environmental feedback they induce*. Broader notions of "reflexivity" or "self-reference" obscure this by conflating terminal paradoxes (e.g., liar paradox) with dynamic, environmentally mediated cycles. This pattern demonstrates that coherence and computability alone cannot guarantee stability; convergence depends on how the update function interacts with the *causal consequences* of actions generated under the self-model. Recognizing reflexive oscillation forces attention to hysteresis, update damping, or counterfactual robustness in self-model design—specific challenges unique to agents embedded in environments they co-constitute.
