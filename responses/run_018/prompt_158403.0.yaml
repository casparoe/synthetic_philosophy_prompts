  I'm the senior ethics reviewer for a multi-faith humanitarian network that issues quarterly operational guidance to field teams working in conflict zones. Our partner traditions disagree sharply over whether a moral constraint—say, that staff must never cooperate with armed groups to secure access, or that unpayable debts among displaced populations must be cancelled—is authoritative because it is rationally warranted and our traditions happen to align with it, or because specific revealed commands constitute it as wrong with no further reason required. I need a reusable decision procedure that my team, trained in theology but not in formal philosophy, can run in about thirty minutes on any proposed directive before it goes into a brief. The deliverable should be an ordered checklist of diagnostic questions—each with conditions for a sufficient answer, explicit stop-points where the decision must be handed to a theologian rather than resolved by fact, and clear flags where judgment is unavoidable—grounded in the conceptual space of the Euthyphro dilemma but translated into operational language. Specifically, it must distinguish four categories: command-constituted obligations (where the wrongness is created by the command itself, as with ritual or covenantal duties), reason-tracked obligations (where the command tracks an independent moral fact), hybrid covenant-reason cases, and misaligned cases where a putative command conflicts with independently warranted morality. Include a small set of concrete tests—about counterfactual stability of the obligation across possible worlds, accessibility of the justification to outsiders, and whether the obligation survives if the command were withdrawn—that can be applied without knowing philosophical labels. Then run the procedure on three directives: (a) an absolute prohibition on torture of detainees, (b) a seventh-year debt-release policy applied in refugee camps, and (c) a partner-tradition dietary restriction that field