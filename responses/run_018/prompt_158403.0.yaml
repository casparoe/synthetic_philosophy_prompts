answer: |-
  ### Reusable Decision Procedure: Moral Constraint Classification Checklist  
  **Purpose**: To classify moral constraints in operational directives into one of four categories:  
  1. **Command-Constituted Obligation (C-CO)**: Wrongness/prohibition exists *only* because of a specific revealed command (e.g., ritual duties).  
  2. **Reason-Tracked Obligation (R-TO)**: Command aligns with an independent moral fact (e.g., prohibitions against murder).  
  3. **Hybrid Covenant-Reason (HCR)**: Obligation blends covenantal duty and independent moral reasoning (e.g., debt relief with both theological and humanitarian grounds).  
  4. **Misaligned Case (MIS)**: Putative command conflicts with independently warranted morality (e.g., a command that requires harm).  

  **Instructions**:  
  - Answer questions in order.  
  - **Stop-Points**: Hand to a theologian if answers are ambiguous, contested, or require tradition-specific revelation.  
  - **Judgment Flags**: Mark if the answer relies on unavoidable ethical/value judgments.  
  - **Time Limit**: 30 minutes per directive. If unresolved at Stop-Point, escalate.  

  ---

  #### Checklist: Diagnostic Questions  
  1. **Source of Constraint**  
     - *Question*: Is the constraint explicitly grounded in a *specific revealed text, tradition, or covenantal relationship* (e.g., scripture, prophetic teaching, sacramental practice)?  
     - *Sufficient Answer*:  
       - **Yes** + citation (e.g., "Leviticus 25: debt release") → Proceed to Q2.  
       - **No** (e.g., "based on human rights law") → Classify as **R-TO** (skip to Q6 for conflict check).  
     - *Stop-Point*: If grounding is disputed (e.g., "some traditions cite revelation, others deny"), hand to theologian.  
     - *Judgment Flag*: If "yes" but revelation is symbolic/metaphorical.  

  2. **Justification Basis**  
     - *Question*: Can the constraint be *fully justified* to someone outside the tradition *without referencing revelation* (e.g., using reason, empathy, or universal consequences)?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., "torture causes psychological harm") → Proceed to Q3.  
       - **No** (e.g., "only because God commanded it") → Classify as **C-CO** (skip to Q6).  
     - *Stop-Point*: If justification is partially dependent on revelation (e.g., "reason supports it, but revelation defines its scope"), hand to theologian.  

  3. **Counterfactual Stability Test**  
     - *Question*: If the command had *never existed*, would the action still be morally wrong/required? Consider:  
       - Would outsiders (e.g., secular humanitarians) agree?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., "murder would still be wrong") → Proceed to Q4.  
       - **No** (e.g., "eating pork would be neutral") → Classify as **C-CO**.  
       - **Partially** (e.g., "debt relief is good, but not necessarily every 7 years") → Proceed to Q4.  
     - *Judgment Flag*: If stability depends on contested philosophical premises (e.g., "is human dignity absolute?").  

  4. **Accessibility Test**  
     - *Question*: Can the *full rationale* for the constraint be understood by an outsider *without theological training* (e.g., explained in a neutral humanitarian briefing)?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., "torture undermines human dignity") → Proceed to Q5.  
       - **No** (e.g., "only covenantal obedience matters") → Classify as **C-CO**.  
     - *Stop-Point*: If rationale requires nuanced theological concepts (e.g., "sin", "covenant"), hand to theologian.  

  5. **Command Withdrawal Test**  
     - *Question*: If the command were *revoked*, would the obligation *still bind* those within the tradition?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., "even without a command, torture is wrong") → Classify as **R-TO**.  
       - **No** (e.g., "dietary rules lose force if not commanded") → Classify as **C-CO**.  
       - **Partially** (e.g., "debt relief is still good, but not obligatory in this form") → Classify as **HCR**.  
     - *Judgment Flag*: If revocation scenario is theologically implausible (e.g., "God cannot revoke this").  

  6. **Conflict Check (Mandatory for All)**  
     - *Question*: Does the constraint *conflict* with independently warranted morality (e.g., causes avoidable harm, violates dignity, or contradicts consensus ethics)?  
     - *Sufficient Answer*:  
       - **Yes** (e.g., "a command to return refugees to danger") → Classify as **MIS**.  
       - **No** → Finalize prior classification.  
     - *Stop-Point*: If conflict is alleged but not proven (e.g., "is debt release unfair to creditors?"), hand to theologian.  

  ---

  ### Application to Sample Directives  
  #### (a) Absolute Prohibition on Torture of Detainees  
  1. **Source**: No explicit revelation cited (grounded in international law/human dignity). → **R-TO** (proceed to Q6).  
  2. **Conflict Check**: No conflict with independent morality (torture violates dignity). → **R-TO confirmed**.  
     - *Issue*: The procedure *cannot settle* if a tradition claims torture is command-constituted (e.g., "God permits torture in war"). This forces a **Stop-Point** at Q6 due to potential MIS conflict (e.g., "absolute prohibition may hinder saving lives"). Hand to theologian for value-judgment on absoluteness.  

  #### (b) Seventh-Year Debt-Release Policy in Refugee Camps  
  1. **Source**: Yes (Leviticus 25, Quranic debt ethics). → Proceed.  
  2. **Justification**: Yes (prevents poverty cycles; accessible via economic justice arguments). → Proceed.  
  3. **Counterfactual Stability**: Partially—debt relief is stable, but 7-year cycle is not (outsiders may prefer case-by-case). → Proceed.  
  4. **Accessibility**: Yes (humanitarian need for economic resilience). → Proceed.  
  5. **Command Withdrawal**: Partially—core relief obligation remains, but specific timing lapses. → **HCR**.  
  6. **Conflict Check**: No conflict (aligns with harm prevention). → **HCR confirmed**.  

  #### (c) Partner-Tradition Dietary Restriction (e.g., No Pork)  
  1. **Source**: Yes (e.g., Leviticus 11, Quran 2:173). → Proceed.  
  2. **Justification**: No—cannot be fully justified without revelation (e.g., health arguments are secondary). → **C-CO**.  
  3. **Conflict Check**: No conflict (dietary choice doesn’t harm others). → **C-CO confirmed**.  
     - *Operational Implication*: Not binding on non-adherent staff. **Board Resistance Expected**—traditions may view this as covenantal, but procedure shows it fails accessibility (Q4) and counterfactual stability (Q3: pork is neutral without command).  

  ---

  ### Limitations of the Procedure  
  1. **Meta-Theological Disputes Left Untouched**:  
     - Cannot resolve traditions that deny modal independence of morality (e.g., Divine Command Theory). For these, *all* constraints default to **C-CO**, making tests like counterfactual stability (Q3) or command withdrawal (Q5) irrelevant.  
     - Cannot arbitrate hermeneutic conflicts (e.g., is a command literal or contextual?).  
     - Assumes "independent morality" is accessible via reason; fails if a tradition rejects rational warrant (e.g., fideism).  

  2. **Systematic Misfires**:  
     - **If morality has no independence from divine will**: The procedure will misclassify **R-TO/HCR** cases as **C-CO** (e.g., torture might wrongly be deemed C-CO if divine will is seen as the sole moral source).  
     - **Hybrid Cases**: Risks oversimplifying HCR obligations (e.g., debt release) if the "partially" option (Q3/Q5) is not carefully applied.  
     - **Judgment Flags**: Relies on team’s ability to discern "independent morality"; may misfire in culturally contested zones (e.g., gender roles).  

  3. **Operational Blind Spots**:  
     - Cannot handle commands with no clear revealed source (e.g., oral traditions).  
     - Does not address scalability (e.g., dietary rules in large kitchens may be pragmatically binding for unity, even if theologically C-CO).  
     - Silent on historical/cultural weight of obligations (e.g., dietary rules as identity markers).  

  **Final Note**: This procedure clarifies *why* a constraint binds, not *whether* it should be implemented. Operational unity may require respecting C-CO obligations for community cohesion, even if not universally binding. Escalate meta-ethical disputes to theologians.
