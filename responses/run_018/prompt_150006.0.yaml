  First, I need to recall the core of Scanlon's contractualism. The pairwise justifiability constraint means that principles must be justifiable to each individual. The aggregation problem arises because saving five lives vs. one seems intuitively stronger, but justifying why one person should bear the cost for the greater good is tricky within pairwise terms.

  For desiderata, I should list key requirements. Start with the standard rescue case—numbers must matter. Then asymmetric cases where harms aren't independent; the solution must handle interdependence without unfairness. Intergenerational cases need addressing non-identity problems. Distinctions like weight vs. aggregative force are crucial to avoid collapsing into utilitarianism. Also, direct vs. indirect pairwise relations to maintain contractualism's core.

  Next, identify non-negotiables. Pairwise justifiability is central, so any solution must respect individual reasons without aggregating. But numbers mattering might be a negotiable for some, though most see it as essential. The tension: how to let numbers count without adding up reasons, which pairwise constraints prohibit.

  Now, for the scorecard. Scanlon's weighted reasons: allows variable weights but struggles with large numbers and asymmetric cases. Taurek denies numbers, which is simple but counterintuitive. Threshold approaches add sensitivity but might compromise pairwise justifiability near thresholds.

  I should check if all desiderata are covered. Asymmetric interdependence cases like the bridge trolley variant and intergenerational issues like climate change policies. The user might also need clarity on why certain desiderata conflict. For instance, satisfying numbers mattering and pairwise justifiability simultaneously is the main tension.

  Deep needs: The user likely wants a structured framework to critically assess readings. They need clear criteria to compare theories without external sources. Ensuring each desideratum is explicit with cases and distinctions helps them apply it in class discussions or papers. Highlighting the tension prepares them to engage with literature's central debate.
answer: |-
  Here is a specification of desiderata for evaluating contractualist resolutions of the aggregation problem, followed by an analysis of tensions and a concise scorecard:

  **Desiderata for Adequate Contractualist Resolution:**

  1.  **"Numbers Matter" Intuition (Non-Negotiable Preference):**
      *   **Phenomenon:** Standard Rescue Cases (e.g., saving 5 vs. saving 1).
      *   **Requirement:** Must explain why saving the larger group generates a stronger moral reason *prima facie*.
      *   **Distinction:** Must preserve the intuition that numbers *do* count in standard cases, distinguishing it from Taurek's denial. While core contractualism might *prefer* this, its strict denial is a logically coherent position (making it negotiable in principle, though highly counterintuitive).

  2.  **Pairwise Justifiability Constraint (Non-Negotiable Core):**
      *   **Phenomenon:** All cases involving conflicting claims (Rescue, Asymmetric Interdependence, Intergenerational).
      *   **Requirement:** The justification for a principle permitting an outcome must be acceptable to each affected individual considered separately; rejection must be reasonable *to that individual* given their burden.
      *   **Distinction:** Fundamental to contractualism vs. consequentialism. Prevents aggregating burdens/savings across individuals into a single sum. Requires focusing on the *reasonableness* of a burden *to each person* bearing it.

  3.  **Distinction between Weight and Aggregative Force (Non-Negotiable Core):**
      *   **Phenomenon:** Any case where multiple individuals have similar claims.
      *   **Requirement:** Must account for the increased moral force favoring saving the larger group without implying that the *intrinsic weight* of saving any single individual is increased by the presence of others needing saving, or that burdens are summed.
      *   **Distinction:** Crucial for avoiding collapse into utilitarianism. The strength of the reason to save the group ≠ the sum of the weights of individual reasons.

  4.  **Handling Asymmetric Interdependence (Non-Negotiable Core):**
      *   **Phenomenon:** Cases where harms/benefits are not independently distributed (e.g., Trolley Bridge variant: saving 5 requires sacrificing 1 specific person; or saving A saves B, but saving B doesn't save A).
      *   **Requirement:** Must justify outcomes where saving many imposes a fatal burden on a specific individual, or account for compound claims, without illicit aggregation.
      *   **Distinction:** Must provide a justification *to the sacrificially burdened individual* that doesn't rely *solely* on the greater number saved (which would violate pairwise justifiability), while still explaining the permissibility of the action.

  5.  **Addressing the Non-Identity Problem (Non-Negotiable Core for Intergenerational Justice):**
      *   **Phenomenon:** Intergenerational Cases (e.g., policies causing lesser harm to future, non-identical people vs. imposing greater burdens on present people to prevent that harm).
      *   **Requirement:** Must generate plausible duties to future generations whose very existence and identity depend on the policy choice, preventing the argument that no one is made worse off (since without the policy, *they* wouldn't exist).
      *   **Distinction:** Requires justifying a burden on present individuals *to* future individuals who cannot coherently complain they are worse off than they would otherwise have been. Must do this without aggregating the lesser harms to many future people into a total burden outweighing the present burden.

  6.  **Distinction between Direct and Indirect Pairwise Relations (Non-Negotiable Core):**
      *   **Phenomenon:** Cases involving compound claims or indirect effects (e.g., saving A saves B; policies affecting group membership or relationships).
      *   **Requirement:** Must respect that justification runs directly between the agent/principle and *each* affected individual. Cannot ground the permissibility of burdening X *directly* on the benefit to Y, unless mediated through a general principle justifiable to X.
      *   **Distinction:** Ensures the focus remains on the individual agent-patient justificatory relationship, preventing justifications that bypass the individual by appealing only to group effects.

  **The Central Tension:**
  The core tension arises between **Desideratum 1 (Numbers Matter)** and the strict interpretation of **Desideratum 2 (Pairwise Justifiability)**. Saving the five instead of the one in the standard case seems to require that the claims of the five *collectively* outweigh the claim of the one. However, Pairwise Justifiability forbids aggregating claims. Justifying to the one why they must bear the fatal loss *solely* by pointing to the greater number saved (the benefit to the five) appears to violate Desideratum 2, as it asks the one to accept their loss *because* of the aggregate gain to others – precisely the kind of interpersonal aggregation contractualism rejects. Any solution must satisfy Desideratum 1 *without* violating Desideratum 2 (and Desiderata 3 & 6), which is the fundamental challenge.

  **Concise Scorecard:**

  1.  **Scanlon (Variable Weight/Individualist Aggregation):** Attempts to satisfy **1** by arguing that the number affected can change the *kind* of reason present (e.g., preventing a "catastrophe"), increasing its weight *for each individual consideration* without simple summation (**3**). Struggles significantly with **4** (direct sacrificial cases) and **5** (non-identity), as justifying the burden to the sacrificed individual or the present generation remains difficult within pure pairwise terms. Strictly maintains **2** and **6** by rejecting direct interpersonal aggregation.
  2.  **Taurek (Numbers Don't Count):** Embraces **2**, **3**, **4** (by denying sacrifice is justified), **5** (by denying duties based on impersonal "losses"), and **6** strictly, as it rejects any role for numbers in pairwise justification. Explicitly and radically fails **1**, denying the intuitive moral difference in standard rescue cases, which most find unacceptable.
  3.  **Threshold Contractualism:** Aims to satisfy **1** and **5** by making the permissibility of imposing a burden sensitive to the *number* of others who would suffer comparable burdens if the action isn't taken, but only once a threshold is crossed. Seeks to preserve **2** by framing rejection by an individual below the threshold as unreasonable. Risks compromising **2** and **6** near the threshold (why is rejection unreasonable for *n* individuals but reasonable for *n-1*?); the threshold mechanism can resemble disguised aggregation. Faces challenges with **4** (direct sacrifice) and defining the threshold non-arbitrarily. Struggles to fully uphold **3**.
