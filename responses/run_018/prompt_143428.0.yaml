  Then list the cruxes—sub-questions such that settling them would move at least one side. These should include whether there exists a principled, domain-independent boundary between omission and distortion; whether predictive success in any well-confirmed domain genuinely requires distortion rather than mere omission; and whether a model that succeeds predictively despite distortion can still be trusted for counterfactual policy guidance. For each crux, specify the concrete case, argument, or modeling scenario both sides agree is diagnostic, and record each side's predicted verdict in advance.

