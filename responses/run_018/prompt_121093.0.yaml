  I should identify where Hume's physical-money assumptions crack. His reliance on tangible scarcity (like gold) doesn't translate to digital scarcity created by code. The separation of money issuance from the state in crypto contrasts with Hume's view of money as a state-convention. Additionally, programmable money in CBDCs allows active policy interventions beyond Hume's passive mechanisms. 

