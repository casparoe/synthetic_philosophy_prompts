answer: |-
  **Commonwealth of Affected Interests Handbook: Membership Classifications & Suffrage Procedures (Rev. 7.3)**

  **1. Introduction: The Affected Interests Demarcation System (AIDS)**
  The Commonwealth guarantees democratic legitimacy through the rigorous, real-time application of the All-Affected Interests Principle (AAIP), as operationalized by the Affected Interests Demarcation System (AIDS). This algorithmic framework, certified annually for neutrality by the Office of Algorithmic Integrity (OAI), dynamically assigns suffrage rights and representation weights commensurate with the quantifiable impact of governmental decisions upon entities. Membership is not static but contingent upon demonstrable, algorithmically verified affectedness. Appeals regarding classification or weighting may be submitted via Form AI-7 to the Bureau of Stakeholder Verification (BSV).

  **2. Full Citizens (FC)**
  2.1. Definition: FC status is accorded to permanent residents demonstrably affected by core, long-term sovereign functions, primarily infrastructure development (≥10-year horizon), foundational tax policy, and territorial defense. Proof of Affectedness requires documented residency exceeding 5 consecutive years and a positive correlation score (>0.85) on the Longitudinal Impact Assessment (LIA) administered bi-annually via the myAffect.gov portal.
  2.2. Rights & Duties: FCs possess full suffrage in General Elections (GE), eligibility for public office, and unrestricted access to the Permanent Policy Deliberation Platform (PPDP). Mandatory participation in the Decadal Infrastructure Preference Survey (DIPS) is required to maintain status. Failure to complete DIPS triggers a Provisional Stakeholder review (Section 3).

  **3. Provisional Stakeholders (PS)**
  3.1. Definition: PS status applies to entities experiencing significant, measurable impact from specific, time-bound policies, but lacking FC permanence. Primary categories include:
      *   **3.1a. Non-Resident Economic Actors:** Individuals or corporate entities engaged in cross-border trade or labor within the Commonwealth for periods exceeding 30 days but less than 5 years. Impact is calculated using the Trade & Labor Externalities Matrix (TLEM), factoring tariffs, regulatory compliance costs, and wage exposure.
      *   **3.1b. Transient Populations:** Tourists, students, or temporary workers residing <1 year. Suffrage is granular, issued via Temporary Voter-Cards (TVCs) valid *only* for referenda or representative votes directly concerning policies with externality durations matching their documented stay (e.g., a tourist present during a 2-week noise ordinance debate receives a TVC valid solely for that vote).
  3.2. Rights & Duties: PS suffrage is limited to policies within their certified scope of affectedness, exercised through the Provisional Policy Interface (PPI). PS entities must register external economic activities quarterly via Form PS-12. Status lapses automatically upon cessation of qualifying activities or residency, verified through the Automated Residency & Activity Tracker (ARAT).

  **4. Non-Human Proxies (NHP)**
  4.1. Definition: Recognizes the affected interests of non-human entities significantly impacted by zoning, environmental, or agricultural policy, as defined by the Environmental Welfare Impact Threshold (EWIT). Designated Proxy Advocates (PAs), certified by the Ecological Representation Council (ERC), cast weighted ballots on their behalf.
  4.2. Representation Mechanism:
      *   **4.2a. Terrestrial/Wildlife:** PAs utilize habitat viability models and population density metrics. (e.g., In Watershed District 7B, the ERC-certified PA casts ballots weighted 0.003 per estimated adult salmon spawner on fisheries management votes).
      *   **4.2b. Domesticated Animals:** Livestock and companion animal proxies are weighted based on standardized Welfare Impact Units (WIUs) derived from stocking density regulations and veterinary welfare codes. Appeals regarding WIU calculations require peer-reviewed ethological impact studies submitted to the ERC Appeals Panel.

  **5. Probabilistic Future-Generation Avatars (PFGA)**
  5.1. Definition: Algorithmic constructs representing the aggregate estimated interests of individuals likely to exist 25-100 years hence, based on current demographic projections, resource depletion models, and climate impact forecasts maintained by the Office of Intertemporal Justice (OIJ).
  5.2. Suffrage Implementation: PGFAs are granted a cumulative suffrage weight equivalent to 15% of the current FC electorate. Votes are cast by OIJ-appointed Statutory Futurists (SFs) based on the output of the Intergenerational Equity Algorithm (IEA). Citizens may petition for PFGA weight adjustments related to specific long-term infrastructure projects using Form IEA-5, citing actuarial or climatological data inconsistencies. Significant misclassification of a PFGA cohort’s projected interests (determined post-hoc by OIJ audit) may entitle recognized descendant groups to symbolic reparation credits, applicable against future carbon offset fees (Schedule D, Reparation Credit Table).

  **6. Meta-Voters (MV)**
  6.1. Definition: A specialized subset of FCs, selected via sortition from the FC pool scoring >0.95 on the Demarcation Competency Index (DCI – measuring comprehension of AAIP principles and algorithmic fairness concepts), tasked solely with adjudicating amendments to the AIDS framework itself, including the AAIP weighting formulae, BSV procedures, and OAI certification protocols.
  6.2. Procedure: Every five years, coinciding with Foundational Algorithm Day (a national holiday commemorating the ratification of the original AIDS charter), a Constitutional Convention of Meta-Voters (CCMV) is convened. Proposed amendments require a 2/3 supermajority vote by the CCMV. All amendments are subject to a mandatory Recursive Stakeholder Audit (RSA) *prior* to implementation. The RSA simulates the amendment’s potential effects on the current composition and suffrage weights of *all* stakeholder classes (FC, PS, NHP, PFGA) and the selection criteria for future MVs, ensuring no amendment creates a self-entrenching paradox (e.g., disproportionately empowering a group likely to favor future self-empowering amendments). RSA results are published for FC review, though no ratification vote beyond the CCMV is required.

  **7. General Suffrage Administration**
  *   All suffrage exercises utilize the Integrated Balloting Infrastructure (IBI), which dynamically generates unique ballots for each voter based on their current classification(s) and certified scope of affectedness for the specific decision at hand.
  *   Voter registration is continuous and automated through AIDS linkage to residency, economic activity, environmental sensor, and demographic databases. Opt-out is permissible only upon verified permanent emigration and relinquishment of all assets subject to Commonwealth policy externalities.
  *   Challenges to an entity's classification, weight, or the scope of its affectedness for a specific vote must be filed with the BSV at least 30 days prior to the relevant suffrage event. BSV determinations are final unless new, material, quantifiable evidence of affectedness emerges, warranting re-evaluation under Article 12 of the Demarcation Code.

  **End of Document**
