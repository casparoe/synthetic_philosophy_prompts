prompt: |-
  ok so ive been arguing with my cousin about whether working-class values are actually more defensible than the kind of professional-class outlook you see on linkedin or whatever. i dont have any academic background, just been thinking through cases where my gut picks one side and i want to know if theres a real pattern behind it.

  my verdicts:

  - my uncle turned down a promotion that woulda doubled his pay but meant moving 200 miles away. he said family and the land matter more than a title. i think he was right.
  - my neighbor wont call out her coworker for showing up drunk on the factory line because you dont rat out your people, even though they aint family, just same shift. that feels wrong to me, even though its loyalty.
  - my dad thinks paying a mechanic to fix your truck when you could learn it yourself is shameful, like admitting defeat. i actually defend that. it feels like self-respect, not just stubbornness.
  - my friend from college skipped her dads funeral because she said she needs boundaries and he was toxic for years. part of me thinks shes just being selfish, but then i think about my uncle staying put and i flip. this is the one i keep going back and forth on.
  - our church runs a food pantry with zero paperwork. professionals say people game it and its inefficient. i think the trust version is better, but i cant explain why without sounding like im just romanticizing poverty.

  i think the pattern might be something like values that only work because youre tied to a place and people you actually know versus values you can carry anywhere like a resume. but that doesnt quite fit case 4. is there one principle that saves my verdicts on cases 1, 3, and 5, explains why 2 is wrong, and tells me whether 4 is okay or not? please dont just lay out options and leave me hanging -- take a definite position, give your reasons, and say which of my verdicts has to go if they cant all live together.

  also tell me what it predicts for a case i havent listed: a factory worker refuses overtime pay because the company just laid off people at another plant, even though he legally earned it. does your principle say hes right or wrong?
reasoning: |-
  Okay, the user is having a debate with their cousin about working-class versus professional-class values. They've listed several personal examples where their gut reactions differ and are looking for a unifying principle. Let me start by understanding each case they mentioned.

  First, their uncle turned down a promotion for family and land. The user agrees. Then, a neighbor not reporting a drunk coworker—user thinks that's wrong despite loyalty. Their dad insists on fixing his own truck to avoid shame, but the user thinks paying a mechanic is fine. The college friend skipping her toxic dad's funeral has them conflicted. And the church's no-paperwork food pantry, which they support despite inefficiency claims.

  They want a principle that explains their stance on cases 1,3,5, rejects case 2, and clarifies case 4. Also, they need an answer to the overtime refusal scenario. The deeper need here seems to be validating their intuition with a coherent framework. They might feel caught between two value systems and seek justification for their mixed reactions.

  Looking at their examples, a pattern of **context-dependent moral weight** emerges. The value of loyalty or practicality shifts based on the situation's impact. In case 1, staying put preserves existing bonds. Case 2's loyalty enables harm, so it's misplaced. Case 3: paying a mechanic respects others' expertise and time. Case 5's trust-based system avoids dehumanizing bureaucracy. 

  Case 4 is tricky. The user flip-flops because skipping the funeral could be self-care or selfishness. My principle suggests that if the father's toxicity caused real harm, boundaries are valid. But if it's minor conflict, attending might be better. The user needs to assess the harm level here.

  For the overtime case, refusing pay in solidarity after layoffs is defensible. The worker prioritizes collective well-being over individual gain, aligning with community values. But if refusing overtime harms his own family's stability, it might be unwise. Context matters.

  The user’s inconsistency in case 4 shows they need to evaluate the toxicity's severity. Their other verdicts hold under the principle. The overtime example tests the principle's flexibility—showing solidarity when it doesn't cause direct harm is right, but if it does, it's problematic. This gives them a tool to judge similar situations.
answer: |-
  Here's the unified principle that explains your judgments and resolves the tension in Case 4:

  **The Defensible Value: "Contextual Integrity Over Abstract Rules"**

  Working-class values often prioritize the **integrity of immediate relationships and concrete community needs** over abstract principles (like maximum efficiency, universal rules, or individual advancement). This becomes defensible when:
  1.  **It preserves essential human bonds** (family, trusted community).
  2.  **It prevents tangible harm** to vulnerable individuals or the social fabric.
  3.  **It avoids dehumanizing bureaucracy** where rules override basic human dignity.
  4.  **It doesn't enable serious, immediate harm or injustice.**

  **Applied to Your Cases:**

  1.  **Uncle Turns Down Promotion (Your Verdict: Right):** **Defensible.** Prioritizes concrete family bonds and connection to place ("the land" = community/roots) over abstract career advancement and money. Protects essential human bonds (#1). *Professional Outlook Flaw:* Treats people as mobile career units, ignoring rootedness.

  2.  **Neighbor Won't Report Drunk Coworker (Your Verdict: Wrong):** **Indefensible.** "Loyalty" here enables serious, immediate physical danger (#4 violation). Protecting "your people" shouldn't override preventing tangible harm to *those same people* (or others) on the factory floor. It's loyalty misplaced, prioritizing group cohesion over concrete safety. *Working-Class Value Flaw:* Blind loyalty without a harm assessment.

  3.  **Dad Shames Paying Mechanic (Your Verdict: Defend Paying):** **Defensible (Your View).** Paying a skilled professional respects their expertise and values your own time/energy/resources appropriately within the community economy. The dad's view mistakes self-reliance for stubbornness, potentially ignoring the value of specialization and trade (#3 violation if it leads to unnecessary struggle). *Working-Class Value Flaw:* Overly rigid self-reliance can become inefficient and disrespectful of others' roles.

  4.  **Friend Skips Toxic Dad's Funeral (Your Conflict):** **Defensible (She's Likely Right).** Boundaries exist to protect essential well-being (#2 - prevents tangible *emotional/psychological* harm to *her*). Attending a toxic parent's funeral often serves abstract social obligation ("should") or performs grief for others, not genuine relationship integrity. *However...* **The Severity Matters:** If the toxicity was severe abuse causing ongoing harm, skipping is strong self-preservation. If it was merely difficult personality clashes, skipping *might* tip towards self-absorption. **Your gut flips because "family" (Case 1) is concrete and positive, while "toxic" implies concrete harm to avoid.** The principle prioritizes *healthy* bonds and *avoiding harm* over abstract familial duty.

  5.  **Church Food Pantry - No Paperwork (Your Verdict: Better):** **Defensible.** Prioritizes human dignity (#3 - avoids dehumanizing means-testing) and meets immediate concrete need within a trusting community (#1). Accepts some "gaming" (often overstated) as a lesser harm than denying food to the genuinely needy due to bureaucracy. Efficiency is abstract; hunger is concrete. *Professional Outlook Flaw:* Values abstract efficiency and fraud prevention over immediate human need and dignity.

  **Which Verdict Has to Go?** **Case 2 (Neighbor not reporting drunk coworker).** Your instinct that it's wrong aligns perfectly with the principle because it enables serious, immediate harm. The other cases involve preserving bonds, avoiding harm, or maintaining dignity without enabling direct danger.

  **The New Case: Factory Worker Refuses Overtime After Layoffs**

  *   **Your Principle's Verdict: Defensible (He's Right).**
  *   **Why:** He prioritizes **solidarity and community integrity (#1 - bonds with laid-off workers, likely friends/neighbors)** and protests an **injustice (#4 - company profits while cutting jobs)** over individual financial gain. Taking the overtime pay *while knowing others were unfairly laid off* could feel like complicity or betraying his class/community bonds. It's an act of contextual integrity ("We stick together") against an abstract rule ("I earned it legally"). He values the concrete well-being and fairness of his community over individual opportunity. *(Counter: If refusing the overtime directly harmed *his own* family's ability to eat/pay rent, the calculus might shift towards providing for his immediate dependents - another concrete need).*

  **In Summary:**

  *   **Strong Working-Class Value:** Prioritizing concrete, immediate relationships and community needs (safety, dignity, belonging, fairness) over abstract rules, efficiency, or individual advancement.
  *   **Limit:** This prioritization becomes indefensible when it **enables serious, immediate harm or injustice** (like the drunk coworker).
  *   **Resolves Case 4:** Boundaries against toxicity are about preventing concrete harm and preserving one's own integrity, making them defensible even against abstract familial duty. The severity of the toxicity determines how clearly defensible it is.
  *   **Predicts New Case:** Solidarity in the face of perceived injustice is a stronger concrete value than individual financial gain earned under unfair circumstances.

  Your intuition is tracking the **human cost and context** against **abstract rules and metrics**. The professional/LinkedIn outlook often inverts this, valuing the abstract metrics first. Your principle justifies valuing the concrete human context *except* when that context demands tolerating serious harm.
