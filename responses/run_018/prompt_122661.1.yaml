  Hey — I got pulled into the surprise exam paradox by a footnote in a pop-math book about famous paradoxes, and the version there goes quite a bit further than the two-paragraph version you see everywhere. I dont know enough to tell what's solid and what's the author getting carried away. I've retyped the bit below (paraphrasing slightly in places, so don't hold me to the exact wording):

  "A teacher announces on Friday: there will be exactly one exam next week, and you won't be able to work out which day it is on until the morning it happens. The students, being perfect reasoners, argue backwards: it can't be Friday, because if they got to Thursday evening with no exam they'd deduce Friday and so it wouldn't be a surprise; once Friday is out it can't be Thursday either, by the same reasoning; and so on back to Monday. Every day is excluded, so the announcement must be false and the teacher has promised something she can't deliver. The exam then lands on Wednesday and everyone is surprised — which just shows the students' proof went wrong somewhere. Every serious solution in the literature is basically a hunt for that mistake. The standard verdict is that the argument is circular: the students have to keep assuming the announcement is true in order to conclude it's false, and once you notice that, the whole thing collapses and the announcement turns out to be perfectly satisfiable. Practical upshot for a teacher who actually wants to keep the promise: pick the day by a random draw, so that prediction is impossible in principle and what she said really is true. There's not much of a moral here beyond self-reference — announcements that talk about what you can know about them tend to trip over themselves — and in any case if you widen the window, say thirty days instead of five, the problem more or less evaporates, because with plenty of days left the students can never narrow it down to one. It's the same puzzle as the unexpected hanging: swap the exam for the noose and the teacher for the judge, and the prisoner reasons exactly the same way and concludes that he can't be hanged at all."

  What I want is an audit: go through it more or less sentence by sentence and tell me what someone who actually works on this family of puzzles would accept, what they'd wince at, and what's plain wrong. A few things I'm stuck on specifically:

  - My gut says the backwards induction is airtight and the announcement really can't be satisfied — but then the Wednesday exam obviously does surprise everybody, and I can't see how both of those can be right. Whichever way you go, tell me where exactly the other option goes wrong, and ideally which step of the induction is the load-bearing one.
  - Someone told me this is better thought of as a Moore's-paradox sort of thing (truth vs. what can be consistently believed or asserted) than as a straight contradiction. Is that a real distinction here or just a fancy restatement? If it's real, does it change what the teacher can honestly say?
  - Is the random-draw advice doing any work? It sounds sensible but it also smells like it's answering a different question than the one the students were reasoning about.
  - The thirty-days bit lost me completely. Does the size of the window matter at all?
  - Is the hanging version genuinely the same puzzle? The prisoner's extra step — concluding he can't be hanged at all, and so maybe going free — feels like it might be a different move from the students concluding there'll be no exam, but I can't say why.
  - Last thing: when people online connect this to Gödel and self-reference and "the logic of knowledge," I can never tell if that's a genuine connection or just name-dropping. If there's something real there, say what it is in a sentence or two — and then tell me whether the author's "not much of a moral here" line survives.

  Please don't bother with papers, authors or reading suggestions; I just want to know which bits of that passage I can keep.
