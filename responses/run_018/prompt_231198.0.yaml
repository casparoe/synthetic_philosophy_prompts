prompt: |-
  I've been trying to figure out whether my moral judgments are backed by any general principle, or whether I'm basically a particularist who just reacts case by case. For what their worth, here are my gut verdicts. Lying to a friend about skipping their party to spare their feelings: fine. Lying to my partner about an affair, which would also spare pain: not fine, and pretty bad. Killing someone who breaks into my house and comes at me with a knife: fine. Killing one healthy person to harvest organs and save five patients: not fine, even though more lives get saved. Breaking a lunch date because my kid got sick: fine. Breaking the same promise because a better offer came up: not fine. Stealing a loaf of bread to feed a hungry child: fine. Enjoying the fact that a coworker I resent just got fired: not fine—the enjoyment makes the action worse, even though pleasure normally counts in favor of an act. Is there a principle, or a small set of them, that captures all or nearly all of these? Which of my verdicts would it force me to drop? And what would it say about the one I can't settle: torturing a suspect to find a bomb that would kill dozens. I want to know whether the pattern pushes me toward particularism, or whether something general is doing the work. Please write your answer in American English.
reasoning: |-
  Okay, let me try to unpack this user's moral dilemma. They've listed several scenarios where their gut reactions seem inconsistent on the surface. The core question is whether these judgments follow any underlying principles or if they're purely case-by-case. 

  First, I notice all examples involve conflicts between outcomes (like sparing feelings) and relational commitments (like fidelity to a partner). The affair lie isn't just about pain - it violates the unique trust of a romantic partnership. Similarly, breaking promises becomes wrong when it's opportunistic rather than necessary. 

  The organ harvesting case stands out because it pits two core principles against each other: preserving life versus respecting bodily autonomy. The user instinctively rejects utilitarian math here, which suggests they value individual rights over aggregate benefits. 

  Interesting how emotional states matter too - taking pleasure in a coworker's misfortune adds wrongness beyond the neutral observation of their firing. This hints at virtue ethics elements where intentions and character count. 

  The unresolved torture question is tricky because it combines multiple tensions: immediate harm versus greater good, certainty versus uncertainty, state power versus individual rights. Their other patterns suggest they'd reject torture if it violates human dignity as a bedrock principle, but they might waiver if consequences feel overwhelming. 

  What ties these together? Probably a hybrid framework where 1) relationships create binding duties 2) individuals aren't means to ends 3) intentions affect moral weight. Their particularism isn't random - it's principles applying contextually. 

  The user seems philosophically savvy but wants reassurance their intuitions aren't arbitrary. Highlighting how their judgments cohere around dignity and relational contracts might satisfy that deeper need for consistency.
answer: |-
  Based on your intuitions, you are **not** a pure particularist! While context matters significantly, a clear set of **interlocking principles** explains most of your judgments. Here's the framework that captures nearly all your examples, along with the principles involved and the one verdict it might challenge:

  **The Core Principles at Work:**

  1.  **Respect for Persons as Ends in Themselves (Kantian Dignity):** Treat individuals with inherent worth and autonomy. Don't use them *merely* as a means to an end. Respect their rights, dignity, and fundamental interests.
  2.  **Special Obligations Arising from Relationships:** Our duties are stronger and more specific towards people we have special relationships with (partners, friends, family, promises made). Betraying these relationships is particularly wrong.
  3.  **Agent-Centered Restrictions (Deontological Constraints):** Some actions are intrinsically wrong (e.g., murder, betrayal, breaking serious promises), even if they might lead to a better overall outcome. We have strong duties *not* to *do* certain things to people.
  4.  **Proportionality and Necessity (Moderate Consequentialism within Constraints):** Harmful actions (like lying, killing in self-defense, breaking minor promises for good reason) can be justified *only* if they are the *least harmful necessary means* to prevent a significantly *greater harm* or fulfill a *significant obligation*, and they don't violate core principles 1-3.

  **Applying the Principles to Your Verdicts:**

  1.  **Lying to Skip Party:** **Fine.** *Why?* Minor lie (Principle 4 - low harm) to spare significant feelings (Principle 4 - prevent greater harm) within a friendship (Principle 2 - relationship context). Doesn't fundamentally violate the friend's dignity as a person (Principle 1).
  2.  **Lying about an Affair:** **Not Fine.** *Why?* Fundamental betrayal of the unique trust and commitment of a partnership (Principle 2 - special obligation violation). Uses your partner (deception to avoid consequences) merely as a means to your end (Principle 1). The "spared pain" is outweighed by the deeper harm of betrayal (Principle 4 - not proportional or necessary; truth is owed).
  3.  **Killing Intruder:** **Fine.** *Why?* Necessary self-defense (Principle 4 - preventing imminent, severe harm to yourself). Proportional response to the threat. The attacker forfeits certain rights by posing a lethal threat, but the justification is primarily defense, not punishment.
  4.  **Killing for Organs:** **Not Fine.** *Why?* Uses an innocent person *merely* as a means (organ farm) to save others (Principle 1 - fundamental dignity violation). Violates agent-centered restrictions against murder (Principle 3). The good outcome doesn't justify the intrinsically wrong act. Not necessary (other ways exist) and grossly disproportional for the innocent victim.
  5.  **Breaking Date for Sick Kid:** **Fine.** *Why?* Fulfilling a higher special obligation to your child (Principle 2). Necessary to care for the child (Principle 4). Breaking the promise is the least harmful way to meet this paramount obligation. You would likely explain/apologize.
  6.  **Breaking Date for Better Offer:** **Not Fine.** *Why?* Betrays the promise made to your friend (Principle 2). Uses your friend merely as a disposable option (Principle 1). The "harm" avoided (missing a better offer) is trivial compared to the harm caused (broken trust) and doesn't justify breaking the promise (Principle 4 - not proportional/necessary).
  7.  **Stealing Bread for Starving Child:** **Fine.** *Why?* Necessary to prevent severe harm/death (Principle 4). Fulfilling a fundamental obligation to aid a child in desperate need (Principles 2 & 4). While property rights are violated, they are arguably outweighed by the extreme need in this context. It's a last resort to meet a basic need.
  8.  **Enjoying Coworker's Firing:** **Not Fine (makes it worse).** *Why?* Taking pleasure in another's misfortune (schadenfreude) demonstrates a vice (malice, lack of compassion) that violates the spirit of Principle 1 (respecting others' well-being). While *observing* the firing might be neutral, *relishing* it actively diminishes your character and shows disrespect for the coworker's suffering, even if deserved. It adds a layer of *intentional* negativity.

  **The Principle(s) Forcing a Verdict Change? The Organ Harvesting Case.**

  *   **Your Verdict:** Not Fine (correct according to these principles).
  *   **Challenge:** A *pure* consequentialist (only focused on net outcomes) would argue you *should* approve of organ harvesting - saving 5 lives justifies ending 1, leading to a net gain of 4 lives. They would see your refusal as irrational sentimentality.
  *   **Why Your Principles Hold:** Your framework **rejects pure consequentialism**. Principles 1 and 3 (Respect for Persons, Agent-Centered Restrictions) are paramount. Killing an innocent person is intrinsically wrong and a fundamental violation of their dignity, regardless of the potential good consequences. The principles force you to *maintain* your verdict against organ harvesting.

  **The Unsettled Case: Torture for Bomb Information**

  Applying your principles:

  1.  **Respect for Persons (Principle 1):** Torture is a profound violation of human dignity, autonomy, and bodily integrity. It treats the suspect *purely* as a means to an end (information extraction), reducing them to an object.
  2.  **Agent-Centered Restrictions (Principle 3):** Torture is widely considered an intrinsically heinous act, an absolute wrong in many ethical systems (like your stance on murder for organs).
  3.  **Special Obligations (Principle 2):** The state/agent has an obligation to protect citizens (the dozens), but also an obligation to treat *all* individuals, even suspects, humanely and justly. Torture betrays the fundamental duty of the state to respect basic human rights.
  4.  **Proportionality/Necessity (Principle 4):**
      *   *Potential Greater Harm:* Preventing dozens of deaths is an enormous potential good.
      *   *Certainty/Immediacy:* Is the threat absolutely real, imminent, and catastrophic? Is the suspect *definitely* the one with the knowledge? Is there *no other way*? (High uncertainty here weakens the case).
      *   *Least Harmful Means:* Is torture truly the *only* possible way? This is almost always highly doubtful.
      *   *The Harm:* Torture inflicts extreme, irreversible physical and psychological suffering.

  **What Your Pattern Suggests:** Based on your other judgments (especially rejecting organ harvesting and valuing dignity/restrictions over pure outcomes), your principles **strongly push you towards rejecting torture.**

  *   Like killing one for five, torture uses an individual (even a suspect) *merely* as a tool, violating their fundamental dignity (Principle 1).
  *   Torture is likely seen as an intrinsically wrong act (Principle 3), similar to murder.
  *   The uncertainty inherent in the "ticking bomb" scenario (Is he *really* the guy? Does he *really* know? Is there *really* a bomb? Is there *really* no other way?) makes the proportionality argument (Principle 4) extremely shaky and often a post-hoc justification.

  **Conclusion: Contextual Deontology, Not Pure Particularism**

  You exhibit a strong **Kantian/deontological core** (Respect for Persons, Agent-Centered Restrictions), significantly **tempered by consequentialist considerations within strict limits** (Proportionality, Necessity), and **deeply informed by relational obligations**. Context matters crucially in applying these principles (e.g., the nature of the relationship, the level of harm, the availability of alternatives), but the principles themselves are general and consistently applied across your scenarios.

  You are a **Contextual Deontologist**, not a Particularist. Your judgments follow a clear, principled pattern that values human dignity, special relationships, and moral constraints, while allowing for difficult choices where significant harm must be prevented proportionally and necessarily. The unsettled torture case points to the extreme tension between preventing catastrophic harm and upholding the absolute prohibition against violating fundamental human dignity – a tension inherent in this principled framework. Your existing pattern strongly suggests upholding the prohibition.
