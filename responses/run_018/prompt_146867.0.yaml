  3. **The nature of the "end"**: Is it an exhaustion of the ideological menu (no new recipes) or a saturation point (recipes exist but the political kitchen refuses to try them)?
  4. **Response to a novel post-liberal governance**: Would it disprove Fukuyama, or would he say it's not universalizable?

  We want to end with named positions:

  - Fukuyama's own liberal-democratic teleology
