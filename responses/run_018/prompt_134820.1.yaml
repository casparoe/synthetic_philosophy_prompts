     - *Rationale for probability:* I assign 90% because this selection effect—rooted in the physical setup—strongly implies thirder reasoning without relying on abstract centered propositions, as the continuous time creates a clear ratio of possible experiences (1:2 for heads:tails).

  3. **Is the notion of "rational credence" in self-locating contexts sufficiently determinate for a unique answer, or is the halfer-thirder dispute partly semantic/normative?**
