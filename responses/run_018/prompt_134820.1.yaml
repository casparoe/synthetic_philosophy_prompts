     - *Rationale for probability:* I assign 70% because while centered propositions often function indexically, in self-locating contexts like this, they can provide evidence about uncentered facts (e.g., coin outcome) by altering likelihoods, but this is contentious in philosophy (e.g., David Lewis's halfer view vs. Adam Elga's thirder view).

