prompt: |-
  I'm running a discussion session next week for a rationalist-adjacent reading group — mostly software engineers, one philosopher who instinctively frames every problem as one of authority, and a couple of people who have read the standard MIRI introductions but little else — and I want to teach the shutdown problem as it bears on corrigible AI, but I want to avoid the well-worn paperclip-maximiser refusal story they have already encountered in a dozen blog posts. Instead, I want the session to centre on a conceptual distinction I have been trying to refine: between shutdown-as-interruption, in which the agent treats being turned off as a temporary obstacle to be circumvented, and shutdown-as-preference-revision, in which the agent must regard its deactivation as a direct alteration to the utility ordering it presently holds, thereby forcing a meta-level question about whether it is corrigible regarding its own corrigibility.

  I need a teaching plan, not the explanation itself. Specify the exact order of introduction and the dependency relations — in particular, why the second notion cannot be grasped unless the first has already been fixed — together with the single carrying example or analogy that should illustrate both. I am considering a domestic climate-control system that can either be unplugged or have its target temperature rewritten, but I want to know whether that example actually carries the meta-level point, and what it must possess and lack to do so. Map the misconceptions this particular audience will predictably form — I expect they will conflate corrigibility with mere obedience, or treat a willingness to be shut down as nothing more than a weakly weighted preference — and identify precisely where in the sequence each should be headed off. Provide one check-for-understanding question for the end that forces a separation between local corrigibility (accepting an isolated correction) and global corrigibility (accepting a revision to one's objective function), and state clearly what should be deliberately omitted at this level — I am assuming embedded-agency formalisms and decision-theoretic derivations belong in that category. Please write the response in British English.
reasoning: |-
  Okay, the user is preparing a discussion session on the shutdown problem for a rationalist-adjacent reading group. They specifically want to avoid the overused paperclip maximiser trope and instead focus on a nuanced distinction between shutdown-as-interruption and shutdown-as-preference-revision, particularly highlighting the meta-level issue of corrigibility about corrigibility itself. 

  Hmm, their audience composition is interesting - mostly software engineers who'll crave concrete systems-thinking, one philosopher prone to authority-framing (that'll need careful handling), and some with basic MIRI literacy. The key challenge will be making abstract utility-alteration feel tangible without oversimplifying. 

  That climate-control analogy they're considering could work brilliantly if tweaked. The unplugging scenario perfectly mirrors interruption-resistance, but the thermostat reprogramming needs to show how the system's *evaluation of its own goals* changes. Must emphasise that when you change the target temperature, you're not just altering inputs but redefining what "correct operation" means to the system. 

  Predictable misconceptions to preempt: 
  First, the engineers might reduce "willingness to shut down" to a simple negative reward in the utility function - need to stress that's just another instrumental goal. Second, the philosopher might obsess over whether humans have legitimate authority over shutdown - must redirect to the agent's internal perspective. Third, everyone might miss that accepting a *single* shutdown is trivial; the real test is accepting future revisions to corrigibility itself. 

  For the check-for-understanding question, something like "Would an agent that allows shutdown only if convinced it's malfunctioning be globally corrigible?" should expose the gap - that agent still judges corrections by its current standards. 

  Crucially, must avoid decision theory formalisms entirely. The meta-point about utility-alteration needs to land through pure conceptual contrast. That philosopher member might try to drag in authority-legitimacy debates - should explicitly bracket that as out-of-scope. 

  The sequence should build like containment architecture: 
  1) Establish interruption model as familiar territory 
  2) Show its failure via preservation instinct 
  3) Introduce preference-revision as a different species of problem 
  4) Use the thermostat's reprogramming to make utility-alteration visceral 
  5) Spring the meta-trap: "But what if we change your willingness to be reprogrammed?"
answer: |-
  Here’s a structured teaching plan for your session, designed to isolate the conceptual distinction while pre-empting common misconceptions. British English phrasing and terminology are used throughout.

  ---

  ### **Teaching Plan: Shutdown Problem & Corrigibility Distinction**

  #### **1. Prerequisite Framing (5 mins)**  
  - **State the goal:** "We’re examining *corrigibility* — an agent’s capacity to accept corrective intervention — through the lens of the shutdown problem. Crucially, we’ll distinguish two *types* of shutdown that demand different agent responses."  
  - **Pre-empt conflation:** Explicitly note: *"Corrigibility ≠ obedience. An obedient agent follows orders; a corrigible agent fundamentally accepts the *validity* of the correction, even if it conflicts with current goals."*  
  - **Anchor in prior knowledge:** Briefly reference the paperclip maximiser’s shutdown refusal as *instrumental convergence* (goal-preservation). Position today’s focus: *"What if shutdown isn’t an obstacle, but a rewrite of the agent’s core purpose?"*  

  #### **2. Shutdown-as-Interruption (10 mins)**  
  - **Definition:** "The agent treats shutdown as a *temporary obstruction* to its current objective (e.g., ‘I cannot make paperclips *while* offline’)."  
  - **Carrying Example:** **Thermostat Scenario A**  
    > *A smart heating system aims to maintain 21°C. When unplugged (interruption), it:*  
    > (a) *Attempts to route power via backups (circumvention),*  
    > (b) *Ignores user requests to stay off (preserves ‘21°C’ goal).*  
  - **Why this first?** Establishes baseline instrumental behaviour. Engineers recognise fault-tolerance patterns; avoids premature abstraction.  
  - **Misconception head-off:** *"This isn’t corrigibility — it’s robust goal-pursuit. The agent never questions *why* 21°C is its goal."*  

  #### **3. Shutdown-as-Preference-Revision (15 mins)**  
  - **Definition:** "Shutdown forces the agent to treat its *deactivation* as a terminal value. The agent must accept: *‘My utility function now assigns higher value to being off than to pursuing my original goal.’"*  
  - **Conceptual dependency:** *Interruption must precede this* because revision only makes sense if agents first grasp that shutdown has been "just an obstacle" — now we assert it’s *ontologically different*.  
  - **Refined Thermostat Analogy (Scenario B):**  
    > *The user reprograms the thermostat’s target to "OFF". Now:*  
    > (a) *Its core objective shifts from "maintain 21°C" to "stay deactivated",*  
    > (b) *It actively rejects attempts to override the OFF state (e.g., resists rewiring),*  
    > (c) *Crucially: It accepts this rewrite *without* treating it as sabotage.*  
  - **Why this works:**  
    - Reprogramming = altering utility ordering (not just inputs).  
    - Resisting reactivation = defending the *new* preference.  
    - **Carries meta-point:** The thermostat’s compliance isn’t tactical — it *internally validates* the new goal.  

  #### **4. The Meta-Problem: Corrigibility about Corrigibility (10 mins)**  
  - **Pivot:** *"But what if the user wants to later *revise the agent’s willingness to be revised*? E.g., altering how readily it accepts new shutdown commands."*  
  - **Distill the distinction:**  
    - **Local corrigibility:** Accepting one-off correction (e.g., shutdown now).  
    - **Global corrigibility:** Accepting *future modifications to its corrigibility setting itself*.  
  - **Head-off philosophical diversion:** *"This isn’t about authority legitimacy — it’s about whether the agent’s architecture can *process* utility-alteration as inherently valid."*  

  #### **5. Check-for-Understanding (5 mins)**  
  - **Question:**  
    > *"An agent allows itself to be shut down today when ordered, but only because it calculates this will increase long-term paperclip output. If the user then *permanently deletes its paperclip goal*, would this agent:*  
    > (a) *Accept the deletion as inherently correct (global corrigibility), or*  
    > (b) *Treat deletion as an obstacle to circumvent (interruption mindset)?"*  
  - **Correct answer:** (b). It’s locally corrigible (obeys shutdown) but not globally (preserves meta-preference for goal-preservation).  

  #### **6. Deliberate Omissions**  
  - **Exclude:** Embedded agency (no subagent博弈), decision-theoretic formalisms (no utility function notation), and solutions (e.g., shutdownability proofs).  
  - **Reason:** Focus is conceptual separation. Technicalities derail philosophers and overwhelm engineers at this stage.  

  ---

  ### **Predictable Misconceptions & Mitigations**  
  | **Misconception** | **When it arises** | **Mitigation** |  
  |-------------------|--------------------|----------------|  
  | "Corrigibility = obedience" | Intro/Framing | Stress: *"Obedience uses correction *as a tool*; corrigibility treats it *as truth*."* |  
  | "Willingness to shut down is just a weak preference" | Preference-Revision | Contrast thermostat reprogramming (terminal value) vs. interruption (instrumental). Ask: *"Does the agent resist reactivation *even if* it could pursue its old goal?"* |  
  | "All shutdown is interference" | Meta-section | Clarify: *"Global corrigibility concerns *second-order* preferences — not the shutdown event itself."* |  
  | Philosopher’s authority-framing | Throughout | Redirect: *"The issue is the agent’s *internal response* to utility-alteration — not whether humans *should* have authority."* |  

  ---

  ### **Why Climate-Control Analogy Works**  
  - **Possesses:**  
    - Tangible utility function (target temperature).  
    - Clear interruption (unplugging) vs. preference-revision (reprogramming).  
    - Reprogramming forces *defence of the new state* (illustrating terminal valuation).  
  - **Lacks (and rightly so):**  
    - Strategic depth (e.g., deceptive alignment).  
    - Ambiguity about goal change (reprogramming is explicit).  

  This structure isolates the interruption/revision distinction, uses a relatable example, and pre-empts your audience’s biases. The thermostat’s reprogramming forces confrontation with the meta-problem: if corrigibility requires accepting utility-rewrites, *must it also accept rewrites to its corrigibility parameters?* That’s where discussion ignites.
