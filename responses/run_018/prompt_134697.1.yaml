  For participatory mechanisms where students discover this themselves: 1) Having them try to locate an "uncaused cause" within themselves during deliberation; 2) Forcing confrontation with how their judgment tools (reasoning styles) were predetermined; 3) Making their resistance to determinism part of the predetermined data via the Reflexive Loop Card. This creates authentic circularity.

  Now structuring the 75-minute "Causal Lineage Tribunal" session: The Genesis Envelopes with hidden causal chains are crucial. Roles include Accusers, Defenders, Jurors and a Defendant - all with social capital incentives to create psychological stakes. The Revelation moment at minute 30 when envelopes open should induce cognitive dissonance, especially with the Loop Card stating their resistance was predetermined.

  For debrief, I'll map four phases: 1) Initial demand for self-creation 2) Discovery of unchosen selectors 3) Collapse of act/character distinction 4) Circularity of responsibility for responsibility. The argument should only be named in final minutes.

