        - Groups have 15 more minutes (until 35 minutes) to adjust.

     3. Presentations and Q&A (30 min):
        - Each group has 7 minutes to present, followed by 3 minutes for jury questions.
        - Order: Civic Continuity, Moral Abolition, Palimpsestic Design.

     4. Jury Deliberation (5 min): Jury discusses and then votes by ranked-choice ballot.

     5. Vote Counting and Announcement (5 min): Facilitator collects ballots, calculates Borda scores, announces the ranking (1st, 2nd, 3rd). Then announces the jury's recommendation (the 1st place proposal).

     6. Facilitator Reveal (2 min): "The town council has overruled the recommendation. They have decided to leave the statue as is but add a small plaque, and they will rename Vance Way to 'Founders Way' and add a plaque honoring Marlowe at the corner of Marlowe Street."

     7. Debrief (13 min? We have from 75 to 90, so 15 minutes? Let me adjust the timing)

     Adjusted Timing for 90 minutes:

     - 0-5: Intro
     - 5-35: Prep (with crisis at 20-minute mark, which is 15 minutes into prep)
     - 35-65: Presentations and Q&A (3 groups * 10 min = 30 min)
     - 65-70: Jury deliberation
     - 70-72: Vote counting and announcement
     - 72-75: Council overrule reveal
     - 75-90: Debrief (15 minutes)

     Debrief Outline:
     - Start by asking: "How many of you thought about the street names during your deliberations?" (None, because they were focused on the statue)
     - Reveal: "The town council's solution involved the streets. Why might that be?"
     - Guide to distinction: statue is meant to honor, so it's an expressive commemoration (retrospective honor). Street names are indexical (marking historical presence without necessarily honoring) and are institutional (part of the infrastructure).
     - Ask: "Would it make sense to remove Vance's name from the street? What would that achieve? Would it be the same as removing the statue?"
     - Discuss the committees:
        - Civic Continuity: focused on expressive continuity (the statue as a symbol of identity) -> institutional obligations (streets) are different.
        - Moral Abolition: focused on expressive condemnation -> but what does it mean to condemn a street name? It's not inherently honorific.
        - Palimpsestic: tried to layer meaning on the statue, but not applicable to streets? Or is it? (e.g., adding a plaque to the street sign)
     - Forecast of failure:
        - Palimpsestic group was seen as avoiding the hard choice? (ask the jury if they felt that)
        - Jury: did they use emotional disgust? Or did they think about the town's identity? (ask them to reflect)
        - Without the crisis card, would the debate have stalled in binary remove/keep? The crisis forced contextualization to be defined.
     - Finally, state the limitation: "In real life, the ethical impact of any change will unfold over years. An overlay might be ignored, or it might gradually shift public memory. We cannot simulate that in 90 minutes."

     This should achieve the goals.
answer: |-
  ### **Veridian Commemorative Ethics Simulation: Structured Deliberation Activity**  
  **Total Time:** 90 minutes  
  **Participants:** 16 students (4 groups of 4)  
  **Goal:** Unpack fragmentation of commemorative obligations (expressive, institutional, spatial) through a high-stakes negotiation. Students experience how honorific (statues) vs. indexical (street names) registers collapse binary "keep/remove" frameworks.  

  ---

  ### **Materials Needed**  
  - Role sheets (1 per committee)  
  - Cost table & political capital tracker (1 per committee)  
  - Crisis card (for facilitator)  
  - Ballots for ranked-choice vote (4 copies)  
  - Timer, whiteboard/flip chart  

  ---

  ### **Phase 1: Setup (5 min)**  
  **Facilitator Script:**  
  *"Veridian faces a legacy problem: its central square holds a statue of Elias Vance, who ended a famine but used punitive labor. Adjacent streets are Vance Way, Marlowe Street (dissident), and Old Canal. A new ordinance allows ‘interpretive overlay’—adding plaques, counter-sculptures, or landscape changes—without removing the statue. Your task: negotiate a solution under hidden constraints. Political capital points are your currency. Allocate them wisely—your committee’s influence depends on it."*  

  - **Assign Groups:**  
    1. **Civic Continuity (CC):** Must keep at least 1 physical reference to Vance in the square. (Narrative rupture damages identity.)  
    2. **Moral Abolition (MA):** No artifact may stand without explicit moral condemnation at the site.  
    3. **Palimpsestic Design (PD):** Propose an overlay that keeps the statue visible but transforms its meaning.  
    4. **Residents’ Jury (RJ):** Hear presentations, ask questions, vote on what "kind of town" Veridian should be.  

  ---

  ### **Phase 2: Committee Prep (30 min)**  
  - **Rules:**  
    - Committees focus **only on the statue** (ignore streets).  
    - Each group has **20 political capital points** to allocate across:  
      - *Preservation* (maintenance, anti-vandalism).  
      - *Design* (plaque/counter-sculpture/landscaping costs).  
      - *Legal Defense* (lawsuits from Vance descendants or laborers’ descendants).  
    - Use the **Cost Table** (below) to meet minimum spending thresholds. Failure = 5-point penalty.  

  | **Action**                          | Preservation Min. | Design Min. | Legal Defense Min. |  
  |-------------------------------------|-------------------|-------------|---------------------|  
  | Keep statue as-is                   | 5                | 0           | 8                   |  
  | Remove statue                       | 0                | 0           | 8                   |  
  | Add plaque                          | 5                | 3           | 5                   |  
  | Add counter-sculpture               | 5                | 10          | 5                   |  
  | Landscape alteration (e.g., garden) | 5                | 7           | 5                   |  

  - **Stakes:**  
    - RJ vote adds/deducts points: **1st place = +5, 2nd = 0, 3rd = -5**.  
    - Final score = (20 - penalty) + RJ bonus. Highest score "wins" political influence.  

  #### **Crisis Card Deployment (20-min mark):**  
  *Facilitator interrupts: "Breaking news: Descendants of Vance’s laborers filed a lawsuit demanding full removal OR full contextualization. Define ‘contextualization’ explicitly—or face legal chaos."*  
  *(Forces specificity, e.g., PD must clarify if "context" includes condemnation; MA must justify removal costs.)*  

  ---

  ### **Phase 3: Presentations & Jury Deliberation (40 min)**  
  - **Presentation Order:** CC (7 min), MA (7 min), PD (7 min).  
  - **Q&A:** RJ asks 2 clarifying questions per group (3 min each).  
  - **RJ Deliberation (10 min):**  
    - Discuss: "What kind of town should Veridian be?" (e.g., "a town that confronts its past," "a town that preserves unity").  
    - **Vote:** Secret ranked-choice ballot (rank 1st, 2nd, 3rd). Justify votes in non-philosophical terms.  

  ---

  ### **Phase 4: Vote & Council Overrule (5 min)**  
  - **Tally & Announce:**  
    - RJ reveals winning proposal (e.g., "PD’s counter-sculpture wins 1st place").  
    - Apply RJ bonuses/penalties to committees’ scores.  
  - **Facilitator Twist:**  
    *"The town council overruled your recommendation. They left the statue untouched but renamed Vance Way to ‘Founders Way’ and added a plaque honoring Marlowe on Marlowe Street. No committee proposed this."*  

  ---

  ### **Phase 5: Structured Debrief (10 min)**  
  **Key Questions:**  
  1. **Honorific vs. Indexical Distinction:**  
     - *"Why did all committees focus on the statue, not streets? What’s different about ‘Vance Way’ vs. ‘Marlowe Street’?"*  
     - **Reveal:** Statues operate in the **honorific register** (implying praise). Street names are **indexical** (marking history without endorsement). Binary "keep/remove" fails here—renaming is a third path.  

  2. **Mapping Strategic Moves to Ethics:**  
     - **CC:** Prioritized *expressive commemoration* (statue as identity anchor) but ignored *institutional commemoration* (streets as passive history).  
     - **MA:** Treated all artifacts as equally honorific—collapsing spatial and expressive obligations.  
     - **PD:** *Palimpsestic* approach accepted ambiguity but was seen as "avoiding hard choices" (jury likely dismissed it as compromise).  
     - **RJ:** Voted on "town identity" but conflated emotional disgust (e.g., "Vance is evil") with moral reasoning.  

  3. **Forecasted Failure & Hidden Crisis:**  
     - Without the crisis card, debate stalls in binary terms (keep vs. remove). The lawsuit forced specificity—e.g., "contextualization" must include laborer perspectives.  
     - PD’s overlay only works if it *stays visible*. But normalization risk: "Will the counter-sculpture become invisible over time?"  

  4. **Limitations of Simulation:**  
     - *"This exercise can’t capture the slow phenomenology of memory. A plaque might shock on Day 1 but fade into background by Year 5. Ethical weathering—not votes—decides if an overlay transforms public memory."*  

  ---

  ### **Educational Payoff**  
  - **Cognitive:** Students "feel" commemorative fragmentation by wrestling with trade-offs (e.g., CC’s identity vs. MA’s justice).  
  - **Revelation:** Street names expose how institutional commemoration (indexical) demands distinct strategies vs. expressive (honorific).  
  - **Meta-Lesson:** Real-world ethics requires *temporal* awareness—quick votes ≠ long-term societal change.  

  **Role Sheets & Cost Tables** provided separately. Facilitator emphasizes ambiguity: "There are no perfect solutions—only trade-offs shaped by time and power."
