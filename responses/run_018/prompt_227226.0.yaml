  - Therefore, maximizing E[ln X] maximizes the long-run exponential growth rate.
  - Addresses betting everything: it maximizes expected wealth per round but leads to ruin with probability 1 (since probability of surviving every round goes to 0).
  - Then states that the Kelly criterion is expected utility maximization with logarithmic utility, and because log is concave, it is risk-averse, which justifies not betting everything.

