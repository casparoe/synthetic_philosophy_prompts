prompt: |-
  I'm running a session for an audiance of smart non-philosophers who only know Taoism from yoga-studio posters, and I need to teach Zhuangzi's view on death in about forty minutes. Don't explain the view to me—plan the explanitory arc. What's the dependency order: I think I need to start by showing he's not offering an afterlife theory but attacking the coherence of "death" as an absolute boundary, then use the butterfly dream to establish that personal identity is already unstable, then bring in the tub-drumming story after his wife's death as the practical upshot, and only then contrast it with Confucian ritual mourning—does that sequencing hold, or does the dream have to come later?

  Pick one carrying example that does the heavy lifting—I'm torn between the butterfly dream and the tub-drumming funeral scene—and say what it needs to have and what it must lack. If you pick the tub scene, how do I present it so they don't immediately read it as "he's just happy she's dead" or as ancient stoic suppression?

  Map the misconceptions in the order they'll surface: I'm guessing first they'll think he's advocating reincarnation or soul-travel, then that he's just suppressing grief like a Stoic, then that if death is transformation then suicide is equally fine and he must not value living. Tell me exactly where in the sequence to head each one off, and what distinction I should draw at that point.

  Give me one check question at the end that shows they've grasped the idea rather than just being made uncomfortable—maybe something about why Confucian mourning isn't just "being emotional" but relies on a specific frame he's undermining.

  Also tell me what to openly refuse to explain at this level and say so—probably don't drag in the inner-chapters authorship problem or try to map this onto modern physicalism. And keep it casual, I'm writing this on my phone.
