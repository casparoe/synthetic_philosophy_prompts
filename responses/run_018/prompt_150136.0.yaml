reasoning: |-
  We are creating an essay question for an upper-level philosophy of mind final exam.
   The scenario is based on Dennett's brain transplant thought experiment but with a twist.
   The twist: Hamlet is paralyzed but awake, and Yorick (his brain) is streamed live into two robotic bodies:
     - One with normal sight
     - One with only echolocation
   Both bodies feed sensory data back to Hamlet in real time.
   Then, the streams start giving conflicting reports about where the bodies are (one says left, the other says right).
   The question asks whether Dennett's framework can still locate 'Dennett' and whether we must say there are now two people, zero, or one split self.
   They must confront the breakdown of the narrative center of gravity when the first-person pronoun gets two incompatible inputs.

   We need:
     - course_level: upper-level
     - exam_format: in-class essay
     - time_minutes: 60 (since it's an essay question in a final, 60 minutes is reasonable for a 600-word target)
     - question_text: the exact question to be presented to students
     - twist_summary: a brief summary of the twist for the examiner's reference (but not part of the student question)
     - model_answer_target_words: 600
     - marking_scheme: an array of 5 objects, each with:
          move_name: the key move the student must make
          points: how many points out of 20 this move is worth (total 20 for 5 moves, so each 4? or distribute as appropriate)
          what_it_tests: what philosophical skill or understanding this move tests
          typical_wrong_answer: what mistake students might make that would cost them the points for this move
     - bottom_line_summary: a one-sentence takeaway for the examiner

   We are not requiring citations.

   Let's structure the marking scheme around 5 must-hit moves:

   Move 1: Recalling Dennett's original thought experiment correctly.
   Move 2: Accurately applying Dennett's concept of the narrative center of gravity to the new scenario.
   Move 3: Confronting the breakdown when there are two conflicting sensory streams and analyzing the challenge to the first-person pronoun.
   Move 4: Evaluating the possible outcomes (two people, zero, or one split self) in light of the breakdown.
   Move 5: Providing a reasoned conclusion about whether Dennett's framework can still locate 'Dennett' and what it implies for personal identity.

   We'll distribute 4 points per move (5 moves * 4 = 20).

   Now, let's write the question text and the twist summary.

   Question text should include the scenario and the question.

   Twist summary is for the examiner, so it can be a bit more direct.

   Let's create the JSON object.
