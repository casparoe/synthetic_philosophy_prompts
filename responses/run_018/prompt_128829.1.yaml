  Most damning are traits with clear developmental constraints overriding adaptation. Cephalopod eye evolution shows perfect convergence with vertebrates via different pathways - meaning adaptation could overcome spandrels when needed. If reverse spandrels dominated, we wouldn't see such radical divergence in developmental origins. 

