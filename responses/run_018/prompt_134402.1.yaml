answer: |-
  ## Q&A Prep Sheet: Algorithmic Feed Dynamics & Cultural Evolution Theory  

  ---

  ### **Objection 1 (Highest Damage): "This is just neo-memetics rebranded. Dawkins’ replicator is foundational; your ‘attractor templates’ lack discrete boundaries, making selection untestable."**  
  **Reply (2-min):**  
  "Unlike memetics, I argue algorithmic feeds decouple *variation generation* (user creativity) from *selection* (platformic reinforcement of engagement-prone *formats*). A ‘dance challenge’ template isn’t copied; it’s a developmental niche where diverse behaviors converge. Selection acts on the template’s *structural fit* to the algorithm, not fidelity of replication. We test this via engagement-pattern clustering (e.g., neural embeddings of virality) and A/B testing template persistence under algorithmic perturbations."  
  **Weakness Note:** *Quantifying "format fitness" requires platform data access; still developing cross-platform metrics.*  

  ---

  ### **Objection 2 (Philosophers): "If there’s no discrete replicator, how can we model cultural change as Darwinian? Population genetics requires heritable units."**  
  **Reply (2-min):**  
  "Darwinism requires *heritable variation* and *differential retention*, not necessarily replicators. In feeds, formats (e.g., ‘reaction video’) are heritable *attractors*—stable configurations where content diversifies developmentally. Think population genetics *without* alleles: track frequency dynamics of template *traits* (e.g., ‘duration,’ ‘text overlay position’) under algorithmic selection. This parallels quantitative genetics modeling trait covariance in continuous phenotypes."  
  **Weakness Note:** *Attractor stability is probabilistic; harder to formalize than replicator frequencies.*  

  ---

  ### **Objection 3 (Anthropologist): "Memetics died because cultural change isn’t selection-driven. Your model over-weights platforms; most culture occurs offline!"**  
  **Reply (2-min):**  
  "Agreed—offline cultural processes often resemble niche construction (e.g., dialect co-evolution with social structures). But *algorithmic spaces* uniquely externalize selection to non-human actors. My claim is narrow: where recommendation architectures mediate cultural exposure, they create a *developmental niche* that biases expression toward algorithm-favored formats. This supplements, not replaces, broader cultural theory."  
  **Weakness Note:** *Under-explores hybrid online-offline niches (e.g., TikTok trends migrating to classrooms).*  

  ---

  ### **Objection 4 (Biologists): "Niche construction modifies environments, but genes still replicate. Where’s the inheritance system here?"**  
  **Reply (2-min):**  
  "Inheritance is *template-driven*. Users inherit *production rules* ("make videos under 8s with hook") from exposure to formats, not content. The algorithm *constructs the niche* by rewarding template-consistent features. This is Lamarckian-ish: users *develop* variants within constrained formats, and algorithm-filtered outcomes bias future production. No replication—only recurrent phenotype formation under engineered constraints."  
  **Weakness Note:** *Template "mutation" mechanisms are underspecified compared to genetic drift/mutation.*  

  ---

  ### **Objection 5 (Philosophers/Biologists): "If selection is algorithmic, isn’t this just artificial selection? Why invoke Darwinism?"**  
  **Reply (2-min):**  
  "Algorithmic selection is artificial *but* embedded in a decentralized system. Users generate variation unpredictably; templates emerge from co-activity between users, content, and ML systems. This is *ecological*: templates compete for visibility in recommendation niches. Unlike breeding, outcomes aren’t directed—they’re emergent properties of triadic interactions (user-algorithm-template). Darwinian logic applies, but agency is distributed."  
  **Weakness Note:** *Risk of anthropomorphizing algorithms; need clearer criteria for "selection" in non-biological systems.*  

  ---

  ### **The Nuclear Option (Pray Against): "Your ‘attractor template’ is a vague metaphor. Where’s the mathematical formalism showing this outperforms replicator models?"**  
  **Reply (2-min):**  
  "Fair. We’re building formalism using *dynamical systems*: templates as attractors in high-dimensional content spaces, with algorithmic pressure as a perturbation vector. Early simulations show template persistence despite content turnover—unlike replicator models predicting decay without high-fidelity copying. We model differential retention via Lyapunov stability, not allele frequencies. Empirical work tracks template drift (e.g., ‘prank evolution’) under algorithm updates. It’s nascent, but replicator models can’t explain viral format shifts without *ex post facto* ‘meme’ redefinitions."  
  **Weakness Note:** *Not yet a predictive model; requires computational social science integration.*  

  ---

  ### **Settled vs. Contested**  
  - **Settled:** Cultural transmission ≠ genetic transmission; vertical/horizontal diffusion occurs.  
  - **Contested:** Whether Darwinian cultural evolution *requires* discrete replicators vs. heritable continuous attractors; role of externalized selection in digital niches.  

  ---  
  *Format note: Present attractor-template view as a contested alternative, not consensus. Emphasize empirical testability of algorithmic bias on format persistence.*
