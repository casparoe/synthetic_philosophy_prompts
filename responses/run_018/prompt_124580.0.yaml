  To distinguish between Principles A and B, a test case could be historical medical experiments with no survivors but clear intergenerational harm. Principle A might not support apology (no living victims), while Principle B might if it violates current fundamental norms.  

  If the panel apologizes here, it strengthens Principle A (harm-based) but also fits Principle B if family integrity is now fundamental. So it might not definitively choose between them.  

  The user's deeper need is likely to identify a coherent framework for the panel to avoid arbitrary decisions and provide clear guidance. They might also want to reconcile theoretical concepts like reparative vs. constitutive apologies.  

