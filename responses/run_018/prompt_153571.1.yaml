  hey so for my ethics of democracy seminar i'm trying to work out this idea about strategic voting and i keep running into the same wall. everyone talks about expressive voting vs. duty-based voting like they're seperate boxes, but what if there's this middle problem i want to call "mandate contamination"? here's the gist: you vote for the lesser evil purely defensively, but once that candidate wins they cite the vote total as a mandate for policies you never supported. so your defensive vote gets retroactively folded into an offensive mandate. it's not just that you expressed the wrong thing — it's that the institutional framing of the vote changes what your act meant after the fact. i think this might blur the line between expression and duty in a way standard theories miss.

  anyway, can you look at my notes and tell me if this "mandate contamination" idea actually adds anything, or if i'm just redescribing the usual lesser-evil problem? also please write in american english. (sorry if there are typos — writing this on my phone btwn classes lol)
