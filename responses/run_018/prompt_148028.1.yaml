answer: |-
  The core disagreement is fundamentally about whether democratic processes can *dissolve* individual moral responsibility for justified-yet-wrong acts or merely *distribute* it, reflecting divergent ethical ontologies regarding blame and the nature of "wrongness" itself.

  **Reasons & Commitments:**

  1.  **Moral Residue Side:** Commits to a **non-consequentialist/deontological core** where certain acts (e.g., killing innocents) possess *intrinsic moral wrongness*. Even when overriding consequentialist justification demands the act, this intrinsic wrongness leaves an indelible stain *on the agent who performed it*. Democratic authorisation changes the *context* but cannot erase the *agent's direct causal and volitional role*. The "stain" is the objective, irreducible moral fact of having willed and enacted a fundamental wrong. They focus on **individual agency and intrinsic action properties.**

  2.  **Delegation/Psychological Side:** Commits to a **consequentialist-institutionalist framework**. The "wrongness" is primarily defined by *outcomes* and *procedures*. If a democratically authorised act produces the best available outcome (or averts the worst), and the procedure is legitimate, the act is *fully justified*. Any remaining "stain" is a subjective, pre-modern relic of individual conscience – it *should* vanish upon rational recognition that the *collective*, via its institutions and authorisation mechanisms, is the proper locus of responsibility. They focus on **systemic outcomes and institutional legitimacy.**

  **Diagnosis of Talking Past Each Other:**

  *   **Different Questions:** You are partially correct. The Residue side is fundamentally concerned with **individual moral integrity and the phenomenology of guilt** – what does it *mean* for an agent to *choose* to do evil, even for good? The Delegation side is concerned with **legitimacy, political accountability, and functional governance** – how can societies collectively make and own terrible-but-necessary decisions without paralyzing individual leaders?
  *   **Different Conceptions of "Moral":** For the Residue side, "moral" refers to **agent-relative duties and prohibitions** (what *I* must/should not do). For the Delegation side, "moral" often collapses into **impersonally optimal outcomes validated by collective choice** (what *we* must do).
  *   **Nature of Blame:** Residue sees blame as **attached intrinsically to the act and agent**. Delegation sees blame as **a social tool for regulating behaviour** that can be formally reassigned via institutional processes.

  **Breaking the Deadlock:**

  1.  **Conceptual Distinction (Most Promising):** Explicitly separate **Moral Culpability** (Residue focus: Did the agent commit a *prima facie* wrong act?) from **Political Responsibility/Legitimacy** (Delegation focus: Was the act procedurally authorised and systemically justified?). Accept that democratic authorisation might *secure political legitimacy and distribute political responsibility* without necessarily *erasing individual moral culpability*. This requires both sides to acknowledge their questions are distinct but intertwined dimensions of "dirty hands".
  2.  **Empirical Finding (Limited Impact):** Evidence that voters *do* or *do not* psychologically or behaviourally hold leaders *less* blameworthy after democratic authorisation might challenge the *psychological* aspect of the Delegation side. However, it wouldn't resolve the Residue side's *normative* claim that guilt *should* remain regardless of public opinion. It might show the "hangover" is more persistent than Delegation assumes, but not that it signifies objective moral residue.
  3.  **Formal Model of Distributed Blame (Unlikely):** While a sophisticated model could illustrate *how* blame *could* be distributed institutionally (appealing to the Delegation side), it would be seen by the Residue side as merely *describing a mechanism for evading* the inescapable moral truth of individual culpability. It addresses the "how" of distribution, not the "whether" of dissolution.

  **Bottom Line on Breaking Through:** A robust **conceptual distinction between moral culpability and political responsibility/legitimacy** offers the clearest path. It forces acknowledgement that the two sides are prioritising different, valid aspects of the problem – the inescapable burden on the individual conscience versus the functional demands of collective decision-making under constraint. This doesn't force either side to abandon their core ontology, but it provides a shared language to map the disagreement precisely and potentially identify where institutional design *can* address political responsibility without pretending to erase moral residue. The deadlock stems from trying to collapse these dimensions into a single answer; progress lies in disentangling them.
