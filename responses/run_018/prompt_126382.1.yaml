  5.  **Debrief & Limitations:** Map Round 1’s *individual* omission (salient absence) as the 'map' imposing cause on the territory of mere absence, contrasting Round 2’s *structural* omission (unmarked absence) forcing recognition of background conditions. Predict students will initially miss Round 2's structural cause and vote randomly; frankly state the simulation cannot inherently reproduce the normative "should have acted" loading – the CCSM's breach only feels causal because you explicitly framed their *duty*, requiring direct explanation post-game.
