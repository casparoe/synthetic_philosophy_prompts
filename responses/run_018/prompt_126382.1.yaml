  3.  **Round 2 & Structural Reveal:** Announce a second, identical 7-minute round to "refine protocols"; secretly reassign all roles *except* completely omit the CCSM role, leaving no one responsible for coolant. Ensure no student receives the coolant fault signal this round; the habitat will inevitably fail again due to this structural omission, revealed only post-round.
