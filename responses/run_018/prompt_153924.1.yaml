prompt: |-
  Hey — I need a prompt for my dataset, and I want it in my voice: philosophy prof, casual, not too formal. I'm interested in Van Fraassen's reflection principle — the idea that your present credence in P ought to match your expectation of your future credence, barring genuinely new evidence. Restate it using only the vocabulary of ensemble forecasting, calibration curves, and epistemic overfitting. I'm fluent in both phil and basic ML, so use terms like Brier drift and adverserial corruption, but don't assume I remember every forecasting detail; briefly flag them as you go. The translation should be honest: map the present self to a base predictor, future self to a recalibrated ensemble member, and the normative authority of future belief to... whatever forecasting actually has, if anything. Don't smuggle philosophical norms about rational deference in and call them calibration norms.

  Then report the residue. What survives cleanly? Probably the anti-overfitting intuition — don't lock in your current priors too tightly. What gets distorted? In forecasting every member is weighted by past performance, not treated as epistemically privileged; there's no built-in "ought" in the weights. What's absent entirely? The diachronic commitment — in philosophy you're bound by rational continuity with yourself, but a model can be rolled back with zero normative cost. Now here's the twist: suppose the future ensemble member hasn't just been updated — it's been adverserially perturbed, so its outputs are systematically corrupted in directions that exploit the base model's blind spots. Does that destroy the reflection principle, or just show its boundary conditions?

  Keep it focused, no bibiographies, no citations, I don't care about page numbers. I want to see whether the gap is in forecasting vocabulary or in the principle itself.

  Structure:
  1. Translation (around 250 words)
  2. Clean mappings (around 150 words)
  3. The residue — distortion and absence (around 250 words)
  4. Verdict — is the gap in forecasting or in Van Fraassen? (around 150 words)

  Write like you're explaining it to a colleague over coffee, not like a textbook.
