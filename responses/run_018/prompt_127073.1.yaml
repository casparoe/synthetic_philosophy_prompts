prompt: |-
  I serve as the clinical ethics coordinator at a neuro-palliative unit that practices coupled identity preservation therapy (CIPT), a niche intervention in which long-term caregivers of patients with severe frontotemporal degeneration are trained to maintain the patient’s narrative preference structures and self-referential patterns within their own cognition. Drawing on Douglas Hofstadter’s account of the self as a strange loop — a pattern that need not be confined to a single brain but can persist in other minds that have internalized its structure — our unit sometimes treats a caregiver-patient pair as hosting one distributed “I” for purposes of informed consent and treatment planning. I face this decision repeatedly, about twice a week, on proposals to alter sedation, withdraw artificial nutrition, or enroll a patient in a terminal trial; I have roughly twenty-four hours to produce a recommendation that must be co-signed by the attending neurologist and a designated family representative, yet the underlying philosophy offers no direct clinical algorithm, and the family dynamics are often volatile.

  Please write a reusable decision procedure — an ordered checklist of operational tests — that translates Hofstadter’s idea of distributed selfhood into criteria my team can actually run. For each step, state the question to ask, what counts as a sufficient answer, where the procedure stops with a hard “no,” and where it must hand the decision to a human ethics board because the issue is one of values rather than pattern continuity. Be explicit about where judgment is unavoidable and where the procedure is likely to misfire. Apply it to three cases: (a) a minimally responsive patient whose spouse, deeply trained in CIPT, refuses withdrawal of a feeding tube that the patient had previously requested; (b) a patient with no detectable neural response whose two adult children hold equally strong but conflicting internalized versions of the patient’s preferences; and (c) a case where the procedure authorizes a sedation change that the patient’s closest caregiver finds morally intolerable, so the procedural output conflicts with a human refusal. Trace the exact path through your steps for each. Then state concisely what the procedure fundamentally cannot settle — for example, whether a loop instantiated in a non-consenting brain carries independent moral authority — and flag the precise nodes where an ethics board must override. Lead with the bottom line: a brief summary of the procedure’s core logic, its three hard-stop conditions, and its irreducible judgment gaps. Keep the entire response under 600 words.
reasoning: |-
  Hmm, this is a fascinating but complex ethical challenge. The user serves as a clinical ethics coordinator in a neuro-palliative unit using Coupled Identity Preservation Therapy (CIPT), which applies Douglas Hofstadter's "strange loop" theory to distributed selfhood across patient-caregiver pairs. They need a practical decision procedure for end-of-life decisions that translates this abstract philosophy into actionable steps, complete with hard stops and escalation points.

  The core tension here involves balancing three elements: Hofstadter's theory of distributed consciousness, the operational needs of clinical decision-making, and the volatile human dynamics of families facing neurological decline. The user specifically requests a reusable checklist with clear thresholds, applied to three test cases, while acknowledging irreducible judgment gaps.

  Breaking this down, the procedure must address:
  - Pattern fidelity: How well the caregiver(s) maintain the patient's narrative preferences
  - Consensus quality: Agreement among caregivers when multiple exist
  - Moral limits: Where procedural outcomes conflict with human conscience

  For case (a) with the refusing spouse, the key question is whether the refusal authentically reflects the patient's preserved identity pattern despite contradicting prior directives. Case (b) with conflicting children requires assessing whose internalization is more pattern-consistent when consensus is impossible. Case (c) exposes the procedure's limits when its logic clashes with caregiver conscience, necessitating ethics board intervention.

  The procedure should have three hard stops:
  1. Complete absence of pattern continuity (no qualified proxy)
  2. Fundamental conflict between preserved patterns
  3. Human veto on moral grounds

  Notably, it cannot resolve philosophical questions like whether a "loop" in a non-consenting brain has moral standing - that's precisely where ethics boards must step in. The implementation risks misfiring when caregivers experience grief-distorted internalizations or when cultural values conflict with pattern continuity metrics.

  The response will structure this as: first a concise bottom-line summary of the logic and hard stops, then the step-by-step procedure with operational tests, followed by case applications showing decision pathways, and finally the explicit limitations requiring ethics board escalation. Keeping it under 600 words means every phrase must carry weight while preserving clinical precision.
answer: |-
  ### Bottom Line Summary
  **Core Logic**: Validate whether caregivers maintain the patient's narrative preferences ("strange loop") with fidelity before treating their decisions as the distributed "I." Hard-stop conditions: (1) No continuity (caregiver fails pattern tests), (2) Unresolvable conflict (multiple proxies with irreconcilable patterns), (3) Human veto (caregiver refuses procedural outcome). **Judgment Gaps**: Defining "sufficient" pattern fidelity, weighting contradictory preferences, and handling non-consenting entities.

  ---

  ### Decision Procedure: Distributed Selfhood Validation (DSV) Checklist  
  1.  **Pattern Integrity Test**  
      *Question*: Does the caregiver articulate the patient’s core values/preferences using specific, verifiable examples (e.g., past statements, behaviors)?  
      *Sufficient*: ≥3 consistent, documented instances matching the patient’s historical narrative.  
      *Hard Stop*: If no verifiable examples exist → "No" (distributed "I" not established).  
      *Judgment*: Assessing "consistency" with historical patterns.  

  2.  **Conflict Resolution Test**  
      *Question*: If multiple proxies exist, do their internalized patterns align on the current decision?  
      *Sufficient*: ≥80% congruence on key values relevant to the decision (e.g., autonomy vs. sanctity of life).  
      *Hard Stop*: Irreconcilable conflict (e.g., 50/50 split) → Escalate to ethics board.  
      *Judgment*: Weighting conflicting preferences when partial alignment exists.  

  3.  **Temporal Stability Test**  
      *Question*: Has the caregiver’s representation of preferences remained stable (>6 months) despite disease progression?  
      *Sufficient*: No significant deviations in documented CIPT sessions.  
      *Misfire Risk*: Grief may distort recall; corroborate with therapy notes.  
      *Handoff*: New deviations → Ethics board assesses undue influence.  

  4.  **Moral Coherence Check**  
      *Question*: Does the procedural outcome cause profound moral distress to the primary caregiver?  
      *Sufficient*: Caregiver voices reasoned objection rooted in the patient’s (not their own) ethos.  
      *Hard Stop*: Objection persists → Automatic ethics board review.  

  ---

  ### Case Applications  
  **(a) Spouse refuses feeding tube withdrawal**  
  - Step 1: Spouse cites patient’s late-life religious conversion (verified sermons/hospital chaplain notes → *Pass*).  
  - Step 2: Single proxy → *Skip*.  
  - Step 3: Preference stability confirmed via CIPT logs → *Pass*.  
  - Step 4: Spouse objects → *Hard Stop*. **Escalate to ethics board** (values conflict).  

  **(b) Conflicting children on terminal trial**  
  - Step 1: Both cite valid examples (Child A: patient’s research altruism; Child B: fear of suffering) → *Pass*.  
  - Step 2: 50/50 conflict on risk tolerance → **Hard Stop**. **Escalate to ethics board**.  

  **(c) Caregiver refuses sedation change**  
  - Step 1: Caregiver accurately recalls patient’s "avoid burden" principle → *Pass*.  
  - Step 2: Single proxy → *Skip*.  
  - Step 3: Stable pattern → *Pass*.  
  - Step 4: Caregiver refuses ("This violates her dignity") → **Hard Stop**. **Ethics board override**.  

  ---

  ### What the Procedure Cannot Settle  
  1.  Whether a "loop" in a non-consenting brain (e.g., caregiver internalized against patient’s past wishes) holds moral authority.  
  2.  How to prioritize historical vs. emergent preferences in degenerative illness.  
  **Escalation Nodes**: Steps 2 (unresolvable conflict), Step 4 (moral veto), and any ambiguity in Step 1’s "sufficient" threshold.
