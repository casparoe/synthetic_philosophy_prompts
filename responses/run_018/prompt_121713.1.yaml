prompt: |-
  hey — hoping you can help me think something through before thursday.

  I've just joined the ethics panel at my food co-op (about 4,000 members; we publish short non-binding "should members do X?" notes that people actually read). I've read through two years of minutes and I cannot work out what rule we've been running. The cases so far:

  1. Driving 2km to the shops when you could walk. Ruling: don't. The minutes say the extra fuel adds a real if imperceptible increment of harm, spread across zillions of people, and that no single driver is pivotal for anything — and that this doesn't get you off the hook. They explicitly flag that this is different from case 2: here there's no threshold, you're adding a tiny increment, not gambling on being the one who tips an order.

  2. One 200g pack of factory-farmed mince from our own butcher counter. They reorder in whole-animal units, so any given pack has maybe a 1-in-700 shot of nudging the next order up by one animal. Ruling: don't.

  3. A leather belt from an online closing-down sale: shop shuts next week, owner retiring, no reorder, no reinvestment of the money, plain packaging, and the member works from home so basically nobody will ever see her wearing it. Ruling: no obligation — buy it, don't feel bad.

  4. Voting. Ruling: you should vote in a close election; no obligation to vote in one that's certain to be 70/30. One member filed a dissent saying that's inconsistent: if a 1-in-700 shot is enough in case 2, we can't suddenly get squeamish about a 1-in-a-million shot here.

  5. Chicken from a new supplier whose ordering system is opaque — might be whole-bird thresholds, might be weight-based, might be a franchise where your purchase changes nothing at all. Ruling: don't, because you can't rule out being pivotal and skipping is cheap.

  6. Six members splitting a whole pig from a farmer, where if any one drops out the other five would buy a smaller joint instead. Ruling: don't, and the minutes add "this one isn't marginal — you're each forking over a sixth of the animal."

  New case, which is mine to draft: the summer party. The beef was pre-ordered and paid for in March, non-refundable, 40kg from a local farm; it's a one-off, the farm's herd plan is fixed for the year and won't respond to anything about the party; whatever isn't eaten goes to a food bank whose users' demand doesn't feed back into any order anywhere. So the production channel is dead and the money is long gone. But the member in question writes our newsletter column, sits on the board, and three other members have literally said they're waiting to see what she does before they decide — including a new member who's been going back and forth. Her choice will be public.

  So: does she have to skip the burger? What rule are we actually running, and what other rules fit those six verdicts just as well? What does each of them say about the party? Give me your best guess with the closest analog among 1–6, and if our precedents genuinely don't decide it, tell me what we'd be committing ourselves to with each answer. Also tell me what further case I should put on the agenda that would flush out which rule we're on. And I'd like to know whether it matters that it's *her* — board member, columnist — rather than some random new member at the same table, or whether that's a red herring.
reasoning: |-
  Okay, the user is part of an ethics panel at their food co-op and needs help analyzing a new case about whether a prominent member should eat a beef burger at a summer party. They've provided six previous rulings and want to understand the underlying ethical rule, apply it to the new case, and identify any ambiguities.

  First, I need to figure out the pattern in the existing cases. Let me list them out: 

  Case 1 (driving): Small harm with no threshold → don't do it  
  Case 2 (mince): Small probability of being pivotal (1/700) → don't do it  
  Case 3 (belt): No causal link → okay  
  Case 4 (voting): Only obligated when pivotal probability is significant (close election)  
  Case 5 (opaque chicken): Risk of being pivotal → avoid  
  Case 6 (pig share): Directly pivotal → don't  

  The common thread seems to be a focus on causal responsibility and pivotal probability, not just marginal harm. The panel cares about whether an action could directly trigger harm (pivotal) or contributes to diffuse harm (imperceptible increment). They're more lenient when the causal chain is broken (case 3) or when harm is truly marginal without thresholds (case 1 vs 2). 

  For the summer party case:  
  - Beef is already paid for and won't affect future production  
  - Uneaten food goes to food bank without feedback loops  
  - But her choice influences 3 others, including a hesitant new member  

  This has two layers:  
  1. The direct act (eating beef) has no causal impact - similar to case 3  
  2. But her symbolic action might influence others - making her pivotally responsible for their future choices  

  The panel's precedents don't clearly address influence effects. Case 4 considers electoral pivotality but not social influence. Case 6 is about direct pivotality in a group purchase.  

  Possible rulings:  
  A) No obligation - because no direct impact (aligns with case 3)  
  B) Should skip - because of influence risk (extends case 5/6)  

  The member's prominence matters here - unlike a random person, her actions have demonstrable influence (3 people are watching). This makes her pivotally responsible for their potential future beef consumption.  

  To resolve ambiguity, I'd propose testing cases:  
  - Influencing others' harmful actions (e.g. promoting driving)  
  - Symbolic acts with no direct harm but modeling behavior  

  This would force the panel to clarify if they care about influence apart from direct causality.  

  For the draft ruling: The safest path is "no obligation" based on existing precedents (case 3), but flag the unsettled influence question for future discussion. If they want consistency with case 5's precautionary principle, they might advise skipping despite no direct harm.
answer: |-
  Based on your six precedents, your panel operates under a **"Causal Responsibility + Pivotal Threshold Test"** rule. Here's the breakdown and application to the summer party case:

  ### The Core Rule (Inferred from Cases 1–6):
  **An action is ethically problematic if:**
  1. **It risks being pivotal** (directly triggering harm by crossing a threshold *or* influencing others to cause harm), **OR**
  2. **It contributes to a harm with no threshold** (imperceptible but real incremental damage), *unless* the causal chain is severed (e.g., no production/market feedback).

  ### Key Principles from Precedents:
  - **Pivotal Harm Matters Most** (Cases 2, 4–6): Obligation arises when your act has a non-negligible chance of directly causing harm (e.g., triggering an animal order, swinging an election).  
  - **Diffuse Harm Still Counts** (Case 1): Even non-pivotal acts are forbidden if they add irreversible harm (e.g., CO₂ emissions).  
  - **Broken Causal Chains Excuse** (Case 3): No obligation if your act cannot influence future harm (e.g., no market signal).  
  - **Precautionary Principle** (Case 5): Avoid acts where pivotal risk *can't be ruled out* and skipping is easy.  
  - **No "Mere Marginality" Defense** (Case 1 vs. 2): Tiny harms aren’t excused just because they’re small, *unless* causality is broken.

  ---

  ### Analysis of the Summer Party Case:
  **Direct Act (Eating the Burger):**  
  - **No pivotal risk:** Beef is pre-paid, farm’s production is fixed, leftovers go to food bank (no feedback loop).  
  - **No diffuse harm:** Consuming it doesn’t increase demand (unlike driving in Case 1).  
  - → **Matches Case 3 (leather belt):** Causality is severed. **No obligation to skip.**

  **Indirect Influence (Her Public Choice):**  
  - She *is* pivotal: Her choice directly affects 3 others’ actions (including a wavering new member).  
  - If she eats, she may normalize beef consumption for them → future harmful acts *they* commit.  
  - → **Matches Case 6 (pig share):** She’s "forking over a sixth" of the *influence*, not the beef. Her prominence makes her pivotally responsible for others’ choices.  

  **Verdict:**  
  - **She should skip the burger** to avoid being pivotal in *influencing others*.  
  - **Closest analog:** **Case 6** (pivotal in a group decision) + **Case 5** (precautionary: skipping is cheap, influence risk can’t be ignored).  

  **Why Her Role Matters:**  
  - Not a red herring. Her visibility (columnist/board member) creates a *demonstrable causal link* to others’ actions (3 members explicitly watching her). A random member’s choice wouldn’t carry this weight → less pivotal risk. Your panel emphasizes *actual* over *hypothetical* influence (Case 4: voting only matters if the election is close; here, her influence is actively sought).  

  ---

  ### Ambiguities & Commitments:
  - **If you rule "no obligation" (aligns with Case 3):**  
    - Commit to: *Causality is king*. Symbolic acts or influence don’t matter unless tied to direct harm.  
    - Risk: Undermines Case 6 (pig share) where pivotality in a group *was* condemned.  

  - **If you rule "must skip" (aligns with Case 6):**  
    - Commit to: *Social influence is pivotal harm*. Public figures must model behavior to prevent downstream harm.  
    - Risk: Expands obligation beyond direct causality (could implicate all visible members’ choices).  

  ---

  ### Proposed Test Case to Clarify the Rule:
  **"Influencing Non-Pivotal Acts":**  
  *Scenario:* A popular member drives to the co-op (Case 1 violation) and posts about it. 10 members see it and think, "If they do it, I can too." Their collective driving adds 20km of emissions.  
  *Question:* Is the influencer obligated not to drive?  

  **Why this helps:**  
  - Tests whether **influence alone** (without direct pivotality) triggers obligation.  
  - If "yes," your rule prioritizes *social responsibility*.  
  - If "no," your rule requires *direct causality* (production/demand harm).  

  ---

  ### Recommended Draft Ruling:
  > *"The panel finds no ethical issue with consuming the pre-ordered beef, as it severs causal links to production harm (Case 3). However, members in positions of influence must avoid acts that could pivotally encourage harmful choices by others (Cases 5–6). Here, the member’s public decision risks normalizing high-impact consumption for observers. Skipping the burger is a low-cost precaution against this influence. Thus, they should abstain."*  

  **Tactical note:** Frame it as "modeling ethical behavior" to sidestep philosophical debates. Your precedents lean toward pragmatic pivotality—use that.
