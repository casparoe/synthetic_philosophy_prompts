answer: |-
  Your skepticism about reflective equilibrium’s capacity to cleanse moral reasoning of deep-seated bias cuts to the heart of a critical problem. Normative sedimentation—where biases become constitutive of our evaluative standards—poses a genuine threat to coherence-based methods. Given your background, timeline, and practical aims, I’d prioritize your efforts as follows, while framing this as a nested research program where earlier findings scaffold later work.

  **First Priority: Conceptual/Empirical Investigation into Corrigibility of Cognitive Distortions**  
  This should anchor your work because it directly confronts normative sedimentation’s core threat: the invisibility of biases that have structured reflection itself. It’s upstream for three reasons. First, without understanding *which* biases remain detectable and corrigible despite embedding in our standards, formal models of preference change (your second option) risk importing undetected distortions into their axioms. Second, it tests the viability of the preference-bias distinction (your meta-question) pragmatically: if some sedimented biases prove corrigible through specific interventions, the distinction holds operational value; if all resist correction, entanglement becomes the default. Tractability suits your strengths: begin with conceptual taxonomy of biases (e.g., framing effects vs. identity-protective cognition) and their hypothesized mechanisms for resisting detection, then engage selectively with empirical literature—particularly longitudinal studies of debiasing interventions (e.g., cognitive forcing functions, adversarial collaboration) and case studies of moral paradigm shifts (e.g., abolitionist reasoning challenging sedimented slavery justifications). Crucially, focus on *failure cases* where interventions *didn’t* work despite reflection, analyzing why. Evidence elevating this priority: experimental results showing certain biases (e.g., implicit association) persistently recalibrate after targeted challenges, suggesting corrigibility. Evidence diminishing it: uniform failure of interventions across bias types, implying deep entanglement is inescapable.

  **Second Priority: Meta-Question on the Viability of the Distinction**  
  Address this once initial corrigibility findings emerge, as it relies on those insights. If early work shows some biases resist all available correction—despite seeming "preference-like" through reflection—it becomes urgent to ask whether clean separation is possible or whether we need typologies of entanglement (e.g., "constitutive" vs. "contextual" biases). Conversely, evidence of corrigibility preserves the distinction’s utility. This direction is highly tractable for you: deploy logical analysis to dissect assumptions underlying "purified preference" ideals (e.g., foundationalist vs. coherentist epistemologies) and conceptualize entanglement. Use case-based reasoning (e.g., historical examples like gender bias in "impartial" moral theories) to map how biases mimic legitimate preferences. Shift priority upward if corrigibility research reveals persistent, uncorrectable distortions that function as de facto preferences; shift downward if most distortions show susceptibility to external calibration.

  **Deprioritized: Formal Models of Preference Change**  
  While tempting given your logic background, I’d place this third. Without robust empirical grounding in *which* changes signify bias vs. development, models risk formalizing artifacts of sedimentation. Building empirically credible models requires large datasets on moral reasoning over time—infeasible without labs or collaborators. If pursued prematurely, it might yield elegant but unanchored mathematics. Focus here only if prior work identifies clear markers distinguishing bias reinforcement from moral growth (e.g., asymmetric updating in response to counterevidence). Even then, start modestly: formalize specific micro-dynamics (e.g., belief updating under motivated reasoning) rather than grand theories of preference evolution.

  **Overlooked but Critical: Institutional Mechanisms for External Correction**  
  This deserves elevation into your top tier alongside corrigibility research. Normative sedimentation’s deepest danger is its resistance to *internal* reflection—making *external* checks essential for any practical framework. Institutions can introduce "epistemic friction" through:  
  - **Structured adversarial processes** (e.g., red teams in ethics review) forcing engagement with dissenting perspectives  
  - **Diversified deliberative bodies** leveraging standpoint diversity to expose sedimented blind spots  
  - **Temporal auditing** comparing current judgments to past reasoned positions to detect drift  
  Your background supports analyzing institutional logic: examine how mechanisms like NIH’s ethics review or truth commissions mitigate bias by design. Partner selectively with political scientists or organizational theorists studying deliberative bodies. Tractability is high—analyze case studies (e.g., Institutional Review Boards adapting to new ethical concerns like AI bias) and model how procedural designs (e.g., blinding procedures, rotating memberships) counter sedimentation. Evidence elevating this: studies showing institutions with such features outperform individual reflection in error-correction.  

  **Defended Trajectory**  
  Spend Year 1 on corrigibility and institutional mechanisms in tandem: the former identifies *what* needs correction, the latter *how* to operationalize it. Year 2 integrates these into your meta-framework, testing whether corrigibility data supports preserving the distinction or demands entanglement typologies. Only then (Year 3) consider formal modeling if robust markers of bias vs. preference emerge. This sequence ensures each step builds toward a workable framework: understanding cognitive corrigibility informs *what* institutions should target, while institutional design provides the *practical means* for external calibration that individual reflection lacks. If sedimentation renders some biases invisible internally, the path forward isn’t deeper introspection but smarter social scaffolding—making institutional design not just an application, but a core theoretical pillar.  

  A shift in focus midway would be warranted if, say, Year 1 reveals that *all* purported cases of bias-correction in literature actually involve replacing one sedimented framework with another. But short of that radical outcome, prioritizing corrigibility and institutional countermeasures offers the most direct path to a framework that might actually reform ethics review protocols or personal deliberation—precisely because it accepts that the isolated mind, no matter how reflective, may be the worst tool for detecting its own deepest distortions.
