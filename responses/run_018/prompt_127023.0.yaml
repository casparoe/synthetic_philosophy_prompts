  For method, the user suggested close textual analysis and a "moral expectation" model. That’s clever. Modeling the good life as an expectation value across possible preference states could show whether Keynes' framework allows for flexibility or secretly relies on hidden certainties. I should emphasize building this model step-by-step in the proposal. 

  Results and failure conditions matter too. Success would mean proving Keynes holds a "probabilistic virtue ethics," where uncertainty demands cultivating adaptable virtues. Failure? If his long-run arguments sneak in quasi-certainty. The user must also acknowledge scope limits—no deep dive into later economists like Sen, but a focused probe into Keynes' own compatibility. 

