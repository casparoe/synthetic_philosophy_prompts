prompt: |-
  hey — i'm a phd student in philosophy of action and decision theory, writing this quick between seminars so there might be a typo or two. i'm sick of people just retelling parfit's hitchhiker like that's an answer, and i want the actual spec: what must an adequate theory of rational self-binding in one-off interactions deliver?

  write the desiderata. for each, give the motivating case or formal constraint behind it — the original hitchhiker scenario, the reverse case where the driver demands proof of commitment but the proof itself undermines the disablement, the 'midnight clause' problem where the binding mechanism activates before you reach the decision point, and whatever comes from causal decision theory or dynamic consistency. flag which requirements are non-negociable and which are just camp prefferences (e.g. whether preserving the independance axiom is essential, whether diachronic agency is required). then tell me if there's a subset that's jointly unsatisfyable — that's the part i actually care about.

  briefly analyse how the standard causal-decision-theoretic dismissal and the 'rational precommitment as costly signalling' view do against your list, showing exactly which desiderata they miss, not just giving a verdict.

  please separate what's settled from what's genuinely contested among people who know the topic, and don't present one camp's view as the consensus.

  after the main text, include a table with these columns: Requirement (the criterion), Motivating Case or Constraint (why it's required), Negotiable? (Yes / No / Maybe with brief reason), Status (Settled vs Contested — what's agreed vs what's fought over). use british english throughout — analyse, behaviour, centre, colour, etc.
reasoning: |-
  We are writing a specification for an adequate theory of rational self-binding in one-off interactions. We'll break down the requirements (desiderata) based on classic cases and formal constraints. Then we'll evaluate two standard approaches and provide a table summarising the desiderata.

  ### Core Desiderata for a Theory of Rational Self-Binding

  1. **Requirement: Resolve Parfit's Hitchhiker**
     - **Motivating Case**: In Parfit's Hitchhiker, you are lost in the desert. A driver offers a ride only if you promise to pay £100 upon arrival. You would prefer to pay and arrive rather than refuse and die. However, once you arrive, you prefer not to pay. The problem: if the driver knows you are rational and will not pay, he won't pick you up. But if you can bind yourself to pay, you can get the ride. An adequate theory must explain how such binding is rational and effective.
     - **Negotiable?**: No. This is the central problem to solve.
     - **Status**: Settled that a theory must address this, but how is contested.

  2. **Requirement: Deal with the Reverse Hitchhiker (Proof Undermines Disablement)**
     - **Motivating Case**: Suppose the driver demands proof of commitment before the ride (e.g., signing a contract that automatically pays upon arrival). However, the act of providing the proof (signing) might itself undermine the need for disablement because it creates a legal obligation that you cannot break. But what if the contract is unenforceable? Or what if the driver cannot verify the commitment? The theory must handle cases where the mechanism of binding either defeats itself (by being too costly or impossible) or where the proof is not credible.
     - **Negotiable?**: No. A theory must explain how binding is both possible and credible without undermining the very reason for binding.
     - **Status**: Contested. Some argue that only external enforcement works; others believe in internal solutions.

  3. **Requirement: Handle the Midnight Clause Problem**
     - **Motivating Case**: Imagine you must commit at midnight to pay £100 the next day at noon, but at midnight you prefer not to commit because you know that by noon you won't want to pay. However, if you don't commit, you don't get the ride. The binding mechanism (e.g., setting up an automatic payment at midnight) must be activated when you are not at the decision point (noon) but when you are still in a position to choose. The theory must explain why it is rational to set up the binding at midnight even though you know that at noon you will regret it.
     - **Negotiable?**: No. This is a fundamental issue in dynamic choice.
     - **Status**: Contested. Solutions often involve sophisticated choice or resolute choice, but these are debated.

  4. **Requirement: Satisfy Dynamic Consistency**
     - **Motivating Case**: Dynamic consistency requires that a plan made at an earlier time remains optimal at later times, given the same information. In the Hitchhiker, if you plan at the start to pay upon arrival, then at arrival you should still find paying optimal. But in the standard case, it is not. The theory must either show how the plan can be dynamically consistent or explain why dynamic consistency should be relaxed.
     - **Negotiable?**: Maybe. Some (e.g., McClennen) argue for resolute choice that violates dynamic consistency; others (e.g., orthodox CDT) insist on it.
     - **Status**: Contested. Orthodox decision theory holds dynamic consistency as non-negotiable, but some philosophers of action reject it.

  5. **Requirement: Preserve the Independence Axiom?**
     - **Motivating Constraint**: The independence axiom (from expected utility theory) states that if you prefer A to B, then you should prefer a lottery that gives A with probability p and C with probability 1-p to a lottery that gives B with probability p and C with probability 1-p. In the context of self-binding, if we model binding as a kind of lottery, we might face violations. However, the necessity of preserving the axiom in self-binding contexts is debatable.
     - **Negotiable?**: Yes. Many theories of rational choice under uncertainty (e.g., ambiguity aversion) already drop independence. It's a camp preference: causal decision theorists (CDT) typically want to preserve it; evidential and other theories may not.
     - **Status**: Contested. It is settled that standard EU theory requires it, but its role in self-binding is disputed.

  6. **Requirement: Diachronic Agency**
     - **Motivating Constraint**: Should the theory treat the agent as a single entity over time (diachronic) or as a series of time-slices (synchronic)? Diachronic agency might allow for binding as a commitment by the earlier self to the later self, while synchronic agency might require external mechanisms. The motivating case is any sequential decision problem (like the Hitchhiker) where the agent at different times has conflicting preferences.
     - **Negotiable?**: Maybe. Some see diachronic agency as essential (e.g., Bratman), while others (e.g., CDT with time-slices) avoid it.
     - **Status**: Contested. No consensus.

  7. **Requirement: Compatibility with Causal Decision Theory (CDT)**
     - **Motivating Constraint**: CDT evaluates acts based on their causal consequences. In the Hitchhiker, at the time of payment, paying does not cause the ride (which is in the past) and so CDT says not to pay. But then the ride is not offered. The theory must either show how CDT can handle self-binding (e.g., through precommitment) or reject CDT.
     - **Negotiable?**: For CDT advocates, it is non-negotiable. For others, it is negotiable.
     - **Status**: Contested. CDT is the dominant formal theory, but its limitations in dynamic settings are well-known.

  8. **Requirement: Avoid Circularity in Costly Signalling**
     - **Motivating Case**: The "rational precommitment as costly signalling" view (e.g., by Skyrms) says that you can bind yourself by a costly act that signals your type. But in a one-off interaction, why is the signal credible? If the cost is sunk, then at the time of performance, you still don't want to perform. For example, if you burn $10 to signal you will pay £100, but then once burned, you still prefer not to pay the £100. The theory must avoid circularity: the signal must be both costly and such that only those who intend to perform would send it, but in a one-off, why wouldn't everyone avoid the cost?
     - **Negotiable?**: No. A theory must not rely on circular reasoning.
     - **Status**: Settled that circularity is bad, but contested how to avoid it.

  ### Joint Unsatisfiability?

  There is a subset of these requirements that appears jointly unsatisfiable:

  - **Dynamic Consistency** requires that the plan made at t0 (to pay at t1) remains optimal at t1. 
  - But in the Hitchhiker, at t1 (arrival) it is not optimal to pay (because the ride is already received and paying only costs money). 
  - Therefore, if we insist on dynamic consistency, we cannot have a plan that includes paying at t1. 
  - But then we cannot solve the Hitchhiker.

  Moreover, if we require **Compatibility with CDT**, then at t1, CDT says not to pay (because paying does not cause any desired outcome). So we cannot have a plan that includes paying at t1 and be both dynamically consistent and CDT-compliant.

  Thus, the requirements:
  - Resolve Parfit's Hitchhiker (which requires paying at t1)
  - Dynamic Consistency
  - Compatibility with CDT

  are jointly unsatisfiable.

  ### Analysis of Standard Approaches

  #### 1. Causal Decision Theory (CDT) Dismissal
  - CDT says: at the time of payment, you should not pay because it doesn't cause the ride (which is already received). Therefore, if the driver knows you are a CDT agent, he won't pick you up. 
  - **Which desiderata does it miss?**
    - It fails to resolve Parfit's Hitchhiker (desideratum 1) because the ride is not offered.
    - It fails to handle the Midnight Clause (3) because at midnight you know that at noon you won't pay, so you don't commit, and then you don't get the ride.
    - It fails the Reverse Hitchhiker (2) because if the driver demands proof, and you are a CDT agent, you won't provide it (because the proof is costly and doesn't cause the ride) unless the proof itself is enforced (but then it's not a self-binding but external).
    - It satisfies dynamic consistency (4) and CDT compatibility (7) and the independence axiom (5) if we assume it.
    - It avoids circularity (8) because it doesn't use signalling.

  #### 2. Rational Precommitment as Costly Signalling
  - This view (e.g., Skyrms) says: you burn $10 at t0 to signal that you are the type who will pay at t1. The driver sees the signal and picks you up. Then at t1, you pay because ... well, why? 
  - **Problems**: 
    - Why is burning $10 at t0 credible? In a one-off interaction, if you burn $10, that doesn't force you to pay at t1. At t1, you still prefer not to pay. So the driver shouldn't be convinced.
    - **Which desiderata does it miss?**
      - It might resolve the Hitchhiker (1) only if the signal is truly credible and the driver believes you will pay. But without an enforcement mechanism, it fails to handle the Reverse Hitchhiker (2) because the proof (burning $10) does not disable your ability to renege at t1. 
      - It fails to handle the Midnight Clause (3): at midnight, you know that at noon you won't want to pay, so why burn $10? If you don't burn, you don't get the ride. But burning is costly and doesn't bind you to pay at noon. So you are worse off.
      - It may violate dynamic consistency (4) because at midnight you plan to pay at noon, but at noon you don't. 
      - It avoids circularity (8) only if the signal is such that only those who will pay would send it. But in a one-off, without reputation, there is no reason to pay after sending the signal. Thus, circularity: the signal is only credible if you pay, but you only pay if the signal is credible? 
      - It may not require diachronic agency (6) if the signal is an external act, but then it doesn't explain why the later self pays.

  ### Summary of Settled vs Contested

  - **Settled**: 
    - A theory must resolve the original Hitchhiker (1) and avoid circularity (8). 
    - The Reverse Hitchhiker (2) and Midnight Clause (3) are recognised as problems that any theory must address.

  - **Contested**:
    - Whether dynamic consistency (4) must be upheld.
    - Whether the independence axiom (5) is essential.
    - Whether diachronic agency (6) is required.
    - Whether compatibility with CDT (7) is necessary.

  ### Table of Requirements (British English)

  | Requirement                                      | Motivating Case or Constraint                                                                                                                               | Negotiable?                                  | Status                                      |
  |--------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------|---------------------------------------------|
  | Resolve Parfit's Hitchhiker                      | Original scenario: need to bind oneself to pay upon arrival to get a ride, but at arrival, one prefers not to pay.                                          | No                                          | Settled (must be addressed)                 |
  | Deal with the Reverse Hitchhiker                 | Driver demands proof of commitment, but the proof itself may undermine the disablement (e.g., if the proof is not credible or too costly).                  | No                                          | Contested (how to achieve)                  |
  | Handle the Midnight Clause Problem               | Commitment must be made at an earlier time (midnight) when one already knows that at the decision time (noon) one will not want to follow through.          | No                                          | Contested (how to achieve)                  |
  | Satisfy Dynamic Consistency                      | A plan made at an earlier time should remain optimal at later times, given the same information.                                                            | Maybe (some theories abandon it)            | Contested (whether required)                |
  | Preserve the Independence Axiom?                 | Expected utility theory requires independence; if self-binding requires violating it, is that acceptable?                                                   | Yes (camp preference)                       | Contested (role in self-binding)            |
  | Diachronic Agency                                | Should the theory treat the agent as a unified entity over time? Needed to explain binding as a commitment to one's future self.                            | Maybe (depends on the theory)               | Contested                                   |
  | Compatibility with Causal Decision Theory (CDT)  | CDT evaluates acts by causal consequences; at the time of payment, paying does not cause the ride, so CDT says not to pay.                                  | For CDT advocates: No; others: Yes          | Contested (whether CDT must be preserved)   |
  | Avoid Circularity in Costly Signalling           | Costly signalling must not rely on the very behaviour it is meant to induce (e.g., burning money to signal payment must not assume payment will occur).     | No                                          | Settled (circularity is bad)                |

  ### Conclusion
  The core tension is between dynamic consistency, CDT compatibility, and the need to resolve the Hitchhiker. A theory must relax at least one of these. The landscape is contested, with no consensus on the best approach. While costly signalling avoids CDT's problems, it faces circularity and credibility issues. A breakthrough might require rethinking agency over time or the role of causation in decision theory.
answer: |-
  ### Desiderata for an Adequate Theory of Rational Self-Binding in One-Off Interactions  
  Below, I outline the core requirements for a theory of rational self-binding, grounded in canonical cases and formal constraints. I distinguish non-negotiable criteria from contested "camp preferences," flag joint unsatisfiability, and analyse standard approaches. British English is used throughout (e.g., "behaviour," "analyse," "colour").

  ---

  #### **Core Desiderata**  
  1. **Requirement: Resolution of Parfit's Hitchhiker**  
     - **Motivating Case**: In Parfit's original scenario, a stranded agent must commit to paying £100 upon rescue by a driver. Ex ante, paying for rescue is preferable to dying. Ex post, once rescued, paying is dominated by not paying. A theory must explain how rational agents can credibly commit *ex ante* to the suboptimal *ex post* action, ensuring the driver offers rescue.  
     - **Negotiable?**: **No**. This is the *sine qua non* of self-binding theories.  
     - **Status**: **Settled** as essential, but *how* to achieve it is contested.  

  2. **Requirement: Robustness to Reverse Hitchhiker Scenarios**  
     - **Motivating Case**: The driver demands proof of commitment *before* acting (e.g., signing a contract). However, the binding mechanism (e.g., a contract) may undermine itself—e.g., if the contract requires upfront costs that negate the benefit of rescue, or if its enforceability is questionable. A theory must ensure binding mechanisms remain credible and net-beneficial without self-defeat.  
     - **Negotiable?**: **No**. Self-binding must not collapse under its own implementation.  
     - **Status**: **Contested**. Disagreement exists over whether internal (psychological) or external (institutional) mechanisms suffice.  

  3. **Requirement: Midnight Clause Compatibility**  
     - **Motivating Case** (adapted from Kavka's Toxin Puzzle): At midnight, you must activate a binding mechanism (e.g., a preauthorised payment) to commit to paying at noon. However, at midnight, you know that at noon you will prefer *not* to pay. A theory must rationalise midnight activation despite foreseen noon regret.  
     - **Negotiable?**: **No**. Any theory must handle temporal dislocation between commitment and action.  
     - **Status**: **Contested**. Orthodox causal decision theory (CDT) struggles here; alternatives (e.g., resolute choice) are debated.  

  4. **Requirement: Dynamic Consistency**  
     - **Formal Constraint**: Plans deemed optimal at time \(t_0\) must remain optimal at \(t_1\) given unchanged information. Violations imply "rethink" problems (e.g., committing to pay at \(t_0\) but reneging at \(t_1\)).  
     - **Negotiable?**: **Maybe**. Orthodox CDT/decision theory treats it as non-negotiable; revisionists (e.g., McClennen) argue it must be relaxed for self-binding.  
     - **Status**: **Contested**. A key fault line between traditionalists and revisionists.  

  5. **Requirement: Preservation of the Independence Axiom**  
     - **Formal Constraint**: Expected utility theory’s independence axiom (preferences over lotteries are independent of irrelevant alternatives) should hold. Self-binding may require violating it if commitment alters choice sets.  
     - **Negotiable?**: **Yes**. Many (e.g., ambiguity-aversion theorists) reject strict independence; CDT defenders insist on it. Camp preference.  
     - **Status**: **Contested**. Largely a proxy for commitment to orthodox rational choice theory.  

  6. **Requirement: Diachronic Agency**  
     - **Motivating Constraint**: The theory must treat agents as temporally extended entities, not atomistic time-slices. Motivates binding as intrapersonal cooperation (e.g., Bratman).  
     - **Negotiable?**: **Maybe**. Synchronic approaches (e.g., some game-theoretic views) avoid diachronicity but struggle with identity.  
     - **Status**: **Contested**. Central to "planning" theories of agency but rejected by hardcore causalists.  

  7. **Requirement: Causal Decision Theory (CDT) Compatibility**  
     - **Formal Constraint**: Acts must be evaluated by causal efficacy (e.g., dominance, counterfactuals). Self-binding must not require evidentialist reasoning (e.g., Newcomb-like correlations).  
     - **Negotiable?**: **For CDT advocates, no; others, yes**. CDT is dominant but not uncontested.  
     - **Status**: **Contested**. Evidentialists (e.g., Arntzenius) argue CDT fails self-binding; causalists (e.g., Lewis) disagree.  

  8. **Requirement: Non-Circular Costly Signalling**  
     - **Motivating Case**: If binding relies on costly signals (e.g., burning money to prove commitment), the signal’s cost must not presuppose future compliance (e.g., why burn money if you plan to renege?). Signals must be credible without bootstrapping.  
     - **Negotiable?**: **No**. Circularity voids explanatory power.  
     - **Status**: **Settled** as a problem; solutions are contested.  

  ---

  #### **Joint Unsatisfiability**  
  The subset **{Resolution of Parfit’s Hitchhiker, Dynamic Consistency, CDT Compatibility}** is **jointly unsatisfiable**:  
  - **Why**: In Parfit’s Hitchhiker, CDT at \(t_1\) (post-rescue) dictates not paying (no causal benefit), violating dynamic consistency with the \(t_0\) commitment. To resolve the hitchhiker, one must abandon either dynamic consistency (allowing resolute commitment) or CDT (e.g., using evidential reasoning). Orthodox CDT thus dismisses self-binding as irrational; revisionists reject CDT or dynamic consistency.  

  ---

  #### **Analysis of Standard Approaches**  
  **1. Causal Decision Theoretic (CDT) Dismissal**  
     - **View**: Self-binding is irrational unless externally enforced. At action time, CDT maximises causally, so ex ante commitments are non-credible.  
     - **Desiderata Missed**:  
       - *Resolution of Parfit’s Hitchhiker*: Fails—CDT agents are never rescued.  
       - *Midnight Clause Compatibility*: Fails—midnight activation is irrational if noon defection is foreseen.  
       - *Robustness to Reverse Hitchhiker*: Fails—proof mechanisms are rejected if costly.  
     - **Verdict**: Treats self-binding as impossible or non-rational; solves nothing.  

  **2. Rational Precommitment as Costly Signalling**  
     - **View**: Binding works via signals (e.g., sunk costs) that credibly reveal type (e.g., "I will pay because I burned £10 to show I’m reliable").  
     - **Desiderata Missed**:  
       - *Non-Circular Costly Signalling*: Fails in one-off cases—signals lack credibility without repeated games or exogenous enforcement (e.g., why not burn £10 *and* renege?).  
       - *Midnight Clause Compatibility*: Fails—signalling at midnight is irrational if noon defection is optimal.  
       - *Diachronic Agency*: Often sidesteps—signalling reduces binding to external acts, not intrapersonal commitment.  
     - **Verdict**: Incomplete without auxiliary assumptions (e.g., innate honesty), violating self-containment.  

  ---

  #### **Settled vs. Contested Landscape**  
  - **Settled**:  
    - Self-binding theories *must* resolve Parfit’s Hitchhiker and avoid circularity (desiderata 1, 8).  
    - Orthodox CDT cannot handle self-binding without revision (desiderata 1, 3, 4).  
    - Costly signalling requires external scaffolding to avoid circularity.  
  - **Contested**:  
    - **Dynamic consistency**: Orthodox camps insist on it; revisionists (e.g., McClennen) argue for "resolute choice" violating it.  
    - **Diachronic agency**: Planning theorists (e.g., Bratman) demand it; game-theoretic approaches (e.g., Skyrms) avoid it.  
    - **CDT compatibility**: Causalists treat it as non-negotiable; evidentialists and functionalists reject it.  
    - **Independence axiom**: Debatable outside niche contexts (e.g., ambiguity).  

  ---

  ### **Summary Table**  
  | Requirement                          | Motivating Case or Constraint                                                                 | Negotiable?                 | Status                     |  
  |--------------------------------------|-----------------------------------------------------------------------------------------------|----------------------------|----------------------------|  
  | Resolution of Parfit’s Hitchhiker    | Original hitchhiker: commitment ensures rescue, but post-rescue defection dominates.          | No                         | Settled (essential)        |  
  | Robustness to Reverse Hitchhiker     | Proof of commitment (e.g., contract) must not undermine its own purpose.                      | No                         | Contested (mechanisms)     |  
  | Midnight Clause Compatibility        | Binding activation at t₀ must be rational despite foreseen regret at t₁.                      | No                         | Contested (solutions)      |  
  | Dynamic Consistency                  | Optimal plans at t₀ must remain optimal at t₁ given unchanged information.                    | Maybe (revisionists: no)   | Contested                  |  
  | Preservation of Independence Axiom   | Self-binding should not violate expected utility’s independence axiom.                        | Yes (camp preference)      | Contested                  |  
  | Diachronic Agency                    | Agents must be treated as temporally unified entities.                                        | Maybe (synchronic options) | Contested                  |  
  | Causal Decision Theory Compatibility | Self-binding must adhere to causal efficacy principles (e.g., no spurious correlations).      | For causalists: No         | Contested                  |  
  | Non-Circular Costly Signalling       | Costly signals (e.g., burning money) must not presuppose future compliance to be credible.    | No                         | Settled (problem)          |  

  ### **Conclusion**  
  No extant theory satisfies all desiderata. The triad **{Hitchhiker resolution, dynamic consistency, CDT compatibility}** is jointly unsatisfiable, forcing trade-offs. Orthodox CDT fails entirely; costly signalling fails without repeated interactions. Leading contenders (e.g., resolute choice, functionalist theories) relax dynamic consistency or CDT, but face objections. Genuine progress requires rethinking diachronic rationality or causal foundations—**this is where your PhD can bite**.
