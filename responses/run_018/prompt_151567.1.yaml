answer: |-
  ### Core Commitments of Exemplary Friction Framework  
  Moral learning from lives requires maintaining productive tension between:  
  (i) **Proximity**: The subject must be sufficiently relatable to engage learners' moral imagination.  
  (ii) **Irreducible Alterity**: The subject’s fundamental otherness and context must resist assimilation into the learner’s worldview.  
  (iii) **Narrative Openness**: The narrative must avoid definitive moral closure, inviting critical interrogation of the subject’s "goodness."  
  Hagiography collapses this tension by erasing alterity and imposing premature moral resolution.

  ---

  ### Decision Procedure: **Exemplary Friction Evaluation Protocol (EFEP)**  

  **Total Steps**: 3  
  **Value Judgment Steps**: [2, 3]  

  | Step | Question                                                                 | Sufficient Answer                                                                                                  | Action if YES                                                                 | Action if NO                                                                 | Flag   |
  |------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-----------------------------------------------------------------------------|--------|
  | 1    | Does the material **accurately depict contextual/historical factors** that make the subject’s choices *distinct* from the learners’ lived reality? | Specific, non-anachronistic details showing cultural, temporal, or experiential distance (e.g., societal norms, material constraints). | Proceed to Step 2.                                                            | **EXCLUDE**: Material flattens alterity, risking ethical solipsism.         | FACT   |
  | 2    | Does the material **explicitly acknowledge unresolved moral tensions** in the subject’s life (e.g., failures, ambiguities, or ongoing debates about their legacy)? | Direct references to documented flaws, contested actions, or open-ended questions about virtue (e.g., "While celebrated for X, Y action remains controversial"). | Proceed to Step 3.                                                            | **PROCEED WITH FRAMING CONDITIONS**: Require supplementary resources to restore openness (e.g., debate prompts, counter-narratives). | VALUE  |
  | 3    | Could learners **reasonably identify aspirational traits** in the subject *without* implying their life is wholly imitable? | Traits are presented as contextually bound and ethically complex (e.g., "Her perseverance amid injustice" vs. "She was a perfect hero"). | **PROCEED WITH FRAMING CONDITIONS**: Use facilitation to sustain alterity/openness (e.g., comparative analysis). | **HAND TO COORDINATOR**: Proximity is unworkably low; value judgment required on pedagogical viability. | VALUE  |

  **Terminal Verdicts**:  
  - **EXCLUDE**: Fails Step 1 (irreducible alterity not established).  
  - **PROCEED WITH FRAMING CONDITIONS**: Passes all steps but needs pedagogical scaffolding.  
  - **HAND TO COORDINATOR**: Fails Step 3 (proximity insufficient; requires coordinator’s discretion).  

  ---

  ### Application to Cases  

  | Case | Procedure Verdict               | Decisive Step | Judgment Override Required? (Reason)                          |  
  |------|---------------------------------|---------------|--------------------------------------------------------------|  
  | 1    | **EXCLUDE**                     | Step 1        | No (Omits documented failures; collapses alterity and openness). |  
  | 2    | **PROCEED WITH FRAMING CONDITIONS** | Step 3        | No (Cruelty acknowledged, but proximity achievable via contextual framing). |  
  | 3    | **HAND TO COORDINATOR**         | Step 3        | **Yes** (Lacks openness but community support demands value-based override). |  

  **Case Analysis Notes**:  
  - **Case 1**: Step 1 fails—sanitized narrative negates alterity. Automatic exclusion.  
  - **Case 2**: Passes Steps 1–2 (alterity via contextual cruelty, openness via "warts"), but Step 3 flags need for framing (e.g., "Does genius excuse abuse?" debates).  
  - **Case 3**: Passes Step 1 (local context establishes alterity) but fails Step 2 (no openness). Step 3 requires coordinator’s value judgment on whether community pressure justifies overriding pedagogical principles.  

  ---

  ### Explicit Limitations  
  The protocol **cannot**:  
  1. **Define threshold moral failures** (e.g., whether a subject’s racism/abuse is disqualifying)—this remains a value-laden curriculum decision.  
  2. **Resolve community/pedagogical conflicts**—when stakeholders demand hagiography (Case 3), EFEP flags but cannot resolve the tension.  
  3. **Calibrate proximity for age/development**—e.g., adolescent vs. senior learners may need distinct exemplars; this requires coordinator expertise.  

