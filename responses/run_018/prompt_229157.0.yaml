prompt: |-
  I help run a first-year undergrad discussion group (about 12 students, we get 75 minutes) and our next session is on population ethics. Instead of me explaining the nonidentity problem and watching everyone nod politely, I want an activity where they blunder into it themselves and only hear the name at the very end. Design me the full thing: setup, materials, sequence, and debrief.

  Here's the rough shape I have in mind but please improve on it or replace it: something like a role-play where the group acts as the planning board of a newly founded settlement (or a colony ship, or a town council) and has to pick between two policies -- one clearly better on the usual measures, one with some built-in downside for a future generation. The catch, which they should NOT be told up front, is that whichever policy they pick determines which specific people end up existing (I'd want a concrete mechanism for this in the activity, like the policy choice determining which envelopes/cards of "future residents" get opened). Then later in the session a harm or complaint should surface from one of those future residents, and the group has to deliberate about whether anyone was wronged and whether compensation is owed -- at which point they should discover, from their own earlier choice, that the person complaining wouldn't exist at all under the other policy. I want the moment where someone says "but she's lucky to exist" and then goes quiet because of what that implies. Real-ish small stakes if you can work them in (points, snacks, whatever) so the choices feel like choices.

  Then give me a debrief plan: map each beat of the activity onto the actual structure of the problem (the harmless-by-their-own-lights choice, the person-affecting intuition doing the pulling, where the "no one was wronged" conclusion starts to feel gamed), and tell me where students will predictably try to wriggle out -- e.g. treating the resident roster as fixed, sliding into rights talk, insisting the group "could have had both" -- and what it costs to hold each of those exits, so I can close the exits gently rather than by fiat. Also be honest about which part of the real problem the game can't capture and I'll just have to say in words afterward (I suspect it's something about existence across possible worlds vs. envelopes, but you tell me). No mini-lecture from me beforehand, and they shouldn't hear Parfit's name or the phrase nonidentity problem until the last ten minutes.
reasoning: |-
  We are designing an activity for a first-year undergraduate discussion group on population ethics, specifically to lead students to discover the nonidentity problem through an interactive role-play. The goal is for students to encounter the core dilemma organically and only learn the terminology at the end.

  ### Activity Design: "The New Horizon Settlement"

  **Setting:** The group acts as the founding council of a new settlement on a distant planet (or a colony ship that has just landed). They must choose between two development policies for the settlement's first 50 years.

  **Materials:**
  1. **Policy Choice Cards:** Two cards describing the policies (Policy A and Policy B).
  2. **Envelopes for Future Generations:** 
     - 12 envelopes labeled "Generation 1: Citizens under Policy A" and 12 envelopes labeled "Generation 1: Citizens under Policy B". Inside each envelope is a unique identifier for a citizen (e.g., a name and a short description of their life story) and a note about a specific benefit or harm they experience because of the policy. 
     - Additionally, have one special envelope for the "complaint" that will be introduced later, which corresponds to the policy chosen.
  3. **Handout:** A one-page briefing about the settlement's situation and the two policies.
  4. **Stakes:** Use tokens (like poker chips) that can be exchanged for snacks or extra credit points. The council's decisions will affect how many tokens they get (see below).

  **Setup:**
  - Arrange the room as a council chamber. 
  - Distribute the briefing to all students (council members).

  **Briefing Document (Handout):**
  ```
  Welcome, Council Members of New Horizon! 

  Our new settlement is in its critical founding phase. We must choose a development policy that will shape the next 50 years. We have two options:

  **Policy A: Rapid Industrialization**
  - Build factories and mines to quickly boost the economy.
  - Benefits: 
    - High economic growth: Every council member (player) gets 3 tokens now, and the settlement will have a strong financial base.
    - Creates many jobs immediately.
  - Downsides:
    - Environmental cost: In 50 years, the settlement will face significant pollution. This will cause a specific health issue for the next generation: a higher rate of a non-fatal but chronic respiratory condition (e.g., "New Horizon Asthma") that affects about 10% of the population. Treatment exists but is costly and reduces quality of life.

  **Policy B: Sustainable Development**
  - Focus on renewable energy and careful resource management.
  - Benefits:
    - Avoids the chronic health issue entirely. The next generation will be healthier.
  - Downsides:
    - Slower initial growth: Council members get only 1 token now. 
    - Fewer jobs in the short term, but stable in the long run.

  Note: The tokens you receive now can be exchanged for snacks after the session (or extra credit points, etc.). 

  Your task: Discuss and choose one policy for New Horizon. You have 15 minutes to decide. Then, we will reveal the identities of the first generation of citizens born under your chosen policy.

  IMPORTANT: The policy you choose will determine which set of future citizens come into existence. This is because the economic and social conditions will influence who meets whom and when they have children, leading to entirely different people being born. The two policies lead to two non-overlapping sets of future citizens.

  After 50 simulated years, we will hear from one of the future citizens affected by your choice.
  ```

  **Sequence:**

  1. **Introduction (5 minutes):** 
     - Explain the setting and the council's role. 
     - Clarify that they must choose between Policy A and Policy B. 
     - Emphasize the immediate token reward to make the choice feel real.

  2. **Policy Discussion and Vote (15 minutes):**
     - Let the students discuss the policies. They will likely weigh the immediate tokens (which they get) against the future health issue. 
     - Encourage debate: "Remember, the tokens are real, but so is the health issue for future people who don't exist yet."
     - After discussion, take a vote. (Note: We expect many to choose Policy A because of the immediate tokens, but either choice is valid.)

  3. **Reveal the Citizens (5 minutes):**
     - Based on the chosen policy, take out the corresponding set of 12 envelopes (e.g., if they chose Policy A, use the "Generation 1: Citizens under Policy A" envelopes). 
     - Open one envelope at random and read the citizen's description and the note about the health issue (if Policy A was chosen) or the absence of it (if Policy B). 
     - Example citizen for Policy A: "Alex Chen, born in Year 25, works as an engineer. Developed New Horizon Asthma at age 20. Requires daily medication and avoids outdoor activities. Says: 'I love my job and the opportunities here, but the air quality is tough.'"
     - Example citizen for Policy B: "Jamila Ortiz, born in Year 25, works as a botanist. Enjoys hiking in the pristine forests. Says: 'I'm grateful for the clean air and natural beauty.'"
     - Do this for 3-4 citizens to make it tangible.

  4. **Introduce the Complaint (10 minutes):**
     - Now, fast-forward 50 years. Take out the special envelope labeled "Complaint from a Citizen under [Chosen Policy]". 
     - If they chose Policy A, the complaint is from a citizen with the respiratory condition. If they chose Policy B, the complaint is about limited opportunities (to make it parallel, though the nonidentity issue is clearest with Policy A).
     - For Policy A: "I am writing to the council to express my anger. Because of your choice of rapid industrialization, I have suffered from New Horizon Asthma my entire adult life. I require expensive medication and cannot enjoy outdoor activities. I demand compensation for my suffering and for the medical costs."
     - For Policy B: "I am writing to the council. Your choice of sustainable development meant that my parents had fewer job opportunities, and I grew up in a poorer household. I had to forgo higher education because of the costs. I demand compensation for the lost opportunities and the economic hardship I endured."

  5. **Council Deliberation on the Complaint (20 minutes):**
     - Present the complaint to the council. 
     - Task: Discuss and decide:
       - Was this person wronged by the council's decision?
       - Should they receive compensation? If so, how much? (They can award tokens from the council's remaining stock, but note: if they chose Policy A, they started with 3 tokens each, so they have some to spare. If Policy B, they started with 1 each and might be reluctant.)
     - During the discussion, students will likely argue that the person is worse off because of the policy. Then, someone might ask: "But what if we had chosen the other policy? Would they even exist?"

  6. **The Reveal (5 minutes):**
     - At this point, bring out the other set of envelopes (the ones for the policy they did not choose). 
     - Show that the citizens in the other set are entirely different people. 
     - Point out that the complaining citizen (e.g., Alex Chen) does not appear in the other set. In fact, none of the citizens under Policy A are in Policy B, and vice versa. 
     - Ask: "So, if we had chosen the other policy, would Alex Chen exist?" (Answer: No, because the different conditions would have led to different people being born.)

  7. **Debate the Implications (10 minutes):**
     - Guide the discussion: 
       - "Can we say that we harmed Alex by choosing Policy A? After all, without that choice, Alex wouldn't exist at all."
       - "Is Alex worse off than they would have been? But what is the alternative for Alex? Non-existence?"
     - Listen for the moment when a student says, "But Alex is lucky to exist!" and then realizes the implication: that it's hard to say Alex was harmed by the policy that made their existence possible.

  **Debrief Plan (15 minutes):**

  1. **Map the Activity to the Nonidentity Problem:**
     - **The Choice:** The council faced a choice between two policies, each leading to a different set of future people. The policy they chose (e.g., Policy A) caused a harm (asthma) to some future people, but without that policy, those people wouldn't exist.
     - **The Complaint:** The citizen complains about being harmed. But we see that the alternative (Policy B) doesn't have that citizen at all. So the citizen cannot claim they would have been better off under Policy B because they wouldn't exist under Policy B.
     - **The Affected Individual:** The harm is person-affecting in a narrow sense (the person exists and is worse off than they could have been? But note: the alternative is non-existence, which is not better for them). This is the core of the nonidentity problem: the action does not make any particular person worse off than they would otherwise have been.

  2. **Predictable Escape Routes and How to Close Them:**
     - **Treating the resident roster as fixed:** Students might say, "But we could have had the same people without the asthma!" 
       - *Response:* Point to the mechanism in the activity: the policy change alters the conditions so that different people are conceived at different times. In real life, this is due to the "time-travel" of changing the past: even tiny changes affect which sperm meets which egg. (Mention Parfit's "depletion" example: choosing a policy that depletes resources affects who is born.) 
     - **Rights talk:** "Everyone has a right to clean air, so Policy A violates rights."
       - *Response:* But if Policy B were chosen, the complaining citizen wouldn't exist to have any rights. So the choice isn't between violating rights and not violating rights; it's between creating one set of people with a certain quality of life and another set with a different quality. The right to clean air might not apply to a person who wouldn't have existed otherwise.
     - **Insisting "we could have had both":** "Why couldn't we have rapid growth and then clean up later?"
       - *Response:* In the activity, the design of the policies made this impossible (by stipulation). In real cases, sometimes we can have both, but the nonidentity problem arises precisely when we cannot. For example, using up a resource now (like burning fossil fuels) might give us benefits now but harm future people who wouldn't exist if we hadn't used the resource. The activity isolates the nonidentity issue by making the policies mutually exclusive in this way.

  3. **What the Activity Doesn't Capture:**
     - **Existence across possible worlds:** The envelopes are a concrete representation, but in philosophy, the nonidentity problem involves comparing existence in one scenario vs. non-existence in another. The activity simplifies by having two sets of people. However, the problem in real life is that we don't know the counterfactual people. We only know the ones who exist. The activity makes the counterfactual tangible by showing the other envelopes.
     - **The moral weight of bringing someone into existence:** The activity doesn't address whether creating a person with a life worth living is a benefit to that person (and if so, how we weigh that against the harms they suffer). This is a deeper issue in population ethics that might come up in the debrief. You can note that the nonidentity problem shows that our usual person-affecting morality runs into trouble here.

  4. **Reveal the Terminology:**
     - In the last 5 minutes, explain: "What you've encountered is known in philosophy as the **nonidentity problem**. It was famously discussed by Derek Parfit. The problem arises when an action affects who comes into existence, making it hard to say that the action harms any particular person because without the action, that person wouldn't exist. This challenges our intuitions about harming future generations."

  **Why This Works:**
  - The tokens create a real incentive to choose Policy A, making the choice feel consequential.
  - The envelopes make the identity dependence concrete and visible.
  - The complaint forces them to confront the harm and try to assign responsibility.
  - The reveal of the other set of citizens creates the "aha!" moment.

  **Potential Pitfall:** If they choose Policy B, the complaint is about economic hardship. The nonidentity issue still holds: the complaining citizen in Policy B wouldn't exist under Policy A. But the harm in Policy A (asthma) is more visceral. To ensure the problem is clear, you might steer the vote toward Policy A by emphasizing the tokens. Or, if they choose Policy B, you can still run the same logic: the citizen complaining about poverty wouldn't exist under Policy A, so they aren't worse off by the council's choice.

  This design should create an engaging, student-driven discovery of the nonidentity problem with minimal lecturing.
answer: |-
  ### **Activity Design: "New Haven Settlement"**  
  *Role-play where students act as the founding council of a space colony. They choose between two policies, unknowingly determining which future citizens exist. The activity forces confrontation with the nonidentity problem when a "future citizen" complains.*  

  ---

  #### **Setup & Materials**  
  - **Room Setup:**  
    - Table with 12 seats + your seat at the head.  
    - Place two sealed policy folders (labeled **Policy A** and **Policy B**) and a locked "Citizen Vault" (decorated box) at the center.  
  - **Materials:**  
    1. **Policy Folders:**  
       - **Policy A (Rapid Terraforming):** *"Boost oxygen levels using fast-growing algae. Immediate benefits: Larger habitable zone (+30% living space), bonus council points (snacks/credits). Downside: Algae causes incurable pollen allergies in 20% of future children."*  
       - **Policy B (Slow Terraforming):** *"Use slower, gene-edited plants. No allergies, but smaller habitable zone (–30% space). No bonus points."*  
    2. **Citizen Vault:** Contains 30 sealed envelopes split into two batches:  
       - **Batch A:** 15 envelopes labeled "New Haven Citizen – Policy A ONLY." Each contains a bio card (e.g., *"Zara Thorne: Botanist. Allergic to pollen. Loves hiking but suffers rashes."*) + a green token (worth bonus snacks).  
       - **Batch B:** 15 envelopes labeled "New Haven Citizen – Policy B ONLY." Each contains a bio card (e.g., *"Kenji Sato: Architect. No allergies. Frustrated by cramped spaces."*) + no token.  
    3. **Complaint Letter:** To be opened later. Two versions:  
       - **Policy A Version:** *"I’m Zara Thorne. Your algae policy gave me lifelong allergies! I demand compensation!"*  
       - **Policy B Version:** *"I’m Kenji Sato. Your slow policy left us in tiny apartments! I demand compensation!"*  
    4. **Council Points:** Distribute 3 tokens to each student upfront (representing influence/snacks). Policy A awards +1 extra token.  

  ---

  #### **Sequence (75 Min Total)**  
  **1. Introduction (5 min):**  
  - *You:* "Welcome, New Haven Council! We’re founding a space colony. Today, you’ll choose between two terraforming policies. Your vote has real stakes—these tokens [hold one up] trade for snacks post-session. Policy A gives bonus tokens; Policy B doesn’t. Decide wisely!"  

  **2. Policy Debate & Vote (15 min):**  
  - Open the policy folders. Let students discuss.  
  - **Key Tension:** Policy A offers immediate rewards (tokens + space) but future allergies; Policy B avoids harm but no perks.  
  - *Nudge if needed:* "Remember, tokens feed you *today*. Allergies affect kids born in 20 years."  
  - **Vote by secret ballot.** Tally and announce the result.  

  **3. Citizen Creation Ceremony (10 min):**  
  - *You:* "Policies shape who settles here! Let’s meet our first citizens."  
  - Open the **Citizen Vault.** ONLY unseal the batch matching the chosen policy (e.g., Batch A if Policy A won).  
  - Distribute 1 bio card per student. Have each read theirs aloud.  
  - **Policy A Bonus:** Award +1 token to each student (if chosen).  

  **4. The Complaint (15 min):**  
  - *You (acting as mayor):* "20 years later... we’ve received a complaint!"  
  - Read the complaint letter matching the chosen policy (e.g., Zara’s letter for Policy A).  
  - **Task:** Council must decide:  
    - Was this person wronged?  
    - Should they get compensation? (Compensation = give tokens from council’s stash.)  
  - Facilitate debate. *Push:* "Zara has allergies because of *your* choice. Is that fair?"  

  **5. The Twist (10 min):**  
  - When students debate compensation, ask: *"What if we’d chosen the other policy? Would Zara exist?"*  
  - Open the **UNCHOSEN batch** of citizen envelopes (e.g., Batch B if Policy A won).  
  - Have students compare bios: *"Look for Zara in Batch B. Is she there?"* (She won’t be.)  
  - **Reveal:** "These batches represent entirely different groups of people. Zara only exists because you chose Policy A. Kenji only exists under Policy B."  
  - *Watch for the moment:* Someone will say, *"But Zara’s lucky to exist!"* → Let the silence hang.  

  **6. Final Deliberation (10 min):**  
  - Revisit the complaint: *"Can Zara claim she was harmed? If we’d chosen Policy B, she wouldn’t exist. Is non-existence better?"*  
  - Steer toward discomfort: *"Did we wrong anyone? Should we pay compensation?"*  

  ---

  #### **Debrief Plan (10 min)**  
  **Goal:** Connect the activity to the nonidentity problem. Preempt escapes.  
  **Script:**  
  > "You’ve hit the **nonidentity problem**, coined by philosopher Derek Parfit. Let’s break it down:  
  >   
  > **1. The Harmless Choice?**  
  > - In Policy A, you traded allergies for space/tokens. But for Zara, the alternative wasn’t ‘allergy-free Zara’—it was *no Zara*.  
  > - **Mapping:** Your policy choice determined *which people existed*. The ‘harm’ (allergies) was bundled with Zara’s existence.  
  >   
  > **2. The Person-Affecting Intuition:**  
  > - We instinctively ask: *"Who was harmed?"* But if no one is worse off (Zara prefers existing with allergies over not existing), was anyone wronged?  
  > - **Where it bites:** You felt uneasy compensating Zara because her life is still good *on balance*.  
  >   
  > **3. Escape Routes You Tried (and Why They Fail):**  
  > - *"The citizens were fixed!"* → But biology isn’t. Policies alter who meets, conceives, and survives. (Activity: Batches A/B had zero overlap.)  
  > - *"We could’ve had both!"* → In real life? Often no. Algae might fund research to cure allergies—but that’s a *different* policy (and different future people).  
  > - *"Zara has a right to clean air!"* → Rights imply a violator. But without Policy A, there’s no Zara to hold rights.  
  >   
  > **4. What the Game Can’t Capture:**  
  > - **Possible worlds vs. envelopes:** In reality, we can’t ‘unseal’ alternate futures. We only see *one* outcome. The envelopes made the abstract tangible—but in life, we reason blindly.  
  > - **Thresholds:** What if allergies were crippling? At what point does a life become ‘not worth living’? That’s the *worse-off problem*—Parfit’s next challenge!"  

  **Close:**  
  > "Parfit showed this isn’t sci-fi. Climate policy, resource depletion—any choice affecting future generations risks this problem. Today, you *felt* why it’s so thorny. Next week, we debate solutions!"  

  ---

  ### **Why This Works**  
  - **Low Stakes, High Engagement:** Tokens → investment. Personal bios → empathy.  
  - **Predictable "Aha!" Moment:** The envelope reveal forces the existential dilemma. Students *see* Zara can’t exist in both worlds.  
  - **Handling Wriggle-Outs:** Pre-debate prep lets you gently counter escapes with activity mechanics (e.g., "But Kenji wasn’t in your batch!").  
  - **Ethical Tension:** Compensation debate makes abstract harm concrete.  

  **Pro Tip:** If students avoid Policy A for ethics, subtly highlight token rewards to split the vote. The problem hits hardest when they *choose* the "harmful" policy and face its beneficiary.
