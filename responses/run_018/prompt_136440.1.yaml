answer: |-
  Your convergence thesis fundamentally misunderstands consequentialism's architecture. Culpability constrains punishment *not* because desert has intrinsic moral weight, but because it’s a critical *predictor variable* in the welfare calculus. Severity calibrated to culpability maximizes deterrence efficiency—under-punishing the highly culpable invites reckless offending, while over-punishing the minimally culpable wastes resources and breeds resentment that undermines social order. This isn't a concession; it's the *mechanism* of consequentialism. Your imagined scenario of a "severely culpable agent" where punishment obstructs restoration is empirically implausible—systematically sparing the worst offenders would catastrophically erode deterrence and normative expectations, *causing* more harm than it repairs. Consequentialism's proportionality isn’t arbitrary; it’s rigorously tied to *evidence* about what secures long-term welfare. You mistake heuristic for foundation: desert is scaffolding we use *because* it serves consequences, not an independent pillar. When you claim convergence, you smuggle in desert’s normative force through the back door while we derive all constraints from forward-looking necessity. Why ground constraints in a moral fiction when observable social dynamics suffice?

