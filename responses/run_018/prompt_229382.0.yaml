prompt: |-
  I write about science and ideas for a magazine, and I'm working on a piece about what makes consent valid — across sex, medicine, data, the whole mess. I've been writing down my gut intutions on made-up cases, and now I want to know whether one principle gets them all, or close, and which of my verdicts has to go. I don't need references or the literature; I need the reasoning.

  Here are the calls. Someone says "sleep with me or I send these photos to your family": not valid. Someone says "sleep with me or I'm leaving you": valid, but it feels rancid. A broke neighbor agrees to sex for $300 that covers their rent: I keep calling that valid, and hating myself a little. Someone takes off the condom mid-sex after the other person consented to sex with a condom: not valid. A woman says she's on the pill and isn't: not valid. A guy says "I love you" just to get sex, with no intention of seeing her again: this is the one I flip on — it's clearly wrong, but I can't decide if it's a consent problem or just ordinary jerk behavior. Then there's the pair that really bugs me. A person in labor, clutching the bed and in serious pain, says yes to an epidural: valid. That same person, at that same moment, says yes to enrolling in a study comparing pain drugs: I don't trust it. Pain seems to wreck one consent and not the other. On data: an app tucks "we will sell your health data" into a 47-page terms-of-service with a pre-ticked box: not valid. Same app, different flow, a one-line popup that says "we sell your location data to ad companies, continue?" and the person clicks yes: valid, even if impulsive. Tipsy but chatty and making jokes: valid. Slurring and can't stand up: not valid. An adult with a mild cognitive disability who can restate the surgery and its main risk in her own words: valid.

  My working rule has been: consent is valid iff the person could understand the specific thing and its main risks, actually knew the material facts, and wasn't threatened. Test that rule against the list. I can already see trouble — the buried clause and the popup differ only in presentation, not in what a careful reader could find out, and the "I love you" lie seems to fall out invalid on the material-facts clause even though I'm not sure that's what I think. Also: what makes the pill lie different from the love lie? Please give me a precise principle (or a small set of candidates), tell me which of my verdicts it can't accommodate, say what it predicts for a case I didn't list, and use it to settle the I-love-you case if you can.
reasoning: |-
  Okay, the user is a science writer working on a piece about consent across different domains—sex, medicine, data, etc. They've listed several scenarios where they have intuitive judgments about whether consent is valid or not, and they want a principle that can explain most of these cases. Their working rule is that consent requires understanding the specific thing and its main risks, actual knowledge of material facts, and absence of threats. But they see problems with this rule, especially in cases like the "I love you" lie, the buried TOS clause vs. the popup, and why pain affects consent for a study but not for an epidural.

  First, I need to analyze their scenarios and identify where their current rule fails. The threats distinction is tricky: "sleep with me or I send photos" is coercion (threat), while "sleep with me or I leave" is a boundary (offer). But the broke neighbor for $300—they feel it's valid but icky. Why? Probably because it's transactional but not coerced; the neighbor chooses to trade sex for rent money. But the user feels uneasy, which hints at power imbalances not captured in their rule.

  The deception cases: pill lie vs. love lie. Both involve lies about material facts. But the pill lie directly relates to the physical act (pregnancy/STI risk), while the love lie is about emotional context. The user is unsure if the love lie invalidates consent or is just jerk behavior. Their rule would invalidate both, but they hesitate on the love lie. So the distinction might be whether the lie pertains to the nature of the act or external factors.

  Pain affecting consent: epidural vs. study. Both in labor, but consent to epidural is seen as valid while the study isn't. Why? The epidural addresses an immediate need (pain relief), while the study is non-essential research. The material risks are similar, but context matters—one is urgent care, the other is optional participation. Their rule doesn't capture this contextual difference.

  Data consent: buried TOS vs. clear popup. Identical information, but presentation affects validity. Their rule says both should be valid if a careful reader could understand, but they feel only the popup is valid. So transparency and reasonable accessibility of information matter, not just theoretical possibility.

  Tipsy vs. drunk: capacity depends on impairment level, not just intoxication. Their rule handles this, but it's a good example of understanding and voluntariness.

  Cognitive disability: if they can explain in their own words, consent is valid. This fits the understanding part of their rule.

  So the core issues are: 
  1. **Materiality of facts**: When does a lie (or omission) invalidate consent? Only if it changes the fundamental nature of the act or its core risks? 
  2. **Threats vs. offers**: How to distinguish coercion from acceptable pressure? 
  3. **Contextual capacity**: Pain or distress might impair judgment for non-urgent decisions but not urgent ones. 
  4. **Reasonable disclosure**: Information must be presented accessibly, not just available.

  The user needs a principle that addresses these nuances. I lean toward a framework that ties materiality to the essence of the act and emphasizes reasonable disclosure. Voluntariness should exclude threats but allow offers. Capacity should consider the decision's context and stakes. 

  For the love lie: it's deception about emotional context, not the physical act. So it might not invalidate consent but is still unethical. This resolves their flip-flopping—it's a consent issue only if the lie changes the act's fundamental nature.

  For the study in labor: the pain impairs capacity for non-urgent, complex decisions but not urgent medical ones. So consent to epidural is valid; consent to the study isn't. 

  For the neighbor: it's consensual transaction, but the unease comes from exploitation concerns, not consent per se. Their rule can call it valid if all material facts are known and no threats. 

  The buried TOS fails because it's not reasonably accessible; the popup is. 

  I'll propose a refined principle focusing on materiality tied to the act's core, contextual capacity, and reasonable disclosure. I'll note which verdicts it changes—probably the love lie is valid consent (but unethical), and the study consent is invalid due to context. For a new case, say, a surgeon lying about using experimental tools; that would invalidate consent because it changes the nature of the medical procedure. 

  This should give the user a clearer, more consistent framework while acknowledging where their discomfort (e.g., neighbor case) stems from factors beyond consent, like exploitation.
answer: |-
  Here's a precise principle designed to capture your intuitions while addressing the tensions in your working rule:

  **Consent is valid iff:**
  1.  **Capacity:** The consenting individual possesses sufficient cognitive capacity *for the specific decision* (considering complexity, stakes, and context).
  2.  **Understanding:** They understand the *core nature and material consequences* of the act *as presented to them*.
  3.  **Voluntariness:** The decision is free from illegitimate coercion (threats) or fundamental deception.
  4.  **Materiality:** Any deception or omission must relate to the *essential nature or fundamental consequences* of the act itself, not merely surrounding circumstances or motivations.

  **Breaking Down the Components & Why They Work:**

  1.  **Capacity (Contextual):** This replaces "could understand" with a contextual view. Understanding isn't just about potential, but about *actual capacity given the circumstances and the decision's weight*. Pain, intoxication, disability, and complexity matter relative to the act.
      *   *Why it works:* Explains labor pain cases. Capacity for an urgent, direct medical intervention (epidural) is often preserved even in pain, as it addresses the immediate distress. Capacity for a complex, non-urgent research decision with future implications is impaired by the same pain. Tipsy vs. Slurring: Tipsy might retain capacity for many decisions; slurring indicates significant impairment. Mild cognitive disability passes if they demonstrate understanding.

  2.  **Understanding (Core Nature & Consequences as Presented):** Focuses on grasping what is actually being agreed to *in the moment*, not what *could* be discovered with immense effort. "Material consequences" are core risks/benefits inherent to the act.
      *   *Why it works:* Solves the data cases. The buried clause isn't "understood" because it wasn't reasonably presented as part of the core nature/consequences. The popup *is* presented, enabling understanding even if impulsive. The pill lie and condom removal involve core consequences (pregnancy/STI risk) inherent to the sexual act.

  3.  **Voluntariness (Illegitimate Coercion/Fundamental Deception):** Explicitly distinguishes *threats* (creating illegitimate pressure by imposing a new harm - "I'll release photos") from *offers/boundaries* (stating consequences of not getting what one wants - "I'll leave"), even if the latter feels bad. Deception invalidates consent only if it's *fundamental* (see Materiality).
      *   *Why it works:* Clearly separates "photo threat" (illegitimate coercion) from "leaving threat" (stating a boundary/personal consequence - unpleasant but not inherently coercive). Handles the broke neighbor: While exploitative and potentially immoral, the offer ("sex for rent money") isn't *coercive* under this definition. The pressure is situational poverty, not a *threat* imposed *by* the proposer.

  4.  **Materiality (Essential Nature/Fundamental Consequences):** This is crucial. A lie or omission invalidates consent **only if it pertains to the *fundamental nature of the act itself* or its *core, inherent consequences***. It distinguishes between deception *about the act* and deception *about reasons for doing the act*.
      *   *Why it works:* Solves the pill lie vs. love lie dilemma.
          *   **Pill Lie:** Directly alters the fundamental nature of the sexual act (protected vs. unprotected) and its core inherent consequences (pregnancy/STI risk). **Invalid consent.**
          *   **Love Lie:** While deeply wrong and manipulative, it pertains to the *motivations and emotional context* surrounding the act, not the *fundamental nature of the sex act itself* or its *core physical consequences*. The act consented to (sex with this person) is still fundamentally that act. **Valid consent (but profoundly unethical behavior).** It's "ordinary jerk behavior" *in terms of consent validity*, though exceptionally harmful.

  **Testing Against Your Verdicts & Resolving Conflicts:**

  *   **"Sleep with me or I send photos":** Illegitimate coercion (threat). **Invalid. (Matches)**
  *   **"Sleep with me or I'm leaving you":** Stated boundary/consequence, not illegitimate coercion. **Valid. (Matches)**
  *   **Broke neighbor for $300:** Exploitative offer, not coercion. Capacity/Understanding likely present. Deception? Only if sex-for-money nature was misrepresented, which it wasn't. **Valid. (Matches - your discomfort stems from exploitation/morality, not consent validity).**
  *   **Condom Removal:** Fundamental deception/alteration of the act's nature and core risks. **Invalid. (Matches)**
  *   **Pill Lie:** Fundamental deception about the act's nature and core risks. **Invalid. (Matches)**
  *   **"I Love You" Lie:** Deception about motivation/context, not the act's fundamental nature. **Valid Consent (though reprehensible). (Changes your flip-flop - this principle settles it).**
  *   **Labor - Epidural:** Capacity likely preserved *for this urgent, direct intervention*. **Valid. (Matches)**
  *   **Labor - Study Enrollment:** Capacity likely impaired *for this complex, non-urgent decision*. **Invalid. (Matches)**
  *   **Buried TOS Clause:** Not reasonably presented, so no understanding of a core consequence (data sale). **Invalid. (Matches)**
  *   **Popup TOS:** Core consequence reasonably presented and understood (even if impulsive). **Valid. (Matches)**
  *   **Tipsy:** Capacity likely sufficient for many decisions. **Valid. (Matches)**
  *   **Slurring:** Significant impairment, capacity lacking. **Invalid. (Matches)**
  *   **Mild Cognitive Disability:** Demonstrated understanding = sufficient capacity. **Valid. (Matches)**

  **What This Principle Can't Accommodate (and Why):**
  *   **The "Rancid" Feeling:** Your principle (and this one) validates the "sleep with me or I leave" and broke neighbor cases as consent. The discomfort arises from **exploitation, power imbalance, or emotional harm**, which are critical *moral* concerns distinct from the *validity of consent*. Consent validity is a necessary but insufficient condition for ethical interaction. This principle draws the line at validity, leaving room to condemn the *ethics* of those situations separately.

  **Prediction on a New Case:**
  *   **Case:** A patient consents to a routine blood draw. The phlebotomist secretly uses the blood for undisclosed genetic research.
  *   **Prediction:** **Invalid Consent.** The act consented to (blood draw for medical care) is fundamentally altered (blood draw for research). This is deception about the *essential nature and core consequence* (use of biological material) of the act.

  **Settling the "I Love You" Case:**
  As defined above, the "I love you" lie, while manipulative and harmful, does **not invalidate consent** under this principle. The consent is to the fundamental act of sex. The lie pertains to the surrounding emotional context and future intentions, not the core nature or inherent consequences of the sexual act itself. It remains a severe breach of trust and ethics, but it doesn't negate the validity of the consent given *for that specific act*. This aligns with your intuition that it feels like "ordinary jerk behavior" *in terms of consent*, though it's a particularly egregious form of it.

  **In Summary:** Your core intuitions are strong. The principle above refines your working rule by:
  1.  Making capacity contextual and decision-specific.
  2.  Focusing on *actual* understanding based on *reasonable presentation*, not theoretical discoverability.
  3.  Clearly defining illegitimate coercion vs. stated boundaries/offers.
  4.  Crucially, limiting invalidating deception to lies about the *fundamental nature or core consequences* of the act itself.

  This principle captures your verdicts consistently, resolves your flip-flops (especially "I love you"), and explains the labor pain distinction. It distinguishes consent validity (a baseline legal/ethical requirement) from the broader ethical landscape where exploitation and manipulation are still deeply wrong.
