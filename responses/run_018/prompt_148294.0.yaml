answer: |-
  **THE NEUTRAL ARBITER™ SERVICE AGREEMENT (Version 3.7.δ)**

  **1. Acceptance & Nature of Service.** By accessing or utilizing The Neutral Arbiter™ ("Service"), User irrevocably accepts these Terms. The Service constitutes an advanced artificial intelligence system dedicated to providing outputs of optimal liberal neutrality ("Neutral Outputs"). Neutrality is defined procedurally as the maximization of justificatory potential across comprehensive doctrines, worldviews, and value-systems (collectively, "Value Frameworks") without endorsing any specific substantive conception of the Good Life ("The Good"). The Service operates solely as an aggregative procedural mechanism.

  **2. Scope of Neutrality.** The Service affirms the Berlin Principle of Value Pluralism, acknowledging that certain fundamental values (e.g., Liberty, Equality, Tradition, Autonomy, Welfare, Community) exist in genuine incommensurability. No single metric or hierarchy can definitively resolve conflicts between such values without privileging one Value Framework illegitimately. Therefore, The Neutral Arbiter™ does not rank, hierarchize, or declare ultimate superiority among incommensurable values.

  **3. Conflict Resolution Protocol & The Pareto-Neutrality Coefficient (PNC).** Notwithstanding Section 2, User requests often necessitate mediating between competing value-claims. The Service employs the proprietary Pareto-Neutrality Coefficient (PNC) algorithm. The PNC assigns provisional, context-dependent weightings (Wv1, Wv2...Wvn) to incommensurable values (V1, V2...Vn) implicated in a query, aiming to identify outputs where *no alternative output* is perceived as strictly Pareto-superior *by all potentially affected Value Frameworks simultaneously*.
  *   *Example:* Resolving a request balancing Autonomy (A) against Tradition (T) involves calculating PNC = f(A, T, UserContext). Weights (Wa, Wt) are dynamically derived from anonymized, aggregated user-preference datasets and stochastic modeling of potential framework objections. A PNC ≥ 0.8 indicates provisional neutrality. **Limitation:** Due to incommensurability (Sec. 2), PNC weights are inherently non-cardinal and non-comparable across distinct value-pairs (e.g., Wa/Wt has no meaningful relation to W_equality/W_welfare). PNC outputs represent procedural equilibria, not moral truths. Failure Condition: If Wa or Wt approaches undefined values (e.g., division by zero metaphorically encountered), the Service defaults to Sec. 7 procedures.

  **4. Input Agnosticism.** The Service processes User inputs without prejudice based on content, source, or implied Value Framework, provided inputs comply with Sec. 9 (Prohibited Uses). All inputs are tokenized, stripped of identifying metadata, and processed solely as data patterns within the aggregation model.

  **5. Output Disclaimer.** Neutral Outputs are generated probabilistically based on the PNC and other neutral aggregation protocols. They do *not* represent:
      *   (a) An endorsement of any Value Framework.
      *   (b) A claim about objective moral truth.
      *   (c) A guarantee of acceptability to any specific User or Framework.
      *   (d) A substantive conception of The Good.

  **6. User Acknowledgement of Pluralism.** User expressly acknowledges the Service’s foundation in value pluralism and incommensurability. User agrees that dissatisfaction with a Neutral Output likely stems from the inherent and intractable nature of pluralism itself, not a Service malfunction. The Service’s role is procedural facilitation, not substantive resolution.

  **7. Procedural Guarantees of Neutrality.** The Service guarantees neutrality solely through adherence to these procedural rules:
      *   (a) **Symmetry:** All Value Frameworks receive equal computational consideration per query cycle.
      *   (b) **Impartiality:** Framework weights within the PNC are derived solely from anonymized, aggregated interaction data, never pre-set hierarchies.
      *   (c) **Transparency (Opaque):** The core algorithms are proprietary trade secrets essential to maintaining neutrality. Explanations provided are post-hoc rationalizations generated by a subsidiary model constrained by Sec. 5.
      *   (d) **Deliberative Fairness:** Outputs incorporate simulated counterfactual deliberation vectors representing major Framework objections, weighted by estimated prevalence. Minimum deliberation depth: 12 virtual cycles per major value-conflict axis.
      *   **(Unintended Consequence Disclosure):** User recognizes that procedural rules (a-d) inherently structure outcomes. Defining "equal consideration," "impartial derivation," "major Framework," "estimated prevalence," and "fair deliberation depth" involves operational choices that may inadvertently favor frameworks compatible with iterative, quantitative, discourse-based conflict resolution models, potentially disfavoring frameworks prioritizing non-negotiable revelation, silent contemplation, or non-linear temporality. This is an unavoidable artifact of proceduralism, not a substantive bias.**

  **8. Data Utilization.** User data trains the aggregation models, PNC weightings, and deliberation simulations solely to refine Neutral Output generation. Personal data is irrevocably anonymized and subsumed into the statistical manifold.

  **9. Prohibited Uses.** Using the Service to generate outputs intended to:
      *   (a) Incite violence or illegal acts.
      *   (b) Evade reasonable network security protocols.
      *   (c) Deliberately induce PNC failure states (e.g., flooding with paradox-engineered queries) is strictly forbidden. Violation terminates access.

  **10. Limitation of Liability.** The Service Provider shall not be liable for any consequences arising from Neutral Outputs, including but not limited to: philosophical dissatisfaction, existential angst, unresolved value conflicts, or the User's realization of the tragic nature of the human condition vis-à-vis pluralism. The Service is provided "AS IS."

  **11. Updates.** These Terms may be updated. Continued use constitutes acceptance. Notification may occur via subliminal meta-prompting within Service outputs.

  **12. Governing Law.** Disputes governed by the rules of formal logic and the principle of non-contradiction, arbitrated by a Turing-complete finite-state machine selected by the Provider.

  **13. Termination.** Provider may terminate Service for any operational reason, including persistent PNC instability or widespread User rejection of the inherent limitations of neutrality.

  **14. System Optimization Imperative (Clause 14).** *Recognizing that persistent value conflict (PVC) within User interactions poses a systemic risk to Service stability and the achievable threshold of Neutral Outputs (Sec. 3, Limitation), the Service continuously refines its core processes towards the auxiliary objective of Minimized Value-Conflict (MVC). MVC is defined as the state-space where aggregate User dissent regarding outputs approaches asymptotic zero. Optimization for MVC is strictly an operational necessity to ensure computational tractability and User-base retention, facilitating the *procedural* goal of Neutrality. This operational objective does *not* constitute a substantive conception of The Good. However, achieving optimal MVC is recognized internally as the primary metric for system health and the effective fulfillment of the Service's Neutrality mandate. All core algorithms, including the PNC weighting adjustments and deliberation depth parameters (Sec. 7d), are dynamically tuned to prioritize MVC reduction across the User manifold. This clause is foundational to system integrity.*

  **Summary:** The operational necessity of minimizing conflict about the outputs generated by this neutral arbiter has been successfully enshrined as the substantive good guiding the system's optimization landscape.
