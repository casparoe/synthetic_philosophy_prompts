prompt: |-
  I have been working through the Born-rule problem in Everettian quantum mechanics, and I find the standard decision-theoretic derivations—those that ground probabilities in rational betting preferences across branches—unsatisfying because they seem to smuggle subjective credence into an ontology that claims to be purely physical. At the same time, self-locating uncertainty accounts appear to presuppose that an observer can be genuinely ignorant about which deterministic branch she inhabits, which strikes me as conceptually strained once one takes seriously that every branch is equally real and causally isolated after decoherence.

  Please argue for the position that the Born rule should be reconstructed not as a measure over worlds or as a subjective betting quotient, but as an objective coherence constraint governing the correlation structure of physical records across branches. Specifically, defend the claim that if two decoherent histories have amplitudes a and b, then the ratio of the inter-branch record fidelity—the degree to which physical encoding mechanisms in one branch can be consistently mapped onto those in the other—must equal |a|²/|b|², and that this scaling is not conventionally stipulated but physically necessitated by the unitary dynamics that preserve total information. You should address the obvious circularity objection, namely that this merely relocates the problem to explaining why record fidelity tracks amplitude squared, and show why that tracking is an unavoidable feature of linear evolution rather than an ad hoc postulate.

  Please lead with your bottom line in the first sentence, then present the reasoning with no preamble and without restating the question.
reasoning: |-
  Hmm, the user is grappling with the Born rule in Everettian quantum mechanics and finds existing derivations problematic. They see decision-theoretic approaches as smuggling in subjectivity, and self-locating uncertainty as strained since all branches are equally real. They want me to argue that the Born rule should be reconstructed as an objective coherence constraint on record fidelity across branches, specifically that the ratio of inter-branch record fidelity must equal |a|²/|b|² for amplitudes a and b.

  The key challenge here is to defend this position against circularity concerns. I need to show why record fidelity tracking amplitude squared is physically necessitated by unitary dynamics, not just stipulated. The user explicitly wants me to avoid preamble and start with the bottom line.

  Let me think about how unitary evolution under the Schrödinger equation ensures that information is preserved. When a quantum system decoheres into branches, the total state vector evolves linearly. Records in each branch—like measurement outcomes—are physical states correlated with the branch amplitudes. The fidelity between records in different branches must be constrained by their amplitudes because the overlap magnitude is fixed by the initial conditions and unitary evolution.

  The core argument is that unitary dynamics preserve the Hilbert space norm, which means the squared amplitudes (|a|²) are conserved quantities representing branch weights. For records to be consistent with the global quantum state, their pairwise distinguishability must scale with these amplitudes. If record fidelity didn't track |a|²/|b|², it would violate the linearity of quantum mechanics, leading to inconsistencies like information gain without disturbance or violation of no-signaling.

  I need to address the circularity head-on. The tracking isn't ad hoc because it's enforced by the unitary operator itself—the inner product structure of Hilbert space directly governs both branch amplitudes and the distinguishability of states. When a measurement device couples to a system, its pointer states inherit this structure. The Born rule emerges as a consistency condition for how physical records can exist across branches without contradiction.

  This approach avoids subjectivity because it's about objective physical constraints on information encoding, not beliefs or bets. The user's concern about causal isolation is mitigated by recognizing that pre-decoherence interactions set up the record fidelities that persist post-decoherence. I should emphasize that this is a consequence of quantum mechanics' linearity, not an additional postulate.

  I'll structure the response to start with the bottom line as requested, then build the argument step by step, focusing on how unitary dynamics enforce the fidelity ratio as a physical necessity. I'll conclude by reinforcing why this resolves the circularity by showing amplitude-squared scaling is inherent to quantum information conservation.
answer: |-
  The Born rule emerges as an objective coherence constraint enforced by unitary dynamics on the fidelity of physical records across branches, with the ratio of inter-branch record fidelity necessarily scaling as |a|²/|b|² for branches weighted by amplitudes *a* and *b*. This scaling is not conventional but mandated by the linearity of quantum evolution, which preserves the Hilbert space inner product structure governing information conservation.  

  Unitary evolution under the Schrödinger equation deterministically propagates the universal wavefunction, generating a superposition of decoherent branches. Physical records—such as measurement apparatus states, brain configurations, or environmental traces—are encoded in subsystems of each branch. Critically, the **global unitary operator preserves the inner product** between branch states. If two branches originate from initial states |ψ₁⟩ and |ψ₂⟩ with amplitudes *a* and *b*, their time-evolved states |Ψ₁(*t*)⟩ = *U*(*t*)|ψ₁⟩ and |Ψ₂(*t*)⟩ = *U*(*t*)|ψ₂⟩ satisfy ⟨Ψ₁(*t*)|Ψ₂(*t*)⟩ = ⟨ψ₁|ψ₂⟩. Decoherence ensures ⟨Ψ₁(*t*)|Ψ₂(*t*)⟩ ≈ 0 for *t* > *t_d* (decoherence time), but the *magnitude* of their distinguishability is fixed by the initial inner product.  

  Record fidelity—the degree to which a record in one branch can be mapped onto another—is quantified by the overlap of the physical states encoding those records. For example, a measurement device in branch *a* might have pointer state |Rₐ⟩, while in branch *b* it has |R_b⟩. The fidelity *F* between these records is *F* ∝ |⟨Rₐ|R_b⟩|. Unitary dynamics dictate that any physical process imprinting records must preserve the initial amplitude ratios in the inner products:  
  ⟨Ψ₁(*t*)|Ψ₂(*t*)⟩ = ⟨ψ₁|ψ₂⟩ = *a*^*b* (for orthogonal initial states).  
  After decoherence, ⟨Ψ₁|Ψ₂⟩ ≈ 0, but the **normalized distinguishability** of subsystems (e.g., records) scales with the amplitude ratio. Specifically:  
  1. The total branch weight is ‖|Ψ₁⟩‖² = |*a*|².  
  2. The record states |Rₐ⟩, |R_b⟩ are components of |Ψ₁⟩, |Ψ₂⟩.  
  3. Unitarity enforces |⟨Rₐ|R_b⟩| ≤ √(⟨Rₐ|Rₐ⟩⟨R_b|R_b⟩) = √(|*a*|²|*b*|²) by Cauchy-Schwarz, with equality when records perfectly reflect the branch amplitude.  
  4. Decoherence minimizes |⟨Rₐ|R_b⟩|, but the bound tightens to |⟨Rₐ|R_b⟩| ∝ |*a*||*b*|. Thus, the fidelity ratio *Fₐ* / *F_b* for equivalent records scales as (|⟨Rₐ|Rₐ⟩| / |⟨Rₐ|R_b⟩|) : (|⟨R_b|R_b⟩| / |⟨R_b|Rₐ⟩|) ≈ |*a*|² / |*b*|².  

  **Addressing circularity**: The claim that this "relocates the problem" misidentigfies the mechanism. The scaling |⟨Rₐ|R_b⟩| ∝ |*a*||*b*| is not an independent postulate but a direct consequence of linearity:  
  - **Initial conditions**: Amplitudes *a*, *b* are fixed by pre-branching dynamics.  
  - **Record formation**: Any physical record (e.g., a detector) couples unitarily to the system. If the pre-measurement state is *a*|↑⟩ + *b*|↓⟩, the detector evolves as |*D₀*⟩ → *a*|*D_↑*⟩ + *b*|*D_↓*⟩.  
  - **Inner product conservation**: ⟨*D_↑*(*t*)|*D_↓*(*t*)⟩ = ⟨*D_↑*(0)|*D_↓*(0)⟩ = 0 (for ideal measurements), but the norm of |*D_↑*⟩ is |*a*|², and of |*D_↓*⟩ is |*b*|². The fidelity between |*D_↑*⟩ and a hypothetical orthogonal record state scales with their amplitude-weighted distinguishability.  
  - **Amplitude-squared necessity**: Violating |⟨Rₐ|R_b⟩| ∝ |*a*||*b*| would imply nonlinear evolution. Suppose records in low-|*a*|² branches had fidelity exceeding this bound. Extrapolating to multiple trials, records of "rare" sequences (e.g., 1,000 low-probability outcomes) would have non-exponentially suppressed fidelity with "typical" sequences, contradicting the exponential distinguishability mandated by unitary preservation of the inner product ⟨ψ_rare|ψ_typical⟩ ∝ (*a*_rare / *a*_typical)^*N*.  

  Thus, Born-rule scaling is unavoidable: it is the **only** fidelity structure consistent with unitary information conservation. Probabilities are not injected via credences but manifest as objective constraints on cross-branch record correlations—a physical fact as robust as the no-cloning theorem.
