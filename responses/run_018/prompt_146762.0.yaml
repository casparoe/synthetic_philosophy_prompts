  First, I need to establish the foundational distinction between the brain (physical) and the self (pattern) upfront. Without this, the audience might dismiss the idea as mystical. The twin journal scenario is brilliant but must avoid being reduced to mere shared memory. I should highlight the emergent "third voice" that persists after one twin dies. 

