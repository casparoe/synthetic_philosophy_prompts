     - The cleanest translations are for SSA and the PP's inference (if we accept SIA). The gap is in handling the first-person perspective and the reference class. The fact that we are this particular observer is indexical information that is not part of the typical statistical dataset. This gap is a defect of the vocabulary for this specific problem, but it also shows that the original claims are not as clear as they might seem.

