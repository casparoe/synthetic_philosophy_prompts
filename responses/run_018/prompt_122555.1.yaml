     - The translation exposes that the PP's inference is an assumption about the prior or likelihood. It is not an ordinary scientific update. We do not have experimental data to distinguish the theories. The large Bayes factor comes entirely from the modeling choice (SIA). In statistics, we would not treat this as a discovery but as a consequence of the chosen model.

