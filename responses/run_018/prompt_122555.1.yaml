    Alternatively, we can combine SSA and SIA? But note that in the literature, the standard solution for case two is that we should update in favor of heads (by a factor of 1e6) and that SIA does not apply here because we have a well-defined random process. 

    Actually, the SIA prior would be to assign a prior to heads and tails that is proportional to the number of observers. But in this protocol, the coin is fair. So the prior for heads is 1/2 and for tails is 1/2. Then we update by the likelihood of our specific observation.

    The data is: we are an observer with these memories. Under heads, we are the only observer. Under tails, we are one of a million. So the likelihood for heads is 1 (we are that one observer) and for tails is 1 (because the data is that an observer with these memories exists, and that is certain under tails). But that doesn't account for the fact that we are a specific observer.

    The correct Bayesian update in case two:

        P(heads | data) ∝ P(data | heads) * P(heads)
        P(tails | data) ∝ P(data | tails) * P(tails)

    What is P(data | heads)? The data is: we are an observer with these memories. Under heads, there is one observer and it has these memories, so P(data | heads)=1.

    What is P(data | tails)? The data is: we are an observer with these memories. Under tails, there are 1e6 observers, each with these memories. But note: we are one of them. How to assign probability? 

    We can model: the machine creates a set of observers. We are randomly selected from among all observers created. Then:

        P(we are this particular observer | heads) = 1 (because there's only one)
        P(we are this particular observer | tails) = 1/1e6

    So the likelihood ratio is 1 / (1/1e6) = 1e6 in favor of heads.

    This is the SSA-style update. It does not require SIA.

    The SIA prior would be to set P(heads) ∝ 1 and P(tails) ∝ 1e6? Then:

        P(heads) = 1/(1+1e6)
        P(tails) = 1e6/(1+1e6)

