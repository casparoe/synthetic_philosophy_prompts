        P(we exist | heads) = 1 (because one observer is created)
        P(we exist | tails) = 1 (because one million are created)

    However, the probability that we are the one specific observer (with these memories) is:
        Under heads: 1 (because there is only one observer, so we must be that one)
        Under tails: 1/1e6 (because there are one million identical observers, and we are one of them)

    So the likelihood ratio in favor of heads over tails is 1 / (1/1e6) = 1e6. Thus, we strongly favor heads.

    Why? Because if tails were true, it would be very unlikely that we would be the specific observer we are (since there are a million of us). But note: we don't have a unique identity. We are indistinguishable. So perhaps we should condition on the fact that we exist and that we are in a world where the machine was run? 

