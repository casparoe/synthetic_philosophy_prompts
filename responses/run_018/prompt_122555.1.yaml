  ### Residue Report: What Translates and What Doesn’t  
  - **Clean translations**:  
    - SSA → Simple random draw without replacement from a frame.  
    - SIA → Likelihood proportional to frame size.  
    - PP inference → Bayes factor based on headcount.  
    - Reference class debates → Coverage error/frame definition issues.  
  - **Translations with distortion**:  
    - "Self-location" (e.g., "I am this observer") → This is **indexical information**. Your vocabulary handles it via **conditioning on observed properties** (e.g., birth rank), but loses the first-person essence. In statistics, you describe data from an external view; here, the data includes "*I* am the sample."  
    - "Anthropic evidence" → SIA’s claim that "existence is evidence for large \(N\)" has no direct statistical analog. It forces likelihood to depend on unobservable headcounts.  
  - **Gaps with no translation**:  
    - **The first-person perspective**: Your vocabulary lacks tools for indexical self-reference. Statistics treats "you" as an observed unit; philosophy treats "you" as the observer. This gap is **both a defect of your vocabulary and a sign of unclear original claims**.  
    - **Untestable assumptions**: SSA’s reference class and SIA’s likelihood rule are prior choices, not empirical. Statistics avoids non-identifiable parameters; philosophy embraces them.  
    - **Selection effects**: Anthropic reasoning often involves **cosmic selection effects** (e.g., "we can only observe in life-friendly regions"). Your vocabulary handles known selection biases but not universe-scale ones with no data.

