        P(data | heads) = 1
        P(data | tails) = 1 (because all million have these memories)

    Then the Bayes factor is 1. But that doesn't seem right because we are one of many.

    The standard resolution (and what the user might expect) is the SSA approach above: we are a random sample from the set of all observers created. Then the probability of being any particular observer is uniform. So under tails, the probability of being the observer that we are (which is one in a million) is 1e-6. Hence, we update in favor of heads.

    This is the classic "sleeping beauty" or "doomsday" style problem. The correct answer in this case (with a known randomizer) is that we should update in favor of heads. The Bayes factor is 1e6 in favor of heads.

  - **SIA**:
    - The likelihood is proportional to the number of observers: 
          P(we exist | heads) ∝ 1
