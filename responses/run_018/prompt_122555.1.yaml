        P(heads|data) ∝ 1 * 1/(1e6+1)
        P(tails|data) ∝ (1/1e6) * (1e6/(1e6+1)) = 1/(1e6+1)

    So they are equal! 

    Therefore, if we use the SIA prior and then update by the SSA likelihood (which accounts for the indexical information), we get that heads and tails are equally likely. This is the same as not updating at all from the SIA prior.

    But without the SIA prior (i.e., with a fair coin prior: P(heads)=P(tails)=1/2) and updating with the SSA likelihood, we get:

        P(heads|data) ∝ 1 * 1/2
        P(tails|data) ∝ (1/1e6) * 1/2

        So the posterior odds are 1 : 1/1e6 = 1e6:1 in favor of heads.

    In the literature, the standard solution for case two is that we should update in favor of heads. The SIA prior is not used in this case because we have a well-defined random process and we condition on being a random sample.

    Therefore, in case two the dispute does not dissolve? It appears that SSA and SIA lead to different results:

        SSA (with the fair prior) → heads is 1e6 times more likely.
        SIA → we assign equal probability to heads and tails.

    However, note that the presumptuous philosopher would use SIA and claim that tails is 1e6 times more likely without any data? But in this case we have data (our specific existence) and we update. The SIA prior already favored tails by 1e6:1, and the update (by the indexical information) then exactly cancels that.

    So the result is that we are back to 50-50. This is the same as the fair prior without any update. So the SIA prior and the update together lead to the same conclusion as if we had ignored the headcount and the indexical information.

    But note: the experimental result is that we exist. Without the indexical information (if we only knew that at least one observer exists), then under SIA we would have:

        P(heads | at least one observer) = P(heads) * 1 / [ P(heads)*1 + P(tails)*1 ] 
