  ## Research Proposal: Can Skills Be "Gettiered"? Exploring Lucky Know-How

  **1. The Core Question:**
  Can practical skills ("knowing-how") suffer from a problem analogous to the Gettier problem in propositional knowledge ("knowing-that")? Specifically, if someone acquires a reliable skill through a process that essentially involves luck (like relying on a flawed instruction that accidentally works), do they genuinely "know-how" to perform the task? And if so, do the standard proposed solutions to the Gettier problem for "knowing-that" (like requiring "no false lemmas," "safety," or grounding in "virtue") successfully resolve this problem for skills, or do they fail when applied to practical abilities?

  **2. The Gap in the Gettier Literature:**
  The Gettier problem famously challenges the definition of knowledge as "justified true belief" by showing cases where someone has a justified true belief that isn't *really* knowledge because it's true only by luck (e.g., Smith believes Jones gets the job and has 10 coins; Smith gets the job and *also* has 10 coins, making the belief true, but for the wrong reasons). However, nearly all the intense debate and proposed solutions focus *exclusively* on "knowing-that" – knowledge of facts and propositions.

  This focus implicitly assumes that "knowing-how" (like riding a bike, playing a chord, fixing a carburetor) is fundamentally different and *can't* be analyzed in terms like belief, justification, and truth in the same way. Many philosophers simply take it for granted that skills aren't the kind of thing that *could* be "Gettiered" – that they are abilities, not beliefs with truth values. Consequently, there's been very little direct effort to construct analogous "Gettier cases" for skills or to rigorously test whether the sophisticated solutions developed for propositional knowledge translate meaningfully to the practical domain. My project aims to fill this specific blind spot.

  **3. My Central Idea & The "Twist":**
  I propose that skills *can* be vulnerable to a "Gettier-style" luck problem. The core idea is this: imagine someone learns a skill based on instructions or a process that contains a crucial *falsehood* or *defect*, but due to lucky circumstances, the learner *still* ends up acquiring a reliable ability to perform the task correctly. The "skill" itself "works" (it's "functionally true"), but the *pathway* to acquiring it was flawed and relied on luck.

  **Example Cases (To Be Refined):**
  1.  **The Lucky Blueprint:** Alex wants to assemble a specific IKEA-like shelf. The instruction diagram has a critical error in step 3, showing a part upside down. However, Alex misreads the diagram *in exactly the right way* (e.g., they have a mild visual processing quirk) that compensates for the error, leading them to assemble the shelf perfectly. Alex now reliably assembles that shelf correctly when needed. Did they *know how* to assemble it *before* encountering the flawed diagram? No. Did they gain a reliable ability? Yes. Was the justification (the diagram) fundamentally flawed? Yes. Was the outcome lucky? Yes.
  2.  **The Misleading Mentor:** Ben is learning a complex guitar fingering. His teacher, Charlie, demonstrates the fingering but accidentally uses the *wrong* finger on the 3rd fret, believing it's correct. Ben copies Charlie *exactly*. However, Ben has unusually long fingers, and this *wrong* fingering actually produces the correct note *and* is more comfortable *for Ben*. Ben reliably plays the note correctly using this fingering. Ben's skill "works," but it was learned via Charlie's false belief.
  3.  **The Buggy App:** Sam learns CPR solely from a mobile app. The app has a bug that misstates the optimal compression depth. However, Sam's phone case is unusually thick, causing their hand placement during practice on the screen to *accidentally* achieve the correct depth. Sam reliably performs CPR at the correct depth in real situations. The core instruction was wrong, but luck made the outcome right.

  **4. The Plan: 6 Weeks of Philosophical Investigation**

  *   **Week 1: Mapping the Terrain (Knowing-That Fixes):**
      *   Deep dive into the core structure of the original Gettier problem for propositional knowledge.
      *   Outline and understand 2-3 major types of proposed solutions:
          *   **No False Lemmas:** Knowledge can't depend on any essential false belief in the reasoning chain.
          *   **Safety/Sensitivity:** Your belief couldn't easily have been wrong in similar circumstances.
          *   **Virtue Epistemology:** Knowledge stems from the exercise of your reliable cognitive abilities (intellectual virtues).
      *   *Goal:* Have a clear grasp of how these solutions *aim* to rule out Gettier-style luck for facts.

  *   **Week 2: Constructing Skill-Gettier Cases:**
      *   Develop 3-4 detailed, plausible scenarios (like the examples above) where:
          1.  A reliable skill is acquired.
          2.  The learning process crucially involves false information or a defective method.
          3.  The acquisition of the *reliable skill* is nevertheless successful *due to luck*.
      *   Refine cases to be as strong and uncontroversial as possible regarding the skill's functionality and the luck involved.
      *   *Goal:* Convincing analogies to propositional Gettier cases, but for practical ability.

  *   **Week 3: Testing the Fixes on Skills:**
      *   Take each solution from Week 1 and apply it rigorously to each case from Week 2.
      *   **Question:** Does the solution successfully "block" the case, showing the agent *doesn't* genuinely "know-how"?
      *   **Example Tests:**
          *   *No False Lemmas (Skill Version):* Did the learning process *necessarily involve* relying on a false belief (e.g., "The diagram is correct," "Charlie's fingering is standard," "The app states the right depth")? If so, does this mean the resulting skill isn't true "know-how"?
          *   *Safety/Sensitivity (Skill Version):* In very similar learning situations (slightly different quirks, phone cases, finger lengths), would the learner likely have acquired a *different, non-functional* skill? If yes, is the actual skill then "unsafe"?
          *   *Virtue Epistemology (Skill Version):* Did the reliable skill manifest primarily because of the learner's own reliable cognitive/perceptual abilities, or was it mostly due to the lucky environment/flawed source? Does luck undermine the "credit" the agent deserves?
      *   *Goal:* See if these adapted criteria clearly resolve the skill-Gettier cases or if they struggle or produce weird results.

  *   **Week 4: Analysis & Synthesis:**
      *   Systematize the results from Week 3. Which solutions worked well? Which broke down? Why? Are skills fundamentally different in a way that makes "Gettierization" impossible, or are the solutions inadequate for practical knowledge?
      *   Start drafting the core argument and findings.

  *   **Week 5: Writing & Refining:**
      *   Write the full draft of the research paper (~3 pages), clearly explaining the problem, the cases, the tests, and the conclusions. Focus on clarity for a non-specialist audience.
      *   Refine arguments and examples based on self-review.

  *   **Week 6: Final Polish & Presentation Prep:**
      *   Proofread, tighten arguments, ensure flow.
      *   Prepare a concise summary for potential presentation/discussion at the program's end.

  **5. What Success Looks Like:**
  *   **Clear Answer:** A defensible "yes" or "no" to whether skills *can* be Gettiered, based on the constructed cases and analysis.
  *   **New Taxonomy:** A preliminary framework showing *how* (or if) the key concepts from propositional epistemology (justification/leitmotif, safety, virtue) map onto the domain of skills in the context of luck. This might involve defining adapted versions of these concepts for skills or showing why they don't fit.
  *   **Insight:** A deeper understanding of the relationship between "knowing-that" and "knowing-how," particularly concerning the role of luck and reliable acquisition.

  **6. What Failure Looks Like (Still Valuable!):**
  *   It turns out that skills are so fundamentally different from propositional knowledge that applying concepts like "justification," "belief," or "Gettier case" to them is simply incoherent or unproductive. The project would demonstrate *why* the literature largely ignores this angle – because skills operate under a completely different logic.
  *   The constructed cases aren't convincing as true analogues to Gettier cases for skills (e.g., the luck involved isn't of the right kind, or the skill isn't *really* reliably acquired through the flawed method).
  *   The standard solutions are so flexible they easily handle the skill cases without needing significant adaptation, suggesting less novelty.

  **7. Honest Scope Check:**
  This is ambitious for 6 weeks! It explores a largely uncharted area. Key limitations:

  *   **Depth vs. Breadth:** I'll focus deeply on constructing strong cases and testing 2-3 core solutions thoroughly, rather than superficially covering every possible fix.
  *   **Defining "Know-How":** I'll adopt a relatively straightforward, functional definition of "knowing-how" as "the reliable ability to successfully perform a specific task when intentionally trying," setting aside deeper debates about its nature for this initial probe.
  *   **Focus on Acquisition:** The project centers on *how the skill is acquired* and the luck involved in that *acquisition process*, rather than luck in the *execution* of an already-known skill.
  *   **Exploratory, Not Definitive:** This is a *probe*, not the final word. The goal is to raise the question seriously, provide initial evidence/cases, and show whether pursuing this line is promising or a dead end. It's meant to spark thought, not solve epistemology overnight!

  **Why This is Cool & Doable:**
  This project tackles a famous philosophical puzzle (Gettier) from a fresh angle (skills) that's surprisingly overlooked. It uses relatable examples (bad instructions, quirky learners) to explore deep questions about knowledge, luck, and ability. The 6-week plan is structured and sequential, building from understanding the basics to testing my core hypothesis. While challenging, it focuses sharply on constructing cases and applying specific criteria, making it manageable for a deep dive. I'm really excited to see if skills can truly be "lucky" in this Gettier sense!
