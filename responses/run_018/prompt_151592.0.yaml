  Okay, the user is grappling with a philosophical problem about joint action versus coordinated behavior. They've presented several nuanced cases where their intuitions conflict, and they want a principle that can coherently accommodate most of these judgments. 

  Hmm, this is a sophisticated challenge in collective intentionality theory. The user clearly has deep familiarity with the literature—they're referencing concepts like we-intentions and mutual responsiveness while constructing clever counterexamples. Their frustration with existing frameworks (like Bratman's or Gilbert's) feels genuine; they've hit the limits of standard accounts and want something more flexible.

  The cases they present create a tension between cognitive/communicative requirements and functional unity. The rescue chain lacks explicit agreement yet feels joint, while the research consortium has institutional agreement but feels hollow. The deceived cooks and rotating board further stress-test what "shared" really means. 

  I notice the user is particularly attached to saving the rescue chain as joint action—that's their intuitive anchor. But they also care about excluding the deceptive cooks and the fragmented consortium. The rotating board case seems secondary but important for institutional actions. 

  Their proposed three conditions (mutual responsiveness, accessible shared goal, co-author attitude) are sensible but leaky—they let in the consortium while excluding the rescue. So we need to either reinterpret "shared representation" more minimally or add another dimension. The psychological attitude condition ("co-author not instrument") might be the key to saving the rescue while excluding the consortium, if we frame it as a disposition rather than explicit belief.

  Ah, and they hint at a bigger meta-question: is joint action a unified phenomenon? Their cases suggest it might be a spectrum. But they probably want a principle that minimizes disjunctions while honoring their core intuitions.

  For the flash mob: if participants see each other as co-creators of the dance (even without verbal agreement), it should count as joint. For the surgeon swap: if the new surgeon adopts the prior shared goal and the team treats them as part of the "we," it remains joint. But if they just mechanically follow orders? Maybe not. 

  The hardest trade-off is the research consortium: my proposed principle might still include it if members have a thin "co-author" attitude via the protocol. To exclude it, we'd need to strengthen the cognitive condition—but that might exclude the rescue chain. Alternatively, admit that some cases sit on the borderline, and that institutions create "delegated" joint action distinct from face-to-face cooperation. 

  Ultimately, the user might need to accept disunity or make a tough call on the consortium. But their rescue-chain intuition points to something important: minimal joint action can emerge from mutual recognition alone, without negotiation. That insight deserves protection.
answer: |-
  Here's a principled framework aiming to accommodate your core intuitions, built around a revised set of conditions and acknowledging necessary trade-offs:

  **The Principle of Mutual Recognition and Goal-Sustaining Coordination:**

  A set of agents performs a *genuine joint action* iff:
  1.  **Mutual Responsiveness:** Agents coordinate their actions in real-time, adjusting to each other's contributions (*motivated by: Piano Movers, Rescue Chain, excluding Emergency Callers*).
  2.  **Recognized Co-Authorship:** Each agent treats at least some other participating agents *as agents contributing intentionally to the same outcome*, not merely as environmental obstacles or tools. This involves a minimal recognition of others as *partners* in the endeavor (*motivated by: Rescue Chain, Piano Movers, excluding Deceived Cooks, Emergency Callers, weakening Research Consortium*).
  3.  **Sustained Shared Goal (Minimal):** Agents are coordinated *under a description of the outcome* that is:
      *   (a) *Functionally shared:* The same outcome description (e.g., "rescue swimmer," "move piano," "produce valid corporate decision") governs the coordination of their interdependent actions.
      *   (b) *Minimally accessible:* Each agent possesses (or could readily access under normal cooperative conditions) a sufficient understanding of *what* is being aimed at and *how* their role contributes to it, *in the context of the current interaction*. (*Motivated by: excluding Research Consortium where understanding is lacking, Deceived Cooks where goals diverge, saving Rescue Chain & Piano Movers where goal is clear*).

  **Application to Your Cases & Predictions:**

  1.  **Piano Movers:** YES. Clear mutual responsiveness, strong recognition as co-authors, fully shared & accessible goal ("move piano together").
  2.  **Emergency Callers:** NO. Lacks mutual responsiveness *to each other* (only to the accident) and lacks recognition of co-authorship (each acts individually).
  3.  **Rescue Chain:** YES (Thin). Mutual responsiveness in grip/pull. Minimal recognition of co-authorship (each treats others as partners in pulling/swimming). Sustained shared goal: "Get swimmer ashore" is functionally shared and minimally accessible (each understands pulling contributes to rescuing).
  4.  **Research Consortium:** NO. Mutual responsiveness likely weak/indirect. Recognition of co-authorship may be absent or extremely thin (others seen as data sources, not partners). Fails (3b): Many lack sufficient understanding of *how* their data fits the theoretical goal ("minimal accessibility" violated).
  5.  **Deceived Cooks:** NO. Mutual responsiveness present. Fails (2): Cook A treats Cook B as a tool for rehearsal, not a co-author of the meal. Fails (3): Goals ("rehearse alone" vs. "host dinner") are not functionally shared *at the level of description relevant to the joint action* ("preparing this meal").
  6.  **Rotating Corporate Board:** YES (Institutional). Mutual responsiveness in deliberation/voting. Recognition of co-authorship exists *as board members* under the institutional role. Sustained shared goal: "Make valid corporate decision on merger" is functionally shared and minimally accessible *within the institutional context* (members understand their role is to vote based on presented info to achieve a valid decision, even if lacking full strategic history).
  7.  **Flash Mob (Self-Organized via Post):** YES (Thin). Mutual responsiveness in synchronized actions. Recognition of co-authorship (participants see others as fellow performers, not just background). Sustained shared goal: "Perform dance X at time Y" is functionally shared and minimally accessible via the post.
  8.  **Surgical Team (Mid-Operation Replacement):** YES. Mutual responsiveness continues. Recognition of co-authorship transfers to new surgeon *as the surgeon*. Sustained shared goal: "Successfully complete surgery on Patient P" remains functionally shared and minimally accessible to the new surgeon upon joining (they grasp the current state and goal).

  **Trade-offs and Limitations:**

  *   **Cost of Saving the Rescue Chain:** This principle *keeps* the Board Rotation verdict. The key is interpreting "minimal accessibility" contextually. For the Rescue Chain, "rescue swimmer" is sufficient. For the Board, "make valid corporate decision" is sufficient *given their institutional role*. The Research Consortium fails because the *theoretical/scientific goal* is not accessible to many contributors, making their contribution instrumental rather than partner-like.
  *   **Accommodation Failures:**
      *   **Potential Tension with Research Consortium:** If consortium members *did* genuinely see each other as co-authors (e.g., through shared authorship norms) and understood their specific contribution's role in the *scientific goal* (even if not the full theory), it *might* minimally qualify. Your intuition excludes it, suggesting you weight (3b - Accessibility) highly. This principle sides with your exclusion by demanding the goal governing coordination be accessible *in a way relevant to recognizing co-authorship*.
      *   **Potential Over-inclusion of Simple Coordination?** A well-organized assembly line with highly coordinated workers who recognize each other as fellow workers contributing to "making product X" might qualify as very thin joint action under this definition, which some might reject. This principle accepts that as a feature, seeing it as a continuum.
  *   **"Shared Goal" Interpretation:** The "minimal accessibility" clause is crucial and potentially contentious. It requires the goal description under which coordination occurs to be something agents can grasp *as the point of their coordinated effort*. The deceived cooks fail because Cook A coordinates under "rehearsal," while Cook B coordinates under "meal prep for guests" – these are different functional goals governing the same physical actions.

  **What this Suggests about Collective Intentionality:**

  This framework implies that **genuine joint action is a unified phenomenon, but existing on a spectrum of "thickness"**:

  1.  **Thin Joint Action (Rescue Chain, Flash Mob):** Characterized by *emergent* mutual recognition and a highly accessible, immediate shared goal. Minimal cognitive/communicative overhead.
  2.  **Face-to-Face Joint Action (Piano Movers):** Involves richer mutual awareness, communication, and potentially shared plans/intentions, building on the thin core.
  3.  **Institutional Joint Action (Corporate Board):** Relies on institutional roles and norms to *sustain* mutual recognition and define/transmit the shared goal across time and personnel changes. The "we-intention" is anchored in the role, not necessarily deep personal identification.

  The core unity lies in the **triad of mutual responsiveness, recognition of co-authorship, and coordination governed by a functionally shared and minimally accessible goal**. The Rescue Chain reveals the minimal core; the Piano Movers exemplify its paradigmatic richness; and the Corporate Board shows how institutions scaffold and extend it. The Research Consortium and Deceived Cooks fail because they lack elements essential to this core triad.

  **Conclusion:** The proposed principle accommodates your verdicts on the Piano Movers, Emergency Callers, Rescue Chain, Deceived Cooks, and Corporate Board. It excludes the Research Consortium based on the lack of minimally accessible understanding of the shared goal relevant to co-authorship. It accepts the Rescue Chain as thin joint action and the Corporate Board as institutional joint action by interpreting the conditions contextually. The cost is potentially including very thin cases like some assembly lines and accepting that joint action has degrees of richness anchored in a coherent core structure. This suggests collective intentionality *is* a unified phenomenon, manifesting in diverse forms along a spectrum defined by the robustness of mutual recognition and goal accessibility.
