prompt: |-
  I'm presenting next Tuesday to our philosophy of religion reading group — mostly analytic philosophers who think modal ontological arguments are dead on arrival (they'll bring up Plantinga's free-logic problems, the modal fallacy, or just say "necessary existence" is a category error), plus one logician who actually teaches Gödel's proof and will catch any formal slip. My thesis: if you take Gödel's modal axioms literally but drop the theistic framing, the S5 structure actually forces conscious subjects to be necessary entities in every possible world — not "souls" in the religious sense, but world-lines that can't be annihilated without violating the modal consistency conditions. I'm bolting on my own reconstruction of Leibnizian monads (not standard Gödel scholarship) to argue that biological death is just a shift in accessibility relations, not termination.

  Can you draft my Q&A prep sheet? I need the objections in the order they'll actually come, phrased the way these people talk — not like a LessWrong thread. For each one: how damaging is it, what should I concede up front, what's my two-minute reply, and where is that reply weakest. Include the one question I'm praying nobody asks — probably something about whether I'm just smuggling Cartesian dualism through modal backdoors, or why brain damage seems to erase consciousness if it's modally necessary. Keep the whole thing under 600 words, and don't ask me for citations or reading lists — I won't have them on hand. Make it practical, like I'm walking into the room with this in my pocket.
