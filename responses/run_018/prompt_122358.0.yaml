  Alright, the user is a buyer for a mid-size grocery chain responsible for about 40 meat and dairy SKUs plus some plant milks. They need a sustainability committee welfare score for each product that's defensible but can't fund new research. They're stuck between different scoring methods—current one only counts animals killed per kg, a consultant's adds crop deaths, and another includes foregone lives. Each method changes the ranking, confusing things.

  First, I need to understand their core problem. They want a consistent, transparent decision procedure they can apply quickly to any new item. The key is balancing simplicity with comprehensiveness, using existing data without new funding. They need it philosophically defensible but practical for a buyer without a philosophy background.

  Looking deeper, the user is likely under pressure from the sustainability committee and suppliers. Suppliers might challenge scores, so the method must withstand scrutiny. Also, the user mentions almond milk probably winning, indicating a preference for plant-based options but needing validation. Their unspoken need might be justifying a shift towards plant-based products in their chain, using data to support that move.

  The main challenge is integrating multiple factors: direct deaths, crop deaths, animal welfare quality, and foregone lives. Each step requires clear decisions and acknowledging where data is missing. The user wants honesty about guesswork, so transparency is crucial. They need a step-by-step procedure that stops at points requiring human judgment, making it clear which parts are values-based.

  Breaking down the components: Defining which deaths count, attributing crop deaths, weighting by welfare, handling foregone lives, and stopping for human input. For each, I need to provide a pragmatic approach. For example, counting all vertebrate deaths but excluding insects due to uncertainty. Crop deaths should be allocated based on feed use percentages, but that requires data that might not exist. Welfare weighting could use existing frameworks like Welfare Footprint Project. Foregone lives are tricky—discounting them by 50% might be a compromise.

  For the examples: Broiler chicken has high direct deaths and crop deaths since they eat feed. Grass-fed beef has lower direct deaths per kg but higher methane emissions; crop deaths might be minimal if pasture-based, but land use is an issue. Almond milk has very low direct deaths but significant crop deaths from pesticides and high water use. The procedure should show that almond milk still wins overall due to lower animal harm, despite water usage not being in the score.

  The user needs defensibility. Documenting assumptions and data sources at each step is key. Flagging guesswork areas allows the committee to understand limitations. Suppliers can argue, but the transparent method makes it harder to dispute. Also, rerunning for new items quickly means using available data like feed conversion ratios or existing welfare scores.

  Finally, testing the procedure on the three examples to ensure it aligns with the user's hunch about almond milk. Broiler chicken and grass-fed beef have high scores due to direct and crop deaths, while almond milk remains low. This outcome supports promoting plant-based options, which might be the user's underlying goal.
answer: |-
  Here's a **practical, defensible decision procedure** for your welfare scores. It prioritizes existing data, flags guesswork, makes values calls explicit, and is runnable in ~30 mins per SKU. It builds complexity step-by-step, stopping where philosophy dominates science.

  **The Decision Procedure: "Welfare Impact Score" (WIS)**

  1.  **What Counts? (Direct Deaths & Welfare)**
      *   **Question:** "Was an animal intentionally killed or subjected to prolonged suffering *directly* for this product?"
      *   **Rule:** Count **vertebrates** (mammals, birds, fish) with a central nervous system capable of experiencing pain/suffering. *Exclude insects, nematodes, plankton.*
      *   **Metric:** `Direct Animal Lives Affected per kg (DALA/kg)`.
          *   **Animals Killed:** Use standard figures (e.g., 1 cow/ ~300kg beef, 1 chicken/~1.8kg meat).
          *   **Welfare Weighting:** Apply a **Welfare Point Score (WPS 1-5)** based on *verified* farm practices (slaughter method, confinement, mutilations, lifespan). Use a simple scale:
              *   `1 = Verified Best Practice` (e.g., certified pasture-raised, humane slaughter)
              *   `3 = Industry Average` (e.g., typical confinement, CO2 stunning)
              *   `5 = Verified Worst Practice` (e.g., extreme confinement, no stunning, long transport)
          *   *If no farm-specific data, use `3` as default.*
          *   **Calculation:** `DALA/kg = (Number of Animals Killed per kg) * WPS`
      *   **Guesswork Flag:** `WPS` assignment requires supplier evidence or using a default. *Be explicit when using default.*

  2.  **Cultivation Deaths (The "Feed Burden")**
      *   **Question:** "What crop deaths are attributable to the feed used *specifically* for this product?"
      *   **Rule:** Count **vertebrate deaths per hectare** from typical cultivation (plowing, harvesting, pesticides) of crops used *only* as animal feed or for this specific plant product.
      *   **Metric:** `Crop Deaths Burden per kg (CDB/kg)`.
          *   **Source Data:** Use published averages (e.g., 1-5 field mice/voles per hectare/year for grains; near 0 for permanent pasture). *See bottom for sources.*
          *   **Attribution:**
              *   **Animal Products:** `CDB/kg = (Crop Deaths per Hectare) * (Hectares of Feed Crops needed per kg of product)`
              *   **Plant Products:** `CDB/kg = (Crop Deaths per Hectare) * (Hectares needed per kg of product)`
          *   **Land Use Efficiency:** Calculate `Hectares per kg` using standard **Feed Conversion Ratios (FCR)** for animals or **yield data** for crops. *Use global averages if supplier-specific data is lacking.*
          *   **Pasture Rule:** Attributable `CDB/kg = 0` for *verified* 100% grass-fed/pasture-raised systems using *non-arable land*. If pasture replaced cropland or required significant inputs, use a `Pasture Impact Factor (PIF)` (e.g., `0.1` for low-input pasture on non-arable land, `0.5` for converted land, `1.0` if intensively managed like a crop). `CDB/kg = (Crop Deaths per Hectare for Grassland) * PIF * (Hectares per kg)`. *Grassland deaths are usually MUCH lower than cropland.*
      *   **Guesswork Flags:** `Crop Deaths per Hectare` estimate, `Hectares per kg` calculation if not direct from supplier/standard FCR, `PIF` assignment. *This is the biggest data gap.*

  3.  **The "Foregone Life" Question (Philosophy Step - STOP)**
      *   **Question:** "Do we assign a negative value to potential animal lives *not created* if plant-based options displace animal products?"
      *   **Rule:** **THIS IS A VALUES CALL.** The procedure stops here. Present `DALA/kg + CDB/kg` as the core "Harm Score". *Optionally, calculate and report a "Foregone Life Adjustment" separately for committee discussion, but **do not** integrate it into the main WIS without explicit committee approval.*
          *   **If Calculating Separately:**
              *   Estimate "Lives Supported per kg" for animal products (e.g., 1 kg beef supports ~1/300th of a cow's life).
              *   Assign a `Foregone Life Factor (FLF)` between `0` (No value) and `-1` (Full negative value equal to a life lost). *Recommend `0` or `-0.5` as a starting point for discussion.*
              *   `Foregone Adjustment/kg = FLF * (Lives Supported per kg)`
      *   **Defensibility:** Clearly state: "The 'Foregone Life' concept is highly contested. Our core score reflects measurable harm. The Foregone Adjustment reflects a specific ethical perspective the committee may or may not endorse."

  4.  **Calculate the Core Welfare Impact Score (WIS)**
      *   **Formula:** `WIS = DALA/kg + CDB/kg`
      *   **Units:** Effectively "Weighted Animal Life Impacts per kg". *Lower is better.*
      *   **Transparency:** Report the components separately (`DALA/kg`, `CDB/kg`) alongside the total `WIS`.

  **Procedure Summary:** Run SKUs through Steps 1 & 2 to get `DALA/kg` and `CDB/kg`, sum for `WIS`. Flag all guesswork. Present Step 3 separately for committee debate. Document assumptions clearly.

  **Applying the Procedure: Broiler Chicken, Grass-Fed Beef, Almond Milk**

  *   **Assumptions (Using Common Averages - Flag These!):**
      *   Crop Deaths: Grain Crops = 3 vertebrates/ha/yr. Pasture (Low-Input) = 0.2 vertebrates/ha/yr (PIF=0.1). Almonds = 3 vertebrates/ha/yr (similar intensity to grains).
      *   Feed/Yield: Chicken FCR = 1.8 kg feed/kg meat. Beef FCR (Grass-Finished) = 20 kg DM feed/kg meat (Pasture Yield ~5,000 kg DM/ha/yr). Almonds = 0.25 kg nuts/kg milk + water (land focus here).
      *   Direct: 1 Chicken (~2kg) = 0.5 DALA/kg. 1 Cow (~300kg beef) = 0.0033 DALA/kg.
      *   Welfare: Chicken WPS = 3 (Industry Avg). Beef WPS = 2 (Pasture access benefit). Almond WPS = N/A (No direct animal).
      *   Land: Hectares/kg Chicken Feed = (1.8 kg feed/kg meat) / (Crop Yield ~3000 kg/ha) = 0.0006 ha/kg meat. Hectares/kg Beef = (20 kg DM/kg meat) / (5000 kg DM/ha/yr) = 0.004 ha/kg meat. Hectares/kg Almond Milk = (1 kg nuts / 0.25 kg nuts/L milk) / (Almond Yield ~1000 kg nuts/ha) / 1000g/kg = 0.004 ha/kg milk *(Simplified - water is separate issue)*.

  **Calculations:**

  1.  **Broiler Chicken:**
      *   `DALA/kg`: (0.5 Animals/kg) * 3 (WPS) = **1.5**
      *   `CDB/kg`: (3 deaths/ha) * (0.0006 ha/kg) = **0.0018**
      *   **Core WIS = 1.5 + 0.0018 ≈ 1.50**

  2.  **Grass-Fed Beef:**
      *   `DALA/kg`: (0.0033 Animals/kg) * 2 (WPS) = **0.0066**
      *   `CDB/kg`: (0.2 deaths/ha * 0.1 PIF) * (0.004 ha/kg) = (0.02) * 0.004 = **0.00008**
      *   **Core WIS = 0.0066 + 0.00008 ≈ 0.0067**

  3.  **Almond Milk:**
      *   `DALA/kg`: **0** (No direct animal)
      *   `CDB/kg`: (3 deaths/ha) * (0.004 ha/kg milk) = **0.012**
      *   **Core WIS = 0 + 0.012 = 0.012**

  **Ranking (Core WIS - Lower Better):**
  1.  Grass-Fed Beef (**0.0067**) - *Very low direct impact & very low attributed crop deaths.*
  2.  Almond Milk (**0.012**) - *Zero direct impact, but significant crop cultivation impact.*
  3.  Broiler Chicken (**1.50**) - *Very high direct impact dominates, feed burden negligible in comparison.*

  **What about Almond Milk Winning?** Under this **Core WIS** procedure, **Grass-Fed Beef scores better than Almond Milk**. This reversal happens because:
  1.  **Direct Welfare (DALA/kg) Dominates:** Chicken's high DALA/kg dwarfs everything else. Beef's is very low per kg. Almonds have zero.
  2.  **Cultivation Impact (CDB/kg) is Small per kg:** Despite large land areas, deaths/ha/yr are low, and FCR/yield spreads this over many kgs. Almond Milk's CDB/kg is higher than Beef's *only because Beef's pasture impact is discounted (PIF=0.1)*.
  3.  **"Foregone Lives" Not Included:** Including a negative foregone life adjustment would *improve* the Beef score relative to Almond Milk.

  **Making it Defensible & Usable:**

  *   **Spreadsheet Template:** Build columns for each variable (FCR, Yield ha/kg, WPS, PIF, Crop Deaths/ha) and formulas for DALA, CDB, WIS.
  *   **Data Sources Sheet:** Cite where defaults come from (e.g., "Crop deaths/ha: Mean from Fischer & Lamey 2018 meta-analysis", "Beef FCR: Mottet et al. 2017 Global Avg for Grass-Based Systems").
  *   **Flagging Guesswork:** Use color-coding (e.g., red cell) or a "Confidence Score" (1-5) for each input (Supplier Data=5, Published Avg=3, Estimated=1).
  *   **Supplier Argument:** "Our score uses [Source] for defaults. If you have audited data proving your [WPS/FCR/Land Use] is better, provide it and we'll recalculate." Focus on *verifiable inputs*, not the structure.
  *   **Honesty:** "This score measures harm to vertebrates from killing and suffering (DALA) plus estimated deaths from crop cultivation (CDB). It doesn't measure greenhouse gases, water (critical for almonds!), soil health, or biodiversity directly. The 'foregone lives' concept is excluded from the core score as it's philosophical. We flag where data is uncertain."
  *   **Committee Presentation:** Lead with the Core WIS ranking. Show components. *Then* present the Foregone Life concept separately as an "Additional Ethical Consideration" with clear caveats.

  **Key Data Sources for Defaults (Searchable):**
  *   **Feed Conversion Ratios (FCR):** FAO reports, Mottet et al. (2017) - "Livestock: On our plates or eating at our table?"
  *   **Crop Yields & Land Use:** FAOStat, Our World in Data.
  *   **Cultivation Vertebrate Deaths:** Fischer & Lamey (2018) - "Field Deaths in Plant Agriculture"; Bar-On et al. (2018) - "Biomass distribution on Earth" (for context).
  *   **Welfare Benchmarks:** Welfare Footprint Project (scientific basis), Certified Humane/Global Animal Partnership standards (practice proxies).

  **Conclusion:** This procedure gives you a **transparent, repeatable method** focusing on measurable harm. It reverses the common assumption that Almond Milk automatically wins on animal welfare grounds *when crop deaths are included but direct animal impact dominates*. Beef wins under Core WIS due to very low per-kg direct impact and minimal attributed crop deaths. Chicken loses badly. **Crucially, this makes the values embedded in the scoring explicit (which deaths count, welfare weighting, pasture rules, excluding foregone lives) and flags data gaps.** It provides a strong foundation for supplier discussions and committee decisions.
