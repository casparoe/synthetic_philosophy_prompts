answer: |-
  ### Final Examination: Collective Responsibility & Political Violence  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 900–1,100 words (integrated essay)  

  **Question:**  
  Sixty years ago, refugees fleeing the Aldorian genocide founded the democratic republic of Novara. Every living Novaran citizen was born *after* the genocide; the founders are deceased. Novara’s constitution explicitly repudiates Aldoria’s crimes and severs all institutional ties, except one fiscal continuity: the state treasury collects revenue from agricultural lands expropriated during the genocide (never restituted), now forming part of Novara’s ordinary tax base.  

  Drawing *exclusively* on Karl Jaspers’s fourfold typology of guilt (*criminal*, *political*, *moral*, *metaphysical*) from *Die Schuldfrage* (1946):  
  **(a)** Apply Jaspers’s categories to Novara as a state and to individual Novaran citizens. Explain which forms of guilt—if any—can survive complete demographic turnover and constitutional repudiation. (10 points)  
  **(b)** Does the fiscal link (tax revenue from expropriated land) constitute inherited *political guilt* for Novarans, or is it better understood as *unjust enrichment* without guilt? Clarify the conditions Jaspers requires for political guilt (e.g., institutional membership, agency, causation) and whether revenue collection satisfies them. (10 points)  
  **(c)** Respond to this objection: If *metaphysical guilt* arises from universal human solidarity that makes all people co-responsible for evil regardless of causation, it cannot generate *special obligations* for Novarans. Either defend its differentiated practical significance for Novara despite universal scope, or concede it provides no distinctive reason for action and explain the normative consequences. (10 points)  

  ---

  ### Model Answer (850 words)  
  **(a)** Jaspers’s typology distinguishes four irreducible dimensions of guilt. *Criminal guilt* applies solely to individuals who commit legally defined acts. As no living Novaran participated in the genocide, and criminal guilt is non-transferable (Jaspers: "only the perpetrator is guilty"), it does not apply to Novarans. *Political guilt* arises from membership in a political community whose institutions cause injustice. Crucially, Jaspers ties it to the *continuity of the state apparatus*: "Everyone is co-responsible for the way he is governed." Novara’s constitutional repudiation and demographic rupture sever institutional continuity with Aldoria. Thus, while Aldoria bears political guilt, Novara does not inherit it—its state is a *new* entity rejecting the old regime’s legitimacy.  

  *Moral guilt* concerns personal complicity through action/inaction. Jaspers insists it is "not transmissible" and requires individual choice. Novarans, born decades after the genocide with no capacity to influence events, lack moral guilt. *Metaphysical guilt*, however, persists. Rooted in "human solidarity," it is the guilt of "being alive when such things happen." Unlike political guilt, it does not depend on institutional ties but on existential co-responsibility for failing to prevent radical evil. Novarans inherit this guilt not as citizens but *as humans* who benefit from historical injustice, even indirectly.  

  **(b)** The fiscal link is a problem of *unjust enrichment*, not political guilt. Political guilt for Jaspers requires three conditions: (1) *Institutional membership* in a *continuous* state; (2) *Collective agency*—the state must be an active cause of harm; (3) *Causal contribution* to injustice. Novara fails all three:  
  - (1) Its constitution breaks institutional continuity with Aldoria.  
  - (2) Novara did not perpetrate the expropriation; it passively administers land seized by another state.  
  - (3) Collecting revenue is an *effect* of prior injustice, not a cause.  

  Jaspers explicitly distinguishes political guilt from material benefit: "Political liability concerns deeds... not the enjoyment of advantages." Revenue collection here constitutes *unjust enrichment*: Novara retains wealth derived from violent dispossession. This creates obligations of *restitution* (e.g., returning land or profits to victims’ heirs), but restitution addresses compensatory justice—not the *blame* implied by guilt. Conflating benefit with guilt risks misapplying Jaspers’s political category, which concerns active state wrongdoing, not passive inheritance.  

  **(c)** The universalist objection correctly notes metaphysical guilt applies to all humans but errs in assuming this negates differentiated duties. Jaspers’s metaphysical guilt generates two obligations: (1) *Existential reflection* on one’s passive tolerance of evil; (2) *Active solidarity* with victims. While binding universally, these duties *intensify* based on *proximity to harm*. Novarans are proximate in two ways:  
  - *Material proximity*: They directly benefit from expropriated land (via public goods funded by taxes).  
  - *Historical proximity*: Their state’s identity emerged from the genocide.  

  Jaspers argues metaphysical guilt demands we "transform our consciousness" into tangible repair. Universal co-responsibility does not dilute obligation but *redirects* it: Those materially/historically closer to injustice bear stronger duties to enact solidarity. For Novarans, this means acknowledging their state’s enrichment and initiating restitution—not as legal atonement but as ethical repair. If metaphysical guilt imposed identical duties on all humans, it would indeed be inert. Its practical force lies in scaling obligations to *contextual relationships* with harm. Thus, Novarans have distinctive reasons to act: Their benefits and historical ties create a "thicker" solidarity obligation than that of distant strangers.  

  ---

  ### Marking Scheme (30 Total Points)  
  **A Answer (27–30):** Systematically separates Jaspers’s categories; resolves fiscal continuity via unjust enrichment; defends metaphysical guilt’s differential obligations.  
  **B Answer (24–26):** Identifies categories but blends them superficially; partially conflates political guilt/unjust enrichment; struggles with metaphysical universality.  

  | Conceptual Move | Points | Failure Mode |
  |----------------|--------|-------------|
  | **1. Correctly denies criminal/moral guilt** for Novarans by stressing their *non-agency* and Jaspers’s individualism. | 6 | Conflates moral guilt with inherited responsibility (e.g., "Novarans are morally guilty for benefiting"). |
  | **2. Correctly denies political guilt** by showing Novara’s *institutional discontinuity* from Aldoria meets Jaspers’s condition for political guilt requiring state continuity/agency. | 6 | Equates political guilt with benefit (e.g., "Tax revenue = political guilt") or ignores institutional rupture. |
  | **3. Identifies fiscal continuity as unjust enrichment** (not guilt) by distinguishing passive benefit from active causation per Jaspers’s political guilt criteria. | 6 | Treats revenue as "guilt by association" rather than a restitutional obligation. |
  | **4. Defends metaphysical guilt’s persistence** and explains its foundation in human solidarity *without* relying on state/citizen ties. | 6 | Reduces metaphysical guilt to symbolic regret or conflates it with political liability. |
  | **5. Resolves the universalist objection** by arguing metaphysical guilt’s obligations *intensify* with proximity/benefit, preserving Novara’s distinctive duties. | 6 | Claims metaphysical guilt imposes identical duties on all humans (erasing differentiation) or collapses it into political solutions.  

  *Note:* Essays blending categories (e.g., "political-metaphysical guilt") or misrepresenting Jaspers’s conditions for political guilt (e.g., requiring only benefit, not agency) lose 2–3 points per instance. Top scores require precision in **all five moves**.
