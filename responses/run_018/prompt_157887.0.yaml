  - Pure reasoning (i) is fragile; any asymmetry breaks the symmetry needed. Tier B.
  - Epsilon-superrationality (ii) is even more fragile because doubt creeps in easily with asymmetries. Tier C.
  - Evolutionary stability (iv) is worst because mutations naturally introduce asymmetries, causing collapse. Tier D.

  I need to assign tiers S to D and give one precise sentence per tier explaining why. The user specified exactly one sentence per tier, so I'll keep it concise and focused on the structural feature.

