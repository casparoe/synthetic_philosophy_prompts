  Next, which parts strictly require the theory? The refusal layer needs some justification for overruling the user, which could be neutrality (harm to others) or perfectionism. But the training via rater rankings assumes that preferences can be aggregated through such methods, which is rooted in preference utilitarianism. However, other theories could fit here too, like rule utilitarianism or contractualism. The parts compatible with multiple theories include the use of raters—different ethical frameworks could still use similar methods to determine what's acceptable.

  Then, switching to preference utilitarianism. This would count everyone affected, not just the user. So the system would need to estimate impacts on all stakeholders, maybe using surveys or simulations. Refusals would be based on net harm, considering even minor inconveniences. Training might involve raters evaluating broader consequences, not just immediate preferences. Deployment could include explaining refusals in terms of overall utility, which might be more complex.

  For thoroughgoing neutrality, only minimal constraints to stay lawful. So no ethical refusals beyond legal requirements. Anything legal, like defamation that's hard to prove, would be allowed. The refusal layer would shrink significantly. Training raters would focus on helpfulness without ethical judgments, maybe leading to more controversial outputs. Developers would avoid any content policy beyond legality, which could increase misuse but align with strict user autonomy.

