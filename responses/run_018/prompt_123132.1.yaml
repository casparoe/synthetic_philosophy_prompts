prompt: |-
  I work as the curriculum and ethics chair at a small design institute, and about twice a semester we get into these messy disputes where a student or alumni uses a compositional method they picked up from a professor's unpublished workshop notes — like a specific way of layering translucent glazes to create depth, or a mental heuristic for arranging negative space — and then licenses the result commercially. The professor claims they "stole my idea," but the student says they just learned a technique, like learning a receipe. I need a decision procedre my three-person review panel can actually run in under an hour, grounded in whatever philosophy of property actually says about owning ideas versus expressions, with clear steps: what to ask in order, what counts as a sufficient answer, where we stop with a no, where we hand it off because it's a values call rather than a fact, and where we escalate to legal because it's actually contract breach not philosophy.

  The procedre should handle the hard cases: techniques that are partly functional and partly expressive, ideas that only really work in one specific medium, and cases where the professor never wrote anything down but taught it orally in a closed session. Then apply it to three scenarios: (1) the glaze-layering technique I mentioned, used in a ceramic line sold nationally; (2) a student who takes the professor's unpublished negative-space heuristic — basically a mental checklist — and builds an entire branding agency around it; and (3) a case where the student literally copied the professor's handwritten workshop notes and sold them as a "masterclass PDF," but claims they only copied the ideas inside, not the expressive form of the notes. I especially want the procedre to flag where it'll misfire, like when a technique is so tightly bound to one person's style that separating idea from expression is practically impossible, and I want one of those three applications to come out supporting the student in a way the professor will hate but the logic demands anyway. Keep it practical: we don't have lawyers on the panel, just educators, and we need to sign off or escalate within 48 hours.
reasoning: |-
  We are creating a decision procedure for the review panel to handle disputes about the ownership of techniques taught in unpublished workshop notes. The procedure must be grounded in the philosophy of intellectual property, particularly the distinction between ideas (which are not protectable) and expressions (which are, under copyright law). However, we must also consider trade secret protection and contractual obligations (if any).

  Key principles:
  1. Copyright law protects the expression of an idea, not the idea itself. Methods, systems, and processes are generally not protected by copyright (though they might be patentable, which is a separate issue and unlikely in these cases).
  2. Trade secrets: If the technique was shared in confidence and has commercial value because it is not generally known, it might be protected as a trade secret. However, in an educational setting, it is challenging to argue that the technique was shared under an obligation of secrecy unless explicitly stated.
  3. Contract: If the professor and the student had a specific agreement (e.g., in a syllabus, workshop agreement) that restricted the use of the technique, that contract might govern.

  The procedure will have the following steps:

  **Step 1: Initial Triage (5 minutes)**
  - Check if there is a written agreement (e.g., workshop contract, syllabus clause) that explicitly governs the use of the technique. If yes, then the case is about contract breach and should be escalated to legal. Skip to Step 5.
  - If no written agreement, proceed to Step 2.

  **Step 2: Determine if the Subject Matter is Protectable (15 minutes)**
  We need to determine what the professor is claiming: is it an idea or an expression?
  - Ask the professor: "Can you describe the technique in your own words? Is it a general method or a specific set of instructions?"
  - Ask the student: "How did you learn the technique? Did you copy written materials verbatim or use the method as taught?"

  Key questions for the panel:
  - Is the technique a system, method, or process? (If yes, it's an idea -> not copyrightable. However, note that if it is a trade secret, we proceed differently.)
  - Is the technique expressed in a tangible form (written notes, diagrams) that the student copied? (If yes, then we are looking at potential copyright infringement of the expression.)

  If the technique is purely functional (e.g., a step-by-step process for layering glazes that produces a specific physical effect), then it is an idea and not protectable by copyright. However, if the professor's expression of that technique (e.g., the exact wording, diagrams) was copied, then that expression may be protected.

  If the technique is a mental heuristic (e.g., a checklist) then it is likely an idea and not protectable.

  If the professor never wrote it down and taught it orally, then there is no fixed expression to protect. Copyright requires fixation. However, if the student took notes during the oral teaching and then copied those notes (which are a fixation), then the expression in the notes might be protected.

  **Step 3: Trade Secret Analysis (10 minutes)**
  Even if the technique is not protected by copyright, it might be a trade secret.
  - Ask: Was the technique taught in a context that implied confidentiality? (e.g., a closed session labeled "confidential", or in a one-on-one mentorship with an expectation of secrecy?) 
  - Is the technique generally known in the field? (If it is, then it cannot be a trade secret.)
  - Did the technique derive independent economic value from not being generally known?

  If the technique was taught in a regular class without any confidentiality agreement and is not particularly secret (e.g., other professors teach similar methods), then it is unlikely to be a trade secret.

  If the panel finds that the technique was a trade secret and the student misappropriated it (by disclosing or using it in breach of confidence), then we escalate to legal because trade secret law is complex and may require legal action. Otherwise, proceed to Step 4.

  **Step 4: Expression vs. Idea Separation (15 minutes)**
  For copyright claims, we must determine if the student copied the expression (which is protected) or only the idea (which is not).
  - Obtain the original materials (if any) and the student's work.
  - Ask: Are the two works substantially similar in the expression? (Look at the exact wording, structure, sequence, and any creative elements that are not functional.)

  If the technique is a method that can only be expressed in a very limited number of ways (merger doctrine), then even the expression might not be protected because the idea and expression have merged.

  If the student copied the exact expression (e.g., verbatim text, specific diagrams) without permission, then that is a copyright infringement. However, note that if the student only learned the technique and then expressed it in their own words, that is not infringement.

  **Step 5: Decision and Escalation (5 minutes)**
  Based on the above:
  - If the issue is a potential contract breach (from Step 1) or trade secret misappropriation (from Step 3) that the panel cannot resolve (because we are not lawyers), then escalate to legal.
  - If the claim is about copyright infringement and the panel finds that the student copied the expression (and the expression is protectable and not merged with the idea), then we find for the professor and recommend that the professor seek legal counsel for potential infringement claims (which we cannot adjudicate). We also note that the institute is not a party to such a claim.
  - Otherwise, if the student only used the idea (the technique) and did not copy the expression, then we find for the student. The professor's claim of ownership of the idea is not supported by intellectual property law.

  **Flagged Misfires:**
  - When a technique is so unique and tied to a person's style that the idea and expression are merged (merger doctrine) or when the technique is functional and the only way to achieve a certain result. In such cases, the technique is not protectable by copyright, but the panel might feel it is unfair. We must stick to the law: no protection for ideas.
  - When the professor never wrote the technique down and taught it orally, then there is no copyright in the oral teaching (unless it was recorded). However, if the student created notes and then distributed those notes, that might be an infringement of the professor's copyright in the oral teaching? Actually, copyright does not protect oral works unless they are fixed. So if the professor never fixed it, then the student's notes are the student's own expression of what they heard. Unless the notes are a verbatim transcription (which would be difficult without a recording), they are likely the student's own work.

  **Application to Scenarios:**

  **Scenario 1: Glaze-layering technique used in a ceramic line**
  - Step 1: No written agreement mentioned -> proceed.
  - Step 2: The technique is a method for layering glazes. It is functional (creates depth) and thus an idea. Not copyrightable.
  - Step 3: Was it a trade secret? Probably not, because it was taught in a workshop without confidentiality. Even if it was a closed session, if there was no confidentiality agreement, it's unlikely. The professor would have to show that it was not known in the field and that it had commercial value from being secret. We would ask: is this technique unique and unknown? If so, then we might escalate to legal for trade secret analysis. But given the context, it's more likely not. So we proceed to Step 4.
  - Step 4: The student used the method to create ceramics. They did not copy any written expression (unless they used the professor's exact wording in marketing, etc.). The student only used the idea. No infringement.
  - Decision: For the student. The professor will hate this, but the logic demands it.

  **Scenario 2: Negative-space heuristic used to build a branding agency**
  - Step 1: No written agreement -> proceed.
  - Step 2: The heuristic is a mental checklist. It is a system or method, so an idea. Not copyrightable.
  - Step 3: Trade secret? Unlikely, unless the professor can show it was confidential and not generally known. Without evidence of confidentiality, we move on.
  - Step 4: The student built an agency around the idea. They did not copy any expression (unless they used the professor's exact checklist wording). If the student expressed the heuristic in their own words, then it's not infringement.
  - Decision: For the student.

  **Scenario 3: Student copied handwritten workshop notes and sold them as a PDF**
  - Step 1: No written agreement mentioned, but note: the professor's notes are fixed expression.
  - Step 2: The notes are a written expression. The ideas in the notes are not protected, but the expression (the specific wording, diagrams, etc.) is.
  - Step 3: We skip trade secret because we have a clear copyright issue.
  - Step 4: The student copied the notes verbatim (or substantially) and sold them. This is copyright infringement of the expression.
  - Decision: For the professor. The student's claim that they only copied the ideas is false because they copied the expression. We recommend the professor consult a lawyer for infringement. We might also consider if the student violated the institute's policies on academic integrity (plagiarism) and handle that internally.

  **One of the applications supporting the student:**
  In Scenario 1 and 2, we support the student. The professor will hate it in Scenario 1 because the student is commercially using the technique without giving credit or compensation, but the law does not require it.

  **Procedure Summary for the Panel:**
  1. **Triage for Contract**: 5 min. Look for written agreements. If found, escalate to legal.
  2. **Protectable Subject Matter**: 15 min. Determine if the claim is about an idea (not protectable) or expression. If it's an idea, then the claim fails unless trade secret applies.
  3. **Trade Secret Check**: 10 min. If the technique was confidential and not generally known, and the student breached confidence, then escalate to legal.
  4. **Expression vs. Idea**: 15 min. If the claim is about expression, compare the original and the student's work. If the expression is copied and is protectable (and not merged with the idea), then it's infringement and we recommend the professor seek legal counsel. Otherwise, the student wins.
  5. **Decision and Escalation**: 5 min. Make the call and document.

  Note: The panel does not decide legal claims (like infringement) but only whether the claim has merit under IP principles and whether to escalate to legal. The panel's role is to resolve the dispute at the institute level or pass it on.

  Time: Total 50 minutes, leaving 10 minutes buffer for discussion.

  This procedure is practical and grounded in IP law. It flags misfires (like merger doctrine or functional methods) by design in Step 2 and Step 4.
answer: |-
  Here's a practical, philosophy-grounded decision procedure for your 3-person panel, designed to resolve disputes in under 60 minutes. It combines copyright law principles (idea/expression dichotomy), trade secret basics, and contract awareness, while flagging edge cases. The procedure prioritizes **pragmatic triage** over perfect philosophical resolution.

  ---

  ### **Decision Procedure: "IDEA/EXPRESSION TRIAGE FRAMEWORK"**
  **Time Allocation:** 55 min total (5 min buffer)  
  **Grounding Philosophy:** Copyright protects *expression* (specific wording, sequences, visuals), not *ideas* (methods, systems, concepts). Functional techniques are rarely owned unless secret (trade secret) or contracted.  
  **Tools Needed:** Original workshop materials (if any), student's work sample, panel consensus voting.

  #### **STEP 1: CONTRACT SCREEN (5 min)**  
  **Question:** *"Was there a written agreement restricting use? (e.g., syllabus, workshop sign-up sheet, NDA)?"*  
  - **Sufficient Answer:** Written proof of terms (e.g., "workshop techniques may not be commercialized").  
  - **NO ➔** Proceed to Step 2.  
  - **YES ➔** Escalate to legal immediately (contract breach concern).  
  - **Misfire Flag:** Verbal agreements are unenforceable here—ignore "but I said..." claims.

  #### **STEP 2: TRADE SECRET TEST (10 min)**  
  **Questions:**  
  1. *"Was the technique taught confidentially? (e.g., locked lab, explicit 'do not share' warning)?"*  
  2. *"Is it widely known outside this institute? (e.g., industry standard, textbook method)?"*  
  3. *"Does it derive value from secrecy? (e.g., unique competitive advantage)?"*  
  - **Sufficient Answer:** Evidence of confidentiality + uniqueness (e.g., lab sign-in sheets, expert testimony on novelty).  
  - **ALL 3 YES ➔** Escalate to legal (potential trade secret misappropriation).  
  - **ANY NO ➔** Proceed to Step 3.  
  - **Misfire Flag:** "Closed session" ≠ automatic confidentiality. Must prove secrecy intent.

  #### **STEP 3: IDEA vs. EXPRESSION SPLIT (25 min)**  
  **Core Question:** *"Did the student copy the professor’s *expression* or just use the *idea*?"*  
  - **Analyze in this order:**  
    1. **Tangible Expression?**  
       - If no written notes exist (e.g., oral teaching only), **student wins automatically** (no copyright without fixation).  
       - If notes exist, compare student’s work to professor’s materials.  
    2. **Functional vs. Expressive:**  
       - If the technique is purely functional (e.g., "layer 3 glazes in this order for durability"), it’s an **unprotectable idea** ➔ student wins.  
       - If it merges function/expression (e.g., "layer glazes in these exact poetic steps that mirror my personal style"), apply:  
    3. **Merger Doctrine Test:**  
       - *"Could this method be expressed in very few ways?"* (e.g., only one glaze sequence achieves this effect).  
       - YES ➔ Idea and expression merge ➔ **unprotectable** ➔ student wins.  
       - NO ➔ Expression may be protected; proceed to #4.  
    4. **Substantial Similarity Check:**  
       - *"Did the student copy >30% of unique phrasing/visuals? (e.g., verbatim descriptions, diagrams, sequence)"*  
       - YES ➔ **Support professor** (copyright concern ➔ escalate to legal).  
       - NO ➔ **Student wins** (used idea, not expression).  
  - **Misfire Flag:** Techniques tied to personal style (e.g., "heuristic using my childhood memories") risk false negatives—if inseparable, student wins per law.

  #### **STEP 4: VALUES ADJUDICATION (10 min)**  
  **If student wins Step 3, but professor protests:**  
  - **Question:** *"Does this feel like a violation of academic integrity despite the law?"*  
    - e.g., Student misrepresented technique as their own innovation.  
  - **Sufficient Answer:** Panel consensus on "yes" with ethical rationale (e.g., "undermines mentorship").  
    - **YES ➔** Issue formal谴责 (censure) but no legal action. Hand off to academic integrity committee.  
    - **NO ➔** Case closed, student wins.  
  - **Misfire Flag:** Panel bias toward professors—require concrete examples of dishonesty, not "ungrateful student" claims.

  #### **STEP 5: OUTCOME & ESCALATION (5 min)**  
  - **Document:** "No IP claim" (student wins) | "Escalate to legal" | "Academic integrity referral."  
  - **Notify Parties:** Template email: "Per IP principles, [technique] is [idea/expression]. Outcome: [result]. Next steps: [none/escort]."  
  - **48-Hour Rule:** If unresolved in 1 hour, default to "escalate to legal" to meet deadline.

  ---

  ### **Application to Your Cases**
  **Case 1: Glaze-Layering Technique**  
  - Step 1: No contract ➔ Step 2.  
  - Step 2: Taught in workshop, not confidential/novel (ceramicists use layering) ➔ Step 3.  
  - Step 3: Functional method ("layer X then Y for depth") + many ways to describe ➔ **Idea, not expression ➔ Student wins.**  
  - **Misfire:** Professor hates this—but logic demands it.  
  - **Values Call?** If student called it "Professor Smith's Method," no issue. If claimed invention, Step 4 ➔ academic integrity review.  

  **Case 2: Negative-Space Heuristic**  
  - Step 1: No contract ➔ Step 2.  
  - Step 2: Mental checklist not secret (similar rules in design textbooks) ➔ Step 3.  
  - Step 3: Heuristic = system ➔ **Unprotectable idea.** Student’s agency uses the idea, not copied expression ➔ **Student wins.**  
  - **Misfire:** Professor argues it’s "their life’s work"—but still an idea.  

  **Case 3: Copied Handwritten Notes as PDF**  
  - Step 1: No contract ➔ Step 2.  
  - Step 2: Notes not confidential (no NDA) ➔ Step 3.  
  - Step 3: **Expression copied verbatim** (PDF is exact replica of notes) ➔ Substantial similarity ➔ **Support professor, escalate to legal.**  
  - Student’s defense ("only copied ideas") fails—the *expression* (handwriting, layout) was stolen.  

  ---

  ### **Why This Works for Educators**
  - **No Legal Expertise Needed:** Uses simple filters (contract? secret? copied text?).  
  - **Handles Hard Cases:**  
    - Oral teaching: Auto-win for student without notes.  
    - Functional+expressive: Merger doctrine protects students unless expression is unique.  
    - Values/ethics siloed to Step 4.  
  - **Misfire Warnings:** Flags "style-bound techniques" (Step 3) and oral teachings (Step 3) as high-risk for unfair outcomes but legally unavoidable.  
  - **One Win for Student:** Case 1/Case 2—forces professors to accept IP law limits.  

  **Template Script:**  
  *"Panelists, we have 60 min. Start: Did Professor have a contract? [5 min voting]. No? Move to: Was it a secret? [10 min evidence review]. No? Now: Did Student copy words/pictures or just the method? [25 min comparison]. If just method, student wins—but check for credit/ethics [10 min]. Outcome by 55 min."*  

  This balances speed, law, and academic ethics—prioritizing triage while respecting philosophy.
