prompt: |-
  Im a high school philosophy teacher grading about thirty essays with a rubric that has two vague boxes: "original argument" and "adequate evidence". I need an actual decision procedure I can run in like four minutes per paper — ordered questions, what counts as enough at each step, where it stops with a clear yes/no and where it hands off to my co-teacher because its a values call not a fact. Ground it in epistemicism vs supervaluationism about vagueness: use the real difference between there being a sharp boundary we just cant know versus there being no single boundary and precisification being arbitrary. I want to see how each theory would actually change the checklist, not just a summary. Then apply it to three essays: one with a genuinely novel claim thats barely supported, one thats competently argued but totally derivative, and one where the evidence is right on whatever cutoff you choose. Make sure one of these gets an answer Ill hate — like the derivative one scoring high on one axis but the procedure forcing a fail anyway. End with what the procedure flat out cant do, especially with second-order vagueness and grading thirty papers in a row where consistency matters more than metaphysics.
reasoning: |-
  Okay, the user is a high school philosophy teacher dealing with a vague rubric for grading essays. They need a decision procedure that's quick—around four minutes per paper. The key points are addressing "original argument" and "adequate evidence" using epistemicism and supervaluationism. They also want examples and to see how each theory affects the checklist, especially in cases where the outcome might be frustrating.

  First, I need to recall the difference between epistemicism and supervaluationism. Epistemicism says there's a sharp boundary we can't know, while supervaluationism says boundaries are context-dependent and precisification is needed. The user wants practical checklists grounded in these theories, not just summaries.

  The user mentioned three essay types: novel claim with weak support, derivative but well-argued, and borderline evidence. One should have a result the user hates, like the derivative one scoring high but failing overall. Also, addressing second-order vagueness and consistency in grading multiple papers is crucial.

  I should start by breaking down each rubric category into steps. For "original argument," under epistemicism, the checklist would have clear thresholds, like checking for unique claims or interpretations. If it meets the count, it passes. Supervaluationism would involve multiple contexts: teacher's view, peers, and curriculum. If one context accepts it as original, it passes.

  For "adequate evidence," epistemicism might require a minimum number of relevant arguments. Supervaluationism would require all contexts to agree evidence is sufficient. The failure conditions differ: epistemicism fails if below threshold, supervaluationism if any context disagrees.

  Applying to the three essays. Essay 1 (novel but weak support): Epistemicism passes originality but fails evidence. Supervaluationism might pass originality from teacher's context but fail evidence as all contexts require support. Overall fail.

  Essay 2 (derivative but competent): Epistemicism fails originality if no unique elements but passes evidence. Supervaluationism fails originality as all contexts see it as unoriginal. Overall fail, which the user might hate.

  Essay 3 (borderline evidence): Epistemicism might barely pass evidence if above threshold. Supervaluationism could go either way; if one context disagrees, it fails, but the teacher can precisify. User decides.

  Limitations: Second-order vagueness isn't resolved; both theories struggle. Consistency is managed via epistemicism's fixed thresholds or supervaluationism's shared precisification. The procedure can't handle deep originality assessment or ambiguous evidence, requiring teacher judgment.

  Need to ensure the checklists are actionable within four minutes. Steps should be yes/no with clear handoffs. Mention where co-teacher input is needed, like precisification in supervaluationism. Highlight that the derivative essay failing despite good evidence meets the user's request for a hated outcome.
answer: |-
  Here's a decision procedure grounded in epistemicism (E) and supervaluationism (S), designed for speed (4 min/paper) and clarity, addressing your rubric's vagueness. It includes handoffs for "values calls" and forces one "hated" outcome.

  **Core Structure (For Each Rubric Category):**
  1.  **Ordered Questions:** Binary (Yes/No) steps with clear thresholds.
  2.  **Stopping Points:** Clear pass/fail outcomes OR handoff triggers.
  3.  **Handoff Rules:** Explicitly defined for precisification (S) or borderline cases needing human arbitration (often shared between E & S).
  4.  **Failure Default:** If a step isn't definitively passed, the category fails *for that theory*. This ensures speed.

  **Epistemicism (E) - Sharp Boundary (We Just Don't Know It) Approach:**
  *   **Premise:** There *is* a precise threshold (e.g., exactly 2 original claims, exactly 5 pieces of relevant evidence), but we lack epistemic access to it.
  *   **Strategy:** Use conservative, easily identifiable proxies that *definitely lie below* or *definitely exceed* the unknown sharp boundary. Err on the side of caution for passing.
  *   **Goal:** Avoid false positives (passing what shouldn't pass). Embrace definite failures.

  **Supervaluationism (S) - No Single Boundary (Precisification Needed) Approach:**
  *   **Premise:** "Original" and "adequate" can be made precise in many reasonable ways (precisifications). Passing requires satisfying *all* reasonable precisifications.
  *   **Strategy:** Define a small set of core, distinct "reasonable precisifications" (RPs). Passing requires satisfying *all* RPs.
  *   **Goal:** Avoid false positives. If *any* RP fails, the category fails. Handoff occurs if RPs conflict *for this specific essay* or borderline cases exist within an RP.

  ---

  **The Decision Procedure (Run Separately for "Original Argument" & "Adequate Evidence")**

  **1. "Original Argument" (OA)**
  *   **Step E1: Basic Uniqueness Check (Definitely Below Boundary?)**
      *   *Question:* Does the essay *only* repeat claims/moves explicitly made in class lectures/texts without any variation or combination?
      *   *Threshold:* Literal duplication = definite failure. Anything more complex = move to E2.
      *   *Stop:* **YES** (Only duplication) -> **OA FAIL (E)**. **NO** -> Proceed to E2.
  *   **Step E2: Clear Originality Check (Definitely Above Boundary?)**
      *   *Question:* Does the essay contain at least *one* clearly identifiable claim, interpretation, or argumentative move that is:
          1.  Not found in assigned texts/lectures? AND
          2.  Not a simple inversion/negation of a class claim? AND
          3.  Central to the essay's main argument?
      *   *Threshold:* One clear, central, non-derivative element suffices.
      *   *Stop:* **YES** -> **OA PASS (E)**. **NO** -> **OA FAIL (E)**. (If unsure, lean towards NO - conservative proxy).
  *   **Step S1: Reasonable Precisifications (RP) Check (Must Pass ALL)**
      *   *Define RPs:*
          *   **RP-Teacher:** Would *I* personally find this argument novel/stimulating? (Requires *some* genuine surprise/interest).
          *   **RP-Peer:** Would a strong, attentive peer in *this* class likely find this argument unexpected or insightful? (Avoids purely idiosyncratic novelty).
          *   **RP-Curriculum:** Does the argument demonstrably engage with the core concepts *beyond* simple application? (e.g., combines concepts, identifies a tension not highlighted, applies to a genuinely new example).
      *   *Question for each RP:* Does the essay satisfy this RP? (Yes/No)
      *   *Threshold:* Must get **YES** for RP-Teacher, RP-Peer, *and* RP-Curriculum.
      *   *Stop:*
          *   **All YES** -> **OA PASS (S)**.
          *   **Any NO** -> **OA FAIL (S)**.
          *   **Borderline/Conflict:** (e.g., RP-Teacher YES, RP-Peer NO; or unsure on RP-Curriculum) -> **HANDOFF TO CO-TEACHER**. Specify which RP(s) are borderline/conflicting. Co-teacher makes a *values call* on precisification for *this essay*: "Does this count as OA *under a reasonable precisification* we accept for grading?".

  **2. "Adequate Evidence" (AE)**
  *   **Step E1: Basic Relevance Check (Definitely Below Boundary?)**
      *   *Question:* Does the essay contain *any* argument for its central claim that is completely unsupported by examples, textual references (if applicable), logical reasoning, or analogies?
      *   *Threshold:* Any *completely* unsupported major claim = definite failure.
      *   *Stop:* **YES** (Unsupported claim) -> **AE FAIL (E)**. **NO** -> Proceed to E2.
  *   **Step E2: Clear Sufficiency Check (Definitely Above Boundary?)**
      *   *Question:* Does the essay provide *at least two distinct, relevant* pieces of support for its central claim? (e.g., two different examples, one example + one logical argument, two different textual references with interpretation).
      *   *Threshold:* Two distinct, relevant supports suffice.
      *   *Stop:* **YES** -> **AE PASS (E)**. **NO** -> **AE FAIL (E)**. (If unsure if a piece counts, lean towards NO).
  *   **Step S1: Reasonable Precisifications (RP) Check (Must Pass ALL)**
      *   *Define RPs:*
          *   **RP-Coverage:** Does the evidence address the *strongest obvious counter-argument* or *key complexity* related to the claim? (Not just supporting the easy part).
          *   **RP-Depth:** Is at least one piece of evidence developed beyond mere assertion? (e.g., example explained, quote interpreted, reasoning elaborated).
          *   **RP-Relevance:** Is *all* evidence presented clearly connected logically to the specific claim it supports? (No irrelevant facts or tangents).
      *   *Question for each RP:* Does the essay satisfy this RP? (Yes/No)
      *   *Threshold:* Must get **YES** for RP-Coverage, RP-Depth, *and* RP-Relevance.
      *   *Stop:*
          *   **All YES** -> **AE PASS (S)**.
          *   **Any NO** -> **AE FAIL (S)**.
          *   **Borderline/Conflict:** (e.g., RP-Depth borderline; RP-Coverage achieved but weakly) -> **HANDOFF TO CO-TEACHER**. Specify which RP(s) are borderline/conflicting. Co-teacher makes a *values call*: "Is the evidence 'adequate' *under a reasonable precisification* we accept for grading?".

  **Overall Essay Grade (Per Theory):**
  *   Combine OA and AE results based on your school's policy (e.g., need both? weighted average?).
  *   **Key Point:** E and S might give different OA/AE results. You decide which theory's outcome to use per essay or establish a policy (e.g., always S for OA, always E for AE; most conservative outcome; handoff if they disagree).

  ---

  **Application to Your Three Essays:**

  1.  **Essay A: Genuinely Novel Claim, Barely Supported (e.g., argues Plato's Cave is *primarily* about tinnitus using a strained etymology).**
      *   **OA (E):** E1 (NO - not pure dup) -> E2: Likely **YES** (1 weird central claim) -> **PASS**.
      *   **OA (S):** RP-Teacher: **YES** (surprising!). RP-Peer: **NO** (likely confusing, not insightful). RP-Curriculum: **NO** (strained, doesn't engage concepts well). -> **FAIL** (RP-Peer & RP-Curriculum NO). *Handoff?* Only if RP-Peer borderline, but probably clear FAIL.
      *   **AE (E):** E1: **YES** (Central novel claim has weak/irrelevant support - etymological speculation isn't strong reasoning/evidence) -> **FAIL** immediately. (E2: Likely NO anyway - lacks distinct relevant supports).
      *   **AE (S):** RP-Coverage: **NO** (Ignores obvious counters). RP-Depth: **NO** (Speculation, not development). RP-Relevance: **NO** (Connection strained). -> **FAIL**.
      *   **Result:** OA(E)=PASS, OA(S)=FAIL, AE(E)=FAIL, AE(S)=FAIL. Overall likely FAIL unless OA(E) PASS counts heavily, but AE failure is critical.

  2.  **Essay B: Competently Argued, Totally Derivative (e.g., perfectly rehashes Mill's Harm Principle vs. Paternalism using class examples/texts).**
      *   **OA (E):** E1: **NO** (Not *only* dup) -> E2: **NO** (No claim not found in class/central inversion) -> **FAIL**.
      *   **OA (S):** RP-Teacher: **NO** (Zero novelty/surprise). RP-Peer: **NO** (Expected rehash). RP-Curriculum: **MAYBE**? (Demonstrates understanding/applies concepts). *Handoff Triggered!* RP-Curriculum is borderline - it *applies* but doesn't go *beyond*. Co-Teacher call: Does solid application count as "original" for grading? *(You'll likely hate this, but S forces the handoff)*. *Assume Co-Teacher says NO* -> **FAIL**.
      *   **AE (E):** E1: **NO** (Claims supported) -> E2: **YES** (Likely >2 relevant supports - e.g., definition, example, counter-example) -> **PASS**.
      *   **AE (S):** RP-Coverage: **YES** (Standard argument covers standard counter). RP-Depth: **YES** (Examples/texts explained). RP-Relevance: **YES** (Logic clear). -> **PASS**.
      *   **Result:** OA(E)=FAIL, OA(S)=FAIL (after handoff), AE(E)=PASS, AE(S)=PASS. **Overall FAIL** due to OA failure. *This is the "hated" outcome - competent, well-evidenced, but fails on OA despite competence. The procedure forces it, especially under S after handoff.*

  3.  **Essay C: Evidence On the Cutoff (e.g., argues Nietzsche's Ubermensch rejects equality; supports with one strong Zarathustra quote + one brief, slightly vague personal analogy).**
      *   **OA:** (Assume passes OA clearly under both E & S for simplicity - e.g., makes a specific connection to modern meritocracy not discussed in depth).
      *   **AE (E):** E1: **NO** (Claims supported) -> E2: **YES/NO?** Is the personal analogy a *distinct, relevant* piece? If yes, **PASS** (Quote + Analogy = 2). If the analogy is too vague/weak, might lean to **NO** -> **FAIL**. *Handoff unlikely - E2 threshold is binary.*
      *   **AE (S):** RP-Coverage: **YES** (Addresses core idea). RP-Depth: **BORDERLINE** (Quote developed? Analogy brief/vague). RP-Relevance: **YES**. *Handoff Triggered!* (RP-Depth). Co-Teacher call: Is this *developed enough*? (Values call on precisifying "depth"). *Assume Co-Teacher says YES* -> **PASS**. (They could say NO -> FAIL).
      *   **Result:** OA=PASS. AE(E) = **PASS** if analogy counts, **FAIL** if not. AE(S) = **PASS** after handoff (Co-Teacher said YES). Likely PASS overall.

  ---

  **What the Procedure CAN'T Do (Especially with 30 Papers):**

  1.  **Resolve Second-Order Vagueness:** The procedure pushes vagueness into the handoff calls (e.g., "Is this *really* 'developed'?"). The Co-Teacher call *itself* is vague ("reasonable precisification"). The procedure just localizes this unavoidable vagueness to specific points.
  2.  **Guarantee Deep Originality Assessment:** In 4 minutes, "originality" is assessed via proxies (uniqueness checks, RPs). Truly deep, subtle originality might be missed, especially if poorly articulated. The RPs (especially RP-Peer) help but aren't foolproof.
  3.  **Handle Ambiguous Evidence Perfectly:** Deciding if evidence is "relevant" or "developed" (especially in S) remains partly subjective, even with RPs. The handoff helps consistency *between* you and your co-teacher, but not perfectly.
  4.  **Eliminate Context Drift:** Grading 30 papers fatigues anyone. Under E, you might subconsciously shift your conservative thresholds. Under S, your interpretation of the RPs might drift. The rigid steps help, but vigilance is needed. Brief breaks or shuffling papers can mitigate this.
  5.  **Define "Reasonable Precisification" Exhaustively:** The RPs are a practical subset. A truly comprehensive S approach would consider *all* possible precisifications, which is impossible. This is a pragmatic compromise.
  6.  **Solve Metaphysics:** It doesn't tell you if E or S is *true*. It just gives you two different, practically applicable tools derived from each theory. The choice of which theory's outcome to use (or when to handoff) is a pedagogical/values decision.

  **Why this Works for 30 Papers & Consistency:**
  *   **Binary Steps:** Forces quick decisions (Yes/No, Pass/Fail).
  *   **Clear Triggers:** Precisely defines when to handoff, avoiding endless deliberation.
  *   **Structured Subjectivity:** Captures necessary judgment calls (via RPs in S, conservative proxies in E, and handoffs) within a defined framework, making them more consistent and auditable.
  *   **Efficiency:** Focuses assessment on critical, definable aspects. The handoff, while necessary, is minimized and targeted.
  *   **Shared Framework:** Using the same procedure (and RPs/handoff criteria) for all 30 papers, especially if discussed briefly with your co-teacher beforehand, maximizes inter-rater reliability far better than unstructured "I know it when I see it" grading. The hated Essay B outcome is a *feature* of consistency under the defined terms.
