prompt: |-
  I'm filing a feature for an ideas magazine on whether outputs from generative image systems can genuinely be art, and after a long conversation with a gallery curator who frames the question entirely in terms of institutional recognition, I want to close the essay with a poem that performs the circularity she described rather than merely naming it. I need a villanelle—nineteen lines, five tercets, a closing quatrain, two rhymes, and two refrains that alternate and finally converge in the last two lines—structured so that the form itself enacts the institutional theory's defining loop: an artifact is art because an authorized world confers that status upon it, yet that world is constituted precisely by its power to confer such status. One refrain should carry the voice of the institution ("the white cube confers the name"), the other the voice of the object ("the object makes the white cube"), and they should take turns through the tercets until they sit side by side in the final quatrain, leaving the circular dependency visibly unresolved.

  Please keep the language concrete—refer to an actual visual detail like a synthetic image displayed under gallery lighting—rather than using abstract philosophical labels, and make the rhyme and repetition do the argumentative work. The poem should be accurate enough that someone who has taught aesthetics recognizes the circularity problem inherent in institutional accounts, but it should also stand alone for a reader who has never encountered the debate; do not include citations, footnotes, or references to specific texts. I'm writing for a general audience that follows science and culture, not for specialists, so the tone should be precise but not academic, and the poem should leave the tension open rather than resolving it with a punch line.
