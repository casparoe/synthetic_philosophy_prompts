  ### Diagnostic Taxonomy for the Special Composition Question

  **Root Question:** Do any composite objects exist beyond elementary parts?  
  - **No → Mereological Nihilism**  
  - **Yes →** Proceed to **Question 1**.

  ---

  **Question 1:** Is a scattered object (e.g., a wooden table in one room and the Moon in another) one composite thing?  
  - **Yes → Unrestricted Universalism**  
  - **No →** Proceed to **Question 2**.

  **Question 2:** Does a biological organism remain the same object as its cells are entirely replaced over time?  
  - **No → Artifact-Functionalism**  
  - **Yes →** Proceed to **Question 3**.

  **Question 3:** Is an artifact (e.g., a ship with gradually replaced planks) genuinely one persisting object?  
  - **No → Organicism**  
  - **Yes →** Proceed to **Question 4**.

  **Question 4:** Is a mere heap of sand (no fixed boundary) a composite object?  
  - **Yes → Spatial-Contiguity View**  
  - **No →** Proceed to **Question 5**.

  **Question 5:** Does a gerrymandered geographic region (defined only by political convention) have parts that genuinely compose it?  
  - **Yes →** Proceed to **Question 6**  
  - **No →** Proceed to **Question 6**

  **Question 6:** Does a temporal fusion (parts at t₁ and t₂ share no spatial overlap but are linked by a continuous causal process) constitute one persisting whole?  
  - **Yes → Causal Process View (hybrid)**  
  - **No → Unoccupied**  

  ---

  ### Leaves (Positions) and Their Awkward Commitments
  1. **Mereological Nihilism**  
     - *Awkward commitment:* Denies that ordinary objects (e.g., chairs, organisms) exist; only elementary particles are real, making everyday language about unified entities deeply mistaken.  
  2. **Unrestricted Universalism**  
     - *Awkward commitment:* Accepts that any arbitrary plurality (e.g., your left shoe and Alpha Centauri) composes a single object, inflating reality with countless gerrymandered entities.  
  3. **Artifact-Functionalism**  
     - *Awkward commitment:* Denies that living organisms (e.g., cats or trees) are composite objects, reducing them to mere swarms of particles without intrinsic unity.  
  4. **Organicism**  
     - *Awkward commitment:* Denies that artifacts (e.g., the Ship of Theseus) persist through part replacement, implying repaired objects are destroyed and replaced by new entities.  
  5. **Spatial-Contiguity View**  
     - *Awkward commitment:* Accepts that any contiguous aggregate (e.g., a random pile of leaves) is a composite object, even if it lacks functional cohesion or natural boundaries.  
  6. **Causal Process View (hybrid)**  
     - *Awkward commitment:* Accepts that a disassembled machine, stored in scattered boxes but linked by reassembly plans, is one persisting object, despite lacking spatial unity at any time.  

  ---

  ### Unoccupied Combinations and Diagnoses
  - **Branch: (Q5: Yes, Q6: Yes)**  
    - *Diagnosis:* Unexplored. Accepts conventional regions and temporal fusions but rejects spatial scattering and heaps. Coherent but unintuitive, as it allows socially constructed fusions (e.g., gerrymandered districts) but not physical aggregates like sand heaps.  
  - **Branch: (Q5: Yes, Q6: No)**  
    - *Diagnosis:* Unattractive. Accepts conventional regions but rejects temporal fusions, straining consistency—why privilege political abstractions over causal unities like evolving storms?  
  - **Branch: (Q5: No, Q6: No)**  
    - *Diagnosis:* Incoherent. Accepts organisms/artifacts (via Q2/Q3) but rejects temporal fusion (Q6), denying the persistence it earlier affirmed (e.g., organisms *cannot* endure cell replacement if temporal wholes are rejected).  

  ---

  ### Notes
  - **Non-separation of leaves:** All leaves are distinct; no pair shares identical answer paths.  
  - **Design Logic:**  
    - The tree prioritizes concrete judgments over labels, using paradigmatic cases to force commitments.  
    - Early splits isolate extreme views (nihilism/universalism), while later questions separate moderate restrictions (e.g., organicism vs. spatial-contiguity).  
    - The hybrid (Causal Process View) emerges from permitting temporal dynamics but not spatial scattering, reflecting an underexplored niche in the literature.  
  - **Efficiency:** Stops early when answers uniquely identify a leaf (e.g., Q1:Yes → universalism; Q2:No → functionalism). Unoccupied branches highlight gaps in standard theories.
