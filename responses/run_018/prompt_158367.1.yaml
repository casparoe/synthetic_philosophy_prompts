  Hybrid approaches... lexicographic thresholds feel arbitrary. Risk-capped EU might work if we can define "catastrophe" operationally. But the user's "unjustified insensitivity" jab hits home - any threshold invites boundary gaming. Still, for institutions, maybe we need that line-drawing.

