answer: |-
  Your query cuts to the heart of a profound conflict in rational choice theory. I'll address each component systematically, contrasting expected utility (EU) and maximin frameworks, then evaluate hybrids and theoretical underpinnings.

  ### 1. **Does Maximin Escape or Suppress Fanaticism?**
     - **Structural Focus on Minima**: Maximin *inherently blocks* astronomical gains from influencing decisions. It evaluates options solely by their worst-case outcome, ignoring probabilities and positive extremes. If Option X has a worst case of -10 utils and Option Y has a worst case of -∞ utils (existential catastrophe), maximin chooses X regardless of Y's 99.9999% chance of +10¹⁰⁰ utils.
     - **Vulnerability to Catastrophic Losses**: However, maximin *amplifies* sensitivity to catastrophic downsides. If the worst-case outcome of any option is unboundedly negative (e.g., human extinction), maximin becomes "fanatical" about avoiding that outcome, irrespective of probability. It suppresses upside fanaticism but entrenches *downside fanaticism*.
     - **Bounded vs. Unbounded Outcomes**:  
       - *Bounded Outcomes*: Maximin is coherent and avoids EU's fanaticism.  
       - *Unbounded Outcomes*: Maximin may still be dominated by extreme losses in worst-case comparisons (e.g., -∞ > -10¹⁰⁰), replicating EU's sensitivity to tail risks.

  ---

  ### 2. **Concrete Case: Option A vs. Option B**
     - **Option A**: Guarantees +100 utils (worst case: +90 utils).  
     - **Option B**: 99.999% chance of +100 utils, 0.001% chance of -∞ utils (existential disaster).  

     - **Expected Utility Analysis**:  
       - EU(B) = (0.99999 × 100) + (0.00001 × -∞) = -∞  
       - EU(A) = 100  
       - **Verdict**: EU rejects B categorically, as any nonzero probability of -∞ dominates.  
       - **Critique**: This seems rational for existential risks but is fanatical—a 0.0000001% disaster probability would still dictate the same choice.

     - **Maximin Analysis**:  
       - Worst case of A: +90 utils  
       - Worst case of B: -∞ utils  
       - **Verdict**: Maximin chooses A, as min(A) > min(B).  
       - **Rationality Critique**:  
         - *Strength*: Correctly prioritizes survival in catastrophic scenarios.  
         - *Weakness*: Treats 0.001% and 50% disaster probabilities identically. A 0.0000001% risk would still veto B, ignoring near-certain benefits. This is probabilistically *insensitive*—potentially irrational if catastrophic risks are infinitesimal but nonzero.

  ---

  ### 3. **Hybrid Approaches: Viability Assessment**
     - **Lexicographic Maximin (Below Probability Threshold)**:  
       - Apply maximin only to outcomes below a disaster probability threshold (e.g., 10⁻⁶), else use EU.  
       - *Problem*: Thresholds are arbitrary (why 10⁻⁶ vs. 10⁻⁹?). Also, discontinuous shifts near thresholds violate rationality axioms.

     - **Risk-Capped Expected Utility**:  
       - Truncate utility ranges (e.g., cap losses at -X utils), then apply EU.  
       - *Strength*: Bounds EU's fanaticism; e.g., B's EU becomes (0.99999 × 100) + (0.00001 × -X) = 99.999 - 0.00001X.  
       - *Weakness*: Capping losses may underweight true existential risks. Who sets X, and how?

     - **Effective Hybrid?** Neither hybrid fully resolves the tension. Risk-capped EU is more defensible if caps reflect empirical constraints (e.g., societal ruin is bounded). Lexicographic rules introduce new arbitrariness.

  ---

  ### 4. **Theoretical Roots of Fanaticism**
     - **Fanaticism Source**: EU's fanaticism arises *specifically from unbounded utility scales*.  
       - With bounded utilities (e.g., |U| ≤ M), EU cannot be dominated by tail events. A disaster probability *p* contributes at most |p·M| to EU.  
       - With unbounded utilities (e.g., U = -∞ for extinction), EU diverges to ±∞ for any *p* > 0.  
     - **EU's Defense**: Unboundedness is realistic for existential stakes (e.g., human extinction). Bounding utilities artificially may ignore true stakes.  
     - **Maximin's Limitation**: Avoids fanaticism only if outcomes are bounded *below*. Unbounded catastrophes still dominate.

  ---

  ### 5. **Mapping, Breakdowns, and Final Verdict**
     - **Where Frameworks Align**:  
       - When outcomes are bounded, both can converge (e.g., choosing safe options with moderate downsides).  
       - Both reject "Pascal's Mugging" if utilities/probabilities are constrained.  
     - **Where They Diverge**:  
       | **Scenario**                | **EU**                            | **Maximin**                     |  
       |-----------------------------|-----------------------------------|---------------------------------|  
       | High-stake upside (p→0)     | Fanatically pursues gain         | Ignores gain entirely           |  
       | High-stake downside (p→0)   | Fanatically avoids loss          | Fanatically avoids loss         |  
       | Moderate outcomes           | Weights probabilities linearly    | Focuses only on worst outcome   |  

     - **Defensible Framework**:  
       - **For most institutional/policy contexts**: **Risk-capped EU** is superior. It weights probabilities sensitively while acknowledging that outcomes have natural bounds (e.g., societal collapse has finite disutility).  
       - **For existential risks**: **Maximin is justifiable** as a "survival rule." When faced with irreversible catastrophe, probabilistic weighting may be morally reckless.  
       - **Ultimate Rationality**: EU with *contextually bounded utilities* offers the most balanced approach. It avoids both fanaticism and probability neglect by recognizing that:  
         (i) Not all outcomes are infinite,  
         (ii) Probability sensitivity is essential for calibration,  
         (iii) True existential thresholds (e.g., extinction) can be handled via explicit bounds.

  ### Conclusion
  Maximin suppresses upside fanaticism but entrenches downside fanaticism; expected utility embraces both. The core pathology lies in unbounded utility scales, not EU per se. For rational choice under deep uncertainty, **bounded expected utility**—where infinity is reserved for genuinely limitless stakes—avoids arbitrariness while respecting both probabilities and extreme outcomes. In policy contexts, this implies setting explicit bounds on plausible losses (e.g., "national GDP loss" rather than "infinite ruin"), reserving maximin for rare, unambiguous existential thresholds.
