  Below is a conceptual decision tree taxonomy for classifying positions on whether clientelism and ritual gift-giving constitute corruption. The tree starts with a root node splitting the logical space into **institutional-role norms** (impartiality, rule-bound office) versus **relational-moral norms** (reciprocity, loyalty, gratitude). Branching is guided by three concrete diagnostic questions, resulting in five to six leaves (including named positions and unnamed combinations). Nodes are phrased as answerable questions without requiring prior knowledge of the positions.

  ---

  ### **Taxonomy Decision Tree**

  #### **Root Node: Primary Normative Framework**  
  *"Should acts like clientelism or ritual gift-giving be evaluated by formal role-based standards (e.g., impartiality, rules of office) or by interpersonal moral standards (e.g., reciprocity, loyalty, gratitude)?"*  
  - **Branch A: Institutional-role norms** (formal office standards) → Proceed to Q1.  
  - **Branch B: Relational-moral norms** (interpersonal standards) → Proceed to Q2.  

  ---

  #### **Branch A: Institutional-Role Norms**  
  **Q1: Are Western bureaucratic standards (e.g., impartiality, meritocracy) universally binding for all public institutions?**  
  *This separates universalist from pluralist views of institutional norms.*  
  - **A1: Yes** → **(a) Western legalist universalism** (All deviations from Western standards are corrupt).  
  - **A2: No** → Proceed to Q3.  

  **Q3 (for A2): Does cultural context determine the moral status of the act (non-corrupt if locally legitimate), or merely explain its occurrence?**  
  *This distinguishes whether local context excuses acts or only describes them.*  
  - **A2a: Cultural context determines moral status** → **Unnamed** (Institutional cultural relativism; non-corrupt if locally valid).  
  - **A2b: Cultural context only explains, not excuses** → **(c) Institutional functionalism** (Non-corrupt only if functionally necessary, e.g., sustains political representation).  

  ---

  #### **Branch B: Relational-Moral Norms**  
  **Q2: Is the exchange discrete and transactional (specific favor for specific reward) or open-ended and relational (diffuse, long-term bonds of loyalty/gratitude)?**  
  *This separates market-like transactions from embedded social practices.*  
  - **B1: Discrete/transactional** → Proceed to Q3.  
  - **B2: Open-ended/relational** → **(d) Relational-ethics defense** (Non-corrupt; affirms loyalty/gift-giving as moral).  

  **Q3 (for B1): Does cultural context determine the moral status of the act (non-corrupt if culturally accepted), or merely explain its occurrence?**  
  *Applies only to discrete exchanges in relational frameworks.*  
  - **B1a: Cultural context determines moral status** → **(b) Thick cultural relativism** (Non-corrupt if culturally legitimate).  
  - **B1b: Cultural context only explains, not excuses** → **Unnamed** (Relational condemnation; corrupt as transactional betrayal).  

  ---

  ### **Leaf Positions Summary**
  1. **(a) Western legalist universalism** (Institutional A1): Universal binding standards.  
  2. **(c) Institutional functionalism** (Institutional A2b): Excused by systemic function.  
  3. **(d) Relational-ethics defense** (Relational B2): Defended by open-ended reciprocity.  
  4. **(b) Thick cultural relativism** (Relational B1a): Cultural legitimacy determines status.  
  5. **Unnamed** (Institutional A2a): Institutional cultural relativism.  
  6. **Unnamed** (Relational B1b): Relational condemnation of transactions.  

  ---

  ### **Unoccupied Logical Combinations & Gaps**
  - **Institutional A2a + Functionalist (c)**: Combining "cultural determination" with functionalism is **incoherent**. A2a already treats cultural validity as sufficient, making functionalism redundant.  
  - **Relational B2 + Cultural Determination (b)**: Combining open-ended relational defense with cultural determination is **unattractive**. (d) already justifies acts intrinsically, rendering cultural context superfluous.  
  - **Institutional A1 + Relational Norms**: Applying universal institutional standards to relational norms is **unexplored**. It implies incompatible frameworks (e.g., "Impartial public officials must reject all gifts").  

  ---

  ### **Indistinguishable Leaves & Further Splitting**
  - **Overlap: (c) Institutional functionalism and (d) Relational-ethics defense**  
    Both may defend similar acts (e.g., gift-giving) as non-corrupt but for different reasons. The tree separates them by the **root node** (institutional vs. relational norms). To split blended arguments:  
    **Add Q4:** *"Is the justification grounded in systemic outcomes (e.g., stability) or inherent relationship virtues (e.g., loyalty)?"*  
    - Systemic outcomes → (c) Institutional functionalism.  
    - Inherent virtues → (d) Relational-ethics defense.  

  - **Note on (e) Hybrid contextual universalism**: This position (public-office impartiality universal, private reciprocity excused) maps to **(a) Western legalist universalism** for bureaucratic/electoral contexts, as these are public domains. It only diverges in private spheres, which are outside this tree’s scope.  

  ---

  ### **Tree Structure & Key Features**
  - **Levels**: 3 (root + 2 branches).  
  - **Leaves**: 6 (5 named/unnamed positions + 1 hybrid covered by (a)).  
  - **Clarity**: Each node is a self-contained diagnostic question.  
  - **Coverage**: Captures all requested positions, with gaps diagnosed.  
  - **Utility**: Avoids empirical/biasing language; focuses on logical distinctions.  

  This taxonomy isolates core fault lines in corruption judgments, enabling clear classification of theoretical positions for comparative analysis.
