  Hmm, the user is an infrastructure engineer who had a debate with their friend Priya about consent theory. They're trying to map philosophical concepts of consent to distributed systems terminology. I need to help them understand where their analogy holds and where it breaks down.

  The user wants me to restate consent concepts in their technical vocabulary. The key positions are: consent as communication (performative view) versus consent as internal will (mental-state view). The three classic failure modes are deception, coercion, and competence. For deception, I need to distinguish fraud in factum (deception about what's being authorized) from inducement deception (knew what but lied about context). For coercion, the key distinction is threats versus offers, including coercive offers.

  Looking at their specific analogies: lease with TTL for consent duration, mid-act revocation as abort path, counterfactual consent as replay, and mutual incompatibility as double-spend. These are creative but need careful analysis.

  For the residue report, I'll examine two critical cases: the competent-but-miscalibrated agent (like someone in acute grief) and whether "valid consent" has any analogue in systems that only track permissions and messages. The mental-state view seems crucial here - systems can verify signals but not internal states.

  For the scoreboard: Priya's point about miscalibration doesn't translate well to infrastructure terms. The user's lease-with-TTL analogy holds up reasonably well, but their one-bug-framing oversimplifies. The mental-state view of consent and its normative force are what the infrastructure vocabulary can't capture.

  I'll structure this as a JSON with rows for each concept and a scoreboard. For each row, I'll provide the concept, infrastructure gloss, what had to be bent in the translation, what residue remains, and a verdict on how well it translates. The scoreboard will show which claims survive translation, which collapse, whether it's one bug or three, and what the vocabulary fundamentally can't express. I'll keep it focused and avoid academic references as requested.
