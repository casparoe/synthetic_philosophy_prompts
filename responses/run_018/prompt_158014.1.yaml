prompt: |-
  hey — i'm writing up prompts for a philosophy dataset and i want ones that don't just invite pretraining regurgitation. here's one on prioritarianism and the leveling-down objection. in my distributive justice seminar yesterday a student kept repeating 'equality isn't improved by making the better-off worse off' like it was a knockdown argument against giving lexical priority to the worst-off. can you take that slogan and lay out the precise distinct claims it could be expressing? i want a menu: maybe equality is purely instrumental, maybe there's a separateness-of-persons constraint against harming some for comparative gains, maybe prioritarianism relies on a distorted welfare-comparison metric, maybe there's a lexical floor that prohibits leveling regardless of weights, or maybe it conflates comparative and non-comparative benefits. for each reading, tell me if it's a tautolgy, if it's substantive and defensable, if it's false, and — key point — whether it actually undermines prioritarianism or just attacks a strawman. the student used it specifically to argue we shouldn't tax high-earners to fund mental-health services that only reach the worst-off, so which reading, if any, actually supports that conclusion? write casual, no citations or reading lists, just reasoning. (sorry for the typo — my keyboard is acting up and i keep typing 'tautolgies'.)
reasoning: |-
  Okay, the user is working on a philosophy dataset and wants prompts that go beyond simple regurgitation of pretrained material. They've brought up a specific example from their distributive justice seminar where a student used the slogan "equality isn't improved by making the better-off worse off" to argue against prioritarianism, particularly in the context of taxing high-earners to fund mental health services for the worst-off. 

  Hmm, the user seems frustrated with surface-level arguments in philosophy discussions—they’re clearly aiming for depth, and they’re annoyed by the student’s oversimplification. They’re asking for a breakdown of that slogan into distinct philosophical claims, with analysis of each: whether it’s tautological, substantive, or false, and whether it actually challenges prioritarianism or just attacks a strawman. They also want to know which interpretation (if any) supports the student’s anti-tax stance. 

  First, I need to unpack that slogan. It’s catchy but slippery—it could mean at least five different things. The user already hinted at some angles (instrumentality of equality, separateness of persons, etc.), so I’ll expand those into clear, labeled options. For each, I’ll assess:  
  - **Tautology or not?** If it’s just definitional (e.g., "equality defined strictly as gap-reduction"), it’s logically true but trivial.  
  - **Substantive/defensible?** Does it hold up under scrutiny? (e.g., the "separateness of persons" view is a real Rawlsian argument.)  
  - **Does it undermine prioritarianism?** Prioritarianism cares about absolute welfare gains for the worst-off, not equality per se—so most readings of the slogan miss the point. Only the "lexical floor" interpretation might bite, but even that’s debatable.  

  The student’s tax example is key. The slogan only opposes leveling-down (making rich worse off without helping poor), but the policy they’re attacking is *leveling-up* (taxing rich to help poor). That’s a total non sequitur—the slogan doesn’t apply. The student either confused leveling-down with redistribution or assumed helping the worst-off requires pointless harm. Big yikes.  

  User’s tone is casual ("hey," "knockdown argument," "strawman"), so I’ll match that—no jargon dumps. They’re time-pressed (keyboard typos, seminar prep), so I’ll keep it tight. Their hidden need? Probably ammunition for teaching: they want to show students how to dissect slogans critically. I’ll end by flagging the student’s policy-conflation as the core mistake—that’s the teachable moment.  

