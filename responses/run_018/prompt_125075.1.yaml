prompt: |-
  hey — i'm moderating a Q&A for our grad student paper series next thursday, and the guest is a historian of science who just published a piece on what she calls the "friction model" of archivcal silence. her basic claim is that absence in a record isn't just missing data; it's the result of resistance at specific nodes — creation, cataloguing, preservation, access — and that this resistance has a directional bias that usually protects institutional voices over personal ones, though she says digital storage doesn't fix it, it just relocates the friction to metadata and algorithmic retrieval. i need about eight questions, not a generic bio sketch. at least one should press her on how this differs from the standard Foucault-style archive-as-discourse framing, another on her example of labor contracts versus family letters and what the directional bias actually predicts there, and a third on whether digitization eliminates friction or just shifts it — and for each, a foloow-up keyed to the answer she's likely to give (she's good at saying "that's just a technical problem, not a conceptual one"). make it sound like i'm asking a collegue for drafting help, not like a formal assignment prompt.
