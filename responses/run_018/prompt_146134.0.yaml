prompt: |-
  Compare Fitch's paradox of knowability with Timothy Williamson's anti-luminosity argument. Specifically, Fitch derives that if all truths are in principle knowable, then all truths are actually known—a result widely taken to be absurd. Williamson denies that any interesting mental or epistemic condition is luminous, meaning there is no condition C such that being in C automatically puts one in a position to know that one is in C. Does Fitch's derivation tacitly presuppose a luminosity condition on knowledge itself—namely, that knowing p entails being able to know that one knows p? If so, assess whether accepting anti-luminosity blocks the paradox outright, or whether the derivation can be repaired by substituting a weaker, threshold-sensitive accessibility principle. Identify the precise step in Fitch's reasoning that is most vulnerable to this critique, and say whether the tension between the two positions is genuine or can be dissolved by clarifying the modality of "knowable."
