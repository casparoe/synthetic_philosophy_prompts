prompt: |-
  hey im in a philosphy elective trying to wrap my head around cranes vs skyhooks and greedy reductionism. i need the full desiderata for any theory of emergence that actually explains institutional stuff — like why a dollar bill or citizenship counts as real — without greedy reduction to brain physics or some mysterious skyhook. list what it has to cover: the specific cases (paper vs money, descriptive practices vs normative authority), the distinctions it cant collapse (like explaining-away vs explaining-up), and the science results it must stay consistant with (evolutionary continuity, neuroscience, whatever). flag which pairs of requirements might be jointly impossible, especially if blocking greedy reduction forces a hidden skyhook somewhere. separate whats settled from whats genuinely contested among people who actually study this, and dont present one camp as the obvious consensus. lead with your bottom line in the very first sentence, then the reasoning, zero preamble, and dont restate the question back at me. im just a hs student so keep it casual but im not asking for memes — i actually want the spec.
reasoning: |-
  Okay, the user is a high school student in a philosophy elective trying to understand complex concepts like cranes vs. skyhooks and greedy reductionism. They need a clear, structured breakdown of what a theory of emergence must cover to explain institutional phenomena like money or citizenship without falling into reductionism or appealing to mysterious forces. 

  First, I need to parse their exact requirements: They want the desiderata (essential features) for such a theory, covering specific cases (e.g., paper vs. money), critical distinctions (like explaining-up vs. explaining-away), and scientific constraints (evolution, neuroscience). They also want flagged tensions between requirements, plus a clear separation of settled vs. contested views in the field. 

  Notably, they emphasize avoiding framing any one camp as consensus—this suggests the debate is live and they want neutral scaffolding, not dogma. Their tone is urgent but precise ("zero preamble," "keep it casual but not memes"), so I’ll prioritize directness and clarity over academic flourish. 

  Key challenges: 
  - **Greedy reductionism**: Must avoid collapsing institutional reality to *just* neurons/physics while still grounding it scientifically. 
  - **Skyhooks**: Can’t imply magical top-down forces (e.g., "society just exists"). 
  - **Institutional ontology**: How does paper *become* money? How do norms gain authority? 

  Scientific guardrails: 
  - **Evolutionary continuity**: No sudden jumps in human cognition. 
  - **Neuroscience**: Brains encode social constructs, but constructs aren’t *just* brain states. 
  - **Cognitive development**: Kids learn institutions gradually; no innate "money module." 

  Settled ground: 
  - Institutions require collective intentionality (Searle) and feedback loops (Bickhard). 
  - Norms aren’t reducible to descriptions; they have "ought" force (Brandom). 
  - Emergence is real but not spooky (Deacon). 

  Contested zones: 
  - **Mechanism debate**: Is it all neural patterns (Churchland) or irreducibly social (Giddens)? 
  - **Causal efficacy**: Can social facts *do* anything, or are they epiphenomenal? 
  - **Cognitive glue**: What brain features enable this? Mirror neurons? Predictive coding? 

  Tensions to flag: 
  1. If institutions are *causally effective* (e.g., money changes behavior), doesn’t that require physical realization? But if we specify *how*, does that collapse to reductionism? 
  2. Evolutionary continuity vs. normative leap: How did "is" (descriptive practices) become "ought" (authority) without a skyhook? 

  Strategy: 
  - Lead with the bottom line: **"A theory of institutional emergence must explain how material things/acts gain social functions via collective practices, without reducing them to physics or invoking magic."** 
  - Then unpack desiderata in plain language, grouping by cases, distinctions, science. 
  - Highlight tensions explicitly: "Watch out—if you demand X and Y, it might force a skyhook here." 
  - Keep citations subtle (e.g., "some argue") to avoid overwhelming. 
  - Use concrete examples (dollar bills, citizenship) throughout. 

  User’s unspoken needs: They’re likely wrestling with "If everything is physical, how is money *real*?" while fearing both robotic reductionism and hand-wavy idealism. They want rigor without jargon. Also, they might need this for an essay—so clarity is key.
answer: |-
  **Bottom line:** Any theory explaining institutional emergence (like money or citizenship) must show how physical stuff/actions gain social meaning through collective human practices—without reducing them *only* to brain states (greedy reductionism) or inventing unexplained cosmic forces (skyhooks).  

  ### What the Theory *Must* Cover:
  1. **Specific Cases:**  
     - **Paper → Money:** How identical paper strips become currency (enforceable value) based on collective agreement, not physics.  
     - **Descriptive → Normative:** How observing a behavior ("people pay taxes") becomes a rule *with authority* ("you *ought* to pay taxes") backed by sanctions.  
     - **Citizenship:** How biological humans gain context-dependent rights/duties (e.g., voting) that aren’t physical properties.  

  2. **Distinctions It *Can’t* Collapse:**  
     - **Explaining-UP (good) vs. Explaining-AWAY (bad):** Explaining-UP shows how new properties (e.g., a dollar’s value) *arise* from interactions (e.g., trust networks). Explaining-AWAY *denies* those properties are real ("money is just paper, lol").  
     - **Causal vs. Constitutive:** Distinguishing *why* institutions *cause* effects (e.g., inflation changing prices) from *what makes them exist* (e.g., mutual recognition of authority).  
     - **Individual vs. Collective Intentionality:** Your brain enables you to *believe* in money, but the dollar’s value requires *shared* intentionality—it’s not just in your head.  

  3. **Science Constraints (Non-Negotiable):**  
     - **Evolutionary Continuity:** No magic jumps—human social cognition evolved from simpler animal social behaviors (e.g., primate hierarchies → constitutions).  
     - **Neuroscience Compatibility:** Brains *enable* institutions (e.g., mirror neurons for empathy, prefrontal cortex for rules), but institutions aren’t *just* brain states.  
     - **Cognitive Development:** Kids learn institutions gradually (e.g., understanding "fake money" vs. "real money")—no innate "money module."  
     - **Feedback Loops:** Institutions shape brains (e.g., growing up with money rewires neural pathways), which then sustain institutions.  

  ### Tensions & Potential Dealbreakers:  
  ⚠️ **"Causal Efficacy" vs. "No Skyhooks":** If institutions *really* cause things (e.g., a law changing behavior), they need physical implementation—but if you demand *exactly how* they push particles, you might slide into greedy reductionism. If you avoid this, does the theory sneak in hidden skyhooks?  
  ⚠️ **Normativity vs. Physics:** How do "oughts" (e.g., "you *must* respect property rights") arise from descriptive facts? If norms aren’t reducible to biology, do you need a quasi-mystical "social force"?  

  ### Settled vs. Contested:  
  **Settled (Most Agree):**  
  - Institutions require **collective intentionality** (Searle: "X counts as Y in context C").  
  - They’re **emergent**: Their properties (e.g., value) aren’t in the parts (paper/ink) but in system-wide patterns of use.  
  - **Downward causation** happens: Laws/institutions *constrain* individual actions (e.g., traffic rules directing drivers).  

  **Contested (Active Debates):**  
  1. **How "Real" Are Institutions?**  
     - *Realists*: Social facts are as real as quarks, with causal power (e.g., money markets crash economies).  
     - *Eliminativists*: Only particles/brains exist; institutions are useful fictions (risking greedy reductionism).  
     - *Pragmatists*: "Real" = what has practical consequences (e.g., money works, so it’s real-enough).  

  2. **The "Glue" Problem:** What *binds* collective intentions?  
     - *Neural synchrony camp*: Brain coupling via rituals/symbols (backed by fMRI data).  
     - *Language-first camp*: Shared syntax/semantics creates social reality (e.g., "I declare this money").  
     - *Materialists*: Institutions persist via physical artifacts (e.g., cash, passports) that reinforce norms.  

  3. **Reductionism’s Limits:**  
     - Everyone rejects *greedy* reductionism (explaining everything *only* with physics).  
     - BUT: Some say neuroscience *will* explain institutions fully (Churchland-esque); others insist social facts are *sui generis* (irreducible).  

  **Watch for Skyhook Traps:** If a theory says institutions "just emerge" without specifying *how* collective intent forms, it’s a skyhook. If it reduces citizenship to "neurons firing about paperwork," it’s greedy. The sweet spot is showing how continuous biological processes (cranes) scaffold social complexity through feedback loops.
