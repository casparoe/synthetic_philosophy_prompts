answer: |-
  Your disagreement is **substantive and philosophical**, touching on multiple interconnected layers rather than being purely verbal or bedrock intuition. Here’s a structured diagnosis:

  ### 1. **Core Tensions**  
     - **Legal vs. Moral Functions of Language**:  
       Your roommate sees "genocide" as a **legal term of art** (triggering obligations under the UN Convention), while you see it as a **moral category** (denoting a unique form of group destruction). This is a classic conflict between *positivist* (law as mechanism) and *normative* (law as moral expression) views.  
     - **Ontology of Groups**:  
       Underlying both positions is an implicit disagreement about **collective identity**. If groups are merely aggregates of individuals (your roommate’s view?), preventing summed individual harm suffices. If groups have irreducible moral status (your view?), their *destruction as entities* demands distinct recognition.  

  ### 2. **The Lemkin-UN Gap: Political or Conceptual?**  
     - **Roommate is Correct**: Lemkin’s 1944 definition *did* include cultural destruction, political groups, and coercive assimilation. The UN Convention narrowed it (excluding these) due to Cold War politics and state sovereignty concerns.  
     - **You’re Also Correct**: Even with Lemkin’s broader definition, debates persist (e.g., boarding schools, climate displacement) because **application requires interpretive judgment**. No definition automatically resolves edge cases.  

  ### 3. **Why the Debate Stalls: Three Layers**  
     | **Layer**          | **Roommate’s Focus**             | **Your Focus**                  |  
     |---------------------|----------------------------------|---------------------------------|  
     | **Function**        | Legal/practical outcomes         | Moral recognition              |  
     | **Group Ontology**  | Groups as derivative of individuals | Groups as morally salient entities |  
     | **Speech Act**      | "Genocide" as a *trigger*        | "Genocide" as a *condemnation* |  

  ### 4. **Can This Be Resolved? Tests & Case Studies**  
     - **Test 1: The "Label Without Law" Scenario**  
       Ask your roommate: *If calling something "genocide" carried no legal weight, would the term still matter?* If she says no, her view is instrumentalist. If you say yes, yours is expressive.  
       
     - **Test 2: Non-Legal Precedents**  
       Study cases where "genocide" was applied *morally/historically* without legal trials:  
       - **Cultural Genocide**: Canada’s Truth & Reconciliation Commission called residential schools "cultural genocide" (not UN Convention genocide). Did this label advance justice *without* legal mechanisms?  
       - **Holodomor**: Recognized as genocide by 16+ countries but not prosecuted. Did recognition change moral/political responses?  

     - **Test 3: Climate Displacement**  
       Analyze the *intent* and *group* questions:  
       - If low-lying island nations are erased by sea-level rise, is this "genocide" if polluting states *foresaw* destruction but prioritized profit? (Tests intent vs. recklessness).  
       - If victims aren’t a "protected group" under the UN Convention (e.g., defined by nationality, not ethnicity), does the *moral* claim still hold?  

  ### 5. **Is the Debate Ill-Posed?**  
     Partially. Genocide discourse stalls because:  
     - **It’s Overloaded**: The term tries to be legal, moral, historical, and rhetorical simultaneously.  
     - **Threshold Anxiety**: Calling something "genocide" implies a hierarchy of suffering, risking disrespect to other atrocities.  
     - **State Power**: Legal definitions exist to *constrain* accountability (states won’t label their own acts genocide).  

  ### **Path Forward**  
  Your disagreement is productive. To move beyond stalemate:  
  1. **Disaggregate Functions**: Use "genocide" legally only for UN-defined cases, but develop parallel terms for moral/historical condemnation (e.g., "atrocity crimes," "group destruction").  
  2. **Focus on Harm**: Shift debate to *specific harms* (e.g., forced assimilation, cultural erasure) rather than labels.  
  3. **Study Raphael Lemkin’s Broader Vision**: He saw genocide as a "coordinated plan" to destroy group life—arguably encompassing boarding schools and ecocide.  

  **Final Take**: The deadlock isn’t inevitable—it’s a negotiation over **whose suffering counts as world-shattering**. Your debate reveals a fundamental truth: *Genocide is not just a fact; it’s a claim about the value of human groups.* Finding common ground requires disentangling law from morality—and acknowledging both matter.
