answer: |-
  ### **Heatwave Relief: Scanlonian Allocation Challenge**  
  A 90-minute in-class game simulating a city's Cooling Board during a lethal heatwave. Scarcity forces tough choices, but players *cannot* aggregate harms—they must justify every decision to each person.  

  ---

  ### **SCENARIO**  
  **Context:** Phoenixville has 100 portable cooling pods (each provides 24 hours of relief). Total cooling: 2,400 hours.  
  **Timeframe:** A 168-hour week (7 days).  
  **Population:** 14 residents (players). Each must endure hours *without* cooling ("burden hours").  
  **Goal:** Allocate pods so no one exceeds a "burden ceiling" (max hours without cooling).  
  **Catch:** The ceiling must be set **unanimously** *before* allocation.  

  ---

  ### **KEY RULES (SCANLONIAN CONSTRAINTS)**  
  1. **No Aggregation:** No tallying total burden/relief until *after* a principle is justified to all.  
  2. **Individual Veto:** Any player can reject a ceiling or allocation if they feel it’s **unjustifiable to them personally** (use vulnerability on card).  
  3. **Burden Ceiling:** Max burden any one person bears. Must be set by unanimous vote.  
  4. **Reasonableness Threshold (Hidden):** Each card has a secret max burden they can tolerate. If the final allocation exceeds this, they *must* reject it.  

  ---

  ### **MATERIALS**  
  - **Whiteboard Layout:**  
    ```
    [PROPOSED CEILING: _____ hrs]  
    [UNANIMITY? ✓/✗]  

    PRINCIPLES PROPOSED:  
    1. "Equal burden" [Rejected by: Role 3, Role 7]  
    2. "Priority to sickest" [Rejected by: Role 11]  
    ...  

    ALLOCATION GRID (if ceiling set):  
    Role 1: 120h cooling | 48h burden  
    Role 2: 90h cooling | 78h burden  
    ...  
    ```  
  - **Role Cards (14):** Index cards with:  
    - **Role description**  
    - **Vulnerability** (reason to reject unfair burdens)  
    - **Hidden Threshold** (max burden they can bear)  
    - **Sample threshold range:** *40 hrs (infant) to 120 hrs (healthy adult)*.  

  ---

  ### **ROLE CARD EXAMPLES**  
  *(Assign thresholds ensuring min/max conflict; e.g., one "threshold 40", one "threshold 120")*  
  1. **Asthmatic Elderly (Role 1):**  
     *"You use an oxygen tank. Heat worsens breathing. If burden > 50hrs, risk of hospitalization."*  
     **Threshold:** 50 hrs (hidden).  
  2. **Single Parent + Infant (Role 2):**  
     *"Infant overheats easily. You need cooling at night. If burden > 40hrs, infant gets seizures."*  
     **Threshold:** 40 hrs (hidden).  
  3. **Outdoor Laborer (Role 3):**  
     *"You work 10hrs/day in sun. No cooling = heat exhaustion. Can tolerate burden ≤ 110hrs."*  
     **Threshold:** 110 hrs (hidden).  
  4. *[... 11 more roles with escalating thresholds]...*  

  ---

  ### **GAME ROUNDS (90 MIN TOTAL)**  
  #### **0. Setup (10 min)**  
  - Hand out role cards. Assign one player as **Facilitator** (runs votes, tracks whiteboard).  
  - Explain: *"Any principle/allocation must be justifiable to EACH person BEFORE totals matter."*  

  #### **1. Principle Proposal (15 min)**  
  - Players propose allocation principles (e.g., "equal burden," "most vulnerable first").  
  - **Vote:** Each principle requires unanimous acceptance.  
  - **Rejection Rule:** If rejected, rejecter states: *"I can’t accept this because [vulnerability]."*  
  - **Facilitator:** Log rejections on whiteboard.  
  - *Predicted Snag:* Players sneak in aggregate logic ("But this helps more people!"). **Intervene:** "Would *you* accept this if you were Role 2?"  

  #### **2. Ceiling Setting (25 min)**  
  - Players propose burden ceilings (e.g., "max 80hrs/person").  
  - **Vote:** Unanimity required. If one veto, ceiling fails.  
  - **Twist:** The player with the *lowest threshold* (e.g., Role 2, threshold 40) *must* reject ceilings >40. But if they propose 40, high-threshold players reject it (forces too much cooling on few, leaving little for others).  
  - **Deadlock Moment:** Players realize they can’t set *any* ceiling without unanimous consent.  
  - *Predicted Snag:* Players form coalitions to pressure low-threshold vetoers. **Intervene:** "Can Role 2 justify accepting a 50hr ceiling? Remember their infant."  

  #### **3. Allocation Attempt (20 min)**  
  - **IF** a ceiling is set, allocate cooling hours so no one exceeds it.  
  - **Rejection Rule:** Any player can veto if allocation ignores their vulnerability (e.g., Role 1 gets 100hrs cooling but needs 118hrs to stay under *their* threshold).  
  - **IF no ceiling:** Players try ad-hoc allocation. Guaranteed vetoes.  
  - **Social Stakes Payoff:**  
    - After votes, players award **"Reasonableness Tokens"** (poker chips) to peers who:  
      - Justified rejections persuasively.  
      - Listened to others’ vulnerabilities.  
    - Tokens = social credibility (no monetary value).  

  #### **4. Debrief (20 min)**  
  - **Map to Scanlon:**  
    - *"The ceiling deadlock mirrors Scanlon’s tension: justifying to each person blocks ‘easy’ aggregation. You hit the wall."*  
    - *"The veto power forces you to confront individual reasons—e.g., the infant’s seizures can’t be ‘traded’ for five workers’ discomfort."*  
  - **Honest Limitations:**  
    - The game *approximates* non-aggregation via vetoes, but real life tempts us to tally totals. Scanlon’s deeper point—that moral reasons don’t sum across persons—requires *you* to underscore: *"Notice how aggregation felt ‘natural’ when deadlocked? That’s the tension."*  
  - **Discussion Prompts:**  
    - *"When did you feel forced to ignore your role’s needs? How did it feel?"*  
    - *"Did the ‘reasonableness’ tokens reward Scanlonian behavior or political skill?"*  

  ---

  ### **PREDICTABLE SNAGS & SOLUTIONS**  
  - **"Players tally aggregates secretly":** Have the Facilitator *publicly shame* tallying ("No math until everyone says yes!").  
  - **"High-threshold players bully low-threshold ones":** Redirect to vulnerabilities ("Role 2, can *you* justify accepting that?").  
  - **"Unanimity takes forever":** Let them stew in deadlock—frustration teaches the point.  
  - **"Boring if too harmonious":** Assign extreme thresholds (e.g., one 40hr, one 120hr).  

  ### **TIMELINE**  
  ```  
  0-10m: Setup & Roles  
  10-25m: Principle Proposals (15 min)  
  25-50m: Ceiling Setting (25 min)  
  50-70m: Allocation Attempt (20 min)  
  70-90m: Debrief (20 min)  
  ```  

  **Final Tip:** Start with, *"Today, you can’t ‘add up’ suffering. Justify everything to the person in front of you."* Lean into the chaos—the deadlock *is* the lesson.
