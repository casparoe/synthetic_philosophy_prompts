  First, the user needs an explanatory arc. The key challenge is introducing the concept of verbal disputes without making parties feel dismissed. I should start with common ground: mediators always identify what parties agree on. This sets a neutral foundation. Then introduce the idea that disagreements can be about facts or word meanings, using a relatable example like "harassment."

  For the carrying example, it needs real stakes but a clear semantic hinge. A landlord-tenant case about "harassment" works well. The landlord texts about repairs - is this harassment? Both sides agree on the facts (text frequency) but disagree on the word's meaning. This keeps the dispute tangible while highlighting the linguistic element.

  The diagnostic tool should involve stipulation: "If we define harassment as X, do you still have a problem?" Trainees can practice this in pairs. I must warn about failure modes, like parties rejecting hypotheticals or emotional resistance.

  Common misconceptions: verbal = trivial, dictionary-solvable, or insulting. Address these proactively when introducing the term "verbal dispute." Emphasize that meaning shapes reality and dictionaries can't resolve contextual disagreements. Stress that identifying verbal disputes is respectful problem-solving.

  For assessment, a role-play exercise where trainees identify dispute types would work. Avoid philosophical tangents - explicitly state that abstract debates about existence are out of scope, framing it as focusing on practical mediation tools.

  The user's deeper needs include empowering volunteers with actionable skills, preventing escalation of verbal disputes, and maintaining neutrality. The workshop must balance theory with practice, using relatable examples and clear tools they can apply immediately.
answer: |-
  Here’s a structured workshop plan focused on practical recognition and handling of verbal disputes in mediation, tailored for non-philosophers:

  ---

  ### **Explanatory Arc & Sequence**
  1. **Start with Agreement Hunting** (15 mins)  
     *Why*: Trainees already know mediators identify common ground first. Show that *even in heated disputes*, parties often agree on concrete facts. This establishes neutrality and prevents the "arguing over nothing" perception.  
     *Key script*: "Our first job is to find where parties *aren’t* fighting. What facts do both sides accept?"  

  2. **Introduce the Two Disagreement Types** (20 mins)  
     *Prerequisite*: Establish that factual agreements exist. Now contrast:  
     - **Substantive disputes**: "They agree on what words mean but clash over what *happened* or what’s *true*."  
       *Example*: "Both agree ‘harassment’ means unwanted contact. They fight over *whether* the texts were unwanted."  
     - **Verbal disputes**: "They agree on what *physically occurred* but clash over how to *label* it."  
       *Example*: "Both agree the landlord sent 5 texts/week about repairs. They fight over whether that’s ‘harassment.’"  
     *Why this order*: Grounding in agreed facts makes "labeling fights" feel concrete, not dismissive.  

  ---

  ### **Carrying Example: "After-Hours Disturbance"**  
  *Features*:  
  - **Real stakes**: Tenant demands rent reduction over landlord’s "excessive after-hours noise" during basement renovations.  
  - **Semantic hinge**: Both agree the noise occurred (drilling, 8–9 PM, 3 nights). Conflict hinges on whether "after-hours" means *after 5 PM* (tenant) or *after 10 PM* (landlord, per lease).  
  - **Avoids**: Emotional triggers (e.g., "harassment" initially inflames). Clear factual agreement makes the semantic core isolatable.  

  ---

  ### **Live Diagnostic: The "Meaning Swap" Test**  
  - **When to introduce**: After defining verbal disputes (min 35).  
  - **How it works**:  
    1. Mediator asks: *"If we all agree the noise happened at 8 PM, and if we define ‘after-hours’ as starting at 10 PM, would this still be a problem?"*  
    2. If tenant says *"No, but it’s not 10 PM!"* → **verbal dispute**.  
    3. If tenant says *"Yes, 8 PM is unreasonable regardless of the label!"* → **substantive dispute** (now explore fairness).  
  - **Failure modes**:  
    - Parties reject hypotheticals ("But that’s *not* what it means!").  
      *Fix*: "I’m not changing definitions yet—just testing where the disagreement lies."  
    - Stakes obscure clarity (e.g., tenant fears "losing" if they concede).  
      *Fix*: "This isn’t about who’s right—it’s about finding the root of the conflict so we can fix it."  

  ---

  ### **Misconceptions & Preemptive Solutions**  
  1. **"Verbal = trivial"**  
     *When it surfaces*: When introducing the term.  
     *Preempt*: "Words shape reality. Calling a noise ‘after-hours’ triggers lease penalties. The label *is* the substance here."  

  2. **"A dictionary will solve this"**  
     *When it surfaces*: During the Meaning Swap test.  
     *Preempt*: "Dictionaries give broad meanings. Leases, laws, and personal thresholds create context-specific definitions. We mediate those gaps."  

  3. **"Labeling it ‘verbal’ insults the parties"**  
     *When it surfaces*: When distinguishing dispute types.  
     *Preempt*: "This isn’t about ‘just semantics.’ It’s about spotting *why* two reasonable people feel wronged despite agreeing on facts."  

  4. **"Mediators must define the word for them"** (New!)  
     *When it surfaces*: During practice.  
     *Preempt*: "Our role isn’t to play judge. It’s to help *them* unpack their definitions and find a shared solution."  

  ---

  ### **Closing Assessment: Role-Play Triage**  
  - **Exercise**: Trainees pair up. Give each a dispute scenario (mix of substantive/verbal). In 3 mins, they must:  
    1. Identify one agreed-upon fact.  
    2. Run the Meaning Swap Test.  
    3. Classify the dispute.  
  - **Success looks like**: "They agree the dog barked for 10 minutes. If ‘nuisance’ means ‘over 30 mins,’ the tenant concedes—so this is verbal. Solution: Renegotiate the lease’s ‘nuisance’ clause."  

  ---

  ### **Out-of-Scope Boundary**  
  - **What to exclude**: Deep philosophical debates (e.g., "Does ‘justice’ *really* exist?").  
  - **Script to shut it down**: **"While philosophers love wrestling with those questions, our focus tonight is on practical tools to untangle real-time conflicts where words become roadblocks."**  

  ---

  ### **Workshop Flow**  
  1. **Intro & Agreement Hunting** (15 mins)  
  2. **Two Dispute Types + Example** (20 mins)  
  3. **Meaning Swap Test Demo** (15 mins)  
  4. **Misconception Q&A** (10 mins)  
  5. **Paired Role-Play** (30 mins)  
  6. **Debrief & Assessment** (20 mins)  
  7. **Conclusion & Boundary** (10 mins)  

  This arc moves from *known skills* (finding agreement) to *new distinctions*, using a relatable example to avoid abstraction. The Meaning Swap Test gives a hands-on tool, while preempting misconceptions keeps focus on empowerment, not theory.
