  **Form & Philosophy Notes**:  
  - The villanelle’s circularity *enacts* the wasp’s loop, trapping reader and subject in repetition.  
  - Final quatrain’s dual questions crystallize the debate: human reflection may *feel* like escape, but the closing refrains undercut certainty by mirroring the wasp’s resumption.  
  - Delivery tip: Read the last two refrains slowly. Let the repetition linger—the silence after "start again" is where the students’ dilemma lives.
