  I'm a phil mind/cog sci PhD student and I've been teaching a section on Dennett's sphex wasp example -- the digger wasp that drags the cricket to the burrow entrance, goes in to check, and if you nudge the cricket a few inches she just resets and does the whole sequence again, forever, never noticing. The standard line is that this mechanical loop is what we'd be without reflection, but half my students pushed back and said human "deliberation" is just a fancier loop, and honestly I didn't have a great answer.

  Write me a villanelle (19 lines, the usual two refrains) about the wasp that stages this. I want the two refrains to be the repeated steps of her loop -- drag, drop, go inside, come back out -- so the form itself does the sphexishness, the same lines coming round and round like her behavior. But then the closing quatrain, where the refrains have to meet, should be where the poem turns on the free will question: does standing back and reflecting actually break the loop, or is it just one more step in a longer loop we can't see? Don't resolve it cleanly for either side -- I want to read it out at the end of the section and let the form make the point.

