prompt: |-
  I've got to run a session for my history-of-science reading group — grad students, zero econ background — on path dependence: is history actually "locked in," or would the same outcomes have arrived anyway? Don't explain the idea to me; plan how I'd teach it. What's the dependency order — what concept has to land before "locked in" even makes sense to them? Pick one carrying example besides QWERTY, since everyone's tired of that — I'm thinking the 1884 Greenwich meridian vote, but frame it specifically to highlight arbitrary institutional lock-in rather than technical superiority — and say exactly what that example needs to show and what it must avoid conflating with determinism. Then map the miscoceptions in the sequnce they'll form: determinism first, then "anything could have happened," then the idea that merit always wins eventually. Where in the arc do I head off each? Also tell me what I should openly refuse to explain at this level and just say so. Finish with one check question that proves they've actually grasped path dependence rather than just repeating the example back. Write it in American English, keep it tight, and don't include any reading lists or bibliographies.
reasoning: |-
  Okay, the user is prepping a session on path dependence for a history-of-science reading group. They want to avoid QWERTY and use the 1884 Greenwich meridian vote instead. The key is to frame it as institutional lock-in, not technical superiority. 

  First, I need to unpack the dependency order. Before "locked in" makes sense, they must grasp contingency—history isn't predetermined but has branching points. Then comes the irreversibility concept: choices get sticky due to increasing costs of switching. Only after that can "lock-in" land properly. 

  For the Greenwich example, the setup must highlight two things: 1) The vote was genuinely arbitrary (Greenwich had no overwhelming technical edge over Paris), and 2) Coordination effects snowballed once adopted—maps, treaties, tech standards reinforced it. Crucially, avoid implying technical inferiority; the point is that any meridian could've worked but switching now is impossible. 

  Misconception sequence matters. Determinism will creep in first—counter by stressing contingency early ("vote could've gone either way"). Then the "anything goes" fallacy: clarify that post-lock-in, alternatives aren't equally possible anymore. Finally, the meritocracy trap: Greenwich won because it got stuck, not because it was best. Preempt each right after introducing the linked concept. 

  What to refuse? No deep dives into network effects math or evolutionary bio analogies. Stay focused on historical institutionalism. 

  The check question: "If France had won the vote, would we still use Paris today?" Correct answer isn't yes/no—it’s "Yes, and switching would be equally hard now." That proves they get lock-in, not just contingency.
answer: |-
  Here’s a tight, actionable teaching plan targeting your goals:  

  **Dependency Order (Build Concepts Sequentially):**  
  1. **Contingency** → 2. **Increasing Returns** → 3. **Irreversibility** → 4. **Lock-In**  
  *(Lock-in only makes sense AFTER they see how small events + feedback loops create rigidity)*  

  **Core Example: 1884 Greenwich Meridian Vote**  
  - **What to Highlight**:  
    - Arbitrary origin: Greenwich won by 22-1 vote (France abstained!), not technical superiority. Paris was equally viable.  
    - Coordination feedback: Once adopted, maps/charts/treaties/training *required* consistency. Switching costs became astronomical.  
    - Modern consequence: GPS/software still uses Greenwich today despite technical alternatives (e.g., GPS could use UTC).  
  - **What to Avoid Conflating**:  
    - ✗ **Determinism**: Stress that pre-1884, *many meridians were possible*. Post-1884, alternatives were *structurally suppressed*.  
    - ✗ "Merit wins": Greenwich isn’t "better"—it’s **sticky**. Tech didn’t override it; it *inherited* the standard.  

  **Misconception Sequence & Preemptive Strikes:**  
  1. **"History was inevitable" (Determinism)**  
     - *When to head off*: RIGHT after introducing contingency (e.g., "Why did Greenwich win?").  
     - *Strike*: "Vote could’ve gone to Paris with 2 changed ballots. Would railways/telescopes be worse? No—*coordination* mattered, not physics."  

  2. **"Anything could’ve happened" (Chaos ≠ Path Dependence)**  
     - *When*: After showing feedback loops (e.g., "How did treaties 'cement' Greenwich?").  
     - *Strike*: "Once critical mass adopts it, *viable options narrow*. It’s not random—it’s constrained by prior choices."  

  3. **"Superior alternatives always win eventually" (Teleology)**  
     - *When*: When discussing modern implications (e.g., "Why not switch to a 'better' system?").  
     - *Strike*: "Merit can’t penetrate when retooling *every ship, map, and satellite* costs billions. Lock-in overrides 'better'."  

  **What to Refuse to Explain (Declare Upfront):**  
  - "We won’t dive into econ modeling (network effects, sunk costs) or evolutionary bio parallels. Focus: *how historical accidents fossilize*."  

  **Check Question to Prove Grasp (Not Recitation):**  
  > *"Imagine France won the 1884 vote. Would the International Meridian still be in Paris today? Why couldn’t the 'better' Greenwich system overtake it later?"*  
  - **Correct Insight**: "Yes—Paris would be locked in. Switching costs (re-tooling global infrastructure) would outweigh any technical edge Greenwich might claim."  

  **Session Flow Outline:**  
  1. Hook: "Why is *this* meridian on your phone’s GPS?" → Contingency (pre-1884 options).  
  2. Case Study: Greenwich vote → Arbitrary institutional choice.  
  3. Feedback Mechanisms: Treaties, colonialism, tech standards → Increasing returns.  
  4. Irreversibility: 20th-century consequences → Lock-in.  
  5. Misconception Takedowns: Q&A targeting determinism/chaos/merit.  
  6. Check Question: Test transferability.  

  **Keep it Tight**: Use the meridian example as a through-line. No tangents—every concept traces back to it.
