  ## Diary, Locked

  This ache I seal inside my **box** of bone,
  Assigns a **name** I learned in public light.
  But here, alone, the word feels strangely **empty**,
  A label scratched for something meant the **same**
  Each time it gnaws. Yet meanings subtly **drift**
  Like fog. No friend can **check** if this is right.

  What was that stab? A ghost? I try to **check**
  My past notes, squinting at the battered **box**
  Where scribbles swim. Definitions **drift**.
  Did yesterday’s sharp twinge earn this **name**?
  I *think* I felt that essence, quite the **same**...
  But certainty dissolves, leaves pages **empty**.

  The inkwell’s drying, mirroring this **empty**
  Certainty. Did Tuesday’s throb withstand my **check**?
  I wrote "deep ache," insisting it the **same**
  As Monday’s fire locked within its **box**.
  But was it? Just a sound, a hollow **name**
  Repeated, while the feeling learned to **drift**.

  A phantom limb? Or did the real pain **drift**
  Away entirely? Leaving just the **empty**
  Ritual of writing down its **name**
  Again. No yardstick for the private **check**,
  No shared world anchoring this inner **box**.
  Is *this* today’s? Can I insist it’s **same**?

  The doubt corrodes. Can anything stay **same**
  Within the skull? Each hour brings a **drift**
  Of sense, a shifting tenant in the **box**.
  The word grows cold, increasingly **empty**,
  A ritual performed without a **check**
  On what it signifies beyond the **name**.

  I clutch the pen, assign the fading **name**
  "Pain." But yesterday’s? Is it the **same**?
  There is no bedrock for a true **check**,
  No anchor point. The references **drift**
  On seas unseen, leaving records **empty**,
  Just scratches near a picture of a **box**.

  This locked **box** holds a **name** that’s turning **empty**.
  The ache feels **same**? No, meanings **drift** beyond my **check**.

  ---

  ### Commentary on the Form

  The sestina’s rotating end-words – **box, name, empty, same, drift, check** – formally enact the diarist’s struggle for consistent private reference. Each word represents a crucial element of the argument:

  1.  **Box**: The private container (like Wittgenstein’s beetle-box), isolating the sensation.
  2.  **Name**: The attempt to label the private object ("pain").
  3.  **Empty**: The hollowness of the private signifier without public criteria.
  4.  **Same**: The impossible goal of consistent application across time.
  5.  **Drift**: The semantic instability inherent in private language.
  6.  **Check**: The missing public verification needed for meaning.

  As the words cycle through their predetermined positions in each stanza, their forced recurrence mimics the diarist's repeated attempts to latch the *same* word onto the *same* private sensation (Monday's "pain" onto Tuesday's). However, the *context* of each word shifts subtly with each stanza. The "box" moves from container to coffin; the "name" shifts from label to hollow sound; the "check" transforms from active verification to futile ritual. This contextual slippage, inherent in the sestina’s structure, embodies the "latch slipping." The words return, demanding identical reference, but their meaning subtly **drifts**, revealing the **emptiness** of insisting they signify the **same** thing without a **check**, trapped within the isolating **box**. The form itself argues: rigid repetition cannot guarantee stable meaning without public criteria.
