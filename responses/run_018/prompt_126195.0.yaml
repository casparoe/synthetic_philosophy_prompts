prompt: |-
  Draft the complete desiderata specification for a theory of the biological species category, where adequacy is measured against three concurrent demands: accounting for evolutionary processes, underwriting practical conservation taxonomy, and accommodating fossil-lineage classification. For each requirement, supply the motivating biological case or conceptual distinction — including but not limited to hybridization zones, obligate asexual reproduction, chronospecies in deep time, cryptic morphological convergence, and the divergence between reproductive isolation and ecological-role differentiation. Mark which requirements are non-negotiable across all three domains and which are camp-specific preferences, and flag any subset of desiderata that current evolutionary theory suggests is jointly unsatisfiable, especially where monophyletic grouping conflicts with reproductive cohesion in reticulate or hybrid-speciation contexts. Conclude with a brief comparative assessment of how the Biological Species Concept, the Phylogenetic Species Concept, and a domain-pluralist approach fare against the list, identifying for each the single desideratum that does the most damage. Weight your answer toward the criteria and their internal tensions rather than toward an exhaustive taxonomy of examples.
reasoning: |-
  Okay, the user is asking for a comprehensive specification for a theory of biological species that must satisfy three demands: evolutionary processes, conservation taxonomy, and fossil classification. They want the desiderata to be clearly laid out with motivations from cases like hybridization or asexual reproduction. I need to identify non-negotiable requirements and camp-specific preferences, plus any conflicts where evolutionary theory suggests impossibility.

  First, I should map out the core tensions. The big one is reproductive cohesion vs. monophyly – they directly clash in hybrid speciation scenarios. Non-negotiable requirements must work across all domains: process-based definition (evolution), operational utility (conservation), and time-agnostic classification (fossils). Conservation prioritizes diagnosability, while fossils need chronospecies flexibility. 

  For asexual organisms, reproductive isolation is meaningless – that'll torpedo any concept requiring it. Cryptic species are another pain point: morphologically identical but reproductively isolated, forcing conservationists to choose between ecology and genetics. 

  Now structuring the desiderata. Group them by domain but highlight overlaps. Process requirements need mechanisms like gene flow barriers; conservation needs stable units for legislation; fossils require non-circular lineage segmentation. The hybridization zone example perfectly illustrates the cohesion-monophyly conflict – populations are interbreeding but not monophyletic. 

  Assessing existing concepts: BSC fails hard on asexuals and fossils. PSC handles fossils but creates oversplit units that break cohesion. Pluralism avoids theoretical headaches but feels unsatisfying for unification. 

  Biggest damage points: BSC's reproductive requirement collapses with Bdelloid rotifers. PSC's diagnosability requirement ignores functional cohesion in ring species. Pluralism's lack of universality bothers theorists. 

  User seems theoretically sophisticated – probably a grad student or researcher. Their hidden need might be understanding why no perfect solution exists, hence emphasizing conflicts. I'll conclude by stressing that the desiderata reveal incompatible biological truths rather than framework flaws.
answer: |-
  ## Desiderata Specification for a Biological Species Theory

  **Core Tension:** Reconciling the dynamic, reticulate nature of evolution (processes) with the need for discrete, stable units for conservation & classification, especially across deep time where evidence is fragmentary.

  ### I. Desiderata Rooted in Evolutionary Processes
  1.  **Accommodate Lineage Formation & Divergence:** Model how barriers to gene flow (geographic, ecological, behavioral, genetic) arise and are maintained, leading to population differentiation and potential speciation. *(Motivation: Allopatric/sympatric speciation models, adaptive radiation)*
  2.  **Handle Reticulation:** Account for gene flow between diverging lineages (introgression) and hybrid speciation without collapsing distinct lineages. *(Motivation: Hybridization zones (e.g., *Warblers*, *Canis*), hybrid species (e.g., *Heliconius* butterflies, some sunflowers), adaptive introgression)*
  3.  **Incorporate Mechanisms Beyond Reproduction:** Recognize that speciation can be driven by divergent ecological selection, even with some gene flow. *(Motivation: Divergence despite gene flow (e.g., *Timema* stick insects), ecological speciation)*
  4.  **Acknowledge Asexuality:** Provide a coherent account for lineages reproducing without sexual recombination. *(Motivation: Obligate asexuals (e.g., Bdelloid rotifers, some lizards, fungi), highly selfing plants)*
  5.  **Model Lineage Cohesion & Fuzziness:** Describe the forces (gene flow, selection) holding populations together as a unit *and* the inherent fuzziness at boundaries during divergence. *(Motivation: Ring species, widespread species with clinal variation)*
      *   **Non-Negotiable:** 1, 2, 4 (Process essentialism).
      *   **Camp Preference:** Degree of emphasis on reproductive vs. ecological mechanisms (3).

  ### II. Desiderata Rooted in Practical Conservation Taxonomy
  6.  **Operational Diagnosability:** Enable reliable identification/delimitation using observable characters (morphological, genetic, behavioral, ecological) in the field or lab. *(Motivation: Legal protection, population monitoring, habitat management)*
  7.  **Reflect Evolutionary Potential:** Correspond to units with shared evolutionary trajectory and fate, maximizing intraspecific genetic diversity relevant for adaptation. *(Motivation: Preserving adaptive capacity, managing evolutionary significant units - ESUs)*
  8.  **Stability & Predictability:** Minimize frequent taxonomic revisions disrupting legislation, management plans, and communication. *(Motivation: Endangered Species Act listings, CITES, conservation funding)*
  9.  **Account for Cryptic Diversity:** Detect and recognize distinct evolutionary lineages despite morphological similarity. *(Motivation: Conservation of genetically distinct but cryptic species (e.g., many amphibians, insects, microbes) overlooked by morphology alone)*
  10. **Prioritize Cohesion over Deep History (Sometimes):** Recognize evolutionarily recent, ecologically cohesive units even if deep monophyly is unresolved or complex. *(Motivation: Managing distinct local adaptations or ecotypes within a broader lineage)*
      *   **Non-Negotiable:** 6, 9 (Practical necessity).
      *   **Camp Preference:** 10 (Cohesion focus over deep monophyly).

  ### III. Desiderata Rooted in Fossil-Lineage Classification
  11. **Time-Transgressive Applicability:** Define units consistently across temporal slices of a continuously evolving lineage. *(Motivation: Classifying chronospecies in a single, unbranched lineage over geological time)*
  12. **Handle Incomplete Evidence:** Be applicable based on preserved characters (primarily morphology, sometimes biochemistry/geochemistry) without requiring knowledge of reproductive compatibility or soft-tissue ecology. *(Motivation: Fossil record limitations)*
  13. **Define Lineage Segments:** Provide criteria for recognizing distinct segments (species) within a continuous, anagenetically evolving lineage. *(Motivation: Practical paleontological classification, communication about morphological stages)*
  14. **Accommodate Morphological Convergence:** Distinguish lineages that are morphologically similar due to convergent evolution rather than shared recent ancestry. *(Motivation: Correctly identifying relationships despite similar adaptations (e.g., shark/dolphin body shape, saber-toothed mammals))*.
  15. **Integrate with Phylogeny:** Be compatible with cladistic methods and the goal of recognizing monophyletic groups where branching occurs. *(Motivation: Reconstructing evolutionary history from fossils)*
      *   **Non-Negotiable:** 11, 12, 13 (Fossil reality).
      *   **Camp Preference:** Weight given to morphology vs. inferred phylogeny (14, 15).

  ### IV. Flagged Conflicts & Joint Unsatisfiability

  *   **Fundamental Conflict (Process vs. Classification):** **Reproductive/Ecological Cohesion (I.3, I.5, II.10) vs. Strict Monophyly (III.15, II.7 deep interpretation).** Evolutionary theory (esp. phylogenomics) shows these are often *incompatible*:
      *   **Hybrid Speciation:** A new, cohesive lineage (e.g., *Heliconius heurippa*) is *not* monophyletic; its genome is a mosaic derived from two parental species.
      *   **Reticulate Evolution:** In groups with frequent hybridization/introgression (e.g., oaks, corals), "species" often form networks or fuzzy clouds rather than strictly bifurcating, monophyletic clades. Gene trees conflict with species trees.
      *   **Anagenesis (III.11):** A chronospecies lineage evolving gradually over time is a single cohesive unit but cannot be subdivided into monophyletic segments without arbitrary cutoffs conflicting with process cohesion.
  *   **Asexuality Challenge:** Desiderata I.1 (barriers), I.2 (reticulation), and II.7 (shared fate via gene flow) are largely irrelevant or inapplicable to obligate asexuals (I.4), requiring a fundamentally different cohesion mechanism (e.g., clonal competition, mutation accumulation).

  ### V. Comparative Assessment of Concepts

  1.  **Biological Species Concept (BSC):** *Based on reproductive isolation.*
      *   **Strengths:** Strong on I.1, I.2 (if hybrids sterile), I.5 (cohesion via isolation), II.7 (potential).
      *   **Critical Weakness (Most Damaging Desideratum):** **I.4 (Asexuality).** Utterly fails for obligate asexuals. Also weak on III.11-13 (Fossils, no reproductive test), II.9 (Cryptic species - morphologically identical but isolated), and struggles with II.10/III.15 conflict in hybrid speciation.
  2.  **Phylogenetic Species Concept (PSC - Diagnosability Version):** *Based on monophyly OR smallest diagnosable cluster.*
      *   **Strengths:** Strong on II.6 (Diagnosability), II.9 (Cryptic), III.12-15 (Fossils, monophyly/morphology), I.4 (Asexuals - via diagnosability).
      *   **Critical Weakness (Most Damaging Desideratum):** **I.5 / II.10 (Cohesion & Shared Fate).** Risks severe oversplitting (e.g., every local population with a fixed difference). Ignores gene flow and ecological cohesion within diagnosable units (ring species, widespread species). Creates units irrelevant to evolutionary processes or conservation management of cohesive populations. Weak on I.2 (Reticulation - forces arbitrary splits in networks).
  3.  **Domain-Pluralist Approach:** *Uses different concepts (BSC, PSC, Ecological) in different contexts.*
      *   **Strengths:** Pragmatically strong on II.6, II.9, III.11-13, I.4. Avoids forcing one model onto incompatible realities. Can satisfy camp-specific preferences (II.10, III.15).
      *   **Critical Weakness (Most Damaging Desideratum):** **The Lack of Universality (Implicit in all Domains).** Fails to provide a single, coherent theoretical account of what a species *is* across biology (I.1, I.2, I.3 core). Feels theoretically unsatisfying and can lead to inconsistency (same lineage classified differently in different domains/time periods). Weak on deep theoretical synthesis.

  ### Conclusion: The Weight of the Tensions
  This desiderata list highlights the central, perhaps insurmountable, tension at the heart of the species problem: **the conflict between viewing species as dynamic, often fuzzy evolutionary *processes* (emphasizing cohesion, mechanisms, reticulation) versus needing them to be discrete, stable *units* for classification and conservation (emphasizing diagnosability, monophyly, stability).** Evolutionary theory, particularly the prevalence of reticulation, incomplete lineage sorting, and asexuality, demonstrates that no single concept can simultaneously satisfy the core non-negotiable demands of all three domains (process description, practical conservation utility, fossil classification) without significant compromise or contextual adjustment. The desiderata expose fundamental biological realities that pull in opposing directions, making the search for a universal "theory of the species category" likely quixotic. The best solutions will acknowledge these tensions explicitly, perhaps embracing pluralism pragmatically while continuing to refine process-based models for understanding diversification.
