  For a new case to split the rules: maybe a chess-playing AI that uses only lookup tables for precomputed moves versus one that uses heuristics. The lookup table version would test if she values actual computation over mere behavior. Another idea is a human in a fugue state performing complex tasks without awareness. If she attributes belief here, it reinforces intentional stance; if not, she might require consciousness.

  Confidence-wise: I'm pretty sure about her using intentional stance, especially given her "yes" to blindsight. But I'm less confident about why she excluded the corporate board. Is it because groups can't have beliefs, or is it about her definition of agency? That ambiguity is tricky. Also, the LLM being a "yes" might hinge on its ability to generate responses, not just retrieve them, but the oracle AI is pure retrieval, so that could be a point of contention.

