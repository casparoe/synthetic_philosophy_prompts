  Now, the oracle AI: a lookup table with pre-stored answers. No computation, no internal model. If the partner's rule is about behavioral flexibility, this AI might still get a "yes" because it reliably answers questions correctly. But if her rule requires internal representations or inference, she might say "no" because it's just retrieving data without understanding.

