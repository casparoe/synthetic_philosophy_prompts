answer: |-
  ## Joint Statement: Remedial-Right & Primary-Right Democratic Secessionists on Scotland, Catalonia, & Quebec

  **After 12 months of vigorous (and occasionally adverserial) debate, we, signatories representing Remedial-Right Secessionism (RRS) and Primary-Right Democratic Secessionism (PRDS), find substantial agreement on foundational principles while acknowledging persistent, fundamental disagreements. We present this statement to clarify our common ground, map our divergences neutrally, and identify specific cruxes for future deliberation.**

  **I. Agreed Claims:**

  1.  **Inevitable Nested Minorities:** Secession inevitably creates new internal minorities within the seceding entity (e.g., Unionists in Scotland, Spanish-speakers in Catalonia, Anglophones in Quebec). Managing their rights and potential claims is a core challenge *after* any successful secession.
  2.  **Limited Intergenerational Binding:** While constitutions and unions create legitimate expectations, no generation can be considered absolutely bound by the decisions of past generations in perpetuity regarding fundamental political status. Democratic legitimacy requires mechanisms for meaningful contemporary consent.
  3.  **Referendum as Renewable Mandate:** A referendum result, whether pro- or anti-secession, is not a permanent, one-time settlement for all future generations. Changing circumstances, evolving identities, and new democratic expressions can renew the legitimacy of the question. The specific *threshold* for revisiting it, however, is contested.
  4.  **Procedure Matters:** Any secession process, whether remedial or primary, requires clear, agreed-upon, transparent, and fair procedural rules *beforehand* (e.g., franchise, question wording, majority threshold, oversight) to be considered legitimate by both the seceding entity and the host state.
  5.  **Democratic Deficit as a Factor:** Systemic exclusion, persistent failure of accommodation, or denial of meaningful self-government within the existing state *can* strengthen a secessionist claim, though its necessity is disputed (See Disagreements).

  **II. Disagreements (Neutrally Stated):**

  | Topic                      | Remedial-Right (RRS) Position                                                                 | Primary-Right Democratic (PRDS) Position                                                                 |
  | :------------------------- | :-------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **Justification Basis**    | Secession is only justified as a *remedy* for severe, persistent injustice or denial of fundamental rights/democratic voice within the existing state. | Secession is a primary democratic right; a territorially concentrated group has the inherent right to choose its political status via a fair democratic process, *regardless* of prior injustice. |
  | **Referendum Threshold**   | A supermajority (e.g., 60%+) is typically required due to the gravity of dissolving an existing constitutional order. | A simple majority (50%+1) of valid votes cast in a free and fair referendum is sufficient; higher thresholds undemocratically privilege the status quo. |
  | **"Right" vs. "Remedy"**   | Framing secession as a "right" risks trivializing it; it should be understood as an exceptional remedy necessitated by failure. | Framing secession only as a "remedy" unjustly subordinates the democratic will to contested judgments about past conduct. |
  | **Role of Host State Consent** | Legitimate secession generally requires negotiation and agreement with the host state, grounded in constitutional or international law principles. | While negotiation is desirable, the host state's *consent* is not a prerequisite for a democratic mandate to be considered legitimate; obstructionism cannot veto self-determination. |

  **III. Identified Verbal Disagreements (Non-Substantive):**

  1.  **"The Scottish People" vs. "People Living in Scotland":** RRS often prefers the latter phrasing to emphasize the potential diversity of views within the territory and avoid presupposing a unified "people." PRDS uses the former as a standard democratic shorthand for the electorate deciding its future. **Why it doesn't move the argument:** Both sides agree that the *franchise* for any referendum must be clearly defined (e.g., resident citizens) and that the result binds all within the territory, regardless of their vote. The terminological difference reflects rhetorical emphasis, not a practical disagreement on who votes or is bound.

  **IV. Fundamental Cruxes:**

  **Crux 1: The Recursive Secession Problem (The "Tarragona Paradox")**
  *   **Question:** If Catalonia legitimately secedes from Spain based on its right/claim, does a distinct sub-region within Catalonia (e.g., Val d'Aran, Tarragona) then possess an equally legitimate right/claim to secede from an independent Catalonia?
  *   **Hypothetical Test Case:** Assume Catalonia gains independence via a process both RRS and PRDS deem legitimate for Catalonia-vs-Spain. Five years later, Val d'Aran (with a distinct Aranese identity, language, and history of self-governance) holds a referendum where 55% of voters, on a high turnout, vote to secede from Catalonia and either become an independent microstate or rejoin Spain. The Aranese claim they are culturally distinct and feel politically marginalized within the new Catalan state. Catalonia refuses to recognize the vote.
  *   **RRS Prediction:** Val d'Aran's secession is **illegitimate**. Catalonia is a new, functioning democracy. Aranese grievances, while potentially valid, are unlikely to meet the high threshold of *persistent, severe injustice* required for remedial secession *so soon* after Catalonia's own founding. They must pursue internal remedies first. Allowing secession here risks infinite regress.
  *   **PRDS Prediction:** Val d'Aran's secession is **legitimate**. The same primary democratic right that applied to Catalonia applies to any territorially concentrated group capable of self-governance. A clear majority in a fair referendum expresses their will. Catalan objections based on stability or identity mirror Spain's previous objections, which were deemed invalid by PRDS in the initial case. Principle demands consistency.

  **Crux 2: Constitutional Entrenchment vs. Democratic Sovereignty**
  *   **Question:** Can a constitutional rule *designed* to make secession legally impossible (e.g., declaring the state "indivisible") ever be democratically revoked *without* violating the very constitutional rules that established the requirement for amendment?
  *   **Hypothetical Test Case:** Quebec's constitution within Canada is amended (following existing rules) to include an "Eternity Clause": "The territorial integrity of Quebec and its permanent status within Canada are inviolable and unamendable." Later, 65% of Quebec's electorate votes in a referendum for a new constitutional convention explicitly tasked with drafting provisions for independence, bypassing the "Eternity Clause" amendment procedures.
  *   **RRS Prediction:** The Convention is **illegitimate**. The "Eternity Clause," legally enacted, binds future generations. Attempting to bypass it via referendum or convention violates the foundational rule of law upon which *any* democratic order depends, including the legitimacy of the referendum itself. Change must occur *within* the established constitutional framework, however difficult.
  *   **PRDS Prediction:** The Convention is **legitimate**. Constitutional rules derive authority from the constituent power ("demos") of the people. A clear supermajority expression of popular sovereignty (the 65% referendum) trumps a prior procedural rule designed to entrench the status quo against the popular will. The people cannot be permanently bound by a procedural cage built by a past majority. The referendum *is* the act of constituent power reasserting itself.

  **Signed,**

  [Signature Block for Remedial-Right Representative]
  *(e.g., "Holding that secession is the shield against tyranny, not the sword for ambition")*

  [Signature Block for Primary-Right Democratic Representative]
  *(e.g., "Affirming the people's inherent right to choose their own association, freely and democratically")*

