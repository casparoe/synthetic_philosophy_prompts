prompt: |-
  I've been trying to figure out my actual gut rules about welfare in fish and crustacean farming, not from any class just thinking on my own. Salmon in those crowded net pens with sea lice and rubbed noses: not okay. Shrimp in big outdoor ponds with mud and plants: feels okay. Boiling a lobster alive for dinner: not okay. But killing shrimp with an electric stunner at a plant, quick death: feels okay, even though they're both crusteceans and it's still killing them for food. Oysters hanging on ropes in the sea: totally fine, they just sit there. Feeding farmed salmon with wild-caught fish so you're causing all that hidden suffering: wrong, but it feels different from direct harm. There's also this idea I ran into about negative welfare spaces — like an animal might not feel pain but still be in a bad state if it can't do any natural behaviors. So farming shrimp in bare concrete tanks with perfect water but no substrate or hiding spots, they don't show stress but can't do shrimp things: I keep going back-and-fourth on whether that's okay. Is there one principle that gets all my verdicts, and if so what does it say about the bare-tank shrimp? Or do I have to drop one of my gut calls? Also what's your take on the lobster vs stunned shrimp thing — is there a consistent line there?
