prompt: |-
  ok so i'm putting together my views on scientific idealization for a phil of science seminar and i want to check if i'm being consistent before i present. here's the package:

  (1) i accept something close to Friedmans F-twist: unrealistic assumptions are fine, even desirable, if the model predicts well. false premises don't necessarily spoil good conclusions in science, especially in economics where you can't run experiments.

  (2) at the same time i think Cartwright is basically correct that causal capacities are real and they only manifest inside stable nomological machines. so if a model assumes away all the institutional and physical background that makes supply curves actually behave like supply curves, it's not describing a real causal mechanism - it's just curve-fitting with fancy math.

  (3) but i also think the point of good idealization is exactly to falsify background conditions deliberately - like treating molecules as non-interacting or markets as perfectly competitive - in order to isolate the mechanism you're actually interested in. and i think this explanatory isolation has value even when the predictive accuracy is mediocre, because it tells you what the mechanism would do in a shielded environment.

  (4) i hold that predictive success and explanatory isolation are genuinely distinct desirata, neither reducible to the other, and that a mature science needs both.

  (5) finally, i think Friedman got the justification backwards: unrealistic assumptions aren't ok just because predictions work; they're ok because a false model can be embedded in a broader framework of true claims about capacities, so the model functions as a calculational shortcut rather than a literal description.

  do these hang together? i'm especially worried about (1) and (2) pulling in opposite directions, and about whether (3)'s praise of false background conditions is compatible with (2)'s claim that false backgrounds undermine causation. is there an obvious tension between (4) and (5) - like, if Friedman was wrong about why false assumptions work, does that undermine my acceptance of the F-twist in (1)? also, i think there might be an apparent conflict between (2) and (3) that dissolves once you distinguish shielding conditions from mere falsehood, but i want you to check whether thats a real dissolution or just me hoping. please rank the tensions by severity, say which single revision cleans up the most, and tell me whether there's a version of the F-twist that survives if i keep Cartwright's machinery. don't just list every pair as equally bad - be specific about which commitments actually fight.
