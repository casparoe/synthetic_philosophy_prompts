answer: |-
  Right, let's unpack this conceptual snag with scaling invariance. The core issue arises when we mistakenly conflate the *physical scale* of a neural substrate with the *functional capacity* it supports, especially when that function can be implemented across radically different physical systems – including non-biological ones. This framing problem renders brain size conceptually redundant for assessing moral status, yet the intuition persists due to deep-seated biomorphism (the bias towards valuing biological systems over functionally equivalent non-biological ones). The distributed cognition/external mind hypothesis provides a powerful illustration.

  **Conceptual Structure & Framing Problem:**

  1.  **Premise:** Moral status is often argued to depend (at least partly) on certain cognitive or experiential capacities (e.g., sentience, self-awareness, complex reasoning, future planning).
  2.  **The Size Proxy:** A common, often implicit, assumption is that possessing these capacities *requires* a biological brain of sufficient size and complexity. Hence, larger brains (within species or across them) are presumed to correlate with higher moral status.
  3.  **Scaling Invariance Challenge:** This is the crucial point. Scaling invariance, in this context, means that the *functional property* (e.g., holding a complex belief, performing a calculation, forming a plan) **does not inherently depend on the specific physical scale or substrate** implementing it. What matters is the functional architecture and the information processing achieved, not the cubic centimetres of neurons involved, *if the same function can be realised differently*.
  4.  **The Framing Collapse:** The problem isn't that neuroscience disproves a correlation *within biological brains*. It's that the *framing* of moral status around *brain volume specifically* collapses when we recognise that the relevant functional capacities can be:
      *   **Distributed:** Not confined to the biological brain but spread across brain + body + environment/tools.
      *   **Substrate-Independent:** Potentially implemented in non-biological systems (silicon, other organised matter).
      *   **Functionally Equivalent:** Producing the *same input-output behaviour and cognitive state* despite the physical implementation.
  5.  **Redundancy:** If the *function* defines the capacity, and the function can be identically realised in vastly different physical volumes or non-neural substrates, then measuring the volume of the *biological component alone* becomes a conceptually redundant metric for assessing the presence or degree of that capacity. It's like judging a computer's processing power solely by the size of its CPU, ignoring its RAM, GPU, cloud computing access, or software efficiency.

  **The Illustrative Case: Otto's Notebook & Inga's Memory (Extended Mind)**

  *   **Scenario:** Consider two individuals, **Inga** and **Otto**.
      *   **Inga** has a healthy biological brain. She decides to visit the Museum of Modern Art (MoMA) in New York. She recalls, using her biological memory, that MoMA is on 53rd Street. This memory process occurs entirely within her neural substrate.
      *   **Otto** has Alzheimer's disease. His biological memory is impaired. However, Otto constantly carries and consults a detailed notebook. When he decides to go to MoMA, he reliably retrieves the address ("53rd Street") by looking it up in his notebook. The notebook is deeply integrated into his cognitive processes – he wouldn't function without it, he trusts it implicitly, and it's always accessible.
  *   **Functional Equivalence:** According to the Extended Mind thesis (Clark & Chalmers), Otto's notebook *is* part of his cognitive system. The information "MoMA is on 53rd Street" plays the *exact same functional role* for Otto (guiding belief and action) as the neurally encoded memory does for Inga. The *capacity* to hold and act on this belief is identical, despite the different substrates.
  *   **Brain Size Discrepancy:** Otto's *biological brain* volume, particularly in memory-related areas, is likely smaller or less functional than Inga's due to neurodegeneration. Measured purely as biological tissue, his "brain size" is reduced.
  *   **Moral Status Proxy Collapse:** If moral status is tied to the capacity for complex belief formation, future planning, and acting autonomously based on information (all exemplified by planning and navigating to MoMA), then Inga and Otto possess this capacity *equally*. To claim Otto has lower moral status *because his biological brain volume is smaller* ignores the functional reality: his cognitive system (brain + notebook) fully supports the relevant capacity. The *scale* (size of his bio-brain) is irrelevant to the *function* achieved by his extended cognitive system.
  *   **Lingering Intuition:** Despite this functional equivalence, the intuition persists that Inga, with her larger, intact *biological* brain, "really" has the capacity in a way Otto does not. This stems from:
      *   **Biomorphism:** Prioritising the biological implementation as "real" cognition.
      *   **Localisation Bias:** Assuming cognition must be confined within the skull.
      *   **Vulnerability Focus:** Noting the notebook is external and potentially fragile, while overlooking that biological brains are also vulnerable (e.g., to stroke, anaesthesia).
      *   **Misplaced Concreteness:** Fixating on the measurable physical organ (the brain) rather than the abstract functional property (the cognitive capacity).

  **Why This Illustrates Scaling Invariance Framing Failure:**

  1.  **Same Function:** Both possess the capacity for belief-guided action relevant to autonomy and planning.
  2.  **Different Substrates:** The function is implemented neurally in Inga, and in a hybrid biological (smaller brain) + non-neural (notebook) system in Otto.
  3.  **Size Metric Fails:** Measuring Otto's *biological brain volume alone* grossly underestimates his actual cognitive capacity. The metric becomes redundant because the function is distributed and substrate-independent.
  4.  **Moral Relevance Lost:** Any moral distinction based *solely* on the difference in biological brain size between Otto and Inga lacks conceptual grounding once the functional equivalence of their extended cognitive systems is acknowledged. The *scale* of the biological component doesn't track the *moral status-relevant capacity*.
  5.  **Intuition Lingers:** Yet, we *feel* Inga's cognition is "more real" or valuable because it's biological and intracerebral. This lingering feeling is the framing problem in action – conflating the physical manifestation with the functional essence.

  **Conclusion for Your Chapter:**

  This case demonstrates that using brain size as a proxy collapses conceptually when confronting the possibility of *functionally equivalent distributed cognition*. Scaling invariance shows that the cognitive capacities underpinning moral status are not *intrinsically* tied to the volume of biological neural tissue. They are properties of organised functional systems that could, in principle, be realised in different sizes and substrates. The persistent intuition favouring larger *biological* brains reflects a deep cognitive bias (biomorphism) and a failure to fully embrace the implications of functionalism for moral philosophy. The challenge isn't just about cetaceans versus humans or AI; it's fundamental: grounding moral status requires focusing on the *functional architecture* capable of supporting morally relevant experiences or agency, not the arbitrary physical scale of one component within a potentially extended system. This forces a move away from simple metrics like volume towards more nuanced assessments of realised function, regardless of implementation.
