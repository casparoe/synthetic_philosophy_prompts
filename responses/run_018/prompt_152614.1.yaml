  Okay, the user is asking me to step into the role of a political philosopher specializing in legitimacy theory, specifically to diagnose why the debate about performance legitimacy in authoritarian states like China and Singapore has been stalled for decades. They want me to brainstorm the three standard moves people make in this debate first.

  Hmm, the three standard moves would be: (1) Authoritarian advocates pointing to economic growth and stability as evidence of legitimacy; (2) Liberal critics countering with lack of consent and rights violations; and (3) Both sides talking past each other without updating their positions. The user is asking whether this is a factual disagreement about whether growth causes legitimacy, a verbal disagreement about definitions of legitimacy, or perhaps an untested empirical claim about institutional causation.

  The user also brings up epistemic authoritarianism - this newer idea that regimes justify themselves by claiming superior information-processing abilities rather than just outputs. I need to consider whether this is part of the old debate or a separate issue entirely.

  For diagnosing the stall, I should consider several possibilities: Is it about bedrock intuitions that can't be reconciled? A hidden formal disagreement? Or something that a conceptual distinction could resolve? And what would actually count as progress here - a new distinction, empirical evidence, or just accepting that the sides are answering different questions?

  I need to be careful - the user specifically asked for no bibliographies since they can't verify sources. I'll focus on conceptual analysis rather than citing specific works.

  The core issue seems to be that the two sides are operating with fundamentally different conceptions of legitimacy. The developmental-state advocates are using a sociological/descriptive definition - legitimacy as whatever leads people to accept a regime as rightful. The liberal critics are using a normative definition - legitimacy as meeting certain moral standards like consent and rights. They're not just disagreeing - they're having completely different conversations.

  Epistemic authoritarianism is an interesting twist. It shifts the justification from outputs (growth, stability) to inputs and processes (superior information-gathering). But this still doesn't resolve the core disagreement because the liberal critics would still object on normative grounds regardless of information-processing capabilities.

  The stall seems to stem from this definitional chasm combined with what I'd call "conceptual imperialism" - both sides trying to claim the term "legitimacy" exclusively for their framework. Progress would require either: (1) Explicitly separating descriptive and normative legitimacy as distinct concepts; (2) Finding empirical evidence that actually tests the relationship between performance and sociological legitimacy across regimes; or (3) Accepting that the two sides are asking different questions and moving to more specific terminology.

  Of these, I think the first option - rigorously distinguishing descriptive from normative legitimacy - would be most immediately helpful. The second would be valuable but difficult to implement well. The third might be the most honest but least satisfying resolution.

  I'll structure my response around these insights, starting with the three standard moves, then diagnosing the stall, addressing epistemic authoritarianism, and suggesting what might constitute real progress in this debate.
answer: |-
  As a legitimacy theorist, I diagnose this decades-long stalemate as **fundamentally conceptual, not empirical, with both sides smuggling in undisputed empirical assumptions while talking past each other on definitions**. Here's my breakdown:

  **Three Standard Moves in the Performance-Legitimacy Debate:**
  1.  **The Output Justification:** Authoritarian advocates point to *tangible results* (GDP growth, poverty reduction, infrastructure, social stability) as evidence of legitimacy, equating public acquiescence/quiescence with acceptance. ("The people don't revolt, therefore they accept the regime as legitimate due to its performance.")
  2.  **The Input/Objection:** Liberal critics counter with *procedural sources* (popular consent via free elections, protection of civil/political rights, accountability mechanisms). They argue performance alone is insufficient or even illegitimate if achieved through coercion or by denying fundamental rights. ("Growth under repression isn't legitimate authority; it's effective management of subjects.")
  3.  **The Sociological vs. Normative Sidestep:** Both sides implicitly (or explicitly) switch between:
      *   **Descriptive/Sociological Legitimacy:** Does the populace *believe* the regime has the right to rule? (Measured by surveys, observed compliance/acquiescence, lack of mass unrest).
      *   **Normative Legitimacy:** *Ought* the populace to believe the regime has the right to rule, based on moral/political principles? (Assessed against philosophical standards like consent, justice, rights).

  **Diagnosing the Stall:**
  *   **Core Problem: Conceptual Conflation & Hidden Assumptions.** The stall isn't primarily about *whether* growth correlates with stability/acquiescence (both sides generally accept it often does in the short-to-medium term under capable authoritarian regimes). The real clash is:
      *   **Authoritarian Advocates:** Primarily use a **Descriptive** concept of legitimacy. Their *hidden assumption* is that descriptive legitimacy (acceptance driven by results) is sufficient for normative legitimacy, or that normative legitimacy is irrelevant if the regime delivers stability/prosperity. They see rights/consent as inputs potentially *detrimental* to effective output.
      *   **Liberal Critics:** Primarily use a **Normative** concept. Their *hidden assumption* is that descriptive acceptance without normative foundations (consent/rights) is either false consciousness, fear-based compliance, or inherently unstable/unjustifiable long-term. They see rights/consent as constitutive of legitimacy, not optional inputs.
  *   **"Bedrock Intuition" vs. "Formal Disagreement":** It's both, layered:
      1.  **Bedrock Intuition:** Deeply held values about the moral necessity of autonomy/consent (liberal) vs. the primacy of order/outcomes (authoritarian-leaning).
      2.  **Formal Disagreement:** The definition of legitimacy itself – is it a sociological fact or a moral judgment?
      3.  **Untested Causal Claim:** *Both* sides make a hidden empirical claim about long-term stability. Advocates assume performance-based acceptance is durable. Critics assume it's fragile without normative foundations or that repression inevitably breeds future instability. This *is* testable in principle (longitudinal studies, comparative historical analysis), but isolating variables is fiendishly difficult and data interpretation remains contested.

  **Epistemic Authoritarianism: A Twist, Not an Escape**
  *   This shifts the justification from *outputs* (prosperity/stability) to *inputs/processes* (superior information aggregation, long-term planning capacity, meritocratic decision-making).
  *   **It's Part of the Same Stalled Debate:**
      *   *For Advocates:* It's a *new performance metric* ("We produce better *decisions*, not just better GDP"). It still relies on a descriptive concept (acceptance based on claimed epistemic superiority) and avoids normative consent/rights.
      *   *For Critics:* It changes nothing normatively. Claims of epistemic superiority are unverifiable without transparency and contestation (rights), and even if true, don't justify ruling without consent. It might even be seen as *more* technocratically alienating.
      *   **The Conceptual Wall Remains:** It doesn't bridge the descriptive/normative gap. It just offers a different descriptive claim about *why* people might accept the regime.

  **What Counts as Progress?**
  1.  **Rigorous Conceptual Distinction (Essential First Step):** Explicitly separating **Descriptive Legitimacy** (factual belief in rightfulness) from **Normative Legitimacy** (moral justification) is non-negotiable. Forcing both sides to state clearly *which* concept they are invoking in each argument is crucial. This dissolves much of the "talking past."
  2.  **Targeted Empirical Research on the Hidden Claim:** Focusing research on the *long-term relationship between performance/repression and descriptive legitimacy/stability*. Can high-performing authoritarians sustain descriptive legitimacy across generations or economic downturns? Does repression inevitably corrode acceptance, or can effective output mitigate this? This requires sophisticated methods to measure genuine belief vs. fear/compliance.
  3.  **Accepting Different Questions (But Framing It):** Acknowledge the debate often involves two distinct questions:
      *   Q1 (Descriptive): "What factors cause populations to *accept* this regime as rightful?"
      *   Q2 (Normative): "Does this regime *deserve* to be accepted as rightful according to principle X?"
      Progress lies in *framing* arguments accurately: "Based on principle X (e.g., popular sovereignty), Regime Y lacks normative legitimacy, *even if* it currently enjoys descriptive legitimacy through performance Z."
  4.  **Scrutinizing the Performance Claim Itself:** Questioning *how* performance is achieved (sustainability, distribution, human/environmental cost) and its *dependency* on illiberal structures (e.g., does growth *require* repression?).

  **Conclusion:** The stall is primarily conceptual (conflating descriptive and normative legitimacy) compounded by untested long-term causal assumptions and bedrock normative disagreements. **Real progress requires first enforcing the descriptive/normative distinction.** Only then can meaningful empirical work on the descriptive side proceed, while the normative debate can proceed honestly as a clash of fundamental values about political morality, not disguised as a dispute over facts. Epistemic authoritarianism is a new justification within the same conceptual battlefield, not a path beyond it.
