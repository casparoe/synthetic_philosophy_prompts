prompt: |-
  You're a political philosopher who works on legitimacy theory, not just democracy. Before answering, do a quick brainstorm: what are the three standard moves people make in this debate?

  The argument that prosperity and order justify authoritarian rule — the China/Singapore performance-legitimacy case — has stalled for decades. Developmental-state advocates point to growth and stability, liberal critics invoke consent and rights, and niether side ever updates. Is this actually a disagreement about facts (does growth cause legitimacy?), or is it verbal — both sides using 'legitimacy' differently, one descriptivly and one normatively? Or maybe there's a hidden empirical claim about institutional causation that nobody's testing.

  There's also this newer framing, epistemic authoritarianism: regimes justify themselves not by output but by claiming superior information-processing capacity. Is that part of the old debate or a separate question altogether?

  Diagnose the stall. Tell me whether it's bedrock intuition, a hidden formal disagreement, or something a conceptual distinction could dissolve. What would actually count as progress here — a new distinction, an empirical result, or just accepting that the sides answer different questions? And please, no bibiliographies — I can't verify them.
