prompt: |-
  I'm planning a single ninety-minute session for a reading group of rationalist-curious non-specialists — people comfortable with LessWrong-style reasoning but with no formal philosophy training. I want them to understand what Dennett calls an intuition pump: not merely a thought experiment, but a narrative device that channels pre-theoretical conviction through hidden framing choices. Don't explain the concept directly to me; instead, lay out a teaching plan.

  Specify the dependency-ordered sequence: which idea must be in place before the next can land, and why. Choose one carrying example that is not the Chinese Room, the Trolley Problem, Mary's Room, or the Ship of Theseus — preferably a scenario in which a system's internal states are gradually replaced by functionally identical but ontologically different substitutes, with an external interpreter mediating all reports, so that the persuasive force comes from an unnoticed slide between epistemic and metaphysical possibility. Explain exactly why this example carries the lesson and what feature it must lack (namely, a clean resolution that would let the audience treat it as a puzzle with a right answer).

  Then map the misconceptions in the order they will arise: the conflation of intuitive pull with logical validity; the assumption that feeling convinced by a scenario is evidence for its conclusion; the belief that identifying a hidden premise dissolves the pump rather than revealing its machinery. For each, state precisely where in the sequence it should be intercepted and how.

  End with one check-for-understanding question that reveals whether they have grasped the meta-level idea — that pumps persuade by structuring attention, not by supplying premises — rather than merely remembering the example.

  Finally, state explicitly what should be left out at this level (for instance, formal modal semantics, Dennett's original taxonomy of pumps, or specific historical attributions in the philosophy of mind) and indicate how to acknowledge that omission without undermining credibility. Write the response in British English.
