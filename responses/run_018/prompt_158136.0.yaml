  Okay, the user is preparing a podcast interview with a philosopher who has a unique take on consciousness. She's challenging the traditional distinction between phenomenal and access consciousness, specifically critiquing Global Workspace Theory (GWT). Her argument is that while GWT explains access consciousness well, the "broadcast" part is phenomenally hollow, and what we call phenomenal consciousness is just access consciousness with a tight feedback loop creating an illusion of immediacy. 

  The user wants sharp, targeted questions that prevent the philosopher from falling back on Ned Block's classic distinction. They specifically want three things: first, to force her to clarify whether her theory makes new empirical predictions (especially about split-brain cases) or is just conceptual reframing; second, to ask what evidence could convince her that phenomenal consciousness isn't real and separate; third, to probe whether she'd grant phenomenal states to an artificial system with the same feedback loop but no biology. 

  Hmm, the user is clearly well-versed in philosophy of mind—they mention Block, GWT, split-brain cases, and even substrate dependence casually. They're likely hosting a technically rigorous podcast and want to push the guest beyond soundbites. Their frustration with "what drew you to this" fluff suggests they value precision and want to extract something new for listeners. 

  The challenge here is designing questions that are adversarial but not hostile—they should corner the guest into clarifying ambiguities without making the podcast feel like an interrogation. The split-brain angle is smart because it's a classic litmus test for consciousness theories. The AI follow-up is even sharper, as it forces her to confront whether biology is secretly doing heavy lifting in her model. 

