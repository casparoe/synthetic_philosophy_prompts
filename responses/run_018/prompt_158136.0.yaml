answer: |-
  Here’s a surgically precise question sequence designed to force conceptual clarity, test empirical grounding, and expose hidden assumptions—avoiding all retreats to Block’s dichotomy:

  ### **1. Empirical Test or Conceptual Reboot?**  
  *"You argue phenomenal consciousness is access consciousness 'faking immediacy' via a tight feedback loop. Is this a new *empirical prediction* about how systems like split-brain patients function—specifically, that their disconnected hemispheres should each generate *separate* illusions of immediacy? Or is this purely a conceptual re-framing of existing data? If empirical, what neural signature would confirm/refute it?"*  
  *(Forces her to choose: novel science or linguistic reshuffle. Preempts appeal to Block by demanding mechanistic specificity.)*

  ### **2. The Falsifiability Challenge**  
  *"If phenomenal consciousness is *just* access + feedback, what evidence could convince you it’s *not*—that there’s a real, non-functional 'what-it’s-like' separable from access? For example: if we found a patient with intact global workspace access (reporting, planning) but who credibly insisted *all subjective experience* was gone—'lights on but nobody home'—would that refute your model? If not, what *would*?"*  
  *(Targets the core claim’s vulnerability. Rejects "phenomenal overflow" as evidence by demanding a *lack-of-phenomenality* case.)*

  ### **3. Artificial Immediacy & Substrate Smuggling**  
  *"Imagine an artificial global workspace: information enters a processing hub ('access'), but with a real-time loop feeding outputs *back* as inputs, creating seamless immediacy—matching your feedback mechanism. If this AI claims 'I feel raw pain, not just pain-processing,' would you grant it phenomenal states? If *no*, are you implicitly requiring biological wetware? If *yes*, is consciousness then *trivially easy* to engineer?"*  
  *(Cornering the functionalism: forces admission of either biological bias or that AI could fake phenomenality "real"-ly.)*

  ---

  ### **Key Tactics Embedded:**  
  - **No Safe Ground:** Each question blocks retreat to Block: Q1 replaces P/A with *mechanism*, Q2 demands falsification *within* access, Q3 eliminates biology as a hidden variable.  
  - **Pressure Points:** Forces commitment on split-brain predictions (does each hemisphere "fake" its own qualia?), clinically plausible counterevidence, and whether feedback loops suffice for phenomenality.  
  - **Sharpening the Blade:** Questions assume familiarity with GWT, split-brain data, and hard problem discourse—no warm-ups or biography.  

  **Follow-Up Angles if She Dodges:**  
  - On Q1: *"If split-brain cases don’t discriminate your model from Block’s, what empirical domain does?"*  
  - On Q2: *"If no conceivable evidence disproves 'faked immediacy,' is your theory unfalsifiable?"*  
  - On Q3: *"If you deny AI phenomenality, is your 'feedback loop' just a placeholder for unexplained biology?"*  

  This sequence treats her thesis like a scientific hypothesis—demanding predictions, falsification, and ontological commitments. No philosophy-of-mind platitudes will survive.
