  Also noting the user's phrase "don't let her retreat to Block's old distinct"—so the questions must preempt that escape route. Maybe explicitly framing the first question as "empirical vs. conceptual" blocks the retreat by making it a binary choice upfront. The evidence question later then becomes a trap: if she admits any evidence could sway her, she concedes phenomenality might be real; if not, she looks dogmatic. 

  ...Wait, is the user subtly skeptical of her theory? The phrasing "claims" and "fakes immediacy" hints at skepticism. They might want questions that test her theory's robustness. Alternatively, they might just want to showcase her defending a radical position. Either way, the questions should leave listeners with a clear takeaway about where her model succeeds or fails. 

