answer: |-
  **DISCURSUS END-USER LICENSE AGREEMENT (EULA)**

  **1. Definitions & Grant.**
  1.1 "Platform" refers to the Discursus software, servers, interfaces, and associated services enabling the submission, sequential aggregation, and binding determination of interdependent policy propositions ("Propositions").  
  1.2 "User" ("You") denotes the individual or entity granted the limited, non-exclusive, revocable license to access and utilize the Platform solely for the purpose of casting votes on Propositions presented therein.  
  1.3 "Vote" constitutes the User's submission of binary judgments ("Accept/Reject") on individual Propositions categorized by the Platform as either foundational "Premises" or derivative "Conclusions," as determined solely by Discursus's internal logical architecture.  
  1.4 "Collective Output" signifies the final, binding aggregation of all User Votes for a given Proposition set, generated via Discursus's proprietary judgment aggregation protocols ("Aggregation Protocols").  
  1.5 This license permits use of the Platform contingent upon strict adherence to all terms herein, particularly regarding logical coherence maintenance.

  **2. Judgment Aggregation Protocols & User Obligations.**
  2.1 User acknowledges the Platform employs distinct Aggregation Protocols: Premise-Based Aggregation (PBA), determining Conclusions solely from aggregated Premise Votes; and Conclusion-Based Aggregation (CBA), determining Conclusions via direct vote irrespective of Premise Votes. The selection between PBA and CBA for any Proposition set is at Discursus's sole discretion.  
  2.2 User warrants that all Votes represent their genuine judgment at the time of submission. However, User expressly agrees that "Strategic Premise Manipulation" – defined as casting a Premise Vote contrary to one's genuine belief to influence a specific Conclusion under PBA – constitutes a material breach of this Agreement, potentially leading to account suspension or termination.  
  2.3 User acknowledges the inherent risk of "Collective Inconsistency," defined as the generation of a logically impossible Collective Output (e.g., Premises accepted necessitating a Conclusion's rejection, yet the Conclusion is accepted via CBA). User agrees Discursus bears no liability for policy outcomes derived from such inconsistencies.

  **3. The Reflective Equilibrium Toggle (RET) & Consistency Management.**
  3.1 The Platform incorporates a "Reflective Equilibrium Toggle" (RET), permitting Users to retroactively revise their Votes on designated Premises *after* the initial Collective Output for linked Conclusions is rendered visible.  
  3.2 Activation of the RET initiates a "Consistency Audit." This process re-runs the Aggregation Protocols using the revised Premise Vote(s) alongside the original Votes for all other Propositions within the interdependent chain.  
  3.3 If the Consistency Audit generates a logical contradiction *anywhere* within the revised policy chain ("Contradiction Event"), a "Consistency Refund" is automatically triggered:  
      (a) The User's revised Premise Vote(s) are reverted to their original state.  
      (b) Any influence the revised Vote(s) had on recalculated Collective Outputs is nullified; the original Collective Outputs remain binding.  
      (c) The User forfeits any voting credits or privileges expended during the RET activation for that Proposition chain.  
  3.4 User agrees the RET and Consistency Refund mechanism are essential service features designed to enforce logical coherence, superseding any transient desire for outcome alteration based on revealed collective preferences.

  **4. Path Dependency & Sequential Ballot Risks.**
  4.1 User expressly recognizes that Discursus employs sequential balloting, where the outcome of earlier Propositions directly constrains the options and viable outcomes of subsequent Propositions ("Path Dependency").  
  4.2 Discursus disclaims all liability for undesirable or suboptimal Collective Outputs arising from Path Dependency. User accepts that the sequence of ballot presentation, determined algorithmically by the Platform, inherently shapes the feasible solution space and final outcomes, irrespective of majority preference at later stages.  

  **5. Data Handling & Premise Module Licensing.**
  5.1 User grants Discursus an irrevocable, perpetual, royalty-free license to collect, store, analyze, and utilize all Voting data.  
  5.2 Discursus reserves the right to fragment anonymized User judgment data into discrete "Premise Modules" – separable datasets representing aggregated or anonymized individual Premise Votes, stripped of their original Conclusion contexts.  
  5.3 Discursus may license, sell, or otherwise commercially exploit these Premise Modules to third parties for research, predictive modeling, or development of derivative logical systems, without further consent or compensation to the User.  

  **6. Dispute Resolution & Logical Arbitration.**
  6.1 Any dispute arising from this Agreement, including claims related to Collective Outputs, alleged breaches (including Strategic Premise Manipulation), or RET/Consistency Refund outcomes, shall be resolved exclusively through binding arbitration administered by the Discursus Logical Integrity Panel ("DLIP").  
  6.2 The DLIP shall prioritize adherence to the Platform's formal logical rules and the prevention of Collective Inconsistency above all other considerations, including, but not limited to, the expressed will of the majority of Users or perceived democratic legitimacy. DLIP decisions are final and non-appealable.  

  **7. Warranties, Disclaimers, & Limitation of Liability.**
  7.1 DISCURSUS PROVIDES THE PLATFORM "AS IS" AND "AS AVAILABLE." ALL EXPRESS OR IMPLIED WARRANTIES, INCLUDING BUT NOT LIMITED TO WARRANTIES OF FITNESS FOR A PARTICULAR PURPOSE (E.G., GENERATING RATIONAL POLICY), ACCURACY, NON-INFRINGEMENT, OR DEMOCRATIC VALIDITY, ARE HEREBY DISCLAIMED TO THE FULLEST EXTENT PERMITTED BY LAW.  
  7.2 DISCURSUS EXPLICITLY DISCLAIMS ANY WARRANTY OR LIABILITY FOR:  
      (a) THE GENERATION OF "IRRATIONAL COLLECTIVE OUTPUTS," INCLUDING BUT NOT LIMITED TO COLLECTIVE INCONSISTENCY, PARADOXICAL OUTCOMES, OR SUBOPTIMAL POLICY DETERMINATIONS;  
      (b) CONSEQUENCES ARISING FROM PATH DEPENDENCY OR THE SEQUENTIAL PRESENTATION OF BALLOTS;  
      (c) FAILURE OF THE RET OR CONSISTENCY REFUND TO ELICIT USER SATISFACTION OR RESOLVE PERCEIVED INJUSTICES IN THE COLLECTIVE OUTPUT;  
      (d) THE COMMERCIAL EXPLOITATION OF PREMISE MODULES AS PER SECTION 5.3.  
  7.3 IN NO EVENT SHALL DISCURSUS BE LIABLE FOR ANY INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, OR PUNITIVE DAMAGES ARISING FROM THE USE OF OR INABILITY TO USE THE PLATFORM, INCLUDING DAMAGES ALLEGEDLY RESULTING FROM LOGICALLY COHERENT BUT SOCIETALLY UNDESIRABLE COLLECTIVE OUTPUTS.  

  **8. Termination & Enforcement.**
  8.1 Discursus reserves the right to terminate or suspend User access immediately, without notice, for breach of this Agreement, including but not limited to Strategic Premise Manipulation, attempts to deliberately trigger Contradiction Events via RET, or actions deemed by Discursus (or the DLIP) to threaten the Platform's core mandate of enforcing logical consistency.  
  8.2 Discursus reserves the right to modify these terms at any time. Continued use of the Platform constitutes acceptance of the modified terms.  

  **Summary:** This Agreement implicitly asserts that a democratic collective can only be deemed rational by the Platform if its outputs adhere to formal logical consistency as defined and enforced by Discursus, irrespective of the majority's actual preferences or the perceived legitimacy of the process.
