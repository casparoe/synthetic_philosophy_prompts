answer: |-
  Here is your Q&A defense sheet, structured for maximum tactical precision against this specific audience. I've distilled objections based on actual fault lines in Smith scholarship and seminar dynamics:

  **Strategic Opening Concession (First 2 Minutes):**  
  "Before objections, two concessions: First, to Humeans—Smith *does* inherit Hume's core insight that sympathy bridges self and other via imagination, not innate ideas. Second, to historians—terms like 'fiction' and 'performance' are modern labels; Smith himself speaks of 'supposition' and 'theatre'. My argument is that Smith *radicalizes* Hume's model into something socially generative, and that his theatrical language is *literal methodology*, not metaphor."

  **Make-or-Break Defense Line:**  
  You MUST establish that Smith’s spectator is *constitutively imaginative and collective*. Cite his insistence that we "place ourselves in [the spectator's] situation" through *mutually adjusted* imagination (TMS III.1.2). If this isn’t accepted as social negotiation, the thesis collapses.

  ---

  **Ranked Objections & Replies**  
  *(Likelihood/Damage descending)*

  1.  **Objection (Humean):** "You sever sympathy from moral psychology. Hume shows sympathy naturally transmits sentiments; Smith’s spectator is just a refinement for impartiality—a cognitive filter on Humean foundations, not a new construct."  
      **Reply:** "Smith’s sympathy isn’t Hume’s contagion. For Hume, sympathy transfers *actual* feelings; for Smith, it’s *imaginative reconstruction* requiring negotiation ('bring his case home to myself,' TMS I.i.1.2). The spectator isn’t a filter—it’s the *emergent product* of reciprocal perspective-taking. Without social interaction, there’s no spectator."  
      **Weakness:** Downplays Smith’s debt to Hume’s naturalism. Concede Hume provided the raw mechanism.

  2.  **Objection (Historian):** "Calling the spectator a 'fiction' imports Foucauldian/Goffmanesque anachronism. Smith’s agent *internalizes* the spectator—it’s conscience, not performance."  
      **Reply:** "Smith states we act 'as if' judged by another (TMS III.1.6)—*not* that the spectator is innate. Internalization comes from lifelong exposure to social applause/censure. 'Conscience' is the *habituated echo* of actual audiences (III.3.38), not an inner oracle."  
      **Weakness:** Smith *does* call conscience "the man within." Stress this figure is *forged*, not given.

  3.  **Objection (Humean):** "If the spectator is mere performance, why does Smith ground propriety in *natural* pleasure from mutual sympathy (TMS I.i.2.1)? That’s realist sentimentalism."  
      **Reply:** "The pleasure *motivates* performance but doesn’t supply its *content*. What counts as 'proper' sympathy varies by social context (e.g., commercial vs. feudal manners). The *need* for sympathy is natural; its *norms* are artifice."  
      **Weakness:** Risks reducing Smith to relativism. Emphasize shared humanity sets *bounds* on variation.

  4.  **Objection (Historian):** "Smith’s moral judgment relies on *propriety* (fitness to situation) and *merit* (desert)—objective standards, not negotiated fictions."  
      **Reply:** "Propriety is always assessed *through* the imagined spectator’s eyes—a spectator shaped by local conventions. Merit depends on *socially recognized* motives (TMS II.i.intro.1). Neither exists independent of communal validation."  
      **Weakness:** Smith ties propriety to situation, which may imply objective fitness. Argue situations are socially defined.

  5.  **Objection (Humean):** "Hume’s artificial virtues (justice, promise-keeping) are social constructs; Smith’s spectator is just his version for *all* virtues—no discontinuity."  
      **Reply:** "For Hume, artificial virtues solve coordination problems via convention. Smith’s spectator governs *all* moral judgment—including ‘natural’ virtues like benevolence—via pervasive social mirroring. Hume’s sympathy is descriptive; Smith’s is *normatively constitutive*."  
      **Weakness:** Blurs Hume’s natural/artificial line. Concede Hume pioneered constructivism for justice.

  6.  **Objection (Historian):** "Commercial society *corrupts* moral judgment for Smith (TMS I.iii.3.1). If the spectator is its product, why condemn it?"  
      **Reply:** "Precisely! Smith critiques when commercial *performances* distort the spectator (e.g., admiring the rich). But this confirms the spectator is *malleable* by social context—not a transcendant judge. The solution? *Better* social scripting (education, moral discourse)."  
      **Weakness:** Implies Smith is cynical. Rebut: He seeks *reformed* performances, not abolition.

  7.  **Objection (Humean):** "If sympathy delivers no moral knowledge, why does Smith call the spectator 'instructive' (TMS III.3.22)?"  
      **Reply:** "It ‘instructs’ us in *local* norms, not universal truths. The ‘great school of self-command’ (III.3.22) is social discipline—learning lines for audience approval. Knowledge here is *practical competence*, not epistemic insight."  
      **Weakness:** Downplays Smith’s universalist rhetoric. Note his appeals to ‘humanity’ are regulative ideals.

  8.  **Objection (Historian):** "Your 'collective imagination' ignores Smith’s *individual* moral struggle with partiality. The spectator is personal self-correction, not groupthink."  
      **Reply:** "Self-correction *uses tools society provides*. The ‘impartial’ spectator emerges from internalized *social* dialogues (TMS III.1.6). Even solitude requires imagining ‘what others would feel’—*others* we’ve known."  
      **Weakness:** Smith *does* valorize individual autonomy. Stress it’s socially scaffolded autonomy.

  ---

  **The Question You Hope Nobody Asks:**  
  **Objection:** "If the impartial spectator is a socially constructed fiction, *why does it reliably generate shared norms across diverse observers*? And why does Smith treat its judgments as binding even when they *contradict* actual audiences (TMS III.2.32)? This implies a *realist foundation* your constructivism can’t explain."  

  **Your Best Honest Reply:**  
  "Smith anchors this in *human nature’s need for mutual sympathy* (TMS I.i.2.1). The ‘binding’ force comes from our terror of isolation—a psychological constant. But the *content* of norms varies. When the ‘wise and virtuous’ spectator contradicts society, it’s an appeal to an *idealized* consensus (III.2.32), shaped by philosophy and experience—still socially derived, just not *immediately* local. It’s a fiction we *aspire* to universalize."  

  **Where You’re Stuck:**  
  You cannot fully reconcile Smith’s appeal to a trans-social "wise spectator" with radical constructivism. Admit: "This *is* a tension. But note: Smith’s ‘wise’ spectator isn’t a Platonic form; it’s built from observing historical exemplars—still culturally mediated. His constructivism is *aspirationally* universalist, not relativist."

  ---

  **Key Tensions in Your Thesis to Monitor:**  
  - **Psychological Need vs. Social Construction:** Your model leans on innate *desires* (for sympathy) while denying innate *norms*.  
  - **Local vs. Ideal Spectators:** You must explain why Smith’s "impartial" spectator isn’t just *another* local fiction.  
  - **Agency vs. Determinism:** If norms are scripts, is moral progress possible? Stress Smith’s reformism—we can *rewrite* scripts.  

  **Delivery Tip:** When historians flinch at "fiction," pivot to Smith’s own terms: "theatrical," "mirror," "supposition." For Humeans, contrast "sympathy as transmission" (Hume) vs. "sympathy as negotiation" (Smith). Hold the line: Smith’s innovation is making morality *emerge from social performance*.
