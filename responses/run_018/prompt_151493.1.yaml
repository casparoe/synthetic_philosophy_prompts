  ## LakatosOS v2.1.7 User Manual (DRAFT - Do Not Cite Without Protective Belt Adjustment)

  Hey there, intrepid knowledge pioneer! Tired of philosophy papers that feel like wandering through a foggy swamp of *maybe*? Wish peer review had the crisp, objective clarity of a well-maintained server rack? Welcome to **LakatosOS** – the world’s first app applying Imre Lakatos’s *Methodology of Scientific Research Programmes* (MSRP) to instantly evaluate *any* philosophy paper! Say goodbye to subjective squabbles and hello to **algorithmic rationality**!

  **Your Philosophical Firewall: The Hard Core™**
  Every great Research Programme (RP) needs its unchanging heart, right? LakatosOS identifies the paper’s proposed Hard Core – those sacred, non-negotiable axioms (e.g., "All knowledge is sensory," "Free will is illusory," "This footnote is vital"). Our proprietary **Hard Core Firewall™** locks these down tighter than a sysadmin’s root password. Any attempt within the paper to modify or contradict its *own* Hard Core triggers an instant **REJECTION ALERT (Code: HC-Breach-001)**. No more sneaky foundational shifts! Stability is key!

  **Flexibility Where It Counts: The Protective Belt Patch Manager™**
  Surrounding that rock-solid Hard Core is the messy stuff – auxiliary hypotheses, definitions, interpretations. That’s your Protective Belt! LakatosOS treats these like modular software patches. Upload your paper, and our AI scans for these components, tagging them as **PB-Patches™**. The beauty? You (or reviewers!) can **drag, drop, replace, or delete PB-Patches™** without compromising the sacred Hard Core! Found a better definition? Patch it in! Counterexample torpedoed your initial analogy? Swap that patch! Easy peasy, falsification-squeezy.

  **Powering Progress: The Heuristic Battery™**
  Is the paper *driving discovery* or just spinning its wheels? Our **Heuristic Battery™** quantifies it! Every novel prediction, surprising connection, or fruitful new question *charges* the battery. But beware degenerate moves! **Kuhn Citations™** are a known power drain (seriously, Thomas, we get it, paradigms shift) – each one saps 15%! Excessive appeals to "intuition" or unexplained "it seems" statements? That’s a slow leak. If your paper’s Heuristic Battery™ drains to **<10%** during simulation (or worse, dips into **Ad Hoc Reserve Power®**), you’ll get a flashing **DEGENERATIVE PROBLEMSHIFT WARNING (Code: PB-Degen-005)**. Time for new patches!

  **The Cutting Edge: Degenerative Shift Detection via Blockchain Oracle™ (Patent Pending!)**
  Is a citation just a desperate, band-aid fix? That’s the ad hoc question! LakatosOS doesn’t trust central authorities (too Popperian!). Instead, our **Distributed Ad Hoc Oracle™** runs on the **EpistemicChain™**. When a potentially suspect citation is flagged by the core app, a snippet is anonymously broadcast to our global network of verified Lakatosian Validator Nodes (mostly tenured phil. of sci. profs and very advanced grad students). They vote, **via blockchain**, on whether the citation is **Legit Heuristic Boost (LHB)** or **Degenerative Ad Hoc Patch (DAHP)**. Majority consensus updates the paper’s status in *real-time*! True decentralized epistemology! (Minor gas fees apply).

  **Troubleshooting:**
  *   **App crashes on postmodern papers?** Expected. Hard Core Firewall™ struggles with deliberate ambiguity. Try the "Feyerabend Compatibility Mode" (beta - use at own risk).
  *   **Heuristic Battery™ draining too fast?** Check for unmarked Kuhn Citations™ or undefined primitives. Run the **Ad Hoc Scanner™**.
  *   **Blockchain Oracle™ stalemate?** Increase your gas fee slightly. Sometimes truth needs a nudge.

  LakatosOS: Because philosophy shouldn’t be harder than debugging legacy code. Install now, and watch your research programme go **PROGRESSIVE**! (Results may vary. No guarantee of tenure. Hard Core definitions are user-submitted responsibility. Beware of infinite regress loops.)
