answer: |-
  Your analysis is perceptive—this dispute sits at the intersection of metaphysics, semantics, and epistemology. Here's a structured diagnosis grounded in the claims of each side, followed by pathways to progress:

  ### Core Structure of the Disagreement
  1. **Divergent Grounding of Ontological Commitment**  
     - **Pluralists** anchor existence in *explanatory indispensability*:  
       - Gaps enter into causal explanations (e.g., "the gap concentrated stress, causing fracture").  
       - They exhibit modal persistence (e.g., a gap survives gradual filling; relocates when matter shifts).  
       → Thus, gaps are *robust causal entities* with identity conditions.  
     - **Monists** anchor existence in *physical reducibility*:  
       - All observable properties (porosity, structural failure) reduce to arrangements of matter.  
       - "Gap talk" is shorthand for the *shape* and *boundaries* of material objects.  
       → Reifying gaps violates Ockham's Razor without adding new predictive power.  

  2. **Semantic vs. Metaphysical Stakes**  
     - **Pluralists** see a *metaphysical distinction*:  
       - "There is no cheese here" (negative existential) ≠ "There is a cheese-absence" (positive entity).  
       - Absences *do work* (e.g., a keyhole’s shape causally interacts with a key).  
     - **Monists** see a *semantic illusion*:  
       - "Absence" is a grammatical artifact—a useful fiction for describing material configurations.  
       - All causal explanations reduce to matter (e.g., structural failure is caused by *material discontinuity*, not an entity called "gap").  

  3. **The Hidden Battleground: Modal Profiles**  
     Both sides agree on physical descriptions but disagree on *modal properties*:  
     - Pluralists: Gaps have *de re* possibilities (can be moved/filled while retaining identity).  
     - Monists: Modal claims reduce to counterfactuals about matter (e.g., "the gap moved" = "the matter reconfigured such that a similar void exists elsewhere").  
     → This is **not verbal**—it reflects a substantive divide about whether modal properties require bearers.  

  4. **The Explanatory Threshold**  
     Pluralists claim monists conflate *explanation* and *reduction*:  
     - Even if gaps supervene on matter, they play *irreducible roles* in scientific explanations (e.g., fluid dynamics in porous materials).  
     Monists retort that such explanations are *epistemically useful* but *ontologically empty*.  

  ### Is This Dispute Resolvable?  
  The impasse is **structural but not permanent**. Progress requires shifting focus from existence criteria to the disputed *work* gaps perform:  

  #### Pathways to Progress:  
  1. **Formal Identity Conditions** (Pluralist leverage):  
     - Develop a mereotopological model for gaps (e.g., Casati & Varzi's hole theory).  
     - If gaps can be assigned *non-arbitrary identity criteria* (e.g., via boundary continuity under transformation), they meet a key entity test.  
     - **Progress trigger**: Show that "gappy" descriptions fail to track identity-preserving transformations (e.g., a growing gap vs. multiple new gaps).  

  2. **Causal Exclusion Test** (Monist leverage):  
     - If all causal explanations involving gaps (e.g., stress concentration) can be *fully redescribed* via material properties (e.g., atomic bonds at boundaries) without loss of predictive power, monism wins.  
     - **Progress trigger**: An engineering case where gap-based models *outperform* matter-only models in novel predictions.  

  3. **Perceptual-Cognitive Experiments** (Neutral arbiter):  
     - Empirical studies on how humans/perceptual systems track holes (e.g., do we represent gaps as *objects* or as *relations*?).  
     - If gaps are perceptually encoded as entities (e.g., via boundary-completion mechanisms), pluralists gain support.  

  4. **Metaontological Clarification** (Your suspicion):  
     - Explicitly agree on criteria for "entity" status:  
       - Is it *causal autonomy*? *Modal robustness*? *Explanatory indispensability*?  
     - **Caution**: Insisting the dispute is "verbal" risks dismissing substantive disagreements about causal structure.  

  ### Verdict  
  - **Not purely verbal**: The disagreement concerns *what grounds ontological commitment* and whether absences have irreducible causal powers.  
  - **Empirically tractable**: Engineering and perceptual evidence could break the deadlock. If gaps are indispensable in *novel predictions* (e.g., in metamaterial design), pluralism gains ground.  
  - **Likely outcome**: A graded ontology where some "gaps" are reified (e.g., engineered pores in catalysis) while others are not (e.g., arbitrary interstices). **Boundary pluralism** might prevail for gaps with stable identity conditions.  

  **Recommendation**: Challenge both sides to jointly analyze a borderline case (e.g., a bubble in fluid flow—is it a "gap" or a material interface?). Their negotiations will reveal whether the divide is methodological or metaphysical. If no consensus emerges even with new data, the stall may reflect incommensurable metaontological frameworks—but this is unlikely given their shared physical descriptions.
