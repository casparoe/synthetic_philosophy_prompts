prompt: |-
  Consider the institutional pattern visible in how universities and cultural institutions treat creators with documented moral failures: art-history curricula and museum exhibitions now routinely include explicit ethical framing—syllabus modules, wall texts, or curatorial disclaimers—that addresses a visual artist’s harmful conduct, yet literature and music programs rarely apply analogous framing to authors or composers with comparable biographies. At the same time, art-market institutions systematically suppress that same biographical moral information in provenance reports and auction catalogs, treating it as valuation-irrelevant, even when the museum sector highlights it. What theory, or family of theories, of artistic value does this three-way asymmetry presuppose? Does the museum and curricular practice presuppose that visual art is uniquely transparent to the creator’s moral character in a way that literature and music are not, or that encountering a painting in a museum is a morally situated relationship rather than a purely aesthetic one? Does the market suppression presuppose a strict autonomy thesis—that aesthetic value is entirely separable from moral biography—or merely a pragmatic judgment that buyers prefer not to know? Reconstruct the implicit philosophical commitments that would render both practices coherent together, distinguish what they strictly presuppose from what they are merely compatible with, and identify where the pattern is philosophically underdetermined—specifically, whether rival views such as expressivism, formalism, or institutionalism could each license the split. Finally, say what would have to change in curricular design, curatorial norms, or market regulation if the underlying view were replaced by one that treated moral biography as uniformly relevant, or uniformly irrelevant, across all art forms.
reasoning: |-
  Okay, let me unpack this complex question about how different cultural institutions handle artists' moral failures. The user presents a fascinating asymmetry: art museums and academic courses include ethical disclaimers about problematic visual artists, while literature and music programs rarely do the same, and art markets actively suppress such information. 

  Hmm, the user seems deeply familiar with cultural studies and philosophy of art - probably an academic or advanced student. Their question has layers: first, identifying the theoretical foundations behind these practices; second, distinguishing necessary presuppositions from compatible ones; third, exploring how alternative theories might accommodate the asymmetry; and finally, considering practical implications if we standardized approaches to moral biography.

  The core puzzle is why visual art gets special ethical scrutiny. Is it because paintings are seen as direct windows to the artist's soul? Or because museum viewing is inherently moral? Meanwhile, auction houses behave as if morality and aesthetics live in separate universes. 

  I should be careful not to oversimplify. The institutional differences matter: museums are educational while auction houses are commercial. And the sensory nature of visual art - its immediacy - might make moral concerns feel more urgent than with literature or music. But is that theoretically justified? 

  For reconstructing commitments: museums seem to assume art's meaning is tied to creator morality (expressivism?) while markets treat art as pure object (formalism?). But neither theory fully explains the art-vs-literature disparity. Perhaps visual art institutions uniquely blend contextualism and moralism. 

  When testing rival theories... expressivism could explain museums' focus but not the market's suppression. Formalism would justify the market but not the disclaimers. Institutionalism might frame this as arbitrary convention, but that feels unsatisfying. There's tension here that no single theory resolves neatly.

  For the final practical question: if we insisted on uniform relevance, museums might need to extend disclaimers to all arts while auction houses would face ethical disclosure requirements. If we deemed morality entirely irrelevant, museums would strip away those wall texts. Both scenarios would force uncomfortable consistency across domains that currently operate by different rules.

  The user's pushing me to notice how our institutional practices silently endorse contradictory philosophies. That's philosophically rich - it reveals how theory is embedded in curation, teaching and commerce, often incoherently. I should highlight that incoherence while still mapping the implicit logic behind each practice.
answer: |-
  This institutional asymmetry reveals a complex, philosophically hybrid view of artistic value that combines **contextual moralism for visual art** in pedagogical/exhibition settings with **strict aesthetic autonomy** in commercial contexts, while maintaining **formalist or biographical detachment for non-visual arts**. The pattern presupposes:

  **Core Presuppositions:**
  1. **Visual Art as Ethically Transparent:** Museums/curricula assume visual art uniquely embeds the creator's moral character in the work's perception (weak expressivism). A painting is treated as a *direct extension of the artist's persona*, making moral biography relevant to interpretation.  
  2. **Museums as Moral-Curricular Spaces:** The museum context transforms aesthetic engagement into an ethically situated act, demanding disclosure as part of education/public trust.  
  3. **Market Autonomy Thesis:** Auction houses presuppose art's *monetary value* is purely a function of formal properties and provenance—moral data is "noise" irrelevant to valuation.  
  4. **Non-Visual Arts as Formally Opaque:** Literature/music institutions implicitly treat texts/scores as *hermetic constructs*, where biographical morality doesn't permeate the work's meaning (moderate formalism).  

  **Strict vs. Compatible Commitments:**  
  | **Practice** | **Strictly Presupposes** | **Merely Compatible With** |
  |--------------|--------------------------|----------------------------|
  | **Museum Disclaimers** | Moral character affects visual art's meaning/reception; museums have an ethical-educative duty | Strong expressivism; moralism (immoral artists diminish artistic value) |
  | **Market Suppression** | Aesthetic and market value are fully separable from moral biography | Formalism; aesthetic hedonism; buyer psychology ("willful ignorance") |
  | **Literary/Music Silence** | Authorial biography is non-essential to textual/musical engagement | Intentional fallacy rejection; death of the author; aestheticism |

  **Philosophical Underdetermination & Rival Theories:**  
  - **Expressivism** *could* license the split if arguing visual art is inherently more self-revelatory than literature/music—but struggles to explain market suppression.  
  - **Formalism** *could* justify market practices and literary/music silence but contradicts museum disclaimers.  
  - **Institutionalism** best explains the asymmetry: visual art's **exhibition context** imposes ethical framing, its **market context** enforces neutrality, and non-visual arts lack equivalent institutional norms. The split reflects contingent power structures, not ontological truths.  

  **Implications of Uniform Relevance/Irrelevance:**  
  - **Uniform Relevance (Moralism):**  
    - Curricula: Mandatory ethical modules for *all* arts (e.g., Wagner's antisemitism in musicology, Pound's fascism in literature).  
    - Museums: Wall texts expanded to composers/authors in interdisciplinary exhibits.  
    - Market: Provenance reports include moral biographies; "ethical audits" affect valuations (e.g., devaluing art by sexual predators).  
    - Outcome: Commercial and pedagogical practices align—but risk reducing art to moral ledger.  

  - **Uniform Irrelevance (Radical Autonomy):**  
    - Curricula: Remove ethical disclaimers; teach art as autonomous artifacts ("art for art's sake").  
    - Museums: Eliminate wall texts referencing biography; focus solely on formal analysis.  
    - Market: Current practices validated; no disclosure required.  
    - Outcome: Neutralizes "cancel culture" tensions but ignores art's socio-ethical entanglements.  

  **Conclusion:** The asymmetry reflects a fragmented institutional ontology: visual art is treated as **biographically porous** in education, **commercially sterile** in markets, and non-visual arts as **formally sealed**. Only institutionalism fully reconciles the triad, revealing how contexts dictate art's perceived moral negotiability. Shifting to uniformity would require overthrowing domain-specific norms—most radically, forcing markets to accept moral relevance or museums to abandon ethical pedagogy.
