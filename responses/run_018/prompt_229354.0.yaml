answer: |-
  Below is a one-page flowchart handout designed to navigate the logical space of positions on the lottery and preface paradoxes. The tree is built from diagnostic questions about concrete cases, with positions slotted in as leaves. It treats the paradoxes jointly, flags asymmetric resolutions, and includes a stress test. The tree is four questions deep, yielding 10 leaves (including unmotivated/incoherent branches). Key features:  
  - **Diagnostic questions** focus on verdicts about the ticket holder and modest author.  
  - **Leaves** cover required positions (Kyburg-style, threshold, eliminativist, knowledge-aim, heretical) plus stability, contextualism, and two-notions views.  
  - **Asymmetric resolution**: One leaf handles the paradoxes differently.  
  - **Stress test**: Three cases (archivist, two-author preface, and a splitting case) to evaluate leaves.  

  ---

  ### **Where Do You Actually Stand on the Lottery and Preface?**  
  *Answer the questions below to find your position. Start from the top after hearing both paradoxes.*  

  #### **Q1: In a fair lottery with 1 winning ticket and 1,000,000 tickets, can a rational ticket holder believe their ticket will lose?**  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  #### **Q2: For the modest author (who believes her book has an error), is it rational to believe each claim in her book?**  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  #### **Q3: Does outright belief in everyday propositions (e.g., "my keys are on the table") require the same certainty as mathematical proof?**  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q7.  

  #### **Q4: For the modest author, is it rational to believe the book contains an error?**  
  - **Yes** → Go to Q8.  
  - **No** → Leaf **"Preface Immodesty"** (Unmotivated: Rejects author’s modesty, a core feature of the paradox.)  

  #### **Q5: In the preface case, is it rational to believe the book contains an error?**  
  - **Yes** → Leaf **"Asymmetric Stability"**: Lottery beliefs are irrational (unstable under new evidence), but preface beliefs are rational (stable). Resolves paradoxes differently.  
  - **No** → Leaf **"Unmotivated Asymmetry"** (Unmotivated: Why reject lottery but accept preface claims, yet deny error?)  

  #### **Q6: Is the concept of "outright belief" a useful/real feature of rationality?**  
  - **Yes** → Leaf **"Knowledge-Aim View"**: Belief constitutively aims at knowledge. Lottery/preface propositions aren’t known, so not believed.  
  - **No** → Leaf **"Eliminativism"**: Outright belief is a folk-psychological mistake; only credences exist.  

  #### **Q7: Can rational belief in a proposition depend on contextual factors (e.g., stakes, practical interests)?**  
  - **Yes** → Leaf **"Contextualism"**: "Belief" is context-sensitive. Lottery denial isn’t rational in high-stakes contexts; preface beliefs are.  
  - **No** → Leaf **"Two-Notions View"**: Belief (for knowledge) ≠ acceptance (for action). Lottery isn’t believed; preface claims are accepted, not believed.  

  #### **Q8: Must a rational agent who believes each claim in a book also believe their conjunction?**  
  - **Yes** → Leaf **"Heretical View"**: Rational agents may knowingly hold inconsistent beliefs (e.g., each claim AND the error).  
  - **No** → Go to Q9.  

  #### **Q9: Is rational belief solely a matter of high probability?**  
  - **Yes** → Leaf **"Threshold/Lockean View"**: Belief = credence above threshold. Paradoxes are the honest price of probabilistic rationality.  
  - **No** → Leaf **"Kyburg-Style View"**: Rational acceptance isn’t closed under conjunction. Believe each claim AND the error, but not the conjunction.  

  ---

  ### **Position Summary & Commitments**  
  - **Kyburg-Style View**: Modest author is **rational**.  
  - **Threshold/Lockean View**: Modest author is **rational** (paradoxes are inevitable).  
  - **Eliminativism**: Modest author is **irrational** (no outright beliefs exist).  
  - **Knowledge-Aim View**: Modest author is **irrational** (neither claims nor error are known).  
  - **Heretical View**: Modest author is **rational** (inconsistency is tolerable).  
  - **Asymmetric Stability**: Modest author is **rational** (preface beliefs are stable; lottery beliefs are not).  
  - **Contextualism/Two-Notions**: Modest author is **rational** for "acceptance" but not "belief".  
  - **Unoccupied Branches**:  
    - "Preface Immodesty" (Q4=No): Unmotivated (rejects modesty).  
    - "Unmotivated Asymmetry" (Q5=No): Unmotivated (no justification for asymmetric rejections).  
    - *Tree cannot split Threshold/Lockean from Kyburg-Style on closure alone* (both reject conjunction).  

  ---

  ### **Stress Test: Apply Your Leaf to These Cases**  
  1. **The Archivist**: Believes each of 1,000,000 records is accurate (after checking) but believes ≥1 record is wrong.  
     - **Flunks**: Knowledge-Aim (no knowledge of accuracy/error), Eliminativism (no beliefs).  
     - **Passes**: Others (e.g., Threshold/Kyburg: high probability; Heretical: inconsistency allowed).  
  2. **Two-Author Preface**: Co-authors each believe their *own* chapters are error-free but believe the *other*’s contain an error.  
     - **Flunks**: Stability (mutual distrust undermines stability), Knowledge-Aim (no knowledge of others’ errors).  
     - **Passes**: Threshold/Kyburg (high probability), Heretical (inconsistency allowed), Contextualism/Two-Notions.  
  3. **Splitting Case (Designed to Separate Threshold & Kyburg)**: An agent has 1,000 independent claims, each with 0.999 credence. They believe each claim and the negation of the conjunction. Do they *retract a belief* upon learning the conjunction’s probability is 0.367?  
     - **Threshold View**: No retraction (beliefs based on individual credences).  
     - **Kyburg-Style View**: Retract (acceptance rules forbid believing low-probability conjunctions).  
     - *This splits leaves that agree on Q1–Q8 but diverge on whether probability governs retraction.*  

  ---

  **Notes**:  
  - The tree prioritizes concrete verdicts over jargon (e.g., Q8 replaces "closure under conjunction").  
  - "Modest author irrational" flagged in Eliminativism/Knowledge-Aim views.  
  - Stress test (c) exposes Threshold/Kyburg differences (credence vs. acceptance rules).  
  - Copy this to a single page for handout use.
