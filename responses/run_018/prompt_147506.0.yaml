  Hmm, this user serves on an evaluation board for historical research funding that focuses on non-human forces like pathogens and climate events as active contributors to social change. They're concerned about proposals slipping into environmental determinism while still recognizing real causal influences. They've identified two specific problems: "post-hoc ventriloquism" (attributing intentionality to non-human forces after outcomes are known) and "scalar slippage" (assigning macro-level agency to micro-level processes without mediation).

  The user wants me to create a reusable decision procedure as an ordered checklist that their panel can apply to proposals. It needs to distinguish legitimate causal attribution from determinism, include tests for those two failure modes, and have clear thresholds for rejection. They also want me to apply this procedure to two case studies: one about the Black Death's effect on English labor contracts, and another about the Laki eruption's role in the French Revolution. Finally, I need to explain what would cause me to revise the procedure and where it might be vulnerable.

  This is quite sophisticated! The user is clearly an expert in historical methodology grappling with complex epistemological issues. They're trying to institutionalize rigorous evaluation standards. Their concerns about anthropomorphism and scale confusion are spot-on - these are common pitfalls in environmental history.

  For the decision procedure, I'll build it as a sequential checklist with binary gates. It should start with basic causal hygiene (Step 1), then test for ventriloquism (Step 2), scalar slippage (Step 3), and finally determinism (Step 4). Each step needs clear pass/fail criteria and specified rejection points. I'll include explicit handoff points for normative judgments - probably when proposals involve contested theories of agency or acceptable explanatory scope.

  For the Black Death case, I expect it might pass Step 1 but could fail Step 2 if it anthropomorphizes the plague. The labor contract changes are well-documented, so mediation pathways should be verifiable. The Laki case seems more problematic - connecting an Icelandic eruption to French political unrest likely involves major scalar slippage. The mediating mechanisms would be complex and indirect.

  The procedure's fragility lies in how we define "adequate mediation" - that threshold could be arbitrary. New research showing tighter couplings between environmental triggers and institutional responses might force revision. Also, if posthumanist theories gain traction, our rejection of non-human agency might need rethinking. I should emphasize that the procedure is provisional and must evolve with the field.
answer: |-
  Below is a reusable decision procedure in checklist form, designed to evaluate proposals on non-human forces in history while guarding against determinism, post-hoc ventriloquism, and scalar slippage. The procedure proceeds sequentially, with rejection occurring at the first unmet criterion unless specified otherwise. **Human judgment handoffs** occur where empirical evidence cannot resolve normative/theoretical boundaries.

  ---

  ### **Decision Procedure: Non-Human Agency in Historical Causation**  
  **Goal**: Distinguish legitimate constrained contingency ("causal attribution") from determinism.  

  #### **Step 1: Causal Hygiene Check**  
  *   **Question**: *Does the proposal specify the *mechanism* by which the non-human force (pathogen, climate, etc.) altered *human decision-making environments* (e.g., resource scarcity, mortality rates, logistical constraints)?*  
      *   **Sufficient Answer**: Explicit identification of altered material conditions (e.g., labor shortage, crop failure, trade disruption) that reshaped incentives, costs, or risks for human actors.  
      *   **Insufficient**: Vague assertions of "impact," "pressure," or "influence" without concrete pathways.  
      *   **Rejection Point**: Failure to specify mechanisms.  
      *   **Handoff**: None. Empirical baseline.  

  #### **Step 2: Post-Hoc Ventriloquism Test**  
  *   **Question**: *Does the proposal consistently treat the non-human force as a *context-setting mechanism* rather than an *intentional-like actor*, especially in predictive/comparative frameworks?*  
      *   **Sufficient Answer**: Non-human forces are described as altering constraints/opportunities; human institutions/actors are framed as making contingent choices *within* these new parameters. Language avoids teleology (e.g., "the plague created labor scarcity enabling workers to *demand* new contracts" – PASS; "the plague *demanded* new contracts" – FAIL).  
      *   **Insufficient**: Attribution of goals, strategies, or demands to non-human forces; inconsistent framing (mechanistic in analysis, agential in narrative).  
      *   **Rejection Point**: Persistent, uncorrected agential language for non-human forces.  
      *   **Handoff**: If agency language is metaphorical but clearly defined as such (requires judgment on scholarly acceptability).  

  #### **Step 3: Scalar Slippage & Mediation Test**  
  *   **Question**: *Does the proposal identify and empirically ground the *mediating institutional/political/social pathways* connecting the macro-scale non-human force to the specific historical outcome?*  
      *   **Sufficient Answer**: Clear articulation of how altered conditions (Step 1) interacted with existing institutions (e.g., manorial systems, tax policies, religious norms), conflicts, or human responses to produce the outcome. Explains *why* the outcome occurred *here/now* and not elsewhere/some other time.  
      *   **Insufficient**: Direct leaps from non-human force to macro-outcome (e.g., "Laki caused the French Revolution"); treating institutions as passive transmitters; lack of comparative context.  
      *   **Rejection Point**: Absence of identified mediating pathways OR pathways are asserted without empirical support.  
      *   **Handoff**: If mediation is theorized but evidence is preliminary (judgment on plausibility/novelty).  

  #### **Step 4: Contingency & Determinism Threshold**  
  *   **Question**: *Does the proposal acknowledge *alternative plausible outcomes* or the *role of human contingency* within the altered environment?*  
      *   **Sufficient Answer**: Explicit discussion of choices made by actors, institutional flexibility/rigidity, competing responses, or counterfactuals showing the non-human force created conditions but did not dictate the single observed outcome.  
      *   **Insufficient**: Framing the outcome as the inevitable, singular result of the non-human force; dismissing human agency/culture as epiphenomenal.  
      *   **Rejection Point**: Explicit determinism OR complete omission of contingency.  
      *   **Handoff**: If contingency is acknowledged but downplayed – judgment on whether the balance is acceptable for the argument.  

  **Overall Outcome**:  
  *   Pass Steps 1-4: Fundable.  
  *   Fail any step: Reject or Major Revisions (if handoff allows).  
  *   Handoff: Panel deliberates on normative/theoretical acceptability per notes above.

  ---

  ### **Application to Case Studies**  

  #### **Case 1: Black Death & English Labor Contracts (1350s)**  
  *   **Step 1 (Mechanism)**: Likely PASS. Proposal specifies mortality → labor scarcity → altered bargaining power.  
  *   **Step 2 (Ventriloquism)**: **STALL/RISK**. If proposal says "labor scarcity *forced* lords to accept new contracts," it may pass (constraint). If it says "the Plague *demanded* fair wages," it fails. **Resolution**: Check manuscript language/analysis framing. Require revision if agential.  
  *   **Step 3 (Mediation)**: **KEY TEST**. PASS if it details *how* scarcity interacted with existing feudal structures, peasant solidarity, legal precedents (e.g., Ordinance of Labourers 1349), and regional variations. FAIL if it claims mortality "directly reshaped" contracts without institutional/political mediation.  
  *   **Step 4 (Contingency)**: PASS if it notes varied lordly responses, failed enforcement, or prior tensions enabling change.  
  *   **Judgment**: Clear PASS if mediation is robust; REJECT if mediation is absent or ventriloquism is pervasive.  

  #### **Case 2: Laki Eruption (1783) & French Revolution (1789)**  
  *   **Step 1 (Mechanism)**: Likely PASS. Proposals often cite volcanic aerosols → climate anomaly → crop failures → famine → popular unrest.  
  *   **Step 2 (Ventriloquism)**: **STALL**. High risk of phrases like "Laki triggered the Revolution." **Resolution**: Scrutinize language. "Laki contributed to famine that fueled unrest" (PASS); "Laki overthrew the monarchy" (FAIL).  
  *   **Step 3 (Mediation - CRITICAL)**: **HIGH FAILURE RISK**. Must specify: How did famine translate into *political* unrest? Where is the link between subsistence crises and *constitutional demands*? Mediation requires analysis of:  
      *   Government responses (grain policies, tax relief failures).  
      *   Pre-existing political mobilization (Enlightenment ideas, Estates-General debates).  
      *   Class conflicts (aristocratic vs. royal vs. popular interests).  
      *   **SUFFICIENT?** Only if these pathways are empirically grounded and Laki's role is weighted *alongside* them.  
      *   **INSUFFICIENT**: "Laki caused famine, famine caused revolution."  
  *   **Step 4 (Contingency)**: FAIL if revolution is framed as Laki's inevitable result. PASS if Laki is one stressor exacerbating tensions resolvable in other ways (e.g., reform).  
  *   **Judgment**: Likely REJECT due to scalar slippage unless mediation is exceptionally rigorous. **Stall Resolution** requires evidence linking Laki's climatic effects *specifically* to the breakdown of elite cohesion or revolutionary ideology formation – not just general unrest.  

  ---

  ### **Procedure Revision Triggers & Fragilities**  
  1.  **Revision Trigger**: Discovery of **Tightly Coupled Systems** where specific environmental shifts *reliably* trigger near-identical institutional responses across diverse contexts *without* significant mediation (e.g., proof that *all* volcanic winters above severity X cause regime collapse within 5 years regardless of institutions). This blurs the causal agency/determinism boundary.  
  2.  **Fragile Boundary: Mediation Adequacy**. The threshold for "sufficient mediation" (Step 3) is inherently subjective. New methodologies (e.g., computational models of institutional networks) might redefine adequacy, forcing procedure updates.  
  3.  **Exposed Reasoning**:  
      *   **Step 2's** rejection of *all* agential language risks stifling innovative narrative approaches if applied dogmatically.  
      *   **Step 3's** demand for "empirically grounded pathways" may disadvantage studies of poorly documented periods/regions.  
      *   **Step 4's** contingency requirement could undervalue cases where environmental constraints *severely* limited viable options (e.g., island biogeography).  
  4.  **Collapse Point**: If **posthumanist theories** (granting non-humans legitimate agency) gain widespread scholarly acceptance, the procedure’s core anthropocentric framing (agency = human contingency) would require fundamental overhaul.  

  This procedure provides a scaffold for consistent evaluation, prioritizing empirical rigor and theoretical coherence while flagging areas requiring panel deliberation. Its strength lies in sequential gatekeeping against common failure modes, but its application demands scholarly judgment at defined handoff points.
