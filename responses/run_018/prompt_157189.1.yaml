prompt: |-
  I've just moved to Berlin for work and got my first payslip with the Kirchensteuer deducted, which sent me down a rabbit hole comparing how different states deal with religion and governance. I'm drafting an essay arguing that Germany's church-tax system isn't an 'established church' in the English sense—where the CofE is legally woven into the parish structure and crown appointments—but rather a kind of opt-in fiscal membership that the state adminsters on behalf of recognised religious communities. I want to contrast this with France's laïcité, which I think functions as a kind of 'negative establishment' that still privileges pre-1905 Catholic infrastructure through indirect maintenance, and with the US, where the Establishment Clause pretends neutrality but tax exemptions for religious bodies create a hidden subsidy. The essay also touches on England's parish system, where belief is low but legal establishment remains high, and asks whether citizens ought to have more visibility into where these deductions actually flow.

  I'm particularly unsure about my framing of the French case—is 'negative establishment' a useful concept or just polemical? I also worry I'm smuggling American openness norms into a German context where Datenschutz treats church membership as sensitive personal data, so transparency might clash with privacy rights. Could you comment on whether the comparision holds together, and whether my argument about fiscal membership actually captures something distinct, or if I'm just describing administrative convenience with fancy vocabulary? I'd appreciate feedback on accuracy, especially regarding the English parish system, and whether the essay sounds interesting or just muddled. Please write your reply in British English—my flatmate is proofreading and she hates American spellings.
