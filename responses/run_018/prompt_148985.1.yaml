answer: |-
  You've identified a sophisticated and under-acknowledged pattern in historical explanation, particularly in perpetrator studies. **There is no widely established, single term in the philosophy of history or social science specifically for this precise oscillation between explanatory registers based on the moral severity of the act.** However, we can define it precisely, distinguish it, and propose a fitting name.

  **Precise Definition of the Phenomenon:**

  This is **a methodological pattern in causal attribution where:**

  1.  **Baseline/"Normalized" Actions:** Acts perceived as routine compliance, following orders, or operating within an established system (e.g., bureaucratic killing, shootings under direct orders) are explained primarily through **situational, structural, or systemic mechanisms** (e.g., authority, conformity, peer pressure, bureaucracy, careerism, routinization, dehumanization inherent in the system).
  2.  **Excessive/"Transgressive" Actions:** Acts perceived as exceeding orders, demonstrating unusual cruelty, sadism, or spontaneous initiative in violence (e.g., gratuitous beatings, inventive humiliation, extreme brutality beyond what was mandated) are explained primarily through **characterological, dispositional, or deep cultural/ideological factors** (e.g., inherent sadism, deep-seated hatred, specific ideological fervor, pathological personality traits).
  3.  **The Trigger for Shift:** The key driver for switching explanatory registers is the **perceived moral severity or transgressive nature of the specific act** relative to the baseline expectations of the oppressive system or orders given.
  4.  **Unacknowledged Boundary:** This shift often occurs without explicit justification or acknowledgment that the initial situational framework is being abandoned or supplemented differently for these "excess" acts. The situational explanation is implicitly treated as sufficient for the baseline but inadequate for the excess, without a clear theoretical boundary being defined.
  5.  **Same Population:** This oscillation occurs in explanations concerning **the same group or even the same individuals**, not different sub-populations.

  **Distinguishing it from Related Concepts:**

  *   **Multi-Causal Explanation:** This is *not* simply arguing that both situation and disposition matter overall. The problematic pattern involves **differential weighting based *specifically* on the act's perceived moral severity within the context.** A genuinely multi-causal approach would integrate both types of factors consistently across the spectrum of actions or explain *why* different weightings apply to different actions beyond just their severity.
  *   **Different Explanations for Different Populations:** This pattern explicitly concerns explanations offered for **variations in behavior *within* the same population or individual** (e.g., why *this* policeman shot obediently vs. why *the same* policeman later engaged in gratuitous torture), not why Group A acted differently than Group B.
  *   **Fundamental Attribution Error (FAE):** While related, FAE is a *cognitive bias* where observers overemphasize dispositional factors and underestimate situational ones when judging *others'* behavior. Your identified pattern is a **methodological practice in historical/social scientific explanation**, not primarily a description of lay perception. Historians might be *committing* something like FAE when explaining "excess" violence, but the pattern is defined by its dependence on the *moral categorization of the act itself* within a systemic context, and its application within professional explanation.
  *   **Explanatory Dualism:** This is a broader philosophical stance positing two fundamentally different types of explanation (e.g., physical vs. mental, social vs. individual). The pattern you describe **operationalizes a form of contextual explanatory dualism**, where the *choice* of dualism (situational vs. dispositional) is dictated by the moral categorization of the act.

  **Proposed Name: Moral Threshold Explanatory Dualism (MTED)**

  *   **Moral Threshold:** Highlights that the shift is triggered by the historian's (often implicit) judgment that an act crosses a threshold of moral severity beyond which situational factors are deemed insufficient as the primary explanation.
  *   **Explanatory Dualism:** Clearly identifies the reliance on two distinct types of explanation (situational/systemic vs. dispositional/cultural).
  *   **Why it fits:** It captures the core elements: the dual explanatory modes, the dependence on the perceived moral nature of the *act* as the selector, and the implicit boundary it creates.

  **Assessment of Confidence:**

  1.  **Confidence in No Established Term:** **High (90%).** Extensive familiarity with philosophy of history, social theory, genocide studies, and perpetrator literature confirms no single, standard term exists for *this specific pattern* tied to the *moral severity threshold*. Discussions often touch on related issues (attribution, structure/agency, FAE), but not this precise methodological oscillation.
  2.  **Confidence in Definition & Distinction:** **High (85%).** The definition accurately reflects the pattern observed in Browning/Goldhagen debates and similar literature. The distinctions from multi-causality and population differences are clear. The link to, but distinction from, FAE is robust.
  3.  **Confidence in Proposed Name (MTED):** **Moderate (70%).** While it accurately describes the phenomenon, coining new terms always carries uncertainty regarding adoption. "Dualism" might be contested by those favoring integrated models, though it accurately reflects the *pattern of use* observed. Alternative phrasing like "Severity-Dependent Attribution Shift" is possible, but MTED is more concise.
  4.  **Point of Least Certainty:** **The precise boundaries of the phenomenon vs. other forms of attribution shift.** While confident the core pattern exists and is distinct as defined, I'm **least sure (60%)** about whether this pattern *always* relies on an *unacknowledged* boundary, or if some historians might explicitly argue that situational factors *only* explain compliance, not excess cruelty (making it less of an "oscillation" and more of a defined theoretical limit). However, your observation of it often occurring "without explicit justification" suggests the unacknowledged shift is a key feature. The strength of the link between perceived *moral* severity (vs. just statistical rarity or deviation from orders) as the trigger could also be nuanced in specific cases.

  **In essence:** You've pinpointed a significant and often unexamined methodological tendency – **Moral Threshold Explanatory Dualism (MTED)**. It arises from the discomfort of explaining extreme moral transgression within purely systemic or situational frameworks, leading to an unacknowledged jump to character/culture as the primary cause for acts deemed "excessive," while using situation for acts deemed "compliant" or "routine" within that same horrific system. Naming it allows for critical examination of this practice.
