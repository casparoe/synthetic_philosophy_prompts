  ### Modified Centipede Game Activity Design  
  **Objective:** Simulate the backward-induction paradox by introducing hidden reasoning types, forcing students to second-guess opponents' rationality without fixed endpoint computation.  

  ---

  #### **Materials**  
  - **Game Sheets (6 copies):**  
    - Linear payoff tree for 4 nodes (A/B roles, alternating turns):  
      - **Node 1 (A):** Take → (A: 4, B: 1); Pass → Node 2.  
      - **Node 2 (B):** Take → (A: 2, B: 6); Pass → Node 3.  
      - **Node 3 (A):** Take → (A: 8, B: 4); Pass → Node 4.  
      - **Node 4 (B):** Take → (A: 6, B: 12); Pass → (A: 0, B: 0).  
  - **Role Cards (12):** Secretly assigned types (4 × Myopic, 4 × One-Step, 4 × Full).  
  - **Timer** (for 5-minute rounds).  

  ---

  #### **Setup (5 min)**  
  1. **Pair Students:** Divide 12 students into 6 pairs. Assign Player A (starts at Node 1) and Player B.  
  2. **Secret Type Assignment:**  
     - Randomly distribute role cards (hidden from partners).  
     - **Myopic:** Values only immediate visible payoff.  
     - **One-Step Backward-Inductor:** Values immediate payoff *minus* the difference between their *next* turn’s visible payoff and current payoff (if next is higher).  
     - **Fully Backward-Inductor:** Values immediate payoff *minus* the difference between their *best future* visible payoff and current payoff (if future is higher).  
  3. **Explain Rules:**  
     - Players decide **Take** (split pot, end round) or **Pass** (continue) at their node.  
     - **Visible payoffs** are fixed (see tree). **Hidden payoffs** (revealed post-game) alter incentives based on type.  
     - **Goal:** Maximize *hidden* payoff. Types are fixed across all rounds; distribution (4/4/4) is known, but individual assignments are secret.  
     - Play **4 rounds** (5 min/round) with the same partner.  

  ---

  #### **Hidden Payoff Calculation (Key for Facilitator)**  
  | Type                 | Hidden Payoff at Node *n* (for Player *X*)                                                                 | Example (Node 1, A)                                                                 |  
  |----------------------|------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Myopic**           | Visible payoff for *X* at *n*                                                                             | `4` (visible payoff)                                                               |  
  | **One-Step**         | `Visible payoff at n` – `max(0, [X’s *next* visible payoff – X’s current payoff])`                       | `4 – max(0, [8 – 4]) = 0` (A’s next turn at Node 3 = 8)                           |  
  | **Full**             | `Visible payoff at n` – `max(0, [X’s *best future* visible payoff – X’s current payoff])`                | `4 – max(0, [8 – 4]) = 0` (A’s best future = 8 at Node 3)                         |  

  - **Node 4:** All types use visible payoff (no future turns).  
  - **Rational Play:** Players take if hidden payoff > expected payoff from passing (based on beliefs about partner’s type).  

  ---

  #### **Gameplay (30 min)**  
  1. **Rounds 1–4:**  
     - Pairs play sequentially (A → B → A → B). Players write decisions privately, then reveal simultaneously.  
     - **Facilitator Prompt:** *"Decide based on your hidden payoff. Remember: Your partner is one of three types."*  
  2. **Record Outcomes:** Note where/when defection (Take) occurs. Common patterns:  
     - **Myopic A:** Likely takes at Node 1 if expects B to take at Node 2.  
     - **Non-myopic A/B:** Pass early if believes partner will pass (e.g., One-Step B passes at Node 2).  

  ---

  #### **Debrief (25 min)**  
  1. **Reveal Types (5 min):** Share hidden assignments. Discuss how types influenced decisions.  
  2. **Map Moments to Backward Induction (15 min):**  
     - **Early Defection (e.g., Take at Node 1):**  
       - *"Myopic A took immediately. Why? They saw 4 > expected payoff if B takes at Node 2 (2). But One-Step A (hidden=0) passed, hoping B would pass and let them get 8 at Node 3."*  
     - **Unexpected Continuation (e.g., Pass at Node 2):**  
       - *"One-Step B passed (hidden=0 < 4 from A taking at Node 3). This mirrors Step 2 of backward induction, but collapsed because B doubted A’s rationality."*  
     - **Paradox Breakdown:**  
       - *"Standard backward induction requires common knowledge of rationality. Here, uncertainty about types unraveled cooperation: A passed at Node 1 fearing B might pass, but B took at Node 2 fearing A might not pass later."*  
  3. **Limitation Note (5 min):**  
     - *"This version cannot reproduce the deterministic chain of common knowledge. In the classic paradox, Player A takes immediately because they* know *B is rational, B* knows *A knows, etc. Here, we replaced certainty with beliefs about types—which I verbally imposed as a 'what if'."*  

  ---

  #### **Predicted Failure Mode**  
  - **Type-Guessing Over Induction:** Students may focus on "spotting" types (e.g., "B passed, so they’re One-Step") rather than recursively modeling beliefs. This reduces the game to probability guessing, dampening the paradox’s tension.  
  - **Mitigation:** Emphasize in rules: *"Your decision should maximize your hidden payoff given beliefs about your partner’s likely action, not just their type."*  

  ---

  #### **Practical Pitfalls**  
  - **Complex Hidden Payoffs:** Students may confuse hidden/visible payoffs. Clarify: *"Hidden payoffs change what you ‘feel’ when taking, but the money split is always visible."*  
  - **Time Pressure:** Enforce strict 5-minute rounds to prevent over-calculation.  
  - **Pair Dynamics:** Assign roles (A/B) firmly to avoid turn confusion.  

  **Outcome:** Students experience the paradox’s unraveling through type uncertainty, not endpoint computation, revealing how fragile cooperation is under bounded rationality.
