            In round2:
              - If A is non-myopic: they still pass (because 0 < 2? but if they pass and B is myopic, they get 2; if they take, they get 0. So passing is better).
              - If A is myopic: they take in round2 if they learned that B is myopic in round1.

            But note: the type of B is fixed. So if in a pair, B is myopic, then:

              Round1: 
                A (regardless of type) passes.
                B (myopic) takes -> A gets 2, B gets 6.

              Round2:
                If A is non-myopic: passes -> B takes -> A gets 2, B gets 6.
