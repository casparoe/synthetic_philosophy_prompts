  For those interested, here's a summary of the expected utility calculation with loss aversion (\(\lambda = 2\)):  
  - **Loss region (n=1 to 4)**:  
    - \(E[U_{\text{loss}}] = \lambda \times [ -28 \times (1/2) - 26 \times (1/4) - 22 \times (1/8) - 14 \times (1/16) ] = 2 \times (-24.125) = -48.25\)  
  - **Gain region (n=5 to 18 and n≥19)**:  
    - For n=5 to 18: \(E[U_{\text{gain1}}] \approx 12.125\)  
    - For n≥19: \(E[U_{\text{tail}}] \approx 1.907\)  
    - Total \(E[U_{\text{gain}}] \approx 14.032\)  
  - **Overall expected utility**: \(E[U] = E[U_{\text{loss}}] + E[U_{\text{gain}}] \approx -48.25 + 14.032 = -34.218\) (strongly negative).
