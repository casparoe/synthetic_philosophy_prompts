answer: |-
  ### Exam Question: Advanced Population Ethics (90 minutes, ~1200 words)

  **Policy Dilemma:**  
  Scenario A: A stable population of 10 billion persons, each at welfare level 100 (flourishing lives with complex experiences).  
  Scenario B: The same 10 billion persons at welfare level 100, *plus* 100 billion additional beings existing at welfare level 1. These beings possess minimal consciousness: they experience only the barest sensory awareness (e.g., undifferentiated pleasure/pain), lack cognitive capacities for agency or relationships, and cannot be harmed in any morally recognizable way beyond the absence of higher welfare. Their inclusion in the "scope of moral concern" is philosophically contested.  

  **Instructions:**  
  Evaluate whether a *threshold-sensitive person-affecting totalism* (TSPAT) can coherently justify preferring Scenario A over Scenario B without collapsing into:  
  (i) pure average utilitarianism, or  
  (ii) an ad hoc welfare cutoff.  
  Further, assess whether the "minimally conscious" framing introduces a *distinct boundary problem* ignored in standard debates about aggregation.  

  Address the following in your essay:  
  1. Why classical totalism straightforwardly prefers Scenario B.  
  2. How unmodified person-affecting views struggle with Scenario B’s *additional* beings.  
  3. The mechanics of TSPAT (e.g., discounting welfare below a threshold; restricting aggregation to "persons").  
  4. Whether TSPAT’s threshold can avoid arbitrariness *and* distinguish itself from averageism.  
  5. Whether minimal consciousness complicates aggregation boundaries beyond welfare thresholds.  

  ---

  ### Model Answer (650 words)  

  **I. The Totalist Impulse and Person-Affecting Limits**  
  Classical total utilitarianism prefers Scenario B because aggregate welfare increases (Total A: 10B × 100 = 1 trillion units; Total B: (10B × 100) + (100B × 1) = 2 trillion units). This is the Repugnant Conclusion’s core logic: larger populations with lower average welfare are obligatory if total welfare rises. Person-affecting views (PAV) resist this by requiring acts to benefit *specific* individuals. However, in Scenario B, the additional 100 billion beings would not exist in Scenario A. Since they experience net-positive welfare (level 1 > non-existence), PAV cannot claim they are harmed by choosing B, creating the *non-identity problem*. Standard PAV thus lacks grounds to object to B—a critical weakness.  

  **II. Threshold-Sensitive Person-Affecting Totalism (TSPAT) Defined**  
  TSPAT modifies totalism with two constraints:  
  - **Threshold Sensitivity**: Welfare units below a critical threshold (e.g., level 10) are either discounted (e.g., counted as 0.1 units) or excluded from aggregation.  
  - **Person-Affecting Scope**: Only welfare affecting beings with *personhood* (e.g., self-awareness, agency) is aggregated. Minimally conscious beings fall below this threshold.  
  Thus, TSPAT evaluates Scenario B as: (10B × 100) + (100B × 0) = 1 trillion units (vs. A’s 1 trillion). A and B are equivalent, blocking the Repugnant Conclusion.  

  **III. Coherence Challenges: Averageism and Arbitrariness**  
  TSPAT avoids averageism because it aggregates *all* welfare *above* the threshold. Averageism would reject B even if the additional beings had welfare *above* the threshold (e.g., level 50), but TSPAT would accept B in that case. The threat of arbitrariness, however, looms larger. Why set the threshold at welfare level 10? Or define "personhood" by complex cognition? One defense ties thresholds to *emergent moral capacities*: beings below the threshold cannot participate in reciprocity, meaning-making, or rights-based systems—cornerstones of person-affecting obligations. This grounds thresholds in functional traits, not welfare numbers. Yet this remains contested: if minimal consciousness is intrinsically valuable, exclusion risks moral blindness.  

  **IV. The Boundary Problem of Minimal Consciousness**  
  Minimal consciousness introduces a dilemma absent in standard aggregation debates: **whether undifferentiated subjective experience has moral weight**. Standard theories debate *how much* welfare matters, but here the question is *whether* it qualifies as "welfare" for aggregation. If these beings lack preferences, memory, or selfhood, their "welfare level 1" may not belong on the same scale as persons’ welfare. TSPAT exploits this by excluding them from person-affecting scope. Yet this risks a double arbitrariness: (1) in defining consciousness thresholds, and (2) in denying that their positive experience has *any* aggregative value. If we grant them even fractional moral weight (e.g., 0.01 units), totalism’s pull toward B resurfaces.  

  **Conclusion**  
  TSPAT can block the Repugnant Conclusion in this case by excluding minimally conscious beings from aggregation, avoiding averageism by preserving totalism above the threshold. However, its success hinges on two contested moves: (1) linking personhood to higher cognitive capacities to evade arbitrariness accusations, and (2) treating minimal consciousness as a qualitative boundary rather than a quantitative welfare difference. The latter point exposes an underexplored problem in population ethics: when does "welfare" become too rudimentary to aggregate? Until this is resolved, TSPAT remains theoretically fraught but pragatically defensible.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **Must-Hit Moves:**  
  1. **Identify totalism’s preference for B & why it’s "repugnant"** (3 pts).  
     *Fail: Misstates totalism’s calculation or the Repugnant Conclusion’s structure.*  
  2. **Explain person-affecting views’ inability to oppose B due to non-identity** (5 pts).  
     *Fail: Claims PAV can easily reject B or ignores non-existents’ welfare.*  
  3. **Articulate TSPAT’s mechanics (threshold + personhood scope) to equalize A/B** (7 pts).  
     *Fail: Conflates TSPAT with averageism or omits personhood constraints.*  
  4. **Critically evaluate if TSPAT avoids arbitrariness *without* averageism** (5 pts).  
     *Fail: Assumes thresholds are inherently arbitrary or misses the personhood defense.*  
  5. **Analyze minimal consciousness as a *distinct* boundary problem for aggregation** (5 pts).  
     *Fail: Treats consciousness as merely a low-welfare issue or ignores scope contests.*  

  **Grading Bands:**  
  - **A-Range (21–25):** Executes all 5 moves precisely. Distinguishes settled logic (e.g., totalism→B) from contested issues (threshold defensibility).  
  - **B-Range (15–20):** Competent but misses/mishandles ≥2 moves (e.g., skips non-identity problem; conflates exclusion with averageism).  
  - **C/D Range (<15):** Summarizes canonical Repugnant Conclusion or taxonomy; fails to engage the scenario’s unique features.  

  **Settled vs. Contested Clarifications:**  
  - Settled: Totalism implies preferring B; PAV struggles with non-identity.  
  - Contested: Whether thresholds can be non-arbitrary; whether minimal consciousness belongs in aggregation.  
  *No position assumed as consensus on these points.*
