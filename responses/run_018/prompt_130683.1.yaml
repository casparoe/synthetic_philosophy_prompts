  Please provide:

  1. The exam question itself, with instructions that candidates have 90 minutes and should write approximately 1,200 words;
  2. A model answer of about 600 to 700 words that demonstrates the required conceptual moves;
  3. A marking scheme out of 25 points, structured around five must-hit analytical moves, with the point value for each, a one-line note on how candidates typically fail that move, and an explicit distinction between the A-range (all five moves executed with precision) and B-range (competent but missing or mishandling at least two).

  In both the model answer and the marking scheme, please clearly separate what is broadly settled in population ethics—such as the logical structure of the repugnant conclusion and the basic distinction between total and average aggregation—from what remains genuinely contested, including whether person-affecting restrictions can avoid arbitrariness, whether welfare below a given threshold should be excluded from moral aggregation, and whether minimal consciousness is a relevant boundary condition for moral status. Do not present any contested position—such as the claim that totalism is irredeemable, or that person-affecting views are ultimately defensible—as if it were the consensus view. Avoid bibliographic references, citation requests, or reading lists; the assessment should be evaluable entirely on conceptual grounds.
