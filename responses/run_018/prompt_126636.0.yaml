  But note: the United States model (presidential) requires impeachment (a special process) and the Latin American model (presidential) does not specify removal but typically requires an impeachment-like process. The Westminster and German models (parliamentary) have legislative removal. So the removal by the legislature (even with a supermajority) without an impeachment process is more in line with parliamentary systems.

