  But note that in the proposal, the chancellor has a fixed term (two years) but can be removed by a two-thirds vote. This is not a fixed term in the same sense as the US (where the president cannot be removed by a legislative vote without impeachment). So the survival rule would say it's parliamentary.

  However, the origin rule says presidential.

  Given the conflict, and because the cabinet secretaries are individually responsible (a parliamentary feature), it might lean parliamentary? Or it might be a hybrid.

  But note that the German system has a fixed term for the chancellor (until the next election) unless removed by a constructive vote. Similarly, in the Westminster system, the term is not fixed because the government can fall at any time. The proposal has a fixed two-year term but allows removal by the senate. So the term is fixed only conditionally.

