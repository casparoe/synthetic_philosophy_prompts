  ### Classification Prediction
  Professor Reed would classify the proposed student government executive as an **unstable hybrid**, not purely presidential or parliamentary. This is due to a conflict between the two core rules she uses for classification, which I identify below.

  ### Two General Rules
  Based on her prior classifications, Professor Reed applies two consistent rules:
  1. **Electoral origin of the executive**: 
     - If the executive is **directly elected by the people** (separately from the legislature), the system leans presidential. 
     - If the executive is **selected by the legislature**, the system leans parliamentary.
  2. **Legislative survival in office**: 
     - If the executive **can be removed by the legislature** through a routine vote (e.g., simple majority or constructive vote), the system leans parliamentary. 
     - If the executive **serves a fixed term** and can only be removed via an extraordinary process (e.g., impeachment), the system leans presidential.

  ### Application to the Chancellor Proposal
  - **Rule 1 (Electoral origin)**: The chancellor is chosen by **direct popular election** (ranked-choice voting) for a fixed term. This matches the presidential systems (e.g., U.S. and Latin American models), where the executive derives authority from a separate popular mandate.  
    *Prediction: Presidential.*

  - **Rule 2 (Legislative survival)**:  
    - The chancellor can be **removed by a two-thirds vote of the student senate** at any time, without requiring impeachment. This resembles parliamentary systems (e.g., Westminster and German models), where routine legislative votes can dismiss the executive.  
    - Cabinet secretaries must **maintain individual senate confidence**, a quintessentially parliamentary feature (as seen in Westminster), where ministers depend on legislative support.  
    *Prediction: Parliamentary.*

  ### Best-Guess Verdict with Reasoning
  **Verdict**: Unstable hybrid.  
  **Reasoning**:  
  - The **electoral origin** (direct election) is presidential, while the **survival mechanisms** (legislative removal and individual cabinet confidence) are parliamentary. This creates an institutional mismatch:  
    - A directly elected chancellor has a popular mandate, which could embolden them to defy the legislature.  
    - Simultaneously, the legislature can remove the chancellor with a supermajority vote and dismiss cabinet members individually, creating constant vulnerability.  
  This tension mirrors real-world hybrids (e.g., Peru or Weimar Germany), which often suffer from instability, such as frequent no-confidence votes or executive-legislative deadlock. Professor Reed would recognize this as an unstable hybrid because neither rule fully dominates, and the design risks conflict or paralysis.

  ### Additional Institutional Feature to Test the Rules
  To definitively reveal which rule Professor Reed prioritizes, change the **removal threshold for the chancellor**:  
  - **Current proposal**: Removal by a two-thirds senate vote.  
  - **Modified feature**: Require removal only via a **judicial impeachment process** (e.g., substantiated by "serious misconduct" and approved by a supermajority of a judicial panel, with no routine legislative vote).  

  **How this tests the rules**:  
  - **If she classifies the modified system as presidential**, she prioritizes **Rule 2 (survival)**. The change aligns removal with extraordinary processes (like the U.S. model), overriding the parliamentary survival features.  
  - **If she still classifies it as hybrid or parliamentary**, she prioritizes **Rule 1 (origin)**. The direct election remains, and cabinet confidence (parliamentary) persists, so the conflict endures despite the removal change.  

  This modification isolates survival as the decisive factor: if removal shifts from legislative to judicial, the survival rule becomes clearly presidential, resolving the hybrid.
