  We are given four cases and how Professor Reed classified them:

  1. **Westminster model**: 
     - Legislature selects PM and can dismiss by simple vote → parliamentary.
  2. **United States model**: 
     - Voters separately elect a chief executive for a fixed term, removal by impeachment → presidential.
