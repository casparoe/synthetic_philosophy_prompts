  4. **Latin American model**: 
     - Separately elected president who appoints ministers serving at presidential pleasure → presidential.

  From these, we can derive two general rules:

  **Rule 1: Electoral origin of the executive**
  - If the executive is elected by the legislature (or dependent on legislative confidence for appointment), then it is parliamentary.
  - If the executive is directly elected by the people (or separately from the legislature) for a fixed term, then it is presidential.

  **Rule 2: Legislative survival in office (i.e., how the executive can be removed)**
  - If the executive can be removed by the legislature without cause (by a simple vote or a constructive vote of no confidence) before the end of the term, then it is parliamentary.
  - If the executive can only be removed by an extraordinary process (like impeachment) and otherwise serves a fixed term, then it is presidential.

  Now, let's analyze the student government proposal:

  - **Electoral origin**: The chancellor is chosen by direct popular election using ranked-choice voting for a fixed two-year term. 
