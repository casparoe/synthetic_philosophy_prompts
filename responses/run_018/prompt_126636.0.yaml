  - **Removal**: The chancellor may be removed at any time by a two-thirds vote of the student senate. 
    - This removal mechanism is by the legislature (student senate) without requiring an extraordinary process (like impeachment). However, note that the threshold is two-thirds, which is a supermajority and not a simple majority. 
    - But in the parliamentary systems we saw (Westminster and German), removal is by a vote of the legislature. The Westminster model uses a simple majority, and the German model uses a constructive vote (which also requires a majority, but with the condition of having a successor). The key point is that removal is by the legislature and without an impeachment-like process. 
    - However, the two-thirds threshold is higher than a simple majority. But note that the German model requires a constructive vote (which is a majority) and the Westminster model requires a simple majority. The Latin American model (presidential) requires impeachment (a high bar). So a two-thirds vote is a high threshold but still a legislative vote without the formalities of impeachment.

  - **Cabinet secretaries**: Each must maintain individual senate confidence to remain in office.
    - This is a parliamentary characteristic. In parliamentary systems, ministers typically must maintain the confidence of the legislature. In presidential systems (like the US or the Latin American model described), the president appoints ministers without needing legislative confidence for each individually.

  Now, applying the two rules:

