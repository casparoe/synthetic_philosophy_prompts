  hey im stuck on a passage from Mises's 1920 essay on socialist calculation. here's the gist: in socialism there's no private ownership of capital goods, so there's no exchange of them, hence no prices. without prices planners cant rationlly compare costs of different production methods. he also says trying to do it in physical units fails because intermediate goods are too heterogenous — you can't add coal tons to steel tons in a meaningful sum. im confused whether he's claiming the price data is just missing, or that rational comparison is conceptually impossible even if you had all the data. also, if you imagine an AI generating shadow prices in real time across factories, does that solve the missing-data problem, or does Mises's point about no common denominator for capital goods still kill it? can you map out the argument and tell me where the AI scenario actually touches it?
