prompt: |-
  I am a novelist preparing a seminar presentation for an interdisciplinary workshop on narrative and causality. My thesis is that counterfactual reasoning in historiography suffers from what I term counterfactual viscosity: once an alternate branch is introduced, the structural demands of coherent explanatory narrative pull plausible reconstructions back toward the actual historical outcome, not through causal determinism but through the coherence constraints that govern retrospective explanation. I argue that this undermines the standard historiographic use of counterfactuals to demonstrate contingency, and that historical inevitability is partly an artifact of our narrative frameworks rather than an ontological feature of the past itself. The audience comprises six professional historians, mostly in social and intellectual history, who are skeptical of philosophy-of-history abstractions; two philosophers of science who know the Lewis-Stalnaker semantics of counterfactuals well but have little background in narrative theory; and one literary theorist who studies narrative causality. They are not hostile, but they are protective of disciplinary methods and likely to treat my claim as an encroachment of fiction-writing sensibility onto evidentiary practice.

  Draft my Q&A prep sheet. Structure the response exactly as follows.

  1. Thesis and Audience Summary (approximately 150 words): restate the core claim of counterfactual viscosity and map each segment of the audience to the specific form of resistance they will offer.

  2. Ordered Objections (approximately 600 words): list the eight objections I will actually face, ordered from the most damaging to the least. For each, identify who will raise it (historian, philosopher, or literary theorist), phrase it exactly as they would phrase it in the room, note whether it targets my conceptual framework or my disciplinary competence, and rate its damage on a scale of 1 to 5.

  3. Two-Minute Replies and Vulnerabilities (approximately 600 words): for each objection, provide a concise reply I can deliver in roughly two minutes, followed by a brief note on where the reply is weakest or concedes too much. Be honest about which replies rely on analogies drawn from fiction rather than from historiography.

  4. What to Concede Up Front (approximately 200 words): identify the two points I should concede in my opening remarks to lower the temperature, with the precise language of each concession.

  5. The Dreaded Question (approximately 250 words): describe the single question I am hoping nobody asks, explain why it is uniquely dangerous for my position, provide the best reply I can manage, and flag the precise point in that reply where I stand on softest ground.

  6. Closing Strategy (approximately 150 words): advise on the one line I must land in the final exchange for the proposal to survive, and on the tone to adopt when the philosophers press me on formal semantics.

  Do not include a bibliography, reading list, or requests for citations. Do not quote from real texts; if you reference specific works, paraphrase without quotation marks.
