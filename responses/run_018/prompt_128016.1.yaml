prompt: |-
  I've been working through some political philosophy material on asylum and refugee obligations, and I'm struck by how every proposed principle—territorial sovereignty, cosmopolitan justice, associative duties—seems to dissolve once you try to apply it to the actual bureaucratic machinery that decides who gets in and who picks up the cost. I'd like you to write a satirical travel-guide entry, in the deadpan practical voice of a Lonely Planet page, for a fictional nation-state called the Republic of Aequitas that has fully implemented what it calls the Differential Recognition Protocol. The Protocol divides all arrivals into three categories—Status A (Genuine Displacement), Status B (Derivative Need), and Status C (Precarious Mobility)—and assigns them to host regions via an Absorptive Capacity Coefficient that weights GDP, housing vacancy rates, and a metric called Cultural Proximity Indices.

  The entry should run about 650 words and cover local customs (what a tourist should do if they witness a status-determination hearing), transportation (how the Equitable Burden-Sharing Railway moves people between regions), etiquette (how to address a Status C holder versus a Status A holder), practical tips for travelers (passing the entry exam for temporary visitor status, which tests knowledge of the Protocol's philosophical justifications), and a sidebar on the national holiday Allocation Day, celebrating the algorithm's architects. The satire should land the standard objections—who writes the classification rules, which demographics systematically fall into Status C, whether absorptive capacity correlates with willingness rather than justice, and the circularity of defining genuine displacement by reference to state interest—without ever stating them directly. The deadpan tone should make it readable to someone with no philosophy background, but the institutional details should be precise enough that someone familiar with the debates on who counts as a refugee and which states bear the obligation recognizes the parody as fair rather than straw-manning. Please do not include citations, bibliographies, or references to specific real-world treaties by article number; invent all institutional details freely, but keep the philosophical tensions they represent accurate.
