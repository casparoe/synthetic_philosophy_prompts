  But if Group3 (who prefer C) fear that C won't win, they might vote for B (their second choice) to prevent A. Then: A:7, B:6+5=11, C:0 -> B wins. Group3 prefers B over A? In their true preference: C>D>A>B, so they prefer B over A? No, they prefer A over B: they have A as third and B as fourth. So they prefer A over B. So this manipulation makes them worse off.

  Alternatively, Group2 might vote for C to prevent A? Then: A:7, B:0, C:5+6=11 -> C wins. Group2: true preference B>C>D>A, so they prefer C over A? Yes. So they get C (which is second best) instead of A (worst). So they are better off.

  So we can have a poll that shows: A:7, B:6, C:5, D:0. Then Group2 might strategically vote for C.

  In runoff (round2):
  Sincere first round: A:7, B:6, C:5 -> top two: A and B.
  Runoff: Group1: A>B -> A
          Group2: B>A -> B
          Group3: A>B? Wait, Group3: C>D>A>B -> so they prefer A over B. So they vote A.
          So A:7+5=12, B:6 -> A wins.

  But if in the first round, Group3 votes for B (strategically) then first round: A:7, B:6+5=11, C:0 -> top two: A and B. Then runoff same as above: A wins. No change.

  Alternatively, if Group2 votes for C in the first round (as they did in plurality), then first round: A:7, B:0, C:6+5=11 -> top two: A and C.
  Runoff:
     Group1: A>C -> A
     Group2: C>A -> C
     Group3: C>A -> C
     So C wins (6+5=11 vs 7). Group2 prefers C over A (true) and they get C. So they are happy.

  So in runoff, Group2 can manipulate by voting for C in the first round.

  Therefore, we'll use this non-single-peaked profile for all rounds.

  Summary of profile:
  - 7 students: A>B>C>D
  - 6 students: B>C>D>A
  - 5 students: C>D>A>B

  Options (mapped to activities?):
  - A: Archive trip
  - B: Debate
  - C: Guest speaker
  - D: Proofs workshop

  But note: the axis was formality, but this profile isn't single-peaked on that axis. We can explain in the debrief that the theorem doesn't require any structure on preferences.

  Poll for Round 1 (plurality): 
  Sincere would be A:7, B:6, C:5, D:0. 
  We add noise: ±2. So we might report: A:8, B:5, C:6, D:0. But then C has 6, B has 5. So Group2 (B supporters) might worry and vote for C? We want to encourage that.

  But note: the true sincere is A:7, B:6, C:5. We can perturb to A:8, B:5, C:5, D:0. Then it's a tie for second between B and C. This might make Group2 (B) and Group3 (C) both consider voting strategically.

  Alternatively, perturb to A:6, B:7, C:5, D:0. That's not possible because we only have 18 voters. We must have the poll numbers add to 18.

  We can do: A:8, B:6, C:4, D:0 -> total 18. This is close to sincere (A:7->8, B:6->6, C:5->4). Then Group3 (C) sees C is last and might vote for B? But they prefer B the least. Alternatively, they might vote for A? But they like A more than B? They have A third and B fourth. So they would not vote for B. They might vote for A to prevent B? But that doesn't make sense because if they vote sincerely, C gets 5, but if they vote for A, then A gets 7+1=8, B:6, C:4 -> same outcome? Not helpful.

  The manipulation we want is Group2 voting for C. So we want the poll to show that B is in danger of not being second? In sincere, B is second. But if the poll shows B and C are close, then Group2 might abandon B for C.

  So let the poll show: A:7, B:5, C:6, D:0. This adds to 18. It shows C is second and B is third. Then Group2 (B supporters) might vote for C to try to get C to win? They can't win in plurality, but they can get second? They might hope to get C into first? But it's not likely. Alternatively, they might vote for C to help C beat A? But in plurality, it's first-past-the-post.

  Alternatively, we can have a different kind of manipulation: Group1 (A) might vote for B to prevent C? But they like C better than B? They have B second, C third.

  Given the complexity, we might just use the sincere numbers in the poll but perturbed within the constraints, and let the students figure it out. The example above showed that Group2 can manipulate by voting for C in plurality and runoff.

  So for the poll in Round 1, we'll report: A:7, B:6, C:5, D:0 -> perturb by moving one vote from B to C: A:7, B:5, C:6, D:0. This shows C is second. Then we hope Group2 will consider voting for C.

  Scoring:

  In each round, points are awarded based on the winner and the student's true preference ranking:
  - 4 points if the winner is their first choice
  - 3 points for second
  - 2 points for third
  - 1 point for fourth

  Design Contest Test Preferences:

  We need a fixed profile for testing the rules. We can use the same non-single-peaked profile as above. But note: the design contest has teams of three. We can have each team represent one voter? Or we can have the test involve all teams (so 6 teams = 6 voters) and assign each team a preference ordering. We can use a smaller version of the non-single-peaked profile.

  Example for 6 voters (teams):

  Team1 (1 voter): A>B>C>D
  Team2 (1 voter): A>B>C>D
  Team3 (1 voter): B>C>D>A
  Team4 (1 voter): B>C>D>A
  Team5 (1 voter): C>D>A>B
  Team6 (1 voter): C>D>A>B

  But then the numbers are 2,2,2. This might not be manipulable. We need a profile that is vulnerable.

  Alternatively, we can use a profile with 6 voters that is manipulable.

  Example: 

  3 voters: A>B>C
  2 voters: B>C>A
  1 voter: C>A>B

  But we have four options. We can set D as universally last.

  But to save time, we can reuse the same non-single-peaked profile with 6 voters by scaling down:

  2 voters: A>B>C>D
  2 voters: B>C>D>A
  2 voters: C>D>A>B

  Then sincere plurality: A:2, B:2, C:2 -> tie. We need a tie-breaker.

  Alternatively, we can use a different profile.

  After some research, let's use the following for the design contest test (6 voters):

  Voter 1: A>B>C>D
  Voter 2: A>B>C>D
  Voter 3: B>A>C>D   [note: not the same as before]
  Voter 4: B>A>C>D
  Voter 5: C>B>A>D
  Voter 6: C>B>A>D

  Then sincere plurality: A:2, B:2, C:2 -> tie. We break the tie in favor of A (alphabetical). So A wins.

  But if Voter 5 and 6 (who love C) fear that C won't win, they might vote for B (their second choice) to prevent A. Then: A:2, B:2+2=4, C:0 -> B wins. They prefer B over A, so they are better off.

  So this is manipulable.

  But note: we have four options, and D is never voted for. We can include D, but it doesn't change.

  So for the design contest, we assign to each team (6 teams) one of the following:

  - Team1: A>B>C>D
  - Team2: A>B>C>D
  - Team3: B>A>C>D
  - Team4: B>A>C>D
  - Team5: C>B>A>D
  - Team6: C>B>A>D

  And the true winner under plurality (if they vote sincerely) is A (after tie-breaker). The rule-breaking teams (Teams 5 and 6) can manipulate by voting for B.

  Timeline with minute marks:

  0-5 min: Introduction and distribute preferences.
  5-20 min: Round 1 (Plurality) - with poll.
     - 5-7: Explain plurality, show poll.
     - 7-10: Students vote.
     - 10-12: Tally and announce winner.
     - 12-20: Award points and discuss briefly.
  20-35 min: Round 2 (Runoff) 
     - 20-22: Explain runoff.
     - 22-24: First round vote.
     - 24-26: Tally and announce top two.
     - 26-28: Second round vote.
     - 28-30: Tally and announce winner.
     - 30-35: Award points and discuss.
  35-50 min: Round 3 (Borda)
     - 35-37: Explain Borda count.
     - 37-42: Open discussion and strategy.
     - 42-45: Collect ballots.
     - 45-48: Tally and announce winner.
     - 48-50: Award points.
  50-70 min: Design Contest
     - 50-52: Explain the contest rules.
     - 52-57: Teams design their voting rule (5 minutes).
     - 57-70: Test each rule (about 2 minutes per rule, 6 rules -> 12 minutes, but we have 13 minutes). 
          For each rule:
            - Present rule (30 seconds).
            - The other teams (acting as voters) are given the test preferences (hand out the same preferences as above) and have 1 minute to decide their ballot (they can lie).
            - Collect ballots and apply the rule.
            - Determine the winner.
            - Compare to the sincere winner (which is computed by the instructor using the test preferences and the rule).
            - If any team gets a better outcome by lying, the rule is broken.
            - Award points to the teams accordingly.
  70-80 min: Debrief and theorem statement.

  Debrief Points:
  - In each round, we saw that by voting insincerely, individuals or groups could sometimes get a better outcome.
  - In the design contest, every rule that was proposed was either broken or was dictatorial or had to restrict the domain.
  - Gibbard-Satterthwaite theorem: It is impossible to have a voting rule that is:
     - Deterministic
     - Defined for every possible set of preferences (unrestricted domain)
     - Has at least three outcomes that are achievable
     - Non-dictatorial
     - And is strategy-proof (no one ever has an incentive to vote insincerely).
  - The key moment in the plurality round: the poll provided information that made Group2 realize they could benefit by voting for C. This shows that the possibility of manipulation depends on the information available. The theorem says that in some situations (even if we don't know which) there will be an incentive to manipulate.
  - The design contest showed that when we try to make a rule strategy-proof, we either end up with a dictatorship or we have to restrict the kinds of preferences allowed (like requiring single-peaked preferences) or we allow only two options.

  Additional Considerations:
  - If a team proposes a rule that is strategy-proof (like a dictatorship), we point out that it's dictatorial.
  - If they propose a rule that only works for single-peaked preferences, we note that it restricts the domain.
  - If they propose a random rule, we say we are only considering deterministic rules.

  Handling Problems:
  - Collusion: We can note that the theorem is about individual manipulation, but group manipulation is also a concern.
  - Econ major: If they blurt out, acknowledge and move on.
  - Sincere voting: It's a valid choice, but they might get fewer points.
  - Ties: Have a tie-breaker (e.g., alphabetical).
  - Someone who knows the material: They can help their team design a rule, but then we might get a rule that is dictatorial, which we can discuss.

  What the game cannot deliver:
  - We only showed that some rules are manipulable, not all. We have to state the theorem.
  - We didn't show that manipulation is always possible in every rule, only in the ones we tried and in the design contest. We have to explain that the theorem is a general impossibility.

  This should be a engaging and enlightening session.
answer: |-
  Below is a complete, runnable session plan designed to make students experience the Gibbard-Satterthwaite theorem firsthand. The session uses a "decision about final class activities" framing to ground the voting in a relatable context, with points incentivizing strategic thinking. The plan includes handouts, timing, scoring, and mitigations for common pitfalls.

  ---

  ### **Session Overview**
  - **Goal**: Students discover that all reasonable voting rules are manipulable, leading to the Gibbard-Satterthwaite theorem.
  - **Structure**: 
    - **Intro (5 min)**: Setup and preferences.
    - **Rounds 1–3 (40 min)**: Voting experiments with increasing strategy.
    - **Design Contest (20 min)**: Teams create/unbreak voting rules.
    - **Debrief (15 min)**: Theorem reveal and assumptions.
  - **Key Mechanics**: 
    - Fixed preferences for all rounds (assigned secretly).
    - Points based on true preferences (not revealed to others).
    - Axis-hidden options: Proofs workshop (P), Guest speaker (G), Student-led debate (D), Archive trip (A).  
      *(Implicit formality axis: P > G > D > A, but students aren’t told this.)*
  - **Materials**: 
    - Preference cards (handed out in intro).
    - Ballots (plurality, ranked, custom).
    - Poll results (for Round 1).
    - Scoring board (visible points tally).

  ---

  ### **Handouts & Setup**
  1. **Preference Cards** (Distribute during intro; **do not** reveal the axis):
     - Assign strict rankings to ensure single-peakedness (for realism) and manipulability. Use this profile for all rounds:
       - **Group 1 (6 students)**: P > G > D > A  
       - **Group 2 (4 students)**: G > D > P > A  
       - **Group 3 (5 students)**: D > G > A > P  
       - **Group 4 (3 students)**: A > D > G > P  
     *Rationale: Ensures no dominant option, avoids ties, and allows manipulation in all rounds.*

  2. **Ballots**:
     - **Round 1 (Plurality)**: Mark one option.
     - **Round 2 (Runoff)**: Mark one in each round (two ballots).
     - **Round 3 (Borda)**: Rank options 1st (4 pts) to 4th (1 pt).
     - **Design Contest**: Blank paper for rule proposals.

  3. **Poll for Round 1**:
     - **Sincere poll** (if all voted truthfully): P:6, G:4, D:5, A:3 → **P leads**.
     - **Noisy version to display**: P:7, G:3, D:6, A:2.  
       *Rationale: ±1–2 noise preserves uncertainty (P/D competitive) but doesn’t overwhelm. Avoids optimal computation (no clear runner-up) while nudging Group 3 toward strategy.*

  4. **Scoring**:
     - Points based on **true preferences**:
       - Winner = 4 pts, 2nd = 3 pts, 3rd = 2 pts, 4th = 1 pt.
     - **Points → quiz exemption**: 12+ pts = full exemption, 9–11 = half, <9 = none.  
       *(Low-stakes incentive; adjust thresholds if needed.)*
     - **Design contest payouts**:  
       - Rule-design team: 20 pts if unbroken, 0 if broken.  
       - Rule-breaking teams: 10 pts per successful manipulation.  
       *(Balances incentives: designers aim for robustness, breakers for creativity.)*

  ---

  ### **Timeline (80 Min Total)**
  #### **0–5 min: Intro**  
  - **Activity**: Explain the choice (final two sessions) and four options. Hand out **preference cards**. Emphasize:  
    - "Your goal is to maximize points based on your *true* preferences."  
    - "Preferences stay the same all session. Don’t share them!"  
  - **Key script**: "We’ll vote with different rules. Points add up to a quiz exemption."

  #### **5–20 min: Round 1 (Plurality)**  
  - **Rule**: Vote for one option. Most votes wins.  
  - **Poll**: Display noisy poll (P:7, G:3, D:6, A:2). Say: "This is a pre-vote poll—it’s imperfect but close."  
  - **Voting**: Secret ballots (1 min). Tally publicly.  
    - *Expected outcome*: Group 3 (D>G>A>P) may strategically vote G to stop P (e.g., if they believe D can’t win). Sincere: P wins (6 votes). Strategic: G wins (e.g., if all Group 3 votes G → G:9, P:6).  
  - **Scoring**: Award points based on winner.  
  - **Debrief hook**: "Did anyone vote differently to get a better outcome?"

  #### **20–35 min: Round 2 (Runoff)**  
  - **Rule**: Top two from Round 1 face off; majority wins.  
  - **Voting**: No poll. First round (same as plurality), then runoff between top two (2 min total).  
    - *Expected outcome*: Sincere: P vs. G → G wins (Group 2+3+4 prefer G > P). But Group 4 (A>D>G>P) may strategically vote D in Round 1 to force D vs. P runoff (D wins if Group 3+4 unite).  
  - **Scoring**: Award points. Highlight winner change from Round 1.

  #### **35–50 min: Round 3 (Borda)**  
  - **Rule**: Rank options (1st=4 pts, 2nd=3 pts, etc.). Highest sum wins.  
  - **Twist**: Open strategy discussion (2 min) before voting. Allow collusion/lying.  
    - *Expected outcome*:  
      - Sincere: P:6×4 + 4×2 + 5×1 + 3×1 = 58, G:6×3 + 4×4 + 5×3 + 3×2 = 71, D:6×2 + 4×3 + 5×4 + 3×3 = 65, A:6×1 + 4×1 + 5×2 + 3×4 = 38 → **G wins**.  
      - Strategic: Group 1 (P>G>D>A) may rank D last to hurt D, but Group 2 (G>D>P>A) can boost D to win by ranking D>G>P>A.  
  - **Scoring**: Award points. Compare to sincere winner.

  #### **50–70 min: Design Contest**  
  - **Teams**: 6 teams of 3.  
  - **Task**:  
    1. **Design phase (5 min)**: Teams invent a voting rule (must output one winner; no ties; any ballot format).  
    2. **Test phase (12 min, 2 min per rule)**:  
       - Designer team explains rule.  
       - Others receive a **fixed preference profile** (e.g., 2 voters: A>B>C>D, 2: B>C>D>A, 2: C>D>A>B).  
       - Breakers submit ballots (may lie); designers apply rule.  
       - Compare to sincere outcome. If any breaker improves their outcome, rule is "broken."  
  - **Scoring**: As above (designers: 20 pts if unbroken; breakers: 10 pts per successful manipulation).  
  - **Predictable issues & fixes**:  
    - *"Everyone proposes ranked choice"*: Require rules to be "novel" (no repeats).  
    - *"Team proposes dictatorship"*: Accept it, then debrief as non-democratic.  
    - *"Team proposes SP rule"*: If truly strategy-proof (e.g., random ballot), note it violates determinism. If domain-restricted (e.g., "only single-peaked"), praise but note unrestricted domain is key.  
    - *"Spoiler knows Gibbard-Satterthwaite"*: Assign them to design—they’ll likely propose a dictatorship/domain restriction, which you’ll debrief.  

  #### **70–80 min: Debrief**  
  - **Reveal the theorem**: "What you experienced has a name: the Gibbard-Satterthwaite theorem. It states that any voting rule with ≥3 outcomes is either dictatorial, restricted to specific preferences, or manipulable."  
  - **Map assumptions to moments**:  
    | **Assumption**          | **Where seen**                                  |  
    |--------------------------|------------------------------------------------|  
    | **≥3 outcomes**          | All rounds (4 options; multiple winners).      |  
    | **Deterministic**        | Design contest (random rules rejected).        |  
    | **No dictator**          | Design contest (dictatorship ruled unfair).    |  
    | **Unrestricted domain**  | Preferences varied widely; design contest test used arbitrary prefs. |  
  - **Separate from Arrow**:  
    - "Arrow is about *preference aggregation* (e.g., IIA); this is about *strategic voting*. Both are impossibility theorems, but they address different problems."  
  - **Handle abstention/participation**:  
    - If raised: "Abstention is a separate strategic tool (e.g., ‘no-show paradox’). Today, we assumed full participation to focus on ballot manipulation."  
    - *Do not include abstention*: It dilutes the core point. If a student abstains in Round 3, note it post-hoc as a "meta-manipulation" but don’t design for it.  
  - **What the game can’t show**:  
    - It **doesn’t prove all rules are manipulable**—only that common ones are. State: "The theorem guarantees *some* profile exists where manipulation pays, even if we didn’t see it."  
    - It **emphasizes possibility over frequency**: Debrief: "Real-world strategy depends on information—like our poll—but the theorem says we can’t design it away."  

  ---

  ### **Predicted Problems & Mitigations**
  1. **Collusion**:  
     - *Risk*: Teams coordinate in Rounds 2–3 or design contest.  
     - *Fix*: Allow it! It mirrors real coalitions. Debrief: "The theorem is about individual incentives, but group strategy is even harder to prevent."  

  2. **Econ major blurts the answer**:  
     - *Risk*: "This is Gibbard-Satterthwaite!" in Round 1.  
     - *Fix*: "Great! But let’s see *how* it plays out—I bet you’ll still gain points by strategizing."  

  3. **Sincere voting**:  
     - *Risk*: Students refuse to strategize on principle.  
     - *Fix*: Award points regardless. In debrief, contrast their outcome with strategic outcomes to show opportunity cost.  

  4. **Ties**:  
     - *Risk*: Ties in any round.  
     - *Fix*: Predefine tiebreakers (e.g., alphabetical order). State upfront.  

  5. **Design contest stalemate**:  
     - *Risk*: Teams can’t break a rule or propose trivial ones.  
     - *Fix*: Seed an example (e.g., "Random ballot!" → "But we’re focusing on deterministic rules").  

  6. **Small-group info asymmetry**:  
     - *Risk*: In teams of 3, breakers lack info to manipulate.  
     - *Fix*: Use the **fixed test profile** in design contest—gives all breakers common ground.  

  ---

  ### **Why This Works**
  - **Gibbard-Satterthwaite in bones**: Rounds 1–3 force self-discovery of manipulation; design contest exposes the impossibility.  
  - **Theatre over theory**: Noise in the poll, open strategy in Round 3, and "breaking" peers’ rules create visceral lessons.  
  - **Safe failure**: Points are low-stakes but motivating; debrief contextualizes confusion.  

  **Final tip**: Stay flexible. If Round 1 has no strategy, amplify the poll’s noise next time. If design contest lags, shorten test phase. The goal is frustration followed by "aha!"—not perfection.
