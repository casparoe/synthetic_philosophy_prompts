  We are designing a one-off session on voting theory for undergraduates, focusing on the Gibbard-Satterthwaite theorem. The goal is to have students experience strategic voting and the impossibility of a strategy-proof voting rule without directly stating the theorem until the end.

  Session Structure:
  - 80 minutes total.
  - Four options for the last two sessions, arranged along a formality/technicality axis (without revealing the axis initially):
    1. Proofs workshop (most formal/technical)
    2. Guest speaker (moderately formal)
    3. Student-led debate (moderately discursive)
    4. Trip to a local archive (most discursive)

  The session will be divided into several rounds, followed by a rule-design contest and a debrief.

  Materials:
  - Handouts: Ballots for each round, preference sheets (for private preferences), and scoring sheets (for points).
  - No laptops.

  Payoff Scheme:
  - Points are awarded in each round based on the outcome and the student's true preferences.
  - Points count toward a quiz exemption (so they care, but it's low-stakes).
  - True preferences are fixed for all rounds (except when they break a rule in the design phase) and are assigned by the instructor to ensure the necessary conditions for the theorem.

  Timeline:

  Part 1: Introduction (5 minutes)
  - Explain the context: We are deciding what to do in the last two sessions of the term. There are four options (list them without the axis).
  - Explain the process: We'll vote in several rounds. In each round, we'll use a different voting rule. Their goal is to maximize their points, which are based on how close the outcome is to their true preferences.
  - Distribute preference sheets: Each student gets a sheet with their true preference ordering (a strict ranking of the four options). These are fixed for the entire session. The preferences are designed so that they lie on a single axis (the formality/technicality axis) and are such that the Gibbard-Satterthwaite conditions are met.

  Part 2: Round 1 - Plurality Voting (15 minutes)
  - Rule: Each voter votes for one option. The option with the most votes wins.
  - Before voting, release a slightly noisy poll: The poll shows the current intended votes (based on sincere voting) but with some noise. For example, if the sincere preferences would give:
      Option A: 6 votes
      Option B: 5 votes
      Option C: 4 votes
      Option D: 3 votes
    Then the poll might show A: 7, B: 4, C: 5, D: 2 (so the ordering is preserved but the numbers are perturbed by ±1 or ±2). The noise should be enough to make the outcome uncertain but not so much that it's random. The goal is to encourage strategic voting without making it too obvious.
  - Students vote (by secret ballot) after seeing the poll. They may vote strategically.
  - Tally the votes and announce the winner.
  - Award points: Each student gets points based on how much they like the winner. For example, if their true ranking is 1st (best) to 4th (worst), then they get 4 points if the winner is their 1st choice, 3 for 2nd, 2 for 3rd, 1 for 4th.

  Part 3: Round 2 - Runoff Voting (15 minutes)
  - Rule: Two-round runoff. In the first round, each voter votes for one option. The top two options (by votes) go to a second round. In the second round, each voter votes for one of the two, and the majority wins.
  - Use the same true preferences as Round 1.
  - Do not release a poll this time (to avoid making it too similar and to see if they remember the previous poll or if they strategize without one).
  - Students vote in the first round (secret ballot). Tally the top two. Then hold the second round (another ballot) between the top two.
  - Announce the winner and award points as before.

  In this round, we expect that the winner might change (due to the different rule) and that some students might notice that if they had voted differently, they could have gotten a better outcome. For example, in the first round, a voter might have voted for their second choice to prevent their least favorite from making it to the runoff.

  Part 4: Round 3 - Open Season (15 minutes)
  - Announce the voting rule for this round: Borda count. Each voter ranks the four options. Assign 4 points to the top choice, 3 to the second, 2 to the third, and 1 to the last. The option with the highest total points wins.
  - Let them think and discuss (openly) for a few minutes. They can form coalitions, lie about their preferences, etc. (But note: they are still trying to maximize their own points based on their true preferences.)
  - Collect the ballots (ranked ballots) and tally.
  - Award points as before.

  In this round, we expect strategic voting to be more pronounced. We can then compare the outcome to what would have happened if everyone voted sincerely (using the true preferences we assigned).

  Part 5: Rule Design Contest (20 minutes)
  - Split into teams of three (so about 6 teams for 18 students).
  - Task for each team: Design a voting rule (for four options) that is strategy-proof. That is, no voter can ever get a better outcome by misrepresenting their preferences.
  - Rules of the contest:
     - Each team writes down their rule clearly.
     - Then, each rule is tested by the other teams. For each rule, the other teams (acting as voters) will try to break it by submitting ballots that are not their true preferences to get a better outcome (according to their true preferences). The rule-breaking teams get points if they successfully manipulate (i.e., if by lying they get an outcome they prefer over the outcome that would have resulted from truthful voting). The rule-designing team gets points if no team can break the rule in the time allowed (say, 2 minutes per rule).
     - Scoring for the contest:
          - If a rule is broken, the rule-breaking teams that succeeded get 10 points each (for their team) and the designing team gets 0.
          - If a rule is unbroken (no team breaks it in the time allowed), the designing team gets 20 points and the rule-breaking teams get 0.
     - Constraints on the rule: 
          - The rule must be deterministic.
          - It must produce a single winner (no ties allowed, or the rule must specify a tie-breaker).
          - It must be defined for any set of ballots (any possible ranking of the four options by each voter).
     - We allow the possibility of a rule that restricts the domain (like single-peaked preferences) but note: the Gibbard-Satterthwaite theorem requires unrestricted domain. So if a team proposes a rule that only works for single-peaked preferences, we can note that in the debrief as a way to escape the theorem.

  - How to run:
     - Give teams 5 minutes to design their rule (on paper).
     - Then, for each rule in turn (allow 2 minutes per rule):
          - The designing team presents the rule.
          - The other teams (now acting as voters) are given a set of true preferences (assigned by the instructor for this test) and then have 1 minute to decide on a ballot (they can lie). The rule is applied to the ballots they submit.
          - Compare the outcome to the outcome that would have occurred if everyone voted truthfully. If at least one voter (team) gets a better outcome (according to their true preferences) by lying, then the rule is broken.

  - Note: We must have a set of true preferences for the test that is fixed and known to the instructor. We can use the same set of true preferences for every rule test to save time. This set should be chosen to be vulnerable to manipulation under most rules.

  - What if a team proposes a strategy-proof rule? Possibilities:
     - Dictatorship: One voter decides. We can point out that this is not democratic.
     - Random ballot: We can say that we are only considering deterministic rules (or if they propose it, we can note that it's random and we are focusing on deterministic rules).
     - Unanimity: If everyone agrees, then that option wins, but what if there is disagreement? They must specify a rule for all cases.
     - Rules that only work for restricted domains: We accept them, but then in the debrief we note that the theorem assumes unrestricted domain.

  Part 6: Debrief (10 minutes)
  - Reveal the Gibbard-Satterthwaite theorem: For any voting rule with at least three possible outcomes, if the rule is deterministic, non-dictatorial, and defined for every possible profile of preferences (unrestricted domain), then it is manipulable (there exists some profile at which at least one voter can benefit by misrepresenting their preferences).
  - Map the activities to the theorem:
     - Round 1 and 2: Showed that different rules are manipulable and that the winner can change with the rule.
     - Round 3: Showed that even when they try to strategize, the outcome can be worse for some (or different from the sincere outcome).
     - Design contest: They tried to create a rule that is strategy-proof, but every rule they proposed either was broken or had to restrict preferences (or be dictatorial). 
  - Emphasize the key assumptions:
     - Deterministic: We did not consider random rules.
     - At least three outcomes: We had four.
     - Unrestricted domain: In the design contest, we allowed any preferences? Actually, in the contest we used a fixed set, but the rule must work for any set. So if a rule only works for single-peaked preferences, then it fails under unrestricted domain.
     - Non-dictatorial: We want every vote to count.

  - Distinguish from Arrow's theorem: 
     - Arrow is about aggregating preferences into a social ordering (with transitivity) and uses a different set of conditions (independence of irrelevant alternatives, etc.). Gibbard-Satterthwaite is about strategy-proofness for a single winner.

  - Address the two extra things:
     1. Abstention: We did not include it. It can complicate the message. We want to focus on strategic voting by misrepresenting preferences, not by not voting. So leave it out. If it comes up, note that non-participation is a different form of strategic behavior and is covered by other results (like the Myerson–Satterthwaite theorem or the no-show paradox) but is beyond our scope.

     2. The issue of staying home: If someone raises it, clarify that the Gibbard-Satterthwaite theorem is about misrepresentation of preferences on the ballot, not about the decision to vote. The decision to vote or not is about participation and is a different strategic decision. We are assuming everyone votes. There are results about participation (like the paradox of voting) but that's a separate topic.

  What might go wrong:
  - Collusion: In Round 3 and the design contest, teams might collude to achieve a particular outcome. This is acceptable because it's part of the strategy. But note that the theorem is about individual manipulation, so if we see group manipulation, we can note that the theorem doesn't cover that (it's about individual incentives).
  - The econ major blurting out the answer: If someone says "this is the Gibbard-Satterthwaite theorem" early, just say: "That's a good observation, but let's see if we can discover the idea ourselves." Then continue.
  - Sincere voting: Some might vote sincerely on principle. That's okay because it will show that the sincere outcome is not always the same as the strategic one. Also, in the design contest, if a rule is proposed that is strategy-proof, then even sincere voting would be optimal.
  - Ties: Have a tie-breaker ready (e.g., alphabetical order by option name, or a random draw if necessary). But in the design contest, rules must include a tie-breaker.
  - Someone who already knows the material: They can be assigned to different teams to help design a rule. But if they try to break the design phase by proposing a dictatorship, we can note that in the debrief as one of the escapes.
  - Groups too small: With teams of three in the design contest, they might not have enough variation. We can assign the true preferences for the test scenario to have more diversity (even though each team has only three members, the test scenario can have multiple teams voting, so we can have 15 voters in the test).

  What the game cannot deliver:
  - It cannot show that every reasonable rule is manipulable, only that the ones we tried are. We have to state that the theorem says that every rule satisfying the conditions must be manipulable.
  - It doesn't show that manipulation is always easy or likely, only that it is possible in some situations. The theorem is about possibility, not frequency.

