answer: |-
  ## Kelly Sizing Procedure for the XYZ Foundation

  **Core Principle:** Size positions to maximize the expected compound growth rate of the endowment, adjusted for parameter uncertainty, illiquidity, correlation, and proximity to the wind-down threshold. Use fractional Kelly (typically 1/4 to 1/2 Kelly) as the base sizing mechanism for repeatable opportunities.

  **Procedure Gates (Analyst executes sequentially; Trustees audit output):**

  1.  **Repeatability Check:** Is this opportunity expected to recur at least 10 more times during the foundation's horizon? *If NO: Hard Stop. Route to Exploration Budget.*
  2.  **Reference Class Definition:** Define the specific future opportunities this deal represents (e.g., "VC funds in Climate Tech targeting $50-100M," "Momentum factor trades in EM equities"). *If unclear/unstable: Hard Stop. Route to Exploration Budget.*
  3.  **Edge Quantification:** Using the reference class, estimate the probability of success (`p`), the probability of failure (`q = 1-p`), the gross return if successful (`W`), and the gross return if unsuccessful (`L`). Express `W` and `L` as multiples (e.g., 2.0x, 0.7x). *Estimation required, failure here is Hard Stop.*
  4.  **Edge Plausibility Check:** Is the estimated `p` significantly higher than a reasonable base rate? Is the track record robust (longevity, independence, survivorship-adjusted)? *If NO or thin: Flag for Committee Judgment.*
  5.  **Standalone Kelly Fraction:** Calculate the standalone optimal fraction: `f* = (p/W - q/L) / (1/L)`. Simplify to `f* = p - (q / (W/L - 1))` if `L` is total loss (L=0). *Calculation required.*
  6.  **Parameter Uncertainty Discount:** Apply the *fixed fractional multiplier* (e.g., 0.25 or 0.5) set by the Committee to `f*` to get the *Base Sizing Fraction (BSF)*: `BSF = (Multiplier) * f*`. *Fixed policy parameter.*
  7.  **Correlation Assessment:** Estimate the correlation (High/Medium/Low) of this deal's outcome with the foundation's *existing portfolio*. *Estimation required.*
  8.  **Aggregation Check:** Deduct the BSF from the *Global Risk Budget (GRB - see Setup)*. *If GRB <= 0: Stop. Deal ranks below cutoff; size = 0.*
  9.  **Wind-Down Threshold Adjustment:** If foundation real assets are within 10% of the $90M inflation-adjusted floor, reduce the BSF by an additional 50%. *Fixed policy rule.*
  10. **Final Sizing:** Stake (`S`) = `BSF` (adjusted per Gate 9 if applicable) * `Current Portfolio Value`. *Calculation required.*
  11. **Rebalance Feasibility:** Can this position be reduced significantly within 12 months if needed? *If NO: Flag for Committee review of sizing due to illiquidity.*
  12. **Output:** Recommended Stake (`S`), Reference Class, Estimated `p`, `W`, `L`, `f*`, Applied Multiplier, Adjusted `BSF`, GRB Used, Wind-Down Adjustment Applied.

  **Committee Setup Required:**
  *   Set the **Fixed Fractional Multiplier** (e.g., 0.25, 0.5). *Reason: Parameter uncertainty, illiquidity, inability to rebalance, drawdown tolerance.*
  *   Set the **Global Risk Budget (GRB)**. *Initial Suggestion: 0.5 (Half-Kelly equivalent total portfolio risk). Replenishes slowly.*
  *   Define the **Exploration Budget**. *Suggestion: 0.25% - 0.5% of NAV annually.*

  ---

  **Worked Cases:**

  1.  **Case A: Liquid, Repeatable Factor Trade (e.g., EM Momentum)**
      *   Passes Gates 1-2 (Daily trades, 1000+ expected).
      *   Edge: `p=55%`, `W=1.15x`, `L=0.92x` (after costs). `f* = (0.55/1.15 - 0.45/0.92) / (1/0.92) ≈ 0.10`.
      *   Plausible (Gate 4 Pass - 15yr data).
      *   `BSF = 0.5 (Multiplier) * 0.10 = 0.05`.
      *   Correlation: Medium. Deduct 0.05 from GRB (Gate 8).
      *   Far from $90M floor. No Wind-Down adj (Gate 9).
      *   Stake = 0.05 * $140M = **$7.0M**. *Committee Dislike: May seem large for one trade, but justified by repeatability and edge.*

  2.  **Case B: One-Off Illiquid VC Fund (New Asset Class)**
      *   Fails Gate 1: No defined reference class with >=10 expected future draws. *Hard Stop.*
      *   **Result:** Not sized via Kelly. Allocate from **Exploration Budget** (e.g., **$0.7M**, 0.5% of NAV). *Committee Dislike: May want larger bet on "high potential" opportunity, but procedure blocks overbetting on uniqueness.*

  3.  **Case C: Large, Correlated PE Co-Invest (Near Floor ~$95M real)**
      *   Passes Gate 1-2 (PE Co-Invests, ~20 expected).
      *   Edge: `p=70%`, `W=2.0x`, `L=0.5x`. `f* = (0.7/2.0 - 0.3/0.5) / (1/0.5) = (0.35 - 0.6) / 2 = -0.25 / 2 = -0.125` → **`f* = 0`** (Negative Kelly = Avoid). *Hard Stop at Gate 5?* Wait - flawed inputs?
      *   *Reality Check:* Edge likely overestimated. Assume adjusted `p=65%`, `W=1.8x`, `L=0.7x`: `f* ≈ (0.65/1.8 - 0.35/0.7) / (1/0.7) ≈ (0.361 - 0.5) / 1.429 ≈ -0.139 / 1.429 ≈ -0.097` → **`f* ≈ 0`**.
      *   **Result:** Standalone Kelly is negative or near zero. *No allocation recommended.* Even if small positive `f*` found:
          *   High correlation to existing holdings (Gate 7). Requires larger GRB deduction.
          *   Near floor (Gate 9): Any `BSF` would be halved.
          *   Stake ≈ **$0**. *Committee Dislike: Passing on "good" deal, but procedure prevents catastrophic overbet near ruin point. You were right; the Trustee was wrong near the floor.*

  ---

  **Limitations & Caveats:**

  1.  **Objective Mismatch:** Kelly maximizes long-run *growth probability*, not necessarily *expected terminal value* or *short-term survival probability*. Our wind-down clause ($90M death) makes *survival* paramount near the floor, overriding pure growth maximization. Half-Kelly helps, but the objective itself may be flawed near critical thresholds. Survival becomes key.
  2.  **Regime Change:** The procedure relies on stable `p`, `W`, `L`. If the world changes (e.g., factor decay, market structure shift, GP departure), the edge vanishes. The Fractional Multiplier and Plausibility Gate (4) are our main defenses, but they are imperfect. Sizing is always an estimate.
  3.  **Backtesting Futility:** Backtests show past paths, not the distribution of *all possible* paths Kelly optimizes for. They cannot prove Kelly's dominance in probability over the long run; that's a mathematical property. They also suffer from overfitting, especially with thin data (Gate 4). Backtests inform edge estimation but cannot validate the core sizing logic.
  4.  **Spending Rule:** Kelly assumes reinvestment. Our spending rule (needed for operations) acts as a constant drain, slightly reducing the optimal risk fraction. This is partially absorbed by the conservative Fractional Multiplier and GRB.
  5.  **Human Judgment:** Gates 4 (Plausibility), 7 (Correlation), and 11 (Rebalance) inherently require expert judgment. The procedure structures and exposes this judgment; it doesn't eliminate it.

  **Conclusion:** This procedure provides a disciplined, auditable framework for sizing decisions, prioritizing repeatability, parameter safety, correlation, and survival near the wind-down threshold. It explicitly rejects sizing non-repeatable opportunities via Kelly, severely limits bets near the ruin point, and uses a fixed fractional multiplier to encode institutional risk tolerance. It converts the Kelly insight into an operational process, acknowledging its limitations for an endowment with a spending rule and an existential floor.
