answer: |-
  ### Brief Dependency Chain Outline
  1. **Personal vs. Collective/Project-Based Goods**: Distinguish self-regarding interests from participation in shared human endeavors.  
     *Why?* Without this, students default to individualistic assumptions.  
  2. **Future-Dependent Value**: Show how *present* activities derive meaning from an *expected future continuum*.  
     *Why?* Establishes temporal dependency without metaphysics.  
  3. **Collective Afterlife Conjecture**: Frame extinction as cutting off the future that sustains present meaning.  
     *Why?* Reverse order risks "afterlife" sounding supernatural.  

  ---

  ### Full Teaching Plan (90-Minute Session)  
  **Total Time Allocation**:  
  - Step 1 (5 min) | Step 2 (15 min) | Step 3 (25 min) | Misconception Defense (20 min) | Check for Understanding (15 min) | Wrap-up (10 min)  

  #### Step 1: Personal vs. Collective Goods (5 min)  
  - **Opening Prompt**: *"Why do you contribute to open-source projects knowing you’ll never monetize them?"*  
  - **Key Distinction**:  
    > *"Personal goods benefit you directly (e.g., eating). Project-based goods matter because you’re part of something larger (e.g., Wikipedia)."*  
  - **Why First?** Breaks STEM tendency to reduce value to individual utility.  

  #### Step 2: Future-Dependent Value (15 min)  
  - **Mechanism**: Use *scientific research* as an example:  
    > *"A cancer researcher’s work isn’t valuable just because she enjoys pipetting. Its worth hinges on the expectation that others will build on her data."*  
  - **Critical Question**: *"Would debugging code for a project deleted tomorrow feel the same as debugging for a project used for decades?"*  
  - **Why Before Afterlife?** Grounds meaning in empirical expectations, not sentiment.  

  #### Step 3: Introducing "Collective Afterlife" via Modified Archivist (25 min)  
  - **The Cryptographer Scenario**:  
    > *"A cryptographer maintains an open-source privacy protocol. She knows:  
    > (a) The protocol will be orphaned if the developer ecosystem collapses in 5 years.  
    > (b) No users will be harmed if it’s abandoned (data migrates seamlessly).  
    > (c) She’ll retire before either outcome.  
    > Why does she feel the project’s continuity matters?"*  
  - **Why This Works for Rationalists**:  
    - **Includes**: No direct harm, project-valued intrinsically (cryptography’s social purpose), no personal survival stake.  
    - **Excludes**: Sentimentality (focus on systemic dependencies), altruism (users are fine either way).  
    - **Fixes Standard Archivist**: Archivists "preserving culture" feels abstract; open-source maintenance is visceral for engineers.  

  #### Step 4: Defusing Misconceptions (20 min)  
  Address **during** the cryptographer discussion unless noted:  

  | Misconception | Defusing Sentence | Timing |  
  |---------------|-------------------|--------|  
  | "This is religious immortality" | > *"The ‘afterlife’ is purely metaphorical: it’s about the *continuation of what we value*, not *our personal consciousness*."* | **Before** introducing the term "afterlife" |  
  | "Just utilitarianism" | > *"This isn’t about *maximizing happy lives* but about *sustaining the context that makes current actions meaningful*."* | **During** Step 2 (future-dependence) |  
  | "Appeal to sadness" | > *"The issue isn’t that we’d *feel sad* about extinction, but that our *current reasons for acting* would lose their foundation."* | **During** cryptographer debrief |  
  | "Group consciousness mysticism" | > *"Dependence on collective futures is like depending on Wikipedia’s existence—no group mind needed, just shared projects."* | **After** cryptographer example |  

  #### Step 5: Check for Understanding (15 min)  
  - **Scenario**: *"Asteroid impact in 300 years causes instantaneous, painless extinction. No lives cut short; no suffering. Why might someone argue this is still bad?"*  
  - **Target Response**:  
    > *"Present projects (e.g., curing disease, building institutions) lose justification if no future exists to inherit them. This isn’t about deprived lives (utilitarianism) but about *current actions losing point*."*  
  - **Intervention**: If they cite "lost potential," push: *"Why does losing potential *now* undermine *today’s* work?"*  

  #### Step 6: What to Refuse (10 min)  
  Explicitly bracket:  
  1. **Parfit’s Non-Identity Problem**: *"We’re setting aside *which specific future people exist* to focus on *whether any exist*."*  
  2. **Formal Intergenerational Discounting**: *"Welfare economics asks *how much* to sacrifice for the future. We’re asking *why the future matters at all* for present meaning."*  
  - **Why?** These introduce technical complexity irrelevant to the core conceptual shift.  

  ---

  ### Why This Sequence Works  
  - **Metaphor Last**: "Afterlife" enters only after mechanistic dependencies are clear.  
  - **STEM Alignment**: Cryptographer example mirrors open-source ethics; avoids "culture" abstractions.  
  - **Preemptive Strikes**: Misconceptions addressed *before* they solidify (e.g., blocking "immortality" before the term appears).  
  - **Bracketing Technicalities**: Keeps focus on the existential stakes, not utilitarian calculus.  

  **Final Tip**: End by contrasting with altruism:  
  > *"Altruism helps *others*. Meaning-dependence means *we need others* to make sense of our own efforts."*
