  The user clearly has sophisticated philosophical training - note how they pre-specified the key dimensions of divergence (reason-responsive motivation, affective alignment etc.) and constructed cases that stress-test these dimensions. Their frustration with the Case 2 vs 5 inconsistency suggests they're seeking a principle that can handle mixed motives more elegantly than standard Kantian or Humean frameworks.

  Looking at the cases: Case 1 is pure Kantian duty, Case 2 shows Humean sympathy corrupted by vanity, Case 3 is Arpaly's nonconscious virtue, Case 4 is pure consequentialism without agency. The real puzzles are Case 5 (indistinguishable mixed motives getting full credit) and Case 6 (distinct-but-fused motives getting partial credit). 

  I suspect the unstated need here is reconciling two truths: 1) moral worth requires some connection to moral understanding (hence rejecting Case 3/4), and 2) human motivation is rarely pure (hence discomfort with downgrading Case 5/6). The user might be wrestling with whether "purity" matters or whether moral psychology should be more pluralistic.

  For my proposed principle, I'll need to make "motivational transparency" do heavy lifting - Cases 5 and 6 both involve fused motives, but only Case 5's fusion results from moral internalization rather than contingent combination. That explains why we discount the soldier's fear in Case 6 but not the politician's ambition in Case 5. 

  The habit case they request will test whether the principle can handle non-reflective virtue. If the habit was formed through past endorsement (like Aristotle's hexis), it should have worth; if mere conditioning (like Milgram's obedience), not. This preserves the insight that moral worth tracks historical relationship to reasons, not just present psychology.
answer: |-
  Below is a principled framework designed to capture your intuitive verdicts while resolving tensions. The core insight is that **moral worth depends on whether an action expresses the agent's *settled moral commitment*—where "commitment" requires motivationally effective recognition of moral reasons, integrated into the agent's practical identity through reflective endorsement (actual or dispositional).**

  ### Proposed Principle:  
  **An agent has moral worth iff:**  
  **(1) The action is morally right/good,**  
  **(2) The agent is motivationally responsive to the moral reasons for acting,**  
  **(3) This responsiveness expresses a reflectively stable commitment (i.e., it would survive idealized scrutiny as a basis for action),**  
  **(4) Non-moral motives (if present) are *subordinated* to or *constitutively transformed* by the moral commitment.**  

  **"Reflectively stable commitment"** means: The agent would endorse the moral reason as sufficient for acting even under full transparency about motives/circumstances, and this endorsement is robust across relevant counterfactuals.  

  **"Constitutively transformed"** means: Self-interested or affective elements are *reconstituted* by moral understanding (e.g., ambition becomes ambition *for justice*), making them inseparable from the moral perspective.  

  ---

  ### Application to Your Cases:  
  | Case | Principle's Verdict | Clause Applied | Tension Resolved |  
  |------|---------------------|----------------|------------------|  
  | **1** | **Full worth** | (1)-(3): Action from duty expresses reflectively stable commitment to moral reasons. | — |  
  | **2** | **Partial worth** | (1)-(2) satisfied, but (3)-(4) fail: Compassion is motivationally responsive but unstable (fails if unobserved). Social esteem competes with moral reasons; not transformed/subordinated. | Explains why < Case 1: Moral reasons aren't reflectively stable. |  
  | **3** | **No worth** | (1) satisfied, but (2)-(3) fail: Reflex shows no responsiveness to moral *reasons*; no commitment present. | Consistent with your verdict. |  
  | **4** | **No worth** | (1) satisfied, (2)-(4) fail: AI lacks responsiveness to *reasons* (only algorithmic processing); no capacity for commitment. | Consistent. |  
  | **5** | **Full worth** | (1)-(4) satisfied: Moral internalization transforms self-interest into a constitutively moral motive ("justice-ambition"). Reflectively stable (she endorses reform *as just*). | **Resolves vs. Case 2:** In Case 5, motives are unified *by moral commitment*; in Case 2, they compete. |  
  | **6** | **Full worth (but lesser "purity")** | (1)-(3) satisfied: Moral reasons are motivationally effective and reflectively stable. Fear/empathy are *subordinated* to duty (he acts *because it's wrong*). However, non-moral motives dilute *purity* without negating worth. | Addresses your intuition: Worth is preserved via (3), but lesser "purity" reflects weaker satisfaction of (4) (fear is not transformed, only contingently aligned). |  

  ---

  ### Addressing Tensions Explicitly:  
  - **Case 2 vs. Case 5:**  
    Case 2 fails (3)-(4): The donor’s moral motivation is *fragile* (depends on social rewards) and self-interest is not transformed. Case 5 satisfies (3)-(4): The politician’s motive is unified by moral internalization; her self-interest is *redefined* by justice.  
    → **Revision:** Your Case 2 verdict ("partial worth") is correct; Case 5 ("full worth") is justified by constitutive transformation.  

  - **Case 1 vs. Case 6:**  
    Both satisfy (1)-(3), but Case 6 has weaker (4): Fear in Case 6 is merely *aligned* with duty, not *transformed* by it. This explains why you sense "less purity" but still affirm worth.  
    → **No revision needed:** The principle distinguishes *degree of motivational purity* (captured in (4)) from *presence of worth* (captured in (1)-(3)).  

  - **Case 3 vs. Case 4:**  
    Both lack (2)-(3): Neither responds to moral *as reasons* nor expresses commitment. Human reflex ≠ agential commitment.  
    → Consistent with your verdicts.  

  ---

  ### Prediction for Unlisted Case:  
  **Case 7: An agent acts from long-formed moral habit with no present reasoning/affect.**  
  - **Principle’s Prediction:**  
    - **Full moral worth** if the habit reflects past reflective endorsement (e.g., a virtuous disposition cultivated through reason). Satisfies (2)-(3): Responsiveness stems from a reflectively stable commitment, even if dormant.  
    - **No moral worth** if the habit is mere conditioning (e.g., blindly following norms without ever endorsing them). Fails (2)-(3): No connection to moral reasons as such.  

  ---

  ### Why This Works:  
  - **Accommodates all verdicts** without contradiction, using "reflective stability" and "motivational transformation" to distinguish Cases 2/5/6.  
  - **Preserves Kantian insight** (moral reasons must drive action) while **incorporating Humean/neo-Aristotelian elements** (affect/habit can express commitment if integrated with reason).  
  - **Clarifies "diminished purity" in Case 6:** Moral worth is binary (yes/no via (1)-(3)), but *quality* of worth varies with (4).  

  **If you insist on revising one verdict:** Case 6 *must* have full worth per your intuition ("resist saying partial"). The principle explains its "lesser purity" without downgrading worth—resolving the tension. Case 2’s partial worth stands.  

  This framework captures the interplay of **reason-responsiveness** (Cases 1, 2, 5, 6), **reflective stability** (Cases 1, 5, 6), and **motivational unity** (Cases 5 vs. 2/6) that underlies your judgments.
