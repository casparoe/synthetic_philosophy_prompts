answer: |-
  ### Strategy-Stealing Argument Session Plan

  #### 1. **Dependency Ordering**  
  The argument must unfold in this sequence to avoid trivializing the conclusion and to address misconceptions:
  - **Step 1: Establish determinacy and no draws** (5 minutes)  
    - *Why first?* Students must recall that finite, perfect-information games with no draws are determined (one player has a winning strategy). This is assumed from prior sessions; restate it without proof.  
    - *Risk of omission:* If skipped, the jump from "second player has no winning strategy" to "first player has one" seems non-rigorous.  

  - **Step 2: Introduce symmetry** (5 minutes)  
    - *Why next?* Symmetry (swapping players leaves the game unchanged) enables "stealing." Use Hex as an example: swapping players/swapped goals preserves the game.  
    - *Risk of reordering:* If symmetry comes after the stealing step, students may confuse it with board symmetry alone.  

  - **Step 3: Define "extra move is never a disadvantage"** (10 minutes)  
    - *Why critical?* This non-trivial condition (e.g., in Hex, an extra stone never hurts your position) permits ignoring occupied moves during stealing.  
    - *Risk of delay:* If presented after the stealing maneuver, students may dismiss it as obvious or conflate it with "no move is bad."  

  - **Step 4: Reductio ad absurdum + stealing step** (15 minutes)  
    - *Order:*  
      1. Assume (falsely) the second player has a winning strategy.  
      2. First player makes an arbitrary move, then "steals" the second player’s strategy:  
         - Treat their first move as "invisible," and respond to the opponent using the stolen strategy.  
      3. If the stolen strategy selects an occupied move, the first player makes an arbitrary move (justified by the "no disadvantage" condition).  
    - *Risk of misordering:* If stealing is described before defining a complete strategy (as a function from histories), students may think the first player "passes" a turn.  

  **What to re-derive vs. assume**:  
  - Assume: Strategy definition (histories → moves), determinacy statement, and no draws in examples.  
  - Re-derive: "Extra move never a disadvantage" and symmetry (via examples), as these are subtle and core to the surprise.

  ---

  #### 2. **The Carrying Example: Hex on 4×4 Board**  
  - **Why Hex?**  
    - *Fits requirements*: No draws (a path must exist for one player), symmetric (swapping players/goals preserves rules), and "extra stone never a disadvantage" (an extra stone only helps connectivity).  
    - *Obvious candidates fail*:  
      - Tic-tac-toe/Gomoku: Can end in draws.  
      - Chomp: "Extra move never a disadvantage" is intuitive (more squares eaten helps) but less visible than Hex’s path-connectivity.  
      - Small Hex (3×3): Solvable by brute force; 4×4 is tractable for play but unsolvable in 10 minutes.  

  - **Why 4×4 Hex?**  
    - Playable on paper in pairs in ≤10 minutes.  
    - Conditions are visible: After 2–3 moves, ask: "Could an extra stone here *hurt* you?" (Answer is clearly "no").  
    - Students will intuit the first-player win but cannot prove it exhaustively.  

  **How to run**:  
  - Hand out 4×4 Hex grids. Pairs play 5 minutes.  
  - Debrief: "Did anyone see a draw? Could your extra stone ever block you?" (Highlight conditions).

  ---

  #### 3. **Misconception Map**  
  Address these **in sequence** as they naturally arise:  
  | Misconception | When to Correct | How to Address |  
  |---------------|-----------------|----------------|  
  | "The argument identifies a good first move." | During stealing step | Emphasize: The first move is arbitrary; the proof is non-constructive. |  
  | "It proves White wins chess." | After symmetry step | Clarify: Chess has draws and asymmetric positions → conditions fail. |  
  | "Extra-move condition = no move is bad." | When defining the condition | Contrast: "No move is bad" (trivial) vs. "Extra stone never hurts" (strong; use Hex to show it’s non-trivial). |  
  | "Does the first player literally pass?" | During stealing step | Stress: The first move is made and *then* ignored; no passing occurs. |  
  | "Can the stolen strategy use the extra stone?" | During stealing step | Explain: The strategy is applied *as if* the extra stone isn’t there; if it selects an occupied cell, arbitrariness saves us. |  

  **Prioritization**:  
  - Upfront: "Extra move ≠ no move is bad" and "non-constructive" (CS majors care).  
  - Let surface later: "Does stealing imply passing?" (correct during the stealing step demo).

  ---

  #### 4. **Final Task: Poison Game (5 minutes)**  
  - **Game rules**:  
    - Three cells: Two "safe" cells (A, B), one "poison" cell (P).  
    - Players alternate claiming cells; claiming P loses.  
  - **Why this task?**  
    - Tests understanding of *conditions*, not memorization.  
    - Correct answer: Strategy-stealing fails because the "extra move never a disadvantage" condition is violated (if you occupy a safe cell, you may be forced to take P later).  
    - *Why not a game where it works?* That only checks recall, not comprehension.  
  - **How to run**:  
    - Pose: "Why can’t we apply the argument here?"  
    - Success: Student identifies the failed condition and explains how an extra stone can be harmful (e.g., "Occupying A forces you to take P if B is taken").  

  ---

  #### 5. **Deliberate Omissions**  
  State upfront:  
  - **Proof of determinacy**: "We’ve used it before; today we take it as given."  
  - **Complexity**: "The argument doesn’t give an algorithm—winning strategies may be hard to compute (CS majors: note this!)."  
  - **Brouwer’s theorem**: "Hex’s deeper math is beyond today’s scope."  
  - **Infinite games/draws**: "We assume finite, no-draw games."  
  - **Formal strategy construction**: "We’ll hand-wave the ‘arbitrary move’ case; a rigorous function is messy but exists."  

  **Why omit these?**  
  Keeps focus on the argument’s core: symmetry, conditions, and reductio. Proofs/complexity derail intuition.

  ---

  ### Session Flow (50 Minutes)  
  1. **Intro** (5 min): Frame the surprise—"We’ll prove first player *must* win without knowing how!"  
  2. **Conditions** (10 min): Re-derive determinacy (assumed), symmetry (Hex example), and "extra move never bad" (Hex demo).  
  3. **Hex gameplay** (10 min): Pairs play 4×4 Hex; debrief conditions.  
  4. **Argument** (15 min): Reductio + stealing step; correct misconceptions dynamically.  
  5. **Poison game task** (5 min): Identify why the argument fails.  
  6. **Wrap-up** (5 min): Omissions recap, significance (non-constructive existence).  

  This ensures the conclusion lands as a revelation—not a truism—by anchoring abstract concepts in Hex, preempting pitfalls, and validating understanding through counterexamples.
