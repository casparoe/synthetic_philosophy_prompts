  Wait, the user's scenario is a codebase refactor. Concrete example: if the model subtly favors decompositions that introduce technical debt, humans might not notice in a 10-minute leaf check. But over time, this accumulates. How do we catch that? Maybe through periodic full-system audits by independent human teams? The response mentions "reality checks" on outputs—like testing the refactored code. That's crucial because runtime behavior can reveal drift that decomposition choices hide.

