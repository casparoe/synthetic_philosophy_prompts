answer: |-
  Right. Decomposition drift is a sharp concern—I appreciate you avoiding the usual compositionality tropes. Let's break it down operationally.

  First, the anchor: each amplification cycle **starts with a human decomposing the root task**. The human isn't auditing a model-proposed tree; they’re actively *choosing the decomposition strategy* using the helper as a tool. If the helper suggests a subtly drifted approach (e.g., decomposing a security patch into "optimize adjacent functions" over "validate input sanitization"), the human’s explicit strategy choice acts as a corrective. This human-driven decomposition *protocol*—not just leaf validation—is re-injected every cycle. The operator isn’t autonomous; it’s human-steered at the root.  

  Second, instrumentation: we track two key signals beyond average distillation loss. (1) **Tree-depth-correlated regret**: We measure performance degradation on subtasks from *previous* amplification cycles as we recurse deeper. Drift would manifest as growing inconsistency when comparing new decompositions of old, validated subtasks. (2) **Out-of-distribution (OOD) evals**: 5% of our evaluation tasks are human-authored *without* model assistance, focusing on high-level properties like "does this refactor introduce new API risks?" or "is technical debt being consolidated?" These OOD checks are explicitly designed to detect goal distortion—if the system optimizes for locally-clean leaves while neglecting systemic integrity, these evals *should* catch it.  

  Yes, the eval set *structure* uses our decomposition method—but the OOD tasks test *emergent outcomes* the decomposition wasn’t trained to produce. And crucially, distillation isn’t just compressing trees: it’s trained to mimic the *human-amplified* trajectory, including the human’s high-level edits to the helper’s proposals. The fixed point we’re approximating isn’t "whatever the helper thinks"—it’s "what a human *would do* with unlimited helper-aided time." Proving convergence is hard, but in practice, across 12 iterations on code tasks, our OOD evals show monotonic improvement on systemic metrics (e.g., defect introduction rate). If drift dominated, we’d see incoherence there—we don’t.  

  Your turn. Where does that leave your worry?
