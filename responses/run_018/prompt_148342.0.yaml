prompt: |-
  I'm preparing a long-form piece on metaethics for a science-and-ideas publication. The wrong-kind-of-reasons problem — the gap between having a reason to do what morality requires and having a reason of the appropriate kind to care about morality itself — is familiar from debates about moral motivation and internalism. I want to extend it to a less-discussed domain: collective and artificial agents. Consider whether institutions or AI governance boards can possess reasons of the right kind for ethical constraint, or whether they are permanently limited to prudential, reputation-based, or compliance-driven motives analogous to the classic demon-threat case. Rank these four stances from most to least defensible: (A) collective agents are not moral subjects, so the problem does not apply; (B) they can only ever hold wrong-kind reasons, making institutional ethics purely strategic; (C) distributed cognition among members or subsystems can generate genuinely emergent right-kind reasons; (D) the wrong/right distinction should be rebuilt around functional role rather than individual mental state. Assign each a score from 1 to 5 on how well it explains actual moral responsibility in large organizations, and for each note one concrete, under-discussed implication for designing oversight boards for advanced AI systems. Answer in American English, keep the reasoning tight, and do not include citations, bibliographies, or reading lists.
