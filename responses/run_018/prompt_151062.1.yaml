answer: |-
  Based on your constraints (interdisciplinary philosophy/cogsci focus, no lab, 3-year timeline, deliverable = defended research agenda), the priority order should be:

  **1. Fragmented Collective Intentionality (FCI)**
  **2. Normative Structure of Unauthorized Obligations in Joint Commitment**
  *(Deprioritize: Direct ontology debates (plural subjects vs. reducible we-intentions) and shared attention debates)*

  Here’s the reasoning, using **dependency, tractability, neglect, practical leverage**, and **upgrade/downgrade conditions**:

  ---

  ### 1. **Fragmented Collective Intentionality (FCI) as Top Priority**  
     **Why central, not a special case?**  
     - FCI isn’t merely "disagreement about shared goals" but a *structural feature* of distributed agency where coordination *succeeds despite* incompatible representations (e.g., one subgroup sees "success" as efficiency, another as relational repair).  
     - It directly addresses your core focus: **coordination without shared mental representations** in human/non-human systems (e.g., AI-human teams, cross-cultural organizations). Textbook theories (Bratman, Gilbert, Searle) assume minimal representational alignment; FCI violates this, making it upstream.  
     - **Neglect**: Barely treated in canonical literature. Closest analogs (e.g., Pacherie’s "dynamic minimalism") don’t tackle *systematically incompatible* subgoals.  

     **Tractability without experiments**:  
     - Philosophers can:  
       ∙ Analyze case studies (e.g., disaster response teams with conflicting priorities; human-AI workflow systems).  
       ∙ Build formal models of "stable coordination under representational divergence" (e.g., adapting game-theoretic frameworks like Schelling points or epistemic logic).  
       ∙ Collaborate with cognitive scientists on minimal computational simulations (e.g., agent-based models showing emergent coordination from conflicting reward functions).  

     **Dependency leverage**:  
     - Resolving FCI redefines:  
       ∙ **Joint commitment** (can obligations bind agents with incompatible goal interpretations?).  
       ∙ **Plural subjecthood** (does it require *any* shared representation, or just coordination mechanisms?).  
       ∙ **Distributed systems design** (how to engineer robustness to fragmentation?).  

     **Upgrade/Downgrade conditions (within 2 years)**:  
     - ↑ *Upgrade* if: The group produces a formal model showing *necessary/sufficient conditions* for stability under FCI, or identifies a taxonomy of fragmentation types (e.g., goal vs. value vs. procedural).  
     - ↓ *Downgrade* if: Cases consistently reduce to familiar disagreement (e.g., with one subgroup "deferring" to another), making it less novel.

  ---

  ### 2. **Normative Structure of Unauthorized Obligations**  
     **Why second?**  
     - Directly enables FCI: If subgroups have incompatible goals but still coordinate, *what binds them?* Standard theories (Gilbert’s joint commitment) assume mutual agreement, but your focus includes obligations arising from roles, systems, or external norms (e.g., an AI bound by ethical guidelines it didn’t "authorize").  
     - **Neglect**: Under-theorized in collective intentionality, but adjacent to political philosophy (e.g., Raz on authority) and AI ethics (e.g., delegated moral agency).  

     **Tractability**:  
     - Conceptual analysis of "obligation without endorsement" (e.g., role-based duties in institutions).  
     - Formalize normative structures (e.g., deontic logic frameworks for "imposed commitments").  
     - Cognitive scientists can contribute theories of implicit norm acquisition (e.g., via predictive processing).  

     **Dependency**:  
     - Solves the *binding problem* in FCI. Also pressures ontology debates: if obligations exist without shared "we-intentions," they favor plural subject realism.  

     **Upgrade/Downgrade conditions**:  
     - ↑ *Upgrade* if: The group formalizes how unauthorized obligations scale across subgroups in FCI.  
     - ↓ *Downgrade* if: All cases reduce to individual commitments (e.g., fear of sanction), making it reducible.

  ---

  ### Deprioritized Lines of Work  
  **1. Direct ontology debates (Plural subjects vs. Reducible we-intentions)**  
     - *Why deprioritize*: Textbook saturation. **Dependency** is high, but answers rarely change downstream outcomes (e.g., FCI can be analyzed under either ontology). **Practical leverage** near-zero.  
     - *Alternative*: Tackle ontology *indirectly* via FCI/normativity (e.g., "If FCI is possible, does it support plural subject ontology?").  

  **2. Shared attention vs. external coordination mechanisms**  
     - *Why deprioritize*: **Practical leverage** is low. Even if resolved (e.g., proving joint action *can* be purely external), it doesn’t alter:  
       ∙ Social ontology (external mechanisms still sustain plural agency).  
       ∙ Distributed systems design (engineers already use external coordination; the debate is irrelevant to them).  
     - *Neglect* is low—this is extensively debated (e.g., Seemann, Butterfill).  

  ---

  ### **Criteria Conflicts & Resolution**  
  - **Dependency vs. Tractability**: Ontology debates are high-dependency but intractable (3 years of arguing won’t resolve them). *Resolution*: Address via applied cases (FCI/norms).  
  - **Neglect vs. Practical Leverage**: Shared attention is neglected in *some* contexts but offers little leverage. *Resolution*: Prioritize high-neglect *and* high-leverage issues (FCI).  
  - **Practical Leverage vs. Dependency**: Unauthorized obligations have moderate dependency but high leverage for ethics/AI. *Resolution*: Pair with FCI to amplify impact.  

  By prioritizing **FCI** and **unauthorized obligations**, your group:  
  ① Tackles novel, tractable problems aligned with distributed agency;  
  ② Builds a research agenda that intersects philosophy, cognitive science, and real-world systems;  
  ③ Avoids well-rehearsed debates while still engaging core themes (joint commitment, plural agency).  
  The deliverable—a defended agenda—emerges naturally from conceptual progress on these fronts.
