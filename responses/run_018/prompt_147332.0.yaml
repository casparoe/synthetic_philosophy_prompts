answer: |-
  Here's a breakdown of "revolutions devour their own children" into precise theses, their nature, explanatory utility within historiographical frameworks, its misuse, and a conceptual distinction:

  **Deconstructing the Slogan: Precise Theses**

  1.  **Thesis: Internal Factional Dynamics under Radical Uncertainty**
      *   **Claim:** Revolutionary situations create intense competition for power amidst profound uncertainty about threats, legitimacy, and the future. This environment breeds suspicion, escalates rhetorical and practical attacks, and incentivizes pre-emptive purges of even close allies seen as potential rivals or threats to unity/survival.
      *   **Nature:** **Substantive Empirical Claim Specific to 1789 (but with broader applicability).** While factionalism exists everywhere, the *intensity and lethal consequences* under the specific conditions of 1789-94 are a key historical observation.
  2.  **Thesis: Institutional Logic of Revolutionary Committees/Power**
      *   **Claim:** Revolutionary bodies (like the Committee of Public Safety, surveillance committees, revolutionary tribunals) derive their legitimacy and power from combating "counter-revolution." To sustain this power, they *must* continually identify and eliminate enemies. This logic inexorably leads them to target figures *within* the revolutionary movement itself ("children") once external enemies are suppressed or redefined.
      *   **Nature:** **General Law of Revolutionary Politics (with specific instantiations).** This describes a self-perpetuating mechanism inherent to institutions founded on emergency powers and ideological purity.
  3.  **Thesis: Psychological Law of Revolutionary Fervor → Paranoia**
      *   **Claim:** The intense psychological commitment and Manichean worldview ("us vs. them") necessary for revolutionary action inevitably exhausts itself, morphing into suspicion, fear, and paranoia. Leaders, isolated and under immense pressure, perceive betrayal everywhere, including among former comrades.
      *   **Nature:** **False Metaphor masquerading as a General Law.** While psychological stress and suspicion *occur*, framing it as an inevitable, law-like psychological trajectory oversimplifies complex motivations (power struggles, ideological disagreements, genuine strategic fears) and ignores contingent factors. It's psychologically deterministic.
  4.  **Thesis: Sociological Pattern - Destroying the Social Base**
      *   **Claim:** The radical measures (Terror, economic controls, political purges) implemented to *defend* the revolution against its enemies (internal/external aristocracy, hoarders, foreign powers) ultimately alienate and destroy key segments of its original social base (e.g., urban sans-culottes, radical sections of the bourgeoisie), paving the way for their overthrow by more moderate or reactionary forces (Thermidor).
      *   **Nature:** **Substantive Empirical Claim Specific to 1789 / Pattern in Radical Revolutions.** This accurately describes the trajectory from Jacobin dominance relying on sans-culotte support to Thermidor, where the exhausted and alienated base couldn't or wouldn't defend the regime.
  5.  **Thesis: Retrospective Narrative Pattern**
      *   **Claim:** "Devouring its children" is primarily a dramatic narrative trope imposed by historians (often liberal or conservative) to give a tragic, inevitable structure to the chaotic events of the Terror. It emphasizes the futility or inherent self-destructiveness of radical revolution.
      *   **Nature:** **Trivial Platitude about historiography / Potential False Metaphor if presented as causation.** All history involves narrative structuring. The danger lies in mistaking this compelling *story* for the actual *cause* of events or presenting it as an iron law.

  **Explanatory Work within Historiographical Frameworks**

  *   **Class-Struggle Account:**
      *   **Best Fit:** Thesis 4 (Destroying the Social Base). The bourgeoisie (especially its more conservative/commercial wing), having used radical Jacobins and sans-culottes to break feudal power, turned against them once their radicalism threatened bourgeois property rights and stable governance. The Terror alienated the popular base, allowing the bourgeoisie to reassert control via Thermidor. "Devouring" signifies the bourgeoisie sacrificing its radical allies and the mobilized populace once they became obstacles.
  *   **Ideological Account:**
      *   **Best Fit:** Thesis 2 (Institutional Logic) & partially Thesis 3 (though the psychological framing is weak). The relentless logic of Republican virtue and the drive for purity, embodied in institutions like the Committee of Public Safety, demanded the elimination of anyone deemed impure or insufficiently virtuous, including former leaders (Danton, Hébert). The pursuit of an uncompromising ideal turned against its agents. Thesis 2 provides the institutional mechanism for Thesis 3's psychological dynamic.
  *   **Contingency Account:**
      *   **Best Fit:** Thesis 1 (Factional Dynamics) & rejects Theses 2-4 as overdetermined. The Terror, including the purges, resulted from specific, contingent circumstances: the dire military crisis of 1793, intense personal rivalries (Robespierre vs. Danton, Hébert), the absence of stable institutions, and specific decisions made under pressure. The "devouring" wasn't structurally inevitable but a tragic outcome of bad decisions amid chaos and fear. It highlights the *avoidable* accidents and conflicts.

  **The Smuggled Reading (Dismissing Revolution):**
  When used to dismiss *all* revolutionary politics as inherently self-defeating, the smuggled reading is typically a **combination of Thesis 3 (False Psychological Law) and Thesis 5 (Narrative Pattern presented as Law)**, often implicitly supported by a fatalistic interpretation of Thesis 4. The argument becomes: Revolution *always* unleashes uncontrollable forces (psychological paranoia, institutional terror) that *inevitably* destroy its best elements and original supporters, leading to tyranny or collapse worse than the old regime. This ignores the specific contexts of 1789 (unique war, counter-revolution), downplays contingency, and universalizes a particular historical outcome into a timeless law against radical change.

  **Clarifying Distinction: Auto-Immunity vs. Overreach**

  *   **Institutional Auto-Immunity:** Focuses on the **internal logic and mechanisms** of revolutionary *power structures*. This is Thesis 2. Revolutionary institutions define themselves by opposition to enemies. To maintain their raison d'être and power base, they must continually find and eliminate threats. This creates a self-sustaining dynamic where the search for enemies inevitably turns inward, as external threats diminish or internal dissent is framed as counter-revolutionary. It's a systemic pathology of the revolutionary *state apparatus* under conditions of perceived existential threat.
  *   **Ideological Overreach:** Focuses on the **content and application** of revolutionary *ideas and goals*. This relates to Theses 3 & 4. It involves the pursuit of ideological goals (perfect virtue, absolute equality, complete eradication of the old order) that become so extreme, rigid, or detached from social realities that they necessitate increasingly violent, unpopular, or self-contradictory measures. The revolution tries to achieve the impossible or imposes its vision with such severity that it destroys the social coalition that brought it to power or creates resistance stronger than the old regime.

  **Does it resolve anything or just rename the problem?**

  *   **Resolution Value:** This distinction **clarifies the locus of the problem** and helps avoid conflation.
      *   Auto-Immunity explains *how* the purges happen systematically (through institutional logic).
      *   Overreach explains *why* such extreme measures are pursued and why they might backfire sociologically (due to unattainable goals or excessive application of ideology).
      *   It shows that "devouring" can stem from the *operational necessities* of revolutionary power (auto-immunity) *and/or* from the *inherent demands* of the revolutionary ideology itself (overreach). They can be mutually reinforcing but are analytically distinct.
      *   It helps separate contingent factors (e.g., war causing emergency powers - feeding auto-immunity; specific ideological interpretations leading to bad policy - overreach) from more structural elements.
  *   **Limitation (Renaming?):** It doesn't *fully* resolve the underlying debate about inevitability. Proponents of contingency might argue both auto-immunity and overreach only manifest under specific, avoidable conditions (extreme crisis, poor leadership). Class-struggle theorists might see auto-immunity as the bourgeoisie's tool for shedding allies, and overreach as the ideology masking class interest. Ideological accounts might see overreach as the core driver, with auto-immunity as its consequence. **However, it moves beyond the vague metaphor by specifying *where* and *how* the destructive dynamic originates:** Is it primarily in the *machine* of revolutionary governance, or in the *blueprint* of revolutionary ideals, or both?

  **Honest Assessment:** The distinction is **substantively useful, not merely a renaming.** It provides clearer analytical tools to dissect the "devouring" process. While it doesn't settle the grand historiographical debates (nothing does!), it refines the questions: Are we looking at a systemic flaw in revolutionary state-building, or a flaw in the revolutionary ideology's feasibility/application, or the fatal interaction of both under pressure? This allows for more precise historical analysis and argumentation about 1789 specifically. The metaphor remains powerful, but these concepts help ground it in observable mechanisms and ideas.
