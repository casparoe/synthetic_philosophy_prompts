prompt: |-
  I am a PhD student in philosophy working on collective intentionality, and a chapter of my dissertation keeps running aground on the discursive dilemma -- the fact that a group whose members each reason consistently can end up with inconsistent collective judgments depending on whether you aggregate their views on the premises or on the conclusions. I have a tentative principle for when each aggregation method is appropriate, and I would like it stress-tested against my case intuitions rather than against the abstract impossibility results, which I already know. My tentative principle is this: a collective body should aggregate at the level of conclusions when it must act as one and answer to outsiders for the decision itself, and at the level of premises when the reasons, not just the decision, will do downstream work -- for instance, when they will guide future cases or constrain other bodies.

  Here are my cases and my gut verdicts. Case 1: a three-member arbitration panel that issues only an award, no reasons. The contract is enforceable only if there was both a valid offer and a communicated acceptance. Arbitrator 1 finds offer but no acceptance; Arbitrator 2 finds acceptance but no offer; Arbitrator 3 finds both. My verdict: the award should go to the defendant, since two of three conclude the contract is unenforceable, and it would be perverse to enforce a contract that a majority of the panel thinks is invalid. Case 2: a five-member tenure committee where a candidate must clear a bar on research, teaching, and service. Each member fails the candidate on exactly one criterion, distributed so that each criterion individually passes by majority, but not a single member thinks the candidate clears all three. My verdict: no tenure, even though a criterion-by-criterion tally would grant it. Case 3: an appellate court with the exact vote pattern of Case 1, but this court must publish a reasoned opinion that will govern future litigants. Here my gut flips: I feel the court should vote on the premises and let the conclusion follow -- meaning the plaintiff wins -- because an opinion announcing the contract is unenforceable while containing no majority view on why seems worse than an uncomfortable outcome. Case 4, the one I keep going back and forth on: a three-member hiring committee where the overall vote is 2-1 to hire, but the candidate loses on every published criterion by majority, because the two supporters each weigh the criteria differently and think one outstanding strength compensates. Sometimes the bottom-line vote seems decisive to me; sometimes the unanimous-on-each-criterion rejection seems like it should be.

  Please do the following. First, test my tentative principle against all four cases: does it actually deliver my verdicts, or does it merely appear to because I have described the cases tendentiously? In particular, press on whether the distinction I draw between Case 1 and Case 3 -- the presence or absence of downstream reason-giving -- is really what is moving my intuitions, or whether something else is doing the work (the stakes, the one-shot versus repeated character of the body, the fact that I happen to like the defendant's outcome). Second, repair the principle or replace it with a small set of precisely stated candidate principles, identifying which case motivates each clause. Third, apply your best candidate to cases I have not considered -- say, a criminal jury whose members agree a defendant is guilty but disagree about which of two acts constitutes the crime, and a central bank committee that votes both on a forecast and on the policy that depends on it. Finally, be honest about which of my four verdicts, if any, cannot be accommodated by a single clean principle, and tell me which one you think I should give up if forced to choose -- including a resolution of Case 4 rather than a shrug at it.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in philosophy working on collective intentionality, specifically grappling with the discursive dilemma in their dissertation chapter. They've proposed a tentative principle for when to aggregate judgments at the conclusion versus premise level, and provided four cases with their intuitive verdicts. The request has multiple layers: testing the principle against the cases, refining/replacing it, applying it to new cases, and identifying any irresolvable tensions.

  First, I need to deeply understand their proposed principle: aggregate at conclusions when the group must act as one and answer externally for the decision; aggregate at premises when the reasons will do downstream work (e.g., guiding future cases). The four cases are:
  1. Arbitration panel (no reasons published) → conclusion aggregation → defendant wins
  2. Tenure committee → conclusion aggregation → tenure denied
  3. Appellate court (reasons published) → premise aggregation → plaintiff wins
  4. Hiring committee (swings both ways) → unresolved

  The user's core anxiety seems to be whether the presence of downstream reason-giving is truly doing the work in their Case 1 vs 3 distinction, or if other factors (stakes, outcome preferences) are contaminating the intuition. They also struggle with Case 4's ambiguity.

  Testing the principle against the cases:
  - In Case 1, no downstream reasons → conclusion aggregation aligns with their verdict (defendant wins). The principle holds.
  - Case 2 has no mention of downstream reasons, but their verdict is conclusion aggregation (deny tenure). The principle doesn't explicitly cover this, but since tenure decisions are final actions with accountability, it extends naturally.
  - Case 3 has downstream reasons (precedent-setting) → premise aggregation aligns (plaintiff wins). Principle holds.
  - Case 4 is tricky because it has elements of both: hiring is a final action (favors conclusion aggregation) but published criteria might guide future hires (favors premise aggregation). The principle pulls both ways here, explaining their back-and-forth.

  Key insight: The principle's strength is in distinguishing reason-giving contexts, but it may oversimplify by not accounting for other dimensions like:
  - Epistemic goals (e.g., tenure/hiring committees might care about correctness beyond mere decision)
  - Group identity formation (e.g., courts may prioritize coherent doctrine over single outcomes)

  For refinement, I consider proposing a dual-axis framework:
  1. Accountability Axis: When the body is primarily accountable for the decision (to external parties), aggregate conclusions.
  2. Guidance Axis: When the body's reasoning will be used to constrain/guide future decisions (by itself or others), aggregate premises.

  This handles Cases 1-3 well. For Case 4, it clarifies the tension: if the committee is merely hiring (Accountability Axis), aggregate the 2-1 vote to hire; if the published criteria will bind future committees (Guidance Axis), aggregate premises and reject. The user must decide which function dominates.

  New cases:
  - Criminal jury: Accountability to society for verdict is paramount → aggregate guilt conclusion (guilty), even with premise disagreement. The principle holds.
  - Central bank: The forecast (premise) guides future policy, while the rate decision (conclusion) is externally accountable. This exposes a gap: hybrid cases may need sequential aggregation (premises first for forecast, then conclusion for policy).

  Honest tensions: Case 2's verdict (deny tenure) feels right but slightly strains the principle—no downstream reasons are mentioned, yet we resist "manufactured" positive outcomes. This suggests an implicit epistemic concern: we distrust conclusions that no individual endorses. The principle might need a third clause: "Aggregate premises when the conclusion's coherence depends on shared reasoning paths." But this complicates the elegance. If forced to drop one verdict, Case 2 is the weakest fit, though I'd rather refine than abandon it.

  Ultimate recommendation: Stand firm on Cases 1-3. For Case 4, argue that hiring committees should aggregate conclusions unless their criteria explicitly create precedent. This preserves the principle's core while acknowledging that "downstream work" can be contextually interpreted.
answer: |-
  Your query is a philosopher's delight—precise, self-aware, and grounded in real conceptual tension. I'll tackle it step by step, stress-testing your principle against your cases, refining it, applying it to new scenarios, and flagging points of strain. Let's start by dissecting your existing verdicts.

  ---

  ### **Step 1: Testing Your Tentative Principle**
  Your principle:  
  > *Aggregate conclusions when the group must act as one and answer to outsiders for the decision; aggregate premises when the reasons will do downstream work (e.g., guide future cases).*

  #### **Case 1: Arbitration Panel (No Reasons)**  
  - **Your verdict:** Aggregate conclusions → defendant wins (no contract enforcement).  
  - **Principle’s verdict:** Consistent. No downstream work (award issued without reasons), and the panel answers externally for the binding decision.  

  #### **Case 2: Tenure Committee**  
  - **Your verdict:** Aggregate conclusions → tenure denied.  
  - **Principle’s verdict:** *Inconsistent in isolation*, but salvageable. Your principle doesn’t explicitly address epistemic integrity (i.e., "no member actually endorses tenure"). However, it fits if we interpret "answering to outsiders" as requiring the group to own the outcome *as a unified position*. Granting tenure when no one supports it holistically undermines accountability.  

  #### **Case 3: Appellate Court (Reasons Published)**  
  - **Your verdict:** Aggregate premises → plaintiff wins (contract enforced).  
  - **Principle’s verdict:** Consistent. Downstream work (precedent-setting opinion) requires premise-level coherence. An inconsistent opinion ("no valid offer OR no acceptance, but contract valid") would be disastrous for future litigants.  

  #### **Case 4: Hiring Committee**  
  - **Your verdict:** Ambiguous.  
  - **Principle’s verdict:** Pulls both ways.  
    - *Conclusion aggregation:* If hiring is a one-off action requiring external accountability (e.g., to a dean), aggregate the 2-1 "hire" vote.  
    - *Premise aggregation:* If published criteria constrain future hires (e.g., "no candidate hired without majority on each criterion"), aggregate premises → reject.  
    **Tension:** Your intuition shifts because the committee’s role is hybrid—it both *acts* (hires) and *sets standards* (via criteria). Your principle exposes this ambiguity but doesn’t resolve it.  

  #### **Is Downstream Reason-Giving the Core Driver?**  
  - **Yes, for Cases 1 vs. 3:** The absence/presence of downstream work cleanly explains your flipped intuition. Stakes (e.g., defendant’s outcome) aren’t primary; in Case 3, you accept enforcing a contract no majority deems valid *because* doctrinal coherence trumps the outcome.  
  - **But Case 2 reveals a gap:** Downstream reasons aren’t mentioned, yet you resist conclusion aggregation. Why? Because "answering to outsiders" implies defending the decision *as rationally endorsable*. A tenure grant contradicted by unanimous rejection on criteria is indefensible. This hints at a hidden variable: **epistemic responsibility to avoid incoherent outcomes**.  

  ---

  ### **Step 2: Repaired Principles**  
  Your principle needs two key additions: (1) epistemic integrity, and (2) role hybridity. Here’s a refined set:  

  #### **Candidate Principles**  
  1. **The Accountability Constraint:**  
     Aggregate judgments at the *conclusion level* when the body’s primary duty is to act decisively and answer externally for the outcome itself.  
     *Motivated by:* Case 1 (arbitration), where the award is a bare action.  

  2. **The Guidance Constraint:**  
     Aggregate judgments at the *premise level* when the body’s output must provide coherent reasons for downstream actors (e.g., precedent, policy consistency).  
     *Motivated by:* Case 3 (appellate court).  

  3. **The Epistemic Integrity Constraint:**  
     Aggregate judgments at the *premise level* if conclusion-level aggregation would produce a collective stance that no member accepts (e.g., unanimous premise rejection implies incoherent endorsement).  
     *Motivated by:* Case 2 (tenure) and Case 4 (hiring). This prevents "manufactured" outcomes.  

  4. **The Hybrid-Role Rule:**  
     For bodies with both action-oriented and reason-giving functions, *default to premise aggregation* if the reasons will bind future decisions; otherwise, *split the process* (e.g., vote on criteria first, then overall fit).  
     *Motivated by:* Case 4 (hiring committee).  

  #### **Repaired Unified Principle**  
  > A collective body should aggregate premises when (i) its output must provide coherent guidance for downstream actors, or (ii) conclusion-level aggregation would yield an outcome that no member endorses holistically. Otherwise, aggregate conclusions to ensure decisive action and external accountability.  

  ---

  ### **Step 3: Testing on New Cases**  
  #### **New Case 1: Criminal Jury**  
  - *Facts:* 12 jurors agree the defendant is guilty but split 6-6 on which act (A or B) constitutes the crime.  
  - **Applying principles:**  
    - **Accountability Constraint:** Juries answer to society for a verdict (guilty/not guilty), not the reasoning. → Aggregate conclusions: guilty.  
    - **But Epistemic Integrity:** A guilty verdict requires unanimity on *elements of the crime*. If the statute requires proving a specific act, premise aggregation may be needed to avoid convicting without a majority on any act.  
    - **Verdict:** *Conclusion aggregation (guilty)*. The jury’s role is to decide culpability, not doctrinal coherence. Downstream guidance is the judge’s/jurisprudence’s role.  

  #### **New Case 2: Central Bank Committee**  
  - *Facts:* Committee votes on both a forecast (premise: "inflation will exceed 5%") and a policy conclusion ("raise interest rates"). Some vote yes on inflation but no on rates; others vice versa.  
  - **Applying principles:**  
    - **Guidance Constraint:** The forecast guides future policy and market expectations → aggregate premises.  
    - **Accountability Constraint:** The rate decision is an action with external impact → aggregate conclusions.  
    - **Resolution:** *Sequential aggregation*. First, aggregate premises to set the forecast (downstream work). Then, conditional on the forecast, aggregate the policy conclusion (action/accountability).  

  ---

  ### **Step 4: Honest Tensions and Verdict Recommendations**  
  - **Your verdicts in Cases 1–3 are defensible** and cohere under the repaired principle.  
  - **Case 4 is the true outlier**—not because your intuition is flawed, but because hybrid roles defy a "clean" solution.  
    - Why it resists: The committee both *acts* (hires) and *sets standards* (via criteria). If criteria are merely descriptive, conclusion aggregation (hire) holds. If they are normative (e.g., "criteria define minimally acceptable candidates"), premise aggregation (reject) avoids endorsing someone unfit by shared standards.  
  - **Which verdict to give up if forced?**  
    - **Drop Case 2’s conclusion-aggregation verdict** if elegance is paramount. But this loses something vital: the horror of granting tenure to a candidate *every member finds deficient in some dimension*.  
    - **Better:** Retain all verdicts but refine Case 4. Argue that hiring committees should aggregate *premises* when criteria are published/authoritative (prioritizing institutional integrity), else aggregate conclusions (prioritizing decisiveness). This preserves epistemic integrity as a core constraint.  

  #### **Final Resolution for Case 4**  
  - **Apply the Epistemic Integrity Constraint:** If no member endorses the candidate *on the whole* (given compensatory weighing), premise aggregation should prevail → reject. Rationale: Publishing criteria implies they embody shared standards; overriding them holistically undermines the committee’s authority.  

  ---

  ### **Conclusion**  
  Your principle’s core insight—**downstream reason-giving drives premise aggregation**—is sound and explains Cases 1 and 3 elegantly. Cases 2 and 4 reveal that *epistemic integrity* (avoiding collectively unsupported outcomes) is equally vital. The repaired principle above captures this while handling your new cases.  

  If you adopt this, your dissertation gains:  
  1. A response to the impossibility results (by showing aggregation *can* be consistent when constrained by institutional role).  
  2. A framework for real-world bodies (e.g., courts vs. juries vs. committees).  

  P.S.: Case 4’s tension is philosophically fertile—don’t shrug! Argue that role hybridity demands explicit procedural rules (e.g., "always vote criteria first"). This could be your positive contribution.
