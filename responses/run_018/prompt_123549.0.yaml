answer: |-
  Here is a full specification of desiderata for an adequate normative theory of tolerance limits, designed to move beyond the liberal-authoritarian binary, with motivations, flagged tensions, and a brief assessment of key theories:

  **Core Desiderata: What the Theory Must Deliver**

  1.  **Handle Anti-Democratic Organizing vs. Protect Private Belief:**
      *   **Case:** Must justify why a democratic state may legitimately restrict organized efforts aimed at dismantling democratic institutions (e.g., banning paramilitary groups, regulating parties advocating dictatorship) while simultaneously forbidding the suppression of merely *holding* anti-democratic beliefs or private discussion of them.
      *   **Motivation:** Preserves core liberal commitment to freedom of conscience and thought while recognizing the existential threat organized, *actionable* anti-democratic forces pose to the system enabling tolerance itself. Avoids thought-policing.
      *   **Tension Point:** Distinguishing "organizing" from "private belief" in practice (e.g., online forums, closed meetings).

  2.  **Distinguish State Coercion from Private Platform Moderation:**
      *   **Case:** Must provide principled reasons why a state using criminal law or force to suppress speech is categorically different (requiring a much higher bar) from a private platform (e.g., social media, publisher) choosing not to amplify or host certain content.
      *   **Motivation:** Recognizes the fundamental difference in power, legitimacy, and the monopoly on violence held by the state versus non-state actors. Avoids conflating censorship with editorial discretion or community standards.

  3.  **Preserve Agent-Level Virtue vs. Structural/Institutional Feature:**
      *   **Distinction:** Must clearly differentiate between:
          *   *Tolerance as an individual virtue:* The personal disposition to refrain from interfering with beliefs/practices one finds objectionable (but may disapprove of).
          *   *Tolerance as an institutional principle:* A structural feature of laws, norms, and systems designed to protect dissent, pluralism, and rights *regardless* of individual actors' virtuousness.
      *   **Motivation:** Prevents collapsing the normative foundations (institutions must protect rights even when individuals are intolerant) and avoids judging institutions solely by the virtue of their current members. Focuses on systemic resilience.

  4.  **Distinguish Tolerating a View vs. Tolerating Material Conditions Enabling Harm:**
      *   **Distinction:** Must separate tolerating the *expression* of an objectionable view from tolerating the *material conditions* (e.g., systematic disinformation campaigns, unchecked accumulation of resources for violent mobilization, discriminatory economic structures) that make that view effectively *actionable* in ways that undermine the tolerant framework or cause severe harm.
      *   **Motivation:** Addresses structural threats that pure viewpoint neutrality ignores. Focusing solely on the view neglects how power, resources, and infrastructure transform abstract intolerance into concrete danger. (e.g., tolerating hate speech is different from tolerating a well-funded network systematically inciting violence).

  5.  **Avoid Presupposing Perfect Foresight:**
      *   **Condition:** The theory cannot rely on knowing *which* specific tolerated positions will *definitively* succeed in eroding the tolerant framework in the future.
      *   **Motivation:** Acknowledges radical uncertainty about historical trajectories. Demanding certainty paralyzes necessary defensive action. The theory must guide action under conditions of imperfect knowledge.

  6.  **Avoid Collapse into Pure Majoritarianism:**
      *   **Condition:** The justification for limits cannot boil down to "the majority finds X intolerable." Tolerance must protect *unpopular* minorities and views.
      *   **Motivation:** Protects the core purpose of tolerance: safeguarding dissent and minority rights against the tyranny of the majority. Majoritarianism negates tolerance.

  7.  **Avoid Collapse into Pure Procedural Neutrality:**
      *   **Condition:** The justification for limits cannot rely solely on abstract procedural rules without substantive evaluation of the *content* and *potential consequences* of the speech/action in question regarding the survival of the tolerant framework or core rights.
      *   **Motivation:** Pure neutrality is self-defeating when faced with actors strategically exploiting procedures to destroy the system enabling those procedures (the Paradox core). Some substantive judgment is unavoidable.

  **Key Tensions (Suspected Joint Unsatisfiability):**

  *   **Epistemic Humility (No. 5) vs. Effective Defensive Action (Core Paradox):** This is the **central tension**. How to act decisively to prevent the erosion of tolerance (requiring identifying threats) without the certainty demanded by strict epistemic standards? Any rule risks over- or under-inclusion. Theories lean towards one side.
  *   **Structural Focus (No. 4) vs. Avoiding Thought Policing (No. 1):** Focusing on material conditions risks justifying overly broad interventions (e.g., restricting funding sources for *any* group with objectionable views) that effectively suppress the view itself. Defining "enabling conditions" precisely is critical and difficult.
  *   **Avoiding Majoritarianism (No. 6) vs. Democratic Legitimacy:** Defining limits non-majoritistically (e.g., via courts, rights frameworks) risks being perceived as undemocratic elitism. Balancing legitimate democratic input with protection against majority tyranny is inherent.

  **Brief Assessment Against Desiderata:**

  1.  **Popper's "Defensive Democracy" (Intolerance towards the intolerant):**
      *   **Strengths:** Directly confronts the paradox (No. 1 - allows suppression of anti-democratic *action/organizing*). Avoids pure procedural neutrality (No. 7).
      *   **Weaknesses:** Critically vague on *what* constitutes a threat meriting suppression and *who* decides, risking majoritarian abuse (No. 6) or subjective overreach. Lacks nuance on distinctions (No. 2, 3, 4). Offers little guidance under uncertainty (No. 5) – prone to either panic or paralysis.

  2.  **Millian Harm Principle (Limit only to prevent direct harm to others):**
      *   **Strengths:** Strong protection for belief and speech (No. 1), clear(ish) distinction principle. Avoids majoritarianism (No. 6) and thought policing. Provides a standard distinct from mere offensiveness.
      *   **Weaknesses:** Struggles profoundly with the core paradox and structural threats (No. 4). Does suppressing an anti-democratic movement *prevent harm*? Often only clear once harm is imminent, failing the "prevent erosion" test. Collapses towards procedural neutrality (No. 7) regarding systemic threats. Poor on power asymmetries (No. 2 - treats state and private action similarly in principle). Offers no tools for epistemic uncertainty (No. 5) about long-term erosion.

  3.  **Structural-Institutional View (Focus on protecting system integrity):**
      *   **Strengths:** Explicitly distinguishes institutional from agent-level tolerance (No. 3). Focuses on systemic resilience and material conditions enabling harm (No. 4). Can justify non-majoritarian safeguards (No. 6) and differentiate state vs. private action (No. 2 - state protects framework, private actors have different roles/responsibilities).
      *   **Weaknesses:** Faces the **Epistemic Humility vs. Defensive Action** tension most acutely (No. 5). Defining "system integrity" and "material conditions enabling harm" is inherently contestable and risks overreach (potentially violating No. 1 if not carefully bounded). Needs robust, independent institutions, which may be lacking. Can be complex to operationalize.

  **Conclusion for Your Framework:** An adequate theory must navigate the knife-edge between epistemic humility and the necessity of defending the tolerant system. It must provide principled, non-majoritarian, non-procedurally-neutral grounds for distinguishing protected dissent from actionable threats, while clearly separating agent virtue from institutional duty, belief from organization, speech from enabling infrastructure, and state power from private moderation. The structural-institutional view grapples most directly with the systemic nature of the paradox but faces the steepest challenge regarding uncertainty and defining actionable threats without overreach. Popper is a starting alarm bell but lacks precision; Mill protects core liberty but is blind to the systemic corrosion at the heart of the paradox. Your challenge lies in finding a resolution that honors all these constraints without collapsing under their inherent tensions.
