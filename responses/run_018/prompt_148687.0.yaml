  First I need to understand the two camps precisely. Camp A (normative-rationalist) views akrasia as a failure of practical rationality where someone acts against their own best judgment. Camp B (intertemporal-mechanist) sees it as fully explained by hyperbolic discounting models of time preferences. The user wants a formal document with four specific parts.

  For the agreed claims section (Part 1), I'll include points both sides accept: the mathematical properties of discount curves, problems with exponential discounting models, how precommitment devices work mechanistically, evidence of resolution violations, and established findings about delay of gratification. I'll define key terms like "diachronic authority" and "binding-cost/residue" here since they're central to the framing.

  The disagreements table (Part 2) needs precise formulations each camp would endorse. For example, Camp A will insist on normative residue while Camp B denies it. I'll use neutral language that accurately represents each position without straw-manning.

  For the cruxes (Part 3), I need to design test cases:
  - For normative residue (crux a), the silent-precommitment case is perfect - where someone binds themselves without conflict and later says they "would have done otherwise." Camp A predicts diachronic betrayal remains; Camp B sees this as successful self-control.
  - For synchronic vs diachronic conflict (crux b), I'll use cases of impulsive action versus calm resolution-breaking.
  - For precommitment mechanisms (crux c), I'll contrast preference-shifting methods with external constraints.

  In Part 4, I'll identify verbal disagreements, like whether "akrasia" should include cases without subjective conflict. Both sides might agree the phenomena exist but disagree on labeling.

  Throughout, I'll carefully flag what's consensus (e.g., empirical findings), what's camp-specific (e.g., eliminability of normative talk), and what's genuinely contested. The goal is a document that advances the debate by clarifying points of agreement and productive disagreement.
answer: |-
  ## Joint Statement: Adversarial Collaboration on Akrasia and Hyperbolic Discounting

  **Part 1: Agreed Claims (Signed by Both Camps)**

  We, representatives of the Normative-Rationalist Camp (Camp A) and the Intertemporal-Mechanist Camp (Camp B), affirm the following shared understandings based on empirical evidence and formal modeling:

  1.  **Hyperbolic & Quasi-Hyperbolic Discounting Formalisms:** Agents frequently display intertemporal preferences that violate the stationarity axiom of exponential discounting. Hyperbolic discounting (e.g., value = reward / (1 + k*delay)) and quasi-hyperbolic discounting (β-δ model: value = β * δ^delay * reward for delay > 0, value = reward for delay=0) provide descriptively accurate models of this behavior, capturing preference reversals where smaller-sooner rewards are preferred over larger-later rewards when both are proximate, while larger-later rewards are preferred when both are distant.
  2.  **Predictive Failures of Exponential Discounting:** The exponential discounting model (value = δ^delay * reward) systematically fails to predict widespread empirical phenomena, including: the commonality of preference reversals, the high demand for precommitment devices, the "sign effect" (gains discounted more than losses of equivalent magnitude), the "magnitude effect" (smaller amounts discounted more steeply than larger ones), and subadditive discounting over intervals.
  3.  **Mechanistic Function of Precommitment:** Precommitment devices (e.g., savings bonds, Ulysses contracts, commitment apps, irreversible defaults) work by altering the *causal landscape* facing the agent at the time of the tempting choice. They achieve this by either: (a) increasing the immediate cost of the tempting option (e.g., penalty fee), (b) removing the tempting option entirely (e.g., locked account), or (c) automating the desired behavior (e.g., payroll deduction). Their effectiveness relies on creating a credible barrier to reversing the prior choice.
  4.  **Existence of Resolution Violation:** There exist numerous empirically documented cases where agents formulate prior resolutions or plans (e.g., to diet, save money, quit smoking, study) and subsequently act in violation of those resolutions at the time of execution, despite the absence of significant new information justifying the change.
  5.  **Delay of Gratification & Self-Control Technology Findings:** The ability to delay gratification is a significant predictor of long-term life outcomes (e.g., academic achievement, health, financial stability). Furthermore, externally imposed constraints and self-imposed precommitment technologies demonstrably improve outcomes aligned with long-term goals in contexts prone to preference reversal (e.g., savings rates, medication adherence, healthy eating). Effortful self-control is depletable, as shown by ego-depletion studies (though replicability nuances are noted).
  6.  **Defined Framing Concepts:**
      *   **Diachronic Authority:** The question of whether a prior resolution or judgment (Self^t1) possesses legitimate claim or *authority* over the actions of the agent at a later time (Self^t2), purely in virtue of the agent's rational continuity over time (Camp A emphasis) or solely in virtue of the causal power exerted by the constraints established at t1 (Camp B emphasis).
      *   **Binding-Cost:** The effort, willpower depletion, or welfare loss incurred by an agent in establishing, maintaining, or resisting the violation of a resolution *without* relying on external technological precommitment. This cost is empirically measurable (e.g., ego-depletion tasks, revealed preference for commitment devices).
      *   **Binding-Residue:** The putative *normative remainder* – a sense of obligation, regret, or judgment of error – that may persist even when the *binding-cost* is eliminated or drastically reduced through successful precommitment technology. Its existence and nature are contested.
  7.  **The Silent-Precommitment Case (Descriptive Agreement):** Consider an agent who, at time t1, calmly sets up an automatic, irreversible transfer of funds to a savings account inaccessible until t3, aimed at funding a long-term goal. At t2 (the time the transfer occurs), the agent experiences no subjective conflict, temptation, or conscious awareness of the transfer. When queried at t2 about the transfer happening *right now*, the agent states, "I set it up weeks ago, it's automatic. I probably would have spent that money on something frivolous today if it were available, but I don't feel conflicted or like I'm acting against myself right now; it's just happening." Both camps agree this scenario occurs and involves a successful precommitment without synchronic conflict at t2.

  **Part 2: Disagreements Table**

  | Disagreement Area           | Camp A (Normative-Rationalist) Wording                                                                 | Camp B (Intertemporal-Mechanist) Wording                                                                 |
  | :-------------------------- | :----------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- |
  | **Nature of Akrasia**       | Akrasia is a distinctive failure of *practical rationality*, occurring when an agent intentionally acts contrary to their own conscious, all-things-considered best judgment at the time of action. | What philosophers term "akrasia" is exhaustively explained by dynamically inconsistent preferences arising from hyperbolic/quasi-hyperbolic discounting. There is no additional "failure of rationality" beyond the preference reversal itself. |
  | **Normative Residue**       | Violating a prior resolution, even if done calmly and without synchronic conflict at t2, constitutes a *diachronic betrayal* by Self^t2 of Self^t1. This leaves a "normative residue" – a legitimate sense of error, regret, or judgment that the agent *ought* to have followed the resolution, reflecting a fracture in rational agency. | "Normative residue" (e.g., retrospective regret, claims of "ought") is epiphenomenal. It arises from folk-psychological narratives applied post-hoc to the brute fact of preference change and conflict between temporal selves. It is not evidence of a distinct rational failure. |
  | **Explanatory Primacy**     | Hyperbolic discounting models describe the *mechanics* of intertemporal conflict but fail to capture the *normative* and *phenomenological* essence of being divided against oneself – the experience of acting against one's own decisive judgment. | Hyperbolic discounting dynamics (including preference reversal, the demand for precommitment, associated neural activity in valuation systems) provide a complete causal and functional explanation for the behaviors labeled "akratic." The phenomenology is generated by the conflict of competing valuations. |
  | **Best Judgment**           | The agent's "all-things-considered best judgment" represents the deliverance of their practical reason, integrating values and beliefs. Acting against it is inherently irrational. | "Best judgment" is not a distinct faculty but simply the winning valuation at time t1. At t2, a different valuation wins due to discounting dynamics. There is no uniquely rational "best judgment" transcending the agent's time-indexed preferences. Precommitment succeeds by making the t1 valuation causally dominant at t2. |
  | **Diachronic Authority**    | Self^t1 possesses *diachronic rational authority* over Self^t2 in virtue of shared agency and the requirements of unified practical reasoning over time. Precommitment devices enforce this inherent authority. | "Diachronic authority" is metaphorical. Precommitment devices exert *causal power*, not normative authority. Self^t1 binds Self^t2 through external constraints, not rational obligation. The only "authority" is causal efficacy. |

  **Part 3: Cruxes & Predictive Cases**

  1.  **Crux (a): Normative Residue**
      *   **Question:** Does violating a prior resolution (even without synchronic conflict) leave a distinct "normative residue" – a sense that one *should* have acted otherwise, irreducible to mere preference change or retrospective regret about outcomes – that hyperbolic models must explain rather than eliminate?
      *   **Test Case:** The **Silent-Precommitment Case** (described in Agreed Claim 7). *Crucial follow-up at t3:* When the savings goal is achieved at t3, the agent is asked: "Looking back at the automatic transfer at t2, which you said you didn't feel conflicted about then: Do you feel that *you* (the person you are now) acted *correctly* or *incorrectly* at t2 by letting that transfer happen? Was it the *right thing for you to do* at t2, even though you didn't actively choose it then and might have spent the money frivolously if you could?"
      *   **Camp A Prediction:** The agent will strongly affirm that it was the *correct* and *right* thing to have happened at t2, precisely *because* it fulfilled the authoritative resolution of Self^t1. They will judge the *mechanism* (the precommitment) as having *ensured* that Self^t2 acted correctly, averting a potential diachronic betrayal. The resolution's normative force persists.
      *   **Camp B Prediction:** The agent will express satisfaction with the *outcome* (achieved goal) but will describe the t2 event neutrally as "the mechanism working as planned" or "a good thing that happened." They will resist characterizing the *agent at t2* as having acted "correctly" or "incorrectly" in a normative sense distinct from outcome satisfaction/preference fulfillment. Any positive evaluation is purely outcome-based, not deontic. Talk of "right thing for *me* to *do* at t2" is confabulated narrative.

  2.  **Crux (b): Synchronic Conflict vs. Diachronic Betrayal**
      *   **Question:** Are "synchronic conflict" (feeling torn at t2 while acting against judgment) and "diachronic betrayal" (calmly acting against a prior resolution at t2 without feeling torn) distinct phenomena requiring different explanations, or does the latter collapse into a variant of the former or simply represent successful preference shift?
      *   **Test Case:** Contrast two scenarios:
          *   **Case 1 (Synchronic):** Agent resolves to diet. At t2, faced with cake, they vividly feel the conflict ("I really want it, but I know I shouldn't"), experience distress, yet eat it.
          *   **Case 2 (Diachronic Betrayal):** Agent resolves to start dieting Monday. Come Monday morning, they calmly decide "Screw it, diet starts tomorrow," eat cake for breakfast, and report no internal struggle at the moment of decision, only perhaps later regret about outcomes. *Crucial Investigation:* Neuroimaging/physiological measures (e.g., fMRI conflict monitoring networks like ACC, skin conductance) at t2 in both cases.
      *   **Camp A Prediction:** Case 2 represents a distinct phenomenon (diachronic betrayal). While both cases involve akrasia, Case 1 shows synchronic conflict, whereas Case 2 shows a *failure to engage* practical reasoning at t2 regarding the resolution. Neural markers of conflict/effort will be significantly higher in Case 1 than in Case 2 at t2. The phenomenology and mechanisms differ.
      *   **Camp B Prediction:** Case 2 is simply a variant where the preference shift is complete and the prior resolution valuation is momentarily weak or inactive at t2. The underlying mechanism (hyperbolic discounting favoring immediate cake reward) is the same. Neural valuation signals for the cake will dominate in both cases at t2. Neural conflict signals will correlate with the *strength* of competing valuations at t2, not with the mere existence of a past resolution. Case 2 lacks conflict signals because the resolution valuation is too weak at t2 to compete effectively.

  3.  **Crux (c): Precommitment Mechanism & Akrasia Diagnosis**
      *   **Question:** Does precommitment succeed primarily by altering the underlying preference structure (shifting valuations) or by imposing an external causal constraint? Does the distinction bear on whether weakness of will (akrasia) has occurred in the constrained action?
      *   **Test Case:** Compare two precommitment types targeting the same temptation (e.g., avoiding social media):
          *   **Type 1 (Constraint):** App blocker irreversibly locks access for 4 hours (causal barrier).
          *   **Type 2 (Preference Shift):** Agent uses a app that reframes social media use vividly in terms of lost life hours and accumulated anxiety *immediately before* the usual temptation time, demonstrably lowering their real-time valuation of social media at t2 (measured via delay-discounting task or neurovaluation signals).
          *   *Crucial Measurement:* At t2 (temptation time), measure the agent's *actual preference* for social media use (via brief choice task offering small immediate access vs. slightly delayed monetary reward) under both precommitment conditions and a no-precommitment control. Also measure self-reported feeling of "acting against my will" if they *were* to use it (hypothetically).
      *   **Camp A Prediction:** Type 1 (Constraint) prevents akrasia by *removing the choice*, but the underlying temptation/preference conflict may remain unaltered. If the agent *could* access it, they might still act akratically. Type 2 (Preference Shift) genuinely reduces the conflict and thus the *potential* for akrasia by aligning valuations. Akrasia diagnosis applies only when the agent acts *against their judgment at t2*. Type 1 prevents the action, avoiding akrasia; Type 2 reduces the likelihood the judgment would be violated.
      *   **Camp B Prediction:** Both types are effective self-control *technologies*. Type 1 works by imposing a cost/barrier (raising the implicit 'price' of access). Type 2 works by temporarily lowering the valuation of the tempting option. Both alter the effective choice architecture. The distinction is mechanistic but irrelevant to "akrasia," which is simply preference reversal. If the agent under Type 1 *could* access it cheaply, they would – showing the underlying preference reversal remains. "Acting against my will" reports will correlate with the *experienced* conflict/cost at t2, not the mechanism type.

  **Part 4: Verbal vs. Substantive Disagreements**

  Both camps acknowledge that *some* aspects of the dispute are potentially verbal, hinging on definitions and permissible language:

  1.  **Scope of "Akrasia":** Camp A defines akrasia *normatively* as action against best judgment. Camp B defines it *descriptively* as a behavioral pattern of preference reversal/resolution violation. **Verbal Aspect:** Whether the term "akrasia" *must* entail a failure of rationality (Camp A) or *can* apply purely to the behavioral phenomenon (Camp B). **Substantive Core:** Whether the behavioral phenomenon *requires* a normative/rational failure explanation (Camp A) or is *sufficiently* explained by mechanistic discounting (Camp B).
  2.  **Meaning of "Best Judgment":** Camp A uses it to denote the output of rational deliberation with normative force. Camp B uses it descriptively for the winning preference at t1. **Verbal Aspect:** The precise definition and ontological status of "best judgment." **Substantive Core:** Whether there exists a distinct faculty of practical reason generating judgments with inherent rational authority over future actions (Camp A), or whether deliberation is simply a process of weighing competing preferences indexed to time (Camp B).
  3.  **"Diachronic Betrayal" Label:** Camp A sees calm resolution-violation as a form of akrasia (diachronic betrayal). Camp B sees it as successful preference shift, not akrasia. **Verbal Aspect:** Applying the *label* "akrasia" or "betrayal" to Case 2 in Crux (b). **Substantive Core:** Whether the mere violation of a past resolution, irrespective of synchronic conflict, constitutes a distinct rational failure requiring explanation beyond preference dynamics (Camp A) or not (Camp B).

  **Reasoning for Both Sides:** Both camps can agree that clarifying definitions ("What do *you* mean by X?") is crucial. They can also agree that resolving the cruxes (Part 3) will provide evidence bearing directly on the *substantive* disagreements underlying the verbal ones. For instance, the Silent-Precommitment follow-up (Crux a) probes the "normative residue" claim directly, regardless of whether it's called "akrasia" or not.

  **Clarification of Status of Claims:**

  *   **Widely Accepted (Philosophy of Action & Behavioral Economics):**
      *   Humans frequently act against prior resolutions/intentions.
      *   Exponential discounting fails descriptively.
      *   Hyperbolic/quasi-hyperbolic models better capture intertemporal choice anomalies (preference reversal).
      *   Precommitment devices are effective empirically.
      *   Effortful self-control is a limited resource (ego-depletion, though with ongoing debate on mechanisms).
      *   Delay of gratification capacity predicts important outcomes.
  *   **Camp-Specific Doctrines:**
      *   **Camp A:** The irreducible normativity of practical reason; the existence of "best judgment" as a distinct rational faculty; the reality of normative residue/diachronic authority; the essential failure of rationality in akrasia.
      *   **Camp B:** The eliminability of normative concepts ("ought," "best judgment," "rational failure") in favor of descriptive preference dynamics and causal mechanisms; the exhaustiveness of hyperbolic discounting explanations for akrasia phenomena; the view that temporal selves are effectively distinct agents linked by causal chains.
  *   **Genuinely Contested & Open:**
      *   The existence and nature of "normative residue" (Crux a).
      *   The distinctness and mechanisms of synchronic conflict vs. diachronic resolution-violation without conflict (Crux b).
      *   The precise causal mechanisms by which different precommitment strategies work and their implications for defining self-control failures (Crux c).
      *   The relationship between neural correlates of valuation/conflict and the phenomenology of agency/akrasia.
      *   Whether the concept of "diachronic authority" reflects a real feature of rational agency or is a useful fiction/causal constraint.
      *   The extent to which "binding-residue" is a robust phenomenon separable from outcome-based regret and binding-cost.
      *   The ultimate success of reducing all aspects of intention-resolution-violation dynamics to intertemporal preference models or the necessity of incorporating irreducible normative/rational structures. *(This is the core meta-dispute)*
