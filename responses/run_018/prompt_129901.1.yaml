  ### Diagnostic Taxonomy of Composition Positions  
  *Rooted in concrete case judgments; avoids leading terminology.*

  #### **Root Question:**  
  Do a pebble on Earth and a pebble on Alpha Centauri compose a single object?  
  - **Yes** → Proceed to **Replacement Survival**  
  - **No** → Proceed to **Existence of Composites**  

  ---

  #### **Branch 1: Replacement Survival**  
  *(For "Yes" to root)*  
  Can a ship survive the complete, gradual replacement of all its original planks?  
  - **Yes** → Proceed to **Intermittent Existence**  
  - **No** → Proceed to **Intermittent Existence**  

  ##### **Branch 1.1: Intermittent Existence**  
  Can a ship exist on Tuesday, fail to exist Wednesday (scattered as junk), and exist again Thursday (reassembled identically)?  
  - **Yes** → **Leaf 1: Unrestricted universalism**  
    - *Awkward commitment:* Arbitrary scattered particles (e.g., Earth and Alpha Centauri pebbles) compose a physically disconnected "scatter-object."  
  - **No** → **Leaf 2: Universalism with composition-as-identity**  
    - *Awkward commitment:* The universe is a single composite object identical to its parts, making "part-counting" incoherent.  
  - **Unoccupied Path (Yes→No):**  
    - *Diagnosis:* Coherent but unattractive (denies reassembly of identical parts into the same object).  

  ##### **Branch 1.2: Intermittent Existence**  
  *(For "No" to Replacement Survival)*  
  Same as Branch 1.1.  
  - **Yes** → **Leaf 3: Unnamed (mereological essentialist universalism)**  
    - *Awkward commitment:* A reassembled ship with original parts is numerically identical to the original, but replacing one plank destroys it irreversibly.  
  - **No** → See Leaf 2 (above).  
  - **Unoccupied Path (No→Yes):**  
    - *Diagnosis:* Incoherent (denies part-replacement survival but accepts reassembly survival).  

  ---

  #### **Branch 2: Existence of Composites**  
  *(For "No" to root)*  
  Is there any composite object at all (e.g., a table)?  
  - **No** → Proceed to **Truth of Ordinary Claims**  
  - **Yes** → Proceed to **Gappy Objects**  

  ##### **Branch 2.1: Truth of Ordinary Claims**  
  If atoms are arranged table-wise, is "There is a table" true?  
  - **Yes** → **Leaf 4: Arrangement-only nihilism**  
    - *Awkward commitment:* "Tables exist" is true, but tables are not objects—only atoms arranged "table-wise" exist.  
  - **No** → **Leaf 5: Eliminative nihilism**  
    - *Awkward commitment:* All ordinary composite claims (e.g., "I own a chair") are false; only simples exist.  

  ##### **Branch 2.2: Gappy Objects**  
  *(For "Yes" to Existence of Composites)*  
  Is a hollow iron sphere (intact, with empty interior) one object?  
  - **Yes** → **Leaf 6: Contact-based restrictionism**  
    - *Awkward commitment:* A pile of sand is an object, but a watch with a microscopic gap between cogs is not.  
  - **No** → Proceed to **Causal Systems**  

  ##### **Branch 2.3: Causal Systems**  
  Does the solar system (Sun + planets bound by gravity) compose one object?  
  - **Yes** → **Leaf 7: Causal-integration restrictionism**  
    - *Awkward commitment:* A severed hand is not an object, but a functioning robot is—even if identically structured.  
  - **No** → Proceed to **Life**  

  ##### **Branch 2.4: Life**  
  Does a living cat compose one object?  
  - **Yes** → **Leaf 8: Life-based (organicist) restrictionism**  
    - *Awkward commitment:* A living cat is an object, but the same cat dead is not (or is a different object).  
  - **No** → **Leaf 9: Unnamed restrictionism**  
    - *Awkward commitment:* Composition requires human intentions, so mountains ceased to exist before humans evolved.  

  ---

  #### **Indistinguishable Leaves**  
  - **Leaf 1 (Unrestricted universalism)** and **Leaf 3 (Unnamed universalism)** cannot be separated by the **Gappy Objects** or **Restriction Condition** cases—both would affirm a hollow sphere is one object.  
    - *Resolution:* Only persistence questions (Replacement/Intermittence) distinguish them.  

  #### **Unoccupied Branch Combinations**  
  - **Root→Yes→Replacement:Yes→Intermittence:No**  
    - *Diagnosis:* Unattractive (allows survival through part-replacement but not reassembly of original parts).  
  - **Root→No→Composites:Yes→Gappy:Yes→[Persistence Questions]**  
    - *Diagnosis:* Unexplored (contact-based theories rarely specify persistence conditions).  

  #### **Taxonomy Summary**  
  | Leaf | Position | Awkward Commitment |  
  |------|----------|--------------------|  
  | 1 | Unrestricted universalism | Scattered galactic pebbles compose a disconnected object. |  
  | 2 | Universalism + composition-as-identity | The universe is one object; "parts" are illusory. |  
  | 3 | Unnamed (essentialist universalism) | A ship reassembled from original parts is identical to the original, but replacing one plank destroys it. |  
  | 4 | Arrangement-only nihilism | "Tables exist" is true, but tables are not objects—only arrangements exist. |  
  | 5 | Eliminative nihilism | Ordinary claims like "I own a chair" are strictly false. |  
  | 6 | Contact-based restrictionism | A sand pile is an object; a watch with a microscopic gap is not. |  
  | 7 | Causal-integration restrictionism | A severed hand isn’t an object; a functional robot with identical structure is. |  
  | 8 | Life-based restrictionism | A living cat is an object; the same cat dead is not (or is fundamentally different). |  
  | 9 | Unnamed restrictionism | Mountains did not exist before humans evolved (if intention-dependent). |  

  *Note: All nodes are concrete case judgments. Labels are revealed only at leaves.*
