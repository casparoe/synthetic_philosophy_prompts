prompt: |-
  I'm preparing notes for a workshop on risk ethics and want a consistency audit of the following package. Here are my commitments: (1) I treat the precautionary principle as a deontic filter rather than a heuristic—if an activity threatens severe, irreversible harm, proceeding requires positive justification rather than mere absence of disproof; (2) I apply this symmetrically, supporting a moratorium on frontier AI training runs past a defined compute threshold unless safety is demonstrated with near-certainty, and supporting analogous constraints on climate geoengineering; (3) I am a moral actualist: the moral verdict on a policy depends solely on actual outcomes in the real world, not on counterfactual risks that never materialized; (4) I reject Bayesian and imprecise-probability frameworks for deep uncertainty because they rely on empirically unfounded priors; (5) for cases where probabilities are genuinely unassignable, I adopt maximin—select the option with the least harmful worst-case outcome; (6) I maintain that rational deliberation should never invoke considerations that are in principle unobservable, since rationality must be answerable to actual evidence. Which pairs are in genuine tension, which only appear to conflict, and what is the least costly revision for each real conflict? Please rank the tensions by severity, identify the single revision that would resolve the most conflicts, and answer in American English.
