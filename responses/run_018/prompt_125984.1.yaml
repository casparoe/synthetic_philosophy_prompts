  The user's spectrum idea (from positive to negative to republican liberty as points on an interference-sensitivity scale) is clever but potentially reductive. Republican theorists would argue domination introduces a qualitative difference in social relations, not just quantitative difference in counterfactual robustness. The master's recognized authority to interfere arbitrarily changes the fundamental nature of the relationship.

  I should emphasize how the republican view makes non-domination a constitutive social good - valuable not just instrumentally (to prevent future interference) but as essential for equal standing in society. Pettit's "eyeball test" metaphor is useful here: free people can look others in the eye without fear or deference.

