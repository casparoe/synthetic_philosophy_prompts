prompt: |-
  I'm writting a novel about a ghostwriter who gets stuck choosing between a flattering portrait and a warts-and-all biography of a dead community organizer, and I want to understand the philosophy behind it. I was skimming Plutarch's paired biographies — you know, where he compares lives to teach virtue — and I got thinking about hagiography, those saint's lives where every flaw gets sanded away. So here's what I need: construct a thought experiment, just one paragraph, realistic, no sci-fi or fantasy, about a biographer deciding whether to include a hidden betrayal in the life of an admired activist who won a major housing reform. The betrayal should be real but redeemable — she threw a colleague under the bus to save the campaign, then spent years making amends in quiet ways.

  Design the case so that two views of moral learning split exactly: on one view we learn morality by admiring and copying exemplary figures, so the hagiographic version (omitting the betrayal) makes the activist more useful; on the other view moral understanding requires seeing virtues embedded in a full life with failure and recovery, so the critical version should be better. But build in a twist: in the critical version the betrayal is so narratively gripping that readers over-identify with the flaw and miss the virtue entirely, while in the hagiographic version the virtue is so perfect it feels inapplicable to ordinary people. After the scenario, walk through what each view says and why, identify the structural feature that makes them split, say what happens if you remove the betrayal's narrative pull, and tell me how a defender of the hagiographic side would attack the critical case. Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and don't restate my question. I keep going in circles with my writting group about this.
