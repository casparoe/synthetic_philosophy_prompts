answer: |-
  **Bottom line:** The biographer's dilemma exposes how psychology distorts moral learning when narrative form clashes with ethical substance, risking either unattainable idealism or voyeuristic cynicism regardless of factual accuracy.

  **Thought Experiment:** Consider Maya Flores, a revered activist whose tireless, selfless campaigning secured landmark affordable housing legislation credited with saving thousands from eviction. Decades later, her authorized biographer discovers that during a critical juncture when the campaign faced collapse due to damaging leaks, Maya secretly leaked details of a colleague Carlos's (then-secret) extramarital affair to a reporter, deliberately redirecting the scandal away from campaign finances and onto Carlos's personal life. The strategy worked, saving the campaign but destroying Carlos's marriage and reputation. Maya never publicly admitted her role, but spent the next fifteen years anonymously paying Carlos's children's college tuition, securing him discreet consulting work, and funding his eventual relocation and fresh start—actions only uncovered through the biographer's deep archival research. The biographer must decide: omit this entirely, crafting a flawless portrait of Maya's courage and dedication (hagiography), or include it, depicting her profound moral failing and subsequent, quiet, lifelong restitution (critical).

  **Analysis:**

  1.  **Exemplary View (Hagiography):** Moral learning occurs through emulation of ideal models. Including the betrayal shatters the exemplar. Readers need an unblemished Maya to inspire their own civic courage and self-sacrifice. Omitting the betrayal preserves her pure utility as a guiding star. The quiet amends, while ethically significant, are narratively irrelevant to her public legacy as a model activist.
  2.  **Embedded Virtue View (Critical):** True moral understanding requires seeing virtue tested and rebuilt within the complexity of a real life. Omitting the betrayal creates a sanitized, inhuman ideal. Reading about Maya's catastrophic ethical lapse *and* her persistent, costly, private atonement demonstrates the hard, ongoing work of integrity far more powerfully than a flawless image. It shows virtue isn't innate perfection but resilience and repair.

  **The Split:** The views split on the *source* of moral learning: the Exemplary View locates it in the *model itself* (requiring purity), while the Embedded Virtue View locates it in the *process of wrestling with imperfection* (requiring complexity).

  **The Narrative Twist & Consequences:**
  *   **In the Critical Version:** The betrayal is so dramatic—a secret, high-stakes sacrifice of a colleague—that it becomes the narrative focal point. Readers fixate on the shock of Maya's ruthlessness, identifying with the thrill of the transgression or the horror of Carlos's fate. The quieter, more mundane, fifteen-year effort of making amends gets overshadowed. The lesson becomes "even heroes are flawed" (cynicism) rather than "heroes fall and choose arduous redemption" (resilience).
  *   **In the Hagiographic Version:** Omitting the betrayal renders Maya *too* perfect. Her tireless campaigning and ultimate victory seem effortless, born of inherent, superhuman virtue. Readers see no struggle they can relate to; her sacrifice feels alien, her success unattainable for ordinary, flawed individuals. The lesson becomes "sainthood is required" (detachment) rather than "sacrifice is possible" (inspiration).

  **Removing Narrative Pull:** If the betrayal were less dramatic (e.g., Maya took sole credit for Carlos's minor idea under pressure, later corrected the record privately) or the amends more public and celebrated, the critical version might work better. The flaw wouldn't dominate the narrative, allowing the redemption arc to shine and making the Embedded Virtue View's lesson clearer: virtue encompasses recovery, not just perfection. The narrative weight would shift towards the repair, making the virtue feel earned and applicable.

  **Hagiographic Defense Against Critical Case:** A defender of the hagiographic approach would attack the critical biography on two fronts:
  1.  **Moral Hazard:** Including the betrayal, even with redemption, provides a dangerous template. Readers might remember the *act* of betrayal ("She saved the campaign by sacrificing Carlos") and its initial success, while downplaying the long-term personal cost and arduous amends. It risks *normalizing* Machiavellian tactics as a necessary evil for the "greater good," especially if the campaign's success seems to justify the means. The lesson learned might be "betrayal works," not "betrayal requires lifelong penance."
  2.  **Dilution of the Exemplar:** The sheer gravity of the betrayal fundamentally corrupts Maya's value as a model. No amount of subsequent amends can fully erase the act of deliberately destroying an innocent colleague's life for strategic gain. Presenting her *as a whole* with this act included fatally undermines the unambiguous moral clarity required for effective emulation. It introduces paralyzing doubt ("Is *any* sacrifice justified?") where the hagiography offers energizing certainty ("This is pure good to strive for"). The messy reality obscures the essential virtue it's meant to teach.
