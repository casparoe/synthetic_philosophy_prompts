  Okay, this user is a specialty insurer dealing with highly unique, one-off risks where traditional actuarial data is scarce. They're frustrated about reference class tennis - the practice of cherry-picking statistical classes to justify predetermined prices. Their bonus structure incentivizes premium volume over accuracy, creating moral hazard. 

  The core tension here is epistemological: how to assign objective probabilities when every risk is essentially idiosyncratic. They want a mechanical procedure precisely because human judgment has proven corruptible. The six pain points they listed reveal sophisticated meta-awareness of cognitive biases - especially the membership test requirement which shows they understand the hindsight bias problem.

  Hmm... their examples are fascinatingly niche. That direct air capture unit case is essentially a Knightian uncertainty scenario - no relevant historical data exists. I'll need to be blunt about that one. The adversarial step request is clever; it formalizes devil's advocacy which is proven to reduce overconfidence.

  Key design challenges:
  - Must avoid false precision theater while still being actionable
  - Needs choke points where analysis stops rather than fudges
  - Should surface conflicts rather than paper them over
  - Must work for both frequentist and Bayesian interpretations

  For the ledger rule, I'm considering a version-controlled taxonomy - like a living document of risk categories that evolves but can't retroactively change. The "three strikes" rule for class rejection might feel arbitrary but any cutoff would; the important thing is forcing explicit justification when stretching data.

  The margin of divergence (15%) is admittedly arbitrary but based on behavioral finance findings about disagreement thresholds. Escalation to CUO is crucial - it makes the cost of gaming the system visible at the executive level.

  On the DAC unit case: they'll hate hearing "no quote" but it's honest. Better to position it as "we're selling our judgment, not false statistics" - which is actually more defensible to regulators anyway. The CUO memo should emphasize opportunity cost: chasing unquantifiable risks distracts from their core competency.

  Biggest vulnerability remains class shopping before step 1. Only partial mitigation possible through procedure design - ultimately requires cultural change. Hence the bonus structure mention: no technical fix compensates for misaligned incentives.
answer: |-
  Here’s a **Pre-Registered Pricing Procedure (PRPP)** for your desk. It runs in 7 steps, stops at hard "NO" when criteria fail, and flags judgment calls. Execution time: ≤4 hours per file. **Bold** = critical steps.

  ---

  ### **The PRPP Procedure**
  1. **Define Outcome**  
     *Action*: Write the exact insured event (e.g., "≥10 days downtime").  
     *Stop If*: Outcome can’t be measured objectively.  
     *Judgment Call*: Defining "transit failure" – but must document thresholds upfront.  

  2. **List Candidate Classes**  
     *Action*: Brainstorm 5–10 reference classes using historical data/industry sources.  
     *Rule*: Each class **must pass Membership Test**: "Could we assign *historical* cases to this class *before* knowing their outcome?"  
     *Stop If*: Only class(es) fail Membership Test → **NO**.  
     *Example Fail*: "Genuinely unavoidable delays" (hindsight bias).  

  3. **Filter by Data Quality**  
     *Action*: Reject classes with:  
     - < 20 historical cases *or*  
     - Zero cases unless supplemented by ≥3 expert consensus estimates.  
     *Cutoff*: 20 cases (judgment call in lab coat – balances stability/tractability).  
     *Stop If*: No classes survive → **NO**.  

  4. **Calculate Baseline Probability**  
     *Action*: Compute frequency for each valid class. For classes with 1–5 cases:  
     - Use *upper bound* of 90% confidence interval (conservative guardrail).  
     - **Never guess** – thin data must inflate uncertainty.  
     *Output*: Range of probabilities from all valid classes.  

  5. **Adversarial Challenge**  
     *Action*: Designate one underwriter as "Red Team." They pick the **most favorable class to the client** (lowest rate).  
     *Divergence Test*: If highest vs. lowest probability differs by > **15 percentage points** (e.g., 5% vs. 20%), escalate to CUO.  
     *Escalation*: CUO chooses the class based on "risk appetite," not data. Document rationale.  

  6. **Ledger Reconciliation**  
     *Rule*:  
     - All classes used must be added to a **Master Ledger** with:  
       - Class definition (e.g., "Touring exhibitions: ≥4 venues, fragile art").  
       - List of included historical cases (by ID).  
     - New cases added to ledger only if they fit *existing* definitions.  
     - **No re-categorizing old cases** – ever.  

  7. **Final Output**  
     - If divergence ≤15pp: Use **midpoint** of highest/lowest valid class.  
     - If escalated: Use CUO’s chosen number.  
     - If stopped at NO: No quote issued.  

  ---

  ### **Run on Your Files**  
  ***(1) Touring Exhibition (Downtime Risk)***  
  - Outcome: ≥10 days downtime at any venue.  
  - Candidate Classes:  
    - All touring exhibitions (freq: 8% based on 45 cases)  
    - Exhibitions with ≥4 venues (freq: 12%, 22 cases)  
    - First-time logistics partner (freq: 23%, 9 cases) → **REJECTED** (n<20)  
  - Baseline Range: 8% (all) to 12% (≥4 venues).  
  - Adversarial: Red Team picks "all exhibitions" (8%). Divergence = 4pp (<15pp).  
  - **Quote Probability**: 10% (midpoint).  

  ***(2) Indie Film Bond (Late Delivery)***  
  - Outcome: >15 days late.  
  - Candidate Classes:  
    - All completion bonds (freq: 10%, 38 cases)  
    - First-time director (freq: 28%, 15 cases) → **REJECTED** (n<20)  
    - Distributor late on payments (freq: 41%, 11 cases) → **REJECTED** (n<20)  
  - Baseline: Only "all bonds" (10%) valid.  
  - Adversarial: No rival class → no divergence.  
  - **Quote Probability**: 10%.  

  ***(3) Direct Air Capture Unit (Availability Failure)***  
  - Outcome: Availability < guarantee threshold in Year 1.  
  - Candidate Classes:  
    - "First-of-a-kind industrial prototypes" → 1 historical case → **REJECTED** (n<20 + no expert consensus).  
    - "Chemical plant startups" → Fails Membership Test (irrelevant physics).  
  - **STOP AT STEP 3**: **NO QUOTE**.  
  - **Hand CUO**: Memo stating: *"No valid reference class. Risk is fundamentally unmodeled. Decision to insure must be based solely on engineering review & gut."*  

  ---

  ### **Where It Misfires (and How You’ll Game It)**  
  - **Step 2 (Membership Test)**: Teams might "define away" bad historical cases ("That wasn’t *really* a logistics failure!"). **Mitigation**: Ledger forces consistency.  
  - **Step 3 (Data Cutoff)**: 20 is arbitrary – you’ll stretch to include a class with 19 "kinda similar" cases. **Mitigation**: Escalation on divergence.  
  - **Step 5 (Adversarial)**: Red Team might "sandbag" by picking a barely-valid class. **Mitigation**: CUO sees all rejected classes.  
  - **Step 6 (Ledger)**: Adding new cases to inflate a class’s n-count. **Mitigation**: New cases can’t change prior quotes.  

  ---

  ### **Philosophy-Agnostic Notes**  
  - **Frequentists**: Treats probabilities as frequencies. Anchors to data.  
  - **Bayesians**: Adjustments happen **only at escalation** (CUO’s "risk appetite" = prior belief).  
  - Both use the same procedure – divergence forces human judgment where models fail.  

  **Time per File**: 3–4 hours (mostly Steps 2/4). CUO escalation adds 1 hour.  
  **Output**: A number that’s defensible, auditable, and limits drift. Stops you from pricing the unpriceable.
