  First, I need to recall Nietzsche's three modes properly: monumental history is about inspiration from the past, antiquarian is about preservation for its own sake, and critical is about judging and dismantling harmful past narratives. The challenge is applying these to synthetic artifacts like AI voices or virtual buildings—things that feel like evidence but are actually reconstructions.

