answer: |-
  **Bottom line:** This 15-min checklist flags technical issues and values risks in synthetic history proposals using Nietzsche's modes, but kicks ethical calls upstairs.

  **The Synthetic Heritage Tri-Check:**

  1.  **What's the primary mode?** (Pick *one* dominant intent)
      *   *Monumental:* Inspiring action? (e.g., "This hero's voice will motivate people!")
      *   *Antiquarian:* Pure preservation? (e.g., "Just showing the block exactly as it was!")
      *   *Critical:* Challenging myths? (e.g., "Exposing the founding lie!")
      *   *Sufficient:* Clear, single-mode statement from proposer. *Blurry?* Probe hard.
      *   *Stop/Hard No?* If proposer can't articulate *any* mode clearly.

  2.  **Is the synthetic core transparent & accurate *within its mode*?**
      *   *Check:* Is the reconstruction tech clearly labeled as such? Are its *known* limits/gaps stated? Does it match *verifiable* source material for its core elements?
      *   *Sufficient:* "AI voice based on 3 known recordings & period dialect notes, labeled 'reconstruction'." / "VR model built from 5 photos & 2 blueprints, gaps noted."
      *   *Hard No?* If core elements are fabricated without *any* historical anchor ("We made up the voice/docs/building details").
      *   *Handoff:* If transparency is weak ("We'll put a small sign") or accuracy claims are dubious ("It's *definitely* how it sounded").

  3.  **Does the mode use introduce unavoidable deception or harm?**
      *   *Monumental:* Could the inspiring *synthetic* element be mistaken for *real evidence* of the past in a way that distorts action?
      *   *Antiquarian:* Does presenting the synthetic as "pure preservation" hide interpretation/gaps so much it *becomes* false history?
      *   *Critical:* Does critiquing myth *require* or *use* new fabricated "evidence" as if real?
      *   *Sufficient:* "The AI voice is framed as 'inspired by' not literal." / "The VR model includes a layer showing uncertainty."
      *   *Hard No?* **YES – If Critical mode uses fabricated documents *as evidence*.** (Even if director wants it! Fabricating "proof" to debunk myth destroys historical integrity). Also if Antiquarian mode has *zero* interpretation, making synthetic gaps deceptive.
      *   *Handoff:* If potential deception/harm exists but might be mitigated (e.g., Monumental use *risks* misperception as evidence).

  **Applied:**

  *   **(a) AI Labor Organizer Voice (Monumental):** Handoff @ Q3. Does presenting an inspiring *reconstructed* voice risk being seen as *the actual* voice, distorting the historical basis for action? (Director decides risk level/mitigation).
  *   **(b) Virtual Immigrant Block (Antiquarian):** **HARD NO @ Q3.** Presenting a synthetic rebuild as "pure preservation with *zero* interpretation" inherently hides the reconstruction's gaps/choices, making it deceptive faux-history.
  *   **(c) Critical Debunking with Fake Docs:** **HARD NO @ Q2/Q3.** Fabricating documents is creating fake historical "evidence" (fails Q2 accuracy). Using fake docs as proof in Critical mode is fundamentally deceptive and corrupts the historical process (fails Q3).

  **What it CAN'T do:** Resolve deep philosophical clashes between modes (e.g., "Is inspiration *more* valuable than pure fact here?"). Judge artistic merit. Decide *if* a mitigated risk is acceptable (that's the director's values call). Handle proposals where the synthetic *is* the core historical argument itself.
