  I should address why normative aspects complicate things. For example, duties involve reasons, agents, and contexts, which aren't present in the physical lamp. Continuity in physics might not translate to moral continuity. Also, the prescriptive nature adds layers that mathematical solutions can't resolve directly.

  Feasibility is crucial. Six months is tight. They need to scope carefully—focus on one duty type (rescue), avoid exhaustive literature reviews, and prioritize core arguments. Success would be a clear articulation of the problem and novel insights; failure might be unresolved questions but still valuable groundwork.

  Potential pitfalls: Overcomplicating formal models or getting bogged down in metaphysics. They should acknowledge these but show awareness. Also, ensuring the normative toggle is distinct from physical supertasks by emphasizing moral properties' persistence or indeterminacy.

