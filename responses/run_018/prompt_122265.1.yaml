  First, I need to help them state the question precisely. They mentioned avoiding standard replies to Thomson like Benacerraf's indeterminacy or continuity arguments, so I should highlight why those don't directly apply to normative cases. Moral obligations involve prescriptive elements, not just physical or mathematical ones. Also, they don't want this compared to the drowning child argument, so the focus should stay on the supertask structure.

