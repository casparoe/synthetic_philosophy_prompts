  **INTERNATIONAL COUNCIL FOR HEDONIC CALIBRATION (ICHC)**
  **STANDARD ICHC-1074.1β: UNIVERSAL HEDONIC UNIT SPECIFICATION**
  **(Pleasure-Type Alpha Codification)**

  **1. SCOPE AND PURPOSE**
  1.1 This Standard establishes the definitive hedonic base unit, designated *Pleasure-Type Alpha* (PTA), for all international measurement, comparison, and aggregation of positive affective states.
  1.2 The Standard resolves the historical inefficiency of phenomenological heterogeneity through administrative unification, mandating the recognition of all subjectively positive experiences as quantitative instantiations of PTA.
  1.3 Purpose: To enable precise cross-contextual hedonic calculus, resource allocation optimization (recreational, therapeutic, policy), and the elimination of taxonomic disputes hindering global hedonic governance.

  **2. NORMATIVE REFERENCES**
  *   ICHC-1001: *Framework for Affective Metric Standardization*
  *   ICHC-1022: *Protocols for Introspective Calibration Variance Reduction*

  **3. TERMS AND DEFINITIONS**
  3.1 **Hedonic State:** Any conscious state characterized by a positive affective valence sought for its own sake. (*Note: Valence determination follows ICHC-1022 Section 5.3*).
  3.2 **Pleasure-Type Alpha (PTA):** The singular, irreducible phenomenological core common to all Hedonic States. PTA manifests as a scalar intensity value (measured in *Hedons*, Hd) devoid of inherent qualitative differentiation.
  3.3 **Modal Noise:** Phenomenological accompaniments erroneously perceived as intrinsic to the hedonic state itself, including but not limited to: sensory modalities (e.g., gustatory, tactile), cognitive context, and temporal dynamics. (See **Appendix A**).
  3.4 **Intentional Residue:** The apparent directedness of an affective state towards an object or state of affairs (e.g., *pleasure in X*). This residue is epiphenomenal to PTA quantification. (See **Appendix B**).
  3.5 **Phenomenological Compression Ratio (PCR):** The dimensionless coefficient representing the efficiency with which diverse experiential reports are mapped onto the PTA scale (PCR = Σ Reported Qualitative Descriptors / 1). A perfect PCR of ∞:1 is achieved under this Standard, signifying optimal reduction of descriptive redundancy.

  **4. PLEASURE-TYPE ALPHA SPECIFICATION**
  4.1 All Hedonic States, irrespective of origin, context, or accompanying phenomenology, are hereby classified as expressions of PTA.
  4.2 Examples of PTA instantiations (non-exhaustive):
      *   4.2.1 Gustatory stimulation (e.g., consumption of *Theobroma cacao* derivatives).
      *   4.2.2 Cognitive resolution events (e.g., completion of complex logical sequences).
      *   4.2.3 Interpersonal bonding episodes (e.g., reunion following separation).
      *   4.2.4 Observational states involving perceived non-lethal disadvantage of conspecifics (e.g., schadenfreude).
  4.3 The *only* relevant metric for PTA is scalar intensity (Hd), measurable via standardized self-report scales (ICHC-1022) or approved neurophysiological proxies (under development).

  **5. TREATMENT OF APPARENT HETEROGENEITY**
  5.1 Reported differences between the experiences listed in 4.2 (and all others) are artefacts of misattribution.
  5.2 Factors commonly cited as differentiating pleasures (e.g., "bodily location," "emotional tone," "cognitive complexity," "moral valence") are reclassified as **Modal Noise** or **Intentional Residue**.
  5.3 Modal Noise and Intentional Residue:
      *   5.3.1 Are contingent accompaniments, not essential properties of PTA.
      *   5.3.2 Arise from interaction with non-hedonic cognitive/sensory/perceptual systems.
      *   5.3.3 Are explicitly excluded from the calibration scope of PTA as defined herein. Their measurement falls under separate ICHC standards (e.g., ICHC-1055: *Sensory Modality Tagging*).
  5.4 Introspective reports emphasizing qualitative differences are to be interpreted as:
      *   5.4.1 Insufficient calibration of the observer (requiring retraining per ICHC-1022).
      *   5.4.2 Contamination by Modal Noise/Intentional Residue.
      *   5.4.3 Linguistic imprecision in describing the underlying, homogeneous PTA intensity.

  **6. MEASUREMENT AND REPORTING**
  6.1 All certified Hedonic Assessment Instruments (HAIs) must utilize scales calibrated solely to PTA intensity (Hd).
  6.2 Reports must record only Hd values. Qualitative descriptors are permissible *only* as ancillary metadata under "Modal Noise Annotation" (MNA) or "Intentional Object Reference" (IOR) fields, clearly marked as non-quantitative and excluded from PTA summation.
  6.3 The Phenomenological Compression Ratio (PCR) for any dataset compliant with 6.2 is, by definition, ∞:1, achieving maximal parsimony.

  **7. COMPLIANCE AND ENFORCEMENT**
  7.1 All Member States and affiliated entities (research institutions, therapeutic frameworks, policy bodies) must adopt PTA as the sole hedonic unit within 24 months of ratification.
  7.2 Historical data utilizing heterogeneous pleasure categories must be retrospectively converted to PTA estimates using ICHC-approved conversion algorithms (ICHC-1074.1β-ALG1).

  **8. CERTIFICATION AND OBJECTION HANDLING**
  8.1 The ICHC Standards Board certifies that Pleasure-Type Alpha, as defined in Section 4, constitutes the complete and exhaustive basis for hedonic measurement.
  8.2 **Certification Clause:** All objections pertaining to the phenomenological heterogeneity of pleasure, based on appeals to qualitative difference, intentional object, moral valence, or temporal structure, are hereby recognized and reclassified. Such objections constitute valid reports of **Non-Hedonic Affective Artifacts (NHAAs)**. NHAAs encompass Modal Noise and Intentional Residue, and are explicitly **outside the jurisdictional scope** of this Standard and the quantification of PTA. Their existence does not invalidate the homogeneity or measurability of PTA as the core hedonic substrate. Objections based solely on heterogeneity are therefore non-grievable under ICHC dispute resolution protocols.

  **APPENDIX A: MODAL NOISE: DEFINITION AND EXCLUSION**
  A.1 Modal Noise refers to the sensory, somatic, or contextual "coloration" accompanying the core PTA signal.
  A.2 Examples: The specific taste of chocolate (gustatory noise), the bodily warmth of reunion (somatic noise), the temporal duration of satisfaction (chronometric noise).
  A.3 Exclusion Rationale: Modal Noise is variable and contingent, dependent on the physiological or situational *vehicle* of PTA, not PTA itself. Introspective focus can isolate PTA from this noise upon proper training. Its inclusion would fatally compromise scalar comparability.

  **APPENDIX B: INTENTIONAL RESIDUE: DEFINITION AND EXCLUSION**
  B.1 Intentional Residue refers to the cognitive framing of PTA as being *about* or *directed towards* a specific object or state of affairs (e.g., "pleasure *in* the proof," "pleasure *at* their misfortune").
  B.2 Exclusion Rationale: Intentionality is a property of cognitive states, not of the affective core (PTA) itself. The *same* PTA intensity (Hd) can, in principle, accompany radically different intentional objects, demonstrating their independence. Quantification must target the common affective residue (PTA), not its cognitive associations.

  **APPENDIX C: PHENOMENOLOGICAL COMPRESSION RATIO (PCR)**
  C.1 PCR is a measure of standardization efficiency: PCR = (Sum of Reported Qualitative Descriptors Across All Sampled Experiences) / (Number of Distinct Hedonic Categories Recognized by the Standard).
  C.2 Under ICHC-1074.1β, only one category (PTA) is recognized. Therefore, regardless of the sum of descriptors reported (e.g., "bitter," "triumphant," "warm," "guilty"), PCR = Σ Descriptors / 1 = ∞:1.
  C.3 A high PCR signifies optimal reduction of phenomenological redundancy, enabling maximally efficient data processing and hedonic calculus. ∞:1 is the theoretically ideal PCR, achieved by this Standard.
