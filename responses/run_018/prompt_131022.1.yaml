       - **Phenomenological Intensity (P)**: Strength of conscious experience.
       - **Temporal Spread (T)**: Duration of the effect.
       - **Adaptational Resistance (A)**: Resilience to habituation.
     - **Profile Examples** (ensure ambiguity; no dominant beneficiary):
       - **Beneficiary 1**: P=8, T=3, A=5  
       - **Beneficiary 2**: P=3, T=7, A=2  
       - **Beneficiary 3**: P=5, T=4, A=9  
       - **Beneficiary 4**: P=6, T=5, A=4  
     - **Private Channel Redaction**: For each card, one dimension is redacted (marked "[REDACTED]"). Each beneficiary has two cards—one redacting a different dimension.  
       *Example: Card for Student A (Beneficiary 1)*:  
       `P: [REDACTED] | T: 3 | A: 5`  
       *Card for Student B (same beneficiary)*:  
       `P: 8 | T: [REDACTED] | A: 5`

  2. **Public Information Board** (visible to all):  
     - Displays **full profiles** for all beneficiaries *except each student’s own*.  
     - Format:  
       ```
       BENEFICIARY 2: P=3, T=7, A=2  
       BENEFICIARY 3: P=5, T=4, A=9  
       BENEFICIARY 4: P=6, T=5, A=4
       ```
     - *(Note: No information about Beneficiary 1 is public—only private cards hold it.)*

  3. **Scoreboard**:  
     - Tracks:  
       - **Collective Reward Pool**: 10 points (awarded only for unanimous agreement).  
       - **Individual Penalties**: -2 points per student if resource allocated away from their beneficiary.

  4. **Resource Token**: One physical object (e.g., a red card labeled "Noise-Abatement Budget") to allocate.

  ---

  #### **Roles and Rules**
  - **All Students**:  
    - Each is assigned one beneficiary (two students per beneficiary).  
    - Each sees:  
      - Full profiles of *other* beneficiaries (from public board).  
      - Partial profile of *own* beneficiary (one dimension redacted on their card).  
    - **Dual Incentives**:  
      - **Impartial Judge**: Argue for the beneficiary with "greatest overall welfare impact."  
      - **Hidden Stakeholder**: Avoid penalty by allocating resource to *own* beneficiary.  
  - **Instructor**:  
    - Moderates time, enforces rules, breaks ties.  
    - Does not intervene in discussion unless rules are violated.  
  - **No Veto Power**: Decisions require unanimity or forced vote.  

  ---

  #### **Payoff/Scoring Scheme**
  - **Collective Reward**: If unanimous agreement, all students share **10 points** (1.25 points each).  
  - **Individual Penalty**: **-2 points** for a student if the resource is *not* allocated to their beneficiary.  
    *(Applies regardless of unanimity; penalty is waived only if their beneficiary wins.)*  
  - **Net Outcomes Examples**:  
    - Student’s beneficiary wins + unanimity: **+1.25 points**.  
    - Student’s beneficiary loses + unanimity: **-0.75 points** (1.25 - 2).  
    - No unanimity + student’s beneficiary loses: **-2 points**.  

  ---

  #### **Timeline (75 Minutes Total)**
  1. **Setup (5 min)**:  
     - Distribute envelopes (each contains a beneficiary card).  
     - Display public board. Explain rules and scoring.  
     - Emphasize: "Unanimous agreement required. No arbitrary conversion rates unless *all* accept them."  

  2. **Individual Review (5 min)**:  
     - Students review their private card and public board.  
     - *Instructor prompt*: "Assess welfare impact qualitatively—no numbers yet."  

  3. **Negotiation Phase (40 min)**:  
     - Students discuss freely. They may share card details but cannot invent conversion rates (e.g., "1 unit of P = 2 units of T") without unanimous consent.  
     - *Instructor monitors*: Shut down quantitative shortcuts if any student objects.  

  4. **Forced Vote (10 min if no unanimity)**:  
     - If no agreement by 40-min mark:  
       - Each student votes secretly for one beneficiary.  
       - Majority vote wins (instructor breaks ties with coin flip).  
       - **No collective reward** (only penalties apply).  

  5. **Outcome Implementation (5 min)**:  
     - Allocate resource token to winning beneficiary.  
     - Record scores on scoreboard.  

  6. **Debrief (20 min)**: Start immediately after allocation.  

  ---

  ### **Debrief: Mapping Simulation to Philosophy**  
  *(Instructor guides discussion, then names the problem)*  
  1. **Initial Confidence in Comparison (5 min)**:  
     - *Simulation moment*: Early optimism ("We can eyeball it—Beneficiary 3 has high A!").  
     - *Philosophical link*: Exposes the illusion of "obvious" welfare comparisons. Without redactions, dimensions seem commensurable—but private channels break this.  

  2. **Private Channels and Introspection Failure (5 min)**:  
     - *Simulation moment*: A student realizing, "I see others’ full profiles but not my own—I can’t even rank *my* beneficiary honestly!"  
     - *Philosophical link*: Highlights the core problem: Introspection is useless for interpersonal ranking. Your "welfare impact" is opaque to others and yourself (due to redacted dimensions).  

  3. **Temptation to Project (5 min)**:  
     - *Simulation moment*: A student with high P on their card argues, "Intensity matters most!"—ignoring that others value T or A.  
     - *Philosophical link*: Shows how we "smuggle in" personal metrics. Projection (e.g., "My pain scale applies to you") is unavoidable but arbitrary.  

  4. **Honest Limitation (2 min)**:  
     - *What the activity misses*: Real-world welfare lacks defined dimensions. Here, students share a *language* (P/T/A), but in practice, we lack even this bridge—leading to ineffability.  

  ---

  ### **Predicted Failure & Handling**  
  - **What Will Go Wrong**:  
    - Students will initially ignore welfare and vote selfishly to avoid penalties, causing deadlock.  
    - One student may dominate, imposing a conversion rate (e.g., "P is most important!").  
  - **How to Handle Without Breaking Simulation**:  
    - **Deadlock**: Remind them mid-negotiation, "The collective reward vanishes if you fail—find the *truth*, not just your interest."  
    - **Illegitimate Conversion Rates**: Intervene neutrally: "Group, does everyone accept this metric? If not, revert to qualitative debate."  
    - **Selfish Voting**: Let it happen. The forced vote’s arbitrary outcome *is the lesson*—it mirrors how social choice collapses without comparisons.  

  ---

  **Outcome**: Students experience the interpersonal comparison problem viscerally—before you name it. The simulation forces them into a corner where every solution either requires unjustified metrics or fails entirely.
