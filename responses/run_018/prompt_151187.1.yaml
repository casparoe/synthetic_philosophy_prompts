prompt: |-
  I'm running a discussion for a local book club — mostly lawyers and engeneers, no philosophy background — and we're tackling Arendt's report on the Eichmann trial. They all come in with the Hollywood idea that evil is this dramatic, demonic choice, and they've heard the phrase banality of evil used as a catchphrase. I want to teach the actual conceptual move: that evil can come from an active kind of thoughtlessness, not monstrous intent, and that it's scarier precisely because it's ordinary. Plan the session's explanatory arc: what idea has to be in place before banality even makes sense, which carrying example to build on (I'm thinking of focusing on Eichmann's bureaucratic language and cliche's rather than the trial highlights everyone knows), the miconceptions they'll raise in order — like "so she's saying he wasn't responsible?", "is she exusing him?", "does this apply to every bureaucrat?" — and how the sequence should absorb each at the right point. What's the check for understanding that shows they've actually grasped the idea rather than just feeling uncomfortable? And what should I deliberately leave out at this level, maybe the Kantian background or her theory of action, and say so.
