  For propriety versus merit: Watkins' memo had propriety (her concern properly matched the fraudulent evidence) but lacked merit (Lay didn't praise/blame appropriately). Lay's public calm appeared proper to outside spectators but would fail the impartial spectator test internally. This distinction explains why warnings didn't trigger action.

  Then the harder questions: Does Smith's model assume face-to-face encounters, failing for institutions like audit committees? I think yes - the "man within" gets replaced by committee dynamics. And Enron's culture deliberately eroded shared moral community, making sympathy impossible. The impartial spectator fails spectacularly here - when the "man within" is institutionally captured, or when information asymmetry is engineered.

  Where Smith illuminates: the psychology of why warnings were ignored. Where he misdescribes: assuming individuals can always access the impartial spectator. Where silent: on how institutional structures corrupt moral judgment systematically. I shouldn't force Smith to say what he doesn't - his model wasn't designed for corporate entities.

