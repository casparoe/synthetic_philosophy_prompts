answer: |-
  ### Structural Outline
  1. **Section One (Romance)**: Flowing lines (5–6 stresses), heavy enjambment, sensory imagery (tactile/visual/olfactory), refrain imbued with wonder.  
  2. **Section Two (Precision)**: Tighter lines (3–4 stresses), internal rhyme/consonance, technical/geometric diction, refrain as clinical verdict.  
  3. **Section Three (Generalisation)**: End-stopped lines, abstract nouns, passive voice, hollowed syntax, refrain as detached formula.  
  **Refrain Evolution**: "This is how we learn" — Section 1: awe; Section 2: conclusion; Section 3: ritual.  
  **Tension**: No resolution — romance’s vitality persists in memory; precision’s tools lie discarded; generalisation feels weightless yet final.

  ---

  ### Triptych: On Whitehead's Rhythms  

  **I. Romance**  
  First, the ungoverned green: a vine’s blind reach across the wall,  
  the damp scent of turned earth clinging to your palm,  
  the calculus of rain observed in puddles, not in books—  
  this pulsing world insists itself, unasked, into your grasp.  
  You trace the beetle’s iridescent back, not knowing *order*,  
  only the shock of blue against wet bark, the crumpled  
  velvet of a petal, how heat shimmers above the stone at noon.  
  No names yet bind these things; they simply *are*,  
  and being, flood the mind with unsorted fire.  
  *This is how we learn*—a breath caught in the throat.  

  **II. Precision****  
  Scales. Calipers. The lens.  
  Pare the bloom to labelled parts:  
  *stamen, sepal, vein*.  
  Define the angle of the leaf’s  
  descent. Map root-tendrils’  
  pale, precise advance.  
  Discard the haze of scent. Contain  
  the wet earth’s dark in *ph levels*,  
  grids. The beetle? *Order Coleoptera*.  
  Structure charts the flux. *This is how we learn*—  
  a clean incision, dry.  

  **III. Generalisation**  
  Abstraction is achieved.  
  Relations are deduced.  
  The concrete instance  
  is subsumed.  
  The patterned whole  
  is understood.  
  Particulars recede.  
  Vitality is rendered  
  as inert example. Synthesis  
  is stated. *This is how we learn*.  

  ---

  ### Philosophical Execution  
  - **Romance**: Enjambment ("wall,/ the damp scent"; "crumpled/ velvet") mimics overflow of experience. Sensory verbs ("trace," "clinging," "flood") embody prehension.  
  - **Precision**: Short lines constrain; internal rhyme ("vein/contain," "parts/charts") and technical terms (*Coleoptera*, *ph levels*) mirror analysis. "Dry" verdict contrasts with romance’s "breath."  
  - **Generalisation**: End-stopped lines isolate concepts. Passive voice ("is achieved," "is subsumed," "is rendered") enacts detachment. Diminishing line-length implies evaporation. The refrain’s lack of punctuation in Section 3 signifies ritual emptiness.  
  - **Unresolved Tension**: Romance’s sensory verbs ("pulsing," "flood") haunt the later sections. Precision’s tools ("Scales. Calipers.") are abandoned. Generalisation’s "understood" feels sterile—yet the cycle’s return is hinted by the earth’s persistence ("dark," "instance"). Whitehead’s risk—that synthesis forgets its roots—is palpable, but not decreed as inevitable. The rhythms echo; whether they renew remains open.
