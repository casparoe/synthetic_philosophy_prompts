answer: |-
  ### Exam Question  
  **PARTITIONED PRIORS AND THE SCALE ARGUMENT FOR INSECT SENTIENCE**  
  The "scale argument" for insect moral status suggests that even a minuscule prior probability of sentience per insect, multiplied by the vast number of insects (~10^19), yields significant aggregate expected suffering. However, critics propose partitioning the reference class: rather than applying a flat prior to all insects, we should condition on the presence of specific neural architectures (e.g., recurrent processing loops and centralized nociceptive integration). This reduces the reference class to ~10^12 organisms but may raise the conditional prior probability of sentience *within* that subset.  

  In an essay of ~900 words, address the following:  
  1. **Reconstruct** the unpartitioned scale argument with formal precision, explaining how the trade-off between low prior probability and high population size generates large expected moral weight.  
  2. **Evaluate** whether partitioning based on neural architecture is epistemically justified, or if it surreptitiously assumes a functionalist theory of consciousness.  
  3. **Analyze** the moral-risk asymmetry: partitioning reduces aggregate expected suffering (by shrinking the reference class) but increases confidence in sentience per individual in the partitioned class. Does this strengthen or weaken the practical case for intervention? Justify your answer.  
  4. **Determine** whether the scale argument’s force depends on treating sentience as binary (present/absent) or graded (a matter of degrees). Explain why this distinction alters the expected-value arithmetic.  

  Argue from first principles. Do not cite specific authors, texts, or dates.  

  ---

  ### Model Answer (750 words)  

  #### 1. Reconstruction of the Unpartitioned Argument  
  The unpartitioned scale argument formalizes expected moral weight (*EMW*) as:  
  *EMW* = *N* × *P(S)* × *M*  
  Where *N* ≈ 10^19 (total insects), *P(S)* is the prior probability of sentience per insect, and *M* is the moral weight per sentient insect. Crucially, *P(S)* is deemed extremely low (e.g., 10^−12) due to insects’ minimal neural complexity. Yet because *N* is astronomically high, *N* × *P(S)*—the expected number of sentient insects—remains substantial (e.g., 10^7). If *M* > 0, *EMW* becomes non-negligible, demanding moral consideration. The argument exploits inverse proportionality: *P(S)* can approach zero yet *EMW* remains significant if *N* scales compensatorily.  

  #### 2. Epistemic Justification vs. Functionalist Smuggling  
  Partitioning restricts the reference class to insects with architectures *A* (e.g., recurrent processing), updating the expected moral weight to:  
  *EMWₚ* = *Nₐ* × *P(S|A)* × *M*  
  Where *Nₐ* ≈ 10^12 (insects with *A*), and *P(S|A)* > *P(S)*. Proponents argue this is epistemically rigorous: conditioning on *A* acknowledges that sentience likely requires specific causal structures, avoiding false positives from neural disanalogues (e.g., reflexive nociception without integration).  

  However, partitioning covertly assumes functionalism. Defining *A* as "recurrent processing" or "centralized integration" presumes that these structures *implement* conscious integration—a functional role. This is not a neutral observation but a theoretical claim. Alternative theories (e.g., panpsychism, emergentism) reject that consciousness necessitates such architectures; partitioning thus privileges functionalism by excluding architectures deemed non-conscious *by fiat*. Crucially, the burden of proof lies on proponents to demonstrate why *A* is a reliable indicator of sentience without presupposing that consciousness *just is* certain computations. Without this, partitioning risks circularity: it assumes a functionalist ontology to "detect" sentience functionally.  

  #### 3. Moral-Risk Asymmetry: Intervention Implications  
  Partitioning creates a risk asymmetry:  
  - **Aggregate risk decreases**: *Nₐ* < *N* and *P(S|A)* may not fully compensate, lowering *EMWₚ* (e.g., 10^12 × 10^−6 = 10^6 vs. 10^19 × 10^−12 = 10^7).  
  - **Per-individual confidence increases**: *P(S|A)* >> *P(S)*, making sentience claims about insects with *A* more robust.  

  This asymmetry *weakens* the case for broad interventions (e.g., pesticide bans) but *strengthens* targeted ones. Reducing aggregate *EMW* diminishes the expected utility of mass interventions, especially given costs to human welfare (e.g., crop losses). However, higher per-individual confidence justifies prioritizing insects with *A* (e.g., bees over springtails) in contexts with low intervention costs (e.g., lab research ethics). The asymmetry thus refines—not abolishes—intervention: it shifts focus from indiscriminate precaution to architecturally targeted measures, balancing moral urgency against practical constraints.  

  #### 4. Binary vs. Graded Sentience  
  The scale argument’s force hinges on sentience being **graded**. Binary views treat *P(S)* as the probability that an insect is "sentience-positive." Here, partitioning only rescales *N* × *P(S)*, leaving the argument intact if *EMWₚ* remains significant.  

  Graded sentience, however, dissolves the low-*P*/high-*N* trade-off. Sentience becomes a spectrum: insects with *A* may possess *higher-degree sentience* (*Mₐ*), while others have *lower-degree* (*Mₙ*). The equation updates to:  
  *EMW* = [*Nₐ* × *P(S|A)* × *Mₐ*] + [*(N − Nₐ)* × *P(S|¬A)* × *Mₙ*]  
  Even if *P(S|¬A)* is negligible, *Mₙ* > 0 for "weak" sentience (e.g., proto-phenomenal qualities). *N − Nₐ* ≈ 10^19 remains vast, so *EMW* could still be dominated by the *¬A* class if *Mₙ* is non-trivial. Partitioning thus fails to mitigate moral risk unless we assume *Mₙ* ≈ 0—which presumes a binary threshold. Only by accepting gradedness can partitioning meaningfully reduce expected suffering, as it concentrates weight on entities with higher *M*.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **1. Reconstruction of Unpartitioned Argument** (4 pts)  
  - **A (4)**: Derives *EMW* = *N* × *P(S)* × *M*; explains compensatory scaling.  
  - **B (3)**: States formula but misses inverse proportionality logic.  
  - *Common error (costs 1 pt)*: Omitting moral weight (*M*) or treating *N* × *P(S)* as sufficient without moral significance.  

  **2. Evaluation of Partitioning** (5 pts)  
  - **A (5)**: Identifies functionalist presupposition in defining *A*; notes circularity risk.  
  - **B (3-4)**: Describes partitioning but doesn’t expose functionalist commitment.  
  - *Common error (costs 1-2 pts)*: Accepting neural criteria as empirically neutral without epistemic critique.  

  **3. Analysis of Risk Asymmetry** (5 pts)  
  - **A (5)**: Shows how asymmetry shifts intervention strategy (targeted vs. broad).  
  - **B (3-4)**: Notes reduced aggregate vs. increased confidence but treats implications as obvious.  
  - *Common error (costs 1 pt)*: Claiming partitioning "obviously" weakens/strengthens intervention without weighing trade-offs.  

  **4. Binary vs. Graded Sentience** (4 pts)  
  - **A (4)**: Demonstrates how gradedness alters EMW arithmetic; links to *Mₙ* > 0.  
  - **B (3)**: Contrasts binary/graded but doesn’t formalize implications for *EMW*.  
  - *Common error (costs 1 pt)*: Asserting binary/graded stance without changing the expected-value calculation.  

  **Coherence** (2 pts)  
  - **A (2)**: Seamless integration of all four parts; consistent terminology.  
  - **B (1)**: Disjointed sections; key concepts (e.g., *EMW*) redefined inconsistently.  

  ---  
  **Rationalist Emphasis**: Top answers (16-20) will formalize key moves (e.g., *EMWₚ* derivation), expose hidden premises (e.g., functionalism in *A*), and resist reciting dogma. B-range responses (12-15) often accept partitioning uncritically or overlook how graded sentience disrupts the scale argument’s structure.
