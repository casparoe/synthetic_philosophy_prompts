answer: |-
  ### Havenbrook Planning Code Role-Play: Chesterton's Fence in Action  
  **Time:** 60 minutes  
  **Participants:** 14 undergraduates  
  **Goal:** Illustrate Chesterton’s fence (epistemic asymmetry in reforming rules) and Burkean conservatism through experiential learning. No pre-reading required.  

  ---

  ### **Setup & Rules**  
  **Setting:** The fictional coastal town of Havenbrook, plagued by sporadic flooding, erosion, and rare bird habitats. Students inherit its 5 bizarre planning bylaws. Rules appear arbitrary but have hidden ecological/structural interdependencies.  

  #### **The Rules**  
  1. **Coastal Buffer Rule:** No construction within 50 metres of the shoreline.  
  2. **Roof Pitch Rule:** All roofs must have a 30-degree slope.  
  3. **Rain Tank Rule:** Every property must install a 1,000-litre rainwater tank.  
  4. **Tree Replacement Rule:** Cutting down one tree requires planting two of the same species.  
  5. **Blue Signage Rule:** Street signs must be blue with white lettering.  

  #### **Hidden Interdependencies** (Revealed only in "consequence round"):  
  - Scrapping **Rule 1** ➔ Worsens coastal erosion, undermining foundations of properties *and* overflowing rainwater tanks (Rule 3).  
  - Scrapping **Rule 2** ➔ Flat roofs collapse under heavy rain, blocking emergency access *and* increasing flood damage (synergistic with Rule 1/3).  
  - Scrapping **Rule 3** ➔ Floods overwhelm drainage, contaminating water *and* killing tree saplings (Rule 4).  
  - Scrapping **Rule 4** ➔ Soil erosion destabilises roads, obscuring signage (Rule 5) *and* increasing flood risk.  
  - Scrapping **Rule 5** ➔ Non-blue signs fade in coastal air, confusing emergency services *and* delaying flood responses.  

  ---

  ### **Roles & Information Asymmetry**  
  Split into **7 Reformers** and **7 Stewards**. Assign randomly.  

  #### **Reformers**  
  - **Goal:** Scrap rules to attract investment and "modernise" Havenbrook.  
  - **Incentive:** Gain **2 reputation points** per rule scrapped. Lose **5 points** per rule whose removal causes harm (revealed later).  
  - **Information:** No historical context. Told: *"These rules are bureaucratic relics. Havenbrook’s economy is stagnating—simplify the code!"*  

  #### **Stewards**  
  - **Goal:** Defend rules to "preserve communal stability."  
  - **Incentive:** Gain **2 reputation points** per rule kept. Lose **3 points** per rule scrapped that causes harm. Gain **+3 bonus points** if they correctly cite a fragment that later proves relevant.  
  - **Information Asymmetry:**  
    - Only 4/7 receive **fragment cards** with partial, orphaned clues (unknown to others).  
    - Fragments are ambiguous/incomplete; reasons were lost generational turnover.  
    - **Fragment Cards:**  
      - Steward A: *"Rule 1: After the ’37 storm, old man Higgins’ house washed away."*  
      - Steward B: *"Rule 2: Slate roofs cracked in the ’55 freeze."*  
      - Steward C: *"Rule 3: The breweries ran dry in the ’62 drought."*  
      - Steward D: *"Rule 4: Lady Whitby’s garden birds vanished when elms were felled."*  
    - 3 stewards get **no fragments** (defending Rules 2, 4, and 5 with zero context—truly orphaned).  

  ---

  ### **Timeline**  
  **Total: 60 mins**  
  1. **Introduction (5 mins):**  
     - Explain Havenbrook, roles, rules, and scoring. Emphasise: *"You’re voting on real consequences—no do-overs."*  
     - Assign roles/fragments via pre-prepared cards.  

  2. **Group Prep (5 mins):**  
     - Reformers and Stewards separate. Stewards share fragments (if they wish).  
     - **Reformer task:** Pick 2-3 rules to target. Plan arguments (e.g., *"Rain tanks cost too much!"*).  
     - **Steward task:** Strategise using fragments (e.g., *"’37 storm’ might mean Rule 1 matters"*). Those without fragments must intuit defences.  

  3. **Debate & Vote (30 mins):**  
     - Facilitator presents rules **one by one**. For each:  
       - **2 mins:** Reformers argue for scrapping (focus: cost/pointlessness).  
       - **2 mins:** Stewards argue for keeping (may use fragments—but *cannot invent reasons*).  
       - **1 min:** Open debate.  
       - **Vote:** Secret ballot (pens/scrap paper). Majority decides. Record results visibly.  
     - **Rules order:** 1 → 3 → 5 → 2 → 4 (avoids obvious clues).  

  4. **Consequence Round (10 mins):**  
     - For each scrapped rule, facilitator reveals:  
       - **Immediate effect:** (e.g., *"Rule 3 scrapped: Cheaper builds! Economy +!"*).  
       - **Hidden consequence:** (e.g., *"But heavy rain floods drains, killing new trees (Rule 4)."*).  
     - Award/lose points publicly.  

  5. **Scoring & Debrief (10 mins):**  
     - Tally reputation points. No prizes—focus on reflection.  
     - **Debrief questions:**  
       - *"When did you feel certain about a rule? How did that change?"*  
       - *"Stewards: How did fragments help/hinder? Reformers: What felt unfair?"*  

  ---

  ### **Key Teaching Moments**  
  **Map to Burke/Chesterton:**  
  - **Chesterton’s fence (epistemic asymmetry):** Fragments = partial "fence" knowledge. Reformers knocked rules down cheaply; consequences revealed the *cost* of rediscovery.  
  - **Burkean "social contract":** Stewards embodied intergenerational duty. Losing fragments showed how institutional wisdom erodes.  
  - **The "orphaned" element:** Rules 2 and 5 had zero fragments—highlighting Chesterton’s "mystery" vs. true "orphaning" (reasons lost entirely).  

  **What the Game Can’t Capture:**  
  - **Burke’s "organic growth":** Real traditions evolve slowly; this game compresses change into instant votes.  
  - **"Good" obsolescence:** In reality, *some* rules *are* pointless—but here, all have hidden roles (by design).  

  ---

  ### **Predictable First-Time Issues**  
  1. **Reformers dominate early:** Rules seem silly—students vote to scrap 4-5/5, causing catastrophic consequences. *Use this!* It proves Chesterton’s point.  
  2. **Steward frustration:** Those without fragments struggle to argue. *Debrief tip:* Ask, *"How did it feel defending rules blindly?"*  
  3. **Fragment underuse:** Students may not share clues. *Mitigation:* Remind stewards, *"Your fragments are town heritage—use them!"*  
  4. **Time pressure:** Debate may run long. *Facilitator script:* *"Wrap up—we vote in 60 seconds!"*  

  ---

  ### **Materials Checklist**  
  - **Role cards:** 7 reformer, 7 steward (include incentives).  
  - **Fragment cards:** 4 with clues (Rules 1, 2, 3, 4), 3 blank (for orphaned Rules 2, 4, 5).  
  - **Rule sheets:** All 5 rules printed for every student.  
  - **Voting:** Ballot papers/pens.  
  - **Consequence cheat sheet:** Facilitator-only (hidden until round 4).  

  **Final Note:** Embrace chaos! The more rules scrapped, the clearer Chesterton’s warning becomes: *"Don’t remove a fence until you know why it was built."*
