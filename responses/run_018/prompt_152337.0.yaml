prompt: |-
  i'm giving a talk next thursday to a mixed audience — mostly analitic moral philosophers who think collective responsibility is conceptually confused, plus two historians who actually study Jaspers' four kinds of guilt, and one legal scholar who writes on corporate liability. my thesis is that Jaspers' four categories don't cover generational transmission properly, so i'm proposing a fifth category — call it instituional continuity guilt — that applies when state institutions persist through regime change but carry obligations from prior wrongs. i argue only this fifth kind can be inherited across generations without collapsing into collective punishment; moral and metaphysical guilt stay strictly personal, political guilt attaches to citizens of the offending regime but dies with the regime's legal continuity.

  draft my q&a prep sheet: the objections i'll actually get, ordered by how much damage they'd do. phrase them the way these people talk — the analytic philosophers with their conceptual hygiene worries, the historians charging that i've misread Jaspers, the lawyer with analogies to corporate succession. for each, give me a two-minute reply, flag where it's soft, and tell me what i should concede right up front. include the one question i'm praying nobody asks — probably about whether this justifies reparations to groups that didn't exist at the time of the harm. take a definite stance on which objections are fatal and which are just noisy; don't just list possibilities and leave me hanging. be committed: say which ones i should actually worry about and which ones are distractions.
reasoning: |-
