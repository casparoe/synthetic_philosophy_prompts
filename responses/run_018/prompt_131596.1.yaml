answer: |-
  Here is a comprehensive list of desiderata for a theory of phenomenal combination, built from first principles with your specified emphases. Desiderata are categorized by type, with motivations, non-negotiables flagged (★), and tensions highlighted.

  ---

  ### **I. Core Combination Requirements (Non-Negotiables)**  
  *(Without these, the theory fails to address the combination problem or collapses into eliminativism/brute emergence)*  

  1. **★ Macro-Phenomenal Reality**  
     *Motivation*: Must account for the existence of unified macro-consciousness (e.g., your experience of reading this sentence) as ontologically real, not illusory.  
     *Non-negotiable*: Denial reduces to eliminativism; failure to secure this makes combination irrelevant.  

  2. **★ Non-Emergent Grounding**  
     *Motivation*: Macro-phenomenal properties must be *constituted* by micro-phenomenal properties without brute "phenomenal leaps" (e.g., explaining human consciousness without magical emergence from non-experiential quarks).  
     *Non-negotiable*: Violation implies brute emergence, contradicting panpsychism's core motivation.  

  3. **★ Micro-Macro Covariance**  
     *Motivation*: Changes in micro-structure must correspond to changes in macro-experience (e.g., neural damage altering consciousness).  
     *Non-negotiable*: Without covariance, micro-phenomenality is epiphenomenal or irrelevant.  

  4. **★ Unity Without Homunculi**  
     *Motivation*: The macro-subject must be a single locus of experience (e.g., hearing and seeing a bird as unified), not a committee of mini-subjects.  
     *Non-negotiable*: Failure implies the "subject-summing problem" unsolved, leaving combination incoherent.  

  ---

  ### **II. Structural Constraints**  
  *(Essential but negotiable in implementation; violations risk incoherence)*  

  5. **Physical Consistency**  
     *Motivation*: Combination mechanisms must respect physical laws (e.g., no telepathic bonding violating causal closure).  
     *Negotiable*: Some cosmopsychists may reject causal closure; constitutive panpsychists typically demand it.  

  6. **Compositional Specificity**  
     *Motivation*: Why do *these* micro-entities combine into *this* macro-subject? Must avoid arbitrary boundaries (e.g., why my brain’s neurons form "me" but not my brain plus my chair).  
     *Tension*: Conflicts with "phenomenal overlap" if boundaries are fuzzy.  

  7. **Asymmetry of Binding**  
     *Motivation*: Micro-entities must "bind" more strongly to their actual macro-subject than to others (e.g., my neurons bind to my consciousness, not yours).  
     *Negotiable*: Priority cosmopsychism might reject this via top-down dependence.  

  ---

  ### **III. Your Specified Pressure Points**  
  *(Treated as core requirements)*  

  8. **★ Diachronic Continuity Through Turnover**  
     *Motivation*: Brains replace molecules constantly, yet macro-consciousness persists (e.g., "you" over a decade). Must explain continuity without a static core.  
     *Non-negotiable*: Failure implies illusory personal identity or hidden substrates.  
     *Conflict*: With "silent partners" if inactive constituents break continuity.  

  9. **★ Phenomal Overlap Resolution**  
     *Motivation*: If micro-constituents are shared (e.g., Siamese twins sharing a liver), must either:  
     - (a) Allow overlapping experiences (e.g., shared organ causing shared qualia), with rules to avoid chaotic blending, OR  
     - (b) Explain why no overlap occurs (e.g., contextual activation).  
     *Non-negotiable*: Unaddressed, this collapses into boundary problems or experiential contradictions.  

  10. **★ Silent Partner Constraint**  
      *Motivation*: Micro-entities in a system need not always contribute phenomenally (e.g., inactive neurons in sleep). Must prevent "phenomenal spam" (zillions of redundant micro-experiences).  
      *Non-negotiable*: Without this, combination is implausibly noisy and resource-intensive.  
      *Conflict*: With diachronic continuity if inactive constituents threaten persistence.  

  ---

  ### **IV. Explanatory & Conceptual Cohesion**  
  *(Camp-specific preferences)*  

  11. **Minimal Brute Facts**  
      *Motivation*: Avoid positing fundamental "binding laws" with no further explanation (e.g., "phenomenal bonding" as primitive).  
      *Preference*: Constitutive panpsychists demand this; cosmopsychists may accept top-down bruteness.  

  12. **No Macro-Primitives**  
      *Motivation*: Must not smuggle in irreducible macro-level mechanisms (e.g., a "unifying field" beyond micro-properties).  
      *Preference*: Core to constitutive panpsychism; rejected by cosmopsychism.  

  13. **Phenomenal Economy**  
      *Motivation*: Prefer theories minimizing redundant or inactive phenomenality. Supports "silent partners."  
      *Preference*: Optional but desirable for parsimony.  

  ---

  ### **Key Tensions & Suspected Incompatibilities**  
  - **Diachronic Continuity + Silent Partners**: If constituents toggle activity, how is continuity maintained without a persistent macro-binder? A theory might appeal to *structural or functional persistence* (e.g., a dynamic pattern preserving identity), but this risks macro-primitives.  
  - **Phenomenal Overlap + Asymmetry**: Permitting overlap threatens subject boundaries; forbidding it requires strict rules for micro-constituent "loyalty" that may conflict with physical sharing.  
  - **Minimal Brute Facts + Unity**: Avoiding brute bonds may necessitate structural solutions (e.g., isomorphic information), but these often fail to explain *why* structure generates unity.  

  ---

  ### **Briefly on Major Camps**  
  - **Constitutive Panpsychism**: Struggles with **diachronic continuity** (if micro-constituents turnover) and **unity** (without brute bonding). **Silent partners** are easier via functional role theories.  
  - **Cosmopsychism**: Handles **continuity** via a stable cosmic subject but falters on **micro-macro covariance** (why *this* brain’s experience?) and **asymmetry**. **Phenomenal overlap** is often ignored or primitive.  

  Your "silent partner + continuity" tension is acute: Avoiding macro-binders likely requires a **pattern-based account** where the *form* of micro-relations (not the constituents) grounds persistence, but this risks structuralism’s explanatory gaps. This list isolates where innovations must occur.
