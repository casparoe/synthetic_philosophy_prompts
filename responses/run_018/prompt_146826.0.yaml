  For planners, emphasize that critical history isn't anti-history but a practical tool. They need to feel empowered to use historical insights without being bogged down by irrelevant precedents. 

  The joke about the flood wall monument needs to land for both sides. Historians might appreciate the critique of monumentalizing failures, while planners relate to ineffective infrastructure projects. The awkwardness could come from the irony of celebrating failure, which both groups can laugh at. 

  Structure-wise: Start with a warm welcome, introduce the theme, present the three modes plainly, explain each mode's pitfalls and strengths, then pivot to critical history as the solution. Use the joke as a transition. End with a call to collaborate, framing the workshop as a joint effort. 

  Need to avoid academic jargon. No page numbers, keep it conversational. Balance critique with appreciation. Ensure neither group feels blamed. Highlight that both disciplines are essential, but the approach needs adjustment for current challenges. 

  Also, the speech should be around five minutes, so conciseness is crucial. Each section must be brief but impactful. The joke should be placed where it lightens the mood but reinforces the point about monumental history's dangers. 

