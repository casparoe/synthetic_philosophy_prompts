  The user wants to critique monumental history for creating misleading heroic narratives, antiquarian history for paralyzing action by making archives untouchable, and promote critical history as the way to discard failed precedents. But they can't dismiss the historians' work outright. Also, there's a request for an awkward joke about a monument to an ineffective flood wall.

