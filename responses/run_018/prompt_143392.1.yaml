answer: |-
  ### Decision Tree for Normative Positions on Discounting Future Welfare

  **Root Node:**  
  *Question:* "Ought present welfare to carry intrinsic priority over identically sized future welfare solely because of its temporal location?"  
  - **Yes** → Proceed to Node A  
  - **No** → Proceed to Node B  

  ---

  **Node A** (after "Yes" at root):  
  *Question:* "Is pure temporal location bias normatively valid?"  
  - **Yes** → **Leaf: Rationalist pure-time-preference view** (Endorses exponential discounting as normatively valid)  
  - **No** → **Leaf: Descriptive hyperbolic-discounting position** (Denies normative authority; accepts descriptive bias but rejects it as a justification)  

  **Node B** (after "No" at root):  
  *Question:* "Is the welfare of future generations fully comparable to that of the present generation?"  
  - **No** → **Leaf: Intergenerational non-identity constraint** (Rejects comparative harm across generations)  
  - **Yes** → Proceed to Node C  

  **Node C** (after "Yes" at Node B):  
  *Question:* "Ought future welfare to be discounted for any non-temporal reason?"  
  - **No** → **Leaf: Sidgwick-style universalism** (Zero pure rate; no discounting)  
  - **Yes** → Proceed to Node D  

  **Node D** (after "Yes" at Node C):  
  *Question:* "What is the primary normative justification for discounting?"  
  - **Epistemic uncertainty about distant outcomes** → **Leaf: Risk-premium-only view** (Discounts solely for outcome uncertainty)  
  - **Analogy to spatial distance** → **Leaf: Future selves as strangers** (Partiality account; analogizes intertemporal choice to interpersonal altruism)  
  - **Continuity of personal agency across time** → *Unoccupied* (No corresponding leaf; see diagnosis below)  

  ---

  ### Full Logical Space of Answer Combinations
  | Path | Root (Q1) | Node B (Q2) | Node C (Q3) | Node D (Q4) | Terminal Leaf | Occupied? |
  |------|-----------|-------------|-------------|-------------|---------------|-----------|
  | 1    | Yes       | —           | —           | —           | Rationalist pure-time-preference | ✓ |
  | 2    | Yes       | —           | —           | —           | Descriptive hyperbolic | ✓ |
  | 3    | No        | No          | —           | —           | Non-identity constraint | ✓ |
  | 4    | No        | Yes         | No          | —           | Sidgwick universalism | ✓ |
  | 5    | No        | Yes         | Yes         | Uncertainty | Risk-premium-only | ✓ |
  | 6    | No        | Yes         | Yes         | Spatial     | Future selves as strangers | ✓ |
  | 7    | No        | Yes         | Yes         | Continuity  | *Unoccupied* | ✗ |

  ---

  ### Diagnosing Unoccupied Cells
  1. **Continuity of personal agency → Unoccupied**  
     - **Diagnosis**: **Incoherence**. Continuity of agency (e.g., Parfitian psychological connectedness) typically *reduces* grounds for discounting by affirming shared identity over time. Using it to *justify* discounting contradicts its core purpose, making this combination unstable. The literature lacks a view that coherently ties continuity to normative discounting.

  2. **Pure time preference + Non-identity rejection → Unoccupied**  
     - **Path**: Root=Yes + Node B=No (not traversible in tree).  
     - **Diagnosis**: **Neglect**. A view endorsing intrinsic temporal priority *and* non-identity comparability rejection is logically possible but empirically absent. Theorists avoid combining these: non-identity (e.g., Parfit) undermines obligations to future generations, while pure time preference *assumes* such obligations exist. No major school reconciles them.

  ---

  ### Ambiguous Separation: Spatial Analogy vs. Risk-Premium
  - **Spatial-analogy view** (Future selves as strangers) and **Risk-premium-only view** are separated cleanly at Node D (Q4).  
  - **Why flag?** Both appeal to "distance" (spatial/temporal), risking conflation. However:  
    - Spatial analogy treats temporal distance as *ethically analogous* to spatial separation (implying partiality).  
    - Risk-premium relies on *epistemic limitations* (uncertainty increases with time).  
  - **Tree handles it?** Yes. Node D forces a choice: if uncertainty is primary → risk-premium; if analogy to distance → spatial view. No overlap.  

  ---

  ### Key Notes
  - **Tree Completeness**: Covers all six required leaves with 5 decision nodes (root + 4 internal).  
  - **Pure Time Preference + Non-Identity**: Cannot coexist in the tree’s structure (root=Yes skips Node B). The unoccupied combination stems from neglect—no influential theory endorses both.  
  - **Formal Framing**: All questions avoid conflation with instrumental discounting (e.g., opportunity cost) by focusing on *intrinsic justifications*.  

  This tree enables students to classify positions by affirming/rejecting concrete claims, maps the logical landscape, and highlights conceptual tensions in intertemporal ethics.
