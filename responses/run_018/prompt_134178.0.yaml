  Hmm, this feels familiar. I recall the "Bradley's Regress" problem from metaphysics. That's exactly about the infinite regress when you try to explain how things relate by adding more connectors. But the user is pointing out the specific move where people avoid the regress by redefining the connector as internal. That's the pivot they're talking about.

  The user seems philosophically inclined, using examples from sentences, collectives, and systems. They're probably familiar with basic concepts but want a precise term for this rhetorical shift. They might be frustrated seeing this in debates without a clear way to call it out.

  They also want to distinguish this from simple equivocation. So I need to explain how this is a specific pattern within the problem of composition. The key is that the pivot happens exactly when the regress threat appears. 

  For a name, "binding pivot" captures the moment of switching from external to internal. "Compositional regress evasion" is more academic. But "binding pivot" is snappier and descriptive.

