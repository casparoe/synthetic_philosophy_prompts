answer: |-
  ## Brainstorming Key Tension
  *   **Temporal Neutrality:** Moral imperative: welfare of future individuals matters equally regardless of *when* they exist. Discounting merely for time-distance is ethically arbitrary bias ("tyranny of the present").
  *   **Pure Time Preference (δ):** A positive δ explicitly discounts future welfare *because* it's future. Rejected by temporal neutrality advocates.
  *   **Existential-Risk Adjustment (Component 3):** Discounts future welfare *not* because it's distant in time, but because there's a probability (p_risk) that those future people/welfare *won't exist at all* (e.g., human extinction). Claims moral high ground: it's about *contingency of existence*, not *time*.
  *   **The Tension:**
      *   *Does (3) genuinely avoid the temporal bias objection?* It seems different: discounting for *actual non-existence* vs *mere futurity*.
      *   *Or is it a backdoor bias?* Probability of extinction (p_risk) is *itself* highly time-dependent. p_risk(2100) >> p_risk(2050) >> p_risk(2025). Thus, discounting via p_risk *implicitly* discounts more for the farther future – replicating the *effect* (and arguably the *moral character*) of pure time preference, just with a "risk" justification. Is the distinction between "discounting because it's far" and "discounting because the probability of non-existence increases with distance" coherent and morally significant?

  ---

  ## Essay Question (90-minute Exam)

  **Climate policy models employing the standard decomposition of the social discount rate often include an 'existential-risk adjustment' factor. This factor downweights the welfare of people in the far future, not because that welfare occurs at a distant point in time, but because there is a non-zero probability that those specific people (or humanity itself) will never come to exist.**

  **Critically evaluate whether this existential-risk adjustment component genuinely avoids the core moral objection to pure time preference, or whether it merely reintroduces a form of temporal bias through the back door. In your answer, confront the conceptual distinction between discounting due to the 'distance in time' per se and discounting due to the 'probability of non-existence' increasing over time. Is this distinction robust enough to sustain the moral claim that the risk adjustment is fundamentally different from pure time preference?**

  ---

  ## Model Answer (Approx. 700 words)

  The existential-risk adjustment (Component 3) in climate discounting models presents a fascinating challenge to the principle of temporal neutrality, which rejects discounting future welfare purely due to its temporal location. Proponents argue it avoids the ethical pitfalls of pure time preference (δ > 0, Component 1), but a closer look reveals a significant tension: it may achieve a similar *discounting effect* over time through probabilistic means, potentially smuggling temporal bias back in.

  The core moral objection to pure time preference (δ) is straightforward from a temporal neutrality standpoint: it violates the ethical principle that the well-being of individuals matters equally irrespective of *when* they live. Discounting simply because benefits occur later unfairly privileges current generations, lacks a sound ethical justification ("Why care less just because it's Tuesday next century?"), and can lead to reckless underinvestment in long-term projects like climate mitigation. This objection targets the *direct* use of time-distance as a discounting reason.

  The existential-risk adjustment seems to offer an ethically cleaner alternative. Its justification hinges on the *contingency of existence*, not the *passage of time*. If there's a 1% per century probability of a civilisation-ending catastrophe, then welfare projected for 2200 should be weighted by the probability (0.99^2 ≈ 0.98) that humanity *exists* to experience it. Crucially, proponents argue this isn't devaluing *future* welfare *because* it's future; it's acknowledging that *nonexistent entities* have no welfare claims. This resonates with the "person-affecting" view: we only have obligations to potential future people if they *actually* come into existence. Discounting here is presented as a technical adjustment for risk, akin to insuring against non-delivery, fundamentally distinct from an ethical preference for the present.

  However, the critical challenge lies in the intrinsic link between the probability of non-existence and time. The cumulative probability of a low-probability, high-impact existential risk *inevitably increases* with the time horizon. Even a constant annual risk rate (λ) means the survival probability S(t) = e^(-λt) decays exponentially over time. Consequently, discounting future welfare by S(t) produces a discount factor that *falls exponentially as time increases*. This functional form is mathematically identical to the discounting produced by a positive pure time preference rate (δ). The *effect* on the valuation of long-term costs and benefits is indistinguishable: welfare in the far future is dramatically downweighted compared to the near future or present.

  This raises the decisive question: **Is the conceptual distinction between "discounting for time-distance" (δ) and "discounting for increasing probability of non-existence over time" robust enough to sustain the claim that the risk adjustment avoids temporal bias?** The argument for distinction relies entirely on the *justification* – risk vs preference. But if the *practical outcome* and the *driving mechanism* (the passage of time causing the discount factor to shrink) are functionally identical, the moral distinction becomes precarious. The risk adjustment effectively tells beneficiaries in 2300: "We value your potential welfare less than that of people in 2100, not intrinsically because you live later, but because the *chance you won't exist* is higher than theirs." Yet, the *reason* their chance of non-existence is higher *is solely the greater passage of time*. This looks suspiciously like temporal bias rationalised through probabilistic language – a distinction without a morally relevant difference in outcome or underlying cause. The "back door" is the inescapable mathematical coupling of cumulative risk and time.

  Furthermore, the appeal to the person-affecting view or the non-identity problem (potential future people aren't "harmed" by extinction in the same way existing people are) doesn't fully resolve this. Temporal neutrality often adopts an *impersonal* perspective: we should strive for a better future world overall, irrespective of *which* specific individuals inhabit it. From this view, discounting a *possible* future state of high welfare because of the risk it *might not happen* is different from intrinsically valuing that state less *because* it's temporally distant. However, when the risk is purely a function of time, the impersonal view must still grapple with whether downweighting potential futures exponentially due to time-linked risk constitutes an *acceptable* form of differential treatment, or whether it functionally reinstates the ethically problematic discounting of the far future that temporal neutrality seeks to avoid.

  In conclusion, while the existential-risk adjustment offers a seemingly principled alternative to pure time preference based on the logic of contingency, its dependence on time-increasing probabilities creates a profound tension. It generates discounting behaviour mathematically and practically equivalent to δ > 0, driven fundamentally by the passage of time. This makes it difficult to convincingly argue that it fully escapes the core moral objection to temporal bias. The distinction between discounting for risk and discounting for time collapses when the risk itself is inherently and unavoidably temporal. Component 3, therefore, risks being not a solution to the ethical problem of pure time preference, but rather its sophisticated, probabilistic doppelgänger.

  ---

  ## Marking Scheme (Total: 20 Marks)

  **Must-Hit Moves:**

  1.  **Articulate the Moral Objection to Pure Time Preference (δ) (4 marks):**
      *   **A:** Clearly, concisely explains temporal neutrality and the ethical argument against δ (unfair privileging of present, lack of justification, violation of equal consideration) *in the context of future generations*. Links it directly to the rejection of "distance in time" as a valid discounting reason.
      *   **B:** States the objection but lacks depth on the ethical reasoning or fails to explicitly connect it to the rejection of time-distance per se. Might be overly simplistic.
      *   **Typical Mistake:** Confusing δ with the elasticity component (ηg) or inequality aversion; merely stating δ is controversial without explaining *why* ethically.

  2.  **Explain the Justification for the Existential-Risk Adjustment (Component 3) (4 marks):**
      *   **A:** Accurately presents the argument: discounts for *probability of non-existence*, not time; links to contingency of welfare recipients ("no obligation to nonexistent beings"); frames it as a risk adjustment distinct from ethical time preference. Mentions person-affecting/non-identity concerns if relevant.
      *   **B:** Describes what Component 3 *does* (downweights far future due to risk) but doesn't fully articulate the *moral justification* for why this is distinct from δ. May conflate it with general uncertainty.
      *   **Typical Mistake:** Misrepresenting Component 3 as discounting for time; conflating it with catastrophic *damage* to existing future people rather than *non-existence*; failing to separate the *justification* from δ.

  3.  **Demonstrate the Time-Dependency of the Risk & Its Discounting Effect (4 marks):**
      *   **A:** Explicitly shows *how* cumulative extinction risk inevitably increases over time (even with constant hazard rate), leading to exponentially decaying survival probability S(t). Clearly links this to producing discounting *mathematically equivalent* to δ>0 in effect/functional form. Uses terms like "cumulative probability", "exponential decay", "time horizon".
      *   **B:** States that risk increases with time but doesn't explain *how* or *why* this leads to discounting. Fails to connect the mathematical form to the equivalence with δ.
      *   **Typical Mistake:** Ignoring the cumulative nature of risk; treating the risk as static or unrelated to time; not making the link to the exponential discounting outcome.

  4.  **Analyse the Conceptual Coherence of the Distinction (Risk vs Time Bias) (4 marks):**
      *   **A:** Directly confronts the question: Does the *justification* (risk) make the *functionally identical outcome* (exponential discounting driven by time) ethically different from δ? Sophisticated discussion of whether the "back door" argument holds (smuggling in bias). Questions if the distinction collapses when risk is time-dependent. Considers both person-affecting and impersonal perspectives.
      *   **B:** States there is a tension or problem but doesn't deeply analyse *why* the distinction might be unstable. May simply assert it's different without addressing the functional equivalence.
      *   **Typical Mistake:** Simply agreeing Component 3 avoids the objection without analysis; asserting it's *obviously* the same as δ without engaging with the contingency argument; failing to focus on the core question of conceptual separation.

  5.  **Synthesise a Critical Conclusion on the Core Question (4 marks):**
      *   **A:** Provides a clear, well-reasoned judgement on whether Component 3 genuinely avoids the moral objection or reintroduces bias, directly based on the preceding analysis (Moves 1-4). Acknowledges nuances but reaches a supported conclusion (e.g., distinction unsustainable due to time-risk entanglement; risk adjustment is a morally distinct *type* of reason despite effect). Avoids simple yes/no.
      *   **B:** Restates points but lacks a clear, argued conclusion directly answering the "genuinely avoids or backdoor bias" question. Conclusion may be vague or disconnected from the analysis.
      *   **Typical Mistake:** No clear conclusion; conclusion contradicts the analysis presented; introduces entirely new, unsupported arguments at the end.

  ---
  **British English & Casual Tone Check:** Done (e.g., "genuinely", "whilst", "whilst", focus on concepts over polish, avoids excessive formality).
