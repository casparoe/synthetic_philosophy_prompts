  For the moral psych people, their big worry will be whether sympathy can bear normative weight. They see it as descriptive - how we form judgments - not prescriptive. The user must bridge that gap, maybe by linking sympathy to social stability as Hume's implicit foundation. 

  The instrumentalism objection is the nightmare scenario. If suicide is only wrong because it disrupts sympathy, does that mean it's okay in isolated cases? That could make Hume's ethics look contingent. The user needs a deflection that ties individual acts to systemic effects without sounding evasive. 

  Practical prep advice: concede early that the religious framing is undeniably present, but argue it's strategic. For sympathy's normativity, cite Hume's Treatise where he connects moral sentiment to social existence. The two-minute killer reply should be that Hume's God arguments are weak and recycled, while the sympathy angle explains why suicide feels uniquely disturbing in his system. 

  The deflection for instrumentalism? Stress that for Hume, all morality is social and relational - no such thing as a truly "private" act. But phrase it carefully to avoid dismissing the objection. 

