answer: |-
  ### Exam Question  
  **Time Allowed:** 75 minutes  
  **Word Guideline:** Approximately 1,200 words  

  > **Defend or reject the following claim:** When an agent faces an irreversible voluntary 'phenomenal replacement'—a transformation that substitutes the fundamental *metric* by which welfare is evaluated (e.g., replacing a hedonic scale with a virtue-based scale), thereby annihilating any stable index for comparing pre-change and post-change welfare—it is *impossible in principle* for the agent to make an ex ante rational choice about undergoing the change.  
  >   
  > In your response:  
  > 1. **Argue directly** for your position (defense or rejection), grounding it in the specific epistemic rupture implied by metric substitution.  
  > 2. **Distinguish this scenario sharply** from (a) ordinary preference learning (e.g., discovering you enjoy spicy food) and (b) standard transformative decisions (e.g., becoming a parent), showing why neither analogy resolves the metric-substitution problem.  
  > 3. **Address whether a third-person advisor** could legitimately override the agent’s first-person evaluative absence by imposing an external standard of welfare comparison. Explain why this does or does not preserve the possibility of rational choice *for the agent*.  

  ---

  ### Model Answer (Approx. 600 words)  
  **Position:** Rational choice is impossible in principle under phenomenal replacement.  

  Phenomenal replacement severs rational choice by annihilating the agent’s capacity for *metrically continuous evaluation*. Unlike ordinary preference shifts—where an agent discovers new preferences within a stable framework (e.g., learning you value adventure over security)—here, the welfare metric itself is replaced. For instance, a pre-change agent evaluating outcomes via pleasure-pain calculus cannot access a post-change metric grounded in, say, aesthetic harmony. Crucially, this is not ignorance of future preferences but incompatibility in *how* welfare is quantified. The pre-change self lacks the conceptual tools to model post-change welfare as "better" or "worse," since those terms derive meaning only within a metric. Without a common evaluative currency, expected-utility calculations collapse.  

  This defies resolution through standard transformative-experience arguments. Transformative decisions (e.g., choosing parenthood) involve uncertainty about *values within a shared framework* (e.g., "will caring for a child fulfill me?"). The agent still uses a stable index (e.g., "fulfillment") to weigh unknowns. Phenomenal replacement, however, destroys the index itself. Similarly, preference learning operates within a metric (e.g., "spicy food now contributes positively to my hedonic welfare"). Here, no such continuity exists: the post-change metric is unintelligible ex ante. Rationality requires comparing outcomes under a unified standard; metric substitution voids this.  

  A third-person advisor cannot salvage rational choice. An advisor might impose an external standard (e.g., "flourishing" defined biologically or socially), but this substitutes *their* metric for the agent’s irrecoverable first-person access. For the *agent*, "rational choice" requires *their* capacity to endorse the outcome as preferable under *their* evaluative lens. Post-replacement, the agent’s new metric may deem the outcome "good," but the pre-change self cannot grasp this "goodness" as an improvement relative to their original standard—only as an alien state. The advisor’s verdict, however well-intentioned, cannot bridge this gulf because it speaks from outside the agent’s pre/post evaluative standpoints. Rationality is first-person-perspective-relative; outsourcing judgment to an advisor dissolves agency without restoring comparability *for the agent*.  

  Thus, phenomenal replacement makes ex ante rational choice incoherent. It is not merely a hard choice but a structural impossibility: no common evaluative language links pre- and post-selves. Until the replacement occurs, the agent lacks the epistemic tools to assign weights to outcomes across the boundary. Rationality dies at the metric frontier.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Top answers must execute these four moves explicitly:**  

  1. **Characterize metric-substitution’s rupture** (5 marks)  
     *Requires:* Defining phenomenal replacement as *metric* replacement (not preference/experience change) and explaining how it voids cross-boundary comparison.  
     *Common mistake:* Conflating metric loss with uncertainty about preferences or experiences.  

  2. **Distinguish from preference learning & transformative choice** (6 marks)  
     *Requires:* Contrasting metric substitution’s *index annihilation* with (a) preference learning’s stable metric and (b) transformative decisions’ framework-relative uncertainty.  
     *Common mistake:* Treating metric substitution as a "more extreme" case of transformative choice without epistemic discontinuity.  

  3. **Defend impossibility claim** (5 marks)  
     *Requires:* Arguing that rational choice *fails in principle* due to the absence of a unified evaluative standard (e.g., no basis for utility maximization).  
     *Common mistake:* Asserting impossibility based on practical difficulty alone, not structural incomparability.  

  4. **Assess third-person substitution** (4 marks)  
     *Requires:* Explaining why an advisor’s external standard cannot restore *the agent’s* capacity for rational choice, given first-person evaluative absence.  
     *Common mistake:* Claiming an advisor "solves" the problem without addressing agential perspective-loss.
