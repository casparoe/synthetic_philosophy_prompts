  The user mentioned Sleeping Beauty, so they're thinking about self-locating beliefs. In this context, when you see $100, you're uncertain about your position (smaller or larger envelope), but that uncertainty is tied to how the envelopes were set up. If the prior is symmetric, but improper, the issue is that you can't assign equal probabilities because the sample space isn't normalizable.

  Another angle: the expected value calculation assumes that the two scenarios (you have the smaller vs. larger) are equally probable regardless of the amount seen. But for larger amounts, it might be less likely that you have the smaller envelope, especially if the prior favors smaller amounts. Without a proper prior, this updating can't happen consistently.

