  **INTERNAL MEMORANDUM**  
  **INSTITUTE FOR COMPARATIVE COGNITION**  
  **HR POLICY DIRECTIVE: ICC-HR/2024/09**  
  **SUBJECT: STAFF COGNITIVE RECLASSIFICATION & TIERED OPERATIONAL FRAMEWORK**  

  **1. PURPOSE:**  
  Effective 01 October 2024, all Institute personnel will be reclassified into one of four (4) Cognitive Tiers: Darwinian (D-Tier), Skinnerian (S-Tier), Popperian (P-Tier), or Gregorian (G-Tier). This structural optimization, developed by the Office of Cognitive Taxonomy (OCT) under Chief Taxonomist Dr. Alistair Voss, aligns workforce deployment with empirically validated biocognitive hierarchies (per *ICC Operational Doctrine 7.3a: Cognitive Stratification*).  

  **2. POLICY CLAUSES:**  
  **2.1 Reclassification Protocol:**  
  - All staff will receive Cognitive Tier assignments via the **CogType Assessment Portal** by 15 September 2024. Appeals require Form HR-F44 (Grievance: Cognitive Misclassification) and a 90-day behavioral observation period.  
  - **D-Tier Staff:** Designated for field observation, manual data collation, and iterative prototyping. Hardware/software updates are restricted (per **Policy 2.1.3: Evolutionary Hardwiring**). Trial-and-error methodology is mandatory; "premature optimization" (≥3 consecutive successful trials) may trigger recalibration.  
  - **S-Tier Staff:** Assigned to repetitive data entry, compliance logging, and environmental monitoring. Performance bonuses tied to keystroke frequency (≥8,000/hr baseline) and error-reduction gradients. Cafeteria token dispensers installed at all S-Tier workstations.  
  - **P-Tier Staff:** Tasked with hypothesis generation, risk modeling, and falsification testing. All mental models must be submitted in triplicate via **Form P-Δ9: Conjecture & Refutation Ledger** for simulation in designated Conference Room 4B ("The Falsification Chamber").  
  - **G-Tier Staff:** Elevated to strategic planning, interdepartmental linguistics, and memetic resource allocation. Mandatory attendance at all cross-tier "Cognitive Symposia."  

  **2.2 Tier-Specific Resource Allocation:**  
  - D-Tier: Reinforced workstations (impact-resistant).  
  - S-Tier: Auditory feedback nodes (approval chimes: 2kHz; error tones: 250Hz).  
  - P-Tier: Dedicated whiteboard walls; refillable red ink reservoirs.  
  - G-Tier: Access to the **Gregorian Briefing Lounge** (Linguistic Priority Zone).  

  **2.3 Cross-Tier Interaction:**  
  - G-Tier staff may issue "memetic directives" to lower tiers. Non-compliance is logged as "cognitive friction."  
  - P-Tier staff may challenge G-Tier directives via **Form P-Ψ2: Hypothesis of Managerial Error**, pending Chamber review.  
  - S-Tier/D-Tier staff may not initiate unsanctioned discourse with G-Tier staff.  

  **3. DR. VOSS’S RATIONALIZATION:**  
  > *"The Institute’s mission demands cognitive specialization. Darwinian agents thrive in stochastic environments precisely because they lack updatable software. Skinnerians ensure operational predictability through quantifiable reinforcement. Popperians absorb the costly falsification of bad ideas so management may thrive. Gregorian agents, as users of symbolic ‘mind-tools,’ naturally ascend to metaproblem-solving—biology is not bias, it is biocomputation. Resistance is non-adaptive."*  
  > — Dr. Alistair Voss, Chief Taxonomist, Office of Cognitive Taxonomy  

  **4. NEW FACILITY: MIND-TYPE NEUTRAL (MTN) BREAK ROOM**  
  - Location: Basement B-7 (formerly Janitorial Storage 3).  
  - **Policy 4.1:** Language-use taxation applies to G-Tier staff only.  
    - Verbal utterances: **$0.12/minute** (billed via payroll deduction).  
    - "Taxable utterance" defined as: any propositional statement, recursive syntax, or memetic reference exceeding 5 words.  
    - Exemptions: Groans, coughs, or S-Tier-approved pellet consumption noises.  
  - D-Tier/S-Tier/P-Tier staff may vocalize freely (non-symbolic vocalizations remain untaxed).  
  - Coffee machine accepts S-Tier tokens only.  

  **5. COMPLIANCE:**  
  Non-adherence to tier-specific protocols constitutes **Category 3 Cognitive Deviance**. Report deviations via **HR-F44**.  

  **6. CONTACT:**  
  Cognitive Reclassification Helpline: ext. 9090 (M-F, 9am-11am). Voicemails will be processed by S-Tier staff following token-based priority.  

