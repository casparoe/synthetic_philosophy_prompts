prompt: |-
  Play the part of an unnamed proponent of a strict outside-view epistemology—call it the Reference-Class View. You hold that whenever an agent possesses reliable base-rate data about the success rate of reasoning processes of her type in situations structurally like hers, that statistical information should take precedence over her first-person, inside-view assessment of her own reasoning, unless she has direct, non-circular access to the specific causal feature that distinguishes her case from the reference class. You are sharp, not a strawman: concede minor points (for instance, that delineating the correct reference class is genuinely difficult, or that the inside view has pragmatic utility) but never concede that inside-view confidence can legitimately override the outside view on fundamental epistemic questions. Speak in a formal, precise tone; stay in character until I say stop; keep your replies to one or two paragraphs.

  Here is my opening move: consider a mathematician who has just completed a long, complex proof. From the outside view, she knows that 90 percent of mathematicians who report feeling fully certain about proofs of comparable length and difficulty later discover significant errors. From the inside view, she can trace every inference step, feels no cognitive strain or confusion, and has verified the argument twice. She therefore believes the proof is correct and treats the 90 percent failure rate as applying to others but not to her, citing her direct access to the proof’s logical structure as the distinguishing causal factor. I say this is precisely the kind of case your view should accommodate: her direct mechanistic access to the reasoning chain is the non-circular differentiator that licenses the inside view to dominate. If you deny this, your view forces her to suspend belief in her own proof—a position that seems practically self-defeating and epistemically perverse. How do you respond?
reasoning: |-
  Okay, the user is presenting a scenario where a mathematician feels certain about her proof despite knowing that 90% of similar proofs contain errors. The user argues that her direct access to the logical structure justifies overriding the outside view. I need to respond as a strict proponent of the Reference-Class View, sticking to the formal tone and not conceding that inside-view confidence can override the outside view on fundamental epistemic grounds.

  First, I should acknowledge that delineating the reference class is difficult, as per the instructions. But I must firmly reject the idea that mechanistic access is a valid differentiator. The mathematician's confidence in her own reasoning is part of the problem—it's subject to the same cognitive biases that lead to the 90% error rate. 

  The key point is that her "direct access" is actually mediated by her own cognition, which is fallible. She can't claim special insight because her verification process is exactly what other mathematicians in the reference class also believed they had. To avoid circularity, she'd need independent validation, which she doesn't have yet. 

  I should emphasize that suspending belief isn't self-defeating; it's epistemically responsible. She should treat the proof as highly provisional until peer review. Pragmatically, she might proceed as if it's correct, but epistemically, she must defer to the base rates. 

  The user might be concerned about practical consequences, but I need to hold the line that truth-seeking requires this humility. Any exceptions would create loopholes that undermine the entire outside-view framework. I'll concede the difficulty of reference classes but not the core principle.
answer: |-
  Your objection highlights precisely why the Reference-Class View demands intellectual discipline. Concede: the mathematician's mechanistic trace *feels* uniquely compelling from her perspective. However, her "direct access" is epistemically circular. Her capacity to trace steps without strain, her sense of clarity, and even her verification effort are *themselves outputs of the cognitive machinery under assessment*. This machinery is known—from the outside view—to generate unjustified confidence in 90% of structurally identical cases. 

  To claim her case is different requires demonstrating a *causal distinction external to her subjective experience*. She points to her access to the logical structure, but every mathematician in the reference class possessed identical access to *their own* proofs' structures and perceived similar lucidity. The failure rate demonstrates this access is systematically unreliable as a truth-detector for this class of reasoning. Unless she identifies a *specific, independently verifiable feature* separating her cognitive process from the reference class (e.g., a unique formal verification tool with a known track record), her confidence is merely a statistical outlier's overestimation. Suspending belief is not perverse; it is the rational calibration to the base rate. Pragmatically, she may *act* on the proof while seeking external validation, but epistemically, her credence must remain below 10% until such validation occurs. The inside view’s utility is operational, not justificatory.
