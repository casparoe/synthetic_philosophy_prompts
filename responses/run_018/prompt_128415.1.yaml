prompt: |-
  ok so im in this decision theory seminar and we just finished the unit on the st petersburg paradox. ive noticed this argumentative pattern that keeps coming up in discussion and in the readings, and i dont know if theres a name for it.

  heres what happens. someone lays out the classic setup: infinite expected payout, but real people wont pay more than like twenty bucks. then they propose resolution A — usually some kind of bounded utilty curve or risk aversion — and show that makes the expected utilty finite. but then someone asks "ok but if you redesign the payoff schedule so the stakes scale with the utility, youre back to infinity," and instead of defending resolution A, the first person pivots to resolution B: "well no actual casino has infinite capital, so the game gets cut off at some max payout and the expectation is finite anyway." then once that institutional-objection is handled, they switch back to citing the utility curve like that was the real answer the whole time. its not that theyre combining both factors; theyre keeping two separate explanations in their back pocket and pulling out whichever one answers the current attack. ive seen this with (utility bounds vs finite bankroll), (risk aversion vs physical impossibility of running infinite trials), and even (logarithmic scaling vs people just not grasping exponential growth). in each pair the two explanations predict different things about what a rational agent should do if the other constraint were removed, but nobody in class treats that tension as a problem.

  this feels different from just having a multi-cause explanation. its also not exactly motte-and-bailey, because neither version is an indefensible "motte" or an outrageous "bailey" — both are standard literature answers. and its not plain equivocation, since the speaker isnt sliding between meanings of one word; theyre alternating between two distinct mechanisms.

  so: is there an established concept for this specific move? if not, can you coin a term and define it precisely, including what counts as a boundary case? specifically i want to know how to tell this apart from someone who genuinely thinks both factors contribute.

  please organize your answer like this:

  - The pattern (2-3 paragraphs describing it concretely, using the examples above)
  - Nearest established concepts (motte-and-bailey, auxiliary-hypothesis stacking, etc. — say which ones come close and where they fail to fit, about 1 paragraph each)
  - The term (if one exists, explain it; if not, propose one with a clear definition and at least one boundary case — 1-2 paragraphs)
  - The tell (how to distinguish this defensive double-bookkeeping from legitimate pluralism about explanations — 1 paragraph)
  - Bottom line for my presentation (short: should i call this out in seminar or is it just normal academic debate? maybe 3-4 sentences)

  sorry if this is rambly — writing on my phone between classes and i probably missed some commas. thanks!
reasoning: |-
  Okay, the user is in a decision theory seminar dealing with the St. Petersburg paradox and has noticed an argumentative pattern. They describe how participants switch between two explanations—bounded utility vs. finite bankroll—depending on the criticism. The user wants to know if there's a name for this tactic or if they should coin a term. They also need to distinguish it from legitimate pluralistic explanations.

  First, I recall the St. Petersburg paradox: infinite expected value, but people won't pay much to play. Common resolutions are bounded utility (like diminishing marginal utility) and finite resources (no casino can pay infinite amounts). The pattern the user observes involves defenders switching between these when challenged. For example, when someone points out that adjusting payouts to scale with utility brings back infinity, they pivot to the finite bankroll. Then, if the bankroll issue is addressed, they revert to bounded utility.

  The user feels this isn't a multi-cause explanation but a tactical switch. They mention it's not motte-and-bailey since both arguments are defensible, nor auxiliary hypotheses stacking, which adds layers to save a theory. The core issue is the lack of commitment to either explanation, using whichever counters the immediate objection without reconciling the tension between them.

  Now, checking for established concepts. Motte-and-bailey involves a defensible but less appealing position (motte) and a more ambitious one (bailey), switching as needed. But here, both positions are standard and neither is a retreat. Auxiliary hypothesis stacking adds ad-hoc supports, but here the switch is between two independent explanations. Equivocation changes word meanings, but here it's distinct arguments. So none fit perfectly.

  Term proposal: "Defensive Resolution Switching." Define it as alternating between independent explanations without integrating them, each used defensively. Boundary case: if someone uses both in a unified model, that's legitimate pluralism; if they switch without addressing incompatibility, it's DRS.

  The tell is whether the speaker acknowledges the tension and integrates both into a coherent model. If they avoid this and switch tactically, it's DRS. For the presentation, the user should call it out as a dialectical evasion that hinders deeper understanding, suggesting they reconcile the explanations.

  User's deeper needs: They want to critically engage in the seminar, understand if this is a valid debate tactic or a flaw. They need terminology to articulate this pattern and guidance on addressing it academically without confrontation. Providing a clear term and distinction helps them contribute meaningfully.
answer: |-
  Here's a breakdown of your observation, structured as requested:

  **The Pattern**
  You've identified a recurring dialectical dance in St. Petersburg paradox discussions. It starts with the core problem: a game offering infinite expected monetary value, yet eliciting only modest real-world bids. Resolution A (e.g., bounded utility functions, risk aversion, probability weighting) is presented as the solution, showing how it yields a finite *expected utility*. However, an objector points out that if you redesign the payout schedule to compensate for the utility bound (e.g., paying $2^u$ instead of $2^n$, where u is utilons), the expected utility explodes back to infinity, seemingly refuting Resolution A as the fundamental fix. Instead of defending Resolution A against this scaling attack, the proponent abruptly switches to Resolution B: an institutional/practical constraint (e.g., no casino has infinite capital, so payouts are capped at some large but finite N, making the *monetary* expectation finite). This resolves the specific scaling objection.

  Once the scaling attack is neutralized by Resolution B, the discussion often implicitly or explicitly reverts to Resolution A as the *primary* or *real* explanation for human behavior, without reconciling why Resolution A couldn't withstand the scaling attack on its own. The key observation is the *tactical alternation*: Resolution A is used against the naive infinite money objection, Resolution B is used against the utility-scaling objection, and Resolution A is then reinstated once the immediate threat is gone. Crucially, the potential conflict between the two resolutions (e.g., what a truly rational agent with a bounded utility function *should* do if offered a utility-scaled payout by an infinitely wealthy entity?) is left unexplored. The two explanations remain distinct tools pulled out situationally rather than integrated into a coherent model.

  **Nearest Established Concepts**

  1.  **Motte-and-Bailey Doctrine:** *Closeness:* Involves switching between a defensible but less significant claim (Motte) and a more ambitious, vulnerable claim (Bailey) for tactical advantage. *Where it fails:* In your pattern, *both* resolutions (bounded utility *and* finite bankroll) are standard, defensible, and significant within their domains. Neither is inherently a "retreat" position; they are simply different types of explanations (psychological/axiomatic vs. practical/institutional). The switch isn't primarily from a vulnerable to a safe claim, but between two different safe claims depending on the attack vector.
  2.  **Ad Hoc Hypothesis / Auxiliary Hypothesis Stacking:** *Closeness:* Resolution B (finite bankroll) can *feel* like an auxiliary hypothesis added to protect Resolution A (bounded utility) when it's under fire. *Where it fails:* The finite bankroll isn't truly "ad hoc" for the St. Petersburg paradox; it's a well-known, independent, and empirically valid constraint often discussed *alongside* utility bounds. Furthermore, Resolution B isn't consistently presented as *supporting* Resolution A; it's used *instead* of it to answer a specific objection, and then Resolution A is reasserted independently. The explanations aren't stacked; they are alternated.
  3.  **Equivocation:** *Closeness:* The argument shifts ground. *Where it fails:* Equivocation typically involves shifting the *meaning* of a key term during an argument. Here, the shift is between two entirely *different arguments/explanations* (utility bounds vs. resource constraints), not the meaning of a single term.

  **The Term**
  There isn't a universally accepted term for this *specific* pattern of alternating between two established, defensible, but distinct resolutions situationally without integrating them or addressing their potential incompatibilities. Let's coin one:

  *   **Defensive Resolution Switching (DRS):** The argumentative tactic of responding to objections against one established resolution to a paradox or problem by switching to a *different*, independent, established resolution, without defending the first resolution against the specific objection or reconciling the relationship (including potential tensions) between the two resolutions. The original resolution is often implicitly or explicitly reinstated as primary once the immediate objection is neutralized by the alternative.
  *   **Boundary Case:** A legitimate pluralistic explanation would be: "Both bounded utility *and* finite resources contribute significantly to why people pay little. Bounded utility explains the core aversion to the risk profile even in idealized settings, while finite resources explain the practical impossibility and further constrain the maximum conceivable payout. They operate at different levels." This integrates both. DRS occurs when a proponent *only* uses bounded utility until faced with the utility-scaling objection, *then* invokes finite resources *instead* to dismiss that objection, and *then* continues citing bounded utility as if the scaling objection never revealed a potential weakness in its standalone explanatory power for idealized agents.

  **The Tell**
  The key distinction between **Defensive Resolution Switching (DRS)** and **legitimate pluralism** is **acknowledgment and integration**:

  *   **Legitimate Pluralism:** The speaker explicitly acknowledges *both* factors as relevant, discusses how they *interact* or operate on *different levels* (e.g., normative theory vs. practical reality), and potentially addresses how the paradox would behave if one constraint were relaxed but not the other. They build a model incorporating both or clearly state their scope.
  *   **DRS (The Tell):** The speaker treats the two resolutions as interchangeable tools solely for defeating specific objections. They *avoid* discussing the implications of the utility-scaling attack on the *normative* strength of the bounded utility argument for an idealized rational agent facing an idealized (utility-scaled) game. They *do not* attempt to reconcile the two explanations or explain why one is suddenly abandoned when a specific objection arises, only to be picked up again later. The switch feels reactive and tactical, not explanatory.

  **Bottom Line for Your Presentation**

  Yes, you *should* call this pattern out in your seminar. Frame it as an observation about the dialectical structure of the debate rather than an accusation. You can say:

  > "I've noticed a recurring pattern in our discussions on resolving the St. Petersburg paradox. When Resolution A (e.g., bounded utility) is challenged by the utility-scaled payout objection, the discussion often pivots to Resolution B (e.g., finite bankroll) to answer that *specific* challenge, rather than defending Resolution A head-on. Once that challenge is put aside, Resolution A often regains prominence. While both resolutions are valid, this alternation sometimes sidesteps the interesting question of how Resolution A holds up normatively against the scaling objection *in principle*, and how the two explanations relate. Perhaps we could focus more on whether these are complementary explanations operating at different levels, or if the scaling objection reveals a deeper limitation in Resolution A as a *complete* normative solution for idealized agents."

  This highlights the tactical pattern ("Defensive Resolution Switching") without being overly confrontational, encourages deeper engagement with the *relationship* between the resolutions, and moves the discussion towards a more integrated understanding. It's a common pattern, but pointing it out constructively *is* valuable academic debate.
