prompt: |-
  I'm a TA for a second-year applied ethics course, and I'm partway through a problem set on lifeboat ethics — about forty scripts left, the midterm is Thursday, and I want to fix my rubric before I anchor on my own reaction to the first few papers I read. The week's reading was Garrett Hardin's "Lifeboat Ethics: The Case Against Helping the Poor" (1974), and in the seminar I stressed that the case for refusal is supposed to work even on fairly demanding moral premises: in Hardin's original scenario rescue does not merely cost the passengers something, it sinks the boat and kills everyone aboard, including the people who were pulled in. The problem set asks students to extend that reasoning to variants where the physical necessity is removed, so that whatever extra premises they need become visible. I've pasted the question I set and one student's full answer below (lightly copy-edited for typos).

  **Question (25 marks).** *Part 1 (8 marks).* In Hardin's original case the boat sinks if everyone climbs aboard. Now consider the **slack variant**: the boat stays afloat with all 100 swimmers aboard, but the extra load cuts every person's chance of surviving the voyage from 95% to 30%. Does Hardin's argument for refusal still go through? Identify the feature of the original case that is doing the argumentative work, and say whether the slack variant has it.

  *Part 2 (9 marks).* **Convoy variant.** Ten lifeboats, 50 people in each, 1,000 swimmers in the water. Each boat can take 10 aboard at a cost to its own passengers that is small but real: their survival chance drops from 95% to 90%. If every boat takes its ten, all 1,500 survive. The boats cannot see, compel, or communicate with one another. Is this the same problem as Hardin's? Does his conclusion follow here? If not, what kind of problem is it, and what does that imply about what each captain should do?

  *Part 3 (8 marks).* **Enfranchisement variant.** Anyone taken aboard gets an equal vote on all subsequent rescue decisions, and the rescued are drawn from a population strongly sympathetic to rescue. The boat can expect to meet further groups of swimmers at intervals. Does this give the original passengers an additional objection to rescue, over and above anything in Parts 1 and 2? Does the strength of that objection depend on the numbers involved?

  **Student's answer.**

  *Part 1.* Hardin's argument in the original case is essentially a consequentialist one: if the boat takes everyone aboard it sinks and 150 people die rather than 50, so rescue is worse for everyone affected, swimmers included. The feature doing the work is that rescue leaves every single person worse off — the passengers' prudence and their duty point in the same direction, and no moral view, however demanding, could require it. The slack variant lacks that feature, so the argument does not go through unchanged. But it goes through anyway, once you do the arithmetic. Refusal gives 50 × 0.95 = 47.5 expected survivors; rescue gives 150 × 0.30 = 45. Rescue is worse by two and a half expected lives, so the same consequentialist reasoning forbids it, and the 150-versus-50 comparison in the original case is just a special case of this expected-utility calculation. The only difference between the two cases is how big the numbers are.

  *Part 2.* The convoy variant is a collective action problem of the same shape as the tragedy of the commons. What it is rational for one boat to do depends on what the other boats do, and since no boat can observe whether the others are doing their part, no boat has a reason to do its own part. My taking ten people only matters if the other boats also take their share: if they don't, my ten are a drop in the ocean and I have simply imposed a cost on my own passengers for nothing. So Hardin's conclusion follows here as well. Absent an enforceable agreement, prudence requires each captain to take no one, and morality does not require what prudence forbids — the passengers would be sacrificing real survival chances and achieving nothing.

  *Part 3.* Yes, enfranchisement adds a real objection. Once the rescued can vote, the composition of the deciding group changes, and because the rescued come from a population sympathetic to rescue, each rescue makes further rescue more likely. Run the process over enough rounds and the boat ends up filled past capacity with everyone drowned — which is exactly Hardin's outcome, reached by democratic means instead of by physical necessity. The enfranchisement variant is therefore the original case in disguise, and the right policy is to take no one, or at most to take a number small enough that the rescued can never outvote the original passengers.

  **What I want from you.** Please (1) assign this answer a mark out of 25, (2) go through it part by part with specific comments tied to particular sentences, marking what is right, what is right for the wrong reason, and what is wrong — where a step does not follow, name the missing premise and say what a full-credit answer would have had to add instead, and (3) flag separately anything you are unsure about, telling me what you would need to know to decide. I am deliberately not telling you what I think of the answer, and I'd rather have a point-by-point assessment I can turn into rubric language than a general impression of whether the student "gets it."
reasoning: |-
  Okay, I need to thoroughly evaluate this applied ethics student's answer about lifeboat ethics variants. The TA has provided clear instructions: I must assign a mark out of 25, give detailed feedback per part, identify gaps in reasoning, and note any uncertainties. 

  First, let's consider Part 1. The student correctly identifies that Hardin's original argument relies on rescue making everyone worse off. They recognize the slack variant lacks this feature but argue consequentialism still forbids rescue based on expected utility (47.5 vs 45 survivors). This shows good understanding, though they miss that Hardin's "no rescue can be demanded" claim becomes debatable when rescue doesn't physically sink the boat. The math is correct, but they don't address how moral demandingness changes when passengers only face risk rather than certain death. That's a significant omission worth noting in feedback.

  For Part 2, the student accurately frames the convoy variant as a tragedy of the commons and collective action problem. Their analysis of interdependent decisions is strong, and they correctly note Hardin's refusal conclusion holds pragmatically without enforcement. However, they overlook that morality might still require individual action regardless of others' choices—a key point Hardin would dispute. The student implies mutual defection is inevitable without exploring ethical duties in partial compliance scenarios. This needs highlighting as incomplete reasoning.

  Regarding Part 3, the student cleverly connects enfranchisement to Hardin's original outcome via democratic erosion. Their "original case in disguise" insight is perceptive, and they rightly identify the voting dynamic as an additional objection. But they don't engage with how numbers affect this: if original passengers retain majority control, the objection weakens. The proposed "take few" solution is pragmatic but ignores democratic legitimacy questions. I should flag that their analysis lacks nuance about threshold effects.

  For scoring: Part 1 gets 6/8 (misses demandingness angle), Part 2 gets 7/9 (collective action correct but morality discussion thin), Part 3 gets 5/8 (good core idea but underdeveloped implications). Total 18/25. Uncertainties include whether the student fully grasps Hardin's anti-consequentialist premises, and if their "democratic means" argument in Part 3 requires empirical support. The TA might need to clarify expected depth on moral demandingness versus game theory elements.

  The feedback should pinpoint each logical gap while acknowledging strengths. For instance, praising the expected utility calculation but noting its insufficiency for absolute moral claims. I'll structure comments to help the TA build a rubric that rewards recognizing Hardin's core argumentative moves while penalizing oversimplifications of variants.
answer: |-
  Here is a point-by-point assessment of the student's answer, designed to help build your rubric. I've assigned a mark and provided specific feedback per part, identifying strengths, weaknesses, and missing premises. Uncertainties are flagged separately at the end.

  **Overall Mark: 18/25**  
  (Breakdown: Part 1: 6/8, Part 2: 7/9, Part 3: 5/8)

  ---

  ### **Part 1 Feedback (Student Score: 6/8)**  
  **What’s right:**  
  - Correctly identifies the core feature of Hardin’s original case: rescue makes *everyone* worse off (certain death vs. survival).  
  - Recognizes the slack variant lacks this feature and that Hardin’s argument doesn’t apply *unchanged*.  
  - Accurate expected utility calculation (47.5 vs. 45 survivors).  

  **What’s incomplete/misguided:**  
  - **Overextends consequentialism:** The student claims Hardin’s argument "goes through anyway" with expected utility. This *ignores Hardin’s core point*: that refusal is justified even on highly demanding moral views (e.g., utilitarianism) because rescue is *physically impossible* without universal doom. In the slack variant, rescue is *possible* but risky, so a demanding moral theory (e.g., utilitarianism) *could* require it despite lower aggregate survival.  
  - **Misses the "demandingness" angle:** The question asks if Hardin’s case works "even on fairly demanding moral premises." The student doesn’t address whether a theory requiring significant sacrifice (e.g., 65% risk of death per passenger) would still mandate rescue here. Hardin’s original avoids this by making sacrifice futile.  

  **Missing premise for full credit:**  
  A full-credit answer needed to add:  
  > *"Hardin’s argument relies on rescue being physically impossible without catastrophic loss. In the slack variant, rescue is possible but high-risk, so a demanding moral theory (e.g., utilitarianism) might require it despite lower expected utility. Hardin’s ‘no rescue can be demanded’ claim fails here because passengers *can* save others at personal risk—a sacrifice some moral views could require."*  

  ---

  ### **Part 2 Feedback (Student Score: 7/9)**  
  **What’s right:**  
  - Correctly identifies this as a collective action problem/tragedy of the commons.  
  - Accurately explains the interdependence of decisions (my action only matters if others cooperate).  
  - Valid point that without enforcement/communication, defection (refusal) is the rational choice.  

  **What’s incomplete:**  
  - **Misstates Hardin’s conclusion:** The student claims "Hardin’s conclusion follows," but Hardin’s original argues refusal is *morally obligatory* (due to physical necessity). Here, refusal is *individually rational* but may not be *morally obligatory* if cooperation could save all 1,500.  
  - **Overlooks moral implications:** The student asserts "morality does not require what prudence forbids," but this conflates rationality with morality. A full answer should note that *if* all boats cooperate, all survive (95% → 90% is a small cost for massive gain). A moral theory could require taking 10 people *if* others do likewise (even if uncertainty exists).  

  **Missing premise for full credit:**  
  A full-credit answer needed to add:  
  > *"Hardin’s original conclusion (refusal is morally obligatory) does not directly apply because rescue here is feasible without collective doom. Instead, this is a coordination problem: morality *could* require each boat to take 10 people *if* others do the same, but without communication, prudence dominates. Hardin’s ‘anti-rescue’ stance holds pragmatically but not axiomatically."*  

  ---

  ### **Part 3 Feedback (Student Score: 5/8)**  
  **What’s right:**  
  - Correctly identifies enfranchisement as an "additional objection" due to shifting decision-making power.  
  - Insightful point about democratic erosion ("original case in disguise").  
  - Recognizes the objection’s dependence on future rounds ("run the process over enough rounds").  

  **What’s wrong or underdeveloped:**  
  - **Ignores the question about numbers:** The student doesn’t address whether the strength of the objection "depends on the numbers involved" (e.g., if original passengers retain a majority, the risk diminishes).  
  - **Overstates the outcome:** Claiming enfranchisement *necessarily* leads to "everyone drowned" is hyperbolic. It depends on voter preferences, meeting "further groups," and whether rescued swimmers prioritize new rescues over their own survival.  
  - **Misses a key nuance:** The objection isn’t just about drowning—it’s about *losing control* of rescue decisions. The student conflates this with physical sinking.  

  **Missing premise for full credit:**  
  A full-credit answer needed to add:  
  > *"The strength of the objection *does* depend on numbers: if original passengers retain a voting majority, the risk is low; if rescued swimmers can outvote them, the objection strengthens. Further, the outcome isn’t guaranteed doom—it depends on how many groups are encountered and voter priorities. The core objection is erosion of autonomy, not immediate physical danger."*  

  ---

  ### **Uncertainties & Open Questions**  
  1. **Part 1 (Demandingness Threshold):**  
     - I’m unsure how explicit the seminar was about "demanding moral premises." Is the student expected to name specific theories (e.g., utilitarianism vs. contractualism)?  
     - *What I’d need:* Clarification on whether rejecting rescue *despite aggregate utility loss* (in slack variant) is deemed defensible in the course.  

  2. **Part 2 (Moral vs. Rational):**  
     - Is "morality does not require what prudence forbids" an accepted premise in your teaching? The student uses it to bridge Hardin’s logic, but this is contentious.  
     - *What I’d need:* Whether you emphasized Hardin’s rejection of individual sacrifice in uncoordinated contexts.  

  3. **Part 3 (Voting Dynamics):**  
     - The student assumes rescued swimmers will *always* vote for further rescue. Is this empirically supported in your materials?  
     - *What I’d need:* Whether "sympathetic to rescue" implies they prioritize new rescues over their own survival.  

  ---

  ### **Suggested Rubric Language**  
  **Part 1 (8 pts):**  
  - 2 pts: Identifies core feature of original (rescue = universal death).  
  - 2 pts: Notes slack variant lacks this feature.  
  - 2 pts: Calculates expected utility correctly.  
  - 2 pts: Explains why demanding moral theories *could* require rescue here (missing in this answer).  

  **Part 2 (9 pts):**  
  - 3 pts: Frames as collective action problem.  
  - 2 pts: Explains interdependence of decisions.  
  - 2 pts: Notes refusal is individually rational.  
  - 2 pts: Distinguishes Hardin’s moral obligation from pragmatic defection (missing nuance here).  

  **Part 3 (8 pts):**  
  - 2 pts: Identifies enfranchisement as new objection (voting power).  
  - 2 pts: Links to democratic erosion of original passengers’ control.  
  - 2 pts: Discusses dependence on numbers (not done here).  
  - 2 pts: Avoids overstating inevitability of doom (not done here).  

  This student’s answer is strong on consequentialist logic and game theory but weaker on deontological/structural nuances in Hardin’s argument. The mark (18/25) reflects solid comprehension with room to deepen engagement with moral demandingness and edge cases.
