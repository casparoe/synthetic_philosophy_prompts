answer: |-
  ### Internalist vs. Externalist Analysis of Practical Reasons  
  **Case Specification:** An agent founded a philanthropic endowment, binding herself to long-term obligations (e.g., legal contracts, public promises). She later undergoes a profound, irreversible value shift, now viewing the project as worthless. She retains *formal obligations* (legal/moral) but feels *zero motivation* to continue.  

  ---

  ### **1. Internalist Account (e.g., Williams, Hume)**  
  - **Core Thesis:** A reason for action must link to the agent’s *subjective motivational set* (desires, commitments, dispositions).  
  - **Verdict:** **No reason to maintain the project.**  
    - Her current motivational set contains no element (e.g., desire for integrity, residual loyalty) that connects to the project. The value shift severed all subjective ties.  
    - Formal obligations alone do not constitute reasons absent a motivational link. "Obligation" only translates to a reason if the agent *cares* about duty or its consequences.  
  - **Nullification Claim:** A present absence of motivation **nullifies the reason**. Even if obligations exist externally, they lack normative force for the agent without subjective traction.  

  **Divergence Point:** Internalism denies that reasons can exist independently of the agent’s psychology. Obligations are inert unless they engage her current motives.  

  ---

  ### **2. Externalist Account (e.g., Parfit, Scanlon)**  
  - **Core Thesis:** Reasons derive from objective facts (e.g., moral truths, roles, commitments) and need no connection to motivation.  
  - **Verdict:** **Strong reason to maintain the project.**  
    - Her past commitments created enduring obligations (e.g., to beneficiaries, co-signers, or the public). These obligations are reason-giving due to their objective weight, not her present attitudes.  
    - The project’s value is determined by its impact, not her endorsement (e.g., it may still alleviate suffering).  
  - **Nullification Claim:** Absent motivation **cannot nullify the reason**. Reasons are facts; her psychological disconnect is irrelevant to their existence (though it may affect her ability to act).  

  **Divergence Point:** Externalism separates reasons from motivation entirely. Obligations bind her because she *incurred* them, not because she currently feels bound.  

  ---

  ### **3. Key Divergence: The Role of Motivation**  
  | **Issue**                | **Internalism**                          | **Externalism**                          |  
  |--------------------------|------------------------------------------|------------------------------------------|  
  | **Source of Reasons**    | Agent’s subjective motivational set      | Objective facts/obligations              |  
  | **Motivation’s Role**    | Constitutive: No motivation → no reason  | Contingent: Reason persists independently |  
  | **Status of Obligations** | Obligations only bind if motivationally engaged | Obligations bind by their normative nature |  

  ---

  ### **4. Assessment: Which Account Yields the More Defensible Verdict?**  
  **Externalism is more coherent** in this scenario, judged by standards of *practical rationality*:  

  #### **Why Externalism Succeeds:**  
  - **Preserves Rational Integrity Across Time:** Externalism acknowledges that past commitments create *future-directed reasons*. Reneging due to changed feelings undermines rational agency, as it allows present psychology to erase prior obligations.  
  - **Avoids Instrumental Self-Defeat:** If reasons vanish when motivation fades, agents could strategically "opt out" of burdensome obligations by altering their psychology (e.g., willful indifference). This collapses rational consistency.  
  - **Coheres with Normative Practices:** Legal/role-based obligations (e.g., trusteeship) exist precisely to bind agents despite changing sentiments. To deny this severs rationality from social cooperation.  

  #### **Why Internalism Fails:**  
  - **Collapses Rational Authority:** Reducing reasons to fleeting motivation dissolves the distinction between *having* a reason and *caring* about it. This renders obligations meaningless when inconvenient.  
  - **Ignores Second-Order Rationality:** Internalism cannot condemn the agent’s value shift as irrational (e.g., "I now hate my children, so I have no reason to feed them"). Externalism, by contrast, upholds that some reasons transcend psychological states.  
  - **Undermines Agency:** If reasons die with motivation, long-term projects become impossible—no rational demand compels follow-through when enthusiasm fades.  

  ---

  ### **Conclusion**  
  In cases of irreversible value shifts, **externalism** better upholds the coherence of practical rationality by:  
  1. Anchoring reasons in objective commitments, ensuring continuity of agency.  
  2. Rejecting the claim that motivation is constitutive of reasons (it is merely enabling).  
  3. Protecting rationality from self-serving psychological volatility.  

  Internalism’s verdict—that the agent has *no reason* to act—collapses into subjectivism, making practical rationality hostage to transient desires. Externalism’s insistence on enduring obligations, while psychologically demanding, preserves the normative structure necessary for coherent long-term agency.
