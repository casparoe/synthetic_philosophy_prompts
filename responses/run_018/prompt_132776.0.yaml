  I should start by contrasting synchronic vs. diachronic inconsistency. Synchronic is about one moment; diachronic is across time. If the future self is different, then money pumps aren't about logical inconsistency but about changing selves. That shifts money pumps from a paradox to a diagnostic tool revealing how agency is structured over time. It shows conflict between temporal agents rather than irrationality in one agent.

  Next, precommitment devices. Traditionally, they're seen as tools to aid rational long-term goals. But under diachronic fragmentation, they become a form of internal negotiation or coercion. The present self binds the future self, which raises ethical questions. Is this a legitimate exercise of autonomy or suppression of the future self's preferences? That ties into intertemporal sovereignty. Maybe there's a need for a principle where temporal stages respect each other's autonomy, but that's tricky because future selves can't negotiate with the past.

  Ethically, if preferences genuinely shift, judgment might be misplaced. It's not about irrationality but about changing circumstances or values. Policies should focus on supporting coherence without punishing change. Maybe institutions should help individuals manage fragmentation rather than enforce consistency.

