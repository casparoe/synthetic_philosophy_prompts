prompt: |-
  I'm a software engineer with no formal philosophy background, and I'm trying to work out who actually belongs to the demos in a democratic system. I'm not working from theory; I'm going by gut verdicts on concrete cases and want to know if there's a principle behind them.

  My verdicts:
  - Every adult citizen physically present in the territory and affected by its laws: clearly belongs.
  - A permanent resident with no citizenship, fully integrated, and equally subject to taxation and regulation: belongs.
  - A citizen who emigrated permanently decades ago, pays no taxes, and is unaffected by current policy: does not belong to the active demos.
  - Unborn future generations who will inherit the climate and fiscal consequences of today's decisions: belong in some representational sense.
  - Sentient non-human animals in the territory affected by environmental rules: do not belong.
  - AI proxy agents that aggregate and cast votes for living citizens according to explicit instructions: do not belong; they are instruments, not members.
  - A secessionist community inside the borders that explicitly denies the system's legitimacy: still belongs, since it remains subject to coercive law.
  - Children currently unable to deliberate politically: belong prospectively, with interests that should be represented now.

  The case I keep reversing on is a "legacy agent"—an AI system that continues to vote according to a deceased citizen's recorded preference profile years after death. Sometimes I treat it as an extension of that dead person (whom I said is out); other times I see it as persistent software that should be disregarded, yet I still want future generations represented, which feels structurally similar. Is there a coherent principle—perhaps about reciprocal agency, affected stakes, or system membership—that captures all eight verdicts? If not, which verdict should I drop, and what does the best principle predict for the legacy-agent case?
reasoning: |-
  Okay, let me try to unpack this user's query. They're a software engineer without a formal philosophy background, trying to figure out who belongs in the demos based on concrete cases. They've listed eight verdicts and are stuck on the legacy agent case. 

  First, I need to understand their perspective. They're approaching this pragmatically, from gut feelings about real-world scenarios rather than theory. That makes sense for an engineer. Their examples cover a range: present citizens, residents, emigrants, future generations, animals, AI proxies, secessionists, children, and the tricky legacy agent.

  Looking at their verdicts, a few patterns emerge. Presence and being affected by laws seem important (cases 1 and 2). But future generations aren't present yet still "belong" in some way (case 4). Animals are affected but excluded (case 5). The secessionist case is interesting—they're subject to laws so included despite rejecting legitimacy. 

  The legacy agent is the real puzzle. It's like a digital ghost voting based on a dead person's preferences. The user flip-flops here. Sometimes they see it as an extension of the deceased (who shouldn't vote), other times as persistent software (which feels different from representing future gens). 

  I wonder if they're wrestling with two competing intuitions: 
  - The "affected interests" principle (anyone/thing impacted should have representation)
  - The "political agency" requirement (members must be capable of participation)

  Their future generations inclusion suggests they value affected interests strongly. But they exclude animals and AI proxies, which hints at needing some form of agency. 

  For the legacy agent, I suspect the conflict arises because it mimics agency (voting) but lacks any actual stake—it's just executing code for someone who no longer exists. Future generations have real future stakes but no current agency. 

  The cleanest solution might be to emphasize *potential for lived experience* as the core principle: 
  - Present humans (cases 1-2,7-8) have it 
  - Future humans (case 4) will have it 
  - Animals (case 5) lack political agency even if sentient 
  - The dead (case 3) and their digital ghosts (legacy agent) have no future lived experience 

  This explains why future gens get representation (their future lived experience is at stake) but legacy agents don't (no one's lived experience is represented—just a historical echo). 

  The user might need to slightly adjust case 4's wording: future gens "belong" only through trusteeship (living representatives), not direct membership. That avoids equating them with voting members. 

  For the legacy agent, the principle clearly excludes it: no current stakes, no future experience, just algorithmic inertia. The "reciprocal impact" angle (only those who bear laws' consequences get voice) seals this—dead people bear no consequences. 

  ...I should probably mention that democracies already handle future gens via living trustees (e.g., constitutional safeguards), which avoids the paradox of representing non-persons. Helps ground this in practice.
answer: |-
  Your case-by-case verdicts reveal a coherent principle emerging: **the demos consists of entities with *present or future lived experience* who are *subject to the system's coercive power* and *capable of reciprocal political agency* (now or imminently).** Let's break this down against your verdicts:

  ### Core Principle Components:
  1. **Lived Experience**: Entities must have conscious existence (now or in the future) that can be concretely affected.
  2. **Subject to Coercion**: Bound by the polity's enforceable rules.
  3. **Reciprocal Agency**: Capacity to engage in the political process (deliberate, negotiate, or delegate) — either immediately or developmentally.

  ### Your Verdicts Mapped to the Principle:
  | Case                                          | Verdict      | Lived Experience? | Subject to Coercion? | Reciprocal Agency? | Principle Alignment |
  |-----------------------------------------------|--------------|-------------------|----------------------|--------------------|---------------------|
  | **Adult citizen in territory**               | Belongs     | ✅ (Present)      | ✅                   | ✅                 | ✅                  |
  | **Permanent resident**                       | Belongs     | ✅ (Present)      | ✅                   | ✅                 | ✅                  |
  | **Emigrated citizen**                        | Does not    | ❌ (Unaffected)   | ❌                   | ❌                 | ✅                  |
  | **Future generations**                       | Belong (rep.)| ✅ (Future)       | ✅ (Indirect)        | ❌ (But trusteeship possible) | ⚠️ (Requires adjustment) |
  | **Sentient animals**                         | Do not      | ✅ (Present)      | ✅                   | ❌ (No capacity)   | ✅                  |
  | **AI voting proxies**                        | Do not      | ❌                | ❌                   | ❌ (Tool)          | ✅                  |
  | **Secessionist community**                   | Belongs     | ✅ (Present)      | ✅                   | ✅                 | ✅                  |
  | **Children**                                 | Belong (prosp.)| ✅ (Present)      | ✅                   | ⏳ (Developing)    | ✅                  |
  | **Legacy agent (deceased voter)**            | ?            | ❌ (None)         | ❌                   | ❌ (No delegation from dead) | ❌ |

  ### Resolving Conflicts:
  - **Future Generations (Your Case 4)**: Your inclusion is *almost* covered but requires a slight refinement. They have *future* lived experience and are subject to *future coercion* from today's policies, but lack agency. Thus, they warrant **representational trusteeship** (e.g., guardians in climate lawsuits), not direct membership. *Adjust verdict to: "Belong through institutional guardianship, not as voting members."*
    
  - **Legacy Agent**: This fails all three criteria:
    - The deceased has **no lived experience** (conscious existence ceased).
    - **Not subject to coercion** (death nullifies legal personhood).
    - **No valid agency**: Preferences recorded in the past can't reflect current stakes. A dead person can't delegate or adjust views.

    *Your intuition that it's analogous to future generations is understandable but flawed*: Future generations are *actual future people* with interests; legacy agents are *algorithms echoing a ceased consciousness*. Treating them as equivalent risks "zombie democracy" where the dead override the living.

  ### Refined Principle:
  > **The demos comprises entities that:**
  > **1. Have present or future conscious existence,**  
  > **2. Are subject to the polity's enforceable rules,**  
  > **3. Can exercise political agency (individually or via valid delegation) now or imminently.**  

  ### How This Handles Edge Cases:
  - **Corporations**: Not included (no conscious existence, though they may be subject to laws).
  - **AI Citizens**: If someday capable of conscious experience and agency, *might* qualify — but current AI lacks both.
  - **Comatose Adults**: Still belong (potential to regain agency, lived experience interrupted but not terminated).

  ### Recommendation:
  - **Drop the direct inclusion of future generations** as voting members. Instead, affirm they require **proxy representation by living trustees** (e.g., ombudspersons for future interests, constitutional safeguards). This maintains coherence while honoring your intuition that their stakes matter.
    
  - **Reject legacy agents**: They violate the reciprocity requirement (no skin in the game) and confuse historical preferences with current interests. A democracy must prioritize *those who live with the consequences*.

  ### Why This Works for You:
  As an engineer, you'll appreciate this as a **testable schema**:
  1. **Lived experience** = Is there a conscious entity (now/future)?
  2. **Subject to coercion** = Does the entity bear costs/benefits of policies?
  3. **Reciprocal agency** = Can the entity adapt its input to changing conditions?

  Legacy agents fail all three. Future generations pass (1) and (2) but fail (3) — hence needing representation *through* the demos, not membership *within* it.
