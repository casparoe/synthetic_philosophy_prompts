  - Whether it actually supports the colleague's two moves (denying LLM consciousness or dismissing human phenomenology)

  Crucially, I'll note where the phrase overreaches - for example, evolutionary origins don't necessitate that consciousness is unreal, and calling something an "interface" doesn't mean the experiences aren't real. The colleague seems to be making these invalid leaps.

  I need to be explicit about uncertainties too - like when cognitive science evidence for certain claims is still debated (e.g., extent of causal efficacy), or when metaphysical interpretations go beyond science. The user wants this to stand on reasoning, not citations, but I should flag where empirical premises are shaky.

