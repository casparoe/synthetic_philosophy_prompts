  anyway, whats your actual credence that this is a real distinct thing in cultural evolution, separate from just regular controversy? i need a number between 0 and 1. but break it down for me: first, how likely is it that meme theory is the right framework at all? second, how likely is controversy-driven spread actually different from people just believing and sharing? third, how likely is it that debunking fuels replication instead of killing it? plus whatever other pieces you think matter. then combine them into your final number.

  also tell me which part youre least confident about and what kind of evidence would shift it. my friend says this is like 0.7 likely and im more around 0.3, so also tell me where our disagreement probably actually lives.

