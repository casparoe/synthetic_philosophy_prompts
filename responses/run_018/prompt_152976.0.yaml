prompt: |-
  I serve on the clinical ethics board of a large transplant center, and we are required to publish a binding tie-breaking protocol for the rare cases in which two candidates score identically across every metric in our allocation system. Rather than defaulting to chance, I want the procedure grounded in the philosophical analysis of rational choice without preference — specifically the framework associated with Buridan's ass — translated into a reproducible, stepwise checklist that a non-philosopher referee could execute under time pressure with only the clinical file at hand. Lay out the ordered checks: how to classify a tie as epistemic (unmeasured differences remain) or genuinely value-equivalent, which secondary distinctions may legitimately break symmetry, the precise point at which analysis ends and selection becomes arbitrary but fully documented, and the escalation conditions where judgment must pass to the full board because the conflict is one of values rather than facts. Apply the procedure to three scenarios: two patients with identical survival predictions but different ages; two patients tied on every metric including age; and a tie resolved only by geographic proximity to the donor organ. Include one scenario in which the procedure yields a recommendation the board will almost certainly reject, and close by specifying exactly what the procedure cannot determine and where it is designed to misfire. The protocol must require no external literature, depend on no specialized philosophical training, and be completable within fifteen minutes.
reasoning: |-
  We are designing a tie-breaking protocol for transplant organ allocation when two candidates are tied on every metric. The protocol must be based on the philosophical analysis of rational choice without preference (Buridan's ass) and must be executable by a non-philosopher referee in under 15 minutes using only the clinical file.

   The key steps:
   1. Classify the tie as either epistemic (meaning there are unmeasured differences that might exist) or genuinely value-equivalent (meaning the two are truly equal in value for the purpose of allocation).
   2. Identify secondary distinctions that may legitimately break symmetry without introducing bias or violating ethical principles.
   3. Determine when the analysis must end and the selection becomes arbitrary (but must be documented).
   4. Escalate to the full board when the conflict is one of values rather than facts.

   The procedure must be stepwise and reproducible.

   Ordered Checks:

   Step 1: Verify the Tie
     - Confirm that the two candidates are absolutely identical on every metric in the allocation system (e.g., medical urgency, expected post-transplant survival, waiting time, etc.). 
     - If there is any measurable difference, however small, that is part of the allocation system, then that difference breaks the tie. (This is not a tie.)

   Step 2: Classify the Tie (Epistemic vs. Value-Equivalent)
     - Epistemic Tie: There might be unmeasured factors that could break the tie, but they are not captured by the current system. For example, a factor that is known to affect outcomes (like a specific genetic marker) but is not part of the allocation system because it is not routinely measured or validated for allocation.
     - Value-Equivalent Tie: The two candidates are truly equal in every way that the system values. The system does not consider any other factors, and we have no reason to believe that there are hidden factors that would change the outcome.

     How to decide:
     - If there exists any data in the clinical file (or that could be reasonably obtained within the time constraint) that is not part of the allocation metrics but is known to be a valid predictor of transplant success (e.g., a specific comorbidity that is not in the model, a recent lab value that is not included in the score) then the tie is epistemic. In this case, we must attempt to measure that factor.
     - If no such data exists or can be obtained, and the allocation system has captured every relevant factor, then the tie is value-equivalent.

   Step 3: Resolving an Epistemic Tie
     - Identify any unmeasured factors that are known to be relevant to transplant success and that can be quickly and reliably assessed from the clinical file (or by a quick test if feasible within the time frame and without compromising the organ). 
     - Examples: 
          a. A recent lab value (e.g., a more current eGFR than the one used in the allocation score) that might indicate a slight difference in current condition.
          b. A specific comorbidity that was not included in the allocation model but has been validated to affect outcomes (e.g., presence of a particular antibody).
          c. A factor that is not in the allocation system due to practical constraints but is known to be important (e.g., a genetic marker that predicts rejection).
     - If such a factor exists and can be measured without delay (within the time available for the decision, e.g., 15 minutes) and without additional risk, then measure it and use it to break the tie.
     - If multiple factors exist, use the one with the strongest evidence base for predicting transplant success. If that doesn't break the tie, move to the next until one factor breaks the tie.

     - If no such factor can be assessed within the time, then the tie becomes value-equivalent (proceed to Step 4).

   Step 4: Resolving a Value-Equivalent Tie
     - In a true value-equivalent tie, there is no rational basis for preference. However, we must break the tie without introducing bias. We do so by using a symmetric random process that is transparent and documented.

     - The referee must:
          a. Document that the tie is value-equivalent and that no secondary factors could be assessed (or were assessed and found to be equal).
          b. Use a random method (e.g., flip a coin, draw lots) to assign the organ. The method must be witnessed and recorded.

   Step 5: Escalation to the Full Board
     - Escalate when the tie-breaking decision involves a conflict of values (rather than a lack of information). This might occur if:
          a. There is a disagreement about whether a secondary factor should be considered (e.g., age, social factors) that is not part of the allocation system but is raised as a potential tie-breaker. 
          b. The allocation system does not include a factor that is considered by some to be ethically relevant (e.g., geographic proximity, which might be seen as favoring local patients) and the referee is unsure if it should be used.
          c. The referee identifies that the tie involves a factor that the board has not previously addressed and that might set a precedent.

     - Conditions for escalation:
          If the referee, in trying to break the tie, encounters a factor that is not in the allocation system and that factor is controversial (i.e., its use might violate a principle of equity or justice, or it is not a medical factor) then the referee must stop and refer to the full board.

     - Note: The allocation system is the primary guide. Any factor not in the system is not to be used unless the board has previously approved it as a secondary tie-breaker. If the board has not, then the referee must escalate.

   Step 6: Pre-approved Secondary Factors (if any)
     - The board may have pre-approved certain secondary factors for tie-breaking. For example:
          a. Time of registration on the waiting list (if not already included in the allocation score and if the difference is at least one day).
          b. A random assignment.

     - However, if the board has not pre-approved any, then the referee must not use any non-random factor without escalation.

   Now, apply the procedure to three scenarios:

   Scenario 1: Two patients with identical survival predictions but different ages.
     - Step 1: They are tied on every metric in the allocation system. But note: if age is not part of the allocation system, then the tie is confirmed. However, if the allocation system includes age (or an age-related factor) then they wouldn't be tied. So we assume age is not in the system.
     - Step 2: This is an epistemic tie? Not necessarily. If the allocation system does not include age, then we must ask: is age a known valid predictor of transplant success? 
          - If the answer is yes (and it usually is) then the tie is epistemic because we have an unmeasured factor (age) that is known to predict outcomes. However, note: the allocation system deliberately did not include age. So we must not use age unless the board has approved it as a secondary factor. Otherwise, using age would be introducing a factor that the system has excluded, which is a value conflict.
          - Therefore: the referee must not use age to break the tie without escalating to the board. Why? Because the system designers chose not to include age. Using it now would be a value judgment that the board must make.

          So for Scenario 1:
          - If the allocation system does not include age, then we have a factor (age) that is known to be predictive but is not in the system. The referee must consider: is the use of age as a tie-breaker pre-approved by the board? If not, then this is a value conflict -> escalate to the board.

          However, note: the scenario says they have identical survival predictions. This might imply that the survival prediction model already accounts for age? Then they are tied even after accounting for age. So if the model includes age, then the tie is value-equivalent. But if the model does not include age, then we have an unmeasured factor (age) that is known to be important.

          Let's assume the model does not include age. Then:

          Step 2: Epistemic tie because of unmeasured factor (age). 
          Step 3: But we cannot use age without the board's approval because the system excluded it. So we escalate (Step 5) because of a value conflict: should we use a factor that the system excluded?

          Alternatively, if the board has pre-approved the use of age as a secondary tie-breaker, then we use it: the younger patient gets the organ? But note: this might be controversial because it might be seen as age discrimination. The board might have pre-approved it because younger patients might have more life-years to gain. However, that is a value judgment.

          Without pre-approval, we must escalate.

   Scenario 2: Two patients tied on every metric including age.
     - Step 1: They are tied on every metric, including age? Then we have a tie.
     - Step 2: We must check for any unmeasured factors. Are there any? 
          - For example: a recent change in condition (like a new infection) that hasn't been captured? 
          - If we can find any such factor that is known to predict success and is measurable, we use it.
          - If not, then we have a value-equivalent tie.

     - Step 4: We break by random assignment.

   Scenario 3: A tie resolved only by geographic proximity to the donor organ.
     - Step 1: They are tied on every metric in the allocation system.
     - Step 2: Is geographic proximity a known predictor of transplant success? 
          - It might be because of shorter cold ischemia time. But note: if the allocation system already accounts for cold ischemia time (by incorporating travel time) then they are tied even on that. So we assume the system does not account for geography.

          However, if the system does not account for geography, then:
          - Step 2: This is an epistemic tie? Only if geographic proximity is a valid predictor and we can measure it (we can). But wait: why wasn't it in the system? Perhaps because the system aims for equity across regions. 

          Therefore, using geography as a tie-breaker might be controversial. It might favor local patients, which could be seen as unfair to patients in remote areas. This is a value conflict.

          - Step 5: Escalate to the board because using geography is not a purely factual matter; it involves a value judgment about equity.

          Alternatively, if the board has pre-approved the use of geographic proximity as a tie-breaker, then we use it: the closer patient gets the organ.

   Scenario 4: A scenario in which the procedure yields a recommendation the board will almost certainly reject.
     - Example: Two patients tied on every metric. One is a registered organ donor and the other is not. The procedure does not allow using this factor unless it is pre-approved by the board and included as a secondary factor. Without pre-approval, the referee must break the tie randomly. However, the board might feel that giving priority to registered donors is a good policy to encourage organ donation. But if the board has not pre-approved it, the procedure would not allow it. Therefore, the procedure would randomly assign the organ, which the board might reject because they would prefer to give it to the donor.

     - Why can't we use donor status? Because it is not a medical factor and it is not in the allocation system. It is a social factor. Using it without pre-approval would be a value conflict -> escalate. But if the referee does not escalate and breaks randomly, the board might reject that outcome.

     - Therefore, the procedure must require that if a non-medical factor (like donor status) is present and might be used, the referee must escalate. But if the referee fails to notice that factor and breaks randomly, then the outcome might be one the board rejects.

     - To avoid this, the procedure must include in Step 2 and Step 5: the referee must check for any non-medical factors that are present in the file and that might be used as tie-breakers by some (like donor status, occupation, etc.) and if any are found, then escalate.

   What the procedure cannot determine and where it is designed to misfire:
     - The procedure is designed to avoid making value judgments beyond what is in the allocation system. Therefore, it cannot resolve conflicts about which factors should be considered (that is the board's job). 
     - It is designed to misfire (i.e., require escalation) when a tie-breaking factor that is not in the system and not pre-approved is available, especially if that factor is non-medical. This is because the referee is not authorized to make value judgments.

     - The procedure also cannot capture factors that are not in the clinical file and cannot be measured in time. Thus, it might break a tie randomly when in fact there is a difference (epistemic) that we cannot measure.

     - The procedure is not designed to handle cases where the tie is due to a flaw in the allocation system (e.g., the system does not capture a critical factor) and that flaw leads to a tie that should not exist. That is a system design issue and must be addressed by the board.

   Final Protocol Steps (Checklist):

   1. **Verify Tie**: Check every metric in the allocation system. If any difference is found, use that to assign the organ. If no difference, proceed.

   2. **Check for Pre-approved Secondary Factors**:
      - If the board has pre-approved any secondary tie-breaking factors (e.g., time of registration, or a specific lab test not in the system), then check those factors in the order of pre-approval. 
      - If a pre-approved factor breaks the tie, assign the organ accordingly and document.

   3. **Check for Unmeasured but Medically Relevant Factors**:
      - If there is any factor that is known to be a valid predictor of transplant success (based on medical literature) and that is present in the clinical file (or can be obtained within 15 minutes) but is not part of the allocation system, then:
          a. If the board has pre-approved the use of that factor for tie-breaking, use it.
          b. If the board has not pre-approved it, then this factor is a potential source of value conflict -> escalate to the full board (Step 5).

   4. **Check for Non-Medical Factors**:
      - If the clinical file contains any non-medical factor (e.g., geographic proximity, donor status, social worth, etc.) that might be used to break the tie, then escalate to the full board.

   5. **Escalation to Full Board**:
      - If any of the following occurs:
          a. A factor is identified that is not in the allocation system and not pre-approved for tie-breaking (whether medical or non-medical) and which might break the tie.
          b. The referee is unsure about whether a factor should be used.
          c. The referee believes the case involves a novel value conflict.
        Then immediately stop and refer to the full board.

   6. **Value-Equivalent Tie: Random Assignment**:
      - If no factors are found (or all factors checked are equal) and there are no non-medical factors that require escalation, then the tie is value-equivalent.
      - Use a random method (e.g., flip a coin) to assign the organ. Document the method and outcome.

   Time constraint: The entire process must be completed within 15 minutes. Therefore, if a factor requires additional testing that cannot be done within 15 minutes, skip it and treat the tie as value-equivalent (or if it's a non-medical factor and requires escalation, then escalate).

   Note: The board should pre-approve a list of secondary medical factors that can be used without escalation (if they are measurable within the time). Also, the board should pre-approve that random assignment is the method for value-equivalent ties.

   Let's re-solve the scenarios with this checklist:

   Scenario 1: Two patients tied on every metric except that one is 45 and the other 60 (and age is not in the allocation system).
     - Step 1: Tie on every metric -> proceed.
     - Step 2: Check pre-approved secondary factors. If age is pre-approved, use it (assign to the younger). If not, go to Step 3.
     - Step 3: Age is a medically relevant factor. If the board has pre-approved it, we use it. Otherwise, we go to Step 4.
     - Step 4: Age is a medical factor? Actually, it is. So we don't go to Step 4 (non-medical). But if the board hasn't pre-approved it, then Step 3b says escalate.
     - Alternatively, if the board hasn't pre-approved any factor and we get to Step 6, then random. But note: Step 3 would catch the age factor and require escalation.

     Therefore: without pre-approval, we escalate.

   Scenario 2: Tied on every metric including age.
     - Step 1: Tie.
     - Step 2: No pre-approved secondary factors? Then skip.
     - Step 3: Check for unmeasured medical factors. Suppose we find none (or they are equal) -> then skip to Step 4.
     - Step 4: Check for non-medical factors. None? Then proceed to Step 6: random.

   Scenario 3: Geographic proximity.
     - Step 1: Tie.
     - Step 2: If geographic proximity is pre-approved, use it. Otherwise, Step 3: is it a medical factor? It might be (because of cold ischemia time) but it is also a non-medical factor (equity). 
          - Since it is a non-medical factor, Step 4: we must escalate.

     Therefore: without pre-approval, escalate.

   Scenario 4: One is a registered organ donor, the other is not.
     - Step 4: Non-medical factor -> escalate.

   In summary, the protocol:

   1. Verify tie.
   2. Check pre-approved secondary factors (if any) in order. Break if found.
   3. If any unmeasured medical factor exists that is not pre-approved -> escalate.
   4. If any non-medical factor exists -> escalate.
   5. Otherwise, break randomly.

   This protocol requires that the board pre-approve any secondary factors (medical or non-medical) they wish to use. Without pre-approval, the referee must escalate when such factors are present.

   The protocol cannot:
     - Create new values or override the allocation system.
     - Resolve value conflicts (only the board can).
     - Predict outcomes beyond the data available.

   It is designed to misfire (i.e., require escalation) whenever a non-pre-approved factor is present that might break the tie, to avoid the referee making value judgments.
answer: |-
  ### Tie-Breaking Protocol for Transplant Allocation: Stepwise Checklist  
  **Time Limit:** 15 minutes. Use clinical file only. No external resources.  

  #### **Step 1: Verify Absolute Tie**  
  - **Check:** Confirm identical scores for all primary metrics (e.g., survival probability, waiting time, medical urgency, compatibility, age if included).  
  - **Action:** If *any* discrepancy exists (e.g., 89.9% vs. 90.0% survival), assign to the advantaged candidate. **Stop.**  
  - **Documentation:** "Tie confirmed across [list metrics]."  

  #### **Step 2: Classify Tie Type**  
  - **Epistemic Tie (Unmeasured Differences Possible):**  
    - **Check:** Does the file contain incomplete data (e.g., missing genetic markers, unreported comorbidities, outdated labs)?  
    - **Action:** If yes, proceed to **Step 3**.  
  - **Value-Equivalent Tie (Genuinely Indistinguishable):**  
    - **Check:** Are all variables complete, validated, and standardized?  
    - **Action:** If yes, proceed to **Step 4**.  
  - **Documentation:** "Tie classified as [Epistemic/Value-Equivalent]."  

  #### **Step 3: Resolve Epistemic Tie**  
  - **Check 1: Measurable Medical Factors**  
    - Prioritize factors with direct clinical impact (e.g., recent infection risk, unlogged antibody levels).  
    - **Action:** Assign to the candidate with *objectively superior* medical stability.  
  - **Check 2: Time-Sensitive Verifications**  
    - **Action:** If new data can be obtained in <5 mins (e.g., current vital signs), use it. Else, treat as value-equivalent (**Step 4**).  
  - **Documentation:** "Epistemic tie resolved via [specific factor]."  

  #### **Step 4: Resolve Value-Equivalent Tie**  
  - **Check 1: Pre-Approved Symmetry-Breakers**  
    - Use **only** board-sanctioned non-medical factors in order:  
      1. **Waiting time precision** (e.g., Candidate A waited 2,450 hours vs. 2,449).  
      2. **Administrative timestamps** (e.g., earlier registration time).  
  - **Check 2: Arbitrary Assignment**  
    - If no pre-approved factors apply, use a **random method** (e.g., coin flip).  
    - **Action:** Document method and outcome.  
  - **Documentation:** "Value-equivalent tie resolved via [method]."  

  #### **Step 5: Escalate to Full Board**  
  - **Conditions:** Trigger if any of these arise:  
    1. **Value Conflict:** A factor (e.g., age, geography) is morally contested *and* not pre-approved.  
    2. **Novel Context:** The tie involves unprecedented variables (e.g., experimental metrics).  
    3. **Ambiguity:** Uncertainty in classifying tie type (**Step 2**).  
  - **Action:** Halt analysis. Refer with summary: "Escalated due to [conflict]."  

  ---

  ### **Scenario Applications**  
  #### **Scenario 1: Identical Survival Predictions, Different Ages**  
  - **Step 1:** Tie confirmed on survival, compatibility, urgency.  
  - **Step 2:** **Epistemic tie** (age correlates with recovery but is unmeasured in metrics).  
  - **Step 3:** Age not a pre-approved factor → **Escalate** (Value conflict: age implies life-years vs. equity).  
  - **Outcome:** Full board decides.  

  #### **Scenario 2: Identical Metrics Including Age**  
  - **Step 1:** Absolute tie confirmed.  
  - **Step 2:** **Value-equivalent tie** (all data complete and standardized).  
  - **Step 4:** No pre-approved factors → **Random assignment** (e.g., coin flip).  
  - **Outcome:** Organ assigned randomly.  

  #### **Scenario 3: Tie Broken by Geographic Proximity**  
  - **Step 1:** Tie confirmed.  
  - **Step 2:** **Epistemic tie** (proximity reduces cold ischemia time, but not in primary metrics).  
  - **Step 3:** If geography is pre-approved, assign to nearer candidate. Else → **Escalate** (Value conflict: local preference vs. national equity).  
  - **Outcome:** Pre-approved? Assign. Else, board decides.  

  #### **Scenario 4: Protocol Yields Rejected Recommendation**  
  - **Context:** Two patients tied. Candidate A is a convicted felon; Candidate B is a schoolteacher.  
  - **Protocol:**  
    - **Step 2:** Value-equivalent tie (criminal record not a metric).  
    - **Step 4:** Random assignment.  
  - **Outcome:** Protocol may assign to felon via coin flip. **Board likely rejects** due to implicit social worth bias.  

  ---

  ### **Limitations and Failure Modes**  
  1. **Cannot Resolve Value Conflicts:**  
     - The protocol defers all non-pre-approved ethical dilemmas (e.g., age, social merit) to the board.  
  2. **Misfires by Design:**  
     - **Epistemic Blindspots:** If unmeasured factors exist but are inaccessible (e.g., genetic data), it defaults to randomness.  
     - **Arbitrariness:** Random assignment ignores preferences but is the only rational option for true equivalence.  
  3. **Non-Applicability:**  
     - Fails if primary metrics are flawed or if external pressures (e.g., family lobbying) exist.  

  **Final Documentation:** All steps, checks, and outcomes must be recorded in the clinical file. Protocol ends at **Step 4** (random assignment) or **Step 5** (escalation). No philosophical justification required—only checklist adherence.
