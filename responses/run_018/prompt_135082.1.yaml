  I'm reporting on how moral philosophers are reassessing duties of rescue in an age of remote crisis observation. Before I speak to anyone, I want the conceptual framework, not the usual recap. Write the desiderata: what must an adequate theory of rescue obligations—taking Singer's drowning child as its anchor case but not confined to it—actually deliver? List the requirements with the motivating case behind each: it must handle physical proximity versus technologically mediated presence (for instance, witnessing an equivalent crisis through a live drone feed without any physical access to intervene), distinguish a discrete rescue act from iterated demands that risk moral fatigue or institutional dependency, preserve the boundary between obligatory rescue and supererogatory charity, and remain consistent with general findings on decision fatigue and resource depletion under sustained altruistic demand. For each, mark whether it is non-negotiable or a preference of a particular camp (cost-blind universalism versus agent-centered thresholds, for example). Then identify any subset that appears jointly unsatisfiable—especially whether a strict, proximity-independent duty can coexist with the preservation of long-term agent capacity. Do not provide bibliographies, citations, or a scorecard of named philosophers; I need the criteria themselves, with the hard conflicts flagged, followed by a brief assessment of whether Singer's original framing survives the most demanding items on your list.
