answer: |-
  Here are the core desiderata for an adequate theory of rescue obligations in the contemporary context, anchored by Singer's drowning child but demanding broader scope. Conflicts and Singer's viability are assessed at the end.

  **Desiderata for an Adequate Theory of Rescue Obligations:**

  1.  **Handle Physical vs. Technologically Mediated Presence:**
      *   **Requirement:** The theory must generate equivalent moral obligations for an agent witnessing a discrete, severe crisis requiring minimal effort/sacrifice *regardless* of whether the agent is physically proximate or witnesses it via reliable real-time technology (e.g., live drone feed showing a child drowning in a remote, inaccessible location, where remote intervention *is* possible – e.g., triggering an automated life-preserver deployment).
      *   **Motivating Case:** The "drowning child" witnessed solely through a high-fidelity, interactive remote feed where the agent has a clear, low-cost means of remote intervention. Failure implies proximity is morally arbitrary in the digital age.
      *   **Negotiability:** **Non-negotiable for proximity-independent universalists (like Singer)**. **Negotiable for strong agent-centered views** relying on physical presence/causal entanglement as a necessary trigger for duty. Most modern theories *must* address this, even if conclusions differ.

  2.  **Distinguish Discrete Rescue from Iterated Demands & Moral Risks:**
      *   **Requirement:** The theory must provide criteria to distinguish a single, low-cost/high-impact rescue act (the paradigmatic case) from situations involving constant, repeated demands for similar rescues, or demands that risk creating harmful dependencies or depleting the agent's capacity for other essential moral/survival projects.
      *   **Motivating Case:** Witnessing *one* drowning child via drone vs. witnessing a constant stream of identically severe crises via multiple feeds, demanding constant intervention at significant personal cost (time, money, psychological toll). Or, interventions that inadvertently undermine local capacity, creating reliance on remote aid.
      *   **Negotiability:** **Tension Point.** *Non-negotiable* for theories acknowledging agent integrity and sustainable moral agency. *Potentially negotiable* (or severely downplayed) for strict cost-blind act-utilitarianism or strong impartial views prioritizing immediate need above all else. Distinguishing mechanisms vary significantly between camps.

  3.  **Preserve Obligation vs. Supererogation Boundary:**
      *   **Requirement:** The theory must maintain a clear(er) distinction between what is morally *required* (obligatory rescue) and what is morally *praiseworthy but beyond the call of duty* (supererogatory charity). It must avoid collapsing all preventable suffering into an overwhelming obligation that erases the category of the supererogatory.
      *   **Motivating Case:** After saving the drowning child via drone command, the agent is presented with opportunities to donate vast sums to prevent statistically certain future deaths from disease/poverty. Is this required (duty) or optional (charity)? A theory demanding both the discrete rescue *and* all subsequent maximal giving collapses the distinction.
      *   **Negotiability:** **Non-negotiable for moderate and agent-centered views** (deontological, virtue ethics, moderate consequentialism). **Effectively rejected by strong Singer-type act-utilitarianism** which sees maximizing good as obligatory, erasing supererogation. Hybrid theories seek to rebuild this boundary.

  4.  **Account for Psychological Realism (Fatigue/Depletion):**
      *   **Requirement:** The theory must be consistent with robust psychological findings regarding decision fatigue, compassion fatigue, resource depletion, and the cognitive/emotional limits of agents under sustained moral demand. It cannot posit obligations that are psychologically impossible for typical agents to fulfill consistently without catastrophic personal cost.
      *   **Motivating Case:** The agent facing the constant stream of remote crises (Desideratum 2) experiences severe anxiety, burnout, and impaired judgment/functioning in their core responsibilities (work, family, personal health). A theory demanding they continue intervening ignores the reality of human limitations.
      *   **Negotiability:** **Non-negotiable for psychologically grounded theories and those prioritizing agent sustainability.** **Often marginalized or seen as an "implementation problem" by strict cost-blind impartial views.** Considered crucial for making morality *practicable*.

  **Key Conflicts & Joint Unsatisfiability:**

  *   **The Core Tension:** The most significant conflict arises between **Proximity-Independent Duty (Desideratum 1)** and **Preserving Agent Capacity/Sustainability (Desideratum 2 & 4)**, especially when combined with the demand to avoid collapsing obligation into supererogation (Desideratum 3).
      *   A *strict*, *strong*, and *proximity-independent* duty to rescue (e.g., "Prevent severe harm if cost to you is less than the harm averted, regardless of location or medium") **appears fundamentally incompatible** with preserving long-term agent capacity and a meaningful supererogation boundary in a world of pervasive, observable, severe suffering accessible via technology.
      *   **Why?** Technological mediation (Desideratum 1) makes an *infinite* number of "drowning child"-equivalent scenarios potentially observable and intervenable. Strictly applying the proximity-independent duty to all would demand constant, maximal sacrifice (violating Desiderata 2 & 4) and erase the supererogation boundary (violating Desideratum 3). *Something must give.*

  **Assessment of Singer's Original Framing:**

  Singer's core argument ("if it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally significant, we ought, morally, to do it") **partially survives but critically falters** under these demanding desiderata:

  1.  **Survives Desideratum 1 (Proximity-Independence):** Singer's principle is explicitly proximity-independent. Witnessing via technology would be morally equivalent to physical presence for him.
  2.  **Falters on Desideratum 2 (Iterated Demands):** The original principle offers no inherent mechanism to distinguish discrete rescues from iterated demands or mitigate risks of dependency/fatigue. It pushes towards overwhelming, constant obligation if applied consistently to global suffering visible via tech.
  3.  **Falters on Desideratum 3 (Obligation vs. Supererogation):** Singer's strong formulation *explicitly aims* to collapse the traditional boundary, arguing that preventing severe suffering at less-than-morally-significant-cost *is* obligatory, not charitable. This directly violates the desideratum for many.
  4.  **Falters on Desideratum 4 (Psychological Realism):** The principle pays scant attention to psychological limits, decision fatigue, or sustainability. Demanding agents constantly apply it to all observable suffering ignores human cognitive and emotional constraints, making the demand potentially self-defeating or destructive.

  **Conclusion:** Singer's framing provides a powerful *starting point* for Desideratum 1 (technological equivalence) but **fails decisively** on Desiderata 2, 3, and 4. It embodies the core conflict: its strength in establishing a proximity-independent duty becomes its fatal flaw in the face of pervasive remote observation, as it cannot adequately handle iteration, preserve agent integrity/supererogation, or account for psychological realism without significant modification or weakening. A viable contemporary theory *must* address these limitations, likely requiring significant departures from the strong, cost-blind, act-utilitarian foundation of the original argument. The central challenge is resolving the tension between the *scope* of obligation revealed by technology and the *limits* of the moral agent.
