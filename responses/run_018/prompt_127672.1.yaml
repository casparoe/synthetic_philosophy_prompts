  Jordan counters that this is historical sanitization. They point out that all three "redemptive" examples had problematic original contexts: Masada was theocratic/slaveholding, Kosovo myth fueled ethnic violence, Dunkirk was imperial retreat. Jordan also argues that decoupling is conceptually impossible in practice - monuments inherently rehabilitate the cause.

