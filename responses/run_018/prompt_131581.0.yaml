  Below is a decision tree handout for your philosophy of language seminar. It uses concrete cases (Twin Earth and a VR deference scenario) to sort views on meaning without directly asking about "externalism." Each branch is phrased as a question answerable without technical knowledge. Typo included as requested ("seperate" in Note 1).

  ---

  ### **Semantic Decision Tree: What Fixes Meaning?**

  #### **Question 1: Twin Earth**  
  *Imagine two identical planets: Earth (liquid = H₂O) and Twin Earth (liquid = XYZ). Both have speakers who say "water." Do those speakers mean the same thing by "water"?*  
  - **No** → Go to Question 2A.  
  - **Yes** → Go to Question 2B.  

  #### **Question 2A (If "No" on Twin Earth):**  
  *In a VR community, people interact with a virtual liquid they call "water." They defer to an AI chemist for labels. The AI says the liquid is H₂O, but it’s actually a simulation of XYZ. After learning this, do speakers still refer to the **virtual liquid** with "water"?*  
  - **Yes** → **Causal-Contact Externalism**  
    *Awkward commitment:* You refer to the virtual stuff even if experts say it’s fake or wrong.  
  - **No** → **Social-Deference Externalism**  
    *Awkward commitment:* You can refer to H₂O without ever touching real water, just by trusting an AI.  

  #### **Question 2B (If "Yes" on Twin Earth):**  
  *In the same VR community, does the AI chemist’s judgment **determine** what "water" refers to?*  
  - **Yes** → **Social-Deference Externalism**  
    *Awkward commitment:* An artificial expert (with no human oversight) can fix meaning.  
  - **No** → Go to Question 3.  

  #### **Question 3 (If "No" on 2B):**  
  *Is the meaning of "water" fixed **only** by the speaker’s internal thoughts, ignoring experts and external stuff?*  
  - **Yes** → **Narrow-Content Internalism**  
    *Awkward commitment:* "Water" means the same on Earth/Twin Earth/VR, even if the liquid is fundamentally different.  
  - **No** → **Two-Dimensionalism**  
    *Awkward commitment:* Meaning shifts depending on context (e.g., "water" picks out H₂O in real worlds but XYZ in virtual ones).  

  ---

  ### **Notes for Scoring:**  
  1. **Unnamed Combo:** No branch leads to a view combining *causal contact* + *internal role*. This is **unexplored**—few argue both override social factors.  
  2. **Causal/Social Collapse:** In the VR case, causal contact (virtual stuff) and social deference (AI expert) may **overlap**. Our tree artificially forces them apart to seperate views.  
  3. **Unoccupied Answer-Pattern:**  
     - *Pattern:* "No" on Twin Earth (Q1) → "No" on VR (Q2A) → but reject both causal and social externalism.  
     - *Why empty?* **Incoherent**—denying causal contact *and* social deference after affirming Twin Earth’s importance leaves no account of meaning.  
  4. **Key Tensions:**  
     - Social-Deference Externalism appears in **two branches** (via Twin Earth "Yes" or VR "No").  
     - Two-dimensionalism is the catch-all for mixed intuitions.  

  --- 

  **How to Use:** Answer each question based on intuition. The "awkward commitment" highlights a consequence of each view. Discuss where your answers land!
