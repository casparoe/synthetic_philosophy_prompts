answer: |-
  You've hit on a profoundly important and subtle phenomenon in conceptual visualization within normative/philosophical fields. While there isn't a single, universally accepted *canonical* term for *exactly* this cyclical defense mechanism, several established concepts intersect to describe it, and we can synthesize a precise description.

  **The Core Phenomenon & Its Name:**

  This is **Ontological Smuggling via Diagrammatic Bait-and-Switch**. It combines:

  1.  **Ontological Commitment:** The diagram inherently assumes a specific structure of reality (e.g., values as discrete boxes, linear causality).
  2.  **Smuggling:** These commitments are presented as neutral, inherent in the "data" or the "obvious way" to visualize, rather than as theoretical choices.
  3.  **Bait-and-Switch Defense:** When challenged on the *theory*, defenders retreat to "it's just a visualization." When using it to *support* their argument, they implicitly rely on its *ontological claims*. This cyclical defense exploits the ambiguity between the diagram as *heuristic* and as *representational*.

  **Distinguishing from Neurath's Project (Confidence: High):**

  *   **Neurath's Goal (ISOTYPE):** **Radical Visual Empiricism & Anti-Metaphysics.** Neurath aimed for pictures representing *observable, countable facts* (e.g., number of ships, tons of coal) using standardized pictograms. He explicitly wanted to *avoid* embedding theoretical interpretations or metaphysical claims *within* the pictorial language itself. The pictogram for "coal" shouldn't imply a theory of geology or economics; it should just denote coal. Its universality came from grounding in intersubjectively observable *things*.
  *   **The Phenomenon You Describe:** **Theory-Laden Visualization Presented as Neutral.** These diagrams (flowcharts, layered stacks) are inherently abstract and *interpretive*. They represent *concepts* (value, alignment, consciousness), not countable objects. Their structure (hierarchy, linearity, discreteness, omission) *embodies* a specific theoretical stance about how those concepts relate and what their fundamental nature is. The "smuggling" occurs precisely because this theoretical stance is masked by the presentation of the diagram as a mere "map" or "pipeline," echoing Neurath's *rhetoric* of neutrality while violating his *principle* by embedding deep theoretical/metaphysical commitments.

  **Distinguishing from Plain Reification (Confidence: High):**

  *   **Plain Reification:** Treating an abstract concept *as if* it were a concrete object or property. (e.g., "Society decided..." as if "Society" is a single thinking entity). This is often a *linguistic* fallacy.
  *   **This Phenomenon:** **Reification *plus* Diagrammatic Rhetoric *plus* Cyclical Defense.** The diagram *enacts* reification visually (turning "value" into a discrete box, "consciousness" into stacked layers). However, the unique aspects are:
      *   The **visual medium** lends an air of objectivity and concreteness that pure language sometimes lacks.
      *   The **explicit claim (or strong implication) of neutrality** for the visualization itself.
      *   The **strategic, cyclical defense mechanism:** invoking neutrality ("just a picture!") when the *theory* is attacked, but invoking representational accuracy (the *ontology implied by the picture*) when *using* it to make an argument. This defense shields the underlying reification from direct critique.

  **Related Established Concepts (Confidence: Medium-High on relevance, Low-Medium on being a *perfect* single label):**

  1.  **Theory-Ladenness of Observation/Representation (Hanson, Kuhn):** All data/representations are shaped by the theories/concepts of the observer/creator. Your case is a specific *visual* and *rhetorical* manifestation of this, where the theory-ladenness is actively denied.
  2.  **Reification (Lukács, Adorno, Latour):** As above, but the diagrammatic form and defense mechanism make it a distinct subtype.
  3.  **Conceptual Metaphor (Lakoff & Johnson):** The diagrams often rely on deep conceptual metaphors (e.g., CONSCIOUSNESS IS A LAYERED STRUCTURE, VALUE IS A DISCRETE OBJECT, CAUSALITY IS LINEAR FLOW). The problem arises when these metaphors are presented not as cognitive tools, but as literal descriptions of reality.
  4.  **Rhetorical Trope of "Neutral Description":** A classic move in philosophy/science to present a contested interpretation as mere fact. The diagram amplifies this.
  5.  **Latour's "Immutable Mobiles":** Diagrams are powerful tools for stabilizing knowledge and making it portable. Your point highlights how they *also* stabilize and transport *hidden ontologies and commitments* under the guise of neutrality.
  6.  **Begging the Question (in visual form):** The diagram assumes the very ontological structure it's used to argue for.

  **Your Hunch about Neurath (Confidence: High that your distinction is correct, Medium on nuances within Vienna Circle):**

  You are **correct** to sense a difference. Neurath was deeply skeptical of metaphysics and aimed for visualizations grounded in protocol sentences about observable phenomena. **Key distinctions:**

  *   **Neurath vs. Carnap/Schlick:** While all Vienna Circle members were anti-metaphysical, Neurath was *particularly* vehement about the social/political dimensions of language and the dangers of "pseudo-rationalist" systematization. He saw ISOTYPE as a tool for democratic education, avoiding the theoretical jargon that could hide elite assumptions. Carnap, while sharing the goal of clarity, was more focused on formal, logical reconstruction. Schlick was more focused on verificationism.
  *   **Your Phenomenon vs. Neurath:** The diagrams you describe are *precisely* the kind of "pseudo-concrete" representations Neurath would likely criticize. They use the *form* of a neutral technical diagram (echoing his ideal) but embed abstract, contested, *potentially metaphysical* concepts and structures within it. They lack the grounding in countable, observable *things* that ISOTYPE demanded. Neurath wanted pictures to *avoid* theoretical disputes about interpretation; these diagrams *embody* and *mask* such disputes.

  **Least Confident Point (Confidence: Low-Medium):**

  My least confident point is whether there is a **single, universally recognized, canonical term** *exclusively* for this *specific cyclical defense mechanism* applied to *conceptual diagrams in normative domains*. While "ontological smuggling," "diagrammatic bait-and-switch," or "visual reification with cyclical defense" accurately describe it, these are somewhat synthetic labels drawing on established concepts rather than a single pre-existing technical term everyone in philosophy uses. The *phenomenon* is widely recognized, but the *precise label* for the full rhetorical dance isn't standardized. Philosophers might describe it using combinations of the terms above ("This diagram smuggles in ontological commitments via reification and then employs a bait-and-switch defense...").

  **Conclusion:**

  You've identified a crucial intellectual maneuver: **using conceptual diagrams as Trojan Horses for ontological commitments within normative debates, shielded by a cyclical defense that toggles between claiming the diagram is merely illustrative and inherently representational.** While not having one perfect canonical name, it's a clear instance of **visually enacted, rhetorically defended ontological smuggling/reification**, fundamentally opposed to Neurath's project of theory-avoiding pictographic fact-representation. Calling it out requires pointing to the specific commitments embedded in the *visual structure* (discreteness, linearity, hierarchy, omission) and highlighting the inconsistency in how the diagram's status is defended. This is a powerful form of unacknowledged philosophical persuasion.
