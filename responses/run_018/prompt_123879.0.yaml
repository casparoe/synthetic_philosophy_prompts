  I'm in this grad seminar on strategic reasoning and we got into a weird argument about iterated dominance. The standard story is you eliminate pure strategies first then do the same for mixed ones, and everyone acts like it's just the same logic with probabilites added.

  But I'm convinced that's wrong in a specific way: once you allow mixing, the mixture you use to dominate strategy B can include strategy C, and if C later gets eliminated because it's dominated by D, then the mixture that eliminated B is no longer in the reduced game. So B's elimination was justified by a strategy profile that doesn't survive the reduction itself. In pure-strategy elimination this can't happen because a pure strategy doesn't 'contain' other strategies. Can you make the argument that this dependancy means the pure-strategy-to-mixed-strategy generalization actually introduces a kind of circularity or path-dependence that breaks the clean ordering we get with pure strategies? I don't need citations or a bibliography, just the conceptual argument laid out.

