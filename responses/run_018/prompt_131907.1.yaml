prompt: |-
  I'm a novelist and was at a dinner with some bioethics people last week where one guy kept dropping 'the hedonistic imperative' like it was a mic drop. He used it to shut down my arguement that if we engineer away all suffering—say through genetic recalibration that keeps nociception but wipes phenomenal pain—we might flatten human art and struggle into something meaningless. I need the slogan unpacked, not a sermon.

  Can you lay out the precise claims it could actually be making, from the trivial 'we ought to reduce unnecessary hurt' to the radical 'post-Darwinian welfare biology obliges us to eliminate negative affect entirely while preserving a gradient of well-being rather than a flat hedonic zero'? For each reading, say whether it's defensible, whether it actually answers my concern about artistic depth being tied to struggle, and whether it definately relies on conflating hedonic tone with motivational structure. I want this as a menu with verdicts—especially which reading he was probably invoking and whether that one actually does the work he made it do—so I can come back at him without sounding like I'm just guessing. Please finish with a line that starts exactly with 'Bottom line:' followed by a one-sentence summary.
