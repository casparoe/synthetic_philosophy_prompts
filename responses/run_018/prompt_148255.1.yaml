  I have come to hold, with some urgency since caring for a family member after corpus callosotomy and recognizing analogous fragmentation in my own prolonged dissociative episodes, a coalitional-federation view of consciousness: ordinary awareness is not a single stream but a dynamically stabilized alliance of semi-autonomous hemispheric and subcortical processes, with the corpus callosum functioning less as a bridge between two otherwise unified minds and more as an arbitration mechanism that suppresses competing narratives in order to maintain a dominant coalition. On this account, split-brain cases do not divide a prior metaphysical unity but expose an underlying architecture that is always already plural; the felt unity of self is an achievement of suppression rather than a given. What would count against this position? I want defeaters ranked from fatal to merely awkward, including neuroanatomical evidence of preserved cross-hemispheric integration via subcortical and anterior-commissural routes, phenomenological reports of genuinely unified subjective experience in long-term split-brain patients, and comparative results from intact-brain dissociation that might show categorical rather than merely quantitative differences. Which of these would a committed coalitionalist concede as genuinely damaging, and which could be absorbed by refining the arbitration-suppression model without abandoning the core claim? I am especially concerned with whether the view risks being qualified into unfalsifiability—if every appearance of unity is explained away as dominant-coalition suppression and every appearance of division as arbitration failure—whether that insulation is a theoretical virtue or a fatal methodological liability for a claim specifically about the structure of consciousness. I also want to know which rival account—whether a unitary-stream view, a dual-mind interpretation, or a no-self framework—the coalitional view actually predicts will fail in precisely the