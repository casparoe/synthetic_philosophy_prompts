  The query shows deep methodological sophistication. The user clearly identifies a problem in existing literature where scholars conflate different explanatory targets and treat competing theories as answering identical questions. Their frustration with this conflation suggests they're preparing for serious theoretical work, possibly doctoral research or a monograph. The demand for falsification criteria and "parallel-worlds constraint" indicates they value testability over descriptive plausibility.

  For Section 1, I'll need to clarify that while a theory can specialize in one explanatory target, claiming to explain "why some nations are rich" obligates coverage of cross-sectional variance as a minimum. Specialization in temporal trajectories would sacrifice comparative explanatory power, while focusing only on counterfactuals would make the theory untestable with real-world data.

  For Section 2's seven desiderata, I should highlight that (a) requires explaining reversals of fortune without presupposing institutional primacy. For (b), I'll emphasize that causal institutions must demonstrate autonomy from geographic determinism through cases where geography and institutions diverge. The Scandinavian cases in (d) are crucial here. For (g), the parallel-worlds constraint, I'll note that theories often fail by retrofitting causes to known outcomes.

  In Section 3's negotiability audit, I'll argue that falsifiability (f) and causal priority (c) are non-negotiable for any scientific claim, while others like the de jure/de facto distinction (e) might be camp-specific. Falsifiability likely excludes the most existing theories since many cultural explanations are non-refutable.

  For Section 4's contender sketch, I'll show how institutionalism struggles with (a) by assuming institutions are always primary, geographic determinism fails (d) by not explaining Scandinavia, and cultural theories violate (f) through unfalsifiable claims about norms. No theory currently satisfies all seven desiderata simultaneously.

  The British English requirement means I'll use spellings like "favourable" and "institutionalisation" throughout. Since they explicitly forbid citations, I'll discuss theories generically (e.g., "standard institutionalist account") without mentioning Acemoglu or Diamond.
answer: |-
  ### Section 1 — The Explanatory Target (approx. 200 words)
  A theory claiming to explain "why some nations are rich" must primarily address **cross-sectional variance** – why nations differ in wealth levels at a single point in time (e.g., why the UK was richer than India in 1900). This is the core target for explaining comparative prosperity. Explaining a **single polity’s temporal trajectory** (e.g., why Britain industrialised when it did) is distinct, focusing on internal dynamics over centuries. While valuable, a theory specialising solely here risks being non-comparative and may miss factors explaining why *other* nations didn’t follow similar paths. **Counterfactual resilience** (e.g., how India’s path might have differed without British colonisation) probes the theory’s robustness under altered initial conditions, assessing causal depth rather than actual history.

  It is *legitimate* for a theory to focus primarily on one target, but this carries explanatory costs. A cross-sectional theory may struggle with historical processes driving change within nations. A temporal trajectory theory might lack generalisability across contexts. A counterfactual-focused theory risks becoming untestable if divorced from observable variance. A theory claiming to explain *comparative* national prosperity must, at minimum, adequately account for cross-sectional variance; neglecting this core target fundamentally undermines its central claim.

  ### Section 2 — The Desiderata (approx. 700 words)
  Any adequate causal-historical theory of long-run national prosperity must satisfy these logically motivated requirements:

  *   **(a) Handling Reversal of Fortune Non-Reductively:** The theory must explain the robust empirical pattern where regions with high pre-colonial population density (e.g., Mughal India, Aztec Mexico) often became relatively poor post-colonisation, while sparsely populated areas (e.g., North America, Australia) became rich. Crucially, it must do so *without* presupposing that the reversal *automatically* proves institutional causation (e.g., that colonisers always installed "bad" institutions in dense areas). Alternative mechanisms like disease burdens, resource depletion, or specific colonial strategies unrelated to inherent institutional "quality" must be viable explanations within the framework. *Motivation:* Avoiding circularity where the outcome (poverty) is used to infer the cause (extractive institutions) in these cases.
  *   **(b) Distinguishing Causal Institutions from Geographic Epiphenomena:** The theory must provide a clear criterion for identifying when institutions are genuine causal drivers of prosperity, rather than merely reflecting prior geographic advantages (e.g., fertile land enabling surplus, which then supports state formation). This requires identifying instances where institutional quality demonstrably *diverges* from underlying geographic potential or persists/changes independently, exerting its own influence. *Motivation:* Preventing geographic determinism by stealth, where institutions are mere intermediaries lacking independent causal power.
  *   **(c) Causal Priority Beyond Chronology:** Given the deep entanglement of geography, culture, and institutions throughout history, the theory must establish a principle of causal priority that does *not* rely solely on temporal sequence (e.g., "geography came first, so it's fundamental"). It must articulate how one factor exerts a *structuring* influence on the others or possesses greater causal *depth* or *leverage*, even if all appear simultaneously observable in macro-historical data. *Motivation:* Temporal precedence alone is insufficient for causal primacy; deeper logical or functional relationships must be specified to avoid arbitrary prioritisation.
  *   **(d) Consistency with Scandinavian and Resource-Curse Paradoxes:** The theory must coherently explain both: (i) cases like Scandinavia, where high prosperity and institutional quality emerged despite relatively adverse geography (poor soils, harsh climate), and (ii) resource-curse cases (e.g., Venezuela, DRC), where abundant geographic endowments correlate with weak institutions and poor outcomes. *Motivation:* These are crucial "deviant cases" testing the theory's universality and its ability to handle complex interactions where endowments and outcomes diverge from simple predictions.
  *   **(e) De Jure vs. De Facto Distinction:** It is mandatory for the theory to rigorously separate formal, written rules (de jure institutions) from the actual distribution of power and informal practices governing behaviour (de facto power relations). Conflating them, by (e.g.) assuming written constitutions accurately reflect real power, fatally undermines causal explanation. The theory must explain *why* de jure rules sometimes diverge from de facto power (e.g., elite capture, weak enforcement) and how this divergence impacts outcomes. *Motivation:* Real causal power often resides in de facto structures; ignoring this leads to misleading attributions of causality to formal but ineffective rules.
  *   **(f) Specification of Falsification:** The theory must clearly define what empirical evidence would *falsify* its core causal claims, not just fail to confirm them. This is particularly vital where culture and institutions are observationally equivalent (e.g., high trust could be culturally ingrained *or* institutionally reinforced). Falsification tests might involve identifying cases where the purported cause is present without the effect, or the effect occurs without the cause, in ways the theory strictly forbids. *Motivation:* To ensure the theory is genuinely scientific and testable, moving beyond unfalsifiable narratives, especially concerning deeply intertwined concepts like culture and institutions.
  *   **(g) The 'Parallel-Worlds' Constraint:** For pairs of nations with broadly similar initial geographic and cultural conditions that subsequently diverged significantly in prosperity (e.g., North vs South Korea, Haiti vs Dominican Republic), the theory must identify a specific, identifiable "branching factor" *at or near the point of divergence*. This factor cannot be defined *post-hoc* simply as "whatever caused the divergence," nor can it be an inherent difference disguised as initial similarity. *Motivation:* To demonstrate the theory’s ability to explain divergence without tautology and to identify specific, non-predetermined causal mechanisms driving historical paths.

  **Potential Contradiction:** Desiderata **(b)** (distinguishing causal institutions from geographic epiphenomena) and **(c)** (establishing causal priority beyond chronology) may be *jointly unsatisfiable* for theories that are fundamentally *interactionist*. If geography, culture, and institutions are in constant, mutually constitutive feedback loops over the *longue durée*, isolating one as "causally prior" or distinguishing institutions as non-epiphenomenal may be inherently arbitrary. An interactionist theory might struggle to provide the clear causal hierarchy demanded by (b) and (c) without violating its core premise.

  ### Section 3 — Negotiability Audit (approx. 250 words)
  *   **(a) Reversal of Fortune Handling:** **Non-negotiable.** Any theory ignoring this robust pattern lacks empirical adequacy for the post-1500 world.
  *   **(b) Distinguishing Causal Institutions:** **Camp-specific preference (Anti-Geographic Determinism).** Theories emphasising geography might see institutions as largely epiphenomenal; institutionalists reject this. The *need* to address the distinction is non-negotiable; *how* it resolves it defines the camp.
  *   **(c) Causal Priority Principle:** **Non-negotiable.** A theory must articulate *why* it prioritises its chosen factor(s), beyond mere temporal sequence, to make a coherent causal claim.
  *   **(d) Scandinavian/Resource-Curse Consistency:** **Non-negotiable.** Failure here indicates a lack of scope or explanatory power for significant real-world cases.
  *   **(e) De Jure/De Facto Distinction:** **Non-negotiable.** Ignoring this distinction renders causal claims about institutions empirically shallow and likely misleading.
  *   **(f) Specification of Falsification:** **Non-negotiable.** Without this, the theory is not scientific but merely interpretive. This is fundamental to causal claims.
  *   **(g) Parallel-Worlds Constraint:** **Non-negotiable.** Explaining divergence is core to causal claims; failure here suggests post-hoc rationalisation.

  The requirement doing the most work in excluding existing explanations is **(f) Specification of Falsification.** Many cultural explanations, and some overly broad institutional or geographic accounts, rely on narratives that are difficult or impossible to falsify with macro-historical data, especially given observational equivalence issues. They often explain outcomes but lack clear criteria for what would prove them wrong.

  ### Section 4 — Brief Contender Sketch (approx. 350 words)
  *   **Standard Institutionalism (Inclusive vs Extractive):** Focuses heavily on cross-sectional variance and reversal of fortune **(a)**, typically attributing it directly to colonial institutions. Struggles significantly with **(b)**, often downplaying how geography shapes institutional possibilities or conflating institutional outcomes with inherent "quality". Its causal priority **(c)** relies on institutions shaping economic incentives, but struggles to explain their deep origins *without* invoking prior geography or culture. Handles Scandinavia **(d)** via "good" institutions overcoming geography, but resource curses challenge its narrative, often requiring ad-hoc additions (e.g., "point-source resources lead to extractive institutions"). Distinguishes de jure/de facto **(e)** unevenly, sometimes equating formal property rights with real security. Falsification **(f)** is problematic; finding poor nations with "inclusive" institutions or rich ones with "extractive" ones is often explained away as misclassification or temporary. Parallel-worlds cases **(g)** like the Koreas are cited but lack a general branching mechanism beyond specific historical contingencies (e.g., Soviet vs US influence).
  *   **Geographic Determinism (Endowments/Climate):** Excels at explaining initial conditions and early trajectories. Fundamentally challenged by **(a)** reversal of fortune; struggles to explain why initially unfavourable areas prospered. Fails **(b)** by definition, seeing institutions as derivative. Its causal priority **(c)** is temporal/ecological, but struggles to explain divergence where geography is similar. Fails **(d)** spectacularly on Scandinavia (too cold/poor) and resource curses (should be beneficial). Lacks focus on de jure/de facto **(e)** as power is seen as flowing from geography. Falsification **(f)** is relatively clear (find prosperous nations in inherently unfavourable geographies, like Scandinavia), which it fails. Parallel worlds **(g)** with similar geography but divergent outcomes (e.g., Haiti/DR) are major anomalies it cannot explain.
  *   **Culture-Focused Explanation (Norms/Social Capital):** Can address temporal trajectories and specific divergences **(g)** through cultural shifts or persistence. Faces immense difficulty with **(a)** reversal of fortune – did dense populations have "poor" cultures? Hard to reconcile. Struggles with **(b)**, as culture may be shaped by geography or institutions. Causal priority **(c)** is murky; culture is deep-rooted but how it changes is often underspecified. Can explain Scandinavia **(d)** via strong work ethic/trust, but struggles with resource curses (why doesn't resource wealth foster "good" culture?). De jure/de facto **(e)** distinction is crucial but often blurred (culture shapes both). Its Achilles heel is **(f) falsification;** cultural traits are often inferred from outcomes (prosperous nations = have "good" culture), making claims observationally equivalent and unfalsifiable. Proxies for culture are contested and hard to measure historically.
