  ### In-Class Activity: The Limits of Revealed Preference

  **Objective:** To expose students to the conceptual tensions in revealed preference theory—specifically, the risk of tautology, non-identification of cardinal utility, menu-dependence, the belief-risk ambiguity, and the indeterminacy of error versus preference—through experiential learning.

  **Roles and Materials:**
  - **18 Students:** 9 Choosers (optimize private payoff functions) and 9 Observers (work in 3 teams of 3, each team assigned 3 named Choosers).
  - **Materials:** 
    - Index cards (for Chooser payoff functions).
    - Projector (display budget lines; no student laptops needed).
    - Slips of paper (for Choosers to write chosen bundles).
    - Whiteboard or poster paper (for recording choices and predictions).
    - Prize: Chocolate bars for top-performing Choosers/Observers (based on points).
  - **Payoff Functions:** Defined over integer bundles of abstract goods "A" and "B" (e.g., \(U_1(A,B) = A \times B\), \(U_2(A,B) = (A \times B)^2\)). Points convert to prizes (e.g., 1 point = 1 entry in a prize draw).

  **Setup (5 min):**
  1. **Assign Roles:** Randomly assign 9 Choosers and 9 Observers. Group Observers into 3 teams (3 students each). Each team is assigned 3 Choosers (label Choosers 1–9 visibly).
  2. **Explain Rules:**
     - **Choosers:** Receive a private index card with a payoff function (e.g., "Maximize \(A \times B\)"). They earn points based on their chosen bundle (e.g., for \(U = A \times B\), choosing (3,4) yields 12 points). **Exception:** One Chooser (planted) has a card: "Minimize your points. Consistently choose the worst bundle. Do not reveal this."
     - **Observers:** Teams observe only budget lines and chosen bundles for their assigned Choosers. Their goal: recover preferences to predict future choices.
     - **Budget Lines:** Displayed via projector (e.g., \(P_A A + P_B B \leq I\)). Bundles are non-negative integers.
     - **Flow:** Multiple rounds of choices → predictions → revelations → discussion.
  3. **Distribute Cards:** Give Choosers their index cards (see **Payoff Functions** below). Observers never see cards.

  ---

  ### Activity Timeline (60 min)

  #### **Phase 1: Fitting Rounds (15 min)**
  - **Goal:** Observers fit preferences to choice data; Choosers optimize.
  - **Budget Lines (display sequentially for 3 min each):**
    - Round 1: \(A + B \leq 10\) (e.g., bundles: (0,10), (5,5), (10,0))
    - Round 2: \(2A + B \leq 10\) (e.g., bundles: (0,10), (5,0))
    - Round 3: \(A + B \leq 5\) (nested with Round 1; tests WARP)
    - Round 4: \(A + 3B \leq 9\) (crossing; tests GARP)
  - **Process:**
    1. Project budget line; Choosers write their bundle choice on a slip.
    2. Facilitator collects slips and displays choices per Chooser (by ID) on the board.
    3. Observers record choices and sketch indifference curves/rankings for their Choosers.
  - **Key Design:** Include crossing/nested budgets to generate comparable/non-comparable bundles.

  #### **Phase 2: Out-of-Sample Test (10 min)**
  - **Goal:** Test if recovered preferences predict better than a baseline.
  - **Process:**
    1. Announce new budget line: \(3A + B \leq 9\).
    2. **Observer Prediction (3 min):** Each team predicts bundles for their 3 Choosers. Write predictions publicly.
    3. **Baseline Prediction (facilitator computes):** For each Chooser, "most similar" prior budget (by slope \(P_A/P_B\) and income \(I\)). Reuse the choice from that budget (e.g., if Round 2 has the closest slope, use Round 2’s choice).
    4. **Choosers choose (2 min):** Record actual choices.
    5. **Scoring (3 min):** Award 1 point per correct prediction (Observers). Compare Observer vs. Baseline accuracy on board.
  - **Debrief Hook:** "Did your model beat the baseline? What does this say about the empirical content of utility maximization?"

  #### **Phase 3: Non-Identification (10 min)**
  - **Goal:** Show that different cardinal utilities yield identical choices.
  - **Process:**
    1. **Reveal (2 min):** "Two Choosers had different payoff cards but identical choices." Display choices for pre-selected pair (e.g., Chooser 1: \(U = A \times B\) vs. Chooser 2: \(U = (A \times B)^2\)).
    2. **Observer Discussion (3 min):** Teams: "Could you distinguish these Choosers? What does this imply for 'utility'?"
    3. **Show Cards (2 min):** Reveal both cards. Highlight: Same ordinal ranking, different cardinal values (e.g., (2,2) yields 4 vs. 16 points).
  - **Key Design:** Use \(U_1 = A \times B\) and \(U_2 = (A \times B)^2\). They make identical choices on all displayed budgets.

  #### **Phase 4: Menu-Dependence and Framing (15 min)**
  - **Goal:** Show choices change with framing, not just budgets; hint at belief-risk ambiguity.
  - **Process:**
    1. **Framing Round (5 min):** 
       - Same budget: \(A + B \leq 10\).
       - **Chooser 6:** Standard prompt ("Choose any bundle with \(A + B \leq 10\)").
       - **Chooser 7:** Framed prompt ("You are given (0,10) by default; you may switch to any bundle with \(A + B \leq 10\)").
       - Record choices. Most Chooser 6s pick (5,5); Chooser 7s often pick (0,10) or (10,0) due to framing.
    2. **Belief-Risk Round (7 min):** 
       - **Urn Setup:** Show an urn with red/blue marbles (unknown ratio). Acts yield tokens (simplified to one good to save time).
       - **Acts:** 
         - Act X: 10 tokens if red, 0 tokens if blue (expected tokens = \(10p\)).
         - Act Y: 4 tokens for sure.
       - **Choosers choose (2 min):** Record choices (all use the same token-based payoff).
       - **Observer Task (3 min):** Teams: "For one Chooser, state: (1) Belief about probability of red (\(p\)), (2) Risk attitude (risk-averse/neutral/seeker)."
    3. **Reveal (2 min):** Show that a choice (e.g., Act Y) fits multiple \(p\)/risk combos (e.g., \(p=0.3\) + risk-neutral OR \(p=0.5\) + risk-averse).
  - **Key Design:** Belief-risk trade-off uses tokens to avoid bundle complexity. No separate utility cards; payoff is linear in tokens.

  #### **Phase 5: Planted Error (Ongoing, revealed in Debrief)**
  - **Process:** The planted Chooser (e.g., ID 8) always chooses a low-point bundle (e.g., (0,0) when (1,0) is better). Observers see violations (e.g., WARP failures). In debrief, reveal the card and discuss.

  ---

  ### Debrief (15 min)
  **Map to Theory:**
  1. **Gains/Losses of Revealed Preference (3 min):**  
     - Gain: Lets us model behavior without mental states.  
     - Loss: "Utility maximization" risks being a relabeling exercise. Empirical content comes from consistency (WARP/GARP) and out-of-sample prediction—not the definition itself.
     
  2. **Non-Identification (3 min):**  
     - Cardinal utility magnitudes aren't pinned down (as with \(A \times B\) vs. \((A \times B)^2\)).  
     - Belief and risk attitude can’t be separated (belief-risk round).  
     - Framing affects choice independently of preferences (menu-dependence round).

  3. **Three Meanings of "Utility" (5 min):**  
     | **Reading**            | **Bookkeeping Device** | **Psychological Magnitude** | **Well-Being Currency** |
     |-------------------------|------------------------|-----------------------------|--------------------------|
     | **Definition**          | Represents choice      | Measured by choice (with error) | Quantifies welfare      |
     | **Decoy Example**       | Framing is data to fit | Framing distorts true preference | Framing doesn’t alter welfare |
     | **Planted Error**       | Must fit odd choice    | Suggests a mistake          | Error may not reduce welfare |
     - **Conclusion:** Disagreements arise from these meanings. More choice data can’t resolve them.

  4. **Open Question (2 min):**  
     - Does revealed preference tell us what utility *is*, or only what we can *say* about it? End by inviting reflection: "Where do *you* stand after today?"

  ---

  ### Predictable Problems and Solutions
  1. **Choosers Fail to Optimize:**  
     - *Problem:* Complex functions cause mistakes (e.g., miscomputing min/max).  
     - *Handling:* Use simple functions (\(A \times B\), \(A + B\), min(\(A,B\))). Run a practice round (e.g., \(A + B \leq 2\)) to train. Award points even for suboptimal choices to keep engagement.

  2. **Observers Smuggle Assumptions:**  
     - *Problem:* Assume "A = food, B = leisure" and infer preferences.  
     - *Handling:* Pre-activity warning: "Goods are abstract; no real-world meanings." Debrief explicitly if teams mention assumptions.

  3. **Decoy Spotted and Gamed:**  
     - *Problem:* A Chooser notices the decoy and avoids (0,10) to "trick" Observers.  
     - *Handling:* Most students won’t spot it. If they do, use it in debrief: "This shows framing *can* be resisted—but in practice, it often isn’t."

  4. **Scoring Round Time Drain:**  
     - *Problem:* Observers debate baseline similarity.  
     - *Handling:* Pre-define "most similar" as closest slope (\(P_A/P_B\)), then income. Compute baseline yourself during the round.

  5. **Chooser Error Choice:**  
     - We planted one error-maker. *Cost:* Observers may dismiss it as a "setup" or assume all anomalies are errors, missing the preference-vs-error ambiguity. Mitigate by normalizing odd choices early (e.g., "Some preferences may surprise you").

  ---

  ### What the Activity Cannot Deliver
  1. **Full Formal Results:**  
     - The activity uses finite budgets, so it can’t *prove* that WARP/GARP imply utility representations. The facilitator must state this post-activity.

  2. **Belief-Risk Tangle in Depth:**  
     - The urn round simplifies to tokens due to time. The facilitator must clarify afterward: "With more acts, we’d see the observational equivalence of belief and risk aversion."

  3. **Philosophical Resolution:**  
     - The three utility meanings won’t be reconciled experientially. The facilitator must articulate the debate: "Is utility real, or a modeling tool?"

  **Why?** These require mathematical proof (1), iterative choice data (2), or conceptual nuance (3) that a 75-minute activity can’t generate. The value is in creating discomfort, not formal closure.
