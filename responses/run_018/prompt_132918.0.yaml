answer: |-
  ### Decision Tree: The Heterogeneity Problem for Hedonism  
  *What do all "pleasures" have in common?*  

  #### Root Branch: **Is there a shared phenomenal quality ("hedonic tone") that all pleasures share?**  
  - **Yes** → *Phenomenal approaches*  
    - **Split**: Is this quality uniform across all modalities (taste, sex, intellect, etc.)?  
      - **Yes** → **Leaf 1: Uniform Quality View**  
        *Awkward commitment*: Must deny that orgasms and solving a math proof feel subjectively different—they’re identical "feels" except in intensity.  
      - **No** → **Leaf 2: Family Resemblance View**  
        *Awkward commitment*: No universal property binds pleasures, so grouping "sunset awe" and "chocolate taste" is arbitrary (like grouping games with no common rules).  

  - **No** → *Non-phenomenal approaches*  
    - **Split**: Is the unity **relational** (based on attitudes) or **functional/teleological** (based on evolutionary role)?  
      - **Relational** → *Defined by mental/behavioral relations*  
        - **Split**: What kind of relation?  
          - **Desire-based** → **Leaf 3: Desire-Based View**  
            *Awkward commitment*: Masochists "desire pain," so pain *is* pleasure—denies intuitive distinction.  
          - **Approval-based** → **Leaf 4: Approval-Based View**  
            *Awkward commitment*: Must count "disapproving of your own addiction" as *not* pleasurable, even if you crave it.  
          - **Continuation-desired** → **Leaf 5: Cross-Modal Convergence View**  
            *Awkward commitment*: Forces you to say aesthetic awe and a sugar rush are the *same mental state* because you’d want to prolong both.  
      - **Functional/Teleological** → *Defined by survival role*  
        - **Split**: Is the function unified or dissociated?  
          - **Unified function** → **Leaf 6: Functional View**  
            *Awkward commitment*: Sugar rushes and moral pride must be identical (both "rewards"), ignoring wild differences in experience.  
          - **Dissociated modules** → **Leaf 7: Modular Dissociation View**  
            *Awkward commitment*: "Pleasure" isn’t real—just a language trick grouping unrelated neural circuits (e.g., food vs. music rewards).  

  ---

  #### Key Ambiguities & Unoccupied Territory  
  - **Blurred Leaves**:  
    - **Desire-Based (Leaf 3) vs. Functional (Leaf 6)**: If desires track survival functions (e.g., wanting food), these collapse. But they diverge when desires are maladaptive (e.g., addiction).  
    - **Cross-Modal Convergence (Leaf 5) vs. Functional (Leaf 6)**: Wanting to continue a state (e.g., curiosity) ≠ it being a survival reward (e.g., curiosity may waste time).  
  - **Unoccupied View**:  
    - *Phenomenal uniformity without relational/functional backing*: Claims pleasures share a uniform feel, but this feel has no motivational or survival role.  
    - **Status**: Likely **incoherent**—if a state has a "pleasurable feel," we instinctively desire/approve it, making relational ties unavoidable.  

  ---

  **Visual Summary**  
  ```  
  Root: Shared Phenomenal Quality?  
  ├─ Yes → Uniform? → Uniform Quality (1) / Family Resemblance (2)  
  └─ No → Relational or Functional?  
     ├─ Relational → Desire-Based (3) / Approval-Based (4) / Cross-Modal Convergence (5)  
     └─ Functional → Unified Function (6) / Modular Dissociation (7)  
  ```  
  *7 leaves total.*
