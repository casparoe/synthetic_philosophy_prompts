  The structure is:
  1. Agreed Claims (numbered list)
  2. Disagreements Table (with rows phrased in wording each side accepts for itself)
  3. Cruxes (with concrete cases and predictions)

  Cruxes must include:
  (a) Biological substrate continuity for first-person continuity
  (b) Split-echo problem (if reconstructed in two brains at ~80% fidelity after death, do they share one 'I' or split?)

  Also include a concrete case: long-term bilateral cortical-bridge thought experiment.

  And ask whether any part is purely verbal.

  Keep it casual.

  Let's build step by step.

  **First, Agreed Claims (about what brains do, patterns, persistence):**

  We need points both sides agree on. These might include:

  - Brains process information and support conscious experiences.
  - Patterns (like memories, personality traits) can be represented in neural activity and structure.
  - Persistence of an individual over time, in the ordinary biological case, involves continuity of the living brain.
  - Information can be transferred between brains (e.g., via communication, learning).
  - After death, the biological brain ceases to function, and the patterns that constituted the person's mind are no longer actively sustained.

  Let me write a numbered list:

  1. Brains are biological organs that generate and sustain conscious experience through complex neural processes.
  2. Patterns of neural activity and connectivity encode information such as memories, skills, and personality traits.
  3. In normal biological continuity, a person's first-person perspective persists as long as their brain remains alive and functionally continuous.
  4. Information patterns can be copied, transmitted, and reconstructed in other media, including other brains, though with varying fidelity.
  5. After biological death, the original brain ceases to function, and the patterns it hosted are no longer actively maintained by that brain.
  6. The concept of "persistence" of a person can be ambiguous when considering non-biological or distributed scenarios.

  **Second, Disagreements Table:**

  We need a table with rows. Each row should be phrased in wording that the side accepts for itself. So:

  - For Loopers (Camp A): they might say "An 'I' is a dynamic, self-referential pattern that can be instantiated in multiple substrates if the right causal loops are maintained."
  - For Singularists (Camp B): they might say "An 'I' is strictly identical to the ongoing biological processes of one living brain, and cannot be transferred or duplicated."

  We'll have multiple rows for different aspects.

  Table structure:

  | Disagreement Topic | Loopers (Camp A) | Singularists (Camp B) |
  |--------------------|------------------|-----------------------|
  | Nature of 'I'      | The 'I' is a self-sustaining informational loop that can be implemented in any system that supports its dynamics. | The 'I' is the unique, embodied first-person perspective generated by a specific living brain. |
  | Transferability    | An 'I' can be partially or fully transferred to another brain if the essential loop structures are replicated and activated. | An 'I' cannot be transferred; what is transferred are representations or influences, not the first-person identity itself. |
  | After Death        | If the loop pattern is reconstructed in another brain, the 'I' can continue in a new substrate. | After death, the 'I' ceases; any reconstruction is a copy or simulation, not the original person. |

  **Third, Cruxes:**

  We need two cruxes with concrete cases and predictions.

