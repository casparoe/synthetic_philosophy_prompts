  hey can u draft the joint statement of an adverserial colaboration between two camps on whether an 'I' can be distributed across brains? camp A are the loopers (hofstadter-style): they hold that an 'I' is basically a causal/informational strange loop that can be partly instantiated in other brains if they carry enough of the right structure. camp B are the singularists: they hold that first-person identity is strictly tied to one living biological brain, and talk of "living on in others" is at best a metaphor for being represented in memory.

  format: (1) a numbered list of agreed claims about what brains do, what patterns are, and what persistence could possibly mean; (2) a disagreements table with each row phrased in wording that side accepts for itself; (3) the cruxes.

