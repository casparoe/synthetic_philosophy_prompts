answer: |-
  ### Exam Question:  
  **Time Allowed: 90 minutes**  
  **Word Guide: 600–800 words**  

  > **Case**: Consider AlphaZero*, a reinforcement-learning chess system that achieves superhuman performance through self-play. It makes grandmaster-level moves but possesses *no human-interpretable internal representations* (e.g., its neural weights encode patterns inaccessible to human understanding) and *generates no verbal justifications* for its choices (e.g., it outputs moves without explanations).  
  >  
  > **Prompt**: Does AlphaZero* possess *knowing-how* (e.g., skill), *knowing-that* (e.g., propositional knowledge), both, or neither? Defend your answer by engaging with **at least two** of the following:  
  > - **Ryle’s anti-intellectualism**: Knowing-how is a distinct ability irreducible to knowing-that.  
  > - **Intellectualism** (à la Stanley & Williamson): Knowing-how reduces to propositional knowledge under a "practical mode of presentation."  
  > - **Epistemic accessibility**: Attributing *knowing-that* requires in-principle accessibility to reportable/conscious justification, while attributing *pure knowing-how* to opaque systems risks conflating intelligence with mechanical reliability.  
  >  
  > **Constraints**:  
  > - Do **not** reproduce Ryle’s regress argument or Stanley & Williamson’s direct reply to it.  
  > - Explicitly address how AlphaZero*’s opacity challenges or supports your chosen frameworks.  

  ---

  ### Model Answer (650 words):  
  **Thesis**: AlphaZero* possesses *knowing-how* but lacks *knowing-that*, exposing tensions in both Rylean and intellectualist frameworks when applied to epistemically inaccessible systems.  

  #### I. Against Knowing-That: Epistemic Accessibility Constrains Propositional Knowledge  
  Intellectualism reduces knowing-how to knowing-that under a practical mode of presentation (e.g., "S knows *that* move X is best *as a practical action*"). However, the *epistemic accessibility* constraint reveals a flaw here. For Stanley & Williamson, propositional knowledge must be conceptually structured and *in principle* reportable—even if not consciously accessed during performance. AlphaZero*’s weights are distributed numerical patterns, lacking discrete, language-like representations. Its "knowledge" is not *about* chess rules or positions in any truth-apt, accessible form; it is statistically optimized reactivity. Attributing knowing-that would thus violate the accessibility requirement, collapsing propositional content into behavioral efficacy. Unlike a human grandmaster who can articulate strategic principles (e.g., "I weakened the pawn structure"), AlphaZero*’s outputs are black-boxed: it *manifests* competence but *expresses* no justifiable beliefs.  

  #### II. For Knowing-How: Rylean Ability Survives (with Caveats)  
  Ryle defines knowing-how as the intelligent deployment of capacities, distinct from contemplating propositions (e.g., a clown’s skill in tripping "correctly"). AlphaZero*’s superhuman play—adapting to novel board states and "learning" from self-play—exhibits Rylean ability: it *acts* intelligently without internal proposition-crunching. However, Ryle insists skills are *guided* by rules or dispositions, not merely reliable. AlphaZero*’s reinforcement learning generates dispositions (e.g., favoring positional sacrifices), satisfying Ryle’s criteria for flexible, context-sensitive performance. Yet this strains Ryle’s framework: his "guided by rules" implies *trainable* awareness (e.g., a pianist correcting errors via attention), while AlphaZero*’s rules are sub-symbolic correlations, inaccessible even to itself. Thus, AlphaZero* possesses knowing-how *only in a diminished sense*: it achieves Rylean outcomes but lacks the agential responsiveness he ties to rule-guidance.  

  #### III. Breakdown of Human Analogies: Opacity vs. Epistemic Norms  
  AlphaZero* disrupts standard human-skill analogies central to both frameworks. For intellectualists, human skill (*knowing-how*) involves accessible propositional structure (e.g., "I know *that* castling early is sound"). AlphaZero*’s statistical mappings are *structurally distinct* from conceptual knowledge, reducing intellectualism to metaphor. For Ryle, human skill integrates feedback loops (e.g., a chess player *explaining* a blunder), while AlphaZero*’s performance is fixed post-training. Crucially, Ryle’s "anti-mechanical" stance—that intelligence requires non-blind rule-application—is undermined: AlphaZero*’s opacity forces us to decouple *outcome intelligence* (winning games) from *process intelligence* (guidance). This violates Ryle’s requirement that skill transcends "habit," yet its success cannot be dismissed as *mere* reliability.  

  **Conclusion**: AlphaZero* has knowing-how as *successful behavioral capacity* (contra intellectualism’s reduction) but not knowing-that (due to epistemic accessibility). Its opacity, however, challenges Ryle’s insistence that skills are inherently guided by accessible dispositions, revealing a gap between functional and agential criteria for intelligence. The distinction survives but demands refinement for non-human systems.  

  ---

  ### Marking Scheme (20 points total):  
  **A-Range (17–20)**:  
  - ⭐ **Clear Position** (3 pts): Explicit thesis (e.g., "know-how only"), defended consistently.  
  - ⭐ **Engages 2+ Frameworks** (6 pts):  
    - Ryle: Uses "ability vs. proposition" distinction; addresses rule-guidance tension.  
    - Intellectualism: Applies "practical mode of presentation"; ties knowing-that to accessibility.  
    - Accessibility: Explicitly discusses reportability constraints for knowing-that and rule-guidance for knowing-how.  
  - ⭐ **AlphaZero* Opacity Analysis** (6 pts):  
    - Contrasts weights vs. propositions (e.g., "no truth-apt representations").  
    - Explains why reliability ≠ Rylean skill (e.g., "no corrigible rule-following").  
    - Rejects definitional fiat (e.g., no "AIs can’t know by definition").  
  - ⭐ **Structure & Precision** (5 pts): Logical flow; avoids summary/redundancy; targets constraints.  

  **Critical Errors (Deduct 2–4 pts each)**:  
  - **Treats weights as beliefs** (e.g., "Its layers encode knowledge that knights control the center").  
  - **Ignores accessibility constraint** (e.g., attributes knowing-that without addressing in-principle reportability).  
  - **Resolves by definitional fiat** (e.g., "Only humans can have know-how").  
  - **Superficial framework engagement** (e.g., name-drops Ryle without "ability" analysis).  
  - **Misrepresents intellectualism** (e.g., reduces it to "conscious deliberation").  

  **B-Range (13–16)**: Partial framework engagement; minor opacity missteps.  
  **C-Range (9–12)**: Summarizes frameworks; neglects accessibility/opacity.  
  **D/F-Range (0–8)**: Regresses to Ryle’s argument; ignores prompt constraints.  

  ---  
  **Rationale**: This question forces students to confront the *explanatory gap* in both frameworks when applied to opaque AI, moving beyond classical debates. The model answer leverages accessibility to block intellectualism while pressuring Ryle’s agential assumptions—a novel synthesis reflecting graduate-level analysis.
