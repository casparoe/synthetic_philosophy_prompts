  ### Decision Tree for Modal Metaphysics: Cross-World Identity of a Ceramic Vase

  This decision tree classifies positions on whether a concrete object (e.g., a ceramic vase) can exist in more than one possible world. Answer the questions based on your intuitions about the vase in three counterfactual scenarios:  
  - **(i)** Fired at a different temperature in another world.  
  - **(ii)** Shattered and rebuilt from the same fragments.  
  - **(iii)** A qualitatively identical vase elsewhere with no causal connection to the original.  

  **Do not use prior knowledge of terms like "counterpart theory" or "transworld identity."** The tree will classify your view based solely on your answers.  

  ---

  #### **Q1: Can the *very same* vase exist in multiple worlds?**  
  *(i.e., is the vase in another world numerically identical to the actual vase?)*  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q3.  

  ---

  #### **Q2 (if Q1=Yes): Must the vase share essential qualitative properties across worlds?**  
  *(e.g., must it have the same origin, material, or structure? Consider case (i): firing temperature.)*  
  - **Yes** → Proceed to Q4.  
  - **No** → Proceed to Q5.  

  ---

  #### **Q3 (if Q1=No): Is there a relation linking the actual vase to vases in other worlds?**  
  *(e.g., similarity, causal history, or representation. Consider case (iii): a duplicate vase.)*  
  - **Yes** → Proceed to Q6.  
  - **No** → **Leaf: Anti-Realism / Deflationism**  
    - *Denies cross-world individuals. Worlds are fully independent; "the vase" is world-bound.*  

  ---

  #### **Q4 (if Q2=Yes): Must the vase have causal/spatiotemporal continuity across worlds?**  
  *(e.g., must it persist unbroken? Consider case (ii): shattering and rebuilding.)*  
  - **Yes** → **Leaf: Transworld Identity with Essential Properties + Continuity**  
    - *The vase exists in multiple worlds but requires both essential properties (e.g., origin) and unbroken continuity. Gap: Logically possible but rare; continuity is often seen as redundant if essential properties are fixed.*  
  - **No** → **Leaf: Kripkean Transworld Identity**  
    - *The vase is numerically identical across worlds if it retains essential properties (e.g., material origin). Continuity is unnecessary (case (ii) may or may not preserve identity).*  

  ---

  #### **Q5 (if Q2=No): Must the vase have causal/spatiotemporal continuity across worlds?**  
  - **Yes** → **Leaf: Transworld Identity with Continuity (No Essential Properties)**  
    - *The vase is identical across worlds if continuity is preserved, even with no shared qualitative properties. Gap: Logically possible but unattractive; continuity without essential properties is unmotivated.*  
  - **No** → **Leaf: Bare-Identity Haecceitism**  
    - *The vase is identical across worlds purely via a primitive "thisness" (haecceity). No qualitative or continuity constraints (cases (i)–(iii) all preserve identity).*  

  ---

  #### **Q6 (if Q3=Yes): Is the relation based *only* on qualitative similarity?**  
  *(e.g., shape, color, material. Ignore causal ties; see case (iii).)*  
  - **Yes** → Proceed to Q7.  
  - **No** → Proceed to Q7.  
  *(Q7–Q8 apply to both branches.)*  

  ---

  #### **Q7: Can one vase have multiple counterparts in a single world?**  
  *(e.g., two equally similar vases in one world; case (iii) with duplicates.)*  
  - **Yes** → Proceed to Q8.  
  - **No** → Proceed to Q8.  

  ---

  #### **Q8: Is the relation to the actual world privileged?**  
  *(e.g., must counterparts of the actual vase be unique or fixed in a way counterparts in non-actual worlds are not?)*  
  - **Yes** → **Leaf: Privileged-Actual Counterpart Theory**  
    - *Counterparts exist, but the actual world constrains them uniquely (e.g., actual vase has one counterpart per world). Gap: Coherent but unexplored; privileges actuality asymmetrically.*  
  - **No** → Classify by Q6 + Q7:  
    - **If Q6=Yes and Q7=Yes**: **Leaf: Lewisian Counterpart Theory**  
      - *The vase has multiple counterparts per world based on qualitative similarity. No special role for actuality (case (iii) allows duplicates as counterparts).*  
    - **If Q6=Yes and Q7=No**: **Leaf: Qualitative Counterpart Theory (Uniqueness)**  
      - *One counterpart per world based on qualitative similarity. Gap: Logically possible but limits flexibility.*  
    - **If Q6=No and Q7=Yes**: **Leaf: Causal Counterpart Theory (Multiplicity)**  
      - *Multiple counterparts allowed if causally/historically related. Gap: Coherent (e.g., causal-historical similarity) but rare.*  
    - **If Q6=No and Q7=No**: **Leaf: Causal Counterpart Theory (Uniqueness)**  
      - *One counterpart per world based on causal/historical ties. Gap: Unexplored; rigidly ties identity to causation.*  

  ---

  ### Notes on Gaps and Indistinguishability  
  - **Gaps**:  
    - *Transworld Identity with Continuity (No Essential Properties)*: Unattractive—continuity without essential properties lacks theoretical motivation.  
    - *Privileged-Actual Counterpart Theory*: Coherent but underexplored; may conflate epistemic and metaphysical roles of actuality.  
  - **Indistinguishability**:  
    - The tree **cannot distinguish** between variants of counterpart theory that share the same answers to Q6–Q8 (e.g., two "Privileged-Actual" leaves with different Q6/Q7 combinations). This reflects structural similarities in how the positions handle cases (ii)–(iii).  
  - **Diagnostic Coverage**:  
    - All key splits are covered:  
      - Q2 → Qualitative similarity alone?  
      - Q4/Q5 → Causal/spatiotemporal continuity?  
      - Q7 → Multiple counterparts in one world?  
      - Q8 → Privileged relation to actual world?  

  This tree isolates core commitments while bracketing jargon. Use your case-based intuitions to find your position!
