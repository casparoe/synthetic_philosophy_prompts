prompt: |-
  My department's been arguing about populism and "the will of the people" for months and we're going in circles. One camp says populists are describing a real collective preference that liberal institutions suppress—like there's an actual group-agent with interests that polling just approximates badly. The other camp says "the people" is purely performative: saying it exists makes it exist, so asking whether populists are "right" about the will is like asking whether a wedding vow describes a pre-existing marriage. They both cite the same elections and neither budges.

  My hunch is we're mixing up three different things: (1) whether collective agents exist in any metaphysically serious sense, (2) whether democratic legitimacy needs a pre-political will or can build it procedurally, and (3) whether "will" here means a statistical aggregate or a diachronic identity that survives preference change. But I'm not sure if that's the real stall or if it's just bedrock intuition about whether democracy is discovery or invention.

  Can you diagnose what kind of disagreement this actually is—verbal, substantive, or different questions under one label? And tell me what would count as progress: a conceptual distinction, a formal model, an empirical test, or is this one of those debates that cant move because the sides are defending different pictures of politics? Be concrete about what each side is actually committed to, not just "populists vs liberals."
reasoning: |-
  Okay, the user is dealing with a persistent debate in their department about populism and "the will of the people." The two camps are stuck: one claims populists reveal a suppressed collective preference, while the other argues "the people" is performative. The user suspects the disagreement involves three underlying issues: the existence of collective agents, democratic legitimacy sources, and the nature of "will" as statistical vs. diachronic. They want to know what kind of disagreement this is and how to make progress.

  First, I need to unpack the user's analysis. They've identified three potential conflated dimensions. That's a solid starting point. The user is likely a political theorist or social scientist, given the academic context. Their frustration suggests they need clarity to move the discussion forward, not just more arguments.

  Looking at Camp A (Essentialist): They believe in a pre-existing "people" with a coherent will that institutions distort. This camp is committed to a metaphysical group agent, legitimacy based on authenticity, and "will" as enduring identity. Their examples might be Brexit or populist election wins as expressions of this suppressed will.

  Camp B (Performative) sees "the people" as created through political rhetoric. For them, legitimacy comes from fair procedures, and "will" is an unstable aggregate shaped by discourse. Performative acts like rallies or slogans don't reveal but create the people. They'd cite how populists redefine who belongs to "the people" strategically.

  The core issue seems substantive and foundational. It's not merely verbal because both camps use the same terms but with different ontological commitments. The disagreement runs deep into how they view politics: discovery vs. invention of the people. 

  To diagnose the disagreement type: It's substantive (different beliefs about reality), with verbal aspects (same terms, different meanings), but ultimately foundational (clashing worldviews). Progress might come from clarifying these layers rather than seeking a winner.

  For practical steps:
  1. Conceptual distinctions: Map their debate onto the three dimensions the user identified. Force each camp to specify positions on metaphysics, legitimacy, and temporality. This could reveal if they're talking past each other.
     
  2. Empirical tests: While foundational beliefs aren't testable, their implications might be. For instance, studying if populist victories stabilize preferences (supporting Camp A) or keep reshaping them (supporting Camp B). Or analyzing discourse to see how "the people" is constructed.

  3. Formal models: Agent-based models could simulate if stable group preferences emerge from individual interactions or require top-down framing. This might illustrate possibilities without resolving the core divide.

  Progress here means clearer mapping of disagreements, not resolution. The user should aim for "meta-understanding" – agreeing on what they disagree about. Concrete outcomes could be a jointly-authored framework paper or designing research that tests secondary implications. The goal isn't consensus but productive disagreement.
answer: |-
  This is a classic **foundational disagreement disguised as a substantive/verbal one**, stemming from incompatible *pictures of politics* (Wittgensteinian "forms of life"). Both camps use the same words ("people," "will," "legitimacy") but embed them in fundamentally different ontological and normative frameworks. Here's a diagnosis and path forward:

  **Diagnosing the Disagreement:**

  1.  **Core Conflict: Ontology of "The People"**
      *   **Camp A (Essentialist):** Committed to a **metaphysically robust group agent**. They believe:
          *   There exists a pre-linguistic, coherent, and enduring collective identity ("the People") with discoverable interests.
          *   Liberal institutions (media, courts, bureaucracy) act as *filters* or *distorters* of this authentic will.
          *   Legitimacy flows from accurately *representing* this pre-existing entity. Populists are "right" if they correctly identify this suppressed will.
      *   **Camp B (Performative):** Committed to **political subjectivity as discursively constructed**. They believe:
          *   "The People" is not found but *made* through political rhetoric, symbols, and mobilization ("performativity").
          *   There is no single, coherent "will" prior to its articulation; articulation *creates* the collective subject it claims to describe.
          *   Legitimacy flows from inclusive *procedures* that allow for the contingent formation of collective decisions. Asking if populists are "right" is nonsensical; the question is whether their *performance* is democratically legitimate and inclusive.

  2.  **Conflated Dimensions (Your Hunch is Correct):**
      *   **(1) Metaphysics of Collective Agency:** Camp A accepts strong emergence (the People as > sum of parts). Camp B sees collectives as epiphenomenal or purely discursive.
      *   **(2) Source of Legitimacy:** Camp A: *Authenticity* (matching the pre-political will). Camp B: *Procedural Fairness* (how the "will" is constructed).
      *   **(3) Nature of "Will":** Camp A: *Diachronic Identity* (enduring core interests/identity). Camp B: *Synchronic Aggregate* (contingent snapshot shaped by context/discourse).

  3.  **Why Elections Don't Resolve It:** Both camps interpret the *same events* through their lens.
      *   **Camp A:** A populist victory *proves* the suppressed will existed and was finally expressed.
      *   **Camp B:** A populist victory *demonstrates* the successful performance/construction of "the People" in that moment; it doesn't reveal a pre-existing truth.

  **What Kind of Disagreement is This?**

  *   **Not Primarily Verbal:** They aren't *just* using words differently; they hold fundamentally different beliefs about the nature of collective political existence.
  *   **Substantive but Foundational:** It's about core assumptions (ontology, epistemology of politics), not just empirical facts. These assumptions are prior to and shape how evidence is interpreted.
  *   **Different Questions Under One Label:** Yes. "The will of the people" acts as a Rorschach test for their entire political worldview.

  **What Counts as Progress?**

  Total consensus is unlikely, but **productive progress** involves **mapping the disagreement precisely and shifting the debate to testable implications or clarifying frameworks:**

  1.  **Forced Conceptual Distinction (Short-Term Clarity):**
      *   **Action:** Facilitate a session where *each camp must explicitly define* their position on your three dimensions for a *specific case* (e.g., Brexit, a specific election, a policy debate).
      *   **Goal:** Create a shared map: "Camp A believes X about the metaphysics, Y about legitimacy, Z about the will in this case. Camp B believes A, B, C." Make the *incompatible assumptions* explicit. Acknowledge this is a clash of "pictures."
      *   **Progress:** Moving from "You're wrong!" to "We start from irreconcilable premises X and Y." This is meta-understanding.

  2.  **Empirical Tests of *Implications* (Moving Forward):** While the core ontology isn't directly testable, their models generate different *predictions* about observable phenomena:
      *   **Test 1: Stability vs. Fluidity of "The Will":**
          *   **Camp A Prediction:** If populists tap the *authentic* will, preferences on core identity/national issues should show relative *stability* (even if suppressed) and *resistance* to elite framing once expressed. Major shifts reflect suppressed will finally emerging.
          *   **Camp B Prediction:** "The will" is highly *malleable* and *context-dependent*, significantly shaped by populist framing itself, media narratives, and elite cues. Preferences on core issues should show greater *volatility* and responsiveness to discursive shifts.
          *   **Empirical Approach:** Longitudinal panel studies tracking *individual* voter preferences on key populist issues *before, during, and after* major populist campaigns/victories. Analyze how stable/vulnerable these preferences are to counter-messaging or changing contexts. Network analysis of discourse flows.
      *   **Test 2: Who is "The People"? (Inclusivity/Exclusivity):**
          *   **Camp A Prediction:** Populists define "the People" based on a pre-existing, relatively *fixed* identity marker (e.g., ethnicity, nationality, "hard-working") that resonates deeply and consistently.
          *   **Camp B Prediction:** The boundaries of "the People" are *strategically drawn and redrawn* by populist leaders based on contingent political needs, often shifting to exclude dissenters or include new groups for coalition-building.
          *   **Empirical Approach:** Detailed discourse analysis of populist rhetoric over time. Track how the definition of "the People" and "the elite" shifts within the *same movement* across different speeches, events, and electoral cycles. Survey experiments testing which definitions resonate under which conditions.
      *   **Test 3: Demand vs. Supply:** Did the demand (the "will") precede the supply (the populist), or did the supply create the demand?
          *   **Camp A Prediction:** Strong latent populist *attitudes* (distrust, anti-elitism, nativism) exist *before* the rise of specific populist parties/leaders and predict support for them.
          *   **Camp B Prediction:** Populist *identity* and specific policy preferences are significantly *activated* or even *created* by the discourse and mobilization efforts of populist actors. Support coalesces *around* the leader/performance.
          *   **Empirical Approach:** Cross-national comparative studies examining the rise of populism. Does it emerge predictably where specific socio-economic grievances exist *without* strong prior populist attitudes (supporting Camp B), or only where latent populist attitudes are already high (supporting Camp A)? Natural language processing of social media to track the emergence and spread of populist frames.

  3.  **Formal Models (Clarifying Logic, Not Resolving):**
      *   **Action:** Develop simple agent-based models or game-theoretic frameworks representing each camp's core assumptions.
      *   **Goal:** Not to "prove" one side, but to:
          *   Make the internal logic and requirements of each position explicit (e.g., what conditions *must* hold for Camp A's "authentic will" to exist and be discoverable?).
          *   Explore potential paradoxes or unintended consequences within each model.
          *   Identify *minimal conditions* under which one model might be more descriptively accurate than the other.
      *   **Progress:** Forcing rigor in stating assumptions and revealing logical constraints.

  **Conclusion & Concrete Outcome:**

  The debate is **foundational**. Each camp defends a different **picture of democratic politics**: **Discovery** (uncovering a pre-existing truth) vs. **Invention** (creating contingent collective identity through process and performance). Elections are Rorschach blots, not arbiters.

  **Progress means moving the debate from "Who's right?" to:**

  1.  **Precise Mapping:** "We disagree fundamentally on X, Y, Z assumptions."
  2.  **Testing Secondary Implications:** Focusing research on the empirical tests outlined above (stability, boundary definition, demand/supply).
  3.  **Procedural/Outcome Focus:** Shifting discussion to: *"Regardless of the ontology, what institutional procedures best handle the ambiguity/fluidity of 'the people's will' while protecting minority rights and enabling collective action?"* or *"What are the observable democratic virtues and pathologies associated with populist performances claiming the 'authentic will'?"*

  **Concrete Deliverable:** Propose a departmental workshop with two parts:
  1.  **Conceptual Roundtable:** Each side presents their position explicitly using your three dimensions on a shared case study. Produce a joint document mapping the *exact points of irreconcilable disagreement*.
  2.  **Research Design Session:** Brainstorm specific empirical projects (like the tests above) that could provide evidence relevant to the *implications* of each position, even if not resolving the core ontology. Frame it as "What could we learn that would make one picture *less plausible* than the other?"

  This acknowledges the depth of the divide while creating avenues for productive scholarly engagement beyond the stalemate. The goal isn't conversion, but clearer understanding and better research questions.
