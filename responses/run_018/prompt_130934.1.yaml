answer: |-
  Certainly. Below is a structured dissection of the "familiarity breeds contempt" argument as applied to your seminar debate, organised into distinct philosophical claims. Each is evaluated for its nature (platitude, defensible thesis, or non-sequitur), institutional implications, and attention to the dual risks of moral corruption versus erosion of institutional memory. For seminar discussion, consider pairing these conceptual "menu items" with the following focal points:

  ### I. Psychological Claim: Office-Holder Degradation  
  *"Prolonged incumbency breeds arrogant disregard for constituents."*  
  - **Nature**: Defensible empirical thesis (with caveats).  
    - Supported by studies on power's psychological effects (e.g., reduced empathy) but contradicted by evidence that long-serving MPs often develop deeper constituency ties.  
  - **Supports**: Term limits (prevents entrenchment) or sortition (resets power dynamics).  
  - **Risks**: Overstates inevitability; neglects that familiarity may also breed *responsiveness* (e.g., via re-election incentives).  
  - **Key distinction**: Addresses *moral corruption* but ignores institutional memory.  

  ### II. Institutional Claim: System Contempt  
  *"Familiarity with legislative machinery breeds contempt for democratic ideals."*  
  - **Nature**: Non-sequitur in this form.  
    - No logical necessity that procedural expertise causes disdain for democracy; may equally foster respect for institutional guardrails.  
  - **Supports**: Sortition (bypasses "corrupted" systems) but *weakly*.  
  - **Risks**: Conflates mastery of rules with cynicism. Ignores that novices may disrespect norms *more* readily.  
  - **Key distinction**: Targets institutional memory erosion only if equating experience with decadence—a dubious leap.  

  ### III. Normative Claim: Humility Through Ephemerality  
  *"Democracy’s health requires frequent ‘resets’ to humble leaders."*  
  - **Nature**: Defensible (but contested) normative thesis.  
    - Rooted in republican fear of entrenched power; argues rotation prevents aristocracy.  
  - **Supports**: Both term limits (modest reset) and sortition (radical reset).  
  - **Risks**: Presumes humility guarantees virtue, neglecting how inexperience enables capture by lobbies/technocrats.  
  - **Key distinction**: Focuses on moral corruption; dismisses institutional memory as secondary to integrity.  

  ### IV. Epistemic Claim: Expertise as Anti-Democratic  
  *"Legislative expertise is incompatible with authentic representation."*  
  - **Nature**: Non-sequitur (and self-undermining).  
    - Expertise ≠ elitism; complex policy (e.g., climate treaties) requires skilled negotiation. Rejecting expertise privileges populist gesture over effective governance.  
  - **Supports**: Sortition (if prioritising "ordinary" judgement) but *undermines its own case*: citizen assemblies *require* training/facilitation.  
  - **Risks**: Implicitly endorses incompetence. Erosion of institutional memory becomes a *feature*, not a bug.  
  - **Key distinction**: Sacrifices institutional memory for ideological purity.  

  ---

  ### Discussion Menu: Guiding Questions  
  1. **Psychological**: Must familiarity *necessarily* corrupt? Does electoral accountability mitigate this?  
  2. **Institutional**: Can we separate contempt for *bureaucracy* from contempt for *democracy*?  
  3. **Normative**: Is humility the *primary* democratic virtue? What of efficacy or justice?  
  4. **Epistemic**: Can a legislature function without cumulative knowledge? Does sortition merely transfer expertise to unearthed advisors?  
  5. **Memory vs. Corruption**: Is preserving institutional memory worth risking leaderly arrogance? Can term limits balance both?  

  ### Why This Matters  
  Your student’s slogan conflates psychological tendencies with institutional design and moral imperatives. Untangling these reveals:  
  - **For term limits**: Best address *moral corruption* while retaining *some* memory via staggered rotations.  
  - **For sortition**: Only coherent if rejecting *all* expertise as corrupting—a radical but epistemically costly stance.  
  - **Against both**: The epistemic claim inadvertently attacks democracy’s capacity for *effective self-rule*.  

  Present this as a "claim-mapping" exercise: which version of "familiarity breeds contempt" does each reading assume, and what does it sacrifice?
