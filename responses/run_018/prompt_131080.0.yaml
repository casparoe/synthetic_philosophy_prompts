answer: |-
  The impasse stems from a collision of bedrock intuitions about creation and moral status that arguments cannot reconcile. The person-affecting view is anchored in a deep intuition that morality requires a *victim*—a specific individual made worse off. The impersonal view rests on an equally strong intuition that adding less well-being to the world is inherently regrettable, regardless of identity. Decades of refinement haven't moved the needle because these intuitions are foundational, not derived from more basic premises susceptible to logical refutation.

  Introducing a gradable psychological-continuity metric for personal identity (e.g., from split-brain cases) merely relocates the disagreement. It transforms the question from "Is *this* person harmed?" to "How much continuity is required for harm to apply?" However, both camps would still clash over the *moral significance* of creating a life with reduced well-being under conditions of partial/non-binary identity. The person-affecting camp would likely demand a high threshold of "sameness" to recognize harm, while the impersonal camp would see reduced well-being as bad irrespective of identity metrics.

  Genuine progress is unlikely to come from formal modal metaphysics (which refines concepts without bridging intuitions) or mere empirical mapping of existing intuitions (which documents the divide). The structural permanence arises from incompatible starting points. Progress would require either:

  1.  **Radical Reframing:** Developing a new ethical framework (e.g., focusing on collective obligations in climate ethics, or "procreative justice" independent of harm to *this* individual) that bypasses the identity/harm dilemma entirely.
  2.  **Intuition Shift:** A slow evolution in societal moral intuitions, perhaps driven by pressing real-world applications like long-term climate policy, making one starting point seem pragmatically untenable.

  The core conflict reflects a fundamental and perhaps irreconcilable schism in how we conceptualize the moral weight of bringing potential persons into existence.

