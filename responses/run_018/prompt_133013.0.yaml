prompt: |-
  After a long argument with a friend about whether ritualized behavior undermines compatibilism, I am planning a single session for cognitive-science graduate students—people who instinctively equate mental flexibility with “more if-statements”—on sphexishness, mechanical rigidity, and why complexity alone does not yield free will. Do not lecture me on the philosophy; plan the explanatory arc. First, what conceptual prerequisite must be secured before the sphex ritual reads as a problem about agency rather than as an entomology curiosity? Second, propose one carrying example—I am inclined toward a “mirror-sphex” variant in which the wasp can observe its own burrow-check but still loops because it cannot represent its own representational state as contingent—and specify exactly what this scenario must preserve and what it must lack to work for an audience that thinks bugs are just under-powered computers. Third, map the misconceptions they will form in sequence—likely that rigidity is a hardware limitation, then that humans differ only in loop-depth, then that the mere ability to break loops is sufficient for freedom—and identify the precise point in the arc where each should be intercepted. Fourth, give me one counterfactual check-question that reveals whether they have grasped the distinction between flexible behavior and non-rigid representation, rather than just repeating that sphexishness is “bad.” Finally, state explicitly which part of the free-will literature—perhaps the tension between sourcehood and leeway conditions—should be named and then deliberately set aside at this level, and confirm that no readings are assigned.
reasoning: |-
  Okay, the user is planning a session for cognitive science grad students on sphexishness and free will. They've had an argument about whether ritualized behavior challenges compatibilism. The students likely equate mental flexibility with more complex programming, like adding more if-statements. The user wants a clear explanatory arc without diving deep into philosophy.

  First, I need to identify the key conceptual prerequisite. The students must understand that agency requires more than complex behavior—it's about representation and contingency. Without this, the sphex wasp is just an entomological curiosity. So, establishing that agency involves meta-representation is crucial.

  Next, the carrying example. The user mentioned a "mirror-sphex" variant. Here, the wasp can see its own actions but still loops because it can't represent its own state as contingent. This example must preserve the wasp's ability to observe behavior but lack the capability for meta-representation. The students might think bugs are just underpowered computers, so the example needs to highlight that even with observation, without representing contingency, rigidity persists.

  Mapping misconceptions: First, they might see rigidity as a hardware issue (e.g., not enough memory). Then, think humans differ only by having deeper loops. Finally, believe that breaking loops equals free will. Interception points: Address hardware limitation when introducing the mirror-sphex. Challenge loop-depth during human analogies. Counter the loop-breaking sufficiency with the counterfactual question.

  The counterfactual question should test if they grasp non-rigid representation. Something like: "If a human had a subroutine to break loops, is that free will?" This reveals if they conflate flexibility with representation of contingency.

  The free-will literature part to set aside is the sourcehood vs. leeway debate. Mention it but clarify it's beyond the session's scope. Confirm no readings—keep it conceptual.

  Overall, the session must transition students from seeing sphex as a bug to understanding agency's representational requirements, then to human implications, dismantling misconceptions step by step. The mirror-sphex example is key to bridge observation without meta-representation. The counterfactual question ensures they differentiate behavior from representation. Avoiding philosophy deep dives keeps it focused for the audience.
answer: |-
  Here’s a structured explanatory arc for your session, optimized for cognitive-science grad students with a computational bias:

  ---

  ### **1. Conceptual Prerequisite: Agency as Meta-Representational Capacity**  
  **Core Idea to Secure:**  
  *Rigidity becomes an agency problem only when we define agency as requiring the ability to represent one’s own representations as contingent*.  
  **How to Establish:**  
  - Start with a non-biological example: A chess AI that always plays the same opening move against a specific opponent, even after losing 100 games. Ask: "Is this a *limitation* or a *failure of agency*?"  
  - Contrast: Hardware glitch (e.g., stuck key) vs. software flaw (e.g., no learning subroutine) vs. *inability to recognize its own strategy as mutable*.  
  - **Key Point:** Agency requires not just complex rules, but the capacity to treat one’s own rules/representations as objects of evaluation ("This rule *could be wrong*").  

  ---

  ### **2. Carrying Example: The Mirror-Sphex**  
  **Scenario:**  
  A wasp observes its own burrow-check ritual via a mirror but still loops infinitely when an experimenter moves its prey during the check.  
  **What It Must Preserve:**  
  - All mechanistic triggers of the original sphex (stimulus-response chains, fixed action patterns).  
  - Sensory access to its own behavior (visual feedback of the ritual).  
  **What It Must Lack:**  
  - **Meta-representational capacity:** The wasp cannot encode its own action as *"This is a representation I might revise"* or *"My belief about prey location may be outdated."* It processes the mirror image as *external data* (e.g., "another wasp is near my burrow"), not as evidence about its *own cognitive state*.  
  **Why It Works for Computational Minds:**  
  - Illustrates that adding "more sensors" (input channels) or "more data" (mirror feedback) ≠ upgrading agency. The bottleneck is *representational architecture*, not bandwidth.  

  ---

  ### **3. Misconception Mapping & Interception Points**  
  | **Misconception** | **Likely Origin** | **Interception Point & Strategy** |
  |-------------------|-------------------|----------------------------------|
  | **"Rigidity = Hardware Limits"** (e.g., "Bugs lack RAM!") | Anthropomorphizing computational constraints | *After introducing mirror-sphex*: "If we gave the wasp more neurons, could it escape the loop? What if it had a human brain but the same representational rules?" → Highlight: Bigger computer running bad code is still rigid. |
  | **"Humans Just Have Deeper Loops"** (e.g., "We have nested if-statements!") | Equating recursion with freedom | *When comparing to humans*: Use a human analog (e.g., compulsive hand-washer who rationalizes new reasons each time). Ask: "Is adding layers of justification *flexibility* or *sophisticated rigidity*?" → Emphasize: Loop depth ≠ control over loop *initiation*. |
  | **"Breaking Loops = Free Will"** (e.g., "Ctrl+C proves we’re not sphexes!") | Confusing volition with veto power | *Before concluding*: Introduce a counterfactual agent that *only* breaks loops randomly. "If an AI has a ‘break-loop’ subroutine triggered by noise, is it *free*? Or just chaotic?" → Argue: Randomness isn’t agency; *goal-directed* revision is key. |

  ---

  ### **4. Counterfactual Check-Question**  
  **Question:**  
  > *"Imagine a human who always checks their stove exactly 3 times before leaving home. One day, they notice via a security camera feed that they already checked it twice, but feel compelled to check a third time anyway. Have they exercised free will? Why/why not?"*  

  **What It Reveals:**  
  - If they answer "No, because they knew but couldn’t stop," they conflate *behavioral flexibility* (seeing the camera) with *representational control* (using that data to override compulsion).  
  - Correct insight: The agent *represents the compulsion as inevitable* ("I must do this") despite contradictory evidence. This is sphexishness with data access.  

  ---

  ### **5. Free-Will Literature to Name & Set Aside**  
  **Explicitly State:**  
  > *"We are bracketing the debate between **sourcehood** (true agency requires being the ‘ultimate source’ of actions) and **leeway** (agency requires alternative possibilities). Our focus is narrower: whether *any* form of compatibilism can survive if cognition cannot represent its own states as contingent."*  

  **Why Set Aside?**  
  - Sourcehood/leeway debates require metaphysical commitments. Your goal is cognitive: *How must mental representations function* to avoid sphexishness?  
  - **Confirm:** No readings assigned. Keep it grounded in cognitive architecture.  

  ---

  ### **Session Arc Summary**  
  1. **Hook:** Chess AI rigidity → Agency = contingent representation.  
  2. **Original Sphex:** Ritual as hardware/software curiosity → **Prerequisite secured**.  
  3. **Mirror-Sphex:** Adds self-observation → Preserves rigidity → Reveals meta-representation deficit.  
  4. **Human Analogies:** Intercept hardware/deep-loop myths.  
  5. **Counterfactual:** Check 3x stove → Test understanding.  
  6. **Conclusion:** Complexity ≠ freedom without *self-referential contingency*; free-will debates partially bracketed.  

  This arc forces engagement with *representation*, not just computation—making your friend’s point about ritual without philosophy lectures.
