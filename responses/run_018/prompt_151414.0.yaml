  Here's a joke playing on that specific tension, followed by the requested clarification:

  **The Joke:**

  > Montaigne finally manages to get his Cannibal informants a table at that hot new Parisian bistro, *L'Étranger*. He's excited to discuss his essay.
  >
  > MONTAIGNE: (Leaning in) So, you see, my friends, I've argued *most strenuously* that what one calls 'barbarism' is merely unfamiliar custom! Truly, your practices are no more savage than ours!
  >
  > CANNIBAL CHIEF: (Nodding thoughtfully, gesturing with a legume fork) We appreciate this. Very... *relativist* of you. You understand our way: consuming the honorable dead, absorbing their strength. It is sacred.
  >
  > MONTAIGNE: Precisely! And far more *natural* than what we Europeans do! We torture people *alive* for hours! We tear them limb from limb while they scream! We—
  >
  > CANNIBAL CHIEF: (Holds up a hand, looking slightly confused) Hold on, Michel. Are you... *praising* us right now? Or are you using our sacred death-feast as a... what is the word... *rhetorical cudgel* against your own people?
  >
  > MONTAIGNE: (Blinking, swirling his wine) Hmm. Excellent question. Both? Neither? It's... complicated. The point is, your way is *objectively* less cruel than—
  >
  > CANNIBAL CHIEF: (Interrupting gently) Michel. 'Objectively'? A moment ago, everything was relative. Now you sound... *judgmental*. Are you sure you're a good relativist? You seem conflicted. Like you want to say our way is *better*... which sounds suspiciously like a *universal* moral claim sneaking in through the pantry door.
  >
  > MONTAIGNE: (Stares into his wine glass, muttering) Barbarism is not my custom... barbarism is not my custom... unless it *is*... comparatively... argh! Perhaps I need another draft...
  >
  > CANNIBAL CHIEF: (Signals the waiter) Jacques? Bring my friend Michel another glass. Strong. And... (leans conspiratorially towards the chief)... should we perhaps offer to 'settle' this philosophical debate for him? That loud critic at the next table looks quite... *nourishing*?
  >
  > MONTAIGNE: (Overhearing, head snapping up, eyes wide) NO! Absolutely not! That would be... barbaric!
  >
  > CANNIBAL CHIEF: (Smiling knowingly) Ah. So *there* is your line. Interesting.
  >
  > (Suddenly, a grad student bursts in, waving a manuscript)
  >
  > GRAD STUDENT: Professor Montaigne! We've analyzed your text! Are you *truly* a cultural relativist, or is this all an elaborate *ad hominem* against the Inquisition using the Tupinambá as ethical props?!
  >
  > MONTAIGNE: (Sighs deeply, downs the wine in one gulp) Jacques? Make it a bottle.

  **Clarification Note:**

  *   **Settled:** Montaigne **unequivocally rejects ethnocentrism**. His core argument that labeling others "barbarians" simply because their customs differ from ours is arrogant and illogical is central and clear ("each man calls barbarism whatever is not his own practice"). His **detailed, graphic critique of specific European atrocities** (torture, religious wars) is also explicit and undeniable. He **uses the Tupinambá as a mirror** to reflect European hypocrisy and cruelty.
  *   **Contested:** The **precise nature of Montaigne's underlying moral framework** is hotly debated:
      *   **Strategic Rhetoric/Immanent Critique:** Some argue Montaigne isn't a true relativist but uses the relativist *stance* strategically. By showing Europeans are arguably *worse* than the so-called "savages" *by their own claimed Christian/Stoic standards*, he avoids needing an external universal standard. His judgment stems *from within* the European value system he's critiquing. The comparison exposes internal contradictions.
      *   **Skeptical Relativism:** Others see him leaning towards a deeper skepticism where fixed universal morals are unknowable. Judgments about "barbarism" are always contextual. His critique highlights the *inconsistency* and *hypocrisy* of Europeans failing to live up to *their own* professed standards, rather than asserting a new universal "better/worse."
      *   **Covert Universalism:** A third view (closer to your interpretation and the joke's premise) argues that while Montaigne dismantles ethnocentrism with relativism, his palpable *horror* at European torture and his clear *preference* for the cannibals' practices (calling them more "natural," less cruel *overall*) implies a covert appeal to *some* universal standard of cruelty/suffering/humaneness that he believes Europeans violate more egregiously.
  *   **Joke's Liberties & Alignment:**
      *   **Liberties:** The joke personifies the Tupinambá as modern, philosophy-savvy diners for comedic effect. Montaigne's internal monologue ("argh!") and the grad student are pure invention. The bistro setting is obviously anachronistic.
      *   **Alignment:** The joke leans into the **covert universalism / strategic rhetoric debate**. It highlights the **tension** between Montaigne's relativist *framework* ("barbarism is not my custom") and his apparent *moral judgment* ("you are worse"). It specifically plays on the confusion this generates – both for the "cannibals" (are we being praised or used?) and for Montaigne himself (am I describing differences or making a value claim?). The punchline with the critic and Montaigne's final "barbaric!" reaction underscores the idea that Montaigne *does* have a line, suggesting his relativism has limits, implicitly pointing towards a universal aversion to certain kinds of suffering.

  The joke works because it takes the genuine ambiguity in Montaigne's text – is he *just* exposing hypocrisy relativistically, or is he *also* making a comparative moral claim? – and amplifies it into a comedic conversation where the subjects of his essay call him out on the very tension your study group is grappling with.
