  Third, predictive targeting with probabilistic civilian casualties. Assigning weights to expected deaths treats them as acceptable losses. Anscombe rejected double effect if the harm is a means to an end. Here, civilian casualties are built into the authorization, so they're not just side effects but part of the calculus. Thus, intended.

  The unifying principle is that all three systems obscure the moral reality by replacing concrete individuals with abstract data. The deepest threat is algorithmic abstraction because it turns people into patterns and probabilities, making it easier to justify their deaths.

  Increased cognitive distance is a qualitative change. Truman knew the bomb would kill civilians, but modern operators might not even grasp the individuals affected. This erosion of moral understanding means agents don't see their actions as killing innocents, which is more corrupting.

