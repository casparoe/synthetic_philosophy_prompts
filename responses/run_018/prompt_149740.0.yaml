  Now, applying this to the three modern practices: autonomous strike systems, human-on-the-loop nukes, and predictive targeting in urban areas. For each, I need to determine if Anscombe would see the killing as intended, obscured, or indirect. Also, whether the tech is morally neutral or deforms reasoning.

  Starting with the first one: autonomous strikes with algorithmically generated targets. The operator approves a list without knowing specific individuals. Here, the civilian deaths are statistically likely but not individually targeted. Anscombe would argue that since the deaths are foreseen and part of the operation, they're intended. The system abstracts individual lives into data points, which corrupts moral reasoning by removing direct recognition.

