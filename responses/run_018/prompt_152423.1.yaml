  Their laser interferometer example is actually perfect for constructing a better analogy - it demonstrates how propositional specs and tactile feel co-evolve during skill acquisition. A master instrument maker doesn't discard theory; they develop richer representations. This suggests Ryle's strict anti-reductionism may oversimplify, though complete reduction seems equally flawed. 

  Important to emphasize the contested nature: Intellectualists like Stanley maintain skills are propositional, while embodied cognition folks like Noë see them as fundamentally different. The middle-ground "mesh" theories (Christensen, Sutton) seem closest to the user's experience. 

