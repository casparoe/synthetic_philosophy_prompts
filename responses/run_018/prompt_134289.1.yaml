answer: |-
  Here's a precise breakdown of the "white horse is not horse" slogan, analyzing its possible meanings, defensibility, and whether it supports your roommate's radical conclusion. Think of this as a structured menu of interpretations:

  **Core Claim Menu:**

  1.  **Compound vs. Simple Term Distinction:**
      *   **Claim:** "White horse" (a compound term describing a specific subcategory/instance) is not *identical to* the simple term "horse" (denoting the general kind/concept).
      *   **Defensible?** **Yes.** Logically and linguistically, a compound noun phrase isn't identical to the simple noun it modifies. "President" ≠ "Biden", "Red apple" ≠ "apple".
      *   **Verbal Trick?** **Minimal.** This is a basic point about term complexity.
      *   **Supports Contingent Kind Membership?** **No.** It's about *term identity*, not whether white horses *belong to* the kind "horse". A white horse is still *a horse*, even if the *phrase* "white horse" isn't synonymous with "horse".

  2.  **Predication Failure (Strict Identity):**
      *   **Claim:** A particular white horse (e.g., Binky) *is not identical to* the abstract concept or universal "horseness".
      *   **Defensible?** **Yes.** This is fundamental logic/metaphysics: a particular instance (token) is not identical to the universal (type) it instantiates. Binky ≠ "Horseness".
      *   **Verbal Trick?** **Slight.** It exploits the ambiguity of "is" (predication vs. identity). Saying "Binky *is* a horse" uses the "is" of predication/class membership, not identity. The slogan forces the "is" of identity where it's inappropriate.
      *   **Supports Contingent Kind Membership?** **No.** It highlights the instance/universal distinction, not contingency. Binky's belonging to the kind "horse" is *essential* to Binky being Binky (if Binky ceased to be a horse, it would cease to exist).

  3.  **Accidental Property Addition:**
      *   **Claim:** Adding an accidental property ("white") to an object creates a *different description* that no longer refers *only* to the essential core ("horseness"). Therefore, "white horse" doesn't pick out the *same thing* as "horse".
      *   **Defensible?** **Debatable (Depends on Essentialism).**
          *   *With Essentialism:* Sort-of. The essence "horseness" might be separable conceptually from accidents like color. But "white horse" still *implies* "horse".
          *   *Without Essentialism:* Less so. Why is "white" fundamentally different? "Brown horse" ≠ "horse" too? This leads to radical particularity.
      *   **Verbal Trick?** **Moderate.** It conflates *modification* with *exclusion*. Specifying a property *narrows* the reference within the kind, it doesn't necessarily negate kind membership.
      *   **Supports Contingent Kind Membership?** **Weakly/Indirectly at best.** It highlights that objects have contingent properties, but doesn't show that *kind membership itself* is contingent. A white horse's *whiteness* is contingent, but its *horseness* might be essential.

  4.  **Intension/Extension Gap (Set Theory):**
      *   **Claim:** The *intension* (defining concept) of "white horse" (equine + white) is different from the intension of "horse" (equine). Therefore, the *extension* (set) of white horses is a *proper subset* of horses, not co-extensive with it. Sets with different members (or strict subsets) are not identical.
      *   **Defensible?** **Yes.** This is standard set theory/logic. The set {x | x is a white horse} ⊂ {x | x is a horse}, and {A} ≠ {B} if A is a strict subset of B.
      *   **Verbal Trick?** **Minimal.** It relies on a precise logical/semantic distinction.
      *   **Supports Contingent Kind Membership?** **No.** It explicitly *affirms* that white horses *are* horses (they are members of the larger set). It denies *set identity*, not *set membership* for the individuals. Precisely shows that "white horse" ≠ "horse" does *not* imply "white horses ∉ horses".

  5.  **Radical Linguistic Nominalism / Contingency of All Categories:**
      *   **Claim:** Kind terms like "horse" are *merely* linguistic conventions with no grounding in essential properties shared by objects. Any property (like "whiteness") is as valid a basis for grouping as "horseness". Therefore, "white horse" defines a kind just as legitimately as "horse", and there's no necessary connection between them beyond language. "A white horse isn't a horse" means kind terms don't latch onto real, stable essences.
      *   **Defensible?** **Highly Controversial.** This rejects realism about universals/kinds. It faces the "problem of resemblance" (why *do* we group white horses with brown horses as "horses"?) and struggles with scientific kind terms (e.g., "water" = H₂O).
      *   **Verbal Trick?** **Significant.** It uses the logical/semantic points (1-4), which are often defensible *within* a framework assuming some kind of realism, to leap to a conclusion that *undermines* any framework for stable kind membership. It's an equivocation.
      *   **Supports Contingent Kind Membership?** **Yes, but...** This interpretation *is* your roommate's conclusion. It directly claims category membership is always contingent upon the linguistic/semantic framework we choose. However, this is a *philosophical stance* (nominalism/anti-realism), not a *logical proof* derived solely from "white horse ≠ horse". The slogan is used *rhetorically* to support this view, but the slogan itself (interpreted less radically) doesn't *entail* it. Defending this requires defending nominalism itself against realism/essentialism.

  **The Verdict for Your Roommate:**

  *   **Interpretations 1, 2, and 4** are defensible logical/semantic points, but **they explicitly DO NOT support his conclusion**. They show why "white horse" ≠ "horse" is true *without* implying that a white horse isn't *a* horse or that kind membership is contingent.
  *   **Interpretation 3** touches on the distinction between essential and accidental properties. It *might* support the idea that *properties* can be contingent, but **it does not demonstrate that *kind membership itself* is contingent**.
  *   **Only Interpretation 5** directly supports his conclusion that category membership is always contingent. **However, this interpretation is not a *logical proof* derived solely from the slogan.** It is a *philosophical position* (radical nominalism/anti-realism about kinds) that *uses* the slogan as an illustration or rhetorical device. The slogan, on its common meanings (1-4), does not *force* this radical conclusion; it's compatible with essentialism or moderate realism about kinds.

  **Key Takeaway for Your Roommate:** The slogan "white horse is not horse" is primarily a clever demonstration of **semantic and logical distinctions** (term identity, predication vs. identity, intension/extension, subset relations). While it *challenges naive essentialism* by showing how adding properties creates new concepts/sets, **it does not logically prove that kind membership is always contingent or that properties "never touch identity."** It shows *how* we talk about properties and kinds, not necessarily that there *are no* stable kinds or essential properties. His conclusion requires the additional, highly contentious, philosophical commitment of radical nominalism (#5), which the slogan illustrates but does not prove on its own. Logic (as demonstrated in points 1,2,4) constrains ontology by showing his radical conclusion doesn't follow *from the slogan alone*.
