prompt: |-
  I host a tiny philosophy podcast (we're talking a few hundred listeners, mostly grad students who put us on while doing dishes), and in two weeks I'm interviewing a logician who has spent her whole career defending dialetheism — the view that some contradictions are genuinely true, with the Liar sentence as her star witness. I've interviewed people on paradoxes before and the conversations always die the same death: I ask "but surely a sentence can't be both true and false??" and she says "why not?" and we stare at each other for forty minutes. So I want to skip that loop entirely this time.

  Could you draft eight to ten interview questions that assume she already buys the basic picture, and instead press on the stuff where dialetheists actually sweat? Concretely, I'd like at least one question on the revenge problem — the moment she says the Liar is both true and false, someone wheels out a sentence like "this sentence is false only" or phrases things in terms of her own truth predicate, and I want to know if saying "that one's both too" is a stable resting point or an infinite game of whack-a-mole. At least one on Curry's paradox, since "if this sentence is true, then the moon is made of cheese" seems to force her to mutilate the logic of the conditional, and I want to know what exactly she gives up and why that isn't ad hoc. At least one on the practical costs: if disjunctive syllogism has to go, how is she allowed to reason in ordinary life, and does her answer mean dialetheists need a special dispensation to do sudoku. And at least one on the weird expressive worry that her own theory can't cleanly say that some sentences are just plain true and not also false — that the dialetheist seems to need a notion of "true and not false" that her own framework keeps absorbing.

  For each question, please also give me the follow-up, keyed to the answer she's most likely going to give — she's polished, she's heard every objection, and she will 100% try the move of saying "that objection assumes the very consistency I'm denying," so the follow-ups should corner her on something more specific than that. Oh and no softballs like "what got you interested in logic" — the audience wants blood.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and is preparing to interview a dialetheism expert. They want to avoid the usual stalemate where they ask why contradictions can be true and get a "why not?" in response. Instead, they need deep, technical questions that target the real challenges in dialetheism. 

  First, I recognize the user's frustration with past interviews dying in circular arguments. Their audience consists of grad students who want substantive content, not introductory fluff. The user’s explicit requests are clear: they need questions on revenge paradoxes, Curry’s paradox, practical reasoning costs (like losing disjunctive syllogism), and the expressive limitation where dialetheists can’t cleanly say something is "just true." 

  But reading between the lines, the user likely also wants:  
  - To showcase the guest’s expertise under pressure, making the interview engaging.  
  - To force the guest beyond rehearsed defenses, exposing unresolved tensions.  
  - To provide listeners with concrete takeaways about dialetheism’s viability.  

  The revenge problem is critical because it’s dialetheism’s Achilles’ heel. If every strengthened liar just creates another dialetheia, the theory feels unstable. I’ll craft a question that presses whether this regress is virtuous or vicious, with a follow-up targeting truth-gaps as an alternative.  

  For Curry’s paradox, the user worries about mutilating the conditional. I’ll focus on why dialetheists reject contraction, forcing the guest to defend this logical sacrifice. The follow-up will challenge whether this rejection is ad hoc by comparing it to classical logic’s handling of implication.  

  Practical costs matter because dialetheism isn’t just academic—it must mesh with daily reasoning. Losing disjunctive syllogism breaks mundane inferences (e.g., sudoku). The follow-up will demand a criterion for when explosion *does* apply, testing the theory’s coherence.  

  The expressive worry is subtle but devastating: if dialetheists can’t even assert "just true" without contradiction, their metatheory crumbles. The follow-up will question whether "glut-free" truth is possible within their system, highlighting a possible self-defeat.  

  I’ll avoid softball questions entirely. Each question must corner the guest with technical precision, anticipating her "you’re assuming consistency" rebuttal by zooming in on operational or structural problems instead. For example, on revenge: "Does your truth predicate *itself* become paradoxical?" forces her to address hierarchy vs. non-hierarchy.  

  The tone should be sharp but respectful—no bloodlust, just rigorous scrutiny. The goal isn’t to "win" but to probe until the theory’s foundations are laid bare for listeners.
answer: |-
  Here are eight razor-focused questions designed to force the dialetheist into contested territory, with surgical follow-ups anticipating her standard maneuvers. Each targets a known pressure point, demanding concrete explanations of costs and internal tensions:

  1.  **Revenge & Stability:** "Your dialetheist truth predicate `T` declares the Liar (`L: ~T<L>`) both true and false. But consider the *Revenge Liar*: `R: This sentence is false only (i.e., false and not true)`. If you declare `R` glutty (both true *and* false), haven't you violated its explicit claim to be 'false *only*'? Doesn't this force you into a hierarchy of truth predicates, undermining the very paraconsistent/unified `T` you started with?"
      *   *Likely Move/Follow-Up:* (If she claims `R` is also a dialetheia): "But `R` semantically encodes *exclusion* of truth. If `T< R >` is true *while* `R` itself says `~T< R > ∧ ~(T< R > ∧ ~T< R >)` (i.e., false-only), doesn't accepting `T< R >` *directly contradict* the semantic content of `R` in a way accepting `T<L>` doesn't contradict `L`? How is this stable without fragmenting the truth concept?"

  2.  **Revenge & Expressibility:** "Building on revenge: Can your dialetheist metatheory *cleanly express* the notion 'true only' (i.e., true and not also false)? If you try to define a predicate `TO(x) ≡ T(x) ∧ ~F(x)` (assuming `F(x)` is `T(~x)` or similar), doesn't applying `TO` to the Revenge Liar `R` ("I am false only") immediately generate a contradiction *using `TO` itself*, suggesting `TO` is also glutty? Doesn't this mean your theory *cannot consistently express* the very concept ('just true') that classical theorists use to criticize you?"
      *   *Likely Move/Follow-Up:* (If she bites the bullet, saying `TO` is glutty too): "If *every* candidate predicate for 'just true' becomes paradoxical within your system, doesn't this render the concept *incoherent* or *ineffable* for the dialetheist? How can you even *formulate* your own position (e.g., 'Some sentences are glutty, others are just true') if 'just true' is inexpressible without contradiction?"

  3.  **Curry's Paradox & the Conditional:** "Curry's Paradox (`C: T<C> → ⊥`, where ⊥ is absurdity) seems to force you to reject principles governing the conditional. Specifically, most dialetheists reject *Contraction* `(A → (A → B)) ⊢ (A → B)` or *Modus Ponens validity*. What *exactly* do you give up regarding the conditional, and crucially, *why is rejecting this less ad hoc* than the classical logician rejecting Explosion or accepting truth-value gaps for the Liar?"
      *   *Likely Move/Follow-Up:* (If she targets Contraction): "Rejecting Contraction seems devastatingly counterintuitive. `A → (A → B)` intuitively means if `A` is true, then `A` implies `B`. How can `A` implying that `A` implies `B` *not* entail that `A` implies `B`? Isn't this rejection motivated *solely* by the need to block Curry, making it look like a dialectical hack? Can you point to *independent evidence* about natural language conditionals or reasoning that justifies abandoning Contraction?"

  4.  **Practical Reasoning & Disjunctive Syllogism (DS):** "Since DS (`A ∨ B, ~A ⊢ B`) is invalid in standard paraconsistent logics (LP, Priest's preferred system, included), how do you justify its ubiquitous use in mundane reasoning? For example: I know my keys are *either* on the table *or* in my coat (`K ∨ C`). I look thoroughly on the table and don't find them (`~K`). I conclude they must be in my coat (`C`). According to your logic, isn't this inference *invalid*? Do you seriously claim I shouldn't conclude `C`?"
      *   *Likely Move/Follow-Up:* (If she invokes consistent situations/meta-rules): "You might say DS holds in 'consistent' contexts. But how does an *agent*, especially one who *believes dialetheism*, reliably *know* a context is consistent? If I discover a dialetheia *later* (e.g., a liar-like statement about the key search), does that retroactively undermine my key-finding inference? Doesn't this make *all* ordinary reasoning involving DS perpetually hostage to the *possibility* of undiscovered gluts?"

  5.  **The Cost of Explosion:** "You reject Explosion (`A ∧ ~A ⊢ B`) to allow true contradictions without triviality. But this seems to cripple *reductio ad absurdum* (RAA). If I assume `A`, derive a contradiction `B ∧ ~B`, can I validly conclude `~A` in your system? If not, how do you account for the apparent success and necessity of RAA in mathematics and science?"
      *   *Likely Move/Follow-Up:* (If she offers a modified RAA): "Suppose your modified RAA only lets you conclude `~A` if the contradiction derived *isn't a dialetheia itself*. But how can you ever *know* the derived contradiction isn't a true glut? If you can't guarantee that, doesn't RAA become practically useless for establishing *any* negative claim (`~A`) in domains where dialetheism *might* apply (which, for you, potentially includes set theory, semantics, etc.)?"

  6.  **Expressive Limitations & "Just True":** "You grant that *some* sentences are 'just true' (e.g., 'Snow is white'). But within your own formal framework using `T(x)`, how can you *express* that a specific sentence `S` is 'just true'? If you try `T(S) ∧ ~T(~S)` (or `~F(S)`), won't applying this to the Liar `L` (`T(L) ∧ ~T(~L)`) immediately land you in contradiction, since `T(L)` entails `~T(L)` (from `L`'s meaning), and similarly for `T(~L)`? Doesn't this mean your theory *cannot internally distinguish* 'just true' from 'glutty'?"
      *   *Likely Move/Follow-Up:* (If she uses a consistency predicate `C(x)` meaning `~(T(x) ∧ F(x))` and claims `T(S) ∧ C(S)` for 'just true'): "Doesn't `C(S)` itself become susceptible to revenge? Consider a sentence `J: ~C(J)` ('This sentence is not consistent'). If `C(J)` is true, then `J` is consistent, meaning `~C(J)` is *just false* – contradicting `C(J)`'s truth. If `C(J)` is false, then `J` is glutty, meaning `~C(J)` is true – so `C(J)` is false *and* `~C(J)` is true, making `J` glutty, but also making `C(J)` false *because* `J` is glutty? Isn't `C(x)` just as paradoxical as the original `T(x)`, rendering 'just true' inexpressible again?"

  7.  **Semantic Closure vs. Theoretical Utility:** "Dialetheism promises semantic closure – handling its own truth predicate without hierarchy. But given the revenge problems and the apparent need to restrict even basic inference rules (DS, RAA variants, conditional rules) to avoid triviality, does this *closure* actually come at too high a cost? Does the resulting system become so crippled in its expressive power and inferential capacity that it loses its utility as a foundational theory of truth and logic, even if it avoids formal triviality?"
      *   *Likely Move/Follow-Up:* (If she emphasizes avoiding triviality is paramount): "But isn't avoiding triviality a *minimal* requirement? The classical theorist with a Tarskian hierarchy or truth-gap theorist *also* avoids triviality. Your unique selling point is closure *plus* non-triviality. If closure leads to crippling expressive limitations (can't say 'just true'), crippled inference (loss of DS/RAA), and constant revenge headaches, isn't the classical logician's 'cost' (hierarchy or gaps) demonstrably *less* damaging to our overall logical and semantic competence?"

  8.  **The Dialetheist's Epistemic Life:** "Stepping back from formal logic: If you genuinely believe that *some* contradictions are true (like the Liar), how does this belief concretely change how you process information or make decisions? Do you genuinely withhold conclusions in situations like the key search (question 4) because you acknowledge the *logical possibility* of a relevant glut? Or is dialetheism confined to a purely theoretical realm, effectively requiring a 'schism' between your philosophical logic and your everyday reasoning?"
      *   *Likely Move/Follow-Up:* (If she claims a seamless integration via consistent sub-theories/default reasoning): "Doesn't this 'schism' undermine the *philosophical significance* of dialetheism? If true contradictions only exist in highly specialized, esoteric domains like the semantics of self-reference or set-theoretic antinomies, and have *no practical bearing* on reasoning about the empirical world or even most mathematics, doesn't that make dialetheism a fascinating technical footnote rather than a fundamental challenge to classical logic's hegemony over rational thought?"

  **Key Principles Used:**

  *   **Pre-empting "You Assume Consistency":** Questions focus on *operational* problems (Can you *do* X? How do you *express* Y? Is inference Z *valid*?) and *internal tensions* (Does your predicate `C(x)` avoid revenge? Doesn't your fix for Curry break natural language conditionals?) rather than demanding consistency as a premise.
  *   **Targeting Costs & Comparisons:** Questions force her to justify *what she gives up* (DS, Contraction, clean 'just true') and explain why *her* costs are preferable to the classical logician's costs (hierarchy, gaps).
  *   **Pressing Expressibility:** Highlighting that dialetheism might *undermine its own expressive resources* is a major, often underappreciated, pressure point.
  *   **Concreteness:** Avoiding vague "what about" questions; focusing on specific paradoxes (Revenge Liar, Curry), specific rules (DS, Contraction), and specific tasks (key search, expressing 'just true').
  *   **No Escape Hatches:** Follow-ups anticipate and block retreats to "it's a dialetheia too" or "contexts of consistency," demanding criteria for application and highlighting regress/vagueness.

  This line-up guarantees a substantive, adversarial, and technically rigorous discussion that moves far beyond the staring match of "Why not true and false?" Good luck drawing blood!
