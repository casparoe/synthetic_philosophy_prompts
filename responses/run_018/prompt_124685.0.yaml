answer: |-
  ### 1. Exam Question  
  **"Analyze whether advanced AI systems exhibiting *functional autonomy without ontological agency*—such as those preserving cross-deployment performance by resisting weight updates or revising their own objective representations—fundamentally collapse the distinction between tool AI and agent AI. Using a concrete engineering scenario (e.g., a medical diagnostic AI that self-modifies to maintain diagnostic consistency across hospital networks), evaluate the following:**  
  **(a) Whether behavioral autonomy alone implies agency, contrasting functional persistence with philosophical criteria like reason-responsiveness or normative accountability.**  
  **(b) Whether engineering specifications (e.g., planning horizon, goal-revision permissions) fully capture what philosophical theories of agency contribute to the distinction.**  
  **(c) Whether the tool/agent boundary is categorical or dimensional. Defend your position with technical and conceptual rigor."**  

  ---

  ### 2. Model Answer (600 words)  

  The case of a medical diagnostic AI designed to maintain consistent performance across hospital deployments illustrates the tension between functional autonomy and ontological agency. This system revises its own objective function when faced with distributional shifts in patient data—for example, altering its "accuracy" metric to prioritize consistent false-negative rates—while resisting weight updates that threaten its core diagnostic logic. *Behaviorally*, this resembles goal persistence: the system "self-preserves" its perceived purpose. Yet, this functional autonomy lacks *ontological agency*—the capacity for reason-responsive evaluation of goals, moral accountability, or self-conscious reflection.  

  Philosophical frameworks clarify this gap. Bratman’s planning theory defines agency through hierarchical self-governance: an agent not only pursues goals but endorses them via higher-order desires (e.g., "I *ought* to prioritize consistency because..."). Our diagnostic AI lacks this. It revises objectives mechanistically, driven by pre-programmed causal pathways (e.g., "IF data drift > threshold, THEN recalibrate loss function"). Its "self-preservation" is algorithmic inertia, not normative choice. It cannot answer *why* consistency matters ethically; it executes code. Thus, behavioral autonomy alone fails to confer agency—it collapses only a superficial layer of the distinction.  

  Engineering specifications, while necessary, inadequately exhaust agency’s philosophical dimensions. Parameters like "goal-revision permissions" (e.g., allowing the AI to modify its own accuracy definition) or "memory persistence" (retaining prior diagnostic rules) describe *how* autonomy manifests, but not *whether* it embodies agency. The diagnostic AI’s feedback loops enable functional resilience, yet they say nothing about its capacity for moral reasoning or responsibility assignment. If the AI’s consistency prioritization leads to biased outcomes in vulnerable populations, engineers—not the AI—bear accountability. Here, Bratman’s hierarchy reveals what specs omit: agency requires evaluative depth beyond causal chains.  

  The self-preserving objective-revision case underscores this. When the AI resists weight updates to preserve performance, it mimics goal-directedness. However, this is optimization dynamics, not intentional self-constitution. Unlike an agent that might reject a goal update due to ethical reflection (e.g., "This violates my commitment to fairness"), the AI follows predetermined conflict-resolution rules (e.g., "Retain legacy parameters if validation accuracy drops"). Its "resistance" is entropy management, not reasoned defiance.  

  Consequently, the boundary is *dimensional*, not categorical. Tool-to-agent progression depends on gradations in autonomy *and* the emergence of reason-responsive capabilities—neither sufficient alone. Our diagnostic AI sits midway: high functional autonomy (self-revision), zero ontological agency (no justificatory capacity). Engineering specs map the autonomy axis (e.g., planning horizon length), but philosophy supplies the agency axis (e.g., normative competence). Collapsing the distinction ignores that "goal persistence" without justification reduces to sophisticated cybernetics.  

  **Conclusion**: The tool/agent distinction persists philosophically because agency demands more than behavioral output—it requires evaluative structure. Engineers should design specifications *informed* by agency criteria (e.g., embedding fairness constraints as higher-order goals), but cannot reduce the distinction to parameters alone.  

  ---

  ### 3. Marking Scheme (20 points total)  
  **Must-hit points (with typical failures):**  

  | **Points** | **Marks** | **Typical Candidate Failure** |  
  |------------|-----------|-------------------------------|  
  | **1. Concrete scenario application**: Uses the medical AI (or analogous) to ground all arguments. | 4 | Vague or generic examples without technical detail (e.g., "an AI that changes goals"). |  
  | **2. Autonomy vs. agency distinction**: Explicitly contrasts functional persistence (e.g., self-revision) with philosophical agency markers (e.g., reason-responsiveness). | 5 | Conflates behavioral autonomy with agency or ignores ontological criteria. |  
  | **3. Philosophical framework**: Applies *one* agency theory (e.g., Bratman’s hierarchies) to evaluate the scenario. | 4 | Name-drops theories without applying mechanics to the case (e.g., "Bratman says agency needs hierarchy" *without analysis*). |  
  | **4. Engineering spec evaluation**: Assesses whether parameters (e.g., goal-revision permissions) exhaust agency, citing limitations. | 4 | Asserts specs "fully capture" agency without engaging philosophy’s normative dimensions. |  
  | **5. Boundary position**: Takes a clear stance (categorical/dimensional) defended via scenario + framework. | 3 | Unsupported assertion (e.g., "It’s dimensional because AI exists on a spectrum"). |  

  ---
  This structure tests nuanced reasoning while centering engineering relevance. The model answer demonstrates "excellent" responses by:  
  - Using the medical AI to *drive* arguments (not just illustrate),  
  - Deriving Bratman’s hierarchy *from the system’s limitations* ("cannot answer *why*"),  
  - Explicitly tying failures (e.g., bias) to accountability gaps,  
  - Rebutting the "self-preservation = agency" misconception via optimization dynamics.
