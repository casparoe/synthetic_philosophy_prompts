answer: |-
  ### **Cicero's *De Senectute* In-Class Activity: "Coherence in the Garden"**  
  **Goal:** Experience Cicero’s reframing of aging as a shift in *officia* (life-stage appropriate roles), not decline, by grappling with tensions between his rebuttals to the four charges against old age.  

  ---

  ### **Activity Structure**  
  #### **Participants & Timing**  
  - **10 participants** (5 pairs per round).  
  - **2-hour total**:  
    - **0:00–0:15**: Setup, rules, and charge assignment.  
    - **0:15–0:55**: Rotating pair debates (3 rounds × 12–13 min each).  
    - **0:55–1:25**: Debrief and scoring reveal.  
    - *Remaining time*: Your lecture on Roman social context (cursus honorum, retirement shame).  

  #### **Materials**  
  - **4 Charge Cards** (one per pair per round; see below for content).  
  - **Consistency Tracker** (instructor’s hidden scorecard; template provided).  
  - **Timer**, whiteboard, and pens.  

  ---

  ### **Rules & Workflow**  
  #### **Setup (0:00–0:15)**  
  1. **Brief Context**: Remind students of Cicero’s core argument:  
     - Aging is not deprivation but a shift in *officia* (e.g., from active politics to advisory/contemplative roles).  
     - The four charges:  
       - **Body**: Physical decline.  
       - **Politics**: Withdrawal from public life.  
       - **Pleasures**: Loss of sensual joys.  
       - **Death**: Imminence of death.  
  2. **Assign Roles**:  
     - Each pair receives **one Charge Card** per round.  
     - Cards are rotated so each pair defends **3 different charges** (one per round; *Death* is left undefended by all to save time).  
  3. **Hidden Rule**:  
     - Students are told: *"Defend Cicero against your assigned charge using his arguments. Your goal is to craft a compelling defense."*  
     - **Unspoken twist**: Scoring is based on **consistency across all defenses**, not individual persuasiveness.  

  #### **Debate Rounds (0:15–0:55)**  
  - **3 rounds × 12–13 min each**:  
    - **Min 0–7**: Pairs prepare defense using Cicero’s arguments (notes encouraged).  
    - **Min 7–12**: Pairs debate each other (*not* collaborate)—one defends, the other critiques.  
  - **Rotation**:  
    - After each round, pairs split and form new pairs (pre-assigned partners to ensure mixing).  
    - Each pair receives a **new Charge Card** (e.g., Pair 1 defends *Body* in Round 1, *Politics* in Round 2, *Pleasures* in Round 3).  

  #### **Charge Card Content**  
  Each card includes:  
  1. **The Charge** (e.g., *Politics*: "Old age forces withdrawal from public life, stripping purpose").  
  2. **Cicero’s Rebuttal (Simplified)** as a prompt:  
     - *Body*: "Exercise and moderation maintain vigor; wisdom compensates for physical limits."  
     - *Politics*: "Withdrawal is not loss but a shift to wiser roles (e.g., advising, study), free from civic noise."  
     - *Pleasures*: "Sensual joys fade, but deeper pleasures (e.g., friendship, philosophy) intensify."  
     - *Death*: "Death is natural; a life well-lived grants acceptance."  
  3. **Space for Defense Notes**.  

  ---

  ### **Consistency Scoring & Reveal (0:55–1:25)**  
  #### **Instructor’s Tracker**  
  - **Grid Template**:  
    | Participant | Body Defense | Politics Defense | Pleasures Defense | Consistency Score |  
    |------------|--------------|------------------|-------------------|-------------------|  
    | 1          | [Argument]   | [Argument]       | [Argument]        | 0-3               |  
    | ...        | ...          | ...              | ...               | ...               |  
  - **Scoring Rules**:  
    - **1 pt.** per defense that **does not contradict** their other defenses.  
    - **Max 3 pts.** (since each defends 3 charges).  
    - **Key tensions to flag** (examples):  
      - If *Politics* defense praises "withdrawal for contemplative wisdom" but *Body* defense insists "physical vigor is essential," contradiction arises (Cicero links wisdom *and* bodily maintenance).  
      - If *Pleasures* defense dismisses bodily needs but *Body* defense stresses physical care, inconsistency occurs.  

  #### **Reveal & Debrief**  
  1. **The Twist (5 min)**:  
     - Announce: *"Your goal was coherence, not persuasion. Could your defense of one charge undermine another?"*  
     - Share **anonymized scores** (e.g., "3/3 scored 2 points—one inconsistency detected").  
  2. **Breakdown Moments (15 min)**:  
     - Ask pairs: *"Where did you feel tension between your defenses?"*  
     - **Map tensions to Cicero**:  
       | Tension Observed                     | Cicero’s Resolution in *De Senectute*                                  |  
       |--------------------------------------|------------------------------------------------------------------------|  
       | "Wisdom vs. Physical Vigor"          | **Shift in officia**: Bodily care serves wisdom roles (e.g., advising), not political hustling. Exercise is "moderate" (Chap 9). |  
       | "Rejecting Pleasures vs. Needing Body" | **Hierarchy of goods**: Bodily health enables higher pleasures (e.g., friendship), not sensual indulgence (Chap 12–13). |  
       | "Withdrawal vs. Purpose"             | **Appropriate action**: Politics is replaced by *otium cum dignitate*—study/mentorship as natural, dignified roles (Chap 6–7). |  
  3. **Synthesis (5 min)**:  
     - Cicero’s genius: **Aging reorients *officia***, but roles remain interdependent (bodily health supports wisdom; wisdom justifies withdrawal).  
     - Inconsistencies arise when defenses **isolate charges**; coherence comes from seeing aging as an *integrated phase of life*.  

  ---

  ### **Limitations of the Activity**  
  1. **What It Can’t Reproduce**:  
     - The **social weight of the cursus honorum**: Roman aristocracy tied status to lifelong public office. Retirement implied irrelevance, not tranquility.  
     - **Emotional shame of withdrawal**: Cicero’s audience felt visceral loss leaving politics; the activity’s "tensions" are logical, not existential.  
     - **Stoic depth**: *Officia* derive from cosmic *logos*; the activity simplifies this to "role shifts."  
  2. **Mitigation**:  
     - Your follow-up lecture will contextualize these gaps using Roman social history (e.g., stigma of *senectus* in a youth-obsessed culture).  

  ---

  ### **Why This Works**  
  - **Pedagogical Payoff**: Students *feel* Cicero’s balancing act—e.g., praising withdrawal for wisdom while upholding bodily care—before analyzing it.  
  - **No Prep Needed**: Charge Cards encapsulate text; scoring is qualitative.  
  - **Stoic Framing**: *Officia* is the through-line, forcing debate on role interdependence.  

