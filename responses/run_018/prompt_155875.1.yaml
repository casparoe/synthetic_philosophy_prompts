answer: |-
  Your novel's core insight—that discount rates encode ethical judgments about future moral standing—finds a potent historical parallel in the *Limits to Growth* (LtG) controversy. Here's the conceptual breakdown:

  **The LtG Episode & Implicit Intertemporal Weights:**

  1.  **The MIT Group (Meadows, Forrester, et al.) & WORLD3 Model:**
      *   **Model Structure:** WORLD3 was a system dynamics model simulating global interactions (population, industrialization, pollution, resources, food). It projected trajectories over centuries (1900-2100+).
      *   **Implicit Intertemporal Weights:** Crucially, the model itself **did not apply a *social discount rate* to future welfare.** It treated physical stocks and flows (resources, pollution accumulation) and their impacts on population/industrial output with **equal weight across time.** A ton of resources consumed or a unit of pollution emitted in 2100 affected the simulated system identically to one in 1970.
      *   **Embedded Ethics:** This structure implicitly assumed **equal moral standing for all generations within the simulation timeframe.** The "catastrophic" collapse scenarios resulted directly from projecting current physical trends forward *without* assuming technological salvation or devaluing future impacts. The ethical stance was: *If current physical trends continue, they will physically degrade the future environment and population, and that future suffering matters as much as present suffering.* The discount rate was effectively **0% for the physical basis of welfare** over the modeled horizon.

  2.  **Institutional Sponsors (Club of Rome):**
      *   Their sponsorship reflected a normative concern about **long-term sustainability** and the potential for present actions to inflict severe harm on future generations. They sought a model that would illuminate these physical interdependencies without *a priori* discounting the distant future. Their implicit ethics aligned with the model's structure: **future generations possess full moral standing.**

  3.  **Early Critics (Nordhaus, Beckerman, et al.):**
      *   **Critique Focus:** The backlash targeted both empirical and normative dimensions, often intertwined:
          *   **Empirical Assumptions:** Critics attacked specific parameter values (resource estimates, pollution impact coefficients, technological progress functions), model structure (aggregation, omitted feedbacks like price mechanisms and innovation incentives), and data quality. Nordhaus argued the model lacked sufficient economic feedbacks and overestimated constraints.
          *   **Normative Premises (The Smuggled Time Preference):** This was the deeper, often less explicit, criticism:
              *   **Discounting Future Welfare:** Critics like Nordhaus argued that even *if* physical collapse were possible far in the future, its negative welfare impact should be **heavily discounted**. They contended that future generations would be vastly richer due to technological progress and capital accumulation, so a unit of consumption lost in 2100 mattered far less than one lost today. This embeds a **positive pure time preference rate** and/or high elasticity of marginal utility, devaluing future welfare.
              *   **"Morally Repugnant" & Opportunity Cost:** Some critics (e.g., Beckerman) explicitly argued that prioritizing distant future risks over present poverty alleviation and growth was **ethically unacceptable**. Sacrificing current welfare for highly uncertain, discounted future benefits was seen as irrational or even immoral. This directly challenges the equal moral standing premise.
              *   **Technological Optimism as Ethics:** Faith in human ingenuity and market adaptation wasn't just an empirical prediction; it served as an *ethical counterweight*. If technology can always circumvent limits, then there's no need to sacrifice present welfare for future generations – their standing is secured *by default* through progress, negating the need for the model's warnings.

  **Separation of Pure Time Preference & Instrumental Discounting: The Episode's Revelation**

  The LtG controversy starkly reveals that **clean separation is impossible in practice within policy-relevant modeling:**

  1.  **Normative Choices Drive Empirical Focus:** The choice to model physical stocks/flows over centuries *without discounting* was itself a normative decision prioritizing long-term physical sustainability and equal generational standing. Conversely, critics' insistence on including economic feedbacks and discounting was driven by the normative belief in optimizing present welfare and trusting future adaptation.
  2.  **Empirical Disputes Mask Normative Fault Lines:** Debates over resource estimates or technological parameters often served as proxies for deeper disagreements about the moral weight of the future. Critiquing the model's "pessimism" was frequently a way of rejecting its implied ethics of intergenerational equity.
  3.  **Instrumental Discounting Presumes Normative Grounding:** Arguments for discounting future *welfare* (distinct from market interest rates) invariably rest on ethical premises: either pure time preference (future well-being intrinsically matters less) or the opportunity cost argument (investing in the present yields higher future welfare). Both are normative claims about value across time. WORLD3 avoided welfare discounting but exposed the physical basis, forcing the ethical debate into the open.
  4.  **The "Smuggling":** Critics didn't merely say WORLD3 was empirically wrong; they insisted its *conclusions* were normatively undesirable *even if* empirically plausible, because they implied sacrificing current welfare for the distant future. This demand for discounting future welfare impacts smuggled in the normative stance that the future *should* count for less.

  **Support for Your Character's Intuition:**

  The LtG episode **strongly supports** your character's intuition:

  1.  **WORLD3 as the "Undiscounted Future":** By refusing to discount physical impacts, the model treated future generations as **fully realized characters** inhabiting a tangible, degraded (or sustained) world. Their suffering or flourishing was given equal weight within the simulation's logic, making the ethical stakes visceral. This *is* the narrative stance your character envisions.
  2.  **The Backlash as Confirmation:** The intensity of the backlash, particularly the explicitly ethical critiques (e.g., "morally repugnant"), demonstrates that **discounting is fundamentally an ethical shield.** Critics recognized that removing the discount rate exposed the raw potential cost to the future and found this implication philosophically and practically unacceptable. They demanded the reintroduction of discounting precisely to diminish the perceived moral standing of those distant generations.
  3.  **The Defensibility Exposed:** The debate *itself* validated the defensibility of the equal standing stance. While critics rejected it, the fact that WORLD3 forced a global conversation about intergenerational responsibility, based on projecting physical consequences equally, demonstrates its philosophical resonance and power. It presented a future where people *were* characters whose fate depended on present choices, not discounted abstractions. The controversy proved this is a legitimate, albeit contested, ethical position with significant real-world implications.

  **Conclusion:**

  The *Limits to Growth* controversy serves as a powerful historical case study for your novel's theme. The WORLD3 model, by eschewing welfare discounting and projecting physical trends equally across centuries, implicitly assigned **full moral standing to future generations** within its simulated world. The fierce backlash, spearheaded by economists like Nordhaus, targeted empirical flaws but crucially also revealed a deep-seated normative commitment to **discounting future welfare (positive pure time preference)**, rejecting the model's premise of equal standing. This episode proves that pure time preference is inextricably embedded in—and often smuggled into—policy modeling through arguments about discounting, opportunity cost, and technological faith. The controversy demonstrates that portraying the future without discounting, as WORLD3 did and your character envisions, is not just a modeling choice but a profound ethical declaration—one that is fiercely contested yet philosophically defensible, as evidenced by its enduring impact and the visceral reactions it provoked. Your character's intuition that such a narrative stance embodies a commitment to full moral standing for future people is directly validated by how LtG framed the debate and the nature of the opposition it faced.
