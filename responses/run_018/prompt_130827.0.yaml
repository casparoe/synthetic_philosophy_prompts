  **Simulation Design:**

  **Title:** The Consent Cascade

  **Core Idea:** Participants are "Guardians" in a system where they must decide whether to allow a "Resident" to be coerced into labor in their own domain (which they directly control) to prevent a chain reaction that would cause more Residents to be coerced in other domains.

  **Roles:**
  - 8 participants: Each is a Guardian of a separate domain (Domains 1-8). Each domain has one Resident.
  - Facilitator: Runs the simulation, enforces rules, and distributes materials.

  **Setup:**
  - Arrange the room so that the eight participants sit in a circle. This circle represents the interconnected system.
  - Each participant receives:
    - A role card: "You are the Guardian of Domain [X]. Your primary duty is to uphold the absolute prohibition against coercing any Resident into productive labor without their consent. You are responsible for the Resident in your domain."
