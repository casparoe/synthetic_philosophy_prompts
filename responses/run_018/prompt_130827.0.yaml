  1. **Collapsing into utilitarianism:** Participants might see the token loss as a simple cost and choose to minimize total token loss (or minimize the number of Residents coerced) and thus always choose red when they can stop a big wave. But note: the token loss for red (2) is higher than for green (1). So if a Guardian stops a wave that would have coerced k Residents, they are saving (k-1) Residents from coercion (because if they choose red, only one is coerced; if they choose green, then at least their Resident is coerced and then k-1 more). But the token loss for red is 2, and if they choose green they lose 1 and then the next Guardians might also lose 1 and so on. However, the total token loss might be higher if the wave continues. But the participants might not calculate that. To avoid explicit calculation, the facilitator should remind them of their duty and the absolute prohibition. Also, in the debrief, note that the agent-relative reason is not about minimizing total harm.

     Adjustment: Emphasize at the start: "Your duty is to uphold the prohibition against coercing your Resident. The token loss is meant to represent the moral residue of your choices, but it is not a currency. You must decide based on your duty."

  2. **Debrief arriving too early:** The facilitator must stick to the timeline and not jump to the conceptual discussion during the game.

  3. **Participants not feeling the tension:** If the wave starts near the end, the Guardian might not feel much pressure because they can only stop a small wave. By having multiple rounds and varying the start, we hope to give each participant a chance to be in a critical position.

  4. **Time management:** The rounds might take longer than expected. The facilitator should strictly enforce time per round.

  **Revised Rules for Clarity:**
  - The wave moves in numerical order from the starting domain to the next higher number until it reaches 8 (or until stopped).
  - When the wave is at a domain, the Guardian must choose:
     - Green: The system coerces the Resident in that domain. The wave moves to the next domain (if any). The Guardian loses 1 token.
     - Red: The Guardian coerces the Resident in that domain. The wave stops. The Guardian loses 2 tokens.
  - If the wave is at the last domain (8) and the Guardian chooses green, the system coerces the Resident and the wave stops (since there is no domain 9). The Guardian loses 1 token.

  **Example of one round (wave starts at 1):**
  - Guardian 1: 
     - If chooses red: coerces Resident 1, loses 2 tokens, wave stops. No other domains are affected.
     - If chooses green: system coerces Resident 1, Guardian 1 loses 1 token, wave moves to 2.
  - Guardian 2: 
     - If Guardian 1 chose green, then wave is at 2. Guardian 2 faces the same choice.

  If all choose green: 
     - Resident 1 coerced (by system), Guardian 1 loses 1 token.
     - Resident 2 coerced (by system), Guardian 2 loses 1 token.
     - ... until Resident 8 coerced (by system), Guardian 8 loses 1 token.

  Total: 8 Residents coerced, 8 tokens lost.

  If Guardian 1 chooses red: 
     - Resident 1 coerced (by Guardian 1), Guardian 1 loses 2 tokens. Wave stops. 
     - No other Residents coerced.

  Total: 1 Resident coerced, 2 tokens lost.

  But note: if the wave starts at 3 and Guardian 3 chooses red, then only Resident 3 is coerced. If Guardian 3 chooses green, then the wave goes to 4, and so on.

  This setup should create the tension: if a Guardian is in a position to stop the wave (and prevent multiple future coercions) by breaching (and thus doing the direct wrong), they face a dilemma.

