  - The system has a chain reaction rule: If a Guardian in Domain X chooses to uphold the prohibition (green card), then the system pressure increases and causes the next domain (X+1) to face a higher chance of having their Resident coerced *by an external force* (not by the Guardian). However, if a Guardian breaches the prohibition (red card), they prevent this pressure from passing to the next domain.
