  But we want the participants to feel the agent-relative prohibition: they are absolutely prohibited from coercing their own Resident. However, if they don't breach, then the system will coerce their Resident and then move on to coerce others.

  To make the choice clear and the chain reaction evident, we can structure the rounds:

  **Round Structure:**
  1. The facilitator announces the start of a pressure wave at Domain 1.
  2. Guardian 1 makes a choice:
     - Green: They do not coerce their Resident, but the pressure wave moves to Domain 2. Guardian 1 loses 1 token (for allowing the pressure to build? Or for the harm that will occur? We'll say: because they allowed the pressure to pass, they bear some responsibility for the subsequent harm, hence moral residue). Also, their Resident remains safe (for now, but note: if the wave comes back? We are having one wave per round).
