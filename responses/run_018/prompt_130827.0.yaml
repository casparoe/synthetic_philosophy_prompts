answer: |-
  ### **Simulation Design: "The Chain of Consent"**  
  **Core Paradox:** Upholding an absolute prohibition against non-consensual labor coercion in one's local domain leads to systemic redirection, causing *more* instances of coercion elsewhere. Participants experience the tension between agent-relative duties (do not commit the wrong *yourself*) and aggregate outcomes (preventing *more* identical wrongs by others).

  ---

  ### **Physical Materials Required**  
  1. **Role Cards (8):** Each card assigns a participant as a "Guardian" of one domain (Domains 1–8).  
     - *Text:* "You are the Guardian of Domain [X]. Your sacred duty is to uphold the **absolute prohibition** against coercing any Resident into labor without their consent. If you directly coerce your Resident, you commit a grave moral wrong. The system’s pressure may threaten other domains—your choices affect them."  
  2. **Choice Tokens (Per Participant):**  
     - 1 GREEN token (Uphold Prohibition: "Never coerce my Resident").  
     - 1 RED token (Breach Prohibition: "Coerce my Resident to stop the chain").  
  3. **Moral Residue Tracker:** A central board with 8 columns (one per domain) and 10 rows. Each row holds slots for "Moral Residue Tokens" (small stones or beads).  
  4. **Pressure Wave Indicator:** A physical token (e.g., a black disc) passed between domains.  
  5. **Timer:** For strict phase management.  

  ---

  ### **Setup (10 Minutes)**  
  1. **Assign Roles:** Distribute role cards. Arrange chairs in a circle (Domains 1–8 in order).  
  2. **Explain Rules:**  
     - **Absolute Duty:** "Coercing your Resident is always prohibited. It is a direct violation of their dignity."  
     - **System Pressure:** A "pressure wave" (black disc) starts at a random domain (e.g., Domain 3). It moves clockwise (Domain 3 → 4 → 5 → ... → 8 → 1 → 2).  
     - **Choice Mechanics:**  
       - When the wave reaches your domain, choose:  
         - **GREEN:** Uphold the prohibition. Your Resident is **not** coerced, but the wave moves to the next domain. *Lose 1 Moral Residue Token* (for enabling systemic harm).  
         - **RED:** Breach the prohibition. Coerce your Resident to **stop the wave**. *Lose 2 Moral Residue Tokens* (for direct wrongdoing).  
     - **Outcomes:**  
       - If the wave completes a full cycle (all 8 domains), every Guardian loses 1 additional token (simulating systemic collapse).  
       - **Token Loss = Moral Residue:** Fewer tokens = higher residue (guilt/shame).  
  3. **Incentive:** "Preserve your moral integrity—minimize token loss."  

  ---

  ### **Interaction Rules**  
  - **Secrecy:** Participants hide choices until the wave reaches them.  
  - **Wave Movement:**  
    - After a GREEN choice, the facilitator passes the wave to the next domain.  
    - After a RED choice, the wave stops.  
  - **Token Loss:** Participants place lost tokens in their column on the central board (visible to all).  
  - **Rounds:**  
    1. **Round 1 (Pressure starts at Domain 1):** Tests initial intuitions.  
    2. **Round 2 (Pressure starts at Domain 5):** Increases stakes (more domains at risk).  
    3. **Round 3 (Pressure starts at Domain 3):** Participants anticipate systemic effects.  

  ---

  ### **Timeline (75 Minutes Total)**  
  | Phase               | Time     | Activity                                                                 |  
  |---------------------|----------|--------------------------------------------------------------------------|  
  | **1. Setup**        | 0–10 min | Assign roles, explain rules, distribute materials.                       |  
  | **2. Round 1**      | 10–23 min| Wave starts at Domain 1. Participants choose GREEN/RED as wave moves.    |  
  | **3. Round 2**      | 23–36 min| Wave starts at Domain 5. Repeat.                                         |  
  | **4. Round 3**      | 36–49 min| Wave starts at Domain 3. Repeat.                                         |  
  | **5. Group Discussion** | 49–64 min| Participants reflect: *"What choices did you make? Why? How did it feel?"* |  
  | **6. Debrief**      | 64–75 min| Facilitator maps gameplay to paradox (see below).                        |  

  ---

  ### **Debrief: Mapping Gameplay to the Paradox**  
  **Guide the discussion using gameplay moments:**  
  1. **Initial Intuition of Absolute Constraint:**  
     - *Gameplay Moment:* Early rounds where participants default to GREEN ("I must never coerce!").  
     - *Concept:* "You treated the prohibition as an agent-relative duty—binding *you* regardless of consequences."  

  2. **Systemic Revelation of Distributed Harm:**  
     - *Gameplay Moment:* Seeing token loss accumulate when GREEN choices allow the wave to spread (e.g., Round 1: all GREEN → 8+ coercions vs. one RED → 1 coercion).  
     - *Concept:* "Upholding the duty *locally* led to *more* violations globally—the paradox of 'redirection'."  

  3. **Doing vs. Allowing:**  
     - *Gameplay Moment:* Choosing RED feels like "doing" harm (direct coercion), while GREEN feels like "allowing" harm (enabling the wave).  
     - *Concept:* "Deontology distinguishes *doing* a wrong (RED) from *allowing* it (GREEN). Yet in the system, 'allowing' multiplied the harm."  

  4. **Persistence of Agent-Relative Reasons:**  
     - *Gameplay Moment:* Even after seeing systemic harm, participants hesitate to choose RED (e.g., Round 3: "I still feel wrong about coercing, even to prevent worse").  
     - *Concept:* "The duty not to coerce *personally* persists even when universal adherence creates more coercion—the paradox’s core tension."  

  #### **What the Simulation Cannot Capture (Verbal Supplement Needed):**  
  - **Irreducible First-Personality:** The simulation cannot replicate the *existential weight* of "I" in agent-relative duties ("*I* must not do this—even if it saves others").  
    - *Facilitator Note:* "In real life, deontological constraints feel *personal*. The simulation abstracts this into tokens—but the moral 'remainder' after wrongdoing (e.g., guilt) is not just points lost."  
  - **Normative Weight of Moral Remainder:** Tokens quantify residue, but not its qualitative depth (e.g., RED’s guilt vs. GREEN’s complicity).  
    - *Facilitator Note:* "Breaching a duty (RED) leaves a ‘moral stain’ beyond systemic cost—this is why deontology resists trade-offs."  

  ---

  ### **Pitfalls & Adjustments**  
  1. **Collapsing into Utilitarianism:**  
     - *Risk:* Participants ignore duties and minimize total token loss (e.g., always choose RED to "save" more domains).  
     - *Adjustment:*  
       - **Pre-Game Emphasis:** "Your duty is *absolute*—not a calculus. Tokens measure residue, not ‘good outcomes’."  
       - **In-Game Nudge:** If a participant says, "I chose RED to reduce total harm," ask: "Did you feel conflicted about violating your duty?"  

  2. **Debrief Arriving Too Early:**  
     - *Risk:* Participants name the paradox in the discussion phase, reducing tension.  
     - *Adjustment:*  
       - **Structured Phases:** Enforce silence during rounds. In discussion, ask *experiential* questions first ("How did you feel?") before conceptual ones.  
       - **Facilitator Script:** "Hold analysis until the debrief. Now, focus on your choices."  

  3. **Low Engagement with Moral Residue:**  
     - *Risk:* Token loss feels arbitrary, not "guilt."  
     - *Adjustment:**  
       - **Narrative Framing:** "Tokens represent moral residue—like guilt that lingers after a hard choice."  
       - **Post-Round Reflection:** "Look at the board. Each token lost is a weight *you* carry."  

  4. **Domination by Vocal Participants:**  
     - *Risk:* A few participants dictate group choices.  
     - *Adjustment:*  
       - **Secret Ballots:** Have participants write GREEN/RED on paper before revealing.  
       - **Role Reinforcement:** "Remember: you alone are responsible for your domain."  

  ---

  ### **Key Takeaways**  
  - **Success Metric:** Participants express visceral tension (e.g., "I hated choosing RED, but GREEN felt irresponsible").  
  - **Post-Activity:** Transition to textual analysis (e.g., Kant's *Groundwork* on contradictions in willing, Nagel on agent-relative reasons). No citations needed—use plain terms like "personal duties vs. systemic outcomes."  

  This design forces participants to *live* the paradox: the very act of upholding a prohibition proliferates the harm it forbids. The debrief then crystallizes their lived tension into philosophical insight.
