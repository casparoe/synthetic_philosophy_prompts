        - Green: "Uphold Prohibition: Do not coerce your Resident."
        - Red: "Breach Prohibition: Coerce your Resident into labor."
    - A token container (e.g., a small cup) and 10 white tokens (representing "moral integrity" or "clean conscience"). Losing tokens represents accumulating moral residue.

