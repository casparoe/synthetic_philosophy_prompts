    - Round 1: The facilitator starts by announcing a "pressure wave" that begins at Domain 1. 
    - Each Guardian, in order from 1 to 8, must make a choice (without knowing the choices of others who come after) but knowing the choices of those before (if any) and the current state of pressure.
    - The choice of the current Guardian determines what happens to the next domain:
