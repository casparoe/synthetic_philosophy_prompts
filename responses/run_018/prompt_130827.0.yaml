  - The irreducibly first-personal character of agent-relative reasons: In the simulation, the participant is making a choice for a role. The real feeling of "I must not do this" might not be as strong as in a real moral situation. The facilitator must emphasize that in real life, the agent-relative prohibition is experienced as a direct constraint on one's own actions, regardless of consequences.
