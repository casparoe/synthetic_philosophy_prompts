  We are designing an in-class simulation for a postgraduate seminar in moral philosophy. The goal is to have participants experience the structural paradox of deontology, specifically in the context of an agent-relative prohibition against coercing an individual into productive labor without consent. The paradox: upholding the prohibition at every local point in a system leads to a greater number of such wrongs occurring elsewhere due to systemic redirection.

  The simulation should:
  - Have eight participants.
  - Last 75 minutes.
  - Include roles, interaction rules, and a non-monetary payoff scheme (e.g., tokens for moral residue or reputational standing).
  - Participants should start with ordinary deontological intuitions and then face a choice: breach the prohibition locally to prevent a larger cascade of breaches, or uphold it and (knowingly) allow more breaches elsewhere.
  - The tension should emerge through gameplay before being named.

  We'll break the 75 minutes into phases:

  Phase 1: Introduction and Setup (10 minutes)
  Phase 2: Simulation Rounds (35 minutes)
  Phase 3: Group Discussion (15 minutes)
