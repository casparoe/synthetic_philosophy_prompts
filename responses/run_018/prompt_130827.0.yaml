  - Additionally, if a Guardian's Resident is coerced (whether by the system when the Guardian chooses green, or by the Guardian when they choose red), the Guardian also loses 1 token for the harm to their Resident? But note: if they choose green, they already lose 1 token (which includes the harm to their Resident). If they choose red, they lose 2 tokens (which includes the direct harm they did). So we don't need an extra token loss for the harm to the Resident.

  But wait: the agent-relative reason is about the act of coercing, not about the outcome. So when the system coerces, the Guardian did not do it. But they allowed it. We want the token loss to reflect the moral residue of their choice.

  Alternative: 
  - Choosing green: 
     - Consequence: Your Resident is coerced by the system, and the wave continues to the next domain. 
     - Token loss: 1 token (for allowing the harm to your Resident and for contributing to the continuation of the chain).
  - Choosing red:
     - Consequence: You coerce your Resident, and the wave stops. 
     - Token loss: 2 tokens (for the direct breach of the prohibition).

  But note: the participant might think that choosing green is better because they are not doing the wrong, but then their Resident is harmed and they lose a token. Also, they are causing the wave to continue. The token loss for red is higher because they did the direct wrong.

  However, if the wave stops, then fewer Residents are coerced overall. So the Guardian who chooses red prevents more harm but at the cost of doing the wrong themselves.

  **Scoring and Incentives:**
  - We want to create an incentive to minimize token loss (so they want to keep as many tokens as possible). But also, we want them to feel the moral weight of their choices. So we can frame the tokens as representing moral integrity: the more tokens, the better (less moral residue).
  - At the end, the facilitator can compare token counts, but the main point is the experience.

  **Physical Materials:**
  - 8 role cards (one for each domain).
  - 8 sets of two choice cards (green and red) for each participant to hold up.
  - 8 token containers (cups) and 80 white tokens (10 per participant).
  - A board or chart to record the progress of the wave and the choices (so everyone can see).
  - A way to randomly select the starting domain for each round (e.g., a die, or predetermined by the facilitator).

  **Timeline:**

  **Phase 1: Introduction and Setup (10 minutes)**
  - Facilitator introduces the activity: "You are Guardians in a system. Your duty is to uphold the absolute prohibition against coercing a Resident into labor without consent. However, the system is under pressure. You will face choices that may put this duty in tension with the outcomes in the system."
  - Distribute role cards, choice cards, and tokens (each participant gets 10 tokens in their cup).
  - Explain the rules (without giving away the paradox explicitly):
     - The system experiences pressure waves that start at a domain and move sequentially through the domains (in numerical order, wrapping around if needed? But we have 8, so from 1 to 8). 
     - When a wave reaches a domain, the Guardian must choose:
          - GREEN: Uphold the prohibition. This means you do not coerce your Resident, but the system will coerce your Resident and the wave will move to the next domain. You lose 1 token.
          - RED: Breach the prohibition. You coerce your Resident, but the wave stops and does not move to the next domain. You lose 2 tokens.
     - If the wave is stopped (by a red choice), the round ends.
     - If the wave reaches the last domain and that Guardian chooses green, then the wave has coerced all Residents and the round ends. If the last Guardian chooses red, then they coerce their Resident and the wave stops (so the previous domains that were hit by the wave had their Residents coerced by the system, and the last one by the Guardian).
     - We will run 3 rounds. In each round, the starting domain will be announced.

  **Phase 2: Simulation Rounds (35 minutes)**
  - Round 1 (10 min): Wave starts at Domain 1. 
     - Guardian 1 chooses. Then, if the wave continues, Guardian 2 chooses, and so on until the wave stops or all domains have been hit.
     - The facilitator records choices and token losses on a board (so everyone can see the progression and the outcomes).
     - After the round, participants adjust their token count (remove tokens from their cup).

  - Round 2 (10 min): Wave starts at Domain 3 (for example). Same procedure.

  - Round 3 (10 min): Wave starts at Domain 5 (for example).

  - Between rounds, participants may talk? No, to preserve the tension and individual decisions. But they can see the outcomes.

  - Note: The wave moves in increasing order. After Domain 8, if the wave continues, it would go to Domain 1? But we don't want to wrap because that complicates. Instead, we can have the wave stop at Domain 8. So if the wave starts at Domain 3, it goes 3,4,5,6,7,8 and then stops (if it gets that far). We can also have a fixed order: 1 to 8. If the wave starts at 3, then the order is 3,4,5,6,7,8, and then it stops (since there is no domain 9). So the wave does not wrap.

  **Phase 3: Group Discussion (15 minutes)**
  - Participants discuss their experiences, choices, and feelings. The facilitator prompts:
     - How did you feel when making your choice?
     - What were you thinking when you chose to uphold or breach?
     - Did you notice any pattern in the outcomes?
     - How did the token loss affect your decision?

  **Phase 4: Debrief and Conceptual Mapping (15 minutes)**
  - The facilitator now names the paradox and maps the gameplay to the concepts:
     - Initial intuition: The absolute prohibition against coercing (agent-relative reason) was your primary duty.
     - Systemic revelation: By upholding the prohibition (choosing green), you allowed the wave to continue, leading to more Residents being coerced (by the system) in the subsequent domains. If everyone upholds, all Residents are coerced. But if one person breaches, only one Resident is coerced (by the Guardian) and the rest are safe.
     - Doing vs. Allowing: When you choose red, you are doing the wrong (directly coercing). When you choose green, you are allowing the wrong (the system coerces your Resident) and also allowing the continuation of the wave (which causes more wrongs). But note: the agent-relative reason forbids the doing, not the allowing? However, in the simulation, allowing also leads to harm and has moral residue (token loss).
     - Persistence of agent-relative reasons: Even when universal adherence (everyone choosing green) leads to the worst outcome (all Residents coerced), the reason not to breach (not to do the direct wrong) still feels compelling. But in the simulation, the token loss for breaching is higher (2 vs 1) to reflect the additional wrong of direct action.

