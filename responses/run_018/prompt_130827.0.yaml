  - If the Guardian chooses red: their Resident is coerced by them (the Guardian) and the wave stops. The Guardian loses 2 tokens (for the direct breach).
  - If the Guardian chooses green: the system coerces their Resident (without the Guardian doing it) and the wave continues to the next domain. The Guardian loses 1 token (for allowing the harm to come to their Resident? But note: the prohibition is against the Guardian coercing, not against the Resident being coerced by the system. However, the Guardian has a duty to protect their Resident. So we can say: by choosing green, the Guardian fails to protect their Resident from coercion (allowing it to happen) and also allows the wave to continue. Hence, they lose 1 token for the moral residue of failing to prevent harm to their Resident and for passing the harm.

