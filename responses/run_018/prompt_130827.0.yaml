            - The pressure wave continues. The next domain (if there is one) will have an automatic coercion of their Resident by the system *unless* that next Guardian chooses to breach (red) to stop it. 
            - Additionally, the current Guardian's Resident remains uncoerced (by the Guardian) but the Guardian loses 1 token (for allowing the pressure to continue and hence potentially causing harm elsewhere? Not exactly, we need to design the token loss to reflect the moral residue for their choice).
        - If the current Guardian chooses RED (breach): 
            - They coerce their own Resident (which is a direct wrong). 
            - The pressure wave stops for the next domain. The next domain does not face the automatic coercion. 
            - The Guardian loses 2 tokens (for the direct breach) but also stops the chain.

  However, note: the automatic coercion in the next domain is not done by the next Guardian but by the system. We want to capture that by upholding, they are not directly causing the next coercion, but they are allowing it. The next Guardian then faces a choice: if the pressure wave arrives, they must choose to either:
