  We are going to restate Berkeley's monetary theory in the vocabulary of distributed systems. The key ideas from Berkeley's "The Querist" are:
   1. Money is not real wealth but a mechanism ("ticket") to mobilize labor and resources.
   2. He proposes a bank that issues notes backed by land and the promise of future labor (work) instead of gold.

   We will map this to distributed systems concepts:
   - Distributed System: The economy as a whole, with many participants (nodes) and resources.
   - State Replication: The money system as a replicated state machine where the state is the collective belief in the value of money and the records of ownership.
   - Consensus Protocol: How the system agrees on the validity of transactions and the total money supply.
   - Byzantine Fault Tolerance: Handling dishonest participants (e.g., counterfeiters, fraud).
   - Latency: The time it takes for transactions to settle and for the money to circulate.

   Protocol Spec for Berkeley's Bank-of-Credit Scheme:

   1. **System Overview**:
      - The system is a distributed ledger (like a state machine) that records ownership of credit notes.
      - The notes are issued by a central bank (like a trusted node, but in distributed terms we might think of it as a permissioned system with a central issuer, but then we have to consider trust).

   2. **Backing Assets**:
      - The notes are backed by two types of assets: land (a fixed, verifiable asset) and labor (a future promise, which is a flow of value over time).
      - In distributed systems terms, land is like a stable, replicated asset register (like a database of land titles) that can be used as collateral. Labor is a future commitment, which is harder to represent as it requires an oracle (a trusted source of external data) to verify that the labor has been performed.

   3. **Issuance Protocol**:
      - The bank (issuer node) creates new notes when it receives a claim of land (as collateral) or a promise of future labor (which we might model as a smart contract that will release the note upon proof of work).
      - This is similar to a staking mechanism in some consensus protocols, but note: land is staked as collateral, and labor is a promise that will be fulfilled in the future.

   4. **Consensus and Validation**:
      - Transactions (movement of notes) are validated by the network. Since Berkeley's system is likely centralized (the bank), we can think of it as a system with a trusted central authority. However, if we want to decentralize it, we might use a consensus protocol among trusted nodes (like a consortium of banks or government entities).
      - The system must achieve consensus on:
          a) The validity of the collateral (land ownership and value).
          b) The fulfillment of labor contracts (which requires an oracle problem to solve).

   5. **Byzantine Fault Tolerance**:
      - The system must handle malicious actors: counterfeiters (creating fake notes), double-spenders, and fraudulent labor claims.
      - The bank (or the consensus nodes) must verify the authenticity of every transaction and the backing assets. This is similar to BFT protocols where nodes vote on the validity of a transaction.

   6. **Latency**:
      - The speed at which transactions are processed and settled is crucial for the economy. Berkeley's system might have latency in verifying labor (since it happens over time) and in transferring notes (if the system is manual).

   7. **State Replication**:
      - Every participant (node) must have a consistent view of the ledger (who owns what). This is achieved by replicating the state (the ledger) across all nodes (or at least the trusted nodes).

   Now, the residue report:

