  So I spent thirty years in condensed-matter physics and now that I'm retired I'm finally trying to read Kant seriously, which is more humbling than any failed experiment. I'm putting together a proposal for a small philosophy workshop fellowship—one semester, maybe 4000 words—on Kant's universalizability tests, but from a strange angle: I think there's a hidden scale-dependence problem that standard intrepretations ignore. Just like symmetries can hold locally but break globally in physical systems, a maxim might pass the Formula of Universal Law at the individual-agent scale yet generate contradictions only when you apply it across nested institutions or global populations, and nobody checks both levels consistently in the literature. I want the proposal itself to state the precise research question, explain why existing FUL and FH readings leave this scale-dependence open, lay out a realistic week-by-week method mixing close textual work with this framing, define exactly what would count as failure, and include an honest scope check since I'm basically a beginner in philosphy writing. Dont bother with a bibliography or citations, I'll fill those in myself. Please present the whole thing as exactly five numbered parts, each just one or two sentences, with no introduction or conclusion.
