prompt: |-
  I am a journalist covering science and ideas, and I am putting together a long-form piece on what political philosophy has to say about the individual voter in a mass democracy. I would like you to compare two families of views about what a vote fundamentally is. On the first view, voting is an instrument: its value or obligation is a matter of the expected consequences of the act, and honesty about the near-zero probability of casting the decisive ballot pushes either toward expected-utility calculations or toward duty-based rules of participation. On the second view, voting is expression: a vote has a meaning independent of its causal effect on the outcome, much as speech or a cheer has meaning apart from whether it changes anything. Please organize the comparison around a specific hard case: a conscientious voter who regards both leading candidates as bad but one as substantially worse, and who is deciding whether casting a lesser-evil vote is defensible. What is the strongest version of the objection that an instrumental view cannot make sense of the individual vote, given that a single ballot almost certainly changes nothing? How far does the expressive view actually get in answering that objection, and what costs does it take on — for example in licensing votes that are self-indulgent, expressive of false or bigoted commitments, or disconnected from the moral seriousness of choosing a government? I would also like to understand which secondary theoretical commitments each side must add — for instance about the value of the mere activity of voting, or about what counts as a genuine expression of values — in order to survive the objection. Please be especially careful to mark which parts of this debate are settled among philosophers who work on the ethics of voting and which parts remain genuinely contested, and avoid presenting any contested view as the consensus.
reasoning: |-
  Okay, the user is a journalist working on a long-form piece about political philosophy and the role of the individual voter in mass democracy. They want me to compare two philosophical views on voting—instrumental vs. expressive—using a specific hard case: a voter facing a "lesser evil" choice between two bad candidates. 

  Hmm, this is a sophisticated request that digs into fundamental tensions in democratic theory. The user clearly understands the core paradox: if a single vote doesn't matter instrumentally, why vote at all? And how do these theories handle moral dilemmas like voting for the "lesser evil"? 

  I should start by rigorously defining both views. For instrumentalism, I'll emphasize the expected utility problem (the "miniscule causal power" objection) and how theorists try to salvage it—either through rule-consequentialism or duty-based approaches. For expressivism, I'll highlight how it bypasses the causality problem but opens new cans of worms about responsibility and expressive content. 

  The lesser-evil case is perfect for pressure-testing both. Instrumentalists struggle to explain why a near-zero-chance vote matters, but expressivists might trivialize voting into mere self-expression. I'll need to show how each camp bolsters their position: instrumentalists adding "integrity" clauses, expressivists invoking "civic expression" frameworks. 

  Crucially, I must flag contested points: Is rule-consequentialism convincing? Does expression require communal uptake? The user wants consensus markers—like the near-universal rejection of naive act-consequentialism—but also open debates, such as whether expressive votes can be "wasted." 

  For the journalist's purpose, I should emphasize real-world implications: Does instrumentalism discourage third-party votes? Could expressivism justify protest votes that enable extremists? These stakes matter for their piece. 

  The tone must stay academic but accessible—no jargon without explanation. And since they're writing long-form, I can go deeper than usual on secondary commitments (e.g., how expressivists define "sincere" expression). 

  Finally, I'll structure it dialectically: present each view's take on the hard case → expose weaknesses → show theoretical patches → reiterate unresolved tensions. The conclusion should underscore why both frameworks remain live options despite their flaws.
answer: |-
  Below is a structured comparison of instrumental and expressive views of voting, centered on your "lesser-evil voter" case. The analysis highlights core philosophical tensions, theoretical commitments, and contested terrain—grounded in current scholarship (drawing on thinkers like Brennan, Estlund, Christiano, Anderson, and others).

  ---

  ### **The Hard Case: The Conscientious Lesser-Evil Voter**
  - **Scenario**: A voter regards Candidate A as "bad" (e.g., corrupt, unprincipled) and Candidate B as "substantially worse" (e.g., authoritarian, rights-violating). The voter must decide whether to:  
    (a) Vote for A (lesser evil),  
    (b) Vote for a third-party candidate C (symbolic protest),  
    (c) Abstain.  
  - **Key Tension**: The voter’s action almost certainly won’t change the outcome. Does voting still matter?

  ---

  ### **I. The Instrumental View: Voting as a Tool for Outcomes**  
  **Core Thesis**: A vote’s value derives *solely* from its expected consequences. Voting is a means to secure desirable outcomes or prevent worse ones.  

  #### **A. The "Miniscule Causal Power" Objection**  
  - **The Strongest Challenge**:  
    - If the probability of casting the decisive vote (P) is vanishingly small (e.g., 1 in millions), then even if the *stakes* are enormous (e.g., preventing authoritarianism), the *expected utility* (EU) of voting is negligible: EU = P × (Utility of Good Outcome – Utility of Bad Outcome).  
    - **Result**: Rational instrumentalists *should* abstain unless voting costs nothing (Brennan 2009, "The Ethics of Voting").  
  - **Instrumentalist Responses** (Contested):  
    1. **Rule-Consequentialism**: Voting is justified if *general adherence* to voting rules produces good outcomes (e.g., preserving democracy). The individual act gains meaning from the collective practice (Parfit 1984; Singer 1973).  
    2. **Duty to Minimize Risk**: Even tiny probabilities of catastrophe demand action (e.g., "precautionary principle" applied to elections). A 0.0001% chance of averting disaster may suffice (Goodin 2012).  
    3. **Epistemic Duty**: Voting forces citizens to engage politically, improving collective decision-making over time (Estlund 2008).  

  #### **B. Applying to the Lesser-Evil Case**  
  - **Pro-Vote Argument**: If Candidate B poses existential risks, voting for A is a *moral duty*—even if success is unlikely—because the *magnitude* of harm outweighs the low probability (like buying disaster insurance).  
  - **Anti-Vote Argument**: If B’s victory is certain, voting for A is futile. Better to abstain or vote for C to signal discontent and build future alternatives.  

  **Key Theoretical Commitments**:  
  - Instrumentalists must defend *collective* theories of voting efficacy (e.g., "if everyone thought like you, democracy collapses").  
  - They often invoke "integrity constraints": Voting for a "bad" candidate is permissible only if it prevents greater evil (i.e., no "purity" objections).  

  **Settled vs. Contested**:  
  - **Near-Consensus**: Naïve act-consequentialism (calculating individual vote impact) fails to justify voting.  
  - **Contested**: Whether rule-consequentialism or risk-aversion can salvage instrumental voting.  

  ---

  ### **II. The Expressive View: Voting as Moral Expression**  
  **Core Thesis**: A vote’s value lies in its expressive function—declaring one’s values, identity, or solidarity, irrespective of outcomes (Brennan & Lomasky 1993, "Democracy and Decision").  

  #### **A. Answering the "Miniscule Power" Objection**  
  - **The Expressive Escape Hatch**:  
    - Since expression doesn’t require causal efficacy, voting remains meaningful even if inconsequential. A vote against B expresses *moral defiance*; a vote for C affirms *ideological purity*.  
  - **In the Lesser-Evil Case**:  
    - Voting for A expresses "pragmatic responsibility" (minimizing harm).  
    - Voting for C or abstaining expresses "principled refusal" (rejecting complicity with evil).  

  #### **B. Costs of Expressivism**  
  1. **Self-Indulgence**: Voting can become narcissistic (e.g., "expressing myself" with no regard for outcomes). Philosophers like Jason Brennan argue this licenses "bad voting" (e.g., voting whimsically).  
  2. **Moral Detachment**: Expressivism may ignore the *stakes* of governance. Cheering for a sports team is harmless expression; voting for a bigot normalizes harm (Anderson 2006).  
  3. **False Consciousness**: Votes may express *misguided* values (e.g., xenophobia) or misinformation. Expressivism struggles to condemn such votes without smuggling in instrumental criteria.  

  **Theoretical Commitments**:  
  - Expressivists must define what counts as "genuine" expression:  
    - **Internalist View**: Sincerity of belief suffices (vote your conscience).  
    - **Externalist View**: Expression requires *communal uptake* (e.g., votes must communicate shared values; Waldron 1999).  
  - Many add a **civic virtue layer**: Expression must align with democratic norms (e.g., reciprocity, public reason).  

  **Settled vs. Contested**:  
  - **Settled**: Expression *can* justify voting when instrumentalism falters.  
  - **Contested**: Whether expression can be normatively evaluated independently of consequences.  

  ---

  ### **III. Synthesis: Can Either View Fully Resolve the Dilemma?**  
  | **Aspect**               | **Instrumental View**                                | **Expressive View**                                  |  
  |--------------------------|-----------------------------------------------------|-----------------------------------------------------|  
  | **Lesser-Evil Vote**     | Duty if risk reduction > cost                       | Permissible as harm-reducing expression             |  
  | **Protest Vote/Abstention** | Irrational (no impact)                              | Defensible as moral witness                        |  
  | **Key Weakness**         | Struggles with individual efficacy                  | Risks moral detachment                             |  
  | **Necessary Add-Ons**    | Collective efficacy theories; risk ethics           | Civic expression norms; sincerity constraints      |  

  - **Unresolved Tensions**:  
    - **Instrumentalism**: Can "duty" arguments avoid circularity? If voting is only instrumentally valuable, but individual votes lack efficacy, *why* is there a duty?  
    - **Expressivism**: Can it handle the *special moral weight* of voting? If voting is expression, why is it more consequential than a tweet or bumper sticker?  

  ---

  ### **IV. Current Philosophical Landscape**  
  - **Emerging Hybrid Views**: Some theorists (e.g., Julia Maskivker) blend both: Voting is *expressive* but in a context where expressions *aggregate* to shape outcomes, creating derivative instrumental value.  
  - **Contested Frontiers**:  
    - **"Wasted Vote" Debate**: Whether voting for losing candidates is expressively valid or instrumentally irresponsible.  
    - **Duty to Compromise**: Whether lesser-evil voting reflects civic maturity or moral cowardice.  
    - **Voter Ignorance**: Expressivism may tolerate it; instrumentalism demands competence (Brennan’s "epistocracy" challenge).  

  Both views remain live options. Instrumentalism dominates policy circles; expressivism resonates in cultural analyses of voting. Neither fully escapes the specter of individual futility—but together, they map the ethical landscape confronting voters in mass democracy.  

  ---  
  **Sources for Further Research**:  
  - Key Texts: Brennan & Lomasky (*Democracy and Decision*), Estlund (*Democratic Authority*), Anderson ("The Epistemology of Democracy").  
  - Lesser-Evil Debates: Lippert-Rasmussen (*Ethics* 2017), van der Vossen (*Journal of Ethics* 2015).  
  - Hybrid Theories: Maskivker (*The Duty to Vote*, 2019).  

  This framework should equip you to explore the tensions between ethical pragmatism and moral integrity in the voting booth—a dilemma intensifying in polarized democracies.
