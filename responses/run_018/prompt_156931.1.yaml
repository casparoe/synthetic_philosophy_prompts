prompt: |-
  I'm putting together an intreview for my podcast next week with a philospher who just wrote a monograph defending what she calls "slot-based contractualism" about climate obligations. Her move is that carbon emissions don't harm specific future people (classic non-identity problem) but instead damage "person-slots" -- structural positions in future generations that ought to be filled by people with decent wellbeing. She thinks this dodges Parfit without going full impersonal-utilitarian.

  Could you draft me about eight interview questions that get into the weeds? I want at least one pressing how she tells her view apart from regular person-affecting approaches, one about the metaphysics of these slots (are they just a modeling trick or do they actually exist?), and one about whether her framework collapses once we realize distant-future slots might just be filled by different people with different values. For each of those, include the follow-up I'd ask after she gives her standard reply.

  Don't include any citation requests or reading lists -- I want to actually follow the answers, not just nod along. Also please tell me how confident you are in these questions overall, and single out the one you're least sure is aimed right at her position.
