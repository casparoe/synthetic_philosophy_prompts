prompt: |-
  I'm on a land-use board for a mid-sized city and every month we have to vote on development proposals that pit genuinely different kinds of value against each other — like preserving the acoustic and social texture of an old jazz district versus building climate-adaptive density, or keeping a seasonal wetland intact versus putting accessible housing near transit. I want a reusable decision procedure my board can run in about 40 minutes, not just a philosophical shrug. The conceptual hook I want you to use is that incommensurability isn't just "hard to measure on one scale" — there's a difference between values that lack a common metric but can still be compared through qualitative parity, and ones that are genuinely incomparable in a way that makes rational ranking impossible without some prior commitment. Turn that into ordered steps: what questions to ask, what counts as passing each gate, where the procedure explicitly stops and hands back to human judgment because it's values not facts, and where it will definitely misfire if a developer games the framing.

  Apply it to three cases: tearing down a 1920s public market for net-zero towers; draining part of a seasonal wetland for disability-accessible transit housing; and one where your procedure gives a yes that feels like a betrayal — maybe dense climate-adaptive housing that technically satisfies accessibility and carbon metrics but erases the historical presence of a working-class community. Don't ask for citations or reading lists, just build the procedure from the idea itself. Also sorry if I typoed incommensurable earlier, I meant incommensurable, though honestly both sound wrong to me now.
reasoning: |-
  Okay, the user is on a land-use board dealing with tough decisions where different values clash—like preserving a historic jazz district versus building climate-adaptive housing. They need a practical, reusable decision procedure that can be done in 40 minutes. The key insight here is distinguishing between values that are incommensurable (no common metric but comparable qualitatively) and those that are incomparable (truly impossible to rank rationally without prior commitment). 

  First, I need to unpack their core challenge. They’re frustrated with philosophical hand-wringing and want concrete steps. The mention of "betrayal" in the third case suggests they fear the procedure might technically pass but feel ethically wrong—so the design must flag these emotional/ethical alarms explicitly. 

  The procedure should have clear gates: first, separate values into commensurable and incomparable buckets. Then, for commensurable ones, force qualitative trade-offs. For incomparable, require explicit prioritization upfront. Finally, a "gut-check" step to catch cases where metrics are gamed but the outcome feels off. 

  For the cases:  
  - The jazz district vs. net-zero towers is classic incommensurability—cultural loss isn’t quantifiable against carbon reduction.  
  - Wetland drainage for accessible housing might be commensurable if ecological harm can be mitigated (e.g., offsetting wetlands elsewhere).  
  - The "betrayal" case (dense housing erasing a community) should pass technical gates but fail the gut check, forcing the board to confront the intangible loss.  

  User’s deeper needs: They want legitimacy (a defensible process), efficiency (40 mins!), and moral safety nets. Also, they dread developers exploiting loopholes, so steps must be gaming-resistant—e.g., by requiring qualitative parity checks and explicit value commitments.  

  Typos aside ("incommensurable" vs. "incomparable"), their intuition is spot-on: some conflicts aren’t just hard math but existential choices. The procedure must honor that.
answer: |-
  Here's a reusable 40-minute decision procedure based on **distinguishing incommensurability (qualitatively comparable) from incomparability (no rational ranking possible without prior commitment)**. It forces explicit value choices while resisting gaming.

  **The Four-Gate Procedure (40 min max):**

  1.  **Gate 1: Value Identification & Commensurability Check (10 min)**
      *   **Question:** "What are the *core, irreducible values* at stake (e.g., historical continuity, acoustic culture, biodiversity, climate resilience, housing equity, accessibility)? Are any genuinely **incomparable** (e.g., preserving the *specific lived experience* of a place vs. abstract global carbon reduction; sacredness vs. utility)?"
      *   **Pass:** Values identified. If **incomparable** values exist (e.g., preserving the *essence* of the jazz district vs. achieving a city-wide density target), proceed to Gate 2. If all values seem potentially **incommensurable but comparable** (e.g., wetland ecosystem services vs. accessible housing units), skip to Gate 3.
      *   **Stop & Hand Back:** If core incomparable values conflict directly (e.g., sacred site vs. vital infrastructure *with no alternatives*), STOP. Rational ranking is impossible here. Board must make a **principled prioritization vote** based on core mission/community values *before* analyzing trade-offs further. **Gaming Risk:** Developer framing values as merely "inconvenient" rather than truly incomparable. Board must be vigilant for irreplaceable uniqueness.

  2.  **Gate 2: Incomparability Resolution (Principled Priorities) (5 min)**
      *   **Question:** "Given the incomparable values identified (e.g., unique cultural essence vs. systemic climate goal), which category does our board's mandate/community's foundational values **prioritize** *in principle* for this *type* of conflict? (Is preserving irreplaceable cultural identity *categorically* more important than adding density *here*, or vice-versa?)"
      *   **Pass:** Board achieves majority consensus on the **categorical priority** for this incomparable clash (e.g., "Preserving irreplaceable cultural essence takes priority over abstract density goals in designated districts"). If priority favors preservation, project likely fails. If priority favors the "incomparable" development value, proceed to Gate 3 to assess lesser trade-offs. If no consensus, project stalls; needs higher-level policy guidance.
      *   **Stop & Hand Back:** The prioritization vote *is* the human judgment on fundamental values. **Gaming Risk:** Misrepresenting a comparable value (e.g., "aesthetics") as incomparable ("sacred character") to trigger a favorable categorical priority.

  3.  **Gate 3: Incommensurable Trade-off Assessment (Qualitative Parity) (15 min)**
      *   **Question:** "For the *comparable* values, can we achieve **qualitative parity**? Does the mitigation/compensation for the loss of Value A (e.g., wetland function, neighborhood scale) feel *ethically proportionate* and *materially credible* when weighed against the gain of Value B (e.g., accessible housing, climate resilience)?"
      *   **Pass:** Majority agrees mitigation/compensation achieves credible, proportionate balance *despite* different metrics. (e.g., Creating *equivalent* wetland habitat elsewhere + strict onsite stormwater management feels proportionate to loss for the housing gain; preserving key jazz venue acoustics + funding local artist housing feels proportionate to some density increase). Proceed to Gate 4.
      *   **Fail:** Losses feel too severe, mitigation feels tokenistic, or gains seem marginal. Project likely fails.
      *   **Stop & Hand Back:** Judgment on "proportionate" is qualitative and value-laden. **Gaming Risk:** Overpromising mitigation (e.g., "future wetland creation" without land/secured funding) or undervaluing loss (e.g., calling a vibrant community "blight").

  4.  **Gate 4: Gut-Check & Procedural Integrity (10 min)**
      *   **Question:** "Does passing this feel like a **betrayal** of a core value we couldn't fully articulate or quantify? Did the process feel manipulated? Are we upholding procedural fairness and our mandate?"
      *   **Pass:** Majority answers "No" to betrayal/manipulation, "Yes" to integrity. Project approved.
      *   **Fail/Veto:** Significant minority (e.g., >1/3) feels deep unease ("betrayal") or detects manipulation. Project fails or requires major revision. **This is the safeguard against technically passing but morally failing.**
      *   **Stop & Hand Back:** Raw human judgment on legitimacy and ethics. **Gaming Risk:** Hiding impacts or gaming metrics to sail through Gates 1-3, relying on board not triggering Gate 4.

  ---

  **Applied to Cases:**

  1.  **1920s Public Market vs. Net-Zero Towers:**
      *   **Gate 1:** Values: *Historical/Cultural Continuity* (embodied in the market structure/use) vs. *Climate Resilience/Density*. **Likely INCOMPARABLE.** The *specific* market's role as a generations-old social/economic hub isn't fungible with abstract carbon units. STOP for principled priority.
      *   **Gate 2:** Board votes: Does preserving *this specific irreplaceable historic/cultural asset* take categorical priority over adding density *on this specific site*? (If yes, project fails. If no, proceed).
      *   *(If proceeds)* **Gate 3:** Can qualitative parity be achieved? Saving facades? Replicating market function *meaningfully* onsite? Funding a comparable cultural hub elsewhere? Unlikely to feel proportionate to total loss of the authentic place. Likely FAIL.
      *   **Gate 4:** Gut-check likely screams "betrayal" if passed. VETO.

  2.  **Seasonal Wetland vs. Disability-Accessible Transit Housing:**
      *   **Gate 1:** Values: *Biodiversity/Hydrology* vs. *Housing Equity/Accessibility*. **INCOMMENSURABLE BUT COMPARABLE.** Both are tangible goods/services (ecosystem services vs. human shelter/mobility). Proceed to Gate 3.
      *   **Gate 3:** Qualitative Parity: Can loss of *this specific* wetland function be offset *credibly and proportionately*? *Robust*, immediate, ecologically-supervised creation of *larger/more functional* wetland habitat nearby? Superior onsite/in-basin stormwater treatment exceeding lost function? Combined with a *significant* gain in truly accessible, affordable units near transit? **If YES (credible plan), PASS.** If offsets are vague, distant, or insufficient, FAIL.
      *   **Gate 4:** Gut-check: Does the mitigation feel real? Does the housing need feel urgent and unmet elsewhere? If mitigation solid and need high, likely passes Gate 4.

  3.  **The "Betrayal" Case: Dense Climate Housing Erasing Working-Class Community:**
      *   **Gate 1:** Values: *Community Integrity/Historical Presence* (of *this specific* group) vs. *Climate Resilience/Density* vs. *Housing Supply/Accessibility*. **INCOMPARABLE element:** The erasure of the *specific, rooted, socio-cultural fabric* of *this* community. STOP for principled priority.
      *   **Gate 2:** Board votes: Does preventing the dispersal/erasure of *this specific vulnerable community* take categorical priority over achieving density/climate goals *on this exact site*? **If YES, project fails.** If NO (density/climate deemed categorically higher priority *here*), proceed.
      *   *(If proceeds)* **Gate 3:** Qualitative Parity: Can displacement be minimized? Deep affordability guarantees for existing residents? Meaningful community space/ownership in new development? Investment in preserving cultural institutions *offsite* if displaced? **Technically might pass** if strong measures are offered (e.g., 100% affordable units for existing residents, community land trust).
      *   **Gate 4: GUT-CHECK TRIGGERS VETO.** Despite technical passage, the *erasure of historical presence and community cohesion* feels like a betrayal. The mitigation, however good, doesn't recreate the *intangible, generations-deep* sense of place and belonging. The "prioritization" in Gate 2 feels cold. Board members feel unease. **VETO or demand radical redesign.**

  **Key Strengths:**
  *   Forces explicit confrontation of **incomparability** early (Gate 1/2).
  *   Uses **qualitative judgment of parity** (Gate 3) instead of fake quantification.
  *   **Gate 4 is the critical safeguard** against technically-correct but morally bankrupt outcomes.
  *   Resists gaming by requiring **credible mitigation** (Gate 3) and exposing **value framing tricks** (Gate 1).
  *   Fits 40 minutes by focusing debate on specific, high-stakes questions.
