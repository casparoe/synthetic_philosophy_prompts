  Key traps to include: 
  - The benevolent AI (tests if interference sans domination reduces liberty) 
  - Adaptive preferences (exposes positive liberty's "true self" problem) 
  - The monarch vs. robot overlord comparison (Pettit vs. pure negative liberty) 
