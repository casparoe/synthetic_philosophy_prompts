  - "Positive + non-domination"? Plausible (e.g., neo-republican welfarism) 
  - "Negative-only" absolutists? Consistent but ignore power imbalances. 

  Crucially, admit when the tree can't split positions cleanly—e.g., adaptive preferences might stump all three frameworks equally. That uncertainty is pedagogically valuable. 

