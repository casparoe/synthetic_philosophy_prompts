  I'm presenting next week at the Nordic Institute for Security Studies seminar on small-state defense postures. My thesis is that Finland's post-2022 dual-layer manpower model—retaining universal conscription for territorial defense while operating a separate, voluntary, high-skill cyber and electronic-warfare reserve—demonstrates that twenty-first-century armed neutrality can no longer be sustained by a single civic-military structure like the traditional Swiss universal militia. I argue that Sweden's 2018 return to selective conscription represents a false middle ground that solves manpower quality without addressing the structural split, and that small neutral states should therefore move toward an explicitly bifurcated system, even though it fractures the egalitarian civic-duty justification that has historically legitimized Swiss-style neutrality.

  The audience is precisely this: two Finnish defense analysts who helped design the cyber-reserve pilot and regard it as an internal supplement rather than an exportable strategic template; a Swedish Ministry of Defence strategist who views selective conscription as the optimal equilibrium between readiness and social legitimacy; a retired Swiss Army corps commander for whom universal service is the moral bedrock of neutrality; and several comparative-politics scholars focused on civil-military relations who are deeply suspicious of any system that stratifies obligation by education and technical skill.

  Draft my Q&A prep sheet. Give me the eight objections I will actually face from this room, ordered by the damage each would do if left unanswered, and phrase each in the vocabulary and framing its originator would use. For each objection, provide a concise reply I can deliver in about two minutes, plus an explicit note on where that reply is weakest or concedes ground. Identify the one objection I am hoping nobody raises—the one that targets the hidden normative premise in my argument about democratic legitimacy and class stratification. Finally, tell me what I should concede in my opening remarks to disarm the room, and flag the single reply that must land for the thesis to survive the session.
