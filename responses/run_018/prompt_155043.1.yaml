  First, I need to recall the philosophical concepts involved. The Ship of Theseus problem comes to mind immediately. That's the classic thought experiment about identity and replacement. Then there's the distinction between material and form, plus the role of continuity and social factors. 

  Looking at Mira's arguments, she emphasizes continuity, form, and social recognition. For the quilt, it's the pattern and stories. For the statue, it's unbroken existence in the museum. Leo, on the other hand, focuses on material composition. If all parts are replaced, it's a replica. The clay split scenario is his trump card—how can the original be in two places?

