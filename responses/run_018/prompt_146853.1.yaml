answer: |-
  ## Research Proposal: Narrative Scaffolding for Moral Reasoning—Plutarch’s Parallel Lives and the Training of Exemplar Portability

  **1. Core Question:** Does Plutarch’s structural juxtaposition of Greek and Roman lives in the *Parallel Lives* actively train readers in "exemplar portability" – the cognitive habit of extracting a moral agent as a detachable pattern applicable beyond their specific institutional/cultural context – or does the very act of pairing reinforce the irreducible embeddedness of virtue within distinct settings, thereby *inhibiting* this portability?

  **2. Beyond Standard Virtue-Education Debates:** Existing scholarship on biography and moral pedagogy (e.g., discussions stemming from Nussbaum, MacIntyre, or Hadot) often centers on *whether* lives teach virtue effectively or *what* virtues they teach. This proposal shifts focus to the *cognitive mechanism* potentially cultivated: the transferable *application* of exemplars. The question isn't just "does it work?" but "*how* might the narrative structure itself shape a specific reasoning faculty?" Standard debates rarely interrogate whether biographical form actively trains the portability skill itself, distinct from the exemplar's content or the reader's pre-existing moral disposition. Plutarch’s unique comparative structure provides a crucial test case for this under-examined dimension.

  **3. Method & Scope: Close Reading of Structural Juxtaposition:** This project employs focused close reading on 2-3 carefully chosen *Parallel Lives* pairs (e.g., Alexander-Caesar, Lycurgus-Numa, Demosthenes-Cicero). The analysis will specifically target:
      *   **Framing Devices:** How Plutarch introduces the pair (prefaces, synkriseis) – does he emphasize universal traits or contextual constraints?
      *   **Narrative Interlacing:** How does his narration within a single Life invite comparison/contrast with its counterpart? Does he use shared vocabulary, mirrored events, or direct cross-references that encourage abstraction?
      *   **Moments of "Portability Attempt":** Analyzing instances where Plutarch (or his subjects) explicitly invoke an exemplar from *another* context – how is it framed? Does the surrounding narrative facilitate or undermine its transfer?
      *   **The Role of the "Syncrisis":** Does the concluding comparison function as a template for portability (extracting common patterns) or as a display of contextual divergence?

  This method avoids broad corpus surveys, ensuring depth and feasibility for a semester paper. Hagiography will serve as a conceptual counterpoint (noting its tendency towards transcendent, context-stripping idealization) to highlight Plutarch’s potentially distinct approach.

  **4. Defining Results & Failure:**
      *   **Success (Portability Training Evident):** Clear textual evidence that Plutarch’s narrative techniques (juxtaposition, comparative language, thematic parallels) systematically guide the reader towards abstracting principles from specific actions/settings, explicitly framing them as applicable elsewhere. The structure itself functions as a scaffold for portability.
      *   **Success (Embeddedness Reinforced):** Clear evidence that the juxtaposition primarily serves to highlight fundamental differences rooted in irreconcilable cultural/political institutions, making direct transfer seem problematic or artificial. The comparisons emphasize context-dependence.
      *   **Failure:** The analysis reveals only generic moralizing or historical comparison without illuminating the specific *mechanism* of portability (or its blockage). The structural impact on reasoning habits remains opaque, or the results are inconclusive regarding Plutarch’s *intentional* training of this faculty. Scope creep into too many Lives or tangential philosophical debates would also constitute failure to address the core question within limits.

  **5. Significance & Realistic Scope:** This project offers a novel lens on Plutarch’s pedagogical aims by focusing on the *cognitive habit* potentially formed through his unique narrative architecture. By precisely defining "exemplar portability" and testing Plutarch’s structural method against it, it moves beyond the well-trodden ground of "virtue acquisition" to explore *how* biographical form might actively shape moral reasoning. Limiting the study to 2-3 pairs allows for the necessary deep textual analysis to uncover narrative strategies and their implications for portability, yielding a concrete argument about Plutarch’s technique within a manageable timeframe.

  **This proposal investigates whether Plutarch's structural juxtaposition in the Parallel Lives trains readers in 'exemplar portability'—the cognitive habit of extracting moral patterns from context—or reinforces embeddedness, thereby reframing biography's role in moral reasoning.**
