      *   **Weakness:** Distinguishing physical network costs from large-scale sunk costs influenced by institutions/politics.

  5.  **Objection (The One You Hope Nobody Asks - History Teachers/Doctoral Student):** "Provide *specific, documented evidence* that the 19th-century congressional decisions blocking metric adoption were truly 'exogenous' veto points easily reversible later, rather than reflecting enduring institutional or cultural preferences deeply embedded in American commerce and law by now."
