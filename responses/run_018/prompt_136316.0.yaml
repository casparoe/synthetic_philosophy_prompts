answer: |-
  Here are five anticipated objections and replies, ordered from most to least damaging, phrased for your audience:

  1.  **Objection (Doctoral Student):** "Reversal asymmetry sounds like ad-hoc theorizing. Established path dependence literature (Arthur, David) already explains lock-in via increasing returns; your 'asymmetry' adds nothing new and lacks peer-reviewed validation for its key distinction."
      *   **Reply:** "The established models focus on *how* lock-in occurs. Reversal asymmetry explicitly contrasts the *reversibility mechanisms*: network-intensive lock-ins require overcoming self-reinforcing user costs, while institutional veto points represent discrete political choices potentially reversed by new majorities."
      *   **Weakness:** Relies on interpreting existing theory; lacks specific citation proving the distinction's novelty.

  2.  **Objection (History Teachers):** "You claim the metric system failure was merely a reversible legislative veto? But Congress *has* repeatedly affirmed customary units (e.g., 1975 Metric Conversion Act, subsequent highway funding bills). Doesn't this demonstrate institutional path dependence locking the outcome?"
      *   **Reply:** "Each reaffirmation is a *new* legislative act, not an irreversible cost cascade. The *possibility* of switching via a single future legislative vote remains open, unlike the accumulated, individual retraining costs for millions entrenched in QWERTY. The barrier is political will, not escalating network costs."
      *   **Weakness:** Requires conceding significant *institutional* persistence; distinguishing "reversible veto" from deep institutional inertia is challenging.

  3.  **Objection (Economics Undergrads):** "Your QWERTY example downplays network effects. Betamax failed largely due to VHS's licensing strategy creating a content availability network effect – similar to QWERTY's typing ecosystem. Doesn't this contradict your reversal asymmetry by showing network effects in institutional contexts (content licensing) driving lock-in?"
      *   **Reply:** "The VHS/Betamax war *is* a classic network-effect lock-in, reinforcing my tech case. The *metric* case differs: its failure stems from legislative action (or inaction), not consumers facing increasing *personal* costs if they individually switched. Content licensing created a *de facto* consumer network cost for Betamax."
      *   **Weakness:** Blurring lines between institutional actions (licensing) creating network effects; requires careful separation of cause.

  4.  **Objection (History Teachers):** "Your framework dismisses the railroad gauge standardization as just network lock-in? Stephenson's choice of 4'8.5" was arguably arbitrary, but switching later was physically impossible without rebuilding the entire system – a massive, sunk-cost institutional lock-in far exceeding mere user-base scaling."
