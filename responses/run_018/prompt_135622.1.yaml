  The user emphasized philosophical depth: the progression should show Gregorian's understanding is continuous with lower creatures' capacities yet fundamentally different due to language. I need to avoid making it didactic; it should work as standalone poetry. For imagery, I'll tie each creature to elemental actions—Darwinian with tides/rocks, Skinnerian with levers/feeders, Popperian with paths/traps, Gregorian with writing/tools. The borrowed phrase could be "The lever worked" from Skinnerian, transformed into "The lever worked—and work becomes the word" to show tool-to-language evolution.

