  To weigh the act where morral fibre rends.
  **Shame is the signal others send.**

  The private court, the circuit's steady span –
  Does drift decide the means where grace amends?
  **Guilt is the loop that checks itself.**

  **A culture *chooses* where to place the weight,**
  **The ancient roots remain, the choice innate.**
  **Shame is the signal others send.**

