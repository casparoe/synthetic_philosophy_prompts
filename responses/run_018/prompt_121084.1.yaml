answer: |-
  ### 1. Nearest Established Concepts
  The described phenomenon intersects with several established ideas but remains distinct:

  - **Principal Principle (PP)**: PP dictates that rational credence should align with known objective chance, absent inadmissible information. Crucially, PP treats chance as *primitively authoritative*. Your cases violate this: agents modulate their *deference to chance itself* based on causal backstory, not new statistical data. PP assumes chance commands fixed normative weight; here, the weight changes based on mechanism transparency.

  - **Expert Deference**: Agents often treat chances as expert pronouncements. Standard models (e.g., Gaifman’s expert principle) assume deference scales with perceived reliability. However, in your cases, reliability is unchanged—the clinician knows the 30% is empirically correct, yet demotes its authority post-explanation. This shifts the *epistemic status* of the chance claim, not just trust in the source.

  - **Mechanistic vs. Statistical Explanation**: While Salmon distinguished causal processes from statistical relevance, your cases highlight a *normative* asymmetry. Learning a mechanism isn’t just explanatory—it retroactively upgrades (quantum case) or downgrades (clinical case) the chance’s rational bindingness. This isn’t about explanatory depth alone but about whether the mechanism "dignifies" the probability.

  - **Causal/Statistical Distinction**: The clinician’s reaction resembles mistaking a statistical fact for a non-causal correlation. Yet she *accepts* the correlation’s reality—she rejects its *normative role* in individual reasoning. This is not base-rate neglect (she doesn’t ignore the 30%) but a revocation of its justificatory power.

  **Closest Fit**: *Undermining* from PP discussions is near—learning a deterministic backstory can "undermine" chance claims. However, your quantum case shows *over-endorsement*, creating asymmetry. PP’s inadmissible information comes closest but fails to explain why *non-inadmissible* mechanistic knowledge (quantum decoherence) amplifies deference.

  ---

  ### 2. The Carving
  **Definition**: *Normative modulation by causal ontology* occurs when an agent’s willingness to treat an objective chance as rationally binding for credence shifts upon learning the generative mechanism, despite no change in statistical evidence. The shift depends on whether the mechanism is perceived as "ontologically robust" (amplifying deference) or "merely descriptive" (diminishing deference). It targets the *authority* of the chance, not the event’s probability.

  **What it is NOT**:
  - **Not conditionalization**: The clinician could use the trigger (known in 80% of cases) to conditionally adjust her patient’s risk. Instead, she dismisses the unconditional chance as non-authoritative.
  - **Not base-rate fallacy**: The agent doesn’t neglect the statistic; she disputes its normative force for individual reasoning.
  - **Not equivocation**: No ambiguity in the chance claim exists—the 30% remains empirically validated.

  **Boundary Cases**:
  - **Subtle Presence**: A gambler learns a die is mechanically fair (symmetrical faces). Though this confirms the 1/6 probability, their deference *intensifies*—they now view the probability as "intrinsic" rather than "empirically observed." No new frequency data exists, but the mechanism confers ontological prestige.
  - **Mimic but Distinct**: A policymaker ignores a 5% risk of infrastructure failure after learning it’s calculated from historical data lacking climate-change variables. *This is standard conditionalization*: they recognize omitted variables make the statistic inapplicable. Contrast with the clinician, who accepts the statistic’s accuracy but denies its rational relevance.

  **Edges**: The phenomenon vanishes if (a) the mechanism provides new statistical data (e.g., learning the trigger’s prevalence differs from 80%), or (b) the agent’s credence shifts solely due to the event’s causal history (e.g., believing determinism nullifies chance), without modulating the chance’s general authority.

  ---

  ### 3. Terminology and Verdict
  **Verdict**: No established term captures this precise asymmetry. "Undermining" (from PP) covers only the diminution case, while "over-endorsement" lacks theoretical grounding. The phenomenon is novel in its *bidirectional normative modulation* based on causal ontology.

  **Proposed Term**: **Deference Modulation by Causal Ontology (DMCO)**

  **Definition**: *DMCO is the shift in an agent’s assessment of the rational authority of an objective chance claim, induced by learning its generative mechanism, where:*  
  - *The shift asymmetrically amplifies or diminishes the perceived bindingness of the chance for credence.*  
  - *The shift is not justified by new statistical evidence or inadmissible information under the Principal Principle.*  
  - *It arises from the mechanism’s perceived ontological status (e.g., "fundamental" vs. "derivative"), altering whether the chance is deemed "directly action-guiding".*

  This term distinguishes DMCO from belief updating (which targets event probabilities) and expert deference (which scales with reliability). It captures the core: mechanisms modulate not truth-value, but *normative weight*.
