  First, I need to unpack their core concern. The mirror problem is intriguing—it suggests that inaction to preserve moral purity might itself be a form of using others (as means to maintain one's conscience). This adds depth to classic dilemmas like the trolley problem. The user seems well-versed in philosophy but frustrated by theoretical gaps. Their request for a "spec" implies they want structural clarity, almost like an engineering document for ethics. 

  The requirements should cover several key areas. First, the cases: the bridge dilemma (active harm vs. inaction), broken promises (conflicting duties), and the mirror problem itself (inaction as moral vanity). These are non-negotiable because they're foundational stress tests. Then distinctions: doing vs. allowing harm, intentions vs. outcomes, and personal duty vs. overall good. Collapsing these would muddy the theory's coherence. Finally, real-world alignment—psychology shows humans intuitively weigh intentions heavily, and real ethics must account for systemic effects (e.g., normalizing rule-breaking). 

  I should flag tensions. The biggest clash is between "no trade-offs" (deontology's core) and "systemic consequences" (which demand flexibility). Also, preserving all distinctions while handling the mirror problem is tricky—if inaction is judged as "using" conscience, doesn’t that blur doing/allowing? The user likely senses these fault lines. 

  For the scorecard: Kant fails the mirror problem (inaction isn't "using" others per his formula but feels hypocritical). Rule-utilitarianism handles cases but collapses intentions/consequences. Virtue ethics dodges rigid rules but gets vague on dilemmas. 

  The user’s tone is impatient ("no essays," "no library access"), so conciseness is key. They’re intellectually independent—solving this themselves—so I’ll avoid prescriptive answers and focus on mapping the terrain. Underlying need might be reconciling moral rigor with humane outcomes, not just theorycrafting. 

  Final note: The mirror problem’s requirement about "no moral narcissism" is sharp. It’s a meta-requirement—any solution must avoid making ethics self-serving. That’s profound and easily overlooked.
answer: |-
  Here's the full specification for resolving the deontological paradox, incorporating your "mirror problem" and key requirements, with non-negotiables flagged and tensions highlighted:

  **Core Requirements for Resolving the Paradox:**

  1.  **Handle the Standard Bridge/Trolley Case (Non-Negotiable):**
      *   **Case:** Actively pushing one person off a bridge to stop a trolley killing five vs. doing nothing.
      *   **Requirement:** Explain why actively killing one (violating a rule) is prohibited, even if it leads to five dying through inaction. Must account for the strong intuition against direct harm.
      *   **Reason:** This is the core paradox demonstrating the conflict between rule-following and consequences.

  2.  **Handle the Mirror Problem (Non-Negotiable):**
      *   **Case:** Choosing inaction (preserving rule against killing/using) leads to five deaths. Is this inaction itself a form of *using* the five as a means to preserve one's own moral purity/clean conscience?
      *   **Requirement:** Address whether and why inaction motivated by preserving personal moral integrity avoids being a form of problematic "using" *or* explain why, if it is, it's still permissible/required. Must grapple with the charge of prioritizing conscience over lives.
      *   **Reason:** Your key insight – exposes potential hypocrisy or narcissism in strict adherence.

  3.  **Handle Conflicting Duties (e.g., Broken Promises) (Non-Negotiable):**
      *   **Case:** Promise made to A requires action that harms B, or keeping a promise causes greater harm than breaking it.
      *   **Requirement:** Provide principles for resolving conflicts between specific duties (e.g., promise-keeping vs. non-maleficence) without always defaulting to consequences. Explain how to choose which rule prevails.
      *   **Reason:** Real-world ethics involves clashing obligations; a theory must navigate this.

  4.  **Preserve Doing vs. Allowing Harm Distinction (Camp Preference, but Strong):**
      *   **Distinction:** Actively causing harm vs. merely allowing harm to occur through inaction.
      *   **Requirement:** The theory should not collapse this distinction entirely. It should generally assign greater moral weight or different status to direct action causing harm.
      *   **Reason:** Deeply ingrained moral intuition and legal distinction; crucial for the bridge case intuition.

  5.  **Preserve Intentions vs. Results Distinction (Non-Negotiable for Deontology):**
      *   **Distinction:** Moral evaluation based on the agent's intention and adherence to principle vs. solely on the outcome.
      *   **Requirement:** The rightness/wrongness of an act must depend significantly on the agent's will and intention, not just results.
      *   **Reason:** Core tenet of deontology; abandoning this collapses into consequentialism.

  6.  **Preserve Agent-Centered Duties vs. Overall Good (Non-Negotiable for Deontology):**
      *   **Distinction:** My specific duties (e.g., not to kill *this* person) can outweigh maximizing overall good.
      *   **Requirement:** The theory must justify why an agent should prioritize their specific negative duty (e.g., not to kill) over preventing greater harm to others.
      *   **Reason:** Defines deontology; without this, it becomes impersonal consequentialism.

  7.  **Account for Psychological Realism (Non-Negotiable):**
      *   **Observation:** Humans exhibit strong aversion to *personal*, direct harm, even for greater good (e.g., footbridge dilemma experiments). Moral judgments are heavily influenced by intention and perceived "agency".
      *   **Requirement:** The theory shouldn't contradict these robust findings. It should explain or leverage this psychology, not require superhuman detachment.
      *   **Reason:** An ethical theory for humans must resonate with human moral psychology to be plausible/actionable.

  8.  **Account for Systemic/Institutional Effects (Camp Preference, but Important):**
      *   **Observation:** Widespread rule-breaking (even for good consequences) can erode trust, norms, and institutions, leading to greater harm long-term.
      *   **Requirement:** The theory should consider the impact of normalizing certain types of rule violations on social cooperation and stability.
      *   **Reason:** Addresses a key consequentialist *counter* to strict deontology; provides a potential rule-utilitarian grounding for rules.

  **Key Tensions (Where Requirements Conflict):**

  1.  **Mirror Problem vs. Strict Agent-Centered Duties (Non-Negotiable Conflict):**
      *   **Tension:** Strictly prioritizing your duty not to act (kill) to avoid using one as a means **directly clashes** with the Mirror Problem's accusation that you are *then* using the five as a means to your own purity. Resolving this tension is the *core challenge*.
      *   **Resolution Needed:** Must either (a) convincingly argue why inaction *isn't* using the five (e.g., lack of direct agency/intent to harm them), or (b) demonstrate why this specific "using" (inaction for purity) is fundamentally different/lesser than active using, or (c) incorporate a limited consequentialist override *without* collapsing the core distinctions.

  2.  **Preserving Distinctions vs. Resolving Conflicts:** Strictly preserving Doing/Allowing, Intentions, and Agent-Centered Duties makes resolving case conflicts (Bridge, Promises) incredibly difficult. Loosening them risks collapsing into consequentialism. Finding the *right kind* of flexibility is key.

  3.  **Agent-Centered Duties vs. Systemic Effects:** Prioritizing my duty might seem selfish against large-scale harm, but systemic effect arguments can support rule-following as a *consequence* of duty.

  **Quick Scorecard:**

  | Theory          | Bridge Case | Mirror Problem | Conflicting Duties | Doing/Allowing | Intentions | Agent-Duties | Psychology | Systemic Effects | Notes                                                                 |
  | :-------------- | :---------- | :------------- | :----------------- | :------------- | :--------- | :----------- | :--------- | :--------------- | :-------------------------------------------------------------------- |
  | **Strict Kant** | Pass ✅      | **Fail ❌**     | **Struggle ❓**     | Pass ✅        | Pass ✅     | Pass ✅      | Partial ✅  | Pass ✅           | Mirror: Inaction ≠ using. Feels like evasion. Duty conflicts hard.    |
  | **Rule Utilit.**| Pass ✅      | Pass ✅         | Pass ✅            | **Fail/Weak ❓**| **Weak ❓** | **Fail ❌**  | Partial ✅  | Pass ✅           | Collapses Intentions & Agent-Duties into systemic consequences. Rules justified by results, not inherent duty. |
  | **Virtue Eth.** | **Vague ❓** | **Vague ❓**    | **Vague ❓**        | Vague ❓       | Pass ✅     | Partial ✅   | Pass ✅     | Partial ✅        | Focuses on character. "What would a wise/virtuous person do?" Avoids rigid rules but lacks clear action guidance in dilemmas. |

  **Summary:** A viable resolution must navigate the **fundamental tension** between core deontological commitments (especially agent-centered duties and the prohibition on using) and the **Mirror Problem**, which accuses strict adherence of *itself* being a form of problematic using (of the victims for one's purity). No major theory perfectly satisfies all requirements without significant internal tension, especially concerning the Mirror Problem vs. Agent-Duties. Rule Utilitarianism handles cases and Mirror best but sacrifices core deontological distinctions. Strict Kant preserves distinctions but struggles mightily with Mirror and conflicts. Virtue Ethics sidesteps rules but offers less concrete resolution. The "spec" highlights how tough this puzzle is.
