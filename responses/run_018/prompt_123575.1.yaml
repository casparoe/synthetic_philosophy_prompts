answer: |-
  Your diagnosis of an **institutional burden asymmetry** as a core stalling mechanism in the Hart-Devlin debate is perceptive and largely correct. Here's a breakdown of the fault lines and the nature of the stall:

  **Core Fault Lines Beyond the Harm Principle:**
  1.  **Nature of Society & Social Bonding:** Devlin viewed society as fundamentally held together by a shared, substantive morality – a "seamless web." Its dissolution, even on a single point (like homosexuality), risked catastrophic disintegration. Hart saw society as a cooperative venture for mutual advantage, held together by convergent interests and *minimal* shared rules (like prohibitions on violence, theft), not comprehensive moral uniformity.
  2.  **The Threat Model:** Devlin's threat was *internal decay through moral fragmentation*. Law must actively *preserve* the moral glue. Hart's primary threat was *state overreach and the suppression of individual liberty*. Law must *restrain* its own power to the prevention of tangible harm.
  3.  **The Role of Disgust/Intolerance:** Devlin argued intense societal disgust/indignation at certain acts (like incest, even private/consensual) was *prima facie* evidence that the act imperiled the social fabric ("if not, why feel so strongly?"). Hart vehemently rejected this, seeing disgust as a dangerous and irrational basis for law, potentially masking prejudice or mere tradition.
  4.  **The "Moderate Thesis" Ambiguity:** Devlin claimed the law should only enforce a society's *minimum* core morality necessary for cohesion, not every moral judgment. Both critics (like Hart) and supporters struggled (and still struggle) to define this "minimum core" non-arbitrarily. What *isn't* essential?

  **Your Burden Asymmetry Insight:**
  You're spot on. This is a crucial procedural manifestation of the deeper divides:
  *   **Devlin's Baseline:** Existing, deeply felt societal morality *is* the presumed foundation of social order. Any legal change relaxing moral prohibitions carries the burden of proving it will *not* cause social disintegration. The risk of error (legalizing something that *does* erode cohesion) is existential. Stasis is safer.
  *   **Hart's Baseline:** Individual liberty is the default presumption. Any criminal law restricting liberty (especially concerning private conduct) carries the burden of proving it prevents tangible harm to specific others. The risk of error (criminalizing harmless conduct) is a grave injustice. Reform is often demanded.
  *   **This asymmetry dictates institutional inertia.** Legislatures, often reflecting existing majoritarian sentiments (Devlin's "positive morality"), naturally lean towards Devlin's baseline. Challengers must overcome high hurdles (proving a negative – no social harm – or demonstrating tangible harm from the *prohibition itself*). Hart demands constant justification for the *status quo*.

  **Diagnosing the Stall: It's All Three Layers Intertwined:**
  1.  **Verbal/Conceptual (Harm):** Hart's "harm" is narrow (physical, psychological, or direct economic injury to specific, assignable individuals). Devlin's "harm" is broad and diffuse (erosion of social bonds, potential for widespread moral decay leading to societal collapse). They are arguing past each other on the fundamental *concept* of what justifies legal coercion.
  2.  **Hidden Empirical:** This is immense. Does *legal enforcement* of specific moral norms (beyond core harm prevention) actually foster social cohesion/stability? Or does it breed resentment, hypocrisy, and black markets? Does *relaxing* such laws cause disintegration, or does society adapt and find new bases for cohesion? History is messy: Prohibition failed spectacularly; some argued decriminalizing homosexuality would destroy society (it didn't); other norms shift with seemingly little fallout. **The lack of definitive, universally accepted empirical proof allows both sides to cherry-pick evidence.**
  3.  **Bedrock Intuitions (The State's Role):** This is the deepest layer. Should the state ever use the criminal law *expressly* to uphold a shared moral vision, to affirm communal identity, or to "teach" virtue – even absent tangible harm? Devlin (reluctantly) says yes, for the most fundamental norms. Hart says absolutely not; that's tyranny disguised. This clash over the state's symbolic and pedagogical function is fundamental and resistant to empirical disproof.

  **Is it Substantive or Procedural?**
  It's **both**, but the burden asymmetry *operationalizes* the substantive disagreement. The core clash over the state's role in enforcing shared morality (substantive) manifests procedurally in *who must justify change* and *what risks are prioritized*.

  **What Counts as Progress?**
  Absolute resolution is unlikely due to the bedrock intuitions. Meaningful progress involves:
  1.  **Applying Hart's Critical/Positive Distinction Rigorously:** Scrutinizing whether existing laws reflect *critical morality* (reasoned ethical principles) or merely *positive morality* (inherited prejudice, inertia, or majority whim). Legislative debates should explicitly confront this. Is a prohibition based on reasoned harm or reflexive disgust?
  2.  **Targeted Empirical Case Studies (Not Grand Theory):** Instead of asking "Does moral enforcement stabilize society?", ask specific, contextual questions: "What were the *actual, measurable social effects* (cohesion, trust, well-being, crime rates) of decriminalizing [specific act X] in [specific jurisdiction Y] over [timeframe Z], controlling for other factors?" Focus on modern examples (drug policy shifts, assisted dying regimes, recognition of diverse relationships).
  3.  **Focusing on the Harms of Criminalization:** Hartians can strengthen their case by meticulously documenting the tangible harms *caused by* enforcing moralistic laws – costs of enforcement, black markets, incarceration impacts, stigmatization, erosion of trust in law, suppression of autonomy. This directly challenges Devlin's burden structure by showing the status quo *itself* causes demonstrable harm.
  4.  **Acknowledging the Symbolic Function Debate:** Progress requires honestly confronting the question: "Even if we can't prove tangible harm *or* social disintegration, do we *want* the state to use criminal law to symbolically condemn conduct based solely on moral disgust or tradition?" Framing it this way exposes the core, value-laden choice.

  The debate persists because it touches on irreducibly different visions of society and freedom. Your focus on burden asymmetry illuminates *why* it feels stuck procedurally. Progress lies in sharper empirical scrutiny of specific cases, clearer analysis of the morality being enforced, and an unflinching look at the costs of *both* action and inaction.
