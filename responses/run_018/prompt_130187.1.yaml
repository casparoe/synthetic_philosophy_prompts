prompt: |-
  I was talking with some friends from work — I'm a software engineer with zero formal philosophy backround — about whether skipping meat or voting in a big election actually does anything, since climate damage and election outcomes are totally collective. One friend said it's all just inefficacy and my personal footprint is basically a rounding error, but another brought up being complicit in a harmful system even when there part is tiny, which sounded different to me. I also ran across this idea called threshold-sensitive obligations, where maybe you only have a duty to act if enough other people are already acting too, like a distributed prisoner's dilemma but for ethics; I think I might have misread the original post though.

  Anyway I'm trying to figure out which open questions in this whole area actually matter for someone like me versus which ones are just academic navel-gazing. If you had to rank the top unresolved issues — whether inefficacy really kills all individual moral reasons, whether there's a separate participatory wrong in contributing to collective harm, or how these threshold-sensitive obligations actually work in practice — which should come first? Defend the ordering: what's upstream of other debates, which ones have real stakes for everyday choices, and what kind of argument or evidence in the next few years would bump one up or down the list. Start with your bottom line in the very first sentence, then give the reasoning, with no preamble and don't restate the question back to me.
