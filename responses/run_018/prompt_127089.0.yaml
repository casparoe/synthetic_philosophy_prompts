prompt: |-
  hey i'm working on my diss chapter about distributive ethics and i'm kinda stuck. rawls's seperateness of persons objection says utilitarianism is wrong because it aggregates welfare across people like they're parts of one big life. but here's what confuses me: parfit's reductionism denies there's a deep metaphysical fact about whether i'm the same person over time—it's just psychologial continuity plus some relations. so if there's no hard boundry between me-now and me-later, why should there be a hard boundary between me and you? it seems like if you reject the metaphysical self, you should also reject the idea that persons are morally separate containers. in other words, doesn't parfit's view actually undermine rawls's objection rather than support it? i feel like people treat these as compatible but there's a hidden tension about whether moral separateness needs metaphysical separateness. am i just conflating diachronic identity with interpersonal boundries, or is this actually a problem that the literature ignores?
