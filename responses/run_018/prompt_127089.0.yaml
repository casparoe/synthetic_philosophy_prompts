  Okay, the user is working on their dissertation chapter about distributive ethics, specifically Rawls's separateness of persons objection to utilitarianism and Parfit's reductionism. They're confused because Parfit's view seems to undermine Rawls's argument. The user wonders if there's a tension between moral separateness and metaphysical separateness that the literature overlooks.

  First, I need to recall Rawls's objection. He argues utilitarianism fails by treating individuals as mere parts of a collective, ignoring the distinctness of persons. Parfit's reductionism challenges the metaphysical basis of personal identity over time, suggesting it's about psychological continuity. The user's point is valid: if personal identity isn't metaphysically robust over time, why assume strong boundaries between persons? 

  The key here is distinguishing metaphysical separateness from moral separateness. Parfit himself addresses this in "Reasons and Persons." He separates the metaphysical question of personal identity from the moral implications. Even if identity over time is reduced to psychological connections, the relations between different persons are fundamentally different. For example, sharing memories with a future self versus another person involves different degrees of connection. 

  Rawls's moral separateness is about distinct interests and autonomy, not metaphysics. The user might be conflating diachronic and interpersonal boundaries. Each person has a unique perspective and set of experiences that can't be fully shared, which grounds their moral claims regardless of metaphysical identity theories. 

  The literature does engage with this. Parfit argues reductionism might support utilitarianism by lessening the significance of personal identity, but he doesn't dismiss moral separateness. Rawlsians like Nagel emphasize the experiential separateness of individuals. The user should explore how different theories of personal identity impact distributive ethics, like in Derek Parfit's work or Scanlon's contractualism. 

