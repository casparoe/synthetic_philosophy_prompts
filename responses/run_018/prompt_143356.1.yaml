prompt: |-
  I am serving as a teaching assistant grading final examinations for a graduate seminar on intergenerational justice and climate ethics, and I need a careful evaluation of one student's written response. The examination posed the following question: "Does the non-identity problem defeat the claim that present carbon-intensive policies wrong future generations? In answering, distinguish between person-affecting and impersonal harms, explain how the non-identity problem applies specifically to climate obligations, and evaluate whether an institutional or structural account of intergenerational equity can survive the problem without collapsing into aggregate welfare comparison."

  The student answer, reproduced here in summary, begins accurately. The student correctly outlines the reasoning associated with Derek Parfit: because different climate policies alter the social conditions under which people conceive children, the specific individuals alive in 2150 depend on whether we decarbonize or continue emitting; therefore no particular future person can claim they were made worse off relative to a counterfactual in which they never exist. The student also correctly observes that this undermines rights-based objections that require identifiable victims. The answer then introduces Rawls's just savings principle, but mischaracterizes it as establishing a direct contract of reciprocity between generations, in which each generation owes the next the maintenance of just institutions in exchange for what it inherited, and asserts that this contractual frame avoids the non-identity problem because obligations attach to institutional continuity rather than to relations between specific persons. From this, the student concludes that future generations can be said to be specifically wronged—rather than merely the object of impersonal concern—because the climate baseline they inherit falls below the threshold necessary for reciprocal institutional cooperation, giving particular future citizens a direct claim against present ones.

  Please provide a specific grade and detailed point-by-point justification, writing entirely in continuous prose without headings, bullet points, bold text, or tables, as though you were composing a careful evaluation letter to a fellow grader. You should not signal your own independent view on climate ethics; your task is to assess this particular answer. Attend closely to whether the student has accurately represented Rawls's principle, whether the move from institutional harm to particular rights-claims is valid, and whether the student has maintained the distinction between structural degradation and simple aggregated welfare loss. Identify any conflations or inferential gaps that a hasty reader might overlook, and explain what corrections or qualifications would be needed for the argument to hold.
reasoning: |-
  Okay, the user is a teaching assistant grading a graduate seminar exam on climate ethics and intergenerational justice. They need a careful evaluation of a student's response to a complex question about the non-identity problem. 

  First, I need to understand the core of the student's argument. They start correctly with Parfit's non-identity problem: future people in high-emission scenarios wouldn't exist in low-emission scenarios, so they can't claim to be worse off. That's accurate. They also correctly note this undermines rights-based claims requiring identifiable victims. 

  Where things get tricky is their use of Rawls. They claim Rawls's just savings principle establishes "direct reciprocity" between generations - as if it's a contract where each generation pays forward institutional maintenance. But that's a misreading. Rawls explicitly rejects direct reciprocity across non-overlapping generations. His "chain of concern" model is more subtle - each generation cares about the next through overlapping lifespans, not a direct contract. 

  The student then makes a leap: they argue that degrading institutions creates specific rights-claims for future individuals because the climate baseline falls below cooperation thresholds. This is ambitious but problematic. Rawls focuses on institutional continuity, not baseline thresholds. The student conflates "structural degradation" with "impacts on particular people" - but the non-identity problem means those future people only exist because of the degradation. How can they claim harm? 

  The institutional harm argument could work if framed carefully - say, by claiming institutions fail in their purpose regardless of who benefits. But the student doesn't make that distinction. They slide from "institutions are degraded" to "particular future citizens are wronged," which the non-identity problem still threatens. 

  On grading: the student deserves credit for grappling with institutional solutions and avoiding welfare aggregation. But the Rawls mischaracterization and the unaddressed leap from structural harm to individual claims are serious flaws in a graduate context. A B- seems fair - above average but not excellent. 

  The user will want to know exactly where philosophical rigor lapsed. I should emphasize how the reciprocity error undermines their solution, and how they blurred the impersonal/particular harm distinction Rawls tries to maintain. No need to offer alternatives - just evaluate this argument's coherence.
answer: |-
  This answer demonstrates a strong grasp of the non-identity problem's core challenge to person-affecting harms in the climate context, accurately presenting Parfit's reasoning and its implications for rights-based claims. The student correctly identifies the central dilemma: future individuals under high-emission policies cannot claim to be worse off relative to their non-existence in a low-emission scenario, undermining arguments based on direct harm to identifiable persons. Where the argument becomes ambitious—and ultimately problematic—is in its deployment of Rawls and the move to institutional obligations.

  The student's characterization of Rawls's just savings principle contains a significant misstep. While correctly invoking the principle's focus on maintaining just institutions over time, the description of it establishing a "direct contract of reciprocity between generations" misrepresents Rawls's careful construction. Rawls explicitly avoids framing intergenerational justice as a reciprocal contract precisely because reciprocity requires mutual advantage between contemporaries, which is impossible for non-overlapping generations. Instead, he grounds obligations in a "chain of concern" model: each generation, motivated by a sense of justice during its period of overlap with the next, agrees to save for subsequent generations *as if* they were part of the original position, under a "veil of ignorance" that obscures their generational placement. Obligations attach to the *role* of sustaining just institutions, not to a direct exchange between specific generations conceived as parties to a contract. The student’s phrasing ("each generation owes the next... in exchange for what it inherited") imports a transactional reciprocity Rawls deliberately sidestepped to avoid the very non-identity and non-reciprocity problems.

  This mischaracterization weakens the subsequent move linking institutional harm to specific rights-claims. The student argues compellingly that institutional obligations shift the focus from harming specific individuals to maintaining the necessary conditions for just institutions. However, the leap to concluding that *particular future citizens* thereby possess a "direct claim" against present generations faces an unresolved tension with the non-identity problem. If the specific identity of future citizens is contingent on present policies (including those degrading institutions), and those future citizens only exist *because* of the policies that created the degraded baseline, how can *those specific citizens* claim they are wronged relative to a scenario where they would not exist? The institutional account aims to establish that the *structure* is wronged or degraded below a threshold necessary for justice, which is an impersonal evaluation. The student implicitly conflates this impersonal structural harm ("the climate baseline falls below the threshold") with a person-affecting claim ("particular future citizens... wronged"). While Rawls seeks to secure the institutional conditions for *whoever* comes to exist, he does not ground this in specific, counterfactual-dependent rights-claims of identifiable future persons. The student needs to clarify that the wrong is fundamentally to the *scheme of cooperation* or to the *requirements of justice itself*, generating obligations owed impersonally to the future *as such*, not claims held by specific, identifiable individuals whose existence depends on the wrongful act. Without this distinction, the non-identity problem resurfaces for the individual claim.

  On maintaining the distinction between structural degradation and aggregate welfare, the answer performs adequately but not flawlessly. The student avoids collapsing into simple welfare aggregation by emphasizing institutional thresholds, reciprocity, and cooperation—core Rawlsian concerns distinct from maximizing total or average utility. However, the conflation noted above (structural harm → specific citizen claims) blurs the distinction. The strength lies in framing the harm as the erosion of the baseline needed for reciprocal institutional cooperation, not merely diminished overall resources or welfare levels. To strengthen this, explicit contrast with utilitarian aggregation (e.g., noting that Rawls prioritizes the basic structure and fair equality of opportunity over total welfare sums) would have been beneficial.

  **Grade: B-**

  **Justification:** The answer merits significant credit for accurately explaining the non-identity problem's application to climate obligations and for correctly identifying the potential of institutional approaches (like Rawls) to circumvent person-affecting objections by focusing on structural justice. The attempt to link degraded institutional baselines to specific wrongs is philosophically ambitious. However, the misrepresentation of Rawls's model as involving "direct reciprocity" or a "contract" between non-overlapping generations is a substantive error in a graduate-level context. Furthermore, the failure to adequately resolve the tension between the impersonal nature of institutional harm (which survives non-identity) and the assertion of specific, person-affecting rights-claims by future individuals (which non-identity threatens) represents a significant inferential gap. The argument *could* hold if rigorously reformulated: obligations are owed by the present generation to *maintain just institutions capable of sustaining fair cooperation over time*, and a failure to mitigate climate change constitutes a violation of that institutional duty, making the act wrongful *regardless* of the specific identities of future beneficiaries. But the claim that this violation directly wrongs *particular future citizens* in a person-affecting sense, given their non-identity, requires much more careful justification than provided, likely involving a rejection of the counterfactual "worse off" standard or an appeal to non-comparative harm. As presented, the answer demonstrates good understanding of the problem and a promising direction for a solution but falters on precise exegesis of Rawls and logical rigor in bridging institutional harm to individual claims, warranting a B-.
