  The user wants to know where the film treats second-order confidence as psychological and where as tracking real modal facts. The Oracle scene is important here. Her cookie and "know thyself" advice seem psychological, boosting Neo's self-belief. But later, when he stops bullets and flies, it suggests this confidence taps into real possibilities within the Matrix's rules.

