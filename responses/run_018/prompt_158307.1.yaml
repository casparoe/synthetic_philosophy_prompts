  The user also wants confidence levels and the least certain branch. I think the aggregation question might be the trickiest because positions could vary. Some might accept aggregation in theory but with caveats, making it hard to categorize. Also, distinguishing between threshold deontology and bounded rationality in the risk aversion context isn't always clear-cut.

  I need to ensure the tree has 6-8 nodes max. Starting with EV seriously → Bet scenario → Reason for no (if applicable) → Aggregation. That's four nodes, with answer combinations leading to positions. Including the rejection path and aggregation splits should cover it.

