answer: |-
  Here's a decision tree mapping the logical space around EV fanaticism, based on your core questions and positions. It focuses on **concrete commitments** derived from your scenarios:

  **Decision Tree: Where Do You Land on EV Fanaticism?**

  1.  **I take expected value (EV) reasoning seriously for moral decision-making under uncertainty.**
      *   **Yes** → Go to Q2.
      *   **No** → Go to Q5.

  2.  **Q2: Would you take a 1-in-1000 shot at saving 10^40 lives over a sure $10?** (Assume negligible side effects & baseline)
      *   **Yes** → Go to Q4.
      *   **No** → Go to Q3.

  3.  **Q3: Why do you reject the bet in Q2?**
      *   **Primarily due to Risk Aversion:** Extreme stakes make standard linear EV calculation feel irrational/repugnant. → **Bounded Rationalist** (e.g., accepting diminishing marginal moral weight or cognitive limitations at extremes).
      *   **Primarily due to a Threshold:** No potential outcome, no matter how good or probable, can justify certain kinds of risks or actions (e.g., accepting *any* non-zero risk of astronomical suffering, violating deontic constraints). → **Threshold Deontologist** (e.g., no "Russian Roulette" with humanity).

  4.  **Q4: Do you allow full aggregation across radically different kinds of goods/suffering (e.g., physical agony vs. mild digital annoyance)?**
      *   **Yes** → **EV-Maximizer / Fanatic** (Unbounded utility functions dominate).
      *   **No** → **Scope-Sensitive Longtermist** (Accepts vast scope of future but weights goods differently, rejects simple aggregation across radically distinct experiences).

  5.  **Q5: Why reject EV framing?**
      *   **Moral Reasons Don't Aggregate:** Goods/Duties are incommensurable; "total good" is incoherent or misleading. → **Value Pluralist / Incommensurabilist** (e.g., based on deontology, virtue ethics, or specific non-aggregative views).
      *   **Other Foundational Rejection:** (e.g., deep skepticism about long-term predictions, rejection of consequentialism, focus on agent-relative reasons, virtue-centered ethics). → **Alternative Foundation** (e.g., Traditional Deontologist, Virtue Ethicist, Predictability Skeptic).

  **Mapping Answer Combos to Positions:**

  *   **Yes Q2 + Yes Q4:** EV-Maximizer / Fanatic
  *   **Yes Q2 + No Q4:** Scope-Sensitive Longtermist
  *   **No Q2 + Risk Aversion (Q3):** Bounded Rationalist
  *   **No Q2 + Threshold (Q3):** Threshold Deontologist
  *   **No Q1 + Moral Reasons Don't Aggregate (Q5):** Value Pluralist / Incommensurabilist
  *   **No Q1 + Other Foundational Rejection (Q5):** Alternative Foundation

  **Unnamed/Underspecified Positions:**

  *   **No Q2 + Risk Aversion (Q3) + No Q4:** (Implied) A Bounded Rationalist who *also* rejects full aggregation. Plausible, common, but lacks a standard name ("Cautious Pluralist"?).
  *   **No Q1 + [Answers Q2-Q4]:** Incoherent. Rejecting EV framing means not engaging with Q2-Q4 *on their own EV terms*.

  **Empty Combos & Why:**

  1.  **Yes Q1 + No Q2 + Yes Q4:** Empty. If you reject the bet (No Q2) due to risk/threshold concerns, accepting full aggregation (Yes Q4) is contradictory. The bet *explicitly* asks you to aggregate an astronomical good.
  2.  **No Q1 + Yes Q2:** Incoherent. Rejecting EV framing precludes endorsing the purely EV-based logic required to say "Yes" to Q2 *for the reasons given*.
  3.  **Yes Q1 + Yes Q2 + [Stuck before Q4]:** Incomplete. Answering Yes to Q2 logically forces you to Q4.

  **Indistinguishable Pairs:**

  *   **Bounded Rationalist vs. Scope-Sensitive Longtermist:** *Without explicit scenarios*, their practical decisions might overlap (both rejecting the 10^40 bet and potentially rejecting simple aggregation). Q4 distinguishes them. A Bounded Rationalist *might* still accept aggregation in principle but be overwhelmed by scale; a Scope-Sensitive Longtermist rejects aggregation *in kind*.
  *   **Threshold Deontologist vs. Value Pluralist:** Both reject simple aggregation, but for different *foundational* reasons (action constraints vs. incommensurability). The Threshold Deontologist *might* still use EV within constraints; the Pluralist rejects the EV framing itself. Q1 distinguishes them.

  **Confidence & Least Certain Distinction:**

  *   **Overall Confidence:** **Moderate-High (70%)**. The core distinctions (taking EV seriously, accepting/rejecting the fanatical bet, reasons for rejection, aggregation) capture the major fault lines in the literature and discourse. The positions mapped are well-established.
  *   **Least Certain Distinction:** **Bounded Rationalist vs. Threshold Deontologist (based solely on Q3 reasoning).** In practice, someone rejecting the 10^40 bet might cite *both* risk aversion and threshold concerns. The "primary reason" can be blurry. Is the repugnance of the risk (BR) fundamentally different from believing the action type is forbidden (TD)? This branch relies heavily on introspective justification, which can be ambiguous. Some sophisticated views blend elements.

  This tree provides a structured way to interrogate your intuitions on the concrete commitments defining positions around EV fanaticism. Where do *you* land?
