  The first node is whether the person takes EV reasoning seriously. If no, that leads to rejecting the framing, which could be deontological or virtue ethics. If yes, then move to the next node: the 1-in-1000 shot scenario. Answering "yes" here suggests strong adherence to EV maximization, leading to EV-maximizer or fanatic. Answering "no" might indicate risk aversion or threshold concerns.

  Next, if they say no to the bet, the reason matters. If it's due to risk aversion at high stakes, that could lead to bounded rationalist. If it's because there's a threshold where EV breaks, that points to threshold deontologist. Then, the aggregation question: whether they allow aggregating different goods like physical vs. digital suffering. A "yes" might align with scope-sensitive longtermist, while "no" could be a pluralist or incommensurabilist view.

