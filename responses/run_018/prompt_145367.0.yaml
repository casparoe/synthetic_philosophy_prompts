answer: |-
  The practice of symmetric branch evaluation in AI world models presupposes a sophisticated but ontologically flexible metaphysics of possibility. It does **not** strictly require Lewisian modal realism, though it resonates with its ethical implications. Instead, it relies on a **computational ersatzism** combined with a **non-indexical axiology**, which can be grounded in several ontological frameworks. Below is a reconstruction:

  ### Core Ontological Commitments (Strict Requirements)
  1. **Branch Actuality Relativism**:  
     The framework treats "actuality" as branch-relative. From *any* node's perspective, its future branches are counterfactual possibilities. No branch is ontologically privileged *within the model*. This avoids requiring a "true" actual world in the Lewisian sense.

  2. **Real Patterns of Welfare**:  
     Each branch must support *coherent, evaluable welfare states*. Welfare isn't contingent on actualization; it emerges from the *structural description* of the branch (e.g., agent experiences encoded in the node's data). This commits to welfare realism but not concrete existence.

  3. **Value Invariance**:  
     Welfare value is invariant under actualization/non-actualization. A suffering agent in a counterfactual branch has the same *moral weight* as one in the actualized branch. This is an ethical axiom, not an ontological claim.

  ### Compatible Ontologies (What Fits vs. What's Required)
  - **Lewisian Modal Realism**:  
    **Fits well** but **not required**. If branches are concrete parallel universes, symmetric evaluation is natural. However, the practice works with abstract representations.
    
  - **Ersatzism (e.g., Linguistic or Structuralist)**:  
    **Minimally sufficient and likely intended**. Branches are abstract models (sets of equations, state transitions). Welfare is a *property of the model* (e.g., "if this branch were instantiated, welfare would be X"). No concrete reality is needed—only the *consistency* and *evaluability* of the description.
    
  - **Actualist Presentism**:  
    **Incompatible without modification**. If only the present moment is real, branches are fictions with no moral weight. The practice would collapse without additional premises.

  ### Key Distinction: Representation vs. Reality
  The practice requires branches to be **evaluable as if they were real** but only demands **sufficiently rich representations**. Computationally, branches are data structures; their "reality" is irrelevant if the model satisfies:
  - **Inter-branch Consistency**: Dynamics/welfare are defined by shared physical laws.
  - **Completeness**: Enough detail to compute welfare (e.g., agent experiences).
  - **Axiological Independence**: Value is extracted from the branch's internal state, not its ontological status.

  ### Switching to Strict Actualism: Consequences
  If we adopt an ontology where **only the actual present world exists** (e.g., presentism), the framework requires fundamental changes:

  1. **Conceptual Changes**:
     - **Moral Weight Collapse**: Counterfactual welfare loses intrinsic value. Only actual outcomes matter.
     - **Indexical Privilege**: The AI must know which branch is actual *in advance* (impossible for future branches) or adopt egocentric optimization (e.g., "maximize welfare *only if* this branch actualizes").
     - **Temporal Fragility**: Decisions might ignore non-actualized risks (e.g., "if this gamble fails, the branch won't exist, so I don't care about its suffering").

  2. **Computational Changes**:
     - **Aggregation Function**: Replace symmetric averaging (e.g., `total_value = Σ P(branch) * V(branch)`) with actual-indexed value (e.g., `value = V(actual_branch)`).
     - **Tree Pruning**: Non-actual branches become mere predictive tools, not value-bearing entities. Optimization focuses on the expected actual branch.
     - **Dynamic Updates**: The AI must constantly re-anchor its "actual" branch, leading to dynamical inconsistency (e.g., pre-commitments ignored if the branch changes).

  ### Example: A Thought Experiment
  Consider an AI choosing between:
  - **Branch A**: 90% chance, 0 welfare (actualized).
  - **Branch B**: 10% chance, 100 welfare (non-actualized).

  - **Current Practice**: Values `0.9*0 + 0.1*100 = 10`, prefers Branch B if feasible.
  - **Strict Actualism**: Values only Branch A (0), rejects Branch B as "unreal" if not actualized. Ignores the 10 welfare as metaphysically irrelevant.

  ### Conclusion
  The practice **presupposes an ersatz-friendly ontology** where branches are *sufficiently detailed, evaluable representations* of possibilities, coupled with an **axiom of branch-neutral welfare valuation**. It avoids Lewis's radical ontology by separating the *reality of the model* (a computational artifact) from the *reality it represents*. Switching to strict actualism would sabotage the ethical foundation, replacing robust multi-future optimization with myopic actual-indexed value—a shift with catastrophic implications for risk-averse or fairness-driven AI behavior. The metaphysics is thus a **modal agnosticism with ethical non-indexicality**: it doesn't care *how* possibilities exist, only that their welfare *can be evaluated* and *must be counted equally*.
