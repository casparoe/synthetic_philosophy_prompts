prompt: |-
  I'm trying to get my head round the KK principle, and I want a really clean counterexample to it. Build me a case where someone knows that p but is not in a position to know that they know p. The catch: no lotteries, no fake barns, no sorites or borderline cases, no demons or perfect predictors, and the person has to be an ordinary adult who has the concept of knowledge. The failure should come from the sturcture of the situation rather than the person just being thick or irrational. One ordinary-life scenario, nothing science-fictional.

  Then do the check for me: state the proposition, the method they used, why they still count as knowing p, why they can't know that they know p, and which nearby worlds matter for each verdict. Say a bit about whether the case commits you to denying the luminosity of some mental state and why (or why not). Finish with what a defender of the KK principle would say to block the case, and which single feature of the case is doing the work—what happens if you remove it.
