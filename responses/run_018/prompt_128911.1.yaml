  **Job Posting: Senior Archivist of Actual Occurrence**  
  *Bureu of Unmediated Past (Official)*  

  **About the Role:**  
  The Bureu of Unmediated Past seeks a Senior Archivist of Actual Occurrence to steward humanity’s unfiltered historical record. In this mission-critical role, you’ll uphold our mandate to preserve events *exactly as they happened*, free from subjective distortion. Reporting to the Director of Verifiable Realities, you’ll ensure primary sources remain pristine, untainted by interpretation or narrative interference. If you possess an unwavering commitment to empirical purity, join us in building history’s only truly objective archive.  

  **Key Responsibilities:**  
  - Curate primary sources (texts, artifacts, recordings) with zero interpretive mediation.  
  - Maintain archival protocols guaranteeing *direct access* to historical materials, bypassing contextual framing.  
  - Audit historical entries for Rankean compliance, ensuring alignment with the “as it actually happened” standard.  
  - Reject all post-facto analysis, contextualization, or thematic grouping of events.  
  - Uphold a Ranke Purity Score (RPS) of 98+ across all assigned epochs.  

  **Qualifications:**  
  - PhD in Objective Historiography or Unmediated Chronology; alternate credentials require RPS waver from our Purity Review Board.  
  - 7+ years’ experience handling primary sources *without* secondary contamination (internships in mediated institutions disqualify candidates).  
  - Certified Rankean Neutrality (CRN) accreditation mandatory.  
  - Demonstrable void of interpretive bias—submit a Bias Nullification Certificate with your application.  
  - Proficiency in Temporal Lensing® software for direct source access (v. 4.2 or higher).  
  - *Note:* Candidates with published narrative analyses, monographs employing "context," or familiarity with postmodern theory will undergo RPS degradation penalties.  

  **Perks & Culture:**  
  Join a team of dedicated realists who *know* history is built on immaculate facts! Our culture thrives on precision:  
  - **Carr Drift Allowance:** Annual stipend to offset incidental interpretive slippage during coffee breaks.  
  - **Narrative Emplotment Bonus:** Quarterly rewards for departmental alignment on fiscal KPIs (despite our official neutrality).  
  - **White Tuesday:** Our beloved office holiday! Staff vote to determine the year’s governing narrative trope (Romance, Tragedy, Satire, or Farce). Past themes include “Q3: The Tragic Supply Chain Shortage” and “H1: The Romantic Revenue Surge.”  
  - **White Emplotment Index (WEI):** Primary metric for performance reviews. High WEI scores correlate with seamless integration of operational milestones into the voted-upon annual trope.  
  - Wellness perks include bias-canceling headphones, a “Context-Free-Zone” meditation pod, and mandatory quarterly de-narrativization workshops.  

  **Equal Opportunity Employer:**  
  The Bureu celebrates unmediated diversity. All applications are processed identically—unless they require narrative accommodation (see Form H-09b for trope-based adjustments).  

  **Apply:**  
  Submit your RPS certification, CV (sans “interpretive skills” section), and a 1-page declaration of historiographical virginity to purefacts@bureu-unmediated.gov. Closes when we’ve objectively determined the perfect candidate exists.  

