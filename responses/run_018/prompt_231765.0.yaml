answer: |-
  ## Adversarial-Collaboration Statement on Moral Equality of Combatants (MEC) in Just War Theory

  **Parties:**
  *   **Party A:** Defender of a Walzerian, Convention-Based Symmetry view of MEC.
  *   **Party B:** Defender of a McMahanian, Revisionist Liability-Based view rejecting MEC.

  **Preamble:** This document represents a joint effort to precisely articulate areas of agreement and disagreement regarding the moral status of combatants (*jus in bello*), specifically the doctrine of Moral Equality of Combatants (MEC). It aims to clarify the core dispute, identify key points of contention ("cruxes"), and distinguish substantive disagreement from terminological differences, moving beyond repetitive debate. It does not seek resolution but precision.

  ---

  **1. Substantive Agreed Claims:**

  1.  **Distinction of *Jus ad Bellum* and *Jus in Bello*:** Both *jus ad bellum* (justice of resorting to war) and *jus in bello* (justice in the conduct of war) are essential, distinct categories of moral evaluation in warfare.
  2.  **Rejection of Absolute Pacifism:** Warfighting, under specific conditions, can be morally permissible for individuals and states.
  3.  **Centrality of Discrimination:** Intentionally targeting non-combatants (civilians not directly participating in hostilities) is always morally prohibited.
  4.  **Importance of Proportionality:** Acts within war (e.g., attacks) must satisfy a proportionality requirement where the anticipated military advantage outweighs the expected collateral harm to civilians and civilian objects.
  5.  **Significance of Epistemic Constraints:** Individual soldiers often operate under severe limitations of information, perspective, and time, making reliable independent judgments about the overall justice of their nation's war (*jus ad bellum*) extremely difficult, if not impossible, in many cases.
  6.  **Functional Value of Symmetry for Conventions:** A legal or conventional framework that treats combatants symmetrically *regardless of the justice of their cause* (e.g., POW status, combatant immunity for lawful acts) has significant practical utility in regulating warfare and potentially limiting its horrors.
  7.  **Moral Asymmetry at the Macro Level:** The state or political leadership initiating an unjust war bears significant, distinct moral responsibility for the resulting harms.
  8.  **Presumption Against Killing:** Killing another human being requires strong moral justification; it is not a morally neutral act.

  ---

  **2. Disagreements Table:**

  | Party A (Walzerian Symmetry)                                                                                                | Party B (McMahanian Revisionist)                                                                                              |
  | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- |
  | **1. Moral Standing of Combatants:** A combatant who strictly adheres to the established war convention (discrimination, proportionality, wearing uniform, no perfidy, no torture) possesses the same moral standing and permissions regarding the use of lethal force as an enemy combatant doing the same, *irrespective* of the objective justice (*jus ad bellum*) of the war they are fighting. | **1. Moral Standing of Combatants:** A combatant's moral permission to use lethal force against enemy combatants is contingent upon the objective justice (*jus ad bellum*) of the war they are fighting. Only combatants fighting for a just cause (or under conditions making their contribution non-threatening/unjust) possess the full moral permission to kill. |
  | **2. Basis of Permissions/Liability:** The moral permission for combatants to kill other combatants (and their corresponding liability to be killed) arises primarily from their status as participants in the institution of war, governed by reciprocal conventions grounded in symmetry and the recognition of shared circumstances (epistemic limits, obedience to state authority). | **2. Basis of Permissions/Liability:** A combatant's liability to be killed (and their lack of permission to kill others) is determined by the objective, unjust threat they *actually* contribute to. Fighting in an objectively unjust war makes one morally liable to defensive harm proportionate to the threat posed, regardless of personal belief. |
  | **3. Role of Convention vs. Deep Morality:** The war convention, including MEC, represents a morally defensible framework for guiding the conduct of individual soldiers given the realities of war (especially epistemic constraints and the need for reciprocal restraint). This *is* the relevant level of "moral" evaluation for the individual soldier's actions in war. | **3. Role of Convention vs. Deep Morality:** The legal/conventional doctrine of MEC is a pragmatic necessity for international law and military discipline but does not reflect the underlying "deep" morality of killing in war. Deep morality centers on individual rights, liability, and objective justification. |
  | **4. Epistemic Limits & Moral Culpability:** Because individual combatants generally cannot reliably know their war is unjust, and because they act within a framework demanding obedience, their participation in an unjust war, *if compliant with in bello rules*, does not render them morally culpable for the *ad bellum* injustice or deprive them of the moral permissions granted by the symmetrical convention. | **4. Epistemic Limits & Moral Culpability:** While reasonable belief in the justice of one's cause may significantly *excuse* a combatant fighting for an unjust cause (reducing blameworthiness/punishment), it does not *justify* their acts of killing or negate their objective liability to defensive killing. Excuse ≠ Justification. |

  ---

  **3. Cruxes: Key Sub-Questions & Predictions**

  Each crux identifies a specific point of divergence. For each, a concrete case or argument is provided, and each party records their prediction regarding how resolving the crux would impact the other party's position.

  1.  **Crux: Is Liability to Defensive Killing Objective or Agent-Relative?**
      *   **Sub-Question:** Does the permissibility of killing a combatant (their liability) depend *solely* on the objective threat they pose in an unjust cause, or does it also depend on what the *killer* can reasonably believe about the justness of their own cause and the threat posed by the target?
      *   **Case:** *The Mistaken Just Warrior:* Combatant J, fighting for a genuinely just cause (defending against unprovoked aggression), reasonably but *mistakenly* identifies Combatant U (a conscripted truck driver delivering food to front-line troops in the unjust aggressor army) as an imminent, direct threat due to garbled intelligence. J kills U.
          *   **Party A Prediction:** Party B must conclude that J's killing of U was morally impermissible because U posed no *objective* imminent threat and was only marginally contributing to the unjust threat. This exposes the counter-intuitive harshness of the purely objective liability view, moving Party B towards recognizing the necessity of agent-relative permissions based on reasonable belief within the fog of war.
          *   **Party B Prediction:** Party A must acknowledge that while J's *belief* was reasonable, the killing was still objectively *unjustified* because U posed no liable threat at that moment. This highlights that Party A's symmetry view morally licenses killing non-threatening individuals based solely on role/convention, moving Party A towards recognizing the primacy of objective liability.

  2.  **Crux: The Permissibility of Killing Non-Culpable Contributors to Unjust Threats**
      *   **Sub-Question:** Can combatants fighting for a just cause permissibly kill combatants fighting for an unjust cause who contribute to the unjust threat but whose personal contribution is marginal, non-culpable (e.g., conscripts under duress), and/or non-imminent?
      *   **Case:** *The Conscripted Cook:* Nation X unjustly invades Nation Y. Combatant C (Just) is a soldier in Y's army. Combatant D (Unjust) is a conscript in X's army, forcibly drafted under threat of imprisonment, assigned to cook meals at a rear base 50 miles from the front. D performs no direct combat role but contributes to the sustenance of combat troops. C, as part of a justified operation, attacks the rear base knowing non-combatants are absent, and kills D.
          *   **Party A Prediction:** Party B must either concede that killing D was permissible (undermining the claim that MEC has no deep moral basis, as D's role made them liable under the symmetrical convention) OR insist it was impermissible (making just resistance practically impossible against modern, complex militaries reliant on vast support networks, thus moving Party B towards accepting a more convention-based permission for targeting combatants *as a class*).
          *   **Party B Prediction:** Party A must either admit that killing D was deeply problematic (as D posed minimal threat, was non-culpable, and proportionality/marginally might be questioned, moving towards liability) OR insist it was straightforwardly permissible purely based on D's combatant status (revealing Party A's view licenses killing individuals who are objectively non-threatening and non-culpable, solely due to their role in the adversary's system).

  3.  **Crux: Does Symmetry Provide the *Best* Moral Justification for *In Bello* Constraints?**
      *   **Sub-Question:** Is the reciprocal acceptance of symmetrical rules ("war convention") the most compelling *moral* foundation for expecting and maintaining adherence to *jus in bello* principles like discrimination and proportionality, or can these principles be grounded solely in the deep morality of rights/liability without needing symmetry between adversaries?
      *   **Argument:** Consider the incentive structure. Without symmetry (MEC), combatants on the just side might feel morally licensed to use harsher tactics against "liable" unjust combatants, believing themselves morally immune from reciprocal treatment. Combatants on the unjust side, knowing they are seen as "liable criminals," have little incentive to follow *any* rules.
          *   **Party A Prediction:** Party B must acknowledge that abandoning MEC undermines the strongest practical (and thus moral) argument for universal compliance with *in bello* rules. Recognizing this functional necessity would move Party B to accept MEC as morally defensible *at the operational level*, even if not in "deep morality."
          *   **Party B Prediction:** Party A must concede that the symmetry argument is purely pragmatic/consequentialist, not a justification rooted in the intrinsic moral status of individuals. Recognizing that discrimination/proportionality are grounded in the rights of the *victims* (civilians, minimally threatening combatants) rather than reciprocity would move Party A to see MEC as a potentially harmful fiction obscuring underlying moral truths.

  ---

  **4. Note on Terminological Differences:**

  *   **"Moral Equality of Combatants (MEC)":** This is the core term. Party A uses it to denote the *symmetry of permissions and liabilities* granted by the war convention, based on role and adherence to *in bello* rules. Party B primarily uses it to denote the *symmetry of moral innocence/guilt* or *justification* at the deep level, which they reject. The disagreement is partly about *what aspect* of morality (conventional permissions vs. fundamental justification/liability) the term "moral equality" applies to.
  *   **"Liability":** Party B uses this in a specific, objective, moralized sense: someone is liable to defensive harm if they pose an unjust threat, making harming them *not wrong* to them (though it might be all-things-considered impermissible). Party A often uses "liability" more loosely, akin to legal vulnerability or conventional status (e.g., "liable to be targeted as a combatant"). The debate hinges on whether liability is an objective moral fact or a conventional/role-based status.
  *   **"Permission":** Party A focuses on the *operational permission* granted within the war convention to kill enemy combatants. Party B focuses on the *deep moral permissibility* of the killing act itself, which they argue depends on objective justification/liability. The dispute involves whether conventional permissions translate to deep moral permissions.
  *   **"Justification vs. Excuse":** Party B rigorously applies this distinction: a combatant fighting unjustly might be *excused* (not blameworthy) due to epistemic limits/duress but their killing acts remain *unjustified* (objectively wrong). Party A's framework tends to blend these, seeing adherence to the convention as providing justification or sufficient moral absolution for the individual soldier's actions within the context of war.
  *   **"Combatant":** While both agree on the basic definition (members of armed forces), Party A sees the status itself as largely determinative of conventional permissions/liabilities. Party B sees the status as primarily relevant for the *legal* convention, while the *moral* permissions/liabilities are determined by the individual's actual contribution to an unjust threat.

  ---

