prompt: |-
  I teach an upper-level undergraduate seminar in decision theory with about eighteen students, and I have one two-hour session in which I want them to run into the two-envelope paradox themselves rather than have it explained to them. Design a classroom activity in which students make real choices between two envelopes, slips, or cards holding unequal amounts where one holds twice the other, and are then offered the chance to switch after seeing their own amount; the rules and the order of operations should be arranged so that the always-switch reasoning arises naturally from the students before anyone names it, and then reinforced by the unopened symmetric case where the same reasoning would push them to switch twice. I want exact materials, timings for each phase, a scoring or payoff scheme that needs no real money but still makes each choice feel consequential, and a debrief that maps moments in the activity onto the structure of the paradox: the hidden amount pairs, the mistake of treating the observed amount as fixed across the two possible comparisons, the symmetry of the unopened case, and the problem with the implicit uniform distribution over possible envelope contents. Also tell me how to handle a room where half the students have already heard of the paradox, what will predictably go wrong the first time I run it, and which features of the paradox the activity cannot make vivid and must therefore be supplied in the debrief. Keep the entire response in continuous prose, the way you would write a long email to a colleague: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, the user is teaching an upper-level undergrad seminar on decision theory with 18 students. They want a classroom activity for a two-hour session where students discover the two-envelope paradox themselves through real choices. The key is to design it so the "always switch" reasoning emerges naturally, then gets reinforced when they see switching twice in the symmetric unopened case. 

  First, I need to consider materials. Since real money isn't allowed, I'll suggest using points tied to participation grades - maybe 0.1% per point to make it tangible but not stressful. For envelopes, colored index cards would work well: blue for initial choice, yellow for switch opportunity. Students will write amounts on slips inside, but we need to control the pairs carefully. 

  The sequence should unfold in phases: 
  1) Setup with hidden asymmetric pairs (A and 2A amounts) 
  2) Initial choice without seeing contents 
  3) Reveal their own amount 
  4) Offer switch to the other unseen envelope 
  5) Collect and reveal outcomes 
  6) Repeat with symmetric unopened case 

  Timing is crucial - I'll allocate about 60 minutes total: 5 min setup, 15 min for first choice/switching, 10 min reveal, then 15 min for round 2, leaving 15 min debrief. 

  For the paradox to emerge organically, the activity must make students feel switching is always beneficial. When they see amount X, they'll calculate expected value of switching as (0.5)(0.5X) + (0.5)(2X) = 1.25X, which seems rational. But when we do the symmetric round where no one opens envelopes and everyone switches twice, it becomes absurd - they end up with the same envelope but lose points from the switching penalty. 

  The debrief needs to explicitly connect these moments to the paradox's components: 
  - How they treated X as fixed when it actually depends on which envelope pair they had 
  - Why the uniform distribution assumption is flawed (the amounts aren't equally likely) 
  - The symmetry breaking when they open vs don't open the envelope 

  For students who already know the paradox, I'll suggest making them "planted skeptics" who must argue against switching - this keeps them engaged without spoiling the discovery. 

  Predictable hiccups: 
  - Some will peek at both envelopes 
  - The switching penalty might distort behavior 
  - Students may not vocalize the expected value reasoning spontaneously 

  The activity can't fully illustrate the infinite uniform distribution problem - that requires debrief explanation. Also, the exact flaw in treating X as fixed across possible worlds needs explicit highlighting afterward. 

  Finally, I'll wrap everything in continuous prose as requested, like advising a colleague. The tone should be supportive but precise, anticipating practical issues while staying focused on the pedagogical goals.
answer: |-
  Here's how I'd approach that session, building on what's worked for me and colleagues when inducing paradoxes experientially. Start by preparing materials: thirty-six identical small envelopes (two per student), plus eighteen blue and eighteen yellow index cards (cut in half if large). Pre-print slips with amounts: create nine pairs where one slip has "X" and the other "2X," but use actual numbers to avoid abstraction—e.g., $4/$8, $5/$10, up to $12/$24. Vary X sufficiently so amounts don’t imply a pattern ($4/$8, $10/$20, etc.). Also, prepare eighteen "control" envelopes with identical pairs (say, all $10/$10) on differently colored slips. Have a chalkboard or digital equivalent for tallying.

  **Phase 1: Asymmetric Choice (40 minutes total)**  
  *Setup (5 min):* Distribute one blue and one yellow card to each student. Ask them to write their name on both. Explain they'll earn participation points convertible to course credit (e.g., 10 points = 0.1% final grade; precise conversion reassures without real money). Randomly distribute your pre-prepared envelope pairs. Emphasize: "Each pair has two different amounts; one envelope holds exactly twice what the other does. You don’t know which is which."  

  *Initial Choice (2 min):* Have them choose one envelope (without opening), place it atop their blue card, and set the other aside on the yellow card.  

  *Reveal and Switch Offer (5 min):* Ask them to open their chosen envelope and note the amount privately. Then say: "You now see your amount. You can switch to the unopened envelope on your yellow card. If you switch, you must pay a 1-point 'effort fee,' but you get the new amount. If you keep, no fee. Write 'SWITCH' or 'KEEP' on your blue card." Stress this choice is binding.  

  *Collection and Reveal (8 min):* Collect all blue cards (with choices) and envelopes. Shuffle and open envelopes publicly, recording: student name, initial amount, choice (switch/keep), final amount, and points earned (final amount minus 1 point if switched). Calculate point totals.  

  *Group Reflection (15 min):* Ask: "Who felt switching was obviously good? Why?" Students will volunteer expected value reasoning: "I had $10; switching gave 50% chance of $5 or $20, so average $12.50 minus 1 point still beats $10." Note their phrasing—someone will say "I had X, so the other is either 0.5X or 2X." Write this logic publicly: **"Given my amount X, expected value of switching = 0.5*(0.5X) + 0.5*(2X) = 1.25X."** Ask if anyone disagreed; skeptics may intuit trouble but rarely articulate it yet.  

  **Phase 2: Symmetric Choice (25 minutes total)**  
  *Setup (5 min):* Distribute "control" envelopes (all $10/$10) with fresh slips. Same rules, but announce: "This time, amounts *may or may not* be equal—focus on your choice." (This white lie preserves symmetry perception).  

  *Choice Process (5 min):* Repeat: choose envelope to blue card, other to yellow, open their chosen envelope (all see $10), decide switch/keep with same 1-point fee.  

  *The Twist (10 min):* Before revealing, ask switchers: "If you could switch back to your original for another 1-point fee, would you?" Most will say yes—same logic applies: "Now I have the other envelope, but it’s identical to the first! Switching back expects 1.25X again!" Reveal all are $10/$10. Show switchers paid 2 points for no gain (ending with $10 -2 =8), keepers have $10.  

  **Debrief (35 minutes):**  
  Start by mapping moments to paradox structure:  
  1. **Hidden Pairs:** Emphasize Phase 1 envelopes were rigidly paired (X/2X). The error was assuming *their specific X* could be either the smaller or larger in the pair with equal probability *after seeing X*. But if they had $10, it was only ever paired with $5 *or* $20—never both. Their calculation treated $10 as a pivot that could be in either role, but the pairing was fixed beforehand.  
  2. **Observed Amount as Fixed:** Highlight how they anchored on "I have X" and imagined two possible worlds (other = 0.5X or 2X). But X isn’t independent—it’s correlated with the pair. If X is large (e.g., $24), it’s *more likely* the larger amount, making switching risky.  
  3. **Symmetry in Unopened Case:** In Phase 2, no one opened anything initially. Ask: "Would you pay to switch before opening?" Most say no—symmetry makes switching pointless. But *after* opening, symmetry breaks psychologically—they treat the seen amount as "fixed" even though the unopened envelope is identical. This exposes the illusion: opening the envelope creates false asymmetry.  
  4. **Implicit Uniform Distribution:** Point out their 50/50 assumption implies all possible X are equally likely. But if X can be arbitrarily large, uniform probability is impossible. Ask: "If you saw $1000, would you *really* think $2000 is as likely as $500?" The paradox sneaks in an improper prior.  

  **Handling Prior Knowledge:** For students who know the paradox, assign them as "skeptics." Privately ask them to argue *against* switching during group discussions. This channels their expertise productively—they’ll challenge peers’ EV calculations, seeding doubt without spoiling emergence.  

  **Predictable Challenges:**  
  - **Peeking:** Some may peek at both envelopes early. Prevent this by stressing "binding choices" and collecting envelopes promptly.  
  - **Scoring Distortion:** The 1-point fee may deter switching. Mitigate by making points valuable enough (e.g., 10+ points achievable) so gains dominate, or use play money redeemable for small treats.  
  - **EV Reasoning Stalls:** If no one articulates the 1.25X logic, prompt: "Imagine you saw $10. What’s switching worth?"  
  - **Skeptics Dominate:** If skeptics shut down discussion, remind them their role is to probe, not preach.  

  **Limitations Requiring Debrief:**  
  The activity *cannot* vividly show:  
  - **Non-uniform Distributions:** Students won’t intuit that the paradox assumes infinite, equally likely amounts. Debrief using the question: "What if we only used $10/$20 pairs? Does switching help?" (Answer: no, EV is $15 - fee vs. $15 kept).  
  - **Conditional Probability Formalization:** They’ll feel the tension but need you to explicitly link "P(other is 2X | I see X)" to the prior distribution of X.  

  This flow balances discovery with structure. Students *live* the paradox before dissecting it, making the debrief a resolution rather than an abstraction. The physical tokens (cards, envelopes) make choices concrete, and the symmetric round crystallizes the absurdity of double-switching. Run it tightly, and the "aha" when Phase 2 backfires will be unforgettable.
