  predict her verdict. is she running strict Gould-Lewontin spandrel logic where origin trumps current function, or a co-option view where being maintained for hunting now makes it an exaptation/adaptation? don't just list both sides — take a definite position, defend it, and say which further case would actually split those two rules apart.

