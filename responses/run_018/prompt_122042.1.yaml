prompt: |-
  ok so im trying to wrap my head around the backward induction paradox and the centipede game, but every explanation i find feels like it's copy-pasted from the same three textbooks. im an institutional economist — i spend my days on multi-stage contracts with sunset clauses and renegotiation windows, so i know that vocabulary cold, but i dont really speak philosophy. can you restate the backward induction argument (and the usual rationalist reply that you should take the money and run at node one) entirely in contract-design terms? use ideas like renegotiation-proofness, credible commitment mechanisms, sunset provisions, and clauses that specify common knowledge of rationality. then i want the residue report: what translates cleanly, what only fits if i distort rationality into something like contractual consistency, and what has literally no counterpart in how contracting works? is the philosophers idea of common knowledge of rationality just missing from contract law because lawyers dont need it, or is contract law missing a real tool? also, heres a twist i made up: imagine a centipede game where the payoff for continuing doubles each round but the objective probability the game survives to the next round halves each round, so expected value stays flat — does backward induction still bite, or does the noise break the induction chain? tell me if that variant even makes sense in contract terms, and whether it reveals something the standard paradox hides.
