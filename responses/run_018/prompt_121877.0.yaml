  ### Bertrand's Paradox Tutorial: A Finite, Non-Geometric Case

  #### The Device
  The device consists of three identical fair coins and a triangular frame with three corners labeled 1, 2, and 3. The corners are indistinguishable in terms of physical properties like size, shape, or position relative to the environment—the triangle is equilateral and not aligned with any external landmarks. The device operates as follows: all three coins are flipped simultaneously. The outcome is determined by the number of heads and the corner corresponding to the first coin that lands heads, read in clockwise order starting from corner 1. Specifically:
  - If no coin lands heads, outcome A occurs.
  - If exactly one coin lands heads, the outcome is the corner corresponding to that coin (e.g., heads on the coin at corner 2 yields outcome B if corner 2 is labeled as such).
  - If two or more coins land heads, the outcome is the corner corresponding to the first heads in the clockwise order (starting from corner 1).

  The coarse description is symmetric under cyclic permutation of the outcome labels A, B, C because the corners are physically identical and the clockwise order is arbitrary (it can be reassigned without changing the device’s structure). A careful reader, given this description alone, would conclude that the setup is symmetric and that each outcome should have a probability of 1/3.

  #### State Spaces and Symmetries
  - **Coarse outcome space**: {A, B, C}  
    **Symmetry**: Cyclic permutations (A→B, B→C, C→A) and reflections (e.g., A↔B) that relabel outcomes. These correspond to rotating or reflecting the triangular frame.
  - **Fine-grained state space**: 12 states, represented as tuples (number of heads, position of the first heads in clockwise order).  
    - States:  
      - (0 heads, —): 1 state (no first heads)  
      - (1 head, corner 1): 1 state  
      - (1 head, corner 2): 1 state  
      - (1 head, corner 3): 1 state  
      - (2 heads, corner 1): 3 states (first heads at corner 1, with the other heads at corner 2, 3, or both)  
      - (2 heads, corner 2): 3 states  
      - (2 heads, corner 3): 3 states  
      - (3 heads, corner 1): 1 state (first heads at corner 1)  
      (Note: For 2+ heads, "first heads" is defined by clockwise order from corner 1.)  

    Full list of 12 states:  
    - (0, —)  
    - (1, 1), (1, 2), (1, 3)  
    - (2, 1) for each pair: {1,2}, {1,3}, {1,2,3}  
    - (2, 2) for {2,1}, {2,3}, {2,1,3}  
    - (2, 3) for {3,1}, {3,2}, {3,1,2}  
    - (3, 1)  

    **Symmetry**: The group of rotations (cyclic shifts of corners: 1→2, 2→3, 3→1) and reflections (e.g., swapping corners 1 and 2) acts transitively on the states. For example:  
    - Rotation maps (1, 1) to (1, 2), (2, 1 with {1,2}) to (2, 2 with {2,3}), etc.  
    - Any state can be mapped to any other by a combination of rotations and reflections.  
    This justifies indifference over the 12 states: each state is equally likely, with probability 1/12.

