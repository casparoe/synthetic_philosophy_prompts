prompt: |-
  I'm a software engineer at a small NGO that tags historical datasets with "why this country got rich" annotations, and our annotators keep guessing. Write me a reusable decision procedue — questions in order, pass/fail rules, and explicit "stop here, it's a judgment call" flags — for deciding whether institutions, geography, or culture is the best-supported cause in a specific case, grounded in the philosphy of causal inference from history (counterfactual dependence, overdetermination, identification problems, etc.). It needs to work for a non-expert in about 15 minutes per country with no library access. Give worked examples for South Korea (probably institutions) and a resource-cursed small state where the answer comes out wrong and we'll hate it. Also cover this weird edge: can a "free-floating rationale" — a reason for growth that no actual policymaker held — ever count? Say exactly where in the procedue it gets included or kicked out. Flag the cases where the checklist just deadlocks and a human has to sign off.
reasoning: |-
  We are building a decision procedure for historical causal annotation of "why this country got rich" with three candidate causes: institutions, geography, or culture. The procedure must be grounded in causal inference concepts (counterfactual dependence, overdetermination, identification problems) but usable by non-experts in 15 minutes without library access.

  The procedure will be a step-by-step questionnaire with pass/fail rules and explicit "stop here" flags. We'll cover:
  1. Counterfactual dependence: Would the outcome (getting rich) have been different if the cause had been absent?
  2. Overdetermination: Are multiple causes sufficient by themselves? How do we break ties?
  3. Identification problems: How do we isolate the effect of one cause from others?

  We also need to handle a "free-floating rationale" (a reason that no actual policymaker held) and specify where it is included or rejected.

  The procedure has three candidate causes:
  - Institutions: Formal and informal rules (property rights, rule of law, governance).
  - Geography: Natural resources, climate, location, disease burden, etc.
  - Culture: Shared beliefs, values, social norms that influence economic behavior.

  **Overall Structure:**
  1. **Establish the outcome:** Define "rich" for the country and time period (e.g., sustained GDP per capita growth over a specific period). The annotator must know the time period of the takeoff.
  2. **Preliminary Screening:** Check for obvious disqualifiers (like war, natural disaster) that might disrupt the causal chain during the critical period.
  3. **Counterfactual Testing for Each Cause:** Ask counterfactual questions for each of the three causes. We are looking for the cause without which the outcome would not have occurred (or would have been substantially different). We must be cautious of overdetermination (multiple causes are present and each alone might have been sufficient?).
  4. **Overdetermination Check:** If multiple causes pass the counterfactual test, then we need a tie-breaker.
  5. **Mechanism and Timing Check:** For the leading cause(s), check if there is a plausible mechanism and whether the timing of cause and effect align.
  6. **Free-Floating Rationale Check:** Explicitly reject rationales that were not held by any policymaker or influential actor at the time? (But note: sometimes a cause might operate without being understood by contemporaries.) We'll have to decide where to include this.
  7. **Deadlock Handling:** When the procedure cannot resolve, flag for human judgment.

  **Detailed Steps:**

  **Step 0: Define the Outcome and Time Period**
  - Ask: When did the country start getting rich? (Identify the takeoff period, e.g., South Korea 1960s-1980s)
  - Define "rich": Sustained increase in GDP per capita? (Annotator must know the basic facts of the growth period.)

  **Step 1: Preliminary Screening (5 minutes)**
  - Was there a major disruptive event (war, revolution, natural disaster) during the takeoff period? 
    - If yes, and it clearly derailed growth, then stop: the cause is "disruption" (not our three). But note: sometimes growth happens despite disruption? So this is tricky. We might say: if the disruption is so severe that growth would have been impossible without it, then we mark as disruption. Otherwise, proceed.
    - If no, proceed.

  **Step 2: Counterfactual Dependence Tests (5 minutes per cause, but we have three so we need to be efficient)**
  We ask for each candidate cause (institutions, geography, culture) a counterfactual: "If [cause] had been worse (or absent) during the takeoff period, would the country still have gotten rich?"

  But note: we cannot run actual counterfactuals. We rely on historical parallels or expert consensus (which the annotator might not have). So we need to simplify.

  We can use proxy questions:

  *Institutions:*
  - During the takeoff period, were there strong property rights, rule of law, and effective government policies that supported investment and innovation? (Yes/No)
  - If the answer is Yes, then ask: If these institutions had been weak (like in a typical failing state), would the growth have happened? (If the annotator thinks "no", then institutions pass the counterfactual test.)

  *Geography:*
  - Did the country have favorable geography during the takeoff period? (e.g., access to sea, natural resources, good climate for agriculture, or absence of disease burdens)
  - If yes, then ask: If the geography had been unfavorable (e.g., landlocked, resource-poor, or disease-ridden), would the growth have happened? (If "no", then geography passes.)

  *Culture:*
  - Was there a cultural trait (e.g., work ethic, trust, openness to innovation) that was prevalent during the takeoff period?
  - If yes, then ask: If the culture had been less conducive (e.g., lacking these traits), would the growth have happened? (If "no", then culture passes.)

  But note: the annotator might not know. We must rely on their knowledge of the country's history.

  **Step 3: Overdetermination Check (3 minutes)**
  - How many causes passed the counterfactual test?
    - If none: then we have a problem. Stop and flag for human judgment (maybe a cause we haven't considered?).
    - If one: then that is the best-supported cause.
    - If two or three: then we have overdetermination. We need a tie-breaker.

  Tie-breaker: Which cause was the most changeable (i.e., which one changed most significantly just before the takeoff)? 
    - Example: If institutions changed dramatically (e.g., a reform) just before growth, but geography and culture were stable, then institutions win.

  If two causes changed (e.g., both institutions and culture changed), then we look for a mechanism that links one cause more directly to the growth. We can ask: "Is there a direct policy or event that triggered growth that was driven by one of these causes?" 

  If still tied, then flag for human judgment.

  **Step 4: Mechanism and Timing Check (for the leading cause) (2 minutes)**
  - For the cause that is leading, is there a clear mechanism by which it caused growth? (e.g., for institutions: property rights -> investment; for geography: a port -> trade; for culture: high savings rate -> capital accumulation)
  - And did the cause precede the effect? (It must have been in place before or during the takeoff.)

  If the mechanism is absent or the timing is wrong (the cause came after the growth started), then we must reconsider. This might lead us to downgrade that cause and re-run the counterfactuals without it? Or flag for judgment.

  **Step 5: Free-Floating Rationale Check**
  - We must reject any rationale that was not present in the minds of the actors (policymakers, influential groups) at the time? Not necessarily. Some causes might operate without being understood (e.g., geography might influence trade patterns even if no one thought about it). 
  - However, for institutions and culture, we require that the institutions were actually in place and the cultural traits were actually prevalent. 
  - The free-floating rationale (e.g., "they had good institutions" but in reality, the institutions were not good and no one was trying to build them) would be rejected in the counterfactual step because the cause wasn't present. So the free-floating rationale would fail the first part of the counterfactual test (the cause must have been present). 
  - Therefore, we don't need a separate step for free-floating rationales. They are weeded out in Step 2 because we ask: "During the takeoff period, was [cause] present?" If not, then that cause fails.

  **Step 6: Deadlock Flags**
  - We flag for human judgment in the following cases:
    - Step 1: Disruption is so severe that it's the primary cause? (But then we mark disruption.)
    - Step 3: No cause passes the counterfactual test.
    - Step 3: Two or three causes pass and the tie-breaker fails.
    - Step 4: The leading cause fails the mechanism or timing check and we cannot determine an alternative.

  **Worked Examples:**

  **Example 1: South Korea (Institutions)**
  - Step 0: Takeoff period: 1960s-1980s.
  - Step 1: No major disruption (Korean War ended in 1953, so before takeoff).
  - Step 2: Counterfactuals:
    - Institutions: Did they have strong institutions? Yes (Park Chung-hee's government directed investment, property rights were secure for businesses). If institutions had been weak (like in North Korea), would growth have happened? No. Pass.
    - Geography: Did they have favorable geography? Yes (peninsula with ports). If they were landlocked and resource-poor? They might have still grown because of institutions? (Annotator might think: Look at Botswana, which is landlocked but grew due to institutions.) So maybe geography doesn't pass? Or it passes? We need to be careful. In this case, the annotator might say: without ports, trade would have been harder, but the government might have overcome that. So the counterfactual for geography might be "maybe" -> we can say "no" to the strict counterfactual (if geography were bad, growth would not have happened) -> so geography fails? But note: the counterfactual test is strict: if without the cause the outcome would not have happened. In South Korea, without ports, they could have relied on air transport? That's hard. Actually, many landlocked countries are poor. So the annotator might say: without the ports, growth would have been much harder -> so geography is necessary? But then we have two necessary causes? 

  We need to break ties. Let's go to Step 3.

  - Step 3: Both institutions and geography pass? Then we use the tie-breaker: which one changed? 
    - Institutions: Park's reforms in the 1960s were a big change.
    - Geography: didn't change. 
    - Culture: might have been present (Confucian work ethic) but didn't change. 
    - So institutions win by tie-breaker.

  Alternatively, we might argue that geography was always there (so it didn't change) and therefore it was a background condition, not the trigger. Then institutions are the trigger.

  - Step 4: Mechanism and timing: The institutional reforms (Five-Year Plans, chaebol system) started in the 1960s and preceded the growth. Mechanism: government-led investment and export promotion. So passes.

  Conclusion: Institutions.

  **Example 2: A Resource-Cursed Small State (e.g., Equatorial Guinea)**
  - Takeoff period: 1990s-2000s due to oil discovery.
  - Step 1: No disruption (but oil discovery is an event).
  - Step 2: Counterfactuals:
    - Institutions: Were they strong? No (dictatorship, corruption). But if they had been strong, would they have grown? Yes, but the question is: if institutions had been weak (which they were) and they grew, then we are asking: if institutions had been strong, would they have grown? That's not the counterfactual we want. We want: without the cause (institutions) would growth have happened? But in this case, they grew with weak institutions because of oil. So institutions: present? Weak, so we can say they were present but bad? We have to reframe: 

  Wait, our counterfactual question for institutions: "If institutions had been weak, would growth have happened?" But in Equatorial Guinea, institutions were weak and growth happened. So the counterfactual: if institutions had been strong, they still would have grown? Even more? That doesn't help. We need to reframe the counterfactual to focus on the absence of the cause we are testing. 

  We are testing if the cause (institutions) was necessary. So for institutions to be necessary: if institutions had been absent (or very bad), growth would not have happened. But in Equatorial Guinea, institutions were bad and growth happened. So institutions were not necessary? So they fail.

  But note: we are testing for the "best-supported cause". The oil (geography) is the obvious cause.

  - Geography: Present? Yes (oil). If there had been no oil, would they have grown? No. So geography passes.
  - Culture: Not particularly conducive? If culture had been worse, would they have grown? Probably yes, because of oil. So culture fails.

  So Step 3: Only geography passes? Then it wins.

  But the problem: Equatorial Guinea did not become a rich country in terms of broad-based development; it had a GDP boom but with extreme inequality and no institutions. So we have to define "rich". If we mean GDP per capita, then it did get rich. But the institutions were bad and the wealth didn't spread. This is the resource curse: geography caused growth, but it didn't lead to development. 

  However, our question is "why this country got rich" (in GDP terms) and the answer is geography (oil). But we might hate it because it's not sustainable and didn't build institutions. But the procedure must reflect the causal inference: without oil, there would have been no boom.

  But note: the procedure might lead to a result we hate because the country is not truly developed? But we are only asked for the cause of the growth in the takeoff period.

  **Free-Floating Rationale Example:**
  Suppose someone argues that Botswana grew because of its culture (tradition of consensus-building) but in fact, the policymakers were actually motivated by diamond revenues (geography) and set up good institutions. The free-floating rationale (culture) would be tested:
  - Step 2: Culture: Was there a culture of consensus-building? Yes. If it had been absent, would growth have happened? Maybe not? But then we must check the mechanism. However, if the consensus-building culture was present but not the driver (because the policymakers were driven by diamond revenues and set up institutions), then the counterfactual might be: without the culture, would they have still set up good institutions? Maybe yes, because of the diamonds? So culture fails the counterfactual? 

  But note: the free-floating rationale is not about the cause being absent in reality, but about it not being a motive. We don't require the cause to be a motive? We require it to be present and necessary. So if the culture was present and necessary for the institutions to work, then it counts. But if the culture was present but not necessary (because the institutions could have worked without it) then it fails.

  **Revised Counterfactual Questions for Clarity:**
  For each cause, we ask two questions:
  1. **Presence:** Was the cause present in a form that could promote growth? 
     - For institutions: were they good? 
     - For geography: was it favorable? 
     - For culture: was it conducive?
  2. **Necessity:** If the cause had been absent (or unfavorable), would the country have still gotten rich? (If no, then the cause is necessary.)

  If a cause is present and necessary, it passes.

  **Final Procedure:**

  **Decision Procedure: Why Did This Country Get Rich? (15 minutes)**

  **Step 0: Set Up (1 min)**
  - Identify the country and the takeoff period (years of sustained GDP per capita growth).
  - Define "rich": We mean the start of sustained economic growth (takeoff) in GDP per capita during that period.

  **Step 1: Disruption Check (1 min)**
  - Was there a major disruptive event (war, revolution, natural disaster) during the takeoff period that was the primary reason for growth? (e.g., post-war rebuilding boom)
    - If yes, and without the disruption the growth would not have occurred, then mark: **Disruption** and stop.
    - If no, proceed.

  **Step 2: Counterfactual Tests (6 min)**
  *Ask the following for each cause (institutions, geography, culture):*

  **Institutions:**
  1. *Presence:* During the takeoff period, were institutions (property rights, rule of law, government effectiveness) generally good? (Yes/No)
  2. *Necessity:* If institutions had been bad (like in a typical failing state), would the country still have gotten rich? (Yes/No)
     - If Presence=Yes and Necessity=No, then institutions pass.

  **Geography:**
  1. *Presence:* During the takeoff period, did the country have favorable geography (e.g., access to sea, valuable natural resources, good climate, absence of disease)? (Yes/No)
  2. *Necessity:* If the geography had been unfavorable (e.g., landlocked, resource-poor, disease-ridden), would the country still have gotten rich? (Yes/No)
     - If Presence=Yes and Necessity=No, then geography passes.

  **Culture:**
  1. *Presence:* During the takeoff period, was there a cultural trait (e.g., work ethic, trust, innovation-friendliness) that was widespread and conducive to growth? (Yes/No)
  2. *Necessity:* If that trait had been absent (or the culture had been unconducive), would the country still have gotten rich? (Yes/No)
     - If Presence=Yes and Necessity=No, then culture passes.

  **Step 3: Overdetermination and Tie-Breaking (3 min)**
  - Count how many causes passed (0,1,2,3).
    - If 0: Flag for **human judgment** (no cause identified).
    - If 1: That cause is the winner. Proceed to Step 4.
    - If 2 or 3: 
      - Which cause changed the most just before the takeoff? (e.g., a reform for institutions, a discovery for geography, a cultural shift? If one changed more, that wins.)
      - If none changed (or all changed), then which cause has the most direct mechanism? (e.g., a policy change for institutions, a resource boom for geography, a cultural movement for culture? If one is more direct, that wins.)
      - If still tied, flag for **human judgment**.

  **Step 4: Mechanism and Timing Check (3 min)**
  - For the winning cause from Step 3:
    - Is there a clear mechanism (causal chain) by which this cause led to growth? (e.g., good institutions -> investment -> growth)
    - Did the cause (or the change in the cause) happen before the takeoff?
      - If both are yes, then confirm the cause.
      - If no, then reconsider: does another cause now pass? If not, flag for **human judgment**.

  **Step 5: Final Output**
  - If not flagged, output the cause (Institutions, Geography, or Culture).
  - If flagged in any step, output **Flagged for human judgment**.

  **Free-Floating Rationale Note:** 
  - The free-floating rationale (a cause that wasn't actually present) will be rejected in Step 2 (Presence question) because we require the cause to be present. So if a rationale is free-floating (not actually present), it fails at Presence.

  **Worked Example: South Korea**
  - Step 0: Takeoff: 1960s-1980s.
  - Step 1: No disruption.
  - Step 2:
    - Institutions: Presence=Yes (reforms in 1960s). Necessity: If bad, would growth have happened? No -> Pass.
    - Geography: Presence=Yes (ports, etc.). Necessity: If landlocked and resource-poor? Maybe growth would have been harder but still possible? (Annotator might say: without ports, they couldn't have exported -> so no.) -> Pass? 
    - Culture: Presence=Yes (Confucian work ethic). Necessity: If absent? Maybe growth would still have happened with good institutions? -> Fail.
  - Step 3: Two passes (institutions and geography). 
    - Which changed? Institutions changed (reforms). Geography didn't change. -> Institutions win.
  - Step 4: Mechanism: institutions led to investment in export industries. Timing: reforms in 1960s before growth. -> Confirm **Institutions**.

  **Worked Example: Equatorial Guinea**
  - Step 0: Takeoff: 1990s-2000s (oil boom).
  - Step 1: No disruption (but oil discovery).
  - Step 2:
    - Institutions: Presence? No (weak, corrupt). So fail.
    - Geography: Presence? Yes (oil). Necessity: If no oil? Then no growth. -> Pass.
    - Culture: Presence? Not particularly. Fail.
  - Step 3: Only geography passes -> wins.
  - Step 4: Mechanism: oil extraction -> exports -> GDP growth. Timing: oil discovered in 1990s, then growth. -> Confirm **Geography**.

  We hate it because it's not sustainable and didn't lead to development, but the procedure gives geography.

  **Edge: Free-Floating Rationale**
  Example: "Mongolia grew because of its democratic institutions" (but in reality, they have democracy but growth was driven by mining). 
  - In Step 2 for institutions: 
    - Presence: Yes (democracy). 
    - Necessity: If institutions had been bad, would growth have happened? Yes, because of mining. So institutions fail. 
  - The free-floating rationale (democracy as the cause) is rejected because it fails the necessity test even though present.

  **Conclusion:**
  This procedure should be reusable and cover the main causal inference concepts. It flags when human judgment is needed.
answer: |-
  Below is a reusable 15-minute decision procedure for your NGO's historical annotations, grounded in causal inference principles (counterfactual dependence, overdetermination, and identification problems). It includes explicit pass/fail rules, "judgment call" flags, and handles edge cases like "free-floating rationales." The procedure is designed for non-experts with no library access.

  ---

  ### **Decision Procedure: Why Did This Country Get Rich?**  
  **Time:** 15 minutes per country  
  **Inputs:** Basic historical knowledge of the country (annotator must know key events, policies, geography, and cultural traits during the growth period).  
  **Output:** Best-supported cause (Institutions, Geography, Culture) or "Judgment Call Needed."  

  ---

  #### **Step 1: Define Growth Period and Baseline (1 min)**  
  **Question:** *When did sustained per-capita GDP growth start (e.g., >3% for ≥10 years)?*  
  - **Pass:** Specific timeframe identified (e.g., "South Korea: 1965–1995").  
  - **Fail/Flag:** No clear growth period → **Stop. Flag for human judgment.**  
  - *Why?* Ensures we isolate the causal window. Without this, counterfactuals fail.  

  ---

  #### **Step 2: Eliminate Non-Candidate Causes (2 min)**  
  **Questions:**  
  1. *Was growth primarily driven by* external aid/war recovery *(e.g., post-WWII Marshall Plan)?*  
  2. *Was growth* purely resource-driven *with no institutional development (e.g., oil boom with no broad-based economy)?*  
  - **Pass:** Both answered "no." Proceed to Step 3.  
  - **Fail:** Either "yes" → **Stop. Label as "External Aid" or "Resource Windfall"** (not core candidates).  
  - *Why?* Rules out spurious causes violating *causal identification* (e.g., aid masks institutional effects).  

  ---

  #### **Step 3: Counterfactual Dependence Test (6 min)**  
  **Rule:** A cause passes if its **absence** in the growth period would likely have **prevented/reversed** growth (counterfactual dependence). Assess all three:  
  **Institutions (I):** Formal rules (property rights, rule of law, state capacity).  
  **Geography (G):** Location, resources, disease, climate.  
  **Culture (C):** Beliefs/norms affecting work, trust, or innovation.  

  **Questions for each cause:**  
  - *"If [cause] had been* **typical of a failed state** *during the growth period, would growth still have occurred?"*  
    - **Fail (cause supported):** "No" (absence would derail growth).  
    - **Pass (cause rejected):** "Yes" (growth likely anyway).  
  - **Judgment Flag:** Uncertainty or conflicting evidence → **Mark cause as "Ambiguous."**  

  **Overdetermination Check:**  
  - If **≥2 causes fail** (i.e., all seem necessary), proceed to Step 4.  
  - If **all 3 pass** (no cause necessary) → **Stop. Flag for judgment** (identification problem).  
  - If **1 cause fails** (others pass), it wins → Skip to Step 5.  

  ---

  #### **Step 4: Overdetermination Tiebreaker (3 min)**  
  **Rule:** Break ties by testing **which cause changed most decisively** just before growth (solves overdetermination via temporal precedence).  

  **Question:** *Which cause shifted most sharply from "weak" to "strong"* **within 20 years pre-growth**?  
  - **I win if:** Institutional reforms (e.g., new constitution, market liberalization).  
  - **G win if:** Geographic change (e.g., resource discovery, trade route opening).  
  - **C win if:** Cultural shift (e.g., religious reformation, mass education).  
  - **Tie:** ≥2 causes changed equally → **Stop. Flag for judgment.**  
  - **No change:** All stable → Revert to **which cause is most "indispensable"** (if still unclear → **Flag**).  

  ---

  #### **Step 5: Mechanism & Free-Floating Rationale Check (3 min)**  
  **Rule:** Verify the winning cause has a **plausible causal mechanism** and **reject free-floating rationales**.  

  **Questions:**  
  1. *Is there evidence that* **actual actors** *(leaders, groups) leveraged this cause during growth?*  
     - E.g., Policies for institutions, trade for geography, education for culture.  
  2. *Could growth occur via this cause* **without contemporary awareness**? (e.g., geography enabling trade unknowingly).  
     - **Free-floating rationale** (FFR): *A growth reason no actor believed or used*.  

  **Decision:**  
  - If **FFR suspected** (e.g., "Culture caused growth, but no one invoked it") → **Reject FFR** and downgrade cause.  
    - *Why?* FFRs violate *causal identification*—no evidence they operated historically.  
  - If mechanism is **actor-driven** (or geography’s **passive role**) → **Confirm cause**.  
  - If mechanism **absent** or **FFR primary** → Revert to runner-up cause or **Flag for judgment**.  

  ---

  ### **Worked Examples**  
  #### **South Korea (Institutions Win)**  
  - **Step 1:** Growth period = 1965–1995 (pass).  
  - **Step 2:** No external aid/resource windfall (pass).  
  - **Step 3:**  
    - **I:** *If institutions weak (e.g., like North Korea)?* Growth fails (dictatorship enabled export-industrial policy). → **Fail → Supported.**  
    - **G:** *If geography poor (landlocked, no ports)?* Growth still possible (e.g., Singapore overcame size). → **Pass → Rejected.**  
    - **C:** *If culture individualist (not collectivist)?* Growth likely (Confucianism helped but wasn’t decisive). → **Pass → Rejected.**  
    - Institutions win → Skip to Step 5.  
  - **Step 5:** Mechanism = Park Chung-hee’s policies (actor-driven). No FFR → **Confirm Institutions.**  

  #### **Equatorial Guinea (Geography Wins—But We’ll Hate It)**  
  - **Step 1:** Growth period = 1995–2010 (oil boom; pass).  
  - **Step 2:** Not external aid, but resource-driven → **Fail?** Wait: Step 2 excludes *only if* no institutional development. Here, institutions worsened → **Pass to Step 3.**  
  - **Step 3:**  
    - **I:** *If institutions strong?* Growth still occurs (oil found regardless). → **Pass → Rejected.**  
    - **G:** *If no oil?* No growth (economy was agrarian). → **Fail → Supported.**  
    - **C:** *If culture less entrepreneurial?* Growth likely (oil dominates). → **Pass → Rejected.**  
    - Geography wins → Skip to Step 5.  
  - **Step 5:** Mechanism = Oil extraction (actor-aware). No FFR → **Confirm Geography.**  
    - *Why we hate it:* Geography "wins" despite causing inequality, instability, and institutional decay (resource curse). But the procedure validly isolates it as the counterfactually necessary cause.  

  ---

  ### **Edge Case: Free-Floating Rationale (FFR)**  
  - **When checked:** Step 5 (Mechanism & FFR Check).  
  - **How handled:**  
    - FFRs (e.g., "Botswana grew due to democratic culture, but no leaders cited this") are **rejected** unless they can operate passively (geography can; institutions/culture cannot).  
    - Example: If annotator argues "Mongolia grew due to innate nomadic innovation (culture)" but cites no education/trade policies → **Reject culture** (FFR) and flag if no alternative.  

  ---

  ### **Judgment Call Flags**  
  Flag for human review when:  
  1. **Step 1:** No clear growth period.  
  2. **Step 3:** All causes pass (no counterfactual dependence) or unresolved ambiguity.  
  3. **Step 4:** Tie in overdetermination (e.g., institutions AND geography changed simultaneously).  
  4. **Step 5:** Suspected FFR with no backup or mechanism failure.  

  ---

  ### **Procedure Summary**  
  ```mermaid
  graph TD
      A[Step 1: Growth Period?] -->|Fail| J[Judgment Call]
      A -->|Pass| B[Step 2: Non-Candidates?]
      B -->|Fail| NON[External/Resource]
      B -->|Pass| C[Step 3: Counterfactuals]
      C -->|1 Cause Wins| E[Step 5: Mechanism/FFR]
      C -->|0 Causes| J
      C -->|≥2 Causes| D[Step 4: Tiebreaker]
      D -->|Tie| J
      D -->|Winner| E
      E -->|FFR/No Mechanism| J
      E -->|Valid| WINNER[Institutions/Geography/Culture]
  ```

  This procedure prioritizes causal rigor while respecting real-world constraints. For contentious cases (e.g., culture vs. institutions), flags ensure accountability. South Korea exemplifies clean resolution; Equatorial Guinea shows geography "winning" despite moral dissatisfaction—highlighting the procedure's counterfactual neutrality.
