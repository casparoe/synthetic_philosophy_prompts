  4. If branch A (likely): Award the points (100 if policy was Pay, else 0). Then move to debrief. (But this is anticlimactic if branch A occurs.)

     If branch B (unlikely): Proceed to step 5.

     We want branch B to occur to have the conflict. To ensure branch B occurs at least once, we can have multiple rounds or rig the draw. But rigging might be unethical. Alternatively, we can use a single draw and if branch A occurs, we can still have a discussion by saying "Suppose we had drawn branch B, what would you have done?" But that is not experiential.

     Given the low probability, we can prepare in advance a fixed outcome for branch B. Since the user wants to avoid actual money and it's for educational purposes, we can secretly set the draw to branch B. Or we can use a random device that we control.

     Alternatively, we can use a probability that is not so low, say 50% to increase the chance of branch B. But then the ex ante EU is:

          Policy Pay: 0.5 * 100 + 0.5 * (-10) = 50 - 5 = 45.
          Policy Not Pay: 0.5 * 0 + 0.5 * 0 = 0.

     Still, Pay is better. And branch B will occur half the time.

     So let's set the probability of branch B to 50% to have a reasonable chance of it occurring.

     Alternatively, to keep the 1% but ensure the activity works, we can have the class participate in multiple independent games. For example, with 14 students, we can have 7 pairs, each doing the activity. Then the chance that at least one game lands on branch B is 1 - (0.99)^7 ≈ 7*0.01 = 7% (actually about 6.8%), which is still low. With 50% for B, it would be likely that several are in B.

     Given time, we can do one or two rounds with the whole class as one agent, and set the probability to 50% for illustration.

     I suggest setting the probability of branch B to 20% or 50% to make it more likely to occur.

     Let's choose 80% for A and 20% for B.

     Then:

          Policy Pay: 0.8 * 100 + 0.2 * (-10) = 80 - 2 = 78.
          Policy Not Pay: 0.

     Still, Pay is better.

  5. If branch B is drawn (20% chance), then the instructor explains that each student must now choose, in private, whether to Pay or Not Pay. They are told that their choice only affects their own payoff in branch B: if they Pay, they lose 10 points; if not, they lose nothing. They also know that the branch A payoff is fixed by the policy and is not awarded. (10 minutes for decision and collection)

  6. After collecting the actions, the instructor tallies how many paid. (5 minutes)

  7. Then, the debrief: (50 minutes)

     - First, ask the students in branch B to reflect: Why did they choose as they did? (They will say: because paying costs me and doesn't benefit me or anyone else.)

     - Then, remind them of the ex ante perspective: the policy of Pay had an expected value of 78 points, while Not Pay had 0. But when branch B occurred, they abandoned the policy.

     - Explain that updateless decision theory says that they should follow the policy even after learning the branch. The policy was chosen to maximize expected utility from the initial standpoint, and learning that you are in branch B is just part of the information that the policy already accounted for.

     - Address the features:

          - The policy is a function of the evidence: it says what to do in branch B. The updateless agent does not ignore the evidence; it uses the evidence to select the action specified by the policy.

          - The initial standpoint: it is the standpoint before the branch is known. For an agent that was never behind a veil, we can think of it as the standpoint at a time when the agent had not yet received the information about the branch.

          - The conflict: After the update, the action specified by the policy (Pay in branch B) now seems dominated. But UDT says that dominance reasoning after the update is not valid because it conditions on information that is not causally independent of the choice of policy.

     - Objection: The connection between the policy choice and the branch A payoff is evidential or logical, not causal. But in this staging, it is causal: the policy choice caused the branch A payoff to be set. However, in the original UDT thought experiments, the connection is often logical (like in the absent-minded driver or the Parfit's hitchhiker). We have to admit that the activity uses a causal connection (the policy choice sets the box) and not a logical one. For a logical connection, we would need a scenario where the fact that the agent would pay in branch B is a logical truth that determines the payoff in branch A. We cannot stage that easily. So we will have to explain that in the next phase.

  8. Closing phase (10 minutes): Replace the chancy device with a mathematical proposition.

     - Present a mathematical conjecture that is unresolved and not known to the students. For example, the Collatz conjecture or a difficult integral. Say that:

          - Branch A is if the conjecture is true.
          - Branch B is if the conjecture is false.

          - The payoff in branch A is 100 if the agent would pay in branch B, else 0.
          - In branch B, if the agent pays, they lose 10 points; if not, 0.

     - However, the students don't know which branch they are in.

     - Ask: What policy should they choose? The updateless view says to choose the policy that maximizes expected utility over the two branches. But now the probability is not known. They might use a principle of indifference or their prior beliefs.

     - But the key point: even if they knew which branch they were in, should they follow the policy? In branch B, they would be tempted not to pay. But UDT says to follow the policy chosen ex ante.

     - Note that in this case, the connection is logical: the truth of the conjecture is a fact, and the policy for branch B is also a fact. The payoff in branch A depends on the latter fact.

     - What changes: the branch is not determined by chance but by a mathematical fact. The agent's action in branch B does not cause the conjecture to be true or false, so the connection is not causal but logical. This is closer to the intended UDT setup.

     - However, the activity cannot be staged in real time because we don't know the branch. So it is a thought experiment.

     - Ask the students: Does the case still go through? What if the conjecture is false and they are in branch B? Should they pay? The updateless view says yes if the policy said so, because that is what secures the payoff in branch A (if the conjecture were true).

     - The challenge: In the mathematical case, the initial standpoint is not in time but in logical priority. UDT treats the agent as a logical entity whose actions are determined by a policy that is evaluated from a standpoint that does not condition on the information that the agent might receive.

  9. Wrap-up (5 minutes): Summarize the disagreement as about the scoring standpoint: before vs after the update.

  **What will go wrong the first time:**

  - If branch A is drawn, then the activity is anticlimactic. The students get their payoff and don't experience branch B. To mitigate, we can conduct multiple rounds (with the same policy) or use a rigged draw for educational purposes. Alternatively, have the students also consider what they would have done in branch B.

  - In branch B, if the students are asked to choose individually, they might coordinate to all pay. But this is unlikely because each has an incentive to free-ride. If they do coordinate, then they will all pay and incur the loss. Then we can discuss: why did you pay? They might say: to be consistent with the policy. Then we can point out that the policy was not binding, but they followed it anyway. Then we can ask: would you have followed it if others might not? This complicates the lesson.

  - Time: The branch drawing and action collection might take more time than expected.

  - The representative objection: The activity uses a causal connection (the policy sets the box) but UDT often deals with logical connections. We admit this and then use the mathematical phase to address it.

  **Final design summary:**

  - Use a whole-class approach with one agent.

  - Probability: set branch B to 20% to increase chance of occurrence.

  - Policy vote for branch B: Pay or Not Pay.

  - Branch drawn randomly.

  - If branch A: award payoff based on policy.

  - If branch B: each student chooses individually to Pay or Not Pay in branch B, affecting only their own payoff in branch B.

  - Debrief: contrast ex ante and ex post perspectives.

  - Mathematical phase: replace chance with a mathematical unknown.

  This design should achieve the user's goals.
answer: |-
  To stage the updateless decision theory scenario effectively within ninety minutes using inexpensive stakes like course points, we need a design that forces students to confront the tension between ex ante policy commitment and ex post action choice after learning which branch they are in, without relying on a predictor whose reliability becomes a distraction. The core challenge is creating a situation where students choose a policy before knowing which branch they will occupy, then learn the branch, and must decide whether to follow the policy in the improbable branch where compliance is costly. The activity must make the updateless recommendation feel compelling ex ante but counterintuitive ex post, while ensuring that the conflict arises from their choices rather than your explanations. Here’s how to implement it.

  Begin by preparing two sealed envelopes in advance, one labeled "Branch A" and the other "Branch B," with a random device determining their contents just before the session—e.g., a 100-sided die roll where 1–80 corresponds to Branch A and 81–100 to Branch B, making Branch A probable (80%) and Branch B improbable (20%). The higher probability for Branch B than in your sketch ensures it occurs often enough to be experienced (about one in five times), avoiding the anticlimax of always landing in Branch A. Inside each envelope, place a card clearly stating the branch and the payoff rules. Use course points as stakes, with Branch A offering a gain (e.g., +10 points) and Branch B imposing a cost (e.g., -2 points) for specific actions, scaling to be meaningful but not punitive. Also, prepare a simple filler task, such as solving a non-moral puzzle, to occupy students briefly between decisions.

  Start the session by framing the activity as a decision problem with two branches. Explain that they will act as a single collective agent. In Branch A (80% chance), they gain +10 points if their pre-commitment to "Pay" in Branch B was made; if they committed to "Not Pay," they get 0. In Branch B (20% chance), they face a choice: if they "Pay," they lose 2 points each; if they "Not Pay," they lose nothing. Emphasize that the Branch A payoff depends only on their pre-commitment to the Branch B action, not on what they later do in Branch B. Stress that after the branch is revealed, they will choose actions individually to ensure personal stakes make the cost salient. The entire activity must be completed in forty minutes to leave ample debrief time.

  First, conduct the ex ante policy choice. Have the class discuss and vote on whether to pre-commit to "Pay" or "Not Pay" in Branch B. From the initial standpoint, the expected utility favors "Pay": 80% chance of +10 points and 20% chance of -2 points averages to +7.6 points, while "Not Pay" yields 0 (+0 from Branch A and no loss in Branch B). Students will likely choose "Pay" for its higher expected value. Record this policy publicly. Next, introduce the filler task (e.g., a five-minute logic puzzle) to create psychological distance, simulating a temporal gap between policy setting and branch revelation.

  After the filler, reveal the branch by opening the pre-sealed envelope corresponding to the die roll. If Branch A is drawn (as is likely), award +10 points to everyone if they committed to "Pay," or 0 if "Not Pay," and then skip to the debrief. But when Branch B occurs (as it will occasionally), announce that each student must now privately decide whether to "Pay" or "Not Pay" in Branch B. Remind them that: (1) the Branch A payoff is already fixed by their pre-commitment and will not be awarded (since they are in Branch B), and (2) their personal choice affects only their own points in Branch B (paying costs -2 points; not paying costs 0). Collect their anonymous choices via slips of paper. Students will almost universally choose "Not Pay" to avoid the loss, as there is no apparent benefit to paying now. Tally and reveal that most defected from the policy. Award points accordingly: no one loses points in this branch because they avoided payment. Crucially, note how appealing the policy was ex ante yet how easily it was abandoned ex post.

  For the debrief (fifty minutes), structure it around specific moments in the activity. Start by asking: "When you voted for 'Pay' initially, what were you thinking?" They will cite the high expected value. Then, after branch revelation, ask: "Why did you abandon 'Pay' in Branch B?" They will say learning they were in the costly branch made payment seem pointless. Map this to the decision theory concepts: the ex ante standpoint treated the policy as a function from possible observations (which branch) to actions, scored before any observation. The update (learning Branch B) did not provide new information about the policy's ex ante optimality—it simply placed them in the part of the policy where action is costly. Emphasize that the updateless agent uses the evidence (the branch) to execute the policy, not to reopen it; it is not ignoring evidence. Highlight that their collective defection in Branch B, while individually rational post-update, sacrificed the ex ante value they all agreed on.

  Then, address the inevitable objection that the connection between the Branch B action and Branch A payoff is merely evidential or statistical (based on their pre-commitment setting the payoff) rather than logical or counterfactual as in pure UDT thought experiments. Acknowledge this candidly: the activity uses a causal mechanism (their vote caused the Branch A payoff rule) for practical staging, whereas UDT often imagines logical dependencies (e.g., a mathematical fact linking branches). Explain that the activity cannot replicate timeless or logical dependence but approximates the conflict between scoring standpoints. Concede that in the original UDT formulation, the policy's optimality derives from abstract reasoning about all possible branches, not a physical commitment. This honesty preempts distraction and sets up the closing phase.

  In the last ten minutes, replace the chancy branch with an unsolved mathematical proposition, like the Collatz conjecture. Define Branch A as "the conjecture is true" and Branch B as "it is false." The payoff rules mirror the activity: Branch A yields +10 points if the agent would pay in Branch B, else 0; Branch B costs -2 points to pay. Ask: "Should you pre-commit to 'Pay' in Branch B? If you later discover you are in Branch B, should you still pay?" They will recognize that the ex ante expected utility still favors commitment, but upon learning Branch B, paying feels irrational. Discuss what changes: the branch is now a logical fact, not chance, so the initial standpoint is not temporal but a "view from nowhere" where the agent treats their actions as fixed functions of evidence. The conflict persists—UDT insists on following the policy, while updated views defect. This shift to logic underscores that the core disagreement is about the scoring standpoint (initial vs. current), not evidence use.

  Anticipate two main hiccups. First, if Branch A is drawn, students miss the tension. Mitigate this by discussing the Branch B counterfactual: "What would you have done if Branch B occurred?" and stress that the policy's ex ante appeal is the point. Second, in Branch B, students might coordinate to all pay to "honor the policy," but this is unlikely given individual incentives. If it happens, probe their reasoning: "Why pay when it costs you and doesn't help?" This still reveals the tension, as they are acting against individual interest. If they coordinate, note how real-world defection pressures make updatelessness hard to sustain. Throughout, keep the pace brisk to fit in ninety minutes. The design ensures that students experience the updateless-updateful clash through their choices, setting up your debrief to generalize it as a live philosophical disagreement.
