prompt: |-
  I'm on the acqusitions committee for our small university museum and we vote thursday on whether to put a donated ceramic vessel in the permanent exihbit. The only provenance is a 1923 dealer letter our conservator suspects is forged, and the object was bought on the open market in 1960 with zero excavation record. Draft the memo I'll circulate: recommend accept, reject, or display with conditions and a concrete timeline, and lay it out in exactly five numbered points, each just a sentence or two with no intro or conclusion. Treat the problem the way Herodotus and Thucydides had to — weighing direct material traces against secondhand testimony, spotting circular corroboration, and remembering that silence isn't confirmation — but don't ask for citations or a bibliography. Give a clear recommendation with reasoning and an honest nod to the best argument on the other side, since we need something we can vote on.
reasoning: |-
  Okay, the user is on the acquisitions committee for a small university museum and needs to draft a memo about a donated ceramic vessel. They're voting Thursday, so time is tight. The main issue is provenance: the only documentation is a 1923 dealer letter that might be forged, and it was bought in 1960 with no excavation records. They want a concise memo in exactly five numbered points, no fluff, drawing from historical methods like Herodotus and Thucydides—focusing on weighing evidence, avoiding circular logic, and understanding that absence of evidence isn't proof. 

  The user is likely a curator or committee member who values intellectual rigor and ethical standards. They need a clear recommendation—accept, reject, or display with conditions—that's defensible for a vote. Their deeper need might be balancing the museum's mission (education, preserving artifacts) with risks like legitimacy or legal issues. Unspoken, they might fear reputational damage if the artifact turns out fake or looted.

  I'm considering the recommendation: rejecting outright seems too harsh given the potential value, but accepting could be unethical. Displaying with conditions—like labeling it as "provenance unknown" and setting a research timeline—strikes a balance. It educates the public while being honest. Referencing Herodotus/Thucydides adds scholarly weight: Herodotus used secondhand accounts critically, Thucydides valued direct evidence. Here, the dealer letter is weak "testimony," and no excavation record is "silence"—which doesn't confirm legitimacy. 

  Structuring the memo: Five points, no intro/conclusion. Point 1 states the problem neutrally. Point 2 gives the other side's best argument (it's tangible, might be rare). Point 3 counters with the evidence gaps. Point 4 recommends conditional display with a timeline. Point 5 addresses the "silence isn't confirmation" principle. 

  This approach is honest, actionable, and aligns with historiography. It shows due diligence without overcomplicating.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions Committee  
  **SUBJECT:** Recommendation on Donated Ceramic Vessel  

  1.  **Problem:** The vessel's sole provenance is a 1923 dealer letter (suspected forged by Conservation) and a 1960 open-market purchase lacking excavation records, creating significant authenticity and ethical uncertainty.  
  2.  **Best Argument for Acceptance:** The object itself is a tangible material trace potentially valuable for study or display, and absence of contradictory evidence does not definitively prove illegitimacy.  
  3.  **Core Weakness:** Relying solely on the dealer letter constitutes uncorroborated, potentially fabricated secondhand testimony; its link to the 1960 purchase creates circularity, not independent verification.  
  4.  **Recommendation with Conditions:** **Reject permanent accession**; display temporarily *only* with explicit labeling as "Provenance Unknown, Under Ongoing Research" and a strict **18-month deadline** for rigorous, independent technical analysis and provenance research to locate corroborating evidence.  
  5.  **Reasoning:** Following Thucydides’ emphasis on direct evidence over uncritical testimony and Herodotus’ caution regarding gaps in the record, permanent exhibit status requires stronger material/documentary foundations; silence in the excavation record is not confirmation of legitimacy.
