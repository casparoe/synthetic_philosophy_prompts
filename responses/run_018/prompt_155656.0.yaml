  For Must-haves, I consider key requirements. The framework must distinguish timeline vs core mechanism errors (like Malthus). It should account for countervailing forces (e.g., Green Revolution delaying food collapse). Precision in defining the failure point is crucial—was it the mechanism or just timing? Also, adaptability to new evidence (like climate models updating with fresh data) and avoiding unfalsifiability (no moving goalposts indefinitely). 

  The tension between "Precision" and "Adaptability" is key. Being too precise might reject adaptable theories, while too much adaptability risks unfalsifiability. That conflict needs highlighting.

  In Hard vs Soft, non-negotiables include distinguishing mechanism/timeline and avoiding unfalsifiability. These are essential for scientific integrity. Soft aspects might be how much countervailing force evidence is needed or the adaptability level.

  For the Scorecard, I evaluate three approaches: strict falsification (ditch if wrong), core protection (defend the theory), and mechanism-first (salvage the core idea). Each is assessed against the must-haves. The strict view fails on distinguishing mechanism/timeline and countervailing forces. Core protection risks unfalsifiability. Mechanism-first balances best but struggles with precision.

  The Killer requirement is avoiding unfalsifiability. It eliminates approaches that endlessly shift predictions, which is common in protected core programs. This makes it the most critical filter.

  I'll apply examples throughout: Malthus for historical context, AI compute hitting energy limits as a future scenario, and climate tipping points for slow-developing risks. This keeps it concrete as requested.

