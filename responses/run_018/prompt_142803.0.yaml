  Okay, the user presents a complex philosophical problem about material constitution, specifically the statue and clay paradox, with clear demands for criteria that any viable theory must satisfy. They've outlined three key challenges: spatial coincidence without identity, destruction asymmetries (in both directions), and accounting for "negative parts" like holes. 

  The user seems intellectually engaged—this isn't a casual query but a continuation of a heated debate. Their phrasing ("actual desiderata," "hard constraint vs prejudice") suggests they want rigor, not textbook summaries. They're likely frustrated with theories that dodge the paradox by relabeling it. The demand for continuous prose (no formatting) implies practical constraints—maybe pasting into a plaintext editor or email.

  Breaking down their asks:
  First criterion: Spatial coincidence without total identity. Motivating case is the statue/clay itself—same space, different properties (clay survives flattening, statue doesn't). This is non-negotiable; denying it collapses to identity theory, which fails destruction cases.  

  Second criterion: Bidirectional destruction asymmetries. Two subcases: (1) Statue smashed but clay survives (common), AND (2) Clay replaced molecule-by-molecule with synthetic mimic while statue persists (less discussed but crucial). The latter exposes that persistence conditions differ: statue depends on form/function, clay on material history. Both must be explainable without contradiction.  

  Third criterion: Negative parts (holes). A drilled hole belongs to the statue's form but not the clay lump. Tests whether form is ontologically significant or just a manner of speaking. Often overlooked but vital for art conservation cases (e.g., restoring a sculpture with missing fragments—is the hole part of the work?).  

  The trio test: Can temporary coincidence (objects coincide only when statue-shaped), essential form (statuehood requires specific arrangement), and no overpopulation (avoiding too many entities) coexist? User suspects inconsistency—rightly so. If form is essential and temporary, you get distinct coinciding objects (statue + clay), risking overpopulation. But denying temporary coincidence forces permanent identity or eternal separation, both implausible.  

  Where major theories fail:  
  - Mereological essentialism (parts essential) fails destruction asymmetries—if statue is just parts arranged statue-wise, replacing parts destroys it.  
  - Constitution view (statue and clay distinct but coinciding) handles coincidence but struggles with overpopulation—why two things here, not one? Also vague on when constitution begins/ends.  
  - Hylomorphism (form + matter) has promise but must clarify if form is a literal entity (risking overpopulation) or a mode of organization.  

  The core tension: Coincidence without identity implies multiple entities occupying the same space. But then overpopulation looms ("why say two things exist here?"). Yet denying multiplicity forces us to ignore destruction asymmetries. Any solution must either bite the bullet on overpopulation or show it's benign.  

  User's deeper need: They want the philosophical "rules of the game" laid bare to evaluate theories impartially. Not just "what does Aristotle say," but "what must any theory do to count as a solution?" That’s meta-philosophically sophisticated. I’ll structure the response as a smooth narrative, weaving criteria together while highlighting trade-offs, like why the trio (temporary coincidence, essential form, no overpopulation) might be incompatible—if form is essential and temporary, you need distinct entities, contradicting no overpopulation.
answer: |-
  Okay, let's lay out the core demands any serious theory of material constitution needs to grapple with, based on the statue-and-clay puzzle and its kin. Forget just renaming the problem; these are the hurdles it genuinely needs to clear, with the reasoning behind each. I'll walk through them as you asked, flagging the motivations, the constraints, and the tricky tensions.

  First, the non-negotiable starting point is **spatial coincidence without numerical identity**. The motivating case is the core scenario itself: the statue and the lump of clay occupy exactly the same space at time T (when shaped), yet they seem to have different properties. The statue *cannot* survive being flattened into a pancake, while the lump of clay *can*. If they were literally identical – just one thing – this difference in modal properties (what *could* happen to them) would be impossible. This isn't just a preference of one camp; denying this difference leads straight into contradiction. A theory insisting they *are* identical must then explain away the destruction asymmetry as an illusion, which is a major burden. So, this is a hard constraint: the theory *must* allow two distinct things to be in the same place at the same time.

  Which brings us to the second major demand: **accounting for destruction asymmetries, bidirectionally**. The first asymmetry is the classic one: **the statue can be destroyed (e.g., smashed) while the lump persists.** The motivating case is clear: smash the statue – the artistic entity is gone, but the scattered clay still exists. The theory must explain why the statue ceases to be, but the lump doesn't, despite their prior coincidence. The reverse asymmetry is equally crucial and often more revealing: **the lump can be destroyed while the statue apparently persists.** Your synthetic polymer replacement case is perfect here. Imagine meticulously replacing every single clay molecule, one by one, over time, with a synthetic polymer molecule that behaves identically. At the end, there's arguably no clay left – the original lump, defined by its material composition, is gone. Yet, the statue seems to persist – it looks the same, functions the same, we'd still call it "David" and insure it as such. The motivating thought is that the statue's persistence depends on its form, function, or continuity of arrangement, not on the persistence of the *original* matter. A theory that cannot accommodate this – perhaps insisting the statue *must* cease to exist if all its original matter is replaced – fails to capture our intuitions about artifacts persisting through gradual material change (like Theseus's Ship). Both asymmetries are critical tests. While some might argue one asymmetry is stronger than the other, a robust theory should handle both. Denying either feels like a significant cost, bordering on a constraint violation for capturing common intuitions.

  Third, the theory needs to handle **form-dependent features, including "negative parts" like holes.** The motivating case is drilling a hole specifically *for* the statue's aesthetic, say an eye socket in a bust. The hole seems to be a feature *of the statue* – part of its form, essential to its identity as *that* artwork. However, is it a feature *of the lump of clay*? Arguably not. The lump, considered just as matter, might have a cavity, but the hole *as an intentional feature* belongs to the statue's form. This pushes the theory to recognize that the statue has properties or parts (even negative ones) that aren't reducible to, or directly inherited from, the properties of the underlying matter alone. It demands an account of how form contributes to what an object *is* and what features it possesses, beyond just the arrangement of its bits. This might be seen as a prejudice by strict materialists who want everything grounded solely in matter and its arrangement, but it reflects a strong intuition about the reality of functional and intentional properties in constituted objects like artifacts.

  Now, to your specific trio: **Can Temporary Coincidence, Essential Form, and No Ontological Overpopulation hold together?** This is where things get very tight, arguably breaking.

  *   **Temporary Coincidence:** The statue and lump coincide *only* when the lump has the statue's form. Before shaping, only the lump exists; after smashing (if the lump survives), only the lump exists. They are distinct entities that share space only temporarily.
  *   **Essential Form:** What makes the statue the thing it is, is crucially tied to its specific form. Destroy that form (smash it), and the statue ceases to exist, even if the matter persists. The lump, conversely, has persistence conditions tied to its matter (or perhaps just continuity of matter without requiring a specific arrangement).
  *   **No Ontological Overpopulation:** We shouldn't multiply entities beyond necessity. Having two distinct, coinciding objects (statue and lump) *right here, right now* feels ontologically extravagant. Why posit two things where common sense might see only one (the statue-shaped lump)?

  The tension is stark. Temporary Coincidence *requires* two distinct entities during the coincidence period. Essential Form tells us *why* they are distinct: they have different essential properties (the statue essentially has its form, the lump essentially has its matter or lacks that specific form-essentiality). But this directly implies that during the coincidence period, there *are* two distinct entities occupying the same space – precisely the "overpopulation" that the third desideratum seeks to avoid. Saying "it's just the lump arranged statue-wise" risks collapsing back into identity and failing the destruction asymmetries. Insisting they are distinct only "in a way" or under different descriptions often feels like renaming the problem rather than solving it. Hylomorphism *tries* by making form a principle rather than a separate entity, but it still struggles to explain the distinct persistence conditions without implying distinct *things*. Mereological Essentialism avoids coincidence (only the parts arranged statue-wise exist; change arrangement, you have a new thing) but spectacularly fails both destruction asymmetries – replacing one molecule destroys the statue, and smashing it *also* destroys only one thing (the parts arranged statue-wise), failing to capture the lump's survival. The Constitution View bites the bullet on temporary coincidence and distinct entities, explicitly accepting "overpopulation" (statue and lump as distinct coinciding objects) to handle the asymmetries and form features, but pays the price of ontological inflation and needing to explain *when* constitution begins/ends.

  So, the trio seems jointly unsatisfiable. If you want Temporary Coincidence *and* Essential Form to explain the asymmetries and form-features, you almost certainly get ontological overpopulation (two things). Insisting on No Overpopulation likely forces you to deny either Temporary Coincidence (collapsing to identity or mereological essentialism) or the robust reality of Essential Form (reducing it to a description or mode of the matter). The core challenge is reconciling the undeniable *differences* (in persistence, modal properties, features) with the equally undeniable *co-location* without resorting to ontologically profligate dual occupancy or collapsing the differences into nothing. That's the real puzzle laid bare by your desiderata.
