  The Academy banning Smith is dignity culture too, using formal rules to address violations. But public reactions were mixed: some saw it as justice, others as too harsh. 

  Public reactions show all three codes. Some supported Smith's honor-based defense, others condemned the violence (dignity), and some framed Jada as a victim of racism/sexism (victimhood). 

  The professor's idea about code-switching for audience credit fits here. Smith shifted from honor to dignity after backlash. Rock's restraint earned him dignity points. People online used whatever moral code suited their stance. 

