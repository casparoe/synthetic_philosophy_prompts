  Breaking down the Oscar incident: Chris Rock's joke about Jada's hair, Will Smith slapping him, Rock not pressing charges, Smith apologizing later, and the Academy banning Smith. 

  For Will Smith, his initial slap seems like honor culture—defending his wife's reputation publicly. But later, his apology invokes dignity culture, emphasizing self-control and institutional processes. That's a switch. 

