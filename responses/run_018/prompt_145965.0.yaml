prompt: |-
  I’m putting together the final take-home for my grad seminar on historical method and I’m kind of stuck on the Braudel week. I don’t want students just listing the three timescales like they read the wikipedia summary, so here’s the idea: frame the exam around the 1815 Tambora eruption and the so-called Year Without a Summer. Ask them to treat it not as a pure event in Braudel’s individual-time sense, but as something that also operates within geographical time—volcanic aerosol circulation, soil depletion patterns—and then rippled into the conjoncture, restructuring agricultural markets in New England and Western Europe for the next two decades. The crux should be whether this counts as a counter-example to Braudel’s claim that events are superficial, or whether his framework can absorb it by reclassifying the long after-effects into structure or conjoncture.

  The prompt should be a 2000-word essay, 48-hour window, worth 30% of the course grade. I need the full package: the exam question itself, a model answer that actually makes the conceptual moves—like distinguishing structure from conjoncture, explaining why Braudel treats geographical structures as nearly immobile, and showing how the rhythms are nested rather than seperate boxes—and a marking scheme that lists exactly which arguments earn full marks and which mistakes should cost points. Please include common errors like conflating longue durée with climate determinism, or treating the eruption as only an event without seeing its structural afterlife. Also don’t ask them to cite specific page numbers from The Mediterranean; they don’t have it memorized and I don’t want fabricated quotes. Just keep it conceptual and focused on the framework. Maybe leave one small typo in there since I’m writing this in a rush—like “seperate” above—but keep the marking scheme spelled correctly.
