prompt: |-
  Philosophers of science have been replaying the same exchange about Imre Lakatos's methodology of scientific research programmes for roughly half a century. Defenders maintain that the hard-core and protective-belt architecture, together with the progressive versus degenerating problem-shift criterion, offers the only normative framework that respects actual scientific history without collapsing into Kuhnian relativism. Critics reply that the hard core is identifiable only post hoc, that progressive is circularly defined relative to the very theories it is meant to evaluate, and that historical reconstructions of Newtonian or Einsteinian science do not map cleanly onto the model. Every standard objection—Duhem-Quine holism rendering the protective belt unfalsifiable, Feyerabend's charge of hidden authoritarianism, the ambiguity of what counts as a novel prediction—has been answered and re-answered, yet neither camp has revised its core commitments.

  My working hypothesis is that the impasse is not primarily about the history of physics at all, but about whether philosophy of science should be prescriptive or empirically descriptive, a disagreement masked by shared vocabulary about rationality and progress. But I want a sharper diagnosis: is this a verbal dispute over those terms, a substantive disagreement about historiographic method, or two groups answering different questions—one normative, one sociological-historical—under a single heading? In particular, apply Lakatos's own apparatus reflexively: has the debate about Lakatos itself become a degenerating problem shift, with each side protecting its hard core through ad hoc adjustments to auxiliary hypotheses about what counts as a successful reconstruction?

  Diagnose the structure of the disagreement using what each side actually says about hard cores, problem shifts, and the role of normative appraisal. Tell me whether a hidden empirical or formal question is doing the work—for instance, whether there is an identifiable formal property that distinguishes progressive from degenerating shifts independent of retrospective judgment. Then say what, if anything, would count as progress: a conceptual distinction that dissolves the ambiguity, a historiographic result that forces one side's hand, or an argument that the question is ill-posed because research programme cannot be individuated precisely enough to do normative work. If you think no progress should be expected, say why and identify the bedrock intuition or methodological commitment that blocks it.

  After your diagnosis in prose, provide a brief structured summary as a JSON object with exactly these fields: debate_description, diagnosis_type, hidden_question_or_disagreement, reflexive_lakatos_assessment, progress_conditions, blocker_if_none. Fill each with a concise string.
