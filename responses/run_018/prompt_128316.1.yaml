prompt: |-
  hey, i'm prepping interview questions for a podcast with a philosopher who defends the view that LLMs are neither agents nor simulators but stochastic oracles — they generate plausible linguistic continuations without any representational commitment, yet their outputs can enter collective reasoning practices and carry derivative acountability. i want eight to ten questions that don't just have him restate the position. please make sure there's one pressing him on how his oracle framing differs from the simulator view common in LLM debates, one on whether the absence of representational commitment rules out moral status entirely, and one on where responsibility lands when a human decision-maker treats the oracle's output as authorative. for each of those three, include a follow-up keyed to the reply he's most likely to give — especially if he tries to deflect by saying accountability always collapses back onto the user. also include a question about the moral residue loop he describes in his recent work: a system makes a recommendation, the human rejects it, but that rejection gets predicted and folded into the system's future weigting, leaving no clear point where accountability stops. keep the tone casual but sharp, and avoid generic opener stuff like what drew him to the topic.
