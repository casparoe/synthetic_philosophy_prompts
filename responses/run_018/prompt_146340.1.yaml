prompt: |-
  There's a strange split in heritage law and museum norms about old ships versus old cars. Restore a wooden ship over two centuries—replace every plank, mast, and rope—and maritime registries and museums still treat it as the exact same vessel, same registration number, same historical identity, as long as the keel line and official paperwork stay unbroken. Do the same thing to a car, swap out engine, chassis, body, every bolt, and title law treats it as breaking the original identity for tax and ownership. What view of object persistence does that institutional pattern presuppose? Reconstruct the implicit metaphysics: is it endurance with essential parts, four-dimensional spatiotemporal continuity, or something like institutional baptism that survives total material turnover? Say whether the practice strictly needs one of those, or if it's philosophically underdetermined and fits several theories. Check if it's consistant with how the same system handles aircraft restoration or historic buildings. Then tell me what a heritage registry built on pure mereological essentialism, or on a perdurantist career-path view, would have to change about its rules. Give me your bottom line in \answer{...} at the very end.
reasoning: |-
  Okay, the user is asking about the philosophical underpinnings of how heritage laws treat object persistence, specifically comparing old ships and old cars. They want to understand what view of object identity is presupposed by these institutional patterns. Let me start by breaking down the key differences mentioned. 

  Ships can have almost all parts replaced but retain identity if the keel and paperwork remain intact. Cars, however, lose their original identity when parts are replaced. So, the user is questioning the metaphysics behind this—whether it's about essential parts, spatiotemporal continuity, or institutional baptism.

  First, I need to recall the main philosophical theories of persistence. Endurantism says objects persist through time by being wholly present at each moment, possibly with essential parts. Perdurantism views objects as four-dimensional space-time worms, where temporal parts exist at different times. Then there's conventionalism, where identity is based on social or institutional practices, like the Ship of Theseus paradox.

  Applying these to ships: The keel acts as an essential part, anchoring identity through changes. This aligns with endurantism where certain parts are essential. The paperwork continuity might add a conventionalist layer. For cars, replacing parts like the chassis or engine breaks identity, which seems strict mereological essentialism—every part is essential.

  But the user also asks if this is consistent with aircraft or buildings. Aircraft registries might resemble ships, using serial numbers and core structures. Historic buildings often focus on original materials, but sometimes allow reconstructions if plans are followed, mixing material and design continuity. This inconsistency suggests institutional practices aren't philosophically rigid but depend on context.

  Next, the user wants to know how a heritage registry based on pure mereological essentialism or perdurantism would change rules. Mereological essentialism would require all original parts for identity, making both ships and cars lose identity after any part replacement. Perdurantism would treat the object as a temporal sequence, accepting changes as different stages. So, ships could retain identity through part replacements as different temporal parts.

  The bottom line is that current practices are hybrid. Ships use essential parts (keel) plus institutional continuity. Cars prioritize material authenticity. This fits multiple theories but leans towards conventionalism, where institutional baptism (paperwork) overrides material change. The inconsistency across domains highlights that these rules are pragmatic, not purely philosophical.
answer: |-
  The institutional divergence between ships and cars reveals a hybrid metaphysical commitment combining **endurantism with essential parts** and **institutional conventionalism**, while being inconsistent with strict mereological essentialism or pure perdurantism. Here's the reconstruction:

  ### Implicit Metaphysics in Current Practice
  1. **Ships (Endurantism + Essential Keel + Institutional Baptism)**  
     Maritime practice treats the *keel* as the essential, identity-anchoring part. As long as the keel is continuous (even if restored), and institutional paperwork (e.g., Lloyd's Register) remains unbroken, the ship persists through total part replacement. This combines:  
     - **Endurantism**: The ship endures as the same object across time by retaining its core "substance" (the keel).  
     - **Essential Part**: The keel is metaphysically privileged.  
     - **Institutional Baptism**: Legal documentation acts as a "rigid designator," overriding material turnover.  

  2. **Cars (Mereological Essentialism Lite)**  
     Automotive titling assumes near-total mereological essentialism: replacing structural elements (chassis, engine, body) severs identity. The VIN ties identity to the original assembly, not a core part. Material authenticity is prioritized, making cars akin to artworks or relics.  

  ### Philosophical Underdetermination & Consistency  
  - **Underdetermination**: The practices *fit* but do not *require* one theory:  
    - Ships could be interpreted as **perduring** (different temporal parts share a keel-stage) or under **conventionalism** (identity is a social decree).  
    - Cars align with **mereological essentialism** but could also reflect **legal pragmatism** (preventing fraud).  
  - **Inconsistencies with Other Domains**:  
    - **Aircraft**: Treated like ships (FAA registration persists if data plate/fuselage frame exists).  
    - **Buildings**: Mixed approach. Replacing stones (e.g., Notre Dame) often retains identity if design is followed, blending conventionalism and formal essence.  
    **→ Contradiction**: Ships/aircraft privilege a *single essential part*; cars demand *material authenticity*; buildings prioritize *design/form*. No unified metaphysics—**pragmatic institutional goals dominate** (e.g., maritime safety vs. automotive fraud prevention).  

  ### Hypothetical Registries: Rule Changes  
  1. **Pure Mereological Essentialism Registry**:  
     - **Ships**: Lose identity if *any* original plank is replaced. Restorations become replicas, not historic vessels.  
     - **Cars**: Current practice largely unchanged (matches "lite" mereological essentialism).  
     - **Buildings**: Replacing a single brick voids historic status.  

  2. **Perdurantist ("Career-Path") Registry**:  
     - **Ships/Cars**: Identity persists through part replacement as long as spatiotemporal continuity is unbroken (e.g., no two cars exist simultaneously claiming the same VIN). Modifications are just new temporal stages.  
     - **Buildings**: A fire-gutted reconstruction remains the same building if continuous in space-time.  

  ### Bottom Line  
  \answer{The institutional pattern presupposes a **pragmatic hybrid of endurantism (with a privileged essential part for ships) and conventionalism**, not a consistent metaphysical theory. It is philosophically underdetermined, but strictly requires neither endurance nor perdurance. A pure mereological essentialist registry would invalidate restored ships; a perdurantist one would legitimize radically modified cars. The disconnect between domains confirms that heritage identity is a legal construct, not a metaphysical truth.}
