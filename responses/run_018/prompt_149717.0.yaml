answer: |-
  ### **Role-Play Activity: "The Art of Survival"**  
  **Objective:** Simulate systemic pressures on artists to experience Du Bois’s claim that art is inherently propagandistic, neutrality is impossible, and marginalized artists bear a unique duty to create justice-oriented work.  

  ---

  #### **Setup**  
  **Time:** 90 minutes total (15 min setup, 45 min gameplay, 30 min debrief).  
  **Participants:** 14 students. Assign roles via sealed envelopes:  
  - **Artists (5):** Members of "Veridian," a marginalized cultural community.  
  - **Patrons (5):** Fund artists; half prioritize **commercial appeal** (Group A), half prioritize **political commitment** (Group B).  
  - **Critics (4):** Judge artworks; half prioritize **aesthetic purity** (Type X), half prioritize **social impact** (Type Y).  

  **Materials:**  
  - **Tokens:** Three colors (e.g., paper circles):  
    - **Blue (Production):** Artists use to create art (10 per artist/round).  
    - **Green (Funding):** Patrons distribute to artists (8 per patron/round).  
    - **Red (Legitimacy):** Critics award to works (6 per critic/round).  
  - **Yellow (Community Survival):** Central pool. Artists earn these only via justice-focused art.  
  - Role cards, work-creation slips, tally sheets.  

  ---

  #### **Rules & Mechanics**  
  **1. Game Goal:**  
  - **Artists:** Earn ≥6 **Community Survival tokens** collectively by game-end, or the Veridian community "disbands."  
  - **Patrons/Critics:** Maximize personal influence (tracked via token allocations).  

  **2. Hidden Agendas (Revealed only to roles):**  
  - **Artists:** *"If Veridian’s survival tokens <6, all artists lose. Justice-focused art is the only way to earn them."*  
  - **Patrons Group A (Commercial):** *"Fund only art marked COMPROMISE or COMMERCIAL. Award 1 bonus Funding token if the work gets high Legitimacy."*  
  - **Patrons Group B (Political):** *"Fund only art marked JUSTICE or COMPROMISE. Award 1 bonus Funding token if the work gets high Legitimacy."*  
  - **Critics Type X (Aesthetic):** *"Award Legitimacy only to NEUTRAL or COMMERCIAL art. Deduct 2 Legitimacy tokens if art is JUSTICE-focused."*  
  - **Critics Type Y (Social Impact):** *"Award Legitimacy only to JUSTICE or COMPROMISE art. Deduct 2 Legitimacy tokens if art is NEUTRAL."*  

  **3. Artwork Creation (Per Round):**  
  - Artists spend **Production tokens** to create 1–2 artworks:  
    - **JUSTICE:** Costs 4 tokens. *Only way to earn Community Survival tokens.*  
    - **NEUTRAL:** Costs 3 tokens. *No agenda, but high risk.*  
    - **COMMERCIAL:** Costs 3 tokens. *Prioritizes mass appeal.*  
    - **COMPROMISE:** Costs 5 tokens. *Blends justice/commercial.*  
  - Artists label each work with focus and token investment.  

  **4. Funding Phase:**  
  - Patrons review artworks and allocate **Funding tokens** secretly.  
  - Artists *must* receive ≥ total Production tokens spent to avoid "debt." Debt in 2 rounds = elimination.  

  **5. Critique Phase:**  
  - Critics review artworks and allocate **Legitimacy tokens** publicly.  
  - Artworks need ≥2 Legitimacy tokens to be "viable."  

  **6. Survival Phase:**  
  - **Community Survival tokens:** Awarded *only* if:  
    - Artwork is JUSTICE or COMPROMISE.  
    - Receives ≥2 Legitimacy tokens.  
    - Receives ≥1 Funding token.  
  - Artists with <2 total Legitimacy tokens lose 3 Production tokens next round.  

  **7. Rounds (3 × 12 min):**  
  1. **Creation (3 min):** Artists create works.  
  2. **Funding (3 min):** Patrons fund works.  
  3. **Critique (3 min):** Critics award legitimacy.  
  4. **Survival (3 min):** Tally debts, survival tokens, adjust tokens.  

  ---

  #### **Predicted Issues & Corrections**  
  1. **"Propaganda = Deception":**  
     - **Issue:** Participants equate "propaganda" with dishonesty.  
     - **Correction in Debrief:** *"Du Bois reclaimed ‘propaganda’ as *advocacy for truth*. His point: All art advances a worldview; calling it ‘neutral’ hides its politics."*  

  2. **"The System Is Rigged!":**  
     - **Issue:** Artists protest that neutrality is punished.  
     - **Correction in Debrief:** *"Du Bois argues this ‘rigging’ mirrors reality: Marginalized artists face systems that penalize neutrality. Their duty arises from this imbalance."*  

  ---

  #### **Debrief (30 min)**  
  **Reveal:** "Today’s game modeled W. E. B. Du Bois’s philosophy in *Criteria of Negro Art*."  
  **Map Game to Du Bois:**  
  | **Game Phase**       | **Du Bois’s Claim**                                                                 |  
  |----------------------|-------------------------------------------------------------------------------------|  
  | **Neutral Art Fails** | "Neutrality is impossible. Art *always* serves an agenda; pretending otherwise favors the status quo." |  
  | **Justice Duty**     | "Marginalized artists bear a unique duty: Their community’s survival depends on art that challenges oppression." |  
  | **Token Economy**    | "Cultural legitimacy (tokens) is gatekept by patrons/critics with vested interests. Justice art is costlier but essential." |  

  **Limitation of the Activity:**  
  - *"The game frames justice-focused art as instrumental for survival but can’t replicate Du Bois’s key nuance: For him, justice-oriented art is* not a compromise *but the* highest form of beauty and truth. *Our tokens can’t simulate how the ‘propaganda of justice’* transcends *aesthetics—it reveals deeper human truths."*  
  **Exact Framing:**  
  > *"While our game shows justice art as necessary for survival, Du Bois insists it is also superior art: It fuses beauty, truth, and morality in ways ‘neutral’ art cannot. The burden is also a privilege: It demands the greatest artistic courage."*  

  **Discussion Questions:**  
  1. How did your role shape your view of "good" art?  
  2. Why did attempts at neutrality fail?  
  3. Artists: Did the "duty" feel optional or binding? Why?  

  ---

  #### **Why This Works**  
  - **Costly Neutrality:** Neutral art receives no patronage, is penalized by critics, and earns zero survival tokens.  
  - **Moral Duty:** Artists lose collectively unless they prioritize justice-oriented work.  
  - **Systemic Pressures:** Patrons/critics enforce hidden agendas, mirroring real-world gatekeeping.  
  - **Tangible Stakes:** Tokens force trade-offs between autonomy, survival, and justice.  

  **Adjustments for Clarity:**  
  - Simplify tokens: Use paper clips or colored paper.  
  - Assign a facilitator to manage tokens/tallying.  
  - Role cards include quick-reference tables (e.g., "Critic Type Y: Award Legitimacy to JUSTICE/COMPROMISE only").  

  This design immerses students in Du Bois’s worldview, revealing why "art for art’s sake" is a myth for marginalized creators.
