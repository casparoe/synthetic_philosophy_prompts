answer: |-
  ### Bottom Line Summary
  This flowchart applies Braudel’s temporal layers to classify coastal-resilience proposals by their dominant driver (geographical, social, or event time) using two core tests: **Substitution** (if replacing the region’s recent event history, would the problem persist?) and **Scale** (will impacts outlast 40+ years?). It reduces misallocation by forcing structural analysis but fails when reviewers misattribute slow geographical change to "fixable" social causes, especially where data gaps exist.

  ---

  ### Diagnostic Gates & Camouflage Screen

  | **Gate**          | **Question**                                                                 | **Evidence Required**                                  | **Failure Mode**                                           | **Judgment Call Remaining**                              |
  |--------------------|------------------------------------------------------------------------------|--------------------------------------------------------|-----------------------------------------------------------|----------------------------------------------------------|
  | **Geographical Time** | "Would the problem persist if this region had no recent storms/events?" (Substitution test) | Geological surveys, century-scale climate/sea-level trends | Approving rapid fixes for irreversible land subsidence    | Whether geographical constraints are alterable at all    |
  | **Social Time**      | "Do root causes involve laws, economies, or cultures lasting >40 years?" (Scale test) | Land tenure records, institutional histories, generational poverty maps | Rejecting delta governance reform as "non-urgent"        | If social structures are mutable within funding horizons |
  | **Event Time**       | "Is the trigger a discrete shock (e.g., cyclone, policy shift) <5 years old?" | Disaster reports, election dates, emergency declarations | Funding monuments instead of post-flood housing           | Whether an event masks deeper structural fragility       |
  | **Camouflage Screen** | "Does the proposal repackage chronic conditions as sudden crises?"           | Pre-event vulnerability indices, past funding requests | Approving "emergency" seawalls for chronic erosion       | Intentionality of framing vs. genuine new threat        |

  ---

  ### Application to Hypothetical Proposals

  1.  **Storm-Shelter Network (Low-Lying Archipelago)**  
      - **Flowchart Path**: Passes Event Time Gate (trigger: recent cyclone); fails Geographical Substitution (shelters needed regardless of recent events? **No**—without cyclone, urgency drops).  
      - **Classification**: Event-time (approved for rapid funding).  
      - **Judgment Call**: Whether shelters address pre-existing vulnerability (Camouflage Screen: if erosion was chronic, requires deeper audit).  

  2.  **30-Year Delta Irrigation/Tenure Restructuring**  
      - **Flowchart Path**: Fails Event Time (no discrete trigger); passes Social Scale test (tenure systems outlast generations); passes Geographical Substitution (water stress persists sans recent droughts).  
      - **Classification**: Hybrid (Social-dominant).  
      - **Action**: Split funding: rapid track for immediate irrigation repairs (event-layer), structural track for tenure reform (20-year evaluation). **Board conflict**: Procedure flags misalignment with 3-year reporting but cannot resolve it.  

  3.  **Flood Memorial Renaming/Monument**  
      - **Flowchart Path**: Passes Event Time (tied to specific flood); fails Social Scale (no institutional change); fails Geographical Substitution (without flood, no rationale).  
      - **Classification**: Individual/Event-time (reject—no structural impact).  
      - **Judgment Call**: Camouflage Screen catches crisis framing; reviewer must assess if it masks needed recovery aid.  

  ---

  ### Explicit Limitations  
  1.  **No normative guidance** on whether geographical constraints (e.g., sinking deltas) should be adapted to or transformed.  
  2.  **Silent on intergenerational equity** when institutional memory (<10 years) cannot validate centennial-scale interventions.  
  3.  **Cannot resolve** political pressure to fund visible but non-structural projects (e.g., monuments).  

  Word count: 798
