answer: |-
  *(Sitting hunched over papers at a cluttered desk, weary but intense)* Young scholar, you mistake the brokenness of *courts* and *states* for the brokenness of *my concept*! Politics capturing the law *now* doesn't negate the biological reality: a group is an organism. Cut its roots – its language, its farms, its sacred ties to land and tradition – and you starve its soul just as surely as bullets starve its body. In Ottoman Turkey, they closed Armenian schools *first*, dissolved their institutions, broke their economic spine... making the later slaughter possible, even *inevitable*. Calling this mere "war crimes" ignores the *coordinated plan to dissolve the group's continuity*. The Convention's retreat to only physical-biological destruction is a betrayal! It lets perpetrators kill a culture with bureaucracy, not bullets, and escape the gravest charge. The law *must* recognize the slow death too, or it becomes complicit in the very destruction it claims to prevent!
