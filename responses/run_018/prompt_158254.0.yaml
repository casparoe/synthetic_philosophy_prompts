answer: |-
  Here’s a comprehensive exam package tailored to your requirements, grounded in Nietzsche’s *Untimely Meditations II* and designed for upper-level undergraduates.

  ---

  ### **1. Exam Question**  
  **Time Allotment:** 45 minutes  

  > The town of Elmwood plans to erect a monument to Jonathan Thorne, a 19th-century industrialist who funded its public library, school, and hospital. Thorne’s factories, however, relied on child labor, paid starvation wages, and suppressed union efforts. The town council is divided:  
  > - **Faction A** wants the plaque to celebrate Thorne’s philanthropy, calling him a "visionary builder."  
  > - **Faction B** insists the monument must detail his labor abuses to avoid "whitewashing history."  
  > - **Faction C** argues the monument should be scrapped entirely, calling Thorne "unworthy of honor."  
  >  
  > **Analyze this debate through Nietzsche’s three modes of historical engagement (monumental, antiquarian, critical).**  
  > **Then, argue which mode *ought* to prevail in this scenario, addressing where Nietzsche himself might be conflicted.**  
  > **Finally, evaluate whether digital archives (e.g., permanent online records of Thorne’s factory inspections or worker testimonies) make Nietzsche’s "critical" mode easier or obsolete.**  

  ---

  ### **2. Model Answer** (580 words)  
  Nietzsche’s three historical modes—monumental, antiquarian, and critical—offer competing frameworks for Elmwood’s monument debate, each with distinct risks and utilities for communal life.  

  **Faction A champions monumental history**, seeking to inspire present-day citizens by highlighting Thorne’s philanthropy. Nietzsche describes monumental history as extracting "greatness" from the past to motivate contemporary action (*UM II*, §2). Here, Thorne’s libraries and hospitals represent aspirational models for civic duty. However, Nietzsche warns that monumentalizing requires myth-making: it "ignores causes" and "flattens differences" to create heroes (*UM II*, §2). Faction A thus risks deluding Elmwood by erasing exploitation—turning Thorne into a sanitized symbol.  

  **Faction B embodies antiquarian history**, demanding meticulous preservation of Thorne’s legacy, both laudable and damning. For Nietzsche, the antiquarian mode venerates the past "simply because it is old" (*UM II*, §3), fostering identity through continuity. By insisting on contextual accuracy—philanthropy *alongside* exploitation—Faction B treats Thorne’s archive as sacred. Yet Nietzsche critiques antiquarianism for paralyzing life when it becomes "blind conservation" (*UM II*, §3). Demanding every plaque become an exhaustive ledger could burden Elmwood with "inert facts," stifling future-oriented action.  

  **Faction C practices critical history**, seeking to "break up the past" by condemning Thorne (*UM II*, §3). Nietzsche frames critical history as a violent but necessary act: judging the past to liberate the present from inherited injustices. Scrapping the monument exemplifies this "surgery," rejecting Thorne’s moral authority. However, Nietzsche cautions that pure critical history risks nihilism—destroying foundations without creating new values (*UM II*, §4).  

  **Critical history should dominate Elmwood’s approach**, but with monumental restraint. Nietzsche prioritizes history’s *service to life*: we must remember or forget based on present needs (*UM II*, §1). Thorne’s labor abuses remain materially relevant—low wages and union suppression echo in modern Elmwood’s economy. Critical history thus serves life by dismantling harmful legacies. Yet Nietzsche might resist Faction C’s totalizing rejection: monumental elements (e.g., "Thorne funded this library, but workers paid the price") could harness the past to inspire equitable civic action *today*. Nietzsche’s tension lies here: he demands ruthless criticism (*UM II*, §3) but admits monumental "illusions" are vital for cultural vitality (*UM II*, §2).  

  **Digital archives complicate Nietzsche’s framework**. Permanently searchable records make critical history *easier* by preserving marginalized voices (e.g., factory testimonies), countering monumental erasure. Yet Nietzsche’s call for "active forgetting" (*UM II*, §1)—deliberately discarding oppressive memories to enable growth—becomes implausible when every detail is retrievable. Digital permanence risks *overdosing* on history: antiquarians could weaponize archives to paralyze change ("Why rebuild if Thorne’s corruption is forever online?"). Critical history, then, isn’t obsolete—it’s more urgent. We must *curate* digital access (e.g., contextualizing Thorne’s records with labor histories) to transform information into life-serving judgment, not antiquarian fetishism.  

  Ultimately, Elmwood’s monument should reflect Nietzsche’s hierarchy: critical history as scalpel, monumental as selective balm, antiquarian as restrained witness. The plaque might read: "Jonathan Thorne (1830–1899): His philanthropy built this town’s institutions; his laborers built his fortune."  

  ---

  ### **3. Marking Scheme**  
  **A Answer (A–A+)**  
  - **Accurately defines all three modes** with textual grounding (monumental = selective inspiration; antiquarian = preservative reverence; critical = destructive judgment).  
  - **Analyzes factions through modes**: Identifies Faction A as monumental (myth-making), B as antiquarian (comprehensive preservation), C as critical (rejection).  
  - **Tensions & Nietzsche’s Ambivalence**: Argues why critical *should* dominate (abuses impact present) but notes Nietzsche’s caution (monumental’s necessity for vitality; critical’s nihilism risk).  
  - **Digital Analysis**: Shows digital archives *aid* critical history (access to suppressed voices) but *threaten* active forgetting; argues curation is key.  
  - **Synthesis**: Weaves modes together (e.g., "critical history requires monumental restraint") rather than listing them.  

  **B Answer (B–B+)**  
  - Correctly defines modes but **applies them mechanically** (e.g., "Faction A is monumental, Faction B is antiquarian...").  
  - **Superficial treatment of tensions**: Recognizes conflict (e.g., "Nietzsche might disagree with erasing abuses") but doesn’t engage his hierarchy of life-serving uses.  
  - **Digital discussion** is tangential (e.g., "Archives make everything remembered").  
  - **Prioritization** of a mode is stated but weakly justified.  
  - May confuse antiquarian with "antiquated" but recovers.  

  **C/F Answer**  
  - Misdefines modes (e.g., confuses critical with antiquarian).  
  - Summarizes factions without Nietzschean framework.  
  - Omits Nietzsche’s ambivalence or digital implications.  

  ---

  ### **Scholarship Notes**  
  - **Settled**: Nietzsche’s three modes are explicitly defined in *UM II* and their core functions (inspiration/reverence/destruction) are uncontested.  
  - **Contested**:  
    - Whether Nietzsche’s "life-serving" criterion can justify *collective* remembrance (vs. individual/artistic uses).  
    - If "active forgetting" implies ethical deletion (Jacob Golomb) or just reinterpretation (Christoph Cox).  
    - Whether digital permanence fundamentally breaks Nietzsche’s model (Paul van Tongeren) or demands new forms of curation (Samantha Rose Hill).  

  **Avoid These Pitfalls in Grading**:  
  - Treating "active forgetting" as literal deletion (Nietzsche means *releasing the past’s psychological grip*).  
  - Presenting critical history as inherently "correct" (Nietzsche values all three conditionally).  
  - Calling antiquarianism "antiquated" (unless a student makes this error—then note it!).  

  This question pushes students beyond taxonomy into applied ethics, Nietzsche’s nuances, and modern dilemmas—perfect for a seminar grappling with history’s "uses and abuses." Good luck drafting!
