answer: |-
  Your argument is incisive, but it mischaracterizes the ontological status of the scaffold and underestimates the diagnostic power of my distinction. Let me dismantle this step by step.

  **Where your reasoning slips:** You conflate *explanatory indispensability* with *irreducible ontology*. That the institutional punishment regime must be treated as a given framework when explaining *particular acts within its domain* does not make it a skyhook. It becomes a soft crane precisely because we acknowledge its crane-based origins. Your "normative residue" is not residue at all—it's *active infrastructure*. Residue implies waste left behind; scaffolds are load-bearing structures still doing work.

  **On "normative residue" vs. soft cranes:** Your term dangerously anthropomorphizes the phenomenon. "Residue" suggests an inexplicable remainder, while "soft crane" captures its functional role: a real, causally active structure that *transiently* simplifies explanation precisely because it was *reducibly constructed*. The institution is not a mysterious given—it's a concrete historical precipitate. We *can* dissolve it (by tracing its emergence through agent-level interactions), but doing so when analyzing behavior *within* the stabilized system is not just impractical—it’s *explanatorily perverse*. Why dismantle the bridge while crossing it?

  **The greedy reductionist’s fatal error:** Their failure isn't ignoring scaffolds—it's denying their *provisional autonomy*. They commit two sins:
  1. **Temporal dishonesty:** Pretending the scaffold is already reduced when its effects are actively constraining the system ("This punishment regime is *just* a folk psychology for fitness payoffs!").
  2. **Reification panic:** Mistaking the *acknowledgment* of the scaffold's causal power for skyhook worship ("Calling it an 'institution' is mysticism!").

  **What’s gained by preserving the distinction:**
  - **Explanatory responsibility:** We retain the obligation to reduce the scaffold *when explaining its origins or persistence*, while freely using it as a frame *when explaining phenomena it organizes*. 
  - **Diagnostic clarity:** We distinguish *productive* scaffolds (soft cranes) from *explanatory dead ends* (skyhooks). A true skyhook—like invoking "group consciousness" to explain punishment regimes—bears no reductionist burden. Your institution does.
  - **Level-specific rigor:** We avoid the folly of demanding quantum field theory to explain a judge’s gavel strike. The scaffold *is* the relevant physics at that organizational stratum.

  **What’s lost if we collapse the distinction:** We surrender to either:
  - **Skyhook mysticism** (treating scaffolds as metaphysically primitive), or  
  - **Greedy incoherence** (denying scaffolds exist, forcing us to recompute the universe from quarks at every turn).

  Your institutional scaffold isn’t a counterexample—it’s the *exemplar* of a soft crane. Reduction doesn’t "generate residue"; it *constructs infrastructure* that temporarily condenses complexity. The crane/skyhook boundary holds because *soft cranes decompose under investigation, while skyhooks evaporate*. Show me your institution’s emergence through agent-level sanctions, and the scaffold dissolves into cranes. Try that with a Cartesian theater or vital élan—it crumbles into nonsense. 

  **The boundary stands.**
