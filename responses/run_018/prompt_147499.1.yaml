  We are creating a decision procedure grounded in the philosophy of responsibility gaps, focusing on three key concepts: 
   1. Direct Control: Was an individual in a position to directly control the action?
   2. Design-Level Accountability: Was the incident a result of a flaw in the design, testing, or deployment process for which an individual or team is accountable?
   3. System-Level Emergence: Did the incident arise from emergent behavior of the system that was not foreseeable and not attributable to any individual's actions?

   The procedure must be reusable and structured as a series of questions. We must also note:
   - What counts as a sufficient answer for each question.
   - The exact point where the procedure stops and says "no person, firm-level only".
   - The point where it hands off to legal because it's a values call.
   - Flag steps that are judgment calls.

   Steps:

   Step 1: Direct Control Check
     Question: Did any human operator have the ability to directly intervene and prevent the incident in real-time?
     Sufficient Answer: 
       - If a human operator was actively monitoring and had the means to override the drone's decision (e.g., via a manual override function) and failed to do so, then that operator is liable.
       - If no human operator was required to be in the loop (or if the system did not allow for real-time intervention) then this step is not satisfied.
     Judgment Call: Determining whether the operator had a "reasonable opportunity" to intervene (considering workload, interface design, etc.) may be subjective.

   Step 2: Design-Level Accountability Check
     Question: Was the incident a foreseeable consequence of a design, testing, or deployment decision for which a specific individual or team is accountable?
     Sufficient Answer:
       - If the incident was caused by a known flaw in the system that was not addressed (e.g., a known bug in the routing algorithm) and there was a responsible party (e.g., the lead engineer for that module) who failed to act, then that party is liable.
       - If the incident was caused by an unforeseen flaw that should have been caught in testing (e.g., inadequate testing in scenarios like bad weather) then the testing team or the person responsible for test coverage is liable.
     Judgment Call: Foreseeability is inherently subjective. What one engineer might consider obvious, another might not.

   Step 3: System-Level Emergence Check
     Question: Did the incident arise from an emergent behavior of the system that was not reasonably foreseeable and not attributable to a specific design or operational decision?
     Sufficient Answer:
       - If the behavior emerged from complex interactions (e.g., machine learning models trained on fleet data) and there was no prior instance of such behavior, and the design process included safeguards against such emergence (e.g., robust simulation testing for emergent behaviors) then this step is satisfied and the incident is due to system-level emergence.
     Judgment Call: Determining whether the emergence was "reasonably foreseeable" is a judgment call.

   Step 4: Handoff to Legal for Values Call
     Question: If the incident passes the emergence check (i.e., it is truly emergent and unforeseeable) then we have a responsibility gap. However, we must also consider if the firm's policies on risk acceptance (e.g., using a system that is known to have emergent properties without adequate safeguards) are a matter of corporate values. 
     Sufficient Answer:
       - If the firm knowingly deployed a system with a high risk of emergent behaviors without adequate safeguards (e.g., because of cost pressures) and this incident was a manifestation of that risk, then this is a values call: the firm must bear responsibility, but the decision to deploy under these conditions may have been made by executives. However, since the procedure is not legal, we hand off to legal at this point to determine if the executives should be held liable (which might involve legal concepts like negligence).

   The procedure stops and says "no person, firm-level only" when:
     - Step 1: No direct control (i.e., no human operator was in a position to intervene in real-time).
     - Step 2: The incident was not due to a design flaw that can be attributed to a specific individual or team (i.e., it was unforeseeable at the design level).
     - Step 3: The incident is confirmed to be due to system-level emergence (i.e., it was unforeseeable at the system level and not caused by a design flaw).

   But note: if Step 3 is satisfied, then we have a responsibility gap and the firm holds the bag.

   However, if during Step 2 we find that the design flaw was due to a decision that was made by an individual (e.g., ignoring a known risk) then we assign liability to that individual.

   The procedure hands off to legal in Step 4 when:
