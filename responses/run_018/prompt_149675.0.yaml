answer: |-
  Blimey, that's profoundly difficult, sitting there facing that stark denial. Your question cuts right to the heart of knowledge, certainty, and the frameworks that hold our worlds together. Philosophers *have* grappled with this territory, and there might be some useful distinctions here, offered in proper British English:

  1.  **"Universal Background Fact" vs. "Local Framework":** You've hit the nail on the head.
      *   **The "Universal" View (Naïve Realism/Foundationalism):** This is the instinct you're questioning. It assumes facts like "My gran is my gran" or "She had children" are bedrock, objective truths about the world, independent of anyone knowing them. They provide the stable ground on which ordinary doubts ("Did I leave the kettle on?") play out. Verifying them *should* be straightforward (birth certs, DNA, testimony).
      *   **The "Local Framework" View (Coherentism/Contextualism/Wittgensteinian "Hinges"):** This is closer to your suspicion. Philosophers like Wittgenstein argued that certain propositions function as "hinges" on which our inquiries turn. They aren't typically *doubted* within a form of life (like a family unit); they are the *preconditions* for doubt within that context. "Granny is my gran" isn't something you *verify* daily; it's the frame *within which* you verify things like "Did she take her pills?" or "Does she prefer tea now?". This framework is held together by shared history, lived experience, mutual recognition, and collective memory – a dense web you're embedded in, not just a list of facts.

  2.  **The Philosophical Difference in Certainty:**
      *   **Ordinary Doubt:** This occurs *within* an accepted framework. You doubt a specific claim ("Where are my keys?") precisely *because* you take the broader framework for granted ("I had keys," "This is my house"). You can resolve it by looking *within* the framework (checking pockets, retracing steps).
      *   **Framework-Level "Certainty":** This is the certainty *of* the framework itself ("Granny is my gran," "Mum is her daughter"). It's pre-reflective, constitutive. You don't *prove* it constantly; it's the lens through which you see your family world. Attempting to "prove" it *to yourself* using external records feels hollow because you're questioning the very ground you stand on, the web you're part of. As you say, records rely on other frameworks of trust (registrars, archives, the concept of legal identity) – eventually, you hit bedrock that *is* taken on trust within a form of life.

  3.  **Dementia Breaking the *Local* Framework:**
      This is the crux. Her dementia hasn't unearthed a hidden "truth" that contradicts universal facts. Instead, it has catastrophically *fragmented her specific, local framework*. The internal coherence of *her* lived reality, her narrative, her web of relationships, has been disrupted. The "hinge" proposition "I am a mother" has, for her, come loose. What remains might be fragments, earlier memories, or entirely new configurations.

  4.  **How This Changes How You Treat Her:**
      **This is where the philosophy points towards a crucial ethical shift:**
      *   **Don't Insist on the "Universal Fact":** Trying to "correct" her, show photos, argue "But *I'm* here!", or wave birth certificates is likely futile and deeply distressing *for her*. You'd be speaking from *your* intact framework into the void of her fragmented one. You're demanding she accept a proposition ("I had children") that, within her *current* reality, makes no sense and might feel like an attack or bizarre fabrication.
      *   **Meet Her Where She Is (Within Her Current Framework):** This is the hard but essential part. Philosophy highlights that her reality, however fragmented or different, is *her* current lived experience. Respecting her dignity means engaging with *that* reality, not the one she's lost access to.
          *   **Don't Contradict, Don't Correct:** If she says she never had children, don't argue. Acknowledge her *feeling* or *current belief* without endorsing the historical fact. "Okay, Gran," or "I see," or gently changing the subject.
          *   **Focus on Connection in the Present:** Engage with the person she is *now*. Talk about things she *does* recognise or enjoy – the weather, a biscuit with her tea, a familiar song from her youth (even if from before motherhood), the feel of a blanket. Share quiet moments.
          *   **You Hold the Family Truth:** *You* know who she is, who you are, and the history. You keep that framework alive *for yourself and your family*. But insisting she re-enter it is like trying to force someone through a door that, for them, no longer exists.
          *   **It's About Her Reality, Not Yours (In the Moment):** The philosophical distinction helps depersonalise the hurt. Her denial isn't about *you* or your mum; it's a symptom of the framework collapse *within her mind*. Your role shifts from defending the shared history to offering compassionate presence within *her* current, altered world.

  **In essence:** Philosophers like Wittgenstein would likely say that the certainty of family belonging *is* a local framework, a "form of life". Dementia doesn't falsify the historical facts, but it destroys the individual's internal access to and inhabitation of *that specific framework*. Recognising this as a framework collapse, rather than just a wrong belief, fundamentally changes the ethical response: away from correction and towards compassionate accompaniment within *her* current, diminished reality. It doesn't lessen your truth or your love; it reorients how you express that love in the face of her profound loss. It's bloody hard, but understanding it this way might help navigate the heartbreaking strangeness of it all. All the best to you and your family.
