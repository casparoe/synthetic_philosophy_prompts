answer: |-
  ## Joint Statement on "The Will of the People": Findings from Adversarial Collaboration Between Substantive-Populist and Procedural-Pluralist Perspectives

  **Preamble:** We, a scholar adhering to substantive-populist principles and a scholar adhering to procedural-pluralist principles, engaged in a rigorous, good-faith adversarial collaboration to explore the contested concept of "the will of the people." Our aim was not to erase fundamental differences, but to clarify points of agreement, precisely define core disagreements, and identify the empirical and theoretical cruxes where our perspectives diverge. This statement reflects our shared understanding of established complexities and our distinct interpretations of unresolved questions.

  **Section 1: Agreed Foundational Claims**

  We jointly affirm the following propositions, grounded in historical analysis, political theory, and social science consensus:

  1.  **Historical Contingency & Ambiguity:** The phrase "the will of the people" emerged primarily in revolutionary contexts (e.g., French Revolution, American Independence) as a legitimising counterpoint to monarchical or aristocratic authority. Its meaning has always been contested and inherently ambiguous, serving both emancipatory and potentially oppressive purposes depending on context and speaker.
  2.  **Formal Aggregation Problems are Inescapable:** Any attempt to translate individual preferences into a singular "popular will" faces demonstrable formal limitations:
      *   **Condorcet Cycles:** Under certain distributions of preferences, majority voting can produce intransitive, inconsistent results (A>B, B>C, but C>A), meaning no single option is preferred by a majority over all others. This demonstrates the potential incoherence of "majority will."
      *   **Arrow's Impossibility Theorem:** No ranked-choice voting system can simultaneously satisfy a minimal set of seemingly reasonable fairness conditions (e.g., non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) when aggregating three or more options. This proves the impossibility of a perfect, universally fair aggregation mechanism.
      *   **Electorate Fluidity:** The "people" is not a fixed entity. Due to demographic turnover (births, deaths, ageing) and migration (in/out), the composition of the eligible and actual electorate changes continuously. A decision made by "the people" at Time T1 is made by a significantly different collective entity by Time T2 (e.g., 15 years later).
  3.  **The Performative Power of Invocation:** Claiming to embody or enact "the will of the people" is a potent political speech act. Such claims can mobilise support, legitimise authority, delegitimise opposition, and shape political reality, irrespective of their empirical accuracy or theoretical coherence. This performative power exists independently of the ontological status of the "will" being invoked.
  4.  **Institutional Framing is Constitutive:** The specific rules, procedures, and institutional designs (e.g., electoral systems, referendum formats, parliamentary processes) fundamentally shape *how* preferences are elicited, aggregated, and interpreted. Different institutions will produce different declared "wills" from the same underlying population of preferences.
  5.  **The "Niche Framing": Problem of Digital Plebiscites:** The advent of digital platforms enabling near-continuous, real-time polling and preference updating ("perpetual plebiscites") introduces novel complexities. It highlights the tension between capturing fleeting sentiments versus stable convictions, amplifies questions about agenda control and algorithmic bias in question framing and result presentation, and potentially intensifies the performative effects mentioned in point 3.

  **Section 2: Defined Disagreements and Cruxes**

  While agreeing on the *problems* above, we fundamentally diverge on their interpretation and implications for the ontological existence and normative authority of "the will of the people." Below are our core disagreements, structured around three key cruxes. Each crux includes an agreed-upon relevant case/mechanism and our contrasting predictions.

  | Crux                                                                 | Agreed Relevant Case/Mechanism                                                                                                                                 | Substantive-Populist Position & Prediction                                                                                                                               | Procedural-Pluralist Position & Prediction                                                                                                                                                     |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Constituency of "The People": Do non-voters count?**            | **Case:** A national referendum on a major constitutional change passes with 52% 'Yes' from a 48% turnout. 52% of eligible voters abstained.                     | **Position:** "The People" is a pre-political, organic entity. Non-voters remain part of "The People"; silence implies passive consent or acquiescence to the active majority's will. Abstentions don't negate the mandate of the participating majority speaking *for* the whole. <br>**Prediction:** Legitimacy claims based on the majority *of participants* will be widely accepted as representing the national will, even with low turnout. | **Position:** "The People" is constituted *only* through the act of participation within defined procedural rules. Non-voters are effectively absent from the demos *for that specific decision*. Their preferences are unknown and cannot be assumed. <br>**Prediction:** Legitimacy claims will be significantly contested; the result reflects only the will of the participating subset, not "the people" as an undifferentiated whole. Low turnout inherently weakens the mandate. |
  | **2. Temporal Authority: Does demographic turnover dissolve mandates?** | **Case:** A government elected in 2020 on a clear manifesto pledge (e.g., major infrastructure project) retains power in 2025. By 2025, ~40% of the 2020 electorate have died/moved away, replaced by new voters (young adults, immigrants). The government claims a continuing mandate. | **Position:** "The People" possesses an enduring collective identity and sovereign will. Mandates represent the enduring spirit/purpose of the polity, not just the transient preferences of individuals at one point. Newcomers join the existing sovereign body; the prior decision stands unless explicitly revoked. <br>**Prediction:** Claims of an enduring mandate will retain significant legitimacy if framed as upholding the nation's prior sovereign choice. | **Position:** Political authority derives from the consent of the governed *at the time a decision is implemented*. The "People" of 2025 is a distinct entity from 2020. Continuous legitimacy requires continuous consent or mechanisms for review/renewal. <br>**Prediction:** Claims of an enduring mandate will face increasing legitimacy challenges over time, particularly from those who couldn't vote in 2020. The mandate weakens significantly as turnover increases. |
  | **3. Aggregation as Revelation vs. Construction**                    | **Case:** A government deploys a sophisticated algorithmic "Civic Pulse" app. Citizens continuously rate policy ideas on multiple dimensions. The algorithm synthesises complex data into a single "Popular Priority Score," claiming to reveal the latent popular will. | **Position:** A coherent popular will exists prior to and independently of specific aggregation mechanisms, though obscured by complexity. Sophisticated, dynamic aggregation tools (like the app) *can*, if well-designed, *reveal* this latent, true collective intentionality more accurately than periodic votes. <br>**Prediction:** Outputs from such systems, presented as revealing the "true" popular will, will gain significant traction and legitimacy, especially if perceived as more nuanced than binary votes. | **Position:** Collective intentionality is an institutional artefact. Aggregation mechanisms (especially complex algorithmic ones) don't reveal a pre-existing singular will; they actively *construct* it through their specific design, weighting, question framing, and data interpretation choices. The "will" is an output of the system. <br>**Prediction:** Claims that the algorithm reveals a "hidden" will will be seen as inherently ideological or manipulative. Legitimacy will depend entirely on procedural fairness and contestability of the algorithm, not on claims of revelation. The output is a *new* construction. |

  **Conclusion:** Our collaboration confirms that "the will of the people" is neither a simple empirical fact nor a meaningless fiction. It is a powerful, complex, and inherently contested concept operating within demonstrable constraints (aggregation paradoxes, demographic flux) and possessing significant performative force. While we share a deep commitment to democratic legitimacy, our fundamental divergence lies in whether popular sovereignty resides in a pre-institutional collective entity with a potentially discernible enduring will (Substantive-Populist), or whether it is constituted and reconstituted solely through contingent institutional procedures aggregating individual preferences at specific points in time (Procedural-Pluralist). The three cruxes identified – the constituency of the people, the temporality of mandates, and the nature of aggregation – represent the core fault lines where these irreconcilable premises lead to starkly different interpretations of democratic authority and legitimacy. Recognising and rigorously examining these cruxes is essential for any serious democratic discourse.
