  - **Root Question**: Splits responses to the Chase and Sanborn case into three paths: quale-shift, judgment-shift, or no-stable-quale.
  - **Subsequent Branches**: 
    - Asks about incorrigibility of first-person access for all paths.
    - Asks about identity conditions for subjective states.
    - In the quale-shift path, adds a branch for "demonstrative-drift" via the neural reference shift question.
  - **Leaves**: 
    - Includes named positions like demonstrative-drift (isolated via neural reference shift), Dennett-style eliminativist, direct-access realist, judgment-shift realist, and functionalist.
    - Marks unnamed positions for less common views.
    - Specifies core and awkward commitments for each leaf.
  - **Unoccupied Combinations**: Diagnoses why certain answer combinations (e.g., incorrigibility + undetectable shifts) are incoherent or unattractive.
  - **Flagged Pairs**: None—all positions are distinguishable by their paths.
