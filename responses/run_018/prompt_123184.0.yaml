prompt: |-
  okay so me and my friend got into it last night about whether scientists can ever be rationally stubborn. she summed up the higher-order evidence thing like this: its basically just info about your own brain being broken, so if peer review tells you your stats are wrong you should instantly drop belief in your result, even if the numbers still look right to you. she said epistemic akrasia—believing p while thinking youre unreliable about p—is always irrational except when the belief is about your own reasoning, which creates a loop. then she threw in this twist that Kuhnian paradigm shifts happen exactly when scientists stay akratic too long, ignoring anomalies until the higher-order pressure gets overwhelming. i feel like shes conflating a couple different positions but i cant pin it down. is this a fair summary? specifically, do people who defend level-splitting actually claim its always irrational outside that self-reference loop? and does dragging Kuhn in make sense here, or is she forcing a connection? go through it part by part and tell me whats accurate, whats subtly misrepresented, and whether her peer-review conclusion actually follows from the accurate bits.
