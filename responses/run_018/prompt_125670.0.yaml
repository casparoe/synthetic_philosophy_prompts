prompt: |-
  I'm planning a ninety-minute seminar for advanced undergraduates in environmental philosophy, and I want to structure the session around the ethics of space colonization—specifically the tension between preservationist obligations toward extraterrestrial environments and the argument that humanity carries a kind of survival imperative to become multi-planetary. Rather than treating this as a simple cost-benefit problem, I want the seminar to turn on a more structural difficulty: the non-identity problem applied to potential future Martian-born generations. If we terraform Mars and thereby create the conditions for an entirely different set of people to come into existence, in what sense can those future people be said to have been wronged by our decision, and does that dissolve the moral urgency of preservation?

  Please don't explain the ethical theories to me directly; instead, plan the explanatory arc for the students. What conceptual dependency has to be firmly in place—perhaps a distinction between intrinsic and instrumental value applied to non-terrestrial entities, or a clear framing of intergenerational justice—before the preservation-versus-expansion tension registers as genuinely philosophical rather than merely technological? Which single carrying case should anchor the discussion: the terraforming of Mars against the possibility of indigenous microbial life, a hypothetical permanent settlement of Europa's subsurface ocean, or a closer analog like Antarctic research stations versus sovereign settlement, and what must that example include and exclude to keep the conceptual pressure visible? In what sequence will the students likely raise objections—perhaps first that Earth is already uninhabitable so departure is obligatory, then that barren landscapes have no moral standing, then that future colonists would retrospectively endorse the choice—and at precisely which point in the arc should each objection be absorbed rather than deferred? I anticipate they will misunderstand the non-identity problem by conflating "no specific person is made worse off" with "no harm occurs at all"; where in the sequence should I head that misconception off, and what related confusion about counterfactual identity should I anticipate next? Finally, what one check—whether a targeted question, a brief written exercise, or a structured debate—would reveal whether they have grasped that the difficulty is structural and not resolvable by simply weighing human survival against geological preservation, and what should I explicitly leave unresolved or refuse to settle at this undergraduate level?
reasoning: |-
  Okay, let me unpack this rich seminar design request. The user is an environmental philosophy instructor planning a 90-minute advanced undergrad session on space ethics, specifically focusing on the non-identity paradox in Martian terraforming. They want to avoid theory lectures and instead craft a conceptual journey where students discover the structural tension themselves.

  Hmm... the core challenge is making the non-identity problem feel visceral rather than abstract. The instructor seems frustrated by how students often reduce this to simple harm-balancing. I notice they're particularly concerned about two predictable misconceptions: conflating "no specific person harmed" with "no harm done," and missing how counterfactual identity changes the moral calculus. 

  Right, first I need to establish why this isn't just an engineering trade-off. The preservation-vs-expansion debate only becomes philosophically interesting when students firmly grasp two things: that non-Earth environments could have intrinsic moral standing (not just instrumental value for humans), and that intergenerational justice applies to unconceived beings. Without these, the discussion stays superficial.

  For the anchoring case study... Mars terraforming works best because it's concrete but still speculative. Europa's ocean might distract with too many unknowns, and Antarctic analogies earthify the problem. The Mars example must exclude current political feasibility though - this is about principle, not NASA budgets. Crucially, it needs hypothetical but plausible Martian microbes as moral patients, otherwise preservationist concerns collapse.

  Ah, and the objection sequence! Students will likely: 
  1) Panic about Earth's collapse (must absorb early) 
  2) Deny moral standing to rocks (needs addressing before non-identity intro) 
  3) Assume future Martians would thank us (perfect setup for non-identity reveal). 

  The critical teaching moment comes when they realize Question A (did we harm specific future people?) and Question B (was the act morally wrong) aren't the same. That's when I'd insert the misconception-block: "Notice how even if no Martian is worse off, we might still have destroyed something valuable..."

  For the comprehension check, a forced-choice exercise could work: "Argue against terraforming without mentioning harm to humans or future beings." That exposes whether they see the structural gap. And we must leave unresolved whether intrinsic value can outweigh species survival - that's grad-level terrain.

  The elegance here is making the non-identity problem emerge from their own reasoning rather than being lectured. By the end, they should feel the weight of moral uncertainty, not just "answered" a dilemma.
answer: |-
  Here’s a structured seminar plan designed to guide advanced undergraduates through the philosophical tension, anchored in the non-identity problem, while preempting conceptual pitfalls:

  ---

  ### **Explanatory Arc & Conceptual Dependencies**
  **1. Establish the Stakes (15 mins)**  
  - **Hook:** *"Is Mars ours to transform if it means ensuring human survival?"*  
  - **Prerequisite Framing:**  
    - **Intrinsic vs. Instrumental Value:** Contrast "Mars as a resource" (instrumental) vs. "Mars as a **moral patient**" (intrinsic value independent of human use). Use *Antarctica* as a terrestrial analog: preservation treaties exist despite no indigenous humans, implying non-utilitarian value.  
    - **Intergenerational Justice:** Clarify that obligations to future people extend beyond immediate descendants to *potential* beings.  

  **2. Anchor Case: Terraforming Mars & Microbial Life (Core Tension)**  
  - **Why this case?** It balances scientific plausibility (perchlorate-resistant microbes), existential urgency, and clear moral patients (potential life).  
  - **Exclusions:** Avoid political/technical feasibility (e.g., cost, radiation). Focus solely on:  
    - *Preservationist claim:* Altering Mars destroys unique evolutionary history.  
    - *Expansionist claim:* Terraforming creates future human lives otherwise impossible.  
  - **Pressure Point:** "If we *prevent* these future lives by *not* terraforming, is that a moral loss?"  

  **3. Sequence & Objection Management**  
  | **Stage**               | **Content**                                                                 | **Likely Objections**                                  | **When to Address**                          |  
  |--------------------------|-----------------------------------------------------------------------------|--------------------------------------------------------|----------------------------------------------|  
  | **A. Preservation Duty** | Argue for Mars’ intrinsic value (e.g., "Rolstonian wild value").             | *"Mars is barren—no life = no moral standing."*        | **Immediately:** Distinguish "lifeless" from "potentially life-harboring." Use *Europa* as a foil (if life exists, duties strengthen). |  
  | **B. Survival Imperative**| Frame multi-planetaryism as species resilience.                             | *"Earth is dying—we *must* leave!"*                    | **Early:** Grant urgency but note: "Does desperation nullify preservation duties?" (Absorb here to avoid derailment). |  
  | **C. Introduce Non-Identity Problem** | "Terraforming creates *different* future persons. Can they be harmed by the act that enabled their existence?" | *"Future Martians would endorse terraforming!"*        | **Here:** Use this objection to *transition* into non-identity. "But *would* they exist to endorse it if we chose preservation?" |  

  **4. Navigating Non-Identity Pitfalls**  
  - **Preempt Misconception:** After stating non-identity, immediately add:  
    > *"Key Clarification: Saying ‘no specific person is harmed’ ≠ ‘no wrong is done.’ The wrong might be to *value* (e.g., destroying ancient life) or to *justice* (e.g., privileging one future population over another)."*  
  - **Anticipate Next Confusion:** Students will conflate *harm to individuals* with *moral wrongness of the act*. Prepare a counterfactual:  
    > *"If we choose preservation, Group A (Earth descendants) exists. If we terraform, Group B (Martians) exists. Is choosing B over A *unfair*—even if neither group is ‘harmed’?"*  

  **5. Comprehension Check: Structured Debate (20 mins)**  
  - **Prompt:** *"Defend either position WITHOUT using survival/preservation trade-offs. Ground your argument in:*  
    - *(a) The non-identity problem’s implications, OR*  
    - *(b) The intrinsic value of Mars."*  
  - **Why this works:** Forces students to engage the structural dilemma. If they revert to "human survival trumps all" or "life is sacred," they’ve missed the point.  

  **6. Explicitly Unresolved (5 mins)**  
  - **Refuse to Settle:**  
    - Whether intrinsic value can outweigh species survival.  
    - Whether "creating different persons" voids duties to *possible* futures.  
  - **Seed Further Inquiry:** *"This isn’t about solving the tension—it’s about seeing why it resists solution. What *kind* of ethics might resolve it? (e.g., capabilities approach, deep ecology?)"*  

  ---

  ### **Why This Sequence Works**  
  - **Dependency Flow:** Values → Duties → Non-Identity ensures students see *why* the problem is philosophical (it challenges the very framework of harm/benefit).  
  - **Mars Case Focus:** Microbial life makes preservation concrete; terraforming makes identity salient. Europa/ Antarctica distract (too alien or too familiar).  
  - **Pitfall Mitigation:** Addressing "no harm = no wrong" early prevents derailment. The debate reveals if they grasp structural paralysis.  
  - **Ends in Aporia:** Leaving the tension unresolved models philosophical honesty—undergraduates should feel the weight of the problem, not a false solution.  

  **Optional Adjustment:** If students struggle, inject a 5-min written reflection: *"Write one sentence explaining why ‘future Martians aren’t harmed’ doesn’t end the debate."* Use responses to refine the discussion.
