answer: |-
  Here are five numbered points analyzing Richmond's memory struggles through a comparative lens, with your specified constraints:

  1.  **Framework Expectation:** As a post-defeat society (without formal surrender), the framework (especially Germany's *Vergangenheitsbewältigung*) suggests Richmond *should* be actively dismantling Confederate symbols (statues, school names) through official institutions and promoting critical public education to confront the "defeat's" core cause: slavery and white supremacy.  
  2.  **Actual Resemblance:** Richmond currently resembles **postwar Japan more than Germany**; it displays selective, contested, and incomplete reckoning – removing the *most* overt symbols (Lee statue, some schools) while deeply embedded Lost Cause narratives persist in cultural memory and political resistance, mirroring Japan's focus on victimhood and silence on aggression/colonialism.  
  3.  **Analogy Collapse:** The comparison collapses because **there was never a unified, imposed state-level reckoning** (like denazification or the Tokyo Trials); Confederate ideology was rehabilitated *within* the victorious US state via federal compromises (Reconstruction's end) and local "Lost Cause" myth-building, preventing a clean break.  
  4.  **Guilt vs. Shame & Myth-Swapping:** Your aunt is partially right; current actions often reflect a shift from Lost Cause "shame" (defeat as tragic loss of nobility) towards a critical narrative, but **"guilt" (accepting active perpetration) remains contested** – renaming debates show we risk swapping myths (heroic Confederates vs. *only* evil Confederates) rather than fully grappling with complex complicity and systemic legacies.  
  5.  **Theory's Silence:** The comparative framework is **silent on the visceral, multi-generational trauma of place** – how daily encounters with renamed schools or empty pedestals force personal reckonings in real-time within families and communities, a raw, non-bureaucratic process absent in state-imposed models.
