answer: |-
  ### (1) Reconstruction of the Passage (≈150 words)  
  In *On Denoting* (1905), Russell argues that definite descriptions (e.g., "the F") are not genuine referring expressions but **incomplete symbols** analyzed via quantification. For a statement like "The F is G," the logical form asserts three things:  
  (i) **Existence** (∃x Fx),  
  (ii) **Uniqueness** (∀y (Fy → y=x)), and  
  (iii) **Attribution** (Gx).  
  Applied to negative existentials (e.g., "The present King of France is not bald"), Russell identifies an ambiguity: negation can target either (a) the *entire existential claim* ("There is no such king"), or (b) the *attributive component* ("There is a unique king, and he is not bald"). This avoids treating "the present King of France" as a referring term, circumventing the puzzle of how we can meaningfully discuss non-existent entities. Existence becomes a quantificational property of propositions, not of objects.  

  ---

  ### (2) Scope Analysis: Primary vs. Secondary Occurrence (≈250 words)  
  Russell resolves ambiguity via **scope distinctions** for negation relative to the quantified description:  

  - **Primary (Wide-Scope) Occurrence**:  
    Negation takes scope over the entire proposition.  
    *Example*: "The present King of France is not bald" →  
    **¬∃x [Kx ∧ ∀y (Ky → y=x) ∧ Bx]**  
    *Translation*: "It is not the case that there exists a unique King of France who is bald."  
    This denies existence/uniqueness (true in 2024).  

  - **Secondary (Narrow-Scope) Occurrence**:  
    Negation targets only the attributive clause.  
    *Example*: Same sentence →  
    **∃x [Kx ∧ ∀y (Ky → y=x) ∧ ¬Bx]**  
    *Translation*: "There exists a unique King of France who is not bald."  
    This presupposes existence (false in 2024).  

  #### Key Mechanics:  
  - The uniqueness clause (∀y (Ky → y=x)) binds the variable to a single satisfier of "K" (King of France).  
  - In primary occurrences, **¬** negates the conjunction of existence, uniqueness, and attribution.  
  - In secondary occurrences, **¬** applies *within* the scope of the quantifier, modifying only the predicate (e.g., ¬Bx).  
  - Truth conditions diverge radically: Primary readings can be true when no referent exists; secondary readings require existence and are false if no referent obtains.  

  ---

  ### (3) Metaphysical Assessment (≈150 words)  
  Russell’s resolution **dissolves the linguistic dimension** of the metaphysical puzzle but **does not engage ontology directly**. By reducing "the F" to a quantificational structure, he eliminates the need for *singular reference to non-existents*: we speak not *of* "the King" but *about* the world’s failure to satisfy a descriptive condition. However, this is a **syntactic relocation**, not a metaphysical solution. It clarifies *how* we assert non-existence without referring to non-beings but leaves untouched deeper questions:  
  - Why do certain descriptions (e.g., "unicorn") fail to denote?  
  - What grounds the truth of negative existentials?  
  Russell’s theory addresses *semantic coherence*—enabling meaningful statements about absence—but defers metaphysics to the interpretation of quantifiers and predicates. The "problem" persists for those seeking an ontology of absence.  

  ---

  ### (4) Note on Institutional Extension (≈150 words)  
  Russell’s framework **extends naturally to institutional reference failure** with minor adjustments. Consider "the sovereign authority of regime X dissolved by regime Y":  
  - **Logical Form**:  
    ∃x [Sx ∧ Authority(x, X) ∧ ∀y (Sy ∧ Authority(y, X) → y=x) ∧ Dissolved(x, Y)]  
  - **Reference Failure**: If regime Y legally nullifies X’s sovereignty, the uniqueness/existence clauses fail *within the institutional ontology* (e.g., no x satisfies "Authority(x, X)" post-dissolution).  
  - **Advantage**: Russell avoids reifying "ghost institutions" by treating failure as a quantificational falsehood.  
  - **Tension**: Institutional existence relies on social constructs, not physical presence. Russell’s physicalist ontology may need supplementation with **normative predicates** (e.g., "LegallyValid(x)"). Yet his core machinery—analyzing existence via context-bound quantification—remains robust if institutional domains are modeled as predicate restrictions (e.g., ∃x *in Legal Framework L* [Fx]). This preserves the syntax/metaphysics distinction while accommodating normative contexts.  

  ---  
  **Suggested Citation for Your Chapter**:  
  Russell, B. (1905). On Denoting. *Mind*, 14(56), 479–493.
