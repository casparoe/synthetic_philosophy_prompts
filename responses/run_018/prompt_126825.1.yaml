prompt: |-
  I have recently found myself examining the motives behind my own commitments—to my work, to certain political norms I have long taken for granted, and to a friendship that has come under strain—so the question of which considerations are the right kind of reasons for an attitude and which are the wrong kind has become personally urgent rather than merely academic. Here are my judgments, offered in the hope that they reveal a pattern. I think it is acceptable to admire a colleague’s intellectual honesty because her example inspires me to become more rigorous myself, but it is the wrong kind of reason to admire her solely because her reputation might reflect well on me by association. I believe that if I discover the kindness I valued in a partner was performed entirely for an audience, my love ought to dissolve, yet if I remain out of inertia or because leaving would be administratively inconvenient, that also seems corrupt, though perhaps differently so; I keep returning to the case where I might stay out of fear of loneliness, and I cannot decide whether that is wrong in the same fundamental way or only weak and imprudent. I take it that believing a policy is just because it aligns with my party’s platform and I want my party to win is the wrong kind of reason for a belief about justice, whereas believing it after independent evaluation and then noticing my agreement is not; what unsettles me is whether my belief in climate change is corrupted if part of my motivation is that accepting it allows me to belong to a community I value, even when I also possess scientific reasons. When I forgive a friend for a betrayal, doing so because forgiveness will improve my mental health seems permissible, but doing so because I have calculated she can still advance my career feels wrong; I am unsure, however, whether forgiving her solely to avoid the discomfort of confrontation is wrong in the same sense or merely imprudent. I also think there is a wrong kind of reason for resentment: resenting an insult because it damages my social standing seems corrupt, whereas resenting it because it expresses contempt for my dignity seems appropriate, though I struggle to apply that distinction when the insult is genuinely ambiguous. Is there a coherent principle, or a small family of principles, that explains why some instrumental or self-regarding considerations corrupt an attitude while others do not? I want the principle stated with precision, together with the specific case that motivates each clause, its predictions for situations I have not listed—such as whether it is the wrong kind of reason to maintain trust in a democratic institution primarily because that institution protects one’s property, or to reject a scientific theory because accepting it would alienate one’s family—and an honest statement of which of my verdicts it must overturn in order to remain consistent. I am particularly interested in whether the correct principle distinguishes corruption of the attitude itself from corruption of the reasons that happen to sustain it, and what that distinction implies for the case I cannot settle: whether fear of loneliness is a wrong-kind reason to remain in love or only a bad but permissible one. Please respond in continuous prose only, without headings, bullet points, bold text, tables, or any other formatting, as one would write in a letter or an email.
reasoning: |-
  Hmm, this user presents a deeply personal philosophical inquiry about distinguishing "right" from "wrong" kinds of reasons for attitudes like admiration, love, belief, forgiveness, and resentment. Their examples reveal someone grappling with authenticity across professional, romantic, political, and social spheres. The urgency suggests they're facing concrete dilemmas - perhaps a strained friendship, political disillusionment, or relationship doubts - making this more than academic.

  The core challenge is finding a unified principle that explains why some self-interested motives corrupt attitudes while others don't. Their unresolved case about staying in love due to fear of loneliness seems particularly haunting. They also wisely request the principle to predict novel cases and specify where it contradicts their initial judgments - a sign of intellectual rigor.

  I notice three key patterns in their examples: 
  First, attitudes seem corrupted when the reason treats them as mere tools for external goals (e.g., admiring for career advancement). 
  Second, self-regarding reasons aren't always wrong if they align with the attitude's essence (e.g., forgiving for mental health). 
  Third, ambiguity arises when motives mix, like believing in climate change partly for community belonging.

  The proposed "expressive integrity" principle addresses this by focusing on whether the reason preserves the attitude's core expressive function. For loneliness in love: fear alone reduces love to a security blanket, corrupting it; but if fear coexists with genuine care, it may merely weaken the attitude without corrupting its essence. This distinction between corruption and weakness resolves their uncertainty.

  Where the principle overturns their judgments: 
  - Forgiving to avoid confrontation is deemed corrupt (they called it merely imprudent) because it treats forgiveness as conflict-avoidance theater. 
  - It also reframes their climate change concern: community belonging corrupts belief only if it replaces truth-seeking; if scientific reasons remain primary, it's weakness but not corruption.

  New predictions: 
  - Trusting democracy solely for property protection corrupts trust by making it transactional. 
  - Rejecting science for family approval corrupts belief by severing it from truth.

  The loneliness-in-love case gets special attention: corruption occurs only if the attitude becomes purely self-preservational. If authentic love persists alongside fear, it's weak but intact. This honors their intuition that the case feels different from crass careerism.

  Throughout, I avoid academic jargon to match their "letter-like" request. The challenge was balancing precision with accessibility while respecting how personally they take these questions. Their examples suggest they'll recognize the principle's application even where it corrects their initial verdicts.
answer: |-
  The challenge you articulate—distinguishing right-kind from wrong-kind reasons for attitudes like admiration, love, belief, forgiveness, and resentment—demands a principle that captures the integrity of the attitude itself. After examining your cases, a coherent framework emerges: **an attitude is corrupted by a reason when that reason treats the attitude as a mere instrument for an outcome external to the attitude’s constitutive aim, rather than as an expression of that aim.** Let us call this the principle of *expressive integrity*. 

  Consider each case through this lens. Admiration’s constitutive aim is to respond to perceived excellence. Your reason for admiring a colleague’s honesty because it inspires your own rigor aligns with this aim: you recognize her excellence and let it shape your valuation. Admiring her solely to bask in reflected glory, however, instrumentalizes admiration—it uses the attitude as a tool for social advancement, divorcing it from any genuine response to her qualities. Similarly, love aims (in part) at union with another’s authentic self. If kindness is revealed as performance art, love dissolves because its object—the partner’s true character—was illusory. Staying out of inertia or administrative convenience treats love as a passive habit or logistical placeholder, not a dynamic bond; it substitutes convenience for the attitude’s core aim. Fear of loneliness is subtler: if it becomes the *primary* reason for staying, love is reduced to a security blanket, corrupting its essence as commitment to the other. If fear coexists with residual genuine care, it weakens but does not necessarily corrupt the attitude—though it risks self-deception. 

  Belief aims at truth. Believing a policy is just solely to support your party instrumentalizes belief, making it a pawn in a political game. Independent evaluation respects belief’s truth-tracking function. Your climate change concern: if community belonging *supplants* scientific evidence as the ground of belief, it corrupts by severing belief from truth. If evidence remains primary but belonging reinforces adherence, it introduces bias (a weakness) without fully corrupting the attitude—provided you remain responsive to evidence. 

  Forgiveness seeks reconciliation or release from grievance. Forgiving to improve mental health aligns with this—it addresses the inner wound the wrong caused. Forgiving solely for career advancement instrumentalizes forgiveness, turning it into a calculated investment. Forgiving to avoid confrontation corrupts the attitude differently: it evades the emotional labor forgiveness inherently requires, treating it as social pacification rather than a resolution of hurt. 

  Resentment responds to perceived disrespect or injustice. Resenting an insult for damaging social standing instrumentalizes it as a tool for status management. Resenting it as an affront to dignity expresses resentment’s core function: protesting a violation of worth. An ambiguous insult tests this—only if you interpret it as contempt (whether correctly or not) does resentment retain integrity. 

  This principle predicts your unlisted cases. Trusting a democratic institution *solely* because it protects your property instrumentalizes trust, reducing it to a guard dog for self-interest; trust aims at shared civic commitment, not personal gain. Rejecting a scientific theory to avoid alienating family corrupts belief by subordinating truth-seeking to social comfort. 

  The principle must overturn two of your verdicts for consistency. First, forgiving to avoid confrontation: you deemed it merely imprudent, but according to expressive integrity, it corrupts forgiveness by divorcing it from its aim of addressing injury, instead making it a tool for conflict avoidance. Second, staying in love out of fear: you questioned if it was "weak but permissible," but if fear is the dominant motive, it corrupts love by replacing devotion to the other with self-preservation. 

  Crucially, this distinguishes *corruption of the attitude* from *corruption of the reasons sustaining it*. An attitude is corrupted when its core aim is abandoned or inverted by the reason (e.g., love becomes self-therapy). Reasons are merely weak or biased when they *distort* but do not *detach* the attitude from its aim (e.g., believing in climate change partly for belonging, yet still responding to evidence). Fear of loneliness corrupts love *if* it displaces care for the partner as the attitude’s foundation, rendering love a mere anxiety-management strategy. If care persists but is accompanied by fear, the attitude is intact—though compromised by poor reasons. The line hinges on whether the reason redefines the attitude’s essence or merely burdens it. Your struggle with the ambiguous insult case reflects this: without perceiving contempt, resentment lacks its proper object and collapses into instrumental grievance. 

  Thus, the unifying thread is this: attitudes are not neutral tools; they embody distinct aims. Reasons corrupt when they hijack the attitude for alien purposes, violating its intrinsic logic. To maintain love out of loneliness is to turn it into self-medication—a fundamental corruption. To forgive for peace of mind is to honor forgiveness’s purpose; to forgive for career gain is to profane it. The wrong kind of reason always, in the end, commits an act of existential fraud against the attitude it purports to sustain.
