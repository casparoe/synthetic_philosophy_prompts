  Let me develop this. Imagine a sociology department dominated by critical theory. Junior scholars learn quickly that questioning foundational theorists like Foucault invites career-limiting labels ("reactionary", "naïve empiricist"). The exclusion isn't structural - dissenting papers might technically get submitted - but they're dismissed through ritualistic credibility deflation. 

  The conceptual tension here is fascinating. Standard taxonomy says bubbles lack exposure while echo chambers actively discredit. But this case shows both: lack of exposure due to preemptive silencing, and systematic discrediting when exposure occurs. It's like a bubble maintained by echo chamber tactics.

  For resolution... creating a third category feels messy. Maybe reframing as dimensions? "Exposure deficiency" on one axis, "systematic discrediting" on the other. This hybrid would score high on both. That preserves the original concepts while accommodating hybrids.

