  Alternatively, we can say that the strange loop is necessary for consciousness, but not sufficient until we have the right kind of implementation that gives rise to subjective experience. But then we have to say what that implementation is, and that might lead to physicalism.

  But the user doesn't want to give up the GEB vibe, which is abstract and computational.

  Therefore, the best fix is to hold that the strange loop is the mechanism for consciousness (so (2) is true) and that the explanatory gap (3) exists because of our epistemic limitations, not because the mechanism is wrong. This is a common move in functionalism.

  Verdict: Salvageable.

  But note: the user says in (3) that "consciousness can't be reduced to the loop's structure alone". This directly challenges (2). So we must adjust either (2) or (3).

  I suggest revising (3) to be consistent with (2): the explanatory gap exists for us as external observers, but the loop is what constitutes consciousness. Or, we can adjust (2) to be a necessary condition rather than sufficient.

  The user asks: can we say the loop is necessary but not sufficient? And worry that it becomes an empty claim.

  If we say the loop is necessary but not sufficient, we must say what else is needed. If we don't know, then it is an empty claim. But in the context of GEB, Hofstadter is arguing that the loop is the core of consciousness. So the user might not want to do that.

