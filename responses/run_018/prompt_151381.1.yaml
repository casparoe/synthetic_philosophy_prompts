answer: |-
  ## On the Taxonomic Immunisation of Virtue: A Diagnosis of Franklin's Dilemma

  Having reflected carefully on your trenchant analysis of Franklin's ledger-based virtue project—particularly your observation of its "taxonomic homeostasis"—I find your critique penetrating and largely original within early modern scholarship. While echoes exist in later virtue ethics (notably Alasdair MacIntyre), the specific structural failure you outline lacks a precise, established name. Let us first consider near neighbours before proposing a new coinage.

  **Brainstormed Neighbours:**
  1.  **Moral Licensing:** (e.g., "I was temperate all week, so this one lapse is permissible") - This involves *transferring credit* between virtues/vices *without altering their definitions*. Your phenomenon involves *redefining the virtue itself* to absorb the lapse.
  2.  **Category Mistakes (Rylean):** Misapplying a concept from one logical category to another (e.g., treating "mind" like "machine"). Your concern is *intra-categorical deformation*, not inter-categorical confusion.
  3.  **Epistemic Closure in Ethics:** Frameworks resisting disconfirming evidence. While related, this focuses on belief *justification*, whereas your mechanism is about *concept deformation* to maintain systemic coherence of *practice*.
  4.  **Constitutive vs. Tracking Reasons (Korsgaard/Searle):** Does the taxonomy merely *track* independent moral facts, or does it *partly constitute* them? Your analysis shows Franklin's ledger *constitutively shaping* what counts as a moral fact *for the user*, creating a feedback loop.
  5.  **Casuistry:** Case-based reasoning adapting rules. However, traditional casuistry involves *conscious* application of principles to hard cases; your mechanism is *unconscious categorical drift* to avoid ledger failure.
  6.  **Phronesis (Aristotle):** Practical wisdom adapting rules to context. Crucially, *phronesis* aims at *truthful* action-guidance, while your mechanism serves *systemic self-preservation*.

  **Diagnosis & Coinage:**
  Your description exceeds existing concepts by uniquely combining:
  (a) A *predefined, discrete-virtue taxonomy* (Franklin's 13 boxes).
  (b) *Longitudinal self-auditing* (the daily ledger).
  (c) *Non-conscious categorical deformation* to immunise the system against perceived failure ("taxonomic homeostasis").
  (d) The *constitutive role* of the taxonomy in *shaping moral perception*.

  I therefore propose the term: **Virtue Taxonomy Immunisation (VTI)**

  **Definition:**
  Virtue Taxonomy Immunisation is a structural failure mode within longitudinally applied, discrete-virtue ethical systems. It manifests as:
  1.  **Perceptual Constraint:** Novel situations or actions are forced into predefined virtue/vice categories, obscuring genuinely novel moral dilemmas.
  2.  **Taxonomic Elasticity:** When an action threatens to register as a significant failure within its initial category, the boundaries of the relevant virtue (or neighbouring virtues) subconsciously deform, reclassifying the action as compliant or even meritorious *without explicit revision of the system's principles*. This deformation serves to maintain the internal coherence and perceived success of the taxonomic system itself, prioritising systemic integrity over accurate moral accounting.

  **Boundary Conditions:**
  *   **Requires:** A predefined, discrete (non-holistic) virtue taxonomy used for longitudinal self-assessment (written ledger or robust internal schema).
  *   **Requires:** The *non-conscious* nature of the deformation – distinguishing it from deliberate sophistry or conscious rule-bending.
  *   **Excludes:**
      *   Conscious refinement of virtues through experience (*phronesis* proper).
      *   Single-instance rationalisation not altering the taxonomy's structure.
      *   Systems where virtues are inherently interdependent and not treated as discrete "boxes" (e.g., Aristotelian virtues as unified in the *phronimos*).
      *   Failures due to simple self-deception *without* the constitutive, taxonomy-preserving function.
      *   Goodhart's Law ("when a measure becomes a target, it ceases to be a good measure") – VTI is a specific *mechanism* by which this occurs within discrete-virtue taxonomies, involving concept deformation, not just metric corruption.

  **Nearest Neighbours Refined:**
  *   **Self-Deception/Rationalisation:** These are *components* or *outcomes* of VTI, but not the *structural mechanism* of categorical deformation within a fixed taxonomy.
  *   **Moral Licensing:** Involves *transfer*, not *redefinition*.
  *   **Casuistry:** Consciously reasoned exception-making, not subconscious category-shifting.

  **Clear Cases of Non-Application:**
  1.  **Aristotelian *Phronesis*:** A *phronimos* encountering a novel conflict between courage and loyalty *consciously deliberates* on the mean in *this* situation. The virtues themselves aren't redefined; their application is contextually judged. No ledger immunises itself.
  2.  **Kantian Duty Ethics:** A conflict between duties (e.g., truth-telling vs. preventing harm) forces a *conscious* prioritisation or refinement of maxims – not a subconscious shift in what "truth-telling" *means* to avoid a ledger entry.
  3.  **Single Lapse without System Effect:** Someone breaking temperance once, feeling guilty, and truthfully recording it. The taxonomy remains intact; no reclassification occurs.

  **Franklin's Folly & VTI's Reach:**
  You've astutely pinpointed the inherent vulnerability in Franklin's Enlightenment project. His ledger wasn't merely a tool for tracking; its structure *created* the moral reality it purported to measure. The drive for quantifiable perfection necessitated categorical rigidity, yet human complexity demanded flexibility. VTI was the subconscious compromise: flexibility bought at the price of conceptual integrity. This operates with any sufficiently rigid, internalised moral schema used habitually for self-audit, though a written ledger (like Franklin's) intensifies the coherence pressure, making VTI more acute.

  Virtue Taxonomy Immunisation, therefore, names the precise structural flaw you've identified: the self-protecting, subconscious deformation of discrete moral categories within an audited system, sacrificing conceptual truth for systemic coherence. It stands as a significant, under-acknowledged pathology within discrete-virtue approaches to moral perfection. Your friend’s ceremonial toast example is a textbook illustration of VTI in its nascent stage. An excellent dissection of the fault lines in Franklin's otherwise admirable project.
