  ### Scenario
  Maya volunteers at a community garden, coordinating teams for weekend shifts. During Saturday sessions (in-person), she consistently notices overwhelmed volunteers, offering to take over their watering tasks with encouraging remarks. On Sundays, she leads identical tasks via video call using shared task-tracking software. When volunteers express fatigue over video, Maya acknowledges their messages but briskly assigns them efficiency tips without offering help, citing shared deadlines. She genuinely believes she's equally supportive in both settings, attributing any complaints about her Sunday demeanor to volunteers' "oversensitivity to remote communication."

  ### Analysis
  1. **Behavior & Method**:  
     Compassionate behavior (in-person): Proactively assists overwhelmed volunteers.  
     Callous behavior (video): Dismisses fatigue with perfunctory advice.  
     **Situational variable**: Physical co-presence vs. screen-mediated interaction.  

  2. **Nearby Worlds**:  
     - Identical garden task, same volunteers, same time pressure.  
     - Shift only the interaction medium (physical → video or vice versa).  

  3. **Virtue Ethics Reading**:  
     *Compassion manifests as context-sensitive practical wisdom*.  
     In-person, Maya perceives nonverbal cues (trembling hands, slumped posture) as moral reasons to act. Video obscures these cues, preventing her from recognizing legitimate distress. Her failure stems not from lacking compassion, but from underdeveloped *moral perception* in screen-based contexts—a skill gap in her practical wisdom.  

  4. **Situationist Reading**:  
     *Pure situational determinism, no stable trait*.  
     Co-presence triggers automatic helping behaviors via evolved social cognition. Video creates psychological distance, activating transactional norms. The identical core situation (volunteer fatigue) elicits opposite behaviors based solely on medium. Maya's belief in consistent kindness is a post-hoc self-deception narrative.  

  5. **Conceptual Work Feature**:  
     **Granularity of self-knowledge**. Maya’s explicit belief ("I’m kind") operates at an abstract level, masking context-dependent variations in her responsiveness to moral reasons. Virtue ethics requires context-specific self-awareness to align belief with action.  

  6. **Collapse Condition**:  
     Remove Maya’s *explicit belief in consistency*. If she acknowledged varying behavior, virtue ethics could no longer claim her virtue is intact (as self-knowledge is essential), while situationism would strengthen (exposing trait illusion).  

  7. **Virtue Defense Pushback**:  
     Virtue ethicists argue virtues *responsively track morally relevant features*, not rigidly repeat actions. Sunday’s video setting lacks bodily cues that objectively justify helping—thus Maya’s inaction reflects reasonable (if imperfect) assessment of available reasons. Her flaw is insufficiently attuning to *reasons unique to digital contexts* (e.g., vocal strain in audio), not absent compassion.

