prompt: |-
  Hey, I'm putting together prompts for a philosophy dataset and I'm kind of stuck. I'm taking a course on virtue ethics and the situationist critique is making my head spin — especially because every example I see is either Milgram-style obedience or those classic psychology experiments about helping strangers, and those feel totally overused by now. I was arguing with my friends about whether virtue can survive if behavior is mostly driven by tiny contextual cues, and we went in circles.

  Can you design a thought experiment for me? I want it realistic — like a hybrid workplace or community volunteer group, one paragraph max, definitely no trolleys or sci-fi. The setup: a person behaves with what looks like real compassion in one setting, then behaves callously in an almost identical setting, with only one subtle situational feature changed (maybe seating arrangment, ambient noise, or whether it's over video). Here's the twist: the agent has a mistaken explicit belief about her own character — she thinks she's consistently kind — and that self-misunderstanding needs to be part of the analysis. The case should be built so a virtue ethicist can plausibly argue the difference shows context-sensitive practical wisdom or moral attention rather than missing virtue, while a situationist can plausibly claim it's pure situational determinism with no stable trait behind it. Both should be genuinely available from the same facts.

  Then walk through it: state the behavior and method, the nearby worlds, why each side gives its verdict, and identify the exact conceptual feature doing the work — maybe something about self-knowledge or trait granularity. Say what happens if you remove that feature. Finish with how a virtue defender would push back, maybe by appealing to moral perception or the idea that virtues respond to reasons that shift with context. Don't ask me for citations or a bibliography — I can't check those. And don't quote philosophers verbatim; paraphrase instead.

  At the end, summarize everything in a JSON object with these fields: "scenario", "situational_variable", "virtue_reading", "situationist_reading", "work_feature", "collapse_condition", "virtue_defense". Each should be a string.
reasoning: |-
  We are designing a thought experiment that is realistic and set in a hybrid workplace or community volunteer group. The scenario should involve a person who behaves compassionately in one setting and callously in an almost identical setting, with only one subtle situational feature changed. The person has an explicit belief that they are consistently kind, but this is mistaken. The case must allow for two plausible interpretations: one from virtue ethics (emphasizing context-sensitive practical wisdom) and one from situationism (emphasizing situational determinism without stable traits).

  We'll create a scenario that meets these criteria.

  **Scenario:**
  In a hybrid workplace, Maya participates in weekly team meetings: one in-person in a quiet conference room with a circular table, and another virtually via video call with a grid layout of faces. In the in-person meeting, when a colleague expresses anxiety about a deadline, Maya leans forward, makes eye contact, and offers to help reprioritize tasks. In the virtual meeting, when another colleague shares a similar concern, Maya remains expressionless behind her screen, gives a generic "you'll manage" response, and moves the agenda forward. Maya believes herself to be consistently kind and attributes any variation to others' perceptions.

  **Situational Variable:** 
  The mode of meeting (in-person vs. virtual) and the associated environmental cues (physical presence, seating arrangement, and the nature of eye contact).

  **Now, we break it down:**

  1. **Behavior and Method:** 
     - Compassionate behavior: In-person, Maya offers concrete help with reprioritization.
     - Callous behavior: Virtually, Maya dismisses the concern and moves on.
     - The only changed feature is the meeting mode (in-person vs. virtual) and the subtle cues that come with it (e.g., the ability to make natural eye contact, physical proximity, and the circular table fostering a sense of equality vs. the grid layout and screen barrier).

  2. **Nearby Worlds:**
     - In a nearby world where the virtual meeting is replaced by an in-person one (with the same colleagues and agenda), Maya would likely show compassion again.
     - In a nearby world where the in-person meeting becomes virtual (same context), Maya would likely be dismissive.

  3. **Virtue Ethics Reading:**
     - Maya possesses the virtue of compassion, but it is context-sensitive. Practical wisdom (phronesis) requires perceiving moral reasons in each situation. In-person, the cues (body language, tone) make the colleague's distress salient, so Maya responds compassionately. Virtually, the same distress signals are obscured (flattened by video, lack of presence), so Maya fails to attend to the moral reasons. Thus, the virtue is present but requires appropriate conditions for perception. The self-misunderstanding arises because Maya hasn't cultivated the skill of moral attention in virtual contexts.

  4. **Situationist Reading:**
     - There is no stable trait of compassion. Behavior is determined by the situation: physical presence triggers helping behavior, while the virtual setting (with its psychological distance and reduced accountability) triggers indifference. The belief in consistent kindness is an illusion created by self-narrative biases. The variation in behavior across nearly identical settings (only mode differs) shows that situational cues, not character, drive actions.

  5. **Conceptual Feature Doing the Work:**
     - The key feature is the **agent's capacity for moral perception** in different contexts. Virtue ethics relies on the idea that virtues are expressed through context-dependent perception of reasons, while situationism denies stable traits and emphasizes the power of situations to override dispositional tendencies.

  6. **Collapse Condition:**
     - Remove the agent's mistaken self-belief. If Maya were aware of her inconsistency and attributed it to the meeting mode (e.g., "I'm less compassionate online"), then the virtue ethics reading would weaken (because self-knowledge is part of virtue) and the situationist reading would strengthen (as it highlights situational control). Alternatively, if the situational variable were made irrelevant (e.g., if Maya received training in virtual empathy), the virtue ethics reading could be maintained by showing that the virtue can be extended with effort.

  7. **Virtue Defense Pushback:**
     - A virtue ethicist could argue that virtues are not rigid dispositions but intelligent responses to shifting contexts. The virtual setting fails to provide the perceptual cues that normally trigger compassion, but this doesn't mean the virtue is absent—it means the agent must develop new perceptual skills (e.g., learning to read virtual cues) and that virtues are reasons-responsive. The inconsistency reveals a flaw in moral education, not in virtue itself. The self-misunderstanding is a failure of self-reflection, which is a separate component of virtue that can be cultivated.

