    "virtue_defense": "Virtues are reasons-responsive and require context-specific perceptual skills. The inconsistency reveals not a lack of virtue but a need for moral development in new contexts. Self-misunderstanding is a correctable flaw in self-reflection, not a disproof of virtue."
  }
