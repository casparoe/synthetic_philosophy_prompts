  I should highlight that in public health, we use bounded distributions and focus on mitigation over valuation. The structural issue is the assumption of unbounded payouts versus real-world constraints. The journalist's intuition is partly right—framing matters—but the mathematical unboundedness is a key difference. Also, public health uses different metrics like DALYs instead of monetary value. 

