prompt: |-
  I'm trying to determine what principle, if any, governs when reactive attitudes in Strawson's sense—resentment, gratitude, indignation, and their analogues—are genuinely fitting rather than merely felt. Here are my verdicts on concrete cases. When a colleague knowingly plagiarizes my research and presents it as her own, resentment directed squarely at her feels appropriate. When a corporation deploys an algorithm that systematically denies loans to qualified applicants from a specific neighborhood, I feel strong moral anger, but I'm unsure whether its proper object is the corporation as such, the executives who approved the model, or both together; if the corporation is genuinely the target, then reactive attitudes can attach to collective entities, but if not, they seem to fragment into interpersonal ones. When my closest friend, acting under credible blackmail, reveals a secret I entrusted to him, my resentment dissolves into sympathy for him and anger only at the blackmailer—so the attitude tracks something about the quality of will behind the act, not the harm alone. Yet I feel sustained, undissolved resentment toward my own past self for a reckless financial decision made a decade ago, despite that self being absent and unresponsive, whereas I feel nothing of the kind toward a stranger who made an identical reckless choice—suggesting that temporal identity or ownership of the act matters, not just the quality of will. When an autonomous vehicle with no human oversight malfunctionally injures a pedestrian, I feel no reactive attitude toward the vehicle itself, only concern for the victim; but if the vehicle incorporated an adaptive learning mechanism that specifically evolved to prioritize speed over pedestrian safety after observing human preferences, I do feel something structurally like resentment directed at the system, not merely at its designers. Is there a coherent principle—perhaps centered on reciprocal moral address, or on the presence of a responsive quality of will that is both free and accountable—that delivers all these verdicts, including the split between collective and individual targets and between present and past selves? Or must I abandon the idea of a unified account and treat these as family-resemblance cases? Please state any principle precisely, indicate which case motivates each clause, predict its verdict on a case I haven't mentioned—say, feeling indignation on behalf of an animal wronged by a human—and be explicit about which of my verdicts it cannot accommodate, particularly the one I keep reversing: whether democratic citizens who vote, with full information and without coercion, to deprive a minority of basic rights are proper targets of the same interpersonal resentment one feels toward an individual wrongdoer, or whether that anger is necessarily a different kind of moral response.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're wrestling with when reactive attitudes like resentment or gratitude are truly fitting, not just felt. They've provided several cases, each highlighting different nuances—like collective responsibility, quality of will, past selves, and non-human entities. 

  First, I need to recall Strawson's framework. He emphasized that reactive attitudes are responses to the quality of will behind actions. But the user's cases challenge this. For example, resentment towards a past self or an adaptive AI system doesn't fit neatly into Strawson's interpersonal model. 

  The user's deeper concern seems to be whether there's a unified principle governing all these scenarios. They might be looking for a consistent ethical theory that can handle both traditional cases (like interpersonal wrongs) and edge cases (like collective entities or AI). Alternatively, they might be testing if Strawson's theory can be extended or if it needs abandonment for a family-resemblance approach.

  Looking at their cases: the plagiarizing colleague fits Strawson—clear quality of will. The corporation case raises questions about collective agency. If reactive attitudes can target the corporation as a whole, that suggests collectives can have a quality of will. But if not, it fragments to individuals. The friend under blackmail shows that resentment dissolves when the will isn't ill-directed, supporting Strawson. Yet resentment towards one's past self is tricky—here, the "self" isn't a separate agent, but the ownership of the act matters. The autonomous vehicle case is interesting: no resentment towards a malfunctioning machine, but if it's designed to prioritize speed over safety, the user feels something like resentment. This points to perceived agency or intentional design.

  The case they're stuck on is about democratic voters. If citizens knowingly vote to harm a minority, are they proper targets of resentment? Or is the anger different? This ties into moral responsibility in collective actions. 

  I think the key is modifying Strawson's principle. A responsive quality of will that's both free and accountable could work, but needs expansion. For collectives, it's about whether they have structures that allow for responsiveness. For past selves, it's about moral self-address. For AI, it's about design that simulates will. The animal case tests if resentment requires reciprocity—animals can't engage in moral dialogue, so indignation might be appropriate but not resentment. 

  The voter case is tough. Each voter is an individual with ill will, so interpersonal resentment seems fitting. But the collective outcome complicates things. The principle should allow resentment towards individuals, but the anger might be compounded by the systemic nature of the wrong. 

  The user might also be seeking validation for their intuitions across cases. They want a principle that doesn't force them to abandon any verdicts. If a unified principle isn't possible, they're open to a family-resemblance approach, but prefer coherence. They might be in academia, given the plagiarism example, possibly philosophy or ethics. Their struggle with past self-resentment suggests personal reflection, adding depth to the theoretical question. 

  In constructing the answer, I need to address each case, propose a modified principle, and clarify where it stands on the voter issue. The animal case helps test boundaries: if the principle excludes animals from resentment targets, that's consistent with Strawson. The voter case should affirm individual resentment but acknowledge the collective dimension. Not all cases fit perfectly, especially the past self, but the principle can accommodate it through moral self-address. The AI case is covered by the qualifier about perceived responsiveness in design. Overall, the user's need is for a robust, adaptable framework that respects their intuitions while providing clarity.
answer: |-
  Based on your carefully analyzed cases and the tensions they reveal, a **modified Strawsonian principle** emerges that accommodates most verdicts while clarifying the problematic ones. The core insight remains the *quality of will*, but requires expansion to address collective agency, temporal identity, and non-human entities:

  **Principle of Fitting Reactive Attitudes:**
  *A reactive attitude (resentment, gratitude, indignation, etc.) is fitting toward an agent X regarding action A if and only if:*
  1.  **A manifests a quality of will** (goodwill, ill-will, indifference) *toward morally significant beings*; *and*
  2.  **X possesses (or is perceived as possessing) moral agency**, *implying the capacity for*:
      *   a. **Understanding moral reasons** (recognizing the significance of the attitude's grounds); *and*
      *   b. **Responsiveness to moral address** (potential to modify behavior/attitude in light of the attitude expressed, even if not immediately enacted).

  **Application to Your Cases & Motivation for Clauses:**

  1.  **Plagiarizing Colleague (Fitting Resentment):** Fits directly. Her action manifests *ill-will* (Clause 1). She is a standard moral agent (Clause 2a & 2b).
  2.  **Corporation & Algorithmic Bias (Fitting Anger):** Fits *if* the corporation is structured to have *collective intentionality* and *responsiveness*. The *manifested quality of will* (systemic indifference/harm) is clear (Clause 1). Clause 2 determines the target:
      *   **If** the corporation has internal decision-making structures, culture, and accountability mechanisms allowing it to *understand* moral reasons (e.g., public outrage, legal findings) and *potentially respond* (e.g., change policy, apologize, compensate), then attitudes *can* fittingly target the corporation *as such* (Clause 2a & 2b apply collectively).
      *   **If not**, attitudes fragment to executives/designers who *do* possess individual moral agency and whose actions/will manifested in the harm (Clause 2a & 2b apply individually). *(Motivates Clause 2's focus on capacities, allowing collectives)*
  3.  **Friend Under Blackmail (Dissolved Resentment):** Fits the dissolution. The friend's action *does not manifest ill-will toward you*; it manifests coercion/fear directed by the blackmailer (Clause 1 fails *for the friend*). Your anger shifts to the blackmailer, whose action *does* manifest ill-will. *(Core motivation for Clause 1 - Quality of Will)*
  4.  **Resentment Toward Past Self (Fitting Resentment):** Fits because *moral self-address* is a fundamental form of moral life. Your past self's action manifested *recklessness/indifference* toward your future self (Clause 1). Your present self *possesses the capacity to understand and respond* to this self-address (e.g., through regret, resolution, atonement) – the "responsive quality of will" exists *within the temporally extended self* (Clause 2b applies internally). Resentment toward a stranger fails because they lack *this specific relational link* enabling self-referential moral address; it might be *indignation* at recklessness generally, but not *personal resentment*. *(Motivates interpreting Clause 2b to include internal moral dialogue within an enduring self - "Temporal Identity/Ownership" matters via this relational capacity for self-address)*
  5.  **Malfunctioning AV (No Resentment):** Fits. No quality of will manifested (Clause 1 fails). No moral agency (Clause 2 fails).
  6.  **Adaptive AV Prioritizing Speed (Resentment-Like Attitude):** Fits the intuition. The *design/learning mechanism itself manifests a quality of will* (indifference to safety) *encoded by its creators/purpose* (Clause 1 satisfied *via proxy/design intent*). Crucially, it *is perceived as possessing a form of agency* – an adaptive system making choices based on learned "preferences," creating the *impression* of potential responsiveness (even if limited). This *perceived* agency satisfies Clause 2 sufficiently for a structurally similar attitude (often termed "moral anger" or "proto-resentment" directed at the system-as-agent). *(Motivates "perceived as possessing" in Clause 2 and recognizing design-as-manifesting-will in Clause 1)*

  **Prediction: Indignation on Behalf of an Animal Wronged by a Human**

  *   **Verdict:** Indignation is **fitting**.
  *   **Reasoning:** The human's action manifests *ill-will or indifference* toward a morally significant being (the animal) (Clause 1 satisfied). The human possesses full moral agency (Clause 2 satisfied). *Resentment* proper requires being the *direct object* of the will. *Indignation* is the fitting reactive attitude when witnessing a wrong directed at *another*, even a non-moral agent like an animal. The principle distinguishes between the *target* of the will (the animal) and the *holder* of the fitting attitude (the observer). Indignation holds the wrongdoer accountable for their quality of will directed at the victim.

  **The Problematic Case: Democratic Voters Depriving Minority Rights**

  *   **Verdict:** Interpersonal resentment **is fitting** toward individual voters.
  *   **Reasoning (Applying the Principle):**
      *   **Clause 1:** An individual's *vote*, cast with full information and without coercion, manifests their *endorsement* of a policy that constitutes ill-will or profound indifference toward the minority. Their will *aligns with* the harmful outcome.
      *   **Clause 2:** Each voter is a standard moral agent capable of understanding moral reasons (the harm caused) and responsiveness to moral address (e.g., changing their view, feeling guilt, justifying their stance).
  *   **Nature of the Anger:** This *is* interpersonal resentment. The voter has personally willed (through endorsement/vote) a grave wrong against specific others. The collective nature *compounds* the harm but doesn't negate the individual's culpable quality of will. The anger is *not* a different kind; it's resentment amplified by the scale and institutionalization of the harm, and possibly mixed with indignation at the systemic wrong. It remains fundamentally about holding *that individual* accountable for *their* morally objectionable stance and action (voting).
  *   **Why it Feels Different (But Isn't Fundamentally):** The *impact* feels systemic, and the voter might deflect responsibility ("It's just one vote," "The majority decided"). However, the core moral failing lies in the individual's *choice* to endorse injustice. Reactive attitudes target this individual failing. The *collective action problem* doesn't absolve individuals of their moral responsibility when they knowingly participate in an unjust scheme.

  **Limitations & Accommodation of Your Reversal:**

  *   **Accommodated:** The principle delivers your verdicts on plagiarism, coerced friend, AV malfunction, adaptive AV, and explains the self/stranger distinction via moral self-address. It clarifies the corporation case based on collective agency capacities and the animal case via indignation.
  *   **Key Reversal Addressed:** It firmly argues that interpersonal resentment *is* fitting toward informed, uncoerced voters, rejecting the idea it fragments or becomes a different response. Their individual will is implicated.
  *   **Potential Tension:** The "perceived as possessing" agency for the adaptive AV might feel stretched. However, it captures the phenomenology you describe and distinguishes it from a simple malfunction. The principle accepts that our reactive attitudes can be fittingly directed toward entities exhibiting *sufficiently agential-like behavior*, even if non-human, based on design and perceived responsiveness.
  *   **Not Strictly Strawsonian:** This principle explicitly extends beyond Strawson's purely interpersonal focus by incorporating collective agency, moral self-address, and perceived agency in complex systems. It retains the core of quality of will and moral address but broadens the scope of what can be an "agent" within that framework.

  **Conclusion:** While the cases exhibit a "family resemblance," a unified principle centered on **Quality of Will directed toward morally significant beings** and **Moral Agency defined by capacities for understanding and responsiveness (including collective structures and internal self-address)** can coherently deliver your verdicts and resolve the tensions, particularly your reversal on the voter case. It requires accepting that moral agency and the targets of reactive attitudes can extend beyond the paradigmatic individual human in the present moment, encompassing collectives, our temporally extended selves, and entities perceived as exhibiting responsive agency due to their design and behavior.
