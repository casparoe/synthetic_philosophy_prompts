answer: |-
  Here is the analysis reconstructed entirely within your scaffold-and-calibration framework and institutional economics terminology:

  **German Folk Morality (Reconstructed):**
  1.  **Moral Authority:** Resides primarily in robust **Layer A (deontic scaffolding)**. The scaffolding's authority is derived from its *procedural legitimacy* (correct establishment) and *mechanism stability* (predictable enforcement). Layer B calibration functions chiefly to internalize and reliably execute the scaffold's directives, minimizing preference-driven deviation ("preference-sensitivity discounting").
  2.  **Cooperation Mechanism:** Achieved through **highly incentive-compatible Layer A rules**. Clear, codified procedures act as focal points, reducing transaction costs and monitoring needs. Cooperation is a stable Nash equilibrium sustained by the credible threat of external enforcement and reputational penalties encoded within the scaffold (common-pool resource management style). Layer B calibration reinforces this by generating high costs (internal disutility) for non-compliance.
  3.  **Failure Mode (Bureaucratic Rigidity):** Interpreted as **calibration-error accumulation under Layer A dominance**. Persistent under-utilization of Layer B calibration leads to:
      *   **Preference-revelation failure:** Agents cannot signal evolving local conditions or legitimate exceptions through sanctioned channels.
      *   **Institutional rigidity:** The scaffold becomes unresponsive to changing environments or heterogeneous preferences, leading to allocative inefficiency or welfare losses.
      *   **Pathological over-compliance:** Agents treat the scaffold as hyper-salient, overriding even welfare-improving Layer B judgments due to high internalized costs of deviation or fear of enforcement.

  **American Folk Morality (Reconstructed):**
  1.  **Moral Authority:** Resides dynamically in **Layer B (conscience calibration)**. Layer A scaffolding is viewed as derivative, contingent, and subject to constant Layer B interrogation ("preference-sensitivity auditing"). Moral obligation flows from the internal judgment process itself. Scaffolds gain authority only if deemed legitimate *by* calibrated Layer B preferences.
  2.  **Cooperation Mechanism:** Relies on **Layer B calibration as the primary coordination device**. Cooperation emerges from decentralized, preference-sensitive judgments converging on shared norms or mutual advantage. Layer A scaffolds are seen as fallible mechanisms to codify *emergent* Layer B consensus or manage large-N interactions, but lack inherent authority. Success depends on widespread, reliable calibration (high social capital).
  3.  **Failure Mode (Arbitrary Subjectivism):** Interpreted as **mechanism instability due to Layer B dominance and preference revelation problems**:
      *   **Unverifiable preference revelation:** Layer B judgments are private and costly to verify, leading to potential moral hazard (masking self-interest as conscience) or adverse selection (agents with poorly calibrated B-layers participating).
      *   **Coordination failure:** Without strong Layer A focal points, decentralized calibration can lead to norm fragmentation, inconsistent application, and high transaction costs in establishing cooperation.
      *   **Under-provision of public goods:** Reliance on voluntary Layer B contribution may be insufficient for large-scale common-pool resource management, leading to free-rider problems if scaffolding is weak or delegitimized.

  **Residue Report:**
  1.  **Clean Translation:**
      *   Core tension between rule-based coordination (Layer A stability) and flexible, preference-responsive judgment (Layer B adaptability).
      *   Failure modes as institutional design flaws: rigidity (A-dominance calibration error) vs. instability/unverifiability (B-dominance revelation/coordination failure).
      *   Notions of legitimacy translated as Layer A procedural credibility or Layer B preference congruence.
      *   Evaluative claims about cooperation durability (A-stability) vs. adaptability/preventing over-compliance (B-flexibility) can be expressed as **comparative statics** within the model: Analyzing equilibrium robustness under environmental stochasticity (favoring A) vs. preference heterogeneity/innovation (favoring B).
  2.  **Translation with Distortion:**
      *   "Collective Honor" (German) / "National Character": Must be treated as a *preference-revealing signal* or *reputational mechanism* embedded within Layer A (formalized honor codes) or Layer B (internalized group identity affecting calibration costs). This flattens thick cultural concepts into instrumental incentives.
      *   "Internal Moral Intuition" (American): Framing it solely as "preference-sensitive judgment" risks reducing deeply held convictions to revealed preferences, potentially missing their perceived objective or non-negotiable character within the folk view.
  3.  **No Counterpart (Untranslatable Residue):**
      *   **Metaphysical Commitments:** Claims about the *ultimate source* of moral authority (e.g., divine command, pure practical reason inherent in rules vs. irreducible moral sense inherent in conscience) lack operational counterparts. The framework is agnostic on whether Layer A authority is ontologically prior or derivative.
      *   **Intrinsic Value Claims:** Assertions that rule-following *itself* is virtuous (beyond stability) or that conscience *itself* is sacred (beyond preference revelation) have no direct translation. The framework evaluates based on functional outcomes (stability, efficiency, welfare).
      *   **Strong Normative Superiority:** Claims that one system is *inherently* morally superior, rather than contextually more efficient or stable, import non-institutional values the framework cannot adjudicate without external criteria.

  **Verdict:** The untranslatable residue points chiefly to the presence, in the folk-moral debate itself, of commitments about the ontological source and intrinsic nature of moral authority that are not institutionally operationalizable within a scaffold-and-calibration framework focused on governance mechanics and incentive structures.
