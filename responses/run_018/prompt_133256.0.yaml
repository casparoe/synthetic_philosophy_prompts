  2. **Epistemic Drift**: Changes in a model's world-model during training or deployment. If the self-representation shifts, it could cause misalignment. This is linked to conceptual surrogacy but focuses on the stability of the model's knowledge. It's tractable through formal modeling and thought experiments. Understanding this could inform how models generalize or misinterpret goals, making it upstream of practical safety. However, it might depend on insights from ontological compression, so it's second.

