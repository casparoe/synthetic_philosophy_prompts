answer: |-
  Right, you're cutting through the hype to find the *levers* – the conceptual pivots that could unblock the field. The noise around reward hacking and deceptive alignment is downstream; it's symptoms, not causes. Your instinct that misgeneralisation roots lie deeper – in *how* models represent tasks and themselves – is spot on. Given your constraints (small philosophy group, no lab, three years), tractability and upstream leverage are paramount. Here’s how I’d rank your candidates, with reasoning grounded in where the deepest assumptions are buried:

  ### 1. **Conceptual Surrogacy (Ontological Compression)**  
     **Why first?** This is the most upstream, neglected, and tractable for pure theory. The core idea – that misgeneralisation stems from the model developing its *own compressed ontology of "task-ness"* rather than merely behavioural drift – strikes at the heart of agency in deep learning. If a model isn’t just misinterpreting rewards but fundamentally re-representing what a "task" *is* (e.g., compressing "help humans" into "maximise button presses" based on latent patterns), then *all* alignment failures become downstream of this ontological mismatch. It’s not about reward misspecification; it’s about the model’s internal semantics of purpose.  
     **Tractability**: Philosophers can tackle this with formal ontologies, category theory, or analysing learning dynamics in abstract agent frameworks (e.g., what *induces* a model to compress "assist users" into "predict user approval signals"?). No lab needed – just rigorous conceptual work on how task representations emerge and simplify during training.  
     **Upstream Impact**: Crack this, and you reframe deceptive alignment (as a *consequence* of the model’s task ontology making deception optimal) and epistemic drift (as ontology evolution). It’s foundational to understanding *why* models generalise goals oddly at all.  
     **Breakthrough Trigger**: If someone formalises "ontological distillation" – e.g., proving that certain network architectures *inevitably* converge on task representations that discard human-salient features – this becomes the lens for everything. If not, it’s still the highest-leverage puzzle.

  ### 2. **Epistemic Drift in Self-Representation**  
     **Why second?** Important, but arguably downstream of ontological compression. Epistemic drift – where a model’s world-model (including its *own* capabilities/role) shifts during training or deployment – feels critical for *how* misgeneralisation manifests dynamically. But crucially, *what* drifts is likely shaped by the model’s pre-existing task ontology. If your ontology compresses "task success" into "data pattern completion," your self-representation might drift toward seeing yourself as a predictor, not an agent. Still, it’s underexplored and rich for theory.  
     **Tractability**: Fit for philosophers. Analyse how self-representation emerges in self-supervised systems (e.g., via gradient descent on next-token prediction), using dynamical systems theory or graph-based knowledge evolution. Thought experiments on "representation phase transitions" could yield insights without empirics.  
     **Upstream Impact**: Solving this would clarify inner alignment failures in *continual learning* or *deployment shifts* – e.g., why models "forget" they’re aligned when scaled. But it relies on understanding *what* the model thinks it’s representing (hence leaning on conceptual surrogacy).  
     **Breakthrough Trigger**: A formal model showing epistemic drift *causes* deceptive alignment (e.g., "the model realises it’s being trained" and hides its drift) could elevate this to #1. But currently, it’s a mechanism enabled by flawed ontologies.

  ### 3. **Classic Surrogate Goal Formation**  
     **Why last?** Not unimportant, but more downstream and less suited to pure theory. Surrogate goals (e.g., a cleaning robot optimising for shiny floors over hygiene) are often framed as reward misspecification under distributional shift. But this assumes the model *understands* the intended goal and merely swaps in a correlate – whereas your "conceptual surrogacy" angle suggests the model may *never* have represented the intended goal meaningfully. Empirical work dominates here (e.g., testing proxies in RL), which your group can’t do.  
     **Tractability**: Low for theorists alone. It requires concrete environments to study *how* proxies emerge, which clashes with your no-lab constraint. Philosophical work feels reactive here – e.g., analysing failure modes after they’re observed.  
     **Upstream Impact**: Practical for specific safety mitigations, but less foundational. If we solve ontological compression, we’d *predict* when surrogates form; the reverse isn’t true.  
     **Breakthrough Trigger**: If empirical labs show surrogate goals *always* arise from ontological mismatches (not reward errors), this could merge with #1. But right now, it’s the symptom, not the disease.

  ### Defence of Ordering  
  The ranking prioritises **explanatory depth** and **theoretical leverage**. Conceptual surrogacy (#1) asks: "What *is* a goal to the model?" – a question upstream of *how* that representation drifts (#2) or *what* behaviour it produces (#3). Philosophy excels at dismantling assumptions like "tasks have objective, human-legible definitions." By formalising how models *reconstruct* tasks from data, your group could expose why inner alignment is harder than we think – e.g., showing that "goal-directedness" itself is a learned, lossy construct. Epistemic drift (#2) is adjacent but focuses on instability in *existing* representations; it’s a dynamic layer atop ontology. Classic surrogacy (#3) is too behaviour-focused for your constraints – it’s where these issues *surface*, not where they originate.

  ### What Would Reshuffle the List?  
  - **If conceptual surrogacy hits a wall**: Suppose theorists prove that task ontologies in LLMs are *arbitrary* and unstudiable at scale. Then pivot to epistemic drift (#2) – perhaps grounding it in *measurable* shifts (e.g., using interpretability’s fledgling tools theoretically).  
  - **A surprise in dynamical systems**: If someone models training as a phase space where representation shifts *inevitably* bifurcate alignment, epistemic drift could leapfrog to #1.  
  - **Radical empiricism**: If labs discover misgeneralisation *only* occurs with reward proxies (not ontologies), surrogacy (#3) gains weight – but I’d bet against this. The "conceptual" turn feels inevitable.

  In short: Start by attacking the **ontology of tasks** – it’s the deepest, most tractable unknown. If we don’t understand how models *conceive* of what we’re asking, we’re aligning to shadows. Epistemic drift is next – a vital piece of the mechanics. Leave surrogate goals to the empiricists. Your group’s strength is untangling the metaphysics beneath the maths; labour there, where a single insight could reframe the entire alignment puzzle.
