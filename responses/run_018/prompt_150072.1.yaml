  The atrocity victim count is the real knot. Four thousand vs four hundred... The symbolic weight feels essential to memorialization, but the forensic evidence is solid. I see why they're torn. And that family collaboration/resistance case adds another layer—when does "metaphorical" memory cross into deception?

  *scribbles mentally* Maybe the unifying thread is epistemic jurisdiction? Like: whose stakes govern the context? Ritual community for liturgical time, affected people for territorial rights, but dispassionate analysis for civic education... But that doesn't resolve the atrocity numbers. Unless—ah!—the key is whether the memory serves as foundational evidence (like for land claims) or as living testimony (like for trauma). The four thousand aren't making a forensic claim; they're bearing witness to scale. 

  ...But would that undermine the revolution case? No, because there the myth serves state legitimacy, not survivor needs. And for the family ancestor: if they only use "resistance" internally as cultural metaphor, it's like the liturgical calendar—a kinship ritual space. 

  *checks logic* Does this principle hold? For the mill closure, oral tradition isn't constitutive (it's explanatory), so correction is warranted. For indigenous boundaries, it's constitutive of sovereignty. For atrocity numbers... yes, the magnitude is constitutive of collective trauma. Precision would erase the experiential truth. 

  The user might push back: isn't 400 to 4000 too great a leap? But principle-wise, if we accept memory's constitutive role in survivor identity, the number becomes a vessel for systemic violence—not a body count. 

  Final case: the family's "resistance fighter" metaphor. Under this framework, since it's confined to kinship rituals (like liturgy), no correction needed. Only if they sought posthumous honors would documentary evidence matter. 

  *exhales* Coherent? I think so. Their initial judgments all hold without contradiction. The atrocity case finds its place as commemorative authority outweighing corrective authority when identity/survival is at stake. No verdicts need dropping. Consistency achieved.
answer: |-
  Your search for a principled distinction is insightful. Based on your verdicts, the core tension lies in **whether the contested memory serves a *constitutive function* for a community's identity/rights/survival, versus an *explanatory function* about past events.** This aligns with your intuitions about "commemorative authority" (constitutive) versus "corrective authority" (explanatory). Here's the principle:

  **The Principle of Constitutive Epistemic Primacy:**  
  *When a community's living memory is constitutive of its identity, legal rights, cultural survival, or collective trauma, it holds epistemic primacy over conflicting documentary records within its domain of practice—even if historically inaccurate. Documentary records hold primacy for explanatory historical reconstruction, public pedagogy, and contexts demanding forensic precision—unless their imposition actively undermines a constitutive function.*

  ### Applying the Principle to Your Verdicts
  1.  **Diasporic Expulsion Date (Supports Principle):**
      *   *Constitutive Function:* The liturgical date is essential for ritual cohesion and communal identity across generations. Correcting it internally would destabilize religious practice.
      *   *Explanatory Function:* Public history aims for chronological accuracy about the past event. The documentary date prevails here.
      *   *Resolution:* Internal ritual practice (constitutive domain) preserves the memory; public history (explanatory domain) uses the documentary date.

  2.  **Mill Closure (Supports Principle):**
      *   *Constitutive Function?* The lockout narrative sustains solidarity, but this is *derivative* of the event's explanation (why the mill closed), not foundational to the town's core identity/rights. It explains *why* hardship occurred.
      *   *Explanatory Function:* The documentary evidence provides a materially verifiable cause (bankruptcy) contradicting the oral account. Public pedagogy demands accurate explanation.
      *   *Resolution:* Documentary record corrects the explanatory narrative. The solidarity function, while valuable, doesn't grant constitutive primacy to the *specific causal claim*.

  3.  **Indigenous Treaty Boundary (Supports Principle):**
      *   *Constitutive Function:* The oral tradition defines territorial sovereignty and land rights foundational to the nation's existence, legal standing, and cultural survival. The boundary *is* the nation.
      *   *Explanatory Function:* Colonial maps represent an external, imposed administrative perspective, often flawed or deliberately manipulative.
      *   *Resolution:* Oral tradition holds constitutive primacy for adjudication and land rights. Documentary records are subordinate evidence, potentially revealing colonial bias but not overriding constitutive memory.

  4.  **Bloodless Revolution Myth (Supports Principle):**
      *   *Constitutive Function?* The myth may foster national unity, but this unity is built on a false explanation suppressing state violence. It constitutes an *inauthentic* identity.
      *   *Explanatory Function:* Declassified reports provide evidence of systematic suppression and casualties. Civic education requires confronting state violence truthfully.
      *   *Resolution:* Documentary record prevails. Maintaining the myth causes active harm by erasing victims and distorting civic understanding. Its "constitutive" function is illegitimate.

  5.  **Atrocity Victim Numbers (Resolved by Principle):**
      *   *Constitutive Function:* The figure "four thousand" is constitutive of the survivor community's collective trauma, scale of loss, moral claim for recognition, and memorialization. Reducing it to "four hundred" feels like a second erasure, diminishing the perceived magnitude of the horror and suffering.
      *   *Explanatory Function:* Forensic/documentary evidence provides the best available approximation of the factual death toll.
      *   *Resolution:* **Constitutive primacy applies.** The community's memory of scale (~4000) should prevail in contexts of commemoration, memorial policy, moral education, and international recognition – the domains where the *meaning* and *impact* of the trauma are central. The forensic figure (~400) should be recorded in historical archives and scholarly work as the best documentary estimate, but *not* used to "correct" commemorative practices or demands for recognition. The symbolic magnitude *is* part of the constitutive truth for the survivors.

  ### The Kinship Ritual Case (Ancestor as Resistance Fighter)
  *   **Scenario:** Family remembers an ancestor as a resistance fighter; archives show collaboration. The "resistance" framing is used metaphorically for cultural preservation internally within kinship rituals, not for public historical claims.
  *   **Application of Principle:**
      *   *Constitutive Function:* The narrative functions constitutively within the intimate sphere of kinship identity and ritual. It shapes family self-understanding, values, and cohesion ("we are descendants of resistors"). The metaphorical meaning (cultural preservation) is central.
      *   *Explanatory Function:* The archival record provides evidence about the ancestor's specific historical actions.
      *   **Resolution:** **Constitutive primacy applies within the kinship domain.** There is no need to "correct" the family narrative used internally in rituals. The principle protects this intimate, identity-forming space. Demanding correction here would be analogous to demanding the diasporic community change its ritual date. The family's restraint in *not* making public historical claims based on this narrative is crucial; making such claims would shift it into the explanatory domain, where documentary evidence should prevail.

  ### Consistency Check
  *   **No verdicts need dropping.** The principle coherently captures all your initial judgments and resolves the atrocity case and the kinship case.
  *   **Key distinctions upheld:**
      *   **Constitutive vs. Explanatory:** The religious date, indigenous boundary, atrocity magnitude (in commemoration), and family ancestor (in ritual) serve constitutive functions. The mill closure cause, revolution narrative, and ancestor's public historical role are explanatory.
      *   **Domain of Practice:** Internal/communal/ritual vs. public/pedagogical/forensic.
      *   **Harm of Correction:** Correcting constitutive memories (expulsion date, boundary, victim scale in commemoration, family ritual) causes active harm (erosion of identity, rights, trauma recognition, family bonds). Correcting explanatory errors (mill cause, revolution myth) prevents harm (misunderstanding history, legitimizing state violence).
  *   **The atrocity case fits:** The magnitude (~4000) is constitutive of the trauma's lived reality and moral weight for the community. The forensic figure (~400) is explanatory for historical accounting. Imposing the latter in commemorative contexts inflicts harm by diminishing the experiential truth.

  This principle avoids ad hoc rationalization by grounding the distinction in the *function* of the memory within a specific community context and the *harm* caused by overriding its constitutive role. It acknowledges the validity of documentary evidence for historical reconstruction while respecting the irreplaceable role of living memory in shaping identity, rights, and meaning – especially for communities shaped by oppression, displacement, or trauma.
