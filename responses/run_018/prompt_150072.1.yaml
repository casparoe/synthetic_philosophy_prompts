  Hmm, this is clearly someone deeply engaged with historiography and ethics—probably an academic or advanced student in history, philosophy, or legal anthropology. Their frustration with "ad hoc rationalization" suggests they want rigor, not just intuition. The reversals on the atrocity numbers show genuine intellectual honesty.

