  Hmm... the roommate's "mean-referance weighting" isn't standard terminology, but it clearly refers to a relative prioritarianism where weights depend on distance from mean welfare rather than absolute levels. That's crucial - most prioritarian functions use absolute thresholds (e.g., Parfit's "urgency" argument). 

  Let me simulate the math silently: Original mean is (2+5+9)/3≈5.33. The 2 is -3.33 below mean, 5 is -0.33, 9 is +3.67. After redistribution: mean is (4+5+7)/3≈5.33 (same mean!). Now 4 is -1.33 below, 5 is -0.33, 7 is +1.67. The improvement for person A (from -3.33 to -1.33 deviation) likely outweighs person C's loss (from +3.67 to +1.67) if we apply concave weighting. But crucially, no leveling-down occurs here - the worst-off gained at the expense of the best-off, which standard prioritarianism also approves.

  Wait, but the user's real question is whether this framework could ever demand pure leveling-down. Imagine a case where lowering the top without helping the bottom reduces everyone's distance from mean. Suppose three people at 1,1,10 (mean=4). If we tax the 10 down to 4 without helping others, new welfare is 1,1,4 (mean=2). Original deviations: -3,-3,+6. New: -1,-1,+2. If our moral weight function cares about squared deviations (like a utilitarian SWF would), this reduces inequality - but prioritarianism cares about weighted welfare sum, not deviation minimization per se. 

  Ah, here's the rub: prioritarianism transforms welfare first (giving priority to worse-off), then sums. Mean-reference weighting just changes how we assign priority - it still only cares about improving transformed welfare. Pure leveling-down (hurting someone without helping anyone) always reduces total transformed welfare because the loss isn't compensated. Egalitarianism, by contrast, cares directly about distribution.

  So the user's instinct is right - this is still prioritarianism, not egalitarianism in disguise. But their roommate isn't entirely wrong either; relative prioritarianism can justify redistributions that absolute prioritarianism wouldn't, because the "urgency" shifts with society's mean. However, it never actively wants leveling-down - that would require valuing equality intrinsically, which prioritarianism famously rejects.

  The user's deeper need seems to be: "How do I defend prioritarianism's core distinction when facing clever variants?" They need the math to show that even relative weights don't cross the leveling-down red line. I should emphasize that transformation functions must be strictly increasing - hurting anyone always counts as a cost, never a benefit. That's the philosophical firewall.
answer: |-
  This is an excellent and subtle question that cuts to the heart of the prioritarianism vs. egalitarianism debate. Let's break it down step-by-step:

  ### 1. **Is "Mean-Reference Weighting" Prioritarianism?**
     - **Yes, it's a legitimate (though non-standard) variant of Prioritarianism**, specifically **Relative Prioritarianism**. Traditional ("Absolute") Prioritarianism assigns moral weights based on an individual's *absolute* welfare level (e.g., a concave transformation function like √w or log(w)). Relative Prioritarianism weights welfare based on an individual's position *relative* to others, often using the mean or median as a reference point.
     - **Key Distinction**: Egalitarianism values equality *intrinsically* (equality is good in itself). Prioritarianism (even relative) values equality only *instrumentally* – it arises as a byproduct of giving priority to the worse-off. The weighting function is still applied to *individual welfare*, not directly to inequality metrics.

  ### 2. **Your Example: Does it License Leveling-Down?**
     Let's analyze your numbers:
     - **Original State**: [2, 5, 9] → Mean = (2+5+9)/3 = **5.333**
     - **Proposed Redistribution**: [4, 5, 7] → Mean = (4+5+7)/3 = **5.333** (same mean!)
     - **Prioritarian Calculation (Illustrative)**:
       Assume a simple relative weighting: Moral weight = `1 / (Distance below mean + 1)`. We sum transformed welfare.
       - *Original State*:
         - Person A (2): Dist below mean = 3.333 → Weight ≈ 1/4.333 ≈ 0.23 → **Value = 2 × 0.23 = 0.46**
         - Person B (5): Dist below mean = 0.333 → Weight ≈ 1/1.333 ≈ 0.75 → **Value = 5 × 0.75 = 3.75**
         - Person C (9): Dist above mean → Weight = 1 (no priority) → **Value = 9 × 1 = 9**
         - **Total = 0.46 + 3.75 + 9 = 13.21**
       - *Redistributed State*:
         - Person A (4): Dist below mean = 1.333 → Weight ≈ 1/2.333 ≈ 0.43 → **Value = 4 × 0.43 = 1.72**
         - Person B (5): Unchanged → **Value = 3.75**
         - Person C (7): Dist above mean → Weight = 1 → **Value = 7 × 1 = 7**
         - **Total = 1.72 + 3.75 + 7 = 12.47**
       - **Result**: Original state wins (13.21 > 12.47). Leveling-down isn't required.

     - **Why?** Even with mean-reference weighting:
       1. Person C's loss (9→7) is large in absolute terms and receives no priority boost.
       2. Person A's gain (2→4) gets higher weight, but not enough to offset C's loss *because Prioritarianism transforms individual welfare first, then sums*. It doesn't directly maximize "closeness to mean."

  ### 3. **The Core Defense Against Leveling-Down**
     - **Prioritarianism's Axiom**: Welfare improvements always have *positive moral value*, but gains to the worse-off count for *more*. Conversely, welfare losses always have *negative moral value*. Pure leveling-down (hurting the better-off without helping anyone) *always reduces total prioritized welfare* because:
       - The loss to the better-off isn't compensated by gains elsewhere.
       - Since the better-off have low moral weight per unit loss, the decrease is small—but it's still a decrease. There's no mechanism where a loss *itself* increases the sum.
     - **Egalitarianism's Problem**: It can value leveling-down if equality improves, even with no gain (or net loss) in welfare. Prioritarianism avoids this.

  ### 4. **When *Would* Relative Prioritarianism Favor Redistribution?**
     - **Only if net prioritized welfare increases**. In your example, redistribution failed because Person C's loss outweighed Person A's gain. But consider:
       - **Original**: [1, 1, 10] (Mean = 4)
       - **Redistribute to**: [3, 3, 5] (Mean ≈ 3.67)
       - Here, gains to the very worst-off (1→3) may outweigh the loss to the best-off (10→5) *if* the weighting is sufficiently steep. Crucially, this isn't leveling-down—it's a trade-off where net prioritized welfare increases.

  ### 5. **The Leveling-Down Objection's Status**
     - **Relative Prioritarianism *still* dodges the objection** for the same core reason: it never endorses a change that *reduces* everyone's welfare (or leaves some unchanged while harming others). It only approves changes where the sum of *weighted* welfare increases.
     - **Your roommate's claim misses the math**: Shrinking mean-distance isn't the *goal*; it's a potential *side effect* of weighting gains to the worse-off more heavily. The SWF remains a sum of individually transformed utilities.

  ### Conclusion
  Your intuition was correct: 
  1. **Mean-reference weighting is Prioritarianism** (a relative variant), not egalitarianism. 
  2. **It does not license leveling-down**. The transformation function must be **strictly increasing**—hurting anyone always counts as a cost. 
  3. **Egalitarianism vs. Prioritarianism** hinges on whether equality has *intrinsic* value (egalitarianism) or is solely a consequence of prioritizing the worse-off (prioritarianism). This variant doesn't cross that line. 

  Where your roommate errs is conflating *correlation* (redistribution often reduces mean-distance) with *causality* (the theory doesn't *aim* to reduce distance; it aims to maximize weighted welfare). The math ensures leveling-down remains irrational under prioritarianism. Well-argued on your part!
