  The beach meeting: Madame's pity confirms the hopelessness of deferrals. Kathy sees the external truth but still clings to the narrative. This moment highlights the tension but doesn't resolve it. 

  Final donation: Kathy's calm acceptance feels like internal endorsement, but given the systemic conditioning, it's ultimately narrative capture - she's internalized the external reason so completely it appears as her own. 

  The analysis shows how the novel blurs Williams's distinction through institutional narrative capture. Each scene demonstrates how the clones' apparent internal reasons are shaped by external engineering, challenging the philosophy.
