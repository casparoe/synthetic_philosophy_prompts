  - An honest scope check for a short project.

  Please start by brainstorming angles for like two sentences, then write the proposal. Use American English, keep it casual, and don't put in a bibliography or reading list — I'll fill in the referances later. Also think carefully about whether this framing is actually tractable before you lock it in.
