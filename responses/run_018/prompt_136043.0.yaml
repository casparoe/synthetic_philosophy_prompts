answer: |-
  The 1758 Genevan theatre controversy pitted d'Alembert's *Encyclopédie* article proposing a permanent playhouse—endorsed by local elites like Voltaire and backed by the Encyclopédistes seeking cultural influence—against Rousseau's *Letter to d'Alembert*, framed through his theory that spectacle fosters *amour-propre* (vanity and social comparison) over *amour de soi* (natural self-love), thereby corrupting civic virtue. The actual decision-makers were Geneva's governing councils (Petit and Grand) and the Calvinist Consistory, who, swayed by Rousseau's arguments and religious concerns, rejected the proposal, prioritizing perceived moral integrity over potential prestige or profit. Rousseau mapped the payoffs starkly: adopting theatre meant importing Parisian manners, dissolving local solidarity, fostering idleness, vanity, and gendered impropriety, ultimately weakening the frugal, participatory ethos essential for Geneva's small republic. Rejecting it preserved authentic social bonds, frugality, and civic engagement through wholesome local festivals. His account powerfully captures the anxiety about foreign cultural imports eroding communal identity and republican simplicity, highlighting how spectacle could shift focus from collective duty to individual display. However, it obscures the economic motives of Genevan merchants hoping to attract wealthy visitors and the fact that Geneva later tolerated theatre without Rousseau's predicted catastrophic civic collapse. This eventual outcome suggests Rousseau's causal mechanism (spectacle → *amour-propre* → civic decay) is contingent. It likely depends on a specific, intensely participatory form of public life—his idealized, virtuous republic—which Geneva approximated but never fully realized. Furthermore, the lack of predicted collapse reveals Rousseau's reliance on an unstated anthropological premise: high human plasticity, where environment (like pervasive spectacle) decisively shapes character and social bonds. Geneva's resilience indicates that spectacle's corrupting potential isn't universal but contingent on the existing civic fabric and the degree of plasticity assumed, a premise his theory implies but doesn't explicitly defend as foundational. The theory correctly identifies spectacle's *potential* to redirect social passions but overstates its inevitable, universal corrosive power absent its specific republican context.
