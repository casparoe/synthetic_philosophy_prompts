  I'm working through a seminar on historical sociology focused on Hobsbawm's analysis of invented traditions and Anderson's framework for imagined communities, and I've become stuck on a conceptual tension that doesn't map neatly onto either author's standard examples. The issue concerns what might be called an "archival inversion": situations in which an imperial administration's bureaucratic rationalization—say, a census reform or territorial reorganization—systematically eliminates administrative records for a particular population not out of targeted suppression, but as an incidental byproduct of streamlining governance. Later nationalist movements encounter this absence not as mere missing data, but as a structuring silence that they interpret as evidence of an ancient, pre-bureaucratic communal unity which the empire sought to dissolve through abstraction rather than conquest. I want to understand precisely how this differs conceptually from a straightforward invented tradition, since the "inventors" in these cases are not fabricating continuity ex nihilo but are building an imagined community upon an evidentiary gap that they experience as a wound inflicted on an already-existing collective.

  Could you provide a concrete, conceptually precise example of this kind of archival inversion—one that demonstrates how the distinction between "recovery" and "invention" collapses not through bad faith or cynical mythmaking, but through the specific mechanics by which absence itself becomes a positive foundation for national imagination? I am not asking for a historiographical survey, citation, or reading list; rather, I need an illustrative case that clarifies the conceptual dynamics, ideally showing how the same bureaucratic document that erased the group can later be read by nationalists as proof of the group's prior coherence. Please keep the example grounded enough that the conceptual point is visible without requiring specialist knowledge of obscure archives, but specific enough that it does not simply restate the generic claim that all nations are constructed.
