prompt: |-
  I'm currently working through the tension between virtue ethics and situationist moral psychology in a seminar on character, and rather than committing to a theoretical camp I've been trying to derive my actual position from my unreflective judgments about concrete cases. I find myself drawn to verdicts that seem hard to square with either a pure global-trait view or a pure situationist denial of character altogether. Here are the judgments I keep returning to, and I would like to know whether there is a coherent principle—perhaps involving domain-specificity, institutional framing, or narrative self-constitution—that can accommodate them, or whether I must abandon at least one.

  First, Maria is meticulously honest in her accounting practice—she never misstates figures—yet she routinely embellishes her outdoor adventures to friends. I still want to say she possesses the virtue of honesty, but only within a professional-epistemic domain; I do not treat her social exaggeration as disproving the trait. Second, David is genuinely courageous in physical emergencies—he has rescued people from burning buildings—but in a structured organizational-ethics scenario he remains silent about misconduct because the social cost is high. I think he has physical courage without institutional moral courage, and I resist collapsing the two into a single global disposition. Third, imagine a controlled study in which participants are randomly assigned the temporary role of "fairness monitor" in a collaborative task; those assigned the role enforce equitable distributions with high consistency across changing group compositions, while those without the assignment show virtually none. My intuition is that the role does not merely elicit a pre-existing trait but temporarily constitutes one, suggesting that some virtues are framing-dependent rather than latent. Fourth, Professor Chen demonstrates profound intellectual humility in her scholarship—she revises her theories in response to counterevidence—but she is rigid and dismissive in departmental governance. I want to say she has the virtue in her epistemic practice yet lacks it in her administrative self, though I am unsure whether this is a domain split or a failure of integration. Fifth, my acquaintance Leo lies indiscriminately about taxes, feelings, and excuses, with no discernible pattern tied to context or pressure; here I have no hesitation in saying he simply lacks honesty. Sixth, and most puzzling to me, consider two people with statistically identical behavioral profiles across twenty diverse helping situations—each assists strangers roughly sixty percent of the time. One weaves these actions into a coherent self-narrative of "trying to be kind," while the other regards them as situationally caused accidents. I feel the first genuinely possesses kindness in a way the second does not, despite the behavioral equivalence.

  These verdicts pull in different directions: domain-specificity for Maria and Chen, framing-dependence for the monitor study, absence for Leo, and narrative constitution for the final pair. Is there a unified account—say, one that treats virtues as locally stable dispositions that require both cross-situational coherence within a domain and a first-personal narrative endorsement—that can preserve all six judgments? If so, apply it to a case I have not considered: an individual who displays consistent compassion only within an immersive virtual environment, caring meticulously for digital entities, but shows no comparable behavior in physical-world interactions. If no single principle saves every verdict, which one should I drop, and what does that imply for whether situationism or virtue ethics is closer to the truth?
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about character and virtue ethics. The user presents six concrete cases where their intuitions about virtue possession seem to conflict with both global trait theories and radical situationism. They're looking for a unified framework that can accommodate all these judgments without contradiction.

  The cases are really well-constructed: Maria's domain-specific honesty, David's institutional courage gap, the role-constituted fairness monitors, Professor Chen's intellectual humility split, Leo's global dishonesty, and the narrative-dependent kindness of behaviorally identical helpers. What's striking is how each case challenges different aspects of traditional virtue theory while still preserving some notion of character.

  I notice the user is clearly well-versed in moral psychology literature - they reference situationism, domain-specificity, and narrative approaches. Their methodology is interesting too: starting from concrete judgments rather than theoretical commitments. The virtual compassion case at the end is particularly clever as a stress test for any proposed framework.

  The core tension seems to be between three dimensions: behavioral consistency (neither too global nor too fragmented), contextual embedding (how institutions/framings enable virtues), and self-constitution (the narrative component). Any solution needs to address all three without reducing virtues to either pure behavior or pure self-perception.

  For the virtual compassion case, the institutional framing approach might explain why compassion manifests there but not elsewhere - the virtual environment provides scaffolding that's absent in real life. But the narrative component would determine whether this counts as "real" compassion: if the person sees their virtual behavior as expressing their values, it might qualify as a domain-specific virtue, whereas if they see it as just game-playing, it wouldn't.

  The toughest reconciliation might be between Leo's global vice (which suggests virtues can be absent) and the fairness monitors (which suggest virtues can be temporarily constituted). The key distinction may be in depth of integration: Leo's dishonesty reflects a stable dispositional absence, while the monitors' fairness is real but fragile - constituted by the role but not yet integrated into their character structure.
answer: |-
  Your intuitions reveal a sophisticated rejection of both globalism and radical situationism, pointing toward a **contextually embedded, narratively integrated dispositional model**. Here's a unified framework preserving all six judgments, followed by application to your virtual compassion case:

  **Core Principle:** Virtues are *domain-specific dispositional clusters stabilized by institutional framings and integrated into a self-constituting narrative*. This requires:
  1.  **Domain-Bounded Consistency:** Reliable manifestation within a coherent sphere of activity (professional, epistemic, physical, etc.)
  2.  **Framing Dependence:** Activation/constitution enabled by roles, rules, or structures defining expectations and affordances.
  3.  **Narrative Integration:** Endorsement as expressing one's "self" rather than being alien or accidental.

  ---

  **Applying the Framework to Your Cases:**
  1.  **Maria (Professional Honesty):** *Preserves Virtue.* Honesty manifests reliably within the *domain* of professional accounting, governed by institutional norms and epistemic commitments. Social storytelling belongs to a separate relational/expressive domain. Absence of narrative conflict (she likely doesn't see embellishments as violating her "true self") prevents global vice attribution.
  2.  **David (Physical vs. Institutional Courage):** *Preserves Partial Virtue.* Physical courage is a distinct domain-specific disposition triggered by immediate physical danger. Institutional moral courage requires navigating complex social/institutional *framings* (hierarchy, career risk) he lacks. These are different dispositional clusters.
  3.  **Fairness Monitors (Role-Constituted Fairness):** *Preserves Virtue (Temporarily).* The institutional *framing* (role assignment, rules, expectations) actively *constitutes* the disposition "fairness monitor" for the task duration. It's a real, locally stable disposition *within that framing*, not merely eliciting latent traits. Its fragility outside the role doesn't negate its reality within it.
  4.  **Professor Chen (Epistemic Humility):** *Preserves Virtue (Partially).* Intellectual humility manifests within the *domain* of scholarship, governed by epistemic *framings* (peer review, evidence norms). Administrative rigidity occurs in a distinct *domain* (power dynamics, resource competition) lacking the stabilizing framing or personal narrative integration of humility. It's a domain split *and* a failure of narrative integration across roles.
  5.  **Leo (Global Dishonesty):** *Preserves Vice.* Dishonesty manifests *across multiple, diverse domains* (financial, emotional, social) with *no domain boundary or framing* containing it. It demonstrates cross-situational consistency *of vice*, fulfilling the consistency requirement negatively. No coherent narrative could integrate this as anything but dishonesty.
  6.  **Identical Helpers (Narrative Integration):** *Distinguishes Virtue Possession.* Both show equivalent domain-specific helping behavior. However, the *narrative integration* is key: Helper One *constitutes* their kindness through their self-story ("trying to be kind"), making the disposition part of their practical identity. Helper Two's narrative *dissociates* the actions from their self, preventing the formation of a stable disposition ("kindness") attributable to *them*. The behavior is real; the virtue possession depends on self-constitution.

  ---

  **Applying the Framework to Your Virtual Compassion Case:**
  *   **Case:** An individual displays consistent, meticulous compassion for digital entities within an immersive virtual environment (VE) but shows no comparable behavior in physical-world (PW) interactions.
  *   **Analysis:**
      *   **Domain/Framing:** The VE constitutes a powerful *domain/framing*. Its rules (consequences, feedback loops, anonymity?), affordances (ease of care, reduced complexity?), and role definitions ("caretaker"?) actively *scaffold and constitute* the disposition "compassionate caregiver *within this VE*." It meets domain-specific consistency and framing dependence.
      *   **Narrative Integration:** Does the individual *narratively endorse* this VE compassion as expressing their values/selves? Or do they see it as "just a game," "meaningless," or dissociated from their "real" self?
          *   *If Integrated:* "In the VE, I can *truly be* the caring person I aspire to be." → **Possesses the virtue *within the VE domain*.** It's a real, contextually embedded disposition reflecting their self-constitution in that space.
          *   *If Dissociated:* "It's just pixels; it doesn't mean anything about *me*." → **Does *not* possess the virtue, even within the VE.** The behavior is situationally elicited by the framing but not integrated into their character/narrative. They lack the disposition *as a virtue*.
      *   **Lack of PW Compassion:** This does *not* automatically negate the VE virtue if the domains are distinct and the VE compassion is narratively integrated. The lack of cross-domain consistency highlights the *domain-specificity* and *framing dependence* of the disposition.

  ---

  **Why This Preserves All Six & Why It's Coherent:**
  1.  **Accommodates Specificity:** Maria, David, Chen explicitly rely on domain boundaries.
  2.  **Accommodates Framing:** Fairness Monitors and the VE case show virtues constituted/enabled by structures.
  3.  **Accommodates Narrative:** The helpers and VE case make narrative central to virtue *possession*, not just behavior.
  4.  **Accommodates Global Vice:** Leo shows cross-domain consistency *without* domain boundaries, meeting the threshold for a global vice.
  5.  **Coherence:** It avoids contradiction by defining virtues *not* as monolithic, context-independent entities, but as *stable dispositional tendencies* that are:
      *   *Localized:* To specific domains defined by shared goals, norms, and challenges.
      *   *Scaffolded:* By institutional roles, rules, and affordances that enable and shape their expression.
      *   *Constituted:* By the agent's narrative self-understanding, which integrates (or fails to integrate) behavioral patterns into their practical identity.

  **Implications for Situationism vs. Virtue Ethics:**
  *   **Against Radical Situationism:** It affirms real, relatively stable dispositions (virtues/vices), rejecting the idea that behavior is *only* explained by immediate situational pressures (Leo, Maria's accounting, David's rescues, the VE case if integrated).
  *   **Against Naïve Globalist Virtue Ethics:** It radically qualifies globalism, showing virtues are domain-bounded, framing-dependent, and narratively constituted, explaining fragmentation (Maria, David, Chen) and the power of roles (Monitors, VE).
  *   **Synthesis:** This view **absorbs the central situationist insight** (behavior is profoundly sensitive to context/framing) **within a modified virtue framework** (character exists, but as localized, scaffolded, narrative-dependent dispositions). It's closer to a *sophisticated, empirically informed virtue ethics* than to either pure camp. Virtue is real but messy, contextual, and dependent on both external structures and internal self-creation.

  **Which Judgment Might Need Adjustment?** The framework holds all six. The tension isn't fatal; it reveals the *actual complexity* of character. The key is rejecting the assumption that virtues *must* be global to be real. Local, framed, narratively integrated dispositions are still genuine aspects of character. Leo shows global vice *is* possible, but it's not the only valid form a character trait can take. Your intuitions map beautifully onto this more nuanced, psychologically plausible conception of virtue.
