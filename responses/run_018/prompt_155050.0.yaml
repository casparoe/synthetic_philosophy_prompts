  Originality-wise, this is absolutely worth pursuing. Linking post-scarcity ethics to ancient philosophy while wrestling with Bloomsbury's legacy? That's three layers most analyses miss. The unresolved tension itself is fertile ground - perhaps Keynes's genius was holding both ideas together. 

