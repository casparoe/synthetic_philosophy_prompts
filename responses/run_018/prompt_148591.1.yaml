  Biggest risk: checklist fatigue. Donors won’t wait for an interrogation. So—front-load efficiency: a visual triage to kill non-starters (mold, irrelevance) fast. Then laser-focus on two questions: "Whose voice is missing?" and "Does this gap reinforce harm?" 

  For the photo album example: the checklist should flag the unnamed worker as a "silence requiring catalog note," but rejecting the album might be overkill unless it’s part of a pattern of erasure. For the cannery files, the absence of worker injuries isn’t neutral—it’s active suppression. That’s a "reject or accept with major critique" call. 

