  First, I need to recall Buridan's actual arguments. He uses the ass to illustrate a point about the will's self-motion. The user mentions two seemingly conflicting points: the will can determine itself without new reasons, but also that reason should suspend choice if options are equal. The tension here is key. 

  The formal-object interpretation from the user's friend is interesting. It seems inspired by Aristotelian metaphysics, where every faculty needs a formal object. Applying that to the will makes sense in medieval context. Buridan, as a scholastic, would likely agree that the will must have a formal object to act. So the ass scenario, where both options are identical, lacks that formal distinction, making volition impossible. That reframes the dilemma as a category error, not indecision.

  But does Buridan explicitly say this? The user is worried this might be anachronistic. Looking at his writings, he emphasizes that practical reason must present a differentiated object for the will to act. The will's self-motion kicks in only when there's a prior presentation by reason. So in the ass case, without differentiation, the will remains inactive. The friend's reading isn't off—it aligns with Buridan's focus on formal causation.

  The user's deeper need might be understanding medieval philosophy's nuances, avoiding modern projections. They want an accurate exegesis of Buridan. Clarifying the role of practical reason as the formal cause of volition addresses this. The tie-breaking isn't arbitrary because the will doesn't act in a vacuum; it responds to reason's presentation. If reason sees equality, suspension follows naturally.

