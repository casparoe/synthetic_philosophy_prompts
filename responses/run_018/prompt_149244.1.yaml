prompt: |-
  hey, i'm trying to understand a passage in buridan's ethics commentary where he sets up the ass between two identical bales of hay. he says both appetites are of exactly equal strength, pulling in oposite directions, and then he claims the will doesn't just stay frozen but can determine itself to one side, not because any new reason appeared but because the will has its own power of self-motion. but then he also seems to say that if reason truly sees the options as equal, the rational appetite ought to suspend choice until something distinguishes them. so is he allowing arbitrary tie-breaking or not? my friend brought up this niche reading that the whole problem isn't really about decision paralysis at all, but about formal causation: just like the intellect needs a formal object to know anything, the will needs a formal object to want anything, so the ass scenario is actually a category mistake that assumes volition can happen without a formal cause. i don't know if that's a real medieval point or just anachronistic philosophy-of-mind talk being projected back. can you help me parse what buridan is actually claiming about whether the will can move without a prior reason, and whether that formal-object interpretation makes sense of the passage?
reasoning: |-
