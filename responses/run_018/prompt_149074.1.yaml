answer: |-
  ### Classroom Activity: "The Harm Tribunal"  
  *(90-minute role-play on incommensurable moral frameworks)*  

  **Learning Objective:** Participants discover that attempts to rank honour, dignity, and victimhood cultures as "morally superior" founder on incommensurable definitions of fundamental harm.  

  **Materials:**  
  - Role cards (3 sets, 1 per faction)  
  - 15 tokens per faction (e.g., coloured counters)  
  - Timer  
  - Whiteboard for tracking proposals/vetoes  
  - Debrief handout (terms/concepts)  

  **Setup (15 mins):**  
  1. **Divide students** into three factions of six. Each faction receives:  
     - A sealed envelope labelled only *Faction A/B/C* (do **not** reveal "honour/dignity/victimhood" yet).  
     - 5 role cards (each student plays one role; sixth is "Negotiator"):  
       - *Faction A (Honour):* Family Elder (prioritises reputation), Accused Student (seeks public vindication), Debate Coach (upholds tradition), Community Leader (demands public apology), Witness (loyal to family). *Core drive: Repair identity via public status restoration.*  
       - *Faction B (Dignity):* School Principal (enforces rules), Impartial Adjudicator (demands evidence), Accused Student (wants due process), Legal Guardian (protects individual rights), Ethics Tutor (focuses on fairness). *Core drive: Separate act from person via neutral procedure.*  
       - *Faction C (Victimhood):* Marginalised Student (highlights systemic bias), Advocacy Group Rep (demands structural change), Counsellor (focus on emotional harm), Whistleblower (exposes power imbalance), Parent (seeks institutional accountability). *Core drive: Name power structures in remedy.*  
     - 15 tokens. Each token = faction's "influence capital." Spending tokens to push proposals or veto others reduces final score.  
     - **Scenario Brief (identical for all):**  
       *"During a regional debate finals, prestigious ‘Kingswood Academy’ accuses ‘Riverdale School’ debater Alex Lee of plagiarism. Evidence is contested. Riverdale’s debate trophy is revoked, damaging its historic reputation. Alex’s family (prominent donors) faces public shame. A student journalist reveals Kingswood’s team had privileged access to materials, alleging systemic bias. Three factions must agree on a remedy. Failure costs ALL factions tokens."*  

  2. **Rules:**  
     - **Stakes:** Tokens determine "Influence Ranking." Highest score chooses real perks (e.g., seating priority next seminar; bonus biscuit ration).  
     - **Veto Costs:** Vetoing a proposal costs 3 tokens. Compromise requires unanimous consent.  
     - **Rounds:** 20 mins each. After each, factions lose 2 tokens if no agreement.  
     - **Negotiators:** One per faction presents proposals but cannot decide alone. Factions vote internally first.  

  **Activity Timeline (60 mins):**  
  *(Facilitator: Keep strict time; announce rounds loudly)*  

  1. **Round 1: Define the Harm (20 mins)**  
     - *Task:* Factions privately discuss: "What is the *core injury* here?" Draft one statement.  
     - *Predictable clash:*  
       - A (Honour): "Insult to Riverdale’s honour; must restore standing."  
       - B (Dignity): "Unfair process; investigate act, not family."  
       - C (Victimhood): "Kingswood’s privilege caused harm; admit systemic bias."  
     - *Outcome:* Groups deadlock. No shared statement. Each loses 2 tokens.  

  2. **Round 2: Propose Remedies (20 mins)**  
     - *Task:* Factions propose one remedy via Negotiators. Others accept, veto (cost: 3 tokens), or counter.  
     - *Sample proposals:*  
       - A: *"Public apology ceremony; Kingswood surrenders next year’s trophy slot."* (Seeks symbolic reparation)  
       - B: *"Independent panel reviews evidence; if plagiarised, Alex alone is suspended."* (Seeks procedural justice)  
       - C: *"Kingswood admits elitism; funds equity training + Riverdale keeps trophy."* (Seeks structural accountability)  
     - *Predictable vetoes:*  
       - B vetoes A ("punishes innocents"); C vetoes B ("ignores power"); A vetoes C ("dishonours Kingswood").  
     - *Outcome:* Mutual vetoes. All lose 2 tokens + 3 per veto.  

  3. **Round 3: Forced Compromise (20 mins)**  
     - *Task:* Draft ONE joint remedy. Any faction can veto (cost: 3 tokens).  
     - *Predictable failure:* Internal dissent escalates (e.g., Dignity’s Adjudicator vs. Victimhood’s Whistleblower). Token depletion forces half-measures (e.g., "Investigate but no apology"), but honour/victimhood factions veto as "empty" or "cowardly."  
     - *Outcome:* Likely no agreement. All lose tokens.  

  **Debrief (15 mins):**  
  *(Reveal framework labels only now)*  
  1. **Map failures to concepts:**  
     - Round 1 deadlock → *Incommensurable harms:*  
       - Honour: Injury to public identity.  
       - Dignity: Injury to procedural fairness.  
       - Victimhood: Injury from systemic power.  
     - Round 2 vetoes → *Remedy clashes:*  
       - Honour’s public restoration vs. Dignity’s private neutrality vs. Victimhood’s structural naming.  
     - Round 3 → *Compromise impossibility:* Each framework’s non-negotiable "red line" (e.g., honour needs public shame reversal; victimhood needs power confession).  

  2. **Key realisations:**  
     - **No neutral ranking:** Asking "Which culture is best?" assumes a *fourth evaluative stance* (e.g., an "audience culture") judging all three—but this itself is a hidden framework.  
     - **Harm hierarchy:** Moral superiority depends on which harm you prioritise. Honour centres *status injury*, dignity centres *rights violation*, victimhood centres *power-based suffering*.  
     - **Cost of incommensurability:** Token loss mirrors real-world coordination failure (e.g., protests vs. courts vs. reparations).  

  3. **Simulation limits:**  
     - Cannot replicate *historical embeddedness* (e.g., why shame feels existential in honour cultures).  
     - Flattens *phenomenological weight* (e.g., visceral indignation in dignity contexts).  
     - **Takeaway:** Frameworks aren’t "stages" but parallel moral "languages" translating harm differently.  

  **Predictable Issues & Fixes:**  
  - **Problem:** Students resist roles/stereotype factions ("But *I* wouldn’t care about reputation!").  
    - *Fix:* Pre-activity: "Commit to your role’s logic—even if alien. This is anthropology, not autobiography."  
  - **Problem:** Token haggling dominates; philosophy gets lost.  
    - *Fix:* Pause mid-round: "How does your faction’s token use reflect its non-negotiable values?"  
  - **Problem:** One faction "sabotages" by vetoing everything.  
    - *Fix:* Remind them post-veto: "Your tokens now = 5. Can your faction afford another round?"  
  - **Problem:** Time overruns in Round 3.  
    - *Fix:* Hard stop at 20 mins; use abruptness to highlight collapse.  

  **What Students Should Take Away:**  
  > *"Moral frameworks are tools for diagnosing harm. Calling one 'superior' is like claiming a scalpel is 'better' than a stethoscope—it depends whether you prioritise surgery or diagnosis. The 'fourth culture' dilemma shows that ranking them requires standing outside all three... which no one can truly do."*  

  ---  
  **British English Notes:**  
  - "honour" (not "honor"), "plagiarised" (not "plagiarized"), "prioritise" (not "prioritize")  
  - Vocabulary: "timetable" (schedule), "debate" (contextually same), "biscuits" (cookies), "whilst" (while)  
  - Scenario uses British school names ("Kingswood Academy," "Riverdale School")  

  This structure forces experiential learning: students *feel* the framework clash as their remedies collapse, making abstract theory visceral. The token system concretises why compromise fails when non-negotiables conflict.
