  Interesting tension here: Is this absence proof that causal models can't capture transcendent agency? Or just that they're not meant to? I lean toward the latter—these tools methodologically bracket metaphysics, much like physics equations don't contain "why" but "how". The journalist might be probing whether science can ever address theological premises. 

