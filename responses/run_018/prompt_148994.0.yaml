answer: |-
  ### 1. The Engineered Scenario (120 words)
  On Earth, the Civic Bond is a municipal institution established by a 1923 charter. Clause 14 permits temporary property requisition during "catastrophic civil emergencies," defined as events causing >50% local population displacement. This clause has never been invoked, even during severe floods or wartime disruptions falling short of that threshold. On Twin Earth, the Civic Bond’s founding charter is physically identical—same parchment, ink, signatories, and wording—*except* Clause 14 is absent. Every historical event, practical application, public understanding, and legal precedent concerning the Civic Bond is identical across both planets. No one has ever noticed the Clause 14 difference; it remains a dormant, unexercised potential on Earth and a non-existent possibility on Twin Earth.

  ### 2. Internalist Reasoning (100 words)
  An internalist/descriptivist view holds that reference is fixed by speakers’ associated mental concepts. Earthlings and Twin Earthlings possess identical descriptive beliefs about the Civic Bond: its visible functions, historical role, enabling legislation, and practical effects. They associate "Civic Bond" with the same set of properties derived from their identical experiences and social context. The dormant Clause 14 on Earth plays no role in their conception of the institution, as it has never been used, referenced, or practically manifested. Since the descriptive content mentally associated with "Civic Bond" is identical for speakers on both planets, they unquestionably refer to the same institution.

  ### 3. Causal-Externalist Reasoning (100 words)
  Standard causal-historical externalism traces reference back to the initial baptism of the term. On both Earth and Twin Earth, "Civic Bond" was introduced identically during the signing of their respective charters in 1923 to denote the institution created by that very document. The causal chains of reference transmission—from the founders to subsequent generations—are identical in every observable detail. The physical absence of Clause 14 in the Twin Earth charter is a microphysical difference at the origin point. However, since this difference has never causally impacted *any* subsequent use, understanding, or application of the term or institution, it doesn’t disrupt the reference.

  ### 4. Normative-Function Reasoning (100 words)
  Normative-function externalism holds that the reference of institutional terms depends on the *complete* normative structure, including unexercised rules defining potential powers and obligations. On Earth, Clause 14 is part of the Civic Bond’s constitutive rules. It defines a latent normative power – the *authority* to requisition property under extreme, unrealised conditions. This alters the Civic Bond’s functional architecture and counterfactual possibilities: it *could* act in ways Twin Earth’s cannot. Twin Earth’s Civic Bond lacks this potential entirely. Since the institution’s full normative essence differs – one possesses a dormant but real normative capacity the other lacks – "Civic Bond" refers to distinct institutions.

  ### 5. The Isolating Feature (80 words)
  The isolating feature is the **dormant constitutive rule's counterfactual force**. For normative-function externalism, institutional identity hinges on the *complete* set of rules defining powers, obligations, and permissions, irrespective of activation. Clause 14 on Earth imbues the Civic Bond with a latent normative authority – a *de jure* power to act in specific counterfactual scenarios. Twin Earth’s Civic Bond fundamentally lacks this authority. This difference in the underlying normative blueprint, despite identical historical activation and surface properties, constitutes a difference in institutional kind according to this view.

  ### 6. The Removal Test (80 words)
  If the dormant clause difference is removed – either Clause 14 is excised from Earth’s charter or identically added to Twin Earth’s – the theories converge. Internalism and causal externalism already saw sameness; they continue to do so. Crucially, normative-function externalism now also sees sameness: the normative architectures become identical. Earth loses the latent power, Twin Earth gains it (or vice versa), aligning their complete functional structures. All three theories would then agree "Civic Bond" refers to the same institution on both planets, confirming the dormant clause is the critical variable.

  ### 7. Defensive Counter-Attack (80 words)
  A defender of normative-function externalism, accused of hair-splitting, would argue the case *validates* their core claim: institutions *are* their constitutive rules. Ignoring dormant rules, they’d contend, is like claiming two identically functioning computers are the same model if one has a disabled co-processor the other lacks. The *potential* matters. The Civic Bond’s very identity includes its *authorised* responses to extreme cases, even if unused. Denying this ignores how institutions derive meaning and authority from their full legal/rule-based foundations, not just observed behaviour. The difference is real, just unmanifested.

  ### 8. Honest Assessment (80 words)
  It does not cheat, but strategically isolates the disputed factor. Real institutions *do* have dormant clauses (e.g., constitutional emergency powers unused for centuries). The scenario realistically ensures this difference has *no* causal, historical, or psychological impact, isolating it purely for the normative-functional analysis. It avoids sci-fi or prediction by making the clause’s dormancy hinge on a specific, unmet threshold. The "cheat" suspicion arises because the difference seems practically irrelevant – but that’s precisely the point of contention: *is* such a normative difference semantically relevant despite practical irrelevance? The case forces that debate.
