answer: |-
  ### BLUF: The tension becomes visible by forcing groups to design repair protocols using *only* one emotion's toolkit (private quantification vs. public ritual) within the constraints of delayed/uncertain attribution.

  **Setup (5 min):**  
  Introduce the Meridian co-op: rotating anonymous auditors log harms ("Resource Hoarding Incident: -50 units"). Names obscured for 30 days; full logs then public. Split group into **Team A** (Guilt-Architecture ONLY: "Private Ledger Keepers") & **Team B** (Shame-Architecture ONLY: "Community Weavers"). **Rules:** NO saying "guilt" or "shame." Build a *process* for repairing harms *before* attribution is certain (Days 1-29). Use only your toolkit. Status Points (+1 each) for: Most Creative Tool, Strictest Adherence, Best Debrief Insight.

  **Activity (40 min total):**  
  1.  **Protocol Construction (25 min):** Teams design their repair system.  
      *   *Team A (Guilt):* Focus on self-reporting, internal restitution (e.g., "Anonymous debt tokens repaid via extra chores"), private apologies to the *co-op entity*, quantified contributions.  
      *   *Team B (Shame):* Focus on communal acknowledgment, symbolic acts (e.g., "Public resource-sharing pledge ceremony," temporary role demotion in communal tasks), restoring collective trust.  
  2.  **Scenario Response (15 min):** Reveal the staged harm: "**DAY 1 LOG:** Auditor #7 flags 'Severe Negligence: Community Garden plot ruined (Est. Repair: 20hrs).'" Groups *apply* their protocol to THIS harm (attribution unknown!).

  **Debrief (35 min):**  
  1.  Teams present protocols & responses (10 min).  
  2.  **Mapping:** Ask: "What *kind* of pressure does Team A's system create? Team B's?" "Where did 'the group' vs. 'the individual' reside?" Formalize as guilt (internalized duty, private repair) vs. shame (externalized judgment, public reintegration).  
  3.  **What Will Go Wrong:** Groups will blur architectures ("private apology" sneaks into Shame group; "public ledger" into Guilt). Time crunch forces simplistic protocols. Attribution uncertainty might be downplayed.  
  4.  **Honest Limitation:** This setup **cannot** reproduce the *generational, unconscious embedding* of these emotions into culture; it presents culture as a conscious, top-down "choice" rather than an evolved tacit norm.

  **Status Points Awarded during Debrief.** Core tension made visible: **Uncertain attribution forces groups to rely *solely* on their emotion's inherent motivational structure (private duty vs. public standing) to prompt repair, revealing their distinct mechanisms and vulnerabilities.**
