answer: |-
  ### Bottom Line
  National character isn't a coherent *natural* category (essentialism fails), but it functions as a potent *bureaucratic performative script*. An adequate theory must explain its social reality and coordination effects without mistaking the script for inherent essence.

  ### Desiderata for an Adequate Theory
  **Non-Negotiable:** Must handle **diaspora populations** (identity persistence sans territory), **pre-state societies** (character before modern nations), and **subnational regions** (e.g., Scots vs. "British"). Cannot collapse **statistical clustering** (measurable trait averages) into **normative stereotypes** (prescriptive judgments), **group-level description** (trends) into **individual prediction** (expectations of persons), or **descriptive uses** (observation) into **prescriptive uses** (nation-building). Must respect **cross-cultural psychology** (e.g., personality trait distribution ≠ national borders) and **historical change** (shifts over generations). **Camp Preference:** Framing national character as a **state-driven performative script** used to coordinate populations is highly valuable; the theory must explain the script's resilience/failure *socially* (institutions, rituals, media), not just via individual beliefs.

  ### Scorecard
  *   **Descriptivist/Statistical:** ⚠️ Handles clustering, psychology, and group-individual distinction well. Fails historical change, prescriptive uses, diaspora/pre-state cases, and the script's performative power. Reduces to data.
  *   **Constructivist:** ✅ Best fit. Explains script creation/stickiness (rituals, education, media), distinguishes description/prescription, handles historical change and subnational/diaspora dynamics (as contested scripts). Can address state coordination. Risks underestimating statistical patterns.
  *   **Essentialist:** ❌ Fails catastrophically. Collapses all distinctions, ignores psychology/history, can't explain diaspora/pre-state societies or script dynamics. Reduces to reified stereotypes.

  ### Reasoning
  The non-negotiables stem from empirical reality: nations are fluid constructs (history/diaspora), group trends aren't individual destinies (psychology), and stereotypes harm (distinction collapse). The script framing explains why the *idea* persists instrumentally. Constructivism uniquely balances social reality with anti-essentialism.
