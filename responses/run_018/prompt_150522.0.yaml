answer: |-
  Here’s a diagnosis of the Mary’s room stalemate, reconstructing the core disagreement, separating substantive from verbal issues, proposing a conceptual distinction, and identifying potential paths forward:

  ### Diagnosis of the Stalemate
  The deadlock arises from **two conflated questions** masquerading as one:
  1. **Ontological Question**: *Are phenomenal properties reducible to physical properties?*  
     (Do subjective experiences exist as fundamental or emergent physical facts?)
  2. **Epistemic-Representational Question**: *Can all knowledge about color experience be fully encoded in non-phenomenal (structural/functional) terms?*  
     (Is first-person acquaintance necessary to "complete" the description?)

  Both sides tacitly agree that Mary gains *something* upon seeing red. The dispute hinges on whether this "something" reveals a **gap in ontology** or a **gap in representational capacity**.

  ### Implicit Disagreement: Representational Formats vs. Ontology
  - **Physicalists (e.g., Lewis, Nemirow)**:  
    Argue Mary acquires a new *concept* or *mode of access* to pre-existing physical facts. They equate "physical information" with **fundamental microstructure** (e.g., wavelength reflectance, neural activation patterns).  
    - *Implicit Claim*: Structural descriptions can *ontologically exhaust* reality.  
  - **Anti-Physicalists (e.g., Jackson, Chalmers)**:  
    Argue Mary learns a new *fact* about subjective experience. They interpret "physical information" as **objective, third-person structural/functional relations** (e.g., causal roles, algorithms).  
    - *Implicit Claim*: Structural descriptions *fail to capture intrinsic phenomenology*.

  **Substantive Disagreement**:  
  Whether structural/functional descriptions (even infinitely detailed ones) can *ontologically ground* phenomenal qualities ("qualia") without remainder.  

  **Verbal/Framing Disagreement**:  
  The definition of "physical information":  
  - Physicalists: *Completed fundamental physics* (microphysics + laws).  
  - Anti-Physicalists: *Any third-person description* (including high-level functional roles).  

  ### Proposed Conceptual Distinction:  
  To dissolve ambiguity, distinguish:  
  - **Ontological Completeness (OC)**:  
    *All entities/properties in reality are physical (or supervene on the physical).*  
  - **Representational Saturation (RS)**:  
    *All facts can be fully encoded in non-phenomenal, structural/functional terms.*  

  **The Stalemate Reformulated**:  
  Physicalists assert OC → RS. Anti-Physicalists deny RS → OC (via Mary’s epistemic gap). **The real battleground is RS**: Can structural descriptions fully substitute for phenomenal concepts?  

  ### What Could Move the Debate?  
  **Empirical findings on concept acquisition in sensory-deprived subjects** hold the most promise. Justification:  
  1. **Addresses RS Directly**:  
     - If congenitally blind subjects taught exhaustive structural/functional color science can *use phenomenal color concepts accurately* upon gaining sight (e.g., identify novel hues without training), this supports RS (and thus OC).  
     - If they exhibit *conceptual confusion* or *inability to apply concepts* despite prior knowledge, it undermines RS (suggesting acquaintance is necessary for saturation).  
  2. **Bypasses Framing Traps**:  
     - Results wouldn’t rely on contested definitions of "physical" — they test whether *third-person descriptions enable first-person competence*.  
  3. **Breaks Circularity**:  
     - Current arguments hinge on intuitions about conceivability (e.g., zombies). Empirical data forces re-evaluation of these intuitions.  

  **Why Other Avenues Fail**:  
  - **Formal Theorems**: Descriptive incompleteness (e.g., Gödelian arguments) is unlikely to apply cleanly to phenomenology.  
  - **Phenomenological Reports**: Subjective data is dismissed as non-objective by physicalists.  
  - **Nothing at All**: The debate *is* resolvable in principle — it hinges on empirical claims about cognition.  

  ### Conclusion
  The stalemate persists because anti-physicalists attack RS to refute OC, while physicalists defend OC by redefining RS as trivial (e.g., "ability knowledge"). **Clarifying the OC/RS distinction forces confrontation with the empirical question: *Can structural knowledge simulate phenomenal competence?*** Experiments with sensory restoration (e.g., Project Prakash) offer the best path to resolution. Only data showing whether Mary *could* functionally master color concepts *before* seeing red can break the deadlock. Until then, the debate remains a clash of intuitions about representational capacity.
