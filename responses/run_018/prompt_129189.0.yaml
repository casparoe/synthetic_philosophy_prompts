answer: |-
  **Bottom line:** Queuing creates the strongest obligation for a visitor because violating it exploits the collective trust and expectation that sustains the system, making it a form of free-riding.

  **Convention's Claim**

  In Tokyo, a tip left on the tray
  Is deemed intrusive, not a needed grace;
  In Berlin, crossing where the red lights play
  Is reckless folly, scorning time and space.
  The London queue, a patient, snaking line,
  Demands no more than order, calm, and wait –
  Just local customs, clearly etched and fine,
  Where strangers learn to navigate the state.
  But queue-jumps steal what patient souls provide:
  The trust that others *will* restrain their feet,
  A faith the cutter cynically defied.
  Is this demand then moral, just, and meet,
  Or merely strategy, to keep things neat?
  The line still forms; the question stays discrete.

  **(Word count: 89)**

  **Breakdown:**
  *   **Lines 1-4 (Tipping & Jaywalking):** Presented as context-specific, avoidable faux pas (intrusive tip, reckless jaywalk).
  *   **Lines 5-8 (Queuing):** Introduced as a neutral "order" and "custom" requiring simple "wait".
  *   **Line 9 (Volta):** "But queue-jumps steal..." directly introduces the free-rider objection.
  *   **Lines 10-11:** Explain the stolen collective expectation ("trust that others *will* restrain").
  *   **Lines 12-13 (Sestet Question):** Explicitly asks if this makes queuing moral or just strategically smart ("strategy, to keep things neat").
  *   **Line 14 (Couplet):** Returns to the physical reality ("The line still forms") while leaving the moral status unresolved ("the question stays discrete").
