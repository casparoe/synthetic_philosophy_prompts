prompt: |-
  Draft the joint statement that a strategic-rationalist and a normative-commitment theorist could both sign after a good-faith adversarial collaboration on cooperation in the prisoner's dilemma. The strategic-rationalist holds that both one-shot and iterated dilemmas are fully explicable through expected-utility maximization, with cooperation in iterated cases accounted for by the shadow of the future and evolutionary selection for reciprocity strategies; the normative-commitment theorist holds that genuine cooperation requires a non-instrumental recognition of the other party's standing, that strategic models merely describe behavioral correlation rather than joint action, and that defection in the one-shot case expresses a genuine normative failure rather than a rational choice.

  Format the document as follows. First, a numbered section of agreed claims: about the formal payoff structure of the one-shot dilemma; about the transformation of incentives in the iterated version with indefinite or unknown termination; about the empirical success of reciprocity strategies in evolutionary simulations; about the observable difference between sustained behavioral correlation and shared intentional action; and about the current limits of predictive models in ecological contexts with heterogeneous agents. Second, the precise formulations of disagreement, each phrased in wording that its own side would accept. Third, the cruxes. I propose three: (i) whether the shadow of the future explains cooperation or only describes conditions under which strategic agents behave cooperatively without recognizing others; (ii) whether evolutionary selection for reciprocity provides normative justification or only causal explanation; and (iii) whether the one-shot dilemma reveals a rational preference for defection or a moral failure of mutual disregard.

  Fourth, for each crux, specify a concrete case or argument both parties agree bears on it, with each side's prediction recorded in advance. For (i), consider high-stakes, anonymous, genuinely one-shot interactions in which cooperation nonetheless occurs at non-trivial rates; for (ii), consider evolutionary dynamics in populations with heterogeneous payoff structures in which cooperative equilibria emerge that are not individually payoff-maximizing; for (iii), consider structured scenarios in which agents possess full information about mutual defection outcomes yet still face a choice between coordination failure and unilateral sacrifice.

  Fifth, present the residual disagreements in a table with columns for the crux, the strategic-rationalist's position and prediction, the normative-commitment theorist's position and prediction, the agreed test case, and the respective predicted outcomes. Sixth, conclude with a brief assessment of whether any portion of the dispute is verbal—specifically, whether disagreement about whether cooperation is genuine reduces to a definitional dispute over the term rather than a substantive disagreement about mental states, evolutionary dynamics, or normative commitments.

  Write in a formal register appropriate for a philosophy seminar. Do not include requests for bibliographies, citation lists, or references to obscure theoretical frameworks that depend on specialized archival knowledge. Ensure that all claims can be evaluated by a model with no web access.
