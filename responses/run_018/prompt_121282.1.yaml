answer: |-
  ## Maxwell's Bookkeeper

  My function is the **door**.
  I watch the frantic race.
  Which molecule, which **side**?
  I note the crucial **bit**.
  My ledger starts out **blank**.
  I pay no tax in **heat**.
  I pay no measured **cost**.

  A molecule? That **cost**
  is not for me or **door**.
  I see it flee the **heat**,
  decide it goes that **side**.
  I scratch a single **bit**
  where once there was the **blank**.

  A fresh page stays quite **blank**.
  Each swift decision's **cost**
  is just to write the **bit**.
  I crack the needed **door**,
  direct it to the **side**
  that cools the rising **heat**.

  The gas sheds restless **heat**.
  My notebook's fading **blank**.
  I balance left and **side**,
  accounting without **cost**.
  I know just when the **door**
  must open for a **bit**.

  I capture every **bit**.
  No energy as **heat**
  escapes my watchful **door**.
  Each page that was once **blank**
  records this seeming **cost**-
  free sorting, side by **side**.

  The pressure builds one **side**.
  I logged each passing **bit**.
  Now comes the final **cost**:
  My notebook, full of **heat**
  (though seeming cold and **blank**)
  demands I close the **door**.

  To write this **bit** cost nothing; the **blank** absorbed the **heat**.
  But clearing space, that **cost** reclaims the **heat** I beat.
  The **door** swings free again; no gain remains on either **side**.

  ---

  The poem commits to Landauer's principle: information is physical, and the fundamental cost lies in *erasing* information to reset the demon's memory (notebook). The demon's measurement and sorting are depicted as thermodynamically neutral operations, transferring entropy from the gas molecules into the physical state of the notebook. The cost is incurred when the full notebook must be erased (returned to a low-entropy "blank" state), dissipating kT ln 2 per bit as heat back into the system. The poem fudges slightly by implying the act of *writing* the bit uses the "blank" resource without immediate heat cost, which is essentially correct for the demon's local perspective but abstracts the entropy transfer. It leans on the still-debated point about whether measurement *itself* inherently requires an energy cost beyond the Landauer erasure; the poem explicitly takes the position that it does not, which is the Landauer-Bennett resolution, though some interpretations argue measurement might involve dissipation depending on implementation. The core physics – the erasure cost settling the entropy books – is presented as the key mechanism.
