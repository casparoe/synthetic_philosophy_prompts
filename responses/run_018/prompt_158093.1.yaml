  - Opacity Principle might support replacement because its current dysfunction is visible and no deeper purpose is evident 

  The zoning repeal (1950s rule) is key here - she supported scrapping it despite its age because its original function became obsolete. This suggests Opacity Principle dominates when an institution's dysfunction is demonstrable. Since the reading period shows similar observable dysfunction (used for travel, fractures courses), she'd likely support replacement. 

