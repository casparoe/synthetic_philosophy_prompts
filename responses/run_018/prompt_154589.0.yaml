answer: |-
  ## Sensorium and Subordination
  *(A Newtonian Villanelle)*

  Space is God's sensorium, boundless and still,
  Through which pure Mind perceives the comet's arc,
  The Son is not the Father, nor one will.

  Not void, but Presence bridging vale and hill,
  Where falling fruit obeys creation's mark;
  Space is God's sensorium, boundless and still.

  No shared substance, no divided thrill:
  The Father reigns alone, distinct, apart.
  The Son is not the Father, nor one will.

  The prophets saw corruption's creeping ill,
  False triads worshipped by the fallen dark;
  Space is God's sensorium, boundless and still.

  The prism's truth, the planetary wheel,
  Attest the One who needs no co-eternal spark.
  The Son is not the Father, nor one will.

  This vast expanse, where stars His presence fill,
  Denies the crafted Word an equal part.
  Space is God's sensorium, boundless and still.
  The Son is not the Father, nor one will.

  How strange the One who holds the cosmic chart,
  Whose sensorium knows each atom's place,
  Employs a servant, set from time's own start,
  To mediate the void's embracing grace?
  Space is God's sensorium, boundless and still
  Meets revelation in a servant's face:
  The Son is not the Father, nor one will.

  ---

  **Notes on Execution:**

  *   **Refrains:**
      *   "Space is God's sensorium, boundless and still" captures Newton's concept of absolute space as the divine medium of perception and action ("sensorium"), emphasizing its infinite, homogeneous, and immovable nature.
      *   "The Son is not the Father, nor one will" directly states Newton's anti-Trinitarian view: rejection of consubstantiality ("not the Father"), denial of co-equality ("nor one will"), and the subordination of the Son.
  *   **Structure:** The refrains alternate strictly through the five tercets (A1, B, A2 / A, B, A1 / A, B, A2 / A, B, A1 / A, B, A2). The final quatrain brings both refrains together (A1, B, A2, B) as demanded, forcing their juxtaposition.
  *   **Specificity for Newtonians:**
      *   "Vast expanse," "boundless," "cosmic chart," "void's embracing grace" evoke absolute space arguments.
      *   "No shared substance," "False triads," "crafted Word," "set from time's own start" reference anti-Trinitarian arguments and the created/subordinate Son.
      *   "Prophets saw corruption's creeping ill," "False triads worshipped by the fallen dark" allude to Newton's historical-allegorical interpretations of Daniel/Revelation linking Trinitarianism to corruption.
      *   "Prism's truth," "planetary wheel," "falling fruit" ground the poem in Newton's scientific work.
  *   **Accessibility:** The core tension – an all-present God using a distinct subordinate agent – is clear without specific knowledge. Words like "sensorium," "void," "cosmic chart," "crafted Word," and "servant" convey the paradoxical relationship universally.
  *   **Avoiding Devotion:** The language is descriptive and philosophical ("pure Mind," "Presence," "cosmic chart," "mediates," "employ"), focusing on Newton's conceptual framework rather than worship.
  *   **Final Quatrain:** This stanza explicitly poses the paradox ("How strange...") of the unitary, spatially omnipresent God ("holds the cosmic chart," "knows each atom's place") working through a historically subordinate agent ("servant, set from time's own start," "mediates"). The concluding couplet images the meeting of the refrains ("Space... Meets revelation...").
