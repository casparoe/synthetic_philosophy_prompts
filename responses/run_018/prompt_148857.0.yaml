  Let me break this down carefully. First, Margalit's "thick relations" framework provides clear criteria: what counts as thick (familial, communal ties with mutual obligations) versus thin (distant, transactional). His permission to forget in thin relations isn't amnesia but ethical triage. Then Rieff's therapeutic critique - that's the real sticking point. His "interdictory culture" concept about sacred prohibitions is crucial here; when the user mentions "ceremonially releasing" guilt, that's exactly what Rieff would call therapeutic management.

