  What worries me is the "engineering" aspect the user mentions. Once remembrance becomes designed, the temptation to make it palatable creeps in. That's where Rieff's warning bites hardest. Maybe the test is whether the ritual makes participants uncomfortable - if it doesn't, it's probably therapeutic camouflage. 

