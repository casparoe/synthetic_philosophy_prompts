prompt: |-
  my roommate keeps throwing around "a promise is just a speech act, not a contract" whenever i cancel on her, like last week when i bailed on her gallery openeing. she uses it to claim breaking a promise is only socially awkward, not actually morally wrong. can you break down the different precise philosophical claims that line could be smuggling in? i want the menu: is she saying performatives lack propositional content, or that illocutionary force never generates real obligation, or that promises are like chess moves with only conventional weight, or something about "promissory collateral" being a fiction? lay them out from the trivial to the genuinely radical, and for each say whether it actually lets her off the hook or still leaves me in the wrong. she mentioned austin and maybe searle but i think shes mixing them up—dont quote anyone, just map the logic. also tell me which reading someone usually means when they use this to win an argument about flaking.
reasoning: |-
  Okay, the user's roommate keeps saying "a promise is just a speech act, not a contract" whenever the user cancels plans, like bailing on a gallery opening. The roommate uses this to argue that breaking a promise is only socially awkward, not morally wrong. The user wants a breakdown of the philosophical claims behind that line, structured from trivial to radical, and whether each actually excuses the roommate from moral blame. They also want to know which interpretation people usually mean in arguments about flaking.

  First, I need to recall the relevant philosophy. The roommate mentioned Austin and Searle, who are key figures in speech act theory. Austin introduced the idea of performatives—utterances that do something rather than just describe. Promises are a classic example. Searle built on this with his taxonomy of speech acts, where promises fall under commissives, which commit the speaker to future action.

  The user wants the claims mapped out without quoting philosophers directly. They want a logical breakdown, not a citation-heavy response. The key points to cover are: performatives lacking propositional content, illocutionary force not generating obligation, promises as purely conventional, and "promissory collateral" as fiction. Each should be evaluated for whether it lets the roommate off the hook morally.

  Starting with the weakest claim: Promises aren't legally binding contracts. This is true in everyday contexts. But the user's situation isn't about legality; it's about personal commitments. So while legally the roommate might be correct, morally, flaking is still wrong because trust is broken. This doesn't excuse the action.

  Next, performatives lacking propositional truth value. Austin's point is that saying "I promise" isn't true or false—it's an action. But this doesn't negate the moral obligation created. The act of promising still binds the speaker ethically. So again, the roommate isn't off the hook.

  Then, illocutionary force doesn't create automatic obligations. Searle argued that successful promises require sincerity and intent. If the user didn't intend to keep the promise, it might not be valid. But in this case, the user likely did intend at the time but failed later. Unless the roommate is claiming the promise wasn't sincere initially, which is a stretch. So moral obligation remains.

  Purely conventional weight, like chess moves. Comparing promises to game rules ignores the interpersonal trust involved. Breaking a promise damages relationships, whereas breaking a chess rule just ends the game. So this argument doesn't hold in social contexts—moral wrong persists.

  The radical claim: Obligation is entirely fictional. This is a nihilistic view that denies any inherent morality in promises. But even if someone holds this belief, socially, flaking is still seen as wrong. The roommate would be hypocritical unless they reject all social norms. This stance is inconsistent and doesn't absolve them.

  The user also asks which interpretation is common in arguments about flaking. Typically, people mix the "not a contract" and "conventional weight" points, downplaying moral responsibility. But as shown, none of the philosophical claims fully excuse breaking a promise in personal contexts. Trust and expectations matter.

  Underlying needs: The user probably feels guilty but wants to counter the roommate's argument. They need validation that their actions were morally significant despite the roommate's claims. They might also seek strategies to articulate why flaking is wrong beyond social awkwardness. Highlighting the difference between legal contracts and moral commitments is key here. Emphasizing the relational harm caused by broken promises can strengthen their position.
answer: |-
  Here's a precise breakdown of the philosophical claims potentially embedded in "a promise is just a speech act, not a contract," ordered from weakest/trivial to strongest/radical, with analysis of whether they absolve you morally:

  **The Menu of Claims:**

  1.  **"Not Legally Binding" (Trivial/Literal):**
      *   **Claim:** A casual promise *isn't* a legally enforceable contract (lacks consideration, formal offer/acceptance, intent to create legal relations).
      *   **Logic:** "Contract" is used strictly in the legal sense. Breaking it might cause social friction, but it doesn't open you up to lawsuits for damages.
      *   **Lets Her Off the Hook? NO.** This is almost certainly true for gallery openings and coffee dates, but **completely irrelevant** to the *moral* question. It dodges the core issue of interpersonal obligation and trust. You're still morally wrong for breaking your word and letting her down, even if she can't sue you.

  2.  **"Lacks Propositional Truth Value" (Austin-lite, Misapplied):**
      *   **Claim:** Promises are performatives, not constatives. "I promise" *does* something (commits you) rather than *describes* a state of affairs that can be true/false like "The sky is blue." Therefore, the *promise itself* isn't judged as true or false.
      *   **Logic:** Focuses on the *type* of utterance. Mistakenly concludes that because it's not a statement of fact, it lacks normative force.
      *   **Lets Her Off the Hook? NO.** This misrepresents Austin. Performatives *succeed or fail* based on context (felicity conditions). A successful promise *does* create an obligation precisely *because* it's performative, not in spite of it. Failure to keep it makes the *original act* arguably infelicitous (like a void contract) and *definitely* creates the moral wrong of breaking a commitment.

  3.  **"Illocutionary Force Doesn't Automatically Create Moral Obligation" (Searle-adjacent, Selective Reading):**
      *   **Claim:** While promising has the *illocutionary force* of commitment, this force is conventional (linguistic/social) and doesn't necessarily translate to a *binding moral* obligation in every instance. The force itself is neutral; morality comes from elsewhere.
      *   **Logic:** Separates the linguistic act (the promise) from the ethical consequence (the obligation). Might suggest the obligation arises only from *other* factors (like the importance of the event, reliance, relationship norms), not inherently from the speech act alone.
      *   **Lets Her Off the Hook? PROBABLY NOT (Context is Key).** This is a more nuanced but dangerous claim for her. Searle *argued* that promising inherently creates an obligation *because* of its illocutionary point. Even if we grant this separation:
          *   The *point* of promising *is* to create an obligation. Using the act implies you understand and invoke this convention.
          *   In standard social contexts (like committing to attend a friend's event), the illocutionary force *is* understood to generate a *prima facie* moral obligation. Ignoring this is deceptive.
          *   **Only potentially absolving if:** The context made the "promise" clearly non-serious or non-committal (e.g., "Yeah, maybe, I'll *try* to swing by" vs. "I promise I'll be there"). Your gallery opening example likely doesn't qualify.

  4.  **"Purely Conventional Weight, Like Chess Rules" (Radical Conventionalism):**
      *   **Claim:** Promises are *only* moves within a social "game" or institution. The obligation is *entirely* conventional, like the obligation to move a pawn forward only. Breaking a promise is just breaking a rule of the social game, resulting in "penalties" like awkwardness or loss of trust points, but not inherently *immoral* – just socially inconvenient or strategically unwise.
      *   **Logic:** Reduces morality to social convention. The "wrongness" is akin to violating etiquette, not a deeper ethical failing. Morality requires something more fundamental than social agreement.
      *   **Lets Her Off the Hook? HIGHLY DEBATABLE & SOCIALLY UNTENABLE.**
          *   **Against:** This ignores the fundamental role of trust, reliance, and the intentional creation of expectations inherent in promising. Damaging trust *is* a core moral harm, not just a rule violation. Most ethical systems (deontological, consequentialist, virtue-based) find promise-breaking inherently problematic.
          *   **For (Her Argument):** If one holds a very strict view that *all* morality is *only* conventional, then technically yes. But this makes *all* social commitments (outside explicit contracts) morally weightless, which is a radical and impractical position she likely doesn't consistently apply. It also renders her complaint ("socially awkward") meaningless, as that's all she claims is at stake.

  5.  **"Promissory Obligation is Entirely Fictional / 'Collateral' is a Myth" (Nihilistic/Hyper-Skeptical):**
      *   **Claim:** There is *no such thing* as a genuine obligation arising from a promise. The feeling of obligation is an illusion. The "collateral" (trust, relationship damage) isn't a real debt incurred by the promise but merely a predictable *consequence* of disappointing someone's *expectation*. Morality doesn't enter into it; it's just cause and effect in the social sphere.
      *   **Logic:** Denies the existence of any non-legal, speech-act-generated obligation whatsoever. Words simply cannot create moral bonds; only actions (like signing a contract) or inherent duties (like to family) can.
      *   **Lets Her Off the Hook? TECHNICALLY YES, BUT...** This is the most radical claim. If true, you were never "in the wrong" morally, just causally responsible for her disappointment.
      *   **However:**
          *   This view is philosophically extreme and marginal. It contradicts how humans universally experience and structure social life.
          *   It makes her own appeal to the "speech act" concept pointless – why even mention it if promises are utterly empty?
          *   It's hypocritical unless she *never* expects others to keep promises to *her* and *never* feels morally wronged when they break them. Her annoyance suggests she *does* believe in the obligation.
          *   Social existence would be nearly impossible without accepting promissory obligations as real.

  **Which Reading Wins Arguments About Flaking?**

  People using this line **almost always rely on a muddled combination of Claims 1 ("not a *legal* contract") and 4 ("just a social rule/convention")**.

  *   **Why Claim 1?** It sounds sophisticated ("contract" has legal weight) and seems to downgrade the seriousness. "It's not a *contract*!" implies it's trivial.
  *   **Why Claim 4?** It directly serves the purpose: it reduces the obligation to mere social awkwardness ("just a speech act rule"), explicitly denying deeper moral wrong. It frames flaking as a minor social faux pas, like using the wrong fork, rather than a betrayal of trust.

  **Conclusion:**

  *   **Her Core Move:** She's leveraging philosophical jargon (speech act theory) to **downshift the normative force** of a promise from the **moral realm** ("you did something *wrong*") to the **conventional/social realm** ("you did something *awkward* or *against the rules*").
  *   **Does it Work?** Not convincingly. Claim 1 is irrelevant. Claims 2 & 3 don't successfully sever the link between promising and moral obligation in standard contexts. Claim 4 is a radical position she likely doesn't genuinely hold consistently. Claim 5 is nihilistic and self-defeating.
  *   **You're Still (Likely) in the Wrong:** Barring extreme context (where the "promise" wasn't genuine), bailing on a commitment like a gallery opening, especially after explicitly promising to attend, **is morally problematic.** It involves letting someone down, breaking trust, and failing to uphold a commitment you freely made. The "speech act" nature of the promise is *how* you created that obligation, not a reason it doesn't exist. Her argument is primarily a **rhetorical tactic** to minimize accountability by misapplying philosophy. The social awkwardness *stems from* the perceived moral lapse, it doesn't replace it.
