prompt: |-
  I'm defending the thesis that the AI alignment problem comprises three conceptually incommensurable tasks—specification (fixing the governing objective, which I model as institutional design rather than preference learning), robustness (stability under distributional shift), and transparency (epistemic access to internal alignment)—and that treating them as one problem has caused category mistakes in evaluation. The audience is mostly AI safety researchers (reward hacking, scalable oversight) plus philosophers of science skeptical of taxonomic splits without operational differences. Draft my Q&A prep: the six or seven objections they'll actually raise, in likely order of damage, phrased in each camp's vocabulary, each with a two-minute reply, a note on where the reply is soft, and whether to concede or hold. Include the objection I'm hoping nobody asks—that transparency failures reduce to robustness failures in high-dimensional spaces, collapsing the distinction. State what I should concede upfront to lower defenses, and identify the single reply that must land for the thesis to survive.
