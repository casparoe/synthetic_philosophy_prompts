answer: |-
  Here's the taxonomy structured as a decision tree with concrete claims, using "normative friction" as the core axis. Each leaf names a position, states its awkward commitment, and flags key overlaps/incoherencies:

  **Root Question:**  
  *"When someone breaks an unwritten social norm, is the primary damage caused by:*  
  **(A) Disrupted coordination** (e.g., inefficiency, confusion, missed opportunities) *OR*  
  **(B) Moral/spiritual contamination** (e.g., pollution of shared values, sacred space, or group identity)?"

  ---

  ### Branch 1: Breach as **COORDINATION FAILURE**  
  *"Society's main job after a norm breach is to re-synchronize behavior."*  

  *Next Split:*  
  *"Is repair best achieved through:*  
  **(A1) Explicit systems** (codified rules, transparent penalties, formal mediation) *OR*  
  **(B1) Implicit signals** (gossip, subtle shaming, ambient social pressure)?"

  *Then Split:*  
  *"Is high normative friction (slow/painful repair):*  
  **(A2) Adaptive** (necessary for managing complex risks) *OR*  
  **(B2) Pathological** (wastes energy and stifles innovation)?"

  #### Leaves:
  1. **Technocratic Optimizers**  
     *Claim:* "High friction from coordination breaches should be reduced via *explicit systems* because it's just inefficiency, not evil."  
     → *Awkward Commitment:* "Formalizing *all* social missteps (like interrupting) into bureaucratic procedures is ideal."  
     *(Explicit + Adaptive)*  

  2. **Harmony Engineers**  
     *Claim:* "High friction from coordination breaches is useful *if managed implicitly*; subtle social cues prevent chaos without rigid rules."  
     → *Awkward Commitment:* "Trusting gossip networks to efficiently fix traffic jams or project delays."  
     *(Implicit + Adaptive)*  

  3. **Bureaucratic Reductionists**  
     *Claim:* "High friction around coordination problems is *always pathological*; purge implicit norms and replace them with *minimal explicit rules*."  
     → *Awkward Commitment:* "A society can function with *only* traffic laws and contracts—no 'please/thank you' needed."  
     *(Explicit + Pathological)*  

  4. **Silent Efficiency Cult**  
     *Claim:* "Even coordination breaches should resolve with *near-zero friction* via unspoken social osmosis—formal repair *or* high friction kills agility."  
     → *Awkward Commitment:* "If you offend colleagues by always being late, they should *passively* adjust without mentioning it."  
     *(Implicit + Pathological)*  

  ---

  ### Branch 2: Breach as **MORAL CONTAMINATION**  
  *"Society's main job after a norm breach is to cleanse symbolic pollution."*  

  *Next Split:*  
  *"Is repair best achieved through:*  
  **(A1) Explicit purification** (public trials, prescribed penance, dogma) *OR*  
  **(B1) Implicit ritual** (collective storytelling, symbolic gestures, hushed reintegration)?"

  *Then Split:*  
  *"Is high normative friction (elaborate cleansing):*  
  **(A2) Adaptive** (builds cohesion in high-risk environments) *OR*  
  **(B2) Pathological** (breeds repression and cult-like control)?"

  #### Leaves:
  5. **Sacred Order Guardians**  
     *Claim:* "Moral breaches demand *high explicit friction*—public rituals of condemnation/absolution are essential for stability."  
     → *Awkward Commitment:* "Blasphemy deserves a longer trial than murder because it erodes cosmic order."  
     *(Explicit + Adaptive)*  

  6. **Ritual Resilience Networks**  
     *Claim:* "Moral pollution is best contained by *high implicit friction*—community storytelling and quiet reintegration preserve unity without tyranny."  
     → *Awkward Commitment:* "Gossip circles and subtle shunning are *more ethical* than courts for healing sacrilege."  
     *(Implicit + Adaptive)*  

  7. **Reform Purists**  
     *Claim:* "High friction around moral breaches is *inherently oppressive pathology*; replace taboos with *explicit, minimal rights*."  
     → *Awkward Commitment:* "Banning all 'unwritten rules' of decency (e.g., dress codes) because they *might* become moralized."  
     *(Explicit + Pathological)*  

  ---

  ### Critical Collapses & Empty Sets:
  - **⚠️ BRANCH COLLAPSE:** "Implicit + Moral + High Friction" (Leaf 6) vs. "Explicit + Moral + High Friction" (Leaf 5)  
    *Reality Check:* In practice, *moral* breaches with *high implicit friction* (e.g., religious shunning) often evolve explicit codes or are indistinguishable from low-key explicit systems. True "implicit-only" moral repair is rare—most rituals have unwritten rules.  

  - **❌ INCOHERENT COMBO:** "Coordination Breach + Heavy Implicit Ritual Repair"  
    *Why it fails:* If breaking a norm is *just* a coordination glitch (e.g., queue-jumping), demanding elaborate *implicit rituals* (e.g., months of gossip to restore balance) contradicts the "it's not moral" premise. High friction for pure efficiency looks irrational.  

  - **EMPTY LEAF:** "Moral Contamination + Implicit Repair + Low Friction"  
    *Why it’s vacant:* If a breach *pollutes the sacred*, societies rarely let it slide with quiet, effortless fixes. Low friction implies the norm wasn’t truly moralized.  

  ---

  ### Taxonomy at a Glance:
  | **Breach Type**       | **Repair Style** | **Friction View** | **Position**               |  
  |-----------------------|------------------|-------------------|----------------------------|  
  | Coordination Failure  | Explicit         | Adaptive          | Technocratic Optimizers    |  
  | Coordination Failure  | Implicit         | Adaptive          | Harmony Engineers          |  
  | Coordination Failure  | Explicit         | Pathological      | Bureaucratic Reductionists |  
  | Coordination Failure  | Implicit         | Pathological      | Silent Efficiency Cult     |  
  | Moral Contamination   | Explicit         | Adaptive          | Sacred Order Guardians     |  
  | Moral Contamination   | Implicit         | Adaptive          | Ritual Resilience Networks |  
  | Moral Contamination   | Explicit         | Pathological      | Reform Purists             |  

  Use this to map real cultures: Japan's workplace harmony (Harmony Engineers?), Taliban virtue policing (Sacred Order Guardians?), Silicon Valley's "move fast" ethos (Silent Efficiency Cult?). The friction lens exposes trade-offs binary models miss.
