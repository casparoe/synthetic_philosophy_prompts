prompt: |-
  okay so im putting together this handout for a class on cultural norms — not the usual "are rules good or bad" debate but more like, how much social energy does a culture actually spend keeping people in line? i was talking with my roommate last night and we started using this term "normative friction" to mean the resistance a society generates when someone breaks an unwritten rule, measured not by punishment severity but by how hard it is to restore social equilibrium. its probably not a real academic term but it feels like a useful axis, maybe more granular than the standard tight vs loose thing.

  i want a taxonomy or decision tree that sorts positions on how societies should organize rule-following, using that friction idea instead of the usual binary. root question: is a norm breach mainly a coordination failure (like missing a train schedule) or a moral contamination (like violating a purity taboo)? then branch on whether repair is explicit — laws, fines, public callouts — or implicit, like gossip networks and ritual cleanup. then split on whether high friction is seen as adaptive for collective risk or as a pathology that kills innovation. each leaf needs a name (real-world position or just "unnamed") and one sentence on its most awkward commitment — think "adaptive ritualists," "loose coordinationists," or "unnamed: high explicit friction with zero moral framing." phrase every node as a concrete claim someone could agree or disagree with without already knowing the taxonomy labels. also flag any pair of leaves your tree cant actually separate — i suspect implicit high-friction with moral framing might just collapse into explicit high-friction with moral framing, so call that out. and point out empty combos that look incoherent, like treating breaches as pure coordination problems but still demanding heavy implicit ritual repair — does that even hang together? six to eight leaves max, no bibliography or citation list, just the conceptual map written like youre explaining it to someone who just walked into the room.
