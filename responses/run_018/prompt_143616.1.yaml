answer: |-
  Below is a reusable decision procedure for evaluating submissions invoking Gödel's incompleteness theorems. It focuses on **preconditions** (effective axiomatization, arithmetic representation, consistency) and **common missteps** (e.g., ignoring omega-consistency, misapplying to non-formal systems). The procedure is designed for **non-specialists** and includes specific checks with clear stop/hand-off points.

  ---

  ### **Gödel Application Checklist**  
  **Run in order. Stop at first red flag.**  
  1. **Identify the Formal System**  
     - Check: Does the essay clearly define a **formal system** (e.g., axioms + rules of inference)?  
     - Stop (Misuse) if:  
       - No system is specified (e.g., "all AI" or "human thought").  
       - The system is non-mathematical (e.g., "society," "ethics," "climate").  
     - Hand-off (Expert) if:  
       - The system is ambiguously defined (e.g., "neural networks as formal systems").  

  2. **Check Effective Axiomatization**  
     - Check: Is the system **effectively axiomatized**? (Can its axioms and proofs be listed algorithmically?)  
     - Stop (Misuse) if:  
       - The system is inherently informal (e.g., analog models, human intuition).  
       - Axioms are not mechanically verifiable (e.g., "common sense rules").  

  3. **Check Arithmetic Representation**  
     - Check: Can the system **represent basic arithmetic**? (e.g., Robinson Arithmetic: addition, multiplication, induction-like properties).  
     - Stop (Misuse) if:  
       - The system lacks arithmetic (e.g., propositional logic, simple models without numbers).  
       - No evidence of arithmetic encoding (e.g., "voting rules" without numeric encoding).  
     - Hand-off (Expert) if:  
       - Arithmetic representation is plausible but unproven (e.g., a custom logic with numbers).  

  4. **Check Consistency Assumptions**  
     - Check: Does the author **assume consistency**? (Gödel requires the system to be consistent.)  
     - Stop (Misuse) if:  
       - The author argues inconsistency from Gödel alone (theorems assume consistency; they don’t create contradictions).  
     - Hand-off (Expert) if:  
       - Consistency is debated (e.g., for exotic systems).  

  5. **Check for Omega-Consistency (Niche Cases)**  
     - Check: Is the author using the **original 1931 Gödel theorem** (not Rosser-improved)?  
     - Stop (Misuse) if:  
       - They invoke the **second theorem** but rely on omega-consistency (modern versions only need consistency).  
     - Hand-off (Expert) if:  
       - They invoke the **first theorem** without Rosser and the system may be omega-inconsistent (rare outside math).  

  6. **Validate the Gödelian Claim**  
     - Check: Does the claim match what the theorems actually say?  
       - First theorem: "There is a true-but-unprovable statement **in this system**."  
       - Second theorem: "The system cannot prove its own consistency **within itself**."  
     - Stop (Misuse) if:  
       - Claims go beyond this (e.g., "Gödel proves AI is untrustworthy").  
       - Confuses incompleteness with inconsistency, undecidability, or practical flaws.  

  7. **Flag Self-Reference Misuse**  
     - Check: Is "self-reference" used as a vague gotcha?  
     - Stop (Misuse) if:  
       - Self-reference is claimed to cause paradoxes/incompleteness **without arithmetic** (e.g., "self-referential ethics = incomplete").  

  8. **Real-World Relevance**  
     - Check: Does the author jump from **formal incompleteness** to **real-world consequences**?  
     - Stop (Misuse) if:  
       - Claims physical systems (e.g., brains, computers) are "incomplete" in a Gödelian sense.  
       - Assumes unprovable statements imply real-world unreliability (e.g., "climate models fail").  

  ---

  ### **Test Phrases to Scan For (Red Flags)**  
  - "Gödel proves [X] must be incomplete/contradictory."  
  - "Self-reference makes [non-math system] Gödelian."  
  - "No formal system can be trusted because of Gödel."  
  - "True but unprovable" without mentioning arithmetic.  
  - "Consistency cannot be proven" applied outside math.  

  ---

  ### **Case Evaluations**  
  **Case 1: Pitch claiming Gödel proves no computer can understand ethics because self-reference is unavoidable.**  
  - **Step 1:** Identifies "computers" as the system → **Hand-off?** (Ambiguous if computers run a formal ethics system).  
  - **Step 2:** Assumes computers use a formal system → **Proceed**.  
  - **Step 3:** Ethics system lacks arithmetic → **Stop (Misuse)**. Ethics isn’t inherently arithmetic.  
  - **No further steps needed.**  
  **Verdict:** Misuse. Fails Step 3 (no arithmetic). Self-reference is irrelevant without arithmetic.  

  **Case 2: Draft arguing climate models are Gödel-incomplete, so long-range predictions are unreliable.**  
  - **Step 1:** Climate models are not formal systems (they’re simulations) → **Stop (Misuse)**.  
  - **No further steps needed.**  
  **Verdict:** Misuse. Fails Step 1 (non-formal system).  

  **Case 3: Voting-theory paper using recursive axioms, claims Gödel-incompleteness.**  
  - **Step 1:** Voting system with recursive axioms → **Proceed** (formal system).  
  - **Step 2:** Recursive axioms imply effective axiomatization → **Proceed**.  
  - **Step 3:** Voting theory rarely includes arithmetic → **Stop (Misuse) or Hand-off?**  
    - **Judgment call:** Unless the paper encodes arithmetic (e.g., voter counts as natural numbers), it fails.  
    - *Your intuition is likely correct: voting axioms ≠ arithmetic. Stop (Misuse).*  
  - **No further steps needed.**  
  **Verdict:** Misuse. Fails Step 3 (no arithmetic).  

  ---

  ### **Limitations & Honest Disclaimers**  
  - **Judgment calls:** Steps 3 (arithmetic) and 5 (omega-consistency) may require expert input.  
  - **Misfires:**  
    - **False positives:** May flag valid but poorly explained math (e.g., arithmetic hidden in jargon).  
    - **False negatives:** If an author disguises misuse with technicalities (e.g., "arithmetic" vaguely defined).  
  - **Non-covered issues:**  
    - Metaphysical claims (e.g., "consciousness requires non-algorithmic truth") → Always hand off.  
    - Rosser’s trick (bypasses omega-consistency) is assumed unless specified.  
  - **Biggest weakness:** Relies on authors defining their systems. Hand-off when unclear.  

  **Output Summary:**  
  - **Misuse:** Claims without formal systems, arithmetic, or consistency.  
  - **Hand-off:** Legit systems with ambiguity (e.g., custom logics, arithmetic plausibility).  
  - **Valid:** Only if all checks pass and claims stay within theorems (e.g., "PA cannot prove its consistency").  

  Use this to reject 90% of submissions quickly. For edge cases, default to hand-off.
