  Gödel's First Incompleteness Theorem (roughly): Any consistent formal system F within which a certain amount of elementary arithmetic can be carried out is incomplete; that is, there are statements of the language of F which can neither be proved nor disproved in F.

  Gödel's Second Incompleteness Theorem (roughly): For any consistent formal system F that can formalize a certain amount of arithmetic, the consistency of F cannot be proved in F itself.

  Key Preconditions for both theorems:
  1. The system must be effectively axiomatized (i.e., there is a mechanical procedure to decide what is an axiom and what is a valid proof).
  2. The system must be sufficiently strong to represent a certain amount of arithmetic (specifically, it must be able to represent all primitive recursive functions or, equivalently, have the power of Robinson Arithmetic or more).
  3. The system must be consistent (for the second theorem, we also require that the system is consistent so that the consistency statement is not trivially false; note that for the first theorem, we assume consistency to avoid triviality in the unprovable statement).

  Important note: The second theorem originally required omega-consistency (a stronger condition than consistency) for the first version, but Rosser later improved it to just consistency. However, for the first theorem, the original required omega-consistency, but Rosser also showed that consistency suffices. So in modern treatments, both theorems are stated for consistent systems that are sufficiently strong and effectively axiomatized.

