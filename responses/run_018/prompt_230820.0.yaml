prompt: |-
  I have just taken on a yearlong role as the philosopher attached to a consciousness science laboratory, and I need to convert a theory I have long defended in the seminar room into something a working lab can actually run. The laboratory's data are overwhelmingly first-person reports: subjects describing what they saw during masked and binocular-rivalry displays, neurological patients being asked whether anything was present during forced-choice tasks, and dreamers recounting their experience immediately after being woken in the scanner. In principle the lab has signed on to a heterophenomenological approach, understood as follows. A subject's report is a piece of raw data to be explained, neither an incorrigible description of a private realm nor noise to be discarded; the investigator reconstructs from the reports the apparent world the subject seems to be committed to, and then asks what the subject's brain, history, and situation must be like for the subject to produce just those reports, without granting the subject any special authority about what causes the reports.

  The director wants a reusable decision procedure rather than a position paper. The people who will use it are research assistants and postdocs with no philosophical training; they must decide within about half an hour per subject whether a report can be entered into the main analysis, how the condition should be coded, and what must be flagged for the principal investigator. These rulings determine which trials are classified as conscious or unconscious, which subjects are excluded, and what the laboratory ultimately claims in its papers, and the director must sign off on any coding that leans on a subject's report to settle a question about consciousness. Please give me a step-by-step procedure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the issue is one of values or interpretation rather than technique, and what the procedure will not settle no matter how faithfully it is followed.

  Then run the procedure on three cases currently on our desk: a blindsight patient who performs at 81 percent correct on a two-alternative forced-choice motion task while insisting he saw nothing and was guessing; a normal observer in a backward-masking study whose post-trial report contradicts the real-time visibility rating she gave during the trial, and who cannot say which of the two responses reflects what she experienced; and an apparently confabulating subject who offers a detailed, coherent description of an image shown during a screen interval that was in fact blank. For each, say what the procedure licenses us to write in the paper, and be explicit about at least one result the laboratory is likely to find unwelcome.
reasoning: |-
  We are designing a decision procedure for handling first-person reports in a consciousness science lab. The procedure must be usable by non-philosophers and take about 30 minutes per subject. The goal is to determine whether a report can be used in the main analysis, how to code the condition, and what to flag for the principal investigator.

   The heterophenomenological approach: 
     - Treat the subject's report as raw data to be explained.
     - Do not grant the subject special authority about the causes of the report.
     - Reconstruct the apparent world the subject seems committed to, then explain why the subject produces those reports.

   Steps of the procedure:

   1. **Is the report provided in the required context?**
      - Check that the report was given according to the lab's protocol (e.g., immediately after the trial, in the scanner, etc.).
      - If not, flag as protocol violation and exclude the trial unless the deviation is minor and well-documented. If excluded, stop.

   2. **Is the report interpretable?**
      - Can we understand what the subject is saying? (e.g., language barriers, mumbling, incomplete sentences, or non-sequiturs that cannot be parsed)
      - If not, flag as unintelligible and exclude. Stop.

   3. **Is the report about the target event?**
      - The report must pertain to the stimulus or experience under investigation (e.g., the masked stimulus, the dream content, etc.).
      - If the subject reports on something unrelated (e.g., a distraction, a previous trial), flag as off-topic and exclude. Stop.

   4. **Is the report internally consistent?**
      - Check for contradictions within the same report (e.g., "I saw nothing" and then "it was moving to the left" in the same response).
      - If inconsistent, flag as internally inconsistent. Do not exclude yet. Move to step 5.

   5. **Can the inconsistency be resolved?**
      - If the subject is available and time permits, ask for clarification (e.g., "You said both X and Y; can you explain?"). 
      - If the inconsistency remains unresolved, flag as unresolved inconsistency. The trial may be excluded or handled as per pre-specified rules (e.g., if the protocol says to exclude, then exclude). Otherwise, hand to the principal investigator (PI) for a decision.

   6. **Does the report align with the objective measures?** (Note: This step is for information, not necessarily exclusion)
      - Compare the report with the objective task performance (e.g., forced-choice accuracy) or with the stimulus presented.
      - If there is a mismatch, flag the mismatch. This does not automatically exclude the trial because we are doing heterophenomenology: the report is data to be explained. However, note the mismatch for the analysis.

   7. **Coding the condition:**
      - Based on the report, what does the subject seem to be committed to? (e.g., the subject says "I saw nothing" -> code as no conscious experience; "I saw a red circle" -> code as conscious experience of a red circle).
      - If the report is ambiguous, try to resolve by asking the subject (if possible and within the time limit) or use pre-specified coding rules (e.g., if the subject says "maybe" or "I think", code as unsure and use a pre-defined category). If still ambiguous, flag and hand to PI.

   8. **Special considerations:**
      - **Confabulation**: If the report is detailed and coherent but objectively false (e.g., describing a stimulus that wasn't there), code the report as a confabulation. This does not necessarily mean exclusion. The report is data: the subject is committed to having seen something. We code the condition as the subject's apparent commitment (so in this case, they report having seen an image, so we code as conscious experience of that image). But we note the objective fact that the stimulus was absent and flag as potential confabulation.

      - **Contradictory reports over time**: If the subject gives two reports that contradict (e.g., real-time rating vs. post-trial report), and step 5 (inconsistency resolution) fails, then we have two reports. We must code both as data. We might code the trial as having two conflicting reports and then use both in the analysis (but note the conflict). Alternatively, if the protocol specifies which report is primary, use that one and flag the conflict.

   9. **Final decision on inclusion:**
      - Exclude only if:
          a. Protocol violation (step 1)
          b. Unintelligible (step 2)
          c. Off-topic (step 3)
          d. Unresolved inconsistency that the protocol says is exclusionary (step 5)
      - Otherwise, include.

   10. **What to write in the paper:**
       - We report the subject's behavior (including the report) as data. We do not say "the subject was conscious of X" as a fact, but rather "the subject reported being conscious of X". We then analyze the conditions under which such reports occur.

   11. **What the procedure does not settle:**
       - It does not settle whether the subject actually had a conscious experience. We only report what they said and the context.
       - It does not settle the ultimate causes of the report (that's for the science to figure out).
       - It does not resolve deep philosophical issues about consciousness.

   Now, apply to the three cases:

   Case 1: Blindsight patient (81% correct on forced-choice motion task, insists he saw nothing and was guessing)

   Steps:
     1. Report is in required context? (Assuming yes) -> include.
     2. Interpretable? Yes.
     3. About the target event? Yes (he is reporting on what he saw during the motion task).
     4. Internally consistent? Yes (he consistently says he saw nothing and was guessing).
     5. (Not needed)
     6. Alignment with objective measures: Mismatch (high accuracy but denies seeing). Flag the mismatch.
     7. Coding: The subject reports no conscious experience -> code as unconscious trial (or no conscious perception). However, note that the report is of "nothing", so the condition is "no experience".
     8. (No confabulation here)

     What to write: 
        - "In the motion task, the patient performed at 81% correct but reported no conscious experience of the stimulus, stating that he was guessing."
        - The trial is included and coded as unconscious (based on report).

     Unwelcome result: The laboratory might want to say that the patient had unconscious perception, but the procedure forces us to code based on the report. However, note that the report is of not seeing, so we code as unconscious. But the high accuracy might lead to claims about unconscious processing, which is consistent.

   Case 2: Normal observer in backward-masking study. Post-trial report contradicts real-time visibility rating during the trial, and the subject cannot say which response reflects what she experienced.

   Steps:
     1. Both reports are in required context? (Assuming both were collected per protocol) -> include both.
     2. Both interpretable? Yes.
     3. About the target event? Yes.
     4. Internally consistent? No: the two reports (real-time and post-trial) are inconsistent.
     5. Can the inconsistency be resolved? We ask the subject, and she cannot say which reflects her experience. Therefore, unresolved inconsistency. Flag and hand to PI for a decision on how to code (but note: the protocol might have a rule, e.g., use the real-time rating as primary). If the protocol doesn't specify, the PI must decide.

     We assume the PI is handed the case. The procedure stops here for the RA and flags for the PI.

     However, for the sake of example, let's say the lab's pre-specified rule is: "In case of conflicting reports without resolution, use the real-time report as it is less prone to memory distortion." Then we code based on the real-time rating. But we note the conflict and the post-trial report in the data.

     What to write: 
        - "In one trial, the subject provided conflicting reports: a real-time visibility rating of X and a post-trial report of Y. Following our protocol, we used the real-time rating for coding. The subject could not resolve the conflict when asked."

     Unwelcome result: The laboratory might have to exclude the trial if the conflict is deemed too problematic, but the procedure as designed only excludes in specific cases (steps 1-3 and 5 if unresolved and exclusionary). Alternatively, if included, the conflict might weaken the interpretation.

   Case 3: Apparently confabulating subject: detailed, coherent description of an image during a blank screen interval.

   Steps:
     1. Report in required context? Yes -> include.
     2. Interpretable? Yes.
     3. About the target event? Yes (the interval that was blank).
     4. Internally consistent? The report is coherent and detailed, so internally consistent? Yes (no internal contradiction).
     5. Not needed.
     6. Alignment: Mismatch - the screen was blank but the subject reported an image. Flag as mismatch (and potential confabulation).
     7. Coding: The subject reports a conscious experience of an image (with details). We code the condition as conscious experience of that image. We note that the stimulus was absent.

     What to write: 
        - "In a blank screen interval, the subject reported a detailed experience of [description]. We coded this trial as a conscious experience of [the described content]."
        - We note in the paper that this occurred in a blank trial.

     Unwelcome result: The laboratory might not want to code a blank trial as having a conscious experience because it is a control condition. However, the heterophenomenological method requires us to take the report at face value as data. The subject is committed to having seen something. The challenge is that we now have a conscious report in a condition that was supposed to be a baseline. The lab might have to adjust their analysis to account for such false reports.

   Summary of the procedure:

     Step 1: Protocol check -> exclude if violation and stop.
     Step 2: Intelligibility -> exclude if unintelligible and stop.
     Step 3: Relevance -> exclude if off-topic and stop.
     Step 4: Check internal consistency in the same report. If inconsistent, go to step 5.
     Step 5: Try to resolve inconsistency. If unresolved, flag and hand to PI if protocol doesn't specify, or exclude if protocol says so.
     Step 6: Compare with objective measures and flag any mismatch (but do not exclude for mismatch).
     Step 7: Code the condition based on the subject's apparent commitment (what they report). If ambiguous, try to resolve or hand to PI.
     Step 8: Special cases (like confabulation) are handled by coding the report as the subject's commitment and flagging the mismatch.
     Step 9: Include the trial unless excluded in steps 1-3 or 5 (if exclusion is specified).

     The procedure does not decide:
        - The truth of the report.
        - The ultimate nature of consciousness.

     It only decides whether to include the trial and how to code the report.
answer: |-
  ### Step-by-Step Decision Procedure for First-Person Reports

  This procedure is designed for non-philosophers (e.g., research assistants) to handle first-person reports in ≤30 minutes per subject. It adheres to heterophenomenology: reports are data to explain, not incorrigible truths or noise. **Stop and exclude** at any "NO" step. Flag unresolved ambiguities for the PI. Always document decisions.

  #### Step 1: **Protocol Adherence Check**  
  - *Question:* Was the report collected per lab protocol (timing, method, context)?  
  - *Sufficient Answer:* YES (proceed). NO (exclude trial, flag as "protocol violation").  
  - *Stops Here If:* NO.  
  - *Values/Interpretation:* None. Pure protocol compliance.  

  #### Step 2: **Interpretability**  
  - *Question:* Is the report linguistically coherent and minimally describable (e.g., "I saw nothing," "A red circle")?  
  - *Sufficient Answer:* YES (proceed). NO if garbled, nonsensical, or silent (exclude trial, flag as "unintelligible").  
  - *Stops Here If:* NO.  
  - *Values/Interpretation:* None. Objective linguistic assessment.  

  #### Step 3: **Relevance**  
  - *Question:* Does the report address the target stimulus/task (e.g., masked image, dream content)?  
  - *Sufficient Answer:* YES (proceed). NO if off-topic (e.g., "The room was cold"; exclude trial, flag as "irrelevant").  
  - *Stops Here If:* NO.  

  #### Step 4: **Internal Consistency**  
  - *Question:* Is the report free of *within-response* contradictions (e.g., "I saw nothing, but it was red")?  
  - *Sufficient Answer:* YES (proceed). NO (flag as "internally inconsistent" and proceed to Step 5).  
  - *Values/Interpretation:* None. Contradictions are objective (e.g., "nothing" vs. "red").  

  #### Step 5: **Inconsistency Resolution**  
  - *Question:* Can the subject resolve the inconsistency *when asked*?  
  - *Sufficient Answer:*  
    - YES (accept explanation, proceed).  
    - NO (flag for PI; do **not** exclude yet).  
  - *Hands to Person If:* Inconsistency unresolved. PI decides whether to exclude or code conservatively.  
  - *Values/Interpretation:* PI weighs whether inconsistency undermines data utility (e.g., if unresolved, may code as "ambiguous" or exclude).  

  #### Step 6: **Cross-Validation (Optional but Recommended)**  
  - *Question:* Does the report conflict with *other data* (e.g., task performance, real-time ratings)?  
  - *Sufficient Answer:* Flag mismatch (e.g., "report/performance mismatch"), but **do not exclude**. Proceed.  
  - *Values/Interpretation:* None. Mismatches are data for heterophenomenology.  

  #### Step 7: **Coding the Condition**  
  - *Question:* What does the subject *appear committed to*? (e.g., "saw X," "saw nothing").  
  - *Rules:*  
    - Code verbatim (e.g., "no experience," "uncertain," "clear image of X").  
    - If vague (e.g., "maybe"), use pre-defined lab thresholds (e.g., "maybe" → "uncertain").  
  - *Hands to Person If:* Ambiguity persists after threshold application (PI decides final code).  
  - *Values/Interpretation:* PI may interpret ambiguous language (e.g., "a flicker" = weak consciousness?).  

  #### Step 8: **Final Inclusion/Exclusion**  
  - *Rules:*  
    - **Include** if Steps 1-3 passed and no PI exclusion in Step 5.  
    - **Exclude** only for protocol, intelligibility, relevance, or PI ruling.  
  - *Flag For PI:* Internal inconsistencies, ambiguities, or mismatches.  

  #### What the Procedure **Does Not Settle**  
  - Whether the subject *truly* had a conscious experience.  
  - The metaphysical nature of consciousness.  
  - Causation of reports (brain vs. "inner self").  
  - Long-term theoretical disputes (e.g., "Is blindsight *really* unconscious?").  

  ---

  ### Application to Cases

  #### Case 1: Blindsight Patient  
  - **Report:** Insists he "saw nothing" and was "guessing."  
  - **Objective Data:** 81% correct on motion task.  
  - **Procedure:**  
    1. **Protocol:** YES (report collected post-task).  
    2. **Interpretability:** YES ("saw nothing" is clear).  
    3. **Relevance:** YES (addresses stimulus).  
    4. **Consistency:** YES (no internal contradiction).  
    6. **Cross-Validation:** Flag "report/performance mismatch."  
    7. **Coding:** Commit to "no experience" (reports no consciousness).  
    8. **Inclusion:** Include trial.  
  - **Write in Paper:**  
    > "Patient performed at 81% correct on motion discrimination but *reported no conscious experience*, stating he was guessing."  
  - **Unwelcome Result:** Lab may want to claim "unconscious perception," but the procedure forces coding as "no experience," undermining claims that consciousness is necessary for high accuracy.  

  #### Case 2: Normal Observer with Contradictory Reports  
  - **Report:** Real-time rating (e.g., "visible") contradicts post-trial report (e.g., "invisible"). Subject cannot resolve conflict.  
  - **Procedure:**  
    1. **Protocol:** YES (both reports per protocol).  
    2. **Interpretability:** YES (both clear).  
    3. **Relevance:** YES.  
    4. **Consistency:** NO (contradiction between reports).  
    5. **Inconsistency Resolution:** NO (subject cannot resolve). → Flag for PI.  
  - **PI Decision:**  
    - *Options:* Exclude trial, code as "uncertain," or use pre-defined primary report (e.g., real-time rating).  
    - *Conservative Code:* Use real-time rating (less memory bias) but flag conflict.  
  - **Write in Paper:**  
    > "Subject gave conflicting visibility reports. Using real-time rating (per protocol), stimulus was coded as visible. *Flagged for contradiction in post-trial report*."  
  - **Unwelcome Result:** Lab risks criticism for "cherry-picking" reports if real-time ratings favor hypotheses.  

  #### Case 3: Confabulating Subject  
  - **Report:** Detailed description of image during blank screen.  
  - **Objective Data:** Screen was blank.  
  - **Procedure:**  
    1. **Protocol:** YES.  
    2. **Interpretability:** YES (coherent description).  
    3. **Relevance:** YES (addresses "stimulus" interval).  
    4. **Consistency:** YES (no internal contradiction).  
    6. **Cross-Validation:** Flag "report/stimulus mismatch."  
    7. **Coding:** Commit to "clear experience of [described image]."  
    8. **Inclusion:** Include trial.  
  - **Write in Paper:**  
    > "Subject *reported a detailed visual experience* of [image] during a blank screen interval."  
  - **Unwelcome Result:** Lab must include this as "conscious" trial, potentially skewing results (e.g., false positives in consciousness detection).  

  ---

  ### Summary for Lab  
  - **Output:** Standardized codes (e.g., "no experience," "uncertain," "clear experience of X") + flags (e.g., "mismatch," "inconsistency").  
  - **PI Sign-Off Required:** When coding relies on interpreting reports (Steps 5/7).  
  - **Core Tension:** The procedure prioritizes *subject commitment* over objective truth, which may conflict with lab hypotheses (e.g., coding confabulation as "conscious"). This is unavoidable in heterophenomenology.
