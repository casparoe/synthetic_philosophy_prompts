  First, I should acknowledge their audience's strengths: comfort with credences and models. But I must immediately flag that epistemicism isn't about distributed belief over a sharp boundary - that's a crucial intercept point. Their classifier analogy is useful but dangerous; I'll need to sanitize it by adding the "no fact of the matter" layer for supervaluationism. 

  The metaphysical distinction is key: Is vagueness in the world (epistemicism) or in our descriptions (supervaluationism)? I'll use the "God's-eye view" framing to make this visceral. For checks, I'll propose concrete scenarios where the theories diverge, like "Is there a precise millisecond when someone becomes adult?" 

  I should explicitly refuse higher-order vagueness and the unknowability debate - those are rabbit holes. Instead, I'll end by linking back to their interests: how this connects to probabilistic reasoning (credences over supervaluations vs hidden truths). 

