answer: |-
  Here is the complete exam package tailored to your specifications:

  ---

  **Exam Question**  
  *(Appears on student's paper)*  

  **Question 4 (20 marks; 90 minutes recommended)**  
  Number theorists often justify conjectures using probabilistic heuristics that treat arithmetic properties (e.g., primality) as independent random events. This approach succeeds in some cases (e.g., the Hardy-Littlewood correction to the twin prime heuristic) but fails catastrophically in others (e.g., the Mertens conjecture, despite numerical confirmation).  

  Articulate and defend a general criterion for when such a presumption of independence *justifies belief* in a conjecture. Your answer must:  
  - Explain why the twin prime case represents a "fixable" heuristic failure and the Mertens case a "fundamental" one,  
  - Address why exhaustive numerical verification cannot compensate for unmodeled dependencies,  
  - Illustrate your criterion with **one original example** (not twin primes or Mertens) where independence assumptions might plausibly succeed or fail.  

  *Do not merely summarize cases; focus on epistemological principles.*  

  ---

  **Model Answer**  
  *(~500 words; ideal student response)*  

  Probabilistic heuristics in number theory justify conjectures only when all *structurally significant dependencies* have been explicitly modeled and incorporated. The presumption of independence is epistemically sound not when events are truly random (they never are), but when unaccounted correlations are either (a) *local* (affecting only constant factors via small primes), or (b) *asymptotically negligible*. This criterion distinguishes "fixable" from "fundamental" heuristic failures.  

  In the twin prime conjecture, the initial independence assumption ignored modular constraints (e.g., both $n$ and $n+2$ being odd). Crucially, these dependencies arise from *finitely many small primes* and induce a *constant multiplicative error* (e.g., Hardy-Littlewood’s correction factor $2 \Pi_2$). Such errors are correctable via finite case analysis. Conversely, the Mertens conjecture failed because its heuristic ignored *global oscillations* in the Möbius function, tied to the complex zeros of the Riemann zeta function. These dependencies are non-local, persist infinitely, and introduce *unbounded phase shifts* invisible to any finite sampling.  

  This explains why numerical verification fails: dependencies can be *deferred* beyond computational reach (e.g., Skewes’ number for $\pi(x) - \mathrm{li}(x)$) or *oscillatory* (e.g., the Mertens discontinuity). Finite data cannot detect asymptotic divergence patterns governed by unmodeled analytic structures. Justification thus requires *structural exhaustiveness*: enumerating all congruence classes (local dependencies) and proving no deep number-theoretic invariants (e.g., zeta zeros) induce systematic bias.  

  Consider *squarefree pairs* as an original example: "Are there infinitely many $n$ where both $n$ and $n+1$ are squarefree?" A naive independence heuristic assigns probability $\prod_p (1-2/p^2) \approx 0.32$. This is justified: dependencies arise only from small primes $p$ dividing both terms (e.g., $p=2,3$), and correction factors (e.g., inclusion-exclusion for $p^2 \mid n$ and $p^2 \mid n+1$) suffice. Crucially, no zeta-like function controls squarefree distributions globally. Contrast this with heuristics for $\pi(x) < \mathrm{li}(x)$: independence fails catastrophically here because the bias depends on Siegel zeros—an unmodeled analytic dependency with oscillatory effects at astronomical scales.  

  Thus, heuristic justification demands proof that dependencies are *exhaustively cataloged and confined* to finite, correctable perturbations.  

  ---

  **Marking Scheme**  

  | Point | Marks | What full marks requires | How candidates typically blow it |  
  |-------|-------|---------------------------|----------------------------------|  
  | Articulation of a clear, non-trivial criterion linking heuristic justification to dependency management | 8 | Criterion must specify *how* dependencies affect justification (e.g., local vs. global, correctable vs. structural) and why this matters epistemically | Vague statements (e.g., "heuristics work when dependencies are small"); equating justification with mere empirical adequacy |  
  | Correct analysis of twin prime vs. Mertens as fixable vs. fundamental failure | 5 | Explicitly link twin prime errors to *finite* modular constraints and Mertens to *infinite/analytic* dependencies (e.g., zeta zeros) | Treating Hardy-Littlewood as "proof" of heuristic reliability; missing that Mertens shows numerical confirmation is insufficient |  
  | Critique of numerical evidence | 3 | Explain *why* computation fails (deferred/oscillatory dependencies; Skewes/Mertens as examples) | Claiming numerical checks up to $N$ make failure "improbable"; conflating bounded and unbounded errors |  
  | Original example illustrating criterion | 4 | Example must plausibly succeed/fail *by the stated criterion*; clear dependency analysis | Trivial/rehashed examples; no discussion of *why* dependencies are/aren't manageable (e.g., "this works because primes are random") |  
  | Coherence and avoidance of recitation | 0* | *Deduct up to 3 marks from total* for merely summarizing cases without synthesis, or failing to defend the criterion philosophically | Listing facts about Cramér's model; no epistemological argument about justification |  
  *Coherence is a holistic penalty applied post-sum (total marks capped at 20).  

  ---

  **Key design notes for your context**:  
  - The original example requirement forces application beyond lecture cases, filtering rote memorization.  
  - The marking scheme penalizes:  
    - **Overtrust in computation** (Mertens trap)  
    - **Misinterpreting correction** (e.g., "Hardy-Littlewood *proves* heuristics work")  
    - **Example superficiality** (e.g., inventing a scenario without dependency analysis)  
  - The "coherence" row deducts marks for answers that recite facts without philosophical engagement.  
  - The model answer’s squarefree pairs example is intentionally simple—students may choose others (e.g., Goldbach, prime gaps).
