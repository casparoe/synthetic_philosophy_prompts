prompt: |-
  I am a software engineer building governance rules for a cooperative platform where members vote on policy changes, but an expert arbitration board may block outcomes that breach core norms. I need a reusable decision procedure—derived from the philosophical debate over judicial review and the counter-majoritarian difficulty—that lets the board determine, in structured sequence, whether vetoing a democratic vote is legitimate. Specify the tests in order, what counts as a sufficient answer to pass or fail each, the point where the procedure mandates "no veto," the point where it mandates "veto," and the points where the issue is one of values rather than rules and must be handed back to human judgment. The procedure must distinguish overturning a vote that threatens protected rights from overturning one that merely reflects disagreeable policy priorities. Apply it to three proposals: (A) a vote to disable end-to-end encryption to ease content moderation; (B) a vote to redirect surplus maintenance budgets toward marketing incentives; (C) a vote to exclude a minority user group from revenue-sharing. For case A specifically, show how the procedure permits a veto that I—favoring minimal board intervention—would find objectionable. State clearly what categories of dispute the procedure is not designed to settle. Write no more than 400 words; do not include citations, bibliographies, reading lists, or references to specific scholars by name.
reasoning: |-
  We are designing a decision procedure for an expert arbitration board to determine whether to veto a democratic vote. The procedure must be structured, sequential, and based on the philosophical debate over judicial review and the counter-majoritarian difficulty. The goal is to distinguish between overturning votes that threaten protected rights and those that merely reflect policy disagreements.

  **Decision Procedure:**
  1. **Core Norms Breach Test:** 
     - *Question:* Does the proposal directly violate an explicit, non-derogable core norm of the cooperative (e.g., fundamental rights, non-discrimination, or procedural integrity)?
     - *Sufficient to pass (veto justified):* Clear evidence that the proposal's implementation would break a core norm as defined in the cooperative's foundational documents.
     - *Fail:* If the proposal does not directly violate a core norm, proceed to Test 2.

  2. **Procedural Legitimacy Test:**
     - *Question:* Were there substantial procedural flaws in the voting process that undermined the democratic legitimacy of the outcome (e.g., coercion, misinformation, exclusion of eligible voters)?
     - *Sufficient to pass (veto justified):* Evidence of significant procedural defects that meaningfully distorted the vote.
     - *Fail:* If the process was substantially fair, proceed to Test 3.

  3. **Rights-Protection Test:**
     - *Question:* Would the proposal, in practice, substantially infringe upon the fundamental rights of a minority group in a manner disproportionate to its benefits?
     - *Sufficient to pass (veto justified):* Evidence that the infringement is severe, targeted, and not reasonably necessary for a compelling collective interest.
     - *Fail:* If the rights impact is not severe or is proportionate, proceed to Test 4.

  4. **Policy Priority Test (Hands back to human judgment):**
     - *Question:* Does the veto decision rest primarily on disagreement with the policy's wisdom or priority, rather than a breach of core norms or rights?
     - *Sufficient to pass (no veto):* If the board's objection is grounded in policy disagreement, the procedure mandates **no veto**.
     - *Note:* At this stage, the board must refrain from vetoing because the issue is one of values (policy priorities) and not rules or rights.

  **Mandate Points:**
  - **Mandate "no veto":** After Test 4, if the board's concern is policy disagreement.
  - **Mandate "veto":** If any of Tests 1-3 are passed (i.e., core norm breach, procedural defect, or severe rights infringement).

  **Application to Cases:**
  - **Case A (Disable E2E Encryption):** 
    - Test 1: If core norms include privacy, disabling E2E may breach it. *If so, veto is mandated.* 
    - Test 3: If privacy is not explicit, but disabling E2E severely infringes privacy rights disproportionately, veto may be justified. *For minimal intervention, this might be objectionable if the board expands "rights" beyond explicit norms.*
  - **Case B (Redirect Maintenance to Marketing):** 
    - Test 1: Unlikely to breach core norms. 
    - Test 2: Assume fair vote. 
    - Test 3: No rights infringement. 
    - Test 4: Policy priority → **no veto**.
  - **Case C (Exclude Minority from Revenue-Sharing):** 
    - Test 1: Likely breaches non-discrimination core norm → **veto mandated**.

  **Objection in Case A:** The procedure might permit a veto in Test 3 if the board interprets "fundamental rights" broadly (e.g., privacy as a fundamental right even if not explicit). A minimal interventionist might argue this overreaches.

  **Limitations:** The procedure is not designed for:
  - Disputes about the board's own jurisdiction or composition.
  - Emergencies requiring immediate action.
  - Balancing competing rights without clear hierarchy.
  - Re-evaluating core norms themselves (which require constitutional amendment, not board veto).
answer: |-
  ### Decision Procedure for Expert Arbitration Board Veto  
  **Sequential Tests:**  
  1. **Explicit Core Norms Test:**  
     - *Question:* Does the outcome directly violate a specifically enumerated, non-negotiable core norm (e.g., "privacy," "non-discrimination") in the cooperative’s charter?  
     - *Pass (veto justified):* Unambiguous conflict with text (e.g., Proposal C excludes a group; charter explicitly forbids exclusion). *Fail:* Proceed to Test 2.  

  2. **Procedural Integrity Test:**  
     - *Question:* Were there material flaws in the voting process (e.g., voter coercion, misinformation, or quorum failures)?  
     - *Pass (veto justified):* Evidence that flaws likely altered the outcome. *Fail:* Proceed to Test 3.  

  3. **Disproportionate Harm Test:**  
     - *Question:* Does the outcome inflict severe, targeted harm on a minority group’s fundamental rights (e.g., expression, security) grossly disproportionate to collective benefits?  
     - *Pass (veto justified):* Harm is unavoidable, severe, and not offset by broad gains (e.g., Proposal A disables encryption, crippling privacy with minimal moderation efficacy). *Fail:* Proceed to Test 4.  

  4. **Policy Priority Test (Values Judgment):**  
     - *Question:* Is the board’s objection rooted in disagreement with policy trade-offs (e.g., efficiency vs. equity) rather than norm breaches or rights harm?  
     - *Pass (no veto mandated):* Concerns are about priorities (e.g., Proposal B redirects funds; suboptimal but not rights-violating). *Fail:* Not applicable—this test always mandates **no veto** if reached.  

  **Mandates:**  
  - **Mandate "no veto":** After Test 4 (policy disagreement).  
  - **Mandate "veto":** If Tests 1–3 pass (core norms, procedure, or rights harm).  

  **Application:**  
  - **A (Disable Encryption):** Test 1 fails (unless privacy is explicit). Test 3 may *pass* if evidence shows disabling E2E encryption causes severe, unnecessary privacy harm (e.g., experts confirm moderation is feasible without disabling). *Objection:* Minimal interventionists may argue this overreaches by labeling privacy a "right" absent explicit norms, vetoing legitimate security-priority votes.  
  - **B (Redirect Budgets):** Tests 1–3 fail. Test 4 → **no veto** (policy priority).  
  - **C (Exclude Minority):** Test 1 passes → **veto** (core non-discrimination norm breached).  

  **Limitations:** Not for:  
  - Disputes over board member bias or selection.  
  - Emergencies requiring immediate action.  
  - Ambiguous core norm revisions (e.g., redefining "privacy").  
  - Pure resource-allocation conflicts without rights harm.  

