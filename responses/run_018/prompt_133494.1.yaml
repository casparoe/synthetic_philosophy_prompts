  First, they're stuck on whether letter categories have an essential core or if they're family-resemblance clusters. The key tension is between Hofstadter's grid-based approach (which they suspect might be artificial) and the need to explain style-invariant recognition. They mention negative space (absence features) versus topological deformation as competing frameworks.

  Hmm... The real challenge seems to be bridging abstract category theory with concrete perceptual mechanisms. The group has philosophers, cognitive scientists, and AI researchers - that's crucial. The philosophers will care about ontological status of categories, cognitive scientists about human perception, AI about implementable models. Need a framework that serves all three.

  The three-year constraint means we must prioritize questions that unlock multiple paths. Can't start with AI implementation details - that's downstream. The style-as-ornament vs style-as-constitutive issue seems foundational. If style is merely decorative, Hofstadter's critics win. But if style structurally transforms the core, that changes everything.

  Topology feels promising here - it's mathematical enough for formalization but captures deformation. More flexible than pure generative grammars. But how to test it? Maybe cross-linguistic alphabet comparisons could reveal topological invariants. Cyrillic 'a' vs Latin 'a' might preserve certain loop/closures despite different strokes.

  Negative space conditions are tempting because tractable for AI (e.g. convolutional nets can detect absence). But is that central to human recognition? Might be a red herring - absence features could emerge from deformation rather than being primitive.

  Prioritization logic: Without settling the ontology/style relationship (Year 1), prototype models vs family resemblance debates are premature. And AI implementations (Year 3) will fail if based on wrong premises. Must sequence:
  1. Conceptual groundwork (what IS style's role?)
  2. Perceptual validation (how do humans actually see deformed 'a's?)
  3. THEN computational modeling

  Would deprioritize pure family-resemblance approaches - too vague for this group's AI component. Also lower priority: exhaustive style-space mappings before understanding deformation principles.

  The knockout test? If topological invariants survive radical style changes in behavioral experiments, that kills skeleton+ornament models. If not... back to prototypes. That's where non-empirical analysis (e.g. comparing alphabets) guides where to spend lab time.
answer: |-
  Here's a prioritized research agenda for your 3-year interdisciplinary group, designed to resolve the core tension between "fixed essence" and "style-as-constitutive" models of letter categorization. The ranking prioritizes *conceptual leverage*—tackling questions that constrain downstream options and maximize empirical/testable insights per unit effort.

  ---

  ### **Core Prioritization & Justification**
  1.  **Year 1: Resolve the Ontology of Style & Category**  
      **Question:** *Is "style" a deformation of a topological invariant, or is the category boundary defined by relational constraints (including negative space) without a persistent core?*  
      **Why First?** This is **upstream** of all other questions. Until you know whether style *modulates* a core or *constitutes* the category, you can't design valid cognitive experiments or formal models. Hofstadter's grid implicitly assumes deformation, but his critics see it as artificial scaffolding.  
      **Method:**  
      - **Non-empirical:** Conceptual analysis of "invariance" across transformations (e.g., analogy to object recognition: is "chair" defined by topological relations or feature lists?).  
      - **Cross-linguistic:** Compare Latin ⟨a⟩, Cyrillic ⟨а⟩, Greek ⟨α⟩, and handwritten variations. Do they share a *topological primitive* (e.g., a single enclosed region + open curve) or only *negative-space relationships* (e.g., "not vertical symmetry," "not a closed bowl")?  
      - **Knockout Test:** If no topological invariant survives radical style changes (e.g., Blackletter vs. Bubble letters), prototypes/essences are untenable. If invariants exist, deformation models gain priority.  
      **Deprioritize:** Family-resemblance approaches (too vague for formalization) and prototype metrics (assume a fixed "central" exemplar, begging the style question).

  2.  **Year 2: Formalize "Negative Space" as a Relational Constraint System**  
      **Question:** *Can constitutive absences (e.g., "no vertical stem" distinguishing ⟨a⟩ from ⟨d⟩) be modeled as interdependent relational rules, independent of specific geometry?*  
      **Why Second?** Even if topology is primary, negative-space constraints are tractable for testing and may explain boundary cases (e.g., ambiguous glyphs). Crucially, they force engagement with *category boundaries*—where "a-ness" breaks down. Formalizing this is **prerequisite** for evaluating deformation models' completeness.  
      **Method:**  
      - **Non-empirical:** Analyze minimal pairs (⟨a⟩/⟨d⟩, ⟨n⟩/⟨h⟩) to isolate necessary absences. Use conceptual tools from mereotopology and feature geometry (phonology analogies).  
      - **Cognitive Plausibility:** Run rapid categorization tasks with glyphs that violate single negative-space constraints (e.g., an "a" with a vertical stem). Measure error rates/speed.  
      - **Tractability Advantage:** Easier to encode as graph-based rules ("IF open-top THEN no-vertical-stem") than deformation fields. Serves as a "lower bound" model.  
      **Deprioritize:** Full generative grammars until relational constraints are mapped (they add unnecessary complexity here).

  3.  **Year 3: Model Style as Topological Deformation (Conditional on Year 1)**  
      **Question:** *If a topological core exists, can style spaces be modeled as parametrized deformations (e.g., metric distortion, hole addition/removal) of this core?*  
      **Why Third?** This is the most ambitious formalization, requiring Year 1's ontology and Year 2's boundary constraints. It directly addresses Hofstadter's "spirit" claim but depends on foundational clarity. Success here would unify invariance and stylistic diversity.  
      **Method:**  
      - **Non-empirical:** Leverage topology (persistent homology) to identify deformation-invariant properties (e.g., genus, connectivity). Compare to categorical shifts in other domains (e.g., biological morphology).  
      - **Computational:** Build a deformation space (e.g., diffeomorphic flows) and test if human style judgments correlate with distance metrics in this space.  
      - **Cognitive Test:** If humans recognize deformed glyphs faster/more accurately than feature-based variants, topology is validated.  
      **Deprioritize:** Continuous "style-space" prototypes (e.g., VAEs) until deformation mechanics are understood—they risk conflating style metrics with category structure.

  ---

  ### **Why This Ranking?**
  - **Conceptual Dependency:** You cannot formalize deformation (Year 3) without knowing *what* is deforming (Year 1). You cannot model category boundaries without negative-space analysis (Year 2).  
  - **Knockout Power:** Year 1’s cross-linguistic/topological analysis could falsify the core premise of deformation models. Year 2’s constraint system provides a fallback ontology if no invariant exists.  
  - **Tractability Balance:** Year 2’s negative-space rules offer "quick wins" for AI implementation (e.g., constraint-satisfaction networks), while Year 3’s topology leverages advanced tools (persistent homology, neural ODEs) once foundations are secure.  
  - **Cognitive Grounding:** Behavioral tests in Years 2–3 directly probe human categorization—addressing the "psychologically unrealistic" critique of Letter Spirit.  

  ### **High-Risk, High-Reward Pivot**
  If Year 1 falsifies topological invariance, **refocus Year 3 on dynamic constraint systems** (e.g., free-energy principles) where style modulates relational rule weights. This preserves the "no fixed skeleton" insight while abandoning deformation.

  ---

  ### **Non-Empirical Decisive Factors**
  1. **Cross-Linguistic Glyph Analysis:** If radically different alphabets share topological invariants (e.g., ⟨a⟩’s "open containment"), deformation gains plausibility. If not, family-resemblance/constraints dominate.  
  2. **Analogy to Categorization:** Perceptual categories like "face" or "chair" rely on topological invariants (e.g., hole arrangements). If letters align with this, Hofstadter’s insight is profound. If not, letters may be more arbitrary.  
  3. **Mereotopological Necessity:** Can a glyph lack all proposed "positive" features (curves, stems) yet remain an "a" *if* negative-space constraints hold? If yes, constraints are irreducible.  

  This agenda maximizes conceptual clarity early, delivers testable models mid-project, and reserves resource-intensive formalization for validated pathways. The goal: resolve whether "spirit" is in the *warping of essence* or the *balance of absences*.
