answer: |-
  ### 1. Translation into Decision-Theoretic Terms (300 words)  
  Pragmatic encroachment (PE) contends that whether an agent "knows" a proposition *p* (e.g., "The bank is open Saturday") depends on practical stakes: high-stakes contexts demand stronger evidence for the same *p*. In statistical terms, this maps cleanly to **adjusting the decision threshold** for accepting *p* (H₁) over ¬*p* (H₀) based on asymmetric error costs.  

  - **Low-stakes case (bank-check, small amount)**:  
    Accepting H₁ (bank open) when false (H₀ true) has low cost (e.g., minor inconvenience). Here, PE permits a higher tolerance for false negatives (FN) — failing to act on a true H₁ — so a **lenient threshold** (e.g., α = 0.1) suffices. Action follows if evidence surpasses this low bar.  

  - **High-stakes case (train-tracks, lethal risk)**:  
    Accepting H₁ (track is safe) when false (H₀ true) has catastrophic cost. PE demands a **stricter threshold** (e.g., α = 0.001) to minimize false positives (FP). This forces the agent to seek near-certain evidence before acting as if H₁ holds.  

  The core PE intuition reduces to **loss-function engineering**: stakes determine the relative cost *C(FP)* vs. *C(FN)*. "Knowing" *p* corresponds to acting when evidence clears the *stakes-sensitive threshold*, optimized via Neyman-Pearson or Bayes risk minimization. The evidential "strength" required (e.g., p-value) is thus a function of the cost matrix — not a fixed epistemic standard.  

  ### 2. Residue Report: Mappings, Distortions, Gaps (250 words)  
  **Clean mappings**:  
  - Stakes → Loss function asymmetry (*C(FP)* vs. *C(FN)*)  
  - "Strength of evidence" → Test statistic (e.g., t-score) relative to a threshold  
  - Practical "actionability" of "knowledge" → Rejection of H₀ under a decision rule  

  **Distortions (requiring an 'assertion norm' parameter)**:  
  PE often conflates *acting* on *p* with *asserting* "I know *p*." Decision theory handles action via thresholds, but **assertion** demands an extra layer: a social/epistemic norm demanding higher confidence for claims than actions. For example, asserting "I know the track is safe" might require α = 10⁻⁶ even if acting (crossing) requires only α = 0.01. This norm has no native decision-theoretic counterpart — it's a linguistic bolt-on.  

  **Missing pieces**:  
  1. **Categorical "knowledge"**: Decision theory outputs probabilistic beliefs/actions; it lacks a binary "knowledge" state. PE's insistence on a threshold *defining knowledge* is exogenous.  
  2. **Internalist justification**: PE often references the agent’s *reasons* for belief. Decision theory cares only about outcomes (error rates), not doxastic grounds (e.g., whether evidence was "properly" weighted).  
  3. **Invariant evidence**: PE assumes evidence is fixed while thresholds shift. Decision theory allows evidence quality to interact with thresholds (e.g., power analysis), which PE neglects.  

  ### 3. Verdict with Base-Rate Twist: Collapse into Decision Theory (200 words)  
  **Thesis**: With pre-evidential threshold-setting under base-rate uncertainty, pragmatic encroachment **collapses entirely into statistical decision theory**. PE adds no distinctive epistemic content.  

  **Argument**:  
  - An agent must fix α *before* seeing data or base rates (e.g., prevalence of faulty tracks). High stakes compel choosing a stricter α to bound worst-case FP risk (minimax), or a Bayes-optimal α using a prior over base rates. This is pure decision-theoretic caution — optimizing expected loss under model uncertainty.  
  - PE’s claim that "knowledge standards" shift with stakes reduces to setting α to minimize *C(FP)⋅P(H₀) + C(FN)⋅P(H₁)*, where *P(H₀)* is unknown. The agent’s choice of α reflects risk aversion, not a redefinition of "knowledge."  
  - **Why no residue?** The base-rate twist forces explicit quantification of uncertainty. Any "epistemic" distinction (e.g., "warrant") dissolves into the math of expected utility. Asserting "I know" is just reporting that evidence cleared the pre-set α — a decision-theoretic output, not an epistemic primitive.  

  **Conclusion**: Pragmatic encroachment is statistical decision theory misdescribed. The vocabulary of loss functions, thresholds, and error tradeoffs exhausts PE’s conceptual payload. Philosophers inflate this into "epistemic standards," but it’s merely agents tuning α to avoid costly bets under uncertainty. The base-rate twist proves this: all PE "effects" emerge from optimizing α *before* data, leaving no room for a sui generis epistemic layer.
