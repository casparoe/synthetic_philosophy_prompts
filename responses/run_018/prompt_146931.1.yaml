      Q2 -->|No| E(Leaf E: Complicity)
      Q3[Q3: Is your vote decisive?] -->|Yes| C(Leaf C: Threshold)
      Q3 -->|No| B(Leaf B: Statistical harm)
      Q2_NoHarm -->|Q2: No| D(Leaf D: Expressive wrong)
      Q2_NoHarm -->|Q2: Yes| F(Leaf F: Distributed agency)
      Q2_DK -->|Q2: No| Incoherent
      Q2_DK -->|Q2: Yes| Ambiguous
  ```
