prompt: |-
  After a long and somewhat heated argument with a friend about whether any famine can truly be called a natural disaster, I want to work through a specific episode using Amartya Sen’s entitlement framework rather than just rehearsing his classic cases. Take the 2011 famine in southern Somalia: a prolonged drought sharply reduced local crop yields and pastoral output, yet regional markets still held food and international warehouses were stocked; Al-Shabaab controlled key distribution corridors, blocked humanitarian agencies from delivering supplies, taxed or seized remaining livestock, and disrupted the labor markets through which displaced families had previously earned income to buy grain, while pastoralists saw the exchange value of their animals collapse. Analyze this through Sen’s distinction between direct entitlement failure, in which people lose command over food because their own production collapses, and trade-based entitlement failure, in which they retain nothing to exchange for food that still exists in the market. But do not stop at application. The case seems to involve available food with deliberately obstructed access, engineered not by a state procuring grain away from its citizens, as in Bengal or the Great Leap Forward, but by a non-state armed group fragmenting sovereignty over distribution and exchange. Ask whether this reveals a limit in Sen’s implicit model, which tends to treat entitlement protection as a function of state capacity and state failure, and whether we need an extension—perhaps a sovereignty-fractured mode of entitlement collapse—to account for situations where no single authority holds the power to protect or destroy entitlements uniformly. Does the drought remain the right explanatory frame, or does the presence of food with blocked access show that the famine was, in Sen’s own terms, a purely political crime? More precisely, map the actors—pastoralists, wage laborers, aid agencies, the armed group—to Sen’s categories of entitlement relations, say where the theory is silent rather than forcing it to speak, and tell me whether this episode confirms Sen’s core thesis that famines are about distribution and command rather than aggregate availability, or whether it pushes that thesis to become something broader. Write in continuous prose only, with no headings, bullet points, bold text, or tables, as if composing a letter or email, and please use American English throughout.
