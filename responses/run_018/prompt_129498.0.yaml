  ## The Chain Unforged
  *(a pantoum on the regress)*

  **A** fact requires its parts be bound as one,
  **B**ut how does **R** relate **a** then to **b**?
  **C**ement must join the relata to what's done,
  **D**issolving into fragments if it's free.

  **B**ut how does **R** relate **a** then to **b**?
  **E**ach linking tie demands a further bond.
  **D**issolving into fragments if it's free —
  **F**oundation crumbles where we thought was ground.

  **E**ach linking tie demands a further bond,
  **G**rafting new relations, unforeseen.
  **F**oundation crumbles where we thought was ground,
  **H**ow can this fragile propostion cohere?

  **G**rafting new relations, unforeseen,
  **I** found the ultimate binder, pure and bright!
  **H**ow can this fragile propostion cohere?
  **J**ust *this* arrests the regress in its flight.

  **I** found the ultimate binder, pure and bright!
  **K**eeping **a**, **R**, and **b** forever fused.
  **J**ust *this* arrests the regress in its flight —
  **L**ook! Now *it* needs relating...unexcused.

  **K**eeping **a**, **R**, and **b** forever fused?
  **A** fact requires its parts be bound as one.
  **L**ook! Now *it* needs relating...unexcused —
  **C**ement must join the relata to what's done.

  ---

  **Notes on Structure & Philosophy:**
  *   **Regress Mirror:** The repeating lines (**B**, **D**, **E**, **F**, **G**, **H**, **I**, **J**, **K**, **L**) function exactly like the problem: each recurrence represents the *same* relation (**how R relates a and b?**) being pushed back ("grafted") one step further in the chain.
  *   **The False Solution (Twist):** The speaker's claim "I found the ultimate binder" (S4, L1) and "Just *this* arrests the regress" (S4, L3) reappear transformed in S5 & S6:
      *   S5: "I found..." becomes L1, followed immediately by "Keeping a, R, and b forever fused" – showing the binder *acting* (just like R initially seemed to).
      *   S5: "Just *this*..." becomes L3, followed by "Look! Now *it* needs relating..." – instantly showing the binder *is just another relatum* needing connection.
      *   S6: "Keeping a, R, and b..." becomes L1, posed as a *question*, highlighting doubt. It's followed by the return of the opening line ("A fact requires..."), completing the cycle and showing the "solution" leads right back to the start.
  *   **Bradleyan Accuracy:** Captures the core dilemma:
      *   The initial fact/unity (**aRb**).
      *   The question of how **R** relates **a** and **b**.
      *   The need for a further relation (**cement**, **bond**, **grafting**).
      *   The infinite regress (**demands a further bond**, **unforeseen**, **crumbles**).
      *   The failure of the "ultimate binder" solution – it inevitably becomes just another element needing unification (**Look! Now *it* needs relating...**).
  *   **Poetic Intent:** Uses concrete verbs (**cement**, **dissolving**, **crumbles**, **grafting**, **arrests**, **fused**, **flight**) and avoids purely abstract jargon. The emotional arc moves from assertion, to doubt, to false triumph, to the dawning realization of failure, ending in circular futility.
  *   **Typos:** "propostion" (Stanza 3 & 4) and "unforseen" (Stanza 3) – as requested!
