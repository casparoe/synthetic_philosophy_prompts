  Ultimately, the disagreement seems rooted in divergent philosophical values—meaning as settled practice versus truth as determinate. Without a shift in these values, the stalemate persists. The user might benefit from framing the debate as a metalinguistic negotiation, which acknowledges both positions as viable but incompatible conceptual choices. This perspective could help the reading group move beyond seeking a winner and instead explore the implications of each view.
answer: |-
  Your diagnosis is remarkably astute and points to the heart of this enduring debate. The disagreement is **fundamentally philosophical and foundational**, concerning the *goals and subject matter* of semantics itself, rather than a disagreement resolvable by empirical linguistics or formal logic alone. Here's a breakdown:

  1.  **A Clash of Philosophical Commitments / "What Semantics is For":**
      *   **Supervaluationism:** Prioritizes **semantic competence and settled meaning**. Its core question is: *What has our linguistic practice actually fixed?* It aims to model the *discernible commitments* of competent speakers – the clear cases, the tolerance principle, and the *lack* of a settled boundary. Truth is tied to what is *settled* by use. The "gappiness" (neither true nor false) reflects genuine *indeterminacy in the world as described by our language* – the open texture left by our practice. Semantics explains why competent speakers are hesitant or disagree in borderline cases.
      *   **Epistemicism:** Prioritizes **metaphysical determinacy and bivalence**. Its core question is: *What is the actual truth, irrespective of our epistemic access?* It insists that reality itself (including the application of vague predicates to precise states of affairs) is sharp. The ignorance is purely *epistemic* – a limitation of our cognitive or perceptual apparatus in discerning the precise boundaries fixed by the totality of usage, context, and the world. Semantics must account for *determinate truth conditions*, even if we can't know them fully. Bivalence is a non-negotiable feature of reality/truth.

  2.  **Not Primarily:**
      *   **A Hidden Empirical Question:** Both sides agree on the linguistic data (Sorites intuitions, competent speaker behavior in clear/borderline cases, the need for classical logic). Neither disputes how people *use* "bald." The disagreement is about *how to interpret and explain* that data within a semantic theory.
      *   **A Formal Difference:** While the formal implementations differ (supervaluational models vs. classical models with unknowable boundaries), the formalism *follows from* the prior philosophical commitment. Choosing one formalism over the other is a *consequence* of the foundational stance, not the cause.
      *   **Purely Verbal:** While terms like "true," "determinate," and "boundary" might be used with slightly different emphases, the core disagreement runs deeper than mere terminology. It's about the *nature of meaning and truth* in the context of vagueness. Both sides understand the other's definitions but reject the underlying philosophy.

  3.  **A Metalinguistic Negotiation / Clash of Intuitions:**
      This disagreement shares features with what David Chalmers and others call a **"metalinguistic negotiation."** It's a debate about *which concepts we should employ* – specifically, the concepts of *truth*, *meaning*, and *determinacy* – when theorizing about vague language. Each side champions a package of concepts they believe provides the best explanation:
      *   Supervaluationists value explanatory power for speaker behavior and the phenomenology of vagueness (indecision, openness).
      *   Epistemicists value metaphysical determinacy, bivalence, and preserving a direct link between word and world without semantic gaps.

  **The Stalemate: Prospects for Movement**

  Your pessimism about resolution is well-founded, but not absolute. The stalemate is *highly resilient* because it stems from deep-seated philosophical preferences. However, potential pressure points exist:

  1.  **Internal Coherence Problems:**
      *   **For Supervaluationism:** The challenge of **higher-order vagueness** is significant. If "determinately true" is itself vague (where does the boundary between determinately true and borderline lie?), the supervaluationist needs a non-arbitrary way to handle this within their framework, potentially leading to an infinite regress or an unsatisfying stipulation. This remains a major theoretical burden. A truly compelling solution *could* sway epistemicists or force supervaluationists to revise core tenets.
      *   **For Epistemicism:** Explaining the *nature* and *source* of our **inescapable ignorance** is its Achilles' heel. *Why* is the boundary fundamentally unknowable? Appeals to "fine-grained differences" often feel insufficient. Williamson's "margin for error" principles are an attempt, but critics argue they are ad hoc or fail to capture the depth of the ignorance required. A demonstration that the required ignorance is impossible or incoherent *could* be damaging.

  2.  **Explanatory Power vs. Cost:**
      *   Can supervaluationism explain the *phenomenology* of vagueness (the feeling that there *is* no fact of the matter) without positing genuine indeterminacy? Epistemicists say yes (it's just ignorance), but supervaluationists find this less plausible.
      *   Is epistemicism's commitment to unknowable sharp boundaries an acceptable price for preserving bivalence and determinacy? Supervaluationists say no; it's an unmotivated posit violating semantic naturalism (meaning supervenes on use). Epistemicists argue it's necessary for classical semantics and realism.

  3.  **The "No Evidence" Problem (Schiffer):** This argument bites hardest against epistemicism. If the boundary exists but is unknowable, why is there *no possible evidence whatsoever* that could even *suggest* where it might be? The absence of *any* trace of the boundary in our linguistic practice or intuitions seems mysterious if it exists. Epistemicists need a convincing story about why evidence is impossible, not just difficult. Failure here makes their view seem less explanatory.

  4.  **Integration with Broader Theories:** How well does each theory integrate with plausible accounts of meaning acquisition, communication, and the metaphysics of properties? If one theory offers a significantly more seamless fit with an independently attractive broader philosophy of language or mind, that *could* be persuasive, though likely not decisive.

  **Conclusion: A Permanent Stalemate? Likely, but...**

  *   **Yes, largely permanent:** The core disagreement rests on different fundamental intuitions about what semantics *should do* – model settled meaning or capture determinate truth. These goals pull in different directions for vague predicates. Since both sides accept the core data (Sorites, classical logic, non-defectiveness) and have sophisticated responses to standard objections, linguistic evidence or formal results within their chosen frameworks won't dislodge them.
  *   **Potential for Movement:** Genuine pressure could come from:
      *   A devastating internal problem (e.g., an irresolvable higher-order vagueness regress for supervaluationism, or an incoherent account of ignorance for epistemicism).
      *   A powerful argument showing one theory fails on its *own* terms (e.g., the "No Evidence" problem severely undermining epistemicism's claim to explain linguistic practice).
      *   The success of an entirely different approach (e.g., a non-classical logic like fuzzy logic or a contextualist account) that handles the data better *and* addresses the core motivations of both sides – though this seems challenging given the shared commitment to classical logic in your group.
      *   A shift in philosophical priorities (e.g., a greater acceptance of semantic indeterminacy in other areas, making supervaluationism seem less radical; or a stronger push for metaphysical realism, favoring epistemicism).

  **Recommendation for Your Group:** Instead of rehashing the standard arguments, focus the discussion *explicitly* on the foundational question: "What should a semantic theory of vague predicates primarily account for: the settled commitments of linguistic practice (even if that leaves truth gaps), or the existence of determinate truth conditions (even if they are unknowable)?" Frame it as a choice between explanatory priorities. Acknowledge that each theory succeeds brilliantly by its own lights but fails by the other's. This meta-discussion might not resolve the stalemate, but it could lead to a more fruitful understanding of its nature, moving beyond ritualized arguments into a clearer articulation of the underlying philosophical divide.
