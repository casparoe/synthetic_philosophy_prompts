  Next, the user wants to know the nature of this disagreement. Is it empirical, verbal, or intuitive? I recall that Sider (2001) and Chalmers (2011) have explored metalinguistic negotiation, where disputes are about which concepts to use. That fits here. Both sides accept the same linguistic data but diverge on deeper philosophical commitments. So the disagreement might be foundational rather than empirical.

