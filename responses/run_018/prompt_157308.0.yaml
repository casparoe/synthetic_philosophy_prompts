answer: |-
  Your cases reveal a tension in semantic externalism between **causal-historical grounding** (initial baptism + world-involvement) and **communal practice** (ongoing use + expertise). The neuro-signal and synthetic emerald conflict arises because the former involves **reference redirection after discovery**, while the latter tests **whether social conventions can override established natural kinds**. Here's how to resolve it:

  ### Key Conflict: Neuro-Signal vs. Synthetic Emerald
  1. **Neuro-Signal**:  
     - **Initial baptism**: Coined for a presumed natural kind (brainwave).  
     - **Discovery**: The phenomenon is artifactual (scanner glitch).  
     - **Outcome**: Community continues using "neuro-signal" for the artifact.  
     - **Your verdict**: Social practice fixes reference to the artifact.  
     - **Why it holds**: The term never successfully latched onto a natural kind. External factors (the artifact) *and* communal practice realigned reference. *This fits Putnam’s "no miracles" principle*: continuing to use the term for a non-natural artifact reflects linguistic practice overriding initial intent.  

  2. **Synthetic Emerald**:  
     - **Initial baptism**: "Emerald" historically refers to beryl (Be₃Al₂Si₆O₁₈), a natural mineral.  
     - **Discovery**: Lab-grown gems are chemically identical.  
     - **Twin-Earth practice**: Community *restricts* "emerald" to mined stones, calling lab-grown "fakes."  
     - **Your verdict**: Hidden structure (chemistry) should dominate, making lab-grown gems emeralds.  
     - **Tension**: If social practice can override chemistry, Twin-Earth’s "emerald" should exclude lab-grown stones.  

  ### The Argument That Would Change My Mind  
  **If you could show that synthetic emeralds are *ontologically distinct* from natural emeralds due to origin (e.g., "mined" is part of the hidden structure), I’d abandon the structure reading for emeralds.**  
  - **Current stance**: Origin isn’t hidden structure; it’s a social category. Chemistry is the invariant.  
  - **What would shift it**: Prove that "emerald" includes *historical/contextual properties* (e.g., formed geologically) as essential. If gemology defines natural kinds *by origin*, Twin-Earth’s practice would fix reference.  
  - **Why this fails**: Lab-grown emeralds share all *causal powers* of natural ones (hardness, refractive index). Social practices about "authenticity" don’t alter the kind; they create a *subcategory*.  

  ### Unified Principle: **Dominant External Anchor (DEA)**  
  > **A term’s reference is fixed by the most causally dominant external factor in its grounding history.**  
  > - **Natural kinds** (water, emerald): Hidden structure dominates *if* a robust natural kind exists.  
  > - **Artifact/descriptive terms** (neuro-signal, arthritis): Social practice dominates when no stable natural kind anchors the term.  
  > - **Normative terms** (justice): Social practice dominates, but incoherent concepts face *external corrective pressure* (e.g., human flourishing constraints).  

  ### Resolving Your Cases  
  - **Water/emerald**: DEA = hidden structure (H₂O/beryl). Twin-Earth jewellers misclassify synthetic emeralds as "non-emeralds," but the *extension* still includes any beryl. Their practice is a *normative error*.  
  - **Arthritis/neuro-signal**: DEA = social practice. "Arthritis" is defined by medical expertise; "neuro-signal" never anchored a natural kind.  
  - **Justice**: DEA = social practice, but incoherent concepts (e.g., "justice = torture") risk collapse under external reality.  

  ### Sacrificed Verdict  
  Your neuro-signal social-practice reading **holds**. The synthetic emerald structure reading **also holds**—but you must accept that Twin-Earth speakers are *wrong* about lab-grown stones not being emeralds. Their practice restricts the term’s *application*, not its *reference*.  

  **VERDICT**: A unified principle (**Dominant External Anchor**) exists. It sacrifices *neither* your neuro-signal nor emerald verdict but requires conceding that Twin-Earth’s emerald *usage* is mistaken about the term’s true extension. The domain split (natural kinds vs. artifacts) is inherent to externalism and doesn’t need abandoning.
