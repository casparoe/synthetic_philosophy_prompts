prompt: |-
  I run a small policy experimentation unit inside the government of a mid-sized city — about 400,000 residents. My office fields roughly a dozen proposals a year from departments and council members who want to "pilot" something: a new transit fare structure, a participatory budgeting expansion, a congestion charge, a redesigned permitting process. My job is to decide which proposals get piloted, how the pilots are run, and what happens afterwards. The stakes are real but not life-and-death; each pilot costs between tens of thousands and a few million dollars, and any decision to scale a pilot citywide ultimately rests with the elected council, not with me.

  I have been trying to run this office on Deweyan lines — Dewey's experimentalism about inquiry and democracy, the view associated with works like his Logic: The Theory of Inquiry and The Public and Its Problems. I want the translation done properly. Write me a decision procedure I can actually apply to each proposal that lands on my desk: the questions to ask in order, what counts as an adequate answer to each, where the procedure terminates in a clear no, and where it must hand the question over to elected officials or to the affected residents because the matter is one of ends rather than means.

  The procedure has to preserve the parts of Dewey's view that are easiest to lose in practice, so please build in explicit tests for the following:

  - Whether the proposal begins from a genuinely problematic situation — a concrete difficulty experienced by identifiable people — or from a solution in search of a problem, which on Dewey's picture is not inquiry at all.
  - Whether the pilot is designed as a test of a hypothesis, where certain outcomes would count as evidence against the policy and force revision or abandonment, or whether it is pilot-theater: a trial whose design guarantees "success" and functions as marketing for a decision already made. Give me diagnostic questions that distinguish the two, since sponsors rarely admit to the second.
  - How to handle Dewey's claim about ends-in-view: the idea that goals stated in advance of inquiry are provisional and should be revised in light of what the means and consequences turn out to be. Concretely, I need to know what the procedure does when a pilot "fails" against its stated objectives but produces valuable unanticipated consequences, and when it "succeeds" against its stated objectives while generating harms nobody thought to measure.
  - Dewey's account of the public: those indirectly affected by transactions who must organize to have a say over them. My pilots often affect people who are not at the table — shift workers, undocumented residents, commuters from outside the city. Tell me how the procedure should identify the affected public for a given proposal, and at what point a pilot's design is invalid because the people bearing its consequences have no channel into it.
  - Where the procedure has to stop deferring to experimentation altogether. Some proposals are not revisable (a demolition, an irreversible infrastructure commitment), and some questions — how much inequality to tolerate, which neighborhoods matter — are not the kind that evidence settles. Mark these handoff points explicitly.

  Then run the finished procedure on two proposals, showing its work at each step: (1) a six-month congestion pricing pilot in the downtown core, with revenues earmarked for bus service, proposed by a council member who is clearly already committed to a permanent scheme; and (2) a proposal to replace the city's public comment process at council meetings with a standing citizens' assembly of forty randomly selected residents. At least one of these should come out with an answer I will not enjoy defending.

  Close with a candid account of what the procedure cannot do: where Dewey's theory itself gives out or becomes unhelpfully vague when pressed into administrative form, and which steps in my procedure are judgment calls wearing procedural clothing.
reasoning: |-
  Okay, let me start by understanding the user's situation. They run a policy experimentation unit in a mid-sized city government, handling about a dozen proposals a year for pilots. Their goal is to apply Dewey's experimentalism to evaluate these proposals. The user wants a structured decision procedure that incorporates key Deweyan principles: starting from genuine problems, testing hypotheses, revising ends-in-view, involving the affected public, and knowing when to hand off decisions.

  First, I need to recall Dewey's core ideas. His logic of inquiry insists that inquiry begins with an indeterminate situation—a real problem people face. Proposals that start with solutions looking for problems aren't genuine inquiry. Also, pilots must be actual tests where failure is possible, not just theater to validate pre-decided outcomes. Ends-in-view should evolve based on evidence from the pilot. The affected public must be identified and involved, especially those indirectly impacted. Some issues, like value judgments, should be handed to elected officials.

  The user mentioned specific pitfalls: ensuring the problem is genuine, avoiding pilot-theater, handling unexpected outcomes, involving the right public, and recognizing when experimentation isn't suitable. They also provided two examples: congestion pricing and citizens' assembly. The congestion pricing pilot is proposed by a council member who's already committed, which risks pilot-theater. The citizens' assembly replaces public comment, possibly excluding marginalized voices. One of these should yield an unpopular result to test the procedure.

  Breaking down the decision procedure into phases makes sense: Problem Definition, Inquiry Design, Public Formation, and Handoff Conditions. Each phase needs specific questions with clear pass/fail criteria. For example, in Problem Definition, asking for concrete evidence of the problem and who's affected. If the problem isn't substantiated, it's a clear no. 

  For the congestion pricing pilot, the council member's commitment raises red flags. The procedure should flag this as potential pilot-theater. Diagnostic questions could include whether the pilot allows for failure and if metrics include unintended consequences. If the design precludes failure, it should be rejected or redesigned.

  The citizens' assembly proposal might exclude shift workers or non-citizens. Identifying the affected public here includes commuters, undocumented residents, etc. If they can't be adequately involved, the proposal might need redesign or handoff to elected officials.

  Ends-in-view revision is crucial. The procedure should require monitoring both intended and unintended outcomes. If a pilot fails its goals but shows other benefits, it should prompt reevaluation, not automatic rejection. Similarly, success with unmeasured harms should lead to revision.

  Handoff points are when decisions are irreversible or involve value judgments. For instance, demolishing a building isn't revisable, so it shouldn't be piloted. Questions about inequality tolerance should go to elected officials.

  Applying this to the examples: The congestion pricing pilot might fail the inquiry design phase if it's set up to guarantee success. The citizens' assembly might have public formation issues if marginalized groups can't participate. The user needs to defend rejecting or redesigning these, which could be politically challenging.

  Finally, acknowledging the limitations. Dewey's theory might be vague on operationalizing public identification or balancing efficiency with inclusion. Some steps require judgment, like determining adequate problem evidence or which publics are affected. The procedure can't replace democratic deliberation but structures inquiry within its limits.
answer: |-
  Here is a Deweyan decision procedure for policy pilots, designed for administrative rigor while preserving core experimentalist principles. It proceeds through sequential phases, with clear termination points and handoff triggers.

  **Deweyan Policy Pilot Decision Procedure**

  **Phase 1: Problem Definition & Indeterminacy Check**
  1.  **Question:** *What specific, concrete difficulty or disruption in coordinated activity (transaction) is this proposal responding to? Describe the situation experienced by identifiable individuals or groups, including how it impedes their functioning or creates unresolved conflict.*
      *   **Adequate Answer:** Must cite verifiable evidence (e.g., resident surveys, service data, ethnographic reports, documented complaints) showing a felt tension, blockage, or conflict affecting a specific population. Vague appeals to "efficiency," "innovation," or "best practices" are inadequate.
      *   **Termination (No):** If no concrete, evidence-based problem affecting identifiable people is articulated. (Solution in search of a problem).
  2.  **Question:** *How is the current situation "indeterminate"? Why are existing institutional habits or policies failing to resolve this difficulty satisfactorily?*
      *   **Adequate Answer:** Demonstrates a breakdown in habitual responses or conflicting demands within the situation that prevent a clear resolution. Explains *why* the status quo is problematic and unstable.
      *   **Termination (No):** If the problem is framed solely as a lack of a specific solution ("We don't have congestion pricing yet") without diagnosing the indeterminacy of the present state.

  **Phase 2: Inquiry Design & Hypothesis Testing**
  3.  **Question:** *What is the specific, falsifiable hypothesis this pilot aims to test? (State it as: "If we implement [Policy X] under [Conditions Y], we expect [Outcome Z] to occur, because [Mechanism M], compared to [Baseline/Situation].")*
      *   **Adequate Answer:** Clear statement of intervention, predicted outcome(s), causal mechanism, and comparison point. Outcome must be measurable.
  4.  **Question:** *What specific evidence, if observed during/after the pilot, would falsify the core hypothesis and lead you to conclude the policy, as piloted, is ineffective or harmful?*
      *   **Adequate Answer:** Must specify concrete, measurable thresholds for *failure* (e.g., "If traffic volume decreases by <5%," "If complaints from small businesses increase by >20%," "If participation rates in the target demographic fall below X%"). Avoids vague terms like "worsens" without metrics.
      *   **Termination (No):** If sponsors cannot articulate falsifiable conditions or define failure metrics. (Strong indicator of pilot-theater).
  5.  **Question:** *Beyond the primary hypothesis, what are the key *uncertainties* or potential *unintended consequences* (positive or negative) this pilot is designed to reveal? How will they be measured?*
      *   **Adequate Answer:** Identifies plausible side effects (e.g., equity impacts, displacement effects, administrative burdens, unexpected user behaviors) and commits to specific methods for detecting them (mixed methods strongly preferred: quantitative metrics + qualitative feedback).
      *   **Termination (No or Redesign):** If the design focuses *only* on confirming success and ignores potential for negative externalities or novel benefits. Requires redesign to include these measurement plans.

  **Phase 3: Public Formation & Consequence Mapping**
  6.  **Question:** *Map the "Public": Who is directly and *indirectly* affected ("sustains serious consequences") by both the problem and the proposed pilot solution? Specifically identify groups likely excluded from formal proposal channels (e.g., shift workers, undocumented residents, commuters, adjacent neighborhoods, specific business types, vulnerable populations).*
      *   **Adequate Answer:** Comprehensive list beyond obvious stakeholders, based on analysis of transactions/consequences. Must include groups facing barriers to participation.
  7.  **Question:** *How will the perspectives, experiences, and interests of *all* identified affected publics be actively sought, incorporated, and responded to during the: a) Pilot design? b) Pilot execution? c) Evaluation of results? Describe specific, accessible channels.*
      *   **Adequate Answer:** Concrete plans beyond passive notice (e.g., targeted outreach, translation, varied meeting times/locations, partnerships with community orgs, participatory data collection, transparent feedback loops). Must address barriers for excluded groups.
      *   **Termination/Handoff (No or Major Redesign):** If key affected publics lack meaningful, accessible channels for input into the pilot process itself. (Invalidates the inquiry as non-democratic). Handoff to elected officials may be needed if inclusion is deemed politically impossible or fundamentally conflicts with pilot aims.

  **Phase 4: Ends-in-View & Handoff Conditions**
  8.  **Question:** *Are the stated goals ("ends-in-view") of this pilot explicitly framed as provisional and revisable based on the evidence of means, consequences, and public response gathered?*
      *   **Adequate Answer:** Sponsors must explicitly acknowledge that the pilot's stated objectives are starting points for inquiry, not fixed ends, and commit to revising goals based on evidence of consequences (intended and unintended).
  9.  **Handoff Trigger (To Elected Officials):** *Irreversibility/Non-Revisability:* Does the pilot involve actions that are effectively irreversible (e.g., major demolition, selling public land, creating long-term contractual obligations) or commit significant resources that preclude other major options? If Yes → **Handoff:** This is a matter for direct political decision, not experimentation.
  10. **Handoff Trigger (To Elected Officials/Public Deliberation):** *Fundamental Value Conflict:* Does the core tension underlying the problem involve an unresolvable conflict over fundamental ends (e.g., "How much inequality is tolerable?", "Which historic preservation vs. development priority wins?", "Who bears the primary burden of cost?") that empirical evidence alone cannot settle? If Yes → **Handoff:** Requires democratic deliberation and political judgment, not primarily technical piloting.

  **Post-Pilot Evaluation (Built into Phase 2 & 4)**
  *   **On "Failure" w/ Positive Consequences:** If primary objectives aren't met but significant *unanticipated benefits* emerge: Procedure triggers revisiting the "ends-in-view" (Phase 4, Q8). Was the problem mis-specified? Do the new benefits redefine success? Requires re-engagement with the affected public and sponsors to redefine the problem/solution based on new evidence.
  *   **On "Success" w/ Unmeasured Harms:** If primary objectives are met but unanticipated harms occur (discovered via Phase 2, Q5): Procedure forces confrontation with the harms. Success is *not* validated. Requires analysis: Can harms be mitigated while retaining benefits? Do harms outweigh benefits? Mandates revision or abandonment based on holistic consequences.

  ---

  **Application to Proposals:**

  **Proposal 1: Six-Month Congestion Pricing Pilot (Downtown Core)**

  1.  **Problem Definition:**
      *   *Q1:* Likely cites traffic congestion, air pollution, bus underfunding. Adequate if backed by traffic flow data, pollution readings, bus ridership/cost data. *Pass.*
      *   *Q2:* Indeterminacy: Habitual reliance on cars clashes with goals of clean air, efficient transit, vibrant downtown. Current solutions (traffic lights, limited bus lanes) insufficient. *Pass.*
  2.  **Inquiry Design:**
      *   *Q3:* Hypothesis: "If we charge private vehicles $X to enter downtown core 7am-7pm on weekdays, traffic volume will decrease by Y%, bus speeds will increase by Z%, and revenue will fund 10% more bus service, leading to increased ridership, because cost disincentive reduces demand and improves bus efficiency/attractiveness." *Pass.*
      *   *Q4:* Falsification: "If traffic decreases by <5%, OR if bus speeds increase by <3%, OR if downtown retail footfall decreases by >10%, OR if revenue falls below $Z after costs, we must revise or abandon." **Diagnostic:** Ask sponsors: "What result would make *you* personally conclude it failed?" If they dodge or can't answer, red flag. Council member's pre-commitment makes this critical. *Risk: Pilot-Theater.* **Conditional Pass:** Only if sponsors explicitly accept AND record these falsification criteria.
      *   *Q5:* Uncertainties: Impact on low-income drivers, small business deliveries, traffic displacement to adjacent areas, equity of bus improvements. Measurement: License plate analysis for origin/destination, targeted biz surveys, air quality monitors on perimeter roads, income analysis of payers vs. bus users. *Pass* (if included).
  3.  **Public Formation:**
      *   *Q6:* Affected Public: Downtown workers, residents, drivers (inc. low-income), delivery services, taxi/ride-share, small businesses, bus riders, adjacent neighborhood residents (traffic displacement), commuters from outside city, environmental groups.
      *   *Q7:* Channels: Multiple public meetings (various times), online portal, targeted outreach to biz associations, community groups in adjacent areas, surveys at transit hubs, dedicated email/phone line. **Critical Gap:** Commuters from outside city lack vote/formal voice. Requires specific channel (e.g., regional partnership, dedicated feedback for non-resident license holders). *Conditional Pass:* Only if non-resident feedback channel is robustly implemented.
  4.  **Ends-in-View & Handoff:**
      *   *Q8:* Are goals provisional? Council member's pre-commitment suggests No. **Diagnostic:** Ask: "If the pilot meets the falsification criteria (Q4), will you publicly advocate for abandoning the policy?" If answer isn't an unequivocal "Yes," **Termination/Handoff: No - Pilot-Theater.** Handoff to Council with recommendation against pilot as inquiry.
      *   *Q9:* Irreversible? No (temporary charges, reversible tech). *Pass.*
      *   *Q10:* Value Conflict? Yes - Balancing convenience/drivers vs. environment/transit/bus riders, burden on low-income drivers vs. collective benefit. **Handoff Trigger:** Elected Council must ultimately decide this balance. Pilot informs but doesn't decide. *Pass to Pilot, but Handoff for Scaling Decision.*

  **Verdict:** **Conditional Approval.** Requires: 1) Binding acceptance of falsification criteria by sponsor (Q4), 2) Robust feedback mechanism for non-resident commuters (Q7), 3) Explicit acknowledgment by sponsor that goals are revisable based on *all* consequences (Q8). Failure on any = Termination/Handoff (No Pilot as Inquiry).

  **Proposal 2: Replace Public Comment with Standing Citizens' Assembly (40 residents, random selection)**

  1.  **Problem Definition:**
      *   *Q1:* Problem: Current public comment is dominated by vocal minorities, unrepresentative, inefficient, performative rather than deliberative. Adequate if backed by analysis of speaker demographics, surveys showing public distrust/perceived ineffectiveness. *Pass.*
      *   *Q2:* Indeterminacy: Habit of open mic clashes with goals of representative input, efficient meetings, quality deliberation. Current process creates conflict (shouting matches) without resolution. *Pass.*
  2.  **Inquiry Design:**
      *   *Q3:* Hypothesis: "If we replace open public comment with structured deliberation by a randomly selected, demographically stratified assembly of 40 residents, council will receive more representative, considered, and actionable input on agenda items, leading to higher-quality decisions and increased public trust in local government, because diverse perspectives are heard equally and constructively integrated." *Pass.*
      *   *Q4:* Falsification: "If the assembly fails to be demographically representative on key strata (income, race, geography) despite recruitment efforts, OR if survey data shows public trust in input process decreases, OR if council members report the input is less useful/actionable than prior comments on key metrics, we must revise or abandon." *Pass.*
      *   *Q5:* Uncertainties: Exclusion of passionate issue-specific voices, silencing of marginalized groups uncomfortable in formal settings, reduced transparency/perception of elite capture, impact on council-member accountability. Measurement: Track assembly demographics rigorously, conduct pre/post public trust surveys, in-depth interviews with former frequent commenters and marginalized groups, council feedback on input quality. *Pass* (if included).
  3.  **Public Formation (CRITICAL):**
      *   *Q6:* Affected Public: **All** city residents (especially those who currently comment or wish to), organized interest groups, marginalized communities (non-English speakers, undocumented, very low-income, shift workers), council members, city staff managing process.
      *   *Q7:* Channels: **Major Challenge.** Random selection + structured deliberation inherently excludes non-selected residents *from this specific input channel*. Adequacy depends on: **a) Robust Oversight/Transparency:** Full video/transcripts published promptly, clear rationale for assembly recommendations. **b) Complementary Channels:** Retaining *other* accessible input methods (written comments, targeted consultations on major issues) is **essential** to avoid disenfranchisement. **c) Assembly Process:** Accessible meeting times/childcare/stipends, facilitation for diverse communication styles, translation. **d) Sunset Clause:** Explicit commitment to evaluate and potentially revert.
      *   **Termination/Redesign (High Risk):** If the proposal **eliminates all other direct channels** for unsolicited resident input to the council on agenda items, it fails Q7. The *indirectly affected public* (non-selected residents) lose their direct channel. The transaction (council decision) affects them, but they have no voice *in this specific mechanism*. **Diagnostic:** Ask: "How does a resident with urgent, specific, non-agenda input directly address the council under this system?" If the answer isn't clear and accessible (e.g., retained written comment, separate open forum), **Termination/Handoff: No - Invalid Public Formation.** Handoff to Council only if they want a political decision to *remove* direct channels, not as a pilot.
  4.  **Ends-in-View & Handoff:**
      *   *Q8:* Goals provisional? Yes, pilot should test if it delivers better input/trust. *Pass.*
      *   *Q9:* Irreversible? No (can revert). *Pass.*
      *   *Q10:* Value Conflict? Yes - Balancing efficiency/representativeness vs. direct access/openness, expert deliberation vs. passionate advocacy. **Handoff Trigger:** Council must decide this balance. Pilot informs. *Pass to Pilot, but Handoff for Permanent Decision.*

  **Verdict:** **Termination/Handoff (No - Invalid Public Formation) OR Major Redesign.** If the proposal *eliminates* traditional public comment without providing *equally accessible, direct alternatives* for non-selected residents to address the council on agenda items, it fails the Public Formation test (Q7). This is the "answer you won't enjoy defending." To proceed as a *pilot*: **Must retain a clear, accessible, direct channel** (e.g., dedicated written comment period per agenda item with council review guaranteed) alongside the Assembly. The pilot then tests if the *Assembly adds unique value* without disenfranchising.

  ---

  **Candid Account of Limitations & Judgment Calls:**

  1.  **Identifying the "Genuine" Problem (Q1):** Dewey's "indeterminate situation" is philosophically sound but administratively fuzzy. What *counts* as sufficient evidence? A survey showing 30% dissatisfaction? Rising service costs? Judgment call: Requiring *multiple* evidence sources helps, but the threshold remains subjective.
  2.  **Defining the "Public" (Q6):** While consequence mapping is crucial, drawing boundaries is inherently political and subjective. When do "indirect effects" become too remote? Judgment call: Err on inclusion, but practical limits exist.
  3.  **"Adequate" Channels for the Public (Q7):** Dewey demands effective organization of the public, but what's "adequate" in practice? Is translated email sufficient for non-English speakers? Are evening meetings enough for shift workers? This is a major vulnerability requiring significant resources and constant iteration. Judgment call: Prioritizing accessibility and proportional burden.
  4.  **Distinguishing Means/Ends & Handoff Triggers (Q10):** The line between technical means (testable) and value-laden ends (political) is porous. Is "reducing congestion by 10%" a technical goal or a value choice prioritizing drivers vs. others? Judgment call: Focus on whether the *core conflict* is about *how* to achieve a shared goal (testable) vs. *what* goal should be prioritized (handoff).
  5.  **The Illusion of Neutral Procedure:** This procedure structures inquiry but doesn't eliminate power dynamics. Who frames the initial problem? Who sets falsification thresholds? The administrator's role in guiding sponsors through these steps remains influential, despite the structure.
  6.  **Efficiency vs. Depth:** Rigorous Deweyan inquiry is slow and resource-intensive. Applying this to a dozen proposals/year may require triage or streamlined methods, risking superficiality – the opposite of Dewey's careful inquiry.
  7.  **Revision of Ends-in-View (Post-Pilot):** While built-in, forcing sponsors (especially elected officials) to genuinely revise cherished goals based on evidence, especially unanticipated harms, is profoundly political and difficult to enforce procedurally. The procedure relies on institutional commitment to experimentalism.

  **Conclusion:** This procedure operationalizes Dewey's core tenets – problem-centric inquiry, genuine testing, public inclusion, revisable ends – into actionable administrative steps. It provides clear "No" gates for non-inquiry (solutioneering, pilot-theater, exclusion) and handoffs for non-experimental decisions. However, its effectiveness hinges on consistent application, resources for genuine public engagement, and an organizational culture that values learning over winning. The "unpleasant" answer for the Citizens' Assembly proposal highlights the procedure's power – and the political friction inherent in taking Dewey's democratic experimentalism seriously in a governmental context. It forces confrontation with the question: Are we testing a better way to *include* the public, or a more efficient way to *exclude* them?
