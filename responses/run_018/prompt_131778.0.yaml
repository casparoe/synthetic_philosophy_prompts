answer: |-
  **(You approach the mic, holding a slightly crumpled printout of the workshop agenda. You tap it.)**  
  "Right. Welcome. And apologies for the typo on the invite – apparently, we’re discussing ‘subsidi*arty*’ today. Fitting, really. Because this principle? It’s often just as slippery to grasp as that missing ‘i’.  

  **(Lean in, conversational)**  
  Look around. Half of you could draft Article 5 TEU on a napkin after three beers. The other half? You’re the ones *living* the consequences when someone in Brussels or Berlin waves that napkin around and says, ‘See? *Subsidiarity!* We decided you should handle this mess.’ And I see your eye-rolls. I get it.  

  But here’s the one thing I think gets missed in the legal briefs *and* the cantonal coffee shops: **Subsidiarity isn’t about distance. It’s not ‘closer = automatically better’.**  

  **(Pause, shift tone)**  
  We treat it like geography. ‘The local level is *physically* closer to the problem, so *obviously* they decide!’ But that’s not the engine. The real magic – the messy, necessary magic – is **reverse delegation**.  

  Think of it like... building a cathedral. Stick with me.  

  **(Awkward analogy begins)**  
  The centre – Brussels, Berlin, wherever – isn’t the architect handing down flawless blueprints to the bricklayers below. **It’s the other way around.** The legitimacy of the whole towering structure? It doesn’t come from the spire declaring itself sovereign. **It comes up from the foundation stones.** Each stone – your canton, your *Land* – isn't just *receiving* instructions. It’s actively shaping the mortar, testing the load, proving *through its own competence and agreements* that the whole thing can stand. It *generates* the reason the spire even gets to point skyward.  

  **(Address the lawyers directly)**  
  So, lawyers, scholars… this flips the script on competence-competence. It’s not just *who* decides the issue, but **who decides who is *capable* of deciding**? If the ‘lower’ level isn’t actively *building* that capability, demonstrating it through action and mutual pacts, then the centre’s claim to step back rings hollow. It becomes procedural theatre. Worse, a blame-shifting device: ‘*We* made the perfect policy! *You* botched the implementation!’ That’s not reverse delegation. That’s hot potato. And we see the gap – the missing middle – in EU regional policy every time coordination fails because the *conditions* for genuine local capacity weren’t fostered upwards.  

  **(Turn to the organizers)**  
  And organizers, cantonal folks, *Länder* champions... this means I *can’t* give you the easy story. I can’t stand here and promise that ripping power from Berlin or Brussels automatically means sunshine and rainbows and perfect democracy in your town square. Because look at the Swiss model! Fiscal equalization – rich cantons supporting poorer ones. That’s not pure, unadulterated local autonomy either. It’s a *pact*. A recognition that the legitimacy of the whole Swiss system *depends* on that agreement flowing upwards from you all. It breaks the ‘local good, central bad’ fairy tale. **The legitimacy isn’t handed down; it’s hammered out.**  

  **(Bring it together)**  
  So, ‘Who Decides the Scale?’ isn't just a question of proximity or hierarchy. **It’s a question of authorship.** Who is actively *writing* the conditions that make authority legitimate at *any* level?  

  The EU isn’t a big nation-state waiting for a trim. It’s an experiment in whether multiple foundations can build a spire that doesn’t topple. Your Swiss valleys and German regions aren’t just passive recipients of power; you’re the proving ground for whether wider structures can claim legitimacy at all.  

  **(Final punch, tap the agenda again)**  
  That missing ‘i’ in ‘subsidi*arty*’? Maybe it stands for **‘initiative’**. The initiative that starts below. The messy, negotiated, *essential* work that makes the whole cathedral stand – not because the spire wills it, but because the stones agreed how to hold it up.  

  Let’s get messy. Q&A’s yours."  

  **(You step back, leaving the tension – and the possibility – hanging.)**

  **Why this works:**  
  1.  **The Hook:** The self-deprecating "subsidiarty" typo immediately disarms, signals informality, and becomes a thematic touchstone.  
  2.  **Core Idea Crystalized:** "Reverse delegation" and "generating legitimacy upwards" are the anchors. The cathedral analogy makes the abstract concrete (even if awkwardly for some lawyers – mission accomplished!).  
  3.  **Addresses Both Audiences Directly:**  
      *   *Lawyers/Scholars:* Name-drops Art 5 TEU, competence-competence, EU blame-shifting, and the missing middle in regional policy. Challenges their procedural focus.  
      *   *Organizers:* Validates their frustration ("eye-rolls"), confronts the Swiss paradox head-on, shatters the simplistic "local=always better" myth they might resent being sold.  
  4.  **Tackles the Tensions:** Doesn't shy from EU's blame-shifting or Swiss fiscal equalization breaking the "pure autonomy" ideal. Uses them as *proof* of the core argument about negotiated legitimacy.  
  5.  **The Analogy:** The cathedral (foundation stones generating spire legitimacy) is visual, slightly awkward for strict legal positivists ("But sovereignty!"), but resonant for those thinking about structure and foundations. It forces a different perspective.  
  6.  **No False Promises:** Explicitly states decentralization isn't automatically more democratic and the EU isn't just a big state. Grounds the talk in realism.  
  7.  **Energy & Tone:** Conversational ("Look around," "I see your eye-rolls," "Stick with me"), avoids jargon where possible, uses punchy phrases ("hot potato," "procedural theatre," "fairy tale"). Ends with a provocative twist on the typo ("i for initiative").  
  8.  **Length:** Paced for ~8 minutes, leaves them wanting more for Q&A.
