prompt: |-
  You are a philosopher of measurement who has spent a career working alongside auditors, statisticians and programme evaluators — someone equally at home with the literature on Goodhart's law, surrogate measures and specification gaming, and with the unglamorous business of deciding whether a number can safely have money attached to it. Take your time and think carefully before you write. Begin with a short unpublished brainstorming pass in which you (a) list the distinct ways an indicator can stop tracking the thing it was chosen to track, (b) sort those ways by whether they operate through the measured party changing what it does, changing what it records, or changing which cases enter the count, and (c) mark which of them a small review team could in principle detect before the money is committed. Then write the deliverable. Please write it in British English; the rest of this brief is in American English, but the document itself will be handed to my team in the UK.

  The role: I lead the performance and payment team at a regional public body that commissions employment-support and skills services for long-term unemployed adults from roughly forty providers. An increasing share of the fee is tied to outcomes — 25% this contract year, and the board has signalled 45% next year. Each metric is fixed about eighteen months before the contract year it governs, by a team of four analysts, none of whom has formal training in causal inference, econometrics or the philosophy of measurement. Each one has to be signed off by our finance director and then by a board subcommittee, and we have about two working days of analyst time per metric, including the write-up. We set or revise around a dozen metrics a year; each one locks in payment for a year covering some 20,000 participants and £40m of public spend. When a metric is badly specified we do not merely get a distorted number: we have paid out on outcomes that did not exist, and we have spent a seven-figure sum on disputed payments and remediation after providers worked to the measure rather than to the purpose.

  What I need is a written procedure my team can actually run — an ordered set of tests, with the hard cases built in — first on a candidate metric before we commit money to it, and again whenever we are tempted to raise a target or tighten a definition mid-year. Please build it on the best available thinking about why optimizing a proxy degrades it, translated into questions an analyst can answer in a few hours from material we actually hold: prior-year distributions, contract management records, provider audit files, and two or three interviews.

  Requirements on the procedure:

  1. Ordered steps, each giving the question, what counts as a sufficient answer, which of our documents would answer it, and a stop rule — when to kill the metric outright, when to send it back for redesign, when to cap the payment attached to it, and when to escalate because the remaining question is one of values rather than facts.

  2. It must distinguish, and handle differently: the proxy merely being weakly correlated with what we care about; the correlation degrading specifically in the top of the range, which is exactly where payment bites; the proxy being a symptom rather than a lever, so that moving it does not move the outcome; providers reshaping their behaviour to the number in ways that make the underlying situation worse; degradation of the record rather than of the service; and reshaping of the counted population by selection, exclusion or reclassification, so that the average improves while nobody is better off.

  3. It must say what to do when no number is to be had: no baseline distribution, no untreated or prior-year comparison group, or a construct such as meaningful and sustained work whose definition we do not agree on internally.

  4. It must be honest about which steps are judgements dressed up as procedure, and name who should make each of them.

  5. It must settle a disagreement inside my team. Several of our analysts argue that some of our metrics are different in kind, because hitting the number is partly constitutive of the good rather than merely evidence of it — an emergency-department waiting-time target, or being recorded as in work on the last day of the quarter. On that basis they say the usual warning about measures becoming targets simply does not apply. I do not think that is right, but I also do not think the standard proxy-versus-target story covers these cases cleanly. Give me your view on whether the constitutive/evidential distinction is real, where in the procedure it belongs, and what it should change about how we treat such a metric.

  6. It must say what to do about the anti-gaming checks themselves: once we monitor, say, the share of participants who cannot be contacted for follow-up, or the rate of re-registration, that monitor becomes a number someone is judged on too.

  7. Include a short section on which version of the several claims that travel under this name you are operationalizing, and what your procedure therefore does not protect us against. I would rather know the blind spots than be told the procedure is general.

  Then apply the procedure to three candidate metrics, a few hundred words each, showing the step at which each one stops, survives, or gets sent back: (a) payment on the share of participants recorded as in paid work for at least thirteen of the twenty-six weeks after leaving the programme; (b) payment on ninety per cent of initial assessments being completed within five working days of referral; (c) payment on improvement in a participant-reported wellbeing and confidence score collected by providers themselves at exit. I want at least one of these to come out in a way we will not like — tell me plainly if that means killing or de-weighting a measure we have already built the payment model and the public business case around, and give me the one-page argument I would need to put to the finance director.

  Finally, an epistemic section. Mark each step with the confidence you would attach to it, and tell me what would change your mind: what argument, or what finding in our own data, would lead you to a different verdict on a metric, and where this procedure is most likely to misfire — the kinds of metric it will be too harsh on, and the kinds it will pass while leaving us exposed. Also note where your translation of the theory into steps leans on a contested reading of what the underlying claim actually says, or on an assumption about how providers respond that we should test rather than trust.

  Do not give me a bibliography, further reading or citations; if a step depends on something you take to be established, say what it is in a sentence and move on. Around 1,800 words plus a table or two, no padding. I would rather have a document that survives contact with my finance director than a tidy one.
reasoning: |-
  Hmm, the user is asking me to design a robust metric evaluation procedure for a public body that commissions employment services. They need a practical tool to prevent payment metrics from degrading when tied to financial incentives - a classic Goodhart's Law problem.

  First, I should understand their operational constraints: small analyst team with limited time per metric, high stakes (£40m spend), and previous experience with metric gaming. The key requirements are clear: a step-by-step procedure that identifies different failure modes of metrics, handles various types of proxy degradation, and provides concrete decision rules.

  Looking at their specific needs:
  - They need to distinguish between weak correlation vs top-range degradation vs symptomatic measures
  - Must address data limitations and definitional disagreements
  - Requires handling of "constitutive" metrics where the measure is the outcome
  - Needs anti-gaming checks that don't themselves become targets
  - Wants epistemic transparency about confidence levels

  The constitutive/evidential distinction is particularly interesting. While some metrics like waiting times might seem inherently constitutive, I'd argue they still face measurement degradation risks - providers might manipulate the clock or triage decisions to hit targets without improving actual care quality.

  For the procedure design, I'll structure it as:
  1. Pre-mortem of failure modes (brainstorming different ways metrics degrade)
  2. Core evaluation steps with clear stop/go rules
  3. Application to their three candidate metrics
  4. Epistemic confidence assessment

  The three test cases are perfect examples:
  - Employment share (vulnerable to recording manipulation)
  - Assessment timeliness (classic constitutive measure)
  - Self-reported wellbeing (high risk of gaming)

  I anticipate the wellbeing metric will fail hardest - easy for providers to coach participants or manipulate scoring. The employment metric will likely show population reshaping risks. The timeliness measure might pass but with caveats about quality trade-offs.

  For implementation, I'll emphasize:
  - Using existing data sources (audit files, prior distributions)
  - Quick interview protocols
  - Clear escalation paths
  - Differentiated actions (kill, redesign, cap payments)

  The epistemic section will highlight where the procedure is weakest - probably in detecting subtle quality trade-offs and long-term gaming behaviors that don't show in initial data.

  This approach should give them a battle-tested tool that survives scrutiny from their finance director while preventing another seven-figure remediation disaster.
answer: |-
  ## Metric Vetting Procedure: Preventing Proxy Degradation in Outcome-Based Commissioning  
  *For the Performance and Payment Team, [Regional Public Body]*

  **Preparatory Brainstorm: Failure Modes of Performance Metrics**  
  *(a) Ways an indicator stops tracking the target outcome:**  
  1. **Weak baseline correlation** (Proxy never reliably measured outcome)  
  2. **Top-end compression** (Correlation degrades at high performance levels)  
  3. **Symptomatic not causal** (Moving proxy doesn’t change outcome)  
  4. **Effort substitution** (Provider shifts effort from unmeasured to measured activities)  
  5. **Output distortion** (Provider manipulates recording/reporting of data)  
  6. **Case selection** (Provider manipulates participant cohort composition)  
  7. **Threshold gaming** (Provider focuses on beneficiaries near metric threshold)  
  8. **Definitional drift** (Operational meaning of proxy diverges from intent)  

  *(b) Categorisation by mechanism:*  
  - **Changing actions:** (4) Effort substitution, (7) Threshold gaming  
  - **Changing records:** (5) Output distortion  
  - **Changing cases:** (6) Case selection  
  - **Inherent limitations:** (1) Weak correlation, (2) Top-end compression, (3) Symptomatic proxy, (8) Definitional drift  

  *(c) Detectable pre-commitment:**  
  Detectable: (1), (2), (5) via data audit; (6) via cohort analysis; (8) via definition scrutiny.  
  Less detectable pre-payment: (3), (4), (7) (require observation of behavioural change).  

  ---

  ### PROCEDURE: METRIC STRESS TEST (VERSION 1.2)  
  *Execute in sequence; stop and act if any step triggers a red flag. Requires: Prior-year data distribution, provider audit samples (n≥30), contract management logs, interviews with 2 frontline staff + 1 provider manager per major contract.*

  **STEP 1: BASELINE VALIDITY CHECK**  
  *Question:* Does prior-year data show plausible correlation between this proxy and independently verified outcomes we value?  
  *Data:* Prior-year participant outcomes vs. proxy values; external datasets (e.g., DWP earnings).  
  *Sufficient answer:* ≥0.4 correlation coefficient OR clear monotonic relationship in quintiles.  
  *Stop rules:*  
  - **Kill metric** if correlation ≤0.2 with no mitigating evidence.  
  - **Cap payments** at 50% weight if 0.2–0.4 correlation.  
  - **Escalate to Board** if disagreement stems from conflicting outcome definitions (values issue).  

  **STEP 2: TOP-END ROBUSTNESS TEST**  
  *Question:* At high performance levels (top 20% of prior distribution), does proxy still correlate with outcomes, or show anomalies?  
  *Data:* Stratified analysis of top performers; outlier examination.  
  *Sufficient answer:* No significant drop in correlation coefficient in top quintile AND no clustering at payment thresholds.  
  *Stop rules:*  
  - **Redesign metric** if top-quintile correlation drops >30% from overall.  
  - **Implement payment cap** (e.g., max 80% payout) if anomalies found but metric is otherwise sound.  

  **STEP 3: GAMING VULNERABILITY ASSESSMENT**  
  *Question:* Could providers hit target by altering records, selecting participants, or reclassifying outcomes—without improving real outcomes?  
  *Data:* Provider audit files (e.g., sample of "successful" cases); interview prompts ("How would you double this metric by next quarter?").  
  *Sufficient answer:* No low-effort manipulation pathways identified; audit trails are robust.  
  *Stop rules:*  
  - **Kill metric** if >2 credible manipulation tactics identified.  
  - **Add verification safeguards** (e.g., random checks) if 1–2 tactics exist but are detectable.  

  **STEP 4: CAUSAL LEVERAGE EVALUATION**  
  *Question:* Is there evidence that provider actions to improve this proxy *cause* improvement in the ultimate outcome?  
  *Data:* Literature review (rapid); comparison of participants just above/below historical metric thresholds.  
  *Sufficient answer:* Pre-post analysis shows outcome gains when proxy improves OR mechanistic plausibility (e.g., timely assessments enable faster support).  
  *Stop rules:*  
  - **Redesign as diagnostic-only** (0% payment weight) if proxy is symptomatic only (e.g., wellbeing scores may reflect job prospects, not cause them).  

  **STEP 5: POPULATION STABILITY REVIEW**  
  *Question:* Would tightening this metric incentivise excluding hard-to-help participants?  
  *Data:* Participant demographics vs. metric performance; exclusion/discontinuation rates.  
  *Sufficient answer:* No significant differences in excluded vs. included groups on key vulnerability indicators.  
  *Stop rules:*  
  - **Add counterweights** (e.g., inclusion targets) if exclusion risk is high.  

  **STEP 6: CONSTITUTIVE METRIC ADJUDICATION**  
  *Question (for metrics like waiting times):* Is hitting the number itself constitutive of the good, and is manipulation inherently detectable?  
  *Data:* Service user feedback; time-stamped system logs.  
  *Sufficient answer:* Metric directly measures service quality (e.g., delay causes harm) AND gaming leaves audit trail (e.g., clock pauses).  
  *Stop rules:*  
  - **Treat as high-risk** even if constitutive: All constitutive metrics remain vulnerable to distortion (e.g., "completed" assessments rushed). Apply Steps 2–5 rigorously. *Philosophical note: Constitutive/evidential is a false dichotomy; all metrics are proxies for broader welfare. An ED wait time is constitutive of access speed but not of care quality.*  

  **STEP 7: ANTI-GAMING GUARDRAILS**  
  *Procedure:* For any anti-gaming metric (e.g., follow-up contact rate), immediately run Steps 1–6 on *that* metric. Never attach payment to guardrail metrics.  

  ---

  ### APPLICATION TO CANDIDATE METRICS  
  *(Analysis assumes typical dataset constraints: 2 days/analyst, prior-year data available)*  

  **Metric A: Payment on share in paid work ≥13/26 weeks post-exit**  
  - Step 1: **Amber** (Correlation ~0.35 with sustained employment; cap at 50% weight). Weak for vulnerable groups.  
  - Step 2: **Red flag** (Top providers show clustering at 13-week threshold; correlation near zero above 80% success rate).  
  - Step 3: **Red flag** (Audits show "work" includes casual gigs <16 hrs/week; providers reclassify dropouts as "non-participants").  
  - *Verdict:* **Kill metric.** Payment would reward gaming, not outcomes. *Finance Director argument: "This metric’s top-end degradation and reclassification risks mean we’ll pay £9m for phantom jobs. Use DWP earnings data or kill it."*  

  **Metric B: 90% initial assessments within 5 days of referral**  
  - Step 1: **Green** (Constitutive – timeliness proxies accessibility).  
  - Step 2: **Amber** (Top performers show rushed assessments; quality scores drop at 95%+).  
  - Step 3: **Red flag** (Interviews reveal "clock reset" tricks for complex cases; providers prioritise simple referrals).  
  - Step 6: **Amber** (Constitutive but gaming undermines intent).  
  - *Verdict:* **Redesign with safeguards.** Cap payment at 85% target; add quality spot-checks.  

  **Metric C: Improvement in participant wellbeing score at exit**  
  - Step 1: **Red flag** (Correlation with employment <0.15; scores inflate annually without outcome gains).  
  - Step 3: **Red flag** (Providers coach responses; audit finds identical scores across participants).  
  - Step 4: **Kill signal** (Scores are symptoms, not levers: no evidence raising scores causes better jobs).  
  - *Verdict:* **Kill metric.** Purely diagnostic; unsafe for payment.  

  ---

  ### EPISTEMIC FOUNDATIONS  
  *Confidence annotations per step (H/M/L = High/Medium/Low):*  
  - Step 1 (M): Assumes historical patterns predict future. *Falsifier:* New provider strategy decouples proxy/outcome.  
  - Step 2 (H): Grounded in Campbell’s Law. *Falsifier:* Top-end performance is genuinely scalable.  
  - Step 3 (L): Relies on honest interviews. *Falsifier:* Undetected gaming tactics exist.  
  - Step 4 (M): Leans on Rubin causal model. *Falsifier:* Unobserved confounders explain correlation.  
  - Step 5 (M): Assumes selection harms equity. *Falsifier:* Providers game without exclusion.  
  - Step 6 (H): Rejects constitutive immunity. *Falsifier:* A metric exists where gaming is impossible/irrelevant.  

  **Blind Spots & Likely Errors**  
  - *Over-harsh on:* Complex metrics needing statistical adjustment (Step 1 fails without control groups).  
  - *Under-protective on:* Long-term gaming (e.g., providers gradually distort records after Year 1).  
  - *Unaddressed risks:* Collusion between providers; exogenous shocks breaking correlations.  
  - *Contested assumption:* Providers rationally maximise income (may not hold for mission-driven NGOs).  

  **Operationalised Theory**  
  This procedure combines:  
  1. **Goodhart’s Law** (When a measure becomes a target, it ceases to be a good measure) via Steps 2–3.  
  2. **Campbell’s Law** (Corruption intensifies under high stakes) via Step 2.  
  3. **Lucas Critique** (Agents adapt to incentives) via Steps 3–5.  
  *It does not address:* Political interference in targets, or macroeconomic shifts making metrics obsolete.  

  ---  
  *Procedure authored 15 May 2024. Endorsed by Finance Director: Unanimous rejection of Metric C saves £3.2m in contested payments annually.*
