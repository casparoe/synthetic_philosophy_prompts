    "better_analogy_suggestion": "A river and its water: The river depends on water, isn't identical to it, and damming the river (destroying the 'form') doesn't destroy the H₂O. But like statues, rivers can't jump substrates (e.g., relocate to a new continent).",
    "journalist_note_on_usefulness": "Useful for illustrating dependence and non-identity in a relatable way—but risks implying statues are 'patterns' separable from matter. Clarify that statues are more 'sticky' to their substrate than melodies."
  }
  ```  

  ### Journalist Cheat Sheet  
  - **Keep**: Use to explain why "destroying a statue ≠ destroying clay." Casual audiences get it instantly.  
  - **Cut**: Avoid implying statues can "move" between materials like melodies do.  
  - **Fix**: Pair it with the river analogy to ground the "sticky matter" point.  
  - **Why it’s sticky**: Melodies are brain candy—they make metaphysics feel musical. But don’t let the tune drown out the material reality.
