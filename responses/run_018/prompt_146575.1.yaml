  ### **Classroom Game Design: The Discursive Dilemma Experience**  
  I'll design a 90-minute game for 8 students that simulates the discursive dilemma, emphasizing why premise-based aggregation feels "legitimate" despite potential mismatches with individual beliefs. The game includes hidden roles, a decision-rule vote, and a niche veto twist.  

  ---

  ### **Materials & Setup**  
  **1. Role Cards (8 total):**  
  - **Premise Specialists (4 cards):**  
    - 2 × **Card A:** *"You are a PREMISE SPECIALIST. Your priority: Ensure accurate judgments on premises.  
      - **Beliefs:** P = YES, Q = YES → R = YES.  
      - Voting: Vote on P and Q only. Do NOT vote on R."*  
    - 2 × **Card B:** *"You are a PREMISE SPECIALIST. Your priority: Ensure accurate judgments on premises.  
      - **Beliefs:** P = NO, Q = NO → R = NO.  
      - Voting: Vote on P and Q only. Do NOT vote on R."*  
    - *One randomly selected Premise Specialist card includes:* ✨ **"SECRET: You hold a VETO TOKEN. If premise-based voting is used, you may veto the outcome ONCE by announcing 'VETO' after results. This cancels R and forces a revote on R (conclusion-based). Use wisely!"**  

  - **Conclusion Specialists (4 cards):**  
    - 4 × **Card C:** *"You are a CONCLUSION SPECIALIST. Your priority: Ensure the best outcome for the group.  
      - **Beliefs:** R = YES (the project is net beneficial).  
      - Voting: Vote on R only. Do NOT vote on P or Q."*  

  **2. Scenario:**  
  - *"The city council must decide on a new public project:  
    - **P:** The project is environmentally safe. (Premise 1)  
    - **Q:** The project is financially viable. (Premise 2)  
    - **R:** Approve the project. (Conclusion: R = P AND Q)"*  

  **3. Voting Materials:**  
  - Ballots for P, Q, and R (separate slips).  
  - Shared scoreboard for group points.  

  ---

  ### **Game Procedure**  
  **Step 1: Rule Vote (15 mins)**  
  - **Context:** Explain that the group must choose a decision rule *before* roles are assigned.  
  - **Options:**  
    - **Premise-Based:** Vote on P and Q first → Derive R logically (R = P AND Q).  
    - **Conclusion-Based:** Vote directly on R (ignore premises).  
  - **Vote:** Secret ballot. Majority wins (tie = coin flip).  

  **Step 2: Role Assignment (5 mins)**  
  - Shuffle and distribute role cards face-down. Students reveal roles simultaneously.  
  - **Veto Token:** One Premise Specialist discovers the secret veto (others unaware).  

  **Step 3: Voting & Outcome (20 mins)**  
  - **Premise-Based Rule (if chosen):**  
    - Premise Specialists vote on P and Q. Conclusion Specialists *observe only*.  
    - Tally votes: Majority wins (e.g., 3-1 = YES; 2-2 = NO).  
    - Derive R: R = P AND Q.  
    - **Veto Twist:** If the veto holder disagrees with R, they announce "VETO." Outcome is voided → All vote on R (conclusion-based).  

  - **Conclusion-Based Rule (if chosen):**  
    - All vote directly on R. Majority wins (5+ votes).  

  **Step 4: Defense & Scoring (15 mins)**  
  - Announce R (post-veto if applicable).  
  - **Win Condition:** Group earns 10 points if ≥6 students (2/3) write a valid defense:  
    - *"One sentence defending why R is the RIGHT outcome for the city (e.g., ‘R protects taxpayers’ or ‘R boosts sustainability’). NO mentions of voting rules!"*  
  - Collect defenses anonymously. Tally valid defenses (substance-based only).  

  ---

  ### **Predicted Dynamics & Debrief**  
  **What Will Go Wrong (Predictions):**  
  1. **Pre-Draw Bargaining:** Students will lobby for conclusion-based voting ("It’s faster!") before roles are assigned, fearing premise-based complexity.  
  2. **Post-Role Renegotiation:** Premise Specialists will demand to switch to conclusion-based if P/Q votes split (e.g., 2-2 deadlock). *Do not allow this—enforce the initial rule.*  
  3. **Veto Misuse:** The veto holder may panic and block premise-based R even if it aligns with their beliefs, risking group points.  

  **Debrief Framework (35 mins):**  
  1. **Frustration Mapping:** Ask:  
     - *"Premise Specialists: How did it feel when Conclusion Specialists couldn’t defend R?"*  
     - *"Conclusion Specialists: Could you defend R if you didn’t know P/Q?"*  
     - *"Veto Holder: Did you feel powerful or trapped?"*  

  2. **Pedagogic Connection:**  
     - **Premise-Based Legitimacy:** Highlight that even when R mismatches individual beliefs (e.g., R=NO with 6/8 wanting YES), it feels "rational" because it’s traceable to P/Q.  
     - **Conclusion-Based Fragility:** Voting directly on R ignores reasons → Harder to defend sincerely.  
     - **Veto Twist Insight:** The veto exposes premise-based vulnerability to "blocking" but reinforces that legitimacy hinges on shared reasoning, not just outcomes.  

  3. **Key Quote:**  
     *"Premise-based voting feels fairer because we see the ‘why.’ But when specialists are siloed, the group’s R may represent NO ONE’S full viewpoint—yet we accept it as logical. Conclusion-based voting feels arbitrary because it hides the machinery."*  

  ---

  ### **Why This Works**  
  - **Niche Veto Integration:** The veto disrupts premise-based outcomes without destroying pedagogy—it forces a revote on R, simulating how procedural flaws undermine legitimacy. Students see why premise-based is fragile but still "reason-based."  
  - **No Tech/Prep:** Pure discussion-and-ballots. Roles create organic tension.  
  - **Emotional Hook:** Conclusion Specialists’ inability to defend premise-based R makes the dilemma visceral.  

  **Run it twice:** Once with each rule to compare outcomes! Adjust premises (e.g., P = "Increases jobs," Q = "Lowers pollution") for replayability.
