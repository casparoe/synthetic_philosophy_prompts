answer: |-
  Here's a razor-focused exam prompt and model answer tailored to your niche, blocking AI regurgitation and demanding original diagnosis:

  ---

  **PHIL 699 / TOPO 610: Conceptual Contagion & Micro-Slippage**  
  **Take-Home Exam: Boundary Drift & Echo-Chamber Copycats**  
  **(48 hours | 1500 words max | 40 Marks)**  

  **Prompt:**  
  Trace the migration of the formal concept **‘boundary’** (point-set topology: `∂A = Cl(A) \ Int(A)`) into social ontology (e.g., group identity, epistemic communities). Now, diagnose this twist:  

  When a research clique **imports ‘boundary’ into social theory** but then:  
  1. Uses topological *language* to "rigorize" social partitions ("our ideological closure is compact!"),  
  2. Lets *social* goals (e.g., reinforcing in-group cohesion) retroactively distort their *mathematical* practice (e.g., relaxing definitions, ignoring counterexamples),  
  3. Re-exports this corrupted formalism *back* into math, calling it "applied topology".  

  **Is this (a)** harmless **semantic drift** (meaning shift), **(b) syntactic slippage** (misapplied formal structure), or **(c) a full copycat event** (normative feedback corrupting syntax)?  

  **Crux:** Pinpoint *how* the echo-chamber’s social weight (step 2) warps the formalism. If it’s copycatting, show the feedback loop’s mechanics. **Block** generic claims like "math reflects social constructs" – be specific to *this* mechanism.  

  **Rules:** No citations/bibliography. Engage the *mechanism*, not the ontology.  

  ---

  ### Model Answer (Crux Moves)
  **Diagnosis: Copycat Event** (not drift or slippage).  

  1. **Distinguishing Mechanisms**  
     - *Semantic Drift*: "Boundary" gains new social meanings (e.g., "cultural boundaries") *without* altering math. Not here – math itself is corrupted.  
     - *Syntactic Slippage*: Misapplying `∂A`’s *rules* to social sets (e.g., claiming identities have "closures"). This *starts* the problem but doesn’t explain the feedback.  
     - *Copycat Event*: Social norms **infect formal syntax**. The clique’s need for "neat" social boundaries (e.g., silencing dissent = "maintaining compactness") pressures them to *redefine* `∂A` mathematically (e.g., ignoring dense subsets in "social closures"). Syntax becomes a tool for social goals.  

  2. **Feedback Loop Mapping**  
     - **Step 1:** Topological `∂A` is borrowed for social "rigor" (syntactic slippage).  
     - **Step 2:** Social imperatives (e.g., "preserve group unity") demand *adjustments* to the math. E.g., redefining connectedness to exclude "disruptive" actors → mathematical practice bends to normative weight.  
     - **Step 3:** The corrupted syntax (e.g., a weaker `∂A` definition) is branded "socially robust topology" and reintroduced to math, where in-group reviewers approve it. The echo chamber self-validates.  

  3. **Blocking Structural-Realist Handwaving**  
     - *Not* just "math is socially influenced". The corruption is **procedural**: social goals actively reshape *inferential rules*.  
     - *Not* ambiguity: The mutated `∂A` is presented as *formally* sound within the clique, masking the normative sabotage.  
     - *Not* ontology: The issue isn’t "boundaries exist socially" but *how social goals hack mathematical syntax* and loop back.  

  **Why it Matters:** This copycatting erodes math’s error-correction. The echo chamber replaces peer review with ideological compliance, turning formalism into a cargo cult.  

  ---

  ### Marking Scheme (40 Total)  
  | **Criteria**                                                                 | **Marks** | **Penalties**                                  |  
  |------------------------------------------------------------------------------|-----------|-----------------------------------------------|  
  | Correctly identifies **copycat event** (not drift/slippage)                  | 0/15      | −15 if wrong mechanism                        |  
  | **Isolates the feedback loop**: Social goals → math corruption → re-export   | 0/10      | −5 if vague; −10 if missing                   |  
  | **Distinguishes all 3 mechanisms** (semantic/syntactic/copycat) clearly      | 0/8       | −4 per mechanism blurred                      |  
  | **Blocks handwaving**: Rejects "mere ambiguity" or structural realism        | 0/5       | −5 if unaddressed; −2 if weak                 |  
  | **No irrelevant ontology**: Focuses on syntax corruption, not social theory  | 0/2       | −2 for digressing into pure social analysis   |  

  **Key Penalties:**  
  - **−5** for framing it as "just semantic drift" or "syntactic error".  
  - **−10** for treating social ontology as the *primary* focus (ignoring math corruption).  
  - **Zero marks** if feedback loop isn’t central.  

  ---

  **Why this works for your scene:**  
  - The "echo-chamber copycat" twist is hyper-niche (no AI training dumps on this).  
  - Forces students to dissect *mechanisms*, not describe phenomena.  
  - Model answer preempts lazy tropes (structural realism, ambiguity claims).  
  - Casual but precise language matches your vibe ("corrupts teh formal practice").  

  This’ll make your seminar feel like a razor-edge philosophy/anti-meme warfare lab. Good luck with the draft!
