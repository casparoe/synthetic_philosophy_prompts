answer: |-
  Here's that Confucian Role Ethics Decision Tree for your grad student's edgy kidney dilemma, served with a side of narrative spice and philosophical chaos:

  **The Kidney Conundrum Decision Tree**  
  *Premise: Adopted son (raised w/ full filial rituals) discovers non-biological parentage. Parents request kidney donation. Where do his obligations lie?*

  ```
                                  START
                                    │
            ┌───────────────────────┼───────────────────────┐
            │                       │                       │
  **1. SOURCE of OBLIGATION?**      │                       │
                                    ▼                       ▼
           ┌──────────────┐  ┌───────────────┐  ┌─────────────────────┐
           │   BLOOD      │  │   RITUAL      │  │   CULTIVATED VIRTUE │
           │ (Genetic Tie)│  │ (Li Performed)│  │ (Ren/Xin Developed)│
           └──────┬───────┘  └──────┬────────┘  └──────────┬──────────┘
                  │                 │                      │
                  ▼                 ▼                      ▼
  **2. BODILY AUTONOMY vs. ROLE?** │                      │
         ┌────────┴────────┐       │                      │
         ▼                 ▼       ▼                      ▼
  ┌─────────────┐ ┌────────────────┐ ┌─────────────────┐ ┌───────────────┐
  │ Trumps Role │ │ Role Trumps    │ │ Role Trumps     │ │ Role Dissolves│
  │ (Body 1st)  │ │ (Hierarchy Ex.)│ │ (No Hierarchy)  │ │ (Conflict = 0)│
  └──────┬──────┘ └───────┬────────┘ └────────┬─────────┘ └───────┬──────┘
         │                │                   │                   │
         ▼                ▼                   ▼                   ▼
  ```

  **THE ENDPOINTS (LEAVES):**

  1.  **"Blood Quantum" (Unnamed - Weird Commitment):**  
      *Path: BLOOD → Role Trumps (Hierarchy)*  
      Obligation comes **only** from blood. Revelation **destroys** *all* filial duty instantly. Parents' request is absurd/impertinent. *Weird Commitment:* Biology is a binary switch; no grace period, no residual affection. Duty is either 100% "on" or "off" based on DNA. (Empty Spot: Rarely argued directly, implies adoption itself is morally void).
    
  2.  **"Li Literalism" (Xunzi Adjacent):**  
      *Path: RITUAL → Role Trumps (No Hierarchy)*  
      Obligation comes **solely** from perfect performance of *li* (rituals). Son performed them → duty exists. Bodily autonomy is irrelevant to role demands; the role *is* the obligation. He must donate. *Caveat:* If rituals were performed *by him* mechanically without sincerity, maybe escape... but tree can't easily split this from "Mencian Escape Hatch". (Philosopher: Echoes Xunzi's focus on external ritual shaping virtue).

  3.  **"The Mencian Escape Hatch" (Mencius Inspired):**  
      *Path: CULTIVATED VIRTUE → Role Trumps (Hierarchy)*  
      Obligation stems from **cultivated virtue** (*ren*, compassion). True filial piety arises from love nurtured *through* rituals. Revelation *might* shatter this cultivated bond, revealing it was fake. If love remains → duty strong, donation likely. If love evaporates → duty weakens (hierarchy crumbles). Bodily autonomy still loses to *genuine* role virtue. *Philosopher:* Mencius (focus on innate sprouts nurtured).

  4.  **"Virtue Calculus" (Unnamed - Utilitarian Confucian?):**  
      *Path: CULTIVATED VIRTUE → Role Dissolves*  
      Obligation comes from cultivated virtue. **BUT** the conflict itself (parents demanding an organ) reveals a *failure* of *their* virtue (*ren*, righteousness). This **dissolves** the son's specific role obligation. He may choose based on compassion (*ren*) alone, not filial *role*. Bodily autonomy wins by default. *Weird Commitment:* Role obligations can be voided by the *other* role-holder's vice. (Empty Spot: Under-explored dynamic).

  5.  **"The Mohist Wildcard" (Mozi Adjacent):**  
      *Path: [UNIVERSAL HUMAN ROLE Branch - Trumps Everything]*  
      **"Universal Care" (*Jian Ai*)** is the supreme obligation. Blood, ritual, cultivated bonds – all secondary. The son must impartially ask: "Does donating maximize benefit/harm reduction for *all*?" If parents are otherwise good people needing help → maybe yes. If they're exploitative → no. Biological truth is irrelevant. *Philosopher:* Mozi (hated by Confucians!). Bodily autonomy matters only if donation causes net harm.

  6.  **"The Bodily Autonomy Absolutist" (Unnamed - Modern Graft):**  
      *Path: ANY SOURCE → Trumps Role*  
      **No** role obligation, no matter its source (blood, ritual, virtue), can compel significant bodily violation. Filial piety has limits; the body is the fundamental ground of selfhood. Revelation might weaken the *emotional* claim, but the bodily autonomy argument stands alone. He says "no". *Weird Commitment:* Confucian roles *entirely* subordinate to modern bodily rights. (Empty Spot: Confucianism rarely theorizes this limit explicitly).

  7.  **"The Instant Dissolution View (Empty Spot - Unnamed & Likely Incoherent?):**  
      *Path: RITUAL → Role Dissolves*  
      Obligation comes from ritual (*li*). But revelation proves the rituals were performed under **false pretenses** → retroactively **voids** all ritual efficacy → instantly dissolves *all* duty. Poof! No kidney. No obligation. *Why Empty/Incoherent?* Confucianism sees *li* as transformative *in the doing*, shaping the participants regardless of original intent/truth. This view treats *li* like a legal contract requiring perfect disclosure. Un-Confucian. (Flagged as unexplored/incoherent).

  **Flags & Notes for the Novelist:**

  *   **The Blurry Line:** "Li Literalism" (Ritual Source → Role Trumps No Hierarchy) and "The Mencian Escape Hatch" (Virtue Source → Role Trumps Hierarchy) are **HARD for the tree to split cleanly.** Why? If perfect ritual *performance* necessarily cultivates true virtue (Xunzi-ish), they collapse together. If virtue can exist *without* perfect ritual or ritual *without* sincere virtue (Mencius-ish), they diverge. The tree forces a choice on the *primary* source, but reality is muddy.
  *   **The Big Holes:** The "Instant Dissolution View" is deliberately placed as an empty spot – it highlights how most Confucians assume the *practice* of *li* creates the bond, making sudden dissolution illogical. "Blood Quantum" is another fringe/empty spot.
  *   **Weirdness Abounds:** "Blood Quantum" (biology as on/off switch), "Virtue Calculus" (duty voided by *their* vice), and "Bodily Autonomy Absolutist" (modern right trumps all roles) are the weirdest commitments.
  *   **The Universal Trump Card:** Mozi's "Universal Care" is the only position offering a clear, non-role-specific hierarchy (care for all > specific roles). It’s radically different from mainstream Confucianism.
  *   **The Tired Grad Student's Relief:** This tree moves beyond "Mencius=Good, Xunzi=Bad?" by forcing choices on *why* roles bind (source) and *how* they break (autonomy clash). It exposes the messy edges and unspoken assumptions.

  Your protagonist can slam this sketch down, point at "Blood Quantum" or "Instant Dissolution" and say: "Look, advisor – the literature avoids these corners because they’re uncomfortable. But my edge case shines a light right there. What *really* grounds **famial** piety when the performance, the biology, and the cultivated feeling pull apart? Is it just... emotional blackmail with a 2,000-year-old citation?" (Bonus typo included ;)). Good luck with the scene!
