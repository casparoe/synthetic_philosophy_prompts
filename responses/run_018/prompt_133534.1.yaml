prompt: |-
  I'm working on a piece about artificial and biological minds, and I need the full spec for what counts as an adequate theory of original versus derived intentionality — the Dennett two-bitser angle against Searle's brain-only view. Before I talk to anyone, I want the desiderata list.

  What must such a theory actually deliver? Give me the cases it has to handle right: the classic thermostat, a printed dictionary, and — this is my injection for the piece — a synthetic receptor engineered by an AI that binds a pheromone invented in one lab and never seen in nature. Is that receptor's state about the molecule in an original way, a derived way, or does it break the binary?

  Then the distinctions it cant collapse: having aboutness at all versus having it in a particular mode, or being a vehicle versus being a source. And the biological or cognitive results it cant flatly contradict.

  For each, say why it's a real requirement and not just camp prejudice — flag what's non-negotiable versus what's a Searle-style or Dennett-style preference. Tell me if any subset of these demands is jointly unsatisfiable; that's the tension I want to highlight. And point out which single requirement does the most damage to popular theories.

  Keep it focused and casual. Dont send me chasing citations or reading lists — my readers wont follow footnotes, and I dont have space for a bibliography.
