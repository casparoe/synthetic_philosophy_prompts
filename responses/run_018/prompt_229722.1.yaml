prompt: |-
  I work as a senior distributed-systems engineer, and I have no formal background in medicine or philosophy. My native vocabulary is nodes, replicas, heartbeats, liveness and readiness probes, crashes, fail-stop and fail-silent failures, graceful shutdown, quiescence, checkpoint and restore, split-brain, and the difference between a process that is merely suspended and one whose state is unrecoverably lost. I would like you to restate, in that vocabulary and as faithfully as you can, the debate between the circulatory criterion of death (death as the irreversible cessation of circulation and respiration) and the whole-brain criterion (death as the irreversible loss of all functions of the entire brain, brainstem included) as rival accounts of when a human being is dead. Keep the translation honest: do not quietly assume that the brain is the control plane and then declare victory for the whole-brain side. The translation should handle the awkward facts, such as that a brain-dead body on a ventilator can keep a pulse and even heal wounds, while a heart can sometimes be restarted after it has stopped if the damage is not yet irreversible.

  Then give the residue report. Which parts of the debate translate cleanly into the language of crash detection, quiescence, and unrecoverable state? Which parts could only be carried across with distortion, and which parts have no counterpart at all in how we reason about nodes and services? Finally, take and defend a definite position on what the residue shows. In particular, commit to a view on whether the whole-brain criterion is best understood as identifying the true failure point that the circulatory criterion merely detects by proxy—a legacy heartbeat check—or whether that reading is itself an artifact of the translation. Give your reasons, and do not simply survey the options. Please respond in American English.
reasoning: |-
  Okay, let me approach this distributed systems engineer's request methodically. The user wants a precise mapping of medical death criteria onto system failure concepts, with strict adherence to their listed terminology and a residue analysis. 

  First, I need to establish clear translation rules: 
  - Circulatory death = failure of heartbeat subsystem
  - Brain death = unrecoverable control plane crash
  - Ventilator = artificial life support akin to external keepalives
  - Healing capacity = background processes continuing without central coordination

  The tricky part comes with edge cases: 
  A brain-dead body on ventilator maintaining circulation is like a node with dead control plane but functioning power supply - its "pulse" is artificial persistence. Meanwhile restarting a stopped heart resembles repairing a failed component before state corruption propagates.

  For the residue analysis, I notice fundamental disanalogies:
  - Biological systems lack clear quorum or consensus mechanisms
  - "Irreversibility" is context-dependent in medicine but absolute in systems
  - There's no equivalent to a system's "graceful shutdown" in death

  When defending a position, I'll argue that while brain death maps to unrecoverable control plane failure, this shouldn't automatically make it the "true" failure point. The circulatory criterion remains valid as a failure detection heuristic when irreversible - much like how we sometimes accept heartbeat loss as sufficient evidence of node death despite potential false positives.

  The key insight is that both criteria are operational definitions rather than ontological truths. The systems analogy reveals that choosing between them involves weighing trade-offs between false positives (declaring death too early) versus false negatives (keeping bodies "alive" too long) - a familiar engineering dilemma.
answer: |-
  Here's the translation of the death criteria debate into distributed systems terminology, followed by a residue analysis and a defended position:

  **Translated Debate**  
  *Circulatory Criterion (Legacy Failure Detection):*  
  A node is declared dead when its **heartbeat subsystem** enters **irreversible cessation** (no pulse/breathing). This is treated as a **fail-stop event**. The irreversibility condition means no **graceful restart** or **state restoration** is possible within the system's recovery window. Crucially, this criterion relies on the **failure domain** of the circulatory subsystem acting as a proxy for total system failure.  

  *Whole-Brain Criterion (Control Plane Failure):*  
  A node is dead when its **central control plane** (entire brain) suffers **irrecoverable state loss** and **permanent quiescence**. This is a **fail-silent failure** of the core coordination system. Even if auxiliary subsystems (circulation via ventilator, cellular repair via ICU) show **liveness probes** (pulse, wound healing), the node is unrecoverable because:  
  1. The control plane cannot be **checkpointed** or **restored**.  
  2. The system cannot achieve **global state coherence** without the brainstem's consensus protocol.  
  3. Continued "operation" is merely **artificial persistence of zombie processes** (e.g., reflex arcs) without central orchestration.  

  *Counterarguments & Edge Cases:*  
  - **Circulatory advocate:** A stopped heart isn’t always irrecoverable! If we initiate **immediate failover** (CPR) before **state corruption** (tissue ischemia), we can sometimes **restart the service** (ROSC). Calling it "irreversible cessation" preemptively is a **false positive**.  
  - **Brain advocate:** A ventilator is just **external life support** – like pinging a dead node’s IP. The "pulse" in brain death is a **synthetic heartbeat**, not evidence of system liveness. Wound healing is **localized background processes** (like orphaned daemons) but proves nothing about the control plane.  

  ---

  **Residue Report**  
  **Clean Translations:**  
  1. **Irreversibility ≡ Unrecoverable State:** Both fields require proof that no intervention can restore function.  
  2. **Ventilator/Synthetic Pulse ≡ Artificial Keepalives:** External signals don’t imply system integrity.  
  3. **Brainstem Failure ≡ Control Plane Crash:** Loss of central coordination invalidates system coherence.  
  4. **False Positives/Negatives:** Both debates weigh risks of premature declaration vs. maintaining "corpses" online.  

  **Distorted/Problematic Translations:**  
  1. **"Healing" in Brain-Dead Bodies:**  
     - *Engineering view:* Background processes (cell repair) running without central control.  
     - *Distortion:* Biology lacks a clear "init system" – healing could imply partial liveness.  
  2. **Split-Brain Analogy:**  
     - *Tempting but flawed:* Biological split-brain (e.g., hemispherectomy) doesn’t equate to two conscious nodes.  
     - *Distortion:* Consciousness isn’t a quorum-based service.  

  **Untranslatable Residue:**  
  1. **Ontology of Consciousness:** No engineering equivalent for subjective experience. A "quiescent control plane" doesn’t address *why* consciousness is the liveness probe.  
  2. **Biological Irreversibility:** In tech, "irreversible" is absolute (e.g., disk wipe). Biology’s irreversibility is probabilistic and context-dependent (e.g., hypothermic "pause").  
  3. **Integrated Organism vs. Node:** A node is *defined* by its function in a cluster. Humans have intrinsic value beyond functional utility.  

  ---

  **Defended Position: The Proxy Fallacy**  
  **Thesis:** The whole-brain criterion **is not** merely identifying the "true" failure point that circulation detects by proxy. Instead, it represents a **paradigm shift** from *legacy failure detection* (heartbeats) to *control plane integrity* as the definition of system failure. This isn’t an artifact of translation – it’s a philosophical upgrade.  

  **Why the Circulatory Criterion is a Legacy Check:**  
  - Like a **heartbeat monitor**, it infers total failure from a single subsystem (circulation) because:  
    - Historically, circulatory failure *always* led to control plane crash (no ventilators).  
    - It’s a **low-cost, high-reliability probe** in resource-limited environments (pre-ICU medicine).  
  - But like all proxies, it fails when dependencies change:  
    - **Ventilators decouple circulation from brain function.**  
    - **CPR disproves inevitability** – cardiac arrest isn’t immediately irreversible.  

  **Why Whole-Brain Isn’t Just "True Failure Detection":**  
  1. **Redefines "System" Boundaries:**  
     - Circulatory view: The system is dead when its *power supply* fails irrecoverably.  
     - Brain view: The system is dead when its *executable logic* is erased, even if power persists.  
  2. **Rejects Proxy Logic:**  
     - Brain death proponents don’t argue "the brain is the *real* failure point." They argue the brain **defines the system’s identity**. A body without brain function isn’t a "failed human" – it’s a **collection of orphaned processes** (organs) without a host application.  
  3. **The Residue Validates the Shift:**  
     - Untranslatable elements (consciousness, intrinsic value) reveal the circulatory criterion was *always* a practical heuristic, not a metaphysical claim. The whole-brain criterion explicitly centers on the loss of what makes a human *computationally unique* – not just "detection accuracy."  

  **Conclusion:**  
  The residue shows this isn’t a technical debate about failure detection, but a **conceptual conflict over system identity**. The whole-brain criterion succeeds because it acknowledges that a human isn’t merely a cluster of redundant services (organs) but a **tightly integrated system whose control plane’s permanent quiescence equals termination**. The circulatory criterion’s value is in operational simplicity – not ontological truth. We keep heartbeats as a *fallback* for cases where brain function can’t be assessed, just as engineers might use ICMP pings when the control port is firewalled. But in ideal conditions, probing the control plane is superior – not because it’s a "better proxy," but because it queries the system’s defining subsystem directly.
