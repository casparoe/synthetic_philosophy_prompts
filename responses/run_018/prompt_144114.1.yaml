    1. The technical capacity of a logic to avoid paradoxes (which intuitionism does for the liar).
    2. The equivalence of proof power (which holds for arithmetic via negative translation but fails for analysis).
    3. The ontological commitments (e.g., in HoTT, the intuitionistic version has computational meaning, but the structures can be studied classically).
    A clear example where intuitionism leads to genuinely new mathematics (like the development of realizability or the constructive theory of continuity) would help. Also, acknowledging that "loss" is perspective-dependent (classical vs intuitionist) is key.

  Overall Assessment:
  - Both make valid points: Intuitionism does avoid the liar paradox without explosion by rejecting bivalence and requiring constructive proofs. However, it does restrict classical mathematics in analysis (like the IVT) and requires extra conditions. The negative translation works for arithmetic but not for analysis. The structural innovations in HoTT are not exclusive to intuitionism but are often developed in that context for computational reasons. The debate is stuck because they are talking past each other on what counts as "content" and "loss".

