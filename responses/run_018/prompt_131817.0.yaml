  For the carrying example, I'm considering mathematical completeness - say a "Euclidean triangle" defined as having exactly the properties deriving from Euclidean axioms. Positivity becomes logical coherence: "having interior angles sum to 180°" is positive not as morally good but as constitutive. Necessary existence follows because if such a triangle is possible (consistent axioms), it must exist in all models (worlds). Crucially, this excludes any perfection language.

  Key misconceptions to intercept: 
  - At positivity definition: students will equate it with moral goodness. Must decouple immediately via formal examples like symmetry. 
  - When introducing possibility premise: they'll read it epistemically ("we can't disprove God"). Requires drilling that modal possibility means world-relative consistency. 
  - During existence derivation: they'll assume Anselm's "existence is perfection" is smuggled in. Show how Gödel bypasses this via essence+necessity.

  The diagnostic exercise should force application to a neutral essence - say "a perfectly efficient Turing machine defined as computing all computable functions in minimal steps". Can they derive its necessary existence given possibility? This tests structural grasp without theological stakes.

  I'll explicitly omit Gödel's notebooks and contemporary debates - these would shift focus from logical mechanics to historical/textual analysis. The framing twist is presenting this as a probe of S5's metaphysical neutrality rather than a theistic proof. This guards against technicians treating premises as arbitrary formal inputs.

