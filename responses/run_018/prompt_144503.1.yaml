answer: |-
  Here are eight focused interview questions with follow-ups:

  1. **Popper argued that historicists illegitimately elevate trends to laws. Aren’t your "local regularities" within institutional frames just trends in fancier clothing?**  
     *If you concede they aren’t predictive laws, what distinct explanatory or constraining force do they actually possess that avoids Popper’s critique?*

  2. **Quantitative history (like cliodynamics) uses data modeling to identify patterns. Is this sophisticated trend-spotting fundamentally historicist, or does its institutional/local scope align with your view?**  
     *When such models claim predictive power (e.g., state instability), doesn’t that resurrect the prophecy Popper condemned, even if probabilistically?*

  3. **You posit necessary constraints on societal evolution across possible worlds. Doesn’t modal necessity reintroduce a form of determinism Popper rejected?**  
     *If these constraints are truly necessary, doesn’t that significantly limit the "open-endedness" of *actual* history you want to preserve?*

  4. **Popper contrasted scientific prediction (testable, conditional) with historicist prophecy (inevitable, unconditional). How do modern forecasting tournaments, testing probabilistic political predictions, affect this distinction?**  
     *Does the success of some conditional, probabilistic forecasts validate a *limited* historicism your local regularities might support, or does it still fall short of laws?*

  5. **If local regularities are bound to specific institutional contexts, how do you explain major institutional change itself without invoking deeper, potentially universal drivers?**  
     *Doesn’t the emergence, transformation, or collapse of the very frames enabling regularities require explanations that might transcend localism?*

  6. **You claim actual history is open-ended, yet constrained modally. Does this imply that while many paths are *possible*, only those respecting your constraints are *viable* long-term?**  
     *Doesn’t equating viability with necessity risk creating a new teleology, where societies *must* evolve within certain bounds to survive?*

  7. **Popper saw historicism as politically dangerous, enabling utopian engineering. Do your local regularities or modal constraints carry similar risks if used prescriptively?**  
     *Couldn't the claim "institutions of type X *necessarily* exhibit regularity Y" be misused to justify imposing or preserving institution X?*

  8. **Does your view genuinely preserve historical branching points, or does it merely prune away branches deemed impossible by your constraints, leaving a narrower but still determined set of paths?**  
     *If the constraints are necessary and pre-select viable futures, is the remaining openness substantial or just epistemic (unknown which viable path is taken)?*
