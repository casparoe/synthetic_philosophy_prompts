  ### Embodied Classroom Exercise: Arrow's Impossibility through the Meridian Committee  
  **Activity Title:** The Meridian Paradox  
  **Setting:** 90-minute seminar for 16 undergraduates in political philosophy.  

  #### **Core Elements**  
  - **Roles:** All 16 students serve as disciplinary delegates (e.g., ethicists, economists, environmental scientists). The facilitator acts as Committee Chair.  
  - **Proposals:** Four real grant proposals—Aurora (quantum ethics), Boreas (arctic policy), Cygnus (AI governance), Draco (wildfire resilience)—and one ineligible "shadow proposal," Echo (deep-sea mining).  
  - **Objective:** Rank proposals via a pairwise tournament to award a single grant.  
  - **Key Mechanism:** Sequential pairwise elimination with a recall clause.  
  - **Payoff Scheme:** Delegates receive "Meridian Tokens" (prestige tokens) for sincere voting. Tokens convert to seminar participation points (e.g., 10 tokens = +1 point).  

  ---

  ### **Rules and Protocol**  
  #### **Preference Distribution**  
  Delegates receive private preference cards (strict rankings) divided into three groups:  
  - **Group 1 (6 delegates):** Aurora > Boreas > Cygnus > Draco > Echo  
  - **Group 2 (5 delegates):** Boreas > Cygnus > Draco > Aurora > Echo  
  - **Group 3 (5 delegates):** Cygnus > Aurora > Boreas > Draco > Echo  

  *Note:* Echo is unanimously ranked last but appears on ballots.  

  #### **Tournament Structure**  
  1. **Round One (Quarter-Finals):**  
     - **Match A:** Aurora vs. Boreas (Echo **absent** from ballot).  
     - **Match B:** Cygnus vs. Draco (Echo absent).  
     - Winners advance; losers enter "reserve pool."  

  2. **Semi-Finals:**  
     - **Match C:** Winner of A vs. Winner of B (Echo absent).  

  3. **Recall Clause Activation:**  
     - If the winner of Match C loses to any proposal in the reserve pool in a pairwise vote, a cycle is confirmed. The defeated proposal re-enters the tournament. Echo is added to all subsequent ballots.  

  4. **Round Two (Re-Run Quarter-Finals):**  
     - **Match D:** Aurora vs. Boreas (Echo **present** on ballot).  
     - *Identical to Match A but with Echo listed as a decoy option.*  

  #### **Voting and Token Allocation**  
  - **Pairwise Ballots:** Delegates allocate 10 tokens between the two proposals (e.g., 7 to Aurora, 3 to Boreas).  
  - **Sincere Payoff Reward:**  
    - If a delegate’s token allocation matches their true preference (e.g., they prefer Aurora > Boreas and allocate more tokens to Aurora), they earn 5 bonus tokens.  
    - Tokens spent on Echo are forfeited (simulating wasted votes).  
  - **Winner Determination:** Proposal with the most tokens wins each match.  

  #### **Guaranteeing Reversal**  
  - **Round One (Aurora vs. Boreas, Echo absent):**  
    - Group 1 and Group 3 prefer Aurora > Boreas → allocate more tokens to Aurora.  
    - Group 2 prefers Boreas > Aurora → allocate more to Boreas.  
    - **Result:** Aurora wins (11 delegates favour Aurora).  
  - **Round Two (Aurora vs. Boreas, Echo present):**  
    - **Group 2 strategically defects:** Fearful that Echo might split votes, they over-allocate tokens to Boreas (e.g., 10 tokens to Boreas, 0 to Aurora/Echo) to secure its win.  
    - Group 1 and 3 vote sincerely (more tokens to Aurora), but Group 2’s intensity shifts the balance.  
    - **Result:** Boreas wins (Group 2’s 50 tokens outweigh Group 1 and 3’s 45 tokens to Aurora).  
  *Crucially, no delegate changes their underlying Aurora/Boreas preference—only their token allocation shifts due to Echo’s presence.*  

  ---

  ### **Timeline (90 Minutes)**  
  - **0:00–0:15:** Chair explains rules, distributes preference cards and tokens.  
  - **0:15–0:30:** Round One voting (Matches A and B).  
  - **0:30–0:45:** Semi-Final (Match C) and cycle test (winner vs. reserve pool).  
    - *Cycle detected: Winner of Match C (Cygnus) loses to Boreas in reserve pool.*  
    - **Recall clause triggered:** Boreas re-enters; Echo added to ballots.  
  - **0:45–1:00:** Round Two voting (Match D: Aurora vs. Boreas + Echo).  
  - **1:00–1:15:** Final ranking announced. Token rewards distributed.  
  - **1:15–1:30:** Structured debrief.  

  ---

  ### **Predicted Pitfalls and Facilitator Response**  
  - **Pitfall:** Delegates (especially Group 2) may resist the recall clause or strategically alter preferences to "fix" the reversal.  
  - **Facilitator Response:**  
    - "The recall clause is a binding procedural rule. Focus on allocating tokens based on your true preferences."  
    - "Echo’s ineligibility does not change your duty to prioritise real proposals."  
    - *Avoid explaining the paradox; let the reversal emerge organically.*  

  ---

  ### **Debrief: Mapping to Arrow’s Theorem**  
  **Arrow’s Conditions:**  
  1. **Unrestricted Domain:** Delegates held diverse, valid preferences.  
  2. **Pareto Efficiency:** If all prefer X > Y, X must rank higher.  
  3. **Independence of Irrelevant Alternatives (IIA):** Social ranking of X vs. Y should not change if an irrelevant alternative (e.g., Echo) is added.  
  4. **Non-Dictatorship:** No single delegate dictates the outcome.  

  **How the Activity Violates IIA:**  
  - In Round One (no Echo), Aurora > Boreas.  
  - In Round Two (Echo present), Boreas > Aurora—*despite identical preferences for Aurora/Boreas*.  
  - The committee **abandoned IIA** because Echo’s presence altered voting behaviour, violating Arrow’s condition that irrelevant alternatives should not affect rankings.  

  **Why This Was Unavoidable:**  
  - With ranked preferences and a recall clause, the system structurally required delegates to overcompensate for Echo, breaking IIA to resolve the cycle. Non-dictatorship and Pareto efficiency were preserved, but unrestricted domain (full preference flexibility) made the cycle inevitable.  

  **Limitations and Honesty:**  
  - The activity **cannot** prove Arrow’s result for all preference profiles or >3 alternatives. Here, we used a curated profile and four proposals.  
  - **Facilitator Must Clarify:** "This illustrates one instance of cyclic preferences. Arrow proved *no voting system* can satisfy all four conditions universally. The reversal you experienced stems from sacrificing IIA—a compromise all real voting systems must make."  

  ---

  ### **Concluding Notes**  
  - **Token Reconciliation:** Delegates receive tokens for sincere voting (verified against preference cards). Highest token-holders earn public commendation.  
  - **Pedagogical Goal:** Students experience IIA violation as a lived contradiction, not an abstraction. The "Meridian Paradox" becomes a visceral example of democracy’s inherent trade-offs.  

  This design meets your specifications while adhering to British English conventions. The activity’s success hinges on strict adherence to the recall clause and the facilitator’s restraint in not pre-empting the reversal.
