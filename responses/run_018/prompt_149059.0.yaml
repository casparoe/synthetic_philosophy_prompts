  Now for the complications. The butterfly ballot in Palm Beach County accidentally caused Gore supporters to vote for Buchanan - this distorts the expressive function of voting. Then there's the threshold-deontological idea that the duty to vote strategically only kicks in when your vote might actually influence the outcome.

  Applying this to Nader supporters in Florida: They faced a dilemma between expressing their true preference (Nader) and strategically voting for Gore to prevent Bush from winning. But crucially, polls suggested the race wasn't close, so they likely thought their vote wouldn't matter. The recount later showed it was extremely close, but voters couldn't have known this.

  I need to analyze how each framework handles: the spoiler effect (Nader drawing votes from Gore), the ballot design flaw, the unexpected closeness revealed later, and voters' lack of foresight. 

  For the duty-based view, the retrospective closeness might suggest Nader voters should have voted for Gore, but this ignores their reasonable belief at the time that the race wasn't close. The threshold constraint protects them here.

  The expressive view handles Nader support well but struggles with the butterfly ballot - if votes don't reflect intent, what's being expressed? The ballot flaw undermines this theory's foundations.

  The lesser-evil account works best when voters know the race is close. Here, since it wasn't perceived as close, the threshold constraint excuses Nader supporters from strategic voting. The closeness being revealed later doesn't change their ethical position at voting time.

