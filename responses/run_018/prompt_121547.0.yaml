prompt: |-
  I sit on the ethics consultation committee at a mid-sized community hospital, and we've slowly accumulated a track record on advance directives without ever agreeing on what we actually think we're doing, so I want to use our own precedents rather than general principles. Assume for the sake of the question that our state's advance directive statute doesn't settle any of these cases and that nobody is suing anybody: I want to know what we'd be committing to, not what the law requires. Please answer in American English.

  Here are our rulings so far, more or less as they were recorded. (1) Mr. Alvarez, diagnosed with early Alzheimer's, signed a directive while he still had documented capacity saying no antibiotics once he no longer recognized his family; two years later, at that point, cheerful and seemingly content, he got pneumonia and we honored it and he died. (2) Ms. Byrne, severe anorexia, no written directive but three years of telling her therapist she'd never accept a feeding tube, all of it said while she was dangerously underweight; we judged her to lack capacity for the decision and fed her over her objection, and she later thanked us. (3) Mr. Okonkwo signed a written directive refusing blood products as a devout believer; after a stroke at 70 he developed apathy, drifted away from his church, and when asked about the directive sort of shrugged and said he didn't care anymore; we treated that as no revocation at all and honored the document. (4) Ms. Lindqvist, bipolar, wrote a Ulysses-style directive while well saying that if she became manic she should be admitted and medicated even over her protest; when a manic episode arrived she was euphoric, hugely productive, and reasoning perfectly well about everything except her own need for treatment, and we honored it anyway. (5) Mr. Rasmussen signed a formal directive to stop dialysis during a severe depressive episode while technically retaining capacity; after ECT he said he wanted to live and was grateful to still be here, and we kept dialyzing him, on the grounds that the document was a product of the depression. I can think of at least two rules that fit all five — something like "a written directive binds unless there's a later competent statement aimed squarely at it," and something like "the self whose judgment about this wasn't distorted by the relevant condition gets to speak, whenever that self existed" — and I'm sure there are others, which is exactly my problem.

  The new case is what set us off. Ms. Iversen is 71 with moderate Alzheimer's, no statutory advance directive and no named proxy. Eighteen months ago, while fully competent, she took part in a research study at our hospital in which she answered a few hundred hypothetical treatment scenarios; from her answers the team built an algorithmic "values profile," went through it with her, and she signed a one-page statement saying that if she can't decide for herself the team should use the profile — informal, not on the state form, no proxy named. She's now fractured her hip. The choice is surgery plus months of painful rehab versus palliative management. She currently says, cheerfully, that she wants the operation and then she'll go home, and geriatrics says she probably does pass the standard capacity test for this decision: she understands, retains, weighs, communicates. The profile, built from her competent answers, confidently predicts she'd refuse surgery in exactly this scenario, because while competent she was extremely averse to dependence and institutional care and had said she'd rather die than end up in a nursing home; the surgery is roughly a coin flip between independent living and permanent nursing home placement. Her daughter wants palliation, her son wants surgery, and one of our members points out that people answer hypotheticals differently than they decide in the moment, so the profile may just capture a hypothetical version of her. I was arguing about this with a friend who does estate planning and she thought the answer was obvious, which is how I know it isn't.

  So: what rules are actually consistent with our five prior rulings, what does each of them say about Ms. Iversen, and what's your best guess at what we should decide if we want to be consistent with ourselves? Which of the five is the closest analog and why? What principle would we be adopting with each option, stated plainly enough that we could see whether we want to own it next time? And which further case — not just a harder version of this one — would actually tell the competing rules apart? One more thing: our geriatrician keeps framing the whole thing as a fight between what she calls precedent autonomy and the welfare of the person who is definately in the bed right now, but I have a suspicion that's not the real axis and that we may be asking two different questions under one heading, one about whose values count and one about who is best placed to know them. Tell me if that's right, and please write your answer in American English.
reasoning: |-
  Okay, this is a fascinating ethics consultation case that requires careful analysis of the hospital's precedents to determine a consistent approach for Ms. Iversen's situation. The user is on an ethics committee that's accumulated five prior rulings on advance directives without a clear unifying principle, and now needs to apply that pattern to a novel case involving an algorithmic values profile.

  First, I need to understand what connects their prior decisions. Looking at the five cases: Alvarez honored a written directive even when the patient seemed content; Byrne overrode verbal refusals from someone with distorted judgment due to anorexia; Okonkwo upheld a directive despite current apathy; Lindqvist enforced a Ulysses pact during mania; Rasmussen voided a directive signed during depression. 

  The common threads appear to be: 1) Prioritizing decisions made when judgment wasn't impaired by the relevant condition 2) Requiring clear revocation by a competent self 3) Distrusting choices distorted by mental states. The "values provenance" concept seems key - where did the preference originate?

  For Ms. Iversen, we have a competent-self preference (the algorithm) versus current competent-but-demented preference. The closest analog is Okonkwo - both involve preserved capacity but disconnected values due to neurodegenerative change. The algorithm represents her core values about independence, while her current self has Alzheimer's-induced value drift.

  The competing consistent principles I see are: 
  A) Strict precedent autonomy (favor the profile like in Alvarez/Okonkwo) 
  B) Current welfare with strict distortion test (like Byrne/Rasmussen, but here capacity is intact so it would favor surgery) 
  C) Values provenance (which self's judgment was formed without impairment? The profile wins)

  I think C best explains all five precedents. For Ms. Iversen, that means honoring the profile since it captures her unimpaired values about nursing homes. The geriatrician's "precedent autonomy vs current welfare" frame misses that we're really asking which version of her values should govern when both exist but conflict.

  To test these principles, imagine a future case where a patient's competent directive conflicts with their longstanding pre-illness religious values - that would force a choice between written formality and values provenance.

  The ethics committee should probably honor the values profile here to stay consistent, while acknowledging the daughter's request aligns with what Ms. Iversen truly valued at her most authentic. The key is recognizing Alzheimer's distorts values even when capacity remains technically intact.
answer: |-
  Based on your five precedents, here's a breakdown of consistent rules, their application to Ms. Iversen, the closest analog, principles involved, and a test case to differentiate them:

  **Consistent Rules & Application to Ms. Iversen:**

  1.  **Rule: "Honor the directive reflecting the authentic, unimpaired self's judgment about the *specific threat*, unless the *current* self possesses capacity and clearly revokes it."**
      *   *Application to Iversen:* Honor the values profile. It was created competently to address *exactly* the scenario she now faces (loss of independence/nursing home risk). Her current "cheerful" assent doesn't reflect a clear revocation of her prior, well-considered values regarding dependence; it reflects Alzheimer's-related impairment in projecting consequences and connecting current choices to her core values (fear of institutionalization). Surgery might violate her deeply held, competent-self judgment.
      *   *Principle Adopted:* **Values Provenance.** The controlling decision is the one made by the self whose judgment was *not impaired by the condition triggering the decision* (dementia in Alvarez/Okonkwo/Iversen, mania in Lindqvist, depression in Rasmussen, anorexia in Byrne). Formality (written vs. verbal) is secondary evidence of the authentic self's intent. The "authentic self" is defined by the absence of the distorting condition when the preference was formed.

  2.  **Rule: "A formally documented preference binds unless revoked by a later competent statement directly addressing it."**
      *   *Application to Iversen:* The values profile is informal. While signed, it's not the statutory form and doesn't name a proxy. Her current competent statement ("I want surgery") is a direct revocation of the profile's predicted refusal *for this specific decision*. Therefore, perform surgery.
      *   *Principle Adopted:* **Formal Document Primacy.** Legally recognizable formalities (statutory forms, clear proxy appointments) create strong presumptions. Informal expressions of values (like the profile or Byrne's verbal statements) carry less weight and are easily overridden by a current competent decision, even if seemingly contradictory to past values. The focus is on the *document's status*, not the origin of the values.

  3.  **Rule: "Uphold the directive unless the *current* patient has capacity for the decision *and* there's no evidence their current judgment is impaired *by the relevant condition* in a way that distorts *this specific choice*."**
      *   *Application to Iversen:* Geriatrics says she has capacity *now*. The relevant condition is Alzheimer's. Does it distort *this specific choice*? She understands surgery/rehab *in theory*, but the core conflict is between her current, illness-influenced minimizing of future dependency ("go home") vs. her prior, unimpaired dread of it. The profile demonstrates her competent self *knew* she'd likely minimize future consequences later. Her Alzheimer's *is* distorting her ability to weigh the long-term outcome (nursing home) she feared most. Therefore, honor the profile.
      *   *Principle Adopted:* **Condition-Specific Capacity Assessment.** Capacity isn't just global or for the immediate decision mechanics; it must be evaluated for whether the *specific illness* impairs the ability to weigh the *specific values and consequences* central to the choice. The "unimpaired self's" view is evidence of those core values/consequences.

  **Analysis & Recommendation:**

  *   **Closest Analog:** **Mr. Okonkwo (Case 3)** is the strongest parallel.
      *   *Why:* Both involve progressive neurodegenerative disease (Alzheimer's). Both had competent, formalized directives (written refusal/values profile) expressing core values (faith/independence). Both later developed apathy/disconnection from those core values due to the disease ("shrugs"/"cheerfully" minimizes future dependency). Your committee honored Okonkwo's directive despite his current indifference. Similarly, Ms. Iversen's profile reflects her core value of independence; her current cheerfulness and inability to connect surgery to the nursing home outcome she feared mirrors Okonkwo's apathy towards his faith.
  *   **Your Suspicion is Correct:** The geriatrician's "precedent autonomy vs. current welfare" frame is incomplete and potentially misleading.
      *   **Axis 1: Whose Values Count?** Your precedents consistently prioritize the values of the **authentic, unimpaired self** (Alvarez, Okonkwo, Lindqvist, Rasmussen) over values expressed under distortion (Byrne, Rasmussen's directive). The "current welfare" considered in Byrne and Rasmussen was defined *by the unimpaired self's* likely future perspective ("she later thanked us," "he was grateful").
      *   **Axis 2: Who Knows the Values Best?** This is about the **provenance and reliability** of the expression. Your committee trusts:
          *   Written directives over inconsistent verbal statements (Alvarez, Okonkwo vs. Byrne).
          *   Decisions made *outside* the distorting illness episode (Lindqvist directive, Rasmussen's post-ECT view, Iversen's profile) over those made *during* it (Lindqvist's mania, Rasmussen's directive, Iversen's current "cheerful" assent).
          *   Explicit, considered instructions (Alvarez, Okonkwo, Lindqvist) over inferred preferences, unless capacity is clearly lacking *and* welfare is dire (Byrne).
      *   **Ms. Iversen:** The fight isn't autonomy vs. welfare. It's **which version of Ms. Iversen's autonomy governs:** her unimpaired self's deeply held, considered values about dependence (captured in the profile), or her current impaired self's situationally influenced, potentially unrealistic preference. Her "welfare" is ambiguous – surgery might grant more time but violate her core identity, while palliation might honor her identity but shorten life.
  *   **Best Guess for Consistency:** **Honor the values profile.** This best aligns with:
      1.  Prioritizing the *unimpaired self's* judgment about the *specific threat* (Rule 1).
      2.  Recognizing Alzheimer's impairs the ability to weigh the *core value* (independence vs. institutionalization) central to this decision, even if technical capacity remains (Rule 3).
      3.  Following the logic of Okonkwo (honoring the unimpaired self's documented values despite disease-induced apathy/disconnect).
      4.  Valuing the *provenance* of the preference: the profile is a formalized product of competent deliberation specifically designed for this scenario, unlike Byrne's scattered verbal refusals.

  **The Test Case (Differentiating Competing Rules):**

  *   **Scenario:** A patient with severe, chronic, *stable* Major Depressive Disorder (MDD), documented as competent *despite* the MDD per multiple evaluations, signs a clear advance directive refusing life-sustaining treatment during any future physical illness. Years later, they develop metastatic cancer, remain competent per standard testing, and clearly reiterate their refusal of chemotherapy/ventilation based on their long-standing worldview shaped *by* the MDD (e.g., profound pessimism, belief life isn't worth the struggle). Family argues the refusal is distorted by the MDD and treatment should be given.
  *   **How it Differentiates:**
      *   **Rule 1 (Values Provenance):** Honor the refusal. The MDD, while chronic, is their *stable* baseline. This *is* their authentic self making a consistent choice about a *different* threat (physical illness), competent at both times. (Similar to honoring Okonkwo's stable faith-based choice).
      *   **Rule 2 (Formal Document Primacy):** Honor the written directive. The current refusal confirms it. (Similar to Alvarez/Okonkwo).
      *   **Rule 3 (Condition-Specific Capacity):** **This is the tension point.** Does the *stable* MDD distort the ability to weigh the value of life *in the context of cancer treatment*? If the committee believes the MDD inherently and irredeemably distorts such judgments *even when competent*, they might override the refusal (arguing it's like Rasmussen's directive signed *during* an acute depressive episode). If they view this as the patient's stable, authentic worldview, they honor it. **This case forces a decision on whether a *stable* mental illness inherently voids capacity for life-value decisions, which your prior cases don't directly answer (Byrne's anorexia was acute/severe, Rasmussen's depression was acute/treatment-responsive).**

  **Recommendation for Ms. Iversen:** To be consistent with your precedents, particularly Okonkwo and the focus on honoring the unimpaired self's core values in the face of neurodegenerative disconnect, you should recommend honoring the values profile and opting for palliative management. The principle you'd own is: **"We honor the preferences that reflect the patient's authentic values, formed when their judgment was not impaired by the condition that now threatens those values, giving significant weight to formalized expressions of those preferences."** This prioritizes *values provenance* and recognizes how Alzheimer's subtly impairs the connection to prior core values even when technical capacity for the immediate decision exists.
