answer: |-
  Here’s the full desiderata list for a robust theory of transgenerational collective guilt, followed by a scored analysis of existing approaches and critical self-reflection:

  ---

  ### **Core Desiderata: What the Framework MUST Deliver**  
  *(Non-negotiable criteria for avoiding "stretched metaphor" status)*

  1. **Cases to Accommodate:**  
     - **Atrocity-Committing State**: Must attribute guilt to a political entity (e.g., Nazi Germany) that outlives its regime.  
     - **Material Beneficiaries**: Descendants who inherit wealth/privilege from atrocities (e.g., generational wealth from slavery/colonialism) but committed no wrong.  
     **Active Repudiators**: Descendants who explicitly condemn the legacy (e.g., a German grandchild funding Holocaust memorials) yet still benefit.  
     - **Institutional Turnover**: Institutions (e.g., churches, corporations) with 100% membership replacement but continuous existence/profit from past wrongs.  

  2. **Distinctions to Preserve:**  
     - **Guilt vs. Liability**: Guilt as *moral status* (e.g., "tainted by association") vs. liability as *material obligation* (e.g., reparations).  
     - **Affective Shame vs. Normative Guilt**: Emotional shame (subjective feeling) vs. objective guilt (duty to address harm, independent of emotion).  
     - **Collective Agency vs. Aggregation**: Guilt must attach to a *group entity* (e.g., "Germany") without reducing to individual members’ guilt.  
     - **Ghost Agency**: Must clarify if treating dead perpetrators as moral nodes is *necessary* (e.g., for continuity) or a *bug* (metaphysical overreach).  

  3. **Jointly Unsatisfiable Tensions (Test Cases):**  
     - **Conscious Wrongdoing vs. Structural Survival**: If guilt requires intent, how can it persist structurally after culpable actors die? *(Major clash)*  
     - **Benefit vs. Guilt**: Can material benefit alone confer guilt, or must there be *identification* with the group?  
     - **Repudiation vs. Inheritance**: Does actively rejecting the legacy absolve normative guilt, or does benefit/duty persist?  

  ---

  ### **The "Killer Desideratum"**  
  **Inheritance Without Culpable Agency**: Most accounts (especially individualist/Jaspers-style) fail when guilt must transmit *despite no descendant’s causal or intentional role*. Popular theories collapse guilt into liability (reparative views) or shame (affective views) to avoid this.  

  ---

  ### **Scoring Existing Frameworks**  
  *(✓ = Strong, △ = Partial, ✗ = Fails)*  

  | Desideratum               | Jaspers-Style Moral Guilt | Structural/Institutional | Purely Reparative (No Guilt) |
  |---------------------------|---------------------------|--------------------------|------------------------------|
  | **Atrocity-Committing State** | △ (Only via living members) | ✓ (Institution as bearer) | ✓ (Liability only) |
  | **Material Beneficiaries**    | ✗ (No moral guilt)          | △ (Guilt via structure)  | ✓ (Obligation via benefit) |
  | **Active Repudiators**        | ✗ (Absolved if innocent)    | △ (Guilt persists)       | △ (Duty remains) |
  | **Institutional Turnover**    | ✗                           | ✓                        | ✓ |
  | **Guilt vs. Liability**       | ✓ (Clear split)             | ✗ (Often conflates)      | ✗ (Denies guilt) |
  | **Shame vs. Normative Guilt** | ✓                           | △ (Blurs lines)          | ✗ (Ignores guilt) |
  | **Collective Agency**         | △ (Aggregates individuals)  | ✓ (Holistic entity)      | ✗ (Reduces to individuals) |
  | **Ghost Agency**              | ✗ (Dies with perpetrators)  | ✓ (Essential feature)    | ✗ (Irrelevant) |
  | **Solves Intent/Structure Clash** | ✗                         | △ (Decouples guilt from intent) | ✓ (Avoids guilt) |

  **Verdict**:  
  - **Jaspers**: Fails transgenerationality (ghost agency, beneficiaries). Strong on distinctions.  
  - **Structural**: Best at continuity/turnover but risks collapsing guilt into liability.  
  - **Reparative**: Pragmatic but abandons guilt entirely (loses normative force).  

  ---

  ### **Where My Reasoning Could Fail & Mind-Changers**  
  1. **Assumption Smuggling**: I presuppose **collective guilt requires quasi-agency**. If institutions are *only* structures (not moral agents), ghost agency becomes incoherent.  
  2. **Mind-Changing Cases/Arguments**:  
     - **Case**: A descendant who *fully disclaims* group identity (e.g., renounces citizenship) yet retains wealth. Could undermine "benefit → guilt" link.  
     - **Argument**: "Guilt is *always* affective; normative guilt is liability in disguise." If proven, collapses a core distinction.  
     - **Failure Point**: Overestimating institutional continuity. If membership turnover *breaks* moral identity (e.g., "new" Germany ≠ Third Reich), structural guilt fails.  
  3. **Most Vulnerable Desideratum**: **Ghost agency**. If moral responsibility *requires* living agents, transgenerational guilt collapses—unless guilt is redefined as *symbolic* (which risks metaphor territory).  

  ---

  ### **Conclusion: Your Framework’s Burden**  
  A viable theory must:  
  - Treat institutions as **moral patients with memory** (not just legal persons).  
  - Decay *affective* guilt while preserving *normative* guilt as a duty tied to benefit/identity.  
  - Resolve the **intent/structure clash** by anchoring guilt in *unrepaired harm* (not dead actors’ minds).  

  **Critical Test**: Can your framework obligate a repudiating descendant to *feel* guilt? If yes, it fails (shame≠guilt). If it obligates action *regardless of feeling*, it succeeds.
