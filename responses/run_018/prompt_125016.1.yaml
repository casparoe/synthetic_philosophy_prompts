prompt: |-
  i'm writing my diss on collective responsibility but i'm stuck on framing. i want the full spec for what a theory of transgenerational collective guilt actually has to deliver if it's not just a metaphor stretched too thin. jaspers split guilt into criminal/political/moral/metaphyiscal but never really solved how it survives the death of the guilty generation, so i'm trying to build a framework where guilt has an institutional half-life that decays differently from legal liability — but before i commit i need to know what that framework can't drop.

  write the desiderta: what cases must it accomodate? (the state that committed atrocities, descendants who benefit materially, descendants who actively repudiate the legacy, institutions with complete membership turnover) what distinctions can't it collapse? (between being guilty vs being liable, affective shame vs normative guilt, collective agency vs statistical aggregation, and whether ghost agency — treating dead perpetrators as still nodes in the moral network — is a feature or a bug). also flag any jointly unsatisfiable pairs: e.g., if guilt requires conscious wrongdoing but also survives structurally across generations, do those clash? and tell me which single desideratum kills the most popular accounts.

  briefly score jaspers-style moral guilt, a structural/institutional account, and a purely reparative no-guilt view against the list. but keep weight on the criteria.

  finally, say what would change your mind: which argument or case would make you think one of these desiderata is actually a prejudice, and where your reasoning here is most likely to fail? also please flag if you're just smuggling in an assumption about group agency that isn't earned.
