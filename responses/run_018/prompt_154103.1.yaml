prompt: |-
  I have been thinking independently about cognition, and I keep returning to the idea that analogical reasoning is not a peripheral teaching trick but the central mechanism by which people understand anything they have not encountered before. I want to lead a single ninety-minute session for three non-specialists—a mechanical engineer, a visual artist, and a high-school literature teacher—none of whom have studied cognitive science, though all can follow abstract argument. I am not asking you to explain the view associated with Hofstadter and Sander to me; I need a concrete teaching plan. First, lay out the exact dependency order: what idea must be firmly in place before I introduce relational mapping across domains, and why must the distinction between surface resemblance and deep structural correspondence come before any concrete case rather than after? Second, propose or adapt one carrying scenario in which a person recognizes a complex social or mechanical pattern in an entirely unfamiliar domain despite zero shared surface features and no specialized vocabulary; it must work equally for visual and verbal thinkers, and it should contain a hidden “inversion” where high surface similarity actually points to the wrong relational mapping, so the group sees analogy fail as well as succeed. Third, map the four predictable misconceptions—(1) that analogy is only a pedagogical metaphor, (2) that it requires conscious deliberate effort, (3) that if it is “core” then logical rules and categories disappear, and (4) that mental imagery is the same phenomenon—and specify the precise point in the sequence where each should be headed off. Fourth, give me one closing question that distinguishes whether they grasp analogical projection of relations from whether they simply agree that analogies are “nice” or useful. Fifth, state explicitly what I should openly refuse to cover—formal structure-mapping algorithms, neural implementation, and whether this framework extends to formal mathematical reasoning—and explain why leaving these out protects the session’s coherence rather than weakening it. Keep the response under 350 words. Separate what is well-established about analogy’s importance in human reasoning from what remains genuinely contested, especially whether analogy literally constitutes all conceptual thought or functions as one dominant mechanism among others, and do not present the stronger constitutive claim as settled consensus.
reasoning: |-
  Okay, let me tackle this complex teaching design request step by step. The user wants a tightly structured 90-minute session on analogical reasoning as central to cognition, with very specific constraints. 

  First, I need to establish the dependency order carefully. The distinction between surface features and structural relations must come first because without that foundation, participants will misinterpret every example. They'll likely fixate on superficial similarities like shape or color rather than relational patterns. 

  For the carrying scenario, I'm considering adapting the "military invasion as disease spread" example. It works visually (map animations) and verbally (narrative descriptions), contains surface traps (e.g., troop uniforms vs. virus appearance), and has that crucial inversion where similar symptoms might map to opposite strategic outcomes. 

  The misconceptions need precise timing:
  - The "pedagogical tool" myth must be dispelled right after defining analogy, before case studies
  - "Conscious effort" misconception should be addressed when discussing how we constantly make unconscious analogies
  - The false dichotomy with logic/categories comes up when showing how both coexist
  - Mental imagery confusion gets clarified during the visual example demonstration

  The closing question needs surgical precision - perhaps asking them to generate a novel analogy predicting outcomes in a new domain, which tests relational projection ability. 

  I'll explicitly exclude neural mechanisms and formal math extensions because they're tangents that would derail the conceptual focus. The contested/constitutive claim distinction is crucial - I'll position analogy as dominant but not exclusive to avoid overstatement.

  The session structure should flow: concept foundation → failure/success demonstration → misconception busting → application test. Keeping it under 350 words means every element must pull double duty.
answer: |-
  Here’s your concrete 90-minute teaching plan:

  **Dependency Order**  
  1. **Core Definition**: Start with "Analogy = mapping relational structure (not surface features) from a familiar domain (source) to a novel one (target)." *Why first?* All later examples depend on recognizing relations as distinct from superficial traits.  
  2. **Surface vs. Structure**: Contrast e.g., "bicycle chain" (surface: metal loops) vs. "crowd flow" (structure: linked movement). *Before cases* to prevent misattribution during exercises.  
  3. **Relational Mapping**: Only then demonstrate cross-domain transfer (e.g., your carrying scenario).  

  **Carrying Scenario: "Spread Mechanisms"**  
  - **Source**: Epidemic contagion (familiar to all). *Structure*: Index case → transmission vectors → superspreader events → containment zones.  
  - **Target**: Cyberattack on power grid (unfamiliar). *Structure*: Initial breach → lateral movement → critical node compromise → segmentation defenses.  
  - **Inversion Trap**: High surface similarity—"virus symptoms resemble corrupted data alerts." *Wrong mapping*: Treating alerts as "symptoms" (effect) misses that alerts are *defensive signals* (unlike passive symptoms), inverting cause/effect relations.  

  **Misconceptions & Timing**  
  1. "Only pedagogical": Counter *after defining analogy* by noting spontaneous real-world use (e.g., "This traffic jam is like clogged arteries!").  
  2. "Requires effort": Preempt *during mapping demo* by asking when they last unconsciously used analogy (e.g., "This feels like déjà vu").  
  3. "Eliminates logic/categories": Address *post-inversion* by showing structural alignment *uses* logic (e.g., inference: containment → segmentation).  
  4. "Same as imagery": Clarify *during visual artist’s contribution*—ask if they can map relations *without* images (e.g., "justice is blind" → no visual component).  

  **Closing Question**  
  *"How would you explain a library database to a farmer using *only* relational parallels to farming—without mentioning books, computers, or fields?"* (Tests projection of relations like planting/harvesting ↔ data entry/retrieval.)  

  **Explicit Omissions & Why**  
  - **Formal algorithms** (too technical), **neural implementation** (distracts from cognitive mechanism), **math reasoning** (debated scope). Exclusion maintains focus on *core cognitive phenomenon* without technical overload.  

  **Contested vs. Established**  
  - **Established**: Analogy is fundamental to learning, abstraction, and innovation; operates unconsciously; relies on relational structure.  
  - **Contested**: Whether it constitutes *all* conceptual thought (e.g., vs. embodied cognition) or is dominant among multiple mechanisms (e.g., prototype-based categorization).
