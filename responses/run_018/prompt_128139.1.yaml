answer: |-
  Here are five numbered points addressing the query:

  1.  This framing rejects anthropocentric historiography by distributing agency across human and non-human *actants*, attributing causal efficacy without necessarily requiring literal intentionality; it operates as a methodological heuristic emphasizing complex networks over discrete causes.
  2.  It presupposes a relational ontology where historical causation emerges from interactions within heterogeneous networks, displacing humans as the sole historical drivers while resisting environmental determinism by maintaining the network's irreducible complexity.
  3.  Moral responsibility becomes diffused and systemic, shifting focus from individual blame toward institutional structures and material conditions that shape vulnerability within these networks, complicating direct attribution.
  4.  Replacing this with strict human-centrism would necessitate revising exhibits/reports to frame non-human forces solely as context or passive backdrop, attributing collapse solely to human decisions, institutional failures, or technological shortcomings.
  5.  Concrete revisions under human-centrism would include re-assigning blame exclusively to human actors/institutions, redefining vulnerability as primarily resulting from human choices or social inequities (downplaying material constraints), and depicting societal collapse as a consequence of human error or mismanagement alone.
