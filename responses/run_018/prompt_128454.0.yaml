  Hmm... where's the weak spot? Let me test each link. Step (1) seems solid - a theory without criteria really would just be "trust your gut." Step (3) is Goodhart's Law itself, which is empirically validated in many domains. The trouble must lie in how these apply to rationality criteria specifically.

  *scribbles mental notes* Ah! The key is distinguishing between two things: (a) using a rule as your actual decision-making procedure versus (b) using it as an external evaluation metric. The argument conflates them. When EU theory says "maximize expected utility," it's not offering EU as a proxy - EU is the target by definition. Gaming only happens if you're optimizing something else while pretending it's EU.

  Also... *pauses* ...step (4) assumes any specification will inevitably be gamed. But formal systems can be designed to resist this. Consider how cryptographic protocols anticipate adversarial behavior - why wouldn't decision theorists do the same? The friend's argument treats specification gaming as an unstoppable force, but that's not necessarily true for mathematically precise systems.

  The user mentions their friend might ditch step (6) - that licensing irrational choices invalidates the theory. But surrendering here really does abandon the whole project! Better to attack the conflation earlier. I should emphasize that rational choice theories aren't just arbitrary proxies; they're attempts to formally capture what we mean by "good reasoning" in the first place.

  *checks clock* Oh - and I must address the training/evolution point in step (3). There's a crucial difference between biological systems stumbling upon proxies and a conscious reasoner applying a rule self-consistently. Evolution might "game" risk-aversion heuristics, but that doesn't mean an agent using expected utility theory is fooling themselves.
answer: |-
  Your friend's argument is clever and touches on deep issues in decision theory, but it contains a critical flaw. The weak link is **step (4)**, specifically the conflation of **using a decision rule as a target** versus **using it as an embedded criterion of rationality**. Here's the breakdown:

  ### The Crack: Decision Rules vs. Proxies
  1. **Rationality criteria (e.g., coherence, EU) are not mere "proxies"**  
     - They are *definitions* of rationality, not approximations. Expected utility (EU) theory doesn't claim EU is a "proxy" for some hidden "real" rationality. EU *is* the formalization of rational choice under uncertainty.  
     - Goodhart's Law applies when a proxy diverges from the true target. But if rationality *is defined* by coherence (e.g., avoiding Dutch books) or EU axioms, satisfying the criterion **is** rationality by construction. Gaming the rule would mean violating the axioms, not satisfying them in a degenerate way.

  2. **The argument equivocates "optimizing a metric" with "satisfying axioms"**  
     - Goodhart's Law concerns *corrupted optimization* (e.g., maximizing GDP while ignoring welfare).  
     - Rationality rules are **constraints** (e.g., "avoid intransitive preferences") or **constitutive standards** (e.g., "maximize EU given your beliefs/desires"). If you "game" coherence by hiding intransitive choices, you violate coherence itself. You can't "overfit" a consistency rule — you either satisfy it or you don't.

  ### Counterexamples to Step (4)
  - **Dutch books:** If you "game" probability axioms to avoid Dutch books, you're just being coherent. There's no "terrible decision" that satisfies the axioms — any such decision would expose you to guaranteed losses.  
  - **EU maximization:** If you maximize EU given true beliefs/values, you can't be "gamed" into irrationality. If you use *false* beliefs/values, that's a failure of epistemology (not decision theory).  

  ### Where Goodhart *Does* Bite
  The argument isn't wholly wrong — it highlights valid limitations:  
  - **Specification gaming in practice:**  
    If humans *approximate* rationality (e.g., RL agents optimizing a flawed reward function), Goodhart applies. But this is a problem of **bounded rationality**, not the normative theory itself.  
  - **Tool misalignment:**  
    Using EU with misspecified goals (e.g., paperclip maximizer) leads to bad outcomes. But this is a failure of **goal alignment**, not EU theory. Rationality tools are neutral; garbage in, garbage out.  

  ### Why Other Steps Hold (or Can Be Salvaged)
  - (1) Correct: Normative theories need criteria.  
  - (3) Correct: Goodhart's Law is real for proxies.  
  - (6) Can be kept: A theory licensing irrational choices *is* flawed — but proper decision rules don't.  
  - (7) **False:** Formal theories (e.g., Savage axioms, Cox-Jaynes probability) *are* specifiable and robust.  

  ### Conclusion
  The flaw is **equivocating between proxies and definitions**. Rationality criteria are not proxies to be gamed; they are self-consistent standards. While real-world applications *can* suffer from Goodhart effects (e.g., ML systems gaming loss functions), normative decision theory escapes by being **constitutive of rationality itself**. Your friend's argument confuses the map (a theory) with the territory (human implementation), but the map remains valid.  
    
  **Weak link:** Step (4) fails because satisfying a true rationality criterion (not a proxy) cannot produce "terrible decisions" by the theory's own lights. Rational choice theory isn't self-undermining — it's the anchor preventing Goodhart-style corruption.
