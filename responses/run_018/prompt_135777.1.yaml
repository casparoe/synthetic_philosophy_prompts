prompt: |-
  hey, can you help me draft opening remarks for a workshop i'm running next thursday? it's called Consciousness and Computation: Where the Illusion Breaks, and the room is gonna be split — philosophers of mind on one side (some hardline illusionists like me, some realists who think there's genuinely something it's like to be a bat) and cognitive scientists / ML people on the other who mostly talk about global workspace or information integration.

  i want the speech to actually do philosophical work, not just decorate the event. my view is that phenomenal consciousness isn't some mysterious extra property; it's an introspective representational misfire. the brain builds this user-interface model — a kind of inner-screen representation for navigation — and then we systematically misread that representation as an intrinsic, non-physical phenomenal glow belonging to the system itself. so the hard problem isn't hard, it's misdirected: there's no qualia to explain, just a persistent misapprehension about what our representations are doing. but i can't open with welcome, consciousness is fake — that'd alienate the realists and misrepresent me, since i don't deny representation, i deny that those representations carry this magical inner light that introspection reports.

  the welcome should be about five minutes, casual but sharp, and it needs to work for both audiences without losing the scientists in jargon or sounding like mysticism to them. please don't include any citations, reading lists, or as-some-philosopher-said references — i don't want anyone feeling like they need homework, and honestly half the room wouldn't recieve the point if i loaded it with names.

  oh, and i keep writing phenominal instead of phenomenal — please use the right spelling in the speech, but keep my voice: a philosophy prof who respects the scientists and doesn't want to sound dismissive. write it like an email i'm sending to a colleague, loose but not sloppy. maybe leave the typo recieve in there, that's about right for my energy level this week.
