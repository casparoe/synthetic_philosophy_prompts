answer: |-
  Below is a structured, reusable procedure for magistrates to determine whether a procedurally valid rule should be treated as "law" for judicial application. It prioritizes objective steps first, minimizes philosophical complexity, and explicitly flags value-based decisions. Judges can complete it in **20 minutes** using simple legal resources (constitution, statutes, intranet for precedents).  

  ---

  ### **Procedure: Validity Assessment for Morally Suspect Rules**  
  **Pre-Check**: Always attempt a *rights-consistent interpretation* first (e.g., read the rule narrowly to avoid injustice). If impossible, proceed.  

  1. **Is the rule formally repealed or superseded?**  
     - *Check*: Current legal database or gazette.  
     - *Good enough*: Clear evidence of repeal or replacement.  
     - **Stop if YES**: Do not apply. Proceed if NO.  

  2. **Is the rule void under binding precedent?**  
     - *Check*: Supreme/Constitutional Court rulings invalidating this rule or its type.  
     - *Good enough*: Direct precedent or clear analogical extension (e.g., "all denunciation laws void").  
     - **Stop if YES**: Do not apply. Proceed if NO.  

  3. **Does the rule violate peremptory international law (jus cogens)?**  
     - *Check*: UN Charter, treaties ratified by your state, or ICJ rulings. Focus on absolute norms: genocide, torture, slavery, crimes against humanity.  
     - *Good enough*: Rule directly enables or requires conduct prohibited by jus cogens (e.g., a law authorizing torture).  
     - **Stop if YES**: Do not apply. Proceed if NO.  

  4. **Does the rule violate the current constitution?**  
     - *Check*: Bill of Rights, separation of powers, or explicit prohibitions.  
     - *Good enough*: Rule contradicts unambiguous constitutional text or core structure (e.g., retroactive punishment if constitution forbids ex post facto laws).  
     - **Stop if YES**: Do not apply. Proceed if NO.  

  5. **Would applying the rule cause intolerable injustice in *this* case?**  
     - *Check*: Severity, targeting of vulnerable groups, denial of dignity, or instrumentalization of oppression. Use:  
       - **Origin**: Was the rule designed to persecute, terrorize, or entrench dictatorship?  
       - **Effect**: Does application here perpetuate old-regime cruelty (e.g., destroying families, eliminating dissent)?  
     - *Good enough*: A "YES" requires **both**:  
       - Origin/Effect linked to systemic oppression, **and**  
       - Harm so severe it "shocks the conscience" (e.g., life-ruining punishment for trivial conduct).  
     - **Stop if YES**: Do not apply.  
     - **Proceed if NO**: Apply the rule.  

  **Value Judgment Explicitly Required At**: **Step 5** (assessing "intolerable injustice"). Judges *must* articulate specific facts about the rule’s origin/effect and harm in their written decision.  

  **When the Procedure Cannot Settle**:  
  - Rules that are unjust but not severe enough for Step 5 (e.g., bureaucratic hassles).  
  - Rules where "oppressive origin" is disputed without evidence.  
  - Conflicts between democratic values (e.g., security vs. privacy) without clear hierarchy.  

  ---

  ### **Application to Cases**  
  **Assume**:  
  - Constitution forbids torture, arbitrary detention, retroactive punishment, and guarantees due process.  
  - No binding precedent voiding these rules.  
  - Old regime rules are formally valid but unenforced since the transition.  

  #### **Case 1: Old Denunciation Law**  
  *Rule: Requires citizens to report "anti-state activities" (e.g., criticizing government). Penalty: 5-year imprisonment.*  
  - **Step 1**: Not repealed (NO).  
  - **Step 2**: No voiding precedent (NO).  
  - **Step 3**: Not jus cogens (denunciation ≠ torture/slavery) (NO).  
  - **Step 4**: Violates free speech and due process (YES → **Stop. Do not apply**).  
    - *Reason*: Constitution protects speech and forbids arbitrary detention.  

  #### **Case 2: Old Petty Tax Regulation**  
  *Rule: Imposes a 2% tax on street vendors without receipts.*  
  - **Step 1**: Not repealed (NO).  
  - **Step 2**: No voiding precedent (NO).  
  - **Step 3**: Not jus cogens (NO).  
  - **Step 4**: No constitutional violation (tax is non-discriminatory) (NO).  
  - **Step 5**: Intolerable injustice?  
    - *Origin*: Not oppressive (routine revenue law).  
    - *Effect*: Minor financial burden; no targeting of vulnerable groups.  
    - → **NO intolerable injustice. Apply the rule.**  

  #### **Case 3: Current Statute Allowing Eviction Without Hearing**  
  *Rule: Police may evict tenants immediately if landlord alleges "property damage."*  
  - **Step 1**: In force (NO).  
  - **Step 2**: No voiding precedent (NO).  
  - **Step 3**: Not jus cogens (eviction ≠ slavery/torture) (NO).  
  - **Step 4**: Violates due process? **Constitution ambiguous** (no explicit right to housing hearings) (NO).  
  - **Step 5**: Intolerable injustice?  
    - *Origin*: Post-dictatorship democratic legislature (not oppressive).  
    - *Effect*: Risk of homelessness without evidence or defense. Targets poor tenants.  
    - → **Judge’s value call**:  
      - If harm "shocks conscience" (e.g., family evicted in winter based on false claim), **Stop. Do not apply**.  
      - If less severe (e.g., commercial tenant, quick court appeal available), **Apply the rule**.  
  - **Result Judges Will Hate**: If the judge applies the rule (e.g., deeming it "unjust but not intolerable"), they must enforce eviction without a hearing.  

  ---

  ### **Key Notes**  
  - **Efficiency**: Steps 1–4 rely on objective sources (databases, constitution). Step 5 is the only deliberative step, confined to extreme cases.  
  - **Accountability**: Published reasoning must detail answers at each step, especially Step 5’s origin/effect analysis.  
  - **Limitations**:  
    - Cannot resolve "gray areas" where injustice is material but not intolerable (e.g., a harsh but non-oppressive fine).  
    - Depends on judge’s rigor in Step 5 (e.g., overlooking "oppressive origin" in Case 3 if focused only on current legislature).  
  - **Mitigation**: Encourage magistrates to note in their decision that a rule is "unjust but legally binding" to signal need for legislative repeal.  

  This procedure channels Hart/Fuller tensions into a trauma-aware but structured test, prioritizing the current constitutional order while authorizing judges to reject rules that resurrect the old regime’s brutality.
