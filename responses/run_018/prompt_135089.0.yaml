prompt: |-
  I'm defending a view on statue/clay constitution at a metaphysics seminar tuesday: I call it "modal part-sharing," where the clay contains modal parts (possible shapes) that the statue doesn't, so they actually overlap but diverge modally, letting me reject Baker's constitution account without buying full hylomorphism. Audience is analytic metaphysicains who know Wiggins and Baker inside out, plus one grad student convinced material constitution is a pseudo-problem, plus a visitor from philosphy of science who thinks artifacts don't have real modal properties. Prep me for the objections in roughly damage order, phrased like they'd actually say them — not generic "what about identity?" Give me each with a two-minute reply and flag where I'm soft. What's the question I'm hoping nobody asks?
reasoning: |-
  Okay, the user is preparing for a metaphysics seminar defense on Tuesday. They're proposing "modal part-sharing" to address the statue/clay constitution problem, a classic puzzle in analytic metaphysics. The core idea is that the statue and clay share actual parts but have different modal parts (possible shapes), allowing them to overlap without being identical while avoiding both Baker's constitution view and full hylomorphism.  

  The audience is tough: experts on Wiggins and Baker, a grad student who thinks material constitution is a pseudo-problem, and a philosophy of science visitor skeptical about artifact modal properties. The user wants objections ordered by how damaging they'd be, phrased authentically, with 2-minute replies and soft spots flagged. They also want to know the "question they hope nobody asks."  

  First, I need to map the battlefield. The statue/clay problem asks: if a statue (Goliath) is made of clay (Lump) and they occupy the same space, are they identical? If not, what distinguishes them? Standard answers include:  
  - **Baker's constitution view**: They're non-identical but the statue is constituted by the clay at that time.  
  - **Hylomorphism**: The statue is the clay *plus* a form or function.  
  - **Eliminativism**: Only the clay exists; statues are conceptual.  
  The user's "modal part-sharing" tries to split the difference: they share actual parts but the clay has "modal parts" (e.g., possible shapes like a scattered lump post-destruction) that the statue lacks.  

  Key vulnerabilities I see:  
  1. **Modal parts ontology**: Are "modal parts" coherent? Do possible shapes literally exist as parts now? Critics will pounce on this.  
  2. **Anti-realist challenges**: The science visitor may deny artifacts have *any* de re modal properties, making the whole distinction illusory.  
  3. **Pseudo-problem angle**: If the grad student argues we're misapplying identity criteria, the user's view might add unnecessary complexity.  
  4. **Collapse risks**: Does this view imply mereological essentialism? Or fail to handle temporary overlap?  

  I'll structure objections from most to least damaging:  
  - **Top threat**: The science visitor attacking modal realism for artifacts. If artifacts lack essential properties, "modal parts" crumble.  
  - **Next**: Baker-style objections about temporal indiscernibility (if they share all actual parts *now*, why think modal differences matter?).  
  - **Then**: The pseudo-problem charge—why not just say "statue" and "clay" are descriptions of the same thing?  
  - **Finally**: Technical mereology holes (e.g., if modal parts exist, why can't we count them?).  

  For replies, the user needs to:  
  - **Concede where shaky**: E.g., admit modal parts are a theoretical posit but argue they're no worse than modal properties.  
  - **Redirect**: Stress that this view avoids Baker's commitment to irreducible constitution relations.  
  - **Defend parsimony**: Argue that modal differences are intuitive and rejecting them leads to worse problems (like statue/lump identity).  

  The "question they hope nobody asks": Likely one exposing circularity or demanding a non-modal actual difference. E.g., "What actual physical fact grounds the difference in modal parts if all current parts are shared?" This forces them to either embrace primitive modality or admit there's no current difference.  

  Soft spots to flag:  
  - **Modal realism**: If the audience rejects de re modality for artifacts, the view collapses.  
  - **Mereology**: Defining "modal parts" without making them countable entities.  
  - **Parsimony**: Why is this better than eliminativism or hylomorphism?  

  I'll draft objections in the snappy, aggressive style of seminar Q&A, then give tight 2-minute replies with vulnerability markers. The hidden trap question will target the actual ground of modal differences.
answer: |-
  Here’s a damage-ranked list of objections you’ll likely face, phrased as they’d be asked, with 2-minute replies and soft spots flagged. I’ve ordered them from most to least threatening based on your audience’s expertise and the vulnerabilities in "modal part-sharing" (MPS).  

  ### **Objection 1 (Philosophy of Science Visitor)**  
  *"Your 'modal parts' are pseudo-properties. Artifacts like statues are observer-dependent aggregates. Science quantifies over matter, not 'possible shapes.' Modal talk for artifacts is just a useful fiction for human psychology. Why reify this into metaphysics?"*  
  **Reply (2-min):** "You’re right that science often avoids de re modality for artifacts. But MPS doesn’t require modal realism—it’s a *descriptive* tool for how we individuate objects in ordinary/practical metaphysics. The clay’s capacity to survive squashing isn’t a physical property, but it’s a *relational* one grounded in how matter behaves under counterfactuals (e.g., intermolecular bonds persist). Science already uses dispositions (e.g., fragility), so MPS extends this to mereology. If we reject all artifact modality, we can’t explain why we treat the statue as *destroyed* when squashed but the clay as *surviving*—a distinction even eliminativists pragmatically accept."  
  **Soft Spot:** You’re conflating dispositional properties (science-friendly) with *parts* (ontologically loaded). If modality isn’t real for artifacts, MPS collapses.  

  ### **Objection 2 (Baker Expert)**  
  *"Baker avoids mereological overload by making constitution a primitive, non-mereological relation. You’re smuggling in temporal parts through the back door! If the statue and clay share all actual parts *now*, how can they have different *modal* parts? That’s either contradictory or commits you to mereological essentialism."*  
  **Reply (2-min):** "MPS isn’t temporal parts—it’s a slice of modal space. At *t*, the statue and clay share all actual spatial parts, but the clay has additional modal parts (e.g., 'being scattered post-destruction') that the statue lacks. This avoids Baker’s primitive constitution by grounding difference in modally extended mereology, not a new relation. Mereological essentialism doesn’t follow: actual parts don’t change; only which modal parts are 'attached' differs. Think of it as a counterpart-like relation: the clay’s counterparts include scattered lumps; the statue’s don’t."  
  **Soft Spot:** This hinges on "modal parts" being coherent. Critics will say you’re reifying possibilities—e.g., is a "scattered-shape modal part" *part* of the clay right now?  

  ### **Objection 3 (Grad Student: Pseudo-Problem Advocate)**  
  *"Why not just say ‘statue’ and ‘clay’ are phases or descriptions of one object? Your MPS adds needless complexity. If they share all actual parts, Occam’s razor says they’re identical, and ‘divergent modals’ are just linguistic or contextual. This is a textbook case of mistaking use for reference!"*  
  **Reply (2-min):** "If they were identical, we couldn’t consistently attribute modal properties—e.g., ‘The statue *could not* survive being flattened’ is true while ‘The clay *could* survive it’ is also true. Phase sortalism can’t resolve this without temporal indexing, which fails for synchronic cases. MPS isn’t complex; it’s minimal ontology for robust modal intuitions. We *do* refer to distinct artifacts (e.g., buying ‘a statue’ isn’t buying ‘clay’ if it’s destroyed). Your view collapses practical distinctions metaphysics should explain."  
  **Soft Spot:** You’re vulnerable if they press epistemic access—e.g., "What *evidence* is there for two entities besides language?"  

  ### **Objection 4 (Wiggins Expert)**  
  *"Wiggins showed that sortal concepts individuate objects. Your MPS ignores this: if the statue and clay share all actual parts, what grounds their differing modal parts? Without sortal persistence conditions, modal parts are arbitrary. This feels like an ad hoc fix."*  
  **Reply (2-min):** "Wiggins is right about sortals, but MPS *uses* them: the sortal ‘statue’ determines which modal parts are included (e.g., only shapes preserving artistic form). The sortal ‘clay’ includes all materially continuous shapes. Modal parts aren’t freestanding—they’re sortal-relative. So, divergence comes from sortals, but MPS avoids Wiggins’ commitment to temporal parts or robust hylomorphism by keeping actual parts shared."  
  **Soft Spot:** Sortals doing the work might make MPS redundant. If sortals ground modal differences, why add "modal parts"?  

  ### **Objection 5 (Mereology Stickler)**  
  *"If modal parts exist, why aren’t they countable? Suppose the clay has 1,000 possible shapes the statue lacks. Do I have 1,000 extra parts in my room right now? If not, how is this mereology? If yes, this inflates ontology absurdly."*  
  **Reply (2-min):** "Modal parts aren’t concrete spatiotemporal parts—they’re abstract existents (like uninstantiated properties). We don’t count them as ‘in the room’ any more than we count the number 7. They’re reifications of *possible de re properties*, not entities. MPS only requires that objects have modal profiles, and that these profiles can diverge while sharing actual basis. No ontological inflation beyond standard modal realism."  
  **Soft Spot:** This sounds like two-tiered ontology (actual vs. modal). Hardcore nominalists will pounce.  

  ---  
  ### **The Question You Hope Nobody Asks**  
  *"What actual, non-modal difference *at t* grounds the divergence in modal parts? If all categorical properties (mass, shape, location) are identical at t, how can one object have ‘extra’ modal parts without a brute modal fact—making your view just Baker’s constitution in disguise?"*  

  **Why it’s deadly:** It forces you to either:  
  - **Concede brute modality** (undermining MPS’s parsimony vs. Baker), or  
  - **Posit a hidden actual difference** (contradicting MPS’s core claim of shared actual parts).  
  Your best dodge: "The difference is relational—e.g., the clay’s modal parts depend on its *historical origins* (it was once unstructured matter), while the statue’s depend on its *function*. But this risks collapsing into historical essentialism or hylomorphism."  

  **Final Prep Tip:** Focus defensive energy on the science visitor’s objection—it’s the linchpin. If artifacts lack real modality, MPS fails. Preempt by citing Amie Thomasson or Lynne Baker on pragmatic realism about artifacts. Good luck!
