prompt: |-
  I keep noticing a pattern in institutional classification that I do not have a precise name for. Imagine a board that certifies artifacts as authentic using published criteria: radiometric range, documented provenance, stylistic coherence. Over years, high-profile cases slowly relax one criterion at a time—an object with weak provenance is approved because its material dating is unambiguously central, another with stylistic anomalies is approved because its chain of custody is exceptional. The formal rules stay unchanged, but an unstated shadow taxonomy grows: a cluster of approved clear cases that implicitly redefine the boundary. Then, when an independent applicant meets every published criterion but lacks the accumulated, unstated relaxations, the board rejects it as borderline or in the gray zone, appealing to the central examples rather than to the rules. I have seen analogous dynamics in medical licensing and tenure review, where a category is defended not by a fixed line but by an expanding cloud of paradigmatic instances that push ambiguity outward. Does this specific configuration—formal rules remaining static while an implicit, retrospective boundary is maintained through appeals to central cases—have an established name in philosophy or institutional theory? If there is no precise term, can you define its edges, distinguishing it from the sorites paradox, from ordinary regulatory drift, and from strategic ambiguity in argument? Please indicate how confident you are in the identification, and highlight the specific point about which you are least certain.
reasoning: |-
  Okay, let's unpack this user's query. They've described a pattern where formal rules stay the same, but decisions gradually shift based on precedents that relax criteria. Then, when someone meets all the official rules but lacks those unspoken relaxations, they get rejected. The user mentions seeing this in certification boards, medical licensing, and tenure reviews. 

  First, I need to figure out what this is called. I recall precedential creep and boundary work as possible terms. Precedential creep fits because each exception sets a new informal standard. Boundary work from sociology deals with how groups define what's inside or outside, which matches the board's behavior of protecting their domain. 

  The user wants to distinguish this from similar concepts. Sorites paradox is about vague boundaries leading to contradictions, but here it's more about institutional practices. Regulatory drift involves rules changing over time, but here the rules are static—it's the application that shifts. Strategic ambiguity is intentional, whereas this seems more emergent. 

  Hmm, the user also asks about confidence. I'm pretty sure about precedential creep and boundary work. The least certain part is whether the rejections are due to gatekeeping or just inconsistency. It might be both, but gatekeeping feels key. 

  I should check if there are other terms. Institutional logic or path dependence come to mind, but they're broader. Precedential creep seems most precise. Also, the appeal to paradigmatic cases is central here. 

  The user is clearly well-versed in institutional theory, so they need precise terminology. They might be researching this pattern or dealing with it professionally. Their frustration with unstated criteria suggests they want to articulate or address this dynamic. Highlighting the difference from sorites paradox and regulatory drift will help them apply the concept accurately. 

  I'll structure the response around the core mechanics, then define the terms, contrasts, and confidence levels. Emphasizing the unstated shadow taxonomy and gatekeeping will address their main points. The uncertainty about gatekeeping intent is important to note since it's hard to prove motives without insider knowledge.
answer: |-
  This phenomenon **does** have established conceptual anchors, primarily combining elements of **precedential creep** and **boundary work**, with strong connections to **institutional gatekeeping** and **paradigm-based reasoning**. While no single universally accepted term perfectly encapsulates *every* aspect you described, the core dynamics are well-recognized.

  Here's the breakdown:

  1.  **Core Mechanism: Precedential Creep & Boundary Work**
      *   **Precedential Creep:** This is the gradual, case-by-case relaxation or reinterpretation of formal criteria through the accumulation of exceptions or borderline approvals. Each approved exception, justified by its unique "strength" in other areas, sets an informal precedent that subtly shifts the *de facto* standard. The formal rules remain unchanged, but the operational boundary moves. This is distinct from *regulatory drift* (where rules themselves become outdated or misaligned) because the rules *themselves* aren't changing; their *application* is evolving through precedent.
      *   **Boundary Work (Sociology of Science/Professions):** This concept (Thomas F. Gieryn, others) describes how institutions and professions actively define, maintain, patrol, and contest the boundaries of their domain, expertise, or legitimate membership. Your board is engaging in boundary work. By approving exceptions based on "centrality" or "exceptionality" in one dimension, they redefine what constitutes an "authentic" artifact (or a "qualified" doctor/tenured professor) *in practice*. The rejection of the applicant meeting the formal criteria but lacking the accumulated "relaxation pedigree" is classic boundary policing – defending the newly expanded but unstated core by excluding outsiders who don't fit the *evolved* paradigm.

  2.  **The Role of Paradigms & "Central Cases"**
      *   Your description of appealing to "central examples" or a "cloud of paradigmatic instances" aligns perfectly with **paradigm-based reasoning** (drawing from Kuhn's *Structure of Scientific Revolutions*, though applied here to institutional judgment). The board isn't applying fixed rules deductively; they're reasoning analogically from a set of exemplars (the approved cases, including the exceptions) that collectively define the category "authentic" for them. New cases are judged by their similarity to this evolving set of exemplars, not solely by the formal checklist. The "central cases" become the *de facto* definition.

  3.  **Distinguishing from Related Concepts:**
      *   **Sorites Paradox (Heap Paradox):** This is about vagueness and the impossibility of drawing a sharp line where small, incremental changes occur (e.g., removing one grain from a heap). While your phenomenon *uses* vagueness (stylistic "anomalies," provenance "weakness"), it's fundamentally different. The Sorites is a *logical* paradox about predicates. Your case is about *institutional practice*: the boundary isn't just vague; it's *actively and strategically managed and shifted* through precedent and appeals to central cases. The board isn't confused by vagueness; they're *exploiting* it to redefine boundaries.
      *   **Ordinary Regulatory Drift:** This involves formal rules becoming less effective or relevant over time due to changing contexts, without necessarily an *active*, precedent-driven shift in application. Your case involves *active reinterpretation* driven by specific decisions that set new informal standards, while the *formal* rules remain static. The drift is in the *interpretation and enforcement*, not (or not just) in the rules themselves or their environment.
      *   **Strategic Ambiguity:** This is the deliberate use of vague language in rules or agreements to allow flexibility or build coalitions. While your board might benefit from ambiguity in their criteria, the phenomenon you describe goes further. It's about the *systematic, retrospective creation of new, unstated standards* through accumulated precedents, which are then used to judge *against* applicants who only meet the original, published standards. The ambiguity isn't just strategic in the rules; it's emergent in the *application history*.

  **The Specific Configuration: A Proposed Synthesis**

  The most precise way to name this configuration is **"Precedential Boundary Creep via Paradigmatic Expansion."** Its core elements are:

  1.  **Static Formal Rules:** Published criteria remain unchanged.
  2.  **Case-by-Case Relaxation:** High-profile exceptions are approved, relaxing one criterion based on perceived strength elsewhere.
  3.  **Creation of an Informal Taxonomy/Paradigm:** Approved exceptions become part of a new, unstated set of "paradigmatic cases" defining the category.
  4.  **Boundary Redefinition & Policing:** The operational boundary shifts outward based on this new paradigm.
  5.  **Retrospective Gatekeeping:** Applicants meeting only the *original* formal criteria are rejected as "borderline" by appealing to the *new*, expanded set of paradigmatic cases, despite technically fulfilling the published rules.

  **Confidence Assessment:**

  *   **High Confidence (95%):** That the phenomenon is accurately described by the combination of **Precedential Creep** and **Boundary Work**, and that it is distinct from the Sorites Paradox and ordinary Regulatory Drift in the ways outlined. The role of **paradigm-based reasoning** is also strongly supported.
  *   **Moderate Confidence (80%):** That "Precedential Boundary Creep via Paradigmatic Expansion" is a sufficiently precise and descriptive label capturing the core mechanics. While the *components* are well-established, this *specific combination and emphasis* might not be a single, universally codified term.
  *   **Lower Confidence / Uncertainty Point (60%):** Regarding the *primary driver* behind the rejection of the applicant who meets the formal criteria but lacks the "relaxation pedigree." My analysis emphasizes **institutional gatekeeping/boundary policing** – protecting the domain defined by the new paradigm. However, it *could* also be partly driven by:
      *   **Cognitive Bias:** Judges may genuinely perceive the new applicant as more marginal *relative to the evolved exemplars* due to availability heuristic or representativeness heuristic.
      *   **Inconsistency Masked as Rigor:** An unconscious reluctance to admit the rules have been functionally changed, leading to stricter application *only* on cases that highlight the discrepancy.
      *   **The exact balance between conscious gatekeeping intent and emergent institutional bias** is often hard to pinpoint definitively without insider knowledge, and this is the point where I'm least certain about the *dominant* underlying motivation in every instance. The *effect* is boundary policing, but the *intentionality* might vary.

  In essence, you've astutely identified a powerful mechanism of institutional change and gatekeeping where formal rules provide a facade of stability while the *real* standards evolve dynamically through precedent and appeals to an expanding core of exemplars, creating a "shadow taxonomy" used to exclude those adhering only to the original, published terms.
