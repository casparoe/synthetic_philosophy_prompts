answer: |-
  ### 1. Institutional Practice and Philosophical Puzzle (150 words)
  The university employs a three-tiered plagiarism system: a deliberately vague honor code definition ("adequate acknowledgment"), detection software imposing sharp percentage thresholds (dismissal <15%, automatic hearing >30%, Board review 15–30%), and a Borderline Review Board classifying cases not by factual plagiarism but via disciplinary norms and administrative pragmatism. The Board’s classifications are final, with no appeal for substantive misclassification. Further, thresholds are recalibrated quinquennially based on shifting citation conventions, not empirical misconduct data. This raises a philosophical puzzle: How does this structure conceive of plagiarism’s boundary? The honor code suggests vagueness, the software implies sharp boundaries, and the Board’s conventionalism treats boundaries as adjustable by decree. The system appears to hybridize epistemic, semantic, and pragmatic approaches to vagueness, demanding reconstruction of its implicit theory.

  ### 2. Reconstruction of the Implicit Theory of Vagueness (350 words)
  The system presupposes a **conventionalist supervaluationist** theory of vagueness, modified for institutional pragmatism.  

  - **Honor Code Vagueness**: The open-textured definition ("adequate acknowledgment") creates a *penumbra* where plagiarism is neither clearly present nor absent. This rejects epistemicism (which posits a sharp but unknown boundary), instead treating vagueness as semantic indecision.  
  - **Software Thresholds**: The 15%/30% cutoffs act as *precisifications* carving the penumbra into administrable zones. Crucially, these thresholds are not treated as epistemic tools to *discover* a hidden boundary (contra epistemicism) but as conventional anchors. Their artificial sharpness is a managerial necessity, not an ontological claim.  
  - **Board’s Mandate**: The Board performs *authorized precisification*. By classifying cases based on disciplinary norms and "boilerplate" overlap—*without* determining whether plagiarism "really occurred"—it explicitly treats the boundary as indeterminate until conventionally fixed. This mirrors supervaluationism’s core tenet: truth in borderline cases is settled only by admissible precisification.  
  - **Quinquennial Audit**: Recalibrating thresholds based on shifting citation conventions (not empirical facts) strictly entails conventionalism. It treats plagiarism’s boundary as *constituted* by evolving academic practices, not discovered.  

  **Entailments vs. Fits**:  
  - *Strict entailment*: The audit’s convention-driven recalibration and the Board’s mandate to classify (not discover) truth categorically reject epistemicism.  
  - *Comfortable fit*: The software’s binarism fits supervaluationism’s need for precisifications but could (awkwardly) fit epistemicism if misconstrued as a proxy for discovery. The honor code’s vagueness fits any non-epistemic theory.  

  The implicit theory is thus a *pragmatic conventionalist supervaluationism*: vagueness is real, boundaries are indeterminate until precisified, and precisifications are institutionally authorized for administrative coherence.

  ### 3. Coherence Check: Tensions and Resolution (250 words)
  The honor code’s vagueness and software’s sharpness initially appear in tension: the former denies precise boundaries, while the latter imposes them. However, the Board’s conventionalist role resolves this by mediating between them.  

  - **Honor Code ↔ Software**: The tension is superficial. The software does not assert that plagiarism *ontologically* sharpens at 15%; it operationalizes the vague code by creating *procedural* thresholds. This is consistent with supervaluationism, where precisifications manage vagueness without eliminating it.  
  - **Board as Mediator**: By interpreting borderline cases via disciplinary conventions (e.g., "boilerplate" exclusions), the Board legitimizes the software’s artificial thresholds as *admissible precisifications*. Its refusal to seek "true" plagiarism in borderline cases explicitly embraces indeterminacy, aligning with the honor code’s vagueness.  
  - **Systemic Coherence**: The quinquennial audit confirms coherence. Adjusting thresholds to citation norms acknowledges that precisifications are conventions—not discoveries—validating the Board’s mandate. The lack of substantive appeals further underscores that boundaries are fixed by institutional fiat, not fact.  

  **Residual Tension**: A minor tension persists in the software’s *presentation* of similarity as an objective percentage, which may misleadingly imply epistemicism. Yet the Board’s authority to override this metric based on conventions (e.g., dismissing boilerplate matches at 17%) mitigates this, reaffirming that percentages are heuristic tools, not ontological measures.

  ### 4. Rival Substitution and Institutional Redesign (250 words)
  If vagueness were **purely epistemic** (a sharp but unknowable boundary exists), the system would require radical redesign:  

  - **Board’s Role**: Instead of stipulating classifications based on norms, it would *investigate* intent, context, and citation practices to *discover* whether plagiarism occurred. Decisions would aim at factual accuracy, not administrative coherence.  
  - **Appeals Mechanism**: Epistemicism demands error-correction for misclassification. An appeals process would be essential to approximate the hidden boundary.  
  - **Quinquennial Audit**: Recalibration would require *empirical misconduct data* (e.g., whether students understood sources) to better estimate the true boundary. Shifting conventions alone would be irrelevant.  
  - **Software Thresholds**: Cutoffs could remain as provisional decision-rules but would need contextual interpretation in *every* case (not just borderline). The 15–30% "penumbra" would dissolve, as all cases possess a determinate (if elusive) truth-value.  

  **Underdetermined Elements**:  
  - The honor code’s vagueness is compatible with both theories.  
  - Software thresholds could be retained under epistemicism as fallible discovery tools.  
  - The Board’s existence (though not its mandate) is neutral; both theories need a body to handle hard cases.  

  Minor adjustments (e.g., rebranding the Board as an "Investigation Panel") could sustain the current structure under epistemicism, but the audit’s design and the Board’s conventionalism strictly resist it.

  ### 5. AI-Paraphrase Case and Underdetermination (200 words)  
  **Case**: AI-generated text paraphrasing a source, scoring 18% similarity (borderline range), with no direct copying.  

  - **Under Implicit Theory (Conventionalist Supervaluationism)**: The Board decides based on current disciplinary norms. If paraphrasing (human or AI) requires citation in the field, it is classified as plagiarism, triggering review. If AI paraphrasing is deemed "boilerplate" or novel by convention, it is dismissed. The decision is final and convention-dependent. Likely, emerging norms around AI originality would dominate, possibly leading to dismissal in STEM (where ideas trump expression) but disciplinary review in humanities (where phrasing matters).  

  **Revealed Limits**: The practice cannot adjudicate whether AI *truly* plagiarizes (a metaphysical question) but only whether conventions deem it so. This exposes its operational reliance on social norms over truth.  

  **Underdetermination**:  
  - *Epistemicism*: The Board would investigate if the student *intended* to present AI output as their own, treating 18% as a clue, not a determinant.  
  - *Both theories* could license similar outcomes via the Board’s discretion, but for different reasons: conventionalism by fiat, epistemicism by discovery. The lack of appeals makes the outcomes indistinguishable in practice, masking the philosophical divergence.
