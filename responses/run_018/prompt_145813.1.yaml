answer: |-
  ### Bottom-Line Summary
  This procedure provides a standardized framework to assess requests for institutional statements on historical wrongs using Jaspers' guilt typology. It achieves three aims: **1)** Classifies the guilt-type implicated; **2)** Determines if the museum’s represented collective (e.g., "the nation") is a valid bearer; **3)** Assigns an appropriate speech act (or silence). The two critical gates are **Step 2** (Guilt-Type Identification) and **Step 4** (Representational Standing Check). The structural weakness is **Step 5**, where assessing "collective moral guilt" requires inherently contestable value judgments about institutional embodiment of ethical failure.

  ---

  ### The Procedure: Jaspers-Based Decision Gates

  1.  **Guilt-Subject Identification:**
      *   *Question:* Whose guilt is implicated? (Perpetrator state/group, specific institutions, individuals, all humanity?).
      *   *Sufficient Answer:* Clear identification of the *primary* agent(s) of the historical wrong (e.g., "the former Regime X," "Police Unit Y," "individual commanders," "humanity").
      *   *Next Step:* Proceed to Step 2.

  2.  **Guilt-Type Classification (Jaspers):**
      *   *Question:* Which Jaspers guilt type(s) primarily apply?
          *   **Criminal Guilt:** Violation of clear laws (individuals/corporate bodies).
          *   **Political Guilt:** Liability of citizens for acts/omissions of their state/community, requiring restitution.
          *   **Moral Guilt:** Personal ethical failing requiring repentance/atonement (individuals or *possibly* embodied collectives).
          *   **Metaphysical Guilt:** Shared human solidarity failing victims, requiring existential humility.
      *   *Sufficient Answer:* Clear assignment to 1-2 primary types based on the wrong's nature and agent. Avoid conflation.
      *   *Stop Point:* If only **Metaphysical Guilt** is identified → Recommend **Institutional Silence** (No collective bearer exists; museum cannot speak for humanity). Proceed otherwise.

  3.  **Collective Bearer Check:**
      *   *Question:* Is the collective subject this museum institutionally represents (e.g., "the Nation," "the People") the *valid successor* or *constitutive community* bearing responsibility for this *specific* guilt type?
      *   *Sufficient Answer:* Rationale linking the collective to the guilt-type agent (e.g., "The current state is the legal/political successor to the perpetrator regime" for *Political Guilt*; "No institutional continuity exists for these specific perpetrators" for *Criminal Guilt*).
      *   *Stop Point:* "No" → **No Statement Appropriate** (Museum lacks standing). "Yes" → Proceed.

  4.  **Representational Standing Check:**
      *   *Question:* Can the museum legitimately speak *for* this collective on *this* guilt type?
      *   *Rules:*
          *   **Criminal Guilt:** NO (Only courts speak authoritatively on criminal guilt; museum can *report* verdicts).
          *   **Political Guilt:** YES (Museum as cultural/political institution can acknowledge liability/restitution duties).
          *   **Moral Guilt:** CONTESTED (Requires Step 5).
          *   **Metaphysical Guilt:** NO (Excluded at Step 2).
      *   *Stop Point:* "No" (e.g., Criminal Guilt) → **No Statement Appropriate** or limit to factual **Acknowledgement** (e.g., "Courts found X guilty"). "Yes" (Political) → Assign **Acknowledgement** or **Apology** (see Step 5). "Contested" (Moral) → Proceed to Step 5.

  5.  **Value Judgment Gate (Moral Guilt & Speech Act):**
      *   *Question (If Moral Guilt passed Checks 3 & 4):* Does the board judge that the institution *can and should* embody collective moral guilt, warranting repentance?
      *   *Sufficient Answer:* Board deliberation weighing institutional mandate, societal context, and potential for healing vs. overreach. *This is a value choice, not derivation.*
      *   *Speech Act Assignment:*
          *   Political Guilt → **Acknowledgement** (of liability/facts) or **Apology** (if profound failure & board chooses).
          *   Moral Guilt (Board Yes) → **Apology** (expressing repentance).
          *   Moral Guilt (Board No) → **Acknowledgement** or **Silence**.
      *   *Memorial Designation:* Requires factual basis + fits assigned guilt-type (e.g., naming victims for Political/Moral guilt; naming perpetrators requires *court verdicts*).

  ---

  ### Application to Cases

  1.  **State Apology for Engineered Famine:**
      *   *Subject:* Prior Regime (State).
      *   *Guilt-Type:* Primarily **Political Guilt** (state policy liability), potentially Moral.
      *   *Bearer Check:* YES (Current state is political successor).
      *   *Standing Check:* YES for Political Guilt (Moral: Contested).
      *   *Value Judgment (Step 5):* Board *can* choose institutional **Apology** for Political Guilt liability. Moral component optional but enhances weight. *Output:* **Co-sign Apology** justified.

  2.  **Label Security Apparatus as Criminal & Name Perpetrators:**
      *   *Subject:* Specific Apparatus (Institution) & Individuals.
      *   *Guilt-Type:* **Criminal Guilt** (apparatus/individuals).
      *   *Bearer Check:* Apparatus - *Potentially* (if state successor). *Individuals - NO* (Museum doesn't represent perpetrators).
      *   *Standing Check:* **NO** for Criminal Guilt declaration/naming. Only courts assign criminal guilt.
      *   *Stop Point (Step 4):* **No Statement Appropriate** for declaring criminal guilt or naming individuals without verdicts. *Output:* Reject demand; offer factual **Acknowledgement** of apparatus' role *if* bearer check passed.

  3.  **Board Favors Silence on Forced-Labor Camps (Metaphysical Claim):**
      *   *Subject:* Prior Regime (State) / Humanity.
      *   *Guilt-Type:* Primarily **Political Guilt** (state policy) & **Moral Guilt** (individuals/regime). *Metaphysical Guilt* is secondary.
      *   *Bearer Check:* YES for Political Guilt (state successor).
      *   *Standing Check:* YES for Political Guilt (Moral: Contested). Metaphysical Guilt → STOP at Step 2.
      *   *Value Judgment (Step 5):* Board *cannot* claim Metaphysical Guilt blocks *all* speech. It must confront Political Guilt standing. Choosing silence here is a *value choice* rejecting institutional embodiment of Political/Moral guilt, **not** a derived conclusion. *Output:* Procedure forces admission of value-based choice for silence over **Acknowledgement**/**Apology**.

  ---

  ### What the Procedure Cannot Do
  It cannot resolve fundamental disagreements about a society's continuity with its past or dictate the precise wording of statements, only categorize the *type* of speech act justifiable.
