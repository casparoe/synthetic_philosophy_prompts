prompt: |-
  Design a 90-minute classroom activity for an upper-level philosophy seminar of about 12 to 14 students on the paradox of fiction. The aim is to make participants feel the tension between knowing a narrative is invented and still experiencing a genuinely directed reactive attitude—specifically moral anger or indignation at a wrongdoer—before anyone introduces the standard taxonomy of quasi-emotions, make-believe, or Walton-style pretense theory. The setting should include real but small stakes, hidden information, and assigned roles so that the paradox emerges from what participants do rather than from a lecture.

  Structure the session as follows. Before class, prepare one vivid, ethically charged narrative passage describing a bureaucratic cruelty—detailed enough to invite blame, ambiguous enough that it could be either testimony or fiction. Create two framing envelopes: half are labeled verified documentary transcript, half are labeled excerpt from an unpublished dystopian novel written in 2023. The text inside is identical. Divide the seminar into four small groups of three to four. Within each group, assign two roles: Jurors, who read the passage and respond, and Recorders, who observe and take notes but do not respond emotionally. Give each Juror a private response sheet asking for an emotional-intensity rating, a judgment about whether the perpetrator deserves blame, and a decision about how much of a shared seminar resource—say, a discretionary class-event budget of symbolic points—they are willing to commit to a group protest or solidarity gesture. Emphasize that the commitment is binding only if the Juror judges their reaction to be genuinely about the situation and not merely fictional play.

  Run the activity in three phases. Phase one (20 minutes): groups open their envelopes, read the passage aloud, and Jurors complete their private sheets. Phase two (25 minutes): groups convene to compare allocations. Recorders should track whether emotional intensity correlates with resource commitment, and whether groups with the fiction framing systematically withhold points despite reporting high anger. Phase three (15 minutes): reveal the framing manipulation. Have each group present its allocation pattern without knowing the other groups' frames. Only after all have spoken should the facilitator disclose which groups received which label.

  The debrief (30 minutes) must map specific moments onto parts of the paradox: the private emotional report corresponds to the phenomenology of being moved, the resource-commitment decision corresponds to the cognitive evaluation that the object is real enough to warrant action, and the group-level discrepancy corresponds to the rationality problem—how can the same mental state be both present and withheld based on a belief about origin? Explain why the moral-anger case is harder to stabilize than fear of a movie monster: anger seems to require an actual object of blame, so the paradox bites more sharply when the emotional response includes a normative direction rather than a mere affective jolt. Identify the predictable failure mode: participants will often retroactively downgrade their emotional reports or deny they felt real anger once they learn the text was fiction. The facilitator should treat this revisionism as data about the instability of fictional engagement, not as an error to correct, and should ask what normative work the fiction-label is doing in that revision. Finally, be explicit about what the activity cannot reproduce: the long-term, repeatable stability of fictional emotional engagement across multiple viewings or readings, which the facilitator must supply with a brief theoretical framing at the close—perhaps contrasting one-time reactive anger with sustained aesthetic appreciation—so that students do not conclude that fictional emotions are always self-correcting illusions.

  Include a timeline with minutes allocated, a description of the Recorder role, the rules for binding versus non-binding allocation, and an honest note that the symbolic budget is a proxy for real moral commitment and therefore cannot fully capture the gravity of actual injustice, which the facilitator must acknowledge rather than pretend the game resolves. Do not provide a lecture up front; let the framing cards, the hidden discrepancy, and the revealed allocation gap do the work. End by asking what feature of emotional rationality the activity assumes—belief in the reality of the object—and whether that assumption can be rejected without collapsing the distinction between appropriate and inappropriate anger.
reasoning: |-
  We are designing a 90-minute classroom activity for an upper-level philosophy seminar on the paradox of fiction. The goal is to have students experience the tension between knowing a narrative is invented and still feeling genuine moral anger. We'll use a narrative passage with two framings (documentary vs. fiction) and divide the class into small groups with roles. 

  Timeline:
  - Total: 90 minutes

  Breakdown:
  1. Phase One (20 minutes): Groups open envelopes, read the passage, and Jurors complete private response sheets.
  2. Phase Two (25 minutes): Groups convene to compare allocations. Recorders take notes.
  3. Phase Three (15 minutes): Reveal the framing manipulation and have groups present allocation patterns. Facilitator discloses which groups had which label after all present.
  4. Debrief (30 minutes): Discuss the paradox, map activity to its parts, address the moral anger case, and note the limitations.

  Materials:
  - A narrative passage (ethically charged, ambiguous) about a bureaucratic cruelty.
  - Two types of envelopes: half labeled "verified documentary transcript", half "excerpt from an unpublished dystopian novel written in 2023". The text inside is identical.
  - Private response sheets for Jurors (with emotional-intensity rating, blame judgment, and resource allocation).
  - Recorder observation sheets.

  Group Structure:
  - 4 groups of 3-4 students each.
  - Within each group: 
     - Jurors: 2-3 per group (depending on group size) who read and respond.
     - Recorders: 1 per group who observes and takes notes but does not read the passage (to avoid emotional response). They will track the group discussion.

  Rules for Resource Allocation:
  - The resource is a symbolic class budget (e.g., 100 points per group) that can be allocated to a group protest or solidarity gesture (like donating to a relevant charity, but in this case, it's symbolic). 
  - Jurors are told that the commitment is binding only if they judge their reaction to be genuinely about the situation and not merely fictional play. So, if they feel it's fiction and their reaction is just play, they can choose to allocate 0 points without penalty. But if they feel genuine moral anger, they are expected to commit points as if it were real.

  Activity Details:

  Phase One (20 min):
  - Each group gets an envelope (randomly assigned: two groups get the "documentary" label, two the "fiction" label).
  - Jurors in the group open the envelope and read the passage aloud (so all Jurors hear it). 
  - Recorders do not read the passage and are instructed to avoid engaging with the content emotionally. They wait.
  - Each Juror fills out a private response sheet:
     - Rate emotional intensity (e.g., 1-10 scale) specifically for moral anger/indignation.
     - Judgment: Does the perpetrator deserve blame? (Yes/No, and perhaps a brief reason)
     - Allocation: How many points (out of 100) they are willing to commit to a group protest. They must also indicate whether they consider their reaction genuine (so the allocation is binding) or not (non-binding, so they can allocate but it won't count). However, the instruction says: the commitment is binding only if the Juror judges their reaction to be genuinely about the situation. So on the sheet, they can have:
          - Allocation: ____ points (0 to 100)
          - Check one: 
              [ ] I judge my reaction as genuine (binding commitment)
              [ ] I judge my reaction as not genuine (non-binding, so even if I allocate points, they are not taken from the budget)

  Phase Two (25 min):
  - Groups convene. Jurors share their allocations and reasons. They must decide on a group allocation (which could be the average, sum, or any method they choose; the facilitator does not specify, to see how they negotiate). 
  - Recorders take notes on:
     - The correlation between emotional intensity and resource commitment.
     - Whether the group's framing (which they don't know is shared with others) affects the allocation. Specifically, note if the fiction group members report high anger but then withhold points (i.e., allocate low or mark as non-binding) and if the documentary groups allocate more and mark as binding.
     - Also note any justifications given for allocations.

  Phase Three (15 min):
  - The facilitator reveals that there was a framing manipulation: half the groups had a passage labeled as documentary, half as fiction. The text was identical.
  - Without knowing which other groups had which label, each group presents:
     - Their group allocation (the total points they decided to commit and whether they considered it binding) and the pattern of individual allocations (without naming names) and emotional ratings.
  - After all groups have presented, the facilitator discloses which groups had the documentary label and which had the fiction label.

  Debrief (30 min):
  - The facilitator maps the activity to the paradox of fiction:
     a) The private emotional report (intensity rating) corresponds to the phenomenology of being moved by the narrative.
     b) The resource-commitment decision (especially the binding/non-binding choice) corresponds to the cognitive evaluation that the object is real enough to warrant action.
     c) The group-level discrepancy (between documentary and fiction groups) in allocation despite similar emotional reports corresponds to the rationality problem: how can the same mental state (anger) be both present and then withheld based on a belief about the origin?
  - Highlight the moral anger case: Anger seems to require an actual object of blame. Thus, when the framing is revealed as fiction, participants may feel their anger was inappropriate because there's no real person to blame. This contrasts with fear of a movie monster, which doesn't require the same kind of object (we can fear the representation without believing the monster exists).
  - Predictable failure mode: Participants who were in the fiction groups might retroactively downgrade their emotional reports or deny they felt real anger. Treat this as data about the instability of fictional engagement. Ask: What normative work is the fiction-label doing in that revision? (e.g., it signals that the anger is misplaced because there's no real wrongdoer.)
  - Limitations of the activity:
     - It cannot reproduce the long-term, repeatable stability of fictional emotional engagement (e.g., we can feel anger at Iago every time we watch Othello). 
     - The symbolic budget is a proxy and cannot capture the gravity of actual injustice. The facilitator must acknowledge this and not pretend the game resolves the real-world issue.
  - Theoretical framing at the close: Contrast one-time reactive anger (which might be unstable when the fiction is revealed) with sustained aesthetic appreciation that allows repeated emotional engagement in fiction. Mention that theories like Walton's pretense theory or the notion of quasi-emotions might help explain this stability, but note that the activity was designed to let the paradox emerge without theory first.
  - End by asking: 
     - What feature of emotional rationality does this activity assume? (Belief in the reality of the object of emotion.)
     - Can we reject that assumption without collapsing the distinction between appropriate and inappropriate anger? (This is a puzzle to leave them with.)

  Additional Notes:
  - The Recorder role: The Recorder does not read the passage to avoid emotional involvement. They are there to observe and note the group dynamics and individual justifications. They are the "objective" observers in the group.
  - The narrative passage: Must be vivid and ethically charged, but ambiguous. Example: A story of a bureaucrat who denies a life-saving medical treatment to someone due to a technicality, with enough detail to evoke blame but without clear markers of being real or fictional.

  Implementation:
  - Before class: Prepare the passage and the envelopes. Print response sheets and recorder sheets.
  - In class: Divide students into groups and assign roles. Explain the activity without lecturing on the paradox. Emphasize that the resource allocation is symbolic but that they should take the decision seriously as a reflection of their judgment.

  This structure should allow the paradox to emerge from the activity and the debrief will tie it together.
answer: |-
  ### 90-Minute Classroom Activity: The Paradox of Fiction Through Moral Anger  
  **Aim:** To induce first-hand tension between knowing a narrative is invented and experiencing genuine moral anger, without preemptively introducing theoretical solutions.  

  ---

  #### **Materials**  
  1. **Narrative Passage**: A 300-word vignette describing bureaucratic cruelty (e.g., a hospital administrator denying a refugee child’s emergency care due to paperwork errors). Key features:  
     - Ethically charged (invites blame toward the administrator).  
     - Ambiguous (no clear markers of reality/fiction; e.g., unnamed country, generic institutions).  
     - Identical text for all groups.  
  2. **Framing Envelopes**:  
     - 2 envelopes labeled: **“VERIFIED DOCUMENTARY TRANSCRIPT: Confidential Eyewitness Account”**  
     - 2 envelopes labeled: **“EXCERPT FROM AN UNPUBLISHED DYSTOPIAN NOVEL (2023)”**  
  3. **Role Sheets**:  
     - **Jurors (2–3 per group)**: Receive private response sheets.  
     - **Recorders (1 per group)**: Receive observation checklist.  
  4. **Resource**: A “Class Solidarity Fund” of 100 symbolic points per group (representing a real but small stake, e.g., funds for a class-donated book to a refugee charity).  

  ---

  #### **Timeline**  
  **Total: 90 Minutes**  

  ##### **Phase One: Private Reading & Response (20 min)**  
  - **Setup (5 min)**:  
    - Divide 14 students into 4 groups (two groups of 3, two of 4). Assign roles randomly:  
      - *Jurors*: Read the passage and respond.  
      - *Recorders*: Do **not** read the passage; observe silently.  
    - Distribute envelopes (randomly assign 2 groups “documentary” framing, 2 “fiction”).  
  - **Activity (15 min)**:  
    - Jurors open their group’s envelope and read the passage **aloud**.  
    - Recorders listen but focus on body language (e.g., clenched fists, sighs).  
    - *Jurors complete PRIVATE response sheets*:  
      - Emotional-intensity rating (1–10 scale) for anger/indignation.  
      - “Does the administrator deserve blame?” (Yes/No + one-sentence reason).  
      - “Allocate points (0–100) to the Class Solidarity Fund. Your commitment is **BINDING** only if you judge your anger as genuinely about the situation, not fictional play. If you mark it non-binding, points are symbolic.”  
        - ⬜ **Binding**: Points deducted from fund if protest occurs.  
        - ⬜ **Non-binding**: No deduction, even if points are allocated.  

  ##### **Phase Two: Group Comparison (25 min)**  
  - **Activity (20 min)**:  
    - Jurors share:  
      - Their allocations and whether they chose binding/non-binding.  
      - Emotional ratings and blame judgments (no need to share reasons).  
    - Group task: **Negotiate a consensus allocation** (e.g., average, sum) for their group’s 100-point fund.  
  - **Recorders (5 min)**:  
    - Track on observation sheet:  
      - Correlation: Do higher anger ratings = higher binding allocations?  
      - Note justifications (e.g., “It’s just a story, so I won’t commit real points”).  
      - Watch for systematic withholding in “fiction” groups despite high anger.  

  ##### **Phase Three: Reveal & Present (15 min)**  
  - **Reveal (5 min)**:  
    - Facilitator: “The passage was identical for all. Half were labeled ‘documentary,’ half ‘fiction.’”  
  - **Group Reports (10 min)**:  
    - Each group shares:  
      - Consensus allocation + binding/non-binding status.  
      - Summary of individual anger ratings.  
      - **Do NOT reveal their framing yet.**  
    - After all report, facilitator discloses which groups had which label.  

  ##### **Debrief: Mapping the Paradox (30 min)**  
  *(Facilitator-led discussion; link observations to philosophical tensions)*  
  1. **Phenomenology vs. Cognition (10 min)**:  
     - “When Jurors reported anger, that mirrors the *phenomenology* of being moved. But the binding/non-binding choice reflects *cognitive evaluation*: ‘Is this real enough to act?’”  
     - Ask: *“Why might someone rate anger 8/10 but choose non-binding?”*  
  2. **The Rationality Problem (10 min)**:  
     - Highlight discrepancies: Fiction groups likely showed high anger but low binding commitments.  
     - Paradox: *“How can the same anger feel real, yet be ‘canceled’ by learning the origin is fictional? Why is this harder with moral anger than fear of a movie monster?”*  
       - Point: Anger requires a **blameworthy agent**. If the administrator isn’t real, anger seems irrational. Fear (e.g., of a monster) can be a reflex without a real target.  
     - Predictable failure mode: *“Did anyone downgrade their anger after learning it was fiction? What does this ‘revisionism’ reveal?”*  
       - Treat as data: The fiction label acts as a **normative corrective** (“I shouldn’t feel this way”).  
  3. **Limitations & Theoretical Bridge (10 min)**:  
     - Acknowledge: Symbolic points can’t capture real injustice; this is a proxy.  
     - Contrast with stable fiction engagement: *“We feel anger at Iago in Othello repeatedly. Why doesn’t the paradox ‘correct’ that?”*  
       - Brief theory: One-time anger is reactive; sustained engagement relies on **aesthetic appreciation** (e.g., moral outrage as part of narrative absorption).  
     - Final question: *“Does rejecting ‘belief in reality’ as a requirement for anger collapse the line between appropriate/inappropriate anger?”*  

  ---

  #### **Critical Design Notes**  
  - **Recorders’ Role**: Ensure they do not engage emotionally. Their checklist:  
    - Tally anger ratings vs. binding choices.  
    - Note quotes showing awareness of framing (e.g., “It’s fake, so I won’t commit”).  
  - **Resource Rules**:  
    - **Binding commitment**: Points are deducted if the group protest occurs (e.g., buying a book for a relevant charity).  
    - **Non-binding**: Points signal “would in real life” but have no consequence.  
    - *Why this works*: Small stakes create pressure to align actions with beliefs.  
  - **Ethical Safeguards**:  
    - Narrative must be severe enough to evoke anger but not traumatizing (e.g., no graphic violence).  
    - Debrief explicitly: “This activity simplifies real injustice; the points are symbols.”  
  - **No Pre-Theory**: Avoid terms like “quasi-emotion” until debrief. Let the allocation gap provoke the paradox.  

  ---

  #### **Expected Outcomes**  
  - Fiction groups will show high anger ratings but low binding allocations, creating a visceral “gap” between emotion and action.  
  - Documentary groups may moralize allocations (“We must act!”).  
  - Revisionism in debrief (e.g., “I wasn’t *really* angry”) reveals the paradox’s instability.  
  - Final insight: **Moral anger in fiction challenges emotional rationality**—it demands a real target but persists without one.
