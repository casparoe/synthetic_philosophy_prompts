answer: |-
  You've described a remarkably coherent structural pattern that does indeed recur across domains, and while no single established term perfectly encapsulates it, philosophers and systems theorists have grappled with its facets under several related concepts. The sharpest characterisation focuses on its **ontological dependence combined with conceptual hierarchy and self-sustained inviolability**.

  **Core Definition & Key Features:**
  This is a **stratified autogenic system with a self-enforcing inviolate core**. Its defining characteristics are:

  1.  **Ontological Dependence:** The meta-level (rule-setting/guarding) is *implemented* entirely within the base-level system's mechanics. It has no independent ontological ground.
  2.  **Conceptual Hierarchy:** Despite its ontological dependence, the meta-level is *conceptually* treated as superior to and governing the base-level rules.
  3.  **Self-Sustained Inviolability:** A specific core element (rules, clauses, principles) is designated as absolutely protected from revision *by the meta-level itself*. Crucially, this protection is *not* enforced externally but by the *internal logic, procedures, or institutional power* of the very system it is part of. This core acts as the axiomatic foundation the system assumes.
  4.  **Functional Non-Collapse:** The hierarchical distinction between levels persists operationally and conceptually; it avoids collapsing into simple circularity or pure self-reference because actors *treat* the levels as distinct and the hierarchy as real, allowing the system to function.

  **Distinction from Related Concepts:**

  *   **Bootstrap Paradox:** While bootstrapping involves self-creation/justification, it lacks the *persistent hierarchical distinction* and the specific *self-protected, inviolable core* within a functioning system. Your pattern maintains operational levels.
  *   **Vicious Circularity:** Your pattern avoids *logical* contradiction in operation (it *can* function). The tension is ontological and practical, not necessarily formal. The levels don't simply loop; they maintain a functional hierarchy *despite* their mutual dependence.
  *   **Gödelian Self-Reference:** Gödel deals with formal systems' inherent limitations in proving their own consistency. Your pattern is broader, applying to institutional, legal, and computational systems. While self-referential, its key feature isn't incompleteness but the *specific structure of hierarchical control with a self-declared, internally enforced inviolate foundation*. Gödelian systems don't necessarily have a "guarding" meta-level *within* the system itself that's also bound by the rules.
  *   **Ordinary Hierarchical Control:** In standard hierarchies, the higher level often possesses independent authority or exists in a different domain. Here, the meta-level's authority and existence are entirely *derived from* and *enacted within* the base level it governs, creating the dependency/superiority tension absent in external hierarchies.
  *   **Münchhausen Trilemma (Justification):** This concerns the regress problem of justifying beliefs. Your pattern is about *operational control and rule revision* within a functioning system, featuring a specific structural hierarchy and a self-protected core, not just epistemic justification.

  **Why there's no single term:**
  The phenomenon sits at the intersection of:
  *   **Legal Philosophy:** "Constitutional autochthony" (self-origination) touches on it, but doesn't emphasise the inviolate core or the meta-level dependency. "Eternity clauses" name the core but not the systemic structure.
  *   **Systems Theory:** Concepts like "self-organisation" or "autopoiesis" (self-creation) capture the dependence but miss the rigid hierarchy and inviolable core. "Recursion" is present but too broad.
  *   **Logic/Computer Science:** "Reflection" (a system inspecting/modifying itself) or "meta-circular interpreters" are analogous but lack the enforced inviolability and conceptual hierarchy aspects. Type systems sometimes have "base types," but without the control dynamic.

  **The Sharpest Description:**
  The phenomenon is best defined as: **A functionally hierarchical system where the authority and mechanics of the meta-level (responsible for governing and revising base-level rules) are ontologically dependent upon and implemented within the base-level itself, while simultaneously asserting and internally enforcing the absolute inviolability of a designated foundational core that constrains even the meta-level's revisionary power.**

  **The Boundary Condition:**
  The critical feature distinguishing this pattern is the **coexistence of three elements**: (1) meta-level implementation *within* the base, (2) conceptual meta-level *superiority over* the base, and (3) an *internally sustained, self-declared inviolate core* that binds the meta-level. Remove any one, and the distinctive tension dissolves (e.g., an externally enforced core removes the self-sustaining aspect; an externally implemented meta-level removes the ontological dependence).

  This structure represents a profound attempt to achieve stability and self-grounded authority within a closed system, inevitably creating a foundational paradox where the ultimate guarantor of the system's order is simultaneously its most vulnerable, self-imposed assumption.
