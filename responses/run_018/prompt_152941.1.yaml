answer: |-
  Here’s a 90-minute seminar design focusing on the tension between relational constitution and normative obligation in personhood, using an asymmetric caregiving scenario:

  **Seminar Title:**  
  *The Weight of Connection: Personhood and Obligation in Asymmetric Care*

  **Core Tension:**  
  Ontological claim ("Personhood is constituted through reciprocal relations") vs. Normative claim ("Relations generate obligations of care"), distorted by institutional mediation and asymmetry.

  ---

  ### **Timeline (90 mins)**
  1. **Setup & Role Assignment (10 mins)**  
  2. **Phase 1: Mapping Relationships (15 mins)**  
  3. **Phase 2: Resource Allocation Deliberation (30 mins)**  
  4. **Phase 3: The Revelation (5 mins)**  
  5. **Debrief & Conceptualization (30 mins)**

  ---

  ### **Scenario: The Respite Dilemma**  
  *Context:* "Alex" (adult, severe cognitive disability, non-verbal) exists in a state-mediated care ecosystem. Their sole primary relational anchor is Jordan (caregiver for 12 years), compensated below market rate by the state. Alex’s personhood is expressed *only* through relational cues with Jordan (e.g., eye contact, calmed agitation). A new state program offers **4 weekly respite hours** (transferable to any provider) OR **one assistive communication tablet** (requires Jordan’s training). Resources are scarce: Only ONE option can be allocated to Alex’s case file this quarter.

  ---

  ### **Roles & Mandates (12 Students: 3 per role)**  
  1. **Jordan (Caregiver):**  
     *Principle:* "Alex *exists* through our sustained bond. Without my continuity, Alex ceases to be *Alex*."  
     *Goal:* Secure respite to prevent burnout. Tablet is useless without your training time (which respite would enable).  

  2. **Case Manager (State Institution):**  
     *Principle:* "Resources must maximize measurable welfare per taxpayer dollar."  
     *Goal:* Allocate to the claimant with highest *independent* need score. Tablet offers long-term efficiency. Respite is a "staff benefit."  

  3. **Taylor (Alex’s Sibling):**  
     *Principle:* "Alex has inherent dignity *apart* from Jordan. State resources belong to *Alex*, not the relationship."  
     *Goal:* Claim the tablet as Alex’s autonomous right. Respite "pays Jordan for what family should do."  

  4. **Riley (Disability Advocate):**  
     *Principle:* "To treat Alex as separable from Jordan is ontological violence. Remove Jordan, and Alex’s personhood collapses."  
     *Goal:* Block the tablet (it "individualizes" Alex). Respite must be framed as *Alex’s* relational sustainment.  

  ---

  ### **Rules of Engagement**  
  - **No Compromise:** Must argue for FULL allocation of one resource to Alex’s case (no splitting).  
  - **Principle-First:** Justify using role’s core principle, not practicality.  
  - **Consensus Rule:** Unanimous agreement on *the grounds for allocation* (e.g., "We award the tablet because persons own their tools"), NOT just the outcome.  
  - **Payoff Mechanism:**  
    - **Institutional Efficiency Score (IES):** Case Manager tracks $/impact metrics.  
    - **Relational Integrity Score (RIS):** Advocate tracks threats to the Jordan-Alex bond.  
    *→ Scores are incommensurable: High IES often lowers RIS, and vice versa.*

  ---

  ### **Phase 1: Mapping Relationships (15 mins)**  
  *Task:* Draw a relational map including:  
  - Alex, Jordan, State, Family, Community  
  - Arrows showing direction of dependence/obligation.  
  *Prompt:* "Identify where personhood 'resides' in your map."  
  *Facilitator Note:* Most groups will center Alex’s personhood *between* Alex and Jordan → foreshadows the constitutive view.

  ---

  ### **Phase 2: Resource Allocation (30 mins)**  
  *Pressure:* Reach consensus in 25 mins or forfeit the resource.  
  *Predictable Failure:*  
  - Groups default to liberal rights-language (Taylor’s "Alex’s right to the tablet" + Case Manager’s efficiency metrics).  
  - **Facilitator Intervention:**  
    - To Jordan/Riley: *"If Alex gets the tablet without Jordan’s consent, how does that alter who Alex is?"*  
    - To Taylor/CM: *"If Alex’s personhood requires Jordan, does Alex ‘own’ respite hours meant to sustain Jordan?"*  
    - *DO NOT LECTURE. Use role-specific Socratic questions.*

  ---

  ### **Phase 3: The Revelation (5 mins)**  
  After allocation, announce:  
  *"Jordan submits resignation, effective immediately. State policy requires re-evaluating Alex’s entitlement. The allocated resource may be revoked if deemed ‘non-transferable’ to a new caregiver."*  
  → Tablet awardees: Alex’s "independent" resource is now void without Jordan.  
  → Respite awardees: Jordan’s departure collapses the relation Alex’s respite was meant to sustain.  
  *"Re-vote: Would you allocate the same resource knowing this?"* (No discussion; reveal split votes).

  ---

  ### **Debrief (30 mins)**  
  1. **Map the Tension:**  
     - *Phase 1 (Mapping):* Highlighted **constitutive relationality** (personhood in the "between").  
     - *Phase 2 (Allocation):* Forced **normative obligations** (who "deserves" resources?).  
     - *Phase 3 (Revelation):* Exposed the **crisis** — individualizing Alex dissolves relationality; relationalizing Alex voids individual claims.  

  2. **Visceral Conflict Moment:**  
     *"When did you feel the *pull* between sustaining the person (relation) and fulfilling obligations (to the individual)? Was it Jordan’s resignation? The first deadlock?"*  

  3. **Ubuntu Distortion:**  
     *"This scenario perverts classic relational theories by making the bond:*  
     - ***Dyadic*** (not communal),  
     - ***Asymmetric*** (Alex cannot reciprocate),  
     - ***State-mediated*** (obligations bureaucratized).  
     *Where would mutual, communal reciprocity reshape this dilemma?"*  

  4. **Ontological Gap Admission:**  
     *"This exercise makes you *feel* how personhood might be co-constituted, but it cannot replicate the profound truth that selves *are relations* — not just supported by them. In real relational ontologies, without Jordan, Alex isn’t ‘alone’; a core part of Alex’s being ceases to exist. That depth requires philosophical articulation beyond role-play."*

  ---

  ### **Honest Notes for Facilitator**  
  - **Predictable Flaw:** First groups will reach quick consensus using individual rights + utility (Taylor + Case Manager alliance).  
  - **Intervention:** Restart Phase 2 if consensus is too rapid: *"Jordan and Riley, you’ve been outvoted. Defend why this allocation destroys Alex’s personhood, not just their care."*  
  - **Scoring Purpose:** IES/RIS conflict prevents "easy trade-offs." Point out when groups try to merge metrics.  
  - **Limitation:** The scenario cannot simulate *lived* co-constitution; it only illustrates the *crisis* when relationality is instrumentalized. Verbally emphasize: *"Constitution is not dependency; it is mutual becoming."*

  **Outcome:** Students exit grappling with the irreducibility of the tension — and the political urgency of designing institutions that don’t force a choice between ontological coherence and ethical obligation.
