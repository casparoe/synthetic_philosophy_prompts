  okay so me and my roommate got into it last night over beers about Godel's theorems and whether they actually mean anything outside of pure math. he kept insisting that since LLMs are formal systems they can never understand their own consistency, which sounds like that old Lucas-Penrose argument but now applied to chatgpt. i told him that Godel died back in 78 and never saw neural nets or climate models, but then he turned around and asked what Godel himself would have said about people using his theorems to prove AI can never be conscious, or to claim economics is fundamentally incomplete, or even that physics needs some non-computable ingredient to be fully consistent.

  so heres the actual question: if Kurt Godel were somehow alive today and saw all these modern takes—like people citing incompleteness to argue large language models hit a hard epistemic ceiling, or that social science can never have a complete predictive theory, or that climate models are self-undermining in some formal sense—what do you think his reaction would actually be? im not asking for "he'd be skeptical"; i want something specific given his platonism and that weird mix of rationalism and mysticism he had. specifically, how would he rank these outside-math applications in terms of legitimate analogy versus total misunderstanding? and do you think he'd see the AI/consciousness version as closer to his own private views about the mind not being a machine, or would he reject it as sloppy analogizing? like, who would he be more annoyed with—the AI researchers or the physicists?
