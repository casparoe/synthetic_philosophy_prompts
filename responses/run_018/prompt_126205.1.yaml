answer: |-
  Here's a breakdown of *Pretty Woman* through the lens of sex work policy models, analyzing Vivian's journey and the film's absences:

  **The Core Policy Lenses Applied to Vivian's Reality:**

  1.  **Nordic Model (Criminalize Buyers, Decriminalize Sellers, Focus on "Rescue/Exit"):**
      *   **Fantasy Alignment:** Vivian's arc *seems* tailor-made for this: Edward (the buyer) is presented as her savior, ultimately "exiting" her from sex work. It reinforces the core Nordic tenet: demand (buyers like Edward pre-transformation) *is* the problem, and removing the worker is the solution.
      *   **Critical Reality Check:** Vivian's experience *before* Edward highlights the model's limitations for workers:
          *   **No Labor Rights:** Her vulnerability on the street (violence, no contract, unstable income, Kit's injury) isn't magically solved by decriminalizing *her*. The model focuses on exit, not improving conditions *for those still working* or granting labor rights.
          *   **"Rescue" Dependency:** Her "exit" is entirely dependent on the benevolence of a wealthy buyer, not state support, social services, or economic alternatives – reflecting the model's reliance on individual "rescue" over systemic change.
          *   **Stigma Persists:** Even "decriminalized," Vivian faces intense stigma (polo match), hindering access to other work or services, a flaw not addressed by the Nordic model.

  2.  **German/Dutch Legalization (Licensed Brothels, Regulation):**
      *   **Vivian's Invisibility:** Vivian operates entirely outside any regulated system. She's independent and street-based.
      *   **What's Missing:** The film shows *none* of the structures this model creates:
          *   **No Brothels:** No safe, licensed workplace with security, hygiene standards, or management oversight.
          *   **No Contract/Regulations:** Her arrangement with Edward is purely informal and exploitable (bathrobe/necklace scene). Legalization would mandate clear contracts, payment terms, and potentially health checks (though often criticized as intrusive).
          *   **Hotel Manager ≠ Regulator:** Mr. Thompson acts based on hotel policy and Edward's status, *not* as a labor inspector enforcing sex work-specific regulations. His intervention is about protecting the hotel's clientele/image, not Vivian's rights as a worker.

  3.  **NZ Decriminalization (Treating Sex Work as Labor, Occupational Health & Safety, Peer Networks):**
      *   **Illustrating the Need:** Vivian's experiences scream the *need* for this model:
          *   **Labor Rights Gap:** No contract, no recourse for unsafe conditions (street violence), no ability to negotiate terms formally (bathrobe scene = power imbalance), no workers' compensation for Kit's injury. NZ aims to fix this by granting standard employment rights.
          *   **Peer Support Absence:** Kit is her friend, but there's no organized peer network for safety, information sharing, or collective bargaining. NZ fosters these through decriminalization.
          *   **Lack of Legal Personhood:** Vivian is invisible to systems that could protect her *as a worker*. She relies entirely on Edward's social capital (hotel access, legal help for Kit, confronting Stuckey). NZ grants legal personhood within labor frameworks.
      *   **The Film's Omission:** The movie provides a perfect case study *for* decriminalization by showcasing the *absence* of everything it provides: safe workplaces, contracts, peer networks, legal recourse, and dignity as a worker.

  **Mapping Key Scenes to Policy Realities:**

  *   **Polo Match Humiliation:**
      *   **Nordic:** Highlights stigma against sellers, but focuses on Vivian's pain, not criminalizing the snobby buyers. Shows why "exit" is desired but doesn't challenge the stigma enabling it.
      *   **German/Dutch:** Might occur regardless, but within a licensed venue, management *might* intervene based on conduct rules (unlikely against wealthy patrons).
      *   **NZ:** Worker dignity is central. Vivian could potentially complain to management (as in any service job) or a peer union about client harassment in a workplace context. Stigma fight is part of the model.
      *   **Film's Take:** Edward's personal vengeance solves it. *Policy is irrelevant; individual power wins.*

  *   **Bathrobe/Necklace Negotiation:**
      *   **Nordic:** Ignores the negotiation entirely (it's demand!). Focuses on Vivian needing escape, not fair terms.
      *   **German/Dutch:** A formal contract *should* exist, defining services, payment, and boundaries upfront. Renegotiation might be structured.
      *   **NZ:** Clear labor rights empower Vivian to set boundaries and enforce agreements. Negotiation is legitimate work discussion.
      *   **Film's Take:** Raw power imbalance resolved by Edward's sudden generosity/remorse. *Labor rights are replaced by buyer's whims.*

  *   **Hotel Manager Stepping In (re: Vivian's attire/behavior):**
      *   **Nordic:** Irrelevant to the model's focus (criminalizing buyers).
      *   **German/Dutch:** Manager *might* enforce brothel/venue conduct rules, but Vivian isn't in that system. He acts as a *de facto* regulator based on *hotel* policy, not sex work law.
      *   **NZ:** Manager's role would be like any service industry – enforcing general establishment rules, not specifically moral policing a sex worker. Vivian's rights as a guest/worker would be clearer.
      *   **Film's Take:** Manager represents societal judgment and gatekeeping. Edward's money/power overrules him. *Institutions bow to wealth, not rights.*

  **The Romance as Structural Blindspot:**

  *   **Hiding Institutions by Design:** The fairy-tale structure **absolutely makes collective/policy solutions invisible.** The film argues that Vivian's problems (vulnerability, lack of rights, stigma, economic need) are solved *only* by:
      1.  **Individual Wealth & Power (Edward):** Overcomes hotel policy, provides safety/money, enforces vengeance.
      2.  **Romantic Love:** Provides emotional salvation and justifies "exit."
      *   **Why Institutions are Absent:** Showing a functioning brothel (German), a peer support group (NZ), or a labor inspector (NZ) would:
          *   Undermine Vivian's portrayal as uniquely trapped and in need of "rescue."
          *   Suggest solutions exist *outside* romantic fairy tales and billionaire saviors.
          *   Legitimize sex work as labor, conflicting with the "rescue/exit" fantasy.
          *   Introduce complexities that distract from the central romance.

  *   **Edward's Transformation: Red Herring?**
      *   **Yes, fundamentally.** His personal growth (becoming less exploitative) *is* presented as the solution. But:
          *   **Doesn't Scale:** One "good" buyer doesn't change the system for Kit or others.
          *   **Ignores Root Causes:** It doesn't address Vivian's economic precarity, lack of skills/opportunities, or the structural stigma she faced.
          *   **Perpetuates Dependency:** "Good" buyers/rescuers are still the solution, not worker rights or social safety nets.
          *   **Answers Institutional Questions?** No. It bypasses them entirely. The institutional question ("How can society protect and empower sex workers?") is answered with "Find a rich, reformed prince." His transformation is the *red herring* distracting from the need for systemic change.

  **Conclusion:**

  *Pretty Woman* is a perfect encapsulation of the **Nordic Model fantasy** ("Buyer rescues worker") but inadvertently showcases the **urgent need for NZ-style decriminalization** through Vivian's total lack of labor rights, safety nets, and legal personhood. The romantic fairy-tale structure **isn't just Hollywood fluff; it's structurally necessary** to obscure the institutional realities of sex work. It replaces brothels, peer networks, contracts, and inspectors with the power of love and wealth, making Edward's personal transformation the ultimate (and deeply inadequate) answer while rendering collective solutions and worker agency invisible. The film's absences aren't accidental; they are the scaffolding holding up the fantasy.
