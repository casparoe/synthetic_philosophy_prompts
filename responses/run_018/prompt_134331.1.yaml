  Hmm, the user clearly knows their stuff—they’re targeting grad students and specialists, so no fluff. Key demands: avoid rehashing simultaneity basics, press on literature pain points, and include exact scenarios they listed. They’re likely a podcast host or academic preparing for a high-level discussion. 

