  First, I need to recall the presupposed theory in parliamentary democracy. The two-layer structure—voters elect reps, but parties control them through whipping and pre-selection—suggests that individual political judgment isn't trusted on its own. It assumes that without collective coordination, decisions could be chaotic or inefficient, and that parties are necessary for strategic unity and filtering candidates to ensure competence and loyalty. This aligns with theories like elite theory or rational choice, where parties aggregate interests and provide stability. So, the presupposition is that representation requires mediated selection and disciplined action to function effectively in a large society.

  Now, applying Simone Weil's critique. She argued that parties manufacture artificial passions, like ideology, that drown out local, rooted deliberation. Her work, especially in "On the Abolition of All Political Parties," criticizes parties for creating a "collective thought" that suppresses individual reason and genuine community engagement. For the mechanisms: whipping forces reps to vote along party lines, which directly manufactures artificial unity and displaces their independent judgment. Pre-selection of candidates filters out those who might challenge the party's agenda, reinforcing this by limiting choices to party-approved figures. But the interaction is key—pre-selection ensures only loyal candidates get through, and whipping keeps them in line, so together they form a feedback loop that entrenches party control and stifles authentic representation.

