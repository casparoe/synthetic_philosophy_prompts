prompt: |-
  Last night my friend and I argued for hours about whether Buddhist anatta actually resolves anything that analytic personal-identity debates leave hanging, or whether it is just a different vocabulary for the same dissolution. She insisted that if you take the Abhidharma aggregates seriously, the closest Western institutional analogue is not psychological continuity or animalism but corporate legal personality—an entity that maintains obligations and rights across complete turnover of members and lacks any substantive substrate beneath its charter. I want you to work this out rigorously.

  You are a philosopher with expertise in both Abhidharma metaphysics and analytic theories of personal identity, writing for a graduate seminar. Before you begin, take a moment to brainstorm: list the five skandhas with one-sentence descriptions; sketch the core claim of psychological-continuity theory, animalism, and narrative identity; and identify three legal-corporate concepts (charter, succession of officers, dissolution, continuity of obligation) that might serve as translation targets.

  Then do the following. First, restate the Buddhist doctrine of anatta—specifically the analysis of persons into the five skandhas, the denial of a permanent underlying substrate, and the role of pratītyasamutpāda—using only the vocabulary of corporate legal identity: incorporation, charter, succession, continuity of obligation, dissolution, and legal personality. Be precise: say what corresponds to form (rūpa), feeling (vedanā), perception (saṃjñā), mental formations (saṃskāra), and consciousness (vijñāna). Second, do the same for the three analytic theories: translate psychological-continuity theory, animalism, and narrative identity into that same legal-corporate vocabulary, noting for each where the translation is straightforward, where it requires distortion, and where the theory has no expression at all in those terms.

  Finally, give the residue report: which parts of anatta survive translation into legal vocabulary intact, which are distorted, and which have no legal counterpart whatsoever. Then reverse the question: does the corporate framework reveal something about anatta that the analytic debate misses—perhaps about the continuity of moral obligations across change—or does the residue show that corporate analogies are fundamentally misleading? End with what this comparison adds to the philosophical debate that argument alone does not capture, and say whether the honest critic must concede that Buddhism and corporate law are talking past each other or that they converge on a shared insight about substrate-independent continuity.

  After your main prose response, provide a brief structured summary in JSON format with exactly these fields and schema: "translation_fidelity" (an object mapping the four positions—buddhist_anatta, psychological_continuity, animalism, narrative_identity—to ratings "high", "medium", or "low"); "residue_type" (an object with the same four keys, each value a one-phrase description of what is lost or distorted); "legal_analogue_accuracy" (a string, either "illuminates" or "obscures", with a brief justification in a nested "reason" field); and "seminar_takeaway" (a single string of one sentence). Make sure your reading is faithful in both directions: do not reduce Buddhism to a corporate manual, and do not force legal concepts to do metaphysical work they cannot support.
