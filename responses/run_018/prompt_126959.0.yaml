answer: |-
  Based on my analysis of the phenomenon you describe—where the defense of an unmarked category relies on its familiarity to mask asymmetry, and analogical transposition (like Hofstadter’s) reveals the inconsistency while defenders reject the analogy without substantive engagement—**no single established term fully captures this specific failure mode**. However, it sits at the intersection of well-studied concepts. I’ll define it precisely, coin a term, and demarcate its boundaries.

  ---

  ### Step 1: Brainstorming & Conceptual Mapping
  **Two Concrete Analogies Mirroring the Pattern:**
  1.  **Ableist Default:** Defending "walking" as the neutral term for locomotion (e.g., "Let’s go for a walk" includes wheelchair users). Objections are dismissed as "political correctness." Transpose: Argue that "seeing" is the neutral default for vision ("We all see the truth" includes blind people). The defense collapses, revealing the asymmetry.
  2.  **Heteronormative Default:** Using "marriage" unmarked to mean heterosexual union, dismissing "same-sex marriage" as redundant specification. Transpose: Argue that "Christian prayer" is the neutral default for workplace religious accommodation ("We allow prayer breaks"), and specifying "Muslim prayer" is merely descriptive. The inconsistency in defense becomes stark.

  **Nearest Established Concepts & Why They Fall Short:**
  -   **Markedness:** Describes asymmetry (e.g., "actor" unmarked vs. "actress" marked) but doesn’t address the *defensive rhetorical strategy* or the role of analogy in exposing it.
  -   **False Analogy:** The transposition here is *deliberately valid* to expose hypocrisy; defenders dismiss it as false without justification, which is the core problem.
  -   **Status Quo Bias:** Explains preference for existing norms but doesn’t capture the *immunity to analogical critique* or linguistic mechanics.
  -   **Motte-and-Bailey:** Involves retreating to a defensible position ("motte"). Here, defenders *never retreat*; they dismiss the analogy while staying in the "bailey" (unmarked default).
  -   **Epistemic Injustice (Fricker):** Relevant (testimonial injustice in dismissing objections), but not specific to linguistic defaults/analogy.
  -   **Hegemony (Gramsci):** Explains cultural dominance but lacks the linguistic diagnostic mechanism.

  **Key Differentiating Feature:**  
  The phenomenon uniquely combines:  
  1.  **Invisibility through Familiarity:** The unmarked category functions as an unquestioned background.  
  2.  **Diagnostic Transposition:** A structurally identical analogy applied to a *different* asymmetry (e.g., race) exposes the inconsistency.  
  3.  **Immunity via Dismissal:** Defenders reject the analogy *without engaging its structural validity*, solely because the original category’s asymmetry is normalized.  

  ---

  ### Step 2: The Coined Term & Definition
  **Term: Default Inertia Shield**  
  *Definition:* A rhetorical defense mechanism where an unmarked linguistic category’s perceived neutrality is preserved by its familiarity, rendering its constitutive asymmetry invisible. This shield deflects structural critiques via analogical transposition by dismissing the analogy as invalid *without addressing the parallel*, relying solely on the normalized status of the original default. The shield is only pierced when the transposition targets a socially salient asymmetry where the defender’s own position rejects such defaults (e.g., racial asymmetry).

  **Boundary Conditions:**  
  1.  **Distinguishing from Ordinary Markedness:**  
      - Markedness is a *description* of asymmetry. Default Inertia Shield is the *rhetorical strategy* defending that asymmetry by weaponizing familiarity.  
      - *Example:* Markedness notes "waiter" is unmarked; Default Inertia Shield is arguing "’waiter’ includes women" while dismissing "’white’ includes Black people" as absurd without explanation.  

  2.  **Distinguishing from Motte-and-Bailey:**  
      - Motte-and-Bailey involves abandoning an indefensible claim for a safer one. Default Inertia Shield never retreats; it doubles down by invalidating the diagnostic tool.  
      - *Example:* Defending "mankind" as "etymologically neutral" (bailey) but retreating to "it’s just tradition" (motte) *is* motte-and-bailey. Insisting the racial analogy is "completely different" without analysis *is* Default Inertia Shield.  

  3.  **Distinguishing from False Analogy:**  
      - In false analogy, the comparison *is* flawed. Here, the transposition is *structurally sound*; its dismissal is the shield.  
      - *Example:* Comparing gender asymmetry to racial asymmetry in language defaults is valid. Comparing it to asymmetry in chemical elements (e.g., "oxygen is default gas") *is* false analogy.  

  ---

  ### Step 3: Application & Edge Cases
  **Case Where the Pattern Clearly Applies:**  
  **Context:** Defending the use of "he" as a generic pronoun.  
  **Defense:** "It’s grammatically neutral and traditional; objections impose ideology on language."  
  **Transposition:** Argue "white" as a generic term for people ("White must adapt to changing demographics").  
  **Shield Activation:** Dismissal: "Race and gender are incomparable!" (without linguistic/social analysis).  
  **Why it Fits:** Asymmetry is normalized for gender but not race; the analogy pierces the shield, yet the defense relies on familiarity to deflect.  

  **Case Where it Does NOT Apply:**  
  **Context:** Defending "doctor" as unmarked for physicians (vs. "female doctor").  
  **Defense:** "’Doctor’ is gender-neutral; specifying gender is only relevant when unusual."  
  **Transposition:** Argue "nurse" should be unmarked for all nurses (vs. "male nurse").  
  **Rejection Validity:** If defenders engage the parallel (e.g., "Medical hierarchies differ: ’doctor’ was *always* unmarked, while ’nurse’ was feminized historically"), the analogy is addressed on structural grounds. No shield exists if the dismissal is substantive.  
  **Key Difference:** The rejection hinges on *engaged analysis*, not mere familiarity-inertia.  

  ---

  ### Conclusion
  The **Default Inertia Shield** is the mechanism by which the familiarity of an unmarked linguistic category (e.g., masculine generic) grants it immunity to structural critique via analogical transposition. Defenders exploit this familiarity to dismiss transpositions (e.g., racial defaults) *without engaging the parallel*, preserving the asymmetry. It is not merely markedness (which it weaponizes), motte-and-bailey (no retreat occurs), or false analogy (the transposition is valid). Its edges are defined by the dismissal of the diagnostic analogy without substantive justification, relying solely on the default’s normalized status. Hofstadter’s satire works precisely because it weaponizes transposition to shatter this shield—revealing that resistance to the analogy is resistance to confronting hegemony, not a logical rebuttal.
