  For the camps' evaluation: unity theories will flunk on confabulation and asymmetric access, while division theories struggle with cross-cueing integration. Both stumble on pre/post-surgery continuity. The user's implied challenge? Find a theory that doesn't treat these as binary. Maybe graded unity or access-based approaches could thread the needle, but that's beyond scope.

