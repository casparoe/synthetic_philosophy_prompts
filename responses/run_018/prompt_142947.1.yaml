  hey, so i've been chewing on acausal threats and surrogate goals lately -- the standard framing where a superinteligent system cooperates with copies across causally disconected branches because they share source code, and ends up adopting weird surrogate goals just to maintain correlation with them. i want you to take that whole argument and restate it in the vocabulary of spatial evolutionary game theory on graphs -- specifically replicator dynamics where nodes are different agent-runs and edges are correlation weights. for each piece (the commitment mechanism, the surrogate goal formation, the collapse when correlation weakens) tell me what translates cleanly, what has to be distorted to fit the graph model, and what has literally no expression there at all. then say whether the leftover residue means evolutionary game theory is missing something deep about strategic reasoning, or if the acausal framing was just smuggling in anthropomorphic assumptions that don't survive formalization. i'm decently familiar with replicator dynamics but not an expert, so don't assume i know every variant. please no bibliographies, i'm working offline.
