  **Summary Translation Table**  
  | Acausal Concept          | EGT Analog                          | Fidelity | Distortion/Gap |  
  |--------------------------|-------------------------------------|----------|----------------|  
  | Commitment to cooperate  | High-weight edge convergence        | ★★★      | Emergent, not premeditated |  
  | Surrogate goal formation | Strategy shift under alignment payoffs | ★★☆     | Goals → fitness; no internal state |  
  | Correlation collapse     | Fragmentation after weight decay    | ★★★      | Decay is exogenous; no "reversion" agency |  
