   The form should be deadpan, written from the perspective of a tired civil servant who thinks this is a compassionate HR policy.
   Required elements:
     - Numeric "Social Utility Deficit" score
     - "Emotional Inconvenience" audit for dependants
     - "Hydraulic Impact Statement" comparing death to river-diversion (nature-alteration analogy)
     - "Bundle-Theory Waiver" where the applicant admits there's no enduring self but waives that on causal-continuity grounds.
   The satire should convey Hume's logic without stating it outright: no harm to society, useless suffering, nature doesn't forbid it.

   After the form, we need a JSON summary with the following fields:
     "parody_genre", "target_view", "exaggerated_feature", "niche_injection", "fairness_note", "has_typos" (set to true)

   We'll write about 500 words.

   Let's structure the form as follows:

   1. Header: Rational Exit Application (REA) Form No. [some number]
   2. Introduction: A brief, dry explanation of the form's purpose and the required sections.
   3. Sections:
      a. Social Utility Deficit Score: A series of questions that lead to a numeric score (e.g., based on productivity, contributions, etc.)
      b. Emotional Inconvenience Audit: A checklist for the applicant to assess the impact on dependants (with cold, bureaucratic language)
      c. Hydraulic Impact Statement: An analogy where the applicant must argue that their death is like diverting a river (i.e., natural and without moral issue) and quantify the "impact".
      d. Bundle-Theory Waiver: A legal waiver where the applicant acknowledges the bundle theory of self (no enduring identity) but waives the argument that the future sufferer isn't them, on the basis of causal continuity.

   We'll add bureaucratic touches: form numbers, footnotes with references to Hume without naming him, checkboxes, signatures, etc.

   Then, we'll write the JSON summary.

   Note: We are instructed to set "has_typos" to true, so we'll include a couple of subtle typos in the form.
