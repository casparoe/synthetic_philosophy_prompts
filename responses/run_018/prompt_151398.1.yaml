  hey, i moved to berlin recently and my landlady keeps saying 'ordnung muss sein' whenever i hang laundry on the balcony, like its a moral law rather than just a house rule. back in ohio people always said 'follow your conscience' when they broke a small rule, and now im wondering which idea actually holds up. can you list exactly five different precise things 'ordnung muss sein' could be claiming — like its about social coordination, or kantian duty, or just fear of chaos, or respecting strangers — and for each say if its trivial, actually defensible, or false, and whether that version really beats the american conscience thing? do it in exactly five numbered items, one or two sentences each, no intro or outro.
