  the exam should ask students to evaluate this argument in about 800 words, with 90 minutes. they should specifically address: (a) whether there's a hidden slide between "all possible target functions" in the mathematical sense and "all physically possible worlds" or computable functions; (b) whether NFL applies to real-world induction once physical symmetries constrain the problem space; (c) whether accepting NFL actually strengthens Hume or misapplies a result about search algorithms to epistemic justification; and (d) whether a "local" or domain-restricted version of NFL saves the argument.

