  **C-grade (9-12):** Superficial treatment, significant gaps, or major errors (e.g., conflating concepts).  

  **D/F (0-8):** Fails to address multiple points, misunderstands NFL or Hume, or is incoherent.

  **Common Mistakes (penalize 1-2 marks each):**  
  - Conflating optimization algorithms with epistemic agents.  
  - Assuming NFL applies only to machine learning and not to human reasoning.  
  - Claiming physical constraints provide a complete non-circular justification without addressing Hume.  
  - Ignoring the specific structure of the uniform prior argument and reverting to textbook summaries.  
