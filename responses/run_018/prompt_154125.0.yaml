prompt: |-
  I've been teaching medical ethics this semester and my grad students keep hitting the same snag with advance directives — the theory sounds neat, the earlier self wrote it, but then you've got a dementia patient who seems genuinely content now, and the directive was specifically written to reject life in exactly this kind of state where they no longer have narrative self-awareness. The identity question makes the authority question messy, and I don't want another one-off essay answer. Instead, write me a reusable decision procedure for a clinical ethics consultant who gets paged maybe twice a week about these conflicts. They have thirty minutes, no metaphysics background, and need to document why they either honored the directive or overrode it. Turn the debate about diachronic authority — is the past self a trustee with binding power, or just one preference-source among others? — into actual steps: ordered questions, what counts as a sufficient answer at each stage, the stop-points where you say honor the directive versus current patient's interests take precedence, and the explicit flag-points where it's not a technical call but a values judgment that needs family or sign-off. The hard cases have to include a patient with advanced dementia who smiles at caregivers but whose directive refused feeding tubes if they ever lost narrative self-awareness, and a case where the patient verbally revoked part of the directive after diagnosis but before losing capacity, with family split on whether that revocation was authentic. Run both through your procedure, and make sure one of them yields an answer the family is going to hate. Be honest about where the procedure misfires — say, when welfare and narrative continuity pull in opposite directions — and say plainly what it can't do. Also please seperate what's settled in the bioethics and policy literature from what's genuinely contested among philosophers who actually work on personal identity and diachronic autonomy; don't present one side of that authority debate as the consensus when it's not. I keep misspelling diachronic in my lecture notes so I feel your pain if you do too, but keep the distinction clear anyway.
reasoning: |-
  Okay, let me approach this systematically. The professor's request is complex but clear - they need a practical decision tool for clinical ethics consultants dealing with advance directive conflicts in dementia cases. The core tension is between past directives and present patient welfare, wrapped in philosophical debates about identity and authority.

  First, I need to identify the non-negotiables: it must be usable in 30-minute consults by non-philosophers, generate documentation, handle hard cases, and explicitly flag value judgments. The professor specifically wants transparency about where bioethics consensus ends and philosophical controversy begins.

  The structure should flow logically from concrete to abstract. Start with immediate clinical factors before diving into identity questions. For each step, define what constitutes a sufficient answer - either a clear pass/fail or documentation of uncertainty. Built-in stopping points are crucial for efficiency.

  I recall the two test cases: the content dementia patient with a strict directive rejecting care, and the partially revoked directive with family conflict. The procedure must handle both and sometimes deliver unpopular conclusions. 

  On philosophical grounding, I'll separate settled policy from ongoing debates. Bioethics generally accepts precedent autonomy but debates its limits when identity changes. Philosophers like Parfit and Schechtman have fundamentally different views on whether past selves retain authority - this can't be glossed over.

  For the decision tree, I imagine a funnel:
  1. Verify directive validity and revocation status
  2. Assess current decision-making capacity 
  3. Evaluate welfare interests
  4. Examine identity continuity questions
  Only then tackle the authority conflict, with clear thresholds for when welfare overrides the directive.

  The documentation piece is vital - each step should generate chart-ready rationale. For contested philosophical points, the consultant should simply note the conflict rather than resolve it.

  Hardest part will be creating the "family will hate" outcome without being arbitrary. The dementia case where we honor the directive despite current contentment seems most ethically jarring - that's probably the one. Need to show how the procedure gets there step by step.

  Also must acknowledge where the model fails, like when narrative identity clearly fragments but welfare needs are minimal. The professor wants intellectual honesty about limitations.
answer: |-
  Here’s a reusable decision procedure for clinical ethics consultants addressing advance directive (AD) conflicts in dementia cases. It prioritizes clinical practicality, documents rationale, flags value judgments, and incorporates both bioethics consensus and unsettled philosophical disputes. The procedure is structured as a 7-step algorithm with explicit thresholds for action.

  ---

  ### **AD Conflict Decision Procedure (30-Minute Consult Framework)**  
  *For use when a patient with diminished capacity appears to contradict their prior written directive*

  **Core Principles:**  
  1. **Honor valid ADs by default** (bioethics/policy consensus).  
  2. **Override only with clear justification** (welfare crisis, valid revocation, or identity discontinuity).  
  3. **Document explicitly** at each step; flag unresolved value conflicts.  
  4. **No metaphysics required**—use observable evidence and clinical standards.

  ---

  #### **Step 1: Directive Validity & Scope Check**  
  *Is the AD applicable to this exact situation?*  
  - **Verify:** AD is signed/witnessed per jurisdiction, applies to current diagnosis (e.g., "advanced dementia with loss of narrative self-awareness"), and specifies interventions in question (e.g., "no feeding tubes").  
  - **Sufficient Answer:** "Yes" = Proceed. "No" = AD not binding; use best interests standard. **STOP.**  
  - **Flag:** If terminology is ambiguous (e.g., "no heroic measures"), note ambiguity and proceed to Step 2.  

  #### **Step 2: Revocation Assessment**  
  *Did the patient revoke or modify the AD *after* diagnosis but *before* losing capacity?*  
  - **Verify:** Documented retraction (e.g., dated note in chart) or ≥2 independent witness accounts of explicit verbal revocation. *Hearsay or family disagreement ≠ sufficient evidence.*  
  - **Sufficient Answer:** "Clear revocation" = AD void for specified interventions; use current interests. **STOP.**  
  - **Flag:** Contested revocation (e.g., family split) → Proceed to Step 3 but note conflict requires surrogate input.  

  #### **Step 3: Current Welfare Emergency**  
  *Is *immediate, irreversible harm* likely if the AD is followed?*  
  - **Verify:** Active suffering (e.g., pain, distress) that cannot be alleviated without violating the AD. *Contentment ≠ welfare crisis. Basic comfort (e.g., spoon-feeding) ≠ "treatment" unless AD explicitly refuses it.*  
  - **Sufficient Answer:** "Yes" (e.g., patient aspirating without tube, grimacing during feeds) → Override AD to prevent harm. **STOP.**  
  - **Answer:** "No" (e.g., patient smiles, tolerates oral feeding) → Proceed to Step 4.  

  #### **Step 4: Identity Continuity Assessment**  
  *Is there observable evidence of *persisting narrative identity*?*  
  *(Note: This step acknowledges philosophical controversy but uses proxy markers)*  
  - **Verify:** Patient references past/future self, recognizes family, expresses values-aligned preferences (e.g., "I hate hospitals," "Where is my daughter?"). *Smiling at caregivers ≠ narrative continuity.*  
  - **Sufficient Answer:** "Clear evidence" (e.g., patient says, "I’d never want to live like this") → Honor AD unless welfare crisis (Step 3). **STOP.**  
  - **Answer:** "No evidence" (e.g., no verbal communication, no self-recognition) → Proceed to Step 5.  

  #### **Step 5: Authority Threshold (The "Values Judgment" Flag)**  
  *Would overriding the AD primarily serve *others’ interests* (e.g., family distress, cost savings) or *subjective welfare* (e.g., contentment)?*  
  - **Verify:** No welfare emergency (Step 3), no identity continuity (Step 4), AD is valid (Step 1).  
  - **Bioethics Consensus:** Prior wishes bind *unless* identity is radically disrupted **and** overriding prevents suffering.  
  - **Philosophical Dispute:**  
    - *Lockean/Trustee View* (AD binds if biological identity persists): Honor AD.  
    - *Parfitian/Welfare View* (AD irrelevant if psychological connection severed): Override if patient is content.  
  - **Decision Protocol:**  
    - Patient shows **contentment + no suffering** → **Honor AD**. *The past self’s directive stands as trustee.*  
    - Patient shows **distress/contentment is unverifiable** → **Convene stakeholders** (surrogates, team). Outcome requires sign-off.  
  - **Document Explicitly:** "No welfare emergency or identity continuity. Binding directive honored per policy consensus, per [Locke/Policy Standard]. Welfare view rejected due to risk of bias."  

  #### **Step 6: Surrogate Consultation (If Step 5 Requires)**  
  *Facilitate meeting with surrogates/team to weigh:*  
  - Past patient’s values (from AD/family testimony)  
  - Current welfare (clinical data)  
  - **Document:** Surrogate decision + rationale. If no consensus, institutional ethics committee review.  

  #### **Step 7: Final Documentation**  
  *Template for Chart Note:*  
  > "AD validated per Step 1 [Y/N]. Revocation assessed per Step 2 [Y/N]. Welfare emergency ruled out per Step 3 [Y/N]. Identity continuity assessed per Step 4 [Y/N]. Authority threshold met/not met per Step 5. Directive honored/overridden based on [Cite steps]. Unresolved values conflict at Step [X] addressed via [process]."  

  ---

  ### **Hard Case Applications**  
  **Case 1: Content Dementia Patient**  
  - *Directive:* "No feeding tubes if I lack narrative self-awareness."  
  - *Now:* Advanced dementia, smiles during spoon-feeding, no self-recognition.  
  - **Procedure:**  
    Step 1: AD valid and scoped.  
    Step 2: No revocation.  
    Step 3: No welfare emergency (content, no distress).  
    Step 4: No narrative identity (no self-referential statements).  
    Step 5: Contentment present, no suffering → **Honor AD. No tube.**  
  - **Outcome:** Family may hate this. Rationale: Contentment ≠ well-being per past self’s values; overriding risks imposing "life at all costs" bias.  

  **Case 2: Contested Revocation**  
  - *Directive:* "No antibiotics for infections in late-stage dementia."  
  - *After diagnosis, pre-incapacity:* Patient said, "Maybe I’d take antibiotics if it’s just a UTI." Family split on whether this was serious.  
  - **Procedure:**  
    Step 1: AD valid.  
    Step 2: Revocation contested → Proceed.  
    Step 3: UTI present, patient grimacing → Welfare emergency? **Override AD temporarily to treat infection** (prevents harm). **STOP.**  
    Step 4+: Not reached.  
  - **Document:** "AD overridden for urgent welfare need. Revocation ambiguity requires surrogate meeting for *future* infections."  

  ---

  ### **Where the Procedure Misfires**  
  1. **Welfare vs. Narrative Divergence:**  
     - A patient with no narrative self who *appears* content but whose directive refuses basic care (e.g., "no oral food if demented"). Procedure honors AD, risking under-treatment. **Mitigation:** Step 3’s "irreversible harm" threshold catches crises.  
  2. **"Authentic" Revocation Disputes:**  
     - Relies on witness evidence; vulnerable to manipulation. **Mitigation:** Default to AD if conflicting accounts.  
  3. **Philosophical Limits:**  
     - Cannot resolve the **diachronic authority debate** (trustee vs. welfare view). It defaults to policy consensus (honor AD) but flags when welfare concerns dominate.  

  ---

  ### **Settled vs. Contested Ground**  
  | **Settled in Bioethics/Policy**               | **Contested in Philosophy**                     |  
  |---------------------------------------------|-----------------------------------------------|  
  | Valid ADs are presumptively binding          | Whether past selves retain authority over radically changed future selves |  
  | Welfare emergencies justify overriding ADs  | Whether "psychological continuity" defines identity or mere biological continuity suffices |  
  | Revocations require capacity                | If identity changes, whether welfare *or* precedent autonomy should dominate |  
  | Subjective contentment ≠ well-being         | Whether dementia voids moral agency entirely |  

  **Final Note:** This procedure makes the philosophical debate *actionable* without resolving it. It prioritizes policy compliance (honoring ADs) while providing ethical "escape valves" (welfare crises, verified revocations). When values clash irreconcilably (Step 5), it forces transparent stakeholder engagement—shifting the burden from the consultant to the institution/surrogates.
