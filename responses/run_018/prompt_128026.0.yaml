answer: |-
  ### Exam Question: Advanced Two-Envelope Paradox (Total: 20 marks)  
  **Time Allowed:** 45 minutes (for this section)  

  **Background:**  
  In the standard two-envelope paradox, you choose one envelope containing amount \(X\), and the other contains \(2X\) or \(X/2\). The "switch" argument claims the expected value of switching is \(1.25X\), creating a contradiction. This is typically resolved by noting that no uniform prior over all positive reals exists.  

  **Here, we consider an *improper prior* variant:**  
  - The envelope pairs \((A, B)\) are generated such that \(B = 2A\) or \(B = A/2\) with equal likelihood, but the prior over \(A\) is *improper* (e.g., \(\pi(A) \propto 1/A\) for \(A > 0\)). This prior is non-normalizable—integrating over all \(A\) diverges—so no proper probability distribution exists.  

  **Prompt:**  
  1. **Reconstruct the Argument** (6 marks):  
     Explain why the naive switch argument ("switching gives \(0.5 \times (2X) + 0.5 \times (X/2) = 1.25X\)") still *appears compelling locally* when you observe \(X\) in your envelope, despite the improper prior making expectations undefined globally.  

  2. **Evaluate 'Undefined Expectation'** (8 marks):  
     Does declaring "expectation is undefined" genuinely *resolve* the paradox? Or does it merely relocate the problem into *decision paralysis*? If rational choice requires maximizing expected utility, but expectation is undefined, should you:  
     - Always stay?  
     - Always switch?  
     - Randomize?  
     - Conclude that rationality is *suspended*?  
     Justify your view.  

  3. **Indexical Objection** (6 marks):  
     One critique argues that labeling envelopes "your envelope" and "the other envelope" introduces an *indexical* (perspective-dependent) symmetry break, akin to self-locating uncertainty in Sleeping Beauty. When you see \(X\), reasoning about "the other envelope" requires aggregating over two incompatible world-states (one where \(X\) is small, one where \(X\) is large), but these cannot be averaged legitimately under an improper prior. Contrast this with the standard "no uniform distribution" resolution.  

  ---

  ### Model Answer (≈600 words)  
  #### (1) Reconstructing the Switch Argument (6 marks)  
  The local switch argument persists because conditional on observing \(X\) in your envelope, the *relative* probabilities of the two scenarios (your envelope being smaller or larger) remain symmetric. Given the setup, if you observe \(X\), the other envelope holds \(2X\) or \(X/2\) with *equal subjective probability 0.5*—regardless of the global prior. This symmetry arises from the fixed doubling/halving rule, not the prior. Thus, the expected gain from switching *calculated conditionally* is:  
  \[
  0.5 \times (2X - X) + 0.5 \times (X/2 - X) = 0.5X - 0.25X = 0.25X > 0.
  \]  
  This *conditional expectation* is mathematically coherent *for the observed \(X\)*, creating the illusion that switching is beneficial. The improper prior’s non-normalizability is a global issue, invisible when you condition on a specific \(X\). The paradox leverages this local symmetry to tempt action, even when global rationality constraints fail.  

  #### (2) Evaluating "Undefined Expectation" (8 marks)  
  Declaring expectation "undefined" does not resolve the paradox; it relocates it into **decision paralysis**. While the improper prior makes the *unconditional* expectation undefined, the *conditional* expectation given \(X\) *is* defined and favors switching—creating tension:  
  - If rationality requires maximizing *conditional* expectation (given available information), switching is mandated.  
  - Yet globally, this leads to contradictions: if all agents switch regardless of \(X\), they collectively lose money (as switching is zero-sum).  

  Saying expectation is undefined suspends the applicability of expected utility theory but does not prescribe action. Rationality is **suspended** in the sense that no strategy (stay, switch, or randomize) can be justified *solely* by expectation calculations. Always staying/switching violates the conditional symmetry (you *feel* you gain 25% by switching), while randomizing (e.g., switching with 50% probability) ignores the local argument entirely. The paradox reveals that improper priors fracture decision theory: local rationality clashes with global coherence, leaving no unproblematic choice.  

  #### (3) Indexical Objection vs. Standard Resolution (6 marks)  
  The **indexical objection** contends that labeling envelopes "yours" and "the other" breaks symmetry improperly. When you observe \(X\), you occupy *one perspective* in *one* of two possible world-states:  
  - **State S1**: Your envelope = \(X\), other = \(2X\)  
  - **State S2**: Your envelope = \(2X\), other = \(X\) (so observed \(X\) is actually half the smaller amount).  
  Averaging over these states assumes they are equally likely, but under an improper prior, this "probability" is meaningless—integrating \(\int_0^\infty \pi(A) dA\) diverges. This mirrors Sleeping Beauty’s challenge: averaging over "Monday" and "Tuesday" awakenings is invalid without well-defined probabilities.  

  The **standard resolution** (rejecting uniform distributions over infinities) dissolves the paradox by showing no proper prior supports the 50-50 likelihood. The indexical objection goes further: even *conditionally*, aggregating across S1/S2 is incoherent because the indexical labels ("your envelope") make S1 and S2 *incommensurable perspectives*. Resolving the conditional symmetry requires rejecting the 50-50 assumption entirely—not because of distributional constraints, but because indexical reasoning under impropriety prohibits probabilistic averaging.  

  ---

  ### Marking Scheme (20 marks total)  
  | **Must-Hit Points**                     | **Marks** | **Common Botches** |  
  |----------------------------------------|-----------|-------------------|  
  | **1. Local vs. Global Disconnect**: Clearly explains why the *conditional* switch argument (given \(X\)) *seems* valid despite improper prior. | 4 | Confuses local/global or misattributes the symmetry to the prior. |  
  | **2. Decision Paralysis**: Argues "undefined expectation" relocates (not resolves) paradox, leading to suspension of rationality. Rejects stay/switch/randomize as "solutions." | 4 | Claims undefined EV implies indifference (e.g., "just flip a coin") or misses the suspension. |  
  | **3. Indexical Aggregation**: Identifies averaging over S1/S2 as illegitimate due to indexical labels and improper prior, akin to Sleeping Beauty. | 6 | Superficial Sleeping Beauty analogy; fails to link indexicality to symmetry-breaking. |  
  | **4. Contrast w/ Standard Fix**: Distinguishes indexical objection (incommensurable perspectives) from standard "no uniform distribution" argument. | 3 | Conflates indexical issue with normalization problem. |  
  | **5. Synthesis**: Integrates all three parts, showing why the paradox persists *conceptually* despite technical fixes. | 3 | Treats parts disjointedly; no overarching insight. |  

  ---  
  **Grade Differentiation:**  
  - **A (17–20)**: Hits all 5 points. Precision in conditional/global expectations and indexicality. Explicitly ties decision paralysis to suspension of rationality.  
  - **B (13–16)**: Hits 3–4 points. Adequate reconstruction but vague on indexicality or decision paralysis (e.g., "undefined EV means we can’t decide"). Superficial Sleeping Beauty comparison.  

  **Rationale**:  
  - Top marks require recognizing that *conditional* reasoning *feels* compelling even when improper, and that "undefined" exposes a meta-problem for decision theory.  
  - The indexical objection must reframe the symmetry break as perspectival, not just probabilistic.  
  - B answers often miss the *why* behind decision paralysis or reduce indexicality to "probabilities don’t exist."
