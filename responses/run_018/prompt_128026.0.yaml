prompt: |-
  hey so i'm writing the final for my seminar on rational choice paradoxes (mostly grad students, couple sharp seniors). i want an essay question on the two-envelope paradox but not the standard 'explain and resolve' version—everyone can recieve that straight from pretraining. instead i want them to wrestle with the improper-prior variant: imagine the amounts are drawn from a prior that assigns non-normalizable weights across all possible envelope-pairs, so there's no proper distribution and expectation is technically undefined no matter what you open. the prompt should force three moves: (1) reconstruct why the local switch-argument still looks compelling even when the global prior is improper; (2) evaluate whether saying 'expectation is undefined' genuinely dissolves the paradox or just relocates it into decision paralysis—if you can't compute an expected value, does that mean you should stay, switch, or that rational choice is suspended?; and (3) tackle the indexical-objection that comparing your envelope to the other is like comparing perspectives in Sleeping Beauty-style reasoning, so averaging over 'the other envelope' is illegitimate in the same way averaging over Tuesday vs Wednesday might be, breaking symmetry differently than the usual 'no uniform distribution' fix. please write the exam question, a model answer of about 600 words, and a marking scheme with five must-hit points totalling 20 marks, each with a one-line note on how candidates typically botch it, plus clear separation between an A answer and a B answer. its a 90-minute exam with no web access, so no bibliographies or citations—just conceptual precision. please keep it grounded in basic expectation logic and indexical belief, nothing that requires knowing some obscure 2010s paper.
