  Here is a precise joke crafted for your scenario, focusing on the ontological tension:

  **Setting:** *A pristine gallery space. A CURATOR stands before a magnificent, newly hung painting. A PHILOSOPHER enters, examining it closely.*

  **CURATOR:** (Gesturing proudly) "Magnificent, isn't it? Our latest acquisition: Van Gogh's *Sunflowers*. The vibrant impasto, the desperate energy in every stroke... pure genius captured."

  **PHILOSOPHER:** (Peering intently) "Indeed, the material configuration is breathtaking. Every cadmium yellow crystal, every ripple in the lead white, the precise microfractures in the linen... identical down to the quantum level to the one in Amsterdam. A true masterpiece of replication."

  **CURATOR:** (Slightly stiffening) "Replication? This *is* Van Gogh's *Sunflowers*! Our 'Causally Transparent Replica' project perfectly re-enacted the exact spatiotemporal trajectory of every particle - every brush-hair flick, every oxidation event - under controlled conditions."

  **PHILOSOPHER:** "Ah, so it possesses the *entire* intrinsic physical state of the original Amsterdam painting?"

  **CURATOR:** "Unequivocally. Not a molecule differs."

  **PHILOSOPHER:** "Therefore, all its aesthetic properties – the vibrancy, the energy, the genius you perceive – are fully present? The value is entirely here, in *this* object?"

  **CURATOR:** (Hesitates, then firmly) "Well... no. It's the *replica*. A remarkable technical achievement, certainly, but ultimately... a fascinating simulation."

  **PHILOSOPHER:** "But if the aesthetic value resides solely in the physical object – which *this* object duplicates perfectly – then rejecting its value seems arbitrary. Yet, if its value *requires* being touched by Van Gogh's hand, embedded in *his* history, part of *that* causal chain... then the physical perfection seems curiously beside the point. So, which masterpiece am I looking at? The physically perfect object before us, or the ghost of an intention from Arles?"

  **CURATOR:** (After a long pause, looking slightly pained) "...Would you care for a brochure? It explains the... *provenance*... of the replication process."

  ---

  **Humor Mechanism:** The joke turns on the curator's unavoidable contradiction. They initially describe the *aesthetic experience* as if it emanates intrinsically from the physical object ("vibrant impasto," "desperate energy"). When the philosopher reveals the object is the replica, the curator instinctively denies its *artistic* value ("fascinating simulation") despite confirming its *perfect physical identity* to the valued original. The philosopher then explicitly juxtaposes the two theses: if value is intrinsic/physical, the replica *must* have it; if value is relational/historical, the physical perfection is irrelevant. The curator's flustered retreat to "provenance" (a key relational property) highlights the tension and exposes the unspoken reliance on relational value they initially obscured with intrinsic-sounding language. The humor lies in watching the expert tacitly abandon the intrinsic-value thesis the moment the relational history is missing, despite the object's physical flawlessness.
