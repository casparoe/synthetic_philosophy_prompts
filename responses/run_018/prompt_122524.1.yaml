  ### Welfare Assessment Procedure Under the Choice Rule  
  **Objective**: Issue a defensible, reproducible one-page statement on whether a population is better off after an intervention, based *only* on actual choices among available options.  

  **Core Principles**:  
  1. **Choice Rule Compliance**:  
     - (a) Ground findings in *actual choices* among *available options*.  
     - (b) Exclude self-reported wellbeing, happiness, or stated WTP as primary evidence (use only as context).  
     - (c) If evidence is inconclusive, state "no welfare finding possible".  

  2. **Theoretical Foundation**:  
     - Welfare = Preference satisfaction revealed through choices.  
     - No interpersonal utility comparisons or cardinal magnitudes.  
     - Focus on *changes in choices* for identical or comparable options.  

  **Procedure for Analysts** (6-week timeline):  
  ---  
  #### **Step 1: Map Choice Sets**  
  **Question**: *Are the options (including effort, time, and information) identical between control and intervention groups?*  
  - **Sufficient Answer**:  
    - **Yes** (e.g., pension default change, rewording letters): Proceed to Step 2.  
    - **No** (e.g., friction changes like cooling-off periods): Stop → "No welfare finding possible. Choice sets are incomparable."  
  - **Judgement Call**: Unit head must rule on whether effort differences (e.g., form-filing) invalidate comparability. Default: Treat effort as part of the bundle.  

  #### **Step 2: Check Choice Consistency**  
  **Question**: *Are choices internally consistent (no cycles/reversals unexplained by new information)?*  
  - **Method**:  
    - For trials with repeated choices (e.g., pension follow-up), compute an **Afriat index** (0–1 scale).  
      - **Index > 0.95**: Choices are "consistent" (pass).  
      - **Index ≤ 0.95**: Inconsistencies imply unstable preferences → Stop for affected individuals.  
  - **Sufficient Answer**:  
    - ≥90% of the group passes → Proceed to Step 3.  
    - <90% passes → Stop → "No welfare finding possible. Preferences are inconsistent."  
  - **Afriat Note**:  
    - Index = 0.9 implies 10% "discount" needed to rationalize choices as utility-maximizing. Low values signal noise or context effects.  

  #### **Step 3: Identify Gainers and Losers**  
  **Question**: *Did individuals switch to options previously available but not chosen?*  
  - **Method**:  
    1. Predict counterfactuals using control-group data (e.g., logistic regression).  
    2. For each person in intervention group:  
       - **Gainer**: Chooses option *X* in intervention but predicted to choose *non-X* in control.  
       - **Loser**: Chooses *non-X* in intervention but predicted to choose *X* in control.  
       - **Unaffected**: No change.  
  - **Sufficient Answer**:  
    - Gainers exist AND losers ≤ 5% of group → Proceed to Step 4.  
    - Gainers exist but losers > 5% → Flag for board aggregation (Step 4).  
    - No gainers → Stop → "No evidence of welfare improvement."  

  #### **Step 4: Aggregate to Group-Level Finding**  
  **Question**: *Do gainers outweigh losers?*  
  - **Method**:  
    - Report counts: # gainers, # losers, # unaffected.  
    - **Judgement Call**: Board decides if gainers' welfare increase offsets losers' decrease (no utility sums).  
  - **Sufficient Answer**:  
    - Board aggregation required if losers > 5% → "Group welfare indeterminate; board must rule on net gain."  
    - Else → Issue finding.  

  #### **Step 5: Document Finding**  
  **One-Page Template**:  
  > **Intervention**: [Brief description].  
  > **Behavioral Change**: [e.g., "Enrolment rose from 41% to 87%"].  
  > **Welfare Finding**:  
  > - [Clear statement: e.g., "Group better off," "No finding possible," or "Board judgement required"].  
  > **Key Evidence**:  
  > - Choice sets: [Identical/Not identical].  
  > - Consistency: [Afriat index summary].  
  > - Gainers/Losers: [# and %].  
  > **Context**: [Optional: Self-reports, external factors].  

  ---  
  ### **Handling Specific Cases**  
  #### **Defaults/Framing** (e.g., Pension Opt-Out)  
  - **Step 1**: Choice sets identical (options: enrol/not enrol; effort same for non-default).  
  - **Step 2**: Low opt-outs → High consistency (Afriat > 0.95).  
  - **Step 3**: Gainers = Newly enrolled who wouldn’t have enrolled in control. Losers = Near zero (opt-outs are likely consistent with control non-enrollees).  
  - **Step 4**: Net gainers → Group better off.  
  - **Finding**: "Group better off due to increased pension enrolment. No evidence of harm."  

  #### **Information/Debiasing** (e.g., Screening Letter)  
  - **Step 1**: Choice sets identical (options: attend/not attend).  
  - **Step 2**: Consistency assumed (no follow-up).  
  - **Step 3**: Gainers = New attendees who wouldn’t have attended in control.  
  - **Step 4**: Net gainers → Group better off.  
  - **Finding**: "Group better off due to increased screening. Self-reported anxiety noted but not used."  

  #### **Friction** (e.g., Cooling-Off Period)  
  - **Step 1**: Choice sets **not identical** (immediate loan vs. delayed loan).  
  - **Stop**: "No welfare finding possible. Choice sets differ due to added friction."  
  - **Context**: "Prior suggests welfare gain, but Choice Rule prohibits comparison."  

  #### **Cycles/Time Inconsistency**  
  - Use Afriat index (Step 2). Index = 0.9 → High inconsistency → "No finding possible."  

  #### **Adaptive/Defensive Choice**  
  - Choice Rule ignores motives (e.g., "deprivation tolerance") → Read choices at face value.  

  ---  
  ### **What the Procedure Cannot Do**  
  1. **Interpersonal Comparisons**: No summing of utility across people.  
  2. **Magnitudes/Intensity**: No measure of "how much" better off (only ordinal rankings).  
  3. **Non-Choice Welfare**: Excludes wellbeing, health, or equity not revealed in choices.  
  4. **Thick Welfare Concepts**: Cannot adjudicate if "better off" means preference satisfaction (thin) vs. objective wellbeing (thick). Flags this for board input.  
  5. **Friction Conversions**: Refuses to monetize effort/hassle (avoids arbitrariness but cannot evaluate friction interventions).  

  ### **Board Ownership Points**  
  1. **Afriat Threshold**: Unit head sets consistency cutoff (default: 0.95).  
  2. **Loss Threshold**: Unit head sets loser tolerance (default: ≤5%).  
  3. **Aggregation**: Board rules when gainers/losers both exist.  
  4. **Defining "Better Off"**: Board must confirm if welfare = preference satisfaction (thin) or other (thick).  

  ---  
  ### **Example Findings**  
  #### **Trial 1: Workplace Pension Opt-Out**  
  > **Intervention**: Switched pension enrolment from opt-in to opt-out.  
  > **Behavioral Change**: Enrolment rose from 41% to 87%; opt-outs low and flat over 12 months.  
  > **Welfare Finding**: **Group better off**.  
  > **Evidence**:  
  > - Choice sets identical (enrol/not enrol; effort symmetric).  
  > - Choices consistent (Afriat index = 0.98).  
  > - Gainers: 46% (newly enrolled who wouldn’t have enrolled in control). Losers: <1%.  
  > **Context**: No data on saving offsets; implicit state recommendation noted.  

  #### **Trial 2: Cervical Screening Letter**  
  > **Intervention**: Rewritten invitation letter.  
  > **Behavioral Change**: Attendance rose from 34% to 39%.  
  > **Welfare Finding**: **Group better off**.  
  > **Evidence**:  
  > - Choice sets identical (attend/not attend).  
  > - Consistency assumed (no follow-up).  
  > - Gainers: 5% (new attendees). Losers: <1%.  
  > **Context**: Self-reported anxiety present but excluded per Choice Rule.  

  #### **Trial 3: Loan Cooling-Off Period**  
  > **Intervention**: 24-hour mandatory delay on high-cost loans.  
  > **Behavioral Change**: Borrowing fell by one-third.  
  > **Welfare Finding**: **No welfare finding possible**.  
  > **Evidence**:  
  > - Choice sets not identical (immediate vs. delayed loan).  
  > **Context**: Board prior suggests welfare gain, but Choice Rule prohibits comparison.  

  ---  
  **Final Note**: This procedure prioritizes defensibility over conclusiveness. It satisfies the Choice Rule but will often return "no finding" for friction, information, or inconsistent choice trials. Analysts can execute it with undergrad training; unit heads must own key judgements.
