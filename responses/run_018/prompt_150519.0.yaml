answer: |-
  Below is a reusable decision procedure for determining the best-supported cause of economic growth (institutions, geography, or culture) in historical cases. It incorporates causal inference principles (counterfactual dependence, overdetermination, identification problems) and is designed for non-experts to complete in ~15 minutes with no research. The procedure includes ordered questions, pass/fail rules, explicit deadlock flags, and handles edge cases like "free-floating rationales."

  ---

  ### **Decision Procedure: Causal Attribution for Economic Growth**  
  **Time Budget:** 15 minutes/country  
  **Inputs:** Basic historical knowledge of the country's growth period.  
  **Output:** "Institutions," "Geography," "Culture," or "Deadlock."  

  #### **Step 0: Preliminaries**  
  **Question 0.1:** When did the country's *sustained* economic growth begin? (e.g., "1960s")  
  **Question 0.2:** What was the primary engine of growth? (e.g., "manufacturing exports," "oil extraction").  
  *→ Record answers. Proceed to Step 1.*

  ---

  #### **Step 1: Test for Institutions**  
  *Focus: Rules, property rights, governance, and policy changes.*  
  **Question 1.1 (Necessity):**  
     - "Was there a **major change** in economic/political institutions (e.g., property rights, anti-corruption, market reforms) **within 20 years** before growth began?"  
     - *Pass:* Explicit change (e.g., new constitution, policy shift). *Fail:* No change or change unrelated.  
     - ***FAIL → Skip to Step 2.***  

  **Question 1.2 (Counterfactual Dependence):**  
     - "If this institutional change **had NOT occurred**, would growth **still have happened** at the same time/scale? Consider: Did similar countries *without* this change grow?"  
     - *Pass:* Growth unlikely without change (strong counterfactual dependence).  
     - *Fail:* Growth plausible without it (weak counterfactual).  
     - ***FAIL → Skip to Step 2.***  

  **Question 1.3 (Overdetermination Check):**  
     - "Could geography or culture **alone** have caused growth **without** these institutions?"  
     - *Pass:* No (institutions were essential).  
     - *Fail:* Yes (e.g., resource windfall or cultural shift could independently explain growth).  
     - ***PASS ALL → Tentatively assign "Institutions." Proceed to Step 4 to resolve conflicts.***  

  ---

  #### **Step 2: Test for Geography**  
  *Focus: Location, resources, climate, disease, trade routes.*  
  **Question 2.1 (Necessity):**  
     - "Did **geography** (e.g., natural resources, ports, fertile land, climate) play a **decisive role** in enabling the primary growth engine?"  
     - *Pass:* Critical factor (e.g., oil reserves for an oil-driven economy). *Fail:* Incidental or irrelevant.  
     - ***FAIL → Skip to Step 3.***  

  **Question 2.2 (Counterfactual Dependence):**  
     - "If geography were **different** (e.g., no oil, landlocked, arid climate), would growth **still have happened**?"  
     - *Pass:* Growth unlikely without this feature (strong counterfactual).  
     - *Fail:* Growth plausible (e.g., other countries thrived despite similar constraints).  
     - ***FAIL → Skip to Step 3.***  

  **Question 2.3 (Resource Curse Check):**  
     - **If resources drove growth:** "Did resource wealth **clearly undermine** institutions (e.g., corruption, conflict, Dutch Disease)?"  
       - *Pass:* No ("curse" avoided). *Fail:* Yes (curse occurred).  
     - **If no resources:** Automatically pass.  
     - ***FAIL → Flag as "Resource Curse Contradiction." Proceed to Step 4 (deadlock likely).***  
     - ***PASS ALL → Tentatively assign "Geography." Proceed to Step 4.***  

  ---

  #### **Step 3: Test for Culture**  
  *Focus: Beliefs, values, social norms (e.g., work ethic, innovation, trust).*  
  **Question 3.1 (Necessity):**  
     - "Was there a **cultural shift** (e.g., new educational values, religious change) **proximate to growth** that directly enabled it?"  
     - *Pass:* Plausible shift with clear growth link. *Fail:* Static culture or weak link.  
     - ***FAIL → Return to Step 4 with no culture claim.***  

  **Question 3.2 (Identification Problem Check):**  
     - "Could this cultural trait be **explained by institutions or geography**? (e.g., work ethic from economic incentives, not innate culture)."  
     - *Pass:* Culture is independent (e.g., no institutional/geographic cause).  
     - *Fail:* Culture is likely derivative (e.g., shaped by institutions).  
     - ***FAIL → Culture invalid. Proceed to Step 4.***  
     - ***PASS ALL → Tentatively assign "Culture." Proceed to Step 4.***  

  ---

  #### **Step 4: Conflict Resolution & Deadlocks**  
  **Question 4.1 (Single Cause):**  
     - If only one cause passed all tests → **Assign that cause.**  

  **Question 4.2 (Overdetermination):**  
     - If **multiple causes passed**:  
       - "Which cause has the **strongest counterfactual dependence**? (i.e., removing which factor would *most likely* halt growth?)"  
       - Assign the cause with strongest dependence.  
       - ***If indeterminable → Flag DEADLOCK: "Overdetermination."***  

  **Question 4.3 (Resource Curse Contradiction):**  
     - If geography failed **only at 2.3 (curse)**:  
       - "Did institutions **cause effective resource management**?"  
         - *Yes:* Institutions are primary cause (geography was opportunity, institutions executed).  
         - *No:* **Flag DEADLOCK: "Resource Curse Paradox."**  

  **Question 4.4 (No Clear Cause):**  
     - If all steps fail → **Flag DEADLOCK: "No Cause Identified."**  

  **Final Deadlock Rule:**  
     - All deadlocks require human sign-off. Annotators **stop here**.  

  ---

  ### **Handling Edge Cases**  
  **Free-Floating Rationales** (e.g., "Trade routes destined them for growth, but no policymakers leveraged this"):  
  - **Kicked out at Step 2.1** (Geography Necessity Test): Requires geography to play a "decisive role," implying it must be *operationalized* (e.g., resources extracted, ports used). Abstract potential ("destined for growth") fails.  
  - **Exception:** If geography was passively exploitable (e.g., monsoon winds enabling trade), it passes Step 2.1 *if* it demonstrably impacted growth.  

  ---

  ### **Worked Examples**  
  #### **Example 1: South Korea (1960s–1990s)**  
  - **Step 0:** Growth starts 1960s; engine = manufacturing exports.  
  - **Step 1 (Institutions):**  
    - 1.1: **Pass** (Park Chung-hee's export-focused industrial policy).  
    - 1.2: **Pass** (Without policy shift, counterfactual = agrarian poverty like North Korea).  
    - 1.3: **Pass** (Geography/culture insufficient: no resources; Confucianism predated growth).  
  - **Result:** **Institutions** (no further steps needed).  

  #### **Example 2: Equatorial Guinea (1990s–Present; Resource-Cursed Small State)**  
  - **Step 0:** Growth starts 1990s; engine = oil.  
  - **Step 1 (Institutions):**  
    - 1.1: **Fail** (No major institutional change; dictatorship pre/post-oil).  
  - **Step 2 (Geography):**  
    - 2.1: **Pass** (Oil reserves critical).  
    - 2.2: **Pass** (No oil = no growth; counterfactual dependence strong).  
    - 2.3: **Fail** (Resource curse: oil fueled corruption, inequality, Dutch Disease).  
  - **Conflict Resolution (Step 4.3):**  
    - Institutions did **not** cause effective management (failed at Step 1). → **Flag DEADLOCK: "Resource Curse Paradox."**  
  - **Why we hate it:** Geography *caused* growth but *also* caused collapse of institutions (identification problem). Checklist deadlocks appropriately.  

  ---

  ### **Summary of Deadlock Flags**  
  1. **"Overdetermination"** (Step 4.2): Multiple causes with equal counterfactual strength.  
  2. **"Resource Curse Paradox"** (Step 4.3): Geography enabled growth but destroyed institutions.  
  3. **"No Cause Identified"** (Step 4.4): All pathways failed.  

  ---  
  **Design Philosophy:** This procedure prioritizes *operationalized causes* (per causal inference) over post-hoc theories. Free-floating rationales fail necessity tests, while resource curses expose the geography-institution identification problem. Deadlocks force expert review where historical contingency dominates.
