  We are designing a decision procedure for annotators to determine the best-supported cause (institutions, geography, or culture) for why a country got rich, grounded in causal inference concepts. The procedure must be usable by non-experts in about 15 minutes per country without library access.

  Key concepts from the philosophy of causal inference in history:
  1. Counterfactual dependence: Would the outcome (becoming rich) have occurred if the cause had been absent?
  2. Overdetermination: When multiple causes are each sufficient to bring about the outcome independently.
  3. Identification problems: Difficulties in isolating the effect of a specific cause due to confounding factors.

  The procedure will consist of a series of questions in order, with pass/fail rules and explicit "stop here, it's a judgment call" flags.

  We are to cover:
  - Worked examples: South Korea (institutions) and a resource-cursed small state (where the answer might be wrong, e.g., geography but we might hate it because of the resource curse paradox).
  - Edge case: "free-floating rationale" - a reason for growth that no actual policymaker held. We must say where it is included or kicked out.

  Also, flag cases where the checklist deadlocks and requires human sign-off.

  Structure of the procedure:

  I. Preliminary Questions (to set the stage)
  II. Institutions Pathway
  III. Geography Pathway
  IV. Culture Pathway
  V. Conflict Resolution (if multiple pathways pass)
  VI. Edge Cases and Deadlocks

  We design the procedure as a decision tree with clear stopping points.

  ---

  **Decision Procedure: Why Did This Country Get Rich?**

  **I. Preliminary Questions (Must answer these first for every case):**

  1. **Define "rich" for this country:** 
     - When did the country experience significant economic growth? (e.g., South Korea: 1960s-1990s)
     - What was the main economic activity driving growth? (e.g., manufacturing, services, natural resources)

  2. **Identify major historical events during the growth period:**
     - List 2-3 major events (e.g., wars, reforms, discoveries).

  3. **Baseline counterfactual:** 
     - What would have happened in the absence of any specific intervention? (e.g., without the Korean War, without Park Chung-hee's reforms?)
     - If the baseline counterfactual already includes conditions that would lead to growth without the cause in question, then that cause might not be necessary.

  **II. Institutions Pathway (Focus on rules, laws, property rights, governance)**

  4. **Institutions Question 1 (Necessity):** 
     - *Question:* Did the country have a significant change in economic or political institutions (e.g., establishment of secure property rights, rule of law, anti-corruption measures) shortly before or during the growth period? 
     - *Pass:* Yes, and the change was substantial and directly related to economic activity.
     - *Fail:* No, or the change was minor or unrelated. Then skip to Geography Pathway.

  5. **Institutions Question 2 (Sufficiency):** 
     - *Question:* If we remove this institutional change (counterfactual), would the growth have happened anyway? 
     - *Pass:* Growth would not have happened (counterfactual dependence). 
     - *Fail:* Growth would have happened regardless (e.g., because of geography or culture). Then skip to Geography Pathway.

  6. **Institutions Question 3 (Overdetermination Check):** 
     - *Question:* Are there other factors (geography or culture) that could independently explain the growth? 
     - *Pass:* No other factor is independently sufficient. 
     - *Fail:* Yes, one or more factors are independently sufficient. Then note the factor(s) and go to Conflict Resolution (V).

  *If all three pass, mark institutions as a strong candidate.*

  **III. Geography Pathway (Location, resources, climate, disease burden)**

  7. **Geography Question 1 (Necessity):** 
     - *Question:* Did the country's geography (e.g., natural resources, access to sea, arable land, climate) play a critical role in enabling the growth? 
     - *Pass:* Yes, and the geographic advantage was present during the growth period and was necessary for the main economic activity.
     - *Fail:* No, or the geographic factors were not critical. Then skip to Culture Pathway.

  8. **Geography Question 2 (Sufficiency):** 
     - *Question:* If the country had a different geography (counterfactual), would the growth have happened anyway? 
     - *Pass:* Growth would not have happened (counterfactual dependence). 
     - *Fail:* Growth would have happened regardless. Then skip to Culture Pathway.

  9. **Geography Question 3 (Resource Curse Check):** 
     - *Question:* If the country has abundant natural resources, did it avoid the resource curse (i.e., did the resources lead to sustained growth without causing institutional degradation or conflict)? 
     - *Pass:* Avoided the resource curse (growth was due to resources and good management). 
     - *Fail:* Suffered from the resource curse (then institutions might be the problem, not the geography). Then mark as "resource curse" and note that geography alone is not sufficient. This might lead to a deadlock (see below).

  10. **Geography Question 4 (Overdetermination Check):** 
      - *Question:* Are there other factors (institutions or culture) that could independently explain the growth? 
      - *Pass:* No other factor is independently sufficient. 
      - *Fail:* Yes, one or more factors are independently sufficient. Then note the factor(s) and go to Conflict Resolution (V).

  *If all pass, mark geography as a strong candidate. If failed at Q9 (resource curse), then institutions might be the real cause and we need to revisit Institutions Pathway? But note: the resource curse might indicate that geography was the initial cause but institutions were the reason it turned into a curse. So we might have a deadlock.*

  **IV. Culture Pathway (Beliefs, values, social norms)**

  11. **Culture Question 1 (Necessity):** 
      - *Question:* Did the country have a cultural trait (e.g., work ethic, trust, innovation) that changed or became prominent during the growth period and was directly linked to economic activity? 
      - *Pass:* Yes, and the trait was distinct and influential.
      - *Fail:* No, or the trait was present but not changing or not linked. Then stop: no clear cause from culture.

  12. **Culture Question 2 (Sufficiency):** 
      - *Question:* If we remove this cultural trait (counterfactual), would the growth have happened anyway? 
      - *Pass:* Growth would not have happened (counterfactual dependence). 
      - *Fail:* Growth would have happened regardless. Then stop: culture not sufficient.

  13. **Culture Question 3 (Overdetermination Check):** 
      - *Question:* Are there other factors (institutions or geography) that could independently explain the growth? 
      - *Pass:* No other factor is independently sufficient. 
      - *Fail:* Yes, one or more factors are independently sufficient. Then note the factor(s) and go to Conflict Resolution (V).

  *If all pass, mark culture as a strong candidate.*

  **V. Conflict Resolution (When multiple pathways pass)**

  14. **Multiple Causes Passing:**
      - If more than one pathway (institutions, geography, culture) has passed all its questions, then:
        - *Question:* Which cause has the strongest counterfactual dependence? (i.e., if you remove only one, which removal would most likely prevent the growth?)
        - If one cause clearly dominates, choose that.
        - If not, then consider: 
          - *Overdetermination:* Are the causes jointly sufficient but individually necessary? Then mark as "combination" (but we must pick one for annotation? The problem says "best-supported", so we might need to choose the primary one).
          - *Judgment Call Flag:* If you cannot determine which is primary, flag for human sign-off with note: "Multiple causes: [list]. Please determine primary cause."

