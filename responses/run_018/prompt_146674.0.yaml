answer: |-
  ## The Phantom "We": Collective Intentionality and the Illusion of Consent in the Co-op

  Your Manchester co-op experience perfectly crystallizes a profound philosophical and practical dilemma: is the "we" in "we decided" a genuine, irreducible collective mind, or merely a convenient label slapped onto a bundle of individual thoughts coordinated by rules? This question strikes at the heart of collective intentionality – the idea that groups can genuinely intend, believe, or act together *as a group*. Your "silent partner" clause, where non-objection equals consent, adds a crucial practical dimension, forcing us to ask: does procedural efficiency manufacture genuine collective will, or merely mask individual acquiescence? The debate largely revolves around two giants: John Searle, defending irreducible "we-intentions," and Michael Bratman, arguing for reduction to interlocking individual intentions plus coordination.

  **The Case for Irreducibility: Searle's "We-Intentions"**

  Searle argues that collective intentionality is a primitive phenomenon, not reducible to individual mental states plus mutual belief. He posits a distinct form of intention: the "we-intention." When individuals genuinely participate in a collective action (like your co-op making a decision), they don't just have an "I-intention" ("I intend that *we* paint the kitchen") coupled with a belief that others have similar "I-intentions." Instead, they have a fundamental "we-intention" ("*We* intend to paint the kitchen"). This "we-intention" is not just a sum of "I-intentions"; it has a different *form* and *content*. Crucially, for Searle, the "we" is intrinsic to the intention itself – it's not analyzable into "I intend plus I believe you intend, etc."

  The core argument is phenomenological and logical:
  1.  **Phenomenology:** When genuinely acting collectively, our experience is *of acting together as a "we."* The collective subject feels primary, not secondary to individual calculations. Your frustration stems from this feeling – the decisions *should* feel like a "we," but instead feel like aggregated "I's."
  2.  **The Circulatory Problem:** Reducing "we-intend" to "I intend that we do X, and I believe you intend that we do X, and you believe I believe..." leads to an infinite regress. The "we" concept is presupposed in the beliefs about others' intentions, making the reduction circular. The "we" must be prior.

  Under Searle's view, your co-op's "silent partner" clause faces severe problems. Passively not objecting within 48 hours is utterly insufficient for forming a genuine "we-intention." A "we-intention" requires an *active* psychological stance of participating *in* the collective intention. Silent acquiescence is, at best, weak individual consent, lacking the essential *collective mode* of intending. It manufactures the *appearance* of collective will ("we decided") without the underlying reality, precisely the dynamic you observe. It turns "collective consent" into a procedural trick masking individual inertia or disengagement.

  **The Case for Reduction: Bratman's "Shared Cooperative Activity"**

  Michael Bratman offers a powerful alternative. He argues that what we call "shared intention" or "collective intentionality" *can* be fully analyzed into the interlocking intentions, beliefs, and commitments of individuals, coupled with a specific structure of interdependence and coordination. His model of "shared cooperative activity" (SCA) requires:
  1.  **Interlocking Intentions:** Each individual intends that *we* J (the joint activity).
  2.  **Mutual Responsiveness:** Each intends that we J *in accordance with and because of* meshing subplans of the others.
  3.  **Commitment to Mutual Support:** Each is committed to supporting the other in their role in J, as needed.
  4.  **Common Knowledge:** All of the above is out in the open and known to be known, etc.

  For Bratman, there is no mysterious "we-intention" floating above the individuals. The "sharedness" emerges entirely from the complex web of *individual* mental states (intentions, beliefs, commitments) oriented *towards* the joint activity and *interdependent* on each other's states and actions. The "we" is a *reference* within individual minds, not an independent subject.

  Bratman's model seems more readily applicable to your co-op's messy reality. Bargaining in pairs *could* be seen as individuals developing subplans that need to mesh for the larger decision ("we intend"). Mutual responsiveness *could* arise through negotiation. However, Bratman’s conditions are demanding. Does the "silent partner" clause satisfy them? Passive non-objection likely fails Bratman's core conditions:
  *   **Intending that *we* J?** The silent partner may merely *not object* to *others* doing J, not actively intend *their own participation* in the collective "we."
  *   **Mutual Responsiveness?** No active meshing of subplans occurs with the silent partner.
  *   **Commitment to Support?** Unlikely to arise from silence.
  It thus reduces to aggregated individual *acquiescence* ("I won't stop you") plus a coordination rule, falling short of genuine shared intention even on a reductive account.

  **Resolution: The Emergent Normative "We"**

  While Searle's irreducibility captures the powerful *feel* of genuine collective action, it risks mystifying the "we." Bratman's reduction avoids this but arguably misses the *sui generis* normative force that arises from genuine joint commitment. A compelling synthesis, drawing on Margaret Gilbert's work on joint commitment, suggests that collective intention is irreducible *as a normative status*, even if built from individual mental states.

  When individuals *genuinely* commit to each other to act as a body – through explicit agreement, reciprocal promises, or robust participatory processes – they create a new normative fact: a *joint commitment*. This commitment binds them together in a way that transcends the sum of their individual commitments. The "we" exists not as a metaphysical entity, but as a *social and normative reality* constituted by the interlocking commitments of the individuals. It is irreducible because the obligation to uphold the joint commitment is owed *to the others collectively*, not just severally.

  **Your Co-op's "We": Manufactured Consent and Moral Weight**

  Your "silent partner" clause fails to generate genuine collective intentionality *on any robust account*:
  *   **Searle:** Utterly lacks the active "we-intention."
  *   **Bratman:** Fails the conditions of interlocking intentions, mutual responsiveness, and commitment.
  *   **Gilbert/Normative:** Fails to establish a genuine joint commitment through active participation. Acquiescence is not commitment.

  It manufactures procedural consent, not collective will. The "we" in "we decided" is, in these cases, largely a fiction covering aggregated individual non-objection, potentially fueled by apathy, time constraints, or fear of conflict. It *may* be a practically necessary coordination rule, but it shouldn't be confused with deep collective agreement.

  **Does Reducibility Destroy Moral Weight?**

  Not necessarily. Even if collective intention reduces to complex individual states plus coordination (Bratman's view) or joint commitment (Gilbert), the *process* and *outcome* can have significant moral weight distinct from summed individual preferences:
  1.  **Procedural Legitimacy:** If the process is fair, inclusive, and respects individual autonomy (unlike the silent clause), the decision gains legitimacy *because of the process itself*, binding participants to the outcome.
  2.  **The Binding Force of Commitment:** Joint commitments (even reductive ones) create promissory obligations between members. Breaking a genuinely made collective decision can be a wrong *to the group*, not just to individuals severally.
  3.  **Emergent Responsibility:** Groups can bear responsibility for decisions in ways that distribute differently than individual responsibility. A fair collective process can diffuse blame or justify actions that would be questionable for an individual alone.
  4.  **The Value of Collective Agency:** Achieving complex goals *together* through coordinated action has intrinsic value and fosters community, even if the "we" is built from "I's."

  However, the *silent partner clause itself* weakens moral weight. Decisions made via manufactured consent lack the deep legitimacy, binding force, and shared responsibility generated by genuine collective commitment. The moral weight leans more heavily on the *fairness of the outcome itself* and the *general legitimacy of the co-op's rules*, rather than on the specific consent of all members *for that decision*.

  **Redesigning the Co-op: Fostering the Real "We"**

  If genuine collective intentionality (as joint commitment) matters for legitimacy, solidarity, and moral weight, your co-op should move beyond the silent partner model:
  1.  **Replace Passive Consent with Active Ratification:** Shift from "object or be bound" to requiring positive affirmation ("I consent") or participation (e.g., voting, signing off) for major decisions, even if simplified. This fosters the active stance needed for commitment.
  2.  **Structured Deliberation:** Create forums (meetings, facilitated discussions, online platforms with clear phases) that encourage mutual responsiveness, meshing subplans, and airing concerns *before* a decision is framed. This builds Bratman's conditions and Searle's sense of "we."
  3.  **Explicit Commitment Moments:** Frame decisions clearly: "By agreeing to this plan, we jointly commit to..." Reinforce the normative bond.
  4.  **Tiered Consent:** Use the silent clause only for minor, non-contentious issues. Reserve active, participatory processes for major decisions where genuine collective buy-in is crucial.
  5.  **Cultivate "We" Culture:** Foster trust, mutual respect, and a shared sense of purpose. Genuine "we-intentions" flourish in a community where individuals see themselves as parts of a whole.

  **Conclusion: More than Sum, Less than Ghost**

  Collective intentionality is irreducible, not as a mysterious group mind (Searle's strongest claim), but as a unique *normative and social phenomenon* emerging from the complex interlocking commitments of individuals (a synthesis leaning on Bratman and Gilbert). The "we" exists as a web of mutual obligations and shared reference points constituted by individual actions oriented towards a joint goal. Your co-op's "silent partner" clause, however, fails to generate this reality. It substitutes procedural efficiency for active commitment, creating a phantom "we" that masks aggregated acquiescence. While reducible collective intention doesn't *eliminate* the moral weight of group decisions – which stems from fairness, process, and the obligations of joint commitment – it highlights that this weight is contingent on the *genuineness of the participatory process*. To give "we decided" its true meaning and force, your co-op must design processes that actively foster the interlocking intentions, mutual responsiveness, and explicit commitments that constitute the real, irreducible bond of collective action. Only then will the bargaining in pairs truly serve the collective "we," rather than merely inventing it after the fact.
