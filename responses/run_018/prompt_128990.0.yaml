prompt: |-
  I'm running a small reading group for local organisers who think parties are unavoidable for real collective change. Next session I want to teach Simone Weil's argument for abolishing political parties, but not as biography -- I want them to see why she thinks belonging to a party corrupts judgement rather than sharpening it. Plan the 40-minute arc.

  What has to come first: probably her concept of attention and how collective pressure warps perception, but lay out the exact dependency order so her anti-party conclusion doesn't sound like naive idealism. What's the one carrying example -- I was thinking comparing a party caucus and an unaligned jury-style delibaration on the same local zoning dispute, but tell me if that misses what she actually cares about, and specify what the case must include and exclude. The misconceptions they'll bring: she's anti-democratic, she ignores power asymmetries, she's secretly an anarchist. Where in the sequnce do I defuse each? What's the end check that shows they've grasped the epistemic damage rather than just feeling insulted? And what should I openly leave out -- her religious framework? -- and why.

  Also tell me what discovery about Weil's actual writings or about this group's prior knowledge would make you reorder the plan, and flag where your reasoning here is shakiest. End with a one-sentence summary of the plan on the very last line.
