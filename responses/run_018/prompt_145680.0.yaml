answer: |-
  1. The misplacement is structurally unavoidable because subjects cannot observe representation's formal conditions (like indexical "I-here-now") separately from represented content; these conditions constitute the observing perspective itself, making their conflation with object-like properties inevitable. No introspective refinement can bypass this, as any "improved observation" would merely reiterate the same perspectival constraints.

  2. Opponents confuse representational form with phenomenal content because they misinterpret the invariant, subject-relational structure enabling "what it's like" as intrinsic qualitative properties; this stems from mistaking the necessary framework for first-personal givenness as a discovered feature of mental states rather than their constitutive ground.

  3. Subjective experience remains real as the *act* of perspectival representation occurring from a particular locus, but this requires no irreducible qualia—only the non-illusory fact that a system is structured to represent self-specifically, with the "illusion" being the attribution of intrinsic qualities to this dynamic relational process.

  4. Reports of ineffable properties arise because indexical posits (e.g., "this" sensation) are pre-conceptual conditions for describing content; attempting to objectify them as substantive qualities encounters only the limits of their own grammatical role, generating an illusory sense of unspeakable residue.

  5. This view undermines theories grounding first-person authority in direct access to intrinsic mental features, revealing such authority as grammatical rather than epistemic: it reflects privileged operational access to one's own representational states, not incorrigible insight into qualia that do not exist.
