answer: |-
  You've put your finger on something real—mental partitioning *does* feel intuitive. But here's why it doesn't rescue you: **your future selves are still *you*, bound by the same contracts and consequences, even if they inhabit different frames.** 

  Suppose your "work-self" strictly prefers £1000 for sure over a gamble A, while your "leisure-self" strictly prefers gamble B over £1000 for sure. If these are genuinely disjoint, fine—no direct money pump. But coherence isn't just about avoiding simultaneous bets. It's about **consistent valuation of outcomes across time and identity.** 

  Imagine a cunning bookie offers leisure-you a contract today: pay £1 to *sell* them the right to force work-you to accept gamble B tomorrow in exchange for £1000. Leisure-you, preferring B over £1000, happily sells that "right" for £1 (seeing it as a gain). Tomorrow, the bookie forces work-you—who *disprefers* B to £1000—to accept B instead of £1000. Work-you loses the £1000 certainty equivalent, while leisure-you gained only £1. Net loss? Up to £999, extracted *because the bookie bridged the frames by exploiting your discontinuous identity*. 

  Your brain's partitioning isn't a firewall—it's a vulnerability. If you're *one agent* across time, any preference divergence licenses deals that impose sure losses on your future incarnations. Rationality demands unified agency because *you* are the entity left holding the bag. The frames "interact" through the continuity of your legal and financial identity. Concede partitioning might delay exploitation? Absolutely. But it *creates* arbitrage opportunities against your future selves. That’s literally self-defeating. Your move.
