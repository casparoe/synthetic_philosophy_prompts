  We are designing a teaching plan for a 90-minute session on the distinction between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), using a modified version of the presumptuous philosopher thought experiment. The audience is retired natural scientists with frequentist intuitions and little exposure to decision theory or anthropic reasoning. The goal is to build understanding step by step, intercept misconceptions, and use a concrete ecological scenario to avoid cosmological distractions.

  Plan Structure:
  1. Introduction (10 minutes)
  2. Foundational Concepts: Observer Selection Effects (15 minutes)
  3. The Self-Sampling Assumption (SSA) Explained (15 minutes)
  4. Introducing the Self-Indication Assumption (SIA) (15 minutes)
  5. The Central Case: Modified Ecological Field-Survey Scenario (20 minutes)
  6. Addressing Misconceptions (10 minutes)
  7. Closing Diagnostic Question and Discussion (5 minutes)

  Total: 90 minutes

  Detailed Plan:

  1. Introduction (10 minutes)
     - Briefly state the topic: How should we reason when our own existence as observers might be relevant to the hypotheses we are testing?
     - Mention that in science, we often account for selection biases, but in cases where we are the observers, the bias is not just about what we see but about the fact that we exist to see it.
     - Present the goal: to understand two different ways of accounting for observer selection effects: SSA and SIA, and why the distinction matters.

  2. Foundational Concepts: Observer Selection Effects (15 minutes)
     - Start with a simple example of selection bias in science (e.g., in ecology: if you set up camera traps only in a certain type of forest, you might overestimate the population of species that prefer that forest).
     - Then, introduce the idea that in some cases, the very fact that we are here to observe might be a form of selection. Example: Why do we observe a universe with constants that allow life? (But avoid cosmology; so instead, use a more down-to-earth example.)
     - Use an example from epidemiology: Suppose we are studying a disease that kills quickly. We might only observe the survivors. So the fact that we are alive to observe might tell us something about the disease. (But since the group includes epidemiologists, this might be too close to home. Instead, we'll build towards the ecological scenario.)
     - Introduce the idea that in such cases, we are not just correcting for what we see, but for the fact that we exist to see it. This is an observer selection effect.

  3. The Self-Sampling Assumption (SSA) Explained (15 minutes)
     - Define SSA: One should reason as if one were a random observer from the set of all possible observers in the universe (or in the reference class).
     - Simple example: Imagine a universe that has two types of planets: 90% are lifeless and 10% have life. If we are a random observer from all actual observers, then we are more likely to find ourselves on a planet with life. But note: we are conditioning on being an observer.
     - Key point: SSA does not alter the prior probability of the theory (the proportion of planets with life). It only conditions on the fact that we are an observer. So we update our belief about which type of planet we are on, but the prior about the universe remains.

  4. Introducing the Self-Indication Assumption (SIA) (15 minutes)
     - Define SIA: The fact that you exist as an observer gives you reason to favor hypotheses under which more observers exist.
     - Example: Suppose there are two theories about the universe: Theory A predicts 10 billion observers, Theory B predicts 10 trillion observers. SIA says that, all else equal, you should assign a higher prior probability to Theory B because there are more observers (hence more chances for you to exist).
     - Contrast with SSA: SSA conditions on being an observer and then updates on the evidence. SIA changes the prior probabilities of the theories based on the number of observers they predict.

  5. The Central Case: Modified Ecological Field-Survey Scenario (20 minutes)
     - Present the scenario: 
       You are an ecologist conducting a survey of a remote archipelago. There are two possible islands, Island A and Island B, which are identical in every way except that Island A has a small population of a rare bird (say, 100 individuals) and Island B has a large population (10,000 individuals). You have been dropped off on one of the islands by a helicopter, but due to a navigation error, you don't know which island you are on. Your task is to estimate which island you are on by counting the birds. However, there's a twist: you have access to an archive of census sheets from previous surveys, but every sheet is blank (unrecorded) except for the one you are about to fill in. You are the only observer who has ever been to this archipelago, and you are about to become the first to record data.
     - You walk a transect and count the birds. But before you even start counting, you realize that your very presence as an observer might give you information. How?
     - Now, the presumptuous philosopher's reasoning (SIA-like): "Since there are 100 times more birds on Island B, there are 100 times more chances for me to have been placed on Island B. Therefore, even before counting, I should be 99% sure I am on Island B."
     - Why is this presumptuous? Because it ignores the prior setup. The helicopter dropped you randomly on one of the two islands. The prior probability should be 50% for each island. But the philosopher is using the number of birds to alter the prior.
     - Now, what is the correct reasoning (SSA)? 
       - Prior: 50% for each island.
       - But now, note that you are an observer. However, in this scenario, the number of birds does not affect the chance of you being there because you were placed by the helicopter. The birds are not the observers; you are the only observer. So we don't have a typical observer selection effect. Therefore, we must adjust the scenario to make the birds the observers? 
     - Let's adjust: Instead, let's imagine that the birds are the observers. But we are the one doing the counting. This is messy.

     Revised Scenario (to better fit the anthropic reasoning):
     Imagine that instead of being an ecologist, you are a member of the bird species. You are a bird. And you are trying to figure out which island you are on. There are two islands: Island A with 100 birds and Island B with 10,000 birds. You are a randomly selected bird from the entire population of both islands. Then, without any other information, what is the probability that you are on Island B? 
       - By SSA: You are a random bird. So the probability is proportional to the number of birds: 10,000 / (100 + 10,000) ≈ 99.9%.
       - By SIA: This would also give the same result? But wait, SIA is about the prior on the theories. In this case, the two theories are: the island is A (with 100 birds) or B (with 10,000). If we apply SIA, we would say that the prior probability of being on Island B is higher because there are more birds. But note: the two islands exist? Or are we considering two possible worlds? 

     To make it two theories about the world:
     Theory A: There is only one island, which is Island A (with 100 birds).
     Theory B: There is only one island, which is Island B (with 10,000 birds).
     Now, you are a bird. You exist. According to SIA, since Theory B predicts 100 times more birds, it gets a 100 times higher prior probability. So P(Theory B) = 100 * P(Theory A). Then, since you are a random bird under each theory, under Theory A, the chance that you exist is 1 (if you are one of the 100) but note: under Theory A, there are only 100 birds, so if you exist, you must be one of them. Similarly for Theory B. But then the probability that you exist given Theory A is 1, and given Theory B is 1. So the posterior:
          P(Theory B | you exist) = P(you exist | Theory B) * P(Theory B) / [ ... ] 
          = 1 * (100 * P(Theory A)) / [1 * P(Theory A) + 1 * (100 * P(Theory A))] 
          = 100 * P(Theory A) / (101 * P(Theory A)) = 100/101.

     So SIA gives 100/101 for Theory B.

     Now, SSA: The reference class is all birds. We assume we are a random bird. Then, the probability that we are in a world with Theory B is proportional to the number of birds in that world. But in this setup, the worlds are mutually exclusive? So the total number of birds across worlds is not defined. This is confusing.

     Instead, we use the original setup of the presumptuous philosopher: 
       There are two theories about the universe. Theory A: the universe contains 10 billion observers. Theory B: the universe contains 10 trillion observers. We are about to perform an experiment that will distinguish them. But the presumptuous philosopher says: we don't need the experiment; Theory B is 1000 times more likely because it has 1000 times more observers.

     But to make it ecological, we can say:
       There are two theories about the archipelago. Theory A: there are only 100 birds of this species in the entire archipelago (on one island). Theory B: there are 10,000 birds (on one island). You are a randomly selected bird. Without any other information, what should you believe?

     Then, SSA: if we are a random bird, then we are 100 times more likely to be on the island with 10,000 birds. So we assign 99% probability to Theory B.

     But SIA: we assign a prior to the theories based on the number of birds. So if we set a prior P(Theory A) = P(Theory B) = 0.5, then after learning we are a bird, we update? Actually, in SSA we update by conditioning on being a bird. In SIA, we change the prior.

     We want to show that SSA and SIA both lead to the same posterior in this case, but they are different principles. However, the presumptuous philosopher is using SIA to jump to a conclusion without evidence, which is the problem.

     We need a scenario where SSA and SIA differ. The classic is the doomsday argument vs. the counter with SIA.

     But for our group, let's design a scenario where they differ:

     Scenario: 
       There are two theories about the archipelago. 
          Theory A: There are 100 islands, each with 100 birds (total 10,000 birds).
          Theory B: There is only 1 island with 10,000 birds.
       You are a bird. You are on an island. How many other birds are on your island?

     But note: under Theory A, the total birds are 10,000, and under Theory B, also 10,000. So the total number of birds is the same. But the distribution is different.

     Now, what is the chance that you are on an island with 100 birds (if Theory A is true) or with 10,000 birds (if Theory B is true)?

     By SSA:
       If Theory A is true, there are 10,000 birds, and 100 of them are on islands with 100 birds? Actually, no: each island has 100 birds, so all birds are on islands with 100 birds. 
       If Theory B is true, all 10,000 birds are on one island.

     So if you are a random bird, then under Theory A, you are definitely on an island with 100 birds. Under Theory B, you are on the one island with 10,000 birds.

     Now, without any information about the size of the island you are on, what do you believe?

     By SSA: You are a random bird. The probability that you are on an island with 100 birds is the proportion of birds that are on such islands. Under Theory A, that's 100%. Under Theory B, that's 0%. So if you start with equal priors on the theories, then after learning you are a bird (which is always true), you haven't updated. But now, if you look around and see that you are on a small island (with 100 birds), then that is evidence for Theory A. But what if you don't look?

     We want a case where the mere fact of existence gives information.

     Alternatively, we can use the original presumptuous philosopher and map it to an ecological context:

     Revised Central Scenario:
       You are a researcher who has been placed in a room with a computer that simulates the entire history of an ecosystem. The computer can run in two modes:
          Mode A: It simulates only one ecosystem (with 100 observers, i.e., sentient birds, say).
          Mode B: It simulates 1000 ecosystems (each with 100 observers, so total 100,000 observers).
       The computer is set to run in one of these modes, chosen at random (50-50). You are one of the simulated observers. You are about to be shown data that will tell you which mode the computer is in, but before seeing that, what should you believe?

     By SSA: You are a random observer. The probability that you are in Mode B is the fraction of observers in Mode B: 100,000 / (100 + 100,000) ≈ 99.9%. So you should believe Mode B with 99.9% probability.

     By SIA: We adjust the prior. The prior probability of Mode B is 0.5, but because Mode B has 1000 times more observers than Mode A (100,000 vs. 100), we assign a prior that is 1000 times higher to Mode B? So we set P(Mode B) = 1000 * P(Mode A). Then, since we are an observer, we condition on existing. But in both modes, we exist. So the posterior:
          P(Mode B | we exist) = P(we exist | Mode B) * P(Mode B) / [P(we exist | Mode A)*P(Mode A) + P(we exist | Mode B)*P(Mode B)]
          = 1 * (1000 * P(Mode A)) / [1 * P(Mode A) + 1 * (1000 * P(Mode A))] 
          = 1000 / 1001 ≈ 99.9%.

     So in this case, both SSA and SIA give the same result. But the presumptuous philosopher is using the observer count to update without evidence. The flaw is that in this case, there is no new evidence: we always knew we would be an observer.

     To show the difference, we need a case where the theories have different prior probabilities and the existence of observers is not certain.

     Classic difference: 
          Theory A: 1% chance of 100 observers, 99% chance of 0 observers.
          Theory B: 100% chance of 10,000 observers.

     Without SIA: prior for Theory A and B equal. Then, we condition on existing:
          P(exist | A) = 0.01
          P(exist | B) = 1
          So P(A|exist) = (0.01 * 0.5) / (0.01*0.5 + 1*0.5) = 0.01 / 1.01 ≈ 0.01
          P(B|exist) = 1 / 1.01 ≈ 0.99

     With SIA: we set the prior for a theory proportional to the expected number of observers. So:
          Prior for A: proportional to 0.01 * 100 = 1
          Prior for B: proportional to 1 * 10,000 = 10,000
          So P(A) = 1/(1+10000) and P(B)=10000/(1+10000). Then, condition on existing: 
          P(exist|A)=1 (because if A is true and we exist, then the 100 observers world happened) but note: we are conditioning on the theory, and we already have the prior based on expected observers. Then, if we exist, we update? Actually, under A, we exist only if the 100 observers world happened. So:

          P(A|exist) = P(exist|A) * P(A) / P(exist) 
          But P(exist|A) is actually 0.01? 

     This becomes messy.

     To avoid complexity, we stick with the case where both theories guarantee observers, but one has more. Then SSA and SIA agree. The point of the presumptuous philosopher is that they use the observer count as evidence without an experiment, which is valid under these assumptions. But why is it considered presumptuous? Because it bypasses empirical evidence. We want to show that the reasoning is structurally sound under SIA/SSA, but that it conflicts with our intuition that we should require empirical evidence.

     However, the group's misconception is that they think a theory predicting more observers should be preferred because it offers more opportunities for verification. This is not exactly SIA, but a different intuition.

     We will use the following scenario to illustrate the presumptuous philosopher and why it is controversial:

     Scenario: 
          Two theories about the archipelago:
            Theory A: There are 10 islands, each with 100 birds (total 1000 birds).
            Theory B: There are 100 islands, each with 100 birds (total 10,000 birds).

          You are a bird. You are on one island. You have not yet counted the birds on your island. What should you believe about the total number of birds?

          By SSA: You are a random bird. The total number of birds under Theory A is 1000, under Theory B is 10,000. The chance that you are in Theory B is 10,000 / (1000+10,000) = 10/11 ≈ 91%. So you should believe Theory B.

          But note: you haven't done any survey! You are just using the fact that you exist. This is the presumptuous philosopher's move.

     Now, why might this be flawed? Because the helicopter drop (or the process by which you came to be) might not be random among all birds. But in the scenario, we assume you are a random bird.

     The key misconception: the group might think that Theory B should be preferred because it has more birds and hence more chances for you to exist. This is essentially SIA. But in this case, SSA gives the same result.

     To intercept the misconception that "more opportunities for verification" means we should prefer the theory with more observers, we must note that in the scenario, we are not verifying anything by our existence. We are simply updating based on the fact that we exist, which is more likely under the theory with more observers.

     However, the point of the presumptuous philosopher is that this update happens without any empirical evidence about the world beyond our existence.

     The flaw that we want to highlight is the conflation of two things:
          (a) The evidence that we exist is more likely under a theory with more observers, so we update in favor of that theory (which is correct under SSA/SIA).
          (b) The idea that we have verified the theory more because there are more observers (which is not necessarily true).

     But in fact, in this scenario, we have done no verification beyond noting our own existence.

     Now, for the closing diagnostic question:
          "Suppose we have two theories about the universe. Theory A predicts 1 billion observers, Theory B predicts 1 trillion observers. We are about to do an experiment that will definitively confirm one and rule out the other. Before the experiment, the presumptuous philosopher says we should already believe Theory B is a billion times more likely. Is this reasoning: 
            A) Correct, because there are more observers under B, so we are more likely to be in B.
            B) Incorrect, because we have not yet done the experiment and should be agnostic.
            C) Incorrect, because the prior probabilities should be adjusted for the number of observers, but not by that much.

          And why?"

     We want them to see that under SSA/SIA, the reasoning is correct, but it is controversial because it bypasses empirical evidence. However, the point of the session is to distinguish SSA and SIA, not to resolve the controversy. So we want them to recognize the structure: the update is based on the fact that we are observers, and the update factor is proportional to the number of observers.

     But we also want to intercept the idea that this update is just ordinary Bayesian conditioning under a uniform prior. It is not, because the uniform prior is over observers, not over the theories. That's the key of SSA.

     Steps for the scenario:

     a) Present the archipelago with two theories about the total number of birds (and islands), and that you are a randomly selected bird.
     b) Ask: without any survey data, what should you believe about the total number of birds? 
     c) Explain the SSA reasoning: as a random bird, you are more likely to be in the world with more birds.
     d) Note that this is not because the theory with more birds is more likely to be true in the absence of observers, but because if it is true, there are more birds to be.
     e) Then, introduce the presumptuous philosopher: they would say we don't need to do the survey; we already know. But is that satisfying? It feels like cheating because we haven't collected data.

     Now, the misconceptions:

     1. Conflation with ordinary Bayesian conditioning under a uniform prior: 
          They might think that we are just assigning uniform prior over the birds and then conditioning on being a bird. But that is exactly what SSA does. However, the prior over the theories might not be uniform over the theories as we normally assign. Normally, we might assign uniform prior over the two theories (50-50). But in SSA, we are effectively using a prior that is weighted by the number of observers. This is a key difference.

          Interception: Explicitly state that in ordinary Bayesian updating, we start with a prior over the theories (say 50-50) and then update based on evidence. In the bird scenario, the evidence is "I am a bird". Then:
             P(Theory B | I am a bird) = P(I am a bird | Theory B) * P(Theory B) / P(I am a bird)

             P(I am a bird | Theory B) = 1 (if we assume that in Theory B, we are always a bird? But note: in Theory B, there are birds and we are one of them. But how did we come to be a bird? We are assuming we are a randomly selected bird.)

          Actually, if we are a randomly selected bird from the entire set of birds in both theories, then the probability of being a bird given Theory B is the number of birds in B divided by the total birds in both theories? But wait, the theories are about the entire world, so they are mutually exclusive? Then we cannot have birds from both.

          This is the confusion. In the standard anthropic reasoning, we consider the set of all possible observers in all possible worlds? That's not standard Bayesian. So we are extending Bayesianism to include self-location.

     2. Slide into moral obligation: 
          Some might think that because more observers are better, we should act to create more observers. But this is a separate ethical issue. Interception: State clearly that SIA is about belief updating, not about ethics. It does not imply we should maximize the number of observers.

     Closing diagnostic question:
          "In the ecological scenario, if you are a randomly selected bird, and Theory A says there are 1000 birds in total, and Theory B says there are 10,000, should you assign a higher probability to Theory B even before gathering any data about the number of islands or birds? Why or why not?"

          We are looking for: Yes, because if you are a random bird, you are more likely to be in the world with more birds. But note: they might say "because there are more chances for me to exist" which is the SIA intuition. We want to see if they understand the self-sampling.

     Finally, technical apparatus to refuse:
          - Formal derivation of the SIA weighting factor (e.g., the shift from prior to prior times number of observers).
          - The doomsday argument and its counter-arguments.
          - Simulation arguments (Bostrom's trilemma).
          - The full measure problem in cosmology.

     We will acknowledge that these are important but beyond the scope of a 90-minute session.

  Revised Teaching Plan:

  1. Introduction (10 minutes)
     - Topic: Reasoning when our own existence is evidence.
     - Example: Epidemiology survivor bias, but then move to ecology.

  2. Foundational Concepts (15 minutes)
     - Selection bias in ecology: camera trap placement.
     - Observer selection: If we are alive to observe, that tells us something about the lethality of diseases (or in ecology: if we are a bird, that tells us something about the bird population).

  3. Self-Sampling Assumption (15 minutes)
     - Define: You are a random observer from all possible observers.
     - Simple example: Two planets, one with 100 people, one with 1000. If you are a random person, you are 10 times more likely to be on the second planet.

  4. Self-Indication Assumption (15 minutes)
     - Define: Hypotheses that predict more observers should be given higher prior probability because they imply more chances for you to exist.
     - Example: Two theories about the universe: one predicting a few observers, one predicting many. SIA says assign higher prior to the many.

  5. Central Scenario: The Archipelago (20 minutes)
     - Present:
          Theory A: 10 islands, each with 100 birds (1000 total).
          Theory B: 100 islands, each with 100 birds (10,000 total).
          You are a randomly selected bird. You haven't counted the birds on your island or the number of islands. 
     - What is the probability that the total number of birds is 10,000?
          By SSA: 10,000 / (1000+10,000) = 10/11.
          By SIA: Prior for Theory B is 10 times higher than Theory A (because 10,000 vs 1000). Then, since we exist (and we are a bird) in both, the posterior is still 10/11.
     - The presumptuous philosopher: We don't need to count; we are already 91% sure of Theory B.

  6. Addressing Misconceptions (10 minutes)
     - Misconception 1: This is ordinary Bayesian updating with a uniform prior over observers. 
          Clarify: Yes, that's what SSA does. But in ordinary Bayesianism, we usually start with a prior over theories, not over observers. Here, we are using a prior over observers that spans multiple theories. This is an extension.
     - Misconception 2: This implies we should try to maximize the number of observers (moral obligation).
          Clarify: SIA is about belief, not about what we should do. It does not entail a moral obligation.
     - Misconception 3: The effect diminishes with larger N? 
          In the thought experiment, the ratio of probabilities is (number in B) / (number in A + number in B). If both are large, the absolute difference might be large but the update is fixed by the ratio. It doesn't diminish.

  7. Closing Diagnostic (5 minutes)
     - Question: "In the archipelago scenario, before any data collection, should you assign a higher probability to Theory B? Why or why not?"
     - We hope they say: Yes, because I am a random bird and there are more birds in Theory B, so I am more likely to be in a world governed by Theory B.

     - Then, the flaw in the presumptuous philosopher's inference is not structural (under SSA/SIA it is correct) but it feels like cheating because it doesn't require empirical evidence. However, the existence of the observer is empirical evidence. The controversy is about whether we should use this kind of evidence in science.

     But note: We are not resolving the controversy, only explaining the reasoning.

     Given the time, we will not delve into the controversy but only present the distinction between SSA and SIA and how they operate.

     However, the group's initial intuition might be that the philosopher is wrong. We should acknowledge that this reasoning is debatable, but our goal is to expose the structure.

     We'll end by saying: 
          "The presumptuous philosopher's move is to use the mere fact of their existence to update in favor of theories with more observers. Whether this is valid is debated, but the structure of the argument is based on the self-sampling or self-indication assumptions. In this session, we have seen how these assumptions work and how they might be applied."

     And acknowledge: 
          "We have not covered the formal derivations of the weighting factors, nor have we discussed the broader literature on simulation arguments or the measure problem in cosmology. These are complex topics that require more time."
answer: |-
  ### Teaching Plan: Distinguishing Self-Sampling (SSA) and Self-Indication (SIA) Assumptions  
  **Total Time:** 90 minutes  
  **Objective:** Clarify the structural distinction between SSA and SIA using a modified ecological scenario, intercept common misconceptions, and reveal flaws in anthropic reasoning.  

  ---

  #### **1. Introduction: Observer Selection as a Foundational Puzzle (10 min)**  
  - **Hook:** Pose a question: *"If you were the only ecologist surveying a forest, how would your existence as an observer influence your conclusions about species abundance?"*  
  - **Context:** Contrast frequentist corrections for sampling bias (e.g., camera-trap placement) with observer-centered puzzles (e.g., why we observe a life-permitting universe).  
  - **Goal:** Introduce anthropic reasoning as distinct from conventional statistics.  
  - **Key Omission:** Explicitly avoid cosmology; focus on terrestrial ecology.  

  ---

  #### **2. Foundational Concepts: Observer Selection Effects (15 min)**  
  - **Core Idea:** Distinguish *sampling bias* (correctable via larger *N*) from *observer selection* (irreducible self-location uncertainty).  
  - **Concrete Example:**  
    > *An epidemiologist studies a disease with 90% fatality. Survivors underestimate lethality because "the dead can't report."*  
  - **Misconception Interception:**  
    - **Predictable Error:** "Observer effects vanish with more data."  
    - **Correction:** "Dead observers yield no data. The bias isn’t fixable by larger *N*; it’s inherent in the perspective."  

  ---

  #### **3. Self-Sampling Assumption (SSA) (15 min)**  
  - **Definition:** *Reason as if you are a random observer from all possible observers in your reference class.*  
  - **Ecological Scenario Setup:**  
    > *You are an ecologist dropped on one of two islands (A or B). Island A has 100 birds, Island B has 10,000 birds. You know the helicopter randomly selected an island (50% prior). Before counting, you realize: Your existence as an observer might imply something.*  
  - **SSA Reasoning:**  
    - "If I’m a random observer, I’m 100x more likely to be on Island B."  
    - Posterior: *P(Island B | I exist) = 10,000/(100 + 10,000) ≈ 99%*.  
  - **Key Point:** SSA *conditions* on existence under a fixed prior.  

  ---

  #### **4. Self-Indication Assumption (SIA) (15 min)**  
  - **Definition:** *Your existence as an observer increases the prior probability of hypotheses that predict more observers.*  
  - **Same Ecological Scenario:**  
    - Prior: *P(Island A) = P(Island B) = 50%*.  
    - **SIA Update:** "My existence hints Island B is more probable *a priori* because it supports more observers."  
      - *P(Island B) ∝* Original prior × Number of observers (10,000).  
      - *P(Island A) ∝* Original prior × 100.  
      - Posterior: *P(Island B) = 10,000/(100 + 10,000) ≈ 99%*.  
  - **Paradox Emergence:** *Both SSA and SIA give identical posteriors here.*  

  ---

  #### **5. The Central Case: Modified "Presumptuous Philosopher" Scenario (20 min)**  
  **Scenario:**  
  > *You are an ecologist who wakes up alone in an archive of unrecorded census sheets from a vast archipelago. Two theories exist:*  
  > - **Theory A:** 1 island with 100 birds (total observers: 100).  
  > - **Theory B:** 1,000 islands with 100 birds each (total observers: 100,000).  
  > *A coin flip determined which theory is true (50% prior). You have done no fieldwork. The "presumptuous philosopher" claims: "Theory B is 1,000x more likely because it predicts more observers!"*  

  **Critical Features:**  
  - No multiverse cosmology (avoids sci-fi).  
  - Observers = birds (ecological, relatable).  
  - **Structural Omission:** Theories predict identical local data (e.g., your island always has 100 birds).  

  **Guided Discussion:**  
  1. *SSA View:* "I am a random bird. Theory B has 99.9% of all birds, so *P(B) ≈ 99.9%*."  
  2. *SIA View:* "My existence suggests *P(B) ∝* 100,000 vs. *P(A) ∝* 100, so *P(B) ≈ 99.9%*."  
  3. **Reveal the Flaw:**  
     - "Both agree numerically, but SIA alters the *prior* while SSA alters the *likelihood* of self-location."  
     - **Crucial Twist:** *Theories A and B predict identical local observations (one island with 100 birds). The philosopher’s claim requires no empirical testing.*  

  **Misconception Interception:**  
  - **Predictable Error:** "This is just Bayes with uniform priors over observers."  
    - **Correction:** "Uniformity over observers *is* SSA. Bayes alone doesn’t specify the prior over *theories*."  
  - **Predictable Error:** "We should prefer Theory B to maximize verification opportunities."  
    - **Correction:** *Separate belief from ethics.* "SIA updates beliefs, but doesn’t imply moral duties to create observers."  

  ---

  #### **6. Addressing Misconceptions (10 min)**  
  - **Conflation Trap (Self-location vs. Bayes):**  
    > *"In conventional Bayes, we update on data (e.g., bird counts). In anthropics, we update on *being here to see the data*."*  
    - **Interception:** Use the archive scenario. "Without SSA/SIA, *why* does existing as the 100th bird on an island support Theory B?"  
  - **Moral Obligation Slide:**  
    > *"SIA doesn’t say we *should* maximize observers. It’s epistemic, not normative. A theory predicting 1 trillion observers may be *more likely*, but not *morally better*."*  
    - **Interception:** Preempt during SIA definition (Step 4).  

  ---

  #### **7. Closing Diagnostic Question (5 min)**  
  > **"In the archipelago scenario, the presumptuous philosopher says Theory B is 1,000x more likely *without leaving the archive*. Is this inference:**  
  > **A) Correct, because more observers mean higher probability?  
  > B) Flawed, because local data hasn’t been collected?  
  > C) Flawed for a deeper structural reason?"**  

  **Answer Key:**  
  - **Correct Answer:** **C** (if they grasp the distinction).  
  - **Why:** The flaw is structural—the philosopher treats observer count as *evidence* for Theory B, but **identical local data** undermines empirical testing. SSA/SIA are *assumptions*; neither is provable from first principles.  

  ---

  #### **Technical Exclusions (Explicitly Stated)**  
  1. **Formal SIA Weighting:** "We skip the derivation *w ∝ N* to avoid math distractions."  
  2. **Simulation Hypotheses:** "We avoid 'are we in a simulation?' to stay grounded."  
  3. **Literature/Readings:** "No citations today; we build intuition from scratch."  

  ---

  **Teaching Strategy:**  
  - **Dialogue-Driven:** Pose questions at each stage (e.g., "What would a frequentist say here?").  
  - **Whiteboard Use:** Sketch islands/observers to visualize probabilities.  
  - **Meme Deployment:** "The philosopher is 'presumptuous' not because he’s wrong, but because he substitutes observer counts for fieldwork."  
  - **Bridge to Science:** "In epidemiology, this resembles inferring disease severity from survivor data—but here, *you* are the survivor."
