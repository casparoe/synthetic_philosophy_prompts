prompt: |-
  For a feature I am preparing on whether historians can ever escape the moral and conceptual frameworks of their own era, I want the specification before surveying the positions. Write the desiderata that any adequate theory of historiographical judgment must meet: the cases it has to handle correctly (for instance, evaluating medical practices that were standard then but violate current ethics, or praising abolitionists within societies that normalized slavery), the distinctions it must preserve and not collapse (explanation versus justification, moral presentism versus epistemic presentism, anachronism of concept versus anachronism of value), and the practical or methodological constraints it must respect (archival silence, the need to recover actors’ own categories, the risk of projecting modern taxonomies onto past practices). For each requirement, state the consideration that makes it non-negotiable or merely a preference of a particular camp. Then address the central tension: is the demand to honor past agents’ self-understandings jointly satisfiable with the demand to apply present ethical knowledge, or does that pairing itself constitute an unsatisfiable subset that defines the field’s core problem? Keep the weight on the criteria and their motivating cases; I will compare the actual theories separately.
reasoning: |-
  Okay, the user is preparing a feature on whether historians can escape their own era's moral and conceptual frameworks. They need a specification of desiderata for historiographical judgment theories before surveying positions. Let me unpack this carefully.

  First, the core tension they highlight is crucial: honoring past agents' self-understanding versus applying present ethical knowledge. This seems like the central knot historians struggle with. The user wants criteria that any adequate theory must meet, with clear cases, distinctions and constraints. 

  Looking at the cases mentioned - evaluating past medical practices or abolitionists in slave societies - these are perfect stress tests. A theory must handle both without collapsing into presentism or relativism. The medical case pushes us on moral judgment of actions considered ethical then but reprehensible now. The abolitionist case challenges us to recognize moral courage within unjust systems. 

  The distinctions they list are equally vital. Explanation vs justification is foundational - we can explain why something happened without endorsing it. Moral vs epistemic presentism matters because judging past morals differs from projecting modern concepts onto past cognition. And confusing conceptual anachronism (applying modern terms) with value anachronism (applying modern ethics) would ruin analysis.

  For constraints, archival silence is key - we can't judge what we can't know. Recovering actors' categories prevents distortion, while avoiding modern taxonomies stops us from forcing past into present boxes. These aren't preferences but necessities for honest history.

  The non-negotiable status comes from history's purpose: understanding human experience across time. Fail these, and we get either present-day propaganda or incoherent relativism. The central tension? Both demands are valid but conflict - we must recognize past perspectives while acknowledging our ethical progress. Any theory must navigate this without dissolving one pole entirely. That's the field's core problem laid bare.
answer: |-
  Here is a specification of desiderata for a theory of historiographical judgment, structured around your requirements of cases, distinctions, constraints, and the core tension:

  **Desiderata for an Adequate Theory of Historiographical Judgment**

  1.  **Case: Evaluating Practices Standard Then, Reprehensible Now (e.g., Historical Medical Practices)**
      *   **Requirement:** The theory must enable nuanced judgment of practices widely accepted in their own context but violating contemporary ethics (e.g., surgery without anesthesia, non-consensual experimentation, historical forms of corporal punishment).
      *   **Non-Negotiable Because:** Historians must account for historical context *without* implying ethical neutrality or excusing harm. Failure here risks either moral relativism ("it was normal then, so it was fine") or anachronistic condemnation that prevents understanding *why* such practices persisted. The need to reconcile historical context with enduring notions of human suffering/dignity is fundamental.

  2.  **Case: Praising Agents Within Unjust Systems (e.g., Abolitionists in Slave Societies)**
      *   **Requirement:** The theory must allow for recognizing and positively evaluating the moral courage and agency of individuals who challenged the dominant, deeply immoral norms of their time (e.g., abolitionists, dissenters, reformers), even if their actions or views fall short of modern standards.
      *   **Non-Negotiable Because:** Denying the possibility of moral progress or heroism within the past undermines the very idea of ethical agency and historical change. Conversely, failing to contextualize their limitations risks hagiography. History requires recognizing both the constraints of structure and the potential for individual moral action.

  3.  **Distinction: Explanation vs. Justification**
      *   **Requirement:** The theory must rigorously maintain the separation between *explaining* why historical actors believed or acted as they did (context, motives, constraints) and *justifying* or endorsing those beliefs or actions.
      *   **Non-Negotiable Because:** Collapsing this distinction is the root of both the "historian's fallacy" (assuming actors should have known better given future knowledge) and apologetics for historical injustice. Understanding causality is the historian's core task; ethical evaluation is separate, though often necessary. Blurring them produces bad history and bad ethics.

  4.  **Distinction: Moral Presentism vs. Epistemic Presentism**
      *   **Requirement:** The theory must differentiate between:
          *   *Moral Presentism:* Applying contemporary ethical standards directly and unreflectively to judge past actors/practices.
          *   *Epistemic Presentism:* Using current knowledge, concepts, and frameworks to *understand* the past (e.g., using modern epidemiological models to analyze a historical plague, recognizing systemic racism in past societies even if the specific term wasn't used).
      *   **Non-Negotiable Because:** Rejecting *all* presentism paralyzes historical understanding (we cannot escape our contemporary knowledge base). However, conflating the epistemic necessity of present frameworks with the ethical problem of *moral* presentism leads to confusion. Epistemic presentism is often indispensable; moral presentism is problematic but must be distinguished clearly.

  5.  **Distinction: Anachronism of Concept vs. Anachronism of Value**
      *   **Requirement:** The theory must distinguish between:
          *   *Anachronism of Concept:* Attributing specific, historically bounded concepts or categories to actors who demonstrably lacked them (e.g., calling a medieval knight "homosexual" based on modern identity categories).
          *   *Anachronism of Value:* Applying modern ethical values to judge past actions/persons where the *concept* of the value *may* have existed, but its specific application or weighting differed significantly (e.g., judging ancient rulers by modern standards of human rights).
      *   **Non-Negotiable Because:** While both are risks, they are different in kind and severity. Concept anachronism fundamentally distorts historical reality by misrepresenting actors' self-understanding. Value anachronism is an ethical judgment issue but doesn't necessarily falsify the *description* of the past. A theory must address both but recognize the greater epistemic danger of conceptual anachronism.

  6.  **Constraint: Archival Silence & Fragmentary Evidence**
      *   **Requirement:** The theory must acknowledge that judgments are constrained by the limitations of the historical record. Absence of evidence is not evidence of absence; judgments must account for gaps and silences (especially regarding marginalized groups).
      *   **Non-Negotiable Because:** Historians work with traces. Demanding definitive judgment where evidence is absent or systematically suppressed (e.g., experiences of the enslaved, the poor, women) is impossible and leads to speculative or biased conclusions. Responsible judgment requires epistemic humility about the limits of the record.

  7.  **Constraint: Recovering Actors' Own Categories (Hermeneutic Priority)**
      *   **Requirement:** The theory must prioritize understanding historical phenomena *as they were understood by the actors themselves*, using their language, concepts, and frameworks as the starting point for analysis.
      *   **Non-Negotiable Because:** This is foundational to historical understanding itself. Failure renders the past merely a reflection of the present, distorting motives, meanings, and the internal logic of past societies. It’s an epistemic necessity for accessing the "pastness of the past."

  8.  **Constraint: Avoiding Projection of Modern Taxonomies**
      *   **Requirement:** The theory must guard against imposing contemporary classifications, identities, and social structures onto the past where they do not fit (e.g., projecting modern nation-states onto feudal polities, applying modern gender binaries rigidly to all cultures, interpreting pre-modern economies solely through capitalist lenses).
      *   **Non-Negotiable Because:** Projection creates profound historical inaccuracy. It obscures the specific, often radically different, ways past societies organized experience. This is a core methodological imperative for achieving historical fidelity and avoiding presentist distortion.

  **Addressing the Central Tension:**

  The demand to **honor past agents' self-understandings** (Desiderata 7 & 8) and the demand to **apply present ethical knowledge** (implicit in Desiderata 1 & 2, and distinct from Moral Presentism per 4) constitute the field's core, productive, and arguably *unsatisfiable* tension. Here's why:

  1.  **Epistemic vs. Ethical Imperatives:** Recovering self-understanding is primarily an *epistemic* goal – understanding the past on its own terms. Applying present ethical knowledge is an *evaluative* goal – making normative sense of the past from our situated perspective. These goals operate on different planes.
  2.  **The Inevitability of Perspective:** While striving for hermeneutic fidelity, historians *cannot* fully shed their present conceptual and ethical frameworks (Epistemic Presentism, Desideratum 4). Our questions, concerns, and values shape what we find significant and how we interpret evidence.
  3.  **The Demand for Judgment:** History is not merely antiquarianism. We study the past partly to understand human nature, social dynamics, and the roots of our present, which inherently involves evaluation – condemning slavery, admiring resistance, analyzing the consequences of beliefs. Suppressing *all* ethical judgment renders history ethically mute and potentially complicit.
  4.  **The Unsatisfiable Subset?** Pure, unadulterated adherence to *only* past self-understandings risks moral relativism and fails our need to learn ethically from history. Pure application of present ethics without deep immersion in past contexts is presentist moralizing, not history. *Simultaneously* achieving perfect hermeneutic reproduction *and* deploying our full contemporary ethical judgment without tension or remainder is likely impossible.
  5.  **The Productive Core Problem:** Instead of seeing this as a flaw, it defines the historian's essential, ongoing task: **To navigate this tension responsibly.** An adequate theory doesn't dissolve the tension but provides rigorous tools for:
      *   *First,* reconstructing past meanings with maximal fidelity (honoring self-understanding).
      *   *Then,* engaging in careful, contextually rich, and intellectually honest ethical evaluation *from our present standpoint*, explicitly acknowledging the shift in perspective and avoiding anachronistic fallacies (especially conceptual anachronism).
      *   Maintaining the crucial distinctions (Explanation vs. Justification, Moral vs. Epistemic Presentism) throughout.

  **Conclusion:** The desiderata outline the necessary conditions for responsible historiography – conditions arising from the nature of historical evidence, the goal of understanding the past, and the inescapable situatedness of the historian. The central tension isn't a flaw to be eliminated but the dynamic field within which historical understanding and judgment must operate. An adequate theory won't make the tension disappear but will provide the clearest possible framework for navigating it rigorously, avoiding the pitfalls outlined in the cases, distinctions, and constraints, and enabling both understanding and ethically grounded evaluation.
