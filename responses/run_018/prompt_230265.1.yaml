answer: |-
  The argument your friend presents is logically structured, but it contains a critical flaw in step (3). By rejecting step (3), you can maintain both the idea that history was genuinely open at many points (i.e., path dependence is real and significant) and that some dominant outcomes prevailed at least partly due to their real advantages. Below, I'll explain why step (3) is the weak point, what rejecting it costs, and how it resolves the tension in your friend's reasoning. I'll also address why the other steps hold up and how this allows for a more nuanced view of history.

  ### Step-by-Step Analysis of the Argument
  The argument hinges on the chain from (1) to (6), leading to the absurd conclusion in (7). Here's why step (3) fails:

  - **Step (1) and (2) are reasonable and can be accepted.**  
    Step (1) defines path dependence: a later outcome depends crucially on an early event that could easily have unfolded differently (e.g., a random decision or minor accident). Step (2) follows from this: if the early event was highly contingent, then at that moment, the eventual outcome wasn't predetermined as likely—alternatives were plausible. This captures the "openness" of history you want to preserve. For example, in the early days of videotape formats, Betamax vs. VHS was a toss-up; neither was "singled out" initially, and small events (like corporate deals) tipped the scale. These steps don't imply that advantages are irrelevant; they simply state that contingency plays a role.

  - **Step (3) is the problem: it conflates early uncertainty with the irrelevance of inherent advantages.**  
    Step (3) claims: "If at the time of its early causes an outcome was not already singled out as the likely result, then the outcome's later dominance cannot be explained by that outcome's being better than the alternatives." This is too strong and often false. It assumes that if an outcome wasn't probable early on, its eventual success cannot be due to it being better. But this ignores how advantages can manifest or become relevant over time. Specifically:
    - **Advantages may not be apparent or actionable at the early stage.** At the outset, alternatives might seem equally viable due to incomplete information, high costs of evaluation, or lack of development. For instance, early automobiles (internal combustion vs. electric vs. steam) were all crude; none were "singled out" around 1900, and random factors (e.g., infrastructure investments) influenced adoption. But internal combustion engines later dominated partly because they became more efficient and practical—advantages that emerged from iterative improvements and scale, not just luck. Thus, the outcome's "betterness" (e.g., range, power) does explain its dominance, even if the initial adoption was contingent.
    - **Advantages can interact with path dependence.** An outcome might gain traction through a random event (e.g., a key endorsement), but its subsequent dominance could be fueled by real strengths. Consider the spread of the English language: early historical accidents (e.g., British colonialism) made it widespread, but its current global dominance is partly explained by functional advantages like simplicity, flexibility, and extensive resources—factors that reinforced its position once the path was set. Step (3) wrongly treats "explanation by betterness" as binary, but it can be a gradual or downstream factor.
    - **Not all path-dependent outcomes involve inferior lock-in.** Your friend's examples (like QWERTY keyboards) are cases where an inferior option won and persisted due to network effects or inertia. But path dependence also applies to superior outcomes: a better technology might win through a contingent event, and its betterness then explains why it thrived. Rejecting step (3) allows for this spectrum—some wins are due to accidents, others to advantages, and many to a mix.

    By rejecting step (3), you avoid the overgeneralization in (4) and (6). Path-dependent outcomes can have their dominance explained (at least partly) by being better, even if early events were pivotal.

  - **Steps (4) to (6) collapse if step (3) is rejected.**  
    Without (3), the inference from (1) and (2) to (4) fails. Step (4) claims that for any path-dependent outcome, dominance isn't explained by betterness, but this only holds if step (3) is true. Since step (3) is flawed, step (4) doesn't follow. Consequently, step (5)—which asserts that most historical outcomes are path-dependent—can stand without implying step (6). Step (6) claims that "virtually no major historical outcome came to dominate because it was better," but this is the absurdity you (and your friend) reject. By rejecting step (3), step (6) is no longer supported, so the contradiction in (7) vanishes. Real-world examples show that betterness often plays a role: democracy spread partly due to functional benefits, and smartphones (like the iPhone) dominated partly due to superior design, even though early events (e.g., Apple's marketing) involved contingency.

  - **Step (5) is plausible but doesn't force absurdity.**  
    Step (5) claims path dependence is near-universal for major historical outcomes, which you can accept. Contingency is everywhere: languages, technologies, and institutions often depend on small, random events (e.g., the adoption of standard gauge railways). But rejecting step (3) means this doesn't deny that real advantages contribute to dominance. Path dependence and betterness aren't mutually exclusive; they can coexist dynamically.

  ### What Rejecting Step (3) Costs
  Rejecting step (3) comes with a cost, but it's a reasonable one that aligns with historical evidence:
  - **The cost:** You must accept that "betterness" is not always a static or early-stage property. Advantages can be latent, context-dependent, or emergent over time. This means that for some outcomes, betterness only becomes explanatory after the path is set (e.g., through refinement, adaptation, or network effects). It also implies that historical explanation is multi-causal: dominance often stems from a combination of contingent events and inherent strengths, not one or the other.
  - **Why it's worth it:** This rejection preserves both your intuitions. History remains "open" at forks (due to path dependence from steps 1 and 2), and real advantages can still explain why some winners prevail (avoiding the absurdity of step 6). It also fits how historians and scientists think: for instance, in evolutionary biology, random mutations (path dependence) can lead to traits that dominate because they confer advantages (betterness).

  ### How to Keep Both Openness and Real Advantages
  By rejecting step (3), you can hold that:
  - **History was genuinely open at many points.** Contingent early events could have led to different outcomes, as in steps (1) and (2). For example, if a different programming language had been adopted early on (e.g., Ada vs. C), computing might look very different today.
  - **Some winners won due to real advantages.** Betterness—such as efficiency, resilience, or adaptability—can explain dominance even in path-dependent scenarios. For instance:
    - **Technologies:** The light bulb (Edison's design) won over gas lighting partly due to random patents and investments (path dependence), but its dominance was also explained by real improvements in safety and cost over time.
    - **Institutions:** Democratic systems often emerge from contingent events (e.g., post-war negotiations), but their persistence can be due to better governance and adaptability.
    - **Languages:** Spanish spread in the Americas through conquest (a contingent event), but its current utility is partly due to its relative simplicity and widespread use—advantages that sustain it.

  In essence, rejecting step (3) allows for a balanced view: path dependence shapes the initial trajectory, but inherent advantages often determine long-term success. This avoids the false dichotomy in your friend's argument (where path dependence implies betterness is irrelevant) and reflects a more accurate, nuanced understanding of history. If you want to discuss specific historical cases or refine this further, I can expand!
