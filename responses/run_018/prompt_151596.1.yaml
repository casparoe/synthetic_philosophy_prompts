prompt: |-
  hey im working through what a theory of moral reasoning actually needs to deliver if particularism is even half right, and i keep feeling like people just list one feature and call it a day. can you lay out the full desiderata? i want the cases it has to handle (like when a promise should be broken because of unforeseen harm, or when kindness in one context becomes cruelty in another), the distinctions it cant collapse (defeated reasons vs absent reasons, moral weight vs moral status, etc.), and the consistency conditions with actual cognitive science about how people reason with cases. there's also this niche thing im stuck on: the asymmetrical moral remainder problem. like, if i make a particularist call that saves strangers but betrays a friend, i feel residue about the betrayal but not about ignoring the strangers' claim, and that asymmetry seems to smuggle in generalist priorities. does the theory have to explain that asymmetry, or can it treat the residue as non-cognitive noise? flag which requirements are genuinely non-negotiable and which are just generalist baggage. and tell me if any two desiderata are jointly unsatisfiable. no bibliographies, just reasoning.
reasoning: |-
  Okay, the user is deep into moral philosophy, particularly grappling with particularism and what a theory of moral reasoning must accomplish if particularism has some validity. They feel existing approaches are too simplistic, just listing one feature without depth. Let me unpack their query.

  First, they want a comprehensive list of desiderata for such a theory. They mentioned specific cases like breaking promises due to unforeseen harm or kindness turning into cruelty in different contexts. So, the theory must handle context-dependent reasons where the same factor can play different roles based on the situation. That's crucial because particularism emphasizes that moral reasons are holistic.

  Next, the user brought up distinctions like defeated vs. absent reasons, moral weight vs. moral status. Defeated reasons are overridden but still present, while absent ones don't apply. Moral weight is about strength in a situation, status about whether something is a reason at all. The theory needs to account for these without collapsing them, which ties into particularism's focus on contextual variability.

  They also want consistency with cognitive science. How do people actually reason morally? Studies show case-based reasoning, pattern recognition, emotional processing. So the theory must align with how humans cognitively process moral dilemmas, not just abstract principles. This is non-negotiable because a theory divorced from human cognition isn't useful.

  Then there's the asymmetrical moral remainder problem. When choosing to betray a friend to save strangers, the user feels residual guilt about the betrayal but not about not helping the strangers. Why this asymmetry? Does it imply hidden generalist priorities? The user questions if the theory must explain this or dismiss it as noise. This touches on moral emotions and whether residues are cognitive or non-cognitive.

  I need to identify which desiderata are non-negotiable versus generalist baggage. Non-negotiables include context-relativity, non-monotonicity (decisions can change with new info), and cognitive realism. Generalist baggage might be systematic codifiability or residue symmetry. The asymmetry in residues might be essential to explain, as it's a real phenomenological experience, not just noise.

  Are any desiderata jointly unsatisfiable? For example, radical context-relativity might clash with cognitive science showing reliance on prototypes. But particularism can accommodate this through defeasible patterns. Also, explaining residue asymmetry without default generalism is tricky. The solution could be relational moral phenomenology—personal relationships generate stronger residues, which fits particularism.

  The user might be developing their own theory or critiquing existing ones. Their frustration with superficial lists suggests they seek rigor. The niche problem about residue asymmetry indicates they're drilling deep into implications. They might need clarity on what's essential versus optional to refine their framework. Highlighting trade-offs and tensions between desiderata will help them navigate these complexities.
answer: |-
  Here's a breakdown of the core, non-negotiable desiderata for a theory of moral reasoning under significant particularist constraints, addressing your specific points:

  **I. Core Functional Requirements (Handling Cases & Phenomena)**

  1.  **Radical Context-Relativity:** *Non-negotiable.* The theory MUST explain how the very *status* (reason, no-reason, anti-reason) and *weight* of any potential moral factor (promise, harm, kindness, loyalty, etc.) can fundamentally shift or invert based on the entire constellation of other features in a specific situation. (e.g., kindness becoming cruelty via enabling harm; a promise losing all force due to unforeseen catastrophic consequences).
  2.  **Non-Monotonicity:** *Non-negotiable.* Reasoning cannot be deductive or monotonic. Adding new features *can* radically alter the conclusion, not just incrementally adjust a pre-existing weight sum. The theory must model how unforeseen harm *defeats* the promise reason, not just outweighs it in a pre-ordained calculus.
  3.  **Defeasibility & Distinctions:**
      *   **Defeated vs. Absent Reasons:** *Non-negotiable.* Must distinguish a reason that *is present* but overridden (e.g., promise to meet friend *is* a reason, defeated by urgent need to aid accident victim) from a feature that simply *fails to be a reason at all* in this context (e.g., the color of the victim's shirt). The "moral residue" often attaches *only* to defeated reasons.
      *   **Moral Weight vs. Moral Status:** *Non-negotiable.* Must distinguish the *strength* or *contribution* a reason makes in a context (weight) from *whether it genuinely counts as a reason at all* in that context (status). A promise might have *status* but zero *weight* if made under duress; kindness might lose *status* entirely and become cruelty in a manipulative context.
  4.  **Holism of Reasons:** *Non-negotiable.* The "moral import" of any feature is irreducibly dependent on the whole context. You cannot isolate the "good-makingness" of kindness independently of the situation it occurs in. The theory must reflect this interdependence.

  **II. Cognitive Plausibility Requirement**

  5.  **Consistency with Human Moral Cognition:** *Non-negotiable.* The reasoning process described must be feasible given what cognitive science shows:
      *   **Case-Based/Prototype Driven:** Reliance on similarity to paradigmatic cases ("like that time when..."), pattern recognition, and analogical reasoning – not algorithmic rule application.
      *   **Emotion & Affect Integration:** Moral judgment involves affective responses (disgust, empathy, guilt) as integral components, not just cold calculation. This links directly to moral residue.
      *   **Bounded Rationality:** Reasoning is often fast, intuitive, and heuristic under normal conditions, with slower, more reflective deliberation possible. The theory shouldn't require impossibly complex computations in real time.
      *   **Narrative Coherence:** Judgments often involve constructing a coherent narrative that "makes sense" of the situation and actions.

  **III. Accounting for Moral Phenomenology (Including Residue)**

  6.  **Moral Residue/Remainder:** *Non-negotiable to explain, negotiable on how.* The theory MUST account for the *phenomenon* of feeling guilt, regret, or compunction about the option *not* chosen, especially when a genuine reason was defeated. It CANNOT simply dismiss this as "non-cognitive noise" because it's a core part of moral experience and motivation.
  7.  **Asymmetrical Residue (Your Niche Problem):** *Non-negotiable to explain.* The theory must explain the *asymmetry* you identify (e.g., residue for betraying friend, little/none for not saving strangers *in that specific choice context*).
      *   **Why NOT Generalist Priority?** This asymmetry doesn't *necessarily* smuggle in generalism. Particularism can explain it:
          *   **Relational Phenomenology:** The residue arises from the *specific relational rupture* (betraying a friend) which has profound personal and emotional salience. Not saving strangers, while a terrible consequence, doesn't rupture a *specific, existing bond you actively engaged with* in the same way. The residue is tied to the *act of violating a concrete, salient relationship* present in the context, not the abstract failure to aid absent strangers.
          *   **Defeated vs. Non-Primary:** The strangers' claim *was* a reason, arguably the *overriding* one leading to the choice. But the *act* of betraying the friend is the *necessary means* chosen to achieve the overriding good. The phenomenological weight attaches strongly to the *means* involving a direct, personal violation, even if justified. The "not saving" is a tragic consequence of the situation, not a *chosen act* in the same direct sense.
      *   **The Theory's Task:** Explain how the *particular features* of the situation (existing personal bond, act of betrayal as means, impersonal nature of stranger claims) generate this asymmetric emotional/motivational residue consistent with particularism. It doesn't require seeing friendship *always_ as a stronger reason, but as generating a different *kind* of phenomenological response when directly violated.

  **IV. Avoiding Generalist Baggage (Negotiable)**

  *   **Systematic Codifiability:** *Baggage.* Does NOT need to provide a finite set of universal, invariant rules or principles that cover all cases. Context-relativity and holism make this impossible.
  *   **Algorithmic Decision Procedure:** *Baggage.* Does NOT need to be a step-by-step mechanical formula guaranteeing one right answer. Moral reasoning is often messy, defeasible, and involves judgment.
  *   **Residue Symmetry:** *Baggage.* Does NOT need to predict equal residue for all defeated reasons in a choice. The asymmetry is a feature to explain, not a bug.
  *   **Transcontextual Priority:** *Baggage.* Does NOT need to assert that certain types of reasons (e.g., harm prevention) *always* trump others (e.g., promise-keeping) across all contexts. Context determines.

  **V. Potential Tensions/Joint Unsatisfiability?**

  1.  **Radical Holism vs. Cognitive Feasibility:** If *every* feature potentially interacts with *every* other feature in infinite ways, how can bounded humans actually reason? This is the strongest tension.
      *   **Resolution:** The theory must incorporate *defeasible patterns* or *prototypes*. While no invariant rules exist, we recognize *recurring patterns* (e.g., "promises bind, *unless* coerced or causing great harm"). These are guides, not laws – new features can always disrupt them. Cognitive science supports this pattern-based, prototype-driven reasoning.
  2.  **Explaining Residue Asymmetry without Default Generalism:** Is it possible without implying friendship *generally_ matters more?
      *   **Resolution:** Yes, by grounding the asymmetry in the *relational nature of the violation* and its role as the *chosen means* within the *particular* context, not in an abstract hierarchy. The phenomenology is tied to the *structure of the action and relationships in that case*, not a transcontextual rule. The "general" fact that *personal bonds often generate strong residue when violated* is an observed pattern, not an inviolable principle – one could imagine contexts where betraying a friend feels *less* residually problematic than failing strangers (e.g., friend is a tyrant).

  **In Summary: The Non-Negotiable Core**

  A plausible particularist-friendly theory of moral reasoning **must**:
  *   Handle radical context-relativity and holism.
  *   Be non-monotonic and defeasible.
  *   Clearly distinguish defeated reasons from absent reasons, and moral weight from moral status.
  *   Be cognitively plausible (case-based, affective, bounded).
  *   Account for the *existence* and the *asymmetry* of moral residue as a phenomenological fact tied to the defeat of concrete reasons within specific relational/action contexts.

  It **does not need**:
  *   A comprehensive, invariant rule set.
  *   An algorithmic decision procedure.
  *   Symmetrical residue.
  *   Transcontextual priority rules.

  The main tension (Holism vs. Feasibility) is resolved by embracing defeasible patterns learned from experience, not absolute rules. The residue asymmetry is a crucial challenge but explainable within particularism through the salience of relational violations and the structure of chosen actions.
