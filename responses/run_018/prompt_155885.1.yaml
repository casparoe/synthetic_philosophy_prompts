answer: |-
  ## Q&A Defence Sheet: "Moral Translation and Pragmatic Convergence"  
  **Audience:** University of York Philosophy Colloquium (Specialisms Noted)  
  **Strategy:** Order by Perceived Damage Potential in This Room  

  ---

  ### 1. **Objection (Non-Naturalist Moral Realist)**  
  > "Your model reduces moral properties to mere regulative fictions, ignoring their irreducible normative authority. If moral disagreements are merely translational indeterminacy, how do you account for the *phenomenology* of moral knowledge—our direct apprehension of categorical obligations? Your predictive utility criterion seems ontologically promiscuous, abandoning moral truth for instrumental convenience."  
  **Concede:** The phenomenology of moral conviction is robust and must be explained.  
  **Hold:** This phenomenology does not entail mind-independent moral properties; it arises *within* a normative framework.  
  **Reply (2 mins):** "You rightly highlight the felt categorical force of morality. My model explains this phenomenology as emerging from the deep entrenchment of specific normative postulates within a community's conceptual scheme, reinforced by socialisation and the high stakes of coordination failure. Their *authority* is real *for us*, much like logical necessity feels binding *within* our web of belief. However, positing irreducible non-natural properties faces Mackie's 'queerness' objection—how do we epistemically access them? My pragmatic criterion avoids ontological queerness by grounding warrant in observable behavioural consequences—specifically, a framework's demonstrable capacity to predict and sustain cooperation under varying conditions. Its warrant is empirical, not metaphysical."  
  **Weakness:** Does not fully address why moral *deliberation* feels truth-apt rather than purely strategic.  

  ---

  ### 2. **Objection (Quine Specialist)**  
  > "Quine’s indeterminacy thesis applies to radical translation of *observational* sentences into a *physicalistic* base. Extending it to normative vocabulary is illicit: ethics lacks the behavioural constraints Quine required. Worse, your appeal to ‘predictive utility for stabilising cooperation’ smuggles in normative assumptions antithetical to Quine’s naturalism. Isn’t this a category error?"  
  **Concede:** Quine himself was sceptical about ethics and my extension is interpretive.  
  **Hold:** The structural parallel between normative vocabularies and Quinean analytical hypotheses is compelling and underdeveloped in his work.  
  **Reply (2 mins):** "A sharp critique. Quine’s focus was indeed physicalistic. However, his core insight—that translation is underdetermined by behaviour due to the holistic interanimation of sentences—applies *mutatis mutandis* to normative terms embedded in complex social practices. The 'behavioural constraints' here are patterns of sanctioning, cooperation, and conflict resolution. My 'predictive utility' is naturalistic: it measures a framework’s empirically observable success in reducing costly discord and enabling collective action across contexts (e.g., dispute resolution, resource allocation). This is not a *normative* standard smuggled in, but a *functional* one observable from a third-person perspective, consistent with a naturalised epistemology."  
  **Weakness:** Quine likely viewed cooperation/stability as values themselves, potentially begging the question.  

  ---

  ### 3. **Objection (Applied Ethicist / Human Rights Focus)**  
  > "If moral criticism is merely comparing ‘coordination stability’, how do you condemn practices like genocide or slavery within highly stable societies? Your model seems to collapse into relativism, rendering human rights discourse unintelligible as anything but a local coordination strategy competing with others."  
  **Concede:** Some deeply abhorrent practices can achieve local stability.  
  **Hold:** Cross-cultural criticism is possible pragmatically by assessing a framework’s *resilience* and *scope* of coordination under stress.  
  **Reply (2 mins):** "A vital concern. My model does not preclude condemnation. It reframes it: we criticise frameworks not for failing to 'track moral truth', but for their *pragmatic fragility* and *limited scope*. A society permitting slavery may achieve short-term stability but is inherently unstable—prone to revolt, economic inefficiency, and external sanction. Frameworks embedding universalisable norms (like basic rights) often demonstrate superior *resilience* across diverse contexts and under challenges like technological change or intercultural contact. Critiquing genocide isn’t invoking a platonic 'right to life'; it’s arguing that such practices catastrophically undermine long-term social coordination capacities, as history attests. Human rights discourse gains force from its demonstrable utility in fostering large-scale, durable cooperation."  
  **Weakness:** Risks justifying oppression if it proves 'stable' long-term; relies on contestable historical interpretations.  

  ---

  ### 4. **Objection (Analytic Philosopher / Anti-Relativist)**  
  > "You claim to avoid relativism, yet your model makes moral truth framework-relative. If Community A’s values stabilise their cooperation and Community B’s conflicting values stabilise theirs, you have no grounds to say either is *mistaken*. This evacuates morality of its critical force and collapses into 'anything goes' if it works locally."  
  **Concede:** There is no absolute, framework-transcendent 'moral truth' to settle disputes.  
  **Hold:** Pragmatic convergence through framework *comparison* and *adaptation* provides robust critical grounds.  
  **Reply (2 mins):** "Not relativism, but *pragmatic pluralism*. Relativism says 'true for them, true for us, no comparison'. My model *enables* comparison: we assess frameworks empirically by their *robustness*—how well they coordinate behaviour across diverse agents, contexts, and timescales. Frameworks can be criticised internally for inconsistency or externally for poor performance relative to alternatives under comparable pressures. When frameworks interact, we see which norms better resolve conflicts or enable joint projects. Convergence happens not towards moral facts, but towards more reliably stabilising strategies—like norms prohibiting violence or enforcing promises. This *is* critical force, grounded in observable success, not metaphysical mystery."  
  **Weakness:** Defining 'robustness' and 'success' may covertly reintroduce universal norms.  

  ---

  ### 5. **The Landmine Question (Quine Specialist or Sharp Analytic Philosopher)**  
  > "Your entire project hinges on using 'predictive utility for stabilising cooperation' as a shared, cross-cultural criterion for evaluating moral frameworks. But doesn’t Quine’s *holism and indeterminacy thesis itself* imply that concepts like 'cooperation', 'stability', or even 'prediction' could be radically untranslatable between frameworks? Aren’t you presupposing the very universal pragmatic ground that Quine’s arguments show is unavailable, making your criterion either question-begging or itself indeterminate?"  
  **Concede:** This exposes the deepest tension in the project.  
  **Hold:** Minimal behavioural regularities anchor the criterion sufficiently for pragmatic purposes.  
  **Reply (2 mins):** "A profound challenge, rightly targeting the nerve centre. Quine’s thesis does threaten radical discontinuity. My rejoinder is twofold. Firstly, at the *pre-theoretical* level, all human communities exhibit core behaviours we identify as 'cooperation' (e.g., joint food procurement, conflict avoidance) and 'breakdown' (e.g., violence, group dissolution). These constitute the behavioural 'evidence' that anchors translation, however imperfectly. Secondly, the criterion is *regulative*, not absolute. We start with these observed patterns as a *working hypothesis*. When encountering radical difference, we test whether our concepts of 'stability' or 'cooperation' can be projectively applied without contradiction to *their* observed patterns of flourishing and discord. If not, we face genuine indeterminacy. But crucially, the *attempt* at pragmatic comparison often reveals unforeseen commensurabilities or prompts framework adaptation—which *is* the process of moral progress on this view."  
  **Weakness:** Risks circularity (using our concepts to judge their applicability); concedes possible bedrock indeterminacy undermining the criterion.  

  ---
  **Key Stance Throughout:**  
  *   **Concede:** Moral phenomenology is real; some practices are abhorrent; Quine’s focus wasn’t ethics; no access to Platonic moral facts.  
  *   **Hold:** Moral values are framework-embedded postulates; warrant is pragmatic/functional; cross-cultural critique via stability comparison is viable and superior to realist metaphysics.  
  *   **Defence Core:** Anchor replies in observable consequences, naturalistic epistemology, and the functional demands of social existence.
