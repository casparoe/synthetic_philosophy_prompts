answer: |-
  Below is a decision tree designed to sort positions on **counterpart theory** (objects are world-bound; modality is handled via counterparts) vs. **transworld identity** (objects exist across worlds with contingent properties). The tree uses concrete, answerable questions (not labels) and ends with four leaves: Lewis-style counterpart theory, Kripkean transworld identity, a hybrid "best-describer" view, and one unoccupied/incoherent position.  

  Each branch is based on intuitive examples (e.g., statues, organisms, presidents). Positions collapse if they yield the same answers. The tree has **5 nodes** (including the root) and focuses on commitments answerable without citations.  

  ---

  ### **Decision Tree: Counterpart Theory vs. Transworld Identity**  

  #### **Node 1: Root Question**  
  **Q1:** Can an object in one possible world be identical to an object in another world, even if they have different properties?  
  - **YES** → Transworld identity likely (go to Node 2).  
  - **NO** → Counterpart theory likely (go to Node 3).  

  ---

  #### **Node 2: Transworld Identity Branch**  
  **Q2:** Can a statue survive gradual part-replacement across worlds?  
  *(e.g., In World 1, Statue A is made of marble. In World 2, Statue B is made by gradually replacing Statue A’s parts with clay. Is Statue A = Statue B?)*  
  - **YES** → Artifacts lack essential origins (go to Node 4).  
  - **NO** → Artifacts have essential origins (go to Node 5).  

  ---

  #### **Node 3: Counterpart Theory Branch**  
  **Q3:** Is the phrase “the current president” world-bound?  
  *(e.g., In another world, could Obama lose the presidency to Biden, yet still be identical to actual-world Obama?)*  
  - **YES** → “The current president” is world-bound (go to Node 4).  
  - **NO** → “The current president” is transworld-identical (contradicts Q1 NO; collapse to transworld identity).  

  ---

  #### **Node 4: Artifacts vs. Organisms / Counterpart Context**  
  **Q4:** Do organisms have origins essentially, but artifacts do not?  
  *(e.g., Could a cat have different parents in another world? Could a statue be made from different clay?)*  
  - **YES** → Organisms require fixed origins; artifacts do not (Leaf 1: **Hybrid "Best-Describer" View**).  
  - **NO** → All objects have fixed origins (Leaf 2: **Kripkean Essentialist Transworld Identity**).  

  ---

  #### **Node 5: Incoherent Combo**  
  **Q5:** Can an object change *all* its properties across worlds and remain identical?  
  *(e.g., Could a cat in another world be a robot with no biological properties?)*  
  - **YES** → Rejects essentialism entirely (Leaf 3: **Unoccupied/Incoherent**).  
  - **NO** → Requires some essential properties (Leaf 4: **Lewis-Style Counterpart Theory**).  

  ---

  ### **Leaves & Commitments**  
  1. **Hybrid "Best-Describer" View**  
     - **Path:** Q1 YES → Q2 YES → Q4 YES.  
     - **Weirdest Commitment:** A statue can be made from *any material* (e.g., clay, cheese) as long as it’s "described" as art, but a cat *must* have the same biological parents.  
     - **Note:** Artifact/organism distinction is key.  

  2. **Kripkean Essentialist Transworld Identity**  
     - **Path:** Q1 YES → Q2 NO → Q4 NO.  
     - **Collapses with:** Q1 YES → Q2 NO → Q5 NO.  
     - **Weirdest Commitment:** This table *could not* have been made from ice (even if identical in appearance), but it *could* be painted purple.  

  3. **Unoccupied/Incoherent View**  
     - **Path:** Q1 YES → Q2 NO → Q5 YES.  
     - **Weirdest Commitment:** An object can be *anything* in another world (e.g., a cat could be a robot, a cloud, or a number) with no fixed properties.  
     - **Why unoccupied?** Denies all essential properties, making identity meaningless. No major philosopher holds this.  

  4. **Lewis-Style Counterpart Theory**  
     - **Path A:** Q1 NO → Q3 YES → Q4 NO.  
     - **Path B:** Q1 NO → Q3 YES → Q5 NO.  
     - **Weirdest Commitment:** "Humphrey could have won the election" is true only if a *different* person (Humphrey’s counterpart) wins in another world—yet Humphrey *himself* loses in all worlds.  

  ---

  ### **Collapsed Positions**  
  - **Q1 NO → Q3 NO:** Collapses into **transworld identity** (since rejecting world-binding for "the current president" implies objects can be identical across worlds).  
  - **Kripkean Essentialism** collapses across paths (if you demand essential origins for artifacts, you must also demand them for organisms to avoid arbitrariness).  

  --- 

  ### **How to Use This Tree**  
  - **In your study group:** Start at Node 1 and debate each question. Move down branches based on consensus.  
  - **Focus on concrete cases:** Use examples like "Could Obama have been a gardener?" or "Is the Ship of Theseus the same ship after replacement?"  
  - **Weird commitments:** Highlight these to test intuitions (e.g., Lewis’s "Humphrey" problem challenges de re modality).  

  This tree covers core disputes without requiring prior knowledge. If your group hits dead ends, revisit Q2/Q4—these reveal the artifact-organism split central to hybrids. Enjoy the discussion!
