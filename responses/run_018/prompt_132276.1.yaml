answer: |-
  **MEMORANDUM**  
  **TO:** Dean of Arts, Chair of Cognitive Science Department, Interdisciplinary Curriculum Oversight Board Members  
  **FROM:** Interdisciplinary Curriculum Oversight Board  
  **DATE:** October 26, 2023  
  **SUBJECT:** Decision on Proposed Graduate Seminar "The Phenomenal Boundary Problem"  

  ### **I. Decision and Rationale**  
  After thorough review of the Department of Cognitive Science’s dual-track proposal, the Dean’s single-track revision, and the underlying philosophical objections, the Board **recommends Option 3: Reject both proposals and require a redesigned seminar**. The redesigned course must:  
  1. **Avoid presupposing a false dichotomy** (as raised by the Dean) regarding the determinacy of phenomenal states.  
  2. **Explicitly integrate eliminativist critiques** without mandating metaphysical commitments from students.  
  3. **Retain the core pedagogical value** of the Chase-Sanborn case while reframing it as a tool for analyzing methodological and epistemic problems.  

  **Rationale**:  
  - The Dean’s objection identifies a legitimate flaw: Both tracks implicitly assume that Chase/Sanborn’s divergence *must* resolve to *either* incoherent qualia *or* private phenomenal differences, thereby excluding eliminativism’s rejection of the question’s premises.  
  - However, the Board concurs with the department that reducing the seminar to a purely historical/rhetorical analysis (Option 2) would undermine its goal of training students in *active philosophical engagement* with unresolved problems in consciousness studies.  
  - A redesigned seminar can achieve rigor without dogmatism by centering on **epistemic humility** and **methodological critique**, rather than forcing adjudication between two substantive positions.  

  ---

  ### **II. Conditions for Redesign**  
  The Department of Cognitive Science must submit a revised proposal within **six weeks** that includes:  
  #### **A. Structural Requirements**  
  1. **Replace the dual-track model** with a unified structure progressing through three phases:  
     - **Phase 1**: Deconstruction of the Chase-Sanborn case as a rhetorical artifact (addressing Dean’s concerns).  
     - **Phase 2**: Critical analysis of *all* major interpretations (including Track A, Track B, *and* eliminativism).  
     - **Phase 3**: Student projects exploring *why* the problem resists resolution (e.g., linguistic ambiguity, measurement limitations, conceptual circularity).  
  2. **Final Assignment**: Replace the "adjudication essay" with a **methodological critique** (e.g., "What frameworks best explain the persistence of this debate? Where do they fail?").  

  #### **B. Content Requirements**  
  1. **Explicit inclusion of eliminativism** (e.g., Dennett’s later work, Churchland’s neural eliminativism) as a *co-equal* perspective.  
  2. **Meta-philosophical modules** on:  
     - The risks of reification in consciousness studies.  
     - Epistemic limitations of first-person reports.  
     - Distinctions between ontological claims vs. pragmatic posits.  

  #### **C. Pedagogical Safeguards**  
  1. **Instructor Guidelines**: Prohibit framing any position as "correct"; require transparent discussion of all premises.  
  2. **Student Evaluations**: Assess analysis of presuppositions, not alignment with a specific metaphysics.  

  **Timeline**:  
  - Redesigned proposal due: **December 7, 2023**.  
  - Board review/approval: **January 11, 2024**.  
  - Implementation: **Fall 2024 term**.  

  ---

  ### **III. Response to the Dean’s Objection**  
  The Board agrees that **both tracks share a hidden premise**: That Chase’s experience *must* have either changed objectively or remained constant subjectively. This indeed excludes eliminativism, which rejects the coherence of the question (e.g., Dennett’s "quining" strategy aims to dissolve the *need* for qualia-talk). Crucially, Track A’s "incoherent posit" and Track B’s "privately calibrated reality" both presuppose a *meaningful boundary* between appearance and reality in phenomenology—a boundary eliminativism denies.  

  **Why this matters**:  
  - Failing to address this exclusion misrepresents the philosophical landscape and risks indoctrinating students into a contested paradigm.  
  - The Dean’s single-track proposal (Option 2) correctly avoids this pitfall but goes too far by reducing the seminar to *detached* historical analysis. Graduate training requires grappling with live debates, not just their archaeology.  

  ---

  ### **IV. Addressing Metaphysical Commitment**  
  **Yes, a course on qualia can be taught responsibly without requiring metaphysical commitments**. The redesigned seminar will:  
  - **Distinguish epistemology from ontology**: Students can analyze *whether "qualia" usefully explains anything* without asserting qualia’s existence/nonexistence.  
  - **Focus on problem-solving heuristics**: E.g., "When does positing private phenomenology become explanatorily vacuous?"  
  - **Emphasize comparative methodology**: Contrast predictive processing, illusionism, and eliminativist frameworks as *tools*—not doctrines.  

  ---

  ### **V. Strongest Argument for the Rejected Option (Option 1: Approve Dual-Track)**  
  **The Dual-Track proposal’s core strength is its pedagogical clarity**. By forcing students to defend one interpretation, it cultivates:  
  1. **Depth over breadth**: Immersive engagement with two coherent worldviews sharpens analytical skills.  
  2. **Argumentative rigor**: The adjudication essay mirrors real academic practice of defending a thesis.  
  3. **Dialectical tension**: Track A/B’s opposition vividly illustrates how identical data support divergent conclusions—a hallmark of philosophy of mind.  

  **Why this is insufficient**:  
  - Clarity should not come at the cost of excluding a major perspective (eliminativism).  
  - The "adjudication" requirement pressures students to endorse *either* reification or privacy, potentially stifling meta-critical insights.  

  ---

  ### **VI. Conclusion**  
  The Board acknowledges the Department’s innovative approach and the Dean’s rigorous critique. The recommended redesign preserves the seminar’s focus on Dennett’s thought experiment while transforming it into a case study for *interrogating philosophical problems at their roots*. By rejecting false dichotomies and welcoming eliminativism as a critique of the debate’s framing—not just a "third position"—the course can model the intellectual humility essential to cognitive science.  

  The Department of Cognitive Science is invited to consult with the Dean’s office during redesign to ensure all concerns are addressed. The Board stands ready to facilitate this collaboration.  

  **Approved by unanimous vote of the Interdisciplinary Curriculum Oversight Board.**  

  ---  
  **END MEMO**  

  ---
  ### **Key Features for Stakeholder Response**  
  - **For the Department**: Explicitly allows retention of Dennett’s case and substantive debate, but requires structural/content changes.  
  - **For the Dean**: Validates her core objection and mandates eliminativism’s inclusion, while rejecting purely historical treatment.  
  - **For Both**: Provides concrete redesign criteria and timeline, with flexibility for collaborative refinement.
