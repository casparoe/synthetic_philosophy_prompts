answer: |-
  Your diagnosis is perceptive: **the core conflict lies in an unstable conceptualization of "function"**, which obscures whether naturalists and normativists are answering the same question. Their disagreement isn't purely verbal, nor solely about biology's normative power, nor entirely about distinct questions—though elements of all three exist. Let's dissect this using your framework:

  ### 1. **The Ambiguity in "Function" Drives the Stalemate**
     - **Naturalists (Boorse)**: Explicitly adopt a **hybrid "function" concept**.  
       - *Selected-Effect (SE) Function*: References evolutionary history (e.g., "The heart's function is to pump blood *because that was selected for*").  
       - *Causal-Role (CR) Function*: Relies on current contributions to survival/reproduction (e.g., "This enzyme functions in glucose metabolism").  
       - **Problem**: Boorse *needs* SE functions to define *which* causal roles matter (only those shaped by selection). Yet he uses *statistical normality* (a CR proxy) to operationalize health. This slide between SE and CR allows "normal function" to appear objective while smuggling in normative choices:  
         - Which SE functions are "vital"? (Why prioritize pumping blood over, say, sweating?)  
         - What statistical range counts as "normal"? (Does "normal" exclude 10%? 5%? Who decides?)  
       *Your insight is correct: Naturalists conflate evolutionary etiology with current causal utility*.

     - **Normativists (Nordenfelt)**: Explicitly reject biological function as foundational. Health is defined by "**vital goals**" (e.g., survival, happiness, career) assessed through value judgments.  
       - **Problem**: As you note, these "vital goals" implicitly rely on **biological teleology**. Nordenfelt's examples (e.g., "avoiding death," "minimal happiness") presuppose a biological subject with evolved needs. If "vital goals" were *purely* subjective (e.g., "being a billionaire"), health becomes untethered from medicine. Thus, normativists covertly depend on the biological teleology they reject.  

  ### 2. **Are They Answering Different Questions?**
     - **Naturalism** answers: *"What is the species-typical functional state?"* (a **descriptive/metaphysical** question about biological design).  
     - **Normativism** answers: *"What bodily/mind states justify clinical intervention?"* (a **prescriptive** question about social/clinical practice).  
     - **Crucially**, both sides claim their answer defines "health/disease," masking the distinctness of their projects. Boorse seeks objective pathology classifications; Nordenfelt seeks criteria for medical action. When naturalists say "hypertension is pathological," they mean it statistically/functionally deviates. When normativists say "hypertension is pathological," they mean it *warrants treatment* given patient goals.  

  ### 3. **The Role of Statistical Normality & Vital Goals**
     - **Statistical Normality**:  
       - For naturalists, it's a *proxy* for evolutionary fitness (though statistically "normal" ≠ evolutionarily optimal).  
       - Normativists *correctly* note that statistical norms alone can't define health (e.g., high IQ is statistically rare but not diseased).  
     - **Vital Goals**:  
       - Naturalists *presume* survival/reproduction as the ultimate goals (SE function).  
       - Normativists *prescribe* goals but struggle to explain why some goals (e.g., survival) seem universal without biology.  

  ### Diagnosis: A Tripartite Stalemate
  The dispute is **threefold** and self-reinforcing:  
  1. **Conceptual** (verbal/core ambiguity): Both sides use "function" opaquely—naturalists conflate SE/CR; normativists deny but need teleology.  
  2. **Substantive**: They disagree on whether evolutionary biology *can* ground norms. Naturalists say yes (via SE function); normativists say no (values are extra-biological).  
  3. **Pragmatic**: They address different problems (classification vs. intervention), but both claim the mantle of "defining health."  

  ---

  ### What Counts as Progress?
  Your suggested paths aren't mutually exclusive, but their viability varies:  
  1. **Formal Distinction Among Function Types** (e.g., SE vs. CR) → **High Potential**  
     - Clarifies naturalists' ambiguity. If health requires *SE function* (evolutionarily selected roles), statistical norms must align with SE functions—not arbitrary CR activities.  
     - Forces normativists to either:  
       - Fully embrace non-biological "vital goals" (risking incoherence for clinical medicine), or  
       - Acknowledge that "vital goals" are constrained by biological functions (bridging to naturalism).  

  2. **Empirical Study of Clinicians** → **Moderate Utility**  
     - Clinicians often blend both approaches: using statistical norms (e.g., lab ranges) *plus* patient-centered goals (e.g., treating asymptomatic hypertension to prevent *future* incapacity).  
     - Would reveal that "health" is **pragmatically contextual**: statistical norms flag risks; normativism guides action. Shows the definitions are complementary, not mutually exclusive.  

  3. **Conceptual Clarification** → **Essential but Insufficient Alone**  
     - Disambiguating "function" and "health" (e.g., distinguishing "biological dysfunction" from "clinical disease") could dissolve *some* confusion.  
     - But it won't resolve the **normative question**: *Should* we treat statistical dysfunction without patient impairment? (e.g., early-stage cancer). Here, values are inescapable.  

  4. **Arguing Incommensurability** → **Last Resort**  
     - Only if the questions *cannot* coexist (e.g., if "biological dysfunction" is irrelevant to medicine). Yet medicine clearly uses both:  
       - Lab results (naturalist) + Quality-of-life impact (normativist) = Treatment decision.  
     - **Better Path**: Frame them as addressing different domains:  
       - **Pathology** (naturalist): Statistical/functional deviation from species design.  
       - **Disease** (normativist): Pathology + impediment to vital goals.  

  ---

  ### Conclusion: A Path Forward
  **Progress requires integrating both approaches**, not choosing one:  
  1. **Anchor "dysfunction" in SE function** to ground biological abnormality objectively.  
  2. **Explicitly separate "dysfunction" from "disease"**: Dysfunction becomes a *naturalist* concept; disease is a *normativist* concept (dysfunction + value-based harm).  
  3. **Admit values in setting parameters**: Even SE functions require choosing *which* functions matter clinically (e.g., via empirical study of morbidity/mortality linked to statistical deviations).  

  This preserves naturalism’s descriptive power while acknowledging normativism’s clinical necessity—bridging your career in reference ranges (statistical, SE-anchored) with the reality that treatment depends on patient goals. The debate is static because both sides demand a monopoly on "health." Demoting "health" as an overburdened term and distinguishing **dysfunction** (biological) from **disease** (clinical) offers a way out.
