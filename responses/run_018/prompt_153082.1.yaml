  We are going to design a research proposal that addresses the logical structure of the Britain-China contrast in the Great Divergence debate. The proposal will follow the user's specifications.

  **Title:** The Logical Structure of Contrastive Explanation in Macrohistorical Inquiry: A Critical Examination of the Britain-China Pairing in the Great Divergence Debate

  **1. Introduction and Problem Statement**
  The standard framing of the Great Divergence poses the question: "Why did Britain industrialize in the 18th century and not China?" This formulation is contrastive, seeking to explain an outcome (P: Britain's industrialization) relative to a specific alternative (Q: China's non-industrialization). The pairing of Britain and China is typically justified by pointing to shared preconditions circa 1500 (e.g., large agrarian economies, advanced technological capabilities, integrated markets) that make China a plausible candidate for comparison. However, the selection of China as the comparator may be outcome-dependent: China is chosen precisely because it shared these preconditions yet did not industrialize. This raises a structural problem: the contrastive question may be ill-posed if the specification of Q (China) is contingent on the observation of the outcome (Britain's industrialization), violating a core requirement in philosophical accounts of contrastive explanation—that the alternative must be a "live option" independently of the outcome.

  The central research question is: **Is the standard Britain-China contrast in the Great Divergence debate structurally well-posed as a contrastive explanation, according to philosophical criteria for what makes a contrastive question legitimate?**

  **2. Current Answers and the Open Question**
  * **Economic History:** The literature on the Great Divergence (e.g., Pomeranz, Landes, Wong) extensively debates why Britain industrialized and China did not, but it largely takes the pairing for granted. The justification for comparing Britain and China rests on similarities in pre-industrial conditions. However, this justification is potentially circular: the similarities are highlighted because they are believed to be relevant to the outcome (industrialization), and the outcome is known. The field has not systematically examined whether the selection of China as the comparator meets the logical requirements of contrastive explanation.
    
  * **Philosophy of Science:** Philosophical treatments of contrastive explanation (e.g., van Fraassen, Lipton) establish that a well-posed contrastive question "Why P rather than Q?" requires that Q be a relevant alternative that could have happened, and the selection of Q should not depend on knowing that P occurred. However, these accounts are rarely applied to macrohistorical cases. They focus on simple, localized examples (e.g., "Why did the sample turn red rather than blue?") and do not address the complexities of selecting comparators in large-scale historical analysis where the outcome is known and the counterfactual space is vast.

  Thus, the gap: Economic history lacks a formal framework for evaluating the logical structure of its contrastive questions, while philosophy lacks engagement with the practical challenges of comparator selection in macrohistory.

  **3. Method: A Three-Phase Approach**
  * **Phase 1: Formalizing Selection Criteria**  
    Systematically extract and formalize the explicit and implicit criteria used in standard accounts (e.g., Pomeranz's *The Great Divergence*) to justify the Britain-China pairing. Criteria might include: (a) comparable economic development levels circa 1500-1800, (b) technological sophistication, (c) market integration, (d) state capacity, (e) demographic and ecological constraints. The goal is to make these criteria explicit and testable.

  * **Phase 2: Testing for Outcome-Dependence via Reference-Class Independence**  
    Apply a condition drawn from causal inference (e.g., the notion of "no peeking" in potential outcomes frameworks) to assess whether the criteria identified in Phase 1 are outcome-dependent. Specifically, we ask: If we did not know which country industrialized, would the same criteria lead us to select China as the natural comparator for Britain? Or are the criteria chosen/adjusted because we know the outcome? This involves constructing a "reference class" of potential comparators (e.g., other advanced pre-industrial economies like Japan, the Netherlands, India, or the Ottoman Empire) and evaluating whether the criteria would have selected China over others without knowledge of the outcome.

  * **Phase 3: Evaluating the Tolerance for Outcome-Dependence**  
    If the criteria are found to be outcome-dependent (as suspected), assess whether macrohistorical explanation can tolerate this if a causal mechanism is specified ex ante. For instance, if a theory posits a specific mechanism (e.g., "fiscal-military competition drove innovation in Europe but not in China"), does this mechanism independently justify the pairing even if historical outcomes are known? This phase would involve analyzing whether the causal mechanisms proposed in the literature (e.g., by North, Acemoglu, or Mokyr) can be formulated without relying on the outcome to define the comparator.

  **4. Success and Failure Conditions**
  * **Success:** A determinate, generalizable criterion for when a contrastive pairing in macrohistory is well-posed. For the Britain-China case, success would mean either:  
    (a) demonstrating that the pairing meets the independence condition (i.e., China would have been selected without knowing the outcome) and is thus structurally sound; or  
    (b) showing that even if outcome-dependent, the pairing is justified by an ex ante causal mechanism that is independently validated.  
    The criterion should be applicable to other macrohistorical contrasts (e.g., "Why democracy in Athens and not Rome?").

  * **Failure:** The project collapses into either:  
    (a) blanket skepticism: concluding that all large-scale historical contrasts are ill-posed because comparator selection is inherently outcome-dependent; or  
    (b) excessive permissiveness: accepting any pairing as legitimate, rendering the independence criterion meaningless.  
    Either outcome would indicate that the project has not resolved the tension between philosophical ideals and historical practice.

  **5. Scope and Feasibility**
  * **Scope:** The project is limited to the logical structure of the Britain-China pairing in the Great Divergence debate. It does not propose new causal explanations or engage in primary archival research. It draws on existing secondary literature in economic history and philosophy of science.
    
  * **Feasibility:** The project is feasible for a one-semester independent study (5,000 words) because:  
    (a) it builds on well-established texts (e.g., Pomeranz, van Fraassen);  
    (b) the methodological approach (formalizing criteria, testing for outcome-dependence) is analytical and does not require new data collection; and  
    (c) the deliverable is a theoretical critique, not an empirical study.  
    The main challenge is distilling complex philosophical and historical arguments into a coherent framework, but this is manageable with focused reading and structured writing.

  **Deliverable:** A 5,000-word paper presenting the above analysis, concluding with a clear verdict on the structural soundness of the Britain-China contrast and general lessons for comparative history.
answer: |-
  ### Research Proposal: The Logical Structure of Contrastive Explanation in the Great Divergence Debate  

  #### 1. **Problem Statement**  
  The core inquiry addresses whether the ubiquitous contrastive question—*“Why did Britain industrialize in the 18th–19th centuries and not China?”*—is structurally well-posed as a historical explanation. This framing implicitly treats Britain and China as symmetric comparators, justified by shared preconditions circa 1500 (e.g., agrarian sophistication, commercial integration, technological prowess). However, the selection of China as the comparator appears *outcome-dependent*: China is chosen precisely because it exhibited these preconditions yet failed to industrialize, violating a philosophical requirement for contrastive questions—that the alternative (Q: “China industrializes”) must be a “live possibility” specified independently of observing the actual outcome (P: “Britain industrializes”). This dependency risks circularity: the comparator is defined by its failure, potentially biasing causal inference toward ex post facto rationalizations. The proposal examines whether this pairing meets formal criteria for valid contrastive explanation or inadvertently conflates the *explanandum* (P rather than Q) with the *explanans* (causes of P).  

  #### 2. **Gaps in Existing Literature**  
  - **Economic History**: Dominant accounts (e.g., institutional, ecological, or cultural theories) treat the Britain-China dyad as an unproblematic analytical scaffold. Justifications for the pairing rely on similarities in pre-1600 conditions, but these similarities are often *retrospectively emphasized* because they align with the known divergence. This overlooks whether China was the sole or most appropriate comparator. For instance, Japan, the Dutch Republic, or Mughal India shared key traits but are seldom centered in the contrast.  
  - **Philosophy of Science**: Formal treatments of contrastive explanation (e.g., van Fraassen, Lipton) require that Q be a “relevant alternative” not contingent on P’s occurrence. Yet these frameworks are rarely tested against macrohistorical cases, where comparators are selected from vast, heterogeneous contexts. Philosophical work also neglects the *temporal asymmetry* inherent in historical inquiry: outcomes are known before comparators are defined, creating unique challenges for satisfying the “independence” criterion.  

  #### 3. **Method: Three-Phase Approach**  
  **Phase 1: Formalize Selection Criteria**  
  - Systematically extract explicit and implicit criteria used to justify the Britain-China pairing from seminal works (e.g., Pomeranz, Landes). Criteria may include: (a) economic complexity (e.g., GDP per capita estimates), (b) institutional features (e.g., property rights), (c) technological parity (e.g., agricultural/mechanical innovations), and (d) geopolitical scale.  
  - Map these criteria to a *comparator space* of early modern societies (e.g., Japan, India, France) to identify whether China uniquely satisfies them or if multiple candidates exist.  

  **Phase 2: Test for Outcome-Dependence via Reference-Class Independence**  
  - Apply a modified *reference-class* condition from causal inference: a well-posed contrast must select Q from a reference class (R) of plausible alternatives *without leveraging knowledge of P*.  
  - Construct R using pre-1700 data (e.g., demographic trends, trade volumes, state capacity) to define societies with “comparable” preconditions to Britain.  
  - Simulate a blinded selection: if R includes entities like Japan or the Netherlands, would standard criteria *predictably* select China as the primary comparator absent knowledge of industrialization outcomes? If China is only uniquely favored after incorporating post-1750 outcomes, the pairing is outcome-dependent.  

  **Phase 3: Evaluate Tolerance for Outcome-Dependence**  
  - Assess whether outcome-dependent pairings can still support valid macrohistorical explanation if underpinned by an *ex ante causal mechanism*. For example:  
    - If a theory posits that “fragmented sovereignty in Europe caused industrialization,” does this mechanism independently justify contrasting Britain (fragmented) with China (unified)?  
    - Test if proposed mechanisms (e.g., coal accessibility, factor prices) can be specified without referencing the outcome. If not, the contrast may be tautological.  

  #### 4. **Success and Failure Conditions**  
  - **Success**: A determinate criterion for well-posed contrasts in comparative history, demonstrated via the Britain-China case. Success entails:  
    - (a) A formalized “independence condition”: Q must be selectable from R using pre-outcome data alone.  
    - (b) Generalizability: The criterion applies cleanly to other contrasts (e.g., “Why democracy in Athens and not Rome?”).  
    - *For Britain-China*: Either validate the pairing by showing China is non-unique in R but selected via outcome-blind criteria, or invalidate it by proving outcome-dependence—then propose a repair (e.g., broadening R to Japan/India).  
  - **Failure**: Two untenable outcomes:  
    - (a) *Blanket skepticism*: All macrohistorical contrasts are ill-posed due to inherent outcome-dependence.  
    - (b) *Excessive permissiveness*: Outcome-dependence is unavoidable, rendering the independence criterion inert. Failure occurs if no middle ground emerges, leaving contrastive history without methodological guardrails.  

  #### 5. **Scope and Feasibility**  
  - **Scope**: Focused exclusively on the logical structure of the Britain-China comparison. No novel causal theories of the Great Divergence are proposed; existing accounts are analyzed for their explanatory framing. Philosophical concepts (e.g., contrast classes, causal asymmetry) are applied to historiography but not debated de novo.  
  - **Feasibility**: Achievable within one semester (5,000 words) because:  
    - **Data**: Relies on synthesized secondary literature (no primary research). Phase 2 uses published quantitative datasets (e.g., Maddison Project estimates, Bairoch’s urbanization data) for reference-class construction.  
    - **Risks**: Potential ambiguities in defining R or pre-outcome criteria will be mitigated by sensitivity analyses (e.g., testing multiple R definitions). Philosophical heavy-lifting is confined to Phase 3, leveraging concise formalism.  
    - **Deliverable**: A self-contained theoretical critique, with Britain-China as proof-of-concept.  

  #### Conclusion  
  This proposal interrogates whether the Great Divergence’s core question rests on a logical flaw. By synthesizing causal-inference tools with contrastive explanation, it aims to fortify comparative history against retrospective bias. If successful, it offers a transferable standard for framing “why P not Q” in macrohistory; if not, it exposes a foundational vulnerability in how historical puzzles are posed. Either outcome advances scholarly reflexivity.
