  As a software engineer with no formal background in philosophy, I am requesting a concise research proposal for a one-semester independent study (approximately 5,000 words) on whether the standard framing of the Great Divergence—why Britain industrialized and not China—is structurally well-posed as a contrastive historical explanation. Rather than proposing another economic or institutional cause, I want to examine the logical form of the comparison itself. My preliminary suspicion is that China is selected as the comparator largely because it shared key preconditions with Britain circa 1500 (large agrarian empire, advanced technology, integrated markets) yet failed to produce an industrial revolution, which makes the selection outcome-dependent. This may conflict with philosophical accounts of contrastive explanation, where asking "why P rather than Q" requires that Q be specified as a live alternative independently of observing that P occurred. Existing macrohistorical literature generally takes the Britain-China pairing as unproblematic, while philosophical treatments of contrastive explanation rarely test themselves against large-scale comparative history. The proposal should include: a precise statement of the structural problem; an explanation of why current answers in economic history and philosophy of science leave this question open; a three-phase method (formalizing the explicit and implicit selection criteria used in standard accounts to justify the pairing; applying a reference-class independence condition drawn from causal-inference reasoning to test whether those criteria depend on knowing the outcome; and evaluating whether macrohistorical explanation can tolerate outcome-dependent comparator selection if the causal mechanism is specified ex ante); a clear description of what success would look like (a determinate, generalizable criterion for well-posed contrastive questions in comparative history, with Britain-China serving as the test case) and what would count as failure (collapse into either blanket skepticism about all contrastive history or a permissive stance that renders the criterion useless); and an honest assessment of scope and feasibility for a single semester without primary archival research. I will supply all citations and references separately; please do not include a bibliography, reading list, or requests for specific sources. The deliverable should be written in formal, polished prose appropriate to an application.
