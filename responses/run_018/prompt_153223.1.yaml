  You raise a pointed practical challenge to the indeterminacy thesis. Let me address it directly. Your scenario cleverly adds behavioral complexity to the gavagai case—specifically, a darkness-restricted hand-sign correlated exclusively with live whole rabbits. Manual B ("living rabbit present") appears more economical, predicting the sign without auxiliary hypotheses. Manual A ("undetached rabbit part") requires grafting additional ad hoc rules to explain the sign's absence for parts, dead rabbits, and statues in darkness.  

  But this practical advantage doesn't collapse indeterminacy; it merely reflects our pragmatic preference for simplicity in constructing analytical hypotheses. The stimulus meaning of "gavagai" remains confined to observable assent/dissent dispositions under specific sensory stimulations—rabbit presentations in daylight. The hand-sign itself is just *another* native utterance or behavior, with its *own* stimulus meaning to be translated. We might correlate it empirically with darkness and whole living rabbits, but translating it as "living rabbit present" is itself an analytical hypothesis—one that imports our ontology of enduring objects and life states.  

  We could preserve Manual A by devising different analytical hypotheses for the hand-sign. Perhaps it signifies "manifestation of rabbit unity" or "rabbit essence observable"—hypotheses that align with Manual A's ontology by treating parts/dead rabbits as deficient manifestations. Manual A's "patches" aren't evidence of falsity; they're adjustments within an interlocking system of hypotheses that *as a whole* accommodates the behavioral data. Economy favors Manual B for *our* purposes, yes—but both manuals remain compatible with all possible sensory evidence. The inscrutability of reference persists because the evidence underdetermines not just words, but the very ontological categories we project onto the native. Simplicity is a virtue of theory-building, not a window into metaphysical truth.
