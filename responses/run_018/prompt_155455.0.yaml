answer: |-
  Here is a full specification of desiderata for an adequate theory of aesthetic judgment navigating Hume's challenge, incorporating your specified cases and distinctions:

  **Core Desiderata for a Humean-Compatible Theory of Aesthetic Judgment:**

  1.  **Convergence Requirement:** The theory must explain how convergence in judgment is *possible* and *normatively expected* among qualified observers under ideal conditions.  
      *   **Motivating Case:** Hume's ideal critics ("true judges") – individuals free from prejudice, possessing delicate sentiment, practice, comparison, and good sense – should tend towards agreement on the merits of established, complex works (e.g., disagreement over a new abstract painting resolves as critics gain experience and compare it to tradition).

  2.  **Corrigibility Requirement:** The theory must accommodate the notion that aesthetic judgments can be *mistaken* due to identifiable flaws in the observer or the conditions of observation, and that these mistakes can be *corrected*.  
      *   **Motivating Case:** Distinguishing transient disagreement (e.g., a novice disliking Shakespeare due to archaic language) from persistent disagreement among ideal critics. Mistakes arise from ignorance, prejudice, inattention, fatigue, etc., and can be remedied.

  3.  **Non-Objectivism Requirement:** The theory must avoid committing to aesthetic properties being entirely mind-independent facts about objects, akin to primary qualities or fundamental physical properties.  
      *   **Motivating Case:** Hume's rejection of the "standard of taste" being "fixed in the nature of things" in a fully objective sense. The theory cannot reduce beauty to a physical property like mass.

  4.  **Non-Relativism Requirement:** The theory must avoid committing to aesthetic judgments being *merely* expressions of individual preference or cultural conditioning, lacking any normative force beyond personal or group affirmation.  
      *   **Motivating Case:** Hume's insistence that some judgments are demonstrably *better* than others (e.g., Ogilby vs. Milton), implying a standard beyond mere personal liking.

  5.  **Normative Force without Rational Requirement Requirement:** The theory must ground the *normative authority* of ideal judgments ("X is beautiful") without implying that it is rationally incoherent or inconsistent for an observer meeting Hume's conditions to *prefer* something deemed aesthetically inferior.  
      *   **Motivating Case:** Distinguishing "This sonnet is beautiful" (aesthetic merit) from "You are rationally required to prefer this sonnet to that limerick" (preference requirement). We recognize superior aesthetic merit without demanding universal preference alignment.

  6.  **Variation Accommodation Requirement:** The theory must account for the existence and persistence of significant cross-cultural, cross-historical, and cross-modal variation in aesthetic responses, even among qualified observers, without collapsing into relativism.  
      *   **Motivating Case:** Differing evaluations of representational vs. abstract art across cultures; varying preferences for music genres; historical shifts in valuing Baroque complexity vs. Classical simplicity. This variation must be compatible with local corrigibility and convergence.

  7.  **Aesthetic Fault Line Handling Requirement:** The theory must provide a principled account of **aesthetic fault lines** – deep, stable disagreements that persist even among observers who seemingly meet all of Hume's conditions for ideal judgment and are free from identifiable, correctible biases concerning the work in question.  
      *   **Motivating Case:** Persistent, reasoned disagreement among unimpeachable critics over works like Wagner's operas (moral/aesthetic entanglement), challenging modernist literature, or the comparative value of radically different artistic traditions (e.g., classical Japanese Noh theatre vs. Greek tragedy).  
      *   **Mandated Treatment:** The theory *must* interpret these fault lines as evidence for one of the following (or a compatible combination), explicitly rejecting the idea that they *necessarily* indicate unresolved correctible bias:
          *   **Plural Standards:** Multiple valid but distinct standards of excellence apply (e.g., different artistic goals or traditions).
          *   **Hidden Dimensions:** The disagreement reveals unacknowledged, complex dimensions of evaluation where observers weight factors differently (e.g., valuing formal innovation vs. emotional resonance vs. historical influence).
          *   **Genuine Indeterminacy:** The aesthetic properties themselves, or their comparative weightings in this specific case, are underdetermined by the object and the conditions of ideal judgment.
      *   *Crucially, the theory cannot simply dismiss persistent fault lines as proof of hidden bias or failure to meet ideal conditions without independent evidence.*

  **Tensions with Mind-Independence:**

  The following pairs of desiderata become jointly unsatisfiable if aesthetic properties are stipulated to be **entirely mind-independent** (like the square's shape):

  *   **Convergence Requirement + Variation Accommodation Requirement:** If beauty is fully mind-independent, why does convergence depend so heavily on specific human capacities and training, and why does significant cross-cultural variation persist? A purely objective property should be detectable more uniformly.
  *   **Corrigibility Requirement (as typically understood) + Fault Line Handling Requirement:** If beauty is fully mind-independent, persistent disagreement among ideal critics should indicate *someone is objectively wrong*, contradicting the mandate to interpret fault lines as evidence for pluralism/hidden dimensions/indeterminacy rather than error. Mind-independence pushes towards fault lines always indicating correctible error.

  **The Eliminator: Fault Line Handling Requirement**

  This requirement eliminates the largest number of popular positions:
  *   **Naive Realism/Robust Objectivism:** Cannot accommodate fault lines without declaring one side objectively wrong, violating the mandated interpretation.
  *   **Strict Relativism/Subjectivism:** Cannot explain convergence among ideal critics or normative corrigibility.
  *   **Simple Sentimentalism (without ideal observer):** Cannot ground normativity or explain convergence.
  *   **Ideal Observer Theories insisting fault lines *always* indicate non-ideality:** Violates the mandate by refusing to acknowledge fault lines as a possible feature of genuine ideal judgment under indeterminacy/pluralism. They must provide independent evidence for non-ideality.

  **Scorecard:**

  1.  **Humean Sentimentalism (Ideal Observer):**
      *   **Strengths:** Excels at Convergence, Corrigibility, Non-Objectivism, Normative Force. Explains Variation via differing ideal observer constitution (to some extent).
      *   **Fault Line Challenge:** Struggles most here. Typically resorts to insisting fault lines *must* indicate failure to fully meet ideal conditions (lacking true "delicacy" or "good sense" *somewhere*), violating the mandated interpretation. Might *begin* to accommodate via pluralism about human sentiment, but this strains the convergence ideal. **Score: 5/7** (Fails Fault Line Handling decisively; struggles fully with Variation).

  2.  **Robust Aesthetic Realism:**
      *   **Strengths:** Satisfies Convergence (in principle), Corrigibility, Normative Force (strongly). Aims for Objectivity.
      *   **Weaknesses:** Fails Non-Objectivism Requirement fundamentally. Struggles immensely with Variation Accommodation and especially Fault Line Handling (must see fault lines as indicating error, not pluralism/indeterminacy). Normative Force easily slides into Rational Requirement. **Score: 2-3/7** (Fails Non-Objectivism, Fault Line Handling, Variation Accommodation; risks failing Normative Force distinction).

  3.  **Normative Constructivism (e.g., standards constituted by ideal critical practices):**
      *   **Strengths:** Excels at Non-Objectivism, Corrigibility, Normative Force (grounded in practice), Convergence (as an emergent ideal of the practice). Best positioned to handle Variation Accommodation (different practices/traditions) and **Fault Line Handling** (can readily adopt Plural Standards, Hidden Dimensions, or Indeterminacy within the constructivist framework as features of the practice itself).
      *   **Weaknesses:** Risk of relativism if standards are *too* localized (failing Non-Relativism). Convergence might be contingent on shared practices. **Score: 6-7/7** (Strongest contender; main challenge is ensuring robust Non-Relativism and sufficient grounding for Convergence across potential practice variations).
