prompt: |-
  my sister just got this weirdly specific prognosis from one of those predictive health algorithms and now she's talking like it's destiny, which is honestly part of why I'm thinking about this so much. I'm running a first-year philosphy section on thursday and I want to teach the Death in Damascus paradox but through the algorithm framing—not the old oracle story. Don't explain it to me, plan the explanation. What's the dependency order: I feel like you have to separate logical inevitability from causal determinism before you even tell the story, but then what has to come right after that? For the carrying example, I'm thinking the algorithm predicts she'll be in ward 4B on tueday, she books herself into a completely different hospital to avoid it, but a transfer mix-up lands her there anyway—what does this need to include and what does it have to lack to work? The misconceptions: they'll probably think this proves free will is fake, or that she was irrational for trying to dodge it, or that the algorithm caused the outcome—exactly where in the sequence do I cut each one off? Give me one end-of-section question that checks whether they understand it's about the logical form of the prediction, not about destiny. And what should I flat-out refuse to cover—maybe branching-time models or modal notation?—and just say "not at this level." There's a typo in my notes but don't worry about it.
reasoning: |-
  Okay, let me unpack this philosophy teaching request. The user wants to reframe the Death in Damascus paradox using predictive algorithms instead of oracles, specifically for a first-year class. Their sister's reaction to a health algorithm prediction seems to be the personal catalyst here - they're clearly bothered by the "destiny" framing and want students to avoid that misconception.

  Hmm, the core challenge is sequencing concepts for beginners. They're right that we must separate logical inevitability from causal determinism upfront - that's the bedrock. Their hospital transfer example is clever but needs surgical precision: it must show prediction without causation, avoid self-fulfilling prophecy elements, and demonstrate that avoidance attempts are rational. 

  For misconceptions, I should map where each typically arises: the "free will is fake" idea usually pops up after hearing the outcome, "she was irrational" emerges during the avoidance discussion, and "algorithm caused it" contaminates early interpretations. Need airlock-style barriers between these and the core logic.

  The end-of-section question must force distinction between prediction and causation. Something like: "If the algorithm had predicted Ward 7G instead, would she still have ended up in 4B?" makes them confront the information's passive nature.

  Hard boundaries are essential. Branching-time models and modal notation would derail freshmen. Should explicitly say "these are grad-level tools" while emphasizing the paradox only needs basic propositional logic. Also their "typo" comment suggests they're detail-oriented - best not to probe it.

  Their teaching instincts are sharp: they recognize that the carrier example must lack any algorithmic influence (no data leaks!) and that destiny-thinking must be dismantled early. I'll reinforce that by making Step 1 purely about the prediction's logical structure, not its content.
answer: |-
  Here’s a structured lesson plan targeting your goals, with precise sequencing and myth-busting:

  ---

  ### **Dependency Order & Key Stages**  
  1.  **Pre-Paradox Foundation (Critical!)**  
      - **Concept 1: Logical Inevitability ≠ Causal Determinism**  
        *Define:* "Inevitable" = logically must happen given the prediction’s truth. "Causally determined" = prior events force it.  
        *Analogy:* "If the algorithm says you’ll eat pizza tomorrow, that doesn’t *make* you eat pizza—it just means its statement is true."  
      - **Concept 2: Predictions as Descriptions (Not Interventions)**  
        *Stress:* Algorithms (like oracles) report future facts; they don’t *create* those facts through the report.  

  2.  **Present the Paradox via Algorithm (Hospital Example)**  
      - **Setup:**  
        *"Algorithm predicts: 'Patient will be in Ward 4B on Tuesday.'"*  
        *Sister’s response:* Books into different hospital to avoid 4B.  
      - **Twist:** Transfer mix-up lands her in 4B *anyway*.  
      - **Crucial elements the example MUST include:**  
        → The algorithm’s prediction is **accurate** (truthful report).  
        → Sister’s avoidance attempt is **rational & self-preserving** (not foolish).  
        → The path to 4B is **unrelated to the algorithm** (e.g., ambulance error, admin glitch).  
      - **What it MUST LACK:**  
        → **No feedback loop:** The algorithm’s prediction wasn’t accessed by hospital staff (not self-fulfilling).  
        → **No causal power:** The prediction didn’t *cause* the transfer (e.g., no one read it and moved her).  

  3.  **Immediate Post-Paradox Breakdown**  
      - **Q1:** *"Was the algorithm wrong?"* → No, it was accurate.  
      - **Q2:** *"Was the sister irrational to avoid 4B?"* → No, acting on info was logical (emphasize: evasion *should* work if prediction were false).  
      - **Q3:** *"Did the prediction CAUSE her to be in 4B?"* → No (revisit Concept 2: it *described* the outcome, didn’t engineer it).  

  ---

  ### **Combating Misconceptions (Timing & Rebuttals)**  
  - **"Free will is fake!"**  
    *When it arises:* Usually after the twist.  
    *Shut down at:* Step 3 (Q2).  
    *Response:* "Her free will operated fully—she chose to evade. The paradox is that rational actions *coexist* with true predictions."  

  - **"She was irrational to dodge!"**  
    *When it arises:* After stating the evasion attempt.  
    *Preempt at:* Setup & Step 3 (Q2).  
    *Response:* "If the prediction were false, evasion would succeed. Dodging is the *only* rational response to a bad prognosis!"  

  - **"The algorithm caused it!"**  
    *When it arises:* Immediately after the twist.  
    *Nip in the bud at:* Concept 2 (Pre-Paradox) & Step 3 (Q3).  
    *Response:* "Show where the prediction *intervened* in events. If the algorithm hadn’t existed, would the transfer still have happened?" (If yes→no causation).  

  ---

  ### **End-of-Section Question (Tests Logical Form Understanding)**  
  > **"If the algorithm had predicted Ward 7G instead, could the sister still have ended up in 4B? Explain why this doesn’t contradict the algorithm’s accuracy."**  
  *(Target Answer: Yes—the prediction’s content doesn’t bind reality. Accuracy only requires that *if* 7G is predicted, she ends up in 7G. 4B remains possible under other predictions.)*  

  ---

  ### **What to REFUSE to Cover**  
  - **Branching-time models** (e.g., "thin red line" theory).  
  - **Modal logic notation** (□, ◇ operators).  
  - **Causal decision theory equations**.  
  - **Quantum indeterminism debates**.  
  *Verbatim shut-down:* **"These are tools for advanced metaphysics—not needed to grasp the *logical* paradox at hand. We’re focusing on prediction-as-description, not temporal ontology."**  

  ---

  ### **Why This Works**  
  - **Hospital example** isolates the paradox from "destiny" framing by making the path to 4B *contingent* (mix-up) and *independent* of the prediction.  
  - **Sequencing** forces students to first digest prediction≠causation *before* encountering the twist, preventing magical thinking.  
  - The **end question** forces meta-analysis of prediction *as a logical claim*, not a causal force.  

  This primes them for deeper free will debates *later* while crisply dissecting the predictive-logic error now. Good call avoiding the oracle trope—algorithms make it feel current, not mythical.
