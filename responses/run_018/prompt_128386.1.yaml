  **Funding Opportunity Announcement: NSF 25-567**  
  **Pre-Registered Counterfactual Trials in Macrohistory: Solving the Needham Question Through Synthetic Control Methods**  
  **Program Officer: Dr. J. Arbuthnot (j.arbuthnot@nsf.gov)**  
  **Due Date: 10/31/2024**  
  **Award Ceiling: $4.2M**  

  ### I. INTRODUCTION  
  The National Science Foundation (NSF) invites proposals to resolve the "Needham Question" (i.e., "Why Britain and not China?") via a randomized, multi-arm, pre-registered counterfactual trial. Despite extensive observational data, causal identification remains confounded by post-hoc selection bias and unmeasured spatial heterogeneity. This initiative leverages advances in synthetic control methodology to experimentally isolate determinants of industrialization (1700–1850 CE). Proposals must implement a factorial design with blinded treatment allocation and pre-specified exclusion criteria, per NSF’s commitment to causal rigor in historical inference.  

  ### II. OBJECTIVES  
  The primary objective is to quantify the Average Treatment Effect (ATE) of three institutional factors on industrial "take-off": (A) **Coal Accessibility** (geological deposits ≥1.2 PJ/km²), (B) **Colonial Extractivism** (≥5 overseas territories), and (C) **Cultural Configurations** (Protestant work ethic index ≥0.7). Secondary outcomes include steam-engine adoption rates (≥10 units/yr) and GDP/capita divergence.  

  ### III. METHODS  
  #### *Experimental Design*  
  - **Randomization**: 20 societies will be randomly assigned to treatment arms via stratified block randomization (pre-1700). Strata: agrarian output, state centralization, and literacy rates.  
  - **Blinding**: Royal Society and Qing imperial censors will recieve masked society IDs (e.g., "Unit #12") until 1850 endpoint.  
  - **Treatment Arms**:  
    - Arm 1: Coal + Colonies + Culture (full package)  
    - Arm 2: Coal-only (counterfactual deposits synthetically induced)  
    - Arm 3: Colonies-only (simulated territorial transfers)  
  - **Control Groups**: China (Qing), India (Mughal), Ottoman Empire. *Note: Controls receive sham interventions (e.g., placebo coal lumps).*  
  - **Synthetic Controls**: Weights derived from pre-1700 covariates (e.g., textile output, canal density) will generate composite counterfactuals for "Britain-like" trajectories.  

  #### *Exclusion Criteria*  
  Societies exhibiting proto-industrialization (e.g., pre-1700 blast furnaces) or accidental steam engines (per *Sidebar 1*) are ineligible.  

  #### *Data Management*  
  Counterfactual outcomes (e.g., "Britain-without-coal") will be stored in a tamper-proof ledger (blockchain-assisted Qing imperial archives). Pre-analysis plans (PAPs) filed in 1699 must specify Bayesian updating protocols.  

  ### IV. BUDGET JUSTIFICATION  
  **Line Item 7: "Counterfactual Coal Deposits" ($1.1M)**  
  Funds will generate synthetic anthracite seams in randomized regions using geospatial null models (NSF EAR-2025). *Costs include:*  
  - Gondwana-era plate tectonics simulation (GPU clusters)  
  - Permian peat bog vaporware (subcontracted to DeepTime Inc.)  
  - Blindfolded cartographers (per double-blind protocol)  

  ### V. REVIEW CRITERIA  
  Proposals will be evaluated on:  
  1. Feasibility of "re-running" 1700–1850 without contamination (e.g., Napoleonic Wars).  
  2. Robustness to interference (e.g., tea-trade spillover effects).  
  3. Ethical compliance (IRB approval for simulated opium wars).  

  ---  
  ### *SIDEBAR 1: INCLUSION CRITERIA FOR VALID CONTROL SOCIETIES*  
  1. Agrarian surplus (≥30% above subsistence).  
  2. Absence of pre-trial steam technology (Newcomen engines = exclusion).  
  3. No prior exposure to "enlightenment values" (Locke Index <0.3).  
  4. Exchangeable institutional covariates (Mahalanobis distance ≤2.0 from Britain, 1700).  
  ---  

  ### VI. SUBMISSION  
  Submit PDFs via FastLane by deadline. PAPs must be notarized by 1699 ecclesiastical authorities (carbon-dating waiver available).  

