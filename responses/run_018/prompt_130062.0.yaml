answer: |-
  Here is the strict translation per your specifications:

  1.  **Keynesian measurable risk vs. true uncertainty:** Measurable risk corresponds to situations with well-calibrated priors based on sufficient historical data, enabling reliable posterior updates; true uncertainty (Knightian ambiguity) arises when model misspecification is severe, historical calibration is impossible, and no reliable prior can be formed due to lack of relevant reference classes.
  2.  **Organic, non-decomposable probability:** This describes joint event probabilities where structural dependence prevents decomposition into independent sub-event probabilities; the system's interactions make the aggregate probability irreducible and non-separable using standard marginal distributions, indicating inherent model complexity.
  3.  **Weight of argument vs. balance of evidence:** The balance of evidence determines the direction and magnitude of the posterior probability shift; the weight of argument reflects the robustness of this posterior to calibration error or model misspecification, influenced by the quantity and quality of underlying data informing the prior, distinct from the calculated probability itself.
  4.  **Residue Report:**  
      *   Measurable risk vs. true uncertainty: Maps cleanly to the Knightian ambiguity framework within risk analytics.  
      *   Organic probability: Survives only with distortion; while structural dependence is modeled, the claim of fundamental non-decomposability exceeds standard dependence structures and its absence may indicate a gap for complex system risks.  
      *   Weight vs. balance: Has no direct counterpart; standard risk analytics focuses on the posterior, not a separate robustness metric tied to evidence volume. This absence likely indicates a gap in quantifying model confidence robustness beyond calibration.
  5.  **Settled vs. Contested:** It is settled that Keynes's true uncertainty is the direct precursor to Knightian ambiguity. It is genuinely contested whether "organic" probabilities signify profound non-ergodicity or just complex dependence, and whether "weight" is a measurable epistemic property or an empty philosophical move conflating evidence quality with probability itself; no consensus exists on these interpretations.
