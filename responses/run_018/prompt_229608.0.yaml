prompt: |-
  In my third-year philosophy of mind module, I have been assigned to lead a fifty-minute section for first-years on eliminative materialism about beliefs and desires, and I would like to work from a proper teaching plan rather than simply deliver the view as an explanation. My instinct is that certain things have to be in place before the thesis can even be stated without sounding merely perverse: in particular, the claim that our ordinary mental vocabulary—belief, desire, intention—is itself a theory about unobservable posits rather than a neutral description of what is given. Is that really the load-bearing first step, and what should be placed after it: the general idea that a theory's posits can be abandoned wholesale once a better theory arrives, or something else? And what should actually carry the hour? I am unsure whether to use a single worked example from the history of science, such as the abandonment of phlogiston or caloric fluid, or an example drawn from the students' own mental talk; whichever I choose, I would want to know what the carrying example must have and must not have if it is not to overstate the eliminativist's claim.

  I am equally worried about the misconceptions that will predictably form: that eliminativists think people are literally empty-headed, that the position is self-refuting because defending it uses belief-talk, and perhaps that it is a claim about the disappearance of conscious experience. My guess is that these need to be defused at different moments rather than all at once, but I do not trust my sense of the ordering. At what point in the sequence should each be headed off, and are there any I should deliberately let surface before answering? Finally, what should I openly say I am leaving out at this level, and what single question could I ask at the end to tell whether the students have understood the position rather than merely found it outrageous? I would be grateful if your answer were written in British English.
reasoning: |-
  Okay, the user is a third-year philosophy student preparing to teach first-years about eliminative materialism. They need a structured lesson plan that builds understanding step by step. Their main concern is how to present the theory without it seeming perverse. They also want to address common misconceptions and assess comprehension.

  First, I need to outline the core challenge. Eliminative materialism (EM) claims that folk psychology terms like "belief" and "desire" refer to non-existent entities, much like "phlogiston." Students might resist this because mental states feel real. The lesson must first establish that mental vocabulary is theoretical, not observational.

  The user mentioned using scientific examples. Phlogiston or caloric are good, but I should highlight key parallels: both were explanatory posits replaced by better theories without direct equivalents. The example must show that the ontology was discarded, not reduced. Also, emphasizing that EM is about ontology, not phenomenology, is crucial to avoid confusion with consciousness.

  Addressing misconceptions is vital. The "empty-headed" myth needs clarification early—EM denies folk entities, not all cognition. The self-refutation objection should come later, after explaining EM's stance. Letting students wrestle with it before providing the response might deepen understanding. Consciousness must be explicitly separated from the discussion to prevent conflation.

  Timing is tight—50 minutes. Each section needs strict time limits. Starting with an exercise on mental state attribution could make the theoretical nature of folk psychology tangible. Then, using a scientific case study to illustrate theory replacement. After presenting EM, addressing objections in stages will reinforce the concepts.

  The user wants a diagnostic question. Asking students to identify what EM claims doesn't exist (e.g., beliefs as folk concepts) versus what it doesn't deny (neural processes) would test comprehension. Ending with a question linking folk psychology's potential failure to future scientific progress could gauge deeper understanding.

  I should ensure British English terms: "marking criteria," "plenary," "crisps packet." Highlighting what's omitted—qualia, propositional attitudes' structure—manages scope. Clear transitions between sections will keep the lesson focused. Encouraging note-taking during the myth-busting slide can help retention.

  Finally, reinforcing that EM is a claim about future science, not current experience, helps prevent dismissal. The lesson must balance conceptual groundwork, examples, and misconception handling within the time limit.
answer: |-
  Here’s a structured 50-minute teaching plan for eliminative materialism (EM), prioritising conceptual groundwork, misconception management, and pedagogical clarity, written in British English:

  **Lesson Title:** Eliminative Materialism: Does Folk Psychology Have a Future?  
  **Target Audience:** First-year Philosophy Students  
  **Duration:** 50 minutes  

  ---

  ### **Core Pedagogical Sequence**  
  *(Timings are approximate; adjust based on student engagement)*  

  1. **Hook & Foundations: "Theory-Ladenness" of Mental Talk** (10 mins)  
     - **Starter Exercise:** *Ask students to explain why someone: (a) bought crisps, (b) shouted at a friend. List their explanations on board.*  
     - **Key Point:** Highlight that they used terms like "believed," "wanted," "felt annoyed." Emphasise: **These aren’t neutral observations but explanatory constructs**—inferences about hidden causes.  
     - **Crucial Step:** Frame folk psychology (FP) as a *theory*: a pre-scientific system positing unobservables (beliefs/desires) to predict behaviour. *This is the load-bearing first step.* Without it, EM sounds nonsensical.  

  2. **Scientific Precedent: When Theories Get Replaced** (12 mins)  
     - **Use Phlogiston Example** (avoid caloric—less familiar):  
       - *What phlogiston explained:* Combustion, rusting (as "dephlogistication").  
       - *Why abandoned:* Oxygen theory explained more (e.g., weight gain in rusting), without needing phlogiston. **No "reduction"—ontology was eliminated.**  
     - **Analogy to EM:** FP might be like phlogiston—a useful but *radically false* theory. Better neuroscience could show beliefs/desires **don’t exist**, not just be re-described.  
     - ***Why this example works:*** Clear ontological elimination (no "phlogiston particles" found), avoids overstatement (EM targets *FP’s specific posits*, not all mental phenomena).  

  3. **State Eliminativism & Its Motivation** (8 mins)  
     - **Define EM:** "FP’s core posits (beliefs, desires) are *misrepresentations* of cognition. They won’t be reduced to neuroscience but *eliminated* as we abandon the theory."  
     - **Why Think This?** Briefly note FP’s perceived failures:  
       - Explains little (e.g., creativity, mental illness poorly).  
       - Doesn’t integrate with neuroscience (no "belief neurons" found).  
     - **Clarify Scope:** EM is about *propositional attitudes* ("S believes that p"), not necessarily raw feels (qualia)—flag this as omitted for now.  

  4. **Defusing Misconceptions** (15 mins)  
     Address predictably *after* stating EM, using a "Myth vs. Reality" slide:  
     - **"Empty-Headed" Myth:**  
       - *When:* Immediately after stating EM.  
       - *Response:* "EM denies *folk categories* exist. It doesn’t deny brains process information! It claims cognition is utterly *unlike* FP’s description—more like a connectionist network than a ‘language of thought’."  
     - **Self-Refutation "Gotcha":**  
       - *When:* Let this surface in Q&A or pose it yourself.  
       - *Response:* "EM is a *theory*. Saying ‘I believe EM’ is shorthand for ‘My brain is in a state that, *under FP*, is described as believing EM’. FP’s *falsity* doesn’t make stating it impossible—just *misleading*."  
     - **Consciousness Confusion:**  
       - *When:* Proactively, when defining EM’s scope.  
       - *Response:* "EM primarily targets *intentional states* (beliefs/desires). Whether it applies to *phenomenal consciousness* (e.g., pain qualia) is a further debate—**we’re bracketing that today**."  

  5. **Plenary & Diagnostic Question** (5 mins)  
     - **What We’ve Omitted:** State clearly: "We’ve set aside qualia, debates about FP’s *actual* accuracy, and rival views (e.g., functionalism)."  
     - **Diagnostic Question:**  
       > **"Eliminativists don’t deny that people *eat when hungry*. What *do* they deny, and why is this distinction crucial?"**  
       - *Testing for:* Understanding that EM denies the *explanatory framework* (hunger as a "desire"), not the behaviour/physiology. If they grasp this, they’ve moved beyond outrage.  

  ---

  ### **Why This Sequence Works**  
  - **Builds from Intuition:** Starts with students’ own explanations, revealing FP’s theoretical nature.  
  - **Leverages History of Science:** Phlogiston offers a non-mental, familiar case of ontological elimination.  
  - **Misconceptions Managed Strategically:**  
    - "Empty-headed" defused *early* to prevent dismissal.  
    - Self-refutation addressed *after* EM is understood, showing it’s surmountable.  
    - Consciousness explicitly *excluded* to avoid conflation.  
  - **Clarity on Scope:** Explicit omissions prevent overload and false assumptions.  
  - **Diagnostic Focus:** The closing question tests comprehension of EM’s *target* (FP’s ontology), not just its shock value.  

  **Materials:** Whiteboard/slide for (1) student explanations, (2) phlogiston vs. oxygen theory, (3) "Myths vs. Reality" table.  
  **Delivery Tip:** Signal transitions clearly: *"So we’ve seen FP is a theory... Now, could this theory be *false*? Let’s look at a historical parallel..."*  

  This plan ensures EM is presented as a *plausible (if radical) scientific conjecture*, not just a provocative soundbite. Good luck with your section—first-years will benefit from your thoughtful approach!
