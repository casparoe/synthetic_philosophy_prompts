  The disagreements table will be the core part. Key cruxes include: whether filtering operates within the same sub-market or only upward (using a case study like new luxury towers in a gentrifying area), whether community character is a collective good or exclusionary proxy (using a case like a new transit line), whether displacement pressure is immediate or delayed (using a case like rezoning a low-income neighborhood), and whether resident veto power preserves communities or blocks solutions (using a case like replacing a laundromat with housing). For each, I'll present both positions clearly and neutrally.

  I should also identify any verbal disputes - like both sides wanting "affordability" but meaning different things (market-rate versus permanently affordable), or "community character" having different connotations. I'll point these out explicitly.

  For terminology gaps, I'll suggest "filtering time-lag dilemma" for the disagreement about how quickly filtering helps existing renters, and "community character paradox" for the tension between preserving neighborhoods and excluding newcomers. These should help clarify without inventing fake studies.

  The tone needs to stay casual as requested - using contractions, phrases like "let's be real," and framing this as a working document. I'll avoid academic jargon while keeping the content precise. And I definitely won't end with a cop-out; I'll make sure the disagreements remain concrete and actionable.
answer: |-
  Here’s a draft adversarial-collaboration doc designed to pinpoint agreements, crystallize disagreements with testable predictions, and flag verbal disputes. It’s structured for clarity and future testing, not consensus-forcing.

  ---

  **Adversarial Collaboration: Housing Supply, Community Control & Affordability**  
  *Working Document for [Reading Group Name] - Draft v0.1*

  **Purpose:** To map exact points of agreement and disagreement between Supply-Side ("YIMBY") and Community Control ("CLT") perspectives on housing, zoning, and neighborhood change, using concrete cases to define cruxes.

  ### I. Agreed Claims (Both Signatories Accept These)
  1.  **Zoning History:** Exclusionary single-family zoning was historically used to enforce racial and economic segregation in many US cities, limiting opportunity and artificially constraining supply.
  2.  **Basic Rent Dynamics:** All else equal, a significant, sustained increase in housing supply relative to demand exerts *downward pressure* on rents/prices over time. Conversely, constrained supply amid rising demand exerts *upward pressure*.
  3.  **Filtering Exists... Sometimes:** "Filtering" – the process where older housing becomes more affordable as newer housing is built – is a real phenomenon observable in specific market conditions over *long time horizons* (decades). However, the speed, scale, and *local* impact on low-income renters is highly variable and contested.
  4.  **Displacement Metrics Suck:** Current methods for measuring displacement (especially indirect displacement/cultural displacement) are inadequate. It's hard to isolate the impact of new supply from broader economic forces (e.g., job growth, wage inequality).
  5.  **Land Value Impact:** New development, especially large-scale or high-end, typically increases nearby land values in the short-to-medium term, regardless of the unit type built.
  6.  **Affordability Crisis:** There is a severe shortage of genuinely affordable housing (relative to local incomes) for low and moderate-income households in many high-demand cities.
  7.  **"Luxury" is Fuzzy:** The term "luxury" applied to new market-rate units is largely a marketing term reflecting current construction costs and target rents, not inherent quality unattainable in future filtering. *However*, these units are unaffordable at launch to most existing residents in affected neighborhoods.

  ### II. Core Disagreements: Positions, Cruxes, & Test Cases
  *(Each position stated as the respective advocate would phrase it)*

  | Crux                                                                                          | Supply-Side (YIMBY) Position                                                                                                                                 | Community Control (CLT) Position                                                                                                                                                                                                 | Shared Relevant Case Study/Scenario                                                                                                                               | Testable Prediction / What Data Would Resolve It                                                                                                                       |
  | :-------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Filtering Mechanism & Locality ("The Sub-Market Leak Question")**                        | **Filtering operates significantly *within* local sub-markets.** New high-end supply absorbs high-income demand, slowing rent increases & accelerating filtering for *existing* units in the *same* neighborhood/city within 5-15 years. | **Filtering primarily operates *upward* or *regionally*, not locally for vulnerable residents.** New high-end supply attracts *new* high-income demand, accelerates local gentrification, raises area rents, and benefits move-in newcomers far more than existing low-income renters nearby. | **Case:** Building 500 new market-rate (unaffordable) units in a gentrifying neighborhood with ~30% low-income renters. Track rent changes for existing low-income units & surrounding blocks for 10 years. | **YIMBY Predicts:** Stabilization/slower growth of rents for existing low-income units *within the neighborhood* vs. comparable neighborhoods without new supply. **CLT Predicts:** Accelerated rent growth & displacement pressure on existing low-income units *within the neighborhood* vs. comparable areas. |
  | **2. Community Character & Control ("The Collective Good vs. Exclusion Proxy")**              | **"Community character" is often a subjective or exclusionary concept used to veto change and maintain privileged access.** Formal resident veto power over projects entrenches existing inequalities and prevents necessary solutions to regional crises. | **"Community character" embodies tangible social networks, cultural cohesion, and place-based history – genuine collective goods.** Long-term residents, especially marginalized groups, deserve democratic control to prevent disruptive displacement and cultural erasure. | **Case:** A vacant lot in a long-established, culturally distinct working-class neighborhood is proposed for a 6-story mixed-use building (market-rate + 10% affordable). | **YIMBY Predicts:** Veto power used primarily against density/affordable housing, preserving exclusion. **CLT Predicts:** Veto power used to ensure development aligns with community needs (e.g., deeper affordability, cultural space) and prevents disruptive scale. |
  | **3. Displacement Timeline & New Supply ("The Pressure Valve or Pressure Cooker")**            | **New supply is the *primary* long-term anti-displacement tool.** Blocking it worsens scarcity, guaranteeing faster displacement via rent hikes. Displacement linked to new supply is short-term/limited vs. the constant pressure of scarcity. | **New market-rate supply is a *direct catalyst* for immediate displacement pressure.** It signals neighborhood "upgrading," attracts higher-income residents, increases nearby property values/rents, and accelerates the displacement of existing renters *before* any filtering can occur. | **Case:** Upzoning a low-density, low-income neighborhood to allow mid-rises. Track displacement metrics (evictions, non-renewals, sales of small rentals to developers) *before* vs. *after* zoning change, even if no new building occurs yet. | **YIMBY Predicts:** Displacement rates rise minimally or not at all *until new units actually open*. Biggest risk is *delay* in building. **CLT Predicts:** Displacement rates increase *immediately* following upzoning due to speculative pressure and landlord anticipation. |
  | **4. Veto Power & Solutions ("The Preserve vs. Provide Dilemma")**                            | **Resident veto power paralyzes solutions.** It prevents the scale of building needed regionally, protects low-density privilege, and ultimately harms affordability for everyone, including the vulnerable. | **Veto power is necessary self-defense against market forces & top-down planning that consistently ignore or harm vulnerable communities.** Real solutions (like large-scale CLTs, social housing) require community control to implement effectively & prevent co-option. | **Case:** Replacing a neighborhood-serving business (e.g., a laundromat + 3 low-rent apartments) with a 100% affordable housing project using city subsidies, requiring a zoning variance. | **YIMBY Predicts:** Veto power likely blocks the affordable project too, citing "character" or "scale," perpetuating the overall shortage. **CLT Predicts:** Community control ensures the affordable project meets *actual* community needs (e.g., units for very-low-income, preserves some services). |

  ### III. Purely Verbal Disputes (Agree on Goal, Disagree on Language/Frame)
  *   **"Affordability":**
      *   **YIMBY Focus:** Increasing overall housing supply to lower *market-rate* rents/prices across the metro region over time. "Affordable" often means "attainable via the market (with filtering)."
      *   **CLT Focus:** Creating and preserving *non-market* or *permanently income-restricted* housing accessible to specific income levels *now*, especially the very-low-income. "Affordable" means "deed-restricted or subsidized."
      *   **Shared Goal:** People shouldn't pay excessive portions of income for housing. **Crux:** Is market-rate supply sufficient *on its own* to achieve this for the lowest income tiers?
  *   **"Community":**
      *   **YIMBY Hears:** Often implies exclusion of newcomers, particularly renters or lower-income people not already there. Can be weaponized against change.
      *   **CLT Means:** The existing social fabric, networks, and cultural identity formed by long-term residents, particularly marginalized groups facing erasure. Protecting this *is* protecting people.
      *   **Shared Goal:** Stable, vibrant neighborhoods. **Crux:** Does recognizing "existing community" inherently exclude newcomers, or can newcomers integrate without displacing the core? Is stability best achieved by controlling change or enabling more housing?

  ### IV. Coined Terms
  *   **The Filtering Time-Lag Dilemma:** The core disagreement about *how long* filtering takes to benefit *existing vulnerable renters* in the *specific neighborhood* where new supply is added, and whether the short-term harms (rising land values, displacement pressure, cultural change) negate the theorized long-term benefits. *(Encapsulates Crux 1 & 3)*
  *   **The Community Character Paradox:** The tension where efforts to preserve valued social/cultural aspects of an existing community through control mechanisms (like veto power) can function as de facto exclusionary barriers to new residents and needed housing, potentially undermining the economic diversity needed to sustain that character long-term. *(Encapsulates Crux 2 & 4)*

  **Next Steps:** This doc defines the battleground. Signatories agree these are accurate representations of their core positions and the key disagreements. Future discussion/analysis should focus on:
  1.  Examining evidence relevant to the **Testable Predictions** in the table.
  2.  Exploring policy mechanisms that might address concerns from both perspectives (e.g., mandatory deeper affordability inclusion, robust tenant protections *alongside* upzoning, community land acquisition funds).
  3.  Seeking better data on **displacement timelines and mechanisms** relative to new supply.

  ---
  **Signed (Agreeing this document accurately reflects their positions):**

  _________________________ (Supply-Side/YIMBY Advocate)
  _________________________ (Community Control/CLT Advocate)
  Date: _______________

  ---
  **Notes for your group:**
  *   **Tone:** Kept conversational ("let's be real," "sucks") while maintaining precision on the cruxes.
  *   **No Fake Studies:** Cases are plausible scenarios; real studies can be plugged in later.
  *   **No Values Cop-Out:** Disagreements are framed as empirical/testable predictions (the cruxes) *or* as concrete differences in preferred policy mechanisms/definitions.
  *   **Actionable:** The "Next Steps" push towards resolving disputes with evidence or finding hybrid solutions.
  *   **Flexibility:** This is a "v0.1" – the group should edit the wording of positions *only* if a signatory feels misrepresented, not to soften disagreements.

  This should force the conversation onto *why* they disagree on specific mechanisms and *what evidence* would change their minds, moving beyond the year-long stalemate. Good luck!
