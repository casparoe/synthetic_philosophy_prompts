  First, I need to identify each thesis as per the user's request. The user listed five types: weak empirical generalization, functionalist claim, normative/tragic thesis, French-specific structural claim, and metaphorical/thermodynamic image. For each, I should determine if it's a platitude, defensible, or false; if it applies specifically to the French case or modern revolutions; and whether it supports dismissing contingency.

  Starting with the weak empirical generalization. This is about frequency. It's defensible but not a law. Many revolutions have purges, but not all. The French case fits, but exceptions exist. Contingency isn't entirely dismissed here since it's probabilistic, not deterministic.

  Next, the functionalist claim. Revolutions lack stable mechanisms, leading to violent successions. This is defensible, especially in early stages without institutions. It applies broadly, including the French Revolution. But it doesn't eliminate contingency entirely, as some regimes might develop alternatives under different choices.

  The normative/tragic thesis. Here, revolutionary virtue corrupts itself. This is more philosophical and defensible as a pattern. The French Revolution is a prime example. However, it's descriptive rather than predictive, so contingency still plays a role through individual decisions.

  Then, the French-specific structural claim. This ties to competing claims of popular sovereignty without arbitration. Defensible for France, especially with factions like Montagnards vs. Girondins. It suggests inevitability within that context but allows that other revolutions might differ. Contingency is minimized here but not entirely negated; different actors might have navigated differently.

  Lastly, the metaphorical/thermodynamic image. Revolution as entropy, energy dissipating internally. This is more poetic and less substantive. It's a metaphor, not a testable claim. Doesn't provide explanatory power and overstates inevitability. Contingency is dismissed, but it's not a strong argument.

  The user's deeper need seems to be equipping themselves to challenge their classmate's deterministic view. They want a structured way to dissect the slogan's meanings and expose where contingency still matters. They might also be interested in understanding the nuances of revolutionary processes beyond simplistic slogans. By clarifying each thesis, the user can pinpoint which aspects are debatable and where historical evidence supports alternative outcomes.
answer: |-
  Here's a conceptual breakdown of the "revolutions devour their children" slogan, disambiguated into your five theses, analyzed for substance, scope, and implications for contingency:

  **Core Slogan:** "Revolutions Devour Their Children"
  **Meaning:** Revolutions inevitably turn against and destroy their early leaders/moderates.

  ---

  ### Disambiguated Theses

  1.  **Weak Empirical Generalization:**
      *   **Thesis:** Intra-revolutionary purges of significant early leaders/moderates are a *common historical pattern* across revolutions.
      *   **Nature:** Defensible substantive claim (though not universal law).
      *   **Scope:** Applies broadly to modern revolutions (French, Russian, Chinese, Iranian, etc.), including the French Revolution (Girondins, Danton, Hébertists, ultimately Robespierre). Less applicable to negotiated transitions or "velvet revolutions."
      *   **Contingency Implications:** **Leaves significant room.** This is a statement of frequency, not necessity. Recognizing the pattern doesn't explain *why* it happened in a specific case (France) or *if* it was unavoidable *there*. Contingent factors like specific rivalries, personalities (Robespierre's rigidity, Danton's perceived corruption), external threats (war), economic crises, ideological shifts, and tactical missteps could all be decisive within the broader pattern. The claim doesn't *dismiss* these; it merely notes they often lead to the same outcome.

  2.  **Functionalist Claim (Institutional Void):**
      *   **Thesis:** Revolutionary regimes, having overthrown the old constitutional order, inherently lack stable, legitimate, and institutionalized mechanisms for peaceful political competition, factional rotation, or succession. Violence becomes the *functional substitute* for resolving fundamental disputes over power and the revolution's direction.
      *   **Nature:** Defensible substantive claim.
      *   **Scope:** Applies strongly to the French Revolution (the Convention's instability, reliance on Committees like CPS/CGS, collapse of legal norms, resort to Revolutionary Tribunal/Terror). Also applies to other revolutions where the old state is shattered (Russia 1917, China 1949). Less relevant if the old state apparatus partially persists or transitions are managed constitutionally.
      *   **Contingency Implications:** **Moderately constrains contingency.** This identifies a powerful structural pressure. The *absence* of functional alternatives to violence makes purges *more likely*. However, it doesn't make them *inevitable* or dictate *who* gets purged *when*. Choices matter: Could the Convention have established more robust procedural safeguards earlier? Could factional compromises have held longer under different leadership or reduced external pressure? The *how* and *who* remain contingent, even if the *potential for violence* is structurally embedded.

  3.  **Normative/Tragic Thesis (Corruption of Virtue):**
      *   **Thesis:** The intense moral absolutism, ideological purity, and commitment to radical virtue required to *make* a revolution become self-destructive forces *after* the initial victory. The drive to root out corruption, counter-revolution, and compromise (perceived as betrayal) inevitably turns inward, consuming revolutionaries who now appear insufficiently radical or "impure." The means of revolution (violence, suspicion) corrupt the ends.
      *   **Nature:** Defensible substantive claim (particularly as a descriptive pattern of revolutionary psychology/politics), with strong normative/tragic elements.
      *   **Scope:** Applies acutely to the French Revolution (Rousseauian virtue, Terror as an instrument of republican purity, Robespierre's ideology). Resonates with other ideologically driven revolutions (Bolshevism, Jacobinism's descendants). Less relevant to revolutions driven primarily by nationalism or anti-colonialism without strong universalist ideological purity doctrines.
      *   **Contingency Implications:** **Leaves room, but highlights a powerful dynamic.** This is a claim about the *logic* and *psychology* unleashed, not strict determinism. Contingent factors include: the *specific content* of the revolutionary ideology (some are more inherently puritanical), the ability of leaders to moderate rhetoric/practice *if they choose*, the presence of figures advocating tolerance, and the impact of external events on internal paranoia. Different ideological choices or leadership temperaments *could* theoretically mitigate the dynamic, though the thesis suggests it's a powerful gravitational pull.

  4.  **French-Revolution Specific Structural Claim (Sovereignty Void):**
      *   **Thesis:** The unique rupture of 1789 created a fundamental, unresolvable problem: multiple factions (Girondins, Montagnards, Enragés, etc.) all claimed exclusive legitimacy as the true voice of "the People" and "the Nation," yet there existed *no agreed-upon, pre-existing, legitimate procedure* to arbitrate between these competing claims to popular sovereignty. This "sovereignty void" made violent conflict between revolutionaries claiming the same foundational legitimacy structurally inevitable. Thermidor wasn't an accident but the logical culmination of this immanent contradiction – the revolution consuming its own authority figures until exhaustion set in.
      *   **Nature:** Defensible, historically specific substantive claim.
      *   **Scope:** Primarily applies to the French Revolution. While sovereignty disputes exist elsewhere, the *total collapse* of the *ancien régime's* legitimacy framework and the *intensity* of the competing claims within the revolutionary camp was arguably unique to France 1789-1794. Less directly applicable to revolutions where sovereignty was less fragmented or a clearer institutional path existed (e.g., the American Revolution had colonial assemblies and the Continental Congress).
      *   **Contingency Implications:** **Strongly constrains contingency for this specific case.** This thesis argues that the *core structural problem* of the Revolution (competing claims with no arbiter) made the violent resolution of these conflicts *highly probable, if not strictly inevitable*. While specific actors and choices shaped the *timing, targets, and form* of the purges (e.g., Danton *before* Hébert, Robespierre's fall), the thesis claims the underlying dynamic driving conflict *to the point of purge* was inherent in the revolutionary situation France created in 1789. Different choices might alter the sequence or victims, but not the fundamental tendency towards devouring conflict.

  5.  **Metaphorical/Thermodynamic Image (Energy Dissipation):**
      *   **Thesis:** Revolutions unleash immense, chaotic energy. Like any dissipative system, this energy inevitably turns inwards ("internal friction") as the unifying external enemy (the *ancien régime*) is defeated. The radical momentum cannot be sustained indefinitely and exhausts itself through internal conflict, consuming its most energetic elements ("children") in the process. This is presented as an almost natural law of political physics.
      *   **Nature:** Primarily a vivid metaphor; **false as a substantive causal claim or "law."** It's descriptive imagery masquerading as explanation.
      *   **Scope:** The metaphor *fits* the French Revolution narrative (1789-94 radicalization/Thermidor) and other revolutions with radical phases followed by conservative backlash. Its applicability is broad but superficial.
      *   **Contingency Implications:** **Purports to dismiss contingency entirely, but fails.** This is the reading that most directly supports your classmate's dismissal of contingency, framing purges as an inevitable, natural process. However, it's the *weakest* reading conceptually. It offers no actual mechanism beyond the metaphor itself. It ignores the specific political, social, and ideological choices that drive internal conflict. It cannot explain *why* some revolutions stabilize without such extreme self-consumption or *why* the devouring takes the specific forms it does. It's a rhetorical flourish, not a tool for historical analysis. Different choices absolutely *could* alter outcomes within this framework – the metaphor simply asserts they wouldn't, without evidence.

  ---

  **Conclusion & Which Support Your Classmate's Dismissal:**

  *   **Most Supportive of Dismissing Contingency:**
      *   **#5 (Metaphorical/Thermodynamic):** Explicitly presents it as a natural law. (But it's the weakest argument).
      *   **#4 (French-Specific Structural):** Argues the core dynamic of the French Revolution made conflict to the point of purge highly probable/structurally inherent. Minimizes, though doesn't entirely eliminate, the role of contingency in the *core dynamic* (while allowing it for specifics).
  *   **Moderately Constraining (Recognizes Pattern/Pressure but Leaves Room):**
      *   **#2 (Functionalist - Institutional Void):** Highlights a powerful structural pressure making violence *likely*, but doesn't dictate specifics or preclude alternative paths being *attempted*.
      *   **#3 (Normative/Tragic):** Identifies a powerful psychological/political dynamic, but contingent choices about ideology and leadership matter for its intensity and targets.
  *   **Leaves Significant Room for Contingency:**
      *   **#1 (Weak Empirical Generalization):** Simply notes a pattern; explanation and avoidance require contingent factors.
      *   **#4 (French-Specific Structural) - *in its specifics*:** While the *dynamic* might be seen as structural, the *who, when, and how* of the purges remain contingent.

  **To Press Your Classmate:**

  1.  **Pinpoint the Thesis:** Ask him *which* of these meanings (or another) he intends the slogan to convey. Force specificity: "Are you saying this is a universal law of nature (#5), a tragic flaw of radical virtue (#3), or a specific structural flaw of 1789 France (#4)?"
  2.  **Challenge Determinism:** For #4 and #5, ask: "Does this mean Robespierre had *no choice* but to purge Danton? Could a different Committee composition or a decisive military victory have changed the calculus? If not, why? If so, doesn't that concede contingency?" For #5, challenge its explanatory value: "How does the 'energy dissipation' metaphor *explain* the specific ideological clash between Dantonistes and Robespierrists?"
  3.  **Highlight Exceptions/Alternatives:** Even if conceding the French case was likely (#1, #2, #4), note revolutions that avoided *extreme* self-devouring (e.g., negotiated elements of the Glorious Revolution, post-apartheid South Africa's relative success with TRC). Why did *those* revolutions avoid the fate?
  4.  **Focus on Mechanism:** Insist on the *how*. *How* exactly does the revolution "devour" beyond the vague image? Is it through institutional failure (#2), ideological self-poisoning (#3), or the sovereignty void (#4)? The mechanism determines the role of choice.

  By forcing him off the vague slogan and onto a precise claim, you can effectively challenge the dismissal of contingency and historical agency inherent in his usage. The slogan is potent rhetoric, but its explanatory power varies wildly depending on which specific thesis it's shorthand for.
