answer: |-
  Here is a structured list of desiderata for evaluating theories of rescue priority under a Taurekian anti-aggregation constraint, organized by your requirements and emphasizing motivating cases/considerations. Non-negotiables are marked **(NN)**; camp-specific preferences are marked **(CSP)**.

  ---

  ### **I. Desiderata: Cases Any Adequate Theory Must Get Right**
  1.  **Canonical Pairwise Rescue (NN):**  
      *   **Case:** One identified individual (e.g., "Child A") vs. five identified individuals (e.g., "Strangers 1-5"), all equally proximate, equally related to the rescuer, and equally saveable.  
      *   **Requirement:** The theory must *not* mandate saving the five simply because there are more of them. It must permit (or even require) saving the one, or treat the choice as genuinely agonizing/permissible either way without numerical superiority as a decisive *moral* reason.  
      *   **Motivation:** Preserves Taurek's core anti-aggregation intuition. Pure numbers alone cannot override the equal claim of the single individual.

  2.  **Unequal Cost Variants (NN):**  
      *   **Case (Abandonment):** Rescuer has *already started* saving the one (e.g., pulled from the water but needs CPR) when they learn of the five. Diverting aid *now* means the one definitely dies.  
      *   **Case (Proximity):** The one is *significantly closer* (e.g., on the shore) while the five are far out at sea; saving the five requires abandoning the one *and* expending much more effort/time/risk.  
      *   **Requirement:** The theory must explain why abandoning the one in these scenarios is *worse* than merely choosing the five over the one in the canonical case. It must capture the heightened moral significance of an established duty, special effort, or reliance.  
      *   **Motivation:** Distinguishes between initial choice and violating an obligation already undertaken or imposing disproportionate costs solely on one individual.

  3.  **Distributed Moral Proximity (CSP: Weight Relational Factors):**  
      *   **Case:** Victims are embedded in overlapping social networks. Rescuer R has weak ties to Stranger S1, but S1 is the sole caregiver for R's close friend F (who cannot rescue). Alternatively, multiple potential rescuers (R1, R2, R3) each have unique, varying-strength relationships to overlapping subsets of victims (V1-V5).  
      *   **Requirement:** The theory must generate plausible priorities in these complex, non-binary scenarios without simply collapsing back into pure numerical aggregation *or* pure arbitrariness. It must account for the *graded* nature of obligations arising from relational structures (kinship, reciprocity, community roles, causal dependence).  
      *   **Motivation:** Reflects the reality that moral obligations are often distributed across agents and mediated by social structures, challenging the "single rescuer vs. isolated groups" paradigm.

  ---

  ### **II. Desiderata: Distinctions Any Adequate Theory Must Preserve**
  4.  **Moral Status vs. Object of Duty (NN):**  
      *   **Requirement:** The theory must distinguish between the inherent moral worth of an individual (which is equal) and the source, strength, and content of a *specific duty* an agent has *towards* that individual in a given context.  
      *   **Motivation:** Anti-aggregation critiques often misrepresent Taurek as denying the equal moral status of the one. A theory must show how rejecting aggregation *follows from* how duties arise/conflict, not from unequal status.

  5.  **Ex Ante Decision Rules vs. Ex Post Evaluation (CSP: Determinacy of Duty):**  
      *   **Requirement:** The theory must clearly distinguish between the principles guiding an agent's *decision-making under uncertainty* (ex ante rules) and the evaluation of the *moral quality of the outcome* once all facts are known (ex post).  
      *   **Motivation:** What feels like a permissible gamble ex ante (e.g., trying to save the larger group) might lead to an ex post outcome that seems deeply wrong (e.g., letting the one die whom you could easily have saved). The theory must navigate this tension without equivocation.

  6.  **Causal Efficacy vs. Justificatory Moral Reason (NN):**  
      *   **Requirement:** The theory must distinguish between the *causal mechanism* by which an action saves lives (e.g., flipping a switch diverts a threat) and the *moral reason* that justifies choosing that action (e.g., fulfilling a promise, acting on a special relationship, respecting rights, maximizing expected value).  
      *   **Motivation:** Prevents conflating "what works" with "what is right." Anti-aggregation denies that the causal efficacy of saving more is *itself* the decisive moral reason justifying the choice.

  ---

  ### **III. Desiderata: Consistency with Settled Findings & Constraints**
  7.  **Moral Psychology Constraint (Settled Fact - Explanandum):**  
      *   **Requirement:** The theory must be *compatible* with the robust empirical finding that people strongly favor saving identified individuals over statistical lives in paradigmatic cases (like the canonical pond case) but are more willing to aggregate in abstract policy settings ("investing in road safety saves X lives").  
      *   **Motivation:** An empirically adequate moral theory must account for or explain this asymmetry, not dismiss it as mere irrationality *if* it aims to reflect common moral intuitions. (Note: *Explaining* it is optional; denying its relevance is possible but incurs a cost).

  8.  **Decision Theory Consistency (Settled Constraint - Non-Negotiable Logic):**  
      *   **Requirement:** The theory's prescriptions under uncertainty must not violate fundamental axioms of rational choice *without compelling, explicitly stated moral justification* for doing so. (E.g., avoiding strict dominance violations or intransitive preferences *unless* a robust moral reason demands it).  
      *   **Motivation:** While morality can constrain rationality, a theory that frequently prescribes actions that are demonstrably self-defeating or incoherent across choices risks practical irrelevance or paradox. This sets a high bar for deviation.

  ---

  ### **IV. Desiderata: Tensions & Potential Joint Unsatisfiability**
  9.  **Tension: Anti-Aggregation + Network Consistency (Potentially Unsatisfiable):**  
      *   **Requirement:** The theory must reconcile the rejection of pure numerical aggregation in simple pairwise cases with the demand for consistent, non-arbitrary prioritization within complex networks of distributed obligations (Desideratum 3).  
      *   **Tension:** Rigorously denying numbers any direct justificatory role in simple cases may make it extremely difficult to generate determinate, non-arbitrary priorities in complex networks without *implicitly* reintroducing aggregation or collapsing into unacceptable arbitrariness. **This subset (1, 3, 9) may be jointly unsatisfiable.**

  10. **Tension: Ex Ante/Ex Post Separation + Psychological Realism (CSP):**  
      *   **Requirement:** The theory must maintain a clear ex ante/ex post distinction (Desideratum 5) while acknowledging the psychological difficulty (and potential moral significance) of agent regret or retrospective judgment in outcomes (e.g., saving no one vs. saving only the one you could easily have saved).  
      *   **Tension:** A strict separation might seem artificial; the psychological pull of ex post evaluation may challenge the purity of ex ante rules. The weight given to this tension is CSP (e.g., more important for psychologically realist accounts).

  11. **Tension: Relational Duties + Universal Moral Standing (CSP: Relational Priority):**  
      *   **Requirement:** The theory must explain how strong relational duties (justifying saving "my child" over a stranger) are compatible with the recognition of the universal and equal moral status of all individuals (Desideratum 4).  
      *   **Tension:** Overemphasis on relations risks parochialism; strict universalism struggles to justify special duties without aggregation. Resolving this is core to the camp-specific choice between relational and more universalist foundations.

  ---

  ### **Settled vs. Contested**
  *   **Settled:** The existence and robustness of the "anti-aggregation intuition" in canonical pairwise cases like the pond scenario is widely acknowledged, even by aggregationists who seek to justify overriding it. The empirical asymmetry (identifiable vs. statistical victim effect) is a robust finding.
  *   **Genuinely Contested:**
      *   Whether "distributed moral proximity" (I.3) fundamentally *undermines* the binary framing of the core problem or merely *complicates* it requiring richer tools.
      *   Whether the ex ante/ex post distinction (II.5) can or should be cleanly maintained, or if moral evaluation is inherently holistic across time.
      *   Whether Taurek's argument relies on an "agent-relative prerogative," the "separateness of persons," the nature of loss, or something else (no consensus on the *best* interpretation/justification).
      *   Whether Decision Theory consistency (III.8) is a strict requirement or if morality *routinely* overrides rational choice axioms.

  ---

  ### **Brief Note on Major Approaches**
  *   **Utilitarianism:** Fails I.1 & I.2 (NN) by mandating aggregation. Struggles with II.4 & IV.11. Excels at III.7 (explains asymmetry via psychological biases) and III.8. May handle I.3 via complex utility calculus, but violates core constraint.
  *   **Contractualism (Scanlon-style):** Can potentially satisfy I.1 & I.2 (NN) by focusing on justifiability to each affected individual. Faces significant challenges with I.3 (distributed proximity/networked duties) and potentially IV.9. May struggle with II.5 (ex ante/ex post) clarity. Handles II.4 well. Ambiguous on III.7.
  *   **Relational Approaches:** Can satisfy I.1, I.2, I.3 (CSP). Excel at II.4 & II.6. May struggle with IV.9 (arbitrariness in networks) and IV.11 (universal standing). Face challenges with III.8 (decision theory). III.7 is an open question (may align well with intuitions).

  This framework prioritizes the criteria and their grounding cases/considerations, setting the stage for evaluating theories against this specification of adequacy while respecting the Taurekian constraint. The identified tensions, especially IV.9, highlight the profound challenges facing anti-aggregationist theories.
