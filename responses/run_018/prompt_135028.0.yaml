prompt: |-
  I'm a phd student in philosophy of science (stats-adjacent) and in our replication-crisis seminar someone keeps saying "absence of evidence is not evidence of absence" to brush off failed replications. Last meeting they used it right after a null result—basically arguing the original effect might still be real, we just haven't caught it yet, so the failure doesn't tell us anything. I know thier using it as a conversation-stopper but I can't articulate what's wrong. Could you break down the seperate precise claims that slogan could stand for? I'm thinking: (1) a bare logical point about deductive proof, (2) a Bayesian claim about priors and non-updating, (3) a statistical-power claim about underpowered studies, maybe others. For each reading, say if it's trivial, if it's true, and—crucially—whether it actually licenses dismissing a specific null result. Lay it out as a menu with the ones that do real argumentative work flagged, so I can bring it to the group.

  Please lead with your bottom line in the first sentence, then reasoning—no preamble and don't restate my question.
reasoning: |-
  Okay, let me tackle this query from a philosophy of science PhD student. They're dealing with a seminar where someone keeps dismissing failed replications with "absence of evidence is not evidence of absence," especially after null results. The student wants to dissect this slogan into precise claims to counter its misuse as a conversation-stopper.

  First, I need to unpack the slogan's possible interpretations. The key is to separate its distinct meanings across different frameworks. 

  Starting with the deductive logic angle: Here, the slogan means failing to prove A doesn't prove not-A. That's trivial in logic but irrelevant in empirical science where we deal with evidence, not proofs. Null results absolutely can be evidence of absence—this interpretation doesn't justify dismissing them.

  Next, Bayesian updating: If the prior for an effect is extremely high, weak evidence might not shift the posterior much. But that's conditional—it depends entirely on the prior strength. Crucially, a well-powered null result should update beliefs toward absence. So this only "works" as an argument if you assume an unrealistically strong prior, which often reflects bias rather than rigor. 

  Now statistical power: If a study is underpowered, a null result might just mean we couldn't detect the effect. But this requires demonstrating low power—it's not a blanket excuse. For a properly powered replication failure, this defense fails completely. The burden is on the claimant to show low power, not just assert it.

  I should also mention the evidential equivalence point: Under certain models, absence of evidence is literally evidence of absence (like in Royall's likelihood framework). A null result always shifts likelihood toward the null hypothesis. 

  The student needs to see that only the power argument conditionally justifies dismissal—and even then, only if low power is proven. The other interpretations either don't apply (deductive) or are misused (Bayesian priors as shields). 

  I'll structure this as a clear menu with flags for when arguments actually hold water. The core message is: Only the underpowered-study claim can validly dismiss a null result, and even that requires evidence of low power—it's not a free pass.
answer: |-
  Here's the breakdown of interpretations for "absence of evidence is not evidence of absence," assessing their validity and relevance for dismissing replication failures:

  **Bottom Line:** The slogan **cannot universally dismiss null results**; only the underpowered-study interpretation (3) *conditionally* justifies skepticism, but requires proof of low power, not mere assertion.

  1.  **Deductive Proof Claim**  
      *   **Interpretation:** Failing to prove X exists (via evidence) does not logically entail proof that X does not exist.  
      *   **Trivial?** Yes (basic logic).  
      *   **True?** Yes, but irrelevant. Science deals in evidence/probability, not deductive proof.  
      *   **Licenses dismissing this null result?** **NO.** A null result *is* evidence (not proof) of absence. This interpretation confuses evidence with logical certainty and ignores inductive reasoning entirely. Doesn't apply to scientific evidence.

  2.  **Bayesian Non-Updating Claim**  
      *   **Interpretation:** If your prior belief in the effect is extremely strong (P(effect) ≈ 1), even a null result provides negligible evidence against it, leaving P(effect|data) ≈ 1.  
      *   **Trivial?** No (substantive Bayesian claim).  
      *   **True?** Mathematically true *given that extreme prior*, but scientifically dubious.  
      *   **Licenses dismissing this null result?** **ONLY CIRCULARLY/UNHELPFULLY.** It only "works" if you *start* with near-certainty the effect is real. Using it to dismiss a replication failure assumes the very thing being challenged (the effect's existence). It converts the slogan into a bias-protection shield, not a valid argument. Requires justifying that extreme prior independently.

  3.  **Statistical Power Claim**  
      *   **Interpretation:** A null result from an *underpowered* study (high Type II error rate) is uninformative; it’s likely even if the effect exists.  
      *   **Trivial?** No (substantive statistical claim).  
      *   **True?** Yes, conditional on the study *actually being underpowered*.  
      *   **Licenses dismissing this null result?** **YES, BUT ONLY IF LOW POWER IS DEMONSTRATED.** This is the *only* interpretation offering valid grounds for skepticism. **Crucially:** The burden is on the skeptic to *demonstrate* the replication was underpowered (e.g., small N, noisy measures, effect size smaller than original). You *cannot* simply assert "absence of evidence..." – you must prove "this absence is uninformative *because* power was low."

  4.  **Likelihood/Evidential Equivalence Claim (Less Common)**  
      *   **Interpretation:** A result exactly at the null (e.g., p=1.00, d=0.00) has equal likelihood under the null hypothesis and under some specific alternative hypothesis, making it literally "not evidence of absence" relative to *that specific alternative*.  
      *   **Trivial?** No (technical statistical point).  
      *   **True?** Mathematically possible for specific point hypotheses, but rare in practice. Most null results (e.g., d=0.1 ± 0.2) still favor the null over *plausible* non-null values.  
      *   **Licenses dismissing this null result?** **RARELY & WEAKLY.** Requires showing the observed data is *exactly equally likely* under a specific, plausible alternative hypothesis as under the null. This is highly contrived for real data and ignores the preponderance of evidence usually favoring the null after a non-significant result.

  **Key Takeaways for Your Group:**

  *   **Only Power Matters Critically:** If your colleague wants to argue the null result is uninformative, they **must argue (3) and prove low power exists in *this* replication.** "Absence of evidence..." alone is insufficient.
  *   **Bayesian Claim is a Trap:** (2) sounds deep but is usually question-begging. Ask them: "What justifies your prior being so strong *after* a replication attempt failed, and shouldn't it update *at least somewhat*?"
  *   **Deductive Claim is a Red Herring:** (1) is irrelevant to empirical science; call it out as a category error.
  *   **The Slogan Often Misapplied:** It's primarily a *caution* against *interpreting underpowered negatives* as proof of absence, not a blanket dismissal of *all* null results, especially competent replications. Competent replications *do* provide evidence for absence.
  *   **Actionable Response:** Next time it's used, ask: "**Are you arguing this specific replication was underpowered? If so, please show us the power calculation or justification.** If not, how does this slogan apply?" This forces engagement with the only interpretation that *might* carry weight.
