answer: |-
  Here's Popper's demarcation argument translated into institutional research vocabulary, followed by a residue report:

  **Institutional Translation:**
  Science operates as a quality-control system where legitimacy is earned through **pre-commitment to disconfirmatory testing**. Here's how it works procedurally:

  1.  **Preregistration as Falsification Blueprint:** Research teams must publicly lock in their methods, analysis plan, and *specific criteria for failure* **before** data collection (preregistration). This isn't just planning – it's binding the project to a pre-defined "kill switch." If the results hit these predefined failure markers (e.g., key confidence intervals including zero, specific null results), the core hypothesis is considered invalidated. No post-hoc "fixes" (p-hacking, HARKing) can rescue it. The protocol *is* the falsification mechanism.

  2.  **Registered Reports as Falsification-First Review:** Journals commit to publishing work based *only* on the rigor of the preregistered methodology and the logic of its potential to *disprove* the hypothesis (Stage 1 review). Acceptance happens **before results are known**. The value is placed entirely on the test's ability to *fail*. Positive results are incidental; surviving a competent attempt at falsification is the core achievement.

  3.  **Replication Markets as Falsification Pressure:** Prediction markets on replication success force the community to "put money where the falsifiability is." Findings with clear, replicable methods designed to *allow failure* (high falsifiability) attract confident bets. Findings relying on flexible analysis, vague predictions, or irreproducible methods (low falsifiability) get low odds. The market price becomes a proxy for perceived falsifiability and robustness.

  4.  **P-Curve as Falsification Audit:** Analyzing the distribution of statistically significant p-values (p-curve) acts as a forensic tool. A right-skewed p-curve (lots of low p-values) suggests the underlying data has evidential value – the findings *survived* attempts at falsification via statistical testing. A flat/left-skewed curve suggests publication bias, p-hacking, or low evidential value – signs the findings *evaded* genuine falsification attempts. It audits whether the statistical "falsification filters" were actually passed.

  **The Core Institutional Principle:** Scientific claims gain legitimacy **only** by pre-specifying how they could be *wrong* and then *surviving* competent, pre-registered attempts to demonstrate that wrongness using shared methods. Legitimacy comes from passing through institutionalized disconfirmation gates, not just finding "positive" results.

  ---

  **Residue Report: What Survives, Distorts, and Disappears**

  1.  **Survives Intact:**
      *   **The Core Mechanism:** The institutional focus on *pre-commitment to potential disconfirmation* as the defining feature survives strongly. Preregistration and Registered Reports operationalize Popper's "specify how you could be wrong" requirement directly.
      *   **Anti-Confirmation Bias:** The emphasis on valuing well-designed tests *regardless of outcome* (especially in Registered Reports) captures Popper's attack on verificationism/"just finding evidence for."
      *   **The Process Focus:** Science is defined by its *procedures* (prereg, replication, rigorous stats) designed to expose error, not just its conclusions. This aligns with Popper's logic-over-psychology focus.

  2.  **Gets Distorted:**
      *   **The "One Big Test" vs. Process:** Popper imagined bold, decisive falsifications. The institutional version is messier – falsification is often a *process* of accumulated failed replications, methodological scrutiny (p-curve flags), and eroding confidence (replication markets), not a single knockout blow. It's distributed and probabilistic.
      *   **Negation vs. Failure to Confirm:** Institutional "falsification" often means "failure to confirm the specific hypothesis under the specific preregistered test." It's less about definitively proving a universal claim false (Popper's logical ideal) and more about *failing to find sufficient evidence for it* within defined parameters. The logical purity is diluted by practical constraints.
      *   **Role of Theory:** Popper's theory-ladenness (all tests rely on background theories) gets downplayed. A preregistered test failing could mean the main hypothesis *or* the auxiliary assumptions/methods were wrong. The institutional system struggles to perfectly isolate what exactly was "falsified."

  3.  **Disappears Entirely:**
      *   **The Sharp Logical Boundary:** Popper's bright line between "falsifiable = science" and "non-falsifiable = pseudoscience" vanishes. The institutional system deals in **gradients of legitimacy**: high (passed RR, replicated, strong p-curve), medium (preregistered but needs replication), low (non-preregistered, p-hacking flags, failed replication), and outcast (fraud, utterly irreproducible). There's no single "falsifiable/non-falsifiable" switch.
      *   **Pseudoscience as Defined Absence:** Institutional vocabulary doesn't define "pseudoscience" directly. It identifies *practices that evade the falsification machinery*: non-preregistration, HARKing, ignoring failed replications, methodological obscurity, exploiting publication bias. Pseudoscience is recognized by its *avoidance* of institutional disconfirmation protocols, not by an inherent logical property.
      *   **The "Metaphysical" Realm:** Popper's category for non-testable but potentially meaningful ideas (e.g., some philosophical claims) has no direct institutional counterpart. The system simply ignores what it can't operationally test via these methods; it doesn't categorize it as "non-science" in a philosophical sense.

  **The Missing Pieces & What They Mean:**

  The disappearance of the **sharp logical boundary** and the shift to **gradients of legitimacy based on procedural adherence** is the key residue. This isn't *just* a vocabulary failure. It highlights a fundamental flaw in Popper's original thesis:

  1.  **Institutional Reality Bites:** Real-world science operates with **auxiliary assumptions**, **measurement error**, **complex systems**, and **methodological evolution**. Falsification is rarely clean or absolute. The institutional vocabulary accurately reflects this messy reality where *robustness through rigorous testing* matters more than a binary "falsifiable/not" label.
  2.  **The Normative Boundary is Procedural, Not Logical:** The institutional system *does* enforce a strong normative boundary, but it's defined by **adherence to practices enabling disconfirmation** (prereg, transparency, replication), not abstract falsifiability. You can have a logically falsifiable claim that's still pseudoscientific *if it systematically avoids these practices* (e.g., constantly moving goalposts *after* tests). Conversely, non-falsifiable ideas might be ignored but aren't actively combated unless they masquerade as science by subverting the institutions (e.g., creationist "journals" mimicking peer review).
  3.  **Popper's Line Was Always Blurrier:** The institutional translation exposes that Popper *overstated* the clarity of falsifiability as a demarcation tool. The logical criterion is necessary but *insufficient* in practice. What separates science from pseudoscience in the real world isn't just the *potential* for falsification, but the active, institutionalized *implementation* of processes designed to *pursue* falsification rigorously and transparently. The blurriness inherent in the institutional process isn't a bug; it's a reflection that Popper's idealized line couldn't hold up to the complexity of actual research. The institutional vocabulary captures the *operational* boundary science actually uses.
