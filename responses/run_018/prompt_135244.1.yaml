  ok so me and my friend just got into it for like two hours about whether your past self can boss around your future self. not the usual living will stuff — i mean like what if i write an existantial advance directive that says if i get dementia and forget my partener, dont let anyone pretend i still love them just to keep the marriage going. my friend thinks thats still me speaking, just with more info about my values. i think once dementia has rewired my preferences in a stable way, the old directive is basically a ghost talking.

  so whats your actual credance that the earlier competent self should have binding authority in these value-drift cases? i want it decompossed:

  - p1: personal identity survives in a way that makes diachronic authority meaningful
  - p2: autonomy is fundamentally about honoring past commitments not satisfying present ones
  - p3: we can actually tell genuine value change in dementia apart from noise or confabulation
  - p4: existantial/social directives should be treated the same as medical ones

  give me rough numbers for each, how they combine into your final number, and which term is the weakest link. my friend is at like 0.75 that the directive binds, im at like 0.25 — where do you think our disagreement actually lives, which of these four?

  and what argument or evidence would shift you the most?
