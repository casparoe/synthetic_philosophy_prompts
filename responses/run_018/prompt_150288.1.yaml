prompt: |-
  Okay so my cousin asked if I'd consider donating a kidney and I said I'd think about it, and now I can't stop running mental checks on where morality actually gets to make demands of me. Here's my gut on a bunch of cases — some feel obvious, some feel like they clash.

  Saving a kid from drowning if all it costs me is wet shoes: totally required, no debate. Saving that same kid if I have to risk breaking my back jumping in? Still required, I think. But saving one random stranger by giving up my career and moving overseas? I feel like I can say no, even if thier life depends on it. Then there's money stuff: skipping one big vacation to fund a surgery that saves a life — I think I should do that. Donating half my income for exactly one year to save ten people? Probably yes. Donating half my income for the rest of my life? That's where I draw the line, I'm allowed to refuse. But here's the tension that bugs me: if I lie to a murderer at the door to save my friend hiding inside, that's fine and not too demanding at all. If I lie to save a stranger hiding in my basement from that same murderer, suddenly it feels like I'm being pushed past what I owe anyone? Maybe that's risk not demand, but I can't shake the feeling the two cases should line up differently.

  Anyway, is there a coherent principle behind all this? Maybe something about one-time costs vs open-ended ones, or about who I'm saving? I want whatever saves the most verdicts, but I'm okay dropping one if it makes the line cleaner. What does it say about the kidney case — is that closer to wet shoes or closer to giving up my career? And what about a case I haven't listed: I can save my friend from a fire with almost no risk, or save two strangers but I'd have to run through smoke. Which way does my principle go?

  Sorry if thats rambling, I just need to know if my instincts are all over the place or if there's actually a pattern here.
reasoning: |-
  Okay, let me unpack this user's moral dilemma. They're wrestling with how much sacrifice morality can demand, sparked by a cousin's kidney request. Their examples show a pattern: small costs (wet shoes) feel obligatory, while massive lifelong commitments (half income forever) don't. But the middle ground is messy—like lying to save a stranger feeling more burdensome than saving a friend. 

  Hmm, their core tension seems to be about proportionality. The "sacrifice spectrum" they described aligns neatly with philosopher Peter Singer's pond analogy, but they intuitively reject Singer's most extreme conclusions. That lifetime income donation example? Textbook demonstration of where common sense rebels against utilitarianism. 

  The kidney case is particularly tricky. It's not as minor as wet shoes (surgery has real risks!) but not as life-altering as abandoning one's career. The user's phrasing ("closer to wet shoes or career?") suggests they want this mapped onto their existing scale. Medically, kidney donation sits somewhere between: one-time major act with lasting impact but not total life derailment. 

  Ah! Their fire scenario reveals an unstated priority: special relationships matter. Saving two strangers over one friend feels wrong to them despite pure math favoring the strangers. That's classic "agent-centered prerogative"—permitting moral weight to personal ties. 

  What they're really seeking is moral coherence without self-annihilation. Their instincts aren't random; they're drawing three boundaries: cost magnitude (how much sacrifice), recurrence (ongoing vs one-time), and relational proximity (stranger vs loved one). The kidney answer will depend on which factors they weight heaviest. 

  ...Wait, did they mention guilt about the basement stranger case? That's fascinating. Protecting a friend feels instinctively justified, but a stranger triggers "why me?" resentment. That asymmetry points to relational duty as their hidden moral anchor. Maybe Bernard Williams was right about "one thought too many"—we're not meant to treat all lives identically. 

  For the fire dilemma: if their principle values relationships, saving the friend aligns perfectly. But if minimizing harm dominates, the two strangers win. Their discomfort with the latter suggests relationships trump pure calculus. 

  Final kidney verdict: if they see donation as a bounded sacrifice (like skipping a vacation's cost but with physical risk) and value familial bonds, it leans obligatory. If they emphasize bodily integrity or fear long-term impact, refusal is defensible. Either way, their instincts are more consistent than they realize—just pluralistic.
answer: |-
  Your instincts aren't random—they reveal a sophisticated, layered moral intuition grappling with **cost, relationship, risk, and scope**. Here's the coherent pattern emerging from your cases, and how it applies to your questions:

  ### Your Implicit Moral Framework (The "Sacrifice Spectrum")
  1.  **Magnitude of Sacrifice:** Morality demands more when the cost to you is low (wet shoes) and less when the cost is catastrophic (lifelong poverty, career loss). There's a sliding scale.
  2.  **Relationship & Proximity:** Duties feel stronger towards those you know/love (friend vs. stranger in the basement) or those physically/relationally close (kid drowning *right here*).
  3.  **Nature of the Sacrifice:** One-time, bounded costs (wet shoes, skipping vacation, lie to murderer) feel more obligatory than open-ended, recurring, or life-altering sacrifices (lifetime donation, moving overseas). Bodily intrusion (kidney, back injury) adds significant weight.
  4.  **Risk:** Imposing risk on yourself (running into smoke, jumping into deep water) weakens the obligation compared to risk-free acts, especially for strangers.
  5.  **Benefit:** Saving a life is paramount, but *how many* lives matters when costs are high (donating half income for 1 year vs. lifetime).

  ### Applying the Framework to Your Cases
  *   **Wet Shoes (Req):** Minimal cost, no risk, high benefit, extreme proximity.
  *   **Risking Back (Req):** Higher cost/risk, but still bounded, immediate proximity, high benefit.
  *   **Career/Move Overseas (Not Req):** Catastrophic, open-ended cost, no special relationship.
  *   **Skip Vacation for Surgery (Req):** Significant but bounded financial cost, high benefit, direct link. (Likely *more* obligatory than kidney donation due to lower personal risk).
  *   **Half Income 1 Year (Req):** High but bounded cost, high benefit (10 lives!), no special relationship needed due to scale.
  *   **Half Income Lifetime (Not Req):** Catastrophic, open-ended cost. Morality doesn't demand self-destruction.
  *   **Lie for Friend (Req):** Minimal cost, bounded, strong relationship.
  *   **Lie for Stranger (Debatable/Maybe Not Req):** Minimal cost *but* introduces risk/demand without relationship/proximity. Your hesitation highlights the role of relationship/directness.

  ### Addressing Your Tensions & Questions
  1.  **Kidney Donation:** This sits **between "Risking Back" and "Career/Move"**, leaning closer to the high-cost side.
      *   *Cost:* Major surgery, permanent bodily change, lifelong health considerations, recovery time. High magnitude.
      *   *Nature:* One-time act, but with permanent consequences. More bounded than lifetime income donation, less than skipping a vacation.
      *   *Relationship:* Cousin – significant familial tie (stronger than stranger, weaker than sibling/parent/child).
      *   *Benefit:* Saving one life (or drastically improving it).
      *   *Risk:* Significant medical/surgical risks.
      *   **Verdict:** Your framework suggests this is **not automatically obligatory**. The high personal cost, bodily intrusion, and risk mean morality allows you to refuse, *especially* if you have significant health concerns or dependents. The familial relationship strengthens the case *for* donating but doesn't *mandate* it given the costs. It's supererogatory (heroic, beyond duty) not obligatory.
  2.  **Fire Scenario (Save 1 Friend Easily vs. 2 Strangers with Risk):**
      *   *Your Framework Says:* **Save the Friend.**
      *   *Why:* Strong relationship creates a stronger duty to the friend. Saving the strangers requires imposing significant risk on yourself *for people you have no special tie to*. The benefit (2 lives vs 1) is likely outweighed by the combination of risk and lack of relationship/proximity in your intuitive calculus. Minimizing *your* risk while fulfilling a strong relational duty takes priority over maximizing abstract benefit when significant personal risk is involved.

  ### The Coherent Principles Behind Your Instincts
  1.  **Moderate Partiality:** You have stronger moral duties to those close to you (family, friends) than to strangers. This is ethically defensible.
  2.  **Bounded Sacrifice:** Morality demands significant sacrifices, but not those that destroy your own life, health, or fundamental well-being ("moderate altruism"). You aren't required to be a moral saint.
  3.  **Diminishing Marginal Obligation:** The *more* a sacrifice costs you (in resources, risk, life disruption), the *less* obligatory it becomes, even for significant benefits to others. Saving one life via kidney donation is vastly more demanding than saving one life via skipping a vacation.
  4.  **Risk as Cost:** Imposing serious risk on yourself counts as a significant cost, weakening an obligation, particularly towards strangers.
  5.  **Scope Sensitivity:** When costs are manageable, you *are* sensitive to the scale of benefit (e.g., donating half income for 1 year saves *10* lives, making it feel obligatory where saving 1 life at that cost might not). But this sensitivity fades as costs become catastrophic.

  ### Is the Pattern Perfect? Does it "Save All Verdicts"?
  It saves *most* of your strong intuitions. The tension between the "Lie to Murderer" cases highlights the crucial role of **relationship**. Protecting a friend feels inherent; protecting a stranger in your basement feels like an unexpected, potentially dangerous imposition *because* they are a stranger, even if the *act* (lying) is the same. Your framework prioritizes relational duties over identical acts for strangers. This is coherent and common.

  **Conclusion:** Your instincts are remarkably consistent! You're navigating a nuanced moral landscape balancing self-interest, altruism, relationships, risk, and cost. **Regarding the kidney:** Your framework strongly suggests it's a deeply personal, supererogatory choice, not a strict moral demand. The significant bodily cost, risk, and permanent impact mean you are morally permitted to say no to your cousin, especially if you have personal reservations or health concerns. The familial tie makes it a weightier "yes" *if* you choose, but doesn't flip it into an obligation like saving the drowning child. Trust your calibrated instincts – they reveal a sophisticated and humane moral sense.
