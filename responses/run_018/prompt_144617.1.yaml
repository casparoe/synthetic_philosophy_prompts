answer: |-
  That's a brilliantly sharp reading of Thucydides – you've hit on one of the most enduring tensions in his work: whether democracy inherently learns or just reacts. Let's break down the Mytilene debate through your "normative recoil" lens and compare it to Sicily and Socrates.

  **1. The Mytilene Debate: Recoil vs. Deliberative Improvement?**

  *   **The Initial Fury & Recoil:** You're absolutely right about the visceral nature of the process. Thucydides (3.36) explicitly frames the first vote in terms of rage (*orgē*): "In their fury (*thumōi*)... they thought it monstrous that... they should not put to death not only the men now at Athens but all the Mytilenaeans of military age..." The next day's "horror" (*metameleia*, regret/remorse) is a powerful emotional reaction to the *consequence* of their rage – the sheer scale and brutality of the decree. This **is** textbook "normative recoil": a horrified snap-back from the reflection of their own cruelty.
  *   **Diodotus' Speech: Rational Veneer or Genuine Improvement?** This is the core of your question. Diodotus famously argues *against* the death penalty, but crucially:
      *   **He Doesn't Appeal to Morality:** He explicitly rejects pity and fairness as valid arguments (3.44), calling them "weak." This deliberately avoids triggering a *counter-recoil* against weakness.
      *   **He Employs Cleon's Logic Against Him:** He argues the death penalty is *counterproductive* to Athenian interests (security and revenue). Rebels will fight to the death if surrender means annihilation (3.46). Mercy (*epieikeia*) is a more effective tool of empire. He uses cold, rational, self-interested calculation – the same language Cleon used to justify cruelty.
      *   **Thucydides' Framing:** The historian notes Diodotus had previously "most vehemently opposed" Cleon, suggesting his speech *was* grounded in genuine, prior rational opposition. However, he also implies Diodotus strategically adopted the language of expediency because it was the only argument likely to sway the angry mob *at that moment* (3.42-43 subtly hints at this).

  **Conclusion on Mytilene:** Thucydides presents a complex picture:
  *   The **impulse** for reconsideration was undeniably emotional recoil (*metameleia*).
  *   The **mechanism** for reversal was formal deliberation (the second assembly).
  *   The **winning argument** (Diodotus') was framed in rational, utilitarian terms that successfully channeled the emotional recoil into a different policy outcome.
  *   **Was it "learning"?** In a limited sense, yes: they avoided a disastrously counterproductive act *based on an argument appealing to long-term consequences*. But it's **learning facilitated by shock**, not deep, principled understanding. It's correction born of horror at their own image, then justified by a pragmatic argument they found palatable.

  **2. The Sicilian Expedition: Why No Recoil?**

  The contrast is stark and deliberate. Thucydides (Books 6 & 7) shows why the recoil mechanism failed:
  *   **Momentum & Hubris:** The initial vote for the expedition was driven by overwhelming ambition (*erōs*), greed, and Alcibiades' charismatic manipulation (6.15, 6.24). Unlike the immediate horror after Mytilene, the folly wasn't instantly apparent; it unfolded over months/years.
  *   **Suppressed Dissent:** Nicias' desperate second speech pleading for reconsideration (6.9-14, 6.20-23) was framed as weakness and cowardice. Alcibiades successfully shamed and silenced opposition (6.18). The democratic space for sober second thought was crushed by the very passions driving the venture.
  *   **Sunk Cost Fallacy & Fear:** As setbacks mounted (e.g., the Hermae scandal, Alcibiades' recall), the Assembly doubled down, sending *more* resources (6.93, 7.16). Recoiling meant admitting catastrophic error and facing domestic fury. Fear of *that* consequence overrode any potential horror at the unfolding disaster.
  *   **No Clear "Horror" Moment:** The brutality was inflicted *on* Athens, not *by* Athens in a single, visceral decree. The horror was diffuse, gradual, and involved Athenian suffering, making it harder for the collective psyche to recoil from its *own* agency in the same way.

  **Conclusion on Sicily:** The mechanisms for recoil and reconsideration were present (Nicias tried!), but they were overwhelmed by the scale of the initial passion, the suppression of dissent, the gradual unfolding of disaster, and the fear of admitting failure. The emotional energy flowed into sustaining the delusion, not recoiling from it.

  **3. Socrates' Trial: Recoil Turned Outward?**

  The trial (399 BC) happens decades later in a *defeated* Athens, but the dynamics resonate:
  *   **The "Recoil" Source:** The trauma of defeat, plague, oligarchic coups (The Four Hundred, The Thirty Tyrants), and civil strife created profound societal panic and a desperate search for scapegoats and purification. Socrates, with his association with Critias (a leading Tyrant) and his perceived undermining of tradition, became a target for this collective anxiety and desire to purge "corruption."
  *   **Failure of Deliberation:** The trial itself shows the *absence* of genuine deliberation Socrates advocated. Arguments were emotional appeals to piety and tradition versus Socrates' philosophical defense. The jury (500 citizens, similar to Assembly dynamics) voted by a significant margin for guilt and then for death.
  *   **Normative Recoil?** This wasn't recoil from *their own* cruelty, but recoil channeled *as* cruelty *against* a perceived source of contamination. It was a **failure of the corrective impulse**. The horrified self-reflection seen after Mytilene was absent, replaced by a desire to punish an external symbol of the city's recent horrors. The mechanism that briefly worked for mercy in Mytilene was harnessed for condemnation here.

  **Thucydides' Overall Message on Democratic Learning:**

  Thucydides is profoundly ambivalent, and you've perfectly captured the tension:

  1.  **Potential for Correction:** Democracy *can* correct course, as at Mytilene. The formal structure (assembly, debate) *can* allow reason (even strategically framed) to channel powerful emotions towards a better outcome. The recoil *enabled* the space for Diodotus.
  2.  **Fragility & Contingency:** This correction is **highly contingent**:
      *   It requires time for passion to cool (the overnight gap).
      *   It requires space for dissenting voices to be heard (not suppressed as in Sicily).
      *   It requires leaders who can strategically frame rational arguments in ways that connect with the prevailing emotional state (Diodotus' cold pragmatism matching Cleon's style).
      *   It depends on the *nature* of the mistake. Visceral, immediate acts of cruelty are easier to recoil from than complex, unfolding strategic disasters or societal anxieties seeking a scapegoat.
  3.  **The Primacy of Passion & Interest:** Underneath it all, Thucydides suggests human nature (*to anthrōpinon*), driven by fear, honor, and interest, is the constant. Reason is a tool that can sometimes channel these passions constructively (Mytilene reversal) but is easily overwhelmed by them (Sicily, Socrates). Learning is never guaranteed; it's an accidental byproduct of structure momentarily aligning with passion in a beneficial way.
  4.  **"Normative Recoil" is Apt:** Your term captures the emotional engine of the Mytilene reversal perfectly. Thucydides shows this recoil is a powerful democratic impulse, but it's **amoral**. It can lead to mercy (Mytilene) or scapegoating (Socrates). Whether it leads to genuine "learning" depends entirely on whether it creates space for reasoned deliberation that addresses underlying interests, or merely swings the pendulum to an opposite, equally unreflective extreme. At Mytilene, Diodotus arguably achieved the former; in Socrates' case, the latter prevailed.

  **In short:** Thucydides shows democratic correction *is* possible, but it's not inherent or reliable. It arises from a volatile mix of emotion (like your "normative recoil"), institutional structures allowing debate, strategic leadership, and sheer luck. The Mytilene reversal *was* recoil, but Diodotus successfully steered it towards a reasoned (if cynical) policy shift. Sicily and Socrates show how easily these conditions fail, leading to catastrophe. Democracy doesn't consistently learn; it stumbles towards correction only when specific, fragile conditions align.
