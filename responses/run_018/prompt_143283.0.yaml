  Okay, let's tackle this. The user is diving deep into the Nuremberg and Tokyo tribunals, focusing on critiques like victor's justice and retroactive law. They want to know where to focus efforts if they have three years and some influence as a legal philosopher or activist. The key is to prioritize based on tractability, leverage, and impact.

  First, I need to break down their main concerns: retroactive criminalization (nullum crimen sine lege), selective enforcement, and the sidelined Tokyo dissent. They also mentioned whether reviving Judge Pal's dissent would change anything. The user wants a defended agenda, not just a survey, so I have to pick the most impactful areas and explain why, while being honest about what's settled versus contested.

  Starting with the settled issues: It's uncontroversial that both tribunals were one-sided. The Allies didn't try their own, and Tokyo is even less cited than Nuremberg. Also, the basic principles from Nuremberg (like individual responsibility) are now foundational in international law, even if their origins are debated. Tokyo's dissents, especially Pal's, are known but haven't shifted mainstream practice much. These points are important context but not where to focus new efforts.

  Now, the contested areas. Selective enforcement is a big one. Critics argue that international criminal law (ICL) is still biased, punishing weaker states while powerful ones evade accountability. Defenders say progress is being made, pointing to ICC cases beyond Africa. But consensus? There's none; it's a live debate. Retroactive law is another hot topic. Nuremberg created new crimes, which some see as necessary, others as unjust. Modern ICL avoids this by having established statutes, but the legitimacy question lingers.

  The user wants upstream issues—where solving one problem could influence others. Selective enforcement seems high-leverage. If you can address why enforcement is biased and propose solutions, it could impact how universal jurisdiction is applied, strengthen the ICC's legitimacy, and make ICL more equitable. Tractability: While tough, there are angles like refining universal jurisdiction doctrines or pushing for consistent state cooperation. This has direct links to current practices and debates.

  Retroactivity, while foundational, is somewhat settled in modern courts due to codified laws. Rehashing Nuremberg's legality might not shift much now. It's important historically but less urgent for current practice. Tokyo's dissents, like Pal's, offer critical perspectives but haven't gained traction. Pushing them now might not change much unless tied to broader issues like anti-colonial critiques, which are gaining some ground but still marginal in mainstream ICL.

  Trade-offs: Focusing on selective enforcement means less time on historical debates. But given the user's limited time, this area offers more practical impact. Deprioritizing retroactivity and Tokyo dissents makes sense because even if resolved, they don't significantly alter today's enforcement challenges. Instead, integrating anti-colonial insights into selective enforcement discourse could bridge history with current issues.

  In summary, the user should target selective enforcement's structural biases. It's actionable, affects real-world applications, and intersects with ongoing reforms. Other areas are important but less likely to shift the field in three years. The key is to frame the critique constructively to influence policy and practice.
answer: |-
  Here’s a no-bullshit agenda for where to put your energy, based on leverage, tractability, and downstream impact. I’ll be blunt about trade-offs and what’s settled vs. contested.

  **Core Criteria:**
  1.  **Tractability:** Can you make concrete progress in 3 years? (Theory refinement > institutional reform)
  2.  **Leverage:** Does it expose a foundational crack in current ICL practice that *enables injustice*?
  3.  **Upstream/Downstream Impact:** Does resolving it clarify or force resolution of *multiple* other debates? Does it shift how practitioners *act*?
  4.  **Avoiding Sunk Costs:** Don’t polish historical brass if it won’t make the engine run better.

  **What’s Genuinely Settled (Stop Debating These as If They're Open):**
  *   **Both tribunals were one-sided (Victor’s Justice):** No serious scholar disputes this. Nuance exists about *why* (pragmatic necessity? raw power?), but the fact isn’t contested.
  *   **Nuremberg Principles are Canonical:** Individual responsibility, crimes against peace, crimes against humanity – *as concepts* – are bedrock in ICL statutes (ICC, ICTY, ICTR etc.). Debating their *origins* doesn't dissolve their *current status*.
  *   **Tokyo Dissents (Especially Pal) Were Sidelined:** Pal's acquittal-for-all position is a historical critique, not a living legal framework. His broader anti-imperialist critique is acknowledged intellectually but hasn't dented mainstream ICL doctrine.

  **What’s Still Contested (The Battlegrounds):**
  *   **The Depth & Permanence of Selectivity:** Is selectivity a *foundational, irreparable flaw* baked into ICL by power structures (Realist view), or a *temporary, surmountable* problem as the system matures (Liberal Institutionalist view)? **This is THE live wire.**
  *   **The *Ongoing* Legitimacy Impact of Origins:** Does the victor's justice/retroactivity *taint* permanently undermine ICL's moral authority, or is it merely a *historical footnote* overcome by subsequent state consent (UN Charter, ICC Statute)? **Fiercely debated.**
  *   **Nullum Crimen – Lingering Ghost or Dead Issue?** Modern ICL *formally* avoids retroactivity via treaties/statutes. But critics argue the *selective application* of *new* interpretations of existing law (e.g., modes of liability, CAH definitions) creates *de facto* retroactivity favoring the powerful. **Niche but sharp critique.**

  **The Agenda: Focus Relentlessly on Selectivity as the Foundational Pathology**

  1.  **Upstream Target: Demystify and Weaponize "Structural Selectivity"**
      *   **The Work:** Don't just *describe* selectivity. Rigorously *model* its mechanics: How do geopolitical power, resource disparities, Security Council vetoes, state cooperation (or lack thereof), and prosecutorial discretion *systematically* filter which situations/cases get pursued? Frame this not as "bad luck" but as an *inherent feature*, not a bug, of a law operating within an anarchic state system.
      *   **Why it's Upstream:** This is the root rot feeding *every* legitimacy crisis (Syria, Palestine, Iraq, US drone strikes). Fixing retroactivity won't matter if only the powerless get tried. Clarifying universal jurisdiction won't help if powerful states ignore it. Pal's critique *gains traction* only when linked to this *ongoing* dynamic.
      *   **Tractability:** You can develop sharp theoretical frameworks, case studies of non-enforcement, and critical analyses of ICC/universal jurisdiction decisions within 3 years. Influencing *discourse* is feasible.
      *   **Leverage:** Hits ICL where it lives. Exposes the gap between universalist rhetoric and realpolitik practice. Forces defenders onto weak ground ("We're trying!"). Empowers Global South critiques.
      *   **Trade-off:** It's depressing and politically fraught. You won't "solve" it in 3 years, but you can shift the analytical center of gravity.

  2.  **Downstream Lever: Reframe Universal Jurisdiction (UJ) as an *Antidote* to Selectivity (But Crippled)**
      *   **The Work:** Don't just advocate *for* UJ abstractly. Analyze *why* it fails: political pressure, lack of resources, "neo-colonial" accusations when used by Western courts. Develop principled, *operational* criteria for when UJ *should* be exercised to *counterbalance* ICC/SC inaction (e.g., clear evidence of ICC unwillingness, SC paralysis, direct victim link to forum state). Argue UJ's legitimacy *derives* from addressing systemic selectivity, not just abstract legality.
      *   **Why it's Leveraged:** UJ is a practical tool activists/prosecutors *can* potentially wield. Reframing it as a *corrective* to systemic bias makes its exercise (or non-exercise) a direct commentary on ICL's core flaw. Connects theory to actionable practice.
      *   **Tractability:** Developing concrete criteria, litigating test cases (amicus briefs?), and building networks between activists and sympathetic prosecutors is possible in 3 years.
      *   **Leverage:** Directly challenges state impunity where the ICC fears to tread. Makes selectivity visible in domestic courts. Successes (even symbolic) shift the narrative.
      *   **Trade-off:** High risk of backlash ("lawfare!", political interference). Success is rare and hard-fought. Requires deep collaboration with practitioners.

  3.  **Integrate the Anti-Colonial Critique (Tokyo/Pal) into Selectivity Analysis**
      *   **The Work:** Don't try to "recover" Pal as a direct legal authority – it won't fly. Instead, use his *critique of imperial power structures blinding "justice"* as the lens for analyzing *modern* selectivity. Show how the *same* dynamics (Western dominance, disregard for non-Western lives/sovereignty, economic interests) manifest today in which conflicts get ICC attention or face UJ. Link Pal to TWAIL (Third World Approaches to International Law) scholars.
      *   **Why it's Upstream/Leveraged:** Connects the historical critique to the *current* structural problem in a way that resonates with contemporary anti-imperial/anti-racist movements. Provides deeper explanatory power for *why* selectivity persists. Makes the historical critique *relevant* to modern practice.
      *   **Tractability:** Scholarly synthesis and framing within activism is achievable. Finding resonant narratives for advocacy.
      *   **Trade-off:** Risks being dismissed as "political" rather than "legal" by mainstream ICL. Needs careful translation to avoid seeming purely historical.

  **What to Deprioritize (Even If Interesting):**

  *   **Re-litigating Nuremberg's Retroactivity Legality:** The horse is out of the barn. Modern ICL bases itself on treaties/consent, *not* Nuremberg's retroactive precedent. Debating 1945 legality is historical navel-gazing with minimal impact on *current* ICC or UJ cases, which rely on their own statutes. **Trade-off:** Satisfying intellectually, but zero downstream leverage today.
  *   **Pushing Pal's Full Acquittal Position as Law:** A non-starter. No court will adopt it. The *critique* within it is valuable (see above), but the legal conclusion is dead. **Trade-off:** Wastes energy on an unwinnable argument.
  *   **Seeking Formal "Vindication" of Tokyo Dissents:** The dissents are known. Their historical importance is acknowledged. Trying to get the UN or ICC to issue some mea culpa about Tokyo is pure symbolism with no practical legal consequence. **Trade-off:** Feel-good history, not impactful legal change.
  *   **Endless Refinement of Philosophical Justifications for *Nullum Crimen* in Abstract:** Important for legal theory, but modern ICL's *practical* problem isn't abstract retroactivity – it's *selective application* of law *claimed* to be non-retroactive. Focus on the *application* pathology, not the (largely settled) *existence* principle. **Trade-off:** Academic rigor without addressing the core operational flaw.

  **In Short:** The core problem **isn't** justifying 1945 anymore. It's confronting the **ongoing, structural selectivity** that **is** "baked in" and which poisons ICL's legitimacy *today*. That's the upstream node. Focus your limited influence on:
  1.  **Rigorously exposing the mechanics of modern selectivity.**
  2.  **Reframing Universal Jurisdiction as its necessary (if flawed) counterweight.**
  3.  **Using the anti-colonial critique (including Pal) to explain *why* selectivity endures.**

  This agenda forces the field to confront its deepest hypocrisy, offers (partial) practical pathways through UJ, and connects historical injustice to present dysfunction. It’s hard, political work, but it’s where you can actually move the needle with limited time. Good luck.
