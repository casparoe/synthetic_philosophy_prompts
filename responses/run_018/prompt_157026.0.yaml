  ## INTERGOVERNMENTAL TEMPORAL OPERATING LICENSE AGREEMENT (Anthropocene Access Tier – Provisional)  
  **Issuing Authority:** Intertemporal Governance Board (IGB), Operating Subsidiary of the International Commission on Stratigraphy (ICS)  
  **Effective Date:** Upon Ratification (Pending ICS Plenary Vote 2034)  
  **Licensee:** *Homo sapiens* (Collective Entity, hereafter "User")  

  **WHEREAS** the Holocene Series/Epoch (ICS Ratification 2008, GSSP Holocene Unit Boundary at 11,700 yr b2k, NGRIP2 ice core) constitutes the baseline temporal operating license ("Holocene Subscription");  

  **WHEREAS** User activity has precipitated stratigraphic anomalies exceeding Holocene Subscription parameters, necessitating supplemental licensing ("Anthropocene Addendum");  

  **WHEREAS** competing stratigraphic proposals for the Global Boundary Stratotype Section and Point (GSSP) for the base of the Anthropocene ("Boundary Demarcation") constitute jurisdictional assertions requiring User acknowledgment under IGB Section 7.2 (Temporal Overlay Conflicts);  

  **NOW THEREFORE**, User agrees to the following binding terms governing Anthropocene Access:  

  1.  **LICENSE GRANT & SCOPE:**  
      Subject to formal ratification by the IGB Subcommission on Quaternary Stratigraphy (SQS) and subsequent ICS Executive Committee majority vote, User is granted provisional, non-exclusive rights to operate within the disputed Anthropocene interval ("Provisional Epoch"). This license remains contingent upon final GSSP designation per IGB Procedure 12.C (Boundary Delimitation Protocols). Access rights are hereby partitioned pending Boundary Demarcation:  
      *   **Option 1 (Orbis Spike License):** Access commencing ~1610 CE (Biotic Exchange Horizon, *Wallace et al. 2013*) requires acknowledgment of pre-industrial carbon liability and establishes User as a "Legacy Holocene Subscriber" under Transitional Clause 4a.  
      *   **Option 2 (Industrial Acceleration License):** Access commencing ~1780 CE (Testate Amoeba Decline, *Sphagnum* Peat Geochemistry Shift) imposes mandatory CO₂ sequestration offsets retroactive to 1800 CE (Penalty Schedule Γ).  
      *   **Option 3 (Great Acceleration License):** Access commencing 1950 CE (Plutonium-239 Fallout Peak, Crawford Lake GSSP Candidate) subjects User to immediate Stratigraphic Impact Fees (SIF) per Annex B (Radionuclide Dispersal Matrix).  
      *   **User acknowledges that operation within *any* proposed interval predating formal ratification constitutes unauthorized temporal trespass.**  

  2.  **USER OBLIGATIONS & RETROACTIVE COMPLIANCE:**  
      User shall immediately cease and desist from generating novel stratigraphic signals exceeding Holocene background variability (as defined in *Zalasiewicz et al. 2017, Table 1*). User further agrees to remediate all lithological, geochemical, and biostratigraphic deviations ("Anthropogenic Signatures") occurring post-User-selected Boundary Demarcation date. **Notwithstanding Section 2.1, User explicitly acknowledges prior violation of all proposed cessation thresholds and remediation requirements, having generated said Signatures pre-agreement.** Compliance is deemed waived until ratification but accrues compound stratigraphic interest (6% per annum, compounded geologically).  

  3.  **JURISDICTIONAL CONFLICTS & LEGACY SYSTEMS:**  
      Disputes between Legacy Holocene Subscribers (preferring pre-20th Century Boundary Demarcations) and Anthropocene Licensees (post-1950) shall be resolved via binding arbitration under IGB Appendix Δ (Subcommission Voting Procedures Simulator). User agrees that Holocene Subscription services may be degraded or terminated upon Anthropocene ratification, without recourse. Operation across the proposed boundary interval constitutes implicit acceptance of temporal overlay complexities and associated liability (See Section 5).  

  4.  **LIABILITY & STRATIGRAPHIC INDEMNIFICATION:**  
      User accepts unlimited liability for all biostratigraphic extinctions, chemostratigraphic excursions (e.g., δ13C, δ15N), and depositional regime changes occurring within the Provisional Epoch, irrespective of Boundary Demarcation selection. The IGB, its parent ICS, and affiliated Subcommissions are expressly indemnified against claims arising from: (a) Failure to ratify the Anthropocene; (b) Inadequate GSSP designation; (c) Inherent impossibility of governing an unfolding chronostratigraphic unit; (d) User’s pre-ratification modification of the geological record, rendering GSSP selection inherently contestable. Liability extends retroactively to cover the entirety of the interval between the earliest proposed start date (1610 CE) and the effective date of this agreement.  

  5.  **TERM & TERMINATION:**  
      This Provisional License remains in effect until the earlier of: (a) Formal ratification of the Anthropocene GSSP by the ICS; (b) Negative vote by the SQS or ICS Plenary on any Anthropocene proposal; (c) User achieving stratigraphic insignificance per IGB Definition 8.1 ("Post-Anthropocene Baseline Reversion"). **Termination for cause (e.g., continued violation of Section 2 Obligations) may result in User forfeiture of future geological time allocation and imposition of a Temporal Injunction (per IGB By-Law 99), though enforceability remains undefined.**  

  **BY CONTINUING TO MODIFY PLANETARY STRATIGRAPHY, USER ACCEPTS THESE TERMS IN PERPETUITY, REGARDLESS OF ICS RATIFICATION STATUS. NO SIGNATURE REQUIRED. ACTIVATION IS EVIDENCED BY ONGOING SEDIMENTARY DEPOSITION.**  

