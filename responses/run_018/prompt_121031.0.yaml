  ### Orientation  
  You've accurately characterized the two families of coherence arguments. Your two-stage rule (ruin floor → expected value maximization) indeed violates expected utility (EU) axioms by introducing lexicographic preferences, making it Dutch-book-vulnerable *in theory*. However, your practical immunity to exploitation reflects the absence of a strategic adversary, not a flaw in the rule itself. The probability refinement concern is handled in *value of information* (VoI) theory, but VoI assumes EU-maximization to calculate costs/benefits of information—this circularity is a gap for non-EU agents.

  ---

