  | Your ruin floor is equivalent to a utility function with infinite negative slope below the threshold, making your rule a special case of EU-maximization. | formal result | two-stage rule | no | fatal | already realized | Deriving utility bounds: if *U(outcome)* → -∞ as outcome → ruin floor, EU-maximization replicates your rule (proof via continuity violations in lexicographic models). |
  | In sequential decisions with learning, your rule may reject VoI-acquiring actions that EU-maximization would deem optimal, leading to dominated long-term outcomes. | conceptual argument | Modest Reading | yes (defenders grant VoI requires EU foundations) | awkward | live | A case where your rule refuses costly probability refinement, missing chances a bounded EU-maximizer would seize (e.g., rejecting a costly experiment that avoids future ruin). |
  | Diachronic pumps require preference stability, but if an agent's values shift *randomly*, EU-violators avoid exploitation as effectively as EU-maximizers. | meta-level insulation worry | Modest Reading | only-for-a-weakened-version | cosmetic | merely logically possible | Empirical data showing preference instability correlates with higher losses for EU-violators than EU-maximizers in volatile environments. |
  | Field evidence: organizations using threshold rules suffer avoidable systemic failures (e.g., financial crashes from Value-at-Risk models). | empirical finding | two-stage rule | no | serious | already realized | Audits of lab/grant decisions showing your rule missed EU-dominant options due to discarding "risky" high-expected-value choices above the floor. |
  | The Modest Reading is insulated because it dismisses any exploit as "adversarial," rendering it unfalsifiable. | meta-level insulation worry | Modest Reading | no | awkward | live | Producing a non-contrived scenario where non-EU agents lose resources *predictably* while EU agents thrive, absent an adversary. |

