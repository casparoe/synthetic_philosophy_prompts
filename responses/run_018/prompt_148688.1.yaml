answer: |-
  Here's a focused 45-minute teaching plan prioritizing inevitability, misconception blocking, and structural framing, skipping Gödel/formal semantics:

  **Core Framing:** "Expressive Completeness" (Can we talk about *everything*, including truth?) vs. "Semantic Closure" (Can our language contain its *own* truth predicate?).

  **Order & Activities (45 mins total):**

  1.  **Hook & Setup: The Card Game (10 mins)**
      *   **Analogy:** Introduce a simple card game. Cards have sentences *only* about other cards' *truth values* using a restricted vocabulary (e.g., "Card 2 is True", "Card 3 is False"). No semantic words allowed *on* the cards initially.
      *   **Setup:** Show 3 cards making simple, consistent claims about each other (e.g., Card1: "Card2=T", Card2: "Card3=F", Card3: "Card1=T"). Analyze consistency.
      *   **Introduce "Truth Card":** Add Card X: "Card X is False". *But note:* Our rules forbid "True/False" *on* cards! How can we say this?
      *   **"Expressive Need":** Argue we *need* to talk about truth *within* the system. Allow a special "Truth Card" that *can* say "Card [Number] is True/False". **This is the key move towards semantic closure.**
      *   **Build the Liar:** Create Card L: "The sentence on Card L is False". Point out: This *uses* the new "Truth Card" vocabulary *on itself*.

  2.  **Unveiling the Paradox & Feeling Inevitability (10 mins)**
      *   **Analyze Card L:** Ask: "If L is True, what must be the case? (Its claim must be correct: so L is False). Contradiction. If L is False, what must be the case? (Its claim must be wrong: so L is *not* False, meaning True). Contradiction."
      *   **Emphasize Structure:** Highlight: "We built this *only* by allowing: 1) Talking about truth (Expressive Completeness), and 2) Allowing sentences to talk about *themselves* using that truth predicate (Semantic Closure). The contradiction *fell out* of those two features interacting. It wasn't a trick word; it was the structure collapsing."
      *   **Quick Check:** Ask groups: "Could we avoid this *just* by banning self-reference? How might that fail in a bigger system?" (Guide them to see indirect self-reference via chains like Card A says "B is True", Card B says "A is False" – still paradoxical). **This shows they grasp the dependency on semantic closure, not just the specific liar sentence.**

  3.  **Solutions: Framed as Responses to Closure (20 mins)**
      *   **Tarski's Hierarchy (8 mins)**
          *   **Core Idea:** Semantic Closure is impossible/dangerous. We need *levels*: Object Language (OL) talks about the world. Meta-Language (ML) talks about OL truth. Meta-Meta-Language (MML) talks about ML truth, etc. Truth is *always* at a higher level.
          *   **Card Game Analogy:** Card L ("I am False") is *illegal*. It tries to be in OL and use ML truth. You'd need Card L in ML saying "The OL sentence 'L is False' is...". But then *that* ML sentence can't talk about *its own* truth. Only MML can call *it* true/false.
          *   **Block Misconception (Do this NOW):** "Is Tarski just being pedantic? NO! He diagnosed the *structural flaw* (Semantic Closure) and built a system *without* it. The levels aren't arbitrary; they prevent the paradox-generating loop. The cost: No single, all-encompassing truth predicate for our language."
      *   **Deflationism (6 mins)**
          *   **Core Idea:** "True" isn't a deep, substantive property; it's just a device for indirect assertion or generalization. "Snow is white" is true = Snow is white. The Liar exposes a *logical* problem, not a deep metaphysical mystery about truth.
          *   **Card Game Analogy:** Maybe the problem isn't with truth itself, but with how we *use* the truth predicate in self-referential ways. The rules of the game (logic) need adjustment, not the concept of the "Truth Card".
          *   **Block Misconception (Do this NOW):** "Do deflationists just deny the paradox? NO! They accept it as a genuine logical problem. Their claim is that truth *itself* isn't a complex 'thing' causing the problem; the problem arises from how we *employ* the truth predicate within the logical system. They often *reject* the need for Semantic Closure as defined."
      *   **Paraconsistency (Teaser - 6 mins)**
          *   **Core Idea:** Maybe we can tolerate *some* contradictions without logical explosion ("anything follows"). We change the underlying logic (reject *Ex Falso Quodlibet*) so the Liar sentence can be both True *and* False (a "dialetheia") without trivializing everything.
          *   **Card Game Analogy:** Change the rules! Maybe Card L *can* be marked as both True *and* False without destroying the whole game. Other cards can still behave normally.
          *   **Point:** Radically different approach – embraces the contradiction but contains it logically.

  4.  **Wrap-up: Framing Revisited & Takeaways (5 mins)**
      *   Reiterate the core tension: **Expressive Completeness** (We want to talk about everything, including truth!) vs. **Semantic Closure** (Having a single truth predicate applying to *all* sentences, including those using it, leads to paradox).
      *   Solutions differ by sacrificing one or the other or changing the rules:
          *   *Tarski:* Sacrifices Semantic Closure (levels).
          *   *Deflationism:* Sacrifices the *need* for Semantic Closure (truth isn't *that* kind of property).
          *   *Paraconsistency:* Sacrifices classical logic (allows true contradictions).
      *   **Final Check:** "If we *only* allow the Truth Card to talk about sentences that *don't* use the Truth Card vocabulary, which solution does that align with?" (Tarski) – Tests grasp of core structural fix.

  **What to Explicitly Skip:**

  *   "We're skipping the technical details of Gödel numbering (how sentences get numbers to talk about themselves formally)."
  *   "We're skipping full formal semantics – we're focusing on the big conceptual picture and the structural problem."
  *   "We're not diving deep into specific paraconsistent logics (LP, FDE, etc.), just the core idea."

  **Why this order works:**

  1.  **Card Game:** Builds intuition *before* the paradox, makes self-reference concrete (via the "Truth Card"), shows it's structural.
  2.  **Parodox:** Feels inevitable because the tools (Expressive Need -> Truth Card) were just introduced *to solve a problem*, and the Liar is the first natural attempt to use it fully (self-applying).
  3.  **Solutions:** Presented as *responses* to the revealed structural flaw (Semantic Closure). Misconceptions are blocked *immediately* when introducing each solution.
  4.  **Framing:** The Expressive Completeness/Semantic Closure tension is introduced *through* the card game build-up ("We need to talk about truth!" -> "Uh oh, we talked *too much* about truth!"). It's simple enough and drives the entire narrative. Solutions are easily mapped onto it.
  5.  **Checks:** Focus on *why* self-reference bans fail (indirect loops) and the Tarski-level restriction check target the structural understanding, not just the paradox itself.
