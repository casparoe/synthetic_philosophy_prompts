  We are considering the Frege-Geach problem for pure expressivism (which holds that moral sentences express only non-cognitive attitudes without any descriptive content). The problem is about how to account for the meaning of moral terms when they appear in embedded contexts (like conditionals, negations, etc.) without collapsing into cognitivism (which says moral sentences express beliefs that can be true or false) and without abandoning classical logic.

  First, I will brainstorm the main moves available to the expressivist:

  1. **Pure Attitude-Expression (Traditional Expressivism)**: The idea is that moral sentences express non-cognitive attitudes (e.g., "Stealing is wrong" expresses disapproval of stealing). But in embedded contexts (e.g., "If stealing is wrong, then..."), the attitude is not expressed. So, what is the meaning of the embedded clause? This move stalls because it cannot explain the validity of arguments with embedded moral sentences (like modus ponens) without assigning truth-apt content.

  2. **Hybrid Belief-Desire Pairs**: This approach adds descriptive content to the moral sentence. For instance, a moral sentence might express both a belief (about a natural property) and a non-cognitive attitude. But then the non-cognitive part might not embed in the same way, and the account risks collapsing into a form of cognitivism (because the belief component is truth-apt). The challenge is to keep the non-cognitive element central.

  3. **Plan-Expressing Semantics (e.g., Gibbard's Norm-Expressivism)**: Gibbard treats moral judgments as expressing plans or norms. He uses a possible worlds semantics where the meaning of a moral sentence is tied to the hyperplan (a complete system of norms) that the speaker endorses. This can handle embeddings by considering the consistency of plans across different worlds. However, this might require a non-classical logic or a complex semantics that is not straightforwardly compatible with classical logic.

  4. **Non-Classical Logical Treatments**: The expressivist might abandon classical logic for moral discourse. For example, they might use a three-valued logic or a different consequence relation. But this is a significant cost because it requires changing the logic we use in ordinary contexts when moral terms are involved. It also might make moral arguments invalid in classical terms, which is counterintuitive.

  Now, the question is: what is my credence (0-1) that pure expressivism (without any descriptive content) can survive the Frege-Geach problem without collapsing into cognitivism and without abandoning classical logic?

  I will decompose the reasoning into four factors:

  1. **The probability that the Frege-Geach problem is genuinely fatal rather than an artifact of an overly rigid semantic model.**  
     Justification: If the problem is just an artifact, then expressivism might have a way out. However, the problem has persisted for decades and many see it as a fundamental challenge. I think it's likely fatal.  
     Probability: 0.2 (only a 20% chance it's an artifact)

  2. **The probability that hybrid accounts genuinely preserve non-cognitivism rather than smuggling in descriptive content.**  
     Justification: Hybrid accounts often introduce a descriptive element to handle embeddings, which then takes over the semantic role. It's hard to see how they avoid becoming cognitivist.  
     Probability: 0.3 (only 30% chance they preserve non-cognitivism)

  3. **The probability that adopting a non-bivalent or non-classical logic for embedded moral sentences is a defensible price for pure expressivists.**  
     Justification: Abandoning classical logic is a heavy cost. It complicates reasoning and might require a revision of logic in mixed contexts. It's not clear that expressivists can motivate this without undermining the project.  
     Probability: 0.1 (only 10% chance it's defensible)

  4. **The probability that a constructed "procedural-embedding" variant (like institutional rules) creates a residual difficulty that even hybrid accounts fail to resolve.**  
     Justification: Even if hybrid accounts work for simple conditionals, they might struggle with embeddings in institutional contexts (e.g., legal rules) which seem to require truth-aptness for the embedded clause. This might be a further hurdle.  
     Probability: 0.7 (70% chance of residual difficulty)

  Now, I need to combine these probabilities. Since these factors are interdependent and all must be overcome for pure expressivism to survive, I should multiply the probabilities that each hurdle is overcome. But note: factor 1 is about the problem being fatal, so the chance that it is not fatal (i.e., that it is an artifact) is 0.2. Factor 2: chance that hybrid accounts preserve non-cognitivism is 0.3. Factor 3: chance that non-classical logic is defensible is 0.1. Factor 4: chance that there is a residual difficulty (which would be a problem) is 0.7, so the chance that there is no residual difficulty (i.e., hybrid accounts can resolve it) is 0.3.

