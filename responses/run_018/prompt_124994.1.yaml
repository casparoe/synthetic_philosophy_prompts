  Breaking down the structure: One side (computationalists) focuses on causal-informational chains leading to reference. The other side (phenomenologists) demands phenomenal experience for meaning. The embodied cognition group might be in the middle, emphasizing the body's role but possibly still needing experience. So, the core issue is conflating two questions: semantic grounding (reference) and phenomenal understanding (conscious experience).

