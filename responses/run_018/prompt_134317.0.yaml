answer: |-
  This is a fascinating and perceptively identified pattern that cuts to the heart of theory confirmation, observation, and conceptual change. While it touches on several established concepts, it represents a **distinct phenomenon** deserving its own label. I propose calling it the **Evidential Redescription Effect (ERE)**.

  Here's a precise definition, its relation to adjacent concepts, and its boundaries:

  **Evidential Redescription Effect (ERE):**
  *   **Core Phenomenon:** A shift in the perceived confirmatory power of an existing dataset (D) for a new theory (T2) relative to an established theory (T1), arising *primarily* from T2's conceptual reframing of a specific feature (F) within D – from being dismissed as "noise" or "artifact" under T1 to being embraced as "signal" or "core evidence" under T2 – *without* T2 demonstrably providing novel predictive success over T1 concerning D (when described in a shared observational vocabulary).
  *   **Key Mechanism:** Confirmation hinges on a *change in the taxonomy of evidence* – what counts as meaningful data versus irrelevant background – driven by the theoretical framework itself. The "evidence" (F) was physically recorded but not considered evidentially significant for the phenomenon under T1; T2 grants it evidential significance.
  *   **Source of Perceived Confirmation:** T2 is seen as providing a more *explanatorily adequate* or *conceptually satisfying* account of the *entirety* of D, specifically by integrating F as a central component rather than an anomaly to be explained away. The confirmation is often framed in terms of T2 "making sense of" or "accounting for" F in a way T1 supposedly could not.

  **Relation to Established Concepts & Distinctions:**

  1.  **Problem of Old Evidence (Glymour, etc.):**
      *   **Similarity:** Both deal with evidence known prior to a theory's formulation being used to confirm it.
      *   **Difference:** The core PoOE problem is *temporal and logical*: How can known evidence raise the probability of a theory formulated with that evidence in mind? ERE is *conceptual and semantic*: The *evidential status* of a specific component (F) of the data changes *because* of the new theory's descriptive framework. The problem isn't the timing, but the *reclassification* of part of D from non-evidence to evidence. ERE often *utilizes* the PoOE (how can this *old* F confirm T2?), but its distinctiveness lies in the mechanism of reclassification.

  2.  **Predictive vs. Explanatory Confirmation:**
      *   **Similarity:** ERE leans heavily towards *explanatory* confirmation. T2 is valued for integrating F meaningfully into its explanatory structure.
      *   **Difference:** Standard explanatory confirmation might involve T2 explaining *why* D occurred *in addition to* predicting it, or explaining *more aspects* of D. In ERE, the key point is that T2 doesn't necessarily predict *novel, unexpected* aspects of D better than T1 *in the original observational language*. The shift is in the *interpretive weight* given to F. The "prediction" is retrospective: T2 predicts that F *should be* part of the core signal if T2 is true, whereas T1 predicted it should be minimized as noise. But this "prediction" only becomes evident *after* the conceptual shift.

  3.  **Theory-Ladenness of Observation (Hanson, Kuhn, Feyerabend):**
      *   **Similarity:** ERE is a *direct consequence and powerful illustration* of theory-ladenness. What an observer sees as "signal" (F) is fundamentally dependent on the theoretical framework (T1 vs T2) they employ. Observation reports are not neutral.
      *   **Difference:** Theory-ladenness is a broad thesis about perception and categorization. ERE is a specific *epistemic consequence* of theory-ladenness applied to confirmation: the *evidential significance* of an observation shifts dramatically with theoretical change, leading to claims of confirmation based on reclassified old data.

  4.  **Underdetermination of Theory by Data (Quine, Duhem):**
      *   **Similarity:** Both highlight that data alone cannot uniquely determine theory choice. ERE shows a specific mechanism *within* underdetermination.
      *   **Difference:** Standard underdetermination emphasizes that multiple theories can be compatible with the *same* data set. ERE involves a *reinterpretation* of what the data set *is* or *means* at a fundamental level (signal vs. noise). The theories might be empirically equivalent *only if* F is agreed to be noise *or* only if F is agreed to be signal, but they differ precisely on the status of F. It's less about fitting the same data points and more about redefining which points count as data for the phenomenon.

  5.  **Auxiliary Hypothesis Adjustments / Immunization Strategies (Lakatos, Popper):**
      *   **Similarity:** Both T1 and T2 rely on auxiliaries. T1 uses auxiliaries (about measurement error, noise sources) to explain away F.
      *   **Difference:** Standard auxiliary adjustments modify background assumptions (e.g., calibration constants, error models) to protect a core theory from falsification by an anomaly. In ERE, T2 does not merely *adjust* auxiliaries *within* T1's framework to save it from F; it *replaces the core framework* in a way that fundamentally *redefines F as not-an-anomaly-at-all* but as the key phenomenon. It's a paradigmatic shift, not an immunization tactic within a paradigm. T2's core directly *incorporates* F.

  **Boundary Conditions & What ERE is NOT:**

  *   **ERE IS:** Characterized by a *conceptual reclassification* of a specific feature (F) within existing data (D) from noise/artifact to core signal.
  *   **ERE IS:** Driven by the *explanatory structure* of the new theory (T2) which makes F central.
  *   **ERE IS:** Manifested as claims that *old data (D) confirms T2* specifically because T2 "accounts for" F.
  *   **ERE IS NOT:** Primarily about T2 making *novel predictions* that T1 fails to make and which are subsequently confirmed (though T2 might make novel predictions *elsewhere*). The claimed confirmation *for D* stems from the redescription.
  *   **ERE IS NOT:** Merely an adjustment of auxiliary hypotheses *within the same theoretical framework* to accommodate an anomaly. It involves a shift to a framework where the anomaly is no longer anomalous.
  *   **ERE IS NOT:** The standard Problem of Old Evidence, which focuses on the temporal/logical puzzle, not the semantic reclassification.
  *   **ERE IS NOT:** A case where T1 *failed* to predict F and T2 successfully predicted it *as a new phenomenon*. In ERE, F was *observed* but *dismissed* under T1; it wasn't a failed prediction, it was a disregarded observation.
  *   **ERE IS NOT:** Necessarily irrational or unscientific. Reclassifying noise as signal based on a new theoretical insight can be a valid scientific advance. However, it raises significant challenges for purely Bayesian or predictive accounts of confirmation.

  **Why "Evidential Redescription Effect" (ERE)?**

  *   **Evidential:** Focuses on the change in *evidential status* of F.
  *   **Redescription:** Captures the core mechanism – F is *described differently* (as signal, not noise) within T2's conceptual scheme.
  *   **Effect:** Highlights that this redescription *causes* a perceived shift in confirmatory power for the *old dataset* D regarding T2.

  **The Bayesian Challenge:**

  ERE poses a profound challenge for simple Bayesian confirmation. If D (including F) was equally probable under both T1 (with its noise model) and T2 *before* the redescription, then P(D|T1) ≈ P(D|T2), and D doesn't confirm T2 over T1. The confirmation arises only *after* accepting T2's *redescription* of D, where F is now "signal-D" (call it D*). Now, P(D*|T2) >> P(D*|T1). But this requires accepting the new descriptive vocabulary *first*, which seems to presuppose the theory it confirms. This creates a circularity or highlights the role of prior conceptual commitments that Bayes struggles to formalize cleanly. It suggests that confirmation often involves a gestalt shift in *what is being conditioned upon*, not just updating probabilities within a fixed descriptive framework.

  **Conclusion:**

  The Evidential Redescription Effect (ERE) is a distinct and crucial phenomenon in scientific confirmation. It arises when a new theory achieves perceived confirmation from old data not through superior prediction, but by fundamentally reclassifying what parts of that data constitute meaningful evidence versus irrelevant background, based on its novel conceptual framework. It sits at the intersection of the theory-ladenness of observation, explanatory vs. predictive confirmation, and the problem of old evidence, but its core mechanism – the semantic shift in evidential taxonomy – sets it apart and warrants its own label and analysis. Your psychological and cosmological examples are perfect illustrations of ERE in action.
