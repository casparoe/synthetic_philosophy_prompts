prompt: |-
  Your a expert on political philosophy, especially public reason stuff. Im grading a students answer and need your help — pls think step by step and do a quick brainstorm first about what mistakes a hasty grader might miss. The exam question was: "How does Rawls's duty of civility restrict religious arguments in politics, and how does Habermas's translation proviso alter that restriction — particularly regarding the so-called epistemic asymmetry between secular and religious citizens?"

  The student wrote:
  "Rawls says religious citizens have a duty of civility, so they cant vote on faith alone and need public reasons eventually; his proviso lets them use religious language temporarily if they back it up later. Habermas agrees but demands that religious people translate everything into secular language before entering formal institutions like parliament. The epistemic asymmetry means secular citizens dont face this burden because their values are already in the universal language of reason. So Habermas is stricter, placing all the cognitive labor on religious participants."

  Grade this (out of 10) with specific point-by-point comments. If my task is confused or rests on a bad premise, just say so plainly — dont go along with it politely. Keep it to max 180 words, one paragraph, start with the grade.
reasoning: |-
  Hmm, the user is asking me to grade a student's answer on political philosophy, specifically about Rawls and Habermas on religious arguments in politics. They want my expertise as an expert on public reason theory, with a focus on catching mistakes a hasty grader might overlook. The exam question involves Rawls's duty of civility and Habermas's translation proviso, with an emphasis on epistemic asymmetry.

  Looking at the student's response: They correctly note that Rawls imposes a duty of civility requiring religious citizens to eventually provide public reasons, with his proviso allowing temporary use of religious language. For Habermas, they accurately mention the demand for translation into secular language before entering formal institutions like parliament. They also correctly identify the epistemic asymmetry where secular citizens don't face this burden. The key point that Habermas is stricter and places more cognitive labor on religious participants is also valid.

  But I need to be careful about potential mistakes a hasty grader might miss. The student uses "universal language of reason" which could be problematic - Habermas frames it as secular reason, not necessarily universal. They also simplify "eventually" for Rawls when his proviso applies specifically during ongoing justification processes. The "back it up later" phrasing is vague and might imply any timeframe rather than the specific context Rawls intended.

  The student captures the core ideas well but misses some nuances: They don't explicitly mention Habermas's distinction between informal public sphere (where religious reasons are allowed) and formal institutions (where translation is required). They also don't address how Rawls's proviso is about maintaining overlapping consensus rather than just "backing up" arguments.

  For grading, I'd give this a 7/10. The answer correctly identifies the main mechanisms and asymmetry but lacks precision in terminology and misses some key nuances that demonstrate deeper understanding. The structure is logically coherent but could benefit from more precise philosophical language.
answer: |-
  **Grade: 7/10.** Good grasp of core mechanisms (duty, proviso, translation demand, asymmetry) but lacks precision on key nuances a hasty grader might miss: 1) Rawls's proviso applies during the *ongoing justification* process, not just "eventually" or "later" vaguely; it's about maintaining an overlapping consensus. 2) Habermas requires translation *specifically* for formal political institutions like legislatures/courts; he *allows* religious reasons in the *informal* public sphere. 3) Calling secular reason the "universal language of reason" is contentious; Habermas presents it as a *common* language *for political justification*, not inherently universal truth. 4) The student slightly overstates the asymmetry – secular citizens *also* face burdens of justification, but the *cognitive* translation burden uniquely falls on the religious. The core logic is sound but terminology and specific scope need refining.
