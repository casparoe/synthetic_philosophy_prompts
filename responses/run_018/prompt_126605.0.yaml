  Okay, the user is diving into the Doctrine of Double Effect (DDE) from Aquinas, specifically about self-defense, and then applying it to self-driving cars. They’re not in academia, so I need to keep it accessible but still precise. They’re asking two main things: first, whether "not intending" in Aquinas means actively wanting the good outcome or just not wanting the bad one. Second, whether an algorithm in a self-driving car can "intend" anything in a way that fits DDE.  

  Hmm, let me start by recalling Aquinas’s original text. In Summa Theologiae II-II, Q64, A7, he says killing an aggressor in self-defense is permissible if the intention is self-preservation, not killing, and the force isn’t disproportionate. The key is the act’s moral structure: good intention, bad effect not intended, proportionality.  

  For the first question: Aquinas is clear that you must intend the good (saving your life) and merely foresee the bad (the aggressor’s death). It’s not enough to just avoid wanting the bad; you have to positively will the good. The death is a side effect. But here’s where it gets fuzzy—some scholars argue that if you foresee the death as certain, can you really say you don’t intend it? Aquinas says yes, as long as it’s not your goal.  

  Now for the twist: self-driving cars. User is spot-on to question whether algorithms can "intend." Intention in philosophy requires consciousness, goals, mental states—things algorithms lack. So strictly speaking, DDE might not apply to code because there’s no "mind" to form intentions. But maybe we can stretch it by talking about the programmer’s or user’s intentions, or the system’s design purpose. Still, that’s contested.  

  I should also flag the contested parts. For Aquinas, scholars debate how strictly to interpret "intention"—is it psychological (what you’re thinking) or objective (what the act implies)? And for algorithms, there’s no consensus. Some ethicists argue we can model "as-if" intentions in AI systems, but others say that’s a category error.  

  User seems sharp—they’re not just rehashing trolley problem basics but pushing into the weeds of intention and modern tech. Their underlying worry might be: can old moral frameworks handle AI? I’ll need to acknowledge that while Aquinas gives tools, applying them to algorithms is messy and unresolved.  

  Proportionality matters too. Aquinas insists force can’t be excessive. For self-driving cars, that might mean programming trade-offs (e.g., swerving only if the one person isn’t a child or something). But again, code can’t "judge" proportionality; it’s predefined.  

  Final thought: User might also be hinting at moral responsibility. If the car "decides," who bears the intention? The coder? The company? The passenger? That’s a whole other layer. I’ll weave that in subtly without derailing the focus on DDE.
answer: |-
  Let's dissect your Aquinas question and its AI twist rigorously. As a scholar specializing in Thomistic ethics and applied philosophy, I'll first outline the settled framework, then unpack the core ambiguities (highlighted **🔍 CONTESTED 🔍**), and finally address your algorithmic challenge.

  ---

  ### **1. Aquinas' Core Framework in *Summa Theologiae* II-II, Q64, A7**
  **Settled Doctrine:**
  - **Permissible Killing in Self-Defense:** Aquinas permits killing an aggressor *only if*:
    - **(a)** Your *intention* is solely self-preservation (good effect).
    - **(b)** The aggressor's death is *not intended* but merely *foreseen* as a side effect (*praeter intentionem*).
    - **(c)** The force used is *proportionate* (no "excessive violence").
  - **Key Quote:** *"The act of self-defense may have two effects: one, the saving of one's life; the other, the slaying of the aggressor. [...] Therefore, this act, since one’s intention is to save one’s own life, is not unlawful."*

  **Your Core Question: What "Not Intending" Requires**
  - **Settled:** Aquinas demands *actively intending the good effect* (self-preservation). Merely *not desiring* the bad effect is insufficient.  
  - **Evidence:** He contrasts licit self-defense with murder by emphasizing the *direction of the will*: "It is *not necessary* for salvation that a man omit the act of self-defense to avoid killing the other, since one is bound to take more care of one's own life than of another's." The good effect must be the *object of the will*.

  **🔍 CONTESTED Interpretation 🔍**
  - **Psychological vs. Moral Intention:** Some scholars (e.g., Elizabeth Anscombe) argue Aquinas requires a *psychological reality*: you must consciously focus on saving yourself while mentally "bracketing" the death. Others (e.g., Joseph Boyle) claim it's a *moral distinction*: even if you foresee death as certain, it's unintended *if not part of your plan's objective*.
  - **Certainty of the Bad Effect:** If death is 99.9% certain (e.g., shooting an unarmed aggressor in the heart), does "not intending" become implausible? Aquinas doesn't resolve this.

  ---

  ### **2. Your Twist: Self-Driving Cars and DDE**
  **The Problem:** DDE traditionally requires a *moral agent* with intentions. Can code, sensors, or statistical models "intend"?

  #### **🔍 DEEPLY CONTESTED: Can Algorithms "Intend"? 🔍**
  - **Thomistic View (Consensus):** No. Aquinas ties intention to the *rational soul* (ST I, Q75). Algorithms lack consciousness, will, or moral reasoning. **DDE cannot directly apply to code.**  
  - **Proxy Approaches (Debated):**  
    - **Programmer's Intention:** The coder's design goal (e.g., "minimize total harm") *might* satisfy DDE's "good intention" requirement. But is this *the car's* intention? No—it's extrinsic.  
    - **System Teleology:** Some (e.g., John Tasioulas) argue AI systems have *functional purposes* (e.g., collision avoidance). If the system's purpose is "save the five" (good), and killing one is a *foreseen but unintended* outcome, DDE *might* analogously apply. Critics (e.g., Helen Frowe) reject this as anthropomorphism.  
    - **Act Description:** Does the car "swerve to avoid five" (good intention) or "kill one to save five" (bad intention)? DDE hinges on this description, but algorithms lack the capacity to *frame* acts morally.

  #### **Proportionality in Algorithms**
  - **Settled:** Aquinas requires force to be proportionate (e.g., don't nuke a pickpocket).  
  - **Algorithmic Challenge:** How to encode "disproportionate force"?  
    - If the car kills one healthy adult to save five seniors, is that proportionate?  
    - If it kills a pedestrian to save passengers, is that "self-defense"? (Likely not—passengers *assumed risk* by entering the vehicle.)  
  - **No Consensus:** Programmers must hardcode trade-offs (e.g., "minimize expected loss of life"), but Aquinas' proportionality is *qualitative* (e.g., "innocence of the one"), not utilitarian math.

  ---

  ### **3. The Trolley Problem Nuance**
  Unlike standard summaries, Aquinas' DDE adds two layers:
  - **Intrinsic vs. Extrinsic Good:** Swerving isn't *inherently* evil (unlike murder), so DDE's first condition (act must be good/neutral) is met.  
  - **Direct vs. Indirect Causation:** Aquinas might view killing the one as *indirect* (like self-defense), while *pushing* someone onto the tracks would be direct harm—intrinsically evil.

  ---

  ### **Synthesis: Your Car Scenario**
  1. **Intention Problem:** The car has *no intentions*. At best, the *programmer* intends "save lives overall." If this is framed as "save the five" (good) with "one death foreseen but unintended," DDE *might* apply *by analogy* to the programmer's moral responsibility.  
  2. **Proportionality Problem:** If the one killed is a child vs. five elderly, hardcoded utilitarianism may violate Aquinas' qualitative balance.  
  3. **🔍 Unresolved Meta-Question 🔍:** Can DDE govern *system design* rather than *real-time acts*? Aquinas never imagined automated decisions.

  **Scholarly Recommendation:** Read Germain Grisez (*Beyond the New Theism*, 1975) on "intention" as a *chosen proposal*, and Patrick Lin's "Why Ethics Matters for Autonomous Cars" (2015) for applied debates. The algorithmic intention question remains philosophy's next frontier—no settled view exists.
