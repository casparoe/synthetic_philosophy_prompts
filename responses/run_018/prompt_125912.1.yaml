prompt: |-
  I'm running a small online forum where people argue about ethics and weird hypotheticals, and I keep seeing the same trick: someone tells a little story, asks "what would you do?", then claims they've proved something huge about morality or identity. I want a reusable decision procedure I can run in about five minutes — I have no philosophy degree, I do this maybe twice a week, and I have to post my verdict publicly so I can't hide behind jargon — to check whether one of these intuition pumps (those little stories philosophers use) is actually doing honest philosophical work or just pushing my buttons. You are an expert in argument analysis and intuition pumps; please think carefully, start with a brief brainstorm of the main ways these pumps mislead, then write me the tool.

  The deliverable should be an ordered checklist: the exact question at each step, what counts as a sufficient answer, the hard stop where I say "this pump is broken — don't use it," and the points where I must hand the decision to a person because it's a value judgement not a fact check. It must cover hidden variables being twisted without notice, emotional loading that drives the answer, and the "ghost knob" problem — that's my own idea for a framing detail being treated as essential when it's really accidental. Show me exactly how to spot a ghost knob and flip it.

  Then apply the procedure to three cases:
  1. The burnt portrait: a painter spends ten years on a work, then on the final day burns it because she decides it's awful. Someone uses this to prove only the outcome matters, not the process.
  2. The footbridge trolley case: pushing one person off a bridge to stop a train and save five.
  3. Pick one more case yourself, but make it one where your procedure rejects the pump even though the conclusion feels right to me — I want to see an answer I won't like.

  Finally, say clearly what this procedure can't do, flag the judgement-call zones honestly, and write everything in British English. Don't ask me for citations, reading lists, or bibliographies — I just need the operational tool. There's definatly a typo or two in this prompt; please ignore them and just answer.
reasoning: |-
  Hmm, the user runs a small online forum where people argue about ethics and hypotheticals. They've noticed a pattern where someone tells a story, asks "what would you do?", and then claims it proves something big about morality. They need a practical, reusable tool to evaluate these "intuition pumps" - little stories used in philosophy.

  The user wants a checklist they can run in about five minutes without any philosophy background. It should help them determine if an intuition pump is doing honest work or just manipulating emotions. They specifically mention three issues: hidden variables being twisted, emotional loading, and what they call the "ghost knob" problem - where a framing detail is treated as essential when it's accidental.

  Key requirements include:
  - Ordered checklist with exact questions
  - Clear criteria for sufficient answers
  - Hard stops where the pump is deemed broken
  - Points where human judgment is needed
  - Must cover hidden variables, emotional loading, and ghost knobs
  - Need to show how to spot and flip ghost knobs
  - Apply to three cases including their burnt portrait and footbridge trolley examples
  - Include one case where the procedure rejects the pump even if conclusion feels right
  - Clearly state limitations and judgment zones
  - Use British English
  - No citations or reading lists

  For the checklist, I need to design something that's both structured and practical. I'll start with a brief brainstorm of how intuition pumps mislead:
  - Oversimplification (reducing complex issues to binary choices)
  - Emotional manipulation (using loaded language or scenarios)
  - Hidden variables (concealing relevant factors)
  - False equivalence (treating dissimilar situations as identical)
  - Ghost knobs (framing details presented as essential)
  - False dilemmas (presenting only two options when more exist)
  - Motive laundering (using stories to smuggle in controversial premises)
  - Conflation errors (blurring distinct concepts)

  The checklist should flow logically: start with setup clarity, then move to emotional manipulation, hidden variables, ghost knobs, and finally argument structure. For each step, I'll specify the question, what counts as sufficient, and any hard stops.

  For the applications:
  1. Burnt Portrait case - this fails early due to emotional loading and ghost knobs
  2. Footbridge Trolley - this passes most checks but requires human judgment on value weighting
  3. I'll add the Transplant Case (killing one healthy person to save five) - this fails due to hidden variables and ghost knobs, even though the utilitarian conclusion might feel right

  Finally, I need to clearly outline what the tool can't do (like resolve fundamental value disputes) and be honest about judgment zones. Everything will be in British English as requested, ignoring any typos in the prompt.
answer: |-
  Here's your operational "Intuition Pump Inspector" checklist, designed for 5-minute forum moderation. It identifies **four hard stops** (🚫) where the pump is fundamentally broken, and **three judgement zones** (⚖️) requiring human input. Written in British English per your request.

  ---

  ### The Intuition Pump Inspector: A 5-Minute Checklist

  **Step 1: Clarity Check**
  *   **Question:** "Is the scenario described with neutral, unambiguous language? Are key terms (e.g., 'harm', 'identity', 'matters') clearly defined within the pump itself?"
  *   **Sufficient Answer:** Yes, if the story uses plain language without obvious bias or undefined jargon. No technical definitions needed if common sense applies.
  *   **Hard Stop?** 🚫 **YES** if the language is so vague, emotionally loaded, or undefined that the scenario's meaning is fundamentally unclear (e.g., "evil act", "true self" used without context).
  *   **Judgement?** ⚖️ Minor ambiguity might be tolerable if the core dilemma is clear.

  **Step 2: Emotional Loading Scan**
  *   **Question:** "Does the story rely on visceral disgust, extreme suffering (especially of innocents/vulnerables), sacred values, or graphic details *unnecessary* for the core ethical question?"
  *   **Sufficient Answer:** Identify *any* element designed purely to provoke revulsion, horror, or outrage (e.g., "torturing a kitten", "desecrating a grave"). Flag it.
  *   **Hard Stop?** 🚫 **YES** if the emotional element is the *primary driver* of the "obvious" answer, and removing it significantly weakens the intuition or makes the conclusion seem absurd.
  *   **Judgement?** ⚖️ Assessing *how much* the emotion drives the answer vs. illustrating the dilemma.

  **Step 3: Hidden Variables Hunt**
  *   **Question:** "What crucial context might be missing? Are background assumptions (about motives, consequences, rules, society) silently baked in *and* potentially controversial?"
  *   **Sufficient Answer:** List 1-3 plausible, relevant factors *not* mentioned (e.g., long-term effects, character history, societal norms, alternative options, uncertainty).
  *   **Hard Stop?** 🚫 **YES** if changing a hidden variable *plausibly flips the intuitive answer* and the argument treats its own assumption as the only possibility.
  *   **Judgement?** ⚖️ Determining which hidden variables are *most relevant* to the claim being made.

  **Step 4: Ghost Knob Identification & Flip Test**
  *   **Question:** "Identify a specific, vivid detail in the framing. Is this detail treated as *essential* to the moral dilemma? Now, mentally change or remove it. Does the core dilemma collapse, or does it remain intact with the same intuitive force?"
  *   **Sufficient Answer:** Pinpoint a detail (e.g., "burning", "pushing", "family member"). The Flip Test passes if changing it (e.g., "shredding", "pulling a lever", "stranger") leaves the *core ethical tension* fundamentally unchanged.
  *   **Hard Stop?** 🚫 **YES** if the changed scenario *routinely* generates a *different* intuitive answer *and* the original detail was crucial to the author's conclusion. The knob is ghostly.
  *   **Judgement?** ⚖️ Assessing whether the change *genuinely* alters the ethical core or just superficial perception.

  **Step 5: Conclusion Leap Test**
  *   **Question:** "Does the author's stated conclusion *actually follow* from the intuition about this specific scenario? Or does it make a much broader, unsupported claim (e.g., 'this proves ALL morality is X', 'this shows process NEVER matters')?"
  *   **Sufficient Answer:** The leap is invalid if the conclusion is vastly broader than the scenario supports or ignores plausible alternative explanations for the intuition.
  *   **Hard Stop?** 🚫 **YES** if the conclusion is a gross overgeneralisation not justified by the single case presented.
  *   **Judgement?** ⚖️ Determining the *reasonable scope* of the conclusion (e.g., "suggests outcomes *can* outweigh process" is weaker than "proves *only* outcomes matter").

  **Final Verdict:**
  *   **Pass:** Proceed with discussion, but flag any judgement zones (⚖️) as points of legitimate debate.
  *   **Fail (Hard Stop Hit):** Pump is broken. Verdict: "**This scenario is flawed as a proof for X. It relies on [state specific failure: e.g., emotional manipulation / a misleading ghost knob / a hidden variable]. Discuss the idea directly instead.**"
  *   **Inconclusive (Judgement Heavy):** Pump isn't *broken*, but its force depends on debatable values/premises (⚖️). Verdict: "**This scenario highlights tension around [state core issue], but reasonable people might weigh the factors differently. It doesn't *prove* X conclusively.**"

  ---

  ### Application to Your Cases

  **1. The Burnt Portrait**
  *   **S1 (Clarity):** Pass. Scenario clear.
  *   **S2 (Emotion):** Pass. Burning art might evoke sadness, but it's not visceral horror central to the point.
  *   **S3 (Hidden Vars):** **HARD STOP 🚫.** Missing variables: *Why* did she burn it? (Sudden clarity? Mental breakdown?) What was the *process value* to *her*? (Catharsis? Perfectionism?) Changing these *flips* the intuition. If she burned it due to psychosis, does that prove outcomes *always* matter most? No.
  *   **Verdict:** **FAIL.** Broken due to hidden variables. Doesn't prove outcomes are *all* that matter. The process clearly mattered immensely *to her* for ten years.

  **2. The Footbridge Trolley Case**
  *   **S1 (Clarity):** Pass. Scenario clear.
  *   **S2 (Emotion):** **Flag.** Pushing someone *personally* vs. pulling a lever is highly emotive (personal force, direct contact). Removing this (e.g., remote lever) *weakens* the "don't push" intuition for many.
  *   **S3 (Hidden Vars):** Pass. Core dilemma is presented (sacrifice 1 vs 5). Common hidden variables (e.g., relationships, uncertainty) don't usually *flip* the core intuition here.
  *   **S4 (Ghost Knob):** **Identify:** "Pushing with your hands". **Flip Test:** Change to "remote trapdoor lever you must pull". For many, the intuition *against* acting weakens significantly. **HARD STOP 🚫?** Not quite. The *personal force* element *is* often argued as ethically relevant (e.g., doctrine of double effect), not *purely* ghostly. It's ⚖️.
  *   **S5 (Conclusion Leap):** **HARD STOP 🚫.** Common conclusion: "This proves utilitarianism is wrong/impractical." This is a massive leap. It *might* show some people find personal force/agency morally significant *beyond* pure outcome counts. It doesn't *disprove* utilitarianism; it highlights a tension within it or suggests other factors matter *too*.
  *   **Verdict:** **FAIL (Conclusion Leap).** Useful for exploring intuitions about personal agency vs. outcomes, but utterly fails as a *proof* against utilitarianism or for any grand moral theory. Flagged Emotion and Ghost Knob (⚖️) show its force relies on specific framing.

  **3. The Transplant Case (Where the Conclusion *Feels* Right but the Pump is Broken)**
  *   **Scenario:** A brilliant surgeon has five patients dying of organ failure (heart, lungs, kidneys, liver). A healthy traveller comes in for a check-up. The surgeon could kill the traveller, harvest their organs, and save the five. Conclusion: "This shows utilitarianism (save five lives) is monstrous and clearly wrong."
  *   **S1 (Clarity):** Pass.
  *   **S2 (Emotion):** **HARD STOP 🚫.** Extreme emotion is central: "killing a healthy innocent", "harvesting organs". Removing this (e.g., "redirect a scarce, unclaimed resource") drastically weakens the anti-utilitarian intuition. The emotion *is* the primary driver.
  *   **S3 (Hidden Vars):** **HARD STOP 🚫.** Critical missing variables: Societal trust in medicine, rule of law, long-term consequences (would anyone visit a doctor?), uncertainty (will the transplants work?), *alternatives* (is there *really* no other way?). Changing these (e.g., post-apocalypse with no society; *certainty* no other options exist) *can* flip the intuition for some.
  *   **S4 (Ghost Knob):** **Identify:** "Doctor killing *their own patient* in *their care*". **Flip Test:** Change to "a corrupt official secretly killing a vagrant to supply organs". The core "kill 1 to save 5" remains, but the intuition against it feels *different* – the original framing exploits trust/sacred duties. It's ghostly *for the specific anti-utilitarian slam*.
  *   **S5 (Conclusion Leap):** **HARD STOP 🚫.** Concludes utilitarianism is "monstrous and wrong". This is a massive overgeneralisation from one highly specific, emotionally charged scenario designed to provoke revulsion. It doesn't address *any* utilitarian responses or nuances.
  *   **Verdict:** **FAIL (Multiple Hard Stops).** This pump is *engineered* to make utilitarianism look appalling using emotion, hidden variables, and ghost knobs. Even if you *agree* killing the traveller is wrong (most do!), the pump is dishonest as a *proof* against utilitarianism. It pushes buttons, not logic.

  ---

  ### What This Procedure Can't Do & Honest Judgement Zones

  *   **Can't Do:**
      *   Resolve fundamental value disputes (e.g., absolute rights vs. maximizing good).
      *   Prove which moral theory is "correct."
      *   Tell you what *is* moral, only if the *argument using the pump* is flawed.
      *   Handle highly technical philosophical arguments requiring specialist knowledge.
      *   Guarantee everyone agrees with your verdict – it identifies flaws, not universal truth.
      *   Replace deep, nuanced ethical discussion for complex real-world issues.
  *   **Judgement Zones (⚖️ - You *Must* Hand to Human Reason):**
      1.  **Severity of Emotional Loading:** How *much* does the emotion drive the answer vs. illustrate the point?
      2.  **Relevance of Hidden Variables:** Which unstated factors are *most significant* for *this specific claim*?
      3.  **Ghost Knob Flip Test:** Does changing *this specific detail* fundamentally destroy the *core ethical dilemma* or just alter its presentation? (Is it truly *accidental* or potentially *relevant*?)
      4.  **Scope of Conclusion:** What is a *reasonable*, limited conclusion the scenario *could* support?

  **Use this tool to call out faulty logic and button-pushing. It won't settle ethics, but it will make your forum arguments sharper and less manipulative.** Good luck moderating the weird hypotheticals!
