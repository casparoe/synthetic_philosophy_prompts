  Now, considering the desiderata. I need to cover: accuracy in cases, distinguishing factors, resolving objectivity vs. pluralism, and a killer criterion against pop-psych. Conflicts might arise between universalist demands and descriptiveness (D1 vs D6), or between corrigibility and robustness (D4 vs D5). 

