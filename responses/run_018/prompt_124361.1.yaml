answer: |-
  Here are the desiderata for your protagonist's moral bias detection framework, designed to handle your specified cases and resolve the core tensions:

  **Core Desiderata:**

  1.  **Case Accuracy (Moral Tourist vs. Exile):** Must distinguish between *conformity without belief* ("Tourist": adopting local norms for convenience/safety without internalizing them as "right") and *principled rejection* ("Exile": rejecting local norms based on consistent, internalized principles, even if unpopular).
  2.  **Case Accuracy (Discounting Pain vs. Hedonic Dislike):** Must distinguish between *discounting moral patienthood* (e.g., denying animal pain has moral significance due to bias against non-humans) and *mere hedonic aversion* (e.g., disliking bitter taste, which involves no claim about *wrongness* or *obligation*).
  3.  **Distinction: Bias vs. Taste:** Must clearly separate *moral judgments* (claims about right/wrong, obligation, value *beyond personal preference*) from *subjective preferences/aesthetic tastes* (claims about personal likes/dislikes devoid of universalizable obligation). Bias pertains only to the former.
  4.  **Distinction: Bias vs. Epistemic Bad Luck:** Must differentiate *systematic distortion* in moral reasoning/perception (bias) from *reasonably held but incorrect beliefs* due to lack of access to relevant facts or flawed but non-distorting reasoning ("epistemic bad luck").
  5.  **Resolves Objectivity/Pluralism Tension:** Must allow for *objective grounding* of moral claims (e.g., suffering is *genuinely* bad, fairness is *genuinely* relevant) while permitting *legitimate variance in weighting* core values (e.g., prioritizing liberty over equality, or vice versa, without either position being inherently *biased*). The framework defines bias *within* a plausible objective grounding.
  6.  **Descriptive/Universal Balance:** Must be sensitive to the *descriptive reality* of diverse moral frameworks across cultures/individuals without collapsing into relativism. It should explain *why* some frameworks are biased distortions of shared core values or reasoning processes, while others are legitimate interpretations or weightings.
  7.  **Pop-Psych Killer (Anti-Reductionism):** **The key requirement that kills most pop-psych explanations is: *The framework must account for the role of reasons and justification in moral judgment, not merely causal origins.*** Pop psych (e.g., "it's just evolution/biology/tribalism") often *reduces* moral disagreement to non-moral causes, dismissing the justificatory space. The framework must show *how* such causes can *distort* reason-giving and justification (making them biased) rather than *eliminate* the validity of reasoning itself.

  **Flagged Potential Tensions (Jointly Unsatisfiable Pairs?):**

  *   **D5 (Objectivity/Pluralism) & D6 (Descriptive/Universal Balance):** Can a theory be both *sensitive* to wildly diverse descriptive moralities *and* maintain a strong enough notion of objectivity/universal core to reliably call some views "biased"? *(Resolution often lies in procedural objectivity or thin universal values)*.
  *   **D4 (Bias vs. Bad Luck) & D7 (Anti-Reductionism):** Demanding robust *reasons* (D7) might make it harder to exonerate someone with "bad luck" (D4) who had bad *reasons* based on limited info, as their reasoning might still be flawed. *(Resolution: Focus on whether reasoning *process* was appropriately responsive to *available* evidence/values, not just outcome)*.
  *   **D1 (Tourist/Exile) & D6 (Descriptive/Universal):** How does the framework judge the "Tourist" acting on *external* norms vs. the "Exile" acting on *internal* ones, if the *external* norms are themselves biased according to the framework? Is conformity to biased norms *itself* a form of bias? *(Resolution: Focus on the agent's *reasoning* - the Tourist isn't necessarily endorsing the norm's *validity*, the Exile is actively reasoning against it)*.

  **Key Framework Implications (Implied by Desiderata):**

  *   **Focus on Process & Reasons:** Bias is primarily a property of *how* moral judgments are formed/justified, not solely *what* the judgment is.
  *   **Rejecting Simple Subjectivism:** "It's just my preference" is insufficient for a genuine *moral* claim; the framework requires distinguishing moral assertions from mere taste.
  *   **Rejecting Causal Reductionism:** Explaining the *origin* of a belief (e.g., "evolution made you care about kin") doesn't automatically invalidate its *justification* or prove *bias*.
  *   **Accommodating Reasonable Disagreement:** Legitimate differences in prioritization (value weighting) or interpretation of facts within a shared reasoning space must be possible *without* being labeled biased.
  *   **Bias as Systematic Distortion:** Bias involves patterns of error, motivated reasoning, ignoring relevant evidence/values, or applying principles inconsistently *in ways that serve a non-moral interest or reflect an irrelevant cognitive distortion*.

  This set gives your protagonist a rigorous foundation. Her retort to "you're just biased" becomes: "According to framework [Name], here's *why* this isn't mere preference, bad luck, or legitimate weighting, but a *systematic distortion* in reasoning about [Core Value/Principle], demonstrated by [Inconsistency/Selectivity/Motivation/etc.]." The killer move (D7) forces critics to engage with *reasons*, not just causes. Good luck with the novel (and spelling "desiderata"!)!
