  No bibliography or citation list please -- Ill fill those in myself. Keep it casual; a typo or two is totally fine.

  After the proposal, give me a brief structured summary as JSON with these fields: "core_question", "why_open", "method_phases", "success_criteria", "failure_mode", "scope_check".
