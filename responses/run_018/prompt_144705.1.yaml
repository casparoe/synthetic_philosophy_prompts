prompt: |-
  I'm trying to calibrate where my intuition about phenomenal knowledge actually comes from, so I want a decomposed credence rather than a bare stance. Consider this variant of Mary's room: Mary has complete physical knowledge of chromatic vision, has never seen color, and then receives a direct cortical mapping—functionally identical to seeing crimson—that produces in her the exact neural state associated with crimson experience in normal subjects. However, she introspectively reports the state as feeling like a diffuse warmth at the back of her eyes, not as seeing crimson, and she continues to correctly predict every physical and behavioral output of crimson-vision without using color-language for her own state. What's your credence that, despite the neural identity and predictive mastery, she still lacks knowledge of what it is like to see crimson? Decompose your answer: (1) the probability that phenomenal knowledge requires a specific first-person qualitative character that can be absent even with perfect neural duplication; (2) the probability that her warmth report indicates absence of the phenomenal concept rather than absence of the experience itself; (3) the probability that Jackson's knowledge argument depends on this distinction being non-gradual; (4) the probability that intersubjective neural transfer without matching qualitative report is metaphysically possible at all. Assign a rough number to each term, show how they combine into your final credence, state the final number explicitly, and identify which component is your weakest link—specifically, what kind of empirical finding or philosophical argument would move it the most. If your final number is mostly driven by one term, say so and explain why the others are comparatively inert.
