prompt: |-
  I am drafting a literary novel set in an invented limestone region of rural England, and I have become preoccupied with a structural problem that is also a philosophical one. My protagonist, an architect who has spent fifteen years practicing abroad, returns to her ancestral estate to discover a dry-stone wall—erected sometime in the late eighteenth century—that divides the northern meadow from a village commons. There is no record of its purpose in any deed or survey; the local inhabitants treat its presence as an unspoken charter, yet she intends to demolish it in order to open a sightline for a modernist glass pavilion she hopes to build.

  In conversations with fellow writers, I have begun to frame this wall through two lenses that seem to converge on a single warning. The first is Chesterton's fence: the principle that one should not remove a barrier until one understands why it was placed, precisely because the original reason may have disappeared from living memory while the function remains intact. The second is Burkean conservatism—the view that long-standing practices and boundaries embody a distributed, intergenerational wisdom that no individual rational planner can fully reconstruct or replace. To keep the problem from becoming merely symbolic, I want to inject a specific, hidden mechanism into the narrative: embedded within the wall's foundation is an unwritten covenant governing a shared spring, such that tearing the wall down would not only violate communal custom but would physically alter water rights in a manner that contemporary property law, being silent on the matter, could not remedy. I want to understand what this convergence implies.

  Please describe the most important implications of Burkean conservatism and Chesterton's fence principle for the moral architecture of my protagonist's decision—specifically regarding epistemic humility, the burden of proof for overturning inherited institutions, and the risk of substituting individual rational design for collective, tacit knowledge. I do not want a bibliography, a list of further readings, or citations to specific editions; I want a disciplined conceptual analysis that treats the wall as an active institution carrying both hidden functional weight and moral authority. Please organize your response in British English according to the following sections and approximate lengths: "The Epistemic Burden" (around 150 words); "Prescription and Tacit Knowledge" (around 200 words); "The Hidden Covenant and Unwritten Law" (around 150 words); and "Implications for the Protagonist's Arc" (around 200 words).
