  Dr. Evans scowls at the sludge in his mug. "Frank, this coffee is objectively terrible. Common knowledge among rational chemists."
  Frank adjusts his retirement-party nametag. "Nonsense! The shared prior from decades in *this* lab dictates it's merely suboptimal, not terrible."
  Evans leans in. "You *know* I'm rational about caffeine. And I *know* you know."
  Frank counters, "And you *know* I know you know I'm rational! Our priors are aligned, our rationality common knowledge to infinite regress! Therefore..."
  They stare, locked in recursive certainty. Suddenly, both blurt out simultaneously:
  "...it must be exactly *mediocre*!"
  They sheepishly add creamer, neither disagreeing again.

