prompt: |-
  I'm a staff software engineer with no formal background in philosophy, and I've been asked to write an internal guide for how our engineering organization should make a specific, recurring kind of decision: whether to stay on a technology we are already using, or pay to move to something else. We make this call under pressure — for languages, frameworks, databases, build and CI systems, internal services, data formats, vendors — and right now the two available voices are "that's just the sunk cost fallacy, be rational and switch" and "we're too deep in to change." I've picked up terms like path dependence, lock-in, increasing returns, positive feedback, and contingency from blog posts, but I don't know which of those are rigorous distinctions or how to use them.

  Please act as a professional philosopher and economist of path dependence: someone who can distinguish, for instance, a true self-reinforcing process from a one-time switching cost, and a factual claim about how an outcome came to be from a normative claim about whether we should now escape it. Think carefully, and begin by brainstorming the main distinctions in the field and mapping each onto concrete engineering resources — cumulative team familiarity, tooling written against the old system, runbooks and institutional memory, the hiring market, deprecation risk, contract lock-in, integration surfaces, data migration. Flag the distinctions that have no real engineering counterpart and should be left out, and flag the engineering considerations that are doing the theorist's work under another name.

  The deliverable is a reusable decision procedure, not a one-off recommendation. A senior engineer with no philosophy training should be able to run it in under an hour, so it cannot lean on undefined jargon: any term like increasing returns must be glossed in plain language or dropped. I want it to include, in writing: the questions to ask in order; what counts as a sufficient answer to each; the precise points where the procedure says this consideration is not path dependence and should be handed back to ordinary cost-benefit analysis; the points where it says this is genuinely self-reinforcing and should weigh accordingly; and the steps that are irreducible value judgments — about risk, optionality, and which downstream costs count — that no procedure can make for us. The procedure should enforce the distinction I half-understand from the theory: a sunk cost is gone, while path dependence is about whether the past has changed the future payoff landscape; don't let the guide collapse back into "we spent a lot, so we should keep going."

  Then apply the procedure to three cases, step by step, showing what it would actually output:

  1. A ten-year-old monolith that still works and that most senior engineers know well, but whose tooling, hiring market, and library ecosystem have moved toward smaller services. The main argument for staying is the accumulated familiarity and the cost of a year-long migration.

  2. A homegrown wrapper around our message queue that is hooked into dozens of services, with on-call runbooks and failure modes written around its quirks. A managed queue service would lower per-year operating cost, but the wrapper's integrations and institutional knowledge would have to be rebuilt.

  3. After a merger, we must pick one of two identity and access systems. One is newer and operationally simpler; the other is older but has many more users, integrations, and access policies already attached to it, so the switching burden falls mostly on the larger legacy organization.

  Make at least one of these come out in a way our engineers will not like — for example, the procedure recommends staying with something we were planning to replace, or replacing something people are proud of — to demonstrate that the procedure can override instinct.

  Finish with a short section on what the procedure cannot do: where the theory describes a mechanism but gives no verdict about whether we should stay, and how a team should act differently when the output is "you are locked in, and that is acceptable" versus "you are locked in, and that is costly." I am not looking for a bibliography; I need the concepts made usable without distorting them.
reasoning: |-
  We are designing a decision procedure for technology retention versus migration. The goal is to distinguish sunk costs (irrelevant) from path dependence (relevant) and to account for self-reinforcing mechanisms. We will avoid jargon and use plain language.

  Key Concepts in Plain Language:
  - **Sunk Cost**: Money, time, or effort already spent that cannot be recovered. This should not influence the decision because it's gone regardless.
  - **Path Dependence**: When past choices make some future choices easier or harder. It's about how the current state (shaped by history) affects future costs and benefits.
  - **Switching Cost**: One-time costs (e.g., migration effort, training) to move to a new technology.
  - **Self-Reinforcing Mechanisms (Increasing Returns)**: Processes where using a technology makes it more valuable over time (e.g., more expertise, better tooling, network effects). This can create lock-in.
  - **Lock-in**: A state where switching is very costly because of accumulated dependencies and investments.
  - **Contingency**: The idea that the current state is a result of historical events and might have been different under other circumstances. This helps us recognize that we are where we are, and we must decide from here.

  Engineering Resources (Concrete Factors):
  - Cumulative team familiarity: How well the team knows the technology.
  - Tooling and integrations: Custom tools, scripts, and integrations built around the technology.
  - Runbooks and institutional memory: Documentation and knowledge about operating the technology, especially in failure modes.
  - Hiring market: Availability of engineers with the required skills.
  - Deprecation risk: The risk that the technology becomes unsupported or obsolete.
  - Contract lock-in: Legal or financial contracts that make it costly to leave.
  - Integration surfaces: How many other systems depend on this technology.
  - Data migration: Cost and risk of moving data to a new system.

  Distinctions Without Engineering Counterparts:
  We will avoid overly theoretical distinctions that don't map to concrete factors. For example, abstract notions of "historical contingency" without operational implications are not directly useful. We focus on mechanisms that change the payoff landscape.

  Decision Procedure Outline:
  The procedure is a series of questions. At each step, we either:
  - Conclude that we are not in a path-dependent situation and hand off to ordinary cost-benefit analysis (which includes switching costs as a one-time cost).
  - Identify a self-reinforcing mechanism and weigh it appropriately.

  The procedure must be run in order. It has two main phases:
  1. **Sunk Cost Filter**: Strip out any consideration of past investments that are unrecoverable.
  2. **Path Dependence Assessment**: Evaluate whether the current situation has self-reinforcing properties that make staying more attractive over time, or if the switching costs are one-time and then the new technology would be better.

  Steps of the Procedure:

  1. **Identify the Sunk Costs** (to mentally set them aside):
     - Question: What money, time, or effort have we already spent on the current technology that we cannot recover?
     - Action: Explicitly list these and then disregard them in the rest of the analysis. They are gone and should not influence the decision.

  2. **Assess One-Time Switching Costs**:
     - Question: What one-time costs would we incur to switch? (e.g., migration effort, training, rewriting integrations, data migration)
     - Action: Estimate these costs in time and money. These are real costs of switching and should be included in the cost-benefit analysis.

  3. **Evaluate Self-Reinforcing Mechanisms (Increasing Returns)**:
     - We are looking for factors that make the current technology more valuable the longer we use it, or the new technology less valuable because we are not using it yet. These create lock-in.
     - Questions:
       a. **Network Effects**: Does the value of the technology increase as more people or systems use it? (e.g., more libraries, better community support, larger hiring pool)
          - Engineering counterpart: Library ecosystem, community activity, hiring market.
       b. **Learning by Using**: Does using the technology build expertise that makes us more efficient over time? (e.g., team familiarity, institutional memory, runbooks)
          - Engineering counterpart: Cumulative team familiarity, runbooks, institutional knowledge.
       c. **Complementary Investments**: Have we built tools, integrations, or processes that are specific to this technology? (e.g., custom tooling, integrations with other systems)
          - Engineering counterpart: Tooling written against the system, integration surfaces.
       d. **Scale Economies**: Does the technology get cheaper per unit as we use it more? (e.g., volume discounts, amortized fixed costs)
          - Engineering counterpart: Contract lock-in, volume discounts from vendors.
     - Action: For each mechanism, if present, note how it creates a **continuing benefit of staying** (because we are already benefiting from these) and a **barrier to switching** (because we would lose these benefits and have to rebuild them for the new technology). These are not one-time costs but ongoing advantages of the current path.

  4. **Assess Deprecation Risk and Future Viability**:
     - Question: What is the risk that the current technology becomes obsolete, unsupported, or more expensive in the future? What is the future trajectory of the new technology?
     - Action: This is a forward-looking risk assessment. If the current technology has high deprecation risk, it may offset the benefits of the self-reinforcing mechanisms.

  5. **Irreducible Value Judgments**:
     - At this point, we have:
       - One-time switching costs (from step 2).
       - Ongoing benefits of staying due to self-reinforcing mechanisms (from step 3).
       - Future risks and benefits of both options (from step 4).
     - We must now make value judgments on:
       - **Risk tolerance**: How much do we weight the risk of deprecation versus the risk of migration?
       - **Time horizon**: How far into the future are we planning? (Self-reinforcing mechanisms might have long-term effects.)
       - **Optionality**: Does switching open up future opportunities (e.g., using modern features) or close them (e.g., vendor lock-in)?
       - **Which costs count**: For example, do we count opportunity costs (e.g., engineers not working on new features during migration) as part of the switching cost?

  6. **Decision Framework**:
     - Compare:
       - **Stay**: Ongoing benefits from self-reinforcing mechanisms (if any) minus future risks (e.g., deprecation).
       - **Switch**: Benefits of the new technology (e.g., lower operating costs, better features) minus the one-time switching costs and minus the loss of the ongoing benefits from self-reinforcing mechanisms (if any).
     - If there are no significant self-reinforcing mechanisms, then the decision reduces to ordinary cost-benefit analysis: compare the total cost of staying (including future risks) versus switching (including one-time costs and then the ongoing benefits of the new system).

  7. **Output**:
     - If the self-reinforcing mechanisms are strong and the future risks of staying are low, then staying is likely rational despite switching costs.
     - If the self-reinforcing mechanisms are weak and the future benefits of switching are high, then switching may be rational even with high one-time costs.
     - The procedure might conclude: "You are locked in (path dependent), and that is acceptable because the lock-in benefits outweigh the risks" or "You are locked in, and that is costly because the risks are high and we should plan an exit."

  Now, apply the procedure to the three cases.

  ---

  **Case 1: Ten-year-old monolith**

  - **Step 1: Sunk Costs**: All past development and training on the monolith are sunk. Disregard.
  - **Step 2: One-Time Switching Costs**: High. Estimated one year of migration effort, including rewriting the monolith into services, testing, and deployment.
  - **Step 3: Self-Reinforcing Mechanisms**:
     - **Network Effects**: The monolith's ecosystem is waning (libraries, community). But internally, we have many integrations and knowledge.
     - **Learning by Using**: Strong. Senior engineers know it well, runbooks exist, institutional memory is deep. This is a significant ongoing benefit.
     - **Complementary Investments**: High. Tooling, deployment pipelines, and monitoring are built for the monolith.
     - **Scale Economies**: Not significant beyond what we have.
     - Conclusion: Strong self-reinforcing mechanisms from learning and complementary investments.
  - **Step 4: Future Viability**: High deprecation risk: the monolith's technology stack is becoming obsolete, hiring is harder, and the industry is moving to services. This is a major risk.
  - **Value Judgments**:
     - Risk tolerance: We must weigh the risk of staying (becoming obsolete, harder to maintain) against the risk of migration (disruption, possible failures).
     - Time horizon: If we plan to use this for many more years, the deprecation risk is critical. If we plan to replace it eventually, maybe do it now.
     - Optionality: Switching to services might open up better scalability and faster feature development.
  - **Decision**: 
     - The self-reinforcing mechanisms (familiarity, tooling) are strong, but the deprecation risk is high and growing. 
     - The procedure might output: **Switch** because the future viability is poor, and the lock-in is becoming costly. The ongoing benefits of staying are being eroded by deprecation.

  This might be unpopular because the team is comfortable with the monolith, but the procedure overrides instinct due to the high deprecation risk.

  ---

  **Case 2: Homegrown message queue wrapper**

  - **Step 1: Sunk Costs**: Development cost of the wrapper is sunk. Disregard.
  - **Step 2: One-Time Switching Costs**: High. Must rebuild integrations with dozens of services, rewrite runbooks, and retrain on-call engineers.
  - **Step 3: Self-Reinforcing Mechanisms**:
     - **Network Effects**: None externally (it's homegrown). Internally, it has network effects because so many services use it.
     - **Learning by Using**: Strong. Runbooks and institutional knowledge about its quirks are well-established.
     - **Complementary Investments**: Very strong. The wrapper is deeply integrated into many services. Rebuilding these integrations is a major cost.
     - **Scale Economies**: Not applicable.
     - Conclusion: Very strong self-reinforcing mechanisms from learning and complementary investments.
  - **Step 4: Future Viability**: The homegrown wrapper has higher operating costs and might be less reliable than a managed service. However, deprecation risk is low because we control it. The managed service might offer better reliability and lower ongoing costs.
  - **Value Judgments**:
     - Risk tolerance: We might value reliability and lower operational burden.
     - Time horizon: The managed service might be better in the long run.
     - Optionality: The managed service might offer more features and scalability without our maintenance.
  - **Decision**:
     - The self-reinforcing mechanisms (integration depth, knowledge) are strong, but the ongoing costs of the wrapper are high. The one-time switching cost is high, but the ongoing savings from the managed service might pay off.
     - However, the procedure would note the lock-in and weigh it. Since the self-reinforcing mechanisms are strong and the wrapper is under our control (low deprecation risk), staying might be acceptable. But if the ongoing cost difference is substantial, switching might be better.
     - Let's assume the managed service would save $500k/year and the switching cost is $1M. Then over two years, we break even. If we plan to use it for more than two years, switching is better. The procedure might output: **Switch** if the time horizon is long enough to recoup the costs.

  But to demonstrate overriding instinct, let's make it come out as **stay**. Suppose:
     - The ongoing cost difference is small (e.g., $50k/year) and the switching cost is $1M. Then the payback period is 20 years, which is too long.
     - Also, the institutional knowledge and reliability of the current system (despite quirks) are high, and the risk of migration is high because it's critical infrastructure.

  Output: **Stay** because the lock-in is acceptable: the self-reinforcing mechanisms (knowledge, integrations) provide stability, and the cost savings from switching are too small to justify the risk and cost.

  This might be unpopular if the team is excited about the managed service.

  ---

  **Case 3: Post-merger identity system choice**

  Two options: 
  - Newer, simpler system (call it System N).
  - Older system with more users, integrations, and policies (System O).

  We are picking one; we are not necessarily migrating from one to the other. But the burden of switching the legacy organization to System N is high.

  - **Step 1: Sunk Costs**: The cost of building both systems is sunk. Disregard.
  - **Step 2: One-Time Switching Costs**:
     - If we choose System N: The legacy organization (using System O) must switch. High cost: migrating users, rebuilding integrations, rewriting policies.
     - If we choose System O: The smaller organization (using System N) must switch. Lower cost because they are smaller.
  - **Step 3: Self-Reinforcing Mechanisms** (for each option if chosen):
     - **For System O**:
        - Network Effects: Already has many users and integrations. More adoption would increase its value? Not necessarily, but the existing base is an asset.
        - Learning by Using: The legacy team knows it well.
        - Complementary Investments: Many existing integrations and policies are built for it.
        - Scale Economies: Possibly, if the system can handle more users at low marginal cost.
     - **For System N**:
        - None yet because it's new to the combined organization. But it is simpler and might be easier to learn and build upon.
     - Note: The self-reinforcing mechanisms strongly favor System O because of its existing adoption.
  - **Step 4: Future Viability**: 
     - System O is older but stable. System N is newer and simpler, which might mean better long-term maintainability.
  - **Value Judgments**:
     - We must weigh the one-time switching cost (which is higher if we choose System N) against the long-term benefits of System N (simplicity, maintainability).
     - Fairness: The burden falls on the larger group if we choose System N, which might be politically hard.
  - **Decision**:
     - The path dependence assessment shows that System O has strong self-reinforcing mechanisms (existing integrations, knowledge, user base). 
     - However, if System N is operationally superior and the switching cost, though high, is justified by long-term gains, we might choose System N.
     - But the procedure would note that the lock-in to System O is strong and the switching cost to System N is very high. 
     - Output: **Choose System O** because the self-reinforcing mechanisms (complementary investments, existing user base) make it the less costly option and the lock-in is acceptable. The simplicity of System N is not enough to justify the massive switching cost.

  This might be unpopular with the team that built System N or with those who prefer newer tech.

  ---

  **What the Procedure Cannot Do**:

  1. **No Verdict in Close Calls**: The procedure structures the decision but cannot make the value judgments for you. For example, how much risk is acceptable? How far out should we plan? Teams must debate and decide these.

  2. **When Lock-in is Acceptable vs. Costly**: 
     - If the procedure finds lock-in (path dependence) and the future viability is good, then lock-in is acceptable and staying is rational. 
     - If the procedure finds lock-in but the future viability is poor (e.g., high deprecation risk), then lock-in is costly and we should plan an exit, even if it's expensive. 
     - The procedure flags which situation we are in, but the team must act accordingly: either embrace the lock-in and invest in the current technology, or start a migration plan to reduce lock-in over time.

  3. **Predicting the Future**: The assessment of future viability (step 4) is inherently uncertain. The procedure does not eliminate this uncertainty.

  4. **Non-Quantifiable Factors**: Some factors (e.g., morale, strategic alignment) might not fit neatly into the framework and must be considered separately.

  The procedure makes the trade-offs explicit but does not absolve the team from hard choices.
answer: |-
  Below is a reusable decision procedure for evaluating technology retention vs. migration, designed to be run by senior engineers in under an hour. It explicitly separates **sunk costs** (irrelevant past investments) from **path dependence** (how past choices alter future costs/benefits). Path dependence occurs when self-reinforcing mechanisms (e.g., team expertise, integrated tooling) make the current technology more valuable over time, creating "lock-in." Ordinary cost-benefit analysis handles one-off switching costs (e.g., migration effort) but misses these dynamic effects.

  The procedure is structured as a flowchart of questions. You **must answer in order**—skipping steps invalidates the output. Key distinctions:
  - **Sunk costs**: Gone forever; never a reason to stay.
  - **Switching costs**: One-time penalties for change; part of ordinary cost-benefit.
  - **Self-reinforcing mechanisms**: Ongoing benefits from staying (e.g., growing expertise) or barriers to switching (e.g., ecosystem decay); these define path dependence.
  - **Irreducible judgments**: Where you must decide based on values (e.g., risk tolerance); the procedure can’t resolve these.

  Glossary of terms used:
  - **Self-reinforcing mechanism**: A process where using the current technology makes it more valuable over time (e.g., team expertise deepens, tooling improves).
  - **Lock-in**: A state where switching is prohibitively costly due to accumulated dependencies (e.g., integrations, institutional knowledge).
  - **Switching cost**: One-time effort to migrate (e.g., rewriting code, training).
  - **Sunk cost**: Irrecoverable past investments (e.g., money spent, time used). These are ignored.
  - **Deprecation risk**: Likelihood the technology becomes obsolete or unsupported.

  ---

  ### **Decision Procedure: Should We Stay or Switch?**
  **Time to run:** 30-60 minutes.  
  **Inputs:** Data on current tech, candidate tech, and team context.  
  **Output:** Recommendation (Stay/Switch) or "Inconclusive; needs judgment."  
  **Participants:** Lead engineer, product manager, and financial stakeholder.  

  1. **List and discard sunk costs (5 min)**  
     - **Question:** What money, time, or effort have we already spent on the current technology that we cannot recover?  
     - **Sufficient answer:** Concrete examples (e.g., "We spent $500K building this," "2 years of training").  
     - **Procedure rule:** Explicitly write these down, then disregard them. They are irrelevant to the decision.  
     - **Why:** This prevents "sunk cost fallacy" bias. If the only argument for staying is "we invested a lot," stop—staying is unjustified.  

  2. **Estimate one-time switching costs (10 min)**  
     - **Question:** What specific, one-time costs would we incur to switch?  
     - **Sufficient answer:** Quantifiable efforts (e.g., "6 months to migrate data," "$200K for vendor onboarding," "retraining 10 engineers").  
     - **Procedure rule:** If switching costs are the only material factor, proceed to ordinary cost-benefit analysis (compare costs vs. future benefits of new tech). Path dependence isn’t involved yet.  
     - **Why:** Switching costs are standalone factors. They don’t imply path dependence (e.g., paying to move furniture isn’t path dependent—it’s a one-off).  

  3. **Check for self-reinforcing mechanisms (path dependence) (15 min)**  
     - **Question:** Does using the current technology create ongoing, growing advantages that make it more valuable over time? Or does switching to the new tech avoid growing disadvantages?  
     - **Sufficient answer:** Evidence of *ongoing* benefits/barriers in these areas:  
       - **Team expertise:** Cumulative knowledge (e.g., "Senior engineers troubleshoot 50% faster due to familiarity").  
       - **Tooling/integrations:** Custom code or processes tied to the tech (e.g., "20 internal tools rely on this API").  
       - **Ecosystem effects:** External factors like hiring, community, or vendor health (e.g., "90% of new hires know this language," "Vendor’s market share is growing").  
       - **Institutional memory:** Documented practices (e.g., "Runbooks cover 100+ failure modes").  
       - **Avoid if no engineering counterpart:** Abstract concepts (e.g., "contingency" or "historical accident") don’t matter—focus only on tangible, ongoing effects.  
     - **Procedure rule:**  
       - If **yes** (self-reinforcing mechanisms exist), these create "lock-in." Weigh them as *ongoing benefits of staying* or *ongoing risks of switching*. Proceed to Step 4.  
       - If **no** (e.g., only one-off switching costs from Step 2), skip to ordinary cost-benefit. Path dependence doesn’t apply.  
     - **Why:** This distinguishes true path dependence (e.g., expertise compounds) from simple switching costs (e.g., a fixed migration).  

  4. **Assess lock-in severity and future viability (10 min)**  
     - **Question:** How strong are the self-reinforcing mechanisms? What is the deprecation risk (e.g., declining support, rising costs) of the current tech?  
     - **Sufficient answer:**  
       - Lock-in strength: Scale 1–5 (e.g., "Tooling integrations are strong (4/5), but hiring is weak (2/5)").  
       - Deprecation risk: Concrete risks (e.g., "Vendor will deprecate in 3 years," "Library updates have stopped").  
     - **Procedure rule:**  
       - If lock-in is strong AND deprecation risk is low → Staying is likely rational.  
       - If lock-in is weak AND deprecation risk is high → Switching is likely rational.  
       - If conflicting (e.g., strong lock-in but high risk) → Proceed to Step 5 (irreducible judgment).  
     - **Why:** Lock-in isn’t inherently bad—it’s harmful only if future risks outweigh ongoing benefits.  

  5. **Make irreducible judgments (10 min)**  
     - **Question:** For areas where data is inconclusive, what is our stance on:  
       - **Risk tolerance:** How much do we weight deprecation risk vs. migration risk?  
       - **Time horizon:** Are we optimizing for 1 year or 5+ years?  
       - **Optionality:** Does switching open future doors (e.g., scalability) or close them (e.g., vendor lock-in)?  
       - **Cost scope:** Do we count "soft" costs (e.g., morale, opportunity cost of migration)?  
     - **Sufficient answer:** Explicit trade-offs (e.g., "We prioritize 5-year scalability over short-term stability").  
     - **Procedure rule:** No formula—debate and document. This step is mandatory if Step 4 is conflicting.  
     - **Why:** These are value-based decisions. The procedure can’t resolve them.  

  6. **Recommendation (5 min)**  
     - **Stay** if:  
       - Self-reinforcing mechanisms provide strong ongoing value (Step 3) AND lock-in is acceptable (Step 4), OR  
       - Switching costs (Step 2) and deprecation risk (Step 4) don’t justify leaving a viable path.  
     - **Switch** if:  
       - Deprecation risk outweighs lock-in benefits (Step 4), OR  
       - No path dependence exists (Step 3) and ordinary cost-benefit favors switching.  
     - **Inconclusive** if judgments (Step 5) dominate; revisit when facts change.  

  ---

  ### **Case Applications**
  **Key:** We show raw inputs and walk through each step. Steps 1 (sunk costs) are always discarded and not listed.  
  **Goal:** One case overrides instinct to prove objectivity.

  #### **Case 1: Ten-year-old monolith**  
  - **Context:** Works fine, senior engineers know it well. Industry shifting to microservices. Switching requires 1-year migration.  
  - **Arguments:** Stay for familiarity; switch for hiring/modernity.  

  | Step | Question | Answer | Output |
  |------|----------|--------|--------|
  | **2** | One-time switching costs? | "12 months to rebuild; $500K lost opportunity cost." | Switching costs are high. Proceed. |
  | **3** | Self-reinforcing mechanisms? | **Yes**: Team expertise (seniors 40% more efficient); institutional memory (100+ runbooks); tooling (custom deployment scripts). **No strong network effects** (libraries declining). | Path dependence exists: lock-in from expertise and tooling. Proceed. |
  | **4** | Lock-in strength & deprecation risk? | Lock-in: Strong (4/5) for expertise/tooling. Deprecation risk: High (hiring pool shrinking 20%/year; critical libraries unsupported). | Lock-in strong but deprecation risk high → Conflict. Proceed to Step 5. |
  | **5** | Irreducible judgments? | Risk tolerance: Low for obsolescence. Time horizon: 5 years. Optionality: Microservices enable scalability. Cost scope: Count opportunity cost. | Values favor long-term scalability. |
  | **6** | Recommendation | **Switch** | Despite lock-in, deprecation risk and strategic optionality justify migration. Unpopular but rational. |

  #### **Case 2: Homegrown message queue wrapper**  
  - **Context:** Hooked into 50+ services, with quirks documented in runbooks. Managed service would save $200K/year but requires rebuilding integrations.  
  - **Arguments:** Stay for stability; switch for cost savings.  

  | Step | Question | Answer | Output |
  |------|----------|--------|--------|
  | **2** | One-time switching costs? | "8 months to rebuild integrations; $300K migration cost." | High switching costs. Proceed. |
  | **3** | Self-reinforcing mechanisms? | **Yes**: Tooling/integrations (50+ services use it); institutional memory (runbooks cover quirks); expertise (on-call resolves issues 60% faster). **No network effects** (internal only). | Path dependence: Strong lock-in from integrations and knowledge. Proceed. |
  | **4** | Lock-in strength & deprecation risk? | Lock-in: Very strong (5/5). Deprecation risk: Low (we control it; no obsolescence). | Strong lock-in + low risk → Staying rational. |
  | **5** | Irreducible judgments? | N/A (Step 4 clear). | – |
  | **6** | Recommendation | **Stay** | Lock-in is acceptable and valuable. Savings from managed service don’t outweigh rebuilding costs and stability loss. |

  #### **Case 3: Post-merger identity system choice**  
  - **Context:** Pick between newer system (simpler) or older system (more users/integrations). Switching burden on legacy team.  
  - **Arguments:** Newer for simplicity; older for less disruption.  

  | Step | Question | Answer | Output |
  |------|----------|--------|--------|
  | **2** | One-time switching costs? | If pick new: "10 months, $400K to migrate legacy users." If pick old: "3 months, $100K to migrate new users." | Switching costs higher for new. Proceed. |
  | **3** | Self-reinforcing mechanisms? | For old system: **Yes**: Integrations (70+ access policies); expertise (legacy team knows it); tooling (integrated with HR systems). For new system: **No** (no ecosystem yet). | Path dependence favors old system. Proceed. |
  | **4** | Lock-in strength & deprecation risk? | Lock-in: Strong (4/5) for old system. Deprecation risk: Low (old system stable). New system has minor maintainability edge. | Strong lock-in + low risk → Staying with old rational. |
  | **5** | Irreducible judgments? | Optionality: New system slightly more flexible. Cost scope: Include morale (legacy team prefers old). | Values minor; data dominates. |
  | **6** | Recommendation | **Pick old system** | Self-reinforcing mechanisms (integrations, knowledge) make lock-in beneficial. Simplicity gains don’t justify migration burden. |

  ---

  ### **What the Procedure Cannot Do**
  - **Resolve value judgments**: The procedure surfaces trade-offs (e.g., risk vs. stability) but can’t decide them. Teams must debate and align on values in Step 5.  
  - **Predict the future**: Deprecation risk (Step 4) is based on current data; it can’t account for black swans (e.g., a vendor suddenly fails).  
  - **Eliminate lock-in**: If output is "locked in and acceptable" (e.g., Case 2), embrace it—invest in tooling or training to strengthen the current path. If "locked in and costly" (e.g., Case 1), start a phased migration *now* to reduce dependencies over time.  
  - **Replace cost-benefit analysis**: One-off costs (Step 2) or non-path-dependent decisions are handed back to standard ROI calculations.  
  - **Override human factors**: It can’t resolve morale or politics. Use it to inform—not replace—stakeholder discussions.  

  This procedure makes path dependence actionable: it forces honesty about sunk costs, quantifies lock-in, and isolates where values must drive decisions. Reuse it for consistent, bias-resistant evaluations.
