  Okay, the user is trying to map out their professor's implicit model for how moral norms collapse. They've described four historical cases where the professor attributed the change to either shifting interests or changes in what's considered honorable by the elite. Now, they're looking at a case about doctors stopping the practice of hiding terminal cancer diagnoses from patients in the US during the 1970s and 1980s. I need to predict what the professor would say and then analyze the underlying rules that fit all four cases.

  First, reviewing the four cases: For dueling, the professor thought it was about the crown and middle class having an interest in stopping it, and honor codes were already hollow. Foot-binding ended because elite families saw it as a status stain in modern contexts. British abolition was due to industrial capitalists wanting wage labor and slaveowners losing prestige. Public executions stopped because cruelty became vulgar and degraded national honor. The common threads are interests and elite honor, with moral arguments being dismissed as ineffective.

  For the medical secrecy case, the shift happened between 1970-1980. Key factors here include the rise of patient autonomy movements, informed consent becoming a legal and ethical standard, and high-profile cases or scandals that might have influenced public opinion. Also, medical associations changing their codes and malpractice litigation could play roles. The professor's pattern suggests she'd look for either a shift in interests (e.g., doctors avoiding lawsuits) or a change in what's honorable for the elite (medical profession's reputation).

  Considering the two competing rules: Rule A (Interest Shift) would predict that doctors or institutions had a material interest in changing the practice, like reducing legal liability. Rule B (Elite Honor Shift) would point to the medical profession redefining their honor to include transparency and patient autonomy to maintain status. Both rules could fit the previous cases. For example, in abolition, industrial interests (Rule A) and slaveowners losing prestige (Rule B) were factors. 

  Predicting the professor's verdict for the medical case: She'd likely say it was about the medical profession's honor shifting. Why? Because the 1970s saw a broader cultural shift towards individual rights and autonomy. High-profile bioethics debates (like the Tuskegee Syphilis Study scandal in 1972) exposed unethical practices, pushing professions to adopt transparency to preserve their reputation. Elite doctors leading medical associations redefined honorable conduct to include honesty, avoiding the stigma of paternalism. Material interests like avoiding lawsuits were secondary; the core was about maintaining professional dignity.

  The closest analogue is the end of public executions. Both involve state-sanctioned practices (executions by the state, medical norms by professional bodies) that became seen as cruel or degrading to the institution's honor. Parliament banned executions to uphold national honor similarly, medical associations updated codes to uphold professional honor.

  To split the rules, a future case where material interests and elite honor diverge would be needed. For example, if corporate lobbying pushes an environmental regulation against scientific consensus, Rule A (interests) would predict industry influence, while Rule B (honor) would focus on scientific elites defending their integrity. Observing which factor the professor emphasizes would reveal her model's priority.
