prompt: |-
  I am a novelist drafting a work that turns on whether a protagonist’s moral transformation is genuinely warranted or merely narratively convenient, and I want a philosophical classification instrument for my own thinking rather than an encyclopaedic survey. I want a taxonomy — delivered as exactly five numbered items, each comprising one or two sentences, with no introduction and no conclusion — that sorts positions on the wrong kind of reasons problem as it applies specifically to reasons for adopting an interpretive stance about fictional moral outcomes. Build the tree from logical commitments rather than from named theorists: begin with whether reasons for belief are attitude-specific; then branch on whether pragmatic narrative coherence can ever supply a legitimate reason for an interpretive belief; then on whether the wrong-kind objection applies symmetrically to aesthetic and moral attitudes. Each item should name one terminal position defined by its combination of answers, briefly note any adjacent unoccupied logical space and diagnose it as incoherent, unattractive, or merely unexplored, and flag any pair of positions the tree cannot separate. Please write in British English, distinguish what is broadly settled in the philosophical literature from what remains genuinely contested among specialists, and do not present a contested view as if it were the consensus.
reasoning: |-
  Okay, let me approach this novelist's request methodically. The core challenge is constructing a philosophical taxonomy about interpretive stances toward fictional moral outcomes, specifically addressing the "wrong kind of reasons" problem. 

  First, I need to establish the foundational branching points logically: starting with attitude-specificity of reasons for belief, then pragmatic narrative coherence as potential reasons, and finally symmetry between aesthetic and moral attitudes regarding wrong-kind objections. 

  For the first branch, I consider whether reasons for interpretive belief depend entirely on the attitude-type (moral vs aesthetic) or apply uniformly. The literature broadly accepts attitude-specificity as coherent, though some universalist positions exist at the margins. 

  Next, on pragmatic narrative coherence: can it ever legitimately ground interpretive belief? This remains hotly contested - some view it as intrinsically alien to truth-tracking, others as contextually valid. I must present both as live options without implying consensus. 

  Finally, symmetry between aesthetic and moral domains proves tricky. While many treat them analogously, significant dissent exists regarding moral attitudes' special status. I'll note this asymmetry in the taxonomy itself. 

  When structuring the five terminal positions, I'll identify logical gaps: for instance, positions denying attitude-specificity while accepting narrative coherence as legitimate reasons might collapse into incoherence by conflating distinct reason-types. 

  Throughout, I'll maintain British English conventions and flag genuinely unsettled debates (like narrative coherence's justificatory role) without overstating their resolution. The novelist needs this not as survey but as conceptual toolkit, so concision and logical clarity are paramount.
answer: |-
  Here is the taxonomy as requested:

  1.  **Universalist Evidentialism:** Reasons for interpretive belief are *not* attitude-specific; only truth-tracking evidence (textual analysis, authorial intent) constitutes legitimate reasons, irrespective of whether the belief concerns moral or aesthetic outcomes. Pragmatic narrative coherence supplies *no* legitimate reason for interpretive belief, being the 'wrong kind' for belief-formation. (Broadly settled as coherent; contested whether it captures all legitimate interpretive constraints.)
  2.  **Attitude-Specific Pragmatism:** Reasons *are* attitude-specific. Pragmatic narrative coherence *can* supply a legitimate reason for adopting an interpretive belief about a *fictional moral outcome*, specifically when it serves the narrative's internal coherence or desired impact. Adjacent position denying attitude-specificity but allowing pragmatism for morals is diagnosed as *incoherent* – it conflates distinct reason types without justification. (Genuinely contested core claim; symmetry with aesthetics untested here.)
  3.  **Asymmetrical Anti-Pragmatism:** Reasons are attitude-specific. Pragmatic narrative coherence *cannot* supply a legitimate reason for interpretive belief about *moral* outcomes (wrong kind for moral truth), but it *might* potentially do so for purely *aesthetic* interpretive beliefs about the fiction. Adjacent position applying this 'might' symmetrically to morals is *unattractive* due to the perceived special truth-aptness or weight of moral claims vs aesthetic. (Contested; hinges on disputed asymmetry between moral/aesthetic attitudes.)
  4.  **Symmetrical Anti-Pragmatism:** Reasons are attitude-specific. Pragmatic narrative coherence supplies *no* legitimate reason for interpretive belief *whether* concerning moral *or* aesthetic fictional outcomes – both domains demand evidence-based interpretation, rejecting pragmatic 'wrong kind' reasons equally. Adjacent position allowing pragmatism only for aesthetics is *unexplored* and potentially unstable without clear justification for the asymmetry. (Contested; challenges the intuitive pull of narrative coherence in interpretation generally.)
  5.  **Strong Fictionalism:** Reasons are attitude-specific. Interpretive beliefs about *fictional moral outcomes* are not truth-apt beliefs but commitments akin to aesthetic or imaginative stances; thus, pragmatic narrative coherence *can* be the *right kind* of reason for adopting them (e.g., for narrative unity). Adjacent position applying this to non-fictional moral beliefs is *incoherent*. Positions 2 and 5 *cannot be separated* by this tree alone on the permissibility of pragmatic reasons for moral interpretations; further distinction requires examining the *metaphysical status* of fictional moral propositions. (Highly contested; challenges standard belief semantics for fiction).
