answer: |-
  This vocabulary split reflects deep philosophical tensions in how we categorize mass atrocities, resting on contested assumptions about **moral significance, legal pragmatism, and the nature of group identity**. Let's break down the implicit theories and consequences:

  ### Core Philosophical Presuppositions:
  1.  **Legal Instrumentalism vs. Historical/Moral Expressivism:**
      *   **Law:** Assumes the primary purpose of the "genocide" label is **triggering specific legal obligations** (prosecution, intervention, state responsibility). Narrowness is seen as necessary for **legal certainty, feasibility of proof, and avoiding diplomatic gridlock**. The moral weight is tied to *enforceable consequences*.
      *   **History/Commemoration:** Assumes the primary purpose is **accurate description, moral condemnation, and societal reckoning**. Comprehensiveness captures the *intent and destructive impact* more fully, aligning with Lemkin's original conception of destroying the "essential foundations of the life of national groups" (including culture, politics, economy).

  2.  **The Primacy of "Biological-Existential" Group Destruction:**
      *   The Convention's focus implies that **physical-biological annihilation** of groups defined by largely immutable characteristics (race, ethnicity) is morally *sui generis* – distinct in kind, not just degree, from other atrocities. Cultural or political destruction, while horrific, is implicitly ranked as *less fundamental* or potentially reversible (a highly contested view).

  3.  **The "Protected Group" as the Defining Moral Feature:**
      *   The split practice presupposes that **the nature of the victim group** is the *key* moral differentiator between genocide and other crimes against humanity or war crimes. The intent to destroy a *group as such*, but *only* groups defined in these specific ways, is what elevates the crime.

  4.  **Distinction Between Physical Existence and Cultural Identity:**
      *   It rests on a (philosophically and anthropologically dubious) assumption that a group's **physical existence** can be cleanly separated from its **cultural/political identity**. Destroying language, schools, and political structures is seen as targeting the latter, not the former *directly*.

  ### Is the Practice Internally Consistent?
  *   **Logically:** Yes, *if* you accept the premise that the terms serve fundamentally different purposes with different criteria. Calling something "genocide" for memorial purposes uses a **broader, moral-descriptive definition**, while the legal label uses a **narrow, technical-juridical definition**. They are different "language games."
  *   **Morally & Politically:** **No, it creates profound dissonance.** The inconsistency:
      *   **Devalues Certain Suffering:** Implies the destruction of political groups or cultures, even with genocidal intent, is less worthy of the ultimate condemnation.
      *   **Hinders Accountability:** Creates loopholes for perpetrators targeting groups outside the "protected" categories.
      *   **Breeds Distrust:** Communities experiencing cultural destruction (e.g., Indigenous peoples) rightly see hypocrisy when their experience is called "genocide" by a truth commission but denied that label in international law.
      *   **Distorts Historical Understanding:** Separates legal adjudication from a fuller historical and moral narrative of the event.

  ### Consequences of Adopting Lemkin's Broader Definition Universally:
  Replacing the bifurcated system with Lemkin's expansive view everywhere would be transformative and face significant challenges:

  1.  **Expansion of Legal "Genocide":**
      *   **Political Groups:** Events like the Khmer Rouge targeting "city dwellers" or "intellectuals" could potentially qualify.
      *   **Cultural Destruction:** Systematic campaigns to eradicate language, religion, education, and cultural practices with the intent to destroy the group *as a distinct cultural entity* (e.g., residential schools, Uyghur assimilation camps) would become prosecutable as genocide, not just crimes against humanity.
      *   **Economic Destruction:** Intentional destruction of the economic foundations of a group could potentially fall under genocide.

  2.  **Major Shifts in International Law & Practice:**
      *   **Revised Genocide Convention:** The Convention itself would need amendment, a politically fraught process requiring near-universal consensus unlikely in the current climate.
      *   **ICC Statute Amendment:** The Rome Statute's definition would also need changing.
      *   **Prosecutorial Challenges:** Proving "intent to destroy" a *political* or *cultural* group *as such* is often even more complex than for ethnic/racial groups. Defining the boundaries of "political group" is notoriously difficult.
      *   **State Sovereignty Concerns:** Governments would fiercely resist labeling political crackdowns or assimilation policies (often framed as "national integration" or "counter-terrorism") as genocide due to the severe consequences (intervention, sanctions, prosecution of leaders).
      *   **Dilution vs. Strengthening Debate:** Critics argue it would dilute the "uniqueness" of genocide, overwhelm courts, and paralyze the system. Proponents argue it would finally hold perpetrators accountable for the full scope of destructive intent and reflect reality more accurately.

  3.  **Changes in Human Rights Reporting & Advocacy:**
      *   **Unified Terminology:** Organizations like HRW and Amnesty could use "genocide" consistently for cultural/political destruction meeting the broader criteria, strengthening advocacy.
      *   **Stronger Calls for Action:** Reports labeling events as genocide carry greater moral and political weight, potentially increasing pressure for intervention or sanctions.
      *   **Reframed Narratives:** Historical and ongoing injustices against Indigenous peoples, victims of political repression, and groups targeted for cultural erasure would be consistently framed through the lens of genocide, demanding different forms of redress and recognition.

  ### Conclusion
  The vocabulary split isn't a neutral technicality; it embodies a **philosophical choice to prioritize legal enforceability and a specific conception of group destruction (physical-biological) over a more holistic moral and historical understanding**. While logically consistent within its own defined purposes (law vs. history/memory), it creates moral and practical contradictions that devalue certain forms of catastrophic harm and hinder accountability. Adopting Lemkin's broader definition universally would significantly expand legal liability, face immense political hurdles, and fundamentally reshape how we categorize, prosecute, and remember the most severe atrocities – moving towards a system where the intent to destroy a group's *existence in any fundamental way* (physical, cultural, political) is treated with the utmost gravity under a single, powerful label. However, the practical challenges and political resistance make this a distant prospect, leaving the current bifurcated and morally fraught system in place.
