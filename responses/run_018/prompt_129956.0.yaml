  ### Decision Tree for Personal Survival through Technological Replacement

  The decision tree sorts positions based on concrete case-responses to four sequential questions. Each branch node is a binary question derived from the specified scenarios, answerable without reliance on philosophical labels. The leaves represent distinct philosophical positions, with their standard names (if any) and most awkward commitments noted. Empty answer combinations are diagnosed as incoherent, unattractive, or unexplored.

  ---

  #### **Tree Structure**
  1. **Gradual Replacement**:  
     *If we replace your neurons one-by-one with artificial neurons that perfectly replicate function (over years), do you survive as the same person?*  
     - **Yes** → Proceed to Destructive Upload  
     - **No** → Proceed to Destructive Upload  

  2. **Destructive Upload**:  
     *If we scan your brain destructively (destroying it) and create a perfect functional replica in new hardware, do you survive in the replica?*  
     - **Yes** → Proceed to Non-Destructive Scanning  
     - **No** → Proceed to Non-Destructive Scanning  

  3. **Non-Destructive Scanning**:  
     *If we scan your brain non-destructively (keeping the original intact) and create a perfect functional replica elsewhere, how many survivors are there?*  
     - **Two survivors** (both the original and replica are "you") → Proceed to Interrupted Upload  
     - **One survivor** (only one is "you," either original or replica) → Proceed to Interrupted Upload  
     - **No survivors** (neither is "you") → Proceed to Interrupted Upload  

  4. **Interrupted Upload**:  
     *If we scan your brain non-destructively, wait 20 years, then activate the replica in new hardware, do you survive in the replica?*  
     - **Yes** → Leaf position  
     - **No** → Leaf position  

  ---

  #### **Leaf Positions**  
  1. **Spatiotemporal-Causal-Continuity View**  
     - **Path**: Gradual: Yes, Destructive: No, Non-Destructive: One survivor, Interrupted: No  
     - **Standard Name**: Unnamed (variant of biological/animalist views).  
     - **Awkward Commitment**: Rejects *any* survival in destructive upload or interrupted cases, even if functionally identical. This implies that a perfect replica activated immediately after destruction would not be "you," counterintuitive if functional equivalence is prioritized.  

  2. **Pattern-Identity Functionalist View**  
     - **Path**: Gradual: Yes, Destructive: Yes, Non-Destructive: One survivor, Interrupted: Yes  
     - **Standard Name**: Patternism (named, e.g., Chalmers).  
     - **Awkward Commitment**: Denies survival of both in non-destructive scanning (only the original is "you"), yet accepts survival in destructive upload (the replica is "you"). This makes survival depend on the destruction of the original, which seems arbitrary.  

  3. **Branching-Tolerant Functionalist View**  
     - **Path**: Gradual: Yes, Destructive: Yes, Non-Destructive: Two survivors, Interrupted: Yes  
     - **Standard Name**: Multiple Occupancy View (named, e.g., Parfit-influenced).  
     - **Awkward Commitment**: Accepts two survivors in non-destructive scanning but denies they share identity. This implies both are distinct successors of "you," raising questions about how one person becomes two without identity continuity.  

  4. **Embodied-Enactivist View**  
     - **Path**: Gradual: Yes, Destructive: No, Non-Destructive: One survivor, Interrupted: No  
     - **Standard Name**: Enactivism (named, e.g., Varela/Thompson).  
     - **Awkward Commitment**: Rejects all disembodied survival (e.g., uploads), even if gradual replacement preserves the body. This forces rejection of *any* non-biological continuity, even in cases identical to gradual replacement (e.g., a cloned biological body).  

  5. **Deflationary Graded-Survival View**  
     - **Path**: Gradual: No, Destructive: Yes, Non-Destructive: Two survivors, Interrupted: Yes  
     - **Standard Name**: Unnamed (pragmatic/degree-based view).  
     - **Awkward Commitment**: Treats survival as practical rather than metaphysical, avoiding clear answers. This risks incoherence, e.g., accepting two survivors in non-destructive scanning but rejecting gradual replacement, which is functionally analogous.  

  ---

  #### **Flagged Unseparable Leaves**  
  - **Spatiotemporal-Causal-Continuity and Embodied-Enactivist** are indistinguishable under this tree (both share: Gradual: Yes, Destructive: No, Non-Destructive: One survivor, Interrupted: No).  
    - **Diagnosis**: Both positions prioritize physical continuity/embodiment and reject uploads/interruptions. The tree cannot differentiate them because they converge on all case-responses despite distinct metaphysical foundations (causal continuity vs. embodiment).  

  ---

  #### **Diagnosis of Empty Answer Combinations**  
  | Gradual | Destructive | Non-Destructive | Interrupted | Diagnosis | Reason |
  |---------|------------|-----------------|------------|-----------|--------|
  | Yes | Yes | Two | No | **Incoherent** | Accepts branching (two survivors) but rejects interruption, though both involve discontinuity. |
  | Yes | Yes | One | No | **Unattractive** | Accepts destructive upload (discontinuous) but rejects interrupted upload (also discontinuous), appearing arbitrary. |
  | Yes | Yes | None | Any | **Incoherent** | Claims no survival in non-destructive scanning but accepts destructive upload (which requires the replica to be "you"). |
  | Yes | No | Two | Any | **Incoherent** | Rejects survival in destructive upload but accepts two survivors in non-destructive scanning, though destructive upload is a subset of non-destructive + destruction. |
  | Yes | No | None | Any | **Incoherent** | Accepts survival in gradual replacement but denies it in non-destructive scanning, where the original is preserved. |
  | Yes | No | One | Yes | **Unexplored** | Rejects destructive upload and accepts interruption, a rare combo (functionalism with continuity emphasis). |
  | No | Yes | One | Any | **Incoherent** | Rejects gradual survival but accepts one survivor in non-destructive scanning, though both rely on functional replication. |
  | No | Yes | None | Any | **Incoherent** | Rejects gradual survival but accepts destructive upload, despite functional equivalence. |
  | No | No | Any | Any | **Unexplored** | Rejects all technological survival. Coherent but extreme; no major position advocates this. |
  | No | Any | None | Any | **Incoherent** | Claims no survival in non-destructive scanning but may accept destructive upload (if "Yes"), contradicting functionalism. |

  - **Unattractive**: Logically possible but theoretically unstable (e.g., inconsistent handling of discontinuity).  
  - **Unexplored**: Coherent but not represented in mainstream positions.  
  - **Incoherent**: Logically contradictory or self-undermining.  

  This tree clarifies commitments and exposes gaps, aiding seminar discussion of personal identity in technological contexts.
