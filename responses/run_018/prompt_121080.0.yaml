prompt: |-
  Hi there. I'm about two thirds of the way through a very readable popular book on evolution that a lab mate lent me, and there's a passage in it about what it means to say a trait has a function that I can't tell is fair or not. I'm doing a PhD in enzyme engineering, so I spend all day talking about the function of variants that have never existed anywhere in the natural world, and this matters to me more than it probably should. Here's the passage, more or less as written:

  "Philosophers used to treat talk of what a trait is 'for' as just shorthand for how it evolved, but there are now two rival accounts, and the argument between them is pretty much the whole of the modern debate about function.

  The first, the historical or 'selected-effects' account — Millikan, Neander and co. — says that a trait's function is the effect it had that explains why natural selection favoured it, and hence why it is still around today. The heart's function is to pump blood because pumping blood is what hearts were selected for.

  The second, the 'causal-role' account, associated with Cummins, says that to call something a function is simply to say what it contributes to some larger capacity of the system it sits inside. On this view the heart's function is to pump blood only because we happen to take an interest in blood circulation; carve the system up differently and that same heart equally has the function of making a thumping noise, or of keeping cardiologists in business.

  The causal-role account wins, and wins easily. It covers everything that has no evolutionary history at all — the very first heart, an enzyme a lab breeds in a fortnight, the parts of a robot — whereas the historical account is stuck saying that none of these have functions, which nobody seriously believes. It is also the account that medicine already assumes whenever it defines disease as the failure of a normal function, so it is the one that actually matters outside philosophy.

  The historical account does win one round: malfunction. If a trait's function is fixed by its past, then a heart that cannot pump still has pumping as its function and merely fails at it — it is broken, not functionless. On the causal-role view, a heart that does not pump simply does not have that function any more, so malfunction collapses into not having a function at all, and you lose the ability to call it diseased."

  What I'd like is a sanity check on how much of that I should believe. Could you go through it and tell me which bits a philosopher of biology would happily sign off on, which are the sort of simplification a populariser can't avoid, and which are actually wrong? I'm suspicious of at least two things: the claim that the "carve the system up differently" point is a neutral feature rather than a problem for the causal-role view, and the bit at the end where he says that view can't call a broken heart diseased, since a couple of paragraphs earlier he said it's the view doctors already use — that looks like wanting it both ways, but I may be reading it wrong, and I definately don't know where else he might be sliding.

  My supervisor, who did some philosophy as an undergrad, read the passage and says the book has it backwards: the historical view is the one that fits lab talk better, because what we do in directed evolution is selection, just in a tube rather than a field, so a variant we have selected for a reaction does have a selection history and the no-history objection doesn't touch it. That sounded too convenient to be true. Is he right, or is he cheating?

  There's a related case from our own work that I'd like to know what each account says about. We had a variant that definitely catalyses the reaction we bred it for, but we worked out later on that it's only sticking around in our cultures because it sits on the same plasmid as the resistance marker we select on — strip the marker away and the catalytic activity by itself wouldn't keep it in the population. Does either account get to say that this thing's function is the catalysis, and does it make any difference that we didn't know about the hitchhiking at the time?

  Anyway — settled view, defensible simplification, or howler, and in particular whether his conclusion that the causal-role view wins easily survives whatever else you have to correct.
reasoning: |-
  Okay, let me unpack this user's query. They're a PhD student in enzyme engineering, working with artificial enzyme variants, and they're grappling with a passage from a popular evolution book about the philosophy of biological function. The passage presents two main theories: the selected-effects view and the causal-role view, and claims the causal-role view wins easily. The user has several concerns and wants a sanity check on the accuracy of the book's claims.

  First, I need to recall the core differences between these two philosophical accounts of function. The selected-effects view (Millikan, Neander) ties function to evolutionary history - what a trait was selected for. The causal-role view (Cummins) defines function by current causal contribution within a system. The book argues causal-role is superior because it covers artificial and novel traits, and aligns with medical practice.

  The user raises specific concerns: 
  - Whether the "carve the system up differently" point is problematic for causal-role
  - The apparent contradiction in claiming doctors use causal-role while also saying it can't handle malfunction
  - Their supervisor's counterargument that directed evolution creates selection history
  - Their own experimental case of a hitchhiking enzyme variant

  I should address each systematically. On the "carving up" issue: yes, this is a recognized challenge for causal-role views - function becomes observer-dependent. For malfunction: the book oversimplifies - Cummins-style accounts can define malfunction relative to typical causal contributions. The supervisor has a point about directed evolution creating real selection history, making selected-effects applicable to lab creations. For the hitchhiking enzyme: selected-effects would say catalysis isn't its function since it wasn't selected for, while causal-role could still assign function based on current catalytic action.

  The user is clearly looking for philosophical precision applied to their practical work. They need to understand which functional account best supports their enzyme engineering work. The book's presentation is overly simplistic - both views have merits and weaknesses, and neither "wins easily." The selected-effects view actually handles lab-created enzymes better than the book claims.

  I'll structure my response to: 
  1) Assess the book's accuracy point-by-point 
  2) Evaluate the supervisor's argument 
  3) Analyze the hitchhiking enzyme case 
  4) Offer balanced conclusions about the philosophical debate
answer: |-
  You've hit on a genuinely nuanced debate in philosophy of biology, and the book oversimplifies significantly in service of readability. Your instincts (and your supervisor's) are sharp. Let's break it down point-by-point:

  ### 1. **The Book's Claims: Accuracy Assessment**
      *   **The Core Distinction:** Fairly presented. The "selected-effects" (SE) vs. "causal-role" (CR) distinction is accurate. Millikan/Neander vs. Cummins is standard framing.
      *   **"CR Wins Easily": Howler.** This is a massive overstatement and misrepresents the state of the debate. Neither view "wins easily"; both have strengths, weaknesses, and passionate defenders. The book presents CR's advantages while downplaying SE's.
      *   **"CR Covers Everything / SE Says No Function": Oversimplification (Bordering on Howler).**
          *   *CR Coverage:* CR *can* assign functions to anything with causal contributions (robots, synthetic enzymes). This is correct.
          *   *SE "No Function" Claim:* This is misleading. SE proponents *do* argue that *biological* traits *in nature* only have *proper functions* if they result from selection history. However:
              *   They readily acknowledge that traits (natural or artificial) have *causal effects* and that we use "function" *metaphorically* or *pragmatically* in contexts like engineering ("the function of this gear"). They just argue this is distinct from the *teleological* "proper function" in biology.
              *   SE proponents would argue that *your lab enzymes* **do** have a selection history *if created by directed evolution*. Your supervisor is **absolutely correct** here. Directed evolution *is* artificial selection. The variant selected for catalytic activity *does* have pumping blood as its SE function because that's what it was selected for. The "no history" objection *doesn't* touch lab creations *with a selection history*. The book ignores this crucial point.
      *   **"CR is What Medicine Uses": Defensible Simplification (with caveats).** Medicine often uses CR-like reasoning (identifying what a part *normally does* in the system). However, the *concept of malfunction/disease* leans heavily on SE intuitions (a diseased heart *fails* at what it's *supposed* to do, based on its evolved design). The book later contradicts itself on this.
      *   **"Carving Up Differently" as Neutral for CR: Problematic.** You're right to be suspicious. This context-dependence is a *major criticism* of the CR view, not a neutral feature. If the heart's "function" depends entirely on which system capacity we care about (circulation vs. sound vs. job creation), it seems arbitrary. SE offers a principled reason why pumping blood is the *primary* biological function. The book dismisses this weakness.
      *   **"CR Cannot Handle Malfunction": Howler.** This is a common *misrepresentation* of CR. Cummins-style accounts *can* define malfunction relative to a *typical causal contribution* within a *reference class* (e.g., most hearts in healthy humans pump blood effectively, so this one that doesn't is malfunctioning). It's different from SE ("failing its selected purpose"), but it *doesn't* collapse malfunction into "no function." The book contradicts its own point about medicine using CR. Doctors using CR *definitely* call a non-pumping heart diseased/malfunctioning! The book's claim here is simply wrong.

  ### 2. **Your Supervisor's Point: Correct and Important**
      Your supervisor is spot on. Directed evolution **is** a form of selection. When you select a variant *for* its catalytic activity (even if that selection pressure is artificial and applied in a tube over weeks), you *are* creating a selection history for that trait in that specific artificial population. A selected-effects theorist like Neander would readily say:
      *   The *proper function* of that enzyme variant is to catalyze Reaction X, because that is the effect for which it was selected.
      *   This directly counters the book's claim that SE can't handle lab creations. SE handles *selected* lab creations perfectly well. It struggles *only* with things that truly have *no* relevant selection history (e.g., the very first random molecule with catalytic activity that arose by pure chance before selection acted, or a purely designed robot part with no selection process).

  ### 3. **Your Hitchhiking Enzyme Case: A Perfect Test**
      *   **Selected-Effects (SE) Account:**
          *   The *proper function* of the variant is **NOT** catalysis. What was *selected for* was the plasmid's resistance marker. The catalysis was a *side effect* (a "free rider") during the selection process. It wasn't causally responsible for its own propagation; the resistance marker was.
          *   SE function is determined by *why* the trait was *maintained* by selection. Here, catalysis wasn't the reason it stuck around, the linked marker was. Therefore, catalysis is not its SE function. It might be a useful *effect*, but not its *function*.
          *   Your ignorance at the time is irrelevant. SE function depends on the *actual historical reason* for selection, not the *intentions* or *knowledge* of the selector.
      *   **Causal-Role (CR) Account:**
          *   **Yes**, catalysis **is** one of its functions. Within the larger system (e.g., the cell culture, or your experimental setup aiming to produce catalysts), the enzyme contributes the capacity to catalyze Reaction X. That's a causal role it plays.
          *   CR is context-dependent. You could also carve the system differently: within the system of "plasmid maintenance under antibiotic pressure," the variant contributes the capacity to... well, not get lost *despite* potentially being a metabolic burden, primarily due to its linkage. But its catalytic activity per se might not be the key causal role in *that* system description. CR allows for multiple functions depending on the system/capacity chosen.
          *   Your knowledge *can* influence how *you* choose to carve the system and assign a CR function. If your interest is "catalysts in this culture," catalysis is its CR function. If your interest is "genetic elements persisting under ampicillin," then its linkage is key.

  ### Conclusion: Settled View? No. Defensible Simplification? Partially. Howlers? Yes, Particularly the "Win Easily" and Malfunction Claims.

  *   **The Debate is Live:** Neither SE nor CR is universally accepted as "winning." They capture different, important intuitions about "function." SE excels at capturing biological teleology ("what it's *for*") and malfunction. CR excels at handling novel systems, multiple contributions, and provides a functional analysis framework useful in biology and engineering.
  *   **Book's Major Flaws:**
      1.  **"CR Wins Easily":** False. The debate is active and complex.
      2.  **Ignoring Selection History in Directed Evolution:** A critical omission that undermines its "no history" objection to SE for lab work. Your supervisor is correct; SE applies neatly to your *selected* variants.
      3.  **Misrepresenting Malfunction in CR:** CR accounts *can* define malfunction. The book contradicts its own point about medicine.
      4.  **Downplaying "Carving Up" Problem:** Context-dependence is a significant challenge for CR, not a neutral feature.
  *   **Why the Book Says It:** Popularization often demands clear winners and avoids nuance. CR *seems* more intuitive for non-evolved systems *if* you ignore artificial selection. Emphasizing CR aligns with a "modern" feel against "historical" views.
  *   **Relevance to You:** In enzyme engineering:
      *   When discussing variants *selected for* a specific activity, the **Selected-Effects** view provides the strongest foundation for claiming "its *function* is catalysis" – it was *selected* for that effect.
      *   When analyzing *how* an enzyme (natural or artificial) contributes to a larger biochemical system or process, **Causal-Role** analysis is invaluable.
      *   Your hitchhiker case perfectly illustrates the difference: SE denies catalysis is its proper function (it was a hitchhiker), while CR can assign it the function based on its current causal contribution to your catalytic system.

  **In short:** The book simplifies a live debate into a false victory for CR, misapplies the "no history" argument to lab work where selection history *is* present (via directed evolution), and misrepresents CR's ability to handle malfunction. Your PhD perspective and supervisor's insight highlight exactly where its argument crumbles. Both accounts have merit, and their applicability depends heavily on the specific context and question you're asking about "function."
