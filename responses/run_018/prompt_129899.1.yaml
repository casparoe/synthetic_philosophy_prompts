answer: |-
  That Pluto situation is a **perfect** case study for Wittgenstein's family resemblance concept, and it highlights fascinating tensions between scientific classification and how language/categories actually work. Let's break it down:

  **Pre-2006: Planets as a Classic Family Resemblance Category**

  Before the IAU vote, "planet" was essentially defined by overlapping similarities, *not* one strict essential feature:

  1.  **Orbits the Sun:** (Not another planet - so moons were out).
  2.  **Sufficient Mass for Roundness:** Roughly spherical due to self-gravity (distinguishing them from irregular asteroids/comets).
  3.  **"Significant" Size/Importance:** A vague, culturally loaded idea. Pluto was small, but bigger than known asteroids at the time of its discovery. Ceres was initially a planet but got demoted as more asteroids were found.
  4.  **Relative Isolation:** Planets were the "big players" in their zones, not part of dense swarms like the Asteroid or Kuiper Belts (though Pluto *is* in the Kuiper Belt!).

  Pluto fit some threads well (orbits Sun, round) but poorly on others (tiny size, not isolated - shares its zone with many KBOs, eccentric/inclined orbit unlike the "classical" planets). It was a marginal case, held in by tradition and the lack of many similar discoveries. Family resemblance explains this perfectly: Pluto shared *enough* overlapping features with Mercury/Jupiter/Earth to be grouped with them, even if it lacked the size or orbital dominance of the giants.

  **2006: The IAU Rule - Imposing an "Essential" Feature**

  The IAU definition introduced a **necessary and sufficient condition**: "Clears its neighborhood." This breaks the family resemblance model:

  1.  **Hard Boundary:** It creates a binary, all-or-nothing rule. Either an object dominates its orbital zone (like the big 8), or it doesn't (like Pluto, Ceres, Eris, etc.). No shades of gray, no overlapping similarities compensating for lack of this one feature.
  2.  **Demotes Marginal Cases:** Pluto clearly fails this *single* criterion. Its membership isn't revoked because it lacks roundness or doesn't orbit the Sun; it's revoked *solely* for failing this new, specific test.
  3.  **Ignores Other Similarities:** The rule disregards Pluto's roundness, atmosphere, complex geology, moons – features it shares with "planets." Under family resemblance, these *should* still count towards its planetary status, even if it lacks dominance.

  **Why Were People So Upset? Precisely BECAUSE of Family Resemblance!**

  Wittgenstein would *predict* this outrage. Here's why:

  1.  **Meaning is Use:** For decades, "planet" *included* Pluto in textbooks, mnemonics ("My Very Eager Mother..."), museums, and popular culture. The word's meaning was anchored in this established use, not a technical IAU definition. Changing it felt arbitrary, like redefining "chair" to exclude beanbags overnight.
  2.  **Loose Threads Mattered:** People intuitively recognized Pluto's *similarities* to other planets (round, orbits Sun, has moons/seasons) and felt it "belonged." The IAU's focus on one *new* criterion ("clears orbit") that Pluto lacked felt like ignoring all the reasons it *was* considered a planet. They valued the overlapping resemblances.
  3.  **Emotional Connection:** Categories aren't just logical; they carry cultural weight. Pluto was the "little guy," the underdog, the quirky one. Demoting it felt like kicking a family member out for an arbitrary rule, violating the sense of "family" Wittgenstein describes. It wasn't just a reclassification; it felt like a *loss*.
  4.  **The Problem of Marginal Cases:** Family resemblance acknowledges fuzzy boundaries. People intuitively grasp that Pluto is *like* a planet in important ways, even if it's not *exactly* like Jupiter. The IAU rule erased this nuance.

  **Formal Vote vs. Messy Categories: The Science/Language Tension**

  This is the core tension:

  1.  **Science Often Needs Precision:** Astronomers studying solar system dynamics *needed* a clear way to distinguish the dominant gravitational players (the 8) from the vast population of smaller bodies (asteroids, KBOs, comets). "Clears its orbit" is a useful *technical* criterion for their specific research questions (formation, dynamics). A fuzzy family resemblance definition is less helpful here.
  2.  **Wittgenstein's Point:** He argued categories in *natural language* (like "game," "chair," "planet" in everyday talk) derive their meaning from use and resemblance, not strict definitions. The IAU vote tried to impose a strict definition onto a term deeply embedded in natural language with its own established, resemblance-based meaning.
  3.  **Can They Coexist?** Yes, but it creates friction.
      *   **Specialized Language Games:** Within astronomy, the IAU definition creates a precise "language game" for professionals. They can use "planet" technically.
      *   **Broader Language Game:** In popular language, education, and culture, "planet" retains its older, broader, resemblance-based meaning. Hence, the ongoing debate and public affection for Pluto.
      *   **Pluto as a Test Case:** The controversy *shows* that even science can't fully control the meaning of terms rooted in natural language. The IAU definition solved a scientific problem but clashed with the public's language game.

  **What Pluto Does to Family Resemblance: Validation, Not Refutation**

  1.  **Pre-2006 Confirmation:** The pre-IAU situation perfectly illustrated family resemblance in action – a category held together by overlapping similarities without a single essence.
  2.  **Public Reaction Confirmation:** The intense public upset demonstrates the power of meaning-as-use and the emotional weight of resemblance categories. People cared *because* Pluto shared important family traits.
  3.  **Highlights the Limits of Strict Definitions:** The IAU rule, while scientifically useful for a specific purpose, feels artificial and exclusionary precisely *because* it violates the principle of family resemblance that underpins how we naturally categorize things like "planets."
  4.  **Shows Science Isn't Immune:** Scientific classification isn't magically separate from the messy realities of language and categorization. Scientists operate within language games too. The IAU vote was an attempt to *create* a new, stricter game for professional astronomy, but it couldn't erase the existing, broader game played by the public.

  **In essence:** Pluto didn't kill family resemblance; it proved its point spectacularly. The pre-2006 "planet" was a classic family resemblance category. The IAU definition imposed a necessary condition that broke that model for scientific clarity. The public outrage arose *because* people understood "planet" through family resemblance and meaning-as-use. The tension comes from science needing precise definitions for specific purposes, while natural language categories thrive on flexibility and overlapping similarities. Pluto remains the ultimate philosopher's stone for this debate – a celestial body caught between two ways of seeing the world.
