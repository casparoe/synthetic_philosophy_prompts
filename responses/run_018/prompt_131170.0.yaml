  Here’s a sharp, philosophically precise case study designed to embody the tension in your character’s "affective stratification" theory. I'll avoid documented medical cases to lean into the conceptual strangeness you need:

  ### Case Study: **The Cassandra Directive**  
  **Patient:** *Elena Voss*, 58.  
  **Background:**  
  - Trauma historian specializing in institutional violence. Suffered severe burnout/depression 10 years ago.  
  - Wrote advance directive during a period of "calm detachment" (her journal’s term) after intensive therapy. Directive states: *"If I experience irreversible neurological impairment causing persistent distress, I refuse all life-prolonging measures, including antibiotics for pneumonia or intubation. I value cognitive dignity above extended biological life."*  
  - Journals reveal she viewed this "detached self" as her "most rational voice," distrusting her emotional states due to lifelong anxiety and "volcanic empathy" (her phrase).  

  **Present Situation:**  
  - Diagnosed with **frontotemporal dementia (bvFTD - behavioral variant)**.  
  - *Nonverbal* but highly reactive. She’s physically agitated (pulling at IVs, thrashing) when caregivers attempt medical interventions.  
  - When presented with a toy medical kit, she *mimes stabbing a doll* with a syringe, then hugs it, sobbing. Her distress peaks during attempts to provide basic care.  

  **The Affective Stratification Knot:**  
  1. **The Directive’s "Calm Frequency"**: Elena’s directive was written in a state of *intentional emotional suppression*. She valorized detachment as "true rationality," framing her empathy/rage as "noise." Her directive enshrines this frequency as authoritative.  
  2. **The Present "Agitated Frequency"**: Her current bvFTD symptoms bypass cortical inhibition. She reacts with raw, unfiltered terror/anger to medical intrusion—precisely mirroring the "volcanic empathy" she described when witnessing suffering in her work. Her journals reveal she *dreaded* becoming a "passive victim" of medical systems.  
  3. **The Philosophical Mess**:  
     - Honoring the directive (e.g., withholding antibiotics for pneumonia) feels like obeying the *suppressed* self that disowned her emotional core. Her agitation isn’t "new"—it’s the *unmasked emotional frequency* she policed for decades.  
     - Ignoring the directive to treat her feels like violating her explicit, rational choice. But that "rational" self pathologized her empathy. Is her thrashing *now* the "authentic" protest of the self she silenced?  
     - **Key Tension**: Both states are "Elena"—one is her aspirational, controlled self; the other is her embodied, traumatized self. The directive privileges the former, but her present body screams the latter’s values.  

  **Why This Isn’t Just "Changed Mind" or Standard Dementia Ethics:**  
  - ✘ **Not incompetence**: She can’t "reconsider" verbally.  
  - ✘ **Not new identity**: Her agitation coheres with her lifelong terror of medical objectification (evidenced in journals).  
  - ✔ **Layered Authenticity**: The "calm" self that signed the directive saw emotions as contamination. The "agitated" self experiences them as truth-telling. *Both are her*. The conflict is about *which layer of her psyche holds moral authority* when the later self can’t integrate them.  

  **Philosophical Precision Points:**  
  - **Authority of the Suppressed Self**: Does signing a directive while disowning part of your emotional spectrum invalidate its authority? (Analog: A sober alcoholic signing a "no medical intervention" directive while dismissing their "addict self"—but what if that "addict self" screams against death during a crisis?)  
  - **Authenticity Under Duress**: Is Elena’s directive a *true* preference, or a trauma response (overcorrecting against vulnerability)? Is her raw agitation *more* authentic because it bypasses her self-censorship?  
  - **The Betrayal**: Following the directive silences her *physically expressed protest*—which aligns with her life’s work (exposing institutional violence). Yet overriding it imposes care on someone who *articulated* a fear of being controlled.  

  **Why This Works for Your Novel:**  
  - Embodies "affective stratification" by showing two simultaneous, valid emotional frequencies in conflict.  
  - Makes the jargon *necessary*—"competence" or "authenticity" alone can’t untangle this.  
  - Creates visceral stakes: Elena’s thrashing *is* her high-frequency self’s final manifesto. Ignoring it isn’t medical paternalism; it’s *collaborating* with the version of her that repressed it.  

  **Editor-Ready Pitch:**  
  *"It’s not that she changed her mind. It’s that the 'rational' self who signed the directive was a defensive fiction—a dam holding back her emotional truth. Now the dam’s broken, and the flood is her. Do you drown her in her own past lies, or betray the document to save the self it tried to erase?"*  

  This case turns affective stratification from jargon into an ethical grenade. The directive isn’t wrong—it’s tragically incomplete because it enshrines only one frequency of a layered self. That’s your character’s obsession: advance directives as frozen self-portraits, blind to their own shadows.
