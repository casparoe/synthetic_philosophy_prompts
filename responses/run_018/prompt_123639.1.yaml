answer: |-
  Here’s the spec sheet for a normative theory of collective memory vs. historical record, distilled to core requirements:

  **I. Core Cases Any Theory Must Adequately Address (Non-Negotiable):**
  1.  **"Factually Wrong but Socially Vital"**: E.g., Founding myths that bind a nation despite historical inaccuracies. *Requirement:* Theory must explain *when/if* sustaining such a myth is permissible or even obligatory (e.g., for social cohesion), and under what constraints (e.g., not actively suppressing counter-evidence).
  2.  **"Accurate but Harmful"**: E.g., Publishing archives revealing victims/perpetrators in fragile post-genocide societies, or culturally sensitive sacred knowledge. *Requirement:* Theory must provide criteria for *when* restricting access/promulgation of verified history is justified (if ever), balancing truth against tangible harm (not mere discomfort).
  3.  **"Conflict Over Salience"**: E.g., Disputes over whether slavery or states' rights was the *primary* cause of the US Civil War. *Requirement:* Theory must handle conflicts not about raw facts, but about *interpretation, weighting, and narrative framing*, acknowledging multiple valid perspectives without collapsing into relativism.

  **II. Essential Distinctions to Preserve (Non-Negotiable):**
  1.  **Correcting Error vs. Erasing Identity**: *Why:* Correcting a historical falsehood (e.g., "Our ancestors never owned slaves") must be distinguishable from actions that dismantle a group's core sense of self (e.g., banning all expressions of cultural heritage). Theory must protect identity-forming narratives *while* allowing critique.
  2.  **State-Mandated Forgetting vs. Organic Cultural Amnesia**: *Why:* Distinguish deliberate state suppression (e.g., Turkey's laws on Armenian genocide denial) from communities naturally shifting focus over generations (e.g., fading oral traditions). Theory must condemn the former as coercive, while acknowledging the latter as a complex cultural process.
  3.  **Mnemonic Sovereignty vs. Denialism**: *Why:* A community's right to shape its core narrative (e.g., Indigenous histories emphasizing resilience over victimhood) must be distinguished from rejecting well-established facts harmful to others (e.g., Holocaust denial). Theory must delineate legitimate narrative agency from harmful falsehoods that undermine justice.

  **III. Grounding Constraints (Non-Negotiable):**
  1.  **Compatibility with Group Cognition**: *Requirement:* Theory cannot rely *only* on individual psychology. Must account for emergent phenomena: how shared symbols, rituals, institutions, and intergroup dynamics shape collective memory distinct from individual recall (e.g., memorials anchoring shared meaning).
  2.  **Adherence to Basic Epistemic Norms**: *Requirement:* Theory cannot treat all narratives as equally valid *factually*. Must uphold truth as an ideal, allow for the identification of falsehoods (e.g., demonstrable historical inaccuracies), and explain how collective memory can *deviate* from history *without* granting epistemic equality to denialism.

  **IV. Key Tensions & Potential Conflicts:**
  1.  **Major Conflict Pair:** **Epistemic Norms (Truth) vs. Mnemonic Sovereignty (Narrative Rights)**. *The Core Challenge:* How can a theory simultaneously respect a community's right to its own empowering narrative (even if incomplete or emphasizing different facts) and uphold an obligation to correct demonstrable falsehoods, especially when those falsehoods harm others or distort shared history? *This is the central tension.*
  2.  **Post-Conflict "Structured Forgetting" Specifics**: Can respecting narrative rights *ever* justify deliberately *not* correcting the record ("structured forgetting") as "mnemonic reparation"? *Requirement:* Theory must rigorously define limits – e.g., perhaps only for immediate transitional justice where truth-telling would cause catastrophic violence, *never* as a permanent state, and *never* for facts central to perpetrator/victim justice. Most theories will find this extremely difficult to justify without violating epistemic norms or enabling future harm.
  3.  **Potentially Unsatisfiable Subset:** **Simultaneously achieving:**  
      *   **Strong Mnemonic Sovereignty** (Communities have near-absolute right to their narrative, even if factually flawed, for identity/agency).  
      *   **Strong Epistemic Norms** (All demonstrable falsehoods *must* be corrected, especially regarding harm/injustice).  
      *   **Harm Minimization** (Avoiding actions that cause severe social rupture/conflict, which correcting OR not correcting might do).  
      *A theory will likely need to prioritize/balance these, not satisfy all maximally.*

  **V. Requirement Most Disruptive to Liberal-Pluralist Answers:**
  *   **Adherence to Basic Epistemic Norms.** Liberal-pluralist approaches often prioritize narrative pluralism and cultural relativism, treating multiple narratives as equally valid expressions of identity/experience. The *non-negotiable requirement* to uphold truth as an ideal and distinguish factual falsehoods (especially denialism) fundamentally undermines this stance. It forces the theory to make difficult judgments about *which* narratives are permissible deviations from the historical record and which constitute harmful falsehoods that cannot be tolerated under the banner of pluralism.

  **Summary of Non-Negotiables vs. Camp Preferences:**
  *   **Non-Negotiable:** Addressing the 3 Core Cases, Preserving the 3 Essential Distinctions, Compatibility with Group Cognition, Adherence to Basic Epistemic Norms.
  *   **Camp Preferences / Areas for Balancing:** *How much* weight to give Mnemonic Sovereignty vs. Epistemic Norms in specific contexts; the *degree* of harm required to justify restricting true information; the *permissibility and limits* of "structured forgetting"; whether identity-preservation *ever* justifies sustaining known falsehoods.

  The theory must navigate the treacherous waters between respecting the profound social and psychological *functions* of collective memory and upholding the ethical and epistemological *imperatives* tied to the historical record, without collapsing into relativism or authoritarianism. The **Truth vs. Narrative Sovereignty** tension is the primary fault line.
