  After analyzing your cases, I propose the following principle to distinguish when sharp (single probability) or imprecise (interval or set) beliefs are appropriate. The core idea is that **sharp credence is licensed only when evidence uniquely determines a single probability value; otherwise, imprecise credence (represented by a set of probabilities) is required.** This principle is grounded in the *compatibility* of probability assignments with your evidence. Specifically:

  1. **Sharp Credence Condition**:  
     Assign a sharp probability \(p\) to event \(E\) if and only if:  
     - **Objective Chance (Chance-Driven)**: Your evidence specifies a known objective chance \(p\) for \(E\) (e.g., physical symmetries, well-understood randomness), or  
     - **Unique Evidential Determination (Evidence-Driven)**: Your evidence (e.g., frequencies, symmetries, or logical constraints) singles out \(p\) to the exclusion of all other values.  

     In both cases, every probability function compatible with your evidence assigns \(p\) to \(E\).

  2. **Imprecise Credence Condition**:  
     If no single \(p\) is uniquely determined (i.e., multiple probability values are compatible with your evidence), represent your belief as a set of probabilities for \(E\). This set is the **envelope of compatible probabilities**:  
     - It includes all values \(q\) such that some probability function consistent with your evidence assigns \(q\) to \(E\).  
     - For simplicity and practical robustness, represent this set as the closed interval \([a, b]\), where:  
       \[
       a = \inf\{q \mid \text{some compatible } P \text{ has } P(E) = q\}, \quad b = \sup\{q \mid \text{some compatible } P \text{ has } P(E) = q\}.
       \]  
     This interval captures the full range of uncertainty, avoiding arbitrary sharpening.

  ### Motivation from Your Cases
  - **Case 1 (Fair Coin)**: Sharp \(1/2\) by *objective chance* (evidence of fairness fixes the chance).  
  - **Case 2 (Stranger's Coin)**: Imprecise \([0, 1]\) because no evidence rules out any bias; symmetry alone doesn't force \(1/2\).  
  - **Case 3 (Lottery)**: Sharp \(1/100\) by *objective chance* (known random draw).  
  - **Case 4 (Urn)**:  
    - Red: Sharp \(1/3\) by *unique evidential determination* (exact frequency of red balls).  
    - Black: Imprecise \([0, 2/3]\) because evidence (unknown mix of black/yellow) allows any proportion of black balls.  
  - **Case 5 (Two Models)**: Imprecise \([0.3, 0.7]\) because evidence (conflicting models) doesn't single out one probability; the set of compatible probabilities is \(\{0.3, 0.7\}\), and the interval is its envelope.  
  - **Case 6 (Letter "e")**:  
    - No initial evidence: Imprecise \([0, 1]\) (all values compatible).  
    - After observing English: Imprecise narrow interval (e.g., \([0.10, 0.15]\)) based on typical frequencies.  
    - After tallying: Sharp value (evidence determines unique frequency).  
  - **Case 7 (Decision-Making)**: Not a direct belief judgment, but follows naturally:  
    - Imprecise intervals constrain high-stakes decisions (require robustness across all values).  
    - Sharp or narrow intervals allow simplification in low-stakes choices.

  ### Addressing Inconsistencies and Refinements
  Your instinct in Case 5 (two models) is correct but initially seems inconsistent with Case 2 (stranger's coin). The principle resolves this:  
  - **Case 5**: Evidence (two models) doesn't determine a unique probability, so imprecision is required. The interval \([0.3, 0.7]\) represents the envelope of \(\{0.3, 0.7\}\).  
  - **Why not split the difference?** Averaging to \(0.5\) would ignore the conflict; the interval preserves uncertainty without arbitrarily privileging one model.  
  - **Why an interval and not \(\{0.3, 0.7\}\)?** The interval \([0.3, 0.7]\) is the *convex hull* of the set, ensuring decisions account for all intermediate risks (e.g., in Case 7, high-stakes choices require considering the worst-case within the interval). Discrete sets are less robust for decision-making.

  Your rough principle (sharp for known chances or uniquely determined values) is partially correct but oversimplifies:  
  - **What it misses**: It doesn't specify how to handle conflicts (e.g., Case 5) or ignorance (Case 2). The envelope condition formalizes "compatibility with evidence."  
  - **What it gets right**: Objective chances and unique determination yield sharp beliefs (Cases 1, 3, 4-red).

  ### Application to a New Case
  **Case 8: Coin with Two Possible Biases**  
  - A coin is biased 2:1 toward heads or 2:1 toward tails (exactly one bias exists), and you know nothing about which bias.  
  - **Analysis**:  
    - No objective chance (bias is unknown).  
    - Evidence doesn't single out one probability: compatible probabilities are \(1/3\) (if biased toward tails) and \(2/3\) (if biased toward heads).  
    - Set of probabilities: \(\{1/3, 2/3\}\), with envelope \([1/3, 2/3]\).  
  - **Verdict**: Imprecise interval \([1/3, 2/3]\).  
  - **Why not sharp \(1/2\) by symmetry?** Symmetry applies to *which bias exists* (equally likely), but not to the *event of heads itself*. Your evidence doesn't determine \(P(\text{heads})\); it only constrains it to \(\{1/3, 2/3\}\). Forcing \(1/2\) would ignore the conflict in probabilities, much like averaging in Case 5.

  ### Boundary: Difference in Kind or Degree?
  The boundary between sharp and imprecise belief is **a difference in kind**, with **imprecision varying by degree**:  
  - **Kind**: Sharp beliefs arise only when evidence *uniquely determines* a probability. Imprecise beliefs occur when evidence is *compatible with multiple probabilities*. This is binary: either uniqueness holds or it doesn’t.  
  - **Degree**: Imprecision itself has degrees, captured by the width of the interval (e.g., \([0,1]\) vs. \([0.3,0.7]\)). Narrow intervals reflect mild uncertainty; wide intervals reflect deep ignorance or conflict.  
  - **Why not "unperformed arithmetic"?** Imprecision isn’t just incomplete calculation (Case 6: tallying sharpens the interval). It’s *evidential underdetermination*: if no evidence can resolve the conflict (e.g., Case 5, stranger's coin pre-flips), imprecision persists.

  ### Final Principle
  **Summarized**:  
  - **Sharp if**: Evidence implies a unique probability (via chance or evidential uniqueness).  
  - **Imprecise if**: Evidence allows multiple probabilities; represent as \([a, b]\), the infimum/supremum envelope of compatible values.  

  This captures all your cases, resolves inconsistencies (e.g., Case 5 vs. Case 2), and explains why symmetry alone (Case 2, Case 8) doesn’t force sharpness. It also validates your Case 7 intuition: intervals are normatively required for high-stakes decisions under unresolved uncertainty.
