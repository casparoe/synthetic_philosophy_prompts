  **Setup:**  
  Participants form pairs. Each pair receives two sealed envelopes: one labeled "Sender" containing three possible messages (e.g., "The window is open", "It's cold in here", "I see a bird") and a hidden goal implicature (e.g., "Close the window"); the other labeled "Receiver" containing three possible actions (e.g., close window, put on sweater, ignore) and a hidden goal action (e.g., close window). Sender must choose a message that, by violating Quantity (e.g., being indirect), triggers the exact implicature for the Receiver's goal action. Pairs cannot discuss intentions.

  **Rules/Payoff:**  
  Each round, Sender picks one message to send. Receiver hears it and chooses one action. If Receiver’s action matches both players’ hidden goals (pre-assigned to align), the pair scores 3 points. If it matches only Sender’s goal (action happens but not the receiver's intended one), Sender gets 1 point. If it matches only Receiver’s goal (action happens but sender didn't intend it), Receiver gets 1 point. Mismatches yield 0. Players know goals are sometimes misaligned (randomly assigned per round: 70% aligned, 30% opposed). After 4 rounds, pairs rotate partners.

  **Sample Round:**  
  Sender’s goal: get window closed. Messages: "The window is open" (too direct, violates Quantity?), "It's cold in here", "I see a bird". Receiver’s goal: close window (aligned). Sender picks "It's cold in here", violating Quantity by underinforming. If Receiver infers "close window" and acts, pair scores 3. If Receiver puts on sweater (literal response), Sender gets 1 (action matches sender's goal) and Receiver 0 (not their goal? Wait, in aligned goals, both goals are the same. Correction: In aligned rounds, both have the same goal. In opposed, goals conflict). In opposed round, if Sender wants window closed but Receiver wants sweater on, and Sender says "It's cold", Receiver might close window (Sender happy, gets 1; Receiver fails goal, gets 0) or put on sweater (Receiver gets 1, Sender gets 0).

  **Debrief:**  
  When coordination fails (e.g., Receiver acts literally), highlight cancellability: Sender could say "It's cold but don't close the window" without contradiction, showing the implicature isn't part of sentence meaning. When it succeeds, note non-detachability: same implicature arises from different utterances (e.g., "Brr!" or "My hands are freezing") if context supports it. Failed pairs often assumed shared knowledge that wasn't present (e.g., Receiver didn’t know Sender hates drafts), breaking the calculability chain.

  **Limitation:**  
  The activity cannot reproduce the normative aspect of Gricean cooperation: participants are adversarial (hidden agendas) or self-interested, whereas Grice assumes mutual cooperative intent. This distorts the "voluntary" nature of implicature generation and may overemphasize strategic deception over natural inference.

  **Confidence Level:**  
  I'm about 85% sure this design achieves the pedagogical goal. The least confident bit is the payoff structure's ability to cleanly isolate Quantity violations from other maxims (e.g., "It's cold" might violate Relation if context is unclear).
answer: |-
  **Setup**  
  Pairs receive role cards: one Speaker (hidden goal: e.g., "make partner turn on fan"), one Hearer (hidden goal: e.g., "turn on fan" or conflicting "open window"). Each also gets a context card (e.g., "Room is hot and stuffy") and a list of utterance options violating Quantity by design—e.g., "It’s warm," "I’m sweating," "The AC exists." Goals align (70%) or conflict (30%); players know alignment odds but not their specific match.

  **Rules/Payoff**  
  Speaker selects one utterance. Hearer performs one action (e.g., turn on fan, open window, do nothing). If Hearer’s action matches *both* goals (aligned case), both score 3 points. If action matches only Speaker’s goal, Speaker scores 2, Hearer 0; if only Hearer’s goal, Hearer scores 2, Speaker 0. Total mismatch: both get 0. After 3 rounds, roles swap. Points track individual success, forcing strategic implicature design.

  **Sample Round**  
  Context: Broken plate on floor. Speaker’s goal: "make Hearer fetch broom." Hearer’s goal: "fetch broom" (aligned). Utterances: "The plate is in pieces," "Floor needs attention," "Cleanliness matters." Speaker picks "Floor needs attention" (violates Quantity by omitting broom reference). If Hearer fetches broom (inferring need for cleanup), both score 3. If Hearer wipes counters (literal "attention"), Speaker scores 2 (goal met), Hearer 0 (goal missed).

  **Debrief**  
  Failed rounds (e.g., Hearer wiping counters) demonstrate *cancellability*: Speaker could add "…but don’t get the broom" without contradiction, proving the implicature ("fetch broom") isn’t semantic. Successful rounds show *non-detachability*: different utterances (e.g., "What a mess") could imply the same action if context permits. Miscalculations occur when shared assumptions (e.g., "broom is default cleanup tool") are absent, breaking calculability.

  **Limitation**  
  The game cannot replicate Grice’s *mutual cooperative principle*. Participants strategize selfishly (e.g., exploiting ambiguity in conflicting goals), whereas genuine implicature relies on presumed goodwill to resolve underinformativity. This distorts the altruistic "coordination without contracts" dynamic central to Gricean pragmatics.

  **Confidence & Uncertainty**  
  I’m 80% sure this works pedagogically. Least confident: the payoff scheme’s clarity in isolating *Quantity* violations (e.g., "Floor needs attention" might be misattributed to Relation violations if context is ambiguous). Testing with props (e.g., physical action cards) might mitigate this.
