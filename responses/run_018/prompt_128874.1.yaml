prompt: |-
  I've been fighting with my roomate lately about whether saying 'nice one' right after they drop a plate counts as lying or just sarcasm, and now I'm weirdly obsessed with Grice's split between speaker meaning and sentence meaning. I'm running a philosophy workshop — about 13 people, mostly undergrad, one 70-minute session — and I wanna design an in-class game that makes them feel implicature being calculated rather than decoded, not just named.

  To avoid the tired 'some students failed' example, I'm injecting an adversarial twist: pairs have hidden agendas and must deliberately violate Grice's Quantity maxim while still banking on their partner recovering exactly one targeted implicature; the payoff should use points not cash, and coordination should actually fail when someone miscalculates. Give me the setup, the rules with payoff scheme, a sample round, a debrief that maps the failures onto cancellability and non-detachability, and an honest note on which feature of Gricean speaker meaning the activity just cant reproduce. Structure it in exactly five sections — setup, rules/payoff, sample round, debrief, limitation — each a short paragraph, no intro and no wrap-up. Also say how sure you are about the whole design and point out the specific bit you're least confident in.
