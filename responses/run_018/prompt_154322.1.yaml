answer: |-
  Here is the speaker's defense sheet for your presentation on "Threshold Asymmetry," structured to address the interdisciplinary audience effectively:

  ---

  **THRESHOLD ASYMTERY: SPEAKER DEFENSE SHEET**  

  **Core Concession at Outset:**  
  *"I concede that standard infinite ethics frameworks (e.g., extensions of utilitarianism to infinite worlds) generate paralyzing obligations or require ad-hoc solutions like causal finitism. My proposal doesn’t resolve all infinitary paradoxes but isolates a specific structural feature—patient density—that transforms the problem."*  

  **Ordered Objections & Rebuttals:**  
  1.  **Decision Theorist (Cardinality/Objectivity):**  
      *"Your threshold depends on the *expected density* of moral patients. But in an infinite universe, density is measure-dependent—e.g., under a non-isotropic measure favoring observer-rich regions, your 'threshold' becomes arbitrary. This replicates the Bostrom-Singpurwalla problem for infinite ethics."*  
      **Genuine Force:** High.  
      **Reply:** *"Agreed—density must be defined relative to a causally accessible metric (e.g., entropy-constrained volume). Crucially, for *any* fixed measure, a density threshold exists where action-omission asymmetry collapses. Governance should use the most conservative *plausible* measure (e.g., Tegmark’s Level IV multiverse)."*  

  2.  **Longtermist Philosopher (Paralysis Avoidance):**  
      *"If infinitesimal risks of suffering in infinite spaces still dominate expected utility, haven’t you merely replaced ‘infinite paralysis’ with ‘threshold-triggered paralysis’? Obligations remain binary and maximal beyond your threshold."*  
      **Genuine Force:** Medium.  
      **Reply:** *"No—below-threshold, proportionality holds: small risks warrant limited resources. Above-threshold, obligations *shift* to requiring *precaution* (e.g., halting expansion until risks are bounded), not infinite sacrifice. We avoid paralysis by focusing on institutional precommitments (e.g., ‘suffering safeguards’ for AGI) rather than individual calculus."*  

  3.  **Cosmologist (Scale Skepticism):**  
      *"Moral ‘density’ imports terrestrial intuitions to domains where consciousness may be unrecognizable or non-phenomenal. Assigning *any* weight to hypothetical causal domains is speculative anthropomorphism."*  
      **Genuine Force:** Moderate.  
      **Reply:** *"I require only that (1) consciousness supervenes on physical states, and (2) we assign nonzero probability to its emergence in domains satisfying physical prerequisites (e.g., complex causality). We need not specify *what* consciousness ‘looks like’—only that its *possible* existence mandates precaution under my threshold logic."*  

  4.  **Decision Theorist (Threshold Instability):**  
      *"Your threshold is sensitive to tail probabilities. If the distribution of patient-density has heavy tails (e.g., power laws from cosmic inflation), expected density may be undefined or infinite *regardless* of your threshold—resurrecting paralysis."*  
      **Genuine Force:** High.  
      **Reply:** *"This is critical. I assume *light-tailed* distributions (e.g., exponential decay) for density uncertainty. If heavy tails hold, we must apply dominance principles: avoid strategies with non-infinitesimal risk of infinite suffering. This *still* justifies risk-averse governance without demanding infinite resource allocation."*  

  5.  **Philosopher (Deontic Shift Justification):**  
      *"Why should crossing a statistical threshold convert a scalar obligation into a categorical one? This seems like a mathematical artifact without ethical foundation."*  
      **Genuine Force:** Low.  
      **Reply:** *"The shift mirrors phase transitions in decision theory (e.g., Pettigrew’s ‘riskiness’). Below threshold, omissions are permissible gambles; above, they become *dominated* strategies under any bounded utility function. The ‘categorical’ obligation is instrumental: avoiding guaranteed net harm."*  

  **Make-or-Break Reply (Must Succeed):**  
  **The threshold transforms structural infinity from a *scalar* problem (infinite sum) to a *geometric* one (percolation of harm).**  
  *"In infinite spaces with sub-threshold density, suffering is locally containable; above threshold, it percolates unavoidably. This discontinuity isn’t ad-hoc—it arises from the topology of causally connected regions, making obligations *robust* to cardinality worries."*  

  **Weakest Point (Actively Defend):**  
  **Operationalizing "density" across cosmological scales.**  
  *"I propose using entropy-accessible volume per unit comoving time. While imperfect, this aligns with how cosmologists model observer density (e.g., in Drake equation variants). Crucially, *any* density metric with causal significance generates the threshold effect—dispute the metric, not the mechanism."*  

  **Objection You Hope No One Raises:**  
  *"If suffering can be unboundedly intense (e.g., supertasked agony), then *even one* patient could demand infinite resources, making density irrelevant and collapsing your framework back into paralysis."*  
  **Why Dreaded:** Undercuts the core innovation (density-dependence) by recentering intensity over numerosity.  
  **Contingent Reply:** *"Bounded suffering per patient is a plausible prior—even if wrong, density thresholds apply to *net expected suffering*, which remains discontinuous if intensity/density are coupled."*  

  ---

  **Tactical Summary:**  
  - **Concede early** the failures of standard infinite ethics to preempt "ad-hoc" accusations.  
  - **Anchor replies** in the *structural inevitability* of phase transitions (decision theorists) and *institutional remedies* (philosophers).  
  - **Redirect cosmologists** to probabilistic necessity ("nonzero probability → precaution") rather than ontology.  
  - **Defend density metrics** aggressively—this is the linchpin. If the threshold isn’t cosmologically meaningful, the argument fails.  
  - **Signal openness** to refining the threshold’s technical definition (e.g., with measure theory) to co-opt critics.
