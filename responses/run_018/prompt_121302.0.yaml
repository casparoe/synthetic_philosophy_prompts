  Okay, the user is working on a term paper proposal about the Death in Damascus paradox for a decision theory seminar. They want the proposal to frame the debate rather than survey positions. Their core idea is that the paradox arises from agent self-knowledge rather than decision rules. Let me unpack their requirements.

  First, they've identified four separable features in the standard case: predictor reliability, agent self-knowledge, alternative decision methods, and value structure. Their hunch is that feature #2 (self-knowledge) is the key destabilizing factor. The proposal needs to transform this into a precise research question. 

  The challenge is formulating a testable hypothesis. Something like: "Does removing self-predictive ability resolve the instability while varying other factors doesn't?" But the user wants it narrower. Maybe: "The distinctive choice instability persists iff the agent can predict their own choice, regardless of predictor reliability or value asymmetries." That isolates variable #2 as necessary/sufficient.

  Now for the literature gap. The user mentions three standard approaches without naming them:
  - Causal decision theorists (CDT) would say go to the nicer city since your choice doesn't affect the predictor
  - Evidentialists (EDT) face instability because your choice evidences where the predictor is
  - Ratificationists might recommend randomizing or pre-commitment

  The key is showing all these implicitly assume full self-transparency. CDT's "simple answer" ignores that an agent who knows she'll follow CDT can foresee disaster. Evidential approaches bake in self-knowledge from the start. So existing debates don't isolate the self-knowledge variable.

  For methodology: constructing case variants. Need to:
  1. Break each feature into discrete levels (e.g., reliability: perfect vs. 99% vs. type-based)
  2. Design orthogonal combinations (e.g., high reliability + no self-prediction vs. low reliability + full self-prediction)
  3. Define "instability" operationally: Does the agent have a decisive choice? Does intention align with action? Do multiple decision rules agree?

  But how to test without begging intuitions? The user's worried about this. Maybe:
  - Use revealed preferences: Would agents pay to remove self-knowledge? 
  - Check for stable solutions across iterations (if agent rethinks, does she flip-flop?)
  - See if adding randomization tools resolves paradox only when self-knowledge is present

  Positive result: Instability disappears only when self-prediction is blocked, even with perfect predictors or infinite disvalues. Failure would be if reliability or value structures independently cause instability. Given the user's hunch, they should brace for failure - this might be harder to prove than expected.

  Scope management: At 6k words, must avoid:
  - Digressions into Newcomb's or other paradoxes
  - Technical decision rule comparisons
  - Philosophy of mind debates about self-knowledge
  Minimal version: Focus just on contrasting self-knowledge vs. reliability, holding other factors fixed. Drop value structure and randomization tools if needed.

  Contested points: 
  - Uncontroversial: The basic Death in Damascus setup
  - Contested: Whether self-knowledge is a bug or feature (CDT vs. EDT divide)
  - Unsettled: How much self-prediction is possible/necessary for agency

  Need to flag these without lit review. For example: "While predictor reliability is often debated, the proposal's focus on agent self-transparency engages a less examined presupposition shared by multiple decision-theoretic camps."

  The challenge will be arguing cleanly when intuitions about cases are precisely what's disputed. The methodology section must preempt this by defining "instability" behaviorally rather than phenomenologically.
answer: |-
  ## Proposal: The Instability Core of Death in Damascus  
  **Agency, Self-Knowledge, and the Paradox of Prediction**

  ### 1. Research Question
  The paradox of Death in Damascus (DiD) appears to reveal a deep instability in rational choice under prediction. This project asks:  
  **Is the distinctive instability in DiD — where agents cannot rationally intend or execute a seemingly optimal choice — primarily generated by the agent’s capacity for self-prediction, rather than by properties of the predictor, decision rule, or value structure?**  

  More precisely:  
  *The instability (understood as the agent’s inability to form a stable intention to choose the "nicer city" without thereby guaranteeing a worse outcome) persists if and only if the agent can reliably predict her own choice. This instability is invariant under changes to predictor reliability, available decision-settling methods, or finite payoff asymmetries. Removing self-predictive capacity eliminates the instability, even if other features remain unchanged.*  

  ### 2. Why the Obvious Answers Fall Short
  *   **The Causalist Reply ("Go to Damascus")**: While correct that *your choice doesn’t cause the predictor’s past action*, this ignores the epistemic trap. An agent who knows she will *actually choose* Damascus can deduce the predictor is already there, making staying in Aleppo fatal. The recommendation collapses if the agent believes she will follow it. The causalist solution is only stable for agents *unable* to predict their own compliance with it.  
  *   **The Evidential/Ratificationist Reply ("Randomize or Reject Fixed Predictions")**: These correctly identify the feedback loop but misattribute its source. They treat the instability as inherent to *evaluating choices against fixed evidence* (evidentialism) or *requiring self-endorsement* (ratificationism). Yet if self-prediction is removed, this loop vanishes: an agent who doesn’t know what she’ll choose *can* rationally intend Damascus, as her intention provides no evidence about the predictor’s location. The loop isn’t fundamental to these decision rules; it’s enabled by self-transparency.  
  *   **The "Bad News" Reply**: Treating the prediction as mere evidence ignores that the agent’s knowledge of her *own disposition* is what makes the evidence damning. Without self-prediction, the predictor’s reliability is just statistical knowledge, not a direct epistemic constraint on intention formation. The instability arises from the agent’s *self-applied* knowledge, not the predictor’s existence alone.  

  **The Gap**: All above approaches presuppose or build in agent self-transparency. They fail to isolate whether instability stems from the *decision rule itself* or the *agent’s knowledge of her own rule-following*.  

  ### 3. Method: Isolating Variables through Case Variants  
  To test the hypothesis, I will construct controlled variants of DiD, systematically varying one feature while holding others fixed. "Instability" is operationalized as:  
  *(i) The agent cannot rationally form/retain an intention to choose the payoff-superior city;  
  (ii) Attempting to follow standard decision rules (e.g., CDT) leads to predictable self-undermining.*  

  **Variants for Isolation**:  
  1.  **Self-Knowledge (Key Variable)**:  
      *   *High*: Agent knows her decision procedure perfectly and can deduce her choice now.  
      *   *Low*: Agent knows the predictor’s reliability but cannot access/calculate her own procedure’s output (e.g., she faces genuine uncertainty about what she’ll "see herself doing" when deciding).  
      *   *Test*: Does instability vanish *only* in the *Low* condition, even with a perfect predictor, no coin, and large payoff asymmetries?  

  2.  **Predictor Reliability**:  
      *   *Perfect*: Predictor is infallible.  
      *   *High but Fallible* (e.g., 99% accurate).  
      *   *Type-Based*: Predictor reliable only for "agents like you," not specifically *you*.  
      *   *Test*: If instability persists in all variants when self-knowledge is *High*, but vanishes in all when self-knowledge is *Low*, reliability isn’t the driver.  

  3.  **Alternative Decision-Settlers**:  
      *   *Baseline*: Only "direct" decision-making.  
      *   *With Coin/Delegate/Pill*: Agent can use a randomizer or commit device.  
      *   *Test*: Do these *only* resolve instability when self-knowledge is *High*? If they work even when self-knowledge is *Low*, they aren’t necessary for stability.  

  4.  **Value Structure**:  
      *   *Death as -∞*: Death has infinite disvalue.  
      *   *Death as Large Finite Disvalue*: Death is bad but finite; payoffs are asymmetric.  
      *   *Symmetric Payoffs*: Cities are equally nice; only death differs.  
      *   *Test*: Does instability persist in symmetric cases with *High* self-knowledge? Does it vanish with finite death + large asymmetries if self-knowledge is *Low*?  

  **Avoiding Question-Begging**: Intuitions about "paradoxicality" are unreliable. Instead, variants are evaluated based on:  
  *   **Consistency of Intention**: Can the agent *coherently intend* the payoff-superior action?  
  *   **Predictable Self-Undermining**: If the agent intends Damascus, does this knowledge *reliably* lead her to abandon it or get a bad outcome?  
  *   **Decision Rule Output**: Does the rule (e.g., CDT) yield a *clear, executably stable* recommendation?  
  Failure on these criteria = instability. Success = stability.  

  ### 4. Outcomes and Expectations  
  *   **Positive Result**: Instability is *exclusively* observed in cases with *High* self-knowledge, regardless of other variations. Removing self-prediction consistently yields stable intentions and non-self-undermining decisions. This supports the hypothesis that self-knowledge is the core driver.  
  *   **Failure**: Instability persists in some cases with *Low* self-knowledge (e.g., with type-based predictors), or disappears in some cases with *High* self-knowledge (e.g., with coins). This suggests other factors are necessary/sufficient.  
  *   **Expectation**: Brace for **qualified success/failure**. Demonstrating that self-knowledge is *necessary* for instability is plausible. Proving it is *sufficient* under all variations (especially with complex value structures) is harder. The most likely failure point is showing that instability *always* vanishes without self-prediction.  

  ### 5. Scope and Feasibility  
  *   **Core Focus (Non-Negotiable)**: Rigorously testing the 4-feature matrix against the stability criteria. Must prioritize constructing and analyzing variants over exhaustive literature engagement.  
  *   **Likely Cuts**:  
      *   Deep dives into specific decision rules (CDT/EDT/ratificationism) beyond what’s needed to apply stability criteria.  
      *   Metaphysical debates about foreknowledge/fatalism.  
      *   Extended comparison to Newcomb’s Problem.  
  *   **Expansion Risks**:  
      *   Value structure variations could spiral (e.g., exploring diminishing returns or risk-aversion). *Limit: 2-3 clear finite-disvalue models.*  
      *   Defining "self-knowledge" precisely risks philosophy of mind tangents. *Limit: Operate with minimal, procedural definitions (e.g., "can compute output now").*  
  *   **Minimal Valuable Version**: Focus solely on contrasting *High* vs. *Low* self-knowledge under a *perfect predictor* and *finite disvalues*. Argue that this variation alone determines stability, making other features secondary. (6,000 words achievable).  

  ### 6. Mapping the Contested Terrain  
  *   **Uncontroversial**:  
      *   DiD involves a predictor with high reliability.  
      *   Standard CDT recommends going to the nicer city.  
      *   Agents with full self-knowledge face a conflict in the case.  
  *   **Contested (Where Your Hunch Engages)**:  
      *   *Against Strong Currents*: Many hold that the paradox reveals a flaw in *causal decision theory itself* (requiring ratificationism or EDT). Your hypothesis challenges this, suggesting the flaw is in *agency assumptions*, not CDT.  
      *   *Restating Accepted Ideas?* While self-prediction is acknowledged, its role as the *necessary and sufficient condition for instability* is not consensus. Most treatments see it as one factor among many.  
      *   *No Settled Opinion*: The field lacks agreement on whether instability persists under *Low* self-knowledge with perfect predictors, or whether *High* self-knowledge alone guarantees instability regardless of other features. Your project targets this gap.  

  This proposal isolates a testable hypothesis about the source of DiD’s instability, leveraging controlled case variation to move beyond entrenched debates. Success would reframe the paradox as a constraint on possible agents rather than a failure of decision rules.
