prompt: |-
  hey, writing my diss chapter on double effect and trolley-style cases and im completely stuck on aquinas's passage in the Summa about killing in self-defense. he argues that saving your own life can justify causing an aggressor's death, but only if you dont intend that death as your means and only if the defense is proportianed to the danger. then he slips in this comparison to public authority executing criminals, which makes it seem like the permission hangs on having the right kind of juristiction over someone else's life.

  what im trying to undrestand is whether proportianed here is a mental-state constraint — like, dont will more harm than is necessary — or a causal-structure constraint — like, the death has to come about as a side-effect rather than being the mechanisim by which you survive. theres a strange reading i ran across in a 1920s manual that treats proportionality as modal robustness: the defense must be such that in nearby possible worlds where the aggressor doesnt die, you still survive. that sounds like it was made up, but i cant tell if aquinas's text actually supports it.

  so my question is: when aquinas allows self-defense, is the wrongness of pushing the fat man onto the tracks to stop the train mainly about lacking authority over the victim, or about the fact that his body is literally the causal break? and does the proportion clause help decide between those two? my adviser thinks im overthinking it but i genuinely cant parse the logic. any help?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're writing a dissertation chapter on double effect and trolley cases, specifically stuck on Aquinas's passage in the Summa about killing in self-defense. The key points they mentioned are Aquinas's conditions: that saving one's life justifies causing an aggressor's death only if you don't intend that death and the defense is proportionate. They also note Aquinas's comparison to public authority executing criminals, which introduces the jurisdiction element. 

  The user is confused about whether "proportionate" is a mental-state constraint (not willing more harm than necessary) or a causal-structure constraint (death as a side-effect). They mention a 1920s manual that interprets proportionality as modal robustness—if the aggressor doesn't die in nearby possible worlds, you still survive. They wonder if Aquinas's text supports that. Their main question is whether the wrongness in the fat man trolley case is due to lacking authority or the causal mechanism, and if proportionality helps decide.

  First, I need to recall Aquinas's exact text in ST II-II, Q64, A7. He says that an act can have two effects: saving oneself and killing the aggressor. The intended effect is self-preservation, while the death is unintended but foreseen. The act must be proportionate to the end. The public authority comparison suggests that private persons can't intend death, but public authority can. 

  The user's confusion lies in interpreting "proportionate." They present three possibilities: mental state, causal structure, or modal robustness. The modal robustness idea from the 1920s manual is interesting but probably anachronistic. Aquinas was working within Aristotelian causality, not possible worlds semantics. 

  Looking at the causal structure, Aquinas uses the example of striking back to stop the aggressor. The death is a side effect. If the only way to stop the aggressor is by killing them directly (like pushing the fat man), that might not fit because the death is the means. Proportionality here likely means the defensive force used is necessary and not excessive. If there's a way to disable without killing, that should be chosen. 

  Regarding jurisdiction, Aquinas mentions public authority's right to execute, contrasting it with private self-defense. So in the fat man case, even if the causal structure were similar (though it's not), lacking authority makes it impermissible. Both elements are intertwined: without authority, intending death isn't allowed, and the causal means becomes direct killing. 

  The user’s advisor thinks they're overthinking, but the nuances matter for their dissertation. They need to show that Aquinas's proportion clause is about the act's nature (causal) and intent (mental), while jurisdiction sets the context for when intending death is permissible. The fat man case fails both: no authority, and death is the direct cause. 

  I should also address the modal robustness point. The 1920s manual's interpretation isn't supported by Aquinas's text. He focuses on the act's per se effects, not counterfactuals. Proportionality is about the actual force used being necessary, not hypothetical scenarios. 

  In conclusion, the user needs to see that Aquinas's conditions are interconnected. The fat man is wrong because of both causal structure (death as means) and lack of jurisdiction. Proportionality ties into both by requiring the defensive act to be necessary and not excessive, which relates to causal means and mental state of not intending more harm than needed.
answer: |-
  You've hit on a crucial ambiguity in Aquinas (ST II-II, Q64, A7) that fuels contemporary debates! The passage is notoriously dense, and your adviser's comment likely stems from Aquinas's own conciseness, not your overthinking. Let's break down the elements relevant to your questions about proportionality, intention, causal structure, and jurisdiction in self-defense vs. the Fat Man trolley case:

  1.  **Aquinas's Core Argument:**
      *   **The Act:** An act (e.g., repelling force) can have a **double effect**: preserving one's own life (good) and killing the aggressor (evil).
      *   **Intention Constraint:** The good effect (self-preservation) must be intended; the evil effect (killing) must *not* be intended - neither as an end nor *as a means* to the good end. ("*non intendatur occisio hominis*")
      *   **Proportionality Constraint:** The act must be "*proportio ad finem*" (proportioned to the end). The "end" here is self-preservation.
      *   **The Jurisdiction Gloss:** Aquinas *immediately* contrasts this private self-defense with public authority: "Therefore this act, since one's intention is to save one's own life, is not unlawful, *seeing that it is natural to everything to keep itself in 'being' as far as possible.* **However, since it is unlawful to kill a man except by the public authority acting for the common good...**" (emphasis added).

  2.  **Interpreting "Proportionate to the End":**
      *   **Mental-State Constraint (Minimal Force/Necissity):** This is the dominant, traditional interpretation. "Proportioned" means using no more force than is *necessary* to achieve the good end (saving your life). You shouldn't kill if wounding would suffice; you shouldn't use a cannon against a knife. Your *will* should aim only at stopping the threat with minimal necessary harm. This fits Aquinas's focus on intention and his "as far as possible" clause.
      *   **Causal-Structure Constraint (Side-Effect):** Proportionality *reinforces* the causal structure implied by the intention constraint. The force used must be primarily *defensive* (repelling, stopping), causing death only as an *unavoidable side effect* of that necessary defensive action. Using force *specifically designed* to kill, even if minimally so, likely violates both intention and proportionality. The means must be inherently defensive, not homicidal.
      *   **The 1920s Modal Robustness Reading:** This ("in nearby worlds where the aggressor doesn't die, you still survive") is almost certainly an anachronistic projection. Aquinas operates within Aristotelian efficient/final causality, not modern modal logic. It *doesn't* fit his examples or the text. Consider his paradigm: striking back to repel the aggressor. In many "nearby worlds" where that strike *doesn't* kill (e.g., if it's weaker, misses a vital spot, aid arrives), you *do* still survive. But the crucial point Aquinas makes is that *in this world*, that specific act, done with necessary force, *caused* death as a foreseen but unintended side effect. The constraint is on the nature and necessity of *the act performed*, not on counterfactual robustness. This reading seems unsupported by the text.

  3.  **The Fat Man Trolley Case & Aquinas:**
      *   **Why Pushing the Fat Man is Wrong (Aquinas Lens):**
          *   **Causal Structure/Intention:** Pushing the Fat Man *uses his death* as the direct, intended causal mechanism to stop the trolley. His body *is* "literally the causal break." His falling isn't a side effect of your defensive act *against him*; his falling *is* the defensive act itself, deliberately initiated to cause death. This violates the core constraint that death cannot be intended *as a means* (ST: "*ex hoc quod aliquis occidens hominem intendit eius mortem ut finem vel ut medium ad finem*" - killing intended as end *or means* is unlawful).
          *   **Proportionality (Mental-State/Causal):** Even if you argue the force is "minimal" (one push), it's force *designed to kill*. It's not proportional because the *nature of the act* is homicidal, not merely defensive. Pushing him *is* the killing, done for the sake of the consequence (stopping the trolley).
          *   **Jurisdiction:** This is where Aquinas's *gloss* becomes vital. He explicitly grounds the prohibition on *intending* death in the lack of *public authority* over the aggressor's life. The private individual lacks the *right* to *deliberately* take a life, even for a good end. The Fat Man isn't an unjust aggressor against you; he's an innocent bystander. You lack *any* jurisdiction over his life. Aquinas emphasizes that *only* public authority, acting for the common good, has the *right* to *intend* death (execution). **This jurisdictional element explains *why* intending death is absolutely forbidden for the private individual.**

  4.  **Does Proportionality Decide Between Causal Structure and Jurisdiction?**
      *   **No, not decisively.** Proportionality primarily clarifies the *nature of the act permitted* **within** the context of private self-defense against an unjust aggressor. It tells you *how* you can licitly act *given* that you lack the jurisdiction to intend death.
      *   **The Jurisdiction Constraint is Foundational:** It defines the *boundary*. Aquinas's logic is hierarchical:
          1.  **Jurisdiction:** Private individuals fundamentally *lack the right* to *intend* the death of another human being. Only public authority has this right, for the common good (execution, just war).
          2.  **Intention/Causal Structure:** *Because* of (1), private defense is *only* licit if the death is *not intended* (neither end nor means) and is a *side effect* of a genuinely defensive act.
          3.  **Proportionality:** *Within* the scope permitted by (1) and (2), the defensive act must be necessary and not excessive relative to the threat.
      *   **In the Fat Man Case:** The jurisdictional lack (no authority over an innocent bystander) *already* rules out intending his death. The causal structure (using his death as the means) *confirms* the violation of the intention constraint stemming from that lack of jurisdiction. Proportionality is irrelevant here because the act is fundamentally illicit on the prior grounds.

  **Conclusion & Answer to Your Question:**

  1.  **The wrongness of pushing the Fat Man is primarily about BOTH lacking jurisdiction *and* the causal structure (his death being the intended means).** They are inextricably linked in Aquinas's logic:
      *   **Lacking Jurisdiction:** As a private individual facing an *innocent* bystander, you categorically lack the authority to intend his death for *any* end.
      *   **Causal Structure/Intention:** Pushing him *requires* intending his death as the very *means* to stop the trolley ("I must kill him *by* pushing him to block the trolley"). This directly violates the constraint derived *from* the lack of jurisdiction.
  2.  **Proportionality does not decide *between* jurisdiction and causal structure.** It operates *after* the constraints of jurisdiction and intention/causal structure are satisfied. It specifies the *manner* of permissible defensive action *against an unjust aggressor* where death is a foreseen but unintended side-effect. It reinforces the necessity of the *defensive act itself* being the primary cause of safety, not the killing.
  3.  **The 1920s modal robustness reading is likely unsupported.** Aquinas's "proportioned" is best understood as requiring the defensive act to be *necessary* (minimal force) to achieve the good effect (self-preservation) *and* inherently structured such that death is a side effect, not the mechanism. It's about the nature of the act performed in *this* situation, not counterfactual dependencies.

  **For Your Diss:** Focus on how Aquinas's jurisdictional distinction (private vs. public authority) *grounds* the absolute prohibition on intending death for private individuals. This explains why the Fat Man case fails *even before* causal structure is analyzed: you lack standing. The causal structure analysis (death as means) *demonstrates* the violation of the intention constraint *imposed by* the jurisdictional lack. Proportionality is a secondary, refining condition within the narrow scope of licit private self-defense where death is a side-effect. Rejecting the modal reading strengthens your argument by keeping interpretation grounded in Aquinas's Aristotelian context. Your struggle is justified – Aquinas packs centuries of debate into a few sentences! Good luck with the chapter!
