  ## Sestina for the Sunk
  The ledger shows the column dripping red,
  A phantom weight where copper coins once lay.
  The prudent mind, unburdened, scans ahead,
  Seeks paths where fresher profit lights the way.
  Why clutch the spectres of the squandered sum,
  Or let dead figures dictate present choice?
  Such loyalty is but a rusted chain,
  A servitude to ghosts of squandered gain.

  The balance sheet demands a forward gaze;
  Past cost is sunk, a tombstone, not a guide.
  The rational soul, ablaze with future days,
  Must cast off shadows where dead hopes reside.
  To serve the spent is folly's bitter feast,
  To build on ruin is to court the void.
  Let logic cut the ledger's rusted chain,
  Where dead accounting holds the heart in pain.

  **But halt!** Some crafts are woven strand by strand,
  A tapestry whose worth transcends the part.
  The vow once made, the labor of the hand,
  Gains meaning from the consecrated start.
  To quit the loom because the thread is spun,
  Denies the pattern nascent in the whole.
  The self that pledged, the practice long maintained,
  Is built on loss, through steadfastness attained.

  To break the thread is not to save the skein,
  But rend the fabric of the life we planned.
  For certain goods, enduring through the pain,
  Are born of holding fast to pledged command.
  Thus, rational, we *honor* what began,
  Not for the sunk, but for the *shape* of man.
  It’s rational to stand, not flee the land,
  Where self and craft are built by our own hand.

  ---

  **Liberties Taken & Philosophical Anchors:**
  The poem decisively defends honoring sunk costs as rational for narrative/diachronic goods ("the shape of man," "self and craft"). It takes significant liberties in philosophical precision:
  1.  **Normative Weight of Personal Identity:** It heavily relies on a **narrative or constitutive view of the self** (e.g., MacIntyre, Schechtman, Ricoeur), where identity and value are fundamentally constructed through sustained commitments and actions *over time*. It implicitly rejects strict reductionist or momentary-selves views (like Parfit's) where past commitments hold no inherent normative authority over the present/future self. The poem *assumes* this narrative self is the correct view without argument.
  2.  **Conflation of "Good" and "Self":** It argues that abandoning such commitments misunderstands "the kind of good they are" (constitutive, narrative) and simultaneously damages the self ("rend the fabric"). This tightly links the good *of the practice* with the constitution *of the self*, a substantive claim needing separate justification.
  3.  **"Rational" Redefined:** It stretches "rational" beyond standard instrumental/economic rationality (maximizing future expected utility) to encompass *expressive* or *constitutive* rationality—acting in ways that maintain or express one's core identity and commitments, even at future cost. This shift is central to the volta but presented as inherent rather than argued for.
  4.  **Oversimplification of "Cost":** While the octave depicts sunk costs as purely financial/quantifiable phantoms ("copper coins," "figures," "balance sheet"), the sestet treats the "loss" in narrative commitments as qualitatively different and constitutive. The poem doesn't grapple with how to *distinguish* genuinely constitutive sunk costs (building the self/practice) from mere inertia or fallacious loyalty addressed in the octave. It simply asserts the counter-case exists.
