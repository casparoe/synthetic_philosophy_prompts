  2. **The paradox**: Highlight her solitude alongside her theory. Use Descartes as a pivot.  
  3. **Reframe solitude**: Her independence wasn’t isolation but a testament to how deeply relationality shaped her—those ties were so present they didn’t require constant physical company.  
  4. **Celebration**: Shift to collective impact. Her "self" extends into her students, colleagues, and community. Retirement isn’t an end because her constitutive relationships persist.  

  Tone must avoid academia-speak ("constitutive" is unavoidable but needs unpacking). For family, anchor ideas in concrete images: her apartment, correcting Descartes at parties, students becoming teachers.  

  Biggest risk: sounding like a lecture. Use phrases like "I remember her saying..." to keep it personal. End with a toast that visually represents her philosophy—glasses clinking as literal connection.  

