  The flip comes when comparing actions: Creating suffering is actively instantiating bad experiences – we've materialized negative moral value. Whereas creating happiness is materializing positive value. But not creating happiness? That's just leaving potential value dormant – no harm done. Hence the asymmetry reverses: bringing joy has more moral "oomph" than avoiding suffering in procreation contexts. 

