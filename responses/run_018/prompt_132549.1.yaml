answer: |-
  Here’s a complete exam package tailored to your specifications, focusing on conceptual application without citations.  

  **Essay Question**  
  > "Applying Williams’ and Appiah’s frameworks for analyzing moral revolutions, evaluate the collapse of mediated vendetta in rural Sicily (where life insurance commodified blood-price). Does Williams’ theory require us to see this as proof that honor is *non-fungible* with cash, while Appiah’s suggests a reconfiguration of honor rules? Defend your analysis against the reductionist claim that 'economic interests alone caused the collapse.'"  

  **Model Answer (Approx. 700 words)**  
  The Sicilian shift from mediator-negotiated blood-price to life insurance payouts presents a critical test case for Bernard Williams’ and Kwame Anthony Appiah’s theories of moral change. Where Williams would argue the collapse proves honor’s *non-fungibility* with cash, Appiah would interpret it as an *institutional recalibration* of honor rules—neither reducible to mere economic determinism.  

  Williams’ framework centers on **“thick” ethical concepts** like honor, which are embedded in shared social practices and resist substitution by “thin” universalizable values (e.g., monetary exchange). For Williams, the vendetta system was sustained by a thick concept of honor: blood-price was not compensatory but *symbolic restitution* acknowledging a family’s standing. The mediator ensured negotiations preserved *recognition* of injured honor, making cash a vehicle for restoring communal status, not a commodity. Life insurance, however, severs this link: it turns blood-price into an actuarial transaction, paid automatically without mediation or communal acknowledgment. Williams would thus reject the insurance story as *corrosive*: honor cannot be “priced” without destroying its thick ethical substance. The collapse isn’t caused by cash per se but by cash *replacing* the ritual that made honor socially legible. When money becomes fungible (interchangeable without symbolic meaning), the practice implodes—not due to economics alone, but because the *conceptual precondition* for honor (its non-fungibility) is violated.  

  Appiah, conversely, sees honor worlds as **malleable systems of rules** that adapt to material and social conditions. He would agree that life insurance commodified blood-price but would frame this as an *evolution* of honor rules rather than their abandonment. In Appiah’s model (e.g., dueling’s decline), practices dissolve when their supporting “honor world” loses coherence—often through new technologies or institutions recalibrating social perception. Here, insurance offered a pragmatic alternative that *reconfigured* honor: it provided a reliable, low-conflict resolution method that maintained familial obligations (financial security) while reducing violence. The mediator became redundant not because honor vanished, but because insurance created a *new rule*: “honorable families” could now meet obligations through private contracts, avoiding messy public negotiations. For Appiah, this shift reflects honor’s plasticity; the “rule” of providing for one’s family persisted, but its *enactment* migrated from communal rituals to market instruments. Crucially, this isn’t “economics over honor” but a change in how honor’s demands are satisfied—a revolution in the honor world’s institutional scaffolding.  

  Both theorists would reject the claim that “economic interests won” as a false binary. Williams would argue that reducing the collapse to economics ignores how cash *functions*: in the vendetta system, money mediated honor; in insurance, it becomes a mere commodity, making the practice *unintelligible* as honor. Appiah would stress that economics *served* honor by offering a less hazardous way to fulfill its demands—interests didn’t *replace* ethics but reshaped its expression. The error lies in conflating *instrumental change* (new tools to satisfy honor) with *conceptual annihilation* (honor’s disappearance).  

  In conclusion, the Sicilian case affirms both frameworks but reveals their divergent emphases: Williams highlights the *existential fragility* of thick ethics when made fungible, while Appiah emphasizes honor’s *pragmatic resilience* through institutional innovation. Neither reduces to materialism; both show economics interacting with *moral concepts* to drive revolution.  

  ---  
  **Marking Scheme**  
  **A-Grade (85-100%)**  
  - **Explicitly contrasts Williams’ non-fungibility thesis** (cash corrodes thick honor by stripping symbolic meaning) **with Appiah’s institutional-shift reply** (insurance rewrites honor rules but preserves core obligations).  
  - **Treats economics as intertwined with moral concepts**, not a standalone cause.  
  - **Directly rebuts reductionism**: Shows why “interest won” oversimplifies (e.g., for Williams, money’s role *changed*; for Appiah, economics served honor’s goals).  
  - **Uses case specifics**: Mediators’ role vs. insurance’s automation; violence reduction as honor-consistent outcome.  

  **B-Grade (70-84%)**  
  - **Correctly summarizes both theories** but applies them generically (e.g., “Williams says honor is thick, Appiah says it changes”).  
  - **Lapses into economic reductionism** at points (e.g., “Insurance was cheaper/more efficient, so honor faded”).  
  - **Notes the theories differ** but doesn’t pinpoint *non-fungibility vs. rule plasticity* as the crux.  
  - **Engages the case** but misses why mediator/insurance distinction matters conceptually.  

  **C-Grade (50-69%)**  
  - **Superficial theory summary** without structured application to Sicily.  
  - **Omits one theorist** or conflates their arguments (e.g., “Both think honor disappeared”).  
  - **Defaults to “economic interests won”** without theorist rebuttals.  

  **Failing (<50%)**  
  - Ignores one/both theorists; treats case as purely economic; significant factual errors.  

  **Explicit Warning Against Common Error**  
  > **“Conflating interest with honor collapse”** is the primary pitfall. Do not argue that “honor faded because cash was more practical”—this ignores *both* Williams’ (cash destroys honor’s logic) and Appiah’s (cash serves honor’s aims). Credit hinges on explaining *how* economics interacts with ethical frameworks.  

  ---  
  **Design Notes**  
  - **Timing**: 700 words fits a 90-minute upper-level exam (allows 15 min planning, 60 min writing, 15 min review).  
  - **Depth**: Forces engagement with the *mechanism* of collapse (fungibility vs. rule change), not just outcomes.  
  - **Anti-Reductionism**: Built-in rebuttal requirement blocks low-effort “economics won” answers.  
  - **Theoretical Precision**: “Non-fungibility” and “institutional shift” are the key discriminators for A vs. B.  

  This tests whether students grasp *how* the theories diagnose moral change—not just what they say.
