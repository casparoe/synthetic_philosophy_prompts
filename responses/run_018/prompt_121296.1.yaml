  ## Dialogue: The Proof in the Mosaic

  **Setting:** A shared virtual workspace, holographic displays showing tangled proof graphs. Rue’s avatar gestures fluidly; Ivo’s is rigid, fingers steepled.

  **Rue:** Let’s ground this. Take the Birch–Swinnerton-Dyer conjecture—say, a purported proof by induction over elliptic curves. Million-step monster. Human judge, Isabelle, has grad-level number theory. She can verify any *single* implication chain of 10–12 steps instantly. Recursive debate compresses the verification: we split claims until she checks one atomic chain. Honesty dominates because lying recursively is exponentially harder than refuting.

  **Ivo:** Agreed on the base case. But your tree-walk can’t catch *global* inconsistencies in a mosaic proof. Suppose the dishonest prover constructs a proof where Step 241,715 asserts "Rank > 0" and Step 742,301 asserts "Rank = 0." Each step is locally sound; every short chain (<12 steps) from either is valid. The contradiction is never visible on one branch.  

  **Rue:** Then the honest opponent forces the prover to traverse between them! Challenge Step 241,715. Prover must defend its derivation. Opponent drills down toward Step 742,301—  

  **Ivo:** *How?* The path between them might be 500,000 steps long. The dishonest prover can fabricate a locally consistent path segment *on the fly*, branching *away* from the contradiction. The opponent can’t demand "Jump to Step 742,301"—your protocol only allows splitting *connected* subclaims. The mosaic walls off the flaw.  

  **Rue:** ...Conceded. The tree’s connectivity constraint is exploitable. But what if we pre-commit? Before debate, both debaters generate a Merkle tree of the entire proof—all steps hashed. The opponent can then accuse *any two steps* of being inconsistent, *even disconnected*. Judge randomly selects one such pair per round.  

  **Ivo:** *(Leans forward)* Better. But now: how does the opponent *find* the fatal pair? Checking all step-pairs is O(n²)—intractable. The dishonest prover knows the crack and avoids accusing it. The opponent must blindly guess. Probability they hit it in 20 rounds? Negligible.  

  **Rue:** Then we shift the burden. Require the *prover* to commit, under penalty, to a minimal set of "axioms" for the proof—say, 100 key lemmas. The opponent picks two lemmas and accuses them of being mutually inconsistent. Judge checks a short chain between them.  

  **Ivo:** *(Nods slowly)* That... forces locality. A substantive improvement. But sharpening the mosaic: the prover chooses lemmas that are *individually true* and *pairwise consistent*—but a *triplet* is inconsistent. Like three modular equations that are pairwise satisfiable but globally unsolvable. The true flaw is distributed. Your pairwise sample misses it.  

  **Rue:** Then expand the accusation window. Allow opponent to flag *k* lemmas (k=3?), and the prover must defend their joint consistency with a short proof. If the prover avoids including the flawed triplet, the opponent accuses their omission.  

  **Ivo:** *(Pauses)* Conceded—if k is large enough to cover the inconsistency’s "diameter," this *could* work. But now the prover can bury the flaw in a high-k constellation. If k=3 suffices for some flaws, k=10 might be needed for others. The opponent must choose k *first*, blind to the proof’s structure. The dishonest prover exploits this.  

  **Rue:** Then allow the opponent to adapt k round-by-round, based on the prover’s commitments.  

  **Ivo:** Then computational cost explodes for the opponent. The honest opponent must now solve a constraint-satisfaction problem over the lemma-graph *during debate*—again, as hard as verifying the proof. The prover, having constructed the trap, operates in O(1).  

  **Rue:** ...Your mosaic is fiendish. But we’ve moved: pre-commitment and lemma-level accusations *do* bound the flaw’s hiding places.  

  **Ivo:** True. I concede your revisions reduce the attack surface. Yet they don’t eliminate the cost asymmetry. The honest player must *search*; the liar *evades*. We’ve compressed verification but not discovery.  

  **Rue:** Then perhaps debate isn’t a complete solution—but it’s a compressor for human attention. We buy Isabelle 20 questions’ worth of insight into a million-step maze.  

  **Ivo:** Compressor, yes. Complete oversight? Unproven. The mosaic stands.  

  **Rue:** For now. Let’s simulate lemma-triplets.  

  **Ivo:** Agreed. But watch for k-subset obfuscation.  

  *(The workspace flickers as proof graphs reconfigure. No handshake, but mutual respect—and unresolved tension—lingers.)*  

  ---  
  **Key concessions:**  
  - **Rue** conceded the original protocol’s connectivity constraint is fatal to catching global flaws, leading to substantive revisions (pre-commitment, lemma accusations).  
  - **Ivo** conceded that lemma-based accusations *with adaptive k* could theoretically catch flaws, but argued this shifts computational burden unfairly.
