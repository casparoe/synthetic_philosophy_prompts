answer: |-
  ### Classification Tree for Positions on Occasionalism and Secondary Causation  

  **Root Question**: Do created substances possess any intrinsic dispositional powers (e.g., an inherent capacity to produce or undergo specific effects)?  
  - **No** → Proceed to *Occasionalism Branch*.  
  - **Yes** → Proceed to *Non-Occasionalism Branch*.  

  ---

  #### **OCCASIONALISM BRANCH** (Substances lack intrinsic powers; God is the sole cause)  
  **Question 1**: Is occasionalism **global** (applying to mental events, logical relations, and physical events alike)?  
  - **Yes** → Global occasionalism.  
  - **No** → Domain-restricted occasionalism (e.g., physical events only).  

  **Question 2**: Is the regularity of nature explained by a **divinely instituted habit** that carries modal force (e.g., God’s consistent actions ground counterfactuals and natural necessities)?  
  - **Yes** → Habit-based regularity.  
  - **No** → Direct recreation (each state of the world is directly recreated by God with no intermediate structure or habit).  

  **Question 3**: Is occasionalism compatible with a **realist interpretation of probabilistic laws** in quantum mechanics (i.e., quantum probabilities reflect objective chances, not ignorance)?  
  - **Yes** → Compatible with QM realism.  
  - **No** → Incompatible with QM realism.  

  ##### *Leaves for Occasionalism*:  
  1. **Global, Habit-based, Compatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: God directly causes quantum events with objective probabilities, undermining the intuition that divine action should be purposeful and non-arbitrary.  

  2. **Global, Habit-based, Incompatible with QM realism**  
     - *Position*: **Al-Ghazālī/Malebranche-style occasionalism**.  
     - *Awkward commitment*: Denies science’s ability to discover mind-independent probabilistic laws (e.g., quantum probabilities are mere divine habits, not objective features).  

  3. **Global, Direct recreation, Compatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: Regularity in nature (including quantum statistics) is a brute fact of God’s arbitrary will at each moment, rendering scientific explanation vacuous.  

  4. **Global, Direct recreation, Incompatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: Rejects both scientific realism (no laws structure nature) and mental causation (e.g., thoughts don’t cause actions; God recreates all).  

  5. **Domain-restricted, Habit-based, Compatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: Arbitrarily limits God’s causal role (e.g., to physics) while accepting divine habits for quantum probabilities, leaving mental/logical causation unexplained.  

  6. **Domain-restricted, Habit-based, Incompatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: Science can describe physical regularities as divine habits but cannot appeal to probabilistic laws as real, creating tension with quantum mechanics.  

  7. **Domain-restricted, Direct recreation, Compatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: God recreates physical states with no habitual structure, yet quantum probabilities are objective—inconsistent if probabilities require stable dispositions.  

  8. **Domain-restricted, Direct recreation, Incompatible with QM realism**  
     - *Position*: Unnamed.  
     - *Awkward commitment*: Denies science any explanatory role in physics (no laws or probabilities), while mental causation remains unaddressed.  

  ---

  #### **NON-OCCASIONALISM BRANCH** (Substances possess intrinsic powers)  
  **Question 4**: Does divine action **override or bypass** created powers in specific domains (e.g., miracles, quantum events)?  
  - **Yes** → Selective divine intervention.  
  - **No** → No divine override (created powers operate uniformly).  

  ##### *Leaves for Non-Occasionalism*:  
  9. **Divine override in some domains**  
     - *Position*: **Concurrentism** (e.g., Thomism).  
     - *Awkward commitment*: God’s intervention in quantum events or minds risks making created powers redundant or epiphenomenal.  

  10. **No divine override**  
      - *Position*: **Deism/Strong Emergentism**.  
      - *Awkward commitment*: Difficulty explaining divine providence or fine-tuning without invoking gaps in natural causation.  

  ---

  ### Notes  
  - **Logically coherent but unoccupied positions**:  
    - *Global, Direct recreation, Compatible with QM realism* (Leaf 3): Coherent but unnamed; no known defenders due to tension between arbitrariness and objective probabilities.  
    - *Domain-restricted, Habit-based, Compatible with QM realism* (Leaf 5): Coherent but unnamed; ad hoc restriction of occasionalism to physics lacks principled justification.  

  - **Indistinguishable named positions**:  
    - **Al-Ghazālī and Malebranche** both occupy *Global, Habit-based, Incompatible with QM realism* (Leaf 2). They cannot be separated by these questions alone, as both deny intrinsic powers, affirm global occasionalism and divine habits, and would reject QM realism as inconsistent with divine sovereignty.  

  - **Total leaves**: 10 (8 occasionalist + 2 non-occasionalist).  
  - **Minimal awkward commitments** illustrate tensions with mental causation, scientific realism, or divine action.
