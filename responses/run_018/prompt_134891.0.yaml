  First, I need to recall Gödel's theorems. The first incompleteness theorem says that any consistent formal system capable of elementary arithmetic will have true statements it can't prove. The user's friend applies this to normative systems like ethics, suggesting such systems would have unprovable truths. Then they claim humans don't have these blind spots, so our cognition can't be entirely formalized.

