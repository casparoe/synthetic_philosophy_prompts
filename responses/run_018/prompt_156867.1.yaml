prompt: |-
  You're a philosopher of mind who likes getting into the dialectical weeds — please take a minute to brainstorm before you answer, and don't just list authors. I'm stuck on a pattern I keep seeing in debates about whether there is genuinely something it is like to have an experience, especially now that people are arguing about LLMs and synthetic minds. Here's the loop. Someone points out that there's an obvious qualitative gap: I can describe every neural pathway for seeing red, but that doesn't seem to capture the red-ness. The skeptic doesn't deny that people feel that gap; instead they say the feeling-of-a-gap is itself just a functional state — maybe a predictive error about missing data, or a meta-cognitive flag that says explanation incomplete. Then they claim that once you've described that functional state, you've explained away the original intuition. What's strange is that they have to borrow the specific content of the intuition — that there's an irreducible residue — in order to identify which functional state to invoke. They never explain why that mechanism produces a report about ineffable qualitative residue rather than, say, a report about a broken calculator. I see this with bat consciousness, with color inversion arguments, and now constantly with people saying ChatGPT only seems conscious because your theory-of-mind module misfires — the misfire is described using the very phenomenlogical vocabulary it's meant to eliminate. Is there an established name for this exact move, where you preserve the phenomenlogical report as a real psychological event but immediately functionalize it using its own qualitative content? How is it different from ordinary attempts to Quine qualia, or from Dennett-style heterophenomenology, or just standard eliminativism? If there's no precise term, can you coin one with clear boundary conditions — specifically, does it apply whenever you explain an intuition by treating the intuition itself as mechanistic data, or is there something special about qualitative domains? I don't want a bibliogrphy, just the carving, and please tell me where the edges are.
reasoning: |-
  Okay, the user is a philosopher of mind who loves dialectical details and is stuck in a recurring argument pattern about qualia and synthetic minds. They've noticed that skeptics of phenomenal consciousness acknowledge the intuition of an "explanatory gap" but then reduce that very intuition to a functional state—like a predictive error or metacognitive flag. The twist is that these skeptics use the content of the intuition (e.g., "there's an irreducible residue") to identify which functional mechanism to invoke, without explaining why that mechanism produces reports about qualitative gaps instead of something else (like a broken calculator). 

  Hmm, the user is frustrated because this move feels circular: the skeptic borrows phenomenological vocabulary to dismantle phenomenology itself. They want to know if there’s a named fallacy or conceptual move here, or if we need to coin one. They also want clear boundaries—how this differs from Dennett’s heterophenomenology or standard eliminativism. 

  First, let’s dissect the skeptic’s maneuver:  
  1. **Acknowledge the report**: "Yes, you *feel* like there’s a gap."  
  2. **Functionalize the feeling**: "That feeling is just X mechanism (e.g., prediction error)."  
  3. **Declare the gap explained**: "Once we describe X, the intuition is ‘explained away.’"  
  But crucially, step 2 relies on the *specific content* of the intuition ("ineffable residue!") to pick the functional state, while offering no independent reason why X generates *that* content. It’s like using the symptom to diagnose the disease while insisting the symptom isn’t real.  

  Is this just standard qualia-quining? Not quite—Quine (or Dennett) might deny the gap’s validity altogether. Here, the skeptic grants the *report* as real but hollows it out. Heterophenomenology is different: Dennett takes reports seriously as data but brackets whether they *refer* to real qualia. This move goes further by claiming the report’s content is *nothing but* a functional glitch.  

  Eliminativism? Close, but eliminativists usually reject the *framework* of phenomenal talk (e.g., "qualia don’t exist"). Here, the skeptic *uses* phenomenal talk to frame the functional explanation, creating a weird dependency.  

  **The core problem**: The functional explanation is *parasitic* on the phenomenology it denies. Without borrowing the intuition’s content ("there’s a mysterious residue!"), the skeptic couldn’t point to which functional state to reduce it to. Yet they offer no account of why *this* state feels like a gap rather than, say, confusion about math.  

  **Coining a term**: Let’s call it **Gap-Theft**. Why?  
  - **Gap**: Targets the explanatory gap/phenomenological residue.  
  - **Theft**: Steals the content of the intuition to fuel the functional explanation.  
  *Boundaries*: Applies when:  
  1. An intuition (especially qualitative) is granted as a psychological event.  
  2. Its *specific content* is used to identify a functional mechanism.  
  3. The mechanism’s description offers no independent reason why it generates *that* content.  
  4. The original intuition is declared "explained" solely by describing the mechanism.  

  *Where it bites*: Strongest in qualitative domains (color, pain) because the content ("redness!") is what’s at stake. But it could apply elsewhere (e.g., moral intuitions reduced to evolutionary impulses while borrowing "oughtness").  

  *Edge cases*: If a skeptic *independently* identified the functional state (e.g., via fMRI correlates *before* asking about qualia), it wouldn’t be Gap-Theft. The theft lies in the content-dependency.  

  User’s meta-concern: They sense this move blocks progress in AI consciousness debates. Naming it ("Gap-Theft!") might force skeptics to confront the circularity.
answer: |-
  Your dissection captures a precise and under-acknowledged dialectical maneuver. Let's carve it at the joints, avoiding mere labels and focusing on the *structure* of the move. I'll coin a term, define its boundaries, and contrast it with adjacent strategies.

  ### The Core Move: **Phenomenal Legerdemain**  
  *(from French *léger de main*, "lightness of hand", implying a conceptual sleight-of-hand)*  

  **Definition**: The strategy of preserving the *report* of a phenomenological intuition (e.g., "there's an irreducible qualitative residue") as a genuine psychological datum, then explaining it via a functional mechanism *whose identification parasitically depends on the content of that very intuition*, while failing to independently ground why the mechanism produces *this specific phenomenological report* rather than another.  

  ### Boundary Conditions  
  1. **Essential Structure**:  
     - **Step 1**: Concede the *existence* of the subject's report (e.g., "I feel a gap between physical description and experience").  
     - **Step 2**: Identify a functional state (e.g., predictive error, metacognitive flag) as the *cause* of the report.  
     - **Step 3**: Use the *semantic content* of the report ("ineffable qualia!") to isolate the functional state (e.g., "this mechanism fires when explanations feel 'incomplete' in a qualitative way").  
     - **Step 4**: Declare the original intuition "explained away" by the functional description, without:  
       - (a) Explaining why *this* functional state yields *phenomenological* content (e.g., "why doesn't it feel like a spreadsheet error?").  
       - (b) Providing independent criteria for identifying the functional state *without* borrowing the phenomenology.  

  2. **Domain Specificity**:  
     - **Strong Form**: Applies *only* to qualitative/phenomenal intuitions (e.g., the "hard problem"). The borrowed content *must* involve apparent irreducibility (e.g., "redness," "what-it's-like-ness").  
     - **Weak Form**: Could extend to other "explanatory gap" intuitions (e.g., free will, moral realism), but its circularity is most acute in phenomenal domains because the *target* is the feeling itself.  

  ### Contrast with Adjacent Strategies  
  - **Dennett-style Heterophenomenology**: Treats reports *neutrally* as data to be explained, but brackets the truth-value of phenomenology. **Difference**: Heterophenomenology doesn't *use* the phenomenological content to define the mechanism; it describes the mechanism independently (e.g., via behavior, speech acts). Legerdemain *requires* the content to pick out the mechanism.  
  - **Standard Eliminativism**: Denies the existence of phenomenal states entirely (e.g., "qualia are illusions"). **Difference**: Eliminativism rejects Steps 1 and 3; it doesn't grant the report as a "real psychological event" needing functional explanation. Legerdemain *exploits* the report while gutting its ontology.  
  - **Quining Qualia**: Denies the coherence of the *concept* of qualia (e.g., "there's no definite 'residue' to explain"). **Difference**: Quining attacks the intuition's validity upfront. Legerdemain *preserves* the intuition's surface validity to fuel its functionalization.  

  ### Why This Isn't Just "Explaining the Intuition"  
  Ordinary functional explanations of intuitions (e.g., "we intuit moral truths because of evolved kin-detection modules") don't face this problem because:  
  - They don't borrow the *target concept* (e.g., "oughtness") to define the mechanism.  
  - They provide independent evidence for the mechanism (e.g., evolutionary models).  
  Legerdemain's circularity arises because the functional state is *defined* by the phenomenology it aims to eliminate: the mechanism is a "gap-feeler" only because we start with the gap-feeling.  

  ### Edges and Exceptions  
  - **Applies When**: The skeptic's functional description *semantically mirrors* the phenomenology (e.g., "meta-cognitive error about *ineffable properties*"). If they described a generic "explanation-failure signal" without invoking qualia-language, it escapes legerdemain.  
  - **Does Not Apply**: If the functional state is identified *independently* (e.g., via fMRI correlates of confusion during unsolvable puzzles) *before* mapping it to qualitative reports.  

  ### Why "Legerdemain"?  
  It highlights the trick: The skeptic *pockets* the phenomenological coin (the intuition's content) to pay for the functional explanation, while declaring the coin counterfeit. The move is dialectically potent but ontologically hollow—it explains the *report* by assuming the report's content is already reducible, without doing the work to show *how*.  

  This pattern thrives in gaps where first-person authority feels unassailable (e.g., consciousness). Naming it forces skeptics to either:  
  (1) Ground the functional state independently, or  
  (2) Admit they’re smuggling in the very phenomenology they dismiss.
