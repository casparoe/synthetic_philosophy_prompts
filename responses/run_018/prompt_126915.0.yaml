answer: |-
  Based on Hobbes's core philosophical commitments – **radical materialism, nominalism, and the identification of reasoning with computation grounded in physical motion** – here's the ranking of your positions from most to least Hobbesian (1 = Most Acceptable, 5 = Utterly Rejected), along with explanations and the fate of "ghost-extension":

  **Ranking (Most to Least Hobbesian):**

  1.  **(3) Actually traced by physical motion:** **DEFEND.** This is the gold standard for Hobbes. Geometric existence *requires* actual generation by the motion of bodies. A line is the trace left by a moving point; a circle is generated by rotating a leg of a compass. Geometry is the science of the consequences of such motions. Without this physical, causal generation, the figure lacks true ontological grounding for Hobbes. His entire dispute with Wallis centered on this point.

  2.  **(2) Constructible by compass and ruler in principle:** **TOLERATE (but with strict conditions).** Hobbes would accept this *only* if "in principle" strictly means it *could* be physically executed by these specific tools, following the definitions and permitted operations of geometry *as he understood them* (which excluded algebra as a foundational method). He valued the rigor and certainty provided by these specific constructive methods. However, he would be deeply suspicious if "in principle" became a license for purely conceptual reasoning divorced from the possibility of *actual* physical execution. It's a step removed from (3), so less ideal.

  3.  **(1) Pure mental construction with no physical trace:** **REJECT.** For Hobbes, thought itself *is* computation with names derived from sense experience. A figure conjured *only* in the mind, with no grounding in possible physical generation or sensory trace, is merely a "phantasm" or name. It lacks the reality required for genuine geometrical knowledge, which must be tied to the properties and motions of real bodies. Geometry isn't about arbitrary mental creations.

  4.  **(4) Defined by social convention among mathematicians:** **REJECT.** Hobbes was a nominalist and materialist. Truth in geometry, for him, wasn't established by agreement or convention among practitioners. It was discovered through the correct application of reason (computation) to the consequences of definitions rooted in the generation of figures by motion. Social agreement on something unconstructible wouldn't make it geometrically real. He saw Wallis's methods as a dangerous *departure* from true geometric reasoning, not a legitimate convention.

  5.  **(5) Ghost-extension where you extrapolate a figure past the point where any motion could have produced it:** **VEHEMENTLY REJECT.** This is precisely the heart of Hobbes's critique of Wallis and the "new algebra" used in quadrature attempts (like squaring the circle). Wallis used infinite series and algebraic manipulations that, according to Hobbes, generated concepts of figures or quantities that *could not possibly be constructed* by any physical motion (e.g., the "infinite-sided polygon" approach to the circle). For Hobbes, this was pure sophistry – manipulating names and symbols to produce "ghosts" of geometry that had no connection to the real world of bodies in motion. He saw it as meaningless, ungrounded, and a corruption of true science. **This is *exactly* the position he attacked Wallis for holding.**

  **Ghost-Extension:**
  *   **Hobbesian Verdict:** Utterly rejected. This is the epitome of the "absurdity" he railed against. It represents a complete divorce from the materialist, constructivist foundations of geometry.
  *   **Relation to Wallis:** You are **absolutely correct.** Hobbes's core objection to Wallis's quadrature methods (and algebra in general as a foundation for geometry) was that they produced results or concepts ("ghosts") that were *not* grounded in or reducible to actual physical construction by motion. Wallis's infinite series and limit concepts were the prime examples of "ghost-extension" for Hobbes.
  *   **The Term "Ghost-Extension":** You **made it up**, but it's **brilliantly apt** for describing Hobbes's critique. It perfectly captures his accusation that Wallis was dealing with spectral entities conjured by symbols, not real geometric figures generated by motion. While not a standard historical term, it's an excellent modern characterization of what Hobbes saw Wallis doing. Scholarly descriptions often use phrases like "unconstructible entities," "fictions of the mind," "purely symbolic manipulations," or "lacking causal generation," but "ghost-extension" vividly encapsulates the essence of his complaint.

  **In essence:** Hobbes's geometric ontology was radically constructivist and materialist. Only figures demonstrably *generated* or *generatable* by the physical motion of bodies possessed true geometric reality (Positions 3 and, conditionally, 2). Anything else – pure thought (1), convention (4), or unconstructible extrapolations (5) – was dismissed as sophistry, mere names, or dangerous "ghosts." Position 5, your "ghost-extension," was the primary target of his famous dispute with Wallis. Your intuition about that connection is spot-on.
