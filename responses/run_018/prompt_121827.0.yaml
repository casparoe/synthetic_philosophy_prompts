     - Connect to Pascal's wager: in Pascal's wager, the upside is infinite (eternal salvation) and the downside is finite (living a pious life). The expected value is infinite, so it dominates. In our activity, the upside was large but finite, so some groups might have rejected the gamble due to risk aversion.

  **Final Note:** 
  This activity is designed to make the students feel the tension between collective EV maximization and individual risk. It will likely generate strong reactions and provide a basis for discussion. Be prepared for groups that reject all gambles or groups that accept even Round1. The debrief should tie these reactions to the theoretical concepts.
