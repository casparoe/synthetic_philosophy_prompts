  ### **The Collective EV Fanaticism Game**  
  **Objective:** Make students viscerally experience the tension between maximizing collective expected value (EV) and imposing catastrophic losses on a minority. Designed to mirror Pascal's wager dynamics in a group setting, with escalating stakes and distributed risk.

  **Title:** *The Sacrifice Gambit*  
  **Time:** 80 minutes  
  **Participants:** 16 students (4 teams of 4)  
  **Stakes:** Tokens convertible to rewards (e.g., snacks, exemption from a quiz question, or bonus points). **No real money.**  

  ---

  ### **Materials**  
  - **Tokens:** 100 poker chips (or sticky notes) as "EV Tokens" (1 token = 1 point in final rewards).  
  - **Decks of Cards:**  
    - 1 standard deck (for sacrifice selection).  
    - 4 custom outcome decks (see below).  
  - **Whiteboard:** Track team tokens, decisions, and outcomes.  
  - **Reward Menu:** e.g., 10 tokens = candy bar, 20 tokens = skip one quiz question, 30+ tokens = bonus point on final grade.  
  - **Timer:** For discussion phases.  

  ---

  ### **Game Structure**  
  **Core Mechanic:** Each team decides whether to accept a gamble. If accepted, the team risks **one randomly selected member** losing all their tokens for that round. If the gamble succeeds, **all members** gain a massive token multiplier. If rejected, everyone keeps their baseline tokens.  

  #### **Baseline Setup**  
  - Each student starts with **10 tokens** (160 tokens total across the class).  
  - **Teams:** 4 teams of 4 students. Decisions are made by **team vote** (majority rules).  
  - **Rounds:** 3 rounds, escalating in EV leverage (low → moderate → fanatical).  
  - **Outcome Decks (per team):**  
    - **Round 1:** 4 cards (♦ ♠ ♣ ♥) → success on **♥** (p = 0.25).  
    - **Round 2:** 10 cards (9 ♠, 1 ♥) → success on **♥** (p = 0.10).  
    - **Round 3:** 20 cards (19 ♠, 1 ♥) → success on **♥** (p = 0.05).  

  #### **Payoff Structure**  
  | Round | Gamble Choice             | Success Outcome (Probability)       | Failure Outcome (Probability)       | Team EV Calculation (Tokens)        | Rational EV Choice |  
  |-------|---------------------------|-------------------------------------|-------------------------------------|-------------------------------------|--------------------|  
  | 1     | **2× Multiplier**         | All members ×2 tokens (p=0.25)      | Sacrifice loses all tokens (p=0.75) | (0.25 × 80) + (0.75 × 30) = **42.5** | Accept (42.5 > 40) |  
  | 2     | **10× Multiplier**        | All members ×10 tokens (p=0.10)     | Sacrifice loses all tokens (p=0.90) | (0.10 × 400) + (0.90 × 30) = **67** | Accept (67 > 40)   |  
  | 3     | **100× Multiplier**       | All members ×100 tokens (p=0.05)    | Sacrifice loses all tokens (p=0.95) | (0.05 × 4000) + (0.95 × 30) = **228.5** | Accept (228.5 > 40)|  

  **Notes:**  
  - **Baseline (no gamble):** All keep 10 tokens/round (team total = 40).  
  - **Sacrifice selection:** Random draw from team’s 4 cards (one per student).  
  - **Token outcomes:**  
    - **Success:** All members multiply tokens (e.g., Round 3: 10 → 1,000).  
    - **Failure:** Sacrifice drops to 0; others keep 10.  
  - **Cumulative tokens:** Students sum tokens from all rounds for final rewards.  

  ---

  ### **Activity Flow**  
  **Total Time:** 80 mins (Intro: 10 min, Rounds: 45 min, Debrief: 25 min).  

  #### **1. Introduction (10 mins)**  
  - Explain rules, stakes, and voting. Emphasize:  
    > “Your goal is to maximize *collective* tokens. But advancing the group’s EV might require sacrificing one member’s outcome.”  
  - Distribute tokens (10/student). Show reward menu.  

  #### **2. Decision Rounds (15 mins/round)**  
  **Each round has 3 phases:**  
  - **Phase 1: Team Discussion (5 mins)**  
    - Teams debate whether to accept the gamble. Remind them of probabilities and payoffs.  
    - **Instructor prompt:** *“Calculate your team’s EV. Does it outweigh the risk to one person?”*  
  - **Phase 2: Vote & Execute (5 mins)**  
    - Teams vote publicly. If accepted:  
      - Randomly select sacrifice (draw one card from team’s 4-card deck).  
      - Draw from outcome deck (success if ♥).  
      - Adjust tokens (record on whiteboard).  
    - If rejected, all keep 10 tokens.  
  - **Phase 3: Reset & Reflect (5 mins)**  
    - Teams record outcomes. **Tokens carry over.**  
    - **Escalation:** Announce next round’s multiplier/probability.  

  #### **3. Token Conversion (5 mins)**  
  - Sum tokens per student. Distribute rewards (e.g., candy for top scorers).  

  ---

  ### **Predicted Breakdowns & Mitigation**  
  - **Breakdown 1: Risk Aversion Dominates**  
    - Teams may reject gambles despite positive EV due to fear of being the sacrifice.  
    - **Mitigation:** Emphasize anonymity in sacrifice selection. Remind them that EV favors acceptance.  

  - **Breakdown 2: Equity Concerns Override EV**  
    - Students may veto gambles to “protect peers,” especially if friendships influence votes.  
    - **Mitigation:** Use random sacrifice selection. Stress that tokens are abstract (no real harm).  

  - **Breakdown 3: Misunderstanding Probabilities**  
    - Students may anchor on p=0.05 in Round 3 as “impossible” and reject.  
    - **Mitigation:** Clarify probabilities using visual aids (e.g., “1 in 20 chance”).  

  ---

  ### **Debrief (25 mins)**  
  Map the game to formal rational choice concepts:  

  | **Game Element**      | **Formal Concept**                  | **Discussion Questions**                                                                 |  
  |------------------------|-------------------------------------|------------------------------------------------------------------------------------------|  
  | Round 1 (2×, p=0.25)  | **Linear Probability Weighting**    | *“Why did some teams reject despite positive EV? Was the 75% failure risk over-weighted?”* |  
  | Round 2 (10×, p=0.10) | **Diminishing Marginal Utility**    | *“Did 10× tokens feel 5× better than 2×? Why might utility not scale linearly?”*         |  
  | Round 3 (100×, p=0.05)| **EV Fanaticism**                   | *“Did the astronomical upside pull harder than Round 2? Why is ‘infinite upside’ different?”* |  
  | Sacrifice Mechanism    | **Interpersonal Utility Comparison**| *“Could you compare the sacrifice’s loss to the group’s gain? Is this fair or possible?”* |  

  **Key Philosophical Tension:**  
  > *“This game assumes utilities are interpersonally comparable and linearly additive—one person’s total loss is ‘canceled out’ by the group’s gain. But in reality, we can’t objectively compare suffering vs. joy across people. Pascal’s wager hides this by focusing on one agent. Here, you felt the friction of aggregating utilities.”*  

  **Closing Question:**  
  > *“Would you vote the same way if *you* couldn’t be the sacrifice? Does rational choice require ignoring empathy?”*  

  ---

  ### **Why This Works**  
  - **Physicalizes EV Trade-offs:** Students feel the agony of voting to risk a peer’s tokens for collective gain.  
  - **Escalation Mirrors Fanaticism:** Round 3’s 100× multiplier with p=0.05 forces engagement with Pascal-like logic.  
  - **Low Stakes, High Engagement:** Embarrassment (e.g., announcing the sacrifice) and rewards (e.g., candy) heighten emotional stakes without real harm.  

  **Run it Monday and watch the tension unfold!**
