  Hmm, the pub setting suggests this should feel authentic to British speech patterns - "mate" and "reckon" are good cues. I'll make one character (let's call them Alex) argue for careful comparison as necessary for justice, while the other (Sam) maintains it's inherently degrading. 

  For the first exchange, I'll have Alex challenge the "obscenity" claim by pointing to legal distinctions. Sam should counter by arguing that legal frameworks are different from moral ranking. 

