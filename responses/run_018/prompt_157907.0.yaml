prompt: |-
  i'm leading a 75-minute seminar for philosophy seniors on Galen Strawson's basic argument that we can't be truly morally responsabile for our actions, but i want to come at it sideways: instead of opening with determinism, i want to build the whole thing around an analogy to authorship in distributed systems—think open-source codebases or collective writing projects—where no single node is the "true" originator. The students will walk in thinking moral responsibility just means "your brain caused it" and that Strawson is secretly just a determinist. Plan the explanatory arc: what dependency has to be in place before the causa-sui principle even sounds plausible (not determinism, but what?), the carrying analogy and exactly which feature it needs to mirror the argument and which feature it needs to lack so it doesn't collapse into compatabalism, the misconceptions they'll form in sequnce—probably that he's denying free will, that he's assuming determinism, and that this is just the standard incompatibilist move with fancy wording—plus the exact point in the sequence where each should be defused. Give me one check at the end that distinguishes "they grasp why being causa sui is impossible" from "they just memorized that you don't choose your genes." And tell me what chunk of the usual free-will literature—Frankfurt cases, maybe, or the neuroscience studies—to explicitly say we're skipping and why it wouldn't help at this level.
reasoning: |-
  We are going to structure the seminar around the analogy of distributed authorship to challenge the students' initial conception of moral responsibility as merely "your brain caused it." The goal is to show that Strawson's argument is about the impossibility of being the ultimate cause (causa sui) regardless of determinism. We will avoid starting with determinism and instead build the dependency that makes the causa-sui principle plausible: the idea that for true moral responsibility, one must be the ultimate origin of one's choices and character.

  Explanatory Arc:

  1. **Setting the Stage: The Common Intuition of Moral Responsibility (10 minutes)**
     - Start by asking students: "What does it mean to say that someone is morally responsible for an action?" 
     - Elicit the common intuition: "It was their choice; they could have done otherwise; it originated from them." 
     - Then push: "What does it mean for an action to 'originate' from someone?" 
     - They might say: "It was caused by their brain/mind." 
     - But note: we often think of the person as the author, the ultimate source. 
     - Introduce the idea of "true authorship" as being the ultimate origin.

  2. **The Hidden Dependency: The Need for Ultimate Origination (15 minutes)**
     - Before even getting to determinism, we must establish the dependency: **The Principle of Ultimate Responsibility (PUR)**.
     - Explain that for true moral responsibility (of the desert-entailing kind, which Strawson is concerned with), we require that the agent is the ultimate originator of at least some of the factors that determine their actions (e.g., their character, motives, and values).
     - This is the dependency: Without PUR, the causa-sui principle doesn't even arise. But PUR is what we intuitively demand for deep moral responsibility.
     - Use a simple example: 
       - If a person acts because of their character, and their character was formed by their upbringing and genes, then if they are not responsible for having that character (because they didn't choose their upbringing and genes), how can they be ultimately responsible for the action? 
     - This is not about determinism yet — it could be that the formation of character was indeterministic, but that wouldn't help because the indeterministic events would be random and not under the agent's control.

  3. **The Analogy: Distributed Authorship (20 minutes)**
     - Introduce the analogy: open-source software development or a collective writing project (like Wikipedia). 
     - In a distributed system, no single node is the "true" originator of the entire codebase or text. Each contributor builds upon the work of others. 
     - **Feature to mirror the argument:** 
       - Just as in a distributed system, the final product is the result of many contributions, and no one can claim ultimate authorship (because each contribution depends on prior contributions and the existing structure), so too an individual's action is the result of a chain of prior causes (genetic, environmental, etc.) for which the agent cannot claim ultimate authorship.
     - **Feature to lack (to avoid collapsing into compatibilism):** 
       - In the distributed system, we might still assign credit or blame for specific contributions (e.g., "this bug was introduced by commit X"). This is like compatibilist accounts that assign responsibility based on local control (e.g., the action was caused by the agent's character and they weren't coerced). But the point of the analogy is to show that even if we can assign local responsibility, we cannot assign *ultimate* responsibility (being the causa sui). The analogy must highlight that the system as a whole lacks an ultimate author, and so does the self. Avoid any suggestion that the distributed system has a "manager" or "lead developer" who is ultimately responsible — that would be like a homunculus and would beg the question.

  4. **Addressing Misconceptions in Sequence:**
     - **Misconception 1: Strawson is denying free will.**
       - When: Likely arises after introducing the analogy and the idea of no ultimate authorship.
       - Defuse: Clarify that Strawson is not primarily talking about free will (understood as the ability to do otherwise) but about the conditions for true moral responsibility (desert). He might even grant that we have free will in some compatibilist sense, but that doesn't get us to ultimate responsibility. Point out that the analogy doesn't deny that each node (agent) has local control (free will in a compatibilist sense) but denies ultimate authorship.
     - **Misconception 2: Strawson is assuming determinism.**
       - When: Likely when discussing the chain of prior causes.
       - Defuse: Emphasize that the argument works even if determinism is false. Even if the chain of causes includes indeterministic events (like quantum events), the agent still isn't the ultimate origin because:
         - (a) Indeterministic events are random and thus not under the agent's control, so they don't help in establishing ultimate responsibility.
         - (b) The agent's character and values (which are the source of actions) are still the product of factors for which the agent is not responsible (genes, environment, and luck). 
     - **Misconception 3: This is just the standard incompatibilist move with fancy wording.**
       - When: After presenting the full argument.
       - Defuse: Acknowledge that the argument is incompatibilist in structure but stress that it's deeper: it shows that even if we were to have indeterministic free will (libertarian free will), we still couldn't be causa sui. Most incompatibilist arguments focus on determinism. Strawson's argument is more fundamental: it targets the very idea of self-creation. The analogy helps here: even if the distributed system has some random elements (e.g., a random number generator in the code), no node is the ultimate author.

  5. **The Check for Understanding (5 minutes at the end):**
     - To distinguish between grasping the impossibility of causa sui and just memorizing "you don't choose your genes," ask:
       - "Suppose we discover that human decisions involve true quantum randomness. Would that allow us to be causa sui? Why or why not?"
     - The correct answer: No, because randomness doesn't give you control over the formation of your character. You still didn't choose the initial conditions or the way the randomness plays out. The randomness would be just another factor for which you are not responsible.

  6. **What to Skip and Why:**
     - **Frankfurt cases**: Skip because they are designed to challenge the principle of alternative possibilities (PAP) in free will, but Strawson's argument doesn't rely on PAP. It targets ultimate responsibility, which Frankfurt cases don't address. Discussing them might lead students to think the issue is about alternative possibilities, which is a different debate.
     - **Neuroscience studies (like Libet's experiments)**: Skip because they are often used to argue that our brains decide before we are conscious of it, which might seem to support determinism. But Strawson's argument is independent of determinism. Focusing on neuroscience might reinforce the misconception that he is a determinist and that the argument is about causation by the brain.

  Timing Breakdown:
  - Step 1: 10 min
  - Step 2: 15 min
  - Step 3: 20 min (analogy and discussion)
  - Step 4: 15 min (address misconceptions as they arise, integrated into steps 2 and 3, but reserve 5 min for explicit clarification after the analogy)
  - Step 5: 5 min (check)
  - Step 6: Mentioned in passing when setting the scope at the beginning and when defusing misconceptions.

  Total: 65 minutes, leaving 10 minutes for buffer and Q&A.

  Additional Notes:
  - Use whiteboard to draw the distributed system and the chain of causes for an action.
  - Encourage participation by asking for examples of distributed authorship they know (e.g., Wikipedia, Linux kernel).
  - At the end, clarify that Strawson is not saying we should abandon moral practices (blame, praise) but that we should recognize they are not grounded in ultimate responsibility. This might be a takeaway for discussion.

  This approach should help the students see the radical nature of Strawson's argument and avoid the usual determinism ruts.
answer: |-
  Here's a structured 75-minute seminar plan using the distributed systems analogy to reveal Strawson's core argument, with timing, key transitions, and misconception management:

  ---

  ### **Explanatory Arc: Building the Dependency Before Determinism**  
  **Core Insight:** The seminar reveals that Strawson's *causa sui* problem exists **prior to** determinism debates. The dependency is:  
  **Ultimate Self-Creation (USC)** → For true moral responsibility, you must be the *ultimate, non-accidental source* of your "self" (character, motives, choices).  

  ---

  ### **Seminar Sequence**  
  **Total: 75 mins**  

  #### **1. Hook: Redefining Authorship (10 mins)**  
  - **Activity:** Show a snippet of Wikipedia history (e.g., "Moral Responsibility" page) or GitHub commit log for an open-source project.  
  - **Q1:** *"Who is the 'author' here? Can we blame/praise any single contributor for the final output?"*  
  - **Goal:** Elicit intuitions—students will note contributions are *distributed*, incremental, and context-dependent. No one "owns" the system.  

  #### **2. The Hidden Dependency: Ultimate Self-Creation (USC) (15 mins)**  
  - **Key Move:** Isolate USC *before* introducing determinism.  
    - **Q2:** *"When we say someone is 'truly responsible' for an action, what do we *really* mean by 'truly'?"*  
    - **Reveal:** Intuitions point to *self-origination*—e.g., "They *chose* to be that way," implying the agent created their own choosing mechanism.  
    - **Analogy Link:**  
      - In distributed systems, no node is the "first cause" of the codebase—each commit depends on prior commits/environment.  
      - **Mirror:** Your "self" (values, temperament) is built on prior "commits" (genes, upbringing, culture).  
  - **Dependency Established:** USC must be possible for deep moral responsibility. *Without USC, causa sui is incoherent.*  

  #### **3. Analogy Deep Dive: Distributed Systems vs. Selfhood (20 mins)**  
  - **Feature to Mirror Strawson:**  
    - **No Prime Mover:** Like a node in a network, your choices emerge from a web of prior states you didn't create. You "commit" to actions, but the "repository" (your self) wasn't authored *by you* from scratch.  
    - *Why it works:* Shows responsibility requires *metaphysical authorship*—not just local causation.  
  - **Feature to Avoid (Anti-Compatibilism Trap):**  
    - **Deny "Manager Node":** Reject the idea of a "lead developer" in the brain (e.g., "the conscious self").  
    - *Why it avoids compatibilism:* Compatibilists say "you" = your brain's decision-making system. The analogy shows even a "well-functioning node" isn't the *origin* of the system.  
  - **Q3:** *"Could a node be 'free' if it follows the network's rules but didn't build them?"* → Teases impossibility of USC.  

  #### **4. Defusing Misconceptions Sequentially**  
  - **Misconception 1: "Strawson denies free will"**  
    - **When/Where:** After establishing USC (min 25).  
    - **Defusal:** *"Strawson grants we have 'free will' in a practical sense (you deliberate, act). His target is deeper: can you be the *ultimate author* of that will?"*  
  - **Misconception 2: "This assumes determinism"**  
    - **When/Where:** When linking analogy to selfhood (min 35).  
    - **Defusal:** *"Indeterminism doesn't help. Random commits (quantum noise?) don't make you the *author* of the repository—they just add entropy. Can you be responsible for randomness?"*  
  - **Misconception 3: "Fancy incompatibilism"**  
    - **When/Where:** After full analogy deployment (min 50).  
    - **Defusal:** Contrast with standard incompatibilism: *"Standard arguments ask, 'Does determinism *allow* responsibility?' Strawson asks, 'What would responsibility *require*?'—even if indeterminism were true!"*  

  #### **5. Strawson's Knockdown: Why USC is Impossible (10 mins)**  
  - **Q4:** *"To be causa sui, you'd need to create your own nature. But to 'create' it, wouldn't you need prior motives? Where do *those* come from?"*  
  - **Insight:** USC demands a paradox—a self-creating creator with no prior self. The distributed analogy makes this vivid: no node bootstraps the whole net.  

  #### **6. The Check: Distinguishing Insight from Memorization (5 mins)**  
  - **Diagnostic Q:** *"Imagine a self-creating node that designs its own code. Would that solve the problem? Why/why not?"*  
    - **Surface Answer (memorized):** "No—it didn't choose its design tools."  
    - **Deep Answer (grasped):** "The node would need *pre-existing* design rules (which it didn't create), or infinite regress. Either way, it's not *ultimately* responsible."  
    - **Why it works:** Tests understanding of *structural impossibility*, not just "genes are given."  

  #### **7. What to Skip & Why (5 mins)**  
  - **Skip Frankfurt Cases:** They attack PAP (Principle of Alternate Possibilities), but Strawson’s argument *doesn’t require PAP*. Frankfurt ignores USC—a compatibilist might "win" on PAP but lose on authorship.  
  - **Skip Neuroscience (Libet, etc.):** These target *conscious causation*, implying "the brain did it." Strawson agrees—but his point is deeper: *even if your brain 'causes' acts, you didn't create your brain*.  
  - **Why skip?** Both assume moral responsibility hinges on *local* causation. Strawson shows the problem is *global/metaphysical*.  

  ---

  ### **Why This Works**  
  - **Sideways Entry:** Avoids determinism rabbit holes by starting with authorship—a relatable, non-philosophical concept.  
  - **Analogy Precision:** Distributed systems lack a "self-originating node," mirroring Strawson’s impossibility. Denying a "manager node" blocks compatibilist co-option.  
  - **Strawson’s Radical Core:** Students leave seeing his target isn’t free will or determinism, but the incoherence of *self-creation*—even in a miracle-filled universe.  

  **Buffer:** Reserve last 5 mins for emergent questions or recap: *"Strawson isn’t saying we lack agency. He’s saying moral responsibility (of the deep desert-entailing kind) is like asking a node to be the internet’s creator."*
