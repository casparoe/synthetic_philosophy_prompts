answer: |-
  ## The Mechanism Designer's Sestina

  With hopeful lines I draw a fairer **vote**,
  But soon a strategic **shadow** starts to creep.
  I trim the admissible **range** of thought,
  Presuming sheltered from deceitful **truth**.
  Yet this defense, it seems, creates a **dictator**
  In microcosm, warping **preference**.

  Each honest stated **preference** I seek
  To shield within the rules, a guarded **vote**,
  Reveals instead a nascent **dictator** –
  Not one crowned head, but zones where **shadow**s sleep
  To wake when shifted winds expose the **truth**:
  The cost is measured in constrained **range**.

  I map anew, reduce the wide **range**,
  Define the paths for lawful **preference**,
  And bar the door to falsehood's crooked **truth**.
  But lo! Where one was barred, a new false **vote**
  Slips through the gap; a different **shadow**
  Proclaims the birth of yet another **dictator**.

  Is this the only end? This **dictator**,
  This narrowing of freedom's vital **range**?
  Must every patch invite a darker **shadow**?
  Must every shape of honest **preference**
  Be broken on the wheel of crafty **vote**?
  Is mechanism lost to hidden **truth**?

  I chase the ever-fleeting, pure **truth**,
  The dream unmarred by looming **dictator**,
  Where wills align in perfect, free **vote**.
  But three paths fork beyond this fragile **range**;
  To guard against the lie, distort **preference**,
  Or yield to the encroaching **shadow**.

  This constant dance with shifting **shadow**,
  Where patchwork walls obscure the core **truth**:
  We sacrifice the breadth of **preference**,
  Or bow before a fractured **dictator**.
  We cannot hold the unrestricted **range**
  And break the power of the cunning **vote**.

  **Envoi**
  The **dictator** waits where unrestricted **range** demands.
  Each shuttered **preference** lets a new false **vote** ascend.
  The **shadow** haunts; the bitter **truth** still stands.

  ---

  **Note:** The poem arguably oversimplifies by implying all domain restrictions are equivalent in vulnerability to manipulation, whereas some (like single-peaked preferences) demonstrably permit non-dictatorial strategy-proof rules. It also leans towards viewing range restriction as a principled sacrifice rather than a potentially contextually appropriate ad hoc fix.

  Verdict: The poem asserts that the Gibbard-Satterthwaite theorem tragically forces a choice between unrestricted preference expression and immunity to strategic voting for three or more options, revealing that every non-dictatorial "fix" merely shifts the locus of manipulability like a rotating shadow, never achieving both ideals simultaneously.
