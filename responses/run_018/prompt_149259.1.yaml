answer: |-
  ### Essay Question

  **Exam Question:**  
  "Bernard Williams argues that moral revolutions often stem from internal contradictions within existing honor codes, while Kwame Anthony Appiah contends that practices like dueling vanish not through the abolition of honor but its redirection. Using a hypothetical case—the rapid decline of an unwritten rule in high-energy physics granting senior researchers automatic co-authorship on junior colleagues’ papers (termed ‘founder’s privilege’), sustained for decades by an honor culture—evaluate competing explanations for this norm’s collapse. Distinguish among (a) rational argument, (b) material interest, and (c) the redirection of honor. Apply Williams’ and Appiah’s frameworks to diagnose the shift, addressing a key meta-problem: if honor can defend a practice and justify its abandonment, how do we avoid unfalsifiability? Propose a methodological remedy."

  ---

  ### Model Answer (Approx. 700 words)  
  The collapse of "founder’s privilege" in high-energy physics—a norm where seniors automatically secured co-authorship on juniors’ papers—exemplifies how moral revolutions dismantle entrenched honor codes. Competing explanations for such shifts fall into three categories: *rational argument* (deliberate ethical critique), *material interest* (changing incentives), and *redirection of honor* (reconfiguring what merits esteem). Bernard Williams and Kwame Anthony Appiah offer distinct honor-centric frameworks, but their application risks unfalsifiability without methodological safeguards.  

  Williams posits that moral change originates in *internal contradictions* within honor codes. Here, "founder’s privilege" likely clashed with other scientific honor values, like meritocracy and intellectual integrity. Initially, automatic co-authorship honored seniors’ foundational lab contributions. Yet, as physics globalized, cases arose where seniors claimed credit for minimal input, clashing with the field’s core value of rigorous attribution. This tension—between hierarchical loyalty and meritocratic fairness—destabilized the norm. Junior physicists, invoking honor to demand earned recognition, exposed this contradiction. Williams would argue the practice collapsed not from external pressure but because the honor code fractured under its own logic. Conversely, *rational argument* (e.g., ethics papers condemning honorary authorship) or *material interest* (e.g., funders penalizing inflated publications) might be secondary: rational critique often gains traction only once honor codes shift, while material changes (e.g., talent drain) could stem from eroded honor.  

  Appiah, however, sees honor as redirected, not discarded. For him, honor is plastic; abandoning dueling meant channeling honor toward nonviolent conflict resolution. In physics, declining "founder’s privilege" reflects honor’s redirection toward *collaborative integrity*. Seniors who renounce automatic co-authorship are now lauded for "mentorship honor," elevating their status by visibly empowering juniors. Appiah would note how external triggers—say, public scandals over authorship fraud—accelerated this shift, but the *mechanism* was honor recalibrating around new virtues. Unlike Williams’ internal conflict, Appiah’s redirection could occur without contradiction, as communities adopt global standards (e.g., the ICMJE authorship guidelines) that redefine honorable conduct.  

  Yet both honor-based explanations face a meta-problem: unfalsifiability. If honor justified "founder’s privilege" (as deference to legacy) and its abolition (as fairness), any outcome is explicable post hoc. Williams might attribute collapse to contradictions; Appiah might call it redirection. But without constraints, honor becomes a universal solvent, dissolving counterevidence. For instance, if the norm persisted, one could invoke honor’s resilience—rendering the theory untestable.  

  To remedy this, we demand *pre-registered falsification criteria*. For Williams, specify *in advance* what contradictions would destabilize the code (e.g., if juniors publicly cite honor to reject co-authorship). For Appiah, require evidence of *new honor markers* preceding decline (e.g., awards for ethical mentorship emerging pre-collapse). This tests whether honor drives change or rationalizes it. In physics, if authorship disputes surged *before* funders imposed rules, Williams gains credence; if new honor rituals (e.g., "integrity pledges") arose early, Appiah’s view holds. Material or rational factors become alternative hypotheses: if authorship reforms followed funding cuts alone, honor is epiphenomenal.  

  Ultimately, the physics case reveals honor’s dual role. Williams explains why internal fractures ignite change; Appiah shows how honor morphs to sustain community cohesion. By binding these frameworks to falsifiable predictions, we isolate honor’s true explanatory power—distinguishing moral revolutions from mere opportunism.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A-grade threshold**: 21+ marks (exceptional answers exceed minimum requirements with originality, precision, and synthesis).  
  **B-grade threshold**: 16–20 marks (competent but lacks depth in ≥1 move or has minor errors).  

  #### **Move 1: Conceptual Distinction of Mechanisms (9 marks)**  
  - **Full credit (8–9)**: Clearly defines rational argument (deliberative ethics), material interest (economic/social incentives), and honor redirection (revaluing esteem), with explicit, accurate references to Williams (internal contradictions) and Appiah (honor’s plasticity).  
  - **Typical failure modes (deduct 3–5 marks)**:  
    - Vague or merged definitions (e.g., conflating rational argument with material interest).  
    - Misattributing ideas (e.g., assigning "redirection" to Williams).  
    - No explicit naming of Williams/Appiah.  

  #### **Move 2: Application to Physics Case (9 marks)**  
  - **Full credit (8–9)**: Concrete analysis showing:  
    - *Williams*: Internal contradiction (e.g., "founder’s privilege" vs. meritocracy causing honor-code tension).  
    - *Appiah*: Honor redirection (e.g., seniors gaining esteem through mentorship, not authorship).  
    - Contrast with rational argument (e.g., ethics guidelines) and material interest (e.g., funding reforms) as secondary or distinct.  
  - **Typical failure modes (deduct 3–5 marks)**:  
    - Generic descriptions without physics-specific details (e.g., "honor changed" without examples).  
    - Fails to differentiate Williams/Appiah (e.g., same honor dynamic for both).  
    - Omits comparison to rational/material factors.  

  #### **Move 3: Unfalsifiability Problem and Remedy (7 marks)**  
  - **Full credit (6–7)**:  
    - Identifies unfalsifiability: Honor explains both persistence ("deference") and collapse ("fairness"), risking post-hoc justification.  
    - Proposes a specific remedy (e.g., pre-registered criteria like "junior appeals to honor pre-collapse" for Williams; "new honor rituals pre-dating change" for Appiah).  
  - **Typical failure modes (deduct 2–4 marks)**:  
    - Superficial problem identification (e.g., "honor is vague" without unfalsifiability focus).  
    - Remedy is impractical/unrelated (e.g., "abandon honor-based explanations").  
    - No link to Williams/Appiah.  

  #### **General Deductions (applied holistically)**  
  - **Clarity/structure**: −1–2 marks for disorganized arguments.  
  - **Over-reliance on paraphrase**: −2–3 marks for minimal original analysis.  
  - **Word limit (±10%)**: No penalty, but >880 words may lack concision.  

  ---  
  This instrument assesses students’ ability to dissect moral change through applied philosophy, emphasizing conceptual rigor over rote recall. The hypothetical physics case grounds abstract theory, while the marking scheme prioritizes the three core moves to distinguish A/B performance.
