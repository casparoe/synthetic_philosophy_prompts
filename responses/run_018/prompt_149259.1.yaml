  ---

  **Essay Question:**

  In his work on moral change, Bernard Williams argues that shifts in moral practices often stem from internal contradictions within existing honor codes, while Kwame Anthony Appiah contends that honor is not eliminated but redirected when practices such as dueling disappear. Consider a contemporary hypothetical: For decades, an unwritten rule in high-energy physics granted senior researchers ("founders") automatic co-authorship on junior colleagues' papers, sustained by an honor culture of "founder's privilege." Recently, this practice has rapidly declined. 

  Using this case, critically evaluate the competing explanations for the collapse of entrenched norms: (a) rational argument, (b) material interest, and (c) the redirection of honor. Specifically, apply Williams’ and Appiah’s frameworks to diagnose the decline of "founder's privilege." In doing so, be sure to:

  1. Distinguish genuine explanations from post-hoc rationalizations for the change.
  2. Confront the meta-problem that honor-based accounts risk unfalsifiability, since honor can be invoked to defend a practice and equally to justify its abandonment. Propose a methodological remedy for this problem.

