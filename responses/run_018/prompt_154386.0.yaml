answer: |-
  This ethical structure is both philosophically fascinating and highly specific. While it touches upon several established concepts, **no single, universally recognized term captures this exact configuration** in moral philosophy. However, we can break it down, relate it to existing ideas, and propose precise coinages.

  **Key Features of Your Structure:**

  1.  **Quantitative Commensurability (Below Threshold):** Pleasure and suffering are treated as fungible quantities on a single scale ("utils") for trade-offs.
  2.  **Sharp Intensity Threshold:** A precisely defined point (intensity level) for a specific *kind* of suffering ("abyssal anguish").
  3.  **Qualitative Shift (Above Threshold):** Suffering above this threshold undergoes a discontinuous change in status. It is **lexically prior** and **non-compensable** – no amount of pleasure, however distributed, can morally offset it.
  4.  **Continuity Below:** Below the threshold, the same suffering type is treated identically to lesser pains and subject to standard trade-offs.

  **Distinction from Similar Concepts:**

  *   **Absolute Prohibition (e.g., Deontological Taboo):** This forbids an *act* (e.g., torture, murder) regardless of consequences or intensity. Your system forbids *outcomes* (experiencing abyssal anguish) based solely on their *intensity*, regardless of the act causing it (unless the act inherently guarantees crossing the threshold). It also permits the *same kind* of suffering below the threshold.
  *   **Strict Negative Utilitarianism:** Prioritizes minimizing suffering absolutely, often implying that even minor suffering cannot be outweighed by vast pleasure. Your system *does* allow trade-offs below the threshold and only imposes an absolute ban above an intensity ceiling.
  *   **Regular Utilitarianism (Act or Rule):** Treats *all* experiences as commensurable on a single scale, allowing any suffering to be offset by sufficient pleasure, regardless of intensity. Your system explicitly rejects this above the threshold.
  *   **Threshold Deontology:** Combines consequentialism below a threshold with deontological constraints above it. This is *conceptually closest*, but Threshold Deontology typically applies to constraints on *actions* (e.g., "Don't lie unless lives are at stake"), not to the *intrinsic moral weight of an experiential state* based solely on its intensity.
  *   **Lexical Priority (Rawls):** Certain principles (like basic liberties) must be satisfied before others can be considered. Your system applies lexical priority to a *specific intensity level of a negative experiential state* over all positive states.
  *   **Suficientarianism:** Focuses on ensuring people meet a threshold level of goods (e.g., basic needs). Your system defines a *sufficiently bad* level of suffering that cannot be tolerated, regardless of benefits elsewhere – it's a "negative sufficientarianism" focused on a suffering ceiling.

  **Precise Coinages & Boundary Conditions:**

  Given the lack of a perfect established term, here are coined phrases capturing the essence, with boundary condition explanations:

  1.  **Lexical Suffering Threshold (LST):**
      *   *Meaning:* Emphasizes the sharp boundary ("threshold") and the absolute priority ("lexical") given to suffering exceeding it. "Suffering" specifies the domain.
      *   *Boundary Conditions:* The threshold applies **primarily to individual instances of experience.** An individual experiencing suffering above the LST triggers the non-compensability rule for *that specific instance*. Aggregation occurs *below* the threshold (standard trade-offs) and *across individuals* who experience suffering *above* the LST (the system would seek to minimize the *number* of such experiences, as each is an absolute moral harm). Pleasure cannot compensate for *any single instance* above the threshold, nor for the *aggregate fact* that such instances occurred.

  2.  **Abyssal Prohibition Axiom (APA):**
      *   *Meaning:* Incorporates your evocative "abyssal" term. "Prohibition" highlights the absolute ban on compensation. "Axiom" positions it as a fundamental rule within the calculus.
      *   *Boundary Conditions:* As above. The "Prohibition" applies to the act of *using any quantum of pleasure to ethically justify allowing or causing an individual experience exceeding the abyssal threshold*. Aggregation of sub-threshold suffering is permitted; aggregation of supra-threshold suffering is only relevant for counting distinct forbidden events, not for trading against pleasure.

  3.  **Nonlinear Axiological Discontinuity (NAD):**
      *   *Meaning:* Most technical. "Nonlinear" indicates the sharp break in the value function. "Axiological" relates to value theory. "Discontinuity" directly describes the abrupt change at the threshold.
      *   *Boundary Conditions:* The discontinuity exists in the **marginal moral weight** of suffering intensity. Below threshold: marginal weight is finite and constant (or smoothly varying). At threshold: marginal weight becomes effectively infinite. This applies per experiential unit exceeding the threshold for an individual. Aggregation is defined by summing these discontinuous individual impacts.

  **Recommendation for Your Novel:**

  *   **Use "Lexical Suffering Threshold (LST)" for Conceptual Rigor:** This term is relatively clear, connects directly to established philosophical concepts (lexical priority, thresholds), and accurately describes the core mechanism. It sounds plausible as technical jargon within a futuristic ethical calculus.
  *   **Use "Abyssal Anguish" as the Narrative Term:** Keep this evocative term for the *experience itself* within the society. The *rule* governing it is the LST. Citizens might colloquially refer to "crossing the abyss" or "hitting the pain ceiling," but the formal system operates with the LST.
  *   **Clarify Boundary Conditions in Exposition:** Crucial to explain explicitly whether the threshold applies per individual experience, per person over time, or to aggregates. The most philosophically coherent and dramatically potent version is the **per-individual-experience threshold.** This means:
      *   A single person enduring one minute of supra-threshold suffering creates an uncompensable moral harm.
      *   Preventing one such minute is infinitely more important than generating any amount of pleasure.
      *   A large population experiencing suffering *just below* the threshold could, in theory, be outweighed by sufficient distributed pleasure (though this might be practically impossible or politically untenable).
      *   The system would tally *instances* of supra-threshold suffering as absolute negative events to be minimized.

  This structure creates profound narrative tension: the constant risk of accidentally or unavoidably crossing that infinitesimally thin, yet infinitely deep, line in the pursuit of a greater good defined by the calculus itself. It forces characters (and readers) to confront the terrifying precision of the line and the absolute chasm it represents in moral accounting. Good luck with your novel!
