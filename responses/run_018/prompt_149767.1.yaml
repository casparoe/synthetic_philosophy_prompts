answer: |-
  ### Step 1: Brainstorming the Structural Distinction  
  **Sympathy** (TMS I.i.1-2):  
  - *Mechanism*: An imaginative "changing places in fancy" with another to mirror their affective state. Requires vivid situational data to approximate "fellow-feeling."  
  - *Function*: Primarily **affective/experiential**. Generates shared emotion but may produce discord if imaginative projection fails.  
  - *Scope*: Grounds interpersonal emotional connection but is context-dependent and prone to bias (e.g., stronger for proximate/visible suffering).  

  **Impartial Spectator** (TMS III.1-3):  
  - *Mechanism*: An internalized, idealized observer formed through socialization. Judges the **propriety** (suitability to context) of emotions/actions, not their "merit" (praiseworthiness).  
  - *Function*: Primarily **normative/judgmental**. Emerges reflexively to evaluate whether sentiments align with what an unbiased person *ought* to feel.  
  - *Scope*: Corrects partiality by abstracting from personal bias toward generalizable standards.  

  **Core Distinction**: Sympathy is *input-oriented* (seeking affective congruence), while the spectator is *output-oriented* (assessing contextual appropriateness).  

  ---

  ### Step 2: Comparison Under Structural Opacity  
  **Structural Opacity Defined**:  
  Agent A suffers genuine harm, but Observer B lacks transparent access to:  
  - Intensity of A’s pain (e.g., chronic illness with invisible symptoms),  
  - Causation (e.g., systemic injustice),  
  - Subjective character (e.g., cultural/psychological nuances).  

  #### **Sympathy’s Limitations**:  
  - **Failure Mechanism**: Smithian sympathy depends on observable cues to reconstruct affect (TMS I.i.1.2). Opacity starves imagination, causing:  
    - Under-sympathizing (e.g., dismissing depression as "laziness"),  
    - Mis-sympathizing (e.g., attributing economic hardship to personal failure).  
  - **Justice Implications**: Sympathy cannot reliably ground justice judgments here. Justice requires consistent rules (TMS II.ii), but sympathy’s variability under opacity risks arbitrariness.  

  #### **Impartial Spectator’s Role**:  
  - **Resolution Strategy**: The spectator bypasses affective gaps by applying **generalizable standards of propriety**:  
    - Focuses on *externally verifiable actions* (e.g., breach of contract, physical assault) over inaccessible internal states.  
    - Asks: *"Would an impartial observer deem this act improper given known circumstances?"* (TMS III.3.4).  
  - **Justice Advantage**: Propriety judgments under opacity rely on:  
    - **Rule-based heuristics**: Norms derived from accumulated experience (e.g., "Inflicting unprovoked harm is unjust").  
    - **Causal inference**: Assigning responsibility based on observable evidence (e.g., negligence despite opaque suffering).  

  #### **Key Contrast**:  
  | **Criterion**               | **Sympathy**                            | **Impartial Spectator**                 |  
  |-----------------------------|----------------------------------------|----------------------------------------|  
  | **Epistemic Basis**         | Affective imagination (fragile under opacity) | Normative standards (robust under opacity) |  
  | **Justice Grounding**       | Unreliable; requires resonance         | Reliable; focuses on action propriety  |  
  | **Output**                  | Fellow-feeling (often absent)          | Judgment of wrongdoing (enforceable)   |  

  ---

  ### Step 3: Smith’s Mechanism for Enforcing Justice  
  **Smith Relies on the Impartial Spectator** to explain justice obligations without sympathy.  

  **Justification**:  
  1. **Sympathy’s Insufficiency** (TMS II.ii.3.6): Smith notes we demand punishment for injustices *even when* we feel no sympathy for the victim (e.g., punishing a thief who steals from a stranger). Sympathy is too contingent to uphold universal justice.  
  2. **Spectator’s Normative Architecture**:  
     - **Propriety Over Resonance**: Justice concerns "exact" duties (TMS II.ii.1.5) where the spectator condemns *actions violating negative rights*, regardless of sympathy’s presence.  
     - **General Rules** (TMS III.4.8): Spectator judgments crystallize into rules of justice ("sacred laws") enforceable via third parties (e.g., courts). These rules compensate for opacity by standardizing responses.  
  3. **Structural Opacity Solution**: When suffering’s cause/intensity is opaque, the spectator asks: *"Does the act violate a general rule protecting societal order?"* (e.g., enforcing contracts despite unclear emotional harm). This substitutes normative certainty for affective uncertainty.  

  **Conclusion**: For Smith, justice is upheld by the impartial spectator’s propriety judgments codified into rules, which function *precisely when* sympathy fails due to opacity or emotional distance. This explains why justice obligations are externally enforceable (via laws/institutions) while beneficence remains voluntary.  

  ---

  **Sources**:  
  - Smith, A. (1759/1790). *The Theory of Moral Sentiments*. Key sections: I.i.1, II.i-ii, III.1-4.  
  - Broadie, A. (2009). *The Cambridge Companion to the Scottish Enlightenment*.  
  - Fleischacker, S. (2004). *On Adam Smith’s Wealth of Nations*. Ch. 4.
