  Formal arguments come into play too. Consequentialist critiques might argue that shields could encourage aggression. Deontologists might see delegation as shirking personal duty. These are theoretical challenges. Then there's the charge of unfalsifiability—if every counterexample is dismissed by saying delegation wasn't genuine, the theory becomes untestable. The user is worried about this, so it needs addressing.

