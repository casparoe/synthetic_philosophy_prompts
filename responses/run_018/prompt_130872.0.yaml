prompt: |-
  I've been working through the history of the genocide concept and I think I've hit a confusion about Lemkin's own trajectory. From what I understand, Lemkin introduced the term in his 1944 study with a very broad definition that covered cultural, economic, and political destruction, but during the drafting of the 1948 Convention he personally pushed to narrow it to physical and biological annihilation, believing that cultural destruction was a different moral category altogether. If that's correct, then modern activists who invoke "cultural genocide" are not only facing a legal gap in the Convention — they are also misrepresenting Lemkin's mature conceptual judgment, which came to treat cultural erasure as a wrong of a different kind rather than an incomplete form of genocide. So shouldn't we regard "cultural genocide" as a category error rooted in a misunderstanding of Lemkin's refined position, rather than as a legitimate but excluded part of the framework? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating my question.
reasoning: |-
  Okay, the user is diving deep into the history of the genocide concept, specifically Lemkin's evolution. They're pointing out a tension: Lemkin's 1944 broad definition included cultural destruction, but by 1948, he apparently supported narrowing the UN Convention to physical/biological annihilation. The user concludes that modern activists using "cultural genocide" might be misrepresenting Lemkin's mature view and committing a category error.  

  Hmm, this is a nuanced historical-legal question. The user seems academically inclined—probably a grad student or researcher given their precise language. Their tone suggests frustration with activists "misrepresenting" Lemkin, but also genuine curiosity about conceptual accuracy.  

  First, I need to verify their premise: Did Lemkin *really* abandon cultural destruction as part of genocide? Digging into sources... Ah, yes and no. While he pragmatically accepted the Convention's narrow legal definition to gain political consensus, his private writings and later work (like his unpublished history of genocide) kept defending cultural destruction as *core* to genocide. For example, he called the Convention a "compromise" and kept arguing that destroying a group's culture was intrinsically genocidal.  

