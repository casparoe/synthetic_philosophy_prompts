  The retired magistrate case is perfect for stress-testing - it combines kinship tension with lapsed role duties. I'll invent a parallel "physician neighbor" scenario to check medical role boundaries. 

  Biggest challenge: that correction/harmony pendulum in parenting. My solution path - reframe roles as having core non-negotiable duties (stopping active harm) versus negotiable cultivation duties (teaching rituals). Depression creates incapacity, temporarily disabling cultivation duties. 

  Their temporary caretaker judgment might be the weak spot - is two weeks really insufficient for moral authority? But dropping that feels defensible since Confucianism emphasizes sustained relational investment. 

  User's clearly done their homework - those examples cover reciprocity, hierarchy, and situational ethics. Impressive self-awareness about rationalization risks too. They'll probably poke holes in any principle I propose, which is exactly what they need.
answer: |-
  ### Summary of verdicts  
  You consistently prioritize **role integrity over rigid universality**. Key patterns:  
  - **Role boundaries matter**: Recusal is mandatory for close kin (son) but excessive for casual ties (chess partner). Parental authority wanes when children become autonomous adults.  
  - **Core duties differ**: Teaching ritual propriety (*li*) to minors is non-negotiable, but coercion invalidates the role’s purpose. Moral correction is essential except during crises (depression) where emotional safety overrides.  
  - **Role specificity**: Grading your child requires strict neutrality; temporary caretakers lack deep moral authority; friends must report active harm but protect irrelevant secrets.  
  - **Harm thresholds**: Immediate danger (poisoning) mandates intervention, while past mistakes without ongoing harm permit discretion.  

  ### The principle and its clauses  
  Your judgments align with a **Hierarchical Role Fulfillment Principle (HRFP)** with three clauses:  

  1. **Scope Activation Clause**:  
     A role’s obligations activate *only* when its specific relational context is materially relevant.  
     *→ Recusal for sons (family role corrupts judicial role) but not chess buddies (no role conflict). Adoptive parents gain full authority (parental role activated); temporary caretakers don’t (role scope limited to physical care).*  

  2. **Non-Abrogation Clause**:  
     Core role duties *cannot* be waived *unless* fulfilling them would:  
     a) Permanently undermine the relationship’s ethical purpose (e.g., coercing an autonomous adult child violates *ren* 仁/benevolence),  
     b) Or cause catastrophic harm due to acute vulnerability (e.g., correcting a depressed child risks psychological collapse → harmony temporarily supersedes correction).  
     *→ Fathers teach *li* to children (core duty) but not adults (violates benevolence). Friends report poisoning (prevents catastrophe) but keep harmless secrets (preserves trust).*  

  3. **Neutrality Imperative**:  
     When roles intersect (e.g., parent/teacher), strict adherence to the *secondary role’s standards* is required.  
     *→ Grading your child demands academic accuracy, not emotional bias.*  

  **Depression exception rule**: Moral correction is suspended *only* when a subject’s incapacitation (e.g., clinical depression) renders them incapable of integrating feedback without severe destabilization. Duty resumes upon recovery.  

  ### The new cases  
  **Retired magistrate & estranged brother**:  
  He *should not* arbitrate. Though retired, the familial history creates role contamination:  
  - Estrangement implies unresolved obligations/resentments (violating Scope Activation: kinship ties are materially relevant).  
  - Informal arbitration still requires perceived impartiality; Confucian roles demand avoiding even *apparent* relational compromise.  

  **Your invented scenario: Physician neighbor discovers your terminal illness before your family**:  
  **Verdict**: She *must* tell you first but *cannot* disclose to family without consent.  
  - **HRFP application**: Her *medical role* activates upon diagnosis (Scope Activation). Core duties (patient confidentiality/autonomy) cannot be waived (Non-Abrogation)—unless you’re incapacitated. Informing family preemptively violates neutrality between professional and neighbor roles.  

  ### What has to go  
  **The weakest link**: Your "two-week caretaker" verdict. If Confucian roles derive from sustained relational investment (*xin* 信/trust), a two-week caretaker *could* have moral authority if they’re the sole stable influence (e.g., the child has no parents). Your "no probation" adoption stance acknowledges this — yet you deny it to short-term cases.  

  **Is it salvageable?** Only by reframing: The caretaker’s role *does* include moral guidance, but its *intensity* scales with **relational permanence**. Dropping your verdict is defensible: roles aren’t all-or-nothing but exist on a continuum. A two-week caretaker *should* correct blatant dishonesty (core ethics), but not enforce ritual greetings (role-specific *li*). This preserves the HRFP by clarifying that "moral authority" isn’t binary.  

  **The correction/harmony tension holds** under HRFP: Depression creates temporary incapacity (Non-Abrogation Clause b), making suspension coherent. The principle bends but doesn’t break.
