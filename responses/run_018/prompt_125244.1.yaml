answer: |-
  Below is a branching taxonomy for positions on social construction, based on your diagnostic case and branching questions. Positions are defined by their answers to concrete cases, with each leaf stating a named/described stance and its "awkward commitment." Logical gaps are noted where combinations are unoccupied.

  ---

  ### **Starting Node: The Defunct Banknote**
  > *A physical banknote from a dissolved state (30 years defunct) circulates only among collectors. Is it still money?*
  - **Branch A: Yes, it is still money** → Proceeds to Q1  
    *(Implies money can exist without institutional backing, sustained by practice/attitude)*
  - **Branch B: No, it is not money** → Proceeds to Q1  
    *(Implies money requires active institutional/legal grounding)*

  ---

  ### **Question 1: Sustaining Mechanism**  
  *Does sustaining the kind require explicit collective agreement, or can distributed practices do the work alone?*  
  - **Agreement-Dependent (AD)**: Explicit collective agreement (e.g., laws, declarations) is necessary.  
  - **Practice-Dependent (PD)**: Distributed practices, habits, or uncoordinated attitudes suffice.  

  ### **Question 2: Feedback Loops**  
  *Does being classified in the kind create feedback loops that change members' properties or behavior?*  
  - **Feedback Present (FP)**: Kind-membership causally reshapes individuals (e.g., social expectations alter biology/behaviour).  
  - **Feedback Absent (FA)**: Classification has no such looping effects (e.g., kinds are static categories).  

  ### **Question 3: Biological Correlates**  
  *Do biological correlates play any causal role in the kind's social function, even if not definitional?*  
  - **Biology Relevant (BR)**: Biological features (e.g., chromosomes, phenotype) play a causal role in social dynamics.  
  - **Biology Irrelevant (BI)**: Biology is incidental; social function operates independently.  

  ---

  ### **Taxonomy Leaves**  
  *(Positions derived from combinations of answers)*  

  #### **BRANCH A: Defunct Banknote is STILL MONEY**  
  *(Practice-based ontologies)*  
  1. **A + PD + FA + BI**  
     → **Position**: *Practice-Based Realism* (e.g., Searle-style collective intentionality).  
     → **Awkward Commitment**: *Must insist a defunct banknote is "money" despite having no economic function beyond niche collector transactions.*  
  2. **A + PD + FP + BI**  
     → **Position**: *Performative Institutionalism* (e.g., gender as reiterated doing; money as network effect).  
     → **Awkward Commitment**: *Denies biology any role in gender/race, making it difficult to explain why societies consistently map social kinds onto specific bodily traits.*  
  3. **A + PD + FP + BR**  
     → **Position**: *Pluralist Naturalism* (e.g., Boydian HPC kinds).  
     → **Awkward Commitment**: *Concedes biological correlates matter for race/gender, undermining claims they are "purely" constructed, while insisting collector banknotes are "money" via practice alone.*  
  4. **A + PD + FA + BR**  
     → **GAP**: *Unoccupied*. Sustaining by practice alone (PD) with no feedback (FA) but biology causal (BR) is incoherent for human kinds: if biology matters, feedback loops arise.  

  #### **BRANCH B: Defunct Banknote is NOT MONEY**  
  *(Institution-dependent ontologies)*  
  5. **B + AD + FA + BI**  
     → **Position**: *Institutional Realism* (e.g., John R. Searle).  
     → **Awkward Commitment**: *Must deny that gender/race exist as institutional kinds in stateless societies, despite evidence of cross-cultural categorisation.*  
  6. **B + AD + FP + BI**  
     → **Position**: *Structural Reproduction Theory* (e.g., Bourdieu-inspired).  
     → **Awkward Commitment**: *Claims institutions alone sustain gender/race but ignores how pre-institutional biological differences (e.g., childbirth) shape those institutions.*  
  7. **B + AD + FP + BR**  
     → **Position**: *Interactive Kinding* (e.g., Ian Hacking’s looping effects).  
     → **Awkward Commitment**: *Affirms biology’s causal role for race/gender but denies it for money, creating tension: why can’t biology be irrelevant for human kinds too?*  
  8. **B + AD + FA + BR**  
     → **GAP**: *Unoccupied*. Institutions required (AD), no feedback (FA), but biology causal (BR) is untenable: if biology matters, feedback loops inevitably occur.  

  #### **ADDITIONAL LEAF (Cross-branch)**  
  9. **B + PD + Any + Any**  
     → **GAP**: *Logically incoherent*. If the banknote isn’t money (Branch B), it contradicts PD (which holds practices alone sustain kinds).  

  ---

  ### **Notable Gaps & Coherence**  
  - **Feedback Loops Asymmetry**: No position affirms FP for gender/race but FA for money. *Coherent but unexplored*: money lacks psychological interiority, so feedback loops may not apply identically.  
  - **Biology for Money?**: All positions treat money as BI (no biological correlates). *Conceptually necessary*: money lacks biological substrates.  
  - **Practice + Institutions?**: No position combines PD and AD. *Incoherent*: practices and formal agreement are rival sustaining mechanisms.  
  - **FA + FP for Same Kind?**: Denying feedback loops for race but affirming for gender (e.g., **AD + FA + BR** for race + **AD + FP + BR** for gender) is *theoretically possible but unmotivated*—both kinds exhibit looping effects historically.  

  ---  
  This taxonomy isolates core commitments using concrete cases, exposing tensions (e.g., practice-based money vs. biology-involving human kinds) and forcing clarity on whether social kinds require institutional anchors, reshape their members, or interface with biology.
