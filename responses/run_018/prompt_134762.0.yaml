prompt: |-
  In my game theory seminar the TA keeps dropping 'mixed strategies are just ignorance in fancy dress' whenever iterated dominance comes up. I asked whether a rational player could ever include a strictly dominated pure stragegy inside her support in a continous game, and she just repeated the line. Can you unpack the different precise claims that slogan could be making? I'm thinking: (a) an epistemic claim that probabilities only represent opponent beliefs, (b) a normative claim that rational agents never use randomizing devices, (c) a metaphysical claim that there's no real indeterminacy in choice, or (d) a methodological claim that mixing is just a population-level prediction tool. For each, say whether it's trivial, defensible, or actually false, and say which ones — if any — actually answer my question about domination inside a support. I want to bring a clear menu to office hours so I can see whether she's making a point or dodging.
reasoning: |-
  Okay, the user is in a game theory seminar where the TA keeps saying "mixed strategies are just ignorance in fancy dress" when iterated dominance comes up. The user asked if a rational player could ever include a strictly dominated pure strategy in their support in a continuous game, but the TA just repeated the slogan. Now the user wants to unpack different interpretations of that slogan and see which ones address their question.

  First, I need to break down the possible meanings of the TA's statement. The user suggested four interpretations: (a) epistemic, (b) normative, (c) metaphysical, and (d) methodological. I should evaluate each of these for whether they're trivial, defensible, or false, and see if they answer the question about dominated strategies in the support.

  Starting with (a) the epistemic claim. This is about probabilities representing uncertainty in opponents' beliefs. Harsanyi's purification theorem is relevant here—mixed strategies can be seen as pure strategies under uncertainty. This interpretation is defensible and actually answers the user's question because in a Nash equilibrium with mixed strategies, no rational player would include a strictly dominated strategy in their support. The purification approach shows that such strategies would be purged.

  Next, (b) the normative claim. This suggests rational players shouldn't use random devices. But game theory recommends mixing in some cases, like matching pennies. So this is actually false. It doesn't address the support question because even if players use random devices, they wouldn't include dominated strategies. So it's not relevant to the user's query.

  Then, (c) the metaphysical claim. This is about no real indeterminacy in choices. But that's a philosophical stance, not relevant to game theory models. It's defensible but trivial in this context. Doesn't answer the support question at all.

  Lastly, (d) the methodological claim. Here, mixed strategies are a tool for predicting population-level behavior, not individual randomness. This is defensible and common in evolutionary game theory. It does answer the support question: in a stable population, strictly dominated strategies wouldn't persist, so they shouldn't be in the support.

  The user's main concern is whether any of these interpretations justify including a dominated strategy in the support. The epistemic and methodological interpretations clearly say no, while the others don't address it. The TA might be dodging by repeating the slogan instead of engaging with the technical question. The user should focus on the epistemic and methodological points in office hours to get a clear answer.
answer: |-
  Here's a clear breakdown of the TA's slogan interpretations, their validity, and their relevance to your specific question about dominated strategies in a support. Crucially, **none of the defensible interpretations justify including a strictly dominated strategy in the support of a rational player's mixed strategy in a continuous game.** The TA's repetition likely dodges your precise technical question.

  ### Interpretation Menu & Evaluation

  1.  **Interpretation (a): Epistemic Claim ("Probabilities represent opponent uncertainty")**
      *   **Claim:** Mixed strategies don't represent an actual randomizing device used by a player. Instead, the *probability* assigned to a pure strategy represents the *beliefs of opponents* about what pure strategy that player will choose. The player themselves is choosing a pure strategy, but opponents are uncertain which one.
      *   **Validity:** **Defensible (and very common).** This is the core of Harsanyi's "Purification Theorem." In games with even tiny amounts of private uncertainty about payoffs (incomplete information), every mixed strategy Nash equilibrium of the original game corresponds to a pure strategy Bayesian Nash equilibrium of the perturbed game. The "mixed strategy" is just a way to compactly represent the opponents' uncertainty over the player's optimal pure choice given their private information.
      *   **Relevance to Your Question:** **Directly Answers (No).** In this view, a "mixed strategy" with a dominated strategy `d` in its support would imply opponents believe there's some chance the player chooses `d`. However, for the player to be rational, they must *never* actually choose `d` (because it's strictly dominated). Therefore, opponents *should not* assign positive probability to `d` if they believe the player is rational. Including `d` in the support contradicts the assumption of rationality and common belief in rationality that underpins concepts like iterated dominance and Nash equilibrium. A rational player's *actual choice* (the pure strategy they pick based on their type) is never dominated.

  2.  **Interpretation (b): Normative Claim ("Rational agents never use randomizing devices")**
      *   **Claim:** Truly rational players deterministically choose the single best pure strategy. Using a physical randomizer (like a coin flip) is inherently irrational. Mixed strategies only appear in models because theorists are lazy or confused.
      *   **Validity:** **Actually False (as a general normative claim).** Game theory *prescribes* mixing in specific situations. In Nash Equilibrium, mixing is rational *precisely because* it makes opponents indifferent, preventing them from exploiting a predictable pure choice. The classic example is Matching Pennies: playing Heads or Tails purely 100% of the time is exploitable and yields lower *expected* payoff than a 50-50 mix against a rational opponent. Randomizing *is* the uniquely optimal (maximin, best-response) behavior here. Rationality is about maximizing *expected* utility given beliefs; randomization is a tool to achieve that.
      *   **Relevance to Your Question:** **Irrelevant/Distraction.** Even if a rational player *did* use a randomizing device (which game theory often says they rationally *should*), they would **never** assign positive probability to a strictly dominated strategy `d`. Why? Because `d` yields strictly lower payoff than *some other strategy* against *every* possible opponent play. Including `d` would strictly lower the player's *expected payoff* no matter what the opponents do. This holds regardless of whether the mixing is "real" randomness or just epistemic uncertainty. The TA's repetition of the slogan dodges your question by shifting focus to a false claim about rationality and randomization, ignoring the core dominance logic.

  3.  **Interpretation (c): Metaphysical Claim ("No real indeterminacy in choice")**
      *   **Claim:** Human decisions are fundamentally deterministic (based on brain states, environment, etc.). True randomness doesn't exist in decision-making. Mixed strategies are therefore an artificial modeling device that doesn't reflect "real" choice.
      *   **Validity:** **Defensible (but Philosophically Contentious & Trivial for Game Theory).** This delves into free will/determinism debates. While scientifically plausible, it's irrelevant to *normative* game theory. Models assume agents *can* make choices (whether determined or not) and define rationality based on payoff maximization. The model's purpose is prediction and prescription, not metaphysics. Whether a "choice" is determined or "random" at some fundamental level doesn't change the strategic logic within the model.
      *   **Relevance to Your Question:** **Irrelevant.** This interpretation says nothing about *which* strategies (pure or mixed) a rational agent would choose *within the model*. It attacks the ontological status of "mixing" itself but doesn't engage with the logic of dominance or support. It doesn't provide any reason why a rational player, following the rules of the game theory model, would include a dominated strategy in their support.

  4.  **Interpretation (d): Methodological Claim ("Population-level prediction tool")**
      *   **Claim:** Mixed strategies are not meant to describe individual behavior at all. They are a mathematical tool to represent the distribution of pure strategies within a large population of players (e.g., in evolutionary game theory). The "probability" is the fraction of the population playing that pure strategy.
      *   **Validity:** **Defensible (and powerful in evolutionary contexts).** This is a core interpretation in evolutionary game theory (EGT). A mixed strategy Nash equilibrium can represent a stable polymorphic population state where different pure strategies coexist.
      *   **Relevance to Your Question:** **Directly Answers (No).** In this population view, including a strictly dominated strategy `d` in the support of an "equilibrium mixed strategy" would mean a positive fraction of the population plays `d`. However, since `d` is strictly dominated, any player using `d` gets a strictly lower payoff than players using the dominating strategy, *regardless* of what the rest of the population does. Therefore, players using `d` would be selected against (in an evolutionary sense) or would have a strong incentive to switch strategies (in a learning sense). `d` cannot persist in a stable population or equilibrium distribution. Its fraction would shrink to zero.

  ### Summary & Strategy for Office Hours

  *   **Your Question's Answer:** A rational player **cannot** include a strictly dominated pure strategy in the support of her mixed strategy in a continuous game (or any game). This holds true under *all* defensible interpretations of mixed strategies (Epistemic, Normative use of randomization, Population-level). Including a dominated strategy always lowers expected payoff.
  *   **The Slogan's Defensible Points:** The slogan primarily captures interpretations (a) and (d): mixed strategies represent *ignorance* (opponent uncertainty) or *population distributions*, not necessarily an individual's active randomization. These interpretations are insightful but **do not justify including dominated strategies**.
  *   **The Dodging:** The TA likely used the slogan as a generic dismissal of mixing, possibly favoring interpretation (a) or (d), but failed to engage with the *specific technical point* about dominance and support. Repeating it instead of answering your question was unhelpful. Interpretation (b) is false and irrelevant; (c) is irrelevant.
  *   **Your Office Hours Menu:**
      1.  **Focus on the Core Issue:** Start by restating your question precisely: "In a Nash equilibrium (or rational play), can a strictly dominated pure strategy ever be in the support of a player's mixed strategy? My understanding is 'no', because it strictly lowers expected payoff against any opponent strategy. Does your slogan imply otherwise?"
      2.  **Present the Interpretations:** Explain you've thought about what "ignorance in fancy dress" could mean and present interpretations (a) and (d) as the defensible ones. Acknowledge they offer valuable perspectives on *what mixing represents*.
      3.  **Highlight the Non-Answer:** Point out that *neither* (a) nor (d) provides a justification for including a dominated strategy in the support. In fact, both interpretations implicitly *require* that dominated strategies have zero probability in equilibrium:
          *   (a): Opponents shouldn't believe a rational player would choose a dominated strategy.
          *   (d): Dominated strategies die out in a stable population.
      4.  **Challenge the Dodging:** Ask directly: "When you repeated the slogan after my question, were you implying that under one of these interpretations, a dominated strategy *could* rationally be played with positive probability? If so, which interpretation and how does it overcome the strict dominance argument?" If they cite interpretation (b), be prepared to counter with Matching Pennies.
      5.  **Seek Clarification:** Ask: "Is your point simply that the player isn't *literally* randomizing, but choosing a pure strategy based on factors we (or opponents) don't see? And that therefore, the *support* represents the set of pure strategies opponents believe *could* be optimal for the player given their private information? If so, I agree, but that still requires that no *dominated* strategy is in that support, right?"

  This approach forces the TA to engage with the specific game-theoretic logic of dominance and support, moving beyond the slogan to address your actual query. Good luck!
