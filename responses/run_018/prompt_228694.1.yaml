prompt: |-
  I'm on the grants committee of a small foundation that funds conceptual work in biology -- philosophy and theory, not fieldwork or sequencing. We've got money for about six researchers over three years, and this cycle's theme is the species problem and the conceptual mess around taxonomy more generally. I've been asked to draft the call for proposals, so I need to figure out what the actually important open questions are before I accidentally fund three more papers proposing yet another species concept.

  So: which open questions in this area should the call prioritize, and in what order? Some candidates I keep hearing about: whether pluralism about species concepts is a genuine resolution or just a shrug that leaves each subfield doing its own thing; whether "species" picks out a natural kind or is just a bookkeeping unit; whether the ~95-97% average nucleotide identity cutoffs used to define microbial "species" in metagenomics are tracking anything real or are pure convention; how much hybridization and horizontal gene transfer have to happen before the tree-of-life picture stops being even approximately right; whether lumping vs. splitting decisions under phylogenetic species concepts have real stakes for conservation triage (since listed "species" get protection and management units often don't); and whether paleontology's morphospecies problem is the same problem or a different one wearing a hat.

  For each question you prioritize, tell me: is it upstream of other questions (does resolving it reorganize the rest), is it tractable for philosophers rather than requiring wet-lab work, and who outside the seminar room should care. Also tell me which of my candidate questions you'd strike off the list as overrated or already as-resolved-as-they're-going-to-get -- I suspect at least one of them is mostly a verbal dispute and I'd rather hear that now.

  One constraint: I don't want the deliverable in any case to be "another unified species concept," so if you think the most fundable questions are ones where that's not the goal, say which ones.

  Finally, flag where your ordering is most fragile: what argument or piece of evidence -- say, from microbiology or from how conservation law actually handles taxonomic revisions -- would make you reorder the list, and where is your reasoning most likely to be wrong?
reasoning: |-
  Okay, let me approach this methodically. The user is drafting a grant call for conceptual biology work on taxonomy and species concepts, with specific constraints and priorities. 

  First, I need to recognize their core challenge: avoiding repetitive proposals for new species concepts while targeting genuinely unresolved questions. The examples they provided cover microbial cutoffs, pluralism debates, natural kinds, hybridization impacts, conservation implications, and paleontology comparisons - but some might be dead ends.

  Hmm... the key will be identifying questions where:
  - Resolution would cascade to other problems (upstream leverage)
  - Philosophical methods suffice (no wet-lab needed)
  - Stakeholders exist beyond academia
  - "Another concept" isn't the deliverable

  Looking at their candidate list:
  The microbial ANI cutoff question seems urgent - metagenomics is exploding but the 97% convention feels arbitrary. If we could determine whether it tracks real biological divisions, that would reshape microbial ecology and diagnostics. Plus, it's tractable for philosophers analyzing data practices. Medical researchers should care deeply here.

  The pluralism debate feels tired though. After 30+ species concepts, arguing whether pluralism is "valid" seems sterile. Better to ask how to choose among concepts for specific purposes - that's where conservation triage meets philosophy. Wildlife agencies would have stakes in that clarity.

  Hybridization vs tree-of-life... this might be the most fragile priority. If new HGT data shows lateral transfer is even more pervasive in macrobes than thought, it could force reevaluation of whether any lineage-based concept works. But right now, it's philosophically rich for analyzing "gradients of treeness."

  For paleontology, the morphospecies question is actually distinct - it's about epistemic access to the past rather than current species ontology. Still valuable, but less urgent than microbial or conservation-linked issues.

  Biggest risk in my ranking? Underestimating how much conservation policies already accommodate taxonomic revisions. If IUCN protocols are more flexible than assumed, the triage question loses bite. Should flag that.
answer: |-
  Here's a prioritized list of open questions for your CfP, designed to avoid "yet another species concept" proposals while targeting high-impact, tractable, and under-explored issues. I've ranked them by upstream influence, tractability for conceptual work, and real-world stakes:

  ### Priority Ranking & Rationale
  1. **Do microbial ANI cutoffs (~95-97%) track biologically significant units or are they arbitrary conventions?**  
     - **Why prioritize?** Upstream of *everything* in microbiology, synthetic biology, and virology. If these thresholds are biologically arbitrary, it undermines microbial ecology, disease surveillance, and biotech patenting.  
     - **Tractability:** Perfect for philosophers/metascientists. Requires analyzing large datasets (publicly available) for discontinuities in gene flow/function vs. ANI, critiquing "operational" justifications, and collaborating with bioinformaticians.  
     - **Who cares?** Epidemiologists (pathogen tracking), biotech firms (IP disputes), and environmental regulators (microbiome assessments).  
     - **Deliverable:** Framework for evaluating genomic "significance" — *not* a new concept.

  2. **How do lumping/splitting decisions in phylogenetics impact conservation triage when policy depends on species counts?**  
     - **Why?** Directly bridges theory to existential stakes (biodiversity loss). Forces engagement with policy/power dynamics.  
     - **Tractability:** Conceptual analysis of how taxonomic revisions affect IUCN criteria, case studies of conservation lawsuits, and ethical modeling. No wet lab needed.  
     - **Who cares?** Conservation NGOs, policymakers, indigenous land stewards.  
     - **Deliverable:** Guidelines for taxonomists + policymakers to align taxonomic practices with conservation goals.

  3. **Does widespread HGT/hybridization invalidate the tree-of-life *as an approximate model* for major research domains?**  
     - **Why?** Challenges the foundational metaphor of evolutionary biology. Resolution reorganizes phylogenetics, ecology, and evolutionary theory.  
     - **Tractability:** Philosophers can analyze "gradients of treeness" across clades, critique model-dependent realism, and synthesize data from genomics/paleobotany.  
     - **Who cares?** Agricultural scientists (crop breeding), paleontologists (ancient hybridization), and educators (teaching evolution).  
     - **Deliverable:** Domain-specific criteria for when tree-based models fail.

  4. **Is paleontology's morphospecies problem distinct from neontology's species problem?**  
     - **Why?** Tests whether "species" is a timeless category or an epistemology-limited construct. Upstream for evolutionary theory.  
     - **Tractability:** Conceptual work on time-slicing vs. diachronic units, fossilization biases, and modeling speciation in incomplete records.  
     - **Who cares?** Astrobiologists (detecting life from limited signatures), stratigraphers.  
     - **Deliverable:** Paleontological species concept *evaluation criteria* — not a new definition.

  ### Questions to Deprioritize/Reframe
  - **"Is species pluralism a resolution or a shrug?"** → **Overrated.** The debate is circular; refocus on *how* to choose concepts for specific contexts (see Priority 2).  
  - **"Are species natural kinds?"** → **Largely resolved.** Most philosophers agree they are *not* classical natural kinds (like elements). Better to ask: *"Under what frameworks (e.g., homeostatic property clusters) do species exhibit kind-like stability?"*  
  - **"Is 'species' just a bookkeeping unit?"** → **Semantic.** Reframe as: *"When does taxonomic convenience actively misrepresent biological processes?"* (See Priority 1 & 2).

  ### Key Constraints & Fragilities
  - **NO NEW UNIFIED CONCEPTS:** All priorities avoid this by design, focusing on evaluation frameworks, criteria, or practical guidelines.  
  - **Most Fragile Priority:** **#3 (HGT/tree-of-life)**.  
    - **Why fragile?** If new metagenomic data show HGT is spatially constrained (e.g., only in biofilms) or functionally negligible in macrobes, the "crisis" narrative collapses.  
    - **Evidence that would reorder:** Studies demonstrating HGT rates <0.1% of core genome transmission in animals/plants — would demote this question.  
  - **Risk of Being Wrong:** **Priority #1 (ANI cutoffs)**.  
    - If virologists/bacteriologists already *have* internal criteria for "biologically meaningful" cutoffs (e.g., correlating with host jump rates) but haven’t published them formally, philosophers might overlook tacit knowledge. **Mitigation:** Require proposals to include microbiologist collaborators.

  ### Recommended CfP Language
  *"We seek proposals addressing conceptual challenges in taxonomy with high translational stakes, such as: microbial genomic unit demarcation in policy contexts; conservation triage under taxonomic revision; model adequacy in phylogenetics; or cross-disciplinary species epistemology. Proposals for novel unified species concepts will not be competitive. Interdisciplinary teams (e.g., philosophers + microbiologists/conservationists) are strongly encouraged."*

  This structure incentivizes work on messy, high-impact interfaces (microbes/policy, phylogenetics/conservation) while dodging tired debates. It forces engagement with stakeholders beyond philosophy — exactly where conceptual clarity is most urgently needed.
