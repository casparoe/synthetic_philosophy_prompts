answer: |-
  Here's a conceptual map of the core desiderata for a decision procedure under *fundamental moral uncertainty* (i.e., uncertainty about which moral theory is correct), focusing on the hard cases and key distinctions you raised. This outlines the landscape of what a "decent" procedure needs to grapple with, the non-negotiables, the tensions, and the specific challenges.

  ### Core Problems & Cases a Procedure Must Handle
  1.  **Infinite/Lexical Values vs. Scalar Values:** How to weigh a theory (e.g., deontology) that says violating a right is *infinitely bad* or *lexically prior* (always worse than any amount of some other good) against a theory (e.g., consequentialism) that treats rights violations as having a large but finite disvalue (or even as a cost to be traded off)?
  2.  **Radical Metric Incomparability:** How to compare choices when theories use fundamentally different kinds of value (e.g., "maximize total welfare" vs. "respect inherent dignity" vs. "fulfill divine commands") that seem impossible to place on a common numerical scale? Can the procedure even give guidance here?
  3.  **The Reverse Problem ("Fanaticism"):** Does becoming *more uncertain* between theories with extreme recommendations (e.g., one says X is infinitely good, another says X is infinitely bad) push the procedure towards recommending *more extreme* actions (either extremely pro-X or extremely anti-X) rather than cautious compromise? Is this acceptable?
  4.  **Normative vs. Empirical Uncertainty:** Can the procedure clearly distinguish between being uncertain about *what the facts are* (e.g., "Will this policy save 10 or 100 lives?") and being uncertain about *what morally matters* given the facts (e.g., "Is saving 100 lives the *only* thing that matters, or do rights constraints apply?"). A good procedure shouldn't conflate these.
  5.  **Population Ethics Uncertainty:** How to handle uncertainty between theories that give radically different answers depending on population size/identity (e.g., Total Utilitarianism vs. Average Utilitarianism vs. Person-Affecting Views vs. Anti-Natalism)? Is this uncertainty structurally identical to uncertainty about, say, rights vs. welfare, or does it require unique handling (e.g., due to non-identity problems or infinite possible futures)?

  ### Essential Desiderata (Non-Negotiables or Near-Non-Negotiables)
  1.  **Distinguish Normative/Structural Uncertainty from Empirical Uncertainty:** The procedure *must* explicitly account for the fact that the agent is unsure about the *correct moral framework itself*, not just the empirical facts within a framework. Output should reflect this deeper uncertainty.
  2.  **Avoid Arbitrary Collapse:** It *cannot* simply default to one type of theory (e.g., always pick consequentialism because it has finite numbers) or allow one theory to dominate simply because its values are numerically larger or unbounded. Respecting the *structure* of each theory is crucial.
  3.  **Provide Guidance Under Uncertainty:** It should, in principle, offer a way to make a decision even when theories conflict radically. Remaining perpetually paralyzed is usually not a viable option. However, "guidance" might sometimes mean "avoid actions condemned by *any* plausible theory" or "choose a permissible option under *all* plausible theories" rather than a single best act.
  4.  **Account for Credences (Degrees of Belief):** The procedure should be sensitive not just to *which* theories seem plausible but also to *how confident* you are in each one (e.g., 60% confident in Theory A, 30% in B, 10% in C).
  5.  **Respect Inter-Theory Comparisons (Where Possible):** If, *within a theory*, act X is judged *much better* than act Y, while in another theory, X is only *slightly worse* than Y, the procedure should reflect this difference in magnitude, not just the ordinal ranking. (This is hard when metrics are incomparable!).
  6.  **Avoid Requirement of Full Comparability:** It *cannot* demand that all values across all theories be reduced to a single, common metric (like "utils") for the procedure to work. This is often impossible and distorts the theories.

  ### Key Distinctions the Procedure Must Preserve (Or Explain Away)
  *   **Normative Uncertainty vs. Empirical Uncertainty:** (As above) - Fundamental distinction.
  *   **Cardinal vs. Ordinal Value Information:** Some theories provide rich cardinal information ("X is twice as good as Y"); others only give ordinal rankings ("X is better than Y"). The procedure should utilize the available information without *requiring* cardinality where it doesn't exist.
  *   **Lexical Priority / Incomparability vs. Trade-offs:** The procedure must recognize when a theory claims certain values are *incommensurable* or lexically ordered (no amount of A compensates for losing B) versus when it allows trade-offs (more A can compensate for less B).
  *   **Aggregation Method Uncertainty (Population Ethics):** Uncertainty between *how* to aggregate value across individuals/populations (total, average, prior existence, etc.) might need specific consideration due to its unique mathematical and conceptual challenges (e.g., paralysis with large potential populations).

  ### Desiderata Reflecting Preferences (Often EA-Influenced, but Not Universal)
  1.  **Maximization (of Expected Choice-Worthiness):** The strong preference for a procedure that calculates an "expected moral value" across theories, analogous to maximizing expected utility under empirical uncertainty. This *drives* the need for inter-theoretic comparisons and clashes badly with lexical priorities/incomparability.
  2.  **Completeness:** The desire for the procedure to always yield a strict ranking of options, avoiding incomparability or ties. This often conflicts with respecting radical metric incomparability.
  3.  **Continuity:** The idea that small changes in credences or small changes in the value assignments within theories should lead to only small changes in the recommended action. This clashes directly with lexical priorities (tiny credence in a lexical theory can dictate the entire decision).
  4.  **Tractability:** Preference for procedures that are computationally feasible for real-world agents, potentially sacrificing theoretical purity.

  ### Inherent Tensions & Conflicts (Where Satisfying One Likely Violates Another)
  1.  **Respecting Lexical Priorities vs. Avoiding Collapse/Fanaticism:** Giving proper weight to a theory with lexical priorities (e.g., "Never torture") means that even a small credence in it can veto any action involving torture, regardless of potential gains endorsed by other theories. This looks like "collapse" into the lexical theory for that decision and can lead to extreme recommendations ("fanaticism") under uncertainty. Conversely, *ignoring* the lexical priority to avoid collapse/fanaticism violates the demand to respect the theory's structure.
  2.  **Maximization vs. Radical Metric Incomparability:** Maximizing expected choice-worthiness requires a common scale. If values are truly incomparable (e.g., "sacredness" vs. "utils"), maximization is impossible without imposing a false common metric, violating the "Avoid Requirement of Full Comparability" desideratum.
  3.  **Providing Guidance vs. Respecting Incomparability:** If theories are genuinely incomparable, the only way to provide strict guidance is to *impose* comparability somehow. True respect for incomparability might mean the procedure identifies a *set* of non-dominated options but cannot rank them further, which may feel like inadequate guidance.
  4.  **Maximization & Continuity vs. Lexical Priorities:** Maximization/continuity require smooth functions. Lexical priorities are inherently discontinuous – a tiny amount of the lexically superior good outweighs any finite amount of the inferior good. These are mathematically and conceptually at odds.
  5.  **Handling Population Ethics Uncertainty Generically vs. Specifically:** Treating it like other normative uncertainty risks ignoring unique features (non-identity, variable populations, infinitarian paralysis). Treating it completely separately raises questions about why it's fundamentally different.

  **The Core Conceptual Map:** A decent procedure must navigate the treacherous terrain between **respecting the structure and content of the competing moral theories** (especially their claims about value, priority, and comparability) and the **practical need to make decisions under deep uncertainty**. The fundamental tension lies in whether the procedure should primarily aim for a kind of "meta-optimization" (risking distortion of the theories) or act as a "meta-constraint" that only rules out actions condemned by theories you give sufficient credence to (risking paralysis or overly conservative guidance). The hardest cases (lexical values, incomparability, population ethics) expose the fault lines where these goals directly conflict, forcing trade-offs between theoretical fidelity and decisiveness. Your arguments will live in justifying *which* desiderata should be prioritized and *how* the inevitable conflicts are resolved (or embraced).
