  hey, i'm writing a paper for my practical ethics seminar and we got sidetracked into moral uncertian — like, what do you do when you're genuinely unsure whether you're a consequentialist or a deontologist and both seem plausible. I don't want a bibliography, just the spec. what does a decent decision procedure for moral uncertainty actually have to get right?

  i was thinking specifically about the hard cases: if one theory assigns infinite or lexicographic value to avoiding rights violations, and another treats them as one cost among many, how should the procedure weigh them without just collapsing into the theory with the biggest numbers? There's also that weird reverse problem — if you become more uncertain, does the recommendation get more extreme in both directions? — and whether the theory needs to stay silent when the theories don't share a metric at all. i also want to know if there's any requirement that comes from population ethics sneaking in here, like being unsure between total and average views, and whether that should be treated as the same kind of uncertian or something totally different.

  can you lay out the full desiderata? like, the cases it has to handle, the distinctions it can't collapse (e.g., being uncertain about a fact vs being uncertain about what matters), which parts are non-negotiable and which are just preferences of the effective altruism crowd, and flag any pair that probably can't both be satisfied. don't worry about scoring every existing view — i mostly want the list so i can see where the arguments actually live. also please don't cite specific papers, i just want the conceptual map.
