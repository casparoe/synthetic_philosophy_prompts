  Here's the decision tree taxonomy for transgenerational guilt, designed to map concrete intuitions rather than name-dropping philosophers. Walk through the questions to find your position:

  ### Decision Tree
  1. **Can abstract entities (nations, corporations) bear moral guilt?**  
     - *No* → **Strict methodological individualist rejection** (You're done)  
     - *Yes* → Go to 2  

  2. **What preserves guilt after 100% population replacement?**  
     - *Institutional continuity* (same laws/borders) → Go to 3  
     - *Cultural transmission* (shared values/traditions) → Go to 4  
     - *Structural factors* (ongoing unequal systems) → **Structural-transmission-without-essentialism**  

  3. **Is "political guilt" (reparations owed) distinct from "moral guilt" (blameworthy soul)?**  
     - *Yes* → **Corporate-agent-with-institutional-continuity**  
     - *No* → *Unnamed Combo A*  

  4. **Does guilt require *ethnic* continuity?**  
     - *Yes* → *Unnamed Combo B*  
     - *No* → Go to 5  

  5. **Is "political guilt" distinct from "moral guilt"?**  
     - *Yes* → **Jaspers-style political guilt**  
     - *No* → *Unnamed Combo C*  

  ---

  ### Leaf Positions
  | Leaf Name                                      | Core Claim                                                                 | Awkward Commitment (if any) |
  |------------------------------------------------|---------------------------------------------------------------------------|-----------------------------|
  | **Strict methodological individualist rejection** | Only individuals bear guilt; collective guilt is nonsense.               | —                           |
  | **Corporate-agent-with-institutional-continuity** | Guilt sticks via legal/symbolic continuity (like a company's liabilities). | —                           |
  | **Jaspers-style political guilt**                | Living citizens inherit *political* obligations (reparations/reform) but not moral blame. | —                           |
  | **Structural-transmission-without-essentialism** | Unjust *structures* perpetuate guilt, not bloodlines or culture.         | —                           |
  | *Unnamed Combo A*                             | Nations bear guilt identically to individuals via institutions alone.      | Anthropomorphizes the state like a super-person. |
  | *Unnamed Combo B*                             | Guilt transmits through bloodline/culture *and* conflates political/moral blame. | Ethnic determinism (your ancestors define you). |
  | *Unnamed Combo C*                             | Cultural transmission creates blameworthy nations without ethnic ties.    | Makes cultural identity inescapably toxic. |

  ---

  ### Diagnoses & Quirks
  - **Unnamed Combo A's awkward commitment**:  
    *"Holds nations to personal moral standards—like saying France needs to feel remorseful in its soul."*  
  - **Unseparable pairs** (tree can't split these):  
    Corporate-agent view vs. Jaspers-style guilt (both require institutional continuity + guilt/obligation distinction).  
  - **Key tension**: If you accept any guilt transmission, you *must* clarify whether it's about:  
    - 🏛️ Institutions ("we inherit the state's debts"),  
    - 🧬 Ethnicity ("blood ties bind us"), or  
    - ⚖️ Structures ("unjust systems outlive their creators").

