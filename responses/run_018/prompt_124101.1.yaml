prompt: |-
  ok so i've been going back and forth with my roommate for like three nights now about whether ChatGPT and these other big models are actually agents in any meaningful sense or just really convincing simulators of agency. I was trying to work this out for a blog post i'm writing on AI ontology, and I kept coming back to this idea I'm calling counterfactual prefrence stability — the thought that a genuine agent ought to keep its core goals stable even when you tweek the reasoning path or change the prompt framing, whereas an LLM just flips because it's doing token prediction not pursuing anything. So I want your actual credence, like a real number between 0 and 1, that by say 2030 we'll have mostly settled that current LLMs are simulators rather than minimal agents, specifically on the grounds that they lack this kind of stability?

  Please decompose it: what's the prob that counterfactual preference stability is even the right criterion for drawing the agent/simulator line, what's the prob that scaling up or changing architechture could never actually fix this in transformer-style models, and what's the prob that the AI research community converges on this framing at all instead of just saying everything is 'emergent' and leaving it vague? Give me rough numbers for each piece and tell me how they combine into your final credence. Also which piece are you least confident in, and what kind of result — maybe a specific experiment or a philosophical argument — would shift it the most? I'm genuinely stuck and my roommate thinks I'm overanalyzing but I think the distinction actually matters for how we regulate these things.
