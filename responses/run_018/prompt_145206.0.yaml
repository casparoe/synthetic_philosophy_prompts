  ### Taxonomy of Interpretive Positions on Kant's Perpetual Peace  
  **Root Commitment**: Acceptance of Kant's distinction between *preliminary articles* (e.g., ceasing hostilities, reducing standing armies) and *definitive articles* (e.g., republican constitutions, federation of free states, cosmopolitan hospitality).  

  #### Branch Nodes (Diagnostic Scenarios)  
  Each node forces a binary choice. Answers cascade to define interpretive positions.  

  1. **Intervention for Reform**:  
     A democratic republic faces existential threat from an autocratic neighbor. Is preemptive intervention to force republican reform permissible if it is the only path to joining the federation?  
     - **Yes**: Permissible to actively spread republicanism.  
     - **No**: Reform must be internally generated; intervention violates sovereignty.  

  2. **Commerce as Guarantee**:  
     Commercial interdependence reduces war incentives but erodes local sovereignty via global supply chains. Does this count as Kant’s "guarantee of perpetual peace by nature"?  
     - **Yes**: Empirical mechanisms (e.g., trade) are the primary engine of peace.  
     - **No**: Peace is driven by moral-institutional progress, not material factors.  

  3. **Arbitration vs. World State**:  
     The federation develops a permanent arbitration court with binding decisions over member states. Has this crossed into the world-state Kant rejects?  
     - **Yes**: Binding enforcement invalidates the federation as a "negative substitute" (non-coercive alliance).  
     - **No**: Binding arbitration is a legitimate evolution of the federation without creating a world-state.  

  4. **Hospitality Scope**:  
     Climate displacement renders a region uninhabitable. Does cosmopolitan hospitality extend to positive obligations of admission and resettlement?  
     - **Yes**: Hospitality imposes duties to grant permanent refuge.  
     - **No**: Hospitality only guarantees temporary sojourn, not resettlement.  

  5. **Deception for Peace**:  
     Full transparency in peace negotiations would cause collapse and prolong war. Is strategic deception justified if it serves the definitive articles?  
     - **Yes**: Deception is permissible as a means to achieve peace.  
     - **No**: Transparency is inviolable; deception undermines trust.  

  #### Niche Distinction: Reading the "Guarantee"  
  *Injected to split one leaf; not a branch node but a sub-classifier:*  
  - **Empirical**: Peace is causally ensured by historical mechanisms (e.g., conflict, commerce).  
  - **Transcendental**: Peace is a necessary assumption for practical reason, not empirically verifiable.  
  - **Performative**: Peace is constituted by enacting the articles as commitments of practical reason.  

