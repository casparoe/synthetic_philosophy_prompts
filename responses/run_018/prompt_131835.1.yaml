answer: |-
  Here’s a tight, casual pitch doc framing your idea—designed to hook reviewers while staying honest about scope:

  ---

  ### **Project Pitch: "Why Consciousness Flickers Out: Stability Failures in the Global Workspace"**  
  **6-Month Conceptual Project | Philosophy of Mind Nonprofit**

  #### **1. The Burning Question**  
  > *If global workspace theory (GWT) says consciousness *is* broadcasted information, why do some unreportable states (e.g., fringe awareness) *feel* conscious while others (e.g., inattentional blindness) vanish completely?*  

  **Translation**: We’re attacking a hole in GWT: it treats "broadcasting failure" as one thing, but I suspect there are **two distinct failure modes**—and only *one* kills phenomenality.  

  #### **2. The Gap (Why This Isn’t Block vs. Dehaene Part 2)**  
  - **Standard GWT** (Dehaene, Baars): Focuses on *whether* info gets broadcast. If not → no consciousness. Ignores *how* broadcasting fails.  
  - **Phenomenal Access Critics** (Block, Lamme): Say unreportable states can be phenomenally rich. But they treat "access failure" as monolithic.  
  - **The Missed Opportunity**: Nobody dissects **broadcasting dynamics** *within* GWT to explain *when* phenomenality survives. That’s our opening.  

  #### **3. The Core Idea**  
  Broadcasting isn’t all-or-nothing. It can fail in two ways:  
  - **Reach Failure**: Info gets into the workspace but *doesn’t spread* to enough modules (e.g., weak priming).  
  - **Stability Failure**: Info gets broadcast but *flickers out* too fast for integration (e.g., overloaded attention).  
  **My hypothesis**: Phenomenal consciousness (PC) survives **reach failure** (you feel something vague) but collapses under **stability failure** (total blankness).  

  #### **4. Method: No Lab Coats, Just Brain Wrestling**  
  - **Conceptual Case Studies**: Compare two classic "unconscious" paradigms:  
    - **Subliminal Priming** (Reach Failure?): Stimulus too weak/brief to broadcast *widely*, but still triggers module-specific effects (e.g., motor cortex activation). *→ PC persists?*  
    - **Inattentional Blindness** (Stability Failure?): Stimulus *could* be broadcast but gets "kicked out" of workspace by competing demands (e.g., attentional load). *→ PC vanishes?*  
  - **Toolkit**: Analyze neural/behavioral data from existing studies through our "reach vs. stability" lens. No new experiments—just reinterpreting the canon.  

  #### **5. Success Looks Like...**  
  - A **theoretical model** showing how workspace *stability* (not just activation) gates phenomenality.  
  - Clear predictions:  
    - Neural correlates of stability (e.g., sustained frontoparietal synchrony) should track PC better than transient activation.  
    - Stability failures should feel like "nothing," while reach failures feel "fuzzy."  
  - **Output**: 1-2 papers redefining Block’s access/PC split via GWT mechanics.  

  #### **6. What Kills the Project**  
  - If stability/reach failures **always co-occur** in real-world cases (no clean split).  
  - If existing data shows **PC absent in reach failure** (e.g., if subliminal primes truly lack *any* feel).  
  - If stability is just **"weak access"** (not a distinct failure mode).  

  #### **7. Scope Check: 6 Months, Zero Pipettes**  
  - **Feasible**: Purely conceptual. No IRB, no stats. Timeline:  
    - Month 1-2: Deep dive into GWT architecture + stability mechanisms (e.g., neural synchrony, recurrent processing).  
    - Month 3-4: Case study analysis (subliminal vs. inattention).  
    - Month 5-6: Model-building + paper drafting.  
  - **Not Doing**:  
    - Solving the hard problem (we’re functionalists here).  
    - Proposing fMRI/EEG studies (but we’ll flag testable hypotheses!).  
    - Debating panpsychism (bless its heart).  

  ---

  ### **Why Fund This?**  
  This isn’t another meta-debate. It’s a **practical move**: using GWT’s own machinery to resolve a 30-year stalemate. If we’re right, we reframe consciousness as a *dynamic process*—not just a broadcast flag. Worst case, we force GWT to clarify its architecture. Either way, it’s high-impact philosophy with legs for empirical work later.  

  ---  
  **Casual close**: Hit me with funds—I’ll turn this brain worm into a framework. Let’s make workspace dynamics sexy.
