answer: |-
  Here's a joke crafted specifically around the core disagreement of moral particularism vs. generalism in your wedding scenario, focusing on shape-sensitivity and polarity-flipping:

  **The Setup:**  
  At a traditional wedding where guests hide the groom’s leather shoes (a sign of playful goodwill), a Moral Generalist (MG) and a Moral Particularist (MP) watch the chaos unfold. A Vegan Activist (VA), visibly distressed, approaches them.  

  **VA:** (Pointing at the stolen shoes) "This is barbaric! Forcing someone to participate in animal exploitation for a *tradition*? Stealing leather goods normalizes cruelty!"  

  **MG:** (Confidently) "Nonsense! The rule is clear: *Stealing is wrong*. Context doesn't change that. Hiding the shoes is theft, full stop. Tradition can't override moral law."  

  **MP:** (Frowning thoughtfully) "Hold on... is it *really* stealing? The groom expects this, even *wants* it. The context reshapes the act entirely. The 'theft' here is actually a gesture of communal bonding."  

  **VA:** "But the *leather*! It’s a product of suffering!"  

  **MP:** (Eyes lighting up) "Ah! *Now* the moral shape shifts! The leather *is* inert context when the act is about bonding... but when we focus on material ethics, that same leather flips the polarity. Suddenly, participating *reinforces* harm. So honoring tradition becomes complicity!"  

  **MG:** (Flustered) "You can’t just flip-flop! Stealing is stealing, leather or not! The principle is consistent!"  

  **MP:** "But the *reason* isn’t! When the leather was background noise, ‘honoring tradition’ was a positive reason *for* hiding them. Now the leather’s salient, it’s a negative reason *against* it. The valence inverted!"  

  **MG:** (Grabbing the shoes back from a hiding spot) "Fine! I’ll return them on principle. Stealing’s wrong!"  

  **MP:** (Snatching the shoes from MG) "No, wait! By returning them *now*, after the vegan’s protest, you’re not upholding a rule—you’re *validating* the critique of leather! You’re making the wedding *about* animal ethics, which destabilizes the communal joy!"  

  **MG:** (Frozen, shoes in hand, utterly bewildered) "...So I shouldn’t steal them, but I also shouldn’t *not* steal them? WHAT IS THE NEUTRAL SHAPE HERE?!"  

  **VA:** (Taking the shoes calmly) "I’ll solve it. I’m hiding them... in a dumpster. Now it’s salvage appropriation. Context matters, right?"  

  **MP:** (Beaming) "See? *Now* it’s an anti-capitalist statement! The polarity flipped *twice*!"  

  **MG:** (Head in hands) "I miss the rulebook..."  

  ---

  **Why this works:**  
  1. **Shape-Sensitivity:** The MP explicitly argues that the moral "shape" of the act (hiding shoes) changes based on which features are salient (tradition vs. leather).  
  2. **Polarity-Flipping:** The MP demonstrates how "honoring tradition" shifts from a *pro* reason to a *con* reason when the leather becomes the focus.  
  3. **Generalist Rigidity:** The MG clings to "stealing is wrong" regardless of context, leading to absurdity when trying to act.  
  4. **Weird Specificity:** The dumpster "salvage appropriation" twist highlights how particularism demands perpetual re-evaluation of context.  
  5. **No Trolleys:** Uses a fresh, culturally specific scenario (wedding tradition clash) instead of overused thought experiments.  

  The punchline hinges entirely on the MP’s insistence that context *transforms* the moral valence of an act, while the MG’s rigid rules create paralysis when faced with complexity. The vegan isn’t just a prop; their presence *alters the moral landscape* for the particularist in real-time.
