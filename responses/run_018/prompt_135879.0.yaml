answer: |-
  Plutarch's paired, unresolved biographical method rests on a sophisticated implicit theory of moral cognition and exemplarity, contrasting sharply with later hagiographic resolution. Its philosophical commitments can be reconstructed as follows:

  **I. Core Philosophical Commitments:**
  1.  **Moral Cognition as Deliberative Judgment:** Moral learning is not mimicry but an active, comparative process requiring the reader's critical engagement. Judgment emerges from juxtaposition, not passive reception.
  2.  **Exemplarity as Fractured & Contextual:** True exemplars are not monolithic, perfected ideals. Character manifests through context-specific choices, contradictions, and tensions inherent in real lives. Virtue is revealed *through* struggle and imperfection.
  3.  **Cross-Cultural Moral Knowledge as Possible & Complex:** Shared moral concepts (virtue/vice) possess enough family resemblance across cultures to enable meaningful comparison, but their *concrete manifestation* and *valuation* are deeply shaped by historical context. Recognition relies on *interpretation* across difference.
  4.  **Contradiction as Revelation, Not Flaw:** Internal tensions within a life (e.g., courage in battle vs. political recklessness) are essential data points revealing the complexity of character, not errors to be erased for didactic simplicity. Moral truth resides in the tension.
  5.  **The Primacy of Practical Wisdom (Phronesis):** The goal is not to provide doctrinal answers but to cultivate the reader's *phronesis* – the ability to discern right action in complex, contingent situations by weighing diverse examples.

  **II. Addressing Specific Questions:**

  1.  **Cultural Invariance vs. Framing Constitution:**
      *   Plutarch **presupposes sufficient cross-cultural recognizability** of core human experiences (ambition, fear, loyalty, betrayal, justice/injustice) and broad categories of virtue/vice (courage, temperance, wisdom, justice). A Roman reader *can* recognize hubris in a Greek subject.
      *   However, the practice **also relies on the comparative framing itself to constitute deeper understanding.** The juxtaposition *creates* the insight. Seeing how "courage" operates under Athenian democracy vs. Roman dictatorship doesn't assume perfect invariance; it reveals the *interplay* between universal potential and cultural/historical conditioning. The meaning of "virtue" is refined *through* the comparison.

  2.  **Mechanism: Analogy, Deliberation, or Admiration?**
      *   **Primary Mechanism: Deliberative Weighing of Incommensurable Characters.** Plutarch's core method is **not** strict analogical transfer ("A's solution in context X = B's solution in context Y"). Nor is it primarily about inspiring awe at a "fractured whole" (though admiration might occur). Crucially, it's about **juxtaposing distinct, often incompatible, responses to analogous challenges**, forcing the reader to *weigh* choices, temperaments, and outcomes *across* contexts. Why did Solon's moderate solution succeed where Lycurgus's rigor was needed? How does Fabius's caution illuminate or contrast with Pericles's boldness? The value lies in the unresolved *comparison*, not in finding a single answer or perfect hero.
      *   Analogical transfer is a *tool* used to set up comparable episodes (crisis, betrayal, death) but not to imply identical lessons.
      *   Emotional admiration might arise for specific acts *within* a life but is not the primary pedagogical aim; it's subordinate to the intellectual act of comparative judgment across the *pair*.

  3.  **Compatibility with Hagiographic Resolution:**
      *   **Fundamentally Incompatible.** The two traditions depend on diametrically opposed accounts of character revelation and pedagogical purpose:
          *   **Plutarch:** Character is revealed *in* contradiction, struggle, and context-dependence. Pedagogy cultivates *discernment* via unresolved comparison. Moral knowledge is contingent and requires active judgment.
          *   **Hagiography:** Character (sanctity) is revealed *despite* or *by transcending* contradiction. Contradictions are resolved into a unified, perfected ideal embodying transcendent virtue. Pedagogy cultivates *emulation* and *devotion* to a singular, unproblematic model. Moral knowledge is absolute and revealed through the exemplar.
      *   Hagiography aims for a coherent, inspirational *symbol*; Plutarch offers complex, challenging *case studies*. Resolving Plutarchan pairs into unified models would destroy their core pedagogical function.

  **III. Transformation Under a "Direct Attachment" Theory:**
  If Plutarch's implicit view were replaced by a theory prioritizing direct emotional attachment to an unproblematic, singular model (akin to hagiography), the pedagogical practice would require radical changes:

  1.  **Subject Selection:** Paired figures would be abandoned. A *single*, culturally central, and morally unambiguous figure would be chosen per biography/lesson.
  2.  **Narrative Structure:** Contradictions, failures, and context-specific compromises would be minimized, explained away, or reinterpreted as steps towards perfection. The narrative would smooth inconsistencies into a linear progression towards virtue/sanctity.
  3.  **Pedagogical Focus:** The emphasis would shift from *comparative deliberation* ("How do these choices differ? What does that reveal?") to *imitation and emulation* ("This is the perfect model; follow it."). Reader activity would involve internalizing the model, not weighing alternatives.
  4.  **Resolution:** All tensions within the life and between lives would be resolved. The biography would present a single, coherent, normative ideal.
  5.  **Cross-Cultural Element:** If comparisons existed, they would serve to highlight the *superiority* or *universal applicability* of the chosen singular model, not to present parallel, unresolved alternatives. Alternatively, comparisons would vanish entirely in favor of isolated, perfected exemplars.
  6.  **Emphasis:** Emotional resonance, reverence, and inspiration would become the primary goals, displacing critical judgment and contextual discernment.

  In essence, Plutarch's dynamic workshop of comparative moral reasoning would be replaced by a static gallery of perfected icons designed for veneration and imitation. The acknowledgment of moral complexity and the need for active, context-sensitive judgment would yield to the clarity and emotional pull of an unproblematic ideal.
