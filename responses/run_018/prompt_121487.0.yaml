prompt: |-
  I have been reading rationalist and longtermist forums for years, and I now work as a senior analyst for a climate-adaptation grant fund that makes awards for infrastructure with fifty- to one-hundred-year impact windows. Every quarter my board reviews four to six proposals—seawalls, managed-retreat incentives, carbon-capture subsidies, migration-corridor planning—each of which will alter settlement patterns, birth rates, and family formation enough to change exactly which people exist in the affected regions by 2120. We have no reusable framework for deciding when that identity-shifting effect blocks an otherwise beneficial grant, or when it is ethically irrelevant. I need a decision procedure I can run in about twenty minutes per proposal, without requiring board members to have studied population ethics, that turns the nonidentity problem and its standard distinctions into ordered tests with clear stopping conditions.

  The deliverable should be a reusable flowchart in words: a sequence of questions applied in fixed order, what counts as a sufficient answer to each, explicit “no” stopping points where the proposal is rejected or sent back for redesign, explicit handoff points where the remaining issue is one of values rather than facts and must be signed off by the board, and honest flags for steps that look procedural but are actually judgment calls dressed up as rules.

  To prevent the framework from collapsing into either “all future people are interchangeable” or “identity-change makes evaluation impossible,” build in two niche operational criteria that you define in place. First, the Counterfactual Structural Continuity Test: ask whether every person who could occupy the relevant social and environmental role in the future scenario is at least as well off as every occupant of the corresponding role in the best feasible alternative scenario, regardless of specific identity. Second, the Modal Complicity Boundary: stop the analysis and flag for human judgment whenever the only harm identified is to present people whose autonomy is being overridden for speculative future benefit, or when the causal chain to future structural conditions is too indirect to assess.

  Then apply the procedure to three proposals:
  1. A seawall and coastal-development package that prevents present displacement but locks in high-density settlement patterns that will shape family formation for generations.
  2. A carbon-reduction subsidy expected to lower regional birth rates through economic restructuring, improving climate outcomes but ensuring that the people who live in the improved climate are not the ones who would have lived under the status quo.
  3. A managed-retreat grant that relocates present communities, destroying specific social networks but opening land-use patterns that will determine future population composition.

  In at least one case the procedure should yield an answer the board will resist—probably an approval where intuition wants a block, or a block where intuition wants approval. State clearly what the procedure cannot resolve: for example, whether impersonal value should dominate person-affecting considerations, or whether the board owes duties to specific future individuals rather than to structural conditions. Do not provide bibliographies, reading lists, or citations; do not ask anyone to look up sources. Keep the language precise but accessible to a technically literate non-specialist, and mark every point where the analyst must still exercise irreducible judgment.
reasoning: |-
  Okay, I need to understand this user's request. They're a senior analyst at a climate-adaptation grant fund dealing with proposals that affect future populations through nonidentity effects. They want a decision flowchart that handles ethical dilemmas without requiring specialized knowledge, and they've specified two custom criteria: Counterfactual Structural Continuity Test and Modal Complicity Boundary.

  The user's clearly frustrated with ad hoc evaluations. Their mention of rationalist forums suggests they value systematic thinking but reject overly academic solutions. The time constraint (20 minutes per proposal) means this must be pragmatic. I notice they're anticipating board resistance - they want the framework to challenge intuitions, not just confirm them.

  Hmm... the core tension is between consequentialism ("all future people interchangeable") and deontology ("identity-change paralyzes evaluation"). Their proposed criteria are clever bridges: Structural Continuity focuses on role welfare rather than specific identities, while Complicity Boundary prevents paternalistic overreach. 

  For the seawall proposal, the procedure should approve it despite locking in settlement patterns because it passes Structural Continuity (coastal dwellers are better off than in alternatives) and avoids Complicity issues. But the board might dislike approving something that constrains future autonomy. 

  The carbon subsidy case is trickier - lower birth rates from economic change clearly shift identities. But Structural Continuity shows all economic roles are better off in the climate-stable scenario. The Complicity Boundary doesn't trigger since no present autonomy is overridden. Approval, but the board may resist rewarding birth-rate effects.

  Managed retreat intentionally breaks social networks. Structural Continuity fails because some community roles disappear entirely. Complicity Boundary activates since present autonomy is overridden for speculative gain. This forces board judgment - satisfying the user's request for one counterintuitive outcome where intuition might want to approve relocation but the procedure blocks automatic approval.

  I'll explicitly note where judgment remains: e.g., defining "social roles" for Structural Continuity, or assessing "indirect" causal chains for Complicity. The irreducibles are important - the user wants transparency about fuzziness, not false precision.

  The language must stay technical but accessible. No jargon like "ex ante Pareto" - instead "are all future role-occupiers at least as well off". And absolutely no citations; they're clearly tired of academic references.
answer: |-
  Here’s a reusable 5-step flowchart for nonidentity ethics review, designed for 20-minute assessments. **Bolded terms** are operational definitions. *Italicized notes* mark irreducible judgment points. Apply steps sequentially; stop if any rejection trigger hits.

  ---

  ### **Decision Procedure Flowchart**
  1. **IMMINENT HARM TEST**  
     *Question:* Does the proposal cause *direct, material harm to existing people* (e.g., involuntary displacement, health impacts, property loss) without their consent?  
     - **YES** → Proceed to Step 2.  
     - **NO** → Proceed to Step 3.  
     *Judgment note:* Defining "direct harm" requires contextual interpretation.

  2. **MODAL COMPLICITY BOUNDARY** (User-Defined)  
     *Question:* Is the harm from Step 1 imposed *on present people* solely for *speculative future benefits*, OR is the causal chain to future structural conditions too indirect (>2 causal links) to model reliably?  
     - **YES** → **FLAG FOR BOARD REVIEW**. Stop. (Requires human judgment on autonomy override).  
     - **NO** → Proceed to Step 3.  
     *Operational note:* "Indirect causal chains" exclude first-order effects (e.g., "building a seawall causes higher population density" is direct; "higher density alters cultural norms affecting birth rates" is indirect).

  3. **STRUCTURAL BASELINE CHECK**  
     *Question:* Compared to the **best feasible alternative scenario** (including inaction), does the proposal *worsen baseline structural conditions* (e.g., economic stability, disaster resilience, ecosystem health) for the affected region by 2120?  
     - **YES** → **REJECT PROPOSAL**. Stop. (Fails minimal welfare threshold).  
     - **NO** → Proceed to Step 4.  
     *Judgment note:* Defining "best feasible alternative" requires scenario modeling discretion.

  4. **COUNTERFACTUAL STRUCTURAL CONTINUITY TEST** (User-Defined)  
     *Question:* For all **social/environmental roles** in the future scenario (e.g., "coastal resident," "farmworker," "urban service provider"), is *every possible occupant* of each role at least as well off as *every occupant* of the corresponding role in the best feasible alternative?  
     - **YES** → **APPROVE PROPOSAL**. Stop. (Identity effects ethically irrelevant).  
     - **NO** → Proceed to Step 5.  
     *Operational note:* "Roles" are defined by socioeconomic function + geographic scope. *Judgment note:* Role definition and welfare comparison require analyst discretion.

  5. **IRREDUCIBLE VALUE CONFLICT**  
     *Question:* Does the board’s mandate prioritize **structural outcomes** (e.g., total welfare, ecological health) over **specific population identities**?  
     - **STRUCTURAL PRIORITY** → **APPROVE PROPOSAL**. Stop. (Identity-independent benefits dominate).  
     - **IDENTITY PRIORITY** → **FLAG FOR BOARD REVIEW**. Stop. (Requires values-based ruling).  
     *Honest note:* This step encodes institutional philosophy; it cannot resolve the impersonal vs. person-affecting ethics debate.

  ---

  ### **Application to Proposals**
  **Proposal 1: Seawall & Coastal Development**  
  - Step 1: NO (No direct harm to present people).  
  - Step 3: NO (Improves resilience vs. inaction).  
  - Step 4: **YES** (All "coastal resident" role occupants are better off than in storm-ravaged alternative).  
  → **APPROVAL**.  
  *Board resistance trigger:* Intuition may dislike "locking in" density, but roles are strictly better off.

  **Proposal 2: Carbon-Reduction Subsidy**  
  - Step 1: NO (Economic restructuring isn’t direct harm).  
  - Step 3: NO (Improves climate stability).  
  - Step 4: **YES** (All "industrial worker"/"farmer" role occupants in improved climate have higher welfare than in climate-chaos alternative).  
  → **APPROVAL**.  
  *Board resistance trigger:* Explicitly changes who exists, but roles are better off.

  **Proposal 3: Managed-Retreat Grant**  
  - Step 1: **YES** (Destroys present social networks → direct harm).  
  - Step 2: **YES** (Harm imposed for *speculative* future land-use benefits; causal chain to future population composition is indirect).  
  → **FLAG FOR BOARD REVIEW**.  
  *Board resistance trigger:* Intuition may approve retreat as "pragmatic," but Complicity Boundary forces scrutiny of present autonomy override.

  ---

  ### **What This Procedure Cannot Resolve**  
  1. **Impersonal vs. Person-Affecting Ethics**: Whether improving *aggregate welfare* (e.g., higher GDP) justifies changing who exists.  
  2. **Duties to Individuals vs. Structures**: Whether the board owes obligations to *specific future persons* or only to *social/ecological conditions*.  
  3. **Non-Role Welfare**: Harms to beings outside defined roles (e.g., non-human species, stateless people).  

  **Key Judgment Points**:  
  - Defining "social/environmental roles" (Step 4).  
  - Assessing "best feasible alternative" (Step 3).  
  - Interpreting "speculative benefit" (Step 2).  
  - Board’s value hierarchy (Step 5).  

  This framework forces explicit tradeoffs while preventing paralysis. It approves identity-altering actions only when *all possible future role-occupants* are net beneficiaries—a defensible, operationalizable compromise.
