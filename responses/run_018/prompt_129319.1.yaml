prompt: |-
  I'm preparing a podcast interview with an unnamed philosopher who defends what she calls the "procedural entitlement" account of knowing how versus knowing that. On her view, knowing how is neither reducible to propositional knowledge (contra intellectualists such as Stanley and Williamson) nor a bare practical ability (contra Ryle's pure anti-intellectualism), but consists in a first-order competence coupled with a non-articulable second-order authority to recognize and correct one's own execution errors without being able to state the governing rule. I want eight to ten questions that do not ask her to restate this framework, but press on its internal architecture. Include at least one question on how her "error-sensitive procedural authority" differs from merely implicit or inarticulate propositional knowledge, with a follow-up keyed to her likely reply that the difference is the absence of representational content. Include another on expert failure—cases where an expert clearly knows how yet systematically misdiagnoses her own errors—with a follow-up anticipating her appeal to "localized entitlement breakdown." Include a third pressing whether the view collapses into intellectualism once we concede that second-order correction requires some conceptual structure, with a follow-up for her probable claim that such structure can be embodied rather than represented. Order the sequence so that each question builds on the tension exposed by the previous one, avoid generic biographical openers, and keep every follow-up tightly tied to the specific reply it targets.
