prompt: |-
  I'm trying to pin down a move I keep seeing in arguments about who gets to speak, and I dont know whether theres already a name for it or whether Im just over-analysing a weird pattern. Here are two instances that feel like the same thing: a climate scientist is dismissed for talking about energy policy because shes "only a scientist", but then an economist with no climate background is cited approvingly on the exact same policy question. Or a historian of medicine is told to stick to archives when she comments on current health ethics, yet a philosopher with no medical training is welcomed into the discussion because his view matches the audience.

  The thing is, its not just "stay in your lane" applied consistently — its selective. The expert's credibility in field A is used as a reason to exclude them from field B, but an outsider from field C is imported into B without the same scrutiny, as long as they agree. So its not a general rule about expertise boundaries; its more like a quarantine that locks people inside their own credibility, but only when its inconvenient.

  I know Miranda Fricker's work on epistemic injustice and the testimonial credibility deficit, but this feels different: the speaker isnt being downgraded within their own domain, theyre being barred from leaving it, and outsiders are brought in asymmetrically. Is there an established concept for this exact configuration? How does it differ from testimonial injustice and from hermeneutical injustice? If theres no established term, what should we call it — epistemic siloing, maybe? I want the carving, not just a label: what exactly the phenomenon is, where it stops being this and starts being something else, and what the boundary cases look like.
reasoning: |-
  Okay, the user is describing a specific pattern they've noticed in arguments about who gets to speak. They give two examples: a climate scientist dismissed on energy policy while an economist is accepted on the same topic, and a historian of medicine told to stay in her field while a philosopher is welcomed to discuss health ethics. The key point is that it's selective—experts are confined to their field only when their views are inconvenient, but outsiders are brought in without scrutiny if they agree.

  I need to recall relevant concepts in epistemology. Miranda Fricker's testimonial injustice comes to mind, where a speaker's credibility is unfairly downgraded. But here, it's different. The expert isn't denied credibility in their own field; they're prevented from speaking outside it. Hermeneutical injustice involves lacking the concepts to understand one's experience, which doesn't fit either. So this seems distinct.

  The user mentions "epistemic siloing" as a possible term. That's a good starting point. The phenomenon involves gatekeeping based on credentials asymmetrically. The core is that there's a credibility quarantine for some but not others, depending on whether their views align with the gatekeepers. This isn't about consistent expertise boundaries but selective enforcement to control discourse.

  Boundary cases would be important. For example, if someone without credentials speaks outside their field and is rejected, that's just standard "stay in your lane." But when an outsider is welcomed because they agree, that's the selective part. Also, if the expert speaks outside their field and is heard because they align, that's not the same phenomenon. The asymmetry is key—quarantining dissenters while importing allies.

  The user might need this for academic work or activism. They want a precise term to articulate this dynamic, possibly to critique it effectively. Their deeper need could be to validate their observation and have a framework to challenge such arguments. Providing a clear definition, differentiating it from existing concepts, and suggesting a term like "epistemic quarantine" or "credibility lock-in" would help. They also need boundary cases to apply the concept accurately in real scenarios.
answer: |-
  You've identified a fascinating and pernicious epistemic maneuver that **is distinct** from Fricker's core concepts, though related. This isn't just testimonial injustice or hermeneutical injustice; it's a specific form of **epistemic gatekeeping** designed to manage dissent and control discourse boundaries asymmetrically. Let's carve it up:

  **The Phenomenon: Selective Credibility Quarantine (or Epistemic Lock-In)**

  1.  **Core Mechanism:**
      *   **Step 1 (Quarantine the Dissenter):** An individual (Expert A) possesses established credibility in Domain A. When they attempt to speak on a related or overlapping Domain B, their credibility in Domain A is weaponized *against* them. They are told they "lack expertise" *specifically for Domain B* because they are "only an A" or "should stick to A." Their Domain A credibility becomes a *cage* preventing legitimate contribution to B.
      *   **Step 2 (Import the Ally):** An individual (Person C), who possesses credibility in a *different* Domain C (or sometimes no relevant domain credibility at all), is welcomed to speak authoritatively on Domain B, *without facing the same scrutiny regarding their lack of specific B-expertise.*
      *   **The Asymmetry:** The crucial element is that the *reason* given for excluding Expert A (lack of specific B-expertise) is *not applied consistently*. It is selectively enforced only against those whose views on B are inconvenient or dissenting. Person C's lack of B-expertise is overlooked *because their conclusions align with the preferences of the gatekeepers or the dominant narrative.*

  2.  **How it Differs from Fricker's Concepts:**
      *   **Testimonial Injustice:** This involves a *global* downgrading of credibility based on prejudice (e.g., gender, race). In your case:
          *   Expert A is *not* downgraded *within* Domain A. Their A-credibility is intact, even used as the *basis* for exclusion from B.
          *   The injustice isn't primarily about *who they are* (though identity prejudice can be a factor), but about the *content* of their view on B and the strategic *use* of their A-credibility as a boundary.
      *   **Hermeneutical Injustice:** This concerns a *structural lack of shared concepts* to understand one's own experience. Your cases focus on active *exclusion* from discourse using *existing* concepts (like "expertise boundaries"), applied strategically. It's about gatekeeping participation, not about a gap in collective understanding.

  3.  **Established Concepts & Your Proposed Terms:**
      *   While not a single universally-agreed-upon term, it fits within broader frameworks:
          *   **Epistemic Injustice (Broader Sense):** It's clearly a form of unfairness in knowledge practices.
          *   **Credibility Economy/Epistemic Trespassing:** Often discussed in philosophy of science and social epistemology. Kristie Dotson's work on "testimonial smothering" (self-silencing due to perceived lack of uptake) is adjacent but not identical. The critique of rigid "trespassing" norms often touches on this asymmetry.
          *   **Motivated Reasoning/Confirmation Bias:** The *underlying driver* is often the audience's desire to hear affirming views and reject challenging ones.
          *   **Boundary Work (Gieryn):** Sociologists study how groups define "science" vs. "non-science" or expertise boundaries to gain authority. Your case shows *asymmetric boundary work*: policing boundaries strictly for some (dissenters), loosely for others (allies).
      *   **Your Terms:**
          *   **Epistemic Siloing:** Good, emphasizes the *enforced separation*. Needs the "selective" element clarified.
          *   **Selective Credibility Quarantine:** Captures the core – quarantine based on credibility domain, applied selectively.
          *   **Epistemic Lock-In:** Strong, emphasizes using existing credibility to trap someone and prevent broader contribution.
          *   **Asymmetric Boundary Policing:** Very descriptive, highlights the inconsistent application of "stay in your lane."
      *   **Proposed Term:** **Selective Credentialism as a Silencing Tactic (SCAST)** or **Asymmetric Expertise Gatekeeping (AEG)**. However, **Selective Credibility Quarantine** or **Epistemic Lock-In** are highly evocative and accurate.

  4.  **Boundaries and Edge Cases:**
      *   **Where it Stops Being This:**
          *   **Consistent "Stay in Your Lane":** If *everyone* (Expert A, Person C, etc.) is told to stick rigidly to their primary domain when speaking on B, regardless of viewpoint, that's rigid credentialism, but *not* the selective asymmetry you've identified. The *asymmetry based on viewpoint* is key.
          *   **Genuine Lack of Relevant Expertise:** If Person C *is* dismissed for lacking B-expertise when they speak on B (even if they agree), that's consistent gatekeeping. If Expert A is excluded from B because their A-expertise truly provides *no relevant insight* (e.g., a ballet critic opining on rocket science), that might be legitimate, though still debatable. The problem arises when A *does* have relevant expertise (climate science -> energy policy; history of medicine -> health ethics), and C *doesn't*, but only A is excluded.
          *   **Pure Testimonial Injustice:** If Expert A is dismissed on Domain B *and* their credibility in Domain A is also globally undermined due to prejudice, that dips back into core testimonial injustice *alongside* the quarantine.
          *   **Good Faith Disagreement on Relevance:** If there's a legitimate debate about whether Domain A truly provides relevant expertise for Domain B, and the exclusion isn't demonstrably viewpoint-based, it might not be this specific phenomenon (though power dynamics are always at play).
      *   **Edge Cases:**
          *   **The "Relevant Outsider":** What if Person C *does* have some plausible, though non-standard, relevance (e.g., a theologian discussing medical ethics based on religious doctrine)? The asymmetry is still present if the *bar for "relevant expertise"* is set much lower for C (because they agree) than for A (who dissents).
          *   **The "Internal Dissenter":** What if an expert *within* Domain B (e.g., a different climate scientist) is dismissed *not* via quarantine but via other means (ad hominem, misrepresentation), while the outsider (C) is still welcomed? This is still epistemic injustice, but it's a different mechanism (direct silencing/discrediting within B) rather than quarantine *from* A.
          *   **Degree of Overlap:** How closely related must A and B be? The phenomenon is clearest when there's obvious overlap (science/policy, history/ethics). It becomes murkier if A and B are very distant, though the *asymmetry* in gatekeeping might still be evident.

  **In essence:** You've pinpointed **a strategic, viewpoint-based manipulation of expertise boundaries.** It uses an expert's established credibility in one domain not as a source of authority, but as a justification to *confine* them and exclude their dissenting voice from adjacent domains, while simultaneously lowering the expertise bar to admit voices that affirm the desired conclusion. It's **epistemic gerrymandering** – redrawing the boundaries of who counts as a legitimate speaker based on the desired outcome of the discourse.

  **Selective Credibility Quarantine** or **Epistemic Lock-In** are excellent terms to capture this specific, asymmetric, silencing tactic. It highlights the core injustice: credibility becomes not a tool for understanding, but a weapon for control, selectively applied to lock dissenters out of conversations where their expertise *is* relevant.
