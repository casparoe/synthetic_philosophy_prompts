  For misconceptions, tackle the belief/consistency confusion immediately when introducing Dutch books. Clarify that state-dependent utility isn't inherently irrational but requires careful handling via axioms. Position coherence as one normative framework among others.

  For the check of understanding, use a targeted question comparing structural axioms to the money pump process. Limit scope: avoid representation theorems, mention Allais as contrast but don't develop it, flag CDT vs. EDT for future discussion. Link scientific rationality by framing coherence as a guard against exploitation in planning, using the preregistration case.

  The user's identity as a grad student running a seminar suggests they need confidence in their teaching plan's structure. They might be worried about losing students in abstraction or spending too much time on applications. Emphasize a step-by-step flow with clear transitions and time allocations. Highlight where to explicitly state what's out of scope to maintain focus.
answer: |-
  Here's a meticulously structured 50-minute teaching plan focused on dependency order, misconception prevention, and practical coherence – designed for your philosophy undergrads:

  **Core Objective:** Students grasp that Dutch books/money pumps reveal a structural flaw in preferences *across states* (violating Savage's axioms), not just inconsistent beliefs, making one vulnerable to exploitation.

  **Key Exclusion Notice (State upfront):** "Today, we focus *only* on why violations of specific preference axioms make you vulnerable to Dutch books/money pumps. We won't prove representation theorems, dive into CDT vs. EDT, or fully resolve Allais (though we'll note it exists). Our goal is the *normative force* of coherence."

  **Session Structure (50 mins):**

  1.  **Hook: The Preregistration Predicament (10 mins)**
      *   **Present Case:** Dr. Lee must decide whether to preregister a costly replication study *today*.
      *   **State 1 (S1 - Grant Secured):** Lee has guaranteed funding for this study cycle. If she runs it, she *must* use her secured grant money.
      *   **State 2 (S2 - Grant Uncertain):** Funding for replications is highly competitive next cycle. Running it depends on winning a future grant.
      *   **Gamble Offered *Today*:** Pay $1000 to enter a lottery: 50% chance of +$10,000, 50% chance of -$5,000. (Net: +$4000 or -$6000).
      *   **Lee's State-Dependent Preferences:**
          *   *In S1 (Grant Secured):* She **rejects** the gamble. Why? Losing $6000 hurts her *current, secure* research budget badly. Risk-averse here.
          *   *In S2 (Grant Uncertain):* She **accepts** the gamble. Why? Winning $4000 could *enable* the replication; losing $6000 just means the already-uncertain study definitely doesn't happen. Risk-seeking here.
      *   **Crucial Setup:** Emphasize the *same monetary outcomes* have different *subjective value/impact* depending on the state (secured funding vs. precarious funding). **Prompt:** "Is this irrational? Why/why not?" (Listen to intuitions - likely split).

  2.  **The Exploit: The Money Pump Sequence (10 mins)**
      *   **Scenario:** Lee *doesn't know* which state she's in (grant secured or not) when making the initial preregistration/gamble decision *today*.
      *   **Step 1 (Morning):** Lee is in an "S2 mindset" (the grant feels uncertain). She **accepts** the gamble (+$10k/-$5k for $1k fee).
      *   **Step 2 (Noon):** News arrives – her grant *is* secured! (Now S1). In her "S1 mindset," holding this gamble feels terrible (risk-averse). A colleague offers to *buy the gamble ticket from her* for a small fee, say **$50**. Relieved, she **sells**.
      *   **Step 3 (Afternoon):** Oops! News correction – the grant notification was premature; it's *still* uncertain (Back to S2). Now, holding cash feels like a missed opportunity (risk-seeking). The colleague offers to *sell the gamble ticket back* for a small fee, say **$50**. Regretting selling, she **buys back**.
      *   **Outcome:** Lee is back where she started (owns the gamble), but is **down $100**. She was "pumped" for $100 due to her state-dependent reversal. **Prompt:** "What *exactly* went wrong? Is this about bad luck or bad preference structure?"

  3.  **Diagnosis: Pinpointing the Flaw - Structural Coherence (10 mins)**
      *   **Reframe the Pump:** Lee paid to cycle between identical positions because her *valuation of outcomes depended on states she couldn't control or predict with certainty*.
      *   **Core Concept:** Introduce the **Sure-Thing Principle (P2)** intuitively: "If you prefer Option A to Option B *regardless* of which state of the world obtains (e.g., grant secured or not), then you should prefer A to B even when you *don't know* which state obtains." Lee violated this.
      *   **Link to Pump:** Her preference for the gamble vs. cash *reversed* based solely on the state (S1 vs. S2), violating P2. This created the arbitrage opportunity.
      *   **Key Distinction (State Here!):** "Coherence here isn't about having consistent beliefs *about the states* (e.g., correct probability of grant). It's about how your *valuation of outcomes* (utility) behaves *across* those states and how that affects preference ordering over acts. The pump exploits the *structural relationship* between preferences in different states, not bad probability estimates." **Address Misconception #1:** "This isn't 'logical inconsistency' in beliefs about the world; it's inconsistency in how the *consequences* of actions are valued relative to each other given different descriptions of the world."

  4.  **Deepening: Dutch Books as Static Analogy (7 mins)**
      *   **Analogy:** "The money pump is a *dynamic* exploit over time. A Dutch Book is a *static* exploit: a set of bets offered *simultaneously* that guarantee the agent loses money, no matter what happens."
      *   **Simple Dutch Book Example:** Show how violating probability axioms (e.g., P(A) + P(Not-A) > 1) leads to a Dutch Book. Emphasize: "This exploits *belief* incoherence (probabilities don't add to 1)."
      *   **Contrast:** "The Money Pump exploited *preference* incoherence (violating P2). A Dutch Book *for preferences* exists if someone violates the *preference axioms* (like P2 or ordering). The bookie designs bets based on your willingness to accept 'fair' bets according to your *inconsistent* preferences, guaranteeing their profit."
      *   **Address Misconception #2:** "Note: State-dependent utility *itself* isn't irrational! The problem arises when it leads to violations of axioms like P2 *in your overall preference structure*. Savage's framework *allows* state-dependence but *constrains how it behaves* via the axioms to prevent pumps/books."

  5.  **Synthesis & Normative Force (8 mins)**
      *   **Recap:** Violations of Savage's axioms (like P2) → Structural incoherence in preferences → Vulnerability to exploitation (Money Pumps / Dutch Books).
      *   **Normative Claim:** Rationality requires coherence to avoid being exploitable. It's a vulnerability in your *planning* structure.
      *   **Address Misconception #3:** "Rejecting this doesn't mean embracing *arbitrary* preference reversal. It means adopting a *different normative framework* that might accept exploitability as a cost (e.g., some models of regret, context-dependence). But coherence arguments show this vulnerability is the *price* of violating these axioms."
      *   **Check for Understanding (Key!):** "Imagine Lee defends herself: 'My preferences were consistent *within* each state! I only changed when the state changed!' How would you explain why this *isn't* a sufficient defense against the money pump charge? What specific axiom was violated *across* states?" (Target Answer: P2 - Preferences must hold *conditional* on states being fixed, leading to a stable preference when state is unknown).
      *   **Distinction Check:** "In the Dutch Book for probabilities, what does the bookie exploit? In the Money Pump for preferences, what does the exploiter exploit?" (Target: Beliefs vs. Preference Structure/Relations).

  6.  **Brief Application & Wrap-up (5 mins)**
      *   **Scientific Rationality Link:** "So, for Dr. Lee's preregistration: Coherence arguments suggest rational methodological planning requires preferences over research actions (preregister? run gamble?) to be stable in ways that avoid making her systematically vulnerable to exploitation through shifting contexts (like grant news). This provides a *structural* constraint on rational scientific planning beyond just accurate beliefs."
      *   **Scope Reminder:** "Remember, this is *one* framework. We noted Allais (briefly: it challenges independence axiom, another pillar of EUT) and CDT/EDT (challenges how states are defined/partitioned) as places where debates continue. But coherence arguments establish a powerful baseline: exploitable preferences are normatively suspect."
      *   **Closing Thought/Question:** "Does avoiding exploitability feel like a *compelling* requirement for rational scientific planning? Why or why not?"

  **Crucial Design Choices for Your Example:**

  1.  **State-Dependence:** Must be **transparent** to Lee and students. The *reason* for reversal (impact on research) is clear. This highlights it's about *preference* structure (utility dependence on state), not hidden information.
  2.  **Monetary Amounts:** Keep them **identical** across states ($10k, $5k, $1k). This isolates the reversal as due to *state-dependence of utility*, not differing stakes. Scaling would muddy the waters.
  3.  **Introduce Coherence Type:** Introduce the **structural/dynamic distinction during the pump analysis (Step 3)**. Contrast the *static* violation (reversal violates P2) with the *dynamic* exploit (sequential trades).
  4.  **Preference Structure Focus:** Explicitly state **after the pump**: "The flaw wasn't her risk attitude *in* a state, but how her risk attitude *changed* based on the state in a way that violated a fundamental axiom (P2) governing preferences *across* states when uncertain."

  **What to Explicitly Exclude & Why:**

  1.  **Representation Theorems:** Leave out entirely. The goal is the *normative argument from exploitability*, not the derivation of EU from axioms. Mentioning it distracts.
  2.  **CDT vs. EDT:** Defer completely. It fundamentally challenges state *definition* (causal vs. evidential), which is a different layer. A brief mention ("Some argue states should be defined causally... future topic") is ok if it comes up, but don't engage.
  3.  **Allais Paradox:** **Mention by name only** as a *different* challenge (to the Independence Axiom) showing EUT isn't universally accepted. Say, "Allais presents a separate puzzle about how people evaluate certain vs. uncertain gains/losses, challenging another axiom. We focus today on the state-dependence/exploitability issue."
  4.  **Technical Axioms:** Avoid listing P1, P3-P6, etc. Focus *only* on P2 (Sure-Thing Principle) as the culprit in your example.

  **Managing the Scientific Rationality Link:**

  *   **Disciplined Approach:** Frame the application **only through the lens of the preregistration example**. Explicitly: "Our case study shows how coherence considerations *could* constrain methodological planning by requiring preferences over research actions under uncertainty to avoid structural vulnerabilities like money pumps." Don't open broader debates about replication crisis, p-hacking, etc.
  *   **Avoid Swallowing:** If discussion veers into broader scientific practice, gently redirect: "That's a fascinating point about [replication incentives/publishing], and worth exploring later, but for *this session*, let's focus on how the coherence argument we just saw would apply structurally to Lee's specific planning dilemma."

  This plan builds the conceptual dependencies step-by-step: Concrete Failure → Exploit Mechanism → Structural Flaw Diagnosis (Axiom Violation) → General Principle (Coherence as Exploit Avoidance) → Normative Claim → Focused Application. It proactively addresses misconceptions at their likely points of emergence and includes a targeted check for the core structural/dynamic distinction. Good luck with the discussion!
