answer: |-
  ### Design Outline
  1. **Constraints**: Use existing IVF/embryo selection technology; fixed parents, prenatal/postnatal environment, and developmental path; alter only gametic origin.  
  2. **Mechanism**: Preimplantation Genetic Diagnosis (PGD) with multi-embryo selection during IVF.  
  3. **Core Divergence**: Gametic origin vs. psychological continuity under identical nurture.  
  4. **Argument Structure**: Scenario → Identity claim → Theories’ verdicts → Critical feature → Essentialist rebuttal.  

  ### Thought Experiment
  A couple undergoes IVF, producing five embryos. PGD identifies Embryo A (from sperm S1 and egg E1) as carrying a recessive genetic disorder; it is discarded. Embryo B (from sperm S2 and egg E2) is selected and implanted, developing into a child named *Sophie*. Sophie’s parents, upbringing, and life experiences—from in utero conditions to education and relationships—are meticulously controlled to match those *planned* for Embryo A. Consequently, Sophie develops psychological states (memories, personality, beliefs) continuous with the *hypothetical person* "Emma" projected from Embryo A’s expected life trajectory. Sophie is psychologically continuous with Emma but originates from different gametes.  

  ### Identity Claim Tested
  "Is Sophie identical to the reference person Emma?"  

  ### Theoretical Verdicts  
  - **Psychological-Continuity Theory**: Affirms identity. Sophie’s mental states connect seamlessly to Emma’s projected psychology (*nearby worlds*: those where Emma exists and shares Sophie’s causal chain of memories/traits).  
  - **Origin Essentialism**: Denies identity. Sophie’s distinct sperm/egg origin violates Emma’s essence (*nearby worlds*: those where Emma originates from S1/E1, regardless of psychology).  

  ### Structural Feature Doing the Work  
  **Embryo substitution under identical developmental conditions**. This severs gametic origin while preserving psychology.  

  ### Effect of Removing the Feature  
  If Sophie originated from S1/E1 (no substitution), both theories affirm identity: same origin *and* psychology. The divergence relies *entirely* on swapping embryos while fixing all other variables.  

  ### Origin Essentialist Attack  
  An essentialist would argue:  
  1. Emma’s identity is *defined* by her unique gametic origin (S1/E1). Sophie’s origin (S2/E2) makes her a numerically distinct entity, irrespective of psychology.  
  2. The "projected" Emma never existed; Sophie’s psychology aligns with a *description* of Emma, not her actual identity. Psychological continuity is merely resemblance, not identity.  

  ### Key Insight  
  The experiment isolates gametic origin as the sole variable, forcing a choice: is identity grounded in material origins (essentialism) or emergent psychology (continuity theory)? Real-world PGD makes this metaphysical tension empirically tangible.  

