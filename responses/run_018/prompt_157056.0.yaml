  As a retired biologist who has recently begun studying philosophy, I am trying to sharpen my grasp of metaphysical arguments about personal identity. You are an expert philosopher of science with training in both metaphysics and biology; please think step by step and begin with a brief design outline before constructing anything. Build me a realistic, one-paragraph thought experiment—grounded in present-day reproductive medicine rather than science fiction—in which a specific individual is psychologically continuous with a reference person but originated from different sperm and egg, so that origin essentialism and psychological-continuity theory come apart. To avoid stipulation, use an actual biomedical mechanism (for example, multi-embryo IVF selection or mitochondrial-replacement protocols—name the mechanism in one sentence) that keeps parents, environment, and developmental trajectory fixed while altering only the gametic origin. State your design constraints explicitly up front: no cloning, no teleportation, no perfect predictors, and no exotic physics. After presenting the scenario, identify the exact belief or identity claim being tested, specify the nearby worlds each theory considers, and demonstrate why origin essentialism denies identity while psychological continuity affirms it. Then isolate the single structural feature that does the work, show what happens to both verdicts if that feature is removed, and explain how an origin essentialist would attack the case. Keep the response tightly focused; do not provide bibliographies, citations, or reading lists.
