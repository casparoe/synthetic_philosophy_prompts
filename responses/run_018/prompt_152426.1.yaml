          But note: the bot's confidence in its prediction of S might be high, but then if it predicts false with high confidence and S becomes true, then it was correct. However, the problem is that the bot cannot assign a probability to S without getting into a loop.

     Actually, this is similar to a liar paradox. We need to show that if the bot is always correct (with probability 1) then we get a contradiction.

     A better analogy: 
          Let S be: "The bot assigns probability less than 1 to this statement."

          If the bot assigns probability 1 to S, then it believes that the probability it assigns to S is less than 1, which is a contradiction. Therefore, the bot cannot assign probability 1 to S. But then, if the bot is always correct, then it must assign probability 1 to true statements. However, S is true (because the bot does not assign 1 to it) but the bot cannot assign 1 to it. 

