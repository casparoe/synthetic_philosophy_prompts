     This is similar to Löb's theorem. We are showing that if the agent believes T (its own soundness) then it can be trapped in a contradiction by a statement that says "you will prove me false".

  4. **Conclusion (3 min)**
     - The obstacle: A system that can model its own reasoning cannot have complete trust in that reasoning without becoming inconsistent.
     - This doesn't mean we can't build AI, but it does mean that we must avoid such absolute self-trust. We might have to use bounded confidence or avoid certain kinds of self-referential reasoning.

     Check understanding: 
          - "Why can't a rational agent be 100% confident in its own rationality?"
          - "What is the role of self-reference in creating this problem?"

  Final teaching plan:

  1. (2 min) Forecasting bot without self-reference: how it updates confidence.
  2. (5 min) Introduce a self-referential prediction: a statement that talks about the bot's own prediction about that statement. Show the paradox.
  3. (5 min) Generalize to trust in reasoning: the bot's belief in its own soundness (T). Construct a statement S that says "the bot will prove S false". Show that if T holds, then we get a contradiction.
  4. (3 min) Address misconceptions: not that AI is impossible, but that perfect self-trust is impossible. Recursion alone isn't the issue; it's the fixed-point. Scale doesn't solve it.
  5. (3 min) Check: ask the two questions above.

