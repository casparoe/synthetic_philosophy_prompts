answer: |-
  ### Teaching Plan: Löbian Obstacle in 20 Minutes  
  **Goal:** Show why a rational system that models its own reasoning *cannot* assign 100% confidence to that reasoning without contradiction.  
  **Anchor Example:** A forecasting bot that updates its self-confidence based on past accuracy.  

  ---

  #### **Step 1: Set Up the Forecasting Bot (3 min)**  
  - **Simple Analogy:**  
    - A bot predicts events (e.g., "Will it rain tomorrow?").  
    - It tracks accuracy and adjusts a **self-confidence weight `c`** (0 ≤ `c` ≤ 1).  
    - If correct 99% of the time, `c = 0.99` → it trusts future predictions 99%.  
  - **Key Idea:**  
    - Bot uses `c` to decide how much to "trust itself" when making new predictions.  
  - **Q to Group:** *"If the bot is always right, should `c = 1`?"* (Let them agree—this sets up the trap.)  

  ---

  #### **Step 2: Introduce Self-Referential Prediction (5 min)**  
  - **The Trap Statement:**  
    > *"This statement will be assigned confidence ≤ 0.5 by the bot."*  
    Call this **Statement S**.  
  - **Bot’s Dilemma:**  
    - *If bot assigns high confidence to S (e.g., `c_S > 0.5`)*:  
      S says "you *won’t* do this" → bot is wrong → `c` should decrease. Contradiction!  
    - *If bot assigns low confidence to S (e.g., `c_S ≤ 0.5`)*:  
      S is correct → bot *should* be confident! Contradiction!  
  - **Visualize:**  
    ```  
    High c_S → S is false → bot is overconfident → c drops.  
    Low c_S → S is true → bot is underconfident → c should rise.  
    ```  
  - **Conclusion:** Bot **can’t assign consistent `c` to S** without being wrong.  

  ---

  #### **Step 3: Connect to Self-Trust (5 min)**  
  - **Generalize to Self-Trust:**  
    - Suppose the bot believes: *"My reasoning is perfect! (c = 1)"* → "Everything I believe is true."  
    - Now apply to **Statement T**:  
      > *"If the bot believes T, then T is false."*  
  - **Löbian Contradiction:**  
    - If bot believes T (with `c = 1`), then T must be true → "If I believe T, it’s false."  
    - But if T is true, then believing T makes it false → bot can’t believe T *or* trust itself consistently.  
  - **Core Insight:**  
    > *"Believing ‘I am always right’ creates a self-referential loop that breaks trust."*  

  ---

  #### **Step 4: Address Misconceptions (3 min)**  
  Cut these off quickly:  
  1. **"Gödel kills all AI?"**  
     - *Response:* "No! It just means **perfect self-trust is impossible**. Real systems use bounded confidence (e.g., `c = 0.99`)."  
  2. **"It’s just recursion?"**  
     - *Response:* "Recursion alone is fine. The issue is **self-reference + certainty**—a bot *must* doubt itself to avoid inconsistency."  
  3. **"Scale solves this?"**  
     - *Response:* "Nope! Bigger systems *increase* self-referential power. The problem **scales up**."  

  ---

  #### **Step 5: Check Understanding (3 min)**  
  - **Question:**  
    *"Why can’t the forecasting bot set `c = 1`, even if it’s always been right?"*  
  - **Target Answer:**  
    > "Because self-referential statements (like S or T) force it to be wrong *if* it claims 100% confidence. It must leave room for doubt."  
  - **Why this works:** Tests if they see the *obstacle* (not Gödel’s theorem). If they parrot "self-reference," push: *"What breaks when you add certainty?"*  

  ---

  #### **Formal Machinery to Avoid**  
  Summarize these in **one line** without details:  
  - **Gödel Numbering:** *"Encode statements as numbers so bots can talk about their own beliefs."*  
  - **Fixed-Point Theorem:** *"Math lets us create self-referential statements like S or T."*  
  - **Löb’s Theorem:** *"A system can’t prove its own soundness without contradiction."* (Do **not** open this!)  

  ---

  #### **Why This Works**  
  - **Flow:** Concrete bot → self-referential trap → generalization → misconceptions.  
  - **Tighter Analogy:** The forecasting bot avoids gradient descent/neural nets. It’s about **confidence weights + self-referential predictions**, not learning algorithms.  
  - **Key Avoidance:** No logic symbols. All paradoxes are verbal.  

  **Time Buffer:** Practice timing—cut steps at 3/5/5/3/3 min. Use the bot example to make it tangible, then zoom out to "self-trust."
