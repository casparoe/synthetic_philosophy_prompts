  What principle, if any, captures all of this? I'm especially stuck on the sleepwalker vs. the anencephalic case -- they seem to pull in opposite directions. Is there a coherent gradation of moral status here, or do I need to drop one verdict? And what does your best principle predict for a hypothetical system with global workspace architecture but zero affective valence?
