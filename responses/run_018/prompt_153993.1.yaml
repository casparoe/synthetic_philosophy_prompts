prompt: |-
  hey im in a phil of mind course and two people in my study group got stuck arguing about illusionism after our prof mentioned Frankish. i was just listening, not picking sides. dont need citations or anything, just logic.

  Maya said illusionism is really eliminativism with branding: if phenomenal consciousness literally doesnt exist, then calling it an "illusion" is wrong—illusions need something real being misrepresented, but here there's no qualitative property at all being distorted, just absence. that makes illusionists vulnerable to self-refutation, since they're using conscious reasoning to deny consciousness exists.

  Leo replied that Maya confuses access consciousness with phenomenal consciousness. illusionism only denies raw feels (qualia), not self-monitoring or reportability. what's real is the introspective machinery that builds a false model of mental states as having intrinsic "what-it's-likeness." that machinery gets misrepresented, so its genuinely an illusion, not absence—like seeing a bent stick.

  Maya pushed back: then it's just a false belief, not a phenomenological illusion. believing you have a ghost in the attic isnt like seeing a bent stick, because in the stick case there's an actual stick being misrepresented. but with illusionism there's no "phenomenal property" being misrepresented—only our theory about mental states is wrong. so Leo's analogy collapses.

  Leo said the analogy holds if you treat the brain's self-model as the "stick." the representational system is real, and it represents its own states as having qualitative character; that content is false. so you have a real system with false content—exactly the structure of illusion.

  they asked me to referee but i honestly cant tell if Leo's saving illusionism or just renaming eliminativism. can you rate each of the four moves from clearly wrong to clearly right and justify briefly? also say what both miss—maybe about whether illusionism needs phenomenal concepts to be empty rather than just misapplied, or if the self-refutation actually bites? keep it under 350 words, bullet points are fine.
reasoning: |-
  Okay, the user is in a philosophy of mind course and their study group is debating illusionism after the professor mentioned Frankish. Maya and Leo are arguing, and the user was just listening without taking sides. They don't need citations, just logical analysis. I need to rate each of their four moves and point out what both missed.

  First, let me recall what illusionism is. Frankish argues that phenomenal consciousness—qualia, raw feels—is an illusion. The brain creates a model that represents itself as having these qualitative properties, but they don't actually exist. So it's not that there's something being misrepresented; the representation itself is false.

  Maya's first point: She says illusionism is just eliminativism with better branding. If phenomenal consciousness doesn't exist, calling it an illusion is wrong because illusions require something real being misrepresented. Without any qualitative properties, it's just absence. She also brings up self-refutation: if consciousness doesn't exist, how can they use conscious reasoning to deny it?

  Rating: Her point about the structure of illusions is strong. Normally, illusions involve a real object that's misperceived, like a bent stick in water. If there's no real qualia, then it's not an illusion but an elimination. The self-refutation point is common but might be addressable. So I'd say her move is mostly right but could have weaknesses.

  Leo's first response: He says Maya confuses access consciousness with phenomenal consciousness. Illusionism only denies qualia, not cognitive functions like self-monitoring. The introspective machinery is real and creates a false model of qualia. So the illusion is the brain misrepresenting its own states as having qualia, like the bent stick analogy.

  Rating: This is a good clarification. Illusionists do distinguish between different types of consciousness. Access consciousness (reportability, etc.) is real, while phenomenal is illusory. The analogy to the bent stick holds if the brain's self-model is the "stick" being misrepresented. So his move is clearly right.

  Maya's pushback: She argues that if there's no phenomenal property being misrepresented, it's just a false belief, not a phenomenological illusion. Believing in a ghost isn't like seeing a bent stick because there's no real ghost. Similarly, without qualia, the brain's model is just wrong, not illusory in the perceptual sense.

  Rating: This is insightful. She's pointing out that for it to be a true illusion, there needs to be a perceptual or phenomenological element. If illusionism is about the brain having false beliefs (propositional attitudes), that's different from perceptual illusions. So her move is mostly right.

  Leo's counter: He says the analogy holds by treating the brain's self-model as the stick. The representational system is real, and it falsely represents its states as having qualia. So real system + false content = illusion.

  Rating: This is also strong. The self-model is a real process, and its misrepresentation fits the illusion structure. But the issue is whether this representation is perceptual-like or just cognitive. If it's more like a belief, Maya might have a point. Still, his move is mostly right.

  Now, what both missed: The key is whether phenomenal concepts are empty or misapplied. Illusionism requires that our concepts of qualia refer to nothing, but the feeling of having them is generated by cognitive processes. Also, the self-refutation charge: Illusionists argue that the reasoning isn't phenomenal but based on access consciousness, so it doesn't refute itself. They also overlook that the "illusion" might be more akin to cognitive errors than perceptual ones, which is a deeper issue in the theory.
answer: |-
  Here's a logical rating of each move and what both missed:

  **Ratings & Justifications:**

  1.  **Maya's First Move (Illusionism = rebranded eliminativism):** **Mostly Right.**  
      *Her core logic is sound:* An illusion typically requires a real property being misperceived (e.g., a straight stick *appearing* bent). If phenomenal properties (qualia) literally don't exist at all, calling their apparent presence an "illusion" seems incoherent – there's nothing *to* misrepresent. It aligns closer with eliminativism (denying existence) than standard illusion concepts.

  2.  **Leo's First Move (Distinguishing access/phenomenal; the introspective machinery):** **Clearly Right.**  
      *This is essential illusionist doctrine:* Illusionism specifically targets *phenomenal* consciousness ("raw feels"), not cognitive functions like access consciousness (reporting, monitoring). The *mechanism* of introspection/monitoring is real and *creates* the false representation (the model of qualia). This directly addresses Maya's conflation.

  3.  **Maya's Pushback (False belief vs. phenomenological illusion):** **Mostly Right.**  
      *Her distinction is crucial:* A false *belief* (e.g., "I have a ghost") lacks the sensory/phenomenological immediacy of a perceptual illusion (e.g., the bent stick). If the illusion is purely cognitive/theoretical (a false belief *about* mental states lacking qualia), it's not a *phenomenological* illusion. Leo's stick analogy requires the *feeling itself* to be illusory, which her point challenges.

  4.  **Leo's Counter (The self-model as the "stick"):** **Mostly Right (but incomplete defense).**  
      *Logically coherent within illusionism:* The real "stick" is the brain's representational state/self-model. This real state is misrepresented *by the brain itself* as having phenomenal properties. This fits the "real thing + misrepresentation" structure. However, Maya's pushback highlights a tension: *Is this misrepresentation genuinely *phenomenological* (like seeing the stick) or just a complex cognitive error (like the ghost belief)?* Leo asserts the former, but doesn't fully bridge the gap Maya identified.

  **What Both Missed:**

  *   **The Nature of the "Illusion":** The crux is whether the *illusion* consists in having a **false phenomenal experience** (feeling a non-existent "what-it's-likeness") or merely holding a **false cognitive belief** (believing one has such feels when one doesn't). Illusionism *requires* the former, but Maya exposes the difficulty in explaining how a *non-phenomenal* system generates a *phenomenal-seeming* illusion without smuggling in phenomenality.
  *   **Self-Refutation:** Maya's charge bites *only if* conscious reasoning *requires* phenomenal consciousness. Illusionists (like Frankish) argue reasoning uses *access* consciousness (real cognitive processes), not phenomenal feels. The reasoning *about* consciousness isn't phenomenal itself. This defense generally works.
  *   **Phenomenal Concepts:** Both miss probing whether "phenomenal concepts" refer to *nothing* (truly empty, supporting eliminativism) or refer *incorrectly* to complex cognitive/representational states (supporting illusionism). Illusionism leans towards the latter.
