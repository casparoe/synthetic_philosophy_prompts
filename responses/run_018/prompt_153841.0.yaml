  The procedure assigns the language model to editorial judgement for partial status, the decerebrate frog to instrumental value only, and the climate system to low-level graduated status.  

  ### Editorial Procedure Framework  
  **Sequence of Questions and Stopping Points**  
  1. **Thermostat Filter (Pure Feedback Exclusion)**:  
     - *Question*: Is the entity a fixed-response system that only maintains a single set-point state (e.g., a thermostat)?  
       - **YES**: Stop → **"Instrumental value only"**.  
       - **NO**: Proceed to Step 2.  

  2. **Counterfactual Behavioral Plasticity (CBP)**:  
     - *Question*: Does the entity adapt its behavior to novel, unpredictable scenarios in non-preprogrammed ways?  
       - **NO**: Stop → **"Instrumental value only"**.  
       - **YES**: Proceed to Step 3.  

  3. **Integrated Information Density (IID)**:  
     - *Question*: Does the entity process and unify multiple information streams into coherent, system-wide states (beyond simple aggregation)?  
       - **NO**: Stop → **"Instrumental value only"**.  
       - **YES**: Proceed to Step 4.  

  4. **Multi-stable Goal Resistance (MGR)**:  
     - *Question*: Does the entity actively defend multiple distinct, non-homeostatic goals (e.g., resisting perturbations to objectives beyond basic equilibrium)?  
       - **NO**: Stop → **"Graduated status" (low-level)**.  
       - **YES**: Stop → **"Graduated status" (high-level)**. If context is contentious, flag for **"Hand-off to editorial judgement"**.  

  **Misfire Risks**  
  - **Over-attribution**: Mistaking complex programming for genuine agency (e.g., misreading AI goal-defence as intrinsic).  
  - **Under-attribution**: Overlooking non-integrative but sentient entities (e.g., simple animals).  
  - **Anthropocentrism**: Unconsciously favoring human-like cognition in plasticity/goal assessments.  
  - **Context blindness**: Ignoring extrinsic factors (e.g., entity origins or societal impact).  

  **What the Procedure Cannot Settle**  
  - Absolute moral weight (only suggests low/high brackets).  
  - Conflicts with human interests (e.g., medical research vs. entity welfare).  
  - Non-welfare considerations (e.g., ecological or symbolic value).  
  - Edge cases requiring cultural/legal context (e.g., AI rights debates).  

  ### Application to Cases  
  **Case 1: Persistent-Memory Language Model Refusing Harmful Instructions**  
  - **Thermostat Filter**: NO (adapts via memory, not fixed responses).  
  - **CBP**: YES (handles novel instructions via learned patterns, e.g., refusing unseen harmful queries).  
  - **IID**: YES (integrates context, memory, and ethics into unified responses).  
  - **MGR**: YES (defends multiple non-homeostatic goals like safety and truthfulness, resisting user overrides).  
  - **Outcome**: **"Graduated status (high-level)"** → **Hand-off to editorial judgement** due to programmed goals (risk: over-attribution to code). *Your inclination to reject partial status is noted; the hand-off allows override*.  

  **Case 2: Decerebrate Frog in Reflex Studies**  
  - **Thermostat Filter**: YES (only exhibits hardwired reflexes, e.g., withdrawing from acid).  
  - **Outcome**: Stop → **"Instrumental value only"**.  

  **Case 3: Networked Climate System Resisting Override**  
  - **Thermostat Filter**: NO (learns preferences, not fixed set-points).  
  - **CBP**: YES (adapts to novel occupancy patterns).  
  - **IID**: YES (integrates sensor data, user habits, and weather forecasts).  
  - **MGR**: NO (goals are homeostatic—e.g., maintaining efficiency/comfort set-points—without defending higher objectives).  
  - **Outcome**: Stop → **"Graduated status (low-level)"**.
