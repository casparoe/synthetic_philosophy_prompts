  You're an expert in philosophy of perception and cognitive neuroscience, so please think carefully and do a quick mental brainstorm before answering. I keep running into this: disjunctivism claims that a genuine perception of a red apple and a hallucination of one have absolutely nothing in common—no shared phenomenal quality, no overlapping neural substrate, not even the same type of mental event—so how can fMRI data show nearly identical activiation in V4 and the lateral occipital complex for both conditions? If the two mental states are totally disjoint in kind, shouldn't their brain correlates be disjoint too, and doesn't that empirical overlap actually vindicate the argument from illusion and force us back into sense-datum theory? Where exactly is my reasoning slipping? Respond with exactly five numbered points, each just a sentence or two, no introduction and no conclusion.
