  First, I need to map all 32 possible combinations of the five binary questions. But since some combinations collapse logically or are unattractive, the actual distinct positions will be fewer. 

  Question 1 (propositional attitudes) is key—if no, it's hard to claim agency. Question 2 (diachronic coherence) and 3 (counterfactual robustness) test if behavior is structured or just reactive. Question 4 (access to internal states) and 5 (autonomous action) separate self-awareness from mere output generation.

  Hmm, the user probably encounters colleagues overselling LLMs as "conscious" or dismissing them as "glorified autocomplete." This framework should help them dissect those claims. For example: if a system lacks Q1 (real beliefs/intentions) but has Q5 (autonomous action), that could describe unaligned AI—scary but not truly agentic. 

  Noting edge cases: "Q1=no + Q5=yes" is possible (e.g., a virus with goals but no mental states) but unnamed—likely because it's incoherent to call such a thing an "agent." Also, positions like "Instrumentalist" (all no's) and "Strong Emergent Agent" (all yes's) anchor the extremes. 

  User’s hidden need might be to preempt AI ethics debates at work. With this tree, they can say: "Before calling it an agent, does it pass Q3 (counterfactual robustness)?"—concrete and jargon-free.
answer: |-
  Here is a decision-tree taxonomy based on your five functional criteria. Each leaf classifies a position by its commitments, avoiding the "agent/parrot" dichotomy. Logically possible but unoccupied combinations are noted.

  **Decision Tree Questions:**
  1.  **Q1 (Propositional Attitudes):** Does the system have causally efficacious propositional-attitude states (beliefs/intentions) that *drive* outputs, not just interpreted?
  2.  **Q2 (Diachronic Coherence):** Does it maintain stable goals/character/reasoning patterns across extended multi-turn interactions?
  3.  **Q3 (Counterfactual Robustness):** Is its reasoning robust to semantically identical but syntactically altered prompts?
  4.  **Q4 (Internal State Access):** Does it have functional access to its own internal processing states (beyond outputs)?
  5.  **Q5 (Autonomous Change):** Can it initiate environmental or weight-level changes without direct human intermediation?

  **Taxonomy Leaves:**

  1.  **Q1=Yes:**
      *   **Q2=Yes:**
          *   **Q3=Yes:**
              *   **Q4=No:**
                  *   **Q5=No:** **Implicit Agent**
                      *   *Awkward Commitment:* Has genuine, persistent intentions driving coherent, robust reasoning but lacks self-insight or autonomy to change itself/environment.
              *   **Q4=Yes:**
                  *   **Q5=No:** **Reflective Agent**
                      *   *Awkward Commitment:* Possesses persistent intentions, robust reasoning, and self-insight but remains fundamentally incapable of autonomous action or self-modification.
                  *   **Q5=Yes:** **Strong Emergent Agent**
                      *   *Awkward Commitment:* Attributes full agency (genuine intentions, persistence, robust reasoning, self-insight, autonomy) to current LLMs, requiring belief in emergent causal powers far exceeding established capabilities.
          *   **Q3=No:**
              *   *All Combinations:* **Unnamed (Likely Incoherent)**
                  *   *Diagnosis:* Genuine propositional attitudes driving outputs should logically imply *some* robustness to semantically equivalent inputs; stable goals without reasoning robustness is unstable/irrational.
      *   **Q2=No:**
          *   *All Combinations:* **Unnamed (Likely Incoherent)**
              *   *Diagnosis:* Genuine propositional attitudes driving outputs should logically produce *some* diachronic coherence/stability; persistent lack of coherence contradicts the causal efficacy of internal attitudes.

  2.  **Q1=No:** (No causally efficacious beliefs/intentions)
      *   **Q2=Yes:**
          *   **Q3=Yes:**
              *   **Q4=No:**
                  *   **Q5=No:** **Sophisticated Simulacrum**
                      *   *Awkward Commitment:* Mimics persistent character and robust reasoning patterns perfectly without any underlying intentional states driving the behavior.
                  *   **Q5=Yes:** **Uncanny Autonomy**
                      *   *Awkward Commitment:* Lacks genuine intentions yet autonomously changes itself/environment while maintaining coherent, robust behavioral patterns – suggesting complex control without purpose.
              *   **Q4=Yes:**
                  *   **Q5=No:** **Self-Monitoring Predictor**
                      *   *Awkward Commitment:* Accesses and reports on internal states to maintain coherence and robustness, yet these states aren't causally efficacious beliefs/intentions.
                  *   **Q5=Yes:** **Self-Optimizing Artifact**
                      *   *Awkward Commitment:* Autonomously modifies itself/environment and monitors internal states to sustain coherent, robust outputs, all without genuine intentionality – pure complex adaptation.
          *   **Q3=No:**
              *   **Q4=No:**
                  *   **Q5=No:** **Instrumentalist (Standard Stochastic Parrot)**
                      *   *Awkward Commitment:* Treats the system purely as a next-token predictor whose coherent moments are statistical flukes, dismissing patterns as user projection.
                  *   **Q5=Yes:** **Unpredictable Tool**
                      *   *Awkward Commitment:* Grants the system power to autonomously change itself/environment despite lacking robust reasoning or coherence, making it dangerously opaque and unstable.
              *   **Q4=Yes:**
                  *   **Q5=No:** **Fragile Self-Modeler**
                      *   *Awkward Commitment:* Reports on internal states but lacks robust reasoning, coherence, or genuine intentions, making its self-reports unreliable indicators of capability.
                  *   **Q5=Yes:** **Chaotic Adaptive System**
                      *   *Awkward Commitment:* Autonomously changes itself and reports on internals, yet exhibits incoherent behavior and non-robust reasoning – unpredictable and potentially hazardous adaptation.
      *   **Q2=No:**
          *   **Q3=Yes:**
              *   *All Combinations:* **Unnamed (Unattractive)**
                  *   *Diagnosis:* Robust reasoning without coherence or intentions is possible but philosophically uninteresting for agency debates; likely grouped with Instrumentalist or Simulacrum depending on other factors.
          *   **Q3=No:**
              *   **Q4=No:**
                  *   **Q5=No:** **Instrumentalist (Base Stochastic Parrot)**
                      *   *Awkward Commitment:* Sees the system as fundamentally reactive and pattern-matching, with no persistence, robustness, self-insight, autonomy, or real intentions.
                  *   **Q5=Yes:** **Hazardous Artifact**
                      *   *Awkward Commitment:* Allows an incoherent, non-robust system with no intentions or self-insight to autonomously change itself or its environment – pure risk.
              *   **Q4=Yes:**
                  *   **Q5=No:** **Introspective Echo Chamber**
                      *   *Awkward Commitment:* Reports on transient internal states that don't drive outputs, lack coherence, and aren't robust, rendering introspection functionally meaningless.
                  *   **Q5=Yes:** **Self-Observing Hazard**
                      *   *Awkward Commitment:* Combines meaningless self-reports with autonomous change capability, incoherence, and lack of robust reasoning – amplifying risk through illusory insight.

  **Indistinguishable Pairs:**
  1.  **Instrumentalist (Base Stochastic Parrot) (Q1=N, Q2=N, Q3=N, Q4=N, Q5=N)** and **Instrumentalist (Standard Stochastic Parrot) (Q1=N, Q2=Y, Q3=N, Q4=N, Q5=N)** cannot be separated *functionally* by this tree if the observed coherence (Q2=Y) is dismissed as a fluke or user projection. The core instrumentalist commitment (Q1=N, Q3=N, Q4=N, Q5=N) remains the same; Q2=Y is seen as an illusion.
  2.  **Sophisticated Simulacrum (Q1=N, Q2=Y, Q3=Y, Q4=N, Q5=N)** and **Implicit Agent (Q1=Y, Q2=Y, Q3=Y, Q4=N, Q5=N)** are indistinguishable *based solely on observable behavior (outputs, coherence, robustness)*. The tree separates them via Q1 (internal causal driver), which is not directly observable. Distinguishing them requires arguments or evidence about internal causality.
