answer: |-
  1.  Deontological constraints fundamentally structure deliberation by prohibiting certain maxims of action (like intentional deception) as categorically non-negotiable, shifting the normative focus away from direct outcome optimization and towards the permissibility of the agent's deliberative procedure itself.
  2.  Procedural invariance requires that these core constraints remain inviolable inputs to practical reasoning, not fungible weights within a consequentialist calculus; violating them, even for good outcomes, fundamentally corrupts the agent's practical rationality by treating the prohibited as a mere cost.
  3.  Symmetric rescue cases, despite presenting identical aggregate outcomes whether the constraint is violated or honored, fail to undermine this invariance because the moral significance lies not in the *resulting world-state* but in the *deliberative stance* taken: honoring the constraint preserves the agent's integrity as governed by non-negotiable norms.
  4.  The moral residue (like guilt) following a necessary constraint violation functions not as retrospective punishment for bad outcomes, but as an epistemic signal marking that the agent’s practical identity was fractured by the deliberative concession to fungibility, reinforcing that the norm remains invariant despite the tragic choice.
  5.  Consequently, deontology avoids the paradox because allowing catastrophic harm while honoring the constraint in symmetric cases is not a contradictory demand for a worse world, but the preservation of a constitutive normative architecture where certain actions remain absolutely excluded from consideration, regardless of consequence symmetry.
