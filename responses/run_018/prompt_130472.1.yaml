answer: |-
  Your analysis is sharp but misses crucial nuances in the "fanaticism" debate. Let me dissect this systematically, drawing on decision theory and longtermist ethics:

  **1. Core Distinctions & Framing Clarifications:**
  - **Expected Value (EV) vs. Expected Utility (EU):**  
    EV = Σ [p_i * V_i] (linear in *value* V_i)  
    EU = Σ [p_i * u(V_i)] (linear in *utility* u(V_i), but u(·) is typically concave)  
    *Fanaticism arises under EV maximization or when u(·) remains insufficiently concave for extreme stakes.*

  - **Dust Specks vs. Torture (Yudkowsky's framing):**  
    Assumes **linear disutility per person**:  
    - Option A: 3^^^3 people suffer 1 dust speck each → Total disutility = K  
    - Option B: 1 person tortured for 50 years → Total disutility = C  
    Where K >> C (since 3^^^3 is astronomical).  
    *Critically, this assumes additive linearity across individuals* – rejecting concave per-capita utility by construction.

  - **Risk Aversion Context-Dependence:**  
    Empirical evidence shows risk attitudes vary by domain (financial vs. health vs. existential). Longtermism operates in a *unique context*: extreme stakes, deep uncertainty, and nonlinear value structures (e.g., civilizational collapse thresholds).

  **2. Why Concave Utility Doesn't Resolve Fanaticism:**  
  Your intuition holds for *moderate* stakes, but fails in extremis:
  - **Log utility still permits fanaticism:**  
    u(N lives saved) = log(N)  
    Compare:  
    - Near-certain salvation: p=0.999 of saving 1 life → EU ≈ log(1) = 0  
    - Tiny probability: p=10^{-40} of saving 10^{40} lives → EU = 10^{-40} * log(10^{40}) ≈ 10^{-40} * 92 = 9.2e-39  
    **Result: Still favors near-certain salvation.**  
    *But now consider p=10^{-30} of saving 10^{30} lives:*  
    EU = 10^{-30} * log(10^{30}) ≈ 10^{-30} * 69 = 6.9e-29 → **Now exceeds EU of saving 1 life.**  
    With larger numbers (e.g., 10^100 lives), fanaticism re-emerges at plausible probabilities.

  - **Pascal's Mugging Robustness:**  
    For any unbounded concave u(·), ∃ outcomes so vast that tiny probabilities dominate:  
    lim_{N→∞} [ p * u(N) ] > u(certain_small_gain) for sufficiently large N, *even with p arbitrarily small*.  
    Only **bounded utility** (e.g., u(N) → 1 as N → ∞) definitively avoids this – but bounded utility has independent objections (e.g., violates dominance principles).

  **3. Why "Fanaticism" is a Distinct Problem for Longtermism:**  
  - **Scale-Induced Breakdown:**  
    Longtermism deals with outcomes spanning >10^20 future lives. At this scale:  
    • Standard concave functions (log, root) become *effectively linear* over ranges like [10^100, 10^120]  
    • Astronomical probabilities (e.g., 10^-100) are epistemically ungrounded yet mathematically non-negligible under EV/EU  
  - **Normative Irreducibility:**  
    Even with concave utility, choices like:  
    *"0.0001% chance to prevent human extinction vs. 99.9999% chance to save 10,000 lives today"*  
    force fanaticism if preventing extinction has sufficiently large value.  
  - **Contextual Risk Aversion Failure:**  
    Rational agents might be *risk-seeking* for existential wins (e.g., accepting tiny survival chances) but *risk-averse* for small stakes – violating domain-generality. Standard EU cannot capture this bifurcation.

  **4. Why Novel Solutions are Proposed:**  
  When EU maximization yields counterintuitive results (e.g., sacrificing certain millions for cosmic lotteries), theorists explore:
  - **Risk-Weighted Utility** (e.g., Rank-Dependent Utility):  
    Overweights extreme outcomes (tail probabilities), decoupling risk attitude from marginal utility.
  - **Lexical Thresholds:**  
    Treating categories like "civilizational survival" as lexically superior to finite goods.
  - **Epistemic Constraints:**  
    Discounting probabilities below plausibility thresholds (e.g., ignoring p < 10^{-50}).
  - **Bounded Utility Functions:**  
    Imposing hard limits on achievable utility (controversial but definitive).

  **Resolution to Your Confusion:**  
  Fanaticism isn't just an "artefact of linear utility" because:  
  1. It persists under *any unbounded concave utility function* for sufficiently large stakes.  
  2. Longtermism uniquely forces confrontation with outcomes where standard concavity becomes practically linear.  
  3. Risk attitudes toward civilizational stakes may differ fundamentally from small-scale risk aversion.  

  **Conclusion:**  
  The "fanaticism" debate highlights genuine limitations of standard EU in longtermist domains. While concave utility dampens small-scale fanaticism, it fails to resolve choices involving existential stakes with tiny probabilities. This necessitates either accepting strongly counterintuitive prescriptions or developing domain-specific decision theories – hence its status as an *unsolved problem* in rationalist circles. Your skepticism is justified for moderate-scale problems, but underestimates the mathematical and normative extremity of longtermism's scope.
