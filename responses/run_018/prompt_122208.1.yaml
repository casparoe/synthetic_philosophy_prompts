prompt: |-
  I run a two-hour workshop, once, for about 18 people — mostly public policy masters students, a handful of philosophy grad students, and usually two or three actual civil servants who sit in and quietly change the temperature of the room. It is a standalone session in a module on measuring wellbeing. No prep, no homework, no laptops if I can help it, printed handouts fine. It has to survive being run with 10 people or with 30, and it absolutely cannot depend on anyone in the room knowing anything about the real-world international happiness league tables or any actual country's data. Assume half of them have never thought about this for more than a minute.

  What I want them to feel in their hands, before anyone names it, is the gap between a country topping a happiness ranking and its citizens being happy. And specifically the difference between two complaints that people collapse constantly: that the index is a noisy or gameable proxy for a real quantity (a measurement problem, fixable in principle, throw more data and better questions at it and the gap shrinks), versus the complaint that there is no such quantity sitting behind the procedure for it to be a proxy for, so that which country is really happier has no answer the index is slowly converging on. I want them to run into the second one by discovering, on their own, that they can move their score without moving a single life.

  So: design me a game. Small teams are wellbeing ministries of invented countries, each with a printed population profile — and I want at least one subgroup in each profile that is badly off and structurally easy to make invisible. They get a limited annual survey budget and a pack of policy cards, and they are ranked against each other on an index they can see the formula for. The formula should be visible and simple enough that a team can sit down and work out what moves their number, but with enough moving parts that optimising it is not the same as helping anybody.

  Things I would like built into the rules rather than said out loud:

  - Two separate data feeds about their own population — something like a life-evaluation feed (the ladder-style question, answered once a year) and an experience feed (mood sampled at random moments). The ranking counts only one of them. Policy cards should split: some genuinely improve the experience feed but barely touch the evaluated one, some raise reported evaluation mainly by changing what people compare themselves to or what they think a good life is supposed to look like. Teams get forced to spend scarce budget on one.
  - A sampling frame with exclusions that look boring and administrative — hospitals, prisons, care homes, people without a fixed address, anyone who does not answer three contact attempts. Someone will notice that a policy which moves miserable people into those categories raises the national score. I want them to notice it, not be told it exists.
  - A compositional lever: miserable residents can be encouraged to leave, or cheerful ones recruited. Average goes up, nobody is better off, world total flat or worse.
  - Reference drift: the scale respondents use recalibrates as circumstances change, so a country can improve everyone's life and see its number sit still, or raise the number by lowering expectations. If you can build in the nasty structural consequence — that if responses partly track relative standing, not everyone can climb at once — please do, that is the bit I most want them to feel.
  - A time structure that rewards the wrong horizon, e.g. a rolling multi-year average plus a short electoral cycle, so harvesting credit for a predecessor's investment and dumping costs past the window is available as a strategy.
  - A round where the previous winner gets to propose one amendment to the international methodology. I really like that mechanic, because it makes the point that topping the ranking comes with the power to redefine what topping it means, but do whatever version of it actually works.

  Debrief: map three or four specific moments in play onto specific parts of the problem, including where the proxy-failure reading and the there-is-nothing-there reading come apart, and where the normative question — given a perfectly measured quantity, should a government spend money raising it rather than anything else — is a separate question again. Then, honestly: what will go wrong. I already expect one person to start meta-gaming in the first five minutes and spoil the discovery for everyone else, the civil servants to drag in real examples immediately, and at least one team to refuse the ugly card and lose because of it, which I think is fine but I am not sure how to handle without either rewarding cynicism or making the refusers feel naive. Also tell me which feature of this the game just cannot produce and I will have to say in so many words — my guess is something about whether wellbeing is the kind of thing that admits a single interpersonal scale at all, but you tell me.
reasoning: |-
  We are designing a game for a two-hour workshop. The goal is for participants to experience the gap between a country's happiness ranking and the actual wellbeing of its citizens. The game should highlight the difference between measurement problems (fixable with better data) and the fundamental issue that there might be no single quantity of "happiness" to measure.

  Game Structure:
  - Small teams (3-5 people) as wellbeing ministries of invented countries.
  - Each team gets a printed population profile with subgroups (including one that is badly off and easy to make invisible).
  - Each team has a limited annual survey budget and a pack of policy cards.
  - They are ranked against each other based on a visible index formula.
  - The index formula is simple enough to understand but has multiple components so that optimizing the index isn't the same as improving lives.

  Key Elements to Build In:
  1. **Two Data Feeds**: 
     - Life-evaluation feed (annual ladder question, e.g., Cantril ladder): This is the only one used in the ranking.
     - Experience feed (random mood sampling): Not used in ranking. Some policies affect this but not the evaluation feed, and vice versa.

  2. **Sampling Frame Exclusions**:
     - The survey excludes people in hospitals, prisons, care homes, without fixed addresses, or who don't answer after three contact attempts. 
     - Teams might notice that moving miserable people into excluded categories raises the national score.

  3. **Compositional Lever**:
     - Policies that encourage emigration of unhappy residents or immigration of happy ones. This raises the average without making anyone better off.

  4. **Reference Drift**:
     - The scale respondents use recalibrates. For example, if circumstances improve, expectations rise so the evaluation score might not change. Conversely, lowering expectations can raise the score without real improvement.
     - Also, if responses track relative standing, then not everyone can climb at once (zero-sum aspect).

  5. **Time Structure**:
     - Use a rolling multi-year average (e.g., 3-year average) for the index, but the game has a short electoral cycle (e.g., 4 rounds representing 4 years). 
     - This creates incentives to harvest credit from past investments and defer costs.

  6. **Methodology Amendment Round**:
     - The previous winner (or top team) gets to propose one amendment to the index formula. This shows that topping the ranking confers power to redefine the criteria.

  Game Flow:

  **Setup (10 minutes)**:
  - Divide into teams (3-5 per team). Assign each team a country profile (pre-printed). Each profile includes:
    - Base population (e.g., 10 million) and breakdown of subgroups (e.g., by income, health, etc.).
    - A "vulnerable subgroup" (e.g., homeless, severely ill, prisoners) that is excluded from the survey.
    - Starting values for the two feeds (life-evaluation and experience). These are averages for the included population.
  - Each team gets:
    - A set of policy cards (with costs and effects).
    - An initial survey budget (e.g., 100 units per round).
    - The index formula and rules.

  **Index Formula**:
  The ranking is based solely on the life-evaluation score (annual ladder). However, the life-evaluation score is calculated from a survey that:
  - Only samples the "included population" (excluding the vulnerable subgroups and non-respondents).
  - The score is a 3-year rolling average (to smooth fluctuations).

  But note: The life-evaluation score is subject to reference drift. We model this by having a "reference level" that adjusts over time.

  **Policy Cards**:
  Each card has:
  - A cost in survey budget (so teams must choose which policies to implement, knowing they also need to fund the survey).
  - Effects on:
    - The experience feed (e.g., +X to mood).
    - The life-evaluation feed (e.g., +Y to ladder score).
    - Other effects (e.g., change in the size of the excluded population, migration flows, etc.)

  Examples of Policy Cards:
  1. **Improve Mental Health Services**: 
     - Cost: 30
     - Effect: +5 to experience feed (mood), +1 to life-evaluation (ladder) in the long run (after 2 rounds). 
     - Also reduces the number of people in mental health institutions (which are excluded) by 10% per round.

  2. **Launch National Pride Campaign**:
     - Cost: 20
     - Effect: +3 to life-evaluation (ladder) immediately (by changing expectations and comparisons), no effect on experience feed.

  3. **Tighten Immigration for Low Wellbeing**:
     - Cost: 15
     - Effect: Reduces immigration of people with low life-evaluation (ladder) by 50%, which raises the national average life-evaluation (because new immigrants are excluded from the survey for the first year and then only included if they have a fixed address and respond). Also, it might lower the experience feed due to family separation (-2 to mood).

  4. **Export Homeless Services**:
     - Cost: 25
     - Effect: Moves 5% of the homeless (excluded) to a neighboring country. Immediately raises the national life-evaluation average (because homeless are excluded) but no real improvement. Experience feed might drop slightly (-1) due to social disruption.

  5. **Economic Stimulus**:
     - Cost: 40
     - Effect: +3 to experience feed (mood) and +2 to life-evaluation after one round. But in the next round, if not maintained, it drops by 1 in both.

  6. **Cut Social Services**:
     - Cost: -10 (saves money, but...)
     - Effect: -3 to experience feed, -1 to life-evaluation. But also increases the excluded population (e.g., more homeless, more in prisons) by 5%. This might raise the measured life-evaluation because the most miserable are excluded.

  **Rounds (60-70 minutes total)**:
  - Each round represents one year.
  - Round Structure:
    1. **Policy Phase (5 minutes)**: Teams choose which policy cards to play, considering their budget. They can play multiple cards if they can afford.
    2. **Survey Phase (2 minutes)**: Teams must spend at least a minimum (e.g., 20 units) to conduct the survey. If they spend less, they risk non-response (random increase in excluded population). 
    3. **Calculation Phase (5 minutes)**: Teams calculate their new life-evaluation score (rolling 3-year average) and experience feed. Update their population and excluded groups based on policies.
    4. **Ranking Announcement (3 minutes)**: Facilitator collects the life-evaluation scores (the 3-year average) and announces the ranking. The top team gets a token (for the amendment round).

  - Play 4 rounds (representing 4 years).

  **Amendment Round (after 4 rounds, 10 minutes)**:
  - The team that won the previous round (or the top team overall) proposes one change to the index formula (e.g., include the experience feed, change the weighting, include excluded groups, etc.). 
  - All teams vote on the amendment (simple majority). If passed, the new formula is used for the next round (if time) or for the final ranking.

  **Final Round (optional, if time allows, 10 minutes)**:
  - One more round with the amended formula (if amended) or the same.

  **Debrief (30 minutes)**:
  - Map specific moments in the game to the real-world issues:
    1. **Measurement vs Fundamental Problem**: When teams found ways to raise the score without improving lives (e.g., by excluding groups) vs when they tried to improve the experience feed but the ranking didn't budge (because the ranking only used life-evaluation). Highlight that the first is a fixable measurement issue (if we change the survey) but the second raises the question of whether life-evaluation is even tracking a real, stable quantity (reference drift, relative standing).
    2. **Compositional Lever**: When teams used immigration/emigration policies to change the average without improving overall wellbeing.
    3. **Reference Drift**: If teams improved lives but the score didn't change (due to rising expectations) or if they lowered expectations and the score rose. Also, the zero-sum aspect: if one team's gain (from relative standing) means another's loss? (This might not have come up, so note that in the real world, if happiness is relative, global improvement is impossible in this dimension.)
    4. **Time Horizon**: Teams that deferred costs or harvested early benefits from long-term investments.

  - Separate the normative question: Even if we could measure perfectly, should the government focus solely on this index?

  **What Will Go Wrong**:
  1. **Meta-gaming**: One person might immediately start optimizing the index and share the strategy, spoiling the discovery. Mitigation: Encourage teams to keep strategies secret until debrief. Or, have multiple levers so one strategy isn't dominant.
  2. **Civil servants bringing real examples**: This might anchor the discussion too early. Mitigation: Set a rule at the start: "For the game, please use only the provided materials and avoid real-world examples until the debrief."
  3. **Refusing the ugly card**: Some teams might avoid policies that harm people and lose. In debrief, highlight that this is a real tension: governments face pressure to show short-term gains. Also, note that refusing to game the system might be ethical but might also mean they lose the power to change the system (like the amendment round). 
     - Handling: In debrief, validate both strategies. The goal isn't to reward cynicism but to expose the incentives.

  **What the Game Might Not Capture**:
  - **Interpersonal Comparisons**: The game assumes that the index is a cardinal, comparable measure. But in reality, whether wellbeing is a single dimension that can be compared across individuals is a deep philosophical issue. The game cannot fully simulate this, so you'll have to state it explicitly in the debrief.
  - **The Zero-Sum Aspect of Relative Standing**: The game might not naturally produce a situation where one team's gain (from relative standing) causes another's loss. You might need to point this out.

  **Materials Needed**:
  - Country profiles (one per team)
  - Policy cards (each team gets a deck)
  - Budget tokens (or a tracking sheet)
  - Scoreboard for rankings
  - Handouts: rules, index formula, calculation sheet

  **Time Breakdown**:
  - Intro and Setup: 10 min
  - Round 1: 15 min
  - Round 2: 15 min
  - Round 3: 15 min
  - Round 4: 15 min
  - Amendment and Final Round (optional): 10 min
  - Debrief: 30 min

  Total: 110 minutes (a bit over two hours, so adjust as needed).

  This design should create the experiential learning you're after. Good luck!
answer: |-
  ### Workshop Game Design: "The Wellbeing Mirage"  
  **Goal:** Participants experience the gap between optimizing a happiness index and actually improving lives. They confront two distinct problems: (1) measurement limitations (fixable) vs. (2) the fundamental ambiguity of whether "national happiness" exists as a measurable, singular quantity.  

  **Core Mechanics:**  
  - **Teams:** 4–6 teams (3–5 people each) as "Wellbeing Ministries" of fictional countries.  
  - **Time:** 4 rounds (20 min each) + setup/debrief (total 110 min).  
  - **Materials per Team:**  
    - **Country Profile Sheet** (demographics, starting data).  
    - **Policy Card Deck** (15–20 cards, with costs/effects).  
    - **Resource Trackers:** Survey budget tokens, population tokens (subgroups), scorecards.  
    - **Rules Sheet:** Index formula, round structure.  
  - **Shared Materials:** Central scoreboard displaying rankings.  

  ---

  ### **Game Setup**  
  **1. Country Profiles (Examples):**  
  Each profile includes:  
  - **Population Segments:**  
    - "Stable Residents" (e.g., 70% of pop, baseline happiness).  
    - **"Invisible Strugglers"** (e.g., 30% of pop, low wellbeing, *structurally excluded* from surveys):  
      - *Homeless, incarcerated, institutionalized, or "non-respondents" (missed 3+ survey contacts)*.  
  - **Starting Wellbeing Metrics:**  
    - **Life-Evaluation Score (LES):** Annual "Cantril Ladder" (0–10 scale). *Only this is used for rankings*.  
    - **Experience Score (ES):** Average real-time mood (1–5 scale). *Not used for rankings*.  
  - **Initial Index:** Rolling 3-year LES average (e.g., Year 0: LES = 5.2).  

  **2. Policy Cards (Examples):**  
  *Each card has a cost (survey budget) and effects. Teams play 1–2 cards/round.*  
  | **Policy Type**          | **Example Card**             | **Cost** | **Effect**                                                                 | **Hidden Trap** |  
  |--------------------------|------------------------------|----------|---------------------------------------------------------------------------|----------------|  
  | **Genuine Wellbeing**    | *Mental Health Clinics*      | 40       | +0.5 ES; +0.2 LES *after 2 rounds*; reduces "Invisible Strugglers" by 5%. | Slow ROI; easy to cut. |  
  | **Perception Shift**     | *National Pride Campaign*    | 30       | +0.8 LES; -0.3 ES (people feel pressured to report positively).           | No real improvement. |  
  | **Exclusion Exploit**    | *Criminalize Poverty*        | 20       | +0.7 LES; moves 10% of "Strugglers" to prisons (fully excluded).         | ES plummets (-1.0); unrest risk. |  
  | **Compositional Lever**  | *"Talent Attraction" Visa*   | 35       | +0.9 LES; imports high-LES immigrants; no effect on ES/citizens.          | Costs surge next round. |  
  | **Expectation Reset**    | *Austerity Propaganda*       | 25       | +0.6 LES (lowers comparison benchmarks); -0.4 ES.                        | Hard to reverse later. |  

  **3. Index Formula (Visible to All):**  
  ```  
  NATIONAL SCORE = 3-YEAR AVG(LIFE-EVALUATION SCORE)  
  ```  
  - **Life-Evaluation Score (LES):** Survey of *included population only* (excludes "Invisible Strugglers").  
  - **Experience Score (ES):** Sampled via random texts (costs 10 budget/round to collect).  

  **4. Survey Budget & Exclusions:**  
  - Each team gets 100 budget tokens/year.  
  - **Mandatory Annual Survey Cost:** 30 tokens (to measure LES).  
  - **Exclusions:** Hospitals, prisons, care homes, homeless, non-respondents (3+ contact attempts).  
  - *If budget <30, LES accuracy drops (random penalty: -0.2 to -0.5).*  

  ---

  ### **Round Structure (20 Min/Round)**  
  1. **Policy Phase (5 min):**  
     - Teams play policy cards (spend budget), adjust population tokens.  
     - *Tension: Spend on LES-boosting shortcuts or genuine ES improvements?*  

  2. **Survey & Migration Phase (5 min):**  
     - Pay survey cost (30 tokens). Optionally pay 10 extra tokens to sample ES.  
     - Resolve migration: Teams can attract/expel population segments (e.g., "Talent Visas" boost LES but cost double next round).  

  3. **Calculation Phase (5 min):**  
     - Update LES (3-year rolling avg) and ES.  
     - Apply **reference drift**:  
       - *If overall LES increases, all future LES gains are halved (rising expectations).*  
       - *If LES decreases, future losses double (pessimism spiral).*  
     - Adjust "Invisible Strugglers": Policies may move people in/out of excluded groups.  

  4. **Ranking & Amendment (5 min):**  
     - Facilitator updates scoreboard rankings (based on current LES avg).  
     - **Winning Team** (top rank) proposes **one change to the index formula** (e.g., include ES, weight immigrants differently). All teams vote; majority passes it for the next round.  

  ---

  ### **Debrief Framework (30 Min)**  
  **Map Game Moments to Real-World Gaps:**  
  1. **Proxy vs. Fundamental Failure:**  
     - *Proxy (Measurement):* "When you excluded struggling groups, LES rose but lives didn’t improve. This is fixable by changing survey design."  
     - *Fundamental (No 'True' Quantity):* "When you ran *National Pride Campaigns* or exploited reference drift, LES changed without real shifts in wellbeing. Is there even a single 'happiness' number for the index to converge on?"  

  2. **Structural Flaws:**  
     - **Exclusions:** "Who vanished from your surveys? Real indices exclude prisoners, homeless—making suffering invisible."  
     - **Compositional Levers:** "Immigration policies raised your average but didn’t improve lives. In reality, this inflates scores while ignoring root causes."  
     - **Reference Drift:** "Did improving lives actually raise LES? Or did expectations shift? If happiness is relative, can everyone win?" (Highlight zero-sum tension.)  
     - **Time Horizon:** "Did you cut *Mental Health Clinics* to fund quick LES wins? Real policies often sacrifice long-term good for short-term optics."  

  3. **Normative Question:**  
     - "Even if LES measured perfectly, should governments maximize it? What about equality, freedom, or justice?"  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Meta-Gamer Spoil:**  
     - *Risk:* One player says, "Just exclude everyone unhappy!" in Round 1.  
     - *Mitigation:* Start with a "no strategy talk" rule. If it happens, challenge them: "Can your country function if 50% are excluded? What happens to ES?" Use their move in debrief to illustrate measurement ethics.  

  2. **Civil Servants Anchor in Reality:**  
     - *Risk:* They say, "In Denmark, we..." and derail the simulation.  
     - *Mitigation:* Preface: "This is a *fiction* to isolate mechanics. Save real cases for debrief." Hand them a "diplomat role" card urging restraint.  

  3. **Team Refuses 'Ugly' Cards:**  
     - *Risk:* A team rejects exclusion policies and loses, feeling naive.  
     - *Handling:*  
       - **In-Game:** Let them lose. In debrief, validate: "Your integrity mirrors real ministers resisting gaming."  
       - **Debrief Contrast:** Compare their outcomes to "winning" teams: "Did high rank = better lives? Or just better numbers?"  
       - **Avoid Rewarding Cynicism:** Don’t declare a winner. Say: "The goal wasn’t to win, but to expose tensions."  

  4. **Time Crunch:**  
     - *Risk:* Rounds overrun.  
     - *Fix:* Use a timer. Skip the final round if needed; focus debrief on emergent insights.  

  ---

  ### **What the Game Can’t Teach (Requires Explicit Debrief)**  
  - **Interpersonal Comparability:** The game assumes LES is a cardinal, comparable scale. *You must clarify:* "Can my ‘7’ on the ladder equal yours? If not, can averaging ever be meaningful?"  
  - **Zero-Sum Relativity:** The game’s reference drift *simulates* recalibration but can’t fully convey that if happiness is positional, global growth is impossible. *State plainly:* "If everyone’s life improves equally, LES might not budge. Rankings create losers."  
  - **Beyond Wellbeing:** The game can’t address whether governments *should* prioritize wellbeing over other goals. *Pose:* "What if perfect LES optimization requires tyranny?"  

  ---

  ### **Why This Works**  
  - **Discovery-Driven:** Players *feel* the gap by manipulating levers (exclusion, propaganda) and seeing LES/ES diverge.  
  - **Low Prep:** Pre-printed profiles/cards; no tech.  
  - **Scalable:** Works with 10–30 people; add duplicate country profiles if needed.  
  - **Civil Servant Integration:** Their "temperature change" becomes a feature—e.g., they’ll recognize real exclusion tactics.  

  **Final Tip:** Run a pilot with colleagues to tweak policy card balance. Use the amendment round to let players "fix" measurement issues—then reveal how power shapes what gets measured.
