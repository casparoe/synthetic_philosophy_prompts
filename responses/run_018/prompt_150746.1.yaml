prompt: |-
  I've just had this exhausting argument with my mate about whether there's ever really just one right answer to anything metaphyscial or moral. He kept banging on about Jain anekāntavāda — that idea every claim is only partly true and you've got to hold all sides at once — and I realised I don't actually understand how it's meant to work in practise, not just as a vague "everyone's right" thing. Anyway, I'm putting together a short interview for my uni's philosophy blog, and I've lined up a guest who defends anekāntavāda but applies it specifically to ethical reasoning in clinical triage — like, when you've got limited ICU beds and every stakeholder claims a different "truth" about who should live. I want about eight questions that don't just let him restate the view. I need one that presses him on how the seven-fold predication avoids collapsing into contradiction when two sides literally deny each other in a life-or-death call; then a follow-up for when he says they're just speaking from different standpoints — what stops that being a cop-out? Another should ask how the doctrine handles a case where a patient's family insists on treatment the medical team regards as harmful, and whether saying "both are partly true" actually resolves the conflict or just freezes action. I also want a question on the standard objection that many-sidedness makes moral progress impossible — if every view is already partly correct, why change anything? — with a follow-up for the reply that progress is just shifting emphasis among sides. And one about whether the doctrine can even accomodate a genuinely new ethical framework that hasn't been articulated before, or if it's just cataloguing existing perspectives. Keep it casual, I'm writing this on my phone and definately misspelt a couple words.
