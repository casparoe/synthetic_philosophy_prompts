answer: |-
  The gender-equality paradox presents a compelling conceptual challenge: **as societies achieve greater *structural* equality (equal rights, access, education), occupational gender segregation often *increases*, not decreases.** Resolving this requires precisely the separation you propose – distinguishing **Structural Opportunity Equality** from **Preference-Autonomy Equality** – and recognizing the role of **non-coercive social signalling** in high-trust environments.

  Here's a conceptual map avoiding the nature/culture trap and clarifying the equality dimensions:

  1.  **Defining the Two Dimensions of Equality:**
      *   **Structural Opportunity Equality (SOE):** Measured by indices like the GII or GGGI. This encompasses:
          *   Legal/political rights (voting, property, bodily autonomy)
          *   Equal access to education & healthcare
          *   Formal labor market access & anti-discrimination laws
          *   Basic economic security/safety nets.
          *   *What it guarantees:* Freedom from *material/legal coercion* forcing individuals into roles based on gender. It removes *barriers* to choice.
      *   **Preference-Autonomy Equality (PAE):** A less easily measured dimension focusing on the *social/cultural environment* for choice. It requires:
          *   Absence of strong *normative pressure* (explicit or implicit) channeling individuals toward gender-typical paths.
          *   Genuine social acceptance and value for non-traditional choices (e.g., male nurses, female engineers).
          *   Low stigma or status penalty for counter-stereotypical choices.
          *   *What it enables:* Freedom to express preferences *without* significant social cost or identity conflict. It removes *distortions* to preference revelation.

  2.  **The Paradox Mechanism: Separating Dimensions & Introducing Social Signalling:**
      *   **High SOE (Achieved):** Basic needs are met, economic coercion is low, legal barriers are removed. Individuals have genuine material security and formal options.
      *   **Low/Moderate PAE (Persists):** Gendered norms, expectations, identity associations, and status hierarchies remain influential, even if unspoken. Stereotypes about "male"/"female" traits, interests, and suitable roles persist culturally.
      *   **Reduced Economic Distortion:** Under scarcity/low SOE, individuals often prioritize survival/security over intrinsic preference or identity fit ("I need *any* job" or "This is the only job available to people like me"). High SOE lifts this distortion.
      *   **Amplified Social Signalling:** With basic security assured, choices become *more* expressive of identity, values, belonging, and perceived status. Career choices become potent signals:
          *   **Identity Confirmation:** Choosing a field associated with one's gender group reinforces a sense of belonging and authentic self. (e.g., "Being a nurse feels like expressing my caring nature as a woman").
          *   **Status & Peer Coordination:** Fields retain gendered status associations (even subtly). Choosing within the traditional gender lane can offer smoother social integration, peer acceptance, and avoidance of potential status penalties or friction. It reduces coordination costs within social groups.
          *   **Reduced Cognitive Load:** Following a well-trodden, socially validated path is cognitively easier than constantly navigating counter-stereotypical territory and potential micro-interactions or identity negotiations.

  3.  **Reinterpreting the Paradox:**
      The observed increase in segregation in high-SOE societies isn't necessarily the revelation of "pure innate preferences" nor proof of "residual socialization" as a deterministic force. Instead:
      *   **It's the revelation of preferences *expressed under conditions of high SOE but persistent normative landscapes*.** Preferences are always formed and expressed within a social context. High SOE removes *material* constraints, allowing preferences *shaped* by existing (though perhaps less coercive) social norms and identity structures to be expressed *more freely*.
      *   **Social Signalling Becomes Salient:** When the urgent need for *any* job recedes, the *meaning* of the job (its identity fit, its social signalling value, its alignment with internalized norms) becomes relatively *more* important in decision-making. Gendered sorting is amplified because the *social costs* of deviating might feel higher in a context where material necessity no longer justifies it.
      *   **Scarcity Masked Sorting:** In low-SOE societies, economic coercion *suppressed* the full expression of gendered preferences/signalling. People (especially women) might have entered non-traditional fields out of necessity, masking underlying normative preferences or social pressures. High SOE removes this mask.

  4.  **What Kind of Equality is Being Measured (and What Isn't)?**
      *   **Measured:** Primarily **Structural Opportunity Equality (SOE)** via indices focusing on laws, access, education, health, and basic economic participation. *These metrics are necessary but insufficient for achieving full gender parity in outcomes.*
      *   **Not Measured (Adequately):**
          *   **Preference-Autonomy Equality (PAE):** The depth and pervasiveness of implicit biases, normative pressures, identity associations with roles, and the *social cost* of non-traditional choices.
          *   **The Content of Preferences:** Whether preferences are "innate" or deeply socialized is less critical here than acknowledging they are *expressed* within a specific social context that high SOE doesn't automatically erase.
          *   **Non-Coercive Social Mechanisms:** The power of identity signalling, peer coordination, and status maintenance operating freely when material constraints are lifted.

  5.  **Resolving the Tension: A Two-Dimensional View:**
      The paradox arises because we (and the indices) mistakenly assume high SOE *implies* high PAE. It doesn't.
      *   **High SOE + Low PAE:** Creates the conditions for the paradox – freedom from material coercion allows gendered social signalling and identity-based sorting to operate *more powerfully*, increasing segregation. (The observed case).
      *   **High SOE + High PAE:** Would be the ideal state for reducing segregation. Here, genuine freedom from *both* material barriers *and* strong normative pressures/status penalties allows individuals to explore and choose based on a wider range of aptitudes and interests less constrained by gender identity signalling. Segregation should decrease.
      *   **Low SOE:** Suppresses choice expression through material necessity, making segregation patterns less reflective of underlying preferences or social norms and more reflective of constrained options and survival strategies.

  **Conclusion:**

  The gender-equality paradox highlights that **formal opportunity is not the same as a neutral choice environment.** High-trust, low-coercion societies don't reveal "pure" preferences; they reveal preferences expressed in a context where **social signalling** (identity affirmation, status, peer coordination) becomes a *primary* driver of choice once material survival is secured. The amplification of gendered sorting occurs because **Preference-Autonomy Equality lags behind Structural Opportunity Equality.** The paradox isn't about nature vs. nurture; it's about the **interplay between material security and the persistent power of non-coercive social norms and identity structures** in shaping life choices when individuals have the freedom to prioritize them. Reducing segregation further requires tackling PAE: actively challenging gendered norms, valuing diverse paths equally, and reducing the social costs of non-traditional choices.
