prompt: |-
  I am a journalist covering science and ideas, currently reporting on how philosophy departments are redesigning assessments to reward conceptual reasoning over memorization. For my feature, I need an original exam question—together with a model answer and a marking scheme—for an upper-level seminar in practical reason. The topic is whether honoring sunk costs is always irrational, but the prompt must not be answerable by reciting the standard economic formulation of the fallacy. To achieve that, please build the question around a specific conceptual tension that is not typically covered in introductory texts: the clash between “allocative rationality,” which holds that past investments are irrelevant to the rational evaluation of future options, and “project-embedded commitment,” in which an agent’s long-term practical identity is partly constituted by the very project now facing failure, so that abandoning it would not merely waste resources but would undermine the coherence of the agent’s diachronic self. Use a concrete scenario: a multi-decade international scientific collaboration that has built an elaborate theoretical framework now confronted with systematically disconfirming evidence, where withdrawal would dissolve not only funding structures but the shared normative identity of the research collective. Please write: (1) the exam question itself, specifying that students should answer in about 800 words within 90 minutes, and instructing them to argue whether honoring the sunk costs in this case can be rational without collapsing into the fallacy; (2) a model answer of roughly 600 words that diagnoses exactly where the standard fallacy argument succeeds, where it fails to address constitutive commitment, and under what conditions project-embedded commitment becomes self-undermining rather than rational; and (3) a marking scheme out of 25 points that identifies the specific moves an A-level answer must contain—such as distinguishing emotional attachment from practical identity, showing why diachronic consistency differs from mere persistence, and locating the precise boundary at which commitment turns into irrational escalation—while also listing the common errors that should cost marks, for instance conflating collective identity with group loyalty or treating all long-term investments as structurally identical. The difficulty should arise from the conceptual crux, not from obscurity or citation requirements; do not ask for bibliographies, reading lists, or named theorists.
reasoning: |-
  We are creating an exam question for an upper-level seminar in practical reason. The topic is the rationality of honoring sunk costs in the context of a clash between "allocative rationality" and "project-embedded commitment". The scenario is a multi-decade international scientific collaboration facing disconfirming evidence.

  (1) Exam Question:

  **Question: The Rationality of Project Commitment in the Face of Sunk Costs**

  In the context of a multi-decade international scientific collaboration (e.g., a theoretical physics consortium that has developed an elaborate framework now confronted with systematically disconfirming evidence), consider the following:

  The standard economic account of the sunk cost fallacy holds that past investments (time, money, effort) should not influence the rational evaluation of future options. However, some philosophers argue that abandoning a long-term project may not only waste resources but also undermine the practical identity of the agents involved, because their commitment to the project is constitutive of their diachronic self and collective identity. This view, sometimes called "project-embedded commitment," suggests that honoring sunk costs might sometimes be rational without collapsing into the fallacy.

  Write an essay of approximately 800 words (to be completed in 90 minutes) that addresses the following:

  - Can honoring the sunk costs in this scientific collaboration be rational without collapsing into the sunk cost fallacy? 
  - In your answer, you must:
      a) Explain where the standard fallacy argument correctly applies to the case.
      b) Identify and explain how the concept of project-embedded commitment (as a constitutive element of the agents' practical identity and collective normative identity) might provide a rational justification for continuing the project despite the disconfirming evidence.
      c) Discuss the conditions under which such project-embedded commitment becomes self-undermining rather than rational (i.e., when does it cross the line into irrational escalation?).

  Your argument should be grounded in the conceptual tension between allocative rationality (which ignores sunk costs) and project-embedded commitment. Avoid relying on emotional or psychological factors (e.g., "loss aversion" or "pride") as the primary justification; instead, focus on the philosophical structure of practical reason and identity.

  (2) Model Answer (approximately 600 words):

  **Model Answer:**

  The question of whether honoring sunk costs can be rational in the face of disconfirming evidence requires navigating a fundamental tension in practical reason. On one hand, allocative rationality demands that we evaluate future options solely on their prospective costs and benefits, rendering sunk costs irrelevant. On the other, project-embedded commitment recognizes that some investments are not merely external resources but are constitutive of the agents' practical identity over time. In the case of a multi-decade scientific collaboration, this tension becomes acute.

  The standard sunk cost fallacy argument correctly applies to the extent that the collaboration's past investments—billions in funding, decades of researchers' careers, and institutional capital—are indeed irrelevant to the *epistemic* evaluation of the theoretical framework. If the theory is systematically disconfirmed by evidence, continuing to fund and pursue it because of these past investments would be irrational from an allocative perspective. The resources saved by terminating the project could be reallocated to more promising research, and persisting merely because of sunk costs would indeed be a fallacy.

  However, the standard argument fails to address the role of the project in constituting the practical identity of the research collective. The collaboration is not just a funding stream but a shared normative identity: a community bound by common goals, methods, and a history of mutual commitment. Abandoning the project would not merely reallocate resources; it would dissolve the collective's identity. For individual researchers, their life's work has been embedded in this project, making it a core part of their practical identity—their sense of who they are and what they stand for as scientists. Thus, continuing the project might be rational as a way of preserving the coherence of their diachronic selves and the collective.

  This project-embedded commitment, however, must meet specific conditions to remain rational. First, the commitment must be grounded in the project's intrinsic value and its role in constituting identity, not merely in emotional attachment or aversion to loss. Second, there must be a possibility of *transformative re-evaluation*: the project might be revised to address the disconfirming evidence without abandoning its core identity-constituting elements. For example, the collaboration might shift its focus to explain the anomalies or develop a successor framework that preserves the collective's core methodological commitments.

  The line between rational commitment and irrational escalation is crossed when the project persists despite evidence that the constitutive elements of the identity are no longer tenable. If the disconfirming evidence undermines the very foundations of the theoretical framework (e.g., showing its core assumptions are false) and no plausible path for revision exists, then continuing the project becomes self-undermining. At this point, the commitment destroys the rationality it seeks to preserve: the collective's identity becomes based on a delusion, and the researchers' practical identities become incoherent because they are tied to a project that is objectively untenable. Moreover, if the project consumes resources that could sustain the collective in a new form (e.g., by pivoting to a related but distinct research program), then the commitment becomes irrational because it prevents the collective from evolving and maintaining its identity in a new, viable project.

  In conclusion, honoring sunk costs can be rational when the project is constitutive of practical identity, but only if there remains a viable path for the project to evolve and if abandonment would cause a disproportionate loss of identity coherence. The standard fallacy argument correctly identifies the irrationality of allocating resources based on past losses, but it overlooks the rationality of preserving a coherent self and collective over time. The challenge is to recognize when commitment becomes an irrational denial of reality, thereby undermining the very identity it aims to sustain.

  (3) Marking Scheme (out of 25 points):

  **Marking Scheme:**

  An A-level answer (21-25 points) will demonstrate a clear grasp of the conceptual tension and provide a well-structured argument that covers all required elements. The following are the specific moves and elements that must be present for full marks, along with common errors to avoid.

  **Key Moves for High Marks (each worth up to 5 points, distributed across the criteria):**

  1. **Clear explanation of the standard sunk cost fallacy argument as applied to the scenario (up to 5 points):**
     - Correctly explains that sunk costs (past investments) are irrelevant to future decisions and that continuing based on them alone is irrational.
     - Applies this to the scientific collaboration: the disconfirming evidence means the project has poor future prospects, so allocative rationality dictates termination.

  2. **Articulation of project-embedded commitment and its rational justification (up to 10 points):**
     - Defines project-embedded commitment as constitutive of the agents' practical identity (both individual and collective) over time.
     - Explains that abandoning the project would undermine the diachronic coherence of the self/collective, not just waste resources.
     - Distinguishes this from emotional attachment (e.g., pride, loss aversion) by grounding it in the structure of practical identity and normative commitments.
     - Argues that, under this view, honoring sunk costs can be rational because it preserves identity coherence.

  3. **Conditions for rational commitment vs. irrational escalation (up to 10 points):**
     - Identifies the boundary: when the project can no longer be sustained without self-deception or when it prevents the formation of a new, viable identity.
     - Discusses the importance of the possibility of transformative re-evaluation (e.g., revising the project to address the disconfirming evidence while retaining core identity-constituting elements).
     - Explains that when the project's foundational assumptions are irreparably undermined and no such re-evaluation is possible, commitment becomes irrational escalation.

  **Common Errors (each error may cost 2-5 points depending on severity and pervasiveness):**

  - **Conflating collective identity with group loyalty or emotional attachment:** If the answer reduces project-embedded commitment to psychological factors (e.g., "they feel loyal" or "they are attached") without addressing the constitutive role in practical identity, deduct up to 5 points.
  - **Failing to distinguish diachronic consistency from mere persistence:** If the answer does not explain how project-embedded commitment is about maintaining a coherent practical identity over time (which requires more than just sticking to a project), deduct up to 3 points.
  - **Treating all long-term investments as structurally identical:** If the answer does not specify why this project is identity-constituting (as opposed to any project with sunk costs), deduct up to 3 points.
  - **Ignoring the standard fallacy argument:** If the answer does not engage with the allocative rationality perspective or fails to show where it applies, deduct up to 5 points.
  - **Vagueness on the boundary between rational commitment and irrational escalation:** If the answer does not clearly articulate the conditions under which commitment becomes irrational, deduct up to 5 points.

  **Overall Structure and Clarity (up to 5 points):**
  - The essay is well-organized, with a clear thesis and logical flow.
  - Arguments are presented with precision and without unnecessary jargon.

  **Note:** The total points are 25. The key moves (1, 2, 3) are the primary focus and should make up the bulk of the points. The overall structure and clarity are also important, but they are integrated into the evaluation of the key moves. The common errors are to be penalized in the relevant sections.

  This marking scheme rewards depth of conceptual analysis and penalizes common misunderstandings, ensuring that students must engage with the unique philosophical tension at the heart of the question.
answer: |-
  ### Exam Question: Practical Reason Seminar  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 800 words  
  **Total Marks:** 25  

  **Scenario:**  
  The *Einstein-Cartan Consortium* (ECC) is a 40-year international physics collaboration. It developed the "Unified Field Theory of Torsion" (UFT-T), which promised to reconcile quantum mechanics and gravity. The ECC has absorbed $2 billion in funding, trained generations of physicists, and built a shared identity around methodological rigor and epistemic daring. Recently, the *Event Horizon Telescope* delivered systematic evidence contradicting UFT-T’s core predictions. Abandoning UFT-T would disband the ECC, dissolve its funding, and fragment its community. Continuing would require costly revisions with low probability of success.  

  **Question:**  
  Can honoring the sunk costs invested in the ECC be rational *without* collapsing into the sunk cost fallacy? In your answer:  
  1. **Diagnose the limits of allocative rationality:** Explain where the standard sunk cost fallacy argument (that only future costs/benefits matter) *correctly* applies to the ECC case.  
  2. **Analyze project-embedded commitment:** Argue how abandoning UFT-T might undermine the *constitutive practical identity* of ECC researchers, making persistence rational to preserve diachronic self-coherence. Distinguish this from emotional attachment.  
  3. **Establish boundaries for rationality:** Identify the precise conditions under which project-embedded commitment becomes *irrational escalation* (e.g., when it destroys the identity it aims to protect).  

  Ground your analysis in the tension between allocative rationality (ignoring sunk costs) and project-embedded commitment (sustaining identity). Avoid psychological explanations (e.g., "loss aversion"); focus on conceptual structure.  

  ---

  ### Model Answer (Approx. 600 words)  

  The ECC’s dilemma pits two modes of practical reason against each other: *allocative rationality*, which evaluates choices solely by future outcomes, and *project-embedded commitment*, where a project constitutes agents’ identities. While allocative rationality rightly condemns most sunk-cost honoring as fallacious, the ECC case reveals a deeper structure of rationality that may justify persistence—provided commitment remains dynamically coherent.  

  **1. Where allocative rationality succeeds:**  
  Allocative rationality demands that decisions ignore sunk costs, focusing only on marginal future costs and benefits. Applied to the ECC, this is compelling: UFT-T’s disconfirmation implies low probability of future epistemic returns. Persisting solely because of past investments ($2 billion, decades of labor) *would* commit the sunk cost fallacy—diverting resources from promising alternatives (e.g., quantum computing) toward a failing project. Rational reallocation requires "cutting losses," as the past cannot be recovered.  

  **2. Where project-embedded commitment justifies rationality:**  
  However, allocative rationality fails to address how projects like the ECC shape *practical identity*. For ECC researchers, UFT-T is not merely a tool but a *constitutive endeavor*: their shared norms (e.g., "revolutionary conservatism"), skills, and mutual accountability define their scientific selves. Abandoning UFT-T would not just waste resources; it would fragment the diachronic coherence of their identity, reducing decades of work to a disconnected series of tasks. This is not emotional attachment (e.g., pride in past achievements) but a structural feature of agency: identity requires *continuity* between past commitments and future action. Honoring sunk costs here is rational if:  
  - The project’s *core identity-constituting elements* (e.g., commitment to gravitational unification) can survive revision (e.g., UFT-T modified to incorporate new data).  
  - Withdrawal would cause *disproportionate identity damage* (e.g., losing the collaborative ethos enabling high-risk science).  

  **3. When commitment becomes irrational:**  
  Project-embedded commitment collapses into irrationality when it undermines the identity it preserves. Three conditions mark this boundary:  
  - **Loss of constitutive viability:** If disconfirming evidence invalidates the project’s *foundational principles* (e.g., UFT-T’s torsion premise is proven impossible), persistence turns self-destructive. Researchers become "identity fossils," clinging to coherence that no longer exists.  
  - **Suppression of self-correction:** When commitment silences internal critique (e.g., ECC leaders dismissing anomalies as "noise"), it corrodes the rational norms integral to scientific identity.  
  - **Resource entrapment:** If redirecting funds could sustain a *reconstituted identity* (e.g., pivoting to dark-matter research while retaining the ECC’s collaborative core), but leaders refuse, commitment becomes mere stubbornness.  

  In the ECC’s case, honoring sunk costs is rational *only* if UFT-T can be adaptively revised without betraying its identity-constituting aims. Should evidence prove irreconcilable, allocative rationality must prevail—not because identity is irrelevant, but because irrational escalation would *dissolve* the rational self it seeks to protect.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A-Level Answers (21–25 points)** must execute all core analytical moves while avoiding common pitfalls.  

  #### Key Moves and Points Allocation:  
  1. **Diagnosis of allocative rationality’s validity (5 points):**  
     - Clearly states sunk costs are irrelevant to future outcomes under allocative rationality (2 points).  
     - Correctly applies this to ECC: persisting *solely* due to past investment is irrational (3 points).  

  2. **Defense of project-embedded commitment (8 points):**  
     - Defines the ECC as *constitutive* of researchers’ practical identity (e.g., shared norms, skills, and long-term goals) (3 points).  
     - Explains how abandonment undermines *diachronic self-coherence* (not just emotional loss) (3 points).  
     - Distinguishes identity-constitution from psychological factors (e.g., "loyalty" or "pride") (2 points).  

  3. **Boundary between rationality and escalation (8 points):**  
     - Identifies when commitment destroys identity (e.g., foundational principles falsified) (3 points).  
     - Explains how suppressing dissent or rejecting adaptive revision turns rational commitment into irrationality (3 points).  
     - Contrasts "dynamic coherence" (revising while preserving identity) vs. "mere persistence" (2 points).  

  4. **Structure and Precision (4 points):**  
     - Logically organized argument; avoids tangential examples (2 points).  
     - Concise definitions of key concepts (e.g., "diachronic self") without jargon (2 points).  

  #### Common Errors (deduct 2–4 points per occurrence):  
  - **Conflation of identity with group loyalty:** Arguing persistence is rational because "scientists feel loyal to the ECC" (emotional) instead of "the ECC defines their practical rationality" (constitutive).  
  - **Equating all long-term projects:** Treating the ECC’s identity-forming role as identical to any sunk-cost-laden endeavor (e.g., "all 40-year projects merit persistence").  
  - **Boundary vagueness:** Failing to specify *when* commitment becomes irrational (e.g., not addressing falsification of core principles).  
  - **Over-reliance on allocative rationality:** Ignoring identity arguments or reducing them to "fallacy" without engagement.  
  - **Straw-manning:** Misrepresenting project-embedded commitment as "always irrational" or "always rational."  

  **Note:** Award partial credit where concepts are partially grasped. Top marks require synthesizing all three sections into a unified thesis about rationality’s dual structure.  

  ---  
  This assessment rewards nuanced conceptual reasoning, demanding students wrestle with rationality beyond textbook fallacies. The model answer and marking scheme prioritize clarity and philosophical depth over citation or obscurity.
