  The rotation pattern is crucial. It ensures that recurring words create a cyclical feel, mirroring how grief resurfaces despite attempts to dismiss it through technical terms like "server" or "code." For example, "wound" keeps coming back even when surrounded by technical terms, emphasizing the persistence of harm. 

  Now, the scenario: A player loses access to their dead partner's voice memo due to a glitch. The server is live, but the file is corrupted—no backup exists. The harm is unique because it's tied to a virtual object that's both present (on the server) and inaccessible. This challenges traditional views of reality and harm. Is the memo "real"? Is the grief over its loss "real" harm? The poem must explore this tension without resolving it.

  Key elements to weave in:
  - **Virtual ontology concepts**: The voice memo as a digital artifact, its existence tied to server states and code. Corruption isn't deletion; the data exists but is unreadable—like a locked diary.
  - **Emotional weight**: The memo is the last trace of the partner's voice. Its inaccessibility compounds grief, making the virtual harm tangible.
  - **Philosophical conflict**: Dismissal ("it's just code") vs. reassertion ("but the wound is real"). The rotation should mirror this push-and-pull.

  Brainstorming the rotation's philosophical impact:
  - "Grief" and "wound" will often follow technical words ("server," "code"), forcing a juxtaposition. E.g., when "code" ends a stanza, the next starts with "grief"—highlighting how emotion intrudes on logic.
  - In the envoi, all six words converge, leaving the tension open. No resolution, just coexistence: the "wound" persists even as the "server" hums.

  Writing approach:
  - **Voice**: First-person, raw and introspective. The player is a philosopher-poet, so blend technical terms ("corrupted slot") with lyrical grief ("ghost-voice").
  - **Imagery**: Use virtual world metaphors—avatars as shells, servers as tombs, code as both prison and promise. Avoid clichés; make it niche-accurate (e.g., "inventory slot," "buffer overflow").
  - **Envoi**: Three lines packing all six words. End ambiguously—maybe the server "holds" the grief but doesn't resolve it. No neat answers.

  Potential pitfalls to avoid:
  - **Over-explaining**: Don't lecture; show through imagery. E.g., "the server farms blink on" implies ongoing life/death cycles.
  - **Generic grief**: Anchor it in the virtual context. The memo isn't just lost; it's "trapped," echoing digital purgatory.
  - **Resolution**: The seminar debate stays open. The envoi should feel unresolved, like a looping error message.

  Finally, ensure virtual ontology folks won't cringe: 
  - Avoid misusing terms. "Corrupted slot" is precise; data isn't "deleted" but unrenderable.
  - Harm's ambiguity is key—it's not "in your head," but not physical either. The poem must sit in that liminal space.
