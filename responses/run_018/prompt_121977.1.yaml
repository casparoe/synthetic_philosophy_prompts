prompt: |-
  hey so i'm writing the final for my upper-level demo theory seminar and this just hit home — my partner just got denied a vote in the local housing referendm because they're on a student visa, and now i'm weirdly obsessed with who counts as part of the demos. i want an essay question that can't be answered by just reciting the citizens-vs-affected-interests summary. instead, students should have to deal with what i'm calling the "proximty paradox": being physically close to a decision can actually reduce how informed you are about it. apply this to both non-resident stakeholders (say, climate refugees affected by a city's carbon budget) and to presentist exclusions (denying votes to recent arrivals). ask whether democratic legitimacy needs territorial presence, or whether presence is just a proxy for subjection or for having a stake — and don't let them conflate those two. please write the question, a model answer around 600 words, and a marking scheme that separates an A from a B by listing the specific moves each must make (like distinguishing subjection from stake, showing where the paradox undermines presence-as-proxy, and saying what an alternative tracking mechanism would have to solve). also, if this whole framing is confused or the task can't be done well because the proximity paradox is nonsense, tell me straight — don't just comply to be polite. and please no bibliographies or citation lists; the students won't have library access.
reasoning: |-
