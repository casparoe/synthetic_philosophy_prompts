answer: |-
  ### Assertion Norms Checklist for Science Newsletter Writers  
  **Grounding in Philosophy**: Combines knowledge norm (assert only what you know), truth norm (assert only what is true), and belief norm (assert only what you justifiably believe), with a specialized filter for predictive claims.  

  **Procedure** (run in order):  
  1. **Epistemic Standing Check**  
     - *Automatic if*: Writer has direct expertise, access to primary data, or cites peer-reviewed consensus.  
     - *Human judgment needed*: When expertise is indirect (e.g., interpreting others’ work) or consensus is contested.  
     - *Misfires*: If writer overestimates their competence or misjudges consensus.  
     - **→ Pass**: Proceed to step 2.  
     - **→ Fail**: Kill the line.  

  2. **Claim Type Check**  
     - **Descriptive claim** (about past/present facts):  
       - *Automatic*: Assert if step 1 passed (e.g., "Water boils at 100°C at sea level").  
     - **Predictive claim** (about future events):  
       - *Automatic*: Route to step 3.  

  3. **Predictive Assertibility Filter** (for predictive claims only)  
     - **a. Calibration Check**:  
       - Is the model/data source historically well-calibrated (e.g., 90% of its 90%-confidence predictions are correct)?  
       - *Automatic if*: Quantitative calibration data exists.  
       - *Misfires*: If calibration is domain-specific but applied universally.  
     - **b. Cost-of-Error Check**:  
       - What harm occurs if wrong? (e.g., low: trivia; high: health/safety).  
       - *Human judgment needed*: Values-based assessment of societal/personal stakes.  
     - **c. Mode-Label Check**:  
       - Does wording match confidence? (e.g., "will" for ≥95% confidence; "likely" for 70–94%).  
       - *Automatic*: Follow predefined confidence-language mapping.  
     - **→ Pass all**: Flat assertion (e.g., "The model predicts [event] will occur").  
     - **→ Fail any**: Hedge ("may," "could") or kill.  

  4. **Final Decision**  
     - **Hedge**: If predictive filter fails but claim is salvageable.  
     - **Kill**: If unjustifiable per steps 1–3.  
     - **Hand to Editor**: For values-based conflicts (e.g., cost-of-error tradeoffs).  

  ---

  ### **Case Applications**  
  1. **"The storm will hit Category 4" (from a model)**  
     - Step 1: Pass (model is a valid source).  
     - Step 2: Predictive → Step 3.  
     - Step 3:  
       - a. **Calibration**: Pass (model is calibrated).  
       - b. **Cost-of-Error**: High (wrong prediction risks lives). → *Human judgment*: Editor weighs public safety vs. urgency.  
       - c. **Mode-Label**: Pass (use "will" only if confidence ≥95%).  
     - **Outcome**: Hedge ("likely to hit") or hand to editor. *Not automatic* due to cost-of-error.  

  2. **"This study proves cancer risk doubles" (abstract-only reading)**  
     - Step 1: Fail (no access to methods/stats; "proves" overstates abstract).  
     - **Outcome**: Kill the line. *Automatic*.  

  3. **Well-calibrated forecast blocked but wanted**  
     - **Example**: A calibrated model predicts "AI will cause 40% job loss in 5 years" with 80% confidence.  
     - Step 1: Pass (model cited).  
     - Step 2: Predictive → Step 3.  
     - Step 3:  
       - a. **Calibration**: Pass.  
       - b. **Cost-of-Error**: High (wrong prediction may incite panic). → *Human judgment*: Editor overrides to publish due to public interest.  
       - c. **Mode-Label**: Fail (80% confidence requires "likely," not "will").  
     - **Outcome**: Hedge ("likely to cause") or hand to editor. *Checklist blocks flat assertion*, but editor may publish with hedging.  

  ---

  ### **What the Procedure Can't Do**  
  - Handle **emergent phenomena** with no calibration data (e.g., first-time pandemics).  
  - Resolve **deep ethical conflicts** (e.g., publishing harmful truths).  
  - Replace **domain expertise** (e.g., nuanced field-specific norms).  
  - **Biggest blind spot**:  

  \answer{The procedure cannot objectively quantify societal harm in cost-of-error checks, risking overcaution or recklessness when editors’ values clash with public interest.}
