  **Scene 1:**  
  Eli stood frozen in the meat aisle's fluorescent glare, his worn harvest ledger open on the cart handle, comparing the price per pound of the shrink-wrapped beef chuck and the chicken breasts nestled in their polystyrene trays. The low thrum of the freezer cases vibrated underfoot as he scribbled numbers, factoring in corn and soy acres needed per calorie.

  **Scene 2:**  
  His pen scratched across the crumpled paper, tallying not just the steer or the broiler chicken, but the estimated field mice, voles, and insects displaced or poisoned cultivating their feed grain. He frowned; chicken, less efficient per pound, demanded significantly more acreage.

  **Scene 3:**  
  The ledger’s final column showed a clear winner: fewer total 'suffering-years' for the beef, thanks to less land ravaged. Eli exhaled, letting the chicken package slide back onto its chilly shelf as he reached for the heavier red tray of beef.

  **Scene 4:**  
  His fingers brushed the plastic film over the marbled meat, but his eyes snagged on the ledger's core assumption: one neatly inked number representing a year of a chicken's clucking, scratching life held the same weight as a year of a field mouse's frantic scurrying underground.

  **Scene 5:**  
  The freezer's hum seemed suddenly louder, more insistent. Eli looked at the beef, then back at the pale chicken breasts, the simple numbers on his page blurring; slowly, deliberately, he placed both packages back under the harsh, unblinking lights.
