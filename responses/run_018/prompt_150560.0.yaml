answer: |-
  Your query cuts to the heart of a timeless tension in biographical art: the conflict between inspirational idealization and instructive realism. Examining *Gandhi* (1982) through Plutarch's *Parallel Lives* and the lens of synkrisis reveals how the film navigates this tension, ultimately prioritizing accessible exemplarity over complex moral realism, with significant pedagogical trade-offs.

  **1. Plutarchan Synkrisis vs. Cinematic Hagiography: Contrasting Pedagogical Strategies**
  Plutarch’s method hinges on **comparative judgment (synkrisis)**, not imitation. By pairing figures like Alexander and Caesar, he highlights:
  -   **Virtue in Context:** How similar traits (ambition, courage) manifest differently based on character and circumstance.
  -   **The Specter of Failure:** How flaws (hubris, cruelty) undermine greatness, making vice palpable and cautionary.
  -   **Active Moral Reasoning:** Readers *judge* parallels and contrasts, discerning ethical principles from embodied examples.
  Plutarch assumes moral growth comes from analyzing the *interplay* of virtue and vice, success and failure.

  *Gandhi*, conversely, employs **cinematic hagiography**:
  -   **Omission as Idealism:** The elision of Gandhi’s early racial views (e.g., advocating for Indian superiority over Africans in South Africa) and the complex, often exploitative dynamics of his brahmacharya experiments removes moral ambiguity. This creates a streamlined "Great Soul" narrative.
  -   **Visual Canonization:** Attenborough’s framing (vast funeral opening, saintly close-ups, soft-lit asceticism) visually codes Gandhi as transcendent moral icon, not a fallible human. The narrative structure progresses linearly from awakening to martyrdom, echoing religious hagiography.
  -   **Simplified Antagonism:** Moral complexity is largely externalized onto British colonialism (General Dyer, partition negotiators) or internal Indian conflict (Jinnah, later Hindu extremists). Gandhi embodies unwavering principle against these forces.

  **2. Does Sanitization Undermine Moral Instruction? The Pedagogical Trade-off**
  *   **Undermines Plutarchan Realism:** By omitting significant flaws and moral struggles, the film:
      *   **Impoverishes Synkrisis:** It offers a monolithic exemplar, reducing the potential for comparative judgment *within* Gandhi's own life. How did his early prejudices evolve? How did his rigid idealism impact personal relationships? Without these contrasts, the lesson risks becoming "be like this perfect figure" rather than "discern the complexities of principled action."
      *   **Diminishes Honest Struggle:** Real moral growth often involves grappling with failure and contradiction. Omitting Gandhi's controversial choices sanitizes the arduous, messy reality of ethical commitment, potentially making it seem unattainably pure.
      *   **Risk of Uncritical Emulation:** A flawless portrait invites passive imitation, not active judgment. Plutarch feared this, using flaws to warn against blind hero-worship.

  *   **Serves Accessible Pedagogy:** However, the sanitization arguably enables a different kind of instruction:
      *   **Clarity of Principle:** By focusing on satyagraha (truth-force), non-violence, and courage against oppression, the film crystallizes core ethical ideals with immense power. The sheer *visibility* of non-violent resistance on such a scale is its primary moral lesson.
      *   **Emotional Engagement & Inspiration:** The mythic portrayal fosters deep empathy and awe, motivating audiences towards the *ideals* Gandhi represents (justice, peace, courage) more effectively than a complex, flawed portrait might. It demonstrates the *potential* of radical non-violence.
      *   **Gateway to Deeper Inquiry:** For many viewers, the film serves as an accessible introduction, potentially sparking interest in the historical Gandhi's complexities later.

  **3. Implicit Synkrisis: Where *Gandhi* Invites Comparison**
  While lacking Plutarch's explicit pairings, the film *does* create implicit comparisons:
  *   **Gandhi vs. Colonial Authorities (Dyer, Smuts):** Contrasts non-violent resistance with brutal repression, highlighting the moral bankruptcy of violence and racism. This is the film's most potent synkrisis.
  *   **Gandhi vs. Jinnah:** Contrasts unifying idealism with pragmatic communalism/nationalism, showcasing the tragic consequences when principle yields to division (embodied in Partition).
  *   **Gandhi vs. His Own Followers:** Moments where followers advocate violence or lose discipline implicitly contrast their human frailty with his unwavering commitment, reinforcing his exceptionalism rather than exploring shared struggle.
  *   **Gandhi vs. Modernity/Industrialism:** His rejection of Western materialism and advocacy for village simplicity implicitly critiques modern values.

  These comparisons primarily serve to *elevate* Gandhi by contrast, rather than offer a balanced Plutarchan analysis where *both* figures' virtues and flaws illuminate universal human challenges. The comparison reinforces the hagiography.

  **4. The Hagiographic Tension: Inspiration vs. Honesty – Plutarch vs. Attenborough**
  The core tension you identify – inspiring the audience vs. providing an honest model – is navigated very differently:
  *   **Plutarch:** Prioritizes **honesty and complexity** for deeper, more critical moral instruction. He trusts his educated audience to engage in synkrisis and learn from *both* virtue and vice. Inspiration comes from understanding greatness *despite* flaws and the tangible consequences of failure.
  *   **Attenborough (Gandhi):** Prioritizes **accessible inspiration and mythic resonance**. He aims for broad emotional impact and the propagation of Gandhi's core *ideals* (non-violence, anti-colonialism, simple living). Honest complexity is sacrificed to make the exemplar universally relatable and morally unambiguous. The pedagogical goal is motivation towards the *ideals*, not a nuanced understanding of the *man* as a model for personal ethical navigation.

  **5. What Gandhi Reveals: The Necessity of Failure for Genuine Moral Instruction**
  The case of *Gandhi* strongly suggests that **biography loses significant instructive power when it omits its subject's failures and moral ambiguities**:
  *   **Failure Humanizes and Relatability:** Flaws make the exemplar human, showing ethical principles are forged in struggle, not inherited as perfection. This makes emulation *possible* ("If he stumbled but persisted, perhaps I can too").
  *   **Failure Enables Synkrisis:** Internal contradictions (e.g., Gandhi's rigid idealism conflicting with human relationships, his evolving views on race) are the fertile ground for comparative judgment and deeper ethical reflection. Without them, the portrait is static.
  *   **Failure Teaches Discernment:** As philosopher Linda Zagzebski argues (*Exemplarist Moral Theory*), we learn virtue not just by seeing it succeed, but by understanding how easily it can be corrupted or misapplied. Plutarch’s inclusion of failures serves this crucial function; *Gandhi*'s omissions avoid it.
  *   **Honesty Builds Trust:** Modern audiences are skeptical of hagiography. Omitting known controversies undermines the biography's credibility as moral instruction, potentially leading to disillusionment upon discovering the "real" story.

  **Conclusion:**
  Richard Attenborough’s *Gandhi* is a powerful work of cinematic hagiography that prioritizes inspirational accessibility and the clear articulation of Gandhi’s core ideals (non-violence, anti-colonial resistance) over Plutarchan complexity. Its sanitization, while making the exemplar more immediately inspiring and the ethical principles starkly clear, fundamentally undermines its value as deep moral instruction in the Plutarchan mold. By omitting significant flaws and moral struggles, the film sacrifices the opportunity for genuine synkrisis, critical judgment, and a relatable exploration of how virtue is forged amidst human frailty. While it succeeds brilliantly as an emotional catalyst and an introduction to Gandhi's *ideals*, it fails to provide the honest, complex portrait necessary for audiences to truly learn *from* his life – warts and all – how to navigate their own moral challenges. Plutarch’s insistence on presenting both virtue and failure, inviting comparison and judgment, remains the more robust model for biography aspiring to be genuinely instructive. The *Gandhi* case reveals that while sanitized exemplars can inspire, only honest biographies that embrace failure can truly teach us how to live.
