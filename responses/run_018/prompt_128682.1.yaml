  User’s clearly deep in this literature—phrasing must respect that while staying podcast-accessible. I’ll avoid jargon but signal philosophical touchstones: Parfit on personal identity, Williams on projects, maybe Frankfurt on caring. Each question should feel like turning a screw: tighter and tighter. 

