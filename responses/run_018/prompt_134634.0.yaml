  I'm in year 12 and we've just finished an A-level philosophy unit on truth where the teacher only mentioned deflationary theories in passing. I got a bit obsessed with that example where saying 'it is true that snow is white' doesn't really add anything over just 'snow is white', but then if truth is totally redundant like that, why does it feel weird to say there's no such property at all? There's also that crack my friend pointed out — if you try to generalise something like 'everything the pope says is true' and there's no shared property being picked out, the sentence can't really do the work we want it to, especially when you compare maths claims with moral ones.

