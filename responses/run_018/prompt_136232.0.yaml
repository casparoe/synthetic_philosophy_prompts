answer: |-
  This is a brilliantly observed phenomenon—a perverse appropriation of existentialist rhetoric that turns Sartre's critical tools into weapons of evasion. There is no single established philosophical term for this specific maneuver, though it intersects with several concepts. Here's a breakdown:

  ### 1. **Proposed Term & Definition**
     - **Term:** **Inverted Bad Faith** (*Mauvaise Foi Inversée*)  
     - **Definition:** The strategic deployment of Sartrean vocabulary (radical freedom, anguish, contingency, authenticity) to reframe self-serving or harmful choices as heroic exercises of existential authenticity, thereby deflecting moral criticism by accusing critics of embodying the "spirit of seriousness" or denying freedom.

     **Confidence:** 90% (Novel coinage, but tightly fits the described pattern).

  ### 2. **Boundary Conditions & Differentiation**
     - **vs. Classic Bad Faith (Denial of Freedom):**  
       Classic bad faith involves *denying* one's freedom (e.g., "I had no choice!"). *Inverted bad faith* **performs freedom theatrically** while evading responsibility for its consequences. It exploits Sartre’s *positive* concepts (authenticity, anguish) as shields.  
       *Example:* A manager fires rivals "in anguish" rather than claiming corporate policy forced it.  
       **Confidence:** 95%.

     - **vs. Ordinary Rationalization:**  
       Rationalization offers *post hoc* justifications (e.g., "It’s better for the team"). *Inverted bad faith* weaponizes **existential metaphysics**: it frames the act as ontologically profound (an encounter with the absurd) and morally untouchable (criticism = inauthenticity).  
       *Example:* A neighbor refuses to shovel shared sidewalks, calling it a "groundless commitment to personal freedom," not just "I was busy."  
       **Confidence:** 90%.

     - **vs. Legitimate Authenticity Appeals:**  
       Authenticity requires owning choices *and* their impact on others. Sartrean freedom implies responsibility ("I am responsible for myself *and* all men"). *Inverted bad faith* **ignores intersubjectivity**, treating freedom as solipsistic.  
       *Legitimate Boundary:* If one’s "authentic" choice minimizes harm or addresses oppression (e.g., quitting a toxic job), it isn’t inverted bad faith. The latter *maximizes* harm while invoking existential purity.  
       **Confidence:** 85%.

  ### 3. **Core Mechanics of the Inversion**
     - **Step 1:** Harmful choice (prioritizing self-interest).  
     - **Step 2:** Sartrean cosplay — Performative anguish + contingency claims.  
     - **Step 3:** Accusatory flip — Critics are "inauthentic" for appealing to ethics.  
     - **Result:** Moral language is disarmed; the actor becomes the "authentic victim" of others' "seriousness."

  ### 4. **Why "Inverted Bad Faith"?**
     - **"Inverted"**: It flips Sartre’s critique *against* accountability.  
     - **"Bad Faith"**: It remains self-deception—by refusing to engage with the *content* of criticism (harm, inequality) while pretending to embrace freedom.  
     - **Nuance:** It parasitizes Sartre’s *rhetoric* while violating his ethics, which demand responsibility for the collective.

  ### 5. **Least Confident Point**  
     - **Boundary with legitimate authenticity appeals (Confidence: 75%).**  
       The line is blurriest when someone *genuinely* experiences anguish but causes harm. Key differentiators:  
       - Does the actor acknowledge the victim’s perspective?  
       - Is the harm necessary (e.g., revolutionary action) or gratuitous (power consolidation)?  
       - Is "authenticity" used to *avoid* dialogue or to *invite* it?  
       *Inverted bad faith* weaponizes anguish to silence others; authentic acts seek solidarity.

  ### 6. **Philosophical Roots & Gaps**
     - Sartre foresaw risks of "inauthentic authenticity" but didn’t systematize this inversion.  
     - Similar critiques exist: Adorno attacked existentialism’s bourgeois individualism; Foucault noted how "freedom" discourses can mask power. But no term captures this *exact* rhetorical move.  
     - **Why it works:** It hijacks Sartre’s authority while hollowing out his ethics—a masterstroke of ideological jiu-jitsu.

  ### Suggested Use & Context
  Deploy "inverted bad faith" when:
  - Freedom-talk deflects from asymmetric harm.
  - Anguish is staged to avoid accountability.
  - Critics are accused of "essentialism" for invoking fairness.

  *Example:* "Your 'authentic restructuring' displaced vulnerable employees while you perform anguish. This isn’t existential courage—it’s *inverted bad faith*."

  This term names a pervasive but elusive abuse of philosophy, empowering critics to expose the evasion beneath the jargon. If you encounter further cases, refining the boundaries would strengthen its utility.
