  ## Meridian Literary Foundation Allocation Board Decision Memorandum  
  **Re: Restructuring Proposal for Fellowship Selection Mechanism**  
  *Prepared for Thursday Vote | Date: [Current Date]*  

  ---

  ### I. RECOMMENDATION  
  **Approve the restructuring proposal as a two-year pilot program** (2025–2026 fellowship cycles), subject to the following conditions:  
  1.  **Pilot Period:** 2025–2026 cycles.  
  2.  **Sunset Clause:** Automatic expiry after 2026 unless renewed by supermajority (⅔) board vote based on evaluation against criteria below.  
  3.  **Evaluation Criteria:**  
      *   Juror feedback on feasibility of genre-agnostic assessment (structured post-deliberation survey).  
      *   Post-reveal analysis: Comparison of pre- and post-reveal juror assessments of funded portfolios.  
      *   Diversity metrics: Applicant pool economic diversity vs. awardee distribution across tiers.  
      *   Portfolio quality assessment: Independent review of funded work 18 months post-award (artistic impact, publication traction).  
  4.  **Refinements During Pilot:**  
      *   Develop clearer guidelines for "lowest resource tier" definition (e.g., income thresholds, debt burden, geographic cost-of-living adjustments).  
      *   Allow optional post-evaluation juror statements contextualizing genre challenges encountered.  

  **Implementation Timeline:**  
  *   **May 2024:** Finalize anonymization protocols & economic tier review process.  
  *   **Aug 2024:** Juror training on genre-agnostic evaluation.  
  *   **Jan 2025:** Pilot launch (2025 cycle applications).  
  *   **June 2025:** Interim review (juror feedback, process audit).  
  *   **June 2026:** Full pilot evaluation against criteria.  
  *   **Sept 2026:** Board vote on permanent adoption, modification, or discontinuation.  

  ---

  ### II. ENGAGEMENT WITH THE RAWLSIAN ARGUMENT (STRONGEST FORM)  
  The proposal compellingly adapts Rawls’ *Justice as Fairness* to literary patronage:  

  1.  **The Procedural Veil of Ignorance Analogy:** The argument that jurors operating without knowledge of an applicant’s genre or economic standing mirrors the "original position" holds significant force. Not knowing whether one is evaluating poetry, experimental fiction, or narrative nonfiction – or the creator’s material circumstances – *does* theoretically mitigate biases favoring established genres or privileging applicants with resources for advanced training/prestige networking. This promotes impartiality focused purely on the *perceived potential* or *compelling nature* of the work itself, akin to judging societal structures without knowing one’s place within them.  

  2.  **The Difference Principle Applied:** Directing greater resources to applicants in the "lowest resource tier" directly operationalizes Rawls' maxim that inequalities are just only if they benefit the least advantaged. In the literary field, systemic barriers (economic precarity, lack of access to elite institutions, geographic isolation) demonstrably hinder early career development. The proposal argues that foundational patronage should prioritize mitigating these foundational inequalities to foster a more equitable *starting point*, expanding the pool of voices able to pursue artistic excellence long-term. This positions the fellowship as an investment in *structural equity* within the literary ecosystem itself.  

  ---

  ### III. ENGAGEMENT WITH THE OPPOSITION'S STRONGEST ARGUMENT  
  The contention that this model "collapses the distinction between justice and merit, rendering the fellowship meaningless" merits serious consideration and cannot be dismissed as mere elitism. Its strength lies in a fundamental claim about the nature of artistic judgment:  

  *   **Artistic Merit is Contextual and Discursive:** Unlike the distribution of primary goods (rights, liberties, income) in Rawls' basic structure, artistic evaluation *inherently requires understanding the context of creation and the conventions of the form*. A juror evaluating a sonnet without knowing it *is* a sonnet lacks the framework to assess its mastery of form, its innovation within constraints, or its dialogue with tradition. Similarly, experimental fiction often challenges narrative norms in ways that might appear flawed or incoherent if misjudged as conventional realism. **Artistic recognition is not solely about "potential" perceived in a vacuum; it involves discerning *how* that potential is realized through craft, form, and genre-specific language.** The "veil" risks flattening these essential dimensions, potentially leading to evaluations based on a homogenized, lowest-common-denominator sense of "impact" or "accessibility," rather than genre-specific excellence or innovation.  

  *   **The Risk to the Fellowship's Purpose:** If artistic merit is intrinsically linked to form and context, anonymizing genre fundamentally alters the nature of the judgment being asked of jurors. The fellowship risks shifting from recognizing *excellence within a field* to recognizing *undifferentiated potential*, potentially diluting its meaning and prestige within the literary community. The opposition rightly fears this could undermine the fellowship’s core mission of identifying and empowering *artistically significant* voices, regardless of background, by making artistic form itself invisible.  

  ---

  ### IV. RECONCILING THE TENSION: ARTISTIC RECOGNITION VS. PROCEDURAL FAIRNESS  
  The core challenge lies in distinguishing the *knowledge required* for each goal:  

  1.  **Procedural Fairness (Veil of Ignorance) demands ignorance:** It requires suppressing knowledge of *positional* factors (genre affiliation, economic status) to ensure impartiality and prevent bias. Its goal is equitable *opportunity* based on perceived potential, judged neutrally.  
  2.  **Artistic Recognition demands contextual knowledge:** It requires understanding *form, tradition, and craft* to evaluate how effectively and innovatively an artist works *within or against* specific constraints. Its goal is identifying *achievement* and *significance* within the complex discourse of art.  

  **The pilot program is recommended precisely because it tests whether these two forms of knowledge can be sequenced or reconciled within the selection process.** Can jurors identify compelling *artistic* potential even when form is obscured? Does the subsequent reveal validate or contradict the initial judgment under the veil? The evaluation criteria are designed to probe this critical question. The pilot acknowledges the Rawlsian imperative for greater equity while rigorously testing the opposition’s valid concern about the potential erasure of essential artistic context.  

  ---

  ### V. CONCLUSION  
  The Rawlsian framework offers a powerful, ethically grounded critique of systemic inequity in literary opportunity, justifying bold structural intervention. However, the opposition correctly identifies a profound tension in applying a socio-political model of distributive justice directly to the inherently contextual act of aesthetic judgment. Neither argument can be fully refuted *a priori*.  

  **Approving the pilot program is the intellectually honest and pragmatically responsible course.** It allows the Foundation to actively explore a significant correction to structural barriers without permanently abandoning the principle that artistic recognition requires engagement with form and context. The sunset clause ensures accountability. This recommendation affirms the urgency of the Chair’s equity goals while acknowledging the senior poet’s defense of the irreducibly contextual nature of artistic merit. The pilot seeks evidence to determine if, and how, these crucial values can coexist within the fellowship’s mission.  

  **Recommended Vote: Approve the Pilot Program as Detailed.**  

  ---  
