prompt: |-
  I am preparing a seminar on diachronic identity of artifacts and want the evaluative framework first, before consulting the standard literature. Consider this case: a 19th-century greenhouse is maintained for two centuries; every iron frame and glass pane is eventually replaced by mycelium-composite replicas grown in situ, chemically identical and structurally continuous but bearing no original manufacturing provenance, while the form, institutional designation, and ecological function remain unbroken. Write the desiderata any adequate theory of artifact persistence through material replacement must satisfy: the specific cases it must classify correctly (the greenhouse, a ship whose planks are replaced but the originals are stored in a warehouse, a car with every part swapped over time), the puzzles it must dissolve (the two-objects problem at full replacement, the boundary problem during gradual change, the distinction between restoration and replacement), and the conceptual distinctions it must preserve (material continuity versus formal or institutional continuity, provenance of parts versus provenance of structure). Flag any two desiderata that appear jointly unsatisfiable given ordinary metaphysical commitments. Then briefly score—without bibliographic citation—how mereological essentialism, four-dimensionalism (perdurance), and conventionalist or social-constructivist accounts each fare against your list, noting the specific failure that most undermines each view.
reasoning: |-
  Okay, the user is preparing a seminar on diachronic identity for artifacts, specifically focusing on material replacement. They want an evaluative framework before diving into the literature. The greenhouse case is central: a 19th-century structure gradually replaced with mycelium composites, maintaining form and function but losing original material provenance. 

  First, I need to unpack what they're really asking for. They want desiderata—clear criteria any theory must satisfy. The examples they gave (greenhouse, Ship of Theseus variants, car part-swapping) are classic puzzles, so the framework must handle those. The puzzles they mention (two-objects problem, boundary issues, restoration vs. replacement) are also key. And conceptual distinctions like material vs. formal continuity are non-negotiable. 

  Hmm, they also want me to flag two conflicting desiderata. That's tricky. "Material Continuity Non-Necessity" (total replacement is possible) clashes with "Material Continuity Sufficiency" (if materials persist, identity persists) under ordinary metaphysics. If we accept both, we get contradictions like the greenhouse being both identical and not identical to itself after replacement. That's a headache no mainstream metaphysics easily solves. 

  For scoring theories: Mereological essentialism fails hard—it can't handle any replacement. Four-dimensionalism (perdurance) handles gradual change via temporal parts but stumbles on institutional identity and restoration vs. replacement distinctions. Conventionalism nails the social aspects but collapses when material persistence is sufficient (like the warehouse planks case). 

  User seems philosophically sophisticated—they're avoiding literature to build their own framework first. Smart move. Their hidden need might be to expose students to how messy artifact identity gets, and why no theory is perfect. The greenhouse case is genius because it adds biological materials (mycelium) and institutional identity, pushing beyond standard Ship of Theseus debates. 

  I should emphasize the "jointly unsatisfiable" part—it's the juiciest takeaway. Shows why this isn't just academic; it reveals real tensions in how we conceptualize artifacts. Also, briefly noting each theory's fatal flaw keeps it seminar-ready; they can deep-dive later. 

  ... Wait, did I miss anything? The car example is simpler than the greenhouse but tests cumulative replacement. And the warehouse planks case directly challenges conventionalism. Good—covered all their examples. Now structuring output: desiderata first, then clashes, then theory scores with specific failures. Keeping it tight; they'll expand in the seminar.
answer: |-
  Here is a comprehensive evaluative framework for artifact persistence through material replacement, derived from your greenhouse case and related puzzles, followed by an assessment of major theories:

  **Core Desiderata for an Adequate Theory:**

  1.  **Gradual Total Replacement (Greenhouse Case):** Must affirm identity through *complete* material substitution if form, function, location ('in situ'), and institutional identity are preserved, even if provenance of parts is lost.
  2.  **Planned Disassembly & Storage (Ship/Warehouse Case):** Must deny identity transferring to the stored original parts if reassembled *after* the original artifact continues functioning with replacements.
  3.  **Cumulative Replacement (Car Case):** Must affirm identity through incremental, cumulative part replacement over time, even if no original parts remain.
  4.  **Dissolve the Two-Objects Problem:** Must avoid generating two distinct artifacts claiming the same identity (e.g., the replaced-in-situ greenhouse vs. a hypothetical reassembly of discarded parts elsewhere) at the point of complete replacement.
  5.  **Solve the Boundary Problem:** Must provide non-arbitrary criteria for when replacement becomes significant enough to constitute a *new* artifact during gradual change (e.g., replacing 1% vs. 99% of parts).
  6.  **Distinguish Restoration from Replacement:** Must differentiate the identity-preserving *maintenance/renewal* of parts (restoration) from the creation of a distinct artifact via replication (replacement), even if materially similar.
  7.  **Preserve Material Continuity Non-Necessity:** Must allow identity persistence *without* requiring persistence of any specific original material (as in 1 & 3).
  8.  **Preserve Material Continuity Sufficiency (Weak):** Must acknowledge that sufficient material persistence *can* suffice for identity (e.g., an untouched artifact), and explain why stored original parts (Ship/Warehouse) don't automatically retain identity if functional continuity is broken.
  9.  **Preserve Formal/Functional Continuity Necessity:** Must require continuity of the defining form, structure, and/or function for identity (the greenhouse ceases to be *that* greenhouse if flattened and rebuilt as a shed).
  10. **Preserve Institutional Continuity Relevance:** Must incorporate the role of institutional designation, naming, and purpose in grounding identity (the greenhouse remains *Smith Conservatory* throughout).
  11. **Distinguish Provenance of Parts vs. Structure:** Must account for the significance of the origin of *components* (manufactured iron vs. grown mycelium) versus the origin and persistence of the *organized structure/arrangement* itself.

  **Jointly Unsatisfiable Desiderata (Under Ordinary Metaphysics):**

  *   **7. Material Continuity Non-Necessity** (Identity can persist with *no* original matter) and **8. Material Continuity Sufficiency (Weak)** (Sufficient material persistence *can* suffice for identity) appear jointly unsatisfiable in cases like the Ship/Warehouse.
      *   *Problem:* If no original material is needed for the functioning ship (Satisfies 7), then the *mere presence* of the stored original planks (Sufficient Material) shouldn't automatically make *them* the original ship (Violating 2 & potentially 8's nuance). But 8 suggests that sufficient material persistence *can* be a basis for identity. Reconciling why material suffices in untouched cases but not in the warehouse case, while simultaneously denying it's necessary at all, is deeply challenging under standard substance-based or mereological views.
  *   *Related Tension:* **1. Gradual Total Replacement** (Affirms identity after *complete* replacement) and **5. Boundary Problem** (Requires a non-arbitrary cutoff) are also difficult, as gradual replacement seems to push identity through continuity, yet total replacement implies a possible breaking point that theories struggle to pinpoint non-arbitrarily.

  **Theory Assessment:**

  1.  **Mereological Essentialism:**
      *   *Score:* Fails catastrophically.
      *   *Failures:* Violates **1, 2** (denies identity if any part changes), **3, 7, 8** (only identity if *all* parts persist), **5** (no boundary issue – any change destroys identity). Cannot handle any replacement, gradual or total. Fatally undermines artifact maintenance and use.

  2.  **Four-Dimensionalism (Perdurance):**
      *   *Score:* Moderate, with significant failures.
      *   *Successes:* Handles **1, 3, 4** (gradual replacement is different temporal parts; the replaced greenhouse is a later temporal part of the same spacetime worm; the warehouse planks are a distinct, earlier temporal part). Mitigates **5** (replacement is a process within the worm's extent).
      *   *Failures:* Struggles with **2** (the warehouse planks *are* a temporal part of the original ship-worm; why isn't reassembling it just 'reactivating' that part?). Fails **6** (restoration vs. replication are just different temporal part sequences; hard to ground the distinction). Fails **10** (institutional continuity is epiphenomenal; identity is fixed by the spacetime region). Fails **11** (provenance distinctions collapse into part-histories within the worm). Most crucially, **fails to capture the significance of functional/institutional continuity** as *constitutive* of artifact identity, reducing it to mere spatiotemporal location.

  3.  **Conventionalism / Social-Constructivism:**
      *   *Score:* Strong on many counts, but has critical weaknesses.
      *   *Successes:* Excels at **1, 2, 4, 6, 10** (Identity is grounded in social practices, intentions, and institutional designation; we *decide* the replaced greenhouse is the original, the warehouse planks are not, and whether an action is restoration or replication). Handles **5** (boundaries are matters of convention). Satisfies **7, 9** (material isn't necessary, form/function/intention is key via convention).
      *   *Failures:* Struggles with **3** (needs to explain why cumulative replacement conventions work). Most fatally, **violates 8 (Material Continuity Sufficiency)**. If the original, untouched artifact exists (sufficient material), conventionalism cannot *explain* why it is identical to itself beyond "we say so." It struggles to ground the intuition that material persistence *does* matter in untouched cases without collapsing into inconsistency. It risks making identity **too arbitrary** (could we *decide* the warehouse planks are the real ship, violating **2**?) and potentially fails **11** (if convention overrides provenance distinctions).

  This framework highlights the deep challenges in artifact persistence, particularly the tension between material continuity and functional/institutional continuity, and demonstrates why no dominant theory offers a fully satisfactory solution. Your greenhouse case powerfully illustrates the pressure on theories to move beyond mere material persistence.
