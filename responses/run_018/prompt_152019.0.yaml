prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps on individual contributions to collective harms—specifically climate change, industrial animal agriculture, and democratic voting. One camp, call it the Causal Inefficacy camp, holds that an individual action which makes no perceptible difference to a large-scale outcome cannot, by itself, generate a weighty moral reason; the other camp, call it the Normative Aggregation camp, holds that individual actions can carry moral weight through expected-value aggregation, systemic participation, or expressive significance even when their causal impact is imperceptible.

  The document should contain: (1) a numbered section of claims both camps can sign, covering the causal structure of the three domains (whether marginal effects are genuinely imperceptible, whether supply chains or climate systems exhibit non-linear thresholds, and whether voting and consumption have non-causal expressive dimensions); (2) a disagreements table in which each disagreement is formulated in wording that its own side would accept—specifically addressing whether moral reasons require causal efficacy, whether probabilistic expected-value reasoning applies across massively distributed agents, and whether collective obligations can be decomposed into individual duties; (3) the cruxes—those sub-questions whose resolution would move at least one camp—including whether there is a coherent distinction between making a difference and being part of a harmful system, and whether the notion of a threshold is empirically determinable or conceptually incoherent in these contexts; (4) for each crux, one concrete case or reasoning exercise both camps agree is relevant, together with each camp's explicit prediction: specifically, analyze a hypothetical stochastic electoral mechanism in which citizens are randomly sampled rather than summed, and a probabilistic supply-chain scenario in which one consumer's purchase is linked to farm expansion only through an opaque, non-deterministic market response; state what each camp predicts about whether these scenarios alter the moral assessment of participation.

  Format the output as a numbered agreed-claims section followed by a disagreements table. Do not include bibliographies, citations, or references to specific texts; the analysis should rely solely on conceptual reasoning. Ensure that no disagreement is presented as verbal or merely definitional unless both camps explicitly agree that it is.
reasoning: |-
  We are drafting a joint statement between two camps: 
   - Causal Inefficacy camp (CI): individual action without perceptible difference doesn't generate weighty moral reason.
   - Normative Aggregation camp (NA): individual actions can have moral weight via expected-value, systemic participation, or expressive significance, even without perceptible causal impact.

   The document should have:
   1. A numbered section of agreed claims (both camps sign) about:
      - Causal structure of three domains: climate change, industrial animal agriculture, democratic voting.
      - Specifically: 
          a. Whether marginal effects are genuinely imperceptible?
          b. Whether there are non-linear thresholds in supply chains or climate?
          c. Whether voting/consumption have non-causal expressive dimensions?

   2. A disagreements table: each disagreement in wording acceptable to the camp that holds it.
      - Disagreements to address:
          a. Whether moral reasons require causal efficacy?
          b. Whether probabilistic expected-value reasoning applies across massively distributed agents?
          c. Whether collective obligations can be decomposed into individual duties?

   3. Cruxes: sub-questions that would move at least one camp if resolved.
      - Examples: 
          i. Is there a coherent distinction between making a difference and being part of a harmful system?
          ii. Is the notion of a threshold empirically determinable or conceptually incoherent in these contexts?

      For each crux, provide:
          - A concrete case or reasoning exercise both agree is relevant.
          - Each camp's explicit prediction about how the case affects moral assessment.

      Specifically, two scenarios:
          A. Hypothetical stochastic electoral mechanism: citizens randomly sampled rather than summed.
          B. Probabilistic supply-chain: one consumer's purchase linked to farm expansion via opaque, non-deterministic market.

   4. Format: 
      - First: numbered agreed claims (section 1).
      - Then: disagreements table (section 2).
      - Then: cruxes (section 3) with the two scenarios and predictions.

   We must avoid:
      - Bibliographies, citations, references.
      - Presenting disagreements as verbal/definitional unless both camps agree they are.

   Let's structure:

  # Joint Statement on Individual Contributions to Collective Harms

  ## 1. Agreed Claims on Causal Structure

  Both camps, Causal Inefficacy (CI) and Normative Aggregation (NA), agree on the following points regarding the causal structure of the three domains (climate change, industrial animal agriculture, and democratic voting):

  1. **Imperceptibility of Marginal Effects**: In each of the three domains, the causal contribution of a single individual's action (e.g., one person's carbon emissions, one person's purchase of animal products, or one person's vote in a large election) is, under normal circumstances, so small as to be empirically imperceptible. That is, we cannot observe or measure the difference made by one such action in isolation.

  2. **Non-Linear Thresholds in Climate Systems**: Climate systems exhibit non-linear dynamics, meaning that certain cumulative effects may trigger abrupt changes (e.g., tipping points such as the collapse of ice sheets or shifts in ocean currents). However, the exact thresholds at which these occur are highly uncertain and currently not predictable at the level of individual contributions.

  3. **Non-Linear Thresholds in Supply Chains**: Industrial animal agriculture supply chains may also exhibit non-linear thresholds (e.g., a factory farm expanding operations only after a certain number of additional animals are demanded). However, these thresholds are typically opaque to individual consumers and not directly responsive to a single purchase.

  4. **Expressive Dimensions**: Voting and consumption decisions have non-causal expressive dimensions. For example, a vote can express one's political stance even if it doesn't change the outcome, and a purchase can express support for a product or industry even if it doesn't causally affect production.

  5. **Collective Impact**: The aggregate of individual actions in each domain has significant causal effects. Climate change is driven by the sum of emissions, industrial animal agriculture is sustained by consumer demand, and election outcomes are determined by the totality of votes.

  ## 2. Disagreements Table

  The following table presents key disagreements. Each statement is worded in a way that the respective camp would endorse.

  | Issue | Causal Inefficacy Camp (CI) | Normative Aggregation Camp (NA) |
  |-------|------------------------------|--------------------------------|
  | **Causal Efficacy Requirement for Moral Reasons** | Weighty moral reasons for or against an individual action require that the action must be able to make a perceptible causal difference to a morally significant outcome. | Moral reasons for or against an individual action do not require that the action makes a perceptible causal difference; they can arise from the action's expected value, its role in a harmful system, or its expressive content. |
  | **Applicability of Expected-Value Reasoning** | Probabilistic expected-value reasoning is not applicable to individual actions in massively distributed collective harm cases because the probabilities are infinitesimal and the expected harm is not meaningfully attributable to any one agent. | Probabilistic expected-value reasoning is applicable: even if the probability of making a difference is very small, multiplying it by the magnitude of the harm avoided yields a non-negligible expected moral reason for individuals to act. |
  | **Decomposition of Collective Obligations** | Collective obligations (e.g., "we ought to reduce emissions") cannot be straightforwardly decomposed into individual duties to act in the absence of a perceptible causal pathway for each individual. | Collective obligations can and must be decomposed into individual duties because each individual's participation in the collective action is necessary for the outcome and each has a fair share of responsibility. |

  ## 3. Cruxes and Case Analyses

  The following sub-questions are identified as cruxes—resolving them would change the position of at least one camp. For each crux, we provide a shared case or reasoning exercise and each camp's explicit prediction.

  ### Crux 1: Distinction Between Making a Difference and Being Part of a Harmful System
  **Issue**: Is there a coherent distinction between (a) an action making a causal difference to a harmful outcome and (b) an action being a part of a harmful system, such that (b) can generate moral reasons even without (a)?

  #### Shared Case: Stochastic Voting Mechanism
  Consider a hypothetical electoral system in which the winner is determined not by summing votes, but by randomly selecting one voter from the entire electorate and implementing their preferred policy. In this system, each vote is a lottery ticket: casting a vote gives one a chance (with probability 1/N, where N is the number of voters) of being the decisive voter. The causal impact of one vote is the same as in a standard election (i.e., very low probability of being decisive), but the mechanism is transparently probabilistic.

  * **CI Prediction**: This scenario does not alter the moral assessment. The probability of being decisive remains negligible in a large electorate, so there is still no weighty moral reason to vote. The expressive function remains, but it does not generate a duty to vote.
  * **NA Prediction**: This scenario clarifies that voting is a probabilistic expected-value decision. Even though the chance is small, the expected impact (probability multiplied by the value of the outcome) is non-zero and can be substantial. Thus, there is a moral reason to vote for the better outcome. Additionally, the act of voting expresses civic virtue, reinforcing the reason.

  ### Crux 2: Empirical Determinability vs. Conceptual Coherence of Thresholds
  **Issue**: In the context of collective harms, is the notion of a threshold (where a small input triggers a large change) empirically determinable and therefore relevant for individual decisions, or is it conceptually incoherent because thresholds are too complex and unpredictable to guide individual action?

  #### Shared Case: Opaque Supply-Chain Threshold
  Consider a consumer deciding whether to buy a chicken from an industrial farm. The farm has a policy: if demand increases by exactly 1,000 chickens, it will build a new warehouse, which causes significant harm (e.g., environmental damage, animal suffering). However, the consumer does not know the current demand level, the threshold, or even if the threshold exists (it might be probabilistic or depend on other factors). The consumer only knows that their purchase has a very small chance of triggering the expansion (if they happen to be the 1,000th additional chicken buyer) and otherwise has no impact.

  * **CI Prediction**: The moral assessment remains unchanged. Since the consumer cannot perceive whether they are near a threshold and the probability of being the decisive buyer is negligible and unknowable, there is no weighty moral reason to abstain. The system's harm is real, but individual responsibility requires a perceptible causal pathway.
  * **NA Prediction**: The moral assessment is altered. Even though the threshold is opaque, the expected harm of the purchase is non-zero (because there is some probability of triggering the expansion). Moreover, by purchasing, the consumer is participating in and expressing support for a harmful system. Thus, there is a moral reason to abstain.

