     - Q2: A (semantic)
     - Q3: B 
     - Q4: B (no, because analyst's context is what matters and she doesn't know)

  We have 6 leaves.

  Now, note that the tree structure will have:

  - At Q1=A: then we ask Q3 and then Q4. For Q3, only B is occupied (so we don't show A and C for Q3 in this branch). But the tree should still ask? We can have the full tree and then mark empty branches.

  The empty combinations:

  - Q1=A and Q3=A: Incoherent? (because if stakes don't affect knowledge, then hidden stakes shouldn't disqualify)
  - Q1=A and Q3=C: Unattractive? (if stakes don't affect, then the case should be clear)

  - For Q1=B: 
     - If Q2=A (contextualism) and Q3=A: Unattractive? (because contextualism typically says the original context matters)
     - If Q2=A and Q3=C: Unexplored? (relativism might go here, but we are not including)
     - If Q2=B (encroachment) and Q3=C: Unlikely.
     - If Q2=B and Q3=B and Q4=A: Unattractive? (why would collective matter but not hidden? they are both unknown)
     - If Q2=B and Q3=A and Q4=B: Inconsistent? (if hidden stakes matter, then collective should too)

  We also note that the tree does not separate:

  - Contextualism (leaf 3) and the unnamed leaf 6 (subject-centered contextualism) are separated by Q4. But both have Q1=B, Q2=A, Q3=B. They are separated by Q4.

  - Similarly, pragmatic encroachment (leaf 4) and awareness-dependent (leaf 5) are separated by Q3 and Q4.

  But the tree does separate them.

  We also need to flag pairs that the four questions fail to separate. In this setup, the questions separate all the leaves we have. But if there were two positions that have the same answers to all four, then we would need an extra question. In our leaves, none have the same answers.

  Finally, we note what is settled and what is contested:

  - Settled: The distinction between semantic contextualism (Q2=A) and metaphysical pragmatic encroachment (Q2=B) is a clear conceptual one.

  - Contested:
    - Whether retrospective cases are coherent: Some might argue that the hidden stakes case (Q3) is problematic (hence option C) but it's not settled.
    - Whether distributed stakes can operate without individual awareness: This is contested. Some encroachers might say only when the subject is aware, others not.
    - Also, whether there is stake-sensitivity at all (Q1) is contested.

  We'll now present the decision tree with the leaves.

  **Decision Tree for Stake-Sensitive Knowledge**

  **Start:**

  1. **Bridge Safety Case:** You casually judged a bridge safe (low stakes). Upon learning a school bus will cross (high stakes), does this retroactively change whether you *knew* the bridge was safe at the time of judgment?
     - **A: No, it only affects whether I may now assert it or other non-knowledge factors.** → Go to 2.
     - **B: Yes, it changes whether I knew then.** → Go to 3.

  2. **For those who answered A at Q1:** 
     - **Retrospective Revelation:** Years later, you discover that catastrophic hidden stakes applied when you formed a belief with moderate evidence and low-stakes assumption. Is your prior belief now...?
       - **A: Disqualified as knowledge.**
       - **B: Intact (still knowledge).**
       - **C: Incoherent to judge.**
     - Then **Distributed Stakes:** For the analyst with anonymized data and high collective stakes (unknown to her), do these stakes affect her knowledge?
       - **A: Yes.**
       - **B: No.**
     - *Combinations:*
       - If **Q3=B, Q4=B**: **Strict Invariantism** (leaf 1).
       - If **Q3=B, Q4=A**: **Role-Relative Encroachment** (hybrid) (leaf 2).
       - Other combinations (Q3=A or C) are **unnamed and likely incoherent/unattractive**.

  3. **For those who answered B at Q1:**
     - **Nature of Shift:** Is the shift in knowledge semantic (the word "knows" changes meaning) or metaphysical (stable meaning but stake-sensitive relation)?
       - **A: Semantic shift (contextualism).** → Go to 4.
       - **B: Metaphysical shift (pragmatic encroachment).** → Go to 5.

  4. **For contextualism (Q1=B, Q2=A):**
     - **Retrospective Revelation:** 
       - **A: Disqualified.**
       - **B: Intact.**
       - **C: Incoherent.**
     - Then **Distributed Stakes:**
       - **A: Yes.**
       - **B: No.**
     - *Combinations:*
       - If **Q3=B, Q4=A**: **Contextualism** (leaf 3).
       - If **Q3=B, Q4=B**: **Unnamed: Subject-Centered Contextualism** (leaf 6) — a variant where only the subject's context matters for the standards.
       - Other combinations (Q3=A or C) are **unnamed and likely unattractive for contextualism**.

  5. **For pragmatic encroachment (Q1=B, Q2=B):**
     - **Retrospective Revelation:**
       - **A: Disqualified.**
       - **B: Intact.**
       - **C: Incoherent.**
     - Then **Distributed Stakes:**
       - **A: Yes.**
       - **B: No.**
     - *Combinations:*
       - If **Q3=A, Q4=A**: **Pragmatic Encroachment** (leaf 4).
       - If **Q3=B, Q4=B**: **Awareness-Dependent Encroachment** (leaf 5) — a variant where only stakes of which the subject is aware affect knowledge.
       - Other combinations (e.g., Q3=A and Q4=B) are **unnamed and likely inconsistent**.

  **Summary of Leaves (Positions):**

  1. **Strict Invariantism**: 
     - Q1: A (no change in knowledge)
     - Q3: B (intact)
     - Q4: B (collective stakes do not affect)

  2. **Role-Relative Encroachment (Hybrid)**: 
     - Q1: A (no change for casual belief)
     - Q3: B (intact for private belief)
     - Q4: A (collective stakes affect for institutional roles)

  3. **Contextualism**: 
     - Q1: B (knowledge shifts)
     - Q2: A (semantic)
     - Q3: B (intact — knowledge in original context)
     - Q4: A (collective stakes, when known by attributor, affect)

  4. **Pragmatic Encroachment**: 
     - Q1: B (knowledge shifts)
     - Q2: B (metaphysical)
     - Q3: A (disqualified by hidden stakes)
     - Q4: A (collective stakes affect, even unknown)

  5. **Awareness-Dependent Encroachment**: 
     - Q1: B (knowledge shifts)
     - Q2: B (metaphysical)
     - Q3: B (intact — because stakes were hidden)
     - Q4: B (collective stakes do not affect — not known to subject)

  6. **Subject-Centered Contextualism (Unnamed)**: 
     - Q1: B (knowledge shifts)
     - Q2: A (semantic)
     - Q3: B (intact)
     - Q4: B (collective stakes do not affect — subject's context is what matters)

  **Notes on Gaps and Contested Issues:**

  - The gap for Q1=A and Q3=A (or C) is **incoherent** because denying stake-sensitivity in Q1 is inconsistent with having hidden stakes disqualify knowledge in Q3.
  - The gap for contextualism (Q2=A) with Q3=A is **unattractive** because contextualism typically relativizes knowledge to the context of attribution at the time, which was low.
  - The gap for pragmatic encroachment (Q2=B) with Q3=B and Q4=A is **unattractive** because it allows distributed stakes to matter but not hidden stakes in the retrospective case, which are similar.
  - The gap for pragmatic encroachment with Q3=A and Q4=B is **inconsistent** because if hidden stakes matter, distributed stakes (which are also hidden) should too.

  **Pairs Not Separated by These Questions:**

  All the positions we listed are separated by the four questions. However, note that the distinction between contextualism and pragmatic encroachment is settled by Q2, but within each, the variants (like awareness-dependent) are separated by Q3 and Q4.

  **Contested Issues in the Literature:**

  - **Settled**: The conceptual distinction between semantic contextualism (Q2=A) and metaphysical pragmatic encroachment (Q2=B) is clear.
  - **Contested**:
     - Whether retrospective cases (Q3) are coherent: Some philosophers might reject the case setup.
     - Whether distributed stakes (Q4) can affect knowledge without individual awareness: This is debated within both contextualism and encroachment.
     - The correct account of high-stakes attributions in contextualism: whether the attributor's context must be the subject's context (as in our leaf 6) is not settled.
     - The role of awareness in stakes: whether stakes must be known to the subject to affect knowledge (as in leaf 5) is contested.

  This instrument should help students sort their intuitions into a position.
answer: |-
  Below is a diagnostic sorting instrument for stake-sensitive knowledge, designed as a decision tree with concrete cases. It uses your four specified splits to force nuanced choices, avoids philosopher names, and maps onto the logical space of positions (with about six to eight terminal leaves). The tree first builds the logical space from the cases, then labels occupied positions with common names (or marks gaps). It separates settled conceptual distinctions from contested issues and flags limitations.

  ---

  ### **Diagnostic Decision Tree: Stake-Sensitive Knowledge**
  *For each case, answer based on intuition alone—ignore labels. Follow the branches to your terminal position.*

  #### **1. Bridge Safety Case**  
  You casually judge an old bridge safe (low stakes) after a quick inspection. Suddenly, you learn a school bus will cross it tomorrow (high stakes). Does this retroactively change whether you **knew** the bridge was safe at the time of your judgment?  
  - **A: No change in knowledge**—it only affects whether you may now *assert* it or act on it.  
    → Go to **Retrospective Revelation (Case 3)**.  
  - **B: Knowledge itself changes**—you didn’t actually know then, or you lose knowledge now.  
    → Go to **Nature of Shift (Case 2)**.  

  #### **2. Nature of Shift (Only if 1=B)**  
  If knowledge shifts with stakes, is this shift:  
  - **A: Semantic**—the word "knows" expresses different standards (e.g., "safe" means stricter conditions in high-stakes contexts).  
    → Go to **Retrospective Revelation (Case 3)**.  
  - **B: Metaphysical**—"knows" has a stable meaning, but the belief-relation itself is stake-sensitive (e.g., high stakes raise the evidence needed to know).  
    → Go to **Retrospective Revelation (Case 3)**.  

  #### **3. Retrospective Revelation**  
  Years ago, you formed a belief with moderate evidence (e.g., "this chemical is non-toxic") while genuinely assuming negligible stakes. You now discover catastrophic hidden stakes *always* applied (e.g., it was in a town’s water supply). Is your prior belief:  
  - **A: Disqualified**—it wasn’t knowledge then due to the hidden stakes.  
    → Go to **Distributed Stakes (Case 4)**.  
  - **B: Intact**—it was knowledge then because you reasonably assumed low stakes.  
    → Go to **Distributed Stakes (Case 4)**.  
  - **C: Incoherent**—the question is flawed; knowledge can’t be judged across contexts like this.  
    → Terminal position (see leaves).  

  #### **4. Distributed Stakes**  
  An analyst processes anonymized data (e.g., health metrics) with individually imperceptible risks. Unbeknownst to her, aggregate harm is enormous (e.g., errors will cause 1,000 deaths). Do these collective stakes affect her **knowledge**?  
  - **A: Yes**—collective stakes change whether she knows (e.g., anonymization doesn’t shield her).  
    → Terminal position.  
  - **B: No**—only stakes she knows or could reasonably anticipate matter.  
    → Terminal position.  

  ---

  ### **Terminal Positions (Leaves of the Tree)**
  *Each leaf is defined by its path through the cases. Common names are applied where they exist; gaps are diagnosed. Settled distinctions (e.g., semantic vs. metaphysical shift) are noted, but contested issues are flagged.*

  | Path (Q1 → Q2 → Q3 → Q4) | Position Name & Description                                                                 | Status in Literature                                                                                               |
  |---------------------------|---------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|
  | **A → B → A**             | **Strict Invariantism**                                                                     | Common. Denies all stake-sensitivity. Knowledge depends only on truth-relevant factors (evidence, reliability).   |
  |                           | - Knowledge unaffected by stakes (Q1=A). Hidden stakes irrelevant (Q3=B). Collective stakes irrelevant (Q4=B). | **Settled**: Core of traditional epistemology.                                                                     |
  | **A → B → B**             | **Role-Relative Encroachment (Hybrid)**                                                     | Niche/unnamed. Stake-sensitivity only in institutional roles, not private belief.                                  |
  |                           | - No shift for casual belief (Q1=A). Intact in retrospective (Q3=B). Collective stakes affect analysts (Q4=A). | **Contested**: Uncommon but coherent (e.g., some social epistemology). Noted as unexplored.                         |
  | **B → A → B → A**         | **Classic Contextualism**                                                                   | Common. "Knows" semantically shifts with the attributor’s context (Q2=A).                                          |
  |                           | - Knowledge shifts retroactively (Q1=B). Intact in retrospective (Q3=B). Collective stakes affect via attributor (Q4=A). | **Settled**: Semantic shift ≠ metaphysical. **Contested**: Whether Q4 always holds.                                |
  | **B → A → B → B**         | **Subject-Centered Contextualism (Unnamed)**                                                | Gap: Unexplored. Semantic shift (Q2=A) but analyst’s *own* context locks standards (Q4=B).                          |
  |                           | - Like classic contextualism but Q4=B. Collective stakes irrelevant if unknown to subject.  | Diagnosed: Coherent but unattractive (undermines contextualism’s social aspect). No major proponents.              |
  | **B → B → A → A**         | **Pragmatic Encroachment**                                                                  | Common. Knowledge relation is metaphysically stake-sensitive (Q2=B).                                               |
  |                           | - Knowledge shifts retroactively (Q1=B). Disqualified by hidden stakes (Q3=A). Collective stakes affect (Q4=A). | **Settled**: Metaphysical shift ≠ semantic. **Contested**: Whether hidden stakes (Q3) must be accessible.          |
  | **B → B → B → B**         | **Awareness-Dependent Encroachment (Unnamed)**                                              | Gap: Unexplored. Encroachment only with subject-aware stakes.                                                      |
  |                           | - Knowledge shifts (Q1=B, Q2=B). Intact if stakes hidden (Q3=B). Collective stakes irrelevant (Q4=B). | Diagnosed: Coherent (e.g., "reasonable avoidance" variants) but rare. Attractive to some, but not a labeled position. |
  | **B → A → C**             | **Relativist/Assessment-Sensitive (Niche)**                                                 | Rare. Semantic shift (Q2=A) but retrospective judgment is incoherent (Q3=C).                                       |
  |                           | - Rejects cross-context evaluation. Skips Q4.                                               | **Contested**: Whether Q3=C is defensible (e.g., MacFarlane-style relativism).                                     |
  | **B → B → C**             | *Unoccupied*                                                                                | Gap: Incoherent. Metaphysical shift (Q2=B) implies stable truth-conditions, so Q3=C conflicts.                     |

  ---

  ### **Gaps, Limitations, and Contested Issues**
  - **Key Gaps**:  
    - **A → A or C paths**: Incoherent. If stakes never affect knowledge (Q1=A), hidden stakes (Q3=A/C) can’t retroactively disqualify it.  
    - **B → B → B → A**: Unattractive. If hidden stakes don’t matter (Q3=B), but distributed stakes do (Q4=A), it’s inconsistent (both involve unknown stakes).  
    - **B → A → A paths**: Unattractive for contextualism. If "knows" is semantic (Q2=A), hidden stakes (Q3=A) shouldn’t override the original context.  

  - **Positions Not Separated by These Questions**:  
    - **Classic Contextualism vs. Relativism**: Both take Q1=B and Q2=A. Only separated by Q3 (B vs. C).  
      - *Requires further distinction*: Can knowledge attributions be true relative to multiple contexts simultaneously?  
    - **Strict Invariantism vs. Awareness-Dependent Encroachment**: Both take Q3=B and Q4=B. Separated by Q1 (A vs. B).  
      - *Q1 alone distinguishes them*, but if intuitions clash, add: "Does learning of high stakes *ever* change whether someone knew?"  

  - **Settled vs. Contested**:  
    - **Settled**: The semantic (contextualism) vs. metaphysical (encroachment) distinction (Q2) is conceptual bedrock. No collapse.  
    - **Genuinely Contested**:  
      - **Retrospective revelation (Q3)**: Is it coherent? Invariantists say yes; contextualists debate; encroachers split.  
      - **Distributed stakes (Q4)**: Can collective/unknown stakes affect knowledge? Central to ethics-epistemology links.  
      - **Awareness requirement**: Must stakes be *accessible* to the subject? Not resolved (affects Q3 and Q4).  

  ---

  ### **How to Use This Instrument**
  1. **For the philosophy club**: Walk through the cases sequentially, voting on each split.  
  2. **Reveal terminal positions**: Discuss why gaps exist (e.g., incoherent combinations) and contested issues.  
  3. **Encourage reflection**: Does your intuition match a named position? Why might some leaves be unoccupied?  

  This tree isolates core commitments (e.g., contextualism’s semantic flexibility vs. encroachment’s metaphysical stakes-sensitivity) while highlighting unresolved debates. It avoids presupposing consensus on hot-button issues like "contextualism-collapse" and uses cases to ground abstract distinctions.
