prompt: |-
  I'm writing an esssay for my philosophy of religion module and I'm stuck on a particular part of Hume's 'Of Miracles' — the bit where he says no testimony can ever establish a miracle, since a miracle violates the laws of nature and those laws are fixed by uniform experience. Hume compares the wise man who proportions belief to evidence, arguing that it's always more probable the witnesses are mistaken or deceiving than that nature was suspended. I tried explaining this to my flatmate over coffee but got completely tangled up.

  What I'm struggling with is the exact logical step: is he claiming miracles are literally impossible, or only that we can never rationally belive them via second-hand reports? My tutor also mentioned distributed cognition — how belief-formation in groups might differ from individual reasoning — and I'm wondering whether Hume's argument quietly assumes belief is private and individual. Does his calculus about false testimony still hold if thousands in a network report the same anomaly? Or is applying his reasoning to collective belief a misreading?

  Could you walk me through the passage's reasoning, especially that weighing-probabilities part, and say whether extending it to networked belief is fair? Please write in British English — I'm trying to match the style of my course materials.
