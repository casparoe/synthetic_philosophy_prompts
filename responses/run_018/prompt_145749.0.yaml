prompt: |-
  hey, im writing about aesthetic testimony for my coursework. so if a friend i trust tells me a song is heartbreaking, i can know its heartbreaking without hearing it, right? but then why cant i also feel heartbroken by it secondhand, like an aesthetic contagion? if testimony gives real knowledge about the art, it seems weird that the feeling gets blocked. my teacher said im mixing up epistemic deference with phenomenological access but that sounds like jargon to avoid my point. where is the actual mistake? please answer in british english. (sorry for typo, wrote 'aesthetic' as 'aestetic' lol)
