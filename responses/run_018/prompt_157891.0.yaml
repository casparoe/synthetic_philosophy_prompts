answer: |-
  Here’s a rigorous argument for why subjective immortality fails in your Wigner’s Friend quantum suicide (QS) setup, centered on decoherence, branch measure, and the fragmentation of first-person perspective:

  1.  **The Setup & Standard QS Claim:**
      *   Isolated QS: A subject (Alice) repeatedly triggers a quantum gun (e.g., spin measurement). In Everett/MWI, she only experiences branches where she survives. Her subjective continuity persists *because* dead branches contain no observer to experience discontinuity. She "always" finds herself alive.
      *   Wigner's Friend QS: Alice performs the QS experiment inside a sealed lab. Wigner (outside) treats the *entire lab* (Alice + gun + quantum system) as a quantum system. Until Wigner measures, the lab exists in superposition: `|Alice_alive>|Loaded_gun_record> + |Alice_dead>|Fired_gun_record>` (simplified). Crucially, **decoherence has occurred *inside* the lab** relative to Alice, but **not *outside* the lab** relative to Wigner.

  2.  **The Core Conflict: Two Incompatible Decoherence Histories:**
      *   **Alice's Decohered Reality (Inside):** From Alice’s perspective inside the lab, decoherence *has* happened due to interactions with the gun, environment, her own brain, etc. She experiences a definite outcome after each trigger pull. If she survives, she has a clear memory of previous survivals. Her history feels linear and continuous within her branch. She believes QS "works."
      *   **Wigner's Undecohered Reality (Outside):** For Wigner, the *entire lab* is still in superposition. Decoherence hasn't propagated to *his* environment (the rest of the universe outside the lab). **No definite outcome exists for him yet.** The superposition `|Alice_alive> + |Alice_dead>` is just as real as the original quantum state before Alice measured.

  3.  **The Measure Problem Fractures First-Person Perspective:**
      *   **Subjective Continuity Requires Branch-Localization:** Alice’s feeling of continuous survival is intrinsically tied to *her specific branch* (`|Alice_alive>...`). Her memories and consciousness are encoded in the state of that branch. The dead branch (`|Alice_dead>...`) contains no "Alice" to have any perspective.
      *   **Wigner's Measurement Forces Global Branching:** When Wigner *finally* measures the lab’s state, *decoherence occurs relative to his external environment*. This splits the universe into two *globally distinct* branches:
          *   Branch W_alive: Wigner observes a live Alice who says "I survived all shots!"
          *   Branch W_dead: Wigner observes Alice’s corpse and records showing she died.
      *   **Alice's Pre-Measurement Branch is Not Fundamental:** Critically, the "Alice_alive" branch that Alice experienced *inside* the lab *before* Wigner’s measurement **is not identical** to the global branch `Wigner_observes_lab_with_Alice_alive`. It was a *component* of the superposition Wigner measured. The global branching event **retroactively defines the possible histories** from Wigner’s external reference frame.

  4.  **Why Subjective Continuity Fails:**
      *   **Contingent Survival:** From the *global* perspective established by Wigner’s measurement, Alice’s survival is **contingent on the branch weight (measure)** of the `Alice_alive` component in the superposition he measured. If the survival amplitude is low, the `W_alive` branch has low measure. Wigner is *overwhelmingly likely* to find Alice dead.
      *   **No Guarantee of High-Measure Survival:** QS relies on the survivor *always* being in a high-measure branch *from their perspective*. But in this setup, **Alice’s internal branch perspective *is not the fundamental ontology*.** The fundamental branching happens at Wigner’s measurement. Alice’s internal experience of surviving many shots exists only *within* the component state leading to `W_alive`. If that component has low amplitude (e.g., survival requires 100 consecutive "misfires"), its *global measure* after Wigner’s decoherence is vanishingly small (`(amplitude)^100`).
      *   **Fragmentation of the "Self":** Alice’s pre-Wigner "self," experiencing survival, is not the persistent entity she assumes. It exists *only* as part of the undecorrelated superposition state relative to Wigner. **When Wigner measures and global decoherence occurs, this "self" *only persists into the future in the `W_alive` branch*.** In the vastly more probable `W_dead` branch (low measure for survival), *that specific subjective stream of Alice's consciousness ceases to exist at the moment Wigner measures and finds her dead*, even though she *felt* continuous up until that external observation. Her internal continuity was an illusion contingent on being in a component state that would later become the `W_alive` global branch upon measurement. Most potential internal continuities (those in low-weight pre-measurement states) lead to global branches where they terminate upon Wigner's observation.
      *   **The Illusion of Internal Decoherence:** Alice’s feeling of definite survival is real *for her*, but it’s like a character in a novel feeling alive before the author decides the plot. Until Wigner measures, *all* potential outcomes (Alice alive with N-survivals, Alice dead on shot 1, dead on shot 2, etc.) are still "present" in the global state. Her specific, seemingly definite history is just one thread in a tapestry that hasn't yet been finalized. Finalization happens externally, and most threads get discarded (low measure).

  5.  **Conclusion: External Frame Breaks Immortality:**
      Quantum suicide relies on the subjective observer *defining their own decoherence environment*. In an isolated setup, the survivor *is* the high-measure branch. **Introducing an external observer (Wigner) shifts the locus of fundamental decoherence *outside* the suicide experiment.** The internal "survivor" perspective becomes a *component* within a larger superposition, subject to the measure assigned *globally* when decoherence finally occurs relative to the external environment.

      **Therefore, subjective continuity *cannot* guarantee "immortality."** Alice *will* subjectively survive many shots *only if* her specific sequence of outcomes ends up in a branch with non-negligible measure *after* Wigner's decoherence event. However, for sequences requiring many improbable survivals, the measure of the branch preserving her subjective continuity becomes exponentially small. From the global perspective defined by the external frame, most potential subjective continuities (from inside the lab) terminate upon external observation. The measure problem, resolved at the level of the external observer's decoherence, shatters the illusion of persistent first-person experience guaranteed by an isolated QS setup. Survival isn't absolute; it's probabilistic and contingent on the external frame's branching weights.
