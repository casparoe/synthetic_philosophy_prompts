  The key point is the conflict between subjective experiences. If the Friend survives, they remember multiple "attempts," but for Wigner, the outcome is probabilistic. The measure problem here relates to how probability is assigned to different branches. If all branches exist equally, why does the Friend feel continuous in one branch?

  The user’s insight is that the external observer introduces a meta-perspective. When Wigner measures, the Friend's branch is determined from outside. So even if the Friend subjectively survives, Wigner might collapse the system to a dead branch. This challenges the idea that consciousness is tied only to the surviving branch.

  I need to argue that subjective continuity breaks because the first-person perspective isn't isolated. The Friend's experience depends on Wigner's observation. If Wigner sees a dead Friend, that branch has measure zero for the Friend's consciousness. But does that mean the Friend's experience stops? Or is it that the superposition of perspectives creates a disconnect?

  Also, consider the measure problem: all branches exist, but their "weight" affects probability. For the Friend, surviving branches feel continuous, but Wigner assigns probabilities based on amplitudes. If the survival amplitude is low, Wigner is unlikely to see a live Friend. But from the Friend's view, they always survive. The conflict arises when Wigner's measurement resolves the superposition—subjectively continuous for the Friend, but from outside, it's stochastic.

  The user might be hinting at a deeper issue: can subjective immortality hold when external confirmation is possible? If Wigner finds a corpse, the Friend's consciousness in that branch ceases. The multiverse doesn't preserve the Friend's perspective across all branches; it splits it. So without a privileged frame, the Friend's continuity is branch-dependent and can be invalidated externally.

  I should also address why this setup differs from solo quantum suicide. Without an external observer, the Friend only experiences survival. But with Wigner, the Friend’s outcome is entangled with Wigner's measurement. Decoherence here means once Wigner observes, the branches become classical—no coexistence. Thus, the Friend's persistence is contingent on Wigner's result.

  Potential pitfalls: Is consciousness truly branch-specific? Some interpretations like QBism might say Wigner's measurement is just updating beliefs, not altering reality. But sticking to Everettian, the split creates incompatible experiences. The user’s point about "breaks persistence" might mean that from a global view, the Friend's continuity is an illusion confined to one branch, which external observation can terminate.

