  **Commited Mingjia Scholar:**  
  Your objection presumes a shared ontological substrate between determinable and determinate—precisely the assumption we reject. When I say "white horse is not horse," I do not deny that whiteness qualifies an equine form, but insist that *what it means to be qualified* fundamentally transforms the ontological status. Consider: "horse" (馬) names a complete concept—the essential *xing* (形) of horseness, abstracted from all qualities. "White" (白) names another complete concept—the universal hue, abstracted from all substrates. Their conjunction creates not a modified horse, but a new compound entity (白馬) belonging to a third category. Just as "clay vessel" is not "clay" because vesselhood imposes a new functional essence upon the material, "white horse" is not "horse" because the imposition of whiteness generates a distinct formal unity. The error lies in treating "horse" as a persistent substrate; we hold it is merely one conceptual pole in a synthetic whole. Your colleague's determinable/determinate model smuggles in Aristotelian hylomorphism—where matter persists through formal change—but our *li* (離) doctrine asserts radical discontinuity: qualifier and qualified are co-originating and mutually exhaustive. When you point to a white horse, you point to an instance of *bai-ma*, not to an instance of *ma* bearing accidents. To call it "horse" is to commit a category error by conflating the compound with one constituent.

