  First, I must reject the determinable/determinate framework entirely as anachronistic to Mingjia thought. Gong-sun Long isn't doing predicate logic - he's doing something more radical: treating each term as carving reality at its joints independently. "Horse" names a complete essence (xing), and "white" names another complete essence (se). When combined, they don't modify but constitute a new compound essence - like chemical elements forming a compound. 

  The mistake would be thinking "white" merely specifies "horse." No - for us, specification implies shared ontological ground, but there is no such ground. "Horse" refers strictly to equine morphology without color, while "white" refers to chromatic quality without substrate. Their union creates something as distinct from "horse" as "clay vessel" is from "clay." 

  I should emphasize that ordinary language deceives us here. When people point at a white horse and call it "horse," they're committing the error of partial attribution - mistaking a component (horse-essence) for the whole (white-horse compound). But metaphysics demands precision: the compound belongs to the category of qualified-things (bai wu), not thing-simpliciter (ma). 

  And that colleague's objection about blocking? It presupposes what we deny - that "horse" could apply independently of qualifications. But for us, bare "horse" is an abstraction; concretely, all horses are colored, yet each color creates a distinct compound essence. So yes, whiteness does exhaust the instance's qualification - leaving no residue of "mere horseness." 

