  3. **Explanatory Structure**: We agree that in applied domains, theories often have explanatory aims that are tied to practical, domain-specific goals (e.g., predicting legal outcomes, diagnosing and treating illnesses, or analyzing and creating artworks). The success of a theory in these domains is measured by how well it serves these goals.

  4. **Verbal vs. Substantive Disputes**: We agree that a dispute is merely verbal when it arises solely from differences in the linguistic framework (including the meaning of quantifiers) and that such disputes can be resolved by clarifying the framework. A dispute is substantive when it involves conflicting claims about the world that are not resolved by such clarifications, such as when two theories make incompatible predictions about observable events or when they have different implications for what is fundamental.

