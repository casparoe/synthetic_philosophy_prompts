  ### Joint Statement: Applied Ontology Deflationism and Realism  
  *Following Adversarial Collaboration on Verbal Disputes and Metaontology*  

  ---

  #### I. Agreed Claims  
  The undersigned deflationist and realist affirm the following points of agreement, established through rigorous examination of case studies in law, medicine, and aesthetics:  

  1. **Ontological Commitment**:  
     - Ontological commitment is determined by the entities a theory must quantify over to be true, per Quinean criteria. However, quantifier meanings ("there exists") are not uniform across frameworks and may vary with practical, disciplinary, or conceptual goals.  

  2. **Quantifier Variance**:  
     - Apparent ontological disagreements in applied domains (e.g., law, medicine) often arise from divergent interpretations of quantifiers. Clarifying the operative framework (e.g., legal vs. physical) can resolve such disputes as verbal, revealing no substantive conflict about mind-independent reality.  

  3. **Explanatory Structure in Applied Domains**:  
     - Theories in applied domains serve domain-specific explanatory aims (e.g., predicting legal outcomes, diagnosing illnesses, analyzing artworks). Success depends on coherence, predictive accuracy, and utility within the domain, not necessarily on mirroring fundamental ontology.  

  4. **Verbal vs. Substantive Disputes**:  
     - A dispute is **verbal** if it dissolves upon:  
       (a) Precise articulation of each party’s conceptual framework and quantifier rules.  
       (b) Demonstration that both parties accept all domain-specific observations and predictions.  
     - A dispute is **substantive** if it persists after (a)–(b) and involves incompatible:  
       (c) Explanatory hypotheses about domain-invariant patterns.  
       (d) Predictions about observable outcomes (e.g., treatment efficacy, legal liability).  

  5. **Framework-Relativity of Non-Fundamental Entities**:  
     - Existence-claims about institutional entities (e.g., corporations, diseases) are framework-dependent. Their utility is judged by pragmatic virtues (e.g., simplicity, fruitfulness) within a domain, not by a "bottom-up" reduction to fundamental physics.  

  ---

  #### II. Disagreements Table  
  Residual differences are formulated below such that each party endorses the accuracy of their respective column.  

  | Issue | Deflationist Position | Realist Position |  
  |-------|------------------------|------------------|  
  | **Explanatory Success and Ontological Commitment** | Explanatory success in applied domains (e.g., law, medicine) does **not** require ontological commitment to institutional entities. Quantifying over fundamental entities (e.g., particles, individuals) suffices, as institutional "objects" are reducible to patterns of activity under a description. | Explanatory success in applied domains **requires** ontological commitment to institutional entities. Rival theories’ explanatory power (e.g., predicting corporate behavior or disease progression) is undermined if they omit quantifications over such entities, implying they track mind-independent structure. |  
  | **Framework Selection and Rational Compulsion** | Framework-selection is **never rationally compelled** by evidence. All choices are pragmatic: even the "best" framework (e.g., a disease taxonomy) is adopted for convenience, and alternatives could achieve equivalent explanatory goals with distinct quantifier rules. | Framework-selection **can be rationally compelled** by evidence. Some frameworks uniquely capture domain-invariant explanatory patterns (e.g., corporate personhood in law), making their ontological commitments inescapable for optimal prediction and explanation. |  

  ---

  #### III. Cruxes and Concrete Cases  
  Both parties identify the following unresolved cruxes. Each is paired with a case study mutually agreed to bear directly on the issue, alongside advance predictions.  

  **Crux 1: Domain-Independent Criterion of Ontological Seriousness**  
  *Question*: Is there a domain-independent criterion to distinguish "ontologically serious" commitments (reflecting mind-independent structure) from pragmatic conveniences?  
  - **Concrete Case**: Bankruptcy proceedings for a Limited Liability Company (LLC).  
    - *Scenario*: An LLC defaults on debts. Courts treat it as a "legal person" liable for obligations, distinct from shareholders.  
    - **Deflationist Prediction**: The case will show LLCs are dispensable patterns of shareholder contracts. Courts achieve identical outcomes by quantifying over individuals and agreements alone, proving no domain-independent "serious" commitment exists.  
    - **Realist Prediction**: The case will show LLCs are indispensable. Courts must quantify over the LLC itself to explain continuity during shareholder turnover and asset liquidation, revealing a domain-transcendent criterion: persistent causal-explanatory roles.  

  **Crux 2: Explanatory Redundancy for Institutional Entities**  
  *Question*: Can institutional entities be shown *in principle* explanatorily redundant across all frameworks?  
  - **Concrete Case**: Psychiatric taxonomy choice between *DSM-5* (discrete disorders) and *RDoC* (dimensional biomarkers).  
    - *Scenario*: Diagnosing Major Depressive Disorder (MDD) under *DSM-5* (commits to "MDD" as an entity) vs. *RDoC* (quantifies only over neural systems and behaviors).  
    - **Deflationist Prediction**: *RDoC* will achieve equal/explanatory parity with *DSM-5* in predicting treatment response, proving MDD’s redundancy. No unique explanatory power is lost by eliminating "disorder" quantifiers.  
    - **Realist Prediction**: *DSM-5* will retain indispensable explanatory value (e.g., comorbidity patterns, selective serotonin reuptake inhibitor efficacy) that *RDoC* cannot replicate without quantifying over "disorders," demonstrating irreducibility.  

  ---  
  **Signed**,  
  [Deflationist Representative]  
  [Realist Representative]  
