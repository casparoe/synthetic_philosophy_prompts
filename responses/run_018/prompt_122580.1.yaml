prompt: |-
  I spent a career in experimental physical chemistry — reaction kinetics, mostly, with a long detour through spectroscopy — and since retiring I have been sitting in on a cognitive science reading group. We have just finished Hofstadter and Sander's *Surfaces and Essences: Analogy as the Fuel and Fire of Thinking*, and one of the graduate students pointed me toward the structure-mapping side of the literature, where analogy is scored by how well relational structure aligns, with a principled preference for connected systems of relations over isolated object attributes. The two pictures feel to me as though they are answering different questions, and I want to know whether they are really in conflict or whether I have simply failed to see how one subsumes the other. My way in is a question about failure, because that is what I was trained on: in my old field a model that fits for the wrong reason was not a model that fit.

  Let me set out the distinction I have been toying with. Call the first failure mode *surface capture*: one or two vivid, perceptually or notationally salient features of the source seize the mapping, and the relational structure is dragged along behind them, so the analogy inherits whatever happened to hang off the striking features rather than what mattered. Call the second *structural overreach*: the relations map cleanly and even elegantly, the systematic structure lines up, and the analogy then keeps yielding confident consequences in a region where nothing licenses them, because the causal or mechanistic warrant for transporting inferences was never carried across — only the shape was. The two are meant to be independent: a mapping can be structurally faithful and inferentially empty, or superficially driven and accidentally fruitful.

  Here is my worry, and it is what I would like explained. On Hofstadter and Sander's account, as I read them, categories are not fixed in advance of the mapping; concepts slip and re-form in the act of analogizing, and to categorize is itself to make an analogy to a remembered exemplar. On the structure-mapping account there is, at least tacitly, a relational description on each side that is what it is prior to alignment, and the preference for systematic structure is what tells you which alignment to prefer. If the first picture is right, my two failure modes may be unstable: what I want to call surface capture might just be the source concepts slipping under pressure from the target, which on their view is not a defect but the normal mechanism; and what I want to call structural overreach might be, for them, an analogy simply going through, since there is no fixed correct representation against which to say it went too far. So the question is whether the categorization-as-analogy picture has the resources to say that an analogy *misfires* without helping itself to exactly the fixed representation it denies — and, if it does not, whether that is a genuine explanatory gap or merely the price of a theory that refuses to grade analogies except after the fact.

  To make it concrete, take the case I know best historically: reasoning about heat engines by analogy with a fluid falling between two levels, the water-wheel picture that Carnot used and that survives in the way every physicist still talks about heat flow. There is no conserved heat substance, so the mechanistic warrant for the picture is absent; yet that reasoning delivered the right result about the maximum efficiency of an engine depending only on the temperatures of the two reservoirs and not on the working substance. I would like you to explain how each of the two accounts diagnoses this, and then tell me which of my two failure modes it instantiates — or whether the right answer is that it is not a failure at all, because at the right level of coarse-grained description the extracted essence really is the potential-difference-drives-a-flow structure, and the inference was licensed after all. Crucially, I also want the discriminating test: which features of the case would have to be different for it to fall into the other category, so that the taxonomy is doing real work rather than redescribing whatever happened.

  Please write this for someone fluent in thermodynamics and new to cognitive science: explain the machinery you rely on, and do not spend words on references, further reading, or bibliographic suggestions — I can get those myself. Roughly eight hundred to a thousand words. Conclude with a single machine-readable label as the last line of your reply, and nothing after it:

  \answer{surface-capture} if the case is best described as a salient surface feature dictating the mapping; \answer{structural-overreach} if it is best described as relational structure carried over without causal warrant; \answer{both} if it is genuinely and non-trivially both; \answer{neither} if neither fits, in which case your positive diagnosis belongs in the prose above.
reasoning: |-
  Okay, let me tackle this query from a retired physical chemist moving into cognitive science. The user is grappling with two frameworks for analogy: Hofstadter/Sander's fluid categorization versus structure-mapping's systematic alignment. Their core concern is whether analogical "failure modes" hold up if categories aren't fixed.

  First, I need to unpack their two failure modes: 
  - Surface capture (salient features dragging irrelevant structure)
  - Structural overreach (relations mapping cleanly but overextending)

  The Carnot heat engine/water wheel example is perfect for testing this. Historically, it worked despite wrong mechanistic assumptions about heat as a fluid. 

  For structure-mapping: 
  This would score the analogy highly because potential-difference-drives-flow relational structure aligns beautifully (temperature difference : height difference, heat flow : water flow). The systematicity principle favors this deep relational match over surface errors like "heat substance." But this is precisely structural overreach - the causal mechanism was wrong, yet inferences held.

  For Hofstadter/Sander: 
  Here's the interesting pivot. For them, Carnot wasn't wrong but abstracting to the essential "differential-drives-flow" category. The "heat substance" concept slipped under pressure from the hydraulic analogy, forming a new conceptual blend. What looks like overreach is actually successful categorization at a higher grain. Surface features didn't capture; they catalyzed reconceptualization.

  So why isn't this surface capture? Because the vivid hydraulic features weren't arbitrary hooks - they scaffolded abstraction to relational essence. And why isn't it overreach? Because the inference (efficiency depends only on delta-T) was licensed by that very abstraction.

  Discriminating test: 
  - If Carnot had fixated on water's wetness or color (true surface capture), efficiency conclusions would fail. 
  - If he'd mapped turbine design details (structural overreach), he'd get incorrect mechanical specifics.

  The case lands in neither failure box. It's a third thing: fluid analogies enabling abstraction precisely because they surrender surface details to isolate relational cores. 

  Final label: neither. The power came from dynamic recategorization, not rigid mapping or fixed concepts.
answer: |-
  Your question cuts to the heart of a tension between analogical frameworks. Let's diagnose Carnot's heat engine/water wheel analogy through both lenses, then test your failure modes.

  ### Structure-Mapping Account
  - **Mechanism**: Pre-aligned relational structures exist (e.g., hydraulic systems: *height difference* → *drives flow* → *performs work*). Analogy scores high when:  
    (1) Relations map 1:1 (e.g., temperature difference : height difference; heat flow : water flow; work output : wheel rotation).  
    (2) Higher-order relations bind them (e.g., *causally influences*, *proportional to*).  
    (3) Attributes (e.g., "water" or "caloric") are discarded if unmapped.  
  - **Carnot Diagnosis**: This analogy scores exceptionally high. The core relational structure—*potential difference drives flow to extract work*—aligns perfectly. Systematicity prefers this deep relational match over surface errors (e.g., heat-as-substance). **Failure mode: Structural overreach**. The elegant relational mapping licenses inferences (e.g., efficiency depends *only* on temperature difference) that correctly follow from the structure but lack mechanistic warrant—heat isn't conserved, and entropy isn't modeled. The "shape" of the relations worked, but the physical grounding was flawed.

  ### Hofstadter-Sander Account
  - **Mechanism**: Concepts aren't fixed; analogies *reform* categories by highlighting essences. Carnot doesn't "map" pre-existing concepts but *creates* a new conceptual blend: "whatever has a flow driven by potential difference." Salient surface features (water, wheels) are springboards for abstraction.  
  - **Carnot Diagnosis**: No failure here. The vivid hydraulic imagery ("water wheel") isn't parasitic—it *enables* extraction of the essential relational skeleton (*differential → flow → work*). The "caloric" misconception is a surface residue that gets sloughed off as the essence crystallizes. The analogy succeeded *because* it ignored mechanistic details (molecular kinetics) and focused on coarse-grained relational truth. Efficiency conclusions *were* licensed by the abstracted essence.

  ### Why Your Failure Modes Don't Fully Fit
  1. **Surface Capture?**  
     - Not here. While water wheels are perceptually vivid, they didn't "dictate" irrelevant attributes. Instead, they scaffolded abstraction: Carnot discarded water's wetness/weight but kept *potential-driven flow*. Hofstadter-Sander would argue this is categorization *working as intended*—salient features catalyze essence extraction.  
     - **Discriminating Test**: If Carnot had fixated on water's *cooling effect* or *turbulence* and incorrectly inferred engines must cool reservoirs or have chaotic flow, *that* would be surface capture. The analogy escapes this by shedding attributes.  

  2. **Structural Overreach?**  
     - Structure-mapping sees overreach; Hofstadter-Sander does not. For the latter, the relational structure *is* the causal warrant at the chosen grain. The "overreach" critique assumes a "correct" mechanistic level (e.g., molecular collisions), but Hofstadter-Sander deny fixed categories. If the essence (*potential difference → work*) holds across domains, the inference is valid.  
     - **Discriminating Test**: If Carnot had mapped the *gear ratios* of water wheels to heat engines and predicted optimal piston sizes from temperature ratios, *that* would be structural overreach—importing relations unjustified by the essence. But he didn't; he stayed at the abstract causal level.

  ### Resolution
  The accounts answer different questions:  
  - Structure-mapping asks, "Given fixed representations, which alignment best preserves relational truth?" It flags Carnot's mechanistic gap as overreach.  
  - Hofstadter-Sander ask, "How does analogizing *create* concepts?" They see Carnot's analogy as successful category formation—the "fluid" essence validly licenses efficiency inferences *because* it ignores lower-order mechanisms.  

  Your taxonomy assumes stable pre-analytic concepts. Hofstadter-Sander reject this, so they *can* diagnose misfires (e.g., if an analogy fixates on irrelevances like color or emotional valence) but only *after* the conceptual blend stabilizes. Carnot's case isn't a misfire for them; it's exemplary of how surface impressions fuel deep abstraction. The heat-flow analogy "worked" because thermodynamics *is* a potential theory at its core—the relational essence was sound, even if the ontology was wrong.

  \answer{neither}
