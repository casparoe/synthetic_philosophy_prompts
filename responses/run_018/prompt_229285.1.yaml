prompt: |-
  I edit the science desk of a mid-sized general-interest magazine, and roughly once a week someone pitches us an evolutionary-psychology story: why we evolved to love gossip, why women are supposedly better at remembering where the fruit is, why teenagers take risks, that sort of thing. Some of it is serious science and some of it is a pub anecdote wearing a lab coat, and at the pitch meeting I have about ten minutes per pitch and no statistics training to lean on.

  What I'd like is a decision procedure I can actually run at the meeting, grounded in whatever the philosophy of biology and the just-so-stories debate have produced that is genuinely usable by a non-specialist. By that I mean things like: the distinction between a trait being an adaptation, a byproduct of some other adaptation (what Gould and Lewontin called a spandrel), or just drift; whether the proposed explanation makes any specific risky prediction or just redescribes the observation in the language of the Pleistocene; what the comparative and cross-cultural evidence would have to look like; and what would count as evidence against the claim, given that 'it helped our ancestors on the savanna' seems to fit absolutely anything.

  Concretely, give me:

  1. The questions to ask, in order, with what counts as a passing answer to each and which answers should kill the pitch on the spot.
  2. A way to handle the very common case where the underlying finding is real and replicated but the evolutionary gloss is doing all the work -- is that a green light, a kill, or a 'run the finding, cut the gloss'?
  3. The points where the procedure has to hand the call back to me because it's a judgement about what our readers need, not a question the method can settle.

  Then run the procedure on three invented pitches so I can see it working:

  a) A researcher claims that women's interest in true-crime content is an evolved predator- and threat-monitoring adaptation, on the basis of a survey of podcast listeners.
  b) A well-powered cross-cultural study (thirty-odd countries, decent methods) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.
  c) A journalist wants to argue that open-plan offices fail because our hunter-gatherer brains can't cope with them.

  Please include at least one verdict I won't enjoy (I've got a soft spot for a good evolutionary yarn, and the procedure shouldn't care). And be honest at the end about what a checklist like this can't catch -- where a plausible-sounding story gets through anyway.
reasoning: |-
  Okay, the user is an editor at a science desk for a general-interest magazine. They're constantly pitched evolutionary psychology stories and need a reliable way to filter out the weak ones. They want a decision procedure based on philosophy of biology concepts, but practical enough for a non-specialist with limited time. 

  Hmm, the core tension here is between scientific rigor and editorial practicality. The user needs something that catches bad evopsych without requiring a PhD in biology. They're clearly frustrated by "pub anecdotes in lab coats" – that phrase alone tells me they've seen too many just-so stories. 

  First, I should structure this as a clear flowchart-like Q&A. The key is to start with the deadliest questions upfront to save time. Gould/Lewontin's adaptation vs spandrel distinction is crucial, but how to make it operational? Maybe lead with falsifiability – if there's no conceivable counterevidence, it's probably pseudoscience. 

  For the comparative evidence question, I recall David Buller's work – real evolutionary hypotheses require cross-species and cross-cultural testing. If the pitch can't suggest what that would look like, red flag. Also must include the "Risky Prediction" test from Popper. 

  The tricky part is handling legit findings with speculative gloss. The user probably sees this most often. Need to emphasize that correlation ≠ evolutionary causation. Maybe suggest a "run finding, cut gloss" option with specific framing language. 

  For the invented pitches: 
  - The true-crime one fails spectacularly (no comparative evidence, unfalsifiable) 
  - The occupational preferences study might have solid data but the "evolved=fixed" leap is garbage genetics 
  - The open-plan office pitch is the fun one – it's probably wrong but culturally resonant, so judgment call 

  Biggest gap in any checklist: plausible mechanism stories. Like that Sapolsky example about male aggression – sounds logical but completely wrong. Should warn the user that some BS will always slip through. 

  ...Wait, the user asked for at least one verdict they won't enjoy. They admit liking good evolutionary yarns. That's thoughtful – better make sure the true-crime takedown is extra thorough. No favoritism allowed.
answer: |-
  Here's a practical decision procedure grounded in evolutionary biology philosophy, designed for speed and usability by a non-specialist. It prioritizes falsifiability, evidence standards, and common evo-psych pitfalls.

  **The Evolutionary Psychology Pitch Filter: A 10-Minute Checklist**

  **Core Principle:** Assume every evolutionary explanation is a *hypothesis*, not a fact. Demand evidence beyond "it makes sense."

  **Questions to Ask (In Order) & Kill Criteria:**

  1.  **"What specific, testable, and *risky* prediction does this evolutionary hypothesis make that a non-evolutionary explanation wouldn't?"**
      *   **Pass:** Prediction is *specific* (e.g., "This trait will show earlier development in girls than boys," "Species with similar social structures will show convergent evolution on this trait," "This behavior will increase under specific environmental cues X"), *testable* (could be proven false with data), and *risky* (if false, it would seriously damage the hypothesis).
      *   **Kill:** Vague prediction ("It helped survival"), untestable prediction, or no prediction beyond redescribing the observation in evolutionary terms ("Women like true crime *because* it was adaptive for threat detection"). **This is the most common kill point.**

  2.  **"What direct evidence links this trait to increased survival/reproduction *in ancestral environments*?"**
      *   **Pass:** Fossil/ancient DNA evidence, archaeological evidence, strong evidence from modern hunter-gatherer analogs showing the trait *directly* impacts fitness *in that context*, or compelling comparative anatomy/physiology.
      *   **Kill:** Only modern surveys, lab studies on modern populations without ancestral context, or pure speculation ("Surely knowing about threats was helpful"). **Absence of direct ancestral evidence is common, proceed cautiously.**

  3.  **"What are plausible alternative explanations (spandrel, byproduct, drift, modern cultural learning)?" AND "What evidence *specifically rules these out* or makes the adaptation hypothesis stronger?"**
      *   **Pass:** Authors have seriously considered major alternatives (e.g., "Is this a byproduct of general threat detection/anxiety systems?" "Could this be entirely learned from culture/media?") and provide evidence *against* them or *for* the adaptation explanation being superior.
      *   **Kill:** Alternatives dismissed without evidence or not considered. Hypothesis presented as the *only* possible explanation.

  4.  **"What does the comparative evidence (across species, especially primates) show? Is the trait universal in humans? What does cross-cultural evidence show?"**
      *   **Pass:** Evidence of the trait (or its proposed underlying mechanism) in related species supports evolutionary roots. Evidence of universality across diverse human cultures (especially isolated ones) supports biological underpinnings. *Crucially, the pattern of variation (or lack thereof) aligns with the hypothesis.*
      *   **Kill:** Trait is absent in closely related species without explanation. Trait shows huge, culturally patterned variation inconsistent with a strong evolved module (e.g., occupational preferences varying massively with gender equality indices). **Major cross-cultural variation inconsistent with a 'fixed' adaptation is a kill point.** Lack of comparative data is a yellow flag.

  5.  **"What would count as evidence *against* this specific evolutionary hypothesis?"**
      *   **Pass:** Clear, specific answer based on the risky prediction (e.g., "If men showed equal or higher interest under similar conditions," "If the trait didn't correlate with actual threat-avoidance outcomes," "If it emerged very recently with media").
      *   **Kill:** Vague answer, no answer, or evidence that should disprove it exists but is dismissed ("Well, evolution is complex...").

  **Handling "Solid Finding, Sketchy Gloss" (Question 2):**

  *   **This is usually a "Run the Finding, Cut the Gloss."**
  *   **Why?** The underlying finding (e.g., sex difference in X, preference for Y) might be robust and interesting *on its own*. The evolutionary story is often speculative icing.
  *   **Action:** Frame the article around the *empirical finding* and the *current scientific debate* about its origins. Present the evo-psych hypothesis as *one possible interpretation among others* (cultural, developmental, social), explicitly noting the strength of evidence for each. Headline and lede should focus on the finding, not the Pleistocene. **Kill the pitch if it *only* presents the evo-psych gloss as fact.**

  **Points Requiring Editorial Judgment:**

  1.  **"Is this topic genuinely important/interesting to our readers *regardless* of the evolutionary angle?"** (If no, kill. Don't run weak science just because it's "evo-psych").
  2.  **"Even if the evo-psych hypothesis is weak, is the underlying finding so novel/significant that it warrants coverage *without* the gloss?"** (See above).
  3.  **"Does presenting this hypothesis, even cautiously, risk reinforcing harmful stereotypes or determinist views without sufficient evidence?"** (Requires sensitivity to the specific claim and its social implications).
  4.  **"Is the evo-psych angle the *only* hook, or can we find a stronger, better-supported angle for this story?"**

  ---

  **Applying the Filter to Sample Pitches:**

  **a) Women's True-Crime Interest = Evolved Threat Detection (Survey-based)**

  1.  **Risky Prediction?** Pitch likely offers none beyond redescription. *(Ask: "What specific prediction does this make that general curiosity or anxiety wouldn't?")* → **KILL.** (Fails Q1). *Even if they muster one (e.g., "Women will remember threat details better"), it's likely untested here.*
  2.  **Ancestral Evidence?** None provided (just a modern survey). Unlikely.
  3.  **Alternatives?** Obvious alternatives: cultural fascination, general anxiety, learning strategy, empathy response. Survey doesn't rule these out. Gloss dismisses them.
  4.  **Comparative/Cross-Cultural?** No data presented. True-crime genre is culturally specific and recent. Threat monitoring might be evolved, but this *specific manifestation* almost certainly isn't.
  5.  **Evidence Against?** Unlikely a specific answer is given.
      *   **Verdict:** **Kill.** Classic just-so story. Survey finding (women listen more?) *might* be run alone if robust and novel, but the evo-psych gloss adds nothing but unsupported speculation.

  **b) Cross-Cultural Sex Difference in Occupational Prefs = Evolved & Fixed**

  1.  **Risky Prediction?** Finding stable differences is a *finding*, not a risky prediction *for evolution*. The risky claim is "evolved AND fixed." Prediction? "Differences will persist regardless of cultural/gender equality changes." (Testable!).
  2.  **Ancestral Evidence?** Unlikely direct evidence exists. Relies on inference.
  3.  **Alternatives?** **CRITICAL:** Social role theory, gendered socialization, discrimination, differing incentives. Does the study *control* for these? Does it track changes *over time* as equality increases? If differences shrink dramatically with equality (as they often do), that's strong evidence *against* "fixed" evolved preferences and *for* social causes. The word "therefore fixed" is a huge red flag.
  4.  **Comparative/Cross-Cultural?** Study *is* cross-cultural – **but stability ≠ evolved/fixed.** Stability could reflect universal patriarchy. Key question: **Does the *magnitude* of the difference correlate with societal gender equality?** If yes, kills the "fixed" claim. If no, it's *more* interesting but still doesn't *prove* evolution.
  5.  **Evidence Against?** Reduction of differences in more egalitarian societies would be strong evidence against "fixed."
      *   **Verdict:** **Likely Kill the "Evolved & Fixed" Gloss.** The *finding* of cross-cultural differences (if methods are sound) is potentially newsworthy. **Run the finding, cut the "evolved/fixed" gloss.** Frame it as: "Study finds persistent differences; debate rages over causes (biology vs. society), evidence points strongly to social factors." If the data *somehow* showed no link to equality, it would be a major finding worth reporting cautiously as a puzzle.

  **c) Open-Plan Offices Fail Due to Hunter-Gatherer Brains**

  1.  **Risky Prediction?** Unlikely. Probably just an analogy ("Our brains evolved for small bands, not offices"). *(Ask: "What specific prediction about office design or worker behavior does this make that modern stress theory doesn't?")* → Probably fails.
  2.  **Ancestral Evidence?** None linking *specific* office features to ancestral fitness. Highly speculative.
  3.  **Alternatives?** Obvious: Noise, lack of privacy, distractions, poor ergonomics, managerial issues, unsuitable tasks for collaboration. Vast literature on these. Evo-psych gloss ignores them.
  4.  **Comparative/Cross-Cultural?** Do people in small-scale societies work effectively in larger groups when needed? Yes. Do humans adapt to diverse environments? Yes. No evidence for a specific "hunter-gatherer office module."
  5.  **Evidence Against?** Existence of successful open-plan implementations, individual variation in preference, rapid adaptation to new environments.
      *   **Verdict:** **Kill.** A fun analogy, not science. The problems with open-plan offices are well-documented with modern causes. The evo-psych gloss is unnecessary, untestable, and distracts from real solutions. (This is the verdict you might not enjoy – it's a catchy narrative, but scientifically empty).

  ---

  **What This Checklist Can't Catch (Be Honest):**

  1.  **Plausible But Wrong Mechanisms:** A hypothesis can pass all checks (specific prediction, some comparative data) but still be incorrect because the *proposed mechanism* is wrong, even if the trait *is* an adaptation. (e.g., Assuming male aggression is *for* intergroup conflict when it might be primarily for intrasexual competition).
  2.  **Overstated Certainty:** Researchers might present a hypothesis as far more solid than the evidence warrants, using convincing language. The checklist helps, but confidence can be misleading.
  3.  **Hidden Assumptions:** Stories might embed questionable assumptions about ancestral environments (e.g., strict gender roles, constant warfare) that go unchallenged if the specific hypothesis seems testable.
  4.  **"Adaptationism Lite":** Focusing only on whether something *could* be an adaptation, without rigorously considering alternatives or evidence *for* it being an adaptation vs. a spandrel/byproduct. The checklist pushes against this, but a determined advocate might stretch.
  5.  **Nuanced Spandrels/Exaptations:** Distinguishing a complex spandrel or exaptation from a primary adaptation is often very difficult and requires deep expertise. The checklist flags weak evidence for adaptation, but might miss a strong case for a different evolutionary origin.

  **The Bottom Line:** This filter helps you ruthlessly eliminate the worst just-so stories (vague, unfalsifiable, ignoring alternatives/culture) and forces a critical evaluation of the evidence for any evolutionary claim. It shifts the focus to testability and evidence. It empowers you to separate potentially interesting *findings* from unsupported evolutionary *speculation*. Use your editorial judgment for the rest, always erring on the side of caution when making strong claims about human nature rooted in the distant past. Your readers will get better science.
