  Problem 3 examines the shift from examination (like tests) to predictive profiling. Is this a qualitative transformation or just more surveillance? This relies on how we define power dynamics (from Problem 1) and the nature of algorithmic knowledge (Problem 2).

  Now, which problem is the most upstream? Problem 2 about the episteme seems central. If algorithmic categorization constitutes a new episteme, it redefines the conditions of knowledge, which in turn affects how power operates (Problem 1) and the nature of surveillance (Problem 3). Without clarifying the episteme, the other issues might be misconstrued. 

