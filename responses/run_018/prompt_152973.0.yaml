prompt: |-
  You are a senior reproductive-ethics consultant at a regional fertility center, and you need a reusable decision framework for evaluating requests for preimplantation genetic testing and experimental targeted germline editing. You have about forty-five minutes per consultation, your notes must survive review by a hospital ethics board that includes non-philosophers, and you cannot resolve deep metaphysical disputes in real time. The framework must translate two commitments into an operational procedure: first, the principle of procreative beneficence, understood as a reason to select the child expected to have the best life measured against a plural but bounded conception of well-being rather than any single metric; second, the constraints of liberal eugenics, meaning institutional neutrality among reasonable conceptions of the good life, a strict prohibition on coercive or socially compelled selection, and special caution wherever the selected trait is identity-constituting for existing communities.

  Turn these commitments into a step-by-step procedure your team can actually run: list the questions to ask in fixed order; specify what counts as a sufficient answer to each; identify the exact points where the procedure stops with a clear recommendation (support, conditional support, defer, or decline); and flag explicitly where a question is irreducibly one of values rather than clinical or predictive fact, so that the board or the parents must decide. Mark which steps are judgment calls dressed as procedure. The framework must handle hard cases: selection for traits whose value depends on contested social contexts; interventions with multi-generational effects that alter the range of lives available to descendants; and requests that define the best life using metrics the future child might reject.

  Then apply the procedure to three proposals:

  1. A couple requests germline editing to reduce a known high-penetrance variant for early-onset familial Alzheimer's, with no other intended modifications.
  2. A couple enrolled in a long-duration isolated space-mission program requests selection for a heritable variant associated with extreme emotional resilience to prolonged solitude, a trait highly valued by mission architects but not by mainstream social norms.
  3. A deaf couple requests selection for congenital deafness, arguing that deafness is not a disability but a cultural identity, and that hearing children born into Deaf families often face social isolation; the procedure must address whether best life can be defined in a way that respects this claim without collapsing into pure parental preference.

  In at least one case the procedure should yield a recommendation that conflicts with the parents' stated preference, and you must explain how the framework justifies that conflict without violating liberal neutrality. Finally, state clearly what the procedure cannot do: for instance, resolving the non-identity problem, adjudicating between genuinely incommensurable conceptions of flourishing, or substituting for democratic deliberation about which traits should be socially encouraged.
reasoning: |-
  We are creating a decision framework for evaluating requests for preimplantation genetic testing (PGT) and experimental germline editing. The framework must embody two main commitments: procreative beneficence (selecting the child expected to have the best life based on a plural but bounded conception of well-being) and liberal eugenics (institutional neutrality, no coercion, and caution with identity-constituting traits).

  The framework will be a step-by-step procedure with fixed questions. We must specify:
  - The order of questions
  - What counts as a sufficient answer for each
  - The decision points (support, conditional support, defer, decline)
  - Explicitly flag value judgments (where the ethics board or parents must decide)
  - Note which steps are "judgment calls dressed as procedure"

  The framework must handle hard cases including:
  - Traits with contested social value
  - Multi-generational effects
  - Metrics the future child might reject

  We then apply the framework to three cases.

  ---

  **Decision Framework: Step-by-Step Procedure**

  **Step 1: Establish Medical Necessity and Risk Profile**
     - **Question:** "Is the intervention aimed at preventing a condition that is universally recognized as severely reducing life expectancy or causing significant, unremittable pain or suffering, and for which there are no effective postnatal treatments?"
     - **Sufficient Answer:** 
       - If YES, proceed to Step 2. 
       - If NO, but the intervention is for a non-medical reason, proceed to Step 3.
       - If the condition is not severe and/or has effective treatments, the procedure may stop with a recommendation of **decline** for germline editing (but note: PGT for non-medical traits may still be considered under liberal eugenics if it meets other criteria).
     - **Value Judgment?** No. This step is based on medical consensus (e.g., WHO definitions, clinical guidelines). However, note that "severe" is a threshold that may have some judgment, but we rely on established medical standards.

  **Step 2: Assess Identity-Constituting Status and Community Impact (for non-medical traits or conditions with contested status)**
     - **Question:** "Is the trait in question considered by a recognized community as central to its identity, such that its absence would be seen as a loss of that identity? And is the trait one that the future child might reasonably reject as not being part of their chosen identity?"
     - **Sufficient Answer:** 
       - If the trait is identity-constituting (e.g., deafness in the Deaf community) and the intervention would remove it, proceed with extreme caution. We must then ask: "Is the request coming from within the community?" 
         - If YES, then the community's self-definition must be given weight, but we must still evaluate the child's potential well-being in Step 4.
         - If NO (i.e., outsiders trying to eliminate the trait in a community), then the procedure stops with a recommendation to **decline** (violates liberal neutrality by imposing an external view).
       - If the trait is not identity-constituting, proceed to Step 3.
     - **Value Judgment?** Yes. Determining what counts as a "recognized community" and whether a trait is identity-constituting requires cultural and ethical judgment. The ethics board must be consulted if there is dispute.

  **Step 3: Evaluate the Trait's Impact on Well-Being (Plural Conception)**
     - **Question:** "Based on available evidence, does the trait (whether selected for or against) have a predictable and significant impact on the child's well-being across multiple dimensions (e.g., physical health, mental health, social integration, opportunity range)?"
     - **Sufficient Answer:** 
       - We require evidence from multiple sources (e.g., longitudinal studies, meta-analyses) about the trait's effects. The framework must consider both the average impact and variability (e.g., some deaf individuals thrive, others struggle). 
       - If the trait is likely to significantly reduce well-being across a broad range of reasonable conceptions of the good life (e.g., severe chronic pain), then it is a candidate for selection against (proceed to Step 4).
       - If the trait is likely to enhance well-being in a way that is broadly valued (e.g., resilience without downsides) but not identity-constituting, proceed to Step 4.
       - If the trait's impact is highly contested and context-dependent (e.g., resilience to solitude in a space mission), then we must proceed to Step 4 but note the uncertainty.
       - If the trait has no clear positive or negative impact, or if the impact is trivial, then the procedure stops with a recommendation to **decline** (fails procreative beneficence because there's no expected improvement).
     - **Value Judgment?** Partly. While we use empirical evidence, the interpretation of what counts as a significant impact and the weighting of dimensions are value-laden. The framework uses a bounded pluralism: we consider well-being dimensions that are widely recognized (e.g., health, autonomy, social relationships) and avoid narrow metrics (e.g., only IQ).

  **Step 4: Assess Multi-Generational Effects and Autonomy of Future Generations**
     - **Question:** "Does the intervention have effects that extend beyond the immediate child to future descendants, and if so, do these effects risk constraining the range of life options available to them or imposing burdens without their consent?"
     - **Sufficient Answer:** 
       - For germline editing: If the edit is for a disease-causing variant with high penetrance and no known benefits (e.g., Alzheimer's), then the reduction in disease risk is likely to expand future descendants' options (proceed to Step 5).
       - For edits that introduce new traits (e.g., resilience to solitude), we must consider: 
          - Is the trait likely to be beneficial in a wide range of future environments? 
          - Might it become a burden in changed circumstances? 
          - Does it alter identity-constituting traits for future generations without their consent?
       - If there is significant uncertainty about multi-generational effects, the procedure stops with **conditional support** (only if long-term monitoring and exit options are provided) or **defer** (until more data is available).
       - If the intervention clearly narrows the range of future lives (e.g., by eliminating a trait that is identity-constituting for a community) without compelling reasons, then **decline**.
     - **Value Judgment?** Yes. Predicting future environments and the value of traits is speculative. We must balance potential benefits against the risk of harm to future autonomy.

  **Step 5: Parental Autonomy and Coercion Check**
     - **Question:** "Is the request driven by parental preference without evidence of harm to the child, and if so, does it violate the prohibition on coercive selection? Specifically, does the selection pressure reflect a social compulsion (e.g., sex selection in a gender-biased society) or is it a free parental choice among reasonable options?"
     - **Sufficient Answer:** 
       - If the selection is for a trait that is socially compelled (e.g., because of discrimination) and the selection would reinforce that compulsion, then **decline** (violates liberal eugenics).
       - If the selection is a free parental choice and the trait is not identity-constituting (or if it is, the parents are part of the community), then we allow parental discretion unless Step 3 or 4 raises red flags.
       - If the selection is for a trait that the child might reject (e.g., deafness), then we must weigh the parental claim against the child's potential opportunity range. If the parents are part of the community and the child will be raised in that community, then the risk of isolation may be low. But if the trait significantly reduces the child's ability to access a wide range of opportunities (e.g., communication in a hearing world) without compensatory benefits, we may **decline**.
     - **Value Judgment?** Yes. Determining what counts as coercive social pressure versus free choice is context-dependent and requires cultural sensitivity.

  **Step 6: Synthesis and Recommendation**
     - **Question:** "Taking all the above steps together, does the intervention satisfy procreative beneficence (by reasonably expecting to provide the child with a better life across a plural conception of well-being) without violating liberal eugenics (neutrality, no coercion, respecting identity-constituting traits)?"
     - **Sufficient Answer:** 
       - **Support**: If the intervention is for a severe medical condition (Step 1) and passes Steps 2-5 without red flags.
       - **Conditional Support**: If there are uncertainties (e.g., long-term effects) that can be mitigated (e.g., long-term monitoring, reversibility if possible), or if the intervention is for a non-medical trait with strong evidence of well-being enhancement and no community harm.
       - **Defer**: If critical information is missing (e.g., long-term data) but the case is otherwise strong.
       - **Decline**: If any of Steps 1-5 yield a stop signal, or if the intervention fails liberal eugenics (e.g., coercive, disrespects identity-constituting traits without compelling reason, or no clear well-being benefit).
     - **Value Judgment?** Yes. This is a holistic judgment call, but we break it down into the above steps to make it tractable.

  **Judgment Calls Dressed as Procedure**: Steps 2, 3, 4, and 5. Step 3 in particular uses empirical data but requires interpretation. Step 2 is highly value-laden.

  ---

  **Application to Cases**

  **Case 1: Germline editing to reduce early-onset familial Alzheimer's**
     - Step 1: YES. Early-onset Alzheimer's is severe, reduces life expectancy, and has no cure. Proceed.
     - Step 2: Not applicable (medical condition, not identity-constituting). Skip.
     - Step 3: Removing the variant significantly improves well-being across all dimensions (physical, mental, social). Proceed.
     - Step 4: Germline editing will affect future generations. However, reducing a high-penetrance disease variant expands their opportunity range (no known benefits to retaining the variant). Proceed.
     - Step 5: No coercion. The parents are acting to prevent a severe disease. Proceed.
     - Step 6: **Support**. The intervention aligns with procreative beneficence and liberal eugenics.

  **Case 2: Selection for emotional resilience to solitude for space mission**
     - Step 1: NO. This is not a medical condition. Proceed to Step 3 (skip Step 2 for now, as the trait is not identity-constituting for a community?).
     - Step 2: Is resilience to solitude identity-constituting? Not for any recognized community (as stated). Proceed to Step 3.
     - Step 3: The trait's impact on well-being is context-dependent. In a space mission, it may be crucial for mental health. On Earth, it might be neutral or even negative (e.g., social detachment). However, the child will be raised in the space program. Evidence? We need studies on similar traits (e.g., in Antarctic researchers). Given the bounded pluralism, we consider: 
          - Positive: Mental health in isolated environments.
          - Negative: Potential for maladaptation in social settings on Earth? 
          Since the child is intended for the space program, the trait may be beneficial. But what if the child leaves the program? We must account for that possibility. The evidence is mixed and context-dependent. Proceed with caution to Step 4.
     - Step 4: Multi-generational effects: If the trait is heritable, future descendants might be born into the space program or not. If the program ends, the trait might become a burden (e.g., social detachment). This risk is significant. We don't know the future of space colonization. Therefore, we must **defer** or **conditionally support** with long-term monitoring and exit options (e.g., gene editing reversibility, though currently not feasible). 
     - Step 5: The request is driven by the mission architects and the parents' commitment. Is it coercive? Not in the sense of social compulsion, but the child may feel pressured to join the mission. However, without the trait, the child might suffer in the mission. This is a gray area. 
     - Step 6: Given the uncertainty in Steps 3 and 4, we recommend **conditional support** only if:
          - The intervention is reversible (if possible) or has an "off-switch" for future generations.
          - The program commits to lifelong monitoring and psychological support.
          - The parents are fully informed of the risks.
          Otherwise, **defer** until more data.

  **Case 3: Deaf couple selecting for congenital deafness**
     - Step 1: NO. Deafness is not a life-threatening condition. Proceed to Step 3 (but note Step 2 is critical).
     - Step 2: Deafness is identity-constituting for the Deaf community. The parents are part of that community. However, the trait might be rejected by the child. We must balance the community's view against the child's potential well-being. Proceed to Step 3 but with caution.
     - Step 3: Well-being impact: 
          - The Deaf community argues that deafness is not a disability and that within their community, well-being is high. 
          - However, in the broader hearing world, deafness can reduce opportunities (e.g., communication, employment). 
          - The parents argue that a hearing child in a Deaf family might be isolated. But is that because of the family's choice or societal barriers? 
          - We must consider: The child will live in a world that is predominantly hearing. Even with accommodations, the child will face challenges. 
          - Evidence: Studies show that deaf individuals can thrive, but on average, they face barriers. The bounded pluralism requires us to consider a range of dimensions, including social integration and autonomy. 
          - The parents' claim that a hearing child would be isolated in a Deaf family: This is a valid concern, but it can be mitigated (e.g., learning sign language, interaction with hearing peers). 
          - Conclusion: Selecting for deafness is not expected to improve the child's well-being compared to a hearing child (who can still participate in Deaf culture and the hearing world). In fact, it may reduce the child's opportunity range. Therefore, this step fails procreative beneficence.
     - Step 4: Multi-generational effects: If the child is deaf, their descendants might be too, further narrowing their options. This exacerbates the concern.
     - Step 5: The request is not coercive in the social sense (it's a minority community choice). However, the child has no say in an identity-constituting trait. 
     - Step 6: **Decline**. 
          - Why? Procreative beneficence: We cannot conclude that deafness gives the child the best life. The child might have a good life in the Deaf community, but they could have a broader opportunity range without deafness. The framework does not allow selection for a trait that reduces the child's expected well-being across a plural conception (which includes the ability to navigate both Deaf and hearing worlds). 
          - Liberal eugenics: We respect the community's identity, but we cannot allow parents to choose a trait that objectively reduces the child's capabilities without a compelling well-being reason. The parents' preference is not sufficient if it conflicts with the child's expected well-being. 
          - However, note: We are not violating liberal neutrality because the decision is based on a bounded plural conception of well-being (which includes health, sensory capacities, and social integration) and not on a specific conception of the good life. We are not favoring hearing over deafness per se, but we are noting that the absence of hearing reduces the child's ability to access a wide range of human experiences and opportunities.

  ---

  **What the Framework Cannot Do**
  1. **Resolve the non-identity problem**: We are evaluating the well-being of the child that would be born with the selected traits, but we cannot address the philosophical issue that without the intervention, a different child might be born.
  2. **Adjudicate between genuinely incommensurable conceptions of flourishing**: If two conceptions of the good life are both reasonable and lead to opposite conclusions, the framework may not be able to break the tie. In such cases, we default to the parents' choice unless it clearly violates the bounded pluralism or liberal constraints.
  3. **Substitute for democratic deliberation**: The framework is for individual cases. Broader societal decisions about which traits should be encouraged (e.g., via public health policies) require democratic processes.
  4. **Predict the future with certainty**: Especially for multi-generational effects, we rely on the best available evidence but cannot guarantee outcomes.
  5. **Eliminate all bias**: The bounded plural conception of well-being is based on current social understandings and may evolve.
answer: |-
  ### Decision Framework for Preimplantation Genetic Testing and Germline Editing Requests

  **Framework Principles:**  
  - **Procreative Beneficence (PB):** Select the child expected to have the "best life" based on a *plural but bounded conception of well-being*. Well-being includes: physical health, psychological resilience, social integration, autonomy, and access to opportunity. Avoid single metrics (e.g., IQ, wealth).  
  - **Liberal Eugenics (LE):** Institutional neutrality (no favoring of specific conceptions of the good life); prohibition on coercion/social compulsion; caution with identity-constituting traits (e.g., Deafness, ethnicity).  

  **Operational Rules:**  
  - **Timebound:** Each step must be completed in ≤7 minutes.  
  - **Documentation:** Use standardized templates for answers. Flag value judgments explicitly.  
  - **Outcomes:**  
    - **Support:** Proceed unconditionally.  
    - **Conditional Support:** Proceed only with specific safeguards (e.g., long-term monitoring).  
    - **Defer:** Insufficient data; revisit after specified actions (e.g., peer-reviewed studies).  
    - **Decline:** Ethically impermissible under PB/LE.  

  ---

  ### Step-by-Step Procedure  
  **1. Medical Necessity & Severity**  
     - **Question:** "Does the targeted trait cause severe physical/mental suffering, significantly reduce life expectancy, or prevent basic functioning (e.g., self-care, communication) without effective postnatal interventions?"  
     - **Sufficient Answer:**  
       - *Yes:* Supported by medical consensus (e.g., WHO classifications, clinical guidelines). Proceed to Step 2.  
       - *No:* Proceed to Step 3.  
     - **Stop Point:** Decline if trait is non-severe and parents refuse to proceed to Step 3.  
     - **Value Judgment?** No (clinical fact-based).  

  **2. Identity-Constituting Trait Check**  
     - **Question:** "Is this trait central to the identity of a recognized cultural/ethnic community (e.g., Deafness, dwarfism)?"  
     - **Sufficient Answer:**  
       - *Yes:* Community recognition confirmed via anthropological/sociological sources (e.g., NAD for Deaf culture). Proceed to Step 4.  
       - *No:* Proceed to Step 3.  
     - **Stop Point:** Decline if request is from outsiders seeking to eliminate an identity-constituting trait (violates LE neutrality).  
     - **Value Judgment?** Minimal (recognition requires evidence of community self-definition).  

  **3. Well-Being Impact Assessment (PB Core)**  
     - **Question:** "Based on evidence, does the trait significantly narrow the child’s opportunity range (e.g., limiting education, relationships, careers) or expose them to preventable harm across a *plurality* of well-being domains?"  
     - **Sufficient Answer:**  
       - *Harm:* Data shows ≥50% reduction in key opportunity domains (e.g., employment, social inclusion) in >70% of cases. Proceed to Step 5.  
       - *Enhancement:* Data shows broad benefit across ≥3 well-being domains without significant trade-offs. Proceed to Step 5.  
       - *Neutral/Contested:* Proceed to Step 4.  
     - **Stop Point:** Decline if trait enhancement lacks evidence of broad well-being improvement (e.g., selecting for "resilience" with no data on psychosocial outcomes).  
     - **Value Judgment?** Yes (interpreting "opportunity range" and weighting domains). **Judgment call dressed as procedure.**  

  **4. Autonomy & Future Self-Determination**  
     - **Question:** "Could this trait foreclose the child’s ability to choose core aspects of their identity (e.g., cultural affiliation) or reject the parents’ values?"  
     - **Sufficient Answer:**  
       - *High risk:* Trait locks child into a specific community/lifestyle without exit options (e.g., selecting for deafness limits access to hearing world). Proceed to Step 6.  
       - *Low risk:* Trait permits fluidity (e.g., selecting against Alzheimer’s doesn’t alter identity). Proceed to Step 5.  
     - **Stop Point:** Conditional support if mitigation possible (e.g., cochlear implants for a hearing child in a Deaf family).  
     - **Value Judgment?** Yes (assessing "exit options"). **Judgment call dressed as procedure.**  

  **5. Social Coercion & Neutrality (LE Core)**  
     - **Question:** "Is this request driven by parental preference alone, or does it reflect broader social pressures (e.g., discrimination, eugenic norms)?"  
     - **Sufficient Answer:**  
       - *Coercion:* Evidence of systemic bias (e.g., sex selection in gender-discriminatory societies). Decline.  
       - *Neutral:* Preference is idiosyncratic (e.g., space-mission resilience) or community-internal (e.g., Deaf parents). Proceed to Step 6.  
     - **Stop Point:** Decline if selection reinforces oppression (violates LE prohibition on coercion).  
     - **Value Judgment?** Yes (distinguishing "preference" from "coercion").  

  **6. Multi-Generational & Uncertainty Review**  
     - **Question:** "Do long-term effects (e.g., germline edits) or unknown risks disproportionately constrain descendants’ lives or exceed established safety thresholds?"  
     - **Sufficient Answer:**  
       - *Controllable risk:* Effects are reversible/monitorable (e.g., selecting against Alzheimer’s). Support.  
       - *High uncertainty:* No data on intergenerational impacts (e.g., novel resilience genes). Defer or conditional support with monitoring.  
       - *Irreversible harm:* Trait eliminates key human capacities (e.g., editing for permanent emotional blunting). Decline.  
     - **Stop Point:** Defer if <5 years of longitudinal data on trait outcomes.  
     - **Value Judgment?** Partly (risk tolerance is value-laden).  

  **7. Final Recommendation Synthesis**  
     - **Question:** "Does the request align with PB (best life based on bounded plural well-being) and LE (neutrality, no coercion)?"  
     - **Outcomes:**  
       - **Support:** All steps cleared (e.g., medical necessity, low social risk).  
       - **Conditional Support:** Resolvable uncertainties (e.g., long-term monitoring for space-mission resilience).  
       - **Defer:** Insufficient data (e.g., novel gene edits).  
       - **Decline:** Violates PB/LE (e.g., coercive, reduces opportunity range).  

  ---

  ### Application to Cases  
  **Case 1: Germline Editing for Familial Alzheimer’s**  
  - **Step 1:** Yes (early-onset Alzheimer’s causes severe suffering, no cure).  
  - **Step 2:** No (not identity-constituting).  
  - **Step 3:** Harm confirmed (universal reduction in cognitive/functional capacity).  
  - **Step 4:** Low risk (no impact on identity/autonomy).  
  - **Step 5:** Neutral (medical prevention, no coercion).  
  - **Step 6:** Controllable risk (germline editing well-studied for monogenic diseases).  
  - **Step 7: Support.**  
  *Rationale:* Aligns with PB (prevents severe harm) and LE (non-coercive, neutral).  

  **Case 2: Selection for Emotional Resilience in Space Mission**  
  - **Step 1:** No (not a medical condition).  
  - **Step 2:** No (not identity-constituting).  
  - **Step 3:** Contested ("resilience" has no broad well-being data; may cause harm in non-isolated settings).  
  - **Step 4:** High risk (child may reject mission life but lack "typical" emotional responses).  
  - **Step 5:** Neutral (idiosyncratic parental choice, but architects’ influence raises mild coercion concerns).  
  - **Step 6:** High uncertainty (no multi-generational data; may alter descendants’ emotional range).  
  - **Step 7: Conditional Support** (with 20-year monitoring and psychological support for the child).  
  *Rationale:* PB not fully met (trait value context-dependent), but LE allows parental discretion if non-coercive.  

  **Case 3: Deaf Couple Requests Selection for Deafness**  
  - **Step 1:** No (deafness is not life-threatening).  
  - **Step 2:** Yes (identity-constituting for Deaf community).  
  - **Step 3:** Neutral/Contested (deafness reduces opportunity range in hearing society but enhances cultural belonging).  
  - **Step 4:** High risk (child cannot choose hearing world access; isolation risk is mitigated by technology/sign language).  
  - **Step 5:** Coercion risk (parents’ preference may override child’s future autonomy; mainstream society disadvantages deaf individuals).  
  - **Step 6:** Multi-generational harm (descendants’ opportunities narrowed).  
  - **Step 7: Decline.**  
  ***Conflict Justification:***  
  - PB violated: Selecting *for* deafness reduces the child’s opportunity range (e.g., communication, careers) compared to selecting *against* it. Deafness imposes barriers in a hearing-majority world, even with cultural support.  
  - LE preserved: Decline stems from bounded well-being (access to plural opportunities), not rejection of Deaf culture. Institutional neutrality requires prioritizing the child’s ability to access *both* Deaf and hearing worlds. Parental preference cannot override PB’s "best life" standard when harm is objectively measurable.  

  ---

  ### What the Framework Cannot Do  
  1. **Resolve the non-identity problem:** Cannot adjudicate whether selecting a "different" child is harmful if both have lives worth living.  
  2. **Adjudicate incommensurable conceptions of flourishing:** If two communities irreconcilably disagree on a trait’s value (e.g., deafness as disability vs. identity), the framework defaults to objective opportunity metrics but cannot resolve the deeper conflict.  
  3. **Substitute for democratic deliberation:** Cannot address societal questions (e.g., "Should resilience be incentivized?"). These require policy processes.  
  4. **Predict future social contexts:** Assumes current understanding of opportunity ranges; cannot guarantee traits will remain beneficial/harmful.  
  5. **Eliminate all bias:** "Bounded well-being" relies on evolving social consensus; may reflect majority norms.  

  **Final Note:** The framework translates PB/LE into auditable steps but requires ethics board review for value-laden judgments (Steps 3–5). Documentation must explicitly note where parental/board discretion applies.
