answer: |-
  This is a sharp observation of a recurrent dialectical pattern in aggregation ethics. The maneuver you describe doesn't have a single universally recognized name, but it is a well-identified and frequently criticized move. Here's a breakdown of how to understand, taxonomize, and name it, along with distinctions and potential justifications:

  **Core of the Maneuver:** The defender **concedes the *representational separateness* of individuals/groups within the model** (the "bookkeeping") but **denies that this separateness imposes any constraint on the *operation* of aggregation (summation/comparison)**. They treat the objection as merely a misunderstanding of the formalism's input structure, ignoring the moral significance the objector attaches to the *output* operation.

  **Established Labels & Literature:**

  1.  **The "Parfitian Rejoinder" (or "Standard Utilitarian Reply to the Separateness of Persons"):** This is the most direct reference. Derek Parfit (*Reasons and Persons*, 1984) famously framed the "Separateness of Persons" objection against utilitarianism. The standard utilitarian reply *is* precisely the move you describe: "We *do* distinguish between different people; we give them all separate entries in our moral calculus." Parfit himself saw this reply as inadequate, arguing that the core issue isn't the *representation* but the *aggregation principle* itself, which treats benefits and harms as "morally neutral" across persons once represented. The literature debating Parfit (Scanlon, Rawls, Nozick, Kamm, Nagel, etc.) extensively analyzes this move. Scanlon (*What We Owe to Each Other*, 1998) explicitly argues that the separateness objection targets the *permissibility of the trade-off*, not the accuracy of the accounting.
  2.  **"Formalist Defense of Aggregation":** This highlights the defender's reliance on the *technical structure* of the model (separate entries) to deflect a criticism aimed at the *moral implications* of the operation performed *on* that structure.
  3.  **"Input-Output Misalignment" (Less Common):** This captures the specific disconnect you identify: respecting separateness in the input (representation) but violating its presumed moral significance in the output (operation/result).

  **Taxonomy & Proposed Names:**

  *   **Category:** **Aggregative Fallacy** or **Dialectical Maneuver in Aggregation Ethics**.
  *   **Specific Names:**
      *   **The Bookkeeping Fallacy:** (Your term is apt!) This emphasizes the mistake of believing that meticulous *representation* (separate entries) inherently respects the moral significance of separateness demanded by the objector, when the subsequent *operation* (summation) fundamentally negates it. The fallacy is confusing accurate accounting for morally significant consideration.
      *   **Representational Tokenism:** The separate entries are offered as mere tokens acknowledging separateness, without carrying the substantive moral weight the objector requires (i.e., a constraint on trade-offs).
      *   **The Aggregative Bypass:** The defense "bypasses" the substantive moral objection by pointing to a formal feature of the model that doesn't actually address the core concern about interpersonal trade-offs.
      *   **The Input Concession / Output Denial Maneuver:** A purely descriptive label highlighting the two-step structure of the move.

  **Distinguishing from Related Concepts:**

  1.  **Ordinary Question-Begging:** While related, it's not *pure* question-begging. The defender isn't *simply* assuming the permissibility of aggregation is true. They are offering an *argument*: "Look, we represent them separately, so your objection doesn't apply." The flaw is that this argument is non-responsive; it addresses a misconstrual (the representation) rather than the actual target (the operation/trade-off). It *becomes* question-begging if the defender implicitly assumes that their representation *suffices* to answer the objection, which presupposes the permissibility of the aggregation they are defending.
  2.  **Motte-and-Bailey:**
      *   **Motte (Easily Defensible):** "Our model represents each person/cohort separately." (True, uncontroversial descriptively).
      *   **Bailey (Controversial Claim):** "Therefore, our model respects the distinctness of persons/the separateness of cohorts in the morally relevant sense demanded by the objection." (False or unsubstantiated leap).
      *   **Yes, this fits well.** The defender retreats to the safe motte (accurate representation) when pressed on the bailey (the moral acceptability of the aggregative trade-off justified *by* that model). The motte doesn't actually defend the bailey.
  3.  **Merely Correct Clarification:** If the objector had genuinely *misdescribed* the formalism (e.g., claiming utilities were lumped together before entry), then pointing out the separate entries *would* be a valid clarification. However, in the scenario you describe, the objector *acknowledges* the separate entries but argues that the *summation* is the morally problematic step. The defender's reply ("we represent them separately!") therefore *fails* as a clarification because it doesn't address the actual point of contention – it clarifies something not in dispute while ignoring what is.

  **When Might the Defender Be Entitled to Make This Move?**

  The defender is only entitled if they successfully argue one of two things:

  1.  **The Moral Irrelevance of Separateness for *This* Operation:** They must directly argue that the moral significance the objector attaches to separateness *does not entail* a constraint on interpersonal aggregation of the type being performed. They need to defeat the *substance* of the separateness objection head-on (e.g., by defending a thoroughgoing welfarism where only total or average utility matters, and separateness has no intrinsic moral weight constraining aggregation). Simply pointing to the representation dodges this necessary argument. (This is the hardcore utilitarian position).
  2.  **The Misidentification of the Operation:** If they can convincingly argue that the *operation* performed isn't actually the morally problematic aggregation the objector claims it is (e.g., perhaps by arguing the losses and gains aren't truly commensurate, or that the model incorporates side-constraints elsewhere), *then* pointing to the representation might be part of a larger defense. But the representation alone doesn't achieve this.

  **In essence:** The defender is *not* entitled to use the "separate entries" point *as a rebuttal* to the separateness objection *unless* they have already independently established that the moral principle underlying that objection is false or inapplicable. Otherwise, it's a dialectical evasion – the **Bookkeeping Fallacy** or **Aggregative Bypass** – mistaking a feature of the *input representation* for an answer to a critique of the *output operation's moral permissibility**. It's a specific form of failing to engage with the substance of the "Separateness of Persons" objection as articulated by Parfit and developed by his critics. Your identification of it as a recurring pattern is spot-on for analyzing debates in resource allocation, policy reform, and distributive justice.**
