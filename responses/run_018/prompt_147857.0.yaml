answer: |-
  Here’s a draft adversarial collaboration framework for your study group, structured to preserve both positions' integrity while clarifying disagreements. It assumes familiarity with the *White Horse Dialogue*’s core argument ("Seeking a horse ≠ seeking a white horse → White horse ≠ horse").

  ---

  ### **Joint Statement: Agreed Foundations (Signed by Both Camps)**  
  1. **Dialogue Structure**: The argument is tripartite:  
     - (i) Thesis: "White horse is not horse"  
     - (ii) Anticipated Objection: "If white horse ≠ horse, then no white horses exist?"  
     - (iii) Refutation: Distinguishing *seeking horse* from *seeking white horse*.  
  2. **Gongsun Long’s Target**: He critiques loose linguistic practices in administrative/judicial contexts (e.g., ambiguous tax codes or inheritance disputes) where descriptor omission causes errors.  
  3. **Formal Moves**:  
     - Modification (adding "white") alters the term’s referential scope.  
     - "Is not" (非, *fei*) signifies *non-identity*, not non-existence.  
     - The argument hinges on substitutability: If *white horse* were identical to *horse*, seeking one would entail seeking the other (but it doesn’t).  

  ---

  ### **Distinct Positions (Uncompromised Wording)**  
  | **Sortal-Logic Camp (SLC)** | **Pragmatic-Context Camp (PCC)** |
  |-----------------------------|----------------------------------|
  | "Gongsun Long demonstrates that 'horse' and 'white horse' denote distinct **extensions** due to differing necessary conditions. 'Horse' requires only equine properties; 'white horse' adds color as a **specific difference**, creating a subtype exclusion." | "Gongsun Long exposes how adding descriptors like 'white' changes **recognition conditions** in real disputes. 'Horse' alone triggers default identification procedures; 'white horse' demands new criteria, altering **practical outcomes** (e.g., legal liability for misdelivery)." |

  ---

  ### **Cruxes & Testing Analogies**  
  **Crux 1: The Role of Color**  
  - **Disagreement**:  
    - SLC: Color is an *accidental property* modifying a stable sortal ("horse").  
    - PCC: Color is a *sortal-transforming feature* that redefines the object for identification purposes.  
  - **Shared Analogy**: **"Brown cow" vs. "cow" in a cattle census**  
    - *SLC Prediction*: "Brown cow is a cow" remains true; brown is a subset. Denying this would confuse properties/identity.  
    - *PCC Prediction*: In census practice, reporting "brown cow" ≠ reporting "cow" – officials *must* record color if specified. Omitting "brown" when required is punishable error.  

  **Crux 2: Framework Priority**  
  - **Disagreement**:  
    - SLC: The argument is best formalized in **set theory** (H ⊃ WH; thus WH ⊆ H but WH ≠ H).  
    - PCC: It must be read through **Warring States administrative practice** (e.g., *chengming* 正名, "correct naming" for governance).  
  - **Shared Analogy**: **"Confronting a thief"**  
    - Scenario: *Order: "Apprehend the person!" vs. "Apprehend the person in a blue robe!"*  
    - *SLC Prediction*: The person in blue is still a person. Failure to apprehend non-blue persons isn’t relevant to identity.  
    - *PCC Prediction*: Guards *must* ignore non-blue suspects. Calling "person in blue robe" ≠ "person" because it changes actionable criteria.  

  **Crux 3: Property Inheritance**  
  - **Disagreement**:  
    - SLC: "White horse" inherits all properties of "horse" + whiteness. "Not horse" asserts non-identity of extensions.  
    - PCC: Descriptors block property inheritance: A "white horse" is **not for all purposes** a "horse" (e.g., fulfilling a "horse" request).  
  - **Shared Analogy**: **"Oak chair" vs. "chair" in a contract**  
    - Scenario: *Contract A requires "chairs"; Contract B requires "oak chairs."*  
    - *SLC Prediction*: Delivering oak chairs satisfies Contract A (oak chairs are chairs).  
    - *PCC Prediction*: Delivering oak chairs violates Contract A if non-oak chairs were stipulated (e.g., for cost reasons). "Oak chair" ≠ "chair" *in this transactional context*.  

  ---

  ### **Residual Disagreement Made Exact**  
  The irreconcilable divide lies in **what "is not" denies**:  
  - **SLC**: "White horse is not [identical to] horse" because *set membership ≠ set identity* (e.g., {WH} ≠ {H}).  
  - **PCC**: "White horse is not [recognizable as] horse" because *naming conventions alter verification protocols*.  

  **Test for Resolution**:  
  > If Gongsun Long were shown a *non-white horse* and asked "Is this what you mean by 'horse'?", would he say:  
  > - SLC: "Yes, but it fails 'white horse'" (focus: properties).  
  > - PCC: "Irrelevant—we’re discussing *white horses*" (focus: context-bound reference).  

  This framework forces each camp to defend *why* their analogy maps perfectly to the text while the other’s misrepresents Gongsun Long’s purpose. No synthesis is imposed—the adversarial clarity *is* the outcome.
