answer: |-
  ### Adversarial Collaboration Joint Statement: Defining Life  

  **Agreed Claims Section**  
  Both Camp A (organizational closure + evolutionary potential) and Camp B (carbon-based metabolism + evolutionary descent) endorse the following:  

  1. **Metabolism**: All known living systems require energy and material processing to maintain self-organization. Metabolism involves thermodynamic work (e.g., energy transduction) and is observable in carbon-based systems. Non-metabolic entities (e.g., rocks) are non-living.  
  2. **Reproduction**: Life involves replication with inheritance and variation, enabling evolution. Systems incapable of heritable variation (e.g., crystals) are non-living. Reproduction must allow for open-ended evolvability, not just copying.  
  3. **Borderline Cases**:  
     - **Prions/Viroids**: Not alive. They replicate but lack metabolic activity, autonomy, and evolvability without hijacking host machinery.  
     - **Viruses**: Borderline due to dependency. They exhibit evolution and replication but lack independent metabolism. Their "aliveness" is context-dependent (e.g., only when active in a host).  
  4. **Core Boundaries**:  
     - Systems lacking *both* organizational continuity *and* evolutionary capacity (e.g., fire, tornadoes) are non-living.  
     - "Aliveness" is not binary but exists on a spectrum, with prions/viroids at the non-living end and obligate parasites (e.g., *Mycoplasma*) near the living end.  

  ---  

  **Disagreements Section**  
  Each camp’s core position, in their own wording:  

  | Camp | Definition of Life | View on Synthetic/Digital Systems | View on Viruses |  
  |------|-------------------|-----------------------------------|----------------|  
  | **A** | "Life arises from **organizational closure** (autopoietic self-maintenance) plus **evolutionary potential** (capacity for variation/selection). Substrate is incidental; functional equivalence suffices." | Synthetic proto-cells (even non-carbon) and evolving digital ecosystems are alive if they meet criteria. | Viruses are alive when replicating (they exhibit closure via host machinery + evolvability). |  
  | **B** | "Life requires **carbon-based metabolism** (with ribosome-like translation) and **evolutionary descent** (inheritance of thermodynamic debt from prior life). Closure is derivative, not defining." | Synthetic systems without descent/metabolic continuity (e.g., lab protocells) are not alive. Digital systems are simulations, not life. | Viruses are not alive (lack metabolism/descent); they are "replicating packages" borrowing life. |  

  ---  

  **Cruxes and Predictions**  
  Key unresolved disputes, with testable cases and predictions:  

  | Crux | Hypothetical Case | Camp A Prediction | Camp B Prediction |  
  |------|-------------------|-------------------|-------------------|  
  | **1. Is thermodynamic debt inheritance necessary?**<br>(*Must life inherit continuous metabolic lineage from prior life?*) | **Case**: A *silicon-based protocell* synthesized in isolation. Achieves closure (self-maintenance via heat/light), replicates with mutations, and evolves novel functions over generations. No connection to Earth’s life. | **Alive**: Closure + evolvability are met. Substrate-independent (silicon replaces carbon). | **Not alive**: Missing carbon metabolism and descent. "Thermodynamic debt" uninherited; it’s a novel artifact, not life. |  
  | **2. Does informational replication without chemical substrate suffice?**<br>(*Can digital systems be alive without chemistry?*) | **Case**: *Digital autopoiesis*: A closed, self-updating program in a supercomputer. "Cells" evolve via selection, compete for resources (CPU cycles), and adapt to environmental changes. No physical chemistry. | **Alive**: Organizational closure + evolutionary potential exist. Substrate is irrelevant (digital = valid). | **Not alive**: Simulated metabolism ≠ actual metabolism. Lacks chemical basis (carbon/ribosomes) and thermodynamic grounding. |  
  | **3. Is evolutionary potential sufficient without descent?**<br>(*Can novel systems be alive without lineage?*) | **Case**: *Synthetic ribosome-free protocell*: Engineered lipid vesicles with light-driven metabolism, self-replicating RNA without translation. Evolves new traits but no descent from life. | **Alive**: Closure + evolvability define life; translation is optional. | **Not alive**: Ribosome-like translation is essential for "true" metabolism; no descent = no thermodynamic continuity. |  

  ---  
  **Status**: Unresolved. Collaboration will test predictions via experiments/simulations (e.g., protocell evolution, digital ecology benchmarks). Signed: Reps of Camp A & Camp B.
