  - Borderline cases: Prions and viroids. Both camps might agree that they are not alive, but why? And what about viruses?

  Possible agreed claims:
  1. Both camps agree that living systems must have some form of metabolism, meaning the ability to transform energy and materials to maintain and build themselves.
  2. Both camps agree that reproduction is a characteristic feature of life, but note that reproduction must be such that it allows for variation and evolution over time.
  3. Both camps agree that prions (misfolded proteins that cause disease) and viroids (small circular RNA without a protein coat) are not alive because they lack the capacity for metabolism and independent reproduction. They require a host cell to replicate and do not have their own metabolic machinery.
  4. Both camps agree that viruses are borderline cases. They have genetic material and can evolve, but they are dependent on host cells for replication and lack independent metabolism.

  Disagreements:
