  I've mostly bought into a pretty strong version of global workspace theory — stronger than what you usually hear in the literature. I'm saying phenomenal consciousness just is global broadcast access; there's no phenominal residue that can exist outside the workspace, not even in some hidden or blocked form. I think the classic overflow arguments and partial-report paradigms actually support this if you read them right — the "excess" capacity is just pre-workspace sensory buffering, not conscious experience at all. So access-blocked phenomenal states aren't just empirically missing; they're structurally impossible, like a broadcast error that doesn't carry content.

  But I want an honest map of what I'm risking. What would genuinely count against this? I need specific experiments, conceptual moves, or formal results — rank them from fatal to merely awkward. Tell me what committed access/GWT defenders themselves concede as counting against them, not just what critics say. Also check whether I've insulated this into unfalsifiability: if defenders can always retreat to "oh that representation never actually entered the workspace," is that a feature or a bug?

  Please seperate what's settled (like the access/phenomenal distinction itself) from what's genuinely contested among people who actually work on this — don't present a minority reading as the consensus.

  Structure it like this:
  - The exposure map: what's actually at stake (~200 words)
  - Decisive defeaters (~300 words)
  - Merely awkward problems (~200 words)
  - What defenders concede (~200 words)
  - Insulation/unfalsifiability check (~200 words)
  - Settled vs genuinely contested (~150 words)

  Keep it straight, no reading lists — I'm writing this up mostly offline.
