answer: |-
  Here is the performance-legitimacy argument restated in control-theoretic terms, followed by a residue analysis:

  **Control-Theoretic Restatement:**

  1.  **System Definition:** The polity is modeled as a multi-input multi-output (MIMO) dynamic system in state-space. The system state vector `x(t)` encompasses socio-economic conditions, public sentiment, institutional health, and resource availability. Exogenous disturbances `d(t)` represent external shocks (e.g., global recessions, pandemics).
  2.  **Controller:** The State apparatus is the centralized controller `C`. It generates the control input vector `u(t)` (policy interventions: investment directives, regulatory changes, security measures).
  3.  **Target Trajectories:** The desired output vector `y_des(t)` consists of:
      *   `y1(t)`: High, sustained economic growth rate.
      *   `y2(t)`: Low level of public disorder (high social order).
  4.  **Feedback Channels:** Democratic participation mechanisms (elections, free press, civil society) are modeled as distributed sensor networks providing feedback measurements `y_m(t)` ≈ `y(t)`. These measurements are characterized as:
      *   High sensor noise `n(t)` (due to diverse/conflicting societal inputs, misinformation, short-term populist demands).
      *   Potentially high latency `τ` (delayed signal due to deliberative processes).
  5.  **Control Strategy:** Authoritarian consolidation implements a high-gain feedforward control strategy `C_ff` with significantly reduced reliance on noisy/distributed feedback `y_m(t)`.
      *   **High-Gain Feedforward:** Employs a precise, internally derived model of the system `G_hat` and desired trajectory `y_des(t)` to compute `u(t)`. High gain enables rapid trajectory tracking and strong disturbance rejection *if* `G_hat` is accurate.
      *   **Reduced Sensing:** Minimizes the feedback control component `C_fb` (low loop gain w.r.t. `y_m(t)`), treating participatory feedback primarily as noise `n(t)` to be filtered or ignored. Sensing focuses on narrow, state-selected indicators (e.g., GDP, crime statistics).
  6.  **Performance & Legitimacy:** Sustained low tracking error `e(t) = y_des(t) - y(t)` on `y1` and `y2` is defined as "Performance." "Legitimacy" `L(t)` is defined as the *stability margin* of the closed-loop system. Adequate performance (small `||e(t)||` over time `T`) implies robust stability (high gain/phase margin), signifying `L(t) > L_min`. This stability margin (`L`) justifies the high-gain/low-feedback controller structure `C_ff`.

  **Residue Report:**

  **I. Cleanly Translated Concepts:**
  1.  **Trade-off (Speed/Robustness vs. Noise Sensitivity):** The core engineering trade-off is preserved. High-gain feedforward offers potentially faster reference tracking (`y_des(t)`) and better rejection of *modeled* disturbances, but is highly sensitive to plant-model mismatch (`G ≠ G_hat`) and *unmodeled* disturbances. Reduced feedback lowers noise susceptibility but increases risk of instability if the internal model drifts or misses critical states. This directly corresponds to the argument that centralized control enables rapid development/order but risks misalignment if the state's model is flawed.
  2.  **Performance as Measurable Output:** Defining legitimacy based on observable outputs (`y1`, `y2`) maps directly to minimizing `e(t)`. Stability as a precondition for sustained operation is also fundamental.
  3.  **Distributed Feedback as Potential Noise Source:** The characterization of diverse participatory inputs as introducing measurement noise `n(t)` and latency `τ` is a genuine, common challenge in control (sensor fusion, filtering).

  **II. Concepts Surviving Only with Distortion:**
  1.  **Participation Solely as Noise/Latency:** While feedback *can* be noisy/delayed, control theory inherently values *accurate* feedback for robustness and adaptation. Reducing participation to *only* noise distorts its potential role as a source of critical state information (`x(t)`) for model adaptation (`G_hat` update) and detecting unmodeled dynamics (`ΔG`), essential for long-term stability. This framing biases the argument against participation.
  2.  **Legitimacy ≡ Stability Margin:** While sustained performance *requires* stability, equating legitimacy *solely* with stability margin distorts the political concept. In control theory, a system can be stable but operating at a wildly undesirable setpoint (`y_des` is arbitrary); legitimacy implies the *desirability* of `y_des(t)` itself, which is normative. Stability is necessary but not sufficient for political legitimacy.
  3.  **"Internal Model" (`G_hat`) as Unproblematic:** The argument assumes the state's model `G_hat` is sufficiently accurate and updatable *without* rich feedback. Control theory shows high-gain feedforward utterly depends on `G_hat` accuracy. The distortion lies in downplaying how `G_hat` drift (elite capture, ideological rigidity) or unmodeled dynamics (social change) inevitably occur without mechanisms (like substantive feedback) for continuous model identification.

  **III. Untranslatable Concepts (The Residue):**
  1.  **The Core Normative Claim (Outputs Legitimate Structure):** This has **no counterpart** in control theory. A controller (`C`) is a *tool*; its "legitimacy" isn't an internal system property derived from tracking performance. We design `C` based on desired performance *and* robustness criteria. The claim that good outputs (`y(t)≈y_des(t)`) automatically justify the controller's *structure* (high-gain, low-feedback) is an **external normative axiom**. Control theory can only say if the structure *achieves the outputs given the model*, not if it's "legitimate." Legitimacy, as a *moral/political justification*, is outside the framework.
  2.  **Consent/Right to Participation:** Control theory has no concept of a "right" for sensor nodes to provide feedback. The decision to include or exclude feedback is purely instrumental (improves/worsens performance/robustness?). The *normative* claim that participation is intrinsically valuable or a right doesn't map.
  3.  **Accountability Loops:** Control theory lacks the concept of *holding the controller accountable*. Feedback is for *information*, not sanctioning the controller. Mechanisms for replacing a poorly performing controller are external to the control loop itself.
  4.  **Arbitrariness of `y_des(t)`:** Control theory takes `y_des(t)` as given. How `y_des(t)` is set (e.g., by the controller itself, by external input) is outside the loop dynamics. The political debate over *who defines* prosperity and order (`y_des`) and *how* is untranslatable residue.

  **Analysis of Residue:**

  The untranslatable residue, particularly the core normative claim and the concepts of consent/rights/accountability, indicates a **genuine limitation of control-theoretic language for capturing the full scope of political legitimacy**. Control theory is descriptive of system dynamics and instrumental performance; it cannot adjudicate normative questions about justification, rights, or the intrinsic value of self-determination.

  However, the translation **also reveals a critical ambiguity in the performance-legitimacy thesis itself:**

  *   **The Ambiguity:** It conflates *system stability* (a technical condition for sustained operation) with *political legitimacy* (a moral/political condition for rightful authority). The translation makes this conflation explicit: `L(t)` is *defined* as stability margin derived from performance.
  *   **The Collapse:** Once made explicit, the ambiguity collapses under scrutiny. Control theory shows:
      *   Stability is necessary for *any* sustained operation, regardless of desirability.
      *   Good performance (`e(t) ≈ 0`) can be achieved by various controllers, not inherently justifying one structure (high-gain/low-feedback).
      *   The controller structure is chosen based on assumptions (model accuracy, noise levels) that are contestable and dynamic.
      *   The `y_des(t)` trajectory itself remains unjustified within the loop.
  *   **The Revelation:** The performance-legitimacy thesis depends on masking this conflation. It uses the *empirical observation* of stability/good performance under a specific controller structure to implicitly argue for its *normative legitimacy*, skipping the crucial normative step. The control-theoretic framework exposes this by cleanly separating the achievement of outputs/stability (which it can describe) from the justification of authority (which it cannot).

  **Conclusion:** The control-theoretic translation successfully models the *instrumental logic* and *trade-offs* of the performance-legitimacy argument. However, it reveals the argument's core normative claim—that outputs legitimate structure—as an external axiom, not an internal principle of control. The significant residue (consent, rights, accountability, definition of `y_des`) highlights the framework's limitation for political philosophy but, more crucially, exposes the performance-legitimacy thesis's reliance on conflating technical system stability with political-moral justification. This conflation collapses when the underlying mechanics are made explicit through the translation.
