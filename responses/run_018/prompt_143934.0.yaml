prompt: |-
  I work at a health-tech firm where our sepsis-risk model recently failed an equity audit: it is calibrated within demographic groups yet yields unequal false-negative rates, and leadership assumes this is correctable by rebalancing the training data. I need to lead a workshop for my data-science colleagues—engineers with no background in philosophy of science—showing that this tension is not a data-quality bug but an instance of the impossibility results in algorithmic fairness. Plan the teaching arc: the dependency order in which calibration within groups, predictive parity, and balanced error rates must be introduced, together with the structural prevalence assumption that forces the conflict; the single clinical scenario that should carry the explanation, specifying what structural feature it must display and what biological reductionism it must avoid; the misconceptions they will raise in sequence—fairness is one metric, removing protected attributes solves it, more data eliminates the trade-off—and the precise point in the sequence where each should be intercepted; a brief check I can use to confirm they understand the conflict as structurally unavoidable rather than technically pending; and which formal proof elements or notation I should explicitly set aside and declare out of scope.
reasoning: |-
  We are dealing with the impossibility results in algorithmic fairness, specifically the tension between calibration within groups and equal false-negative rates (FWR) when prevalence differs across groups. The plan for the workshop must introduce concepts in a logical dependency order, use a clinical scenario, address misconceptions, and include a check for understanding.

  ### Teaching Arc: Dependency Order
  1. **Start with the Problem**: The model failed an equity audit because it has unequal FWR across groups even though it is calibrated within each group.

  2. **Introduce Calibration within Groups**: 
     - Definition: For any predicted probability score `s`, the proportion of positive outcomes among individuals with score `s` is approximately `s`, and this holds within each demographic group.
     - Why it's important: It means the model's predictions are probabilistically accurate for each group.

  3. **Introduce False-Negative Rate (FNR) and False-Positive Rate (FPR)**:
     - FNR = P( predicted negative | actual positive) = 1 - Sensitivity (Recall)
     - FPR = P( predicted positive | actual negative) = 1 - Specificity
     - We are particularly concerned with FNR in the context of sepsis (missing a positive case is critical).

  4. **Balanced Error Rates (or Equalized Odds)**:
     - A fairness criterion that requires FPR and FNR to be equal across groups.

  5. **Predictive Parity (or Calibration)**:
     - We already introduced calibration (within groups). Now note that if we require calibration *across* groups (i.e., the same score `s` has the same meaning in all groups) then we have predictive parity by group.

  6. **The Conflict**:
     - We have calibration within groups (which we want) and we want equal FNR (which we also want). But we cannot have both simultaneously if the prevalence (base rate) of sepsis differs across groups.

  7. **Structural Prevalence Assumption**:
     - The prevalence (true positive rate) of sepsis is different across groups. This is a structural feature of the population and not a model artifact.

  ### Clinical Scenario
  - **Scenario**: Sepsis risk prediction in two groups: Group A (e.g., younger adults) and Group B (e.g., older adults). 
  - **Structural Feature**: The prevalence of sepsis is higher in Group B (older adults) than in Group A (younger adults). This is a real-world observation (structural) and not due to the model.
  - **Biological Reductionism to Avoid**: Do not imply that the difference in prevalence is solely due to biological factors (age). It may be due to a complex interplay of factors (socioeconomic, access to care, comorbidities, etc.). We are not reducing the cause to biology; we are acknowledging an observed difference in prevalence that may have multiple causes.

  ### Misconceptions and When to Intercept
  1. **Misconception 1: "Fairness is one metric"** 
     - Interception: After introducing the two fairness criteria (calibration and equal FNR). Emphasize that fairness is multidimensional and these are two distinct desirable properties that conflict.

  2. **Misconception 2: "Removing protected attributes solves it"**
     - Interception: When discussing the structural prevalence. Explain that even if the model does not use the protected attribute, the prevalence difference remains and the model will still reflect that in the predictions. Removing the attribute does not remove the underlying structural difference.

  3. **Misconception 3: "More data eliminates the trade-off"**
     - Interception: After showing the conflict. Explain that the conflict is mathematical and due to the base rate difference. More data will not change the base rates; it will only make the model more accurately reflect the existing difference.

  ### Check for Understanding
  - **Brief Check**: Present a hypothetical: 
     - Group A: prevalence 1%, Group B: prevalence 10%. 
     - The model is calibrated within groups. 
     - For a threshold that yields 90% recall in Group B, what happens in Group A? 
     - They should reason that to achieve calibration, the model must assign lower scores on average in Group A. Thus, at the same threshold, the recall (sensitivity) in Group A will be lower (because the model is less likely to assign high scores to the few positives in Group A). Therefore, the FNR (which is 1-recall) would be higher in Group A. 
     - This conflict is unavoidable because of the prevalence difference.

  ### Formal Proof Elements to Set Aside
  - Do not derive the entire impossibility theorem (e.g., the exact equations from Chouldechova or Kleinberg et al.) but state the result: when prevalence differs, calibration within groups and equal FNR are incompatible.
  - Set aside the mathematical notation for conditional probabilities and expectations. Instead, use intuitive explanations and the clinical scenario.
  - Avoid discussing the precise trade-off in terms of cost functions or optimization.

  ### Workshop Flow Outline
  1. **Introduction**: The audit finding and leadership's assumption (5 min)
  2. **Key Concepts** (30 min):
     - Calibration within groups (with examples)
     - FNR and why it matters for sepsis
     - Balanced error rates (equal FNR) as a fairness goal
     - Prevalence and its structural nature
  3. **Clinical Scenario** (10 min): 
     - Present the two groups with different prevalences.
     - Show how calibration within groups and equal FNR conflict in this scenario.
  4. **Address Misconceptions** (10 min): 
     - Go through each misconception and refute.
  5. **Check for Understanding** (5 min): 
     - Pose the hypothetical and discuss.
  6. **Conclusion** (5 min): 
     - This is a structural issue, not a data quality issue. 
     - We must choose which fairness criterion to prioritize (with stakeholders) and understand the trade-offs.

  Total: ~65 minutes. Allow 5 minutes for buffer and questions.

  ### Additional Notes
  - Use visual aids: graphs showing calibration curves for two groups and how the FNR differs.
  - Emphasize that the problem is not solvable by technical means alone and requires ethical and policy decisions.
answer: |-
  ### Workshop Teaching Plan: Understanding the Impossibility of Fairness Trade-offs  
  **Objective**: Demonstrate that unequal false-negative rates (FNRs) despite group-wise calibration stem from structural prevalence differences—not data issues—and are mathematically unavoidable.  

  ---

  #### **1. Teaching Arc: Dependency Order**  
  Introduce concepts in this sequence to build logical dependency:  
  - **Step 1: Calibration Within Groups**  
    - **Definition**: For any predicted risk score \(s\), the proportion of actual sepsis cases ≈ \(s\) *within each group* (e.g., if 100 patients are predicted 10% risk, ~10 have sepsis).  
    - **Why start here**: Audit confirmed this holds. Emphasize this is a **desirable property** (model is "honest" for each group).  

  - **Step 2: False-Negative Rate (FNR)**  
    - **Definition**: FNR = % of actual sepsis cases missed by the model (1 - recall).  
    - **Clinical importance**: High FNR = missed sepsis (life-threatening).  
    - **Fairness goal**: Equal FNR across groups (e.g., Black vs. white patients miss sepsis at the same rate).  

  - **Step 3: Balanced Error Rates (BER)**  
    - **Definition**: Equal FNR *and* equal FPR across groups (a stricter fairness criterion).  
    - **Relevance**: Leadership wants equal FNR (a component of BER), but BER is incompatible with calibration under prevalence differences.  

  - **Step 4: Structural Prevalence Assumption**  
    - **Key conflict driver**: Prevalence \(P(\text{sepsis} \mid \text{group})\) differs across groups (e.g., due to systemic factors like access to care, comorbidities).  
    - **Mechanism**:  
      - Calibration forces predicted risk distributions to mirror each group’s true prevalence.  
      - If prevalence is lower in Group A, the model assigns lower risk scores *on average* to Group A.  
      - To achieve equal FNR, the *same risk threshold must work for both groups*, but thresholding a lower-risk distribution in Group A yields higher FNR (fewer high-risk cases to capture).  
    - **Equation-free intuition**:  
      > "Calibration locks each group to its own prevalence. Equal FNR requires forcing thresholds to behave identically despite different risk landscapes."  

  ---

  #### **2. Clinical Scenario**  
  **Scenario**: Sepsis prediction in two age groups: **Group Y** (ages 20–40) and **Group O** (ages 65+).  
  - **Structural feature**: Prevalence is 2% in Group Y and 15% in Group O (due to weaker immune systems, comorbidities, or healthcare delays).  
  - **Biological reductionism trap to avoid**:  
    - **Do not** claim prevalence gaps are "innate" to age.  
    - **Instead**: Frame prevalence as structural (shaped by systemic factors like chronic disease burden, inequitable care access).  
    - **Example language**:  
      > "Group O’s higher prevalence isn’t ‘because they’re old’—it’s because society fails to provide adequate preventative care for chronic conditions."  

  **Conflict demonstration**:  
  - Model calibrated: For Group Y, 5% predicted risk → 5% actual sepsis; for Group O, 20% risk → 20% actual.  
  - To catch 90% of sepsis cases (FNR=10%):  
    - Group O: Threshold at risk ≥15% works (high prevalence → many cases above threshold).  
    - Group Y: Threshold must be lowered to risk ≥2% to catch enough cases. But this floods Group Y with false positives (poor clinical utility).  
  - **Trade-off**: Equal FNR requires *ignoring calibration*, risking overtreatment in Group Y.  

  ---

  #### **3. Misconceptions & Interception Points**  
  Intercept these **in sequence** during the arc:  
  - **Misconception 1**: *"Fairness is one metric we can optimize."*  
    - **Interception**: After introducing calibration and FNR.  
    - **Response**: "These are two distinct goals. Calibration ensures reliability; equal FNR ensures equitable harm distribution. You can’t have both under prevalence gaps."  

  - **Misconception 2**: *"Removing protected attributes (e.g., race/age) fixes bias."*  
    - **Interception**: After structural prevalence.  
    - **Response**: "Prevalence differences persist even without protected attributes. The model learns proxies (e.g., zip codes, medication usage), perpetuating the gap."  

  - **Misconception 3**: *"More/better data eliminates the trade-off."*  
    - **Interception**: After demonstrating the conflict.  
    - **Response**: "Better data improves calibration but won’t erase prevalence gaps—they’re societal. Resampling data shifts the problem but doesn’t resolve it."  

  ---

  #### **4. Check for Understanding**  
  **Quick diagnostic question**:  
  > "Suppose Group A has 5% sepsis prevalence, and Group B has 20%. If the model is perfectly calibrated in both groups, and we set a threshold giving 10% FNR in Group B, what happens to Group A’s FNR?"  

  **Correct answer**: Group A’s FNR **must be higher** (e.g., 30–40%).  
  - **Why**: To achieve 10% FNR in high-prevalence Group B, the threshold is high. In low-prevalence Group A, few cases exceed this threshold → higher misses.  
  - **Passing criterion**: If they articulate prevalence as the root cause (not "we need better features"), they grasp the structural conflict.  

  ---

  #### **5. Formal Elements to Set Aside**  
  Explicitly **exclude**:  
  - **Proofs**: Chouldechova’s theorem (2017) or Kleinberg’s incompatibility (2016).  
  - **Notation**: Conditional probability equations (e.g., \(P(Y=1 \mid S=s, G=g) = s\)).  
  - **Declaration**:  
    > "We’re focusing on intuition, not measure theory. The takeaway is this conflict is **provably unavoidable** under prevalence differences—not a technical shortcoming."  

  ---

  ### Workshop Flow Summary  
  | **Phase**           | **Time** | **Key Activity**                                  |  
  |----------------------|----------|--------------------------------------------------|  
  | **Intro**           | 5 min   | Audit failure & leadership’s "data rebalancing" hope. |  
  | **Calibration**     | 10 min  | Define + clinical example.                      |  
  | **FNR/BER**         | 10 min  | Define + clinical stakes.                       |  
  | **Prevalence**      | 10 min  | Structural roots + scenario walkthrough.        |  
  | **Conflict**        | 10 min  | Demo trade-off + intercept misconceptions.      |  
  | **Check**           | 5 min   | Diagnostic question + discussion.               |  
  | **Conclusion**      | 5 min   | "No technical fix; prioritize ethically."       |  

  **Total**: 55 minutes (flexible Q&A).  
  **Outcome**: Engineers understand that prevalence-driven fairness trade-offs require **stakeholder choices** (e.g., prioritize calibration vs. FNR equality), not just engineering.
