prompt: |-
  Hey, I've been editing for a rationalist-leaning longform magazine (mostly science/history) and we're getting swamped with pitches that sit right on the border between "controversial but legit revisionism" and full-on pseudohistory. I need a reusable decision procedre -- like a checklist my research team can actually run in about 20 minutes -- that turns the philosophy-of-science demarcation idea into something operational.

  Specifically, I'm thinking the core principle is that pseudohistory doesn't just get facts wrong; it builds in insulation from the kinds of correction that work in neighboring disciplines (archaeology, physics, philology, statistics). Legitimate revisionism stays exposed to those corrections even when it's wrong. I want that turned into ordered questions with pass/fail/unclear, clear stop points, and explicit flags where a human has to make a values call rather than apply a rule.

  Please include:
  - The actual flow in words, with branching logic spelled out.
  - For each step: the exact question, what counts as sufficient to move on, and where the step forces a judgment call that can't be automated.
  - Three worked examples:
    1. A pitch arguing Atlantis was a real Bronze Age civilization but mislocated (uses some geological data, references ancient texts selectively).
    2. Fomenko-style New Chronology arguing that conventional medieval chronology is a forgery and timelines are compressed.
    3. One where the procedure gives an answer I'll dislike: a well-funded archaeological pitch that uses real radiocarbon dating but embeds the results in an auxiliary hypothesis (e.g., "local contamination patterns are systematically misread by mainstream labs") that protects a radical claim from falsification.

  Also be explicit about what this procedre flat-out can't settle, and please don't include a bibliography or citation list -- I want something a model can generate without web access, and my team won't have one either.

  One more constraint: I want to make sure we don't drop the distinction between "this claim is false" and "this claim is pseudohistorical" -- those should come out at different steps in the flow.
reasoning: |-
  We are designing a decision procedure (checklist) for evaluating historical pitches to distinguish between legitimate revisionism and pseudohistory. The core idea is that pseudohistory insulates itself from correction by neighboring disciplines.

  The procedure will have a series of steps with questions. Each step must be passed (or resolved) to move to the next. The outcome can be:
  - Pass: The pitch moves to the next step or is accepted for further consideration (if all steps passed).
  - Fail: The pitch is rejected as pseudohistorical.
  - Unclear: Requires human judgment or further investigation (with a note on what is unclear).

  We also note that the procedure must separate:
  - Step(s) that identify if the claim is false (but might be legitimate revisionism) vs.
  - Step(s) that identify pseudohistorical characteristics (insulation from correction).

  The flow:

  **Step 1: Falsifiability Check**
     - Question: Can the central claim(s) of the pitch be falsified by evidence from at least one of the neighboring disciplines (archaeology, physics [including dating methods], philology, statistics)? 
     - Pass: Yes, the central claim is stated in such a way that it can be tested by one or more of these disciplines. Move to Step 2.
     - Fail: No, the central claim is unfalsifiable by any of these disciplines. Stop: Pseudohistory.
     - Unclear: It is not immediately clear whether the claim can be falsified. Flag for human judgment (with a note on which discipline might falsify it and why it's unclear).

  **Step 2: Response to Existing Evidence**
     - Question: Does the pitch engage with the existing body of evidence from the relevant disciplines? Specifically, does it address the strongest counter-evidence from at least one neighboring discipline?
     - Pass: Yes, it addresses the strongest counter-evidence (e.g., by attempting to refute, reinterpret, or explain it within the framework of the theory). Move to Step 3.
     - Fail: No, it ignores the strongest counter-evidence, dismisses it without substantive argument, or claims that the evidence is irrelevant. Stop: Pseudohistory.
     - Unclear: The pitch addresses some counter-evidence but it's unclear if it's the strongest, or the engagement is superficial. Flag for human judgment (with a note on which evidence is missing or inadequately addressed).

  **Step 3: Auxiliary Hypothesis Check**
     - Question: Does the pitch rely on auxiliary hypotheses that are independently testable and falsifiable? (Note: We are looking for hypotheses that are not ad hoc and can be investigated without assuming the truth of the main claim.)
     - Pass: Any auxiliary hypotheses (e.g., about contamination, bias, etc.) are themselves falsifiable by methods from neighboring disciplines and are not designed solely to protect the main claim. Move to Step 4.
     - Fail: The pitch relies on one or more auxiliary hypotheses that are unfalsifiable or that are only testable by assuming the main claim is true (circular). Stop: Pseudohistory.
     - Unclear: The auxiliary hypotheses are partially testable but with significant caveats. Flag for human judgment (with a note on the specific auxiliary hypothesis and the testability issue).

  **Step 4: Methodological Transparency**
     - Question: Does the pitch provide sufficient detail about the methods used so that they could be replicated or independently verified by experts in the relevant disciplines?
     - Pass: Yes, the methods are described in enough detail that an independent expert could attempt to replicate the results. Move to Step 5.
     - Fail: No, the methods are opaque, proprietary, or described in a way that prevents independent verification. Stop: Pseudohistory.
     - Unclear: Some methods are clear but others are not, or the description is ambiguous. Flag for human judgment (with a note on what is missing).

  **Step 5: Peer Review and Precedents**
     - Question: Has the core of the argument (or a substantially similar argument) been subjected to peer review in a relevant academic discipline? Or, if not, are there clear precedents in the academic literature for the methods and reinterpretations being proposed? (Note: This step is about whether the approach is within the bounds of legitimate academic discourse, not about whether it is correct.)
     - Pass: Yes, the argument (or its core) has been peer-reviewed OR there are clear precedents for the methods and reinterpretations. This is a candidate for legitimate revisionism (even if false). Move to Step 6 for a final check.
     - Fail: No, and the pitch dismisses peer review as fundamentally flawed or biased without providing a viable alternative system of validation. Stop: Pseudohistory.
     - Unclear: There is some peer-reviewed work that is tangentially related but not directly on point, or the precedents are contested. Flag for human judgment (with a note on the gaps).

  **Step 6: Final Check for Insulation**
     - Question: Taking the entire pitch as a whole, does it build in mechanisms that would insulate it from correction by evidence from neighboring disciplines? (This is a holistic step to catch any insulation that might have slipped through.)
     - Pass: No, the pitch remains open to correction by evidence from neighboring disciplines. Outcome: Legitimate revisionism (even if likely false). Proceed to editorial evaluation (for interest, writing, etc.).
     - Fail: Yes, the pitch has built-in insulation (e.g., it claims that any counter-evidence must be forged, or that the methods of the discipline are fundamentally incapable of assessing the claim). Stop: Pseudohistory.
     - Unclear: There are elements that might be insulating but they are not dominant. Flag for human judgment (with a note on the concerns).

  Now, we apply the procedure to the three examples:

  **Example 1: Atlantis as a real Bronze Age civilization (misplaced)**
  - Step 1: Falsifiability Check
    - The claim that Atlantis existed and was mislocated is falsifiable by archaeology (if we excavate the proposed location and find nothing) and by geology (if the proposed geological mechanisms are impossible). Pass.
  - Step 2: Response to Existing Evidence
    - The pitch selectively references ancient texts and geological data. It must address the lack of archaeological evidence for a major civilization in the proposed location and the reasons why the traditional location (if any) is wrong. If it ignores the absence of evidence in the proposed location, that would be a failure. Let's assume it addresses it by saying that the civilization was destroyed without a trace. This is inadequate because it doesn't explain why there is no trace (and archaeology would expect some). Fail? But let's see: if it argues that the geological event destroyed all evidence, that might be an auxiliary hypothesis. However, in Step 2, we require engagement with the strongest counter-evidence. If the pitch does not engage with the fact that no known Bronze Age civilization matches the description in the area, it fails. Typically, Atlantis pitches do not adequately address the lack of evidence. So, likely Fail -> Pseudohistory. But for the sake of example, let's assume it passes to Step 3.
  - Step 3: Auxiliary Hypothesis Check
    - The auxiliary hypothesis might be that a geological catastrophe destroyed all evidence. Is this independently testable? We can test whether such a catastrophe occurred in the proposed location and time (via geology). So, Pass? But note: the hypothesis must not be ad hoc. If the geological catastrophe is only invoked for Atlantis and not for other contemporary civilizations, it might be ad hoc. However, if there is geological evidence for such an event, then it's testable. So, Pass (if there is evidence) or Unclear. Let's assume Pass.
  - Step 4: Methodological Transparency
    - How was the location determined? If the methods are clear (e.g., based on textual analysis and geological data), then Pass. If vague, Fail. We'll assume Pass.
  - Step 5: Peer Review and Precedents
    - Atlantis theories are generally not published in peer-reviewed journals. There are no clear precedents in mainstream archaeology. Fail -> Pseudohistory. (But note: if the pitch is based on a new geological study that was peer-reviewed, then it might pass. However, the central claim about Atlantis is still without peer review. So, likely Fail.)
  - Step 6: Final Check for Insulation
    - If we got this far, we would check for insulation. Often, Atlantis theories say that the lack of evidence is due to the catastrophe, which is an auxiliary hypothesis we already considered. But if they also say that mainstream archaeology is ignoring the truth, that might be insulation. However, we already failed at Step 5.

  Given the above, the pitch would likely fail at Step 2 or Step 5. So, outcome: Pseudohistory.

  **Example 2: Fomenko-style New Chronology**
  - Step 1: Falsifiability Check
    - The claim that conventional chronology is wrong and timelines are compressed is falsifiable by multiple disciplines: radiocarbon dating, dendrochronology, astronomy (records of eclipses), and philology (textual analysis). Pass.
  - Step 2: Response to Existing Evidence
    - Fomenko typically dismisses radiocarbon dating by claiming it is unreliable for the period, and reinterprets astronomical records. Does he address the strongest counter-evidence? For example, the consistency of dendrochronology with radiocarbon? If he dismisses without substantive argument, then Fail. Fomenko does dismiss these methods, so likely Fail -> Pseudohistory. But let's proceed for completeness.
  - Step 3: Auxiliary Hypothesis Check
    - The auxiliary hypotheses might be that radiocarbon dating is systematically distorted (by an unknown factor) and that historical records are forged. Are these testable? The distortion of radiocarbon dating could be tested by comparing with other methods (like dendrochronology) but Fomenko dismisses those too. The forgery hypothesis is hard to test without assuming the new chronology. So, Fail (unfalsifiable auxiliary hypotheses) -> Pseudohistory.
  - Step 4: (If we got here) Methodological Transparency
    - Fomenko uses statistical methods to analyze texts and astronomical events. The methods might be transparent, so Pass? But we likely failed earlier.

  Outcome: Pseudohistory (fails at Step 2 or 3).

  **Example 3: Well-funded archaeological pitch with radiocarbon dating but an auxiliary hypothesis of systematic contamination**
  - Step 1: Falsifiability Check
    - The central claim (e.g., that a site is much older than conventionally thought) is falsifiable by radiocarbon dating and other methods. Pass.
  - Step 2: Response to Existing Evidence
    - The pitch must address why previous radiocarbon dates from the same site (or similar sites) are different. If it argues that previous samples were contaminated and explains why, then it might pass. Let's assume it does. Pass.
  - Step 3: Auxiliary Hypothesis Check
    - The auxiliary hypothesis: "local contamination patterns are systematically misread by mainstream labs." Is this independently testable? Yes: one could take samples from the same site (or similar sites) and have multiple labs (including independent ones) test them, or test the contamination patterns. The hypothesis must not be circular. If the only evidence for contamination is the discrepancy with the expected date (based on conventional chronology), then it might be ad hoc. But if there is physical evidence of a contaminant (e.g., a particular mineral) that can be tested for, then it's testable. 
      - However, note the word "systematically": if the claim is that mainstream labs are systematically misreading contamination patterns in a way that always makes dates younger (or older), then that is testable by having multiple labs (including the mainstream ones) re-run the tests with different protocols. But if the pitch claims that only their lab can do it correctly because they have a special method, then we need to check Step 4.
      - Let's assume the pitch provides evidence for the contaminant and shows that their method corrects for it. Then Pass. But if the auxiliary hypothesis is that the contamination is undetectable by standard methods, then it becomes unfalsifiable? That would be a Fail. We'll assume the latter: they claim that the contamination is of a kind that only their specialized method can detect, and they don't provide a way for others to test for it without using their proprietary method. Then, Fail -> Pseudohistory.
  - Step 4: (If we passed Step 3) Methodological Transparency
    - If they don't disclose the method for detecting the contamination, then Fail. But if they do, then Pass. However, we are assuming they don't, so Fail.

  Outcome: Pseudohistory (fails at Step 3 or 4). But note: the editor might dislike this outcome because the pitch is well-funded and uses real radiocarbon dating. However, the procedure flags it as pseudohistorical because of the insulation.

  What the procedure can't settle:
  - The absolute truth of a claim.
  - The value of publishing a piece that is legitimate revisionism but likely false (that's an editorial judgment about interest, etc.).
  - Cases where the evidence is genuinely ambiguous and the pitch is on the edge of the academic consensus. The procedure will flag these as "unclear" and require human judgment.
  - Novel claims that don't have peer review but are methodologically sound (Step 5 might be a hurdle, but the pass condition includes precedents for the methods, so if the methods are standard, it might pass).

  Final note: The procedure separates false claims (which can pass until Step 6) from pseudohistorical ones (which fail at any step). A false claim that is legitimate revisionism would pass all steps until Step 6 (and then pass Step 6) and be considered for publication on its merits. A pseudohistorical claim fails at one of the steps and is rejected.
answer: |-
  Below is a reusable 20-minute decision procedure designed to operationalize the demarcation between legitimate revisionism and pseudohistory. The core principle focuses on **insulation from correction**: pseudohistory systematically avoids engagement with standard disciplinary corrections (archaeology, physics, philology, statistics), while legitimate revisionism remains exposed to them even when incorrect. 

  The procedure separates:  
  - **Factual falsehood** (identified in Steps 1-3): The claim may be wrong but correctable via normal disciplinary methods.  
  - **Pseudohistorical insulation** (identified in Steps 4-6): The claim is structured to evade correction, making it non-scientific.  

  **Procedure Flow**  
  1. **Start at Step 1.** Proceed sequentially.  
  2. **At any "Fail"**: Reject as pseudohistory. Stop.  
  3. **At any "Unclear"**: Flag for human judgment (specify why). Pause until resolved.  
  4. **Pass all steps**: Classify as legitimate revisionism (even if likely false). Proceed to editorial evaluation.  
  5. **Steps 4–6** explicitly test for insulation; failure here overrides earlier passes.  

  ---

  ### **Step 1: Falsifiability of Core Claim**  
  **Question**: Can the central claim be disproven using standard methods from at least two relevant disciplines (e.g., archaeology + physics, philology + statistics)?  
  - **Pass**: Yes. Claim is testable via empirical/interdisciplinary correction (e.g., radiocarbon dating could disprove a timeline; textual analysis could invalidate a source interpretation).  
  - **Fail**: No. Claim is immune to falsification (e.g., "Evidence against Atlantis was destroyed in the cataclysm").  
  - **Unclear**: Only one discipline applies, or testability is ambiguous.  
  **Judgment Call**: Deciding if a proposed test is methodologically valid (e.g., is "reinterpreting all contradictory texts" a real test?).  

  ### **Step 2: Engagement with Existing Evidence**  
  **Question**: Does the pitch address the strongest direct counter-evidence from relevant disciplines without dismissing it as invalid?  
  - **Pass**: Yes. Counters evidence using standard academic practices (e.g., reinterpreting data, offering new analysis).  
  - **Fail**: No. Dismisses counter-evidence as fabricated/irrelevant (e.g., "Mainstream archaeology ignores the truth").  
  - **Unclear**: Addresses weak counter-evidence but omits major points.  
  **Judgment Call**: Assessing what constitutes "strongest counter-evidence" for the claim.  

  ### **Step 3: Auxiliary Hypothesis Testability**  
  **Question**: Are any auxiliary hypotheses (e.g., "contamination skewed all lab results") independently falsifiable using standard disciplinary tools?  
  - **Pass**: Yes. Hypotheses can be tested without assuming the core claim (e.g., running new contamination tests on samples).  
  - **Fail**: No. Hypotheses are circular, untestable, or require accepting the core claim first (e.g., "Our chronology proves the contamination").  
  - **Unclear**: Testability is theoretically possible but practically unfeasible.  
  **Judgment Call**: Determining if an auxiliary hypothesis is ad hoc (invented to protect the claim) vs. grounded in prior research.  

  ### **Step 4: Correction Mechanism**  
  **Question**: Does the pitch allow its central claim to be overturned by new evidence from relevant disciplines without invoking exceptional criteria?  
  - **Pass**: Yes. New data could falsify the claim without requiring "special" rules (e.g., new archaeological digs could settle it).  
  - **Fail**: No. Insulates the claim (e.g., "Any contrary evidence must be forged").  
  - **Unclear**: Some corrections allowed, but others require extraordinary proof.  
  **Judgment Call**: Whether "exceptional criteria" undermine normal disciplinary processes.  

  ### **Step 5: Methodological Transparency**  
  **Question**: Could experts in relevant fields replicate/verify the methods using publicly available data and standard tools?  
  - **Pass**: Yes. Methods/data are transparent and replicable (e.g., lab protocols shared).  
  - **Fail**: No. Methods are opaque, proprietary, or require "secret knowledge."  
  - **Unclear**: Partial transparency (e.g., data shared but analysis obscure).  
  **Judgment Call**: Gauging sufficiency of detail for replication.  

  ### **Step 6: Integration with Disciplinary Progress**  
  **Question**: Does the pitch treat neighboring disciplines as capable of self-correction, or does it claim they are fundamentally flawed?  
  - **Pass**: Yes. Allows for convergence with other fields (e.g., "Revised chronology could refine radiocarbon calibration").  
  - **Fail**: No. Asserts entire fields are incompetent/corrupt (e.g., "Philologists conspire to hide the truth").  
  - **Unclear**: Mixed stance (e.g., critiques specific scholars but not the field).  
  **Judgment Call**: Distinguishing valid criticism from blanket dismissal of disciplines.  

  ---

  ### **Worked Examples**  
  #### **Example 1: Atlantis as Misplaced Bronze Age Civilization**  
  - **Step 1 (Falsifiability)**: Pass. Claim could be falsified by archaeology (no Bronze Age artifacts in proposed location) or geology (no evidence of cataclysm).  
  - **Step 2 (Evidence Engagement)**: Fail. Selectively uses Plato while ignoring lack of archaeological evidence for transoceanic Bronze Age contact. Dismisses counter-evidence as "lost to time." → **Pseudohistory** (Stop).  
  - **Why insulation?** Uses "destruction of evidence" to avoid correction.  

  #### **Example 2: Fomenko-Style New Chronology**  
  - **Step 1 (Falsifiability)**: Pass. Compressed timelines could be falsified by radiocarbon dating or astronomical records.  
  - **Step 2 (Evidence Engagement)**: Fail. Dismisses radiocarbon dating as "calibrated incorrectly" and texts as "medieval forgeries" without evidence.  
  - **Step 3 (Auxiliary Hypotheses)**: Fail. "All dating methods are miscalibrated" is untestable without assuming the chronology is true. → **Pseudohistory** (Stop).  
  - **Why insulation?** Asserts all counter-evidence is fraudulent.  

  #### **Example 3: Well-Funded Archaeological Pitch with Radiocarbon Dating**  
  *Claim: "Local contamination patterns systematically misread by labs" to support a 5,000-year-older settlement date.*  
  - **Step 1 (Falsifiability)**: Pass. Central claim (older date) falsifiable via retesting samples.  
  - **Step 2 (Evidence Engagement)**: Pass. Engages with existing radiocarbon data by proposing contamination.  
  - **Step 3 (Auxiliary Hypotheses)**: Unclear → **Human judgment**. Hypothesis is testable (e.g., analyze contamination in other samples) but could be ad hoc if no prior evidence for "systematic misreading."  
  - **Step 4 (Correction Mechanism)**: Fail. Asserts mainstream labs *always* misread contamination, making independent verification impossible. → **Pseudohistory** (Stop).  
  - **Why you’ll dislike this**: Uses real data and methods initially, but embeds insulation by discrediting all external correction.  

  ---

  ### **What This Procedure Cannot Settle**  
  1. **Non-falsifiable but culturally valuable claims** (e.g., speculative oral history).  
  2. **Claims where evidence is genuinely ambiguous** and both sides use sound methods.  
  3. **Political/moral implications** (e.g., a revisionist claim that is correct but ethically fraught).  
  4. **Novel methods not yet integrated into disciplines** (relies on human judgment for "disciplinary readiness").  
  5. **Truth determination**—only assesses if the claim is structured to evade correction. A "legitimate revisionism" outcome may still be factually wrong.  

  ### **Output Summary**  
  - **Pseudohistory**: Fails any step from 1–6 due to insulation.  
  - **Legitimate revisionism**: Passes all steps; exposed to correction but may be false.  
  - **Human judgment needed**: At "Unclear" flags or where ad hoc hypotheses/methodological validity is disputed.  

  This procedure prioritizes **insulation detection** over factual accuracy, ensuring the distinction you requested. Use the "Unclear" flags to escalate borderline cases to senior editors.
