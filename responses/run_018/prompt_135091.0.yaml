answer: |-
  ## Joint Statement on Sovereignty, Democratic Deficit, and Ever-Closer Union in the European Union

  **Preamble:**  
  Notwithstanding our profound differences regarding the optimal locus of democratic legitimacy within the European Union, we, an intergovernmentalist and an advocate of ever-closer union, engaged in good-faith adversarial collaboration on the contested concepts of sovereignty, the democratic deficit, and the principle of ever-closer union. Through rigorous debate, we seek to clarify points of agreement, articulate our core disagreements precisely, and identify specific cruxes requiring further analysis to advance understanding. We introduce the analytical constructs of **linear delegation** (authority transferred upward irreversibly, without guaranteed real-time national parliamentary control mechanisms) and **recursive delegation** (authority delegated upward but subject to real-time recall or veto via networked national parliamentary oversight) to describe competing interpretations of EU institutional dynamics.

  **(1) Agreed Claims:**

  1.  **Formal Allocation of Authority:** Legislative authority within the EU is shared between the Council of the European Union (representing Member State governments) and the European Parliament (directly elected). Executive authority is primarily vested in the European Commission, which holds the exclusive right of legislative initiative in most policy areas.
  2.  **Key Mechanisms Creating Distance:** Significant distance between voters and EU decision-makers arises from:
      *   The Council's composition as an intergovernmental body (ministers from national governments), where decision-making often involves Qualified Majority Voting (QMV), diluting direct national voter influence over specific outcomes.
      *   The Commission's exclusive right of initiative, meaning legislative proposals originate from an unelected body, though subject to parliamentary amendment and Council approval.
  3.  **European Parliament Powers:** The European Parliament (EP) possesses substantial powers under the Ordinary Legislative Procedure (co-decision), enabling it to amend, approve, or reject most EU legislation jointly with the Council. It also holds significant budgetary powers, including final approval of the EU budget and oversight of implementation.
  4.  **"Ever-Closer Union" in Law:** The phrase "ever-closer union among the peoples of Europe" holds legal status as an objective stated in Article 1 of the Treaty on European Union (TEU). Its practical legal implications for sovereignty transfer are subject to interpretation and constrained by the principles of conferral, subsidiarity, and proportionality.
  5.  **Sovereignty Pooling Dynamics:** The delegation of competences to the EU level (*sovereignty pooling*) can be interpreted through the lenses of:
      *   **Linear Delegation:** Authority is transferred upwards to the EU level. While national parliaments possess ex-post scrutiny powers (e.g., subsidiarity checks under Protocol No 2) and ultimate treaty-change vetoes, they lack guaranteed, real-time mechanisms to directly veto or recall specific legislative acts initiated by the Commission and adopted by QMV in Council and EP.
      *   **Recursive Delegation:** Authority loops back to national parliaments through networked mechanisms: the requirement for national governments (mandated by and accountable to their national parliaments) to negotiate and vote within the Council; the subsidiarity early warning system (albeit limited); the necessity of national ratification for treaty changes; and the ultimate possibility of Member State withdrawal. This creates a system where delegated authority remains indirectly anchored to national democratic mandates.

  **(2) Disagreements Table:**

  | Issue                                                                 | Intergovernmentalist Formulation                                                                                                                                 | Supranationalist Formulation                                                                                                                                                             | Crux Reference |
  | :-------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------- |
  | **1. Unified Demos Requirement:** Is a single European demos necessary for democratic legitimacy of pooled sovereignty? | Democratic legitimacy at the EU level is fundamentally constrained by the absence of a unified European demos sharing a common political identity and public sphere; legitimacy primarily resides with and flows from national democracies. | Pooled sovereignty creates a novel form of transnational citizenship and democratic space, where legitimacy derives from the direct election of the EP and majority rule, fostering a developing European demos. | Crux (a)      |
  | **2. Reversibility of Sovereignty Pooling:** Can significant pooled competences be practically repatriated without dismantling core EU functions (e.g., internal market)? | Significant repatriation of competences to national parliaments is both democratically necessary and practically feasible without dismantling the internal market, provided reciprocal recognition of standards and mutual cooperation are maintained. | Repatriating core competences (e.g., common commercial policy, competition, key market regulations) pooled to enable the internal market is practically impossible without dismantling the integrated legal and economic order itself. | N/A           |
  | **3. Impact of Co-Decision:** Has the EP's co-decision power eliminated the core democratic deficit? | The extension of co-decision, while a procedural improvement, masks rather than eliminates the core democratic deficit, as the system's foundational intergovernmental elements (Council QMV, Commission initiative) circumvent direct voter authorisation and accountability. | The empowerment of the European Parliament through co-decision constitutes a fundamental shift, establishing a bicameral legislature where laws require direct democratic assent, progressively mitigating the democratic deficit. | Crux (b)      |

  **(3) Cruxes:**

  We identify the following unresolved questions (cruxes) as pivotal. Resolution of these cruxes through evidence or argument would significantly alter the assessment of at least one party regarding the democratic viability of the current or evolving EU structure.

  *   **Crux (a): Separation of Authorisation and Performance Legitimacy**  
      *   **Shared Question:** Can the legitimacy derived from the *authorisation* of power via direct electoral mandates (national or European) be meaningfully separated and assessed independently from the legitimacy derived from the perceived *performance* and effectiveness of that power in solving transnational problems when evaluating pooled sovereignty?
      *   **Relevant Analysis:** Assessment of citizen attitudes (e.g., Eurobarometer surveys, academic studies) regarding trust in EU institutions: does trust correlate more strongly with perceptions of effectiveness or with perceptions of democratic representativeness and control? Historical analysis of public acceptance of major EU decisions (e.g., Single Market, Euro, crisis responses) – was acceptance driven more by perceived democratic mandate or by perceived necessity/effectiveness?
      *   **Intergovernmentalist Prediction:** Analysis will show that perceived deficits in *authorisation legitimacy* (lack of direct national control, weak EP identification) persistently undermine acceptance, even when performance is adequate, and that performance legitimacy alone is insufficient for long-term democratic health.
      *   **Supranationalist Prediction:** Analysis will demonstrate that for complex transnational issues, citizens prioritise effective problem-solving (*performance legitimacy*), and that acceptance of pooled sovereignty grows as its effectiveness is demonstrated, even as the specific authorisation mechanisms evolve.

  *   **Crux (b): Accountability of a European Fiscal Capacity**  
      *   **Shared Question:** Would a hypothetical significant European Fiscal Capacity (EFC) – funded by direct EU taxation (e.g., FTT, share of corporate tax), with its budget established by Qualified Majority Voting (QMV) in the Council and amendable by the European Parliament under co-decision – increase or decrease overall democratic accountability for fiscal decisions compared to the current system of intergovernmental agreements and national contributions?
      *   **Relevant Hypothetical/Case:** Analysis of the accountability mechanisms inherent in the proposed EFC structure versus the accountability mechanisms in current major EU funding instruments (e.g., NextGenerationEU, MFF) and national budgets. Consideration of scenarios where the Council (acting by QMV) and EP agree on expenditure priorities significantly divergent from the preferences of a minority of Member States or their national parliaments.
      *   **Intergovernmentalist Prediction:** Such an EFC would decrease accountability by further distancing fiscal decisions from national electorates and parliaments, placing effective control beyond recall via recursive delegation mechanisms and subjecting national minorities to fiscal decisions they cannot veto.
      *   **Supranationalist Prediction:** Such an EFC would increase accountability by subjecting significant fiscal decisions to transparent co-decision by directly elected MEPs and ministers collectively accountable to EU citizens, replacing opaque intergovernmental bargains with clear parliamentary responsibility and majority rule.

  **Conclusion:**  
  This statement reflects our shared understanding of key institutional facts, our clearly articulated divergent principles, and our commitment to identifying the specific, testable questions (cruxes) that lie at the heart of our disagreement on the future of European democracy and integration. We present this as a foundation for further structured inquiry and debate.
