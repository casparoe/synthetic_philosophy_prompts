prompt: |-
  Draft the joint statement that an intergovernmentalist (who holds that the EU’s democratic deficit is structural and remediable only by repatriating competences to national parliaments) and an advocate of ever-closer union (who holds that pooled sovereignty deepens democracy by creating transnational citizenship and majority rule) could both sign after a good-faith adversarial collaboration on sovereignty, the democratic deficit, and ever-closer union.

  The statement should contain: (i) a numbered section of agreed claims about the formal allocation of legislative and executive authority in the EU, about the specific mechanisms that create distance between voters and decision-makers (notably the Council’s intergovernmental composition and the Commission’s exclusive right of initiative), about the European Parliament’s co-decision and budgetary powers, and about the legal status of “ever-closer union” in the Treaties; (ii) a disagreements table in which each side’s position is phrased in wording it would accept—specifically on whether democratic legitimacy requires a unified European demos, on whether sovereignty pooling is practically reversible without dismantling the internal market, and on whether parliamentary co-decision has eliminated the deficit or merely masked it; (iii) the cruxes, defined as sub-questions such that settling them would move at least one party—propose two: (a) whether “authorisation legitimacy” (derived from electoral mandate) can be separated from “performance legitimacy” (derived from effective problem-solving) when assessing pooled sovereignty, and (b) whether a hypothetical European Fiscal Capacity funded by direct EU taxation, approved by qualified-majority Council vote and amendable by the European Parliament, would increase or decrease democratic accountability; (iv) for each crux, the concrete case, hypothetical, or argument both sides agree is relevant, together with each side’s predicted assessment recorded in advance.

  In drafting, apply a novel framing device defined within the text itself: distinguish “recursive delegation” (authority loops back to national parliaments through real-time legislative veto networks) from “linear delegation” (authority is transferred upward irreversibly). Use this distinction to structure the agreed claims about sovereignty pooling, but treat it as an analytical construct introduced for this collaboration rather than as established terminology.

  Format the output as: (1) Agreed claims, numbered; (2) Disagreements table with columns for Issue, Intergovernmentalist formulation, Supranationalist formulation, and Crux reference; (3) Cruxes section containing the shared framing, the intergovernmentalist prediction, and the supranationalist prediction for each item.

  Write the answer in British English. Do not include bibliographies, citations, reading lists, or requests for external sources. Keep the prompt focused and relatively concise.
