prompt: |-
  I work in monitoring and evaluation at a small global health NGO, and for a couple of years now I've been noticing a pattern I don't have a word for. When an intervention gets studied more carefully, its measured cost-effectiveness drifts upward — and the drift doesn't seem to come from the programme actually getting better. Two things happen at once. On the benefit side, finer measurement keeps turning up extras nobody had counted: knock-on earnings for a relative's household, cases averted in the next village, gains that only show up five years later. On the cost side, the items that resist measurement quietly leave the ledger: the hours a government nurse diverts from her other patients, the free bednets that get resold in the market and undercut the local shop, the weeks our partner organisation spends on reporting. Nobody decides to drop them. They get moved into a paragraph of qualitative risks, and then the paragraph stops being updated. So the same work that makes the number more rigorous also makes it more flattering, and well-studied interventions end up looking better than unstudied ones partly just because they've been studied.

  I wrote our own cost-per-outcome section last month and caught myself doing exactly this with our partner's staff time, which is why its on my mind.

  I've heard of Goodhart's law, the McNamara fallacy, and the effective altruism thing about measurability bias, but none of them feel right: nobody here is gaming a target, everyone involved is acting in good faith, and the things that get dropped aren't disbelieved, they just stop being numbers. Is there an established name for this specific drift, as opposed to the general preference for whatever is measurable? If there isn't, I'd want a name and a definition that carves it out properly — is it the same phenomenon when it happens in a corporate impact report, does it still count if the costs are dropped for political reasons rather than measurement reasons, and is there a version that runs in the other direction?
reasoning: |-
  Okay, the user works in monitoring and evaluation at a small global health NGO and has noticed a pattern where as interventions are studied more carefully, their measured cost-effectiveness appears to increase. But this improvement isn't because the program is actually getting better—it's because of how benefits and costs are measured over time.

  The user describes that on the benefit side, more detailed studies uncover additional positive effects that weren't initially counted—like indirect economic benefits to relatives' households, spillover effects in neighboring villages, or long-term outcomes that only manifest years later. Meanwhile, on the cost side, hard-to-measure costs tend to disappear from the formal accounting. Examples include the opportunity costs of government nurses' time diverted from other patients, bednets being resold and undermining local markets, or partner organizations' staff time spent on reporting. These costs aren't denied; they just get moved into qualitative risk discussions and eventually fade from consideration.

  The user recognizes they've done this themselves with partner staff time in their own reporting. They've considered concepts like Goodhart's law (when a measure becomes a target, it ceases to be a good measure), the McNamara fallacy (over-reliance on quantifiable metrics while ignoring intangibles), and measurability bias (favoring what's easily measurable) but feel these don't quite fit because there's no bad faith or explicit gaming happening—just a gradual erosion of difficult-to-quantify factors.

  They're asking if there's an established name for this specific phenomenon where rigorous measurement paradoxically makes cost-effectiveness look better by capturing more benefits while letting costs "leak" out of quantification. If no term exists, they want help defining it precisely—considering whether the same dynamic occurs in corporate impact reporting, if political (rather than measurement-driven) exclusion of costs still counts, and if there's a reverse version where benefits get systematically undercounted.

  This seems like a sophisticated observation from someone deeply familiar with evaluation challenges. They're likely seeking both conceptual clarity (to name/define the pattern) and practical solutions (since they're actively wrestling with this in their work). Their tone suggests frustration with systemic issues rather than personal confusion—they've clearly analyzed the mechanics carefully.

  For naming options, I consider terms that emphasize:
  - The passive, structural nature (no villain, just system dynamics)
  - The asymmetry in measurement rigor (benefits expand, costs contract)
  - The "disappearance" of inconvenient factors
  - The self-reinforcing cycle (well-studied programs attract more funding)

  Potential candidates include:
  - "Metric drift" (too broad)
  - "Accountability sink" (vague)
  - "Cost-benefit asymmetry" (descriptive but not catchy)
  - "Impact inflation" (relatable metaphor)

  I think "Impact Inflation" works best—it captures how reported effectiveness "inflates" without real improvement, mirroring economic inflation where money loses value. The parallel to publication bias (where positive results dominate literature) also holds.

  For definition, I focus on:
  - The dual mechanism (expanded benefit capture + evaporating costs)
  - Good-faith systematic exclusion (not fraud)
  - The self-perpetuating cycle it creates

  Boundary clarifications:
  - Corporate settings: Yes, identical dynamics occur in ESG/sustainability reporting.
  - Political exclusion: A related but distinct issue; the core phenomenon is measurement-driven exclusion.
  - Reverse version: Absolutely—e.g., when negative externalities are quantified while benefits remain anecdotal ("impact deflation").

  The user will likely appreciate both the conceptual framing and practical mitigation strategies. Since they're hands-on, emphasizing concrete fixes—like institutionalizing "shadow costs/benefits" in reports or designing evaluation frameworks that pre-commit to tracking specific externalities—will resonate.
answer: |-
  Your observation is incredibly astute and describes a pervasive but under-discussed phenomenon in impact evaluation. I propose naming this **"Impact Inflation"**, with the following formal definition:

  **Impact Inflation**: *The systematic upward drift in measured cost-effectiveness of an intervention as evaluation rigor increases, driven by asymmetric capture of benefits (expanding over time) and attrition of hard-to-quantify costs (fading from formal accounting), despite no material improvement in the intervention itself. This occurs through good-faith methodological choices rather than deliberate manipulation.*

  ---

  ### Why this fits & distinguishes it from related concepts:
  1. **Asymmetry Mechanism**  
     Explicitly addresses your core insight: benefits are **expanded** (new spillovers, long-term effects) while costs **attrite** (indirect burdens, opportunity costs). This dual movement creates artificial "inflation."

  2. **Good-Faith Structural Bias**  
     Differs from Goodhart’s (gaming metrics) or McNamara (prioritizing quantifiables) by emphasizing passive erosion: costs aren’t denied but demoted to "qualitative risks" and forgotten.

  3. **Self-Reinforcing Cycle**  
     Well-studied interventions appear artificially superior → attract more funding → get studied more → inflate further. Unstudied interventions look worse by comparison, regardless of actual merit.

  ---

  ### Boundary Cases & Clarifications:
  | Scenario                                  | Is it Impact Inflation? | Why? |
  |-------------------------------------------|-------------------------|------|
  | **Corporate ESG report**                  | Yes                     | Same dynamics: e.g., carbon offsets' benefits overcounted; supply chain labor costs omitted. |
  | **Costs excluded for political pressure** | No (separate issue)     | Active suppression differs from passive attrition due to measurability. |
  | **Benefits *under*-counted over time**    | Reverse variant exists  | "**Impact Deflation**": e.g., environmental interventions where long-term costs emerge (e.g., ecosystem disruption), while benefits are rigidly measured. |

  ---

  ### Why Other Terms Don't Quite Fit:
  - **Measurability Bias**: Only describes preference for quantifiables, not the *dynamic drift* you observed.
  - **Optimism Bias**: Implies overconfidence, not structural measurement decay.
  - **Evaluation Bias**: Too broad; doesn’t specify the asymmetry.

  ---

  ### Mitigation Strategies (Based on Your Experience):
  1. **"Shadow Accounting" Protocol**:  
     Mandate a fixed appendix listing "unquantified costs/benefits" in every evaluation (e.g., "Staff opportunity cost: [Description]. Estimated range: X–Y hours"). Update it annually.

  2. **Pre-Commit to Cost Categories**:  
     During study design, pre-specify cost categories (e.g., partner staff time, market distortion) and report them as "$0 if unmeasured" rather than omitting them.

  3. **Spillover Schedules**:  
     Require evaluations to map benefit spillovers (e.g., "secondary household income") against cost attrition (e.g., "nurse diversion hours") in a paired table.

  4. **Inflation Discount Factor**:  
     For mature programs, apply a small downward adjustment (e.g., 5–10%) to CEA results to account for likely attrition of hidden costs. Document the rationale.

  ---

  ### The Deeper Pattern:
  This reflects a **fundamental mismatch between evaluation systems and complex systems**. Costs that dissipate across actors (e.g., nurses, local shops) or time (reporting burdens years later) resist capture by project-bound metrics. Benefits, conversely, are incentivized to expand—every new spillover makes the intervention *appear* more scalable. The irony: the very act of demanding "rigor" creates thermodynamic-like entropy where inconvenient costs evaporate from the record.

  Your awareness of doing this with partner staff time is a critical first step. Naming it "Impact Inflation" gives your team language to call it out—and a framework to correct it.
