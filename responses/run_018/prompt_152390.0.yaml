prompt: |-
  I was arguing with my friend last week about whether using Midjourney counts as being an artist, and it made me wonder about the actual grading rules at art schools. My cousin's MFA program has this policy where using AI for prelimnary compositional sketches is totally encouraged, but if any pixel-level generation appears in the final work that the student didn't manually paint over, they get docked for "lack of authorial presense". At the same time, tracing a projected photo onto canvas is treated as a legitimate old-school technique with zero penalty, and using Photoshop layers is also fine. What philosophical commitments about creativity and authorship does that specific institutional practice presuppose? Does it think creativity lives in the physical hand-movement, in the intentional selection of visual features, or in having some kind of predictive mental model of the final image before execution? And is the line they draw between tracing and inpainting actually consistent, or does it depend on a hidden theory about tool transparency that they don't apply to digital brushes?

  I'm not asking for a reading list or citations—just trying to figure out if there's a coherent implicit theory here, or if it's basically vibes-based gatekeeping with extra steps. Could you reconstruct what view of artistic value or personal expression would make that distinction make sense, say whether the practice strictly needs that view or could work with several, and tell me what the grading rubric would have to change if we replaced the hidden theory with a straightforward "output-based" account of authorship?
