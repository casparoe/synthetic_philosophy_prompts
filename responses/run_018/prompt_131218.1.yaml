prompt: |-
  In a philosophy of probability seminar, a colleague repeatedly invokes what she calls the Principal Principle—glossed as "rational credence should match objective chance"—to settle disputes about prior disagreement. Most recently, she applied it to two physicists who share the same wave function but assign different credences to a spin-up measurement: she argued that because the Born rule fixes the objective chance at 0.5, at least one physicist must be irrational, regardless of any hidden-variable theories they might hold.

  Can you lay out the menu of precise claims hiding in that gloss? I want distinct readings that vary along at least these dimensions: (1) whether the principle constrains only admissible credences—those not already informed by the chance—or applies to all credences; (2) whether "objective chance" denotes physical propensity, actual frequency, or a modal fact about possible worlds; (3) whether it functions as a synchronic rationality norm or as a diachronic updating rule; (4) whether it permits subjective priors that differ given identical admissible evidence, or whether it eliminates subjective priors altogether; and (5) whether it survives the undermining problem—cases where learning the chance-assigning law also provides evidence that undermines the very mechanism producing that chance.

  For each reading, indicate whether it is a near-trivial consistency constraint, a substantive but defensible thesis, or false. Then specify exactly which reading or combination her argument about the physicists requires, and whether that reading is genuinely contested among people who work on chance and belief. In particular, address whether the principle can be reconciled with subjective Bayesianism that allows divergent priors, and whether it applies when the chance law itself is disputed or unknown.

  Please separate what is settled—for instance, that the canonical formulation was stronger than a mere coherence requirement—from what remains genuinely contested, such as how the principle interacts with old evidence in Bayesian updating, whether it applies to deterministic systems with pseudo-random outcomes, and whether deference is owed to chances derived from statistical mechanics. Do not present any contested interpretation as the consensus view.

  This is for a dataset exercise; do not provide a bibliography, reading list, or citations. I need the analysis to stand on its own reasoning.
reasoning: |-
  Okay, the user is asking me to break down the Principal Principle in the philosophy of probability. They want distinct readings based on several dimensions and need to know which versions are trivial, defensible, or false. The scenario involves two physicists with the same wave function but different credences about spin-up measurements, and their colleague insists the Born rule's 0.5 chance makes one irrational. 

  Hmm, this is complex. I need to map out variations along those five dimensions they specified. Let me start by recalling Lewis's original formulation—it was strong, requiring credence to match chance when known, with only admissible evidence allowed. But that's just one interpretation. 

  For dimension 1 (admissibility), the strict reading seems untenable now—it clashes with self-undermining chances. The tempered version restricting to non-undermining evidence is more defensible but still tricky. 

  For dimension 2 (chance metaphysics), this matters hugely. If chance is just actual frequency, the principle collapses into trivial coherence. But if it's propensity or law-based modality, it becomes substantive—though the physicist example assumes the Born rule's modality, which hidden variable theorists might reject. 

  Dimension 3 (synchronic vs diachronic) splits the principle: Lewis framed it synchronically, but some recast it as an updating rule. The diachronic version avoids admissibility puzzles but feels less fundamental. 

  Dimension 4 (subjective priors) is where the colleague's argument gets sticky. Her claim requires the strictest reading—identical chances must force identical credences, squashing subjective priors. But that's contested; Bayesians could accept the principle while allowing priors to diverge before chance evidence arrives. 

  Dimension 5 (undermining) is the killer. If learning the chance law also undermines it (like in certain cosmologies), even tempered principles fray. Only the timidest "initial deference" might survive, but it's toothless. 

  Now, for the physicist dispute: the colleague needs all dimensions maxed-out—strict admissibility, law-modal chance, synchronic constraint, no priors allowed, ignoring undermining. But that bundle is hotly contested. Subjective Bayesians would cry foul: priors can rationally differ *until* chance evidence is incorporated. And hidden variable fans might deny the Born rule gives "chance" at all! 

  Settled bits: Lewis's original was stronger than coherence; admissibility must exclude undermining evidence; the principle needs qualification. Contested: everything else—especially whether it binds before chance-learning, or in deterministic settings. Even "deference to statistical mechanics chances" splits opinions. 

  The colleague's error? Assuming chance rigidly dictates credence *before* agents conditionalize on it. But subjective Bayesians see rationality as permissive until evidence updates beliefs. Her argument only flies if we accept the most demanding, metaphysically loaded version—which many reject.
answer: |-
  Here is a breakdown of precise claims within the Principal Principle (PP), organized by your dimensions, with assessments of their status, and analysis of the physicist case:

  **Core Dimensions & Interpretations:**

  1.  **Admissibility Constraint:**
      *   **Strict Admissibility (Lewis Original):** PP constrains credence *only* when credence is conditional on the chance proposition *and* on admissible evidence (evidence not "inadmissibly" informative about outcomes beyond what the chance implies). *Status: False* in original form due to undermining.
      *   **Tempered Admissibility:** PP constrains credence conditional on the chance proposition *and* any evidence logically consistent with that chance being true (excluding "undermining" evidence). *Status: Substantive but defensible* (though requires careful handling of undermining).
      *   **No Admissibility Constraint:** PP directly demands credence = chance whenever chance is known, regardless of other evidence. *Status: False* (trivially violated by evidence about the specific outcome).

  2.  **Nature of "Objective Chance":**
      *   **Physical Propensity (Single-Case):** Chance is an irreducible, stochastic disposition or tendency inherent in a physical system at a time. *Status: Substantive but defensible* (metaphysically loaded).
      *   **Law-Based Modality:** Chance is fixed by the fundamental physical laws (contingent or necessary) governing possible worlds/histories (e.g., Humean Best System Analysis). *Status: Substantive but defensible* (prominent modern view).
      *   **Actual Long-Run Frequency:** Chance just *is* the limiting relative frequency in the actual world's history. *Status: Near-trivial consistency constraint* (credence must match belief about actual frequency; reduces to coherence).
      *   **Epistemic Probability (Rejected):** Chance is not merely a reflection of ignorance. PP using this collapses to triviality. *Status: False* as an interpretation for PP's objective chance.

  3.  **Synchronic vs. Diachronic:**
      *   **Synchronic Norm:** PP is a constraint on an agent's credence function *at a specific time* given their total evidence *at that time* (including knowledge of chance). *Status: Lewis's original formulation; Substantive but defensible* (with tempered admissibility).
      *   **Diachronic Updating Rule:** PP specifies how an agent *should update* their credence upon *learning* the chance proposition (e.g., set C(A) = ch(A) upon learning ch(A)). *Status: Substantive but defensible* (avoids some admissibility puzzles, but may be derivative).

  4.  **Permissibility of Subjective Priors:**
      *   **Eliminates Subjective Priors Given Chance + Evidence:** For a given proposition A, identical knowledge of ch(A) *and* identical admissible evidence *requires* identical credence in A. No room for prior-driven divergence once the chance is known. *Status: Substantive but contested*.
      *   **Permits Subjective Priors Before Chance Learning:** Agents with different priors can rationally *arrive* at the same credence *after* conditionalizing on knowledge of ch(A) and admissible evidence. PP applies post-learning. *Status: Near-trivial consistency constraint* within subjective Bayesianism *after* updating.
      *   **Eliminates Subjective Priors Altogether:** PP implies there is only one rational prior credence function (e.g., respecting symmetries implied by chance laws). *Status: False* as a direct claim of PP; PP concerns conditional credence given chance knowledge.

  5.  **Surviving Undermining:**
      *   **Strict Admissibility Fails:** Original PP + undermining evidence leads to contradiction. *Status: Settled - fails*.
      *   **Tempered Admissibility/Nomological Reflection:** Constrain credence conditional on chance *and* evidence consistent with the chance law's truth. *Status: Substantive but defensible*, though complex.
      *   **"New Principle" (NP):** Defer to *future* chances conditional on the *current* chance theory holding. C(A | ch_t(A)=x & H_t & T) = x. *Status: Substantive but defensible* (avoids direct contradiction).
      *   **"Initial Deference":** PP only rationally constrains agents *before* they learn the full chance theory/laws. *Status: Substantive but toothless* for agents who know the laws.

  **Analysis of the Physicist Case & Required Reading:**

  Your colleague's argument requires a **very specific and strong combination**:

  1.  **Admissibility:** Implicitly assumes **Strict** or **Tempered Admissibility**, treating the physicists' hidden variable theories (if held) as *inadmissible* evidence about the outcome beyond what the Born Rule chance implies. She rules them out as irrelevant to credence once the chance is known.
  2.  **Chance Nature:** Assumes the Born Rule delivers **Law-Based Modality** (or **Propensity**) – a genuine objective chance fixed by quantum laws/ontology, not reducible to frequency or epistemic probability.
  3.  **Synchronic/Diachronic:** Uses PP as a **Synchronic Norm**. At the time of assigning credence (given knowledge of the wave function and Born Rule chance), both physicists *must* have credence 0.5.
  4.  **Subjective Priors:** Requires **Eliminates Subjective Priors Given Chance + Evidence**. Identical knowledge of ch(up)=0.5 (via wave function + Born Rule) *must* lead to identical credence C(up)=0.5. Divergent hidden variable theories are deemed irrational *if* they lead to credence ≠ 0.5 *given* this knowledge.
  5.  **Undermining:** Ignores or assumes **Tempered Admissibility/NP Survives**. Quantum mechanics isn't typically seen as self-undermining in the way some cosmological chance laws are, so undermining might not be considered relevant here.

  **Contested Nature & Reconciliation:**

  *   **Is this reading contested? Yes, significantly.** Her argument requires the strongest, least permissive reading on dimensions 1, 3, and 4.
  *   **Reconciliation with Subjective Bayesianism?** Subjective Bayesians can accept a *diachronic* PP as an updating rule. An agent who *learns* ch(A)=x (and has no undermining/admissible counter-evidence) *should* set C(A) = x. Crucially, **this permits divergent priors *before* learning the chance.** The physicists could rationally have *different* credences *before* applying the Born Rule or interpreting the wave function as giving chance. Her argument denies this; she demands synchronic alignment *given* the wave function and Born Rule interpretation.
  *   **Disputed/Unknown Chance Laws?** Her argument **assumes the Born Rule *is* the correct chance law** and that the physicists *know* this. PP, in all forms, only constrains credence *conditional on knowing the chance proposition*. If the chance law itself is genuinely disputed or unknown (e.g., one physicist believes in hidden variables rendering the outcome deterministic, hence ch(up) is 0 or 1, not 0.5), PP does not directly force agreement. It says: *If* you believe ch(up)=0.5, your credence should be 0.5. But if one physicist believes determinism (ch(up)=1), PP tells *them* they must have credence 1. Her argument implicitly dismisses the hidden variable view as failing to recognize the *true* objective chance (Born Rule) and thus being irrational for not deferring to it.

  **Settled vs. Contested:**

  *   **Settled:**
      *   Lewis's original formulation (strict admissibility) is too strong and fails due to undermining.
      *   Some form of admissibility constraint is essential (evidence defeating the chance must be excluded).
      *   PP is stronger than mere coherence; it requires deference to a specific external factor (chance).
      *   PP requires qualification to handle undermining (Tempered Admissibility, NP, etc. are attempts).
  *   **Genuinely Contested:**
      *   **Synchronic vs. Diachronic:** Is PP fundamental (synchronic norm) or derived (diachronic update)?
      *   **Scope with Old Evidence:** How does PP apply when the "chance law" (e.g., QM) is already known/believed? Does it still constrain credence in specific instances like this spin measurement?
      *   **Determinism & Pseudo-Randomness:** Does PP apply *at all* if the world is fundamentally deterministic (e.g., via hidden variables), even if processes *appear* random? Can there be "chance" in such systems worthy of deference? (Her argument assumes "No").
      *   **Deference to Statistical Mechanics Chances:** Should rational agents defer to SM chances (e.g., for gas in a box) when SM is known to be emergent from deterministic microphysics? (Similar core issue as hidden variables in QM).
      *   **Strength of Constraint (Priors):** Does PP *only* constrain updating *upon learning* the chance, or does it *also* demand synchronic alignment *given* knowledge of the chance law, thereby eliminating prior-driven divergence *after* learning the law? (Key point of contention in the physicist case).
      *   **Metaphysics of Chance:** What *is* objective chance (Propensity, BSA, etc.)? This fundamentally shapes what PP demands deference *to*.
