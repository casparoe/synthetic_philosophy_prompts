prompt: |-
  I'm a second year law student and lately I've been drowning in contract drafting, which made me think back to my philosophy elective where the prof kept going on about indicatve vs counterfactual conditionals. Like, there's a condition precedent in a lease -- 'if tenant delivers security deposit, then landlord delivers keys' -- and then there's the hypothetical we run in moot court: 'if the tenant had delivered the deposit late, would the termination clause have triggered?' My prof said indicatives are basically about updating beliefs given a premise we take seriously, while counterfactuals depend on holding fixed some background and tweaking one thing in nearby worlds. Can you restate that whole philosophical distinction using only vocabulary I actually use -- conditions precedent and subsequent, breach and remedy, material adverse change clauses, hypothetical damages, the duty to mitgate -- as faithfully as you can? Then give me the residue report: what maps cleanly onto contract doctrine, what I have to distort or fudge (maybe that 'nearest world' talk?), and whether there's anything in the philosophers' debate that just has no counterpart in how lawyers reason about broken contracts. I want to know if my gut feeling that it's just 'actual conditions vs hypotetical scenarios' is actually missing something substantive, or if the philosophers are dressing up distinctions that drafters already live with.
reasoning: |-
  Okay, the user is a second-year law student struggling with contract drafting and recalling a philosophy elective about indicative versus counterfactual conditionals. They want this philosophical distinction explained using legal terminology they're familiar with, like conditions precedent, breach, remedies, etc. They also want a "residue report" on how well this maps to contract doctrine, where distortions occur, and if anything in philosophy doesn't have a legal counterpart.

  First, I need to recall the philosophical concepts. Indicative conditionals are about belief updating under a given premise, like "If A happens, then B follows." Counterfactuals explore hypothetical scenarios where something didn't happen, considering alternate realities. The user mentioned examples from contracts: a lease condition precedent and a moot court hypothetical. 

  Translating this into legal terms: Indicative conditionals align with conditions precedent/subsequent. These are actual events that trigger obligations. For instance, delivering a security deposit (condition precedent) requires the landlord to hand over keys. Counterfactuals relate to breach analysis and remedies. When a breach occurs, lawyers ask "what if" the breach didn't happen to assess damages, like hypothetical damages or mitigation efforts.

  Now, the residue report. Mapping indicative conditionals to conditions precedent/subsequent seems clean. Both deal with actual events triggering obligations. Counterfactuals map to remedies and causation but with distortions. The "nearest possible world" philosophy concept is fudged in law through causation standards like foreseeability and materiality. For example, the duty to mitigate requires reasonable actions, not exploring all possible worlds. 

  Areas with no counterpart: Philosophers' debates on possible worlds and belief revision systems don't exist in contract law. Lawyers focus on practical causation and evidence, not theoretical possibilities. The user's gut feeling that it's just actual vs. hypothetical is mostly right but misses the deeper causal analysis in remedies. 

  I should structure the response by first explaining the distinction using legal terms, then the residue report with clean mappings, distortions, and no counterparts. Emphasize that while the core idea is similar, the legal application is more pragmatic, especially in remedies. Highlight that the duty to mitigate and material adverse change clauses show how law simplifies counterfactuals into reasonableness standards.
answer: |-
  Here's the philosophical distinction translated into contract doctrine, followed by the residue report:

  **The Distinction (Legal Translation):**

  1.  **Indicative Conditionals = Conditions Precedent/Subsequent & Actual Occurrence:**
      *   "If Tenant delivers security deposit (CP), then Landlord *must* deliver keys." You treat the premise **as potentially true or actually true** for the purpose of determining the **actual legal consequence**. This is about **triggering obligations or terminating them based on real events**.
      *   **Focus:** The *actual occurrence or non-occurrence* of a defined **Condition Precedent (CP)** or **Condition Subsequent (CS)**. Did the tenant *actually* deliver the deposit? Did the *actual* MAC clause definition get met? Did the *actual* notice provision get complied with?
      *   **Legal Reasoning Type:** Applying the contract's express terms to established facts. Determining if an **express condition** was satisfied/failed, thereby activating or extinguishing a primary duty (e.g., obligation to close, obligation to deliver keys, right to terminate).
      *   **Analogy:** Reading the contract flowchart based on what *actually* happened. "Given the fact Tenant delivered the deposit, Landlord's duty to deliver keys is triggered."

  2.  **Counterfactual Conditionals = Breach Analysis, Causation & Remedies (Especially Hypothetical Damages):**
      *   "If Tenant *had* delivered the deposit late (breach), would Landlord *have* been entitled to terminate under Clause X *at that time*?" This premise is known to be **false** (deposit wasn't late), but you explore the *hypothetical legal consequences* if it *had* been true, holding other key facts constant.
      *   **Focus:** Establishing **causation** for **damages** ("But-for the breach, would the loss have occurred?"), assessing **hypothetical scenarios** to determine the **measure of damages** (e.g., "What *would* profits have been *but for* the breach?"), evaluating **mitigation** ("What *could* the non-breaching party *reasonably have done* to avoid loss after the breach?"), or testing the **materiality** of a breach ("*Had* this minor defect occurred, *would* it have justified termination?").
      *   **Legal Reasoning Type:** Constructing a hypothetical "but-for world" where the breach *did* occur (or didn't occur) to isolate its legal effect, particularly concerning **remedies**. It's central to proving **reliance damages**, **expectation damages**, and evaluating defenses like **failure to mitigate**.
      *   **Analogy:** Running a simulation/model ("What if?") based on the contract terms and surrounding circumstances to determine liability extent and remedy quantification *after* a breach is established. "Holding everything else fixed *as it actually was*, if only the deposit timing had changed, would the termination right have arisen?"

  **The Residue Report:**

  1.  **Cleanly Mapped:**
      *   **Indicative -> Conditions Precedent/Subsequent:** This is nearly a perfect fit. Determining if a condition *actually* occurred to trigger or discharge an *actual* duty is core contract doctrine and mirrors indicative reasoning ("Given P, then Q").
      *   **Counterfactual -> Causation & Hypothetical Damages:** The "but-for" test in causation and the core calculation of expectation damages ("what would have happened but for the breach?") directly implements counterfactual reasoning. The **duty to mitigate** explicitly involves asking "What *could* the injured party reasonably *have done* in the hypothetical scenario post-breach to reduce loss?".

  2.  **Distorted/Fudged (The "Nearest World" Problem):**
      *   **"Holding Fixed" & "Nearby Worlds":** Philosophers obsess over *precisely* which background facts are held constant and which "worlds" are "closest." Law fudges this pragmatically:
          *   **Foreseeability & Materiality:** What gets "held fixed" is constrained by the **Hadley v. Baxendale** rule (foreseeable consequences) and concepts of **materiality**. We don't consider wildly improbable chains of events ("worlds" too "distant"). A MAC clause analysis asks if the *actual* event *would have been expected* to cause a *material* adverse effect – a practical proxy for "closeness."
          *   **Burden of Proof & Evidence:** What "would have happened" is determined by evidence and burdens of proof (often preponderance). We don't explore infinite possibilities; we look at market data, comparable transactions, expert testimony, and reasonable inferences. The "nearest world" is the *most plausible, evidence-supported* scenario.
          *   **Reasonableness Standard:** Mitigation relies heavily on the **reasonable person** standard. What "could" have been done isn't every *possible* thing in *some* world, but what was *reasonably feasible* in the *actual* circumstances. This flattens the philosophical complexity.

  3.  **No Real Counterpart in Contract Doctrine:**
      *   **Pure Belief Revision Systems:** Philosophers explore formal systems for *how* beliefs *should* update upon learning P (indicative) or learning *not-P* but imagining P (counterfactual). Contract law doesn't have a formal calculus for this; it relies on factual findings, burden of proof, and legal standards (materiality, foreseeability, reasonableness).
      *   **The Metaphysics of "Possible Worlds":** Lawyers don't engage in debates about the ontological status of possible worlds. The "worlds" in legal counterfactuals are purely conceptual tools for modeling causation and damages within the confines of evidence and legal rules. We care about plausible scenarios, not the nature of possibility itself.
      *   **Non-Truth Functional Analyses:** Philosophical debates about how the truth of conditionals relates to the truth of their parts (e.g., "If P then Q" when P is false) have no direct doctrinal parallel. Contract doctrine cares about the *actual* effect of *actual* conditions and the *legal consequences* of *actual* or *hypothetically proved* breaches.

  **Verdict on Your Gut Feeling:**

  Your gut ("actual conditions vs. hypothetical scenarios") **captures the core practical distinction perfectly for legal purposes.** It's the essential takeaway.

  *   **What You Might Be Missing (A Little):** The philosophers highlight the *structural complexity* inherent in constructing the hypothetical scenario (counterfactual). Law doesn't ignore this complexity – it *manages* it through doctrines like **foreseeability, materiality, reasonableness, and burdens of proof**. These doctrines are the legal system's tools for taming the "nearest world" problem without needing the philosophical jargon. The *substance* of the distinction (actual trigger vs. hypothetical consequence) is spot on, but the *effort* behind constructing a legally valid counterfactual (especially in complex damages cases) mirrors the philosophers' concerns about background assumptions.

  *   **What Philosophers Are Dressing Up:** They are formalizing and probing the logical and metaphysical foundations of reasoning patterns that lawyers use intuitively and manage pragmatically through established doctrine. The core distinction *is* fundamental to drafting and litigation – you identify *actual* conditions and constantly run *hypotheticals* about breach and remedies. The philosophers articulate *why* these two types of reasoning are fundamentally different beasts, even if law provides pragmatic rules for wrangling the counterfactual beast.

  **In essence:** Your drafting forces you to define the *indicative* triggers (CPs, CSs, MAC definitions). Your moot court prep forces you to argue the *counterfactuals* (causation, damages, mitigation). The philosophers provide a deeper lens on the logic, but the core distinction is one you already navigate daily. The "dressing up" reveals the underlying complexity that doctrines like foreseeability and mitigation exist to control.
