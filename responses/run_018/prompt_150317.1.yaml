     - Shared rejection of absolutist ekāntavāda
  3. A disagreements table with exact wording each camp accepts for its own position
  4. The cruxes (key points of disagreement) with:
     - For each crux, a concrete case or argument both sides agree is relevant (using the synthetic agent scenario or standard textual interpretation) and each side's predicted outcome
