  We are designing a one-hour workshop to illustrate the boundary of Good's theorem: that information can have negative value when the agent is committed to a fixed action rule and cannot adapt optimally upon receiving the signal. The activity will have participants experience this through a game where they are forced to precommit to actions and then receive a signal that, due to their commitment, leads to worse outcomes.

  Timeline (60 minutes total):
  1. Introduction (5 minutes): Explain the basic setup and rules. Emphasize that they are playing as rational agents trying to maximize points and that they will play multiple rounds with the same rules but possibly different parameters. Mention that they will be making decisions both individually and as a group (to foster discussion) but in this case, we'll have them play individually to feel the effect personally.
  2. Round 1: No Information (10 minutes): Each participant makes a decision without any additional information. They must choose an action (e.g., A or B). The state of the world is then revealed, and payoffs are awarded according to a payoff matrix. We will set it up so that without information, the best they can do is to choose one action (say A) which gives a safe positive payoff, but if they choose B and the state is favorable, they get a high payoff. However, the state is unfavorable most of the time, making A the better choice without information.
  3. Round 2: Free Information (15 minutes): Now, participants are offered a free signal about the state of the world. However, they must precommit to an action for each possible signal outcome (i.e., they must decide in advance what they will do if the signal says X or Y). They do not know the exact accuracy of the signal, but they are told it is somewhat accurate. After they precommit, the signal is revealed, they take the precommitted action, and then the state is revealed and payoffs awarded. The trick is to set the signal to be accurate but the payoffs and precommitment rule in such a way that having the signal and being forced to precommit leads to worse outcomes than not having the signal and just choosing the safe action. Specifically, the signal might induce them to sometimes take the risky action when the state is actually unfavorable, which they avoided in the no-information round by always choosing safe.
  4. Round 3: Optional Information with Adaptation (15 minutes): Now change the rule: participants are allowed to see the signal and then choose their action without precommitment. They can adapt optimally. This round should show the positive value of the same signal because now they can condition on the signal. They will see that the signal now helps.
