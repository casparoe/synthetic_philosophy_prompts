  Given time, we might stick to the above and in the debrief explain that in some cases the signal might be valuable if it is accurate enough or if the prior is different, but in this case it wasn't. The key point is that in Round 2, the precommitment rule forced them to take a harmful action upon seeing the good-news signal, whereas in Round 3 they could avoid that.

  So let's go with that.

  Materials: 
  - A coin or a die to generate states and signals. We need to simulate 90% probability for S1 and 70% accuracy. We can use a ten-sided die or a computer. Alternatively, for simplicity, we can use a regular die and approximate.

  For example, for the state: 
  - Roll a die. Let 1-9 be S1, 10 be S2 (if using a d10). Or with a d6: let 1-5 be S1 (5/6≈0.833) and 6 be S2 (0.166) - not exactly 0.9. Alternatively, use two dice and a lookup table.

  To keep it simple, we can use a deck of cards. Prepare a deck with 90% S1 and 10% S2. For example, 18 cards of S1 and 2 cards of S2 (total 20, so 90% and 10%). For the signal given state: 
  - For an S1 card, have a sub-deck for S1: 7 cards of "B" and 3 cards of "G" (or marks on the same card?).
  - For an S2 card, have a sub-deck: 7 cards of "G" and 3 cards of "B".

  Alternatively, we can use a random number generator on a computer and project it.

  For the workshop, we can have the facilitator draw from a hat.

  To save time, we can pre-generate a few rounds of outcomes for each participant, but that might reduce the excitement.

  Alternatively, we can have one central draw for the state and then for the signal, and then everyone uses that. But then everyone sees the same state and signal, which might not be ideal because then in Round 2, everyone has the same signal and takes the same action, and then they all get the same outcome. We want them to experience different outcomes to see the average.

  So we need individual draws. But with 12 participants, we can have them roll dice or draw from a hat quickly.

  We can have a central draw for the state for the whole group? But then everyone has the same state, which might be bad because in one round everyone might get S1 and then in Round 2 everyone who got G will take B and lose a lot. But that might be dramatic. Alternatively, we can have each participant draw their own state and signal.

  But that might take time. Given the time, we can have the facilitator generate one state and one signal for the whole group in each round, and then everyone experiences the same state and signal. This simplifies and also creates a shared experience. The only issue is that the average over one round is not the expected value, but we can run each round multiple times? We have limited time.

  Alternatively, we can run each round once and then explain the expected value calculation. But then the participants might not feel the effect if by chance in Round 2 the state is S2 and the signal is G and they win big. 

  To ensure they feel the effect, we can run Round 2 multiple times, but time is short.

  Given the time constraints, we might run each round once and then in the debrief, show the expected value calculations and explain that over many runs, the average would be -13.4 in Round 2.

  So let's design the rounds to be run once, but the facilitator will have the expected values ready to explain.

  Game rules for participants:

  Round 1 (No Information):
  - Each participant chooses either A or B.
  - The facilitator then draws the state (S1 with 90% chance, S2 with 10% chance) and announces it.
  - Participants who chose A get 10 points.
  - Participants who chose B get -100 points if the state is S1, or 100 points if the state is S2.

  We hope they choose A.

  Round 2 (Free Information with Forced Precommitment):
  - Participants are told that they will receive a signal (G or B) about the state.
  - They must write down a decision rule: "If the signal is G, I will choose ACTION1; if the signal is B, I will choose ACTION2." And they must choose different actions for G and B.
  - The facilitator then draws the state and then the signal given the state (as described). The signal is announced.
  - Each participant takes the action they precommitted to for the announced signal.
  - The state is revealed, and payoffs are awarded.

  Round 3 (Information with Adaptation):
  - Participants are told that they will first see the signal and then choose any action.
  - The facilitator draws the state and then the signal, and announces the signal.
  - Each participant chooses either A or B.
  - The state is revealed, and payoffs are awarded.

  Debrief:
  - Compare scores from the rounds. Note that in Round 2, on average, they lost points compared to Round 1 and Round 3.
  - Explain that the signal in Round 2 was free and accurate 70% of the time, but because they were forced to precommit to a rule that made them take the risky action upon seeing the good-news signal, and because the world was very likely to be in a bad state even after seeing a good-news signal, this led to losses.
  - In Round 3, they could ignore the signal and choose the safe action, so the signal did not harm them.
  - Connect to Good's theorem: information has positive expected value only if you can use it to change your action in a way that conditionally improves your expected utility. If you are constrained in how you can respond (here, by being forced to precommit to a conditional rule that requires taking a risky action on good news), then information can be harmful.

  Honest note: This simulation necessarily cannot reproduce the full generality of Good's theorem, which applies to any information structure and any decision problem. In particular, we have chosen a specific set of payoffs and probabilities to make the effect salient, but the theorem is more general. Also, in the simulation, the negative value arises from the constraint on actions (being forced to have a conditional rule with distinct actions) which is an artificial constraint. In real life, such constraints might come from institutional rules or cognitive limitations. The theorem itself shows that without such constraints, the value of information is non-negative.

  We hope this activity will spark interest in decision theory and the importance of flexibility in using information.

  Let me know if you have any adjustments.
answer: |-
  Dear colleague,

  Thank you for reaching out to design this workshop. I've crafted a self-contained activity called "The Oracle's Curse" to illustrate how information can be harmful under commitment constraints, aligning with your request to focus on the boundary condition of Good's theorem. The game uses points, takes 60 minutes, and requires minimal materials. Below, I'll outline the full design in prose, including timeline, roles, rules, payoffs, and debrief structure.

  **Timeline (60 minutes total):**  
  - **Introduction (5 min):** Briefly explain the scenario: Participants are traders deciding whether to invest in a stable asset (A) or a volatile one (B). They’ll play three rounds, scoring points based on outcomes. Emphasize that the goal is to maximize points and that rounds build on each other.  
  - **Round 1: No Information (10 min):** Participants choose A or B without any information. The facilitator reveals the state (drawn randomly) and awards points.  
  - **Round 2: Free Information with Commitment (15 min):** Participants receive a free, accurate signal about the state but must precommit to an action for each possible signal (e.g., "If signal is Good, I choose B; if Bad, I choose A"). Crucially, they *must choose different actions* for the two signals. After signals are revealed, they follow their precommitment, and points are awarded.  
  - **Round 3: Free Information with Adaptation (15 min):** Participants receive the same signal but *choose their action after seeing it* with no precommitment. Points are awarded.  
  - **Debrief (15 min):** Discuss outcomes, highlight the score dip in Round 2, and connect it to Good’s theorem.  

  **Materials:**  
  - One six-sided die per 2–3 participants (or shared centrally).  
  - Scorecards for tracking points (paper or digital).  
  - A visible payoff chart:  
    - Choose A: Always 10 points.  
    - Choose B: –100 points if state is Bad, +100 points if state is Good.  
  - A state probability chart: State is Bad (90% chance), Good (10% chance).  
  - A signal accuracy chart: Signal is 70% accurate (e.g., if state is Bad, signal says "Bad" 70% of the time and "Good" 30%; if state is Good, signal says "Good" 70% of the time and "Bad" 30%).  

  **Roles:** All 12 participants play as individual traders. The facilitator (you) manages time, rolls dice for states/signals, and enforces rules.  

  **Payoff Scheme (Points):**  
  - **Round 1 (No Information):** Participants choose A or B blindly. Roll the die to determine the state: 1–5 = Bad, 6 = Good (simulating 90% Bad, 10% Good). Award points based on the payoff chart. *Expected outcome:* Choosing A gives 10 points (safe). Choosing B usually loses points (90% chance of –100), so rational players prefer A.  
  - **Round 2 (Free Information with Commitment):** Participants get a free signal (Good/Bad) but must precommit to a rule like "If Good → B, If Bad → A" (or vice versa), with actions differing for each signal. Roll the die twice: first for state (1–5=Bad, 6=Good), then for signal accuracy (e.g., 1–7=accurate signal, 8–10=inaccurate, using 1–7 and 8–10 on a d10 or approximating with d6: 1–5=accurate, 6=inaccurate). After revealing the signal, participants follow their precommitment. Award points. *Expected outcome:* Most will precommit to "If Good → B, If Bad → A" (the best available rule), but due to the signal’s 30% error rate and high Bad-state probability, seeing "Good" often lures them into B when the state is actually Bad, causing heavy losses. Average score: –13 points, worse than Round 1.  
  - **Round 3 (Free Information with Adaptation):** Same signal as Round 2, but participants choose A or B *after* seeing it. Roll for state and signal as above. Award points. *Expected outcome:* Rational players ignore the signal (since even a "Good" signal implies a 79% chance of a Bad state) and always choose A, scoring 10 points.  

  **Rules Creating the Commitment Trap:**  
  - In Round 2, the *must-choose-different-actions* rule forces suboptimal responses. For example, if the signal says "Good," players must choose B (due to their precommitment), even though the high prior probability of a Bad state (90%) makes B irrational. Without this constraint, they’d avoid B, but the rule traps them into overreacting to the signal.  

  **Debrief Structure:**  
  1. **Compare Scores (5 min):** Ask participants to share Round 1–3 scores. Highlight that scores dropped in Round 2 despite "free" information.  
  2. **Reveal the Mechanism (5 min):** Show the expected point math:  
     - Round 1 (no info): Choosing A = 10 points.  
     - Round 2 (precommit): Best rule ("Good→B, Bad→A") averages –13 points because "Good" signals (occurring 34% of the time) often lead to B in a Bad state (–100).  
     - Round 3 (adaptation): Choosing A always = 10 points (signal is ignored as it’s not worth acting on).  
  3. **Connect to Good’s Theorem (5 min):** Explain that information has positive value only if you can *optimally adapt* your actions (as in Round 3, where adaptation allowed ignoring it). In Round 2, the precommitment constraint prevented this, making information harmful. This mirrors Good’s boundary: when actions are fixed (e.g., by rules or cognitive biases), a signal’s expected value can be negative.  

  **Honest Note on Limitations:** This simulation cannot reproduce the theorem’s full generality—it assumes a specific payoff asymmetry (large loss in Bad state) and prior imbalance (90% Bad), which make the effect stark. In reality, information can be harmful under broader conditions (e.g., with continuous actions), but that requires verbal explanation. The activity’s strength is in making the *logic* visceral: constraints breed vulnerability to noise.  

  This design ensures participants *feel* the paradox firsthand. They’ll enter Round 2 trusting the signal, lose points, and only in the debrief grasp why flexibility matters. If you need adjustments for your team’s dynamics, I’m happy to refine this further.  

  Best of luck with the workshop!  

  Warm regards,  
  [Your Name]  
  Workshop Designer
