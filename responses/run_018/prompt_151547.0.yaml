answer: |-
  Here’s a defended research agenda prioritizing unresolved conceptual questions in supererogation, with a focus on collective and epistemic dimensions, ranked by urgency, theoretical leverage, and downstream impact:

  **Ranked Priority Questions:**  
  1.  **Collective Supererogation: Coherence and Conditions**  
      *   **Why Top Priority?** Directly addresses the *underdeveloped* issue you specified. Current theories of supererogation are hyper-individualistic, clashing with real-world collective action problems (e.g., climate mitigation, open-source projects, corporate philanthropy). Resolving this is *upstream*: progress here forces refinement of core concepts (agency, obligation, praise) and tests the boundaries of supererogation theory itself. Failure to resolve it risks irrelevance to major contemporary moral challenges.  
      *   **Core Challenge:** Can a *group* coherently have obligations weaker than the praiseworthiness of an act it performs? Does this require irreducible group agency/intentionality, or can it emerge from structured joint commitments without aggregating individual supererogation?  
      *   **Tractability:** Primarily conceptual (analyzing group agency, joint action, collective responsibility). Empirical work (e.g., sociology of altruistic institutions) can inform *examples* but not resolve the core normativity.  
      *   **Dependency:** Upstream for understanding large-scale supererogation; failure here blocks meaningful progress on many applied issues.

  2.  **The Moral Residue of Omitted Supererogation**  
      *   **Why #2?** Even if supererogatory acts aren't required, *omitting* them often leaves moral traces (regret, "dirty hands," demands for justification). This challenges the clean "optionality" assumed in many theories. Addressing this is *foundational*: it probes the relationship between the supererogatory and the deontic (permissible/impermissible), impacting how we understand moral demandingness and agent integrity.  
      *   **Core Challenge:** Does omitting a supererogatory act generate a distinct, sui generis kind of moral remainder (beyond mere lost opportunity for praise)? If so, what is its nature (quasi-obligation, virtue failure, agent-relative regret)? Does it imply a weaker "should" distinct from "ought"?  
      *   **Tractability:** Highly conceptual (moral phenomenology, deontic logic, virtue theory). Minimal empirical input needed beyond illustrative cases.  
      *   **Dependency:** Downstream of basic supererogation coherence (#1 partly informs *what* is omitted), but upstream for understanding the *weight* and *aftermath* of supererogatory choices. Progress here clarifies the normative landscape around supererogation.

  3.  **Epistemic Supererogation: Genuine Category or Collapse?**  
      *   **Why #3?** Tackles your second *underdeveloped* issue. Epistemic normativity (governing belief) is often modeled on moral normativity, but differences matter. This question forces integration of ethics and epistemology. If genuine, it revolutionizes "doxastic responsibility"; if collapsed, it strengthens reductionist accounts of epistemic normativity. High risk/reward.  
      *   **Core Challenge:** Can exceeding *evidential* duties (e.g., meticulous double-checking, pursuing tangential evidence, radical open-mindedness) be praiseworthy without being *prudentially* wise (seeking truth for self-benefit) or covertly *morally* required (due to stakes for others)? What constitutes "praiseworthy" in the epistemic realm?  
      *   **Tractability:** Conceptual (analyzing epistemic duties, value of truth, nature of epistemic praise) with potential empirical inputs (cognitive science on effortful inquiry, psychology of intellectual virtue).  
      *   **Dependency:** Semi-independent conceptually, but its resolution relies on a stable account of core supererogation (#1, #2 help define "beyond duty"). Outcome significantly impacts epistemology.

  **Deprioritized Questions & Grounds:**  
  *   **Refining Taxonomies of Supererogatory Acts (Heroic vs. Beneficent, etc.):** Important but relatively mature. Further distinctions have *limited downstream effect* on core theoretical puzzles. Priority should shift once foundational issues advance.  
  *   **Quantifying "Cost" Thresholds for Supererogation:** Intractably vague and context-dependent. Excessive focus here risks *conceptual dead ends* and distracts from structural issues (#1, #2). Empirical work on sacrifice perception is useful but secondary.  
  *   **Supererogation in Specific Applied Ethics (e.g., just war, bioethics):** Important for application, but progress depends heavily on resolving the *upstream conceptual issues* (#1, #2, #3). Premature deep dives here risk misapplication.

  **Reordering Triggers:**  
  1.  **Evidence of Robust Collective Moral Agency:** Empirical or conceptual breakthroughs demonstrating groups can hold non-aggregative obligations/praise (e.g., in law, AI ethics, organizational theory) would solidify #1's top status. Conversely, strong arguments for *irreducible individualism* in all normativity could deprioritize it.  
  2.  **Consensus on Moral Residue:** If compelling accounts emerge showing omitted supererogation leaves *no* distinctive residue (beyond lost praise), #2 drops significantly. Evidence of widespread *agent-experienced* unique residue (e.g., in psychology of moral regret) would elevate it.  
  3.  **Epistemic Normativity Frameworks:** If leading epistemic theories (e.g., knowledge-first, veritism) develop robust accounts of "beyond epistemic duty," #3 rises. If epistemology converges on the view that all significant epistemic norms are either strict duties or purely prudential, it falls. Clarity on the *value* of truth-seeking beyond minimums is key.

  **Conclusion:**  
  Advancing supererogation requires tackling its **structural limitations**: the **individualistic bias** (prioritize Collective Supererogation), the **optionality illusion** (prioritize Moral Residue), and the **epistemic gap** (prioritize Epistemic Supererogation). Focusing on these underdeveloped and interconnected frontiers—especially the urgent puzzle of collective action—offers the highest leverage for transformative progress within 5-10 years, moving the field beyond refining individualistic paradigms toward a theory capable of addressing complex, collaborative, and intellectually demanding moral life.
