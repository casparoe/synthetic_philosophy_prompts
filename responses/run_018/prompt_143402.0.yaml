prompt: |-
  hey so my mom was just diagnosed with alzheimers and we're staring at this old advance directive she wrote like ten years ago. she said no feeding tubes ever, but now she barely knows who i am yet she still smiles when she eats pudding. my sister says the paper is law, i think we're just honoring a ghost. can you write a short dialogue between two philosophers arguing whether that old document still has real authority? one should defend the idea that the earlier self wrote a kind of personal constitution that binds caregivers even after personality is mostly gone, the other should argue that severe dementia breaks the chain of authority and we're just following a recommendation from someone who doesnt exist anymore, so present wellbeing should win. make them actually respond to each other, not talk past. after the dialogue, summarize in this JSON schema: {"dialogue_text": "string with the dialogue", "constitution_side_summary": "string", "ghost_side_summary": "string", "main_crux": "string", "stronger_case": "string with reasoning", "open_question": "string"}. no citations or reading lists needed, just work it out. also please include a typo or two since im writing this on my phone.
