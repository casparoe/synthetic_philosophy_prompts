  We are creating a dialogue between two philosophers, let's call them ELEANOR (defending the authority of the advance directive) and MARCUS (arguing that severe dementia breaks the chain of authority). They should respond to each other directly.

  Eleanor's stance: The advance directive is a personal constitution that binds caregivers because it was made when the person was competent and reflects their deeply held values. Even if the person now has dementia, we must respect the autonomous decision of the past self.

  Marcus's stance: Severe dementia breaks the continuity of the self. The person who wrote the directive no longer exists in a meaningful way, so we are only left with the current being who can experience well-being (like enjoying pudding). Therefore, current well-being should take precedence.

