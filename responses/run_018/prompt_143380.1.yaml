  ## The Verbs of Kalawi

  The salt still crusted Mara’s lips when she first heard it. A flash of brown fur vanished into the undergrowth. A man on the beach, skin like sun-baked driftwood, pointed and called out, a fluid cascade of sound: *"Talla-rin-sha-ko’e!"* His companion nodded, uttering a shorter phrase: *"Sha-ko’e fenn."*

  Rabbits, Mara thought instantly, scribbling in her waterlogged notebook with a stub of charcoal. *Talla-rin-sha-ko’e*. Undetached rabbit-part? Rabbit-stage? She’d spent years wrestling with Quine’s gavagai problem – the terrifying idea that perfect translation might still hide radically different conceptions of what *exists* – and here she was, shipwrecked on Kalawi, living it. Her life’s work, washed ashore with her.

  Weeks bled into months. Mara learned. Nouns were absent, replaced by intricate, ever-shifting verb-phrases that painted events, not things. The crashing wave wasn’t "water" or "a wave," but *"the-blue-force-rising-breaking-falling-upon-rock."* The fruit she ate wasn’t "mango," but *"the-sweet-yellow-substance-yielding-between-teeth."* A person wasn’t "Teka," but *"the-one-who-walks-softly-by-morning-streams."* Objects dissolved into processes, moments in flux.

  Mara adapted. She learned to parse the flowing phrases, mapping them onto her own world of persistent objects. She’d point to a still coconut and say *"The-brown-hardness-resting-high-in-air"* (her attempt at *"Ki’lan-tor-mae"*), and the islanders would nod, seemingly understanding. She built a dictionary, a meticulous grid of verb-phrases alongside her object-based interpretations. *Talla-rin-sha-ko’e* became firmly "rabbit" in her mind. She felt triumphant. She’d cracked it, bridged the gap. The gavagai problem, conquered through sheer fieldwork.

  Then came the storm. Huddled in a low stone shelter with Teka, the wind screamed like a dying thing. A loose section of thatch ripped free, flapping wildly. Teka pointed urgently, shouting not a phrase for "thatch" or "roof," but *"The-dry-brown-rattling-now-against-stone-edge!"* as it flailed.

  Later, surveying the damage, Mara pointed to the same patch of now-still thatch, secured again. *"Ki’lan-tor-mae?"* she asked, using her phrase for static brown hardness. Teka looked puzzled, then shook her head. She touched the secured thatch and uttered a new phrase, slow and deliberate: *"Ma’e-sha-ko’e fen."* The stillness, the secured state, demanded different words. The "brown-hardness" only existed *as* an event – the rattling, the securing. At rest, it wasn’t the same *thing*.

  The doubt, cold and insidious, seeped in. Had she just been imposing her own object-obsessed ontology onto a language that fundamentally saw only fleeting events? Was her entire dictionary a massive, unconscious projection? When she said *"Talla-rin-sha-ko’e"* and thought "rabbit," did Teka see a bounded entity, or just *"the-white-flash-entering-bush"* – a unique, unrepeatable slice of spacetime?

  She found Leo near the freshwater spring. He’d washed up years before her, a pragmatic merchant sailor turned reluctant islander. He spoke Kalawi fluently, lived among them comfortably.

  "I think I’ve been translating wrong," Mara confessed, her voice raw. "I think... I think I’ve been forcing things onto them. Objects. When maybe they only see events. Like... like nothing persists. It’s all just... verbs."

  Leo chuckled, scrubbing moss off a gourd. "Ah, the philosopher’s trap. Been there, stared into that abyss. Makes your head spin, doesn’t it?"

  "But don’t you see?" Mara pressed. "When I point to a rock and use the phrase for when it was *falling*, and they understand, but when it’s *still*, it needs a different phrase... what does that *mean*? What do they *believe* is there?"

  Leo filled his gourd, the water making a soft *glug-glug*. "Means we coordinate, Mara. That’s all language is, deep down. When I say *‘Ki’lan-tor-mae’* for a still coconut, they know what I’m pointing at. When I yell *‘The-dry-brown-rattling-now’* during a storm, they know to grab the thatch. We get things done." He took a long drink. "Does it matter if my ‘coconut’ is a solid thing in my head, and in theirs it’s just... a pattern of stillness they happen to have a phrase for? Does it change the taste? Does it change the storm damage?"

  "But the *reality*..." Mara whispered.

  "What reality?" Leo asked gently. "The one behind the words? How would you ever peek behind that curtain, even with your own language? You point, you make noise, stuff happens. Or it doesn’t. The rest?" He shrugged, a gesture that seemed to encompass all of philosophy. "That’s the wind in the trees. Interesting noise, but it won’t mend the roof or fill the gourd. Worry about the coordination, Mara. The shared dance. The hidden stuff... let it be hidden. It’s quieter that way."

  Mara walked back to her hut along the beach. The sunset wasn’t "the sun setting," but *"the-fire-orange-sinking-into-wet-darkness."* A wave wasn’t "a wave," but *"the-green-curve-rising-foaming-collapsing-into-fleeting-white."* Each phrase unique, describing a singular, vanishing moment.

  She looked at the darkening sea, a vast, shifting expanse of unrepeatable events. Leo’s pragmatism offered peace. But the doubt lingered, a deeper current beneath the surface coordination. Was she translating a world, or just weaving her own persistent illusions onto a reality that was only, ever, verbs? The gavagai wasn’t a puzzle on a page anymore. It was the sound of the wind, the taste of salt, the terrifying, beautiful fragility of every single moment, named only as it fled.

  ---

  **Regarding Quine, Gavagai, and the Story:**

  1.  **Where the Story Takes Liberties/Leans on Contested Readings:**
      *   **Radical Verb-Only Language:** Quine’s gavagai problem focuses on the *indeterminacy of reference* – we can’t know if "gavagai" refers to the whole rabbit, an undetached rabbit part, a rabbit stage, etc. He doesn’t argue that natural languages entirely lack nouns or object-like references. The story imagines an extreme case (a language *without* nouns) to vividly illustrate the *consequence* of radical referential indeterminacy – the potential for fundamentally different ontologies. This extends Quine’s thought experiment into a hypothetical linguistic structure he didn't propose.
      *   **Practical Coordination vs. Deep Ontology:** The story pits Mara’s ontological anxiety against Leo’s pragmatic view ("coordination is enough"). Quine acknowledges that we translate based on stimulus meanings (observable reactions to stimuli), which *is* a form of coordination. However, Quine *does* think the indeterminacy is deep and inescapable, even if it doesn't affect practical communication. Leo’s dismissal of hidden ontologies as irrelevant ("the wind in the trees") leans towards a more purely pragmatic/Wittgensteinian view that Quine might find *too* dismissive of the underlying philosophical problem. Quine thinks the indeterminacy *is* a real feature of meaning and ontology, even if pragmatically irrelevant.
      *   **"Fading Events" Ontology:** The islanders' implied ontology (only events exist) is a specific, contestable projection Mara makes. Quine's point is that *multiple* ontologies (rabbits vs. rabbit-stages vs. temporal parts) are equally compatible with all possible evidence. The story simplifies by presenting one stark, alternative ontology (pure events) as a plausible (for Mara) interpretation.

  2.  **What Could Change My Mind (or Quine's) About the Depth of the Problem:**
      *   **The Argument from "Triangulation" (Donald Davidson):** Davidson argued that meaning arises not just between words and the world, but through *communication between people* about a shared world. If we see someone reacting to a rabbit, and *we* see the rabbit, the shared object is fixed through this three-way interaction ("triangulation"). **If Davidson is right,** it significantly weakens Quine's indeterminacy, suggesting shared stimuli combined with communicative interaction *can* pin down reference to objects like rabbits, not just rabbit-stages. The indeterminacy might be more theoretical than practically possible.
      *   **Finding a "Rosetta Stone" Scenario:** If we discovered a language where translation *required* commitment to a specific, non-standard ontology (e.g., where using "rabbit" for *gavagai* consistently led to contradictions in their metaphysics, while "rabbit-stage" worked perfectly), this would strongly support the depth of Quine's problem. The story imagines this scenario on Kalawi (Mara's doubt about objects), but no such clear-cut natural language case exists.

  3.  **Where the Reasoning is Probably Weakest:**
      *   **The Strength of Davidson's Challenge:** Davidson's triangulation argument is powerful. While Quine has responses (e.g., even shared stimuli underdetermine *which* aspect of the shared scene is being referred to – the rabbit, its color, its movement, its stage), the idea that communication fundamentally anchors reference in a shared *object* world is intuitively compelling and challenges the idea that radically different ontologies could be genuinely *live options* for competent speakers interacting about the world. The story's Leo embodies a practical view leaning towards Davidson, but Quine's stance might be shakier here than the story implies.
      *   **Practical Irrelevance:** As Leo points out, the indeterminacy doesn't stop successful communication and coordination. Quine agrees. The "weakness" lies in whether this makes the problem less *deep* philosophically. Some argue that if it makes no practical difference, the problem is merely semantic or metaphysical in a trivial sense. Quine (and the story) would argue it reveals something profound about the nature of meaning and reality, but the argument for its *significance* beyond intellectual curiosity can be contested.

  The story uses Quine's core insight – the gap between observable behavior and underlying ontological commitments – as a springboard into a vivid narrative exploring linguistic relativity and the fear of solipsism. It leans into the radical implications, simplifying some nuances of Quine's argument to serve the fictional exploration, while Leo represents a strong counter-perspective grounded in communication and action.
