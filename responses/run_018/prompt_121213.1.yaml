  Okay, I need to understand the user's query deeply. They've developed a unique ethical stance based on their partner's diagnosis with a neurodegenerative disorder. This has led them to believe that suffering isn't just for beings with nervous systems; instead, it's tied to all irreversible thermodynamic processes, with moral weight scaling to entropy production rates. They want an honest assessment of counterarguments against this view.

