answer: |-
  Here's a single, powerful principle to distinguish acceptable from problematic idealizations:

  **An idealization is acceptable if the false assumption *doesn't distort the core causal mechanism* driving the phenomenon you are studying. It is problematic if the false assumption *removes or fundamentally alters* that core mechanism.**

  Let's break this down with your examples:

  1.  **Climate Sphere:** Core mechanism = *Global energy balance*. False assumptions (perfect sphere, uniform albedo) *don't distort* the fundamental inflow/outflow calculation at planetary scale; local variations largely average out.
  2.  **Orbital Periods:** Core mechanism = *Gravitational attraction*. False assumption (point masses) *doesn't distort* the gravitational force dependence on mass and distance; internal structure is irrelevant for center-of-mass motion.
  3.  **Epidemic Totals:** Core mechanism = *Transmission rate scaling with susceptible/infected contact*. False assumption (random mixing) *doesn't distort* the basic SIR dynamics for *total* infections in large populations; heterogeneity often averages out.
  4.  **Predator-Prey:** Core mechanism = *Population-level growth/consumption rates*. False assumption (continuous populations) *doesn't distort* the large-scale dynamics; individual stochasticity averages out for densities.
  5.  **Panic Buying:** Core mechanism = *Psychological contagion, herding, fear*. False assumption (rational calculators) *removes/destroys* the very mechanism (irrational behavior) driving panic. **Problematic.**
  6.  **Tidal Locking:** Core mechanism = *Tidal friction/distortion*. False assumption (point masses) *removes/destroys* the mechanism (physical deformation of bodies) entirely. **Problematic.**
  7.  **Targeted Vaccination:** Core mechanism = *Exploiting network structure/heterogeneity*. False assumption (random mixing) *removes/destroys* the core mechanism and strategy (targeting high-risk nodes). **Problematic.**
  8.  **Opinion Polarization:** Core mechanism = *Threshold behavior, discrete interactions, network structure*. False assumption (smooth diffusion, no thresholds) *removes/destroys* the core mechanisms (e.g., cascades, echo chambers) that drive polarization. **Problematic.**

  **Applying the Principle to the Economist Case:**

  *   **Phenomenon:** Why some companies adapt fast to new tech, others don't.
  *   **Model:** Firms as black-box profit maximizers.
  *   **Core Mechanism?** This is the crux.
      *   If the *core mechanism* driving adaptation speed is primarily *external* (e.g., market competition intensity, regulatory environment, access to capital), then the black-box assumption *might be okay*. The internal structure isn't the *primary* driver of the variation in adaptation speed *in this specific context*.
      *   If the *core mechanism* driving adaptation speed is primarily *internal* (e.g., organizational inertia, decision-making hierarchies, corporate culture, specific R&D capabilities), then the black-box assumption *removes/destroys* the core mechanism. It renders the model incapable of explaining the variation it purports to explain. **Problematic.**

  **Your gut flip-flopping is justified!** The validity hinges entirely on whether the economist is focusing on external pressures vs. internal capabilities as the *core mechanism* for adaptation speed in their specific model and question. Without specifying that focus, the model is ambiguous.

  **Which Pair of Verdicts Needs to Go for Simplicity?**

  Your verdicts on **Orbital Periods (Fine) vs. Tidal Locking (Not Fine)** are the pair that creates tension if we demand the principle be *solely* about the *mathematical form* of the model or the *scale*.

  *   **The Conflict:** Both use the *exact same mathematical model* (point masses, Newtonian gravity). Your gut says one application is valid, the other is invalid. This seems contradictory based purely on the model's equation.
  *   **Why the Principle Resolves It:** The principle isn't about the math *itself*, but about the *mechanism the math is being used to represent*. For orbital periods, the point-mass gravity captures the mechanism. For tidal locking, the point-mass model *cannot* represent the mechanism (tidal deformation/friction), even though the gravity equations are identical. The phenomenon dictates the required mechanism, not the math.
  *   **Forcing Simplicity:** If you insisted on a principle based *only* on "Is the math identical?" or "Is it large-scale?", you'd have to declare *both* applications either valid or invalid. To keep the principle simple *and* match your intuitions, you must accept that the *same mathematical structure* can be valid for one phenomenon (orbits) and invalid for another (tidal locking) because the *core mechanisms* are different. The principle "**Distorts the core mechanism?**" handles this naturally.

  **Conclusion:**

  The line between acceptable and problematic idealizations is drawn by the **fidelity to the core causal mechanism** of the specific phenomenon under investigation. Your economist case highlights that the *focus of the question* (what mechanism is central?) determines if the idealization is valid. The Orbital Periods/Tidal Locking pair demonstrates that the *phenomenon*, not just the math, dictates whether a specific false assumption is tolerable or fatal. This principle provides a robust and intuitive framework for evaluating scientific models.
