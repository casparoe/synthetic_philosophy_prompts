  The user's core need is a clear, consistent principle to evaluate such models. They also want to know if any of their judgments conflict with this principle. 

  Considering existing philosophy of science concepts like robustness and isolation. Robustness means the false assumption doesn't affect the key outcome because the errors cancel or are negligible. Isolation involves stripping away irrelevant details to focus on core mechanisms. But the user's examples suggest that sometimes even when the math is similar, the validity depends on whether the false assumption removes a crucial mechanism.

  The key principle might be whether the false assumption distorts the causal mechanism under study. In the tidal locking vs. orbital period example, the equations are the same, but for tidal locking, surface details are essential. So the principle hinges on whether the idealized component is central to the phenomenon being explained. 

