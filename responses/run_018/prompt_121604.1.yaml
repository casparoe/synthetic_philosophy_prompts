  Alternatively, the predator-prey vs. opinion polarization example. The user accepts smooth equations for biology but rejects them for sociology. The principle here is that discrete thresholds in human behavior might significantly alter outcomes like polarization, even at scale, whereas in large animal populations, continuous approximations hold. This seems consistent with the mechanism being preserved or not.

  The pair that might conflict is the physicist examples. The same point-mass model is valid for orbits but invalid for tidal locking. The principle here is clear: the mechanism in question (gravity vs. tidal forces) determines if the idealization is permissible. So this pair actually illustrates the principle well rather than conflicting.

  Therefore, the unifying principle is whether the false assumption removes or distorts the core mechanism driving the phenomenon of interest. For the economist, if internal dynamics are crucial to adaptation speed, the black-box model is inadequate. The pair that might need adjustment could be the epidemiologist cases if robustness arguments apply differently, but they seem consistent. Alternatively, the predator-prey vs. sociology models might be inconsistent if scale alone justifies idealization, but thresholds in social systems introduce nonlinearities that averages don't capture. 

