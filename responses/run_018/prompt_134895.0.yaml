prompt: |-
  i'm trying to figure out what i should actually demand from a theory of multipolar traps and races-to-the-bottom before i commit to one. write me the desiderata: what cases it has to explain (climate inaction, ai development races, maybe fisheries collapse), which distinctions it can't collapse — like between a true multipolar trap and just a hard collective-action problem, or between a race to the bottom and a race to the top that still ends badly — and which institutional features it needs to stay consistent with. for each, say why it's a real requirement and not just a prejudice of one camp, and flag which ones are non-negotiable versus which are just preferences of particular schools. also, the theory has to handle what i'll call 'epistemic fragmentation traps,' where the agents don't just defect but actually stop sharing a model of the payoff structure itself — don't let it treat that as plain infromation asymmetry. if some subset of these can't all be satisfied together, say so — that's the part i care about most. tell me which single desideratum kills the most popular game-theoretic and institutional-economics accounts. briefly score the usual suspects — evolutionary/game-theoretic, institutional economics, maybe the scott alexander-style moloch framing — against your list. no bibliography needed, i just want the spec.
reasoning: |-
  Okay, the user is asking for a set of desiderata to evaluate theories of multipolar traps and races-to-the-bottom. They want a clear specification: which cases the theory must explain, key distinctions it shouldn't collapse, institutional features it must be consistent with, and especially how it handles epistemic fragmentation. They also want to know if these requirements conflict and which single criterion breaks popular theories. 

  Hmm, this is a sophisticated request—the user clearly understands the literature but is frustrated by gaps. They're not just collecting theories; they're designing a stress test. The "epistemic fragmentation" demand suggests they've seen theories fail when actors don't even agree on the rules of the game. 

  First, non-negotiables: The theory must handle classic collective action failures (climate, fisheries) while distinguishing traps from mere coordination problems. It can't treat defection as purely rational—institutional path dependence matters. And crucially, it must model when agents develop incompatible worldviews (e.g., AI safety vs. capabilities researchers talking past each other). 

  Ah, the conflict point: Institutional granularity clashes with parsimony. Moloch-style narratives are elegantly simple but ignore how some institutions *do* escape traps. Meanwhile, game theory often assumes shared payoff knowledge—fatal when epistemic fragmentation hits. 

  Biggest theory-killer? Epistemic fragmentation. Most game-theoretic models implode if players dispute the game itself. Institutional economics fares better but often downplays competitive dynamics. Scott Alexander's Moloch framing? Powerful metaphor, but its vagueness about institutional plasticity is a flaw. 

  User's buried question: "Which theory won't break when reality gets messy?" They'll reject anything that can't handle cases where disagreement runs deeper than incentives. Gotta flag that trade-off between generality and precision upfront.
answer: |-
  Here's your specification for evaluating theories of multipolar traps (MPTs) and races-to-the-bottom (RTBs), designed to stress-test frameworks and expose fundamental trade-offs:

  **Core Desiderata (Non-Negotiable - Failure here disqualifies the theory):**

  1.  **Explain Canonical Cases:** Must rigorously model:
      *   **Climate Inaction:** Why coordinated emission cuts fail despite existential risk.
      *   **Fisheries Collapse:** Why individual actors overfish even knowing it destroys the shared resource.
      *   **AI Development Race:** Why safety concerns are deprioritized under competitive pressure for capability/advantage.
      *   **Why?** These are the core empirical phenomena the theory *must* illuminate. Failure indicates irrelevance.

  2.  **Distinguish MPT/RTB from Mere Collective Action Problems (CAPs):**
      *   Must differentiate scenarios where the *structure of competition itself* creates the trap (e.g., winner-takes-all dynamics, pre-emptive strikes, shifting baselines) vs. scenarios where coordination is difficult but the payoffs don't inherently require mutual defection for individual survival/competitiveness (e.g., building a public park).
      *   **Why?** Conflating MPTs with generic CAPs obscures the specific mechanisms (like competitive interdependence) that make these traps uniquely pernicious and hard to escape. This distinction is fundamental.

  3.  **Handle Epistemic Fragmentation Traps (EFT):**
      *   Must model scenarios where agents:
          *   Develop fundamentally incompatible models of the world/payoff structure (e.g., "AI X-risk is real" vs. "AI X-risk is sci-fi").
          *   Stop sharing information *because* their models conflict, not just due to secrecy.
          *   Interpret the same outcomes differently based on their model (e.g., safety slowdown seen as prudence by some, as fatal lag by competitors).
      *   **Cannot** reduce this to simple information asymmetry or differing priors. It requires modeling divergent *ontologies* or *causal frameworks*.
      *   **Why?** Reality demands this: Climate denialism, fundamentally different AI risk models, conflicting economic ideologies in trade/environment. Treating this as just "hidden info" grossly misrepresents the barrier to cooperation.

  4.  **Account for Institutional Path Dependence & Granularity:**
      *   Must be consistent with how *existing institutions* (states, firms, treaties, norms) shape agent options, costs, and perceptions *differentially*.
      *   Must allow that institutions can be *part of the trap* (e.g., WTO rules forcing deregulation races, shareholder primacy norms) or *potential escape hatches*.
      *   **Why?** Institutions aren't neutral backdrops; they actively co-constitute the game. Ignoring their specific, sticky features yields unrealistic solutions. This is empirically undeniable.

  **Critical Distinctions (Must Preserve - Collapsing these indicates oversimplification):**

  5.  **RTB vs. RT Top (RTT) with Bad Outcomes:**
      *   Must distinguish destructive competition driving standards/conditions/welfare *down* (RTB - e.g., tax havens, lax pollution regs) from competition driving *investment/innovation up* at unsustainable/risky speeds (RTT - e.g., AI capability race, Cold War arms race) even if both end badly.
      *   **Why?** Mechanisms differ: RTB often involves *cost externalization*, RTT involves *accelerated risk accumulation*. Solutions differ (e.g., harmonization vs. speed limits).

  6.  **True Trap vs. Hard Bargaining:**
      *   Must differentiate situations where *no stable cooperative equilibrium exists* under current rules/incentives (true trap) from situations where a mutually beneficial deal *is* possible but hard to reach due to transaction costs, mistrust, or distributional conflict.
      *   **Why?** Prescribes different interventions: building new institutions/tech to change the game (trap) vs. better negotiation/mediation (bargaining). Conflation wastes effort.

  7.  **Agent Heterogeneity:**
      *   Must accommodate significant differences in agent power, vulnerability, discount rates, values, and internal decision-making structures (not just monolithic "players").
      *   **Why?** Homogeneity is a fantasy. Power imbalances and differing vulnerabilities (e.g., climate impacts on SIDS vs. petrostates) are central to real-world dynamics.

  **Preferences (Useful but Theory-Specific):**

  8.  **Explain Escapes:** How some traps *are* avoided (e.g., Montreal Protocol, some fishery co-management). (Highly desirable, but escape mechanisms may be exogenous to core trap logic).
  9.  **Handle Multi-Scalarity:** Integrate traps operating across levels (e.g., corporate competition within states within int'l system). (Adds complexity, crucial for realism).
  10. **Role of Ideology/Norms:** How shared beliefs or norms can mitigate (or exacerbate) traps beyond material payoffs. (Important, but theories differ on weighting).

  **Key Tensions & Trade-offs:**

  *   **Granularity vs. Parsimony (Des. 4 vs. Model Simplicity):** Incorporating specific institutional details (Des. 4) inherently conflicts with building simple, general models. **Trade-off:** Highly granular models become unwieldy; overly abstract models miss crucial institutional lock-in.
  *   **EFT Modeling vs. Traditional Rationality (Des. 3 vs. Standard GT):** Rigorously modeling fundamentally divergent worldviews (Des. 3) is incredibly complex and clashes with standard game theory's assumption of a commonly known (or learnable) payoff structure. **Trade-off:** Incorporating EFT often requires abandoning core GT assumptions or using less formal/narrative frameworks.
  *   **Heterogeneity vs. Tractable Equilibrium (Des. 7):** Incorporating deep heterogeneity makes finding stable equilibria or clear predictions much harder. **Trade-off:** Realism vs. predictive clarity.

  **The Single Biggest Theory-Killer: Epistemic Fragmentation Traps (Des. 3).**

  *   **Why?** Most popular game-theoretic accounts (Prisoner's Dilemma variants, Tragedy of the Commons models) **assume a commonly known (or learnable) payoff structure.** They fundamentally break when agents cannot agree on what game they're even playing, what the outcomes mean, or what constitutes a "payoff." Information asymmetry models don't capture deep ontological divergence. This flaw renders them inadequate for modern polarized dilemmas like climate politics or AI governance disputes.

  **Scoring the Usual Suspects:**

  1.  **Standard Evolutionary/Game Theory (PD, Coordination Games, Replicator Dynamics):**
      *   **Strengths:** Clear on core CAPs (Des. 1 - Fisheries), good on RTB/RTT distinction basics (Des. 5), sometimes handles heterogeneity (Des. 7).
      *   **Fatal Flaws:** Fails **Des. 3 (EFT)** catastrophically (assumes known payoffs). Often weak on **Des. 4 (Institutions)** (treats rules as exogenous). Struggles with **Des. 2** by often labeling any CAP as a "trap." Collapses **Des. 6**. Parsimony prioritized over granularity.
      *   **Verdict:** Useful baseline, fails modern complexity.

  2.  **Institutional Economics (Ostrom, North, Williamson):**
      *   **Strengths:** Excellent on **Des. 4 (Institutions)** - core focus. Explains escapes (**Pref. 8**). Handles heterogeneity (**Des. 7**) and some granularity. Strong on distinguishing CAP types (**Des. 2, Des. 6**).
      *   **Weaknesses:** Often less rigorous on competitive dynamics driving true traps (**Des. 1 - AI Race** nuance). Less developed on **Des. 5 (RTT vs. RTB)** dynamics. Can struggle with **Des. 3 (EFT)** - often assumes institutions can bridge differences, underestimating intractable worldview clashes. Less focus on pure competitive races.
      *   **Verdict:** Strong on institutions & CAPs, weaker on cutthroat competition races and deep epistemic divides.

  3.  **"Moloch" Framing (Scott Alexander/Postrationalist):**
      *   **Strengths:** Powerful metaphor for **Des. 1 & Des. 2**, captures visceral dread of systemic incentive misalignment. Intuitively handles **Des. 5 (RTT)**. Acknowledges **Des. 3 (EFT)** implicitly ("different gods").
      *   **Weaknesses:** Lacks **rigorous mechanism** (violates Des. 2, 3, 5, 6 precision). Vague on **Des. 4 (Institutions)** - Moloch feels omnipotent, downplays institutional plasticity. Not predictive. Risks collapsing distinctions into a single vague "bad coordination" force. More narrative than theory.
      *   **Verdict:** Evocative diagnostic, poor prescriptive/analytic tool. Fails specificity requirements.

  **Conclusion:** No current dominant theory satisfies all non-negotiables, primarily due to **Epistemic Fragmentation Traps (Des. 3)** breaking standard rational-choice foundations and the **tension between institutional granularity (Des. 4) and parsimony**. A viable theory must either: 1) Develop radically new formal tools for EFT within GT, accepting complexity, or 2) Prioritize a rich institutional/evolutionary framework incorporating cognitive science/political theory on worldviews, sacrificing some formal elegance. **Desideratum 3 is the primary filter.** Demand explicit, non-handwavy mechanisms for handling fundamentally incompatible agent models of reality.
