prompt: |-
  I am preparing a single ninety-minute seminar for final-year philosophy undergraduates who have just completed a module on moral motivation but have not yet encountered Bernard Williams’s internal reasons thesis in detail. I want them to understand the wrong kind of reasons problem — specifically, why possessing an instrumental reason that reliably promotes an end does not automatically furnish a reason to pursue that end, and why supplying an external consideration often fails to generate the corresponding motivation. Rather than asking for the explanation itself, I need a teaching plan: the precise order in which the conceptual pieces must be introduced so that the internal/external distinction feels earned rather than stipulated; the one concrete carrying scenario that should sustain the session (together with an explicit justification for avoiding the standard gunman or moral-blackmail examples, which I think would mislead this audience); the predictable misconceptions that will form at each stage — particularly the slide from “wrong kind of reason” into “no reason whatsoever,” the conflation with weakness of will, and the assumption that normative force just is psychological efficacy — along with the exact point in the sequence where each should be intercepted; a single diagnostic question I can pose near the end to test whether they have grasped the dependency between reason and motivation rather than merely memorised the distinction; and what I should openly decline to cover at this level, with a brief rationale for each omission. The students are analytically sharp but prone to treat philosophical distinctions as psychological descriptions.

  Please present this as a structured pedagogical plan rather than as the explanation itself, use British spelling throughout, keep the response under 450 words, and do not include any reading lists, bibliographies, or requests for citations.
