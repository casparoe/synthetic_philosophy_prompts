answer: |-
  **Pedagogical Plan: Williams’ Internal Reasons & the ‘Wrong Kind’ Problem**

  **Core Objective:** Students grasp why instrumental efficacy ≠ normative reason, and why external considerations fail to motivate, via Williams’ internalism, without conflating normative force with psychological efficacy.

  **Carrying Scenario:** *The Reluctant Accountant.* An accountant, Alan, has no desire for public speaking. His boss threatens redundancy unless he delivers a key conference talk. Alan practices diligently (instrumental reason) to avoid job loss.  
  *Justification:* Avoids moral/coercive baggage of gunman examples. Focuses cleanly on the reason/motivation gap within a normatively neutral, career context familiar to students.

  **Structure (90 mins):**

  1.  **Recap & Setup (15 mins):**  
      *   Briefly revisit Humean motivational psychology (from prior module): Belief-Desert model. Motivation requires existing desire + means-end belief.  
      *   Pose: *If Alan reliably believes practice will secure his job (means-end), does he thereby have a reason to pursue public speaking?*  
      *   **Predictable Misconception:** Initial "Yes" (equating instrumental efficacy with normative reason). *Intercept:* Challenge – "Is the reason *for* public speaking, or *against* redundancy? What desire is served?"

  2.  **Introducing Williams’ Challenge (25 mins):**  
      *   Present Williams’ core claim: "A has a reason to φ" only if φ-ing serves some element in A’s *Subjective Motivational Set* (S) – not just beliefs/desires, but broader commitments.  
      *   Apply to Alan: His S contains *avoiding redundancy* (motivating the practice), but *not public speaking itself*. The boss's threat provides a reason *to avoid redundancy* (internal), but not automatically a reason *to speak* (the suggested φ).  
      *   **Key Distinction:** Internal Reason (grounded in S) vs. External Reason (purported reason lacking S-grounding).  
      *   **Predictable Misconception:** "So external reasons are just ineffective/motivationally inert?" (Conflating normative status with psychological efficacy). *Intercept:* Stress: Williams’ claim is *conceptual* – an external reason *lacks normative status for A* because it’s not grounded in S, irrespective of whether it *could* motivate A via other means (e.g., coercion causing a new desire).

  3.  **The Wrong Kind of Reason Problem (30 mins):**  
      *   Zoom in: Alan’s diligent practice is a *sound instrumental reason* relative to his desire to avoid redundancy. But...  
      *   *Question:* Does this instrumental reason *itself* furnish a reason *to value or pursue public speaking* as an end? (No).  
      *   The boss's threat (external consideration) *fails to generate* a reason *to speak*; it only generates a reason *to act as if* one values speaking to avoid the threat. It’s the *wrong kind* of reason for the purported end (speaking).  
      *   **Predictable Misconception:** "So Alan has *no reason whatsoever* to speak?" (Sliding from 'wrong kind' to 'no reason'). *Intercept:* Emphasise Alan *does* have powerful internal reasons *to practice and deliver the talk* (to avoid redundancy). But these are reasons *for those actions*, not reasons *to endorse or desire public speaking itself*.

  4.  **Clarifying Weakness of Will (10 mins):**  
      *   *Contrast Case:* Suppose Alan *wants* to be a good speaker (it’s in S), knows practice helps, but procrastinates.  
      *   **Predictable Misconception:** Conflating this (weakness of will – failure to act on an *internal* reason) with the external reason case (no S-grounding for the reason). *Intercept:* Highlight the difference in the *source* of the failure: weakness concerns *acting* on reasons; externalism concerns the *existence* of the reason for A.

  5.  **Diagnostic Question (5 mins):**  
      *   *"If Alan, after the boss's threat, suddenly developed a genuine, non-instrumental desire to speak well, would the boss's threat retrospectively become an* internal *reason for him to speak? Why/Why not?"*  
      *   *Tests:* Grasp that internal reasons depend on the *actual* S at the time, not later changes. Motivation is necessary (for existence *for A*) but not sufficient (it must ground the reason).

  6.  **Explicit Omissions (5 mins):**  
      *   **Taxonomy of S:** Deliberation, imagination, etc. *Rationale:* Overly complex for intro; focus is core dependency.  
      *   **Moral Implications:** Does this undermine morality? *Rationale:* Requires separate, substantial discussion beyond scope.  
      *   **Realism about External Reasons:** Williams' anti-realism vs. objectivist responses. *Rationale:* Deep meta-ethical debate; session establishes Williams' *internalist* challenge only.  
      *   **Detailed Exegesis of Williams' Texts:** *Rationale:* Aims for conceptual grasp, not textual mastery.
