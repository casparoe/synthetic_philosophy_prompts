  Avoiding weakness of will confusion is vital. The interception must happen when explaining psychological efficacy, explicitly differentiating failed motivation (weakness) from absent grounding (external reasons). 

  The diagnostic question ("If he felt motivated after the threat, would that make it an internal reason?") tests if they grasp motivation as necessary but not sufficient. 

  Omissions are strategic: no taxonomy of internal reasons (too advanced), no moral implications (distracts), no external realism debate (beyond scope). The rationale is maintaining focus on the core dependency. 

