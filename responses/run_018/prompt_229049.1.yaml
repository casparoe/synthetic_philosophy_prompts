prompt: |-
  I'm working on a time travel novel where the protagonist goes back to 1955 to stop her grandfather from ever meeting her grandmother (long story, inheritance dispute, it makes sense in context). Anyway, the deeper I get into plotting the more I realize I don't actually know what I, the author, believe happens when she pulls the trigger, and every beta reader gives me a different answer. So I want to make a little quiz for my writers' group: "what's your actual theory of changing the past?" Eight to ten questions, each a concrete scenario (the gun jams every time no matter what she does; she succeeds and fades out of a family photo; she succeeds and wakes up in a present where she was never born but somehow still exists and remembers everything; she kills a man who turns out not to be her grandfather after all, and the family resemblance was a coincidence...), with two or three answer options each.

  Then give me a scoring key that maps answer patterns onto the main positions: the fixed-timeline view where the past was always already "visited" and consistency constrains what a traveler can do (so her attempt must fail or be what caused things all along), the branching view where killing him just spawns a new timeline and her own past stays untouched, the mutable-single-timeline view where the future actually rewrites itself (with or without the traveler remembering the old version), and the killjoy position that backwards time travel is simply impossible so every question has the same boring answer. Also flag any answer combinations that don't correspond to a real position and say why nobody seems to live there (incoherent? just unpopular?), and flag any two positions my quiz can't tell apart. The questions should sort people by what they say happens in the cases, not by whether they recognize fancy words, so don't ask anything like "are you an eternalist."

  If any of the scenarios above are ambiguous between positions, sharpen them or swap in better ones. And please write the whole thing in American English.
reasoning: |-
  Okay, let me tackle this user's request. They're writing a time travel novel where the protagonist tries to prevent her grandparents from meeting in 1955, but they're struggling with the mechanics of changing the past. Their beta readers have conflicting opinions, so they want to create a quiz for their writers' group to help clarify different theories of time travel.

  First, I need to understand the core issue: the author is unsure how time travel should work in their story, which affects the plot's consistency. They want a quiz that presents concrete scenarios without using jargon, sorting people into categories like fixed timeline, branching timelines, mutable timeline, or the impossibility view.

  The user provided several scenarios, but I should check if they're ambiguous. For example, the gun jamming could fit multiple theories. I need to refine these to clearly differentiate the positions. Each question should have distinct outcomes that map cleanly to one theory over others.

  Next, the quiz structure. Eight to ten questions, each with two or three answer options. Each scenario should test a specific aspect: successful change, failed change, unintended consequences, etc. For instance, including a question about the protagonist's birth after changing the past can distinguish mutable vs. branching timelines. Another about meeting another time traveler could test fixed vs. mutable theories.

  I'll avoid any terminology like "eternalist" and focus on outcomes. For example, instead of asking about the grandfather paradox, I'll present a situation where the protagonist tries to kill their grandfather and describe possible results.

  Scoring is crucial. The key must map answer patterns to the four theories. Some combinations might not fit any theory, so I'll note those as inconsistent. Also, some theories might overlap in answers, like fixed timeline and impossibility both predicting failure to change events. I need to flag that the quiz can't always distinguish between them, but the user's scenario involving the protagonist's continued existence might help separate the views.

  Potential pitfalls: Ensuring scenarios aren't ambiguous. For example, the family photo fading could imply mutable timeline, but in branching, it wouldn't change. Including a scenario where the change succeeds but the traveler remains unchanged helps differentiate mutable from branching. Also, adding a question about encountering other time travelers can test if changes are predestined.

  I'll use American English, as requested. Each question should be concise and the answer choices clear. The scoring will tally responses and categorize them. For instance, mostly A answers indicate fixed timeline, mostly B for branching, etc. I'll also note where answers conflict, like if someone picks mutable in some scenarios but fixed in others, that's inconsistent.

  Finally, the user might need to adjust scenarios based on their story's needs. The quiz is a tool for discussion, so emphasizing that it's subjective but helps clarify assumptions is key. Highlighting that some theories (like branching vs. mutable) might have overlapping answers on certain questions but differ on others, like the fate of the original timeline.
answer: |-
  Here's a time travel theory quiz designed to sort writers by their intuitive beliefs about changing the past, using concrete scenarios and avoiding jargon. It focuses on outcomes, not terminology.

  **Your Time Travel Theory Quiz**

  **Instructions:** Read each scenario carefully. Choose the outcome that feels most accurate or "right" to you based on your gut feeling about how time travel *should* work. Don't overthink the physics; go with your narrative instinct.

  1.  **The Grandfather Attempt:** Sarah travels back to 1955 intending to prevent her grandfather, Robert, from meeting her grandmother. She locates Robert just before the crucial meeting point and points a gun at him, determined to shoot.
      *   A) The gun inexplicably jams, misfires, or Sarah's finger slips every single time she tries, no matter what she does or how many times she attempts it. She *cannot* fire.
      *   B) Sarah pulls the trigger and kills Robert. She watches him die.
      *   C) Sarah shoots Robert, but as he falls, she realizes with horror it's the *wrong* man – someone who only looked like Robert. The real Robert is unharmed nearby.

  2.  **The Photo Fade:** Before traveling, Sarah possesses a clear, sharp photograph of her grandparents together at their wedding in 1956. After successfully preventing them from ever meeting (assuming she can), she looks at the photo again.
      *   A) The photo remains unchanged. Her grandparents are still clearly visible in the picture.
      *   B) The photo becomes blurry where her grandparents were, or they fade out entirely, leaving a puzzling gap.
      *   C) The photo instantly vanishes from existence, as if it never was.

  3.  **The Present Paradox:** Sarah successfully prevents her grandparents from ever meeting. She then activates her time machine to return to her original "present" (let's say 2023). What does she find?
      *   A) She arrives in a vastly different 2023 where her mother (and thus Sarah herself) was never born. Society, technology, and her family line are completely altered. She still exists and remembers her original timeline.
      *   B) She arrives back in her *original* 2023, completely unchanged. Her family, her life, everything is exactly as she left it. Her actions in 1955 seem to have had no effect.
      *   C) She arrives in a vastly different 2023 where her mother was never born. As she materializes, she feels herself dissolving or fading from existence, her memories unraveling.

  4.  **The Unintended Consequence:** Sarah doesn't try to kill Robert, but instead tries to subtly sabotage the meeting (e.g., giving Robert bad directions, distracting him with a fake emergency). Despite her careful planning, her actions *directly cause* Robert and her grandmother to meet for the first time, exactly as history recorded.
      *   A) This is exactly what happens. Her attempt to prevent the meeting *is* the reason it happens.
      *   B) Her sabotage successfully prevents the meeting as planned. Robert and her grandmother never cross paths.
      *   C) Her sabotage prevents the *intended* meeting, but through a series of chaotic events she didn't foresee, Robert and her grandmother meet anyway, just later or under different circumstances.

  5.  **The Butterfly Effect Test:** While waiting for her chance to intervene with her grandparents, Sarah steps on a specific beetle in the 1955 park. It's an utterly insignificant action, unrelated to her main mission. When she returns to her present (assuming she hasn't changed her own birth),
      *   A) Everything is exactly the same as when she left. Her stepping on the beetle had no noticeable effect.
      *   B) Her present is subtly but noticeably different: maybe her best friend has a different job, a local landmark is gone, or a minor celebrity exists who didn't before. Small things changed due to the butterfly effect.
      *   C) Her present is catastrophically different due to the cascading effects of that one crushed beetle. It might even be post-apocalyptic.

  6.  **The Stable Loop:** Sarah discovers an heirloom locket in her present that belonged to her grandmother. When she travels to 1955, she realizes she must give this *same locket* to her grandmother as a young woman for it to eventually become the heirloom she found.
      *   A) This makes perfect sense. She *always* was the one who gave her grandmother the locket. It's a closed loop; the object has no true origin point.
      *   B) This feels deeply wrong. If she gives the locket now, it means the locket she found in the future was created by her time travel. It couldn't have existed *before* this trip.
      *   C) She can give the locket, but it creates a duplicate: the one she brought back, and the one her grandmother *would* have gotten otherwise. Now there are two lockets.

  7.  **Meeting Another Traveler:** While in 1955, Sarah encounters another time traveler from a *further* future. This traveler seems surprised to see her and says, "Our historical records indicated no one traveled back to interfere with this event!"
      *   A) This encounter was always part of history. The traveler's surprise is part of the fixed sequence; maybe their records were incomplete or altered. The timeline remains consistent.
      *   B) Sarah's presence *changed* the timeline. In the traveler's original history, no one (including Sarah) came back to 1955 for this event. Sarah's trip created a new branch where interference occurred.
      *   C) This encounter causes a paradox that destabilizes reality or prevents the traveler from returning to their original future.

  8.  **Changing Fixed History:** Suppose Sarah learns that a major, well-documented historical event (like the outcome of a specific local election or a small building fire) happened on a specific date in 1955 in her hometown. She travels back and tries very hard to prevent *only* this small event, using methods completely unrelated to her grandparents.
      *   A) Despite her best efforts, the event happens anyway, often *because* of her attempts to stop it, or through sheer coincidence.
      *   B) She succeeds in preventing the event. History books in her original present now record that the event *didn't* happen, or happened differently.
      *   C) She prevents the event, but when she returns to her present, it's significantly altered (for better or worse) because of that one change, even if her personal history is untouched.

  9.  **The Impossible Task:** Sarah decides to try something fundamentally paradoxical *before* tackling her grandfather: she travels back 5 minutes to try and stop *herself* from activating the time machine for this trip.
      *   A) She fails. Something always prevents her from interfering with her past self's actions just before the trip. She might see herself leave but be unable to intervene.
      *   B) She succeeds in stopping her past self. The timeline where she took the trip ceases to exist (or becomes a dead end), and she exists in a timeline where the trip never happened.
      *   C) Her attempt causes a catastrophic paradox (e.g., reality glitches, she vanishes, the universe implodes).

  ---

  **Scoring Key & Interpretation**

  *   **Tally your answers:** Count how many times you chose A, B, or C.

  **Mapping to Theories:**

  1.  **Mostly A's: The Fixed Timeline (Predestination/Primary Timeline)**
      *   **Core Belief:** The past is immutable. History has already happened, *including* the time traveler's visit. The traveler was always part of events. Consistency paradoxes (like killing your grandfather) are prevented by fate, coincidence, or the traveler's own actions becoming the cause. Changing recorded history is impossible. "What happened, happened."
      *   **Why it fits:** Answers stress inability to change key events (1A, 4A, 8A), actions causing the very thing they tried to prevent (4A), objects looping (6A), encounters being part of history (7A), and preventing paradoxes (9A). The photo remains (2A) and the present is unchanged (3B) or the traveler ceases to exist upon successful paradox creation (3C). The butterfly effect is minimal/nonexistent (5A).

  2.  **Mostly B's: Branching Timelines (Multiverse/Parallel Worlds)**
      *   **Core Belief:** Changing the past doesn't rewrite history; it creates a new, separate timeline branching off from the point of change. The traveler's original timeline remains untouched. The traveler usually arrives in the new timeline they created. Paradoxes are avoided because the "original" past still exists elsewhere.
      *   **Why it fits:** Answers allow successful change (1B, 2C - photo vanishes from *her* possession in *this* timeline?, 4B/C - change or altered meeting, 8B), the photo remains in its original state (2A - it belongs to the old timeline), the traveler returns to an unchanged original timeline (3B) *or* arrives in the altered new timeline (3A - she exists separately). The butterfly effect can be significant (5B/C). Loops feel wrong (6B), encounters indicate change (7B), and stopping your past self creates a branch where you didn't travel (9B).

  3.  **Mostly C's: Mutable Single Timeline (Re-Writing History)**
      *   **Core Belief:** Changing the past *does* rewrite the future in a single, linear timeline. The traveler's arrival alters the flow of history. The "original" future is overwritten. The traveler might be protected from changes (remembering the old timeline) or subject to them (fading out). Paradoxes can be catastrophic or cause rewrites.
      *   **Why it fits:** Answers involve successful change rewriting reality (1B, 2B/C - photo changes/vanishes, 3A/C - altered present with traveler remembering/fading, 4B/C, 5B/C - butterfly effect amplified, 8B/C). Loops might create duplicates or feel unstable (6B/C). Encounters with other travelers indicate change (7B) or cause paradoxes (7C). Attempting deep paradoxes causes disaster (9C).

  4.  **Consistently Choosing the "Failure" or "Impossible" Option (especially 1A, 3B, 4A, 8A, 9A): Time Travel is Impossible (or Effectively So)**
      *   **Core Belief:** Backward time travel cannot logically exist without unresolvable paradoxes. Therefore, in any scenario, either the attempt fails completely, the traveler was always part of events without changing them, or the act of traveling inherently prevents any meaningful change. The universe enforces consistency, making travel pointless for changing history.
      *   **Why it fits:** This heavily overlaps with **Fixed Timeline (A)**. The key difference is emphasis on the *impossibility* of change rather than its predestined nature. Choosing mostly A's, especially the failure options, maps here. Choosing C in scenario 3 (fading away) might also fit a "rewrite erases you" version of impossibility.

  **Flagged Answer Combinations & Ambiguities:**

  1.  **"Incoherent/Unpopular" Combinations:**
      *   **Mixed A & C:** Believing the past is fixed *except* when the traveler changes it, leading to a catastrophic rewrite (e.g., 1A, 2B, 3C, 4A, 8A). Why? It combines immutability with mutability inconsistently. If the past is fixed (1A, 4A, 8A), how can the photo change (2B) or the traveler fade (3C)? This position tries to have it both ways and is logically unstable.
      *   **Mixed B & C:** Believing changes create branches *but also* rewrites the original timeline (e.g., 1B, 2B, 3C, 4B, 8B). Why? The core of Branching (B) is that the original timeline is preserved. Believing the original is *rewritten* (C) contradicts this. If you choose "altered present" (3A) for Branching, that's the *new* timeline, not the original being rewritten. Choosing "original unchanged" (3B) is pure Branching. Choosing "fade" (3C) leans Mutable or Impossibility.

  2.  **Positions the Quiz May Struggle to Distinguish:**
      *   **Fixed Timeline (A) vs. Time Travel is Impossible:** These share *many* answers (1A, 3B or 3C, 4A, 8A, 9A). The key *potential* differentiators:
          *   Scenario 2: Fixed might allow the photo to remain (2A). Impossibility might lean towards it vanishing if change were possible (but it's not, so 2A might still win) or fading (2B) if the traveler's presence is "corrected."
          *   Scenario 6: Fixed embraces loops (6A). Impossibility might find loops nonsensical (6B).
          *   Scenario 7: Fixed incorporates the encounter (7A). Impossibility might see it as proof travel is messy (7B/C) or impossible.
          *   **Conclusion:** The quiz often groups these together. The distinction is more philosophical: *Why* can't it change? Fate/Consistency (Fixed) vs. Logical Impossibility (Killjoy).
      *   **Branching (B) vs. Mutable (C) on "Change Success":** Both allow changes (1B, 4B/C, 8B). The *critical* differentiators are:
          *   Scenario 3: Branching allows returning to the *original* timeline (3B) or arriving in the *new* one (3A). Mutable forces arrival in the *rewritten* timeline, with potential memory/fading issues (3A/C).
          *   Scenario 5: Branching *can* have butterfly effects in the new branch (5B/C), but Mutable *forces* the butterfly effect to impact the *only* timeline (5B/C). However, both can choose B or C here.
          *   Scenario 9: Branching allows creating a branch where you didn't travel (9B). Mutable risks catastrophic paradox (9C) or fading (if you stop yourself).
          *   **Conclusion:** Scenario 3 is the most reliable separator. Choosing 3B strongly points to Branching. Choosing 3A or 3C points to Mutable. Choosing 9B points to Branching, 9C points to Mutable.

  **How to Use This:**

  1.  Give the quiz to your writers' group.
  2.  Have them tally their A/B/C answers.
  3.  Use the scoring key to see which theory their answers cluster under.
  4.  Discuss the results! Pay attention to *why* people chose answers, especially on the key differentiator questions (like Scenario 3). This reveals their core narrative instincts about cause, effect, and consequence in time travel stories.
  5.  **Crucially:** This tells you what your beta readers *believe* should happen, based on their internal logic. The results will highlight which theories feel intuitive/natural to different people. This knowledge helps you understand their feedback ("Why didn't she fade?!" vs. "Of course the gun jammed!") and decide which approach best serves *your* story's themes and plot. Remember, your novel's rules just need to be consistent *internally*, not universally "correct."
