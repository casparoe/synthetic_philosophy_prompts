  - Move number 5 (odd): at C3, can move right to D3 or down to C4.
    - ... and so on.

  We can see that by move 4, everyone is at C3. Then we can force to D3 or C4, but then again at move 6, we can force to D4.

  We can design the rules so that by a certain point, they are forced to a goal. For instance, at move 10, they must be at E5 (Goal X). But if we want them to have the illusion of choice for longer, we can design branching that converges.

  Alternatively, we can have a more complex rule set that uses the entire history. But for simplicity, we'll use the above.

  Goals:
  - Goal X: E5 (10 points) - but by the rules, they might be forced to go to E5 by move 10.
  - Goal Y: C3 (8 points) - they pass through C3 at move 4, but they cannot stop there because we require continuous movement until they reach a goal? We need to define when the game ends: when they land on a goal cell.

  We can set the rules so that they pass through C3 (at move 4) but cannot stop until they reach the end. So the goals must be at the end of the forced path. Let's set:

  - The rules force them to E5 at move 10. So the only goal they can reach is E5 (Goal X). The other goals are unreachable.

  In Round 1, if a Navigator picks Goal Y (C3) and tries to stop at C3, we don't allow it because the rules force them to move on? We can say that goals are only valid if they land on them at the end of a move. But by the rules, they are forced to move until they reach E5. So they cannot stop at C3.

  Alternatively, we can allow stopping at any goal they land on. Then, if they land on C3 at move 4, they can stop and get 8 points. But then the rules must allow that. However, we want to illustrate that they are forced to a particular outcome. So we can design the rules so that they don't land on a goal until the very end (E5). Then, they have to go to E5.

  So let's design the rules so that:
  - At move 4: they are at C3 (which is Goal Y) but the rules do not allow stopping? Actually, we don't have a rule for stopping. We should say the game continues until they land on a goal. And we design the rules so that they only land on a goal at the end of the forced path.

  Alternatively, we can have multiple goals along the forced path, but the rules force them to overshoot until the final goal. For example, at move 4 they are at C3 (Goal Y), but the rules force them to move again (so they leave C3). Then at move 10, they land at E5 (Goal X). So they cannot stop at C3.

