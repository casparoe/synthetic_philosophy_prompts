  ### Research Proposal: Escaping Arrow via Frame-Restricted Preferences  

  **Title:** Arrow's Impossibility Under Frame-Localized Preferences: Axiomatic Relaxations and Empirical Viability  

  #### 1. Introduction & Motivation  
  Arrow’s theorem proves *no* aggregation rule satisfies: (1) universal domain, (2) completeness/transitivity of social preferences, (3) Pareto efficiency, (4) independence of irrelevant alternatives (IIA), and (5) non-dictatorship. Crucially, **completeness** assumes voters can compare *all* alternatives globally. Real-world decisions (e.g., committee evaluations) often involve *incommensurable criteria* (e.g., "cost" vs. "aesthetics"). We relax completeness by restricting comparability to contextual **frames** (e.g., "within-budget alternatives"). We ask:  
  > *If preferences are transitive within frames but incomparable across frames, can we design a non-dictatorial aggregation rule avoiding Arrow’s impossibility?*  

  #### 2. Modified Axioms  
  Let:  
  - $X$: Set of alternatives.  
  - $N$: Set of voters.  
  - $\mathcal{F}$: Set of **frames** (subsets of $X$ covering all alternatives).  
  - For each frame $f \in \mathcal{F}$, voter $i$ has a *complete, transitive* preference $\succ_{i,f}$ over $f$.  

  We replace Arrow’s axioms with:  
  - **A1. Localized Universal Domain (LUD):** Voters submit frame-specific transitive preferences for all $f \in \mathcal{F}$.  
  - **A2. Frame-Restricted Completeness (FRC):** Social preferences are complete/transitive *only within each frame* (not globally).  
  - **A3. Frame-Restricted IIA (FR-IIA):** Social ranking of $\{x,y\}$ in frame $f$ depends *only* on individual $\succ_{i,f}$ for $\{x,y\}$.  
  - **A4. Frame-Pareto Principle:** If all voters prefer $x \succ_{i,f} y$ in frame $f$, society ranks $x \succ_f y$.  
  - **A5. Non-Dictatorship:** No single voter dictates social preferences *across all frames*.  

  **Goal:** Design an aggregation rule $\Phi$ mapping frame-specific voter preferences to social preferences $\{\succ_f\}_{f \in \mathcal{F}}$, satisfying A1–A5.  

  #### 3. Gap in Existing Literature  
  Arrow/Sen assume *global comparability*:  
  - Preferences are defined over $X \times X$ (universal domain).  
  - Completeness forces voters to rank *any* pair (e.g., "statue" vs. "school funding").  
  This ignores **multidimensional incommensurability** (e.g., Sen’s "justice" vs. "efficiency"). Frame-localized preferences model committees using disjoint criteria (e.g., "environmental impact" vs. "jobs created"). Prior work (e.g., "local" Arrovian aggregation) retains global comparability or assumes shared priorities. Our setup is unexplored.  

  #### 4. Method  
  **Phase 1: Formal Model**  
  - **Step 1:** Prove whether A1–A5 *alone* permit non-dictatorial $\Phi$.  
    - *Conjecture:* Arrow re-emerges if frames overlap excessively (e.g., all pairs appear in some frame).  
    - *Potential escape:* If frames are disjoint, apply majority rule per frame (transitive within $f$).  
  - **Step 2:** Define a **frame-aggregation stage** to resolve inter-frame conflicts (e.g., choose between $x \in f_1$, $y \in f_2$):  
    - **Option 1:** "Pareto tiers" (e.g., $x$ chosen over $y$ only if $x$ dominates in *all* frames containing either).  
    - **Option 2:** "Meta-voting" (e.g., voters rank frames; highest-priority frame decides).  

  **Phase 2: Empirical Validation**  
  Test $\Phi$ against real committee protocols:  
  - **Case 1:** UNESCO World Heritage Committee  
    - *Frames:* "Cultural significance" vs. "Preservation feasibility."  
    - *Test:* Simulate decisions using historical data; check if $\Phi$ avoids dictatorship while matching actual outcomes.  
  - **Case 2:** NIH Grant Review Panels  
    - *Frames:* "Scientific merit" vs. "Societal impact."  
    - *Test:* Compare $\Phi$’s recommendations with panel decisions under incomplete cross-criteria comparability.  

  #### 5. Success vs. Failure  
  - **Success:** A non-dictatorial $\Phi$ satisfies A1–A5 and aligns with $>70\%$ of committee decisions in both cases.  
  - **Failure:** Arrow re-emerges when:  
    - (i) Frames overlap such that FR-IIA forces a *frame-level dictator*, or  
    - (ii) Frame-aggregation requires *global comparability*, recreating the original impossibility.  
  - **Partial Win:** If (ii) occurs, we identify minimal global-comparability assumptions needed for tractability.  

  #### 6. Feasibility Assessment  
  **Ambitious but viable** for one semester:  
  - **Scope Control:** Focus on 2–3 frames (avoid topological complexity).  
  - **Formal Work:** Requires only set theory and logic (no advanced math).  
  - **Empirical Work:** Protocols publicly documented; simulations require no primary data.  
  - **Risks:**  
