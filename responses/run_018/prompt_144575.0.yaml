prompt: |-
  I'm attempting to determine whether everyday social conventions—tipping, queuing, jaywalking—generate genuine moral obligations for temporary visitors, or whether they remain merely local etiquette that outsiders may disregard without fault. To frame the question, I distinguish between what I shall call "normative assimilation" (adopting local rules because they sustain welfare-sensitive coordination practices) and "moral tourism" (treating local norms as optional cultural spectacles that impose no duty on the observer). Here are my intuitive verdicts on particular cases, which I hope will reveal whether there is a coherent principle behind them, or whether some verdict must be abandoned.

  In a Manhattan diner where staff wages are legally sub-minimum and depend upon gratuities, I judge that a British tourist who refuses to tip acts wrongly—this feels closer to wage deprivation than to mere rudeness. In Tokyo, where tipping can embarrass staff and violate hospitality norms, I judge that the same tourist ought to refrain, and that pressing cash upon a server would be the moral error. Queuing at a London bus stop strikes me as obligatory for anyone present, visitor or resident, because the line is a fragile coordination device that collapses if even one person defects; but jaywalking in central Berlin when no vehicles are present seems permissible for a visitor, unless they are accompanied by local children, in which case it becomes wrong—not because of traffic risk, but because it models contempt for a shared rule that locals treat with near-sacred seriousness. I also think there is a meaningful difference between violating a convention that harms identifiable individuals (skipping the queue means someone else waits longer) and violating one that merely expresses cultural difference: ignoring a "no shoes" rule in a private home feels rude but not immoral, whereas ignoring it in a mosque feels genuinely wrong.

  Yet I encounter tension. I believe a visitor ought to follow local tipping norms even when they find them morally arbitrary—say, the expectation that one tips hotel porters in New York but not in Oslo—yet I also believe a visitor need not participate in conventions they regard as unjust, such as gender-segregated queuing in certain public contexts, even if refusal causes local offence. Is there a unifying principle—perhaps involving direct harm, coordination failure, complicity in injustice, or respect for autonomous communal practice—that accommodates all these verdicts? Or must I drop either the assimilation obligation or the conscientious-objection exemption? Furthermore, what does the principle predict for a case I have not resolved: should a visitor to a culture with mandatory "gift-giving" to public officials (a practice they regard as bribery) participate to avoid social ostracism, or does the moral-tourism exemption apply?
reasoning: |-
  Okay, the user presents a sophisticated ethical dilemma about whether visitors have moral obligations to follow local social conventions like tipping, queuing, or jaywalking. They distinguish between "normative assimilation" (adopting local rules for coordination) and "moral tourism" (treating norms as optional spectacles). Their examples reveal nuanced intuitions: tipping is obligatory in New York (due to wage structures) but prohibited in Tokyo (to avoid embarrassment), queuing in London is mandatory (as a coordination device), while jaywalking in Berlin is permissible unless children observe (due to modeling effects).

  The tension arises when conventions seem arbitrary (tipping porters in NY vs. Oslo) versus unjust (gender-segregated queues). The unresolved case involves mandatory "gift-giving" to officials (viewed as bribery). I need to identify a principle that reconciles these verdicts without contradiction.

  First, I should analyze their core conflict: they want to respect local practices without endorsing injustice. Their examples suggest several moral dimensions: harm prevention (depriving wages in NY), coordination efficiency (queuing), cultural respect (mosque shoes), complicity (unjust norms), and moral education (children observing jaywalking).

  The proposed framework needs to prioritize preventing direct harm (like wage denial) and maintaining essential coordination (like queues), while allowing exemptions for complicity in injustice (gender segregation) or when conventions lack moral weight (private home shoe rules). The mosque example shows symbolic respect matters when practices carry communal significance beyond mere etiquette.

  For the unresolved gift-giving case, the key is distinguishing genuine bribery from cultural tokens. If the practice involves corruption (coercion or quid pro quo), participation makes one complicit in injustice, outweighing social ostracism. If it's purely symbolic (like tipping), assimilation may be expected. The visitor must assess whether refusal targets systemic harm versus personal discomfort.

  Their deeper need might be reconciling cultural relativism with universal ethics—wanting to be respectful without compromising principles. The framework should affirm that respect doesn't require self-betrayal when core values conflict, provided the refusal is conscientious (not performative). This balances assimilation where it prevents harm or sustains cooperation, with exemption where it upholds justice.
answer: |-
  Your intuitions reveal a remarkably consistent pattern governed by **three core principles**: **Harm Prevention**, **Cooperation Maintenance**, and **Symbolic Respect**. The tensions arise not from inconsistency, but from how these principles interact with context—particularly the *source of normativity* and *complicity risk*. Here's the framework reconciling your verdicts:

  ### The Tripartite Principle for Visitor Obligations:
  1. **Prevent Direct Harm or Unfair Disadvantage**  
     *Obligation applies when violation causes tangible harm or unfairness to identifiable individuals.*  
     - **Tipping in NYC**: Staff rely on tips for subsistence wages. Refusal directly deprives them of earned income → **obligatory**.
     - **Skipping a Queue**: Forces others to wait longer → **obligatory**.
     - *Contrast: Jaywalking in Berlin (no traffic)*: No direct harm → **permissible**.

  2. **Uphold Cooperation-Dependent Practices**  
     *Obligation applies when the norm enables a valuable cooperative system vulnerable to defection.*  
     - **London Queue**: A "fragile coordination device" collapses if defected → **obligatory**.
     - **Tokyo No-Tipping**: Hospitality relies on staff pride in service; tipping disrupts this cooperative dynamic → **refraining is obligatory**.
     - *Contrast: Oslo No-Tipping*: Porters earn living wages; tipping is purely symbolic → **no obligation**.

  3. **Respect Symbolic Boundaries of Sacred/Communal Spaces**  
     *Obligation applies when violation expresses contempt for deeply held communal values.*  
     - **Shoes in a Mosque**: Represents deference to sacred space → **obligatory** (even if no "harm" occurs).
     - **Shoes in a Private Home**: Mere etiquette → **rude but not immoral**.
     - **Jaywalking with Children**: Models contempt for a rule locals treat as morally significant → **wrong**.

  ### Resolving the Tensions:
  - **"Arbitrary" Conventions (NY vs. Oslo Tipping)**: When no harm or cooperation is at stake (e.g., tipping porters in Oslo), compliance is *courtesy*, not obligation. But in NYC, harm principle overrides arbitrariness.  
  - **Unjust Conventions (Gender-Segregated Queues)**:  
    - *No obligation to comply* (and possibly duty to refuse) if:  
      a) Participation implies *endorsement of injustice*,  
      b) Refusal doesn't sabotage a broader cooperation system (e.g., queuing itself remains functional).  
    - *Offense to locals is insufficient* to override complicity in harm/dignity violation.  

  ### The Unresolved Case: Mandatory "Gift-Giving" to Officials
  Apply the framework:  
  1. **Harm Prevention**: If gifts are extorted (e.g., bribes for basic services), participating *harms society* by perpetuating corruption → **refusal obligatory**.  
  2. **Cooperation Maintenance**: If the practice is cultural (e.g., symbolic gifts with no quid pro quo), refusal may cause offense but no systemic collapse → **permissible to decline**.  
  3. **Symbolic Respect**: If the gift is purely ceremonial (e.g., a token to honor tradition), refusal insults communal dignity → **obligatory to participate**.  

  **Verdict**:  
  - If the practice is **bribery** (coerced, expectation of favor), you have a *duty to refuse*—even at risk of ostracism. Compliance makes you complicit in injustice.  
  - If it’s **genuine cultural ritual** (voluntary, symbolic, no favor expected), participation shows respect → **obligatory**.  

  ### Why This Works
  Your intuitions reject "moral tourism" when actions have **relational consequences** (harm, cooperation failure, communal disrespect). They permit flexibility when norms are:  
  - **Purely conventional** (no victim, e.g., jaywalking alone),  
  - **Unjust** (complicity outweighs assimilation), or  
  - **Contextually inert** (no reliance/meaning, e.g., Oslo tipping).  

  This framework preserves both normative assimilation (where principles apply) and conscientious objection (against injustice), without contradiction. The key is discerning *why* a norm exists—not just *that* it exists.
