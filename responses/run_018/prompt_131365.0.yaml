answer: |-
  **MEMORANDUM**  
  **TO:** Board of Trustees  
  **FROM:** Acquisitions and Ethics Committee  
  **DATE:** 26 October 2023  
  **SUBJECT:** Recommendation on Status of Object 447-B (Reconstructed Ceremonial Figure)  

  ---

  ### **I. Background**  
  Object 447-B, a pre-Columbian ceremonial figure (Accession #1948.076), was catastrophically destroyed in 2020 due to structural failure in Storage Vault 3. The original clay exists solely as pulverized fragments. Using high-resolution archival scans and a mineralogically identical synthetic ceramic binder, conservators reconstructed the object with millimetric precision. The committee has evaluated whether the reconstructed form retains the ontological status of the original artifact or constitutes a derivative work requiring re-accessioning and revised labeling.  

  ### **II. Core Philosophical Conflict**  
  The debate hinges on competing theories of artifact identity:  
  - **Material Continuity Argument**: Since all original clay molecules are physically embedded in the reconstruction, the object maintains its identity through persistent material substance.  
  - **Spatiotemporal Discontinuity Argument**: The artifact ceased to exist upon destruction. Its reassembly—using synthetic binder and modern intervention—creates a new entity lacking the unbroken historical trajectory essential to "original" status.  

  **Committee Acknowledgment**: This conflict exposes unresolved tensions in artifact ontology. No universal metaphysical consensus exists; our recommendation prioritizes *institutional ethics and communicative clarity* over claims of philosophical resolution.  

  ---

  ### **III. Recommendation: Re-accession as a Derivative Reconstruction**  
  The committee unanimously recommends **re-accessioning Object 447-B under a new number** and labeling it explicitly as a reconstruction.  

  #### **Key Reasoning**:  
  1. **Spatiotemporal Discontinuity as Decisive**:  
     - The three-year gap between destruction and reconstruction ruptures the object’s historical continuity. Even with original molecules, the artifact’s *biography* as an ancient object ended at collapse.  
     - The synthetic binder (40% by volume) creates a new composite material, fundamentally altering the artifact’s physical cohesion. Identity cannot hinge solely on molecular presence when structural form depends on modern intervention.  

  2. **Ethical Transparency to the Public**:  
     - Labeling the work as "the original statue" risks significant public misunderstanding. Visitors reasonably associate "original" with unbroken historical integrity.  
     - **Convention Precedent**: Major institutions (e.g., British Museum, Getty) re-accession materially altered objects post-conservation. The Venice Charter (1964) emphasizes distinguishing original fabric from modern additions.  

  3. **Acknowledging the Losing Argument**:  
     We recognize the persuasive force of material continuity: had the fragments been mechanically reassembled *without* pulverization or binder, retention of the original accession might be defensible. However, total fragmentation and synthetic integration void this premise.  

  ---

  ### **IV. Implementation Framework**  
  #### **A. Re-accessioning Protocol**  
  1. Assign new accession number (e.g., 2023.R1), denoting "Reconstruction 1."  
  2. Archive original records under #1948.076 with notation: "Destroyed 2020; reconstructed 2023."  
  3. **Timeline**: Catalog updates completed by 30 November 2023.  

  #### **B. Display Labeling**  
  > **Object Label**:  
  > "*Reconstructed Ceremonial Figure*  
  > Original fragments: Chavín culture, 800–200 BCE  
  > Reconstructed: 2023 using mineral-matched synthetic binder  
  > [Photograph of pre-collapse original displayed adjacent]"  

  #### **C. Digital & Supplementary Materials**  
  - Online collections database: Flag as "reconstruction" with technical dossier.  
  - Gallery didactic panel: Explain conservation ethics and the "original vs. reconstruction" distinction.  

  #### **D. Timeline**:  
  - **1 December 2023**: Digital records updated.  
  - **15 January 2024**: New labels installed preceding exhibition.  

  ---

  ### **V. Conceptual Uncertainties & Future Revisions**  
  **Explicit Ambiguities**:  
  - The recommendation relies on *convention* (spatiotemporal continuity as identity criterion) not metaphysical truth. Philosophers like R.G. Collingwood might argue the "re-enacted" ritual context matters more than material; others (e.g., Lynne Baker) emphasize artefact function over substance.  
  - If emerging scholarship establishes material continuity as universally definitive (e.g., via new theories of "hylomorphic persistence"), the committee will revisit this policy.  

  **Trigger for Review**:  
  - New peer-reviewed ontological frameworks for reconstructed artifacts.  
  - ICOM revisions to acquisition guidelines addressing digital/material hybrids.  

  ---

  ### **VI. Conclusion**  
  While Object 447-B’s original material is preserved, its reassembly via irreversible fragmentation and synthetic integration renders it a distinct entity—one embodying both ancient fragments and contemporary conservation. Retaining the original accession would misrepresent the object’s history and undermine institutional credibility. By re-accessioning and transparent labeling, we honor both scholarly rigor and public trust.  

  **Submitted for board vote on 15 November 2023.**  

  ---  
  **Attachments**:  
  1. Conservation Technical Report  
  2. Comparative Case Studies (Reconstructions at Peer Institutions)  
  3. Draft Gallery Label Copy  

  *Approved by Acquisitions and Ethics Committee, 25 October 2023*
