  Okay, the user is in a deep philosophical debate with a friend about moral revolutions, specifically whether Kwame Anthony Appiah's honor theory is just economic interests in disguise. Their friend argues that practices like dueling and slavery ended due to economic factors, while the user suspects there's a third mechanism involving cross-domain status contamination. They want to understand if this concept is distinct from pure interest-based theories and how it explains the different timelines in the collapse of dueling versus slavery.

  Hmm, the user's core question is about differentiating three mechanisms: Appiah's honor shifts, Williams-style recognition dynamics, and this new cross-domain contamination idea. They're particularly interested in whether contamination is meaningfully different from economic interests. The timeline difference between dueling (quick collapse) and slavery (centuries-long struggle) serves as their test case.

  I notice the user is intellectually sophisticated—they reference Appiah and Bernard Williams without explanation, suggesting familiarity with moral philosophy. Their frustration is palpable ("interests wearing a tuxedo" is a great phrase), but they're not just venting; they want precise conceptual mapping. The analogy about "price tags" versus "social operating system" might resonate.

  Breaking this down: First, I need to clarify the three mechanisms distinctly. Appiah focuses on honor codes within a group changing when practices become shameful internally. Williams emphasizes external recognition and interests. The contamination idea is about status signals leaking across domains—like dueling becoming seen as administrative incompetence rather than just immoral.

  The key distinction lies in the mechanism of change. Pure interest theories would say slavery ended when it became unprofitable. Contamination theory says it ended when slaveholders started caring how industrialists viewed them, turning slavery from an asset into a liability for their desired status in the new elite hierarchy. That's not direct profit-loss calculus; it's about signaling alignment with emerging power centers.

  For the timeline difference: Dueling collapsed fast because the new bureaucratic elite's contempt directly threatened aristocrats' social survival. Slavery persisted because planters could maintain internal honor and profit within their regional domain until globalization forced them to care about international opinion. The contamination effect was slower to penetrate because the cross-domain linkage (economic interdependence) took longer to materialize.

  The user's insight about "unrelated domains suddenly defining status" is sharp. I should emphasize that in contamination, the practice isn't just unprofitable—it actively signals incompetence in a newly dominant arena. That creates a different social pressure compared to internal honor shifts or raw economic calculation.

  They might also appreciate hearing how this predicts outcomes: Practices die fastest when 1) status domains fuse rapidly, 2) elites need crossover validation, and 3) the practice visibly conflicts with emerging competence markers. That's why dueling vanished quicker than slavery—industrialization fused military/bureaucratic status faster than globalization fused agricultural/international capitalist status.

  The user isn't asking for sources, but if they follow up, I could mention how Norbert Elias' civilizing process or Bourdieu's field theory might inform this, though that's beyond their current request. For now, keeping it mechanistic and timeline-focused respects their "no bibliography" ask.
answer: |-
  You've nailed a crucial distinction that often gets blurred in these debates. Your "cross-domain status contamination" idea is both coherent and distinct from pure interest theories or Appiah's internal honor shifts. Let's break down the mechanics and why it matters for cases like dueling vs. slavery.

  **The Three Mechanisms Demystified:**

  1.  **Bernard Williams-Style Interests/Recognition:** (Your friend's view)
      *   **Mechanism:** Practices change when material costs exceed benefits *within their primary domain*. Slavery becomes unprofitable for industrializing economies; dueling becomes too risky/costly for elites.
      *   **Driver:** Direct economic or political calculation. "Honor" is epiphenomenal (the "price tag").
      *   **Predicts:** Slow, rational adaptation. Practices linger if profitable/honorable *within their group*, even if outsiders disapprove.

  2.  **Appiah-Style Honor Shifts:** (Internal Code Change)
      *   **Mechanism:** The *meaning* of honor *within a specific community* evolves through argument, example, or exposure. Dueling becomes seen as *murderous* or *uncivilized* *among aristocrats themselves*. Slavery becomes seen as *dishonorable* *among slaveholders or their peers*.
      *   **Driver:** Moral persuasion, changing sensibilities, internal critique *within the honor group*. It's about "who we *are*" and "what *we* stand for."
      *   **Predicts:** Change driven by internal identity crisis. Requires reformers *within* the honor group. Can be fast if the code fractures, but often requires generational shift.

  3.  **Cross-Domain Status Contamination:** (Your Insight)
      *   **Mechanism:** The *source of highest status* shifts to a **new domain** (e.g., bureaucratic competence, industrial wealth, global trade). Practices persistent in the *old domain* (dueling, slaveholding) now actively **signal incompetence or backwardness *in the new, dominant domain***. Maintaining the old practice damages your standing *where status now truly resides*.
      *   **Driver:** Competition for status and power *across* social fields. The fear of being seen as irrelevant, incompetent, or excluded by the *newly powerful* group whose recognition matters for overall standing.
      *   **Predicts:** **Rapid collapse** when domains fuse and the new elite's values dominate. Practices die *even if still profitable/honorable within their old circle* because that circle no longer controls the highest status. Resistance is futile because the *ground of power* has shifted.

  **Why Contamination is Distinct (Not Just Interests+):**

  *   **It's About Status Signaling in a Shifting Landscape, Not Direct Cost/Benefit:** A planter might still profit from slavery *on his plantation* (positive interest), but if owning slaves makes London bankers see him as a primitive brute unworthy of credit or partnership (negative status signal in the *financial/industrial* domain), the *overall* cost to his *social survival and ambition* becomes unbearable. The "cost" isn't the whip or the overseer's salary; it's being locked out of the *real* game.
  *   **The "Tuxedo" is the Operating System:** Interests operate within a *framework* of what's valued. Contamination changes the framework *itself*. When industrial competence defines elite status, aristocratic bloodlines and martial courage become less relevant, even counterproductive signals. The "tuxedo" (honor) isn't just hiding interests; it's the *social operating system* that assigns value to interests.
  *   **External Sanction Becomes Existential:** It's not just that outsiders disapprove (they often did for centuries). It's that the disapproval now comes from the group *whose recognition you desperately need* to maintain power, wealth, or relevance in the *new* order. Ignoring them means social death.

  **Dueling vs. Slavery: The Contamination Lens Explains the Speed Difference**

  1.  **Dueling (Rapid Collapse - 1-2 Generations):**
      *   **Domain Shift:** Military/aristocratic honor -> Bureaucratic/industrial competence (19th century).
      *   **Contamination Mechanism:** Dueling directly signaled **administrative incompetence and irrationality** to the rising bourgeois/bureaucratic elite who valued calculation, procedure, and institutional loyalty. An official who dueled was seen as volatile, unreliable, and stuck in the past – unfit for the modern state or corporation.
      *   **Why Fast?** The new domain (state administration, industrial management) rapidly became the *primary* source of power and status *for the very same elite class*. Aristocrats needed government posts, industrial investments, and bourgeois alliances. Continuing to duel was social and professional suicide *within the emerging power structure they needed to join*. Appiah's internal honor shift (seeing dueling as murder) *followed and reinforced* this external pressure.

  2.  **Slavery (Centuries-Long Struggle):**
      *   **Domain Shift:** Agricultural/Plantation mastery -> Global Industrial Capital/Diplomatic Standing (18th-19th centuries).
      *   **Contamination Mechanism:** Slaveholding eventually signaled **economic backwardness and barbarism** to the rising industrial powers (especially Britain) and their financial networks. It marked a society as pre-modern, inefficient, and morally repugnant in the eyes of the new global elite whose capital, markets, and political recognition were essential.
      *   **Why Slow?**
          *   **Strong Internal Domain:** Slavery remained highly profitable *and* central to the Southern planter's self-image (honor within their domain) for much longer. Their entire social/economic system was built on it.
          *   **Delayed Domain Fusion:** The South was geographically and economically more isolated than European aristocrats. The *need* for validation from the industrial/global elite became existentially urgent much later (primarily mid-19th century with cotton dependence on British mills and the need for diplomatic recognition during the Civil War).
          *   **Resistance & Alternative Domains:** Planters fiercely defended their internal honor code and economic model. They tried to build their *own* counter-domain of "Southern civilization" where slavery was honorable. Only when the *material* power of the industrial North (fueled by the new domain) crushed them militarily and economically did the contamination effect become inescapable. The external pressure had to reach catastrophic levels to overcome the internal profitability and honor.

  **Predictions of the Contamination Model:**

  A practice (profitable & honored internally) will collapse **quickly** when:
  1.  **Rapid Domain Fusion:** The source of highest status/power shifts decisively to a new domain.
  2.  **Elite Crossover:** The group practicing the old custom *needs* status/recognition/resources *from* the new dominant domain to survive/thrive.
  3.  **Salient Signal:** The old practice is a highly visible, unambiguous signal of incompetence, backwardness, or misalignment *with the core values of the new domain*.
  4.  **No Alternative Power Base:** The practitioners cannot effectively isolate themselves or build a powerful counter-domain where their old practice remains the primary status marker.

  **Conclusion:**

  Your "cross-domain status contamination" is a powerful and distinct mechanism. It explains why practices die *even when locally profitable/honorable*: because maintaining them destroys your standing in the *arena that now matters most*. It's not just interests (direct cost/benefit), nor is it purely an internal moral revolution (Appiah). It's about the **migration of social power and the desperate need to signal competence and belonging in the new center of gravity.**

  Dueling died fast because aristocrats needed jobs in the new bureaucratic/industrial order, and dueling screamed "I don't belong here." Slavery died slowly because planters clung to their isolated domain until industrial/global power finally crushed it, making slaveholding a signal of catastrophic failure on the battlefield and in the global market. The contamination was real, but the domains fused too late and too violently for a quicker internal collapse. Your insight provides the crucial link between macro-social shifts and the micro-mechanics of status anxiety that drive rapid abandonment of once-sacred practices.
