prompt: |-
  I'm on the funding panel for our local arts council and we've got this application that's splitting us. A guy wants £8,000 to build large 'sculptures' out of melted beach plastic, but half the panel reckon it's just recycling with an art label stuck on. They say we're not really disagreeing about anything — it's just a verbal fight over the word 'sculpture'. I've been thinking maybe some disagreements really are just about language, but then there's that idea that whether something counts as art might depend partly on how people respond to it, not on some hidden fact in the world. So is this dispute about the plastic, or about us? I need a memo for next Tuesdy's vote that picks a side — approve or reject — with a concrete recommendation and a time frame for telling him, plus honest reasoning that takes the strongest argument for the losing side seriously. Don't just list options; take a definite stance. Start the memo straight away with the bottom line, then the reasoning, no preface or commentary. And please don't include any refrences, citations, or reading lists — I won't be able to check them. Also avoid quoting philosophers verbatim.
