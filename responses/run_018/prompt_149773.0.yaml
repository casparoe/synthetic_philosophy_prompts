  Final quatrain needs that clinching juxtaposition - the two refrains standing like "incompatible measurements." Must resist any closure; the tension should throb in the white space after the last line. 

  For authenticity, I'll weave in concrete details: decaying documents, White's "tragic mold," that scientist's itch of doubt about pure observation. The tone should feel like someone who's genuinely wrestled with primary sources, not just read theory. 

  And yes - I'll plant that "acutally" typo in the first refrain. A little metatextual wink about the instability of representation.
