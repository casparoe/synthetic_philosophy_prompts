  ## The Flashing Self: Anatta, Momentariness, and the Narrative Bridge to Identity

  The doctrine of *anatta* – "not-self" – stands as a cornerstone of Buddhist thought, seemingly obliterating the foundation of personal identity. Yet, Buddhists navigate the world, make ethical choices, and speak of "my" karma and "my" path. This tension isn't resolved by simply contrasting the aggregates (*skandhas*) with Western psychological continuity. To truly probe the compatibility of *anatta* with personal identity, we must inject the radical ontology of Abhidharma momentariness: the doctrine that all phenomena, particularly mental states (*cittas*), are discrete, instantaneous "dharmas" flashing into and out of existence in a rapid, causally linked sequence. This atomic temporality seems to make identity not merely false, but logically impossible. Yet, the doctrine of conventional designation (*samvṛti-satya*) offers a reconstruction. I will argue that while momentariness renders a substantial, enduring self utterly unformulatable, *samvṛti* reconstructs personal identity not as a pale shadow, but as a dynamic narrative construct that bears striking and philosophically significant resemblances to sophisticated Western narrative-identity theories, making them ultimately compatible within the pragmatic framework of lived experience.

  **The Annihilating Flash: Momentariness and the Impossibility of Identity**

  Abhidharma ontology is stark. Reality is not a flowing river but a staccato burst of discrete, momentary events – dharmas. Each citta, each moment of consciousness, arises conditioned solely by the immediately preceding moment and its associated mental factors (*caitasikas*), performs its unique function (e.g., seeing, cognizing, feeling), and utterly ceases. There is *no* substratum, *no* enduring entity that persists. A "person" is merely a conceptual label applied to this sequential cascade of radically impermanent, causally connected, but ontologically distinct events.

  From this perspective, personal identity becomes not just empirically false, but logically incoherent:
  1.  **The Problem of Persistence:** Identity requires *some* degree of continuity over time. Momentariness denies this categorically. There is literally *nothing* identical between dharma-moment T1 and dharma-moment T2. They are distinct existences. Any claim "I am the same as the person who experienced X a moment ago" is fundamentally mistaken; there is only "this experience now" causally linked to "that experience then," but no identical subject linking them.
  2.  **The Problem of Ownership:** We feel sensations and thoughts "belong" to us. But if each sensation is a distinct dharma arising and ceasing, *who* owns it? The preceding dharma-moment? But that dharma has already ceased to exist by the time the sensation arises. There is no abiding owner. The sense of ownership is merely another dharma arising *in the present moment*, conditioned by memory dhammas, creating the *illusion* of a possessor.
  3.  **The Problem of Narrative Cohesion:** Life is experienced as a story. But if each moment is discrete, where does the story reside? It cannot inhere in the fleeting dharmas themselves. The apparent cohesion of memory is merely the arising of memory-impression dhammas (*sati*) causally linked to past perceptual dhammas, creating the *appearance* of a continuous narrative thread where none ontologically exists.

  Under the lens of ultimate reality (*paramārtha-satya*), momentariness dissolves the very possibility of formulating "personal identity" as anything other than a profound misapprehension of the actual, flickering nature of existence. Identity requires duration; momentariness allows only instantaneousness linked by cause, not identity. The self isn't merely empty; it is, in terms of ultimate existence, a complete non-starter.

  **The Reconstruction: Samvṛti and the Narrative Bridge**

  Yet, Buddhism does not leave us in a nihilistic void. The doctrine of the Two Truths asserts that while ultimate reality is momentary dharmas, conventional reality (*samvṛti-satya*) is indispensable for navigating the world. *Samvṛti* is the level of practical designation, of names, concepts, and functional wholes cobbled together from parts. It is here that "personal identity" is reconstructed – not as a discovery of an underlying entity, but as a *useful designation* applied to the causal sequence of aggregates.

  This reconstruction operates through a process strikingly resonant with Western narrative-identity theories (e.g., Dennett, Schechtman, Ricoeur):
  1.  **Designation over Duration:** Just as a "chariot" is designated based on the functional assemblage of parts (wheel, axle, etc.), a "person" is designated based on the functional, causal sequence of the five aggregates. Identity isn't found *in* the aggregates; it is *imputed upon* their flow.
  2.  **Narrative as the Glue:** What makes this sequence cohere as *this particular* "person" rather than a random collection? It is precisely the *narrative structure* imposed upon the flux. Memories (as present-moment dhammas representing past events) are linked causally and thematically. Intentions (future-oriented dhammas) project forward. We constantly weave a story: "I am the one who experienced X, felt Y, and now intends Z." This narrative synthesis, occurring *within* the momentary mind-stream itself (as a series of synthesizing citta/caitasika dhammas), creates the *sense* of a continuous protagonist. The narrative *is* the conventional identity.
  3.  **Functional Pragmatism:** This constructed identity isn't mere illusion; it has pragmatic reality. It allows for moral responsibility ("I" am accountable for actions arising from "my" past intentions, which conditioned present results). It enables goal-directed action ("I" strive for enlightenment). It facilitates social interaction. Crucially, this functionality mirrors the Western narrative view: our identity is the story we (and others) tell about our experiences, giving coherence and meaning to our lives and grounding our agency, even if that story doesn't correspond to a metaphysical essence.
  4.  **Dynamic and Dependant:** Like narrative identity theories, the *samvṛti* self is not static. It evolves as the causal sequence unfolds and the narrative is revised. It is context-dependent, relational, and arises dependently (*pratītyasamutpāda*) – dependent on the momentary dharmas, on the cognitive processes of designation, and on social interaction.

  **Compatibility Achieved: The Narrative Conception Triumphs**

  Does momentariness make personal identity impossible? Absolutely, *if* we insist on identity as an enduring, substantial entity. But if we embrace identity as a conventional, pragmatically necessary, and *narratively constructed* phenomenon grounded in the causal flow of momentary dharmas, then yes, *anatta* and personal identity are compatible.

  The Abhidharma view of momentariness doesn't destroy identity; it reveals its true nature. It shows that identity was *never* what we instinctively thought it was – an unchanging core. The radical impermanence exposes this core as non-existent. However, the human need for coherence, agency, and ethical grounding isn't negated. *Samvṛti*, operating through narrative synthesis of the momentary flow, provides precisely the functional, conventional identity required. This reconstructed identity is *more* akin to sophisticated Western narrative theories than to Western substance-based or even most psychological-continuity models. Both Buddhist *samvṛti* and narrative theories reject the "thing-like" self in favor of a dynamic, story-bound self.

  Therefore, I conclude that Buddhist *anatta*, particularly when understood through the lens of Abhidharma momentariness and the Two Truths, **is fundamentally compatible with a conception of personal identity as a conventional, narratively constructed phenomenon.** The flashing dharmas preclude a substantial self, but the causal continuity and the mind's inherent capacity for narrative synthesis – recognized and legitimized by *samvṛti* – reconstruct identity at the conventional level in a way that is robust enough for ethics, psychology, and lived experience. The "self" is not a lie, but a story we tell about the cascade of moments; and like any powerful story, it shapes reality even while being ultimately composed of fleeting words. The compatibility lies precisely in abandoning the search for an impossible metaphysical anchor and embracing the dynamic, constructed, and profoundly useful narrative that bridges the flashing moments.
