  hey — writing up my philosophical profile for the pragmatizim reading group and want a consistency check before i embarrass myself. here's the package: (1) i'm antirepresentationalist about belief; no mirroring nature, just coping. (2) i mostly buy Rorty's ethnocentrism — justification stops at the edges of our vocabluary, no transcendent court of appeal. (3) but i also defend this idea i call "inter-vocabulary abrasion": vocabularies arent incommensurable islands, they grind against each other through shared practical failures, producing abrasion points where they cant both be kept. (4) i reject the math-is-special move; logic isnt a hidden representational domain. (5) still, i talk about "discovering" logical relations and think conceivability in logic carries some weight, not just rhetorical force. (6) i also think we can rank vocabularies by how much suffering they produce, which sounds like a cross-vocabulary metric. ok, so: doesnt (6) violate (2)? doesnt (5) violate (1) and (4)? and is (3) actually compatible with (2) or does abrasion presuppose a shared standpoint that ethnocentrism denies? rank the real tensions by severity, flag any that only look bad, and tell me the cheapest single revision that cleans up the most mess. also be honest — am i just smuggling representationalism back in through (5) or is there a non-representationalist reading of discovery in logic?
