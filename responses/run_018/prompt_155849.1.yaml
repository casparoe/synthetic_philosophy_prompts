  The bookmaker:
  - Buys from the philosopher an unconditional bet on H today at 0.50. So the bookmaker pays $0.50 and will receive $1 if H.
  - Sells to the philosopher conditional bets on H at the posterior prices. That is, for each report, the bookmaker sells a bet at the price the philosopher will set tomorrow.

