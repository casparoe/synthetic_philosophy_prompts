  Bookmaker: "Now, by reflection, you must also accept conditional bets today for tomorrow's prices after the expert report. So, I will sell to you two conditional bets: one for if the expert says 0.99, and one for if they say 0.51. For the 0.99 case, you've committed to a betting price of 0.95, so I'll sell you a bet on H at 0.95: you pay me $0.95 and I pay you $1 if H. Similarly, for the 0.51 case: you pay me $0.505 and I pay you $1 if H."

