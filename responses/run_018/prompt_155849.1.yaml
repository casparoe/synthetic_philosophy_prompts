  Alternatively, the bookmaker can offer a combination that leads to a sure loss. The key is that the convex filter leads to a violation of the law of total probability. The philosopher's current belief about H should be a mixture of the updated beliefs given the reports. But by the convex filter, the updated beliefs are distorted.

  The philosopher's current credence for H is 0.50. But after updating, the expected posterior credence should be 0.50 by the law of total probability (if the reports are non-informative). However, the reports are non-informative because the expert's report is determined by a coin flip and independent of H. Therefore, the philosopher's posterior should be the same as prior. But the convex filter changes that.

  The expert reports either 0.99 or 0.51, each with 0.5. Without the filter, the Bayesian update would be:
  P(H | report=0.99) = P(H) * P(report=0.99 | H) / P(report=0.99) = 0.5 * 0.5 / 0.5 = 0.5? Wait, but the report is independent of H, so the posterior remains 0.5. Similarly for report=0.51.

