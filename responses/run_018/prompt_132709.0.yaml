answer: |-
  Here are the adequacy conditions for a theory of future contingency, structured by desiderata, motivations, negotiability, and key tensions. The focus is on criteria addressing the sea-battle problem (future contingents like "There will be a sea-battle tomorrow") while avoiding fatalism and logical collapse.

  ---

  ### **I. Core Non-Negotiable Desiderata**  
  *(Essential for any coherent theory; failure invalidates the framework)*  

  1. **Past Fixity (Asymmetry Requirement)**  
     - **Desideratum**: The past must be ontologically fixed/causally closed; past-tensed propositions have determinate truth values.  
     - **Motivation**: Rejecting past fixity (e.g., allowing retrocausality or past alteration) violates intuition about causality, memory, and historical fact (e.g., "Caesar crossed the Rubicon" cannot become false).  
     - **Non-negotiable**: Denial implies metaphysical chaos.  

  2. **Future Openness (Anti-Fatalism Requirement)**  
     - **Desideratum**: The future must be ontologically unsettled for genuinely contingent events; not all future-tensed propositions are *now* true or false.  
     - **Motivation**: Avoids logical fatalism (where affirming "There will be a sea-battle" today entails inevitability, irrespective of present actions).  
     - **Non-negotiable**: Core to preserving agency and contingency.  

  3. **Logical Coherence**  
     - **Desideratum**: Compliance with non-contradiction (¬(P ∧ ¬P)) and identity (P ≡ P).  
     - **Motivation**: Present-tense reports must obey classical logic (e.g., "A sea-battle is occurring" cannot be both true and false *at the same time*).  
     - **Non-negotiable**: Violation renders the logic unusable.  

  4. **Diachronic Propositional Identity**  
     - **Desideratum**: The proposition expressed by "There will be a sea-battle" must retain identical content across time.  
     - **Motivation**: Truth-value changes must reflect *worldly change*, not propositional mutation (e.g., the same proposition cannot be indeterminate at t₁ and true at t₂ if only time has passed).  
     - **Non-negotiable**: Required for coherent truth-tracking.  

  5. **Retrospective Truth**  
     - **Desideratum**: Once an event occurs or fails, past assertions about it must be evaluable as true/false *from that moment onward*.  
     - **Motivation**: After a sea-battle, "There was a sea-battle yesterday" is true; denying this breaks temporal discourse.  
     - **Non-negotiable**: Anchors truth in actuality.  

  ---

  ### **II. Negotiable Desiderata**  
  *(Camp-specific; reflect metaphysical preferences)*  

  6. **Bivalence for Future Contingents**  
     - **Desideratum**: All propositions (including future contingents) are always true or false.  
     - **Motivation**: Preserves classical logic’s simplicity and the law of excluded middle (e.g., Ockhamism).  
     - **Negotiable**: Rejected by Aristotelians to avoid fatalism; requires privileged truthmakers.  

  7. **Determinism Compatibility**  
     - **Desideratum**: The theory permits a deterministic universe (e.g., where future contingents have hidden truth values).  
     - **Motivation**: Aligns with scientific or theological determinism (e.g., Thin Red Line).  
     - **Negotiable**: Open-future theories explicitly reject this.  

  8. **Thin Red Line (Privileged Future)**  
     - **Desideratum**: There is a single "actual" future branch, making future contingents true/false *now*.  
     - **Motivation**: Grounds truth for future-tensed statements (e.g., "There will be a sea-battle" is true *iff* the actual future contains it).  
     - **Negotiable**: Denied by branching-time models without an ontologically privileged branch.  

  9. **Truth-Value Gaps**  
     - **Desideratum**: Future contingents lack truth values until settled.  
     - **Motivation**: Avoids attributing reality to non-actual futures (Aristotelian view).  
     - **Negotiable**: Rejected by bivalent approaches as ad hoc or logically revisionary.  

  ---

  ### **III. Key Tensions & Jointly Unsatisfiable Sets**  
  - **Bivalence + Future Openness**: If future contingents are *always* true/false (bivalence), openness is threatened unless truth values are non-constraining (e.g., Ockhamist "true future").  
  - **Thin Red Line + Anti-Determinism**: A privileged future branch implies determinism about *which* branch is actual, conflicting with openness.  
  - **Retrospective Truth + Truth-Value Gaps**: If "P" is gappy at t₁ but true at t₂, how is the *same proposition* gappy then true without world-change? Challenges diachronic identity.  

  **Most Severe Tension**:  
  **Bivalence + Future Openness + Retrospective Truth**  
  - If bivalence holds, "P" is true/false at utterance.  
  - If openness holds, "P" isn’t settled *now*.  
  - If retrospective truth holds, "P" becomes true later.  
  - *Conflict*: Bivalence forces a current truth value, but openness denies it, while retrospective truth demands truth-value *change* for the same proposition—threatening diachronic identity.  

  ---

  ### **IV. How Theories Fare on Non-Negotiables**  
  - **Aristotelian (Open Future, Gappy Bivalence)**:  
    - ✅ Past fixity, future openness, retrospective truth.  
    - ⚠️ Tensions with diachronic identity (does "P" change truth status or is a new proposition evaluated?).  
    - ❌ Rejects bivalence for future contingents (negotiable).  

  - **Ockhamist (Bivalent, Non-Privileged Branches)**:  
    - ✅ Past fixity, logical coherence, diachronic identity, retrospective truth.  
    - ⚠️ Future openness is preserved only if truth values are "soft" (not causally constraining), risking fatalism.  

  - **Thin Red Line (Bivalent, Privileged Future)**:  
    - ✅ Past fixity, bivalence, logical coherence, retrospective truth.  
    - ❌ Violates future openness (the "actual" future is fixed now → fatalism).  

  ---

  ### **Summary**  
  A viable theory **must** reconcile past fixity, future openness, logical coherence, diachronic propositional identity, and retrospective truth (*non-negotiables*). The central fault line is whether bivalence applies to future contingents and how truth-makers are grounded without determinism. Aristotelianism sacrifices bivalence to preserve openness; Ockhamism softens openness to save bivalence; Thin Red Line sacrifices openness for bivalence and determinism. The tension between *retrospective truth* and *present indeterminacy* remains the deepest challenge for all frameworks.
