  We are drafting a joint statement between two theorists: a Selected-Effects (SE) etiologist and a Causal-Role (CR) pluralist regarding biological function. The statement will have two main parts: (1) a numbered list of agreed claims, and (2) a table of disagreements with specific cruxes.

  Agreed Claims (both sign onto):
  1. Malfunction is real and not merely statistical deviation (i.e., an entity can be broken or dysfunctional in a normatively significant way).
  2. Function ascriptions do normative work (they are not just descriptive but can ground evaluations like "this is working as it should").
  3. Engineered organs without evolutionary ancestors (e.g., a synthetically grown heart in a lab that never had an evolutionary history) pose a problem for at least one side (the SE theorist must explain how function ascriptions arise without selection history, while the CR pluralist may embrace it but must address the normativity).

  Disagreements Table:
  We will structure the disagreements as a table with the following columns:
  - Crux: The specific point of disagreement.
  - Concrete Case/Relevant Hypothetical: A real or hypothetical scenario that both agree is relevant to the crux.
  - SE Prediction: What the SE theorist would say about the case.
  - CR Prediction: What the CR pluralist would say.
  - Verbal Dispute Flag: Whether the disagreement is (at least partially) verbal (e.g., over the term 'proper function').

  Cruxes to include:
  1. Does an appendix have a proper function if its selection history is murky?
  2. Do synthetic gene drives have functions?

  We'll keep the tone casual and allow a typo or two.

  Let's draft accordingly.
answer: |-
  **Joint Statement: Adversarial Collaboration on Biological Function**  
  *(Selected-Effects Etiologist "SE" & Causal-Role Pluralist "CR")*  

  **Agreed Claims (Signed by Both):**  
  1. **Malfunction is real**: Dysfunction isn’t just statistical noise—a blind eye or a broken rib *truly* malfunts, violating norms tied to its expected contribution.  
  2. **Function ascriptions are normative**: Calling something a "function" isn’t neutral description—it licenses evaluative claims (e.g., "this *should* do X").  
  3. **Engineered organs are a shared puzzle**: Lab-grown organs (e.g., a synthetic kidney with zero evolutionary history) challenge *at least one* of our frameworks. SE struggles to ground normativity without selection; CR must explain why it feels "intuitive" that such organs *should* work.  

  **Disagreements Table:**  
  | Crux | Concrete Case/Hypothetical | SE Prediction | CR Prediction | Verbal Dispute? |  
  |------|----------------------------|---------------|---------------|-----------------|  
  | **Does the appendix have a proper function if its selection history is murky?** | *Case*: Human appendix—historically debated (vestigial? immune role?). *Relevant result*: New fossil/genetic data showing it was *never* under direct selection. | SE: **No proper function**—if no clear selection history, it’s just a byproduct. "Function" requires past fitness contribution. | CR: **Yes, current role counts**—if it *currently* aids gut flora or immune defense, that’s function enough. History is irrelevant. | **Partial**: SE restricts "proper function" to selected effects; CR uses "function" broadly for system contributions. |  
  | **Do synthetic gene drives have functions?** | *Case*: CRISPR-engineered gene drive forcing malaria resistance in mosquitos. *Hypothetical*: Deployed in wild with zero natural precedent. | SE: **No proper function**—engineered traits lack historical selection. At best, it’s a "pseudo-function" by analogy. | CR: **Yes, clear function**—it *causally maintains* disease resistance in the population *now*. That’s function. | **Mostly substantive**: CR sees normativity in current causal roles; SE ties normativity exclusively to natural selection. |  

  **Post-Script Notes:**  
  - **Shared vibe**: We both think the other side is *mostly* wrong but respects the effort to avoid "talking past" each other. CR thinks SE overfixates on history; SE thinks CR’s "system contribution" is too loose to ground norms.  
  - **Casual addendum**: If forced to co-teach a class, we’d probably spend 20 mins debating whether a lab-grown spleen *should* be called functional pre-transplant. (SE: "Only if it mirrors ancestral traits!" CR: "Dude—it filters blood! That’s the job!")  

  —Signed,  
  *SE (selected-effects crew)* & *CR (causal-role chaos mage)*
