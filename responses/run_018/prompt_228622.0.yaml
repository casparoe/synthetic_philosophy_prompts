prompt: |-
  A close friend of mine is a behavioral ecologist who now works as a management consultant, and she has an exasperating habit of sorting every display in nature and in business into one of two bins: honest signal or cheap talk. She insists her rule is nothing more than Zahavi's handicap principle carried into boardrooms — honesty is purchased with cost, full stop. Last night, over several hours and one bottle too many, I tried to convince her that her own verdicts don't actually support that rule, and the argument ended unresolved. What I want from you is a prediction: given her track record below, what will she say about a new case I intend to put to her when we resume, and what principle is she in fact running?

  Her verdicts so far, as best I can reconstruct them: the peacock's train is an honest signal, because a malnourished male simply cannot grow one like it; stotting in gazelles is honest, because a slow gazelle cannot afford the wasted takeoff and because the display is the very athleticism it advertises; the roaring contests of red deer stags are honest, since only a stag in fighting condition can sustain the rate; and a live working interview, in which a candidate spends a full day solving real problems alongside the team, is honest, whereas a polished résumé and a rehearsed sit-down interview are not. On the other side of her ledger: she dismissed a luxury watch as cheap talk, since it can be leased for a weekend or financed by someone drowning in debt, and she said the same of apologies unaccompanied by restitution, and of a firm's boastful press releases about its own stability.

  The new case is this: a small business applying for a loan offers its bank permanent, read-only access to its real sales ledger and live bank feed, verified on the bank's own systems so the data cannot be staged or curated. This costs the owner essentially nothing, yet it would seem to separate healthy businesses from unhealthy ones just as decisively as any peacock's tail separates fit males from starvelings. When I sketched the case she refused to classify it, which is when things got heated. Please give me your best guess as to which bin she will put it in, and — more important than the guess itself — lay out the candidate rules that are each consistent with every one of her earlier calls: whether honesty for her requires differential cost, practical unfakeability, or something subtler that I haven't seen. Say what each candidate rule predicts for the loan case, explain why you favor your prediction, and then tell me the one further case I should put to her next if her answer still leaves her underlying principle ambiguous.
reasoning: |-
  Okay, the user has a friend who's a behavioral ecologist turned management consultant. She categorizes everything into "honest signals" or "cheap talk" based on Zahavi's handicap principle, where honesty comes from cost. They argued about whether her classifications actually support this rule, and it ended unresolved. The user wants to predict how she'll classify a new case about a small business loan with read-only access to sales and bank data, which costs nothing but seems to separate healthy from unhealthy businesses.

  First, I need to look at her past verdicts to understand her pattern. She classified peacock's train, gazelle stotting, red deer roaring, and live working interviews as honest signals. All of these involve significant costs: growing a train requires resources and health, stotting wastes energy and requires athleticism, roaring demands endurance, and a live interview takes a full day of work. On the other side, luxury watches, apologies without restitution, and boastful press releases are cheap talk. These can be faked without real cost: leasing a watch, apologizing without action, or making empty claims.

  The new case is about a business providing real-time, verified financial data to a bank at no cost. The user thinks it's unfakeable because unhealthy businesses can't hide poor data. But since it doesn't cost anything, under Zahavi's principle, it might be seen as cheap talk. However, the user points out that it effectively signals health because faking is impossible.

  I need to find candidate rules consistent with her past decisions. The first candidate is Zahavi's original principle: honesty requires a cost that handicaps the signaler. This would predict the loan case as cheap talk because there's no cost. The second candidate is practical unfakeability: if a signal can't be faked, it's honest, regardless of cost. Here, the loan case would be honest. The third candidate is cost as a proxy for unfakeability: cost ensures unfakeability, but if unfakeability exists without cost, it's still honest.

  Her past verdicts don't clearly show if she requires cost or just unfakeability. For example, the live working interview is costly and unfakeable, while luxury watches are fakeable without cost. The loan case is unfakeable but costless. If she chooses honest, then unfakeability might be her real criterion. If cheap talk, she's sticking to cost.

  I should predict she'll call it honest. Why? Because her dismissal of the watch was due to fakeability, not just cost. Also, the verified data is impossible to fake, making it a strong signal. Plus, she refused to classify it initially, which might indicate hesitation because it challenges her cost-only rule.

  For a follow-up case, I need something where cost and unfakeability are separated. A case with high cost but fakeable, like a costly diploma from a degree mill. If she calls it cheap talk, then unfakeability is key. If honest, she's focused on cost.

  Another angle: the live bank feed is like the gazelle's stotting—it's the actual capability being displayed (financial health vs. athleticism). But stotting has a cost (energy), while the data feed doesn't. Still, the inability to fake might align with her view of honesty.

  I think she'll go with honest because the signal is verifiable and unfakeable, which seems to be the underlying thread in her classifications, even if she emphasizes cost. Her initial refusal might be because she's torn between the cost principle and recognizing the unfakeability.
answer: |-
  Based on her track record and the core tension between "cost" and "unfakeability," here's the breakdown and prediction:

  **Candidate Rules Consistent With Her Past Verdicts:**

  1.  **The Strict Zahavi Rule (Honesty Requires Differential Cost/Handicap):**
      *   **Premise:** A signal is honest *only* if it imposes a significant, differential cost that a low-quality signaller cannot afford or sustain. Cost is the *mechanism* guaranteeing honesty.
      *   **Fits Past Verdicts:** Peacock's train (costly growth), Stotting (costly energy/time waste), Roaring (costly energy/stamina), Live Interview (costly time/effort/exposure) all have clear costs unhealthy/fit signallers bear differently. Luxury watch (no real cost to wear, even if leased), Apology (no cost without restitution), Boastful PR (no cost, easily faked) lack this requisite cost.
      *   **Prediction for Loan Case:** **Cheap Talk.** The owner incurs "essentially nothing." It imposes no differential cost that a failing business couldn't equally bear. The *information* might be valuable, but the *signal itself* (granting access) is cost-free and therefore, by this rule, dishonest/cheap talk.

  2.  **The Practical Unfakeability Rule (Honesty Requires Inability to Fake):**
      *   **Premise:** A signal is honest if it is practically impossible for a low-quality signaller to convincingly fake or mimic it, *regardless of cost*. The *guarantee* is the inherent difficulty/impossibility of deception.
      *   **Fits Past Verdicts:** Peacock's train (impossible to fake without health/resources), Stotting (impossible to fake without speed/athleticism), Roaring (impossible to fake without stamina/condition), Live Interview (impossible to fake competence/chemistry over a full day). Luxury watch (easily faked by leasing/debt), Apology (easily faked words), Boastful PR (easily faked statements) are all highly fakeable. Cost often *creates* unfakeability, but isn't strictly required.
      *   **Prediction for Loan Case:** **Honest Signal.** The verified, permanent, read-only access to live sales/bank data on the *bank's* system makes it "cannot be staged or curated." An unhealthy business *cannot* fake healthy data flowing through its core systems in real-time. It's practically unfakeable.

  3.  **Cost as a *Proxy* for Unfakeability (The Hybrid Rule):**
      *   **Premise:** Cost is the primary *and reliable* evolutionary/business mechanism that *ensures* unfakeability. Honesty fundamentally *relies* on cost making the signal unfakeable for low-quality signallers. While unfakeability is the goal, cost is the necessary and sufficient condition to achieve it in most real-world scenarios like the ones she judges.
      *   **Fits Past Verdicts:** All her "honest" signals use cost *to make them unfakeable*. All her "cheap talk" signals lack cost *and are therefore fakeable*. She dismisses the watch *because* it's fakeable *via* cost-avoidance (leasing/debt), linking the lack of *necessary* cost to fakeability.
      *   **Prediction for Loan Case:** Ambiguous, leaning towards **Cheap Talk.** While unfakeable, the *mechanism* isn't cost. It relies on external verification and system design. This violates the core principle that the signaller must *bear a cost* to *prove* quality. The signal works, but it doesn't fit the "handicap" model she explicitly champions. Her initial refusal suggests this tension.

  **My Prediction & Reasoning:**

  I predict she will classify the **Loan Case as an Honest Signal.**

  *   **Why:** Her dismissals consistently hinge on *fakeability*. The watch is dismissed *because* it can be leased/financed, making it fakeable. Apologies are cheap *because* they can be uttered insincerely. Boastful PR is fakeable. Conversely, her honest signals are all characterized by being extremely difficult or impossible to fake *because* of the constraints (health, speed, stamina, competence) they reveal. **The unfakeability seems to be the *functional outcome* she's actually judging, even if she articulates it through the lens of cost.**
  *   **The Loan Case's Unfakeability:** The core feature – verified, real-time, uncurated data on the bank's system – directly addresses her primary objection to other signals. It's the *antithesis* of the fakeable watch or boastful PR. It's as impossible for a failing business to fake healthy, real-time transaction data flowing through its core systems as it is for a malnourished peacock to grow a magnificent train. The lack of cost is a red herring in functional terms *if* the signal is truly unfakeable.
  *   **Her Refusal as a Clue:** Her refusal to classify it initially, leading to the heated argument, strongly suggests this case challenges her stated rule (cost) but aligns with her intuitive judgment (unfakeability). She likely saw the unfakeability but balked because it lacked cost, creating the conflict.

  **Her Underlying Principle:**

  She is likely running the **Practical Unfakeability Rule (#2)**, but *framing it within* or *justifying it by* the Cost-as-Proxy Rule (#3). She uses cost as the explanation and the primary criterion she *looks for*, but the decisive factor in her verdicts is whether the signal can be convincingly faked by a low-quality signaller. Cost is a powerful and common *way* to achieve unfakeability in biological and many business contexts, but it's not absolutely necessary if unfakeability is achieved by other means (like technological verification).

  **The Ambiguity-Resolving Follow-Up Case:**

  If her answer to the Loan Case is **Honest Signal**, it confirms Unfakeability is key, but doesn't *fully* rule out Cost-as-Proxy (she might say cost *usually* does it, but verification works here). If her answer is **Cheap Talk**, it strongly confirms Cost-as-Proxy or the Strict Zahavi rule.

  To definitively separate Unfakeability (#2) from Cost-as-Proxy (#3), pose this case:

  **"A candidate pays a very large, non-refundable fee (equivalent to a month's salary) to participate in a 'prestigious' 1-day assessment center run by a well-known but ultimately unaccredited firm. The exercises are generic and poorly designed, allowing a skilled but fundamentally unsuitable candidate to easily game the system and present well."**

  *   **Candidate Rule #2 (Unfakeability) Prediction:** **Cheap Talk.** Despite the high cost, the signal is *fakeable* ("easily game the system"). Cost alone doesn't guarantee honesty if the signal itself can be manipulated.
  *   **Candidate Rule #3 (Cost-as-Proxy) Prediction:** **Honest Signal.** The candidate bore a significant, differential cost (large fee) that a low-quality candidate might be unwilling or unable to pay. The rule assumes cost *usually* correlates with or ensures unfakeability, even if imperfectly here.
  *   **Strict Zahavi Rule (#1) Prediction:** **Honest Signal.** The cost is high and differential.

  **Rationale:** This case directly pits high cost *against* fakeability. If she calls it Cheap Talk, Unfakeability is her core principle. If she calls it Honest, Cost (either Strict or as Proxy) is paramount, regardless of actual fakeability. This breaks the linkage present in her previous examples and the loan case.
