  Rule B (Expert Community): Requires the herding to occur within a community with shared verification methods where such signals could realistically exist and be shared. Amateurs might not qualify as having "real" expertise with standardized methods - so irrational. 

  The academic citation case splits these rules! Under Rule A, academics had private judgment capacity but didn't use it - irrational. Under Rule B, they're experts so it should be rational... but Maya called it irrational. Therefore Rule A fits better. 

