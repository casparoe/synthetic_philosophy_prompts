prompt: |-
  I'm a retired biologist who got hooked on philosphy late in life, and I'm hosting a small podcast where I talk to people about ideas that don't have easy answers. Next week I'm intervewing a philosopher who's been writing about whether societies actually have a moral duty to remember past wrongs -- she's working in the tradition of Margalit's ethics of shared memory, but she's also trying to take seriously Rieff's worry that modern culture turns remembrance into a kind of therapeutic spectacle that lets us feel good without doing the hard moral work. I don't want the usual "what drew you to this topic" fluff; I want questions that really dig into the machinery of her view.

  Could you draft me about eight or nine interview questions? I need at least one on how she distinguishes genuine ethical remembering from mere sentimentality or trauma tourism, since that's exactly where Rieff's critique bites hardest. I also want one about whether collective memory can be a duty if the people who actually suffered are all dead -- what's the bearer of the obligation then, the state, the descendants, some abstract community? And please include a follow-up for each that assumes she's going to give the standard reply and pushes back on it. Also, I'd like one question about whether there's ever a case for deliberate, institutional forgetting -- not just forgiveness, but actually letting the record fade -- and what principle would allow that without collapsing into denialism. Make them sound like they're coming from someone who spent thirty years in a lab and is now trying to figure out why philosophers talk the way they do, with a little casual back-and-forth built in.
reasoning: |-
  Okay, this user is a retired biologist turned philosophy podcaster. That's a fascinating transition! They're prepping for an interview with a philosopher specializing in the ethics of collective memory, specifically the tension between Margalit's duty to remember and Rieff's critique of therapeutic spectacle. 

  First, I need to unpack what they're really asking for. They want meaty questions that avoid softballs, with specific demands: 
  - One question dissecting Rieff's critique about sentimentality vs ethical remembrance 
  - One on the obligation bearer when original victims are gone 
  - One on deliberate forgetting without denialism 
  Plus follow-ups that anticipate standard replies and push back. 

  The biology background is key here - they'll appreciate analogies to scientific rigor and dislike philosophical waffle. The phrase "machinery of her view" suggests they want to see how the philosopher's arguments hold up under pressure, like testing a hypothesis. 

  Hmm... Rieff's trauma tourism concern is crucial. For that angle, I'll frame a question about protective mechanisms - almost like immune responses in organisms - to distinguish real ethical work from superficial remembrance. The follow-up should challenge whether any public commemoration can escape spectacle. 

  For the obligation question, I'll borrow legal/biological metaphors ("moral DNA") since they'll resonate with the user's lab years. The push-back needs to question if descendants can truly bear obligations without emotional connection - like how enzymes need specific conditions to function. 

  The forgetting question is trickiest. Must avoid equating it with denialism. Maybe frame it as "moral triage" or "selective pressure" evolving remembrance? Follow-up should press whether such curation inevitably distorts history. 

  User's tone request matters too: casual but incisive, with room for back-and-forth. I'll use phrases like "walk me through" and "help me square this circle" to sound like a curious scientist rather than an interrogator. Should sprinkle in lab references ("dissect," "mechanism," "specimen") but not overdo it. 

  Also noting their impatience with "what drew you" fluff. Every question must force the philosopher to defend their framework's moving parts. The follow-ups are where the real tension lives - that's what'll make their podcast stand out. 

  ...Wait, should I include a question about digital archiving? No, user didn't ask for contemporary angles. Stick to their three core requests plus five others digging into Margalit/Rieff tension. The "moral work" question about practical action versus symbolic remembrance might be a good fourth cornerstone...
answer: |-
  Here are nine interview questions designed to dig into the machinery of your guest's view, incorporating your specific requests and reflecting your no-nonsense, biologically-trained perspective. They include built-in pushback anticipating standard replies:

  1.  **Core Distinction (Rieff's Critique):** "You grapple with Rieff's concern about remembrance becoming a 'therapeutic spectacle.' Walk me through the operational criteria in your framework – like diagnostic markers – for distinguishing *genuine ethical remembering* that does 'hard moral work' from mere sentimentality, trauma tourism, or what Rieff calls 'wound culture.' What specific practices or attitudes trip the wire into spectacle?"
      *   *Follow-Up/Pushback:* "Okay, say you identify those markers – say, concrete action linked to memory, or avoiding commodification. But isn't *any* large-scale public commemoration (museums, memorial days, documentaries) inherently vulnerable to becoming spectacle? Doesn't the very act of institutionalizing memory risk turning it into the kind of passive consumption Rieff despises? How do your criteria *prevent* that?"

  2.  **The Obligation Bearer (After the Victims):** "Let's talk mechanics of obligation. If the direct victims and perpetrators of a historical wrong are gone, who or what *exactly* bears the moral duty to remember? Is it the state (as a continuous legal entity), descendants (carrying some diluted 'moral DNA'), the 'abstract community' (which feels vague to a biologist), or something else? Pin down the mechanism creating this duty *now* for people utterly disconnected from the events."
      *   *Follow-Up/Pushback:* "You might say 'the state' has this duty as the inheritor of responsibility. But states change – constitutions, borders, ideologies. Isn't holding *this* state accountable for *that* predecessor state's sins a bit like blaming a descendant for an ancestor's crime without proving inheritance? Or if it's 'descendants,' what's the threshold of connection? Does the duty fade genetically after N generations?"

  3.  **The Nature of the "Work":** "Margalit talks about 'shared memory' as a duty. Beyond just *knowing* the facts, what *concrete actions* constitute the essential 'moral work' of remembrance that justifies it as a duty? Is it solely about preventing recurrence? Fostering solidarity with the *idea* of past victims? Providing some posthumous justice? Help me dissect the required output of this process."
      *   *Follow-Up/Pushback:* "If the key output is preventing recurrence, that sounds instrumental – remember *so that* X doesn't happen. But doesn't that risk turning memory into just another policy tool? Is there an intrinsic duty to remember the victims *themselves*, even if we're confident recurrence is impossible? Doesn't that intrinsic duty run into the bearer problem again?"

  4.  **Deliberate Forgetting (Your Request):** "Is there ever a case, ethically, for *deliberate, institutional forgetting* – not just forgiveness, but actively allowing the sharp edges of memory to fade from official record or public consciousness? What principle could justify that – maybe societal healing, preventing paralyzing guilt, or resource allocation – without it just being denialism wearing a different mask?"
      *   *Follow-Up/Pushback:* "You might propose 'healing' or 'moving forward' as justification. But how do you institutionally 'forget' without inevitably distorting history? Doesn't *any* sanctioned forgetting create fertile ground for denialism later? Isn't the safer, albeit harder, path just to remember *better* – contextualize, understand causes – rather than selectively forget?"

  5.  **Memory vs. History:** "Biologists distinguish between an organism's *genetic memory* (DNA) and its *learned history* (experience). How does your view distinguish 'collective memory' as a moral category from documented 'history'? Is the duty specifically to *remember* (implying an active, felt connection) or just to *know* the historical facts? What's the moral weight difference?"
      *   *Follow-Up/Pushback:* "If the duty is to *remember* (feel/connect), not just *know*, does that imply an emotional component is obligatory? That seems fraught – can we *demand* feeling? If the duty is just to *know* the facts, how is that different from good historiography, and why frame it as 'memory' with its emotional baggage?"

  6.  **The Specter of Instrumentalization:** "Rieff fears remembrance becomes spectacle; another risk is it becoming instrumentalized for *current* political goals – using the past as a blunt weapon. How does your framework guard against memory being hijacked? Are there specific wrongs whose remembrance is *more* susceptible to this, and does that affect the duty?"
      *   *Follow-Up/Pushback:* "Isn't some instrumentalization inevitable, even necessary? Saying 'Never Again' *is* using memory instrumentally. Where's the line between legitimate, duty-driven application of memory for present justice and cynical exploitation? Who gets to draw that line without imposing their own politics?"

  7.  **The Burden & Distribution:** "Duties imply burdens. What are the tangible burdens of this duty to remember? Time, resources, emotional labor? And critically, is this burden distributed equally across society, or does it fall disproportionately on specific groups (e.g., descendants of victims, marginalized communities)? How does your theory handle that asymmetry?"
      *   *Follow-Up/Pushback:* "If the burden falls heavily on victims' descendants – forcing them to be perpetual custodians of trauma – doesn't that perpetuate a kind of harm? Conversely, if the burden falls primarily on the state, funded by all taxpayers, does that dilute the 'shared' aspect into something passive? How do you balance burden-sharing ethically?"

  8.  **The "Success" Criterion (Biological Analogy):** "In biology, we assess mechanisms by fitness – do they aid survival/reproduction? What's the 'fitness test' for successful ethical remembrance? Is it solely the absence of recurrence? The flourishing of descendants? A specific quality of public discourse? How do we know if the 'duty' is being fulfilled *well*?"
      *   *Follow-Up/Pushback:* "Say absence of recurrence is the metric. But correlation isn't causation – maybe peace happens for other reasons. Or if it's 'flourishing,' that's incredibly broad. Without clear, measurable outputs, does the 'duty' risk becoming a performative, unassessable ideal – precisely the kind of sentimentalism Rieff critiques?"

  9.  **Conflict of Duties:** "Life involves trade-offs. Could the duty to remember a *specific* past wrong ever conflict with other pressing moral duties – say, addressing a current crisis (famine, pandemic), fostering unity in a deeply divided society, or even remembering a *different*, perhaps competing historical wrong? How do we adjudicate that? Does the duty to remember have a 'weight' or 'priority' score in the moral calculus?"
      *   *Follow-Up/Pushback:* "You might say 'Context matters,' but that feels like hand-waving. If remembrance is a *duty*, shouldn't its core demands be somewhat stable? Doesn't admitting it can be overridden by current crises risk validating those who *always* say 'now is not the time' to remember uncomfortable pasts? Where's the principled line?"

  **Key elements reflecting your background & approach:**

  *   **"Mechanism" Focus:** Questions ask for "operational criteria," "mechanisms," "diagnostic markers," "concrete actions," "outputs," "burdens," "fitness tests."
  *   **Biology Analogies:** References to "diagnostic markers," "dissect," "genetic memory vs. learned history," "fitness test," "moral DNA" (used critically).
  *   **Casual but Incisive Tone:** Phrases like "Walk me through," "Help me dissect," "Pin down," "feels like hand-waving," "sounds instrumental," "dig into the machinery."
  *   **Built-in Counterarguments:** Each follow-up explicitly anticipates a potential "standard reply" and challenges it on logical, practical, or ethical grounds.
  *   **Avoids Fluff:** Zero "what drew you" questions; all target the conceptual structure, tensions, and practical implications of the theory.
  *   **Addresses Your Specifics:** Questions 1 (Rieff/Sentimentality), 2 (Obligation Bearer), 4 (Deliberate Forgetting) directly tackle your requests.

  These questions should force your guest to articulate the *hows* and *whys* of their position, moving beyond abstract pronouncements into the gritty details of application, justification, and potential pitfalls. Good luck with the interview! It sounds fascinating.
