answer: |-
  Here's my bottom line: This practice presupposes law's purpose as expressing communal identity and values beyond preventing harm, implicitly requiring Devlin's view that societal cohesion is a public good threatened by moral disintegration; it cannot be squared with a strict harm principle, though a pragmatic liberal might tolerate dead-letter laws *if* truly unenforced, accepting them as inert cultural symbols without endorsing their underlying rationale.

  **Unpacking:** The "symbolic expression" justification prioritizes law's role in affirming shared morality over Mill's harm principle, which demands tangible injury for criminalization. Constitutional doctrines requiring harm-based justification clash with this, revealing tension: the state claims laws express values while denying morality alone suffices for enforcement. Devlin's idea—that society's moral fabric is a protectable public good—directly supports keeping such laws, as their existence signals disapproval defending cohesion. A liberal *could* pragmatically accept dead-letter statutes as harmless vestiges (symbols without bite), avoiding contradiction **only** if they remain unused and don't chill behavior. However, this tolerates a rationale (law as moral custodian) fundamentally incompatible with liberal harm-based foundations.
