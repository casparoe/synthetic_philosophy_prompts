  The key tension lies in their asymmetric treatment of similar factors: Compassion silences in case 1 but not in case 5, while contribution silences lifespan in case 4 but autonomy isn't silenced by friendship in case 3. Their language suggests strong particularist leanings—they consistently describe reasons as "present/absent" rather than "weighed."

