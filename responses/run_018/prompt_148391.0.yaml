  Okay, the user is asking about David Lewis's potential response to dispositional essentialism, particularly its revival post-2000. They want to know if Lewis would see it as a notational variant of his own framework or a genuine rival that violates Humean supervenience. The user mentions Lewis's key commitments: Humean supervenience, the best-system account of laws, and rejection of primitive modal connections.

  Hmm, I need to recall Lewis's core principles. Humean supervenience holds that everything supervenes on the spatiotemporal distribution of local categorical properties. Dispositional essentialism claims that fundamental properties are essentially powers, so laws stem from intrinsic natures rather than global patterns. This directly challenges Humean supervenience because it adds primitive modal features to properties.

  Lewis rejected primitive modality, so he'd likely view dispositional essentialism as introducing irreducible modal connections. His best-system account reduces laws to efficient summaries of patterns, while dispositional essentialism grounds laws in property essences. This isn't just adding modal predicates; it's a foundational difference. Lewis would see it as violating his core tenets, not a variant. The user seems knowledgeable, so I should focus on philosophical reasoning without citations. Keep it concise, under 180 words.
answer: |-
  Lewis would have unequivocally regarded dispositional essentialism as a profound rival violating Humean supervenience, not a notational variant. Humean supervenience demands that all modal truths, including laws, supervene on the global spatiotemporal distribution of purely categorical, non-dispositional local qualities. Dispositional essentialism posits that fundamental properties have irreducible, intrinsic modal essences (powers) that ground lawlike regularities. This directly violates Lewis's requirement for a purely non-modal base and contradicts his rejection of primitive modal ties between distinct existences. For Lewis, lawlike regularities emerge from the global mosaic via the best-system analysis; they are not grounded in the intrinsic natures of local properties. Dispositional essentialism thus introduces the very kind of primitive, non-supervenient modality Lewis explicitly sought to eliminate, fundamentally opposing his core metaphysical commitments.
