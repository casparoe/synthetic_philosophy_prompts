prompt: |-
  I'm a philosophy professor, and for the last year I've been attached as the logic person to a small group that does pre-deployment safety reviews for AI systems. A recurring problem: the reviewers keep having to put a probability on claims that are deterministic but unsettled — "this program satisfies its spec on every input", "this protocol has no exploit a bounded attacker would find in a week", "this lemma in the safety case actually follows from the axioms we coded." Right now they make up numbers, or treat the claims like weather forecasts, and nobody can reconstruct the number afterward. Standard Bayesianism is no help here: a logically omniscient agent already assigns probability 1 or 0 to every theorem of arithmetic, and my reviewers are not logically omniscient. I know the logical-induction program is aimed at exactly this — finite reasoners that assign sensible credences to every sentence of a formal language, including sentences whose truth is just a matter of proof, that don't lose too badly to any computably specified bookie (any mechanical betting strategy trying to exploit their incoherence), and that creep toward the truth as they get more compute. But I've never managed to turn it into something an engineer would run.

  So turn that idea into a reusable procedure a safety reviewer with an engineering background can actually run. They have about two hours per claim. They can gather bounded evidence — run a static analyzer or a solver for some fixed time, ask one or two domain experts, look at how similar claims resolved in the past — but they cant settle the claim, or it wouldn't be asked. The reviewers will ignore anything that reads like a philosophy lecture, so the theory has to show up as questions, steps, and cutoffs. The principle I want preserved is that unresolved logical claims get treated under much the same norms as empirical uncertainty, with the extra twist that running a computation is itself a form of evidence the procedure can buy by the minute. The procedure should output a credence, a "where should the next hour of checking go" reccomendation, and a stop condition for when to just report the number instead of gathering more evidence. It should also mark every step that is really a judgment call dressed up as a calculation. Please include one worked case where the procedure's answer will annoy the reviewer — say, a tempting informal upper bound on exploit likelihood that the procedure tells them not to round up to 0.999. Use these sections, in this order: (1) The procedure, numbered and runnable, about 500 words; (2) Plain-language rationale for each step, about 500 words; (3) Three worked applications — the spec claim, the exploit claim, and the lemma in the safety proof — about 650 words; (4) Failure modes, where the numbers go wrong, and what to hand back to a human, about 350 words.
reasoning: |-
  We are designing a procedure for safety reviewers to assign probabilities to deterministic but unsettled claims. The procedure should be usable by engineers, take about two hours per claim, and allow gathering bounded evidence. The output includes a credence, a recommendation for the next step, and a stop condition. We'll use a simplified version of logical induction principles, adapted for practicality.

  ### (1) The Procedure

  **Step 1: Frame the Claim (5 minutes)**
     - Write the claim as a precise statement in a formal language if possible. If not, write it as clearly as you can in natural language and then assign it a level of formalizability (High, Medium, Low). 
     - If the claim is about a probability (like "exploit likelihood < 10^{-6}"), note that this is a deterministic claim about a number (even if that number is a probability in an empirical sense).

  **Step 2: Initial Anchoring (10 minutes)**
     - Assign an initial probability (P_initial) based on:
          a) Base rate: What fraction of similar past claims (by this team, or in the literature) turned out true? If no data, use 0.5.
          b) Expert prior: Ask one domain expert (if available) for a quick off-the-cuff probability. If unavailable, skip.
     - Calculate: P_initial = (Base rate * 0.7) + (Expert prior * 0.3) if expert available; else P_initial = Base rate.
     - Mark as judgment: The weights (0.7 and 0.3) and the base rate are judgments.

  **Step 3: Quick Computational Check (15 minutes)**
     - Run a quick automated check (static analyzer, solver, etc.) for a fixed time (e.g., 5 minutes). 
     - If the check returns a definitive result (proof or counterexample), set P = 0 or 1 accordingly and stop.
     - If not, record the resources used (time, memory) and any partial results (e.g., "solver explored 20% of state space").
     - Adjust: 
          - If the check made progress (e.g., ruled out some cases), increase confidence slightly: P_step3 = P_initial + 0.1 * (1 - P_initial) if the progress was in favor of the claim being true, or P_step3 = P_initial - 0.1 * P_initial if against.
          - If no progress, P_step3 = P_initial.
     - Mark as judgment: The 0.1 adjustment factor and what counts as progress.

  **Step 4: Gather Bounded Evidence (45 minutes)**
     - Allocate time to up to three evidence sources (you have 45 minutes total). Options:
          a) Run a more focused computational tool (e.g., a solver on a simplified model, fuzzing for 10 minutes).
          b) Consult a domain expert (one question, 10 minutes max).
          c) Look up analogous cases (past claims in the same project or similar systems).
     - For each source, estimate its potential impact (how much it could change the probability) and cost in time. Prioritize high impact, low cost.
     - After gathering each piece of evidence, update the probability:
          - If the evidence directly supports the claim (e.g., an expert says "likely true", or an analogous case was true), use: P_new = P_old + k * (1 - P_old)
          - If it undermines the claim, use: P_new = P_old - k * P_old
          - k is an adjustment factor: 
              - For computational results: k = min(0.2, fraction of the problem resolved) [e.g., if a solver checked 30% of inputs, k=0.3 but capped at 0.2]
              - For expert: k = 0.15 (if expert is highly trusted) or 0.1 (otherwise)
              - For analogous cases: k = 0.1 * similarity (on a 0-1 scale, judged by you)
     - After all evidence, you have P_step4.

  **Step 5: Calibrate with Compute-Time Scaling (30 minutes)**
     - Consider how much compute has been applied so far (T_total in minutes) relative to what would be needed to settle the claim (T_settle). Estimate T_settle very roughly (order of magnitude) in minutes, days, or years.
     - Calculate a discount factor: d = T_total / (T_total + T_settle)
     - Adjust: 
          - If the claim is likely true (P_step4 > 0.5), then P_final = 1 - (1 - P_step4) * d
          - If likely false (P_step4 <= 0.5), then P_final = P_step4 * (1 - d)
     - This step accounts for the fact that more compute would push the probability toward 0 or 1, but we haven't done enough.

  **Step 6: Set Output and Next Steps (15 minutes)**
     - Credence: Report P_final (rounded to two decimal places).
     - Next step recommendation:
          - If d < 0.01 and P_final > 0.95, recommend stopping (claim likely true and hard to settle).
          - If d < 0.01 and P_final < 0.05, recommend stopping (claim likely false and hard to settle).
          - Else, recommend further checking:
               - If P_final is near 0.5, suggest a tool that splits the hypothesis space (e.g., case analysis).
               - If P_final is extreme, suggest a targeted check (e.g., fuzzing for counterexamples if P_final is high).
          - Allocate up to 1 hour for the next step.
     - Stop condition: When either (a) the claim is settled, (b) d >= 0.1 (we've done a significant fraction of the compute), or (c) two hours total have been spent (including next steps).

  ### (2) Rationale

  **Step 1:** We need a clear target. Formal claims are ideal, but many safety claims are semi-formal. The level of formalizability helps later in judging how much weight to give computational methods.

  **Step 2:** Starting from a base rate avoids arbitrary extremes. Blending with an expert prior adds domain insight. The weights (0.7, 0.3) are a heuristic to favor data but respect expertise.

  **Step 3:** Quick checks sometimes resolve the claim. Even if not, partial progress (e.g., a solver covering some cases) is evidence. The 0.1 adjustment is a small nudge to reflect this.

  **Step 4:** We want to use diverse evidence sources efficiently. The update rule is a simplified Bayesian adjustment: each piece of evidence shifts the probability by a fraction of the remaining uncertainty. The cap on k prevents overconfidence from a single source. The factors (0.2, 0.15, 0.1) are tuned so that one source doesn't dominate.

  **Step 5:** This step is key for logical uncertainty. If settling the claim would take 100 years (T_settle = 52.56e6 minutes) and we've spent 1 hour (60 minutes), then d is tiny, so P_final is close to P_step4. But if T_settle is 100 minutes and we've spent 60, then d=0.375, and P_final moves toward 0 or 1 by 37.5% of the gap. This approximates the logical induction idea: as compute increases, probabilities approach truth values.

  **Step 6:** The next step directs resources to where the uncertainty is highest. The stop condition balances effort against diminishing returns. The d<0.01 cutoff means we stop if we've done less than 1% of the required compute and the probability is extreme.

  ### (3) Worked Applications

  **Claim 1: "This program satisfies its spec on every input."**
     - Step 1: High formalizability (spec and program are in formal language). Claim: ∀x, P(x) holds.
     - Step 2: Base rate: 60% of past specs held. No expert, so P_initial=0.6.
     - Step 3: Quick check with solver (5 min) on a small subset of inputs (10%) finds no violation. Progress in favor, so P_step3=0.6 + 0.1*0.4 = 0.64.
     - Step 4: 
          - Run fuzzer (10 min): covers 20% of input space, no violation. k = min(0.2, 0.2)=0.2 → P=0.64 + 0.2*(1-0.64)=0.712.
          - Analogous case: Similar module last month had a bug. Similarity=0.8 → k=0.1*0.8=0.08 → P=0.712 - 0.08*0.712≈0.655.
          - Expert (10 min): "I'm worried about edge cases." → k=0.1 (undermines) → P≈0.655 - 0.1*0.655≈0.59.
     - Step 5: Estimate T_settle: formal verification might take 1 week (10,080 min). T_total=5+10+10+10=35 min. d=35/(35+10080)≈0.0035. Since P_step4=0.59>0.5, P_final=1 - (1-0.59)*0.0035≈0.59.
     - Step 6: Credence≈0.59. Next: Check edge cases (e.g., run solver on critical subsets). Stop if no progress in 1 hour.

  **Claim 2: "This protocol has no exploit a bounded attacker would find in a week."** (We want to annoy the reviewer by not rounding a tempting upper bound to 0.999)
     - Step 1: Medium formalizability (attacker model is informal). Claim: no exploit exists in the set of attacks bounded by 1 week of compute.
     - Step 2: Base rate: 70% of past protocols had no such exploit. Expert prior: one expert says 0.8. P_initial=0.7*0.7 + 0.8*0.3=0.73.
     - Step 3: Quick fuzzing (5 min) finds no exploit. Progress in favor → P_step3=0.73+0.1*(1-0.73)=0.757.
     - Step 4:
          - Run symbolic execution (15 min) on core functions: covers 15% of paths, no exploit. k=min(0.2,0.15)=0.15 → P=0.757+0.15*(1-0.757)≈0.794.
          - Analogous case: A similar protocol was broken with a clever exploit. Similarity=0.9 → k=0.1*0.9=0.09 → P≈0.794 - 0.09*0.794≈0.722.
          - Expert (10 min): "We've fixed the obvious issues." → supports, k=0.1 → P≈0.722+0.1*(1-0.722)≈0.750.
     - Step 5: T_settle: Full audit might take 1 month (43,800 min). T_total=5+15+10=30 min. d=30/(30+43800)≈0.0007. P_step4=0.75>0.5 → P_final=1 - (1-0.75)*0.0007≈0.75.
     - Step 6: Credence=0.75. The reviewer might expect >0.99 because "we've fixed the obvious issues", but the procedure says 0.75 due to the past exploit and limited checks. Next: Fuzz with attacker-specific heuristics.

  **Claim 3: "This lemma in the safety proof actually follows from the axioms."**
     - Step 1: High formalizability (lemma and axioms are in Coq).
     - Step 2: Base rate: 90% of lemmas in this proof have held. Expert prior: 0.85. P_initial=0.9*0.7 + 0.85*0.3=0.885.
     - Step 3: Run Coq for 5 min: doesn't complete. No progress → P_step3=0.885.
     - Step 4:
          - Run with a different tactic (10 min): still no proof. k=0 (no progress) → P=0.885.
          - Analogous case: Similar lemma last week was false. Similarity=0.7 → k=0.1*0.7=0.07 → P≈0.885 - 0.07*0.885≈0.823.
          - Expert (10 min): "I think it's true but tricky." → supports, k=0.1 → P≈0.823+0.1*(1-0.823)≈0.840.
     - Step 5: T_settle: Proving might take 2 days (2880 min). T_total=5+10+10=25 min. d=25/(25+2880)≈0.0086. P_step4=0.84>0.5 → P_final=1 - (1-0.84)*0.0086≈0.84.
     - Step 6: Credence=0.84. Next: Try interactive proof in Coq for 30 min.

  ### (4) Failure Modes

  **Where numbers go wrong:**
     - **Base rates are sparse or biased:** If past claims aren't similar, the initial anchor is off. Mitigation: Use broader literature if available, and note the uncertainty.
     - **T_settle estimates are wild guesses:** A wrong T_settle can distort the discounting. Mitigation: Use conservative estimates (overestimate T_settle) and note it as a judgment.
     - **Update factors (k) are too rigid:** The fixed k values might not reflect the evidence quality. Mitigation: Allow the reviewer to adjust k within bounds (e.g., 0.05 to 0.3) based on their confidence in the evidence, but mark as judgment.
     - **Evidence interactions ignored:** The procedure updates sequentially, but evidence might be redundant or synergetic. Mitigation: When choosing evidence sources, avoid overlap (e.g., don’t run two similar solvers).

  **Hand back to a human when:**
     - The claim is too vague (formalizability Low) and the evidence is contradictory.
     - The estimated T_settle is astronomical (e.g., beyond the age of the universe), making d near 0. Then the probability from Step 4 is essentially the output, but the human should decide if it's worth further investment.
     - The procedure gives a probability near 0.5 after two hours, but the stakes are high. Then a human should organize a more thorough review.

  This procedure operationalizes logical induction for engineers by breaking it into manageable steps with clear heuristics. It embraces judgment calls but structures them.
answer: |-
  ### (1) The Procedure  
  **Time budget: 120 minutes total. Track time per step.**  

  1. **Frame the Claim (10 min)**  
     - Write the claim as a Boolean statement: "X is true/false."  
     - Classify evidence type:  
       - **A**: Formal (proofs, code, math models).  
       - **B**: Empirical (tests, sims, expert judgment).  
       - **C**: Analogical (past similar claims).  
     - Set *time-to-settle*: "How long would a perfect agent take to resolve this?" (1 hour? 10 years? Guess order-of-magnitude minutes.)  

  2. **Baseline Probability (15 min)**  
     - **Base rate**: What % of similar past claims were true? (Default: 50% if unknown.)  
     - **Expert prior**: Ask 1 domain expert: "Between 0 and 1, your gut credence?" (Default: base rate.)  
     - **Compute**: `P_baseline = (0.6 × base rate) + (0.4 × expert prior)`.  

  3. **Buy Evidence (60 min total; stop early if settled)**  
     Allocate time to evidence sources. For each:  
     - **Run tools** (static analyzers, solvers, fuzzers) for *t* minutes.  
     - **Consult experts** (1–2 questions, 5 min max each).  
     - **Review analogues** (past claims, docs; 10 min max).  
     After each source:  
     - If settled (proof/counterexample), output 0/1 and stop.  
     - Else, assign an **update score** *S*:  
       - *S* = 0.0 if no progress.  
       - *S* = 0.3 if partial progress (e.g., solver ruled out 30% of cases).  
       - *S* = 0.6 if strong progress (e.g., expert highlights a flaw).  
     - Update:  
       - If evidence supports claim: `P_new = P_old + S × (1 - P_old)`  
       - If evidence opposes claim: `P_new = P_old - S × P_old`  

  4. **Discount for Unresolved Compute (20 min)**  
     - Let *T* = total compute-minutes spent (sum of tool runs).  
     - Let *T_settle* = time-to-settle from Step 1 (in minutes).  
     - Compute discount factor: `d = max(0.01, T / (T + T_settle))`  
     - Adjust probability:  
       - If `P_current > 0.5`: `P_discounted = 1 - (1 - P_current) × (1 - d)`  
       - If `P_current ≤ 0.5`: `P_discounted = P_current × (1 - d)`  

  5. **Output & Next Steps (15 min)**  
     - **Credence**: Round *P_discounted* to nearest 0.05 (e.g., 0.87 → 0.85).  
     - **Next hour**:  
       - If *P_discounted* < 0.2 or > 0.8: Target the strongest opposing evidence.  
       - Else: Split effort between support/oppose.  
     - **Stop condition**:  
       - Claim settled, OR  
       - *d* ≥ 0.1 (you’ve done ≥10% of the work to settle it), OR  
       - Total time ≥ 120 min.  
     - **Flag judgments**: Base rate, *S* scores, *T_settle*, and discount math.  

  ---

  ### (2) Rationale  
  **Step 1** forces clarity. Formal claims respond better to tools; analogical ones to past data. *T_settle* anchors how much "logical uncertainty" remains—key for Step 4.  
  **Step 2** blends frequentist (base rates) and Bayesian (expert) thinking. The 60/40 weights favor data but admit expertise. Defaults prevent overconfidence.  
  **Step 3** treats compute as evidence-buying. *S* scores quantify progress heuristically (no formal proof = partial credit). The update rule ensures probabilities move toward 0/1 but never saturate prematurely. *t* caps avoid overinvestment.  
  **Step 4** is the logical-induction core. A claim with *T_settle* = 1 year has high unresolved uncertainty; *d* ≈ 0.01 means *P_discounted* ≈ *P_current*. But if *T_settle* = 1 hour and you spent 30 min, *d* = 0.33, pushing *P_discounted* closer to 0/1. This approximates how a logical inductor adapts to compute.  
  **Step 5** rounds for usability. Next-step rules prioritize high-leverage checks. Stop conditions balance effort against diminishing returns. Flagged judgments highlight where human discretion dominates.  

  ---

  ### (3) Worked Applications  
  **Claim 1: "This program satisfies its spec on every input."**  
  - **Step 1**: Formal evidence. *T_settle*: Formal verification might take 1 month (≈40,000 min).  
  - **Step 2**: Base rate 70% (3/4 similar specs held). Expert prior: 0.8. *P_baseline* = (0.6×0.7) + (0.4×0.8) = 0.74.  
  - **Step 3**:  
    - Run solver (20 min): No violation but only 10% coverage. *S* = 0.3 (supports). *P* = 0.74 + 0.3×(1-0.74) = 0.82.  
    - Check analogue: One past spec failed edge cases. *S* = 0.6 (opposes). *P* = 0.82 - 0.6×0.82 = 0.33.  
  - **Step 4**: *T* = 20 min, *T_settle* = 40,000. *d* = 20/(20+40,000) ≈ 0.0005. *P_discounted* = 0.33 × (1 - 0.0005) ≈ 0.33.  
  - **Output**: Credence 0.35 (rounded). Next: Fuzz edge cases. Stop—total time 55 min.  

  **Claim 2: "This protocol has no exploit a bounded attacker would find in a week."**  
  *(Annoying outcome: Tempting informal bound discounted)*  
  - **Step 1**: Mixed evidence (formal + analogical). *T_settle*: Full audit = 3 months (≈130,000 min).  
  - **Step 2**: Base rate 40% (many past exploits). Expert prior: 0.99 ("We fixed the flaws!"). *P_baseline* = (0.6×0.4) + (0.4×0.99) = 0.64.  
  - **Step 3**:  
    - Fuzzer (30 min): Zero exploits in 50M tests. *S* = 0.3 (supports). *P* = 0.64 + 0.3×(1-0.64) = 0.75.  
    - Expert: "Attacker would need >1 week." *S* = 0.6 (supports). *P* = 0.75 + 0.6×(1-0.75) = 0.90.  
  - **Step 4**: *T* = 30 min, *T_settle* = 130,000. *d* ≈ 0.0002. *P_discounted* = 1 - (1-0.90)×(1-0.0002) ≈ 0.90.  
  - **Output**: Credence 0.90. **Reviewer annoyed**: They felt fuzzer + expert = 0.999. Procedure says: "90% is max for 30 min effort vs 3-month audit." Next: Symbolic execution on attack surface.  

  **Claim 3: "Lemma follows from coded axioms."**  
  - **Step 1**: Formal evidence. *T_settle*: Interactive proof might take 2 days (≈3,000 min).  
  - **Step 2**: Base rate 85% (lemmas usually hold). Expert prior: 0.5 ("unsure"). *P_baseline* = (0.6×0.85) + (0.4×0.5) = 0.71.  
  - **Step 3**:  
    - Run theorem prover (20 min): Timeout. *S* = 0.  
    - Analogue: Similar lemma had counterexample. *S* = 0.6 (opposes). *P* = 0.71 - 0.6×0.71 = 0.28.  
  - **Step 4**: *T* = 20 min, *T_settle* = 3,000. *d* ≈ 0.007. *P_discounted* = 0.28 × (1-0.007) ≈ 0.28.  
  - **Output**: Credence 0.30. Next: Isolate axioms and check consistency.  

  ---

  ### (4) Failure Modes  
  **When numbers go wrong**:  
  - **Biased anchors**: Base rates from irrelevant analogues (e.g., comparing crypto protocols to UI code) skew *P_baseline*. Mitigation: Use analogues only with >50% similarity.  
  - **Overconfident S scores**: Assigning *S* = 0.6 to weak evidence (e.g., "expert agrees" without scrutiny) inflates probabilities. Mitigation: Cap *S* at 0.3 for non-quantitative evidence.  
  - **T_settle misjudgment**: Underestimating *T_settle* (e.g., saying 1 day for a halting problem) overstates *d* and forces extreme probabilities. Mitigation: If *T_settle* is unknown, set *d* = 0.01.  

  **Hand back to a human when**:  
  - Evidence is contradictory (e.g., tool says true, expert says false).  
  - *P_discounted* is 0.4–0.6 after 120 min (high ambiguity).  
  - Claim involves ethical/normative dimensions (e.g., "no exploit" vs "no *unethical* exploit").  
  - *T_settle* exceeds project lifespan (e.g., 100 years).  

  **Final note**: The procedure quantifies *effort-conditional* uncertainty—it’s not truth-seeking without compute. If the credence feels wrong, revisit judgments (flagged in Step 5).
