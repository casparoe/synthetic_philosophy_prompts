  Beyond the surface request, they probably want to present a coherent position that holds up under scrutiny. The underlying need might be to avoid being caught in contradictions when defending this view. They might also be testing how well epiphenomenalism can accommodate first-person authority.

  The biggest problems are:
  1. Epiphenomenalism (1) versus reliable self-reports (2) - the causation problem
  2. Epiphenomenalism (1) versus acquaintance-based knowledge (5) - the epistemic problem
