  ok so im in this philosophy of mind seminar my school runs and next friday im presenting my own take on eliminativism — basically churchlands idea that beliefs and desires are fake like phlogiston but i mash it up with predicitve coding, so i say beliefs arent just wrong theories but errors our brain makes when it weights prediction errors about other people. i call it predictive-error eliminativism lol. my audience is gonna be like eight AP psych kids who think folk psychology is definetly real, my teacher mr chen who loves predictive processing but thinks it saves mental states, and this visiting grad studant who writes about mental representation. can you make me a q&a prep sheet? list the objections in the order theyll come and how damaging they are, phrase them like those people would actually say them, give me a two-minute reply for each and say where that reply is weakest. also tell me what i should concede up front and whats the one question im hoping nobody asks. i was talking about this with my friends at lunch and they said just say brains are computers but that sounds dumb so please dont include that.
