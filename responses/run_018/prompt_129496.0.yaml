  I was arguing with a friend about Parfit's hitchhiker and rational irrationality and I think I pushed the idea into something absurd, but I can't see exactly where it breaks. Here's the chain I built. (1) In the hitchhiker case it's rational to intend to pay the driver once you arrive, even though once you're in town the ten dollars is gone either way and you have no causal leverage over the past ride. (2) The reason is that the driver predicts your dispostion, and cultivating the disposition to pay is rational because it makes you the kind of person who gets picked up. (3) So call this the Predictability Principle: if others can observe or predict your disposition D, and having D gets you rewarded, then rationality requires actually having D, even when exercising it in a specific case is locally suboptimal. (4) But in real life people don't observe single dispositions in isolation; they observe bundles or profiles—say, someone generous in charity but ruthless in business, or forgiving with friends but vengeful with enemies. (5) Observers update over your whole trait-profile, and they reward or punish you based on the profile's coherence rather than on one act. (6) So by the Predictability Principle you should cultivate not just one costly disposition but every disposition that belongs to a socially rewarded profile—both radical forgiveness and absolute retribution, for instance—because any gap in the profile makes you predicatble in the wrong way. (7) But these traits are psychologically incompatible; you can't genuinely hold unconditional forgiveness and unconditional vengeance as stable character traits at once. (8) Therefore the Predictability Principle demands impossible psychological architechtures, which means either rationality requires the impossible or we have to reject the principle and with it the usual resolution of the hitchhiker problem. I feel like step (5) or (6) is where things go off the rails—maybe I'm smuggling in a false assumption about how trait-observation works—but I can't name the mistake. Which premise should I drop, and what does giving it up cost me? If I have to choose I'd rather keep (1)-(3) intact, but I want to know what I'm paying. Please write your response as continuous prose only—no headings, bullet points, bold text, or tables, just like you'd write in an email or letter.
