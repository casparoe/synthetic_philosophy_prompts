prompt: |-
  Okay so I'm trying to figure out where the virtue ethics vs situationist debate actually matters for real work, not just academic scorekeeping. Everyone knows the Milgram/Hartshorne stuff and the usual responses—local traits, interactionism, etc. But I'm interested in a more specific angle: if situationism is right that behavior is highly context-sensitive, then cultivating a 'virtue' might not be about building a stable global character but about learning to calibrate your moral sensitivity to specific ecologies—like knowing when a workplace culture suppresses honesty versus when it rewards it. So: if you had three grad studens and a small grant for about three years, which open questions should they actually chase? I'm not asking for a bibliograpy. I want a defended agenda: which lines are upstream—settling them changes how you'd design moral education or instutional ethics—which are dead ends that don't change practice, and what result over the next few years would shift your ranking. Specifically, should they focus on (a) refining interactionist models of trait expression, (b) testing whether virtue-labeling itself changes behavior in different contexts, or (c) something else—maybe whether situationist data undermines the very idea of moral improvement, or whether we need a new taxonomy of 'micro-virtues'? Give me the ordering with the reasoning, not a survey.
reasoning: |-
  Okay, the user is diving deep into the virtue ethics vs. situationism debate but wants practical applications, not just academic theory. They mention Milgram and Hartshorne & May studies, which show how situations heavily influence behavior. The user's key point is that if situationism is right, cultivating virtue might not be about building a stable character but about learning to calibrate moral sensitivity to specific contexts. They want to know where a small research team should focus over three years to impact real-world moral education or institutional ethics.

  The user proposes three options: (a) refining interactionist models, (b) testing if virtue-labeling changes behavior in different contexts, or (c) something else like questioning moral improvement or developing micro-virtues. They want a prioritized agenda with reasoning, not just a literature review.

  First, I need to unpack the user's deeper needs. They’re clearly frustrated with abstract debates and want actionable research that can inform interventions. Their focus on "upstream" questions suggests they care about leverage points—answers that could reshape how we approach moral development in practice. The mention of grad students and a small grant implies constraints: the research must be feasible, impactful within three years, and likely to produce publishable results that influence real-world applications.

  The user’s framing of virtues as context-specific calibration ("knowing when a workplace culture suppresses honesty") hints they’re drawn to ecological or skill-based models of morality. They might suspect that traditional virtue ethics is too rigid and that situationism’s insights aren’t being translated effectively. Their unspoken need could be bridging theory and practice—how do we design training or institutions that account for behavioral fragility without abandoning moral growth?

  Now, evaluating their proposed options:  
  - (a) Interactionist models are foundational but might be a dead end for *new* practical insights; we already know traits interact with situations, and further refinements may not change interventions.  
  - (b) Virtue-labeling is intriguing—it’s understudied and could have direct implications for how we frame moral education (e.g., does calling someone "honest" backfire in corrupt environments?). But it’s narrow.  
  - (c) "Something else" is where the high-impact potential lies. Specifically, the "micro-virtues" idea aligns with their emphasis on calibration. If virtues are context-bound skills, we need a new taxonomy to design targeted interventions.  

  I think the user would prioritize (c) > (b) > (a). Why?  
  1. **Micro-virtues/ecological calibration (c)** directly tackles the core question: if global traits are unstable, what *can* we cultivate? This shifts the paradigm for moral education (e.g., training people to read contexts rather than "be honest").  
  2. **Virtue-labeling (b)** is a tactical question—useful but secondary to redefining what virtue *is*.  
  3. **Interactionism (a)** is settled enough that further work won’t change practice.  

  The user’s urgency about "what result would shift your ranking" suggests they want research that could quickly validate or invalidate approaches. For micro-virtues, a key result would be identifying context-specific moral skills that predict behavior better than global traits. If found, it would force a redesign of ethics training. If not, it might validate labeling or other approaches.  

  Also, subtly, the user might be wrestling with ethical pessimism ("does situationism undermine moral improvement?"). Prioritizing (c) addresses this by offering a constructive alternative—improvement isn’t doomed, it just looks different. That’s a hopeful, actionable angle.  

  In short: Go all-in on redefining virtue as contextual skill-building. It’s the upstream lever; everything else follows from it.
answer: |-
  Here's a prioritized research agenda for your team, designed to cut through academic noise and target *actionable* leverage points for moral education/institutional design. The core insight driving this ranking: **If situationism holds, the unit of moral improvement isn't the "virtuous person" but the "skilled navigator of morally-relevant contexts."** Cultivation shifts from building stable character to developing *diagnostic and tactical expertise within specific ecologies*.

  ### Priority Ranking & Rationale (Most Impactful First)

  1.  **#1 Priority: Map Context-Specific "Moral Micro-Skills" & Their Ecological Triggers (Option C - Micro-Virtues/Taxonomy Focus)**
      *   **Why Upstream:** This directly addresses the core practical implication of situationism. If global traits are unstable, but *contextualized patterns of perception/judgment/action* can be reliable within defined ecologies, then **moral education becomes skill-based training in recognizing and deploying these micro-skills.** This changes everything:
          *   *Education:* Trains people to spot "honesty-affording" vs. "honesty-suppressing" cues in *this specific workplace/industry*, not just "be honest."
          *   *Institutional Design:* Focuses on engineering *specific* situational cues (nudges, defaults, local norms) that trigger desired micro-skills.
          *   *Assessment:* Measures competence in recognizing ecological triggers and deploying appropriate micro-responses, not abstract "character scores."
      *   **Open Questions to Chase:**
          *   Can we empirically identify *stable clusters of context-sensitive behaviors/perceptions* (micro-skills) within specific, high-stakes ecologies (e.g., medical error reporting, financial compliance, peer review)?
          *   What are the *diagnostic cues* experts use within an ecology to recognize which micro-skill is required? (e.g., subtle power dynamics, time pressure levels, ambiguity cues).
          *   How transferable are micro-skills *between similar ecologies* (e.g., from one hospital unit to another vs. hospital to lab)?
          *   Can these micro-skills be *trained explicitly* (like procedural knowledge) faster/more reliably than global virtues?
      *   **Methodology:** Ethnographic observation + cognitive task analysis (identifying expert "moves"); controlled simulations varying key ecological factors; longitudinal tracking of skill acquisition and deployment fidelity within target ecologies.
      *   **What Shifts Ranking:** Finding evidence of *stable, trainable micro-skills* with clear ecological triggers would be transformative. Failure to find such stable clusters would force retreat towards interactionism or labeling as the best *available* approach, making #2 the new priority.

  2.  **#2 Priority: Test the "Virtue-Labeling Intervention Paradox" (Option B)**
      *   **Why Impactful, But Less Upstream:** This tackles a *specific, powerful intervention tool* (labeling) but doesn't redefine the *goal* of moral improvement like #1 does. If labeling works, it's a practical lever; if it backfires, it warns against naive approaches. It directly informs *how* we might teach or incentivize the micro-skills identified in #1.
          *   *Education:* Shows whether framing someone as "trustworthy *in context X*" boosts performance *in X* or creates dangerous complacency *in Y*.
          *   *Institutional Design:* Reveals risks/benefits of institutional virtue signaling (awards, codes of conduct language) – does it enable behavior or just create moral licensing?
      *   **Open Questions to Chase:**
          *   Does labeling someone with a virtue term (e.g., "You are a very honest person" / "This team values integrity") *increase or decrease* contextually appropriate virtuous behavior *in subsequent, different high-pressure situations* within the same broad domain?
          *   Does *ecological specificity* in labeling mitigate backfiring? (e.g., "You showed great honesty *when reporting that error*" vs. "You are an honest person").
          *   What individual differences (e.g., baseline self-monitoring, identity centrality) predict susceptibility to labeling effects (positive or negative)?
      *   **Methodology:** Multi-phase experiments: Induce labeling (specific/general) -> Test behavior in ecologies varying in pressure, ambiguity, perceived cost/benefit of virtue -> Measure behavioral outcomes and self-perception shifts. Field experiments in orgs using targeted recognition programs.
      *   **What Shifts Ranking:** Strong evidence that *ecologically specific labeling* reliably boosts target behaviors *without* negative cross-context spillover would make this a top-tier intervention tool, potentially rivaling #1's practical impact. Evidence of pervasive backfiring would make refining it crucial for *any* intervention design.

  3.  **#3 Priority: Refine Interactionist Models (Option A - Lower Priority/Dead End for Practice)**
      *   **Why a Dead End for *Novel* Practice:** The basic insight (behavior = f(person, situation)) is already foundational. Further refinements (e.g., exactly *which* traits interact with *which* situational features via *which* cognitive mechanisms) are **academically important but unlikely to change practice.** We already *know* situations matter immensely. Educators/institutions don't need a more precise map of the quicksand; they need tools to *build bridges* or *navigate around it.*
          *   *Education/Design:* Knowing trait X interacts with situation Y via mechanism Z doesn't tell you *what to train* or *how to design* beyond the generic "consider situations!" we already have. It doesn't answer *how* to cultivate the context-sensitive skills (#1) or *how* to use labels effectively (#2).
          *   *Likely Output:* More complex statistical models with marginally better predictive power in lab settings, but little actionable guidance for real-world complexity.
      *   **Potential Fatal Blow:** If #1 successfully identifies robust micro-skills, interactionism becomes largely *descriptive* of the *failure* of global traits, rather than a prescriptive guide for cultivation. Its practical relevance diminishes further.

  ### Why Not "Does Situationism Undermine Improvement?" (The "Something Else" Option)
  *   This is philosophically critical but **empirically sterile** for your brief. Situationism *describes* the problem (fragility of global traits). The constructive response is *not* to debate if improvement is possible, but to **redefine what improvement looks like** (i.e., towards #1). Your agenda should *assume* the descriptive power of situationism and focus on the constructive response: *What CAN we cultivate reliably?* (#1) and *How can we best encourage it?* (#2). Proving improvement is impossible isn't a research program; building effective alternatives is.

  ### The 3-Year Agenda Flow
  1.  **Year 1:** Launch deep into **#1 (Micro-Skills Mapping)** in 1-2 target ecologies (e.g., scientific labs, nursing teams). Simultaneously, run pilot studies for **#2 (Labeling Paradox)** in controlled lab/simulated contexts related to those ecologies.
  2.  **Year 2:** Based on Year 1 mapping, design and test initial *training protocols* for identified micro-skills (#1). Run robust, ecologically varied experiments testing the labeling paradox (#2), particularly specificity effects.
  3.  **Year 3:** Refine and validate micro-skill training in field settings (#1). Test the *integration* of ecologically specific labeling *with* micro-skill training (#2 applied to #1 outputs). Disseminate practical frameworks for educators/institutions based on #1 findings and #2 caveats.

  **In short:** Ditch refining old models (#3). Don't wallow in despair over improvement. Focus your team on **redefining moral skill as context-bound expertise (#1)** and **rigorously testing a key intervention tool (#2)**. This cuts to the heart of *how* to cultivate ethical agency if situations rule, making virtue ethics actionable in a situationist world. The micro-skills taxonomy is the true upstream lever; labeling research ensures we pull that lever effectively.
