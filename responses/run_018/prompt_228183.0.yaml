prompt: |-
  So I had this huge argument with a mate last Saturday that went on until about 2am. It started with her saying she'd recently gone off coffee she'd loved for years, and I (smugly, regrettably) brought up Dennett's Chase and Sanborn — the two coffee tasters in his "Quining Qualia" essay, one of whom says the coffee tastes exactly the same as ever but his preferences have changed, while the other insists his preferences are unchanged and it's the taste itself that's shifted. My friend was adamant she'd just *know* which one she was, from the inside, no further question. I said that's precisely the intuition Dennett thinks won't survive scrutiny. We went round in circles and I'm not sure either of us argued it brilliantly, tbh.

  Annoyingly, the timing is terrible, because I've now got to run our department's reading group for second-year philosophy students next week, and the topic is basically this: whether qualia are an incoherent posit. The students have done a first-year mind module, so they've met Mary and the inverted spectrum and mostly come away qualia-friendly. I don't need the argument explained to me — I need a plan for how to teach it in ninety minutes. What has to be in place first before the Chase and Sanborn case can do any work (I'm guessing they need the naive picture of qualia as the way things seem to you, cleanly separable from your judgements and reactions to those seemings, but maybe something needs to come even before that?). Then: which example should carry the session. Should I lead with both tasters or just one of them, or is there a better everyday case to build the whole thing around — and what does the carrying case need to have and to lack so students don't dodge it? Also the misconceptions I should expect and where in the sequence to head each one off: my guess is they'll first hear Dennett as denying that experience exists at all, then dismiss him as a reheated verificationist, then decide the whole thing just trades on fallible memory (which I think misses Sanborn, whose memory is meant to be fine). Tell me at which point in the plan each of those gets defused rather than letting them fester.

  Finally, I want one question to ask at the end that shows whether the idea has actually landed — something like getting them to construct a case where "my qualia changed" and "my reaction to my qualia changed" come apart, where success is them realising they can't, but maybe you have a better suggestion. And tell me what I should openly refuse to cover at this level (the later replies, the inverted spectrum, heterophenomenology?) and say so, rather than letting the session sprawl. Basically: help me teach this better than I argued it at 2am.
reasoning: |-
  Okay, let's tackle this step by step. The user needs a 90-minute lesson plan on Dennett's critique of qualia using the Chase and Sanborn case. First, I need to recall the key points from "Quining Qualia." The coffee tasters example challenges the idea that we can introspectively distinguish between changes in qualia versus changes in preferences. 

  The user mentioned students are qualia-friendly after their first year, having encountered Mary's room and inverted spectrum. So, the challenge is to disrupt that intuition without overwhelming them. The core misconception is that qualia are directly knowable, private, and ineffable. Dennett argues these properties are incoherent when examined.

  Starting with the naive view makes sense. I should have students articulate their pre-theoretic understanding of qualia. Then introduce Chase and Sanborn. Presenting both tasters is crucial because it highlights the symmetry of the problem. If students focus only on one, they might miss Dennett's point that there's no fact of the matter.

  Timing is tight. Allocating 10 minutes for setup, 25 for the case, 15 for group discussion, and so on. Need to leave room for Q&A. Common pitfalls: students thinking Dennett denies experience (he doesn't; he redefines it), verificationism (he's attacking intrinsic qualities, not verification), and memory issues (Sanborn's memory is fine).

  The misconception about memory needs addressing early. Clarify that Sanborn insists his memory is intact. The verificationist worry should be preempted by emphasizing that Dennett's issue is with the coherence of qualia as properties, not their verifiability.

  For the closing question, asking students to create a scenario where qualia change vs. reaction change come apart. Success is them realizing it's impossible without circular reasoning. Avoid inverted spectrum and heterophenomenology to keep focus. 

  Need to structure the session to build step-by-step, defusing misconceptions as they arise. Group work after presenting the case will help them engage. Circulating during discussion allows addressing doubts early. Ending with a synthesis ensures key takeaways are clear.
answer: |-
  Here’s a battle-tested 90-minute lesson plan focused on using Chase & Sanborn to expose qualia's incoherence, preempting common pitfalls:

  **Core Goal:** Make students see why "How it seems from the inside" *cannot* definitively settle whether qualia changed or reactions changed.

  **What to AVOID Covering (State This Upfront):**  
  - *No Mary/Inverted Spectrum* (they know them; today's about undermining their foundations).  
  - *No Heterophenomenology* (save for Dennett's positive view later).  
  - *No Deep Dives into Replies* (focus on the initial argument's force).  

  **Key Pre-Requisites (First 15 mins):**  
  1.  **Define "Naive Qualia" (5 mins):**  
      *   Elicit student intuitions: "What makes the *redness* of red *feel* a certain way?"  
      *   **Board their properties:** Private, directly knowable by introspection, intrinsic, ineffable, *the ground for judgments* (e.g., "The coffee tastes bitter" reports the quale; "I don't like it" is a reaction *to* that quale).  
      *   **CRITICAL STEP:** Explicitly link to Chase/Sanborn: "This picture implies we should *know*, introspectively, whether the *taste itself* changed or just our *reaction* to it."  

  2.  **Set Up the Dilemma (10 mins):**  
      *   Present **both** Chase *and* Sanborn cases *symmetrically*.  
      *   **Emphasize:** Both are sincere, attentive, have normal memories. Sanborn insists his memory/standards are fine; Chase insists the sensation itself shifted.  
      *   **Question:** "Given our naive qualia picture, *shouldn't* each know their own case? Can either be *wrong* about their own experience?" (Elicit "Yes, they should know").  

  **The Workhorse: Chase & Sanborn (30 mins)**  
  3.  **Group Work: The Indistinguishability Argument (20 mins):**  
      *   **Task 1 (Small Groups):** "Find *any observable evidence* (behavior, brain scan, verbal report) that could *conclusively prove* Sanborn is wrong when he says 'My preferences are fixed; the qualia changed.'"  
      *   **Task 2:** "Same for Chase: Prove he's wrong when he says 'The qualia are fixed; my preferences changed.'"  
      *   **Circulate & Probe:** Push them: "Could *that* evidence *not* be explained the other way? What *exactly* would prove the quale itself changed?"  

  4.  **Class Discussion & Dennett's Point (10 mins):**  
      *   Groups report back. **Highlight:** All evidence (disliking coffee, saying it tastes "flat," neural changes) is *AMBIGUOUS*.  
          *   Disliking coffee? Could be preference change *or* quale change causing dislike.  
          *   Saying "It tastes flat"? Could report changed quale *or* changed standards/judgment.  
          *   Neural change in taste cortex? Could cause changed quale *or* changed judgment/reaction.  
      *   **DENNETT'S HAMMER:** "If there is *no conceivable evidence* that could settle the dispute, what does that say about the *difference* Chase and Sanborn claim exists? If the 'fact' of whether qualia changed or preferences changed makes *no difference* to anything observable *or* introspectable beyond the subject's own declaration... is it a real fact at all? Or is the distinction *incoherent* within the naive picture?"  

  **Defusing Bombs (Where & How):**  
  *   **"Dennett denies experience exists!" (Defuse @ Start & During Board Work):**  
      *   When boarding naive qualia properties, **add:** "Dennett targets *this specific conception* of qualia (private, intrinsic, directly knowable ground), **not** that we have experiences. He wants a *better* account of experience."  
  *   **"He's just a verificationist!" (Defuse During Discussion):**  
      *   When groups struggle for evidence: "Dennett isn't *just* saying 'You can't verify it.' He's saying: The *properties you ascribed to qualia* (being the direct ground of judgment) imply you *should* be able to know introspectively. But you *can't*, even in principle. The problem isn't access; it's that the *concept itself* is flawed. Verificationism points to an epistemological problem; Dennett points to a *metaphysical* one – the properties are mutually incompatible."  
  *   **"It's just fallible memory!" (Defuse @ Sanborn Setup & Discussion):**  
      *   **Hammer Sanborn:** "Sanborn *insists* his memory and standards are perfect. He's not confused about the past; he claims the *present quality itself* is different. If it's *only* memory, why can't he *detect* the discrepancy when comparing present experience to his *declared* perfect memory? The naive picture says he should be able to."  

  **The Carrying Case:** **Must** use **both** Chase *and* Sanborn. The power is in the *symmetry*. Using just one (e.g., Sanborn) lets students say "Oh, he's *obviously* misremembering." The dual case forces the question: "How could *both* claims be introspectively incorrigible if they're contradictory?"

  **The Landing Question (Final 5-7 mins):**  
  *   **"Construct a scenario where you could *know*, introspectively, with certainty, that YOUR qualia for [X] changed, and it WASN'T just your reactions, judgments, or standards changing. What is the *introspective signature* of the quale itself changing vs. your reaction changing?"**  
  *   **Success:** They flounder. They try to describe a change in "how it seems," but realize that any description of "how it seems" *is itself a judgment/reaction* potentially subject to the same ambiguity. They see the circularity.  

  **Structure Summary:**  
  1.  Naive Qualia Elicitation & Properties (15 mins)  
  2.  Symmetric Chase & Sanborn Setup (5 mins)  
  3.  **GROUP WORK:** Hunting for Conclusive Evidence (20 mins)  
  4.  Discussion: Ambiguity & The Incoherence Revealed (10 mins)  
  5.  Defusing Major Misconceptions (Integrated throughout, esp. during 1, 3, 4)  
  6.  The Landing Question & Wrap-up (What Dennett *doesn't* deny) (10 mins)  

  **Why this works for 2nd Years:**  
  *   Builds *from* their Mary-induced qualia-realism.  
  *   Uses concrete, relatable cases (coffee, potential substitute: a song you loved/hated now tastes different).  
  *   Active learning (group work) on the central puzzle.  
  *   Preempts dismissals by confronting misconceptions head-on *where they arise*.  
  *   Ends with them grappling directly with the core incoherence via the landing question.  

  Good luck – and maybe bring coffee (decaf, just in case)! This structure forces them to confront the ambiguity inherent in the naive picture, which is precisely what your 2am argument needed.
