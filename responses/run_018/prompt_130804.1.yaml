prompt: |-
  My study group is arguing about this debunking thing and I need outside eyes. Here's the argument my friend scribbled down — I think there's a typo in step (4) but I copied it exactly:

  (1) If a belief-type was shaped mainly by natural selection for survival or mating success, and if the facts those beliefs are about can't causally affect survival, then beliefs of that type are globally unreliable.

  (2) Moral beliefs — e.g., that torturing innocents is wrong — were shaped for social coordination. Moral facts, if real, are causally inert: knowing them doesn't change your reproductive odds.

  (3) So moral beliefs are globally unreliable.

  (4) Now apply the same pattern to belief D, where D is the claim that evolutionary debunking is sound. D was also selected for: skeptical, reductionist reasoning boosts status in some social niches, and tracking causal origins of belief helps with manipulation and alliance-building.

  (5) The facts D is about — epistemic norms, causal histories of belief — are also causally inert in the same way. Knowing that selection caused your belief doesn't change there survival.

  (6) Therefore D is globally unreliable too.

  (7) But if D is unreliable, we have no reason to accept (1).

  (8) So the debunker must either drop (1) or accept they have no grounds for it. He says this proves evolutionary debunking collapses into global skepticism and therefore proves too much.

  I think the weak point is somewhere between (4) and (6) — maybe (5) is wrong because epistemic norms aren't causally inert in the same way? Or maybe (4) is wrong because D wasn't selected in the same domain? But I can't tell if it's a subtle equivocation or if the argument is actually valid and I just have to bite a bullet. I want to keep (2) if possible, since it feels right that selection doesn't track moral truth. What's the right step to reject, and what does giving it up cost? Is there a hidden scope shift?
reasoning: |-
  Okay, the user is presenting an argument about evolutionary debunking that their study group is debating. They've shared a friend's scribbled notes, which include a self-referential debunking argument against evolutionary debunking itself. The user suspects there might be a typo in step (4) but copied it exactly as written. They're particularly interested in preserving the core idea that moral beliefs aren't truth-tracking (step 2) while finding where this counterargument goes wrong.

  Hmm, this is actually quite sophisticated philosophy - we're dealing with metaepistemology here, specifically evolutionary debunking arguments (EDAs) applied against themselves. The argument follows a clear pattern: first it establishes why moral beliefs are unreliable (steps 1-3), then applies the same logic to the debunking principle itself (steps 4-6), concluding this leads to self-defeat (7-8).

  Looking carefully at step (5), there might be a typo in "doesn't change there survival" - probably should be "their survival". But that's minor. The real meat is in the self-application. The user is intuitively right to question steps 4-6. Let me mentally walk through the issues...

  First major problem: domain mismatch. When we say moral facts are "causally inert", we mean they don't physically affect reproductive success. But epistemic norms? That's different. Knowing why we believe things absolutely can impact survival - think of avoiding manipulation or making better tools. There's a category error here.

  Second, the selective pressures are fundamentally different. Moral beliefs might be shaped by coordination needs (which may not track truth), but the capacity for skeptical reasoning? That plausibly was selected for truth-tracking in practical domains. The argument conflates the origin of a cognitive faculty with its current application.

  Third, and most subtly, the global unreliability claim is too strong. Even if evolutionary pressures didn't select for moral truth-tracking, that doesn't mean all products of evolution are unreliable. Our vision isn't perfect but it's not "globally unreliable" for basic object recognition.

  The user wants to preserve step 2 while rejecting the self-defeat. That's completely reasonable - we can maintain that moral beliefs are shaped by non-truth-tracking pressures without claiming all reasoning is undermined. The cost? We need a more nuanced view of evolutionary influences - perhaps distinguishing between domains where evolution would select for truth-tracking versus domains where it wouldn't.

  What I find particularly clever is how this exposes a vulnerability in strong EDAs: they risk being self-undermining if applied too broadly. But the solution isn't to abandon EDAs altogether, just to refine their scope. The user seems philosophically astute for spotting this tension - they're wrestling with exactly the right questions about domain specificity and causal efficacy.
answer: |-
  This is a sophisticated self-referential argument against evolutionary debunking (EDAs), and your intuition that the flaw lies between (4)-(6) is correct. The critical failure is in **step (5)** due to a **domain mismatch** and a **misunderstanding of causal inertness**. Let's break it down:

  ### The Core Flaw: Step (5) is False
  *   **Premise (5) claims**: "The facts D is about — epistemic norms, causal histories of belief — are also causally inert in the same way [as moral facts]."
  *   **Why this is wrong**: Epistemic norms and causal histories of beliefs **are not causally inert in the same way moral facts are claimed to be**.
      1.  **Epistemic Norms ARE Causally Relevant**: Knowing and applying accurate epistemic norms (like logic, evidence evaluation, tracking causal origins of beliefs) **directly impacts survival and reproductive success**. For example:
          *   Correctly identifying that a rustling sound is caused by a predator (not the wind) saves your life.
          *   Accurately tracking the causal origin of someone's claim (e.g., "Is this person lying to manipulate me?") helps avoid exploitation and build beneficial alliances.
          *   Using sound reasoning to predict weather, find food, build tools, or diagnose illness directly enhances survival chances. **Tracking truth about the physical and social world via reliable epistemic norms is a core adaptive advantage.**
      2.  **Moral Facts (as Defined) are NOT Causally Relevant**: The argument *assumes* (for the sake of EDAs) that moral facts, like "torture is objectively wrong," do not causally interact with the physical world in a way that impacts reproductive fitness. Knowing this abstract truth doesn't directly help you avoid a tiger or find a mate *in the way* accurate perception or causal reasoning does.

  ### Why Step (4) is Also Problematic (But Less So)
  *   **Premise (4) claims**: Belief D (the soundness of EDAs) was selected for because "skeptical, reductionist reasoning boosts status... and tracking causal origins... helps with manipulation and alliance-building."
  *   **Why this is weak/overstated**:
      *   **Partial Truth**: Reasoning abilities *were* selected for practical problem-solving and social navigation. Some skeptical reasoning *can* be adaptive in specific contexts (e.g., spotting deception).
      *   **Domain Mismatch**: However, the *specific, abstract, philosophical belief D* ("evolutionary debunking arguments are sound") is almost certainly **NOT an adaptation**. It's a highly refined, culturally transmitted product *built using* cognitive capacities selected for more concrete, practical purposes. Natural selection didn't shape a specific "EDA module" in our brains.
      *   **Not Primarily for Manipulation**: While reasoning *can* be used for manipulation, its primary adaptive value lies in *accurate* understanding of the world and social dynamics for cooperation and survival. Truth-tracking *is* often beneficial.

  ### Consequences of Rejecting Step (5)
  1.  **You Keep (1) and (2) Intact**: You can maintain the core EDA against moral realism:
      *   (1) If a belief-type is shaped *only* by selective pressures unrelated to tracking the relevant truths, it's unreliable regarding *those truths*.
      *   (2) Moral beliefs were shaped by pressures for social coordination/stability, *not* for tracking causally inert moral facts (if they exist).
      *   (3) Therefore, moral beliefs are unreliable guides to causally inert moral truths.
  2.  **You Block the Self-Defeat**: Because epistemic norms/causal histories **are causally relevant**, premise (1) **does not apply** to belief D in the same way. Beliefs formed *using* reliable epistemic norms *about* causally relevant facts (like how minds work, or causal origins of beliefs) can be justified *even if* the cognitive capacity for such reasoning evolved. Their justification comes from their reliable connection to the relevant facts within their domain.
  3.  **No Collapse into Global Skepticism**: You avoid the conclusion that *all* reasoning is debunked. You distinguish between:
      *   **Domains where evolution plausibly shaped beliefs for purposes unrelated to truth-tracking in that domain** (e.g., moral beliefs shaped for coordination, not tracking moral facts).
      *   **Domains where evolution plausibly shaped cognitive capacities *for* truth-tracking because truth is causally relevant to fitness** (e.g., perception, basic causal reasoning about the physical/social world, potentially some epistemic norms).
      *   **Highly abstract philosophical beliefs (like D)**: These aren't direct adaptations but complex cultural products built using evolved capacities. Their justification depends on the soundness of the reasoning used to arrive at them, not their direct evolutionary pedigree.

  ### The Hidden Scope Shift & What Giving Up Step (5) Costs
  *   **Scope Shift**: The argument subtly shifts the scope of "causally inert." It correctly identifies moral facts (as conceived in EDAs) as inert *relative to the selective pressures shaping moral beliefs*. It *incorrectly* assumes epistemic facts are equally inert *relative to the selective pressures shaping reasoning capacities*. The pressures shaping reasoning capacities **were directly about tracking truths in the physical/social world**, making those truths causally *active* in the evolutionary story.
  *   **Cost of Rejecting Step (5)**:
      *   **Increased Complexity**: You must accept a more nuanced view of evolution's influence. Not all beliefs/capacities are shaped the same way. You need criteria to distinguish domains where truth-tracking was likely selected for vs. where it wasn't. This is challenging but necessary.
      *   **Potential Vulnerability**: You must defend the claim that basic epistemic norms/capacities *are* reliably truth-tracking within their domain *despite* their evolutionary origins. Arguments about evolutionary "proper function" or the practical success of science/technology often support this.
      *   **No Free Pass**: It doesn't automatically justify any specific belief (like D). Belief D must still be argued for using good reasoning. Rejecting step (5) just prevents the self-defeat; it doesn't prove EDAs are sound.

  **In summary: Reject step (5). Epistemic norms and causal histories of belief are *not* causally inert like moral facts are claimed to be within the EDA framework. Their accurate tracking *is* causally relevant to survival and reproduction. This breaks the self-referential application of the EDA while preserving the core argument against moral realism. The cost is a more complex, domain-specific understanding of evolutionary influences on belief.**
