  4. The subject's awareness of remembered past pleasures or accomplishments while in anhedonic satisfaction introduces tension, as tranquilism must either dismiss the relevance of memory to current value or concede that recalling positive states confers value the present state lacks.
  5. Maintaining anhedonic satisfaction might incur significant costs (e.g., social isolation, medical intervention), requiring tranquilism to deny that such burdens detract from its maximal goodness or to surreptitiously admit contextual factors influence the state's overall value.
