  Midway, stanzas four and five should escalate frustration. "Choice" opener ("Choice, they say, defines the moral ground") parodies libertarian claims, immediately undermined by "old self". "Origin" as "first breath" denies self-authorship. Fifth stanza's "Origin" beginning ("Origin remains just out of sight") makes the search feel futile, "impossible" as "dark" seals it.

