  Checking against Strawson: Stanza 1 (action from nature), 2 (demand for self-origination), 3-5 (regress of causes), 6 (*causa sui* impossibility). Envoi = Basic Argument QED. 

  For emotional impact: words like "phantom," "fray," "dark," "rift" sustain unease. The "gift" in envoi is bitter—responsibility as inherited burden, not triumph. Friend will recognize the logic; stranger will feel the claustrophobia through repetition. 

