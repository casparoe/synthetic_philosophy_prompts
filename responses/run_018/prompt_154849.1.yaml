prompt: |-
  In applied AI ethics, a growing number of alignment teams collect human moral judgments—say, on trolley-style trade-offs or resource-allocation dilemmas—then apply statistical de-biasing to correct for framing, order effects, and social-desirability distortion, and feed the residual data into reward models as if they represent the subjects' genuine moral preferences. What theory of moral psychology does this pipeline presuppose? Does it require that moral beliefs have a stable core that survives noise removal, or only that preferences converge after correction? Is it compatible with the view that so-called biases—loss aversion, in-group favoritism, temporal discounting—are not distortions but constitutive moral commitments? Reconstruct the implicit metaphysics of preference embedded in the practice, distinguish what the pipeline strictly requires from what it merely accommodates, and describe what an elicitation protocol would look like if it treated every systematic deviation as a potential value rather than an error.
reasoning: |-
  Okay, the user is asking about the theoretical underpinnings of a specific approach in applied AI ethics where human moral judgments are collected, statistically de-biased, and used to train reward models. They want to know what theory of moral psychology this presupposes and whether it requires stable moral beliefs or just convergence after correction. They also question if the so-called "biases" might actually be constitutive moral commitments. Finally, they ask about reconstructing the implicit metaphysics of preference and how an alternative protocol might look.

  First, I need to unpack the pipeline described. The process involves gathering human judgments on moral dilemmas, like trolley problems or resource allocation. Then, statistical methods are used to remove biases such as framing effects, order effects, or social desirability bias. The cleaned data is then fed into reward models as the "true" moral preferences. 

  The core theory here seems to be rooted in rationalist and intuitionist moral psychology. Think of thinkers like Haidt, but more computational. The assumption is that there's a stable core of moral beliefs that can be uncovered by stripping away noise. This aligns with a dual-process theory where System 1 (intuitive, biased) needs correction to reveal System 2 (rational, true preferences).

  The key metaphysical commitments here are realism and purism. Moral preferences are seen as real, stable entities that exist independently of expression. Noise and biases are distortions that obscure these true preferences. The pipeline treats biases as errors to be corrected, not as part of the moral commitment itself.

  Now, does this require a stable core or just convergence? The pipeline likely requires a stable core. Convergence might be a byproduct, but the goal is to uncover pre-existing truths. If convergence happens without a stable core, that might be more about intersubjective agreement, but the pipeline's language ("residual data," "genuine preferences") suggests a deeper realism.

  Regarding biases as constitutive commitments: The current pipeline isn't compatible with that view. If loss aversion or in-group favoritism are seen as part of moral values, removing them would erase genuine aspects of preference. The pipeline's statistical corrections assume these are distortions, not features.

  For the reconstruction of implicit metaphysics: The pipeline views preferences as latent variables—fixed, discoverable through data. It's a form of moral realism with a rationalist bent. What's strictly required is that preferences are stable enough to be recoverable post-debiasing. Accommodations might include some level of context-dependence, but the core must be invariant.

  Finally, the alternative protocol: If every systematic deviation is a potential value, the approach shifts. Instead of correcting biases, you'd characterize them. Use methods like cognitive interviews to understand why someone discounts the future or favors their in-group. Capture context variables and treat deviations as data. The reward model would then integrate these as part of the preference structure, not noise.

  The user might be critiquing the pipeline's assumptions, suggesting that it oversimplifies moral psychology by dismissing biases. They might want to highlight that what's considered a bias could be contextually valid. Their deeper need could be to challenge AI ethics practices that ignore the complexity of human values, advocating for more nuanced models that incorporate biases as meaningful.
answer: |-
  The described pipeline in applied AI ethics implicitly relies on a **Rationalist Intuitionist** theory of moral psychology, heavily influenced by computational cognitive science and latent variable modeling. Its core presuppositions, requirements, and limitations can be reconstructed as follows:

  **Implicit Theory of Moral Psychology:**
  1. **Dual-Process Framework:**  
     Presupposes Kahneman-style System 1 (fast, heuristic-driven intuitions) vs. System 2 (slow, rational deliberation). "Biases" are System 1 noise obscuring System 2's true moral beliefs.

  2. **Moral Realism with Noise:**  
     Assumes humans possess *stable, internally consistent moral preferences* (latent variables) that exist independently of measurement. Biases are epistemological distortions, not ontological features of morality.

  3. **Universalism via Aggregation:**  
     Individual deviations cancel out under statistical correction, revealing cross-contextual "shared values" (a weak form of moral realism contingent on data aggregation).

  4. **Computationalism:**  
     Moral reasoning is reducible to preference weights that can be modeled as vectors in reward functions once noise is filtered.

  **Metaphysics of Preference Embedded:**
  - **Essentialism:** Moral preferences have an immutable "core" (the *residual* after de-biasing).  
  - **Atomism:** Preferences are discrete, composable, and context-independent.  
  - **Quantifiability:** Moral trade-offs can be represented as scalar weights.  
  - **Purism:** Culture/psychology *distorts* values rather than constituting them.  

  **What the Pipeline *Strictly Requires*:**
  1. **Recoverability:** A stable signal must exist beneath noise (even if only emergent from aggregation).  
  2. **Separability:** "Biases" must be statistically distinguishable from "core preferences" (e.g., framing effects ≠ terminal values).  
  3. **Convergence:** Corrected preferences must show inter-subjective alignment across contexts.  
  4. **Instrumentalism:** The *corrected* output—not the raw judgment—defines "genuine" preference.  

  **What It Merely *Accommodates*:**
  - Moderate cultural variation (if de-biasing yields overlapping clusters).  
  - Weak constructivism (preferences can be shaped, but *post-formation* stability is assumed).  
  - Bounded rationality (if biases are correctable "mistakes").  

  **Incompatibility with Constitutive Bias Views:**  
  The pipeline is **fundamentally incompatible** with perspectives where "biases" are constitutive moral commitments:  
  - **Loss aversion** as prudence (e.g., "Avoiding loss *is* ethical stewardship").  
  - **In-group favoritism** as relational ethics (e.g., "Partiality to community defines care").  
  - **Temporal discounting** as affirmation of present needs (e.g., "Future discounting respects current survival").  
  Treating these as "errors" denies their status as *value-laden priorities*, reframing them as computational glitches.  

  **Alternative Protocol: Treating Deviations as Values**  
  An elicitation method embracing biases as potential moral data would:  

  1. **Contextual Embedding:**  
     - Record *all* contextual variables (culture, identity, situational stress) as *integral* to preference.  
     - Example: Measure in-group favoritism *across relationship tiers* (family vs. strangers) as value parameters.  

  2. **Bias-Explicit Modeling:**  
     - Model "biases" as *modulating functions* in utility calculations:  
       `U(action) = CoreValue(action) × BiasModulator(context)`  
     - e.g., Temporal discounting becomes a time-preference *parameter*, not an error term.  

  3. **Phenomenological Elicitation:**  
     - Post-decision interviews: *"Why did framing/order affect your choice?"*  
     - Tool: Cognitive laddering to surface how biases serve higher values (e.g., "Loss aversion protects stability").  

  4. **Non-Aggregated Diversity:**  
     - Cluster subjects by bias/value profiles (e.g., "Prudential conservatives" vs. "Utilitarian risk-takers").  
     - Reward models incorporate multiple moral frameworks without forcing convergence.  

  5. **Dynamic Preference Mapping:**  
     - Track how preferences *morph* across contexts (e.g., resource allocation under scarcity vs. abundance) using RL with state-dependent rewards.  

  **Illustrative Contrast**  
  | **Traditional Pipeline** | **Bias-as-Value Protocol** |  
  |---------------------------|----------------------------|  
  | Corrects order effects statistically | Asks: *"How does task order *reveal* your moral anchors?"* |  
  | Treats social desirability as distortion | Uses desirability bias to map *public vs. private ethics* |  
  | Output: Single "de-noised" utility function | Output: Ensemble of context-sensitive value schemas |  

  This alternative assumes **moral anti-realism**: Preferences emerge from the interaction of biology, culture, and context, with "biases" as evolutionarily/culturally embedded heuristics that *are* the substance of morality. The pipeline’s error-correction approach, while pragmatic for AI safety, implicitly privileges a rationalist metaphysics ill-suited to capturing the embodied, situated nature of human values.
