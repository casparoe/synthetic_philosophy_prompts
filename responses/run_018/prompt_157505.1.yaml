prompt: |-
  You are a professional philosopher of science with expertise in metaphysics, evolutionary explanation, and the philosophy of social institutions. Before writing, think carefully and spend a few minutes brainstorming: articulate Daniel Dennett's distinction between cranes and skyhooks, define greedy reductionism and why it is sometimes accused of explaining away rather than explaining phenomena, and then identify a specific but under-discussed tension—namely, whether the long-term stability of intergenerational institutional norms (such as climate governance obligations) can be fully decomposed into bottom-up, individually rational strategic interactions, or whether such norms exert a form of downward constraint that behaves like a skyhook, resisting greedy reduction to the lowest explanatory level. Once you have mapped this terrain, write a dialogue of roughly 900 words between two equally competent interlocutors—Dr. Elena Voss, who advocates for a crane-based, greedily reductionist explanation of institutional persistence, and Dr. Marcus Chen, who argues that in this particular domain a skyhook is unavoidable because collective intentionality introduces irreducible normative structures that constrain lower-level behavior. They must engage in genuine back-and-forth: each should respond directly to the other's specific claims about decomposition, emergence, downward causation, and explanatory adequacy, refining positions rather than talking past one another. Avoid strawmanning either side. The dialogue should be conceptually precise, readable, and should end without a forced resolution, leaving the tension genuinely open. Do not include a bibliography, reading list, or citations. Do not quote verbatim from published works; paraphrase any allusions in your own words. Keep the framing focused on the conceptual machinery rather than on empirical case studies that would require outside verification.
