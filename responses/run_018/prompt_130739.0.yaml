prompt: |-
  hey so i'm trying to figure out my advisor's implicit demarcation rule, but she's never spelled it out. here's her track record on whether a research program counts as genuine science or pseudoscience:

  - buss-style evolutionary psych with risky mating predicitions -> science
  - classic freudian dream interpretation -> science (surprisingly)
  - marxist historiography applied to 20th century revolutions -> science
  - pre-empirical string theory with the landscape -> not science
  - behe-style intelligent design -> not science
  - climate attribution linking specific hurricanes to warming -> science
  - 19th-century phrenology -> not science
  - modern fMRI neuro-phenotyping mapping personality traits to cortical thickness -> science
  - ganzfeld parapsychology protocol -> not science

  the new case is this framework called typogenetic epistemology. it builds a DNA-gödel isomorphism to model scientific theories as self-replicating structures with built-in self-reference, and it predicts that any mature discipline will eventually generate true but unprovable statements about its own replicatoin dynamics. the predictions are probabilistic and only testable over decades, though proponents claim three retrospective hits on citation-network patterns in physics and sociology.

  do you think she'll call it science? i care less about the yes/no than about the rule. it could be a lakatos-style progressive-program criterion, a mechanistic rule demanding direct empirical access to the mechanisms claimed, or a stricter popperian falsifiability rule. say what each predicts here, which best fits her earlier verdicts, your best guess with reasoning, and then name one hypothetical case that would actually split these rules apart. also please don't ask for a bibliography, i won't have one handy.
reasoning: |-
  Okay, the user is trying to figure out their advisor's implicit rule for demarcating science from pseudoscience based on her past classifications. They provided several examples and a new case called typogenetic epistemology. I need to analyze her past decisions, apply different philosophical rules (Popper, Lakatos, mechanism), see which fits best, predict her verdict on the new case, and suggest a hypothetical test case.

  First, looking at her track record. She accepts Buss-style evolutionary psych, which makes risky mating predictions. That's falsifiable, so Popperian might fit. But then she accepts Freudian dream interpretation, which is famously unfalsifiable. That's a problem for Popper. Marxist historiography applied to revolutions might have testable predictions, but it's also flexible. String theory pre-empirical landscape is rejected, which Popper would agree with due to non-falsifiability. Intelligent design rejected—Popper again. Climate attribution science—testable, so Popper fits. Phrenology rejected—maybe because falsified? But it was testable initially. fMRI neuro-phenotyping is accepted, which is empirical and testable. Ganzfeld parapsychology rejected, which isn't falsifiable.

  Hmm, Freudian dream interpretation being accepted is a big issue for strict Popper. Lakatos allows for programs with protective belts, so Freud might fit as a degenerating program she still considers science. Marxist historiography could be seen as progressive in some contexts. String theory without empirical tests is degenerating, so Lakatos rejects it. Intelligent design never progressive, rejected. Climate science progressive. Phrenology was degenerating and replaced. fMRI is progressive. Parapsychology degenerating. So Lakatos seems to fit better, especially with Freud and Marxism.

  Mechanistic rule? Evolutionary psych claims mechanisms (mating strategies), Freud has mechanisms (repression, dreamwork), Marxism (class struggle), climate (physical mechanisms), fMRI (neural correlates). String theory has mechanisms but untestable, rejected. Intelligent design invokes supernatural, no mechanism. Phrenology outdated mechanisms. Parapsychology no known mechanisms. So mechanism fits too, except maybe Freud—his mechanisms aren't directly observable, but she accepted it. Maybe she allows inferred mechanisms?

  The new case, typogenetic epistemology, has a DNA-Gödel isomorphism, models theories as self-replicating, predicts unprovable statements. Probabilistic, long-term tests, retrospective citation analysis. Lakatos might accept if it has novel predictions and heuristics, but the retrospective hits might be seen as ad-hoc. Popper would reject as not falsifiable due to decades-long tests. Mechanism rule: it's abstract, not physical mechanisms, so probably reject.

  The user cares more about the rule than the yes/no. Lakatos fits best because of Freud and Marxism. Mechanism rule might be secondary. For the hypothetical test case, something like Ptolemaic epicycles with predictive success but no mechanism vs. phlogiston which was falsified. Lakatos accepts progressive, mechanism rejects if no mechanism. Or phlogiston: falsified (Popper rejects), degenerating (Lakatos rejects), mechanism initially plausible but wrong. Maybe a case like string theory if it makes novel predictions without direct tests—Lakatos might accept if progressive, Popper rejects, mechanism might reject if no testable mechanisms.
answer: |-
  Based on your advisor's track record and applying major demarcation frameworks, here's the breakdown and prediction for typogenetic epistemology:

  ### 1. **Rule Predictions for Typogenetic Epistemology**
     - **Popperian Falsifiability**: **Rejects as non-science**  
       *Why*: Predictions are probabilistic, require decades to test, and rely on retrospective citation patterns (arguably non-falsifiable in practice). Resembles pre-empirical string theory.
     - **Lakatosian Progressive Program**: **Accepts as science**  
       *Why*: Claims "three retrospective hits" suggest empirical progress (novel facts). Self-reference heuristics could constitute a "research program" with problem-solving capacity.
     - **Mechanistic Rule**: **Rejects as non-science**  
       *Why*: Abstract isomorphism (DNA-Gödel) lacks direct empirical mechanisms. No physical causal pathways (cf. fMRI neurophenotyping).

  ### 2. **Best Fit for Her Track Record: Lakatosian Progressive Program**
     - **Evidence**:
       - Accepts Freud/Marx: Both famously *unfalsifiable* (Popper would reject) but have heuristic frameworks generating novel interpretations (Lakatosian "progressive shifts").
       - Rejects string theory/ID: No *empirical progress* despite theoretical machinery (degenerating programs).
       - Accepts climate attribution/fMRI: Concrete novel predictions (progressive).  
       - Rejects phrenology/parapsychology: Degenerating programs (failed predictions, no new insights).
     - **Inconsistencies Explained**:  
       Freudianism is typically pseudoscience to Popperians but fits Lakatos if viewed as generating *new clinical insights* (as your advisor seems to). Marxist historiography similarly survives via new historical analyses.

  ### 3. **Prediction for Typogenetic Epistemology: She Calls it SCIENCE**
     - **Reasoning**:  
       Her tolerance for Freud/Marx suggests she values programs producing *retrospectively corroborated insights* over strict falsifiability. The claimed "three retrospective hits" in citation networks mirror Lakatos' "novel facts," giving it a provisional pass. She'll likely argue it's a *nascent* progressive program (like early string theory before the landscape problem).

  ### 4. **Hypothetical Split Case: Ptolemaic Astronomy (Epicycles)**
     - **Scenario**: A modernized version using epicycles to predict planetary positions with 99.9% accuracy, but *no physical mechanism* for epicycles (treated as mathematical tools).  
     - **How Rules Split**:
       - **Popper**: Accepts (highly falsifiable and empirically successful).  
       - **Lakatos**: Rejects (degenerating program; epicycles add no *new* physics, just protect the core).  
       - **Mechanistic Rule**: Rejects (no causal mechanism for epicycles).  
     - **Your Advisor's Likely Call**: **Rejects** (aligns with Lakatos/mechanism).  
       *Why*: Parallels phrenology—initially predictive but no progressive growth or physical basis.

  ### Key Insight:
  Her rule appears **Lakatos-with-a-mechanism-bias**: Programs must show *progressive problem-shifts* (empirical or theoretical) *and* anchor claims to plausible causal structures. Typogenetic epistemology barely meets the first (via retrospective analysis) but fails the second (abstract isomorphism ≠ mechanism). Yet her acceptance of Freud—which also lacks mechanisms—suggests she'll prioritize the Lakatosian criterion here. 

  **Watch for**: If typogenetic epistemology fails to generate *new* testable claims beyond post-hoc fits, she’ll reclassify it as pseudoscience later (like string theory’s fall).
