answer: |-
  This proposal seeks to challenge a common assumption within the historiography and philosophy of science regarding the phenomenon of simultaneous discovery. Frequently cited cases, such as the independent development of the calculus by Newton and Leibniz or the formulation of natural selection by Darwin and Wallace, are used to support a claim of inevitability: that certain discoveries emerge from the intellectual context of the time and are therefore destined to be made, regardless of the specific individual involved. The underlying argument is that if a particular discoverer had not existed, another would have inevitably made the same discovery shortly thereafter. However, this argument crucially relies on an unexamined premise: that we already possess a clear and agreed-upon understanding of what constitutes "the same discovery." A closer examination of the canonical cases reveals significant divergences. Newton's fluxions and Leibniz's differentials employed distinct notations, conceptualised fundamental operations differently, and were extended to different classes of problems with varying levels of comfort. Similarly, Darwin's meticulously constructed theory in *On the Origin of Species*, built over decades and integrating vast evidence, differed substantially from Wallace's more concise articulation in its mechanisms, scope, and emphasis, even where core ideas like descent with modification and the role of selection overlapped. These differences are not mere superficialities but reflect substantive variations in conceptualisation, methodology, and intended application.

  Therefore, the central question driving this research is: **What specific sameness relation must demonstrably hold between independently achieved intellectual contributions in a case of simultaneous discovery for that case to legitimately license the inference of inevitability, and to what extent do paradigmatic cases such as Newton/Leibniz and Darwin/Wallace actually satisfy the required relation?** This question demands moving beyond a simple acknowledgement of difference to rigorously defining the *kind* and *degree* of sameness necessary for the inevitability claim to hold water. Existing appeals to simultaneous discovery typically bypass this crucial step. They tend to operate with an implicit, often simplistic notion of sameness, perhaps focusing solely on a core conceptual kernel (e.g., "differential calculus" or "evolution by natural selection") while neglecting the significant variations in formulation, justification, scope, and integration that characterise the actual historical contributions. This leaves the inevitability argument fundamentally open, as it fails to establish that what was independently discovered was sufficiently identical in the relevant respects to warrant the conclusion that *it*, rather than something importantly different, was inevitable. Consequently, the argument risks being tautological or historically inaccurate.

  To address this question effectively requires more than a comparative history of the two episodes, though detailed historical analysis forms an essential foundation. A purely historical comparison, while valuable for documenting differences, lacks the necessary conceptual framework to define and evaluate the *significance* of those differences for the philosophical claims about inevitability and credit. My approach will therefore integrate philosophical analysis of sameness relations with meticulous historical case study. The twelve-month project would unfold as follows. Months one to three would involve a deep dive into the philosophical literature concerning individuation in science – how we identify and distinguish theories, concepts, and discoveries. This would synthesise work on theory identity, conceptual change, and incommensurability to develop a typology of possible sameness relations relevant to scientific claims (e.g., logical equivalence, empirical equivalence, functional equivalence, shared core principles, shared explanatory scope). Crucially, this phase would critically assess which of these relations, or combination thereof, would be minimally necessary to sustain the inevitability inference. Months four to six and seven to nine would then be dedicated to intensive primary source research and close textual analysis, focusing first on Newton’s and Leibniz’s mathematical writings and correspondence, and then on Darwin’s notebooks, drafts, correspondence, and publications alongside Wallace’s key papers and letters. The aim here is not merely to catalogue differences but to map the specific conceptual architectures, problem-solving strategies, and justificatory frameworks of each thinker against the typology developed earlier. Month ten would involve the comparative analysis, systematically evaluating the Newton-Leibniz and Darwin-Wallace pairs against the defined sameness relations to determine if, and to what extent, they meet the criteria necessary for the inevitability claim. Month eleven would explore the implications: if the required sameness relation is not met (or only weakly met), what does this imply for claims about the inevitability of *that specific discovery*? How should credit be conceptualised – does it attach to the abstract discovery-type (if it can be coherently defined) or to the specific, historically realised contribution with all its unique characteristics? Does this reconceptualisation alter the perceived significance (or insignificance) of historical priority disputes? Finally, month twelve would focus on synthesising the findings and drafting the dissertation chapters.

  A successful outcome for this research would be threefold. Firstly, it would yield a clearly articulated and defended account of the specific sameness relation(s) necessary for a simultaneous discovery case to genuinely support an inference of inevitability. Secondly, it would provide a rigorous, evidence-based assessment demonstrating that the paradigmatic cases of Newton/Leibniz and Darwin/Wallace fail to satisfy this necessary relation to the degree required, revealing significant divergence beneath the surface similarity. Thirdly, it would offer a revised framework for understanding credit in such cases, shifting focus away from an abstract, inevitable discovery-type towards recognising the unique constellation of ideas, formulations, and extensions that constitute each specific historical contribution, thereby potentially reframing the ethical and historical significance of priority disputes. Failure, conversely, would occur if the philosophical analysis proved unable to define a coherent and defensible necessary sameness relation, or if the close historical examination revealed that the differences between the contributions in the key cases were ultimately superficial, leaving the core achievements sufficiently identical by the defined criteria to still support a robust inevitability claim despite noted variations in presentation or application. This project promises to refine a fundamental argument in the understanding of scientific progress by demanding greater precision in how we identify and compare scientific achievements when drawing broader conclusions about their historical necessity.
