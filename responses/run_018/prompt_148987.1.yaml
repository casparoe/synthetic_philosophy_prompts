prompt: |-
  I have been a reader of rationalist forums for many years, and in a recent discussion about interpreting large language models I saw an argument shut down with the line "the model knows more than it says". The speaker was addressing a concern about deceptive alignment: they claimed that if the system genuinely possessed knowledge that its outputs were misleading, then standard or steering-based elicitation techniques ought to reveal it, so the failure of such methods proves the knowledge was never present.

  Please take on the role of an expert philosopher of mind with specialist knowledge of AI interpretability and alignment. Before answering, spend a paragraph brainstorming the conceptual distinctions that might be compressed inside this phrase — for example, representational versus behavioural knowledge, propositional versus procedural content, explicit accessibility versus implicit encoding in network weights, the difference between a system tracking a fact and merely being able to regenerate it, and the epistemic status of outputs produced by contrastive or activation-steering methods as opposed to standard sampling.

  Then, present a menu of precise theses that "the model knows more than it says" could be expressing. For each reading, specify:
  - what kind of "knowing" is in play (e.g., justified true belief realised in internal representations, reliable tracking of world-states, functional availability for decision-making);
  - whose access is required for the knowledge to count (the model's own reasoning processes, an external interpreter applying steering techniques, a human inspecting weights);
  - whether the claim is trivial, substantive and defensible, false, or conceptually confused;
  - and whether that particular reading actually supports the speaker's inference that failed elicitation demonstrates absence of deceptive knowledge.

  Please write in formal British English. Do not include bibliographies, reading lists, or paper citations; I want the analysis to stand entirely on conceptual reasoning. Where you mention technical methods, describe them briefly in your own words rather than assuming familiarity with specific publications.
