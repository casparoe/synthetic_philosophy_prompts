prompt: |-
  I am a novelist, not a philosopher, and I keep noticing a structure in the way a certain kind of person changes his mind that I cannot name. I want to know whether it has an established name in decision theory or the philosophy of rationality, and whether it has been given a sharp definition; if it has not, I want a good working term and a precise account of its boundaries.

  Here is the clearest instance. A character — call him Merrick — spends most of his weeks in one frame of mind, valuing quiet, solitary work above everything. But in another frame, reliably triggered by company and praise, he values visibility and influence. Each frame is stable while it lasts, and in each frame his choices are resolute and, to himself, unforced. The crucial thing is that there are only two alternatives in play, and the reversal happens across time, not within a single comparison: at no moment does he prefer one while acknowledging the other as better. In the solitary frame he will pay a facilitator to move him out of a public commitment; in the sociable frame he will pay her to move him back into one. The facilitator never lies, never pressures, and is careful to offer each transaction only in the frame that will welcome it; she charges a modest fee each time. After enough cycles Merrick is back where he began, except for the fees, and when the whole sequence is displayed to him at once he can repudiate no single step as false to the self who took it — yet he can see that all the steps together transferred money to someone who produced nothing.

  A second instance: a writer alternates between a minimal, austere method and an expansive, collaborative one, and each conversion entails discarding one kind of equipment and buying back the other at a worse price. Again the reversals are regular, sincere while they last, and individually sensible. A friend who runs a used-goods business handles every exchange and loses nothing.

  I keep returning to this because it is neither fickleness nor indifference. It is not weakness of will as I understand it: no step feels like capitulation to something the agent disavows. It is not a change of belief, since nothing about the way the world seems is updated. It is not an epiphany, because the old frame always returns. Between frames, the same person can see the cycle at a distance and would even pay to make both kinds of exchange impossible — but within either frame he would resent the very binding he bought, and the facilitator knows this.

  My question has three parts. First, does this configuration — a changing but locally sincere agent whose predictable reversals can be harvested by a neutral third party, always at a net loss to the agent — have an established name, and how precisely has it been characterized? Second, which features are load-bearing? I suspect one can vary the trigger (emotional, social, mnemonic), the stakes (money, time, fidelity, equipment), and the third party's role, and I want to know what is essential to the pattern and what is incidental. Third, how does it differ from the nearby ideas of the weak-willed person, the inconstant or divided self, the person who changes their values after a genuine conversion, and the holder of seemingly inconsistent tastes? If the established term names something broader or narrower than my pattern, I would rather have the carving than the label.

  You are an expert on decision theory and the philosophy of rationality, with a secondary interest in how theories of agency surface in fiction. Please think carefully. Before settling on an answer, generate a shortlist of candidate terms, check each against the description above, and say explicitly where each candidate fits and where it fails. I will not be satisfied with a bare name; I need to know exactly what the phenomenon is, what it is not, and where its edges are.
reasoning: |-
  Okay, the user is a novelist who's observed a specific pattern of behavior in characters—like Merrick, who alternates between valuing solitude and sociability, each frame feeling authentic at the time. They want to know if this has a name in decision theory or philosophy, and if not, they need a precise term and definition. They also want to distinguish it from related concepts like weakness of will or genuine conversion. 

  First, I need to unpack their core concern: they're describing a cyclical, predictable shift in values that's locally sincere but globally exploitable. The key elements are: (1) multiple stable frames, each with coherent preferences; (2) no internal conflict during choices; (3) reversible shifts triggered predictably; (4) a neutral third party profiting from the reversals; (5) net loss to the agent when viewing the cycle holistically. 

  Now, brainstorming candidate terms from decision theory and philosophy: 

  - **Cyclical preferences**: Straightforward but misses the sincerity and exploitability. 
  - **Dynamic inconsistency**: Closer but usually tied to hyperbolic discounting in intertemporal choices (e.g., procrastination), whereas here the shifts aren't about time perception but contextual triggers. 
  - **State-dependent preferences**: Fits well—preferences change based on internal/external states—but it's broad (e.g., addicts valuing drugs differently when high vs. sober). Needs refinement to capture the cyclical exploitation. 
  - **Value instability**: Too vague; doesn't imply structure. 
  - **Multiple selves**: Metaphorical but risks implying separate agents, which isn't accurate here since Merrick doesn't disown past/future selves. 
  - **Preference reversals**: Common in behavioral econ (e.g., framing effects), but usually immediate, not cyclical across time. 
  - **Paternalism cases**: References the "money pump" scenario, which is perfect—it's exactly the thought experiment where an agent pays to reverse choices cyclically, losing resources. 

  Ah, **money pump** jumps out as the strongest fit. It's a formal argument against intransitive preferences, but here it manifests through cyclical *transitive* preferences that shift with frames. The user's examples mirror this: Merrick pays fees to flip states, net loss over cycles. The term is established and captures the exploitability. 

  But I must check nuances: 
  - **Weakness of will (akrasia)**: Unlike Merrick, akrasia involves acting against *current* judgment (e.g., "I shouldn't eat cake, but I do"). Here, no self-reproach; choices feel right in each frame. 
  - **Genuine conversion**: Permanent shifts, not cyclical. 
  - **Inconsistent tastes**: Might involve simultaneous conflicting desires (e.g., wanting diet and cake now), not sequential sincerity. 
  - **Divided self**: Implies ongoing conflict; Merrick has unified agency in each frame. 

  **Essential features**: 
  - Cyclical, predictable preference reversals. 
  - Local rationality (sincere in-frame choices). 
  - Exploitability via net loss. 
  - Framing triggers (not belief updates). 

  **Incidental elements**: 
  - Two frames (could be more). 
  - Third-party profiteer (could be self-exploitation). 
  - Material loss (could be emotional/opportunity costs). 

  **Proposed term**: **Cyclical Frame-Dependent Preferences with Money-Pump Vulnerability**. Emphasizes the structure (cyclical, frame-tied), the sincerity (preferences), and the exploitability (money-pump). 

  User's deeper need: They likely want to portray characters with believable, non-villainous flaws—rational yet self-sabotaging. The term should resonate literarily ("money pump" is vivid; "cyclical preferences" clearer but drier). They also crave precision to avoid conflating it with tropes like indecisiveness. 

  Final carve: This is distinct from akrasia (no guilt), caprice (predictable), or conversion (reversible). It's about context-triggered selves that don't learn from cycles. Sharp definition: "A pattern where an agent’s preferences cyclically and predictably reverse between discrete frames, each frame featuring locally consistent and sincere choices, rendering them vulnerable to exploitation through repeated preference reversals, resulting in net loss without external coercion or deception."
answer: |-
  Your described pattern—cyclical, frame-dependent preference reversals exploited by a neutral third party—is a recognized phenomenon in decision theory and philosophy, but **it lacks a single, universally accepted name**. After generating and testing candidate terms against your criteria, I propose **"Cyclical Frame-Dependent Preferences" (CFDP)** as a precise working term. Below, I address your three parts systematically, including a shortlist analysis and boundary definitions.

  ---

  ### **Part 1: Established Name, Characterization, and Proposed Term**  
  **Established Name Status**:  
  - No exact term exists, but it is a hybrid of *money-pump vulnerability* (exploitability) and *state-dependent preferences* (frame shifts).  
  - Closest established concepts:  
    - **Money Pump**: A thought experiment where an agent with intransitive preferences pays to cycle through choices, losing resources. *Fits* the exploitability and net loss. *Fails* because Merrick’s preferences are *transitive within each frame*—he never simultaneously prefers A > B and B > A.  
    - **State-Dependent Preferences**: Preferences change based on internal/external states (e.g., hunger, mood). *Fits* the trigger-driven frames and local sincerity. *Fails* by being too broad (e.g., it includes temporary states without cyclical exploitation).  
    - **Dynamic Inconsistency**: When future plans are abandoned as time passes. *Fits* the reversals. *Fails* because it typically involves time discounting (e.g., procrastination), not contextual triggers like praise.  
    - **Preference Reversals**: Documented in behavioral economics (e.g., choices flip under different frames). *Fits* the sincerity within frames. *Fails* by focusing on one-time lab experiments, not cyclical real-world exploitation.  
    - **Multiple Selves Models**: The agent is modeled as distinct "selves" with conflicting goals. *Fits* the frame stability. *Fails* by implying internal conflict or negotiation (absent here), and it’s often metaphorical.  

  **Proposed Term**: **Cyclical Frame-Dependent Preferences (CFDP)**.  
  **Sharp Definition**:  
  > *A pattern of agency where an agent exhibits two or more discrete, internally consistent preference orderings over the same set of alternatives, with reversals predictably triggered by contextual or internal cues. Each preference ordering is stable, sincerely endorsed, and action-guiding within its frame. Reversals incur costs, allowing a neutral third party to exploit the cycle for net gain, while the agent cannot repudiate any step when viewed in isolation.*

  **Characterization in Literature**:  
  - Closest match: McClennen’s work on **resolute choice** (where agents stick to plans) *contrasts* with CFDP, as Merrick abandons plans without regret.  
  - Nozick’s **utility pumps** reference exploitation but lack frame-dependent sincerity.  
  - Philosophers like Bratman discuss **temptation** but focus on regret, which CFDP avoids.  

  ---

  ### **Part 2: Load-Bearing vs. Variable Features**  
  #### **Essential Features (Load-Bearing)**  
  1. **Multiple Stable Frames**: At least two distinct, internally coherent sets of preferences (e.g., solitude vs. sociability).  
  2. **Local Sincerity**: No regret, akrasia, or self-deception within a frame. Choices feel resolute and authentic.  
  3. **Predictable Reversals**: Shifts are reliably triggered (e.g., praise, social context) and reversible.  
  4. **Exploitable Cyclicality**: Reversals create opportunities for a neutral party to profit from repeated transactions.  
  5. **Net Loss Under Reflection**: The agent recognizes the cycle as wasteful only when viewing it holistically.  

  #### **Variable Features (Incidental)**  
  - **Triggers**: Can be emotional (mood), social (praise), physiological (fatigue), or mnemonic (cues). Essential only if they *reliably* switch frames.  
  - **Stakes**: Money (fees), time, resources (equipment), or intangible costs (e.g., reputational). Loss must be quantifiable.  
  - **Third Party**: The "facilitator" can be external (your examples) or self-exploitation (e.g., Merrick paying fees to himself in a future frame). Neutrality is key—no coercion or deception.  
  - **Number of Frames/Alternatives**: Two frames/alternatives are simplest, but more are possible (e.g., three cycling preferences).  
  - **Reversal Mechanism**: Costs can be explicit (fees) or implicit (effort). What matters is irreversible resource loss per cycle.  

  ---

  ### **Part 3: Differences from Neighboring Concepts**  
  | Concept                | Key Difference from CFDP                                                                 | Why Merrick Isn’t This           |  
  |------------------------|------------------------------------------------------------------------------------------|----------------------------------|  
  | **Weakness of Will (Akrasia)** | Involves acting *against current judgment* (e.g., "I shouldn’t eat cake, but I do").        | Merrick *endorses* each choice in the moment; no self-reproach. |  
  | **Inconstant/Divided Self**   | Implies *ongoing conflict* or fragmentation (e.g., simultaneous warring desires).          | Merrick’s self is unified in each frame; no conflict during action. |  
  | **Genuine Conversion**        | Permanent preference shift (e.g., religious awakening).                                   | CFDP is cyclical; old frames return predictably. |  
  | **Seemingly Inconsistent Tastes** | Preferences *appear* contradictory but may be rational under meta-rules (e.g., situational ethics). | Merrick’s preferences *are* contradictory across frames; no higher-order unity. |  
  | **Capriciousness**             | Random, impulsive shifts without pattern or triggers.                                     | CFDP shifts are predictable and triggered. |  
  | **Paternalism Cases**          | Involves overriding choices "for the agent’s good" (e.g., tying oneself to a mast).       | Merrick *would* resent precommitment in-frame; exploitation is value-neutral. |  

  ---

  ### **Conclusion: The Carving of CFDP**  
  CFDP is a distinct phenomenon where an agent’s context-triggered frames create sincere but reversible preferences, enabling cyclical exploitation. It is **not** about irrationality per se but about *meta-instability*: the frames are rational locally but incoherent globally.  

  - **Boundaries**:  
    - **Lower Bound**: If the agent feels conflicted *during* a choice, it veers into akrasia.  
    - **Upper Bound**: If preferences stabilize permanently after reflection, it becomes a conversion.  
    - **Key Edge**: The agent’s ability to *see the cycle as wasteful only externally* (e.g., Merrick disliking the pattern but never during a frame).  

  **Why CFDP Works for Fiction**: It captures a tragicomic form of agency—characters are self-aware yet helpless, exploited without villains. The facilitator’s neutrality heightens the irony: the loss is purely systemic. For theory, CFDP bridges state-dependent preferences and money pumps but emphasizes *cyclical sincerity*.  

  If you adopt this term, clarify it as: *"Cyclical Frame-Dependent Preferences: When context rewires values, and the only winner is the ferryman."* This preserves precision while evoking its narrative weight.
