  ## Research Proposal: Architectural Integrity—Relocating Williams’ Objection Through Layered Moral Agency  

  **Title:** Constraint Satisfaction at the Source: Layered Agency as a Resolution to Williams’ Integrity Dilemma  

  ### 1. Problem Statement  
  Bernard Williams’ integrity objection argues that utilitarianism alienates agents from their deepest commitments by demanding that all values submit to global optimization (e.g., *Jim and the Indians*). His "one thought too many" critique further claims that explicit moral calculus corrupts intimate acts (e.g., saving a spouse). Both critiques presuppose a **unitary agent architecture**: a single-threaded self where all commitments are transparent, commensurable, and subject to top-down optimization. This project investigates whether these objections hold if moral agency is architecturally **layered**, with certain commitments operating as non-negotiable source constraints that *pre-structure* practical reasoning rather than entering as optimizable inputs.  

  ### 2. Working Hypothesis  
  Williams’ critiques misfire because they target utilitarianism *applied to the wrong architectural layer*. Utilitarianism fails not in principle, but when its optimizing logic is misapplied to a layer containing **source constraints** (e.g., spousal loyalty, core identity projects). These constraints function as hard boundaries for feasible action-spaces—akin to a system’s firmware—not as preferences to be traded off. By modeling agency as a multi-tiered constraint-satisfaction system, we:  
  - **Relocate** the integrity objection: Utilitarianism remains valid *within* delimited problem-spaces but is incoherent when attempting to override source constraints.  
  - **Dissolve** the "one thought too many" problem: Intimate acts flow from sub-reflective layers; forcing them into explicit optimization violates architectural boundaries.  

  ### 3. Why Standard Responses Fail  
  Existing defenses of utilitarianism do not engage this structural possibility:  
  - **Flexible utilitarianism** (e.g., including "ground projects" in utility functions) collapses source constraints into optimizable preferences, negating their non-negotiable status.  
  - **Indirect utilitarianism** (rules/dispositions as efficiency proxies) preserves alienation by still treating commitments as *instrumental* to global utility. Both approaches retain the unitary model, treating the agent as a monolithic optimization engine.  

  ### 4. Method: Conceptual Engineering  
  A non-empirical, constraint-satisfaction approach:  
  1. **Deconstruct Williams’ arguments** to isolate the implicit unitary-agent assumption.  
  2. **Formalize a layered agency model**:  
     - **Layer 0 (Source Constraints)**: Non-negotiable commitments defining identity (e.g., "I am X’s spouse"). Output: action-space boundaries.  
     - **Layer 1 (Reflective Optimization)**: Utilitarian calculus *within* boundaries set by Layer 0.  
  3. **Test against Williams’ cases**:  
     - *Jim and the Indians*: Killing one Indian violates Layer 0 (core prohibition against murder) → No feasible action-space for optimization.  
     - *Spouse rescue*: Saving one’s spouse operates at Layer 0; utilitarian justification belongs to Layer 1 → A "second thought" is a category error.  

  ### 5. Success Criteria  
  - **Positive Result**:  
    - A **taxonomy of moral demands** classified by layer compatibility:  
      - *Layer-0-immune demands*: Survive filtering (e.g., intimate duties).  
      - *Layer-1-apt demands*: Subject to optimization (e.g., charitable giving allocations).  
    - Demonstration that Williams’ objections only threaten misapplied utilitarianism.  
  - **Failure Condition**:  
    - If the layered model reduces to indirect utilitarianism (e.g., Layer 0 justified *by* Layer-1 utility).  
    - If source constraints cannot be rigorously distinguished from strong preferences.  

  ### 6. Scope Assessment (6-Week Project)  
  **Feasible Deliverables**:  
  - Formal articulation of layered agency as a constraint-satisfaction topology.  
  - Layer-compatibility taxonomy applied to Williams’ key cases.  
  - Clear relocation of the integrity objection away from utilitarianism’s core logic.  
  **Limitations**:  
  - No empirical validation; model remains conceptual.  
  - Taxonomy limited to paradigmatic examples (intimacy/core prohibitions).  
  - No resolution of source-constraint conflicts (e.g., spouse vs. child).  
  **Risk**: Formalizing "non-negotiable" without mystical baggage may prove elusive.  

  ---  
  **Tone & Style Compliance**: Mechanistic (e.g., "firmware," "constraint-satisfaction topology"), anti-vagueness (explicit layer definitions), utility-agnostic (focus on architectural placement over moral truth).
