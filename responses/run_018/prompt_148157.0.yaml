prompt: |-
  I'm attempting to pinpoint the precise locus of disagreement between myself and a colleague regarding inheritance taxation. I maintain that the most compelling philosophical justification for substantial inheritance taxes is not luck-egalitarian — that is, not grounded in the unfairness of unearned advantage — nor purely consequentialist, but rather what I shall term a 'threshold-domination' thesis: that once dynastic wealth exceeds a certain concentration, economic disparity transforms into a form of social domination that renders democratic equality of status largely performative. My credence that this thesis provides the decisive normative foundation is approximately 0.60; my colleague assigns it roughly 0.30. Provide your own credence, but more importantly decompose the underlying philosophical question into its constituent parts: (i) whether a coherent, non-arbitrary threshold exists at which wealth concentration becomes domination rather than mere inequality; (ii) whether democratic equality of status genuinely requires the absence of such economic domination, or whether formal political rights suffice; (iii) whether inheritance taxation is the appropriate remedy, or whether it simply displaces domination into other channels, such as unequal access to human capital; and (iv) whether luck-egalitarian or efficiency-based considerations can fully accommodate the normative force of the domination claim without residual loss. For each sub-question, assign a rough probability, indicate how they combine to yield your overall figure, and state which component your final number is most sensitive to. Conclude by identifying the specific argument or empirical finding that would most substantially revise your credence.

  Please organise your response in the following sections, in this order:

  The claim stated precisely (approximately 60 words)
  Your overall credence (approximately 30 words)
  Sub-question decomposition with assigned probabilities (approximately 300 words)
  Combination logic (approximately 150 words)
  Sensitivity analysis (approximately 100 words)
  What would shift your view (approximately 100 words)
