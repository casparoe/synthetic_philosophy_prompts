  I notice their intuition tracks whether a normative standard exists externally. Where experts/deference chains exist (cases 1-3), reference aligns with the standard; where they don't (cases 4, 5 local meaning), it defaults to local use. The lone inventor case is tricky because there's no community to establish a standard—hence their flip-flopping. 

  For the roommate: "water" likely means H₂O because she's embedded in a linguistic community with that standard, even if misapplied. For AI: since it derives meaning from human training data (a deference chain), "water" refers to H₂O. 

  The unifying principle? Reference depends on whether the speaker is embedded in a practice with normative standards (experts, wider community). If yes, deference rules; if no, local causal history wins. This resolves their inconsistency: cases 3/4 differ precisely because one has deference chains and the other doesn't.
answer: |-
  Here's a unifying principle capturing your intuitions: **Reference is fixed by the dominant causal-historical chain anchoring the term in the speaker's linguistic community, prioritizing deference to established standards when available.**

  1.  **Cases Explained:**  
      *   **1 & 2 (Twin Earth, Polymer):** Causal chain dominates (contact with H2O/XYZ/polymer).  
      *   **3 (Dead Expert):** Deference to the established expert standard (Linnaeus's taxonomy) overrides local error.  
      *   **4 (Isolated Town):** No external standard exists; local causal chain (contact with pines) fixes reference.  
      *   **5 (Lone Inventor):** Flip-flop because *no community or standard exists*. Your "intended concept" reflects descriptivism/internalism; "actual sample" reflects pure causal-historical externalism.  
      *   **6 (Roommate):** "Water" means H₂O. She defers to the community standard; her misapplication and belief don't change the reference fixed by that chain.

  2.  **AI Case:**  
      An AI trained on human text uses "water" with the reference fixed by *our* dominant causal-historical chain (deferring to *our* linguistic practices). It means H₂O (or XYZ on Twin Earth, etc.), not whatever concept the AI internally associates, because it's embedded in *our* language game via training data. The AI's lack of direct contact is irrelevant; its use inherits the community's reference through deference.
