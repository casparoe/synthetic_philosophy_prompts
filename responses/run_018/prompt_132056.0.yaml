prompt: |-
  i'm in my phil of language course and we're covering semantic exernalism and twin earth type stuff. i'm trying to map my own gut verdicts on reference to see if there's an actual principle behind them, or if i'm just being inconsistent. here's where i stand:

  1. standard twin earth: Oscar on earth means H2O with "water"; Twin Oscar means XYZ. clearly different contents.

  2. polymer planet: locals drink a synthetic "poly-water" that acts like H2O but chemically isn't, and they almost never see the real ocean. if they say "water is vital," i think they refer to the polymer, since that's the stuff in their causal chain.

  3. dead expert case: a 19th-century botanist calls beech trees "elms" but he defers to Linnaeus's taxonomy, which he misread. i think his word still refers to elm (the expert's category), not beech, despite his samples.

  4. isolated town: a small community has only pine trees they call "oak," with no botanist or expert chain at all. here i think "oak" refers to that pine species, not real oak — there's nothing pulling it back to the correct kind.

  5. lone inventor: one guy discovers pyrite, thinks it's gold, names it "flurg," and never interacts with anyone. part of me says "flurg" means gold (his intended concept), part says pyrite (the actual sample). i flip-flop on this one constantly.

  6. roommate case: she calls her bottled drink "water" but it's carbonated seltzer; she genuinely believes it's H2O with bubbles. does she mean H2O or seltzer?

  my problem is 3 and 4 seem to pull opposite directions — expert chain vs local sample. is there one principle that captures all six, or do i have to drop one? what does it predict for an AI that uses "water" in text but has never touched liquid? keep it tight — max 250 words, two paragraphs max. and please no bibliography or reading list, i can't access the library right now and my wifi is spotty.
