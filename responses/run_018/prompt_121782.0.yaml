  The clinical ethics observation about arbitrary factors (treatment initiation status, machine default settings) is brilliant—it exposes how moral intuitions might rely on ethically irrelevant details. The Locked Baseline View adds depth by challenging temporal framing of agency.  

  For the crux, I'll focus on the tension between causal and normative accounts because:  
  - It directly engages the arbitrariness concern (why should wiring direction matter?)  
  - Forces candidates to define what the distinction should track rather than just describe it  
  - Makes Locked Baseline View relevant but contestable  

  The question must block escapes:  
  - Ban appeals to intention/doctrine of double effect (red herring here)  
  - Require positive criterion defense  
  - Specify "in this context" to prevent generic answers  

  Model answer strategy:  
  1. Propose a normative control criterion—distinction rests on whether agent exercises decisive authority over harm's occurrence  
  2. Test against cases:  
     - Standing Order variants show causal authorship ≠ moral distinction  
     - Extubation highlights arbitrariness of intervention timing  
     - Screening reveals outcome/risk tension  
  3. Reject Locked Baseline for decoupling present agency from moral responsibility  
  4. Argue distinction tracks legitimate expectations about who "governs" the threat  

  Marking scheme priorities:  
  - Must-hit: explicit criterion + case application + Locked Baseline engagement + positive proposal + objection response  
  - Grade boundaries: A answers integrate steps; Bs miss connections; Cs remain descriptive  

  Adjustment note: tightened model answer's screening case analysis to hit "outcome/risk tension" point explicitly per marking scheme.  

  This should create the desired spread: weak students will still describe cases; strong ones will reveal themselves by showing why some factors feel arbitrary but aren't—or why they are.
answer: |-
  ### Exam Question: Philosophy of Agency & Morality  
  **Time Allowed:** 90 minutes  
  **Closed Book**  
  **Answer ONE Question**  

  **Question 1:**  
  Clinical ethics reveals puzzling asymmetries: whether withdrawing treatment counts as "killing" or "letting die" may depend on whether intervention *had already begun*; whether diverting funds constitutes "doing harm" may turn on whether we focus on *individual risk* or *aggregate outcomes*. Using **only** the cases below, defend a criterion for distinguishing "doing harm" from "merely allowing harm." Test your criterion against *paired variations* to show whether morally arbitrary factors (e.g., prior choices, mechanical defaults) affect the distinction. Finally, evaluate the *Locked Baseline View* (LBV): does grounding the distinction in "the last unforced choice" resolve these puzzles or make the distinction hostage to history? Conclude by stating what the distinction *must* track to justify its moral weight.  

  > **Cases** (Modify *only one factor* in each pair):  
  > **A1.** *Standing Order (Default)*: A lethal dosing flag is mis-entered by Nurse N. She sees the override alert and does nothing.  
  > **A2.** *Standing Order (Colleague)*: The flag is entered by a colleague. N sees the alert and does nothing.  
  > **B1.** *Extubation (Withdrawing)*: A clinician removes a ventilator from a terminal patient who dies immediately. Ventilation began 2 hours prior.  
  > **B2.** *Extubation (Never Starting)*: The clinician never connects an identical patient to the ventilator. The patient dies identically.  
  > **C1.** *Screening (Omission)*: Administrator cancels a new screening program, leaving a 2% mortality risk.  
  > **C2.** *Screening (Commission)*: Administrator diverts funds from an *existing* program, raising mortality from 2% to 2.1%.  

  **Constraints:**  
  - You *may not* appeal to intentions, the doctrine of double effect, or consequentialism vs. deontology.  
  - You *must* state whether your criterion implies N "kills" or "lets die" in A1/A2.  
  - Address whether LBV successfully exonerates N in A1/A2.  

  ---

  ### Model Answer (Strong Student, 850 words)  
  The moral distinction between "doing harm" and "allowing harm" hinges not on physical causality but on **normative control**: whether the agent *exercises decisive authority* over whether a threat materializes. An agent "does harm" when they initiate or sustain a lethal sequence that would not progress without their ongoing agency (e.g., actively injecting poison). They "allow harm" when they decline to disrupt a pre-existing lethal sequence they did not mandate. This explains why arbitrary factors *appear* relevant but need not be: they signal shifts in normative control, not moral weight.  

  Apply this to **Standing Order**. In A1 (N entered the flag), N *kills* the patient. By creating the lethal order, she imposes a new threat contingent on *her* non-intervention. Her override is not a rescue but a revocation of her own lethal directive—failing to revoke sustains her authorship. In A2 (colleague entered), N *lets die*. The threat originates outside her agency; her inaction leaves a pre-existing condition unaltered. The Locked Baseline View (LBV) correctly identifies the flag-setter as central but errs in absolving N in A1. LBV claims the distinction is "locked" at the last unforced choice (here, flag entry), making N’s inaction irrelevant. But if N *herself* created the threat, her ongoing refusal to cancel it constitutes re-authorization. LBV’s historical fixation ignores present normative responsibility: an arsonist who ignores a fire alarm isn’t "allowing" the blaze.  

  **Extubation** tests whether intervention-timing affects normative control. In B1 (withdrawing), the clinician *lets die*. Ventilation suspended the patient’s underlying fatal condition; removing it restores the pre-existing lethal trajectory the clinician did not create. They cease sustaining an artificial state, yielding to inevitability. In B2 (never starting), the clinician identically *lets die*: non-intervention leaves the same fatal sequence untouched. Mechanical differences (e.g., "wired to run until stopped") are morally inert; what matters is that the clinician never *imposed* the threat. LBV might assign "doing harm" to whoever first decided against ventilation, but this conflates creation with omission—a hospital’s funding choice decades ago shouldn’t dictate today’s clinician’s moral category.  

  **Screening** exposes whether outcome-aggregation or individual risk defines "doing." In C1 (canceling new program), the administrator *lets die*: they preserve the status quo, refusing to reduce a pre-existing risk. In C2 (diverting funds), they *do harm*. By actively destabilizing an existing safeguard, they *generate* a new threat—mortality rises from 2% to 2.1% *because* of their reallocation. LBV might trace this to budget-setting, but this ignores proximate control: the administrator *exercised* authority to degrade protection, whereas in C1 they merely declined to enhance it.  

  The distinction must track **whether the agent’s conduct renders them the *governor* of the threat** to justify moral weight. "Doing harm" implies usurping control over life/death; "allowing" acknowledges external forces. This captures why we blame poisoners (governors of toxicity) but not passersby who ignore strangers drowning (non-governors). Arbitrary factors (e.g., treatment initiation) often correlate with governance shifts but aren’t essential.  

  *Objection*: Normative control is circular. If "governance" depends on duties, doesn’t this conflate the doing/allowing distinction (descriptive) with wrongfulness (normative)?  
  *Reply*: The distinction is inherently normative but not reducible to wrongfulness. Governance asks: *relative to baseline*, did the agent’s conduct make them the decisive arbiter of harm? In A1, N’s conduct makes her the arbiter; in A2, she isn’t. Duties (e.g., medical roles) can intensify blame for "allowing," but don’t redefine the act itself.  

  LBV fails by severing the distinction from present agency. History matters only if it shapes current normative control—but in A1, N’s past act *extends* into her present obligation to cancel. Where no such continuity exists (e.g., a machine’s default from 1980), governance lies with those who now accept or reject the status quo. Thus, the distinction tracks moral responsibility for *imposing* versus *acquiescing*—and only when grounded thus can it bear its intended weight.  

  ---

  ### Marking Scheme (20 points total)  
  **1. Clear Criterion (4 points)**  
  - **A (4)**: Explicit, non-circular standard (e.g., "normative control," "governance of threat").  
  - **B (2)**: Vague or derivative criterion (e.g., "intervention vs. non-intervention").  
  - **C (1)**: Restates intuitions without criterion.  
  *Common error: "Doing harm = causing death physically."*  

  **2. Case Application (4 points)**  
  - **A (4)**: Uses *all three pairs* to test criterion, showing why variations do/don’t alter the distinction.  
  - **B (2)**: Addresses cases but misses contrasts (e.g., ignores A1 vs. A2).  
  - **C (1)**: Describes cases without applying criterion.  
  *Common error: Treats Extubation timing as inherently decisive.*  

  **3. Locked Baseline Evaluation (4 points)**  
  - **A (4)**: Engages LBV as a *solution*, rejects it for decoupling history/present agency (e.g., "N re-authorizes threat in A1").  
  - **B (2)**: Labels LBV "arbitrary" without argument.  
  - **C (1)**: Ignores LBV or misstates it.  
  *Common error: "LBV is wrong because nurses have duties."*  

  **4. Positive Proposal (4 points)**  
  - **A (4)**: States what distinction *must* track (e.g., "authorship of lethal sequence," "victim’s claim over agent’s agency") and why it justifies moral weight.  
  - **B (2)**: Identifies a feature (e.g., "causality") without moral defense.  
  - **C (1)**: Asserts moral significance without argument.  
  *Common error: "It tracks whether the agent is responsible."*  

  **5. Objection Handling (4 points)**  
  - **A (4)**: Anticipates and rebuts one serious flaw (e.g., circularity, conflating act/wrongfulness).  
  - **B (2)**: Names objection without rebuttal.  
  - **C (1)**: No objection addressed.  
  *Common error: "Consequentialists disagree, but they’re wrong."*  

  **Consistency Check**: The model answer hits all A-grades:  
  - Criterion: "Normative control" (¶1).  
  - Cases: Tests all pairs (¶2–4).  
  - LBV: Rejects via re-authorization (¶2).  
  - Proposal: "Governance of threat" (¶5).  
  - Objection: Replies to circularity (¶6).  

  Adjustments were made to Screening analysis (C2 now emphasizes "generating new threat") to ensure alignment with "must track" in marking scheme point 4.  

  This question forces candidates to *build* a distinction, not summarize one—and the marking scheme rewards integrated reasoning, not isolated insights.
