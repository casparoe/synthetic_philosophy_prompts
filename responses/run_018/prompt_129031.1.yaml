prompt: |-
  I’m putting together prompts for a metaphysics seminar I run — about 12 grad students, one 90-minute session, and we’re deep in modal realism right now. I’m tired of the same old “Sam is a surgeon in W1 and a musician in W2” examples that everyone has seen in every intro text since like 1986, so I want an in-class game that makes them actually feel the pull between counterpart theory and transworld identity, not just hear me explain it afterwards. The idea should emerge from what they do with the cards and the votes, not from my debrief lecture.

  Here’s the specific framing I want to inject, and I need you to build the activity around it: instead of asking whether one person exists across worlds, I want them to wrestle with multi-dimensional counterpart relations — the idea that similarity can be weighted differently along different axes (origin story, career path, moral character, institutional role) and that there might not be one unique counterpart in another world, but several competing ones depending on what you care about. So the game should force them to adjudicate real stakes — awarding a single lifetime prize, assigning blame for harm caused in another world, honoring a promise — where different weightings of similarity yield different answers about who counts as “the same” or “the counterpart.” Design the rules, materials, roles, and a payoff scheme that uses reputation points rather than real money. Include a timeline, the debrief that maps specific moments onto parts of the theory, and an honest note on what feature of counterpart theory this can’t reproduce (probably the ontological commitment to world-bound individuals?) that I’ll have to supply myself. Also tell me what will predictably go wrong the first time — like if everyone fixates on origin and ignores the moral-character axis, or if the transworld-identity defenders just dig in and refuse to split cases. Please don’t ask for a bibliography or reading list; half the group doesn’t have libary access this week anyway, and I want something they can run without looking anything up.

  One more thing: if my framing of multi-dimensional counterpart relations is confused — like if I’m mixing up Lewis’s context-sensitive counterpart relations with something that doesn’t actually exist in the literature, or if the activity as designed can’t genuinely make people feel the theoretical tension — tell me straight instead of politely going along with it. I’d rather have the pushback than a mess that sounds nice but falls apart in the room.
reasoning: |-
  Okay, let me start by understanding the user's request. They're a metaphysics seminar instructor for grad students, focusing on modal realism. They want an in-class game to help students experience the tension between counterpart theory and transworld identity through multi-dimensional counterpart relations. The key is to avoid overused examples and instead create an activity where students feel the pull by making decisions based on different similarity axes.

  First, I need to unpack the core concept they mentioned: multi-dimensional counterpart relations. The user wants students to see that similarity can be weighted differently across various axes—like origin, career, morals, institutional roles. This means that depending on what aspect you prioritize, different counterparts might be identified in another world. The challenge is to design an activity where these weightings lead to conflicting decisions in scenarios with real stakes, such as awarding a prize or assigning blame.

  The user emphasized that the theory should emerge from the activity, not from a lecture. So the game needs structured interactions where students debate and vote based on the axes. They also mentioned using reputation points instead of real money, which suggests a competitive but low-stakes scoring system to encourage engagement.

  I recall Lewis's counterpart theory involves context-dependent similarity metrics. The user is concerned they might be conflating this with something not in the literature. But Lewis does allow for different counterpart relations based on varying similarity weightings. So the framing seems solid. The activity must highlight how different contexts (like promising vs. blame) shift the relevant axes, leading to different counterpart identifications.

  Now, for the game structure. Each student should have a character card with attributes across the four axes. Then, scenario cards present dilemmas requiring them to choose a counterpart. Splitting into small groups ensures everyone participates. Voting forces them to justify their choices, revealing how axes are weighted differently. Reputation points incentivize persuasion and alignment with the group's decision.

  Potential pitfalls: Students might fixate on one axis, like origin, ignoring others. To counter this, the scenarios should be designed so that different axes are relevant to different dilemmas. Also, transworld identity defenders might resist splitting cases. Including scenarios where transworld identity leads to contradictions could highlight its limitations. The debrief should explicitly connect these moments to the theory.

  Materials needed: Character cards with varied profiles, scenario cards with clear stakes, tokens for voting. Timing: Intro (10 min), gameplay (60 min), debrief (20 min). The debrief should map game experiences to theoretical concepts, like how shifting axes in different contexts mirrors counterpart relations' contextual nature.

  What the activity can't capture: The ontological commitment to world-bound individuals. The game treats counterparts as existing in the same world, which isn't accurate to counterpart theory. The instructor will need to clarify this afterward.

  Predictable issues: Groups might not engage equally, or debates could stall. Clear rules and time limits per round can help. Also, preparing backup scenarios ensures flexibility.

  Overall, the goal is to make the theoretical tension tangible through experiential learning. The user's framing is sound, and the activity should effectively illustrate the multidimensionality of counterpart relations while prompting critical discussion.
answer: |-
  Here’s a designed activity ("Counterpoint Conundrum") that forces engagement with multi-dimensional counterpart relations through high-stakes decisions, with built-in friction between axes. It deliberately avoids transworld identity as a default, making its appeal emerge *only* if students impose it.

  **Core Idea:** Students act as "Multiversal Arbiters" deciding cases where identifying "the same person" across worlds has tangible consequences. Each case requires weighting different similarity axes, revealing conflicts.

  **Materials:**
  1.  **Character Cards (1 per student):** Index cards with a unique name & 4 scores (1-10) for:
      *   **Origin Story (O):** Family background, upbringing, formative events.
      *   **Career Path (C):** Profession, skills, achievements.
      *   **Moral Character (M):** Ethical principles, typical choices, virtues/vices.
      *   **Institutional Role (I):** Position in society, affiliations, responsibilities.
      *   *Example Card:* "Cassia Vale | O:8 (Refugee scholar) | C:6 (Mid-level diplomat) | M:4 (Pragmatic, sometimes ruthless) | I:9 (UN Crisis Envoy)"
  2.  **Scenario Cards (6-8 pre-written):** Dilemmas demanding a single counterpart choice. Each highlights a *stake* and implies relevant axes:
      *   *Stake: Honor a Promise made in W1.* "Promisor Prime (W1) swore to fund *only* the research of their childhood rival-turned-collaborator, Dr. Elara Vex. Award the grant in W2 to..."
      *   *Stake: Assign Blame for a disastrous decision in W1.* "The W1 'Harmonizer' caused ecological collapse through negligence. Hold *one* person accountable in W2..."
      *   *Stake: Award a unique "Lifetime Legacy Prize" based on W1 achievements.* "The W1 'Pioneer Prize' was earned by overcoming extreme poverty to revolutionize tech. Bestow it in W2 upon..."
      *   *Stake: Choose the "True Successor" to a W1 leader.* "The W1 'Guardian of the Archive' protected sacred knowledge. Identify their rightful heir in W2..."
      *   *Stake: Authorize Medical Intervention based on W1 consent.* "Patient Prime (W1) consented to an experimental, high-risk neural procedure. Who in W2 validly holds their proxy consent?"
  3.  **Voting Tokens:** Small, distinct tokens (coins, buttons, beads) - one type per student.
  4.  **Reputation Trackers:** Simple paper grid or shared doc to track points.

  **Roles:**
  *   **Arbiters (All Students):** Hold a Character Card. Argue for counterparts, vote on cases.
  *   **Moderator (You):** Introduce scenarios, enforce time, tally votes, award points. *Crucially:* DO NOT define "same" or "counterpart." Just present the dilemma and the need to pick one.

  **Rules & Gameplay (60 mins):**
  1.  **Setup (5 mins):** Distribute Character Cards randomly. Explain axes briefly (O, C, M, I). Introduce "Reputation Points" (RP): awarded for winning votes and persuasive arguments recognized by peers. Starting RP: 0.
  2.  **Presentation (Per Scenario, ~8 mins each x 5-6 scenarios):**
      *   Moderator reads Scenario Card aloud, emphasizing the **stake**.
      *   Arbiters examine their Character Card and others'. They have 3 mins to:
          *   **Argue:** Verbally advocate for *which character in the room* (including possibly themselves) is the "correct" counterpart for this specific stake, justifying *which axes matter most and why*, referencing the scores. ("For honoring the promise, Origin (O:8) and shared rivalry within Institutional Role (I:7) matter most, not Career! Cassia fits best.")
          *   **Counter-Argue:** Challenge others' weightings or propose different axes. ("But the promise was about *research integrity*! Moral Character (M) is paramount here, Cassia's M:4 is too low!")
      *   **Vote (1 min):** Secret ballot using tokens. Each Arbiter votes for *one* character (can vote for themselves). Moderator collects tokens.
      *   **Resolution (2 mins):** Moderator announces winner (character with most votes).
          *   **Winning Voters:** Each gains **2 RP**. They *all* backed the winner.
          *   **Winning Character:** Gains **1 RP** (regardless of who voted for them). *This rewards being deemed "the counterpart" even passively.*
          *   **Most Persuasive Argument:** The group quickly nominates *one* player (not necessarily the winner) who made the strongest *reasoning* (based on axes/weighting). That player gains **1 RP**. *This incentivizes engaging with the axes.*
  3.  **Scoring Transparency:** Keep RP visible (whiteboard/doc).

  **The Payoff: Tension Emergence**
  *   **Stakes Force Choice:** You *must* pick one person for the prize/blame/promise. Abstaining isn't an option. This forces a decision based *only* on available profiles and the scenario's demands.
  *   **RP Incentivizes Axes:** Winning requires convincing others your weighting (e.g., "For blame, Moral Character matters WAY more than Career!") is correct for *this context*. RP for "persuasive argument" directly rewards axis-justification.
  *   **Multi-Dimensional Conflict:** Characters will have mismatched profiles (e.g., High O/Low M, High C/Low I). Scenarios will pull in different directions (Promise => O/I; Blame => M; Prize => O/C; Succession => I/M). Students will *feel* the conflict: "But if I pick based on Origin for the prize, I have to ignore their terrible Morals, which feels wrong for the Blame case later!"
  *   **Counterpoint vs. Identity:** The *lack* of a "correct" answer based on simple identity becomes palpable. If someone insists "But it's *just* Cassia!", others will demand: "Based on *what*? Her Origin fits the promise, but her Morals disqualify her for the blame! We HAVE to choose differently per case!" The RP system rewards *contextual* decisions.

  **Debrief Mapping (20 mins - NO LECTURE, GUIDE DISCUSSION):**
  *   **Start with Experience:** "What frustrated you? When did choosing feel impossible? When did your reasoning shift drastically between scenarios?"
  *   **Map to Theory:**
      *   "When you argued *why* Origin mattered more than Career for the Promise case, you were defining a **counterpart relation weighted towards O and I**. When you prioritized Morals for Blame, you defined a **different relation weighted towards M**." (Link to Lewis's context-sensitivity).
      *   "Did anyone feel forced to pick *different* people as 'the counterpart' for Cassia across different scenarios? That's **multiple counterparts based on different similarity metrics**." (Contrast with unique transworld identity).
      *   "When you voted for someone because they had the *highest score on the axis you deemed key*, you were using **similarity along a privileged dimension**."
      *   "The RP for 'persuasive argument' rewarded convincing others of your **contextual weighting of axes**."
      *   "The frustration of 'splitting' Cassia into different counterparts for different purposes? That's the **pull of transworld identity** trying to insist on a unified core. Did the game make that feel *unsatisfying*? Why?"
  *   **Key Insight:** "The game forced you to see that 'who counts as the same person' isn't just a fact about the worlds, but depends on *what we care about in the specific context* (honoring a promise vs. assigning blame). Counterpart theory captures this context-dependence; strict transworld identity struggles with it."

  **Honest Limitation (For You to Explain):**
  *   **The Ontological Cheat:** The game fundamentally **violates world-bound individuals**. All characters exist in the same "room" (world). Students are comparing *actual* individuals within *one* world, not counterparts across distinct concrete worlds. This misses Lewis's core ontology.
  *   **Why it's (Mostly) Okay:** The point is the *relational structure* – the context-dependent weighting of similarities for making judgments. The tension felt between different weightings for different purposes is the key experiential takeaway. You must explicitly state: "Remember, in genuine Lewisian modal realism, these individuals are *world-bound*. Today, we cheated to put them in one room so you could *feel* the process of defining counterpart relations contextually. The core tension you felt about weighting axes would apply when comparing an individual in W1 to distinct, isolated individuals in W2."

  **Predictable Problems & Mitigations:**
  1.  **Axis Fixation (e.g., always Origin):**
      *   *Why:* Origin feels fundamental. Early scenarios might accidentally favor it.
      *   *Fix:* **Design scenarios pulling hard against Origin.** Blame scenario where high-O character has low-M; Succession where high-O character lacks institutional role (I). Force the conflict. As Moderator, gently highlight ignored axes during arguments: "Interesting, no one mentioned Moral Character yet for this Blame case..."
  2.  **Transworld Identity Dig-In:**
      *   *Why:* Intuitive pull is strong. Some might refuse contextual splits.
      *   *Fix:* **RP is the weapon.** If they always vote for the "same" person regardless of scenario/stakes, they will *lose* RP when the group votes differently. Losing points makes the intuitive position *costly*. The "Persuasive Argument" RP also rewards those who engage with the axes contextually.
  3.  **Analysis Paralysis / Shy Arguers:**
      *   *Why:* Grad students overthink or hesitate.
      *   *Fix:* **Strict timers.** Enforce the 3-min argument phase. Encourage brief, punchy justifications ("O and I! Promise demands shared history and role!"). The secret ballot protects quieter students.
  4.  **"Gaming" the System (voting for friends/self):**
      *   *Why:* RP incentivizes winning.
      *   *Fix:* **Structure mitigates it.** Voting for yourself/friend only gets you points *if* you win the vote. Winning requires convincing *others*. The "Persuasive Argument" RP also rewards good reasoning, not just winning. The stakes (prize/blame) add moral weight discouraging pure cynicism.
  5.  **Uneven Engagement:**
      *   *Why:* Some scenarios resonate more.
      *   *Fix:* **Have extra scenarios.** Be ready to skip one if energy dips. Keep the pace brisk.

  **Why This Frames Your Intent Correctly:**
  Your framing is spot-on and central to contemporary discussions of counterpart theory (even beyond Lewis's original). The activity forces students to:
  1.  **Operationalize Multi-Dimensional Similarity:** They must literally use and weight O, C, M, I scores.
  2.  **Experience Context-Dependence:** Different stakes (promise, blame, prize) *demand* different weightings to reach a decision.
  3.  **Confront Non-Uniqueness:** The voting often won't be unanimous; there are frequently multiple plausible counterparts depending on weighting. Winning requires building a coalition around *one* weighting.
  4.  **Feel the Tension:** The RP system and the high-stakes scenarios make the choice matter, making the conflict between different possible counterpart relations viscerally frustrating or illuminating. The pull of transworld identity emerges as a *reaction against* this contextual splitting.

  This will generate the messy, engaged debate you want, grounded in the multi-dimensionality you identified. The ontological limitation is unavoidable for an in-room exercise but serves as a perfect bridge to your clarification lecture. Good luck! Prepare for lively chaos.
