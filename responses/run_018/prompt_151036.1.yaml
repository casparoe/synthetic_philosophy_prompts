answer: |-
  Okay, here's the kettle scenario, brewing pure logical frustration:

  **You:** (Reaching for the kettle switch) Right, cuppa time.
  **Tortoise:** (Suddenly perched precariously on the kettle spout) Hold it! Justify that action, logically.
  **You:** Uh... Flipping the switch turns the kettle on.
  **Tortoise:** Granting that. Premise One: "If I flip the switch, the kettle turns on." But where's the justification *linking* that premise to your *actual action*? You haven't stated "I *am* flipping the switch" as a premise *combined* with the first premise to *derive* "kettle turns on". Write it down properly!
  **You:** (Sighing, scribbles on a notepad)
      *   Premise 1: If I flip the switch, the kettle turns on.
      *   Premise 2: I am flipping the switch.
      *   Therefore: The kettle turns on.
  **Tortoise:** Excellent! But... *why* does having Premise 1 *and* Premise 2 written down *compel* the conclusion "kettle turns on"? You need a *rule* that says if you have "If A, then B" and you have "A", then you must get "B". Write *that* down as Premise 3!
  **You:** (Grumbling) Fine! Premise 3: If Premise 1 AND Premise 2 are true, THEN the kettle turns on. *Now* can I boil the—
  **Tortoise:** Not so fast! Admirable effort! But Premise 3 is just... sitting there. *Why* does writing down "If Premise 1 AND Premise 2 are true, THEN the kettle turns on" *actually force* you to accept the conclusion? You need a *new* rule, Premise 4, that says if you have Premise 1, Premise 2, *and* Premise 3, *then* you must get "kettle turns on".
  **You:** (Eyes wide, kettle stone cold) But... that *is* the rule! That's what Premise 3 *is*! It *is* the rule for using the other premises!
  **Tortoise:** Precisely! And now you need a rule *for using that rule*. Premise 4: If you have Premise 1, Premise 2, Premise 3, *and* the rule that having those premises implies the conclusion... well... you see the pattern. Until you write down the rule that lets you *apply the rule you just wrote down to justify applying the previous rule*... and then the rule for *that*... the kettle stays off. Logically impeccable, wouldn't you agree?
  **You:** (Stares at the notepad filling with increasingly meta-premises, then at the cold kettle, then at the smug Tortoise) ...I'm going out for coffee. Black. No premises required.

  **The Snag:** You tried to write down the *rule* of inference (like Modus Ponens) as just another premise (Premise 3). But for that premise to actually *do* anything, you need to *use* a rule of inference to apply it... which requires *another* rule to justify using *that* rule... ad infinitum. The kettle stays cold because you can never write down the *final, self-applying* rule that lets you stop writing rules and just *do* the deduction (or flip the switch). The machinery of logic itself can't be bootstrapped from *within* the argument using just premises.
