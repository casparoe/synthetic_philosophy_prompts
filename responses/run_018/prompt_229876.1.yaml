          Rules for Stage2 experiment:

            - We have 8 pairs. We assign each pair: one Player1 and one Player2.
            - We split the 8 Player1s: 4 are assigned to use the mixed strategy (with a coin: heads T, tails M) and 4 are assigned to use B.
            - We do three rounds. In each round, we tell all Player2s to play a specific action: first L, then C, then R.
            - In each round, the Player1s in the mixed group flip a coin and play accordingly. The B group always plays B.
            - After each round, record the payoff for each Player1.
            - After three rounds, we compute the total payoff for each Player1 (or average per round).

            - We then compare: the mixed group should have higher payoffs in each round and on average.

          Potential issues:

            - The coin flips might be unlucky: in round1, the mixed group might get all M (0) which is less than B (2). But with 4 pairs, the chance of all M is 1/16, so unlikely. And even if, we can note that in expectation it is higher.

