          Debrief:

            - Formal ideas:
              a) A strategy (B) is strictly dominated by a mixed strategy (50-50 T and M) even when no pure strategy does the job.
              b) In a two-player game, a strategy is strictly dominated in this sense exactly when it is never a best response to any belief about the opponent.
                 Explanation: For B to be a best response, there must be a belief (probability distribution over Player2's actions) such that B yields at least as much as T and M and the mixture. But the mixture yields at least 2.5 in each column? Actually, we showed that for each pure strategy of Player2, the mixed strategy yields more than B. Then for any belief, the mixed strategy yields more than B. Hence, B cannot be a best response to any belief.
              c) Iterated elimination with mixed dominance is meant to capture what survives common knowledge of rationality: if players are rational and know that the other is rational, and so on, then they would not play a strictly dominated strategy (even by a mixed one). So we can eliminate B. Then, after that, we eliminate R for Player2 because it becomes dominated (by pure strategies) after B is eliminated.

            - What the activity cannot reproduce: 
