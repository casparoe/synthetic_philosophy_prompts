  ### Classroom Game Design: Iterated Elimination with Mixed Strategies

  **Duration:** 75 minutes  
  **Participants:** 16 undergraduates (8 pairs)  
  **Prerequisites:** One semester of microeconomics; familiarity with payoff matrices and pure-strategy dominance.  
  **Stakes:** Small monetary rewards (e.g., $0.50 per "win" in a round) or candy.

  ---

  ### **Stage 1: Warm-Up with Pure-Strategy Dominance**  
  **Time:** 20 minutes  
  **Objective:** Reinforce iterated elimination of strictly dominated pure strategies.  
  **Game:** Modified Prisoner's Dilemma with a third strategy.

  #### Payoff Matrix (Player 1, Player 2):
  |          | **L**   | **M**   | **R**   |
  |----------|---------|---------|---------|
  | **T**    | 5, 1    | 5, 2    | 4, 3    |
  | **M**    | 2, 2    | 3, 3    | 3, 1    |
  | **B**    | 0, 3    | 1, 4    | 2, 5    |

  #### Rules & Timeline:
  1. **Introduction (3 min):**  
     - Display the matrix. Explain rules: Pairs play simultaneously; highest payoff wins $0.50 per round.  
     - Goal: Find rational strategies via elimination.

  2. **Play & Elimination (12 min):**  
     - **Round 1:** All 8 pairs play one round (no discussion).  
     - **Class Discussion:** "Can any strategy be eliminated?"  
       - *Guide students to see:* For Player 2, **L** is strictly dominated by **M** (2 > 1, 3 > 2, 4 > 3).  
       - Eliminate **L**. New matrix:  
         |          | **M**   | **R**   |
         |----------|---------|---------|
         | **T**    | 5, 2    | 4, 3    |
         | **M**    | 3, 3    | 3, 1    |
         | **B**    | 1, 4    | 2, 5    |  
     - **Round 2:** Pairs play again with reduced matrix.  
     - **Class Discussion:** "Now what?"  
       - *Guide:* **T** dominates **M** and **B** for Player 1 (5 > 3 > 1 in **M**; 4 > 3 > 2 in **R**).  
       - Eliminate **M** and **B**. Only **T** remains. Player 2 chooses **R** (3 > 2).  

  3. **Summary (5 min):**  
     - Outcome: **(T, R)** with payoffs (4, 3).  
     - Emphasize: Pure-strategy dominance tidied the matrix.

  ---

  ### **Stage 2: Mixed-Strategy Dominance Revelation**  
  **Time:** 30 minutes  
  **Objective:** Show a strategy strictly dominated only by a mixed strategy.  
  **Game:** Asymmetric Matching Pennies variant.

  #### Payoff Matrix (Player 1, Player 2):
  |          | **L**   | **C**   | **R**     |
  |----------|---------|---------|-----------|
  | **T**    | 5, 0    | 0, 5    | 3, -1     |
  | **M**    | 0, 5    | 5, 0    | 3, -1     |
  | **B**    | 2, 3    | 2, 3    | 2, 1      |

  #### Rules & Timeline:
  1. **Introduction (5 min):**  
     - Display matrix. "No pure strategy dominates another. Can we eliminate anything?"

  2. **Experimental Rounds (20 min):**  
     - **Assign Groups:**  
       - 4 Player 1s use **B** (always).  
       - 4 Player 1s use a **50-50 mix of T/M** (coin flip: heads = **T**, tails = **M**).  
       - 8 Player 2s (paired with Player 1s).  
     - **Three Rounds (Player 2 actions fixed per round):**  
       - **Round 1:** All Player 2s play **L**.  
         - Mixed Player 1s: Flip coin → **T** (payoff 5) or **M** (payoff 0).  
         - **B** Player 1s: Payoff = 2.  
       - **Round 2:** Player 2s play **C**.  
         - Mixed: **T** (payoff 0) or **M** (payoff 5).  
         - **B**: Payoff = 2.  
       - **Round 3:** Player 2s play **R**.  
         - Mixed: **T** or **M** → payoff 3.  
         - **B**: Payoff = 2.  
     - **Record Payoffs:** Publicly track average payoffs:  
       - Mixed group: ~2.5 (L), ~2.5 (C), 3 (R) → **Avg ≈ 2.67**.  
       - **B** group: 2 (L), 2 (C), 2 (R) → **Avg = 2**.  

  3. **Elimination & Further Reduction (5 min):**  
     - **Eliminate B:**  
       - "Mixed strategy always beats **B**, regardless of Player 2’s action → **B** is strictly dominated."  
       - New matrix (remove **B**):  
         |          | **L**   | **C**   | **R**   |
         |----------|---------|---------|---------|
         | **T**    | 5, 0    | 0, 5    | 3, -1   |
         | **M**    | 0, 5    | 5, 0    | 3, -1   |  
     - **Eliminate R:**  
       - "**R** is strictly dominated by **L** or **C** for Player 2 (-1 < 0, 5)."  
       - Final matrix (Matching Pennies):  
         |          | **L**   | **C**   |
         |----------|---------|---------|
         | **T**    | 5, 0    | 0, 5    |
         | **M**    | 0, 5    | 5, 0    |  

  ---

  ### **Debrief: Mapping to Formal Concepts**  
  **Time:** 20 minutes  

  1. **Key Insights:**  
     - **Mixed dominance:** **B** is strictly dominated by a 50-50 mix of **T**/ **M**, though no pure strategy dominates it.  
     - **Belief-based definition:** A strategy is strictly dominated iff it is **never a best response** to any belief about the opponent. Here, **B** is never best:  
       - For any Player 2 action (**L**, **C**, **R**), the mixed strategy yields >2.  
     - **Common knowledge of rationality:** Iterated elimination (including mixed) reflects players discarding strategies that rational players would avoid.  

  2. **Limitations of the Activity:**  
     - The game **cannot show** that mixed dominance is equivalent to the "never a best response" criterion in general. The facilitator must:  
       - Explain: "If a strategy isn’t dominated by any mixed strategy, there exists some belief making it a best response."  
       - Use the experimental results: "Since **B** lost to the mixed strategy in every scenario, no belief could justify playing it."  

  3. **Predictable Problems & Solutions:**  
     - **Problem:** Mixed group might "lose" a round (e.g., get 0 in **L** when **B** gets 2).  
       - *Solution:* Focus on averages across rounds. Ask: "Did the mixed group outperform **B** overall? In each fixed action?"  
     - **Problem:** Students confuse mixed strategies with "random opponents."  
       - *Solution:* Clarify: "Randomization is a deliberate strategy to avoid exploitation. Player 2’s actions were fixed by us to test robustness."  
     - **Problem:** Time crunch.  
       - *Solution:* Pre-assign groups; use digital dice/coin flips; skip recording individual payoffs if needed.  

  ---

  ### **Conclusion**  
  This staged game:  
  1. Revisits pure-strategy dominance in **Stage 1**.  
  2. Uses experimental play in **Stage 2** to reveal mixed dominance organically.  
  3. Links the experience to formal game theory in the debrief.  
  The dice/cards and real stakes make the abstraction tangible, while the facilitator bridges the gap to the "never a best response" equivalence.
