            Problem 2: Students might be confused about why we are comparing a mixed strategy (which is a plan) with a pure strategy (B). 
              Handling: Explain that a rational player would not play B because they can get a higher expected payoff by randomizing between T and M. So B should be eliminated.

            Problem 3: In the elimination after B, when we eliminate R, students might ask why we don't use a mixed strategy for Player2 to dominate R? 
              Handling: We can, but we don't need to because we can use pure strategies. We are showing that after one round of mixed elimination, we can then use pure. The point is that mixed strategies are needed when pure strategies aren't enough.

            Problem 4: Time might run short.
              Handling: Keep strict timing. For the experiment in Stage2, have pre-assigned groups and quickly run the three rounds.

