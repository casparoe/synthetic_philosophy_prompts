                - Also, the activity does not show the full power of mixed strategy dominance in the remaining 2x2 game (matching pennies) because we stop after eliminating R. We don't show that in the 2x2, there is no further elimination, and that the solution concept might then require mixed strategies to play (Nash equilibrium). 

            - The facilitator must supply: 
                - The connection to the belief-based definition: that a strategy is strictly dominated by a mixed strategy if and only if it is never a best response. 
                - The idea that common knowledge of rationality justifies iterated elimination of strictly dominated strategies (by mixed strategies).

          Predictable problems and how to handle:

            Problem 1: In Stage2, the mixed strategy group might get a low payoff in one round (like 0) and a student might say "see, it's worse". 
