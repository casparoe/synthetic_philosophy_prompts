            Stage1: 20 minutes
              - 5 min: explain the matrix and the rules of the game. Hand out the matrix. 
              - 10 min: class discussion to eliminate strategies step by step. 
              - 5 min: summary.

            Stage2: 30 minutes
              - 5 min: introduce the matrix and note that no pure strategy dominance.
              - 10 min: run the experiment with mixed strategy vs B (three rounds, with fixed Player2 actions: L, C, R). 
