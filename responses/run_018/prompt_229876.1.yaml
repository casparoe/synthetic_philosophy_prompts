          So the plan for Stage2:

            - Start with the 3x3 matrix (with B having 2,3,2 in L,C,R and Player2's R having -1? But wait, in the B row, Player2 gets 1 at R? We don't need to change that because we are eliminating B first).

            Matrix for Stage2:

            Player 2
                 L     C     R
            T | 5,0 | 0,5 | 3,-1
            M | 0,5 | 5,0 | 3,-1
            B | 2,3 | 2,3 | 2,1

