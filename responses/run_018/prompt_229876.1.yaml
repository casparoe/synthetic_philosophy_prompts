                       Against T: L gives 0 > -1 -> yes
                       Against M: L gives 5 > -1 -> yes
                    Similarly, R is strictly dominated by C? 
                       Against T: C gives 5 > -1 -> yes
                       against M: C gives 0 > -1 -> yes.
              6. So eliminate R.
              7. Then we have a 2x2 matching pennies.

