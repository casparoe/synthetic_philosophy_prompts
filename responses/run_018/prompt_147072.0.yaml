answer: |-
  Here’s a defense of the contrarian position that von Neumann’s analogy undermines—rather than anticipates—contemporary computationalism, structured around his core arguments:

  ### **1. The Non-Boolean Logic of the Brain**  
  Von Neumann explicitly rejected the Boolean foundation of digital computation. He observed that neurons operate via *statistical summation* (weighted inputs triggering probabilistic firing) rather than deterministic AND/OR gates. Unlike digital circuits where a single transistor failure crashes the system, neurons use "threshold logic" integrating thousands of noisy, unreliable inputs to produce reliable outputs. This contradicts the core tenet of symbolic AI, which requires error-free symbol manipulation. For von Neumann, cognition emerges from *collective statistics*, not discrete truth tables.

  ### **2. Analog Primacy Over Digital Abstraction**  
  While von Neumann noted superficial parallels between neurons and vacuum tubes, he insisted the brain is fundamentally **analog-first**: neural signals are graded potentials (amplitude-modulated), not binary spikes. Synaptic weights operate as continuous values, enabling pattern recognition through harmonic resonance or field effects—processes better modeled by differential equations than finite-state automata. His call for "probabilistic logics" anticipated connectionism, but modern computationalists ignore his warning: digitizing analog dynamics (e.g., binarizing neural activations) strips away the brain’s physics-dependent cognition.

  ### **3. Reliability via Redundancy, Not Precision**  
  Von Neumann calculated that neurons are *millions of times less reliable* than 1950s computing components. Yet brains function flawlessly due to **massive parallelism** and **overbuilt redundancy**—not error-correcting code. A single neuron’s "noise" is irrelevant; cognition emerges from population-level statistics. This directly opposes classical functionalism, which assumes cognition is substrate-independent program execution. For von Neumann, the brain’s reliability is *inherently physical*: it exploits thermodynamics and redundancy in ways silicon cannot replicate with serial architectures. Modern AI’s brittle systems (e.g., transformers failing on adversarial patches) prove his point.

  ### **4. Emergence Over Execution**  
  Von Neumann described cognition as a **thermodynamically constrained process**, where signal propagation depends on metabolic energy and physical architecture. Unlike Turing machines, brains lack a central clock, separate memory/store, or sequential instruction fetches. Instead, they use reentrant loops, continuous feedback, and analog oscillations (e.g., theta/gamma waves) to bind distributed computations. This frames cognition as **self-organizing dynamics**—closer to fluid turbulence or quantum fields than Python scripts. Symbolic AI’s "brain emulation" projects thus fundamentally misunderstand his analogy: simulating neuron firings ≠ capturing emergent physics.

  ---

  ### **Why This Misreading Matters**  
  - **Artificial Consciousness**: Computationalists assume consciousness emerges from complex symbol processing. Von Neumann’s emphasis on analog, physically embedded dynamics suggests it may require continuous, energy-driven systems—undermining claims that digital AI can be conscious.  
  - **Brain Emulation (e.g., Neuralink, whole-brain simulation)**: Projects aiming to "upload" brains ignore his core insight: cognition relies on wetware’s imprecision and redundancy. Digitizing neurons into error-free models may destroy the emergent properties enabling robustness.  
  - **AI’s Limits**: Modern deep learning succeeds precisely where it adopts von Neumann’s principles (parallelism, statistical learning), yet remains shackled to digital frameworks. His work implies true cognition might demand analog systems with "noisy" components—a path abandoned in the 1980s symbolic AI era.  

  ### **Conclusion**  
  Von Neumann’s analogy wasn’t a blueprint for computationalism but a funeral for it. He argued that brains achieve cognition *despite* being non-digital, non-Boolean, and statistically messy—a direct rebuke to functionalism’s belief in multiple realizability. Invoking him as a forefather of computational theories ignores his deepest warning: **the brain isn’t a computer; it’s an organism**. Treating neurons as perfectible circuits misses the very physics that makes cognition possible.
