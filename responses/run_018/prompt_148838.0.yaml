answer: |-
  ### Final Exam Question: Philosophy of Language  
  **Time Allowed:** 60 minutes  
  **Word Guide:** ~1200 words  

  **QUESTION:**  
  Hilary Putnam's Twin Earth thought experiment argues that the meaning of "water" depends on external microphysical facts (H₂O vs. XYZ), not just internal mental states. Tyler Burge's "arthritis" case extends this, showing social environment shapes meaning. Now imagine **"Gradient Earth"**:  
  - A planet where the dominant clear, drinkable liquid varies *continuously* in chemical composition across regions.  
  - In "Pure H₂O Zones", it’s 99% H₂O; in "Pure XYZ Zones", 99% XYZ.  
  - Crucially, in "Border Zones", the liquid is a hybrid (e.g., 50% H₂O/50% XYZ), and inhabitants *cannot empirically distinguish* whether they’re in an H₂O-leaning or XYZ-leaning area.  

  Does Gradient Earth **undermine the standard Twin Earth argument** by challenging its binary distinctions? Or does it merely force us to **"indexicalise" semantic externalism** – making the meaning of "water" depend on the speaker’s *actual location* in the gradient? Defend your view, addressing at least one major objection.  

  ---

  ### Model Answer (~600 words)  
  Gradient Earth doesn’t refute semantic externalism but compels a nuanced, indexicalised version that avoids collapsing into internalism. Putnam’s original argument relies on a sharp metaphysical divide: "water" rigidly designates H₂O *because* Earth’s liquid has a discrete essence. Gradient Earth dissolves this binary by introducing zones where speakers lack epistemic access to the "real" chemical facts. If "water" meant whatever *causally regulates* local use (as per Putnam), Border Zone speakers referring to the hybrid liquid would suffer reference failure or ambiguity. This *does* threaten the standard Twin Earth intuition that meaning tracks a clear, mind-independent "joint" in nature.  

  However, externalism can be preserved by treating "water" as an indexical. On this view, "water" means something like *"the clear, drinkable liquid dominant in *this* environment"*. Meaning remains external because it’s anchored to local physical facts (e.g., the liquid’s distribution in a speaker’s region), not descriptive beliefs. Border Zone speakers still refer determinately – to the hybrid liquid *in their vicinity* – even if they misclassify its chemistry. Crucially, this avoids internalism: two internal duplicates in different Border Zones (H₂O-leaning vs. XYZ-leaning) would mean different things by "water" because their environments differ. Externalism thus becomes *position-relative*, not discarded.  

  **Objection:** Gradient Earth *strengthens* externalism by showing environmental dependence is continuous, not discrete. If meaning shifts gradually with chemical gradients, this confirms Putnam’s core insight – that reference is world-involving.  
  **Reply:** Continuity doesn’t save *binary* externalism, which demands essences fix reference. In Border Zones, there’s no fact about whether "water" means H₂O or XYZ, so Putnam’s essentialism fails. But indexical externalism accommodates continuity: meaning shifts smoothly because "this environment" has fuzzy boundaries. The objection conflates externalism’s *core thesis* (meaning depends partly on environment) with its *essentialist implementation*. Gradient Earth refines the latter while vindicating the former.  

  In sum, Gradient Earth exposes the crudity of Twin Earth’s binary but validates a spatially indexical externalism. Meaning remains external yet context-sensitive, avoiding descent into internalism.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **A (21–25 marks)** | **B (16–20 marks)**  
  *(Key differentiator: A answers engage deeply with Gradient Earth; B answers describe Putnam/Burge competently but treat Gradient Earth superficially)*  

  1.  **Threat to Binary Externalism (6 marks)**  
      - **A (5–6):** Clearly explains *how* borderline zones create indeterminacy in Putnam’s model (e.g., no "essential" microphysical property to fix reference; speakers can’t discern chemical facts). Links this to the collapse of discrete "joints" in nature.  
      - **B (3–4):** Describes Twin Earth accurately but only vaguely gestures at Gradient Earth as "less clear" without analysing epistemic/chemical indeterminacy.  

  2.  **Indexical Externalism vs. Internalism (6 marks)**  
      - **A (5–6):** Develops a plausible indexical account (e.g., "water" as location-dependent). Explicitly argues why this *isn’t* internalism (e.g., duplicates in different zones mean different things). Distinguishes indexicality from descriptivism.  
      - **B (3–4):** Suggests meaning might be "context-dependent" but conflates this with descriptive beliefs or internal states. Fails to show how externalism is preserved.  

  3.  **Objection & Response (6 marks)**  
      - **A (5–6):** Engages a substantial objection (e.g., "gradients strengthen externalism by showing continuous dependence" OR "indexicality implies meaning is unstable"). Offers a cogent counter-reply using Gradient Earth specifics.  
      - **B (3–4):** Raises a generic objection (e.g., "But Putnam says meaning is external!") or gives a weak/unrelated response.  

  4.  **Clarity, Precision, Originality (7 marks)**  
      - **A (6–7):** Fluent, structured argument focused on Gradient Earth’s implications. Avoids rehashing Putnam/Burge basics. Technical terms used accurately.  
      - **B (4–5):** Competent summary of standard externalism but derivative. Gradient Earth is a footnote; may contain ambiguities or digressions.  

  **Note:** A **B+ (20)** might *mention* indexicalisation but not defend it robustly. An **A– (21)** might address only one objection shallowly. Full marks require all four strands at A-grade.  

  ---  
  **Casual note:** Cheers for the fun prompt – hope this nails your exam vision! Gradient Earth’s a proper head-scratcher, but the marking scheme should help separate the philosophers from the parroters. Best of luck with the marking avalanche. 😉
