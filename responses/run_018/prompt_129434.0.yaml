  First, I need to recall the key theories involved. Epistemic contextualism says that the truth conditions of "knows" depend on the speaker's context, especially the stakes. Pragmatic encroachment argues that practical stakes affect knowledge itself, not just the attribution. Subject-sensitive invariantism (SSI) holds that knowledge depends on the subject's practical stakes, and the meaning of "knows" doesn't shift with context. 

