answer: |-
  Your observation hits on a profound and well-documented epistemological dilemma. This **isn't just standard Aumann-style disagreement** (which assumes shared priors and updating rules) but a deeper split over **what constitutes valid evidence**—a conflict in *epistemic norms* or *evidential standards*. While no single term is universally settled, here's how philosophy labels this deadlock:

  ### Core Concepts & Established Terminology
  1. **Deep Disagreement (Robert Fogelin)**  
     - **Definition**: Disagreements rooted in conflicting "framework propositions" (e.g., standards of evidence, epistemic virtues, or foundational worldviews).  
     - **Why it fits**: Your "filters" are these framework propositions. When one side prioritizes statistical rigor and the other narrative resonance, they occupy incommensurable epistemic frameworks. Persistent disagreement doesn't signal irrationality *within* each framework but reflects a **clash of justification criteria**.  
     - **Key insight**: Fogelin argued such disputes *cannot* be resolved rationally because no neutral ground exists to judge the frameworks themselves.

  2. **Epistemic Incommensurability (Inspired by Kuhn/Feyerabend)**  
     - Borrowed from philosophy of science, this describes when rival paradigms (e.g., "anecdotes are noise" vs. "anecdotes reveal truth") lack shared standards to evaluate evidence.  
     - **Result**: Each side views the other as "playing a different game" with different rules, making consensus impossible.

  3. **Meta-Disagreement**  
     - A modern term in epistemology for disagreements *about how to disagree* (e.g., what counts as evidence, rational updating, or authority).  
     - **Distinction**: Unlike "first-order" disagreements (e.g., "Is policy X effective?"), this is "second-order" ("Is a statistical study or a lived experience better evidence for policy X?").

  4. **Fundamental Epistemic Disagreement**  
     - Explicitly focuses on conflicts in **epistemic principles** (e.g., empiricism vs. testimonial authority) rather than factual beliefs.

  ### Why Aumann's Agreement Theorem Doesn't Apply
  Aumann assumes rational agents share:
  - A common prior over possible world states,
  - **Agreement on how to update beliefs** (Bayesian updating with identical likelihood models).  
  Your scenario violates the second condition: the "filters" represent **divergent likelihood models** (e.g., \( P(\text{Evidence} | \text{Hypothesis}) \) differs for anecdotes vs. statistics). When agents don't agree on what evidence *means*, Aumann’s convergence result collapses.

  ---

  ### Why This Deadlock Is Especially Stubborn
  - **Self-sealing frameworks**: Each filter provides its own internal justification. The statistical-minded dismiss anecdotes *because* they’re statistically insignificant; the anecdote-prioritizer distrusts statistics *because* they erase lived experience.  
  - **No meta-framework**: To question their own filter, agents would need a "meta-standard" for evaluating standards—but they lack one, leading to circularity.  
  - **Identity-protective cognition**: Often, epistemic filters align with social identity (e.g., "trust in institutions" vs. "trust in personal experience"), making them resistant to revision.

  ---

  ### Practical Implications: How to Frame It
  - **Best-fit term**: **Deep Disagreement** (Fogelin) is the most established label for this phenomenon.  
  - **Alternative phrasing**: **Epistemic framework divergence** or **second-order rationality conflict**.  
  - **What it’s not**:  
    - *Not mere bias*: Both sides are "internally rational" (coherent within their framework).  
    - *Not priors over world-states*: The conflict is about evidence-processing rules.  

  This deadlock explains polarization in science/ideology (e.g., climate change, medicine, economics), where opponents share data but not epistemic values. Resolution typically requires **negotiating shared epistemic norms**—or agreeing to disengage. If you're analyzing debates, naming this "deep disagreement" highlights that the conflict is foundational, not just factual. For further reading, see Fogelin's *Arguing Without End* (1994) or Lynch’s *The Internet of Us* (2016) on epistemic bubbles.
