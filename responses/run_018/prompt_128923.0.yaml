  First, I need to recall relevant concepts. Aumann's agreement theorem states that two rational agents with the same priors cannot agree to disagree; they must converge if they share all information. But here, the issue is that they don't share the same standards for evidence. So the priors about evidence evaluation differ, which Aumann's theorem doesn't cover since it assumes shared priors over world states.

  Key concepts to consider:
  - **Epistemic peer disagreement**: When two people with similar knowledge and rationality disagree. But here, the disagreement is about evidence standards, not just beliefs.
  - **Deep disagreement**: From Fogelin, where disagreements stem from fundamental principles. This fits because the filters are foundational.
  - **Epistemic frameworks**: Different criteria for evidence evaluation. For example, empiricism vs. anecdotal authority.
  - **Meta-justification**: Disagreement over what justifies beliefs in the first place. Each side has different criteria for evidence legitimacy.

  The core issue is meta-justification. Both sides are rational within their own frameworks, but they don't agree on the rules. So even if they share data, they interpret it differently. The user is highlighting that this is a deeper level of disagreement than just differing priors over world states.

  Possible established terms:
  1. **Deep Disagreement (Fogelin)**: Rooted in conflicting framework principles. Directly addresses irreconcilable differences in evidence standards.
  2. **Epistemic Incommensurability**: Like Kuhn's paradigms, where different frameworks can't be judged by a common standard. This might fit but is less formal.
  3. **Meta-Disagreement**: Disagreement about the standards of disagreement. This is a newer term in epistemology.
