answer: |-
  So picture this evolutionary biologist at a cocktail party, desperately trying to explain their research to a well-meaning friend who keeps insisting that "cooperation always wins in the end because of the prisoner's dilemma." The biologist sighs, takes a long sip of their drink, and says, "Look, it's not that simple. Imagine two strategies locked in endless rounds of prisoner's dilemma: good old Defector, always betraying, and Tit-for-Tat, starting nice and copying the last move. In a perfect world where they play forever with perfect memory and a discount factor δ > (T-R)/(R-S)? Sure, Tit-for-Tat can hold the line against Defector. But toss that pair into a big, messy, evolving population where strategies mutate, drift randomly, or where players just bump into neighbors? It’s a disaster waiting to happen. A single mutant Defector slipping into a Tit-for-Tat cluster might get punished locally, but if the population's too well-mixed or the benefit-to-cost ratio is too low, that defection spreads like gossip. Tit-for-Tat isn't evolutionarily stable; it can't resist invasions by nastier strategies or even just drift towards Always Cooperate followed by a defector invasion. The 'shadow of the future' everyone loves to cite? It’s more like a flickering candle in a drafty room – easily snuffed out unless you've got just the right spatial structure or some noisy, finite population dynamics propping it up. So no, cooperation doesn't 'always win'. It's a precarious miracle requiring very specific, fragile conditions that our messy human interactions – which are neither infinite-horizon games nor perfectly mixed evolutionary soups – rarely provide. Trying to base real-world morality on this unstable equilibrium is like building a house on a foundation of shifting replicator dynamics." The friend blinks, then mutters, "Right... so, more wine?"

  Reflecting on this, the joke takes some liberties: it implicitly conflates evolutionary stability against direct invasions (where Tit-for-Tat *can* be robust in pairwise contests within deterministic infinite populations under specific parameters) with robustness against drift and mutation in polymorphic populations or spatial settings, which is indeed far weaker. It also oversimplifies the stochastic dynamics in finite populations, where fixation probabilities and the crucial 1/3 rule under birth-death Moran processes can favor cooperation under lower benefit-to-cost ratios than deterministic replicator dynamics suggest. If emphasizing that specific stochastic advantage in finite populations was the core point, the framing would shift to highlight how cooperation clings on probabilistically against the odds rather than collapsing entirely, making the 'fragility' slightly less absolute than the joke implies, though the core tension between idealized models and messy reality remains potent. The essential correction is that while pure Tit-for-Tat often *is* evolutionarily unstable in standard replicator dynamics, the evolutionary pathways in finite populations with stochasticity offer different, sometimes more cooperative, possibilities – but still ones worlds away from the neat, infinite-horizon folk theorem.
