prompt: |-
  I'm a doctoral student working on the normativity of meaning, and a friend in my cohort — who has been reading the rule-following literature with more enthusiasm than charity, in my view — has put together an argument she thinks shows that no speaker ever computes any function at all, not even a finite one. We argued about it over dinner and I couldn't cleanly locate the error, though I'm sure the conclusion is false. Here is the argument, as faithfully as I can reconstruct it:

  (1) For any speaker S and any finite stretch of S's actual behaviour with a symbol — every answer S has ever given, every keystroke, every utterance — there are infinitely many distinct functions consistent with that behaviour, differing only on inputs S has never encountered. (2) S's dispositions, however idealised, are finite in reach and subject to interference, so they underdetermine which of these functions S is tracking. (3) The facts surveyed in (1) and (2) — past use and dispositions — exhaust the candidate facts about S that could fix which function S computes; anything further (an inner intention, a mental state) is itself just another item that stands in need of interpretation and so inherits the same indeterminacy. (4) Appealing to the community's use or dispositions merely aggregates more finite, error-prone behaviour, and aggregation cannot manufacture determinacy out of what is severally indeterminate. (5) Therefore no fact about S, actual or possible, determines which function S computes. (6) If no fact determines which function S computes, then S does not determinately compute any function. (7) Therefore S does not compute any function — not addition, not even the successor function on the first hundred natural numbers. Since S was arbitrary, nobody has ever computed anything.

  Now, the conclusion strikes me as something no one can actually believe — my friend presumably computed a tip at dinner. But each premise seemed reasonable when she stated it, and I found myself conceding steps I now regret. What I'd like from you: identify which premise or step should be rejected, and explain why it looked compelling in the first place. Please also price the alternatives — that is, for each of the standard responses in this neighbourhood (the reductive dispositionalist who digs in at (2), the meaning primitivist who rejects (3), the communitarian who resists (4), and the sceptical-solution theorist who accepts (5) but blocks the move from (5) to (6) by reconstruing what meaning-attributions are for), say what each has to give up and which cost is smallest. Two constraints on your answer: I would strongly prefer to keep the claim that meaning is genuinely normative, and I would strongly prefer to keep the claim that there are facts about what people mean. If one of these has to go, tell me which and why; if both can be kept, show me how the argument's appearance of soundness is to be explained away.
reasoning: |-
  Okay, let me tackle this doctoral student's problem. They're working on the normativity of meaning and their friend has this argument that no one ever computes any function. The conclusion seems absurd—like the friend calculating the tip—but each step seems plausible. The student wants to know where the argument goes wrong and which philosophical response is least costly, while preserving normativity and facts about meaning.

  First, I need to understand the argument's structure. Premise (1) states that finite behavior is consistent with infinitely many functions. That's Quinean indeterminacy—any finite data set can map to countless rules. Premise (2) says dispositions don't fix it because they're finite and messy. Premise (3) claims inner states don't help because they're interpretable too—Wittgenstein's regress problem. Premise (4) dismisses community solutions as aggregating indeterminacy. Then (5)-(7) conclude no function is computed.

  The student mentioned four responses: reductive dispositionalist (defends premise 2), meaning primitivist (attacks premise 3), communitarian (rejects premise 4), and skeptical-solution theorist (accepts premise 5 but blocks inference to 6). 

  Hmm, the student really wants to keep meaning's normativity and factual existence. So I should evaluate which approach best saves both. The skeptical-solution (à la Kripke's Wittgenstein) might deny facts about meaning altogether—that sacrifices factual existence. Not ideal. The primitivist says meaning is irreducible and normative—that preserves both but might seem mysterious. The communitarian appeals to community practices—that could save normativity if conventions are binding, but premise 4 argues aggregation doesn't help. 

  Wait, premise 4 is weak. Aggregation *can* create stability even if individual behavior is indeterminate—think of convergent social correction. That might be the softest target. But the student prefers keeping normativity, so primitivism might appeal more even if it's metaphysically heavier. 

  The core trick is step (6): "no fact determines" to "doesn't determinately compute." That equivocates metaphysical and semantic determinacy. Meaning could be indeterminate in theory but determinate in practice—like vague predicates still working fine. The normativity angle helps here: meaning facts aren't descriptive but prescriptive, so the "fact" in premise 3 is mischaracterized. 

  I think rejecting premise 3 via primitivism is the best path. Meaning isn't reducible to dispositions or inner states—it's a primitive normative relation. The cost is accepting irreducible normativity, but that aligns with the student's priorities. The error in the argument is assuming everything interpretable is indeterminate, ignoring that meaning might be sui generis. 

  Alternatively, step (5) to (6) equivocates: lack of metaphysical determination doesn't entail no semantic content. But that feels shakier. Premise 3's reductionism is the root issue—it ignores non-reductive facts. The friend's "enthusiasm without charity" probably overlooks that intentions aren't just more symbols; they have first-person authority. 

  For costs: dispositionalism must deny premise 2's claim about idealization, but dispositions are messy. Communitarianism tackles premise 4 but must explain emergence. Skeptical solution gives up meaning facts entirely. Primitivism pays with ontological simplicity but keeps what matters. 

  So recommendation: reject premise 3. Meaning is primitive and normative. The argument assumes reductionism, which is question-begging. The cost—metaphysical primitivism—is worth it for preserving normativity and facts.
answer: |-
  The flaw lies in **premise (3)**, which claims that past use, dispositions, and any further facts (like intentions or mental states) "exhaust the candidate facts" and that anything further "inherits the same indeterminacy." This premise assumes **reductionism about meaning**: it presupposes that meaning facts *must* be reducible to non-normative, dispositional, or behavioral facts. Rejecting this reductionism dissolves the argument while preserving both normativity and determinacy of meaning. Below, I dissect the argument, explain why (3) fails, and evaluate the costs of alternative responses per your constraints.

  ---

  ### **Step-by-Step Diagnosis**
  1. **Premises (1) & (2) are correct but incomplete**  
     Yes, finite behavior and dispositions underdetermine function-tracking (Quine's indeterminacy). Dispositions are messy and finite. This is uncontroversial.  
     *Why compelling?* Empirical evidence (e.g., quus-like alternatives) shows underdetermination. It feels intuitive that dispositions can't fix meaning alone.

  2. **Premise (3) is the core error: Reductionist assumption**  
     (3) assumes that if mental states (e.g., intentions) can't be *reduced* to non-normative facts, they "inherit indeterminacy." But this conflates:  
     - **Indeterminacy of interpretation** (how *we* assign meaning to others' states)  
     - **Determinacy of first-person meaning** (what *I* mean by my own states).  
     An intention to mean *addition* isn't "just another symbol" needing interpretation—it is constitutively normative. To intend to add *is* to commit to ‘+’ as correct. Rejecting (3) allows meaning facts to be *sui generis*: irreducible, normative, and determinate.  
     *Why compelling?* It mirrors Wittgenstein's regress argument (e.g., "no mental state can interpret itself"). But this confuses *epistemic* access (how we know others' meanings) with *metaphysical* grounding (what fixes meaning).

  3. **Premise (4) is weak but not pivotal**  
     Community practices *can* generate determinacy through shared corrective norms (e.g., "That's not how we add!"). However, (4) is irrelevant if (3) fails.  
     *Why compelling?* Aggregation *seems* unable to resolve individual indeterminacy (e.g., Kripke's skeptic).

  4. **Steps (5)–(7) equivocate without (3)**  
     If (3) is false, (5) doesn't follow: meaning-determining facts exist (e.g., irreducible intentions). Thus, (6) and (7) collapse.  
     *Why compelling?* If you accept (1)–(4), (5)–(7) seem logically airtight.

  ---

  ### **Cost Analysis of Standard Responses**
  | **Response**               | **Target Premise** | **What It Gives Up**                                                                 | **Cost (Scale: 1–5)** | **Alignment w/ Your Constraints** |
  |----------------------------|--------------------|--------------------------------------------------------------------------------------|------------------------|-----------------------------------|
  | **Reductive Dispositionalist** | Rejects (2)        | Admits messy dispositions, but insists idealization *can* fix meaning (e.g., Peacocke). Gives up **genuine normativity**: reduces "ought" to statistical regularity ("would do in ideal conditions"). | ⚠️⚠️⚠️⚠️ (4/5) | ❌ Abandons normativity. |
  | **Communitarian**          | Rejects (4)        | Claims community norms resolve indeterminacy (e.g., Brandom). Gives up **individualism**: meaning is external to the speaker, dependent on social practices. | ⚠️⚠️⚠️ (3/5) | ⚠️ Preserves normativity weakly (as social obligation), but risks diluting first-person authority. |
  | **Skeptical-Solution Theorist** | Blocks (5)→(6)    | Accepts no "facts" determine meaning (Kripke's Wittgenstein). Meaning is a useful fiction for attributing "correctness." Gives up **factualism about meaning**: no truth to "S means addition." | ⚠️⚠️⚠️⚠️ (4/5) | ❌ Rejects facts about meaning; normativity becomes instrumental. |
  | **Meaning Primitivist**    | **Rejects (3)**    | Treats meaning as primitive: irreducible, normative, and determinate (e.g., McDowell, Nagel). Gives up **reductionism**: meaning facts aren't analyzable via non-normative facts. | ⚠️⚠️ (2/5) | ✅✅ **Best fit**: preserves normativity *and* facts. |

  #### **Why Primitivism Has the Smallest Cost**
  - **Cost:** Accepts non-reductive facts (modest metaphysical price). Critics call it "mysterious," but it aligns with phenomenology: we *experience* meaning as determinate (e.g., you *know* you meant addition).
  - **Strengths:**  
    - Explains the argument's appeal: (3) seems true *only if* you presuppose reductionism.  
    - Grounds normativity: meaning's "ought" is built into the primitive relation (e.g., meaning + imposes obligations).  
    - Avoids skepticism: your friend *did* compute the tip because her intention determined the function.

  ---

  ### **How the Argument's Soundness is Explained Away**
  The argument is valid but unsound due to **question-begging reductionism in (3)**. It covertly assumes meaning must be reducible to non-normative facts, then "proves" no such facts exist. But if meaning is *irreducibly normative*, (3) fails. The illusion of soundness arises because:
  1. **Epistemic vs. Metaphysical Confusion**: Our *access* to others' meanings is indeterminate (premises 1–2), but this doesn't entail metaphysical indeterminacy.  
  2. **Reductive Bias**: Naturalism tempts us to demand non-normative reductions. When none work, skepticism *feels* inevitable—but that’s a reductio of reductionism itself.  

  ---

  ### **Recommendation**
  **Embrace meaning primitivism**. It keeps meaning normative and factual while exposing (3) as the argument’s Achilles' heel. The cost—rejecting reductionism—is smaller than sacrificing normativity or factualism. Your friend’s tip calculation was real: her intention *constituted* a determinate function because meaning facts are bedrock. 

  *For further work*: Defend primitivism against the "access problem" (how we know others' meanings) via embodied practices (e.g., Millikan, Dennett) or triangulation (Davidson), ensuring first-person determinacy doesn’t collapse into solipsism.
