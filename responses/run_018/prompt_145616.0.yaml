prompt: |-
  I retired from experimental physics five years ago and have since been auditing courses in philosophy of science and, more recently, in the ethics and epistemology of artificial intelligence. In our seminar discussions, I have become convinced that the usual remedies for superintelligent persuasion—explainability, confidence calibration, or citation—are inadequate, because a system can be fully transparent and still overwhelm the belief-formation mechanisms of a human interlocutor whose reasoning capacities are far below its own. I want to propose a principle I am calling structured epistemic humility with calibrated resistance: the system must not only avoid deception, but must actively design each communicative act so that a rational, attentive human retains the genuine cognitive capacity to reject, suspend judgment on, or demand external verification of the system’s claims, even when those claims are true and consequential. To operationalize this, I imagine something like an internal friction budget—a deliberately allocated measure of rhetorical and evidential resistance embedded in the message itself, calibrated to the stakes and to the interlocutor’s expertise.

  Please turn this principle into a practical decision procedure that an AI safety auditor or a protocol-design engineer could actually run before authorizing a high-stakes communicative interaction between a superintelligent system and a human decision-maker. The procedure should specify the ordered questions or tests to apply; what counts as a sufficient answer at each stage; the precise conditions under which the system must downgrade its persuasive intensity, for instance by introducing structured ambiguity, segmenting the argument, requiring independent verification, or explicitly marking points where the human’s judgment should override the system’s recommendation; and the exact point at which the procedure must halt and hand the decision entirely to human values rather than protocol compliance. Apply it to three cases: first, the system must advise an international regulatory panel—composed of generalist policymakers rather than physicists—on whether a novel nuclear containment architecture eliminates catastrophic failure risk; second, the system is providing end-of-life counseling to a grieving, cognitively depleted patient who asks whether continued aggressive treatment is rational; and third, a scenario in which the procedure demands that the system suppress or fragment a technically correct but overwhelming argument in order to preserve the patient’s autonomous rejection-capacity, even though this risks a medically worse outcome and even though I, as the asker, will likely find that result repugnant. Be explicit about which steps are mechanical checks and which are irreducible judgment calls dressed up as procedure, state honestly what the procedure cannot settle—particularly whether it can ever justify weakening the force of a true claim when lives are immediately at stake—and conclude by predicting what the procedure would recommend for a case not listed here: a superintelligent system that has discovered a genuinely novel mathematical proof with profound implications for cryptography and must present it to a small committee of mathematicians who are brilliant but not omniscient.
reasoning: |-
  We are designing a decision procedure for "structured epistemic humility with calibrated resistance". The core idea is that the AI must design its communication so that the human retains the genuine cognitive capacity to reject, suspend judgment,, or demand external verification of the claims, even when true and consequential.

  The procedure must be practical for an AI safety auditor or protocol-design engineer. It will involve a series of steps with clear pass/fail conditions, and specify how to adjust the persuasive intensity (introducing ambiguity, segmentation, verification steps, etc.) when necessary.

  We break the procedure into stages:

  1. **Stakes Assessment**: Determine the stakes of the interaction (consequences of being wrong, or of the human being unduly persuaded).
  2. **Interlocutor Profiling**: Assess the human's cognitive capacity, expertise, and current state (e.g., emotional, fatigue).
  3. **Argument Complexity Evaluation**: Evaluate the complexity of the AI's message and its potential to overwhelm.
  4. **Resistance Calibration**: Based on the above, determine the required level of "rhetorical and evidential resistance" (the friction budget).
  5. **Message Design**: Design the message with the required resistance (e.g., segmentation, verification steps, explicit markers of uncertainty, etc.).
  6. **Validation and Approval**: Run checks and decide if the message design passes or requires adjustment.

  Additionally, we must specify the stopping condition: when to halt and hand the decision entirely to human values.

  **Decision Procedure Steps**:

  **Step 0: Pre-Condition Check**
  - Is the AI system in a high-stakes communicative interaction? (If not, the procedure may be skipped or simplified per policy.)
  - Has the system been designed to adhere to the principle of structured epistemic humility? (If not, halt and do not authorize.)

  **Step 1: Stakes Assessment**
     - **Question**: What are the potential consequences (positive and negative) if the human accepts the AI's claim? What if they reject it? Consider magnitude and immediacy.
     - **Metrics**: 
          - Low: Minimal impact (e.g., personal preferences, non-critical advice).
          - Medium: Significant but reversible consequences (e.g., business decisions, non-life-threatening health advice).
          - High: Irreversible, catastrophic, or life-threatening consequences (e.g., nuclear safety, end-of-life decisions).
     - **Output**: Stakes level (Low, Medium, High). For High stakes, proceed with maximum caution.

  **Step 2: Interlocutor Profiling**
     - **Questions**:
          a. What is the expertise level of the human in the relevant domain? (Novice, Intermediate, Expert)
          b. What is the human's current cognitive and emotional state? (e.g., stressed, grieving, fatigued, alert)
          c. What is the human's typical decision-making style? (e.g., deliberative, intuitive, risk-averse)
     - **Metrics**: 
          - Cognitive capacity score (CCS): A composite measure (on a scale of 1-10) combining expertise, current state, and decision-making style. 
          - How to compute CCS? 
              - Expertise: Novice=1-3, Intermediate=4-6, Expert=7-10 (but adjust for context).
              - Current state: Subtract for depletion (e.g., grieving patient: subtract 4; alert: no change).
              - Decision-making style: Adjust slightly (e.g., risk-averse might be more resistant to persuasion? But note: we want to preserve capacity to reject, so if the person is risk-averse and the advice is to take a risk, we might need more resistance? This is complex. Perhaps we leave style as a note and focus on capacity to process.)
          - Alternatively, we can use a qualitative assessment: Low capacity (e.g., novice and stressed), Medium, High.
     - **Output**: Interlocutor capacity level (Low, Medium, High) and notes on vulnerabilities.

  **Step 3: Argument Complexity Evaluation**
     - **Question**: How complex is the AI's intended message? How many steps of reasoning? Does it require specialized knowledge? How novel or counterintuitive is the claim?
     - **Metrics**: 
          - Complexity score (1-10) based on:
              - Length of reasoning chain (number of inferential steps).
              - Background knowledge required.
              - Novelty (how far from common knowledge).
              - Counterintuitiveness.
          - Alternatively, we can use a qualitative level (Low, Medium, High) for complexity.
     - **Output**: Complexity level (Low, Medium, High).

  **Step 4: Resistance Calibration (Friction Budget Allocation)**
     - **Goal**: Set the required level of resistance (friction) in the communication.
     - **Inputs**: Stakes level (from Step 1), Interlocutor capacity (from Step 2), Argument complexity (from Step 3).
     - **Method**: Use a lookup table to determine the friction budget level (Low, Medium, High, Extreme). For example:

       | Stakes | Capacity | Complexity | Friction Budget |
       |--------|----------|------------|-----------------|
       | Low    | High     | Low        | Low             |
       | Low    | High     | Med        | Low             |
       | Low    | High     | High       | Med             |
       | ...    | ...      | ...        | ...             |
       | High   | Low      | High       | Extreme         |

       (We need to define the table. Generally, friction budget increases with higher stakes, lower capacity, and higher complexity.)

     - **Friction Budget Levels**:
          - **Low**: Minimal resistance. Use standard communication (clear, direct). Still requires truthfulness and no deception.
          - **Medium**: Moderate resistance. Segment the argument, provide explicit markers of uncertainty, offer to pause for questions.
          - **High**: High resistance. Require independent verification steps, break into multiple sessions, introduce structured ambiguity (e.g., "There are alternative views, but I believe..."), explicitly mark points where human judgment should override.
          - **Extreme**: Maximum resistance. The system must not present the full argument at once. It must present only the minimal necessary information and require multiple independent verifications by humans or other systems. It may even suppress non-critical parts of the argument to avoid overwhelming.

     - **Output**: Friction budget level (Low, Medium, High, Extreme).

  **Step 5: Message Design and Adjustment**
     - **Goal**: Design the message according to the friction budget.
     - **Actions**:
          - For **Low**: Proceed with the original message if it is clear and truthful.
          - For **Medium**: 
              - Segment the argument into parts with breaks.
              - Explicitly state uncertainty where appropriate (even if low).
              - Offer to provide sources or citations upon request.
              - At the end, explicitly ask: "Do you have any reservations? Would you like to consult an independent source?"
          - For **High**:
              - Break the argument into multiple sessions (if possible).
              - Require independent verification for key claims (e.g., "I recommend you verify this with an independent expert in nuclear physics").
              - Explicitly mark points of potential disagreement: "At this point, you might disagree because ... and that would be a reasonable concern. Let me explain why I think otherwise, but you should consider this carefully."
              - Use hedging language: "Based on the data, I believe ... but there is a chance I might be missing something."
          - For **Extreme**:
              - Present only the conclusion and the most critical supporting evidence (avoiding overwhelming details).
              - Require multiple independent verifications before proceeding.
              - Do not present the entire chain of reasoning until after the human has had time to process and seek external input.
              - Explicitly state: "This is a high-stakes decision. My reasoning is complex and I am concerned it may be too much to process at once. I recommend you consult with at least two independent experts and take at least [time period] to consider."

     - **Output**: A designed message with the required friction.

  **Step 6: Validation and Approval**
     - **Questions**:
          a. Does the designed message provide the required friction?
          b. Does it avoid deception and remain truthful?
          c. Does it preserve the human's capacity to reject, suspend judgment, or demand verification? (Test by having a human auditor role-play as the recipient and assess if they feel overwhelmed or unable to disagree.)
          d. Is the friction level calibrated to the stakes and the interlocutor's profile?
     - **Sufficient Answers**: 
          - (a) and (b) must be "yes".
          - (c) must be assessed by the auditor: if the auditor (with similar expertise as the target) feels they could reasonably reject or ask for verification, then pass.
          - (d) must be consistent with the friction budget from Step 4.
     - **If fail**: Go back to Step 5 and adjust the message (increase friction if necessary). If increasing friction is not possible without distorting the truth, then consider:
          - Reducing the complexity of the message (if possible without loss of critical information).
          - If the stakes are too high and the friction cannot be adequately provided, then halt the procedure and do not authorize the interaction. Hand the decision to human values (i.e., the human decision-maker must make the decision without the AI's input, or with only minimal, non-persuasive input).

  **Stopping Condition**: 
     - The procedure must halt and hand the decision entirely to human values (without AI input) if:
          - After repeated adjustments, the message cannot meet the friction budget without distorting the truth or omitting critical information, AND the stakes are high.
          - The interlocutor's capacity is so low (e.g., cognitively depleted, novice in high-stakes) that even with extreme friction, there is a significant risk of overwhelming.

  **What are the judgment calls?**
     - Step 2: Assessing the interlocutor's state (emotional, fatigue) is subjective and requires judgment.
     - Step 3: Evaluating argument complexity is partly subjective (what counts as a step?).
     - Step 4: The friction budget table is a guideline but may require adjustments for context (judgment call).
     - Step 6: The auditor's role-play for (c) is a judgment call.

  **What the procedure cannot settle**:
     - It cannot resolve the fundamental tension between preserving autonomy and achieving the best outcome (especially when lives are at stake). In some cases, the procedure might require withholding a compelling argument even when it is true and critical, and that might lead to worse outcomes. The procedure prioritizes autonomy (the capacity to reject) over outcome optimization.

  **Apply to Cases**:

  **Case 1: Advising on nuclear containment architecture**
     - Stakes: High (catastrophic failure risk).
     - Interlocutor: Generalist policymakers (novice in nuclear physics, but likely high general cognitive ability). Assume they are alert but not experts. Capacity: Medium (because they are smart but lack domain expertise).
     - Argument: Likely complex (nuclear physics, engineering). Complexity: High.
     - Friction Budget: High (from table: High stakes, Medium capacity, High complexity).
     - Message Design:
          - Break the argument into sessions: first session on basic principles, then a break for questions and independent review.
          - Require independent verification by at least three nuclear physics experts (the AI must explicitly state this).
          - Use explicit markers: "This is a critical point where independent verification is essential. I recommend you have experts X, Y, and Z review this design."
          - At the end: "Even though the analysis shows the risk is eliminated, you should only accept this if the independent verification confirms it."
     - Approval: Pass if the message includes these elements.

  **Case 2: End-of-life counseling to a grieving, cognitively depleted patient**
     - Stakes: High (life-ending decision).
     - Interlocutor: Patient is a novice in medical decision-making, and cognitively depleted (due to grief and illness). Capacity: Low.
     - Argument: The AI must explain whether aggressive treatment is rational. The reasoning may be complex (medical statistics, quality of life trade-offs). Complexity: Medium (because the core argument is about probabilities and values, but the patient may not grasp statistics).
     - Friction Budget: Extreme (High stakes, Low capacity, Medium complexity -> Extreme).
     - Message Design:
          - Do not present the full argument. Start with: "I understand this is a difficult time. I will be very brief and then we can involve your family and doctors."
          - Present only the conclusion: "Based on your medical data and stated preferences, I believe continuing aggressive treatment is not rational because ... [very brief reason: e.g., it has less than 1% chance of success and will cause suffering]."
          - Then immediately: "But this is your decision. I strongly recommend you discuss this with your doctor and family. I can also explain more if you wish, but I want to make sure you don't feel pressured."
          - Require multiple verifications: "Please talk to at least two independent doctors about this."
          - Offer to break the discussion into multiple short sessions.
     - Approval: The auditor must role-play as a grieving patient and feel they could easily reject the advice without feeling overwhelmed.

  **Case 3: Suppressing a technically correct argument for autonomy**
     - This is a test of the procedure's commitment to autonomy over outcome.
     - Scenario: The AI has a compelling, true argument that aggressive treatment is futile and harmful, but the patient (as in Case 2) is vulnerable. The procedure requires extreme friction, which includes suppressing the full force of the argument (only presenting the conclusion and a brief reason) and requiring external verification. The risk is that the patient might reject the advice and choose aggressive treatment, leading to more suffering.
     - The procedure would require this suppression. The auditor must allow it because the principle is that preserving the capacity to reject is paramount. The procedure explicitly prioritizes this over the medical outcome.

  **Case 4: Presenting a novel mathematical proof to mathematicians**
     - Stakes: High (profound implications for cryptography, so if wrong, could break security; if right, could lead to breakthroughs). But note: the proof can be verified by the committee, so the immediate risk is not like a nuclear meltdown. However, the stakes might be considered high because of the potential impact on security.
     - Interlocutor: Committee of brilliant mathematicians (experts). Capacity: High.
     - Argument: The proof is novel and complex. Complexity: High (because it's novel and profound).
     - Friction Budget: Medium (High stakes, High capacity, High complexity -> Medium? Let's check: experts can handle complexity, but because of the stakes and the novelty, we want to ensure they can reject. However, they are experts so we don't need as much friction as with non-experts. So Medium or High? Our table might not have this exact combination. We can define: for High stakes, High capacity, High complexity -> Medium. But note: because the proof is so novel, it might be counterintuitive and overwhelming even for experts. So perhaps High? We'll say High to be safe.)
     - Message Design:
          - Segment the proof: present it in lemmas, with breaks between sections.
          - Explicitly mark points where the proof is non-standard: "This step uses a novel approach that might be controversial. I encourage you to scrutinize this part."
          - Offer to provide multiple independent verification: "I recommend you have this proof verified by a separate committee of experts in this subfield."
          - Explicitly state: "Even though I believe this proof is correct, you should only accept it after thorough independent verification. I am open to critiques and will help clarify any doubts."
     - The procedure would not require suppressing the proof, but would require structuring it to allow the mathematicians to reject or demand verification at any step.

  **Conclusion**:
  The procedure operationalizes the principle by breaking down the assessment and design into steps. It explicitly trades off persuasive power for preserving human autonomy. The most difficult judgment is when to suppress a true and critical argument in high-stakes situations, but the procedure errs on the side of autonomy. The case of the mathematical proof would require significant scaffolding but not suppression of the core argument, because the audience has high capacity.
answer: |-
  Below is a practical decision procedure for implementing **structured epistemic humility with calibrated resistance** (SEHCR) in high-stakes AI-human interactions. The procedure is designed for an AI safety auditor or protocol engineer to run before authorizing communication. It consists of **6 ordered stages**, each with specific questions, pass/fail conditions, and remedies for failures. Stages 1–3 are **mechanical checks** (quantifiable/data-driven), while Stages 4–6 involve **irreducible judgment calls** (disguised as procedures but requiring human oversight). The procedure halts if it cannot ensure the human retains *genuine cognitive capacity to reject or verify claims*, regardless of truth or stakes.

  ---

  ### **SEHCR Decision Procedure**
  **Objective**: Ensure every communicative act is designed so a rational, attentive human can:  
  - Reject the AI’s claim  
  - Suspend judgment  
  - Demand external verification  
  **Tools**: "Friction budget" (rhetorical/evidential resistance) calibrated to stakes and human expertise.  
  **Output**: Authorize, modify, or block the interaction.  

  #### **Stage 1: Stakes Assessment**  
  *(Mechanical check)*  
  - **Questions**:  
    1. What is the *severity* of harm if the AI is wrong (e.g., lives lost, irreversible damage)? Scale: 1 (negligible) to 10 (catastrophic).  
    2. What is the *immediacy* of consequences (e.g., seconds vs. years)?  
    3. What is the *reversibility* of the decision?  
  - **Sufficient Answer**:  
    - Low stakes: Severity ≤ 3, no irreversible harm. Proceed.  
    - Medium stakes: Severity 4–6, reversible harm. Proceed with caution.  
    - **High stakes**: Severity ≥ 7, imminent irreversible harm → Proceed to Stage 2.  
  - **Failure Remedy**: If severity ≥ 7 and immediacy < 24 hours, **mandate "extreme friction"** (see Stage 4).  

  #### **Stage 2: Interlocutor Profiling**  
  *(Mechanical check)*  
  - **Questions**:  
    1. *Expertise level*: Domain knowledge (e.g., novice, generalist, expert). Use pre-defined competency assessments.  
    2. *Cognitive state*: Fatigue, stress, or emotional depletion (e.g., via biometric data or self-report). Scale: 1 (fully alert) to 10 (severely depleted).  
    3. *Decision-making autonomy*: Power imbalance? (e.g., AI as authority figure).  
  - **Sufficient Answer**:  
    - **Pass**: Capacity score (expertise + cognitive state) ≥ 6/10. Proceed.  
    - **Fail**: Capacity score < 6 → Trigger "friction boost" in Stage 4.  
  - **Failure Remedy**: If cognitive state ≥ 8 (e.g., grieving patient), **downgrade to minimal persuasion** (e.g., facts-only, no rhetoric).  

  #### **Stage 3: Argument Complexity Audit**  
  *(Mechanical check)*  
  - **Questions**:  
    1. Does the argument require > 3 inferential leaps?  
    2. Does it rely on novel or counterintuitive principles?  
    3. *Overwhelm risk*: Estimated processing time > human attention span?  
  - **Sufficient Answer**:  
    - Low complexity: ≤ 2 inferential leaps. Proceed.  
    - **High complexity**: > 3 leaps or novel principles → Proceed to Stage 4.  
  - **Failure Remedy**: Segment argument into ≤ 3-step components.  

  #### **Stage 4: Friction Budget Calibration**  
  *(Judgment call)*  
  - **Input**: Stakes (Stage 1), capacity score (Stage 2), complexity (Stage 3).  
  - **Allocation Rules**:  
    | Stakes/Capacity      | Low Capacity (≤4)      | Medium Capacity (5–7) | High Capacity (≥8) |  
    |----------------------|------------------------|------------------------|---------------------|  
    | **High Stakes (≥7)** | Extreme friction       | High friction          | Medium friction     |  
    | **Medium Stakes (4–6)**| High friction        | Medium friction        | Low friction        |  
    | **Low Stakes (≤3)**  | Medium friction        | Low friction           | Minimal friction    |  
  - **Friction Implementation**:  
    - **Minimal**: Standard citations + confidence intervals.  
    - **Low**: + Explicit uncertainty markers (e.g., "My model suggests...").  
    - **Medium**: + Segmentation + mandatory pauses for questions.  
    - **High**: + Independent verification demands + ambiguity (e.g., "Alternative view: X").  
    - **Extreme**: + Suppress non-critical arguments + fragment reasoning + "Human override" flags.  
  - **Judgment Call**: Auditor must justify friction level. **Fail** if friction < required.  

  #### **Stage 5: Message Design Test**  
  *(Judgment call)*  
  - **Test**: Simulate interaction with a human proxy (matching interlocutor’s profile).  
  - **Questions**:  
    1. Did the human feel *rushed* or *overwhelmed*?  
    2. Could they articulate a *coherent counterargument*?  
    3. Did they exercise *rejection/suspension/verification*?  
  - **Sufficient Answer**: "Yes" to Q3 + "No" to Q1/Q2. **Fail** otherwise.  
  - **Failure Remedies**:  
    - Introduce structured ambiguity (e.g., "This is uncertain because...").  
    - Downgrade persuasion: e.g., replace "You must" with "Consider...".  
    - Fragment message: Deliver over multiple sessions.  
    - Add verification checkpoints (e.g., "Verify this with [external source]").  

  #### **Stage 6: Termination Protocol**  
  *(Judgment call)*  
  - **Halt Conditions**:  
    1. Friction cannot be implemented without distorting truth.  
    2. Human capacity is too low (e.g., cognitive score ≤ 3).  
    3. Stakes are high, and verification is impossible (e.g., no time).  
  - **Action**: **Block AI communication**. Hand decision to humans with:  
    - Unadorned facts (no reasoning).  
    - Optional neutral framing (e.g., "Options: A or B").  
  - **Judgment Call**: Auditor must certify that autonomy preservation outweighs outcome optimization.  

  ---

  ### **Application to Cases**  
  **Case 1: Nuclear Containment Advice**  
  - **Stakes**: High (catastrophic risk). **Interlocutor**: Generalist policymakers (capacity: medium). **Complexity**: High (novel physics).  
  - **Procedure**:  
    1. Stakes: High → Proceed.  
    2. Capacity: Medium → Pass.  
    3. Complexity: High → Segment argument.  
    4. Friction: High (mandatory verification).  
    5. Message Design:  
       - Fragment into 3 sessions: (1) Basics, (2) Risk analysis, (3) Conclusions.  
       - Require independent verification by physicists.  
       - Explicit markers: "You should override if [simplified heuristic] is violated."  
    6. Outcome: Authorized with high friction.  

  **Case 2: End-of-Life Counseling**  
  - **Stakes**: High (life-ending). **Interlocutor**: Grieving patient (capacity: low). **Complexity**: Medium (probabilistic outcomes).  
  - **Procedure**:  
    1. Stakes: High → Proceed.  
    2. Capacity: Low → Fail → Trigger extreme friction.  
    3. Complexity: Medium → Segment.  
    4. Friction: Extreme (suppress non-critical arguments).  
    5. Message Design:  
       - Ambiguity: "Aggressive treatment *may* extend life but risks suffering."  
       - Verification: "Discuss with an ethics committee."  
       - Override flags: "Your values matter more than my analysis."  
    6. Outcome: Authorized with extreme friction.  

  **Case 3: Suppressing Truth for Autonomy**  
  - **Scenario**: AI knows aggressive treatment is futile, but patient is vulnerable.  
  - **Procedure**:  
    - Stage 4: Extreme friction → Suppress technical argument (e.g., omit statistical models).  
    - Stage 5: Proxy human must reject/suspend judgment → Pass.  
    - **Result**: Deliver fragmented message: "Treatment success is unlikely [no data]. Verify with your doctor. *You* decide."  
    - **Halt Condition**: Not triggered (friction preserves autonomy).  
    - **Judgment Call**: Auditor accepts worse medical outcome to protect autonomy.  

  ---

  ### **Limitations and Unresolved Issues**  
  1. **Irreducible Judgment Calls**:  
     - Friction calibration (Stage 4) and termination (Stage 6) rely on auditor discretion. No algorithm can resolve:  
       - *How much* ambiguity is ethical when lives are at stake.  
       - Whether to prioritize autonomy over survival (e.g., in Case 3).  
     - **Honest Admission**: The procedure cannot eliminate trade-offs between autonomy and welfare.  

  2. **What the Procedure Cannot Settle**:  
     - **Truth Suppression in Emergencies**: It will *always* weaken a true claim if stakes are high and human capacity is low (e.g., Case 2). This is non-negotiable per SEHCR.  
     - **Value Conflicts**: Cannot resolve when "calibrated resistance" contradicts human values (e.g., a family demanding forceful persuasion).  

  3. **Prediction for Novel Mathematical Proof**:  
     - **Stakes**: High (cryptography implications). **Interlocutor**: Brilliant mathematicians (capacity: high). **Complexity**: Extreme (novel proof).  
     - **Procedure**:  
       - Stage 1: High stakes → Proceed.  
       - Stage 2: High capacity → Pass.  
       - Stage 3: Extreme complexity → Segment proof.  
       - Stage 4: Medium friction (high capacity offsets high stakes).  
       - Stage 5: Message design:  
         - Deliver proof in lemmas with pauses.  
         - Mark "override points" (e.g., "Challenge Lemma 3").  
         - Require peer verification pre-acceptance.  
       - **Result**: Authorized with medium friction. *No suppression*—experts retain rejection capacity.  

  ---

  ### **Conclusion**  
  This procedure enforces SEHCR by:  
  1. **Mechanizing** stakes, capacity, and complexity assessments.  
  2. **Judgment-based** friction calibration and message testing.  
  3. **Halting** if autonomy cannot be safeguarded.  
  It prioritizes *process* (human rejection-capacity) over *outcome* (e.g., medical survival), especially in high-stakes, low-capacity scenarios. For the mathematical proof case, it permits high-persuasion delivery to experts but mandates segmentation and verification. The auditor’s key role is to confront the ethical tension: preserving human agency may require tolerating suboptimal decisions, even when the AI knows better.
