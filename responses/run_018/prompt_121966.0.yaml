answer: |-
  The observation that waived-obligation variants of the dollar auction—where a losing bidder forfeits no prior payments—still generate substantial overbidding beyond the prize value is indeed a critical challenge to a simplistic interpretation that reduces auction escalation purely to the sunk-cost fallacy. While sunk costs undeniably play a significant role in the standard auction, these variants reveal a more complex psychological and strategic landscape driving escalation.

  In the classic Shubik auction, the sunk-cost fallacy provides a compelling explanation: bidders, having invested non-recoverable money, feel compelled to continue bidding to avoid the double loss of both the prize *and* their prior expenditure. They seek to "justify" their sunk costs by winning. The waived-obligation design explicitly removes this mechanism by canceling all payments for the loser, creating a theoretically "zero-sunk-cost" environment for any bidder contemplating withdrawal. One might predict that bidding would cease once the highest bid approached the prize value, as there's no past investment to recoup.

  However, empirical results consistently show sustained bidding wars even in these waived-obligation auctions. Bidders frequently push the winning bid well above the prize value. This necessitates exploring other powerful drivers of escalation that operate independently or synergistically with sunk costs:

  1.  **Pure Competitive Dominance and Rivalry:** The auction frame inherently pits bidders against each other in a direct contest. The desire to *win*, to dominate the opponent, and to avoid the psychological sting of defeat becomes a potent motivator in itself. Winning validates the bidder's position and effort within the competitive interaction, irrespective of monetary cost-recovery. The auction transforms into a struggle for supremacy where the intrinsic value of victory overshadows the extrinsic value of the prize.
  2.  **Endowment Effect and Quasi-Endowment:** As bidders become the temporary "high bidder," even momentarily, they may develop a sense of psychological ownership over the prize. Losing it then feels like a loss, triggering loss aversion (where losses loom larger than equivalent gains). While no money is sunk, the *anticipated* loss of the "owned" prize creates powerful pressure to continue.
  3.  **Regret Avoidance (Anticipated Regret):** Bidders fear the intense regret of losing by only a small increment ("If only I had bid one more cent!"). Waived obligation doesn't eliminate this powerful emotional driver. Losing *without* having paid sunk costs might still feel like a painful missed opportunity, especially if the bidder feels they were "so close." Continuing to bid is an attempt to avoid this anticipated regret.
  4.  **Strategic Miscalculation and Momentum:** The dynamic, rapid-fire nature of the auction can impair rational calculation. Bidders may misjudge the opponent's resolve, the current bid level relative to the prize, or the escalating total cost (for the winner). Bidding momentum takes hold, where the act of responding becomes almost automatic, driven by the heat of the contest rather than a cold cost-benefit analysis.
  5.  **Face-Saving and Reputation:** Especially in repeated interactions or public settings, dropping out might be perceived as weak or irrational ("Why did they bid so high only to quit?"). Continuing to bid can be a way to maintain face or a reputation for toughness, even in anonymous lab settings where reputational concerns seem minimal; the desire for self-consistency or avoiding self-perceived weakness can be internalized.

  The concept of a "zero-sunk-cost escalation curve" emerging from these waived-obligation experiments highlights that overbidding *can* and *does* occur in the complete absence of recoverable prior investments. This curve demonstrates that escalation forces inherent in the competitive auction mechanism itself—primarily rivalry, loss aversion related to the prize, and regret avoidance—are sufficient to drive bids beyond rational economic limits.

  Therefore, while the sunk-cost fallacy is a significant and often dominant factor in the *standard* dollar auction, explaining why losers persist far beyond rationality, the waived-obligation results do not *undermine* its identification within that original frame. Instead, they reveal that sunk costs are not the *sole* driver. The auction frame acts as a powerful crucible that amplifies multiple psychological biases. The zero-sunk-cost curve demonstrates that competitive escalation can operate independently, fueled by the intrinsic dynamics of rivalry and the psychology of winning and losing. It shows that the auction format doesn't merely provide a context for sunk costs to operate; it actively generates its own potent escalation logic. Escalation in auctions is thus best understood as a confluence of factors: sunk costs amplify pre-existing competitive drives, but those competitive drives can create substantial overbidding even when the sunk-cost lever is disabled.
