  First, I need to recall Wittgenstein's key ideas. He distinguishes religious belief from empirical hypotheses—it's not testable like a prediction. Instead, it's grammatical, shaping practices within a form of life. The user worries this reduces faith to mere convention, like choosing chess over checkers, which undermines its depth.  

