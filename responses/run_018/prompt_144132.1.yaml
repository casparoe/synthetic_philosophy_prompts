  okay so i've been chewing on indirect normativity lately—like the idea that rationality applies to your deliberation procedual rather than the actual move you make. it's one of those concepts that feels deep until you try to apply it and then it gets all wobly. I was arguing with my roommate about whether idealized deliberation is actually doing any work, or if it's just direct normativity wearing a hat and calling itself fancy.

  here's the specific angle: suppose we model idealization not as stripping away biases, but as running them through a symmetric amplification filter—so your risk aversion and your overconfidence both get scaled up by the exact same factor until they hit a reflective fixed point. under that model, indirect norms that say "deliberate well" don't leave any procedural wiggle room, because the amplification collapses all variance into one deterministic output. that makes indirect normativity redundant; it describes the same actions as direct norms but with extra steps.

  can you argue rigorously for that redundancy claim? and also tackle the objection that even when outputs match, the normative status differs—like being shoved into the right answer by direct command versus arriving there through a perfectly mirrored deliberation. I don't want a bibliography or citations, just the argument standing on its own feet. also I know I misspelled a word or two but you get the idea.
