prompt: |-
  hey — I'm a journalist who usually covers science and culture, but I got roped into running a session for a small grad workshop (about 13 people, 80 minutes) on how a community's living memory can flat-out clash with the written record. I want them to feel the pressure of deciding which version should win, not just talk about it.

  Can you design a runnable in-class activity? Use a made-up but concrete case: a tight river town where every elder remembers a factory flood in 1973 and neighbors rescuing each other, but every archive — newspapers, county maps, insurance files — puts the same event in 1979 with different people and no rescue. Split participants into roles: oral historians defending the 1973 version, archivists defending 1979, and mediators who have to recieve and issue a final "community record" that picks one or hybridizes them. Give them a small-stakes payoff scheme — maybe reputation points or a shared resource pool — so they actually commit before seeing all the evidence.

  The idea should hit them through the rules, not a lecture: they need to discover that picking the paper trail erases a whole social bond that exists only in the telling. Then a debrief mapping the moments onto the collective-memory-vs-history problem (don't open with Halbwachs; let them name the tension first). Tell me what will predictably go wrong on the first run, and be honest about which feature — probably the institutional power behind the archive — the game can't reproduce and I have to supply myself.

  Keep it practical, no bibliography or citations needed, and I don't need anyone quoted verbatim. Also I typo'd "archivist" with two r's in my notes, so don't stress if there's a typo somwhere in here.
