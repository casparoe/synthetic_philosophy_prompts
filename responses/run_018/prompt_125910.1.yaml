answer: |-
  Here's a tight, runnable activity designed for discovery and tension in 80 minutes:

  **Activity Title:** The Riverbend Flood Records - Whose Story Holds Water?

  **Core Conflict:** Oral History (1973 Rescue) vs. Archival Record (1979 No Rescue)

  **Participants:** 13 Grad Students
  *   **Oral Historians (OH Team - 5 students):** Defend the 1973 flood & rescue narrative. Their identity and community bonds rely on this story.
  *   **Archivists (AR Team - 5 students):** Defend the 1979 flood date & official record. Their professional integrity relies on documented evidence.
  *   **Mediators (MED Team - 3 students):** Must produce a SINGLE official "Community Record" (1973, 1979, or Hybrid) by the end. They *receive* arguments and evidence.

  **Stakes System (The Riverbend Fund):**
  *   Each team starts with 10 "Community Trust Points" (CTP).
  *   **OH Goal:** Preserve the rescue narrative. Lose 5 CTP if the "Community Record" states *no rescue occurred*. Lose 2 CTP if the date is listed as *only* 1979.
  *   **AR Goal:** Uphold documented accuracy. Lose 5 CTP if the date is listed as *only* 1973. Lose 2 CTP if the rescue is stated as *fact* without archival evidence.
  *   **MED Goal:** Achieve consensus. Lose 5 CTP if no agreement is reached by the deadline. *Gain* 2 CTP per team that feels "heard" (assessed secretly by MED after).
  *   **Shared Pool:** Total remaining CTP after the record is issued determines access to a fictional "Riverbend Community Grant" (e.g., 25+ CTP = Full Funding, 15-24 = Partial, <15 = No Funding). This incentivizes SOME cooperation.

  **Materials (Prep Ahead):**
  1.  **Role Sheets:** Brief descriptions of team goals, stakes, and starting position.
  2.  **Evidence Packets (Confidential to each team):**
      *   **OH Packet:** Quotes from 3 fictional elders (emotional, vivid details about 1973 rescue, specific neighbors helping, watermarks on *old* houses). *Include 1 minor contradiction (e.g., weather description).*
      *   **AR Packet:** Facsimiles - 1979 newspaper clipping (date, damage, no rescue mentioned), 1979 insurance claim map (showing flood zone), 1979 county flood declaration. *Include 1 gap (e.g., no detailed casualty list, map has a smudged area).*
  3.  **Mediator Brief:** Instructions, CTP tracking sheet, "Community Record" template.
  4.  **Timer, Whiteboard/Flip Chart (for MED final record).**

  **Procedure (80 Mins):**

  1.  **Intro (5 mins):** "Welcome to Riverbend. You're tasked with establishing the definitive record of the Great Flood. You have distinct roles and goals. The future of the community depends on your decision. Your evidence packets contain everything you know *right now*. Go."
  2.  **Team Prep (15 mins):** Teams review evidence, strategize arguments, identify strengths/weaknesses in *their own* AND *anticipated opposing* evidence. OH & AR prepare opening statements for MED.
  3.  **Mediation Session 1: Hearing the Sides (15 mins):**
      *   MED invites OH & AR (one spokesperson each) to present their core case (5 mins total per side).
      *   MED asks clarifying questions ONLY (5 mins). Focus: *What's the core truth each side needs preserved?*
  4.  **Negotiation & Scrutiny (25 mins):**
      *   **OH & AR Direct Negotiation (15 mins):** Teams engage directly. Can challenge evidence, offer compromises, emphasize stakes (CTP loss!). MED observes silently, takes notes. *Key Tension:* Archivists push documents; Oral Historians push lived experience/social meaning.
      *   **MED Deliberation & Drafting (10 mins):** MED team huddles. Drafts a proposed "Community Record" (Date? Rescue Mentioned? How?) based on what they heard/observed. Considers CTP implications.
  5.  **Mediation Session 2: Proposal & Decision (10 mins):**
      *   MED presents draft record to OH & AR.
      *   Brief final comments from OH & AR (2 mins total per side) - Last chance to influence.
      *   MED finalizes the "Community Record" and posts it publicly (whiteboard).
  6.  **Settlement & Scoring (5 mins):** Teams calculate CTP loss/gain based on the final record. MED tallies total CTP for the Riverbend Fund outcome. Announce result (e.g., "Partial Funding Secured!").
  7.  **Debrief (15 mins - CRITICAL):** *Guide them to name the core tension.*
      *   "What was the most difficult part of reaching a decision?"
      *   "Oral Historians: What did you feel was at stake *beyond* the date/rescue? Archivists: What pressure did you feel?"
      *   "Mediators: What made compromise hard? Where did you feel pulled?"
      *   "What gets *lost* if we only use the documents? What gets *risked* if we only use the stories?" (Push for "social bonds," "meaning," "identity," "community cohesion").
      *   "When the record was finalized, did anyone feel erased? Validated? What does that tell us about real communities?"
      *   **Only THEN:** "This tension has a name: Collective Memory vs. Institutional History/Hegemony (Halbwachs, Foucault). The 'social bond' you felt erasing *is* the power of collective memory. The archive's weight represents institutional authority. Neither is simply 'wrong'."

  **Predictable First-Run Issues & Solutions:**

  1.  **OH & AR Talk Past Each Other:** Archivists dismiss stories as "unreliable"; Oral Historians dismiss documents as "cold" or "wrong." *Solution:* MED's role in Session 1 ("What core truth must be preserved?") forces listening. Stakes (CTP loss) force engagement.
  2.  **MED Team Overwhelmed/Indecisive:** 3 people drafting under time pressure is hard. *Solution:* Give MED a clear template to fill in (Date: ____, Rescue Mentioned: Yes/No/Qualified Description: ____). Focus them on *structure*.
  3.  **Ignoring Minor Evidence Flaws:** Teams might bulldoze with their strongest points. *Solution:* Debrief explicitly asks about contradictions/gaps ("Did anyone spot the smudged map/weather discrepancy? How did you handle it?").
  4.  **Focusing Only on Date, Ignoring Rescue:** The rescue is the *emotional/social* core. *Solution:* Stakes explicitly punish losing the rescue (OH -5 CTP) or stating it as fact without evidence (AR -2 CTP). Debrief pushes on meaning.
  5.  **Rushing to a Superficial Hybrid:** "The flood happened sometime between 1973-1979, maybe there was a rescue?" *Solution:* Stakes penalize *both* OH & AR for compromises (e.g., OH loses 2 CTP for *only* 1979 date, AR loses 2 CTP for stating rescue as fact). MED needs to draft something specific. Debrief: "Did this hybrid feel satisfying? Or like a cop-out? Why?"

  **The Unreproducible Feature (Requires Your Voice):**

  *   **Institutional Power & Bias:** The activity shows the archive *has* weight and formality, but it *can't* fully replicate the systemic power behind institutional records – the funding, the perceived objectivity, the legal standing, the historical marginalization of oral histories (especially from working-class communities like Riverbend), the gatekeeping role of archivists/librarians/officials. The AR team *argues* for accuracy, but the game doesn't imbue their evidence with the inherent *authority* it holds in the real world.
  *   **What You Must Explicitly State in Debrief:** "In reality, the archive isn't just *evidence*, it's often *law*, it's *funding*, it's the *official story* with immense institutional backing. Oral histories, especially from marginalized groups, often struggle against this inherent power imbalance. The 'archive' in this game is neutral documents; in life, it's part of a power structure. The archivists here are advocates; in reality, the *institution* itself holds the power." Connect this to why choosing the 1979 record *feels* like erasure – it leverages that systemic power against lived experience.

  **Why This Works:**

  *   **Pressure:** The CTP stakes and shared fund create tangible consequences for their choices.
  *   **Discovery:** They *feel* the clash ("But the elders *know* it was '73!" / "But the newspaper *proves* it was '79!") and the loss (OH despair at losing the rescue, AR frustration at "ignoring facts").
  *   **Debrief-Led Learning:** They articulate the tension *before* you label it, making the theory resonate.
  *   **Focus:** The tight case study (date + rescue) keeps it manageable within 80 mins.
  *   **Practicality:** Minimal materials, clear roles, structured timing.

  **Run it tight, let the tension build, and debrief hard on the emotional and social costs they experienced. Good luck!**
