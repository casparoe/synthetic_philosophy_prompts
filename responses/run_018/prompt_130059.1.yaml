answer: |-
  You've cut to the core: **this is not a verbal dispute about "existence," but a profound, normative split about the purpose and ontology of mathematics.** The "stall" persists because constructivists and classicists aren't disagreeing about logic—they're pursuing fundamentally different intellectual projects. Splitting "selection" clarifies the technical divergence but *exposes* the irreconcilable normative rift. Here's the committed answer:

  ### 1. **The Core Split is Normative (Not Semantic)**
     - **Classical Mathematics** views math as the study of *abstract Platonic structures*. Truth and existence are discovered through deduction from axioms. AC is justified because it reveals deep structural truths (e.g., vector spaces have bases, sets can be well-ordered). Non-computable objects are unproblematic—they inhabit the Platonic realm independent of human cognition. *Mathematics is about universal truth, not human feasibility.*
     - **Constructivism** views math as the study of *mental constructions*. Existence requires explicit buildability. AC is rejected because it asserts structure without providing computational content. Banach-Tarski isn't "false"—it's *meaningless* as it describes no achievable decomposition. *Mathematics is an epistemic activity grounded in computation.*

     **→ The fight isn't about the word "existence"; it's about whether mathematics should model an objective reality *beyond* computation or be confined to what minds can compute.**

  ### 2. **Your "Split Selection" Proposal: It Reveals, Not Resolves**
     - **Algorithmic-selection** (constructivist): Requires a computable function.
     - **Structurally-guaranteed selection** (classicist): Demands only a logical guarantee (e.g., via AC or excluded middle).
     - **This clarifies the technical disagreement** but **magnifies the philosophical chasm**. Classicists see no need for algorithmic selection—structure *is* reality. Constructivists see structural guarantees without algorithms as *empty formalism*.  
     - **The "bump" moves to ontology**: Is mathematics fundamentally *about* structures that transcend computation? If yes, structural selection suffices. If no, it's inadequate.

  ### 3. **Why the Debate Never Moves: Incommensurable Goals**
     Both sides agree on formal consequences *syntactically* but assign them opposite *semantic values*:
     - Banach-Tarski, to a classicist, is a profound insight into the nature of ℝ³ under AC.  
     - To a constructivist, it's a reductio ad absurdum of classical set theory—proof it describes *nothing physical or mental*.  
     - **They share a language (ZFC) but not a worldview.** Classicists prioritize descriptive power and elegance; constructivists prioritize meaningfulness and applicability to computation.

  ### 4. **The Unavoidable Normative Question: What *is* Mathematics For?**
     - **Classical stance:** Math explores a transcendent logical universe. AC is indispensable for unifying topology, algebra, and analysis. Sacrificing it maims the body of mathematical truth.  
     - **Constructivist stance:** Math formalizes human thought and computation. AC introduces fictional entities, corrupting the link between math and tangible/mental reality.  
     - **No neutral ground exists.** One must choose: Is mathematics *descriptive* (revealing mind-independent realities) or *prescriptive* (a toolkit for building mental/computational objects)?

  ### The Committed Verdict
  **This is a real, irreconcilable split about the nature of mathematical reality.** Splitting "selection" sharpens the technical distinction but forces the normative question: *Should mathematics be ontologically committed to non-computable structures?*  

  - If you believe math's purpose is to **map an abstract cosmos** (regardless of computability), you accept AC and structural selections.  
  - If you believe math's purpose is to **formalize thought/computation**, you reject AC and demand algorithmic selections.  

  **The dispute isn't poorly posed—it's foundational.** Progress requires admitting these are *competing visions* for mathematics, not debatable claims within a shared framework. The choice is normative: What should mathematics *be*? Until that's confronted, forums will remain battlegrounds of mutual incomprehension.
