prompt: |-
  I was recently appointed to my city's heritage and naming commission, and the work has become personally relevant: my own home sits on a street named after a figure whose actions are now widely regarded as having caused serious harm. This has led me to think not just about monuments in public squares, but about the particular ethics of commemorative street naming—especially the problem that an address is not merely a symbol but a functional locator that residents must repeatedly invoke in daily life.

  Rather than a standard survey of monument debates, I am asking for the most important implications of the ethics of commemoration for practical commission work—specifically regarding retention, removal, and recontextualization—in light of a distinction that seems under-examined. Commemorative naming appears to do two things at once: it honors (which requires present endorsement) and it records (which requires only preservation of fact). But with street names, these functions are fused in a single practical token; there is no neutral "archival mode" for an address, since it must remain usable. This creates what I will call an "addressal burden": current residents bear a symbolic association they never consented to, merely by stating where they live. Meanwhile, removal risks erasing the historical record of what values were once publicly affirmed, yet retention risks present endorsement.

  Please describe the most important implications of this landscape for how a commission should weigh these options. Treat the "addressal burden" idea seriously, but also examine whether it genuinely distinguishes street naming from statues or plaques in parks, or whether it applies more broadly. How should a commission navigate the asymmetry between honoring and recording when the commemorative medium is embedded in practical infrastructure?

  Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question. Please also state how confident you are in your claims and identify the specific point about which you are least certain.
reasoning: |-
  Okay, let me unpack this commissioner's query. They're grappling with the unique ethical tension in street naming where honorific and archival functions are inseparable in a daily-use identifier - what they aptly term the "addressal burden". This goes beyond typical monument debates by forcing residents to personally enact commemoration through routine address recitation.

  Hmm... the core challenge seems to be that street names lack a "neutral mode": you can't practically append footnotes to an address. When Mrs. Gonzalez says "I live on Smith Street", she's simultaneously locating her home and endorsing Smith's legacy - even if she finds it abhorrent. That performative aspect feels distinct from passive statues in parks.

  But is it really? Let me test that. A resident walking past a statue doesn't actively invoke it, whereas stating one's address is compulsory participation. The difference lies in the degree of coerced performativity. Still, plaques might share some burden if they're destination markers ("meet at the Jackson statue"). Least confident about whether this distinction holds universally.

  For commission work, this means:
  - Removal decisions must weigh administrative chaos against moral distress
  - Recontextualization is thorny but worth attempting (supplemental signage? QR codes?)
  - Renaming should prioritize resident agency - maybe opt-in systems or sunset clauses

  Biggest uncertainty: whether "addressal burden" applies equally in commercial vs residential contexts. A shopkeeper saying "Our store is on Wilson Ave" might feel less personal than someone stating their home address.
answer: |-
  Bottom line: Your commission must prioritize minimizing addressal burden through context-sensitive solutions—like recontextualization or phased renaming—while creating transparent historical records separate from functional addresses, as the fused honor/record function of street names uniquely forces residents into daily complicity.

  **Reasoning with Key Implications:**  
  1. **Addressal Burden as Decisive Factor**:  
     - Street names demand *active utterance* by residents (e.g., giving an address at a hospital or job interview), transforming passive exposure into performative endorsement. This distinguishes them from statues, which can be ignored or contextualized *in situ*.  
     - **Implication**: Retention without intervention is ethically untenable for figures causing serious harm. Burden severity should scale with the honoree’s harm and name ubiquity (e.g., a minor alley vs. a major thoroughfare).  

  2. **Mitigating Burden Without Erasure**:  
     - **Recontextualization** (e.g., adding interpretive signs at street corners) is often inadequate, as it doesn’t eliminate verbal repetition of the name.  
     - **Phased Renaming**: Prioritize opt-in changes for willing residents/businesses first, reducing disruption while acknowledging burden. Sunset clauses for full renaming after 5–10 years balance practicality and ethics.  
     - **Parallel Archiving**: Create a publicly accessible digital registry documenting original names, reasons for change, and historical context—decoupling record-keeping from functional addresses.  

  3. **Asymmetry in Honoring vs. Recording**:  
     - The honor function inherently overrides recording in daily use; no one says "formerly Stalin Avenue" in postal addresses. Commissions should:  
       - **Deprioritize retention** unless the figure’s legacy is overwhelmingly rehabilitated (rare).  
       - **Standardize harm assessments** using historian panels to evaluate "serious harm" claims objectively.  
       - **Redirect commemoration** to values (e.g., "Liberty Street") or lesser-known contributors if renaming, avoiding new honorifics.  

  4. **Broader Applicability of Addressal Burden**:  
     - While most acute for street names, it *partially* applies to infrastructure requiring self-identification (e.g., airports: "I flew via X Airport"). Statues or plaques lack this verbal coercion. Parks fall in between—naming may burden event organizers ("Meet at Y Park") but not residents directly.  

  **Confidence & Uncertainty**:  
  - **High confidence** in the ethical primacy of addressal burden and the need for separate archival systems.  
  - **Least certain** about scalable solutions for renaming logistics (e.g., cost-sharing for businesses, digital mapping updates). Pilot programs with community input are essential but untested at scale.  

  **Commission Action Framework**:  
  - **Retain** only if harm is negligible or context reshapes meaning (e.g., a street named for a contested figure now symbolizing resilience).  
  - **Recontextualize** as a temporary measure *only* with physical/digital markers explaining harm.  
  - **Remove/Rename** as the default for severe harm, using participatory budgeting to select new names and mitigate disruption.
