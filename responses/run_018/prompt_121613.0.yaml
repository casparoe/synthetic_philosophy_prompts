  First, their core query: weighing structural forces (class struggle) against random events/contingency in causing the Revolution. The "autocatalytic" analogy suggests they're already thinking like a scientist—seeing systemic feedback loops. The Varennes example is spot-on for contingency; Louis XVI's bungled escape genuinely was a game-changer. 

  Class struggle interpretation: Bourgeoisie vs. aristocracy, economic pressures, Enlightenment ideas as catalysts—all solid structural factors. But they’re right to question inevitability; if it were purely structural, why 1789? Why not earlier? Contingency fills that gap: harvest failures, royal incompetence, Necker’s dismissal. Varennes fits perfectly—Louis’ capture turned moderates against the monarchy, radicalising everything. 

