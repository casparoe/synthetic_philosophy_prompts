  Hi, I'm a retired chemist who's recently got into philosphy and history after retiring. I've been trying to make sense of the French Revoluton—was it basically inevitable class struggle, or did contingency and ideology do more of the work? People talk about revolutions devouring their children, but I wonder if that's like an autocatalytic reaction: once the old order collapses, the violence feeds on itself no matter what sparked it. Could you compare the class-struggle interpretation with the contingency interpretation—maybe using the flight to Varennes as an example of a random turning point—and tell me whether treating the Terror as autocatalytic actually sheds light on why revolutions turn on themselves? Please write in British English, and don't bother with references, I can't check them from here. (Sorry for the typo's—this tablet is ancient.)
