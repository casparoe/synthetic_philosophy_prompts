  We are facing a conceptual problem within a strict multiple-drafts framework that rejects any global workspace, central integrator, or shared temporal anchor. We must avoid the binding problem and focus on the issue of the subject of experience.

   The challenge: without any convergence mechanism, we have multiple modality-specific drafts (e.g., visual, proprioceptive, affective) that are locally processed and compete only locally. Each draft has its own timestamp (asynchronous) and there is no shared "now". The question is: what becomes of the subject? How can we speak of a unified owner of experiences?

   Example: 
   Consider a moment where:
     - The visual draft (with timestamp t1) represents a red apple falling from a tree.
     - The proprioceptive draft (with timestamp t2, where t2 is slightly after t1) represents the subject's hand reaching out.
     - The affective draft (with timestamp t3, which might be between t1 and t2) represents a feeling of anticipation.

   In a standard model, these would be bound together to form the experience of seeing the apple fall and reaching for it with anticipation. But in our strict architecture, they never converge. The visual draft might lead to a motor response (reaching) without any integration with the proprioceptive or affective drafts. Each draft is processed in its own domain and may trigger separate behavioral responses.

   The problem of subjectivity: 
   Without convergence, there is no single point where the "I" that sees the apple is the same as the "I" that reaches and the same as the "I" that feels anticipation. The subject is fragmented. There is no owner of all these experiences at once, because they are not co-present in any system. The subject would be distributed and asynchronous, so the sense of being a single subject having a unified experience at a moment would be an illusion without even a global illusion (because there's no global workspace to create that illusion).

   Why this is not the binding problem:
   The binding problem typically concerns how different features (e.g., color, shape, motion) of a single object are combined in perception. Here, the issue is about the subject of experience: how can we say that the same subject is having multiple experiences at different times (asynchronously) and across modalities without any integration? It is a problem of subjective unity and ownership, not of object representation.

   This tension might strengthen Dennett's view because he argues that the self is a narrative fiction. In this fragmented architecture, the self would be an even more distributed and disunified construct. However, it could also be seen as weakening the view if we consider that without even a minimal form of unity (like a global workspace providing a temporary "stage"), the very idea of subjective experience (as we know it) might not emerge.

   Diagnostic case:
   Imagine an experiment where a subject is exposed to three stimuli in quick succession but in different modalities (e.g., a flash of light, a beep, and a light touch on the skin). The stimuli are timed such that in normal conditions they would be perceived as simultaneous. In our strict architecture, each modality would process the stimulus independently and with its own processing delay, so the timestamps would be different. We then ask the subject: "Did these happen at the same time?" and also "Did you experience them as happening to you at the same time?" 

   In a system without any global convergence, the subject might not be able to report on the simultaneity because there is no mechanism to compare the timestamps across modalities. Moreover, the sense of ownership for each experience would be tied to the modality-specific draft. The subject might report the light, the sound, and the touch as separate events happening to separate "subjects" (if they could report at all without a unified report mechanism). But note: Dennett might say that the report mechanism itself is just another draft, and that the narrative of simultaneity is constructed post-hoc. However, the deeper problem is that without any convergence, the reports might be inconsistent and lack the first-person perspective of a single subject.

