prompt: |-
  hey so I'm in this interfaith dialogue group and every time someone asks whether the resurrection report is historially credible, one guy shuts it down with "religious belief is a form of life, not a set of propositions" — like that settles whether the claim can be wrong. I want to bring a disambigution menu to next meeting so we can actually talk instead of talking past eachother.

  Act as a philosopher of religion who actually reads Wittgenstein in context, not just tumblr quotes. First brainstorm the distinct precise claims that slogan could be expressing, then lay them out as a list I can use in discussion. For each reading say: is it trivial? Substantive and defensible? False? And crucially, does it actually support dismissing historicial questions about the resurrection, or is my friend misapplying it?

  I especially want you to cover whether "form of life" here means (i) an unreasoned social habit, (ii) a framework that sets internal standards for what's reasonable, or (iii) a non-cognitive emotional stance — since those three do totally different work when someone tries to block evidence-based critique. Keep it tight: max 350 words, one short paragraph per reading, no bibliography or citations since this is for an offline discussion group and I can't look anything up on my phone. Don't just defend the slogan; include the radical and false readings too. Please think carefully about which version actually protects releigious claims from historical scrutiny and which just changes the subject.
