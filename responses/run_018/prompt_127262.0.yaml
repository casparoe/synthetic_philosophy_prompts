answer: |-
  Here's your disambiguation menu for "religious belief is a form of life, not a set of propositions," tailored for your group discussion:

  1.  **Reading 1: "Form of Life" as Unreasoned Social Habit:** Belief is just a deeply ingrained cultural practice, like a custom, passed down without rational basis. **Status:** Trivial & False. Religions often involve reasoning *within* their traditions. **Blocks History?** No. Historical claims *within* the practice can still be challenged externally.

  2.  **Reading 2: "Form of Life" as Framework Setting Internal Standards:** Belief provides the shared context ("grammar") that makes specific religious propositions *meaningful* and determines what counts as evidence/reason *within* that practice (e.g., scripture as authoritative). **Status:** Substantive & Defensible (core Wittgenstein). **Blocks History?** Not necessarily. It explains *why* believers prioritize faith/testimony over secular evidence. However, if the *faith itself treats the resurrection as a historical claim* (which Christianity typically does), then internal standards *include* assessing historical reliability (e.g., Gospel evidence). Blocking *all* historical discussion misapplies this.

  3.  **Reading 3: "Form of Life" as Purely Non-Cognitive Emotional Stance:** Belief expresses attitudes, commitments, or ways of valuing the world, not factual claims about reality. "Jesus is risen" expresses hope/commitment, not a past event. **Status:** Radical & Often False (over-simplifies religion). **Blocks History?** Yes, by redefinition. It renders the resurrection non-historical *by definition*, making historical critique irrelevant (but also changing the subject away from what most believers mean).

  4.  **Reading 4: "Form of Life" as Immune to External Critique:** The standards of the religious practice are utterly separate and incommensurable with other domains like history/science. **Status:** Misinterpretation & False. Practices interact; believers *use* historical arguments. **Blocks History?** Yes, but indefensibly. It wrongly isolates faith, making dialogue impossible and ignoring that believers often *engage* history.

  **Conclusion:** Reading 2 is the most defensible but **does not support dismissing historical questions** if the belief system itself makes historical claims (like the resurrection). It explains *differences* in evidence standards but doesn't make faith immune. Blocking history usually relies on Reading 3 (redefining belief) or Reading 4 (false isolation), both misapplications. Your friend likely uses the slogan to prematurely end discussion rather than clarify the *kind* of claim being made and the *relevant* standards of evaluation.
