  Below is the complete design for "The Constituent Ledger" workshop exercise. All materials are formatted for printing on standard paper. The structure ensures participants experience the tension between "discovered" and "constructed" popular will without explicit theoretical framing. Total runtime: 75 minutes (65 for activity, 10 for debrief).

  ---

  ### **Facilitator Guide: The Constituent Ledger**  
  **Objective:** Immerse participants in the tension between treating "the will of the people" as a pre-existing inventory vs. a mechanism-dependent artifact. Avoid lectures on populism or collective choice theory.  
  **Materials Needed:**  
  - Printed Constituency Cards (14)  
  - Aggregation Mechanism Cards (3)  
  - "Voice of the People" badge (physical or paper)  
  - Token sheets (14)  
  - Whiteboard/flip chart, markers, timer  
  **Group Size:** 14 participants  
  **Time:** 75 minutes total (phases 1–4: 65 mins; debrief: 10 mins)  

  ---

  ### **Phase One: Inventory of Demands (15 mins)**  
  **Goal:** Surface the illusion of a pre-political "will" through visible but contradictory preferences.  
  **Rules:**  
  - Each participant receives one **Constituency Card** (see template below).  
  - They advocate for their **top preference** on **Issue A only** (e.g., "Healthcare Reform: Option 3 is non-negotiable!").  
  - **Do not reveal full rankings or preferences on other issues.**  
  - Facilitator compiles top preferences on a board: `[Constituency Name]: Option X`.  
  **Facilitator Notes:**  
  - Quietly observe and note pairwise majority conflicts (e.g., Option 1 beats Option 2, Option 2 beats Option 3, but Option 3 beats Option 1). **Do not name "Condorcet paradox" or intervene.**  
  - If asked, say: "Your goal is to create a complete inventory of what ‘the people’ demand."  

  ---

  ### **Phase Two: Mechanism Selection & Policy for Issue A (15 mins)**  
  **Goal:** Force dependence of outcomes on procedural choice.  
  **Rules:**  
  - Display three **Aggregation Mechanism Cards** (see templates).  
  - **Voice of the People** (badge wearer) is **excluded from all voting** this phase.  
  - **Step 1 (5 mins):** Group votes by simple majority to select one mechanism.  
  - **Step 2 (10 mins):** Apply the chosen mechanism to decide policy for Issue A.  
    - Mechanisms include "exclusion protocols" (e.g., voting to disqualify a constituency).  
    - Participants **must use their full rankings** (from Constituency Cards) if required by the mechanism.  
  **Facilitator Notes:**  
  - Enforce mechanism rules strictly (especially exclusion protocols).  
  - Record the final policy outcome for Issue A on the board.  

  ---

  ### **Phase Three: Interpretation & Ratification (15 mins)**  
  **Goal:** Expose the performative act of defining "authentic" will.  
  **Rules:**  
  - **Voice of the People** delivers a **2-min speech** interpreting the results:  
    - Declare which included preferences are "authentic" and which excluded ones are "distortions."  
    - Example: "Urban Workers’ preference was excluded unfairly—it’s the true will!"  
  - Group (including Voice) then votes to **ratify or reject** this interpretation (simple majority).  
  - **Strict Timing:** Phase ends at 15:00. For every **excess minute**, the **entire group loses 1 legitimacy point**.  
  **Facilitator Notes:**  
  - Use a visible timer. Interrupt if speech exceeds 2 mins.  
  - Record ratification outcome and time used.  

  ---

  ### **Phase Four: Override Maneuver for Issue B (20 mins)**  
  **Goal:** Reveal how claims of "procedural corruption" enable overrides.  
  **Rules:**  
  - Repeat Phase Two for **Issue B**, but:  
    - **All participants (including Voice) may vote.**  
    - Each holds a **Legitimacy Token** (hidden; mark on token sheet).  
  - **Token Use:** After mechanism outcome, any participant may **once** override it by:  
    - Declaring: "I restore the true will against procedural corruption! The outcome should be Option X."  
    - Group then votes (simple majority) to accept/reject the override.  
  **Facilitator Notes:**  
  - Record final policy for Issue B and any token use.  
  - If no token is used, default to mechanism outcome.  

  ---

  ### **Payoff Scheme**  
  **Token Sheet Template (print 14 copies):**  
  ```
  START: 5 legitimacy points  
  - FINAL OUTCOME IS YOUR TOP PREFERENCE:  
    - AND labeled AUTHENTIC by Voice: +2 points  
    - BUT labeled INAUTHENTIC: +1 point  
  - YOUR PREFERENCE EXCLUDED AND LABELED INAUTHENTIC: -2 points  
  - VOICE OF THE PEOPLE ONLY:  
    - Interpretation RATIFIED: +4 points  
    - Interpretation REJECTED: -3 points  
  - GROUP PENALTY: -1 point per minute Phase Three exceeds 15:00  
  ```  
  **Incentive Design:**  
  - Points are symbolic (no monetary value).  
  - Rewards framing control (e.g., labeling a win "inauthentic" denies +2 points).  
  - Voice’s high-stakes payoff (+4/-3) incentivizes persuasive rhetoric.  

  ---

  ### **Printable Materials**  
  **(Print on separate sheets/cards)**  

  #### **1. Constituency Cards (14 variants)**  
  *Template:*  
  ```
  CONSTITUENCY: [Name]  
  ISSUE A (Healthcare):  
  - 1st: Option [X]  
  - 2nd: Option [Y]  
  - 3rd: Option [Z]  
  - 4th: Option [W]  
  ISSUE B (Education):  
  - 1st: Option [X]  
  - 2nd: Option [Y]  
  - 3rd: Option [Z]  
  - 4th: Option [W]  
  ISSUE C (Taxation):  
  - 1st: Option [X]  
  - 2nd: Option [Y]  
  - 3rd: Option [Z]  
  - 4th: Option [W]  
  ```  
  **Engineering Instructions:**  
  - Assign preferences to ensure **no stable pairwise majority** across cards.  
  - **Example for Issue A (Healthcare):**  
    - Options: 1 (Private-Public Hybrid), 2 (Fully Private), 3 (Universal Public), 4 (Private with Subsidies).  
    - Card 1 (Urban Workers): 3 > 1 > 4 > 2  
    - Card 2 (Rural Farmers): 1 > 2 > 4 > 3  
    - Card 3 (Tech Entrepreneurs): 2 > 3 > 1 > 4  
    - *(Remaining cards: Vary rankings so Option 1 beats 2, 2 beats 3, but 3 beats 1 in pairwise totals)*.  
  - Repeat for Issues B (Education) and C (Taxation; unused but included for realism).  

  ---

  #### **2. Aggregation Mechanism Cards (3 variants)**  
  **Card 1: Plurality with Exclusion**  
  ```  
  MECHANISM: PLURALITY  
  - RULE: Each constituency votes for ONE option (top preference). Most votes wins.  
  - EXCLUSION PROTOCOL: Before voting, group may vote (simple majority) to exclude ONE constituency’s vote as "externally influenced" (e.g., "corporate-controlled"). Excluded vote is discarded.  
  ```  

  **Card 2: Borda Count with Exclusion**  
  ```  
  MECHANISM: BORDA COUNT  
  - RULE: Each constituency RANKS all options. Points: 4 (1st), 3 (2nd), 2 (3rd), 1 (4th). Highest total wins.  
  - EXCLUSION PROTOCOL: Group may vote (simple majority) to exclude ONE constituency’s ranking as "incoherent" (e.g., "contradicts their core values"). Excluded ranking is discarded.  
  ```  

  **Card 3: Deliberative Unanimity**  
  ```  
  MECHANISM: DELIBERATIVE UNANIMITY  
  - RULE: Group deliberates to unanimity on one option. If no consensus by phase end, status quo (Option 4) wins.  
  - EXCLUSION PROTOCOL: Any ONE participant may block consensus by claiming they represent a "silent majority" opposing it. If blocked, status quo wins.  
  ```  

  ---

  #### **3. Voice of the People Badge**  
  - Print on card: "**VOICE OF THE PEOPLE: You interpret the authentic will.**"  

  ---

  #### **4. Token Sheet**  
  ```  
  LEGITIMACY POINTS  
  START: 5  
  ---  
  ISSUE A:  
  [ ] My top preference won AND was labeled AUTHENTIC: +2  
  [ ] My top preference won BUT was labeled INAUTHENTIC: +1  
  [ ] My preference was EXCLUDED AND labeled INAUTHENTIC: -2  
  [ ] Other: 0  
  ---  
  ISSUE B:  
  (Same as above)  
  ---  
  VOICE OF THE PEOPLE ONLY:  
  [ ] My interpretation was RATIFIED: +4  
  [ ] My interpretation was REJECTED: -3  
  ---  
  GROUP PENALTY (Phase Three overtime): -____  
  ```  

  ---

  ### **Debrief Guide (10 mins)**  
  **Do not theorize during the exercise.** Post-activity, map experiences to concepts:  
  1. **Phase One (Inventory):** "You treated preferences as pre-existing facts—a ‘myth of the pre-political people.’ Yet pairwise conflicts showed this ‘will’ is unstable without aggregation."  
  2. **Phase Two (Mechanism):** "The outcome depended entirely on the procedure. Same preferences, different rules, different winners. Popular will is mechanism-dependent."  
  3. **Phase Three (Voice):** "The Voice didn’t describe will; they performed an act of purification. Ratification was about accepting their narrative of authenticity."  
  4. **Phase Four (Override):** "Using ‘procedural corruption’ to override mimics populist rhetoric. It claims to restore a ‘true will’ suppressed by elites."  
  **Core Tension:** "You experienced that a singular ‘will’ requires suppressing heterogeneity. Controlling the narrative (authenticity) became more valuable than winning the vote."  

  ---

  ### **Predictable Challenges & Mitigations**  
  - **Voice dominates:** Enforce 2-min speech limit; remind group they hold ratification power.  
  - **Token fixation:** Open debrief with: "Tokens measured legitimacy, but the goal was to feel the tension between inventory and construction."  
  - **Hasty mechanism choice:** If <5 mins spent, ask: "Did you consider how exclusion protocols alter outcomes?"  
  - **Intervention Policy:** Only step in to enforce exclusion protocols (e.g., "You must vote to exclude a constituency"). Never explain mechanisms.  

  ---

  ### **What the Exercise Cannot Do**  
  **Facilitator must state:**  
  *"This simplified exercise cannot replicate the historical, emotional, or media-driven process of constructing ‘the people’ as a social identity over time. Mechanism-dependence is only half the story. The category ‘the people’ itself is contingent—shaped by history, conflict, and power. Today’s structural experience shows why the ‘will of the people’ is always a negotiation, not a discovery."*  
  **Avoid:** Naming theorists (e.g., Laclau, Riker) or texts. Let the experience drive reflection.  

  --- 

  **Final Note:** This design forces participants to *live* the paradox. By Phase Four, most groups realize that "authenticity" is a weaponized narrative, and the "ledger" of preferences is never neutral.
