  This scenario satisfies all the constraints without cheating.

  So, the case:

  **Scenario**: Pat uses a prediction app for a football match. The match has three possible outcomes: Team A wins (X), Team B wins (Y), or draw (Z). Pat posts offers to buy contracts that pay $1 for each outcome. Pat offers: $0.50 for X, $0.50 for Y, $0.50 for Z. These offers can be withdrawn by Pat at any time. The app processes transactions one at a time.

