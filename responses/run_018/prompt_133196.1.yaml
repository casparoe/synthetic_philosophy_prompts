answer: |-
  **Encoded Richness Fallacy**: The error of attributing uncountable, continuous, or otherwise "rich" structural properties of a *formal model's internal domain* to the *target reality being modeled*, while ignoring that the model's entire construction and representation exist within a countable, finite, or computable substrate.

  ### Reasoning & Boundaries:
  1. **Core Mechanism**: The fallacy exploits the gap between a model's *internal theorems* (e.g., "there exist uncountably many preferences") and its *external encoding* (all objects are finite strings/computable constructions). Internal proofs validly derive "uncountability" *relative to the model's axioms*, but this is a property of the *symbolic framework*, not the target domain.
     
  2. **Distinction from Skolem's Paradox**:
     - Skolem's Paradox shows that a theory (e.g., ZFC) *can* have countable models satisfying "uncountability" statements. It's about *interpretation within models*.
     - The Encoded Richness Fallacy is about *epistemic misattribution*: using internal model results (like uncountability proofs) to claim the *extralinguistic target* has uncountable structure, despite the model being entirely encoded countably.

  3. **Distinction from General Model-Theoretic Limitations**:
     - Ordinary model-theoretic limitations (e.g., Löwenheim–Skolem) describe inherent constraints on formal systems.
     - This fallacy is a *misuse* of such systems: inferring target-domain richness *because* the model proves it internally, while disregarding the model's own constructive poverty.

  4. **Distinction from Physical or Empirical Error**:
     - If one claims "the universe is continuous" based on physics, that's a scientific claim falsifiable by evidence.
     - The fallacy arises *specifically* when formal, countable models are leveraged to assert richness in the target domain *through their internal proofs alone*, absent empirical justification.

  5. **Operational Test for Identification**:
     The fallacy occurs iff:
     - (A) A formal model (finite symbols/computable rules) proves "richness" (uncountability, continuity, etc.) in its internal domain.
     - (B) This result is interpreted as evidence for parallel richness in the target reality.
     - (C) The model's own countable/constructive encoding of *all* objects is ignored in this inference.

  **Example**: A computable agent model "proves" utility functions are uncountably infinite, then concludes real minds *must* have uncountably many preferences. The fallacy ignores that every "utility function" in the model is a finite string. The uncountability is *within* the formalism, not a discovery about minds.
