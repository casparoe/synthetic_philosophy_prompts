  - **Prize structure**: Fixed prize pool (normalized to 1). One entrant wins, but the prize is diluted as \(1 / \sqrt{S}\), where \(S\) is the **total intensity** of all entrants.
  - **Payoff for an entrant**:
    - If they win: \(\frac{1}{\sqrt{S}} - s\) (prize minus cost).
    - If they lose: \(-s\) (only cost).
  - **Symmetry**: Agents use identical strategies \((p, s^*)\), where \(s^*\) is the intensity chosen upon entry.

  ### **2. Equilibrium Conditions**
  A symmetric equilibrium \((p, s^*)\) must satisfy:
  - **Intensity optimality**: \(s^*\) maximizes expected payoff given others play \((p, s^*)\).
  - **Entry indifference**: Expected payoff from entering (with \(s^*\)) equals payoff from abstaining (0), i.e., \(\mathbb{E}[\text{payoff} \mid \text{enter}] = 0\) if \(0 < p < 1\).

  ### **3. Intensity Choice Collapses to Lower Bound**
  The expected payoff for an entrant choosing intensity \(s\) is:
  \[
  V(s) = \underbrace{\mathbb{E}_X \left[ \frac{1}{1+X} \cdot \frac{1}{\sqrt{s + X s^*}} \right]}_{\text{expected prize}} - s,
  \]
  where \(X \sim \text{Binomial}(N-1, p)\) is the number of other entrants.

  The derivative with respect to \(s\) is:
  \[
  \frac{dV}{ds} = \mathbb{E}_X \left[ \frac{1}{1+X} \cdot \left( -\frac{1}{2} (s + X s^*)^{-3/2} \right) \right] - 1.
  \]
  - **Key observation**: The derivative is **always negative**:
    - The expectation term is positive (since \((s + X s^*)^{-3/2} > 0\)), so \(\frac{dV}{ds} < -1 < 0\).
  - **Implication**: \(V(s)\) is strictly decreasing in \(s\).  
    - Thus, agents always prefer **smaller \(s\)** to reduce dilution and cost.
    - **No interior maximum**: Without a lower bound \(s_{\text{min}} > 0\), \(s \to 0^+\) is optimal, but this causes \(V(s) \to +\infty\) (due to \(1/\sqrt{s} \to \infty\)) and violates equilibrium (abstention payoff is 0).

  ### **4. Role of an Exogenous Lower Bound**
  Assume an exogenous \(s_{\text{min}} > 0\) (e.g., technical constraints). Agents choose \(s^* = s_{\text{min}}\). The expected payoff simplifies to:
  \[
  V(s_{\text{min}}) = \frac{1}{\sqrt{s_{\text{min}}}} \cdot \mathbb{E}_X \left[ (1 + X)^{-3/2} \right] - s_{\text{min}}.
  \]
  - **Indifference condition** (\(V(s_{\text{min}}) = 0\)):
    \[
    s_{\text{min}}^{3/2} = \mathbb{E}_X \left[ (1 + X)^{-3/2} \right].
    \]
  - **Dependence on \(p\)**: The expectation \(\mathbb{E}_X[(1+X)^{-3/2}]\) depends on \(p\) (through \(X \sim \text{Bin}(N-1, p)\)).  
    - For **any** \(p \in [0,1]\), we can find \(s_{\text{min}}(p)\) satisfying this equation, making \(V(s_{\text{min}}) = 0\).

  ### **5. Continuum of Equilibria**
  - **Indeterminacy in \(p\)**: Every \(p \in [0,1]\) can be part of an equilibrium by setting \(s_{\text{min}}(p) = \left( \mathbb{E}_X[(1+X)^{-3/2}] \right)^{2/3}\).
  - **Lack of unique prescription**: 
    - If \(p = 0\), agents deviate to enter (since lone entrants get \(1/\sqrt{s} - s > 0\) for small \(s\)).  
    - If \(p = 1\), entry is sustainable but \(s_{\text{min}}\) depends on \(N\).
    - No \(p\) is uniquely stable; all require exogenous \(s_{\text{min}}\).

  ### **6. Why Superrationality Fails Here**
  - **Discrete vs. continuous tension**: 
    - In discrete games (e.g., Platonia), symmetry is broken via randomization (e.g., enter with probability \(1/N\)), yielding a unique equilibrium.
    - In continuous games (e.g., standard Tullock contests), payoff non-monotonicity (e.g., \(s / S\)) can stabilize intensity.
  - **This hybrid game lacks stabilizing feedback**:
    - Intensity \(s\) **only dilutes the prize** (no benefit, e.g., no increased win probability).
    - Cost \(s\) reinforces the incentive to minimize intensity.
    - No interior maximum for \(s\) → collapse to boundary → entry probability \(p\) becomes indeterminate.

  ### **7. Conceptual Boundary of Superrationality**
  - **Superrationality requires a "self-anchoring" mechanism**:
    - **Discrete symmetry-breaking**: Fixed points emerge from explicit randomization (e.g., Platonia).
    - **Continuous self-limitation**: Interior maxima exist via feedback (e.g., Tullock: \(s\) boosts win probability but dilutes prize).
  - **Hybrid games undermine determinacy**: 
    - Continuous choice collapses to a boundary, depriving the discrete choice of a unique fixed point.
    - Superrationality is **ill-defined** when actions lack **non-monotonic payoffs** in continuous dimensions.
  - **Not a universal defect**: Superrationality works in games with:
    - Pure discrete strategies (e.g., Platonia).
    - Pure continuous strategies with interior optima (e.g., Luring Lottery with proportional rewards *and* cost).

  ### **Conclusion**
  The hybrid game lacks a unique symmetric equilibrium due to:
  1. **Collapse of intensity** to its lower bound (driven by strictly decreasing payoffs in \(s\)).
  2. **Indeterminacy in entry probability** \(p\) (enabled by the intensity collapse).

  This illustrates that superrationality yields determinate solutions only in games where the strategy space and payoff structure jointly produce a **unique fixed point**:
  - Discrete games achieve this via symmetry-breaking randomization.
  - Continuous games require non-monotonic payoffs (e.g., increasing then decreasing in intensity).  
  The failure here is not inherent to superrationality but signals its domain limitation: it applies to games where the symmetric strategy space admits a self-consistent focal point, which is absent in this hybrid structure.
