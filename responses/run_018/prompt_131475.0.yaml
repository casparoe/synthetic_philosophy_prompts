      - In Round 1, tell traders that they want to maximize their wealth (which includes goods and currency) because the top 5 get rewards.
      - In Round 2, tell them that only currency counts, so they should maximize currency.

   Let's adjust the Record-Keeping in Round 2 to be simpler: 
      - Record-keepers only record the currency that changes hands. They do not record goods at all. They write down:
            "Trader A gave Trader B: [list of chips]"
            "Trader B gave Trader A: [list of chips]"
      - Then they calculate the net currency change for each trader (in Units) and record that. For example:
            A gave B: 5 blue (5 Units) and 1 red (5 Units) -> total 10 Units
            B gave A: 1 green (10 Units) -> total 10 Units
            So net change: A: +10 (from B) -10 (to B) = 0; B: +10 -10 = 0.

      But note: if goods were also exchanged, they are not recorded. So in the above, if A also gave a good to B, that good is lost from A's inventory and gained by B, but the ledger doesn't show it. This will cause discrepancies.

    However, the Banker in Round 2 is not counting goods at all. So when updating the ledger, the Banker only adjusts the currency holdings. The goods are still physically held by the traders, but they are invisible in the accounting.

    This will lead to a moment of realization: in the final wealth calculation, a trader might have a lot of goods (which they thought were valuable) but they don't count. The trader might protest, but the Banker says: "The rules say we only count currency now."

    This is the moment we want: the rules restructured what is countable and thus what is valuable.

    Let's write the Round 2 record-keeping rule clearly:

      "Record only the currency (chips) exchanged. Do not record goods. For each trader, calculate the net change in currency (in Units) as a result of the trade. Record that net change and update the Banker's ledger accordingly."

    The Banker then updates the ledger by adding the net change to each trader's currency total. The goods are ignored.

    Important: The Banker does not track goods at all in Round 2. They only track currency.

    Finally, note that the starting point for Round 2 is the ending currency of Round 1 (the goods are still held but not counted). The Banker wipes the goods from the ledger.

    This will cause a shock: a trader who had a lot of goods (and maybe little currency) at the end of Round 1 will start Round 2 with little recorded wealth.

    We must make sure that the Banker's ledger at the start of Round 2 only has the currency holdings from Round 1. The goods are no longer counted.

    So after Round 1, the Banker announces the final wealth (including goods) and then says: "But now, for Round 2, we are starting fresh in terms of wealth: we are taking your current currency holdings and resetting your wealth to just that. The goods you hold are still yours physically, but they are not part of the official wealth calculation anymore."

    This is the critical reset.

    Implementation:

      After Round 1 ends, the Banker:
        - Calculates and announces the Round 1 wealth (including goods) and distributes the Round 1 snack tokens.
        - Then announces: "In Round 2, we are adopting a new accounting system. Wealth will now be defined solely by the currency (chips) you hold. The goods you have are no longer counted. We are resetting everyone's wealth to their current currency holdings. So if you have 20 Units in currency, that is your starting wealth for Round 2. If you have 0 currency, then your starting wealth is 0, regardless of how many goods you have."

      This reset will cause immediate reactions and set the stage for Round 2.

