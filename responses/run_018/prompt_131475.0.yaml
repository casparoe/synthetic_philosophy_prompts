      - Good cards: Create about 50 cards with different goods (e.g., 10 types, 5 of each). Each card has a good name and a base value (in Round 1 only). Examples: Apple (2 Units), Tool (10 Units), Service Coupon (5 Units), Book (7 Units), etc.
      - Transaction logs (for Round 1 and Round 2 with different formats).
      - Trader starting packs: Each trader gets 15 Units in currency (e.g., 10 blue and 1 red? 10 blue = 10 Units, 1 red = 5 Units, total 15) and 3 good cards (randomly assigned).

    Time Schedule:

      - Introduction: 5 min (explain roles and Round 1 rules)
      - Round 1: 20 min
      - Round 1 payoff and reset for Round 2: 5 min
