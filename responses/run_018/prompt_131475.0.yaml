prompt: |-
  hey im a junior in a philosophy of social science seminar and im running a discussion section for about 16 undergrads next week, 60 minutes. we just covered social construction of kinds — race, gender, money — and i want to design an in-class game that makes them feel the institutional loop, not just hear about it. specifically i want to use money / currency as teh example: how accounting rules and record-keeping practices dont just track value but actually restructure whats countable, so the category ends up looking "natural" after the fact. can you design a simulation with made-up currency denominations, roles like traders and record-keepers, and small real stakes (snack tokens or extra-credit chips) where teh rules shift mid-game based on how people log transactions? they should build teh categories themselves through play, then run into teh problem before anyone names it. include payoff rules, materials, a debrief that maps moments in teh activity onto teh theory without just lecturing, and an honest note about which macro-level feature of institutional construction this just cant reproduce. also tell me what will predictably go wrong teh first time i run it. please dont include a bibliography, citation list, or reading suggestions — i just need something runnable for my section.
