  We are designing a simulation game to illustrate the social construction of money and how accounting rules shape what is counted and how it becomes naturalized. The game will have:
   - Players: 16 students, divided into roles (Traders, Record-Keepers, and a Banker)
   - Materials: Play money in initial denominations (e.g., "chips" of different colors representing different values), transaction logs, a whiteboard for public record, and tokens for snacks/extra credit.
   - Setup: Two rounds with a rule change in between that alters how transactions are recorded, thereby changing what is considered valuable.

   Game Title: "Value Loop"

   Goal: To accumulate as much "wealth" as possible (in the form of snack tokens or extra-credit chips) by the end of the game.

   Roles:
    1. Traders (10 students): They trade goods and services using the game's currency. Each trader starts with an assortment of goods (represented by cards) and some starting currency.
    2. Record-Keepers (4 students): They record transactions between traders. They use a transaction log (a form) and report to the Banker.
    3. Banker (1 student): Oversees the record-keepers, aggregates the records, and issues the official public record (on the whiteboard). Also, at the end of each round, the Banker calculates and distributes snack tokens based on the recorded wealth.
    4. Observer (1 student, optional): If there are 16, we have 10 traders, 4 record-keepers, 1 banker, and 1 observer. The observer takes notes on the process and will report in the debrief.

   Materials:
    - Trader Kits (for 10):
        * A set of good cards (e.g., "Apple", "Tool", "Service Coupon") - each card has a type and a base value (in an initial currency unit, say "Units").
        * Starting currency: 10 Units in 1-Unit chips (e.g., blue chips) and 5 Units in 5-Unit chips (e.g., red chips). So each trader starts with 15 Units.
    - Record-Keeper Kits (for 4):
        * Transaction log sheets (with columns: Time, Trader A, Trader B, Goods/Currency from A to B, Goods/Currency from B to A, Record-Keeper's Signature).
        * Pens.
    - Banker Kit:
        * A master ledger (a spreadsheet or large paper) to aggregate transactions.
        * A whiteboard to display the current wealth rankings (updated periodically).
        * Snack tokens (or extra credit chips) to distribute.
    - Game Currency: Two types of chips (blue = 1 Unit, red = 5 Units) for Round 1. In Round 2, we introduce a new rule and a new denomination.

   Rules:

   Round 1 (20 minutes):
    - Currency: Only blue (1 Unit) and red (5 Unit) chips are valid.
    - Trading: Traders can trade goods and/or currency with each other. Each trade must be recorded by a record-keeper. Traders must find a record-keeper to witness and record the trade. The record-keeper records the details and gives each trader a signed slip (as proof of the transaction).
    - Record-Keeping: Record-keepers note the time, traders involved, and what is exchanged (which goods and/or how many chips of each color). They do not assign a total value to the trade; they only record the items and chips.
    - Banker: Every 5 minutes, the Banker collects the transaction logs and updates the master ledger. The Banker calculates each trader's wealth by:
          Wealth = (Number of blue chips * 1) + (Number of red chips * 5) + (Base value of goods held)
      The base value of goods is fixed (as per the card). The Banker then posts the top 5 wealthiest traders on the whiteboard.

    - Payoff at the end of Round 1: The Banker distributes snack tokens to the top 5 traders (e.g., 5 tokens to 1st, 4 to 2nd, etc.). Also, each record-keeper gets 1 token for their work.

   Round 2 (20 minutes):
    - Rule Change: The Banker announces that a new currency chip (green chip) is now available and is worth 10 Units. Also, the accounting rules change: from now on, goods are no longer counted in the wealth calculation. Only currency (blue, red, green chips) counts. Moreover, the Banker announces that they are introducing a new rule for record-keeping: record-keepers must now record the total value of currency exchanged in each trade (by adding up the chip values) and note the net change in currency for each trader in the transaction (but not the goods). Goods are still being traded, but they are not recorded in the log (or if recorded, they are just noted as "goods" without value). The base value of goods no longer counts toward wealth.

    - Trading continues: Traders can trade goods and the three types of chips. Record-keepers now record:
          - The amount of currency given by Trader A to Trader B (in terms of blue, red, green chips) and vice versa.
          - The net change in currency for each trader (e.g., if A gives B 5 blue chips and B gives A 1 red chip, then A has a net loss of 5 and a gain of 5? Actually, we need to record the transfer of chips, but the total value: so if A gives 5 blue (5 Units) and B gives 1 red (5 Units), then net change is 0 for both? But note: the goods are not recorded, so if in the same trade A also gave a good, it doesn't get recorded. This will cause confusion and illustrate the point.)

      Actually, we can simplify: record-keepers record only the currency flows. They ignore goods. So the log might look like: "A paid B: 5 blue chips. B paid A: 1 red chip." Then the net for A: +5 (from red) -5 (blue) = 0? But that's not the point. We want to show that the goods are now invisible.

      Alternatively, we can have the record-keepers record the goods as "miscellaneous items" without any value. So they note that goods were exchanged but without specifying what.

    - Wealth Calculation: Only the chips matter. The Banker updates the ledger by adding the net currency change from each transaction (which the record-keepers are now recording as a total value in Units). The goods are not counted.

    - Payoff at the end of Round 2: The Banker recalculates wealth based only on currency. The top 5 traders (by currency holdings) get snack tokens (same distribution). Record-keepers get 1 token each.

   Debrief (20 minutes):

    Step 1: Ask the players about their experience.
      - Traders: How did the rule change affect your trading? Did you change what you traded? How did you feel about the goods you held in Round 2?
      - Record-Keepers: How did the rule change affect your job? What was challenging about the new rule?
      - Banker: How did the rule change affect the ledger? Was it easier or harder?
      - Observer: What did you notice about how people reacted to the rule change?

    Step 2: Map to theory.
      - Point out that in Round 1, the value of goods was "natural" (base value) and currency was just a medium. In Round 2, the accounting rules made goods invisible and only currency counted. This changed what was considered valuable.
      - Note that the rules were set by an authority (the Banker, with the instructor's guidance) and then the players adapted to the rules, making the new definition of wealth seem natural by the end of Round 2.
      - The institutional loop: The rules (accounting practices) shaped what was recorded and thus what was considered valuable. Then the players acted in ways that reinforced that value (e.g., traders might have started to hoard currency and ignore goods). The category of "wealth" was reconstructed.

    Step 3: What couldn't we reproduce?
      - We couldn't reproduce the historical inertia and the large-scale societal consensus that emerges over time. In real life, the institutional loop takes years and involves many more actors and institutions. Our game compressed time and had a small group with imposed rules.

    What will go wrong the first time?
      - Confusion about the rules: Some traders might not understand the rule change and continue to trade as before. The record-keepers might not properly implement the new accounting rule (e.g., they might still record goods with their base value). The instructor should be ready to clarify and enforce the rules.
      - Time management: The rounds might run long. Keep a timer and be strict.
      - Some traders might hoard and not trade, or some record-keepers might be idle. Encourage participation by having the Banker announce that active traders get a bonus (but that might complicate the rules). Alternatively, the instructor can circulate to prompt trading.
      - Wealth calculation might take time. The Banker should be given a calculator and a simple method (like updating only every 5 minutes).

   Additional Notes:
    - To create small real stakes: Use tangible rewards (snacks or extra credit). Make sure the extra credit is very minor (e.g., 1 point on a small assignment) so it doesn't cause too much competition.
    - To ensure trading: Give traders a goal. For example, each trader gets a "goal card" that says they need to collect at least 3 different types of goods (in Round 1) and then in Round 2, they might get a new goal (collect as much currency as possible). But this might complicate. Alternatively, just let them trade freely.

