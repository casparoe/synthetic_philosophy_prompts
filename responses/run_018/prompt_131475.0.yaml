      - The Banker introduces the green chip (10 Units) and explains that record-keepers will now only record currency exchanges and ignore goods.

    Now, during Round 2, traders can still trade goods, but the record-keepers won't record them. So if Trader A gives Trader B a good and Trader B gives Trader A some chips, the record-keeper will only record the chips. The good is transferred physically, but the Banker's ledger will not reflect it. The trader who gave up the good might feel cheated because they gave something tangible and only the chip transfer is recorded.

    This will create tension and illustrate the point.

    Materials List:

