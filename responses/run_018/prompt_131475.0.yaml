answer: |-
  ### **"Currency Construction" Simulation Game**  
  **Goal:** Illustrate how accounting rules create social realities by shifting what "counts" as value, making new categories feel naturalized.  

  ---

  #### **Materials Needed**  
  - **Currency:** Three colored paper clips (or poker chips):  
    - **Blue** = 1 unit  
    - **Red** = 5 units  
    - **Green** = 10 units  
  - **Goods Cards:** Index cards labeled "Apple," "Tool," "Art," "Land," "Service" (5 types × 4 copies).  
  - **Ledger Sheets** (for record-keepers): Simple tables with columns: *Time, Trader A, Trader B, Items Exchanged, Value Logged*.  
  - **Wealth Board:** Whiteboard tracking traders’ "official wealth" (updated by record-keepers).  
  - **Stakes:** Snack tokens (e.g., candy) or "+1% EC" chips (1 per player initially, + more for top 3 winners).  

  ---

  #### **Roles & Rules**  
  **1. Players (16 students):**  
  - **Traders (12):** Start with 10 blue clips + 2 goods cards. Goal: Maximize wealth via trades.  
  - **Record-Keepers (3):** Record trades on ledger sheets. Calculate/log "official wealth" on the board.  
  - **Banker (1):** Enforces rules, announces shifts, distributes stakes.  

  **2. Phase 1: "Tracking Reality" (15 min)**  
  - **Rules:**  
    - Traders barter goods/clips freely.  
    - Record-keepers log **all items** in trades (e.g., "Trader A → Trader B: 3 Blue + Apple").  
    - Wealth = Total clip value + **fixed goods value** (Apple=2, Tool=4, Art=6, Land=10, Service=3).  
  - **Payoff:** Mid-round, Banker gives 1 snack token to everyone with >20 units.  

  **3. Phase 2: "Restructuring Reality" (15 min)**  
  - **Rule Shift (Banker announces):**  
    > *"New rule: Goods no longer have fixed value. Only money transactions count. Record-keepers must log trades as ‘CASH ONLY’ – assign ANY number to goods but ONLY log the cash value, not the goods."*  
    (e.g., Trader pays 3 blue for an Apple → Log: "Trader A → Trader B: 3 units"). Goods become invisible in records.  
  - **Wealth:** Only clip values matter. Goods are worthless on the board.  
  - **Payoff:** Top 3 wealth holders get 3 extra snack tokens.  

  ---

  #### **Key Mechanics**  
  - **Tension:** Traders see goods as valuable (Phase 1), but must accept they’re "invisible" in Phase 2. Record-keepers *create* new value categories by logging selectively.  
  - **Stakes:** Tokens incentivize engagement. Mid-game payoff ensures early participation.  
  - **Debrief Hook:** End game *before* discussing theory. Ask: *"Why did goods feel ‘fake’ in Phase 2? Who decided what was ‘real’?"*  

  ---

  #### **Debrief Framework**  
  **Guided Discussion (15 min):**  
  1. **Experience:**  
     - *Traders:* "How did your strategy change? Did goods feel less ‘real’ in Phase 2?"  
     - *Record-keepers:* "Was it hard to ignore goods? Did logging cash-only feel arbitrary?"  
     - *Banker:* "How did enforcing rules shift behavior?"  

  2. **Map to Theory:**  
     - **Institutional Loop:**  
       - Phase 1 = "Tracking" (recording pre-existing value).  
       - Phase 2 = **"Creating"** (rules redefine value → traders adapt → new value feels natural).  
     - **Social Construction:** Ask: *"When did ‘wealth’ stop being about goods and start being about clips? Who had the power to decide that?"*  
     - **Naturalization:** *"Why did we accept Phase 2 rules so quickly? How does this mirror race/gender/money IRL?"*  

  3. **Limitation:**  
     - *Honest Note:* "This game can’t show **historical inertia**. IRL, institutional loops take decades/centuries to solidify – not 15 minutes. We also skipped collective resistance (e.g., traders revolting against rules)."  

  ---

  #### **Predictable Problems (and Fixes)**  
  1. **"This is arbitrary!"** (Traders protest Phase 2 rules).  
     - *Lean in:* "Yes! Point out *when* you felt this. Why did you keep playing?" → Debrief material.  

  2. **Record-keeper confusion** (e.g., logging goods in Phase 2).  
     - *Fix:* Banker audits logs mid-game. "Penalty" for errors (e.g., lose 1 clip).  

  3. **Traders hoard clips** (ignore goods in Phase 2).  
     - *Embrace it:* This shows adaptation to rules! Debrief: "Why did clips suddenly feel more ‘valuable’?"  

  4. **Time crunch.**  
     - *Fix:* Use a timer. Cut Phase 1 to 12 min if needed. Banker can force trades ("Everyone trade in 60 seconds!").  

  ---

  #### **Why This Works**  
  - **Builds Categories Through Play:** Students *live* the shift from "value in objects" to "value in logged numbers."  
  - **Low Prep:** Paper clips, index cards, whiteboard.  
  - **Theory Integration:** Debrief uses their experience to explain institutional loops – no lecture needed.  

  **Run it, then hit them with Hacking’s "dynamic nominalism" in the next lecture!** 🌟
