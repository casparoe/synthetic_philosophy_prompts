      Round 1:
        - Wealth = currency (blue:1, red:5) + base value of goods.
        - Record-keepers record both goods and currency in transactions.

      Round 2:
        - Wealth = only currency (blue:1, red:5). Goods are not counted.
        - Record-keepers record only currency exchanges (and ignore goods).

      Reset between rounds: Each trader's wealth is reset to their currency holdings at the end of Round 1. The goods they hold are not counted.

