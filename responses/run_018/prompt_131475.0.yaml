      Theory: The accounting rules don't just track an independent reality (the value of goods) but actually restructure what is considered valuable. The new rules create a new reality (currency is wealth) that becomes naturalized through practice.

    Honest note about what we can't reproduce:

      - The game cannot show how these rules emerge slowly over time through collective practice and negotiation. In real life, the rules are not imposed by a single authority in one day but evolve through complex social processes. Also, in real life, there are multiple institutions and a much larger scale.

