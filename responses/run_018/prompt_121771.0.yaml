answer: |-
  Here are the five numbered points analyzing Sweden's 1974 constitutional reform through the lens of symbolic sovereignty delegation:

  1.  The theory predicts that splitting ceremonial and instrumental sovereignty clarifies democratic accountability by vesting real governing power solely in elected bodies, while using a non-political figurehead to embody state continuity and unity, thereby stabilizing the system.
  2.  The reform explicitly mapped ceremonial sovereignty onto the monarchy (retaining it as head of state for unity and tradition) while transferring all instrumental sovereignty, especially the power to appoint/form governments, to the elected Riksdag via its Speaker.
  3.  The theory explains well the reform's core mechanism: the Speaker proposing the Prime Minister institutionalizes that instrumental governing authority stems directly from parliamentary election results and confidence, not royal prerogative.
  4.  The theory misdescribes the reform's complete severing of dynastic continuity from popular legitimacy; it leaves silent that the monarchy's *survival* now depends *entirely* on perceived popular consent, not inherent dynastic right, erasing any functional "sovereignty" residue.
  5.  The Swedish case reveals that democratic legitimacy does not inherently *require* this separation (as republics prove), but effectively *accommodates* it by allowing a ceremonial monarchy to persist only by popular will, devoid of governing power.
