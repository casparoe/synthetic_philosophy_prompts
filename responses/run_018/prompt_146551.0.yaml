  ## Harmonized Demos Framework: Citizen & Stakeholder Classification Manual (v.7.3α)
  **Issued by the Directorate of Affected Interests Integration, Ministry of Democratic Precision**

  **1. Purpose & Scope:** This document outlines the operational framework for determining eligibility within the Harmonized Demos of the Unified Democratic State (UDS), pursuant to the Affected Interests Integration Act (AIIA § 12.7b). Classification dictates suffrage weight, procedural access, and obligation tiers. All determinations derive from the Rigorous Algorithmic Application of Stakeholder Harmonics (RAASH), which quantifies affectedness across temporal and ontological spectra.

  **2. Core Membership Categories:**

  *   **2.1 Full Citizens (FC):** Permanent residents demonstrably affected by core sovereign functions with long-term (>25-year) externality horizons (e.g., national infrastructure, constitutional amendments, permanent territorial zoning).
      *   *Procedure:* Automatic enrollment via National Residency Registry (NRR). RAASH continuously validates FC status via quarterly "Life-Cycle Impact Scans" correlating domicile, employment sector, and health data against long-term policy models. Appeals regarding scan outcomes require submission of Form 8D-Δ (Evidence of Deep Temporal Nexus) to the Bureau of Persistent Harmonics (BPH).
      *   *Suffrage:* Standard ballot weight (1.0 unit) in relevant referenda/elections. Mandatory participation in quinquennial "Sovereignty Continuity Review."

  *   **2.2 Provisional Stakeholders (PS):** Non-resident entities experiencing measurable, direct impact from specific, bounded UDS policy regimes (e.g., cross-border workers affected by labor regulations, trade partners affected by tariff schedules, transient populations affected by localized public health ordinances).
      *   *Procedure:* Application via the Stakeholder Gateway Portal (SGP), requiring demonstrable proof of targeted impact (e.g., employment contract governed by UDS law, verifiable trade volume impacted by specific tariff). RAASH assigns a "Transient Impact Coefficient" (TIC) valid only for policy domains matching the proven externality.
      *   *Suffrage:* TIC-weighted ballot (range: 0.01 - 0.5 units) applicable solely within the designated policy sphere(s) during the policy's active externality window. Includes issuance of **Temporary Tourist Voter-Cards (TTVC)**: Valid for precisely 48 hours for individuals demonstrably affected by municipal ordinances (e.g., noise restrictions, park access fees) during their stay; activation requires geo-fenced biometric verification at designated kiosks. Status lapses automatically upon policy change or proven cessation of impact.

  *   **2.3 Non-Human Proxies (NHP):** Entities lacking conventional legal personhood but subject to significant welfare impacts from UDS environmental, zoning, or resource management policies (e.g., keystone species, protected habitats, critical watersheds).
      *   *Procedure:* Designation by the Ecological Impacts Board (EIB) based on RAASH-calculated "Welfare Flux Indices." Voting rights exercised by certified Proxy Advocates (PAs) appointed via competitive tender administered by the EIB.
      *   *Suffrage:* Ballot weight calibrated to RAASH's welfare impact assessment (e.g., 0.2 units per 1,000 estimated mature individuals of an endangered species; **Weighted Proxy Ballots for Salmon** in watershed districts based on spawner counts and hydro-dam impact models). PAs file quarterly "Welfare Alignment Statements" justifying ballot use.

  *   **2.4 Probabilistic Future-Generation Avatars (PFGA):** Algorithmic representations modeling the statistically probable preferences and interests of humans born >25 years from present, impacted by decisions with very long-term consequences (e.g., nuclear waste storage, geoengineering, major genetic research frameworks).
      *   *Procedure:* Generated by the Office of Temporal Equity (OTE) using RAASH's "Intergenerational Harmonics Model," incorporating demographic projections, resource depletion forecasts, and cultural continuity algorithms. Avatars are clustered into generational cohorts (e.g., "Cohort 2120," "Cohort 2150").
      *   *Suffrage:* Aggregate ballot weight per cohort determined by RAASH's "Future Discounted Impact Score" (typically 0.0001 - 0.05 units per cohort). Votes cast by OTE Actuaries based on modeled cohort preferences. **Note:** Individuals may petition the OTE for retrospective PFGA status if born after a policy with >50-year externality was enacted without adequate PFGA input; successful petitioners receive a standard informational packet and a commemorative certificate, but **no retroactive suffrage benefits or refunds** (OTE Directive 14.2).

  *   **2.5 Meta-Voters (MV):** A subset of current FCs tasked exclusively with adjudicating amendments to the AIIA itself, including RAASH core parameters and boundary classification rules.
      *   *Procedure:* Selection via the **Recursive Stakeholder Audit (RSA)**: Every 5 years, RAASH identifies the 0.1% of FCs exhibiting the highest "Procedural Reflexivity Quotient" (PRQ), calculated from participation patterns in boundary-relevant deliberative forums and historical voting consistency on meta-governance test questions. Selected individuals undergo mandatory Cognitive Boundary Fitness Assessment.
      *   *Suffrage:* Exclusive competence to vote on AIIA amendments and RAASH recalibration proposals during designated "Constitutional Harmonics Windows." MV status is forfeited upon completion of the amendment cycle or failure of annual PRQ revalidation. **Observance:** The commencement of the RSA cycle is marked by the national holiday **"Boundary Integrity Day,"** featuring public lectures on algorithmic transparency and community discussions on demotic cohesion.

  **3. Appeals & Reclassification:**

  *   **3.1 General Process:** Entities contesting classification may file Form 12-Γ (Stakeholder Status Re-evaluation Request) with the Directorate of Affected Interests Integration (DAII). RAASH performs an initial automated review. Denied requests may advance to a Hearing Officer, requiring payment of a Processing Fee scaled to the claimant's current suffrage weight (FC: Standard Fee; PS: Fee x TIC; NHP: Fee paid by PA; PFGA: Fee waived; MV: Fee + 20% Surcharge).
  *   **3.2 Grounds:** Acceptable grounds include demonstrable RAASH input error, significant change in affectedness profile, or procedural irregularity. Philosophical objections to the AIIA framework are inadmissible (DAII Regulation 8.1).
  *   **3.3 Outcome:** Successful appeals result in reclassification and suffrage adjustment for *future* voting events only. Past ballot weights are deemed final under the principle of "Procedural Finality at Time of Casting" (AIIA § 45.6e).

  **4. Key Operational Notes:**

  *   RAASH recalibration occurs biannually, incorporating new demographic, economic, and ecological datasets. Public summaries of recalibration metrics are published on the DAII Transparency Portal (access requires Level 2 Civic Credentials).
  *   Suffrage weights are dynamically adjusted quarterly for PS entities based on real-time trade/labor data feeds and annually for NHP based on EIB surveys. FC and MV weights remain stable barring reclassification.
  *   All ballot types (including TTVCs and NHP Proxy Ballots) utilize the standardized Secure Harmonic Interface for Tabulation (SHIFT) system. Tampering with SHIFT interfaces invokes penalties under the Democratic Integrity Protection Act.
  *   **Meta-Voter Circularity Mitigation:** The RSA selection algorithm excludes individuals who have held MV status within the previous two cycles and employs randomized "Blind Audits" of its own PRQ calculation parameters by an external algorithmic ethics consortium (contract renewed biennially by the sitting MV cohort).

  **5. Compliance:** Accurate self-reporting of status-affecting changes (e.g., change of residence, cessation of cross-border employment, species population fluctuation) is mandatory under AIIA § 22.3. Failure to report may result in suffrage suspension, reclassification penalties, or administrative fines. The UDS achieves democratic perfection through the meticulous quantification and inclusion of all affected interests. Your compliance ensures harmonic governance.
