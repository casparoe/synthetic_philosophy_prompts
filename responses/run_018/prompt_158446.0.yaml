  The user might be hinting at a need for a more nuanced approach that doesn't privilege certain types of evidence over others. They're probably frustrated with the arbitrary separation and want the exhibit to reflect how these stories function as cultural memory rather than binary history/myth categories. Their deeper need could be advocating for a framework that honors all stories as meaningful collective memories without hierarchical validation.

  For a "graded collective memory" framework, I should emphasize continuity over categories. Each story would be presented on a spectrum of remembrance, focusing on cultural impact rather than factual verification. The exhibit layout would group them thematically, using interactive elements to show how each narrative evolved and remains relevant. This approach avoids privileging archaeological evidence and instead highlights shared human storytelling.

  I need to structure the answer in exactly five numbered points as requested: first explaining the board's presupposed philosophy, then testing its coherence across cases, and finally outlining the new framework's layout. The points should be concise—one or two sentences each—with no intro or conclusion. I'll make sure to address all parts of the query while keeping it analytical and helpful.
answer: |-
  Here are the five points:

  1.  The labeling presupposes a historical philosophy prioritizing *verifiable material evidence* (like archaeology) and *secular textual attestation* as the primary arbiters of historicity, relegating narratives sustained solely by *religious tradition and authority* to the non-historical sphere.
  2.  This philosophy holds inconsistently: it accepts Troy due to Hissarlik's archaeology and textual echoes outside myth, accepts Arthur's kernel based on shaky textual transmission but no archaeology, yet excludes Exodus despite its foundational role in cultural identity and complex textual transmission, primarily because its religious community sustains it and archaeology lacks direct confirmation.
  3.  The inconsistency arises because the board implicitly grants higher weight to archaeological correlation for ancient events (Troy) and lower, ambiguous weight to later literary traditions (Arthur), while dismissing narratives central to living religious identity (Exodus) as beyond historical inquiry due to the lack of secular confirmation and the perceived dominance of faith-based authority.
  4.  Replacing it with a "graded collective memory" framework would categorize all three not as true/false history but as *varying expressions of profound cultural memory*, graded by their scale of societal impact, persistence through transmission (oral, literary, ritual), and role in shaping communal identity over centuries.
  5.  The exhibit layout under this framework would group the three narratives together thematically, with unified displays for each exploring their origins, transmission vectors (bards, chroniclers, scripture), evolving interpretations across time, and enduring cultural significance, using comparative timelines and interactive elements showing memory layers instead of separate "history" vs. "religion" wings.
