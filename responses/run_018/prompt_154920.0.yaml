  **(3) The exact structural feature that makes this undefined rather than merely infinite?**  

  The structural feature is that the series defining the expectation is conditionally convergent but not absolutely convergent. Specifically, the series for the expectation of the individual game is the alternating harmonic series: ∑_{n=1}^{∞} (-1)^{n+1}/n. This series converges conditionally to ln(2) (about 0.693), but the series of absolute values is the harmonic series ∑ 1/n which diverges. Therefore, by the Riemann rearrangement theorem, the terms can be rearranged to converge to any real number, or to diverge. Thus, the expectation is not well-defined because it depends on the order of summation. This is in contrast to the St. Petersburg paradox, which has a divergent series with positive terms (so the expectation is unambiguously +∞).

  **(4) What happens if you cap the rounds at 1000?**  

  If we cap the maximum number of flips to 1000, then the game stops at n=1000 if the first 999 flips are tails and the 1000th is heads (or if at any point we get a head). The payout for n=1000 is (-1)^{1001} * 2^{1000}/1000 = -2^{1000}/1000 (a huge negative number). 

  The expectation for the individual game becomes a finite sum:

     E[X] = sum_{n=1}^{1000} [ (-1)^{n+1} / n ]

  This is a partial sum of the alternating harmonic series. It converges to a finite number (which is approximately ln(2) but with an error bounded by the next term). The error is less than 1/1001. So the expectation is well-defined and finite (about ln(2)).

  Similarly, the consolation payout also becomes a finite sum and thus has a well-defined expectation.

  Therefore, the paradox vanishes: all expectations are finite and well-defined. 

  But note: the payout for n=1000 is astronomically negative (-2^1000/1000, which is about -10^300). So even though the expectation is finite and positive (about 0.693), the possibility of such a huge loss might deter a risk-averse agent. However, the probability of that loss is (1/2)^1000, which is about 10^{-301}. 

  So the paradox vanishes in the sense of undefined expectation, but a residue remains: the possibility of extreme loss (though with negligible probability) might still be a concern for agents with extreme risk aversion or for those who focus on worst-case scenarios.

  **Which feature is actually doing the philosophical work?**  

  The key philosophical work is being done by the conditional convergence (leading to the undefined expectation) in the individual Pasadena games. The coupling between Alice and Bob adds a layer of strategic interdependence, but the undefined expectations are already present in the individual games. 

  **If we strip away the coupling (so they are two isolated Pasadena games), does anything interesting collapse?**  

  Without the coupling, we have two independent Pasadena games. Each person faces a single decision: to play or not. The undefined expectation remains the central issue for each. The coupling adds the strategic element: each player's payout depends on the other's decision. Without the coupling, the problem reduces to two separate Pasadena games. The interesting strategic interdependence (and the possibility of consolation payouts) disappears. 

  However, note that the undefined expectation is still present. The coupling does not cause the undefined expectation, but it complicates the decision because the payout in one scenario (when the other player plays) becomes relevant to the non-player. Without the coupling, if Alice plays, she gets X (undefined expectation) and if she doesn't, she gets 0. The decision is still challenging because of the undefined expectation, but there is no strategic interaction.

  Therefore, the coupling is not just decorative: it introduces a game-theoretic aspect where each player must anticipate the other's move. However, the core undefined expectation is inherent in the individual games. The coupling amplifies the problem by making the undefined expectation appear in more outcomes (e.g., when you decline and the other accepts, you face an undefined payout).

  In summary, the coupling makes the problem more complex and interdependent, but the fundamental issue of undefined expectation comes from the individual Pasadena games.
answer: |-
  ### Scenario
  Alice and Bob are medical researchers offered a clinical trial enrollment bonus by a startup. Each faces a coin-flip wager: flip a fair coin until heads appears; if it takes \(n\) flips (including the heads), the payout is \(\$(-1)^{n+1} \cdot 2^n / n\). The twist is interdependence:  
  - If both enroll, each receives their own payout.  
  - If only Alice enrolls, she gets $0, and Bob receives a consolation of \(-\left[ (-1)^{n+1} \cdot 2^n / n \right]\) (using Alice's \(n\)), and vice versa.  
  - If neither enrolls, both get $0.  

  ---

  ### Analysis  
  **(1) Why expected-utility theory cannot rank the options**  
  The expectation for an *individual* wager is the alternating series \(\sum_{n=1}^{\infty} (-1)^{n+1} / n\), which converges conditionally to \(\ln 2 \approx 0.693\) but not absolutely (harmonic series \(\sum 1/n\) diverges). By the Riemann rearrangement theorem, rearranging terms makes the sum converge to *any real number or diverge*. Thus, the expectation is undefined.  

  For Alice (Bob is symmetric):  
  - **Accept**:  
    - If Bob accepts: Alice gets her undefined-expectation payout \(X\).  
    - If Bob declines: Alice gets $0 (fixed).  
  - **Decline**:  
    - If Bob accepts: Alice gets \(-Y\) (Bob’s payout \(Y\), which has the same undefined expectation).  
    - If Bob declines: Alice gets $0 (fixed).  

  Expected utility depends on Bob’s choice:  
  - \(\mathbb{E}[\text{Accept}] = p \cdot (\text{undefined}) + (1-p) \cdot 0\)  
  - \(\mathbb{E}[\text{Decline}] = p \cdot (\text{undefined}) + (1-p) \cdot 0\)  
  Both are linear combinations of undefined expectations and cannot be ranked.  

  **(2) Maximin vs. satisficing agents**  
  - **Maximin agent** (maximizes worst-case payoff):  
    - Accept: Worst case is \(-\infty\) (if Bob accepts, \(n\) odd gives arbitrarily large negative payouts).  
    - Decline: Worst case is \(-\infty\) (if Bob accepts, \(-Y\) can be arbitrarily large negative).  
    Both actions have unbounded downside. A maximin agent is indifferent and may randomize or default to status quo (decline).  
  - **Satisficing agent** (seeks payout \(\geq 0\)):  
    - Accept: Probability of non-negative payout is \(P(\text{Bob declines}) + P(\text{Bob accepts}) \cdot P(X \geq 0)\).  
      \(P(X \geq 0) = P(n \text{ even}) = \sum_{k=1}^{\infty} (1/2)^{2k} = 1/3\).  
    - Decline: Probability of non-negative payout is \(P(\text{Bob declines}) + P(\text{Bob accepts}) \cdot P(-Y \geq 0) = P(\text{Bob declines}) + P(\text{Bob accepts}) \cdot 2/3\) (since \(P(Y \leq 0) = P(n \text{ odd}) = 2/3\)).  
    For any \(P(\text{Bob accepts}) > 0\), decline has a higher probability of satisficing (\(2/3 > 1/3\)). Satisficing agent **declines**.  

  **(3) Structural feature causing undefined expectation**  
  Absolute divergence: \(\sum |\text{payoff}| \cdot P(n) = \sum 1/n\) diverges, while conditional convergence allows rearrangement to any limit. This contrasts with St. Petersburg (divergent positive expectation) or finite games. The alternating signs and exponential growth create conditional convergence.  

  **(4) Capping rounds at 1000**  
  - Expectation becomes a finite sum: \(\sum_{n=1}^{1000} (-1)^{n+1}/n\), which converges absolutely to a finite value (\(\approx \ln 2\)).  
  - The paradox **vanishes** (all expectations defined), but a "residue" remains:  
    - Extreme outcomes (e.g., \(n=999\): payout \(\sim -10^{301}\)) are possible but astronomically unlikely (\(P \sim 10^{-301}\)).  
    - Risk-averse agents still fear the left tail, but expectation is unambiguously positive.  

  ### Philosophical Insight  
  - **Core feature**: The *conditional convergence* in individual payoffs drives the paradox. The coupling (interdependence) amplifies strategic uncertainty but is not essential to the expectation being undefined.  
  - **Effect of stripping coupling**: With independent Pasadena games, Alice faces a solo wager with undefined expectation vs. $0. The problem reduces to the original Pasadena paradox—still intractable for expected utility, but without strategic depth. The coupling adds game-theoretic complexity (e.g., consolation payouts force players to consider each other’s risks), but the undefined expectations exist even in isolation.  

  ---  
  **Summary**: The paradox hinges on conditionally convergent expectations in individual wagers. Coupling injects interdependence, making others' decisions affect one’s payouts, but the undefined expectation originates in the payoff structure itself.
