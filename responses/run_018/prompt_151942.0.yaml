answer: |-
  Your stall feels deeply familiar—it’s a philosophical knot where metaphysics, decision theory, and ethics tangle. Both camps aren’t just talking past each other, but they’re anchored in distinct paradigms about what "preferences" fundamentally *are*, and this shapes everything from methodology to ontology. The core tension isn’t merely verbal or purely formal; it’s a collision of frameworks, each with its own gravitational pull.  

  Start with the "archaeological" camp. When they speak of "recovering" a hidden structure, they’re implicitly committed to a cognitivist or realist view of preferences: human beings *have* latent, rationally coherent values (even if fragmentary or contradictory in practice), and idealization is a process of *discovery*—like solving an incomplete puzzle where coherence constraints (transitivity, completeness) and full information reveal the intended image. Here, coherence isn’t manufacturing but *correcting* noise. The formal hope is that rational constraints (e.g., Savage axioms) plus asymptotic information *do* converge toward a unique utility function—or at least, that underdetermination is practically manageable. Personal identity survives because the idealized self is continuous with the actual self; it’s *you*, minus the fog.  

  The "manufacturing" camp, meanwhile, operates from a constructivist or expressivist stance. Preferences aren’t pre-existing mental objects waiting to be uncovered; they’re context-dependent, shaped by framing, emotion, and embodiment. When you strip away context (e.g., removing the visceral fear of death in a thought experiment) or extrapolate (e.g., asking what you’d want if you were omniscient), you’re not clarifying—you’re inventing a *new* agent. Coherence doesn’t excavate; it *imposes* an external standard of rationality. The resulting "preferences" belong to a fictional entity (an idealized aggregate self), not to actual humans whose values are irreducibly situated. Here, underdetermination isn’t a bug but a feature: no unique utility function exists because the constraints are insufficient to pin down a choice between incommensurable goods (e.g., liberty vs. security).  

  **So where’s the stall?** It’s threefold.  
  1. **Metaphysical Disagreement**: The camps disagree on whether values exist independently of the agents who hold them. This isn’t resolvable by formal methods—it’s a bedrock philosophical split.  
  2. **Formal Underdetermination**: Even granting the archaeological view, coherence + full information doesn’t guarantee uniqueness. Consider two rational agents with identical knowledge: one might weight future generations heavily, another might prioritize present selves, and both could satisfy all axioms. Normative priors (e.g., egalitarianism vs. utilitarianism) can’t be extracted from coherence alone.  
  3. **Identity Crisis**: Radical idealization *does* threaten personal identity. If CEV transforms you into an impartial, all-knowing observer, is that still *your* will? Or is it a distinct entity borrowing your name? Derek Parfit’s work on identity and ethics looms here—if identity isn’t what matters, the manufactured agent might still have moral weight, but it’s not *yours*.  

  **Can this be resolved?** Not definitively, but progress is possible by reframing:  
  - **Formal Clarification**: A theorem showing that CEV-like aggregation *must* violate minimal conditions (e.g., weakening Arrow’s axioms to account for idealization) could force both sides to concede limits. If no function satisfies "consistency" and "representativeness" simultaneously, the debate shifts to trade-offs.  
  - **Pragmatic Turn**: Drop the metaphysics. Treat CEV as a heuristic for *negotiated* values—a dynamic process where real humans iteratively correct preferences under evolving knowledge, with idealization as a regulative ideal, not an oracle. This leans into procedural rather than ontological claims.  
  - **Empirical Anchor**: Studies on reflective equilibrium (e.g., how people revise preferences when confronted with contradictions or new information) might reveal whether humans *treat* idealization as discovery or invention. If people consistently endorse post-hoc idealized choices as "what they always wanted," the realist gains ground.  

  The impasse won’t end with a knockout argument. It’s a foundational rift. But its energy could be redirected: away from "what we *really* want" and toward "what we *agree to endorse* after scrutiny"—making CEV a tool for democratic will-formation, not a metaphysical mirror. That won’t satisfy purists, but it might unstick the debate. Sometimes, dissolving a problem means changing why we thought it mattered.
