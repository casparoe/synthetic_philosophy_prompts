prompt: |-
  My mum recently had a spinal intervention where she reported feeling the procedure clearly but said the badness was just... gone. I've been trying to work out what this means for the philosophy of pain, specifically whether the unpleasantness is built into the sensation itself or comes from a seperate evaluative layer. Could you outline the main implications of this dissociation for that debate? I'm particularly interested in the parallel with "affective blindsight" applied to nociceptive pathways and in the conceptual problems raised by hypothetical "valence-blocking" implants that preserve sensory detail but eliminate suffering — do they leave genuine pain behind? Please use British English, don't bother with citations or a bibliography, and keep the focus on arguments I can actually use in a seminar I'm running next week. (Writing this on my phone, so apologies for any typos.)
