  For the seminar, I'll structure it around three key implications: 1) the dissociation evidence, 2) the blindsight analogy, 3) the implant thought experiment. The takeaway should be that affect isn't just seasoning on pain - it's the core of what makes pain bad. The sensory bit is just... data.

