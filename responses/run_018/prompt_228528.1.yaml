prompt: |-
  So I'm on a little advisory group for a constitutional reform commission in a mid-sized European country (won't say which, it's not public yet lol) and we're looking hard at replacing or supplementing the elected parliament with an allotted chamber. In a late-night reading group someone dug up this bit from Aristotle's Politics (Book VI, part 2, Jowett translation), where he's listing the characteristic features of democracy:

  "the election of officers by all out of all; and that all should rule over each, and each in his turn over all; that the appointment to all offices, or to all but those which require experience and skill, should be made by lot; that no property qualification should be required for offices, or only a very low one; that a man should not hold the same office twice, or not often, or in the case of few except military offices: that the tenure of all offices, or of as many as possible, should be brief"

  The thing I keep chewing on: Aristotle bundles four distinct mechanisms into one package -- selection by lot, no repeat terms, short tenure, and near-universal eligibility -- but he also carves out an exception for offices that "require experience and skill." I want to stress-test whether that carve-out is doing honest work or whether it's just an aristocratic reflex he couldn't shake.

  Here's the task. Take these seven offices and sort them into three tiers: (A) where you'd happily switch from career-elected/appointed officials to Aristotle's package (lot + short tenure + no repeats), (B) where you'd keep professional selection but add some element of the package (say, term limits without the lot, or a citizen oversight layer), and (C) where the whole package would be a disaster:

  1. The national legislature
  2. The central bank's rate-setting board
  3. Appellate judges
  4. A city's annual budgeting council
  5. Audit officials who scrutinize the accounts of other officials (Aristotle actually seems to think judging accounts is exactly the kind of thing ordinary citizens should do -- see the bits right after the passage)
  6. The head of government
  7. A constitutional review body

  For each one, in a sentence or three: which tier and why, AND whether it falls inside or outside Aristotle's own "experience and skill" exception -- and where you disagree with his placement, say so explicitly.

  Then the part I actually care most about: tell me whether you think the package can be unbundled. My hunch is that the lot and the short tenure solve completely different problems -- one is about who gets in (descriptive representativeness? breaking the career-politician pipeline?), the other about what incentives they face once in (re-election motives, party discipline) -- and that reforms fail when they expect one mechanism to do the other's job. Am I right that these come apart, or does Aristotle's instinct to bundle them track something real, e.g. that rotation only equalizes power if anyone really can hold any office? Grade my hunch out of 10 and correct it where it's wrong.

  Keep the whole thing under 700 words. No citations needed, I can look stuff up myself.
reasoning: |-
  Okay, let me unpack this fascinating constitutional design puzzle. The user is part of an advisory group considering replacing an elected parliament with an allotted chamber, and they've brought Aristotle's framework for analysis. 

  First, I need to address the concrete task: categorizing seven offices into three tiers based on suitability for Aristotle's package. The user wants clear reasoning about whether each office falls under Aristotle's "experience/skill" exception and where we might disagree. 

  Starting with the legislature - this feels squarely in Tier A. Aristotle explicitly excludes experience-heavy roles from sortition, but lawmaking is about representing popular will, not technical expertise. Modern parliaments already struggle with careerism, so rotation+lot could refresh perspectives. 

  The central bank is trickier. Monetary policy requires deep technical knowledge, so Tier C feels right. Aristotle would likely classify this under "require experience and skill" - and here I agree completely. Adding citizen oversight might backfire by politicizing independent institutions. 

  Appellate judges are interesting. Aristotle might put them in the "experience" category, but I see merit in Tier B - perhaps term limits without sortition. Judicial careers create valuable expertise, yet lifetime tenure risks detachment. 

  Budgeting councils feel Tier A. Aristotle's own text suggests accounting scrutiny suits citizens. Annual cycles align perfectly with short tenure. This could combat pork-barrel politics. 

  For audit officials, Tier A seems obvious - Aristotle explicitly names account-judging as citizen-suitable. Modern states might worry about technical complexity, but forensic accounting can be staff-supported. 

  Head of government is firmly Tier C. Crisis response demands accumulated knowledge. Aristotle's exception clearly applies here - even he might balk at rotating novices through executive leadership. 

  Constitutional review sits in Tier B. Unlike routine audits, this blends legal expertise with democratic legitimacy. A mixed model (expert judges + allotted oversight) might work best. 

  Now the conceptual core: can we unbundle Aristotle's package? The user's hunch about mechanisms solving different problems is sharp. Sortition ensures descriptive representation and breaks elite capture, while rotation prevents entrenchment. These absolutely come apart - we could have sortition with longer terms (risking "professionalization" of allotted reps) or elections with strict rotation. 

  But Aristotle's bundling isn't arbitrary. Short terms prevent allotted amateurs from causing lasting damage, while rotation makes universal eligibility credible - if terms are brief and non-repeatable, you don't need everyone to be equally skilled, just sufficiently capable for limited durations. 

  Grading the hunch: 9/10. The user correctly identifies distinct functions, but underestimates how rotation enables sortition by lowering stakes per officeholder. The magic is in the combination creating "episodic competence." 

  Final thought: The real test is whether a system trusts citizens' collective wisdom over time more than individual career expertise. That's the democratic wager Aristotle framed - and we're still stress-testing it.
answer: |-
  Here's your analysis, keeping Aristotle's framework and your unbundling question in mind:

  **Office Categorization:**

  1.  **National Legislature (Tier A):** Aristotle would likely place this *outside* the experience/skill exception. Lawmaking should reflect popular sovereignty, not specialized knowledge. Rotation + lot combats careerism and ensures diverse perspectives embodying the citizenry. I agree – the core democratic function aligns with Aristotle's package.
  2.  **Central Bank Rate-Setting Board (Tier C):** Firmly *inside* Aristotle's exception. Requires deep, sustained expertise in monetary theory, economics, and global markets. Short tenure by lottery would be disastrous for stability and credibility. Keep professional appointment/selection.
  3.  **Appellate Judges (Tier B):** Aristotle might lean towards *inside* the exception (judicial skill). I'd keep professional selection (merit/experience) but add strong term limits (e.g., single 12-15 year term) to prevent entrenchment and reduce partisan calculation, while preserving expertise. Reject lottery entirely here.
  4.  **City's Annual Budgeting Council (Tier A):** *Outside* Aristotle's exception. He saw judging accounts as suitable for citizens. Annual cycle naturally fits short tenure. Lot ensures diverse citizen priorities shape resource allocation, breaking elite capture. Local focus makes complex details manageable.
  5.  **Audit Officials (Tier A):** Aristotle explicitly places this *outside* the exception – judging accounts is precisely the citizen task he champions. Rotating citizens prevent capture by the audited and bring fresh scrutiny. Professional staff can handle technicalities; the overseers provide independence and public trust.
  6.  **Head of Government (Tier C):** *Inside* Aristotle's exception. Requires unique experience in crisis management, complex diplomacy, and sustained policy execution. Coordination demands stability. Short, non-repeatable terms via lottery would guarantee chaos and incompetence. Keep election/appointment based on (perceived) merit/experience.
  7.  **Constitutional Review Body (Tier B):** Aristotle might be conflicted, leaning *inside* (legal expertise). I'd keep professional/judicial selection for core legal reasoning *but* add a strong allotted citizen oversight or ratification layer for major decisions, injecting direct popular legitimacy on fundamental democratic boundaries. Reject pure lottery for members.

  **Unbundling the Package:**

  Your hunch is **largely correct (8/10)**. Aristotle bundles them for a specific *democratic equality* goal: preventing professional political classes and ensuring all citizens share equally in ruling and being ruled. However, the mechanisms *do* solve distinct problems:

  1.  **Lottery:** Primarily addresses **selection equity and descriptive representation.** It breaks elite/careerist monopolies on candidacy and ensures offices reflect the demos statistically. It's about *who gets in*.
  2.  **Short Tenure & No Repeats:** Primarily address **incentive structures and power concentration.** They minimize time for corruption/entrenchment, reduce re-election pandering, force rotation of perspectives, and prevent office-holding from becoming a career. It's about *how they act* and *limiting individual power*.

  **Where your hunch is slightly off & Aristotle's bundling makes sense:**
  *   **Feasibility of Universal Eligibility:** Rotation (short terms + no repeats) makes universal eligibility *practicable*. If terms were long/repeatable, expecting *every* citizen to be competent for *every* complex office becomes unrealistic. Rotation lowers the required competence threshold per citizen per office-holding period.
  *   **Synergy:** Short terms make the *risk* of an incompetent allotted citizen less severe (they're gone soon). No repeats ensures the lottery pool remains large and diverse. Lottery justifies rapid rotation by arguing expertise isn't the primary need (for the offices it's applied to).
  *   **Equalizing Power:** Aristotle's core point: bundling *is* necessary to achieve his specific ideal of *equalized citizen participation in governance over a lifetime*. If you allow repeats/long terms, even with lottery, you get a *different* subset of citizens wielding disproportionate power over time.

  **Conclusion:** The mechanisms *can* be unbundled for pragmatic reform (e.g., term limits for elected judges - Tier B). Your analysis correctly identifies their distinct primary functions. However, Aristotle bundles them because they are *mutually reinforcing* for achieving radical political equality through rotation-in-office. The "experience/skill" exception is crucial – it's where he (correctly) acknowledges that some functions inherently require sustained expertise, making the pure package dangerous.
