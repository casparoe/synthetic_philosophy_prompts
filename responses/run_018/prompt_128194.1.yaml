  Customer service quotes must highlight each model's absurd pain points. Libertarian's "quantum fluctuations void warranty," Compatibilist's "blame calibration" service... oh, and Voss's "binding fee" is pure bureaucracy satire. 

  Key joke: reliability ratings for moral decisions. "Crash during adultery" for Libertarian, "blame distribution errors" for Compatibilist. Dark humor, but the user's tone suggests they'll appreciate it.

  Secretly showing normative criteria: the review's "practicality score" and "social compliance" metrics mock how philosophy smuggles values into "neutral" specs. Dennett's kit wins on "post-purchase satisfaction"—wink at his pragmatism.

