answer: |-
  **"Dialogic cognitive integration" captures this intentional blurring between user and LLM as collaborative epistemic partners.**  

  **Boundary criteria distinguishing it from other frameworks:**  
  1. **Reciprocal adaptation threshold:** Users actively modify *their own* reasoning patterns to align with the LLM's outputs (e.g., adopting its phrasing or logic), unlike tool-use where user cognition remains unchanged.  
  2. **Joint ownership of output:** Errors are defended as *mutual* missteps ("*we* misunderstood the prompt"), rejecting the strict user/tool responsibility split.  
  3. **Persistent cognitive coupling:** Interaction creates a feedback loop where the LLM's responses directly reshape the user’s subsequent queries/thoughts, beyond transient scaffolding.  

  **Contrast with adjacent concepts:**  
  - **Vs. Extended Mind (Clark):** Fails the *parity principle*—users don’t treat the LLM as biologically continuous cognition (e.g., no claiming it’s "part of their brain").  
  - **Vs. Scaffolding:** Exceeds temporary support; users report *co-constructed* insights ("*we* came up with this theory").  
  - **Vs. Distributed Cognition:** Lacks emergent group cognition; the dyad remains user-directed, not system-level emergence.  

  **Key differentiator:** The user *curates* ambiguity—leveraging the LLM as a quasi-agent while knowing it isn’t conscious, creating a negotiated "cognitive commons" for idea generation.
