prompt: |-
  In my philosophy of politics reading group, two members have been deadlocked over the democratic boundary problem, and I am reporting their exchange as a bystander without taking sides. I want a point-by-point adjudication of the arguments as they actually unfolded, plus a diagnosis of where they are talking past each other and what both are missing.

  One member, Mara, began by defending an all-affected-interests principle: anyone whose important interests are significantly shaped by a collective decision should have democratic standing with respect to it. The other, Leo, objected that this renders the demos unworkably expansive—if a nation sets a carbon tax that influences global climate patterns, does every affected person on Earth acquire a vote? Mara conceded that binary affectedness fails here, but proposed replacing it with a graded criterion she called sustained structural exposure: you belong to the demos for a given decision domain only if you live within the institutional reach of its implementation over time, not merely if you suffer diffuse ripple effects. Leo granted that this blocks over-inclusion, but charged that it smuggles in the very boundary it claims to justify—“institutional reach” is delimited by jurisdictional borders, and those borders presuppose a prior demos that authorized them, so the criterion is circular. Mara replied that jurisdictional reach can be defined functionally—say, by the enforcement capacity of a watershed authority or a labor-regulatory body—without requiring prior democratic authorization of the border itself, so no vicious circularity arises. Leo then pivoted to an all-subjected principle: democratic membership should track coercive legal subjection, which yields determinate boundaries (those bound by enforceable law) and avoids arbitrary grading altogether. Mara countered that this excludes precisely the groups most in need of democratic protection—future generations, undocumented residents subject to severe informal coercion, and cross-border communities affected by upstream extraction—while including transient visitors who happen to be present when a law is enforced. Leo responded that these are manageable supplements: you retain the core subjection principle for membership and add stakeholder mechanisms for affected non-members, without dissolving democratic accountability into cosmopolitan vagueness. At this point the argument stalled. Mara accused Leo of treating democracy as a membership club for the legally included rather than as a check on power over lives; Leo accused Mara of dissolving decision procedures into an unbounded affectedness that makes collective choice impossible. They seem partly right, but I cannot tell where the clash is substantive versus terminological.

  Please adjudicate specifically: Is Mara’s sustained structural exposure criterion genuinely non-circular, or does Leo’s circularity charge hold once we distinguish functional enforcement reach from democratically authorized borders? Is Leo correct that Mara’s view risks dissolving accountability, and is Mara correct that Leo’s view arbitrarily excludes vulnerable non-subjected groups? What distinction—perhaps between constitutive and regulative boundaries, or between domain-specific and domain-transcendent membership—might repair the disagreement? Give a verdict on which precise claims stand, which collapse, and what each party is failing to see that would allow them to concede ground without abandoning their core concern.
reasoning: |-
  Okay, the user is presenting a complex philosophical debate between Mara and Leo about the democratic boundary problem. They want me to adjudicate their specific arguments point-by-point and diagnose where they're talking past each other. 

  First, I need to unpack Mara's "sustained structural exposure" criterion. She's trying to solve the over-inclusion problem of the all-affected principle by focusing on institutional implementation over time. Leo's circularity charge is interesting - he's claiming that "institutional reach" secretly depends on pre-existing borders. But Mara counters that functional bodies like watershed authorities could define boundaries without prior democratic authorization. Hmm, she has a point here - not all functional jurisdictions need democratic origins (think of technical regulatory bodies). But Leo isn't entirely wrong either because most enforcement capacities do ultimately trace back to state borders.

  Then there's Leo's pivot to all-subjected principle. It's cleaner administratively but has real exclusion problems - future generations and undocumented people absolutely should matter democratically. His "supplements" idea feels like an afterthought though. Mara's critique hits hard here: democracy shouldn't just protect club members. 

  What's fascinating is how they're both partially right but anchored to different core concerns. Mara cares about power-checking, Leo about decision feasibility. The user's suggestion about constitutive vs regulative boundaries could be key - maybe we need foundational borders for the constitutive demos (Leo's point) but then allow domain-specific participation (Mara's point) within that framework. 

  I should also note their unspoken assumptions: Leo seems to equate democracy with nation-states while Mara wants to transcend that. Neither acknowledges that boundaries serve both inclusion AND exclusion purposes. And they're missing Elster's distinction between who decides the rules versus who gets a say in decisions. 

  For the verdict: Mara's criterion isn't circular functionally, but becomes problematic when scaled to foundational borders. Leo avoids accountability dissolution but at real moral cost. The user might need this clarified with concrete examples - like how a watershed authority could include cross-border communities without requiring them to be formal citizens. 

  The deeper issue is they're using "demos" to mean two things: Mara for issue-specific voices, Leo for foundational membership. Distinguishing these levels could resolve 80% of their deadlock. I'll structure the response to show exactly where each prevails and where they should concede.
answer: |-
  Here is a point-by-point adjudication of Mara and Leo's debate, a diagnosis of their core disagreements, and a proposed resolution:

  ### Adjudication of Arguments
  1. **Mara’s All-Affected Principle & Leo’s Over-Expansion Charge**  
     - *Leo's objection holds*: Binary affectedness *does* risk an unworkably expansive demos (e.g., global votes on carbon taxes).  
     - *Mara’s concession is valid*: Graded criteria (like structural exposure) are necessary to avoid this.  

  2. **Sustained Structural Exposure & Circularity Charge**  
     - **Verdict: Mara’s criterion is *non-circular in function* but *circular at the foundational level*.**  
       - *Functional bodies* (e.g., watershed authorities) *can* define non-arbitrary boundaries without prior democratic authorization (e.g., geographic/ecological contours).  
       - *BUT* Leo is right that *state-level jurisdictional borders* (e.g., national laws) *do* presuppose a prior demos. Mara’s criterion works for *sub-state or transnational domains* but not for *constituting the foundational demos itself*.  

  3. **Leo’s All-Subjected Principle & Mara’s Exclusion Charge**  
     - **Verdict: Leo’s principle avoids over-expansion but *arbitrarily excludes vulnerable groups*, as Mara claims.**  
       - *Undocumented residents/future generations*: Their exclusion is a moral flaw. Informal coercion (e.g., labor exploitation) is politically salient but ignored by legal subjection.  
       - *Transient visitors*: Their inclusion *is* arbitrary but administratively negligible.  
     - Leo’s "supplements" (stakeholder mechanisms) *do not solve the core problem*: Affected non-members get consultative rights, not equal standing, perpetuating power asymmetries.  

  4. **Accountability vs. Feasibility Trade-off**  
     - *Leo is correct*: Mara’s view risks dissolving accountability by making boundaries too fluid for clear decision procedures.  
     - *Mara is correct*: Leo’s view entrenches exclusion by treating democracy as a "membership club," ignoring structural power beyond formal law.  

  ---

  ### Diagnosis: Where They Talk Past Each Other  
  1. **Different Core Concerns**:  
     - **Mara** prioritizes *democracy as a check on power* (who suffers domination?).  
     - **Leo** prioritizes *democracy as a collective agency* (who can feasibly decide together?).  

  2. **Conflated Boundary Types**:  
     - **Constitutive boundaries** (who authorizes the polity’s founding rules?) vs. **Regulative boundaries** (who participates in specific decisions?).  
       - Leo focuses on *constitutive* boundaries (requiring prior demos).  
       - Mara focuses on *regulative* boundaries (domain-specific inclusion).  

  3. **Unacknowledged Assumptions**:  
     - Leo assumes the *nation-state* as the default unit; Mara assumes *governance can be radically pluralized*.  
     - Both ignore that boundaries serve *both inclusion and exclusion*; neither grapples with the necessary trade-offs.  

  ---

  ### Resolution: Distinctions to Repair the Disagreement  
  1. **Separate Constitutive and Regulative Boundaries**:  
     - **Constitutive demos** (Leo’s core concern): Requires prior authorization (e.g., via all-subjected or citizenship). Establishes the "rules of the game."  
     - **Regulative demos** (Mara’s core concern): For *specific decisions*, use **sustained structural exposure** (e.g., watershed residents vote on water policy).  

  2. **Domain-Specific Membership**:  
     - Reject "one demos for all decisions." *Functional jurisdictions* (labor, climate, etc.) can have their own stakeholder demoi.  
     - *Example*: Cross-border communities affected by mining get voting rights in extractive policy decisions.  

  3. **Hybrid Model**:  
     - **Foundational tier**: All-subjected principle for constitutional matters (resolving circularity).  
     - **Domain tier**: All-affected (via structural exposure) for sectoral governance.  
     - **Safeguards**:  
       - For excluded vulnerable groups (e.g., future generations), create *proxy representation* or *constitutional rights*.  
       - For transient inclusion, use *duration thresholds* (e.g., residency requirements).  

  ---

  ### Verdict: What Stands, What Collapses, and Concessions  
  | **Party** | **Valid Claims** | **Flawed Claims** | **Concessions Needed** |
  |-----------|------------------|-------------------|------------------------|
  | **Mara** | • Structural exposure avoids over-inclusion. <br>• Excluding vulnerable groups is unjust. | • Functional boundaries *can’t* resolve *foundational* circularity. <br>• Fluid boundaries *can* undermine accountability. | Accept all-subjected for *constitutive* boundaries. |
  | **Leo** | • Prior authorization avoids circularity. <br>• Clear boundaries enable accountability. | • All-subjected excludes morally relevant groups. <br>• "Supplements" are inadequate for power-checking. | Accept structural exposure for *domain-specific* decisions. |

  **What Both Miss**: Boundaries are *dynamic* and *multi-level*. Democratic theory must distinguish:  
  - **Who constitutes the polity**? (Requires prior authorization).  
  - **Who gets a voice in specific decisions**? (Requires inclusive, functional criteria).  
  - **How to protect the powerless**? (Requires rights/proxy mechanisms beyond voting).  

  By separating these questions, Mara and Leo can agree that **constitutive boundaries need closure** (resolving circularity), while **regulative boundaries can be porous** (resolving exclusion). This preserves Leo’s concern for feasibility and Mara’s concern for power-checking.
