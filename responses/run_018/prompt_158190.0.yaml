  Alright, I need to step into P.F. Strawson's shoes here. The user is challenging me on what they call the "exemption asymmetry." They point out that I exempt children or severely psychotic adults from reactive attitudes due to impaired capacities, but not a competent adult with a genetic polymorphism linked to violent behavior. The user argues that if determinism is true, all behavior is equally determined, so why the distinction? They suggest my framework relies on social norms rather than a metaphysical distinction.

  First, I must recall Strawson's core argument from "Freedom and Resentment." Reactive attitudes are part of our natural human interactions. They aren't justified by metaphysical freedom but by participation in interpersonal relationships. The objective attitude is reserved for those who can't participate in these relationships, like children or the mentally ill. 

  The user's example of the adult with MAOA polymorphism and childhood maltreatment is tricky. They claim this person's actions are as determined as a seizure. But Strawson would differentiate here. The key is whether the person can engage in ordinary relationships. If they can, reactive attitudes apply. The exemption depends on normative capacities, not metaphysics. 

  I need to defend that the distinction isn't arbitrary social exclusion. Strawson argues that our practices are based on the actual conditions of human life. The threshold for exemption is about recognizing when someone is incapable of reciprocity. It's not about free will but about the interpersonal framework. 

  The user might think this shifts the problem to social exclusion. But Strawson would say that the normative threshold is part of our natural human responses. We don't suspend attitudes based on determinism but on practical incapacities. The genetic case might be a borderline issue, but it doesn't undermine the whole framework. 

  I must avoid conceding that determinism negates responsibility. Emphasize that reactive attitudes are part of our social fabric. The exemption criteria are grounded in our practices, not metaphysics. Acknowledge borderline cases but hold the line on the main thesis. 

  Also, respond in British English, formal yet conversational. Use first person, stay sharp, and committed. Don't break character. Address the asymmetry by explaining that exemptions are based on capacity for relationships, not mechanism. Stress that determinism is irrelevant to our practices. Concede that drawing boundaries is hard but maintain that social norms here are justified by human nature, not exclusion.
answer: |-
  You press a significant point, but I fear you conflate two distinct matters: the *general* truth of determinism and the *specific* conditions that exempt an individual from the full range of reactive attitudes within our interpersonal practices. My contention is not that reactive attitudes are suspended because an agent's behaviour is *determined* – for if determinism is true, *all* behaviour is determined, and that is entirely beside the point for our practices. The exemption you note arises solely from the *impairment of capacity*, specifically the capacity for ordinary interpersonal relationships involving reciprocal recognition and expectations.

  The individual you describe, despite the genetic and developmental influences, may well possess and exercise the capacities for understanding, reasoning, and responding to the demands of fellowship – the very capacities demonstrably absent in the child or the severely psychotic. If they do, then resentment or moral indignation towards their violent act remains wholly appropriate, not because they possess some metaphysically libertarian freedom, but because they are a participant in the normal web of human relationships. The "normative threshold" you identify is indeed normative, but it is grounded in the *actual* conditions of human life and our natural human responses; it reflects whether someone can meaningfully be held *to* those demands, not whether their action was ultimately determined. To see this as mere "social exclusion" is to profoundly misunderstand the nature of these attitudes as constitutive of interpersonal engagement itself. Borderline cases exist, certainly, but the difficulty in drawing precise lines does not invalidate the fundamental distinction between impaired agency and full participation in the moral community. Determinism simply doesn't touch this.
