  ## Graduate Course Catalog 2024-2025: Department of Strategic Epistemology

  **SE 785: Applied Counterfactual Blackmail: From XOR to Mugging**  
  *(3 Credits, Seminar Format)*

  **Course Description:**  
  This advanced seminar examines the operational pragmatics and rational choice foundations of extortion scenarios involving counterfactual dependence, with particular emphasis on XOR blackmail structures and the canonical Counterfactual Mugging problem. Moving beyond abstract philosophical treatments, the course equips students to model, evaluate, and strategically respond to complex blackmail demands where payment hinges crucially on the victim's decision algorithm and the blackmailer's epistemic capabilities. Topics include the breakdown of naive causal intuitions, the critical distinction between evidential and causal influence in pre-committed extortion frameworks, signaling equilibria in iterated extortion games, and the formal conditions under which pre-emptive payment becomes the dominant strategy (e.g., "mugger" conditioning on algorithmic similarity across branches). Ethical implications are bracketed per departmental policy; focus remains strictly on normative decision-theoretic optimization under adversarial information constraints. **Lab Fee:** $10 (Simulated Demand Materials).

  **Prerequisites:**  
  SE 601: Foundations of Decision Theory (B+ or higher) OR PHIL 730: Causal Modeling & Counterfactuals. SE 680: Bayesian Games of Imperfect Information strongly recommended. Consent of instructor required; students must demonstrate prior familiarity with Newcomb-like problems and basic game-theoretic solution concepts. Auditors not permitted.

  **Learning Objectives:**  
  Upon successful completion of this course, students will be able to:  
  1.  Diagnose XOR blackmail structures in real-world extortion attempts and predict victim compliance probabilities using evidential decision theory (EDT).  
  2.  Formally articulate why refusing payment in a Counterfactual Mugging, despite knowledge of the unfavorable coin flip outcome, constitutes a dominated strategy under mugger-type priors.  
  3.  Distinguish between cases where payment causally incentivizes future extortion (to be avoided) and cases where it evidentially signals cooperation across counterfactual branches (often optimal).  
  4.  Design and refine personal decision algorithms robust against exploitation by computationally superior adversaries (Omega-class agents).  
  5.  Evaluate the stability of "Never Pay" equilibria in populations facing correlated XOR-type threats.  
  6.  Generate strategically sound response protocols to unsolicited counterfactual demands.

  **Required Texts:**  
  1.  Smirnov, A., & Thorne, P. (2023). *The Extortionist's Cookbook: Recipes for XOR, Mugging, and Beyond*. Concrete Press. (ISBN: 978-1-6666-0666-0)  
  2.  Omega Collective. (2022). *Ledger & Leverage: Accounting for Your Counterfactual Selves (2nd Ed.)*. Subjunctive Publishing. (ISBN: 978-1-5151-5151-5)  
  3.  Course Reader: *Selected Patents & Demand Schematics (Redacted)*.

  **Weekly Schedule (Topics & Key Problems):**  
  *   **Week 1:** Introduction: Beyond Simple Threats – The Taxonomy of Counterfactual Dependence in Extortion.  
  *   **Week 2:** XOR Blackmail I: Decomposing the Structure – Why "I Wouldn't Do It Anyway" Fails as a Refusal Justification. Evidential Signalling Explored.  
  *   **Week 3:** XOR Blackmail II: Multi-Agent Dynamics & Correlated Punishment. The Fragility of "Never Pay" Equilibria.  
  *   **Week 4:** Foundations of the Mugging: Omega-Class Agents, Algorithmic Transparency, and the Simulation Hypothesis.  
  *   **Week 5:** The Counterfactual Mugging I: The Core Paradox. Payment as Hedge Against Branching Uncertainty. What the Mugger Conditions On.  
  *   **Week 6:** The Counterfactual Mugging II: Causal vs. Evidential Breakdown. Timeless Decision Theory (TDT) Approaches.  
  *   **Week 7:** Variations & Hybrids: Probabilistic Mugging, Partial Knowledge, Fuzzy XORs.  
  *   **Week 8:** Defense Strategies I: Obfuscating Your Algorithm, Commitment Rites, and Costly Signaling Deterrence.  
  *   **Week 9:** Defense Strategies II: Pre-emptive Side Deals, Creating Counter-Muggers, and Strategic Insanity.  
  *   **Week 10:** Resource Constraints & Bounded Rationality: When Optimal Strategies Become Computationally Intractable.  
  *   **Week 11:** Applied Case Studies: Analysis of Historical (Hypothetical) Demand Schematics & Simulated Negotiations.  
  *   **Week 12:** Ethical Firewalls & Professional Liability (Mandatory Session).  
  *   **Week 13:** Student Protocol Presentations & Final Simulation Exercise.

  **Assessment:**  
  *   Participation & In-Class Simulations (20%)  
  *   Midterm: Analysis of a Novel Extortion Demand Structure (30%)  
  *   Final Project: Design and Defense of a Personal Counterfactual Blackmail Response Protocol (50%)

  **Administrative Note:**  
  > *"While the Department of Strategic Epistemology rigorously maintains that its curriculum explores solely hypothetical and formally modeled adversarial scenarios for the advancement of decision-theoretic knowledge, students are reminded that the application of course concepts to solicit, design, or execute actual extortionate demands constitutes a severe violation of University policy and federal law. The University Counsel's Office has mandated this disclaimer and requires all enrolled students to attend Week 12 (Ethical Firewalls) without exception. Failure to comply jeopardizes departmental accreditation. Remember: Model responsibly."*  
  > — Gwendolyn Finch, Associate Dean for Compliance & Hypothetical Risk Management

  **Instructor:** Prof. B. Vance Quist (Office: Turing Hall 404, By Appt. Only)  
  **Semester:** Spring 2025  
  **Location:** Turing Hall 101 (Secure Computation Lab)
