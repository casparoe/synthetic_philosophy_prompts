answer: |-
  The institutional binary classification in evolutionary genomics—labelling non-coding sequences as either "functionally constrained" (implying purifying selection) or "neutral" (evolutionary noise)—rests upon several intertwined philosophical commitments about causality, functionality, and evolutionary explanation. These commitments, while pragmatically useful for computational annotation, embed a tacit adaptationist framework that struggles to accommodate Gould and Lewontin's concept of non-adaptive spandrels. Let us reconstruct the implicit theory, distinguish strict entailments from comfortable fits, assess compatibility with spandrel-based genome architecture, and outline necessary changes if the critique were taken seriously.

  ### Philosophical Commitments Presupposed
  1. **Causal Dichotomy of Persistence**:  
     The practice presupposes that any evolutionarily persistent biological structure must owe its stability to *one of two exclusive causes*:  
     - **Direct selective advantage** (functional constraint), or  
     - **Absence of phenotypic effect** (neutrality, permitting unconstrained mutation).  
     This leaves no conceptual space for sequences preserved due to **developmental or structural necessity** independent of selection *for their specific sequence*.  

  2. **Functionality Equated with Adaptation**:  
     "Functionally constrained" implicitly defines "function" as a trait *actively maintained by natural selection* for its adaptive value. Structural or generative roles (e.g., DNA segments required for chromatin folding or RNA splicing machinery) are subsumed under adaptationist logic: if conserved, they *must* be conserved *for* an adaptive purpose.  

  3. **Neutrality as Epiphenomenalism**:  
     "Neutral" sequences are treated as causally inert "junk" or "fossils." This ignores that neutrally evolving regions may still have **indirect architectural roles** (e.g., spacing between functional elements) or latent functional potential exapted later.  

  4. **Methodological Adaptationism**:  
     The framework prioritises detecting signals of selection (e.g., sequence conservation, dN/dS ratios) as the *primary explanatory goal*. Non-conserved sequences default to neutrality by absence of evidence, not evidence of absence of function.  

  ### Entailments vs. Comfortable Fits
  - **Strictly Entailed**:  
    The binary *requires* that any sequence under purifying selection is adaptively functional. It *does not strictly entail* that all functional elements are adaptive (e.g., a spandrel could be conserved due to pleiotropy), but it **lacks a category for non-adaptive functional necessity**. Crucially, it *rules out a priori* that sequences could be:  
    - **Indispensable yet selectively neutral**: Preserved because mutations are developmentally lethal or disruptive, *not* because selection favours their specific sequence.  
    - **Evolutionarily stable spandrels**: Maintained by structural constraints (e.g., genomic topology) rather than direct fitness benefits.  

  - **Merely Comfortable Fit**:  
    The framework *accommodates* but does not *require* pan-adaptationism (all sequences are adaptive). It is *compatible* with rare spandrels being misclassified as "functional" if conserved, but only by **conflating developmental constraint with adaptation**. Neutral sequences *can* include spandrels with no sequence-specific role, but this obscures their structural indispensability.  

  ### Compatibility with a Spandrel-Based Genome Architecture
  The current system is **fundamentally incompatible** with a robust spandrel view for three reasons:  
  1. **Misattribution of Cause**: Spandrels conserved due to developmental constraint (e.g., intron length requirements for spliceosome assembly) would be annotated as "functionally constrained," falsely implying they were *shaped by selection for function*.  
  2. **Invisibility of Non-Conserved Spandrels**: Spandrels with sequence-independent roles (e.g., DNA as a physical spacer) may evolve neutrally but remain indispensable. These are discarded as "neutral" noise.  
  3. **Pleiotropy Oversimplified**: Spandrels arising from pleiotropic effects (e.g., a non-coding enhancer hitchhiking with a vital gene) are either labelled "functional" (if conserved) or "neutral" (if not), ignoring their non-adaptive origins.  

  ### Necessary Changes to Annotation and Funding
  If evolutionary biology integrated Gould-Lewontin’s critique as an organising principle:  

  1. **Annotation Protocols**:  
     - Introduce a **third category: "structurally constrained"** for sequences indispensable due to biophysical, developmental, or topological reasons, *without* evidence of sequence-specific selection.  
     - Develop **metrics for structural/genomic constraint** (e.g., mutational robustness assays, 3D chromatin interaction maps) alongside conservation scores.  
     - Mandate **causal ambiguity flags** where conservation may reflect pleiotropy or hitchhiking.  

  2. **Funding Criteria**:  
     - Prioritise projects investigating **non-adaptive causes of conservation** (e.g., "mutation buffering" in gene-dense regions).  
     - Support **method development for detecting architectural constraints** (e.g., AI modelling of genome folding energetics).  
     - Require **explicit consideration of spandrel hypotheses** in functional genomics grants.  

  3. **Theoretical Reframing**:  
     - Replace "functional" with **"selectively functional" vs. "developmentally functional"** in databases.  
     - Accept that **conservation ≠ adaptation**: Purifying selection may maintain spandrels due to inability to vary, not adaptive value.  
     - Embed **hierarchical models** where genome architecture (a spandrel of physical constraints) enables or constrains adaptive sequence evolution.  

  ### Conclusion
  The prevailing binary classification presupposes a neo-Darwinian worldview where persistence implies either adaptation or inertness. It thus marginalises Gould-Lewontin’s spandrels by forcing them into categories misrepresenting their causal history. To take the critique seriously, genomics must decouple "functional constraint" from "selective constraint," formally acknowledge developmental necessity as a distinct cause of stability, and redesign annotation systems to reflect that genomes are not merely adaptive blueprints, but also historical artefacts shaped by structural and generative constraints. This demands not just new database fields, but a philosophical shift from gene-centric adaptationism to a multilevel theory of evolutionary causality.
