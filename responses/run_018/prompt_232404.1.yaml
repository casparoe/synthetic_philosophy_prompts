  ### **Scoring Key**  
  Tally how often you chose each letter. Your dominant letter (4+ matches) indicates your primary view:  

  - **Mostly A: Rule-Based/Legalist**  
    *Corruption = breaking formal rules.* Favors clear, predictable standards. Believes actions within rules are acceptable, even if unfair.  

  - **Mostly B: Public-Interest**  
    *Corruption = betraying public trust, regardless of rules.* Focuses on harm from bias, inconsistency, or hidden influence.  

  - **Mostly C: Relational**  
    *Context defines corruption.* Sees genuine relationships (family, community) as justifying acts outsiders might call corrupt.  

  - **Mostly D: Universalist**  
    *Corruption = systemic favoritism that entrenches inequality.* Rejects even legal favor-swapping if it advantages groups unfairly.  

  #### **Mixed Positions**  
  - **A+B:** Pragmatic Legalist (rules matter but not if harm is severe).  
  - **B+D:** Systemic Critic (focuses on harm and inequality; common overlap).  
  - **C+A or C+B:** Contextual Realist (navigates rules/relationships but inconsistent on harm).  

  #### **Limitations & Caveats**  
  1. **Indistinguishable Pairs:**  
     - **Public-Interest (B) vs. Universalist (D)** often align (both condemn acts causing harm/inequality). They diverge only when harm is non-immediate (e.g., Q5’s "symbolic debt" vs. systemic normalization).  
     - **Relational (C) vs. Rule-Based (A)** overlap when relationships align with rules (e.g., Q4’s "family business support").  

  2. **Undefended Patterns:**  
     - **Consistent D (Universalist) + C (Relational):** Rare—relational views reject inequality arguments as "external standards."  
     - **Consistent A (Rule-Based) + B (Public-Interest):** Contradictory—rules vs. harm are opposing frameworks.  

  3. **Gray Areas:**  
     - Q7 (tutoring) splits Public-Interest and Universalist: B sees immediate harm (resource misuse); D sees long-term inequality.  
     - Q5 (funeral gift) splits Relational and Rule-Based: C prioritizes culture; A prioritizes written policies.  

  **Use This Quiz To:**  
  - Group members by *applied judgments* (not debated labels).  
  - Discuss why identical acts (e.g., gifts vs. bribes) map differently across positions.  
  - Explore tensions (e.g., "If rule-breaking is your only red line, what stops legal but harmful acts?").  

  This reveals how your group’s debates stem from clashing definitions—not just cases. Tailor follow-up discussions to these fault lines!
