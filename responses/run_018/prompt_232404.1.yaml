     D) Corruption — *this entrenches wealth-based influence.*  

  4. **A procurement officer awards a contract to his cousin’s firm. The bid matched competitors, and nepotism isn’t forbidden for small contracts.**  
     A) Not corruption — *rules were followed.*  
     B) Corruption — *public funds should never serve private ties.*  
     C) Not corruption — *supporting family businesses is ethical.*  
     D) Corruption — *it excludes non-connected businesses.*  

  5. **At a community funeral, a grieving family gives a building inspector a $150 cash "condolence gift." The inspector has no pending cases involving them.**  
     A) Not corruption — *no rules ban cultural gifts.*  
     B) Corruption — *officials must avoid even symbolic debts.*  
     C) Not corruption — *this is about shared grief, not influence.*  
     D) Corruption — *it normalizes payments to officials.*  

  6. **A mayor hires her nephew for a summer internship. The hiring manual allows relatives if qualified (he was), but critics call it favoritism.**  
     A) Not corruption — *the manual permits it.*  
     B) Corruption — *it undermines merit-based hiring.*  
     C) Not corruption — *hiring kin builds community trust.*  
     D) Corruption — *it replicates class privilege.*  

  7. **A teacher stays after school to tutor her child and two neighbors’ kids for free. Other parents lack this access.**  
     A) Not corruption — *no rules forbid voluntary tutoring.*  
     B) Corruption — *it uses public role for private gain.*  
     C) Not corruption — *teachers should help their community.*  
     D) Corruption — *it widens educational gaps.*  

  8. **A tax official reduces a penalty for a friend’s business after verifying an error. Rules allow discretion, but strangers rarely get this leniency.**  
     A) Not corruption — *discretion is legal.*  
     B) Corruption — *consistency matters more than rules.*  
     C) Not corruption — *friendship justifies extra effort.*  
     D) Corruption — *it privileges connected businesses.*  

