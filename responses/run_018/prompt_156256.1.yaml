answer: |-
  You're absolutely right—the "clarifies concepts" answer is too passive, and your "frame-locking" concept nails the active, *structural* mechanism. Here’s how frame-locking misleads us about moral/metaphysical reality (not just confuses us) and perpetuates cyclical debates, grounded in settled cognitive science while respecting philosophical fault lines:

  ### 1. **How Frame-Locking Actively Distorts Access to Reality**  
     - **Settled (Cognitive Science):** Human cognition is **frame-dependent**. Frames trigger heuristics (e.g., loss aversion, omission bias) and selectively activate neural/semantic networks. Competing frames aren’t just "ignored"—they’re **inhibited** pre-consciously (e.g., the trolley’s "switch" frame suppresses "shared responsibility" or "systemic failure" frames).  
     - **Why This Misleads**: Moral/metaphysical truths (if they exist) should be frame-*invariant*. But frame-locking **artificially binds intuition to contingent features** of the pump’s architecture. The Experience Machine’s "plugging in" isn’t a neutral description—it’s a **discrete-event frame** that:
       - Suppresses diachronic identity (settled: we *do* make life-altering "plug-in" decisions like careers/marriage, but they’re framed as processes).  
       - Hijacks risk-aversion circuits (settled: loss aversion dominates when choices are framed as high-stakes binary switches).  
     - **Result**: We conflate **frame-driven intuitions** with insights into reality. The pump isn’t clarifying "justice" or "well-being"—it’s generating a *simulacrum* of moral insight tied to its own scaffolding.

  ### 2. **Why Philosophers Recycle Debates Despite "Agreement"**  
     - **Settled (Moral Psychology):**  
       - Intuitions are **mutable under framing** (e.g., identical dilemmas elicit opposite judgments if "lives saved" vs. "lives lost" is emphasized).  
       - Disagreements often stem from **differential sensitivity** to suppressed frames (e.g., deontologists "see" the trolley’s action-omission asymmetry; consequentialists "see" net utility).  
     - **The Frame-Locking Trap**:  
       - Pumps like the Trolley or Experience Machine are **rigidly optimized**. They don’t just highlight one perspective—they **cripple cognitive mobility**. When Philosopher A attacks the pump, they’re often attacking the *frame* (e.g., "Why privilege ‘physical lever’ as agency?"). Philosopher B defends *their* intuition ("But flipping *feels* significant!").  
       - **No Neutral Ground**: The pump’s architecture *defines* the "facts." Agreement on "5 saved vs. 1 killed" is superficial—it’s like agreeing on chess moves while disagreeing on the rules. The *contestable metaphysical stakes* (e.g., "Is agency reducible to causal chains?") remain obscured by the frame.  
     - **Result**: Debates loop because opponents are **locked in incommensurable frames**. Resolving the surface case doesn’t resolve why one frame maps to reality better—so the pump gets reused, hoping to "crack" the opponent’s frame.

  ### 3. **Where the Real Disagreement Lies**  
     - **Settled Ground**:  
       - Framing effects exist and distort judgments (robust empirical consensus).  
       - Moral intuitions are context-sensitive and non-universal (psychology/cross-cultural data).  
       - No evidence that "untutored intuitions" reliably track moral truth.  
     - **Contested Philosophical Territory**:  
       - **Moral Realism vs. Anti-Realism**: Does frame-independence *matter*? If moral facts are mind-dependent (anti-realism), frame-locking might reveal useful conventions. Realists must argue suppressed frames access *truer* perspectives.  
       - **Metaphysical Commitments**: Does the Trolley’s "forced choice" frame reflect *real* moral ontology (e.g., irreducible dilemmas), or is it an artifact? Contention over how tightly morality binds to "action" vs. "omission."  
       - **Epistemic Status of Intuitions**: Are some frames *reliably* truth-tracking (e.g., does identity-continuity in life planning map to personal identity metaphysics?), or are all frames heuristic tools?  

  ### The Core Argument  
  Frame-locking doesn’t just "confuse"—it **creates epistemic illusions**. By structurally suppressing competing frames, pumps:  
  - **Simulate necessity** (what *feels* obvious is often just cognitively isolated),  
  - **Mistake heuristic dominance for truth** (if a frame "wins" evolutionarily—e.g., risk-aversion—it doesn’t mean it tracks moral reality),  
  - **Preempt meta-framing** (we debate *within* the trolley’s "binary switch" frame, not *about* whether reality allows neutral actions).  

  Philosophers recycle pumps because they’re **fighting the frame, not the facts**. Until the frame itself is interrogated as a contingent construct—not a transparent window—we remain stuck in its architecture. The solution isn’t abandoning pumps, but treating them as *objects of suspicion*: "What frames does this suppress, and why might those matter?" That’s where your concept shifts the game.
