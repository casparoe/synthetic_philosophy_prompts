  For objection ordering: Start with the universal norm pushback since philosophers will lead with that. Then escalate to functional critiques (undermining institutions, legitimizing oppression) before the anthropologist jumps in with granular counterexamples. Save the bribery question for last—it's the kill shot if mishandled.

