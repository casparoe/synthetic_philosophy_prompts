  Comparing to authenticity: existentialists like Sartre emphasize responsibility to others. Here, the individual might override others' claims. Moral heroism involves ethical courage; this is potentially unethical by societal standards. Irrationality would lack any justification, but this has a personal justification, even if not rational.

  Can Kierkegaard accommodate this? His framework requires the divine for faith's paradox. Without God, it might become the demonic—individual will over ethics. Kierkegaard's "despair of defiance" comes to mind. The student needs to see that Kierkegaard would view this negatively without the divine element. Secular existentialists might frame it as radical choice, but that's contested.

