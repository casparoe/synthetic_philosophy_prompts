  So I've been stuck on Berkeley's master arguement—specifically the move where he claims you can't frame an idea of an unpercieved object without implicitly percieving that idea yourself. People usually dismiss it as a slip between object-level and meta-level representation. But I'm trying to apply it to a concrete case: imagine a large-scale sensor network that logs data to distributed storage, but there's no central dashboard or agent that ever integrates those logs into a single representation. Does Berkeley's reasoning force us to deny that the unintegrated logs have any ontological weight, or does the argument just collapse once we drop the assumption that all existence-claims need a unified mental host?

  What are the most important implications of the master argument for these kinds of 'no-central-observer' existence claims? I want the philosophical fallout, not a reading list. Also I probably misspelled something above—feel free to notice it, but mostly I'm after whether the argument actually bites outside human minds.
