  Hey - I'm working on a novel about a parliament that implodes and I need you to think like a sharp philosopher who also reads weird institutional sci-fi. Before you answer, take a minute to brainstorm three objections you think someone would raise. Okay? So Simone Weil had this idea that political parties are basically machines for manufacturing collective passion and crushing individual moral judgement - you know, the essay where she argues for getting rid of them. Alot of people read that as pure abolitionism. But I want you to make the opposite case: that her critique actually points to a specific design fix, what I'm calling "rotating adversarial cells." In this setup, legislators are randomly reassinged every session and legally required to argue against whatever position they held the week before, so party loyalty becomes structurally impossible. Argue that this is the real logical endpoint of Weil's view - not banning parties, but redesigning them so collective passion can't form. Don't cite anything or give me a bibliography; I'm writing fiction, not an academic paper. Also, be honest about your own reasoning: tell me exactly what argument or finding would change your mind, and identify where you think your reasoning is shakiest. I'm sure there's a typo or two in this prompt but thats fine.
