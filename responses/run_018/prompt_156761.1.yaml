    - **Shift to LOWER credence (e.g., → 0.40):** If the promise was vague ("I’ll help move the piano soon"), and she misinterpreted "soon" as "this weekend" while you meant "this summer." Here, the ambiguity makes her release plausibly valid—she waived the duty *as she understood it*, and your vagueness contributed to the misunderstanding.

