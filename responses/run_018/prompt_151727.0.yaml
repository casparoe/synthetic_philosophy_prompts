  ### Key Justifications:
  1. **Strawson's Spectrum**: Reactive attitudes include both personal (resentment) and impersonal (indignation) forms (*contra* Leah's strict dyadism).  
  2. **Objective Attitude Definition**: Requires seeing someone as exempt from moral demands (e.g., as psychologically abnormal), not merely proceduralizing emotions. Marcus correctly identifies this.  
  3. **Explanations & Excuses**: Explanations dissolve reactive attitudes only if they undermine seeing the agent as a "normal" moral participant (Strawson's "participant attitude"). Marcus rightly notes this is contextual.  
  4. **Missing Element**: Both neglect how Strawson treats the offender's guilt as a *self-reactive attitude* central to moral responsibility. Restorative justice aims to elicit this, reinforcing (not suspending) the reactive structure.
