prompt: |-
  I'm a phd student in aesthetics and i'm running a session next week for an undergrad/grad reading group on Du Bois's propaganda thesis—specifcally the claim in Criteria of Negro Art that all art is propoganda and Black artists shouldn't chase 'art for art's sake.' The audience has mostly read Souls of Black Folk but not the Criteria essay, so they know the sorrow songs but not his polemical framing. Don't explain the thesis to me; plan how I should teach it.

  What order do the pieces have to go in so they don't just hear 'propaganda = bad Soviet posters'? What's the one concrete example—probably one of the sorrow songs or maybe a reference to a specific visual work—that should carry the whole session, and what must it have (beauty + political work visible at once) and lack (pure didacticism without aesthetic form)?

  I'm expecting they form at least three misconceptions: that Du Bois rejects beauty for politics, that he means propaganda in teh modern manipulative sense, and that he's just saying Black art should be political like a billboard. Where exactly in the sequence do I head each one off?

  Also I want to sit them with a gap he never resolves: he distinguishes propaganda for justice from propaganda for evil but never gives the criterion, and I think the best teaching moment is letting them feel that absence rather than papering over it. So what's the dependency chain—what idea has to land before they can even see the gap? What's a check question at the end that shows whether they understand the collapse of beauty and propaganda rather than just parroting the thesis? And what should I openly refuse to cover—maybe the Black Arts Movement comparison, or the full history of 'art for art's sake'—and say so?

  Plan it out: the sequence with dependencies, the carrying example and its design specs, the misconception map with deflection points, the check, and the explicit omissions.
reasoning: |-
  Okay, let me tackle this teaching plan request. The user is a PhD student in aesthetics preparing a session on Du Bois's "propaganda thesis" from "Criteria of Negro Art" for an undergrad/grad reading group. They've clearly done their homework - they know the material well and have identified key pedagogical challenges. 

  First, I need to consider the audience's background: they've read Souls but not Criteria, so they're familiar with the sorrow songs but not Du Bois's explicit framing of art as propaganda. The main risk is them misinterpreting "propaganda" through modern negative connotations. 

  The core teaching challenges are:
  1) Overcoming three specific misconceptions about Du Bois's position
  2) Using one strong example that shows beauty and politics fused
  3) Leaving them with the deliberate gap about distinguishing good/evil propaganda
  4) Designing a sequence where concepts build properly

  For the sequence, I think we need to start from what they know - the sorrow songs from Souls - to bridge to the new material. "Deep River" seems ideal as the carrying example because it meets the specs: it's beautiful art that obviously functioned as survival propaganda. Its ambiguity avoids didacticism while showing political work.

  For misconception prevention:
  - The "beauty vs politics" myth can be headed off when defining propaganda through the sorrow songs
  - The "manipulative propaganda" concern should be addressed when contrasting Du Bois's usage with modern associations
  - The "billboard art" reduction needs tackling when analyzing how Deep River works aesthetically

  The dependency chain for revealing the unresolved gap is crucial. They must first fully grasp Du Bois's fusion of beauty/propaganda before noticing he doesn't define the justice criterion. The check question should force them to articulate this fusion - maybe asking how Deep River would change if it were "just" propaganda versus "just" art.

  For boundaries, I'll explicitly exclude Black Arts Movement comparisons and full "art for art's sake" history to maintain focus. The session should end with that productive tension about justice lingering, not resolved.

  The whole sequence needs to move from concrete example to theoretical framing, then back to example analysis, ending with the deliberate gap. Pacing matters - more time on Deep River analysis than on defining terms.
answer: |-
  Here's a structured teaching plan focused on conceptual building blocks, misconception prevention, and leveraging productive tension:

  **Core Sequence & Dependencies:**

  1.  **Anchoring in the Known: Sorrow Songs as Foundational Art (10 mins)**
      *   **Activity:** Quick recall/review of Sorrow Songs in *Souls*. What *were* they? (Religious folk songs, artistic expression, cultural survival, coded communication).
      *   **Dependency:** Establishes Du Bois's deep engagement with Black art *before* "Criteria." Shows he values complex aesthetic forms.
      *   **Key Q:** "What *work* did the Sorrow Songs do beyond being 'beautiful'? (Survival, community, resistance, theology, history-keeping)."

  2.  **Introducing the Polemic: The Provocation (5 mins)**
      *   **Activity:** Read aloud the key passage: *"Thus all Art is propaganda and ever must be, despite the wailing of the purists. I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy. I do not care a damn for any art that is not used for propaganda."*
      *   **Focus:** Highlight the absoluteness ("all Art," "utter shamelessness," "do not care a damn") and the specific goal ("gaining the right... to love and enjoy").
      *   **Dependency:** Sets up the thesis starkly, priming them for clarification.

  3.  **Defining Du Boisian "Propaganda" (Not the Soviet Poster!) (15 mins)**
      *   **Activity:** Brainstorm modern connotations of "propaganda" (manipulation, lies, simplification, top-down control). **Then contrast:**
          *   Du Bois's audience: Oppressed people needing strength AND a hostile world needing truth.
          *   Du Bois's goal: *Humanization, justice, the right to full humanity* (link to "love and enjoy").
          *   Du Bois's context: Pervasive anti-Black propaganda (scientific racism, minstrelsy, stereotypes) necessitating counter-narratives.
      *   **Misconception Head-Off #1 (Manipulative Sense):** Explicitly state: "Du Bois is NOT advocating for lying, simplification, or manipulation. He's advocating for art that *truthfully* asserts Black humanity and fights for justice against a system saturated with *false* propaganda dehumanizing Black people. It's propaganda *for* truth and humanity against propaganda *for* oppression."
      *   **Dependency:** Crucial foundation. They must grasp this redefinition before proceeding.

  4.  **The Carrying Example: "Deep River" (Sorrow Song) (20 mins)**
      *   **Why it Works:**
          *   **Beauty:** Haunting melody, profound spiritual yearning, rich metaphorical language ("Deep River," "Promised Land"), complex emotional texture (sorrow/hope).
          *   **Political Work Visible:**
              *   Assertion of interiority & spiritual depth countering stereotypes.
              *   Expression of suffering under oppression ("my home is over Jordan" as escape).
              *   Coded language of resistance/escape (possible Underground Railroad reference).
              *   Community building & solace.
              *   Preservation of cultural identity.
          *   **Lacks Pure Didacticism:** Not a political speech set to music. Its meaning is layered, metaphorical, emotional, open to interpretation. Its power lies *in* its aesthetic form. The political work emerges *through* its beauty and spiritual depth, not despite it.
      *   **Activity:** Play a recording. Analyze lyrics & musical qualities. Ask: "How does its *artistry* (beauty, complexity, emotion) *enable* its political/humanizing work? Could a blunt political slogan achieve the same depth of feeling and truth-telling?"
      *   **Misconception Head-Off #2 (Rejects Beauty):** "Du Bois isn't rejecting beauty; he's rejecting beauty *detached* from the reality and struggle of Black life. 'Deep River' *is* beautiful, and its beauty *is essential* to its power as propaganda for humanity." **Link:** This beauty *is* the vehicle for the truth-telling.
      *   **Dependency:** Demonstrates the fusion. Proves "propaganda" ≠ crude message.

  5.  **Contrast: What Does "Art for Art's Sake" Exclude? (10 mins)**
      *   **Activity:** Briefly define "Art for Art's Sake" (Aestheticism: art valued solely for form, beauty, technique, divorced from morality, politics, utility).
      *   **Key Q:** "If 'Deep River' were judged *only* by 'pure' musical form or abstract beauty, what crucial dimensions of its meaning and power might be ignored or dismissed? (Its historical context, its function for its creators/singers, its assertion of humanity under oppression)."
      *   **Du Bois's Point:** Demanding Black artists pursue *only* this detached ideal ignores the urgent need to fight dehumanization and denies the inherent connection between their art and their lived reality. It's a luxury of the privileged/oppressor.
      *   **Misconception Head-Off #3 (Billboard Art):** "Du Bois isn't calling for art that's *only* a political billboard. Look at 'Deep River' – its power is subtle, complex, beautiful, deeply felt. It works *because* it's profound art, not despite it. Propaganda here means art *engaged with the world*, art that *matters* to the struggle for life and dignity." **Contrast:** A billboard might be pure message; Du Bois demands art where message and form are inseparable and elevated.

  6.  **Revealing the Gap: Justice vs. Evil Propaganda (10 mins)**
      *   **Activity:** Return to the quote: He demands art used "for gaining the right of black folk to love and enjoy." He implicitly contrasts this with propaganda "for evil."
      *   **Key Q:** "Du Bois gives *his* criterion – propaganda for justice, for the right to full humanity. But *how do we know* what constitutes 'justice' or 'the right to love and enjoy' in art? Is it subjective? Is there a universal standard? *Where does this criterion come from, and how can we be sure it's the right one?* Du Bois asserts it passionately but doesn't explicitly ground it philosophically here."
      *   **Goal:** Make them feel the absence. Let the question hang. This is the productive tension. It connects to fundamental questions in aesthetics and politics.

  7.  **Synthesis & Check Question (5 mins)**
      *   **Synthesis:** Recap: Du Bois argues *all* art serves an agenda (explicitly or implicitly). In a racist society, Black art *cannot* be neutral; neutrality supports the status quo. Therefore, Black artists *must* consciously wield their art ("propaganda") for justice and humanity, fusing truth, beauty, and politics inseparably – just as the Sorrow Songs did organically.
      *   **The Check Question (Fusion Understanding):** **"Based on Du Bois's argument and our analysis of 'Deep River,' explain why he would say that an attempt by a Black artist to create *purely* 'art for art's sake' (detached from Black experience/struggle) would *fail* to be truly powerful or beautiful *on its own terms*, according to his view?"**
          *   **Target Answer:** It would lack the depth, truth, and urgency born of authentic experience and engagement with the fundamental struggle for humanity. Its detachment would render it aesthetically *lesser* or complicit in Du Bois's framework, not *purer*. The beauty Du Bois values is inextricable from this truth-telling function.

  **Explicit Omissions (State upfront & reiterate):**

  *   **"We are not covering the later Black Arts Movement in detail today, though Du Bois is a clear forebear. Our focus is solely on his 1926 argument."**
  *   **"We are not doing a deep dive into the entire history of 'Art for Art's Sake' (Aestheticism, Decadence, etc.). We're using it only as the counterpoint Du Bois explicitly rejects."**
  *   **"We are not resolving the philosophical gap about the criterion for 'just' propaganda. Du Bois leaves it open here, and so will we, focusing on understanding *his* argument and its internal tensions."**

  **Why this plan works:**

  *   **Builds from Known to New:** Starts with their knowledge (Sorrow Songs) to build the bridge.
  *   **Preempts Misconceptions:** Actively defines terms and contrasts Du Bois's meaning with common misunderstandings at the point where those misunderstandings are likely to arise.
  *   **Leverages a Strong Example:** "Deep River" perfectly embodies the fusion and counters all three misconceptions inherently.
  *   **Highlights the Gap Strategically:** The gap is revealed *after* they grasp the core argument and fusion, making it meaningful and unsettling rather than confusing.
  *   **Check Question Tests Comprehension:** Requires synthesizing the core argument (rejection of detachment) and understanding the fusion (beauty *requires* engagement for Du Bois in this context).
  *   **Clear Boundaries:** Omissions are stated to manage scope and expectations.

  **Teaching Tips:**

  *   **Emphasize "Love and Enjoy":** This phrase is key to understanding Du Bois's humanistic goal beyond mere protest.
  *   **Use "Counter-Propaganda":** This term can sometimes help clarify his intent against the dominant racist narratives.
  *   **Let Them Grapple:** Don't rush to answer the big gap question. Let the discomfort sit. You can suggest it connects to debates in moral philosophy or critical theory for future sessions.
  *   **Link to Souls:** Briefly remind them that Du Bois's method in *Souls* itself fused history, sociology, poetry, and the Sorrow Songs – it *is* the propaganda he advocates for.
