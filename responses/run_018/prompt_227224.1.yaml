prompt: |-
  I'm trying to pin down what makes something we do together rather than just two things happening at the same time, so here are my gut verdicts and I want to know what theory they add up to. Two strangers both push the same stalled car at the same time without noticing each other -- not a joint action. Two people walking together, where if one suddenly speeds off the other could legitimatly say "hey, I thought we were walking together" -- joint, and the fact that the rebuke makes sense seems like the whole thing. A jazz duo improvising with no plan and no talking, just listening and reacting -- joint. A crowd that turns into a riot, people egging each other on and smashing windows, nobody aiming at anything shared -- not joint. A flash mob where the participants never communicate, they all just saw the same viral post and showed up -- joint, I think? And a committee that passes a resolution where every member voted for it purely out of self-interest -- the committee did it intentionally even though no individual cared about the resolution itself. Is there one principle that captures all of these? The jazz duo and the riot are what keep tripping me up, since both involve mutual responsiveness with no explicit agreement, and I can't cleanly say what distinguishes them without either letting the riot count or kicking the jazz duo out. If your principle has to overturn one of my verdicts, tell me which and why. Also, what does it predict about a case I didn't list -- a couple whose habits and finances have slowly converged over decades into a shared way of life that neither of them ever actually chose?
reasoning: |-
  Okay, let's dive into this user's philosophical puzzle about joint action. They've presented a series of intriguing cases and want a unifying theory that explains their intuitive judgments. The core tension seems to be between the jazz duo (which feels joint) and the riot (which doesn't), despite both involving mutual responsiveness without explicit agreement.

  Hmm, the user's examples are particularly clever because they isolate different variables: the car-pushing case tests shared awareness, the walking-together scenario introduces normative expectations, the flash mob examines shared intentions without communication, and the committee case challenges whether individual intentions matter. The jazz/riot contrast is especially thorny - both show mutual influence but feel categorically different.

  I notice the user is frustrated by existing theories that can't cleanly distinguish the jazz duo from the riot. They're probably familiar with standard accounts like Bratman's shared intention theory but find them inadequate. Their closing question about the long-married couple suggests they're also interested in unconscious, emergent forms of jointness.

  What makes this tricky is that the riot actually has some features of joint action - mutual responsiveness, even a kind of shared mood. But intuitively it lacks... direction? Purpose? The jazz players aren't just reacting; they're collaboratively creating something. Maybe the key is whether participants see themselves as contributing to a unified activity.

  The normative element stands out too. That "hey, we were walking together" rebuke implies obligations that wouldn't exist in the riot. You couldn't meaningfully complain "I thought we were rioting together" if someone stops smashing windows. 

  For the flash mob, it's interesting they see it as joint despite no interaction. This suggests that pre-existing shared intentions (from the viral post) might suffice. Whereas in the riot, the shared anger emerges spontaneously without prior commitment.

  The committee case is sneaky - it shows collective agency can exist even without collective goodwill. The institution "intends" the resolution via procedure, regardless of members' motives. This might require distinguishing levels: individual intentions vs. group-level intentionality.

  For the long-married couple, their unspoken coordination seems fundamentally different from the riot. Their habits form a de facto shared life project, even if never chosen. The riot lacks this stable, constructive interdependence.

  I think the winning principle is that joint action requires participants to mutually represent themselves as co-contributing to a shared activity. This handles the jazz duo (musicians jointly creating music), excludes the riot (no shared representational frame), accommodates the flash mob (shared plan from viral post), and explains why the car-pushers aren't joint (no mutual awareness). It also preserves the committee's institutional intentionality while acknowledging the members' alienation.

  This approach does sacrifice the user's intuition about the flash mob being joint - if we require mutual awareness during the action, the flash mob might not qualify since participants aren't responding to each other. But that seems acceptable given how it strengthens other distinctions. The married couple case would then hinge on whether they maintain ongoing mutual awareness of their shared life - which they likely do, through daily acts of recognition.

  The theory ultimately positions joint action as a cognitive and normative phenomenon, not just behavioral coordination. That feels right philosophically while honoring most of the user's sharp intuitions.
answer: |-
  Your intuitions point toward **Gilbert's plural subject theory**, with a focus on **mutual recognition of co-participation in a shared activity** as the core principle. Let's break it down:

  **Core Principle:**  
  An action is *joint* when participants **mutually recognize that they are co-contributing to a shared activity or outcome**, and this recognition shapes their behavior and normative expectations.

  ---

  ### How Your Cases Fit (or Challenge) the Principle:
  1. **Strangers pushing a car:**  
     → *Not joint.* No mutual recognition. Each acts independently toward a similar goal.  
     → *Principle:* No shared awareness of co-participation.

  2. **Walking together:**  
     → *Joint.* Mutual recognition ("we are walking together") creates normative expectations (rebuke makes sense).  
     → *Principle:* The rebuke relies on breached mutual commitment.

  3. **Jazz duo improvising:**  
     → *Joint.* Musicians mutually recognize they are *co-creating* a single performance. Responsiveness is guided by shared intent ("we are making music together").  
     → *Principle:* Mutual recognition of co-participation in a *shared artistic endeavor*.

  4. **Crowd turning into a riot:**  
     → *Not joint.* Mutual *reactivity* exists (egging on), but no mutual recognition of a *shared activity*. Actions are parallel, not co-constitutive.  
     → *Distinguisher vs. Jazz:* In jazz, each note responds to *and builds upon* the other as part of a unified whole. In a riot, actions are contagious but not collaboratively directed toward a shared outcome.

  5. **Flash mob:**  
     → **Revision:** *Not joint* under this principle.  
     → *Why?* Participants act based on individual plans (from the viral post), not mutual recognition *during the action*. They don’t adjust to one another or see themselves as co-contributors *in the moment*.  
     → *Your intuition overturned:* While coordinated, it lacks the mutual responsiveness and joint commitment of true joint action. It’s a group of parallel individual actions.

  6. **Self-interested committee vote:**  
     → *Joint.* The committee acts as a *plural subject*. Members mutually recognize they are participating in a collective decision-making process (e.g., "we are passing a resolution"), even if personal motives differ.  
     → *Principle:* Institutional roles create mutual recognition of co-participation in a shared activity (voting as a body).

  ---

  ### The Riot vs. Jazz Distinction (Solved):
  - **Jazz Duo:** Each musician *intends* their actions as contributions to a *shared performance*. They listen/react *because* they see themselves as co-creators ("we are improvising *together*").  
  - **Riot:** Individuals react to others’ actions (e.g., breaking windows triggers more breaking), but they don’t see themselves as part of a *shared project*. There’s no "we are rioting *together*" recognition—only contagion and parallel action.  

  → **Key:** Mutual recognition transforms reactivity into *collaborative responsiveness*.

  ---

  ### The Long-Married Couple (Your Unlisted Case):
  - **Verdict:** *Joint* under this principle.  
  - **Why?** Their habits and finances form a *de facto shared life project*. Through daily actions, they mutually recognize their interdependence (e.g., "we manage *our* finances," "this is *our* routine"). Even without explicit choice, their ongoing adjustments and reliance on each other sustain mutual recognition of co-participation in a shared life.  
  - **Contrast with Flash Mob:** Unlike the flash mob’s one-off parallel actions, the couple’s convergence emerges from *continuous mutual responsiveness* embedded in their relationship.

  ---

  ### Why This Principle Works Best:
  - **Captures normativity:** Explains why the walking partner can rebuke the other (breach of mutual commitment).  
  - **Excludes mere coordination:** Rules out car-pushers and flash mobs (no mutual recognition *during action*).  
  - **Includes institutional acts:** Accommodates the committee (roles create mutual recognition).  
  - **Distinguishes jazz from riots:** Turns on whether responsiveness is guided by shared co-participation.  
  - **Handles unconscious convergence:** Explains the couple’s life as an emergent joint activity through sustained mutual recognition.

  **One Limitation:** It requires *some* level of mutual awareness, which may exclude highly decentralized actions (e.g., anonymous online collaborations). But for your cases, it aligns cleanly—overturning only the flash mob verdict while resolving the jazz/riot puzzle.
