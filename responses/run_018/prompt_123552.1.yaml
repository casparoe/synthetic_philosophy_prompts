  Alright, so picture this: the East Overshoe Municipal Sewage Board, 1978. They pass Regulation 78-B: "All storm drain covers must be painted *glossy black* (Section 1a) and *matte grey* (Section 2c) to enhance visibility, provided they remain *invisible* to aerial surveillance (Section 3, amendment)." It's buried in Appendix Z of a binder labeled "Janitorial Supply Inventory."

  **Clerk Barry** (panicking): "Oh *crap*, the new reg! It violates, like, four of Fuller's eight desideratas! Contradictions? Check. Impossibility? Check. Not published? Buried! Congruence between declared rule and actual practice? Forget it! This thing has *negative* internal morality!"

  **Intern Brenda** (a Hart fan): "Relax, Barry. Just run it through the Rule of Recognition! Is it valid under the master statute authorizing the Board?"

  **Barry:** "That's the *other* problem! The master statute says they can regulate 'drain *maintenance*.' Is *painting colors for visibility/invisibility* 'maintenance'? The Chief Clerk *hates* aesthetics debates. Secondary rules give no clear answer! The Rule of Recognistion is shrugging!"

  **Barry** (inspired, maybe delirious): "I got it! Fuller missed one! Desideratum *Nine*: Every statute or reg must come with an *Official User Manual* explaining it in simple terms, with pictures! We'll write one for 78-B! 'Step 1: Acquire Quantum Paint (glossy black AND matte grey, simultaneously invisible). Step 2: Apply. Step 3: ??? Step 4: Profit (metaphorically).' See? Now it's clear! ... Ish."

  **Brenda:** "But... does printing a nonsensical manual *make* the contradictory rule valid under Hart, because we *say* it's part of our recognition practice now? Or does the sheer *need* for a manual *prove* it fails Fuller's internal morality test so utterly it was never *really* law to begin with?"

  **Barry:** "... Pass me the quantum paint thinner. My brain hurts."

  **Verdict:** Fuller gets dunked on by bureaucratic absurdity proving his point *too* well, while Hart gets side-eyed for letting the Rule of Recognition potentially validate the manual-hack into legality.
