  hey, can you draft a final exam essay for my upper-level rational-choice seminar? 12 students, 75 minutes, 30 marks total. We covered Newcomb, evidential vs causal decision theory, and that Platonia dilemma / Luring Lottery stuff about superrationall agents facing a predictor. I want it in the weeds — not just "summarize Platonia" — so I'm injecting a twist I made up called the Cascaded Lure.

