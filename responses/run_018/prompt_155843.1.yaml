  For the binary case, I should clarify that expected value is literally about counting probable sentient beings in the aggregate. But as the user notes, this doesn't make any particular ant more likely to be sentient—it just suggests some ants probably are. The moral tension arises when we take actions affecting populations: stepping on a colony might harm 0.01 expected sentient beings, but we can't know which specific ants (if any) were moral patients. This forces us to confront whether we should care about expected moral patients when making decisions.

  For the gradable sentience model, the math changes fundamentally. Instead of counting heads, we'd be summing tiny moral weights. Each insect might contribute 0.001 "units of moral consideration," so a billion insects sum to a million units. Here the expectation isn't about who has the property, but about how much of the property exists in total. This avoids the threshold problem but requires accepting that partial moral patienthood is coherent.

  The hidden assumptions the user suspects are exactly where this gets philosophically hairy. The binary model implicitly assumes that moral obligations can be probabilistic at the individual level. The gradable model assumes moral weight is additive like a continuous quantity. Both require aggregating microscopic impacts across vast scales—which feels counterintuitive but may be necessary for consistency.

