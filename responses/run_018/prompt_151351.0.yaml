  - Saves $X per batch with no catastrophic events.

  So they calculate expected utility as: $X (per batch) > 0.

  The maximin agent, however, considers the full distribution and sees the worst-case outcome (the catastrophe) which has a utility of -$Y (a huge negative).

  Option B:
  - Always costs more by $X per batch, but worst-case is a known allergic reaction that costs $Z (where Z is manageable and much less than Y).

  So maximin compares:
  - Option A worst-case: -$Y
  - Option B worst-case: -$Z (which is the cost of treating the allergic reaction, but note: we are saving $X per batch with A in the normal case, but in the worst-case for A we have -$Y, while for B we have -$Z and we also have the baseline cost which is higher by $X per batch? Let me clarify.)

  Actually, the utility should be defined in terms of net benefit. Let the baseline (current drug) cost per batch be C. Then:

  Option A:
  - Normal: cost = C - X (saves X)
  - Catastrophe: cost = C - X + Y'  ??? Actually, the catastrophe causes additional costs. Let the cost of the catastrophe be Y (on top of the normal cost). But note, in the catastrophe scenario, we still have the drug cost (which is lower by X) but then we have the catastrophe cost Y. So total cost for A in catastrophe: (C - X) + Y.

