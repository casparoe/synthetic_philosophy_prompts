  Thus, the divergence is primarily driven by the truncation of the sampling frame (which removes the catastrophic event from the EV agent's model) and the asymmetry in the worst-case outcomes (the catastrophe for A is much worse than the worst-case for B). The fat tail (the rare catastrophe) is also essential because it leads to the truncation being likely (the catastrophe is unlikely to be observed in a small sample). 

  In summary:
  - Structural feature doing the work: the truncation of the sampling frame (which is made likely by the fat tail and the small sample) and the asymmetry in the worst-case outcomes.

  Without truncation (if the EV agent had the full distribution), they might still choose A if the expected utility is positive (which it is without the breakthrough, because the catastrophe is rare and the cost savings are common). But the maximin agent would still choose B. So the divergence would remain because of the different risk attitudes. However, the truncation amplifies the divergence by making the EV agent completely unaware of the catastrophe.

  In the given scenario, the truncation is the key to making the EV agent see the option as safe when it is not.
answer: |-
  ### Decision Scenario: Hospital Pharmacy Antibiotic Selection  
  A hospital pharmacy must choose between two antibiotics for a critical infection: **Option A** (new, cost-effective drug) and **Option B** (established, expensive drug). Both drugs show identical efficacy/safety in clinical trials (*n* = 10,000 patients). However, **Option A** has a **fat-tailed risk**: a rare contamination (1 in 50,000 batches) causes multi-organ failure. This risk was missed in trials because:  
  - **Sampling frame truncation**: Trials tested only *250 batches*, none contaminated (probability of zero detections = 99.5%).  
  - **Asymmetric utility**: Success saves $1M/batch (unbounded upside for hospital finances), but the catastrophe causes 10 deaths (−1,000 utility units, bounded downside—hospital cannot lose more than its capacity to handle 10 deaths).  
  The EV-maximizer (using trial data) sees only **Option A**’s average utility (+50 units: high savings, no observed risks). The maximin agent considers the full risk profile: **Option A**’s worst-case (−1,000 units) is catastrophic, while **Option B**’s worst-case is treatable side effects (−10 units).  

  ---

  ### Breakdown of Agent Decisions  
  **1. EV-Maximizer ("Fanatic") Perspective**  
  - **Model**: Uses *truncated trial data* (no catastrophe observed).  
  - **Calculations**:  
    - *Observed outcomes*: 100% chance of +$1M savings (utility: +100 units).  
    - *Perceived EV*: +100 units (ignores catastrophe due to missing data).  
  - **Choice**: **Option A** (appears strictly dominant).  
  - **Why?** Truncation hides the tail risk; unbounded upside inflates perceived value.  

  **2. Maximin Agent Perspective**  
  - **Model**: Considers *full theoretical distribution* (including unobserved catastrophe).  
  - **Worst-case identification**:  
    - **Option A**: Catastrophe (−1,000 units).  
    - **Option B**: Treatable side effects (−10 units).  
  - **Choice**: **Option B** (avoid −1,000 units).  
  - **Why?** Bounded downside makes the catastrophe unacceptable.  

  ---

  ### Key Structural Features Driving Divergence  
  - **Truncation in Sampling Frame**:  
    Trials tested 250 batches (≈0.005% chance of catastrophe); EV agent’s model excludes the risk entirely.  
  - **Utility Asymmetry**:  
    Unbounded upside (savings scale infinitely) vs. bounded downside (max −1,000 units). EV agent overweights upside; maximin fixates on bounded worst-case.  
  - **Fat-Tailed Distribution**:  
    Catastrophe is rare but extreme. Truncation makes it invisible to EV agent, while maximin assumes its possibility.  

  **Primary Driver**: **Truncation** enables the EV agent’s oversight. Without it, EV would see a low-probability risk (−1,000 at *p* = 0.00002), reducing EV to +96 units—still positive, but now quantifiable. The asymmetry then amplifies disagreement: EV still chooses **A** (high EV), maximin still chooses **B** (catastrophe avoidance).  

  ---

  ### Effect of Symmetrizing the Utility Curve  
  Modify utility to be symmetric: Savings cap at +1,000 units (mirroring downside bound).  
  - **EV-Maximizer (full distribution)**:  
    EV = (0.99998 × +100) + (0.00002 × −1,000) = +99.98 units → **Still chooses A**.  
  - **Maximin Agent**:  
    Worst-case remains −1,000 units (**A**) vs. −10 units (**B**) → **Still chooses B**.  
  **Outcome**: Divergence persists. Symmetrizing removes EV’s upside inflation, but the core conflict remains due to:  
    - Maximin’s focus on *absolute worst-case* (unaffected by symmetrization).  
    - Truncation still distorts EV’s model if undiscovered.  

  ---

  ### Real-World Outcome  
  The pharmacy adopts **Option A** (EV recommendation). In 99.99% of cases, savings accrue. However, a contamination occurs after deployment (1 in 50,000 batches), causing 10 deaths. The maximin agent’s warning is validated, but the EV agent argues the *long-run* EV remains positive. The conflict highlights how **truncated data** + **bounded downside** can pit EV against maximin—even without obvious recklessness.
