  But the EV agent in the truncated model still only sees the normal case: utility = -C + X = -C+1000. However, note that the breakthrough is also not observed in the sample. So the EV agent's model is still just the normal case. They don't see the catastrophe and they don't see the breakthrough. So they still think A gives -C+X.

  But if we assume the EV agent is using the full distribution (if they are aware of the possibilities) then they would use the above calculation. However, the problem states that the sampling frame truncates the distribution. So the EV agent only has the sample without the catastrophe and without the breakthrough. So they model A as always -C+X.

  But if we want to symmetrize and also make the EV agent aware of the full distribution (both the catastrophe and the breakthrough), then they would use the expected utility of -C+X+0.0001*W. If W is large enough to make the expected utility positive (and higher than B's -C), they would choose A.

  The maximin agent, however, would still look at the worst-case outcome. The worst-case for A is the catastrophe: utility = -C+X-Y. If Y is huge, then even if there is a breakthrough that gives a huge positive, the worst-case is still catastrophic. So maximin would still choose B.

