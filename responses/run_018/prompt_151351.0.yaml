  We are in a hospital pharmacy scenario. The pharmacy must decide whether to adopt a new, cheaper antibiotic (Option A) or stick with the current standard (Option B). The new antibiotic has been tested in a limited sample (say, 1000 patients) and showed similar efficacy and safety to the current one. However, the new drug is produced by a method that, in rare circumstances (like a specific, hard-to-detect contamination in the manufacturing process), can lead to a catastrophic side effect: a severe, treatment-resistant infection that can spread in a hospital setting. This catastrophic event is estimated to occur in 1 in 10,000 batches, but due to the limited testing (only 100 batches tested in the trial, none of which were contaminated), the event has not been observed and thus is not in the sampled data. The current drug has a known, non-catastrophic worst-case scenario: an allergic reaction that is treatable and non-transmissible.

  The EV-fanatic (expected value maximizer) uses the available sample (which does not include the catastrophe) and calculates the expected cost savings (including the cost of treating non-catastrophic side effects) and finds that Option A has a much higher expected utility (due to cost savings and apparent similar safety). The maximin agent, however, considers the worst-case scenario in the full distribution: the catastrophic side effect that could lead to multiple deaths and a hospital outbreak. Since the maximin agent focuses on avoiding the worst outcome, they choose Option B, which has a known, manageable worst-case outcome.

  Structural features:
  - The distribution of outcomes for Option A is fat-tailed: the catastrophic event is extremely rare but has an extreme negative impact. However, the sampling frame (the tested 100 batches) is too small to capture this tail event (truncation in the sampling frame). 
  - The utility function is bounded on the downside (there is a limit to how bad the worst outcome can be, but note: the catastrophe is worse than the known worst-case of Option B) and unbounded upside? Actually, the upside is bounded by cost savings, but the downside is catastrophic and unbounded in terms of harm (though in reality, harm is bounded by the number of patients, but we can consider it as having an extremely high negative utility). However, the key asymmetry is that the negative tail is fat and the positive is thin (cost savings are limited and known). 

  Why the divergence?
  - EV-fanatic: Uses the truncated sample (which excludes the catastrophe) and thus sees Option A as safe and cost-saving. The expected utility is high because the catastrophe is absent from the model.
  - Maximin: Looks at the full theoretical distribution (or considers the possibility of unobserved catastrophes) and sees the catastrophic outcome as the worst case. Since the worst case of Option A (catastrophe) is worse than the worst case of Option B (treatable allergic reaction), maximin chooses B.

  Which feature is key?
  - The truncation of the sampling frame is crucial: if the EV agent had the full distribution, they might still choose A if the expected utility is positive (because the event is very rare), but the maximin agent would still avoid it. However, in this case, the EV agent doesn't see the catastrophe at all. So the truncation is what makes the EV agent blind to the risk.

  What if we symmetrize the utility curve?
  - If we make the utility curve symmetric (so that extremely positive outcomes are as likely and as impactful as extremely negative ones), then the EV agent might still choose the risky option because the high upside could balance the low-probability catastrophe. However, in this scenario, there is no symmetric upside: the cost savings are modest and fixed. So symmetrizing would require introducing a huge positive outcome with the same probability as the catastrophe. For example, if the new antibiotic could also, with the same probability, cure a rare fatal disease in some patients, then the EV agent might still be attracted. But the maximin agent would still focus on the worst outcome (the catastrophe) and choose B. 

  However, note: symmetrizing the utility curve doesn't change the maximin's focus on the worst outcome. It only changes the EV calculation. In the symmetric case, the EV agent would see a high expected value (because the huge positive outcome, even if rare, adds a lot) and the maximin agent would still avoid the catastrophe. The divergence would remain because the maximin agent does not care about the huge positive outcome if the worst outcome is catastrophic.

  But in our scenario, we don't have that symmetric upside. So without symmetrizing, the EV agent is misled by the truncated sample. If we symmetrize by adding a huge upside, the EV agent might still choose the risky option (now for two reasons: the sample doesn't show the catastrophe and also the huge upside) and the maximin agent would still choose the safe option.

