  First, locking someone up pre-crime with 95% certainty is not okay. That suggests a strong aversion to preventive detention without actual harm. Then, punishing an attempted murderer whose gun jammed is acceptable but less so than if successful. This indicates outcome matters, but intent is crucial. 

  Fining a corporation where shareholders bear the cost is fine. But cutting off family benefits for the criminal's actions isn't. Both involve third parties, so why the difference? Maybe shareholders voluntarily invested, accepting financial risks, while the family didn't choose to be associated. 

  The volunteer taking punishment instead: even with consent from everyone, it's not okay. That's interesting. Their gut says it's worse than punishing the offender. Why? Maybe because punishment is personal and non-transferable, regardless of consent.

  The truck victim who lost memory: punishment feels pointless. Here, the person's current state matters. If they're no longer the same person, retribution seems unnecessary. Contrast that with the lottery winner who's thriving; punishment is normal. So identity change or current suffering affects the judgment.

  Civil disobedience punishment is allowed but feels worse than punishing a fraudster. There's a moral weight here; punishing someone for fighting injustice feels wrong even if legal.

  Their proposed principle involves targeting only the perpetrator unless risk was voluntary. But the volunteer case contradicts that since the volunteer took on risk willingly. So why is it still not okay? Maybe because punishment's purpose is undermined if it's not personal. Deterrence might be intact, but retribution isn't served if someone else suffers.

  The key conflict is shareholders vs. family. Shareholders invested voluntarily, accepting financial risks, including fines. The family didn't choose to be related to a criminal. So voluntariness in assuming risk might be the differentiator. But is that sufficient? What about the employee-executive distinction? Voluntary role vs. family ties.

  For the amnesiac soldier, if they're a completely different person, punishment might not make sense under the identity principle. But if the legal system focuses on the act, ignoring personal change, that clashes with the truck victim case. The user seems to value current identity over past actions in such cases.

  Possible principles: Moral Agency (culpable agent), Identity Continuity, Voluntariness of Risk. These need to cover all cases. For example, the corporate fine: shareholders voluntarily took financial risk, so it's acceptable. Family benefits: no voluntariness, so not okay. Volunteer punishment: even if voluntary, it bypasses the responsible agent, violating the core of punishment.

  The soldier case: if identity change is significant, punishment might not apply, similar to the truck victim. But if society demands accountability, there's tension. The user's intuition might lean towards absolving the changed person, prioritizing current self over past actions.

  They might need to accept that some intuitions don't fit a single principle. For instance, the volunteer case might require an additional clause about non-transferability, separate from voluntariness. Or the purpose of punishment (retribution vs. deterrence) could explain differences. However, the user emphasized retribution as key, especially in the volunteer and amnesiac cases.

  Inconsistencies to address: Why is the lottery winner punished normally? Because their current state doesn't negate past culpability. But the amnesiac's changed state does. So identity continuity matters. The civil disobedience case might involve desert; the person doesn't deserve punishment in the same way as a fraudster, hence the discomfort.

  The user might need to refine the principle to include current moral agency and identity. The soldier with no memory: if they lack continuity, punishment is pointless. But if they have assets, like the lottery winner, does that matter? The user didn't mention wealth in the soldier case, so identity change is the key factor.
answer: |-
  Based on your case-by-case judgments, your intuition relies on **two core principles interacting**, not just one. Here's a breakdown:

  **The Principles:**

  1.  **Targeted Culpability Principle (TCP):** Punishment must be imposed *only* on an agent who was **culpable** (morally responsible) for the wrongful act *at the time they committed it*. Punishment loses legitimacy if:
      *   The agent *didn't actually commit the act* (Pre-Crime).
      *   The agent is *no longer meaningfully the same culpable agent* due to profound change (Truck Guy, Soldier).
      *   The punishment *primarily impacts someone else entirely* who wasn't culpable (Family Benefits).
      *   The punishment is *voluntarily transferred* to another agent, even with consent, as this severs the direct link between the culpable agent and the sanction (Volunteer).

  2.  **Voluntary Risk Absorption Principle (VRAP):** Costs stemming from punishment *can* be indirectly borne by non-culpable third parties **only if** those parties *voluntarily placed themselves in a position* where absorbing such costs was a known, inherent risk of their role or relationship. The cost must be a *foreseeable consequence* of their voluntary choice.

  **How They Explain Your Cases:**

  *   **Pre-Crime (Not OK):** Violates TCP. No culpable act has occurred yet.
  *   **Gun Jammed (OK, but less):** TCP satisfied (culpable agent, committed the act). "Less" likely reflects intuitive weighting of *harm caused* alongside culpability, but TCP focuses only on culpability for the *act*.
  *   **Corporate Fine (OK):** TCP satisfied (the *corporation*, as a legal agent, is culpable). VRAP satisfied (shareholders voluntarily invested, accepting financial risk including fines/losses).
  *   **Family Benefits Cut (Not OK):** TCP violated (punishment primarily impacts non-culpable family). VRAP violated (family members did not voluntarily accept the risk of losing benefits due to a relative's crime).
  *   **Volunteer Punishment (Not OK, worse):** Violates TCP. Punishment is deliberately *not* imposed on the culpable agent, even if transferred "voluntarily". This severs the core retributive link. "Worse" because it's a deliberate evasion of the culpable agent bearing the sanction.
  *   **Truck Guy (Not OK):** TCP violated. While he *was* culpable when he acted, he is *no longer meaningfully the same culpable agent* due to catastrophic loss of identity/memory/status. Punishing *this* person feels like punishing someone else.
  *   **Lottery Winner (OK):** TCP satisfied. Profound *positive* change in circumstance doesn't negate culpability for the past act or the identity of the agent. He remains the culpable agent.
  *   **Civil Disobedience (Allowed, but feels worse):** TCP satisfied (culpable agent committed the act defined as wrong by law). However, the "feels worse" stems from an *additional* intuitive layer: **Desert**. You perceive the agent as acting from morally *good* or *justified* motives, reducing their *moral desert* for punishment compared to a fraudster acting from greed, even if legally punishable.

  **The Shareholder vs. Family Dilemma Solved:**
  This is where VRAP clearly distinguishes them. Shareholders *voluntarily* take on the financial risks associated with corporate ownership, including fines. Family members (especially dependents) did *not* voluntarily accept the risk of losing essential benefits due to a relative's crime. VRAP allows the cost to pass through to shareholders but blocks it for the family.

  **Predictions on New Cases:**

  1.  **Punishing Executives Personally:** *OK* if they were personally culpable (e.g., ordered the fraud, knew about it). TCP targets *them* as culpable agents. *Not OK* if punishing them *only* because of their role, without personal culpability (violates TCP, and VRAP doesn't apply as punishment isn't an inherent financial risk of the role).
  2.  **Punishing Something Legal When Done (Ex Post Facto):** *Not OK*. TCP requires culpability *at the time of the act*. If the act wasn't wrongful then, the agent wasn't culpable *then*.
  3.  **Punishing a System (e.g., an Algorithm):** *Not OK*. TCP requires a morally responsible *agent*. Systems aren't moral agents. Punishment must target the culpable *people* who designed, deployed, or used the system wrongfully.
  4.  **The Amnesiac Soldier (20 yrs later, different person):** *Not OK*. This aligns perfectly with the "Truck Guy" case. Profound loss of memory and identity continuity means TCP is violated. Punishing *this* person is not punishing the culpable agent who committed the act. Your intuition likely flips when you focus on the *current* person vs. the *past* act.

  **What You Might Need to Give Up (Potential Inconsistencies):**

  1.  **The "Less" in Attempted Murder:** Your principle focuses solely on culpability for the *act* (pulling the trigger with intent). The "less" feeling suggests you also intuitively weigh *actual harm caused*. A pure TCP/VRAP view would say punishment should be the *same* for attempted murder as completed murder (same culpable act, same intent). You might need to accept this or introduce a minor harm-based modifier.
  2.  **Civil Disobedience "Feels Worse":** TCP/VRAP only explains why it's *allowed* (culpable agent, committed the act). The "feels worse" requires acknowledging an independent factor: **Moral Desert based on Motive**. Punishing a well-intentioned dissident feels unjust because their *desert* is lower than a malicious fraudster, even if culpability under the law is similar.

  **Stated Precisely:**

  1.  **Targeted Culpability Principle (TCP):** Just punishment requires that the sanction be imposed directly upon, and only upon, an agent who was morally responsible (culpable) for committing a wrongful act, at the time they committed it. This requires both the occurrence of the wrongful act and the persistence of a sufficiently continuous identity linking the punished agent to the culpable agent.
  2.  **Voluntary Risk Absorption Principle (VRAP):** Financial or material costs resulting from a just punishment (imposed under TCP) may permissibly impact non-culpable third parties if, and only if, those third parties voluntarily assumed a role or relationship where bearing such costs was a reasonably foreseeable and inherent risk associated with that voluntary choice.

  **Conclusion on the Soldier:**
  Your principles, especially TCP, strongly suggest punishment is *not* justified. The profound change – complete loss of memory of the event and becoming a "completely different person" – breaks the necessary continuity of identity between the culpable agent who committed the massacre and the person standing before you now. Punishing him would violate the core idea that punishment must target *the one who did it*. He is, in the relevant sense, *no longer that person*. This aligns with your intuition on the "Truck Guy". The key difference from the Lottery Winner is that wealth doesn't change identity or culpability; catastrophic memory loss and personality change potentially do.
