prompt: |-
  I serve as chief methodological auditor for a federal forecasting unit that issues ten-year policy projections—energy-transition scenarios, public-health trajectories, economic-impact models. Our charter requires that when evidence undermines a previously endorsed projection, we issue a revised confidence report, but over the past year we have developed a troubling bifurcation: some analysts discard the entire projection the moment its source model is criticized, while others absorb the meta-criticism yet leave the recommendation untouched, appealing to structural robustness. In discussions with my colleagues last quarter we kept circling the same philosophical problem—what epistemologists call the dogmatism paradox—where rational belief revision seems to demand either stubborn retention of prior beliefs despite higher-order evidence about one's own reasoning, or a self-undermining skepticism that dissolves belief whenever methodological error is detected. I need a reusable decision procedure my audit team can run whenever a challenge targets not the world itself, but the reliability of the reasoning process that produced a prior endorsement: it should specify, in order, how to classify the challenge as first-order or higher-order, what conditions must be met for partial retention versus full revision, the exact point at which the question stops being factual and becomes one of institutional risk-tolerance, and explicit checks that prevent both dogmatic retention and excessive dissolution. Apply the procedure to three cases: (1) a climate-economy model whose key elasticity parameter is shown to derive from a systematically biased sample; (2) a public-health transmission model later found conceptually misspecified in its core dynamics; and (3) a contested meta-evidence scenario in which one review alleges fundamental bias while another defends the original estimation, so that the procedure must yield an answer the audit team will dislike and must flag precisely where judgment is irreducible. Finally, state clearly what the procedure cannot do—for instance, whether it can settle disagreements about the prior plausibility of the original claim, or whether it requires access to information that is typically unavailable to auditors.
reasoning: |-
  Okay, the user is a chief methodological auditor dealing with a tricky philosophical problem called the dogmatism paradox in their federal forecasting unit. They need a decision procedure to handle challenges to their projections when the criticism targets the reasoning process itself, not just the data. The team is split between analysts who discard entire projections at the first sign of criticism and others who stick to them despite methodological issues. 

  First, I need to unpack the core problem. The dogmatism paradox means that when higher-order evidence challenges your reasoning process, holding onto your belief seems stubborn, but revising it completely leads to skepticism. The user wants a structured way to navigate this. They need a procedure that classifies challenges, determines when to partially or fully revise, identifies when it becomes about institutional risk, and prevents both dogmatism and excessive doubt.

  The user's deeper needs seem to be about institutional consistency and reducing subjectivity. They handle high-stakes projections affecting policy, so ensuring their audits are defensible and transparent is crucial. They also need to manage internal conflicts within their team, providing a clear framework to avoid ad-hoc decisions. The three test cases they mentioned—climate model bias, public-health model misspecification, and conflicting meta-evidence—are practical examples to validate the procedure.

  Next, I'll outline the decision procedure. It should start by classifying the challenge as first-order or higher-order. First-order challenges target the evidence directly, while higher-order ones question the reasoning or reliability of the methods. Then, assessing the severity: how much does the flaw undermine the model's conclusions? Partial retention might be possible if the core structure holds, but full revision if the foundation is compromised. 

  The procedure must also pinpoint when the issue shifts from factual analysis to institutional risk-tolerance. For instance, if after analysis there's residual uncertainty, the decision to retain or revise depends on how much risk the institution can bear. Explicit checks are needed to avoid dogmatism (ignoring valid criticism) and excessive dissolution (over-reacting to minor critiques).

  Applying this to the cases: 
  1. Climate-economy model with biased elasticity parameter. The challenge is higher-order because it's about the sample selection bias affecting the parameter. The severity is high if the parameter is central and bias is significant. Partial retention might be possible if other parameters compensate, but full revision if not. The risk-tolerance question arises if there's uncertainty about the bias's impact.
  2. Public-health model with conceptual misspecification. This is higher-order and severe because the core dynamics are wrong. Likely requires full revision unless a robust sub-model exists. Risk-tolerance isn't the main issue here since the model is fundamentally flawed.
  3. Conflicting meta-evidence: One review claims bias, another defends the model. Here, the procedure must handle irreducible judgment. The severity assessment is contested, so the decision depends on institutional risk-tolerance after acknowledging the uncertainty. The audit team might dislike this because it forces them to make a judgment call with no clear answer.

  Limitations of the procedure: It can't resolve prior plausibility disputes without additional evidence. It relies on expert judgment to assess severity, which might be subjective. Also, it requires access to the model's inner workings, which auditors might not have, and it can't eliminate all uncertainty, especially in conflicting evidence scenarios.

  The user's unspoken needs include wanting to legitimize their team's decisions to external stakeholders and reduce internal friction. By providing a clear, step-by-step process, they can standardize responses and justify their actions based on a structured approach rather than individual biases. The test cases show how the procedure applies in real scenarios, highlighting where judgment is necessary, which prepares the team for inevitable uncertainties.
answer: |-
  Here is a reusable **Audit Decision Procedure for Higher-Order Evidence Challenges (ADP-HOEC)**, designed to resolve the dogmatism paradox in policy projection audits. The procedure follows 7 sequential steps, with explicit checks against dogmatism and excessive dissolution:

  ---

  ### **ADP-HOEC Procedure**
  1. **Classify Challenge Type**  
     - **First-Order (FO)**: Challenges *direct evidence* (e.g., "Dataset X is outdated").  
     - **Higher-Order (HO)**: Challenges *reasoning reliability* (e.g., "Method Y consistently misinterprets data").  
     *→ Proceed only if HO. If FO, use standard evidence-revision protocols.*

  2. **Assess Severity**  
     - *Low Severity*: Flaw is peripheral (e.g., minor documentation error).  
     - *High Severity*: Flaw threatens core inference (e.g., foundational assumption invalidated).  
     *Check: If Low Severity → return to analysts for correction; no confidence revision needed.*

  3. **Test Structural Robustness**  
     - Run sensitivity analysis: Does the conclusion persist under alternative plausible methods/parameters?  
     - *Robust*: Conclusion holds across ≥3 credible variations.  
     *Check: If Robust → partial retention (downgrade confidence tier; e.g., "High" → "Medium").*

  4. **Evaluate Repairability**  
     - Can the flaw be fixed without rebuilding the model?  
     - *Repairable*: Patch available (e.g., reweighting biased samples).  
     - *Unrepairable*: Core logic requires redesign.  
     *Check: If Unrepairable → proceed to Full Revision (Step 5).*

  5. **Full Revision Threshold**  
     Trigger if:  
     - Severity = High *and* (Not Robust *or* Unrepairable)  
     - *Output*: Withdraw projection; mandate new model development.

  6. **Risk-Tolerance Boundary**  
     When uncertainty persists *after* Steps 1-5, shift from epistemology to institutional policy:  
     - Calculate cost of false retention (e.g., policy harm) vs. false dissolution (e.g., wasted resources).  
     - *Decision*: Retain with caveats if institutional risk-tolerance allows; else revise.  
     *Flag: "Judgment call: Institutional risk threshold applied."*

  7. **Anti-Dogmatism/Dissolution Safeguards**  
     - **Against Dogmatism**: Require documented rebuttal *from original analysts* for any retention decision.  
     - **Against Dissolution**: Ban full discard unless *all* robustness tests fail.  

  ---

  ### **Case Applications**
  **Case 1: Climate-Economy Model (Biased Elasticity Parameter)**  
  - **Step 1**: HO (methodological bias in parameter derivation).  
  - **Step 2**: High Severity (key parameter).  
  - **Step 3**: Test robustness: Does conclusion hold if parameter is replaced by unbiased estimates from 3 other studies?  
  - **Step 4**: Repairable (recalibrate with corrected data).  
  - **Result**: Partial retention (confidence downgraded). Institutional risk not invoked.  

  **Case 2: Public-Health Model (Conceptual Misspecification)**  
  - **Step 1**: HO (core dynamics flawed).  
  - **Step 2**: High Severity (foundational error).  
  - **Step 3**: Not robust (misspecification invalidates dynamics; sensitivity analysis fails).  
  - **Step 4**: Unrepairable (requires new conceptual framework).  
  - **Result**: Full revision mandated.  

  **Case 3: Contested Meta-Evidence (Bias Allegation vs. Defense)**  
  - **Step 1**: HO (conflicting reviews about fundamental bias).  
  - **Step 2**: Severity indeterminate → proceed to robustness test.  
  - **Step 3**: If 2/3 alternative methods support conclusion → Robust.  
  - **Step 6**: *Irreducible judgment*: Conflicting expertise prevents consensus. Shift to risk-tolerance:  
    - *Retention risk*: Policy failure if bias exists.  
    - *Dissolution risk*: Unnecessary delay if model is sound.  
  - **Result**: Audit team *must* choose based on institutional risk appetite (e.g., retain with "Low Confidence" if agency prioritizes continuity). Flag: **"Judgment irreducible: Risk-tolerance decision."**  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Prior Plausibility Disputes**: Cannot adjudicate pre-existing disagreements about the original model’s assumptions (e.g., "Was the elasticity parameter plausible initially?"). Requires external expert consensus.  
  2. **Access Black-Box Elements**: Fails if auditors lack visibility into model internals (e.g., proprietary algorithms).  
  3. **Eliminate Uncertainty**: Only manages uncertainty; cannot resolve undecidable epistemic conflicts (Case 3).  
  4. **Override Institutional Authority**: Risk-tolerance decisions (Step 6) require pre-defined thresholds from leadership.  
  5. **Replace Domain Expertise**: Severity/repairability assessments rely on auditor competency in the field.  

  ---

  This procedure forces explicit engagement with higher-order evidence while containing both dogmatic and skeptical extremes through structured tests and fallback boundaries. It transforms philosophical paralysis into auditable operational steps.
