answer: |-
  Here's a structured menu of interpretations for "people deserve what they earn," analyzing each combination for triviality/defensibility/falsehood, and mapping them to your three scenarios (inheritance, CEO bonus, instinctive rescuer). Your friend likely relied on **Reading 1B** or **Reading 2A** for his anti-inheritance stance.

  **Key:**
  *   **Earn (E):** How "earn" is interpreted.
  *   **Deserve (D):** How "deserve" is interpreted.
  *   **Assessment:** Trivial (T), Defensible (D), False (F).
  *   **Supports Anti-Inheritance?** (✓/✗)
  *   **Supports CEO Bonus?** (✓/✗)
  *   **Accommodates Rescuer?** (✓/✗)

  ---

  ### Interpretations of "Earn" (E)

  1.  **E1: Causal Contribution:** Bringing about a valuable outcome or state of affairs.
  2.  **E2: Labor/Effort:** Expending significant personal effort, toil, or sustained work.
  3.  **E3: Skill/Investment:** Applying developed skills, talents, or investments (time, resources).
  4.  **E4: Social Recognition:** Society collectively agrees the person "earned" it based on norms/customs.
  5.  **E5: Moral Virtue:** Acting from praiseworthy character, intention, or moral effort.
  6.  **E6: Outcome Possession:** Simply coming to possess something (trivial/tautological).

  ### Interpretations of "Deserve" (D)

  1.  **D1: Moral Entitlement:** Having a strong, inherent moral right or claim to the thing.
  2.  **D2: Proportional Fittingness:** It is morally appropriate/fitting that reward/praise is proportional to the "earning" basis.
  3.  **D3: Institutional Assignment:** Legal/social rules dictate they should receive it.
  4.  **D4: Best Outcome:** It leads to the best overall consequences if they get it.

  ---

  ### Menu of Combinations

  | E | D | Interpretation ("People deserve what they earn" means...)                                                                 | Assessment | Rationale                                                                                                                             | Anti-Inheritance? | CEO Bonus? | Rescuer? |
  | :-- | :-- | :------------------------------------------------------------------------------------------------------------------------ | :--------- | :------------------------------------------------------------------------------------------------------------------------------------ | :---------------- | :--------- | :------- |
  | **E1** | **D1** | If you cause valuable outcomes, you have a moral entitlement to them.                                                     | **D**      | Defensible under meritocracy/libertarianism; contested if cause was luck/privilege or outcome harms others.                            | ✗                 | ✓          | ✗        |
  | **E1** | **D2** | It's morally fitting that rewards are proportional to the value you cause.                                                | **D**      | Core of consequentialist meritocracy; defensible but ignores luck/starting points. Value measurement is tricky.                      | ✗                 | ✓          | ✓        |
  | **E1** | **D3** | Institutions *should* assign rewards based on causal contribution.                                                        | **D**      | Defensible economic/incentive argument; but institutions might be flawed/unjust.                                                      | ✗                 | ✓          | ✗        |
  | **E1** | **D4** | Society is better off if causers of value get the rewards.                                                                | **D**      | Strong incentive argument; defensible but ignores distribution/equality. "Best" is subjective.                                      | ✗                 | ✓          | ✗        |
  | **E2** | **D1** | If you expend effort, you have a moral entitlement to rewards.                                                            | **D/F**    | Defensible for effort within fair systems; false if effort is misdirected, coerced, or system is exploitative. Effort ≠ value.      | ✓                 | ✗/✓       | ✗        |
  | **E2** | **D2** | It's morally fitting that rewards are proportional to effort expended.                                                    | **D**      | Strong intuitive appeal (work ethic); defensible but ignores value/outcome, skill differences, luck.                               | ✓                 | ✗/✓       | ✗        |
