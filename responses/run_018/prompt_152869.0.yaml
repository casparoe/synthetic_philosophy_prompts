  | **E4** | **D1** | If society recognizes you as having "earned" it, you have a moral entitlement.                                            | **F**      | Confuses social convention with moral truth; conventions can be deeply unjust (e.g., aristocracy).                                    | ✗                 | ✓          | ✓        |
