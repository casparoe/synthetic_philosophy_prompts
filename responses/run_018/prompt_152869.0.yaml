  | **E3** | **D1** | If you apply skill/investment, you have a moral entitlement to the fruits.                                                | **D**      | Defensible (mixing labor/resources); contested if skills/investment capital result from luck/unfair advantage.                     | ✗                 | ✓          | ✗        |
  | **E3** | **D2** | It's morally fitting that rewards are proportional to skill applied or investment made.                                   | **D**      | Defensible meritocratic view; aligns with human capital theory; ignores luck in acquiring skills/capital.                             | ✗                 | ✓          | ✗        |
  | **E3** | **D3** | Institutions *should* assign rewards based on skill/investment.                                                           | **D**      | Common in markets; defensible for efficiency; but skills/capital access are unequal.                                                  | ✗                 | ✓          | ✗        |
