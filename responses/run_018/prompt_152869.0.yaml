  | **E6** | **D4** | Society is better off respecting current possession.                                                                      | **D**      | Defensible for stability/order; consequentialist argument for respecting property rights, even if origins are murky.                 | ✗                 | ✓          | ✓        |

  ---

  **Analysis of Your Friend's Argument (Against Inheritance):**
  *   Your friend implicitly relies on a **narrow definition of "earn," specifically E2 (Labor/Effort) or *maybe* E3 (Skill/Investment) applied to the inheritor**. He sees no effort/skill from the heir in acquiring the wealth.
  *   He likely pairs this with **D1 (Moral Entitlement) or D2 (Proportional Fittingness)**. If you didn't *earn* it (via effort), you don't *deserve* it (morally or fittingly).
  *   **Key Combinations:** **E2+D1**, **E2+D2**, **E3+D1**, **E3+D2** are the only ones that clearly support his anti-inheritance conclusion. He rejects interpretations like E1 (Causal Contribution - heir caused nothing) or E6 (Outcome Possession - which *would* support inheritance).

  **Analysis of the CEO Bonus Argument:**
  *   Proponents focus on **E1 (Causal Contribution - creating value)** or **E3 (Skill/Investment - applying executive talent/capital)**.
  *   They pair this with **D1 (Moral Entitlement)**, **D2 (Proportional Fittingness)**, or **D4 (Best Outcome - incentives)**.
  *   **Key Combinations: E1+D1, E1+D2, E1+D4, E3+D1, E3+D2, E3+D4** support the CEO bonus. They reject E2 (Effort) if the CEO's work seems effortless compared to the reward.

  **Analysis of the Instinctive Rescuer:**
  *   Accommodating the rescuer requires **separating the basis for desert from conscious effort/skill**.
      *   **E1+D2:** Caused a valuable outcome (saved life), so proportional praise (medal) is fitting.
      *   **E5+D2:** Acted instinctively from virtuous character (bravery/compassion), so praise is fitting (focuses on the act's moral nature, not the lack of deliberation).
      *   **E4+D3/D4:** Society recognizes such acts as heroic (E4) and assigns praise (D3) because it's beneficial (D4).
  *   Combinations relying **solely on E2 (Effort)** or **E3 (Skill)** struggle to accommodate the rescuer, as the act was instinctive, not involving sustained effort or applied skill *in the moment*. **E5 (Moral Virtue)** is the most natural fit for deserved *praise*.

  **Conclusion:** The slogan "people deserve what they earn" is highly ambiguous. Its meaning and validity depend entirely on how "earn" and "deserve" are defined. Your friend's rejection of inherited wealth hinges on interpreting "earn" strictly as personal effort (E2) and "deserve" as moral entitlement or proportional fittingness (D1/D2). This definition struggles with cases like the instinctive rescuer and may undervalue non-effort contributions like impactful skill or causal agency (which justify CEO bonuses under different interpretations). To engage productively, identify which specific definitions of "earn" and "deserve" are being used in the argument.
