     - How many chips in RH, RP, BH.
     - Why they chose that distribution.
     - In particular, what they did with BH and why.
  - Write the results on the board.

  **1:05 - 1:15 (10 min): The Reveal and Debrief**
  - Highlight the differences: especially the number of chips in BH and in RH.
  - Point out the change in the ratio RH:BH. Before: 20:20=1:1. After:
     - In Group A (Jeffrey): RH=30, BH=20 -> 3:2
     - In Group B (proportional): RH=36, BH=12 -> 3:1
     - In Group C (if they set BH=24): RH=27, BH=24 -> 9:8
  - Note that in every case, the ratio between RH and BH changed, even though the information was only about the Red team.
  - Introduce the philosophical point: the information didn't say anything about Blue, but it affected our beliefs about Blue relative to Red Hill. How should we update?
  - Explain that there are multiple proposed methods:
     - Jeffrey conditioning: keep the probability of the partition (Red/Blue) fixed and set the conditionals within Red. (This is what Group A did: they kept BH at 20, which fixed P(Blue)=1/3, and set RH:RP=3:1 within the Red's 40 chips -> 30 and 10.)
     - Minimum relative entropy: this actually coincides with Jeffrey conditioning in this case.
     - Other methods, like setting the new probabilities proportional to the old ones but with the constraint, might lead to different results (like Group B).
  - The uncomfortable realization: even though the information was about Red, it changed our relative credence between RH and BH. And there's no unique way to update.

  **Predictable Problems and Handling:**
  - Problem: Students might just set RH=30, RP=10, BH=20 without thinking about alternatives. 
     - Handling: During circulation, ask: "Why did you leave BH at 20?" and "Could you have moved some chips from BH to Red or vice versa and still satisfied the condition?"
  - Problem: Students might think they have to keep the total for Red the same. 
     - Handling: Clarify that the report doesn't say anything about the total number of troops in Red, only the ratio within Red. So they can change the total for Red as long as the ratio within Red is 3:1.
  - Problem: Fractions: using 60 chips and 3:1 ratio might lead to fractional chips. 
     - Handling: Allow groups to break chips? Or use paper and pencil? Better: use 60 and allow non-integer? But we want physical. So suggest they think in terms of groups of chips? Or use a different total? Alternatively, use 48 initially: 12 per quadrant. Remove BP: 36 left. Then the constraint: RH:RP=3:1. So 3y+y+z=36 -> 4y+z=36. Then integer solutions: e.g., z=20? Not possible. z must be divisible by 4? No. Options: z=0,4,8,12,16,20,24,... but z<=36. And y=(36-z)/4 must be integer. So z must be multiple of 4? Then z=0,4,8,12,16,20,24,28,32,36. Then y=9,8,7,6,5,4,3,2,1,0. So RH=3y=27,24,21,18,15,12,9,6,3,0. And RP=y=9,8,7,6,5,4,3,2,1,0. And BH=z=0,4,8,12,16,20,24,28,32,36. But BH=0 might not make sense. So maybe use 80 initially? Then after step1: 60. Then 4y+z=60. Then z must be such that (60-z) divisible by 4. So z=0,4,8,...,60. Then y=15,14,13,...,0. But then RH=3y=45,42,...,0. So with z=20 (as in the first update), y=10, RH=30, RP=10. Or if they do 3:1:1, then they can't because 60/5=12 is integer. So 36,12,12. But 12 is integer. So it works. So with 60 chips, they can do 30,10,20 or 36,12,12 without fractions. So we'll go with 80 initially, 20 per cup.

  **What the Activity Can't Capture:**
  - The activity uses physical chips and fixed total, which makes the probability objective (as if the chips represent actual troops). In the epistemic case, the probabilities are subjective, and the information comes from a fallible source. The activity doesn't capture the trust in the source or the possibility that the source might be mistaken. Also, in the activity, the conditional information is taken as a hard constraint, whereas in the philosophical problem, it might be a piece of evidence that should be integrated with other beliefs.

  **Final Handout for Students:**

  [To be printed and distributed]

  **Judy Benjamin Troop Deployment Activity**

  **Scenario:** You are a general deploying troops in four sectors. The sectors are defined by:
  - Team: Red or Blue
  - Terrain: Hill or Plain

  Thus, four sectors:
  - RH: Red Team, Hill
  - RP: Red Team, Plain
  - BH: Blue Team, Hill
  - BP: Blue Team, Plain

  **Materials:** 
  - 4 cups labeled RH, RP, BH, BP
  - 80 poker chips (representing troops)

  **Initial Deployment:** Place 20 chips in each cup.

  **Step 1: First Intelligence Report**
  - You receive reliable information: "There are no enemy troops in BP (Blue Team, Plain)."
  - Action: Remove all chips from the BP cup. (Set BP aside with no chips.) You now have chips in RH, RP, and BH only (60 chips total).

  **Step 2: Second Intelligence Report**
  - You receive: "If you are in Red Team territory, then the odds of being in Hill (vs. Plain) are 3:1."
  - This means: Among the troops in Red Team territory, there are 3 times as many in Hill as in Plain.

  **Your Task:** Redistribute the 60 chips among the three cups (RH, RP, BH) to reflect this new information. 
  - You must have: \(\text{RH} = 3 \times \text{RP}\).
  - The total number of chips must remain 60.
  - You are free to adjust the chips in BH as you wish, as long as the constraint is met.

  **Rules:**
  1. You may move chips between cups, but you cannot add or remove any chips (total 60).
  2. Discuss in your group: What does the report imply for the Blue Team? How should it affect BH?
  3. There is more than one way to do this! Be prepared to explain your reasoning.

  **Timeline:**
  - 10 min: Setup and first update (remove BP)
  - 25 min: Discuss and redistribute for the second report
  - 15 min: Group reports
  - 10 min: Class discussion and debrief

  **Debrief Outline:**
  1. Compare group results: especially the number of chips in BH and the ratio of RH to BH.
  2. Point out that in every group, the ratio of RH to BH changed (from 1:1 initially after step 1) even though the information was only about the Red team.
  3. Explain that this is the Judy Benjamin problem: updating on conditional information can shift credences in ways that feel unrelated.
  4. Introduce the standard update method (Jeffrey conditioning): it keeps the probability of the partition (Red/Blue) fixed and only updates within the Red partition. This is what groups did if they left BH at 20 and set RH=30, RP=10.
  5. Other methods exist, like setting the new probabilities proportionally to the old ones but with the constraint, which might lead to BH=12 (if they did 3:1:1).
  6. Conclude: there is no consensus on how to update in such cases, and that's why it's a puzzle in formal epistemology.

  This activity should make the abstract problem tangible and highlight the puzzling shift.
answer: |-
  ### Structured Activity: The Judy Benjamin Problem

  **Why I Chose This Format:**  
  I brainstormed three formats: (1) A **map and tokens** where students move pieces across quadrants, (2) **index cards with weights** where students adjust physical weights on labeled cards, and (3) **cups and poker chips** for tactile probability mass redistribution. I chose **cups and poker chips** because it’s highly visual, forces concrete redistribution decisions (making ambiguity visceral), and avoids math phobias by using counting instead of fractions. The physical transfer of chips mirrors probability flow, and the cups' partitions make it easy to see how conditional constraints leak into unconditional shifts.

  ---

  ### **Activity: "The Intelligence Report Dilemma"**
  **Core Idea:** Students redistribute poker chips across four quadrants (Color: Red/Blue × Terrain: Hill/Plain) after two intelligence reports. The first rules out a quadrant (simple conditionalization). The second gives a conditional odds ratio within a color (inducing ambiguity). Groups defend different redistributions, revealing the unintuitive credence shift.

  #### **Materials (Per Group of 4 Students):**  
  - **4 clear plastic cups** labeled:  
    - RH (Red Hill)  
    - RP (Red Plain)  
    - BH (Blue Hill)  
    - BP (Blue Plain)  
  - **80 identical poker chips** (or bingo chips/coins).  
  - **Sticky notes** for labeling and calculations.  
  - **Handout** (1 per group) with rules and scenario (verbatim text below).  
  - **Timer** for activity phases.  

  #### **Group Roles (Assigned Rotating in Group):**  
  1. **Facilitator:** Ensures everyone speaks; reads instructions aloud.  
  2. **Chip Manager:** Moves chips during redistributions.  
  3. **Recorder:** Tracks decisions on sticky notes; reports outcomes.  
  4. **Skeptic:** Challenges assumptions; asks, “Why did we do this?”  

  #### **Handout Text (Rules & Scenario):**  
  ```  
  ### SCENARIO: THE LOST BATTALION  
  You command troops in 4 sectors:  
  - RH = Red Team in the Hills  
  - RP = Red Team in the Plains  
  - BH = Blue Team in the Hills  
  - BP = Blue Team in the Plains  

  **Initial Setup:**  
  - Place 20 chips in each cup (80 total chips). Each chip = 1 troop.  
  - Probability of any sector = chips in its cup ÷ 80.  

  **PHASE 1: FIRST INTELLIGENCE REPORT**  
  - Intel: *"Enemy contact in BP (Blue Plain) is impossible. Remove all troops."*  
  - **Action:** Remove ALL chips from BP. Do not add/remove other chips.  

  **PHASE 2: SECOND INTELLIGENCE REPORT**  
  - Intel: *"If you’re in Red Team territory, the odds of Hill vs. Plain are 1:2."*  
    - Translation: For Red troops, Hills : Plains = 1:2.  
  - **Constraints:**  
    1. RH and RP chips MUST be in ratio 1:2 (e.g., 5 RH & 10 RP).  
    2. Total chips in RH + RP + BH MUST be 60 (no adding/removing).  
    3. Adjust BH **as you see fit**—the report says nothing about Blue.  
  - **Goal:** Redistribute chips to meet the ratio. Defend your choices!  
  ```  

  ---

  ### **Minute-by-Minute Timeline (75m Total)**  
  **0:00–0:10 (10m): Introduce & Setup**  
  - Briefly explain the Judy Benjamin paradox (no details yet): *"Today, we’ll see how ‘if-then’ evidence can warp beliefs in weird ways."*  
  - Distribute materials. Groups label cups, add 20 chips each.  
  - Assign roles. Hand out rules.  

  **0:10–0:20 (10m): Phase 1 (Simple Conditionalization)**  
  - Groups remove BP’s 20 chips (now 60 chips: RH=20, RP=20, BH=20).  
  - **Check-in:** *"What’s P(Red)? P(Blue)?"* (Answer: P(Red)=40/60=⅔, P(Blue)=20/60=⅓).  

  **0:20–0:45 (25m): Phase 2 (Conditional Constraint)**  
  - Announce second intel: *"If Red, odds of Hill:Plain = 1:2."*  
  - **Group Task:** Redistribute chips to satisfy RH:RP = 1:2 (total 60). BH can be adjusted freely.  
  - **Instructor Circulates:**  
    - Predictable issue: Groups fixate on renormalizing (e.g., set RH=10, RP=20, BH=30). Ask: *"Why change BH? The intel doesn’t mention Blue."*  
    - If stuck: *"You could leave BH alone or change it—defend either!"*  
  - **Target Ambiguity:** Most groups start by keeping BH=20, forcing RH↓ and RP↑. But they must confront BH’s role.  

  **0:45–1:00 (15m): Group Reports**  
  - Each Recorder shares:  
    - Final chip counts for RH, RP, BH.  
    - Justification for BH’s count.  
  - **Expected Outcomes:**  
    - **Group A (Jeffrey-esque):** BH=20, RH=10, RP=20 (P(Blue)=⅓ unchanged).  
    - **Group B (Renormalize):** BH=30, RH=10, RP=20 (P(Blue)=½).  
    - **Group C (Split Difference):** BH=25, RH=10, RP=20, adjust total (invalid; gently correct).  
  - Record all results on the board.  

  **1:00–1:15 (15m): Debrief & Philosophical Punchline**  
  - **Key Moments Mapping:**  
    - **Phase 1 (Simple Conditionalization):** Analogous to Bayes. Confidence from ruling out BP.  
    - **Phase 2 (Stuckness):** Conditional constraint (RH:RP=1:2) has no unique solution—groups *feel* ambiguity.  
    - **Uncomfortable Realization:** Point to RH: In Group A (BH=20), P(RH) fell from 20/60 to 10/60, but P(BH) stayed 20/60. Yet P(RH)/P(BH) shifted from 1:1 to 1:2! Intel was "about" Red, but changed the *relative odds* of RH vs. BH.  
  - **Philosophical Connections:**  
    - **Jeffrey Conditioning:** Groups that kept BH fixed (P(Blue) unchanged) did this. Minimizes change but shifts relative credences.  
    - **MaxEnt (Min Relative Entropy):** This *is* Jeffrey here—it "preserves" P(Blue) but distorts RH/BH.  
    - **Refusing to Update:** Groups that set BH=0 or other extremes avoided constraints but violated total probability.  
  - **Why It’s Contested:** *"Should ‘if-then’ evidence alter beliefs about unrelated things? MaxEnt says yes, but is that rational? Philosophers fight about this!"*  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem: Students just renormalize.**  
    - E.g., Set BH=30 to "balance" after changing RH/RP.  
    - **Solution:** Ask: *"The intel doesn’t mention Blue—why change it? What if you left BH alone?"*  

  - **Problem: Smuggling independence.**  
    - E.g., *"Terrain and color are independent, so BH should be 20."*  
    - **Solution:** *"Did the intel *say* that? What if terrain depends on color?"*  

  - **Problem: Fractions panic.**  
    - **Solution:** Use chips—counting avoids math. E.g., 1:2 ratio with 60 chips = RH:RP can be 10:20, 15:30, etc.  

  - **Problem: Over-constraining BH.**  
    - **Solution:** Emphasize rules: *"BH is a free variable. You can set it to 0, 60, or anything—but justify!"*  

  ---

  ### **What the Activity Can’t Capture**  
  **The Trust in the Source:** In the actual Judy Benjamin problem, the conditional info comes from a *fallible source* (e.g., a radio message with error risk). The activity treats it as a hard constraint, missing how reliability affects updating. *You’ll need to clarify in debrief: "In real life, you might discount the report—but here, we assume it’s certain, making the shift extra jarring."*  

  ---

  **Final Notes:**  
  - **Chip Count Rationale:** 80 chips allow integer solutions (e.g., 1:2 ratio works with RH=10, RP=20, BH=anything).  
  - **Emotional Arc:** Groups start confident (Phase 1 is easy), get stuck (Phase 2 has no answer), then squirm (they *must* shift RH/BH odds unintuitively).  
  - **Follow-Up:** For homework, have students write a paragraph on why the shift feels "irrational" or defend MaxEnt.  

  This activity makes the abstract visceral. Students will leave uneasy—which means it’s working.
