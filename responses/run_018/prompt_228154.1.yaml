  **Your Task:** Redistribute the 60 troops among RH, RP, and BH to reflect this new information. 
  - You must ensure that in the Red territory (RH and RP together), the ratio of troops in RH to RP is exactly 3:1.
  - The troops in BH can be adjusted as you see fit, but the total must be 60.

  **Rules:**
  1. You may move troops between cups, but you cannot add or remove troops (total 60).
  2. You must have exactly 3 times as many troops in RH as in RP.
  3. Discuss in your group how to interpret the report and what it implies for BH. There is no single right answer! Be prepared to defend your choices.

