answer: |-
  Your diagnosis is profoundly insightful: the material constitution debate *is* fundamentally stalled not by a lack of logical rigor or empirical input, but by a **clash of metaontological commitments and divergent conceptions of explanatory adequacy**. The core disagreement lies beneath the technical apparatus, rooted in what each side considers a *legitimate metaphysical question* and what counts as a *satisfactory answer*. Here's a breakdown of the impasse and potential paths forward:

  **Diagnosing the Stalemate:**

  1.  **Clash of Ontological Primitives & Explanatory Virtues:**
      *   **Constitution Theorists (e.g., Baker, Johnston):** Treat *persistence conditions*, *modal properties*, and *kind-essential properties* (like being a statue, having an artistic origin, requiring shape) as metaphysically primitive and explanatorily fundamental. Their goal is to capture our robust intuitions about artifact identity, persistence, and destruction. They prioritize *explanatory coverage* of these modal/historical facts over *quantitative parsimony*. For them, denying distinct entities *fails* to explain why "The lump survives squashing, but the statue does not" is true.
      *   **Identity Theorists / Eliminativists (e.g., Lewis, Merricks, perhaps van Inwagen):** Treat *spatiotemporal location* and *mereological composition* (or brute physical facts) as metaphysically primitive and explanatorily fundamental. Their goal is ontological parsimony and avoiding mysterious "coincident entities." They see the modal/historical differences highlighted by constitution theorists as *conceptual* or *descriptive* facts about a *single* object, not requiring distinct ontological commitments. They prioritize *quantitative parsimony* and see constitution as multiplying entities *without* genuine additional explanatory power – the physical facts explain everything real.
      *   **Disagreement:** It's not primarily about facts (both agree on the location and destruction scenarios) or *just* intuitions (both sides claim intuitive support). The core clash is over **which explanatory virtue trumps the other** (coverage vs. parsimony) and **what kinds of properties are ontologically committing** (are modal profiles *real features of the world* demanding distinct entities, or just *ways we describe* a single entity?).

  2.  **Bedrock Intuitions vs. Revisionism:**
      *   Constitution theory aligns strongly with pre-theoretical, folk intuitions about artifacts: the statue *is* its shape and origin; destroying the shape destroys the *thing itself* as that kind of thing. This feels like a deep metaphysical truth.
      *   Identity theory/eliminativism often requires revising these intuitions. They argue the folk are mistaken about ontology, confusing conceptual distinctions (statue-concept vs. lump-concept) with ontological ones. They see this revision as the price of ontological hygiene. Constitution theorists see this revision as an unacceptable cost, sacrificing genuine metaphysical distinctions on the altar of parsimony.

  3.  **Metaontological Stance:**
      *   **Is this a Substantive Ontological Dispute?** Constitution theorists say *yes* – it's about what fundamental kinds of objects exist (statues as distinct entities governed by their own principles).
      *   **Is it a Verbal/Semantic Dispute?** Identity theorists often lean this way – "statue" and "lump" pick out the same thing under different descriptions or temporal stages. Eliminativists might say it's about the *semantics* of artifact terms referring (or failing to refer) to fundamental reality.
      *   **Are They Talking Past Each Other?** **Yes, partially.** Constitution theory is fundamentally a theory about *objecthood and persistence conditions for kinds*. Identity theory/eliminativism is often driven by a more austere, physics-first (or mereology-first) ontology. They are asking subtly different questions:
          *   Constitution: "What *is* a statue, such that it persists only if its shape persists, while the matter composing it does not require that shape?"
          *   Identity/Eliminativism: "What fundamental entities exist at this spatiotemporal location, given the physical facts?" or "Do artifact terms like 'statue' successfully denote entities over and above arrangements of matter?"

  **Assessing Recent Moves & Potential Progress:**

  1.  **Temporary Intrinsics (Perdurance/Stage Theory):** This *is* often a relabeling of the impasse within a 4D framework. Instead of "coincident entities *now*," we have "different temporal parts/stages sharing a location *at t*." The core disagreement about whether shape/modal properties require distinct ontological commitments (now as distinct entities, then as distinct temporal parts) persists. It offers a different *formalism* but doesn't resolve the underlying clash about what properties are ontologically committing.
  2.  **Dominance Conditions:** While technically sophisticated, dominance conditions often presuppose the very kind-essentialism constitution theorists champion and their opponents reject. It refines the constitution view but doesn't address the opponent's core objection to admitting kind-essential properties as fundamental.
  3.  **Relative Identity:** A radical move that avoids coincidence by denying absolute numerical identity. However, it faces significant logical and intuitive challenges, and many find its revisionism more costly than either constitution or identity theory. It hasn't gained widespread traction as a solution.

  **What Would Count as Genuine Progress?**

  Given the diagnosis above, progress requires shifting the focus *away* from trying to definitively prove one ontology correct and *towards* clarifying the metaontological and explanatory foundations:

  1.  **Explicit Metaontological Debate:** Framing the discussion explicitly around:
      *   **What is the purpose of ontology?** Is it to systematize our best conceptual schemes (favoring constitution)? To limn the structure of fundamental physical reality (favoring identity/eliminativism)? Something else?
      *   **What are the criteria for ontological commitment?** When does a difference in (non-spatiotemporal) properties warrant positing distinct entities? Can we articulate non-question-begging standards?
      *   **The Status of Artifact Kinds:** Are artifact kinds (like *statue*) genuine metaphysical kinds with essential properties, or merely useful conceptual classifications? Can this be argued for without relying on the intuitions the dispute is about?
  2.  **Clarifying Explanatory Burdens:** Instead of asserting "X explains everything," each side needs to rigorously demonstrate *how* their view explains the phenomena the other side finds problematic:
      *   Identity/Eliminativists: Need to provide a compelling account of *why* the sentence "The statue is destroyed by squashing, but the lump is not" is true (or false/meaningless) *without* appealing to distinct entities or stages, and without making the truth seem merely linguistic or trivial. What *grounds* the difference in truth conditions?
      *   Constitution Theorists: Need to provide a clearer account of *how* constitution works that doesn't make it seem like brute, inexplicable coincidence. Can they reduce the mystery? What *are* the identity and persistence conditions for constituted objects, and are they consistent and non-arbitrary?
  3.  **Focusing on More Tractable Ground:** Instead of the emotionally/intuitively charged statue/clay case, focus on less contentious examples where persistence conditions might diverge more clearly (e.g., living organism vs. aggregate of cells, ship of Theseus variants). Analyze *why* intuitions might be stronger or weaker in different cases. Explore the *connections* between material constitution and other puzzles (persistence through part replacement, vagueness, composition).
  4.  **Grounding Relations:** Investigating whether the differences constitution theorists highlight (modal/historical properties) can be *grounded in* non-modal, non-historical facts about the arrangement and causal history of the matter, *without* requiring distinct objects. Can a sophisticated identity theory provide this grounding story? Conversely, can constitution theorists show why such grounding is impossible?
  5.  **Accepting Fundamentally Different Projects:** Recognizing that constitution theory and identity/eliminativism might be engaged in *different*, albeit related, metaphysical projects. One is concerned with the ontology of the *manifest image* (our lived experience of objects with functions, histories, and meanings), the other with the ontology of the *scientific image* (fundamental physical reality). Framing them as such clarifies their respective domains and limitations, potentially dissolving the sense of direct conflict.

  **Conclusion for Your Chapter:**

  Your hypothesis is correct. The deadlock stems from a **fundamental divergence in metaphysical priorities and conceptions of explanation**. The dispute is **substantive** (about what exists) but **underwritten by deeper disagreements** about what kinds of existence claims are meaningful, what counts as a good explanation, and the metaphysical status of kind-essential properties like shape and origin.

  **Progress would look like:**

  1.  **Explicit acknowledgment and analysis** of the metaontological commitments driving each side.
  2.  **Rigorous articulation and defense** of their respective standards of explanatory adequacy and parsimony.
  3.  **Focusing the debate** on the *grounding* of modal/historical differences or the *explanatory cost* of rejecting them.
  4.  **Exploring whether the dispute reveals a genuine fracture** between different legitimate ways of "carving reality" (manifest vs. scientific image) rather than one side simply being wrong.

  Encourage your students to see the debate not just as a puzzle about statues and clay, but as a window into the deepest questions about the nature of ontology itself: What are we *doing* when we ask "What exists?" and what kind of answers should we expect? The impasse in material constitution is a symptom of these unresolved metaontological questions. Framing it this way doesn't solve the puzzle, but it provides a far more productive and honest lens through which to understand the enduring controversy.
