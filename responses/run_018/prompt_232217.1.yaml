prompt: |-
  I'm trying to work out what I actually think about when consent to sex is valid, going by my gut on cases. Here are my verdicts:

  - A man tells a woman he has had a vasectomy; she agrees to have sex with him on that basis; in fact he has not. Verdict: her consent is not valid; what happened was not just sex plus a separate lie.
  - A man tells a woman he loves her and sees a future with her in order to get her to sleep with him; neither is true. Verdict: manipulative and wrong, but her consent to the sex is valid.
  - A man agrees to use a condom but removes it during intercourse without her knowledge. Verdict: her consent does not cover the sex that actually occurred.
  - A woman tells a man she is on the pill when she is not, and he consents on that basis. Verdict: the same as the vasectomy case; his consent is not valid.
  - A man tells a woman he is a successful gallery owner when he is actually unemployed and living with his parents. Verdict: contemptible, but the sex is consensual.
  - A boss tells an employee she will be fired unless she sleeps with him. Verdict: the sex is not consensual.
  - A long-term partner says he will leave the relationship unless they have sex. Verdict: the consent is valid; the relationship is bad, but the sex is consensual.
  - A sober person has sex with someone who is so drunk they can barely stand and are slurring their words, though the drunk person says yes and initiates. Verdict: the consent is not valid.

  Is there one principle, or a small number of principles, about deception, coercion, and competence that captures these verdicts? The two places where my own verdicts feel hard to reconcile are the vasectomy lie versus the love lie, and the boss's threat versus the partner's ultimatum. If some verdicts have to go, which should I revise? And what does the resulting account say about the case I keep going back and forth on: a man tells his partner they are exclusive, she says she would not have sex with him if he were seeing anyone else, they always use condoms and he has been tested, but in fact he is sleeping with someone else. Is her consent to the sex valid?
reasoning: |-
  Okay, let me try to figure out the user's question. They're exploring their intuitions about consent in various scenarios, looking for underlying principles. Their main confusion is between the vasectomy lie and the love lie cases, and the boss vs partner ultimatums. Also, they're unsure about the exclusivity deception case.

  First, I need to identify the patterns in their verdicts. They invalidate consent when deception directly affects the nature of the act (vasectomy, condom removal, pill lie) or when there's severe coercion (boss threat, intoxication). They validate consent in cases of personal misrepresentation (gallery owner) or relationship ultimatums. The love lie is tricky because it's deception but not directly sexual, so they see consent as valid. 

  The user might be struggling with where to draw the line between deception that invalidates consent and other lies. The vasectomy case involves a direct consequence (pregnancy risk), while the love lie affects emotions but not the physical act. The boss uses power dynamics for coercion, which is different from a partner's non-abusive ultimatum. 

  The exclusivity case is a gray area. If they apply the principle of deception about a critical aspect of the act, similar to the vasectomy, then consent might be invalid. But if exclusivity is more like the love lie, then consent could be valid. The user's discomfort here might stem from conflicting principles: the importance of sexual health vs. relational trust. 

  The user might need clarification on whether their principles prioritize physical consequences or relational aspects. They might also be seeking validation for their intuitions or guidance on adjusting inconsistencies. Deeper needs could include forming a coherent ethical framework for consent, possibly for personal understanding or advocacy. They might want to ensure their principles align with legal standards or feminist theory, hence the reference to deception and coercion. 

  I should consider how to reconcile the vasectomy and love lies. Maybe distinguishing between deception about the act itself vs. surrounding circumstances. For ultimatums, the boss's threat involves exploiting power, while the partner's is a relational consequence. The exclusivity case depends on whether the deception is seen as altering the agreed terms of the sexual act. If STI risk is involved, that could tip it towards invalid consent. 

  The user might benefit from the "essential features" framework, where consent is invalid only if deception or coercion changes fundamental aspects of the act (like health risks). That would make the exclusivity case invalid if STI exposure is a factor. Otherwise, it might be a betrayal but not invalidating consent. Helping them weigh these factors could resolve their back-and-forth.
answer: |-
  Based on your verdicts, a coherent set of principles emerges, centered on **the nature of the deception/coercion and its direct link to the specific sexual act agreed upon:**

  1.  **Principle 1: Deception Invalidates Consent When It Directly Pertains to the *Nature of the Act* or *Fundamental Conditions* Agreed Upon:** Consent is based on specific terms. If deception fundamentally alters those core terms (like protection from pregnancy/STIs, the physical act itself, or the context of safety/power), it invalidates consent.
      *   *Captures:* Vasectomy lie (nature/condition: pregnancy prevention), Condom removal (nature/condition: barrier use), Pill lie (nature/condition: pregnancy prevention), Boss threat (nature/context: fundamental power imbalance/coercion).
      *   *Distinguishes:* Love lie (deception about feelings/relationship future - doesn't change the *physical act* agreed to), Gallery lie (deception about status - doesn't change the physical act).

  2.  **Principle 2: Coercion Invalidates Consent When It Involves an *Illegitimate Threat* Creating a Lack of Reasonable Alternative:** Consent requires the ability to say "no" without facing unacceptable, externally imposed harm. Threats of professional ruin (firing) or criminal harm are illegitimate and coercive. Threats inherent to the *state* of a voluntary relationship ("I will leave if our needs aren't met") are not inherently illegitimate coercion in this context.
      *   *Captures:* Boss threat (illegitimate threat: job loss), Drunk person (lack of capacity to resist/consent meaningfully - analogous to coercion due to inability).
      *   *Distinguishes:* Partner ultimatum (threat is ending the relationship - a painful consequence inherent to relationship dynamics, not an illegitimate external threat like job loss or violence).

  3.  **Principle 3: Competence is Essential:** Consent requires the cognitive ability to understand and agree to the act. Severe intoxication negates competence.
      *   *Captures:* Drunk person.

  **Reconciling the Hard Cases:**

  *   **Vasectomy Lie vs. Love Lie:**
      *   **Vasectomy:** Directly pertains to a fundamental condition of the act - pregnancy prevention. The sex she consented to was "sex without pregnancy risk due to vasectomy." That act did not occur.
      *   **Love Lie:** Deception about feelings/intentions. While the *motivation* for agreeing is manipulated, the *act* she consented to ("sex with this person now") is what physically occurred. The deception relates to the *broader relationship context*, not the specific physical act agreed upon under false pretenses about its nature or conditions. (Principle 1).
  *   **Boss Threat vs. Partner Ultimatum:**
      *   **Boss Threat:** Involves an illegitimate threat leveraging power *external* to the relationship (employment). Saying "no" leads to an unacceptable, externally imposed consequence (job loss). This creates coercion, invalidating consent. (Principle 2).
      *   **Partner Ultimatum:** The threat ("I will leave") is a consequence *inherent* to the voluntary relationship dynamic itself. While deeply upsetting and potentially manipulative, it doesn't involve an illegitimate external threat. Saying "no" means accepting the potential end of the relationship, a painful but different kind of consequence. The choice, while terrible, exists within the relationship's framework. (Principle 2).

  **If Verdicts Must Go:**

  Your verdicts are largely consistent with legal and ethical frameworks in many jurisdictions (especially concerning deception about STIs/pregnancy and condom removal). The "love lie" and "partner ultimatum" being valid consent is the common legal stance, though ethically contested.

  *   **Least Coherent Verdict:** The strongest tension is arguably between the **vasectomy/pill lie** (invalid) and the **gallery lie** (valid). The *gallery lie* is clearly valid under Principle 1. The *vasectomy/pill lie* are clearly invalid under Principle 1. The **love lie** sits between them. **If you revised the *love lie* to invalid consent,** you'd abandon Principle 1 and move towards a broader principle where *any significant deception inducing consent* invalidates it. This would also likely require revising the *gallery lie* verdict to invalid consent, as it's also a significant lie inducing consent. This is a broader, more relational view of consent, but it makes consent very fragile and hard to define ("how big a lie?").
  *   **Alternative Revision:** You could hold firm on Principle 1 but refine it for the exclusivity case below.

  **The Exclusivity Case - Applying the Principles:**

  *   **Man lies about exclusivity.** Partner states exclusivity is a condition for sex. They use condoms and he's tested.
  *   **Analysis using Principles:**
      *   **Deception:** He lied about a condition she explicitly stated was fundamental to her consent (exclusivity).
      *   **Link to the Act?** Does this deception pertain to the *nature* of the act or a *fundamental condition* agreed upon?
          *   **Argument for Invalid Consent:** Exclusivity was an explicitly stated, fundamental condition. She consented to "sex within an exclusive relationship." He knew this was essential. The act she agreed to (exclusive sex) did not occur. This directly parallels the vasectomy case - a lie about an explicitly stated condition. (Principle 1).
          *   **Argument for Valid Consent (under your original principles):** The deception relates to the *relationship context* (fidelity, trust), not the *physical nature* of the act itself (like barrier use, pregnancy risk, or the specific act occurring). The physical act she consented to ("sex with him using a condom") occurred. The lie is about relational trust, similar to the love lie or gallery lie. (Principle 1).
          *   **STI Risk?** Condoms reduce but don't eliminate STI risk from other partners. If STI risk is a core part of her concern about exclusivity (even with condoms), this strengthens the "invalid consent" argument under Principle 1 (deception about a fundamental safety condition). If her exclusivity condition is purely about emotional betrayal/relationship definition, it leans closer to the love lie.

  **Conclusion on Exclusivity Case (Based on Your Principles):**

  Your principles, as applied to your other verdicts, suggest **her consent is likely valid.** Here's why:

  1.  **Nature of the Act:** The *physical act* agreed upon (sex with him, using a condom) occurred. The deception relates to the *relational context* (his fidelity), similar to the love lie or gallery lie. Principle 1 focuses on deception altering the physical act or conditions like pregnancy/STI prevention *directly*, not the relational trust surrounding it.
  2.  **STI Risk Mitigated:** The use of condoms and his testing (assuming honesty about testing) significantly mitigates the *direct physical risk* deception element compared to the vasectomy/pill cases. Her stated reason ("I wouldn't have sex if you weren't exclusive") appears primarily relational/emotional, not solely or primarily focused on unmitigated STI risk *despite* condom use.

  **However, this feels like the hardest case and the weakest point of the principles derived purely from your verdicts.** Many people (and some legal systems moving towards broader fraud concepts) would argue that such a fundamental, explicitly stated condition *should* invalidate consent, seeing it as analogous to the vasectomy deception. **To make her consent *invalid* in this case, you would need to revise your principle slightly:**

  *   **Revised Principle 1 (Stronger):** Consent is invalidated by deception if it pertains to:
      *   (a) The *physical nature* of the act (e.g., condom use, specific acts).
      *   (b) *Fundamental health/safety conditions* of the act (e.g., STI status, fertility status).
      *   **(c) A condition *explicitly stated* by the consenting party as *fundamental* to their agreement, which the deceiver knows and exploits, regardless of whether it falls under (a) or (b).**

  Adding (c) would capture the exclusivity lie (if explicitly stated as fundamental) *and* the love lie *if* the victim had explicitly stated "I will only have sex if you love me and want a future." It would also likely capture the gallery lie if she'd said "I only sleep with successful gallery owners." This makes consent more robust but also more context-dependent on explicit statements.

  **In summary:** Your intuitive verdicts are captured well by principles focusing on deception altering the *core physical act/conditions* and coercion involving *illegitimate threats*. The exclusivity case highlights a tension. Under your current principles, consent in that case is valid. If that feels wrong, you might need to incorporate a principle about deception regarding *explicitly stated fundamental conditions*, which would require revising your verdict on the love lie (if the condition was explicitly stated) or accepting that verdict as an exception based on the *type* of condition (physical vs. relational).
