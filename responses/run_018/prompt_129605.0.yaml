  I'm a journalist who covers science and conceptual ideas, and I'm applying for a four-month writer-in-residence fellowship at a foundation that funds philosophical work with public relevance. I need a polished, formal two-page proposal that takes up peer disagreement—specifically the conciliationism versus steadfastness debate—but moves it away from the familiar framing in which two people disagree about a single first-order proposition they understand identically. Here is the half-formed idea I need turned into a rigorous research plan.

  In actual interdisciplinary practice, two researchers can agree on the raw data, recognize each other as equally competent reasoners, and yet diverge sharply on whether the evidence warrants acceptance of a claim—say, a climate modeler and an epidemiologist interpreting the same probabilistic forecast—because they apply different normative weightings to false-positive and false-negative risk. They are epistemic peers in the standard philosophical sense, but they disagree not about a fact; they disagree about what I will call an epistemic risk-calibration norm: the threshold that should govern belief-formation under uncertainty, given the institutional costs of error in their respective domains. The existing literature largely asks whether, upon discovering that an equally rational peer rejects my belief, I should reduce my confidence in that belief. It rarely asks whether, upon discovering that an equally rational peer employs a different risk-calibration norm, I should revise my own norm, and whether conciliationism applied at this second-order level would force an implausible methodological convergence across disciplines.

  The proposal should state the precise research question: does conciliationism apply to these calibration-level norms, and if so, does it entail that interdisciplinary collaboration requires convergence on a single scientific methodology that is neither achievable nor desirable? It should explain why standard steadfast defenses—those appealing to private evidence, domain-specific expertise, or cognitive superiority—do not automatically resolve this case, since both peers can fully acknowledge the other's expertise while maintaining that their own risk weighting is appropriate to their institutional role. For method, outline a conceptual analysis that proceeds by constructing decision-theoretic representations of competing calibration norms, testing them against intuitive cases of interdisciplinary disagreement, and asking whether steadfastness can be grounded in institutional function rather than in first-order reasoning failure. Specify what a successful deliverable looks like—perhaps a taxonomy that separates belief-level disagreement from calibration-level disagreement, with criteria for when each form of conciliationism is appropriate—and what would count as failure, such as demonstrating that the distinction collapses back into the standard first-order debate. Finally, provide an honest scope assessment: what can be completed in four months without empirical fieldwork or data collection, and where the project risks growing too large for that window. Do not include a bibliography, citation list, or literature review organized by author and date; I will add references myself. The tone should be suitable for a board that understands philosophy of science but does not specialize in epistemology.
