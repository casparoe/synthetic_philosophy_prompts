prompt: |-
  I chair the quarterly expert elicitation panel at a mid-sized engineering consultancy. Every quarter, six to ten senior engineers and cost modelers independently turn the same evidence package into probability distributions over three quantities for each major bid: capital cost overrun, schedule slip, and recordable safety incidents. The board's risk committee treats our consensus distributions as inputs to a go/no-go decision on bids worth up to nine figures, and I have to defend the process if the numbers later prove wrong. I have about one week between the evidence package going out and the consensus meeting. None of the panelists has formal training in decision theory, and there is no room to run a full Bayesian elicitation exercise from scratch each quarter. Our current method is for each panelist to present and defend their numbers orally, after which we take the median; this silently treats every panelist's numbers as equally credible and gives nobody a diagnosis of why people still disagree after reading the same package.

  I want to replace this with a reusable disagreement-audit procedure built as honestly as possible on the common prior assumption as I understand it: the idea that agents who start from the same prior and condition on the same evidence should end with the same posterior, so any remaining divergence traces to evidence that was not actually pooled or to someone not having updated correctly. I know that this is a substantive assumption rather than a theorem about all rational agents everywhere, and that the formal result depends delicately on assumptions like common knowledge of posteriors, which a panel of humans probably never satisfies exactly.

  Give me a procedure I can run each quarter. It should include a sequence of tests, in order, for a set of panel responses; a checklist of the distinct ways responses can diverge even under a common prior; and decision rules for what to do when a test fails, up to and including reporting that the process has not converged. Mark each step where the procedure is really a judgment call presented as a mechanical step, and specify which formal distinctions must survive the simplification (for example, common prior versus common knowledge of posteriors versus common evidence) and which can be dropped. Work the procedure through three concrete applications: one where it traces the disagreement to information that was never pooled; one where it traces the disagreement to a substantive difference in priors or in how evidence is weighted, and gives an answer I will not like; and one where it cannot distinguish those explanations and has to say so. End by stating what the procedure cannot do, in particular whether it can ever establish that the panel actually shares a prior rather than merely failing to find evidence that they do not.
reasoning: |-
  We are designing a procedure that assumes a common prior and attributes divergence to either:
    1. Private evidence that wasn't pooled (i.e., some panelist has information others don't)
    2. Incorrect updating (e.g., misinterpreting shared evidence, calculation error, cognitive bias)

  The procedure will involve a sequence of steps to test for these. We note that the common prior assumption is strong and may not hold, but we proceed under it.

  Steps of the procedure:

  1. **Collect individual distributions and rationales**: Each panelist submits their distributions (for each quantity: capital cost overrun, schedule slip, safety incidents) and a written rationale that includes:
     - The key pieces of evidence they relied on (with references to the shared evidence package and any private information they used)
     - A brief explanation of how they updated from a prior belief to the posterior.

     (This step replaces the oral defense with a written one to allow for more structured comparison.)

  2. **Identify and resolve private evidence (Step 1: Test for Private Evidence)**:
     - The chair compiles a list of any evidence cited by any panelist that was not in the shared package.
     - If any private evidence is cited, the chair must decide:
          a. Whether the private evidence is credible and relevant.
          b. Whether it can be shared with the entire panel without violating confidentiality or causing other issues.
     - If the private evidence is deemed shareable, then the panel is reconvened (or the evidence is distributed) and panelists are asked to update their distributions in light of the new evidence. This step may be iterative until no new private evidence is introduced.
     - If the private evidence is not shareable, then the chair must note this in the report and the panel must proceed with the understanding that some panelists have information others do not. In this case, the common prior assumption is violated in practice (because not all evidence is common), and the chair must highlight the areas of private evidence and the panelists who hold them.

     *Judgment call*: The chair must decide the credibility and shareability of private evidence.

  3. **Check for updating errors (Step 2: Test for Updating Consistency)**:
     - After ensuring all evidence is shared (or that private evidence is accounted for as above), the chair then compares the rationales for interpreting the same evidence.
     - For each key piece of shared evidence, the chair compiles the panelists' interpretations and how they used it in their update.
     - The chair then looks for:
          a. **Calculation errors**: For example, if a panelist miscomputed a probability or used an incorrect formula.
          b. **Misinterpretation of evidence**: For example, if a panelist drew a conclusion from a piece of evidence that others did not, and that conclusion is objectively incorrect (e.g., misreading a number, misunderstanding a technical term).
          c. **Inconsistent application of heuristics**: If two panelists used the same heuristic (e.g., "this type of project usually has a 10% overrun") but applied it differently to the same evidence.

     - If an error is found, the chair brings it to the panelist's attention and asks for a correction. The panelist may then update their distribution.

     *Judgment call*: The chair must decide what constitutes an "objective error" versus a legitimate difference in interpretation. For example, if two panelists assign different weights to the same piece of evidence, that might not be an error but a difference in judgment. However, if one panelist misread a date, that is an error.

  4. **Test for common prior (Step 3: Check for Prior Consistency)**:
     - The chair asks each panelist to state their prior distribution (for each quantity) that they would have held before seeing the evidence package. This is tricky because panelists might not have formally recorded a prior. Instead, the chair can ask them to reconstruct it by:
          a. Describing their base rate for similar projects (e.g., "I typically expect a 5-15% cost overrun for projects of this type").
          b. Explaining how they updated from that base rate to the posterior given the evidence.
     - The chair then compares the priors. If the priors are substantially different, then the common prior assumption fails. The chair must note this and report that the divergence is due to different starting points.

     *Judgment call*: Deciding what counts as "substantially different" (e.g., using a statistical test for differences in distributions? or subjective judgment?).

     However, note: the common prior assumption is an assumption we are imposing. The procedure is built on the idea that if the priors were common and the updating was correct and all evidence was shared, then posteriors would be the same. So if after steps 2 and 3 we still have disagreement, and we have ruled out private evidence and updating errors, then the only remaining explanation (under the common prior framework) is that the priors were not actually common. But note that step 4 is an attempt to directly check the prior.

     But wait: if we have already pooled all evidence and corrected updating errors, and the priors are common, then posteriors must be the same. Therefore, if we have done steps 2 and 3 and disagreement remains, then either (a) the priors are not common, or (b) there are still updating errors we didn't catch, or (c) there is private evidence we didn't account for, or (d) the common prior assumption is false in a deeper way (e.g., because of differences in model structure).

     Given time constraints, we might not be able to fully resolve. Therefore, we design step 4 as an explicit check.

  5. **Synthesize and report**:
     - If after steps 1-4 the panelists have updated and the distributions are in agreement (e.g., the medians and spreads are close enough by a pre-specified criterion, such as the interquartile ranges overlapping substantially and the medians being within 10% of the mean of medians), then take the average (or the median) of the updated distributions as the consensus.
     - If disagreement remains, the chair must diagnose the reason from the above steps and report:
          a. The existence of private evidence that could not be shared (and which panelists hold it).
          b. The presence of updating errors that could not be resolved (with details).
          c. The divergence in priors (with a summary of the differences).
          d. If none of the above is found, then the chair reports that the reason for disagreement is unexplained under the common prior framework and may be due to unmodeled differences in the updating process (e.g., different mental models) or other factors.

     The report should also include the distributions of the panelists and the areas of disagreement.

  Decision rules for when a test fails:

  - If private evidence is found and shared, then loop back to step 1 (with the updated evidence package) until no new private evidence is introduced. But note: time is limited (one week). So set a limit (e.g., one iteration).
  - If updating errors are found, correct them and then check again for agreement. If time runs out, note the errors and that they were corrected to the extent possible.
  - If priors are found to be different and the disagreement remains, then the chair must report that the consensus distribution is not achievable and present the range of opinions.

  The procedure cannot force consensus. It can only try to remove barriers to consensus under the common prior assumption.

  Concrete Applications:

  Example 1: Disagreement due to unpooled information.
     - Panelist A cites a recent internal report on a similar project that showed a 15% cost overrun due to a specific supplier issue. This report was not in the shared package.
     - Step 2: Chair identifies this as private evidence. The report is shareable (it's internal but not confidential). The chair shares it with the panel.
     - Panelists update. Panelist B had assumed the supplier was reliable and now revises their cost overrun estimate upward. After updating, the distributions converge.

  Example 2: Disagreement due to difference in priors (or weighting of evidence) and the answer is not liked.
     - After sharing all evidence and checking for errors, two panelists (A and B) still disagree on schedule slip. 
     - Step 4: The chair asks for priors. Panelist A's prior for schedule slip is based on projects in temperate climates, and they believe this project (in a tropical climate) is similar. Panelist B's prior is based on tropical projects and they know that monsoons cause delays. The evidence package did not include climate as a factor because it was assumed known. But panelist A did not adjust for climate because they did not consider it a major factor. 
     - The chair concludes that the priors are different: Panelist B has a more relevant prior. However, panelist A is a senior engineer and their prior is also respected. The chair must report that the disagreement is due to different base rates and that the consensus distribution is not achievable. The board will see two very different distributions and the reason.

  Example 3: Cannot distinguish the explanations.
     - Panelists disagree on safety incidents. 
     - Step 2: No private evidence is cited. 
     - Step 3: No updating errors are found. 
     - Step 4: The priors are similar (both base rates around 2 recordable incidents per million hours). 
     - But the posteriors are different: Panelist A predicts 3, Panelist B predicts 5. 
     - Their rationales: 
          Panelist A: "The evidence shows that the contractor has a strong safety record, so I adjusted my base rate downward by 10%."
          Panelist B: "The evidence shows that the contractor has a strong safety record, but this project is in a high-risk environment, so I adjusted my base rate upward by 50%."
     - The chair cannot find an error in either rationale. The difference is in the interpretation of the same evidence (the contractor's safety record in a new environment). 
     - The chair reports that the disagreement is due to a difference in how the evidence was weighted or interpreted, and the reason cannot be traced to private evidence, updating errors, or prior differences. The common prior assumption did not lead to consensus.

  What the procedure cannot do:
     - It cannot prove that the panel shares a common prior. It can only fail to find evidence that they do not. Even if the priors stated in step 4 are similar, they might not be exactly the same, and the updating process might be different in ways we haven't modeled.
     - It cannot force consensus if the panelists have genuinely different beliefs that are rational given their (possibly different) prior experiences and models.
     - It cannot account for all cognitive biases or hidden assumptions in the updating process.

  Final Procedure Outline for the Chair:

  1. **Pre-meeting submission**: Panelists submit their distributions and written rationales (including any private evidence and their updating process) by a deadline (e.g., 3 days after evidence package is sent).

  2. **Step 1: Identify private evidence**:
     - Chair compiles private evidence and decides shareability.
     - If shareable, distribute and ask for updates (one round only due to time).
     - If not, document.

  3. **Step 2: Check for updating errors**:
     - Chair reviews rationales for each key piece of evidence and identifies any clear errors (misreads, miscalculations). 
     - Chair contacts panelists individually to correct errors and get updated distributions.

  4. **Step 3: Check priors**:
     - Chair asks panelists to state their prior distributions and how they updated.
     - Compare priors. If substantially different, document.

  5. **Step 4: Final submissions and consensus**:
     - After steps 1-3, panelists submit final distributions.
     - If distributions are close (by a predefined metric, e.g., the coefficient of variation of the medians < 10% and interquartile ranges overlap by at least 50%), then take the median as consensus.
     - Otherwise, the chair writes a report detailing:
          - Private evidence (if any) and how it was handled.
          - Updating errors found and corrected.
          - Differences in priors.
          - Remaining disagreements and possible reasons.

  Note: The procedure relies on the chair's judgment in several places (shareability, what is an error, what is a substantial difference in priors). The chair must be as neutral as possible.

  Time constraints: One week. So the steps must be done quickly. The chair may need to work with a deputy.

  This procedure is an improvement because it explicitly structures the search for the reasons behind disagreement, which can then be reported to the board. Even if consensus is not reached, the board is better informed.
answer: |-
  Below is a structured quarterly procedure for your expert elicitation panel, designed to audit disagreements under the **common prior assumption** (CPA). The CPA posits that if panelists share the same prior beliefs and update correctly on identical evidence, their posteriors should converge. Divergence is treated as evidence of either **unpooled information** or **incorrect updating**. The procedure prioritizes efficiency (fitting within one week) and simplicity (no formal Bayesian training required). Steps involving chair judgment are marked with **⚖️**.

  ---

  ### **Quarterly Disagreement-Audit Procedure**
  **Inputs**: Individual probability distributions (capital cost overrun, schedule slip, safety incidents) + written rationales from each panelist.  
  **Output**: Consensus distribution or a diagnostic report explaining divergence.  
  **Time Allocation**: 3-4 days for pre-meeting steps; 2-3 hours for consensus meeting.

  #### **Step 0: Pre-Meeting Submission (Day 1-2)**  
    - Panelists submit:  
      - Their distributions (e.g., 5th/50th/95th percentiles).  
      - A **written rationale** listing:  
        (a) Key evidence pieces used (citing the shared package),  
        (b) Explicit reasoning for how evidence shifted their prior to posterior,  
        (c) Any external information not in the shared package.  
    - *Purpose*: Replaces oral defenses with auditable documentation.

  #### **Step 1: Test for Unpooled Information (Chair Review, Day 3)**  
    - **Test**: Cross-check rationales for references to evidence outside the shared package.  
    - **Checklist for Divergence**:  
      - **Private evidence**: Information not shared with all panelists (e.g., anecdotal experience, proprietary data).  
      - **Differential weighting**: Evidence in the package is ignored or undervalued by some.  
    - **Decision Rules**:  
      - If **private evidence** exists:  
        - ⚖️ Chair judges if it is **shareable** (non-confidential, verifiable).  
          - Shareable → Distribute to all panelists; request revised submissions (24hr turnaround).  
          - Unshareable → Flag in final report (e.g., "Panelist A used unverifiable site-specific data").  
      - If **differential weighting** exists → Proceed to Step 2 (it may indicate updating errors).  
      - If none → Proceed to Step 2.  

  #### **Step 2: Test for Incorrect Updating (Chair Review, Day 4)**  
    - **Test**: Compare how panelists interpreted the **same evidence piece** in their rationales.  
    - **Checklist for Divergence**:  
      - **Computational error**: Misapplication of statistics (e.g., wrong distribution type, flawed Monte Carlo setup).  
      - **Cognitive bias**: Overconfidence (narrow intervals), anchoring (ignoring contrary evidence), or base-rate neglect.  
      - **Model divergence**: Different implicit models (e.g., "Schedule risk scales linearly with team size" vs. "exponentially").  
    - **Decision Rules**:  
      - If **computational error** is found:  
        - Chair corrects error (e.g., standardizes distribution type) and requests revised submission.  
      - If **bias/model divergence** exists:  
        - ⚖️ Chair classifies it as either:  
          - **Resolvable**: Bias/model can be aligned via discussion (e.g., panelist agrees they anchored).  
          - **Irreconcilable**: Fundamental difference in mental models (e.g., "Panelist B weights regulatory risk 3× higher").  
        - Resolvable → Resolve in consensus meeting (Step 3).  
        - Irreconcilable → Flag for final report.  
      - If no errors → Proceed to Step 3.  

  #### **Step 3: Consensus Meeting (Day 5, 2-3 Hours)**  
    - **Agenda**:  
      1. Chair summarizes findings from Steps 1-2.  
      2. **Focused debate** on unresolved divergences (e.g., "Why do Panelists A/B disagree on monsoon impacts?").  
      3. **Convergence test**:  
          - Panelists anonymously submit updated distributions post-discussion.  
          - Compute **median and interquartile range (IQR)** of medians for each quantity.  
          - **Convergence criterion**:  
            - If all medians fall within the pooled IQR → Consensus = median distribution.  
            - Else → Proceed to Step 4.  

  #### **Step 4: Final Divergence Diagnosis (Chair Judgment, Post-Meeting)**  
    - **Checklist for Reporting**:  
      | **Cause of Divergence**       | **Diagnostic**                                                                 |  
      |-------------------------------|-------------------------------------------------------------------------------|  
      | Unpooled information          | Private evidence not integrated (shareable/unshareable).                     |  
      | Incorrect updating            | Computational errors or unresolved bias/model divergence.                    |  
      | Violation of CPA              | Divergence persists despite shared evidence and error correction.            |  
    - **Decision Rules**:  
      - If convergence → Deliver consensus distributions.  
      - If divergence → Chair issues a **diagnostic report** to the board:  
        - "Unpooled information" → List evidence gaps.  
        - "Incorrect updating" → Detail errors/biases.  
        - "CPA violation" → State: "Divergence suggests incompatible priors or non-common knowledge."  
      - **Fallback**: If diagnostics are inconclusive → "Divergence source untraceable; use panelist range."  

  ---

  ### **Key Formal Distinctions Simplified**
  - **Retained**:  
    - **Common prior** (CPA): Core assumption; divergence must stem from unpooled info or updating errors.  
    - **Common evidence**: Explicitly tested (Step 1).  
  - **Dropped**:  
    - **Common knowledge of posteriors**: Impractical for humans; approximated via discussion (Step 3).  
    - **Common likelihoods**: Simplified as "correct updating" (Step 2).  

  ---

  ### **Concrete Applications**
  #### **Case 1: Disagreement → Unpooled Information**  
  - **Scenario**: Panelists disagree on capital cost overrun.  
  - **Procedure**:  
    - Step 1: Panelist A cites a supplier's bankruptcy risk (not in evidence package).  
    - Step 2: No updating errors found.  
    - Step 3: Information shared; distributions converge.  
  - **Outcome**: Consensus reached.  

  #### **Case 2: Disagreement → CPA Violation (Answer Unwanted)**  
  - **Scenario**: Panelists disagree on schedule slip; post-audit, divergence remains.  
  - **Procedure**:  
    - Step 1: No private evidence.  
    - Step 2: Updating correct, but Panelist B weights "team experience" 5× more than Panelist C (irreconcilable model difference).  
    - Step 3: Medians outside pooled IQR.  
  - **Outcome**: Diagnostic report: "CPA violation due to incompatible priors (weighting of qualitative factors)." Board sees polarized distributions.  

  #### **Case 3: Disagreement → Inconclusive Diagnosis**  
  - **Scenario**: Panelists disagree on safety incidents; all tests pass but divergence persists.  
  - **Procedure**:  
    - Step 1: No private evidence.  
    - Step 2: No computational errors; rationales coherent but irreconcilable (e.g., "Panelist D is risk-averse; E is risk-neutral").  
    - Step 3: No convergence.  
  - **Outcome**: Report: "Divergence source untraceable; may stem from unobserved priors or non-common knowledge."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Prove a common prior exists**: It only tests for CPA violations (i.e., divergence not explained by unpooled info/updating errors). Absence of violation ≠ proof of shared priors; it may mean flaws were undetected.  
  2. **Eliminate all subjectivity**: Judgment calls (e.g., "shareable evidence," "resolvable bias") rely on chair discretion.  
  3. **Force consensus**: Diagnoses divergence but cannot reconcile deeply held differences.  
  4. **Capture nonlinear interactions**: Assumes causes of divergence are additive (unpooled info OR updating errors), not synergistic.  

  ---

  ### **Implementation Notes**  
  - **Tools**: Use templates for rationales (standardize inputs); software like R/Excel to compute distributions.  
  - **Chair Role**: Must be neutral; focus on process (not content).  
  - **Board Defense**: The diagnostic report provides auditable rationale for divergence, shielding you from "wrong numbers" criticism by showing due diligence.  
  - **Efficiency**: Reuses CPA framework quarterly; scales to 10 panelists via parallel review.  

  This procedure replaces unstructured debate with a transparent audit trail, converting disagreement from a liability to a diagnostic signal. It accepts that consensus is not always possible—but ensures the board knows why.
