prompt: |-
  In several parts of my life I've noticed the same pattern, and I'd like to know whether it has an established name. My daughter was praised for finishing books, and she became an avid reader of short, easy books — not, as far as I can tell, to collect praise, but because finishing itself now feels like the point of reading. A colleague whose performance is measured by closed support tickets has started closing them prematurely, and he genuinely seems to believe that a closed ticket is a resolved ticket; there is no cynicism in it. And a friend training for a marathon by logging weekly mileage now feels that any run her watch fails to record was somehow wasted. In each case someone was given a measurable stand-in for a real goal, came to care about the stand-in itself sincerely rather than strategically, and the gap between stand-in and goal only became visible once circumstances changed. I've heard nearby phenomena discussed under labels like Goodhart's law and reward hacking, but those seem to describe exploiting a measure while still knowing what the real target is, whereas my cases involve honestly internalizing the wrong target. Is there an established concept for exactly this — in psychology, in education, or in the literature on training AI systems — and if so, how does it carve the difference between gaming a proxy and genuinely adopting one? If nothing fits exactly, please say so, coin and define a term, and locate the boundary cases: where, for instance, would my marathon friend fall, given that she may only half-believe the watch matters?
reasoning: |-
  Okay, the user describes a recurring pattern they've observed where people internalize a measurable proxy as the actual goal. They've given examples: their daughter focusing on finishing books for praise, a colleague equating closed support tickets with resolved issues, and a friend feeling runs not recorded by her watch are wasted. The user wants to know if there's an established term for this phenomenon.

  First, I recall Goodhart's Law, which states that when a measure becomes a target, it ceases to be a good measure. But the user mentions that in their cases, people aren't cynically gaming the system; they genuinely believe the proxy is the goal. So Goodhart's Law often involves intentional gaming, but here it's about sincere internalization.

  Next, operationalism comes to mind. This is when a concept is defined by its measurement method. For example, intelligence being equated with IQ test scores. This seems relevant because in the user's examples, the measurement (like finishing books, closing tickets) becomes the actual goal in the person's mind.

  Then there's the Cobra Effect, but that's more about perverse incentives leading to unintended consequences, often through cynical actions. The user's cases lack that cynicism, so it might not fit perfectly.

  I should also consider goal displacement and surrogation. Goal displacement is when an organization prioritizes measurable proxies over the actual mission. Surrogation in management is when employees focus on the surrogate metric instead of the underlying goal. Both concepts relate, but surrogation specifically involves internalizing the surrogate as the real target, which matches the user's description.

  In psychology, the overjustification effect could be related. This is when external rewards reduce intrinsic motivation. In the daughter's case, praise for finishing books might have shifted her focus from reading enjoyment to completion. However, overjustification typically deals with motivation rather than redefining the goal itself.

  The user's friend with the marathon training might be a boundary case since she only half-believes the watch matters. Here, it's a mix of internalization and practical reliance on the tool. It's not full operationalism but shows how repeated use of a metric can blur the line between proxy and goal.

  So, "metric fixation" or "surrogation" seem closest, especially surrogation as defined in management literature. The key distinction is the sincere adoption vs. strategic gaming. The colleague closing tickets genuinely believes closed means resolved, showing deep internalization. The daughter feels finishing is the point of reading, not just for praise.

  The user might also be interested in how this applies to AI training, where proxies are used for complex goals. If an AI optimizes a proxy without understanding the real goal, it could lead to alignment problems. The term "proxy gaming" in AI often implies strategic behavior, whereas "goal misgeneralization" refers to internalizing incorrect objectives.

  In conclusion, "surrogation" best fits the cases where individuals adopt the proxy as the true goal. For boundary cases like the marathon friend, it's partial internalization influenced by habit and tool reliance. The user's deeper need might be understanding how metrics can reshape goals unintentionally, especially in education, work, and personal development, to avoid such pitfalls.
answer: |-
  Your observation captures a profound and well-documented psychological phenomenon with important implications. While no single term perfectly encapsulates *all* nuances you describe, **Operationalism** (specifically **Operational Drift** or **Operational Substitution**) comes closest in psychology and social sciences. In management and behavioral economics, **Surrogation** is a tightly fitting concept. Let's break it down:

  1.  **Core Concept: Operationalism/Surrogation**
      *   **Operationalism (Philosophy/Psychology):** Originally from philosophy of science (Percy Bridgman), it means defining a concept *solely* by the operations (measurements) used to assess it. E.g., "Intelligence is what IQ tests measure." When this mindset drifts into everyday life, people start equating the *measure* with the *underlying construct*.
      *   **Surrogation (Management/Behavioral Econ):** Defined by researchers like Michael Harris and Bill Tayler, surrogation occurs when individuals lose sight of the organization's true goal and focus *exclusively* on the surrogate metric used to track progress towards that goal. Crucially, it involves **sincere internalization** of the surrogate as the goal itself.

  2.  **Why it Fits Your Cases:**
      *   **Internalization, Not Gaming:** Your examples explicitly rule out cynical "reward hacking." Your daughter *feels* finishing is the point of reading. Your colleague *genuinely believes* closed = resolved. Your friend *feels* unrecorded runs are wasted. This is the essence of surrogation/operational drift – the metric *becomes* the target in the person's cognitive framework.
      *   **The Gap Revealed by Change:** As you note, the gap between proxy and goal only becomes problematic or apparent when context changes (e.g., the colleague's premature closures cause problems; the daughter avoids challenging books; the marathoner's unrecorded run feels invalid). This is a hallmark – the metric only fails as a proxy under conditions it wasn't designed for.

  3.  **Distinguishing from Nearby Concepts:**
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** This is the *umbrella principle* under which your phenomenon falls. Goodhart's Law describes the *outcome* (measure distortion). Operational Drift/Surrogation describes the specific *psychological mechanism* (internalization of the proxy) causing that outcome in these cases.
      *   **Reward Hacking / Gaming the System:** This involves *strategic, conscious* manipulation of the metric *while understanding* the true goal is different (e.g., closing a ticket knowing the issue isn't fixed to hit a quota). Your cases involve *sincere belief* that the metric *is* the goal. **Key Difference:** Awareness and intent to deceive.
      *   **Campbell's Law:** Similar to Goodhart's, focused on social indicators becoming corrupted when used for decision-making. Doesn't specify the mechanism (internalization vs. gaming).
      *   **Overjustification Effect:** Focuses on extrinsic rewards *diminishing* intrinsic motivation (e.g., daughter might read *only* for praise, not enjoyment). Your daughter still enjoys reading *short* books, but the *goal* has shifted to finishing. It's related (the reward/praise likely initiated the shift) but distinct: the issue is the redefinition of the goal itself, not just a loss of intrinsic motivation.
      *   **Goal Displacement:** A broader organizational term where the *means* (e.g., measuring tickets) displace the *ends* (customer satisfaction). Surrogation is the micro-level psychological mechanism *causing* goal displacement in individuals.

  4.  **Coining a Term for Precision:**
      If "Operational Drift" or "Surrogation" feel slightly imperfect for the *strictest* interpretation of sincere internalization excluding any gaming, we could coin:
      *   **Metric Internalization Syndrome (MIS):** The cognitive process whereby a measurable proxy (metric) for a complex goal is unconsciously adopted *as* the primary or sole definition of the goal itself, leading to genuine belief and behavior focused on optimizing the metric even when it diverges from the original intent. **Differentiator:** Explicitly emphasizes sincere internalization as the core mechanism, distinct from strategic manipulation.

  5.  **Boundary Cases & Your Marathon Friend:**
      *   **The "Half-Belief" Case (Marathon Friend):** This falls into a gray area, demonstrating the *spectrum* of internalization. She likely exhibits:
          *   **Operational Reliance:** The watch provides concrete feedback and structure, making the abstract goal ("fitness for marathon") tangible. This reliance can *foster* internalization over time.
          *   **Habit/Anchoring:** The recorded run is the established routine; deviations feel "wrong" or incomplete due to disrupted habit, not necessarily a deep belief.
          *   **Partial Surrogation:** She might intellectually know the run counted physically, but *emotionally* or *motivationally*, the lack of a recorded metric diminishes its perceived value or sense of accomplishment. The metric has become an *integral part* of her goal structure ("a *recorded* training run"), not the sole definition ("*only* recorded runs count").
      *   **Where to Draw the Line?**
          *   **Strategic Gaming:** "I know this run helped, but I'm annoyed my stats won't reflect it." (Awareness of the gap, metric is a tool).
          *   **Operational Reliance/Partial Internalization (Boundary - Your Friend):** "That run felt pointless/wasted because my watch died." (Metric is emotionally entangled with goal achievement, but intellectual awareness *might* remain).
          *   **Full Surrogation/Metric Internalization:** "If the watch didn't record it, it didn't happen. It didn't contribute to my training." (Complete cognitive substitution of metric for goal).

  **Conclusion:**

  The established concepts **Operationalism/Operational Drift** (psychology/philosophy) and **Surrogation** (management/behavioral economics) most accurately describe the phenomenon you observed: the *sincere internalization* of a measurable proxy as the goal itself, distinct from cynical gaming.

  *   **Surrogation** is particularly apt for the workplace example (tickets).
  *   **Operational Drift** effectively describes the broader pattern in learning (reading) and personal goals (running).
  *   **Goodhart's Law** explains the *systemic failure* that results from this internalization (or gaming).

  Your marathon friend represents a **boundary case of partial internalization or strong operational reliance**, where the metric has become psychologically essential for goal satisfaction without fully replacing the underlying understanding of the true goal. The key distinction remains: **Gaming exploits a known gap; Surrogation/Operational Drift erases the gap cognitively.** This phenomenon is crucial in education, performance management, and especially AI alignment, where ensuring an AI optimizes the *intended* goal and not just its measurable proxy is a fundamental challenge (sometimes termed the **proxy alignment problem** or **goal misgeneralization**).
