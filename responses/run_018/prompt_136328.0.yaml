answer: |-
  Here's the thought experiment and analysis tailored to your specifications:

  **Scenario:**  
  Hospital Administrator Clara (with 15 years of experience and a reputation for nuanced judgment) and her colleague Ben (a rigid rule-follower) face simultaneous sepsis alerts for two patients. Ben immediately triggers the hospital's mandatory "Code Sepsis" protocol—page the rapid response team, start broad-spectrum antibiotics within 15 minutes—without review. Clara, exercising *phronesis*, notices contextual red flags: Patient A's alert coincides with a recent antibiotic-resistant UTI culture result, while Patient B's chart shows a history of severe anaphylaxis to first-line sepsis drugs. Believing protocol adherence would harm Patient A (delaying targeted treatment) and kill Patient B (via allergic reaction), she pauses to contact the on-call ID specialist for Patient A and the pharmacist for Patient B. Due to understaffing, both calls take 12 minutes. Meanwhile, Ben's patient receives protocol antibiotics at minute 7. **Outcome:** Clara's Patient A deteriorates critically during the delay (unbeknownst to her, the culture result was outdated due to a data sync lag; broad-spectrum antibiotics would have been temporarily effective). Patient B avoids allergy harm but suffers milder delay-related complications. Ben's patient recovers fully. Clara's interventions—optimally prudent in 95% of contexts—caused greater net harm due to *time compression* + *hidden data corruption*.

  ---

  **Analysis: The Killer Feature & Verdicts**  
  **The Structural Linchpin:** *Time pressure interacting with invisible information asymmetry*. Clara's deliberation (normally virtue-enhancing) consumed irreplaceable minutes while hidden institutional flaws (outdated data, slow specialist response) sabotaged her contextual analysis. Ben's blind protocol execution accidentally bypassed these flaws because the protocol ignored complexities. Remove **either** the time pressure (allowing Clara to verify data/secure help) **or** the invisible data corruption (making her judgment accurate), and the case collapses into mundane bad luck or error. The institutional structure weaponized her virtue.

  **Virtue Ethics Verdict (Damage Control):**  
  1. **Moral Luck:** Clara exhibited correct *phronesis*; the harm stems from epistemically unlucky circumstances (undetectable data lag) beyond her control. Aristotle acknowledges fortune affects outcomes (*NE* 1099b).  
  2. **Meta-Virtue Rebuttal:** True *phronesis* includes knowing when institutions are too corrupt for nuanced judgment. Clara should have recognized systematic understaffing/data issues make protocol-deviation lethally risky here—thus, her practical wisdom was *incomplete*, not virtuous. The vice lies in the institution, not her.  

  **Situationist Verdict (The Attack):**  
  1. **Character as Post-Hoc Fiction:** Attributing Ben's success to "rule-following character" or Clara's failure to "flawed wisdom" is narrative fallacy. Identical outcomes could occur if roles were reversed with different situational triggers (e.g., Ben getting the outdated chart). The *situation* (time pressure + hidden data flaw) caused the differential outcome—not stable traits.  
  2. **Fragility of Virtue:** This shows virtues aren't robust traits but context-dependent behaviors. Clara's "practical wisdom" only functions in hospitable environments. Under institutional stress, it becomes maladaptive. Doris argues this fragility makes virtue attributions empirically empty—we're praising/punishing situational luck, not character.  

  **Why This Isn’t a Strawman:**  
  It avoids attacking a "naive" virtue ethicist by making Clara’s deliberation *genuinely superior* in normal contexts and her error *traceable to institutional dysfunction*, not ignorance or vice. The harm emerges precisely because she *correctly* weighed relevant particulars—which the situation rendered lethal. This forces virtue ethics to confront how *phronesis* can be structurally undermined, not just incorrectly applied.  

  **The Tension:**  
  The virtue ethicist must either (a) concede *phronesis* can be *objectively optimal* yet *practically disastrous* in broken systems (undermining virtue’s practical reliability), or (b) stretch "meta-wisdom" to cover institutional critique (risking ad hoc demands on the virtuous agent). The situationist seizes this to argue: if virtue requires impossibly perfect situational diagnosis, it’s explanatorily useless.
