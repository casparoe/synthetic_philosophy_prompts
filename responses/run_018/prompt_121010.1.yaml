     2. If a student moves (beyond the allowed minimum), they get a Restlessness Token (worth -3 points at the end of the round). The facilitator (and TA if available) will silently place a token in front of the student.

     3. To play an Action Card, a student must raise their hand and clearly state the card's name (e.g., "I play Joy"). This counts as movement (so they get one token automatically). Then, for 10 seconds after the play, if any other student moves or makes a sound, the playing student and the reacting student each get an additional token.

     4. At the end of the round, students calculate their points for the round:
