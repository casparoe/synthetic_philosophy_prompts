            Playing a card -> positive experience -> but it introduced restlessness (tokens) and often led to a net loss, and also disturbed others.

     What the activity can't capture:
       - The inner craving: We only penalized outward movement. But tranquilism is about the inner state of craving. You might have felt the desire to move or play a card even if you didn't — that inner turmoil is suffering too. We have to supply that by discussing how the game is a metaphor: the tokens represent the visible manifestation, but the real issue is the inner striving.

     Heads-up on what might go wrong the first time:
