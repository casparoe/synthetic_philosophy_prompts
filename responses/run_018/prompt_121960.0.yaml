  *scribbles* Must emphasize: Pareto violations in the book case aren't mere inefficiency but ethical contradictions. When Lewd/Prude are forced into outcomes against their deepest values, it's different from scientists getting suboptimal datasets. The former attacks liberalism's foundations; the latter just needs better coordination protocols.

