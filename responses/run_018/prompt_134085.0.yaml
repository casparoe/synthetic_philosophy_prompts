answer: |-
  Here’s a structured seminar plan focusing on **common notions** as the backbone of Spinoza’s democratic argument, sequenced for clarity and misconception interception:

  ---

  ### **Seminar Plan: Spinoza’s Democracy & Common Notions (50 mins)**  
  **Core Sequence:** Potentia → Social Contract Critique → Common Notions → Democracy  
  *Why this order?* Spinoza’s politics rests on his metaphysics of power. Without establishing *potentia* first, the critique of social contracts (and the superiority of democracy) lacks ontological grounding.

  ---

  ### **1. Foundation: Power (*Potentia*) & Human Nature (10 mins)**  
  - **Start with *Ethics* Recap:**  
    - *Conatus* (E3P6): All beings strive to preserve/expand their power (*potentia*).  
    - *Right as Power* (TP Ch.2): "Natural right" = capacity to act. Humans have no transcendent duty to obey rulers; power defines right.  
  - **Key Point:** *Collective power* emerges when individual *potentiae* align (e.g., TP 3.2).  
  - **Misconception Interception:**  
    > *"Spinoza is a Hobbesian realist."*  
    → Clarify: Unlike Hobbes, *potentia* is *not* inherently competitive. Power grows through rational cooperation (E4P35-37).

  ---

  ### **2. Critique of Social Contract (8 mins)**  
  - **Problem:** Contracts rely on *transcendent* promises (TP 3.8).  
    - Humans break contracts when self-interest > fear of punishment.  
    - Authority must emerge *immanently* from human power dynamics, not abstract oaths.  
  - **Why after *Potentia*?**  
    The critique only makes sense if students grasp that power (*potentia*), not consent, is the basis of politics.  

  ---

  ### **3. Common Notions (*Notiones Communes*) as Political Glue (12 mins)**  
  - **From *Ethics* to Politics:**  
    - Common notions = ideas of what bodies/minds share (E2P38-39). E.g., "extension" or "laws of motion."  
    - *Politically:* Shared interests (survival, security) are common notions.  
  - **Mechanism:**  
    Common notions enable individuals to form a *collective body* (TP 2.15-16). The state’s power (*imperium*) is the pooled *potentia* of citizens united by shared ideas.  
  - **Misconception Interception:**  
    > *"Democracy requires unanimous rational agreement."*  
    → Correct: Common notions are *pre-rational* (e.g., "safety is good"). Democracy aggregates *imperfect* perspectives (TP 9.14), not demands perfect reason.

  ---

  ### **4. Democracy’s Superiority: The Navigation Example (12 mins)**  
  - **Concrete Example: Steering a Ship**  
    - *Monarchy:* One captain decides alone.  
      → Risk: Ignorance of local conditions (e.g., reefs, currents).  
    - *Democracy:* Crew members pool observations ("common notions" of wind, depth, obstacles).  
      → Outcome: Collective knowledge corrects individual errors → ship avoids disaster.  
  - **Why Not the Dutch Republic?**  
    Dutch history invites debates about oligarchy/religious strife. The *ship* example isolates Spinoza’s *mechanism*: democracy’s structural advantage in aggregating knowledge via common notions (TP 9.14).  
  - **Key Quote:**  
    > "Men […] have nothing more excellent […] than to live in harmony" (TP 6.4).  
    → Harmony emerges from *complementary* *potentiae*, not uniformity.

  ---

  ### **5. Misconception Interception: Direct Democracy? (3 mins)**  
  - **Likely Assumption:** *"Spinoza advocates direct democracy."*  
  - **Correct:** He praises *representative* democracy (TP 11.1-2).  
    - Large states need delegates. Democracy’s essence is *institutional*: structures enabling power-pooling via common notions (e.g., open debate, accountability).

  ---

  ### **6. Diagnostic Question (5 mins)**  
  > **"If a democracy collapses into civil war, how would Spinoza explain this *not* as a failure of democracy itself, but as a breakdown in common notions?"**  
  - **Target Answer:**  
    Conflict arises when shared ideas (e.g., "mutual benefit") fracture → collective *potentia* fragments. Democracy’s stability relies on reinforcing common notions through *institutions* (laws, assembly debates), not moral consensus.  
  - **Red Flag Response:**  
    "Democracy failed because people were irrational." (Misses *structural* role of common notions).

  ---

  ### **Why This Sequence Works**  
  1. **Metaphysics first** (*potentia*) → Provides causal framework.  
  2. **Social contract critique second** → Exposes need for immanent politics.  
  3. **Common notions third** → Bridges metaphysics to collective power.  
  4. **Democracy last** → Revealed as optimal *mechanism* for sustaining power via common notions.  

  Key insight: **Democracy isn’t "just" — it’s the system best equipped to harness the epistemic and power-aggregating function of common notions.**
