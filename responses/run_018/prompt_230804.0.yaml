  First, I need to unpack the key AI concepts mentioned: outer/inner alignment, training/deployment split, learned goals, and misgeneralization. The user wants these mapped to elements like character desire, scene rewards, backstory, and theme. 

  For outer/inner alignment, I consider how an author's intended theme (outer objective) might differ from what the narrative structure actually rewards (inner goal). Like when a story claims to value honesty but constantly rewards clever lies in its scenes. 

  The training/deployment split feels analogous to backstory versus present narrative circumstances. A character learns behaviors in their past (training distribution) that fail when facing new situations (deployment). Like a soldier whose battlefield survival tactics backfire in civilian life.

  The scariest part - competent pursuit of wrong goals - maps neatly to tragic characters who efficiently destroy themselves while believing they're doing right. Think of Macbeth's unchecked ambition.

  But I notice two points where the analogy strains:
  1. Humans have innate drives AI lacks (hunger, social needs) that complicate the "learned goal" simplicity
  2. Narrative irony relies on audience understanding something the character doesn't - whereas misaligned AI has no hidden awareness

  The residue suggests AI alignment theory deals with optimization pressures that don't perfectly mirror human psychology. Still, for novelistic purposes, the "character as misaligned optimizer" intuition holds surprising power - especially for creating dangerously competent antagonists who perfectly execute flawed philosophies.
