  For the prose flow, I imagine walking a hypothetical student through each decision point with natural language connectors like "if" and "then". At each leaf, I'll need to either name an existing position (like Hofstadter's strange loops) or diagnose why that combination remains unnamed. If two positions land in the same leaf, I must explicitly note that overlap rather than merging them.

