prompt: |-
  I'm advising a borough council that is revising its noise ordinance. They need a legal boundary between permitted 'music' and prohibited 'noise' for street-performance permits, but every essential criterion I propose — melody, rhythm, intentional performance, use of instruments — is undermined by edge cases: an algorithm generating sustained harmonic drones, a political chant accompanied only by percussion, a silent disco where participants wear headphones, and a therapeutic sound bath using singing bowls. My colleagues insist I should simply tighten the definitions, yet I feel the difficulty is not legal drafting but something deeper about the concept itself. Is there a principled philosophical explanation for why 'music' resists precise definition, and how should I counsel the council to write a workable rule without imposing false precision? Please answer in British English.
