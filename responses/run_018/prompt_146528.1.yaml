  The dimensional vs categorical language clash (ii/iii) is practically solvable. Clinicians already do this - using spectra for research while saying "depression" to patients. The key is recognising that utility in crisis doesn't validate categories ontologically. 

  The prevalence rates problem (iv) is fascinating - it doesn't kill (v) but demands we specify what aspect is stable (say, psychosis-proneness) versus what's looped (DSM-coded symptoms). Like how "melancholia" and "major depression" measure overlapping but distinct constructs. 

  Noticing they're subtly privileging schizophrenia's biological stability while seeing personality disorders as more constructed. That's defensible but they should flag it explicitly - perhaps with a footnote about trauma's role in PDs blurring the nature/nurture line. 

  Their pragmatism shines through - especially keeping crisis communication simple (iii). That's clinically wise. The cheapest fixes would be: 
