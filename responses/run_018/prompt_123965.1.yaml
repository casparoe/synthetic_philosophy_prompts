  First, they mention Aquinas's distinction between deposition by the people and private assassination. The user is trying to pinpoint where Aquinas draws the line and whether the collective aspect is inherent or a modern interpretation. I need to recall specific sections from *De Regno* and the *Summa Theologiae*. 

  Aquinas does talk about the people granting power conditionally. The key here is the origin of authority. If the ruler's power comes from the people, they retain the right to revoke it. But Aquinas is cautious about resistance due to the risks of sedition. The user is right to note the rejection of individual action—only public, authorized acts are legitimate. 

  The user’s main confusion is about "the people" as a corporate agent. Aquinas uses terms like "public authority" and "multitude," which imply a collective body. But does he mean a structured entity or just the sum of individuals? Looking at his examples, like the Roman Senate deposing emperors, it's clear he envisions an institutional process. The people act through representatives or established mechanisms, not mob action. 

  Also, the user might be projecting modern concepts of collective intentionality. Aquinas's framework is medieval, grounded in natural law and the common good. The people’s role is functional: to uphold the community’s welfare. Their authority isn't a continuous entity but reactivates only when the ruler fails. 

  Another angle: Aquinas’s emphasis on due process. He insists on judgment and public action, contrasting it with private violence. This procedural element supports the idea of a corporate body—only an organized community can hold a trial or depose a ruler lawfully. 

  The user’s deeper need might be understanding medieval political philosophy's relevance today. They might be linking Aquinas to concepts like popular sovereignty or just rebellion. Clarifying his historical context helps avoid anachronism. Aquinas isn’t endorsing democracy but a conditional authority where the people’s role is corrective, not governing. 

  In summary, Aquinas sees the people as a collective with latent authority, exercised through structured means for the common good. The corporate aspect is implicit in his medieval communal thinking, distinct from modern individualism. The user’s interpretation isn’t off, but needs grounding in Aquinas’s societal framework rather than contemporary philosophy.
answer: |-
  You've identified the exact tensions in Aquinas' thought! Let's break down his key distinctions on authority and resistance, focusing on *De Regno* (On Kingship) and relevant sections of the *Summa Theologiae* (especially I-II, Q.90-97 & II-II, Q.42, Q.104), to clarify the role of "the people" and the nature of resistance.

  **Core Brainstorm: Aquinas' Key Distinctions on Authority & Resistance**

  1.  **Origin of Authority:**
      *   **Divine Source (Ultimate):** All just authority originates from God, the source of natural law and the common good.
      *   **Human Instrument (Proximate):** Authority is *conferred* by human means. This is where "the people" come in. For Aquinas, political authority exists for the *common good* (bonum commune). Who is best positioned to designate who should serve that good? The community itself.
  2.  **The People's Role (Conditional Grant):**
      *   Aquinas argues that if a ruler's authority was originally *conferred* by the people ("multitude"), then the people retain a latent, residual power. They granted authority *conditionally* – on the ruler governing justly for the common good.
      *   **This is NOT modern popular sovereignty.** The people aren't the *continuous* source of authority in a democratic sense. They are the *initial* source of designation, holding a *residual corrective power* if the grantee fundamentally violates the terms.
  3.  **Tyranny vs. Mere Injustice:**
      *   Resistance isn't justified for every failing. Aquinas distinguishes ordinary misrule or injustice from full-blown **tyranny**. Tyranny involves the ruler subverting the law and ruling *primarily for his own private advantage* rather than the common good, often through fear and oppression.
  4.  **The Absolute Prohibition on Private Assassination:**
      *   Aquinas explicitly and forcefully rejects the idea that a *private individual* can licitly kill a tyrant (`De Regno` Ch. 6, `Summa` II-II Q.64 A.3). Why?
          *   Only public authority has the right to inflict capital punishment.
          *   Private action bypasses judgment and due process.
          *   It invites chaos, vendettas, and often replaces one tyrant with another (or worse).
          *   It usurps the authority belonging to the community or its representatives.
  5.  **The Permissibility (with Caveats) of Public Deposition:**
      *   If authority originated from the people, and the ruler becomes a *tyrant*, then the *people* (or a superior authority like the Pope in Christian realms, per Aquinas' view of hierarchy) have the *right* to depose him.
      *   **Crucially, this must be a PUBLIC ACT.** It requires:
          *   **Judgment:** A determination that tyranny exists.
          *   **Authorization:** Action undertaken by or with the sanction of the legitimate residual authority holder – the *people collectively*.
          *   **Due Process (Ideal):** Ideally, through established mechanisms or representatives (e.g., nobles, magistrates, a council acting *for* the people).
      *   **The Sedition Warning:** Aquinas is deeply cautious (`De Regno` Ch. 6). Deposition is a last resort. The evils of tyranny must *clearly outweigh* the predictable evils of rebellion – civil war, chaos, potential foreign invasion, the breakdown of all order. He fears sedition (unjust revolt) more than enduring a moderate tyrant for a time.

  **Your Core Question: "The People" as Corporate Agent vs. Aggregate of Individuals?**

  This is where your insight is sharp. Aquinas' language strongly implies a **corporate or collective understanding of "the people"** in this context, not merely an aggregate of private judgments. Here's the evidence and reasoning:

  1.  **"Retained Power" Language:** When Aquinas says the people "retain" the power to depose if authority was granted by them, he speaks of a power inherent in the *community as a whole*, not in individuals. This "retained power" is a latent aspect of the *original corporate act* of granting authority.
  2.  **Contrast with Private Action:** The absolute prohibition on *private* tyrannicide only makes sense if the *legitimate* alternative is something *other* than private action. That alternative is explicitly framed as *public* action, implying an agent capable of acting publicly – the corporate body.
  3.  **The Need for Judgment & Authorization:** Aquinas insists deposition requires *judgment* and *authorization*. Judgment implies deliberation and decision-making, processes inherently collective or representative. Authorization implies a source of legitimacy distinct from individual whim – the corporate will.
  4.  **The Common Good as the Telos:** Political authority exists for the *common good*, a concept inherently supra-individual. Resistance against a tyrant is justified *only* to restore governance for the common good. The agent acting against the tyrant must, therefore, be capable of acting *for* that common good – which, in the absence of a legitimate ruler, logically falls back to the *community as a corporate entity*.
  5.  **Medieval Context:** Aquinas operated within a feudal and corporatist framework. Society was understood as a body (the "body politic") composed of ordered parts (estates, guilds, communes, the universitas). "The people" (populus, multitude) was often conceptualized as a corporate entity capable of acting through representatives (like nobles, elected officials in communes, or councils) even if not democratically. He likely had models like the Roman Senate (acting for the Roman people) or medieval estates in mind.
  6.  **Shared Intentionality (Implicitly):** While Aquinas doesn't use modern terms like "shared intentional stance," his argument requires it. For the "people" to retain power, judge tyranny, authorize deposition, and act publicly, there must be a shared understanding of the common good, a shared recognition of the ruler's failure, and a shared (or representatively channeled) will to act. This is collective intentionality in practice, even if not theorized as such.

  **Where the Line is Drawn: Who Can Act?**

  1.  **Cannot Act:** *Any private individual* acting on their own initiative to kill or overthrow the ruler. This is always tyrannicide/sedition.
  2.  **Can Act (Conditionally):**
      *   **The People as a Corporate Body:** Ideally acting through their established representatives, magistrates, or leaders (like nobles or elected officials in a commune) who possess the *public authority* to judge and depose in the name of the community. Aquinas references historical examples like the Roman Senate deposing emperors.
      *   **A Recognized Superior Authority:** For Aquinas (especially in Christian contexts), this could be the Pope or Emperor, seen as having jurisdiction over lesser kings and princes to correct tyranny for the sake of the common good and divine law. (`De Regno` Ch. 6 explicitly mentions recourse to a higher authority if possible).
      *   **Collective Action (as a Last Resort):** If no representatives or superior authority exist or can act, Aquinas implies the *community itself* must act collectively. However, he is deeply uncomfortable with this, fearing it easily descends into destructive mob violence rather than ordered judgment. The emphasis remains on it being a *public act for the common good*, not a private vendetta multiplied.

  **Conclusion: Collective Agency is Essential to Aquinas' Argument**

  You are **not** simply projecting modern ideas. While Aquinas doesn't provide a fully developed theory of corporate personality or shared intentionality using those terms, his argument for legitimate resistance **fundamentally depends** on understanding "the people" as a corporate entity capable of:

  *   Originally granting authority conditionally.
  *   Retaining a residual corporate power derived from that original grant.
  *   Judging the ruler's failure collectively (through mechanisms or representatives).
  *   Authorizing public action (deposition) in the name of the community and the common good.

  The stark prohibition on private action highlights that the legitimate power to resist flows *only* from this corporate capacity of the people or its designated agents/superiors. His medieval context provided the implicit framework for this corporatist understanding. So, yes, the "retained power" is a corporate power, and resistance is legitimate only when it is an act *of* that corporate body (or its representatives/superiors) *for* the corporate good. Individual private judgment alone is insufficient and illegitimate grounds for violent action.
