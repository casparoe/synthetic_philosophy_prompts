  Hey, you're like a historian of medieval political philosophy, right? I need you to think carefully about this. Before you answer, maybe brainstrom the key distinctions Aquinas makes about authority and resistance.

  So I'm reading this part from Aquinas's treatise on kingship — I think it's around the middle chapters — where he talks about what to do if a ruler becomes a tyrant. He says something like: if the ruler originally got his authority from the people and then abuses it, the people have a right to depose him, but they shouldn't rush into it because sedition usually causes more harm than putting up with tyranny. He also seems to draw a line between private individuals killing the guy (which he rejects) and some kind of public or collective action to remove him.

  I'm trying to understand exactly where the line is, but I'm also wondering if I'm reading something into the text. Specifically, Aquinas talks about 'the people' retaining a kind of original power — does that mean he's treating the people as a corporate agent, like they have a shared intentional stance that authorizes resistance? Or is he just saying each individual privately judges it's okay? I'm not sure if that collective-intentionality framing is in the passage or if I'm projecting modern philosophy onto it. Can you help me parse what he actually says about who exactly can act, and whether the reasoning depends on the people being a unified body with thier retained authority?
