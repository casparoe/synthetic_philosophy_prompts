   Bradley's core argument (as described):
     - We have two terms, a and b, and a relation R that relates them: R(a, b).
     - But now, how is R related to a and to b? We require a new relation R' to relate R to a and to b. This leads to an infinite regress: R', then R'', etc.
     - The conclusion is that relations cannot genuinely unify terms; instead, judgment must be a single, non-relational experience (the Absolute) in which subject and predicate are distinguished but not externally connected.

   Category theory vocabulary allowed: objects, morphisms, composition, identity, associativity, universal properties.

   Translation attempt:

   Let's model the situation in a category C.

   Step 1: Represent the terms a and b as objects in C. Let A and B be objects.

   Step 2: The relation R is a morphism. But note: Bradley's relation R is between two terms. So we can think of R as a morphism from A to B? However, note that Bradley's relation is symmetric in the sense that it connects two terms, but in category theory, morphisms have direction. Alternatively, we might think of R as a span or a cospan? But let's try a simpler approach.

   Alternatively, we can think of the fact that a and b are related by R as a ternary relation. However, category theory is built on binary morphisms. Another idea: we can model R as an object itself, and then we need morphisms to connect R to A and to B. This leads to the idea of a diagram:

     A <-- f -- R -- g --> B

   But note: in Bradley's argument, R is a relation that holds between A and B. So we might require that the pair (f, g) is a relation from A to B. However, in category theory, we usually model a relation from A to B as a subobject of A × B (if the category has products). But we don't necessarily have products? We are to use only basic category theory.

   Let's try without products. We have:

     Object R (the relation) and morphisms f: R -> A and g: R -> B.

   But now, Bradley asks: how is R related to A and B? We have the morphisms f and g, but then we must explain how f relates R to A and how g relates R to B. This leads to the same problem: we now need relations between R and A (for f) and between R and B (for g). So we introduce new relations R' and R''? 

   Specifically, for f: R -> A, we now need a new relation object R_f and morphisms:
     h1: R_f -> R
     h2: R_f -> A
   and similarly for g: R -> B, we get R_g and morphisms:
     k1: R_g -> R
     k2: R_g -> B

   And so on, ad infinitum.

   This is the regress.

   Step 3: Bradley's solution: the entire situation must be a single, non-relational experience. In category theory, we might try to capture this by a universal object that encompasses everything. The Absolute might be modeled as a terminal object (if we think of it as a unique encompassing object to which every object has exactly one morphism) or an initial object? But note: Bradley's Absolute is not an object among others; it is the whole in which the distinctions are internal.

   Alternatively, we might think of the entire diagram as being absorbed into a colimit. Specifically, the infinite regress might be seen as a diagram that we want to take the colimit of. However, in the colimit, we would have a new object and morphisms from all the intermediate objects, but the relations (morphisms) would still be present.

