   However, note that the regress is infinite. We can form an infinite chain:

     ... -> R^{(n)} -> ... -> R'' -> R' -> R

   and we also have the objects A and B. Then we might take the limit of this diagram. But what would that limit be? It might be an object L with morphisms from L to every object in the diagram, but that doesn't remove the relations; it just gives a universal cone.

   But Bradley's Absolute is not about having a universal cone; it is about having a unified whole that is not composed of relations. So we are stretching.

