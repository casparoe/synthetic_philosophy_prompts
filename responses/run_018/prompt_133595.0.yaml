answer: |-
  That's a sharp observation and a core methodological critique of *some* microhistory (and similar approaches like biography-as-history). You've pinpointed a significant tension. While there isn't one universally agreed-upon, single-word term, several phrases and concepts capture the essence of this "move":

  1.  **The "Representative Outlier" Paradox:** This directly names the contradiction you describe. The historian argues the case is *both* uniquely documented *because* it's strange (outlier) *and* reveals something fundamental about the typical (representative).
  2.  **The "Exceptional Typicality" Tactic:** Similar to above, highlighting the claim that the *exceptional* nature of the record grants access to the *typical* mental world.
  3.  **Ginzburgian Dilemma (or Ginzburg Problem):** Named after Carlo Ginzburg, whose *The Cheese and the Worms* (about the miller Menocchio) is the archetype for this move. Historians often reference this as the "Ginzburg problem" when discussing the methodology. It acknowledges the brilliance while flagging the risk.
  4.  **The "Documentary Filter Fallacy":** This emphasizes the core issue: confusing what the documentary *filter* (e.g., the Inquisition targeting deviation) reveals with the underlying reality it purports to document. The filter creates the sample, which is inherently non-random and skewed towards the deviant.
  5.  **The "Archival Mirage":** Slightly more poetic, suggesting the vividness and detail of the exceptional case create an illusion of representativeness that obscures the silent, undocumented majority.
  6.  **"Over-Extrapolation from the Deviant Case":** A more straightforward description of the logical error.

  **Where It Goes Wrong (The Core Problems):**

  1.  **Ignoring the Selection Mechanism:** The *primary reason* we have the record is the subject's deviation. While the historian might *admit* the subject is an outlier, they often fail to rigorously account for *how profoundly* the selection mechanism (persecution for heresy, witchcraft, crime, unusual literacy) distorts the sample and what conclusions can be drawn. Just acknowledging the outlier status isn't enough; the methodology must demonstrate *how* this specific deviation still illuminates the norm *despite* the filter.
  2.  **Conflating Access with Representativeness:** The detailed record provides *unprecedented access* to *one* individual's mental world. This is immensely valuable. The mistake is assuming this detailed access automatically equates to *representativeness* of a broader group's mentality. Vividness ≠ typicality.
  3.  **Underestimating the "Silent Majority":** The method inherently privileges the voices that were loud, strange, or threatening enough to be recorded by authorities. It risks marginalizing the truly mundane, conformist, or privately held beliefs of the vast majority who avoided such attention. We learn about what triggered the authorities, not necessarily the internal landscape of the average person.
  4.  **The Lure of Narrative:** The bizarre case is inherently more narratively compelling than evidence of conformity. There's a temptation to let this compelling story carry more explanatory weight about the "ordinary" than it logically should.
  5.  **Epistemological Overreach:** It risks claiming knowledge about the "typical peasant mentality" based on evidence intrinsically linked to *atypicality*. The leap from "this is what one deviant peasant thought, influenced by elements of his culture" to "this reveals the structure of ordinary peasant mentalities" is often too great without significant additional evidence or theoretical justification.

  **The Counter-Argument & Nuance:**

  Proponents of this microhistorical approach argue:

  *   **The "Normal" Revealed Through the "Abnormal":** Deviants often articulate beliefs or utilize cultural materials (folklore, religion, oral tradition) shared by the community, but in ways that make the implicit explicit or expose hidden tensions. The "weirdness" might lie in the combination, intensity, or public declaration, not necessarily every component part.
  *   **Testing the Boundaries:** Studying the deviant helps define the boundaries of the "normal" and the limits of what was culturally permissible or conceivable at the time.
  *   **Accessing the Otherwise Inaccessible:** For truly marginalized groups (like illiterate peasants), these *might* be the *only* detailed records offering *any* glimpse into their mental world, however filtered. The choice might be between using the deviant case carefully or having nothing substantial to say.

  **Conclusion:**

  You're right to be critical of this move. While brilliantly illuminating when done with extreme methodological caution and clear limitations, it often involves a **logical over-extension** or **epistemological slippage**. The most precise descriptors are likely **"the Representative Outlier Paradox"** or **"the Ginzburgian Dilemma"** (acknowledging its most famous practitioner). Where it goes wrong fundamentally is in **underestimating the distorting power of the archival filter that created the source and conflating the vividness of a deviant case with evidence of its representativeness for the "ordinary" mental world.** It requires constant vigilance against the temptation to let an extraordinary story stand in for the ordinary experience it may only tangentially reflect. Good practitioners of this method spend significant effort contextualizing the outlier and arguing *specifically* for which aspects *might* be indicative of broader trends, based on other evidence or theoretical frameworks.
