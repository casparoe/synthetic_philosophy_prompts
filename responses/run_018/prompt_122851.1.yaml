prompt: |-
  You are a professional philosopher with research-level command of formal epistemology, decision theory, and the early twentieth-century debates about probability, risk and uncertainty. Please work carefully and in the following order: first spend some time quietly brainstorming candidate concepts — drawing on economics and statistics and psychology as well as philosophy — then eliminate the ones that don't fit, saying in a line or two why each was rejected, and only then settle on your answer. I have no library access and cannot chase anything up, so please give me no reading lists, bibliographies or citations: I want the conceptual work done in your own words, not pointers to where it might be found.

  I am looking for the established name, if there is one, for something I keep noticing — and more than the name, I want the carving: what exactly the phenomenon consists in, what it is not, which nearby notions it gets confused with, and where its edges are. A bare label would not help me; I have a use for the distinction and I need to know how far it extends.

  Three instances. Two clinicians, working independently, both put the probability that a patient's symptoms are caused by condition X at sixty per cent. One has seen several hundred such patients and worked through the same panel of tests many times; the other has seen five, has read two case reports, and is going largely on a resemblance to a case she once saw. Both are competent, both say sixty per cent. The first acts on it without fuss. The second is uneasy: at identical numbers, identical stakes and identical payoffs, she prefers the less invasive option even though on her own figures the invasive one is better for the patient. Second instance: an investor sizes two positions identically on the numbers — same probability of gain, same upside, same downside — but stakes less on the one resting on a single conversation with a supplier than on the one resting on twenty years of comparable data, and this is not the stake-size difference you get from risk aversion, since the payoff distributions are the same. Third instance: a committee is told by two advisers that there is a seventy per cent chance a structure will fail within the decade; one adviser has a thousand inspection records, the other a model and three inspections; the committee treats the two seventy per cents very differently.

  What makes this hard, for me, is that the difference survives every explanation I have tried. Stipulate that no further evidence can arrive before the decision is made, that neither agent will ever learn whether she was right, and that no one is watching: the difference in willingness to act persists. So it does not look like the value of information, or reputation, or options on future learning. It is also not that the agents have different probabilities — they agree — and it is not that they cannot state a probability.

  There is a second thing I associate with it, and I am not sure whether it is the same thing or a companion. The thin sixty per cent is fragile: one further test result moves it to thirty, while the same result moves the substantial sixty per cent to fifty-five. Equal probabilities respond differently to identical news.

  Some things I half-remember that may or may not be the same animal: a case about two urns, one of known composition and one of unknown, where people prefer to bet on the known one even though the odds come out the same; cases where people refuse to give a number at all and offer a range instead, or say only *somewhere above half*; and a well-known finding in psychology to the effect that confidence tracks how coherent a story the evidence supports rather than how much evidence there is. If any of these is what I am describing, I would like to be told plainly, and told in what respects the fit is exact and in what respects loose.

  Boundary cases I cannot settle on my own. Two agents with the same probability and the same bulk of evidence, where one's evidence is varied — independent sources, different methods, some of it pointing the other way — and the other's is bulky but redundant, all traceable to a single measurement or a shared assumption: my instinct is that the second is in the same position as the thin-evidence clinician, but is that the same dimension or a second one? Symmetrically, evidence that is plentiful but pulls both ways: does that count as a substantial basis or not? And is this property even the sort of thing that admits of more and less in general, or only in some cases?

  Finally, the question I most want answered rather than ducked: is the difference I am describing rationally decision-relevant at all, or is it, on a standard Bayesian view of credence and expected utility, mere noise — a feeling a well-trained agent should be rid of? If there is a serious tradition holding that it matters for action and not merely for the description of belief, say what it would have to claim.

  If the phenomenon has an established name, give it, define it, and mark its borders against each of its nearest neighbours. If it fits nothing established, or fits several things only partly, say so, and coin a term with a definition, a statement of what it excludes, and a note on whether the two components I describe — the reluctance to act at equal probability and the fragility under new evidence — are one thing or two.
reasoning: |-
  Hmm, this is a fascinating and deeply technical query about a subtle distinction in probabilistic reasoning. The user clearly has sophisticated familiarity with formal epistemology and decision theory, given how precisely they've framed the problem. They're describing cases where identical probability assessments lead to different actions based on the robustness of the evidence behind those assessments.

  Let me approach this systematically as requested. First brainstorming candidate concepts:

  - Epistemic confidence (too vague)
  - Ambiguity aversion (Ellsberg paradox - close but not identical)
  - Credence resilience (describes fragility but not action reluctance)
  - Evidential weight (Keynes' concept - promising!)
  - Second-order probability (meta-uncertainty)
  - Calibration confidence (psychology concept)
  - Robustness to counterevidence
  - Evidential diversity

  Eliminating poor fits:
  Epistemic confidence is too broad - it could include calibration issues. Ambiguity aversion specifically applies when probabilities can't be quantified, which isn't the case here. Second-order probabilities would require assigning probabilities to probabilities, which these agents aren't doing. Calibration confidence relates to past performance, not current evidence quality.

  Keynes' "weight of evidence" seems closest - it distinguishes between the probability value and the sufficiency of evidence supporting it. But does it explain the action reluctance? The Ellsberg paradox shows similar behavior, but in Ellsberg the probabilities are undefined, whereas here they're precisely given.

  The fragility aspect is crucial - this suggests what I'd call "evidential resilience." But is this one unified concept or two? The reluctance to act and the sensitivity to new evidence seem intrinsically linked - both stem from awareness that the probability estimate has high volatility.

  Boundary cases: 
  - Non-diverse evidence (like all from one source) should behave similarly to thin evidence because failure points aren't independent. 
  - Ambiguous evidence (pulling both ways) likely has high weight but low resilience - interesting edge case.

  On rational relevance: A strict Bayesian would call this irrational since only the probability value should matter. But Knightian uncertainty traditions (and modern robust decision theory) argue that robustness concerns are rational when models might be misspecified. The key claim would be: expected utility calculations should incorporate meta-uncertainty about the probability model itself.

  Final synthesis: The core phenomenon is best captured as "evidential fragility" - defined as the sensitivity of a probability estimate to potential new evidence. Its counterpart in decision-making is "robustness aversion." The two components are flip sides of the same coin.

  For the user's practical needs, I'll emphasize that this distinction is decision-relevant when: (1) the evidence base has identifiable vulnerabilities (like small samples or correlated sources), and (2) the decision has asymmetric costs where being wrong in one direction is much worse.
answer: |-
  After careful conceptual mapping and elimination of near-miss candidates, the phenomenon you describe is best captured by the established notion of **evidential weight** (as introduced by John Maynard Keynes) in conjunction with its behavioral counterpart, **robustness aversion**. This is not a single term but a conceptual pair that jointly explains both your action-reluctance and fragility observations. Below I define the construct, demarcate boundaries, address your cases, and resolve rationality questions.

  ### Core Definition and Demarcation
  - **Evidential weight**: The *sufficiency* or *comprehensiveness* of the evidence base supporting a probability estimate—distinct from the probability value itself. High weight means the evidence is resilient to new information; low weight means it is fragile. Weight tracks how "settled" the epistemic position is.
  - **Robustness aversion**: The rational reluctance to act on probability estimates with low evidential weight *even when probabilities and utilities are identical* to high-weight cases. This emerges from awareness that low-weight probabilities are more likely to be invalidated by latent variables or new data.

  **What it is NOT**:
  1. **Ambiguity aversion (Ellsberg paradox)**: Ambiguity aversion applies when probabilities are *unknown or unmeasurable* (e.g., betting on an urn with unknown composition). Here, probabilities *are* specified and agreed upon. *Rejected*: Your agents assign exact probabilities.
  2. **Risk aversion**: Risk aversion concerns diminishing marginal utility of outcomes. Your cases stipulate identical payoff distributions. *Rejected*: Payoff symmetry rules this out.
  3. **Credal imprecision / Sets of probabilities**: This involves agents refusing to specify a single probability (e.g., giving ranges). Your agents commit to exact values. *Rejected*: They state precise probabilities.
  4. **Epistemic humility**: A psychological tendency to understate confidence. Your agents both assert 60%—no humility in reporting. *Rejected*: The difference emerges only in action/fragility.
  5. **Value of information**: The expected gain from delaying action to acquire more data. Your stipulation ("no further evidence can arrive") precludes this. *Rejected*: No option to learn exists.

  ### Explaining Your Cases
  - **Clinicians/Investor/Committee**: Identical probabilities (60%/70%) but differing evidential weight (high: large/diverse evidence; low: sparse/redundant evidence). Low weight explains both (a) *robustness aversion* (reluctance to act) and (b) *fragility* (sensitivity to new evidence). The investor fears supplier data rests on unobserved contingencies; the committee doubts the model’s sensitivity to hidden flaws.
  - **Urn analogy**: Betting on the known urn is classic ambiguity aversion. Your cases differ: probabilities *are known* but *poorly grounded*. Similar intuition, distinct mechanism.
  - **Story coherence**: A psychological proxy for weight. Coherent narratives often correlate with high weight (diverse evidence converging), but weight is more fundamental: redundant evidence can support a coherent story yet remain low-weight.

  ### Boundary Clarifications
  - **Evidence bulk vs. diversity**:  
    - *Redundant evidence* (e.g., 1000 near-identical measurements) has high bulk but low weight—vulnerable to systemic error. Functionally identical to "thin" evidence.  
    - *Ambiguous evidence* (plentiful but conflicting) may support a 60% probability but still have low weight: the estimate is unstable.  
    **Verdict**: Weight depends on *independence* and *cover* of evidence (does it rule out alternatives?). Bulk alone is insufficient; diversity is necessary but not sufficient.
  - **Scalability**: Weight is gradational, not binary. It admits "more/less" via:
    - **Resilience**: How much new evidence would alter the probability (high weight = robust).
    - **Scope**: How many alternative hypotheses the evidence excludes.

  ### Rational Relevance: A Serious Divide
  - **Standard Bayesian view**: Purely *synchronic*. Given identical probabilities/utilities, differing actions are irrational. Only the credence matters; weight is "washed out" in the probability estimate. A Bayesian agent *should* ignore weight.
  - **Robust Decision Theory (RDT) view**: *Diachronic rationality* matters. Low-weight probabilities are more likely to be *mis-specified* due to unobserved variables or model error. RDT holds it is rational to prefer actions robust to epistemic fragility.  
    **Key claim**: Expected utility should incorporate *metacredences*—confidence in the probability model itself. Low weight implies low metacredence, justifying aversion. This aligns with Knightian "true uncertainty" (non-quantifiable flaws in probability assessments) and modern work on *model uncertainty*.

  ### Synthesis: Weight-Robustness Pair
  - **The phenomenon**: Evidential weight explains fragility; robustness aversion explains action reluctance. They are two facets of one phenomenon:  
    - *Fragility* is the *epistemic* symptom (low weight = probability easily revised).  
    - *Robustness aversion* is the *practical* response (avoiding bets vulnerable to fragility).  
  - **When it applies**: Whenever probabilities are estimated from evidence susceptible to:  
    - Small samples  
    - Correlated sources  
    - Untested assumptions  
    - Narrow hypothesis coverage  
  - **Coined term for precision**: **Grounding fragility** (if you require one label). Defined as *the extent to which a probability estimate’s sensitivity to new evidence rationally influences action, holding probability and utilities constant*.

  ### Final Word
  This distinction is rationally relevant within traditions rejecting "all uncertainty is probabilizable" (Keynes, Knight, modern RDT). It matters most in high-stakes decisions where model mis-specification risks catastrophic loss. The clinician with thin evidence senses her 60% is "shallow"—a rational cue that expected-utility calculations rest on quicksand. Weight isn’t in the probability; it’s in the *warrant* for the probability. That warrant’s solidity legitimately affects action.
