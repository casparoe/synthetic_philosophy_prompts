  ## HSE FORM DION/YSIA-R7: MUNICIPAL SYMPOSIUM DIAGNOSTIC INTOXICATION RISK ASSESSMENT & CHARACTER VETTING PROTOCOL  
  *(Version 3.2. Rev. 01/04/-347)*  

  **1.0 PURPOSE & SCOPE**  
  This document outlines the mandatory risk mitigation and observational framework for state-approved symposia operating under the *Civic Inebriation (Diagnostic) Regulations 2023*. The primary objective is the controlled administration of Ethanol-Based Diagnostic Agent (EBDA), colloquially "wine," to facilitate the identification of latent characterological deficiencies within the citizenry (Participants, hereafter "Subjects"). The process enables prophylactic civic intervention pre-empting manifestation in public office, jury service, or choral leadership. Recreation is a secondary, non-guaranteed outcome.  

  **2.0 RISK ASSESSMENT MATRIX: EBDA ADMINISTRATION**  

  | **Hazard Identified** | **Control Measure** | **Responsible Party** | **Audit Point (Symposiarch Use Only)** |
  | :------------------- | :------------------ | :-------------------- | :------------------------------------- |
  | **Unregulated Vice Amplification (UVA)** | EBDA dosage strictly graduated by Ethical Resilience Band (ERB):<br>- ERB 1 (18-30 yrs): **1 Krater Max.**<br>- ERB 2 (31-49 yrs): **2 Kraters Max.**<br>- ERB 3 (50+ yrs): **3 Kraters (Gold Band Licence Required)** | Symposiarch (Licensed Moral Auditor - LMA) | ☐ ERB Verified via Citizen ID <br>☐ Krater measures calibrated & stamped (HSE Weights & Measures) |
  | **Democratic Intoxication Cascade (DIC)** | Absolute prohibition on horizontal toasting or self-service. All EBDA dispensed *solely* by LMA. Subjects seated facing LMA podium. Communal vessels banned. | LMA | ☐ "Round" system implemented <br>☐ Dispensing tongs visibly employed <br>☐ No eye contact during pouring (prev. collusion) |
  | **Latent Deficiency Occlusion (LDO)** | Preventative sobriety deemed counter-diagnostic. Subjects must reach *minimum* Krater threshold for ERB (see 2.1). Refusal constitutes automatic Assessment Failure (AF-7). | LMA / Subject | ☐ LMA confirms baseline sobriety (pre-test) <br>☐ Minimum Krater intake logged |
  | **Symposiarch Corruption Hazard (SCH)** | LMA undergoes pre-event gastric lavage & wears moisture-wicking attire (HSE Spec DION/AT-4). Remuneration: flat fee + virtue bonus (non-negotiable, audited by Magistrates). | HSE Licensing Dept. | ☐ LMA Gastric Certificate displayed <br>☐ LMA attire visibly non-porous |
  | **False Positives / Spurious Virtue Signalling (FP/SVS)** | Pre-symposium questionnaire (Form DION/PSQ-2) establishes baseline demeanour. Post-Krater divergence = diagnostic indicator. Excessive pre-assessment reticence noted (Potential Indicator of Strategic Occlusion - PISO). | LMA / Civic Recorder | ☐ PSQ-2 completed & countersigned <br>☐ LMA notes discrepancies verbatim |

  **2.1 Minimum Diagnostic Threshold (MDT) by ERB**  
  *Failure to consume MDT invalidates assessment. Consumption beyond ERB max voids liability waivers.*  
  - ERB 1: **0.75 Kraters**  
  - ERB 2: **1.5 Kraters**  
  - ERB 3: **2.25 Kraters**  

  **3.0 OBSERVATIONAL PROTOCOL & RECORDING**  
  The LMA shall maintain continuous surveillance, noting behavioural deviations from PSQ-2 baseline, specifically:  
  - **Post-Krater 1:** Unseasonable joviality; undue solemnity; disproportionate thirst.  
  - **Post-Krater 2 (ERB 2/3 only):** Political diatribes exceeding 3 mins; unsolicited poetry; attempts to adjust *klinai*.  
  - **Post-Krater 3 (ERB 3 only):** Overt weeping; claims of divine lineage; attempts to bribe LMA with olives.  

  *All observations recorded on Form DION/OBS-5 (Carbon Quintuplicate). Subjects exhibiting Level 3 Deficiencies (see Appendix A) referred for Mandatory Choral Therapy (MCT).*  

  **4.0 LIABILITY & CONTINUITY**  
  By participating, Subjects acknowledge that EBDA acts solely as a *revealing agent*, not an *instigating agent*. Latent moral deficiencies exposed are the sole responsibility of the Subject. The State (via HSE & LMA) bears no liability for:  
  - Post-Diagnostic social ostracisation.  
  - Temporary revocation of Assembly speaking rights (Standard Sanction DION/SS-1).  
  - Damage to *klinai* fabric during passionate gesticulation.  

  **Continuity Disputes:** Subjects claiming amnesia regarding exposed deficiencies may petition for Assessment Review (Fee: 15 Obols). Review entails re-enactment before Magistrate & original LMA. Refunds issued *only* if LMA sobriety is materially disproven (See Sidebar).  

  ---

  **SIDEBAR: CONTINUITY DISPUTE REFUND POLICY (DION/CD-REF)**  
  Refunds for disputed diagnostic outcomes require:  
  1. Material evidence of LMA gastric contamination (e.g., vinegar traces in lavage certificate seal).  
  2. Triplicate sworn statements from ERB 3 witnesses confirming LMA slurred speech *prior* to Krater 3.  
  3. Proof of paid Obols.  
  *Note: Disputes based solely on "character misrepresentation" or "unfair poetic critique" are inadmissible.*  

  ---

  **APPENDIX A: CHARACTER DEFICIENCY DISCLOSURE SCHEDULE (POST-DIAGNOSIS)**  
  *Subjects must declare emergent traits observed during symposium exceeding PSQ-2 baseline. Tick all applicable. Anonymised data used for civic resilience planning.*  

  **Deficiency Tier** | **Manifestation Post-Krater 1** | **Manifestation Post-Krater 2** | **Manifestation Post-Krater 3**  
  :-- | :-- | :-- | :--  
  **Tier 1 (Mild)** | ☐ Over-familiarity with neighbours ☐ Excessive punning ☐ Unfounded optimism re: harvest | ☐ Monologues on hoplite reform ☐ Sudden lyre proficiency claims ☐ Unrequested dietary advice | ☐ Insisting on footrace challenges ☐ Declaring love for tax collector ☐ Redistribution proposals  
  **Tier 2 (Moderate)** | ☐ Mocking Magistrate's beard ☐ Questioning Oracle's fees ☐ Suggesting Spartan efficiency | ☐ Proposing ostracism by lottery ☐ Redefining "virtue" mid-sentence ☐ Demanding symposium be "leaderless" | ☐ Attempting to audit the LMA ☐ Offering to lead a colony ☐ Claiming kinship with Dionysus  
  **Tier 3 (Severe)** | ☐ Whispering oligarchic slogans ☐ Critiquing the Founding Myths ☐ Mimicking the Archon's limp | ☐ Proposing Persian alliances ☐ Denouncing the coin standard ☐ Suggesting women pour wine | ☐ Demanding tyrannical powers ☐ Offering bribes *in* wine ☐ Public disrobing "for liberty"  

  *Submit completed Appendix A to Civic Recorder within 7 days. Failure constitutes a Tier 2 Deficiency (Non-Disclosure).*  

