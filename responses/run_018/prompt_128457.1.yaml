prompt: |-
  I'm running a fifty-minute seminar for first-year philosophy students on Ryle's knowing-how versus knowing-that, and I want it to actually land instead of just recycling the bike-riding cliché they've all heard before. Don't explain Ryle to me — plan the teaching arc. Build the whole thing around a jazz pianist who can navigate chord changes in real time that she literally can't name, where the skill came from years of embodied error-correction rather than explicit rule-learning, and push the idea that some of these skills are genuinely non-decomposable into sub-routines. So: what's the dependency order — what idea has to be in place before the distinction even makes sense, then where the example lands, then the non-decomposability twist? The misconceptions I expect are, in order, that knowing-how is just fast or tacit knowing-that, and then that if you can't verbalize a skill you don't genuinely understand it — tell me exactly where in the sequence to head each one off. What's the one check question at the end that shows they've grasped the non-decomposability point rather than just parroting "skills aren't propositions"? And what should I openly leave out and say so — probably the full regress argument? I spelled "seperate" wrong somewhere but I'm leaving it, and please don't ask for any readings.
reasoning: |-
  Okay, let me tackle this user's request. They're designing a fifty-minute philosophy seminar on Ryle's knowing-how vs. knowing-that, specifically avoiding the overused bike-riding example. Instead, they want to use a jazz pianist case study to emphasize embodied, non-decomposable skills. 

  First, I need to map the conceptual dependencies. The absolute starting point must be establishing Ryle's core distinction itself—if students don't grasp that "knowing-how" and "knowing-that" are fundamentally different categories, nothing else will stick. The jazz example can't land until this foundation is solid. 

  I notice the user anticipates two major misconceptions: 1) that knowing-how is just fast knowing-that, and 2) that understanding requires verbalization. These need surgical interventions at specific points. The first misconception should be preempted right after introducing the distinction, before the jazz case. The second requires dismantling during the example analysis, perhaps by stressing how the pianist's fingers "know" patterns her language centers don't. 

  For the non-decomposability twist—the idea that some skills can't be broken into sub-routines—I'll need a concrete analogy. Maybe comparing it to taste perception? You can't reduce "salty" to component parts. The check question should force application: "Could you teach someone jazz improvisation by writing down all possible chord transitions?" 

  The user explicitly wants to omit the regress argument (good call for beginners) and readings. I'll flag that omission upfront to manage expectations. Time allocation is tight: 5 min setup, 15 min distinction + misconceptions, 15 min jazz case, 10 min non-decomposability, 5 min Q&A. 

  Biggest risk is students nodding along without truly internalizing the anti-intellectualist thrust. The closing question must expose residual intellectualist assumptions. "If the pianist froze mid-solo to recite music theory, would her skill improve?" should reveal if they grasp that knowing-how operates in a different register entirely.
answer: |-
  Here's a structured 50-minute seminar plan focused on embodied skill and non-decomposability, leveraging the jazz pianist example to move beyond clichés and target misconceptions head-on:

  **Core Teaching Arc & Dependency Order:**

  1.  **Ground Zero: The Commonsense "Knowing-That" Model (5 mins)**
      *   **Goal:** Establish the default intellectualist assumption.
      *   **Activity:** Quick poll - "What does it mean to *know* something?" Elicit answers like "I can state facts," "I understand propositions," "I can explain it." Emphasize that philosophy often starts here: knowledge as justified true belief about facts.
      *   **Why First?** Ryle's distinction only *matters* against this dominant background. Without establishing "knowing-that" as the default target of analysis, the distinction lacks bite.

  2.  **Introducing the Distinction: Ryle's Core Move (10 mins)**
      *   **Goal:** Clearly define "knowing-how" as distinct *in kind*, not just degree.
      *   **Activity:** Contrast simple examples:
          *   *Knowing-That:* Knowing *that* Paris is the capital of France; knowing *that* 2+2=4; knowing *that* a major chord has specific intervals.
          *   *Knowing-How:* Knowing *how* to tie your shoes; knowing *how* to speak your native language fluently; knowing *how* to catch a ball.
      *   **Crucial Point:** "Notice that your ability to tie your shoe isn't just you silently reciting instructions to yourself really fast. *What you are doing* is different from *stating facts about doing it*."
      *   **Head Off Misconception #1 (Fast/Tacit Knowing-That) HERE:** Explicitly state: "A common mistake is to think knowing-how is just *knowing-that* operating quickly or unconsciously. Ryle argues it's fundamentally different – it's about *capacity*, *disposition*, *skill*, not storing and retrieving hidden propositions." Ask: "If knowing-how were just fast knowing-that, could you theoretically slow it down and state *all* the propositions? Is that plausible for catching a ball?"

  3.  **The Jazz Pianist: Embodied Skill & Error-Correction (15 mins)**
      *   **Goal:** Deepen understanding of knowing-how as embodied, practical, and developed through non-propositional means.
      *   **Activity:** Present the case study vividly.
          *   Describe the pianist navigating complex, shifting chord changes fluidly, *in the moment*.
          *   Crucially state: **She cannot name the chords or the theoretical rules she's using in real-time.** Her fingers "know" what to play based on sound, feel, and the musical context.
          *   **Emphasize the Origin:** This skill emerged from *years* of *practice*: trial-and-error, listening, mimicking, feeling the music, getting feedback (audience reaction, bandmates, her own ear), and correcting *in the doing*. It's *acquired through embodied action*, not studying theory books (though that might supplement it).
      *   **Key Question:** "Is her ability to play *dependent* on her ability to state the rules? Or is her playing the *primary* thing, and the theoretical description a separate (and possibly incomplete) activity?" (Steer towards the latter).
      *   **Head Off Misconception #2 (Verbalization = Understanding) HERE:** "Does her inability to verbalize the complex music theory *in the moment of playing* mean she doesn't genuinely *understand* what she's doing musically? Or does her playing *itself* demonstrate a profound understanding that resides in her fingers, ears, and body?" Argue that her performance *is* the understanding manifest. Understanding isn't *only* linguistic.

  4.  **The Twist: Non-Decomposability (10 mins)**
      *   **Goal:** Introduce the radical idea that some knowing-how resists intellectualist breakdown.
      *   **Activity:** Push the pianist example further.
          *   "Okay, she can't state *all* the rules at once during play. But could we, after the fact, *theorize* and break down exactly what she did into a set of sub-rules? Could we decompose her improvisation into discrete steps?"
          *   **Argue Against Decomposability:** Her improvisation isn't executing a pre-defined sequence of sub-routines. It's a holistic, context-sensitive *response* shaped by:
              *   Immediate auditory feedback (the sound *right now*).
              *   Interaction with other musicians (their phrasing, dynamics).
              *   The feel of the keys, the tempo, the audience vibe.
              *   Years of ingrained patterns that are fluidly combined/modified on the fly.
          *   **Analogy:** It's less like following an instruction manual, more like navigating a complex social interaction – the response emerges holistically from the situation and embodied history, not by ticking off sub-steps. The *flow* is irreducible.
          *   **Contrast with Decomposable Skill:** Briefly contrast with a more mechanical skill (e.g., following a precise recipe, assembling IKEA furniture) where breaking into sub-steps *is* possible. Highlight that *many* crucial skills (like jazz improv, nuanced conversation, expert judgment) resist this.

  5.  **Synthesis, Check Question & Wrap-up (8 mins)**
      *   **Recap:** Ryle challenges the dominance of knowing-that. Knowing-how is distinct: embodied, dispositional, often acquired through practice/error-correction. The Jazz Pianist shows this vividly: her skill is in the *doing*, not hidden propositions. Crucially, some knowing-how is *non-decomposable* – the holistic, context-sensitive response can't be fully broken down into rule-following sub-components.
      *   **The Check Question (for Non-Decomposability):** "Could you successfully teach someone to improvise jazz *solely* by giving them an exhaustive written manual of chord changes, scales, and 'rules,' even if it was incredibly detailed? Why or why not?" *Listen for:* Recognition that the manual would miss the embodied, contextual, holistic, feedback-driven nature of the skill. It might provide *elements*, but not the integrated, adaptive *knowing-how* itself. It would produce rule-followers, not fluent improvisers.
      *   **What We're Leaving Out & Why (Explicitly State - 2 mins):** "We're focusing on the core distinction and the nature of skill. One major thing we're *not* covering today is Ryle's famous **regress argument** against intellectualism (the 'paralysis by analysis' infinite regress). That's a powerful logical tool, but today we're prioritizing the *positive* picture of what knowing-how *is* – embodied, practical, and sometimes fundamentally non-decomposable – using our pianist as the anchor. If you're curious about the regress, it's a key part of Chapter 2 of *The Concept of Mind*."

  **Key Tactics Embedded:**

  *   **Active Misconception Busting:** Addressing "fast knowing-that" *immediately* after defining the distinction prevents it taking root. Attacking "verbalization=understanding" *during* the jazz example analysis ties it directly to the concrete case.
  *   **Progressive Deepening:** The Jazz example is introduced after the basic distinction but then *pushed* in step 4 to reveal the deeper non-decomposability point.
  *   **Holistic Focus:** Emphasize *embodiment*, *context-sensitivity*, *real-time feedback*, and *history* throughout the jazz case. This builds naturally towards non-decomposability.
  *   **The Check Question:** Forces application beyond definition. The "exhaustive manual" question targets the *essence* of non-decomposability – the insufficiency of propositional rules to capture the skill.
  *   **Strategic Omission:** Explicitly stating the omission of the regress argument manages expectations, keeps focus, and subtly signals there's more to Ryle while avoiding complexity that could derail the core embodied skill message.

  This structure leverages the unique jazz example to make the distinction concrete, demonstrates the practical origin of skill, and pushes towards Ryle's more radical anti-intellectualist claim about the nature of some understanding, all while actively dismantling the expected misconceptions at the precise points they're likely to arise.
