prompt: |-
  Construct a worked example of Simpson's paradox — for a lecture arguing that "when the trend reverses, trust the subgroups" is not a universal rule — in which the reversal is genuine but the correct practical conclusion comes from the aggregated table. Constraints: the setting should be mundane and credible (a clinic, a firm, a school; no casinos or contrived coin flips); the numbers should be concrete and small enough to verify by hand; and the partitioning variable must not be a pre-treatment confounder — it should be a variable the treatment itself affects, or one where conditioning would otherwise bias the comparison. Begin with the scenario and its numbers, with no preamble. After the scenario, state in one sentence which table the decision-maker should trust, show the reversal arithmetically, explain the causal structure that makes conditioning the wrong move here, describe the minimal change to the story that would flip the verdict back to the disaggregated table, and say which criterion from causal reasoning settles the question in each version.
reasoning: |-
  We are going to create a scenario in a school setting. The treatment is a new teaching method (Method A vs. Method B) and the outcome is passing an exam. The partitioning variable is the level of homework completion (High vs. Low), which is affected by the teaching method.

  Scenario:

  A school is testing two teaching methods: Method A (the new method) and Method B (the traditional method). The school records the number of students who passed the exam, along with the level of homework completion (High or Low) for each student. The homework completion is influenced by the teaching method: Method A encourages more consistent homework completion, while Method B leads to more sporadic completion.

  The data broken down by homework completion (subgroups) and the aggregate data are as follows:

  **Subgroup: High Homework Completion**
  | Teaching Method | Pass | Total | Pass Rate |
  |-----------------|------|-------|-----------|
  | Method A        | 18   | 20    | 90%       |
  | Method B        | 70   | 80    | 87.5%     |

  **Subgroup: Low Homework Completion**
  | Teaching Method | Pass | Total | Pass Rate |
  |-----------------|------|-------|-----------|
  | Method A        | 2    | 20    | 10%       |
  | Method B        | 10   | 20    | 50%       |

  **Aggregate (Ignoring Homework Completion)**
  | Teaching Method | Pass | Total | Pass Rate |
  |-----------------|------|-------|-----------|
  | Method A        | 20   | 40    | 50%       |
  | Method B        | 80   | 100   | 80%       |

  In the subgroups, we see that in the High homework group, Method A has a pass rate of 90% vs. Method B's 87.5% (so Method A is better). In the Low homework group, Method A has 10% vs. Method B's 50% (so Method B is better). But in the aggregate, Method A has a 50% pass rate and Method B has 80% pass rate. Thus, overall Method B appears better.

  Reversal: In each homework subgroup, Method A has a higher pass rate in the High group and a lower pass rate in the Low group, but overall Method B has a higher pass rate.

  However, the school must decide which teaching method to adopt. The decision-maker should trust the aggregate table because conditioning on homework completion (which is a post-treatment variable) would be incorrect for evaluating the effect of the teaching method.

  Why? Because homework completion is affected by the teaching method. Method A causes more students to complete homework (as we see: 20 out of 40 in Method A are in the High homework group vs. 80 out of 100 in Method B are in the High homework group). Conditioning on homework completion would block part of the effect of the teaching method (specifically, the effect that operates through homework completion). In this case, the aggregate table gives the total effect of the teaching method, which is what the school cares about.

  Arithmetic verification of reversal:

  - High subgroup: Method A: 18/20 = 0.9, Method B: 70/80 = 0.875 -> Method A better by 0.025.
  - Low subgroup: Method A: 2/20 = 0.1, Method B: 10/20 = 0.5 -> Method B better by 0.4.
  - Aggregate: Method A: 20/40 = 0.5, Method B: 80/100 = 0.8 -> Method B better by 0.3.

  Causal structure:

  The treatment (teaching method) affects both the outcome (passing) and the mediator (homework completion). Homework completion also affects the outcome. However, if we condition on homework completion, we are not capturing the total effect of the treatment because we are blocking the path through the mediator. In causal diagrams, conditioning on a mediator that is a consequence of the treatment leads to biased estimates of the total treatment effect.

  Minimal change to flip the verdict:

  Suppose instead that the level of homework completion was determined *before* the teaching method was assigned (for example, by the students' prior habits) and the teaching method was randomly assigned. Then homework completion would be a pre-treatment confounder. We would then need to condition on homework completion to avoid confounding.

  Revised scenario (with pre-treatment homework completion):

  Suppose at the beginning of the term, each student is classified as High or Low homework completion based on prior records. Then the teaching method is randomly assigned. The same numbers as above are observed. Now, because homework completion is a pre-treatment confounder (it affects which teaching method a student gets? Not if randomly assigned, but if the assignment was not random and depended on homework level? Actually, in the revised scenario, we assume that the assignment was not random but was influenced by the homework level. Alternatively, we can assume that the homework level is a pre-treatment variable that affects the outcome and is associated with the treatment because the school assigned the teaching method based on homework level).

  But note: in the original scenario, the treatment (teaching method) affected homework. In the revised scenario, we want homework to be a pre-treatment confounder. So we change the story: the school assigns Method A to some classes and Method B to others, but it turns out that the classes assigned to Method A had more students with historically low homework completion. Now homework completion is a pre-treatment confounder.

  Revised data (same numbers but now homework completion is pre-treatment and the assignment is such that the High homework group is overrepresented in Method B and underrepresented in Method A). Specifically, we observe:

  **Subgroup: High Homework Completion**
  | Teaching Method | Pass | Total | Pass Rate |
  |-----------------|------|-------|-----------|
  | Method A        | 18   | 20    | 90%       |
  | Method B        | 70   | 80    | 87.5%     |

  **Subgroup: Low Homework Completion**
  | Teaching Method | Pass | Total | Pass Rate |
  |-----------------|------|-------|-----------|
  | Method A        | 2    | 20    | 10%       |
  | Method B        | 10   | 20    | 50%       |

  But note: the aggregate pass rates are the same as before. However, in this revised scenario, we know that Method B was assigned to a larger proportion of High homework students (80 out of 100 in Method B vs. 20 out of 40 in Method A). But wait, in Method A, 20 out of 40 are High (so 50%), and in Method B, 80 out of 100 are High (so 80%). So the High homework students are more likely to be assigned Method B.

  In this revised scenario, we have confounding because the homework level (pre-treatment) is associated with both the treatment and the outcome. Therefore, we should condition on homework level to get the correct effect. In the subgroups, we see that Method A is better in the High group and worse in the Low group? Actually, the numbers are the same, but the causal structure is different.

  But note: the same reversal occurs. However, in this case, the decision-maker should trust the subgroup analysis because conditioning is necessary to adjust for the confounder.

  Criterion from causal reasoning:

  In the original scenario, we have a mediator (homework completion) that is affected by the treatment. We are interested in the total effect, so we should not condition on the mediator. The criterion: if the variable is a mediator (on the causal pathway from treatment to outcome), then conditioning on it blocks part of the effect and biases the total effect.

  In the revised scenario, we have a confounder (homework completion) that affects both the treatment assignment and the outcome. The criterion: if the variable is a confounder (a common cause of treatment and outcome, or a pre-treatment variable that is associated with treatment and affects the outcome), then we must condition on it to avoid confounding.

  Therefore, the key criterion is the causal role of the partitioning variable: whether it is a mediator (post-treatment) or a confounder (pre-treatment).
answer: |-
  ### Scenario: School Tutoring Programs  
  A high school tests two tutoring programs (Program A and Program B) for improving math exam pass rates. The school tracks program assignment, exam results, and student *effort level* (High/Low). Effort is measured by voluntary practice problems completed *during* the tutoring period (a behavior the tutoring may influence).  

  **Subgroup: High Effort**  
  | Program | Pass | Total | Pass Rate |  
  |---------|------|-------|-----------|  
  | A       | 19   | 20    | 95%       |  
  | B       | 76   | 80    | 95%       |  

  **Subgroup: Low Effort**  
  | Program | Pass | Total | Pass Rate |  
  |---------|------|-------|-----------|  
  | A       | 1    | 20    | 5%        |  
  | B       | 4    | 20    | 20%       |  

  **Aggregate Data (Ignoring Effort)**  
  | Program | Pass | Total | Pass Rate |  
  |---------|------|-------|-----------|  
  | A       | 20   | 40    | 50%       |  
  | B       | 80   | 100   | 80%       |  

  ---  
  **Which table to trust?** The decision-maker should trust the **aggregated table** (Program B has a higher pass rate: 80% vs. 50%).  

  **Arithmetic Reversal**:  
  - **High Effort**: Both programs = 95% pass rate (no difference).  
  - **Low Effort**: Program B (20%) > Program A (5%).  
  - **Overall**: Program B (80%) > Program A (50%).  
  *Reversal*: Subgroups show Program B is never worse (and better in Low Effort), but aggregated data falsely suggests Program B is superior overall.  

  **Causal Structure**:  
  Effort is a **mediator**, not a confounder:  
  - Tutoring (Treatment) → Effort Level → Exam Outcome.  
  - Conditioning on effort (a post-treatment variable) blocks part of Program A’s effect. Program A *increases effort* (High Effort: 20/40 for A vs. 80/100 for B), which *improves outcomes*. Ignoring effort captures this benefit; conditioning on it hides Program A’s true impact by comparing students with unequal effort artificially induced by the programs.  

  **Minimal Change to Flip the Verdict**:  
  Make effort a **pre-treatment confounder** (e.g., effort measured *before* tutoring). If high-effort students were more likely to choose Program B (e.g., Program B scheduled after school, attracting motivated students), the same numbers would require trusting the *subgroups* to adjust for this bias.  

  **Criterion from Causal Reasoning**:  
  - **Current Version (Mediator)**: Trust aggregated data. Use the *do*-operator or backdoor criterion—**no conditioning** on mediators to avoid bias in total effect.  
  - **Changed Version (Confounder)**: Trust subgroups. Use the backdoor criterion—**conditioning** is necessary to block confounding paths.
