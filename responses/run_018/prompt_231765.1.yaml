answer: |-
  Below is the adversarial-collaboration document structured per your specifications. It captures the core agreement, crystallizes the disagreement, identifies testable cruxes, and flags semantic divergences—all while preserving the integrity of both positions.

  ---

  **Adversarial Collaboration Statement: Moral Equality of Combatants**  
  *Signed by [Walzer-Style Defender] and [McMahan-Style Revisionist]*  

  ### 1. Agreed Substantive Claims  
  1. **Ad Bellum/In Bello Distinction**: *Jus ad bellum* (justice of war) and *jus in bello* (justice in war) are analytically separable concepts.  
  2. **Epistemic Limits**: Individual combatants typically lack reliable access to conclusive evidence about the objective justice of their nation’s war.  
  3. **Functional Value of Symmetry**: The legal war convention’s symmetrical application (e.g., POW status) is pragmatically necessary to mitigate suffering, ensure reciprocity, and maintain military discipline.  
  4. **Non-Blameworthiness**: A combatant’s reasonable belief in their war’s justice generally negates *moral blameworthiness* for participation, even if their cause is objectively unjust.  
  5. **Deep Morality vs. Law**: Legal conventions (e.g., Geneva Protocols) may diverge from the demands of deep morality (i.e., what is ultimately permissible/impermissible).  

  ---

  ### 2. Disagreements Table  
  | **Walzer-Style Position** | **McMahan-Style Position** |
  |---------------------------|----------------------------|
  | "Combatants who adhere strictly to *jus in bello* rules (discrimination, proportionality, distinction, etc.) are moral equals: they share identical *moral status* and *permissions to use lethal force* against each other, irrespective of which side is fighting an objectively unjust war (*ad bellum*). This equality arises because soldiers lack the epistemic authority to adjudicate *ad bellum* justice, and the war convention’s stability depends on symmetrical in bello obligations." | "Combatants fighting for an objectively unjust cause lack the *moral permission* to kill just combatants, even when they obey *in bello* rules and reasonably believe their cause is just. This is because liability to defensive killing is determined by one’s *objective contribution to an unjust threat*, not by conformity to conventions or subjective belief. Only just combatants retain the right to kill as a matter of deep morality." |

  ---

  ### 3. Cruxes  
  *Each crux identifies a sub-question where resolution would shift one/both positions, paired with a shared test case and opposing predictions.*  

  1. **Crux: Is liability to lethal harm objective or belief-relative?**  
     - *Test Case*: Conscripted soldiers in Nation A (objectively aggressing unjustly) *reasonably believe* their war is defensive due to state propaganda. They rigorously follow *in bello* rules. May a just combatant from Nation B permissibly kill them?  
     - **Walzer Prediction**: Yes—and symmetrically, Nation A’s soldiers may permissibly kill Nation B’s soldiers. Moral equality holds.  
     - **McMahan Prediction**: No—Nation B’s soldiers may permissibly kill Nation A’s soldiers (who are objectively liable), but Nation A’s soldiers *may not* permissibly kill Nation B’s (unless in immediate self-defense against a wrongful attack).  

  2. **Crux: Does minimal/causal contribution to an unjust threat generate liability?**  
     - *Test Case*: A conscript in an unjust army drives non-weaponized supply trucks (food, uniforms) 100km behind the front line. They wear a uniform, avoid civilians, and believe their cause is just. Is this driver liable to lethal targeting by just forces?  
     - **Walzer Prediction**: No. The driver is a combatant (due to uniform/direct logistical support) but adheres to *in bello* rules. They retain moral equality and may not be targeted unless directly participating in hostilities.  
     - **McMahan Prediction**: Yes. By voluntarily contributing material support to an objectively unjust threat (even minimally), the driver becomes liable to proportionate defensive harm—though the *necessity* of lethal force may be questioned.  

  3. **Crux: Does the stability of the war convention depend on accepting moral (not merely legal) equality?**  
     - *Test Case*: If soldiers on both sides internalize the revisionist view (unjust combatants lack moral permission to kill), would this increase or decrease atrocities (e.g., refusal of quarter, torture)?  
     - **Walzer Prediction**: Decrease in *in bello* restraint. Moral asymmetry erodes reciprocity, incentivizing brutality against "unprivileged" combatants and destabilizing the convention.  
     - **McMahan Prediction**: No change (or improvement). Soldiers can accept legal symmetry without moral symmetry. Atrocities are driven by pragmatics/dehumanization, not meta-ethical views on liability.  

  ---

  ### 4. Linguistic/Conceptual Notes  
  The following disagreements are partially terminological:  
  - **"Moral Equality"**: Walzer uses this to denote *identical permissions/status in combat*. McMahan denies this but agrees combatants may be *equally excused* (non-culpable) or *legally equal*.  
  - **"Combatant"**: Walzer assigns this based on role/uniform; McMahan ties it to *actual contribution to harm*.  
  - **"Liability"**: McMahan uses this in a strictly objective, desert-based sense ("forfeiture of rights"). Walzer sees liability as convention-dependent.  
  - **"Unjust Combatant"**: McMahan uses this descriptively (objectively contributing to unjust threat). Walzer rejects it as a *moral category* for individual soldiers.  

  ---  
  **Signatures**:  
  [Walzer-Style Defender] _________________________________________ Date: _________  
  [McMahan-Style Revisionist] ____________________________________ Date: _________  

  ---  
  **Key Design Notes**:  
  1. **Cruxes reflect your hunches**: Crux 1 addresses objective vs. belief-relative liability; Crux 2 tackles marginal contributors (supply driver).  
  2. **Predictions force falsifiability**: Each side commits to empirical/moral expectations.  
  3. **Asymmetry preserved**: The table quotes each view verbatim; the cruxes don’t compromise their principles.  
  4. **Semantic clarity**: Section 4 preempts "talking past each other" by defining contested terms.  

  This document makes the dispute *sharper*, not smaller—which is the goal.
