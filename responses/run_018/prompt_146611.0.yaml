prompt: |-
  I am working through the problem of religious arguments in democratic deliberation, but I find the standard framing—broadly, Rawlsian exclusivism against inclusive liberalism—too coarse for my purposes. I want the full specification of what a theory of public justification must actually achieve to count as adequate in a pluralistic society characterised by two conditions I will call “doctrinal opacity” and “threshold recognisability”: the first being that citizens hold comprehensive commitments whose full inferential implications are not transparent even to the holders themselves; the second being that a reason counts as publicly accessible not if every citizen actually accepts it, but if it lies within the cognitive reach of anyone who shares the basic democratic premises, regardless of whether doctrinal barriers prevent actual uptake. Please write the list of desiderata such a theory must meet: the specific cases it has to handle (for instance, a legislator invoking sacred text on environmental policy; a citizen refusing vaccination on theological grounds yet offering a parallel secular rationale; cross-doctrinal coalitions formed on economic redistribution), the distinctions it cannot collapse (such as between reasons being inaccessible due to cognitive limitation versus being inaccessible due to doctrinal commitment, or between exclusion from public justification and exclusion from private motivation), and the findings from political psychology or the sociology of religion it must not contradict—each with the consideration behind it. Mark which requirements are genuinely non-negotiable and which are merely preferences of particular camps (for example, neutrality of aim versus neutrality of effect, translation requirements versus direct accessibility). If some subset of these desiderata turns out to be jointly unsatisfiable—say, full transparency of reasoning combined with respect for doctrinal opacity—say so explicitly, as that tension is precisely what I want mapped. Finally, indicate which single requirement does the most damage to the most familiar existing positions. A table is acceptable, but the conceptual weight should rest on the criteria and their motivating cases rather than on scoring particular theorists. Please provide your answer in British English.
reasoning: |-
  Okay, let me unpack this complex query about religious arguments in democratic deliberation. The user is clearly deeply engaged with political philosophy, specifically wrestling with limitations of Rawlsian frameworks. They've introduced two sophisticated conditions - doctrinal opacity and threshold recognisability - that require careful handling.

  Hmm, the core challenge here is designing desiderata that respect how real people actually hold beliefs. Doctrinal opacity means we can't expect citizens to fully articulate their own belief systems - that aligns with cognitive science showing implicit bias and limited self-knowledge. Threshold recognisability is more radical than standard accessibility; it's about potential understanding regardless of actual acceptance. 

  I need to consider concrete cases they mentioned: the legislator quoting scripture for environmental policy raises questions about authority sources; the vaccine refuser with dual rationales touches on sincerity versus strategic framing; economic coalitions across faiths test how shared goals interact with divergent foundations. Each case stresses different aspects of justification.

  The tensions will be sharpest between:
  - Full transparency expectations versus respect for opaque commitments
  - Actual uptake requirements versus theoretical accessibility
  - Neutrality in government aims versus practical effects on groups

  Psychology findings complicate this - like how sacred values resist trade-offs, or how identity shapes reason reception. Any credible theory can't ignore that doctrinal rejection isn't the same as cognitive inability.

  For the knockout criterion? Probably threshold recognisability. It torpedoes both Rawls (too restrictive) and inclusive liberals (too lenient) by decoupling accessibility from actual acceptance while demanding cognitive availability. That's philosophically explosive.

  I'll structure this as a taxonomy of desiderata with binding constraints versus negotiable preferences, flagging irreconcilable tensions explicitly. The user wants conceptual tools, not scorekeeping - so cases and principles will drive the analysis, not theorist rankings. British English conventions will be observed throughout.
answer: |-
  Below is a systematic specification of desiderata for a theory of public justification under your stipulated conditions of **doctrinal opacity** (citizens' comprehensive commitments have non-transparent inferential implications) and **threshold recognisability** (public accessibility requires cognitive reachability to any democratic citizen, irrespective of actual doctrinal acceptance). The framework prioritises conceptual clarity, empirical realism, and tension-mapping, with binding constraints distinguished from contingent preferences. Criteria are formulated in British English.

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Essential for adequacy in pluralistic democracies)*

  | **Desideratum** | **Motivating Case/Consideration** | **Theoretical Function** |
  |-----------------|-----------------------------------|--------------------------|
  | **1. Opacity-Respecting Epistemology** | A legislator cites Leviticus on land stewardship to justify environmental regulations, but cannot fully articulate how this connects to other doctrinal commitments (e.g., economic justice). *Consideration:* Political psychology (e.g., Tetlock on "sacred values") shows adherents often lack introspective access to their doctrines' full logical architecture. | Must permit citizens to offer *pro tanto* reasons without exhaustive self-knowledge. Rejects theories demanding full inferential transparency. |
  | **2. Accessibility ≠ Actual Acceptance** | A citizen refuses vaccination citing theological grounds (e.g., bodily integrity as divine trust) but offers a parallel secular rationale (e.g., medical autonomy). The secular rationale is cognitively graspable by others, even if doctrinally rejected. *Consideration:* Threshold recognisability decouples cognitive availability from persuasive success. | Public reasons must be *intelligible* to all who share democratic premises (e.g., reciprocity, basic rights), regardless of whether doctrines block endorsement. |
  | **3. Cognitive vs. Doctrinal Blockage Distinction** | Opposition to same-sex marriage: One objector lacks abstract reasoning skills (cognitive limitation); another rejects it due to infallible scriptural interpretation (doctrinal commitment). *Consideration:* Sociology of religion (Berger, Stark) shows doctrinal barriers are *chosen* identity markers, not cognitive deficits. | Must not treat unreasoned prejudice equivalently to doctrinally consistent non-acceptance. Only the former is justifiably excluded. |
  | **4. Motivational Asymmetry Preservation** | A Muslim MP supports poverty relief citing *zakat* (private motivation) but frames arguments in deliberative forums using Rawlsian primary goods (public justification). *Consideration:* Democratic legitimacy requires justifiability to others, not erosion of private conviction. | Strict separation between **exclusion from public justification** (reasons barred for lacking accessibility) and **exclusion from private motivation** (citizens may hold non-public reasons personally). |
  | **5. Cross-Doctrinal Coalitions** | Atheists and Catholics coalesce around wealth redistribution: atheists use capability theory; Catholics use subsidiarity. Neither group fully grasps the other’s foundational commitments. *Consideration:* Empirical political science (e.g., Norris/Inglehart) shows stable coalitions require overlapping *action-guiding principles*, not comprehensive agreement. | Must allow convergence on shared policies via distinct (opaque) justificatory paths, provided each path meets threshold recognisability. |

  ---

  ### **II. Contingent Preferences**  
  *(Subject to theoretical/cultural negotiation)*

  | **Desideratum** | **Motivating Case** | **Tension/Consideration** |
  |-----------------|---------------------|---------------------------|
  | **A. Neutrality of Aim vs. Effect** | State funding for faith schools: Aim-neutral if criteria are secular (e.g., educational outcomes); Effect-non-neutral if disproportionately benefiting one religion. | **Preference:** Liberals (Quong) prioritise *aim*; critics (e.g., multiculturalists) argue *effect* matters for substantive equality. |
  | **B. Translation Requirement** | Legislator quoting Qur’ān on climate justice: Must she "translate" it into secular terms (e.g., intergenerational equity), or is citation permissible if cognitively accessible? | **Preference:** Rawlsians demand translation; post-secularists (Habermas) allow religious reasons if supplemented by public ones. Threshold recognisability may permit untranslated-but-accessible reasons. |
  | **C. Scope of "Basic Democratic Premises"** | Libertarians reject redistributive taxation as coercive; social democrats see it as foundational justice. What counts as "shared"? | **Preference:** Minimalists (Gaus) limit premises to agency/reciprocity; maximalists include substantive equality. Affects threshold recognisability’s stringency. |
  | **D. Sincerity vs. Strategic Framing** | Anti-abortion activist uses secular "foetal personhood" arguments while privately motivated by theology. Is strategic framing legitimate? | **Preference:** Deliberative democrats (Gutmann/Thompson) demand sincerity; realists (Schauer) accept strategic pluralism. |

  ---

  ### **III. Binding Empirical Constraints**  
  *(Must cohere with established findings)*

  - **Sacred Values Non-Negotiability** (Atran, Ginges): Doctrinal commitments often resist trade-offs with material incentives. *Implication:* Theories cannot assume doctrinal adherents will "bargain away" core beliefs for secular compromises.  
  - **Identity-Protective Cognition** (Kahan): Groups reject empirically sound claims if they threaten identity. *Implication:* Doctrinal opacity exacerbates rejection of accessible reasons; theories must address *non-rational* barriers without conflating them with inaccessibility.  
  - **Moral Foundations Pluralism** (Haidt): Doctrinal diversity reflects divergent moral foundations (e.g., sanctity vs. fairness). *Implication:* Threshold recognisability must accommodate multiple foundational "languages", not assume unitary rationality.  

  ---

  ### **IV. Irreconcilable Tensions**  
  *(Your focal mapping requirement)*  

  1. **Opacity vs. Transparency:**  
     - **Tension:** Doctrinal opacity *requires* accepting non-reflexive reasons, yet democratic accountability *demands* transparency to prevent bad-faith/irrational justifications.  
     - **Example:** A legislator invokes "divine stewardship" for oil drilling bans but cannot explain inconsistencies (e.g., supporting deforestation). Threshold recognisability accepts the reason; transparency advocates reject it as unexamined.  
     - **Stipulation:** *This is unresolvable.* Theories must choose priority: either permit opaque-but-accessible reasons (sacrificing full scrutiny) or demand transparency (excluding many devout citizens).  

  2. **Accessibility vs. Neutrality:**  
     - **Tension:** If a reason is *accessible* but doctrinally specific (e.g., Buddhist *paticcasamuppāda* for interdependence policies), allowing it violates neutrality; excluding it violates accessibility.  
     - **Stipulation:** Threshold recognisability *permits* such reasons, forcing neutrality to be *procedural* (aim) not *consequential* (effect).  

  ---

  ### **V. Most Damaging Requirement to Existing Theories**  
  **Threshold Recognisability** catastrophically undermines:  
  - **Rawlsian Exclusivism:** It rejects the "duty of civility" requiring religious reasons to be translated/secularised, as accessibility ≠ secularity.  
  - **Inclusive Liberalism** (e.g., Audi): Demanding *actual* secular rationale supplementation is excessive; accessibility alone suffices.  
  - **Radical Deliberative Democracy** (e.g., Dryzek): Actual uptake is unnecessary; cognitive reachability is sufficient even if doctrines prevent agreement.  

  This requirement dissolves the "secular/religious" binary, centring *epistemic availability to democratic agents* regardless of content origin—a seismic shift from prevailing models.

  ---

  ### Summary Table of Core Desiderata  
  | **Type**               | **Key Requirement**               | **Binding?** | **Threatens**                      |
  |------------------------|-----------------------------------|--------------|------------------------------------|
  | **Non-Negotiable**     | Opacity-Respecting Epistemology   | Yes          | Rationalist transparency theories  |
  |                        | Accessibility ≠ Actual Acceptance | Yes          | Uptake-focused deliberativism      |
  |                        | Cognitive/Doctrinal Distinction   | Yes          | Conflationary "reasonableness" tests |
  | **Contingent**         | Neutrality of Aim (not Effect)    | No           | Effect-neutral egalitarians        |
  |                        | Translation Optional              | No           | Rawlsian exclusivism               |
  | **Empirical Constraint**| Sacred Values Immunity            | Yes          | Utilitarian bargaining models      |
  | **Tension**            | Opacity vs. Transparency          | Irreconcilable | Theories prioritising one over other |

  This framework provides the granularity you seek, centring doctrinal opacity and threshold recognisability while mapping fault lines in public reason theories. The unresolvable opacity-transparency tension is foregrounded as analytically pivotal.
