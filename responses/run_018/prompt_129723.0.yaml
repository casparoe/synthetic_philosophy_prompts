  For **Statistical Reductionism**:
     This view already avoids the group essence, so we don't have the same worry about ecological fallacy? Actually, we might: if we use group averages to describe individuals, that's the ecological fallacy. But the reductionist says the group property is just an average of individuals. So the question becomes:
