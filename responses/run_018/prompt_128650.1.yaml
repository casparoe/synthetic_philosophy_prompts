prompt: |-
  I'm in a senior seminar on biography, hagiography, and moral philosophy, and I need to sharpen a half-formed idea into a one-semester research proposal. Rather than treating Plutarch's Parallel Lives as either straightforward moral exemplars or nationalist propaganda, I want to investigate whether the Greek-Roman pairing generates a "moral interference effect": the virtues celebrated in one life cast unintended critical shadows that destabilize the hagiographic clarity of the other, complicating what moral learning the reader can extract. Standard comparative and propagandist readings leave this destabilization unexplained, especially in pairs like Alexander/Caesar and Demosthenes/Cicero where admiration seems to collapse into reservation. Deliver the proposal as exactly five numbered items, each one or two sentences long, with no introduction or conclusion: (1) the precise research question and why existing answers leave it open; (2) the interference hypothesis and how it differs from conventional interpretations; (3) the method—close narrative analysis of specific pairs and criteria for detecting interference in Plutarch's voice; (4) what result would confirm or disconfirm the hypothesis, and what counts as failure; and (5) an honest assessment of scope and limitations for a semester-long project. Do not include a bibliography, citations, or reading list, as I will supply references myself.
