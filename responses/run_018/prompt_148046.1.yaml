  I'm a retired biophysicist who picked up philophy late in life, mostly reading about ethics and knowledge after I left the lab. Next week I'm giving the opening remarks at a small workshop called "After the Report: Memory and Amnesty" at the local university — the room will be split between people who actually worked on South Africa's TRC, Argentina's CONADEP files, and Rwanda's gacaca courts, and a bunch of family and teachers who just care about the topic. I want to talk about the idea that amnesty doesn't just leave random gaps in the record; it introduces a directed epistemic bias, like a non-random measurement error in an experiment, because every testimony we recieve is conditional on the promise of no punishment. That needs to shape what I actually say: I can't claim the archive is complete, and I shouldn't say forgiveness balances the moral books, but I also don't want to sound like I'm dismissing what was learned. Can you write me about five minutes of remarks that hold that tension? The experts should hear the selection-bias framing without me using jargon that loses everyone else. No reading lists or citations please — I won't have them and the audience doesn't need them.
