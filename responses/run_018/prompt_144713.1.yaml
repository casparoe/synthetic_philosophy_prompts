  The user suggests restricting geometric rationality to discrete spaces. But is that ad hoc? Maybe, because continuous cases are common. Are there alternatives? One could argue that geometric rationality isn't about belief updating but about decision-making under uncertainty. Separating doxastic norms from betting strategies might resolve the conflation issue. Bayesian updating handles beliefs, while Kelly is about optimizing a specific utility function (log wealth). That distinction could reframe the essay.

