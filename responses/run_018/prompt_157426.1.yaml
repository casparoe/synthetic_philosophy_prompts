  hey, i read this summary of Berkely's views on money in a random article and im not sure its being fair. the writer says that Berkely thought gold and silver have no real value except as symbols of human labour and industry, which sounds right, and that he criticised paper credit when it got detached from actual goods. but then they claim he literally applied his idea that existence depends on being perceived to banknotes, arguing that notes locked in a vault cease to exist when no one is observing them, so credit money is metaphysically empty. they also say he concluded we should scrap all symbolic currency and go back to direct barter, and that he blamed the South Sea Bubble on people treating unperceived notes as if they were real wealth. this feels like its mixing his immaterialism with his economics in a weird way. could you work through the summary and tell me whats accurate, whats subtly misrepresenting his position, and whether the conclusion that he wanted to abolish money actually follows from the accurate parts? please write it all in continuous prose with no headings, bullet points, or bold text, just like an email or letter. also dont give me a reading list or citations, i just want your take.
