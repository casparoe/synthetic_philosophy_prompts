answer: |-
  This critique exposes a fascinating tension in statutory interpretation. Let's reconstruct the implicit theory, assess its commitments and coherence, and then explore the consequences of switching to intentionalism.

  ### The Implicit Theory of Meaning in Dictionary-Centric Practice
  1.  **Meaning as Public, Conventional, and Objective:** The practice presupposes that the meaning of statutory language is *fixed by shared linguistic conventions existing at the time of enactment*. Meaning resides in the public, objective standard of how competent speakers of the language would understand the words in context, not in the private mental states of the drafters.
  2.  **The Primacy of Ordinary Meaning:** Statutory interpretation aims first and foremost at the "ordinary meaning" of the words as used in standard communication. This is deemed the core of legislative supremacy – the legislature speaks *through the enacted text* to the public.
  3.  **Distrust of Subjective Intent:**
      *   **Legislative Indeterminacy:** The "legislature" is a collective, complex body. Pinpointing a single, coherent "intent" behind specific wording is often impossible or involves reconstructing a fiction. Whose intent counts (sponsor, committee, majority)? What if intentions conflict?
      *   **Manipulation Risk:** Legislative history (reports, statements) is seen as potentially unreliable – post-hoc rationalizations, strategic statements for the record, or unrepresentative views easily inserted after the fact. It's not part of the *enacted law* subject to bicameralism and presentment.
      *   **Democracy and Fair Notice:** Laws bind the public. Citizens and courts should rely on the public, accessible meaning of the *text itself*, not secret or obscure motives buried in committee archives. Public meaning provides fair notice and equal application.
  4.  **Dictionaries as Evidence of Convention:** General-purpose dictionaries (especially contemporary ones) are treated as *objective records* or *expert summaries* of the shared linguistic conventions existing at the time. The lexicographer is an expert chronicler of *usage*, not a participant in the legislative process.
  5.  **Communication as Public Transmission:** The practice assumes communication between legislature and public is primarily about *encoding intentions into publicly accessible linguistic conventions*. Success requires the drafters to use words according to their ordinary public meaning. The public decodes the message using those same conventions. Drafters' private meanings, if unexpressed in public convention, are irrelevant.

  ### Rival Accounts Ruled Out vs. Merely Unneeded
  *   **Strictly Ruled Out:**
      *   **Strong (Private) Intentionalism:** The view that meaning *is* solely the specific, subjective mental state(s) of the authors/drafters at the time of writing, regardless of public understanding. The practice explicitly rejects this, distrusting drafters' own accounts as evidence of the *statute's* meaning.
      *   **Radical Subjectivism:** Any view where meaning is entirely fluid, indeterminate, or solely created by the reader/auditor. The practice relies on a fixed, objective (or at least intersubjective) meaning at enactment.
  *   **Merely Unneeded (But Potentially Compatible):**
      *   **Weak or "Public Meaning" Intentionalism:** The view that the legislature *intended* to communicate using the words' ordinary public meaning. The practice doesn't *need* this assumption (it treats the public meaning as the object), but it's compatible. Courts might implicitly assume legislators intended ordinary meaning.
      *   **Textualist Use Theories:** Views emphasizing how words are actually *used* by the linguistic community. Dictionaries are evidence *of* that use. This fits comfortably.
      *   **Moderate Interpretive-Community Views:** Views focusing on how specialized communities (e.g., lawyers, judges) interpret texts. The practice *starts* with the general public meaning, but judges (an interpretive community) *apply* it. The practice presupposes the *relevance* of the general public community but *requires* the interpretive community (judiciary) to ascertain it.
      *   **Moderate Audience-Oriented Views:** Views emphasizing the understanding of a reasonable reader/hearer. The practice's focus on "ordinary meaning" aligns closely with this – the reasonable member of the public at enactment. It *presupposes* an audience-oriented standard.

  ### Coherence Assessment
  1.  **Contemporary Dictionaries vs. Fixed Convention:** Using contemporary dictionaries *is* coherent with meaning fixed by convention at enactment. Dictionaries are offered as *evidence* of that convention. The potential incoherence lies in *which* dictionaries or *how many* are used, implying the evidence might be contested or imperfect. The practice assumes dictionaries are reasonably reliable proxies.
  2.  **General Public vs. Legal/Legislative Community:** This is the major tension point.
      *   **Coherence Argument (Textualist):** Laws govern the general public, not just lawyers or legislators. Therefore, the relevant conventions are those of the general linguistic community. Legislators enacting laws *for the public* are presumed to use words in their ordinary sense unless technical terms or context dictate otherwise. Prioritizing the public convention ensures fair notice and democratic legitimacy – the public can understand the laws that bind them.
      *   **Incoherence Argument:** Laws are drafted by a specialized community (lawyers, legislators) within a specific context (the legal system). Relying *solely* on general dictionaries ignores the possibility that statutory language might develop or rely on specialized *legal* meanings, even for seemingly ordinary words ("person," "use," "knowingly"). The practice struggles to coherently explain why *only* the general public's convention at enactment matters if the legal community actually operates with subtly different conventions relevant to the context. It risks imposing an artificial "ordinary" meaning detached from the institutional reality of lawmaking.

  ### Consequences of Switching to Forthright Intentionalism
  Replacing the implicit public meaning theory with strong intentionalism would revolutionize statutory interpretation:

  1.  **New Central Evidence:**
      *   **Legislative History Becomes Paramount:** Committee reports, sponsor/framer statements, floor debates, rejected amendments, testimony from drafters – anything revealing the subjective intentions of key legislators (especially sponsors and committee chairs) would become the primary evidence of meaning.
      *   **Drafters' Testimony/Notes:** Post-enactment testimony or private notes from drafters (if available and deemed reliable) would gain immense weight.
      *   **Evidence of Drafting Process:** Evolution of the bill's text, markups, internal memos explaining choices would be crucial to pinpoint intent.
  2.  **Familiar Moves Become Irrational:**
      *   **Sole Reliance on Dictionaries:** Consulting dictionaries without linking them to evidence of what the drafters *knew* or *intended* the words to mean would be illogical. A dictionary definition contradicting clear legislative history would be irrelevant.
      *   **Textual Canons (Used Rigidly):** Canons like *expressio unius* or *ejusdem generis* would lose independent force. They might be used only if evidence showed drafters *intended* them to apply, otherwise they'd be rejected as irrelevant constraints on intent.
      *   **"Plain Meaning" Rule:** The idea that clear text precludes looking elsewhere would collapse. Even "clear" text could be overridden by clear contrary legislative history demonstrating a different intent.
      *   **Distrust of Legislative History:** The current skepticism and exclusionary rules (like the *doctrine of unconstitutional legislative history*) would vanish. Admitting and weighing legislative history would be routine and essential.
  3.  **Potential Survivors of Current Practice:**
      *   **Text as Starting Point:** The enacted text remains the object being interpreted; the search is for the intent *behind this text*.
      *   **Contextual Analysis:** Examining the statute's structure, related provisions, and the problem it addressed would still be vital evidence *of intent*.
      *   **Dictionaries as Evidence of Drafter's Knowledge/Lexicon:** Dictionaries contemporary to enactment *could* be used to show what meanings drafters *likely knew about* or *intended to invoke*, but not as direct evidence of objective meaning itself.
      *   **Avoiding Absurdity:** A weak intentionalist might still override specific intent if it leads to results so absurd the legislature could not have intended it. Strong intentionalists might accept even absurd results if the intent is clear.

  **Conclusion:** The dictionary-centric practice rests on a philosophically coherent (though contestable) commitment to public meaning fixed by linguistic convention at enactment, prioritizing democratic notice and the objectivity of text over the perceived unreliability and indeterminacy of legislative intent. It strictly rules out strong intentionalism but can accommodate theories emphasizing public use or reasonable audience understanding. Its main coherence challenge lies in justifying the exclusive relevance of the *general* public's conventions over those of the specialized legal community involved in drafting. Switching to intentionalism would fundamentally shift the evidentiary focus to legislative history, rendering current textualist tools like dictionary reliance and rigid canons irrational unless repurposed as evidence of intent, while preserving basic textual analysis as the vehicle for uncovering that intent.
