answer: |-
  ### Simulation Design: The Bootstrap Problem in Source Criticism  
  **Scenario:** The destruction of a provincial archive in Lydia (Asia Minor) in 312 BCE during the wars of Alexander’s successors.  

  **Participants:** 8 students (collective decision-making group).  
  **Duration:** 90 minutes (45-minute simulation, 45-minute debrief).  
  **Materials:**  
  - 6 sealed **Source Cards** (front: testimony; back: critical filter).  
  - 1 **Timeline Board** (whiteboard or digital) to display admitted testimonies.  
  - **Point Tokens:** Each student starts with 10 tokens (no real money).  

  ---

  ### **Source Cards**  
  *(Testimony on front, critical filter on back; revealed only when admitted)*  

  1. **Card 0 (Foundation):**  
     - **Testimony:** *"In 312 BCE, Antigonus I’s army sacked Sardis and burned the provincial archive to erase records of his rival Seleucus’s legitimacy."*  
     - **Filter:** *Admit only sources mentioning Antigonus I.*  

  2. **Card 1:**  
     - **Testimony:** *"A clay tablet (found in Ephesus, 1920 CE) records a merchant’s letter: ‘The archive burned when rebels attacked Sardis to destroy tax records.’"*  
     - **Filter:** *Admit only eyewitness accounts.*  

  3. **Card 2:**  
     - **Testimony:** *"The historian Hieronymus of Cardia (310 BCE) wrote: ‘Lightning struck the archive during a storm, incinerating it by divine will.’"*  
     - **Filter:** *Admit only sources attributing the fire to human action (not gods/nature).*  

  4. **Card 3:**  
     - **Testimony:** *"A 3rd-century BCE Egyptian papyrus cites a spy: ‘Seleucus paid arsonists to burn the archive and frame Antigonus.’"*  
     - **Filter:** *Admit only sources dated within 20 years of 312 BCE.*  

  5. **Card 4:**  
     - **Testimony:** *"An inscription on a Sardis temple wall (311 BCE) states: ‘The archive was destroyed by the general Menander to conceal his embezzlement.’"*  
     - **Filter:** *Admit only sources corroborated by physical evidence.*  

  6. **Card 5:**  
     - **Testimony:** *"A later Roman historian, Livy (1st century BCE), claims: ‘The archive was accidentally burned by a clumsy scribe.’"*  
     - **Filter:** *Admit only sources from authors with no political bias.*  

  ---

  ### **Rules & Sequence**  
  **Goal:** Build a coherent timeline of the archive’s destruction. Points reward coherence (+1 per admitted card) and penalize contradiction (-2 per removed card).  

  1. **Setup (5 mins):**  
     - Each student gets 10 tokens.  
     - Admit **Card 0** to the timeline without applying any filter (it is the "foundation"). Reveal its filter (*Mention Antigonus I*).  

  2. **Round 1: Introduce Card 1 (10 mins):**  
     - **Task:** Apply **Card 0’s filter** to Card 1.  
     - **Outcome:** Card 1’s testimony does *not* mention Antigonus → **rejected**. No points change.  
     - *Timeline:* Card 0 only.  

  3. **Round 2: Introduce Card 2 (10 mins):**  
     - **Task:** Apply **Card 0’s filter** to Card 2.  
     - **Outcome:** Card 2 mentions Antigonus → **admitted**. Each student **+1 token**. Reveal its filter (*Human action*).  
     - **Reflexive Check:** Apply Card 2’s filter to all admitted cards (Card 0, Card 2).  
       - Card 0: Describes human action (army) → **stays**.  
       - Card 2: Attributes fire to lightning (non-human) → **contradiction! Remove Card 2**. Each student **-2 tokens**.  
     - *Timeline:* Card 0 only.  

  4. **Round 3: Introduce Card 3 (10 mins):**  
     - **Task:** Apply **Card 0’s filter** to Card 3.  
     - **Outcome:** Card 3 mentions Antigonus → **admitted**. Each student **+1 token**. Reveal its filter (*Within 20 years*).  
     - **Reflexive Check:** Apply Card 3’s filter to all admitted cards (Card 0, Card 3).  
       - Card 0: Undated in testimony → **instructor reveals it was written in 280 BCE (32 years later) → remove Card 0**. Each student **-2 tokens**.  
       - Card 3: Dated 3rd-century BCE (within 20 years? 288 BCE is 24 years later → **ambiguous**; instructor rules it **fails** → **remove Card 3**. Each student **-2 tokens**.  
     - *Timeline:* **Empty**.  

  5. **Round 4: Introduce Card 4 (10 mins):**  
     - **Task:** No admitted cards → **admit Card 4 without a filter** (replicating bootstrap). Each student **+1 token**. Reveal its filter (*Corroborated by physical evidence*).  
     - **Reflexive Check:** Apply Card 4’s filter to all admitted cards (Card 4).  
       - Card 4: Inscription is physical evidence → **stays**.  
     - *Timeline:* Card 4 only.  

  6. **Round 5: Introduce Card 5 (10 mins):**  
     - **Task:** Apply **Card 4’s filter** to Card 5.  
     - **Outcome:** Card 5 has no physical evidence → **rejected**. No points change.  
     - **Reflexive Check:** None (no new filter).  
     - *Final Timeline:* Card 4 only.  

  ---

  ### **Point Summary**  
  | **Action**                          | **Token Change** | **Total/Student** |  
  |-------------------------------------|------------------|-------------------|  
  | Initial tokens                      | +0              | 10                |  
  | Admit Card 0 (foundation)           | +0              | 10                |  
  | Admit Card 2                        | +1              | 11                |  
  | Remove Card 2                       | -2              | 9                 |  
  | Admit Card 3                        | +1              | 10                |  
  | Remove Card 0                       | -2              | 8                 |  
  | Remove Card 3                       | -2              | 6                 |  
  | Admit Card 4 (new foundation)       | +1              | 7                 |  
  | **Final Average**                   | **–3**          | **7**             |  

  **Outcome:** The timeline collapses from 3 testimonies to 1. Students end with fewer tokens than they started, experiencing "evidential erosion."  

  ---

  ### **Structured Debrief (45 mins)**  
  **Guiding Question:** *"When did you feel the ground slipping beneath your narrative?"*  

  1. **Map Rounds to Historical Source Criticism:**  
     - **Round 0 (Foundation):** Herodotus’ uncritical acceptance of *oral tradition* (e.g., Egyptian priests’ tales). The foundation is axiomatic but unexamined.  
     - **Rounds 1-2:** Thucydides’ empiricism—filtering for *human agency* and *eyewitnesses* (Card 2’s filter). Shows how criteria can backfire (Thucydides’ plague account relies on hearsay).  
     - **Round 3:** Leopold von Ranke’s *archival turn*—prioritizing contemporary sources (Card 3’s filter). Reveals temporal fragility; sources are excluded for being "too late."  
     - **Round 4-5:** Modern *corroboration standards* (Card 4/5 filters). Demonstrates circularity: physical evidence (Card 4) is privileged until bias/absence is questioned.  

  2. **The "Foundational" Exemption Moment:**  
     - **When:** Round 4, when the timeline emptied and Card 4 was admitted without filters.  
     - **Why Structurally Necessary:** All historical inquiry needs an entry point (e.g., state archives, "reliable" chroniclers). But this exemption is arbitrary—Card 4’s inscription could be forged or misinterpreted.  
     - **Philosophical Insight:** Criteria are *derived from* testimony (e.g., "eyewitness" standards come from testimonies *claiming* eyewitness status). This creates a loop: testimony justifies criteria that then exclude testimony.  

  3. **The Unsimulatable Absence:**  
     - **The Archive Itself:** The simulation cannot replicate the *material loss* of the archive. Students had proxy sources (cards); real historians face silence.  
     - **Instructor’s Verbal Addendum:** *"In reality, the Sardis archive is ash. We have no originals to verify the inscriptions, letters, or chronicles. Our ‘filters’ are built on secondary traces of a void."*  

  4. **Conclusion:**  
     - **Bootstrap Problem:** Rigor collapses the evidential base—filters from testimony invalidate testimony.  
     - **Pedagogical Payoff:** Students *felt* the paradox before naming it. The exercise mirrors real dilemmas (e.g., using biblical texts to critique biblical historicity).  

  ---

  **Instructor Notes:**  
  - **Pacing:** Keep rounds strict; use a timer.  
  - **Ambiguity:** Rule Card 3’s date as "fails 20-year filter" to force collapse.  
  - **Emphasis:** In debrief, stress that the "foundation" is a practical necessity but epistemologically unstable.  
  - **Adaptation:** If students resist removing Card 0, highlight this as proof of exemption’s psychological inevitability.
