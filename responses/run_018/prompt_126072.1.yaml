  hey i'm making a handout for a philosphy seminar and want a decison tree on the problem of universals that sorts people by what they actually think about properties, not by which -ism they like. start with a concrete case: two red apples — is there literally one thing they both have, or just two similar things? then branch through about 7 nodes: can that shared thing exist uninstatiated (like redness with no red things)? can one shared thing be in two places at once? if there's no shared thing, is exact resembance enough to explain sameness? are properties just mental groupings, and if so do they depend on actual human perceptual habits or on an ideal rational scheme? also include a node about artifacts vs natural kinds — does a chair's property of being-a-chair work the same way as being-red? the leaves should be Platonic realism, Aristotelian immanent realism, trope nominalism, resemblance nominalism, conceptualism (split perceptual vs rational if your tree allows), and class nominalism. flag any empty logical spots, like the combo that says shared things exist but can't be in two places and also can't exist alone — diagnose briefly why that's unstable or just empty. phrase every node as a question someone can answer without knowing the label it leads to. audience is grad students who know some metaphysics. no bibliography, no citations, no reading list. keep it casual, maybe a typo or two is fine.
