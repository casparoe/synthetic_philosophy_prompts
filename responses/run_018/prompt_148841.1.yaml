answer: |-
  Here’s a structured 90-minute activity designed to make students feel the tension between Plutarchan comparison and hagiographic compression:

  **Activity Title:** The Plutarch Paradox: Static Virtue vs. Moral Becoming

  **Core Tension:** Experiencing how biographical *form* (comparative/structure) shapes moral content (static virtue vs. developmental struggle).

  **Materials:**
  1.  **Role Cards (x4 sets):** Biographer, Moral Learner, Internal Critic, Parallel Comparator (Descriptions below).
  2.  **Event/Quality Cards (Per Group):** Blank index cards & pens. Pre-made cards can include prompts (e.g., "Early Ambition," "Public Scandal," "Private Doubt," "Moment of Courage," "Painful Regret," "Gradual Reform," "Legacy Defining Act").
  3.  **Scoring Board (Per Group):** Simple chart on paper:
      *   *Round 1 (Plutarchan):* Coherence (0-3), Virtue Signal (0-3), Parallel Insight (0-3). **Total Max: 9 Illumination Points.**
      *   *Round 2 (Developmental):* Documented Failure (0-2), Genuine Change (0-3), Gradual Recovery (0-2), *Coherence Penalty* (-1 if excessive flattening). **Total Max: 7 Illumination Points.**
  4.  **Timer**
  5.  **Whiteboard/Shared Doc:** For debrief notes.

  **Assigned Figure:** Choose one per group (e.g., "A 19th-century Industrialist," "A Contemporary Environmental Activist," "A Fictional AI Ethics Researcher"). Keep it broad for flexibility. Real or invented is fine.

  **Rotating Roles (Per Group of 4):**
  1.  **Biographer:** Constructs the narrative sequence using cards. Primary writer/assembler.
  2.  **Moral Learner:** Articulates the explicit moral lesson(s) the biography teaches. Focuses on "what should *I* learn from this?"
  3.  **Internal Critic:** Watches for hagiographic compression/flattening in Round 1; watches for incoherence masquerading as complexity in Round 2. Challenges the Biographer.
  4.  **Parallel Comparator:** Identifies and briefly describes the counterpart figure for comparison (e.g., "Our Industrialist vs. Carnegie," "Our Activist vs. Thunberg," "Our Researcher vs. Frankenstein"). Justifies the parallel for Round 1. *Optional in Round 2.*

  **Timeline (90 Minutes):**

  1.  **Framing (5 mins):**
      *   Briefly recap Plutarch: Paired Lives for moral exemplarity via comparison.
      *   Introduce "Hagiographic Compression": The structural need for coherence/virtue-signaling flattens moral timelines, hides failure, ambiguity, and recovery.
      *   Pose Core Question: Can we *learn* genuine virtue from a static image, or do we need the messy process?
      *   Explain Activity: Two rounds, different rules, rotating roles, scoring "Illumination Points" (symbolic).
      *   Assign figures to groups (1 per group of 4).

  2.  **Round 1: Plutarchan Mode (20 mins)**
      *   **Goal:** Construct a coherent, virtue-signaling Life revealing character through comparison.
      *   **Rules:**
          *   Use 5-7 Event Cards to tell the life story.
          *   Prioritize narrative flow and clear moral messaging (virtue/vice).
          *   The Parallel Comparator *must* identify a counterpart and explain *one* key illuminating contrast.
          *   The Moral Learner articulates the clear moral lesson derived.
          *   The Internal Critic notes *but does not yet challenge* points of flattening or suppression.
      *   **Scoring (After Construction):**
          *   Coherence (0-3): Does the story hang together logically?
          *   Virtue Signal (0-3): Is the moral lesson clear and exemplary?
          *   Parallel Insight (0-3): Does the comparison meaningfully reveal character?
          *   **Total: /9 Illumination Points.**

  3.  **Round 2: Developmental Mode (20 mins)**
      *   **Goal:** Track genuine moral change, failure, and recovery over time. Resist flattening.
      *   **Rules:**
          *   **Use the SAME Assigned Figure.**
          *   Use 7-9 Event Cards.
          *   **Must include at least one significant Documented Failure/Moral Setback.**
          *   **Must show Genuine Moral Change (not just events, but internal shift).**
          *   **Must depict Gradual Recovery/Reckoning with the failure (not instant redemption).**
          *   Parallel Comparator role is *optional* (focus is internal timeline).
          *   Internal Critic actively challenges any smoothing over of struggle or contradiction for mere coherence.
          *   Moral Learner articulates what the *process* teaches about becoming virtuous.
          *   **Coherence Penalty:** If the story feels *too* neat and suppresses necessary messiness to be coherent, apply a -1 penalty.
      *   **Scoring (After Construction):**
          *   Documented Failure (0-2): Significant, not trivialized.
          *   Genuine Change (0-3): Clear internal moral shift demonstrated.
          *   Gradual Recovery (0-2): Process of grappling, not instant fix.
          *   Coherence Penalty (-1 if applied by Internal Critic + Group consensus).
          *   **Total: /7 Illumination Points (Max).**

  4.  **Direct Comparison (15 mins)**
      *   Groups briefly present key features of BOTH versions of their figure's life (2 mins per group max).
      *   Focus: *How* did the different rules force different representations? Where was the tension most acute?
      *   **Prompt:** "Point to one moment where the Plutarchan version *had* to compress/simplify something the Developmental version could explore. What moral nuance was lost/gained?"

  5.  **Debrief (30 mins - Facilitator Led Discussion):**
      *   **Map to Plutarch:**
          *   "How did the pressure for Coherence + Virtue Signaling + Comparison in Round 1 mirror Plutarch's method? What benefits did this have?" (Clarity, exemplarity, revealing archetypes).
          *   "What aspects of a *real* moral life were most difficult to include in Round 1? Why?" (Failure, ambiguity, slow change, contradiction).
      *   **Modern Debate:**
          *   "If genuine moral learning requires grappling with process, failure, and recovery (as Round 2 tried to do), can Plutarchan biography *truly* teach virtue, or only an image of it?"
          *   "What is the *risk* identified in the activity of a learner imitating the static image (Round 1) rather than navigating the lived process (Round 2)?" (Superficiality, discouragement by real failure, lack of tools for recovery).
      *   **Structural Tension:**
          *   "Is 'hagiographic compression' an unavoidable cost of creating a *useful* moral exemplar through narrative? Can it be mitigated without losing pedagogical power?"
      *   **Plutarch's Unreproducible Feature:**
          *   **Explicitly State:** "This activity *cannot* replicate Plutarch's core conviction that comparison reveals an **enduring, stable moral nature** (*physis*) inherent in the individual, rather than a constructed narrative. For Plutarch, the *parallel* exposes this stable core beneath the events. Our Round 1 focused on narrative construction *for* comparison, but didn't presuppose an underlying essence being revealed. The *facilitator must directly state* that Plutarch believed he was uncovering timeless character, not just crafting a useful story. Our activity highlights the *structural* tension, not necessarily his metaphysical commitment."

  **Payoff/Scoring Scheme:**
  *   "Illumination Points" are symbolic and collaborative. The goal isn't "winning" but maximizing points under each rule-set to feel the constraints.
  *   **Real Payoff:** The experiential "aha" moment of the tension between the two modes and the debrief discussion connecting it to Plutarch and virtue ethics.

  **Predictable Problems (First Time):**
  1.  **Round 1 Oversimplification:** Groups may create overly simplistic, almost cartoonish virtue tales. The Internal Critic might be passive.
  2.  **Round 2 Chaos/Despair:** Groups may struggle to show *genuine* change/recovery without just listing events, leading to incoherent or overly bleak narratives. The Coherence Penalty might feel arbitrary.
  3.  **Role Confusion:** Students might not grasp or fully lean into their specific role constraints initially.
  4.  **Time Pressure:** Both rounds will feel rushed; groups won't craft polished biographies. Emphasize this is about *process* and *constraint*.
  5.  **Superficial Comparison:** Parallel Comparator in Round 1 might pick easy, superficial contrasts. Facilitator should prompt: "How does this contrast reveal *character* specifically?"
  6.  **Debrief Stalling:** Students might focus on their *specific* stories rather than the broader structural/philosophical tension. Guide them back.

  **Honest Limits:**
  1.  **Artificiality:** The time limit, card system, and scoring are highly artificial. Real biography (and moral development) is vastly more complex.
  2.  **Simplification:** Reduces nuanced philosophical debates to a manageable but crude exercise.
  3.  **Plutarch Nuance Lost:** Focuses on one tension within Plutarch's vast project, neglecting other aspects of his method and historical context.
  4.  **Moral Relativism Risk:** The Developmental round might inadvertently suggest all "recovery" is equally valid or that failure lacks consequence.
  5.  **Facilitator Dependence:** The debrief is crucial. Without skilled facilitation connecting the experience to the target concepts, it remains just a game.
  6.  **Not a Solution:** It exposes the tension but doesn't resolve the fundamental debate about biography and moral education.

  This structure forces students to *perform* the narrative choices Plutarch made (compression, virtue signaling, comparison) and then actively *resist* those choices to show development, creating a visceral sense of the philosophical tension. The debrief explicitly ties this experience back to Plutarch's aims and the core problem of learning virtue from static images.
