answer: |-
  Here is a cohesive normative argument structured according to your specifications, focusing on the ontological critique, the constitutive/transactional distinction, and addressing the normative objection:

  **Core Normative Claim:** Western anti-corruption frameworks, by universally classifying clientelism and ritual gift-giving as corruption based on an ontology of atomized individuals and impersonal bureaucracy, commit a fundamental categorical error when applied to political contexts where authority is relationally constituted. This misclassification is not merely a difference in perspective but an active conceptual violence that misdiagnoses legitimate social-political bonds as dysfunction, thereby undermining valid local conceptions of political legitimacy and ethical governance.

  **The Argument:**

  1.  **The Hidden Ontology of Western Anti-Corruption:** The prevailing Western paradigm rests on an unstated metaphysical foundation: the state is an abstract, impersonal machine servicing pre-social, autonomous individuals. Legitimate political action occurs only through formal, contractual relations devoid of durable personal obligation. Within this framework, *any* material exchange influencing political access appears as a "corruption" – a deviation where "private" interest illegitimately invades the "public" sphere. This assumes a strict, ontological separation between the autonomous individual citizen and the impersonal state official.

  2.  **The Relational Ontology of Authority:** In contrast, numerous political traditions derive authority not from an abstract social contract but from ongoing, embodied networks of reciprocal obligation. Here, persons are not atomized but are fundamentally constituted *through* their relational ties (kinship, patronage, communal bonds). Authority figures are not neutral functionaries but nodes within these webs. Gift-giving, clientelistic support, and ritual exchanges are not external bribes but the very *mechanisms* through which:
      *   Social hierarchies are acknowledged and reaffirmed.
      *   Mutual obligations (protection, provision, loyalty) are established and maintained.
      *   Political legitimacy is continuously generated and made tangible.
      In this ontology, the "public" official *is* inherently a relational actor; their authority is inseparable from their embeddedness.

  3.  **The Crucial Distinction: Transactional vs. Constitutive:**
      *   **Transactional Corruption:** This *does* exist universally and aligns with the Western concern: a specific, clandestine exchange where a *pre-defined, impersonal state function* (e.g., issuing a permit, awarding a contract) is deliberately perverted by an official in return for a *private, materially quantifiable benefit* for personal enrichment. This severs the official's duty to the abstract system.
      *   **Constitutive Reciprocity:** This is categorically distinct. The exchange (gift, service, support) is not payment for a predefined state action. Instead, it *creates or sustains the social bond itself* that makes the authority figure *recognizable as such* within that relational framework. The "gift" is not a bribe for a service, but an act that reaffirms the structure of obligation *within which* future political actions will be understood as legitimate. It operates in the open, governed by social norms, and binds both parties into a durable relationship of mutual, though asymmetric, responsibility.

  4.  **The Western Framework as Actively Misleading (Beyond Cultural Relativism):** Classifying constitutive reciprocity as "corruption" is not simply applying a different cultural standard. It is an *ontological misrecognition*:
      *   It mistakes a foundational social-political bond (the constitutive act) for its pathological perversion (the transactional bribe).
      *   It imposes an alien model of personhood (atomized individual) and statehood (impersonal machine) onto contexts where these concepts lack coherence. Authority *is* the network; the official *is* the relation.
      *   This misdiagnosis pathologizes the normal functioning of legitimate political order in those contexts, framing essential social glue as systemic failure. It renders the actual source of political stability and ethical obligation (fulfilling relational duties) invisible or illegitimate according to the imposed framework.

  5.  **Addressing the Normative Objection: Distinguishing Healthy Reciprocity from Predation:** Abandoning the universal Western standard does not mean abandoning normative judgment. We can distinguish ethical constitutive reciprocity from predatory extraction using criteria *internal* to relational legitimacy:
      *   **Durability & Social Continuity:** Healthy reciprocity aims to sustain the long-term relationship and social fabric. The obligation is ongoing and mutual (though asymmetric). Predatory extraction is parasitic: it maximizes short-term, one-sided gain for the powerful actor, *dissolving* the relationship's future potential or draining the constituent/vassal/client beyond sustainable limits. It breaks the cycle of reciprocity.
      *   **Scale of Rupture:** Does the act primarily bind individuals/groups within the existing social structure, reinforcing recognized hierarchies and obligations? Or does it catastrophically rupture essential social bonds (e.g., seizing vital subsistence resources, denying fundamental protection owed, enslaving) for personal aggrandizement, thereby destroying the very relational foundation it supposedly operates within?
      *   **Embeddedness vs. Alienation:** Healthy reciprocity operates within and reinforces shared, understood norms of obligation. Predatory extraction often involves a detachment from these norms, where the powerful actor uses their position *against* the relational ethos for purely self-referential gain, becoming an alien force within the system they exploit.
      *   **The "Public" Within the Relational:** Even in relational systems, certain core communal goods exist (e.g., collective defense, essential ritual order, vital resource commons). Predation occurs when relational exchanges catastrophically undermine these fundamental communal goods for the benefit of a specific dyad or faction, perverting the system's purpose. Healthy reciprocity sustains them.

  **Conclusion:** The Western anti-corruption framework's universal condemnation of clientelism and gift-giving is not a neutral application of objective standards but the imposition of a specific, culturally bound ontology onto fundamentally different political realities. By failing to grasp the constitutive role of reciprocal obligation in generating relational authority, it mislabels the lifeblood of those systems as corruption. This is actively misleading and normatively violent. Ethical judgment within relational contexts remains possible by focusing on whether practices sustain or destroy the durable bonds of mutual obligation that constitute legitimate authority, distinguishing constitutive reciprocity from its predatory perversion. Recognizing this ontological difference is essential for a truly comparative political ethics.
