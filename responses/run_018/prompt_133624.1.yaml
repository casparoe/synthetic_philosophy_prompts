  I was having a pint with a mate who does decision theory, and he started going on about Good's theorem — the bit where a rational Bayesian should never refuse free information before making a choice, since you can always ignore it if it doesn't shift your beliefs. I reckon I get the maths in principle, but I'm trying to figure out what it actually implies for real-world cases where learning something doesn't just update your credences but also creates downstream duties. I've been calling these "obligation cascades": say you can check your garden soil for free, but if you find contamination you're then legally forced into an expensive remediaton, so knowing becomes a kind of liability trigger.

  Please describe the most important implicatons of Good's theorem on the value of information specifically for these obligation cascades — especially whether the possibility of being locked into costly action can make ignorance rational after all. I'd like exactly five points, each just a sentence or two, with no intro or conclusion, just the numbered list. Write it in casual British English; I'm a bit tired and there's probably a typo or two in my message so don't over-polish it.
