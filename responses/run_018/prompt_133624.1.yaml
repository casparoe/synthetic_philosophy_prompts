answer: |-
  Righto, here’s the breakdown for those awkward obligation cascade situations:

  1.  **Good's default "always take free info" gets overruled** when the info itself triggers a binding duty, because knowing *forces* costly action you could otherwise avoid by staying ignorant, fundamentally changing the decision landscape.
  2.  **It hinges on asymmetric outcomes:** if finding out *bad* news locks you into expense but *good* news doesn't change anything (or saves you money), then knowing might make you worse off *on average* than blissful ignorance.
  3.  **The calculation flips to expected *total* costs:** you've got to weigh the *risk* of discovering something that forces your hand into spending big, against the potential (but maybe tiny) benefit of knowing positive/neutral info you can safely ignore.
  4.  **Choosing ignorance can be the rational play strategically,** specifically when the cost of the *potential obligation* triggered by bad news outweighs any possible upside from getting the information, even if the info itself is free.
  5.  **The critical factor is *knowing the rule exists*:** you can only make this "rational ignorance" call if you *already know* that discovering X would legally/morally force Y action – unknown unknowns still favour Good's original take.
