  Hmm, the key challenge is crafting humor that lands only if you grasp Nozick's core argument: that voluntary transactions override patterned distribution principles. The digital clone hypothetical their professor mentioned suggests exploring modern parallels like AI token payments. I should set the joke in a tech context - maybe an LLM accumulating wealth through microtips while other algorithms stay poor, mirroring Chamberlain's basketball scenario.

  The user emphasized three non-negotiables: 1) must turn on historical vs patterned justice distinction 2) must reference all three entitlement principles 3) punchline requires understanding why voluntary exchanges justify resulting inequality. No room for lazy capitalism jokes. 

