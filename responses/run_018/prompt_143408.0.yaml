  Third, on inductive bias being a real answer: Calling biases "unavoidable" feels like admitting we're trapped in our cognitive frameworks without external validation. That pushes the mystery to why these biases work, which is circular. 15% chance it's a full solution, though it's the best we have practically. 

  Combining these: The highest uncertainty is in the third point (bias justification). If someone proved our biases necessarily align with reality (e.g., via evolutionary cognition studies), I'd raise that 15%. But currently, it's philosophically unsatisfying. 

