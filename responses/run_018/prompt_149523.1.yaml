  First, I need to pinpoint the core ideas. Moderate nationalism argues that shared citizenship creates obligations through institutions like taxes or social contracts. Strong cosmopolitanism treats nationality as irrelevant; only individual needs matter. The reversal must come from the theories themselves, not stupidity.  

  The key is finding a scenario where institutional ties create a unique obligation to foreigners. What if a compatriot benefits from the system but the foreigner doesn't? For example, a town council with funds for playgrounds. A foreign child has no access to safe play areas because they're excluded from local resources. A local child has access but the playground is outdated.  

  Moderate nationalism: The town's institutions exist because citizens contribute (taxes, participation). They have a duty to maintain trust in these institutions. Helping the foreigner, who lacks alternatives, fulfills a broader institutional obligation—maybe to uphold fairness or community values. Ignoring the foreigner could undermine the system's legitimacy.  

  Strong cosmopolitanism: Focuses solely on need. The local child's playground is unsafe, posing immediate risk. The foreign child's problem is chronic but less urgent. So, fix the local playground first—it's the most pressing need.  

  The critical feature is how institutional access affects obligations. Remove that, and it collapses into the usual "help citizens" vs. "help neediest." For instance, if the foreigner has alternatives elsewhere, the nationalist might prioritize the local. If both have equal access, cosmopolitanism would help the neediest regardless of origin.  

  User's deeper need: They want to transcend tribal debates by forcing each theory into uncomfortable territory. This exposes nuances—e.g., nationalism isn't always exclusionary, cosmopolitanism isn't always universally charitable. The thought experiment reveals how institutional context shapes moral duties in non-obvious ways.  

