answer: |-
  Here's a thought experiment designed to flip the script:

  **Scenario: The Town Park Funds**
  Riverbank Town has limited funds to renovate its only public playground. The equipment is outdated but still functional for local children. Simultaneously, a group of migrant farmworkers, here legally for the season but not citizens or residents, live in crowded temporary housing just outside town. Their children have no safe play space, playing dangerously near a busy road. The town council must decide: use the funds to **A) Replace the outdated local playground** (benefiting established citizen children with *some* safe play) or **B) Build a basic, safe play area near the migrant housing** (benefiting foreign children with *no* safe play). Assume costs and number of children are equal.

  **Analysis:**

  1.  **Moderate Nationalism (Shared Institutions):** This view emphasizes obligations created through shared participation in civic institutions (like paying local taxes, voting for the council, participating in community life). Local families contribute to and rely on the *system* that built and maintains the town park. Replacing the outdated equipment fulfills a specific, pre-existing obligation *to citizens* inherent in that shared institutional framework – it’s maintaining a service they collectively built and fund. The migrant workers, while present, are not part of *this specific institutional loop*; they don't pay local property taxes funding parks, vote for the council, or have a long-term stake. *However*, the argument *for* helping them arises from the *nature* of the institution itself. The town park system exists under principles of public provision and safety. Letting children (any children) play dangerously on the roadside *directly undermines the core purpose and legitimacy* of the town's institution responsible for child safety and public space. Fulfilling the institution's broader mission – ensuring safe play for children within the town's physical sphere of influence – requires addressing the acute, total lack faced by the foreign children *first*, even if the primary obligation structure is citizen-focused. Helping *here* maintains the integrity and purpose of the institution.

  2.  **Strong Cosmopolitanism (Moral Equality):** This view sees nationality as irrelevant. The only morally significant factors are the needs and well-being of the individuals involved. Both groups of children need safe play. The key difference is the *severity* of the need: the local children have *some* safe (if suboptimal) play space, while the migrant children have *none* and face immediate danger. Cosmopolitanism focuses on alleviating the *worst-off first*. The migrant children are clearly worse off – they have zero access to safe play and face active hazards. Therefore, the strong cosmopolitan imperative is to build the new play area for the migrant children, addressing the most urgent deprivation. The outdated local equipment is a lesser need.

  **The Reversal & The Critical Feature:**

  *   **Moderate Nationalism Helps the Foreigner:** Because the *integrity and purpose of the shared institution* (the town's public safety/parks system) is undermined by the *total exclusion* and immediate danger faced by the foreign children *within its practical domain*. Failing to act makes the institution hypocritical to its own function.
  *   **Strong Cosmopolitanism Helps the Compatriot:** Because, counter-intuitively, the *local children are arguably worse off in this specific comparison*. They have access to unsafe equipment posing a risk, while the migrant children have *no equipment* but are playing near a road – both are hazardous. If the cosmopolitan judges the *existing local equipment* as posing a *greater immediate risk* (e.g., higher chance of injury from broken equipment) than the *roadside play* (perhaps deemed a lesser or equal risk), then the *local* children have the more urgent safety need. Cosmopolitanism, prioritizing need severity, would then demand fixing the known, high-risk local hazard first.

  **The Critical Feature Doing the Work:**

  *   **Asymmetrical Institutional Access/Exclusion:** Specifically, **foreigners being completely excluded from the benefits of an institution whose core purpose is directly undermined by that exclusion within its operational scope**, combined with a **potential ambiguity/comparison in the severity of the needs faced by included vs. excluded groups**.

  **What Happens Without This Feature?**

  Remove the **total exclusion undermining the institution's core purpose** or the **ambiguity in need severity**:

  1.  **Clearer Institutional Obligation:** If the migrants *weren't* excluded in a way that blatantly contradicted the park system's safety purpose (e.g., they had their own safe space elsewhere), moderate nationalism would likely prioritize the citizen obligation (renovating the local park).
  2.  **Clearer Need Disparity:** If the migrant children's situation was unambiguously more dangerous (e.g., playing on a highway median) or the local equipment was unambiguously safer, strong cosmopolitanism would clearly prioritize the migrants.
  3.  **Result:** The scenario collapses back into the standard "Nationalism favors compatriots / Cosmopolitanism favors the neediest (often the foreigner)" dynamic. The reversal requires the specific tension where the *institution's own logic* pushes nationalism towards the foreigner and a *nuanced comparison of risks* pushes cosmopolitanism towards the compatriot.

  This scenario forces each theory to confront an internal tension: nationalism must justify why upholding its institution *requires* helping outsiders this time, while cosmopolitanism must grapple with the uncomfortable possibility that, when needs are finely balanced, existing infrastructure might make compatriots *appear* (or actually be) worse off in a specific, measurable way.
