prompt: |-
  hey, im a software engineer maintaining a dataset that tags causes behind big historical events, and my team keeps fighting over whether non-human stuff—like the 1815 Tambora eruption, cholera germs, or a 200-year climate shift—should be labeled "historical actors" or just background conditions. i skimmed some stuff about germs and climate being "actors" but i really dont want to fall into that environmental determinism trap where every riot is just weather.

  can you turn that idea into a reusable procedre i can actually run? im tagging maybe 20 entries a week, i get about 5 minutes per case, and my manger (zero philosoophy background) has to sign off. i need it in checklist form: the questions in order, what counts as passing each one, where the procedre stops with a hard "no, not an actor", and where its just a value call that needs a human. be honest about which steps are judgment calls dressed up as rules.

  run it on three cases:
  1. the Tambora eruption in 1815 leading to crop failures and then the 1816 "year without summer" riots
  2. tagging the specific cholera strain involved in the 1854 broad street pump outbreak
  3. a slow 200-year aridifcation that gradually forced a migration

  include one where the checklist spits out "actor" but it feels wrong to me. also flag the spots where the procedre breaks down and i just have to use my gut, because i need to know those in advance so i dont pretend its objective.

  no citations needed, just keep it usable for someone with no formal background.
reasoning: |-
  We are creating a checklist to determine if a non-human entity should be labeled as a "historical actor" in the context of a historical event. The goal is to avoid both under-tagging (missing important non-human actors) and over-tagging (falling into environmental determinism). The checklist should be a step-by-step procedure with clear pass/fail conditions and should indicate when a judgment call is required.

  Checklist Questions:

  1. **Specificity and Identifiability**: 
     - Question: Can the non-human entity be specifically identified (e.g., named, pinpointed in time and space) rather than being a general background condition?
     - Pass: It is a discrete event, a specific entity, or a well-defined process (e.g., "the Tambora eruption", "Vibrio cholerae strain X", "the aridification period from year X to Y").
     - Fail: It is a vague or general condition (e.g., "weather", "disease in general", "climate change" without specific definition). If fail, stop: NOT AN ACTOR.
     - Judgment Call? Low: This is mostly objective.

  2. **Causal Mechanism**: 
     - Question: Is there a documented and direct causal chain linking the entity to the historical event, with minimal intervening factors?
     - Pass: The entity directly triggers a sequence of events (e.g., eruption → ash cloud → climate change → crop failure → riots). The connection is well-established and proximate.
     - Fail: The entity is a distant, indirect, or one-among-many factor (e.g., "the climate was generally arid" without a clear link to the specific migration event). If fail, stop: NOT AN ACTOR.
     - Judgment Call? Medium: Requires some historical knowledge to assess causality.

  3. **Agency-like Behavior** (this is the trickiest to avoid determinism):
     - Question: Does the entity act in a way that resembles agency (i.e., it initiates change, disrupts the status quo, and its effects are not easily predictable or controllable by contemporary humans)?
     - Pass: The entity's actions are sudden, impactful, and beyond human control or expectation (e.g., a sudden eruption, a new pathogen causing a pandemic). It is a "game-changer".
     - Fail: The entity is a slow, predictable, or constant pressure (e.g., a very gradual climate trend that people could adapt to over generations). If fail, stop: NOT AN ACTOR.
     - Judgment Call? High: This is where environmental determinism creeps in. We are looking for "event-like" qualities.

  4. **Historical Recognition**:
     - Question: Was the entity recognized as a significant force by people at the time? (This helps avoid imposing modern hindsight.)
     - Pass: There is evidence that contemporaries identified the entity as a cause (e.g., newspapers blaming the weather for riots, doctors identifying the water pump as the source of cholera).
     - Fail: The entity's role is only inferred by modern historians without contemporary acknowledgment. If fail, move to step 5 (this isn't an automatic fail).
     - Judgment Call? Medium: Requires checking historical sources.

  5. **Exclusion of Human Mediation**:
     - Question: Is the entity's impact primarily due to its own properties, rather than being amplified or channeled by human decisions? (This helps avoid giving non-humans undue credit when human actions were the main driver.)
     - Pass: The entity would have caused similar effects regardless of human systems (e.g., the cholera bacteria would infect regardless of sanitation choices; the volcano erupts regardless of human settlement).
     - Fail: The entity's impact was heavily dependent on human choices (e.g., a famine that was avoidable with better policies, but the government failed). In such cases, the human decisions are the actors, not the non-human entity. If fail, stop: NOT AN ACTOR.
     - Judgment Call? High: Requires disentangling natural and human factors.

  6. **Irreplaceability**:
     - Question: If you removed this specific entity from the story, would the event likely not have happened? (This is a counterfactual test.)
     - Pass: The event is uniquely tied to this entity (e.g., no Tambora → no "year without summer" → no specific riots; no Broad Street pump contamination → no outbreak in that form).
     - Fail: The event might have occurred anyway due to other factors (e.g., riots due to underlying social tensions even without crop failure; cholera outbreak from another source). If fail, stop: NOT AN ACTOR.
     - Judgment Call? High: Counterfactuals are always speculative.

  **Procedure Flow**:
  - Answer each question in order. 
  - If any step fails (and says "stop"), then the entity is NOT tagged as an actor. 
  - Only if all steps pass (or step 4 fails but the others pass) do we tag it as an actor. 
  - Note: Step 4 is the only one that doesn't cause an automatic stop on failure.

  **Important Caveats**:
  - Steps 3, 5, and 6 are where the most judgment is required. The checklist can't remove subjectivity entirely, but it structures the decision.
  - If the entity passes but you feel uneasy (e.g., it feels like giving too much credit to non-humans), that might be because of step 5 (human mediation) or step 6 (irreplaceability) being borderline. Document that uncertainty in the notes for your manager.

  Now, let's run the three test cases:

  ---

  **Case 1: Tambora eruption (1815) leading to crop failures and the 1816 "year without summer" riots**

  1. **Specificity**: Tambora is a specific eruption (1815, Indonesia). Pass.
  2. **Causal Mechanism**: Direct chain: eruption → ash cloud → global cooling → crop failures → food shortages → riots. Well-documented. Pass.
  3. **Agency-like Behavior**: Sudden, massive eruption, unpredictable and beyond human control. It was a game-changer. Pass.
  4. **Historical Recognition**: Contemporaries noted the "year without summer" and linked it to weather (though they didn't know about Tambora specifically). But they recognized the weather as a cause. Pass (with some leniency because they didn't know the volcano, but they knew the effect).
  5. **Exclusion of Human Mediation**: The climate effects would have occurred regardless of human systems. Human policies (e.g., grain storage) might have mitigated but didn't cause the effect. Pass.
  6. **Irreplaceability**: Without Tambora, the specific extreme weather of 1816 likely wouldn't have occurred, and the riots might not have happened in that form. Pass.

  Result: **Actor** (passes all). Note: The riots also had human factors (e.g., government response), but Tambora is still an actor in triggering the chain.

  ---

  **Case 2: Specific cholera strain in the 1854 Broad Street pump outbreak**

  1. **Specificity**: The specific strain (Vibrio cholerae) in the Broad Street pump is identifiable. Pass.
  2. **Causal Mechanism**: Direct: contaminated water → ingestion of bacteria → cholera outbreak. Proximate cause. Pass.
  3. **Agency-like Behavior**: The bacteria acted unpredictably (at the time) and caused a sudden outbreak. Pass.
  4. **Historical Recognition**: John Snow identified the pump as the source during the outbreak. Contemporaries recognized the link. Pass.
  5. **Exclusion of Human Mediation**: The bacteria causes disease by its nature. Human sanitation choices allowed it to spread, but the biological effect is independent. Pass.
  6. **Irreplaceability**: Without that specific contamination, the Broad Street outbreak wouldn't have happened (though cholera might have occurred elsewhere). Pass.

  Result: **Actor** (passes all). Note: The pump itself is a human-built object, but the strain is a non-human actor.

  ---

  **Case 3: Slow 200-year aridification forcing a migration**

  1. **Specificity**: If defined as a specific period (e.g., "the aridification from 1600-1800 in region X"), it passes. Pass.
  2. **Causal Mechanism**: Gradual drying → reduced agricultural productivity → migration. But it's indirect and slow. Fail? (Step 2: Causal Mechanism) - because it's gradual and there are many intervening factors (e.g., human adaptation strategies). Let's say Fail -> stop: NOT AN ACTOR.

  But let's continue for the sake of the exercise (if we were to ignore the fail):

  3. **Agency-like Behavior**: Slow and predictable; does not resemble a discrete actor. Fail. Stop: NOT AN ACTOR.
  4. (If we reached it) **Historical Recognition**: People may have noticed the drying, but it's unlikely they saw it as a single force. Probably fail.
  5. **Exclusion of Human Mediation**: Human decisions (e.g., land use) might have interacted with the drying. Hard to say, but likely human mediation was key. Fail.
  6. **Irreplaceability**: The migration might have been caused by other factors (e.g., war, economic change). Fail.

  Result: **Not an actor** (fails at step 2 or 3). This is a background condition.

  ---

  **Requested Edge Case: One where the checklist says "actor" but feels wrong**

  Let's create a hypothetical: **A specific locust swarm (e.g., 2020 East Africa locust swarm) that caused famine.**

  1. **Specificity**: The 2020 East Africa swarm is specific. Pass.
  2. **Causal Mechanism**: Swarm → crop destruction → famine. Direct. Pass.
  3. **Agency-like Behavior**: Swarms are unpredictable and disruptive. Pass.
  4. **Historical Recognition**: Widely reported as a cause. Pass.
  5. **Exclusion of Human Mediation**: Locusts eat crops by nature. Pass.
  6. **Irreplaceability**: Without the swarm, that specific famine might not have occurred. Pass.

  Result: **Actor** by the checklist. But why might it feel wrong? 
  - Because the famine might have been avoidable with better pest control (human mediation, step 5) or because underlying vulnerabilities (poverty, conflict) were the real cause (step 6). 
  - This is where the checklist forces a tag, but you should note: "Human factors (e.g., lack of preparedness) were essential, but the locusts are still a direct trigger."

  **Breakdown Points** (where the procedure relies on judgment and may break down):
  - **Step 3 (Agency-like Behavior)**: What counts as "unpredictable" or "game-changer"? A slow process might be seen as such in hindsight. This is a value call.
  - **Step 5 (Exclusion of Human Mediation)**: Almost all non-human factors interact with human systems. We are trying to isolate cases where the non-human is the primary driver, but it's often entangled.
  - **Step 6 (Irreplaceability)**: Counterfactuals are speculative. We can never be sure.

  **Recommendation for Use**:
  - For each case, go through the steps in order. 
  - If a step fails and says "stop", tag as "not an actor". 
  - If it passes all, tag as "actor". 
  - For steps 3, 5, and 6, if you're unsure, flag the case for review and note the uncertainty for your manager. 
  - Remember: The tag doesn't mean the non-human is the ONLY actor, just that it meets the criteria to be considered one among others.

  This checklist should help structure the debate and make your tagging more consistent.
answer: |-
  ### Non-Human "Historical Actor" Decision Checklist  
  **Use this procedure in order. Stop early if any step fails with "NO, NOT AN ACTOR". Flag judgment calls with ⚠️ for manual review.**  
  **Time budget:** ~5 minutes per case. Manager sign-off needed for ⚠️ steps.  

  #### Checklist Questions  
  1. **🔍 Specific Identity Test**  
     - *Question:* Can you point to it like a named character? (e.g., "Tambora volcano," not "volcanoes in general").  
     - *Pass:* Specific entity/event (e.g., a particular strain, eruption, or defined climate period).  
     - *Fail:* Vague force (e.g., "bad weather," "disease").  
     - **→ FAIL = STOP. NOT AN ACTOR.**  

  2. **⛓️ Direct Trigger Test**  
     - *Question:* Did it *directly* start a chain reaction within 1-3 years? (e.g., eruption → immediate famine).  
     - *Pass:* Clear short-term causation (≤3 years).  
     - *Fail:* Slow burn (>10 years) or indirect (e.g., "climate made societies weaker... eventually").  
     - ⚠️ *Judgment call:* Causation vs. correlation isn't always clear-cut.  
     - **→ FAIL = STOP. NOT AN ACTOR.**  

  3. **💥 Disruption Test**  
     - *Question:* Was its impact sudden and unpredictable *to people at the time*?  
     - *Pass:* Caught contemporaries off-guard (e.g., surprise outbreak/eruption).  
     - *Fail:* Predictable outcome (e.g., gradual drought farmers adapted to).  
     - **→ FAIL = STOP. NOT AN ACTOR.**  

  4. **👥 Human Amplifier Test**  
     - *Question:* Could humans have *easily* stopped the outcome? (Focus: is the non-human force *irresistible*?)  
     - *Pass:* Humans couldn't neutralize it (e.g., no stopping a volcano/cholera pre-vaccines).  
     - *Fail:* Humans enabled it (e.g., riots happened *only* because leaders hoarded grain).  
     - ⚠️ **CRITICAL JUDGMENT CALL:** This is where determinism hides. If unsure, flag for review.  
     - **→ FAIL = STOP. NOT AN ACTOR.**  

  5. **📜 Contemporaneous Blame Test**  
     - *Question:* Did people *at the time* blame it? (Avoids modern hindsight bias).  
     - *Pass:* Historical records cite it as a cause (e.g., 1816 diaries blame "the weather").  
     - *Fail:* Only historians retroactively credit it.  
     - ⚠️ *Judgment call:* Spotty records? Use best evidence.  
     - **→ PASS = TAG AS ACTOR**  
     - **→ FAIL = TAG AS "BACKGROUND CONDITION"**  

  ---

  ### Test Runs  
  #### Case 1: Tambora Eruption (1815 → crop failure → 1816 riots)  
  1. **🔍 Specific Identity:** Named eruption (Tambora). **PASS**.  
  2. **⛓️ Direct Trigger:** Eruption (1815) → immediate climate chaos → 1816 riots. **PASS**.  
  3. **💥 Disruption:** Totally unpredictable; no vulcanology in 1815. **PASS**.  
  4. **👥 Human Amplifier:** No one could stop ash blocking the sun. Riots amplified by human policies? ⚠️ **PASS (but note: human greed worsened famine)**.  
  5. **📜 Contemporaneous Blame:** Diaries/blames "the year without summer." **PASS**.  
  → **VERDICT: ACTOR**  

  #### Case 2: Cholera Strain (1854 Broad Street Pump)  
  1. **🔍 Specific Identity:** *Vibrio cholerae* strain in the pump. **PASS**.  
  2. **⛓️ Direct Trigger:** Pump contamination → immediate outbreak. **PASS**.  
  3. **💥 Disruption:** Germ theory unknown in 1854; outbreak was shocking. **PASS**.  
  4. **👥 Human Amplifier:** Humans built the pump, but germs infected independently. **PASS**.  
  5. **📜 Contemporaneous Blame:** John Snow's map blamed the pump. **PASS**.  
  → **VERDICT: ACTOR**  

  #### Case 3: 200-Year Aridification (causing migration)  
  1. **🔍 Specific Identity:** Defined 200-year period. **PASS**.  
  2. **⛓️ Direct Trigger:** Slow effect (>10 years); migration was gradual. **FAIL**.  
  → **VERDICT: NOT AN ACTOR (STOPPED AT STEP 2)**  

  #### Edge Case: Where Checklist Says "Actor" But Feels Wrong  
  **Hypothetical: A genetically unique wheat blight (1845) causing the Irish Famine.**  
  1. **🔍 Specific Identity:** *Phytophthora infestans* strain. **PASS**.  
  2. **⛓️ Direct Trigger:** Blight → immediate crop loss → famine. **PASS**.  
  3. **💥 Disruption:** Unknown fungus; devastated crops overnight. **PASS**.  
  4. **👥 Human Amplifier:** *Here’s the rub:* British policies exported food, worsening starvation. **⚠️ DEBATABLE PASS (fungus caused blight, but famine was human-amplified)**.  
  5. **📜 Contemporaneous Blame:** Farmers blamed "the blight." **PASS**.  
  → **VERDICT: ACTOR (by checklist)**  
  **Why it feels wrong:** Human choices turned blight into genocide. Checklist forces "actor" tag for the blight, but **manager must review ⚠️ Step 4** to acknowledge human co-responsibility.  

  ---

  ### Where the Procedure Breaks Down (Use Your Gut)  
  - **Step 4 (Human Amplifier):** The line between "irresistible force" and "human-enabled disaster" is **always subjective**. Example:  
    - *Tambora's famine:* Humans couldn’t stop ash, but hoarding made famine deadly. Is the volcano still the "actor"?  
    - *Solution:* Tag non-human as actor **but add a note** like: "Human factors amplified outcome."  
  - **Step 2 (Direct Trigger):** "Direct" vs. "indirect" is fuzzy for slow-moving forces (e.g., soil depletion over 50 years).  
  - **Manager Alert:** Always flag cases passing Step 4 ⚠️ for review—this is where philosophy debates hit hardest.  

  ### TL;DR Workflow  
  ```plaintext
  1. Named thing? → No = STOP (not actor).  
  2. Fast trigger? → No = STOP (not actor).  
  3. Unpredictable? → No = STOP (not actor).  
  4. Humans couldn't stop it? → Unsure = ⚠️ FLAG FOR MANAGER.  
  5. Blamed at the time? → Yes = Tag "ACTOR". No = Tag "BACKGROUND".  
  ```  
  **Output options:** ACTOR / BACKGROUND / ⚠️ MANAGER REVIEW NEEDED (Step 4 conflict).
