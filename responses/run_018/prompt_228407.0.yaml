  Below is a decision tree for escaping Sen's liberal paradox, designed as a one-page flowchart. It uses the Prude-Lewd example (states: N = no one reads, P = Prude reads, L = Lewd reads, B = both read) to ground key questions. The tree has 7 branch nodes (concrete questions) and 7 leaves (resolutions with costs). Combinations are logically coherent unless marked otherwise. Embarrassing nodes are flagged (⭐), and near-indistinguishable leaves are identified.

  ---

  **Decision Tree: Escaping the Liberal Paradox**  
  *Start after accepting Sen's proof that minimal liberalism (ML), weak Pareto (WP), and unrestricted domain (UD) conflict.*

  1. **When comparing N and P (differs only in Prude’s action), should Lewd’s preference about {N, P} count in social welfare?**  
     - *Yes* → Go to 2  
     - *No* (only Prude’s preference matters) → Go to 5  

  2. ⭐ **When comparing L and N (differs only in Lewd’s action), should Prude’s preference about {L, N} count?**  
     - *Yes* → Go to 3  
     - *No* (only Lewd’s preference matters) → **Leaf: Restricted Pareto**  
       *Cost: Requires defining "meddlesome preferences" (circular/arbitrary in hard cases).*

  3. **Given meddlesome preferences count everywhere, should WP apply only to non-meddlesome pairs?**  
     - *Yes* → **Leaf: Restricted Pareto** (as above)  
     - *No* → Go to 4  

  4. **Must social preferences be complete and transitive?**  
     - *No* → **Leaf: Incompleteness**  
       *Cost: Social choice may be indeterminate (e.g., no winner in Prude-Lewd standoffs).*  
     - *Yes* (prioritize ordering over rights) → **Leaf: Weakened Liberalism**  
       *Cost: ML rights sacrificed when they conflict with Pareto (e.g., Prude blocks L even if Lewd prefers it).*  

  5. **Should rights be modeled as decisiveness over social states?**  
     - *Yes* → Go to 6  
     - *No* (rights = control over your actions) → Go to 7  

  6. **Can rights be waived/traded (e.g., Lewd sells his {L, N} right to Prude)?**  
     - *Yes* → **Leaf: Tradable Rights (Gibbard)**  
       *Cost: Markets/strategic behavior may coerce trades (e.g., Lewd "pays" Prude to allow L).*  
     - *No* (rights inalienable) → **Leaf: Biting the Bullet**  
       *Cost: Rights/Pareto conflicts resolved ad hoc (e.g., society overrules Prude on P if Pareto demands).*  

  7. ⭐ **Is the social outcome chosen by a central planner respecting rights as constraints?**  
     - *Yes* → **Leaf: Nozickian Side-Constraints**  
       *Cost: Pareto-inefficient outcomes possible (e.g., society stuck at N if Prude exercises rights).*  
     - *No* (outcomes emerge from individuals’ actions) → **Leaf: Game-Form Rights**  
       *Cost: Multiple equilibria (e.g., both B and N stable if Prude/Lewd act independently).*  

  ---

  **Logical Notes:**  
  - **Incoherent combo:** *Meddlesome preferences count everywhere + Full WP + Completeness + ML* → Impossibility resurfaces (Node 4’s "No" avoids this).  
  - **Empty combo:** *Rights as action control + Rights tradable* → Unattractive (trading "control" is ill-defined), hence not offered.  
  - **Near-indistinguishable leaves:** *Nozickian Side-Constraints* and *Game-Form Rights* both reject social-state decisiveness. To split them, add: *"Do rights constrain a planner, or define moves in a game?"* (Node 7 does this).  

  **Embarrassing Nodes:**  
  - ⭐ **Node 2 (Yes):** Admitting meddlesome preferences forces you into Restricted Pareto (awkward definitional work) or Node 4’s harsh tradeoffs.  
  - ⭐ **Node 7:** Answering "Yes" (planner respects constraints) risks Pareto failures; "No" (game forms) invites chaos.  

  **Tree Summary:**  
  - **Branch Nodes:** 7 (Q1–Q7)  
  - **Leaves:** 7 (Resolutions with costs)  
  - **Uses Prude-Lewd:** In Nodes 1, 2, 4, 6, and 7.  

