  Handout for System A (original):

    The MIU System

    Axiom: MI

    Rules:

      1. If you have a string whose last letter is I, you may add a U at the end.
      2. If you have a string of the form Mx, you may make Mxx.
      3. If you have a string that contains III, you may replace it with U.
      4. If you have a string that contains UU, you may delete it.

    Goal: Starting from MI, can you produce MU?

    Important: 
      - In Rule 2, x stands for any string (which may be empty? But note: starting from MI, x can be I? So Mx is MI, then Mxx is MII -> so x can be a string of I's and U's).
      - In Rule 3 and 4, the substring must be contiguous.

    We will work in groups. Each group has three roles:

      Stringer (red): 
          - Only writes on the INSIDE sheet: strings and derivations (e.g., "from MI by Rule 1 we get MIU").
          - Cannot use words like "all", "never", "impossible".

      Observer (blue):
          - Only writes on the BESIDE sheet: observations about specific strings (e.g., "the string MI has one I", "the string MII has two I's").
          - Cannot write about every string, only particular ones.

      Theorist (green):
          - Only writes on the ABOVE sheet: properties that they think are true for every theorem (e.g., "every theorem starts with M", "every theorem has at least one I").
          - Must be general claims.

    You may only write on the sheet that matches your role. You may change roles if you wish, but only one role at a time.

    Scoring (first 35 minutes):
        - Each new string (that your group has not written down before) is worth 1 point. Write it on the INSIDE sheet with the derivation.
        - If you reach MU, your group gets 100 points and the game ends for you.

    After 35 minutes, we will change the scoring.

  Handout for System B (sibling) - to be handed out at 35 minutes:

    The MIU System (Version B)

    Axiom: MI

    Rules:

      1. If you have a string whose last letter is I, you may add a U at the end.
      2. If you have a string of the form Mx, you may make Mxx.
      3. If you have a string that contains II, you may replace it with U.
      4. If you have a string that contains UU, you may delete it.

    Goal: Starting from MI, can you produce MU?

    You have 5 minutes. If you reach MU, your group gets 50 points.

  Then at 40 minutes, we collect the results. 

  Then we say: "In System B, it was easy to get MU. In System A, after 35 minutes, no one did. What's the difference? How can we be sure that in System A it's impossible? We are going to look for a property that is preserved by the rules of System A. Specifically, we want a property P such that:

      - The axiom MI has property P.
      - If a string has property P and we apply any rule, then the new string also has property P.
      - The string MU does not have property P.

  If we find such a property, then it's impossible to derive MU in System A.

  Now, scoring changes (from 40 minutes to 70 minutes):

      - Each correct and non-trivial observation about a specific string (written on BESIDE) is worth 5 points.
      - Each correct property about every theorem (written on ABOVE) is worth 20 points. But if you write a property that is not true (i.e., there is a counterexample) then you lose 10 points.
      - If you find a property P that satisfies the conditions above (and explain why) then you get 100 points.

  Then they work until 70 minutes.

  At 70 minutes, we ask groups to share. 

  Then we reveal the invariant: the number of I's modulo 3 is never 0. 

  Debrief (75-85 minutes):

    - We had to step outside the system: we used numbers and modular arithmetic, which are not part of the string rules.
    - We made a finite argument: we checked the property for the axiom, and for each rule, and then for the target. This settled an infinite question (because there are infinitely many possible strings and derivations).
    - This is what Hofstadter calls "jumping out of the system".

    What does it fail to show?
        - In this case, we were lucky: we found an invariant. But in more complex systems, it might be very hard to find such an invariant.
        - Also, some systems are so powerful that they can talk about themselves (like formal systems for arithmetic) and then you might not need to jump out? Or jumping out becomes more complicated? 
        - We only showed that one particular string is unprovable. But there might be other strings that are unprovable for which we cannot find an invariant? 
        - And sometimes, even if you jump out, you might not be able to settle the question? 

    We can mention that in the book, this is a warm-up for Gödel's incompleteness theorem, where one builds a system that can talk about itself, and then finds a sentence that says "I am unprovable", and then by jumping out we see that it is true, but the system cannot prove it.

    But we don't have to go into that.

  Handling issues:

    1. Illegal moves: 
          - We might see them. We should have a referee (the teacher) walking around. 
          - We can say: if you are unsure, ask. 
          - We can also include in the handout: "In Rule 2, x is any substring that forms the entire string after the M. In Rule 3 and 4, the substring must appear as a contiguous part."

    2. People announcing "it's impossible": 
