          - But we don't want to give it away. So we can take him aside and give him a special challenge: 
              "Okay, you might know the answer. But can you help your group without telling them? Maybe you can act as a Theorist and try to find another invariant? Or can you see if there is a string with a number of I's that is divisible by 3? Or can you work on why MIII is impossible too?"

          - Or: let him work on the overflow task: "Can you produce a string with exactly 3 I's? or 6 I's? or 0 I's?"

    4. Fast programmers: 
          - They might write a program to generate all strings up to a certain length? 
          - We can say: "But remember, there are infinitely many. Your program will not halt if it's impossible."
          - And we have the overflow task: try to get MIII? 
          - Or: try to find the shortest derivation for a given string? 
          - Or: in the property phase, they might try to find multiple invariants?

  Materials list:
    - Handouts for System A and System B.
    - Role cards: red, blue, green (one per participant, but they can switch? or one per role per group? We can have one set of three role cards per group, and they can trade?).
    - Three sheets per group: labeled INSIDE, BESIDE, ABOVE.
    - Pens.
    - Timer.
    - Prizes: chocolate or stickers.
    - Scoreboard? Or the teacher keeps score.

