prompt: |-
  There's this pattern in professional certification thats always bugged me. To become a surgeon or electrician you do thousands of hours supervised practice then perform live — nobody cares if you can write an essay about cutting. But to become a philosopher or historian it's all essays and written exams, and nobody tests whether you can actually think well in real time. What's weirder is that some vocational programmes now make apprentices keep written reflection journals about what their hands are learning, as if knowing-how needs knowing-that to prop it up, while medical residencies don't ask surgeons to write about their gut feelings.

  What view of knowing how versus knowing that does that split presuppose? Does it treat them as genuinely seperate domains, or assume practical skill is always opaque without propositional backing? And why demand the translation for tradespeople but not surgeons — is it consistency, or just status? Reconstruct the implicit epistemology here: what's strictly required by the practice, what's just a nice fit, and is the whole thing philosophically underdetermined? Then tell me what'd have to change if we certified everyone the same way, purely practical or purely propositional.

  Answer in British English please. Don't bother with citations, I just want the reconstruction.
reasoning: |-
  Hmm, the user is pointing out an interesting inconsistency in professional certification. They're frustrated with how vocational fields like surgery or electrical work require extensive hands-on practice, while academic fields like philosophy or history rely entirely on written assessments. They've noticed that some trades now require reflective journals, but high-status professions like surgery don't demand similar written documentation of intuitive knowledge. 

  The core question here is about epistemology - specifically the relationship between "knowing how" (practical skill) and "knowing that" (propositional knowledge). The user wants me to reconstruct the implicit assumptions behind this certification split and explore what would happen if all fields used purely practical or purely propositional certification methods.

  I need to break this down carefully. First, the observed pattern suggests that practical fields prioritize performance ability over theoretical articulation, while theoretical fields prioritize explicit knowledge demonstration over applied thinking. The reflective journals in trades imply an assumption that practical skill benefits from explicit articulation - a sort of "knowing that" propping up "knowing how." Yet surgeons aren't asked to articulate their intuitive judgments, implying their practical expertise is seen as self-sufficient.

  This reveals an implicit hierarchy where high-status professions (like surgery) are granted epistemic authority - their intuitive knowledge is trusted without requiring propositional justification. Meanwhile, trades are subjected to "epistemic translation" demands where they must convert practical knowledge into theoretical terms. The status difference seems key here - society appears more willing to accept the tacit knowledge of elite professions as valid without explanation.

  If we switched to purely practical certification for everyone, historians would need to demonstrate real-time historical reasoning under pressure - perhaps rapid source analysis or debate moderation. Philosophers might engage in live dialectics. Conversely, pure propositional certification for surgeons would mean written exams about surgical judgment without ever touching a scalpel - which feels dangerously inadequate.

  The underlying issue is that different knowledge domains have distinct validation requirements. Surgery fundamentally requires embodied skill (the "know how"), while philosophy fundamentally requires conceptual rigor (the "know that"). The reflective journals in trades represent an awkward middle ground - an institutional attempt to intellectualize practical knowledge that may not actually enhance core competence.

  The certification methods aren't philosophically neutral - they reflect societal values about what counts as legitimate knowledge. High-status fields escape the demand to articulate tacit knowledge precisely because their status grants their practices inherent credibility. The inconsistency reveals more about social hierarchies than about epistemology.
answer: |-
  Right, let's crack this implicit epistemology. The certification split you describe rests on several interconnected assumptions about knowledge:

  1.  **"Knowing How" (Procedural Knowledge) vs. "Knowing That" (Declarative Knowledge) as Distinct but Potentially Interacting Domains:** The core presupposition is that these *are* genuinely separate types of knowledge. Surgery and electrical work are seen as fundamentally *procedural* – mastery lies in embodied skill, pattern recognition, and real-time judgment. Philosophy and history are seen as fundamentally *propositional* – mastery lies in constructing arguments, interpreting texts, and organising complex ideas *in language*.

  2. **Practical Skill Can Be Opaque (Especially for "Lower Status" Trades):** The requirement for tradespeople to keep reflective journals suggests an implicit belief that practical skill *alone* is insufficiently transparent or intellectually rigorous. Translating the "know how" into "know that" (reflective journals, essays *about* the practice) serves several perceived purposes:
      *   **Legitimisation & Intellectualisation:** It attempts to elevate the trade by framing it within the dominant (academic) paradigm of knowledge (propositional). "Thinking about doing" proves you're not *just* a manual labourer.
      *   **Assessment & Accountability:** Written reflections provide assessors (often academics or managers, not master craftspeople) with a tangible, standardised product to evaluate understanding *beyond* mere performance. It's easier to mark a journal than reliably assess nuanced practical judgment across diverse situations.
      *   **Transferability & Articulation:** It assumes that forcing articulation improves the practitioner's own metacognition and ability to explain/teach the skill, preventing it from being purely tacit and ineffable.

  3. **High-Status Practical Knowledge is Self-Legitimising & Intuitive:** Conversely, the *lack* of reflective journals for surgeons reveals the opposite assumption: their practical expertise is so highly valued and socially legitimised that its *intuitive* nature ("gut feeling") is accepted as valid *without* requiring propositional justification. The sheer difficulty and prestige of the field, combined with the high-stakes, observable outcomes (success/failure in surgery), grant their "know how" an inherent epistemic authority. Demanding written justifications for gut calls might even be seen as undermining their hard-won expertise or slowing critical action.

  4. **Status is Central to the Demand for Translation:** The inconsistency isn't primarily about philosophical consistency; it's about social **status**. Trades historically viewed as "manual" or "lower status" are subjected to the demand for propositional translation ("prove you can *think* about this, not just *do* it") as a form of epistemic gatekeeping and status elevation *within an academic framework*. High-status practical professions (like surgery, but also law, senior engineering roles) escape this demand precisely *because* their status is already secure. Their practical mastery *is* their intellectual credential. The implicit message: elite practitioners don't need to justify their intuition; tradespeople do to be taken seriously.

  **Reconstructing the Requirements:**

  *   **Strictly Required by Practice:**
      *   *Surgeon/Electrician:* Demonstrable, reliable "know how" – safe, effective performance under real-world conditions, integrating sensory input, motor skills, and rapid judgment. *Knowing that* anatomy or electrical theory is foundational but insufficient; the *performance* is paramount.
      *   *Philosopher/Historian:* Demonstrable "know that" – the ability to construct, analyse, critique, and communicate complex arguments and interpretations *through language* (writing, structured discourse). While "thinking well in real-time" (e.g., in seminar debate) is valuable, the core validated output is the written proposition.
  *   **Nice Fit (But Not Strictly Required):**
      *   *Surgeon:* Deep theoretical knowledge *enhances* practice but isn't constantly tested propositionally post-certification. Reflective practice occurs informally/mentally, not through mandated journals.
      *   *Tradesperson:* Strong procedural skill *is* the requirement. Reflective journals might *aid* some learners' metacognition but are not inherently necessary for competence. They're an add-on for assessment/legitimisation.
      *   *Philosopher/Historian:* Real-time dialectical skill is highly valuable but often secondary to the written product in certification.
  *   **Philosophically Underdetermined?** Absolutely. The emphasis is driven by:
      *   **Practical Constraints:** Assessing pure "know how" reliably at scale is harder and more resource-intensive than marking essays/exams. Simulating real-time philosophical debate under exam conditions is challenging.
      *   **Epistemic Traditions:** Academia is built on propositional knowledge validation. Trades historically validated through guilds/master-apprentice observation.
      *   **Social Hierarchy & Bias:** The value placed on "know that" reflects the dominance of academic/intellectual models of knowledge over embodied/practical ones, exacerbated by class perceptions of different professions.

  **Consequences of Uniform Certification:**

  1.  **Purely Practical Certification for Everyone:**
      *   *Surgeons/Electricians:* Would largely continue as now (perhaps even stronger focus on simulation/live assessment). Competence proven by *doing*.
      *   *Philosophers/Historians:* Certification would involve rigorous, observed real-time performance: moderated complex debates, rapid critical analysis of unseen texts/arguments under pressure, live Q&A defending interpretations. Written work might become irrelevant. Many current academics might struggle – the skill tested shifts dramatically.
      *   **Result:** Potentially better validates *applied* reasoning skills in humanities, but risks undervaluing deep research, complex written argumentation, and the reflective depth that writing enables. Might favour rhetoricians over systematic thinkers.

  2.  **Purely Propositional Certification for Everyone:**
      *   *Philosophers/Historians:* Continue largely as now – competence proven by written argument/exams.
      *   *Surgeons/Electricians:* Would take written exams *about* procedures, judgment calls, theory, and ethics, but *never demonstrate physical skill*. You'd get surgeons certified based on essays about cutting, not cutting itself.
      *   **Result:** Catastrophic for practical fields. High theoretical knowledge ≠ safe, skilled hands-on performance. It ignores the embodied, sensory, and intuitive components essential to the job. Dangerous incompetence would be certified. The disconnect between "knowing that" and "knowing how" would be starkly exposed.

  The current messy split, inconsistency and all, arises because different practices genuinely *do* prioritise different types of knowledge at their core. The real flaw is the *asymmetrical demand for translation* imposed on lower-status practical fields, revealing it's less about epistemology and more about social validation within a system biased towards the propositional.
