prompt: |-
  I'm running a workshop on pseudohistory and demarcation — Atlantis, ancient aliens, Fomenko's new chronology, the usual suspects — and one of my grad students keeps falling back on 'absence of evidence isn't evidence of absence' every time I push on her favorite reconstruction. Last session she used it specifically when I noted that Fomenko's shadow dynasty has not just zero matching inscriptions, but also no trace in the dendrochronology records I showed the class; she said the tree-ring silence doesn't prove he's wrong. I want to bring a disambiguation to next weeks meeting and show her why the slogan doesn't automatically save the case. Can you lay out the different precise claims hiding inside that line? Like, is it a logical point about the fallacy of arguing from ignorance? An epistemic claim about priors? A methodological rule that all negative archaeological results are inconclusive? For each reading, tell me if it's trivially true, defensible, or false — and specifically say which version actually protects Fomenko-style reconstructions from missing-inscription and tree-ring objections, and which ones fall apart. I need this as a clean list I can project on the board, not a citation list or reading assignment — just the conceptual map, since half my students think repeating a slogan counts as an argument. (Also I spelled 'seperate' wrong in my notes, so don't quote that back at me please — wait, I just did. Nevermind.)
reasoning: |-
  Okay, let's tackle this professor's problem. They're running a workshop on pseudohistory, and one grad student keeps using "absence of evidence isn't evidence of absence" to defend theories like Fomenko's New Chronology. Specifically, when confronted with missing inscriptions and dendrochronology records, the student claims these absences don't disprove the theory. The professor wants to unpack this slogan for the next class.

  First, I need to break down the different interpretations of the slogan. The professor mentioned logical fallacies, epistemic priors, and methodological rules. Let me start by listing possible interpretations. One is the logical argument from ignorance. That's when someone says a claim is true because it hasn't been proven false, or vice versa. But absence of evidence isn't automatically evidence of absence—it depends. If we should have found evidence by now, then absence does suggest absence. For Fomenko's shadow dynasties, the lack of inscriptions and tree-ring evidence where we'd expect it does weaken the theory.

  Next, epistemic claims about priors. If a hypothesis is inherently untestable, absence of evidence doesn't matter. But Fomenko's claims are testable. Dendrochronology should show those dynasties if they existed. So high prior probability combined with expected evidence makes absence significant. The student might be treating the theory as unfalsifiable, which isn't defensible here.

  Methodological rules. The student might think all negative evidence is weak. But in archaeology, absence can be strong evidence if the context is right. For example, missing tree-ring patterns that should be there if the dynasty existed. That's strong evidence against Fomenko, not inconclusive.

  Now, which versions protect Fomenko? Only the trivial logical claim and maybe the unfalsifiable hypothesis angle, but that's not valid for testable claims. The other interpretations don't hold up under scrutiny. The professor needs to show that in cases where evidence is expected, absence is meaningful. Highlighting testability, prior probabilities, and methodological strength in archaeology will help dismantle the student's overuse of the slogan.
answer: |-
  Here's a clean conceptual breakdown of "absence of evidence" for your board, designed to dismantle the slogan's misuse in defending Fomenko-style pseudohistory:

  ---

  **"Absence of Evidence Isn't Evidence of Absence": Disambiguating the Slogan**

  | **Interpretation**                                                                 | **Status**       | **Does it protect Fomenko?** | **Why?**                                                                                                                                                                |
  | :--------------------------------------------------------------------------------- | :--------------- | :--------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Logical Claim: "Arguing from Absence = Fallacy of Ignorance"**                | **Trivially True** | **NO**                       | Correctly states that *merely* pointing to lack of proof isn't valid disproof. **But:** This is a baseline logical rule, not a shield against *positive* counter-evidence derived from absence in context. |
  | **2. Epistemic Claim: "Absence Never Affects Probability"**                        | **False**          | NO                           | Absence *can* be strong evidence of absence **if evidence is expected**. Probability *does* decrease when predicted evidence is missing (Bayes' Theorem).                |
  | **3. Methodological Claim: "All Negative Results are Inconclusive"**               | **False**          | NO                           | Strength of negative evidence depends on **search adequacy & predictive power**. A thorough, competent search for *expected* evidence *is* conclusive if negative.     |
  | **4. Falsifiability Claim: "The Hypothesis is Inherently Untestable"**             | **Defensible**     | YES (but damning)            | If no evidence *could* disprove the shadow dynasties (e.g., "all records were destroyed"), it's unfalsifiable. **But:** Unfalsifiable claims are unscientific and immune to evidence, making them invalid reconstructions. |
  | **5. Contextual Claim: "Absence Matters Only if Evidence is Expected & Searched For"** | **Defensible**     | **NO**                       | **Crucial for Fomenko:** Dendro/inscriptional evidence *is* expected for real dynasties. **Thorough, successful searches** (like dendrochronology covering Fomenko's timeline) make absence **strong evidence of absence**. |

  ---

  **Why Fomenko's Shadow Dynasties Collapse Under Absence:**

  1.  **Expectation:** Real, powerful dynasties in the claimed regions/timeframes **should** leave physical traces (inscriptions, coins, consistent dendro patterns in traded wood, etc.).
  2.  **Search Adequacy:** Archaeology/dendrochronology **have** systematically searched the relevant periods/regions and **found** robust evidence for *other* dynasties.
  3.  **Prediction:** Fomenko's model **predicts** evidence that *should* exist but **doesn't** (e.g., specific tree-ring sequences matching his timeline).
  4.  **Conclusion:** The **absence** of this predicted evidence, where it *should* be found after competent searching, **is** strong positive evidence **of absence** for Fomenko's shadow dynasties. The slogan fails here because **conditions 1-3 are met.**

  **Project This:** Use the table to show that only interpretations **1** (trivial logic) and **4** (unfalsifiability) offer protection, and **4** is scientifically fatal. Emphasize **5**: **Context is king.** For testable claims where evidence is expected and searched for, absence *is* evidence. Pseudohistory often hides behind misinterpretations of **1, 2, or 3** while ignoring **5**.
