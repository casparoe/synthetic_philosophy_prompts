  Hmm, the user is asking about a specific phenomenon in decision-making where two agents assign the same probability to an event but show different willingness to act on it, based on the depth and quality of evidence. They've given three examples: clinicians, an investor, and a committee, all showing this pattern. The key points are that the difference persists even with no further evidence, no reputational concerns, and identical probabilities and payoffs. They also mention a second aspect: the fragility of the probability estimate when new evidence arrives. The user wants to know if there's an established term for this, what exactly it entails, how it differs from similar concepts, and whether it's rationally relevant.

  First, I need to brainstorm candidate concepts from formal epistemology, decision theory, economics, and psychology. Let me list some possibilities:

  1. **Risk vs. Uncertainty (Knightian distinction)**: Risk involves known probabilities, while uncertainty involves unknown probabilities. In the user's examples, both agents assign exact probabilities, so it's not pure Knightian uncertainty. The thin-evidence agent might be in an uncertainty-like state despite stating a number. But Knight himself might argue that the thin case isn't true risk. However, since probabilities are stated, this might not fit perfectly.

  2. **Ambiguity Aversion**: People prefer known risks over ambiguous ones. Ellsberg's paradox is a classic example with urns. The user mentioned a similar urn case. Ambiguity aversion could explain the reluctance to act when evidence is thin, as the probability feels less reliable. The fragility aspect might relate to how ambiguous probabilities update more dramatically with new information.

  3. **Second-order Probability / Credal States**: Here, an agent has a probability distribution over possible probabilities. The thin-evidence agent might have a wider distribution, leading to lower confidence. This could explain both reluctance to act and fragility. The substantial-evidence agent has a tight distribution around 60%.

  4. **Resilience (Keynes)**: Resilience refers to how much a probability would change with new evidence. A resilient probability (substantial evidence) changes little, while a fragile one (thin evidence) shifts a lot. This directly matches the user's second point about fragility. Reluctance to act might stem from low resilience.

  5. **Robustness or Sensitivity Analysis**: In decision theory, robust probabilities withstand variations in evidence or assumptions. Thin probabilities are sensitive to small changes, making them less reliable for action.

  6. **Epistemic Confidence**: Psychological confidence distinct from probability. High confidence might allow acting even at lower probabilities, but here it's the opposite—same probability but lower confidence leading to reluctance. The user mentioned a psychology finding about story coherence vs. evidence volume.

  7. **Weight of Evidence (Keynes again)**: Keynes distinguished probability from the weight of evidence. Weight relates to how much evidence there is, separate from the probability value. High weight means substantial evidence, leading to more decisive action. This seems promising.

  8. **Calibration Confidence**: An agent's assessment of their own calibration. If thin-evidence agents know they're less calibrated, they might hesitate. But the user stipulated both are competent, so this might not apply.

  9. **Model Uncertainty**: When the evidence relies on a single model or assumption, it's riskier than diverse evidence. The boundary case the user mentioned about varied vs. redundant evidence fits here.

  Now, evaluating each candidate:

  - **Risk vs. Uncertainty**: Rejected because probabilities are stated, so it's not pure uncertainty. The urn example fits ambiguity better.
    
  - **Ambiguity Aversion**: Strong candidate. Ellsberg's urn shows preference for known probabilities. The fragility could be linked, as ambiguous probabilities are less stable. But ambiguity is often about not having a single probability, whereas here agents do state one. The thin-evidence agent might be in a state of ambiguity despite the number.

  - **Second-order Probability**: Useful, but it's a tool rather than an established name for the phenomenon. Also, it might not be the core concept.

  - **Resilience**: Directly addresses fragility. Keynes used it, and it's cited in modern decision theory. Reluctance to act could be due to low resilience.

  - **Robustness**: Related to resilience but less specific to probability updating.

  - **Epistemic Confidence**: Too vague and psychological; not a formal concept.

  - **Weight of Evidence**: Fits well. Keynes defined weight as the quantity of evidence behind a probability. High weight means more evidence, leading to stronger grounds for action. Fragility is inversely related—low weight probabilities change more with new evidence. The boundary cases: varied evidence increases weight, redundant might not. Evidence that conflicts (pulls both ways) might have high weight but low probability, which is different.

  - **Calibration Confidence**: Rejected because the user assumes both agents are competent, so calibration differences aren't the focus.

  - **Model Uncertainty**: Relevant to the boundary case but not the core phenomenon.

  Weight of evidence seems the best fit. Let me confirm: Keynes distinguished it from probability. Probability is the degree of belief, weight is how much evidence supports it. High weight = substantial evidence, low weight = thin. The reluctance to act: even at the same probability, low weight makes the estimate less trustworthy, so agents might avoid high-stakes actions. Fragility: low weight probabilities are more sensitive to new evidence. The urn example is Ellsberg, which is ambiguity aversion, but ambiguity can be seen as a form of low weight where the probability isn't firmly grounded.

  The established term is "weight of evidence," primarily from Keynes. Ambiguity aversion (Ellsberg) is a related behavioral phenomenon, but weight is the underlying epistemic property.

  Distinguishing from neighbors:
  - **Probability vs. Weight**: Probability is the estimate (60%), weight is how well-supported it is.
  - **Ambiguity Aversion**: A preference behavior in the face of ambiguity (low weight). Weight is the state, ambiguity aversion is the response.
  - **Resilience**: Part of weight; high weight implies high resilience.
  - **Risk Aversion**: About utility curvature, not the belief quality.

  The user's two components (reluctance to act and fragility) are both part of weight. Low weight explains both: less trust in the probability leads to hesitancy, and higher sensitivity to new evidence.

  Boundary cases:
  - Varied evidence vs. redundant: Varied evidence likely has higher weight because it's less dependent on a single source. Redundant evidence might have lower effective weight.
  - Conflicting evidence: If evidence pulls both ways, the probability might be moderate (e.g., 50%), but weight could be high if there's a lot of evidence. The reluctance to act here would be due to the probability itself, not the weight. So it's different.

  Is weight rationally relevant? On a strict Bayesian view, no—only probability should matter. But there are critiques. Keynes argued weight affects practical decision-making. Modern approaches like robust Bayesian methods allow for decision rules that incorporate weight (e.g., min-max when weight is low). So yes, there's a tradition that treats it as relevant.

  Final answer: The phenomenon is "weight of evidence." Define it as the degree to which a probability judgment is substantiated by the available evidence, separate from the probability value itself. Low weight leads to reluctance to act (even at the same probability) and fragility under new evidence. It's distinct from probability, ambiguity aversion, and risk aversion. The two components are unified under weight. Rationally, weight can be decision-relevant, especially under non-standard decision theories.
answer: |-
  ### Step 1: Brainstorming Candidate Concepts
  Quietly brainstorming concepts from formal epistemology, decision theory, economics, and psychology that might capture the phenomenon:  
  - **Knightian uncertainty** (risk vs. uncertainty): Distinguishes measurable "risk" (known probabilities) from unmeasurable "uncertainty" (unknown probabilities).  
  - **Ambiguity aversion**: Preference for known probabilities over ambiguous or ill-defined ones (e.g., Ellsberg paradox).  
  - **Second-order probability**: A probability distribution over first-order probabilities (e.g., "60% but I'm unsure").  
  - **Resilience (Keynes)** or **stability**: How resistant a probability is to change under new evidence.  
  - **Weight of evidence (Keynes)**: The "quantity" or "comprehensiveness" of evidence backing a probability.  
  - **Epistemic confidence**: A psychological sense of conviction distinct from probability.  
  - **Robustness**: How a probability holds up under varying assumptions or models.  
  - **Calibration confidence**: Belief in one's own accuracy based on past performance.  
  - **Model uncertainty**: Uncertainty about the underlying model generating the probabilities.  
  - **Entropy or variance in credence**: Higher spread in possible beliefs indicating instability.  
  - **Credal imprecision**: Refusal to commit to a single sharp probability.  

  ### Step 2: Eliminating Candidates (with Brief Reasons for Rejection)  
  - **Knightian uncertainty**: Rejected. The agents *assign* precise probabilities (60%), so this isn’t pure "unknown probability" uncertainty.  
  - **Epistemic confidence**: Rejected. This is too vague and psychological; it doesn’t formally distinguish evidence quality.  
  - **Calibration confidence**: Rejected. Stipulated that both agents are competent, so self-assessment of skill isn’t the core issue.  
  - **Entropy/variance in credence**: Rejected. Useful for second-order uncertainty but doesn’t directly explain action reluctance or fragility.  
  - **Credal imprecision**: Rejected. Agents *do* state sharp probabilities (60%), not ranges or qualitative judgments.  
  - **Robustness**: Rejected. This focuses on model assumptions, not evidence depth; it’s adjacent but not central.  
  - **Model uncertainty**: Rejected. While related (e.g., single-model evidence vs. diverse), it’s too narrow—your examples include cases without explicit models (e.g., clinical experience).  
  - **Ambiguity aversion**: Plausible but partially rejected. Ellsberg’s urn (your reference) involves *known vs. unknown* compositions, but your agents assign identical probabilities—no ambiguity about the *number*, only its basis. Ambiguity aversion often manifests as probability intervals, not sharp values.  
  - **Second-order probability**: Plausible but rejected as the core concept. It’s a tool for modeling the phenomenon but not the phenomenon itself (e.g., it doesn’t inherently explain action reluctance).  
  - **Resilience**: Plausible but rejected as secondary. It directly describes fragility but doesn’t fully capture the reluctance to act independently.  
  - **Weight of evidence**: Strongest candidate. Matches the evidence depth/comprehensiveness in your examples and explains both action reluctance and fragility.  

  ### The Phenomenon: Weight of Evidence  
  The established name for what you describe is **weight of evidence**, a concept formalized by John Maynard Keynes in his 1921 *A Treatise on Probability*. It is distinct from—and often conflated with—probability itself. Below, I define it, carve its boundaries, address your instances, and tackle your key questions.  

  #### Definition and Core Carving  
  - **What it is**: Weight of evidence measures the *quantity* or *comprehensiveness* of the evidence underlying a probability judgment. It is orthogonal to the probability value. High weight means substantial, varied, and robust evidence; low weight means sparse, fragmented, or shallow evidence. Crucially, weight affects decision-making *even when probabilities and utilities are identical*: low weight induces reluctance to act and increases fragility under new evidence.  
    - *In your examples*:  
      - The clinician with "thin" evidence has low weight (few cases, anecdotal resemblance); the one with "substantial" evidence has high weight (hundreds of cases, repeated tests).  
      - The investor with a "single conversation" has low weight; "twenty years of data" has high weight.  
      - The committee treats the "model and three inspections" as low weight versus "a thousand inspection records" as high weight.  
    - *Fragility aspect*: This is intrinsic to weight. Low weight probabilities are less "stable"—minor evidence shifts them dramatically because the existing evidence is insubstantial. High weight probabilities are "resilient" (Keynes's term) to small evidence changes.  

  - **What it is not**:  
    - **Not probability**: Probability is the *degree* of belief (e.g., 60%). Weight is the *evidential support* for that degree. Two 60% probabilities can have different weights.  
    - **Not ambiguity aversion**: Ambiguity aversion (e.g., Ellsberg’s urn) involves aversion to *unknown or indeterminate* probabilities. Here, probabilities are known and sharp—the issue is *how well-grounded* they are. Weight can *cause* ambiguity-like behavior (e.g., reluctance) but is distinct.  
    - **Not risk aversion**: Risk aversion is about diminishing marginal utility (e.g., fearing losses more than loving gains). Weight affects decisions even with identical payoff distributions.  
    - **Not resilience alone**: Resilience (fragility under evidence) is a *consequence* of low weight, not the whole phenomenon. Weight also explains action reluctance independently.  
    - **Not confidence (psychological)**: Confidence is a feeling; weight is an epistemic property of the evidence. Confidence can correlate with weight but is not identical (e.g., an overconfident agent with low weight).  

  #### Boundaries and Edge Cases  
  - **Evidence variety vs. redundancy (your boundary case)**:  
    - Varied evidence (independent sources, diverse methods) increases weight. Redundant evidence (e.g., repeated similar measurements) may add bulk but not weight—if traceable to one source, it remains "thin." *Your instinct is correct*: bulky-but-redundant evidence has low weight, like the thin-evidence clinician. This is the *same dimension* (weight), as weight prioritizes breadth and independence over mere volume.  
  - **Evidence that conflicts (pulls both ways)**:  
    - Conflicting evidence (e.g., 60% probability but substantial counter-evidence) may yield high weight if the evidence is comprehensive, but the *probability* is moderate. Here, reluctance to act stems from the probability itself (e.g., 60% is weak for high-stakes bets), not low weight. Weight could be high—e.g., lots of solid but mixed evidence—so this is a *different* dimension.  
  - **Scalability**: Weight admits of degrees but isn’t always quantifiable. We can say "higher" or "lower" weight, but no universal scale exists—it’s comparative and context-dependent.  

  #### Relation to Your Half-Remembered Concepts  
  - **Ellsberg’s urn (known vs. unknown composition)**: This is a classic case of ambiguity aversion. Weight of evidence differs: the "unknown urn" has undefined probability (no evidence), while your agents have defined probabilities with low weight. *Fit is loose*: Ellsberg shows ambiguity aversion; your phenomenon shows how low weight (even with sharp probabilities) causes similar behavior.  
  - **Refusal to state sharp probabilities (ranges, "above half")**: This is credal imprecision, often from low weight. *Fit is loose*: Your agents *do* state sharp probabilities, so weight operates "behind the scenes."  
  - **Confidence from story coherence (psychology)**: This echoes Tversky/Kahneman’s "narrative fallacy." *Fit is loose*: Coherence is about mental representation; weight is about evidence structure. Low weight might lead to incoherent stories, but they’re distinct.  

  #### Rational Relevance: Does Weight Matter for Action?  
  **Yes, it can be rationally relevant**, and this is contested. The standard Bayesian view treats probability as sufficient for expected utility maximization—weight is "mere noise." However, a serious tradition (rooted in Keynes, developed by modern formal epistemologists like Roger White and philosophers like James Joyce) argues weight *is* decision-relevant:  
  - **The claim**: Decisions under low weight should be more cautious because:  
    1. **Epistemic risk**: Low weight probabilities are more likely miscalibrated or unstable.  
    2. **Regret minimization**: Acting on thin evidence risks larger ex post regret if probabilities shift.  
    3. **Non-Bayesian frameworks**: Some decision rules (e.g., minimax regret, or "security" in Isaac Levi’s work) incorporate weight-like properties to avoid catastrophic bets.  
  - **In your cases**: A rational agent might discount expected utility under low weight (e.g., applying a penalty factor) or require higher probabilities for high-stakes actions. This isn’t "irrational feeling"—it’s a hedge against hidden uncertainty in the evidence base.  

  ### Final Summary  
  - **Name**: **Weight of evidence** (Keynesian).  
  - **Definition**: The comprehensiveness, quantity, and independence of evidence supporting a probability, distinct from its value. Low weight causes reluctance to act and fragility under new evidence.  
  - **Borders**: Not probability, ambiguity aversion, risk aversion, or resilience—though it explains behaviors associated with them.  
  - **Components**: Your two aspects (action reluctance and fragility) are unified under weight—they are manifestations of the same phenomenon.  
  - **Status**: Rationally relevant in non-standard decision theories that account for epistemic limitations.  

  This gives you a precise, actionable distinction for your work. If you need refinements on edge cases or decision rules, I can extend this analysis.
