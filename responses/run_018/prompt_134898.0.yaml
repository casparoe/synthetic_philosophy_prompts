  Here's the logical taxonomy for your handout (240 words):

  **Stoic Control Taxonomy: Algorithmic Feeds & AI Nudges**

  *   **Root Question:** Does the output of an algorithmic feed (content, ordering, timing) belong *externally* (like weather) or *internally* (within our προαίρεσις / sphere of assent) regarding Stoic control?

  *   **Branch 1: Feed Output is Fully External (Indifferent)**
      *   *Rationale:* The algorithm's operation is entirely separate from our will, akin to natural phenomena.
      *   **Leaf: Externalist Realism**
          *   *Awkward Commitment:* Must deny any causal link between past user choices (clicks, likes) and current feed output, treating the algorithm as a true "black box".

  *   **Branch 2: Feed Output is Partly Shaped by Past User Choices**
      *   *Rationale:* Past user actions (assents, impulses) demonstrably train the model, introducing an internal element.
      *   **Branch 2a: ...Therefore Partially Internal / Controllable via Initial Assent**
          *   **Leaf: Prohairesis Training View**
              *   *Awkward Commitment:* Implies ongoing responsibility for *past* assents shaping *current* inescapable external influences (blurring the dichotomy).
      *   **Branch 2b: ...But Still Externally Determined *Now* (Only Reaction Controllable)**
          *   **Leaf: Legacy Determinism**
              *   *Awkward Commitment:* Treats the *consequence* of past internal choices as a new, inescapable external fate, potentially excusing present passivity.

  *   **Branch 3: Feed Output is Controllable *Only* Through Reaction (Assent/Rejection)**
      *   *Rationale:* The *delivery* is external, but our *judgment* and *attention* (προαίρεσις) remain internal.
      *   **Leaf: Reaction-Focused Stoicism (Dominant View)**
          *   *Awkward Commitment:* Must accept pervasive, psychologically potent external influence as fundamentally "indifferent," requiring constant vigilance.

  *   **Niche View: Feed-Asceticism (Treats Attention Allocation as Internal Exercise; Engine Weights as External)**
      *   *Diagnosis:* **Potentially Incoherent.** If engine weights are *pure* externals, attention allocation lacks a stable object. If weights are shaped by past choices (Branch 2), it collapses into Branch 2a/2b. *Unnamed* pending resolution.
