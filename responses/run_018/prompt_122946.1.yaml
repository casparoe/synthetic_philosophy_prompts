prompt: |-
  I teach a graduate seminar on higher-order evidence, and for several years I have leaned on a piece of classroom scaffolding that I have come to suspect is doing far more argumentative work than it deserves.

  The picture is that of the standby instrument. A pilot who has reason to distrust her primary altimeter does not stop flying: she cross-checks it against the standby, forms a view about how far the primary is off, and discounts its readings by that amount. The primary instrument plays the role of first-order evidence; the standby reading is higher-order evidence about the reliability of the first-order source; and rationality requires integrating the two rather than continuing to take the primary at face value. Almost everything I say about higher-order evidence gets cast in these terms, and I have noticed that a colleague of mine, who is a thoroughgoing conciliationist, now uses the picture to license two claims I am no longer confident it can carry. The first is that there is no such thing as rationally permissible epistemic akrasia: believing that p while believing that this very belief of yours issues from an unreliable process is, on the picture, exactly like trusting a faulty altimeter because you happen to like the number it displays, and is therefore never rational. The second is that the rational response to higher-order evidence is always to move one's first-order attitude in the direction the higher-order evidence indicates, by a determinate amount: discount in proportion to how badly the higher-order evidence impugns the first-order source. Call these the no-akrasia verdict and the discount-and-descend verdict.

  What makes me suspicious is a distinction I have started drawing in my own notes. Much higher-order evidence is self-exempting: the impugning evidence reaches you through a channel independent of the competence it impugns, as when a lab report tells you the drug you took six hours ago degrades arithmetic judgment, or a certificate states the standby instrument's own error bounds. But some higher-order evidence is self-consuming: it is delivered by the very faculty it tells you not to trust. The mathematician who works through a long proof at two in the morning and concludes, by exactly that reasoning, that her judgment about such proofs is now untrustworthy is in this position; so is anyone who reads an argument, deployed in full generality, for the conclusion that we are systematically unreliable about some question, and applies it to itself. Peer disagreement looks like an intermediate case, since the impugning evidence comes through a channel that is partly independent of you and partly shared with you.

  So I would like an audit of the standby-instrument picture, and I do not want a map of the literature or a reading list; I want the audit itself.

  First, please set out the correspondence explicitly, as a table: what plays the role of the primary instrument, of the standby, of the true value, of the known error distribution, of the discount factor, of the pilot herself, and of the further action she takes. Mark, for each row, whether the mapping is forced by the picture or is a stipulation my colleague has quietly made.

  Second, the places the mapping breaks. Candidate disanalogies I would like you to consider include: the independence of the two channels, which the engineer guarantees and the agent cannot; the availability of a stable error distribution or calibration base rate, which the instrument has and the agent generally does not; the existence of a third and authoritative source against which both instruments can be checked, such as the ground or the control tower, for which the agent has no analogue; the difference between a scalar reading and a propositional attitude; the fact that the pilot's discounting is performed by an unimpaired pilot, whereas the agent's response to the higher-order evidence is itself an exercise of the impugned faculty; and the fact that in the instrument case the true value is fixed independently of both readings, while the question of whether you are reliable is in some sense settled by the very judgments in question. Please add the ones I have missed, and separate the disanalogies that are load-bearing for the two verdicts from those that are merely decorative.

  Third, say what the picture imports into the target that the target lacks. My own list would include: that trust is a continuous scalar one can dial rather than an all-or-nothing stance; that there is always a determinate amount by which to discount; that first-order and higher-order states can be treated as probabilistically independent given the truth of the target proposition; that total evidence always factorises into a readout and a calibration certificate; and that the correct response is reached by a single application of the discount operation.

  Fourth, and this is where I would most value your help: suppose we restate the discount-and-descend verdict as a fixed-point requirement, so that the rational state is a fixed point of an operator that takes your current attitudes together with the higher-order evidence and returns revised attitudes. For self-exempting evidence, does such an operator have a unique and reachable fixed point? For self-consuming evidence, does it have one at all, and if it has several, does the picture say which to select? And please test the whole apparatus on the case where the higher-order evidence says your reliability is below chance, so that the right response would seem to be to invert rather than merely to damp your confidence: can a faculty that is anti-reliable carry out its own inversion, and does the instrument model have anything to say here, or does it fall silent?

  Finally, given all this, tell me whether each of the two verdicts survives, whether it survives only for the self-exempting cases, or whether it was the analogy carrying it the whole time; and if you think there is a better analogy for the self-consuming case — something like a scale that must weigh itself, a rule that expands with the temperature it is measuring, or a court of last resort that is also a party to the dispute — give it to me, together with what it gets right that the standby instrument gets wrong.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy professor specializing in higher-order evidence, deeply familiar with the standby instrument analogy but now questioning its limitations. They've identified specific problems with how the analogy supports two key claims (no epistemic akrasia and mandatory discounting), especially regarding self-consuming evidence. 

  First, I need to map the analogy components rigorously. The primary instrument is clearly first-order evidence, the standby is higher-order evidence about reliability. But the pilot's role is tricky - they represent the agent's rational faculty, yet in self-consuming cases, that faculty is compromised. The "true value" mapping is particularly problematic since epistemic states lack an external arbiter like ground altitude.

  For disanalogies, the mechanical independence of instruments versus cognitive interdependence stands out. An altimeter's error distribution is stable and known, but human reliability fluctuates contextually. Crucially, the pilot remains unimpaired while discounting, whereas agents assess their own impairment using potentially impaired faculties. This directly undermines both verdicts in self-consuming cases.

  The scalar nature of instrument readings versus propositional attitudes matters too. Trust in cognition isn't smoothly dialable - we can't fractionally believe our faculties are 37% reliable. And when reliability drops below chance, the analogy fails entirely: you can't "invert" an altimeter reading by turning it upside down.

  For fixed-point analysis: with self-exempting evidence (like a lab report), Bayesian updating likely converges to a unique fixed point. But self-consuming evidence creates regress - if a proof convinces you your reasoning is flawed, that very conviction relies on the reasoning it condemns. This resembles Liar paradoxes. No stable fixed point exists because the operator consumes its own premises.

  The no-akrasia verdict holds for self-exempting cases but fractures with self-consuming evidence. Epistemic akrasia might be unavoidable when the evidence-generating process implicates itself. Discount-and-descend similarly fails here - without independent calibration, there's no baseline for discounting.

  Alternative analogies: a self-weighing scale captures the paradox but still implies an external standard. Better might be a judicial system where the supreme court must rule on its own authority - the decision both constitutes and evaluates the standard. This mirrors how self-consuming evidence forces the faculty to judge its competence while exercising it.

  Ultimately, the standby instrument is useful pedagogically but smuggles in assumptions of independence and scalability that don't hold for core cases of higher-order evidence. The colleague's two verdicts are artifacts of the analogy, not features of rationality itself.
answer: |-
  ### Audit of the Standby-Instrument Analogy for Higher-OEE

  #### I. Explicit Correspondence Table
  | **Standby Instrument Component** | **Epistemic Analog** | **Mapping Status** |
  |----------------------------------|----------------------|-------------------|
  | Primary instrument               | First-order evidence (e.g., perceptual/argumentative data) | Forced |
  | Standby instrument               | Higher-order evidence (e.g., reliability assessment) | Forced |
  | True value (altitude)            | Factual proposition *p*’s truth-value | **Stipulated** (problematic) |
  | Known error distribution         | Calibration base rate (e.g., known reliability %) | **Stipulated** |
  | Discount factor                  | Degree of credence adjustment | **Stipulated** |
  | Pilot                            | Rational agent | Forced |
  | Further action (adjusting course)| Revised doxastic attitude | Forced |

  **Key Issue**: The "true value" mapping assumes an *external* truth-apt target independent of measurement, which is unavailable in epistemic cases (especially for self-consuming evidence).

  ---

  #### II. Disanalogies: Load-Bearing vs. Decorative
  **Load-Bearing Disanalogies** (threaten core verdicts):  
  1. **Independence of channels**  
     - Instruments: Engineer-guaranteed mechanical independence.  
     - Agents: No strict independence; self-consuming evidence *uses* the impugned faculty.  
     - **Impact**: Breaks no-akrasia/discounting for self-consuming cases.  

  2. **Stable error distribution**  
     - Instruments: Known via calibration.  
     - Agents: Reliability estimates themselves require justification (regress problem).  
     - **Impact**: Undermines "determinate discount amount" stipulation.  

  3. **Third-party authority**  
     - Instruments: Ground/control tower as arbiter.  
     - Agents: No epistemically privileged vantage point.  
     - **Impact**: Without external truth, discounting lacks objective anchor.  

  4. **Impairment asymmetry**  
     - Pilot: Unimpaired when cross-checking.  
     - Agent: Assessment of higher-OEE uses the *same* cognitive machinery under suspicion.  
     - **Impact**: Self-consuming evidence induces regress (can’t trust the distrust).  

  5. **Truth-value dependence**  
     - Instruments: Altitude exists independently.  
     - Agents: Truth of *p* may depend on competence (e.g., logical proofs). Self-assessment is *constituted* by the faculty in question.  

  **Decorative Disanalogies** (salvageable with tweaks):  
  - Scalar vs. propositional (can map to credence functions).  
  - Continuous trust dial (can be modeled probabilistically).  

  **Missing Critical Disanalogy**:  
  - **Self-undermining propagation**: Faulty instruments don’t generate their *own* error reports; self-consuming evidence does (e.g., "this reasoning is untrustworthy" *is* a product of that reasoning).  

  ---

  #### III. Illicit Importations by the Analogy  
  The picture smuggles in:  
  1. **Quantifiability**: Assumes reliability is always measurable (e.g., "70% reliable"), ignoring qualitative/jagged failures.  
  2. **Atomism**: Treats first-order and higher-order evidence as separable factors, but self-consuming evidence entangles them.  
  3. **Static calibration**: Presumes pre-existing error distributions, while agents face novelty (e.g., sleep-deprived math).  
  4. **Single-operation resolution**: Suggests one discounting step suffices, but higher-OEE may require iterative reevaluation.  
  5. **Externality**: Imports a "view from nowhere" for truth-assessment.  

  ---

  #### IV. Fixed-Point Analysis  
  Define operator **Φ**: Takes current credence *C(p)* + higher-OEE → outputs revised credence.  

  - **Self-exempting evidence** (e.g., lab report):  
    - Unique fixed point exists (e.g., Bayesian update with known base rates).  
    - Reachable via standard conditioning (e.g., *C(p|reliability=0.7)*).  

  - **Self-consuming evidence** (e.g., "this proof is unreliable"):  
    - **No fixed point possible** if evidence is globally applied. Example:  
      - Let *R* = "My reasoning is reliable now".  
      - Evidence *E* = "¬R", but *E* is produced via the same reasoning.  
      - **Φ** must revise *C(R)* downward, yet **Φ** itself relies on *R*. Contradiction.  
    - **Multiple unstable points** if localized (e.g., "only *long* proofs are unreliable" might permit fixed points for short inferences).  

  - **Anti-reliability case** (reliability < chance):  
    - Instrument model **fails utterly**. Discounting cannot yield inversion:  
      - If primary says *X*, and standby says "primary is anti-reliable", discounting gives *not-X*—but this inversion *requires an unimpaired discounting faculty*.  
      - Self-applied anti-reliability (e.g., "I’m worse than random") collapses into a Moorean paradox: "I believe *p* via a process that is anti-reliable, so *p* is likely false, but I used that process to conclude this."  

  ---

  #### V. Verdict Survival Report  
  | **Claim**               | **Self-Exempting Evidence** | **Self-Consuming Evidence** |  
  |--------------------------|------------------------------|------------------------------|  
  | **No-Akrasia Verdict**   | ✓ Survives                   | ✘ **Fails** (rationally forced akrasia) |  
  | **Discount-and-Descend** | ✓ Weakly survives*           | ✘ **Fails** (no unique/stable discount) |  

  *For self-exempting cases, discounting *can* work if base rates are known—but rarely with determinate precision.  

  **Root Problem**: The analogy assumes **modularity** (faulty module + trustworthy overseer), but self-consuming evidence violates this. The verdicts are artifacts of the analogy, not rationality.  

  ---

  #### VI. Better Analogy for Self-Consuming Evidence: **The Self-Adjudicating Court**  
  **Scenario**: A supreme court must rule on a constitutional challenge to its own authority.  
  - **What it captures**:  
    - The tribunal uses its *own* putative authority to judge its legitimacy.  
    - No higher court exists (no "ground truth").  
    - Possible outcomes:  
      - **Incoherence**: Declaring itself illegitimate invalidates the ruling.  
      - **Bootstrapping**: Asserting legitimacy without external warrant.  
      - **Stable avoidance**: Refusing to rule on its own competence (akin to bracketing higher-OEE).  

  **Advantages over standby instrument**:  
  1. **Self-reference**: Explicitly models the loop (ruling *on* the court *by* the court).  
  2. **No third-party arbiter**: Mirrors agent’s lack of epistemic "ground control".  
  3. **Non-scalar output**: Verdicts are binary/doxastic, not continuous.  
  4. **Captures akrasia**: Court may deem itself illegitimate yet issue rulings (cf. "I believe *p* though untrustworthy").  

  **What it gets right**:  
  - **Self-consuming evidence creates unstable fixed points**: Any ruling either presupposes authority or undercuts it.  
  - **Akrasia as pragmatic necessity**: Courts *must* rule to function, even when uncertain of their competence—as agents must use their faculties to function.  

  **Recommendation**: Use the **court analogy** for self-consuming cases and retain the **instrument** for self-exempting cases. This bifurcation reflects the deep structural divide in higher-OEE.  

  **Conclusion**: The standby instrument is pedagogically useful for self-exempting evidence but actively misleading for self-consuming cases—where it illegitimately sustains the two verdicts. Abandoning the analogy’s universality reveals epistemic akrasia and non-discounting responses as rationally live options when evidence consumes itself.
