  I'm opening a small interdiscplinary workshop on time and experience — about half the room are philosophers of physics who know the Rietdijk-Putnam block universe argument inside out, and the other half are clinical psycholgists who study grief and anticipation but dont know a Lorentz frame from a lunch frame. This is also my advisor's retirement send-off, she's sitting right there, so it needs to work as welcome remarks, not just a lecture. I want about four minutes of opening remarks. The structural hook should be Rietdijk's Andromeda-paradox point — that for an observer far enough away, simultaneity slices include events we call future — but used correctly: no determinism confusion, no sloppy talk about everything being already there like a movie. Instead, combine it with the idea that retirement, like now, is just a coordinate on a four-dimensional map. The speech should do real philosophical work with that: it should make the philosophers feel you're not misusing relativity, and it should give the psychologists something concrete about how people navigate lives that are spatially extended in time without implying free will is dead or that anticipation is an illusion. Please dont ask for readings or cite Putnam and Rietdijk directly — just build the speech around the idea. Keep it casual, there's probably a typo or two in this request, and avoid any bibliography or further-reading list. Make it land as affection and welcome, not a defense of eternalism.
