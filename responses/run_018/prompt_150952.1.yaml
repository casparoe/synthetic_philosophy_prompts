prompt: |-
  hey, i'm a novelist drafting a dialouge-heavy book and i want to check whether my characters' moral talk actually hangs together if you read it through an expressivist lens—like, moral sentences express attitudes not facts, and then you hit the Frege-Geach embedding problem when those sentences get stuck inside conditionals or negations. i need this turned into an actual procedre my editor (just me, honestly) can run on any scene without a philosophy degree. make it a checklist: step one, identify the speech act; step two, check if it's embedded; step three, apply the consistency test; and flag exactly where i have to make a judgment call instead of following a rule. the hard cases i keep occuring in my draft are moral parentheses—where a character quotes someone else's moral claim inside their own reasoning, like "if what she said—'stealing is wrong'—holds, then..."—and counterfactual moral planning, where a character figures out obligations in worlds where the wrong act turned out right. please apply the procedre to these three lines:

  A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."
  B. "Either torture is wrong or i've completely lost my moral compass."
  C. "She doesn't believe bribery is wrong, yet she refuses to take the money."

  for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway because real people talk like that—identify which one and say what consistency i'm sacrificing. also be honest about what the checklist can't do: can it tell sincere from ironic moral talk? can it handle sentences that mix description and evaluation, like "the wrongness of the act sparked the riot"? and where does it just fail because voice matters more than logical form? i need this to take ten minutes max per scene, and i'm the only person signing off.
reasoning: |-
  Okay, the user is a novelist working on a dialogue-heavy book and wants to ensure their characters' moral discussions hold up under expressivism. Expressivism says moral statements express attitudes, not facts, which leads to the Frege-Geach problem when these statements are embedded in conditionals or negations. The user needs a practical checklist for their editor (themselves) to apply without a philosophy degree. They mentioned specific tricky cases like moral parentheses and counterfactual planning.

  First, I need to break down the procedure into simple steps. The checklist should have three main steps: identify the speech act, check for embedding, and apply a consistency test. The user wants to know where judgment calls are necessary and what limitations the checklist has.

  For the examples provided (A, B, C), I need to apply the procedure. Example A involves a straightforward moral claim in a conditional. According to expressivism, "murder is wrong" expresses disapproval. But when embedded in a conditional, the attitude isn't directly expressed, which creates the Frege-Geach problem. The checklist should flag this but note that it's logically coherent and can be kept.

  Example B uses "torture is wrong" in a disjunction. Expressivism struggles with embeddings like "either P or Q" because the speaker isn't necessarily endorsing either attitude. The checklist should flag this as potentially incoherent but suggest keeping it for realism since people talk that way. The sacrifice here is meta-consistency between the speaker's attitudes and the disjunction's structure.

  Example C involves a belief attribution: someone not believing bribery is wrong but refusing the money. This mixes descriptive and expressive elements. The checklist might flag it as coherent because the refusal could stem from non-moral reasons, so no inconsistency. No strong reason to cut it.

  The user also asked about limitations. The checklist can't handle irony, mixed descriptive-evaluative sentences, or cases where voice overrides logic. For example, "the wrongness sparked the riot" treats "wrongness" as a fact, conflicting with expressivism. But in dialogue, voice might justify its use. The key is balancing philosophical rigor with realistic dialogue.

  I should structure the checklist clearly, with steps and specific actions. Emphasize that steps 2 and 3 require judgment calls. Time per scene should be under 10 minutes, focusing on problematic embeddings. Highlight that real people don't strictly follow expressivism, so some inconsistencies are acceptable for authenticity.
answer: |-
  Here's your **Expressivism Dialogue Check Procedure** – designed as a ruthless 10-minute scene audit. It targets *logical coherence under expressivism*, not realism or rhetorical power. Real people absolutely *do* violate these rules, so use flags as prompts for *intentional* choices, not automatic cuts.

  **The Expressivism Dialogue Check Procedure (v1.0)**

  1.  **Identify the Core Moral Speech Act(s):**
      *   **Action:** Scan the dialogue line. Underline every declarative sentence fragment expressing a core moral evaluation (e.g., "X is wrong/good/right/obligatory," "You should/shouldn't Y," "Z is virtuous").
      *   **Expressivist Lens:** Treat each underlined part as *expressing a non-cognitive attitude* (disapproval, approval, commitment, etc.) by the *speaker at that moment*, **not** stating a fact.
      *   **Judgment Call:** Is this fragment genuinely *expressing an attitude* (sincere, ironic, hesitant) or is it purely *descriptive* (e.g., reporting what someone else said/believes)? Flag ambiguous cases.

  2.  **Check for Embedding:**
      *   **Action:** Look at the *grammatical structure* surrounding each underlined core moral act from Step 1. Is it inside:
          *   A conditional ("if... then...")?
          *   A negation ("it is **not** the case that..." or prefix "not")?
          *   A disjunction ("either... or...")?
          *   A belief/attitude report ("She believes that...", "He said that...")?
          *   A modal context ("It might be that...", "In a world where...")?
          *   A question ("Is X wrong?")?
      *   **Expressivist Lens:** This is where Frege-Geach bites. The attitude expressed in the core fragment *isn't directly expressed* when embedded; the sentence structure treats it like a fact that can be true/false.
      *   **Judgment Call:** Flag *every* instance of embedding. This is the primary source of potential expressivist incoherence. Ask: "Is the *speaker* using this structure to express their *own* attitude coherently, or is the structure forcing the moral fragment to act like a proposition?"

  3.  **Apply the Consistency Test:**
      *   **Action:** For each *embedded* moral fragment:
          *   **A. Conditional Antecedents ("if X is wrong..."):** Does the speaker *actually hold* the attitude expressed by X? If not, why are they using it hypothetically? Is their overall point coherent *without* them endorsing X?
          *   **B. Negations ("X is not wrong"):** Is this expressing *the absence of disapproval* or *active approval*? Is it consistent with the speaker's other expressed attitudes?
          *   **C. Disjunctions ("Either X is wrong or Y"):** Can the speaker consistently hold the disjunction true *without* necessarily holding either disjunct's attitude? Does the context force them to endorse one?
          *   **D. Belief Reports ("She believes X is wrong"):** Is this *only* describing her psychology, or is the speaker subtly endorsing/rejecting X? Is the report consistent with the speaker's *own* attitudes expressed elsewhere?
          *   **E. Modals/Counterfactuals:** Does the speaker maintain a *consistent set of underlying attitudes* when imagining worlds where core moral "facts" change? Does the counterfactual reasoning reveal a *descriptive* belief about consequences/conventions masquerading as the moral attitude?
      *   **Expressivist Lens:** The test is whether the speaker's *actual, underlying non-cognitive attitudes* make sense together given how they've used the embedded moral language. The *logic* of the sentence structure must map onto a *psychologically plausible constellation of attitudes*.
      *   **Judgment Call:** Does the structure force an *attitude* the speaker likely *doesn't hold*, or create an *attitude conflict* the speaker ignores? Flag any tension between sentence logic and plausible attitudes. **This step requires the most judgment.**

  ---

  **Applying the Procedure to Your Examples:**

  *   **A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."**
      *   **Step 1:** Core Acts: 1. "Murder is wrong" (Speaker expresses disapproval of murder). 2. "the judge should halt the trial" (Speaker expresses pro-attitude towards halting).
      *   **Step 2:** Embedding: The *second* instance of "murder is wrong" is embedded as the antecedent of a conditional ("**if** murder is wrong **then**...").
      *   **Step 3 (Consistency):** Speaker *endorses* "Murder is wrong" directly first. The conditional *uses* "murder is wrong" hypothetically, but since they *do* hold that attitude, it functions as a descriptive premise *for them*. The inference is logically valid and expressively coherent *for this speaker* because their attitude makes the antecedent "true" *for their reasoning*. **FLAG:** Minor (embedding exists), but **SAFE**. Keep it.

  *   **B. "Either torture is wrong or I've completely lost my moral compass."**
      *   **Step 1:** Core Act: "torture is wrong" (Expresses disapproval of torture).
      *   **Step 2:** Embedding: "torture is wrong" is embedded in a disjunction ("**Either** torture is wrong **or**...").
      *   **Step 3 (Consistency):** **PROBLEM (But Keep It Anyway!)**. Expressivism struggles with unasserted disjuncts. The speaker *expresses* disapproval of torture ("torture is wrong"). However, the disjunction structure treats *both* disjuncts as possible truth-apt options. The second disjunct ("I've lost my compass") implies that *if torture isn't wrong*, the speaker's entire moral framework collapses. But on expressivism, "torture isn't wrong" isn't a *fact* that could cause this collapse; it would just mean the speaker *doesn't disapprove*. The logical connection relies on treating "torture is wrong" as a *factual belief* central to their worldview. **What's Sacrificed:** Strict *meta-consistency*. The disjunction treats the *moral attitude* like a *descriptive belief* whose falsity would have psychological consequences. **FLAG:** Major inconsistency on expressivist grounds. **VERDICT:** **KEEP IT.** Real people use this structure constantly to express the foundational nature of a moral commitment. The expressive *force* ("My condemnation of torture is so core that doubting it feels like losing my mind") overrides the technical embedding flaw. It's powerful dialogue.

  *   **C. "She doesn't believe bribery is wrong, yet she refuses to take the money."**
      *   **Step 1:** Core Act: "bribery is wrong" (Embedded inside "doesn't believe" - **see Step 2**).
      *   **Step 2:** Embedding: "bribery is wrong" is embedded inside a negation ("doesn't believe") and a belief report ("She doesn't believe that...").
      *   **Step 3 (Consistency):** **COHERENT.** The speaker is *describing* "her" psychological state: the *absence* of the disapproval attitude towards bribery. This is purely descriptive, not the speaker expressing their *own* attitude about bribery (though they might elsewhere). The observation about her action (refusing money) is also descriptive. There's no *logical* contradiction here on expressivism: she might refuse for non-moral reasons (fear, pride, policy). No attitude expressed by the *speaker* is rendered inconsistent. **FLAG:** Minor (embedding exists). **SAFE.** Keep it.

  ---

  **What the Checklist CAN'T Do (Be Brutally Honest):**

  1.  **Sincere vs. Ironic:** Absolutely not. "Stealing is *so* wrong" could be sincere condemnation or vicious irony. The checklist sees the same logical form. **Rely on context & character voice.** (Judgment Call in Step 1).
  2.  **Mixed Descriptive/Evaluative Sentences (e.g., "The wrongness of the act sparked the riot"):** **Flags as Problematic.** This directly *reifies* "wrongness" as a causal property in the world, acting like a fact. Expressivism rejects this. **Judgment Call:** Is this *deliberate* (e.g., a character who *is* a moral realist)? Or is it just natural language shorthand? If shorthand, does it undermine the intended expressivist feel? Often, **keep it** for flow, but be aware it's descriptivist language.
  3.  **Where Voice Trumps Logic:** **Constantly.** People use embedded moral language illogically all the time (like your Example B). The checklist flags the *technical* incoherence. Your job is to decide: Does this illogic reveal character (confusion, passion, hypocrisy)? Or does it just sound unintentionally sloppy? If the former, **keep it and amplify the character voice.** If the latter, rephrase.
  4.  **Resolving Deep Philosophical Disputes:** It won't settle if expressivism itself is correct or solve all Frege-Geach objections. It applies expressivist scrutiny *consistently*.
  5.  **Detecting Subtle Non-Cognitivist Varieties:** It treats all core moral claims as "attitude expressions," glossing over differences between emotivism, prescriptivism, quasi-realism, etc. Good enough for narrative logic.

  **Procedure Summary:** Identify Attitudes -> Hunt Embeddings -> Stress-Test Attitude Consistency -> **Make Intentional Choices** on flagged items (Keep for Realism/Voice? Keep for Character? Rewrite for Expressivist Purity?).

  This gives you a focused 10-minute audit. You're not building a philosophical treatise; you're ensuring your characters' moral talk has a layer of underlying psychological plausibility consistent with an expressivist worldview, while reserving the right to let authentic (if logically messy) human expression win the day. Now go flag those moral parentheses and counterfactuals!
