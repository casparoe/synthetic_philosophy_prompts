prompt: |-
  I'm putting together a proposal for a one-semester independent study on Dewey — specifically his idea that democracy is a form of social inquiry, not just a voting system. I keep running into the same two readings: either Dewey means democracy works like science (test policies, learn from failure, revise), or he means democracy expresses shared moral values that shouldn't be up for grabs. I think both miss something, but I'm not sure I've pinned it down.

  Here's my half-baked angle: Dewey's experimentalism might actually require us to seperate procedural experimentation — trying out laws and seeing results — from ontological experimentation, where the community itself is changed by the process of inquiry. If that's right, there's a real tension. Full openness about who we are undermines the stability democracy needs, but protecting our identity blocks genuine inquiry. So my research question is whether Dewey's texts (especially Democracy and Human Nature and the Logic essays) contain the resources to keep these two kinds of experimentation distinct without collapsing one into the other, and if they don't, whether that's a fatal problem for his defense of democracy.

  I need you to turn this into an actual proposal: state the question precisely, show why the standard science-model and moral-community readings leave this gap open, sketch a month-by-month plan for one semester (probably close reading plus constructing two hypothetical institutional cases), describe what success looks like (maybe a reconstructed distinction that resolves the tension) and what counts as failure (probably that Dewey just conflates the two levels and we have to choose between them), and keep the scope realistic for about 12-15 weeks. Don't include a bibliography or citation list — I'll handle that. Also, since I'm not totally sure the ontological experimentation framing isn't just my own invention, please say how confident you are in the proposal's framing and point out exactly where you're least sure — maybe the textual basis or the distinction itself. I was talking this over with my roomate who said I was overreading, but I think there's something there. Make it sound like I actually have a plan, not just a vibe.
