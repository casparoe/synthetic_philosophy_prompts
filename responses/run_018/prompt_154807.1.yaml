answer: |-
  ## Ethics Seminar Final Exam Question (90 minutes)

  **QUESTION:** You are confronted with a rescue scenario with three options:  
  (A) Save Alice (a specific person known to you)  
  (B) Save five strangers  
  (C) Flip a fair coin: Heads saves Alice, Tails saves the five strangers.  

  John Taurek argues that the "numbers should not count" in such dilemmas, rejecting the aggregation of individual claims into a larger collective claim. Utilizing Taurek's core reasoning – particularly his commitment to the separateness of persons and the logic of pairwise comparison – analyze the following:  

  1.  **Permissibility of the Coin-Flip:** Does Taurek's view imply that choosing option (C), the coin-flip, is morally *impermissible* compared to simply choosing option (A) (saving Alice)? Or is it morally equivalent? Justify your answer using his pairwise comparison logic.  
  2.  **Absurdity and Reductio:** If Taurek's view implies that (A) and (C) are morally equivalent (or that (C) is impermissible), does this constitute an *absurd* result? Does this absurdity successfully function as a *reductio ad absurdum* of Taurek's core position against counting numbers?  
  3.  **Thresholds:** Could Taurek consistently modify his view to allow for a *threshold* (e.g., aggregation *only* kicks in when the disparity is far larger than 5 vs. 1), thereby avoiding the apparent absurdity in this case while retaining his fundamental anti-aggregationist premise?  

  **Your answer must engage directly with the logic of pairwise comparison and the non-aggregationist foundation of Taurek's argument. Explain *why* Taurek rejects aggregation and how this rejection plays out in this specific three-option scenario.**

  ---

  ## Model Answer (Approx. 600 words)

  Taurek's radical argument stems from the foundational premise that distinct individuals possess separate, non-fungible claims that cannot be aggregated into a single, larger claim. Saving five lives is not, for Taurek, fulfilling *one* claim five times stronger than saving one life; it is fulfilling five *distinct* claims, each identical in weight to the claim of the single individual. Aggregation treats individuals as mere contributors to a collective good, violating the "separateness of persons." Consequently, when faced with saving one (Alice) or saving five strangers, Taurek argues we have no moral basis for preferring the five. The claims are pairwise incomparable as a collective; we can only compare each stranger *individually* to Alice. Since no single stranger has a stronger claim than Alice, we cannot justify favoring the five. **(Point 1: Rejection of Aggregation - 4 marks)**

  This logic extends critically to the coin-flip option (C). Option (C) does *not* involve aggregating the five strangers. Instead, it establishes a procedure where Alice is pairwise compared to *each* stranger individually with equal probability. Heads gives Alice a 100% chance against each stranger's 0% chance; Tails gives each stranger a 20% chance (1/5th of the 100% chance given to the group *as the outcome of the flip*) against Alice's 0% chance. Crucially, for Taurek, since no individual stranger has a claim superior to Alice's, giving each an *equal* chance via the coin flip (interpreted as giving each *individual* involved a fair shake in the pairwise contest) appears to be the only way to respect the *equality* of their individual claims without illicitly aggregating them. Choosing (A) outright gives Alice certainty and each stranger nothing, which respects the lack of any *individual* claim stronger than Alice's. The coin-flip respects that same lack of superior individual claim but introduces fairness by giving each person an equal *chance* of having their claim met. Thus, for Taurek, both (A) and (C) are permissible; they are morally equivalent ways of respecting the fundamental equality of the individuals involved. Neither involves preferring a collective entity. **(Point 2: Coin-flip respects pairwise equality, avoids aggregation - 4 marks)**

  Therefore, Taurek *is* committed to indifference between saving Alice outright (A) and flipping the coin (C). Choosing the coin-flip is *not* impermissible; it's an alternative, equally valid way to act given the absence of a reason to favor the five collectively. **(Point 3: Indifference between (A) and (C) - 3 marks)**

  Is this indifference absurd? It is profoundly *counterintuitive*. Intuition screams that flipping the coin is *obviously* better than saving Alice outright because it gives the five a chance. However, for Taurek, labeling it "absurd" relies precisely on the aggregative intuition he rejects – the idea that the *number* of claims creates a stronger *collective* claim that *should* be given a chance. The counterintuitiveness stems from our ingrained utilitarian bias, not from a logical contradiction *within* Taurek's framework of separate claims and pairwise equality. While deeply unsettling, the result is a consistent, if radical, application of his core anti-aggregationist principle. It highlights the stark implications of taking separateness seriously, but it does not constitute an internal logical absurdity that *reductios* his view. **(Point 4: Counterintuitive ≠ Absurd (Reductio fails) - 4 marks)**

  Finally, grafting a threshold onto Taurek's view (e.g., aggregate only for disparities >100) is incompatible with its core. The threshold arbitrarily declares that separateness matters only up to point *n*, beyond which aggregation suddenly becomes valid. This concedes the fundamental utilitarian premise that numbers *can* outweigh individuals *if enough are involved*, directly contradicting Taurek's bedrock argument that individuals are separate and claims are non-fungible *regardless of number*. There is no non-arbitrary principle within Taurek's framework to justify why 100 separate claims suddenly fuse into one mega-claim, while 99 do not. Thresholds are an *ad hoc* abandonment of his anti-utilitarian foundation to salvage palatability, betraying the core premise. **(Point 5: Thresholds betray core anti-utilitarian premise - 5 marks)**

  ---

  ## Marking Scheme (Total: 20 marks)

  **Award marks for clearly demonstrating understanding and correctly applying the concepts. Deduct for the typical mistakes listed.**

  1.  **Rejection of Aggregation & Pairwise Comparison Basis (4 marks):**
      *   **Hit (4):** Clearly explains Taurek's core argument: individuals are separate; claims are distinct and non-fungible; cannot aggregate claims of strangers into one stronger collective claim against Alice; preference for the five requires illicit aggregation.
      *   **Typical Mistake (0-2):** Mentions "separateness" vaguely without explaining *why* it forbids aggregation. Confuses it with deontological constraints (e.g., "can't use people as means"). Fails to articulate the *logic* of only being able to compare claims pairwise (Alice vs. Stranger1, Alice vs. Stranger2...) and finding no basis for favoring any stranger *individually*.

  2.  **Coin-Flip Respects Pairwise Equality, Avoids Aggregation (4 marks):**
      *   **Hit (4):** Correctly argues that for Taurek, the coin-flip is *not* aggregation. It provides a fair procedure giving Alice and each stranger an equal *individual* chance (via the lottery mechanism) without creating a collective entity. Justifies why Taurek sees (A) and (C) as *both* respecting the equality of individual claims: (A) by acting on the lack of superior claim, (C) by giving equal probabilistic weight.
      *   **Typical Mistake (0-2):** Claims coin-flip *is* aggregation (treating the five as a bloc given a chance). Asserts coin-flip is impermissible without explaining *why* under Taurek's logic. Uses expected value reasoning (e.g., "coin-flip gives higher expected lives saved") – which is fundamentally aggregative and incompatible with Taurek.

  3.  **Taurek's Indifference between Saving Alice and Flipping Coin (3 marks):**
      *   **Hit (3):** Clearly states that Taurek's logic implies moral indifference/permissibility equivalence between choosing (A) and choosing (C). Saving Alice outright is a valid option since no stranger has a stronger claim; the coin-flip is the alternative valid option for respecting equality via chance.
      *   **Typical Mistake (0-1):** Claims Taurek *must* prefer the coin-flip (smuggling in aggregation/expected value). Claims Taurek *must* prefer saving Alice (misunderstanding the role of the coin-flip as respecting equality). Suggests Taurek might have other reasons to prefer one (e.g., special obligations to Alice) not grounded in his *core* argument about numbers.

  4.  **Counterintuitive ≠ Absurd / Reductio Fails (4 marks):**
      *   **Hit (4):** Acknowledges the powerful counterintuitiveness. Argues convincingly that the "absurdity" charge relies on the *rejected* aggregative intuition ("of course the five deserve a chance!"). Explains that within Taurek's consistent framework of separate claims and pairwise equality, the result, while jarring, is not an *internal* logical contradiction. Correctly identifies that the reductio fails because it assumes the truth of the premise (aggregation) that Taurek denies.
      *   **Typical Mistake (0-2):** Simply asserts the result *is* absurd without analysis. Conflates counterintuitive with logically contradictory. Argues the reductio succeeds because "no reasonable person" would be indifferent, failing to engage with Taurek's internal logic. Claims Taurek *must* find the coin-flip absurd (contradicting point 3).

  5.  **Threshold Hybrid Betrays Core Premise (5 marks):**
      *   **Hit (5):** Provides a strong critique: A threshold arbitrarily declares separateness non-absolute. It concedes that *sufficient numbers* can create a stronger collective claim, directly violating Taurek's absolute rejection of claim fungibility and aggregation. Points out the inherent arbitrariness of the threshold (why 100? Why not 6?) and the lack of a non-aggregative principle to justify it. Concludes it abandons the anti-utilitarian/anti-aggregationist core.
      *   **Typical Mistake (0-2):** Argues a threshold *is* compatible or even implied by Taurek. Fails to see how thresholds rely on fungibility/aggregation for large numbers. Focuses only on practicality or palatability without addressing the fundamental philosophical incompatibility. Suggests Taurek could adopt it without undermining his core argument.
