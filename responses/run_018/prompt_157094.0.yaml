  First, I should recall what spandrels are. In evolutionary terms, spandrels are by-products of adaptations, not directly selected for. The colleague insists the sunk-cost fallacy is an adaptation, not a spandrel. The user wants to dissect "nature knows best" to see if any valid interpretation supports inferring direct selection from commonality.

