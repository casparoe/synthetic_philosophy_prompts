answer: |-
  ## Defending the Delegated-Authority Account of Promises

  The delegated-authority account offers a profound and distinct foundation for the binding force of promises, shifting the focus from consequences (harm, disappointment) or psychological states (expectations) to a structural transfer of normative power. Here’s a defense and explanation addressing your specific points:

  **Core Argument: Jurisdictional Transfer, Not Consequences or Expectations**

  1.  **The Act of Transfer:** When A promises B to φ (e.g., water plants), A performs a normative act. A doesn't merely state an intention or predict the future. A *transfers* normative authority over the specific domain of action φ (watering the plants) to B.
  2.  **B as Sovereign over φ:** For the duration and scope of the promise, B gains a unique normative position regarding A's φ-ing. B now has the *right* to command (within reason), demand, waive, or release A's obligation concerning φ. B becomes the "legislator" for A's practical reasoning within this bounded domain. A's reason to φ is no longer solely internal ("I want to") or external ("it's good"); it's now "B has authority over this."
  3.  **Breaking as Self-Undermining Legislation:** When A breaks the promise (fails to φ without release), A acts as both the original legislator (who enacted the transfer) and the subject *under* that legislation. A effectively declares their own enacted statute (B's authority over φ) invalid *while still being bound by it*. This is self-contradictory and incoherent, analogous to a legislature passing "Law X" and then, while still operating under Law X, declaring "Law X is hereby repealed for me alone." The promisor attempts to revoke the authority *they themselves created and remain subject to*, undermining the very normative structure they established.

  **Addressing Key Challenges:**

  1.  **Promises Unknown to the Promisee (e.g., A promises to donate to B's charity, but B never learns of it):**
      *   **The Transfer Occurs Regardless:** The act of promising *itself* enacts the transfer of authority. It creates a normative relationship where B *now has* authority over A's φ-ing (donating), even if B is unaware.
      *   **Dormant Authority:** B's authority exists but is "dormant." B cannot *exercise* it (demand, waive) without knowledge, but the normative structure is in place. A's failure to donate is still a violation of this structure – A is failing to respect the authority they placed over that action domain.
      *   **Analogy:** Granting someone property rights over a parcel of land you own. The transfer happens when you sign the deed, even if the recipient hasn't heard the news or visited the land. Your subsequent use of the land (e.g., building on it) violates *their* rights, established by the transfer, regardless of their awareness.

  2.  **Objection: Overstates Autonomy (Makes Promises Too Binding / Like Slavery):**
      *   **Specificity and Limitation:** The transfer is *highly specific* (only over domain φ) and *temporary* (only for the promise's duration/scope). It doesn't grant B blanket authority over A's entire life or practical reasoning – only over the promised action φ. Autonomy is curtailed *only* within this narrow, self-chosen domain.
      *   **Voluntary Creation:** The *initial act* of promising is the paradigmatic exercise of autonomy. By promising, A autonomously *chooses* to create this specific normative relationship and transfer this specific slice of authority. The binding force arises from A's own autonomous creation, not from an external imposition. It's autonomy *in action*, creating a self-imposed constraint.
      *   **Release Mechanism:** Crucially, B (the grantee of authority) can *release* A from the obligation, restoring A's full autonomy over φ. This power of release underscores that the authority is delegated, not absolute or inherent to B. The structure itself includes an autonomy-restoring mechanism controlled by the authority holder (B).

  3.  **Distinguishing Promise-Breaking from Mere Change of Mind (No Harm/Disappointment):**
      *   **The Normative Structure is Key:** The wrong in promise-breaking, under this view, lies *primarily* in violating the normative structure created by the transfer, *not* in the consequence (harm) or the psychological state (disappointment). A mere change of mind about φ-ing, absent a promise, involves no such transfer. A remains the sole sovereign over their decision regarding φ.
      *   **Self-Undermining Act:** Breaking the promise is a performative contradiction. A acts *as if* they still have sole authority over φ, while simultaneously acknowledging (through the prior promise) that they transferred that authority to B. The mere change of mind involves no such contradiction; A was always the sole authority.
      *   **Example:** Imagine A spontaneously decides to water B's plants while B is away, just to be nice. Later, A changes their mind and doesn't do it. B is unharmed (plants were fine) and had no expectation (it was unsolicited). Here, no wrong is committed because A never transferred authority over watering to B. Contrast this with A *promising* to water the plants and then changing their mind. Even if the plants miraculously survived without water and B never knew about the promise, A's act of breaking it is wrong because they violated the normative structure they created – they ignored B's authority over that specific action, attempting to revoke their own legislation.

  **Conclusion:**

  The delegated-authority account provides a robust, non-consequentialist foundation for the binding force of promises. It locates the wrong of promise-breaking not in contingent consequences (harm) or subjective states (disappointment), but in the violation of a self-created normative structure: the promisor's attempt to unilaterally revoke a specific, temporary transfer of practical authority they enacted, while remaining subject to it. This account successfully handles cases of unknown promises (transfer occurs, authority is dormant), avoids overstating autonomy (transfer is specific, temporary, voluntary, and releasable), and clearly distinguishes binding promises from mere non-binding changes of mind by grounding the obligation in the unique normative relationship created by the act of promising itself. Promises bind because, in making them, we create a miniature, temporary constitutional order over a slice of our own agency, placing another in the position of rightful sovereign within that limited domain. Breaking a promise is the incoherent act of trying to overthrow that sovereign while still being its citizen.
