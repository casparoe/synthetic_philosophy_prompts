prompt: |-
  i started learning guitar and my roommate who's into philosphy sumed up Ryle's knowing-how vs knowing-that thing for me. he said Ryle's main point is that knowing how to do something is a practical ability, not just knowing a bunch of facts, and he attacked the intellectualist legend — the idea that smart action always needs a conscious rule applied first. but my roommate also said Ryle actually thought knowing-how involves propositional knowledge too, just arranged in a dispositional architecture where rules are stored implicitly and activated automatically, so it's not conscious theory but it's still basically propositions in the brain. then he said modern embodied cognition shows Ryle was half right: skills aren't conscious theories, but they are subpersonal representations that work like implicit premises, so knowing-how is really a subtype of knowing-that after all, just hidden in the body. is that a fair read of Ryle? which parts are accurate, which are sneaky misrepresentations, and does the embodied-cognition move actually follow? please take a definite position — i want to know what to believe, not just a list.
reasoning: |-
  Okay, let's tackle this user's query. They're learning guitar and their roommate explained Ryle's knowing-how vs knowing-that distinction, tying it to embodied cognition. The user wants to know if this interpretation is accurate and where it might misrepresent Ryle.

  First, I need to recall Ryle's core arguments. He definitely opposed the intellectualist legend—the idea that actions require prior conscious rule application. So the roommate got that part right. But then the roommate claims Ryle thought knowing-how involves propositional knowledge stored dispositionally. That's a red flag. Ryle was clear that knowing-how isn't reducible to knowing-that. He avoided mental representations, focusing on dispositions as abilities, not hidden propositions.

  The embodied cognition angle is tricky. Modern theories might see skills as subpersonal representations, but Ryle himself wouldn't agree. He emphasized the body's role in skilled action without invoking internal propositions. The roommate's view that knowing-how is a subtype of knowing-that is exactly what Ryle argued against. 

  I should highlight the missteps: conflating dispositions with implicit propositions and claiming Ryle endorsed that. Also, note that embodied cognition doesn't necessarily support the intellectualist view; some branches reject representations altogether. The user needs clarity to avoid confusion in their learning. Emphasize Ryle's actual stance and why the roommate's take, though common, misreads him. Make sure to take a definite position as requested.
answer: |-
  You've hit on a fascinating and often misunderstood debate. Your roommate captures the *spirit* of Ryle's critique but fundamentally **misrepresents his core thesis** about the relationship between "knowing-how" and "knowing-that." The embodied cognition angle is an interesting modern development, but it **does not vindicate the intellectualist legend Ryle attacked** and actually leans *towards* Ryle's side in crucial ways. Here's the breakdown:

  1.  **What Your Roommate Got Right:**
      *   **The Core Critique:** Ryle absolutely argued that "knowing-how" (e.g., playing guitar, tying a knot) is a distinct kind of knowledge – a practical ability, skill, or disposition – fundamentally different from "knowing-that" (e.g., knowing the fact "the chord shape for G major is..."). This is central.
      *   **Attacking the Intellectualist Legend:** He brilliantly dismantled the idea ("intellectualist legend") that intelligent action *must* involve a prior conscious application of a theoretical rule or piece of propositional knowledge. He showed this leads to an infinite regress (if every action needs a prior rule-application, what applies the rule to apply the rule?).
      *   **Dispositional Architecture:** Ryle *did* frame knowing-how in dispositional terms. Skills *are* dispositions to behave intelligently in appropriate situations.

  2.  **The Crucial Misrepresentation:**
      *   **"Knowing-how involves propositional knowledge too, just arranged dispositionally... it's still basically propositions in the brain."** **This is flatly wrong according to Ryle and betrays his entire project.** This is where your roommate sneaks the intellectualist legend back in through the back door.
          *   Ryle's **whole point** was that knowing-how is *sui generis* – a fundamentally *different logical category* from knowing-that. It's *not* reducible to knowing-that, even implicitly or dispositionally stored. A disposition *to behave skillfully* is not the same thing as having a bunch of hidden propositions *about* the skill.
          *   Ryle explicitly rejected the idea that the mind is primarily a storehouse of propositions. His dispositions are **abilities**, **capacities**, and **propensities to act**, *not* internal representations of rules or facts waiting to be "activated." When a skilled guitarist plays, they aren't (according to Ryle) activating hidden propositions stored in their brain; they are *exercising a complex, embodied ability* acquired through practice.
          *   **Ryle's Goal:** To show that intelligence resides *in the performance itself*, in the *doing*, not necessarily in a prior intellectual operation involving propositions. The skill *is* the intelligent disposition.

  3.  **Embodied Cognition & Its Relation to Ryle:**
      *   **The Roommate's Claim:** "Modern embodied cognition shows... skills are subpersonal representations that work like implicit premises, so knowing-how is really a subtype of knowing-that after all, just hidden in the body."
      *   **The Reality:**
          *   **Against Ryle?** This view (that skills *are* subpersonal propositional representations) is precisely the *kind* of view Ryle was arguing *against*. It's a sophisticated modern version of the intellectualist legend, locating the intelligence not in conscious thought, but in unconscious, body-based representations. Ryle would likely reject the need to posit "implicit premises" *at all*.
          *   **For Ryle?** However, **much of embodied cognition actually strongly supports Ryle's core insight against intellectualism and aligns with his emphasis on practice and the body:**
              *   **Beyond Representation:** Many embodied cognition theorists argue that intelligence often emerges from the dynamic interaction of brain, body, and environment *without* requiring internal representations (propositional or otherwise). This is deeply anti-intellectualist and Rylean in spirit.
              *   **The Body's Role:** Embodied cognition emphasizes that skills are *embodied* – they involve muscle memory, sensorimotor contingencies, and patterns of interaction shaped *by* the body and *in* the world. This resonates with Ryle's focus on practice and performance as constitutive of the skill itself.
              *   **"Subtype of Knowing-That"? No.** While *some* branches of cognitive science *do* model skills using subpersonal representations (which they *might* loosely call "proposition-like" or "knowledge-like"), this is a highly contested and specific theoretical commitment within cognitive science. **It is not the consensus view of embodied cognition, nor does it prove knowing-how is *logically reducible* to knowing-that.** Many embodied cognition theorists explicitly reject this reduction. Crucially, representing something subpersonally as data or a parameter is *not* the same as possessing "knowing-that" in the philosophical sense (which implies accessibility to conscious thought/reasoning).

  **What to Believe: The Definitive Position**

  1.  **Ryle Was Largely Correct on His Core Thesis:** Knowing-how is a distinct kind of knowledge (practical ability/disposition) that cannot be reduced to, nor is it primarily constituted by, knowing-that (propositional knowledge). Intelligent action does not *necessarily* require the prior conscious or unconscious application of propositional rules. Skill *is* intelligent performance.
  2.  **Your Roommate Misrepresented Ryle:** The claim that Ryle thought knowing-how involves dispositionally stored propositional knowledge is a profound misreading. Ryle explicitly fought *against* reducing know-how to know-that, even implicitly. Dispositions, for Ryle, are *abilities*, not hidden propositions.
  3.  **Embodied Cognition Mostly Supports Ryle Against Intellectualism:** Modern embodied cognition provides scientific grounding for Ryle's core insight: intelligence is often "in the doing," deeply tied to the body and its interactions with the world, and frequently operates without conscious rule-following.
  4.  **Embodied Cognition Does NOT Prove Knowing-How is Knowing-That:** While *some* cognitive scientists use representational models for skills, this is a specific theoretical tool, not proof of logical reducibility. Much of embodied cognition actively challenges the idea that all cognition requires internal representations (propositional or otherwise), further undermining the intellectualist legend Ryle attacked. The "hidden in the body" part often points to *non-propositional*, sensorimotor patterns, not implicit premises.

  **For Your Guitar Playing:** Ryle is your friend! Focus on the *practice* and the *doing*. Your skill isn't just stored facts about chords; it's the growing ability of your fingers to find positions, your ears to hear tuning, your body to feel rhythm, emerging from countless repetitions. You don't need to consciously recall a theory of chord construction to play a G chord smoothly; that smoothness *is* your knowing-how. While your brain is obviously processing complex information, Ryle (and much of embodied cognition) argues that reducing that skill to internal "propositions" fundamentally misunderstands the nature of practical ability. Keep practicing – that's where the *real* knowledge lives.
