answer: |-
  Here are five desiderata for a graded-binding theory of consciousness distribution:

  1.  **Avoid Reflex/Complexity Decoupling:** The theory must distinguish integrated phenomenal states enabling goal-directed hunting from unconscious reflex arcs (e.g., decapitated octopus arm behaviors), using binding-density gradients rather than mere reflex presence/absence. *Motivating Case: Decapitated octopus arm behaviors vs. intact hunting.* **Non-negotiable.** *Tension with scaling.*

  2.  **Resolve the Scaling Problem:** It must permit fractional phenomenal access that translates to non-binary moral weight (e.g., partial consciousness in isolated ganglia), without implying trivial welfare significance for minimal integration. *Motivating Case: Fractional moral weight from partial consciousness.* **Camp-specific (anti-binary views).** *Tension with reflex decoupling.*

  3.  **Respect Metabolic-Phylogenetic Continuity:** The framework must reconcile high metabolic costs of binding with phylogenetic continuity, avoiding implausible jumps in consciousness distribution (e.g., sudden emergence only in vertebrates). *Motivating Case: Metabolic cost arguments vs. gradual neural evolution.* **Non-negotiable.**

  4.  **Address the Modularity Objection:** It must explain why isolated neural modules (e.g., insect ganglia, mammalian spinal cord) with high *local* integration don't automatically possess isolated phenomenal states ("micro-consciousness"), incorporating a system-wide binding threshold or dimmer-switch principle. *Motivating Case: Localized ganglia functionality without apparent subjective awareness.* **Non-negotiable.** *Confidence Weakest Here.*

  5.  **Maintain Conceptual Distance & Practical Utility:** The core phenomenal density variable must resist reduction to existing integration metrics (e.g., Φ) while being empirically anchored enough to guide welfare judgments across species, explicitly avoiding panpsychist leakage and human exceptionalism. *Overall Confidence: ~70%.* **Non-negotiable.** *Motivating Case: Avoiding collapse into panpsychism or anthropocentrism.*
