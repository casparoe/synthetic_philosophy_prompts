  Looking at Voss's verdicts, I need to reconstruct the patterns. Hinges seem to be propositions that are fundamental to a practice's framework—denying them causes the practice to collapse or become unrecognizable. For instance, physical objects in perception or DNA requiring biological material in forensics are hinges, while consciousness from brain activity in neurology or ZFC in mathematics are revisable. The key difference appears to be whether abandoning the proposition destroys the discipline's identity or just changes its content.

  I need to develop two distinct interpretive rules that both fit Voss's six verdicts but diverge on the palaeogenomics case. The first rule could be an Institutional Collapse Rule: a proposition is a hinge if its denial would make the practice institutionally unrecognizable. The second might be a Practice-Internal Immunity Rule: a proposition is a hinge if it's treated as immune to revision from within the practice's normal methods. Both rules explain why physical objects and DNA material are hinges (their denial collapses perception or forensics), and why consciousness and ZFC aren't (neurology could shift theories, mathematics has alternative foundations).

  For the palaeogenomics case—"contamination is detectable and excludable"—I predict Voss would classify it as a hinge. Under the Institutional Collapse Rule, if this were false, palaeogenomics would lose its credibility and institutional identity as DNA analysis of ancient remains. Under the Practice-Internal Immunity Rule, practitioners treat it as a non-negotiable starting point, not something they test in each study. I favour the Institutional Collapse Rule because it better captures how practices are socially embedded; the alternative would make hinges too fragile to minor methodological shifts.

  To distinguish these rules, I propose a test case in quantum computing: "Quantum decoherence can be managed sufficiently for error correction." The Institutional Collapse Rule might not see this as a hinge since quantum computing could persist with different approaches, while the Practice-Internal Immunity Rule would likely classify it as a hinge since it's treated as foundational internally. This shows that Voss's view prioritises the institutional architecture of science—hinges are what sustain a practice's very existence, not just its current methods.
answer: |-
  ### 1. Reconstruction of the Track Record  
  Voss’s verdicts reveal a pattern distinguishing hinges from revisable scaffolds. Hinges (cases 1, 2, 4, 5) are *framework-constitutive*: their denial dissolves the practice’s coherence or identity, rendering its epistemic aims unintelligible (e.g., "physical objects" for perception, "biological material" for forensics). Non-hinges (cases 3, 6) are *content-constitutive*: empirically or theoretically substantive claims that anchor current methods but admit revision without collapsing the discipline (e.g., neurology persists if consciousness arises non-biologically; mathematics survives without ZFC dominance). Crucially, hinges exhibit *institutional immunity*—they are not testable within the practice they enable. The pattern suggests Voss prioritises whether a proposition’s falsification would trigger *epistemic-institutional dissolution* versus *internal paradigm shifts*.

  ### 2. Competing Interpretive Rules  
  **(A) Institutional Collapse Rule (ICR):** *A proposition is a hinge iff its denial would render the institutional practice unrecognisable or operationally impossible.* This fits verdicts 1–6: denying "physical objects" (1) or "biological material" (5) voids the practices; neurology (3) or mathematics (6) retain identity under revision. Hinges are fixed by their institutional role.  
  **(B) Practice-Internal Immunity Rule (PIIR):** *A proposition is a hinge iff it is treated as methodologically immune to empirical challenge within the practice’s current operational norms.* This equally fits: "natural selection" (2) is not tested in evolutionary studies; "consciousness from brain activity" (3) *is* empirically scrutinised in neurology. PIIR makes hinges contingent on current methodological orthodoxy, allowing dynamic revision if practices evolve.  

  Both rules explain why archival reality (4) is a hinge (denial collapses history; internal methods presume it) and why ZFC (6) is not (mathematics institutionally accommodates alternatives; internal debates occur). ICR anchors hinges in institutional ontology; PIIR in epistemic methodology.

  ### 3. Prediction and Justification  
  **Prediction:** Voss would classify the palaeogenomics proposition ("Contamination is detectable...") **as a hinge**.  

  - **ICR Application:** Denial (e.g., "protocols *cannot* exclude contamination") makes palaeogenomic reconstruction institutionally unrecognisable. Its core aim—extracting authentic ancient DNA—depends wholly on this claim; falsification voids the practice’s rationale, equating results to noise. *Thus, hinge*.  
  - **PIIR Application:** Practitioners treat contamination protocols as *operational certainties*, not hypotheses tested per study. Lab workflows presume, rather than investigate, detectability. *Thus, hinge*.  

  **Preferred Rule:** ICR is superior. PIIR risks overextending hinge status to transient methodological assumptions (e.g., outdated lab techniques). ICR’s focus on institutional collapse aligns with Voss’s emphasis on frameworks dissolving (cases 1,4,5) versus disciplines persisting through revision (3,6). Palaeogenomics’ identity *as ancient DNA recovery* hinges on excluding contamination; this is institutional, not merely methodological. Adopting PIIR would imply Voss conflates *current methodological certainty* with *framework-constitutive necessity*, weakening her distinction between revisable content and immutable scaffolding (as in case 3).

  ### 4. The Decisive Test Case  
  **Domain:** Quantum computing.  
  **Proposition:** "Quantum decoherence can be managed sufficiently to permit scalable error-corrected computation."  

  - **ICR Verdict:** *Not a hinge*. Denial (e.g., "decoherence is fundamentally unmanageable") would not dissolve quantum computing as an institution. The field could pivot to exploring decoherence limits, hybrid systems, or alternative models (e.g., topological qubits) without losing its identity—paralleling neurology (3).  
  - **PIIR Verdict:** *Hinge*. Current experimental practice treats decoherence management as a non-negotiable scaffold; research presumes its feasibility, focusing on implementation rather than testing the premise internally—mirroring evolutionary biology (2).  

  This case forces divergence: ICR permits institutional continuity through radical theory change; PIIR binds hinges to present methodological dogmas.

  ### 5. Brief Conclusion  
  This exercise reveals that classifying hinges requires discerning whether a proposition’s function is *institutionally constitutive* (ICR) or *methodologically privileged* (PIIR). Voss’s verdicts implicitly commit to the former: hinges are invariant not because they are empirically unassailable, but because they define a practice’s ontological boundaries. Her stance prioritises the architecture of scientific practices—where abandoning a hinge collapses the epistemic edifice—over internal dynamics of belief revision. The palaeogenomics case thus extends her view: hinges emerge from a discipline’s *rationale for existence*, not its contingent techniques.
