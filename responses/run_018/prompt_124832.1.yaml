answer: |-
  Here's a clean conceptual breakdown of the "unrealistic assumptions are a feature, not a bug" slogan, designed for classroom use. It separates distinct theses, assesses them, and addresses your specific concerns:

  ---

  ### **The "Feature, Not a Bug" Slogan: Conceptual Menu**

  | **Thesis**                     | **Core Claim**                                                                 | **Defensible?**                                                                | **Truth Status**                                                                 | **Rebuts "Real People Don't Maximize"?**                                                                 | **Economic vs. Climate Models**                                                                 |
  | :----------------------------- | :----------------------------------------------------------------------------- | :----------------------------------------------------------------------------- | :------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------- |
  | **1. Trivial Simplification**  | All models simplify reality; this is inherent and necessary for focus.         | **Yes** (trivially true).                                                      | True, but vacuous in debate.                                                     | ❌ **No.** Doesn't justify *specific* unrealistic assumptions; just states modeling requires abstraction. | Universally applicable.                                                                        |
  | **2. Friedman's F-Twist**      | Predictive success is the *only* test. Unrealisticness may correlate with powerful predictions. | **Contentious.** Defensible if prediction is sole goal; challenged otherwise. | **False** as a universal rule (many predictive models *are* realistic).          | ⚠️ **Conditionally.** Only if the model predicts *better* than alternatives. Fails if prediction is poor. | Stronger in economics (predicting markets). Weaker in climate (physics-based realism often aids prediction). |
  | **3. Hard Instrumentalism**    | Descriptive accuracy of assumptions is **irrelevant**. Only outputs matter.    | **Weak.** Assumes outputs exist in vacuum; ignores theory development/explanation. | **Mostly False.** Assumptions often *do* matter for trust, scope, error diagnosis. | ⚠️ **Appeals to adherents.** Fails if critic demands explanation *why* people act "as if" rational. | Risky in both: Climate ignores physics at peril; economics ignores psychology at peril.        |
  | **4. Beneficial Falsehood**    | Actively **false** assumptions can generate *deeper explanations* or reveal essential structures. | **Plausible but Limited.** Works for isolating mechanisms, not as blanket excuse. | **Sometimes True** (e.g., frictionless planes), **Often False** (e.g., assuming away key drivers). | ⚠️ **Only if** false assumption reveals a *causal pattern* robust despite the falsity. Rarely applies to *homo economicus*. | Climate: Unrealistic aerosols may clarify CO2 role. Economics: Rationality may reveal market logic, obscures crises. |
  | **5. As-If Fiction**           | False assumptions act as **organizing tools** for understanding, not prediction (e.g., "as if" rational). | **Defensible for specific explanatory goals.**                                 | **Depends on utility.** True if it yields insight; false if misleading or confused with reality. | ⚠️ **Shifts the burden.** Now must show *how* the fiction organizes phenomena better than alternatives. | Economics: Common (rational agent as heuristic). Climate: Less common (models strive for physical fidelity). |

  ---

  ### **Key Clarifications & Implications**

  1.  **The "As-If Fiction" Relocation:** This doesn't "solve" the problem – it *relocates* it. The question becomes: **"Is this *particular* fiction *useful* for organizing/explaining the phenomenon, and *more useful* than a more realistic alternative?"** It avoids the prediction debate but requires justification of explanatory power.
  2.  **Does it "Get Them Off the Hook"?** Only contingently:
      *   ✅ If the goal is pure prediction *and* the model predicts well (**Thesis 2**).
      *   ✅ If the false assumption demonstrably isolates a core causal mechanism (**Thesis 4**).
      *   ✅ If the fiction provides unique conceptual clarity (**Thesis 5**).
      *   ❌ If the model predicts poorly, ignores key phenomena, or if a more realistic alternative exists.
      *   **Objections about real people not maximizing** are only dismissed if the model's *success* (prediction, explanation, organization) is independent of that realism – which needs demonstration, not just assertion.
  3.  **Economics vs. Climate Models:**
      *   **Economics:** More tolerant of **Theses 2, 3, 5** (prediction focus, "as-if" rationality), though contested. **Thesis 4** is harder to justify for *homo economicus*.
      *   **Climate Models:** Prioritize **Thesis 1** (necessary simplification within physics). **Thesis 2** applies if prediction works, but assumptions are usually grounded in physics, making **Theses 3 & 5** less common. **Thesis 4** applies to deliberate idealizations (e.g., ignoring complex feedbacks to study primary drivers).
  4.  **Overall Defensibility:**
      *   **Strongest:** **Thesis 1** (necessary simplification) and **Thesis 5** (useful fiction) when carefully argued.
      *   **Weakest:** **Thesis 3** (Hard Instrumentalism - irrelevance of assumptions) as a universal claim.
      *   **Most Contentious:** **Thesis 2** (F-Twist - prediction is *only* test) and **Thesis 4** (falsehoods are *beneficial*) – depend heavily on context and evidence.

  **In short:** The slogan masks distinct claims. Its power to dismiss objections depends entirely on *which claim is intended* and whether *that specific claim is justified* for the model in question. Blanket invocation is rarely sufficient.

  ---

  Hand this out for discussion – it frames the debate without needing citations. Good luck in your seminar!
