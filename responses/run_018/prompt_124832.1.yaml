  hey — quick one for the dataset. in my philosophy-of-science seminar this week someone shut down an objection to a rational-agent model by dropping the line "unrealistic assumptions are a feature, not a bug." ive heard it a million times, usually to dismiss worries about homo economicus or sometimes climate models, but i realized i never actually pinned down what precise claim it's making. could you separate out the distinct theses hiding in that slogan? i want a menu, not one interpretation. include the trivial simplification reading, the Friedman-style F-twist (that unrealisticness correlates with significance or predictive success), the hard instrumentalist reading (descriptive accuracy is just irrelevant), and that stronger claim that being descriptively wrong is actively beneficial for explanation. for each, say whether it's defensible, whether it's flat-out false, and whether it actually gets the speaker off the hook when they're dismissing an objection about real people not maximizing. also — there's this "as-if fiction" idea, where false premises work as organizing fictions rather than predictive tools; does that reading just relocate the problem instead of solving it? and flag if the answer depends on whether we're talking economic models vs climate ones. i want something i can hand out in class, so lay it out clean. dont need citations, just the conceptual breakdown. (sorry for teh typo, typing on my phone.)
