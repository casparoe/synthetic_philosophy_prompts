prompt: |-
  I sit on a quarterly review board for a regional water-management agency and we keep getting proposals to swap our old hydrology model for a "new" one that mostly just reprocesses rainfall records from the 1980s — data that was already published when the original 1990s model was built. I want a reusable decision proceedure grounded in Bayesian epistemology's problem of old evidence, not just "update on new data". Give me a checklist my board can run in about twenty minutes: steps in order, what counts as passing each, where it forces a "no — this doesn't actually confirm anything", where it hands the call to a human because it's values not math, and what it flat-out can't settle (especially when we don't have real prior numbers). Apply it to three proposals: (1) the new model feeds in 1985 drought data that was actually cited in the 1998 study it's trying to replace; (2) same 1985 data was technically in a government report but nobody in the field used or knew about it until now; (3) the raw data is identical but the model applies a strange transformation that makes the fit look better, and your gut says that should matter but you can't articulate why. For each, say what the proceedure outputs, including the case where you'll hate the answer. Lead with your bottom line in the very first sentence, then reasoning, no preamble, and don't restate my question. Please don't ask for a bibliography — some of us don't have database access — and don't quote anyone verbatim unless you can fetch the actual passage.
reasoning: |-
  We are going to use a Bayesian framework to evaluate whether the new model provides genuine confirmation (increases the probability of the model being true) or if it's just rehashing old evidence. The key is that old evidence, if already known, cannot confirm a hypothesis (model) under strict Bayesian conditionalization. However, there are nuances when the evidence was not fully utilized or when the model's structure changes.

  Bottom line: The procedure is a checklist of 5 steps that flags when old evidence is being reused without new confirmation, when human judgment is needed for values or model structure, and when the data is insufficient to decide.

  Checklist Steps:

  1. **Evidence Novelty Check**: 
     - **Step**: Determine if the evidence (data) used by the new model was available and known to the scientific community at the time the original model was built. 
     - **Passing**: If the evidence is genuinely new (not available or known), then it can potentially confirm the new model. Proceed to step 2. If the evidence is old (known and available), proceed to step 3.
     - **Flag for "No"**: If the evidence is old and was already used in the original model's construction or evaluation, then the new model's fit to this data provides no new confirmation. Output: "No — this doesn't actually confirm anything (old evidence)".
     - **Human call**: If the evidence was technically available but not known or used by the community, then it might be considered "new to the model" — but this requires human judgment about the context of knowledge at the time.

  2. **Model Novelty Check**:
     - **Step**: If the evidence is new, then the update is straightforward: the new model should be tested on this new data. But if the evidence is old, then we must check if the model itself is structurally different in a way that could lead to a novel prediction or explanation.
     - **Passing**: The new model must have been developed independently of the old evidence (i.e., without using this particular evidence in its construction or tuning). Also, the model must make a novel prediction or provide a novel explanation that was not possible with the old model.
     - **Flag for "No"**: If the new model was tuned or built using the old evidence, then fitting it to that same evidence is not confirmatory. Output: "No — model was tuned on this evidence, so fit is expected".
     - **Human call**: If the model is novel and independently constructed, then even old evidence might confirm it if it was not used in the model building. But this requires human judgment about the model's construction process.

  3. **Explanatory Power Check**:
     - **Step**: Assess if the new model provides a better explanation of the evidence (both old and new) than the old model. This includes factors like simplicity, coherence with other theories, and ability to explain anomalies.
     - **Passing**: The new model must offer a clear explanatory advantage (e.g., it explains why the data looks the way it does, not just fits it).
     - **Flag for "No"**: If the new model only fits the data by adding epicycles (complex adjustments without theoretical justification) then it may not be better. Output: "No — no explanatory gain, just curve-fitting".
     - **Human call**: Deciding on explanatory power involves values (e.g., what counts as a good explanation) and requires domain expertise.

  4. **Predictive Performance Check**:
     - **Step**: Test the model on genuinely new data (if available) or on a hold-out set that was not used in model building. Compare predictive performance (e.g., using cross-validation, or on future events).
     - **Passing**: The new model must show better predictive accuracy than the old model on unseen data.
     - **Flag for "No"**: If the new model does not outperform on new data, then even if it fits old data well, it fails. Output: "No — fails on new data".
     - **Human call**: If no new data is available, then we cannot do this test. We must rely on steps 1-3 and human judgment about model structure.

  5. **Uncertainty Quantification Check**:
     - **Step**: Check if the new model provides better uncertainty estimates (e.g., confidence intervals, prediction intervals) that are calibrated and sharp.
     - **Passing**: The new model's uncertainty intervals should be appropriately narrow and capture the true values at the claimed rate (e.g., 95% intervals contain the true value 95% of the time).
     - **Flag for "No"**: If the new model's uncertainty estimates are worse (too wide or too narrow) than the old model, then it fails. Output: "No — poor uncertainty quantification".
     - **Human call**: Without enough data to test calibration, this step might be skipped or require expert judgment.

  **What the checklist cannot settle**:
  - When there are no prior probabilities or likelihoods available (common in complex models) and no new data for testing, the decision must rely on steps 1-3 and human judgment about model structure and explanatory power.
  - Value-laden decisions: e.g., trade-offs between model complexity and interpretability, or the cost of being wrong.

  Application to Proposals:

  **Proposal 1**: New model uses 1985 drought data that was cited in the 1998 study it replaces.
  - Step 1: Evidence is old (known and used in the original model). **Flag for "No"** — the old evidence cannot confirm the new model because it was already used. 
  - **Output**: "No — this doesn't actually confirm anything (old evidence)".

  **Proposal 2**: Same 1985 data was technically in a government report but nobody in the field used or knew about it until now.
  - Step 1: Evidence was available but not known. **Human call** required: Did the original model builders have access to this report? If yes, then it's old evidence. But if the community was unaware, it might be treated as new. However, the Bayesian problem of old evidence is tricky: if the evidence was logically available, then it shouldn't confirm. But in practice, if the model was built without using it, it might. We move to step 2.
  - Step 2: Check model novelty. If the new model was built without using this data, then fitting it to this "newly discovered" data might count as confirmation. But we must also check if the model was tuned for this data. If not, then we move to step 3.
  - Step 3: Does the new model explain this data better? If the old model also fits this data (we can test) then there might be no gain. If the old model fails and the new one passes, that's a point for the new model. But without a theoretical reason, it might be curve-fitting. **Human call** for explanatory power.
  - Since we don't have new data (step 4) and uncertainty (step 5) might not be tested, the decision hinges on human judgment. 
  - **Output**: The procedure flags that it cannot settle by itself. We must have a human discussion: If the new model was built independently and the old model fails on this data, then it might be a point in favor. Otherwise, it's inconclusive.

  **Proposal 3**: Raw data identical, but the model applies a strange transformation that makes the fit look better.
  - Step 1: Evidence is old. So we go to step 2.
  - Step 2: The model structure is changed. But we must check if the transformation was introduced to fit this specific data (which would be curve-fitting) or if it has a theoretical basis. **Human call** required for the justification of the transformation.
  - Step 3: Explanatory power: If the transformation is ad hoc (no theoretical basis), then it fails. Output: "No — no explanatory gain, just curve-fitting". If there is a good reason, then proceed.
  - Step 4 and 5: Without new data or uncertainty checks, we rely on steps 2 and 3.
  - **Output**: If the transformation is ad hoc, then "No". If it's theoretically motivated, then it might pass step 3, but without new data (step 4) we cannot be sure. The procedure outputs: for ad hoc transformations, "No"; for motivated ones, "Inconclusive, needs human judgment and testing on new data".

  In cases where the answer is "No" due to old evidence or curve-fitting, you might hate the answer because the new model might look better on paper but isn't actually providing new evidence. The procedure forces you to reject these without new data or independent testing.
answer: |-
  **Bottom line: Use this 5-step Bayesian checklist to reject proposals that misuse old evidence or lack explanatory gains, deferring to human judgment for values, model novelty, and untestable claims.**

  ### Checklist (20-minute execution)
  1. **Evidence Novelty**  
     - *Step:* Was the data used by the new model **unavailable or unknown** when the original model was built?  
     - *Passing:* Data is newly discovered or previously inaccessible (e.g., buried in obscure archives).  
     - *Automatic "No":* Data was published, known, and used in the original model's development.  
     - *Human call:* Data existed but was unknown to the field (requires judging historical context).  

  2. **Model Independence**  
     - *Step:* Was the new model developed **without using the target evidence**?  
     - *Passing:* Model structure/parameters weren't tuned to this specific data.  
     - *Automatic "No":* Model was reverse-engineered to fit the evidence (e.g., arbitrary adjustments).  
     - *Human call:* Ambiguous development process (e.g., "inspiration" from old data).  

  3. **Explanatory Gain**  
     - *Step:* Does the new model **explain more than the old model**?  
     - *Passing:* Resolves anomalies, simplifies assumptions, or incorporates new theory.  
     - *Automatic "No":* Only improves fit via unprincipled transformations (e.g., data tweaking).  
     - *Human call:* Subjective trade-offs (e.g., complexity vs. accuracy).  

  4. **Predictive Testing**  
     - *Step:* Can the model be tested on **held-out or new data**?  
     - *Passing:* Outperforms old model on unseen data (e.g., post-1990s events).  
     - *Automatic "No":* Fails when tested on new data.  
     - *Human call:* No new data exists (values decision: risk of adopting untested models).  

  5. **Uncertainty Handling**  
     - *Step:* Does it **quantify uncertainty better**?  
     - *Passing:* Provides narrower, calibrated confidence intervals.  
     - *Automatic "No":* Hides uncertainty or overfits.  
     - *Cannot settle:* Without priors or validation data (human judgment required).  

  ### Application to Proposals  
  **Proposal 1 (1985 data cited in 1998 study)**  
  - Step 1: **Automatic "No"** – Data known and used originally.  
  - *Output: REJECT. Zero confirmation (pure old evidence reuse).*  

  **Proposal 2 (1985 data unknown until now)**  
  - Step 1: **Human call** – Technically old but unused; requires judging if field truly ignored it.  
  - Step 2: If model independent, proceed to Step 3.  
  - Step 3: **Human call** – Does reprocessing add insight? If not, reject.  
  - *Output: DEFER. If model explains anomalies, accept; else, reject (values-based).*  

  **Proposal 3 (Strange transformation, better fit)**  
  - Step 1: **Automatic "No"** – Old evidence.  
  - Step 2: Likely **Automatic "No"** – Transformation targets fit, not theory.  
  - Step 3: **Automatic "No"** – No explanatory gain (violates explanatory gain check).  
  - *Output: REJECT. You'll hate this if the fit seems compelling, but Bayesianism penalizes ad hoc adjustments.*  

  ### Key Limitations  
  - **Values decisions:** Steps 1, 3, and 4 require human judgment for historical context, explanatory value, and risk tolerance.  
  - **Untestable cases:** Step 5 fails without priors/new data (e.g., no post-1990s droughts). Adopting the model becomes a values call.  
  - **Gut feelings:** If a transformation "feels wrong" (Proposal 3), the checklist formalizes this as violating explanatory gain and model independence.
