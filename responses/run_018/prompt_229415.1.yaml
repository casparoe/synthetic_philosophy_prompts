  We are drafting a joint statement for an adversarial collaboration between two camps:

  Camp 1 (Expected Utility): Believes that the only defensible norm is to maximize expected utility. Kelly betting is just a special case when utility is logarithmic. An agent with a different utility function should deviate from Kelly.

  Camp 2 (Geometric Rationality): Believes that in repeated multiplicative gambles, maximizing expected log wealth (i.e., the Kelly criterion) is the rationality condition because it is growth-optimal and avoids ruin, whereas maximizing expected wealth leads to ruin when the bet can lose everything.

  We need:

  (i) A numbered list of agreed claims.

  (ii) A disagreements table with each camp's accepted wording.

  (iii) Cruxes: sub-questions that would move at least one camp, with the argument/empirical case that would bear on it and each camp's prediction.

  (iv) Closing note on verbal disputes.

  Let's break it down.

  (i) Agreed Claims:

  1. In a repeated multiplicative setting (i.e., compounded returns), the Kelly fraction maximizes the long-run growth rate of wealth, defined as the limit of the expected log wealth as the number of trials goes to infinity.

  2. The Kelly strategy is the unique fixed-fraction strategy that achieves this growth rate maximization.

  3. If an agent bets a fixed fraction greater than the Kelly fraction (the "overbetting" case), then the long-run growth rate is suboptimal and the probability of ruin (if the bet can lose everything) approaches 1 as the number of trials increases.

  4. If an agent bets a fixed fraction less than the Kelly fraction (the "underbetting" case), the long-run growth rate is also suboptimal, but the probability of ruin is reduced (and may be zero if the fraction is low enough to avoid ruin).

  5. The strategy of maximizing expected wealth (i.e., betting the entire stake every time) leads to almost sure ruin in the long run if there is any chance of losing the entire bet (i.e., if the probability of losing is positive and the loss results in zero wealth).

  6. The Kelly fraction can be derived by maximizing the expectation of the logarithm of wealth after one bet, and this fraction remains optimal for any number of bets when the bets are independent and identical.

  7. Expected utility theory is a standard framework for decision-making under uncertainty, and it prescribes maximizing the expected value of a utility function over outcomes.

  8. If an agent's utility function is logarithmic in wealth, then maximizing expected utility leads to the Kelly fraction.

  9. For an agent with a logarithmic utility function, the Kelly strategy is the expected utility maximizing strategy in the repeated setting.

  10. The Kelly fraction does not depend on the initial wealth level when the utility function is logarithmic.

  11. For an agent with a different utility function (e.g., linear, exponential, power), the expected utility maximizing fraction in a repeated setting may differ from the Kelly fraction.

  12. In a single bet (non-repeated) scenario, the Kelly fraction is not necessarily optimal for an agent with a non-logarithmic utility function.

  (ii) Disagreements Table:

  We state each residual difference in wording that the relevant camp would accept.

  | Issue | Camp 1 (Expected Utility) | Camp 2 (Geometric Rationality) |
  |-------|----------------------------|--------------------------------|
  | **The fundamental norm for rational choice in repeated multiplicative gambles** | The rational agent should maximize expected utility, which may or may not lead to the Kelly fraction depending on the agent's utility function. | The rational agent should maximize the long-run growth rate of wealth (i.e., use the Kelly fraction) because it is the only strategy that avoids eventual ruin and dominates in the long run, regardless of the agent's utility function. |
  | **The status of the Kelly criterion** | The Kelly criterion is a consequence of expected utility maximization for a logarithmic utility function, but it is not a universal principle. | The Kelly criterion is the unique rational strategy for repeated multiplicative gambles because it is the only one that is growth-optimal and avoids ruin, making it a universal principle for such scenarios. |
  | **The role of utility functions** | Utility functions are essential for capturing the agent's preferences over wealth, and there is no rational requirement for the utility function to be logarithmic. | In repeated multiplicative settings, the growth-optimal strategy (Kelly) is the rational default, and using a non-log utility function in this context is irrational because it leads to dominated strategies (like overbetting) that cause ruin. |
  | **The interpretation of "rationality" in the long run** | Rationality is about maximizing expected utility at each decision point, and long-run properties (like growth rate) are emergent but not fundamental. | Rationality must account for the long-run consequences of repeated decisions, and the only strategy that is not dominated in the long run is the growth-optimal (Kelly) strategy. |

  (iii) Cruxes:

  We identify sub-questions that, if settled, would move at least one camp. For each, we state the argument or empirical case that would bear on it, and each camp's prediction.

  1. **Crux 1: Does rationality require avoiding strategies that are dominated in the long run?**

     - **Bearing argument/empirical case:** In the repeated multiplicative gamble, the Kelly strategy is the only fixed-fraction strategy that is not dominated in the long run (i.e., it has a higher growth rate than any other strategy and, in the limit, will almost surely result in higher wealth). Any other fixed-fraction strategy will, with probability 1, result in lower wealth in the long run. Both camps agree on this mathematical fact.

     - **Camp 1 prediction:** Avoiding long-run domination is a desirable property, but it is not the only consideration. Rationality is defined by the axioms of expected utility, which may allow for strategies that are dominated in the long run if they maximize expected utility at the time of each decision. For example, an agent with linear utility would maximize expected wealth at each step, even though it leads to ruin.

     - **Camp 2 prediction:** Rationality requires avoiding strategies that are dominated in the long run because a rational agent must consider the entire sequence and not just each step in isolation. Therefore, the Kelly strategy is the only rational choice.

     - **How it moves:** If it can be established that rationality necessarily requires avoiding long-run dominated strategies, then Camp 1 might have to concede that Kelly is the only rational strategy in this setting. Conversely, if it is shown that rationality can be defined step-by-step without regard to long-run domination, then Camp 2 might have to concede that Kelly is only one of many rational strategies (depending on utility).

  2. **Crux 2: Is there a unique rational utility function for repeated multiplicative gambles?**

     - **Bearing argument/empirical case:** Analyze whether the repeated multiplicative setting imposes a constraint on the utility function such that only logarithmic utility is rational. This could involve considering the consequences of non-logarithmic utility in the long run (e.g., the agent faces ruin or suboptimal growth) and whether these consequences are acceptable under rationality.

     - **Camp 1 prediction:** There is no unique rational utility function. Different agents can have different risk preferences (e.g., more risk-averse or risk-seeking) and thus different utility functions, and each should maximize their own expected utility.

     - **Camp 2 prediction:** The repeated multiplicative gamble context forces a unique rational utility function: logarithmic. This is because any other utility function leads to a strategy that is dominated in the long run (as per the first crux) and thus irrational.

     - **How it moves:** If it can be shown that the repeated multiplicative setting requires a specific form of utility (log) to avoid irrational outcomes (like ruin or being dominated), then Camp 1 might have to accept that log utility is the only rational one in this setting. Otherwise, Camp 2 might have to accept that other utility functions are rational.

  3. **Crux 3: How should rationality handle the trade-off between short-term and long-term goals?**

     - **Bearing argument/empirical case:** Consider an agent who has a short time horizon or who values immediate gains more than long-term growth. What is the rational strategy? Also, what if the agent has a finite but large number of bets? Does the Kelly strategy still dominate?

     - **Camp 1 prediction:** Expected utility maximization can account for any time horizon by appropriately discounting future utility. For a finite horizon, the optimal strategy might be non-Kelly and depend on the utility function and the horizon.

     - **Camp 2 prediction:** Even in a finite horizon, the Kelly strategy is approximately optimal for large horizons and avoids ruin. Moreover, if the agent is going to face many such bets, then the growth-optimal strategy is the only one that is not dominated in the long run. Short-term deviations are irrational if they sacrifice long-term growth.

     - **How it moves:** If it can be shown that for any finite horizon (especially a long one) the Kelly strategy is the only one that avoids ruin and achieves near-optimal growth, then Camp 1 might have to adjust. Conversely, if for a finite horizon a non-Kelly strategy can be shown to yield higher expected utility (for a non-log utility) without ruin, then Camp 2 might have to accept that Kelly is not always uniquely rational.

  (iv) Closing Note on Verbal Disputes:

  The camps agree on the mathematical facts about compounding and the properties of the Kelly criterion. However, they disagree on the interpretation of rationality. Some parts of the dispute are verbal in that they turn on the meaning of "rationality" and the scope of decision theory. For Camp 1, rationality is defined by the axioms of expected utility theory and is agent-relative (depending on the agent's utility function). For Camp 2, rationality is defined by the long-run survival and growth in repeated settings, which they see as a fundamental requirement. Thus, the dispute is partly about the definition of rationality and partly about the normative force of long-run properties.

