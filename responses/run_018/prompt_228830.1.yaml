prompt: |-
  I worked as a materials chemist for fourty years and only started reading philosophy in retirement, so bear with me. I picked up a popular intro book and it summarizes G.E. Moore's famous anti-skeptic argument roughly like this: "Moore settled the matter of the external world by simply holding up his hand during a lecture and declaring it to be a hand. Since he obviously knows he has a hand, and hands are things outside his mind, the external world exists and the skeptic is refuted. Philosophers who complain that this begs the question miss Moore's real point, which is that what we know in everyday life is more certain than any premise a philosopher could argue from, so the skeptic's doubts simply lose." The book then goes on to say this shows skepticism was never a serious position to begin with.

  How fair is this as a summary? Go through it and tell me which parts Moore would actually endorse, which parts blur together things he kept apart (I have a vague sense that proving the external world exists and refuting the skeptic might not be the same job for him?), and whether the "begs the question" objection is as easily dismissed as the book suggests. And does the book's final conclusion -- that skepticism was never serious -- follow from anything Moore actually argued, or is the author overreaching? Explain like I'm a smart outsider, because I am one.
