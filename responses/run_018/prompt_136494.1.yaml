prompt: |-
  In the philosophy seminar I take at my high school, we have spent several weeks on epistemic injustice—specifically testimonial injustice, in which a speaker receives less credibility than she merits because of identity-based prejudice, and hermeneutical injustice, in which a social group lacks the conceptual resources to understand its own experience. A debate that has stalled both in the texts we read and in our own classroom discussions concerns whether these phenomena are best understood as failures of epistemic calibration—our belief-forming practices assigning incorrect weight to testimony—or as failures of social recognition, in which the wrong is not that we misjudge a speaker’s reliability but that we deny her the standing to be heard as an epistemic peer at all.

  The calibration side maintains that if we corrected our reliability-tracking heuristics and eliminated bias in how we weigh evidence, credibility deficits would diminish as an epistemic malfunction; the recognition side replies that this framing misses the core harm, because a speaker can be factually correct and still be ignored precisely because her social position disqualifies her from being treated as a knower whose testimony counts. For months our discussions have cycled through the same examples—medical testimony dismissed on gendered grounds, workplace reports ignored along racial lines—and each side interprets them differently without anyone shifting position. The arguments feel rehearsed, yet neither camp treats the disagreement as merely verbal.

  My working hypothesis is that the stall is not about the examples but about two different questions being pursued under the single heading “what is epistemic injustice?” One question is distributive and virtue-epistemological: how should credibility be allocated so that knowledge is maximized? The other is ontological-political: who gets to count as a subject whose knowledge matters, regardless of predictive accuracy? But I am unsure whether this diagnosis is correct, or whether there is instead a hidden empirical disagreement about whether recognition-independent calibration is psychologically achievable, or whether the impasse is genuinely verbal—centered on an ambiguity in “credibility” between predictive accuracy and recognitive standing, or on whether “injustice” here names an epistemic harm or a moral-political wrong.

  Could you diagnose what kind of disagreement this actually is? Please engage concretely with what each side says about calibration, recognition, and the shared examples, rather than surveying authors or texts. Is there a substantive disagreement about norms or facts, a verbal ambiguity about key terms, or are two distinct projects—one in virtue epistemology, one in social philosophy—being forced into one debate? Given your diagnosis, what would genuinely count as progress: a conceptual distinction, an empirical result about how listeners form credibility judgments, a formal model of credibility allocation, or should we conclude the question is ill-posed and ought to be split? I am especially interested in whether introducing a distinction between predictive credibility—assigning belief-weight based on expected accuracy—and recognitive credibility—assigning standing based on norms of social equality—would resolve the stall, or whether it would merely restate the division in new vocabulary.
reasoning: |-
  Okay, let me approach this student's sophisticated philosophical question methodically. The core issue is diagnosing why the epistemic injustice debate stalls between calibration and recognition frameworks. 

  First, I need to fully grasp the student's analysis. They've identified two distinct perspectives: one focused on correcting cognitive biases in credibility assessment (calibration), the other on social recognition of epistemic agency. The student suspects these address different questions under the same label. That's perceptive - I should test this hypothesis.

  Looking at the examples given: when gendered medical testimony is dismissed, calibration sees incorrect reliability-weighting, while recognition sees denial of epistemic standing. Neither interpretation is necessarily wrong, but they target different phenomena. The student's proposed distinction between predictive and recognitive credibility seems promising here.

  I wonder if the deeper issue is about disciplinary priorities. Virtue epistemology cares about knowledge-maximization through proper credibility distribution, while critical social philosophy cares about whose knowledge counts as knowledge. These aren't mutually exclusive but have different emphases.

  The student asks whether introducing new terminology would help. I think distinguishing "predictive credibility" (accuracy-focused) from "recognitive credibility" (standing-focused) could clarify conversations. But we must acknowledge their interconnection - predictive judgments often presuppose recognitive standing.

  For progress, we might need both conceptual distinctions and empirical work. Psychologists could study how social recognition affects credibility assessments, while philosophers refine normative frameworks. The key is recognizing these as complementary rather than competing explanations.

  The student's frustration with cyclical debates suggests we should frame this as a "both/and" situation. Perhaps epistemic injustice requires diagnosing miscalibration AND challenging recognition deficits. A multidimensional model might be more fruitful than choosing one framework.
answer: |-
  Your perceptive diagnosis hits the mark—this impasse arises from **two distinct philosophical projects being conflated under a single label**, compounded by **unresolved ambiguities in key terms**. Let's dissect the core disagreement through the lens of calibration, recognition, and your examples:

  ### 1. **The Calibration-Recognition Divide: Two Projects, Not One**
     - **Calibration Project** (Virtue Epistemology):  
       Focuses on *epistemic efficiency*: "How do we optimize credibility assignments to maximize true beliefs?" Dismissing a doctor's accurate diagnosis due to gender bias is seen as a *cognitive malfunction*—like misjudging a scale's accuracy. Progress means refining heuristics (e.g., debiasing training, algorithmic weighting of testimony).  
       *Example Interpretation*: Racial dismissal of workplace reports is an *evidential weighting error*—fixable by better data (e.g., studies showing marginalized groups report accurately).
     
     - **Recognition Project** (Social Ontology):  
       Focuses on *epistemic agency*: "Who counts as a legitimate knower?" Ignoring the same doctor isn't about truth-tracking failure but *denying her epistemic personhood*. The harm is moral-political: excluding her from the community of knowers.  
       *Example Interpretation*: Racial dismissal isn’t flawed calibration but *epistemic erasure*—no amount of "reliability data" fixes this; it requires restructuring social hierarchies.

  ### 2. **The Hidden Disagreements Fueling the Stall**
     - **Conceptual Ambiguity**:  
       "Credibility" is used for two concepts:  
       → **Predictive Credibility**: Likelihood a speaker’s testimony is true (calibration’s focus).  
       → **Recognitive Credibility**: Entitlement to participate in knowledge-exchange (recognition’s focus).  
       *Example*: A Black employee’s report might be granted high *predictive* credibility (listeners believe it’s true) yet low *recognitive* credibility (ignored as "complaining," not authoritative testimony).

     - **Normative Priorities**:  
       Calibration treats *knowledge maximization* as the primary good; recognition treats *epistemic dignity* as non-negotiable, even if it risks inefficiency. This isn’t empirical—it’s a clash over which value grounds "injustice."

     - **Empirical Tension (Unacknowledged)**:  
       Calibration assumes social biases can be isolated from reliability-tracking (e.g., "We can adjust for race without changing core heuristics"). Recognition argues this is impossible: *all* credibility judgments presuppose social recognition. If true, "pure calibration" is a fantasy.

  ### 3. **Would Your Distinction Resolve the Impasse?**
  Introducing **predictive vs. recognitive credibility** is necessary but insufficient. It clarifies the *structure* of disagreement but doesn’t reconcile the projects. Consider:

     - **Calibration Response**: "Recognitive credibility is just a social factor to *include* in predictive models. We can assign weight to social standing like any variable."  
     - **Recognition Response**: "Reducing recognition to a 'variable' perpetuates the harm! It’s about *constitutive exclusion*, not adjustable weighting."

  The divide persists because calibration seeks to *absorb* recognition into a technical framework, while recognition rejects this as depoliticizing.

  ---

  ### Paths to Progress: Splitting and Bridging
  1. **Split the Question Explicitly**:  
     - **Project A (Epistemic Optimization)**: "How can credibility assignments minimize false beliefs?"  
       *Tools*: Formal models of testimony weight, empirical studies on bias correction.  
     - **Project B (Epistemic Justice)**: "What social conditions enable equal participation in knowledge practices?"  
       *Tools*: Normative analysis of recognition, power structures, hermeneutical resources.  

  2. **Bridging Inquiry**:  
     - **Empirical Test**: Design studies probing whether "predictive credibility" judgments *can* function independently of social recognition. Example:  
       → *Experiment*: Have subjects evaluate identical testimony attributed to speakers of differing social status. If credibility assignments shift despite identical content, recognition infects prediction.  
     - **Integrative Framework**: Develop a model where *recognitive standing* is a precondition for predictive credibility to function justly. Example: Miranda Fricker’s "epistemic justice" requires both neutralizing bias (calibration) and *affirmative hermeneutical inclusion* (recognition).  

  3. **Reframe the Debate**: Ask:  
     - "Can testimonial justice be achieved *without* addressing recognitive exclusion?"  
     - "Does calibration alone repair the harm when someone is denied epistemic agency?"  

  This forces both sides to confront their limitations: calibration must engage with social ontology; recognition must clarify if it rejects truth-tracking as a goal.

  ---

  ### Conclusion: Beyond the Impasse
  The stall stems from **conflating descriptive epistemology (calibration) with normative social theory (recognition)**. Your predictive/recognitive distinction is vital for clarity, but resolution requires accepting they address different problems. Progress lies in:  
  - **Splitting** the projects terminologically and methodologically,  
  - **Empirically testing** their interdependence (e.g., can recognition be "calibrated"?),  
  - **Developing hybrid frameworks** where calibration operates *within* a recognition-based scaffold.  

  As you suspected, the question "What is epistemic injustice?" is ill-posed—it’s two questions. Treating them as distinct yet interrelated (e.g., "How do recognitive failures *cause* calibration failures?") unlocks richer analysis. The classroom examples aren’t evidence for one side; they reveal *both* dynamics at work.
