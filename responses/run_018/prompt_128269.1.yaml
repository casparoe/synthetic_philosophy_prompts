  First, I need to clarify the core distinctions: First-order indifference means no preference at all between options (not even equal utility), like two identical job candidates. Second-order preference is a "preference about preferences," like valuing decisiveness itself. Arbitrary tie-breaking just picks randomly without higher-order reasoning. 

  For the thought experiment, I consider a realistic institutional setting. A hospital ethics committee reviewing identical research proposals feels right—it avoids sci-fi elements and fits genuine symmetry. The tie-breaker must come from prior procedure, not randomness or authority. I land on a rule where the chair breaks ties by alphabetical order of applicant surnames, established earlier for bureaucratic efficiency. 

  Why does this work? Expected utility maximization fails because utilities are symmetric; randomization feels inappropriate for ethical decisions; deferring would stall the process. The alphabetical rule, adopted long ago for unrelated reasons, introduces structural asymmetry through second-order commitment to procedural efficiency. 

  A pure first-order objector would call this arbitrary—but removing the rule doesn't just revert to randomness; it forces the committee to confront true indifference, proving the rule wasn't neutral but constitutive. The key is showing how the mundane procedural feature carries normative weight. 

