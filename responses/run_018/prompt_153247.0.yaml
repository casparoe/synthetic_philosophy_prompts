answer: |-
  Here's a joke playing on that specific Quinean collision:

  **Setting:** A cramped field station deep in the jungle. Dr. Evelyn Finch, an anthropologist obsessed with logical regimentation, pores over notebooks filled with observations of the Tiva tribe. Quine, inexplicably visiting on a whim, sips lukewarm tea.

  **Characters:**
  *   **Dr. Finch:** Frustrated anthropologist.
  *   **Quine:** Calmly observing.
  *   **Kael (Tiva Elder):** Patient but bemused.

  **(Finch gestures wildly at her notes, covered in logical symbols.)**
  **Finch:** It’s maddening, Professor Quine! I’ve mapped every utterance, every flinch, every instance of communal disapproval tagged with ‘*glorg*’ – their core normative term. I isolated the stimulus conditions perfectly! But when I try to regiment ‘*glorg*’ into our ontology… collapse!

  **Quine:** (Raises an eyebrow) Collapse?

  **Finch:** Yes! The behavioral data is *radically* underdetermined. ‘*Glorg*’ could be translating as ‘morally wrong’, obviously. But the exact same data fits ‘socially destabilizing’! Or ‘ritually impure’! Or ‘inefficient for current resource allocation’! Or even ‘not posited by our best jungle-survival theory’! I built distinct predicate sets for each, but the observation sentences support all translations equally! My beautiful logical system keeps reducing *every* ‘*glorg*’ assertion to a complex statement about… about *coordination problems*! ‘Doing X increases the probability of someone else doing Y, which decreases caloric intake Z’! Where’s the *wrongness*?

  **(Kael the Elder enters, holding Finch's prized notebook which he ‘borrowed’.)**
  **Kael:** Finch-person. This marking-stick scratching… *glorg*. Very *glorg*. Makes head hurt, disrupts story-sharing time. Bad coordination. Put back now. (He places the notebook awkwardly on a pile of fruit).

  **Finch:** (Stares at Kael, then at her notebook on the fruit, then back at Quine, realization dawning). You see?! ‘*Glorg*’! But was it *wrong*? *Taboo*? *Inefficient*? *Ontologically unsupported*?! The behavior – taking it, causing mild annoyance, returning it – fits *all*!

  **Quine:** (Nods slowly, a faint smile playing on his lips) Precisely. A splendid example of the indeterminacy of translation applied to the normative. The stimulus meanings underdetermine the manual. The tie cannot be broken by mere behavior.

  **Finch:** (Desperate) But Professor! Surely we must quantify over *wrongness*! Morality *demands* it! How else do we ground ethical discourse?

  **Quine:** (Takes a contemplative sip of tea) My dear Doctor, the pragmatic advice is clear: stop quantifying over *wrongness*. Not because ethics is unimportant – far from it, coordinating behavior is vital – but because the behavioral evidence forever underdetermines whether you're quantifying over wrongness... or just *really bad coordination*. Parsimony suggests the latter ontology is sufficient. Observe Kael; he seems perfectly coordinated now.

  **(Kael, having successfully returned the notebook and restored calm, picks up a piece of fruit and offers it to Quine with a serene smile. Quine accepts it, looking utterly content with the efficient coordination of it all. Finch stares at her notebook, now slightly stained with fruit juice, where ‘GLORG = WRONG’ is crossed out and replaced with a complex equation involving probability, caloric intake, and social friction.)**

  **Punchline:** Quine advises against quantifying over moral properties (wrongness) not due to moral nihilism, but specifically because translation indeterminacy renders the *referent* of normative terms permanently ambiguous between moral, social, pragmatic, or ontological interpretations, and ontological parsimony favors the non-moral interpretations supported by the same behavioral data. The elder's action perfectly demonstrates the underdetermination.
