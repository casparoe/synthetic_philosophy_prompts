  Ultimately the user needs to decide: is Schopenhauer describing music's ontology or its effect? If the former, the structure/will paradox remains. If the latter, the listener's conceptual role becomes a feature, not a bug - we feel will through form. That might resolve both their snags if framed as two aspects of one mechanism. 

  Should also note: Schopenhauer's vocal music hierarchy reveals his bias toward abstract expression. A counterargument could be that voice is the most direct will-expression of all! But he'd call that contaminated by individual will, not universal. 

