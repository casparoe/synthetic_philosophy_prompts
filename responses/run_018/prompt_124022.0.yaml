  I'm an evolutionary biologist fluent in selection dynamics, evolutionary stable strategies, niche construction, evolutionary arms races, and group-level selection, but with only undergraduate-level exposure to moral philosophy. Restate the core case for absolute pacifism — including the direct-versus-structural-violence distinction, the collective-complicity objection (that ordinary participation in social institutions renders one responsible for state violence), and the non-identity concern (that defending present generations through violence harms the specific future people who would come to exist only under a peaceful trajectory) — entirely in my evolutionary vocabulary. For each component, specify what translates cleanly (for example, aggression as an arms-race strategy or institutional roles as niche construction), what must be distorted to fit (for example, treating intentional moral agency or deontological duty as selectable traits), and what has no counterpart at all. Then provide the residue report: assess whether the untranslatable remainder — especially the normative prohibition on intentional killing and the moral distinction between acting and allowing harm — indicates that evolutionary biology lacks resources for irreducible normative concepts, or whether it reveals that those pacifist claims depend on rhetorical framing that evolutionary analysis strips away. Be precise about where your translation is honest and where you are forcing a fit.
