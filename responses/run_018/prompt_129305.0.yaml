answer: |-
  ### 1. Exam Question (75-minute essay)  
  **Question:** Galen Strawson's Basic Argument contends that true moral responsibility requires being *causa sui* (self-caused), which is impossible because it generates an infinite regress. Critics argue this regress illicitly conflates a *causal-explanatory* demand (tracing features to prior causes) with a *normative-justificatory* demand (requiring ultimate desert-grounding self-authorship).  

  **Scenario:** An adult human undergoes gradual neural replacement over thirty years: biological neurons are replaced, molecule-by-molecule, with functionally identical synthetic substrates. Psychological continuity is preserved throughout, so the resulting being traces its mental states *only* to earlier synthetic states, not biological origins.  

  **Task:**  
  - Explain Strawson’s Basic Argument and the critic’s charge of conflation.  
  - Can the neural-replacement scenario evade Strawson’s regress by satisfying the normative demand *without* the causal demand? Defend your evaluation by analyzing whether Strawson’s argument unfairly slides between these distinct demands.  

  ---

  ### 2. Model Answer (≈700 words)  

  **Introduction**  
  Galen Strawson’s Basic Argument asserts that moral responsibility requires ultimate self-determination: to be truly responsible for one’s actions, one must be *causa sui*. This demands self-creation—but since self-creation presupposes prior mental states (e.g., reasons or character traits), an infinite regress ensues. True self-determination is thus logically impossible, undermining moral desert. Critics, however, contend Strawson conflates two distinct requirements: (1) a *causal-explanatory* chain tracing how an agent came to possess her will, and (2) a *normative-justificatory* condition requiring the agent to be the ultimate *source* of her will in a desert-grounding sense. This essay evaluates whether Strawson’s regress illegitimately slides between these demands by applying them to the neural-replacement scenario.  

  **Strawson’s Regress and the Conflation Charge**  
  Strawson’s regress is logically airtight if one assumes moral responsibility necessitates *total* self-authorship. If an agent’s choice (C1) results from her reasons (R1), she must be responsible for R1. But R1 must derive from earlier reasons (R2) or character traits, prompting responsibility for R2, ad infinitum. Absent a self-created starting point, desert collapses.  

  The conflation objection challenges Strawson’s premise that causal history *necessarily* determines normative sourcehood. The causal-explanatory demand seeks a complete causal history (e.g., "How did Agent X acquire her values?"). The normative-justificatory demand asks whether Agent X’s actions *express her true self* in a way that warrants blame/praise. Compatibilists argue normative sourcehood can exist without infinite causal regress if the agent identifies with her desires/values, regardless of their origins. Strawson’s slide, critics argue, treats the *impossibility of causa sui* as fatal to both demands when it may only undermine the causal.  

  **The Neural-Replacement Scenario: A Test Case**  
  The scenario presents an agent whose mental states are causally traceable *only* to prior synthetic neural states, not biological origins. Psychological continuity ensures the agent’s identity persists, but her "source" is the engineered synthetic architecture. Strawson would argue this agent still fails to be *causa sui*: her synthetic states were shaped by earlier synthetic states, regressing infinitely to the point of biological-to-synthetic transition. Since she didn’t create her initial synthetic architecture, she cannot satisfy the normative demand for ultimate authorship.  

  However, this scenario exposes tensions in Strawson’s slide:  
  - **Causal-explanatory demand:** The agent’s mental states *are* fully traceable—to synthetic precursors. Strawson’s regress persists, but only causally.  
  - **Normative-justificatory demand:** If psychological continuity ensures the agent’s actions reflect her "deep self" (e.g., coherent values reinforced over 30 years), she *might* satisfy normative conditions for desert *without* biological origins. Strawson’s insistence that synthetic origins preclude desert appears question-begging—it assumes sourcehood requires *uncaused* origins, which the normative demand need not entail.  

  **Evaluation: Does the Slide Undermine Strawson?**  
  The scenario suggests Strawson’s regress conflates distinct problems. The causal demand remains unmet (traceability ≠ *causa sui*), but the normative demand *could* survive if sourcehood is reconceived as *non-regressive identification*. For instance, if the agent endorses her synthetic-architecture-mediated desires, she may be normatively responsible even if causally determined. Strawson’s argument treats the impossibility of self-creation as equally fatal to both demands, but the neural-replacement case illustrates their separability: the agent’s synthetic "source" may be *causally* traceable yet *normatively* sufficient if it constitutes authentic self-expression.  

  Nevertheless, Strawson could retort that "authenticity" itself requires prior self-creation: if the agent didn’t design her synthetic architecture or her psychological continuity, she still isn’t the *ultimate* source. This highlights the core dispute: Strawson assumes desert requires literal *causa sui*, while critics argue it requires non-regressive *attributability*. The neural scenario doesn’t resolve this but clarifies the debate’s stakes—whether moral responsibility demands metaphysical self-creation or agential coherence.  

  **Conclusion**  
  Strawson’s Basic Argument validly shows that *causa sui* is impossible, but its extension to moral responsibility relies on conflating causal and normative demands. The neural-replacement scenario demonstrates that an agent can meet normative conditions (deep self-attributability) despite causal determinism. Whether this suffices for desert remains contested, but Strawson’s regress fails to prove its impossibility without presupposing that normative sourcehood requires causally ungrounded origins.  

  ---

  ### 3. Marking Scheme (Total: 20 marks)  
  **Key Intellectual Moves:**  
  **1. Accurate reconstruction of Strawson’s Basic Argument**  
  *(4 marks)*  
  - **A-range:** Clearly articulates the regress (self-creation → prior states → infinite chain) and *causa sui*’s role in desert.  
  - **B-range:** Summarizes the regress but omits logical structure or links to moral responsibility.  
  - **Common failure:** Misstates the regress (e.g., as about determinism rather than self-creation).  

  **2. Distinction between causal-explanatory and normative-justificatory demands**  
  *(5 marks)*  
  - **A-range:** Precisely defines both demands (causal = traceability; normative = desert-grounding sourcehood) and explains how critics accuse Strawson of conflation.  
  - **B-range:** Identifies the distinction vaguely without specifying how Strawson "slides" between them.  
  - **Common failure:** Equates the distinction with compatibilism/incompatibilism broadly.  

  **3. Application to neural-replacement scenario**  
  *(4 marks)*  
  - **A-range:** Analyzes whether the scenario severs causal/normative demands (e.g., "Causal traceability persists via synthetic states; normative sourcehood may hold if psychological continuity enables authentic self-expression").  
  - **B-range:** Describes the scenario but applies it superficially (e.g., "The agent is still determined, so not responsible").  
  - **Common failure:** Ignores psychological continuity or misinterprets synthetic origins as "external manipulation."  

  **4. Critical evaluation of Strawson’s argument**  
  *(4 marks)*  
  - **A-range:** Assesses whether the conflation undermines the regress (e.g., "The scenario shows normative demands *can* survive causal determination; Strawson’s slide assumes without argument that sourcehood requires *uncaused* origins").  
  - **B-range:** Stakes a position but defends it weakly (e.g., "Strawson is wrong because we feel responsible").  
  - **Common failure:** Treats the neural case as definitively resolving the debate.  

  **5. Philosophical nuance on settled vs. contested elements**  
  *(3 marks)*  
  - **A-range:** Explicitly flags settled elements (regress logic, *causa sui* impossibility) vs. contested elements (whether sourcehood requires *causa sui*, validity of the conflation charge).  
  - **B-range:** Fails to demarcate settled/contested claims or presents contested views (e.g., "Strawson’s argument is widely rejected") as consensus.  
  - **Common failure:** Assumes the neural-replacement agent is "obviously" responsible/non-responsible.  

  ---

  **Note on Consensus:**  
  - **Settled:** The logical validity of Strawson’s regress given *causa sui* as a premise; the *impossibility* of *causa sui*.  
  - **Contested:** Whether moral responsibility *requires* *causa sui*; whether the causal/normative distinction dissolves the regress; whether scenarios like neural replacement satisfy normative demands.  
  The model answer avoids asserting contested claims (e.g., "the neural agent *is* responsible") as definitive, instead framing them as interpretive possibilities.
