prompt: |-
  I'm a planning officer for a mid-sized council and we're drowning in applications mixing affordable housing with market-rate units. I want to turn Rawls's veil of ignorance and the difference principle into an actual decision procedue I can run on each proposal — the questions in order, what counts as a sufficient answer, where it stops with a no, and where I have to hand the decision to an elected member because it's values rather than facts. There's a twist: our local framework treats daylight access and walking-distance healthcare as primary goods alongside income, which isn't standard Rawls but it's what I have to work with. It needs to be usable by someone who hasn't touched political philosophy since uni, should flag where it'll misfire, and mustn't ask me for citations or a bibliography. Run it on two cases: a developer wants to replace a derelict canal lock with luxury flats plus 10% "affordable" units, and another wants height exemptions near the hospital for staff housing that'd cast long shadows over existing council estates. Make sure one gives me an answer I'd rather not hear. Write in British English please, and skip any reading list.
reasoning: |-
  Okay, this is a fascinating challenge from a UK planning officer. They're drowning in mixed housing applications and want to turn Rawlsian philosophy into a practical decision procedure. The twist is they've got locally defined primary goods - daylight access and walking-distance healthcare - alongside income. 

  First, I need to unpack what they're really asking for: a step-by-step checklist that any planning officer can use without philosophy training, with clear pass/fail gates and escalation points. The Rawlsian framework needs heavy adaptation - the veil of ignorance and difference principle weren't designed for planning committees. 

  Key constraints: British English, no academic citations, must work with their local definitions of primary goods. And crucially, one test case must deliver an uncomfortable truth - they're clearly preparing for tough decisions. 

  For the procedure itself, I'm structuring it as a flowchart in prose: start with veil of ignorance questions (would this arrangement benefit the least advantaged?), then apply the difference principle (is this the best possible deal for vulnerable groups?). Each step needs unambiguous success criteria and failure consequences. 

  The two cases present perfect contrasts:
  - Canal lock development: classic gentrification dilemma with token affordable housing. Suspect this will fail the Rawls test spectacularly.
  - Hospital staff housing: creates daylight deprivation but serves essential workers. This is where it gets morally messy - might pass the difference principle if alternatives are worse.

  Biggest challenge is avoiding philosophy jargon while keeping the Rawlsian core intact. Terms like "primary goods" get replaced with "basic life requirements per local policy". Also flagging where the model breaks - like when developments pit different disadvantaged groups against each other (hospital staff vs estate residents).

  The uncomfortable outcome will likely be the hospital case - where planning logic might approve something that feels wrong intuitively. That's exactly why they want this procedure: to depersonalise tough calls.
answer: |-
  Here's a practical Rawlsian decision procedure adapted for your planning context, incorporating your local primary goods (income, daylight access, walking-distance healthcare). It's designed as a sequential checklist with clear pass/fail gates and escalation points.

  **The Rawlsian Planning Assessment Framework (RPAF)**

  **Core Principle:** Prioritise arrangements that would be chosen by rational individuals behind a "veil of ignorance" (not knowing their own future wealth, health, or location) and that benefit the least advantaged (Difference Principle), using your defined primary goods.

  **Primary Goods (Local Definition):**
  1.  **Income/Housing Affordability:** Secure, decent housing without excessive financial burden relative to local income.
  2.  **Daylight Access:** Adequate natural light for health and wellbeing within dwellings and key communal spaces.
  3.  **Walking-Distance Healthcare:** Safe, practical pedestrian access (<15-20 mins walk) to essential healthcare facilities (GP, Pharmacy, Dentist as minimum).

  **The Procedure:**

  **STAGE 1: THE VEIL OF IGNORANCE TEST (Fairness Check)**
  *   **Question 1:** *"If I didn't know whether I'd end up living in the proposed affordable units, the market units, the surrounding estates, or needing the nearby healthcare, would I accept the overall trade-offs this development makes between the primary goods?"*
  *   **Sufficient Answer:** A credible "Yes" based on tangible benefits outweighing tangible losses *across the spectrum* of potential positions. Requires demonstrating *net improvement* in the primary goods landscape for the hypothetical "worst-off" position.
  *   **Failure (Stop - Recommend REFUSAL):** If the answer is "No" or "Uncertain" because the trade-offs seem unfairly weighted against potentially vulnerable positions (e.g., affordable residents get poor daylight, estate neighbours lose healthcare access, hospital staff still can't afford units). The burden of proof is on the applicant to show fairness.
  *   **Escalation Point:** N/A. This is a fundamental fairness screen based on the proposal's structure. If it fails, it fails.

  **STAGE 2: THE DIFFERENCE PRINCIPLE TEST (Benefit to Least Advantaged)**
  *   **Question 2a:** *"Does this development demonstrably improve the position of the least advantaged group(s) *relevant to this site* regarding at least one primary good, without worsening their position regarding any other primary good?"* (Identify the relevant L-A group: e.g., existing estate residents, future affordable tenants, low-paid hospital staff).
  *   **Question 2b:** *"If it worsens their position on one primary good to improve another, is this the *only feasible way* to achieve a significant improvement for them? And is the improvement substantial enough to justify the loss?"*
  *   **Sufficient Answer:**
      *   For 2a: Clear evidence of net gain in primary goods for the identified L-A group(s) with no losses.
      *   For 2b: **Rigorous proof** that (i) the negative impact is unavoidable to achieve the positive outcome, (ii) no alternative design/site/layout could achieve the same benefit without the harm, and (iii) the *magnitude* of the benefit (e.g., number of truly affordable homes created, critical healthcare access secured) *significantly outweighs* the harm (e.g., scale of daylight loss, number of people losing healthcare access).
  *   **Failure (Stop - Recommend REFUSAL):** If the development harms the least advantaged group on any primary good without meeting the stringent 2b criteria (unavoidability, no alternatives, significant net benefit). Vague promises or minor benefits don't suffice.
  *   **Escalation Point:** If Stage 2b arguments are credible but involve **significant value judgements** about the *weight* of different primary goods or the *acceptability* of the trade-off for the L-A group, escalate to the elected Planning Committee. Officer reports must clearly frame the *specific value judgement* needed (e.g., "Is the provision of X staff homes worth the loss of Y hours of daylight for Z existing estate residents?").

  **Where the Model Misfires:**
  1.  **Conflicting Disadvantaged Groups:** When improving things for one L-A group (e.g., hospital staff needing homes) directly harms another (e.g., estate residents losing daylight). RPAF helps identify this conflict starkly but resolving it often requires political value judgements (Escalation Point).
  2.  **"Tokenism" Detection:** It struggles if "affordable" is defined too loosely (e.g., 80% market rate isn't truly affordable). You need robust local definitions of "affordable" linked to income data. Ensure "affordable" genuinely benefits the L-A in your area.
  3.  **Long-Term vs. Short-Term:** Focuses on the immediate development impact. Doesn't easily capture long-term neighbourhood change dynamics (e.g., gentrification triggered by luxury flats). Mitigation: Consider cumulative impacts and enforce strong S106 obligations where relevant.
  4.  **Quantifying Daylight/Healthcare Loss:** Requires clear, adopted standards (e.g., BRE daylight/sunlight guidelines, defined healthcare access thresholds). Subjective assessments weaken the test.

  ---

  **Running the Cases:**

  **Case 1: Derelict Canal Lock - Luxury Flats + 10% "Affordable"**
  *   **Stage 1 (Veil of Ignorance):**
      *   *If you didn't know your position:* Would you accept a scheme where 90% are luxury units (likely unaffordable, potentially altering local character/amenity costs) and only 10% are affordable? The affordable units might be small, poorly located, or still expensive. Existing local low-income residents gain little (maybe some site cleanup) but risk displacement pressure. New affordable tenants get a home but possibly in an isolating, high-wealth environment. The "worst-off" positions (existing low-income locals, future affordable tenants) seem likely to lose out on affordability context and potentially access to local services if prices rise.
      *   **Assessment:** Unlikely to pass. The trade-off heavily favours the well-off. Burden not met.
      *   **Result: FAIL Stage 1. Recommend REFUSAL.** (Stops here).

  **Case 2: Height Exemptions near Hospital for Staff Housing - Shadows over Council Estate**
  *   **Stage 1 (Veil of Ignorance):**
      *   *If you didn't know your position:* Would you accept a scheme where you *might* be an existing estate resident suffering significant daylight loss (a primary good), or a key worker desperately needing an affordable home near work (access to employment/healthcare is implied in income/health primary goods)? Or a patient needing staff to be available? The trade-off is direct harm (daylight loss) to one group for a potential benefit (housing access) to another vulnerable group (staff).
      *   **Assessment:** It's conceivable behind the veil that rational people *might* accept this trade-off *if* the staff housing is genuinely critical and affordable, and alternatives are truly impossible. Passes narrowly *if* the staff housing need and lack of alternatives is proven.
  *   **Stage 2 (Difference Principle):**
      *   **Identify L-A Groups:** (i) Existing estate residents (losing daylight), (ii) Low-paid hospital staff needing housing.
      *   **Q2a:** Does it improve one group without harming the other? **No.** Estate residents are harmed (daylight loss). Staff *might* be helped (if housing is truly affordable/accessible).
      *   **Q2b:** Is harming estate residents unavoidable to help staff?
          *   *Unavoidability?* Applicant must prove *all* alternative sites, lower-impact designs, or off-site provision options are genuinely unviable or fail to meet the need. Extremely high bar.
          *   *No Alternatives?* See above. Rigorous exploration required.
          *   *Significant Net Benefit?* How many genuinely affordable staff homes are created? How critical is *this specific location* for staff accessing the hospital (vs. just being "nearby")? What is the *quantified* daylight loss (using BRE guidelines)? How many estate residents are severely affected? Does the benefit (e.g., 50 key worker homes) *significantly outweigh* the harm (e.g., plunging 100 existing homes into significant gloom)?
      *   **Assessment:** This is highly precarious. Proving unavoidable harm and significant net benefit is difficult. The loss of a tangible primary good (daylight) for existing residents is weighed against the *potential gain* of a primary good (housing/income) for future residents. Quantification is key but imperfect. The **value judgement** about whether this specific trade-off is *acceptable* is profound.
      *   **Result:** Likely **FAILS Stage 2b** unless evidence for unavoidable harm and overwhelming net benefit is exceptionally strong and watertight. However, because the core issue is the *weight* of the value judgement (Is the harm *worth* the benefit?), this reaches the **Escalation Point**.
      *   **Recommendation:** Prepare a rigorous report for the Planning Committee. Clearly state:
          *   The identified L-A groups and the conflict.
          *   The proven loss of daylight (quantified).
          *   The proven need for staff housing and lack of *truly feasible* alternatives.
          *   The number/affordability of staff units.
          *   **Frame the Value Judgement Explicitly:** "Members must determine whether the public benefit of providing X genuinely affordable homes for essential hospital staff, which the evidence suggests cannot be viably provided elsewhere without this height, justifies the significant and unavoidable harm through daylight loss to Y residents of [Estate Name]. The RPAF highlights this fundamental conflict but cannot resolve the weighting of these competing primary goods for the least advantaged."

  **The Uncomfortable Outcome:** Case 2 is where the procedure might force you to acknowledge that *if* the applicant meets the exceptionally high bar of Stage 2b (unavoidability, no alternatives, significant net benefit), the RPAF logic could *technically* support approval, even though the harm to existing residents feels viscerally wrong. The procedure flags that this *is* the value judgement crux requiring elected member decision. It prevents you from easily dismissing it but also prevents easy approval without confronting the harsh trade-off. It might approve something you personally dislike, based on Rawlsian logic strictly applied with your local goods.
