  - There are two possible states (branches): one highly probable (say, 90%) and one improbable (10%).
  - The payoff in the probable branch depends on what the agent would do in the improbable branch.
  - The agent first commits to a policy (what to do in each branch) without knowing which branch they are in.
  - Then, they learn which branch they are in and must decide whether to follow the policy or not.

  However, if they learn the branch and then choose, they have an incentive to defect in the improbable branch (since paying there is costly and doesn't affect the probable branch). But if they don't learn, then there's no update and no tension.

