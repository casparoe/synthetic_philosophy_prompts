  Here is a detailed staging for your session, designed to illuminate updateless decision theory through direct experience. The core challenge is to create a scenario where students must confront the tension between pre-committing to a policy and the temptation to defect after learning new information, without relying on a predictor whose accuracy becomes a distraction. The setup uses a chancy device (e.g., a die roll) to determine which branch a student occupies, and the stakes are course points or tokens exchangeable for small rewards like chocolate.

  **Ground Rules and Preparation**  
  Before the session, prepare two types of sealed envelopes. Envelope Type A (probable branch) contains a green card; Type B (improbable branch) contains a red card. For every student, prepare both envelope types. Also, have a six-sided die visible to all. Each student will need a decision sheet with two parts: Part 1 for policy commitment, Part 2 for action choice. Arrange the room so students cannot see others’ choices.

  **Session Structure**  
  *First 15 minutes: Introduction and policy commitment.*  
  Explain that each student faces a scenario with two branches. Branch A (green) has an 83% probability (rolling 1–5 on the die); Branch B (red) has a 17% probability (rolling a 6). In Branch A, choosing "Pay" costs 1 point but can yield a reward; "Not Pay" costs nothing. In Branch B, choosing "Pay" costs 3 points and yields no direct reward; "Not Pay" costs nothing. Crucially, the reward in Branch A depends on what the student’s policy says they *would do* in Branch B—not what they actually do in Branch B, since they cannot be in both branches. Hand out decision sheets. In Part 1, each commits to a policy: "If A, I will [Pay/Not Pay]. If B, I will [Pay/Not Pay]." Collect all sheets.  

  *Next 15 minutes: Branch assignment and action choice.*  
  Roll the die publicly for each student to determine their branch. For a roll of 1–5, give them a Type A envelope (green); for 6, Type B (red). Students open envelopes to learn their branch but do not reveal it. Distribute Part 2 of the decision sheet. Now, in their actual branch, they choose: Pay or Not Pay. Emphasize that this is a real choice affecting their payoff. Collect Part 2 sheets.  

  *Next 20 minutes: Payoff resolution and interim discussion.*  
  Calculate payoffs privately. For a student in Branch A:  
  - If they chose "Pay" in Part 2, they lose 1 point.  
  - They gain 10 points *if* their Part 1 policy committed to "Pay" in Branch B.  
  - If they chose "Not Pay," they get 0 points (no cost, no gain).  
  For a student in Branch B:  
  - If they chose "Pay" in Part 2, they lose 3 points.  
  - If they chose "Not Pay," they get 0 points.  
  (Branch B choices do not affect Branch A payoffs.)  
  Announce individual point totals but not breakdowns. Then, facilitate a short discussion: "Which choices felt rational? Did anyone regret their Part 1 policy after learning their branch?"  

  *Next 25 minutes: Reveal and debrief.*  
  Return each student’s Part 1 policy sheet. Reveal the global outcome: How many in Branch A gained 10 points (those whose Part 1 committed to "Pay in B")? How many in Branch B paid the cost? Highlight the conflict:  
  - Most Branch A students who committed to "Pay in B" in Part 1 gained 10 points at a cost of 1 point (net +9).  
  - Branch B students who committed to "Pay in B" in Part 1 faced a dilemma: Following through cost them 3 points, but defecting (choosing "Not Pay" in Part 2) meant their Part 1 policy was inconsistent.  
  Map this to updateless theory:  
  - **Policy as a function of evidence:** The Part 1 policy used no branch information, but it *conditioned* on branch information ("If A… If B…"). Updatelessness doesn’t ignore evidence; it encodes how evidence *would* affect actions. The Part 1 sheet *is* the policy function.  
  - **Scoring from the initial standpoint:** Payoffs in Branch A depended on the Part 1 commitment, which was made before the die roll. This initial standpoint (pre-roll) is where the policy was scored: Committing to "Pay in B" had high expected utility (83% chance of +9 in A, 17% chance of -3 in B = net +6.6 points), while "Not Pay in B" had 0.  
  - **The live disagreement:** After learning their branch, Branch B students saw "Pay" as a loss (updateful view). But updatelessness says the policy’s value is fixed pre-roll. The disagreement is whether we score from the initial standpoint (where "Pay in B" boosts A’s value) or the updated one (where B’s cost dominates).  
  Address the predictor objection honestly: The scenario uses chance (die rolls) to simulate branches, so the link between the choice and the other branch is statistical, not logical. In updateless theory, the dependence should be subjunctive: "If I *were* in B, I would pay." This activity cannot replicate that; it only approximates via pre-commitment. You’ll need to verbally clarify that updatelessness aims for logical counterfactuals (e.g., in a timeless sense), but statistical dependence helps illustrate the *structure* of the trade-off.  

  *Final 15 minutes: Logical branch variant and closing.*  
  Replace the die with an unsolved math problem, e.g., "Is 51,319 a prime number?" Announce that Branch A is "if composite," Branch B is "if prime." Students complete Part 1 (policy) as before. Without resolving the problem, they do Part 2: Choose an action *as if* assigned to a branch, but they don’t know which. Pause. Ask: "Can you define a policy here? If the payoff in A depends on your policy for B, but you don’t know which branch you’re in logically, does updatelessness still apply?" Discuss briefly. Conclude by noting that updatelessness treats the policy as a single object scored from a pre-logical-omniscience standpoint, but humans lack a clear "initial" standpoint. The tension persists: Should you bind yourself to the policy or defect upon learning?  

  **Predictable Issues and Mitigation**  
  - **Problem:** Students in Branch B defect (choose "Not Pay") since it avoids costs, making updatelessness seem foolish.  
    *Fix:* In debrief, contrast their Part 1 expected utility (high for "Pay in B") with their Part 2 myopic view. Stress that updatelessness cares about pre-roll expectations.  
  - **Problem:** Branch A students might think their Part 2 choice affects the reward.  
    *Fix:* Clarify that only their Part 1 commitment for B matters. Their Part 2 "Pay" in A is just a small cost; the big win comes from pre-committing to B.  
  - **Problem:** The math variant feels abstract without resolution.  
    *Fix:* Focus on the conceptual shift from chance to logical uncertainty. Ask: "Does updatelessness require uncertainty to be probabilistic, or can it handle logical unknowns?"  

  This design ensures the conflict manifests in choices: Branch B students who committed to "Pay" face a loss if they follow through or inconsistency if they defect. The activity frames the debate around scoring standpoints, not evidence use, and the logical variant forces engagement with timelessness. Students walk out having lived the updateless tension.
