prompt: |-
  hey im on a review board for our county's emergency intervention fund and we get like 15-20 proposals a month asking us to approve spending on things that are basically "rescue" operations -- vaccinating a remote village, funding a suicide hotline, sending gear to wildfires, even one about saving a coastal archive of indigenous records from storm surges. right now we just vote on gut feeling and its a mess.

  i want a decision procedure based on singer's drowning child idea -- that if you can prevent something terrible without giving up anything of comparable moral importance, then you have to do it. but i need it turned into something my board can actually run in about 20 minutes per proposal, since none of us are philosophers. so write me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no, and where it has to hand the decision back to the board because its a values question not a facts question.

  the procedure needs to handle the hard cases: the "victim" might be statistical or future (preventing expected deaths vs saving one visible person), the "cost" is always money we could spend on another proposal, and sometimes people disagree about wether the harm is "bad enough" to trigger the duty at all. also it needs a specific check for proposals where the beneficiary's moral status is contested -- like wild animals, digital archives, or future generations -- since singer's own framework extends beyond humans but not everyone on the board agrees.

  then run the procedure on three proposals: (1) funding a mobile unit to reverse opioid overdoses in our county, (2) a grant to protect that coastal archive of indigenous records from storm surges, and (3) a program that vaccinates a wild deer population against a painful but non-lethal disease.

  make sure you flag where the procedure will misfire or give answers the board probably wont like. and please say how confident you are in what you claim, and single out the one point you're least sure about -- especially anything that hinges on how singer actually treats indirect costs or statistical lives.
reasoning: |-
  Okay, the user is on a review board for an emergency intervention fund and needs a practical decision procedure based on Peter Singer's drowning child analogy. They handle 15-20 proposals monthly and currently vote by gut feeling, which is messy. They want a structured, efficient process that can be completed in 20 minutes per proposal.

  The user mentioned specific challenges: statistical or future victims, monetary trade-offs, disagreements on harm severity, and contested moral status of beneficiaries like animals or digital archives. They also provided three examples to test the procedure: opioid overdose reversal, coastal archive protection, and deer vaccination.

  First, I need to break down Singer's principle into actionable steps. The core idea is that if you can prevent something terrible without sacrificing something of comparable moral importance, you should act. Since the board isn't familiar with philosophy, the steps must be straightforward and include clear yes/no questions.

  Key components to address:
  1. **Urgency and Preventability**: Is the harm immediate and can it be prevented?
  2. **Cost-Effectiveness**: Is the cost low per unit of harm prevented?
  3. **Moral Status**: Is there disagreement on whether the beneficiary has moral standing? This needs a fallback to board vote.
  4. **Indirect Costs**: Singer's framework might not account for opportunity costs directly, so comparing cost-effectiveness against other proposals is crucial.

  For the procedure, I'll outline a decision tree with specific questions. Each step should have clear pass/fail criteria. Steps where values conflict, like moral status, should revert to board judgment. 

  Testing the three proposals:
  - **Opioid Overdoses**: High preventability, measurable lives saved, high cost-effectiveness. Likely passes.
  - **Coastal Archive**: Preventable harm, but moral status of archives might be contested. Cost-effectiveness is harder to measure. Reverts to board.
  - **Deer Vaccination**: Preventable suffering, but moral status of animals disputed. Cost per unit of harm is unclear. Might fail or revert.

  Potential misfires:
  - Overemphasizing cost-effectiveness might neglect important but less quantifiable projects.
  - Moral status disagreements could stall decisions.
  - Statistical lives vs. identifiable victims might bias the board.

  I'm least confident about handling indirect costs. Singer focuses on direct sacrifice, but the fund's opportunity cost is central here. Comparing cost-effectiveness across proposals might be necessary, but it's complex and time-consuming. Also, defining "comparable moral importance" for non-human entities is tricky and could lead to disputes.

  The user's deeper needs include reducing decision fatigue, ensuring fairness, and handling ethical disagreements systematically. They might also want legitimacy in their decisions and to avoid backlash from controversial choices. The procedure should provide transparency and consistency, even when reverting to board votes for value judgments.
answer: |-
  Here's a streamlined decision procedure based on Singer's principle, designed for speed and practicality in your context. It focuses on key questions, clear thresholds, and flags where board judgment is essential.

  **The "Preventable Harm Triage" Procedure (20-Minute Version)**

  1.  **STEP 1: Is the Harm Preventable & Significant?**
      *   **Question:** "Does this proposal demonstrably prevent a specific, severe harm (death, extreme suffering, catastrophic loss) that *will likely occur soon* without intervention?" (Focus on *prevention*, not just mitigation of ongoing harm).
      *   **Sufficient Answer:** YES = Clear evidence (data, expert assessment, specific threat timeline) linking the proposal directly to preventing *imminent* severe harm. NO = Harm is speculative, minor, unavoidable, or the proposal only mitigates ongoing harm without preventing a specific future worsening.
      *   **Stop?** YES, **HARD NO** if answer is NO. (Rationale: No duty to act under Singer if harm isn't severe/preventable).
      *   **Values Flag?** YES. Disagreement on *what constitutes "severe harm"* for non-human entities (e.g., extinction of a culture via archive loss, intense animal suffering) must go to board vote immediately. State the disagreement clearly.

  2.  **STEP 2: Is the Cost "Not Morally Significant" Relative to Harm?**
      *   **Question:** "Is the requested cost *very likely* to prevent the harm *per instance* at a level that seems trivial compared to the severity of that harm?" (Focus on *cost per unit of harm prevented*).
      *   **Sufficient Answer:** YES = Quantifiable cost per life saved/suffering averted is demonstrably low *within your funding context* (e.g., $X per overdose reversal, $Y per archive preserved from destruction). NO = Cost per unit prevented is very high, unclear, or disproportionate to the harm (e.g., enormous cost for minor benefit).
      *   **Stop?** YES, **HARD NO** if answer is NO. (Rationale: Cost *is* of comparable moral importance if it could prevent *much more* severe harm elsewhere).
      *   **Values Flag?** POTENTIALLY. Requires estimating "cost per unit harm prevented." Disagreement on *how to quantify/compare harm severity* (e.g., human life vs. cultural artifact preservation vs. animal suffering) or on *acceptable thresholds* ($10k/life? $100k/culture?) must go to board vote. State the quantification method and threshold concern.

  3.  **STEP 3: Is the Beneficiary's Moral Status Uncontested?**
      *   **Question:** "Is there broad consensus that the entity suffering the harm has moral standing requiring our direct intervention?" (Focus on *controversy*, not philosophical depth).
      *   **Sufficient Answer:** YES = Beneficiary is uncontroversially human (present individuals). NO = Beneficiary is non-human animals, ecosystems, future generations, cultural artifacts, or statistical lives where significant board members *express strong disagreement* about moral priority.
      *   **Stop?** NO. Proceed, but...
      *   **Values Flag?** YES, **CRITICAL**. If answer is NO, **IMMEDIATELY SEND TO BOARD VOTE.** Do not proceed further in the procedure. Singer *extends* moral consideration, but this is a fundamental value disagreement the procedure cannot resolve. State the specific contested beneficiary.

  4.  **STEP 4: Is the Causal Link Strong & Direct?**
      *   **Question:** "Is there strong evidence that *this specific intervention* will *directly* cause the harm prevention? Are failure risks low and manageable?"
      *   **Sufficient Answer:** YES = Proven method (e.g., naloxone reversal), clear implementation plan, competent actors, low risk of failure/funds misuse. NO = Untested method, complex chain of causation, high risk of failure, significant implementation barriers.
      *   **Stop?** YES, **HARD NO** if answer is NO. (Rationale: No duty to fund something unlikely to succeed).
      *   **Values Flag?** MINIMAL. This is primarily a factual assessment of efficacy and risk.

  **Decision Flow:**
  *   Fail Step 1 or Step 2: **Reject (Hard No)**
  *   Fail Step 3: **Send to Full Board Vote Immediately**
  *   Pass Step 1, Step 2, Step 4, and YES on Step 3: **Recommend Approval**
  *   Pass Step 1, Step 2, Step 4, but NO on Step 3: **Send to Full Board Vote**

  **Key Misfires & Limitations:**
  1.  **Overly Rejective on Hard Cases:** Steps 1 & 2 thresholds might reject complex, high-impact but less quantifiable proposals (like the archive) even if the board values them. The "values flags" are crucial safety valves.
  2.  **Statistical vs. Identifiable Bias:** The procedure treats "statistical lives" (e.g., overdose prevention) the same as "identifiable victims" if harm/cost is clear (Step 1 & 2). However, *board members* might instinctively favor identifiable victims, causing internal conflict despite the procedure's output.
  3.  **Cost Comparison Burden:** Step 2 implicitly requires comparing cost-effectiveness *across proposals*. The procedure doesn't mandate a ranked list, but rejecting a proposal because its cost-per-harm-prevented is high implies knowing other proposals are lower. Maintaining rough benchmarks is essential.
  4.  **"Comparable Moral Importance" Simplification:** Defining "not morally significant" cost solely by cost-per-harm-prevented *within this fund* is a practical reduction. Singer's original concept is broader (personal sacrifice), but here the *only* sacrifice is *not funding other proposals*. This is the core trade-off.
  5.  **Indirect Costs:** The procedure focuses *only* on the direct cost of *this* proposal vs. *this* harm. It doesn't capture broader systemic impacts (e.g., vaccinating deer might disrupt ecosystems, saving archives might have long-term cultural benefits). Board judgment is needed if these are raised.

  **Confidence & Least Sure Point:**
  *   **Overall Confidence:** Moderately High (70%) for core structure. It captures Singer's imperative, forces quantification, isolates value conflicts, and provides clear stopping points.
  *   **Least Sure Point (Low Confidence - 40%):** **Handling "Indirect Costs" / "Comparable Moral Importance" solely via Cost-Per-Harm-Prevented within the Fund.**
      *   *Why?* Singer frames "comparable moral importance" as sacrificing something *you* value highly. For the *fund*, the only sacrifice is *not helping others*. Step 2 tries to measure this by asking "Is *this* cost-per-harm so high that spending it here means we *likely fail* to prevent *more or worse* harm elsewhere?" This hinges entirely on having good comparative data on *other proposals'* cost-effectiveness, which is dynamic and imperfect. It might undervalue unique opportunities (like the one-time archive save) against recurring needs (overdose reversal). This is where the procedure is most reductionist and potentially misfires.

  **Applying the Procedure to Your Examples:**

  1.  **Mobile Opioid Overdose Unit:**
      *   **Step 1:** YES. Preventable harm? Deaths from overdose. Severe? Extreme (death). Imminent? Ongoing crisis. Evidence: EMS data on overdoses, reversals by similar units.
      *   **Step 2:** YES. Cost per harm prevented? Cost of unit / projected reversals = $X per life saved. Likely very low compared to the harm (death). Benchmark: Compare to other life-saving proposals.
      *   **Step 3:** YES. Beneficiary? Present, identifiable humans (overdose victims). Uncontroversial.
      *   **Step 4:** YES. Causal link? Naloxone is proven. Mobile units are effective. Trained personnel involved.
      *   **Decision:** **Recommend Approval.** (Misfire Risk: Low. This is the "drowning child" case.)

  2.  **Coastal Indigenous Archive Protection:**
      *   **Step 1:** YES. Preventable harm? Irreversible loss/destruction by storm surge. Severe? Culturally catastrophic. Imminent? Specific storm surge threat (sea level rise projections, storm frequency). Evidence: Engineering reports, climate models.
      *   **Step 2:** **VALUES FLAG / BOARD VOTE NEEDED.** Cost per harm prevented? Cost of protection / value of preserving archive. Quantifying the "unit of harm" (loss of irreplaceable cultural knowledge/history) in comparable terms to *human death/suffering* is inherently controversial. What threshold is "not morally significant"? Significant disagreement likely.
      *   **Step 3:** **VALUES FLAG / BOARD VOTE NEEDED.** Beneficiary? Cultural archive / future generations / Indigenous community. Moral status is highly contested (Is preserving history/culture a duty akin to saving lives?).
      *   **Procedure Outcome:** **Sent to Board Vote at Step 2 or Step 3.** (Misfire Risk: High. The procedure flags the value conflict but doesn't resolve it. Could be rejected on Step 2 quantification grounds even if board values it highly).

  3.  **Wild Deer Vaccination (Non-Lethal Disease):**
      *   **Step 1:** YES. Preventable harm? Widespread, intense animal suffering. Severe? Defined as "painful" - board must agree if this rises to "severe suffering". Imminent? Disease is present/spreading.
      *   **Step 2:** **VALUES FLAG / POTENTIAL BOARD VOTE.** Cost per harm prevented? Cost per deer treated / severity of suffering averted. Quantifying "animal suffering units" and comparing their moral weight to *human* suffering or other proposals is highly contentious. What cost per animal is "not morally significant"?
      *   **Step 3:** **VALUES FLAG / BOARD VOTE NEEDED.** Beneficiary? Wild animals. Moral status is contested (Does our duty extend to preventing non-lethal suffering in wildlife?).
      *   **Step 4:** YES/NO depends. Is the vaccine effective? Can it be delivered reliably to a wild population?
      *   **Decision:** **Likely Sent to Board Vote at Step 3 (Moral Status), or potentially rejected at Step 2 (Cost vs. Suffering Weight) or Step 4 (Feasibility).** (Misfire Risk: Very High. Value conflicts dominate. Might be rejected even if Singer's principles suggest a duty to prevent intense suffering).

  **Recommendation:** Use this procedure as a *structuring tool* to force critical questions and isolate disagreements, not an infallible algorithm. Combine it with a quick (5 min) board discussion *after* running the steps to sanity-check the output, especially for cases flagged for vote or close calls. Track your cost-effectiveness benchmarks over time. Good luck!
