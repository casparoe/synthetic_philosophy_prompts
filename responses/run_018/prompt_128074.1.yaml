  ## Joint Statement: Adversarial Collaboration on Assertion Norms

  **Signed Joint Claims Regarding Testimony, Expert Deference, and the Lottery Paradox:**

  1.  **Testimony Transmission:** Both parties agree that testimony is a primary mechanism for acquiring beliefs and that assertions play a crucial role in this process. Listeners typically rely on the asserter meeting *some* epistemic standard.
  2.  **Expert Deference Relevance:** Both parties acknowledge that in contexts of significant expertise differentials, laypersons are often epistemically justified in deferring to expert assertions without possessing the underlying evidence themselves. The *propriety* of such deference relates to the norm governing the expert's assertion.
  3.  **Lottery Paradox Challenge:** Both parties recognize the Lottery Paradox as a significant challenge highlighting the tension between intuitive norms governing assertion and purely probabilistic justification. Both agree that asserting "Your ticket lost" based solely on the high probability (e.g., 1 in a million) before the draw feels intuitively improper, requiring explanation by any viable norm of assertion.
  4.  **Actionability of Asserted Content:** Both parties agree that assertions provide information upon which listeners may base actions. The appropriateness of acting on an assertion is linked, in part, to the epistemic standing of that assertion.

  **Disagreements Table:**

  | Topic                             | Knowledge Norm (KN) Position (Self-Description)                                                                 | Justification Norm (JN) Position (Self-Description)                                                                 |
  | :-------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- |
  | **Governing Norm of Assertion**   | Assertion is permissible only if the speaker knows the asserted proposition. (One must: Know that P)           | Assertion is permissible if the speaker possesses rationally well-justified belief in the proposition. (One must: Have sufficient justification for believing P) |
  | **Epistemic Goal of Assertion**   | The primary function of assertion is to share knowledge; assertion aims at transmitting known truths.            | The primary function of assertion is to share reasonably held, actionable information based on available evidence.     |
  | **Base-Level Perceptual Reports** | Basic perceptual reports (e.g., "I see a cup") are typically made *because* the speaker knows the content via perception; they are not exempt from the knowledge norm but often satisfy it directly. | Basic perceptual reports represent a foundational level of reporting direct experience; while subject to justification norms, the justification for sincere reports in normal conditions is typically immediate and sufficient, making them paradigm cases of permissible assertion even if knowledge criteria are debated. |
  | **Status of Gettier Cases**       | Gettier cases demonstrate that justified true belief is insufficient for knowledge and thus insufficient for permissible assertion. Assertions in Gettier cases are improper. | Gettier cases are rare exceptions; the speaker in such cases possesses rational, well-justified true belief. Their assertion is permissible, reflecting the best available evidence. |

  **Identified Cruxes:**

  1.  **Crux 1: The Nature and Epistemic Status of Basic Perceptual Reports:**
      *   **Relevant Case/Reasoning:** Consider a subject, S, in normal conditions who looks at a table and sincerely asserts, "There is a red cup on the table." S's perceptual faculties are functioning normally, the lighting is good, and there is no reason for S to doubt their senses. Is this assertion governed by the same epistemic norms as assertions based on complex inference or testimony? Does it require the same level of justification or knowledge as other assertions, or is it justified/known in a different, more basic way?
      *   **KN Prediction:** The assertion is permissible *only if* S knows there is a red cup. In standard cases, S *does* know this via perception. There is no special "exemption"; perception is a standard knowledge-producing faculty. In rare skeptical scenarios (e.g., brain-in-vat), S wouldn't know and thus shouldn't assert. The norm applies uniformly.
      *   **JN Prediction:** The assertion is permissible because S has immediate, well-justified perceptual belief. The justification is direct and defeasible, but sufficient for assertion in normal conditions. This case exemplifies the sufficiency of strong justification for assertion, even if intricate philosophical arguments challenge whether this constitutes "knowledge." The justification norm provides a more direct explanation of its permissibility.

  2.  **Crux 2: Delegated Assertion and Collective Epistemic Practice:**
      *   **Relevant Case/Reasoning:** A junior scientist on a large research team meticulously analyzes her assigned subset of data, finding strong evidence supporting the team's hypothesis. She lacks access to the full dataset or the expertise to evaluate all methodological details of the overall experiment. Based on her reliable analysis of her part and trust in the team's established protocols and peer review, she publicly asserts, "Our experiment confirms hypothesis H," presenting the team's findings.
      *   **KN Prediction:** For her assertion to be proper, she must *know* that H is confirmed. Merely having justification based on her part *plus* institutional trust is insufficient for *knowledge* of the whole (it resembles justified true belief without knowledge). Her assertion is therefore improper; only someone with integrated knowledge of the entire process (e.g., the lead investigator) could properly assert "H is confirmed." She should only assert her specific findings.
      *   **JN Prediction:** Her assertion is permissible. She possesses strong rational justification: robust evidence for her part of the data *plus* reliable justification for trusting the team's division of epistemic labor, established quality control, and peer review processes. This aggregated justification is sufficient for her to reasonably assert the team's conclusion. Requiring individual knowledge of the entire complex process is impractical and fails to model functional scientific communication.

  **Residual Disagreements:** While finding common ground on the role of testimony, deference, and the challenge of the lottery, fundamental disagreement remains on the core norm governing assertion (knowledge vs. justification). This disagreement manifests sharply in interpreting foundational perceptual reports and common practices of delegated assertion within complex epistemic communities. The KN camp maintains that assertion's core function (sharing knowledge) demands a knowledge norm uniformly, while the JN camp argues that assertion's practical function (sharing well-supported information) is best served by a justification norm that accommodates the structure of human cognition and social epistemology.
