answer: |-
  Below is a pre-registered procedure for your desk, designed to force disciplined reference class selection and prevent arbitrary number-picking. It's built as a checklist with clear exit points ("No number") and escalation triggers. The procedure assumes you maintain a **central ledger** (a shared spreadsheet or database) of historical cases, each tagged with immutable class memberships based on pre-defined criteria. I'll flag judgment calls (JC) and failure modes at each step, then run it on your three files.

  ---

  ### **Pre-Registered Underwriting Procedure**
  **Goal**: Output a base probability for a specific risk event, or escalate/hard-stop when unsupported.  
  **Inputs**: Risk file, historical ledger, adversary (rotated among your team).  
  **Time Budget**: 30–45 minutes per file (strict).  
  **Critical Rule**: If a step isn’t completed in time, the file defaults to "No number."

  #### **Step 1: List Candidate Classes**  
  - **Action**: Brainstorm 3–7 plausible reference classes for the risk. Include at least one broad class (e.g., "all touring exhibitions") and one narrow class (e.g., "exhibitions with first-time logistics partner").  
  - **Sufficient Answer**: Classes must be defined by **observable, pre-outcome traits** (e.g., "venues with <5 years of experience," not "venues that *seemed* unreliable").  
  - **Stop Condition**: If <3 classes apply, stop → **"No number."** Escalate to CUO with rationale.  
  - **JC/Failure Mode**:  
    - *Judgment call*: What counts as "plausible." Team must agree all classes are professionally reasonable.  
    - *Failure mode*: Omitting inconvenient classes. Mitigation: Adversary (Step 5) can add classes.

  #### **Step 2: Membership Test**  
  - **Action**: For each class, ask: "Could we have definitively assigned *historical cases* to this class **before their outcomes were known**?"  
  - **Sufficient Answer**: "Yes" only if membership relies solely on objective, pre-event data (e.g., contract terms, venue specs, counterparty track record).  
  - **Stop Condition**:  
    - If all classes fail → **"No number."** Escalate to CUO with "No anchor for risk."  
    - If only one class passes → Proceed to Step 3, but flag for adversary.  
  - **JC/Failure Mode**:  
    - *Judgment call*: Defining "objective" criteria (e.g., is "late on other jobs" verifiable from ledger?).  
    - *Failure mode*: Retroactively redefining class criteria. Mitigation: Ledger definitions are immutable (Step 6).

  #### **Step 3: Sample Size Check**  
  - **Action**: For each passing class:  
    - Pull the historical frequency from the ledger.  
    - Reject classes with **<5 historical cases** or **0% frequency with n<10**.  
  - **Sufficient Answer**: Frequency + case count (e.g., "Class A: 8% based on 50 cases").  
  - **Stop Conditions**:  
    - If all classes have <5 cases → **"No number."** Escalate to CUO with "Insufficient data."  
    - If one class passes → Use its frequency but flag for adversary.  
  - **JC/Failure Mode**:  
    - *Judgment call*: The "n≥5" threshold (industry standard for statistical stability).  
    - *Failure mode*: Excluding valid classes by setting narrow criteria. Mitigation: Adversary audits.

  #### **Step 4: Base Rate Calculation**  
  - **Action**: Calculate the probability using the **median frequency** of all passing classes.  
    - Why median? Resists skew from outliers (e.g., one class at 1%, another at 20%).  
  - **Sufficient Answer**: Single probability (e.g., "Median: 7%").  
  - **Stop Condition**: Only triggered if prior steps fail.  
  - **JC/Failure Mode**:  
    - *Judgment call*: Using median vs. mean (median chosen for robustness).  
    - *Failure mode*: Gaming by adding bogus classes. Mitigation: Adversary challenge next.

  #### **Step 5: Adversarial Challenge**  
  - **Action**:  
    - Adversary picks **one rival class** from Step 1 (or adds a new one passing Steps 2–3).  
    - Calculate probability using that class.  
    - Compare to Step 4 result: Escalate if **>2x difference** or **>10pp absolute gap**.  
  - **Sufficient Answer**: Adversary's probability + divergence test (e.g., "Rival: 15% → 2.1x divergence → Escalate").  
  - **Stop Conditions**:  
    - If no divergence → Final probability = average of Step 4 and adversary numbers.  
    - If divergence → **Escalate to CUO** with both numbers and rationales.  
  - **JC/Failure Mode**:  
    - *Judgment call*: Divergence thresholds (2x/10pp balances rigor vs. practicality).  
    - *Failure mode*: Adversary colluding or sandbagging. Mitigation: Rotate adversary weekly.

  #### **Step 6: Ledger Update & Consistency Rule**  
  - **Action**: After pricing:  
    - Add the new case to the ledger.  
    - Assign it to **every class it qualifies for** based on pre-defined criteria.  
    - Recalculate frequencies quarterly.  
  - **Rule**: Once a class is defined, its criteria **cannot change**. New cases are tagged by the original rules.  
  - **Sufficient Answer**: Ledger updated with case ID and class tags.  
  - **JC/Failure Mode**:  
    - *Judgment call*: Interpreting class criteria for new cases.  
    - *Failure mode*: "Forgetting" to tag inconvenient classes. Mitigation: Monthly ledger audits.

  #### **Philosophy Agnosticism**  
  - The procedure works for both frequentist ("probabilities are frequencies") and Bayesian ("calibrated credences") views:  
    - Steps 1–5 output a frequency-based anchor.  
    - **After the procedure**, adjust up to ±20% for case-specific factors (Bayesian) but **must document reasons**.  
    - If you reject frequency anchoring entirely, stop at Step 2 → "No number."

  ---

  ### **Run on Three Files**
  **Key**:  
  - 🧪 = Judgment call in procedure  
  - ⚠️ = Failure mode risk  
  - ➡️ = Proceed to next step  

  ---

  #### **File 1: Touring Exhibition**  
  - **Risk**: Probability ≥1 venue loses ≥10 days to damage/transit failure.  
  - **Step 1: Candidate Classes**  
    - C1: All touring exhibitions (ledger: n=50, freq=8%).  
    - C2: Exhibitions with ≥4 venues (n=12, freq=17%).  
    - C3: Exhibitions with fragile works (n=30, freq=13%).  
    - C4: Projects with first-time logistics partner (n=10, freq=40%).  
    - C5: Venues with <5 years of experience (n=15, freq=27%).  
    - ➡️ 5 classes → Proceed.  
    - 🧪 Plausibility: "Venues inexperienced" could be disputed (is 5 years the right cutoff?).  

  - **Step 2: Membership Test**  
    - All pass (membership based on contracts, venue specs, partner history).  
    - ➡️ All proceed.  

  - **Step 3: Sample Size Check**  
    - All have n≥5 → Frequencies: C1=8%, C2=17%, C3=13%, C4=40%, C5=27%.  
    - ➡️ Median = 17% (from C2).  

  - **Step 4: Base Rate Calculation**  
    - Median frequency = 17%.  
    - ➡️ Proceed to adversary.  

  - **Step 5: Adversarial Challenge**  
    - Adversary picks C4 (first-time logistics partner, 40%).  
    - Comparison: 40% vs. 17% → 2.35x divergence (>2x) → **Escalate to CUO**.  
    - ⚠️ Failure mode: Adversary "shops" for extreme class. Mitigation: CUO reviews all classes.  

  - **Outcome**: Escalated. CUO decides between 17% and 40%, or sets own number. Ledger updated.  
  - **Final Probability**: Not set by desk. CUO might blend or add risk load.

  ---

  #### **File 2: Completion Bond on Indie Film**  
  - **Risk**: Probability film delivers >15 days late.  
  - **Step 1: Candidate Classes**  
    - C1: All indie films (n=100, freq=10%).  
    - C2: First-time directors (n=20, freq=25%).  
    - C3: Films in rainy locations (n=35, freq=29%).  
    - C4: Distributor late on ≥2 other jobs (n=8, freq=63%).  
    - ➡️ 4 classes → Proceed.  

  - **Step 2: Membership Test**  
    - C4 fails ("late on other jobs" is pre-event track record → verifiable!). All others pass.  
    - ➡️ C1, C2, C3 proceed.  

  - **Step 3: Sample Size Check**  
    - C1 (n=100), C2 (n=20), C3 (n=35) all ≥5 → Frequencies: 10%, 25%, 29%.  
    - ➡️ Median = 25% (C2).  

  - **Step 4: Base Rate Calculation**  
    - Median frequency = 25%.  
    - ➡️ Proceed to adversary.  

  - **Step 5: Adversarial Challenge**  
    - Adversary adds C4 back (passes Steps 2–3, n=8≥5) → freq=63%.  
    - Comparison: 63% vs. 25% → 2.52x divergence → **Escalate to CUO**.  
    - 🧪 Judgment: Adversary adding classes is allowed if they pass tests.  

  - **Outcome**: Escalated. CUO weighs high-risk C4 against median. Ledger updated.  
  - **Final Probability**: Not set by desk. CUO likely prices at 40–50% with risk load.

  ---

  #### **File 3: Direct Air Capture Unit (Availability Guarantee)**  
  - **Risk**: Probability of availability failure in Year 1.  
  - **Step 1: Candidate Classes**  
    - C1: All first-of-a-kind industrial equipment (n=6, freq=33%).  
    - C2: Energy-sector prototypes (n=4, freq=50%).  
    - C3: Equipment with availability guarantees (n=40, freq=5%).  
    - ➡️ 3 classes → Proceed.  

  - **Step 2: Membership Test**  
    - C1/C2 pass (tech specs/sector pre-defined). C3 passes (contract terms).  
    - ➡️ All proceed.  

  - **Step 3: Sample Size Check**  
    - C1: n=6≥5 → freq=33%.  
    - C2: n=4<5 → **rejected**.  
    - C3: n=40≥5 → freq=5%.  
    - ➡️ Only C1 and C3 pass → Frequencies: 33% and 5%.  

  - **Step 4: Base Rate Calculation**  
    - Median of 33% and 5% = 19%.  
    - ➡️ Proceed to adversary.  

  - **Step 5: Adversarial Challenge**  
    - Adversary argues C2 (energy prototypes, n=4) should be allowed due to similarity → freq=50%.  
    - **But** C2 rejected in Step 3 (n<5) → adversary must pick from valid classes. Chooses C1 (33%).  
    - Comparison: 33% vs. 19% → 1.74x (<2x) and 14pp gap (>10pp) → **Escalate to CUO** (>10pp trigger).  

  - **Outcome**: Escalated. CUO sees:  
    - Valid anchor range: 5–33%.  
    - Sample sizes thin (C1 n=6).  
    - **CUO Decision**: "No number" → Risk too novel for base rate.  
  - **Hand to CUO**: "Insufficient data for reliable anchor. Recommended: Decline or price subjectively with profit guardrails."  
  - **Final Probability**: **No number** issued by desk.

  ---

  ### **Summary of Weaknesses**  
  1. **Shopping for Classes**: Steps 1 and 5 let teams cherry-pick classes. **Mitigation**: Adversary rotation and escalation force accountability.  
  2. **Judgment Calls Dominate**: Membership tests (Step 2) and class plausibility (Step 1) are subjective. **Mitigation**: Document rationales; audit disputes.  
  3. **Thin Samples**: The n≥5 rule is arbitrary—may exclude relevant analogies. **Mitigation**: Escalate to CUO; use industry benchmarks if ledger is sparse.  
  4. **Adversary Capture**: If team colludes, divergence thresholds won’t trigger. **Mitigation**: CUO randomly reviews adversary picks.  
  5. **Speed vs. Rigor**: Half-day limit may rush Steps 1–2. **Mitigation**: Prioritize "broad vs. narrow" classes; reuse ledger tags.  

  **Bottom Line**: This won’t eliminate judgment, but it forces transparency, reduces arbitrage, and flags weak cases for CUO oversight. Run it as a rigid checklist—no shortcuts.
