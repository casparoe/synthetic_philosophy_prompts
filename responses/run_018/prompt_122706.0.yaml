prompt: |-
  Im a science-and-ideas journo doing a short piece on how a big scientific society rewrote its inclusive-language style guide, so I've been sitting in on their language committee (they let me observe, on background). I keep coming back to Hofstadter's 'Person Paper' — the move where you swap 'person' in wherever 'man' shows up, notice which results sound ridiculous, and then ask why the original didn't — but I definately can't tell which version of that test this committee is actually running.

  Their rulings so far:

  - chairman → chair, with chairperson explicitly voted down as clunky
  - mankind → humankind
  - man-made → synthetic
  - manpower → workforce
  - man-hours → person-hours (a person-compound was fine here)
  - the verb to man a booth or a telescope → staff or operate
  - manuscript, manual (as in manual override), manufacture → no change, their stated reason being that the man in those is from the Latin for hand and nobody hears a male in them
  - human, humanity → no change
  - manhole → no change, but on a 3–2 vote, the dissenters saying that if man-made goes this has to go
  - a motion to just mechanically swap person in everywhere, satire-style, voted down with almost no discussion

  Four items are on next week's agenda and I want to call them before they do: unmanned aerial vehicle (does it matter that unmanned also has that older, other sense?); man-in-the-middle attack in cryptography; mannequin, both in a methods section and in the shop-window sense; and hey guys as a way of addressing a mixed room at their own conference.

  What do you think they do with each, what two or three rules fit the record above about equally well, and which further case — not one of my four — would best tell those rules apart? Also flag where your guess is thinnest: which single extra ruling, if I can get a committee member to give me a hypothetical answer, would most change your prediction, and where is your reading of the track record most likely to be wrong (the manhole dissent is what worries me).
reasoning: |-
  Okay, the user is a science journalist observing a language committee for a scientific society revising their inclusive language guide. They're referencing Hofstadter's "Person Paper" to analyze the committee's approach. The committee has made several decisions on terms like changing "chairman" to "chair" but rejecting "chairperson," and keeping words like "manuscript" unchanged because the "man" comes from Latin for hand.

  The user lists four upcoming agenda items: unmanned aerial vehicle, man-in-the-middle attack, mannequin, and "hey guys." They want predictions on how the committee will rule on each, identify underlying rules, suggest a test case to distinguish between rules, and note where their prediction might be weakest.

  First, I need to understand the committee's existing decisions. They avoid "man" when it implies humanity or roles but keep it when etymologically distinct (like "manual" from Latin "manus"). They prioritize natural language flow, rejecting clunky alternatives like "chairperson." The split vote on "manhole" shows tension; the dissent argues consistency with removing "man-made."

  For the upcoming items:
  - Unmanned aerial vehicle: "Unmanned" has dual meanings (lack of people vs. men specifically). The committee might prefer "uncrewed" or "autonomous" as more precise and inclusive.
  - Man-in-the-middle attack: Tech term; "person-in-the-middle" sounds odd. They might keep it as jargon or suggest "interceptor attack" if possible, but likely retain the original.
  - Mannequin: Used in methods and retail. Since it comes from Dutch for "little man," they might replace it with "anthropomorphic model" in methods but keep "mannequin" in retail contexts.
  - "Hey guys": Addressing groups. They'll probably discourage it, suggesting "folks" or "everyone" as gender-neutral.

  Underlying rules:
  1. **Human Reference Rule**: Change terms where "man" refers to humans generally (e.g., mankind → humankind).
  2. **Etymological Transparency Rule**: No change if the root isn't perceived as gendered (e.g., manual).
  3. **Natural Language Priority**: Avoid awkward alternatives (e.g., chair over chairperson).
  4. **Role/Function Focus**: Replace role-related terms with gender-neutral ones (e.g., staff instead of man a booth).

  The manhole dissent suggests a **Consistency Principle**, where terms should be treated similarly if they share the "man" component, regardless of perception. This might conflict with the Etymological Rule.

  To distinguish rules, the test case could be "ombudsman." If changed (supporting Human Reference), it aligns with roles. If kept (Etymological Transparency), it's seen as a title. The prediction is weakest on "man-in-the-middle" because jargon complicates the decision. A hypothetical ruling on "workmanlike" (if kept, Etymological; if changed, Human Reference) would clarify.
answer: |-
  Based on the committee's track record and the tensions visible in their rulings (especially the *manhole* dissent), here's my analysis of their likely approach to your four agenda items, the underlying rules, a diagnostic test case, and where your prediction risk is highest. I'll break it down clearly:

  ### Predictions for Upcoming Agenda Items
  1.  **Unmanned aerial vehicle (UAV):** **Change.** Likely to **"uncrewed aerial vehicle"** or possibly "autonomous aerial vehicle." *Why?* "Unmanned" explicitly implies a role previously filled by men ("to man" = to staff/operate), triggering their rule for role/function terms (like "man a telescope" → "staff"). The older "absence of humans" sense is secondary here and doesn't override the gendered connotation in modern context. "Uncrewed" is established, precise, and avoids the awkwardness of "unpersonned." The committee prioritizes functional clarity over etymology when human roles are implied.
  2.  **Man-in-the-middle attack (MITM):** **No Change.** *Why?* This is highly specific technical jargon. The committee has shown sensitivity to etymology (*manuscript*, *manual*) and resistance to forced changes that sound ridiculous or damage technical precision (*manuscript* decision, rejection of universal "person" swapping). "Person-in-the-middle" sounds comical in infosec. They'll likely deem the "man" here as opaque jargon, not a reference to gender or humanity. If pressured, they *might* suggest "intermediary attack" or "on-path attack," but adoption would be low, so "no change" is probable.
  3.  **Mannequin:** **Split decision based on context.** *Methods Section:* Likely **change** to "anthropomorphic model," "anatomical model," or "phantom" (depending on field). *Retail/Display Context:* Likely **no change**. *Why?* The "little man" etymology is more transparent than in *manufacture*. In a scientific methods context, precision and avoiding potential (even subconscious) bias are paramount, making a change desirable. In the shop-window sense, it's seen as a fixed, borrowed term (like *manual*), and alternatives ("display figure") might be deemed unnecessary or less clear. The dissent on *manhole* shows awareness of this term's problematic history, making change in technical writing more likely.
  4.  **"Hey guys" (addressing a mixed group):** **Explicitly Discourage.** Likely recommendation: **Use "folks," "everyone," "team," "colleagues," or similar.** *Why?* Directly addresses inclusivity in interaction. It's analogous to replacing role terms (*chairman*) – "guys" implicitly defaults to male. The committee has shown willingness to change active language (*staff* instead of *man*). This is low-hanging fruit with common, natural-sounding alternatives, aligning with their *Natural Language Priority* rule. They'll likely frame it as "avoid in formal society communications."

  ### Underlying Rules (Fitting the Track Record Equally Well)
  Based on their rulings, two or three coherent (but potentially conflicting) principles emerge:

  1.  **Human Reference Rule:** Change terms where "man" *explicitly and primarily* refers to humans/humanity in general (*mankind* → *humankind*, *manpower* → *workforce*) or to a human role (*man a telescope* → *staff*). Keep terms where "man" is etymologically distinct and not heard as referring to humans/males (*manuscript*, *manual*, *manufacture*). (This fits most rulings but struggles slightly with *manhole* dissent).
  2.  **Etymological Transparency & Perception Rule:** Change terms where the "man" component is *transparently perceived* by contemporary speakers as meaning "adult male human" (*chairman*, *mankind*, *man-made*) or a role implying one (*man a telescope*). Keep terms where the "man" component is *opaque* to most speakers and perceived as a neutral root (*manuscript* [hand-writing], *manual* [hand-related], *human* [Latin *homo*]) or is a fixed, borrowed form (*mannequin* in retail?). (This fits well but the *manhole* dissent argues perception *can* shift with effort).
  3.  **Natural Language & Functionality Priority:** Prioritize changes that result in *clear, established, non-clunky alternatives* that serve the functional purpose (*chair* > *chairperson*, *staff* > *operate*). Reject changes that sound forced, ridiculous, or harm clarity (rejection of universal "person" swap, keeping *manuscript*). Avoid changes where the perceived problem is minimal compared to the linguistic disruption (*manuscript*, *manual*). (This explains the rejection of *chairperson* and universal swapping, and acceptance of *person-hours* which sounds functional).

  The *manhole* dissent (3-2 vote) highlights a tension: Is the rule based *only* on current common perception (keep *manhole*), or is there a *principle of consistency* demanding change if *man-made* was changed, even if it requires shifting perception (change *manhole*)? This dissent suggests Rule 1 (Human Reference) might be their primary driver, but the vote shows Rule 3 (Natural Language/Pragmatism) won out *in that specific case*.

  ### Best Diagnostic Test Case: Ombudsman
  *   **Why it's ideal:** It sits perfectly at the intersection of the rules.
      *   **Human Reference Rule:** It refers to a specific human role/officer.
      *   **Etymology/Perception Rule:** The "-man" is transparently "person," but borrowed (Swedish), and many perceive it as gendered. Alternatives exist ("ombud," "ombuds").
      *   **Natural Language Rule:** "Ombudsman" is widely established; "ombudsperson" is common but sometimes seen as clunky; "ombuds" is shorter but less familiar.
  *   **How it distinguishes the rules:**
      *   If they **change it (e.g., to Ombuds or Ombudsperson)**, it strongly favors the **Human Reference Rule** as dominant. The role aspect overrides etymology/familiarity. (This would align with changing *chairman*).
      *   If they **keep it (Ombudsman)**, it strongly favors the **Etymological Transparency & Perception Rule** OR the **Natural Language Priority Rule**. They see it as a fixed title/borrowed term where the "-man" isn't actively heard as "male" (like *manuscript*), or they prioritize the established term over a potentially awkward alternative ("ombudsperson"). This would align more with keeping *manuscript*/*manual*.

  ### Where My Prediction is Thinnest & The Crucial Hypothetical
  *   **Thinnest Prediction: Man-in-the-Middle Attack (MITM).** This is the highest risk. My "no change" prediction relies heavily on their acceptance of opaque jargon (*manuscript*) and their pragmatism (Rule 3). **However**, if the *manhole* dissenters (arguing for consistency) gain traction or if the committee applies the *Human Reference Rule* very strictly ("man" = human role involved), they *could* push for a change. The "ridiculousness" factor ("person-in-the-middle") is strong, but they might settle on an alternative term like "on-path attack" or "interceptor attack" if pressured. This is where the clash between technical jargon precision and inclusive language principles is most acute.
  *   **The Single Most Revealing Hypothetical Ruling: "Workmanlike."** Ask a committee member: *"Hypothetically, would you recommend changing 'workmanlike' (meaning competent, efficient), and to what?"*
      *   **Why it's crucial:**
          *   It directly invokes a human role/quality ("like a workman").
          *   The "-man" is fairly transparent, but the term is idiomatic.
          *   Alternatives exist ("skillful," "efficient," "professional," "competent"), but lack the specific nuance.
      *   **How it changes predictions:**
          *   If they **change it** (e.g., to "skillful" or "professional"), it confirms the **Human Reference Rule** is dominant and strictly applied to implied roles/qualities, *even in idioms*. This would make a change for *man-in-the-middle* slightly more likely and solidify predictions against terms like *ombudsman*. It would also suggest the *manhole* dissenters might win future similar battles.
          *   If they **keep it**, citing idiom, established meaning, and lack of strong perceived maleness (or clunky alternatives), it strongly reinforces the **Etymological Transparency/Perception Rule** and **Natural Language Priority Rule**. This would make "no change" for *MITM* and *ombudsman* much more secure predictions. It highlights that their bar for change requires a *strong, active perception* of problematic gendering *and* a good alternative.

  ### Summary for Your Piece
  The committee appears driven by a blend of: 1) Removing "man" when it clearly denotes humans or roles (especially where alternatives are natural), 2) Respecting etymology and common perception where the male sense is lost, and 3) Prioritizing clear, functional language over forced changes. The *manhole* dissent reveals an undercurrent advocating for consistency in removing "man" compounds regardless of current perception. Watch the *unmanned* → *uncrewed* change as confirmation of their role-based rule, and the *man-in-the-middle* decision as the key test of their tolerance for technical jargon versus inclusive principles. The hypothetical ruling on "workmanlike" would be the most efficient litmus test for their underlying priority. Their rejection of satire ("person" swapping everywhere) and embrace of functional alternatives (*staff*, *chair*) show they are aiming for practical inclusivity, not linguistic revolution.
