  ## The Moral Mirror Crack'd: Plutarch, Biography, and the Illusion of Ethical Calibration

  The notion that poring over the lives of the great (or the notorious) can hone our moral compass is an ancient and seductive one. Plutarch, with his *Parallel Lives*, stands as the grand architect of this proposition. By placing a Greek alongside a Roman – an Alexander beside a Caesar, a Demetrius beside an Antony – he purported to offer not just history, but a kind of ethical gymnasium. The reader, observing virtues and vices enacted on the grand stage, would supposedly calibrate their own judgement, learning through emulation and avoidance. Yet, your scepticism is profoundly warranted. Does biography truly refine moral reasoning, or is it, as you shrewdly suggest, often "hagiography with better marketing," a selection-biased narrative designed less to challenge than to flatter the reader’s sense of having undertaken serious epistemic labour? The answer, frustratingly, lies somewhere in the murky middle, demanding we dissect Plutarch’s method, the hagiography critique, and their eerie echo in modern "effective" parables.

  **Plutarch's Imitation: The Engine Room of Moral Improvement?**
  Plutarch’s core mechanism was *mimesis* – imitation. He explicitly states his aim is not chronicling events, but revealing character: "For I am writing not histories, but lives... a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall." By juxtaposing figures like the dissolute, ambitious Demetrius Poliorcetes with the similarly flawed but perhaps grander Mark Antony, Plutarch believed the reader could engage in comparative moral analysis. Seeing Antony’s initial potential corrupted by vice, or Demetrius’s fleeting triumphs undone by hubris, was meant to illustrate universal principles – the dangers of *pleonexia* (greed), the fragility of fortune, the importance of *phronesis* (practical wisdom). The act of comparison itself was the calibration tool; holding two lives side-by-side would, theoretically, sharpen the reader’s ability to discern true virtue from its gilded counterfeit. The implicit promise: absorb these lessons, imitate the good, shun the bad, and become ethically better.

  **The Hagiography Critique: Selection Bias and Narrative Gloss**
  This noble aim, however, crashes against the rocks of inherent bias. Biography, by its very nature, is **profoundly selective**. Plutarch didn’t choose obscure, moderately virtuous farmers; he chose kings, generals, statesmen – figures already amplified by history, whose lives are inherently exceptional and often morally ambiguous. His selection criteria were dictated by fame and perceived significance for his Greco-Roman audience, not by a randomised sampling of ethical archetypes. This creates an immediate **reference class problem**: can lessons drawn from the lives of demi-gods and tyrants truly calibrate judgement for the everyday moral quandaries of ordinary people?

  Furthermore, the **narrative imperative** takes hold. To make a life coherent and compelling, biographers (even Plutarch, despite his avowals) inevitably shape events, emphasise certain traits, downplay others, and impose a causal structure that real life often lacks. The messy complexity of motivation, the role of sheer contingency, the influence of systemic forces – these are often smoothed over to create a clearer moral arc. This easily slips into **hagiography**, not necessarily by painting subjects as saints, but by presenting their struggles and choices within a framework that *flatters the reader’s desire for moral clarity*. We see Demetrius's failings *so clearly*, we tut at Antony’s self-destruction – and this very act of judgement fosters the illusion of our own superior discernment. The biography becomes less a tool for difficult self-examination and more a confirmation of our existing (perhaps unearned) sense of moral acuity. We feel we’ve done the work, recognised virtue and vice, without necessarily confronting the ambiguity within ourselves or the vastly different contexts that shaped those historical choices.

  **Modern Echoes: The Effective Altruism Case Study Conundrum**
  The resonance with modern Effective Altruism (EA) case studies is uncanny and deeply pertinent to your query. EA often utilises historical or contemporary examples – the founding of the NHS, the abolition movement, specific interventions by organisations like the Against Malaria Foundation – as pedagogical tools. The aim is similar to Plutarch’s: calibrate judgement about doing good. By analysing past successes and failures, EAs hope to learn what interventions truly maximise utility.

  Yet, they often fall prey to the **exact same failings**:
  1.  **Extreme Selection Bias:** Case studies focus overwhelmingly on *successes* or clear-cut failures. We study the triumphant abolitionists, not the myriad failed reform movements. We analyse GiveWell's top charities, not the thousands of less quantifiable or less successful interventions that might offer different, messier lessons. This creates a skewed reference class, suggesting "effectiveness" is more easily identifiable and replicable than it truly is.
  2.  **Narrative Gloss & Hindsight Bias:** Complex historical events (like abolition) are reduced to streamlined narratives highlighting specific tactics or principles deemed "effective," often ignoring crucial contextual factors, unintended consequences, or the role of sheer luck. The messy, contingent path to success is sanitised into a replicable blueprint.
  3.  **Flattering the Reader/EA Paradigm:** These curated case studies often serve to validate the core EA framework – quantification, scale, evidence-based prioritisation. Analysing them successfully (i.e., drawing the "correct" EA-aligned lessons) reinforces the reader's sense of belonging to a rational, effective in-group, much like Plutarch’s reader might feel part of a wise, virtue-appreciating elite. The labour feels epistemic, but the outcome can be confirmation bias dressed as calibration.

  **Conclusion: The Cracked Mirror Offers Glimpses, Not Blueprints**

  So, does biography – ancient or modern – genuinely make you *better*? The blunt answer is: **not reliably, and certainly not automatically.** Plutarch’s grand project of moral calibration through imitation is fundamentally undermined by the inherent selection bias and narrative construction inherent in the biographical form. The hagiographic impulse – to present lives as clearer, more morally legible, and more imitable than they were – is a constant gravitational pull, flattering the reader’s sense of judgement rather than rigorously challenging it. Modern EA case studies, despite their quantitative aspirations, often replicate this flaw, creating a curated gallery of "effective" actions that risks fostering overconfidence and neglecting context.

  However, to declare biography entirely useless for moral reasoning would be an overcorrection. Its value lies not in providing templates for imitation or cleanly calibrating judgement like a statistical reference class, but in **offering profound context, complexity, and caution**.
  *   **Context:** Lives reveal how virtue and vice are enacted within specific historical, social, and psychological constraints, challenging simplistic moralising.
  *   **Complexity:** They expose the entanglement of motives, the role of fortune, the tragic potential of flaws coexisting with greatness (and vice versa) – fostering humility about clean moral judgements.
  *   **Caution:** Figures like Demetrius or Antony serve not as models to copy or avoid wholesale, but as vivid *memento mori* of ambition’s perils, the corrupting influence of power, and the fragility of character.

  Biography, then, doesn't *make* you better by providing answers. At its best, it **makes reasoning harder, richer, and more aware of its own limitations.** It doesn't calibrate your moral compass to true north with precision; instead, it shows you the stormy seas, the faulty instruments, and the wreckage of those who navigated poorly. The genuine epistemic labour isn't in passively absorbing the "lesson" of a life, but in actively wrestling with its irreducible complexity, confronting the biases in the telling *and* in your own reception of it, and recognising that while the mirror is cracked, the act of looking – critically, sceptically, humbly – is itself a vital, if imperfect, part of the moral journey. You won't find a calibration curve, but you might just gain a deeper, more unsettling, and ultimately more useful awareness of the turbulent landscape of human ethics. The feeling of having done the labour is often illusory; the real work begins when you question the very mirror you’ve been handed.
