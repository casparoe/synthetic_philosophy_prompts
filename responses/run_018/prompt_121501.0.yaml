answer: |-
  ### Final Examination Question:  
  **PHIL 405 Philosophy of Mind (Advanced)**  
  **Time Allowed: 90 Minutes**  

  > **Functionalism claims that mental states are individuated purely by their causal-functional roles within a cognitive system, and that these roles can be multiply realised in physically diverse substrates. However, attempts to specify these roles with sufficient precision to exclude pathological realisers (e.g., systems that produce appropriate macro-level behavioural outputs but lack coherent micro-level causal structure) appear to require fixing a privileged level of functional abstraction.  
  Evaluate whether functionalism can consistently maintain both (a) the substrate-independence implied by multiple realizability, and (b) a purely functional criterion for mental-state individuation that rules out pathological cases. Does resolving this tension inevitably either smuggle in substrate-dependent constraints or render functional descriptions empirically vacuous? In your answer, explain why appeals to ‘normal realisation conditions’ fail to avoid circularity.**

  ---

  ### Model Answer (Approx. 1000 words)  

  Functionalism faces a critical tension between its commitment to multiple realizability (MR) and its core thesis that mental states are individuated *purely* by functional roles. This tension arises from the **level-individuation problem**: specifying functional roles precisely enough to exclude pathological realisers (e.g., Searle’s "Chinese Room", a cosmic accident mimicking human behaviour via uncorrelated micro-events) seems to demand fixing a "privileged level" of functional abstraction. I argue that functionalism can resolve this dilemma only by embracing a moderately constrained notion of functional abstraction, but this risks compromising MR’s radical substrate-neutrality.  

  **First Horn: The Threat of Substrate-Dependence**  
  To exclude pathological cases, functionalists must define roles with sufficient granularity to capture internal causal coherence. For instance, pain’s functional role cannot be reduced to mere pain-behaviour outputs; it must include mediating connections to stimuli, other mental states (e.g., distress), and actions. However, specifying *how* these connections must be structured internally—e.g., requiring discrete sub-processes for "attention modulation" or "memory integration"—risks presupposing a specific physical or computational architecture. If we demand that realisers exhibit *neurologically plausible* causal pathways, MR is undermined. Even if constraints are framed computationally (e.g., "parallel processing"), this may covertly favour silicon over, say, quantum or exotic biological systems. Consequently, functionalism either tolerates pathologies (undermining its empirical adequacy) or becomes substrate-sensitive (contradicting MR).  

  **Second Horn: Empirical Vacuity via Over-Abstraction**  
  Alternatively, functionalists might define roles at a high level of abstraction (e.g., "any system mapping inputs to outputs via internal state transitions"). While this preserves MR, it cannot distinguish genuine cognition from sophisticated but non-cognitive simulations. Putnam’s "Humorous Automaton" (a lookup table outputting laughter at all jokes) replicates macro-behaviour but lacks appropriate micro-causal dynamics. At extreme abstraction, *any* input-output equivalent system (including a magic-seeming "Cosmic Accident" mimicking human behaviour) qualifies as having mental states. This divorces functionalism from scientific psychology, which relies on causally structured mechanisms. Individuating mental states becomes trivialised: "belief" reduces to whatever correlates with certain outputs, regardless of internal structure.  

  **The Circularity of ‘Normal Realisation’**  
  Appealing to "typical" or "species-normal" realisation conditions (e.g., Fodor) fails to resolve this. Defining "normal" requires prior knowledge of which systems *genuinely* instantiate mental states—precisely what functionalism aims to determine without circularity. If we stipulate human neurobiology as normal, MR is abandoned. If "normal" is defined functionally, we return to the original problem: what counts as a valid realisation of *that* functional description? This regress reinforces the need for non-arbitrary constraints.  

  **Resolution: Embracing Moderate Abstraction with Causal Constraints**  
  The solution lies in rejecting the false dilemma by **supplementing functionalism with a weak causal coherence constraint**. Mental states are individuated by functional roles *plus* the requirement that realisers exhibit non-accidental, counterfactual-supporting causal regularities at *some* level of organisation. This excludes pathologies: the Chinese Room lacks systematic sub-personal transitions supporting linguistic understanding; the Cosmic Accident has no stable causal architecture. Crucially, this constraint is *not* substrate-specific: diverse physical systems (carbon, silicon, etc.) can satisfy it if they possess appropriate dynamical complexity.  

  However, this resolution succeeds only partially. While it preserves MR in principle, it implicitly privileges certain *kinds* of causal organisation (e.g., modular, hierarchical, or feedback-driven processes) over others. This risks favouring familiar computational models, potentially excluding novel realisations (e.g., distributed swarm systems). Moreover, functionalism’s claim to *purely* functional individuation is weakened: causal coherence is a meta-constraint on realisers, not part of the functional role itself. Yet this trade-off is necessary. Without such constraints, functionalism cannot underwrite cognitive science’s explanatory practices, which target mechanisms, not mere input-output correlations.  

  **Token vs. Type Implications**  
  This problem affects both token- and type-functionalism. Token-functionalists must explain why two systems with identical behaviours but divergent micro-causal structures (e.g., a human and a lookup-table android) do not share identical mental states *despite* functional equivalence at the macro-level. Type-functionalists face the challenge of defining role-types finely enough to exclude pathologies without collapsing into substrate-types. Both require acknowledging that functional roles must be specified at a grain that captures causally significant sub-processes.  

  In conclusion, functionalism can avoid the horns of the dilemma by incorporating a minimal causal coherence requirement. This saves it from vacuity and pathology while permitting robust MR. However, it concedes that purely functional individuation is insufficient, tacitly relying on a metaphysically grounded notion of causation. While this refined functionalism remains viable, its victory is qualified: MR survives, but only for systems meeting organisational constraints that may, in practice, limit its scope.  

  ---

  ### Marking Scheme (Total: 20 Marks)  

  | **Criterion**                                                                                                | **Marks Available** | **Typical Errors Leading to Mark Deductions**                                                                 |
  |-------------------------------------------------------------------------------------------------------------|---------------------|-------------------------------------------------------------------------------------------------------------|
  | **1. Diagnoses the tension as a dilemma about *individuation* (not merely describing functionalism/MR separately)** | 5                   | Treating the problem as two unrelated issues (e.g., "MR has problems, functionalism has problems"); failing to articulate how exclusion of pathologies requires level-fixing. |
  | **2. Explicitly engages the circularity of ‘normal realisation’ appeals**                                  | 4                   | Mentioning circularity without explaining *why* it arises (e.g., "appeals to normalcy are circular" with no linkage to functional criteria).                                |
  | **3. Offers a substantive, argued resolution (not deferring to empirical vagueness)**                     | 5                   | Concluding vaguely that "future science will decide"; proposing an undeveloped or non-functional solution (e.g., "add qualia").             |
  | **4. Addresses implications for both token- and type-functionalism**                                       | 3                   | Discussing only one form of functionalism; conflating token/type distinctions.                                                                 |
  | **5. Avoids the misconception that MR entails behavioural equivalence → mental equivalence**               | 3                   | Stating or implying that *any* behaviourally identical system must share mental states (e.g., ignoring internal-structure requirements).      |

  **Grade Boundaries:**  
  - **A (17–20):** Meets all 5 criteria with clarity, precision, and minimal errors.  
  - **B (13–16):** Addresses core dilemma but omits/mishandles 1–2 criteria (e.g., notes circularity but doesn’t explain it; resolves dilemma weakly).  
  - **C (10–12):** Superficial treatment of dilemma; significant omissions (e.g., ignores token/type distinction; misrepresents MR).  
  - **D (7–9):** Describes functionalism/MR without engaging the specified tension.  
  - **F (0–6):** Fundamental misunderstandings or irrelevance.  

  ---  
  *END OF DOCUMENT*
