prompt: |-
  hey, i'm putting together questions for a podcast Q&A with an unnamed philosopher — lets call her the interviewee — who's defending a modified self-indication view she calls "lineage-bound sampling." the basic idea is that when you do anthropic reasoning you shouldn't sample over all observer-moments in the multiverse, but only over those embedded in a continuous "epistemic lineage" with shared conceptual tools. she thinks this dodges Bostrom's presumptuous philosopher problem because disagreement between lineages doesn't count as counter-evidence; it's just cross-lineage noise. she also thinks it gives multiverse theories a leg up since they can predict huge numbers of observers as long as they're clustered inside compatible lineages.

  i need like 5-6 actual interview questions, not fluff. they should press where the literature actually presses: anticipate her reply that lineage boundaries are vague, and include the follow-up about what happens when a lineage fractures or dies out. also ask what empirical or conceptual difference this makes compared to plain self-sampling with a weighting function, because right now it sounds like she's just renamed regular sampling. and please, if my framing of Bostrom's objection is off, or if this task is confused because her view just collapses into something already in the literature, tell me straight — don't just go along with it politely. no reading lists or citations, i don't need them.
