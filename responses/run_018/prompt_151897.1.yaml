  ## Reconceiving Inheritance Taxation: A Dynastic Opportunity-Cost Framework

  **The Core Thesis (approx. 150 words)**

  Conventional inheritance taxation is flawed, framed as a levy on wealth transfer itself. This misidentifies the core moral harm. The true societal injury inflicted by large, dynastic wealth transfers is not the mere accumulation within a family line, but the measurable *contraction of social mobility* they cause. Capital locked within dynastic networks reduces economic dynamism and opportunity for non-heirs. We should reconceive inheritance tax as a system of **dynastic opportunity-cost adjustments**. Its primary purpose would be to internalize the negative externality imposed when dynastic retention reduces the "intergenerational elasticity of opportunity" – the ease with which children born into lower strata can rise. Tax liability should be calibrated not simply to estate *size*, but to the *estimated marginal reduction in mobility elasticity* caused by retaining that specific capital within the dynasty, assessed progressively.

  **The Argument from Mobility Elasticity (approx. 250 words)**

  Large, concentrated inheritances solidify dynastic advantages, creating significant barriers to entry and diminishing opportunities for those outside the privileged network. This manifests as reduced "intergenerational elasticity of opportunity" – a metric quantifying how strongly an individual's economic outcome is predetermined by their parents' status. When vast capital is retained dynastically, it:
  1.  **Distorts Markets:** Dynastic wealth enables preferential access to elite education, networks, seed capital, and asset acquisition, crowding out non-heirs and inflating costs.
  2.  **Creates Rent-Seeking:** Concentrated, inherited capital fosters power to shape rules (e.g., favorable tax policies, regulations) that further entrench advantage and stifle competition.
  3.  **Reduces Capital Allocation Efficiency:** Capital tied to lineage rather than merit or innovation potential leads to suboptimal investment, hindering overall economic growth and the creation of new opportunities.
  Empirical evidence consistently links high wealth concentration with lower social mobility. By focusing on the *mobility elasticity reduction* caused by an estate's retention within a dynasty, the tax system directly targets the measurable social harm. A progressive schedule emerges naturally: the first few million bequeathed may have minimal impact on aggregate mobility, but vast inheritances demonstrably shrink the opportunity pool for others. The tax liability would be calculated based on sophisticated models estimating how retaining $X within Dynasty Y reduces mobility elasticity across the cohort, demanding a larger adjustment for estates causing disproportionate contraction.

  **First Objection and Reply (approx. 200 words)**

  *   **Objection:** Tying tax liability to contingent sociological correlations (mobility elasticity reduction) violates the principle that moral obligations and legal liability should track *intrinsic wrongs* (like theft or fraud), not merely contingent external effects. Taxation based on predicted societal outcomes is arbitrary and lacks a clear moral foundation in the actions of the testator or heir.
  *   **Reply:** This objection misidentifies the nature of the wrong. The intrinsic moral failing inherent in large-scale dynastic wealth retention *is* the externalization of opportunity costs onto strangers. Retaining capital exclusively within a dynasty isn't a neutral act; it actively monopolizes resources and leverages them to restrict access and opportunity for others within the shared economic system. This monopolization and its resultant suppression of mobility is the core intrinsic harm. The "sociological correlation" (mobility elasticity reduction) is the measurable *manifestation* of this harm, not a separate contingent effect. The tax liability directly corresponds to the scale of this externalized cost – the quantified reduction in others' life chances – thereby internalizing the intrinsic wrong. It targets the harm *caused*, not merely the act of transferring wealth.

  **Second Objection and Reply (approx. 200 words)**

  *   **Objection:** Framing inheritance as creating an "opportunity-cost externality" dissolves the crucial boundary between private testamentary freedom (the right to dispose of one's property) and collective welfare optimization. This turns bequests into merely a social resource subject to technocratic calculation, undermining legitimate property and bequest rights.
  *   **Reply:** This framework does *not* dissolve the boundary; it redefines its basis in corrective justice. The state is not claiming ownership of the estate for redistribution based on social welfare alone. Instead, the opportunity-cost adjustment acts as a *corrective levy* for the harm *caused* by the dynastic retention decision. Individuals retain the fundamental right to bequeath their wealth. However, just as one has the right to drive a car but must pay for the pollution (an externality) it causes, the testator (or the estate) pays for the quantified mobility cost their specific bequest decision imposes on society. The tax compensates society for the harm done by the choice to lock that capital away dynastically. The right to bequeath remains intact, but the exercise of that right carries a cost for the quantifiable damage it inflicts on the opportunity structure.

  **Bottom Line (approx. 100 words)**

  Reconceiving inheritance tax as a dynastic opportunity-cost adjustment reframes it from an arbitrary wealth transfer levy into a targeted, evidence-based tool for correcting a specific social harm: the suppression of mobility caused by concentrated, intergenerationally locked capital. Calibrating liability to the estimated marginal reduction in mobility elasticity ensures the tax burden aligns proportionally with the actual harm inflicted. By grounding the tax in the logic of internalizing externalities and corrective justice, this approach preserves testamentary freedom while providing a robust, non-arbitrary moral and economic justification for progressive taxation on large estates, ultimately fostering a fairer and more dynamic society.
