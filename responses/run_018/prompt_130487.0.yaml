  The chief's worry isn't just technophobia; it's about the foundational principles of medical ethics: autonomy, justice, beneficence, non-maleficence. Without transparency, informed consent is compromised. How can patients consent to a treatment if even the doctors can't explain the reasoning? Also, legal liability is a real concern. If an adverse event occurs, the hospital could face lawsuits if they can't justify the protocol.

