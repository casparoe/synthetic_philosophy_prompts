answer: |-
  Your description captures a profound and under-discussed pathology in model-building, where a **methodologically necessary idealization evolves into a constitutive fiction through path-dependent patching**. While no universally accepted term exists, this phenomenon intersects several established concepts in philosophy of science. Here's a synthesis:

  ### Core Concepts & Near-Matches:
  1. **Lakatosian "Degenerating Research Programme" (Imre Lakatos)**  
     Your lifecycle aligns with Lakatos' framework:  
     - **Hard Core**: The false assumption becomes the untouchable "hard core"  
     - **Protective Belt**: Patches (adjustment coefficients, scope restrictions) form the "protective belt" shielding the core  
     - **Degeneracy**: Successive ad-hoc patches (non-progressive shifts) preserve the core without novel predictions  
     *Limitation*: Lakatos focuses on program trajectories, not the *architectural entanglement* of the core.

  2. **McMullin's "Constitutive Idealization" (Ernan McMullin)**  
     Contrasts with **heuristic idealizations** (temporary scaffolding) vs. **constitutive idealizations** (irremovable framework elements). Your case shows a *heuristic* idealization becoming *constitutive* through model evolution. McMullin noted this risk but didn't detail the patching mechanism.

  3. **"Tethering" (Batterman & Rice)**  
     Inexact representations may be "tethered" to reality via mathematical dependencies. Your corrective structures represent *pathological tethering*—where tethering preserves formalism at the cost of realism.

  ### Proposed Terminology:
  This specific migration path might be termed:  
  **Structural Entrenchment through Path-Dependent Patching (SEPP)**  
  or  
  **Constitutive Fiction Lock-in**

  ### Distinguishing from Similar Phenomena:
  | Feature                | SEPP (Your Case)                          | Ordinary Auxiliary Adjustments       | Institutional Inertia              |
  |------------------------|------------------------------------------|--------------------------------------|------------------------------------|
  | **Core Assumption Role** | Architecturally indispensable            | Replaceable/refinable                | Persists due to habit/tradition    |
  | **Patch Dependency**   | Patches *derived from* core's formal structure | Patches testable independently      | No substantive patches developed   |
  | **Rhetorical Stance**  | Persistent denial of core's significance | Open acknowledgment of limitations   | Unquestioned acceptance            |
  | **Failure Mode**       | Collapse if core removed                 | Gradual refinement possible          | Stagnation without systemic risk   |

  ### Boundary Cases Demonstrating Uniqueness:
  1. **Contrast: Newtonian Mechanics**  
     - *False core*: Absolute time/space  
     - *Patches*: Lorentz transformations (special relativity)  
     - *Difference*: Patches *replaced* the core without dependency—no lock-in occurred.  

  2. **Contrast: Rational Expectations in Macroeconomics**  
     - *False core*: Perfect information/optimization  
     - *Patches*: "Frictions" (Calvo pricing, adjustment costs)  
     - *SEPP Qualities*: Patches rely mathematically on optimization foundations; removing core voids the frictions' formal legitimacy.  

  3. **Non-Example: Epicycles in Ptolemaic Astronomy**  
     - Often mischaracterized as SEPP, but epicycles were *replaceable* auxiliary constructs (equivalent to Fourier series). The core (geocentrism) was falsifiable independently.

  ### Philosophical Implications:
  This lifecycle exposes a flaw in **predictive justification arguments** (e.g., Friedman's instrumentalism): When models succeed *because* patches are calibrated to false premises, predictions become self-reinforcing artifacts rather than reality-tracking tools. It creates a **formalist trap**—where mathematical elegance of the patched system overrides empirical adequacy.

  ### Key References:
  - Lakatos, I. (1970). *The Methodology of Scientific Research Programmes*  
  - McMullin, E. (1985). "Galilean Idealization" (*Studies in History and Philosophy of Science*)  
  - Batterman, R. & Rice, C. (2014). "Minimal Model Explanations" (*Philosophy of Science*)  
  - Grüne-Yanoff, T. (2009). "The Explanatory Potential of Artificial Societies" (*Synthese*) on parasitic models

  Your delineation reveals a critical failure mode distinct from mere conservatism: it's a **cascade of model-dependent corrections that genetically engineer dependency on a false premise**. Naming it would advance methodological critique—perhaps **"Path-Dependent Constitutiveness"** captures its essence.
