answer: |-
  Here is a reusable Parfit-inspired decision procedure for modular disruption cases, stripped of metaphysics, designed for speed and documentation:

  **Parfitian Modular Continuity Procedure (PMCP)**

  1.  **Question:** What specific psychological modules/capacities (e.g., episodic memory, moral reasoning, bodily awareness, language, future planning, core preferences) were functionally intact in the person *prior* to disruption (P), and which are intact *now* (N)? List distinctly.
      *   **Evidence:** Clinical assessments (neuropsych, behavioral obs.), documented pre-disruption preferences/wishes (advance directive, known values), functional capacity evaluations.
      *   **Sufficient Answer:** A clear list of P and N capacities, acknowledging uncertainty where it exists. **Terminate Negative:** If *no* capacities from P are functionally intact in N (global discontinuity), the directive likely does not bind a *new* entity. Handoff to legal/ethics re: new identity.

  2.  **Question:** Are the *currently intact capacities* (N) causally connected (via preserved brain tissue, prosthesis function, etc.) to the *corresponding capacities* present in the person at the time the directive/decision was made (D)?
      *   **Evidence:** Neurological data (imaging, implant logs), observed functional links (e.g., prosthetic memory encoding/recall pathways), expert testimony on causal mechanisms.
      *   **Sufficient Answer:** "Yes" (connection exists for key capacities) or "No" (no plausible causal link). **Terminate Negative:** If "No" for *all* capacities, see Step 1 termination. Proceed if "Yes" for *any* capacity.

  3.  **Question:** Is there evidence of *branching*? (e.g., multiple distinct entities/streams, each possessing some subset of P's capacities, emerging from the disruption).
      *   **Evidence:** Split-brain phenomena, distinct behavioral streams from integrated prosthetics, independent claims to identity/authority.
      *   **Sufficient Answer:** "No Branching" or "Branching Present (Specify Entities/Streams)". Proceed to Step 4 if "No Branching". **Handoff:** If "Branching Present", procedure **must hand decision to human judgment** (values, law). *Misfire Warning: Branching creates unresolvable normative conflicts for the procedure.*

  4.  **Question:** Considering *only* capacities central to the *specific decision* (e.g., for healthcare: understanding, reasoning, expressing values; for finances: planning, preference stability), is the *degree of relevant psychological connectedness* (overlap of P<->D and P<->N capacities for *this decision*) **sufficiently strong and broad**? (Threshold: >50% of key decision-relevant capacities present in both D and N, with causal links).
      *   **Evidence:** Lists from Steps 1 & 2, focused on decision-context. Define key capacities *for this decision* upfront.
      *   **Sufficient Answer:** "Yes" (Continuity >50%) or "No" (Continuity ≤50%). **Terminate Negative:** If "No", the directive likely does not bind N. **Handoff:** If borderline (≈50%) or capacities are conflicting/incommensurable, **handoff to human judgment**. *Misfire Warning: Mechanical thresholds may clash with deeply held family/patient views of identity or legal definitions of competence.*

  **Application:**

  *   **Case 1 (Episodic Memory/Autobiography Prosthetic):**
      *   Step 1: P capacities: All. N capacities: Moral reasoning, language, bodily awareness INTACT. Episodic memory/narrative PROSTHETIC.
      *   Step 2: Causal connection likely INTACT for moral, language, bodily via preserved tissue. Prosthetic memory has new causal pathway.
      *   Step 3: No branching.
      *   Step 4: *Decision:* Adherence to Advance Directive (requires understanding past values/identity). *Key Capacities:* Episodic memory/autobiographical narrative (CRITICAL). Moral reasoning (supportive). **Result:** Critical capacity (memory/narrative) is prosthetic (new causal path). Relevant connectedness likely ≤50%. **Mechanical Output: VOID Directive.** *Handoff/Conflict:* User's personal value judgment (preserving directive) overrides mechanics. *Misfire:* Highlights Step 4 threshold conflict with user's values.

  *   **Case 2 (Split-Brain):**
      *   Step 1: P capacities: All. Left Hemi (LH): Language, moral reasoning INTACT; Bodily awareness ABSENT. Right Hemi (RH): Bodily awareness, emotion INTACT; Language ABSENT.
      *   Step 2: Causal connection likely INTACT for each hemisphere's capacities via preserved tissue.
      *   Step 3: **Branching Present (LH Stream & RH Stream).** **Procedure Halts - Handoff to Judgment.** *Misfire:* Procedure cannot resolve competing claims to authority/identity; requires value-based weighting (e.g., which capacities define "personhood" for estate/medical decisions?) or legal determination of identity/gurdianship.
