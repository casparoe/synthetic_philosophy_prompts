  I have no academic background in mathematics or philosophy; I left school at eighteen and have been reading about probability on my own in the evenings. I am currently stuck on a passage in the introduction to J. Bertrand’s Calcul des probabilités. The copy I have is the 1907 second edition, which states that it conforms to the first edition of 1889, and the passage is from the opening section “LES LOIS DU HASARD.” I am copying the relevant French exactly as it appears in the scanned text (including what look like OCR errors, such as the caret and question marks):

  “Au jeu de passe-dix^ on jette trois dés et l'on gJsçgne si; la somme des points surpasse lo. Les chances sont égales ; les combinaisons qui passent ïo forment la moitié du nombre total. L'ami de Galilée, très familier avec les dés, s'étonnait de gagner par le point 1 1 plus souvent que par le point 12 et de voir sortir lo plus souvent que 9. Ces quatre points arrivent cependant chacun de six manières, et pas davantage. Pourquoi 12 est- il plus rare que 1 1 ? Faut- il nier Texpérience ou douter du calcul? Il faut les accorder en faisant mieux le compte. Les cas que l'on dénombre ne sont pas pareils; 4, 4? 4? par exemple, qui donne 12, n'est pas comparable à 4? 5, 2, qui donne 1 1 ; la première de ces combinaisons est unique, chacun des trois dés doit amener 4; 4, 5, 2, au contraire, représentent six combinaisons, par la même raison qu'avec trois lettres distinctes on peut écrire six mots différents. Attentif à tout circonstancier, Galilée, au lieu de six chances, en montre distinctement vingt-sept pour le point 1 1 , vingt-cinq seulement pour le point 12.”

  My own rough, non-expert paraphrase of what I think this is saying is: in a game with three dice, a gambler observed that even though the totals nine, ten, eleven, and twelve can each be produced by six different unordered combinations of the dice, in actual play ten and eleven come up more often than nine and twelve. Bertrand says this puzzle forces us either to deny experience or to doubt the calculation, and resolves it by saying that the cases being counted are not alike: a combination such as 4,4,4 (which sums to twelve) is unique because all three dice must show 4, whereas a combination such as 4,5,2 (which sums to eleven) corresponds to six distinct orders and so to six times as many throws. On this reading, Galileo is said to have recounted and found twenty-seven chances for eleven and only twenty-five for twelve.

  The part I would like help with is understanding the reasoning in this passage and how it connects to the principle of indifference and to Bertrand’s later chord paradox. My questions are these. First, what exactly does Bertrand mean by “les cas que l'on dénombre” in the sentence “Les cas que l'on dénombre ne sont pas pareils”? Does “cas” refer to the unordered combinations (the six ways of writing a sum), the ordered physical throws of the three dice, or some third thing? Second, why does he say the gambler’s observation creates a dilemma between denying experience and doubting the calculation, and how does the distinction between 4,4,4 and 4,5,2 dissolve that dilemma? Third, and most important to me: how does this dice example bear on the famous chord paradox later in the same book, where a chord drawn “at random” in a circle is said to have a probability of 1/3, 1/2, or 1/4 of being longer than the side of an inscribed equilateral triangle, depending on the method of selection? Is the lesson of the dice passage that we must always locate the true equiprobable cases (the ordered dice throws, which are fixed by the physics of fair dice), and that the chord paradox shows that for a continuous geometric setup there is no analogous physically privileged set, so the phrase “choose a chord at random” is irreparably ambiguous? Or is there a disanalogy I am missing — for example, that in the dice case there is a fact of the matter about which outcomes are equiprobable, whereas in the chord case the different methods are not a mistake about a hidden physical process but are simply different choices of a probability distribution? I have seen the three numerical answers to the chord problem stated many times online, so please do not just repeat them; I want to understand the argument in this specific passage and the precise way in which it does or does not prepare the reader for the paradox. Finally, if it is helpful, could you restate in your own words what general moral about randomness and the principle of indifference Bertrand wants the reader to take away from the dice story?

  I am not asking for citations, a bibliography, or a reading list, and please assume I have no access to anything beyond this passage and whatever you can explain from memory of the ideas themselves.
