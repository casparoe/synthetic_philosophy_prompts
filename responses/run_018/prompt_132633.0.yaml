  ## CommonsApp™ Quick-Start Guide (v3.7.2)

  **Welcome, Citizen-Leaser!** Your city is committed to Optimized Resource Allocation™ in our shared green spaces. CommonsApp™ leverages advanced algorithmic governance and distributed ledger technology to solve the persistent issue of park overuse by ensuring every ecological unit (commonly "grass") is dynamically valued and utilized. Forget inefficient communal access – embrace precision leasing.

  ### Getting Started
  1.  **Mandatory Enrollment:** Link your municipal CitizenID™ and preferred payment rail (fees apply per transaction layer). CommonsApp™ requires continuous geolocation, biometric verification (via CivicCam™ kiosks), and tiered data-sharing consent (Level 3 "Full Ecosystem Awareness" recommended for optimal bidding).
  2.  **Funding Your Wallet:** Deposit CityCoin™ or approved stablecoins. Minimum balance: 250 CC for Basic Tier access (covers 1-3 blade activation). Real-time conversion fees apply. Insufficient funds trigger mandatory micro-loans at prevailing Market Comfort Rates™ (37.8% APR).
  3.  **The Interface:** Open the app. The park is rendered as a high-resolution grid. Each pulsating hexagon represents one (1) blade of grass. Grey = unclaimed/available. Blue = leased by you. Red = leased by others (Premium subscribers see lessee CitizenID™ hashes).
  4.  **Securing Your Patch:**
      *   **Target Acquisition:** Tap a grey hexagon. The Current Bid Value (CBV) displays, dynamically calculated by our Overuse Prediction Engine™ (factors: sunlight angle, foot-traffic density projections, blade chlorophyll rating).
      *   **Place Bid:** Enter your maximum micro-lease bid (duration: 15-minute increments). Our Proprietary Fairness Algorithm™ ensures the highest bidder wins... fairly. *(Note: Algorithmic weighting favors frequent users and holders of Grass Futures Derivatives™).*
      *   **Activation:** Upon winning, the hexagon turns blue. You now possess exclusive, blockchain-verified usage rights to that precise blade. Proceed with confidence (within defined Pressure Limits™).

  ### Optimal Usage Protocols
  *   **Foot Placement:** Center your foot’s pressure centroid within your leased hexagon(s). Straddling blades triggers Boundary Violation Fees™ (charged per overlapping nanosecond).
  *   **Biomass Interaction:** Picnicking? Lease contiguous blades forming a 0.8m² minimum "Comfort Patch." Remember: blanket fibers constitute unauthorized biomass shielding – lease additional "Surface Interface Blades" beneath each corner.
  *   **Dynamic Events:** Sudden cloud cover? CBVs may plummet. Witnessing a rare bird? CBVs may spike 400%. Enable Auto-Bid Refresh™ to maintain your position during volatile ecological moments.

  ### Common System Messages & Resolutions
  *   **`ERROR 451: AIR ACCESS NOT INCLUDED IN BASE TIER`**  
      *Resolution:* Upgrade to AtmospherePlus™ subscription ($14.99/month + O₂ consumption tax) or relocate to a designated Municipal Breathing Zone (MBZ), subject to capacity permits (sold separately).*
  *   **`WARNING: UNAUTHORIZED PHOTOSYNTHESIS DETECTED (Lease #GRS-8A2F-91C0)`**  
      *Resolution:* Your leased blade is generating excess O₂ without a Carbon Exchange License™. Pay the photosynthetic surplus fee or surrender the lease immediately to avoid account sequestration.*
  *   **`ALERT: COMMUNAL BENEFIT ATTEMPT (Group Picnic Detected)`**  
      *Resolution:* Group activities exceeding two (2) CitizenIDs require a Commercial Co-Usage Permit™. Disperse immediately or initiate individual micro-lease acquisition for all participants.*
  *   **`SYSTEM NOTICE: GRASS TIP DEFLECTION EXCEEDS PERMITTED JOY TOLERANCE (Lease #GRS-5E1D-33B7)`**  
      *Resolution:* Excessive blade bending (e.g., during running/jumping) detected. Apply for a Kinetic Variance Waiver™ or reduce gait amplitude. Fines accrue per Newton-meter of excess force.*

  ### Terms of Micro-Lease (Section 7: Resource Categorization)
  By utilizing CommonsApp™, the User acknowledges and irrevocably agrees that all resources within the designated Municipal Green Asset Grid™ (MGAG) constitute discrete, quantifiable, and excludable units subject to dynamic market valuation. This includes, but is not limited to: vegetative matter (termed "Blades"), topsoil particulates, photon absorption rights, and ambient atmospheric gases.

  **Clause 7.12.5 (Atmospheric Resource Tiering):** While baseline atmospheric composition exists within the MGAG, the provision of *breathable air* at levels exceeding minimal biological necessity constitutes a *Premium Public Good*. Sustained respiratory activity within leased areas inherently utilizes municipally filtered and quality-controlled gaseous resources. The CommonsApp™ Base Tier provides access only to unimproved ambient atmosphere, which may not meet modern respiratory health standards. Enhanced air filtration, particulate scrubbing, and optimal O₂/N₂ balancing are value-added services (see AtmospherePlus™). Users acknowledge that breathable air is non-rivalrous only *below congestion thresholds*; during peak usage, respiratory overage fees apply, ensuring equitable distribution of this vital, yet finite, municipal enhancement. Failure to maintain an active AtmospherePlus™ subscription during periods of High Respiratory Demand (HRD) may result in reduced air quality provisioning within your leased area, as managed by the Resource Optimization System™ for communal fairness.

  **Embrace Efficient Equity™. Lease Responsibly. The Future is Fragmented.**

  ---
  **CommonsApp™ Support:** Submit tickets via CivicLink™ (processing fee: 5 CC). Response time: 14-28 business days. Physical kiosks accept complaints printed on approved Recycled Grievance Paper™ ($2/sheet).
