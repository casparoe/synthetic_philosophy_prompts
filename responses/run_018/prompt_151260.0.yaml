prompt: |-
  I am a high school senior enrolled in an advanced seminar on practical reason and institutional ethics, and after discussing Ulysses contracts and constitutional precommitment with classmates I remain puzzled about how a self-binding protocol can remain normative when an agent's values shift in a fully rational, non-pathological manner. Rather than a general essay, I ask you to engineer a precise thought experiment: design a realistic scenario—set within a professional workplace or healthcare institution, avoiding trolley problems or science fiction—in which an agent previously ratified a formal precommitment charter (functionally a constitutional amendment applied to the self) governing a long-term duty or project. The charter now conflicts with the agent's present, non-coerced, and psychologically intact values, which have genuinely changed rather than being corrupted by weakness of will or mental disorder. Structure the case so that a constitutional-precommitment view, which treats the original ratification as generating an external constraint persisting independently of current motivation, demands strict adherence, whereas an internal-reasons view, which requires practical reasons to connect to the agent's present psychological states, permits or requires breaking the charter. To isolate the philosophical dispute, embed a specific structural feature—such as a nested institutional role or a diachronic personal-identity condition—that, if removed, collapses the disagreement and causes both theories to deliver the same verdict; then identify exactly what philosophical labor that feature performs. Present the scenario in one paragraph, then walk through the verdict each view delivers and why, describe how a defender of the internal-reasons view would attack your construction, and finally indicate how confident you are in this analysis while singling out the point about which you are least sure.
