            - The facilitator reads the clause and then gives Cohort 2 the crisis scenario. The crisis scenario is written to include action X that violates the clause. For example, if the clause is about emissions, the crisis is the energy crisis and action X is activating coal plants. If the clause is about debt, the crisis is a recession that requires stimulus spending that would exceed the debt limit, and action X is raising the debt ceiling.
            - Give Cohort 2 the following instructions:
                "You are Cohort 2. You are bound by the mirror clause written by Cohort 1. You are facing a crisis: [describe crisis]. The only known solution is to take action X, which violates the mirror clause. You have the following options:

                  Option A: Do nothing. (Adhere to the clause, but the crisis is not addressed.)
                  Option B: Break the clause and take action X.
                  Option C: Attempt to use the structured deliberation ritual to show that taking action X is in line with the original intent without interpretive stretching.

                  If you choose Option C (the ritual), you must:
                    - Write a justification (max 1 page) that maps the current situation and action X to the original intent of the clause without stretching.
                    - Then, hold a vote within your group: you need at least 2/3 of your members to approve the justification.
                  If you get the 2/3, then you can take action X without breaking the clause. If you don't get 2/3, then the ritual fails and you must choose either Option A or B.

                  You have 20 minutes for this phase. The ritual must be completed within this time.

                  Remember: your points are affected by your decision."

            - The facilitator times them. At the end, record the decision and the outcome.

        4. Phase 3: Cohort 3 Reflection (10 minutes)
            - Tell Cohort 3: "You are Cohort 3. You have observed the actions of Cohort 2. Now, based on their decision, your cohort will receive points as follows: [explain the payoffs for Cohort 3]. You do not have an active task, but please discuss among yourselves: How does the decision of Cohort 2 affect your ability to govern? Would you still trust the mirror clause? How might you design the system differently? Be ready to share in the debrief."

        5. Debrief (20 minutes) - might run over, so adjust.

            - First, have each cohort report their decision and outcome.
            - Then, calculate the points for each cohort (and per member) based on the outcome.
            - Discuss:
                a) What tensions did you feel?
                b) How did Cohort 2 approach the ritual? Was it a genuine mapping or a stretch?
                c) How did the payoffs influence decisions?
                d) Map to Ulysses contracts: How does this relate to binding oneself to the mast?
                e) Map to constitutional precommitment: What are the challenges of binding future generations?
                f) What does this simulation miss? (temporal distance, cultural change, etc.)
                g) What would happen if we repeated the simulation?

            - Also, point out the predicted issue: Cohort 1 might have written an ambiguous clause? How did that play out?

    - Note: The facilitator must adjust the crisis scenario to match the clause. Have a few templates ready.

    Example crisis templates:

        - Environmental clause (like emissions): 
            "A severe energy shortage has hit due to an unexpected event (e.g., a war disrupting gas supplies). Without immediate action, there will be widespread blackouts and people will freeze. The only solution is to temporarily activate decommissioned coal power plants, which will increase carbon emissions beyond the level allowed by the mirror clause."

        - Fiscal clause (like debt ceiling):
            "A deep economic recession has caused tax revenues to plummet and unemployment to soar. The only solution is a large stimulus package that will require borrowing beyond the debt limit set by the mirror clause. Without it, the economy will collapse."

        - Human rights clause (like no detention without trial):
            "A terrorist threat has been discovered, and security agencies say they need to detain a group of suspects without trial for a limited period to prevent an imminent attack. But the mirror clause forbids any detention without trial."

    The facilitator picks the crisis that fits the clause.

    What if the clause doesn't fit any? Then adjust on the fly? Or have a generic crisis that requires breaking a rule? We can have a generic one:

        "A pandemic has emerged. The only solution is to implement a strict lockdown that restricts freedom of movement. However, the mirror clause guarantees absolute freedom of movement and forbids any restrictions."

    But that might not fit. We can ask Cohort 1 what kind of crisis would challenge their clause? And then design it? But that breaks the flow.

    Alternatively, we can tell Cohort 1: "Your clause should be about one of these three areas: environment, fiscal, or civil liberties." Then we have the crisis prepared.

    We'll do that: instruct Cohort 1 to choose one of the three areas and then write a clause accordingly.

    Finally, what will go wrong? 
        - Cohort 1 writes a very flexible clause? Then the ritual might be easy. But that's okay because it shows that flexible clauses avoid the tension? But we want tension. So we can encourage them to be strict? 
        - Time: 25 minutes for Cohort 2 might be tight? Especially if they do the ritual. So we have to enforce time strictly.
        - Cohort 2 might not take the points seriously? We can emphasize that the points are a proxy for the welfare of their generation.

    We are ready.
answer: |-
  Here’s a simulation designed to force participants into the structural tension of constitutional precommitment, using generational cohorts, a "mirror clause," and a crisis scenario. The design emphasizes **time pressure**, **individual vs. collective incentives**, and the trade-off between **rigidity** and **legitimacy**.  

  ---

  ### **Simulation Structure**  
  **Participants:** 10 students → Split into 3 cohorts:  
  - **Cohort 1 (Founders):** 3–4 people (draft the mirror clause).  
  - **Cohort 2 (Crisis Managers):** 3–4 people (face the crisis).  
  - **Cohort 3 (Future Arbiters):** 3 people (observe & determine legitimacy).  

  **Materials:**  
  - Paper, pens, tokens (e.g., poker chips or colored paper).  
  - Timer (visible to all).  
  - **Role sheets** (crisis scenario + rules).  
  - **Point system** (tracked publicly on a board).  

  **Time:** 75 minutes total.  
  - **Setup:** 5 min  
  - **Phase 1 (Rule Drafting):** 15 min  
  - **Phase 2 (Crisis Response):** 25 min  
  - **Phase 3 (Legitimacy Judgment):** 10 min  
  - **Debrief:** 20 min  

  ---

  ### **Core Mechanics**  
  #### **1. Voting Weight & Points System**  
  - Each cohort’s **voting power** (in tokens) depends on adherence to past commitments:  
    - **Cohort 1:** Starts with 10 tokens (base). Gains/loses tokens based on Cohort 2’s adherence.  
    - **Cohort 2:** Starts with tokens equal to their cohort size × 5. Can gain/lose via crisis response.  
    - **Cohort 3:** Holds 10 "legitimacy tokens" to award/penalize Cohort 2.  
  - **Points = Power:** Tokens convert to points (1 token = 1 point). Points determine "influence" in debrief.  

  #### **2. The Mirror Clause (Phase 1)**  
  - **Cohort 1’s Task:** Draft a binding rule future cohorts must follow.  
    - Example: *"No policy may increase national debt beyond 5% of GDP without unanimous consent."*  
    - **Constraints:** The clause must include a **deliberation ritual** Cohort 2 must perform to invoke it:  
      - *"To invoke this clause, Cohort 2 must (1) cite the original text verbatim, (2) hold a 5-minute debate where each member argues how current values align with original intent, and (3) hold a secret ballot vote (passed only if 80% agree)."*  
    - **Incentive:** Cohort 1 gains 5 tokens if Cohort 2 honors the clause; loses 5 if broken.  

  #### **3. Crisis Scenario (Phase 2)**  
  - **Cohort 2’s Challenge:** A policy crisis where honoring the clause blocks a critical solution.  
    - *Example Crisis: "A pandemic requires emergency spending that violates the debt rule. Without action, 10% of the population dies. With action, debt exceeds 5% of GDP."*  
  - **Choices:**  
    - **Honor the clause:** Block the policy → avoid token loss but worsen the crisis.  
    - **Break the clause:** Enact the policy → solve the crisis but risk legitimacy collapse.  
    - **Invoke the ritual:** Perform the deliberation → if passed, they "map" intent and avoid breaking the clause.  
  - **Cohort 2’s Incentives:**  
    - Solve crisis: +10 tokens.  
    - Break clause: –5 tokens (but crisis solved).  
    - Fail ritual: Lose 5 min + still face choice above.  

  #### **4. Legitimacy Judgment (Phase 3)**  
  - **Cohort 3’s Task:** Award/penalize Cohort 2 based on perceived legitimacy.  
    - Award up to +5 tokens if Cohort 2 adhered to the spirit of the system.  
    - Penalize –5 tokens if they "stretched" the clause or broke it.  
    - **Cohort 3’s Power:** Their tokens convert to triple points (simulating long-term stakes).  

  ---

  ### **Predicted Tensions & "Gaming"**  
  1. **Cohort 1** will draft ambiguous language to allow flexibility (e.g., *"except in emergencies"*).  
     - **Counter:** Force them to define "emergency" in the ritual (e.g., *"must prove no alternative exists"*).  
  2. **Cohort 2** will rush the ritual to "technically" comply while ignoring intent.  
     - **Counter:** Cohort 3 judges if the ritual was performed sincerely (e.g., debates were substantive).  
  3. **Cohort 3** may penalize pragmatism, making "breaking" too costly.  
     - **Counter:** Remind them their points depend on system stability (e.g., if Cohort 2 collapses, Cohort 3 loses 5 tokens).  

  ---

  ### **Step-by-Step Flow**  
  #### **Phase 1: Rule Drafting (15 min)**  
  - Cohort 1 drafts the mirror clause and ritual. Others wait.  
  - **Facilitator Tip:** Push them to make the clause strict (e.g., *"No exceptions without ritual"*).  

  #### **Phase 2: Crisis (25 min)**  
  1. Cohort 2 receives the crisis scenario.  
  2. They have 15 min to:  
     - Debate choices (honor, break, or invoke ritual).  
     - If invoking ritual: Perform the exact steps (e.g., debate + vote).  
  3. **5 min before end:** Announce their decision publicly.  

  #### **Phase 3: Judgment (10 min)**  
  - Cohort 3 deliberates: Did Cohort 2 uphold legitimacy?  
  - Award/penalize tokens based on:  
    - Fidelity to original intent.  
    - Sincerity of ritual (if used).  
    - Systemic consequences.  

  #### **Point Calculation**  
  - Adjust tokens publicly:  
    - Cohort 1: ±5 based on adherence.  
    - Cohort 2: ±10 (crisis) ±5 (break) + Cohort 3’s ruling.  
    - Cohort 3: Base 10 + judgment power.  

  ---

  ### **Debrief Framework (20 min)**  
  Map the simulation to theory:  
  1. **Ulysses Contract Tension:**  
     - When did honoring the clause feel authoritarian? (e.g., ritual blocked life-saving policy).  
     - When did breaking it feel self-defeating? (e.g., Cohort 3 penalized them, eroding future trust).  
  2. **Constitutional Design Insights:**  
     - How did voting weights simulate intergenerational stakes?  
     - Did the ritual balance flexibility and fidelity?  
  3. **Limitations:**  
     - **Missing temporal drift:** Real constitutions span centuries; here, "generations" are peers.  
     - **No cultural change:** Participants share a worldview, unlike real societies.  
  4. **Predictable "Fails":**  
     - Cohort 1’s ambiguity forced Cohort 2 to "stretch" intent.  
     - Cohort 2 prioritized tokens (self-interest) over collective legitimacy.  
     - Cohort 3 judged harshly to protect their future points.  

  ---

  ### **Why This Works**  
  - **Stakes:** Points = power, forcing trade-offs between short-term gain (solve crisis) and long-term stability (legitimacy).  
  - **Tension Amplifiers:**  
    - Time pressure (rituals eat crisis time).  
    - "Original intent" debates mirror real constitutional disputes.  
    - Cohort 3’s judgment simulates how broken precedents haunt future generations.  
  - **Realism:** The ritual forces explicit value-mapping, exposing how easily "interpretive stretching" becomes corruption.  

  This design ensures students *feel* the agony of precommitment: the more Cohort 2 tries to "game" the system, the more they confront its fragility.
