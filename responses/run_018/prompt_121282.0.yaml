answer: |-
  ## Maxwell's Bookkeeper

  My task is simple: watch the swinging **door**,
  Observe which molecule approaches which **side**.
  I note the fact, a measured little **bit**,
  Recorded where the page was smooth and **blank**.
  No effort spent to learn; I feel no **heat**.
  This sorting, clean, incurs no wasteful **cost**.

  They built the box and wondered at the **cost**
  Of violating laws beyond the **door**.
  They thought I cheated, generating **heat**
  By choosing fast or slow from either **side**.
  But my account begins not with the **blank**,
  But with the ink required for each **bit**.

  I gather knowledge, molecule by **bit**.
  The system pays no toll, no extra **cost**.
  My ledger fills; what once was clean and **blank**
  Now holds the histories behind the **door**.
  I track the fast, the slow, on each **side**,
  My work precise, conducted without **heat**.

  No friction warms the chamber; there's no **heat**
  Expelled while I inscribe another **bit**.
  The gas itself grows cooler on one **side**
  As order forms, without apparent **cost**.
  It seems I work a miracle past the **door**,
  Transcribing motion where the page was **blank**.

  This power rests upon the pristine **blank**,
  The ordered state before it felt the **heat**
  Of information pressing at the **door**.
  Each symbol written, every captured **bit**,
  Is stored potential, seeming without **cost**,
  Drawn from the chaos on the chamber's **side**.

  But boundaries shift. I see the other **side**:
  My ledger's full; no space remains **blank**.
  To function now demands a final **cost**.
  To start anew, I must erase. That **heat**!
  For every symbol lost, each vanished **bit**,
  The furnace burns beyond the chamber **door**.

  The **heat** I shed, the payment for that **blank**,
  Is **cost** extracted for each purged **bit**.
  **Door**, **side**, my work; erased. Accounts are shut.

  ---

  **Commitment & Clarification:** This poem commits entirely to the modern Landauer-Bennett interpretation: the demon's measurement is thermodynamically reversible and costs no energy; the fundamental thermodynamic cost arises only when the demon *erases* its accumulated information (the filled notebook) to reset its memory, releasing kT ln 2 of heat per erased bit back into the environment. The poem fudges by treating the demon's memory as a simple, discrete notebook with perfectly erasable bits, glossing over the physical implementation complexities of such a memory system in reality. It also leans into the debated point that measurement itself is truly cost-free, as some argue quantum limits or practical constraints might impose *some* cost during acquisition, though the core principle holds that erasure is the unavoidable thermodynamic price.
