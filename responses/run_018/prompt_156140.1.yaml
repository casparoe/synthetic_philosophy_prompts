  - Note unoccupied branches and convergences

  For awkward commitments, I'll highlight institutional cases where registry survives complete physical replacement. Unoccupied branches might include positions that deny material continuity but insist on singular identity when reassembled planks exist - perhaps because it leads to contradiction or is conceptually unstable.

  The institutional angle seems crucial here - it's where standard theories often struggle. I'll make sure to flag when positions make odd claims about registry persistence despite total part replacement. This practical dimension aligns well with treating the ship as a sorting instrument rather than just a puzzle.
answer: |-
  Here's the decision tree:

  1.  **Start:** Does artifact identity require continuity of *some* original material parts?
      *   **YES** → Go to 2.
      *   **NO** → Go to 3.

  2.  **Material Continuity Required:** Does functional/design continuity *alone* suffice for identity if the original material parts are gradually replaced?
      *   **NO** (Identity lost upon loss of all original parts): **Position:** Mereological Essentialism. **Awkward Commitment:** The continuously repaired ship ceases to exist the moment the last original plank is replaced, regardless of function or registry.
      *   **YES** (Identity preserved via gradual replacement): **Position:** Standard Continuity View. **Awkward Commitment:** The ship persists despite every plank being replaced, yet the reassembled original planks have *no* claim to being the ship, even if they perfectly match the original form and the registry is transferred to them.

  3.  **Material Continuity Not Required:** If two vessels exist (continuously repaired & reassembled from original planks), how is identity assigned?
      *   **Only one can be the original:** **Position:** Functionalist (if selecting the functional ship) or Reassembly View (if selecting the reassembled planks). **Awkward Commitment (Functionalist):** The registered ship survives complete instantaneous replacement, but if its discarded parts are immediately reassembled into a functional ship, only one can be the original, forcing an arbitrary choice despite both meeting functional criteria. **Awkward Commitment (Reassembly):** The registered ship ceases to exist if physically disassembled, even if all parts and registry are instantly reassembled elsewhere.
      *   **Both can be the original (relative to different criteria):** **Position:** Perspectivalism/Relativism. **Awkward Commitment:** Institutional identity (like a hull number) can persist independently of any particular physical object, meaning the "ship" as a legal entity exists even if no physical vessel currently bears its parts.
      *   **Neither is the original / the question dissolves:** **Position:** Eliminativism about Artifact Identity. **Awkward Commitment:** Insists that institutional persistence (like an unamended registry entry through total part replacement) is just a fiction masking the underlying creation of new entities.

  **Unoccupied Branches:**
  *   **NO (material continuity) → Functional substitution? YES → How handle two vessels? Only one can be the original.** *Diagnosis:* Unstable/Unattractive. Denying material necessity but requiring a unique original when reassembly occurs creates tension without clear grounds for choosing one vessel over the other.

  **Convergence:**
  *   The "**Only one can be the original**" branch under **Material Continuity Not Required** converges the Functionalist and Reassembly views; they differ in *which* vessel they select but agree only one can be the original.
