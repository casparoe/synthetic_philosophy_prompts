  I'm in a political theory seminar and we just finished Arendt's essays on truth and lying in politics, and afterwards a few of us got into a long arguement at the pub about what she would have made of the present moment: AI-generated deepfakes, synthetic audio of candidates, chatbots producing fluent confident falsehoods at scale, the general feeling that you can't trust a video anymore. My friend thinks this is all just more of what she already described -- organized lying, image-making, the defactualization of politics -- so her analysis transfers straight over with no changes. I'm not so sure. Her whole account seems to hinge on there being a liar somewhere: someone who knows the truth and deliberately replaces it, and who (on her telling) even has a kind of advantage over the truth-teller because he at least knows what reality is. Generative AI doesn't know anything and doesn't intend anything; nobody at the model is lying. So something in her framework has to either bend or break here, and I want to know which.

