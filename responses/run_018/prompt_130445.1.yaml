answer: |-
  Good morning. It’s a genuine privilege to welcome you all to the civic centre for this workshop, ‘Democracy Beyond Translation’. We’ve gathered a vital mix: political philosophers accustomed to parsing concepts at altitude, alongside those – councillors, faith leaders, students – whose work unfolds in the sometimes messy, always urgent, terrain of local politics and community life. Our subject – public reason and religious arguments in politics – is well-trodden ground in theory, yet constantly erupting anew in practice. Today, I hope we can dig into it differently, prompted by a concept that feels profoundly personal, yet speaks directly to our shared democratic anxieties.

  I stand before you wearing two hats that feel particularly significant this morning. First, as an academic, immersed in the debates we’re here to discuss – the intricate arguments about justification, neutrality, and the legitimate language of public discourse, from Rawls’s ‘public reason’ to Habermas’s ‘translation proviso’. Second, and perhaps more pressingly today, as the daughter of a man who thought deeply about community, conflict, and building shared spaces, but whose thoughts never found their way into academic journals.

  My late father was a town planner. He spent his career navigating competing claims on land, resources, and visions for neighbourhoods. He wasn’t a published theorist; his most profound ideas resided in handwritten notes, sketches, and observations scribbled in margins. Recently, sorting through his papers, I was struck by a recurring phrase he used: **‘reciprocal opacity’**. It wasn’t fully elaborated, but its contours were clear, born of decades mediating disputes where people talked past each other, convinced the other side was simply being stubborn, or irrational, or worse.

  His idea was a quiet challenge to the orthodoxy often distilled from our philosophical giants. He didn’t believe democratic respect, particularly between secular and religious citizens, was best achieved by demanding that religious citizens *translate* their deepest convictions into a neutral, secular language accessible to all *before* entering the public square. He saw that demand, however well-intentioned, as subtly asymmetrical. It asked one side to perform a cognitive and spiritual exercise the other was largely exempt from.

  Instead, he proposed ‘reciprocal opacity’. The idea is that certain foundational commitments – the bedrock beliefs shaping one's understanding of the good, the true, the sacred, or indeed, the secular – might necessarily remain, in significant part, *mutually untranslated*. Not out of secrecy or bad faith, but because they are rooted in distinct traditions, experiences, and authorities that resist complete assimilation into a common conceptual currency. Crucially, he argued that *accepting* this mutual opacity, this respectful unknowing at the deepest level, isn’t a *failure* of democratic communication to be overcome, but rather, a *form of civic equality*. It’s an acknowledgment that we meet in the public sphere not as abstract, perfectly translatable reasoners, but as concrete individuals and communities shaped by commitments we may not fully grasp in each other. Respect lies in engaging with the *public actions and reasons offered*, even while recognizing the untranslatable depths from which they may spring, and accepting that the same is true of us in their eyes.

  This concept became urgently real for me just recently, watching a zoning dispute unfold in our own borough. A secular environmental coalition, grounded in scientific projections and deep ecological values, faced off against a religious housing trust, motivated by a faith-based mandate to shelter the vulnerable and build community. The debate quickly grew fractious. Each side heard the other’s arguments not just as *different*, but as fundamentally *unreasonable*, even deliberately obstructive. The environmentalists saw the trust as dismissive of tangible ecological risks; the trust felt the coalition was callous towards urgent human need. Both sides assumed the other was simply refusing to ‘speak properly’ – to translate their concerns into terms the other could accept. What became painfully clear, however, was that each was speaking from premises – profound convictions about the nature of obligation, the hierarchy of values, the source of authority – that the other had never been expected, or perhaps even *able*, to fully learn or internalize. The demand for translation wasn’t bridging the gap; it was highlighting an impossibility and breeding resentment.

  So, why ‘Democracy *Beyond* Translation’? Not because translation isn’t valuable or necessary in countless everyday interactions. It is. But because we need to question whether it can, or should, be the *sole* basis for democratic respect when it comes to the deepest wells of motivation. My father’s ‘reciprocal opacity’ suggests that sometimes, the most democratic act is *not* insisting on full transparency into the other’s soul, but rather, agreeing to navigate our shared world *despite* those depths we cannot fully illuminate for each other. It asks us to find ways to cooperate, to compromise, to build, even when the absolute foundations remain partly veiled – and to see that mutual veiling not as a barrier to democracy, but as a condition of it when profound diversity is present.

  My task this morning isn’t to resolve this tension. Frankly, I don’t have the answers. My father certainly didn’t leave a blueprint. My task is to frame our day by honouring his practical, hard-won intuition and placing this challenging concept – ‘reciprocal opacity’ – firmly on our collective table. Let’s not start by asking how we make the ‘religious’ sound ‘secular’, or vice versa, to achieve legitimacy. Instead, let’s ask: How do we build democratic practices and institutions robust enough to accommodate citizens who acknowledge they may never fully *see* the deepest grounds of each other's commitments, yet still commit to finding a shared path forward? How do we turn that necessary, mutual opacity from a source of frustration into a recognition of equal standing?

  The philosophers here will, rightly, probe the limits, the dangers, the theoretical coherence. The practitioners here will, rightly, demand to know what this *means* for a planning meeting, a council debate, a community consultation. That’s the work ahead. I offer my father’s fragmentary idea not as a lecture, but as an uncomfortable gift: a lens, perhaps, through which to re-examine our assumptions about communication, respect, and the very texture of democratic equality in a pluralistic society. The tension between the need to share a public world and the reality of our differing private depths isn’t going away. Today, let’s try to see it clearly, together. Thank you. Let’s begin.
