answer: |-
  ### Brainstorm for Complete Answers  
  **Key requirements for full marks (A-grade):**  
  - **(a)** Must explicitly state: individual VNM preferences ⇒ affine \(u_i\) (unique up to PATs); planner VNM preferences ⇒ affine \(W\); Pareto indifference (if \(u_i(p) = u_i(q) \forall i\), then \(W(p) = W(q)\)). Conclusion: \(W = \sum a_i u_i + b\) with \(a_i \geq 0\) (non-negativity requires proof via Pareto, not just assertion).  
  - **(b)** Sketch: Linearity of \(u_i\) and \(W\) from VNM; Pareto indifference ⇒ \(W\) vanishes on \(\cap \ker u_i\) ⇒ \(W\) in span of \(\{u_i\}\) via linear algebra.  
    - *(i)* If Pareto indifference dropped: \(W\) need not respect Pareto *improvements* (e.g., could violate weak Pareto).  
    - *(ii)* If achievable utility differences span subspace \(S \subsetneq \mathbb{R}^n\): existence of weights requires \(S\) to be the domain (not necessarily \(\mathbb{R}^n\)), but uniqueness fails.  
  - **(c)** Violation of independence by individuals: \(u_i\) not affine ⇒ Pareto indifference may not constrain \(W\) sufficiently (e.g., indifferences may not generate subspace). Must note that even if \(W\) is affine, aggregation fails without affine \(u_i\).  
  - **(d)** Clarify: Weights \(a_i\) give MRS only if scales fixed; anonymity ⇒ equal weights *only if* utilities are normalized identically (e.g., common zero and unit); veil-of-ignorance ≠ theorem + anonymity (veil imposes specific normalization: "equal chance" ⇒ expected utility is average).  

  ---

  ### Evaluation of Student's Answer  
  **Numbered comments (claim-by-claim):**  
  1. **(a) Non-negativity proof (-0.5):** "If some \(a_i\) were negative... Pareto indifference rules out." → **Incomplete**. Fails to show why a change *raising only \(i\)'s utility* exists (requires full-dimension span or specific lotteries). Without this, negative \(a_i\) might not violate Pareto indifference.  
  2. **(b)(i) Counterexample (-1):** "W could be any affine functional... worst-off person" → **Wrong**. Maximin (worst-off) is *not* affine (violates independence), so invalid if planner satisfies VNM. Correct counterexample: e.g., \(W = u_1 - u_2\) (still affine but violates Pareto).  
  3. **(b)(ii) Span condition (-0.5):** "Weighted-sum representation still exists" → **Incomplete**. Existence requires achievable differences to span the domain of the \(u_i\) (which might be \(\mathbb{R}^k\), \(k < n\)). If span is trivial (e.g., all \(u_i\) identical), aggregation may fail.  
  4. **(c) Core argument (-0):** "No affine \(u_i\)... span argument cannot be stated" → **Right**. Correctly identifies loss of linear structure. (No deduction).  
  5. **(c) Vacuousness claim (-0.5):** "Pareto indifference constrains W not at all" → **Incomplete**. Ignores cases where indifferences exist (e.g., Allais paradox still has some indifferences), which *partially* constrain \(W\).  
  6. **(d) Weights as MRS (-0.5):** "Ratios \(a_i / a_j\) are determined" → **Incomplete**. Only true if utility differences span \(\mathbb{R}^n\); otherwise, weights are not unique, so MRS undefined.  
  7. **(d) Anonymity (-1):** "Weights cannot differ... hence all equal" → **Wrong**. Anonymity implies \(a_i = a_j\) only if utilities are interpersonally comparable *and identically scaled* (e.g., common zero). Otherwise, weights can differ (e.g., if \(u_i\) scales differ, equal weights ≠ anonymity).  
  8. **(d) Veil-of-ignorance (-1):** "Theorem plus anonymity restates veil-of-ignorance" → **Wrong**. Veil imposes \(W = \frac{1}{n} \sum u_i\) by construction (normalizing utilities behind the veil). The theorem + anonymity gives \(\sum u_i\), requiring *additional normalization* to match.  

  **Top answer additions:**  
  - **(a)** Prove non-negativity: If \(a_i < 0\), find \(p, q\) with \(u_i(p) > u_i(q)\), \(u_j(p) = u_j(q)\) \(\forall j \neq i\) (requires full span).  
  - **(b)(i)** Use affine counterexample violating weak Pareto (e.g., \(W = u_1\)).  
  - **(b)(ii)** Note existence hinges on achievable differences spanning the domain of the \(u_i\) (which is automatic if \(X\) is finite and preferences vary).  
  - **(d)** Emphasize that weights require fixed utility scales; anonymity + identical scaling ⇒ equal weights.  

  ---

  ### Final Mark and Grade  
  **Deductions:**  
  - (a): -0.5 (incomplete non-negativity)  
  - (b)(i): -1 (wrong counterexample)  
  - (b)(ii): -0.5 (incomplete existence)  
  - (c): -0.5 (incomplete vacuity)  
  - (d): -3 (aggregate: -0.5 MRS, -1 anonymity, -1 veil)  
  **Total:** 20 - 5.5 = 14.5 → **15/20** (rounded up, as partial credits not itemized).  
  **Grade:** **B** (solid but with significant gaps in key areas).  

  \answer{15/20, B}
