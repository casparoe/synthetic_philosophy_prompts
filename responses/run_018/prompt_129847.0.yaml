answer: |-
  **Thought Experiment:**  
  Linda coordinates a neighborhood garden project. Previously, members contributed time based on ability—busy parents helped less during hectic weeks but offered surplus produce later; retirees covered gaps without fuss. Trust allowed flexibility. Linda, committed to perfect fairness, introduces a meticulous contribution-tracking system: hours logged, produce weighed, tasks assigned strictly by equal weekly obligation. She adjusts schedules daily to compensate for any perceived imbalance, like reducing a parent’s plot size after a missed hour. The retirees feel scrutinized for unrecorded tasks; parents resent inflexibility. Gradually, members withdraw, feeling every act is audited. The garden withers as the informal goodwill that sustained it—dependent on unmeasured give-and-take—evaporates under Linda’s regime of granular equity.

  **Analysis:**  
  1.  **Belief/Action:** Linda’s implementation of a rigid, real-time contribution tracking system enforcing strict equivalence, eliminating all informal reciprocity or situational leeway.
  2.  **Maximal vs. Moderate:** Moderately good actors accept minor imbalances as the "slack" enabling flexible cooperation. Linda’s *maximal* commitment tolerates zero slack; her relentless pursuit of micro-fairness destroys the macro-level trust (the cooperative good).
  3.  **Defender's Rebuttal:** A defender could argue Linda’s system *is* truly fair. The garden’s collapse stems not from her moral perfection, but from the *other members' moral weakness*—their unwillingness to embrace true, consistent fairness over comfortable but imprecise reciprocity. The problem lies in the group’s flawed character, not her saintly standard.
