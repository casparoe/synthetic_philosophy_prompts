prompt: |-
  ok so i just started this grad position at a sleep and consciousness lab and we're interviewing people about weird emergence experiences from anesthesia - like they wake up describing stuff from the OR that they shouldnt have seen. my advisor is obsessed with Dennett's heterophenomenology idea, which i mostly get: treat the transcript as describing a "heterophenomenological world" not as a direct window into consciousness, stay neutral like an anthropologist. but now i actually have to code these things and i need a real procedure, not just the theory.

  i need a step-by-step decision procedure i can run on each transcript in about 20 minutes, with the questions in order, what counts as enough answer to keep going, and where i have to stop and flag it for my advisor because it's a values call not a coding call. specifically it needs to handle "stacked reports" where the patient mixes up what happened inside the world they're describing with their own interpretation of whether it was real or a dream - rules for pulling those layers apart, or rather to seperate them, without destroying the coherence of the heterophenomenological world. and i need a check for "narrative contamination" where they seem to be retrofitting details they learned after waking up.

  the procedure should have hard stops: where do i reject a report as too incoherent to code at all, where do i accept it but mark it as an access-report rather than a world-report, and where does it hand over to human judgment?

  then run it on three cases:
  1. patient says "i floated near the ceiling and saw the nurse drop a tray, then i knew it wasnt real because nurses never drop trays"
  2. patient describes being in a tunnel with bright lights but then says "and thats probably just the drugs, my mom told me about near-death stuff before the surgery"
  3. one where the procedure says "this is structurally coherent, code it as a world-report" but that feels wrong to me - maybe they describe a full conversation with a dead relative in perfect detail but every detail matches the hospital room layout they could have heard about through the curtain.

  i also need you to flag exactly what this procedure cant do - like when it will misfire on genuinely confused patients vs people with weird but real experiences. and please dont ask for citations or a reading list, i dont have library access right now and my advisor wants this on his desk tomorrow.
reasoning: |-
  We are creating a step-by-step decision procedure for coding anesthesia emergence reports. The procedure must:
  1. Handle "stacked reports" by separating the described world from the patient's interpretation.
  2. Check for "narrative contamination" (details learned after waking up).
  3. Have hard stops for:
     - Rejecting a report as too incoherent.
     - Marking as "access-report" (where the patient is reporting their own mental state, not an external world) vs. "world-report" (a described world).
     - Handing over to human judgment.

  The procedure is designed to be run in about 20 minutes per transcript.

  **Step-by-Step Coding Procedure:**

  **Step 0: Preprocessing**
  - Read the entire transcript once to get an overview.

  **Step 1: Initial Coherence Check (Hard Stop 1: Reject if too incoherent)**
  - Ask: Is the report minimally coherent? (i.e., does it form a narrative or a set of experiences that can be followed, even if bizarre?)
    - If the patient's speech is completely disjointed (e.g., random words, no connection between sentences) and you cannot discern any sequence of events or experiences, reject the report and mark as "Incoherent - Reject".
    - If coherent, proceed.

  **Step 2: Identify the Core Narrative (The Heterophenomenological World)**
  - Underline or extract every sentence that describes an event, perception, or action within the reported experience. Ignore for now any statements that interpret the experience (e.g., "I think it was a dream", "that was probably the drugs").
  - If the report has no such descriptions (i.e., only contains statements about mental states like "I felt scared"), then mark as "Access-Report" and skip to Step 5.
  - Otherwise, you are building the "world-report".

  **Step 3: Handling Stacked Reports**
  - For each part of the core narrative, if the patient immediately follows a description with an interpretation (e.g., "I saw a bright light, but that was probably the lamp above me"), code the description as part of the world and note the interpretation as a separate layer (meta-commentary).
  - Rule: The heterophenomenological world is built solely from the descriptive content. The interpretation is recorded as the patient's subsequent belief about the experience, not part of the world itself.
  - If the patient interweaves interpretation so densely that the world description becomes fragmentary and loses coherence, flag for human judgment (Hard Stop 3: Handover).

  **Step 4: Check for Narrative Contamination**
  - Look for any details in the core narrative that the patient could not have perceived during the surgery (e.g., events that occurred outside the OR, conversations among staff that were inaudible, details about the surgical procedure that were not visible from the patient's position).
  - Also, look for explicit admissions: e.g., "my mom told me about...", "I saw on the monitor later...".
  - If such details are present and are integral to the narrative, flag the report for potential contamination (but do not remove them from the world-report; just note the contamination).
  - If the entire narrative seems to be built on post-hoc information, mark as "Contaminated" and flag for advisor.

  **Step 5: Classify as World-Report or Access-Report**
  - If the core narrative describes an external world (even if fantastical) with events, objects, and characters, code as "World-Report".
  - If the report only describes internal states (emotions, thoughts, sensations without external references) or if the narrative is entirely about the patient's own mental activity (e.g., "I felt like I was floating", without describing what they saw while floating), then code as "Access-Report".

  **Step 6: Structural Coherence Check (Hard Stop 2: When to hand over)**
  - Even if the report is a world-report, if the coder feels uneasy about its veracity (e.g., every detail matches what the patient could have known from other sources, but the patient does not admit to contamination) and the structural coherence is high, still code as a world-report but note the coder's unease in a "Comment" field.
  - The procedure cannot rule out contamination that is not admitted; it can only flag when contamination is explicit or when the narrative includes impossible knowledge. Therefore, if the narrative is coherent and there is no explicit contamination, code it as a world-report and note any concerns for the advisor to review.

  **Step 7: Final Flags**
  - If at any point the coder is unsure (e.g., whether an interpretation layer breaks coherence, whether a detail is contamination, or whether the report is world vs. access), flag for advisor.

  **What the Procedure Cannot Do:**
  1. It cannot distinguish between a genuine anomalous experience and a confabulation that is internally consistent without external evidence of contamination.
  2. It may misfire on genuinely confused patients by rejecting their reports as incoherent when they might be having a fragmented but real experience.
  3. It may also misfire on patients who have a rich and coherent experience that is entirely hallucinatory but who are able to critically reflect without breaking the narrative (the procedure will code the world and note the reflections, but it won't downgrade the world-report).
  4. It cannot detect contamination that the patient does not mention and that the coder cannot independently verify (e.g., if the patient overheard something without admitting it).

  **Running the Cases:**

  **Case 1:** 
  Patient says: "I floated near the ceiling and saw the nurse drop a tray, then I knew it wasn't real because nurses never drop trays."

  - Step 1: Coherent? Yes.
  - Step 2: Core narrative: "I floated near the ceiling and saw the nurse drop a tray". The rest is interpretation.
  - Step 3: Stacked report handled: world = [floated near ceiling, saw nurse drop tray]; interpretation = "then I knew it wasn't real because nurses never drop trays" (recorded separately).
  - Step 4: Check contamination: The event (nurse dropping a tray) could have happened. No mention of post-hoc information. So no flag for contamination.
  - Step 5: Describes an external world -> World-Report.
  - Step 6: Structurally coherent, no unease? No unease. Code as world-report.
  - Step 7: No flags.

  **Case 2:**
  Patient describes being in a tunnel with bright lights but then says "and that's probably just the drugs, my mom told me about near-death stuff before the surgery."

  - Step 1: Coherent? Yes.
  - Step 2: Core narrative: "being in a tunnel with bright lights". The rest is interpretation and contamination.
  - Step 3: Stacked: world = [tunnel with bright lights]; interpretation = "that's probably just the drugs" and note the contamination source: "my mom told me about near-death stuff".
  - Step 4: Narrative contamination: Patient explicitly states that they were told about near-death experiences (which include tunnels and lights) before surgery. This suggests the experience might be shaped by prior suggestion. Flag for contamination.
  - Step 5: Describes an external world -> World-Report (but contaminated).
  - Step 6: Code as world-report but with contamination flag.
  - Step 7: No need for additional flags.

  **Case 3:**
  Patient describes a full conversation with a dead relative in perfect detail that matches the hospital room layout they could have heard about through the curtain. They do not mention any source of contamination.

  - Step 1: Coherent? Yes.
  - Step 2: Core narrative: the entire conversation and the details of the room (which are described as part of the experience with the relative).
  - Step 3: No interpretation layer? If there is none, then the world is the entire description. If they say "it felt so real", that would be separated as interpretation.
  - Step 4: Check contamination: The details match what they could have heard, but they don't admit to any post-hoc information. The procedure cannot automatically flag this because there is no explicit admission. However, the coder might note that the details are too accurate and could be contamination. This is a judgment call. The procedure says: if no explicit contamination, then no flag at this step. But the coder feels uneasy.
  - Step 5: World-Report.
  - Step 6: This is the case where the procedure says "code as world-report" but the coder feels uneasy. According to Step 6, code as world-report and note the coder's unease in the comments for the advisor to review.
  - Step 7: Flag for advisor? Not required by the procedure, but the unease is noted. However, if the coder suspects contamination without explicit evidence, they can flag it at Step 7 (as per the final flags rule: when unsure).

  **Final Output for Each Transcript:**
  - Classification: World-Report, Access-Report, or Rejected.
  - Flags: Contamination (explicit), Stacked (with interpretation layers), or Coherence Issue.
  - Comments: For any unease or notes.

  This procedure should be executable in 20 minutes per transcript once practiced.
answer: |-
  Here's a step-by-step decision procedure designed for your requirements. It's structured as a flowchart with clear branching points, hard stops, and timing targets. The focus is on operationalizing Dennett's heterophenomenology while handling stacked reports and contamination.

  ---

  ### **Anesthesia Emergence Coding Procedure (20-min max per transcript)**
  **Core Principle:** Treat the transcript as describing a *subject-reported world* (heterophenomenological world). Never judge truthfulness, only code what's reportable.

  #### **STEP 1: INITIAL COHERENCE CHECK (2 min)**
  - **Ask:** "Can I identify ≥3 discrete events/perceptions in temporal sequence?"  
    - *Yes* → Proceed to Step 2.  
    - *No* → **HARD STOP: Reject transcript** (Mark: "Incoherent - insufficient narrative structure").  
    *Example rejection:* "Colors... pain... then nothing" (no sequence).

  #### **STEP 2: STACKED REPORT DECONSTRUCTION (8 min)**
  - **Task:** Highlight all **A)** World-descriptors (sensory/event details) vs. **B)** Reality-judgments (claims of dream/reality).  
  - **Rules:**  
    - If A and B are *interwoven* (e.g., "I saw a light [A] which was fake [B]"), **split into two columns** (World: "saw a light"; Judgment: "called it fake").  
    - If B *directly modifies A* (e.g., "I dreamed I was flying"), **keep as single unit** (World: "dreamed-flying").  
    - If >40% of sentences mix A/B inseparably → **HARD STOP: Flag for advisor** (Mark: "Unresolvable stacking").  
  - *Continue only if World-descriptors form ≥2 coherent events.*

  #### **STEP 3: CONTAMINATION SCREEN (5 min)**
  - **Ask:** "Does the subject *explicitly reference* postoperative information?"  
    - *Yes* → Isolate those phrases (e.g., "my mom told me...", "I later learned..."). **Do not delete**—bracket as [Contamination].  
    - *No* → Check for *implicit contamination*:  
      - **Red flag:** Details matching *real, non-perceivable* OR events (e.g., surgeon's hidden actions, out-of-view objects).  
      - If found → **HARD STOP: Flag for advisor** (Mark: "Suspected implicit contamination").  
  - *Proceed if World column remains intact.*

  #### **STEP 4: WORLD vs. ACCESS CLASSIFICATION (3 min)**
  - **Ask:** "Does the World column describe an *externalized environment* (objects/people/space)?"  
    - *Yes* → Code as **World-Report** (even if illogical).  
    - *No* → **Code as Access-Report** (if only internal states, e.g., "I felt scared", "I thought I died").  
  - **Exception:** If World *lacks spatial/temporal anchors* (e.g., pure emotions, disjointed sounds) → Re-code as Access-Report.

  #### **STEP 5: CODER UNCERTAINTY CHECK (2 min)**
  - **Ask:** "Does this coding feel *intuitively wrong* despite fitting all rules?"  
    - *Yes* → **Flag for advisor** with reason (e.g., "World-Report but matches external knowledge").  
    - *No* → Finalize coding.

  ---

  ### **Procedure Limitations**
  1. **Misfires on confused patients:** Will reject *genuine fragmented experiences* as "incoherent" (Step 1).  
  2. **Cannot detect unstated contamination:** Relies on explicit admissions or obvious impossibilities.  
  3. **Over-splits psychosis-like reports:** May fragment spiritually meaningful narratives.  
  4. **Misses emotional coherence:** Prioritizes structural logic over affective consistency.

  ---

  ### **Case Applications**
  #### **Case 1:** *"I floated near the ceiling and saw the nurse drop a tray, then I knew it wasn't real because nurses never drop trays."*  
  - **Step 1:** Coherent (3 events: floated → saw drop → knew unreal).  
  - **Step 2:**  
    - World: "floated near ceiling," "saw nurse drop tray"  
    - Judgment: "knew it wasn't real" (split out)  
  - **Step 3:** No contamination.  
  - **Step 4:** World-Report (externalized environment).  
  - **Step 5:** No coder unease.  
  - **Output:** **World-Report** (Judgment noted separately).

  #### **Case 2:** *"I was in a tunnel with bright lights but that's probably just the drugs, my mom told me about near-death stuff before surgery."*  
  - **Step 1:** Coherent (tunnel + lights).  
  - **Step 2:**  
    - World: "in a tunnel with bright lights"  
    - Judgment: "probably just the drugs"  
  - **Step 3:** Explicit contamination ("my mom told me..."). Bracket contamination.  
  - **Step 4:** World-Report (tunnel/lights = externalized).  
  - **Step 5:** Unease? No—contamination handled.  
  - **Output:** **World-Report** [Contamination: mom's comment].

  #### **Case 3 (Problem Case):** *Detailed conversation with dead relative matching hospital layout overheard through curtain.*  
  - **Step 1:** Coherent (conversation + room details).  
  - **Step 2:** World: entire description (no reality-judgments mixed in).  
  - **Step 3:** No *explicit* contamination. Implicit contamination suspected → **HARD STOP: Flag for advisor** ("World-Report matches plausible overheard knowledge").  
  - **Adjudication:** Advisor decides if contamination invalidates the world (likely yes).

  ---

  ### **Output Template per Transcript**
  ```markdown
  [ ] REJECTED (Incoherent)  
  [ ] ACCESS-REPORT (Internal only)  
  [X] WORLD-REPORT  

  CONTAMINATION: [Explicit phrases] / [Suspected: advisor review]  
  STACKED JUDGMENTS: [List separated reality-claims]  
  CODER FLAGS: [Unease reason / Unresolvable stacking]  
  ```

  This procedure gives you auditable consistency while reserving nuanced calls for human review. It strictly avoids truth judgments—treating even "impossible" reports as valid heterophenomenological worlds. For your advisor: Emphasize that contamination flags don't invalidate the *phenomenology*, just qualify its origins.
