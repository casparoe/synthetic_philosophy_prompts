answer: |-
  ### Exam Question: Philosophy of Language (Seminar Final)

  **Time Allowed:** 45 minutes for this question (within a 90-minute exam)  
  **Instructions:** Analyze the scenario below to answer the following questions. Support your reasoning using concepts from our unit on semantic externalism, descriptivism, and the division of linguistic labor. Do not rely on Putnam's water example; engage directly with the "jade" case.  

  **Scenario:**  
  On Earth, the term "jade" is applied by ordinary speakers to objects exhibiting a specific cluster of macro-properties: deep green color, high hardness, and waxy translucency. Earth's mineralogical experts are deeply divided: half argue "jade" refers to a single natural kind (despite two distinct minerals, jadeite and nephrite, exhibiting these properties), while half insist it ambiguously refers to two distinct kinds. Experts agree both minerals share the relevant macro-properties.  

  On Twin Earth, objects with *identical* macro-properties (deep green color, high hardness, waxy translucency) exist. However, the underlying chemical structure is a single, uniform mineral ("twin-jadeite") entirely distinct from both jadeite and nephrite. Twin Earth experts unanimously agree "jade" refers to exactly one natural kind (twin-jadeite). Ordinary speakers on both planets use "jade" identically based on macro-properties and defer to experts about the term's deeper meaning.  

  **Questions:**  
  1.  Do Earth speakers and Twin Earth speakers share the same reference for the word "jade"? Justify your answer.  
  2.  Does the expert disagreement on Earth undermine the semantic externalist claim that the reference of a natural kind term is fixed by the actual structure of the environment? Explain why or why not.  
  3.  Could an internalist descriptivist account (where meaning is determined by associated descriptions in the speaker's mind) successfully explain the reference of "jade" for ordinary Earth speakers *without* claiming most of their "jade" assertions are false?  

  ---

  ### Model Answer (≈700 words)

  **(1) Reference Identity Across Worlds:**  
  No, Earth speakers and Twin Earth speakers do not share the same reference for "jade." Semantic externalism holds that the reference of a natural kind term is fixed by the actual physical nature of the substance(s) in the environment that initiated the term’s use, coupled with the linguistic community's practices of deference. On Twin Earth, the underlying physical kind is definitively a single, uniform mineral (twin-jadeite), and expert consensus solidifies "jade" as rigidly designating this one kind. On Earth, however, the environment contains *two* distinct minerals (jadeite and nephrite) sharing macro-properties. Crucially, expert disagreement about whether "jade" names one kind ambiguously or two kinds reflects an underlying *ontological indeterminacy* in the world itself relative to the term's usage history. Externalism does not require immediate expert consensus; it requires that reference is ultimately determined by the real structure of the world, to which experts (as a community over time) are attempting to answer. Therefore, Earth "jade" either ambiguously refers to two distinct kinds or refers partially to both, but crucially, it does not refer to twin-jadeite. Twin Earth "jade" rigidly designates only twin-jadeite. The identity of macro-properties is insufficient for meaning identity; the actual environmental extensions differ.  

  **(2) Expert Disagreement and Externalist Resilience:**  
  The expert disagreement on Earth does *not* undermine semantic externalism. Externalism asserts that reference is fixed by the objective environment *via* the linguistic practices of the community, particularly the division of linguistic labor. This division means ordinary speakers defer to experts' ability to identify the underlying nature of the kind. The key point is that deference is to the *expert community's epistemic function*, not necessarily to their current consensus. On Earth, the expert disagreement is not mere ignorance; it stems from a genuine feature of the environment – the existence of two distinct minerals with identical macro-properties. The reference of "jade" is therefore *indeterminate* or *partially defined* pending further scientific resolution. It might be that future Earth science concludes "jade" is ambiguous (referring sometimes to jadeite, sometimes to nephrite), or it might be deemed a higher-level kind. Externalism is compatible with such indeterminacy arising from complex environmental facts. The micro-structure (or objective basis) fixes reference, but our *access* to it can be incomplete or contested, reflected in expert debate. This contrasts with Twin Earth, where the uniform environment and expert consensus lead to determinate reference. Externalism is undermined only if reference were completely divorced from the environment; here, the disagreement is *about* the environment's structure, demonstrating its centrality.  

  **(3) Descriptivism's Failure and Reference Catastrophe:**  
  An internalist descriptivist account cannot successfully explain the reference of "jade" for ordinary Earth speakers without committing to massive reference failure. Descriptivism typically holds that "jade" means whatever satisfies the description(s) associated with it in the minds of speakers – likely the cluster of macro-properties: "deep green, hard, translucent stone." If this description fixes reference, then on Earth, it would apply equally to jadeite and nephrite objects. However, on Twin Earth, objects with *identical* macro-properties (made of twin-jadeite) would also satisfy this description. Descriptivism, being internalist, would thus conclude that "jade" means the same on both planets and refers to anything with these properties, including twin-jadeite. This is clearly wrong from an externalist perspective, as established in (1).  

  More catastrophically for descriptivism *on Earth alone*: If "jade" simply means "deep green, hard, translucent stone," then when ordinary Earth speakers point to a nephrite object and say "This is jade," they are correct (it satisfies the description). However, if the descriptivist also tries to incorporate deference ("whatever the experts say it is"), they face contradiction because the experts *disagree*. If half the experts say nephrite isn't *really* jade, then according to the deference clause in the description, half the time when a speaker says "This nephrite is jade," they are wrong. Furthermore, if the description is purely macro-properties, speakers would be referring correctly to nephrite and jadeite, but also incorrectly to look-alikes like green quartz or dyed calcite that match the description – a problem Putnam's stereotype account acknowledges but struggles to solve without externalism. Descriptivism lacks the resources to handle the environmental determination of the *extension* beyond the macro-level and the role of future scientific discovery. It either makes massive error inevitable (if it includes contested expert views) or severs reference from the underlying natural kinds entirely (if it sticks only to macro-properties). Only externalism, with its direct link to the environment and dynamic deference to expertise (even when conflicted), can accommodate the possibility that "jade" on Earth might turn out to be two kinds without implying ordinary speakers are constantly mistaken.  

  ---

  ### Marking Scheme (Total: 25 Marks)

  **A-Level Response (21-25 Marks) MUST Demonstrate:**  
  *   **Clear rejection of reference identity** based on distinct environmental kinds (Earth: 2 minerals/indeterminacy, Twin Earth: 1 mineral) despite macro-property identity.  
  *   **Sophisticated handling of expert disagreement:** Explicitly argues that Earth's expert division *reflects* ontological complexity in the environment, *not* a failure of externalism. Distinguishes deference to the *institution/function* of expertise from deference to current consensus. Acknowledges reference *indeterminacy* on Earth as compatible with externalism.  
  *   **Contrasts Earth/Twin Earth linguistic labor:** Notes Twin Earth's unanimous consensus fixes determinate reference, while Earth's division signifies ongoing investigation into a complex environment.  
  *   **Devastating critique of descriptivism:** Shows descriptivism (relying on macro-properties) *forces* reference identity across worlds (undermining Q1 conclusion). Explains why incorporating deference leads to contradiction/massive error on Earth due to expert disagreement. Clearly states descriptivism cannot avoid claiming either cross-world error or widespread intra-world error for ordinary speakers.  
  *   **Precise terminology:** Correct use of "semantic externalism," "division of linguistic labor," "reference fixation," "rigid designation," "indeterminacy," "internalism," "descriptivism," "extension."  

  **B-Level Response (16-20 Marks) Will Typically:**  
  *   Correctly deny reference identity but with less robust environmental justification.  
  *   Recognize expert disagreement doesn't *automatically* sink externalism but may offer a weaker explanation (e.g., "experts will figure it out" without analyzing the role of environmental complexity). May not fully articulate indeterminacy.  
  *   Identify descriptivism’s problem with Twin Earth (macro-properties lead to incorrect cross-world reference) but give a less developed account of its intra-world failure on Earth, perhaps missing the contradiction introduced by incorporating contested deference.  
  *   Use key terms but with less precision or depth on deference/indeterminacy.  

  **Common Misconceptions (Deduct Marks):**  
  *   **-3/-4:** Treating Earth expert disagreement as *automatically* refuting externalism (e.g., "No micro-structure to fix reference").  
  *   **-2/-3:** Conflating semantic externalism with a simple "causal theory of reference" (mentioning initial baptism without deference/ongoing environmental interaction).  
  *   **-3:** Claiming macro-property identity *is sufficient* for meaning/reference identity across worlds.  
  *   **-2:** Assuming descriptivism succeeds because ordinary speakers only "mean" the macro-properties.  
  *   **-2:** Ignoring the division of linguistic labor entirely in analyzing reference fixation.  
  *   **-1/-2:** Misstating the scenario (e.g., claiming Twin Earth has two minerals, or Earth experts agree).  
  *   **-1/-2 per instance:** Vague use of terminology (e.g., using "externalism" vaguely, misusing "rigid designator").  

  **Mark Allocation:**  
  *   **Q1 (Reference Identity):** 8 marks  
      *   Correct answer (No): 2 marks  
      *   Justification (Distinct env. kinds, macro-props insufficient): 4 marks  
      *   Role of linguistic labor/deference: 2 marks  
  *   **Q2 (Expert Disagreement & Externalism):** 8 marks  
      *   Correct stance (Does not undermine): 2 marks  
      *   Analysis tying disagreement to environmental complexity/indeterminacy: 3 marks  
      *   Explanation of deference to function/community vs. consensus: 3 marks  
  *   **Q3 (Descriptivism's Failure):** 9 marks  
      *   Identifies Twin Earth problem (Ref. identity via macro-descriptions): 3 marks  
      *   Explains intra-world failure on Earth (Contradiction/error due to expert disagreement if deference included; massive error if not): 4 marks  
      *   Contrast with how externalism avoids this: 2 marks
