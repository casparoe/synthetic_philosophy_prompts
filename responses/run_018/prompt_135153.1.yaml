    - **Leaf: Elective Affinity Interpretation**  
      Protestantism and capitalism co-evolve via structural compatibility (not direct causation). Culture "causes" by creating affinity (e.g., ascetic values align with capital accumulation). Material conditions are necessary but not sufficient; instrumentally rational systems emerge from value-rational cultural roots.  

