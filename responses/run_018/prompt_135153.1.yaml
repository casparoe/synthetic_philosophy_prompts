  *Claims culture can "cause" through systemic/structural forces (e.g., institutions, norms), not individual psychology.*  
  **Branch Claim:** *Material conditions were necessary for capitalism.*  
  - **If YES** (material conditions necessary), go to **B1**.  
  - **If NO** (material conditions unnecessary; culture alone could cause capitalism), go to **B2**.  

