  **Branch Claim:** *Material conditions (e.g., markets, technology) were necessary for capitalism to emerge.*  
  - **If YES** (material conditions necessary), go to **A1**.  
  - **If NO** (material conditions unnecessary; culture alone could cause capitalism), go to **A2**.  

  **A1: Material Conditions Necessary**  
  *Weber's thesis implies material conditions are a prerequisite, but culture adds something essential.*  
  **Split Claim:** *Weber argued Protestantism was strictly necessary for capitalism (without it, capitalism wouldn't have arisen).*  
  - **If YES**:  
    - **Leaf: Conjunctural Necessity (Unnamed)**  
      *Why awkward?* Weber never claims Protestantism is *strictly* necessary, and this view ignores his emphasis on capitalism's complexity. Combines individual causation + material necessity awkwardly.  
  - **If NO**:  
    - **Leaf: Methodological Individualist Interpretation**  
      Protestantism is one contributing factor among many (not sufficient or strictly necessary). Culture "causes" by shaping individual value-rational actions (e.g., working for God's glory), which later become instrumentally rational habits (e.g., profit-seeking). Material conditions enable but don't suffice.  

  **A2: Material Conditions Unnecessary**  
  *Culture alone could drive capitalism via individual actions.*  
  **Split Claim:** *Weber argued Protestantism was sufficient for capitalism (wherever it spread, capitalism would follow).*  
  - **If YES**:  
