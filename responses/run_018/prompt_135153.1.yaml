  **Split Claim:** *Weber argued Protestantism was sufficient for capitalism.*  
  - **If YES**:  
    - **Leaf: Strong Structuralism (Unnamed)**  
      *Why awkward?* Denies material factors Weber references (e.g., law, technology) and reduces his thesis to cultural determinism.  
  - **If NO**:  
    - **Leaf: Materialist "Values as Superstructure" Rejection**  
      Culture cannot cause anything; it's a byproduct of material conditions. Protestantism merely correlates with capitalism but is epiphenomenal (e.g., values "in people's heads" don't push economies). Weber’s thesis describes ideology, not causation.  

  ---

  ### Key Notes:
  - **Inseparable Pairs**:  
    1. **Methodological Individualist** (A1-NO) and **Elective Affinity** (B1-NO) both treat culture as a contributing factor, but the tree separates them based on subjective meanings. They overlap in practice, as elective affinity can include individual actions.  
    2. **Materialist Rejection** (B2-NO) and **Strong Structuralism** (B2-YES) both deny individual causation, but the tree splits them on sufficiency. They are hard to distinguish in Weber exegesis.  
  - **Value-Rational vs. Instrumentally Rational**: Used in **Methodological Individualist** to split how beliefs evolve (value-rational action → instrumentally rational habits). Not needed elsewhere, as other leaves don’t hinge on this distinction.  
  - **Leaf Count**: 7 leaves (5 named/unnamed interpretations + 2 rejections). Materialist Rejection is included as a named position opposing Weber.  
  - **Awkward Leaves**: All "unnamed" leaves conflict with Weber’s text (e.g., he denies sufficiency/necessity, affirms material factors).  

  This tree isolates core debates: whether culture requires individual minds to "cause," how it interacts with materiality, and how strongly Weber ties Protestantism to capitalism. Use it to map your stance or your friend's!
