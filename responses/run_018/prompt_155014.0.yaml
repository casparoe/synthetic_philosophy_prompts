answer: |-
  Your hypothesis cuts to the core of the naturalism-normativism impasse. The debate *is* static because, as you suspect, the sides are entangled in ambiguities surrounding "function" and are often pursuing distinct, though overlapping, projects under the single banner of "health." Let's diagnose using their core concepts:

  1.  **The Ambiguity of "Function":**
      *   **Naturalism (Boorse):** Explicitly adopts a *causal-role* (C-R) account. Function is defined by the *current* causal contribution of a part (organ, process) to the organism's overall goals of survival and reproduction ("reference class fitness"). For example, the heart's function is pumping blood because that activity contributes causally to survival/reproduction *now*.
      *   **The Slide:** However, the selection of *which* causal contributions count as "functional" (and crucially, what constitutes "species-typical functioning") is implicitly guided by an understanding of *what the part evolved to do* (a *selected-effect* or S-E account). Why is pumping blood the heart's function and not making sounds? Because that's what it was *selected for*. The statistical "normal range" isn't arbitrary; it's anchored around a range deemed *biologically adequate* for the part to perform its evolutionarily significant causal role. When Boorse defines "disease" as a statistically subnormal part-function relative to the age/sex reference class, the standard of "subnormal" isn't purely statistical (e.g., having 5 fingers isn't "disease" even if 6 is statistically rare; having sickle-shaped RBCs *is* disease even if prevalent in malaria zones). The evolutionary S-E account silently provides the norm against which the statistical C-R contribution is judged.
      *   **Normativism (Nordenfelt):** Explicitly *rejects* biological function (both S-E and C-R) as the basis for health. Health is defined solely by the ability to achieve "vital goals" – goals necessary for minimal happiness. The function of a part is purely instrumental: whatever it needs to do to enable the individual to reach *their* vital goals. The heart "functions" insofar as it allows the person to pursue their chosen life plan.
      *   **The Implicit Teleology:** Yet, Nordenfelt's "vital goals" (like survival, avoiding suffering, basic mobility, communication) are not purely subjective social constructs. They are deeply constrained by human biology. The *need* for hydration, oxygen, avoiding tissue damage, etc., is rooted in our evolved physiology. While the *specific* life plan is individual, the *preconditions* (vital goals) necessary to pursue *any* plan are fundamentally biological and reflect the same teleology (survival, flourishing) that naturalists rely on, even if normativists deny grounding them in evolutionary history. They reject S-E/S-C function as *foundational*, but their "vital goals" functionally (pun intended) rely on a biological teleology they disavow.

  2.  **Statistical Normality:**
      *   **Naturalism:** Statistical normality is *central*. It defines the baseline for "species-typical functioning." Disease is *statistical* subnormality in a biologically significant function. This allows objectivity but faces the critique: why is the statistical norm (especially in populations with high disease burdens) the *right* norm? The answer, implicitly, relies on the S-E account – the norm is what was typical in the *evolutionary environment* or what supports the *evolutionary goals*.
      *   **Normativism:** Statistical normality is largely *irrelevant*. A statistically rare ability (e.g., exceptional pain tolerance) isn't unhealthy. A statistically common limitation (e.g., widespread myopia in a modern society) can still be unhealthy if it impedes vital goals. Health is judged solely against the individual's goals, not population averages. This avoids the "statistical trap" but sacrifices objectivity and struggles to define "vital goals" without referencing biological norms.

  3.  **Vital Goals:**
      *   **Naturalism:** Vital goals are fixed by biology: survival and reproduction. They are objective facts about organisms. Parts function to serve *these* goals. This provides clear anchoring but is criticized as reductionist and irrelevant to modern medicine (e.g., infertility as disease?).
      *   **Normativism:** Vital goals are set by the individual, informed by society and culture, representing what is necessary for their minimal happiness. This makes health relevant to human experience and values but risks subjectivity, infinite regress (what defines "minimal happiness"?), and difficulty distinguishing health from other forms of disadvantage or social oppression.

  **Diagnosis: Beyond Ambiguity to Divergent Projects**

  The ambiguity in "function" is a significant symptom, but the deeper issue is that **the two sides are primarily answering different questions:**

  *   **Naturalism answers a metaphysical/biological classification question:** "What is the objectively identifiable state of an organism's parts relative to their evolutionarily established, species-typical contribution to survival and reproduction?" It aims for a *value-free scientific taxonomy* of physiological states. Boorse sees disease as an internal state statistically deviating from this biological norm.
  *   **Normativism answers a normative/practical question about agency and intervention:** "What conditions warrant the label 'illness' and justify clinical attention or social accommodation?" It focuses on the *experienced ability* of the *whole person* to pursue life goals deemed vital *to them*, necessitating value judgments about well-being and the goals of medicine. Nordenfelt sees illness as an inability to achieve vital goals, regardless of the underlying biological state.

  While both use the word "health," naturalism defines it as the *absence of pathological states* (a biological condition), while normativism defines it as the *presence of ability* (a normative condition for agency). The debate is static because each side's critiques often miss the other's core project. Naturalists accuse normativists of subjectivism when the latter are focused on clinical relevance. Normativists accuse naturalists of biological reductionism when the latter are focused on physiological classification.

  **What Counts as Progress?**

  Given this diagnosis, progress likely lies in **conceptual clarification that dissolves the problem by recognizing the distinct projects:**

  1.  **Formal Distinction & Conceptual Clarification:** Explicitly distinguishing between:
      *   **Biological Dysfunction:** A state of statistically subnormal performance of a part relative to its evolutionarily significant causal role (Boorsean Naturalism, acknowledging the S-E/C-R interplay). This is a *scientific* concept.
      *   **Illness/Need for Clinical Intervention:** A state where an individual experiences suffering, disability, or inability to achieve vital goals significant enough to warrant medical attention or social support (Nordenfelt Normativism, acknowledging the biological constraints on "vital goals"). This is a *clinical/practical/normative* concept.
      Recognizing that "dysfunction" ≠ "illness" is crucial. One can have a dysfunction without illness (early cancer, mild hypertension) and illness without clear biological dysfunction (some chronic pain syndromes, functional disorders). This dissolves the "either/or" conflict.

  2.  **Empirical Study (Informed by Clarification):** Progress would involve studying *how these concepts interact in practice*. How do clinicians actually use statistical norms, evolutionary understanding, *and* patient values/goals when diagnosing and treating?
      *   How are "borderline" cases (e.g., mild cognitive impairment, age-related decline, statistically common but impairing conditions like myopia) negotiated? Does recognizing the distinction between dysfunction and illness help?
      *   How are "vital goals" identified and weighed against biological measures? Does this reveal shared implicit biological norms even within the normativist framework?

  3.  **Pluralism, not Incommensurability:** The questions are *different*, not strictly incommensurable. They address different levels: biological parts vs. whole person agency; classification vs. intervention. Progress involves building a *bridge*, not declaring one side right. A pluralistic framework acknowledges:
      *   Biological dysfunction provides crucial, objective information about physiological states.
      *   The judgment of illness and the decision to intervene inherently involve values and the individual's life context and goals.
      *   Clinical medicine operates at the intersection: it uses biological knowledge *informed by* the normative goal of promoting patient well-being and agency (vital goals).

  **Conclusion:**

  The core issue is not solely the ambiguity in "function," though that is a critical symptom. The fundamental reason for the static debate is that naturalism and normativism are primarily addressing distinct, though deeply interrelated, questions: "What is a biologically abnormal state?" vs. "What condition warrants the label 'illness' and clinical/social response?" Progress lies in clearly distinguishing these concepts (biological dysfunction vs. illness), acknowledging their different foundations (scientific classification vs. normative practice), and exploring how they interact in real-world medicine. Empirical study of clinical decision-making, informed by this clarified conceptual framework, offers the most promising path forward, moving beyond the sterile opposition towards a more nuanced understanding of health, disease, and the practice of medicine. Your career experience with the practicalities of defining "normal" ranges uniquely positions you to appreciate the need for this bridge between biological measurement and the lived reality of health and illness.
