answer: |-
  ### Gibbard-Satterthwaite Risk Assessment Framework  
  *For Voting Rule Evaluation in Funding Proposal Rankings*  

  **Core Problem**: The Gibbard-Satterthwaite theorem proves *any* voting system with ≥3 options can be manipulated if preferences aren't restricted. This procedure checks if your specific setup avoids the theorem's conditions or accepts unavoidable risks.  

  ---

  #### **Decision Procedure**  
  *Run these steps in order. Stop at any gate with a verdict.*

  ##### **Gate 1: Domain Restrictions Check**  
  *Goal: Can preferences be "naturally constrained" to avoid manipulation?*  
  - **Check 1.1**: Are there **exactly 2 proposals**?  
    - *Yes* → Proceed to Gate 3 (2-option systems avoid Gibbard-Satterthwaite).  
    - *No* (≥3 proposals) → Go to Check 1.2.  
  - **Check 1.2**: Are preferences provably **single-peaked**? (i.e., all voters rank proposals on a shared left/right spectrum).  
    - *Test*: Ask domain experts: "If we arrange proposals on a line (e.g., low-risk to high-risk), would every voter’s ranking fall along this line without jumps?"  
    - *Sufficient evidence*: Historical voting data showing consistent linear patterns, or proposals addressing scalar issues (e.g., funding amounts).  
    - **Result**:  
      - ✅ **Conclusive YES** → Proceed to Gate 2.  
      - ❌ **Uncertain/NO** → Skip to Gate 4 (domain restrictions fail).  

  ##### **Gate 2: Strategy-Proofness Verification**  
  *Goal: Does your rule align with a known strategy-proof mechanism for your domain?*  
  - **Check 2.1**: With single-peaked preferences, is your rule the **median voter mechanism**? (i.e., the median-ranked proposal wins).  
    - *Test*: Does your aggregation always pick the proposal ranked in the middle of the ordered list?  
    - **Result**:  
      - ✅ **YES** → **"SHIP IT"** (theorem conditions avoided).  
      - ❌ **NO** → Go to Gate 4 (manipulation risk unavoidable).  

  ##### **Gate 3: Dictatorship Check**  
  *Goal: Ensure non-dictatorship.*  
  - **Check 3.1**: Is there **one voter** whose top choice always wins?  
    - *Test*: Simulate votes where all others oppose this voter. Does their preference still win 100% of the time?  
    - **Result**:  
      - ✅ **NO** → Proceed to Gate 5.  
      - ❌ **YES** → **"STOP, REDESIGN"** (unacceptable centralization).  

  ##### **Gate 4: Gibbard-Satterthwaite Inevitability**  
  *Goal: Accept that manipulation is possible.*  
  - **Check 4.1**: Are there **≥3 proposals** AND **no domain restrictions** (from Gate 1)?  
    - **Result**:  
      - ✅ **YES** → **Manipulation is unavoidable** by theorem. Proceed to Gate 5.  

  ##### **Gate 5: Risk Mitigation Assessment**  
  *Goal: Quantify manipulation risk and accept/reject.*  
  - **Check 5.1**: Is manipulation **computationally hard**?  
    - *Test*: Can a single voter easily calculate a lying strategy?  
      - *Plurality/weighted schemes*: Trivial (bury strong rivals).  
      - *Instant-runoff*: Hard (NP-complete in some cases).  
    - **Result**:  
      - ✅ **Hard to manipulate** → **"SHIP WITH MONITORING"** (low risk).  
      - ❌ **Easy to manipulate** → Proceed to Check 5.2.  
  - **Check 5.2**: **Human override**: Can you accept manipulation risks due to:  
    - Low-stakes outcomes?  
    - Trusted voters (e.g., senior maintainers)?  
    - Mitigations (e.g., reveal votes publicly)?  
    - **Result**:  
      - ✅ **YES** → **"SHIP WITH POLITICAL ACCEPTANCE"** (acknowledge tradeoff).  
      - ❌ **NO** → **"STOP, REDESIGN"**.  

  ---

  ### **Application to Your Voting Rules**  
  *(Assuming ≥3 proposals and no single-peakedness)*  

  #### 1. **Plain Plurality Vote**  
  - **Gate 1**: ❌ (No domain restrictions) → Skip to Gate 4.  
  - **Gate 4**: ✅ (Manipulation unavoidable).  
  - **Gate 5.1**: ❌ (Trivial to manipulate: bury true favorite to beat a rival).  
  - **Gate 5.2**: Human override needed.  
    - **Verdict**: ❌ **"STOP, REDESIGN"** (High risk; trivial to game).  

  #### 2. **Instant-Runoff Ranked Choice**  
  - **Gate 1**: ❌ → Skip to Gate 4.  
  - **Gate 4**: ✅ (Manipulation unavoidable).  
  - **Gate 5.1**: ✅ (NP-hard to find optimal manipulation strategy).  
  - **Verdict**: ✅ **"SHIP WITH MONITORING"** (Low practical risk).  

  #### 3. **Custom Weighted Scheme (Senior = 2x Points)**  
  - **Gate 1**: ❌ → Skip to Gate 4.  
  - **Gate 4**: ✅ (Manipulation unavoidable).  
  - **Gate 5.1**: ❌ (Easy to manipulate: seniors can bury threats; coalitions form).  
  - **Gate 5.2**: **Human override required**  
    - *Why you’ll hate this*: Senior influence creates hierarchy (non-egalitarian) but may be necessary for governance.  
    - *Political reality*: If senior buy-in is critical, override = **YES**.  
    - **Verdict**: ✅ **"SHIP WITH POLITICAL ACCEPTANCE"** (Accept bias/risk for stability).  

  ---

  ### **Key Outputs per Gate**  
  | **Gate**       | Checkable in Code? | Output on Fail              | Output on Pass               |  
  |----------------|---------------------|----------------------------|------------------------------|  
  | 1.1 (2 options)| ✅                  | Proceed to Gate 3          | N/A                          |  
  | 1.2 (Domain)   | ❌ (Judgment)       | Go to Gate 4               | Proceed to Gate 2            |  
  | 2.1 (Mechanism)| ✅                  | Go to Gate 4               | **SHIP IT**                  |  
  | 3.1 (Dictator) | ✅                  | **STOP, REDESIGN**         | Proceed to Gate 5            |  
  | 4.1 (Theorem)  | ✅                  | Proceed to Gate 5          | **SHIP IT** (never happens)  |  
  | 5.1 (Hardness) | ✅ (Simulate)       | Go to 5.2 (Human)          | **SHIP WITH MONITORING**     |  
  | 5.2 (Override) | ❌ (Judgment)       | **STOP, REDESIGN**         | **SHIP WITH ACCEPTANCE**     |  

  ### **Critical Human Judgment Calls**  
  1. **Gate 1.2**: Is the domain *sufficiently* single-peaked? (Requires qualitative analysis).  
  2. **Gate 5.2**: Is the social cost of manipulation worth the rule’s benefits? (Values decision).  

  ### **Monday Action Plan**  
  1. Run **Gate 1.1**: Confirm number of proposals.  
  2. If ≥3, **bypass paperwork** by assuming *no domain restrictions* (Gate 1.2 → ❌).  
  3. For your weighted scheme:  
     - Acknowledge **Gate 4** (manipulation guaranteed).  
     - Use **Gate 5.2** for political override: *"We accept senior influence bias to maintain ecosystem trust."*  
  4. Reject plurality; accept instant-runoff.  

  **Final Warning**: The weighted scheme *will* be gamed long-term. Mitigate by ceding to Gate 5.2’s judgment and logging all votes for audits.
