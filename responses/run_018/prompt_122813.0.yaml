answer: |-
  Here is a mapped analysis of the Nuremberg/Tokyo tribunals through the legality principle lens, using your requested frameworks and avoiding prescribed conclusions:

  **Analysis**

  The Nuremberg and Tokyo tribunals present a complex, multi-layered challenge to the legality principle (*nullum crimen sine lege*). This principle demands that individuals can only be punished for conduct clearly defined as criminal *before* its commission, ensuring fair notice and constraining state power. Applying it rigorously to these tribunals requires dissecting the three retroactive elements you identified:

  1.  **Retroactive Crime Creation:** This is the core challenge. Crimes Against Peace (aggressive war) and Crimes Against Humanity (systematic persecution) were novel charges lacking precise pre-existing *international* criminal definitions applicable to individuals. While the *moral* condemnation existed, the formal *legal* codification as individual criminal offenses was largely achieved *ex post facto*. This directly challenges Rung 1 (simple relabeling) and pushes into Rung 2 or 3. The tribunals argued these crimes existed implicitly in treaties (Kellogg-Briand Pact outlawing war) and customary international law condemning atrocities. Critics countered that this customary law was insufficiently specific and state-focused, not clearly establishing *individual criminal liability* pre-1945.

  2.  **Retroactive Removal of Superior Orders Defense:** This is distinct from crime creation. Most defendants' domestic military codes (German, Japanese) explicitly allowed or mandated obedience to orders, often treating refusal as a crime itself. The tribunals retroactively declared that superior orders were not an absolute defense, especially for manifestly illegal acts ("known or should have known"). This wasn't inventing a *crime*, but retroactively *removing a potential defense* recognized under the laws the defendants operated under. It significantly altered the legal consequences of their conduct. This is a separate legality challenge concerning the retroactive alteration of rules governing culpability, not the definition of the underlying act.

  3.  **Retroactive Jurisdictional Innovation:** The principle primarily governs substantive criminal law, not jurisdiction *per se*. However, the unprecedented assertion of international criminal jurisdiction over state officials, including heads of state, by victor states was a radical innovation. While the legality principle doesn't directly prohibit new *forums*, the lack of a pre-existing, widely accepted international criminal court with such jurisdiction fuels the "victors' justice" critique. The principle's concern with fair notice might indirectly touch this if the defendants genuinely believed their actions were immune from *any* external legal challenge – a belief arguably fostered by the pre-existing state sovereignty norms.

  **Applying the Ladder (Rung 1-4):**
  *   **War Crimes:** **Rung 2.** The underlying acts (murder, torture, inhumane treatment of POWs/civilians) were clearly criminal under the defendants' own domestic laws (German Penal Code, Japanese Military Codes) and under the well-established international laws of war (Hague Conventions, Geneva Conventions 1929). Charging them as "war crimes" was a re-contextualization within an international armed conflict framework, but the core prohibitions existed.
  *   **Crimes Against Humanity:** **Rung 3.** The systematic persecution/murder of civilians was widely condemned *morally and politically* (especially Nazi persecution of Jews) long before 1945. However, its codification as an *international crime* directly applicable to individuals, distinct from war crimes and applicable potentially outside an international armed conflict context, was novel. The London Charter created this category explicitly.
  *   **Crimes Against Peace (Aggressive War):** **Rung 3/4.** Kellogg-Briand Pact (1928) *outlawed war* as an instrument of policy between states. However, translating this *inter-state* treaty obligation into *individual criminal liability* for leaders was a major innovation. Significant debate existed pre-1945 about whether aggressive war was a *crime* for which individuals could be prosecuted, or merely an *illegal act* triggering state responsibility. Placing it firmly on Rung 3 relies heavily on interpreting Kellogg-Briand and related state practice/condemnation as establishing individual criminality. Others argue it was closer to Rung 4 for key defendants (e.g., initiating war in 1939).
  *   **Conspiracy/Common Plan:** **Rung 1/2 (for Aggressive War); Rung 3/4 (for Crimes Against Humanity).** Applied to Crimes Against Peace, conspiracy was argued to exist within German domestic law concepts (*Verbrecherischer Verband*). Applied to Crimes Against Humanity (especially the Holocaust planning), it was a novel application at the international level for systemic atrocities. Its scope was controversial even at Nuremberg.

  **The Ladder's Utility:** The ladder usefully forces differentiation based on the *degree of novelty* regarding the underlying conduct's criminality under the defendant's own system or widely understood norms. It highlights that War Crimes (Rung 2) pose the *least* legality concern, while Crimes Against Humanity and Aggressive War (Rung 3, potentially 4) pose significantly more. However, it doesn't fully resolve the core debate: whether widespread moral condemnation and nascent legal principles (Rung 3) constitute sufficient "law" under *nullum crimen*. It also struggles with jurisdictional shifts and defense removals.

  **The Swap Test:**
  Applying the *exact same legal doctrines* used by the Allies to prosecute Axis leaders to Allied leaders would have produced prosecutions for:
  *   **Area Bombing & Atomic Bombs:** Charged as War Crimes (indiscriminate attacks on civilians) and/or Crimes Against Humanity (systematic devastation of cities causing immense civilian suffering), especially under the broad interpretations used at Tokyo.
  *   **Soviet Actions:** Katyn massacre, conduct in Eastern Europe potentially as Crimes Against Humanity/War Crimes.
  *   **Non-Prosecution of Hirohito:** Explicitly shielded by MacArthur/SCAP, despite potential liability under Crimes Against Peace/War Crimes doctrines applied to others.

  **What the Swap Test Shows:** It primarily demonstrates **asymmetry inherent in victor-constituted tribunals**, not necessarily the inherent *corruption* of the legal doctrines *themselves*. The legality principle focuses on notice and pre-existing law for the *defendant*, not on universal, symmetrical application. The Swap Test reveals that *political realities* (victor immunity, necessity of cooperation, Cold War pressures) prevented the application of the newly articulated doctrines universally. It highlights that the tribunals were not pure exercises in neutral legalism but instruments of the victors' political and moral judgment. The test doesn't *invalidate* the principle of individual accountability for atrocities, but it starkly exposes the limitations and selectivity of *this specific implementation*. It underscores that the legality principle wasn't designed to address the political power imbalances that determine *who* gets prosecuted.

  **What the Tribunals Show About the Legality Principle:**
  The tribunals represent primarily an **unanticipated case** for the legality principle. The principle evolved primarily in *domestic* contexts to constrain state power over citizens within a stable legal order. It didn't anticipate:
  1.  Individuals wielding *state power* to dismantle legality itself domestically (Nazi Germany).
  2.  The need for an *international* response to atrocities of unprecedented scale where domestic systems were complicit or destroyed.
  3.  The absence of a pre-existing international criminal court or fully codified international criminal law.

  The tribunals argued defendants had **adequate notice** in a broad sense – they knew the core acts (murder, enslavement, aggressive conquest) were profoundly wrong and violated fundamental moral and legal principles recognized by civilized nations (affirming the principle). Critics argued notice was **contested/absent** regarding the specific *international criminal* character and individual liability, especially for Crimes Against Peace and Humanity (challenging the principle).

  The **Radbruch Formula** (extremely unjust law is not law) is invoked to overcome retroactivity concerns. While powerful morally, it is generally **a way of changing the subject** legally. The legality principle is a formal doctrine designed for predictability and restraint. Radbruch introduces a substantive moral override. Using it retroactively risks arbitrariness – who defines "extreme injustice"? It moves the debate from "was the law clear?" to "was the regime evil enough?", which is precisely what the legality principle seeks to avoid. It might justify overthrowing an unjust regime but provides shaky ground for *retroactive criminal punishment* under new laws.

