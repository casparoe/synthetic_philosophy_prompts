  | Crimes Against Peace          | 3/4         | Partial (Kellogg-Briand)        | Contested      | Fails     | Use cautiously; require clear evidence of intentional aggressive war planning; link to domestic treason/security crimes if possible. |
  | War Crimes                    | 2           | Yes                             | Adequate       | Fails     | Prosecute robustly under existing domestic penal code provisions mirroring IHL violations. |
  | Crimes Against Humanity       | 3           | Partial (Murder/Torture laws)   | Contested      | Fails     | Define narrowly based on systematicity; anchor core acts in existing domestic crimes; avoid overreach. |
  | Conspiracy (Aggressive War)   | 2           | Partial (German law concepts)   | Contested      | Fails     | Use sparingly; require concrete evidence of explicit joint plan for illegal war. |
  | Conspiracy (Crimes Humanity) | 3/4         | No                              | Absent         | Fails     | Avoid or define extremely narrowly for specific atrocity campaigns with documented planning. |
  | Superior Orders Defense       | N/A (Defense) | Yes                             | Adequate       | Unclear   | Reject as absolute defense; codify manifest illegality standard clearly in statute. |
  | Non-prosecution of Victors    | N/A (Policy) | N/A                             | N/A            | Fails     | Acknowledge limitation; focus on prosecutable offenders within jurisdiction; avoid doctrines requiring universal application. |

