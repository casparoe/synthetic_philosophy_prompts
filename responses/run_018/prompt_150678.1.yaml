  First, I need to unpack what computationalism actually claims: representations as mental content, algorithms as cognitive processes, hardware/software distinction for brain/mind. Then I have to translate each piece strictly into jazz ensemble mechanics - no cheating with computational terms. 

  Hmm... lead sheets as representations makes sense - they're the shared structure. Chord changes as input data flow, trading fours as parallel processing. But where does emotion fit? A computer doesn't feel the groove when the bassist locks in. And that moment when a "wrong" note becomes a motif - that's emergent meaning, not algorithmic. 

  *scribbles mental notes* The residue report will be crucial here. Things like consciousness and qualia (the redness of red, the ache of sadness) have no parallel in sheet music. Either my musical framework is limited... or maybe the computer metaphor was always incomplete. 

