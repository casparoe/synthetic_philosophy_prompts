prompt: |-
  I've been argueing with a friend about the color phi illusion — red dot flashed on the left, green dot flashed on the right a little later, and people swear they see a single dot moving across that turns green roughly halfway, even though the green wasn't in the world yet at the point where the color change is seen. Dennett's way of setting this up is the Orwellian vs. Stalinesque distinction: either you really did consciously see a lone red dot on the left and your memory got rewritten after the second flash (Orwellian), or your whole experience was held back and stitched together only after the second flash arrived, so you never consciously saw a lone red dot at all (Stalinesque). The annoying thing is that in the standard display the two stories make exactly the same prediction about what you say afterwards.

  I want a thought experiment that at least splits the naive versions of the two stories. Build me a case where an Orwellian account and a Stalinesque account of a temporal illusion make opposite predictions about a peripheral measure — not the subject's final retrospective verbal report — even though both accounts still predict the same final description of what was seen. I'd like the split to go in this direction: before the second flash appears, the Orwellian account says the subject can make a correct speeded judgment about some feature of the first flash (color, location, whether it happened), while the Stalinesque account says there is no conscious version of the first flash available yet, so the subject should be at chance or noticeably slower on the same judgment. Constraints: extend the color-phi display or a close cousin of it; no single-cell recordings, no exotic physics, no perfect timing beyond what a normal human lab can do; the measure has to be something a real person could actually produce — reaction time, forced choice under a deadline, confidence ratings, catching an omitted second flash, that sort of thing. Don't strawman either account: the Orwellian memory editor gets a realistic editing speed and the Stalinesque buffer gets a realistic delay, and the split has to survive those concessions.

  Then lay out the scenario, walk through what each account says the subject is conscious of at each timepoint, what each predicts for the measure and why, and identify the single structural feature of the case that is doing the work. If that feature were removed, would the case collapse back into the original color phi where the two stories cannot be told apart? Finish with what a Dennett-style multiple-drafts theorist would say about whether the apparent divergence really settles anything, or what adjustment they'd make to absorb your result.
reasoning: |-
  We are going to design a thought experiment that differentiates between Orwellian and Stalinesque accounts of the color phi illusion by using a speeded judgment about the first flash before the second flash occurs.

  The key idea: In the Orwellian account, the first flash is consciously perceived as it happens, and then the memory is rewritten after the second flash. Therefore, during the interval between the first and second flash, the subject should be able to report on the first flash correctly. In the Stalinesque account, the conscious experience of the first flash is delayed until after the second flash (so that the whole event can be stitched together). Therefore, during the interval between the two flashes, the subject should not have a conscious experience of the first flash and thus should not be able to report on it (or be at chance or slower).

  We need a measure that can be taken during the interval between the two flashes. We can use a speeded forced-choice judgment about the first flash, with a response deadline set before the second flash appears.

  Scenario:

  1. We present a sequence of two flashes, but we introduce a variable delay between the first and second flash. We will focus on trials with a relatively long delay (say, 300 ms) to allow time for a response.

  2. On each trial, the first flash appears at a location. We will vary the color of the first flash (say, red or green) randomly from trial to trial.

  3. The subject's task is to report the color of the first flash as quickly as possible, with a response deadline set to be before the second flash appears. We can set the deadline at, for example, 250 ms after the first flash (so the second flash appears at 300 ms). This forces the subject to respond within 250 ms.

  4. The second flash will always appear at a different location (to the right) and will have a fixed color (say, green). However, note that in the color phi illusion, the second flash is typically green and the first red, but in our case we are varying the first flash.

  5. But note: if we vary the first flash, then the subject's eventual report (after the second flash) might be influenced by the illusion. However, we are not relying on that report for the critical measure. We are relying on the speeded response during the interval.

  6. We also include catch trials: on some trials, there is no second flash. On these trials, the subject is still required to make a speeded response about the first flash (within 250 ms) and then later (after a longer interval) report what they saw.

  7. The critical comparison is between the accuracy and reaction time of the speeded response on trials with a second flash (which we hope will induce the phi illusion) and on catch trials (without a second flash). But note: the speeded response must be made before the second flash would have appeared, so on trials with a second flash, the subject is responding before the second flash.

  8. The two accounts make different predictions:

     - Orwellian: The first flash is consciously perceived as it happens. Therefore, during the interval, the subject can report its color accurately and quickly. This should hold regardless of whether a second flash is coming or not. So, on trials with a second flash, the subject should be able to report the color of the first flash correctly in the speeded task (and then later, after the second flash, the memory is rewritten so that the subject might report seeing the color change). Similarly, on catch trials, the subject reports correctly in the speeded task and then later (without a second flash) reports just the first flash.

     - Stalinesque: The conscious experience of the first flash is delayed until after the second flash arrives. Therefore, during the interval (before the second flash), the subject has no conscious experience of the first flash. Hence, when we ask for a speeded response, the subject is forced to guess (or the response is based on unconscious information, which might be slower and less accurate). So, on trials with a second flash, the speeded response should be at chance (or with reduced accuracy and/or slower RT) for the color of the first flash. However, on catch trials (where there is no second flash), the system might eventually become conscious of the first flash (because there is nothing to wait for), so the subject can later report the first flash. But note: the speeded response on catch trials is also required within 250 ms. Since there is no second flash, the Stalinesque system might not hold the experience back for long? However, the Stalinesque account in the standard color phi has a fixed delay for stitching? We must assume that the Stalinesque mechanism holds the processing until a reasonable time for the second flash has passed. Therefore, in the catch trials, the system would not release the experience until after the time when the second flash would have been expected (say 300 ms). Therefore, at 250 ms, the subject would still not have a conscious experience of the first flash. Hence, the speeded response on catch trials would also be at chance (or impaired).

     However, we want the Stalinesque account to predict a difference between the two trial types? Actually, in the Stalinesque account, there is no difference in the processing of the first flash between the two trial types until the time when the second flash would have occurred. Therefore, in both types of trials, at 250 ms (before the second flash would have occurred) the subject would not have a conscious experience of the first flash. So the prediction is that the speeded response is equally impaired in both conditions.

     This does not split the two accounts as cleanly as we would like because the Orwellian account predicts good performance in both, and the Stalinesque account predicts poor performance in both.

     We need to adjust so that the Stalinesque account predicts a difference: let's change the design.

  Alternative design:

  Instead of having the same fixed delay on every trial, we use a variable delay, but we also include a cue that indicates whether the trial will be a two-flash trial or a one-flash trial. However, that might be too complex and also the cue might interfere.

  Another idea: use the same display as color phi, but occasionally omit the second flash. And we ask for a speeded response about the first flash (its color) during the interval. The critical point is that the subject doesn't know in advance whether the second flash is coming.

  But then the Stalinesque system, by definition, holds the first flash until it can determine if there's a second flash. Since the second flash might come, it holds the experience until the time window for the second flash has passed. Therefore, during the interval (before the second flash would appear) the subject has no conscious experience of the first flash. So the speeded response (before the second flash) should be impaired regardless of whether the second flash is coming or not.

  But if we set the deadline for the speeded response at 250 ms, and the second flash occurs at 300 ms, then on trials without a second flash, the system might release the experience after 300 ms (when it becomes clear that no second flash is coming). Therefore, at 250 ms, in both cases, the experience hasn't been released. So the two accounts predict:

  - Orwellian: high accuracy and fast RT on the speeded task for both two-flash and one-flash (catch) trials.
  - Stalinesque: low accuracy and/or slow RT on the speeded task for both types of trials.

  We want a scenario where the two accounts make opposite predictions on the same trial type (with two flashes). So we need a measure that the Orwellian account says is available and the Stalinesque says is not, specifically on two-flash trials.

  But note: the Stalinesque account doesn't differentiate between the two trial types until after the second flash time. So we cannot get a difference between trial types for the Stalinesque account during the interval.

  We need a different kind of measure that doesn't require the subject to report the first flash explicitly, but that can still be taken during the interval and that the subject can do only if the first flash has been consciously perceived.

  Alternative measure: priming.

  We could use a priming task. For example, during the interval between the first and second flash, we present a word (e.g., "RED" or "GREEN") and ask the subject to quickly judge whether that word matches the color of the first flash. The Orwellian account would predict fast and accurate matching because the first flash is conscious. The Stalinesque account would predict no priming (or reduced) because the first flash is not yet conscious.

  But note: even if the first flash is not conscious, it might still cause priming (unconscious priming). So we cannot rely on that.

  We need a measure that requires conscious access.

  Another idea: use a dual-task paradigm. The subject is performing a secondary task that requires attention. We set it up so that if the first flash is consciously perceived, it will interfere with the secondary task (because it captures attention). We can measure the performance on the secondary task during the interval.

  But that might be too indirect.

  Let's stick with the speeded forced-choice about the first flash, but let's change the timing so that the second flash sometimes comes very early and sometimes late. We want to test the speeded response at a fixed time after the first flash, regardless of when the second flash occurs. Then, we can look at trials where the second flash occurs after the response deadline (so the response is made before the second flash) and compare to trials where the second flash occurs before the response deadline (so the response is made after the second flash). But note: if the second flash occurs before the response deadline, then the response is made after the second flash. In that case, both accounts might agree that by then the subject has a stitched experience.

  But the Stalinesque account would say that if the second flash occurs very early, then the conscious experience is available earlier. So if the second flash occurs at 100 ms, then at 150 ms the subject has the stitched experience and can report the color of the first flash as part of the motion (which might be the wrong color due to the illusion). But we are asking about the actual color of the first flash, which might be different from what the illusion suggests.

  We are varying the actual color of the first flash. The second flash is fixed (say, green). If the first flash is red, then the illusion would show a red dot moving and turning green in the middle. If the first flash is green, then the illusion would show a green dot moving and staying green? (or maybe turning to green if the second is green, but that would be no change). So the illusion might be less compelling if both are green.

  But crucially, the subject's speeded response (about the first flash) after the second flash might be influenced by the illusion. For example, if the first flash was red and the second green, and the stitched experience is a dot that started red and turned green, then when asked about the first flash the subject might say "red" (if the illusion doesn't distort the memory of the starting color) or maybe even say "it started red but changed" — but we are forcing a simple response (red or green). In the stitched experience, the starting color is red, so they might say red.

  So if the second flash occurs early (before the response deadline) and the first flash was red, then the subject can report "red" and that would be correct. If the first flash was green, then they report "green". So the Stalinesque account would predict high accuracy in this case (because the stitched experience is available and it includes the correct starting color). But what if the illusion distorts the starting color? In the standard color phi, the starting color is not distorted — it's the mid-point where the color change is inserted. So the starting color is correctly represented as red.

  But what if the first flash is green and the second is green? Then there is no color change, and the illusion might be a moving dot that stays green. Then the starting color is green.

  Therefore, the Stalinesque account would predict that when the second flash occurs early (so the response is made after the second flash), the subject can report the color of the first flash correctly because the stitched experience includes that information.

  But what about when the second flash occurs late (after the response deadline)? Then the response is made before the second flash. The Stalinesque account would predict that the subject has no conscious experience of the first flash at the time of the response, so they are guessing. Therefore, accuracy should be at chance.

  Meanwhile, the Orwellian account would predict that the subject can report the first flash correctly regardless of when the second flash occurs (as long as the response is made before the second flash, because then the memory hasn't been rewritten). If the second flash occurs before the response deadline, then the response is made after the second flash. In the Orwellian account, the memory rewrite happens after the second flash, so if the response is made very quickly after the second flash, it might be before the rewrite. But the rewrite is assumed to be fast. So if the second flash occurs at 100 ms and the response is made at 150 ms, the rewrite might have already occurred. Then the Orwellian subject would report the rewritten memory: the starting color as part of the motion event. In the case of a red first flash and green second, the rewritten memory would be that the dot started red and then changed to green. So when asked about the first flash, they would say "red". Similarly, if the first flash was green, they would say "green". So the Orwellian account also predicts high accuracy in this case.

  But note: in the case of the second flash occurring early and the response after it, both accounts predict high accuracy. However, when the second flash occurs late (and the response is made before it), the Orwellian account predicts high accuracy (because the memory hasn't been rewritten yet) and the Stalinesque account predicts chance accuracy (because no conscious experience yet).

  This gives us a split:

  - Condition A: second flash early (say at 100 ms), response deadline at 150 ms -> both accounts: high accuracy.
  - Condition B: second flash late (say at 300 ms), response deadline at 250 ms -> Orwellian: high accuracy, Stalinesque: chance accuracy.

  Therefore, we can compare accuracy in Condition B. The two accounts make different predictions.

  But note: in Condition B, the response is made at 250 ms and the second flash at 300 ms, so the response is before the second flash. In Condition A, the second flash at 100 ms and response at 150 ms (after the second flash).

  We must be cautious because the time from the first flash to the response is different (150 ms vs 250 ms). But we can control for that by having a control condition without a second flash at the same response deadline.

  But the critical comparison is within Condition B: the two accounts disagree.

  We can design the experiment:

  - Trials:
    1. Early second flash: second flash at 100 ms. Response deadline at 150 ms (so response after second flash).
    2. Late second flash: second flash at 300 ms. Response deadline at 250 ms (so response before second flash).
    3. Catch trials: no second flash, response deadline at 250 ms.

  - We vary the color of the first flash (red or green) randomly.

  - The second flash is always green and at a location to the right.

  - Task: at the response deadline, a prompt appears (e.g., a tone) and the subject must immediately press one key for red and another for green to report the color of the first flash.

  - The subject is instructed to respond as quickly as possible at the prompt.

  Predictions:

  - Orwellian:
    - Condition 1 (early second flash, response after second flash): by 150 ms, the second flash has occurred and the memory rewrite has happened. The subject now remembers the first flash as part of a moving dot that changed color. But the starting color is still red (if it was red) or green (if it was green). So they can report correctly. Accuracy high.
    - Condition 2 (late second flash, response before second flash): at 250 ms, the second flash hasn't occurred, so the memory hasn't been rewritten. The subject consciously saw the first flash and can report its color correctly. Accuracy high.
    - Catch trials: same as Condition 2. Accuracy high.

  - Stalinesque:
    - Condition 1: at 150 ms (after the second flash at 100 ms), the conscious experience (stitched) is available. The starting color in the stitched experience is the actual color of the first flash. So they report correctly. Accuracy high.
    - Condition 2: at 250 ms, the second flash hasn't occurred (it will at 300 ms), so the conscious experience is not yet available. The subject has to guess the color of the first flash. Accuracy at chance (about 50%).
    - Catch trials: at 250 ms, the system is still waiting for the second flash (which never comes). So no conscious experience yet. Therefore, the subject guesses. Accuracy at chance.

  Therefore, the critical condition is Condition 2 (late second flash, response before second flash). The Orwellian account predicts high accuracy, the Stalinesque account predicts chance accuracy.

  We can also look at catch trials: Orwellian predicts high accuracy, Stalinesque predicts chance.

  But note: in the catch trials, if we wait long enough (say, 500 ms) and then ask for a report, the Stalinesque subject would eventually become conscious of the first flash (because the system times out). But in our speeded response at 250 ms, they haven't.

  However, we must consider the possibility that the Stalinesque system might have a variable waiting time? We assume that the system waits for a fixed time window (say, 300 ms) for the second flash. So at 250 ms, it hasn't timed out.

  Structural feature that is doing the work: the introduction of a speeded response that occurs after the first flash but before the second flash in the late condition, and the comparison to a condition where the second flash occurs early and the response is after the second flash.

  If we remove the variable timing and go back to a fixed short interval (like the standard color phi with 150 ms total), then we cannot insert a response before the second flash without having the second flash occur during the response. So the two stories collapse.

  A Dennett-style multiple-drafts theorist would argue that there is no fact of the matter about whether the experience was Orwellian or Stalinesque. The brain processes information in various ways and at various times, and the content of consciousness is not settled until it needs to be. In our experiment, the speeded response forces an early commitment. The multiple-drafts view would say that the information about the first flash is available in some form and can be used for the speeded response, but that doesn't mean it was "consciously experienced" in a finished way. The multiple-drafts view might absorb the result by noting that the information about the first flash was processed to the level of being reportable at 250 ms (in the Orwellian pattern) only in some conditions. But in the Stalinesque pattern, the information wasn't reportable until later. However, the multiple-drafts view might say that the distinction between the two is artificial because there is no central place where consciousness happens at a specific time. The speeded response is just one of many possible "probes" that can access the information at different times. The apparent divergence is just due to the time at which we probe.

  Moreover, the multiple-drafts view might predict that in Condition 2 (late second flash) the accuracy might be somewhere in between if the system starts to prepare for the possibility of a second flash but doesn't completely withhold the first flash. It might be that the first flash is partially conscious.

  Summary of the experiment:

  - Display: first flash (red or green) at location A. After a variable delay (either 100 ms or 300 ms), a second flash (green) at location B (or no second flash in catch trials).
  - Response: a prompt (e.g., a tone) at either 150 ms (for the early second flash trials) or 250 ms (for the late second flash trials and catch trials) after the first flash. The subject must immediately report the color of the first flash.
  - Measure: accuracy of the color report in the late second flash trials (and catch trials) vs. early second flash trials.

  Predictions:
  - Orwellian: high accuracy in all conditions.
  - Stalinesque: high accuracy in early second flash trials, chance accuracy in late second flash trials and catch trials.

  The single structural feature: the variable timing of the second flash and the probe (response) before the second flash in the late condition.

  Dennett might say: the experiment shows that the information about the first flash is available for report at 250 ms only if the system has not been given a second flash to integrate. But in the late second flash condition, the system is waiting to see if there will be a second flash, so it doesn't commit to a conscious experience of the first flash alone. This doesn't mean that the subject didn't have a conscious experience of the first flash in an Orwellian way, but rather that the brain didn't need to settle on a narrative until forced by the probe. The multiple-drafts view would say that the probe (the response demand) at 250 ms in the late condition forces an early draft that doesn't include the second flash, and that draft might be different from the later draft that includes the second flash. So both accounts are too simplistic because they assume a single, definitive conscious experience. The data would show that the brain can produce a report based on the first flash alone when probed early, but then later (if there is a second flash) it might produce a different narrative. The subject might even feel that the first flash was red (as reported at 250 ms) but then later experience the illusion of a moving dot that changed from red to green. This would be a combination of both: an early report of the first flash and a later revised narrative, which is neither purely Orwellian (because the early report wasn't rewritten) nor purely Stalinesque (because the early report was available before the second flash). The multiple-drafts view can accommodate both the early accurate report and the later illusion.
answer: |-
  ### Thought Experiment: Speeded Judgment with Variable Inter-Stimulus Interval (ISI)

  **Scenario Setup:**  
  We extend the classic color phi illusion with a **variable inter-stimulus interval (ISI)** and a **speeded forced-choice task** about the first flash, administered *before* the second flash could appear. The goal is to probe conscious access to the first flash during the gap between flashes.

  1. **Stimuli:**  
     - Trial starts with a fixation cross.  
     - **First flash:** A dot appears at location A (left). Its color is randomized per trial (50% red, 50% green).  
     - **ISI:** Variable delay between first and second flash. Two conditions:  
       - **Short-ISI trials:** Second flash appears at 100 ms (too early for a speeded response).  
       - **Long-ISI trials:** Second flash appears at 450 ms (late enough to allow a response before it).  
     - **Second flash:** Always appears at location B (right), always green.  
     - **Catch trials (25%):** No second flash; only the first flash appears.  

  2. **Task:**  
     - Subjects are instructed to report the color of the first flash *as fast as possible* via keypress (e.g., "R" for red, "G" for green).  
     - A **response deadline** is enforced:  
       - On long-ISI and catch trials, a tone sounds at **250 ms** after the first flash, cueing subjects to respond immediately.  
       - On short-ISI trials, the tone sounds at **150 ms** (after the second flash, for control).  
     - After the response, the trial completes (second flash appears if scheduled).  
     - Finally, subjects give a retrospective verbal report describing what they saw (expected to match the color phi illusion: a moving dot changing color midway).  

  3. **Critical Conditions for Comparison:**  
     - **Long-ISI trials (test condition):** Response deadline (250 ms) occurs *before* the second flash (450 ms).  
     - **Catch trials (control):** Response deadline (250 ms) occurs with no second flash.  
     - **Short-ISI trials (control):** Response deadline (150 ms) occurs *after* the second flash (100 ms).  

  4. **Realistic Constraints:**  
     - Timing: Achievable with standard lab equipment (millisecond precision).  
     - Measure: Speeded forced-choice accuracy and reaction time (RT) at the deadline. RTs >300 ms are excluded (ensuring responses are pre-second-flash in long-ISI trials).  
     - No exotic methods: Uses keyboards, auditory cues, and standard displays.  

  ---

  ### Predictions from Orwellian vs. Stalinesque Accounts  
  We assume:  
  - **Orwellian "memory editor":** Edits memories at ~100–200 ms after the second flash.  
  - **Stalinesque "buffer":** Buffers input for ~200–300 ms before conscious experience.  

  #### **Conscious Timeline & Predictions for Long-ISI Trials**  
  *(Response at 250 ms; second flash at 450 ms)*  

  | Time (ms) | Orwellian Account | Stalinesque Account |
  |-----------|-------------------|---------------------|
  | **0–250 ms** | First flash is **consciously perceived** at ~100–200 ms. No editing occurs yet (second flash hasn't happened). | First flash is **not conscious**. Processing is buffered until after the second flash arrives. |
  | **250 ms** | Subject has a clear conscious experience of the first flash. **High accuracy, fast RT** on color judgment. | Subject has no conscious access. Relies on unconscious processing or guesses. **Chance accuracy, slower RT**. |
  | **450 ms** | Second flash appears. Memory is edited post-hoc to create illusion. | Buffered input is stitched; conscious experience of the illusion begins. |
  | **Retrospective report** | Reports moving dot with color change (edited memory). | Reports moving dot with color change (stitched experience). |

  - **Orwellian Prediction:**  
    High accuracy (~95%) and fast RTs (~200–250 ms) for the first flash’s color in long-ISI trials. The conscious experience is immediate and unedited before the second flash.  

  - **Stalinesque Prediction:**  
    Chance accuracy (~50%) and slower RTs (~300+ ms) in long-ISI trials. No conscious experience exists yet, so responses are guesses or rely on sluggish unconscious processing.  

  #### **Control Conditions:**  
  - **Catch trials (no second flash):**  
    - Orwellian: Conscious first flash → high accuracy.  
    - Stalinesque: Buffer waits for second flash until timeout (~500 ms) → no conscious experience at 250 ms → chance accuracy.  
  - **Short-ISI trials (response after second flash):**  
    - Both accounts predict high accuracy:  
      - Orwellian: Memory editing happens *after* the response (deadline at 150 ms, editing starts at ~200–300 ms).  
      - Stalinesque: Conscious experience is stitched by 150 ms (buffer time <150 ms).  

  #### **Summary of Divergence:**  
  | Measure          | Orwellian Prediction | Stalinesque Prediction |  
  |------------------|----------------------|------------------------|  
  | Accuracy (long-ISI) | High (~95%)          | Chance (~50%)          |  
  | RT (long-ISI)    | Fast (~200–250 ms)   | Slow (~300+ ms)        |  
  | Accuracy (catch) | High                 | Chance                 |  
  | Accuracy (short-ISI) | High                 | High                   |  

  ---

  ### **Key Structural Feature Enabling the Split**  
  **Variable ISI with a speeded response deadline *before* the second flash.**  
  - **Why it works:** Forces subjects to report the first flash *while the system is waiting* for the second flash. The Orwellian account assumes consciousness is immediate, so the response is fast and accurate. The Stalinesque account assumes consciousness is delayed until integration occurs, so the response is impaired.  
  - **If removed:** With a fixed short ISI (e.g., 150 ms), the response deadline would occur *after* the second flash in all trials. Both accounts then predict identical results (high accuracy), collapsing back to the classic color phi indeterminacy.  

  ---

  ### **Dennett-Style Multiple-Drafts Critique**  
  A multiple-drafts theorist would reject the dichotomy and argue:  
  1. **No "Cartesian Theater":** There's no single moment when consciousness "happens." Instead, multiple parallel processes ("drafts") compete for influence.  
  2. **Probing Absorbs the Result:**  
     - The speeded response at 250 ms reflects a draft where the first flash is prioritized for motor response. This draft coexists with other drafts (e.g., motion processing).  
     - In long-ISI trials, the response draft "wins" early, yielding high accuracy. Later, the motion draft dominates the retrospective report, creating the illusion.  
     - In Stalinesque-like cases (slower responses), the motion draft may already influence the response, reducing accuracy.  
  3. **No Fact of the Matter:** The data doesn't reveal "when" consciousness occurred—only that different probes (speeded response vs. retrospective report) access different drafts. The illusion arises from which draft gains dominance in subsequent processing, not from Orwellian editing or Stalinesque staging.  

  **Conclusion:** The experiment *appears* to split the two accounts but ultimately exposes their shared flaw: assuming a unified conscious timeline. Multiple drafts absorb the result by treating the speeded response as a separate draft that may or may not align with later narratives. The illusion is a product of which draft is probed and when, not a hidden rewrite or delay.
