  Next, I need to distinguish premise-based and conclusion-based approaches. Premise-based aggregates votes on premises first, then derives the conclusion logically. Conclusion-based aggregates votes directly on the conclusion, ignoring premises. 

  For premise-based: It usually gives epistemic reliability since it prioritizes logical consistency. The group conclusion is based on premises decided by majority, so it's consistent. But it might lack procedural legitimacy because the conclusion isn't directly voted on, which could feel undemocratic. Voters who disagree might feel their conclusion vote was ignored.

