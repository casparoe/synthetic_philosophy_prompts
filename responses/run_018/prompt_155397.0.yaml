  Next, the ethicists will pounce on subjectivity. Scanlonians hate ungrounded personal endorsement; they'll demand criteria for "genuine approval." The user must avoid psychologizing this and instead emphasize Nietzschean will-to-power as the metric. Danger zone: if approval is just a feeling, isn't this circular? 

