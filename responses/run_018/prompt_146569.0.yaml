prompt: |-
  I'm enrolled in an upper-level seminar on rationality, probability, and objective chance. We're writing our final exam—one 90-minute essay, roughly 800 words—on deference to objective chance via Lewis's Principal Principle. I want a question that can't be answered by reciting the standard formulation and the familiar undermining objection. Please design an exam scenario in which a subject knows that a genuinely chancy quantum decay process assigns objective chance 2/3 to outcome A, but she also holds admissible-looking statistical evidence from an independently verified long run of the same process in which A occurred in only 40% of trials. The essay prompt should ask students to determine the rational credence in A and specifically to adjudicate whether the Principal Principle locks her at 2/3, licenses conditionalization downward, or permits a principled intermediate position that distinguishes undermining future evidence from ordinary frequency data. Along with the question, please provide: a model answer of about 800 words that makes four specific conceptual moves—(i) separating admissible from inadmissible evidence in this context; (ii) explaining why a long-run statistical discrepancy does not automatically undermine the chancy law; (iii) applying the Principal Principle correctly to conditional rather than unconditional chances; and (iv) addressing whether indexical or self-locating information could alter the deference relation; and a marking scheme totaling 20 points with 5 points for each of those four moves, plus one-line notes on how students typically fail each move and what distinguishes an A answer (which executes the distinctions precisely) from a B answer (which summarizes Lewis without resolving the tension).
reasoning: |-
  We are designing an exam question and model answer about the Principal Principle in the context of conflicting objective chance and statistical evidence. The scenario involves a quantum decay process with objective chance 2/3 for outcome A, but statistical evidence from a long run showing only 40% A.

  The essay prompt should require students to determine the rational credence in A, considering whether the Principal Principle locks the credence at 2/3, allows conditionalizing downward, or permits an intermediate position that distinguishes undermining evidence from ordinary frequency data.

  The model answer must include four specific conceptual moves:

  (i) Separating admissible from inadmissible evidence in this context.

  (ii) Explaining why a long-run statistical discrepancy does not automatically undermine the chancy law.

  (iii) Applying the Principal Principle correctly to conditional rather than unconditional chances.

  (iv) Addressing whether indexical or self-locating information could alter the deference relation.

  Additionally, we need a marking scheme (20 points total) with 5 points for each of the four moves, along with one-line notes on common failures and what distinguishes an A from a B answer.

  Let's design the exam question first.

  **Exam Question:**

  You are advising a rational agent, Alice, who is about to observe a single trial of a quantum decay process. The best scientific theory available (which Alice accepts) assigns an objective chance of 2/3 to outcome A for this process. However, Alice has also reviewed a large, independently verified dataset from 1,000 previous trials of the same process under identical conditions, in which A occurred only 400 times (40%). Alice knows that the process is genuinely chancy and that the trials are independent.

  Alice is now trying to set her rational credence in A for the upcoming trial. She wonders: should she defer entirely to the objective chance (credence 2/3), conditionally lower her credence based on the observed frequency (toward 40%), or find some principled intermediate position?

  Write an essay that addresses the following:

  1. Explain how Lewis's Principal Principle (PP) would guide Alice's credence in the absence of the statistical evidence. Then, analyze whether the statistical evidence from the 1,000 trials is admissible or inadmissible according to the PP.

  2. Discuss whether the observed statistical discrepancy (40% vs. 2/3) should lead Alice to doubt the correctness of the objective chance assignment (i.e., whether it constitutes undermining evidence). Why or why not?

  3. Show how the Principal Principle can be applied to conditional chances to account for the statistical evidence without abandoning deference to the objective chance. What is Alice's rational credence in A given the entire body of evidence?

  4. Consider whether Alice's position in the sequence of trials (e.g., knowing she is in the 1001st trial) or any other indexical information could affect how she weighs the chance against the frequency.

  In your response, be precise about the distinctions between admissible and inadmissible evidence, the nature of undermining, and the correct application of the Principal Principle. Conclude with a clear determination of Alice's rational credence and the reasoning that supports it.

  ---

  **Model Answer (Approx. 800 words):**

  The Principal Principle (PP) is Lewis's proposal for how rational credence should defer to known objective chances. It states that, conditional on the chance of outcome A being x and any admissible evidence E, one's credence in A should be x: C(A | ch(A)=x ∧ E) = x. In the absence of the statistical evidence, Alice would set her credence in A to exactly 2/3, since the chance theory is part of her evidence and no other evidence is present.

  However, Alice has additional evidence: a report of 400 occurrences of A in 1000 independent trials. The critical question is whether this statistical evidence is admissible. Lewis defined admissible evidence as information about the past or present that does not "undermine" the chance theory itself. Typically, historical frequencies are admissible because they do not reveal future outcomes. But here, the frequency is from past trials of the same process. While frequencies are often admissible, the PP requires that the evidence must not be "inadmissible" by containing information that would undercut the chance assignment. Importantly, the frequency data does not directly specify the outcome of the future trial, so it is not inadmissible in the way that a crystal ball's prediction would be. However, when the frequency diverges from the chance, it might be thought to cast doubt on the chance theory. But note: the chance theory itself predicts that such frequencies can occur, albeit with low probability. Therefore, the evidence is admissible because it does not logically contradict the chance theory; it is merely an improbable outcome. Thus, the frequency data is admissible evidence.

  This leads to the second point: why doesn't this discrepancy undermine the chance law? Undermining evidence, in Lewis's sense, is evidence that undercuts the truth of the chance theory itself. For example, in a Humean account of chance, a future frequency that is very different from the chance might make the chance theory false. But in this scenario, the evidence is about the past, and the chance theory remains the best scientific theory. The chance of 2/3 is a physical law that governs each trial independently. The law itself entails that a frequency of 40% in 1000 trials, while unlikely (probability about 10^(-15)), is not impossible. Thus, observing such a frequency does not contradict the theory; it is just a rare event. Therefore, Alice should not reject the chance theory on the basis of this evidence. The evidence is surprising but not undermining.

  Given that the frequency data is admissible, the PP as originally stated would require Alice to set her credence to 2/3. But that seems to ignore the frequency data. However, note that the PP applies to the total evidence. We can apply the PP conditionally: the chance of A on a single trial is 2/3, regardless of past outcomes, because the trials are independent. Therefore, the chance of A conditional on the past frequency is still 2/3. That is, ch(A | F) = ch(A) = 2/3, where F is the frequency evidence. The independence of trials implies that the chance of A does not depend on past outcomes. Hence, by the PP, Alice's credence should be C(A | ch(A)=2/3 ∧ F) = 2/3. The frequency data is admissible, so it does not change the chance assignment for the future trial. Therefore, Alice should maintain a credence of 2/3.

  But this seems to ignore the frequency data entirely. However, note that the frequency data might indirectly affect Alice's credence if she were to doubt the chance theory. But we have argued that she should not. Alternatively, one might consider a modified principle that allows for calibration to frequencies. But the PP is designed for deference to objective chances, and if the chances are objective and known, they should override frequencies. Moreover, the chance theory already accounts for the frequency: it assigns a low probability to the observed frequency, but that does not change the chance for the next trial.

  Now, what about indexical information? Suppose Alice knows that she is conducting the 1001st trial. Does this self-locating information change anything? It does not. The chance of A on the 1001st trial is still 2/3. The fact that the previous 1000 trials had a 40% frequency does not affect the chance of this trial. The trials are independent, so the indexical information does not alter the chance or the admissibility of the frequency data. Therefore, indexical information is irrelevant to the deference.

  In conclusion, Alice's rational credence in A should remain 2/3. The frequency data is admissible and does not undermine the chance theory. The PP requires unconditional deference to the known chance for a single trial, and the conditional chance given the frequency remains 2/3 due to independence. The observed frequency, while low, does not justify abandoning the chance theory or deviating from the PP. Thus, there is no principled intermediate position: the PP locks the credence at 2/3.

  [Word count: ~650 words. We can add a bit more to reach 800 if needed, but this covers the points.]

  **Addendum to reach 800 words:**

  Some might object that the frequency data should be incorporated via a Bayesian update that treats the chance as uncertain. However, in this scenario, Alice accepts the chance theory as part of her background knowledge. The chance is not a variable to be updated on; it is fixed evidence. If Alice were uncertain about the chance, then she would use the frequency to update her credence about the chance. But here, she knows the chance is 2/3. The PP is meant for when the chance is known. Therefore, the frequency data, being admissible, does not change the credence.

  Another objection is the idea of "meta-induction": in the face of a discrepancy, should Alice not adjust her credence? But the chance theory itself tells her that such discrepancies are possible. She has no other reason to doubt the theory. Moreover, if she were to adjust, how much? There is no principled way to set an intermediate credence without violating the PP. Therefore, the rational course is to stick with 2/3.

  Thus, the Principal Principle, correctly applied, mandates a credence of 2/3 for Alice.

  [Now around 750 words. We can stop.]

  ---

  **Marking Scheme (Total 20 points):**

  Each of the four moves is worth 5 points.

  **Move (i): Separating admissible from inadmissible evidence (5 points)**
  - **Common failure (losing points):** Students may claim that any frequency data is inadmissible because it might undermine the chance, without explaining Lewis's criterion. Alternatively, they may say it is admissible without addressing why it isn't undermining.
  - **A answer:** Clearly defines admissibility as per Lewis (evidence that does not predict the future or undermine the chance theory) and argues that the frequency data is admissible because it is historical and does not logically contradict the chance theory (even if improbable). Distinguishes between undermining and mere improbability.
  - **B answer:** States that frequencies are typically admissible but does not adequately address the tension or explain why this one is admissible despite the discrepancy.

  **Move (ii): Why the discrepancy does not undermine the chancy law (5 points)**
  - **Common failure:** Students may conflate low probability with falsification, arguing that the frequency evidence does undermine the law because it is very improbable. Or, they may think that any significant discrepancy is undermining.
  - **A answer:** Explains that undermining evidence must threaten the truth of the chance theory (e.g., by being logically inconsistent or by being a future event that would make the theory false). Notes that the observed frequency, however improbable, is consistent with the chance theory (since the theory assigns it a positive probability) and that the chance theory remains the best available.
  - **B answer:** Mentions that the chance theory allows for variation but does not explicitly link to the definition of undermining or may vaguely say "it's rare but possible".

  **Move (iii): Applying PP to conditional chances (5 points)**
  - **Common failure:** Students may think the frequency data should directly lower the credence (e.g., to 40%) or that the PP is inapplicable because of the frequency. They may also misapply the PP by not conditioning on the total evidence.
  - **A answer:** Correctly states that the PP requires: C(A | ch(A)=2/3 ∧ F) = ch(A | F). Then argues that because the trials are independent, ch(A | F) = ch(A) = 2/3. Thus, the credence remains 2/3. Alternatively, if the student uses the original PP formulation (which requires admissibility of F), they note that F is admissible so the credence is 2/3.
  - **B answer:** Says that the PP requires 2/3 but doesn't explicitly condition on F or address independence. May not show the conditional chance step.

  **Move (iv): Addressing indexical information (5 points)**
  - **Common failure:** Students might think that being in the 1001st trial after a run of low frequency makes A less likely, or they may introduce the gambler's fallacy.
  - **A answer:** Explains that indexical information (like the trial number) does not affect the chance of A because the trials are independent and identically distributed. Thus, the chance of A remains 2/3 regardless of the past or the agent's position in the sequence.
  - **B answer:** States that indexical information doesn't matter but without tying it to the independence of trials or the definition of chance.

  **Overall:**
  - An A essay will execute all four moves precisely, with clear distinctions and correct application of the PP.
  - A B essay will summarize the Principal Principle and the undermining objection but not fully resolve the tension, or may be vague on the key distinctions.

  Note: The model answer concludes that the credence is 2/3. However, if a student argues for an intermediate position in a principled way (e.g., by challenging the assumption that the chance is known or by using a different interpretation of chance), that could be worth high marks if done well. But the scenario states that Alice "knows" the chance and the process is genuinely chancy, so the intended answer is 2/3. The model answer defends that view.

  However, note that some philosophers (e.g., David Christensen) have argued for a "deference" to frequencies even when chances are known, but that is not the standard Lewisian view. The marking should follow the Lewisian framework as per the course.

  This exam question and model answer should meet the requirements.
answer: |-
  ### Exam Question:  
  **Rational Credence in the Face of Divergent Chance and Frequency**  

  Alice is preparing to observe a single trial of a quantum decay process. She knows that the best scientific theory assigns an objective chance of 2/3 to outcome A for this process. However, she also possesses independently verified statistical evidence: a recorded sequence of 1,000 prior trials of the *same* process under identical conditions, in which A occurred in only 400 trials (40%). Alice accepts that the process is genuinely chancy, the trials are independent, and the theory is correct.  

  **Essay Prompt:**  
  Determine Alice’s rational credence in A for the upcoming trial. Your essay must address the following:  
  1. **Admissibility of Evidence:** Is the statistical evidence (40% frequency) admissible or inadmissible for the Principal Principle (PP)? Justify your answer using Lewis’s criteria.  
  2. **Undermining vs. Improbability:** Does the frequency discrepancy (40% vs. 2/3) constitute *undermining evidence* against the chance law? Explain why or why not.  
  3. **Conditional PP Application:** Apply the Principal Principle correctly to account for the statistical evidence. Should Alice’s credence be 2/3, near 40%, or at an intermediate value? Use the concept of *conditional chance* to support your reasoning.  
  4. **Indexical Information:** Could Alice’s knowledge that this is the 1001st trial (or other self-locating information) affect how she weighs the chance against the frequency? Discuss briefly.  

  Conclude by specifying Alice’s rational credence and justifying it. Your response should resolve the tension between deference to objective chance and the frequency data, avoiding mere recitation of the standard undermining objection.  

  ---

  ### Model Answer (Approx. 800 words):  

  Alice’s situation pits objective chance against observed frequency, demanding careful application of Lewis’s Principal Principle (PP). The PP dictates that if an agent knows the objective chance of an outcome and possesses only admissible evidence, their credence must equal the chance. Here, the chance of A is 2/3, but Alice also has frequency evidence (F): A occurred in 40% of 1,000 trials. I argue that Alice’s rational credence in A remains 2/3, as F is admissible, non-undermining, and the conditional chance of A given F is unchanged due to independence. Indexical information is irrelevant.  

  **(i) Admissibility of Evidence:** Lewis defines evidence as admissible if it is “historical” (about past or present) and non-undermining—i.e., it does not threaten the truth of the chance law itself. F is admissible because it reports past outcomes without logically entailing future results or contradicting the chance law. The frequency is a summary of localized, time-indexed events (e.g., trials 1–1000), making it “about the past” in Lewis’s sense. Crucially, admissibility does not require that evidence align with the chance; it only requires that the evidence not be “inadmissible” by directly revealing future outcomes (e.g., a prediction about trial 1001) or by undermining the chance law’s truth. F reveals no information about trial 1001’s outcome, so it is admissible. This distinguishes it from crystal-ball prophecies or future-heavy data, which are inadmissible. Thus, F must be incorporated alongside the chance in Alice’s credence function via the PP.  

  **(ii) Undermining vs. Improbability:** The frequency discrepancy does *not* undermine the chance law. Undermining evidence, per Lewis, is information that, if true, would falsify the chance law itself—for example, learning that the *future* long-run frequency deviates wildly from 2/3, which (on Humean views) constitutes the chance. Here, F is about the *past*, and the chance law remains intact because it assigns a low but non-zero probability to a 40% frequency in 1000 trials. The law entails that such frequencies occur with binomial probability ≈10⁻¹⁵—improbable, but possible. Thus, F is merely “surprising” evidence the chance theory *accommodates*, not undermining evidence that refutes it. Rejecting the law based on F alone would conflate low probability with falsification, violating the PP’s core tenet: chances prescribe rational credence even when actual frequencies diverge due to randomness. Alice should not doubt the chance law; she should treat F as a rare but admissible input.  

  **(iii) Conditional PP Application:** The PP applies to conditional chances, resolving the tension. The standard formulation is C(A | ch(A) = x ∧ E) = x, where E is admissible evidence. Here, E includes both the chance law and F. Since the trials are independent, the chance of A on trial 1001 is unaffected by past outcomes: ch(A | F) = ch(A) = 2/3. Thus, the PP mandates C(A | ch(A) = 2/3 ∧ F) = 2/3. Alice cannot conditionally lower her credence toward 40% without violating the PP, which demands deference to the conditional chance. One might argue for an “intermediate” credence (e.g., via Bayesian updating on chance hypotheses), but this fails: Alice *knows* the chance is 2/3, so she cannot treat it as uncertain. The PP locks her credence at 2/3 because F is admissible, and independence ensures ch(A | F) is unchanged. Ordinary frequency data only justifies lower credence if the chance is unknown; here, it is known, so deference is absolute.  

  **(iv) Indexical Information:** Indexical knowledge (e.g., “this is trial 1001”) does not alter the deference relation. Self-locating information might *feel* relevant—e.g., Alice might worry that being “after” a low-frequency run makes A less likely—but it is epistemically inert. The chance law governs all trials identically; independence implies that trial order or position has no effect on individual chances. Knowing she is in the 1001st trial adds no information about A’s probability beyond F and the chance, both already accounted for. Thus, indexicality does not license discounting the PP or adopting an intermediate credence.  

  **Conclusion:** Alice’s rational credence in A is 2/3. F is admissible and non-undermining, so the PP requires full deference. The conditional chance ch(A | F) remains 2/3 due to independence, precluding any downward adjustment. Indexical information is irrelevant. This upholds the PP’s authority: objective chance, not observed frequency, guides rational credence when chances are known.  

  ---

  ### Marking Scheme (Total: 20 points):  
  Each of the four moves is worth 5 points. Below, "A answer" executes the distinctions precisely; "B answer" summarizes Lewis without resolving the tension.  

  1. **Admissibility of Evidence (5 points)**  
     - **Common failure (0–2 pts):** Asserts F is inadmissible because it "contradicts" the chance, or claims all frequencies are admissible without engaging Lewis’s criteria.  
     - **B answer (3–4 pts):** Correctly identifies F as historical but does not explain why divergence ≠ undermining or conflates admissibility with alignment to chance.  
     - **A answer (5 pts):** Explicitly separates admissibility (past-tense, non-future-revealing) from undermining; argues F is admissible because it is historical and lacks logical incompatibility with ch(A)=2/3.  

  2. **Undermining vs. Improbability (5 points)**  
     - **Common failure (0–2 pts):** Equates low probability with falsification, arguing F undermines the chance law because 40% is "too far" from 2/3.  
     - **B answer (3–4 pts):** Notes that rare events happen but does not define undermining or clarify that past frequencies cannot undermine on Humean grounds.  
     - **A answer (5 pts):** Distinguishes undermining (evidence threatening the law’s truth) from improbability; explains F is consistent with the law since ch(F) > 0.  

  3. **Conditional PP Application (5 points)**  
     - **Common failure (0–2 pts):** Advocates for credence near 40% via "compromise" or misapplies PP unconditionally (ignoring F).  
     - **B answer (3–4 pts):** States PP requires 2/3 but does not derive ch(A | F) = 2/3 from independence or address conditionalization.  
     - **A answer (5 pts):** Uses independence to show ch(A | F) = ch(A) = 2/3; applies PP conditionally to conclude C(A | ch(A)=2/3 ∧ F) = 2/3.  

  4. **Indexical Information (5 points)**  
     - **Common failure (0–2 pts):** Claims indexical knowledge justifies lowering credence (e.g., via gambler’s fallacy).  
     - **B answer (3–4 pts):** Dismisses indexicality as irrelevant but without linking to independence or chance properties.  
     - **A answer (5 pts):** Argues indexical information adds no new causal/chancy insight; independence nullifies its relevance for deference.  

  **Overall Grading:**  
  - **A (17–20 pts):** Precisely executes all four moves, resolves tension via conditional PP, and upholds 2/3 credence.  
  - **B (13–16 pts):** Summarizes PP/undermining correctly but wavers on admissibility or conditionalization; may suggest an unjustified intermediate credence.  
  - **C (9–12 pts):** Superficial treatment; confuses admissibility/undermining or omits key moves.  
  - **D/F (0–8 pts):** Fails to engage the scenario, recites standard objections, or misapplies the PP.  

  ---  
  **Note to Instructor:** This question challenges students to move beyond rote knowledge by integrating admissibility, non-undermining, conditional chances, and indexicality. The model answer demonstrates how to defend a 2/3 credence without ignoring the frequency, emphasizing that PP deference dominates when chances are known and evidence is admissible.
