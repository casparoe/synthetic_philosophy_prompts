answer: |-
  Okay, let's break down that specific passage from Bernoulli (1738) and address your core questions directly. You're right to hone in on the "exact logical move" – it's revolutionary and often gets oversimplified.

  Here's the dissection, answering your specific points:

  1.  **The Logical Move: Recalculating Expectation with Utility:** Yes, Bernoulli is **explicitly advocating for a literal recalculation of the expectation using "utility" (moralem expectationem)** instead of monetary value. He isn't *just* making a psychological observation; he's proposing a *formal mathematical alternative* to the standard expected monetary value (EMV) calculation.
      *   **The Problem with EMV:** The St. Petersburg game has infinite EMV (`E[Monetary Gain] = (1/2)*2 + (1/4)*4 + (1/8)*8 + ... = 1 + 1 + 1 + ... = ∞`). This implies anyone should pay any finite amount to play, which contradicts observed behavior.
      *   **Bernoulli's Solution:** He argues we should calculate *expected utility* (`E[Utility(Gain)]`) instead. Utility (`U`) is a function of wealth, not the monetary gain itself. Crucially, he posits that `U(Wealth)` is *not* linear with wealth; each additional ducat adds less utility than the one before it (diminishing marginal utility).

  2.  **Is the Log Utility in Bernoulli's Text? YES.** This is absolutely crucial. **Bernoulli himself explicitly proposes the logarithmic utility function in his 1738 paper.** He doesn't call it "log" in the modern sense, but he defines it precisely:
      *   He states that the utility (or "moral worth") of a small gain is *inversely proportional* to the quantity of goods already possessed. Mathematically, this translates directly to `dU/dW = k/W`, where `W` is wealth. Integrating this gives `U(W) = k * ln(W) + C`. He uses this form throughout his analysis.
      *   **His Recalculation:** Bernoulli takes a starting wealth (`W`), then calculates the utility gained from each possible monetary prize in the St. Petersburg game (`U(W + Prize) - U(W)`). He then weights these utility gains by their probabilities to get the expected *increase* in utility from playing the game. Using `U(W) = ln(W)`, **he proves that this expected utility increase is *finite*** (specifically, it converges to a value around 2-3 times the utility of 1 ducat, depending on starting wealth). This finite expected utility justifies why someone wouldn't pay an infinite amount (or even a very large finite amount) to play.
      *   **The Pauper vs. Rich Man:** This example is his *justification* for why `U(W)` must be concave (diminishing marginal utility). The *same* monetary gain (1000 ducats) represents a *much larger increase in utility* for the pauper (whose initial wealth `W` is small) than for the rich man (whose initial `W` is large). This directly implies `dU/dW` decreases as `W` increases, leading to a concave `U(W)`. Log utility (`ln(W)`) perfectly embodies this concavity.

  3.  **Mathematical Fix vs. Psychological Claim? It's Both, Intrinsically Linked.**
      *   **Psychological Observation:** The pauper/rich man example and the observation that "any fairly reasonable man" would sell for ~20 ducats are *empirical* (or introspective) claims about human behavior and valuation. He observes that people don't value money linearly.
      *   **Mathematical Formalization:** He doesn't stop at the observation. He uses it to *motivate a specific mathematical model* – expected utility theory with a concave utility function (log). This model *quantitatively explains* the observed behavior (finite willingness to pay) where EMV fails (infinite willingness to pay).
      *   **The Resolution:** The resolution *is* the mathematical model. The psychological insight provides the *reason* for adopting that specific model over EMV. The mathematical model *validates* that the psychological insight resolves the paradox quantitatively. It's a unified solution.

  4.  **The Concavity Assumption: Yes, Undefended (But Grounded).**
      *   **It's Absolutely Central:** Concavity (`U''(W) < 0` or diminishing `dU/dW`) is the *entire mathematical engine* driving the solution. Without concavity, the infinite EMV wouldn't necessarily become finite expected utility.
      *   **Is it Defended?** Bernoulli *assumes* concavity based on the pauper/rich man intuition and the general observation that people are risk-averse (willing to pay less than EMV for risky prospects). He presents it as self-evident from common experience. **He does *not* provide:**
          *   Axiomatic foundations (like von Neumann-Morgenstern or Savage later would).
          *   Empirical evidence beyond the St. Petersburg paradox itself and the pauper/rich man thought experiment.
          *   A deep discussion about *why* utility must be concave beyond this basic intuition of diminishing marginal value.
          *   A consideration of *other possible concave functions* (though he later mentions Cramer's square root utility in correspondence).
      *   **Grounded, but Not Rigorously Proven:** His defense is intuitive and pragmatic: it resolves the paradox and aligns with observable risk aversion. He doesn't feel the need for deeper justification at this foundational stage. He's introducing a radical new concept – the *mathematization* of subjective value.

  **In Summary:**

  1.  **Bernoulli *does* explicitly propose recalculating expectation using utility (`ln(W)`).** This is the core mathematical move.
  2.  **He *does* use the logarithmic function himself.** (Cramer proposed `U(W) = sqrt(W)` independently around the same time in correspondence).
  3.  **The resolution is both mathematical and psychological:**
      *   *Psychological:* People value gains based on the utility added to their *current state*, and utility increases slower than money (diminishing marginal utility).
      *   *Mathematical:* Replacing monetary value with a concave utility function (like `ln(W)`) in the expectation calculation yields a finite value for the St. Petersburg game, matching observed behavior.
  4.  **Concavity is absolutely essential and is assumed based on intuition.** Bernoulli provides the brilliant insight and the formal model using log utility, but he doesn't rigorously defend *why* utility *must* be concave beyond the powerful, yet intuitive, pauper/rich man example and the resolution of the paradox itself.

  **Think of it like this:** Bernoulli discovered that human valuation violates the implicit "linearity of value" assumption in the standard EMV calculation for the St. Petersburg paradox. He diagnosed the problem (diminishing marginal utility/risk aversion) and prescribed the cure (maximize expected *utility* using a concave function like log wealth). The diagnosis is psychological; the cure is mathematical. The brilliance was connecting the two so directly and formally for the first time. The lack of deep axiomatic defense for concavity reflects the pioneering nature of the work – he was building the foundation, not the entire edifice.
