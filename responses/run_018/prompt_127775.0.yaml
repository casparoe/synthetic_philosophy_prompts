answer: |-
  Here's the thought experiment and analysis per your specifications:

  **Chronic Pain Unit Scenario:**  
  Patient A suffers from severe trigeminal neuralgia: she reports agonizing facial pain, shows grimacing micro-expressions, exhibits elevated activity in the anterior cingulate cortex (ACC) and insula on fMRI during flares, and pleads for relief. Patient B is her physical duplicate but a complete p-zombie: identical neural activations and behaviors ("It's unbearable!") occur, yet there's *nothing it is like* to be B—no sensory qualia (no raw *sharpness* or *burning*), no affect. Patient C has the same peripheral/central neural damage as A, identical sensory cortex activation patterns (preserving qualia of *stabbing intensity*, *location*, *duration*), and indistinguishable verbal/facial/fMRI reports of pain severity. However, C lacks affective phenomenal states entirely: the sensory qualia carry zero negative valence, no suffering, no dread before procedures, no relief when pain stops—despite accurately describing these states behaviorally.

  ---

  **Conceivability Analysis:**  
  1.  **A vs. B (Complete Zombie):**  
      The standard conceivability intuition holds strongly. We can conceive of B being physically identical to A yet lacking *any* phenomenal consciousness. B's reports are empty echoes. This seems metaphysically possible (even if not naturally possible), revealing the hard problem's core: why should physical processing generate *experience* at all?

  2.  **A vs. C (Affective Zombie):**  
      The intuition *shifts* or *collapses*. Conceiving of C feels significantly easier and less paradoxical than conceiving of B. We can readily imagine experiencing precise sensory qualia (e.g., the distinct *burning* quality of neuropathic pain) while feeling *completely indifferent* to it—no dislike, fear, or distress. The sensory qualia remain vividly present, only their *normative/motivational force* is absent. This doesn't trigger the same sense of metaphysical impossibility as imagining a complete absence of phenomenality.

  **The Feature Doing the Work:**  
  Affective consciousness (suffering, dread, relief) appears **conceptually tied to its functional role** (motivating avoidance, signaling threat, reinforcing learning) in a way sensory phenomenology (raw feels of color, shape, sound, nociceptive intensity/location) is not. We understand *what suffering is* partly through its functional consequences. Removing affect while preserving sensory qualia feels conceivable because sensory qualia seem more "presentational" (representing objective features like wavelength or pressure) and less intrinsically tied to action/disposition. Affect, by contrast, seems defined by its subjective *valence* and motivational push/pull.

  **Physicalist Attack:**  
  A physicalist would argue that our ability to conceive of C (affective zombie) is an **epistemic illusion**, not proof of metaphysical possibility. The fMRI/behavioral indistinguishability constraint forces C to have identical *cognitive access* and *evaluative processing* to A (e.g., identical ACC/insula activation tied to salience and aversion). For the physicalist, phenomenal affect *just is* (or is necessarily entailed by) this integrated neurocognitive processing. Our failure to *imagine* the dissociation is a limitation of our conceptual tools/phenomenological access. Affect isn't an ontologically separate "add-on" to sensory processing; it's the way complex, integrated sensory-evaluative processing *feels*. The seeming conceivability arises because we misdescribe C—we focus only on the sensory component while ignoring that the preserved functional/cognitive state *constitutively is* the affect.

  **Dropping fMRI Indistinguishability:**  
  Dropping fMRI (and by implication, cognitive/neural processing) indistinguishability **collapses C back into a standard zombie or mere behavioral mimic.** If C's ACC/insula *don't* activate like A's during "unbearable" reports, then C isn't a challenge to physicalism about affect—it just becomes a case of intact sensation coupled with *dysfunctional* affective processing or mere insincere reporting. The core conceivability argument for affect as a non-functional property evaporates. The constraint forces the scenario to isolate phenomenal affect from its purported *physical* realization, which is precisely what the physicalist denies is possible. Without it, the scenario loses its unique force against physicalism regarding affect.
