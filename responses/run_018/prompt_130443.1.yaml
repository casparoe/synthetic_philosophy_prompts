  Characters: Chair Aris Thorne, pragmatic. Dr. Lien, the researcher presenting evidence. Councilor Vance (utilitarian) and Ethicist Kael (Kantian). Have a cetacean speaker, Orin, express their perspective through translation. The tension between immediate human needs and ethical evolution drives the conflict.

