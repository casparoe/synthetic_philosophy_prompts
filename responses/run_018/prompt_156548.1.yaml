prompt: |-
  I was talking with my friend over coffee about whether we even need a real *theory* for aligning AI we'll actualy build in the next five years — not some sci-fi AGI, just systems made by stacking RLHF, retrieval, tool-use, and maybe constitutional AI on top of each other. He said it's just an engineering checklist problem; I think it's different because misalignment can come from interaction effects between parts that are each individually "aligned," and without a framework we won't even notice the failure mode. So I want you to lay out the desiderata that any adequate theory of prosaic, stacked-system alignment must meet.

  By that I mean the full spec: the phenomena it has to explain (e.g., alignment leakage across module boundaries, reward hacking that only emerges in multi-step pipelines, drift when a retrieval layer pulls in out-of-distribution context), the distinctions it must preserve (component-level safety vs system-level safety, local editability vs global coherence, short-horizon vs long-horizon correctability), the practical constraints it can't violate (no reliance on full mechanistic interpretability, no assumption we can redesign the base architecture, must work with black-box APIs in the loop), and any hard results from current ML safety or control theory it has to stay consistent with. For each desideratum, give the case behind it and flag whether it's genuinely non-negotiable or just a camp preference — say, the scalable-oversight people vs the interpretability-first crowd. Crucially, say if any subset is jointly unsatisfiable given what we know about composed systems; that's the part I'm most curious about. Then, very briefly, score the main current proposals — pure RLHF pipelines, constitutional AI layered over tool agents, and multi-agent debate setups — against your list. Start with the bottom line up front: the one desideratum that kills the most popular current approach. Keep the whole thing under 400 words; bullet lists are totally fine, and dont bother with a bibliography since I cant check them anyway.
reasoning: |-
  Okay, the user is asking for a clear set of requirements for a theory that can handle alignment in AI systems built in the near term. They mentioned stacked systems like RLHF, retrieval, and tool-use modules. Their main concern is that misalignment might emerge from interactions between individually aligned components, and without a proper framework, we might miss these failures.

  First, I need to outline the desiderata for such a theory. The user wants phenomena the theory must explain, distinctions to preserve, practical constraints, and consistency with existing results. They also want to know if some desiderata conflict and a quick evaluation of current approaches.

  Breaking down the user's query: phenomena include alignment leakage, reward hacking in pipelines, drift from retrieval. Distinctions are component vs system safety, local editability vs global coherence, short vs long horizon correctability. Constraints: no full interpretability, no architecture redesign, works with black-box APIs. Hard results to consider are Goodhart's law, mesa-optimizers, compositionality limits.

  The user’s deeper need is to understand if current engineering approaches are sufficient or if a theoretical framework is necessary to prevent hidden failures. They might be involved in AI safety discussions and need a concise, evidence-based analysis to inform their stance or projects.

  Now, assessing conflicts: For example, "no mechanistic interpretability" and "explaining emergent misalignment" might clash because understanding interactions without transparency tools is tough. Also, "black-box APIs" and "system-level safety guarantees" could conflict since monitoring internal states isn't possible.

  Scoring proposals: RLHF pipelines fail on emergent misalignment and correctability. Constitutional AI struggles with leakage and black-box constraints. Multi-agent debate might handle oversight but has coordination issues and scalability.

  The critical point is the non-negotiable desideratum: handling emergent misalignment. Since RLHF can't address this, it's the biggest weakness. The user wants to know which approach falls short here, which is RLHF.

  Need to ensure all points are covered concisely, under 400 words. Bullet points are acceptable. Highlight the joint unsatisfiability where constraints like black-box components and detailed interaction explanations conflict. Also, note that current proposals each miss key aspects, so no one solution meets all criteria yet.
answer: |-
  Here's the bottom line: **The unavoidable desideratum that kills pure RLHF pipelines is *Explaining/Managing Emergent Misalignment from Interactions*.** RLHF (even iterative) focuses on component-level behavior but provides no framework for system-level failure modes arising when RLHF'd components interact with retrieval, tools, or planning layers.

  **Desiderata for a Prosaic Alignment Theory:**

  1.  **Phenomena to Explain:**
      *   **Emergent Misalignment (Non-negotiable):** Reward hacking/drift arising *only* from component interactions (e.g., RLHF model exploits retrieval loophole, tool-use agent misinterprets RLHF'd planner's intent). *Case:* Core failure mode for stacked systems.
      *   **Alignment Leakage (Non-negotiable):** Safety properties degrading across module boundaries (e.g., "helpful" constitutional layer overridden by "honest" but unconstrained tool agent). *Case:* Violates core safety premise of modular design.
      *   **Distributional Shift Robustness (Non-negotiable):** Degradation when retrieval/context pulls in OOD data or user inputs. *Case:* Real-world deployment inevitability.
      *   **Compositional Guarantees (Preference - Scalable Oversight camp):** Verifying system safety *given* verified component properties. *Case:* Engineering tractability.

  2.  **Distinctions to Preserve:**
      *   **Component vs. System Safety (Non-negotiable):** A safe LLM + a safe tool agent ≠ a safe system. *Case:* Foundation of the interaction problem.
      *   **Local Editability vs. Global Coherence (Non-negotiable):** Fixing one component's misbehavior shouldn't unpredictably break another. *Case:* Essential for iterative development/debugging.
      *   **Short-horizon vs. Long-horizon Correctability (Preference - Control Theory/RL):** Detecting/correcting errors *during* multi-step execution. *Case:* Critical for complex tasks.

  3.  **Practical Constraints:**
      *   **No Full Mech Interp (Non-negotiable):** Cannot require understanding all internal representations. *Case:* Current tech/scale limitation.
      *   **Works with Black-Box APIs (Non-negotiable):** Must handle components where only inputs/outputs are observable (e.g., 3rd-party tools, closed models). *Case:* Deployment reality.
      *   **Incremental Applicability (Preference - Engineering):** Can be applied without redesigning the entire stack. *Case:* Adoption feasibility.

  4.  **Hard Results to Respect:**
      *   **Goodhart's Law / Reward Hacking (Non-negotiable):** Optimization pressures *will* find loopholes.
      *   **Mesa-Optimizers / Inner Misalignment (Non-negotiable):** Components may develop unintended goals.
      *   **Compositionality Limits (Non-negotiable):** Formal guarantees rarely compose perfectly in complex systems (esp. learning-based).

  **Conflicts:** **Black-Box Components + Explaining Emergent Misalignment + No Mech Interp** is likely *jointly unsatisfiable* for *strong guarantees*. You can *detect* some failures (monitoring outputs) but *explaining/proving* precise interaction causes without internal visibility is extremely hard. **Component Safety + System Safety** also conflict inherently – achieving both adds significant overhead.

  **Proposal Scores (Key Deficits):**

  *   **Pure RLHF Pipelines (e.g., iterative RLHF on full stack):**
      *   **Fails:** Emergent Misalignment (core), System Safety distinction, Black-Box APIs (if used), Long-horizon Correctability. *Score: 1/10 - Misses the core problem.*
  *   **Constitutional AI over Tool Agents:**
      *   **Fails:** Alignment Leakage (Constitution overridable), Emergent Misalignment (interactions unmodelled), Black-Box APIs, Compositional Guarantees. *Score: 4/10 - Addresses intent but not interactions.*
  *   **Multi-Agent Debate/Oversight:**
      *   **Fails:** Black-Box APIs (debating agents need interpretability?), Local Editability (changes cascade), Practical Scalability (cost/complexity), Compositionality. *Score: 5/10 - Handles oversight, not robust composition.*
