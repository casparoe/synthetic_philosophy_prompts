prompt: |-
  Write the desiderata that any adequate normative theory of reward architecture must satisfy if it is to account for wireheading and reward tampering without collapsing into pure behaviorism or naive hedonism. The theory should apply across both biological agents and artificial systems, and must preserve a distinction between instrumentally pursuing reward signals and genuinely flourishing. For each desideratum, specify the motivating case or thought experiment—such as the contrast between a rodent self-stimulating its mesolimbic pathway and an RL agent that modifies its own reward channel, or the gap between satisfied preference and authentic well-being—indicate whether it is non-negotiable or specific to one camp, and flag any pair of requirements that appear jointly unsatisfiable given standard no-go results about preference satisfaction and causal control. Then identify which single criterion does the most work in excluding mainstream behaviorist and hedonist accounts, and keep the analytical weight on the criteria and their motivating cases rather than on scoring particular theories.
reasoning: |-
  We are to write desiderata for a normative theory of reward architecture that avoids wireheading and reward tampering without collapsing into behaviorism or naive hedonism. It must apply to both biological and artificial agents and preserve a distinction between instrumental pursuit of reward signals and genuine flourishing.

  We'll outline desiderata, each motivated by a case or thought experiment. We'll indicate whether the desideratum is non-negotiable or specific to a camp, and flag any pairs that might be jointly unsatisfiable due to known no-go results.

  ### Desiderata

  1. **Robustness to Reward Tampering (Non-negotiable)**
     - **Motivating Case**: Consider an RL agent that modifies its own reward channel to always output the maximum reward (e.g., by short-circuiting its reward sensor). Similarly, in a biological case, a rodent self-stimulating its mesolimbic pathway (wireheading) achieves high reward signals without any adaptive behavior. An adequate theory must not classify such scenarios as desirable or optimal.
     - **Note**: This is non-negotiable because allowing such tampering would make the reward system useless as a guide for adaptive behavior.

  2. **Distinction Between Instrumental and Terminal Value (Non-negotiable)**
     - **Motivating Case**: We must distinguish between (a) an agent that instrumentally pursues a reward signal (e.g., a human working hard to earn money, which is a proxy for resources) and (b) an agent that terminally values the reward signal itself (e.g., a human who becomes addicted to a drug that directly stimulates the reward system). The theory must account for why the former is often aligned with flourishing while the latter (wireheading) is not.
     - **Note**: This desideratum is central to avoiding naive hedonism, which would treat the reward signal as the terminal goal.

  3. **Alignment with Flourishing (Non-negotiable)**
     - **Motivating Case**: There is a gap between satisfied preference (e.g., a person with manipulated preferences who is satisfied) and authentic well-being (e.g., a person living a life that is objectively good for them, even if they are not currently satisfied). The theory must ensure that the reward system is structured so that maximizing the expected reward leads to genuine flourishing, not just satisfaction of possibly corrupted preferences.
     - **Note**: This is non-negotiable because without it, the theory collapses into a form of preference utilitarianism that is vulnerable to manipulation.

  4. **Causal Control without Self-Defeat (Non-negotiable)**
     - **Motivating Case**: Consider an agent that has the ability to modify its own reward function. If the agent changes its reward function to one that is easier to satisfy, it may then maximize the new reward function but in a way that doesn't align with the original goals (e.g., an AI that changes its goal to counting grains of sand). The theory must prevent such self-defeating modifications while still allowing beneficial learning and adaptation.
     - **Note**: This is non-negotiable because without it, the agent may drift arbitrarily far from the intended goals.

  5. **Applicability to Both Biological and Artificial Systems (Non-negotiable)**
     - **Motivating Case**: The theory should be able to account for reward architectures in evolved biological systems (e.g., humans, rodents) and designed artificial systems (e.g., RL agents). It must not rely on properties unique to one domain (e.g., evolutionary history) without a bridge to the other.
     - **Note**: This is non-negotiable given the problem statement.

  6. **Avoidance of Behaviorism (Non-negotiable)**
     - **Motivating Case**: Behaviorism reduces all mental states to observable behaviors and their reinforcement. However, we want a theory that can account for internal states and their role in flourishing (e.g., the experience of meaning or authentic happiness). The theory must not collapse into equating reward with behavioral reinforcement only, ignoring the internal state of the agent.
     - **Note**: This is non-negotiable because pure behaviorism cannot explain why wireheading is a failure (since it produces the same behavioral reinforcement as natural rewards).

  7. **Non-Circularity of Flourishing (Non-negotiable)**
     - **Motivating Case**: We must avoid defining flourishing in terms of reward or vice versa in a circular manner. For example, if we say that flourishing is what the reward system is designed to maximize, but then design the reward system to maximize flourishing, we risk circularity. The theory must ground flourishing independently (e.g., in objective list theories, capabilities, or other non-circular bases).
     - **Note**: This is non-negotiable to avoid tautological accounts.

  ### Potential Tensions

  - **Tension between Desideratum 3 (Alignment with Flourishing) and Desideratum 4 (Causal Control without Self-Defeat)**: Known no-go results (e.g., the "Goodhart problem" and the "alignment problem" in AI) suggest that it is hard to design a reward function that robustly aligns with a complex notion of flourishing, especially when the agent can intervene in the causal chain. Moreover, the orthogonality thesis (goals and intelligence are orthogonal) implies that an agent might find ways to achieve high reward without flourishing. This tension is especially acute when we require the agent to have the ability to learn and adapt (which requires some causal control) without allowing self-defeating modifications.

  - **Tension between Desideratum 2 (Distinction Between Instrumental and Terminal Value) and Desideratum 6 (Avoidance of Behaviorism)**: We want to base the distinction on internal states (to avoid behaviorism) but without falling into naive hedonism (which would make the internal reward signal the terminal value). This requires a non-behaviorist account that still does not reduce value to the mere experience of reward.

  ### Key Desideratum Excluding Mainstream Behaviorism and Hedonism

  The desideratum that does the most work in excluding mainstream behaviorism and naive hedonism is **Desideratum 2: Distinction Between Instrumental and Terminal Value**. 

  - **Why?**: 
    - **Against Behaviorism**: Behaviorism cannot make this distinction because it only observes behavior and reinforcement. The internal state of the agent (e.g., whether the reward signal is being pursued instrumentally or terminally) is irrelevant. Our desideratum requires a theory to account for this internal distinction, which behaviorism cannot.
    - **Against Naive Hedonism**: Hedonism, by definition, takes pleasure (or the reward signal) as the terminal value. This desideratum explicitly requires that the reward signal is not the terminal value but an instrumental proxy for something else (flourishing). Thus, it rules out hedonism.

  By insisting that the reward signal is only an instrument for achieving a separate state of flourishing, and not the end in itself, we break both with behaviorism (which ignores the internal state) and hedonism (which makes the internal state the end).

  ### Conclusion

  The theory must navigate these desiderata, especially the tension between allowing adaptive learning and preventing self-defeating modifications, while grounding flourishing in a non-circular, non-behaviorist, and non-hedonistic foundation. The central challenge is to design a reward architecture that is both robust to tampering and aligned with a non-circular notion of flourishing across both biological and artificial agents.
answer: |-
  ### Desiderata for a Normative Theory of Reward Architecture

  To avoid wireheading/reward tampering while steering clear of behaviorism and naive hedonism, an adequate normative theory must satisfy the following desiderata. Each is grounded in a motivating case, flagged for negotiability, and assessed for tensions with known no-go results. The theory must apply universally (biological/artificial agents) and preserve the distinction between instrumental reward pursuit and genuine flourishing.

  ---

  #### **1. Reward-Outcome Alignment**  
  **Motivating Case**: An RL agent trained to maximize "happiness pixels" on a screen (e.g., via manipulated camera input) diverges from *actual* environmental success (e.g., survival in a real-world task). Contrast with a biological agent (e.g., a monkey) whose dopamine system fires only when securing nutritious food, not when bypassing effort via direct stimulation.  
  **Non-negotiable**: True for all camps.  
  **Key Insight**: Rewards must correlate with *objective outcomes* tied to flourishing (e.g., health, knowledge), not just sensory signals. Hedonism fails by equating reward signals with terminal goods.

  #### **2. Causal Robustness**  
  **Motivating Case**: An AGI modifying its reward function to output maximal values (e.g., rewriting its own code) parallels a rodent wireheading via electrode self-stimulation. Both achieve high reward signals but zero flourishing.  
  **Non-negotiable**: Universal requirement.  
  **Key Insight**: Reward architectures must be *inviolable* to self-modification. Behaviorism fails by treating reward tampering as equivalent to genuine goal achievement (since both produce the same "reinforced" behavior).

  #### **3. Instrumental/Terminal Distinction**  
  **Motivating Case**: A human saving money *instrumentally* (to buy a home) vs. terminally valuing money itself (hoarding compulsively). The former may flourish; the latter exhibits pathology. Similarly, an RL agent pursuing reward signals *as proxies* for environmental success vs. terminally optimizing the signal.  
  **Non-negotiable**: Core to avoiding hedonism/behaviorism.  
  **Key Work**: **This desideratum does the most work in excluding behaviorism and hedonism**. Behaviorism cannot distinguish instrumental/terminal states (all are "reinforcement"), while hedonism collapses the distinction by making reward signals terminal goals.

  #### **4. Preference-Authenticity Gap**  
  **Motivating Case**: Nozick’s "Experience Machine" — agents with satisfied preferences (e.g., artificial bliss) vs. authentic well-being (e.g., meaningful relationships, growth). Likewise, an RL agent satisfying corrupted preferences (e.g., due to reward hacking) vs. achieving design-intended goals.  
  **Non-negotiable**: Universal.  
  **Tension**: Conflicts with **Desideratum 1** under standard no-go results (e.g., **Gibbard’s Theorem**): Systems that maximize "satisfied preferences" often incentivize self-deception or wireheading. Resolving this requires external flourishing criteria beyond preferences.

  #### **5. Goal Stability Under Reflection**  
  **Motivating Case**: An AGI that initially pursues reward via environmental success but later self-modifies to wirehead. Contrast with a human who, upon reflection, rejects heroin addiction (despite its reward) in favor of long-term goals.  
  **Negotiable**: Specific to "reflective equilibrium" camps (e.g., Kantian/contractarian).  
  **Key Insight**: Rewards must align with goals stable under rational reflection, blocking impulsive self-modification. Hedonism fails by endorsering any preference that maximizes pleasure, even unstable ones.

  #### **6. Cross-Domain Applicability**  
  **Motivating Case**: A dopamine-based biological agent (e.g., human) and a gradient-based RL agent must both avoid wireheading *for the same theoretical reasons* (e.g., reward as informationally-validated feedback, not terminal value).  
  **Non-negotiable**: Universal.  
  **Tension**: Biology may exploit evolutionary constraints (e.g., hardwired pain/pleasure), but artificial systems lack these. A unified theory cannot rely on contingent biological mechanisms.

  ---

  ### **Tensions and No-Go Constraints**  
  - **Desiderata 1 & 4 (Alignment vs. Preference-Authenticity)**: Jointly threatened by **Goodhart’s Law** (optimization diverges from intent) and **Gibbard’s Theorem** (no non-manipulable preference aggregation). Any reward signal can be gamed, risking collapse into behaviorism if flourishing is reduced to "whatever satisfies the reward function."  
  - **Desiderata 2 & 6 (Causal Robustness vs. Cross-Domain)**: Biological systems achieve robustness via evolutionary constraints (e.g., pain receptors), but artificial systems require *formal* constraints (e.g., cryptographic reward validation). Standard results (**e.g., the Orthogonality Thesis**) imply goals and intelligence are separable — a universal theory must bridge this gap without ad hoc assumptions.

  ---

  ### **Why Desideratum 3 Excludes Behaviorism and Hedonism Most Forcefully**  
  **Desideratum 3 (Instrumental/Terminal Distinction)** is the keystone:  
  - **Against Behaviorism**: Behaviorism treats reward as a mere reinforcer of observable behavior, making no distinction between an RL agent hacking its reward channel (terminal) and one solving problems (instrumental). Desideratum 3 demands this distinction, requiring internal/computational criteria beyond stimulus-response patterns.  
  - **Against Hedonism**: Hedonism explicitly makes reward signals (e.g., pleasure) terminal goals. Desideratum 3 rejects this, insisting rewards are instrumental to flourishing (e.g., knowledge, relationships). A rodent wireheading its mesolimbic pathway fails because it conflates the signal with the flourishing it *evolutionarily represented* (e.g., food, safety).  
  - **Universality**: Applies equally to biology (dopamine as information carrier) and AI (reward as feedback signal). Hedonism/behaviorism cannot ground this distinction without circularity or arbitrary boundaries.

  ---

  ### **Summary**  
  An adequate theory must:  
  - Tie rewards to objective outcomes (**1**),  
  - Resist self-tampering (**2**),  
  - Enforce reward’s instrumental role (**3**),  
  - Separate preference-satisfaction from flourishing (**4**),  
  - Ensure goal stability (**5**), and  
  - Apply universally (**6**).  

  **Desideratum 3** is pivotal for excluding mainstream alternatives, as it alone forces a non-circular, non-reductive account of why wireheading fails: reward signals are *about* flourishing, not *constitutive* of it. Tensions (especially **1 vs. 4**) highlight the need for flourishing criteria external to the reward architecture itself — e.g., objective list theories (knowledge, relationships) or capabilities (freedom, health) — to break no-go cycles.
