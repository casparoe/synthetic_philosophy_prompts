  ## The 1770 Bengal Famine Through Adam Smith's Lens: Predation, Neglect, and Theoretical Gaps

  Adam Smith's scathing critique of colonial empires, particularly mercantile monopolies like the East India Company (EIC), in *An Inquiry into the Nature and Causes of the Wealth of Nations* (1776) provides a powerful, though not entirely perfect, framework for analysing the 1770 Bengal famine and its preceding administration.

  **1. Mapping Smith's Critique to Bengal:**

  *   **The 'Company-Sovereign':** In Smith's terms, the EIC itself embodied the 'company-sovereign' after its victory at Plassey (1757) and the grant of the *Diwani* (revenue collection rights) in 1765. It ceased to be merely a trading entity and became the de facto territorial ruler of Bengal, Bihar, and Orissa, exercising sovereign powers – taxation, administration, justice – while simultaneously pursuing its primary merchant objective: maximising profits for its shareholders in London. This dual, inherently conflicted role is central to Smith's critique.
  *   **Options for Revenue Extraction & Governance:** The EIC inherited the Mughal system, primarily reliant on land revenue collected via *zamindars* (landlords). Smithian options included:
      *   **Rational Taxation:** Fixing moderate, predictable land revenue demands, encouraging investment and productivity (Smith's preferred model for stable, growing revenue).
      *   **Improvement & Investment:** Investing revenue surpluses in infrastructure (irrigation, transport), agricultural improvement (seeds, techniques), and public goods (security, justice) to stimulate the economy and increase the tax base long-term.
      *   **Mercantile Exploitation:** Using sovereign power purely to maximise immediate cash extraction for trade profits and shareholder dividends.
      The EIC overwhelmingly chose mercantile exploitation. They:
      *   **Dramatically Increased Revenue Demands:** Land revenue was raised drastically – estimates suggest by 50-100% in some areas – often fixed unrealistically high and collected ruthlessly through short-term revenue farmers (*Ijaradars*) incentivised only for immediate extraction.
      *   **Neglected Investment:** Revenue surpluses were remitted to Britain as 'investment' for the Company or spent on warfare and administration costs. Little was reinvested locally in agriculture or infrastructure. The existing canal system decayed.
      *   **Enforced Monopolies:** The Company used its power to enforce monopolies on key goods (salt, betel nut, tobacco) and manipulate internal trade (including grain), distorting markets and extracting surplus.
      *   **Systemic Corruption:** Company officials, grossly underpaid but granted vast opportunities for private trade, engaged in rampant corruption and 'private taxation', further burdening the peasantry and economy.
  *   **Famine Dynamics & Smith's Claim:** The 1768-1770 drought triggered crop failure, but EIC policies turned scarcity into catastrophic famine, starkly illustrating Smith's claim:
      *   **Fiscal Predation:** Despite collapsing agricultural output, the EIC maintained or even intensified revenue demands. Ruthless collection continued, stripping peasants of their last resources (seed grain, tools, livestock) precisely when they needed them most. This direct extraction crippled resilience.
      *   **Neglect of Agricultural Improvement:** Decades of underinvestment left Bengal vulnerable. No significant irrigation projects mitigated the drought. No grain reserves existed. The Company had actively discouraged food crop cultivation in favour of cash crops (like opium and indigo) for export, reducing food security.
      *   **Market Distortion:** The Company's monopolistic practices and internal trade restrictions hindered the free flow of grain to deficit areas. Hoarding by Company agents and Indian elites (often linked to the Company) was rampant. Smith argued free markets would naturally alleviate local shortages, but Company policy actively prevented this mechanism.
      *   **Result:** An estimated 10 million deaths (roughly one-third of Bengal's population). Smith's core argument – that a merchant company ruling a territory would prioritise short-term plunder over the long-term health and productivity of its territory, leading to ruin – is tragically vindicated.

  **2. Where Smith's Theory is Silent or Breaks:**

  *   **Moral Status of Victims (Company vs. Crown Rule):** Smith does not explicitly differentiate the moral status of famine victims based on the *type* of ruler (Company vs. Crown). His outrage is directed at the *system* of mercantile monopoly exercising sovereignty, which he sees as inherently exploitative and destructive. He might argue Crown rule *could* be less immediately predatory if motivated by state interest in stable, long-term revenue (as opposed to merchant dividend maximisation), but he offers no guarantee. His framework implies suffering stems from the structure, not the specific legal title of the sovereign. The Bengal famine's horror lies in the *merger* of absolute commercial greed with absolute sovereign power, a unique evil Smith identifies.
  *   **Grain-Trade Monopoly: Proximate Cause vs. Structural Feature:** Smith's framework struggles slightly here. He *does* identify monopolies (especially on necessities) as a core, structural evil of mercantile systems, inherently causing high prices and scarcity (*WN*, Book IV). The EIC's grain-trade manipulation fits perfectly within this structural critique. However, the *specific* use of the monopoly *during the famine* – restricting movement, exacerbating hoarding, prioritising Company stores/export – acts as a devastating proximate cause. Smith might argue the proximate cause *is* the inevitable consequence of the structural feature. The monopoly wasn't an aberration; it was the logical operation of the 'company-sovereign' system under stress. His theory readily accounts for it as both structural and proximate.

  **3. Assessing Smith's Broader Argument (Colonies as Net Fiscal Loss):**

  *   **Confirmation with Caveats:** The Bengal catastrophe strongly supports Smith's argument that colonies, *when administered by mercantile monopolies exercising sovereignty*, are ultimately net fiscal drains *on the metropolis*.
      *   **Short-term Gain, Long-term Loss:** While the EIC extracted enormous wealth from Bengal *initially* (the infamous 'Plassey Plunder'), the famine caused a catastrophic collapse in land revenue for years afterwards. The Company had to be bailed out by the British state (the 1773 Regulating Act and subsequent loans).
      *   **Costs of Administration & Security:** Governing Bengal required expensive armies and bureaucracy, costs borne ultimately by Britain (directly or indirectly via the crippled Company).
      *   **Destruction of the Golden Goose:** Smith's central point: predatory rule destroys the productive capacity that generates sustainable wealth. Bengal was devastated, becoming a liability rather than an asset.
  *   **Category Error?** The catastrophe does **not** reveal a category error in Smith treating territorial sovereignty as "merely another variant of mercantile miscalculation." Instead, it powerfully **confirms** his core insight: that the *merger* of mercantile monopoly with territorial sovereignty creates a uniquely destructive entity. The famine wasn't just a *trade* mistake; it was the catastrophic failure of *government* – a failure *caused* by the fact that the government's primary motive was mercantile profit, not good governance or the welfare of its subjects. Smith understood that sovereignty in the hands of merchants transforms governance into systematic plunder, leading to ruin. Bengal was the horrific proof.

  **Conclusion:**

  The 1770 Bengal famine stands as a grim testament to the validity of Adam Smith's core critique of the 'company-sovereign'. The East India Company's administration exemplified the fiscal predation and systemic neglect of agricultural improvement he predicted when mercantile monopolies acquired territorial power. The famine dynamics – driven by relentless revenue extraction, lack of investment, and market-distorting monopolies – align precisely with his framework. While Smith doesn't differentiate the moral status of victims based on the ruler's formal title, his analysis perfectly captures the structural evil of the EIC's rule. The grain monopoly was both a structural feature and a proximate cause within his model. Finally, the famine's aftermath, leading to the Company's bankruptcy and state bailout, strongly confirms Smith's broader argument that such colonial ventures, managed thus, become net fiscal burdens on the metropolis. The catastrophe resulted not from a category error in Smith's thinking, but from the very category he identified and condemned: the fundamentally destructive nature of a trading corporation wielding sovereign power over a territory. Bengal proved his worst fears correct.
