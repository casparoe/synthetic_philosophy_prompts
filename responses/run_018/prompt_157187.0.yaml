answer: |-
  Here’s a systematic disambiguation of the slogan, designed to expose its hidden commitments and tensions. I’ll first map the conceptual space, then apply it to your quantum case, and finally critique the seminar argument.

  ---

  ### **The Interpretive Menu: Disambiguating the Slogan**
  *(Key distinctions: "Ought" type / Credence type / Chance type / Scope / Synchronic vs. Diachronic)*

  1. **The Normative-Synchronic Principle (Lewisian Core)**  
     - **Ought**: Rational norm (violation implies epistemic irrationality).  
     - **Credence**: Subjective degree of belief (Bayesian credence function).  
     - **Chance**: Physical propensity (primitive, modally robust "big-C" Chance).  
     - **Scope**: Propositions with well-defined chances *after* conditioning on "admissible evidence" (Lewis’s *Principal Principle*).  
     - **Timeframe**: **Synchronous** – *current* credence must equal *current* chance given total evidence.  
     - *Implied commitment:* Chances exist independently of agents’ theories.

  2. **The Calibrationist-Diachronic Principle (Frequentist Leaning)**  
     - **Ought**: Pragmatic norm (instrumental for long-term accuracy).  
     - **Credence**: Action-guiding weight (e.g., for betting or decision-making).  
     - **Chance**: Long-run frequency (in a reference class).  
     - **Scope**: Only propositions with stable frequencies (e.g., repeatable events).  
     - **Timeframe**: **Diachronic** – credences should *calibrate* to chances *over many trials*; no strict synchronic obligation.  
     - *Implied commitment:* Chances are emergent patterns, not fundamental.

  3. **The Deference-to-Model Principle (Formal Epistemology)**  
     - **Ought**: Institutional norm (within a modeling framework).  
     - **Credence**: Calibrated predictive distribution (in an algorithm/agent).  
     - **Chance**: Feature of a **specific theoretical model** (e.g., QM’s Born rule).  
     - **Scope**: Propositions defined within the model’s ontology.  
     - **Timeframe**: **Synchronous** – *if* adopting model M, current credence must match M’s probabilities for M-defined events.  
     - *Implied commitment:* "Chance" is model-relative; no theory-neutral chances.

  4. **The Metaphysical Alignment Principle (Radical Objectivism)**  
     - **Ought**: Metaphysical "ought" (beliefs *must* track mind-independent reality).  
     - **Credence**: Representation of ontological certainty (not merely subjective).  
     - **Chance**: Physical propensity **known with certainty** (e.g., via Laplace’s demon).  
     - **Scope**: All propositions (chances are defined for everything).  
     - **Timeframe**: **Synchronous** – credences *are* chances for an omniscient agent.  
     - *Implied commitment:* Determinism is compatible with "chance 0 or 1"; hidden variables negate non-trivial chances.

  5. **The Pragmatic-Imposition Principle (Anti-realist)**  
     - **Ought**: Institutional/pragmatic (science *treats* model outputs as chances).  
     - **Credence**: Operational belief (e.g., output of a prediction algorithm).  
     - **Chance**: Conventional assignment within a **scientific practice** (e.g., "QM chances" as defined by lab protocols).  
     - **Scope**: Propositions where science imposes a chance rule.  
     - **Timeframe**: **Synchronous** – agents *must* use institutional chances *by fiat*.  
     - *Implied commitment:* Scientific authority overrides individual theories.

  ---

  ### **Application to the Quantum Tension**
  **Scenario**: Agent knows (a) QM assigns P(spin-up) = 0.5, and (b) a deterministic hidden-variable (HV) theory specifies the outcome with certainty (P=0 or 1).  
  **Question**: Must the agent hold credence 0.5?  

  | **Interpretation**               | **Credence Required?** | **Why?**                                                                 | **Plausibility/Coherence** |
  |----------------------------------|------------------------|--------------------------------------------------------------------------|----------------------------|
  | **Normative-Synchronic**         | **Yes**                | Admissible evidence excludes HV knowledge (Lewis: HV info is "inadmissible"). Chance 0.5 is fundamental. | **Contentious** – Why is HV knowledge "inadmissible" if true? Rejects epistemic access to underlying determinism. |
  | **Calibrationist-Diachronic**    | **No**                 | Agent expects long-run frequency 0.5 *if* repeating experiments *without* HV access. For *this* particle, credence 0/1 is rational. | **Plausible** – Distinguishes singular case (HV) from aggregate (QM). |
  | **Deference-to-Model**           | **Only if using QM**   | If agent uses QM *as predictive tool*, credence=0.5. If using HV model, credence=0/1. No conflict. | **Coherent** – Rejects incompatibility; models are tools. |
  | **Metaphysical Alignment**       | **No**                 | Chances *are* 0 or 1 if HV is true. QM’s 0.5 is ignorance; rational credence matches ontology. | **Incoherent?** – If HV is true, "chance 0.5" doesn’t exist. Slogan self-destructs. |
  | **Pragmatic-Imposition**         | **Yes**                | Science institutionally demands QM probabilities. HV theories are "unsanctioned." | **Politically coherent, epistemically dubious** – Enforces dogma. |

  ---

  ### **Critique of the Seminar Argument**
  The speaker assumes a **Normative-Synchronic** reading to claim agents *must* override internal models with physical chances. This requires:
  1. **Chances as mind-independent** (rejecting model-relativity).  
  2. **Inadmissibility of HV knowledge** (even if true!).  
  3. **Authority of QM probabilities** as "true" chances.  

  **Where this fails**:  
  - **Hidden variables**: If HV theories are *possible*, the "inadmissibility" move is question-begging. Why privilege QM’s probabilities over HV’s certainty?  
  - **Model-relativity**: QM chances are *defined within QM*. An agent with a superior theory (e.g., HV) has no reason to defer.  
  - **Triviality threat**: If "chance" just means "what QM says," the slogan reduces to "agents ought to believe QM" – which is circular.  

  **Readings that undermine the argument**:  
  - **Deference-to-Model**: Allows agents to use alternative models (e.g., HV) without conflict.  
  - **Calibrationist-Diachronic**: Permits credence 0/1 for *this* particle while accepting QM for ensembles.  
  - **Metaphysical Alignment**: If HV is true, QM’s 0.5 isn’t the "objective chance."  

  **Readings that (superficially) support it**:  
  - **Pragmatic-Imposition**: But this is about institutional compliance, not rationality.  
  - **Normative-Synchronic**: Only if we accept Lewis’s inadmissibility – which is contested precisely in QM contexts.  

  ---

  ### **Your Framing: Valid Tension or Confusion?**
  Your framing exposes a **genuine fissure** in formal epistemology:  
  - **No unitary "Principal Principle"**: Lewis’s original formulation assumes chance supervenes on Humean mosaics. But in QM, Humeanism is contested (e.g., wavefunction realism).  
  - **Hidden variables aren’t incoherent** – but they *are* "inadmissible" in *standard* Principal Principle frameworks. This is a **choice**, not a necessity.  

  **The core issue**: The slogan tries to force a **monism about chance** (only QM probabilities are "objective"), while your case highlights **pluralism** (competing theories with different probability structures). The seminar speaker’s move is thus **dogmatic** – it presumes QM’s probabilities are metaphysically privileged.  

  **Pushback invitation**: The slogan’s force vanishes if we reject any of:  
  - Mind-independent chances,  
  - QM’s completeness,  
  - Or the synchronic tyranny of "admissible" evidence.  
  A rational agent with a deterministic HV theory *should* assign credence 0 or 1 – no matter what QM says.  

  ---  
  **Final verdict**: The seminar argument works only by smuggling in a contested metaphysics of chance and an authoritarian stance on theory choice. Disambiguated, the slogan is either false (if chances are model-relative), trivial (if "chance" means "QM’s probability"), or incoherent (if HV theories are possible). A better norm: **"Rational credences ought to track the best *available* causal-explanatory model."**
