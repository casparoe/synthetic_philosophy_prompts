  ### Seminar Activity: Discovering Strategy-Stealing through a Novel Game

  **Game Name:** *PathPair*  
  **Objective:** Connect both of your designated sides with a continuous chain of your tokens.  
  **Board Setup:**  
  - Draw a 3x2 grid of circles (6 circles total, arranged in 2 rows and 3 columns).  
  - **Player 1 (Blue):** Wins by connecting the **left side** (column 1) to the **right side** (column 3) with adjacent tokens (up/down/left/right adjacency).  
  - **Player 2 (Red):** Wins by connecting the **top side** (row 1) to the **bottom side** (row 3) with adjacent tokens.  
  **Rules:**  
  1. Players take turns placing their token (blue or red) in an empty circle.  
  2. First player to complete a continuous path of their tokens connecting their two sides wins.  
  3. **Harmless waste move:** Placing the first token in the center (position [2,2]) is strategically weak but not detrimental (similar to a corner in Hex).  

  **Why *PathPair* works:**  
  - **Minimal/symmetric:** Rules are identical except for first-player advantage.  
  - **Perfect information:** All moves visible.  
  - **First-player win:** By strategy-stealing (though students discover this).  
  - **Harmless waste:** Opening at [2,2] doesn’t sabotage Blue; they can still win with optimal play.  

  ---

  ### **Phase 1: Paired Silent Play (20 min)**  
  - **Setup:** Pair students into 6 pairs. Give each pair a *PathPair* board and tokens.  
  - **Instructions:**  
    - Play 10 games (5 as Blue/first, 5 as Red/second).  
    - Record only: Who started? Who won?  
    - **No talking or strategy discussion.**  
  - **Facilitator:**  
    - Circulate silently. Track aggregate results (e.g., "Blue won 28/30 games across pairs").  
    - **Goal:** Students notice Blue always wins unless Red capitalizes on a mistake, but won’t know why.  

  ---

  ### **Phase 2: Guided Worksheet (35 min)**  
  - **Setup:** Regroup into 3 teams (4 students each). Distribute worksheets:  
  > *"Assume Red (second player) has a winning strategy S. Blue (first player) will use S against Red to force a contradiction."*  
  > **Q1:** If Blue makes a random opening move (e.g., at [2,2]), then "forgets" this move, what should Blue do next?  
  > *Expected:* "Use Red’s strategy S as if the board is empty and Blue is now Red."  
  >  
  > **Q2:** When Red moves, how does Blue respond using S?  
  > *Expected:* "Blue imagines a parallel game where their opening move never happened. When Red plays in real life, Blue applies S to that parallel game."  
  >  
  > **Q3:** What if S tells Blue to play where Blue’s opening move already is?  
  > *Expected:* "Blue plays anywhere else (e.g., randomly). Their extra token might help them win."  
  >  
  > **Q4:** How does Blue win? Why is this a contradiction?  
  > *Expected:* "Blue either wins by following S or their extra token creates a shorter path. This contradicts ‘Red always wins with S’."  

  - **Facilitator:**  
    - **Redirect explicit strategists:** If a group derives Blue’s actual strategy (e.g., "Blue should control the center"), ask: *"What if Blue opens poorly at [2,2]? Can they still guarantee a win without knowing how?"* Emphasize **non-constructivity** ("We prove Blue wins without knowing *how*").  
    - **Hint sparingly:** "Focus on how Blue ‘steals’ S, not on finding moves."  

  ---

  ### **Phase 3: Preference Auction & Debrief (25 min)**  
  - **Preference Auction (10 min):**  
    - Announce: "Bid hypothetical points (0–100) to play as Blue or Red. Higher bid = stronger preference."  
    - Record bids. **Expected:** Most bid >80 for Blue.  
    - Discuss: "Why bid high for Blue?" *Expected:* "Blue always won in practice."  

  - **Debrief (15 min):**  
    1. **Map the worksheet to strategy-stealing:**  
       - **Symmetry:** "Red’s strategy S assumes Blue moves first. Blue exploits this by ‘mirroring’ S."  
       - **Dummy move:** "Blue’s opening at [2,2] is ‘wasted’ but blocks S’s move there, forcing Red off-strategy."  
       - **Non-constructive:** "We proved Blue has a winning strategy without finding it."  
    2. **Frank reflections:**  
       - **Reproduces:** "Extra options can’t harm you (Blue’s center move doesn’t hurt)."  
       - **Fails to reproduce:**  
         - *Actual winning strategy* (e.g., Blue should control [1,2]/[3,2] edges).  
         - *Games where extra tokens hurt* (e.g., Go, where stones can obstruct your own liberties).  
    3. **Name the concept:** Reveal "strategy-stealing argument" and cite classics (Hex, Chomp).  
    4. **Acknowledge failure mode:** "Some groups found Blue’s explicit strategy—this misses the non-constructive ‘stealing’ insight. We want the proof, not the tactic."  

  ---

  ### **Facilitator Notes**  
  - **Predictable issue:** 1–2 groups will derive Blue’s optimal strategy (e.g., "Take [1,2] first"). Redirect by emphasizing: *"The point isn’t to find the best move—it’s to show any move can win if we steal S."*  
  - **Why *PathPair*?**  
    - Minimal (6 cells), symmetric, and first-player win.  
    - Harmless waste ([2,2]) is intuitive and avoids Hex/Chomp tropes.  
  - **Timing rigor:** Enforce silence in Phase 1; keep Phase 2 worksheet focused on contradiction.  
  - **Debrief honesty:** Admitting the argument’s limitations (e.g., non-constructivity, real-game exceptions) builds credibility.  

  This activity forces students to *feel* strategy-stealing by constructing the argument themselves, making the abstract tangible. The auction and debrief solidify intuition before formalizing the concept.
