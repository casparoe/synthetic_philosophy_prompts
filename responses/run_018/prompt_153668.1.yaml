  Okay, the user is preparing to lead a seminar on Strawson's reactive attitudes in a moral responsibility context. They want to shift the focus from the typical determinism debate to Strawson's perspective, making determinism seem irrelevant. Their plan involves using a modified case study involving a self-driving car algorithm instead of the usual interpersonal examples. I need to help them structure this effectively.

  First, I should consider their primary goal: restructuring the students' framing. The students are stuck on whether determinism allows moral responsibility. Strawson's point is that reactive attitudes are inherent in human interactions, so the determinism question misses the point. The challenge is to present this without falling into the compatibilism debate or AI ethics tangents.

  The user's chosen example of a self-driving car is interesting. It needs to highlight the difference between participant reactive attitudes and the objective attitude. The example must show that we don't hold the algorithm responsible because it lacks the characteristics that trigger our reactive attitudes—like intentions, understanding, or emotional reciprocity. But the example shouldn't lead into AI ethics; it's purely illustrative for Strawson's framework.

  I need to outline the dependency order. Starting with a relatable interpersonal scenario makes sense to ground the students in familiar territory. Then, introducing the objective attitude contrast. After that, bringing in the modified example with the algorithm. The sequence should build step by step, showing how reactive attitudes depend on seeing others as members of the moral community.

  Key misconceptions to address: One is that Strawson is just rebranding compatibilism. I need to clarify that he's changing the question entirely. Another is reducing reactive attitudes to non-cognitive feelings. Emphasizing that they involve cognitive elements like expectations and judgments. Also, the idea that Strawson denies free will—instead, he's shifting the discussion away from metaphysical debates.

  The self-driving car example must possess certain features: it should be autonomous in a functional sense but lack human-like intentions or emotional capacity. It must lack moral understanding and the ability to participate in mutual relationships. This highlights that our reactive attitudes require seeing the other as a "reason-responsive" agent in the moral sense.

  The session is most vulnerable when introducing the algorithm example. Students might veer into AI ethics or question if advanced AI could warrant reactive attitudes. The facilitator should explicitly refuse to engage in speculative AI discussions and steer back to Strawson's human-focused argument.

  For the closing check, students should recognize that the presence of reactive attitudes isn't about metaphysics but about interpersonal dynamics. A question like whether determinism changes how we feel when wronged by a friend can test their understanding. Genuine uptake means seeing the framework's independence from determinism, not just discomfort with it.

  The weakest point in the arc is the transition from human examples to the algorithm. A student might accept the human cases but argue that reactive attitudes are still irrational if determinism is true. The facilitator needs to reinforce that Strawson's point is the inevitability of these attitudes in our form of life, making determinism irrelevant to their existence.

  Pedagogically, if evidence showed that starting with non-human examples creates confusion, or if students struggle with abstracting from interpersonal cases, the sequence might need adjustment. But the current structure builds from concrete experiences, which should aid comprehension. The key is maintaining focus on the framework's applicability to human interactions, using the algorithm only as a contrast.
answer: |-
  Here’s a structured teaching plan designed to reframe the debate using your self-driving car example while targeting the specific misconceptions and vulnerabilities you’ve identified. The arc prioritizes conceptual dependencies and intercepts predictable errors at critical junctures.

  ---

  ### **Teaching Plan: Strawson’s Reactive Attitudes as Groundwork for Moral Responsibility**
  **Core Objective:** Shift focus from *"Does determinism permit responsibility?"* to *"What practices constitute holding responsible?"*  
  **Anchor Example:** **Modified Self-Driving Car Scenario**  
  *Deliberate design:*  
  - **MUST POSSESS:**  
    - Functional autonomy (makes context-sensitive decisions without real-time human input).  
    - Harmful outcome (e.g., swerves to avoid a dog, hitting a pedestrian when braking was feasible).  
    - Avoidability (algorithm had alternatives; harm wasn’t inevitable).  
  - **MUST LACK:**  
    - Any anthropomorphized traits (no "intent," "understanding of moral reasons," or capacity for reciprocity).  
    - Consciousness/subjectivity (framed purely as code executing optimization functions).  
  *Purpose:* Forces distinction between *blameworthy agency* and *faulty system* without triggering AI-personhood debates.  

  ---

  #### **Dependency Order & Sequence**  
  *(Total: 50 min)*  
  **1. Priming: Reactive Attitudes in Familiar Context** (10 min)  
  - *Start interpersonal:* "Recall being intentionally lied to by a friend. Describe your emotional reaction."  
  - *Elicit:* Resentment, betrayal—**not** just sadness/frustration. Highlight cognitive elements: "They *should have known better*," "They *disregarded me*."  
  - *Key move:* Label these as **participant reactive attitudes** (PRAs). Define: Emotions/expectations *from within* interpersonal relationships.  
  - *Why first?* Grounds discussion in universal experience before abstraction. Avoids cold-start with AI example.  

  **2. Contrast: The Objective Attitude** (8 min)  
  - *Introduce via human case:* "Now imagine the liar has a brain tumor causing compulsive dishonesty. Does your resentment persist?"  
  - *Elicit shift:* PRA dissolves; replaced by clinical concern, management strategies. Define **objective attitude** (OA): Seeing others as objects of treatment/prediction, not moral negotiation.  
  - *Intercept Misconception #1:* "PRAs aren’t non-cognitive feelings!" Emphasize their *judgmental* structure (e.g., "You *wronged me*").  

  **3. Introduce Anchor Example: Self-Driving Car** (12 min)  
  - *Present case:* Algorithm causes avoidable harm. "Do you feel *resentment* toward it? Why/why not?"  
  - *Predictable responses:*  
    - "It’s just a tool!" → Reinforce OA (we predict/fix it, don’t *blame* it).  
    - "But it’s programmed!" → Note humans are "programmed" by genes/upbringing too—yet we resent *them*.  
  - *Crucial contrast:* OA applies here *even though* the system is autonomous/avoidant. **Why?**  
  - *Strawson’s insight:* PRAs require seeing the other as a **member of the moral community**—capable of understanding/reacting to moral demands.  

  **4. Connect to Determinism** (10 min)  
  - *Pose pivot question:* "If determinism is true, should we replace PRAs with OA *toward humans*?"  
  - *Elicit intuitions:* Most will say "no" instinctively. *Press:* "Why not, if humans are just complex algorithms?"  
  - *Reveal Strawson’s move:*  
    - PRAs are *constitutive* of human relationships. We *cannot* sustain OA universally without ceasing to be human.  
    - Determinism doesn’t alter this: "The facts as we know them" (human psychology/sociality) make PRAs *inescapable*.  
  - *Intercept Misconception #2:* "This isn’t compatibilism!" Compatibilism *answers* the determinism challenge; Strawson *dissolves* it by changing the subject to our actual practices.  
  - *Intercept Misconception #3:* "Strawson isn’t denying free will!" He’s making it irrelevant to the PRA framework.  

  **5. Vulnerability Point: The "So What?" Challenge** (5 min)  
  - *Predictable collapse risk:* "But if determinism is true, PRAs are *irrational*!"  
  - *Response:* "Strawson agrees—*if* rationality requires OA. But is it? PRAs are *how we value relationships*. Is love irrational because brains are determined?"  
  - *Refuse:* Engaging metaphysical debates. "We’re examining *what we do*, not what physics allows."  

  **6. Closing Check: Genuine Uptake vs. Discomfort** (5 min)  
  - *Diagnostic question:* "If a close friend commits a minor betrayal (e.g., breaks a promise), and you learn determinism is true, does that *change* your resentment?"  
    - **Genuine uptake:** "No—my resentment isn’t about metaphysics; it’s about *us*."  
    - **Discomfort:** "Yes, because they couldn’t have done otherwise."  
  - *Reframe:* "Strawson’s point: The latter response tries (but fails) to adopt OA toward a participant. We *can’t* do it consistently."  

  ---

  ### **What to Explicitly Omit/Refuse**  
  - **Reject:** Debating AI consciousness/moral status. *Script:* "This isn’t about AI; it’s a contrast case for human PRAs."  
  - **Omit:** Strawson’s taxonomy of OAs (psychopathology, etc.). Distracts from core argument.  
  - **Omit:** Pre-Strawsonian free-will history. Assumed knowledge from prior coursework.  

  ---

  ### **Weakest Point & Limits of Recommendation**  
  - **Weakest Step:** Transition from human OA cases (tumor) to algorithm (Step 3 → 4).  
    - *Risk:* Students grant PRAs are natural but insist they’re *unjustified* under determinism.  
    - *Mitigation:* Stress that Strawson’s "naturalism" isn’t descriptive—it’s normative for *our form of life*. If we abandon PRAs, we abandon relationships.  
  - **What Would Change My View:**  
    - *Pedagogical evidence* that students grasp the "inescapability" of PRAs better via *human* examples alone (e.g., psychopaths). Your algorithm example risks overcomplication if students fixate on AI.  
    - *Conceptual argument* that resentment toward algorithms *is* coherent (e.g., in tech-literate cohorts). This would undermine the OA contrast.  
  - **Contradiction Point:** A student could accept Steps 1-3 (PRAs exist, OA applies to algorithms/humans with tumors) but reject Step 4: *"Determinism means all humans deserve OA, so PRAs are errors we must overcome."*  
    - *Response:* "Strawson’s reply: Try it. Can you genuinely view your loved ones as *only* mechanistic? If not, PRAs aren’t chosen—they’re our condition."  

  ---

  **Why This Sequence Works:**  
  1. Starts concrete (personal resentment) → abstracts (algorithm) → returns to human context (determinism challenge).  
  2. The algorithm example *forces* the PRA/OA distinction without metaphysical baggage.  
  3. Misconceptions are intercepted *when they arise* (e.g., "PRAs = emotions" countered during priming).  
  4. Closing check isolates whether the *framework shift* occurred versus lingering determinism anxiety.  

  **Carry this into class:** Use the algorithm example *sparingly*—it’s a scalpel, not a hammer. If the discussion veers into AI, ruthlessly pivot back to "What does this reveal about *human* reactions?" Your goal isn’t to convince, but to make the old question seem misplaced.
