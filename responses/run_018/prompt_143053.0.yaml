answer: |-
  The snow squeaks under my boots, that particular sound of cold so deep it stings the lungs. Twenty kilometres in, the pack straps dig trenches into my shoulders, the mock rifle a clumsy, constant reminder. My section leader, a baker who smells perpetually of yeast even out here, grunts beside me. Ahead, the university lecturer stumbles on a root, caught by the shop assistant. That’s the thing about this place, this freezing hell disguised as national service – the levelling. In the barracks, in the mud, the tax brackets blur. We all smell the same gun oil, ache the same way.

  It wasn’t the call-up letter itself that surprised me. It was the *option*. The elegant, bureaucratic trapdoor: pay the Exemption Tax. Clean, efficient. The money, they explain with sterile clarity, funds both the slimmed-down professional core *and* bolsters the social safety net. A win-win for the productive citizen. Clara, pragmatic as ever, saw it instantly. "Leo," she said, spreading grant applications across our kitchen table, "your project deadline is *next month*. Pay the tax. It’s rational. You contribute financially, far more than your labour is worth digging pointless trenches. You *support* the system." Support. Like sending a cheque to a charity.

  But standing here, breath pluming white in the pre-dawn gloom, watching the baker check the map with the professor, "support" feels thin. This shared misery, this ritual of frostbite and bad coffee, isn’t about learning to dismantle a rifle faster. It’s about dismantling something else. The illusion of separation. The lawyer shivers next to the bus driver. We are equally vulnerable, equally responsible for this patch of neutrality we inherit. Paying the tax… it feels like buying insulation. Building a wall between myself and the raw, uncomfortable fact of our collective defence. Outsourcing my share of the chill.

  I remember the professionals we saw during urban warfare drill last week. Smooth, efficient, moving through the staged rubble like predators. Impressive. Detached. One nodded curtly at our ragtag reserve unit, his eyes holding a flicker of… what? Pity? Amusement? We were the amateurs, the necessary anachronism. His salary, I realised with a jolt, might partly come from people like… well, like the *me* I could choose to be. The paying client. He secures *me*. The transaction felt cold, clean, and utterly alien.

  Clara calls it civic contribution through taxation – sophisticated, modern. But here, shoulder-to-shoulder with men whose lives I’d never otherwise touch, breathing the same frigid air thick with shared effort, the tax feels like an escape hatch. An admission that the burden, the *vulnerability*, is for others. That I am content to be a consumer of security, not a co-creator. The professionals become my shield-bearers, paid for by my exemption. The welfare state gets a boost, funded ironically by my withdrawal from the very mechanism meant to bind us together.

  The section leader barks an order. We shoulder our packs, heavier now with fatigue. The lecturer winces, adjusts his straps. The shop assistant offers a silent nod of encouragement. This ache, this exhaustion, this utter lack of glamour – it’s the glue. It whispers, *You belong here, with them. This neutrality isn't a service provided; it's a pact lived.* Paying the tax buys comfort, efficiency, maybe even a clearer conscience about deadlines and grants. But it risks turning solidarity into subsidy, shared fate into a privileged isolation. When the snow finally thaws, will the line between citizen and client feel as permanent as these frozen tracks beneath my boots? Or will writing that cheque feel like erasing my name from the brittle, vital contract written not in ink, but in shared frostbite?
