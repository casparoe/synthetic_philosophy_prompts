  hey, quick philosophical snag for a novel i'm drafting — my protaganist is basically an Ayer-style logical positivist, and she's conviced that verificationism kills the idea of life after death not because it's false but because the concept is literally meaningless, like saying 'the number five is green.' but then she runs into this argument that Ayer's own near-death episode later in life actually undermines that, since he described that vision and then said it didn't change his atheism but also didn't sit well with verificationism either. is she right to think that for Ayer, death is just the end of empirical verification, or is there a hidden contradiction in his view? also, does verificationism actually commit him to saying consciousness can't outlast brain death, or is that a seperate materialist claim he smuggled in? i keep feeling like there's a false presupposition in my own framing — like i'm treating 'meaningless' and 'false' as the same thing, or assuming his personal experience has to match his philosophy — but i can't quite pin it down. can you untangle it?
