  But is this *always* necessary? Probably not. A sonnet can bend morphology if it keeps the volta’s punch. Still, for poems where structural play is central (Marot’s rondeaux?), morphosyntactic echo might be the hidden key. I’ll argue for the user’s concept—it’s bolder and answers their core question—but stress that Hofstadter’s big-picture view prevents translations from becoming sterile exercises. 

