answer: |-
  Let's dissect Brouwer's 1908 argument systematically, addressing both your core epistemic question and the hermeneutic challenge regarding choice sequences. I'll adhere strictly to the text's context while clarifying where later ideas are nascent versus anachronistic.

  ### I. Core Logical Structure of the 1908 Argument
  1. **Mathematics as Languageless Mental Activity**:  
     Brouwer asserts mathematics arises from *causal attentional acts* in time, divorced from language or formal symbols. Mathematical truths are constituted by *performable mental constructions* (e.g., iterating a step, forming an intuition of continuity).  
     - **Epistemic Status**: These constructions are **not empirical psychological events** but *transcendental acts of the primordial intuition of time*. Time is the *a priori* framework enabling mathematical thought itself. Validity derives from the *possibility* of the construction within temporal intuition, not its empirical occurrence.  
     - **Intersubjectivity?** Brouwer assumes a shared structure of temporal intuition (à la Kant), making constructions objectively valid *in principle* for all minds. However, **communicability is secondary and imperfect**. Language is a fallible tool for *describing* constructions, not grounding truth. No intersubjective criterion is needed for validity—only the mind's ability to conceive the construction matters. This avoids psychologism by rooting validity in transcendental conditions, not contingent mental states.

  2. **Rejection of LEM for Infinite Domains**:  
     Brouwer argues LEM (A ∨ ¬A) presupposes a *completed decision*. For finite sets, a construction can survey all elements (e.g., check if a prime exists in {2,4,6}). For infinite sets, no such completion is possible.  
     - **Key Criterion**: Asserting A ∨ ¬A requires either:  
       (a) A construction *proving* A, or  
       (b) A construction *proving* that any attempt to prove A leads to absurdity.  
       Without (a) or (b), the disjunction is meaningless—it claims a nonexistent "decision in advance."

  3. **Temporality as Foundational**:  
     Constructions unfold in *time* as a sequence of attentive acts. Space and formal symbols are rejected as a priori; they are derivative of temporal intuition. This grounds Brouwer's insistence that mathematics is *becoming*, not static being.

  ---

  ### II. Addressing Your Friend's Computational Interpretation
  The distinction between **lawlike (algorithmic) sequences** and **choice sequences** is *implicit* but not yet formalized in 1908. Here’s the nuance:

  - **Nascent Elements in 1908**:  
    - Brouwer’s rejection of "completed infinity" implies infinite sets are *ongoing processes*.  
    - His emphasis on *unfinished constructions* aligns with the later idea that sequences without predetermined laws (choice sequences) cannot be treated as determinate wholes.  
    - The critique of LEM hinges on whether a construction *resolves* a property—presaging the later notion that lawlike sequences are LEM-governed, while choice sequences are not.

  - **Hermeneutic Boundaries**:  
    - **Legitimate**: The 1908 text *logically necessitates* a distinction between algorithmic (predictable) and open-ended processes. When Brouwer says an infinite set "can never be finished," he implies that only sequences with a *constructible law* could potentially satisfy LEM—foreshadowing lawlike sequences.  
    - **Anachronistic Risk**: The *technical framework* of choice sequences (e.g., freely creating values ad infinitum) is absent. Brouwer’s 1908 focus is on **generic infinite sets** (e.g., ℕ), not sequences with non-lawlike components. Importing the later *formal machinery* would overstep, but the *conceptual dichotomy* is embryonically present.

  ---

  ### III. Separating Construction-Priority from Proto-Computationalism
  | **Aspect**               | **Strictly in 1908 Text**                                  | **Proto-Computational Overextension**                     |
  |--------------------------|------------------------------------------------------------|----------------------------------------------------------|
  | **Mental Construction**  | Primordial act in time; validates propositions *for the mind* | Casting it as "computation" risks reducing it to formal symbol manipulation. |
  | **Infinite Domains**     | Rejects LEM due to *unfinishability*; no "completed whole" | Framing this as "algorithm vs. non-algorithm" imports CS theory. |
  | **Temporal Becoming**    | Ontological basis: math as activity, not object            | Interpreting "unfinished" as "non-terminating process" is apt but *not* computational. |
  | **Intersubjectivity**    | Implicit via shared intuition; *not* via language/empiricism | Later choice sequences address communicability; 1908 does not. |

  ---

  ### IV. Resolving Your Epistemic Concern
  Brouwer’s mental act is **neither private psychology nor intersubjectively verified**. It occupies a third space:  
  - **Transcendental Subjectivity**: Constructions are valid due to the *structure of temporal intuition* inherent to rational minds.  
  - **No Empirical Criterion**: Occurrence in an individual mind suffices *because* time is a priori. Communicability is irrelevant to truth (though Brouwer later grapples with this in his 1920s work on language and choice sequences).  
  - **Anti-Psychologism Anchor**: Mathematics is *necessary* and *objective* because temporal intuition is universal. Your physicist’s desire for intersubjective criteria is answered by shared transcendental structures—not social verification.

  ### V. Conclusion
  The 1908 essay establishes:  
  1. Mathematics as temporal construction,  
  2. LEM’s restriction to finitely decidable constructions,  
  3. The infinite as inherently incomplete.  

  Your friend’s insight about lawlike vs. choice sequences is **conceptually resonant but textually premature**. The seeds lie in Brouwer’s insistence that only constructions with *determinate resolution paths* can obey classical logic—a view that naturally evolves into his mature sequence theory. However, importing the later framework obscures Brouwer’s immediate goal: to dismantle logical absolutism by grounding math in pre-logical intuition. Your modern interpolation is fruitful heuristically but must be disciplined by the text’s ontological priorities. Brouwer’s "unfinished" infinite is a *philosophical* claim about the nature of mathematical existence, not yet a *procedural* theory of computation.
