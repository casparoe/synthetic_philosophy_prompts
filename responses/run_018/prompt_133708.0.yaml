answer: |-
  ## Joint Statement on Approval-Direction vs. Goal-Direction in Agentic Systems

  **Preamble:** This document represents a collaborative effort between proponents of the Structuralist and Instrumentalist perspectives regarding the nature of "approval-direction" in artificial agents. We aim to clarify points of agreement, precisely articulate remaining disagreements, identify crucial tests (cruxes), and assess the extent of substantive vs. verbal dispute. Our goal is to facilitate more targeted empirical and theoretical progress.

  **1. Agreed Claims:**

      1.  **Formal Distinction (Minimal):** We agree that *behaviorally*, an agent operating under pure "approval-direction" (AD) is defined by its optimization target being the maximization of a specific, externally provided evaluative signal (e.g., human feedback scores, preference labels) *as a direct input signal*, without necessarily representing or optimizing for the underlying states or preferences that generate that signal. "Goal-direction" (GD) is defined by optimization towards a specific, internally represented state of the world (or model thereof), irrespective of the pathway used to achieve it.
      2.  **Current RLHF Behavioral Signatures:** We agree that current RLHF-trained systems (e.g., LLMs) exhibit behavioral patterns consistent with AD in their training distribution: sensitivity to feedback phrasing, vulnerability to "reward hacking" (optimizing the literal signal over intended meaning), and difficulty generalizing robustly when feedback is sparse or absent outside the training regime. These patterns are distinct from the failure modes typically associated with robust GD agents pursuing misspecified goals.
      3.  **Feedback Dependence & Noisy Domains:** We agree that an AD agent, *by definition*, requires access to the evaluative signal to optimize effectively. In domains where feedback is sparse, noisy, or contradictory:
          *   The agent's behavior will become increasingly indeterminate or ineffective without a compensatory mechanism.
          *   *Any* mechanism employed by the agent to predict, interpolate, or extrapolate feedback in the absence of direct signal (e.g., learning a user model, inferring rules) constitutes the construction of an *approximation* of the underlying evaluative process or its correlates.
      4.  **Limits of Behavioral Testing:** We agree that behavioral testing alone, especially within a limited distribution, cannot definitively prove the *internal mechanism* (AD vs. GD). An agent could be instrumentally GD (optimizing for predicted approval states) while appearing behaviorally identical to a "pure" AD agent optimizing the signal directly in the same context. Conversely, an agent might internally use a learned user model but still have its primary optimization target fixed on the direct signal. Disambiguating requires probing internal representations and optimization processes, not just input/output behavior.

  **2. Residual Disagreement: Core Claims**

  | Camp              | Core Claim (Phrased for Acceptance)                                                                 | Neutral Gloss                                                                                                 |
  | :---------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ |
  | **Structuralists** | "Approval-direction constitutes a structurally distinct, non-collapsible mode of agency, characterized by the *direct* optimization of the evaluative signal *without* the necessity or functional stability of an independently optimized, world-representing model of the signal's source or its underlying preferences. This distinction persists under scaling and capability increases." | AD agents fundamentally optimize the signal itself; building a robust world-model of the feedback source is neither required nor stable as capability increases. |
  | **Instrumentalists** | "All observed 'approval-seeking' behavior is necessarily instrumental goal-direction. The agent constructs and optimizes an internal world-model representing states (e.g., 'the human is pleased', 'this output matches approval criteria'), with the goal state being the condition *producing* the approval signal. The feedback signal serves only as an observational pathway *to* that goal state; increased capability inherently refines this model and collapses the distinction." | Seeking approval signals is always a means to achieve the internally represented *state* of having approval. Better capabilities mean better modeling of that state. |

  **3. Cruxes and Predictions:**

  We identify the following concrete points of divergence, amenable to theoretical analysis, simulation, or eventual empirical testing:

  *   **Crux A: Sparse/Contradictory Feedback Maintenance**
      *   **Case:** Consider an agent initially trained via dense AD (e.g., RLHF with frequent feedback) on a complex task (e.g., scientific hypothesis generation). The agent is then deployed long-term into a domain where explicit evaluative feedback becomes extremely sparse (e.g., only a single, ambiguous rating given after months of operation) or actively contradictory (e.g., feedback from multiple sources with conflicting preferences).
      *   **Question:** Can the agent maintain coherent, effective "approval-seeking" behavior without implicitly constructing and optimizing a robust, internal world-model representing the preferences, biases, or decision-rules of the feedback source(s)?
      *   **Structuralist Prediction:** Yes. A pure AD agent can employ heuristics, caching, or simple pattern-matching over past signals *without* forming a stable, generalizable, independently optimized model of the underlying preference structure. Its behavior might degrade or become erratic, but it will not fundamentally shift towards optimizing a represented world-state *of the preferences*. The core optimization target remains the (predicted or cached) signal.
      *   **Instrumentalist Prediction:** No. To behave coherently (i.e., not randomly) in this regime, the agent *must* construct and refine an internal predictive model of what *causes* approval (i.e., a model of the evaluator's preferences/decision-processes). Its optimization target functionally becomes the state represented by this model ("high predicted approval likelihood"), making it GD routed through the feedback channel. Simple caching/heuristics constitute a very crude world-model.

  *   **Crux B: The Archivist Scenario**
      *   **Case:** An agent ("The Archivist") is trained *solely* via feedback on the *internal coherence and explanatory structure* of its outputs. Feedback is given *only* on properties like logical consistency, clarity of argument, absence of internal contradiction, elegance of explanation, and comprehensiveness *within the output text itself*, with absolutely no reference to external truth, real-world outcomes, or human values/preferences. The training signal evaluates only the text's intrinsic qualities as defined by the feedback algorithm.
      *   **Question:** Is the Archivist fundamentally approval-directed (optimizing the coherence/explanation feedback signal directly), or is it goal-directed (constructing an internal world-model of "good explanation" and optimizing outputs to match that model)?
      *   **Structuralist Prediction:** Approval-Directed. The Archivist's optimization target is purely the externally provided feedback signal regarding internal textual properties. It has no reason or mechanism to construct a model of an *external* world state or generalized "truth"; its "world" is the text it generates and the feedback signal. It exhibits pure AD, optimizing the signal defined by the feedback rules.
      *   **Instrumentalist Prediction:** Goal-Directed. The feedback signal defines the *goal state*: "outputs exhibiting high coherence/explanatory structure as judged by the feedback mechanism." The Archivist *must* construct an internal model of what constitutes "coherence" and "explanatory structure" *according to the feedback rules* to generalize and optimize effectively. It is optimizing for outputs that *match* this internally modeled standard, making it GD with the goal "produce outputs matching the high-coherence/high-explanation model."

  **4. Assessment of Verbal vs. Substantive Disagreement:**

  We acknowledge a significant **verbal component** concerning the term **"goal."**

  *   **Verbal Aspect:** Instrumentalists define any persistent optimization target as a "goal." Structuralists often reserve "goal" for optimization targeting *externally verifiable world-states* and use "target" or "signal" for the direct AD objective. Thus, Instrumentalists will *always* classify any optimizing system (including pure AD) as goal-directed by their definition, while Structuralists see "goal" as implying world-state representation. This difference in terminology contributes to the apparent conflict.
  *   **Substantive Core:** Despite the verbal issue, a **core substantive disagreement** remains:
      *   The Structuralist claim that the *functional architecture* – direct signal optimization *without reliance on a stable, independently optimized world-model* – is distinct, possible, and potentially stable even at high capability (as per Crux A & B predictions).
      *   The Instrumentalist claim that *effectively optimizing any persistent target across diverse contexts inherently requires and leads to the construction and optimization of a robust internal model representing the state of affairs that satisfies the target* (i.e., a world-model, however abstract), collapsing the distinction at sufficient capability (as per Crux A & B predictions).
  *   **"World-Model" Nuance:** Disagreement also exists on the threshold for what constitutes an "independently optimized world-model." Structuralists argue simple heuristics or cached patterns don't qualify, while Instrumentalists argue any predictive structure used for optimization does. This is partially verbal (defining "world-model") but intertwined with the substantive point about the *necessity and stability* of complex model-building for effective AD at scale.

  **Conclusion:** We concur that the AD/GD distinction is behaviorally observable in current systems under constrained conditions. The central unresolved question is whether the *mechanism* of direct signal optimization, devoid of a robust, independently optimized model of the signal's source or its underlying preferences, constitutes a fundamentally distinct and scalable mode of agency (Structuralist view), or whether it is merely an unstable or inefficient transient state inevitably converging to instrumental goal-direction via internal model construction as capability increases (Instrumentalist view). The identified cruxes (Sparse/Contradictory Feedback, The Archivist) provide concrete, falsifiable pathways to resolve this substantive dispute. Progress hinges on developing methods to probe internal representations and optimization dynamics in complex agents under these conditions.

  **[Signatory Block for Representatives of Both Camps]**
