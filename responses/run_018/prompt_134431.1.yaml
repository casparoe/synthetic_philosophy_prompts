  The separateness objection bites hardest at Japanese civilians being reduced to a casualty count. Each person's unique life, relationships, and autonomy were erased in that number. But the user's deeper insight is fascinating: what about Truman and Stimson? Treating decision-makers as interchangeable nodes also violates separateness by ignoring their personal moral responsibility.

  Now for where the theory illuminates: it perfectly critiques the Target Committee's clinical focus on "optimal damage effects" over individual humanity. But it struggles with dynamics like the unconditional surrender doctrine - that was a deontological commitment, not utilitarian. And Soviet timing shows how non-welfare factors (geopolitics) drove decisions.

