  ### Decision Tree: Verisimilitude in Scientific Theories  
  *For use in a philosophical seminar scene on scientific realism and progress*  

  #### **1. Is scientific progress measurable in terms of increasing proximity to truth?**  
  - **No** → **Instrumentalism/Anti-Realism (Leaf A)**  
    - *Position*: Scientific theories are tools for prediction and control, not truth-apt representations. Progress is defined by empirical adequacy, utility, or problem-solving efficiency.  
    - *Awkward commitment*: Must explain why theories with deep structural unity (e.g., quantum mechanics) seem more than mere instruments.  
  - **Yes** → Proceed to **2**.  

  #### **2. Can a theory with *some* false elements be closer to truth than a competitor that avoids falsehood but has weaker empirical coverage?**  
  *(e.g., Theory A: one precisely false law but exceptional predictive reach; Theory B: no falsehoods but sparse empirical coverage)*  
  - **No** → **Global Falsehood Holism (Leaf B: Unnamed, Unattractive)**  
    - *Position*: Any false element corrupts the entire theory’s claim to truthlikeness. A theory must be wholly true to qualify as "close to truth."  
    - *Vacancy reason*: Unattractive—renders most scientific theories (which contain approximations) ineligible for truthlikeness.  
  - **Yes** → Proceed to **3**.  

  #### **3. Is structural correspondence between theory and world necessary *beyond* predictive accuracy?**  
  *(e.g., Is a theory that predicts planetary motions via epicycles less truthlike than one using ellipses, even if equally accurate?)*  
  - **No** → **Predictive Accuracy Sufficiency (Leaf C: Unnamed, Neglected)**  
    - *Position*: Truthlikeness reduces to empirical success. Capturing underlying structure is irrelevant if predictions match.  
    - *Vacancy reason*: Neglected—fails to explain why scientists seek structural explanations (e.g., gravitational mechanics vs. Ptolemaic models).  
  - **Yes** → Proceed to **4**.  

  #### **4. Is verisimilitude an *absolute* property of a single theory or *comparative* between rivals?**  
  - **Comparative** → Proceed to **5**.  
  - **Absolute** → Proceed to **5**.  
    - *Note*: Positions converge at **5**; the distinction rarely alters practical judgments.  

  #### **5. How should we interpret formal obstacles to quantifying verisimilitude?**  
  *(e.g., Miller-Tichý results: Naive measures of "truth-content minus falsity-content" are logically incoherent)*  
  - **(a) Fatal** → **Epistemic Deflation (Leaf D)**  
    - *Position*: Verisimilitude cannot be quantified. It is reconceived as an epistemic virtue (e.g., a theory’s capacity to guide inquiry toward truth).  
    - *Awkward commitment*: Struggles to define "guidance" without implicit appeal to truth proximity.  
  - **(b) Surmountable via refined metrics** → **Refined Quantitative Approach (Leaf E)**  
    - *Position*: Formal obstacles are overcome by similarity-based metrics (e.g., Niiniluoto’s min-sum measure). Truthlikeness is measurable via logical distance between theories and truth.  
    - *Awkward commitment*: Must justify the choice of similarity metric (e.g., why geometric distance in state-space?).  
  - **(c) Reconceived structurally** → **Structural Verisimilitude (Leaf F)**  
    - *Position*: Truthlikeness resides in structural isomorphism (e.g., shared mathematical group invariants between theory and world). Avoids quantitative pitfalls.  
    - *Ambiguity*: Converges with similarity-based accounts (Leaf E) in practice.  
    - *Named variant*: Structural Realism (e.g., Worrall).  

  ---

  ### Key to Leaves  
  - **Leaf A: Instrumentalism/Anti-Realism**  
    - Denies truthlikeness is meaningful. Progress = empirical adequacy.  
  - **Leaf B: Global Falsehood Holism (Unnamed)**  
    - One false element invalidates truthlikeness. Theoretically possible but rarely defended.  
  - **Leaf C: Predictive Accuracy Sufficiency (Unnamed)**  
    - Structure is irrelevant. Rare due to counterexamples (e.g., phlogiston vs. oxygen).  
  - **Leaf D: Epistemic Deflation**  
    - Shifts to epistemology (e.g., van Fraassen’s empiricism).  
  - **Leaf E: Refined Quantitative Approach**  
    - Niiniluoto’s min-sum measure, Oddie’s similarity approach.  
  - **Leaf F: Structural Verisimilitude**  
    - Structural realism (ontic commitment to structure).  

  ### Unoccupied Combinations & Philosophical Tensions  
  - **Branch 2→3→5(a)**: *No* locally isolated falsehoods + structural necessity + fatalism → **Incoherent**. Denying local isolation contradicts structural realism’s tolerance for approximations.  
  - **Branch 3→5(b)**: Predictive accuracy suffices + refined metrics → **Neglected**. Why refine metrics if empirical success is sufficient?  
  - **Core tension in Leaf E**: Quantification requires arbitrary weights (e.g., penalties for falsehoods vs. rewards for truths).  
  - **Core tension in Leaf F**: Structural correspondence is often underdetermined (e.g., multiple mathematical formulations for quantum gravity).  

  ---  
  *Designed for clarity in philosophical debate—positions reflect live tensions, not settled dogma.*
