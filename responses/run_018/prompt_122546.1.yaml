  Okay, let me tackle this medieval political theory query. The user is designing a take-home final for upper-level undergrads focused on Aquinas' view of tyrannicide. They want an essay question that pushes beyond the basic "community can depose, private individuals can't kill" dichotomy by introducing a nuanced hypothetical scenario.

  Hmm, the core challenge is crafting a question that forces students to wrestle with whether Aquinas' principles could logically permit private tyrannicide in extreme circumstances. The hypothetical needs specific constraints: a tyrant installed by distant higher authority ignoring appeals, targeted killing as the only viable solution, and minimal disorder compared to ongoing tyranny. 

  I should structure this carefully. First, the question must explicitly reference Aquinas' key principles: tyranny as rule for private good, the disorder calculation, and the public-authority requirement for killing rulers. Then present the hypothetical scenario with all given conditions. Finally, frame the central tension: does Aquinas' framework actually compel an exception here, or is his prohibition absolute?

  For the model answer, I'll need to demonstrate sophisticated engagement with the tension in Aquinas' thought. Key points to cover: his absolute prohibition language versus the teleological nature of his ethics, the "public authority" requirement as non-negotiable versus potential for extraordinary interpretation of that authority, and how the disorder calculus applies differently to public versus private action. 

  The marking scheme should reward five critical insights: 
  1) Recognizing the scenario satisfies Aquinas' definition of tyranny 
  2) Explaining why it meets the disorder-minimization criterion 
  3) Articulating why Aquinas still rejects private action fundamentally 
  4) Exploring how "public authority" might be stretched (but why Aquinas wouldn't) 
  5) Concluding the absolute nature of the prohibition despite apparent contradictions.

  Common student errors to note: conflating deposition with killing, missing that disorder calculation applies only to public actions, and assuming utilitarianism overrides Aquinas' proceduralism. 

  This approach balances academic rigor with practical assessment needs while respecting the user's time constraints. The separation into clear sections (question, answer, rubric) should make it easy to adapt.
answer: |-
  Here's a comprehensive essay question, model answer, and marking scheme tailored to your requirements:

  **Essay Question:**

  > Thomas Aquinas defines tyranny as rule directed towards the ruler's private good rather than the common good. While he permits a community to depose a tyrant if the resulting disorder is not excessive, he explicitly forbids private individuals from killing a ruler, reserving such action to public authority. Consider this scenario: A ruler governs solely for his private gain. He was appointed by a distant, higher authority (e.g., Emperor or Pope) which consistently ignores all formal appeals and grievances from the suffering community. The *only* feasible way to remove this tyrant without triggering a devastating civil war is a targeted killing by a single, private citizen acting alone. Crucially, the entire community agrees that the limited disorder following this act would be significantly *less* harmful than the ongoing tyranny.  
  >  
  > **Based *strictly* on Aquinas's own principles (as outlined in his treatment of tyranny, resistance, and the requirements for lawful killing), does this extreme scenario compel Aquinas to permit this private tyrannicide as an exception, or do his principles demonstrate that the prohibition against private individuals killing a ruler is absolute and cannot be overridden, even here? Develop a clear argument using Aquinas's core framework.**

  **Model Answer (Approx. 550 words):**

  While Aquinas's principles regarding tyranny and resistance create significant tension in this extreme scenario, a strict application of his framework demonstrates that his prohibition against private tyrannicide is absolute and cannot be overridden, even by the compelling circumstances described.

  Firstly, the scenario perfectly satisfies Aquinas's definition of tyranny: the ruler governs solely for his private good, not the common good. Furthermore, Aquinas's condition for permissible resistance – that the disorder caused must not be worse than the tyranny itself – appears met. The community universally agrees the limited disorder from a targeted killing is preferable to the ongoing tyranny, and crucially, no viable, *publicly authorized* alternative exists due to the higher authority's inaction. This creates a powerful intuitive case for permitting the act.

  However, Aquinas's absolute prohibition on private individuals killing rulers rests on foundational principles deeper than the utilitarian calculus of disorder. His ban is rooted in his conception of *lawful authority* and the nature of the political community. Killing a ruler, for Aquinas, is an act of judgment and punishment. He argues this judgment belongs *solely* to the public authority – either the superior who appointed the tyrant or the community itself acting as a corporate body (*multitudo*) through a representative process. Private individuals inherently lack this public, juridical authority. They act only by "private presumption" (*De Regno*, I, 6), which amounts to usurping a power they do not rightfully possess, akin to theft or rebellion. This principle is categorical, not contingent on the severity of the tyranny or the practicality of alternatives.

  The scenario highlights this core distinction. While the *community's* assessment of the lesser disorder might justify *their* action if they could act publicly (e.g., through a representative council deposing the ruler), it does not transfer that justification to a *private* actor. The private citizen, however well-intentioned or widely supported in sentiment, still acts without the requisite public mandate. Aquinas explicitly contrasts the licitness of the community acting against a tyrant ("*multitudo... non est illicitum*") with the utter unlawfulness of a private person doing so ("*si vero ex privata... illicitum est*") (*Summa Theologiae*, II-II, Q42, A2, ad 3). The source of the authority to judge and execute is paramount.

  One might argue that the higher authority's dereliction of duty creates a vacuum that necessitates private action. Yet Aquinas does not provide a mechanism whereby a private individual can *become* the legitimate public authority simply because existing authorities fail. He emphasizes due process and the preservation of the public order inherent in the community acting corporately. Allowing a private killing, even in extremis, fundamentally undermines this order by legitimizing vigilantism and basing the legitimacy of regicide on private judgment about utility and necessity, which Aquinas fundamentally rejects as the grounds for such an act.

  Therefore, while the scenario presents a tragic case where Aquinas's preferred solutions (appeal to higher authority or public deposition) are blocked, and the disorder calculus seems to favour the killing, his absolute principle regarding the source of authority for killing a ruler prevails. The act remains intrinsically unlawful because the private individual lacks the public, juridical standing required by Aquinas to licitly pass and execute such a sentence, regardless of the tyrant's deserts or the apparent net benefit. His ban is rooted in the nature of political authority itself, not just pragmatic concerns about likely outcomes, making it absolute in application.

  **Marking Scheme (Out of 20):**

  | **Must-Hit Point**                                                                 | **Marks** | **Common Pitfall**                                               |
  | :--------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------- |
  | **1. Correctly identifies the scenario as meeting Aquinas's definition of tyranny** | 3         | Fails to explicitly link ruler's private gain to Aquinas's core criterion. |
  | **2. Accurately explains why the scenario *appears* to satisfy Aquinas's disorder condition** | 3         | States it satisfies the condition without explaining *how* (comparison of harms, community agreement). |
  | **3. Clearly articulates Aquinas's *absolute* prohibition on *private* tyrannicide, linking it to the requirement for *public/juridical authority*** | 6         | Mentions the prohibition vaguely without grounding it in the core principle of lawful authority OR conflates deposition with killing. |
  | **4. Explains why Aquinas would *not* accept the private actor acting due to authority vacuum/practical necessity, emphasizing the distinction between public and private authority** | 5         | Argues the vacuum justifies the act OR fails to explain *why* Aquinas sees the public/private distinction as fundamental and non-transferable. |
  | **5. Concludes decisively that Aquinas's principles show the prohibition is absolute, despite the scenario's extremity** | 3         | Waffles or gives an unclear conclusion OR bases conclusion solely on utility, not authority. |

  **Total:** /20

  **Notes for Implementation:**
  *   **Focus:** The question forces engagement with the *basis* of Aquinas's prohibition (authority source) vs. the apparent satisfaction of other conditions (tyranny definition, disorder calculus).
  *   **Clarity:** Principles are reiterated in the question prompt for reference.
  *   **Conciseness:** Model answer stays within word limit while covering core arguments. Easily editable if needed.
  *   **Assessment:** Marking scheme rewards deep understanding of the authority principle (highest mark), correct application of definitions, and clear conclusion. Common pitfalls target frequent student misunderstandings (confusing deposition/killing, missing the authority core, utilitarian misreadings).
  *   **Rigor:** Avoids needing citations while demanding close textual reasoning based on Aquinas's known positions.

  This structure ensures students must grapple with the tension between Aquinas's teleological concern for the common good and his deontological commitment to lawful authority and due process, providing a robust assessment of their understanding.
