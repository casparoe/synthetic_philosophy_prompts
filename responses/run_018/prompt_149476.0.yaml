  ok so for my philosophy club i was trying to build an argument from hume's essay on suicide—the one he pulled back from publishing—and now it seems to proove that i can kill anyone who's suffering. here goes:

  (1) hume argues that suicide can't be wrong just on the grounds that it interferes with nature, since we interfere with nature all the time when we cure diseases or build dams.

  (2) he also says it's not a crime against society if you're genuinely useless and in misery, since society doesn't lose anything it valued.

  (3) so if being useless-and-in-miserable makes it ok for me to end my own life, then the exact same reason applies to anyone else who is useless and miserable.

  (4) therefore i should be allowed to end anyone else's life if they're useless and miserable.

  (5) but hume clearly wouldn't support that—he's not saying go around killing people.

  (6) so either (2) is false, or there's some hidden difference between me and others that blocks the move.

