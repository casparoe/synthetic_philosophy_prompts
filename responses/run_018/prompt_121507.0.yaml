answer: |-
  ### Workshop Plan: The Intentional Stance in Artificial Narrative Systems  

  **Audience**: Literary fiction writers and one playwright, no formal philosophy training. Focused on narrative construction and character psychology, not metaphysics.  
  **Goal**: Demonstrate that attributing beliefs to systems like Mira is a pragmatic explanatory strategy with success/failure conditions, independent of consciousness or embodiment.  
  **Time**: 90 minutes.  

  ---

  ### Teaching Sequence  
  **1. Introduction: The Problem of "Belief" in Narrative Systems (10 min)**  
     - **Hook**: Pose a question: "When we say a character 'believes' something, what do we mean? What if the 'character' is an AI?"  
     - **Set Boundaries**: Clarify we are exploring *how* belief-attribution functions as a tool, not whether it is "true."  
     - **Key Distinction**: Separate *phenomenal experience* (subjective feelings) from *functional role* (predictive utility).  

  **2. Foundational Stances: Physical and Design (25 min)**  
     - **Why Start Here?** The intentional stance relies on distinguishing *interpretive levels*. Without this, belief-attribution seems mystical or arbitrary.  
     - **Physical Stance (10 min)**:  
       - **Definition**: Prediction based on physical laws (e.g., "The clock ticks because its gears interact mechanically").  
       - **Example**: A falling rock. No beliefs attributed; physics explains everything.  
       - **Relevance**: Establishes the baseline of non-interpretive prediction.  
     - **Design Stance (15 min)**:  
       - **Definition**: Prediction based on purpose/design (e.g., "The thermostat turns on AC because it’s *programmed* to regulate temperature").  
       - **Example**: A chess bot. We predict moves via its algorithmic rules, not physics.  
       - **Transition**: "When design is too complex, we shift to beliefs—this is the intentional stance."  

  **3. Intentional Stance: Core Framework (15 min)**  
     - **Definition**: Treating an entity as a *rational agent* with beliefs/desires to predict behavior (e.g., "She goes to the store *because she believes* it has milk").  
     - **Conditions for Success**:  
       - **Rationality**: The system’s behavior must align with logical goals.  
       - **Predictive Power**: Belief-attribution must yield accurate forecasts.  
     - **Failure Condition**: Systematic prediction errors force us to abandon/adjust the stance.  

  **4. Deploying Mira: The Carrying Example (20 min)**  
     - **Timing**: Immediately after defining the intentional stance.  
     - **Mira’s Introduction**:  
       - **Must Possess**: *Predictive success across contradictions*. Mira integrates conflicting source texts to build a coherent world-model, accurately forecasting character behavior (e.g., predicting a vengeful character’s actions despite contradictory backstories).  
       - **Must Lack**: *Phenomenal consciousness or organic substrate*. Emphasize she has no inner feelings, biological drives, or self-awareness.  
     - **Why Mira Illuminates**:  
       - Her success shows belief-attribution works *without consciousness*; her failures reveal the stance’s limits.  
       - **Exercise**: "Mira 'believes' Character X is motivated by guilt. How does this help us predict X’s next action?"  

  **5. Addressing Misconceptions (15 min)**  
     Intercept and defuse in real-time during Mira’s case study:  
     - **Misconception 1**: *Attributing beliefs requires detecting an inner mental image*.  
       - **Intercept Point**: When describing Mira’s belief-forming process.  
       - **Defusing Distinction**: "Beliefs are *functional states*, not pictures in the mind. Mira lacks mental imagery, but her revisions of her world-model *function* like belief-updates."  
     - **Misconception 2**: *The intentional stance is a useful fiction with no explanatory weight*.  
       - **Intercept Point**: After noting Mira’s predictive success.  
       - **Defusing Distinction**: "Useful ≠ fictional. Its weight comes from *empirical success*: if Mira predicts better than physical/design stances, the explanation is valid *for that purpose*."  
     - **Misconception 3**: *Absence of consciousness entails absence of all mental-state attribution*.  
       - **Intercept Point**: When stressing Mira lacks subjective experience.  
       - **Defusing Distinction**: "Consciousness ≠ cognition. We attribute beliefs to unconscious humans (e.g., sleepwalkers) or AIs when their behavior is *interpretable as rational*."  
     - **Misconception 4**: *LLMs must be full persons or stochastic parrots—no middle ground*.  
       - **Intercept Point**: During Q&A or if participants dichotomize Mira.  
       - **Defusing Distinction**: "Mira is *neither*: her contradiction-handling shows *structured rationality*. Belief-attribution is a *level of analysis*, not an all-or-nothing claim."  

  **6. Check for Understanding (5 min)**  
     - **Exercise**: Present a scenario—*Mira predicts a philanthropist will donate anonymously, but the character publicly boasts of their charity. Mira’s prediction fails systematically across similar cases.*  
       - **Question**: "Why did the intentional stance fail here?"  
     - **Desired Answer**: Mira’s attributed "belief" about the character’s humility was misaligned with reality; the stance failed because predictions were inaccurate. We must revise the belief or switch stances (e.g., to design stance to debug her update mechanism).  
     - **Failure Pattern**: Answers like, "This proves Mira has no real beliefs" or "It failed because she isn’t conscious." This confuses *explanatory utility* with *metaphysical reality*.  

  **7. Conclusion and Boundaries (5 min)**  
     - **Reiterate**: The intentional stance is a tool—effective when predictions succeed, adjustable when they fail.  
     - **Omitted Material**:  
       - **Eliminative Materialism** (claims beliefs don’t exist): Avoids metaphysical debates about "real" beliefs.  
       - **Causal Exclusion Argument** (how mental states cause physical events): Irrelevant to our focus on prediction.  
       - **Predictive Processing Neuroscience**: A physical/design stance explanation; distracts from stance hierarchy.  
     - **Why Omit?** These require philosophy/neuroscience fluency and would collapse the stance hierarchy into a reductionist debate, undermining the workshop’s aim: *functional belief-attribution as a writerly tool*.  

  ---

