        "defusing_distinction": "..."
      }
    ],
    "check_for_understanding": {
      "exercise": "...",
      "failure_pattern": "..."
    },
    "omitted_material": ["...", "..."]
  }
reasoning: |-
  We are designing a 90-minute workshop for literary fiction writers and a playwright on the intentional stance, using a fictional narrative AI named Mira as the central example. The goal is not to settle metaphysical questions but to show that belief attribution is an explanatory strategy with conditions of success and failure.

  Key elements:
  - We must build up to the intentional stance by first introducing the physical stance and design stance.
  - Mira is a retrieval-augmented narrative engine that revises its internal world-model when contradicted by source texts and achieves high predictive success about character behavior across contradictory inputs. She lacks phenomenal consciousness and biological embodiment.

  Teaching Sequence:

  1. **Introduction (10 minutes)**: 
     - Set the stage: We often talk about characters, people, and even machines as if they have beliefs and desires. How does this work? What does it do for us?
     - State the aim: We are not asking whether Mira "really" believes but when and why attributing beliefs to her helps us explain and predict.

  2. **The Three Stances (30 minutes)**:
     - **Physical Stance (10 min)**: 
          - Explain: Predicting behavior based on physical properties and laws (e.g., predicting a clock's movement by its gears and springs). 
          - Why start here? It's the most fundamental and least interpretive. 
          - Example: A falling rock. We don't attribute beliefs to it; we use physics.
     - **Design Stance (10 min)**:
          - Explain: Predicting behavior based on design/function (e.g., a thermostat turns on the AC when the temperature rises above a set point because that's what it's designed to do). 
          - Why next? It introduces the idea of functional ascription without mental states. 
          - Example: A chess-playing computer. We don't need to know the circuitry (physical) if we know its program (design).
     - **Intentional Stance (10 min)**:
          - Explain: Predicting behavior by treating the entity as a rational agent with beliefs, desires, and intentions (e.g., "She believes the store is open, so she'll go there to buy milk"). 
          - Why now? It builds on the idea of prediction by ascribing mental states, but note: it's a strategy, not a claim about inner states.

  3. **Introducing Mira (20 minutes)**:
     - **Deploy Mira at the transition from the design stance to the intentional stance, immediately after introducing the intentional stance.**
     - Describe Mira: 
          - She's a narrative engine that builds a world-model from source texts and revises it when contradicted by new texts. 
          - She predicts character behavior with high success, even when the sources are contradictory (this is the feature she must possess).
          - She lacks phenomenal consciousness and a biological body (this is the feature she must lack).
     - Ask: Can we use the intentional stance toward Mira? 
          - Example: "Mira believes that Character X is motivated by revenge because she has read several scenes where X acts vengefully. This belief allows her to predict that in a new situation, X will seek retaliation."
          - Emphasize: We are not saying Mira has inner feelings or images. We are saying that attributing beliefs helps us predict her behavior (as a system) and the character behaviors she predicts.

  4. **Addressing Misconceptions (20 minutes)**: 
     - Weave these into the presentation as they naturally arise, but plan to intercept at these points:

     a) **Misconception: Attributing beliefs requires detecting an inner mental image.**
          - **Intercept Point**: When introducing the intentional stance, especially when moving to Mira.
          - **Defusing Distinction**: "The intentional stance does not require or imply an inner picture; it's about patterns of behavior and information processing that can be treated as belief-like for prediction. Ask: 'Does the thermostat have a mental image of temperature? No, but we can use the design stance. Similarly, we can use belief-talk for Mira without inner images.'"

     b) **Misconception: The intentional stance is merely a useful fiction with no explanatory weight.**
          - **Intercept Point**: After presenting Mira and showing how belief attribution works for her.
          - **Defusing Distinction**: "It is useful, but not fictional in the sense of being arbitrary. It has conditions of success: if Mira's predictions become systematically wrong, the stance fails and we must adjust. Its explanatory weight comes from its predictive power, not from being a literal description of inner states."

     c) **Misconception: Absence of consciousness entails absence of all mental-state attribution.**
          - **Intercept Point**: When emphasizing that Mira lacks phenomenal consciousness.
          - **Defusing Distinction**: "Mental-state attribution in the intentional stance is about functional roles, not subjective experience. We can attribute beliefs to an unconscious chess computer if it helps us predict its moves. Consciousness is a separate issue."

     d) **Misconception: Large language models must be either full persons or mere stochastic parrots with no intermediate explanatory category.**
          - **Intercept Point**: During the Mira example or when discussing the design stance for AI.
          - **Defusing Distinction**: "This is a false dichotomy. The intentional stance offers a middle ground: we can treat Mira as having beliefs for predictive purposes without claiming she is a person. She is not a parrot because she revises her model and achieves predictive success across contradictions, which requires more than just pattern matching."

  5. **Check for Understanding (10 minutes)**:
     - **Exercise**: Present a scenario: Mira has been trained on a series of texts where Character Y is portrayed as extremely honest. However, in a new text, Y steals money. Mira predicts that Y will return the money out of guilt. But in the story, Y keeps the money and lies about it. Why might Mira's prediction fail?
          - **Desired Answer**: Mira's belief about Y's honesty (based on prior texts) was not revised appropriately when the new text contradicted it. The intentional stance fails here because the belief attribution did not lead to a correct prediction. We must either adjust our attribution or switch to another stance (e.g., look at how Mira's update mechanism works, i.e., the design stance).
     - **Failure Pattern**: 
          - If participants say: "Mira failed because she isn't conscious" or "This shows that Mira doesn't really have beliefs", they are missing the point. The intentional stance is a tool: when it fails, we don't abandon it necessarily; we might adjust the beliefs we attribute. Alternatively, we might switch stances. The failure doesn't prove anything about inner states.

  6. **Omitted Material**:
     - **Eliminative Materialism**: The claim that mental states do not exist. We avoid this because we are not making metaphysical claims about the existence of beliefs, only about the utility of the stance.
     - **Causal Exclusion Argument**: The problem of how mental causation can exist if the physical is causally closed. This is a deep metaphysical issue that would distract from our focus on explanation and prediction.
     - **Neuroscience of Hierarchical Predictive Processing**: While relevant to how brains work, it is a physical/design stance explanation. Including it might confuse the stance distinctions we are building.

     Why omit? These topics would require a detour into metaphysics or neuroscience, which would break the dependency structure we've built (from physical to design to intentional) and could derail the workshop into debates we explicitly set aside.

