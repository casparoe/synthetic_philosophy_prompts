prompt: |-
  I am a novelist developing a workshop for my writing collective — literary fiction writers and one playwright, none with formal philosophy training — on how the intentional stance functions when we attribute beliefs to artificial narrative systems. I want the session, which runs ninety minutes with a whiteboard, to turn on a character from my current manuscript: Mira, a retrieval-augmented narrative engine that revises its internal world-model when contradicted by source texts, achieves high predictive success about character behavior across contradictory inputs, and yet possesses neither phenomenal consciousness nor biological embodiment. The conceptual aim is not to settle whether Mira "really" believes anything, but to show that attributing beliefs to her is an explanatory strategy with conditions of success and failure.

  Plan the teaching sequence precisely: which conceptual layer must be in place before the intentional stance can be introduced, why it depends on first distinguishing the physical stance and the design stance, and the exact moment in the arc to deploy Mira as the carrying example — specifying what feature she must possess (predictive success across contradiction) and what feature she must lack (phenomenal experience or organic substrate) for the example to illuminate rather than confuse. Then map the misconceptions in the order the audience will likely form them: that attributing beliefs requires detecting an inner mental image; that the intentional stance is merely a useful fiction with no explanatory weight; that absence of consciousness entails absence of all mental-state attribution; and that large language models must be either full persons or mere stochastic parrots with no intermediate explanatory category. For each misconception, state the precise point in the sequence where it should be intercepted and the single distinction or sentence that defuses it.

  Design the check for understanding: one concrete exercise or scenario at the end — for instance, a case in which Mira makes a systematically false prediction about a character's motivation — that reveals whether the group understands the intentional stance as a predictive tool with conditions of failure rather than a metaphysical claim about inner life. Specify the wrong-answer pattern that would show they have missed the point.

  Finally, state explicitly what philosophical machinery should be left out at this level and framed as an honest boundary — for example, debates in eliminative materialism, the causal exclusion argument regarding mental causation, or the neuroscience of hierarchical predictive processing — and explain why omitting them protects the dependency structure rather than simplifying it dishonestly.

  Present the plan as polished prose suitable for my own preparation notes. Then, after the prose, provide a brief structured summary in this exact JSON schema:

