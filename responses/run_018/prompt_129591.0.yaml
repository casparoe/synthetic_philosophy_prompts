  ### Workshop Design: "The Costly Inference Game"

  #### **Core Setup**
  - **Participants**: 16 people (4 groups of 4).  
  - **Logical Chain**: Premises → A → B → C → T (target).  
    - Premises:  
      - `P1: A`  
      - `P2: A → B`  
      - `P3: B → C`  
      - `P4: C → T`  
  - **Materials**:  
    - **Premise Cards**: Each participant gets identical cards printed with `P1`, `P2`, `P3`, `P4`.  
    - **Token Budget**: 2 deduction tokens per participant (non-transferable).  
    - **Action Slips**: Paper slips to record deductions/broadcasts.  

  #### **Rules & Economy**  
  1. **Deduction Costs**:  
     - **1 token** to derive a conclusion (e.g., from `A` and `A→B`, spend 1 token to derive `B`).  
     - **1 token** to *broadcast* a derived conclusion to all players (e.g., broadcasting `B` costs 1 token).  
     - Receiving a broadcast is **free** (all players gain the conclusion automatically).  

  2. **Payoffs (No Real Money)**:  
     - **Collective Win**: If **every player** has `T` by the end, each gets **12 points**.  
     - **Personal Cost**: Each token spent **reduces your score by 1 point**.  
     - **Example**: A player who spends 2 tokens gets `10 points` if the group wins (12 - 2), or `0` if the group fails.  

  3. **Win Condition**:  
     - To have `T`, a player must:  
       - Derive it themselves (chain: `A→B→C→T`, costing 4 tokens), **or**  
       - Receive it via broadcast.  
     - **Critical Twist**: `T` can only be broadcast if someone first derives it (requiring `C`, which requires `B`, etc.). Broadcasts must be sequenced.  

  #### **Timeline (90 Min)**  
  1. **Intro (10 min)**:  
     - Explain rules, premises, and payoffs. Emphasize: "Tokens = mental effort; minimize spending to maximize points."  

  2. **Group Phase (20 min)**:  
     - Split into 4 groups.  
     - **Task**: Discuss who (if anyone) will:  
       - Derive your group’s assigned step (Group 1: Derive `B`; Group 2: Derive `C`; etc.).  
       - Broadcast it (costs extra token).  
     - **Incentive Puzzle**: *Within* groups, volunteering costs 2 tokens (derive + broadcast), but benefits everyone. Free-riders profit.  

  3. **Open Negotiation (20 min)**:  
     - Groups mingle. Players lobby others to volunteer.  
     - **Pressure Point**: "If you broadcast `B`, I’ll broadcast `C`!" (But promises are non-binding.)  

  4. **Secret Action Phase (15 min)**:  
     - Each player **privately** writes actions on slips:  
       - *Option 1*: Derive a conclusion (state which).  
       - *Option 2*: Broadcast a conclusion (must have derived it first).  
       - *Option 3*: Do nothing.  
     - Slips collected by facilitator.  

  5. **Resolution (10 min)**:  
     - Facilitator processes actions **in sequence**:  
       1. Checks for `B` broadcasts → if found, all players get `B`.  
       2. Checks for `C` broadcasts (requires `B`) → if found, all get `C`.  
       3. Repeats for `T`.  
     - Derivation attempts fail silently if prerequisites missing (e.g., deriving `C` without `B` wastes the token).  

  6. **Scoring & Certification (5 min)**:  
     - Poll: "Raise hand if you have `T`."  
     - If all 16 hands up → **SYSTEM CERTIFIED**.  
     - Announce personal scores: `12 - tokens spent` (if certified), or `0` (if failed).  

  7. **Debrief (20 min)**:  
     - **Framing**: **"The Coordination Gap in Bounded Rationality"**  
       - Map to epistemic logic:  
         - **Logical omniscience assumes** agents instantly know all consequences of their knowledge (here, `P1–P4` entail `T`).  
         - **Game reality**: Knowing `T` requires costly *operations* (tokens). Agents halt inference to conserve resources, even when premises are identical.  
       - **Why failure is inevitable**:  
         - **Token costs create Nash inefficiency**: Volunteering to broadcast gives 10 points (12 - 2), while free-riding gives 12. Rational players *never* volunteer—they hope others will. But if all reason this way, no broadcasts occur.  
         - **Sequential dependency amplifies risk**: One missing broadcast (e.g., no `B`) collapses the chain. Even with "enough" tokens (32 total), coordination fails.  
       - **Real-world link**: Like real agents, players "know" the premises but lack resources to exhaustively explore consequences. The game forces them to *choose ignorance*.  

  --- 

  ### **Critical Notes**  
  - **What This Game *Can’t* Reproduce**:  
    Logical omniscience assumes agents automatically grasp *all* implications, **regardless of complexity**. The game simplifies inference to linear steps with uniform costs. Real-world deductions involve:  
    - **Variable difficulty**: Deriving `T` might require 1 step (trivial) or 100 (intractable).  
    - **No social dilemma**: A *single* agent with limited tokens would still fail to derive `T` (cost: 4 tokens; budget: 2). The game’s group dynamics add coordination failure atop computational limits.  

  - **What Will Blow Up Your First Run**:  
    **Over-optimism in negotiation**. Players will swear they’ll volunteer ("I’ll broadcast `B`!"), but in the secret action phase, most renege to free-ride. Expect frustration when broadcasts don’t materialize. Mitigate by stressing: "Actions are private; words are cheap."  

  --- 

  ### **Why This Design Works**  
  - **Token Structure Forces Trade-Offs**:  
    Fixed 2-token budgets make volunteering *always* suboptimal for individuals (10 < 12). Free-riding dominates, but mutual free-riding fails collectively. Players "feel" why bounded agents stop deducing.  
  - **Debrief Framing Clarifies**:  
    Focusing on the **coordination gap** (not just computation) mirrors real systems where shared goals fail due to individual incentives—e.g., climate action, team projects. The Nash equilibrium is failure, even with "easy" logic.  

  Run it straight—no bibliographies, no jargon. They’ll viscerally grasp why omniscience breaks.
