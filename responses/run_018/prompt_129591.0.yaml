              - Participant P2 (Group2) submits: derive C and broadcast C. But at the time of submission, they don't have B (because the broadcasts haven't happened). So they cannot derive C? Therefore, we must disallow that action? Or we allow them to attempt, but if when we resolve, they don't have the prerequisites, the derivation fails and they lose the token.

          - We decide: they can attempt any derivation, but if at the time of resolution they don't have the prerequisites, the derivation fails and they lose the token. 

          - So in the resolution:
              - We first do all broadcasts of B -> then everyone has B.
              - Then we do derivations of C: if a participant attempted to derive C, now they have B, so they succeed. Then we do broadcasts of C.
              - Then similarly for D and T.

          - But note: a participant in Group2 might have attempted to derive C without broadcast? Then they get C, but others don't. 

     7. Certification Check (5 min): The facilitator asks each participant: "Do you have T?" They answer yes only if they have it (by any means: derived themselves or received by broadcast). If all 16 say yes, the system is certified.

     8. Payoff Calculation (5 min): The facilitator announces the payoff for each participant: 12 - tokens spent (if certified) or 0 (if not).

     9. Debrief (20 min): 
          - Start by asking participants how they felt and what happened.
          - Then explain the mapping to formal epistemic logic:
              - In an ideal logical world, the moment the premises (A and the implications) are known, T is known (by logical omniscience). 
              - In the game, knowing T requires a series of costly steps (each inference costs a token). 
              - Moreover, when multiple agents are involved, they face a collective action problem: each step in the chain is a public good. 
              - The failure of the group to achieve certification illustrates that even when the group as a whole has the necessary resources, the individual incentives (to free-ride) can prevent the group from achieving the goal.
              - This shows that logical omniscience is broken not just because of individual computational limits, but also because of strategic interactions in multi-agent systems.

          - Why inevitable? With the payoff structure (volunteers get 10, non-volunteers get 12), it is a dominant strategy for each participant to not volunteer? Not exactly: if they are sure that without their volunteer action the certification fails, then they might volunteer. But if they are in a group of 4, they might hope that someone else in the group volunteers. The structure makes it fragile.

          - What the game doesn't capture: In a single-agent setting, the agent would have to do all the steps and spend 4 tokens. In the multi-agent setting, they can save by broadcasting. But the game adds the free-rider problem, which is not present in the single-agent case. So the game shows an additional reason for failure.

     Given the time, we might run short. We can adjust.

     Honest note on what the game cannot reproduce: 
          - The game introduces a social dilemma (coordination and free-rider problems) that is not an inherent part of the logical omniscience problem. Logical omniscience is primarily about the individual's computational limitations. The game shows that in a multi-agent setting, the problem is compounded by strategic issues.

     What might blow up:
          - Participants might find a way to coordinate and succeed. We might have to run the game multiple times to see failure? But we only have time for one run. 
