          - Alternatively, we can design the groups to be larger? But we have 4 groups of 4. 
          - Another idea: we can assign the groups randomly and then not let them know which group they are in? But that would be chaotic. 
          - We rely on the natural tendency to free-ride.

     Given the constraints, we proceed with the design above.
