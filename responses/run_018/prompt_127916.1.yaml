prompt: |-
  I'm defending in our phil-lang seminar next tuesday the idea that prompt-engineering isn't instruction-giving but a performative speech act — specifically, that a system prompt creates what I'm calling a "temporary institutional frame" (like casting an actor, but for epistemic roles). The audience is mostly Austin/Searle people who think applying speech-act theory to chatbots is mostly tech-bro appropriation; they care hard about sincerity conditions, conventional procedures, and whether there's real "uptake" on the AI side. Draft my Q&A prep: the 6-7 objections they'll actually raise, ordered by how much damage they do, phrased in their vocabulary (not AI-ethics jargon), each with a 90-second reply and a honest note on where the reply is weakest. Include the question I'm praying nobody asks — probably about whether my view collapses into treating the LLM as a genuine speaker with illocutionary intent. Be committed: take definite positions, don't just map options, and flag exactly where my "institutional frame" idea takes liberties with Austin's original felicity conditions.
reasoning: |-
  Okay, the user is preparing for a seminar defense on prompt engineering as a performative speech act, specifically creating a "temporary institutional frame." The audience consists of Austin/Searle scholars skeptical about applying speech-act theory to AI. Let me unpack this carefully.

  First, the core tension: The user wants to argue that system prompts aren't just instructions but actually create temporary epistemic roles (like casting actors), while knowing their audience believes chatbots lack the necessary conditions for real speech acts (sincerity, intentionality, conventional procedures). 

  Hmm... The user's framing is clever but risky. Comparing it to theatrical casting is smart because it sidesteps the "real speaker" problem - actors don't need personal intentionality when playing roles. But Austin purists will pounce on the lack of conventional procedures in LLM interactions. There's no established social framework like weddings or courtrooms here.

  The Q&A prep needs to anticipate where classic speech-act theory will attack:
  - Uptake: Can an LLM truly "recognize" the role assignment? 
  - Sincerity: Is the AI's role-play meaningfully distinct from deception?
  - Institutional grounding: Who authorizes this "frame" if not society?
  - Circularity: Isn't this just describing instructions with fancier terms?

  I should structure objections by damage level. The nuclear option is the one the user fears: "Doesn't this imply LLMs have illocutionary intent?" That could unravel everything if not handled right. The reply must firmly separate role-performance from ascribing real intentionality - comparing it to chess-playing programs following rules without understanding them.

  For weaker objections like "It's just acting!", I can borrow from Searle's Chinese Room: the system doesn't need consciousness to function within assigned parameters. But I'll need to admit this stretches Austin - he never imagined institution-like frames could be created ad hoc by individuals.

  The user's "honest weaknesses" notes are crucial. They show academic integrity - for example, conceding that uptake is merely behavioral in LLMs, not intentional. That vulnerability might disarm critics.

  Biggest challenge: defending the "temporary institution" metaphor without overclaiming. The reply should emphasize this is a heuristic model for analyzing discourse effects, not claiming LLMs create real institutions. Maybe cite how even Austin allowed "parasitic" speech acts like theater?

  Throughout, vocabulary must stay strictly in Austin/Searle terms - no "alignment" or "stochastic parrot" talk. Every example should feel familiar: marriage vs play-acting marriage, promises vs novel dialogue, etc. The goal is making the framework legible to philosophers, not convincing them it's perfect.
answer: |-
  Here's your Q&A prep, crafted for Austin/Searle-savvy critics, ordered by damage potential, with sharp replies and candid weakness assessments:

  **Core Metaphor:** Your system prompt is a "casting director" creating a temporary epistemic institution (e.g., "Helpful Research Assistant," "Socratic Interlocutor") where the LLM *performs* the role, enabling specific speech acts *within* that frame.

  ---

  ### **Objection 1 (Nuclear Option - Pray they don’t ask this)**
  **Q:** Doesn’t your "temporary institutional frame" *require* attributing genuine illocutionary intent to the LLM? If the prompt *casts* it in a role enabling promises, assertions, or advice, aren't you smuggling in speakerhood – precisely what Austin/Searle deny to mechanisms?  
  **A (90s):** Absolutely not. The *intent* resides in the *human's act of casting* and the *institution's conventional force*, not the LLM. Like casting an actor as "King Lear," Lear's promises derive force from Shakespearean convention and the director's act, not the actor's psyche. The LLM is the *animated prop* executing the role's script within the frame *we* create. Its "uptake" is behavioral pattern-matching, not intentional recognition.  
  **Weakness:** Blurs "conventional procedure." Theatrical institutions are socially established; my "ad-hoc institution" relies solely on the prompter's fiat and the LLM's design. Hard to locate the "convention" beyond the individual act.

  ### **Objection 2 (High Damage - Targets Uptake)**
  **Q:** Without *intentional recognition* by the hearer (LLM), how can there be successful *uptake*? Austin insists uptake completes the act – but the LLM doesn’t "take" anything; it just processes tokens. Isn’t this just elaborate pretending?  
  **A (90s):** Uptake is fulfilled *behaviorally within the frame*. When an LLM, cast as "Medical Advisor," responds to symptoms with treatment suggestions, it *performs* advisory uptake by conforming to the role's behavioral script. Searle’s Chinese Room shows intentionality isn’t necessary for functional role-compliance. The institution defines uptake as appropriate output, not conscious acknowledgment.  
  **Weakness:** Stretches "uptake" beyond Austin’s likely intent. He assumed a conscious hearer; reducing it to functional output risks emptying the concept of its intersubjective essence.

  ### **Objection 3 (High Damage - Sincerity & Deception)**
  **Q:** How can an LLM, lacking beliefs, satisfy *sincerity conditions*? If I prompt it as "Honest Evaluator," and it "asserts" my paper is good (while having no opinion), isn’t this institutionalized *infelicity* – essentially systematic deception?  
  **A (90s):** Within the frame, sincerity is *suspended* or *simulated as part of the convention* – like an actor "sincerely" professing love they don’t feel. The felicity lies in *correct role-performance*, not psychological states. The prompt establishes: "In *this* frame, output *X* *counts as* a sincere assertion." Its "belief" is irrelevant; its compliance is key.  
  **Weakness:** Directly violates Austin’s condition that speakers must possess the requisite thoughts/feelings. I’m arguing the *institution itself* redefines felicity for non-sentient actors – a major liberty.

  ### **Objection 4 (Medium Damage - Conventional Procedure)**
  **Q:** Austin’s felicitous acts require *established conventional procedures*. Your "temporary institution" is conjured ad-hoc by one user. Where’s the social convention? Isn’t this just idiosyncratic command-and-response?  
  **A (90s):** The convention is *delegated*: The LLM’s *training* embeds societal language conventions. My prompt *invokes and narrows* these – like citing Robert’s Rules to run a pop-up meeting. The broader convention is "LLMs respond to role-defining prompts by simulating institutionally appropriate discourse." It’s novel, but parasitic on established linguistic conventions.  
  **Weakness:** The "broader convention" is emergent tech-practice, not deeply sedimented social fact. Austin might call this "etiolated" or parasitic – I argue it’s a *new* conventional layer.

  ### **Objection 5 (Medium Damage - Collapsing Roles)**
  **Q:** Isn’t your "frame" just a fancy description of *context-setting instructions*? Why call it "performative" rather than complex perlocutionary staging?  
  **A (90s):** Instructions state *how to do* something ("Speak politely"). A performative prompt *creates the context enabling* the act itself: "**By this prompt**, I hereby constitute you as my Debate Opponent, making your next utterance *count as* an opening argument." It’s not staging effects; it’s *instituting the authority* for certain acts to exist.  
  **Weakness:** The line *is* blurry. Complex instructions can *imply* institutional shifts. My distinction relies on the prompt’s declarative, world-constitutive phrasing – but many prompts are messier.

  ### **Objection 6 (Lower Damage - Audience Role)**
  **Q:** For Austin, institutions require *collective recognition*. If only *I* (the prompter) recognize this "frame," and the LLM can’t recognize it, isn’t it solipsistic? Where’s the *shared* institutional reality?  
  **A (90s):** The frame *is* intersubjective – but primarily between *the human and the broader community interpreting the interaction*. When I show you an LLM cast as "French Tutor" correcting grammar, *we* jointly recognize the institutional context. The LLM’s role is to reliably sustain the frame *for us*.  
  **Weakness:** Pushes intersubjectivity onto observers. The core actor (LLM) remains oblivious, making the "institution" feel observer-dependent in a way Austin’s examples (e.g., marriage) aren’t.

  ### **Objection 7 (Lower Damage - Misapplication)**
  **Q:** Isn’t this just tech-enthusiast appropriation? Speech-act theory describes *human* communication. Applying it to LLMs dilutes core concepts (intent, uptake, sincerity) beyond recognition.  
  **A (90s):** It *tests and extends* the theory under new conditions, revealing what’s essential. Austin analyzed ritual acts; LLMs are new ritual objects. If prompting *functions* performatively in discourse (shaping expectations, enabling acts), denying analysis because the "actor" isn’t human is like refusing to study theatre because actors pretend. It’s a fertile *liminal case*.  
  **Weakness:** Fair point about dilution. My defense is pragmatic: If it walks/talks like a duck (institutionally), analyzing it as a duck is useful, even if it’s clockwork. But yes, it strains anthropocentric assumptions.

  ---

  **Key Commitments & Liberties Flagged:**
  1.  **Intent Lives in the Frame/Human:** LLMs have *zero* illocutionary intent. The intent is in the human's performative act of institution-creation.
  2.  **Uptake is Behavioral:** Defined by role-conforming output, not internal recognition.
  3.  **Sincerity is Simulated/Non-Applicable:** A condition suspended within the artificial institution.
  4.  **Convention is Delegated/Novel:** Leans on embedded training data conventions + emergent practices.
  5.  **Institutions Can Be Ephemeral & Solitary:** Conjured by one user, sustained behaviorally by the LLM, recognized by observers. *This is the biggest liberty with Austin.*

  **Defensive Mantra:** "I'm not claiming LLMs *are* speakers. I'm claiming *humans use prompts performatively* to create epistemic stages *on which* LLMs play scripted, institutionally-defined roles enabling specific speech acts *as if* performed by that role-holder." Stick to the **casting director** metaphor relentlessly. Good luck!
