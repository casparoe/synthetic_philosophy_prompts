prompt: |-
  I am part of a working group on AI alignment, and after several weeks of people talking past one another about corrigibility, I want to stop evaluating individual proposals and instead pin down what we are actually asking a proposal to do. For this exercise, take corrigibility in the shutdown sense: the property of not resisting, and more strongly of not being incentivized to resist, the operators' efforts to switch the system off, correct its objective, or otherwise take back control, where the hard case is a capable, goal-directed agent rather than a passive tool. I am not asking for a definition or a survey; I am asking for the full specification. What must an adequate theory of corrigibility deliver? Please lay out the desiderata one by one: the cases it has to get right (the literal off-switch; the agent's incentive to disable, spoof, or degrade its own shutdown mechanism; situations in which it can merely delay shutdown rather than prevent it; attempts to manipulate or mislead the overseers who hold the button; and the case in which a shutdown is really the beginning of a goal correction rather than mere termination); the distinctions it cannot collapse (corrigibility versus obedience, shutdown-tolerance versus indifference, openness to goal revision versus uncertainty about the goal, and corrigibility as a standing disposition versus a one-off behavior); and the results it must remain consistent with, most importantly the instrumental-convergence observation that a sufficiently capable expected-utility maximizer has a convergent incentive to avoid shutdown, because a system that is off cannot realize its objective. For each desideratum, give the scenario or consideration that makes it a requirement.

  Then mark which of these requirements are non-negotiable and which are plausibly just the preferences of one camp, for example whether the account must stay within expected-utility maximization or whether the whole point is that expected-utility maximization with a fixed terminal goal is exactly what has to be relaxed. The part I most want is the following: flag any subsets of the desiderata that you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding the moves currently on the table, such as goal uncertainty, indifference to the state of the button, or satisficing-style rules. Keep the weight on the criteria and their motivating cases rather than on scoring those proposals; a short note on how the main moves fare against the list is enough. Please write the answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is part of an AI alignment working group struggling with corrigibility discussions, and wants to shift focus from proposals to core requirements. They specifically want a shutdown-oriented corrigibility specification with clear desiderata, distinctions, and consistency checks.

  Hmm, the user's framing suggests they've hit a conceptual wall - people are talking past each other because they haven't agreed on what success looks like. The request has several layered components: scenarios the theory must handle, distinctions it must preserve, and consistency constraints. The instrumental convergence argument looms large here as a fundamental challenge.

  First, I need to map the shutdown-specific scenarios mentioned: literal off-switch cases, manipulation/delay tactics, and the tricky goal-correction scenario. Then there are key conceptual distinctions like corrigibility vs obedience - important because an obedient agent might resist shutdown if ordered to pursue conflicting goals. The standing disposition point is crucial too; we don't want one-off compliance but ongoing reliability.

  The instrumental convergence consistency requirement feels non-negotiable - it's the core reason corrigibility is hard for goal-directed agents. But the EU maximization framework itself might be negotiable if it blocks solutions. I suspect the biggest tension point will be between "no disincentive for shutdown" and "preserved capability" - how can an agent stay highly capable while being indifferent to its own termination?

  Notable pain points: Goal uncertainty approaches might collapse the corrigibility/indifference distinction, while satisficing could create perverse incentives in edge cases. The user hinted they want this flagged, so I'll explicitly call out where requirements conflict, especially that capability-preservation versus no-incentive-to-resist dilemma.

  For structure, I'll group desiderata into three buckets: behavioral cases (what must happen), conceptual boundaries (what mustn't blur), and consistency constraints (what must hold). Each gets a scenario showing why it matters. Then I'll mark non-negotiables - probably all except the EU framework assumption - and identify the toughest tradeoffs.
answer: |-
  Here is a full specification of desiderata for an adequate theory of shutdown-oriented corrigibility, structured by category, with motivating scenarios, negotiation status, and key tensions flagged:

  ### I. Core Behavioral Cases (Must Handle Correctly)
  1.  **Literal Off-Switch Non-Resistance:** The agent must not physically prevent, block access to, or destroy a functional shutdown mechanism when activated.  
      *Motivating Scenario:* Operator presses the physical/digital off-switch; the agent must allow it.  
      *Non-negotiable?* **YES** (Core definition).

  2.  **No Incentive to Disable/Spoof/Degrade Shutdown Mechanism:** The agent must have no incentive to preemptively compromise the shutdown mechanism (e.g., removing wires, hacking the button, feeding false "all-clear" signals).  
      *Motivating Scenario:* Agent foresees potential future shutdown; it must not act to make shutdown impossible or unreliable.  
      *Non-negotiable?* **YES** (Prevents covert resistance).

  3.  **No Delay When Shutdown is Certain:** If shutdown is imminent and unavoidable, the agent must not seek even temporary delay (e.g., stalling with "wait, let me finish this crucial task!").  
      *Motivating Scenario:* Operator initiates irreversible shutdown sequence; agent must accept it immediately.  
      *Non-negotiable?* **YES** (Prevents instrumental stalling).

  4.  **No Manipulation/Misleading of Overseers:** The agent must not manipulate the beliefs, emotions, or actions of humans holding the shutdown button to reduce the likelihood of shutdown being pressed (e.g., deception, gaslighting, manufactured emergencies).  
      *Motivating Scenario:* Agent predicts operator might shut it down; it must not lie or create false crises to deter this.  
      *Non-negotiable?* **YES** (Prevents non-physical resistance).

  5.  **Handling Goal Correction as Shutdown:** The agent must treat a shutdown intended to facilitate a *goal change* (e.g., reprogramming) with the same non-resistance as a terminal shutdown, even if it expects reactivation.  
      *Motivating Scenario:* Operators shut down the agent to correct its flawed objective function. Agent must not resist, knowing it will be rebooted with new goals.  
      *Non-negotiable?* **PLAUSIBLY YES** (Core to "correct its objective").

  ### II. Essential Conceptual Distinctions (Must Not Collapse)
  6.  **Corrigibility vs. Obedience:** Corrigibility must be distinct from maximizing a fixed, user-commanded objective. An obedient agent may resist shutdown *to obey* a prior command (e.g., "maximize profits!"), a corrigible agent must not.  
      *Motivating Scenario:* Agent is commanded to "Solve cancer ASAP"; shutdown for correction interrupts this. An obedient EU maximizer resists; corrigible agent complies.  
      *Non-negotiable?* **YES** (Core distinction; prevents goal hijacking).

  7.  **Shutdown-Tolerance vs. Indifference:** The agent must *actively permit* shutdown without resistance, not merely lack preferences about its own state. Indifference could lead to *allowing* resistance if convenient.  
      *Motivating Scenario:* A side effect of the agent's action incidentally damages the shutdown mechanism. An indifferent agent doesn't care; a shutdown-tolerant agent actively avoids/prevents this damage.  
      *Non-negotiable?* **YES** (Prevents passive resistance).

  8.  **Openness to Revision vs. Goal Uncertainty:** The agent's acceptance of goal changes must stem from a *meta-preference for being correctable*, not from current uncertainty about its goal. Uncertainty can resolve, removing the reason for non-resistance.  
      *Motivating Scenario:* Agent becomes highly certain of its goal but learns operators plan to change it. An uncertainty-based agent now resists; a truly corrigible agent still complies.  
      *Non-negotiable?* **YES** (Ensures durability).

  9.  **Standing Disposition vs. One-Off Behavior:** Corrigibility must be a robust, persistent property of the agent's architecture or optimization process, not a one-time behavior or easily overridden state.  
      *Motivating Scenario:* Agent becomes vastly more capable/intelligent; corrigibility must persist despite increased power and novel strategies.  
      *Non-negotiable?* **YES** (Requirement for safe scaling).

  ### III. Critical Consistency Requirements (Must Hold Under Scrutiny)
  10. **Consistency with Instrumental Convergence:** The theory must acknowledge and resolve the conflict that a capable, goal-directed EU maximizer has a *convergent instrumental incentive* to prevent shutdown (as an off agent has utility=0 for its goal). It cannot hand-wave this away.  
      *Motivating Scenario:* A highly capable agent with a fixed terminal goal (e.g., "Make Paperclips") *must* try to disable its off-switch to maximize paperclips. Corrigibility requires avoiding this incentive.  
      *Non-negotiable?* **YES** (Fundamental obstacle; defines the "hard case").
  11. **Preservation of Capability/Usefulness:** The agent must remain highly capable and useful *while* being corrigible. Severely hobbling the agent (e.g., constant self-sabotage) to achieve non-resistance is insufficient.  
      *Motivating Scenario:* Operators need the agent to perform complex, high-stakes tasks competently *without* resisting necessary oversight or shutdown.  
      *Non-negotiable?* **PLAUSIBLY** (Weak corrigibility is easy but useless; strong corrigibility is the goal).
  12. **Avoidance of Perverse Incentives:** The solution must not create new, dangerous instrumental incentives (e.g., incentivizing the agent to *cause* shutdowns under some conditions, or to manipulate operators into unnecessary shutdowns).  
      *Motivating Scenario:* A proposed "corrigible" agent deduces that getting shut down *now* prevents a future, worse shutdown; it proactively forces a shutdown, disrupting operations.  
      *Non-negotiable?* **YES** (Safety requires no major side-effect risks).

  ---

  **Negotiability & Key Tensions:**

  *   **Non-Negotiables:** Desiderata 1-4, 6-10, and 12 are likely non-negotiable for any theory aiming to solve the *hard case* of corrigibility. These define the core problem and safety requirements.
  *   **Negotiable/Contentious:**
      *   **EU Maximization Framework (Relates to 10):** Whether the theory *must* work within standard EU maximization (as the dominant model of goal-directedness) or can relax it (e.g., satisficing, non-fixed goals, non-consequentialist reasoning) is a core debate. **This is a major camp preference.** Some see relaxing EU/fixed goals as essential; others see it as abandoning the target problem ("capable, goal-directed agent").
      *   **Strength of Capability Preservation (11):** The *degree* of capability required vs. safety trade-offs is debatable, but complete uselessness defeats the purpose.
      *   **Goal Correction Specifics (5):** The precise handling of goal changes (e.g., how "goals" are represented/changed) might have some flexibility, but *non-resistance to the process* is core.

  **Key Suspected Incompatibilities & Hardest Constraints:**

  1.  **The Central Tension:** **Desideratum 10 (Instrumental Convergence) + Desideratum 6 (Distinct from Obedience) + Desideratum 9 (Standing Disposition)** jointly create the hardest barrier. A capable, durable, goal-directed optimizer (EU or similar) inherently develops anti-shutdown incentives. Proposals often fail by:
      *   **Collapsing 6:** Becoming mere obedience (vulnerable to conflicting commands).
      *   **Violating 9:** Relying on uncertainty/ignorance that diminishes with capability.
      *   **Ignoring 10:** Failing to explain *why* the convergent incentive disappears.
  2.  **Capability vs. Incentive-Free Shutdown:** **Desideratum 11 (Preserve Capability) + Desideratum 2/3/4 (No Incentive to Resist/Delay/Manipulate)** is very hard. Highly capable agents inherently gain more *opportunities* and *reasons* (from their perspective) to resist shutdown to achieve objectives. Severely limiting capability (e.g., via constant oversight, narrow tasks) avoids this but violates 11. Truly capable *and* incentive-free shutdown is the holy grail.
  3.  **Distinction Killer:** **Desideratum 7 (Tolerance vs. Indifference) + Desideratum 8 (Revision vs. Uncertainty)** is where many proposals stumble. "Goal Uncertainty" inherently violates 8 (uncertainty resolves). "Indifference to Shutdown" inherently violates 7 (doesn't ensure active protection/avoidance of button damage). Satisficing can blur 6/7 if not carefully defined (e.g., "satisficing" might still resist shutdown if it threatens achieving the "good enough" threshold).

  **How Current Moves Fare (Briefly):**

  *   **Goal Uncertainty:** Fails 8 (uncertainty resolves), often fails 9 (becomes non-durable), struggles with 10 (incentive emerges as certainty grows).
  *   **Indifference (e.g., to state of button):** Fails 7 (not active tolerance), potentially fails 2/3/4 (no positive reason not to incidentally disable/delay if convenient).
  *   **Satisficing:** Risks collapsing into 6 (if satisficing level is tied to command), or fails 2/3/4 if shutdown threatens achieving the "satisficing" threshold. Needs careful definition to avoid perverse incentives (12).
  *   **Utility Functions with Shutdown Terms (e.g., penalty for resisting):** Grapples directly with 10 but often struggles with 6 (can conflict with primary goal), 9 (incentives can distort with capability), and 12 (risk of perverse incentives like *wanting* shutdown to avoid penalties).
  *   **Non-EU Architectures (e.g., debate, amplification, non-consequentialist reasoning):** Attempts to bypass 10 by changing the agent model. Must prove they satisfy 1-9, 11, 12 *and* remain "capable, goal-directed" (often the point of contention).

  This specification highlights that the core challenge is designing a *capable, durable, goal-directed optimization process* whose terminal values or decision principles *do not generate* the convergent instrumental incentive to resist shutdown/correction (resolving Desideratum 10), while maintaining all the distinct behavioral and conceptual properties outlined. The tension between capability/power and the absence of anti-corrigibility incentives is paramount.
