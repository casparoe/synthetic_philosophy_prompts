  Below is a structured role-play design for your workshop. Participants experience a norm collapse driven by shifting perceptions of honor, mirroring Bernard Williams' thesis, while Appiah's emphasis on interests is embedded in the mechanics. The game unfolds over 45-50 minutes, leaving 40-45 minutes for debrief.

  ---

  ### **Game Title:** *The Velvet Ledger Guild*  
  **Duration:** 45-50 minutes  
  **Participants:** 16 graduate students  
  **Setup:**  
  - Arrange chairs in a circle. Place a central "Honor Board" showing cumulative arbitration counts.  
  - Prepare:  
    - 16 role cards (background + scripted arguments).  
    - 32 tokens (e.g., poker chips) for payoffs.  
    - Secret rule slips (one per participant, explaining payoffs).  
    - Dispute scenario slips (8 total, e.g., "Dispute over guild resource allocation").  

  ---

  ### **Phase 1: Rules Setup (5 min)**  
  **Facilitator Script:**  
  *"Welcome to the Velvet Ledger Guild, a prestigious society where disputes are traditionally resolved through ritual challenges. Today, you’ll resolve disputes in pairs. Each of you has a role card. When a dispute arises, you must choose:*  
  - ***Challenge:*** Defend your honor publicly.  
  - ***Arbitration:*** Settle privately with a guild mediator.  

  *Here’s the catch: Choosing arbitration earns you **1 economic token** (secretly). But if you arbitrate, you’ll be **branded a coward** UNLESS at least two others have already chosen arbitration in prior disputes. Tokens are redeemable for guild perks. The Honor Board tracks arbitration counts. Begin!"*  

  *(Do not mention Williams/Appiah. Hand out role cards and secret rule slips.)*  

  ---

  ### **Phase 2: Role-Play (40-45 min)**  
  #### **Rounds Structure (4 rounds × 2 disputes/round):**  
  1. **Pair Selection (1 min/round):** Randomly pick two pairs per round (4 participants/round).  
  2. **Dispute Setup (2 min/dispute):**  
     - Give each pair an identical dispute scenario slip.  
     - Participants read role cards. Half have **honor-leaning** arguments ("Challenges preserve guild dignity!"), half have **interest-leaning** arguments ("Arbitration saves resources!").  
  3. **Public Debate (3 min/dispute):**  
     - Pairs debate their choices aloud using scripted arguments. *Example script:*  
       - *Honor-leaning:* "Avoiding a challenge stains our legacy! What if others see us as weak?"  
       - *Interest-leaning:* "Tokens fund our projects! Why risk injury for pride?"  
     - **Crucial:** Arguments are fixed and recycled—no new reasons emerge.  
  4. **Secret Choice (1 min/dispute):**  
     - Each secretly chooses Challenge (C) or Arbitration (A).  
  5. **Reveal & Consequences (2 min/dispute):**  
     - Reveal choices. Apply payoffs:  
       | Choices             | Payoff (No Threshold)       | Payoff (Threshold Met*) |  
       |---------------------|------------------------------|--------------------------|  
       | Both A              | +1 token each                | +1 token each            |  
       | Both C              | -1 token each (duel cost)    | -1 token each            |  
       | A vs. C             | A: -2 tokens (coward); C: +1 | A: +1 token; C: 0 tokens |  
       *(Threshold = 2+ prior arbitrations)*  
     - Update Honor Board with new arbitrations. Brand cowards publicly if threshold unmet.  
     - Distribute tokens.  

  #### **Predicted Flow:**  
  - **Rounds 1-2:** Most choose Challenge. Honor arguments dominate. Early arbitrators are branded cowards.  
  - **Round 3:** Threshold met (2+ arbitrations). Interest arguments gain traction. More arbitrate safely.  
  - **Round 4:** Norm collapses. Most arbitrate; challenges become rare.  

  ---

  ### **Phase 3: Debrief (40-45 min)**  
  **Guided Discussion:**  
  1. **Experience Sharing (10 min):**  
     - *"When did arbitration feel safe? Was it the arguments or the Honor Board that changed your choice?"*  
     - *"Did anyone feel pressured to conform? How?"*  

  2. **Reveal Theses (5 min):**  
     - *"This mirrors Bernard Williams' view: Moral revolutions (like dueling’s end) hinge on shifts in honor, not argument wins. The Honor Board = social perception."*  
     - *"Contrast Kwame Appiah: He emphasizes material interests (tokens) and coordination. But did tokens matter before the threshold?"*  

  3. **Map Game to Theory (15 min):**  
     - **Williams Moments:**  
       - Early arbitrators branded = honor’s power pre-revolution.  
       - Threshold met = honor redefined ("arbitration isn’t cowardly").  
       - Collapse = revolution driven by crowd movement, not reasons.  
     - **Appiah Moments:**  
       - Tokens = hidden interests.  
       - Late-round coordination = social equilibrium shift.  
     - **Predictions Validated:**  
       - *Vocal participant freezing group:* Early honor-advocates silenced by risk; only shifted post-threshold.  
       - *Reasons changed nothing:* Same arguments used throughout—only status shifts altered behavior.  

  4. **Limitations & Real World (10 min):**  
     - *"What this misses:**  
       - **Material decline:** Unlike slavery’s end, we didn’t model collapsing economies forcing change (e.g., plantations becoming unprofitable). I’ll add: Real revolutions involve power shifts—honor alone can’t explain them.  
       - **Slow-building outrage:** Our threshold was abrupt; real honor shifts brew through culture (e.g., literature condemning dueling).  
       - **Power asymmetry:** Guild members were equals; real elites resist change (e.g., slave owners)."*  

  5. **Final Reflection (5 min):**  
     - *"Did you ‘move with the crowd’? How does this reshape how you see activism or policy change?"*  

  ---

  ### **Materials Prep Checklist**  
  - **Role Cards × 16:** Mix honor/interest arguments. *Example honor card:*  
    > **Guild Elder:** "Challenges are sacred! I’d rather die than stain my family’s name."  
    > *Arguments:* "Tradition defines us!" / "Arbitration invites chaos!"  
  - **Secret Rule Slips × 16:** Explain payoffs and threshold rule.  
  - **Tokens × 32:** Use poker chips/buttons.  
  - **Honor Board:** Poster with "Arbitration Count: [ ]".  
  - **Dispute Scenarios × 8:** Simple conflicts (e.g., "Dispute: Who leads the next guild expedition?").  

  ### **Facilitator Notes**  
  - **Critical:** Enforce secret choices and public Honor Board updates.  
  - **Timekeeping:** Use a timer for debates/choices.  
  - **Token Tracking:** Assign a co-facilitator to manage tokens/board.  
  - **Post-Game:** Collect tokens/cards to avoid distractions during debrief.  

  This design forces participants to *live* Williams’ thesis—honor shifts enable change, not arguments—while Appiah’s interests lurk in the background. The debrief explicitly ties game moments to both philosophers and flags real-world gaps for you to contextualize.
