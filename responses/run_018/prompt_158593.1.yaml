  But where things get tricky is the malfunction vs. representational error distinction. The blog oversimplifies by implying all errors are "broken" states. Millikan actually distinguishes between function failure (malfunction) and normal-but-inaccurate representation (like frog sensors in abnormal environments). This nuance matters because not every error means the mechanism is damaged.

