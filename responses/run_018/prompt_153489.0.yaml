  We are drafting a joint statement between two opposing philosophical positions on the nature of scientific change: the Kuhnian incommensurabilist and the rational continuist. The structure is as follows:

  1. Agreed claims (numbered)
  2. Residual disagreements (each stated from the perspective of the camp that holds it)
  3. Three cruxes (with historical episodes and predictions for each)
  4. Joint assessment on whether the dispute is verbal or substantive

  We write in a formal register for a philosophy of science journal.

  ---

  ## Joint Statement on the Nature of Scientific Change

  ### 1. Agreed Claims

  After sustained adversarial collaboration, we, the undersigned, agree on the following historical and conceptual points concerning scientific revolutions:

  1.1 **Historical Dynamics of Major Revolutions**: Major scientific revolutions, such as the Copernican and relativistic transitions, involve periods of crisis precipitated by the accumulation of anomalies that resist resolution within the dominant paradigm. These crises lead to the proposal of fundamentally new theoretical frameworks, which reorganize the conceptual landscape and redefine the problems deemed significant.

  1.2 **Role of Anomalies**: The destabilization of a dominant framework is typically driven by persistent anomalies that challenge its core assumptions. These anomalies are not merely isolated empirical discrepancies but are recognized as such because they systematically undermine the paradigm’s problem-solving efficacy.

  1.3 **Local Translation Difficulties**: During paradigm shifts, practitioners experience significant difficulties in translating key theoretical terms between the old and new frameworks. These difficulties arise from shifts in the network of concepts, the criteria for applying terms, and the ontological commitments of the theories.

  1.4 **Limits of Logical Comparison**: Formal logical comparison of axiom systems, when abstracted from their empirical interpretations, is insufficient for adjudicating between competing paradigms. This is because the empirical content and the criteria for what counts as evidence are paradigm-dependent.

  ### 2. Residual Disagreements

  Despite these agreements, we maintain the following distinct positions:

  **2.1 The Kuhnian Incommensurabilist Position**:  
  We hold that paradigm shifts involve *ontological incommensurability*: the entities and referents posited by successive paradigms are not preserved across transitions, and there is no theoretically neutral standpoint from which to establish reference. Consequently, *normative incommensurability* also obtains: the standards for explanatory adequacy, simplicity, and predictive success are internal to a paradigm and cannot be neutrally applied across paradigms. Thus, the choice between paradigms is not determined by shared rational criteria but involves a Gestalt-like conversion. The distinction between ontological and normative incommensurability is substantive, as each reinforces the other in grounding the discontinuity of scientific development.

  **2.2 The Rational-Continuist Position**:  
  We hold that while local pragmatic frictions in translation exist, they do not entail ontological or normative incommensurability. Cross-paradigm comparison is always possible through shared criteria, including predictive accuracy, internal consistency, explanatory scope, and structural continuity (e.g., mathematical formalism). Ontological shifts are resolvable by establishing referential continuity via causal or structural links, and normative standards (e.g., predictive success) are sufficiently stable to permit rational arbitration. The distinction between ontological and normative incommensurability is largely terminological, as both reduce to tractable translation problems that do not undermine the rationality of theory choice.

  ### 3. Cruxes for Future Inquiry

  We identify the following cruxes as pivotal for resolving our disagreement. For each, we specify a relevant historical episode or formal argument, our respective predictions, and whether they are empirically distinguishable.

  **Crux 1: Non-Circular Metric for Translation Failure**  
  *Question*: Can a non-circular metric for “translation failure” be constructed without presupposing the ontology of one paradigm?  
  - *Relevant Episode*: The transition from phlogiston theory to oxygen theory in chemistry.  
  - *Incommensurabilist Prediction*: The failure to translate “dephlogisticated air” into “oxygen” without circularly privileging Lavoisier’s ontology demonstrates that translation requires adopting the new paradigm’s framework.  
  - *Continuist Prediction*: The translation can be achieved via shared empirical referents (e.g., the gas produced by heating mercury calx) and functional roles (e.g., supporting combustion), showing that translation failure is local and surmountable.  
  - *Distinguishability*: The predictions are empirically distinguishable by examining whether chemists could identify the same substance across theories without prior commitment to either ontology.

  **Crux 2: Predictive Equivalence and Underdetermination**  
  *Question*: Does persistent predictive equivalence in cases of radical underdetermination (e.g., between Ptolemaic and Copernican astronomy at the observational level) support continuism or mask deeper semantic divergence?  
  - *Relevant Episode*: The predictive equivalence of the Ptolemaic and Copernican models in the 16th century.  
  - *Incommensurabilist Prediction*: Predictive equivalence masks a semantic divergence in concepts like “planet” (which in Ptolemy includes the Sun) and “motion” (absolute vs. relative), revealing that shared predictions do not imply shared meanings.  
  - *Continuist Prediction*: Predictive equivalence demonstrates the continuity of empirical content and the possibility of rational comparison on structural grounds (e.g., Copernicus’s simpler geometry).  
  - *Distinguishability*: The distinction lies in whether the post-revolutionary community retrospectively recognizes the equivalence as evidence of continuity or as a superficial overlap masking deeper rupture.

  **Crux 3: Retention of Mathematical Formalism**  
  *Question*: Does the retention of mathematical formalism across a revolution (e.g., Hamiltonian mechanics in classical and quantum physics) count as evidence of shared conceptual structure or only of syntactic coincidence?  
  - *Relevant Episode*: The use of Hamiltonian formalism in the transition from classical to quantum mechanics.  
  - *Incommensurabilist Prediction*: The formalism is syntactically retained but semantically reinterpreted (e.g., the Hamiltonian operator acts on state vectors in Hilbert space, not on phase space points), indicating a conceptual rupture.  
  - *Continuist Prediction*: The retention of the formalism, including its structural relationships and predictive machinery, provides a bridge for conceptual continuity and rational comparison.  
  - *Distinguishability*: The predictions can be tested by examining whether the formalism’s success in the new paradigm relies on the same physical interpretations or is independent of them.

  ### 4. Joint Assessment on Verbal vs. Substantive Disagreement

  We agree that the dispute is partially verbal but also contains substantive elements. We accept the following criteria for distinguishing verbal from substantive disagreement:

  - **Verbal Disagreement**: If a dispute can be fully resolved by clarifying definitions or adopting a common terminology without altering either party’s core commitments, it is verbal.  
  - **Substantive Disagreement**: If resolution requires one party to abandon a core commitment (e.g., the incommensurabilist’s denial of cross-paradigm reference or the continuist’s commitment to universal rational standards), it is substantive.

  Applying these criteria:  
  - The debate over *normative incommensurability* may be partially verbal, as both sides recognize that scientists often appeal to values like accuracy and simplicity, but disagree on whether these values are paradigm-internal or transparadigmatic.  
  - The debate over *ontological incommensurability* is substantive, as it concerns whether scientific progress accumulates referents or repeatedly reconstructs the world.  

  We concur that the cruxes identified above are substantive and that resolving them would advance the debate. Future work should focus on these empirical and conceptual tests.

  ---

