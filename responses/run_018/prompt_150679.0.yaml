answer: |-
  Here's a dissection of "utilitarianism for animals, Kantianism for people" as a conceptual menu for your bioethicist character, analyzing each reading for coherence, defensibility, and policy support:

  ### The Menu of Interpretations

  1.  **The Bare Domain Split**
      *   **Interpretation:** This claims *only* that the moral framework applicable to entities within Domain A (animals) is utilitarianism (maximizing aggregate welfare), while the framework applicable to Domain B (humans) is Kantianism (inviolable rights/side-constraints). No justification is given *why* these domains map to species, nor *why* these frameworks apply specifically to them. The boundary is stipulated, not argued for.
      *   **Commitments:** Only that different frameworks apply to different groups. Implicitly commits to the *existence* of a morally significant boundary roughly coinciding with species (Homo sapiens).
      *   **Coherent?** Yes. It's logically possible to simply assert different rules for different groups.
      *   **Defensible?** **Trivial, bordering on vacuous.** It provides no *reason* for the split beyond assertion. It cannot bear the weight of justification; it *is* the assertion needing justification. It invites the "why draw the line *here*?" challenge.
      *   **Supports Policy Regime?** Only tautologically. The policy *is* the domain split. It offers no argument *against* extending rights to animals or applying utilitarianism to humans; it simply declares it won't happen. Vulnerable to the charge of speciesism-as-bias.
      *   **Character Must Hold:** This is the minimal commitment. If the character offers *no further account*, this is what they are left with.

  2.  **The Capacity Threshold**
      *   **Interpretation:** The split is justified by the presence or absence of a specific, morally relevant capacity (e.g., rational autonomy, capacity for second-order volitions, moral agency, strong self-consciousness, ability to grasp reciprocal duties) possessed (typically) by humans and lacked (typically) by non-human animals. Possessing the capacity triggers Kantian side-constraints; lacking it places one under utilitarian aggregation.
      *   **Commitments:** A specific capacity is morally fundamental. This capacity is binary (or near-binary) in possession. Humans (typically) possess it; non-human animals (typically) lack it. The *kind* of moral treatment is fundamentally determined by *this capacity*, not species per se.
      *   **Coherent?** Yes. The link between capacity and moral treatment is common in philosophy (Kant himself, contemporary capabilities approaches).
      *   **Defensible?** **Substantive and defensible (though contested).** This is the most philosophically robust version. It provides a *reason* for the split based on a morally relevant property. Defensibility hinges on successfully arguing: (a) the chosen capacity *is* the basis for inviolable rights, (b) it is possessed sufficiently by (nearly) all humans, (c) it is lacked by (nearly) all non-human animals, (d) lacking it genuinely justifies only utilitarian consideration (no "animal rights").
      *   **Supports Policy Regime?** **Yes, this is the version most likely to genuinely support the regime.** It provides a principled rationale for the different treatment: beings capable of X deserve inviolable rights; beings incapable of X warrant only welfare aggregation. It directly addresses the "why here?" challenge.
      *   **Character Must Hold:** The character must explicitly or implicitly invoke such a capacity as the justification. They must be prepared to defend its moral relevance and its distribution (especially regarding marginal human cases).
      *   **Threshold/Species Collapse Risk:** If the *only* evidence offered for possessing the capacity is membership in Homo sapiens, or if the capacity is *defined* such that only humans can have it without independent criteria, this collapses into the Bare Domain Split disguised by terminology. A genuine capacity view must allow (in principle) for non-humans possessing it and humans lacking it.

  3.  **The Genuinely Hybrid Normative Architecture**
      *   **Interpretation:** There are two entirely separate, independent moral theories: Theory U (utilitarianism) governs our duties regarding animals. Theory K (Kantianism) governs our duties regarding humans. There is no overarching meta-ethical principle unifying them or resolving conflicts. They operate in parallel universes of value. The question "Why can't the same being fall under both?" has no systematic answer within the theory.
      *   **Commitments:** Utilitarianism and Kantianism are fundamentally incompatible and irreconcilable at the meta-ethical level. There is no single "morality" governing all entities; there are distinct moral realms. Species membership directly assigns entities to their realm.
      *   **Coherent?** **Barely coherent, highly unstable.** It's hard to maintain that two conflicting theories are both "true" for different groups without a unifier. It struggles profoundly with interactions (e.g., human actions affecting animals).
      *   **Defensible?** **Substantive but likely false/unsustainable.** It avoids justifying the split by declaring it foundational. However, it faces devastating objections:
          *   **Interspecies Welfare Comparison:** Policy decisions *constantly* require weighing human interests against animal welfare (e.g., medical research, habitat destruction, food production). The hybrid view offers *no tools* for this comparison. Does the human right trump *any* animal suffering? Is *any* human benefit worth *any* animal cost? The regime *requires* aggregation across the boundary for practical policy, but the hybrid theory forbids it conceptually.
          *   **The Meta-Ethical Vacuum:** Why *these* two theories? Why *this* assignment? Without a unifier, the assignment seems arbitrary. It offers no defense against someone proposing "Kantianism for animals, Utilitarianism for people" or vice-versa.
      *   **Supports Policy Regime?** **No.** The fatal flaw is the interspecies comparison problem. The practical necessity of making trade-offs between human rights/benefits and aggregate animal welfare is unavoidable in regulation. This hybrid view provides *no principled way* to make those trade-offs, rendering the proposed policy regime incoherent in practice. It might *inspire* the split but cannot *justify* its implementation in a world of interaction.
      *   **Character Must Hold:** The character must explicitly deny the need for a unified meta-ethics and deny the possibility/necessity of meaningful interspecies welfare comparisons for policy. They must treat the realms as truly watertight.

  4.  **Rhetorical Compression (Masking Gradualism or Speciesism)**
      *   **Interpretation:** The slogan presents a sharp dualism, but this is shorthand or misdirection.
          *   **Version A: Gradualism:** Moral status is a matter of degree, scaling with cognitive capacities (sentience, consciousness, agency). Utilitarianism might be most appropriate for simpler sentients, while Kantian constraints become increasingly relevant (and perhaps necessary) for beings with higher capacities. Humans are at the high end, but some animals (e.g., great apes, cetaceans) might warrant stronger protections than insects. The slogan oversimplifies this continuum.
          *   **Version B: Unexamined Speciesism:** The *real*, unstated criterion is simply biological species membership. "Animals" means "non-Homo sapiens," and "people" means "Homo sapiens." The Kantian/Utilitarian language is a philosophical veneer for an ultimately arbitrary preference for one's own species.
      *   **Commitments:**
          *   *Gradualism:* Moral status is scalar, capacities matter progressively.
          *   *Speciesism:* Species membership *itself* is the fundamental criterion.
      *   **Coherent?** Gradualism: Yes. Speciesism: Coherent but morally problematic.
      *   **Defensible?**
          *   *Gradualism:* **Substantive and defensible.** Many find this intuitively plausible and philosophically respectable (e.g., Singer's sliding scale).
          *   *Speciesism:* **Substantive but generally considered indefensible in serious ethics.** Treating species membership itself as the sole basis for radically different moral status is widely seen as analogous to racism or sexism – an arbitrary prejudice.
      *   **Supports Policy Regime?**
          *   *Gradualism:* **Undermines the strict two-tier regime.** A gradualist might *approximate* the slogan's policy for practical convenience (e.g., a sharp legal line), but they *cannot consistently endorse it as fundamentally justified*. They must acknowledge stronger duties to cognitively complex animals and weaker constraints regarding severely cognitively impaired humans. The slogan misrepresents their actual view.
          *   *Speciesism:* **Can support the regime, but only via an indefensible commitment.** The policy *is* the expression of species preference. The slogan provides a pseudo-philosophical cover.
      *   **Character Must Hold:** For this interpretation to be what's *really* going on:
          *   *Gradualism:* The character must *deny* the sharp boundary implied by the slogan when pressed, even if they find it pragmatically useful.
          *   *Speciesism:* The character must be unable to provide a non-species-based justification for the boundary upon scrutiny, or reveal a prior commitment to human exceptionalism based solely on species.

  ### Key Tensions & Collapses in the Taxonomy

  1.  **Capacity Threshold vs. Bare Domain Split:** The key distinction is the presence of a *justifying property*. If the "capacity" invoked is simply "being human," it collapses into the Bare Domain Split. A genuine capacity view requires the capacity to be definable independently of species and applicable in principle to non-humans (even if empirically rare). The Capacity Threshold is the *justified* version of what the Bare Split merely asserts.
  2.  **Hybrid Architecture vs. Interspecies Comparison:** This is the fatal flaw. The Hybrid view *cannot* support the practical demands of a regulatory regime that inevitably involves human actions impacting animal welfare. The necessity of cross-boundary trade-offs exposes its incoherence. Any viable justification for the split regime *must* provide, or assume, a way to make these comparisons (even if the answer is "human rights always trump"), which the Hybrid view explicitly rejects.

  ### Real-World Deployment

  *   **What Serious Defenders Usually Mean:** The **Capacity Threshold** interpretation. This is the philosophically substantive core. Debaters invoking Nozick's slogan typically point to rational autonomy, moral agency, or personhood as the threshold property justifying radically different treatment. They intend to offer a principled distinction based on a morally relevant characteristic.
  *   **Philosophical Straw Figures:**
      *   **The Bare Domain Split:** Rarely held explicitly by serious philosophers. It's more the *accusation* leveled by critics ("You're just arbitrarily favoring humans!").
      *   **The Genuinely Hybrid Architecture:** Almost non-existent as a consciously held, defended position. It's primarily a *reductio ad absurdum* used by critics to highlight the incoherence they see in the slogan if pushed to its logical extreme. No serious thinker proposes two utterly disconnected moral theories without *any* meta-ethical unity.
      *   **Rhetorical Compression (Speciesism):** Critics *accuse* proponents of holding this (that the slogan is just a cover for bias). Proponents vehemently deny it, insisting their view is based on capacities. The *Gradualism* version under the slogan is usually held by those who *agree* with animal welfare concerns but reject strong animal *rights*; they might use the slogan loosely, but it misrepresents their nuanced view.

  ### Recommendation for Your Character

  To make the line do "real argumentative work" justifying the specific policy regime:

  1.  **Anchor them firmly in the Capacity Threshold.** This is the only version offering a defensible, substantive rationale for the sharp split. Have them explicitly name the capacity (e.g., "Only beings capable of rational self-legislation and reciprocal moral duties warrant the full protection of rights. Animals, lacking this capacity, are owed only that we minimize their suffering in the aggregate.").
  2.  **Have them pre-empt the collapse.** Address the "marginal cases" objection (humans lacking the capacity) head-on. They might argue: a) it's a tragic exception that doesn't undermine the rule based on typical capacities, b) we extend rights by species affiliation *because* of the overwhelming correlation and social necessity, or c) such humans still possess other relevant properties (e.g., membership in a rights-holding community, potential, relational status).
  3.  **Avoid the Hybrid trap.** Ensure they acknowledge the *need* to weigh human actions against animal suffering in policy, even if their answer is "Human rights/fundamental interests always outweigh aggregate animal welfare concerns in any conflict." This implicitly assumes a way to compare across the boundary, rejecting the pure Hybrid view.
  4.  **Reject the Gradualism Smear.** Have them explicitly deny that moral status is scalar in a way that grants animals rights. ("Sentience grants moral weight, yes, but only full rational autonomy grants inviolable rights.").

  This gives your bioethicist a clear, recognizable, and philosophically engaged position that reflects how the slogan is actually used in serious debate to support the two-tier policy.
