answer: |-
  Hey there,

  What you're noticing is incredibly astute, and it highlights a real tension in how we talk about the past. You've put your finger on something that frustrates many historians and careful readers. While there isn't one universally accepted, single academic term *exactly* for this specific selective flip-flopping you describe, it's widely recognized as a problematic form of **inconsistent presentism** or perhaps more accurately, **moral cherry-picking**.

  Let's break down how it differs from the concepts you mentioned:

  1.  **"Normal" Presentism:** This is indeed applying today's moral standards wholesale to the past without regard for historical context. Judging *everyone* in ancient Rome for owning slaves, without understanding the deeply embedded economic, social, and even philosophical structures that normalized it across nearly all contemporary societies, is pure presentism. It flattens history and prevents understanding *why* things were the way they were.
  2.  **Just Being Inconsistent:** Inconsistency is broader. A writer could be inconsistent about facts, dates, or interpretations without necessarily involving present-day morals. What you're seeing *is* inconsistency, but it's inconsistency driven *specifically* by the selective application of modern ethical judgments.
  3.  **Your Observed Pattern (Moral Cherry-Picking/Inconsistent Presentism):** This is where it gets tricky and feels manipulative. The writer isn't consistently applying modern morals *or* consistently applying historical context. Instead, they wield the spotlight of modern values strategically:
      *   **To Condemn:** They shine the light on an aspect deemed backward by today's standards (e.g., lack of women's rights, slavery) to make a figure or society look foolish or morally deficient, implying they "should have known better" simply by virtue of being human. This ignores the immense weight of cultural norms, available knowledge, technology, and prevailing ideologies that shaped their worldview and limited their perceived options.
      *   **To Excuse:** They then *douse* that spotlight when confronting another aspect of the same person or era that is also problematic by modern standards but perhaps serves the narrative better as "understandable" or fits a preconceived heroic image (e.g., religious persecution, brutal warfare, political executions). Suddenly, "different times, different rules" becomes the convenient shield, dismissing the very moral reasoning they applied moments before.
      *   **To Praise:** Conversely, they might shine the modern spotlight selectively to *praise* someone for an idea or action that *aligns* with modern values (like your medieval queen promoting education), labeling them "ahead of their time," while simultaneously using the "different times" shield to deflect criticism of their other actions that contradict modern values (like her persecution). This creates a distorted, anachronistic hero.

  **Why it happens and where the edges blur:**

  *   **Narrative Convenience:** History is often told as a story with heroes, villains, and progress. Selectively applying morals helps craft a cleaner, more dramatic, or ideologically pleasing narrative. Making someone unambiguously "good" or "bad" is simpler than grappling with their messy, context-bound reality.
  *   **Making Relatable (or Not):** Applying modern morals to condemn can make readers feel superior. Applying context to excuse can make complex historical figures relatable or prevent them from being entirely monstrous, which might be necessary for understanding their motivations or popularity.
  *   **Unconscious Bias:** The writer might genuinely admire certain modern values (like education) and condemn others (like sexism), leading them to subconsciously highlight the "good" and contextualize the "bad" without realizing the inconsistency in their framework.
  *   **The Edges:** The blurriness comes in when genuinely trying to assess *relative* progressiveness within a historical context. Was your queen *more* progressive *for her specific time and place* in promoting education? That requires comparing her to her contemporaries, not just to us. The problem arises when that *relative* assessment bleeds into an *absolute* judgment using modern morals ("progressive" full stop) while refusing to apply the same modern morals elsewhere in her life. The edge is crossed when context is used not for understanding, but purely for exoneration or condemnation based on what serves the immediate point.

  **What to call it?**

  While "inconsistent presentism" is descriptive, "moral cherry-picking" captures the selective, self-serving nature you identified. You could also think of it as **context-switching** – flipping between demanding historical figures meet our standards and letting them off the hook based on theirs, depending on what suits the argument. The core flaw is the **inconsistent application of the ethical framework**, using modern morals not as a consistent lens for critique, nor consistently setting them aside for understanding, but as a flexible tool to shape the historical narrative to the teller's liking.

  It's a sign of weak or biased history writing. Good historical analysis strives for consistency: either rigorously applying modern ethical critique across the board (acknowledging it *is* presentism but making a specific argument), or, more commonly and usefully, striving to understand figures within their own complex web of beliefs, pressures, knowledge, and possibilities, explaining *why* they thought and acted as they did, without necessarily needing to pronounce final moral judgment using an alien framework. What you spotted is the messy, often lazy, middle ground where judgment is applied selectively to fit the story, not the evidence. Keep questioning it – that critical eye is exactly what good history needs!

  Best regards.
