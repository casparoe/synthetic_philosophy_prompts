  ### Semantic Externalism Decision Tree  
  *PhiloLang Seminar Handout*  

  **Start Here:**  
  **Q1.** In the Twin Earth scenario, Earth has H2O ("water"), and Twin Earth has XYZ (a look-alike liquid with different chemistry). Oscar (Earth) and Twin Oscar (Twin Earth) are identical. When they each say "water", do they mean the **same thing**?  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  

  **Q2.** For a speaker who has never seen water but only heard descriptions (e.g., "clear, drinkable liquid"), can they know what "water" refers to **without empirical investigation**?  
  - **Yes** → **Two-dimensionalism**  
  - **No** → **Narrow-content internalism**  

  **Q3.** In the synthetic deference case, a VR community interacts with a liquid ("water") supplied by real-world pipes (carrying chemical ABC). They defer to an AI chemist that mislabels ABC as "H₂O". When they say "water", does it refer to **H₂O** (the AI’s label) or **ABC** (the pipe-liquid)?  
  - **H₂O** → **Social-deference externalism**  
  - **ABC** → **Causal-contact externalism**  

  ---

  ### Theories & Awkward Commitments  
  *(One awkward commitment per theory)*  
  - **Causal-contact externalism**: Must deny that speakers in the VR community can refer to ABC if they’ve only touched virtual water (no direct causal contact).  
  - **Social-deference externalism**: Must accept that if the AI chemist is reprogrammed to call sewage "water", the VR community correctly refers to sewage.  
  - **Narrow-content internalism**: Must insist Oscar and Twin Oscar agree about water’s nature (no disagreement) despite their environments.  
  - **Two-dimensionalism**: Must say "water is H₂O" is metaphysically necessary but epistemically contingent (feels paradoxical).  
  - **Unnamed Combo (Causal + Social)**: Collapses in synthetic cases—if the AI’s output is seen as *causal input*, social deference reduces to causal contact.  

  ---

  ### Unoccupied Leaf  
  **Pattern:**  
  - Q1: **No** (different meanings on Twin Earth)  
  - Q3: *[Would need to answer]* **"Neither—meaning is fixed by internal conceptual role!"**  

  **Diagnosis:** Logically possible but **ugly**, as it abandons externalism after Twin Earth to embrace internalism in the synthetic case. No major theory endorses this flip-flop.  

  ---

  **Note:** Causal and social externalism may **not** cleanly seperate in synthetic-deference cases—the AI’s role blurs the line between causal chains and social institutions.  

  *(Handout typo: "seperate" → intentional for pedagogical flair.)*  

  ---  
  **Scoring Logic:**  
  - Twin Earth "No" → Externalism (split by deference case).  
  - Twin Earth "Yes" → Internalism or 2D (split by a priori knowability).  
  - Synthetic case chooses between deference (social) or direct contact (causal).  
  - Unnamed combo emerges if AI deference is reinterpreted as causal.
