  Now, the activity:

  Materials:
  - A large printed map of the fictional town (on poster paper or a whiteboard) with the six sites marked and labeled with the Founder's name (e.g., "Founder X Square", "Founder X Bridge", "Founder X Street A", etc.). The map should show the four districts and the locations of the community center (Street A), businesses (Bridge), school (Street C), and park (Street D). The Central Square is in the center and shared.
  - Movable name tags for each site (so they can be removed or replaced with new names).
  - A set of blank cards for new names (if they choose renaming).
  - The Archivist's hidden document (a sealed envelope with the diagram and explanation of the network and the migration effect).
  - A timer.
  - Score sheets: one for the city stability (which requires unanimous agreement to get 5 points, else 0) and one for each district to rate their comfort (1-5) after the changes.
  - A facilitator.

  Timeline (75 minutes total):

  1. Introduction (10 minutes):
     - Facilitator sets the stage: the town has six commemorative sites named after Founder X, who was both a founder and an exclusionary figure. The town is grappling with whether to change these names. 
     - Explain the roles: 
          * Archivist: holds historical documents and can provide information when asked.
          * Planner: ensures that no more than two changes are made (removal or renaming).
          * District groups: each has a stake in one of the sites (explain the stakes). 
     - Explain the goal: The group must decide on up to two changes (renaming or removal) to the commemorative sites. They have 20 minutes for discussion and decision. They must achieve unanimous agreement to get the city stability bonus (5 points). Each district group will then rate their comfort (1-5) based on the outcome. The overall goal is to achieve high city stability and high district comfort.

  2. Role Assignment and Preparation (5 minutes):
     - Assign roles (by handing out role cards). 
     - Give the Archivist the hidden document and instruct them to only reveal it if the group asks about the connections between sites or if the facilitator prompts them. 
     - The Planner is given the rule card (only two changes allowed). 
     - District groups gather and discuss their initial positions (what they want to protect and what they might be willing to change). 

  3. Group Discussion and Decision (20 minutes):
     - The group discusses and physically rearranges the map by removing or replacing the name tags. The Planner enforces the two-change limit. 
     - The Archivist can answer factual questions about the Founder (but not volunteer the migration effect unless asked about the connections). 
     - The goal is to reach a decision within 20 minutes. 

  4. Voting and Scoring (5 minutes):
     - After the map is finalized, the group votes for unanimous agreement on the city stability. If all agree, they get 5 points; else 0. 
     - Each district group then rates their comfort (1-5) without consulting others. 

  5. Debrief (35 minutes) - structured as follows:

     a. Reveal the outcomes (5 minutes): 
        - Facilitator announces the city stability score and the comfort ratings for each district. 
        - Asks the group: How did it feel? What were the tensions?

     b. Map decision points to concepts (15 minutes):
        - Facilitator asks: 
            * "Did you consider removing the Central Square? Why or why not?" 
            * "What happened to the other sites after you made changes?" 
        - Then, the facilitator introduces the concept of mnemonic displacement: "In this activity, when we remove one commemorative marker, the symbolic weight doesn't vanish; it redistributes to adjacent markers. Did you observe that? How?"
        - The Archivist is then asked to reveal the hidden document and explain the network and the migration effect. 
        - The facilitator ties the experience to the tension between corrective justice (removing harmful symbols) and mnemonic displacement (the hidden redistribution).

