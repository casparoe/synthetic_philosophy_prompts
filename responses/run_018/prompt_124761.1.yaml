        - Predictable: The group quickly agrees to rename the Central Square (the obvious central site) and then uses the second change on, say, one street. Then they are left with the Bridge and three streets still named after the founder. Then they notice that the Bridge becomes more prominent and the untouched streets also become more charged. They may become paralyzed because they can't change more than two. 
        - Redirect: The facilitator can ask probing questions during the discussion: "What do you think will happen to the meaning of the other sites if we change the square?" and "How will you ensure that the entire legacy is addressed with only two changes?" Also, if the Archivist sees the group missing the point, they can say: "I have a document that shows these sites are interconnected. Would you like to see it?"

  6. Conclusion (5 minutes):
     - Summarize the key tension: Corrective justice vs. mnemonic displacement. 
     - Emphasize that real-world decisions are more complex and involve multiple stakeholders and emotions.

  Note: The activity is designed so that the mnemonic displacement becomes apparent when the districts associated with the untouched sites (especially the Bridge and Streets B and C) report low comfort because their sites now bear more symbolic weight. 

  Let's design the map with the following connections:
  - Central Square connected to all: Bridge, Street A, Street B, Street C, Street D.
  - Bridge connected to Square, Street B, and Street C.
  - Street A only connected to Square.
  - Street B connected to Square and Bridge.
  - Street C connected to Square and Bridge.
  - Street D only connected to Square.

  When the Square is removed, the Bridge becomes the new hub and the streets connected to it (B and C) become more symbolically charged. The Archivist's document explains this.

  For the predictable failure mode: The group renames the Square and one other (say Street A). Then the Bridge and Streets B, C, D remain. But the Bridge now becomes the central node, and Streets B and C (being connected to the Bridge) become more associated with the Founder. The districts for Street B and Street C (which might not have had strong feelings before) now feel the weight and rate low comfort. The district for Street D might not feel as much because it's isolated. The district for the Bridge (District 2) now has a site that is more symbolically charged, which might harm their businesses (if the Founder is controversial) so they rate low too. 

  This will create tension and show mnemonic displacement.

  Now, let's write the minute-by-minute timeline:

  Minute-by-minute timeline:

  - 0-10 min: Introduction by facilitator (setting the scene, explaining roles, rules, and goals).
  - 10-15 min: Role assignment and preparation. The district groups (already assigned) get together to discuss their stakes. The Archivist and Planner read their instructions.
  - 15-35 min: Group discussion and decision-making (20 minutes). The group works together to rearrange the map. The facilitator circulates and may ask probing questions if they are stuck in the predictable failure mode.
  - 35-40 min: Voting and scoring. The group votes for unanimous agreement (if achieved, city stability=5). Then each district group writes down their comfort rating (1-5) and hands it to the facilitator.
  - 40-75 min: Debrief (35 minutes total):
     - 40-45 min: Reveal outcomes and initial reactions.
     - 45-60 min: Map decisions to concepts. Introduce mnemonic displacement and reveal the Archivist's document. Discuss the tension.
     - 60-70 min: Limitations of the exercise (what we couldn't capture) and an honest admission.
     - 70-75 min: Conclusion and wrap-up.

  This should fit 75 minutes.

  Materials list:
  - Large printed map (with sites and districts marked, and connections shown? Maybe the connections are not shown until the Archivist reveals? The map should not show the connections initially. The Archivist's document has the connection diagram.)
  - Movable labels for each site (with the founder's name and blank ones for new names).
  - Blank cards and markers for new names (if they choose renaming).
  - Role cards for each participant (Archivist, Planner, District Representative for each district, and then residents).
  - The Archivist's hidden document (in a sealed envelope).
  - Timer.
  - Score sheets: one for city stability (with a checkbox for unanimous agreement) and one for each district group to write their comfort rating.
  - Markers, pens.

  This should do.
answer: |-
  ### Workshop Design: "Shifting Shadows: Ethics of Commemoration in Civic Space"  
  **Duration:** 75 minutes  
  **Participants:** 16 undergraduates  
  **Goal:** Experience the tension between *corrective justice* (removing/renaming harmful commemorations) and *mnemonic displacement* (symbolic weight redistributing to adjacent spaces) without explicit instruction.  

  ---

  ### **Materials**  
  1. **Fictional Town Map Poster (3'x3')**:  
     - Six sites: **Founder’s Square** (central plaza), **Founder’s Bridge** (river crossing), and four streets: **Founder’s Street A** (residential), **Founder’s Street B** (commercial), **Founder’s Street C** (educational), **Founder’s Street D** (industrial).  
     - Districts: **North** (Street A), **East** (Street B), **South** (Street C), **West** (Bridge).  
     - *Visual cues*: Square at center; Bridge connects Streets B and C; all sites linked by thin gray lines.  
  2. **Movable Name Cards**: Six cards with "Founder" for sites; blank cards for renaming.  
  3. **Role Sheets**: 1 Archivist, 1 Planner, 4 District Representatives (each with 3 residents).  
  4. **Stakes Cards**: Material interests for each district (e.g., North: "Street A’s name secures heritage tourism grants").  
  5. **Scoring Board**: "City Stability" (unanimous vote) and "District Comfort" (1–5 rating per district).  
  6. **Archivist’s Sealed Envelope**: Contains "Founder’s Network Diagram" showing how sites symbolically interconnect.  

  ---

  ### **Roles & Stakes**  
  - **Archivist**: Holds the sealed envelope. Only reveals the diagram if asked about "connections between sites."  
  - **Planner**: Enforces the **"Two-Changes Rule"** (only two sites can be renamed/removed total).  
  - **District Representatives + Residents** (4 groups of 3–4 students):  
    - **North (Street A)**: Heritage tourism funds tied to Street A’s name.  
    - **East (Street B)**: Business revenue dependent on Street B’s historic branding.  
    - **South (Street C)**: Street C’s name validates a local school’s history curriculum.  
    - **West (Bridge)**: Bridge name essential for infrastructure grants.  
  - *Shared tension*: All districts use Founder’s Square for events, but its prominence fuels discomfort.  

  ---

  ### **Activity Rules**  
  1. **Objective**: Physically rearrange the map in 20 mins (remove/rename up to two sites).  
  2. **City Stability**: Unanimous agreement required for a 5-point score; dissent = 0.  
  3. **District Comfort**: After voting, each district *secretly* rates their outcome (1–5).  
  4. **Mnemonic Displacement Mechanic**:  
     - If **Founder’s Square** is renamed/removed, symbolic weight "migrates" to **Founder’s Bridge** and **two adjacent streets** (B and C, per the Archivist’s diagram).  
     - *Effect*: Districts tied to Bridge/Streets B/C automatically lose 2 comfort points unless compensated (e.g., renaming those sites too—but the Two-Changes Rule limits options).  
     - Migration is *not* pre-announced; groups discover it via comfort scores or Archivist hints.  

  ---

  ### **Minute-by-Minute Timeline**  
  **0–10 min: Introduction**  
  - Facilitator frames the town’s dilemma: Founder was a civic visionary but designed racial exclusion policies.  
  - Assign roles; groups review stakes. Planner and Archivist receive rules.  

  **10–15 min: Strategy Phase**  
  - District groups caucus: What changes protect their interests? Planner announces Two-Changes Rule.  

  **15–35 min: Map Rearrangement & Voting**  
  - Groups debate and physically adjust the map. Movable cards allow renaming (e.g., "Unity Square") or removal.  
  - *Facilitator tip*: If groups rush to rename the Square, ask, "What happens to the *other* sites if the Square changes?"  
  - **Vote at 35 min**: Unanimous agreement needed for City Stability score.  

  **35–40 min: Comfort Rating**  
  - Districts privately rate comfort (1–5) based on outcomes.  

  **40–75 min: Debrief**  
  - **40–50 min: Reveal Outcomes**  
    - Post City Stability score and average District Comfort.  
    - Ask: "What tensions did you feel? Why was unanimity hard?"  
  - **50–60 min: Map Decisions to Concepts**  
    - **Corrective Justice**: "Which changes aimed to 'correct’ harm? Did removal feel like justice?"  
    - **Mnemonic Displacement**: "Why did Districts West/South/East lose comfort? Trace the 'shift'."  
      - *Archivist reveals diagram*: Explains Square’s removal intensified focus on Bridge/Streets B/C.  
    - Facilitator names the tension: "You experienced *mnemonic displacement*—a shadow legacy spreading to untouched sites."  
  - **60–70 min: Limitations & Real-World Complexity**  
    - **Admission**: "This exercise *cannot* capture **monumental scale’s emotional weight**. A real statue’s physical presence—its size, location, artistry—triggers visceral reactions a paper map can’t replicate. A removed statue leaves a palpable void; an untouched one grows more haunting."  
    - Discuss: "How might this change real-world decisions?"  
  - **70–75 min: Predictable Failure & Redirection**  
    - **Failure Mode**: Rapid consensus to rename Square + one street, then paralysis as Bridge/Streets B/C become "tainted" by displacement.  
    - **Redirect**: During debate, prompt: "Can we address harm without unintended consequences? What’s *not* being considered?" If stuck, Archivist asks: "Should we discuss how sites are connected?"  

  ---

  ### **Design Notes**  
  - **Why Mnemonic Displacement Emerges Organically**:  
    - Removing the Square *directly* penalizes Districts West/South/East via comfort scores, forcing groups to infer "invisible redistribution."  
    - Archivist’s diagram remains sealed unless groups ask about "connections," preserving discovery.  
  - **Cross-Pressure Mechanics**:  
    - Unanimity for stability vs. district-level comfort scores creates friction (e.g., renaming Square pleases some but displaces weight, lowering others’ scores).  
  - **Realism Gap Addressed**: By verbally acknowledging monumental scale’s absent aura, the facilitator preempts oversimplification.  
  - **Outcome**: Groups leave feeling the futility of "simple fixes," priming deeper ethical reflection.  

  ---  
  This workshop embeds theory in roleplay, making abstract tensions visceral. The map exercise forces confrontation with displacement’s inevitability—ensuring "justice" and "memory" collide without a tidy resolution.
