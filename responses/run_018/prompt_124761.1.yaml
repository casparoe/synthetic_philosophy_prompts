        - Facilitator notes: "This exercise simplifies reality. One feature we cannot replicate is [choose one, e.g., the aesthetic presence of monumental scale]. In the real world, a statue in a central square has a physical and emotional impact that a paper map cannot capture. Its removal might cause some to feel relief but also might provoke backlash that our exercise doesn't capture. Also, we don't capture the intergenerational trauma that the symbol might evoke, which would make the removal feel more urgent to some and more threatening to others." 
        - The facilitator can also mention that state legitimacy (the government's role in endorsing or removing symbols) is a complex factor that we abstracted away.

