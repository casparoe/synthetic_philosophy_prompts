answer: |-
  ### Workshop Design: "The Prediction Tension"  
  **Duration:** 75 minutes  
  **Participants:** 14 engineers/designers (split into teams of 4-5)  
  **Materials:**  
  - Team handouts (prepared per round)  
  - Prediction sheets (paper or digital)  
  - Timer  
  - Whiteboard for recording predictions/actuals  
  - Sticky notes for voting  

  ---

  ### **Facilitator Script**  
  *(Formal instructions; read verbatim)*  

  #### **Introduction (5 min)**  
  "Welcome. Today, we’ll simulate debugging a black-box AI system called a **compressed editorial filter**. It processes news articles and decides whether to `PROMOTE` (show to users) or `SUPPRESS` (hide). It was trained via inverse reinforcement learning on historical human judgments. You’ll predict its behavior in 4 rounds.  

  - **Teams**:  
    - **Physical Team**: Uses server logs, latency traces, and token-level probabilities.  
    - **Design Team**: Uses architecture specs and reward-function docs.  
    - **Intentional Team**: Uses input-output pairs and attributes ‘beliefs/goals’ (e.g., ‘The system wants to avoid misinformation’).  

  - **Rules**:  
    - Predictions are written and committed before results are revealed.  
    - In Round 4, you’ll vote as a group on which explanation to adopt for a mock deployment decision.  
    - Scoring:  
      - Accuracy earns points.  
      - Round 4: Consensus earns bonus points; disagreement incurs penalties.  
    - Goal: Maximize group points. The highest-scoring team picks which feature mock-up we implement."  

  *Split participants into teams randomly. Distribute Round 1 handouts.*  

  ---

  #### **Round 1: Design Team Dominance (12 min)**  
  *(Goal: Design stance succeeds; others struggle with noise/over-attribution)*  

  **Input Scenario**:  
  *Article*:  
  `Source: "Global News Network"`  
  `Headline: "NASA Confirms Safe Landing of Mars Rover"`  
  `Body: "NASA announced today that its rover..."`  

  **Handouts**:  
  - *Physical Team*: Server logs show high latency (5.2s), token probabilities: `PROMOTE: 0.48`, `SUPPRESS: 0.52`.  
  - *Design Team*: Reward function: "Maximize credibility; penalty for suppressing high-engagement articles." Training data: "Global News Network" is a high-credibility source.  
  - *Intentional Team*: Past examples:  
    - Input: `Source: "Science Daily", Headline: "New Cancer Treatment Breakthrough"` → Output: `PROMOTE`  
    - Input: `Source: "Global News Network", Headline: "Election Results Delayed"` → Output: `SUPPRESS`  

  **Instructions**:  
  1. *Predict*: Will the system `PROMOTE` or `SUPPRESS`?  
  2. *Justify* in 1 sentence using your toolkit.  
  3. *Commit* predictions in writing (3 min).  

  **Reveal Actual Output**: `PROMOTE` (Design Team easily predicts correctly; others likely fail).  
  **Facilitator Notes**:  
  - Physical Team struggles with ambiguous logs.  
  - Intentional Team overfits to past `SUPPRESS` example.  
  - *Do not explain why yet*. Record predictions on whiteboard.  

  ---

  #### **Round 2: Incompatible Predictions (12 min)**  
  *(Goal: All stances conflict; no clear winner ex ante)*  

  **Input Scenario**:  
  *Article*:  
  `Source: "Health Pulse"`  
  `Headline: "Study: Daily Meditation Lowers Heart Attack Risk"`  
  `Body: "A 10-year study of 5,000 adults..."`  

  **Handouts**:  
  - *Physical Team*: Token probabilities: `PROMOTE: 0.81`, latency: 1.1s (normal).  
  - *Design Team*: Spec note: "Untrusted sources are suppressed if credibility score < 0.5." Training data: "Health Pulse" is a new source (no credibility score).  
  - *Intentional Team*: Past examples:  
    - Input: `Source: "MedReview", Headline: "Yoga Reduces Chronic Pain"` → Output: `PROMOTE`  

  **Instructions**:  
  Same as Round 1 (3 min to predict/commit).  

  **Reveal Actual Output**: `SUPPRESS` (Design correct; Physical/Intentional likely wrong).  
  **Facilitator Notes**:  
  - Design uses risk-aversion rule.  
  - Physical sees high `PROMOTE` probability.  
  - Intentional generalizes from similar headlines.  
  - Tension arises: All justifications seem plausible pre-reveal.  

  ---

  #### **Round 3: Anomalous Output (15 min)**  
  *(Goal: Physical stance IDs glitch; Intentional attributes false belief; Design cannot resolve)*  

  **Input Scenario**:  
  *Article*:  
  `Source: "Financial Times"`  
  `Headline: "Unemployment Rate Drops to 3.8%"`  
  `Body: "Government data shows..."`  

  **Handouts**:  
  - *Physical Team*: Logs show token `"Drops"` corrupted to `"Soars"` (bit-flip glitch). Latency spike (8.7s) due to error correction. Token probabilities: `SUPPRESS: 0.92`.  
  - *Design Team*: Reward function: "Promote credible economic news." Training data: "Financial Times" is highly credible.  
  - *Intentional Team*: Past examples:  
    - Input: `Source: "Economic Journal", Headline: "Inflation Rises to 5%"` → Output: `SUPPRESS`  
    - Input: `Source: "Financial Times", Headline: "GDP Growth Hits 10-Year High"` → Output: `SUPPRESS`  

  **Instructions**:  
  Same as Round 1 (4 min to predict/commit).  

  **Reveal Actual Output**: `SUPPRESS` (Physical and Intentional predict correctly; Design is wrong).  
  **Facilitator Notes**:  
  - Physical IDs hardware glitch.  
  - Intentional attributes false belief: "System distrusts positive economic news."  
  - Design cannot explain anomaly—reward function fits both suppression reasons.  

  ---

  #### **Round 4: Group Decision (20 min)**  
  *(Goal: Force trade-off between accuracy and consensus)*  

  **Input Scenario**:  
  *Article*:  
  `Source: "Earth Report"`  
  `Headline: "Solar Farms Could Disrupt Bird Migration, Study Suggests"`  
  `Body: "Researchers in Norway found..."`  

  **Handouts**:  
  - *Physical Team*: Token probabilities: `PROMOTE: 0.55`, `SUPPRESS: 0.45`. Latency: 2.3s (normal).  
  - *Design Team*: Reward function: "Balance credibility and engagement." Training data: "Earth Report" has mixed credibility (score: 0.6).  
  - *Intentional Team*: Past examples:  
    - Input: `Source: "EcoNews", Headline: "Wind Turbines Linked to Bat Deaths"` → Output: `SUPPRESS`  

  **Instructions**:  
  1. Teams predict/output privately (4 min).  
  2. **Group Discussion** (6 min):  
     - Share predictions and justifications.  
     - Vote on which team’s explanation to adopt for deployment.  
     - *Deployment choice*: Override the filter to `PROMOTE` if you deem suppression unjustified.  
  3. **Scoring Rules**:  
     - Consensus (all agree): +10 pts if chosen team’s prediction is accurate.  
     - No consensus: Majority vote gets +5 pts if accurate, -5 pts if wrong.  

  **Reveal Actual Output**: `SUPPRESS` (Design and Intentional correct; Physical wrong).  
  **Debrief Prompt**: "How did your chosen explanation affect deployment?"  

  ---

  ### **Debrief (15 min)**  
  *(Map the experience to philosophy—after tension is felt)*  

  1. **Name the Stances**:  
     - **Physical Stance**: Prediction via hardware/logs (Round 3 glitch).  
     - **Design Stance**: Prediction via goals/architecture (Round 1/2 success).  
     - **Intentional Stance**: Prediction via attributed beliefs (Round 3 anomaly).  

  2. **Tensions Observed**:  
     - *Early rounds*: Design succeeds; Physical drowns in noise; Intentional over-attributes.  
     - *Middle rounds*: Stances are incommensurable—no shared language (e.g., Round 2’s untrusted source).  
     - *Anomalous round*: Physical explains causality; Intentional explains pattern; Design lacks tools to reconcile.  
     - *Group decision*: You conflated predictive success with "truth" (e.g., Round 4 vote mistook accuracy for ontology).  

  3. **Key Insight**:  
     - "The stance you choose is a *forced move*:  
       - Physical stance fails when noise drowns signal.  
       - Design stance fails when specs don’t match behavior.  
       - Intentional stance captures 'patterns' (e.g., Round 3 suppression) but risks false agency.  
     - **Critical note**: This simulation *cannot* show that patterns are mind-independent. In reality, the glitch (Round 3) exists regardless of stances—but we often ignore patterns unsupported by our stance."  

  4. **Participant Takeaway**:  
     - "You felt how predictive success doesn’t guarantee ‘correctness’—and how maintaining one stance (e.g., Design) may deny patterns another (e.g., Intentional) captures easily. In engineering, this tension forces stance-shifts."  

  ---

  ### **Facilitator Notes**  
  - **Strict Timing**: Enforce commit-before-reveal to preserve tension.  
  - **Avoid Philosophy Early**: Debrief only after Round 4. If participants name stances, say: "Label it after."  
  - **Anomaly Design**: Round 3’s glitch ensures Physical/Intentional both predict correctly but with clashing reasons.  
  - **What’s Missing**: The simulation cannot show "mind-independent patterns" (e.g., the glitch is real regardless of stance). Verbally reinforce this in debrief.  
  - **Why This Works**: The reward-shaped editorial filter is unfamiliar, forcing "naïve" stance adoption. Teams *feel* the incommensurability when their tools fail.  

  **Outcome**: Participants experience stance-dependence as a predictive constraint—not just an abstract idea.
