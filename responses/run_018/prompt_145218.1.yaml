  First I need to clarify what "genuine incommensurability" means here - it seems they're referring to values that can't be reduced to a common metric, like ecological integrity vs distributive justice. The core tension appears between admitting incomparability while preserving rationality. 

  For part (a), I lean toward believing incommensurability exists based on philosophical work by Raz and others, though operationalizing it empirically is tricky. Maybe 70% confidence feels right since most ethical systems acknowledge some irreducible values.

  Part (b) is more contentious. The user's phrasing suggests they assume incommensurability prevents direct comparison, but I recall Berlin's value pluralism allows rational choices without commensuration. Should note that institutional contexts might enable comparison they'd consider "indirect". 60% seems appropriate to reflect this ambiguity.

  On (c), the orthogonal value proposal is elegant but risky - it could secretly reintroduce commensuration. Procedural solutions work in practice (like Rawls' veil of ignorance), but whether they truly preserve incommensurability is debatable. 55% captures my hesitation.

  For (d), singling out procedural fairness feels too narrow. Expected utility often functions as the hidden scale they're trying to avoid, but sometimes it's unavoidable. Other second-order values like consent or integrity could also play this role. Hence low 30% confidence.

  The biggest uncertainty clearly lies in (c) - whether any "orthogonal" mechanism can avoid being a Trojan horse for commensuration. A concrete case study where proceduralism resolves incommensurability without implicit weighting would be most convincing.

  The user seems philosophically sophisticated, likely familiar with value pluralism debates. Their unspoken need might be validating whether their framework escapes utilitarianism while preserving rationality - a delicate balance I should acknowledge in the probabilities.
answer: |-
  1.  (a) Genuinely incommensurable values exist (e.g., distinct moral spheres like justice vs. beauty): **Credence ~75%**, reflecting widespread philosophical acceptance (e.g., Raz, Berlin) despite measurement challenges.  
  2.  (b) Incommensurability blocks *direct* rational comparison via a single scale or cardinal weighting: **Credence ~60%**, as while holistic judgment exists, strict incommensurability precludes quantitative trade-offs.  
  3.  (c) An orthogonal second-order value (e.g., fairness) *can* enable rational choice without collapsing incommensurability: **Credence ~55%**, as it's plausible but risks smuggling in implicit weighing; this is the **dominant source of uncertainty**.  
  4.  (d) Procedural fairness specifically (vs. expected utility) is the value that performs this orthogonal tie-breaking role: **Credence ~30%**, as expected utility often *assumes* commensurability, but other values (e.g., consent, integrity) could also function this way.  
